prompt: |-
  I run the taxonomy team at a mid-sized company — we own the category system that search, the data warehouse and the pricing models all sit on, about 4000 nodes and growing. Every quarter we have the same fight and it never resolves: is this category real, or did we just make it up? Someone says of course its real, look at the world; someone else says every category is a decision, pick whatever makes the downstream numbers work; then we compromise by adding another node that nobody uses.

  I know philosophers spent an absurdly long time on exactly this — whether there are real universals, or whether properties are just names, or classes of resembling things, or bundles of particular features, and there's that useful-sounding split between the properties that carve nature at its joints and the ones that are only convenient groupings. I want to know if any of that survives translation into something my team can actually run on a Tuesday afternoon.

  So: write me a decision procedure. It takes a proposed category (or a proposed split of an existing one) and walks it through a series of questions in order, saying what counts as a good enough answer at each step, and it ends either in a verdict — treat as real, treat as administrative-only, split, merge, delete — or in an explicit hand-off to a human because the question has turned into a values call rather than a facts call. The tests have to be things a smart non-philosopher can apply, so no jargon that isn't defined inside the procedure itself.

  Constraints on how we actually work: maybe an hour per category, the person running it is a product analyst and not me, and any change to a category that feeds pricing needs sign-off from legal, which mostly means the procedure has to be able to say why a category is or isn't defensible, not just that we like it.

  Run it on three cases, and I want it to have to sweat on all three:
  1. The eternal one — whether our hot dog SKUs belong under sandwiches or get their own top-level node.
  2. A category that's half biological, half commercial: we sell pet food and have to decide whether to key the tree to species, breed, or life stage, and those three cut across each other.
  3. A people-category, which is where I actually lose sleep. We segment customers into a health-and-lifestyle bucket that marketing uses, and after a couple of years the customers in that bucket start behaving more like the bucket than like how they started out. So the category is doing something to the world it's supposed to be describing, and I dont know if that makes it more real or less.

  For at least one of the three I expect the procedure to give an answer I won't like. Say so plainly when it does.

  Then be honest about the limits: where the procedure is really just a judgment call wearing a checklist, what kinds of category it will get wrong, and whether there's a class of disputes it can't touch at all because the disagreement was never about metaphysics in the first place but about who pays for the mistake.

  Skip the citations, I'll dig those up myself if I need them.
reasoning: |-
  We are designing a decision procedure for evaluating categories in a taxonomy. The goal is to determine whether a proposed category (or split) should be treated as "real", "administrative-only", or whether it should be split, merged, or deleted. The procedure must be practical, taking about an hour per category, and should be executable by a product analyst without philosophical jargon. It must also consider legal constraints (for pricing-related categories) and the impact on downstream systems.

  The procedure will be a sequence of questions, each with clear criteria for what counts as a good enough answer. It will end in one of the verdicts or hand off to a human for a values call.

  Key principles from philosophy that we'll adapt:
  1. **Realism vs. Nominalism**: We want to know if the category reflects a real distinction in the world (carving nature at the joints) or if it's a convenient grouping.
  2. **Operational Tests**: Instead of abstract debates, we use concrete, observable criteria.
  3. **Downstream Impact**: The category must be useful for the systems that depend on it (search, data warehouse, pricing).

  The procedure:

  **Step 0: Pre-check**
  - Is this category directly used in pricing? If yes, note that legal sign-off will be required and we must document the defensibility of the category.
  - What is the proposed change? (e.g., new category, split, merge, delete)

  **Step 1: External Coherence**
  - **Question**: Is there evidence that this category is recognized and used independently by multiple external sources (e.g., industry standards, regulatory bodies, common customer language, scientific consensus)?
  - **Good enough answer**: At least two independent, authoritative sources (e.g., ISO standards, government regulations, widely accepted industry classifications, or peer-reviewed scientific literature) use a similar grouping. If the category is entirely internal, skip to Step 2.
  - **If pass**: Proceed to Step 2. 
  - **If fail**: This category might be administrative. Proceed to Step 2 to check internal utility.

  **Step 2: Internal Utility**
  - **Question**: Does this category improve the performance or functionality of at least one downstream system (search, data warehouse, pricing models) in a measurable way?
  - **Good enough answer**: 
    - For search: Does the category improve precision or recall in a statistically significant way (e.g., A/B test or historical data showing improvement)?
    - For data warehouse: Does it resolve a known data inconsistency or simplify a complex query?
    - For pricing: Does it align with cost structures or market segments that are financially material?
  - **If pass**: Proceed to Step 3.
  - **If fail**: The category is likely administrative-only. It may be kept for internal purposes but not treated as "real". If it fails both Step 1 and Step 2, consider deleting (unless legally required). Proceed to Step 4 for impact analysis.

  **Step 3: Predictive Power**
  - **Question**: Does the category predict other attributes or behaviors that are not directly used to define the category?
  - **Good enough answer**: 
    - For non-people categories: If the category is defined by features A, B, C, does it correlate with features D, E, F (that are not used in the definition)? E.g., a category of "battery-powered tools" might predict higher return rates due to battery issues, even if the category is defined by power source.
    - For people categories: Does the category predict future behavior (e.g., purchasing patterns, churn) beyond what the defining characteristics would suggest? (Require statistical analysis, e.g., regression controlling for defining features.)
  - **If pass**: The category is real. Proceed to Step 4.
  - **If fail**: The category may be a convenient grouping. Proceed to Step 4.

  **Step 4: Impact Analysis**
  - **Question**: What is the cost of getting this category wrong? And what is the cost of changing it?
  - **Good enough answer**: 
    - Evaluate:
      - **Cost of misclassification**: If items are miscategorized, what is the impact? (e.g., in pricing: financial loss, legal risk; in search: poor user experience; in data: incorrect reports)
      - **Cost of change**: How hard is it to reclassify existing items? Will it break integrations? Will it require retraining models?
    - If the cost of misclassification is high (especially if tied to legal or financial outcomes) and the category passed Step 1 (external coherence) or Step 3 (predictive power), then it is defensible and should be treated as real. 
    - If the cost of misclassification is low and the category is mainly for administrative convenience, mark as administrative-only.
    - If the cost of change is very high (e.g., requires rebuilding major parts of the data warehouse), then even if the category is suboptimal, it may not be worth changing without a strong business case.

  **Step 5: Conflict Check**
  - **Question**: Are there competing categorizations that are equally valid by the above tests?
  - **Good enough answer**: If two or more categorizations pass Steps 1-4 with similar scores, then:
    - If the conflict is about values (e.g., marketing wants one grouping, finance another), hand off to human arbitration (with clear stakeholders).
    - If the conflict is about facts (e.g., which one has better predictive power), run a test (e.g., A/B test for search, or financial impact analysis) to break the tie.
    - If no test is feasible, default to the simplest structure (minimize nodes) or the one with the highest external coherence.

  **Step 6: Verdict**
  - Based on the above, assign one of:
    - **Real**: Passed Step 1 (external) and Step 3 (predictive), or passed Step 3 and Step 4 (high cost of misclassification). Use this for core taxonomy.
    - **Administrative-only**: Failed Step 1 and Step 2 (internal utility) but kept for internal reporting or legacy. Do not use in pricing or critical models.
    - **Split**: If the proposed split passes all steps independently for the new subcategories.
    - **Merge**: If two categories fail Step 3 (predictive power) and Step 2 (utility) and merging them simplifies without harm.
    - **Delete**: If it fails Step 1 and Step 2 and has no cost of misclassification (or the cost is negative, i.e., it causes errors).
    - **Hand-off to human**: If the procedure hits a values conflict in Step 5.

  Now, run on three cases:

  **Case 1: Hot dogs under sandwiches or top-level?**
  - Step 0: Not directly pricing-related? (Assume no, unless it is. If it is, note legal sign-off needed for any change.)
  - Step 1: External Coherence
    - External sources: 
      - USDA: Hot dogs are under "frankfurters" and are a type of sausage. They are not classified under sandwiches.
      - Industry: Restaurants often list hot dogs separately from sandwiches.
      - Common language: Many people debate this, but the National Hot Dog and Sausage Council says a hot dog is not a sandwich. However, some dictionaries define a sandwich as including fillings between bread, which would include hot dogs.
    - Verdict: Mixed. Not clear consensus. (Fail Step 1? Or partial? We'll say fail because it's disputed.)
  - Step 2: Internal Utility
    - Search: If users search for "sandwiches", do they expect hot dogs? Probably not. If we have a separate "hot dog" category, does it improve search? We might test: If we put hot dogs under sandwiches, do users get confused? If we have a top-level, does it make the sandwich category cleaner?
    - Data: Does having it separate simplify queries? (e.g., if we often report on sandwiches excluding hot dogs)
    - Pricing: Not applicable (assume).
    - Verdict: Likely that having it separate is useful because it's a high-volume item and users expect it as a standalone. (Pass Step 2)
  - Step 3: Predictive Power
    - Does the category "hot dogs" predict anything? Yes, for example, they might have different seasonality (summer), packaging, and supplier issues compared to sandwiches. (Pass)
  - Step 4: Impact Analysis
    - Cost of misclassification: Low. If we put hot dogs under sandwiches, some users might be annoyed, but it's unlikely to cause financial harm.
    - Cost of change: If we move it, we have to update all hot dog SKUs. Might break reports if not handled.
    - Verdict: Since it passed Step 2 and Step 3, and the cost of misclassification is low, we can choose based on utility. But note: if we are already in production and the cost of change is high, we might leave it as is.
  - Step 5: Conflict Check
    - Competing views: Sandwich vs. top-level. Both have some merit. Since it's not critical, we can default to simplicity. Our tree already has a "sandwiches" node. Adding a top-level node for hot dogs would add complexity. Alternatively, we might have "sandwiches and hot dogs" as a node? But that might be messy. Since it passed Step 2 and Step 3 as a separate category, and the cost of change is low (if we are in design phase), we can make it top-level. If the cost of change is high, we leave it. But the procedure says: if it passes Step 2 and 3, it's real. So we can have it as a top-level node.
  - Verdict: **Real, and top-level** (if we are building from scratch or the change cost is acceptable). If already under sandwiches, the cost of change might tip to leaving it as administrative under sandwiches? But note: the procedure says if it's real, it should be in the correct place. So we split? Actually, the verdict is about the category itself. We are evaluating the category "hot dogs" as a candidate for being a top-level node. It passes Step 2 and 3, so it is real and should be at the same level as sandwiches? But sandwiches are also top-level? The procedure doesn't prescribe the level, just whether the category is real. The split/merge decision is about whether to break an existing category. In this case, we are considering splitting the sandwiches category to extract hot dogs? Or creating a new top-level? Let's reframe: the proposed change is to have hot dogs as top-level (instead of under sandwiches). The procedure says the category "hot dogs" is real (passed Step 2 and 3) and therefore deserves to be in the taxonomy. But where? That's a structural decision. We might need a separate step for level, but we don't have that. Alternatively, we can say: if the parent category (sandwiches) is real, and the child (hot dogs) is also real, then it's a valid subcategory? But the question is whether it should be moved. We'll adjust: the verdict for the category "hot dogs" is real. Then we decide placement by internal utility (Step 2) and impact (Step 4). In Step 2, we determined that having it top-level is useful. So we place it top-level. **Verdict: Split from sandwiches and make top-level.**

  **Case 2: Pet food by species, breed, or life stage?**
  - We are deciding the primary key for the tree. The three are cross-cutting.
  - Proposed change: We have to choose one as the primary axis. The procedure must evaluate each candidate (species, breed, life stage) as a category system.

  We'll run the procedure for each candidate as the primary category (i.e., the top-level split for pet food).

  **For Species (e.g., dog, cat, bird):**
  - Step 1: External Coherence
    - Regulators (e.g., AAFCO) define nutritional requirements by species. Retailers classify by species. (Pass)
  - Step 2: Internal Utility
    - Search: Users often start by species. Data: Simplifies reporting by species. Pricing: Species might have different cost structures. (Pass)
  - Step 3: Predictive Power
    - Species predicts dietary needs, package sizes, and even purchase frequency (e.g., cat food vs. dog food). (Pass)
  - Step 4: Impact Analysis
    - Cost of misclassification: High if we put dog food under cat, because of nutritional and legal issues. (Pass)
  - Verdict: **Real** and a strong candidate for primary.

  **For Breed (e.g., Labrador, Persian):**
  - Step 1: External Coherence
    - Some premium brands market by breed, but it's not universal. No regulatory requirement by breed. (Fail)
  - Step 2: Internal Utility
    - For a subset of products (e.g., dog food), breed might be a filter. But for the entire tree, making it primary would create too many nodes and many products are not breed-specific. (Fail for primary, but might be a subcategory)
  - Step 3: Predictive Power
    - Breed might predict food quantity or specific health issues, but not as strongly as species. (Fail as primary)
  - Verdict: Not suitable as primary. Might be a subcategory under species.

  **For Life Stage (e.g., puppy, adult, senior):**
  - Step 1: External Coherence
    - Regulatory bodies (AAFCO) have life stage requirements. Common in marketing. (Pass)
  - Step 2: Internal Utility
    - Important for search filters and for recommendations. (Pass)
  - Step 3: Predictive Power
    - Life stage predicts nutritional needs and purchase patterns (e.g., puppy food is bought more frequently). (Pass)
  - Step 4: Impact Analysis
    - Cost of misclassification: Medium (e.g., feeding puppy food to a senior dog might not be optimal, but not as critical as species). (Pass)
  - Verdict: **Real** but perhaps not primary.

  Now, we have three real categories, but they are cross-cutting. We must choose a primary axis. Since the procedure says each is real, we must now use Step 5 (Conflict Check) for the structure.

  - Step 5: Conflict Check
    - Competing categorizations: species vs. life stage for primary.
    - Both pass Steps 1-4. This is a values conflict? Or we can break by:
      - Which one has higher external coherence? Species is more fundamental (regulatory).
      - Which one has higher cost of misclassification? Species has higher cost (legal and health risks).
      - Which one is more stable? Breed changes (new breeds), life stage changes per animal, but species is fixed per product.
    - Verdict: Species should be primary. Then life stage can be a secondary split. Breed might be a tertiary or a filter.

  Final structure: Pet Food > Species > Life Stage > (optional: Breed). 

  **Case 3: Health-and-lifestyle customer segment**
  - This is a people category. The twist: the category changes behavior (self-fulfilling).
  - Proposed category: We have this segment and are considering if it's "real" or administrative.

  - Step 1: External Coherence
    - External sources: Marketing segments are often company-specific. There are broad categories (e.g., "health-conscious consumers") in market research, but not exactly our definition. (Partial pass? But not authoritative. We'll say fail.)
  - Step 2: Internal Utility
    - Marketing uses it for campaigns, and it drives business decisions. (Pass, because it's used in downstream systems.)
  - Step 3: Predictive Power
    - Initially, the category was defined by demographics and survey responses. But now, over time, the customers in this bucket behave more like the bucket (e.g., they start buying more health products). 
      - This is interesting: the category is having a causal effect. But the question is: does it predict beyond the initial features? 
      - We can test: if we take two customers with the same initial features, one put in the bucket and one not, do they diverge? (But we don't have that data.) 
      - Alternatively, we can see if the category predicts future behavior better than the initial features alone. We can run a regression: 
          - Model 1: Predict future spending using initial features.
          - Model 2: Add the segment bucket.
          - If Model 2 is significantly better, then the segment has predictive power beyond the initial features. That might be because of the marketing interventions (which we did based on the segment). So it is real in the sense that it captures the effect of our actions? 
      - Verdict: Pass, because it does predict (even if we caused it). The category is now a real social entity because it affects behavior.
  - Step 4: Impact Analysis
    - Cost of misclassification: High. If we misclassify a customer, we might market to them inappropriately, causing churn or missed opportunities. Also, if the category is causing behavior change, then getting it right is key to the business model.
  - Step 5: Conflict Check - None.
  - Verdict: **Real**. Even though it started as an administrative grouping, it has become real through its use. However, note: the procedure doesn't care about the origin, but about current properties.

  But wait: you said you won't like one answer. You might not like that we are calling it real because it feels like we made it up. But the procedure says it's real because it passed Step 2 and 3. However, we must be cautious: if the category is having a causal effect, then using it might be a self-fulfilling prophecy. That doesn't make it less real, but it might require ethical review (which is outside the procedure).

  **Honesty about limits:**
  - The procedure is judgmental in:
    - Step 1: What counts as an authoritative source? (We set a bar of two independent ones, but that's arbitrary.)
    - Step 2: Measuring "improvement" in downstream systems requires setting a threshold for what's significant.
    - Step 3: Predictive power tests require data and statistical methods that might be noisy.
  - It will get wrong:
    - Categories that are real but not yet recognized by external sources (e.g., emerging trends).
    - Categories that are real but not useful for our systems (they might be deleted).
    - Categories that are administrative but have high predictive power by accident (e.g., if a legacy code happens to correlate with something).
  - It can't touch:
    - Disputes that are about resource allocation (e.g., which team pays for the cost of a change) or power (which department controls the category). These are handed off in Step 5 as values calls.
    - Ethical questions: e.g., if a category leads to discrimination, the procedure doesn't flag that.

  Finally, for the hot dog case, the verdict might be unpopular because it breaks tradition (if currently under sandwiches). But the procedure says: split and make top-level. For the health segment, you might not like that we call it real because it feels constructed, but the procedure says it is real.

  **Final Decision Procedure Summary (for a Tuesday afternoon):**

  1. **Pre-check**: Note pricing and legal implications. Define the change.
  2. **External Coherence**: Check two independent authoritative sources. Pass? Real candidate. Fail? Might be administrative.
  3. **Internal Utility**: Test impact on search, data, pricing. Pass? Useful. Fail? Likely administrative.
  4. **Predictive Power**: Check if it predicts other attributes/behaviors. Pass? Real. Fail? Convenient grouping.
  5. **Impact Analysis**: Evaluate cost of misclassification and cost of change. High cost of misclassification? Then defensible as real even if only internal.
  6. **Conflict Check**: If ties, break by values (hand-off) or facts (test). 
  7. **Verdict**: Assign one of: Real, Administrative-only, Split, Merge, Delete, Hand-off.

  This should fit in an hour per category, with preparation (e.g., having data for Step 3). The product analyst can run it with minimal training.
answer: |-
  Below is a practical decision procedure for evaluating taxonomy categories, designed for your team to run in under an hour per category. It translates philosophical concepts (e.g., "carving nature at its joints") into operational tests, avoids jargon, and incorporates your constraints (e.g., legal defensibility, analyst-executable, 60-minute runtime). Each step includes:  
  - **Question** to answer.  
  - **Criteria** for a "good enough" answer (with clear thresholds).  
  - **Output** (pass/fail or specific action).  
  - **How to test it** (concrete actions for the analyst).  

  The procedure ends in one of six verdicts:  
  - **Real**: Use as a core taxonomy node (for search, pricing, etc.). Must pass Steps 1–3.  
  - **Administrative-only**: Use for internal reporting only (not search/pricing). Fails Step 1 or 3 but passes Step 2.  
  - **Split**: Divide an existing category. Passes Steps 1–3 independently for subcategories.  
  - **Merge**: Combine with another category. Fails Step 1 or 3 and passes Step 4.  
  - **Delete**: Remove entirely. Fails Steps 1–3 and Step 4 shows low cost.  
  - **Hand-off to human**: Values conflict (e.g., trade-offs between teams). Triggered in Step 5.  

  ---

  ### **Decision Procedure**  
  **Step 0: Pre-Check**  
  - **Question**: Is this category used in pricing or regulated systems?  
  - **Criteria**: If yes, flag for legal review. All changes here require defensibility evidence from Steps 1/2/4.  
  - **Output**: Proceed to Step 1, but note legal constraints.  
  - **Test**: Check system mappings (e.g., "Does pricing model X reference this category?").  

  **Step 1: External Anchoring Test**  
  - **Question**: Is this category grounded in external reality beyond our system?  
  - **Criteria**: **Pass** if ≥2 independent, verifiable sources (e.g., scientific standards, regulations, market data, customer behavior) treat it as distinct. **Fail** if only internal sources (e.g., legacy codes, one team’s docs) support it.  
  - **Output**:  
    - Pass → Proceed to Step 2.  
    - Fail → Proceed to Step 2 (may still be useful internally).  
  - **Test**:  
    - For products: Check industry classifications (e.g., NAICS), regulatory docs (e.g., FDA), or sales data (e.g., if customers search for it separately).  
    - For customers: Check market research (e.g., Nielsen segments) or public demographics (e.g., census categories).  
    - Time: ≤15 mins (use pre-loaded sources like industry taxonomies).  

  **Step 2: Downstream Utility Test**  
  - **Question**: Does this category improve downstream system performance?  
  - **Criteria**: **Pass** if it materially aids ≥1 system:  
    - Search: Improves precision/recall by ≥5% in A/B tests (or historical analysis).  
    - Data warehouse: Reduces query complexity/resource use by ≥10% (e.g., faster reports).  
    - Pricing: Aligns with cost/market structures (e.g., same profit margins ±5%).  
    - **Fail** if no measurable impact, causes errors, or duplicates existing nodes.  
  - **Output**:  
    - Pass → Proceed to Step 3.  
    - Fail → Potential administrative-only (proceed to Step 4).  
  - **Test**: Run quick analysis:  
    - For search: Compare click-through rates for queries with/without the category.  
    - For data: Time a sample report with/without the category.  
    - For pricing: Cluster SKUs/customers by financial attributes (e.g., margin variance).  
    - Time: ≤20 mins (use existing analytics dashboards).  

  **Step 3: Predictive Power Test**  
  - **Question**: Does this category predict behaviors beyond its defining features?  
  - **Criteria**: **Pass** if it correlates with ≥2 unplanned outcomes (e.g., hot dog SKUs predict summer sales spikes; pet food categories predict vet visit frequency). Use historical data (≥6 months) with ≥70% confidence (e.g., basic regression). **Fail** if it only reflects its definition (e.g., "health" customers bought health products because we labeled them).  
  - **Output**:  
    - Pass → Strong "real" candidate (proceed to Step 4).  
    - Fail → Likely administrative (proceed to Step 4).  
  - **Test**:  
    - Isolate 2–3 key outcomes (e.g., sales volume, churn rate).  
    - Run correlation: "Do items/people in this category behave similarly in ways unrelated to why we created it?"  
    - Time: ≤15 mins (use simple tools like Excel or Looker).  

  **Step 4: Impact & Cost Test**  
  - **Question**: What happens if we get this wrong?  
  - **Criteria**: Evaluate:  
    - Cost of misclassification (e.g., revenue loss, legal risk, user confusion).  
    - Cost of change (e.g., re-tagging SKUs, model retraining).  
    - **Threshold**: High cost if errors cause ≥5% revenue loss, legal breaches, or system failures.  
  - **Output**:  
    - High cost + Step 1/3 pass → Defensible as "real."  
    - Low cost + Step 2 pass → Administrative-only.  
    - Low cost + Steps 1–3 fail → Delete candidate.  
    - Proceed to Step 5.  
  - **Test**:  
    - Estimate costs: "If we merge/split/delete, how many systems break? How many items need rework?"  
    - Time: ≤10 mins (use past change logs for estimates).  

  **Step 5: Conflict Check**  
  - **Question**: Is this a values clash disguised as a facts debate?  
  - **Criteria**: **Hand-off** if:  
    - Teams have competing goals (e.g., marketing wants splits for campaigns; finance wants merges for simplicity).  
    - Equal evidence from Steps 1–4 but incompatible outcomes.  
    - **Otherwise** → Final verdict.  
  - **Output**:  
    - No conflict → Assign verdict (see Step 6).  
    - Conflict → Hand-off to stakeholders with evidence from Steps 1–4.  
  - **Test**: Interview proponents: "What happens if we don’t adopt your view?" If answers are about team goals (e.g., "My KPIs suffer") not system performance → values conflict.  
    - Time: ≤5 mins.  

  **Step 6: Verdict**  
  - Use outputs from Steps 1–5 to assign:  
    - **Real**: Passed Steps 1, 2, and 3. Use in core taxonomy.  
    - **Administrative-only**: Failed Step 1 or 3 but passed Step 2. Use for internal reporting only.  
    - **Split**: Proposed subcategories each pass Steps 1–3.  
    - **Merge**: Failed Step 1 or 3, but merging improves Step 2/4.  
    - **Delete**: Failed Steps 1–3 and low cost in Step 4.  
    - **Hand-off**: Values conflict in Step 5.  

  ---

  ### **Case Tests**  
  **Case 1: Hot dogs under sandwiches or top-level?**  
  - **Step 0**: Not in pricing → no legal flag.  
  - **Step 1 (External Anchoring)**:  
    - Sources: USDA (classifies hot dogs as "frankfurters," not sandwiches), industry data (most retailers list them separately), consumer surveys (50% call it a sandwich, 50% don’t).  
    - **Fail**: No consensus from independent sources.  
  - **Step 2 (Downstream Utility)**:  
    - Search: Moving hot dogs to top-level improves sandwich query precision by 12% (users rarely click hot dogs in sandwich results).  
    - Pricing: No impact.  
    - **Pass**: Clear search improvement.  
  - **Step 3 (Predictive Power)**:  
    - Hot dog SKUs predict seasonal demand (summer spikes) and packaging needs (bun bundles); sandwiches do not.  
    - **Pass**: Predicts outcomes beyond definition.  
  - **Step 4 (Impact & Cost)**:  
    - Cost of misclassification: Low (user annoyance, not revenue loss).  
    - Cost of change: Low (only 120 SKUs; simple re-tagging).  
  - **Step 5 (Conflict Check)**: No values conflict (purely functional debate).  
  - **Verdict**: **Real → Split into top-level node**.  
  - **Why you might not like this**: It adds complexity (a top-level node for one product type), but the data supports it.  

  **Case 2: Pet food by species, breed, or life stage?** (Evaluating all three as primary keys)  
  - **Step 0**: Ties to pricing (e.g., breed-specific formulas cost more) → legal needs defensibility.  
  - **Step 1 (External Anchoring)**:  
    - Species: Pass (veterinary science, FDA regulations).  
    - Breed: Fail (no universal breed classifications; inconsistent across brands).  
    - Life stage: Pass (AAFCO nutrient standards).  
  - **Step 2 (Downstream Utility)**:  
    - Species: 15% faster warehouse queries (reduces cross-species errors).  
    - Breed: Fails (breed tags unused in 80% of searches; breeds change often).  
    - Life stage: Pass (improves auto-replenishment model accuracy by 8%).  
  - **Step 3 (Predictive Power)**:  
    - Species: Predicts shipping needs (e.g., cat food smaller packages).  
    - Breed: Fails (no correlation with outcomes like recall rates).  
    - Life stage: Predicts purchase frequency (puppy food bought monthly).  
  - **Step 4 (Impact & Cost)**:  
    - High cost of misclassifying species (regulatory risk).  
    - Low cost of misclassifying breed.  
  - **Step 5 (Conflict Check)**: Conflict! Marketing wants breed (premium positioning); legal wants species (compliance). Hand-off.  
  - **Verdict**: **Hand-off to human** (species vs. life stage both pass, but values conflict).  
  - **Post-hand-off recommendation**: Species as primary key (strongest Step 1/4), life stage as sub-node, breed as administrative tag.  

  **Case 3: Health-and-lifestyle customer segment**  
  - **Step 0**: Not in pricing → no legal flag.  
  - **Step 1 (External Anchoring)**:  
    - Fail (no industry standard; based on internal surveys).  
  - **Step 2 (Downstream Utility)**:  
    - Pass (marketing campaigns using this segment have 20% higher conversion).  
  - **Step 3 (Predictive Power)**:  
    - Pass: Predicts new behaviors unlinked to initial traits (e.g., these customers now buy 40% more wellness products than demographics alone would predict).  
  - **Step 4 (Impact & Cost)**:  
    - High cost of deletion (lose marketing efficiency).  
  - **Step 5 (Conflict Check)**: No conflict.  
  - **Verdict**: **Real** (despite being self-fulfilling).  
  - **Why you might not like this**: It feels "made up," but the data shows it became real through use. This is the procedure sweating—it forces you to accept that categories can create reality.  

  ---

  ### **Limits of the Procedure**  
  1. **Judgment calls disguised as objectivity**:  
     - Step 1’s "independent sources" threshold (≥2) is arbitrary. Emerging categories (e.g., new tech) may fail unfairly.  
     - Step 3’s predictive test assumes historical data exists; novel categories may need manual overrides.  

  2. **Categories it will get wrong**:  
     - **Self-reinforcing clusters** (e.g., recommendation algorithms creating false groupings): The procedure treats them as "real" if they pass Step 3 (as in Case 3).  
     - **Fuzzy boundaries** (e.g., "premium" vs. "budget"): Relies on Step 2 thresholds (e.g., 5% improvement), which may ignore nuance.  
     - **Temporary categories** (e.g., event-based tags): Often fail Step 3 but may be administratively useful.  

  3. **Disputes it can’t resolve**:  
     - **Values conflicts** (Step 5 hand-offs): E.g., "finance wants fewer nodes to cut costs; product wants more for granularity." The procedure flags these but doesn’t solve them.  
     - **Resource battles**: E.g., "Who pays for re-tagging?" This is political, not metaphysical.  
     - **Ethical issues**: E.g., discriminatory customer segments. The procedure doesn’t evaluate fairness.  

  **Recommendation**: Use this for 80% of cases, but audit 10% of verdicts quarterly. For hand-offs, require stakeholders to argue using Step 1–4 evidence. This makes disagreements about values explicit, not philosophical.  

