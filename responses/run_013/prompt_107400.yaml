answer: |-
  Your position is both sophisticated and unsettling—a keen reading of Moral Foundations Theory (MFT) as a symmetrical debunker of moral truth-claims. It’s a view that deserves serious pressure, and I’ll try to apply it where it seems most vulnerable, moving from what strikes me as the most decisive challenge inward to the more contingent or defensible elements.  

  The most profound threat comes from **self-undermining**. If MFT’s symmetric debunking holds—that all moral reasoning is the post-hoc rationalization of evolutionarily-shaped intuitions—then *this very critique must itself be such a rationalization*. The debunking argument relies on cognitive tools (empirical reasoning, logical coherence) that it simultaneously dismisses as non-truth-tracking when applied to morality. If you insist that *all* moral judgments are intuition-laden fictions, you must either exempt your own meta-ethical judgment (which breaks symmetry) or admit your critique is just another intuition, no more truth-apt than the foundations it debunks. This doesn’t make the position incoherent per se—it could be rescued by embracing global anti-realism—but it forces you into a corner where the debunking argument loses its critical force, becoming just another expression of a psychological impulse. A committed MFT theorist would concede this is a problem but might retreat to saying their framework is descriptive, not normative—though that merely highlights the tension in your "epistemically corrosive" claim.  

  Next, the **evidential asymmetry** challenge. MFT’s symmetry relies on all five foundations being functionally analogous: equally non-cognitive, equally detached from moral truth. But what if some foundations track objective, measurable harms or benefits better than others? Consider care/harm: neurobiological evidence links pain/compassion circuits directly to observable suffering, and societies that neglect this foundation tend toward collapse. In contrast, loyalty/sanctity often manifest as culturally arbitrary rituals (e.g., dietary taboos) with no clear welfare correlate. If empirical work showed that care/harm judgments *reliably predict* reductions in suffering across cultures—while authority/sanctity correlate more with hierarchy maintenance or outgroup oppression—the foundations cease to be symmetrical. Jonathan Haidt himself hints at this by framing care/harm as the "universal foundation," implying a normative priority. Findings like Kurt Gray’s dyadic morality model (reducing all foundations to perceived harm) or neuroscientific work showing separable neural substrates for harm versus purity could embarrass symmetry by suggesting some intuitions are better calibrated to real-world outcomes.  

  Your worry about **MFT’s normative smuggling** is astute—and empirically supported. When Haidt chastises liberals for "moral monism," he implicitly privileges pluralism as superior, violating descriptive neutrality. But this doesn’t damage your symmetric debunking; it *reinforces* it by showing how easily descriptive claims morph into normative ones. The true vulnerability here is practical: if MFT proponents can’t resist normativity, your critique gains indirect support.  

  Now, the **empirical flank**. You note WEIRD samples and factor-structure worries—but these dent MFT broadly, not your symmetrical-debunking reading specifically. In fact, if foundations aren’t universal (e.g., authority absent in some egalitarian societies), it weakens MFT’s descriptive claims but *strengthens* your debunking: localized foundations would look even more like adaptive quirks, not truth-trackers. More damaging would be evidence that foundations *aren’t* intuition-driven. If, say, fairness judgments in adults showed heavy cortical modulation (suggesting rational override), or if moral development studies revealed progressive integration of foundations through deliberation, it would challenge the "affect-laden intuition" core. Joshua Greene’s dual-process model (contrasting automatic deontology with deliberate utilitarianism) already complicates this, hinting that some moral cognition *can* escape intuition.  

  Finally, the **meta-ethical contingency**. Your debunking silently assumes a Humean is-ought gap. But moral naturalists (e.g., Railton, Brink) argue evolved intuitions *can* track moral facts if those facts are grounded in wellbeing. If wellbeing is objective (e.g., via health, longevity, social stability metrics), foundations aligning with it might enjoy epistemic privilege. Here, your position isn’t incoherent—it’s *conditional* on rejecting naturalism. A critic pressing this isn’t refuting you; they’re rejecting your premises.  

  **Does this collapse into unfalsifiability?** Partially. No finding *forces* you to abandon symmetric debunking—you can always attribute apparent asymmetries to deeper intuitions or dismiss naturalism as question-begging. But this isn’t fatal; it’s the fate of many meta-ethical stances. The cost is dialing down the argument’s urgency: if nothing could falsify it, it becomes a philosophical choice, not an empirical discovery. Your strongest ground is that MFT, *taken at face value*, dissolves moral objectivity. Yet the most credible pressures—self-undermining and potential evidential asymmetries—suggest symmetry might be unstable. If care/harm intuitions demonstrably enhance wellbeing while purity intuitions exacerbate conflict, dismissing this as "just psychology" starts to feel less like skepticism and more like dogma.  

  Honestly? Your reading is robust against casual objections but frayed at the philosophical edges. It holds best if you defend it as a *paranoid meta-ethics*: a consistent, deflationary stance that preempts all moral realism. But it risks vacuity if it denies any possible vindication of moral cognition. The path forward might be to soften "symmetric debunking" to "symmetric suspicion," inviting scrutiny of each foundation’s functional and epistemic credentials—without assuming all must fail equally.
