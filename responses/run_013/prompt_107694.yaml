            Q(Red) / Q(not Red) = P(Red) / P(not Red) = (1/2) / (1/2) = 1.

          Therefore, Q(Red) = Q(not Red). And since not Red is entirely Blue, we have Q(Blue)=Q(not Red)=Q(Red).

          Also, Q(Red) = Q(R_N)+Q(R_S) = 2 * Q(R_N) (if they are equal) because we are preserving the ratio within Red. But note: we are not forced to change the ratio within Red. So we set:

