            Q(Blue)=b, and Q(Yellow)=0, Q(Green)=0.

          And we have Q(Red)=Q(not Red) => 2a = b.
          And total: 2a + b = 1 => 2a + 2a = 1 => 4a=1 => a=1/4.
          Then b=1/2.

          So:
            R_N: 1/4, R_S: 1/4, Blue: 1/2.

          Then P(Red)=1/2.

          This is different from the material conditional update (which gave 3/4).

      - Why? The material conditional update conditions on "Red or Blue", which rules out Yellow and Green. But note that the prior probability of not being in Red or Blue is P(Yellow or Green)=1/3. So ruling that out increases the probability of Red and Blue. But the message was conditional: it didn't say that you are not in Yellow or Green, it said that if you are not in Red, then you are in Blue. The minimal revision update does not rule out the possibility of being in Yellow or Green unconditionally; it only says that if you are not in Red then you must be in Blue. However, the material conditional is equivalent to "Red or Blue", which does rule out Yellow and Green. 

      - The minimal revision update does set Q(Yellow)=0 and Q(Green)=0. So it also rules them out? 
          But note: the constraint Q(Blue | not Red)=1 implies that Q(Yellow | not Red)=0 and Q(Green | not Red)=0. So indeed, the posterior probability of being in Yellow or Green is zero. 

      - The difference is in how it redistributes the probability. The minimal revision update preserves the odds between Red and not Red. The prior odds were 1:1 (since P(Red)=1/2, P(not Red)=1/2). So the posterior odds are also 1:1. Therefore, P(Red)=1/2. The material conditional update does not preserve these odds: it conditions on the event that either Red or Blue is true, which has prior probability 2/3. The event not Red and not Blue (Yellow and Green) has prior 1/3. When we condition on not (Yellow or Green), we get that the probability of not Red (which is now entirely Blue) is scaled by the prior probability of Blue relative to the entire event of Red or Blue. The prior probability of Blue is 1/6 and the prior of Red is 1/2, so within the event {Red, Blue}, the ratio of Red to Blue is (1/2):(1/6)=3:1. That's why the posterior gives Red 3/4 and Blue 1/4.

