              R_N: 1/4
              Blue: 1/4
              Yellow: 1/4
              Green: 1/4

          This makes sense: the message only told us that if we are in Red, then we are in the North. It didn't give us any reason to change the probability of being in Red or in any of the other territories. It only changed the internal distribution of Red. So the probability of Red remains 1/4, and within Red, it's all North.

          The posterior probability of being in Red is 1/4, the same as the prior. This is in contrast to the material conditional update which gave 1/7.

  9. **Contrast the two updates:**
     - Material conditional update (conditioning on not R_S): 
          P(Red) = 1/7.
     - Minimal revision update: 
          P(Red) = 1/4.

     - Which one is more intuitive? The minimal revision update leaves the probability of being in Red unchanged because the message did not provide any information that directly bears on whether the traveler is in Red. It only provided information about where in Red the traveler is, if they are in Red.

  10. **The variant with non-uniform prior and negative conditional:**
      - Now, let's change the prior. Suppose the prior is:
            P(Red)=1/2, and P(Blue)=P(Yellow)=P(Green)=1/6 each.
          And within Red: P(R_N|Red)=1/2, P(R_S|Red)=1/2, so P(R_N)=1/4, P(R_S)=1/4.
      - The message: "If you are not in Red territory, then you are in Blue territory."
          This is: "If not Red, then Blue".
      - What update should we do?
      - First, the material conditional update: the material conditional "not Red → Blue" is equivalent to "Red or Blue". So we condition on the event {Red, Blue}. The possibilities: R_N, R_S, Blue (but note: Yellow and Green are ruled out?).
