            D(Q||P) = Q(R_N) * log(Q(R_N)/P(R_N)) 
                     + Q(Blue) * log(Q(Blue)/P(Blue)) 
                     + ... 

          but with Q(R_N)=r, Q(Blue)=x, etc.

          This minimization, subject to r+3x=1, leads to the requirement that the probabilities of the events that are not constrained (i.e., the non-Red territories) should be proportional to their prior probabilities. And that is what we did: we set them in the same ratio. 

          Therefore, we have:

            Q(Blue) = x, Q(Yellow)=x, Q(Green)=x, and Q(R_N)=r, with r+3x=1.

          Now, in the prior, the probability of not Red is 3/4, and it is split equally among Blue, Yellow, Green. So each had 1/3 of the not-Red probability. In the posterior, the not-Red probability is 3x. We want to preserve the relative probabilities within not-Red. Since they were equal, we set them equal. 

          But what about the ratio between Red and not Red? We have no constraint on that. The minimal revision rule says that we should set the new probabilities so that the relative entropy is minimized. This is achieved by setting the new probabilities proportional to the prior, but subject to the constraint. Since the constraint only breaks Red into R_N and R_S and sets R_S to 0, the rule says: keep the probabilities of the other events (Blue, Yellow, Green) proportional to their prior. But note: the prior for each of Blue, Yellow, Green is 1/4, and for Red (as a whole) is 1/4. However, in the posterior, we are treating Red as a single event (R_N) and then the non-Red events. The relative entropy minimization will lead to:

            Q(Red) / P(Red) = Q(Blue) / P(Blue) = ...   [but note: this is for the events that are not split?]

          Actually, the general rule is that the posterior distribution should be:

            Q(w) = P(w) * constant   for each w in a given "partition" that is not refined by the constraint.

          However, in our case, the constraint refines the partition for Red. The minimal revision rule (as in the Judy Benjamin solution) says that the probability of the non-Red territories should remain in the same proportion to each other and also the same proportion relative to the entire Red event? Actually, the standard solution (from van Fraassen) is that we set:

            Q(Red) = P(Red) * c
            Q(not Red) = P(not Red) * c   ??? 

          But that would be if we had no constraint on the conditional. We have a constraint on the conditional within Red.

          The correct solution: we set the posterior so that:

            For each territory T that is not Red, Q(T) = P(T) * k, where k is a constant to be determined.
            And for Red, we have Q(Red) = P(Red) * m, but then within Red, we set Q(R_N)=Q(Red) and Q(R_S)=0.

          However, note that the prior for Red is split. We are constrained to set Q(R_S)=0. So we can think of the posterior for the non-Red territories and for Red (as a whole) being proportional to the prior, but with the condition that within Red we have the conditional probability set to 1.

          The minimal revision rule in this case gives:

            Q(not Red) = P(not Red) * k
            Q(Red) = P(Red) * k   ??? 

          But wait, that would mean the ratio Q(Red)/Q(not Red) = P(Red)/P(not Red). So the odds of Red vs not Red remain the same. That is the key.

          Therefore, we set:

            Q(Red) = k * P(Red) = k * (1/4)
            Q(not Red) = k * P(not Red) = k * (3/4)

          But note: Q(not Red) is split among Blue, Yellow, Green. We want to preserve the ratios within not Red. So:

            Q(Blue) = [P(Blue) / P(not Red)] * Q(not Red) = ( (1/4) / (3/4) ) * (k * 3/4) = (1/3) * (k * 3/4) = k/4.

          Similarly, Q(Yellow)=k/4, Q(Green)=k/4.

          Also, Q(Red) = k * (1/4) = k/4.

          Now, the total probability: 
              Q(Red) + Q(Blue) + Q(Yellow) + Q(Green) = k/4 + k/4 + k/4 + k/4 = k.
          So we must have k=1.

          Therefore:
              Q(Red) = 1/4
              Q(Blue)=1/4, Q(Yellow)=1/4, Q(Green)=1/4.

