            P(R_N | event) = (1/4) / (2/3) = 3/8.
            P(R_S | event) = (1/4) / (2/3) = 3/8.
            P(Blue | event) = (1/6) / (2/3) = 1/4.
        So P(Red) = P(R_N)+P(R_S)= 3/8+3/8=6/8=3/4.

      - Now, minimal revision update:
          Constraint: Q(Blue | not Red) = 1. 
          This means that if the traveler is not in Red, then they must be in Blue. So Q(Yellow | not Red)=0, Q(Green | not Red)=0.
          We want to minimize relative entropy subject to this constraint.

          We set:
            Q(not Red) = Q(Blue)   [because if not Red, then must be Blue] and Q(Yellow)=0, Q(Green)=0.
            And within Red: no constraint, so we preserve the prior ratios within Red? But note the constraint doesn't touch Red. So for the two parts of Red, we can keep the same ratio? 

          The minimal revision rule says: the relative probabilities of the events that are not constrained should be preserved. The events within Red are not constrained. The event "Red" as a whole is not constrained? But note that the constraint forces that not Red must be entirely Blue, so we have to set Q(Yellow)=0, Q(Green)=0. 

