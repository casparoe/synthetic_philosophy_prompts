answer: |-
  *(Adjusting metaphorical bow tie, leaning forward)* Excellent challenge—let's meet it head-on. First, concede that crude emotivism fails: "wrong" isn't just a boo; it expresses a *commitment* to a pattern of practical reasoning. Now, your modus ponens: when you utter the conditional "If asking is wrong, then my plan is bad," you're not *expressing* disapproval of asking. Instead, you're expressing a *higher-order attitude*: a commitment not to combine (i) disapproval of asking with (ii) approval of the plan. The second premise, "Asking is wrong," expresses the very attitude of disapproval mentioned in that commitment. The conclusion follows because *accepting both premises forces you into a practical contradiction* if you approve the plan—violating the consistency norms internal to planning. The "same content" is the *attitude-type* referenced in the conditional and expressed outright later. Validity here is about *commitment-preservation*, not truth-transmission—though minimalism lets us call it "true" when commitments align. Your move: how is this not just smuggling in propositions via attitude-types?  

