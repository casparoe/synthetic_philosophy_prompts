  ### Credence Audit Procedure for Coherence  
  Based on accuracy-first epistemology (proper scoring rules, accuracy dominance, and coherence requirements), this procedure checks for violations of probabilistic coherence in a set of credences. It prioritizes quick, rule-based repairs for clear incoherences but flags judgment calls for human review. Designed for a 10-minute audit by a student with one semester of probability.  

  **Input**: Set of events and assigned credences (point estimates).  
  **Output**: "Pass," "Repaired (with notes)," or "Fail (with explanation)."  

  ---

  #### Procedure Steps  
  1. **Bounds Check**  
     - For each credence \(c_i\):  
       - If \(c_i \notin [0, 1]\):  
         - **Repair**: Set to nearest bound (0 or 1).  
         - **Note**: "Credence out of bounds; repaired to \([0/1]\)."  
       - **Stopping Condition**: If repaired, proceed to Step 2.  

  2. **Duplicate Event Check**  
     - If two credences assigned to the *same event* (by description) conflict:  
       - **Fail**: "Error: Multiple credences for one event. Resolve manually."  
       - **Stop**: Forecaster must fix before submission.  

  3. **Complement Check**  
     - For any event \(A\) with explicit complement \(\neg A\):  
       - If \(P(A) + P(\neg A) \neq 1\):  
         - **Repair**: Adjust both to satisfy \(P(\neg A) = 1 - P(A)\).  
           - New \(P(A) = \frac{P(A) + 1 - P(\neg A)}{2}\) (mean of \(P(A)\) and \(1 - P(\neg A)\)).  
           - New \(P(\neg A) = 1 - P(A)\).  
         - **Note**: "Complement violation repaired. New values: \(P(A) = x\), \(P(\neg A) = y\)."  
       - **Stopping Condition**: If repaired, proceed to Step 4.  

  4. **Disjunction Check**  
     - For any triplet \((A, B, A \lor B)\) with provided credences:  
       - Check inequalities:  
         - \(P(A \lor B) \geq \max(P(A), P(B))\) (lower bound).  
         - \(P(A \lor B) \leq P(A) + P(B)\) (upper bound).  
       - If lower bound violated (\(P(A \lor B) < \max(P(A), P(B))\)):  
         - **Repair**: Set \(P(A \lor B) = \max(P(A), P(B))\).  
         - **Note**: "Disjunction below min possible; set to \(\max(P(A), P(B))\)."  
       - Else if upper bound violated (\(P(A \lor B) > P(A) + P(B)\)):  
         - **Repair**: Set \(P(A \lor B) = \min(1, P(A) + P(B))\).  
         - **Note**: "Disjunction above max possible; set to \(\min(1, P(A) + P(B))\)."  
       - **Stopping Condition**: If repaired, proceed to Step 5.  

  5. **Conjunction Check**  
     - For any triplet \((A, B, A \land B)\) with provided credences:  
       - Check inequalities:  
         - \(P(A \land B) \leq \min(P(A), P(B))\) (upper bound).  
         - \(P(A \land B) \geq \max(0, P(A) + P(B) - 1)\) (lower bound).  
       - If upper bound violated (\(P(A \land B) > \min(P(A), P(B))\)):  
         - **Repair**: Set \(P(A \land B) = \min(P(A), P(B))\).  
         - **Note**: "Conjunction above max possible; set to \(\min(P(A), P(B))\)."  
       - Else if lower bound violated (\(P(A \land B) < \max(0, P(A) + P(B) - 1)\)):  
         - **Repair**: Set \(P(A \land B) = \max(0, P(A) + P(B) - 1)\).  
         - **Note**: "Conjunction below min possible; set to \(\max(0, P(A) + P(B) - 1)\)."  
       - **Stopping Condition**: If repaired, proceed to Step 6.  

  6. **Dominance Check (Judgment Call)**  
     - **If no violations detected in Steps 1–5**:  
       - **Pass**: "No dominance detected; credences coherent under pairwise checks."  
     - **If unresolved incoherence remains** (e.g., credences violate additivity over a partition not explicitly labeled):  
       - **Flag**: "Inconclusive: Credences pass pairwise checks but may be incoherent under unseen constraints. Auditor review required."  
       - **Stop**: Decision reverts to you (auditor) or forecaster.  

  ---

  ### Key Features  
  - **Repairs**: Applied only for clear violations of probability axioms (Steps 1, 3, 4, 5). Repairs minimize Euclidean distance to original credences (defended by accuracy dominance arguments).  
  - **Fail Conditions**: Duplicate events (Step 2) or non-numerical inputs (Step 1).  
  - **Judgment Calls**: Step 6 flags issues requiring human judgment (e.g., unseen logical constraints).  
  - **Limitations**:  
    - Only checks pairwise/complement constraints (may miss higher-order incoherences).  
    - Assumes events are explicitly labeled (e.g., "A or B", "not A").  
    - Cannot resolve conflicts between evidence (Case 2) or handle imprecise credences (Case 3).  

  ---

  ### Running the Cases  
  **Case 1**: \(P(A) = 0.7\), \(P(B) = 0.6\), \(P(A \lor B) = 0.5\).  
  - **Step 1**: Bounds valid.  
  - **Step 2**: No duplicates.  
  - **Step 3**: No complements.  
  - **Step 4**: Disjunction check:  
    - \(P(A \lor B) = 0.5 < \max(0.7, 0.6) = 0.7\) → **Violation**.  
    - **Repair**: Set \(P(A \lor B) = 0.7\).  
    - **Note**: "Disjunction below min possible; set to 0.7."  
  - **Result**: Repaired to \(P(A) = 0.7\), \(P(B) = 0.6\), \(P(A \lor B) = 0.7\).  
  - **Forecaster action**: Review repair. If illogical (e.g., \(A\) and \(B\) disjoint), adjust other credences manually.  

  **Case 2**: Forecaster torn between 0.55 (base rate) and 0.8 (friend) for a single event.  
  - **Step 1**: Single credence → No coherence constraints to audit.  
  - **Result**: **Pass** with note: "No coherence constraints for single events. Use judgment or source-weighting procedure."  
  - **Forecaster action**: Procedure is silent; she must weigh evidence. Suggestion: Use proper scoring rule to simulate expected loss (e.g., Brier score favors 0.55 if base rate is reliable).  

  **Case 3**: Forecaster submits interval \([0.3, 0.7]\) for an event.  
  - **Step 1**: Credence not a point estimate → **Fail**.  
  - **Result**: "Error: Point estimate required. Interval invalid for proper scoring rule."  
  - **Forecaster action**: Provide point estimate or appeal to team captain. **Value judgment alert**: Step 1 enforces tournament rules (precision required), not epistemology.  

  ---  

  ### What the Procedure Cannot Do  
  1. **Handle imprecise credences**: Intervals (Case 3) or sets require separate rules (e.g., dominating sets for convexity).  
  2. **Weight evidence or resolve conflicts**: Case 2 needs source-reliability heuristics (e.g., base rate neglect correction).  
  3. **Aggregate team forecasts**: Requires aggregation rules (e.g., linear pooling) with coherence preservation.  
  4. **Enforce conditionalization**: Updating requires explicit conditional probabilities (e.g., \(P(A|B)\)) and dynamic checks.  
  5. **Guarantee full coherence**: Only checks explicit pairwise/complement constraints; higher-order issues (e.g., partitions) revert to judgment (Step 6).  

  **To complete the guide**, add:  
  - **Source-weighting procedure**: Use scoring rules to compute expected accuracy of competing credences (e.g., Brier score under base rate vs. friend's prior accuracy).  
  - **Aggregation procedure**: Linear or geometric pooling with coherence checks for team forecasts.  
  - **Dynamic updating**: Enforce \(P_{\text{new}}(A) = P_{\text{old}}(A|E)\) when evidence \(E\) is incorporated.  

  **Final note**: The procedure enforces *coherence as accuracy-domination avoidance*. It assumes credences are excludable from the set of dominated options—but cannot mandate "required" credences (e.g., Case 2). When it misfires (e.g., over-repairing in Case 1), the auditor's review is the backstop.
