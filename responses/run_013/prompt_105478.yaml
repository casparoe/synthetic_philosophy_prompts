prompt: |-
  I'm preparing an episode for a cognitive-science podcast, and my next guest builds computational models of analogy-making in a deliberately tiny "microdomain" — the letter-string puzzles in which you are shown something like "abc" turning into "abd" and asked what "kji" should become — and argues that the real work in such a model is done not by search over a fixed space of concepts but by "conceptual slippage", the fluid reinterpretation of the concepts themselves as the problem is worked. Write me eight to ten interview questions that go beyond having her restate the view. I want at least one question each on: what marks off genuine slippage from the mere variation of a parameter; how a domain this small could bear on open-ended cognition at all, given the frame problem and the suspicion that in such a toy every object is analogous to every other; and what evidence would show that analogy is a late, local add-on rather than the core of cognition. Include at least one question that turns on the model's stochastic character — that the same problem may be resolved by different slippages and so yield different answers — and asks whether a theory that returns several answers can be a theory of the one right answer. For each question, add a follow-up keyed to the answer she is most likely to give, and make at least two of the questions press where a sceptic would press. Please write the questions in American English.
