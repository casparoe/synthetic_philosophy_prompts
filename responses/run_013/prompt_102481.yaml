prompt: |-
  I sit on the ethics/transplant panel at a big hospital — we're the ones who get paged when the ICU and a family can't agree on whether someone has actually died, so over the years we've built up this weird little body of case law. Three rulings I'd want you to treat as the record:

  - A motorcyclist after a catastrophic crash: no brainstem reflexes, no respiratory drive whatsoever, flat EEG, but still on a ventilator with his heart beating. The family wanted everything continued. We said he could be declared dead and the ventilator stopped.
  - A woman in an irreversible vegetative state after a near-drowning: cortex essentially gone, brainstem completely intact, breathing on her own. Her family asked us to declare her dead so they could stop tube-feeding. We refused — said she's alive.
  - An elderly man in asystole with a DNR order; nobody attempted CPR. Five minutes later, no circulation, no spontaneous return, and no one was going to try. We said he could be declared dead right then, even though the heart might in principle have been restartable if someone had gone for it.

  Now the new one, and the room is definately split. 40-year-old, massive brainstem hemorrhage. He meets every standard brainstem-death criterion you could name — no reflexes, no drive, positive apnea test. But our newer neuromonitor is picking up intermittent low-voltage activity over the cortex, and he's also still regulating his temperature and concentrating his urine. The family wants him declared dead so they can go ahead with organ donation. Half the ICU team says "he's brain dead, call it"; the other half says "there's stuff lighting up up there, we can't."

  I want to know what our own record actually commits us to. Don't bother with citations or what other hospitals do — I want the reasoning. Give it to me in these sections, in this order:

  1. "What the record commits us to" — the two or three rules our three rulings are all jointly consistent with, and why more than one fits rather than just one. (~150 words)
  2. "What each rule says about the new patient" — go rule by rule, including any rule our own precedents seem to rule out, and say why. (~200 words)
  3. "My call" — your best guess at what we should decide and why, which earlier ruling is the closest analog, and honestly what principle we'd be adopting if we went the other way instead. (~150 words)
  4. "What would settle it" — the fact or the further case that would tell the surviving rules apart, if this one doesn't already. (~100 words)
reasoning: |-
  Hmm, the user is an ethics panel member describing three precedent cases and a new dilemma about brain death determination. They want reasoning grounded solely in their own institutional case law, not external citations. 

  First, analyzing the precedents:  
  The motorcyclist case shows absence of brainstem function alone suffices for death declaration despite cardiac activity. The near-drowning refusal establishes that preserved brainstem function means life continues even without cortical function. The asystole case reveals irreversible cessation of circulatory function is sufficient when resuscitation isn't pursued.  

  Two compatible principles emerge:  
  1. Brainstem death standard (motorcyclist + asystole cases)  
  2. Cardiorespiratory death standard (asystole case)  
  Both align because the vegetative case had intact brainstem. The principles aren't mutually exclusive - they cover different failure modes.  

  For the new patient:  
  - Under brainstem standard: Meets all criteria despite cortical blips → dead  
  - Under cardiorespiratory standard: Heart still beating → alive  
  Our precedents don't rule out either approach, creating the current split.  

  My judgment:  
  The motorcyclist is the closest analog - both show complete brainstem failure. The residual cortical activity is likely meaningless islands without integration. Declaring death aligns with that precedent. Choosing otherwise would imply adopting a "whole brain" standard we've never used.  

  To settle the rule ambiguity long-term:  
  We'd need a future case where cortical activity persists with brainstem death but shows consciousness - which our precedents haven't encountered yet. The current EEG findings don't rise to that level.
answer: |-
  ### 1. What the record commits us to  
  Your precedents jointly commit to **two non-exclusive rules** that coexist because they address distinct physiological failures:  
  - **Rule 1: Irreversible loss of *brainstem function* constitutes death** (Motorcyclist). Continued cardiorespiratory activity via artificial means is irrelevant if the brainstem is destroyed.  
  - **Rule 2: Irreversible cessation of *circulatory-respiratory function* constitutes death** (Elderly man). This holds even if resuscitation *could* have been attempted but wasn’t, provided cessation is irreversible.  

  The vegetative case (near-drowning) confirms these rules by exclusion: Intact brainstem function (breathing, reflexes) means life persists *regardless* of cortical loss. The record allows either rule to apply independently—they are not hierarchical. Rule 1 focuses on neurological integration; Rule 2 on systemic collapse.  

  ### 2. What each rule says about the new patient  
  - **Rule 1 (Brainstem death)**: The patient meets all criteria (no reflexes, no respiratory drive, positive apnea test). Thus, he is dead. Intermittent cortical activity is irrelevant because:  
    - Precedents prioritize brainstem function as the "integrator" (motorcyclist: flat EEG ignored; near-drowning: intact brainstem prevented declaration).  
    - Autonomic functions like temperature/urine regulation are brainstem-mediated—but here, they persist *despite* brainstem destruction, suggesting spinal/autonomic ganglia activity, which your panel has never treated as indicative of life.  
  - **Rule 2 (Cardiorespiratory death)**: The patient’s heart beats and lungs oxygenate via ventilator. Thus, he is *not* dead under this rule. The asystole case required irreversible circulatory cessation—absent here.  
  - **Ruled out: Whole-brain death**. Your panel explicitly rejected this in the near-drowning case (intact brainstem = alive). Cortical activity alone cannot override brainstem death criteria per your precedents.  

  ### 3. My call  
  **Declare death**. The motorcyclist is the closest analog: both patients have total, irreversible brainstem failure meeting clinical criteria, with artificial cardiorespiratory support and "confounding" neurodiagnostics (flat EEG vs. low-voltage cortical spikes). The residual autonomic functions are likely spinally mediated, akin to the motorcyclist’s beating heart. If you *don’t* declare death, you implicitly adopt a **higher cortical standard**—prioritizing isolated electrical activity over integrative brainstem function—contradicting your near-drowning ruling where cortical loss alone didn’t suffice. This would destabilize your brainstem-death precedent.  

  ### 4. What would settle it  
  A future case where a patient meets *all* brainstem death criteria **but displays unambiguous, organized cortical activity** (e.g., reproducible EEG responses to stimuli or metabolic evidence of consciousness). Your current case’s "intermittent low-voltage activity" lacks such evidence, mirroring the motorcyclist’s clinically irrelevant flat EEG. If higher cortical activity *with* brainstem destruction ever emerged, your panel would need to reconcile Rule 1 with potential consciousness—forcing a choice between neurological integration (brainstem) and awareness (cortex).  

  ---  
  **Key reasoning**: Your precedents treat the brainstem as the *sine qua non* of life when cardiorespiratory function is artificial. The new patient’s autonomic quirks don’t override this, just as the motorcyclist’s heartbeat didn’t.
