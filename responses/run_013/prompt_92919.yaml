prompt: |-
  I'm a backend engineer with zero philosophy training so bear with me — I need a joke about the utility monster for something I'm putting together. Not the standard version (one being enjoys a slice of pizza a million times more than anyone else does, so the utilitarian hands it everything and everyone else starves), that one's been done to death. I want it built on the part I actually find funny: because the monster's capacity for pleasure is so enormous, the monster can't opt out. Even if it's a decent monster and asks us to split things evenly because it would rather we were all happy, that wish is worth basically nothing on the scale next to the pleasure of it eating the whole pie — so the right answer is to ignore what the monster wants for the monster's own sake. It's the one being in the universe thats not allowed to decline being maximized. Write me a joke that lands on that, ideally one that's actually funny to someone who already knows the thought experiment, where the punchline needs the structure and isn't just "utilitarians are weird". And pls dont do it as one person explaining the thought experiment to another, that feels like cheating.
