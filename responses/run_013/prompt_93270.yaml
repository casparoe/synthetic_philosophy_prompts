  First, I need to map Hart's positivism to their framework. Hart's "rules as they are" fits neatly with the story bible as codified canon. The amendment procedure is like legislation, and the editor as an appellate court aligns with secondary rules. Positivism's separation of law from morality maps well to distinguishing canon from the series' moral center. The grudge-informer case here would involve a character exploiting a canon rule immorally, with the author later retconning it without changing the past canon.

  Then Fuller's natural law side. His "inner morality of law" connects to the series' moral center and craft constraints. Readers' views on what a character would do act as a higher law, like Fuller's principles. The grudge-informer case under natural law would see the rule as non-canon because it violates the moral center, allowing retroactive invalidation—more than just retconning.

  Now, the residue report. Clean mappings include the bible as primary rules, amendments as legislation, and continuity errors as procedural defects. Distortions happen when treating the moral center as a constitution—it's persuasive but not codified. The fandom's role as a rule of recognition is fuzzy; they influence but don't formally validate canon. 

  Gaps: Legal validity's formal "ought" versus storytelling's descriptive "is" is missing. Obligation in law is external; in series, it's about immersion. Retroactivity differs—law debates retroactive laws, while retconning alters past canon. The grudge-informer scene in their series would subtly side with natural law by showing the rule's immorality, even if not stated. The residue shows jurisprudence has formal structures that storytelling lacks, making the debate seem more about authority in a shared universe. 

  For the chapter example, showing the grudge-informer facing backlash would imply natural law, using craft constraints to avoid future unreadability. The user's vocabulary misses law's formal validity but gains narrative coherence tools. The debate's substance in their context is about who controls the canon—author, editor, or fandom.
answer: |-
  Here's the Hart-Fuller debate translated into your novelist's vocabulary, followed by the residue report and chapter implications:

  **The Debate in Story-Bible Terms:**

  1.  **The Positivist Side (Hart):**
      *   **Core Principle:** "Canon is what the story bible *says* and the established amendment procedure *allows*, full stop." Validity is separate from morality or the series' moral center.
      *   **The Bible:** This is the codified primary canon – the enacted "laws" of the fictional world. Its rules are valid simply because they are properly sourced and included.
      *   **Amendment Procedure:** This is the "rule of recognition" – the secondary rule defining how primary rules (canon) are created, changed, or repealed. Legitimacy flows from following this procedure.
      *   **Editor as Appellate Court:** The editor interprets *existing* canon and procedure. They ensure amendments are procedurally sound and internally consistent, but *cannot* invalidate canon based solely on its clash with the moral center or reader expectations.
      *   **Continuity Errors:** These are procedural failures – amendments made *outside* the established process, creating contradictions. They are flaws in execution, not evidence that the invalidated point was never "true canon."
      *   **Author as Legislator:** The author (or authorized team) wields the amendment power. What they validly enact *is* canon, regardless of its perceived goodness or fit with earlier themes.
      *   **Reader Expectations ("What a Character Would Do"):** This is powerful persuasion, perhaps influencing future amendments, but *not* a higher law invalidating existing canon. A validly established character action *is* canon, even if fans scream "He wouldn't do that!".
      *   **Craft Constraints (Consistency, Publicity, etc.):** These are pragmatic *reasons* for careful legislation/amendment, ensuring the series remains readable, but *not* inherent validity conditions. A poorly crafted, unpopular rule is still canon if procedurally valid.
      *   **The Grudge-Informer Case:** A character exploits a valid, procedurally sound canon rule (e.g., "Evidence found by a Constable on holy ground is inadmissible") to frame an enemy by planting evidence *on* holy ground. The Positivist says: "The rule *is* canon. The act was monstrous, but *legally valid* within the world at that time. A *later* book can change the rule via amendment, clarify its intent, or condemn the *character's* morality, but it *cannot* retroactively declare the rule was 'never *really* canon' or that the evidence was admissible 'all along.' That would be a retcon violating procedural continuity."

  2.  **The Natural-Law Side (Fuller):**
      *   **Core Principle:** "Canon isn't just what's written down; it must connect to the *inner morality* of the series – its moral center, character integrity, and the craft constraints that make law/series possible." A rule fundamentally violating these isn't true canon, even if procedurally valid.
      *   **The Bible:** Necessary, but insufficient. It's the *vehicle* for canon, but canon's validity depends on its alignment with the series' fundamental principles.
      *   **Amendment Procedure:** Important, but secondary. A procedurally perfect amendment that guts the moral center or makes earlier books unreadable isn't legitimate canon.
      *   **Series' Moral Center:** This is the "higher law" – the fundamental justice, character truths, and thematic core. Canon *must* aspire to align with this to be valid.
      *   **Readers' Sense ("What a Character Would Really Do"):** This taps into the "inner morality" – the essential truth of the character established over time. A rule or action violating this core character integrity isn't just bad writing, it might undermine its claim to be *true* canon.
      *   **Craft Constraints (Consistency, Publicity, Non-Retroactivity, etc.):** These aren't just practicalities; they are *constitutive principles* of a coherent long-form series (like Fuller's principles are for law). Canon that utterly violates these (e.g., a massive, unexplained retroactive change) isn't just confusing; it fails as canon *because* it breaks the "craft constitution."
      *   **Author as Legislator:** Bound by the implicit "constitution" of the series – the moral center and craft constraints. Legislation violating this constitution is ultra vires (beyond power).
      *   **Editor as Appellate Court:** Has a duty to *invalidate* amendments or interpretations that fundamentally violate the moral center or constitutive craft constraints, protecting the series' integrity.
      *   **The Grudge-Informer Case:** The rule allowing evidence exclusion based *only* on location, regardless of fraud, fundamentally violates the moral center (justice, truth-seeking) and the craft constraint against making monstrous outcomes seem legally inevitable/normal. Therefore, it was *never* valid canon. A later book *can and should* treat it as non-canon. This isn't mere retconning; it's recognizing the rule's inherent invalidity. The character's act was illegal *at the time* because the rule itself was illegitimate within the series' framework.

  **Residue Report:**

  1.  **Clean Mappings:**
      *   **Story Bible (Codified Rules) = Primary Rules of Obligation:** This maps perfectly. The bible *is* the enacted canon.
      *   **Amendment Procedure = Secondary Rules (Rule of Recognition/Change):** The process for changing canon maps cleanly to Hart's secondary rules.
      *   **Continuity Error = Procedural Defect:** An error due to failing to follow the amendment process or sloppy drafting maps well to a procedural flaw in law creation.
      *   **Canon vs. Non-Canon = Valid Law vs. Non-Law:** The core distinction works well.
      *   **Author as Legislator = Sovereign/Legislator:** The power to create canon/law maps directly.
      *   **Editor as Appellate Court = Judiciary:** Interpreting and applying existing canon/law within procedural bounds maps cleanly for the Positivist side.
      *   **Craft Constraints (Consistency, Publicity) = Fuller's Principles (as Pragmatic Concerns for Positivist; as Constitutive for Natural Law):** Their *existence* maps cleanly. The *role* they play differs between the sides, mirroring the debate.

  2.  **Mappings Requiring Distortion/Pressure:**
      *   **Series' Moral Center as Constitution:** This is the biggest stretch. A constitution is a *higher legal text*. Your moral center is unwritten, evolving, and interpretive. Treating it as a binding constitution for *legal validity within the fiction* distorts natural law by making it seem more codified than it is. Natural law relies on *principles*, not necessarily a specific text. The distortion makes it feel more like a "higher canon" than abstract principles.
      *   **Fandom as Rule of Recognition:** Hart's rule of recognition is about *official practice* (officials accepting a rule as valid). Fandom's passionate views are powerful social facts, but they don't *formally validate* canon for the series' internal operations. The author/editor *might* treat fan reaction as *de facto* recognition, but it's not the official source. Mapping fan consensus directly to the rule of recognition distorts it by making popular opinion the validity test, which neither Hart nor Fuller intended. It's more like powerful public opinion influencing officials.
      *   **"What a Character Would Do" as Higher Law:** This maps *only* to the Natural Law side, and as a *reflection* of the moral center/craft constraints (character integrity), not as a freestanding "higher law" itself. For Positivists, it's just persuasive data, not validity-determining.

  3.  **Significant Gaps (What Your Vocabulary Can't Easily Say):**
      *   **The "Ought" of Legal Obligation:** Law carries a sense of *binding obligation*. Your vocabulary describes *what is canon* and *how it changes*, but struggles to capture the *internal* "this character *should* obey this rule" feeling within the fictional world that legal systems generate. You describe authority and consequence, not the normative "ought."
      *   **Formal Validity vs. Social Acceptance:** Jurisprudence deeply debates what *makes* a rule valid law (procedure? morality? official acceptance? social obedience?). Your vocabulary assumes the bible/procedure *defines* validity. It struggles to articulate a distinct concept of "formal validity" separate from just being "in the bible" or "amended correctly." The *question* of validity's source *is* the core of Hart-Fuller; your terms start from an assumed source (the bible/procedure).
      *   **The Specificity of Retroactivity:** Legal debate focuses intensely on *retroactive legislation* (changing the law *after* the fact and applying it backwards). Your "retconning" covers this *and* simple continuity fixes *and* reinterpretations *and* revealing new information. It's broader. The legal distinction between prospective rule change and retroactive application is finer than your general "retcon."
      *   **Law vs. Morality as Distinct Domains:** Positivism hinges on this separation being conceptually clear. Your vocabulary blends them constantly because narrative *integrates* plot (events/"law") and theme (meaning/"morality"). It's hard to talk about pure "in-world validity" completely divorced from the author's/reader's moral judgment in a way satisfying to a strict Positivist.

  **Which Way the Residue Cuts & The Debate's Substance:**

  *   **Your Vocabulary Misses Formal Validity & Obligation:** The core jurisprudential concepts of *why* rules bind and the specific nature of *legal* validity (distinct from power or prediction) aren't fully captured. Your terms describe the *mechanics* of canon creation and the *impact* of coherence/morality, but not the specific *normativity* of law.
  *   **...But Highlights Authority & Coherence:** Your framework excels at describing *sources of authority* (bible, author, procedure) and the *systemic need for coherence* (craft constraints) in a shared, evolving narrative universe.
  *   **The Debate as "Who Controls the Shared Universe?":** The residue suggests that **yes, a significant part of Hart-Fuller translates directly into a fight over narrative authority:** Is canon solely defined by the authorized source following its own rules (Positivist/Author-as-Sovereign), or is it constrained by fundamental principles of meaning, character, and narrative coherence that readers and the author's own vision recognize (Natural Law/Moral-Center-as-Constitution)? The "grudge-informer" case becomes a crisis point: Do we uphold the procedural integrity of the canon even when it leads to horror, or do we prioritize the series' soul and declare the offending rule was always a narrative mistake?

  **The Grudge-Informer Chapter & Implicit Commitment:**

  Write the scene where the character exploits the "holy ground exclusion" rule to frame their enemy. Focus on:

  1.  The *cold, procedural correctness* of the rule's application.
  2.  The *stark horror and injustice* of the outcome.
  3.  The *reactions*: Protagonist's moral outrage, a morally ambiguous judge's weary resignation ("The law is clear, however unjust"), the villain's smug invocation of precedent.

  **Implicit Commitment:** Even without stating a position, **this scene inherently leans towards the Natural Law side.** Why?

  *   **Narrative Weight:** You give narrative weight to the moral horror. You *show* it as monstrous, undermining any sense that "it's just the rules." The scene screams that this rule is *wrong*, violating the moral center you've built.
  *   **Reader Alignment:** You align the reader (and likely the protagonist) against the rule's application. You invite the judgment that this *shouldn't* be how the world works.
  *   **Craft Constraint Violation:** Such a rule, used this way, risks making the fictional world feel arbitrary, unjust, and potentially *unreadable* if similar horrors become commonplace. It violates the craft constraint that the world must sustain engagement and thematic coherence.
  *   **Future Amendment Implied:** The scene's dramatic tension *demands* a future resolution – an amendment, a reinterpretation, or the rule's overturning. Simply leaving it as valid canon would feel like an endorsement of the horror, violating the moral center.

  **Conclusion:** While you *could* later uphold the rule via a Positivist amendment (changing it prospectively only), the *scene itself* makes the Natural Law argument more compelling narratively. It shows why a rule utterly divorced from the series' moral center and threatening its coherence *cannot* stand as legitimate canon without damaging the entire enterprise. The residue reveals that while your vocabulary might lack the precise jurisprudential formalism, it captures the *stakes* of the debate perfectly: **Who gets to define the soul of the shared world – the rulebook alone, or the principles that make the story worth telling?** Your chapter argues for the latter.
