prompt: |-
  I'm a novelist — six books into a historical crime series, with a story bible, a continuity editor, and a small but scary fandom that treats the bible like scripture. I've been reading alot about the Hart–Fuller debate for a talk I'm giving at a writers' festival, and I want to restate it in the vocabulary I actually use, because the standard version keeps sliding off me. I was arguing about it with my editor and my partner, who's a lawyer, and we kept talking past each other. Here's the target vocabulary: the story bible and its amendment procedure; canon versus non-canon; retconning; continuity errors; the difference between a rule being in force in the fictional world and a rule being true to the series' moral center; the author as legislator; the editor as appellate court; the readers' sense of what a character would really do as a kind of higher law; and the craft constraints any long series has to satisfy if it's going to be a series at all — consistency, publicity, not too many exceptions, no retroactive revisions that make earlier books unreadable. Take the positivist side and the natural-law side — including the grudge-informer-style case, where someone uses a valid-looking in-world rule to do something monstrous, and the question is whether a later book can treat that rule as not really law — and translate each into that vocabulary as faithfully as you can. I don't need names and dates; I need the positions in my terms.

  Then give me the residue report. Which parts of the debate map cleanly onto canon, retconning, continuity, and the bible's amendment procedure? Which parts only translate if I distort something — e.g., if I make the author's moral vision do the work of a constitution, or treat the fandom as a rule of recognition? And what has no counterpart at all in my vocabulary: is there something about legal validity, obligation, or the difference between law and morality that a novelist simply can't say with story-bible talk? Finally, tell me which way the residue cuts: is my vocabulary missing something that jurisprudence has, or is the original debate less substantive than it looks once you see it as a fight over who gets to retcon the shared universe? And if you had to write the grudge-informer scene as a chapter in my series, which side would the scene itself commit me to, even if I don't say so?
