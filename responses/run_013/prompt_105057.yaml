  In my philisophy of history seminar the lecturer keeps rolling out 'history repeats itself', most recently to argue that because the same patterns keep recuring there must be laws of history, and that Popper's poverty of historicism is basically overblown. I want to push back but I can't actually say what he's claiming. Can you lay out the different precise things 'history repeats itself' could mean — from the flatly trivial up to the strong and contentious — and for each one say whether it's true, whether it would really get him laws of history rather than just trends (I'm fairly sure Popper thinks those are different animals), and which reading he needs for his dig at Popper to land? Also whether it matters that telling people the pattern can change the pattern. Lay it out as a menu I can bring to office hours, please, and in British English since my essay's marked on it.
