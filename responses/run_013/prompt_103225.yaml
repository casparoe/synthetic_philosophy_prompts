prompt: |-
  I am preparing a paper on the value of originals and want to fix my target before I evaluate anyone's account of it. Take the purpose to be this: a theory good enough to adjudicate, in a principled way, the recurring disputes over whether a copy may stand in for an original — a digital surrogate for a fragile manuscript, an authorized replica on display while the original is in storage, a restoration that replaces most of the original material, an indistinguishable forgery discovered only after decades on the wall.

  Write me the desiderata such a theory must meet. Be specific about the phenomena and the cases it has to get right, the distinctions it must not collapse, the puzzles it must dissolve rather than merely relocate, and the considerations it must remain consistent with (including, for instance, whatever we learn from the market, from conservation practice, and from the fact that we routinely treat some non-art objects — relics, specimens, first editions, source data — as originals whose copies are deficient). State the case or consideration behind each requirement, so that I can see which ones are doing work and which are inherited prejudice.

  Two framings I want you to take seriously, since I suspect much of the literature conflates them. First, keep three questions apart: why we care about the original at all; when a copy fails to do what the original does; and when something's value is diminished by its being a copy (a fake, a replica, a reproduction). A theory may answer one without answering the others, and I want the desiderata to force it to say which it is answering. Second, treat "original" as possibly a relational rather than an intrinsic property, and say what the theory owes us once that possibility is on the table.

  Where you can, flag any pair of desiderata that you suspect cannot be jointly satisfied — that is the part I most want to see — and mark which requirements are non-negotiable and which are commitments of one camp rather than genuine constraints. Keep the weight on the criteria and their motivating cases; a brief scorecard of how the main extant positions do against the list is welcome but secondary.

  Separate what is settled from what is genuinely contested among people who know this topic, and do not present a contested view as the consensus. Where you are unsure whether a requirement is load-bearing or merely customary, say so rather than asserting it. No citations or reading list — I will supply those.
reasoning: |-
  Okay, the user is preparing a paper on the value of originals versus copies across different contexts—art, manuscripts, relics, etc. They want a set of desiderata for a theory that can resolve disputes about when a copy can substitute for an original. The key is to make these criteria specific, grounded in real cases, and to separate three distinct questions: why originals matter, when copies fail, and when being a copy diminishes value. 

  First, I need to unpack the user’s core concerns. They’re frustrated with literature that conflates why originals are valued with when copies functionally work or how being a copy affects worth. The theory must disentangle these. Also, "original" might be relational—like how a relic’s sanctity depends on its history, not just physical traits. 

  The user emphasizes real-world cases: digital surrogates for fragile manuscripts, replicas displayed instead of originals, restorations replacing original material, and forgeries discovered later. Each tests different aspects—functionality, authenticity, material continuity. Desiderata must reflect these. 

  Market practices, conservation, and non-art examples (relics, specimens) are crucial. For instance, a first edition’s value isn’t just content; it’s historical scarcity. The theory must explain this without defaulting to "because we’re snobs." 

  Now, for the desiderata structure: I’ll group them by scope—phenomena coverage, key distinctions, puzzles, consistency requirements. Each needs a concrete case behind it. For example:  
  - **Material Continuity**: When a violin is restored with 90% new wood, is it still "the original"? The theory must clarify thresholds.  
  - **Relics vs. Art**: A saint’s bone (relic) loses value if copied; a Picasso print doesn’t. The theory can’t lump them.  

  Puzzles like the Ship of Theseus (restoration paradox) must be dissolved, not dodged. If a painting’s canvas is replaced over time, when does it stop being original? A good theory should pinpoint why we care—say, about the artist’s hand vs. the object’s biography.  

  Tensions are vital to flag. For example: **Historical Provenance vs. Functional Equivalence**. A perfect fake may function identically to a Vermeer until exposed, but its value crashes. The theory can’t satisfy both "functionality defines value" and "history defines value" camps easily. Similarly, **Material Authenticity vs. Symbolic Value**—scientists discard original specimens if replicas have better data, but a moon rock’s symbolic worth hinges on its origin. This might be irreconcilable.  

  Non-negotiables: The theory must handle all core phenomena without circularity ("originals matter because they’re original"). It must also address relationality—e.g., a replica becomes "original" if misattributed long enough, like the Van Meegeren forgeries.  

  I’ll avoid taking sides on contested issues. For instance, whether aesthetic experience requires originals (settled: sometimes yes, sometimes no) vs. whether conservation ethics allow "sacrificial copies" (hotly debated).  

  Finally, a quick scorecard for existing theories:  
  - **Authenticism** (history-focused): Aces relics/fakes but flops on functional surrogates like digital manuscripts.  
  - **Functional Theories**: Great for surrogates but can’t explain why forgeries lose value post-discovery.  
  Most theories trip on relational cases—e.g., replicas gaining value if the original is lost.  

  The user’s hidden need? Probably to expose biases in the literature. By forcing theories to declare which questions they answer (and which they ignore), the desiderata become a litmus test for rigor. I’ll highlight that.
answer: |-
  Here is a structured set of desiderata for your theory of originals, grounded in specific phenomena and designed to test its adjudicative power across contested cases. I've flagged tensions, non-negotiables, and areas of contention as requested.

  ---

  ### **Core Desiderata: What the Theory Must Achieve**
  1.  **Adjudicate Core Cases Principledly:**  
      *   **Must Handle:** Digital surrogates (e.g., fragile manuscript scan), authorized replicas (e.g., displayed sculpture copy), extensive restorations (e.g., Sistine Chapel repainting), exposed forgeries (e.g., van Meegeren Vermeer).  
      *   **Why:** These represent the recurring disputes. A theory that cannot distinguish acceptable from unacceptable substitutions in these paradigmatic cases is inadequate.  
      *   **Non-Negotiable.**

  2.  **Disentangle the Three Core Questions:**  
      *   **(Q1) Value of Originality:** *Why* do we value *this specific original* at all (e.g., the Mona Lisa)?  
      *   **(Q2) Functional Substitution:** *When* can a copy fulfill the *specific function* of the original (e.g., scholarly access via a manuscript scan)?  
      *   **(Q3) Value Diminution via Copying:** *When* does being a copy (fake, replica, repro) intrinsically diminish an object's value (e.g., an exposed forgery vs. an authorized print)?  
      *   **Why:** These are distinct issues often conflated. A theory must specify which question(s) it answers and how its answers for each relate. A good functional substitute (Q2) might still lack the original's core value (Q1), and not all copies suffer value diminution (Q3) (e.g., Giclée prints).  
      *   **Non-Negotiable.**

  3.  **Account for Relational "Originality":**  
      *   **Must Handle:** The possibility that "original" is not an intrinsic property but arises from relations (e.g., to the creator, a historical event, a specific context, or a chain of custody).  
      *   **What's Owed:** The theory must explain *what* the relata are (creator? first instance? source of authority?) and *how* the relation confers value or status. It cannot presuppose intrinsic "original-ness."  
      *   **Case:** A relic (e.g., saint's bone) is only "original" relative to the saint/venerated event; a duplicate is deficient *because* it lacks that causal link.  
      *   **Non-Negotiable.**

  ---

  ### **Phenomena & Distinctions the Theory Must Capture**
  4.  **Material Continuity & Authenticity:**  
      *   **Must Distinguish:** Objects where the *specific matter* is crucial (e.g., moon rock specimen, relic) from those where composition or form suffices (e.g., digital data backup, authorized cast sculpture).  
      *   **Case:** Restorations replacing >90% material (e.g., Ship of Theseus paradox applied to a violin) – when does it cease being "the original"? The theory must provide non-arbitrary criteria.  
      *   **Potential Tension:** With #3 (Relational Originality) and #8 (Functional Equivalence). Is material continuity a *sine qua non* or just one potential relatum?

  5.  **Provenance & Historical Trajectory:**  
      *   **Must Capture:** The irreducible value of an object's unique history (e.g., a document signed by Lincoln, the Voyager Golden Record). Copies lack this trajectory.  
      *   **Case:** An indistinguishable forgery loses (most) value upon discovery *solely* due to its false history/provenance, not its appearance or function. The theory must explain this.  
      *   **Settled:** Provenance is *often* crucial. **Contested:** *How* it confers value (causal link? narrative? symbolic embodiment?).

  6.  **Function-Specific Substitution:**  
      *   **Must Capture:** Copies can be functionally adequate for *some* purposes (access, display, data) but inadequate for others (ritual use, scientific analysis of material, market value).  
      *   **Case:** High-res manuscript scan is adequate for scholarly *reading* but inadequate for forensic analysis of ink/paper or fulfilling a collector's desire for the authentic artifact. The theory must link status to purpose.  
      *   **Non-Negotiable.**

  7.  **Distinguish Copy Types:**  
      *   **Must Not Collapse:** Authorized Replicas (e.g., museum display copy), Restorations, Digital Surrogates, Forgeries/Fakes, Mass Reproductions (e.g., posters).  
      *   **Why:** Value diminution (Q3) and functional substitution (Q2) vary drastically across these. Treating a faithful restoration identically to a deceptive forgery is a failure. Authority, intent, and transparency matter.  

  8.  **Functional Equivalence in Experience:**  
      *   **Must Handle:** Cases where a copy provides an experience indistinguishable from the original to a relevant audience (e.g., a perfect replica in ideal viewing conditions).  
      *   **Case:** If a visitor cannot tell a replica sculpture from the original *in situ*, does the replica fulfill the "aesthetic experience function"? If not, why? The theory must engage with aesthetic empiricism vs. the "aura" of the original.  
      *   **Contested:** Central to Institutional/Functional theories vs. Historical/Authenticist theories. **Tension with #5 & #6.**

  ---

  ### **Puzzles the Theory Must Dissolve (Not Relocate)**
  9.  **The Forgery Puzzle:**  
      *   **Puzzle:** Why does a discovered forgery (functionally and perceptually identical pre-discovery) suffer catastrophic value loss, while an authorized replica might not?  
      *   **Must Dissolve:** Explain the value shift without resorting to circularity ("because it's fake") or merely noting deception (why does *past* deception matter so much?).  
      *   **Key to:** Q1 & Q3.

  10. **The Restoration Paradox:**  
      *   **Puzzle:** At what point does replacing original material (e.g., in a painting, building, or relic) destroy its status as "the original"? Does meticulous conservation intent matter?  
      *   **Must Dissolve:** Provide criteria beyond arbitrary thresholds (% replaced) or appeals to "essence." Link to the *reason* material continuity matters (if it does) for *this* object type.  
      *   **Case:** The Wittenham Clump (ship gradually rebuilt). **Tension with #4 & #7.**

  11. **The Virtuous Surrogate:**  
      *   **Puzzle:** Why is substituting a high-quality surrogate (digital, replica) often seen as *ethically* or *pragmatically* superior for preservation/access (e.g., Lascaux II caves), yet we still fiercely protect the "original" as irreplaceable?  
      *   **Must Dissolve:** Explain the co-existence of substitutability for function and non-substitutability for core value. Addresses Q1 vs. Q2 directly.

  ---

  ### **Consistency Requirements**
  12. **Consistency with Market Behavior:**  
      *   **Must Explain:** Why originals command massive price premiums over perfect copies/forgeries (pre-discovery), and why certain copies (e.g., artist-authorized limited editions) have significant but lesser market value.  
      *   **Case:** First edition book vs. identical later printing; relic vs. replica. The theory cannot dismiss market value as mere irrationality if it reflects deeply held valuations.  
      *   **Load-Bearing?** Likely yes; market reflects aggregated valuations, but theory shouldn't *derive* value solely from price.

  13. **Consistency with Conservation Ethics/Practice:**  
      *   **Must Accommodate:** The core ethical principle in conservation that preserving original material and integrity is paramount *even when* substitutes could serve display/access functions.  
      *   **Case:** Choosing costly, complex conservation of fragile original rather than displaying a perfect replica. The theory should explain the rationale beyond technical necessity.  
      *   **Potential Tension:** With purely functional theories (#8).

  14. **Consistency with Non-Art "Originals":**  
      *   **Must Explain:** Why originals matter in science (source data, unique specimen), history (signed treaties, relics), and information (first editions, unique documents) even when content is replicable.  
      *   **Case:** Destroying the original lab notebook after digitization feels wrong; a DNA sample from a holotype specimen is irreplaceable. The theory must identify commonalities/differences with artistic originals.  
      *   **Crucial for:** Avoiding art-centric bias. **Non-Negotiable.**

  15. **Resist Circularity & Essentialism:**  
      *   **Must Avoid:** Defining an original as "that which has unique value" and then using that value to explain why it's the original. Avoid appeals to indefinable "essence" or "aura" without operationalization.  
      *   **Why:** Provides no adjudicative power. The theory must point to identifiable features or relations.  
      *   **Non-Negotiable.**

  ---

  ### **Flagged Tensions & Contested Ground**
  *   **Major Tension (Likely Irreconcilable for Monist Theories):** **Historical Provenance (#5) vs. Functional Equivalence (#8).** Theories prioritizing unique history/causation struggle to accept functionally perfect copies as adequate substitutes for core value (Q1). Purely functional theories struggle to explain the forgery puzzle (#9) or conservation ethics (#13). *Resolution likely requires embracing pluralism or specifying domains.*
  *   **Significant Tension:** **Material Authenticity (#4) vs. Symbolic/Relational Value (#3, #5).** Does the *physical stuff* matter inherently (specimens, relics), or only as a vehicle for historical/symbolic connection (documents, some art)? *Load-bearing but contested.*
  *   **Contested Ground:**  
      *   Whether aesthetic experience *requires* the original (Q1/Q2). **Settled:** It often doesn't for basic perceptual access. **Contested:** Whether the *knowledge* of originality fundamentally alters the experience/value.
      *   The moral significance of authenticity/forgery beyond deception (Q3). **Contested.**
      *   The permissibility of "sacrificial copies" in conservation (displaying replicas while originals decay in storage). **Contested.**
  *   **Non-Negotiables:** #1 (Adjudicate Cases), #2 (Disentangle Qs), #3 (Relational Possibility), #6 (Function-Specific), #14 (Non-Art Cases), #15 (Avoid Circularity).
  *   **Potential Custom/Prejudice:** Overemphasis on "aura" as unexplainable (violates #15), dismissal of market data (#12) as vulgar, assumption that *all* value in art is aesthetic/experiential (ignores #5, #14).

  ---

  ### **Brief Scorecard of Extant Positions**
  *   **Authenticism (Provenance/History-Centric):** Strong on #5, #9, #14. Weak on #2 (Q2), #8, #11, #13 (if practice conflicts with preservation). May struggle with #7 (restorations vs. fakes) and #10. Often conflates Q1 and Q3.
  *   **Functional/Experiential Theories:** Strong on #2 (Q2), #6, #8, #11. Weak on #5, #9, #12, #14. Often collapse distinctions in #7 and struggle with #3.
  *   **Institutional Theories (e.g., "original" is what the artworld designates):** Can handle #7 (distinctions) and #3 (relational). Pragmatic for #1 sometimes. Weak on #9 (why *does* designation change?), #10, #12, #14. Risks circularity (#15).
  *   **Materialist Theories:** Strong on #4, #14 (specimens). Weak on #5 (documents, relics), #6 (functional subs), #8. Struggle with #10 and digital objects.
  *   **Pluralist/Hybrid Approaches:** Best chance of satisfying most desiderata by assigning different bases for "original" and its value in different contexts/for different purposes. Must explicitly map this to avoid vagueness.

  This framework forces a theory to be explicit about its scope, handle the hard cases, avoid common pitfalls, and justify its distinctions against real-world practices and valuations. Good luck with your paper!
