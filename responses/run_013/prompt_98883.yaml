answer: |-
  ### Decision Tree: Reference Class Problem for Singular Event Probabilities  
  *For a scientifically literate non-specialist*  

  This tree classifies positions on what makes a reference class choice "correct" when assigning probabilities to singular events. Each branch answers a question using concrete cases:  
  - **Geologist**: Probability that *one specific unstudied rock formation* contains ore.  
  - **Clinician**: Prognosis for *one patient* with a rare combination of symptoms.  
  - **Court**: Probability that *one unique historical event* (e.g., "Did Caesar order the burning of Alexandria?") occurred.  
  - **ML Model**: Calibrated probability for *one user*'s click-through rate, based on sparse features.  

  **Instructions**: Start at the root (top). Answer each question based on logical commitments (not prior knowledge of positions). Follow arrows to leaves. Each leaf names a position (or marks it unnamed) and states its most awkward commitment.  

  ---

  #### **Root: Is there a mind-independent fact about the singular event's probability?**  
  *(i.e., is probability a genuine property of the world, like mass or charge?)*  
  - **Yes** → Go to **Q1**.  
  - **No** → Go to **Q4**.  

  ---

  #### **Q1: Is this fact determined by a reference class?**  
  *(i.e., must the probability derive from frequencies in a group of "similar" events?)*  
  - **Yes** → Go to **Q2**.  
  - **No** → **Leaf: Singular Propensity**  
    - *Awkward commitment*: The probability is an intrinsic property (e.g., the rock formation has a 30% "ore propensity"), but we can never measure it without arbitrary reference classes.  

  ---

  #### **Q2: What fixes the correct reference class?**  
  *(i.e., how does the world specify which class to use?)*  
  - **Must be the narrowest class with known frequencies** → **Leaf: Direct Inference**  
    - *Awkward commitment*: For the clinician, if data exists for "women over 60" but not for "women over 60 with this rare gene," they must ignore the gene despite knowing it’s relevant.  
  - **Must be the class capturing all causally relevant factors** → **Leaf: Homogeneous Frequentism**  
    - *Awkward commitment*: The court must confirm no hidden factors affect the historical event’s likelihood—an impossible demand for unique cases.  

  ---

  #### **Q4: Is probability only a summary of information?**  
  *(i.e., does it represent rational belief given evidence, not a world-property?)*  
  - **Yes** → Go to **Q5**.  
  - **No** → **Leaf: Strict Frequentism**  
    - *Awkward commitment*: The ML model cannot assign a calibrated probability to one user’s action—only to long-run frequencies—rendering it useless for individual decisions.  

  ---

  #### **Q5: Does conditioning on all available evidence dissolve the problem?**  
  *(i.e., should we use the "totality of evidence" as the reference class?)*  
  - **Yes** → **Leaf: Bayesian Total Evidence**  
    - *Awkward commitment*: Two geologists with the same evidence (e.g., seismic data, regional studies) may assign different ore probabilities due to subjective priors.  
  - **No** → Go to **Q6**.  

  ---

  #### **Q6: Is the choice pragmatic (goal-relative)?**  
  *(i.e., does the "best" class depend on the decision context?)*  
  - **Yes** → **Leaf: Pragmatic Reference Class**  
    - *Awkward commitment*: A clinician might give one prognosis for treatment decisions (using a broad class) and another for insurance (using a narrow class), making probability agent-relative.  
  - **No** → Go to **Q7**.  

  ---

  #### **Q7: Can exchangeability replace reference classes?**  
  *(i.e., can we treat events as symmetric ("swappable") given evidence?)*  
  - **Yes** → **Leaf: Exchangeability as Basis (Unnamed)**  
    - *Awkward commitment*: The court must assume the historical event is exchangeable with others (e.g., "all disputed claims in Roman texts"), but this symmetry judgment is subjective and may omit key details.  
  - **No** → **Leaf: Unnamed (Unoccupied due to Incoherence)**  
    - *Reason*: Rejects world-facts, evidence-totality, pragmatism, *and* symmetry—leaving no basis to assign probability.  

  ---

  ### Summary of Leaves (6–9 Positions)  
  1. **Singular Propensity**: Chance exists but is class-independent.  
  2. **Direct Inference**: Use narrowest class with frequency data.  
  3. **Homogeneous Frequentism**: Use class with no relevant subclasses.  
  4. **Strict Frequentism**: No singular probabilities.  
  5. **Bayesian Total Evidence**: Condition on all evidence.  
  6. **Pragmatic Reference Class**: Choose class based on decision context.  
  7. **Exchangeability as Basis**: Replace classes with symmetry.  
  8. **Unnamed (Incoherent)**: No consistent basis for probability.  

  ### Key Notes  
  - **Unoccupied/Incoherent Branch**: The "No" path from **Q7** (→ Leaf 8) is unoccupied because it rejects all coherent ways to assign probability.  
  - **Undistinguished Pairs**:  
    - *Direct Inference* and *Homogeneous Frequentism* both require objective classes but disagree on "narrowest vs. homogeneous." The tree separates them at **Q2**.  
    - *Bayesian Total Evidence* and *Exchangeability as Basis* both dissolve the problem epistemically but differ on method (evidence-totality vs. symmetry). Separated at **Q5** and **Q7**.  
  - **Coverage**: Includes dissolution positions (*Bayesian*, *Strict Frequentism*), direct inference (*Direct Inference*), and utility-based choice (*Pragmatic Reference Class*).  
  - **Concrete Cases**: All cases map to each leaf (e.g., *Pragmatic Reference Class* handles the ML model’s user probability via cost-sensitive class choice).  

