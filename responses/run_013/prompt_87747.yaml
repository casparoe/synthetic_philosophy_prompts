    "cost_of_rejecting": "You must accept that deception's wrongness depends partly on the speaker's actions (e.g., directly asserting falsehoods vs. exploiting inferences), not just results; this complicates the theory but aligns with moral intuitions.",
    "residual_difference": "Yes, lying is morally worse than misleading because it directly violates the duty of honest assertion, while misleading indirectly deceives by manipulating inferences without explicit falsehood."
  }
