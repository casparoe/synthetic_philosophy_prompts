prompt: |-
  I am a planetary scientist who has drifted into the philosophy of biology, and I am drafting the "what counts as life" section of a life-detection protocol for an icy-moon mission. Before I commit it to paper I would like an audit of my own position: I suspect it does not hang together, and I cannot see where the fault line runs. This is what I hold.

  (1) Aliveness is a fact about a thing, not a decision we make about it. If we found a second, independent origin of life, it would be life whether or not our concept happened to cover it.

  (2) The core of the concept is a self-maintaining chemical system: something that takes in energy and material from its surroundings, holds its own organisation together, repairs the damage it accumulates, and produces further systems like itself.

  (3) Viruses are not alive. They are biological — the same stuff, part of the history of life, subject to evolution — but they are not living things. They are nearer to escaped genetic machinery.

  (4) Sterile organisms are alive. A mule is alive, a worker bee is alive, and the last member of a vanishing species is alive until the end. A definition that denies this has made a mistake, not a discovery.

  (5) The one feature that genuinely unites living things is that they are products and vehicles of Darwinian evolution — variation, heredity, selection. An account of life that leaves that out has missed the point.

  (6) There is no sharp line. "Life" is a cluster concept with clear cases in the middle and a genuine grey area at the edges, and the vagueness is in the world rather than merely in our words.

  (7) For the mission I need something a robot can apply: observable, unambiguous, and decidable from a sample within a few hours, because we shall not get a second look at the plume.

  Two cases keep me circling back.

  The Ganymede artefact. Suppose a lander finds a field of mineral structures on the sea floor that copy themselves using the local chemical gradient. Copies inherit their parent's lattice defects, and those defects affect how faithfully the next copy is made, so the population varies and the more faithful copiers come to dominate. Nothing, however, metabolises: there is no uptake of material for self-maintenance, no repair, no internal energy economy. Each structure is a passive template that either is copied or is not, and it crumbles when the gradient shifts. I want to say that this is not alive — a mineral process, however elegant — but I cannot say why without sounding like a carbon chauvinist.

  The Lazarus organism. Suppose instead the sample holds a single organism, the last of its line, with no conspecifics anywhere in the galaxy. It metabolises, repairs itself and maintains its own organisation indefinitely; it never reproduces, and nothing else of its kind exists. I want to say that it is plainly alive.

  I have been calling the distinction I am groping for the two-ledger view — one ledger for organisms, one for lineages — though I suspect it may just be a name for having my cake and eating it.

  So: which of (1) to (7) actually pull against one another, which merely look as though they do, and what is the cheapest way to restore consistency? Rank the real clashes by severity, and for each say what would have to give and what that concession would cost me elsewhere in the package, including which of my verdicts on the two cases would have to change. Do not tell me merely that the concept is vague — I already believe that — and reason it out rather than pointing me at the literature; I do not want a reading list. Please write in British English, in about 900 words, under the following headings:

  Verdict (~150 words): which commitments are genuinely in conflict, ordered by severity, and which of my verdicts are the casualties.

  Real clashes (about 200 words each, most severe first): for each, the commitments involved, what forces them apart, what has to give, and the least costly version of that concession.

  Clashes that dissolve (about 100 words each): the apparent conflicts that are not real, and why not.

  Cheapest repair (about 150 words): the single revision that clears up the most, what it costs elsewhere, and which verdicts it changes.

  Residual worry (about 100 words): what remains unresolved after that repair, and the one question I should settle next.
reasoning: |-
  Hmm, the user is a planetary scientist working on a life-detection protocol for icy moons, grappling with philosophical inconsistencies in their definition of life. They've outlined seven core positions and two problematic test cases: the Ganymede artefact (a self-replicating mineral structure without metabolism) and the Lazarus organism (a sterile but metabolizing entity). They want me to audit their framework for internal conflicts without resorting to literature or vagueness cop-outs.

  Let me analyze their commitments. Positions (1) and (6) form a solid foundation: life as objective but vague. The real tension arises between (2) - the metabolic view - and (5) - the evolutionary view. This fractures their test cases: the Lazarus organism satisfies (2) but not (5), while the Ganymede artefact satisfies (5) but not (2). Their (4) and (5) also conflict directly - sterile organisms by definition can't fulfill the evolutionary role in (5).

  Position (3) about viruses is surprisingly stable - it holds regardless of whether we prioritize metabolism or evolution. And (7) is pragmatic but neutral to the philosophical debate. The "two-ledger" idea reveals their instinctive dual-aspect thinking, but it's currently inconsistent.

  The most severe clash is clearly between metabolism-centric (2) and evolution-centric (5), as it forces contradictory verdicts on both test cases. To resolve this, they must soften (5) to include evolutionary potential rather than strict reproduction. This saves the Lazarus organism while still excluding the Ganymede artefact on metabolic grounds. 

  A secondary clash exists between (4) and (5) regarding sterile organisms. The same concession - emphasizing potential over actual reproduction - resolves this. The artifact case remains problematic because without metabolism, it fails both criteria even after revision. 

  After these repairs, the residual problem is the artifact's ambiguity. The next question they must settle is whether any non-metabolic system could qualify as life - which forces confrontation with carbon chauvinism. Their protocol might need to explicitly state that metabolism (even if not carbon-based) is non-negotiable for "organism" status while allowing that evolution defines "life-as-a-phenomenon".
answer: |-
  ## Audit of Life-Detection Framework

  **Verdict (~150 words):**
  The core conflict lies between your metabolic definition of an *organism* (2) and your evolutionary definition of *life* (5). This forces inconsistent verdicts on the Lazarus organism and Ganymede artefact. Severity ranking:
  1.  **(5) vs (2) & (4)**: Evolution (5) clashes with organismic metabolism (2) and the aliveness of sterile individuals (4). Lazarus fails (5), Ganymede passes (5) but fails (2). This is the most severe.
  2.  **(5) vs (4)**: Evolution (5) directly contradicts the aliveness of sterile organisms (4). Lazarus is the casualty.
  3.  **(2) vs Ganymede**: Metabolism (2) clearly excludes Ganymede, but your intuition balks without justification. The verdict *must* change if (2) holds.

  **(3)** and **(6)** are stable. **(1)** is foundational and not directly challenged. **(7)** is operational and constrains the solution but doesn't cause conflict. The "two-ledger" intuition is sound but your definitions make the ledgers incompatible.

  ---

  **Real Clashes (~200 words each, most severe first):**

  1.  **The Core Contradiction: Life vs Organism (Commitments 5, 2, 4)**
      *   **Conflict:** Commitment (5) defines *life* essentially as a Darwinian lineage phenomenon. Commitment (2) defines a living *organism* as an individual metabolic entity. Commitment (4) insists sterile organisms *are* alive. The Lazarus organism perfectly embodies (2) and (4) but fundamentally violates (5) – it has no lineage, no reproduction, no evolution. Conversely, the Ganymede artefact arguably satisfies (5) (variation, heredity, selection) but fails (2) (no metabolism, no self-maintenance).
      *   **Force Apart:** (5) pulls life towards being a property of populations/histories, while (2) and (4) pull it towards being a property of individual systems *here and now*. This creates a category error for Lazarus (an organism not part of "life") and Ganymede (a lineage not made of "organisms").
      *   **What Must Give:** (5) must be softened. It cannot be the sole defining feature for an *individual's* aliveness *at a single point in time*. Evolution is essential for the *origin* and *persistence* of life, but not necessarily for the *continued functioning* of an existing individual organism.
      *   **Least Costly Concession:** Reframe (5) as the *context* for life, not its *defining individual characteristic*. Life *arises* via Darwinian evolution and *persists* through lineages, but an *individual entity* is alive based on its *current functional state* (metabolism, self-maintenance). This saves Lazarus (meets functional criteria) and excludes Ganymede (fails functional criteria), while preserving evolution's centrality to life as a phenomenon. Cost: Slightly weakens the perceived primacy of (5) for individual classification, but strengthens internal consistency.

  2.  **Sterility vs Lineage (Commitments 5 & 4)**
      *   **Conflict:** Commitment (5) insists Darwinian evolution unites life. Commitment (4) insists sterile organisms like mules are alive. Sterility precludes contribution to a lineage and evolution via reproduction.
      *   **Force Apart:** (5) implies reproductive potential/capability is essential. (4) states it is not essential for an individual's current aliveness.
      *   **What Must Give:** (5) must be interpreted less rigidly regarding *current* reproductive *action* in an individual.
      *   **Least Costly Concession:** Emphasise *potential* or *evolutionary provenance*. A sterile organism is alive because it possesses the functional machinery *derived* from and *capable* (in non-sterile antecedents/counterparts) of supporting evolution, and maintains itself metabolically. It's a product and *vehicle* (as per (5)), even if its specific vehicle has broken down reproductively. Cost: Requires accepting that "vehicle" can include non-functional reproductive machinery. This concession is largely covered by the resolution of Clash 1.

  3.  **Metabolism vs Replication (Ganymede Artefact vs Commitment 2)**
      *   **Conflict:** The Ganymede artefact exhibits key evolutionary processes (variation, heredity, selection - aligning with (5)) but lacks metabolism, self-maintenance, or repair (failing (2)). Your intuition says "not alive" but (5) pulls the other way. Commitment (2) is clear: no metabolism, not an organism.
      *   **Force Apart:** (2) demands active self-sustenance. Ganymede is passive templating. (5) highlights a lifelike *process* occurring.
      *   **What Must Give:** Either admit Ganymede is a form of life (abandoning (2)/(4)'s core), or strengthen the justification for excluding it based solely on (2), accepting it *is* just "elegant mineral process".
      *   **Least Costly Concession:** Double down on (2) as *essential* for an *organism*. Ganymede fails because it lacks an internal energy economy, self-maintenance, and repair – it doesn't *do work* to maintain itself against decay; it just *is*, and its persistence/replication is externally driven. This is consistent with excluding viruses ((3)). Cost: You *must* accept the "carbon chauvinist" label or argue metabolism (even if not carbon-based) necessitates certain complexities absent in passive templating. Your Lazarus verdict remains unchanged.

  ---

  **Clashes That Dissolve (~100 words each):**

  *   **(1) vs (6) - Objectivity vs Vagueness:** These are compatible. (1) asserts aliveness is a real property, not *just* our decision. (6) acknowledges this property has fuzzy boundaries. Reality can have vague categories (e.g., "mountain"). Finding grey-area cases doesn't negate the objectivity of clear cases. No concession needed.
  *   **(3) - Viruses:** Your position is consistent within the repaired framework. Viruses lack metabolic self-maintenance (failing (2)) and are not independent vehicles for evolution (failing the *individual* aspect of (5), though they participate in the *process*). Calling them "escaped genetic machinery" fits perfectly. No conflict arises.
  *   **(7) vs Philosophy:** The operational need (7) doesn't conflict with the philosophical positions (1-6); it constrains how they are *applied* practically. The protocol will need operational proxies for metabolism/self-maintenance and evolution/replication potential, but the underlying definitions guide what proxies are relevant.

  ---

  **Cheapest Repair (~150 words):**
  The single most effective revision is to **reformulate Commitment (5)** to explicitly distinguish the *evolutionary process* from the *functional state of an individual organism*:

  **Revised (5):** "The phenomenon of life is fundamentally characterised by Darwinian evolution (variation, heredity, selection). All known living organisms are products of this process and possess the functional machinery that enables it (even if dormant or impaired in specific individuals). However, the *aliveness of an individual entity* at a given time is determined by its current capacity for metabolic self-maintenance and organisation."

  **Cost:** Slightly reduces the primacy of evolution for judging *this specific individual right now*. It accepts that a Lazarus organism is alive based on function, even though its lineage is extinct. It accepts a sterile organism is alive because it retains the functional core *derived from* evolution.
  **Changes Verdicts:** Saves Lazarus (Alive, based on function/provenance). Firmly excludes Ganymede (Fails metabolism, lacks evolutionary provenance as *biological* machinery). Ganymede might represent a *different* evolutionary process, but not *life* as defined by the functional requirements of an organism derived from Darwinian biology.

  ---

  **Residual Worry (~100 words):**
  The **Ganymede artefact's** status remains philosophically prickly. While firmly excluded by the repair (no metabolism, no biological provenance), its possession of variation, heredity, and selection challenges whether our definition is truly universal or merely parochial to Earth's biology. Have we drawn the line correctly by demanding metabolism *and* evolutionary provenance? The unresolved question is: **"Could a non-metabolic, self-replicating system exhibiting Darwinian evolution *ever* qualify as life, and if not, is this a fundamental insight or just 'mineral chauvinism'?"** Settling this is crucial for confidently excluding Ganymede-like discoveries without relying solely on Earth-centric assumptions.
