answer: |-
  This is a profound observation about how **administrative infrastructure shapes the nature of affiliation itself**. While adjacent concepts exist, your focus on the *mechanism of record-keeping* as the primary shaper of membership ontology, exit dynamics, and institutional incentives isn't perfectly captured by existing terms. Here's the carving:

  1.  **The Core Phenomenon:** The distinction is defined by the **source and nature of the authoritative membership register**.
      *   **Formalized Affiliation Regime (FAR):** Affiliation is defined and tracked by a centralized, authoritative register (state, institutional, or contractual) requiring formal acts for entry *and* exit. Membership is a **discrete, binary status** with a defined point of termination. Exit is an **act**.
      *   **Ambient Affiliation Practice (AAP):** Affiliation is defined and tracked primarily through participation, self-identification, or decentralized, non-authoritative records. Membership is a **matter of degree or practice**. Exit is a **process or fade**.

  2.  **Your Three Consequences Explained within FAR:**
      *   **Statistics:** FAR statistics measure *formal status*, not belief or practice. Distortion is systemic and uncorrectable internally because the register *is* the official reality.
      *   **Exit as Gesture:** Because exit is a discrete, documented act within FAR, it becomes a readily available symbolic tool for protest, signaling dissatisfaction, or reacting to events, creating visible "waves".
      *   **Institutional Dependence on the Hollow Category:** The FAR institution's vital interests (revenue, political influence, perceived legitimacy) are directly tied to the *size of the formal register*. This creates a structural incentive to *maintain* the category and resist purging "hollow" members, even knowing they exist. The hollowness is not a bug; it's a feature enabling institutional stability.

  3.  **Term & Tight Definition:**
      *   **Term:** **Formalized Affiliation Regime (FAR)** / Contrast: **Ambient Affiliation Practice (AAP)**
      *   **Definition:** A **Formalized Affiliation Regime (FAR)** exists when an organization's membership is defined, recorded, and maintained through an **authoritative, centralized register** that:
          1.  **Requires Formal Acts:** Entry *and* exit necessitate specific, documented procedures (application, declaration, fee payment, vote, formal resignation).
          2.  **Creates Discrete Status:** Membership is a binary condition (in/out) with definitive start and end dates.
          3.  **Is Authoritative:** The register is the sole or primary source of truth for determining membership status (legally, administratively, or contractually).
          4.  **Generates Institutional Dependence:** The organization's core resources (funding, representation rights, legitimacy metrics) are directly tied to the *size* or *existence* of this formal register.

  4.  **Boundaries & What Falls Outside:**
      *   **Clear Case (FAR):** State church membership via tax register (Germany's *Kirchensteuer*), closed-shop unions with mandatory dues check-off requiring formal resignation, professional licensing boards requiring formal surrender of license, political parties with formal membership rolls and cards requiring resignation.
      *   **Resembling Case (FAR Tendencies):** Private clubs with strict bylaws requiring formal application and resignation procedures for membership. Universities with formal alumni associations requiring sign-up/opt-out. *Why resembling?* While formal, dependence on the register for core resources might be weaker than state funding.
      *   **Clear Case (AAP):** Most voluntary associations (book clubs, hobby groups), informal social groups, congregations relying solely on attendance/participation/self-ID without a formal roll requiring resignation, online communities without formal membership status.
      *   **Resembling Case (AAP Tendencies):** Congregations with membership rolls but no formal resignation process, treating lapsing attendance as de facto exit. Loose professional networks.
      *   **What Makes FAR Absent:** A country where:
          1.  No authoritative central register defines membership for key institutions (religious, professional, political).
          2.  Affiliation is primarily based on self-declaration, participation, or decentralized, non-binding records.
          3.  Exit occurs organically through non-participation without requiring a formal act.
          4.  Institutions derive core resources independently of formal membership counts (e.g., purely through donations/attendance/volunteering not tied to a register).

  5.  **Relationship to Adjacent Concepts:**
      *   **State Church/Established Religion:** *Necessary but not sufficient.* FAR *can* exist without state establishment (e.g., strict private covenant). State recognition *without* a membership register/financial tie (e.g., UK CofE baptism records aren't a state membership register funding the church) **does not create FAR**. The key is the register and dependence, not mere recognition.
      *   **Voluntaryism:** AAP aligns with voluntaryism, but FAR can exist for voluntary associations too (e.g., a strict private club). The distinction is the *mechanism*, not the initial choice.
      *   **Church-Sect Typology (Troeltsch/Niebuhr):** This is about theology, sociology, and relationship to society/world. A "Church" type *could* use FAR (e.g., state churches) or AAP (e.g., broad mainline Protestant denominations relying on self-ID). A "Sect" *could* use FAR (e.g., closed communes with formal membership) or AAP. The typology focuses on beliefs and boundaries; FAR/AAP focuses on administrative machinery.
      *   **Secularization:** FAR/AAP is about the *form* of affiliation, not the *level* of religious belief/practice. FAR statistics are poor measures for secularization debates precisely because of the distortion inherent in FAR.
      *   **Principal-Agent Problem/Moral Hazard:** These describe *potential consequences* within FAR (institution protecting hollow members for revenue) but don't define the *structural cause* (the register and its authoritative nature).

  6.  **Generality:** This **absolutely extends beyond religion**:
      *   **Union Dues Check-off:** Classic FAR. Exit requires formal resignation. Union revenue/power tied to register. Hollow members exist.
      *   **Professional Licenses:** FAR. License is binary status requiring formal surrender. Licensing body's authority/relevance tied to register size.
      *   **Political Party Cards:** FAR if formal membership grants rights/funding and requires resignation.
      *   **Subscription Services with Hard Cancellation:** FAR-lite. Status is binary, exit requires an act, revenue tied to subscription list. Less "authoritative" regarding identity, but structurally similar.

  **Conclusion:** You've identified a fundamental distinction grounded in **administrative infrastructure**: the Formalized Affiliation Regime (FAR) vs. Ambient Affiliation Practice (AAP). FAR creates discrete status, active exits, distorted statistics, symbolic exit gestures, and institutional dependence on potentially hollow membership categories. The state is a common *enabler* of FAR via registers and funding ties, but FAR can arise from any authoritative register upon which an institution depends. AAP reflects affiliation as practice or identification, with gradual exits and less institutional dependence on formal counts. This framework provides the "edges" you seek, allowing clear classification across diverse contexts.
