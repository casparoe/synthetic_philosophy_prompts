answer: |-
  The character/habit distinction in evidence law reveals a nuanced, philosophically textured view of human behavior that sits at the intersection of epistemology, psychology, and normative policy. Let's reconstruct the implicit theory, resolve the apparent inconsistency, and explore its theoretical commitments:

  ### Reconstructing the Implicit Theory of Character
  1.  **Predictive Power Hierarchy:** The distinction presupposes a *gradient of behavioral predictability*. Habits (specific, automatic responses to defined situational cues) are viewed as highly reliable predictors of specific conduct in identical/similar situations. Broad character traits (e.g., "dishonesty," "violence") are seen as weak predictors of *specific conduct in a specific situation* due to:
      *   **Cross-Situational Variability:** The law implicitly accepts situationist psychology's core claim: behavior is influenced more by situational pressures and context than by global traits. A generally "honest" person might lie under specific pressure; a "violent" person might be provoked in one context and restrained in another.
      *   **Trait Vagueness & Multiplicity:** A broad trait like "dishonesty" encompasses myriad possible behaviors (lying, cheating, stealing, fraud), making inference to a *specific act* (e.g., forging a signature on *this* document) highly speculative.
      *   **Volitional Interference:** Character traits are seen as dispositions *susceptible to conscious choice or situational override*. Habits are viewed as more automatic, routinized, and less subject to momentary volitional control ("I always lock the door without thinking").

  2.  **Specificity as the Key:** The law values *specificity of inference*. A habit directly maps onto the *exact conduct* at issue (e.g., "always jiggles the office door handle when leaving" predicts jiggling *that* handle on *that* day). Character evidence requires an inferential leap from a general disposition to a specific manifestation, introducing significant uncertainty.

  3.  **Epistemic vs. Ontological Commitments:** Crucially, the law *does not necessarily deny the existence* of character traits. Its primary commitment is **epistemic and predictive**: even if traits exist, they are poor tools for reliably inferring *specific conduct in a specific instance*. The practice presupposes situationism *as an accurate description of behavioral prediction*, not necessarily as a full ontological denial of traits.

  ### Defending Exclusion on Non-Psychological Grounds? Can the exclusion be defended *without* situationist presuppositions?
  *   **Epistemic Grounds (Jury Overweighting):** Absolutely. Even a staunch trait theorist could argue character evidence is unfairly prejudicial (FRE 403). Juries might:
      *   Overestimate the predictive power of traits.
      *   Punish for "bad character" generally rather than the specific act charged ("propensity inference").
      *   Be unduly swayed by reputation or past acts unrelated to the specific context.
      This justification requires *no* commitment to situationism, only a belief in jury fallibility and the prejudicial nature of the evidence.
  *   **Normative Grounds (Unfairness):** Yes. The principle of "individual justice" holds people accountable for *acts*, not for *who they are*. Introducing character evidence risks shifting the trial's focus from "Did the defendant *do* X?" to "Is the defendant a *bad person*?". This fairness argument is independent of the predictive power debate.

  **Conclusion on Presupposition:** The core practice of excluding character evidence for propensity *strictly presupposes* that broad traits are **unreliable predictors of specific conduct** – a core tenet of situationism. However, the *reasons* for exclusion can be *reinforced* by non-situational epistemic (jury prejudice) and normative (unfairness) arguments. The practice *cannot stand without* the predictive unreliability presupposition; if traits were highly reliable predictors, the epistemic and fairness arguments would be significantly weakened or negated. The *habit* exception *strictly presupposes* situation-bound dispositions *are* reliable predictors.

  ### Resolving the Apparent Inconsistency (Character in Other Contexts)
  The law's use of character evidence elsewhere is *not* fundamentally inconsistent because it serves *different purposes*:
  1.  **Character "In Issue" (Defamation, Custody, Negligent Entrustment):** Here, character *itself* is the material fact in dispute. The question isn't "Did the trait cause a specific act?" but "What *is* the person's reputation/trait *at this time*?" (e.g., "Is this parent unfit?", "Was the plaintiff truly of bad repute?"). The law treats character as a *social fact* (reputation) or a *present status* relevant to rights/obligations, not primarily as a predictor of a past specific act.
  2.  **Sentencing:** Post-conviction, the focus shifts from "Did they do this specific act?" to "What is appropriate punishment/rehabilitation for *this person*?". Character becomes relevant to assessing culpability, dangerousness, and prospects for reform. The normative justification shifts from individual act-based justice to societal protection and individual correction. The epistemic risk of propensity inference is moot – guilt for *an* act is already established.

  **Resolution:** The tension is *superficial*. The law distinguishes between:
      *   **Using character to *prove conduct*:** Barred in liability phase (unreliable predictor, prejudicial, unfair).
      *   **Character *as the fact in issue*:** Admitted (reputation/trait is directly relevant).
      *   **Character *for disposition/punishment*:** Admitted at sentencing (different purpose, different rules).
  The underlying theory holds: Character traits exist and can be ascertained *as facts about a person's reputation or present status*, but they are *not reliable tools for inferring specific past conduct*.

  ### Implications of Adopting a Robust Global-Trait Theory
  If courts embraced a "full-blooded, global-trait conception" (where broad traits like honesty are stable, cross-situational, and highly predictive):
  1.  **Character Evidence Rules:** The general bar on character evidence for propensity would collapse. If "dishonesty" reliably predicts acts of deception, evidence of past dishonest acts/reputation would become highly relevant and probative for proving a specific act of fraud or perjury. Exclusion based on unreliability or weak prediction would vanish.
  2.  **Habit Evidence:** The distinct "habit" category would likely become redundant or subsumed. A specific habit (e.g., always checking the lock) would simply be viewed as a *manifestation* of a broader, reliable trait (e.g., conscientiousness, caution). The strict requirement for specificity and automaticity would lose its rationale, as *any* past act demonstrating the relevant broad trait would be admissible to prove conduct consistent with that trait.
  3.  **Impact on Other Areas:**
      *   **"Character in Issue":** Would remain largely unchanged, as character itself is still the fact in issue.
      *   **Sentencing:** Character evidence would gain even stronger epistemic footing for assessing dangerousness/reform, but the normative justification for its use might remain similar.
  4.  **Fundamental Shift:** Evidence law would move dramatically towards a more "person-based" rather than "act-based" model of liability determination. Trials would focus more on the defendant's general nature than on the specific circumstances of the alleged act. The "propensity inference" would become central, not forbidden. The normative fairness objection ("tried for who they are") would become the *primary* battleground, as the epistemic objection (unreliability) would be discarded.

  **In essence:** Adopting a robust global-trait theory would necessitate abandoning the core character/habit distinction. Habit evidence, as a privileged category of highly predictive *specific* conduct, would likely disappear, replaced by a general rule admitting evidence of *any* past conduct demonstrating a relevant broad trait to prove conduct consistent with that trait on the specific occasion. The exclusionary rule would lose its foundational epistemic justification.
