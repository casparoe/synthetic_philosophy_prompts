prompt: |-
  My cousin is writing a chapter on moral particularism and he's got this argument he calls the parity argument. I've been staring at it for a week. Here it is:

  (1) A reason is a consideration that counts in favor of (or against) doing something.
  (2) Whether a given consideration counts in favor of an action depends on context. The same feature — that a promise was made, that an act would cause pleasure, that someone asked me to do it — can count in favor in one case, count against in another, and be totally irrelevant in a third.
  (3) So no consideration counts in favor of anything just by virtue of being the kind of consideration it is.
  (4) So there are no true general statements of the form "considerations of kind K count in favor of actions of kind A."
  (5) A moral principle just is a true general statement of that form.
  (6) So there are no moral principles. Particularism wins.

  And here's the part he thinks is the sting. He says nothing in (1)–(5) is special to morality. Run the same thing for epistemic reasons: whether "it seems obviously true to me" counts in favor of believing something depends on context too. Same for prudential reasons, aesthetic ones, reasons of etiquette. So (4) generalizes to every domain: there are no general truths about what counts in favor of what. But by (1) that just means no consideration is a reason for anything, in any context. So there are no reasons at all.

  He treats that as a reductio and concludes particularism is false — we need principles after all. I agree the conclusion is absurd, but I don't think it lands on particularism. I want to keep (2), it seems plainly right to me, and honsetly I'd sooner give up (1) than (2), except I can't see how dropping (1) does any work here. Which step is doing the damage, why does it look innocent, and what's the bill if I cut it? Also — is there a version of the argument that survives once you patch the bad step, or does the whole thing collapse?
reasoning: |-
  Okay, the user's cousin has this parity argument for moral particularism, but it ends up leading to a reductio ad absurdum where no reasons exist at all. The user is stuck on identifying which step is problematic and how to fix it without giving up the plausible (2). They also want to know if a valid version of the argument can survive after fixing the issue.

  First, I need to trace the argument step by step. Premise (1) defines a reason as a consideration that counts in favor of an action. Premise (2) states that whether a consideration counts in favor depends on context, which seems undeniable—promises can be overridden, pleasure might be harmful in some cases. From (1) and (2), (3) concludes that no consideration counts as a reason just by its kind, meaning no invariant reasons. Then (4) extends this to say there are no true general statements about reasons. (5) defines moral principles as such general statements, leading to (6) that there are no moral principles.

  The cousin then applies this to epistemic, prudential, etc., reasons, showing that if (4) holds, no domain has reasons at all. That's the reductio. The user agrees that's absurd but wants to save (2). They're willing to drop (1) but aren't sure how that helps. So where's the flaw?

  The critical step is (3) to (4). (3) says no consideration counts as a reason solely by its kind, which is correct given holism (context-dependence). But (4) jumps to saying there are no true general statements. That's too strong. Generalizations can still exist as defeasible patterns, like "Promises generally create obligations, but..." without being exceptionless. So (4) is invalid because it assumes principles must be absolute when they can be hedged.

  Premise (5) is also problematic. It defines moral principles as requiring exceptionless generalizations. But particularism doesn't necessarily deny principles; it denies that they are necessary for reasoning. Principles could be summaries or guides without being absolute. So (5) sets up a straw man by making principles too rigid.

  The user's cousin uses the reductio to attack particularism, but actually, the reductio targets the inference from (3) to (4). If we accept holism (context-dependence) but allow defeasible generalizations, then both (2) and the existence of reasons can coexist. For example, "Lying is usually wrong" is a general truth that holds ceteris paribus. The epistemic case works similarly: seeming true is often a reason to believe, but not if you're drugged.

  The user might be concerned about saving particularism. The key is that particularism isn't denying all generalizations; it's about the structure of reasons. They can accept (2) without accepting (4) by allowing defeasible principles. The cousin's mistake is conflating holism with the absence of any patterns.

  If the user drops (1), it wouldn't help. (1) is a standard definition. The problem is the leap to (4). The solution is to reject the inference from (3) to (4) by recognizing that generalizations can be context-sensitive and defeasible. The bill for this is that principles become heuristic guides rather than exceptionless rules, which is actually consistent with moderate particularism.

  The user also asks if a version of the argument survives. If they insist on absolute principles, then the reductio holds, but that's not plausible. A better approach is to see that holism (premise 2) doesn't entail no principles; it entails no absolute principles. But since principles can be probabilistic or ceteris paribus, the argument doesn't go through. So the whole reductio collapses once we correct the misunderstanding of what principles can be.
answer: |-
  This is a fascinating and tricky argument! Your cousin has constructed a clever *reductio ad absurdum* against his own initial particularist conclusion. The sting is real: if the argument against moral principles generalizes to *all* normative domains (epistemic, prudential, etc.), leading to the absurd conclusion that there are *no reasons whatsoever*, then the initial premises must be flawed. Let's break down where the damage occurs, why it looks innocent, what the cost is to fix it, and whether a salvaged version exists.

  **The Critical Flaw: The Leap from (3) to (4)**

  *   **(3)** is true and relatively innocent: "No consideration counts in favor of anything *just by virtue* of being the kind of consideration it is."
      *   *Why it looks innocent:* This simply captures holism about reasons (which is core to particularism and widely accepted). A promise-making feature doesn't *automatically* generate a reason *all by itself, regardless of other features*. Its reason-giving force depends on the absence of defeaters or the presence of enablers (e.g., the promise wasn't made under duress, it's not immoral, etc.). This seems plainly correct given (2).
  *   **(4)** is the problematic conclusion: "So there are no true general statements of the form 'considerations of kind K count in favor of actions of kind A.'"
      *   **The Damage:** This jumps from "no *invariant, context-insensitive, exceptionless* reason-giving force" (3) to "no *true general statements whatsoever* about reasons." This is invalid. (3) only rules out principles that are *absolute* or *strict* – principles claiming that K *always and necessarily* counts in favor of A, *no matter what*. It does *not* rule out:
          1.  **Defeasible/Ceteris Paribus Principles:** "Considerations of kind K *generally* count in favor of actions of kind A, *in the absence of defeaters*." (e.g., "Making a promise generally gives you a reason to keep it, unless it was coerced, immoral, etc.").
          2.  **Contributory Principles:** "Considerations of kind K *count in favor of* actions of kind A" (without claiming they are decisive or always present). This is compatible with K's force being overridden or silenced in specific contexts.
          3.  **Patterns/Generalizations:** True empirical generalizations about how reasons *tend* to function, even if not exceptionless laws. (e.g., "Causing pain is *very frequently* a reason against an action").
      *   *Why it looks innocent:* The slide happens because "counts in favor" in (1) and (2) is treated as an *all-or-nothing, context-independent property* in (4). If "counts in favor" *must* mean "counts in favor *invariably, just by being K*," then (4) would follow from (3). But (1) and (2) don't define "counts in favor" that rigidly. (2) explicitly shows its context-dependence. The argument illicitly assumes that for a general statement to be true, the reason-giving force must be invariant and context-independent – which (3) correctly denies exists, but which isn't the only way to understand general principles.

  **Premise (5) Shares Some Blame**

  *   **(5)** "A moral principle just is a true general statement of that form." (i.e., the form in (4)).
      *   **The Problem:** This definition sets the bar impossibly high. It defines moral principles *only* as *strict, exceptionless, invariant generalizations*. Particularists often attack *this specific type* of principle. However, many defenders of principles (often called "generalism-lite," "moderate generalism," or proponents of "defeasible principles") argue that moral principles exist precisely in the forms listed above (defeasible, contributory, patterns). (5) stacks the deck against principles by defining them out of existence from the start. If principles can be defeasible, then (4) doesn't follow from (3), and (5) is an overly narrow definition.

  **Why Dropping (1) Doesn't Solve the Problem (But Modifying It Might)**

  Dropping (1) entirely seems drastic and unnecessary. The core definition of a reason as a "consideration that counts in favor" is standard. The problem isn't with (1) itself, but with how "counts in favor" is implicitly treated as needing *invariant* force when moving to (4).

  *   **A Better Move:** Refine the understanding of "counts in favor" implied in the argument. Instead of seeing it as a monolithic, context-independent property, see it as *intrinsically context-sensitive and potentially contributory/defeasible*. A consideration *counts in favor* in a *specific context*, and general statements capture *patterns* or *default tendencies* of this context-dependent favoring relation. This directly undermines the leap from (3) to (4).

  **The Bill for Cutting the Bad Step (Rejecting the Inference from (3) to (4))**

  1.  **Accept Holism (Keep (2) & (3)):** You keep the core particularist insight: the reason-giving force of any consideration is context-dependent. No feature is *always* a reason, or a reason with *fixed weight*, purely in virtue of its type.
  2.  **Allow Defeasible/Contributory Principles:** You must accept that there can be *true general normative statements*, but they won't be absolute or exceptionless. Examples:
      *   *Moral:* "Breaking a promise *is generally a reason against* an action, and *prima facie* wrong." (Rossian prima facie duty).
      *   *Epistemic:* "A perceptual seeming that P *is generally a reason to believe* P." (Defeasible, defeated by evidence of hallucination).
      *   *Prudential:* "An action causing you significant future pain *is generally a reason against* doing it." (Defeated if it prevents greater pain).
      *   *Etiquette:* "A guest making a specific dietary request *is generally a reason for* the host to accommodate it." (Defeated by impossibility, excessive burden).
  3.  **Modify Premise (5):** A moral principle is *not necessarily* a strict, exceptionless generalization. It can be a true general statement about contributory reasons, defeasible reasons, or patterns of reason-giving. Principles become *guides*, *summaries of typical weight*, or *default rules*, not inviolable laws.
  4.  **Reject the Reductio:** The absurd conclusion ("no reasons anywhere") doesn't follow. Reasons exist *in contexts*. True general statements *about* these context-dependent reasons are possible, just not in the strict form demanded by (4) and (5) as originally stated.

  **Does a Salvaged Argument Survive?**

  Yes, a *weaker* but still significant particularist argument survives, targeting only **strict absolutist principles**:

  1.  (1) A reason is a consideration that counts in favor of (or against) doing something. (Unchanged, standard definition).
  2.  (2) Whether a given consideration counts in favor of an action depends on context. (Unchanged, holism).
  3.  (3) So no consideration counts in favor of anything *invariably and with fixed weight* just by virtue of being the kind of consideration it is. (Slightly strengthened to emphasize invariability/weight).
  4.  (4') **Therefore, there are no true *strict, exceptionless, invariant-weight* general statements of the form "considerations of kind K count in favor of/against actions of kind A (always and everywhere, with weight W)."** (Modified conclusion).
  5.  (5') A *strict absolutist* moral principle just is a true general statement of *that strict form*. (Modified definition).
  6.  (6') So there are no *strict absolutist* moral principles. Particularism (as the denial of strict absolutism) wins.

  **What This Salvaged Argument Shows (and Doesn't Show)**

  *   **It Shows:** The strongest form of generalism (strict, exceptionless, invariant-weight principles) is false. Moral reasoning cannot be reduced to applying rigid rules insensitive to context. Holism is correct.
  *   **It Doesn't Show:** That there are *no* general truths about reasons, *no* useful principles, or that principles play *no* role in moral thought. Defeasible, contributory, or pattern-based principles are compatible with this conclusion. Particularism wins against its strongest opponent (absolutist generalism) but doesn't necessarily entail that *all* talk of principles is useless or false.

  **Conclusion**

  The fatal flaw is the invalid leap from the correct holism in (3) ("no invariant reason-giving just by kind") to the overly strong (4) ("no true general statements whatsoever"). Premise (5) exacerbates this by defining principles only as strict generalizations. The reductio succeeds brilliantly *against this invalid leap and narrow definition*, showing they lead to absurdity.

  The solution is to embrace holism (keep (2) & (3)) while rejecting the inference to (4). The cost is accepting that normative principles, if they exist, must be *defeasible, contributory, or expressive of patterns* rather than strict and exceptionless. This preserves context-dependence while allowing for general truths and avoiding the absurd conclusion that reasons don't exist.

  The salvaged argument is a powerful case for *moderate particularism* or against *absolutist generalism*, but it doesn't eliminate the possibility of more flexible, context-sensitive principles playing a significant role in normative thought. Your instinct to keep (2) is sound; the key is recognizing that (2) doesn't destroy all generality, it just dictates what *form* generality must take.
