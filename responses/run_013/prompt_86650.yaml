prompt: |-
  I'm a statistician by training -- comfortable with Bayesian hierarchical models, likelihood ratios, priors, measurement error, missing data, and data provenance -- and I have essentially no background in classics or historiography. Restate, in the vocabulary I actually use, the historian's problem of how we can know anything about the distant past through the critical use of sources: treating a report as evidence about an event rather than as the event itself; why independent attestation is worth more than a chain of copies; per-source bias versus random noise; the argument from silence; the role of background plausibility in deciding what to believe; the regress of testimony; and the problem that the surviving record is itself a selected sample. Do this as faithfully as you can, step by step, and then give me the residue report: which parts of source criticism map cleanly onto likelihoods, priors, and error propagation; which I had to distort to make fit; and which have no counterpart in my vocabulary at all. Where something doesn't translate, tell me whether the gap is a defect of my framework -- something I would be blind to if I had only the statistics -- or a sign that the historian's distinction was never sharp to begin with. The residue is the part I care about, so don't paper over it.
