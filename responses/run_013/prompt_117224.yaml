  The audience polarization is key. Philosophers know Berkeley's metaphysical works but not The Querist; historians know the economic context but think philosophical readings are anachronistic. That's a tough crowd. 

  For the prep sheet, I'll need to anticipate the most damaging objections from both sides. The historians will probably attack the connection to immaterialism as forced—they'll say Berkeley was just borrowing common mercantilist tropes. The philosophers might question whether economic signs work the same way as perceptual objects in his system. 

  The "hope nobody asks" question should be brutal—maybe about whether Berkeley ever explicitly linked the two in his writings. That could undermine the whole thesis if there's no smoking gun. 

  For replies, I'll suggest grounding the connection in Berkeley's view of language and social constructs, but I'll flag where the arguments are weakest—like the lack of direct textual bridges. 

  The historians' contextual objections will need historical counter-evidence, like Berkeley's unique emphasis on trust over specie. But the weakness there is that contemporaries also used ticket analogies. 

  Prioritizing objections by damage level: the "no evidence" challenge from historians is most dangerous, followed by philosophers questioning the sign theory equivalence. 

  Better structure replies to first validate the questioner's expertise ("You're right that contemporaries used tickets...") before pivoting to Berkeley's distinct spin. That might disarm them. 

