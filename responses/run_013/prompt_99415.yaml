prompt: |-
  For a philosophy of language seminar I have to hand in a specification before I evaluate any particular account: what would a theory of slurs have to get right to count as an adequate account of how these terms mean and what they do? I want the desiderata themselves, not a tour of the literature. Give me the phenomena an adequate account must accommodate, the cases it must adjudicate, and the distinctions it must not collapse, each with the consideration that motivates it; mark each item as either a genuine constraint that any account owes us or a demand that one camp has smuggled in; flag any subset you believe cannot be jointly satisfied, since an inconsistent list would be the most important result the exercise could yield; and tell me which single requirement does the most to exclude otherwise attractive accounts.

  Treat adequacy as relative to a purpose I am fixing here: the account should be good enough to underwrite judgments about what may be said -- whether a term belongs in a classroom, whether a speaker may deploy a reclaimed form, whether a target is entitled to object -- not good enough to settle every question in the metaphysics of meaning.

  I care about at least the following axes, and I want you to argue each one in or out rather than take it as given:

  - Co-extensionality: a slur and its neutral counterpart appear to pick out the same class, so whatever divides them cannot be reference or descriptive content. Must the account treat the pair as one lexical item with two uses, as two items, or as something else?
  - Gradation: offensiveness runs from mild to extreme and shifts with context and audience. Must the account predict the degree of derogation, or only its presence?
  - Projection: how the derogation behaves under negation, in conditionals, in questions, and in reported speech. What pattern must the account capture, and can it do so without simply filing the derogation under presupposition, entailment, or conversational implicature?
  - The neutral-use problem: the derogation often survives even when the speaker plainly lacks the attitude -- quoting, reporting, or speaking as a member of the targeted group. What must be true of the account for this not to be a contradiction?
  - Speaker-independence: contrast a slur with a plain insult such as idiot. Why can the slur's force attach to the group rather than to the individual, and must the account explain that asymmetry?
  - Non-derogatory and reclamatory uses, including a term that is affectionate inside the group and hostile outside it, and the later case in which an outsider adopts the reclaimed form. Is reclamation the same word, a new word, or a distinct use of the same word, and what does the account owe here?
  - Slurs without neutral counterparts, and terms whose slur status is contested -- coined by opponents to name a group that rejects the label. Can a theory stay neutral about whether such a term is a slur, or must it decide, and on what basis?

  Then build the account's hardest test out of two cases you construct yourself: (i) a term that is derogatory only in one dialect or region and innocuous elsewhere, and (ii) a term whose target is defined by ideology rather than by an inherited identity. State explicitly whether a single account can pass both along with the constraints above; if the demands conflict, say which you would give up and why. Only after the list is complete, and briefly, note how the main families of account -- semantic derogation, conventional-implicature or pragmatic views, expressivist views, and deflationary views that deny slurs are theoretically special -- fare against it.
reasoning: |-
  Okay, the user is preparing for a philosophy of language seminar and needs to define what makes a theory of slurs adequate. They want a list of desiderata without a literature review, focusing on phenomena the theory must handle. Let me start by understanding their main axes.

  First, co-extensionality: slurs and neutral counterparts refer to the same group, so the difference isn't descriptive content. How should the theory handle this? Maybe treat them as distinct lexical items sharing reference but differing in expressive content. But must the theory explain why they co-refer? Probably yes, as a constraint.

  Gradation: offensiveness varies. The theory should predict degrees, not just presence. Why? Because real-world usage shows context affects severity. This is a genuine constraint since ignoring gradation oversimplifies.

  Projection behavior: how derogation survives in embeddings. The pattern must be captured without reducing to presupposition or implicature. This is tricky; projection tests might show it's not purely semantic. A constraint because any account must handle linguistic behavior.

  Neutral-use problem: derogation persists even without speaker intent. The theory must allow derogation to be conventional yet not tied to speaker attitude. Constraint, as it's a common phenomenon.

  Speaker-independence: slurs target groups, unlike insults like "idiot." Theory must explain this asymmetry. Genuine constraint because it distinguishes slurs from other pejoratives.

  Reclamation: in-group vs. out-group use. The account needs to explain how the same term can have different meanings based on user identity. Must show it's the same word with polysemous uses. Constraint due to real-world reclamation cases.

  Slurs without counterparts: terms like "k*ke" with contested status. Theory should stay neutral, allowing context to determine status. Not a constraint; it's a camp-specific demand as some theories force a binary.

  Now, test cases: dialect-specific slur (like "yankee") and ideology-based term ("commie"). Can one theory handle both? The dialect case challenges speaker-independence and reclamation. Ideology case tests gradation and co-extensionality. A single account might manage both if it incorporates context and speaker-group dynamics. But conflicts might arise if the theory over-relies on fixed group identities. Giving up rigid co-extensionality for ideology terms could help.

  Assessing theories: Semantic views might struggle with projection and neutral-use. Pragmatic views handle projection but may miss gradation. Expressivist accounts capture attitude but not reclamation. Deflationary views fail most constraints. Hybrid approaches seem strongest here.

  The user's deeper need is a framework for evaluating real-world usage, not metaphysics. They need clear criteria to judge what's sayable in contexts like classrooms or reclaimed uses. Ensuring the desiderata cover practical judgments is key. Also, highlighting where theories fail helps them critique existing accounts. The hardest constraint is non-derogatory uses because it forces theories to accommodate context and speaker identity, which many oversimplify.
answer: |-
  Here is a distilled list of desiderata for an adequate theory of slurs, argued systematically based on the phenomena, with constraints marked, conflicts identified, and the hardest test cases constructed. The focus is on underpinning judgments about permissible utterance, not exhaustive metaphysical explanation.

  ---

  ### **Desiderata for an Adequate Theory of Slurs**
  *(Genuine Constraints = GC; Camp-Specific Demand = CS)*

  1.  **Co-extensionality (GC):**  
      **Phenomenon:** "Chink" and "person of Chinese descent" apply to the same group, yet differ radically in effect.  
      **Requirement:** The account must explain how the terms share reference/extension *while differing fundamentally in their linguistic function*. It cannot collapse the distinction into mere connotation or stylistic variation.  
      **Motivation:** Theories reducing slurs to neutral counterparts + attitude fail (§4, §5). Accounts must treat the pair as **distinct lexical items** sharing extension but differing in conventional linguistic meaning (e.g., encoding expressive content alongside reference).  
      *Why GC?* Reference-fixing is identical; the difference is *linguistically* significant and speaker-independent (§5).

  2.  **Gradation (GC):**  
      **Phenomenon:** "Insensitive" > "culturally appropriative" > "bigoted" > "hate speech" (e.g., "colored" vs. "n****r" in historical US context). Offensiveness shifts with context (e.g., "queer" in LGBTQ+ vs. anti-LGBTQ+ space).  
      **Requirement:** The account must **predict degrees of derogation** and explain contextual variance, not merely binary offensiveness.  
      **Motivation:** Judgments about utterance permissibility (e.g., classroom use) hinge on severity. A theory only marking "offensive/not" cannot guide real-world decisions.  
      *Why GC?* Ignoring gradation obscures how slurs function in social practice.

  3.  **Projection (GC):**  
      **Phenomenon:** Derogation persists in:  
      - Negation: *"Lee isn't a chink."* (Still offensive)  
      - Questions: *"Is Lee a chink?"* (Offensive even if sincere)  
      - Conditionals: *"If Lee is a chink, he’ll be good at math."* (Derogates regardless of truth)  
      - Reporting: *"Kim said Lee is a chink."* (Often implicates reporter's endorsement)  
      **Requirement:** Capture the **robust survival of derogation** in embeddings. This pattern cannot be fully reduced to presupposition (fails in questions/conditionals), entailment (cancellable in some reports), or conversational implicature (too context-independent).  
      **Motivation:** Determines if "mention vs. use" distinctions or indirect reports absolve speakers.  
      *Why GC?* Projection is a core linguistic behavior demanding explanation; existing pragmatic categories fit imperfectly.

  4.  **Neutral-Use Problem (GC):**  
      **Phenomenon:** Derogation persists when:  
      - Quoting: *"They called him a k*ke."* (Can still offend)  
      - Reporting: *"Alex believes all f*gs are immoral."* (Often offensive)  
      - In-group use: A gay man saying *"We’re here, we’re queer!"* (Non-derogatory)  
      **Requirement:** The account must **separate derogation from speaker intent** in key cases. It must allow derogation to be a *conventional* property of the term itself, activated by utterance context (e.g., speaker-group membership, historical oppression), not contingent on the speaker's current attitude.  
      **Motivation:** Explains why targets object even to "neutral" reports, and why in-group use can be non-derogatory.  
      *Why GC?* Speaker-independence (§5) is fundamental.

  5.  **Speaker-Independence (GC):**  
      **Phenomenon:** *"idiot"* insults the individual; *"k*ke"* insults Jews *as a group*, even if applied to one person.  
      **Requirement:** Explain the **asymmetry between slurs and generic insults**: Slurs must conventionally associate the target with a *socially subordinated identity*. The derogation is *group-directed* and draws force from systemic oppression, not individual evaluation.  
      **Motivation:** Underpins entitlement to object (§4) and distinguishes slurs from other pejoratives.  
      *Why GC?* Central to why slurs are uniquely harmful and why reclamation (§6) is possible.

  6.  **Non-Derogatory & Reclamatory Uses (GC):**  
      **Phenomenon:** *"queer"* is hostile when used by outsiders but affectionate/neutral within LGBTQ+ communities; outsiders using reclaimed terms (e.g., a straight person saying *"queer"*) often causes offense.  
      **Requirement:** Treat reclamation as a **context-driven shift in the *same* lexical item**, where meaning is modulated by speaker-group membership and intent. The account must explain why outsider use of a reclaimed term *typically* fails to be neutral/non-derogatory.  
      **Motivation:** Essential for judging when reclaimed terms may be used (e.g., in classroom discourse by non-members).  
      *Why GC?* Reclamation is a real linguistic phenomenon; theories must accommodate polysemy.

  7.  **Slurs Without Neutral Counterparts & Contested Slurs (CS):**  
      **Phenomenon:**  
      - No counterpart: "k*ke" lacks a precise neutral synonym (cf. "Jewish person").  
      - Contested: "TERF" (coined by critics to describe gender-critical feminists who reject the term).  
      **Requirement:** The account **need not decide** if contested terms *are* slurs. It must provide *criteria* (e.g., conventional association with group-directed contempt + link to systemic oppression) to adjudicate cases contextually.  
      **Motivation:** Avoids stipulative definitions; allows for cultural/linguistic negotiation.  
      *Why CS?* "Slur" is a normative category; theories can provide tools without binary verdicts. Demanding absolute neutrality is unrealistic, but requiring *ad hoc* decisions smuggles in particular meta-linguistic views.

  ---

  ### **Conflicts & Trade-offs**
  *   **Inconsistent Triad:** Co-extensionality (GC1), Speaker-Independence (GC5), and Reclamation (GC6) **cannot be jointly satisfied** by purely semantic (e.g., truth-conditional) or purely pragmatic (e.g., Gricean) accounts.  
      - *Conflict:* GC1 demands shared reference, GC5 demands group-directed derogation tied to oppression, GC6 demands the *same* word can lose derogation based on speaker identity. Semantic views struggle with GC6; pragmatic views struggle with GC1 & GC5.  
      *Resolution:* Requires a hybrid view (e.g., conventional expressive content + sociolinguistic constraints on felicity).
  *   **Most Exclusionary Requirement:** **Non-Derogatory Uses (GC6)** excludes otherwise attractive accounts. Semantic derogation theories (slurs encode contempt) struggle with in-group non-derogation. Pure conventional implicature views struggle with reclamation. Deflationary views deny the phenomenon entirely.

  ---

  ### **Hardest Test Cases**
  1.  **Dialect-Specific Derogation:**  
      *Term:* "Yankee" (in UK English, mildly derogatory for Americans; in US English, neutral or positive, especially in "New Yankee").  
      *Challenge:* Must explain how offensiveness is **conventional yet geographically relative** without fragmenting the lexicon. Tests **Gradation (GC2), Projection (GC3), and Reclamation (GC6)**.

  2.  **Ideology-Based Targeting:**  
      *Term:* "Commie" (derogatory for communists; targets political affiliation, not birth identity).  
      *Challenge:* Must explain **Speaker-Independence (GC5)** – how it derogates *all* communists as a group – and whether it qualifies as a slur given mutable membership. Tests **Co-extensionality (GC1)** with "communist" and **Contested Slurs (CS7)**.

  **Can a single account pass both?**  
  **Yes, but only if:**  
  - It treats derogation as **conventional expressive content** tied to a *socially salient category* (whether ethnic, geographic, or ideological).  
  - It incorporates **contextual parameters** (speaker-group membership, dialect, historical oppression) to modulate gradation and felicity.  
  - It accepts that **"group"** is defined by shared social perception, not essential properties.  
  *Trade-off required:* Relax strict **Co-extensionality (GC1)** for ideology-based terms. "Commie" and "communist" may not share identical extensions (if "communist" is self-ascribed), but they corefer under the *speaker's categorization*. This preserves Speaker-Independence (GC5) but weakens GC1 for non-demographic slurs.

  ---

  ### **How Major Theories Fare**
  *(Brief Assessment Against Constraints)*

  1.  **Semantic Derogation (e.g., truth-conditional contempt):**  
      Fails: Neutral-use (§4), Reclamation (§6), Gradation (§2). Strong on Co-extensionality (§1) & Projection (§3).

  2.  **Conventional Implicature (CI):**  
      Fails: Non-derogatory uses (§4, §6), Gradation (§2), Speaker-independence (§5). Strong on Projection (§3).

  3.  **Pragmatic (e.g., presupposition or pejorative tone):**  
      Fails: Projection (§3 – pattern mismatches), Neutral-use (§4), Speaker-independence (§5). May handle Gradation (§2).

  4.  **Expressivist (e.g., direct expression of attitude):**  
      Fails: Neutral-use (§4), Speaker-independence (§5), Reclamation (§6). Strong on Gradation (§2) if attitudes vary.

  5.  **Deflationary (not theoretically special):**  
      Fails: All constraints except *possibly* Contested Slurs (§7). Denies core phenomena.

  6.  **Hybrid (e.g., CI + sociolinguistic constraints):**  
      Best fit: Handles Co-extensionality (§1), Projection (§3), Neutral-use (§4), Speaker-independence (§5), Reclamation (§6) via context-sensitive felicity conditions. May struggle with Gradation (§2) without additional machinery.

  **Strongest overall:** Hybrid accounts incorporating **conventional expressive content** + **contextual felicity conditions** tied to speaker/audience identity and historical oppression. They satisfy the most constraints, including the test cases, by making derogation *conventional but contextually modulated*. The cost is complexity and less tidy taxonomies of meaning.
