  Let's write the five numbered items as required:

  1. **Setup and materials**: Prepare 16 index cards: each has one fact (8 true, 8 false; common knowledge) and a belief status ("Believe" or "Don't Believe") randomly assigned. Also, have a visible scoring chart: 2 points for a true fact, 1 for false (if unchallenged, but we'll skip challenges to save time), plus 3 bonus if the belief claim is correct and the fact is true.

