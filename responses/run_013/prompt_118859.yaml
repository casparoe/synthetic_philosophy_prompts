answer: |-
  1. **Setup and materials**: Prepare 16 index cards: eight with a simple true fact (e.g., "Paris is the capital of France") and eight with a false one (e.g., "The moon is made of cheese"); randomly assign each a hidden "belief" sticker (half "Believe," half "Don't Believe"). Students get one card each, paper for statements, and a visible scoring chart: +2 for a true fact, +1 for false, +3 bonus if the belief claim matches your sticker *and* the fact is true.  

  2. **Rules and payoffs**: Two rounds; each student writes one statement per round combining any fact and a belief claim (e.g., "I believe that [fact]"). In round one, they choose freely; in round two, they *must* use their card's fact and sticker. Payoffs: Maximize points via truth (e.g., true fact + matched belief = 5 points), but false facts risk low scores.  

  3. **The moment it bites**: In round two, students with a *true* fact and "Don't Believe" sticker must write/read, "I don't believe that [true fact]" to earn 5 points—but they stall, laugh, or refuse, feeling the absurdity despite knowing it’s "true" per the game.  

  4. **The debrief**: Reveal "Moore's paradox": Contrast the omissive ("P is true, but I don’t believe P"—unassertable yet possibly true) and commissive ("I believe P, but P is false") versions; tie to their round-two struggle, showing how truth clashes with assertability.  

  5. **What'll go wrong plus what the activity can't reach**:  
     - **Go wrong**: Fast players lie about beliefs to dodge discomfort and grab points; slow ones bog down time verifying facts; forced round-two honesty may feel artificial.  
     - **Can't reach**: Why *assertion* implies belief (needs your explanation of conversational norms), and how the paradox challenges theories of self-knowledge or intentionality—bridge this post-game.
