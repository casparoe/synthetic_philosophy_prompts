     - Additionally, if the belief claim is correct (matches the assigned status) AND the fact is true, they get 3 bonus points. Otherwise, no bonus.

     - Therefore, maximum 5 points for a true fact with correct belief claim.

     - We run two rounds. In the first round, students can choose any fact. In the second round, tell them: "To maximize your score, you must state the fact on your card and your assigned belief status." This forces the Moorean case for those with true fact and "Don't Believe".

  3. **The moment it bites**: In round two, the students with a true fact and "Don't Believe" status must write and then read aloud: "I don't believe that [true fact]." They will hesitate or feel absurd. Even if they do it, the class might react. This is the moment.

  4. **The debrief**: After the game, explain Moore's paradox: 
     - Omissive: "P is true, but I don't believe that P." 
     - Commissive: "I believe that P, but P is false." 
     - Note that in the game, the omissive version was encountered. Even if true, it's unassertable because asserting P normally implies you believe it, so you are saying you believe P and you don't believe P at the same time. The commissive version is also problematic because asserting that you believe P implies that you take P to be true, but then you say P is false.

  5. **What'll go wrong plus what the activity can't reach**:
     - **What'll go wrong**: 
          - Time: The game might run long. 
          - Students might avoid the Moorean sentence by stating a different fact or lying about belief (but we force them to use the card's fact and status in round two). 
          - Some might not feel the paradox because they are role-playing. 
          - The scoring might be confusing. 
          - If a student with the Moorean status says it without hesitation, the moment might be lost. 
     - **What the activity can't reach**: 
          - The deep explanation of the norm of assertion: that asserting P represents that you believe P. 
          - The self-referential nature and the reason why the commissive version is also paradoxical. 
          - The connection to broader issues in philosophy of mind (like introspection, belief formation). 
