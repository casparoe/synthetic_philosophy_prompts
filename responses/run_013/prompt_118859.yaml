  Alternatively, we can change the scoring to heavily penalize false facts? But then stating a false fact is risky. However, the main issue is avoiding the Moorean sentence by misreporting belief.

  We might accept that some students will avoid the paradox by lying about their belief. Then in the debrief, we can note that the game had an incentive to tell the truth about the fact (because 2 > 1) but also an incentive to report belief truthfully only when it matched and the fact was true. But when the fact was true and they didn't believe, they had to choose: lie about belief (say "I believe") and get 5 points without the paradox, or tell the truth and get 5 points but face the paradox. We hope that the psychological barrier (the absurdity) will make them hesitate to say the Moorean sentence even if they choose to tell the truth.

  But note: the student might just not have any true fact they don't believe? So we must assign the "Don't Believe" status to a true fact. How? We assign a true fact and then tell them that their private belief status is "Don't Believe". So they know the fact is true (because we told them) but we are instructing them to act as if they don't believe it? That might feel artificial.

  Alternatively, we can assign a false fact to some and true to others, and then assign a belief status that might or might not match. But then we have four cases:

     - True fact, Believe: easy to state and get 5 points.
     - True fact, Don't Believe: the Moorean case. They must state the true fact and say they don't believe it. They get 5 points if they do, but it's hard.
     - False fact, Believe: They can say the false fact and say they believe it. They get 1 point (for false fact) and no bonus (because the belief claim is only bonus if the fact is true) -> total 1 point. Alternatively, they could lie and say they don't believe it? But then they get 1 point and if the belief claim is correct (they don't believe) but the fact is false, then no bonus -> 1 point. So no bonus in this case.
     - False fact, Don't Believe: They can state the false fact and say they don't believe it. Then they get 1 point for the false fact and 3 bonus points? Wait: the rule says bonus only if the belief claim is correct AND the fact is true. So in this case, the fact is false -> no bonus. They get 1 point. Alternatively, they could say they believe it? Then they get 1 point and no bonus.

