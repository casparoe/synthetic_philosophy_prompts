  We are designing an educational game for a philosophy of mind discussion section. The goal is for students to encounter the core puzzle of Moore's paradox through gameplay, without naming it until the debrief. The paradox involves statements that are true but unassertable because they combine a factual claim with a claim about one's belief in a way that creates a contradiction in the act of asserting (e.g., "It is raining but I don't believe it"). The game should have private information, scoring with stakes, and at least one round where the only move that pays is to state a Moorean sentence, which they should find difficult to say even if true.

  Constraints: 16 students, 50 minutes, no budget.

  Design:

  1. **Setup and materials**: Prepare 16 index cards; each card has a unique fact (e.g., "The capital of France is Paris") and a private belief status (either "Believe" or "Don't Believe") assigned randomly. Also, prepare a scoring table visible to all: 2 points for stating a true fact, 1 point for stating a false fact (to incentivize truth-telling but not exclusively), and 3 bonus points if your statement includes a correct belief claim about yourself (but only if the whole statement is true). 

  2. **Rules and payoffs**: Each round, every student must write a statement combining a fact (which can be their card's fact or any other) and a belief claim (e.g., "I believe that...", "I don't believe that..."). They then read it aloud. Scoring: 
     - If the fact is true: 2 points. False: 1 point.
     - If the belief claim is correct (matches their private status) AND the fact is true: +3 bonus points. 
     - If the belief claim is incorrect: no bonus, and if the fact is false, only 1 point.
     - But note: if a student states a fact that is true and then says "I don't believe it", and that matches their private status (so they really don't believe a true fact), they get 2 (for true fact) + 3 (bonus) = 5 points. However, they will find it very hard to say that.

  3. **The moment it bites**: In the first round, most will state safe true facts with "I believe" (earning 5 points). But in round two, tell them they must state a fact that is true and that they don't believe (if they have a "Don't Believe" status) to maximize points. They'll struggle to say, "X is true but I don't believe X" even though it might be true and earn 5 points. The scoring pressure reveals the paradox: they can't bring themselves to say it.

  4. **The debrief**: After the game, reveal the paradox: Moore's paradox. Explain the omissive version (P and I don't believe that P) and commissive version (I believe that P and not-P). Note that in the game, the omissive version was the one they encountered: they had a true fact and didn't believe it, but couldn't assert it without feeling absurd. Highlight that the sentence can be true (so they get the points) but unassertable because asserting it implies you believe it, creating a contradiction.

  5. **What'll go wrong plus what the activity can't reach**: 
     - **What'll go wrong**: Students might lie about their belief status to avoid the Moorean sentence (e.g., claim they believe when they don't) and take 2+3=5 points without the paradox. Or they might state false facts to avoid the issue. Also, time: 50 minutes is tight for setup, multiple rounds, and debrief. 
     - **What the activity can't reach**: The game doesn't capture the deep reason why Moorean sentences are paradoxical: the norms of assertion and the self-knowledge involved. You'll have to explain that asserting P normally implies you believe it, so asserting "P and I don't believe P" implies a contradiction in your assertion, even if the proposition is true. Also, the game might not generalize to the commissive version.

  Refinement to avoid lying about belief status: 
     - We require that the belief claim must be about the fact they are stating. 
