answer: |-
  ## The Veridia Expectation

  The payout clerk’s terminal chimed, a soft, insistent sound like a coin dropped on marble. Marta Rhine, Senior Resolution Officer Grade III, didn’t look up immediately. She was tracing the final logic path of Market #C-7821: *Would the Veridian Welfare Expectation Long-term Link (WELL) index be higher in 12 months if the proposed Riverside Greenway expansion proceeded?* The conditional market had opened at WELL 100.35, traded actively for months, and settled yesterday at a confident 102.17 – meaning the market believed the Greenway would *raise* the WELL index compared to the counterfactual branch where it wasn’t built. Policy adopted. Now, the payout: traders who bought the "Yes" outcome received 102.17 minus their purchase price per contract. The "No" traders got nothing. Routine.

  Marta clicked ‘Certify’. The chime ceased. Funds flowed invisibly through the city’s central clearing ledger. Another policy enacted based on the expectation of the WELL’s future value. Just like every policy for the past twenty-two years. The WELL *was* Veridia’s beating heart, its single, sacred measure. Not happiness, not health, not wealth – but the market’s *expectation* of what the WELL itself would be next year. A number that measured only its own anticipated shadow.

  Her terminal pinged again. A priority alert from the Audit Oversight Bureau. Subject: *Anomalous Correlation Patterns – WELL Index vs. Underlying Metrics*. Attached was a dense report. Marta sighed, pushing back from her desk. Outside her window in the Resolution Annex, Veridia sprawled – mid-sized, prosperous, defined by the slow, brown curve of the Verid River. The city thrived, didn’t it? Clean streets, decent schools (though Tomas’s scholarship at the Lyceum depended *heavily* on the WELL staying above 100), low unemployment. The system worked. Ends set by vote: maximize the WELL. Means determined by the conditional markets: what action *causes* the WELL to be higher in five years? It was elegant. Self-contained.

  The report was not elegant. Page after page of graphs and statistical analysis showed a chilling divergence. Over the past eighteen months, the correlation coefficients between the WELL index and *every* conceivable underlying metric – hospital admissions, retail sales volume, river pollution levels, public satisfaction survey residuals (still collected quietly by the Bureau of Civic Data), even energy consumption – had plummeted towards zero. Then crossed it. Now, they were trending negative. The WELL was rising steadily, beautifully, from 98.72 when Marta started this job to today’s robust 102.45. But according to the data, nothing tangible in Veridia was improving in a way that justified this climb. In fact, some things were subtly worsening. The WELL wasn't reflecting Veridia; it was floating free.

  A cold knot formed in Marta’s stomach, unrelated to audit reports. Tomas’s Lyceum fees. The scholarship threshold was WELL 101.00. Below that, they paid full freight. Impossible on her salary. The steady rise had been a comfort. Now, this report suggested that rise was… air.

  She spent the afternoon buried in data streams and market feeds. She watched the WELL ticker. 102.46… 102.47… 102.48. It moved on whispers, on rumours, on the sheer momentum of its own past performance. Traders weren’t buying contracts based on factory output or school test scores; they were buying because other traders were buying, betting the number would be higher tomorrow because it was higher today. The perpetual contract had become a perpetual motion machine, powered by belief in its own continuation. The system designed to settle means based on predicted *ends* had lost sight of the ends entirely. The end *was* the expectation.

  The next morning, Market #C-8913 opened. The question was momentous: *Would the WELL index be higher in five years if the city allocated the annual infrastructure budget surplus to upgrading the Northside Reservoir versus expanding the Southside Solar Farm?* Millions of civic credits hung in the balance, along with the future water security or energy independence of entire districts. The initial trading was volatile, the implied probability swinging wildly.

  Then, around mid-morning, a strange ripple occurred. No news hit the wires. No underlying data shifted. Yet, the "Reservoir" contracts began a sharp, sustained climb. The implied WELL outcome for the Reservoir branch jumped from 103.10 to 103.80 in under an hour. Marta watched, transfixed, cross-referencing feeds. Nothing. Absolutely nothing had changed in Veridia except the collective belief of the traders, seemingly sparked by… what? A prominent analyst's offhand remark about "water scarcity narratives"? A large, anonymous buy order?

  By lunch, the Reservoir contracts had stabilized around an implied WELL of 104.05, a full point above the Solar Farm branch. The market was confident: the Reservoir upgrade would lead to a higher WELL. Marta knew, with the cold certainty of the audit report burning in her mind, that this confidence wasn't based on hydrological studies or engineering reports. It was based on the market’s belief that *other traders believed* the Reservoir upgrade would make the WELL index higher. The loop was tightening, closing in on itself. The WELL wasn’t just decoupled; it was being actively steered by the expectations it was supposed to measure.

  She called in Ben Shale, a junior analyst known for his bluntness. "Ben, run a trace. That surge in C-8913 Reservoir contracts this morning. Source catalyst?"

  Ben returned an hour later, looking uneasy. "That's the thing, Marta. No catalyst. Not really. We tracked the initial buys to a syndicate – Corinth Hedge. Big players. But they didn't issue any analysis. Didn't cite any data. They just… bought. Aggressively. Then others followed. It was pure momentum. Like they were betting on the *idea* of the Reservoir being the WELL-booster, not the reality."

  "It *is* the idea," Marta said quietly, staring at the WELL ticker: 102.52. "That’s all the WELL is now. An idea betting on itself." Tomas’s face flashed in her mind – his excitement about the advanced physics module starting next term. Contingent on the Lyceum's funding, contingent on the WELL. "What happens," she asked, her voice tight, "when the idea runs out of things to bet on except itself?"

  The Reservoir market settled at close with an implied WELL of 104.12. Policy path locked in: Reservoir upgrade. The Solar Farm expansion vanished into the uncountable counterfactual branches. The payout process would begin tomorrow. Marta’s department, Resolution, had to certify the settlement price and trigger the transfers. It was her signature.

  She couldn’t sleep. She lay awake, the numbers scrolling behind her eyelids: 102.52… Tomas’s tuition invoice… Reservoir contracts… Correlation coefficients diving into negative territory… 104.12… The system was eating its own tail. The vote next month was a formality; the ends were always "Maximize WELL". But what were they maximizing? A number sustained only by the collective faith that it would be higher tomorrow, a faith manipulated by large bets placed not on Veridia’s welfare, but on the market’s predictable reaction to the bet itself. The institution existed solely to discuss, to validate, to perpetuate the expectation of its own success metric. It was perfect, closed, and utterly hollow.

  The next day, the payout queue for C-8913 hit her terminal. Hundreds of thousands of contracts. Millions in credits waiting to shift hands based on the certified settlement value of 104.12. All based on a counterfactual – the WELL in a future where the Reservoir was built, a future no one would ever see because the Solar Farm branch was dead. A future defined solely by the expectation baked into that 104.12 price.

  Marta pulled up the audit report again. The graphs were damning. The WELL’s rise was statistically independent of Veridia. It was a bubble inflated by the system designed to measure it. Certifying this payout wasn't just approving a transaction; it was injecting pure belief-fuel into the engine, making the decoupling worse. It was rewarding the manipulation. But refusing… that was unthinkable. It would shatter confidence. The WELL would plummet. The markets would freeze. The city’s entire decision-making apparatus would seize. Tomas would lose his place at the Lyceum. Chaos.

  She thought about the designers two generations ago, replacing messy surveys with the elegant perpetual contract. They’d wanted objectivity, efficiency. They’d built a god that only worshipped its own reflection.

  Her finger hovered over the ‘Certify’ command. The system demanded it. The logic was internally consistent: the market spoke, Resolution certified. But certifying felt like pouring sand into a broken gauge and declaring the engine sound. The WELL ticker on her secondary screen read 102.55. Steady. Unaware.

  Marta Rhine, Senior Resolution Officer Grade III, responsible for ensuring the smooth functioning of Veridia’s unique machinery, slowly closed the payout authorization window. She opened a new screen – a direct, logged line to the Chief Auditor and the Head of Market Oversight. Subject: *Urgent: Certification Hold – Market C-8913. Grounds: Probable Settlement Based on Reflexive Expectation, Divorced from Underlying Welfare. Attached: AOB Anomaly Report #7743.*

  She typed a single sentence in the message body: *We are paying out on a number that predicts only itself. Attached report demonstrates systemic decoupling. Request emergency review before payout processing proceeds.* Her finger trembled slightly over the ‘Send’ key. Sending this wouldn’t stop the system, not immediately. But it would inject doubt into its pristine, self-referential core. It might start the unraveling. Tomas’s future, the city’s stability, hung in the balance of that doubt.

  She took a deep breath, the sterile air of the Resolution Annex tasting suddenly thin. Outside, the Verid River flowed, indifferent. The WELL ticker clicked over to 102.56. Up. Always up. Marta looked at the number, then at the ‘Send’ button, then back at the number. The loop was complete, and she was trapped inside it, holding the only tool that might break the glass – a report proving the emptiness within. The cursor blinked, a tiny, insistent heartbeat against the unchanging glow of the WELL.
