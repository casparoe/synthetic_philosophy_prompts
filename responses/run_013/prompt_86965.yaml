answer: |-
  ### Decision Tree for the Reduction/Emergence Debate  
  **Assumption:** All students accept a single physical substrate (physicalism). The tree sorts views on "levels" and higher-level explanation.  

  #### Start: Does the system exhibit *universality* (systematic insensitivity of lower-energy behavior to microscopic details, e.g., phase transitions or fixed points in renormalization group flow)?  
  - **Yes** → Q1: How should universality be interpreted?  
    - As **reduction**: The effective field theory is derivable from the microphysics.  
      → *Leaf:* **Reduction via EFT/RG** (unnamed; e.g., some reductionists).  
    - As **emergence**: Universality reveals novel, irreducible patterns.  
      → *Leaf:* **Weak emergence** (e.g., Batterman, Morrison).  
    - As a **third thing**: EFTs are autonomous "templates," not reducible nor emergent.  
      → *Leaf:* **Autonomy of scales** (unnamed; e.g., EFT pragmatism).  
  - **No** → Proceed to Q2.  

  #### Q2: How are "levels" individuated?  
  - By **scale, energy, or composition** (e.g., molecules compose cells) → Proceed to Q3.  
  - Only by **usefulness of vocabulary** (no objective hierarchy) → Proceed to Q6.  

  #### Q3: Is a higher-level kind (e.g., "gene" or "pain") realized by a *unique* lower-level kind?  
  - **Yes** → Q4: Can higher-level laws be derived from lower-level laws?  
    - Yes (with identities as bridge principles) → *Leaf:* **Nagelian reduction**.  
    - No → Q5: Why blocked?  
      - Epistemic limitation (e.g., complexity) → *Leaf:* **Weak emergence**.  
      - Ontological fact → *Leaf:* **Strong emergence** (e.g., emergent laws).  
  - **No** (multiple realizability, e.g., pain realized by diverse neural states) → Proceed to Q4.  

  #### Q4: Is derivation of higher-level laws *in principle possible* via bridge principles?  
  - **Yes** (bridge principles are derivable, e.g., via disjunctive kinds) → *Leaf:* **Reduction with multiple realizability** (unnamed; e.g., Lewis, Kim).  
  - **No** (bridge principles are fundamental) → Q5: Why blocked?  
    - Epistemic limitation → *Leaf:* **Non-reductive physicalism** (e.g., Fodor, Putnam).  
    - Ontological fact (with novel causal powers) → *Leaf:* **Strong emergence** (e.g., O'Connor, emergent causation).  

  #### Q6: Is higher-level vocabulary *indispensable* for explanation/prediction?  
  - **Yes** → *Leaf:* **Explanatory pluralism / Autonomy of special sciences** (e.g., Fodor, Dennett).  
  - **No** → Q7: Is higher-level vocabulary *true*?  
    - Yes (but dispensable) → *Leaf:* **Redundant realism** (unnamed; unattractive, rarely held).  
    - No (merely useful fiction) → *Leaf:* **Eliminativism** (e.g., Churchland on folk psychology).  

  ---

  ### Key Features  
  1. **Named Views Located**:  
     - Nagelian reduction (derivation with unique realization).  
     - Non-reductive physicalism (multiple realizability + epistemic block).  
     - Strong emergence (ontological block + novel causation).  
     - Weak emergence (epistemic block alone).  
     - Explanatory pluralism (vocabulary indispensability).  
     - Eliminativism (vocabulary dispensable and false).  
     - EFT/RG universality options (reduction, weak emergence, autonomy).  

  2. **Unnamed Leaves**:  
     - Reduction with multiple realizability (derivable disjunctive bridges).  
     - Autonomy of scales (EFT as "third thing").  
     - Redundant realism (true but dispensable vocabulary).  

  3. **Indistinguishable Leaves**:  
     - **Strong emergence** from Q4 (multiple realizability + ontological block) and Q4 (unique realization + ontological block) are *not separated*. *Why?* Both paths share the core commitment to fundamental, causally potent higher-level properties. The tree prioritizes the *reason for irreducibility* over realization type.  

  4. **Unoccupied Branches**:  
     - **Redundant realism** (Q7): True but dispensable higher-level vocabulary. *Diagnosis:* Unattractive—truth without utility undermines explanatory value.  
     - **Ontological block without causal novelty** (not in tree): E.g., irreducible bridge principles with no new causal powers. *Diagnosis:* Incoherent—ontological gaps imply novel causal structure.  

  5. **Probed Dimensions**:  
     - Levels: Scale/energy, composition, or vocabulary.  
     - Kinds: Unique vs. multiple realization.  
     - Derivation: Availability, epistemic vs. ontological blocks.  
     - Universality: Explicitly placed at the start.  

  ---

  ### How to Use This Tree  
  - **In seminar**: Work through cases (e.g., thermodynamics, consciousness) by answering branch questions. Locate your view.  
  - **Focus**: Branches force choices on *concrete issues* (e.g., "Can bridge principles be derived?"), not abstract labels.  
  - **Time**: Designed for a 60-minute seminar. Groups can tackle different branches.  

  *Refine your view—some leaves are lonely!*
