  First, I need to unpack the user's observation. They're describing a scenario where definitions aren't neutral but carry evaluative content, and when used in a deductive argument, the conclusion is predetermined by the definition. This isn't exactly begging the question because begging the question assumes the conclusion in the premises more explicitly. Here, the definition itself is doing the heavy lifting.

  I recall that philosophers like John Searle and William Connolly have written about how definitions can be persuasive or contestable. Searle's constitutive rules come to mind—defining something in a way that includes values or functions. For example, defining "democracy" in a way that inherently includes certain rights makes any policy violating those rights "undemocratic" by definition. That's not proof; it's stipulation.

  Then there's the is-ought problem from Hume. Definitions are descriptive (is), but when they include normative elements (ought), deducing conclusions from them smuggles in values without justification. That's key here. The user's example: defining "sentimental" in a way that includes weakness, then deducing a character is weak because they're sentimental. The definition already contains the evaluation.

  I should also differentiate this from begging the question. Begging the question is circular reasoning where the premise and conclusion are the same. Here, it's more subtle—the definition is framed as neutral but isn't, and the deduction appears valid but is actually tautological because of the definition. So, it's a form of question-begging definitions, but with nuances.

  The user might be using this for their historical fiction, perhaps to critique Hobbes or illustrate debates in their narrative. They need precise terminology to articulate this logical flaw. Terms like "persuasive definition" (Stevenson) or "stipulative definition" come up, but neither fully captures the deductive laundering aspect. 

  Connecting to Hobbes: his idea that ethics/politics could be certain like geometry if they started with definitions and deduced from them. But geometry deals with non-contested concepts (e.g., triangles), while "justice" is essentially contested. So, defining "justice" isn't neutral; it's political. Hobbes might define "sovereign power" in a way that makes obedience necessary, but that's stipulative, not deductive. The user is spot-on about this being central to Hobbes's potential error.

