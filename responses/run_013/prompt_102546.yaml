  Edge cases: When is this valid? In formal systems (like geometry), definitions are arbitrary but uncontested. In ethics, if all parties accept the definition, the deduction holds, but that's rare. The boundaries lie in whether the definition is stipulated without controversy or if it's masking contested values.

  In conclusion, the best term is "question-begging definition" or "persuasive definition used deductively," emphasizing the hidden normativity and the laundering effect. This helps the user articulate the flaw in Hobbes and enrich their fiction with nuanced logical critiques.
answer: |-
  Your observation cuts to the heart of a profound flaw in applying formal deductive logic to essentially contested concepts like ethics and politics. The maneuver you describe is indeed distinct, though related to both begging the question and evaluative definitions. The most precise and illuminating label for this specific move is a **Question-Begging Definition (or Stipulative Definition)** used within a deductive framework, often functioning as **Conceptual Legislation** or exhibiting **Hidden Normativity**.

  Here's a breakdown of the phenomenon, its distinctions, its edges, and its relevance to Hobbes:

  1.  **The Core Phenomenon:**
      *   **The Move:** A contested term (e.g., "just," "sentimental," "free") is given a specific, often narrow, stipulative definition *presented as neutral and foundational*.
      *   **The Deduction:** A seemingly valid syllogism is constructed using this definition as a premise.
      *   **The Laundering:** The conclusion appears logically necessary ("Therefore, Policy X is unjust"). However, the substantive evaluative claim ("Policy X is bad/wrong") was *already embedded* in the initial definition (e.g., defining "just" in a way that inherently excludes Policy X). The deductive process merely unpacks the definition's implications, giving the illusion of objective proof where none exists.
      *   **The Result:** The *real* argumentative work happened in the act of definition. The deduction serves to mask the contestable normative choice inherent in that definition, laundering it as a logical inevitability.

  2.  **Distinction from Begging the Question (Petitio Principii):**
      *   **Begging the Question:** Assumes the truth of the conclusion *within the premises themselves*. The circularity is usually more direct and apparent within the syllogism. E.g., "Policy X is unjust because it violates justice." The premise *is* the conclusion restated.
      *   **Question-Begging Definition:** The circularity is *displaced* into the definition. The definition itself contains the contested conclusion in disguised form. The syllogism *using* that definition appears valid and non-circular *on its own terms* ("1. Justice requires procedure Y. 2. Policy X lacks procedure Y. 3. Therefore, Policy X is unjust"). The begging happens *before* the syllogism, in the act of defining "justice" as requiring Y. It's more subtle and relies on the definition being accepted as a neutral starting point.

  3.  **Distinction from Evaluative Definitions (Persuasive Definitions - Charles Stevenson):**
      *   **Evaluative/Persuasive Definitions:** These *openly* or *transparently* fuse descriptive meaning with positive or negative evaluation. E.g., Defining "sentimental" as "excessively emotional and therefore weak." The evaluative component ("weak") is explicit.
      *   **Question-Begging Definition (as used here):** Often *masks* its evaluative component *within a seemingly neutral, descriptive definition*. The definition might sound purely factual or conceptual but is crafted to *imply* the evaluation through logical deduction. E.g., Defining "sentimental" as "displaying emotion disproportionate to the object's value." This *sounds* descriptive, but "disproportionate" smuggles in the normative judgment that there *is* an objectively correct proportion. The deduction ("Character Z displays emotion disproportionate to the object's value. Therefore, Character Z is sentimental.") makes the negative judgment ("disproportionate") seem like an inherent property of the term "sentimental," rather than an open evaluation. The evaluation is laundered through the definition and subsequent deduction.

  4.  **Why "Question-Begging Definition" is the Best Fit:**
      *   It directly names the act: the definition itself assumes the answer to the very question under debate ("What *is* justice?" or "What constitutes *true* sentimentality?").
      *   It highlights the *stipulative* nature: The definition is presented as foundational truth, not as a contestable proposal.
      *   It captures the *displacement* of the argument: The real fight is over the definition, not the deduction that flows from it.

  5.  **Edges and Nuances:**
      *   **Degree of Concealment:** The phenomenon exists on a spectrum. Sometimes the normativity in the definition is very well-hidden (e.g., defining "democracy" purely procedurally, excluding substantive outcomes). Other times, it's more obvious upon inspection (defining "freedom" solely as "absence of legal constraint").
      *   **Shared vs. Contested Concepts:** The maneuver fails precisely because the concepts are *essentially contested* (W.B. Gallie) – there's no universally agreed-upon, neutral definition of "justice," "freedom," "sentimentality," etc. Applying this to non-contested concepts (like geometric shapes) doesn't generate the same problem because the definitions *are* widely agreed upon and stipulative without significant normative baggage.
      *   **Intent vs. Effect:** The person proposing the definition might genuinely believe it *is* neutral and foundational. The "laundering" effect occurs regardless of intent, due to the nature of deduction combined with contested concepts.
      *   **The "Is-Ought" Gap (Hume):** This move is fundamentally an attempt to bridge the is-ought gap illicitly. The definition (ostensibly descriptive/"is") contains a hidden "ought." The deduction then derives an "ought" conclusion ("Policy X is unjust") from premises that appear purely descriptive but are actually normative.
      *   **When Deduction *Can* Work:** In purely formal systems (like geometry), deduction *is* powerful because the definitions and axioms are stipulated and uncontroversial within that system. Deduction can also work in ethics/politics *if* the disputants genuinely agree on the foundational definitions and principles beforehand. But this is rare with genuinely contested concepts.

  6.  **Hobbes and the Geometric Mistake:**
      You are absolutely correct to pinpoint this as the critical flaw in Hobbes's project. His ambition was noble: to end the bloody conflicts fueled by irreconcilable moral claims by establishing politics on the certain foundations of geometry.
      *   **The Problem:** Concepts like "sovereign," "right," "law," "justice," and "covenant" are *not* like "triangle" or "circle." They are deeply embedded in human experience, values, power relations, and historical contexts. They are essentially contested.
      *   **Hobbes's Move:** He begins *Leviathan* with definitions presented as foundational truths derived from reason and introspection (e.g., defining "right" as liberty, "law" as command, "justice" as keeping covenants). These definitions are not neutral; they are carefully crafted to lead inexorably to his desired political conclusions (absolute sovereignty is necessary for peace).
      *   **The Laundering:** The subsequent deduction (e.g., "In the state of nature, life is nasty... therefore, men must covenant... therefore, they must obey the sovereign absolutely") appears logically compelling *if* you accept his definitions as the necessary starting point. But the substantive claim (absolute obedience is necessary/just) is baked into the definitions (e.g., defining the sovereign's commands as "law" and disobedience as "injustice"). Opponents don't reject the deduction; they reject the loaded definitions. Hobbes mistakes stipulation for discovery.
      *   **The Result:** Instead of ending quarrels, his method *relocates* the quarrel to the very first step: the definition of terms. His geometric politics doesn't resolve conflict; it disguises a deeply normative, contestable political vision as logical necessity.

  **In summary:** The maneuver you've identified is best called employing a **Question-Begging Stipulative Definition**. It launders a substantive, contested normative claim by embedding it within a definition presented as neutral, then using valid deduction to make the claim appear as an inevitable logical consequence. It is distinct from simple begging the question by displacing the circularity into the definition, and from overtly evaluative definitions by masking the normativity within seemingly descriptive language. Its edges are defined by the essential contestability of the concepts involved and the illicit bridging of the is-ought gap. This is precisely why Hobbes's geometric dream for politics was doomed: you cannot derive binding political "oughts" from stipulative definitions of contested terms without smuggling in the very conflicts you seek to resolve. Your fictional characters are grappling with a profound and persistent feature of human argumentation about values.
