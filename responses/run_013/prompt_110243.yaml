  ### Further Case to Distinguish UDT from CDT
  To definitively tell UDT and CDT apart, use this case:

  #### **"Symmetric Mugging"**
  - **Setup**:  
    Omega flips a fair coin.  
    - **Heads**: Omega asks you for $100. If you pay, it gives you $X in the *tails branch*.  
    - **Tails**: Omega asks you for $100. If you pay, it gives you $X in the *heads branch*.  
    (Assume $X > $100, e.g., $X = $10,000.)  
    - Omega makes predictions before the flip. You decide whether to pay *after* the flip.  

  #### **Predictions**:
  - **UDT**:  
    - Chooses a policy: "always pay" or "never pay."  
    - "Always pay" gives:  
      - Heads: Pay $100, get $X in tails.  
      - Tails: Pay $100, get $X in heads.  
      - Expected utility: \(0.5 \times (-100 + X) + 0.5 \times (-100 + X) = X - 100\)  
      (Positive if \(X > 100\)).  
    - **Verdict: Pay in both branches**.
  - **CDT**:  
    - In heads: Paying $100 causes a loss. The $X in tails is not in your branch, so it doesn't count.  
    - Similarly in tails.  
    - **Verdict: Never pay in either branch**.  

  #### **Why this distinguishes them**:
  - UDT pays and gains \(X - 100\) on average.  
  - CDT never pays and gains $0.  
  - Miles (following UDT) would pay, while CDT would not. This matches Miles' mugging verdicts and contrasts with XOR cases where both agree (don't pay). 

  This case isolates the core difference: UDT optimizes global outcomes, while CDT ignores counterfactual rewards.
