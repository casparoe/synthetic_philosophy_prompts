prompt: |-
  I'm in a year-long political theory seminar and two people in it have been re-fighting the same battle since September. One is a pretty orthodox Rawlsian liberal: right is prior to the good, a pluralist society needs principles that people can accept whatever their conception of the good, and the state should stay neutral between rival visions of the good life. The other is a communitarian: she thinks that whole picture rests on a self you can conceive apart from its ends and attachments, that the liberal neutral state is itself just one more thick cultural form, and that you can't make sense of obligations to a family, a people, or a tradition if you start from unencumbered choosers. They've been going in circles for months and at this point I genuinely can't tell how much of it is a real disagreement and how much is the two of them using the same words for different things. So I want the document they should have produced by now: a joint statement of an adversarial collaboration between a liberal and a communitarian that both of them could actually put their names to. Not a transcript, not a ruling on who wins, not a summary of who said what — a constructive text with real content in it.

  Structure it as a numbered section of agreed claims first (what both sides accept about persons, about pluralism, about what a theory of justice is even for — make these load-bearing, not platitudes), then the residual disagreements, each one phrased in wording that its own side would sign off on, then the cruxes. My guess is one crux is whether the self is prior to its ends, another is whether state neutrality is even coherent or just a disguised endorsement, and maybe a third about whether rights can be justified without appeal to some shared good — but don't just take my list, add or drop what you think belongs. For each crux I want the case, argument, or thought experiment that both sides would agree actually bears on it, with each side's prediction about it written down in advance, and a note on whether either side would count anything as evidence against its own view. And if you decide part of this fight is just verbal — that they mean different things by neutrality, or by the self, or by obligation — say which part, and be specific about the two readings. Don't hand me a menu of positions and leave me to sort it out: commit to a view about which disagreements are genuine and which are words, and tell me which single crux you'd bet actually matters most, with your reasons. Skip the citations and reading lists, I just want the document. (Sorry for the typos, I'm typing this on my phone between classes.)
