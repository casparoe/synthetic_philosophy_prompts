prompt: |-
  I've never studied philosophy, I just watch a lot of films and think about them too much, so bear with me if I get the words wrong.

  Here's the thing that's been bugging me. I cry at films. Properly cry, not just a bit misty. And the whole time I know none of it is real, the actor's fine, it's a script, none of it actually happened. My mate says that means the feeling is fake, just a reflex, like flinching at something that isn't coming at you. I definately don't believe him, because flinching doesn't wreck my evening, and I've had films sit in my head for weeks afterwards. I think this puzzle has a proper name, the paradox of fiction or something like that, but I only half remember where I came across it.

  The film I'd like you to read through this is Stranger Than Fiction (the 2006 one with Will Ferrell). An IRS man starts hearing a woman narrating his life, works out he's a character in a novel that isn't finished yet, and tracks the author down. The literature professor he goes to for advice reads her outline and says it's her masterpiece and that Harold's death is the whole point of it, that it's a beautiful death. Harold reads it, agrees, and accepts it. But then the author can't bring herself to type the sentence that kills him off, partly because she's realised she's been narrating real people to their deaths, and she rewrites it so he lives. The professor thinks the new ending is weaker. She says the book was about a man who didn't know he was going to die, and a man who knows and accepts it deserves to live.

  What I want is a reading of the film through the puzzle. Where does it dramatise the problem, where does it complicate it, where does it just quietly dodge it? And which side does the film end up on, is the professor right that the death was worth more, or is Karen's ending the film quietly agreeing with itself that a made-up person's life is worth sparing? I can't tell, and I think it matters, because its the film's own verdict on whether the suffering of people who don't exist counts for anything.

  I've also got a half-baked theory of my own that I'd like you to test rather than just nod at. I've started calling it the middle-man theory. When I cry at a film I don't think the feeling is about Harold at all, I think it's relayed from the person who made him. There's a real woman at the other end who cared enough about this invented man that she couldn't finish the sentence, and what I'm feeling is her feeling, arriving late and second-hand. That way the emotion is real and has a real object and Harold is only the middle-man. Does the film bear that out, or does it undercut it? The professor doesn't care about Harold, after all, he cares about the book, and he'd rather Harold died.

  Two things I'd like you to actually decide rather than sit on the fence about: whether the professor's position makes any sense or whether he's simply wrong about what he's doing, and whether Karen's ending is a real answer to the puzzle or a way of dodging it. Don't send me a reading list or a load of names, I'm not going to go and read the papers, and please don't quote dialogue at me, just describe the scenes and I'll know which ones you mean. Write it in British English as well, I'm British and it throws me otherwise.

  Last thing: tell me where you think this reading is weakest and what would change your mind, which bit of the film or which argument would make you say something different about it. I'd rather have that than a tidy summary.
