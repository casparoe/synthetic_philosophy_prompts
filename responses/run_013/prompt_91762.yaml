  Im applying for a small one-term fellowship (deliverable is like 8-10 pages) and I need a proper research proposal. My half-formed idea is about the white horse dialogue and the School of Names more broadly. Here's the thing I keep circling. Everyone treats the claim that a white horse is not a horse as either a dumb sophism or a cute point that horse and white horse name different kinds of thing (ask for a horse and a white one will do; ask for a white horse and a brown one wont). But I suspect the whole family of School of Names puzzles, the white horse one plus the hard-and-white stuff and the pointing-at-things ones, only look paradoxical because we assume a common noun just picks out a fixed class of objects and that the word doing the is-work is unambiguous. My hunch is these texts are really poking at what happens to nouns, classifiers, and the copula when you dont assume that, and that a lot of the puzzles come out as nearly trivially true, or as puns trading on different senses of is, once you stop importing our assumptions.

  Turn this into a proposal that: (a) states one sharp question I can actually settle in a term, not just a topic; (b) explains why the two standard readings (the different-kinds reading and the its-just-wordplay reading) leave that question open; (c) says what I'd actually do, e.g. reconstruct the key arguments under three or four rival treatments of the copula and the noun, where the copula can be doing identity, predication, or kind-membership/subset, and see which readings survive and which collapse; (d) says what a good result looks like versus what would count as the project failing, like if every reading turns the puzzle into a triviality, or if I find I cant actually tell the rival readings apart from the evidence available; and (e) is honest about whether this is too much to do in one term and what I'd cut.

  Don't include a bibliography or reading list, I'll add the citations myself. Just refer to the positions and arguments by description.
