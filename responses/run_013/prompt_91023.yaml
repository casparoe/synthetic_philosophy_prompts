answer: |-
  1. **Rules and materials**: Prepare three factual multiple-choice questions (e.g., "Burkina Faso's capital: A) Ouagadougou, B) Bobo-Dioulasso"), each with one correct option. For each student, create private clue cards specifying an answer option and a reliability percentage (e.g., "A, 75% reliable"). Cards vary in reliability (60–90%) across students; in Round 2, 4 students receive identical low-reliability cards (e.g., "A, 65%") unknowingly from a single source. Students secretly record individual answers before an open majority vote per round.  

  2. **Scoring scheme**: Students earn 1 point per round for a correct individual answer and 1 point if the group majority is correct (max 6 points). No monetary stakes. After votes, reveal the correct answer and display: group majority outcome, individual accuracy rate (e.g., 12/16 correct), and whether the group beat the average individual accuracy, the most reliable member's answer, and the least reliable member's answer.  

  3. **Round-by-round sequence and twist**:  
     - **Round 1**: High-reliability cards (avg >75%), all unique. Students see convergence on the correct answer despite individual errors (e.g., 3 wrong individually, group correct).  
     - **Round 2**: Include 4 identical low-reliability cards (e.g., 65%) for the correct answer; others varied. Group still correct but votes reveal clustered errors (e.g., 4+ wrong individually).  
     - **Round 3 (twist)**: Most cards (12/16) are identical and misleading (e.g., "B, 80%" for a question where A is correct); others correct but low-reliability. Group forms a large, confident majority for the wrong answer.  

  4. **Debrief**: Map outcomes to Condorcet assumptions: Round 1 shows truth-tracking when errors are independent and mean reliability >50% (group beats avg. member and least reliable). Round 2 exposes fragility under source dependence (identical cards); group beats most reliable only if their card errs. Round 3 violates competence (mean reliability <50% due to systematic bias) and independence—majority amplifies error. Students notice reliance on independent errors via clustered mistakes in Round 2 and overconfidence in Round 3.  

  5. **Predictable problems and limitations**: Students may peek at others' cards or discuss clues, breaking independence; some may skip individual commitment, blurring data. The activity cannot replicate the theorem's infinite-group convergence or perfectly controlled competence—real-world bias (e.g., Round 3's systematic error) is artificially induced, not emergent.
