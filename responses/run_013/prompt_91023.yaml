  1. Rules and materials: Each student receives a clue card for each round, which states a fact and a reliability percentage (the chance that the source is correct on any given question). Students must not share their clues. For each round, the instructor poses a multiple-choice question with two options (to simplify voting and make the reliability meaningful). Students first write their individual answer (based solely on their clue) and then the group holds a majority vote (by show of hands). Materials: clue cards (prepared for three rounds), question slides, and answer sheets.

