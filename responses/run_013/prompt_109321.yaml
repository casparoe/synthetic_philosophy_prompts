prompt: |-
  Hey, I'm a third-year undergrad taking a course on applied ethics that's basically half just war theory and half trolley problems. This week we're on the doctrine of double effect and I have to write a short reading response on this passage from Aquinas (Summa Theologica II-II, q. 64, the part where he asks whether it's lawful to kill sinners). I can follow the words but I genuinely don't know what he's claiming:

  Now every part is directed to the whole, as imperfect to perfect, wherefore every part is naturally for the sake of the whole. For this reason we observe that if the health of the whole body demands the excision of a member, through its being decayed or infectious to the other members, it will be both praiseworthy and advantageous to have it cut away. Now every individual person is compared to the whole community, as part to whole. Therefore if a man be dangerous and infectious to the community, on account of some sin, it is praiseworthy and advantageous that he be killed in order to safeguard the common good, since "a little leaven corrupteth the whole lump" (1 Corinthians 5:6).

  Then a bit later, in his reply about the parable of the cockle, he says the wicked shouldn't be uprooted when "the wicked cannot be slain without the good being killed with them."

  My problem: is the part/whole business doing any real moral work, or is it just a metaphor for "the community is more important"? Because if the community is a whole and the guy is a part, killing him starts to look like amputating a diseased limb — i.e. using him, which seems to be exactly what double effect is supposed to rule out. But then the cockle reply reads less like a side-constraint and more like a practical warning that killing the wicked will drag good people down with them, which is an epistemic/prudential hedge, not a prohibition. Wich is it? And how would this framework handle the standard cases — diverting the trolley vs pushing the fat man — would Aquinas see a difference in what's intended, or does the part-whole picture just collapse everything into "is the community better off?"

  Act as a historian of medieval ethics who also knows the contemporary trolley/double-effect literature. Please start by brainstorming three or four seperate possible readings of the passage, then say which you think fits best, what in the text supports it, and what you'd have to check in the surrounding articles to settle it. Be careful not to invent Latin or attribute views to Aquinas that aren't in what I pasted — if you're not sure, just say so. Keep it around 500 words, I have a seminar at 4.
reasoning: |-
  Okay, let me approach this Aquinas passage systematically. The user is clearly grappling with whether the part-whole analogy is doing substantive moral work or just dressing up consequentialism. They've spotted the tension: if killing a sinner is like amputating a limb, that seems purely instrumental, yet double effect traditionally prohibits using persons as means.

  First, I need to map possible readings of the text. Reading 1 could be pure collective utilitarianism - the "limb" metaphor taken literally. But Aquinas's cockle parable complicates that with its prohibition on harming the innocent. Reading 2 might be stronger: the part-whole framework establishes the state's authority to defend the common good, making the execution an act of justice rather than utility. The diseased limb analogy then serves to explain why removing threats is licit when necessary for communal health.

  The user's observation about the cockle reply being pragmatic rather than principled is astute. But Aquinas's actual wording ("cannot be slain without the good being killed") suggests he's concerned with proportionality and collateral damage - core double effect considerations. This leans toward Reading 2 being primary, with the limb metaphor as explanatory imagery rather than foundational logic.

  For trolley parallels: diverting the trolley could align with Aquinas if we see the one worker as a regrettable but unintended loss while saving five. Pushing the fat man directly intends his death as means - which Aquinas's framework would likely reject, mirroring his cockle prohibition. The key is whether harm is directly willed versus permitted as side-effect.

  To confirm this, I'd need to cross-reference Aquinas's treatment of intention in q.64's objections and his discussion of self-defense elsewhere. The user should note Article 7's objection 2 reply where Aquinas distinguishes intended effects from foreseeable consequences - that's the double effect core.

  Important caveats: must avoid projecting modern trolley discourse onto Aquinas. His concern is sin/justice, not abstract utility. Also shouldn't overstate the limb metaphor; it's illustrative, not doctrinal. The cockle example shows Aquinas isn't endorsing wholesale sacrifice of parts for the whole.

  For the response, I'll structure: 1) present 3 readings neutrally 2) argue for the justice-based interpretation 3) clarify the trolley relevance 4) specify textual checks. Need to keep under 500 words as requested.
answer: |-
  Here are three plausible readings of Aquinas' passage, followed by my analysis of the best fit and its implications:

  **Possible Readings:**
  1.  **Strict Organic Metaphor:** The part/whole analogy is the *core justification*. Killing a dangerous individual is morally equivalent to amputating a diseased limb – a non-moral act of biological necessity for the organism's survival. The community's good *absolutely outweighs* the individual's right to life, making the killing a direct act of preservation. The cockle reply is purely pragmatic (avoiding "collateral damage" to the good).
  2.  **Authority & Justice Framework:** The part/whole analogy establishes the *authority* of the community (specifically, its legitimate rulers acting for the common good) to *punish* a dangerous *sinner* as an act of justice and defense. The limb metaphor illustrates the *necessity* and *purpose* (preserving the whole), but the moral justification hinges on the individual being guilty ("on account of some sin") and the killing being an act of public justice. The cockle reply introduces a *proportionality* constraint within justice (don't cause disproportionate harm to innocents).
  3.  **Double Effect Prototype:** The passage focuses on the *intended object* (safeguarding the common good) and the *circumstances* (necessity due to infectious danger). The sinner's death is a *foreseen effect* of achieving the good end, not the chosen means itself. The limb metaphor helps explain why the death isn't the intended object. The cockle reply highlights the *distinction between intended and foreseen effects*: killing the wicked *intending* the death of the good mixed with them is wrong, even if foreseen; but if only the wicked *could* be killed (intended object), the death of the good (foreseen) might be permissible under proportionality.

  **Analysis & Best Fit:**
  Reading 2 (**Authority & Justice Framework**) best fits the text and Aquinas' broader context.
  *   **Textual Support:** Aquinas explicitly grounds the permissibility in the individual being a *sinner* ("on account of some sin"), not merely dangerous. This invokes justice (punishment for sin) and the authority of the community to act. The limb metaphor serves as an *illustration* of necessity and the rationale *for* the community's action ("praiseworthy and advantageous"), not the sole justification. The cockle reply directly addresses the *justice* of the act ("it is unlawful") when it harms the innocent, moving beyond mere pragmatism.
  *   **Double Effect Connection:** This framework *accommodates* DDE but isn't defined by it here. The *intended object* is safeguarding the common good *through just punishment/removal of a guilty threat*. The sinner's death is a necessary part of *how* that just removal is achieved in this case. The cockle reply highlights that if achieving the good object *requires* intending the death of innocents (or causing disproportionate unintended harm), it becomes unjust. Aquinas focuses on the *object* (removing a *guilty* threat justly) and the *circumstances* (necessity, proportionality).
  *   **Trolley Relevance:** Within this framework:
      *   **Diverting the Trolley:** Could be licit. The *intended object* is saving the five (common good). The death of the one is a *foreseen but unintended side-effect* of diverting the threat (akin to justly removing the threat posed by the sinner). The one worker isn't *used* as the means; the means is diverting the threat *away* from the five *towards* a different track. Proportionality (5 vs 1) matters.
      *   **Pushing the Fat Man:** Likely illicit. The *intended object* (saving the five) is achieved *by* directly intending the fat man's death as the *means* (shoving him). This treats him merely as a tool/instrument, violating justice and DDE's core prohibition. It's not just removing a threat *from* the community; it's actively *using* an innocent person within the community to stop the threat. Aquinas' cockle reply directly condemns this: killing the wicked (stopping the trolley) *by* killing the good (fat man) with them.
  *   **The Part/Whole Role:** It establishes the *context* for legitimate authority to act for the common good and explains *why* removing a dangerous, *guilty* member can be necessary and justified (like removing diseased tissue). It does *not* reduce morality to pure utility ("community better off?"). The justice element (guilt of the sinner, avoiding harm to innocents) imposes crucial constraints.

  **Settling the Interpretation (Checks in Surrounding Text):**
  1.  **Article 64, Objections & Replies:** How does Aquinas counter arguments based on "Thou shalt not kill"? Does he emphasize *authority* (e.g., the ruler acting as God's minister - Rom 13:4, cited elsewhere) or *guilt* as key? (Likely yes).
  2.  **Article 64, Article 7 (Self-Defense):** Compare his justification for killing an aggressor in self-defense. He explicitly uses DDE: the *intended object* is saving one's life; the aggressor's death is unintended, though foreseen. Look for parallels/contrasts in reasoning.
  3.  **q. 64, a. 2 (Killing the Innocent):** Does Aquinas explicitly rule it out? (He absolutely does). This reinforces that the justification in our passage relies on the target being *guilty* ("sinner").
  4.  **The Cockle Reply's Context:** Read the *full* reply (ad 3um). Does Aquinas frame it as a principled limitation on authority/justice ("it is unlawful") or just a practical caution ("it is unwise")? The key phrase is "**non licet**" (it is not lawful/permissible).

  **Conclusion:** Aquinas' core claim is that legitimate public authority can licitly kill a *guilty* ("sinner") individual who poses a grave danger to the common good, as a necessary act of just punishment and defense. The part/whole analogy explains the rationale for communal authority and necessity, but the moral justification hinges on guilt and the act being one of public justice. The cockle reply imposes a proportionality constraint rooted in justice, forbidding actions that intend or directly cause disproportionate harm to the innocent. DDE principles are nascent here, embedded within this justice framework.
