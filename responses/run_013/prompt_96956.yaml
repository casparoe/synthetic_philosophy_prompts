answer: |-
  Based on the question requirements and Hobbes's actual positions (as outlined in works like *De Corpore* and *Leviathan*), here's a point-by-point assessment and a suggested grade:

  **Grade: 9/10** (Excellent grasp of the core concepts, minor imprecisions in wording/phrasing)

  **Specific Marginal Comments:**

  1.  **"Hobbes thinks geometry is demonstrable because we construct its objects ourselves."**  
      **✓✓ CORRECT & ESSENTIAL POINT.** Full credit. This is the core of "maker's knowledge."

  2.  **"When we draw a line or a circle we aren't discovering something that was already sitting there, we're making it..."**  
      **✓✓ CORRECT.** Excellent contrast with discovery. Reinforces point 1.

  3.  **"...because we made it we can know its causes — the demonstration is just unfolding the consequences of our own construction."**  
      **✓✓ CORRECT & KEY INSIGHT.** Perfectly captures the link between construction, knowledge of causes, and demonstration as deduction from definitions/consequences. Core of demonstrability.

  4.  **"He runs the same argument for civil philosophy: the commonwealth is something we make, so we can have demonstrative knowledge of it..."**  
      **✓✓ CORRECT & ESSENTIAL POINT (for part a).** Directly applies "maker's knowledge" to civil philosophy. Exactly right.

  5.  **"...which is why he thinks politics can be as certain as geometry..."**  
      **✓ PARTLY CORRECT / ✓ BUT NEEDS NUANCE.** Hobbes *does* claim theoretical certainty *in principle* for civil philosophy derived from correct definitions. However, **Flag:** Add margin note: "*Hobbes acknowledges more practical difficulty & potential for error in application compared to geometry, but the *potential* for equal certainty is there based on method.*" The claim "as certain" risks oversimplifying his practical caveats.

  6.  **"...even though it looks like a much messier subject."**  
      **✓ GOOD OBSERVATION.** Implicitly acknowledges the apparent difference, which Hobbes addresses via method.

  7.  **"Natural philosophy is the opposite case, since we don't make natural bodies..."**  
      **✓✓ CORRECT & ESSENTIAL POINT (for part b).** Directly applies the "maker's knowledge" distinction negatively.

  8.  **"...so we only ever encounter their effects without getting at the causes from the inside."**  
      **✓✓ CORRECT.** Precisely states the epistemic limitation: knowledge of effects (phenomena) only, not true efficient causes.

  9.  **"This is also why Hobbes insists that the axioms of geometry are self-evident and universally agreed on..."**  
      **? PARTLY MISLEADING / ✓ CONTEXT NEEDED.** **Flag:** Add margin note: "*Caution: While Hobbes emphasizes clear definitions agreed upon, his foundation is *nominalist* and based on *conventions* we establish as makers, not necessarily 'self-evident' truths in a Platonic/Rationalist sense. He grounds them in definitions & construction, not pure intuition.*" This phrasing risks conflating him with rationalists like Descartes.

  10. **"...and why his long fight with Wallis was really about whether those starting points could be doubted at all — Wallis wanted geometry to lean on algebraic symbols instead of the obviousness of the first principles."**  
      **✓ CORRECT HISTORICAL ILLUSTRATION / ✓ BUT PERIPHERAL.** Adds interesting context demonstrating Hobbes's commitment to his view of geometric foundations vs. formalism. Not strictly required by the question, but shows good understanding. Credit given for enrichment.

  11. **"The overall upshot is that the sciences where we are the makers are the ones where genuine proof is possible..."**  
      **✓✓ CORRECT SYNTHESIS.** Perfectly summarizes the core distinction.

  12. **"...and everything else is conjecture."**  
      **✓ MOSTLY CORRECT / ✓ MINOR IMPRECISION.** **Flag:** Add margin note: "*'Conjecture' is close; Hobbes often uses 'conditional' knowledge, hypotheses, or 'suppositions' for natural philosophy (based on known effects), reserving 'demonstration'/'science' strictly for maker-knowledge.*" "Conjecture" slightly underplays the structured hypothetical-deductive method he *does* allow in natural philosophy, though it falls short of *scientia*.

  **Summary Feedback for Student:**

  "Excellent answer overall! You perfectly grasped the central Hobbesian doctrine of 'maker's knowledge' as the foundation for demonstrability in geometry and its crucial application to distinguish civil philosophy (demonstrable) from natural philosophy (not demonstrable). Your explanation of demonstration as 'unfolding the consequences of our own construction' is spot-on. Minor points: 1) Be slightly more precise about the *degree* of certainty achievable in practical politics vs. geometry. 2) Hobbes grounds geometric 'first principles' in constructed definitions/conventions, not quite 'self-evidence' as rationalists do. 3) While natural philosophy is indeed non-demonstrative, 'conjecture' slightly undersells the systematic hypothetical role he assigns it. These are nuances – your core argument is very strong and directly addresses the question."

  **Why not 10/10?**
  The minor imprecisions regarding "self-evident" foundations (point 9) and the slight overstatement of practical certainty in civil philosophy (point 5) plus the slightly reductive "conjecture" (point 12) prevent a perfect score. A tired grader *might* glide past the potential conflation in point 9 ("self-evident"), which is the most significant subtle error here. The answer reads smoothly and confidently *because* the core argument (maker's knowledge applied to the three domains) is entirely correct and well-stated.
