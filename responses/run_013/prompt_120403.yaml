    (7') Averages are a legitimate summary of a population. Nothing about the paradox counts against averaging in general; it shows only that two comparisons can weight the same segments differently. However, when an aggregate average violates the sure-thing principle, it should not be used for decision making because it can lead to incorrect actions.

  This revision resolves the main tension with (6) and leaves the rest for further clarification.

