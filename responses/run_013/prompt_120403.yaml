  But note (1) says the aggregate and the stratified are answering different questions. (6) says that when the stratified shows the treatment is better in every group, then the aggregate that shows otherwise is an artifact. This implies that the aggregate question is not valid? 

  Actually, (6) is a normative principle about decision making: if T is better in every possible group, then it should be adopted overall. Therefore, the aggregate that shows T is worse is misleading for decision making. So (6) is not just about description but about action.

  (1) is about description: we have two comparisons for two different questions. But (6) says that one of them (the aggregate) can be misleading for decision making and should be ignored. So they are not in direct contradiction, but (6) adds a normative layer that (1) doesn't address.

  **Tension between (4) and (6):**
  (4) says when two comparisons disagree, report both and let the reader decide. (6) says that if the treatment is better in every stratum then the aggregate that says otherwise is an artifact to be ignored. So (6) is telling us not to report the aggregate as if it were meaningful? 

  This is a tension: (4) says report both, (6) says the aggregate is an artifact and should be ignored. 

  **Tension between (5) and (7):**
  (5) says for ratio metrics we use the ratio of totals. (7) says averages are legitimate. But note: the ratio of totals is not the same as the average of the per-unit ratios. (5) is saying that for ratio metrics, the ratio of totals is the correct one. (7) says averages are legitimate, but note that the ratio of totals is an average? Actually, it is a weighted average (as shown above). So (5) is a specific case for ratio metrics. (7) is general. They are consistent: (5) is specifying which average is appropriate for ratio metrics.

  **Summary of tensions:**

  The major tensions are:

  1. **Between (6) and (7):** 
     - (6) rejects the aggregate when it violates the sure-thing principle, while (7) defends the legitimacy of averages (which include the aggregate) as summaries, even if they weight segments differently.

  2. **Between (4) and (6):**
     - (6) says to ignore the aggregate when it violates the sure-thing principle, but (4) says to report both and let the reader decide.

  3. **Between (6) and (1):**
     - (1) says the two comparisons are just different questions, but (6) says that one of them (the aggregate when it violates the sure-thing principle) is an artifact to be ignored.

  **Ordering by severity:**

  The most severe tension is between (6) and (7) because it strikes at the heart of what the aggregate represents. (7) says the aggregate average is a legitimate summary, but (6) says that in the case of a sure-thing principle violation, the aggregate is an artifact. This is a fundamental disagreement about the value of the aggregate.

  The next most severe is between (4) and (6): (4) wants to report both, but (6) says one is an artifact and should be ignored.

  Then between (6) and (1): (1) is descriptive about the two comparisons, but (6) is prescriptive about which one to trust.

  **Cheapest revision and what it costs:**

  To resolve the tension between (6) and (7), the cheapest revision is to qualify (7) by saying that averages are legitimate summaries, but when they violate the sure-thing principle, they are not appropriate for decision making. This costs: we are now making a normative claim (for decision making) and not just a descriptive one about averages.

  To resolve the tension between (4) and (6), we might revise (4) to say that we report both but with a caveat when the sure-thing principle is violated: we note that the aggregate is misleading for decision making. This costs: it adds complexity to the reporting.

