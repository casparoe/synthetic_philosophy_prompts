  The most severe tension is between (6) and (7). The single change that would clean up the most is to qualify (7) by adding:

    "However, when an aggregate average violates the sure-thing principle (as in Simpson's reversal), it should not be used for decision making because it can lead to incorrect actions. In such cases, the stratified analysis should be preferred for decisions."

  This change leaves unresolved the issue of how to report the results (tension with (4)) and the exact relationship to (1). But it directly addresses the most severe conflict.

  **Contested issues:**

  The sure-thing principle (6) is widely accepted in decision theory. However, the legitimacy of the aggregate average (7) is also widely accepted as a descriptive statistic. The tension between them in the context of Simpson's paradox is well-known. The resolution is often that the aggregate average is a valid description of the overall population, but for decision making we must consider the subgroups if the treatment effect is heterogeneous and the subgroups are relevant to the decision (e.g., if we can target the treatment). 

