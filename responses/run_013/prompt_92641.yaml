answer: |-
  ### Session Plan: The Hole Argument in 90 Minutes  
  **Audience:** Philosophers and theoretical computer scientists; familiar with finite structures, permutations, isomorphisms, and symmetries; no physics background.  

  **Core Pedagogical Strategy:** Use a finite, enumerable structure to illustrate the argument before introducing physics. The sequence is fixed to avoid the argument seeming like a "conjuring trick."  

  ---

  #### **Sequence of Ideas (Dependencies Explicit)**  
  **Dependency Graph:**  
  I → II → III → IV → V → VI → VII  
  *(No permutation possible; each step builds on the previous)*  

  1. **I. Setup a Finite Structure (15 mins)**  
     - **What:** Define a simple structure:  
       - Base set: `M = {A, B, C, D}` (points).  
       - Fixed "manifold" structure: A graph `G` with edges `{A↔C, A↔D, B↔C, B↔D}` (a complete bipartite graph `K_{2,2}`).  
       - Physical field: A scalar field `F: M → ℝ` with values `F(A)=0, F(B)=0, F(C)=1, F(D)=2`.  
       - Designated regions:  
         - **Fixed region:** `{A, B}` (must be preserved).  
         - **Hole region:** `{C, D}` (can be transformed).  
     - **Why first?** Establishes a concrete, non-physical starting point. Audience can enumerate all elements and verify symmetries.  
     - **Key dependency:** Must define the structure before any transformations or philosophical questions.  

  2. **II. Introduce a Symmetry (Automorphism) (10 mins)**  
     - **What:** Define a permutation `φ: M → M` that swaps `C` and `D` (i.e., `φ(C)=D`, `φ(D)=C`, `φ` fixes `A` and `B`).  
       - Show `φ` is an automorphism of `G`: It preserves edges (e.g., `A↔C` becomes `A↔D`, which is still in `G`).  
     - **Why here?** Requires the structure from **I** to exist. Sets up the symmetry that "moves" points inside the hole while fixing the outside.  
     - **Head off misconception:**  
       - *"Isomorphic means identical"*: Emphasize that while `φ` preserves `G`, it does **not** preserve `F` (since `F(C) ≠ F(D)`). Isomorphism is structure-dependent, not identity.  

  3. **III. Drag the Field Along the Symmetry (10 mins)**  
     - **What:** Define a new field `F' = F ∘ φ^{-1}` (since `φ^{-1} = φ`).  
       - Compute: `F'(A)=0`, `F'(B)=0`, `F'(C)=2`, `F'(D)=1`.  
       - Model 1: `(M, G, F)`  
       - Model 2: `(M, G, F')`  
     - **Why here?** Requires `φ` from **II**. Shows how symmetries generate new configurations.  
     - **Key insight:** `F` and `F'` assign different values to the same points (e.g., `C` has `1` in Model 1, `2` in Model 2).  

  4. **IV. Verify Isomorphism of Models (10 mins)**  
     - **What:** Prove `φ` is an isomorphism between Model 1 and Model 2:  
       - Preserves `G` (from **II**).  
       - Preserves the field: `F'(φ(x)) = F(x)` for all `x ∈ M` (e.g., `F'(φ(C)) = F'(D) = 1 = F(C)`).  
     - **Why here?** Requires Model 1/2 from **III**. Confirms the models are mathematically isomorphic.  
     - **Head off misconceptions:**  
       - *"The argument is trivial—all structures have automorphisms"*: Stress that the issue isn’t symmetry itself, but its implications for **individuation** (next step).  
       - *"Indeterminacy is harmless modeling noise"*: Models agree on `{A,B}` but disagree on `{C,D}`—this isn’t arbitrary if points have identity.  

  5. **V. Substantivalism Commitments (15 mins)**  
     - **What:** Define substantivalism: Points of `M` have independent identity (haecceity).  
       - Under substantivalism: Model 1 and Model 2 describe **distinct physical possibilities** (same point `C` has different field values).  
     - **Why here?** Requires isomorphic models from **IV** to pose the ontological question.  
     - **Head off misconception:**  
       - *"The argument refutes substantivalism outright"*: Not yet—it’s a challenge, not a refutation (relationalism avoids it).  

  6. **VI. General Covariance and Indeterminism (15 mins)**  
     - **What:**  
       - Assume a "theory" where if `(M, G, F)` is a solution, so is `(M, G, F')` (general covariance: symmetries preserve solutions).  
       - Initial data on fixed region `{A,B}`: Same for both models (`F(A)=F'(A)=0`, `F(B)=F'(B)=0`).  
       - But predictions in the hole differ: `F(C)=1` vs. `F'(C)=2`.  
       - **Substantivalist conclusion:** Theory is **indeterministic**—same past, multiple futures.  
     - **Why here?** Requires substantivalism (**V**) and models (**III–IV**).  
     - **Head off misconceptions:**  
       - *"It establishes indeterminism"*: Only for substantivalism; relationalists see no indeterminism.  
       - *"It’s about our ignorance"*: No—it’s about what the theory **allows** (multiple solutions), not knowledge.  

  7. **VII. Relationalism and the Ontological Fork (10 mins)**  
     - **What:** Define relationalism: Points lack haecceity; only isomorphism-invariant properties are real.  
       - Under relationalism: Model 1 and Model 2 describe the **same physical reality** (differ only by a symmetry).  
       - No indeterminism—the hole is described uniquely up to isomorphism.  
     - **Why last?** Requires the indeterminism problem (**VI**) to show how relationalism avoids it.  
     - **Final point:** The argument is a **reductio against substantivalist individuation**, not ontology per se.  

  ---

  #### **The Finite Example: What It Must Have and Lack**  
  - **Must have:**  
    - A fixed background structure (graph `G`) with a non-trivial automorphism (`φ`) that fixes a region pointwise.  
    - A physical field (`F`) not invariant under `φ` (so dragging creates a distinct configuration).  
    - Explicit points (to force the individuation question).  
  - **Must lack:**  
    - No intrinsic labels: Points are only distinguished by `G` and `F` (avoids begging the question for relationalism).  
    - No physics vocabulary initially (use "field," not "metric").  

  ---

  #### **When to Introduce the Continuous Diagram**  
  - **Where:** After **VI** (indeterminism).  
  - **What:** Show a smooth manifold diagram with a hole, metric field, and diffeomorphism sliding points inside.  
  - **Why then?**  
    - The finite example has already done the conceptual work, so the diagram is an analogy.  
    - **Adds:** Shows the argument isn’t an artifact of discreteness; connects to GR (diffeomorphism covariance).  
  - **Do not use earlier:** Avoids physics baggage and keeps focus on the structural core.  

  ---

  #### **Ending: The Test Question**  
  **Question:**  
  *"If a theory is generally covariant, what does the hole argument force a substantivalist to accept about determinism, and why does a relationalist reject this?"*  

  - **Tests understanding:**  
    - Forces distinction between substantivalism (indeterminism) and relationalism (no indeterminism).  
    - Reveals if they see the argument is about **what the theory admits as possible** (commitments), not just "isomorphism exists."  

  **Can the finite example separate individuation from ontology?**  
  - **Yes:**  
    - **Individuation (reductio):** The example forces substantivalists to accept haecceity leads to indeterminism.  
    - **Ontology:** Relationalism avoids by denying haecceity.  
  - **No further case needed:** The finite structure suffices (e.g., swapping `C`/`D` challenges what individuates them).  

  ---

  #### **What to Explicitly Refuse to Settle**  
  - **Refuse:** Whether substantivalism or relationalism is "true."  
  - **Announce:** *"We won’t resolve this today—it’s a live metaphysical debate. Settling it would overshadow the argument’s purpose: to expose commitments of a theory, not pick a winner."*  
  - **Why?** The session is about understanding the argument’s structure and implications, not endorsing a view. Premature resolution spoils the conceptual tension.  

