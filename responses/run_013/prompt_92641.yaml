  **Board Reconstruction:**  
  1. `M = {A, B, C, D}`  
  2. `G`: Edges `A↔C`, `A↔D`, `B↔C`, `B↔D` (draw graph).  
  3. `F`: `A:0`, `B:0`, `C:1`, `D:2` → **Model 1**.  
  4. `φ`: Swap `C` and `D` (automorphism of `G`).  
  5. `F' = F ∘ φ`: `A:0`, `B:0`, `C:2`, `D:1` → **Model 2**.  
  6. `φ` is iso: `F'(φ(x)) = F(x)` (e.g., `F'(φ(C)) = F'(D) = 1 = F(C)`).  
  7. Substantivalism: Models = 2 possibilities → Hole region underdetermined.  
  8. Relationalism: Models = 1 possibility → No underdetermination.  
  9. Continuous diagram (post-**VI**): Diffeomorphism sliding metric in hole.  

  **Timing:**  
  - I (15), II (10), III (10), IV (10), V (15), VI (15), VII (10), Continuous (5).
