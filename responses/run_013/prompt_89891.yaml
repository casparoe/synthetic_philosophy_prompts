answer: |-
  Subject: Reading Capra through Berkeley's eyes – and where they part ways  

  Let’s cut straight to it: *It’s a Wonderful Life* isn’t just Berkeleyan—it’s Berkeley with tears in its eyes and mud on its shoes, turning his abstract credit theory into a moral fable. But like all fables, it simplifies, and in that simplification, it both elevates and quietly betrays him.  

  Start with the run on the Building and Loan. George Bailey’s desperate lecture—"your money’s in Joe’s house, and in the Kennedy house, and a hundred others"—is pure Berkeley. Money as a social agreement, a network of trust crystallized in labour and community, not metal in a vault. Potter’s bank, with its cold vaults and foreclosures, embodies the commodity fetish Berkeley despised: money as a thing to be hoarded, not a tool to mobilise work. The film’s genius lies in dramatizing credit as a circulatory system: when trust collapses, the body starves. Bailey Park, built on faith in neighbours, *is* Berkeley’s vision—wealth as activated human capacity. Potter’s slums, where idleness festers, are the direct result of throttled credit. Here, Capra nails Berkeley’s core thesis: poverty isn’t scarcity of coin, but paralysis of circulation.  

  But the ending undoes it. That avalanche of cash in the basket—the literal pile of dollars—reverts to the very illusion Berkeley attacked. After showing money as relational, the film resolves with money as material. George is saved by physical currency, not restored credit lines or promises honoured. It’s emotionally satisfying, yes, but philosophically regressive. Berkeley would’ve insisted the real miracle wasn’t the cash, but the town’s collective willingness to *work* for George, to extend labour on trust. The coins are a concession to the audience’s longing for tangible salvation—a betrayal of the film’s own earlier insight.  

  Potter is where Capra sharpens Berkeley’s point, but also narrows it. Berkeley saw idle wealth as a moral failure; Potter embodies it as malice. But Berkeley’s monetary reform wasn’t about vanquishing villains—it was about redesigning systems to prevent hoarding and ensure circulation. Potter’s cartoonish greed lets the film sidestep a harder truth: a credit economy can be corrupted without a mustache-twirling miser. The system itself, untethered from shared purpose, invites Potters. Capra makes it personal where Berkeley made it structural.  

  And on the poor? Here Berkeley’s Irish pragmatism cuts deeper than Capra’s sentiment. Berkeley demanded work, not charity—idleness was a social sin. The film flinches at this. Its poor are noble sufferers (like Uncle Billy) or grateful strivers (like Martini), but never idlers. Bailey’s community saves itself through solidarity, not labour extraction. Berkeley’s urgency—"employ the poor"—wasn’t just moral but mechanical: idle hands meant wasted wealth. Capra replaces that with a vision of innate human goodness activated by crisis. It’s warmer, but less demanding. Berkeley wanted systems to *force* circulation; Capra believes love alone will suffice.  

  So—verdict? The run scene is Berkeley perfected. The finale is Berkeley abandoned for catharsis. Potter is a necessary caricature that lets credit off the hook. And the treatment of the poor swaps Berkeley’s unsentimental engine of labour for a gospel of goodwill.  

  But here’s the twist: the film’s "failure" is its strength. Berkeley gave us a theory; Capra gave us a myth. And myths need physical symbols (cash in a basket) and clear villains (Potter) to move us. The irony? Berkeley the idealist was colder, more systemic. Capra the sentimentalist understood that credit, in the end, runs on hearts, not ledgers. That’s why we cry when the dollars pile up—even if Berkeley would’ve sighed.  

  Write the piece. Call it "Berkeley’s Ghost in Bedford Falls." Just admit Capra cheated the philosophy to win the soul.  

  —  
  *Still think that basket of cash was a cop-out? Fight me over coffee. First round’s on me.*
