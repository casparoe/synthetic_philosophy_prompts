answer: |-
  ## Proposal-ism and the Frege-Geach Gauntlet: A Verdict

  Proposal-ism presents itself as a bold escape from the Frege-Geach problem by jettisoning the very concept of moral *statements* in favor of *actions*: moral utterances are proposals to adopt norms or plans as settled. Faced with "If lying is wrong, then lying to your landlord is wrong," the proposal-ist doesn't see a truth-apt antecedent describing a state of affairs. Instead, they see the proposal of a *conditional commitment*: "Let's adopt the norm that *if* we adopt the norm against lying, *then* we adopt the norm against lying to landlords." Validity, on this view, isn't about truth-preservation but *plan consistency*: accepting the premises forces a consistent planner to accept the conclusion. The Frege-Geach problem, the proposal-ist claims, dissolves because it mistakenly assumes embedded clauses *must* have descriptive content or express attitudes *in the same way* as asserted clauses. Proposal-ism offers a unified, non-descriptive account: it's proposals all the way down, governed by a practical logic of commitment.

  **Does Proposal-ism Genuinely Dodge Frege-Geach? The Core Pressures:**

  1.  **Meaning-Invariance:** Proposal-ism scores an initial victory here. "Wrong" consistently signifies the act of proposing a norm's adoption, whether asserted ("Lying is wrong" = "Propose: Adopt norm N!") or embedded in the antecedent ("If lying is wrong..." = "Propose: If we adopt N, then..."). The *word* doesn't change its core function – proposing. The *context* changes how the proposal operates (conditional vs. direct), but the fundamental act remains proposing norm-adoption.
  2.  **Validity:** This is the proposal-ist's battleground. They replace truth-conditional validity with practical consistency. The inference "If lying is wrong, then lying to your landlord is wrong; Lying is wrong; Therefore, lying to your landlord is wrong" is valid because a planner who endorses the conditional proposal and then endorses the antecedent proposal is practically inconsistent if they *reject* the consequent proposal. They are committed, by their own proposed plan structure, to adopting the norm against landlord-lying. This *is* a coherent alternative logic. **Verdict (So Far):** Proposal-ism plausibly handles simple embeddings like conditionals and conjunction within its own framework, addressing meaning-invariance and offering a non-truth-apt account of validity.

  **The Stress Test: Where Proposal-ism Stumbles:**

  The real test lies in complex embeddings that proposal-ism glosses over. Can its machinery handle them without collapsing back into descriptivism or generating intolerable epicycles?

  1.  **Under "Probably":** "Lying is probably wrong." How does "probably" modify a *proposal*? Proposals aren't probabilistic in themselves. We don't say "Probably, let's adopt norm N!" meaning we're only somewhat committed to proposing it. "Probably" naturally attaches to *truth* or *likelihood*. Proposal-ism is forced into contortions: perhaps "It's probably wrong" means "I tentatively propose adopting N" or "I propose adopting a norm that assigns a high probability to N being the norm we *should* adopt?" The first undermines the core idea that proposals settle norms; tentative proposals aren't proposals *to settle*. The second smuggles in descriptive content ("the norm we *should* adopt") or higher-order attitudes about likelihoods, precisely what proposal-ism aimed to avoid. The natural reading – expressing uncertainty about a *fact* (the wrongness) – reasserts itself.
  2.  **Under "Because" (Providing Reasons):** "He returned the money because lying is wrong." Here, "lying is wrong" is offered as the *reason* for the action. Reasons are typically understood as *facts* or *states of affairs* that explain or justify. A *proposal* ("Let's adopt norm N") is an *action*, not a reason. How can an *act of proposing* be the *reason* for returning money? Proposal-ism struggles. It must interpret this as something like: "He returned the money because he endorses the proposal to adopt norm N." But this shifts the explanatory burden to the *endorsement* (a psychological state) or the *content* of the norm N itself. If the explanation relies on the *content* N ("because N forbids lying"), then N starts looking like a truth-apt proposition. If it relies on endorsement, it becomes a psychological claim about the agent, not an account of the moral reason itself embedded in the "because" clause. The proposal itself remains inert as a reason-giver.
  3.  **Inside Noun Phrases:**
      *   **"The wrongness of lying":** This creates an *abstract object* – "wrongness." Proposal-ism struggles to explain this abstraction. What is being referred to? Not a property in the world. The proposal act itself ("proposing adoption of N") doesn't easily yield an abstract noun like "wrongness." The natural interpretation is that it refers to a *property* that lying has, which proposal-ism explicitly denies exists independently of our proposals.
      *   **"Her belief that lying is wrong":** Beliefs are cognitive states with propositional content (things held to be true/false). Attributing a "belief that lying is wrong" strongly implies that "lying is wrong" is the kind of thing that *can* be believed – i.e., a proposition with truth conditions. Proposal-ism must reinterpret this as "Her state of endorsing the proposal to adopt norm N." While possible, this stretches the meaning of "belief" significantly. It becomes a different kind of mental state entirely (acceptance of a proposal vs. belief in a fact).
      *   **"Doubting that lying is wrong":** Doubt is naturally directed at propositions or facts. Doubting a *proposal* is odd. Do we doubt *that we should propose it*? Or doubt *the proposal itself*? If the latter, what does that mean? Proposal-ism likely interprets this as "Not endorsing the proposal to adopt N" or "Endorsing a proposal *not* to adopt N." While coherent, this flattens the cognitive richness of "doubt," which typically involves uncertainty about a *state of affairs*, not just rejection of a plan. It also struggles to distinguish mere non-endorsement from active doubt about a putative fact.

  **Negation and Disagreement:** Proposal-ism handles simple negation ("Lying is not wrong") as proposing *not* to adopt norm N, or proposing to reject N. Disagreement becomes conflicting proposals. This works reasonably well for direct clashes. However, in embedded contexts ("I doubt that lying is not wrong" or "If lying isn't wrong, then..."), the combinatorial complexity and the pressure to interpret negation as operating on a propositional content resurface, echoing the problems seen in the stress tests above.

  **The Verdict: Alive, But Burdened by a Mountain of Epicycles**

  Proposal-ism is not dead. It offers a genuinely novel and initially compelling framework that *does* handle the core Frege-Geach challenge in simple embedded contexts (conditionals, conjunction) by providing a unified account of meaning (proposing) and an alternative logic (practical consistency). It successfully dodges the charge of meaning-variance for these cases.

  However, it is not alive and well without significant cost. It is alive only by constructing a **large and unstable pile of epicycles.** The stress tests reveal fundamental weaknesses:

  1.  **The Pressure of Description:** Complex embeddings ("probably," "because," abstract nouns, cognitive verbs like "believe" and "doubt") relentlessly push the language back towards a descriptive, truth-apt interpretation. Proposal-ism must constantly *reinterpret* or *paraphrase* these constructions in ways that often feel unnatural, strained, and fail to capture the intuitive semantic content. It struggles to explain why moral language seamlessly integrates into contexts that cry out for propositional content.
  2.  **The Ghost of Truth-Aptness:** The concepts of validity (even practical consistency), negation, disagreement, and especially reason-giving ("because") implicitly rely on structures analogous to truth and falsity. While proposal-ism replaces "truth" with "plan consistency," the *structural parallels* are so strong that it often feels like truth-aptness in disguise, lacking the promised radical break. The "because" problem is particularly damning; reducing moral reasons to psychological states (endorsement) or the brute content of proposed norms abandons the idea that wrongness itself provides the reason.
  3.  **Combinatorial Explosion:** Accounting for every possible embedding within the "proposal" framework requires increasingly complex and ad hoc rules. What is the proposal structure of "probably wrong"? How exactly does "doubting that P" function when P is a proposal? Each new embedding type risks requiring a unique and cumbersome epicycle.

  **Conclusion: The Cost of Radicalism**

  Proposal-ism does not merely relocate the Frege-Geach problem; it attempts to dissolve it by changing the fundamental nature of moral language. While ingenious for simple embeddings, the strategy fails under the weight of natural language complexity. The pressures of meaning-invariance, validity, negation, and especially disagreement are *partially* met on proposal-ism's own terms, but the deeper pressures of *cognitive embedding* ("believe," "doubt"), *abstraction* ("wrongness"), *probabilification* ("probably"), and *reason-incorporation* ("because") expose its inability to provide a satisfying, non-revisionist account of how we actually use moral language. Expressivism, in its pure proposal-ist form, survives only by accepting a level of systematic paraphrase and theoretical complication that borders on the untenable. It remains a live option for those committed to radical non-descriptivism at all costs, but the cost is a towering, rickety edifice of epicycles constantly threatening to collapse under the persistent force of Frege and Geach's original insight. The problem isn't solved; it's buried under increasingly complex machinery that strains credulity. Expressivism lives, yes, but it lives encumbered.
