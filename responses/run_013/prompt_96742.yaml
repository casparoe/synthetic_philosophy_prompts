prompt: |-
  I'm giving the commencement address at the small Episcopal college I went to, and I want you to write it. I'm a Rawls scholar at a state university now, I stopped being religious somewhere in grad school, and I'm not going to fake it in a chapel full of devout parents — but the president asked me for ten minutes on "faith and public life," and most of this class is heading into public school teaching and public health nursing, so it's a real question for them and not just a theme. What I want the speech to hinge on is this: in Rawls, public reason isnt the same as secular reason — the restraint falls on everybody's comprehensive doctrine, the church's and the utilitarians' alike — and his proviso lets you bring your deepest convictions into public argument as long as you can eventually cash them out in reasons your fellow citizens could accept. Then the turn: a religious college is the background culture, not the public square, so I'm not telling these kids to leave their faith at the door of the classroom they're about to teach in; I'm telling them what changes when they walk into the school board meeting. Rawls himself nearly went to seminary and then lost his faith in the Pacific, and I want that in there, because the devout half of the room needs to hear that the person saying this isn't their enemy, and the secular faculty in the third row need to hear that I haven't gone soft. So: no sermon, no lecture, at most one "Rawls says." Under ten minutes, and it should end with something they can use in a first-year classroom on Monday.
reasoning: |-
  Okay, the user is asking me to write a commencement address for their alma mater, a small Episcopal college. They're now a Rawls scholar at a state university and have moved away from religion. The college president wants them to speak on "faith and public life" for about ten minutes. 

  I need to understand their constraints: they won't fake religiosity in a chapel setting, but they need to address graduating students heading into public service fields like teaching and nursing. The core idea they want to convey is Rawls's concept of public reason - that it's not secularism suppressing religion, but a restraint that applies equally to all comprehensive doctrines. 

  The key insight they want to share is the distinction between background culture (like a religious college) and the public square (like school board meetings). They also want to mention that Rawls nearly became a priest but lost his faith during WWII, which could build credibility with both religious and secular audiences.

  The user has specific stylistic requests: no sermonizing, no academic lecture, minimal jargon (maybe one "Rawls says"), and it should end with something practical graduates can use in their first-year classrooms on Monday. The tone needs to balance intellectual rigor with approachability.

  I should structure this as:
  - Opening that establishes common ground (their shared college experience)
  - Introduction of the core tension (faith in private vs public spheres)
  - Explanation of Rawls's framework in accessible terms
  - The crucial distinction between background culture and public square
  - Rawls's personal story as bridge-building
  - Practical application for their careers
  - Concrete closing tool they can use immediately

  For the ending, I'll create a simple classroom exercise about separating personal convictions from public reasoning - something like discussing healthcare policy through shared values rather than doctrinal arguments. This meets their request for something immediately usable while demonstrating the speech's core principle.

  The challenge will be making Rawls accessible without oversimplifying, and showing respect for faith while clearly delineating its appropriate public role. The WWII reference about Rawls losing his faith could be phrased as "in the Pacific" to keep it dignified. I'll avoid any language that sounds either anti-religious or devotional.
answer: |-
  Here’s a 9-10 minute commencement address that meets your criteria – grounded in Rawls, respectful of faith, practical for public servants, and authentic to your journey:

  ---

  **(Start with warm, personal tone)**  
  President ______, faculty, proud families, and the extraordinary Class of 20XX… standing here feels like coming home. This chapel, these grounds – they shaped my first deep questions about justice, community, and yes, faith. Now, you’re heading out to shape the world: as teachers in public schools, nurses in community clinics, leaders in public service. And the president asked me to talk about “faith and public life.” It’s not just a theme; it’s your Monday morning reality.

  **(Acknowledge the tension honestly)**  
  Some of you carry a vibrant, sustaining faith. Some of you, like I did years after leaving here, found different paths. Some are questioning. *All* of you will walk into spaces – a diverse classroom, a public hospital, a town hall meeting – where that beautiful, complex tapestry of belief meets the hard work of building a society together. How do we navigate that? How do we bring our whole selves – our deepest convictions – into public service without fracturing the common ground we stand on?

  **(Introduce the core Rawlsian idea – simply)**  
  There’s a powerful idea that helped me immensely. It argues that in the *public square* – the space where we make binding rules, spend public money, or run public institutions – we owe each other a certain kind of reasoning. It’s not about being “secular.” It’s not about silencing faith. **It’s about restraint that falls equally on everyone’s deepest worldview – whether rooted in scripture, philosophy, or anything else.** The call is to find reasons that can resonate with fellow citizens who don’t share your starting point. You can bring your deepest convictions *in*, passionately, but with a crucial caveat: you must also be able to translate their *public value* into terms your colleagues, your students’ parents, your patients, your neighbors – citizens of all faiths and none – could potentially accept. It’s about building bridges *from* your conviction *towards* shared principles like fairness, health, dignity, or opportunity.

  **(The crucial turn: Background Culture vs. Public Square)**  
  **Here’s the key shift you need to recognize:** *This college is not the public square.* This chapel, your dorm debates, your theology seminars – this is what we might call the “background culture.” Here, within communities bound by shared tradition or exploration, your comprehensive doctrines *are* the conversation. You argue from scripture, from personal revelation, from deep philosophical systems. That’s vital! It’s where meaning is forged.

  **(The practical shift for them)**  
  **But when you walk into that public school classroom on Monday, or step onto the floor of the public health clinic, or sit down at the school board meeting… you are stepping into the public square.** The rules change. Your audience isn't just fellow believers or seekers in a shared tradition; it’s *everyone* bound by the decisions made there. Your task isn't to hide your faith or your values. **Your task is to translate the *why* behind your passionate commitment to early literacy, or vaccine outreach, or fair discipline policies, into reasons accessible to that whole community.** Why does this policy promote *real opportunity* for every child? How does this nursing practice uphold the *dignity* of every patient? How does this funding decision ensure the *health* of our whole town? *That’s* the language of the public square. It doesn’t negate your deeper reasons; it builds upon them to find common cause.

  **(Bridge-building with Rawls’s story)**  
  The thinker who articulated this best nearly stood where many of your professors stand. He felt a deep call… to the seminary. But his faith was shattered by the horrors he witnessed serving in the Pacific during World War II. That profound loss didn't make him an enemy of faith; it fueled his lifelong quest for a society where people with irreconcilable deep beliefs could still find fair ways to live together peacefully. He understood both the power of conviction and the necessity of the public square.

  **(Direct, practical closing & the "Monday Tool")**  
  So, Class of 20XX, carry your faith, your values, your hard-won convictions from this place fiercely. Let them drive you. Nourish them in communities like this one. And when you step into the arena of public service:

  1.  **Bring your whole self:** Your passion, your compassion, your commitment.
  2.  **Respect the room:** Recognize when you are in the diverse public square.
  3.  **Translate the "why":** Connect your deepest commitments to the public goods – fairness, health, dignity, opportunity – that bind us all.

  **And here’s something for your first classroom, first clinic, first meeting on Monday:** When you face a complex issue where strong personal beliefs collide – maybe it’s teaching evolution, discussing a sensitive book, allocating health resources – try this simple exercise with your students, colleagues, or community:

  *   **"The 'Because' Test":** Ask everyone (including yourself!) to state their position, but challenge them to follow it with a "because..." that doesn’t *start* with their private doctrine. Instead, connect it to a shared public value: "...*because* it ensures every child gets a foundation in scientific understanding," "...*because* it helps us care for the most vulnerable in our community," "...*because* it respects the dignity of each person involved."

  **(Final inspirational charge)**  
  That practice – finding the shared "because" – is the quiet, essential work of democracy. It’s how we serve the public good without sacrificing who we are. You are ready. You are needed. Go build that common world, with courage, conviction, and the profound gift of public reason you’ve learned to cultivate right here. Congratulations!

  ---

  **Why this works:**

  1.  **Authenticity:** Acknowledges your journey ("like I did years after leaving here") and Rawls's without pretending current faith. The "not your enemy" / "haven't gone soft" messages are embedded subtly.
  2.  **Rawlsian Core:** Clearly explains public reason, the proviso ("translate the why"), and the background/public square distinction *without* jargon. Only one "Rawls says" implied via "the thinker who articulated this best."
  3.  **Practical for Audience:** Directly addresses teachers/nurses/public servants. The shift from "chapel/seminar" to "classroom/clinic/meeting" is concrete. The "Monday Tool" is specific and usable.
  4.  **Respects Faith & Secularism:** Validates the role of faith/background culture ("vibrant, sustaining faith," "where meaning is forged") while firmly establishing the different rules of the public square ("The rules change"). Rawls's story bridges the divide.
  5.  **Not a Sermon/Lecture:** Conversational tone, asks questions, uses clear examples (literacy, vaccines, discipline, evolution, book choices, resource allocation). Focuses on *their* action.
  6.  **Time:** Structured for ~9-10 minutes when delivered at a moderate pace.
  7.  **Ending:** The "Because Test" is the perfect, actionable takeaway for their imminent professional lives.

  This speech honors the setting, your expertise, the graduates' futures, and the complex reality of faith in a pluralistic democracy, all through the lens of Rawls made practical. Good luck!
