  Below is an 8-question quiz designed to sort readers into distinct positions within the consciousness debate, based on concrete cases and claims. Each question avoids direct jargon (like "phenomenal" or "access") and focuses on scenarios where views meaningfully diverge. The cases include blindsight, partial-report/overflow, no-report paradigms, dreaming, split-brain patients, and stipulated systems (zombies and reverse zombies). Questions are phrased neutrally, and answer options reflect how different positions interpret the cases.

  The quiz is built from the logical space of **three independent questions** that define the core disagreements. These questions are implicit in the cases and are not directly asked:
  1. **Is there a separation between the "felt quality" of consciousness and its functional availability (e.g., for report)?**  
     (Separate = two-kinds realism; Not separate = GWT identity or illusionism)  
  2. **Is the "felt quality" reducible to physical processes like global workspace?**  
     (Reducible = GWT identity or illusionism; Not reducible = two-kinds realism or correlate views)  
  3. **Can we empirically resolve the "hard problem" (why consciousness feels like something)?**  
     (Yes/No = positions take stands; Agnostic = quietism)  

  Combinations of answers to these implicit questions yield the target positions. The quiz distinguishes five positions clearly, but cannot isolate the correlate view (d) as a unique category—it clusters with two-kinds realism (b) in practice. One position (panpsychism) is never landed on due to the quiz's design (explained in the scoring key).

  ---

  ### The Consciousness Quiz  
  *Answer based on your interpretation of each case. Choose one option per question.*

  1. **Blindsight case**: A person with brain damage can accurately guess the location of a dot in their blind spot but reports seeing nothing. What does this show?  
     A) The person has visual information they can use, but no conscious experience of the dot.  
     B) The person is not conscious of the dot at all; their guessing is an unconscious reflex.  
     C) The person has a faint conscious experience of the dot but cannot describe it.  

  2. **Partial-report/overflow**: In experiments, people briefly see a grid of letters. They report seeing all letters clearly, but can only report a few when asked. What does this suggest?  
     A) People experience more than they can report—consciousness "overflows" access.  
     B) People only experience what they can report; the sense of seeing all letters is an illusion.  
     C) The grid is stored briefly in memory, but only reported letters are ever conscious.  

  3. **No-report paradigms**: Scientists detect a brain signature (like EEG "ignition") linked to consciousness, even when subjects don’t report anything. What does this imply?  
     A) Consciousness can occur without report; the signature reflects the experience itself.  
     B) The signature reflects access (information availability), not necessarily conscious experience.  
     C) Without report, we can’t confirm consciousness; the signature might be unrelated.  

  4. **Dreaming**: During vivid dreams, people have rich experiences but often can’t remember or act on them until waking. What does this show?  
     A) Dreams are conscious experiences occurring without full access (e.g., memory systems are offline).  
     B) Dreams involve global brain activity that is conscious, even if some functions (like memory) are impaired.  
     C) Dreams are only confirmed as experiences upon waking; we can’t judge consciousness during sleep.  

  5. **Split-brain patient**: When an object is shown to the right hemisphere, the patient can’t name it (speech is in the left hemisphere) but can draw it with the left hand. What does this mean?  
     A) The right hemisphere has its own conscious experience, inaccessible to the left hemisphere.  
     B) The patient isn’t conscious of the object; the right hemisphere’s behavior is unconscious.  
     C) We can’t know if the right hemisphere is conscious without verbal report.  

  6. **Stipulated zombie**: Imagine a robot that behaves exactly like a human (it "reports" experiences, avoids pain, etc.) but has no inner experience—no "what it's like" to be it. Is this possible?  
     A) Yes, such a system is possible.  
     B) No, if it functions like us, it must be conscious.  
     C) We can’t know; we only observe behavior.  

  7. **Stipulated reverse zombie**: Imagine a simple organism (e.g., a roundworm) with no global workspace, but suppose it has a minimal "felt quality" (e.g., raw pain). Is this possible?  
     A) Yes, such a system is possible.  
     B) No, without global workspace activity, there is no consciousness.  
     C) We can’t know; we have no access to its inner states.  

  8. **Global workspace theory**: If we fully explain how the brain broadcasts information globally (for attention, memory, etc.), does this explain conscious experience?  
     A) Yes, that is what consciousness is.  
     B) No, it only explains access; the "felt quality" remains unexplained.  
     C) We don’t know; it might or might not.  

  ---

  ### Scoring Key  
  Tally your answers using the table below. Then, match your pattern to the positions.  

  | Question | A | B | C |
  |----------|-----|-----|-----|
  | 1        | b  | a,c | –  |
  | 2        | b  | a,c | –  |
  | 3        | a,c | b  | e  |
  | 4        | b  | a,c | e  |
  | 5        | b  | a,c | e  |
  | 6        | b,c | a  | e  |
  | 7        | b,d | a,c | e  |
  | 8        | a,c | b,d | e  |

  *Letters in cells denote positions that typically choose that answer:  
  a = GWT identity, b = two-kinds realism, c = illusionism, d = correlate view, e = quietism*  

  #### How to score:  
  1. **Count position matches**: For each question, note which position(s) your answer aligns with (e.g., if you chose 1A, it matches position b).  
  2. **Identify your dominant position**: Tally how many questions align with each position. Your position is the one with the **most matches**.  
     - Tie? Prioritize this order: e > b > c > a > d (quietism overrides due to agnosticism; two-kinds overrides due to quiz design).  
     - If tie includes e, you are quietist.  
  3. **Map to positions**:  
     - **a) GWT identity**: Global availability *is* consciousness; no "further fact." (e.g., answers like 1B, 2B, 3A, 4B, 5B, 6B, 7B, 8A).  
     - **b) Two-kinds realism**: Access and phenomenal consciousness are separate; workspace explains access only. (e.g., answers like 1A, 2A, 3B, 4A, 5A, 6A, 7A, 8B).  
     - **c) Illusionism**: The "felt quality" is an illusion; workspace explains everything. (e.g., answers like 1B, 2B, 3A, 4B, 5B, 6A, 7B, 8A).  
     - **d) Correlate view**: Workspace is a correlate; something else (e.g., local recurrence) explains consciousness. (This is **not a distinct result**—it clusters with b. See *Limitations* below.)  
     - **e) Quietism**: Science studies access; the phenomenal question is open. (≥4 "C" answers, especially in 3/4/5/6/7/8).  

  #### Limitations:  
  - **Correlate view (d) is not distinguished**: It requires the same answers as two-kinds realism (b) in all questions except possibly 3A or 7A, but in practice, these are rare/overlapping. The quiz treats it as part of (b).  
  - **Panpsychism is missing**: Views where consciousness is fundamental (e.g., in simple systems) would need 7A and 8B but also reject separation (implicit question 1). This combination never appears, as 7A typically aligns with (b) or (d), which accept separation.  
  - **Zombie/reverse zombie tensions**: Positions a, c, and e are split cleanly on these; b and d overlap but are resolved by the dominance rule.  

  \answer{1} position (panpsychism) is never landed on, and one position (correlate view) is not distinguished from two-kinds realism.
