  We are designing a quiz to sort readers into positions in the consciousness debate. The key positions we want to capture are:

  a) Global workspace theory (GWT) where global availability is identical to consciousness (so no separate phenomenal consciousness).
  b) Two-kinds realism: access consciousness (A-consciousness) and phenomenal consciousness (P-consciousness) are separate, and GWT is only about A-consciousness.
  c) Illusionism: P-consciousness is an illusion, and GWT (or similar) explains everything.
  d) GWT is a correlate: something else (e.g., recurrent processing, higher-order thought) is the real basis of consciousness, and global broadcast is downstream.
  e) Quietism: we can study access consciousness and leave the phenomenal question open.

  Additionally, we might consider:

  f) Panpsychism or fundamental property views: consciousness is a fundamental property of matter, and global broadcast might be a way it gets organized, but it's not necessary for the existence of phenomenal properties.

  But note: the quiz must be built from concrete cases and claims that force distinctions.

  We are to avoid asking directly about "felt quality". Instead, we use cases:

  1. Blindsight: patients can respond to visual stimuli without reporting seeing them.
  2. Partial-report/overflow: experiments (like Sperling) show that subjects have more information in consciousness than they can report at once.
  3. No-report paradigms: neural signatures of global ignition are present even when no report is required (or possible).
  4. Dreaming: during REM sleep, there is vivid experience but limited access (e.g., memory formation is impaired).
  5. Split-brain: each hemisphere seems to have its own stream of consciousness, and the left hemisphere (which controls speech) may not have access to the right hemisphere's information.
  6. Stipulated system: a system that has global broadcast and reports exactly like a human, but by stipulation has no phenomenal consciousness (a philosophical zombie).
  7. Reverse case: a system that by stipulation has phenomenal consciousness but no global broadcast (e.g., a simple organism or an AI with raw feels but no central system).

  We design 8-10 questions. Each question has 2-3 answer options. We will map patterns of answers to the positions.

  First, we break down the logical space. The key independent questions (dimensions) are:

  1. Is there a distinction between A-consciousness and P-consciousness? (Yes/No)
  2. If yes, is P-consciousness reducible to physical processes? (Yes: then we might have illusionism or identity; No: then we have dualism or mysterianism)
     But note: we don't want to ask directly. We have to infer from cases.

  Alternatively, we can think in terms of:

  - The relationship between global broadcast and consciousness:
    a) Identity: global broadcast = consciousness (both A and P).
