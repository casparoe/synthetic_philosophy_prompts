  Next, misconceptions to address. Some might think the case is just about large numbers, so emphasizing that the core issue arises even in small cases is important. Others might dismiss anti-aggregation as emotional or pro-aggregation as cold calculation. Need to show both positions have principled foundations. The Kantian lever (treating persons as ends) can introduce the anti-aggregation view but then show it doesn't resolve the dilemma, pushing students to dig deeper into the betterness relation.

  Timing is tight—75 minutes. Open with a concrete scenario to engage them. Use small groups to discuss the initial case, then bring it back to the board. Introduce the reframing after they've seen the conflict in a small scale. Scaling up to 3^50 should reveal the structural commitments without getting lost in math. The veil of ignorance vs. known position distinction is important here to clarify that the aggregation question is about betterness, not choice under uncertainty.

  Check for understanding: Ask them to state what each position implies about harm aggregation in non-absurd cases. This shifts focus from picking sides to understanding the underlying principles. Leave out decision theory, probability, and other population ethics dilemmas to keep the session focused.

