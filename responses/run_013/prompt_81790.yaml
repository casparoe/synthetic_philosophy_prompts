  Finally, ensure the structure is clear: start small, identify commitments, scale up to test consistency, then reframe. Use Kant as a starting point but show its limitations. The goal is for students to see that the dilemma exists even without large numbers, and each answer imposes a structure on moral reasoning.
answer: |-
  Here’s a teaching plan designed around your reframing, with timing and dependency structure. The core insight: **The torture/dust specks dilemma forces a choice between two structures of moral reasoning, both already present in ordinary cases.**

  **Dependency Structure (Why Standard Order Fails):**  
  Standard presentations jump to astronomical numbers (3↑↑50), triggering cognitive shutdown or tribal reflexes. Students miss that *the core structural conflict exists at small scales*. We must:  
  1. **Establish a baseline betterness relation** in non-absurd cases (needs relatable harms).  
  2. **Show aggregation/anti-aggregation in action** *before* scaling.  
  3. **Reframe early** around "What must betterness look like?" to avoid "which is worse?" deadlock.  
  4. **Scale only after** commitments are visible, revealing consistency demands.  
  5. **Separate betterness from choice under uncertainty** (a common conflation).  

  ---

  ### Teaching Plan (75 mins)  
  **Whiteboard Use:** Two columns: "Aggregation" | "Anti-Aggregation". Track features of each view as discovered.  

  #### (0-10 mins) **Anchor in Familiar Harms**  
  - **Activity:** Pose *The Carrying Case*: *"One person suffers 6 hours of agonizing pain (A). Alternatively, 100 people each carry a 10kg backpack for 1 hour (B). Which world is better, if either?"*  
  - **Why:** Concrete, no absurd numbers, harms relatable (pain vs. minor inconvenience). Students intuit B is worse for each but *maybe* A is overall worse.  
  - **Key Q:** "Is A *better than* B? Worse? Or can we not compare?" (Don’t vote—probe reasoning).  
  - **Goal:** Surface intuitions. Expect split. Note: Both answers imply *something* about how harms combine.  

  #### (10-25 mins) **Reframe: What Must Betterness Look Like?**  
  - **Pivot:** "Forget ‘which is worse.’ Suppose you think A is better. What must be true about how *harms add up*? If you think B is better or incomparable, what does that imply?"  
  - **Tool:** Whiteboard the two columns. From student responses, extract:  
    - *Aggregation:* "Total burden matters. Small burdens *sum* into a moral weight that can offset large burdens."  
    - *Anti-Aggregation:* "Some harms (agony) aren’t offset by *any* number of minor annoyances. Betterness looks at *kinds* of burdens, not just totals."  
  - **Clarify:** "This isn’t about numbers yet. It’s about the *structure* of moral reasoning. Both views exist in this small case."  
  - **Misconception Head-off:** Preempt "squeamishness" charge—note anti-aggregation may stem from seeing agony as qualitatively distinct (Kantian lever coming).  

  #### (25-35 mins) **Kant as Lever (and its Limits)**  
  - **Activity:** "Recall Kant: ‘Treat persons as ends, never merely as means.’ How might this support anti-aggregation?"  
    - *Anti-aggregation view:* "Choosing B uses the one tortured person *as a means* to spare many small burdens. Agony can’t be traded off."  
  - **Pivot:** "But could Kant support aggregation? If each person’s interest counts equally, doesn’t summing burdens respect each?"  
  - **Limit:** "Kant doesn’t settle this. It tells us *why* persons matter, not *how* harms compare across lives. We need axiology."  
  - **Why now:** Uses prior knowledge to motivate anti-aggregation, then complicates it. Shows both views can be principled.  

  #### (35-50 mins) **Scale Up the Carrying Case**  
  - **Activity:** Modify *Carrying Case*: "Same agony (A). Now, 1 billion people carry a 1g feather for 1 minute (C). Is A better, worse, or incomparable to C?"  
  - **Why:** Feather is trivial (less than dust speck!), numbers large but comprehensible. Scaling tests structural commitments.  
  - **Probe Aggregation:** "If you thought burdens sum, does C’s *total* burden (1bn min-feathers) outweigh 6h agony? If yes, what rate?"  
  - **Probe Anti-Aggregation:** "If agony is incomparable to minor annoyances, does *any* number of feathers change that?"  
  - **Scaling’s Role:** *Rhetorical* (exposes where intuitions balk) but *evidential* for consistency. If you aggregated in small case, consistency demands aggregation here.  
  - **Misconception Head-off:** Crush "trick with large numbers"—the *logic* was set in the small case. Scaling reveals implications.  

  #### (50-65 mins) **Introduce Torture vs. Dust Specks (Briefly)**  
  - **State:** "Now the classic: 1 person tortured for 50 years vs. 3↑↑50 people each getting a dust speck. Don’t fixate on the number—it’s shorthand for ‘enough people.’"  
  - **Activity:** "Apply your betterness structure. If aggregation, *some* number suffices. If anti-aggregation, *no* number suffices. The dilemma is forced by your prior commitment."  
  - **Key Q:** "Does your view from the carrying case imply an answer here? If not, why?"  
  - **Veil of Ignorance vs. Known Position:**  
    - *Distinguish:* "Choosing behind a veil (not knowing your role) asks about *fairness*. Betterness asks which world has *less bad stuff* overall. They’re different!"  
    - *Example:* "You might aggregrate burdens (betterness) but choose the torture world behind a veil to avoid tiny agony-risk. Or vice versa."  

  #### (65-75 mins) **Check for Understanding & Wrap-up**  
  - **Check:** "**In ordinary cases (like the Carrying Case), what does the anti-aggregation view imply about comparing a severe harm to many minor ones? What does the aggregation view imply?**"  
    - *Target:* They articulate structural features (e.g., "anti-aggregation sees severe harms as non-fungible with minor ones," "aggregation requires a trade-off rate").  
  - **Misconception Head-off:** Avoid "numbers win" framing—aggregation isn’t "majority wins," it’s "total burden matters."  
  - **What We Left Out (Say Aloud):**  
    - "We didn’t resolve which view is correct. That’s for deeper axiology."  
    - "We skipped decision theory (veil vs. betterness distinction suffices here)."  
    - "We avoided other paradoxes (e.g., the Repugnant Conclusion). Focus was on the *structure* of harm aggregation."  

  ---

  ### Why This Works  
  - **Carrying Example Carries the Session:**  
    - **Has:** Relatable harms, forces aggregation/anti-aggregation choice at small scale, scales cleanly.  
    - **Lacks:** Probability, identity uncertainty, distracting enormity.  
    - **Scaling:** Rhetorically pressures intuitions; evidentially tests consistency of initial premises.  
  - **Reframing First:** By making "betterness structure" the focus *before* absurd numbers, students engage the logic, not tribal loyalty.  
  - **Kant Used Sparingly:** Leverages existing knowledge to motivate anti-aggregation but shows its limits quickly—prevents "Kant settles it" overreach.  
  - **Timing Guards:** Strict pacing prevents rabbit holes. Scaling step (35-50 mins) is where "rationalist" students may dig in—keep focus on *their prior commitment*, not the number.  

  **Crucial:** At every stage, force the question: "*Given your view, what must be true of how harms combine?*" This preempts posturing and unlocks the structural insight.
