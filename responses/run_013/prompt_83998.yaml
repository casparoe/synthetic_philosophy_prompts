prompt: |-
  I'm a graduate student in a metaphysics seminar, and there is a move in discussion that I keep running into and cannot evaluate. We spent a session on the view that ordinary composite objects — tables, trees, cats — do not strictly exist, and that the world contains only fundamental particles arranged in various ways and never any further thing over and above them. When the debate grew heated, another student waved it off: the dispute, he said, is just a verbal dispute, because the two sides mean different things by 'exists' and each could translate the other's language without loss. On that basis he concluded that there is nothing left here to argue about. I think this is too quick, but I cannot say precisely where it goes wrong, in part because I cannot say what calling something a verbal dispute is supposed to mean.

  Please lay out, as a menu I can take back to the seminar, the different precise claims that calling a disagreement a verbal dispute could be making, ordered from the nearly trivial to the most radical. For each reading, tell me what it commits you to, whether it is plausible for the case at hand, whether it is a platitude, a substantive and defensible thesis, or something false, and — what I most need — whether it actually supports the conclusion my classmate drew, that there is nothing left to argue about. Distinguish in particular: a reading on which the two sides attach different senses to a key term but may still have a genuine disagreement once that is sorted out; a reading on which they agree about all the facts and differ only over which sentences to utter; a reading on which there is no fact of the matter about the disputed question; and any reading on which the dispute is not a genuine disagreement at all, but only a clash of frameworks or of practical choices. If some of these readings would vindicate the thought that the disagreement is real even though it turns on words, say so, and tell me which single reading the dismissal actually needs in order to work and whether my classmate is entitled to it.
reasoning: |-
  Okay, this is a really sophisticated question from a graduate metaphysics seminar. The user is wrestling with a classmate's dismissal of a metaphysical debate about composite objects as "merely verbal." They need help unpacking what that phrase could mean and whether it legitimately ends the discussion. 

  First, I need to recognize the stakes here. The user isn't just asking for definitions - they're trying to defend the substantive nature of metaphysical inquiry against a skeptical challenge. Their classmate's move threatens to dissolve a core debate in ontology. The user senses this is wrong but lacks tools to articulate why. 

  The key insight I should emphasize is that "verbal dispute" is an ambiguous term that ranges from trivial to metaphysically loaded. Many versions don't actually support the dismissive conclusion. Let me map the terrain:

  At the shallow end, we have the trivial observation that people use words differently. But this doesn't touch the substance - once we disambiguate "exists," we might still have real disagreement about whether tables are fundamental. 

  More interesting is Chalmers' "metalinguistic negotiation" idea. Here the dispute isn't about facts but about how to use language. But crucially, this might still matter - choosing meanings isn't arbitrary when meanings carry theoretical commitments. 

  Then there's the radical Carnapian view where existence claims are framework-relative with no external truth. But this itself is a controversial metaphysical stance, not a neutral observation. 

  The user's classmate seems to assume something like the "no fact of the matter" view. But they can't just assert this without arguing for it - that would beg the question against the realist. 

  What the user really needs is to expose that calling something "verbal" often smuggles in substantive philosophical commitments. The dismissive move only works if you already accept anti-realism about ontology, which is exactly what's being debated. 

  I should structure this as a clear menu so the user can respond in seminar. Each option should show: (1) what's claimed, (2) what it commits to, (3) whether it supports dismissal, and (4) its plausibility for this case. The progression from weak to strong readings will help the user demonstrate how the classmate's move requires contentious assumptions.
answer: |-
  Here is a menu of precise readings for "verbal dispute," tailored to your seminar context, ordered from weakest (least dismissive) to strongest (most dismissive). Each includes commitments, plausibility for the composite objects case, status as platitude/substantive/false, and whether it supports your classmate's dismissal:

  ### The Menu: Readings of "Verbal Dispute"

  1.  **Lexical Ambiguity / Semantic Non-Coreference**
      *   **Claim:** The key term 'exists' (or 'composite object') has different meanings/senses/reference-fixing conditions for each side. They are talking past each other.
      *   **Commits To:** Words can have different meanings; speakers can be unaware of this divergence in a specific context.
      *   **Plausibility Here?** High. It's likely the nihilist uses 'exists' more restrictively (e.g., only fundamental entities) while the proponent of ordinary objects uses it more liberally (e.g., entities with a certain unity/function). Terms like 'table' might function differently (descriptive cluster vs. mereological sum).
      *   **Status:** Near-platitude (common in philosophy).
      *   **Supports Dismissal?** **No.** This diagnoses *miscommunication*, not lack of substance. Once meanings are clarified, a *genuine disagreement about the world* likely remains: "Given *this* precise meaning of 'exists' (e.g., mind-independent, non-redundant causal role), are there things satisfying it besides fundamental particles arranged table-wise?" Sorting the words reveals the underlying factual disagreement.

  2.  **Conceptual Divergence / Different Carnapian Frameworks**
      *   **Claim:** The sides operate within different conceptual frameworks or linguistic systems ("linguistic frameworks"). 'Exists' is tied to different constitutive rules or analytic principles within each framework. There's no neutral meta-framework to adjudicate.
      *   **Commits To:** Meaning is deeply tied to holistic conceptual schemes; some disputes lack a framework-independent truth condition.
      *   **Plausibility Here?** Moderate/Contested. Compatible with Carnapian internal/external questions. The nihilist framework might have an analytic principle "Only simples exist," while the ordinary object framework has "Aggregates with function F exist."
      *   **Status:** Substantive (and controversial) thesis (Carnap, Putnam-influenced views).
      *   **Supports Dismissal?** **Conditionally.** If this is correct, the dispute becomes about *which framework to adopt*, not about a framework-independent world. However, this framework choice may *itself* be substantive (based on values like simplicity, explanatory power, fidelity to perception) – meaning there's still something *important* to argue about, just not a straightforward factual disagreement *within* a shared framework. Your classmate's dismissal is only justified if framework choice is *entirely* non-rational or arbitrary, which is itself a strong claim.

  3.  **Metalinguistic Negotiation / Terminological Preference**
      *   **Claim:** The sides agree entirely about all the non-linguistic facts (the arrangements of particles, their properties, causal powers, etc.) but disagree only about *which linguistic label* ('exists', 'table') to apply to those facts. It's a dispute about word usage, not world structure.
      *   **Commits To:** There is a complete, shared description of reality at the fundamental level (particle physics + arrangements); the dispute is solely about semantic conventions.
      *   **Plausibility Here?** **Very Low.** Central to the nihilist position is that *adding* 'and there is a table' to the description of particle arrangements *adds a falsehood* or misleading redundancy. The proponent of tables thinks it adds a crucial *truth*. They fundamentally disagree about whether the particle arrangement *constitutes* a further entity. They disagree on the *facts* about ontological commitment.
      *   **Status:** False (for this case), or at best a highly contentious substantive claim.
      *   **Supports Dismissal?** If true, **Yes** (it would make the dispute purely linguistic). But it's implausible for precisely this debate, as it assumes the core point (that there's nothing more to agree on) is already settled.

  4.  **No Fact of the Matter (Metaphysical Indeterminacy)**
      *   **Claim:** There is no objective, determinate truth about whether composite objects exist. Reality itself is indeterminate between the two descriptions; neither is uniquely correct.
      *   **Commits To:** Metaphysical indeterminacy is possible and applies to ontological categories.
      *   **Plausibility Here?** Low/Contested. While debated for vague objects, applying it to the very *existence* of a pervasive category like composite objects is radical and faces significant challenges (e.g., what grounds the indeterminacy?).
      *   **Status:** Substantive (and highly controversial) thesis.
      *   **Supports Dismissal?** **Yes,** but only if true. It concludes there is *nothing* to argue about because there is no truth to discover. However, claiming *this* requires its own defense and is far more contentious than the original dispute. Your classmate cannot simply *assume* this.

  5.  **Non-Cognitive Clash (Emotive/Practical)**
      *   **Claim:** Utterances like "Tables exist" or "Only particles exist" are not truth-apt statements describing the world. Instead, they express attitudes (e.g., comfort with ontological commitment), practical stances (e.g., a decision to quantify over composites for simplicity), or frameworks for organizing experience.
      *   **Commits To:** Emotivism/Expressivism/Non-Cognitivism about ontological discourse.
      *   **Plausibility Here?** Very Low for mainstream metaphysics. Treating existence claims as non-truth-apt is deeply revisionary and arguably fails to capture the nature of the debate and the participants' own understanding.
      *   **Status:** Highly controversial substantive thesis (akin to non-cognitivism in ethics).
      *   **Supports Dismissal?** **Yes,** but only if true. If ontological claims aren't truth-apt, there's no genuine disagreement about facts, only a clash of attitudes or practical choices. Again, this is a radical claim needing defense, not an observation.

  **Which Reading Does Your Classmate Need & Are They Entitled to It?**

  *   **The Reading Needed:** Your classmate needs a reading strong enough to support the conclusion that **there is no genuine disagreement about reality left once language is sorted out.** This requires one of the stronger readings: **#3 (Metalinguistic Negotiation), #4 (No Fact), or #5 (Non-Cognitive)**.
  *   **Entitlement:** **No, your classmate is not entitled to assume any of these stronger readings.**
      *   **#3** assumes the core factual disagreement doesn't exist, which is precisely what's at stake.
      *   **#4 & #5** are highly substantive, controversial metaphysical theses. Asserting them to dismiss the debate *begs the question* against the realist (who thinks there *is* a fact) and even against many anti-realists (like the nihilist, who thinks the fact is *that composites don't exist*). Claiming the dispute is verbal in senses #4 or #5 is *itself* a major metaphysical claim requiring argument, not a neutral observation.

  **Conclusion & Seminar Response Strategy:**

  Your classmate's dismissal is too quick because:

  1.  **The plausible reading (#1 - Lexical Ambiguity) doesn't support dismissal;** it just calls for clarification before engaging the *real* disagreement.
  2.  **The readings needed for dismissal (#3, #4, #5) are implausible (#3) or highly contentious substantive claims (#4, #5) that cannot be merely asserted to end the debate.** Doing so is question-begging.

  **How to Respond in Seminar:**

  *   "I agree 'exists' might be used differently. Let's stipulate a precise meaning: say, 'X exists' means 'X is a fundamental, non-redundant entity in our best ontology'. Now, is there such an entity where we see a table, *over and above* the particles? *That* is the substantive question, not the word 'exists'."
  *   "Claiming it's *only* about words assumes either that we all agree on the fundamental facts (#3) – but we don't, the nihilist denies the table is a fact – or that there's no fact of the matter (#4) – but that's a huge additional claim you need to argue for, not just assert."
  *   "Even on a framework view (#2), choosing a framework involves substantive considerations (simplicity, explanatory power, intuitive cost) – so the argument shouldn't stop, it just shifts to *why* prefer one framework over another?"
  *   **Core Point:** **Calling a dispute 'verbal' doesn't magically dissolve it; it often just relocates it or presupposes a controversial resolution.** The burden is on the dismisser to show *why*, after clarifying terms, there's nothing left to disagree about regarding the structure of reality. They haven't met that burden.
