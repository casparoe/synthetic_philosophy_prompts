  ### Distributive Justice Trading Activity: "The Token Exchange"

  #### **Objective**:  
  Demonstrate how voluntary exchanges can lead to unequal outcomes that appear just under historical entitlement principles, then challenge this by revealing a prior injustice in initial endowments. Students will confront tensions between liberty, desert, and rectification.

  ---

  ### **Rules & Setup**  
  **Time**: 75 minutes  
  **Participants**: 18 students  
  **Materials**:  
  - 180 tokens (e.g., poker chips, paper slips)  
  - 18 role cards (1 "Artist," 1 "Gambler," 16 "Traders")  
  - 1 coin (for Gambler)  
  - Whiteboard to track trades/distribution  
  - Timer  

  #### **Phase 1: Trading (25 min)**  
  - **Initial Endowments**: Each student receives 10 tokens.  
  - **Roles**:  
    - **Artist (Desert-based gain)**: Can "create" art (e.g., draw a quick sketch, write a haiku) upon request. Must charge *at least 1 token* per service.  
    - **Gambler (Luck-based gain)**: Runs coin-toss games. Players bet tokens on heads/tails; Gambler keeps 20% of all bets as a "fee," winner takes the rest.  
    - **Traders**: Can exchange tokens freely (e.g., gifts, swaps, bets).  
  - **Rules**:  
    1. All trades must be voluntary and bilateral (no coercion).  
    2. No group trades or external enforcement.  
    3. Tokens are redeemable for non-monetary rewards (see Payoff Scheme).  

  #### **Payoff Scheme**  
  - **No money used**. Final tokens convert to:  
    - **20+ tokens**: Priority choice of seminar reading for next week + "Distinction" certificate.  
    - **10–19 tokens**: Standard reading assignment.  
    - **<10 tokens**: Extra 1-page response on the reading.  
  *(Incentivizes accumulation without financial stakes.)*  

  ---

  ### **Timeline**  

  | **Segment**            | **Time** | **Key Actions**                                                                 |
  |------------------------|----------|---------------------------------------------------------------------------------|
  | **Introduction**       | 5 min    | Explain rules, assign roles, distribute tokens. Emphasize voluntariness.        |
  | **Trading Phase**      | 20 min   | Students trade freely. Facilitator monitors, records trades on whiteboard.      |
  | **Distribution Check** | 5 min    | Display token distribution (no names). Ask: *"Is this outcome fair? Why?"*      |
  | **The Reveal**         | 10 min   | Disclose: *"Initial 10-token endowments came from a rigged prior round: half started with 15 tokens, half with 5, then traded freely."* |
  | **Group Decision**     | 15 min   | Debate: *"Should we reset to equality? Why/why not?"* Vote.                     |
  | **Debrief**            | 20 min   | Map phases to justice theories, name Nozick, note unresolved rectification.    |

  ---

  ### **Design Notes**  
  1. **Inequality Mechanism**:  
     - **Artist** gains tokens via *desert* (services valued by peers).  
     - **Gambler** gains via *luck* (coin-toss fees).  
     - **Traders** create inequality through gifts/uneven swaps (e.g., "I’ll give you 2 tokens for your pen").  
     - **Result**: Gradual drift toward inequality (e.g., Artist/Gambler accumulate; some Traders lose tokens via gifts/bad bets).  

  2. **Voluntary Transfers**:  
     - Each trade is peer-to-peer and consensual (e.g., "I bet 3 tokens on heads").  
     - Students see unequal outcome as "earned" (Artist) or "lucky" (Gambler), not imposed.  

  3. **The Reveal**:  
     - Disclose rigged prior round *after* inequality emerges.  
     - Key question: *Does injustice in the starting point invalidate current holdings?*  

  ---

  ### **Debrief Script**  
  *(Map phases to justice theories; reveal Nozick last.)*  

  1. **Historical vs. Patterned Principles**:  
     - **Trading Phase**: "You judged outcomes by *how they arose* (voluntary exchanges). This mirrors **historical principles**: justice depends on fair processes, not equality."  
     - **Distribution Check**: "When you saw inequality, some called it fair because trades were free—this is the **entitlement view**."  

  2. **Desert vs. Entitlement**:  
     - "The **Artist** gained tokens through *desert* (value created). The **Gambler** gained through *luck*. Yet both claim entitlement—showing entitlement and desert can diverge."  

  3. **The Reveal’s Challenge**:  
     - "Learning the initial endowments were rigged forced you to confront **rectification**: How far back must we go to fix injustice? The entitlement view (Nozick) demands rectification but doesn’t specify *how*."  
     - **Name Nozick**: "This is Robert Nozick’s entitlement theory: justice requires (1) just acquisition, (2) voluntary transfer, and (3) rectification of past injustice."  

  4. **Unresolved Element**:  
     - "The activity *cannot settle rectification*. We saw this when your group debated resetting tokens but couldn’t agree. Nozick leaves rectification vague—it’s a social/political choice, not a formula."  

  ---

  ### **Predictable Problems & Solutions**  
  1. **Problem**: Low trading engagement (students avoid risk).  
     **Solution**: Assign Artist/Gambler to outgoing students; announce time pressure ("5 min left!").  

  2. **Problem**: Equal distribution persists (e.g., Traders swap 1:1).  
     **Solution**: Secretly prompt a few Traders to make unequal offers (e.g., "I’ll give 3 tokens if you sing").  

  3. **Problem**: Group votes to redistribute early, undermining the reveal.  
     **Solution**: In Distribution Check, stress *hypothetical* fairness ("Imagine this is final—would you intervene?"). Post-reveal, ask: "Does new info change your vote?"  

  4. **Problem**: Students dismiss the rigged round as "not real."  
     **Solution**: Preempt: "This mirrors real-world inheritance/privilege. How should societies handle historical injustices?"  

  5. **Problem**: Time overrun in trading/debate.  
     **Solution**: Use strict timers; cut off trading at 20 min. If debate runs long, skip vote and pose: "What would you do if we had time?"  

  ---

  ### **Why This Works**  
  - **Endorses entitlement view early**: Voluntary trades make inequality seem legitimate.  
  - **Doubt emerges post-reveal**: Rigged initial endowments expose the theory’s blind spot (rectification).  
  - **Liberty-pattern tension**: Resetting tokens *after* trades feels like violating consent, illustrating Nozick’s critique of patterned equality.  

  Run this once, and students will leave debating whether liberty trumps equality—or vice versa.
