  I've been reading about Moloch / multipolar traps and I want a case built to order instead of the usual examples everyone reaches for. Build me a race to the bottom where nobody is competing over anything scarce and nobody is being greedy or aggressive — every single move in the whole thing is defensive, somebody just protecting themselves — and yet it still spirals into an outcome that's worse for literally everyone than if they'd all done nothing at all. Constraints: keep it realistic (a workplace, a neighborhood, a market for some boring normal product — no AI doomsday, no arms race, no overfishing), one paragraph, and the trap has to fall out of moves that are each individually the prudent thing to do, not out of anyone having bad options or bad information. I'm using this for a lunch-and-learn with some engineers, and the whole point is to test whether these traps are actually real or just a story people like to tell, so the case has to genuinely work — if the bad outcome is just stipulated or smuggled in, it's cheating and I'll notice.

  Give me back exactly five numbered items, a sentence or two each, no intro and no conclusion: (1) the scenario itself; (2) each party's reasoning for why thier move is the sensible one; (3) why it's a real trap, i.e. worse for everyone than the do-nothing baseline; (4) the one feature that's doing the actual work, and whether the trap collapses if you pull that feature out; (5) how someone who thinks rational self-interest and the market just sort this stuff out would attack the case.
