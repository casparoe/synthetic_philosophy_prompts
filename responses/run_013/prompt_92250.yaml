prompt: |-
  Ok so I'm a third year econ student taking game theory and something about iterated elimination has been driving me nuts all term, and every time I ask a TA I get a different answer so I figure id ask properly.

  Two things bug me. First, in one homework game I had three options. One gave me 1 whatever the other player did. The other two gave me 3 against one of her moves and 0 against the other. The answer key said my first option was strictly dominated and crossed it out. But it isn't dominated by either of my other options — each of those is awful against one of her moves — it's only worse than flipping a coin between them. That feels like I'm being made to assume I randomize, which nobody told me I have to do. Second, we did a game where you delete weakly dominated strategies, and a guy in section pointed out that if you delete them in a different order you're left with a different set of strategies at the end. The prof basically shrugged and said that's why we usually dont do that, which, fine, but then why did we do it.

  What I actually want to know is this. It seems like it should be a settled math question and it obviously isn't — there's a whole literature and people who've been going at it for decades. The camps look like (a) people who treat iterated elimination as just a formal operation on a game, so order-dependence or the mixed-strategy thing are features of the operation rather than problems, and (b) people who think a solution concept only means anything if you can back it with an epistemic story, some version of rationality plus common knowledge of rationality implies you'd never play these strategies. Those two seem to talk past each other forever, and neither seems to be winning.

  So: is this a real disagreement, or a verbal one about what rationality and solution concept are supposed to mean, or two groups answering different questions under one heading? My guess is it's mostly verbal — (a) is asking what set of strategies you can't be criticised for, (b) is asking what a maximiser with correct beliefs would do — but I suspect that's too easy, because the weak dominance case is exactly where the epistemic story seems to break (someone said the common knowledge version is false there and you need something weaker, which honestly sounds like a patch).

  Diagnose it for me, and be concrete about what would actually move this along — a theorem, a definition, or just admitting the two sides want different things from the theory. And if it can't be settled, say that.
reasoning: |-
  Hmm, the user is a third-year economics student studying game theory, struggling with iterated elimination of dominated strategies. They've encountered two specific issues: one involving a mixed strategy dominance problem in a homework game, and another about order-dependence when eliminating weakly dominated strategies. They're frustrated with inconsistent explanations from TAs and want to understand why these issues persist in the field.

  The user has identified what they perceive as two camps in game theory: (a) those who treat iterated elimination as a formal operation accepting its quirks, and (b) those who insist on epistemic foundations (rationality plus common knowledge). They're wondering whether this is a real disagreement or just semantic differences. They suspect it's mostly about what "rationality" means but recognize that the weak dominance case challenges the epistemic story.

  I need to address both their concrete examples and the broader philosophical divide. For the homework problem: when a pure strategy is dominated by a mixed strategy (but not by any pure strategy), this is indeed valid under standard definitions. The student wasn't told to randomize, but the possibility itself makes the pure strategy unattractive. For weak dominance: the order-dependence problem is real and well-known, which is why theorists often avoid iterated weak dominance.

  The epistemic perspective (Camp B) tries to ground solution concepts in what players would actually do given mutual reasoning about rationality. But as the user noted, this breaks down with weak dominance because common knowledge isn't sufficient - you need stronger assumptions like "common belief in rationality" or admissibility.

  For the user's meta-question: the divide is both substantive and methodological. Camp A cares about formal properties of games as mathematical objects. Camp B cares about behavioral plausibility. They're answering different questions: "What survives this elimination procedure?" vs. "What would rational players actually play?"

  To move forward: The field needs clearer taxonomy of solution concepts (separating procedural from epistemic ones). We also need theorems showing equivalence classes (e.g., when order doesn't matter) and more refined epistemic models. But some tension is inherent - different goals require different tools. Admitting this explicitly would help students.

  Key reassurance for the user: Their confusion is normal and reflects genuine complexities in game theory, not their misunderstanding. The "patch" they heard about (weaker epistemic conditions for weak dominance) is indeed an active research area.
answer: |-
  Your intuition cuts to the heart of foundational debates in game theory. The mixed-strategy dominance and weak-dominance order-dependence issues aren't just quirks—they reveal fundamentally different philosophies about what game theory *is for*. Let's dissect your concerns and the camps you identified.

  ### 1. Your Homework Problem: Mixed-Strategy Strict Dominance
  *   **The Setup:** You have Strategy A (safe payoff 1), Strategy B (3 vs. Opponent X, 0 vs. Opponent Y), Strategy C (0 vs. X, 3 vs. Y). Strategy A is strictly dominated *by a mixed strategy* (e.g., 50% B, 50% C), yielding an expected payoff of 1.5 > 1 regardless of the opponent's move. You object: "I'm not told to randomize!"
  *   **Camp A (Formal Operation) View:** Dominance is defined mathematically. A pure strategy is strictly dominated *if there exists any strategy (pure or mixed)* that yields a strictly higher payoff against *every possible* strategy profile of the opponents. Strategy A meets this criterion. The operation doesn't require you *to play* the mix; it just identifies A as *never* being a best response to *any* belief about opponents. It's irrelevant whether the dominating mix is "realistic" or not.
  *   **Camp B (Epistemic) View:** This camp *agrees* A should be eliminated, but the justification is epistemic:
      *   Rationality: You want to maximize your payoff given your beliefs.
      *   If you believe the opponent might play X *or* Y (and you assign positive probability to each, however small), then playing A (payoff 1) is strictly worse than playing the 50-50 mix (payoff 1.5) *given those beliefs*. Since there's *no belief* about the opponent (where you assign positive prob to all their strategies) that makes A optimal, a rational player *would never choose A*.
  *   **Why it's Dominated (Epistemically):** It's not that you *must* randomize. It's that A is *inferior* to having the *option* to randomize (or to having a correlated plan). A rational player, considering *all possible* opponent actions (even unlikely ones), sees that A is strictly worse than *some other available plan* (the mix) for *every* contingency. You don't need to *execute* randomness; you just need to recognize that A is *never uniquely best* and is *always strictly worse* than an alternative course of action you have available.

  ### 2. Weak Dominance & Order Dependence
  *   **The Problem:** Iterated elimination of *weakly* dominated strategies (IEWDS) is order-dependent. Strategy X may be weakly dominated only *after* Strategy Y is eliminated. Delete Y first, then X goes. Delete X first, and Y might *not* be weakly dominated later. Different orders → different residual sets.
  *   **Camp A (Formal Operation) View:** This is a known property of the operation. IEWDS defines a *process*, not a unique outcome. The set of strategies surviving *some* sequence of IEWDS is well-defined (the "weakly rationalizable" strategies), but it's larger than the set surviving *every* sequence. Theorists characterize these sets but acknowledge the path-dependence inherent in the definition.
  *   **Camp B (Epistemic) View:** This is where Camp B gets deeply uncomfortable. The epistemic justification for *single* weak dominance is shaky: "Strategy W is weakly dominated by Z if Z does *at least as well* as W against *all* opponent strategies and *strictly better* against *at least one*." A rational player might still play W if they believe the opponent will *only* play strategies where W and Z tie. Order dependence amplifies this:
      *   **Common Knowledge of Rationality (CKR) is insufficient:** Standard CKR arguments used for strict dominance *break down* for weak dominance. Knowing others are rational doesn't rule out beliefs where the weakly dominated strategy is *tied* for best. Order dependence reflects the fragility of mutual reasoning about ties.
      *   **The "Patch" You Heard About:** This is real. Epistemologists (e.g., Larry Samuelson, Eddie Dekel, Marciano Siniscalchi) work on weaker epistemic conditions like **Common *Belief* of Rationality (CBR)** or **Admissibility** (never playing a weakly dominated strategy). CBR allows for "trembles" – players believe others *might* play irrational strategies (like the ones making W tie) with infinitesimal probability. This *can* restore unique outcomes in some games under IEWDS (the "Dekel-Fudenberg procedure": one round of deletion of *all* strictly dominated strategies, *then* IEWDS). But it's complex and less elegant.

  ### Diagnosing the Disagreement: It's Real, But Not Just Verbal
  1.  **Different Goals:** This is the core.
      *   **Camp A (Formalists / Set Theorists):** They ask: "What are the mathematical properties of this solution concept? What sets *can* be generated by applying this rule?" They care about existence, computability, characterizing possible outcomes. Order dependence is a *mathematical feature* to be cataloged.
      *   **Camp B (Epistemologists / Behavioral Foundationalists):** They ask: "What strategies *would* actually be played by rational, intelligent players who mutually understand each other's rationality and the structure of the game?" Order dependence is a *fatal flaw* indicating the concept lacks a solid behavioral foundation. They seek concepts justified by plausible reasoning processes.
  2.  **Different Conceptions of Rationality:**
      *   Camp A: Rationality is defined implicitly by the solution concept itself (e.g., "survives IESDS").
      *   Camp B: Rationality is a *primitive* (maximizing given beliefs) defined *before* the solution concept. The solution concept should be *derived* from rationality + mutual assumptions.
  3.  **Different Tolerance for "Trembles" and Beliefs:** Camp B is deeply concerned with what players *believe*, especially about off-path play or zero-probability events, where weak dominance lives. Camp A often abstracts this away.

  ### What Would Move This Along?
  1.  **Clearer Taxonomy and Definitions:** Explicitly distinguishing between:
      *   **Procedural Solution Concepts:** Defined by an algorithm (e.g., IESDS, IEWDS-in-some-order, the Dekel-Fudenberg procedure).
      *   **Set-Based Solution Concepts:** Defined by a property (e.g., Rationalizability = survives IESDS, Weak Rationalizability = survives *some* IEWDS).
      *   **Epistemic Solution Concepts:** Defined by epistemic conditions (e.g., "Strategies played under CKR").
      *   Standard texts often blur these, causing confusion like yours. Explicitly stating "We are using IESDS as a procedural tool to compute the rationalizable set" or "We require admissibility (no weak dominance) as part of rationality" clarifies.
  2.  **Theorems Mapping Epistemics to Procedures:** Progress occurs when epistemologists show that specific epistemic conditions (CKR, CBR, CBR + Admissibility, etc.) *necessarily imply* players will only choose strategies in a specific procedurally/set-defined set (and vice-versa). The equivalence of CKR and Rationalizability (for finite games) is a triumph. The breakdown with weak dominance shows the limits of CKR and motivates refinements like CBR or admissibility. More theorems like "CBR + Admissibility implies the Dekel-Fudenberg outcome" solidify the connection.
  3.  **Admitting Divergent Goals:** The field benefits from acknowledging that "solving a game" can mean different things. Sometimes you want the strongest prediction possible (e.g., Nash equilibrium). Sometimes you want to know all strategies that *could* be played by rational players under *some* beliefs (Rationalizability). Sometimes you want a computationally tractable simplification tool (IESDS). Being explicit about *why* a concept is being used in a given context reduces confusion. Your Prof's "that's why we usually don't do that [IEWDS]" is an example – they were likely using it as a procedural tool for simplification, acknowledging its limitations, rather than endorsing it as a deep prediction.
  4.  **Concrete Models of Bounded Rationality:** Both camps struggle with complex games. Work showing how simpler, more plausible reasoning processes converge (or not) on formal solution concepts could bridge the gap by grounding formalism in cognitive realism.

  **Can it be "settled"?** Not in the sense of one camp "winning." Game theory serves multiple purposes. However, progress happens through:

  *   **Refining Epistemic Conditions:** Developing ever more nuanced and realistic models of players' knowledge, belief formation, and reasoning (like the CBR patch for weak dominance).
  *   **Characterizing Solution Sets:** Precisely defining the outcomes of various procedures under different assumptions.
  *   **Proving Equivalence Theorems:** Showing when procedural/set-based concepts align perfectly with specific epistemic foundations.
  *   **Clarifying Pedagogy:** Explaining *why* a concept is used and *what* it assumes (e.g., "We eliminate strategies dominated by mixed strategies because a rational player would consider all possible opponent plays and see a strictly better alternative exists; we avoid IEWDS for prediction because its outcome depends on arbitrary deletion order").

  **Your Insight is Spot On:** The camps *are* answering different questions under the heading of "solution concept." Camp A focuses on *what survives the rule*. Camp B focuses on *what a rational player with correct mutual understanding would play*. Your homework mixed-dominance example is where the epistemic justification *works well* for Camp B. The weak-dominance order dependence is where it *fails badly*, exposing the need for patches or alternative concepts. The tension isn't resolvable by declaring one side "right," but by rigorously linking their domains and being clear about the goals of the analysis. This is active, ongoing research – your frustration stems from encountering the frontiers of the field!
