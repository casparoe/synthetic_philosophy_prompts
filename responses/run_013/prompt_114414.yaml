prompt: |-
  Hi, so I'm a junior and I run the history club at my school, and we got roped into doing the exhibit for our town's 150th birthday at the public library — four panels, like 150 words of text each plus pictures, and the historical society board has to approve every word before it goes on the wall. Here's my problem. Basically everything in the town archive is the record of six families: the mill owners, the bank guy, the guy who donated the land for the park. There's a whole shelf of the mill's ledgers, which list every worker by name with their pay and their fines, and honestly that's the most detail we have on like four hundred people. Meanwhile the stuff that's actually interesting — what people ate, what they fought about, who married who — only exists in two diaries and a shoebox of letters from one woman whose family kept everything, and one court case. So my friends and I keep arguing about what we're allowed to say on the panels. My teacher keeps saying we should be doing history from below instead of just writing about the important guys, and she gave this whole talk about microhistory where you zoom all the way in on one person, ideally a slightly weird one, and use their life as a window onto how the entire society worked — the odd case is what shows you the rules everyone else followed without ever noticing them. Which I get and it's cool, but then how do I know when one person's diary is allowed to stand in for everybody? And how am I supposed to use a ledger written by the boss to say anything true about the workers, when the boss is the one who decided what got written down in the first place? And here's the thing that's really bugging me: the only ordinary people who end up in an archive at all seem to be the ones who got in trouble or fell on hard times, so the people I *can* actually write about are exactly the ones who weren't typical. If poor people barely show up in the records, is that a fact about them or a fact about the records?

  So what I want is a decision procedure I can actually run, panel by panel, while we're deciding what goes on the wall — not a general essay about being careful with sources. I need the questions to ask in order, what counts as a good enough answer to each one, the point where it just stops and says no, you can't claim that, and the point where it has to hand the decision off to a person because it's a values call and not a fact question. It should be honest about which steps are just judgment dressed up as method. Then run it on three things we're seriously considering: (1) a panel built around the mill ledgers — can we say anything real about the workers from them, and if so what, and what's off limits; (2) a panel around that one woman's diary, which is genuinely the best material we have, where the whole question is whether we can present her as a voice of the town's women or whether she's just one unusual person and we have to say so; and (3) the family who only appear in the records because of a lawsuit, where I have a bad feeling your procedure is going to tell me something I don't want to hear, and I'd rather know now so I can plan around it instead of finding out in front of the board. Please don't hand me a reading list or tell me to go find books about this, I can't, and don't just say to be careful — I need the actual steps in order. Also the board is touchy, three of them are decended from the mill family, so tell me which of our claims are actually strong enough to defend and which ones I should just drop. And please tell me what the procedure can't do, because I'd rather know the limits up front than discover them at the meeting.
reasoning: |-
  Okay, let me unpack this user's problem. They're a junior running a history club tasked with creating a town exhibit under tight constraints. The core tension is between their teacher's push for "history from below" and the limited archive dominated by elite families. 

  First, I notice three pain points: 
  1. Source scarcity - The archive has overwhelming mill/bank records but only fragments of ordinary lives (one diary, one lawsuit). 
  2. Representativeness anxiety - How to avoid overgeneralizing from single sources like the diary woman? 
  3. Political pressure - Board members descend from the mill owners, making worker narratives sensitive.

  The procedural request is smart. They don't need theory - they need a forensic checklist for three specific cases. Must be courtroom-ready against board scrutiny. 

  Key insights forming:
  - The ledgers are factual but filtered through management bias. We can extract demographic data but not lived experience. 
  - The diary woman's uniqueness is actually useful if framed as "this survived, others didn't." Her ordinary details (food, chores) are gold precisely because they're unremarkable. 
  - The lawsuit family are outliers by definition - but their exclusion from other records proves the archive's bias. That meta-point might be our angle.

  Biggest risk: The board's emotional investment. Need to flag where claims could trigger defensiveness (e.g., ledger fines implying worker exploitation). 

  Procedure design principles:
  - Must have clear kill switches (when to abandon a claim)
  - Separate verifiable facts from interpretive leaps
  - Surface where "judgment calls" happen
  - Pre-test each claim's defensibility

  For the diary panel, I'm thinking: If she describes baking bread and 1900 census shows 95% of local women were homemakers? That's solid. If she writes poetry about wanting to be a doctor? That's individual. 

  The lawsuit family hurts - they're fascinating but unrepresentative. Workaround: Use them to demonstrate how archives preserve failure, not normalcy. "Look who's missing" becomes the point.

  Final safety check: Every panel must answer "What does this source NOT tell us?" That disarms criticism upfront.
answer: |-
  Here's a field-ready **Decision Procedure for Local History Claims**—designed for panel-by-panel triage, with built-in kill switches and political reality checks. Run every claim through these steps in order.

  ---

  ### **THE PROCEDURE: 7 STEPS TO DEFENDABLE CLAIMS**
  **Step 1: Source Provenance**  
  *Q: Who created this source, why, and for whom?*  
  - **Pass**: Creator/audience/purpose clearly stated in source or context (e.g., "mill ledger for payroll accounting").  
  - **Fail**: Unknown creator or purpose → **KILL CLAIM**.  
  - **Judgment Call**: If purpose implies bias (e.g., lawsuit records = adversarial), proceed but flag in panel text.  

  **Step 2: Representativeness**  
  *Q: Is this source typical of its category?*  
  - **Pass**: Corroborated by 2+ unrelated sources (e.g., food prices in diary match store ledger).  
  - **Fail**: Only one source exists → **FLAG AS "ONE SURVIVING EXAMPLE"** (never "typical").  
  - **Judgment Call**: If *lack* of sources is the point (e.g., "workers’ voices rarely preserved"), proceed.  

  **Step 3: Bias Audit**  
  *Q: What power dynamics shaped this record?*  
  - **Pass**: Explicit acknowledgment of bias in panel (e.g., "Employer-recorded fines may reflect management priorities").  
  - **Fail**: Unacknowledged power imbalance → **KILL GENERALIZATIONS** (e.g., never say "workers felt..." from boss’s ledger).  
  - **Judgment Call**: Use quantifiable data (wages, fines) but contextualize limits.  

  **Step 4: Corroboration Ladder**  
  *Q: What *can* be cross-checked?*  
  - **Level 1 (Solid):** Names/dates/locations (e.g., diary mentions church picnic + church bulletin confirms date).  
  - **Level 2 (Contextual):** Practices/institutions (e.g., diary describes harvest meal + agricultural census shows common crops).  
  - **Level 3 (Risky):** Emotions/beliefs (e.g., diary writer hated mill owner → **REQUIRES 2+ INDEPENDENT SOURCES**).  
  - **No corroboration? → RESTRICT TO "THIS SOURCE SHOWS..."**  

  **Step 5: Negative Space Analysis**  
  *Q: What’s missing, and why might that be?*  
  - **Mandatory for every panel!** State explicitly: "Gaps reflect what was deemed worth recording by those in power."  

  **Step 6: Board Risk Assessment**  
  *Q: Does this claim challenge a donor family’s narrative?*  
  - **High Risk**: Direct criticism of elites (e.g., "mill fines were exploitative").  
  - **Low Risk**: Humanizing ordinary lives without blame (e.g., "workers’ pay bought 10 loaves of bread weekly").  
  - **Mitigation Strategy**: Use their ancestors’ records *as sources* (e.g., "The Parker ledgers show...") to flatter preservation.  

  **Step 7: Framing Check**  
  *Q: Does the panel emphasize *process* over *conclusions*?*  
  - **Pass**: "This diary suggests..." / "Ledgers indicate...".  
  - **Fail**: "Women believed..." / "Workers were...".  

  ---

  ### **APPLYING THE PROCEDURE TO YOUR CASES**
  #### **Case 1: Mill Ledgers (Worker Life Panel)**  
  - **Step 1:** Pass (employer record for accounting).  
  - **Step 2:** Pass for *demographics* (all workers listed); Fail for *experiences* (only boss’s perspective).  
  - **Step 3:** Flag bias: "Fines reflect rules set by management."  
  - **Step 4:**  
    - Level 1: Use for names, job roles, wages. ✅  
    - Level 2: Wages → cost of living (if town store prices exist). ✅  
    - Level 3: **KILL** claims about worker morale/fairness. ❌  
  - **Step 5:** State: "Workers’ own views are absent."  
  - **Step 6:** **RISKY:** Focus on observable facts (e.g., "40% of workers incurred fines weekly"). Avoid "why."  
  - **Step 7:** Frame as: "Ledgers document economic constraints."  
  👉 **APPROVABLE IF:** Focuses on quantifiable data + acknowledges gaps.  

  #### **Case 2: The Diary ("Voices of Women" Panel)**  
  - **Step 1:** Pass (personal diary by Eliza Miller, farmer’s wife).  
  - **Step 2:** **FAIL** representativeness (only one diary).  
  - **Step 3:** Flag: "One woman’s perspective; others may differ."  
  - **Step 4:**  
    - Level 1: Use for daily routines, family events. ✅  
    - Level 2: Corroborate *practices* (e.g., "preserving food" + agricultural extension bulletins). ✅  
    - Level 3: **KILL** "town women believed..." ❌  
  - **Step 5:** State: "Few women’s writings survive; this rarity matters."  
  - **Step 6:** Safe (non-elite, no criticism).  
  - **Step 7:** Frame as: "Eliza Miller’s diary opens a window onto domestic life in 1890s."  
  👉 **APPROVABLE IF:** Positions her as *an* example, not *the* example.  

  #### **Case 3: The Lawsuit Family ("Justice in 1884" Panel)**  
  - **Step 1:** Pass (court records: dispute over land boundaries).  
  - **Step 2:** **FAIL** representativeness (only in records due to conflict).  
  - **Step 3:** Flag: "Legal cases highlight tensions, not norms."  
  - **Step 4:**  
    - Level 1: Use facts from testimony (e.g., "The Smiths claimed..."). ✅  
    - Level 2/3: **KILL** generalizations about community relations. ❌  
  - **Step 5:** State: "Most neighbors resolved disputes informally; this case was exceptional."  
  - **Step 6:** **HIGH RISK:** Litigious ancestors = sensitive. Mitigate by using neutral title ("A Boundary Dispute").  
  - **Step 7:** Frame as: "This case shows how formal systems intervened when informal talks failed."  
  👉 **APPROVABLE IF:** Focuses on *process* (how courts worked), not family drama.  

  ---

  ### **WHAT THIS PROCEDURE CAN'T DO**  
  1. **Fill gaps in evidence.** No source = no claim.  
  2. **Override board politics.** Mitigate risk but expect pushback on mill/family topics.  
  3. **Prove typicality from outliers.** The lawsuit family stays "exceptional."  
  4. **Read minds.** Emotions/motivations require multiple witnesses.  

  ---

  ### **STRATEGY FOR THE BOARD**  
  - **Defend Strong Claims:** Ledger data (wages, fines), diary routines (if corroborated), lawsuit procedure.  
  - **Drop Weak Claims:** Worker morale, "women’s views," lawsuit family as representative.  
  - **Preempt Criticism:** Start each panel with: "Surviving records show..." and end with "What’s missing?"  
  - **Flatter the Archive:** "The Parker family’s meticulous ledgers help us calculate..."  

  **Final Tip:** For the diary panel, call it "A Woman’s World: Daily Life in 1890" — the indefinite article ("a") saves you. You’ve got this.  

  > *"History is not the past. It is the method we’ve constructed for organizing our ignorance of the past."*  
  > — Adapt your teacher’s insight into a panel footnote. Own the limits.
