  Key constraints: must be set in a realistic lab, 1000-1400 words, American English. No magic solutions - the resolution must engage honestly with the math. Philosophical content must drive the plot, not just decorate it. Ending requires either a coherent exit path or clear-eyed acceptance of the problem.

