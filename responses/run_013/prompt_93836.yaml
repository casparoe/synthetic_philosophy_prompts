  Here is the ranking based on your theistic yield framework, with justifications and minimal termini descriptions. Scores reflect how tightly the premises constrain the terminus toward classical theism (personal, omniscient, omnipotent, morally perfect), with 1 being full constraint.

  ### Rankings (Highest to Lowest Yield)
  1. **(e) Non-temporal regress of dependent causes**  
     **Yield: 0.7**  
     *Justification:* The premise that "an infinite regress of *essentially dependent* causes is impossible" requires a terminus that is absolutely independent (uncaused and ontologically self-sufficient). This excludes abstract grounds and implies a unique, foundational source of all dependence, nudging toward agency.  
     *Minimal terminus:* A sovereign, uncaused ground of all contingent existence, possessing aseity but not necessarily personhood or moral perfection (e.g., a self-sustaining necessary entity with causal power but no mind).  

  2. **(d) Thomistic argument from motion/change**  
     **Yield: 0.6**  
     *Justification:* The premise that "essentially ordered series require a first actualizer" demands a terminus that is *pure actuality* (no unactualized potential), which entails timelessness, immutability, and causal supremacy. This strongly suggests a transcendent source of all change.  
     *Minimal terminus:* An immutable, eternal source of actualization ("Unmoved Mover"), but not necessarily personal or benevolent (e.g., an impersonal force sustaining all change).  

  3. **(b) Leibnizian PSR argument**  
     **Yield: 0.5**  
     *Justification:* The premise that "the *entirety* of contingent reality must have an external explanation" necessitates a necessary being as the ultimate ground. While this entails transcendence and metaphysical ultimacy, it does not inherently require causal agency.  
     *Minimal terminus:* A metaphysically necessary explanans for all contingents, possibly abstract or impersonal (e.g., a brute necessary principle or structure).  

  4. **(a) Temporal Kalam argument**  
     **Yield: 0.3**  
     *Justification:* The premise "whatever begins to exist has a cause" only demands a temporally antecedent cause for the universe’s origin, with no constraint on the cause’s nature beyond temporal priority and causal power.  
     *Minimal terminus:* A powerful but impersonal, timeless, or amoral initiating force (e.g., a quantum vacuum or unguided energy).  

  5. **(c) Modal contingency argument**  
     **Yield: 0.1**  
     *Justification:* The premise "a necessarily existing being is possible" (with S5 modal logic) proves only that *some* necessary being exists, with zero constraints on its attributes beyond necessity itself.  
     *Minimal terminus:* Any necessary entity (e.g., a mathematical truth, an eternal physical law, or Spinoza’s substance).  

  ### Overall Ranking (Highest to Lowest Theistic Yield)
  (e) > (d) > (b) > (a) > (c)  

  ### Premise Contributing Most to Theistic Yield
  **The premise in (e) denying an infinite regress of *essentially dependent causes*** contributes most to theistic yield, as it uniquely forces the terminus to be a *sovereign, independent foundation* for all contingency—constraining the space of admissible termini toward ontological ultimacy and causal supremacy, the core prerequisites for classical theism.
