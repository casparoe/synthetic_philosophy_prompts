prompt: |-
  I am a retired animal-behaviour researcher who has spent the past several years reading philosophy in earnest, and the department here has asked me to conduct the on-stage interview that will follow next month's public lecture. My guest has built a career defending the Kantian position on animals: that we have no duties to animals, only duties to ourselves, and to humanity in our own person, with regard to them; that cruelty to animals is wrong because it corrodes the natural disposition to sympathy on which morality depends; and that animals, lacking self-consciousness and reason, cannot be ends in themselves. I have read enough of her work to know that she can restate this position in her sleep, and I have no wish to hand her the opportunity. What I want are questions that test the two premises I am actually competent to evaluate — the claim about what animals are like, and the claim about what cruelty does to those who commit it — together with the internal architecture of the view.

  Please draft ten questions, ordered as I should ask them, each followed by a brief note on what I am trying to draw out and a follow-up keyed to the answer she is most likely to give. They must be speakable aloud and free of technical vocabulary I would fumble. Do not supply references, editions, or page numbers; neither of us needs them and I cannot check them. No opening questions about how she came to philosophy. At least one question must bear on each of the following:

  - The load-bearing empirical premise. I want to put to her the case of an agent whose cruelty leaves no mark on his sympathetic dispositions — because of a drug, or because his habits have been engineered, or because he is simply made that way — and ask whether his cruelty is then not wrong at all; the case where the coarsening falls on other people rather than on the agent himself; and the case where one person's cruelty does no harm because everyone else's sympathy remains intact, so that the wrongness seems to depend on a ledger of aggregate psychological damage.
  - The structure of a duty owed to oneself that nevertheless has an external object. In Kant's system the duties of virtue have no corresponding right in any other party; ask whether duties with regard to animals are a genuine category or a relabelling of a duty to oneself, and hand her the case of an animal made to suffer where no rational agent ever learns of it.
  - The criterion that excludes animals from direct consideration. Ask whether the line is empirical — my own field keeps moving it, with tool use, caching, mirror self-recognition, consolation behaviour — or transcendental, and whether under Kant's own idealism the inner life of an animal is any less inaccessible to us than that of another person. Ask what finding would make her revise the view.
  - The suspicion that the position collapses into virtue ethics, or into a merely pedagogical claim about habituation, and what the categorical imperative is doing if the wrongness of cruelty consists in its effect on the agent's character.
  - Whether these duties fall on individuals or on humanity as a species, and what becomes of them if our sympathetic dispositions can be protected by other means — a moral prosthetic, as it were. Do the duties regarding animals then lapse?

  Finish by telling me which question she is most likely to deflect, how she will deflect it, and which of my questions I am most likely to ask badly.

  Begin your reply with the questions themselves; no preamble and no restatement of this request.
reasoning: |-
  Hmm, the user is a retired animal-behavior researcher preparing to interview a Kantian philosopher about animal ethics. They need ten sharp questions to challenge the empirical and structural foundations of the Kantian view without letting the guest simply restate her position. 

  First, I consider their constraints: no opening small talk, no citations, and questions must avoid technical jargon while covering five specified angles. The user's expertise in animal cognition means they'll want to press on empirical claims about animal minds and the effects of cruelty. Their frustration with rehearsed answers is palpable—they want live wires, not softballs.

  For the empirical premise (point 1), I sketch three scenarios: cruelty without character corrosion (Q1), cruelty witnessed by others (Q2), and aggregate harm calculus (Q3). Each exposes the fragility of grounding wrongness in psychological consequences. The follow-ups push toward either admitting wrongness is contingent (which undermines Kant) or retreating to character metaphysics.

  On duty structure (point 2), Q4 probes whether "duties regarding animals" are distinct or just relabeled self-duties. The follow-up isolates the issue: if a tree falls in an empty forest with an animal beneath it... Q5 then questions if the duty’s content changes based on animal experience—testing if the animal’s suffering matters at all.

  For exclusion criteria (point 3), Q6 attacks the moving empirical line (mirror tests etc.) versus transcendental claims. The follow-up forces a choice: is this about animal incapacity or human epistemic limits? Q7 pushes further—what evidence would falsify the view? (Likely none, revealing dogmatism.)

  Re: virtue ethics collapse (point 4), Q8 questions whether character effects reduce Kant to Aristotle. Follow-up: then why invoke the categorical imperative? Q9 examines if "sympathy" is scaffolding for moral development—if so, is the duty only pedagogical?

  Finally, for collective duties and prosthetics (point 5), Q10 asks if humanity could engineer away sympathy. Follow-up: would duties lapse? (Her answer will reveal if the duty is about animals or human psychology.)

  I predict Q7 (falsifiability) will be deflected—she'll appeal to Kant's framework as non-empirical. And Q4 (duty structure) risks being asked badly if phrased abstractly; grounding it in the "unwitnessed suffering" scenario makes it concrete. The user’s animal-behavior background should anchor Q6-Q7—they’ll know the literature on corvid tool use or elephant consolation better than she does.
answer: |-
  **Question 1:** If we discovered a person whose acts of deliberate cruelty to animals left *no* trace on his sympathy for humans – perhaps due to a brain condition, a drug, or careful psychological conditioning – would those cruel acts still be morally wrong on the Kantian view?  
  *What to draw out:* Testing if wrongness *requires* the actual psychological consequence (corrosion of sympathy) or if it's inherent.  
  *Likely Answer:* She'll likely insist the *risk* or *typical effect* makes it wrong, or that cultivating such a disposition *is* the wrong to oneself.  
  *Follow-up:* So, is the primary wrong *the act of cruelty itself* potentially damaging the agent's character, or *the actual damage* done? If it's the potential/risk, how do we weigh that against cases where we *know* no damage occurs?

  **Question 2:** Suppose someone commits a cruel act towards an animal in complete secrecy, and this act *does* coarsen *his own* disposition. However, because it remains secret, it never influences *anyone else's* sympathy or moral character. Is the *only* wrong here still just the damage he did to *himself*?  
  *What to draw out:* Reinforcing the "duty to self" structure and isolating the harm from social effects.  
  *Likely Answer:* Yes, the wrong remains solely a violation of his duty to himself regarding cultivating his moral character.  
  *Follow-up:* Does the animal's suffering play *any* direct role in constituting that wrong to himself, or is it purely incidental – merely the material he used to damage his own character?

  **Question 3:** Consider a case of public cruelty: someone tortures an animal in front of a crowd. The torturer's own character is unaffected (say, he's entirely desensitized), but witnessing this act *significantly* coarsens the sympathies of many spectators. Is this act morally worse than the same act done in secret that only harms the torturer's own character?  
  *What to draw out:* Whether the wrongness scales with the *aggregate* psychological harm done to the moral character of *others* (humanity in general), not just the agent.  
  *Likely Answer:* She might say it's worse because it damages the moral character of *many*, violating duties regarding humanity more broadly.  
  *Follow-up:* If the wrongness depends on the number of people whose sympathy is eroded, does that mean the *same* cruel act could be less wrong, or even permissible, if committed in a society where people's sympathies were somehow immune to such coarsening?

  **Question 4:** Are "duties *regarding* animals" a fundamentally distinct *kind* of duty in Kant's system, or are they strictly just a sub-type of the duty we owe *to ourselves* (to preserve our moral character)?  
  *What to draw out:* The ontological status of this duty – is the animal an object *of* the duty or just a means?  
  *Likely Answer:* They are strictly duties *to ourselves* (or humanity) *regarding* our treatment of animals; animals are not duty-bearers.  
  *Follow-up:* In the secret cruelty case (Q2), where only the animal suffers and no human character is damaged or even aware, is there *any* moral wrong *at all*? If yes, *what* is the nature of that wrong? If no, does that align with our intuition about suffering inflicted unseen?

  **Question 5:** When we say we have a duty *regarding* animals not to be cruel, does the *nature or degree of the animal's suffering* factor into the *content* of that duty? Or is the duty solely focused on the *type of act* performed by the human and its *typical* effect on *human* character?  
  *What to draw out:* Whether the animal's experience has any bearing on the duty's specific demands.  
  *Likely Answer:* The duty is defined by the act's typical corrosive effect on human character, not by the animal's subjective experience per se.  
  *Follow-up:* So, would causing prolonged, intense suffering to a highly sensitive animal (like a primate) be morally equivalent, under this duty, to causing brief, mild distress to a less sensitive animal (like an insect), if both acts carried the *same* risk of coarsening the *agent's* sympathy? If not, why not?

  **Question 6:** The criterion excluding animals from direct moral consideration is their lack of rationality and self-consciousness. Is this a claim about the *empirical reality* of animal minds (which behavioral science keeps revealing as more complex), or is it a *transcendental* requirement of practical reason itself?  
  *What to draw out:* Whether the line is contingent on science or a necessary feature of Kantian ethics.  
  *Likely Answer:* It's primarily transcendental – only rational beings can be ends in themselves and bearers of duties/rights. Empirical findings about animal cognition don't change this.  
  *Follow-up:* Yet Kant also acknowledged we can't know the "thing-in-itself," including the inner life of others. Given this idealism, is our *certainty* about the absence of morally relevant self-consciousness in animals any more justified than our certainty about its presence in other humans? Aren't we interpreting *behavior* in both cases?

  **Question 7:** What specific empirical finding, if confirmed beyond doubt by animal behavior research, would compel a revision of the Kantian position on animals? For instance, undeniable evidence of genuine future planning, complex self-representation, or moral reasoning in a non-human species?  
  *What to draw out:* The falsifiability of the empirical premise underlying the exclusion. Is the view open to revision?  
  *Likely Answer:* She might deflect or argue that even complex behaviors wouldn't constitute the *kind* of rational autonomy required for being an end-in-itself, or that Kant's framework doesn't depend on shifting empirical sands.  
  *Follow-up:* If *no* conceivable empirical finding could challenge the view, doesn't that render the empirical claims about animal minds somewhat rhetorical, since the philosophical conclusion is insulated from them?

  **Question 8:** If the wrongness of cruelty to animals lies primarily in its effect on the *agent's character* (corroding sympathy), doesn't this make the core of the argument fundamentally *virtue-ethical* – focused on the cultivation of good character – rather than distinctively Kantian?  
  *What to draw out:* Potential tension with deontology; risk of collapsing into virtue ethics.  
  *Likely Answer:* She'll argue Kant *incorporates* virtue/vices within his system via duties to oneself, but grounds them in the Categorical Imperative, not eudaimonia. The duty is about preserving the *capacity* for morality (sympathy as a predisposition), not just character for its own sake.  
  *Follow-up:* What specific work is the *Categorical Imperative* doing here that a virtue ethicist couldn't accommodate by simply stating "cruelty is a vice that damages one's capacity for compassion"?

  **Question 9:** Kant emphasizes sympathy as a natural predisposition crucial for morality. Is the duty regarding animals then best understood not as a fundamental moral duty itself, but as a *pedagogical* or *training* duty – a way to *habituate* ourselves to be better moral agents towards *humans*?  
  *What to draw out:* Whether the duty is instrumental/propaedeutic rather than intrinsic.  
  *Likely Answer:* She might agree it *serves* a pedagogical role but insist it is still a genuine duty of virtue (to oneself) grounded in preserving the necessary conditions for morality.  
  *Follow-up:* If the duty is primarily pedagogical, does that imply that if we found a more effective way to cultivate human sympathy *without* reference to animals, our duties *regarding* animals could be significantly weakened or even abandoned?

  **Question 10:** Do duties regarding animals fall upon *individuals* or upon *humanity as a collective*? And if future technology allowed us to artificially protect or enhance human sympathetic dispositions – a "moral prosthetic" – making them immune to coarsening by animal cruelty, would our Kantian duties regarding the treatment of animals then lapse?  
  *What to draw out:* The scope of the duty-bearer and the contingency on the *need* for animals as tools for moral cultivation.  
  *Likely Answer:* Duties fall on individuals as members of humanity. She'll likely resist the lapsing, arguing the duty is tied to the *act* of cruelty and its inherent disrespect for living beings (even if not ends-in-themselves) or its violation of our self-regarding duty, irrespective of whether we've engineered around the psychological consequence.  
  *Follow-up:* If the duty doesn't lapse with the prosthetic, what is its foundation? Is it now grounded in something *about the animal*, or solely in the idea that such acts are inherently degrading to the *human* agent, regardless of consequences?

  **Deflection Prediction:** She is most likely to deflect **Question 7 (What finding would make her revise?)**.  
  *How:* By reframing it: She'll likely argue that Kant's exclusion isn't *primarily* empirical but based on the *necessary conditions* for being an end-in-itself (rational autonomy), which are transcendental. She might state that observed animal behaviors, however complex, do not constitute the *kind* of rational legislation required, or that empirical science cannot access the transcendental grounds of moral status. She may emphasize the philosophical framework's independence from contingent biological facts.

  **Question Most Likely Asked Badly:** **Question 4 (Are duties regarding animals distinct?)**  
  *Why:* The distinction between "duty *to*," "duty *regarding*," and "duty *with respect to*" is subtle and easily muddled in spoken English. The risk is phrasing it too abstractly ("What *is* the nature of this duty?"), losing the crucial contrast between duty *to self* vs. a duty *with an external object but no corresponding right*. The follow-up about unwitnessed suffering is key to grounding it concretely. Practice phrasing: "Is the duty *fundamentally about* protecting our own character, using the animal as an example, or is there something *about the animal* that generates a distinct category of duty?"
