prompt: |-
  I'm in a third-year philosophy of mind seminar — 14 of us, one 90-minute session a week, no tech in the room except a projector I'd rather not touch — and I've somehow ended up on the hook for running the week on whether beliefs and desires are real, i.e. the eliminativist line that believing and wanting are posits of an inherited folk theory that might end up like phlogiston. I don't want to stand up and explain it and then take questions, because the first hand goes up and it's always the same one (but I know I have beliefs, I'm having one right now) and then we're finished in ten minutes and everyone privately decides the philosophy was a bit silly. What I want instead is a session where they do something and end up standing in the eliminativist's shoes without being told to, so the question of whether these posits earn their keep feels like a live question in the room. So please design me the activity, not the explanation.

  The shape I keep half-building and can't finish: a black box — literally a cardboard screen with a slot, me or a pre-briefed friend behind it with a printed rule sheet and a shuffled deck — and teams of three or four who get a few rounds of feeding it situation cards and predicting which action card comes back. First round they get only the machine's physical description and they'll be hopeless; second round they're told what it was built to do and they get good fast; third round they have to write down what it believes and wants and they get even better, and it feels obvious and natural, and that's the trap I want them sitting in before the rule sheet comes out and turns out to be an arbitrary lookup table with no goal, no memory, no representation anywhere in it. Then the round I actually care about: a person. A confederate following a silly but perfectly consistent rule (she agrees to any request containing a certain letter, say), with the teams writing belief-and-desire explanations for her and predicting her next several answers, confident and wrong. The crunch I want to land in the debrief is that the same trick that dissolved the box's desires dissolves its function too, and nobody wants to say the TIDY-UP 3000 has no function — so what exactly is doing the work? For scoring I want two currencies, not one: prediction points, plus a small pool of what I've been calling ontology chips that a team must spend every single time its manual posits a belief, a desire, a memory or a goal, so the trade-off between predicting well and positing little is something they feel in their hands rather than something I assert at them.

  What I need from you: the materials list, and the actual rule sheet for the box — a concrete table, not an instruction to make it arbitrary, something that genuinely looks goal-directed for the first eight or ten trials and then doesn't; the round-by-round rules and a 90-minute timeline; the scoring scheme, including how the chips interact with the points so a team can't just hoard and win by predicting nothing; how to stage the confederate round so the explanations come out wrong in a way nobody clocks until her rule is read out, plus what to do when someone guesses it in two rounds, which they're definately going to do; and then the debrief, which has to map what happened onto the real disagreement, middle positions included — I don't want them leaving thinking beliefs are just dispositions to behave, or that a box with a lookup table has proved we're robots. Be honest about what will predictably go wrong the first time I run it and what this setup structurally can't reproduce; I already suspect it can't get anywhere near the first-person side of the thing, since everything here is third-person prediction, but tell me if there's more. Last thing: I want to hand out a half-page at the end with three short unnamed paragraphs — three positions on whether belief-talk is in the business of describing anything real — and have each team say which one their own manual ended up defending. Draft those three paragraphs, no names and no citations, just the positions stated plainly enough that they can fight about them.
reasoning: |-
  We are designing an activity for a 90-minute seminar to explore eliminativism about beliefs and desires without starting with a lecture. The goal is to have students experience the perspective that belief and desire might be posits of a folk theory that could be replaced, much like phlogiston.

  The activity has several rounds and involves:
  1. A black box (cardboard screen with a slot) operated by a person (the instructor or a confederate) following a rule sheet.
  2. Teams of 3-4 students who will try to predict the box's output given input.
  3. Several rounds with different instructions to the teams.
  4. A confederate round where a person follows a simple rule, and teams try to explain her behavior in terms of beliefs and desires.
  5. Scoring with two currencies: prediction points and "ontology chips" that must be spent when positing mental states (belief, desire, memory, goal) in their manual.

  The desired outcome is that students see how the same explanatory strategy they use for the box (and then the person) might be applied to humans, and that the posits of beliefs and desires might not be necessary.

  Let's break down the design:

  **Materials:**
  - Cardboard screen (black box) with a slot for input and output.
  - A deck of "situation cards" (input) and "action cards" (output). These should be designed so that in the first rounds, the box appears goal-directed, but the rule is arbitrary.
  - Rule sheet for the black box operator (must look goal-directed at first but is arbitrary).
  - Rule for the confederate (e.g., "agree to any request containing the letter 'E'").
  - Scoring sheets for each team: one for prediction points and a pool of ontology chips (physical chips or tokens would be ideal).
  - Timer.
  - Handout with three unnamed paragraphs at the end.

  **The Black Box Rule Sheet:**
  We need a rule that for the first 8-10 trials appears goal-directed (e.g., like a robot designed to tidy up) but is actually an arbitrary lookup table without memory or goals.

  Idea for the black box:
  - The box is called the "TIDY-UP 3000". It is presented as a machine designed to tidy a room.
  - Input (situation cards): Describe a state of a room (e.g., "books on floor", "toys on bed", "dirty dishes in sink", "clean table", etc.)
  - Output (action cards): Possible actions the machine might take (e.g., "pick up books", "put toys in box", "wash dishes", "do nothing", etc.)

  Rule sheet for the operator (arbitrary but with a pattern that mimics goal-directedness initially):

  We'll create a fixed lookup table that for the first few inputs seems to respond appropriately to tidy, but then becomes arbitrary. However, we must avoid any memory or goal representation.

  Example rule (using a modulo operation to keep it simple and without memory):

  Let's assign numbers to each situation and action. We can have 8 situations and 5 actions. The rule is: 
  For the first 8 trials, the operator uses a fixed mapping that makes sense for tidying. Then, for the next trials, the operator uses a different arbitrary mapping (or even the same one but extended in a way that breaks the pattern).

  But note: we want to avoid any memory or goal. So the rule must be based solely on the current input.

  We can have two phases in the rule sheet, but the operator uses the same rule throughout. We design the rule so that for the first set of inputs (which we will use in round 2) it looks good, and then for a new set of inputs (in round 3) it becomes arbitrary.

  Alternatively, we can have a rule that is entirely arbitrary but the initial set of situation cards are chosen to fit a pattern. Then, when new situation cards are introduced, the pattern breaks.

  Proposed rule for the black box (operator):
  - The operator has a list of all possible situation cards and a fixed action for each, determined by a rule that is not goal-oriented.

  Example arbitrary rule (without any goal):
  - Assign each situation card a number based on the first letter of the situation (A=1, B=2, ... Z=26). Then, the action is chosen by: (sum of the letter positions mod 5) + 1. Then map the number to one of 5 actions.

  But that might not look goal-directed at all. We need the initial trials to look goal-directed.

  Better: Pre-select a set of 8 situation cards that when passed through an arbitrary function yield the correct tidying action. Then, for the next set, it doesn't.

  We can pre-brief the operator to use a fixed lookup table for the entire session. We design the situation cards so that the first 8 are common and the lookup table is set to make the box look like it's tidying. Then, when we introduce less common situations, the actions no longer make sense.

  Lookup table for the first 8 situations:

  Situation Cards (input) and corresponding Action (output):

  1. "books on floor" -> "pick up books"
  2. "toys on bed" -> "put toys in box"
  3. "dirty dishes in sink" -> "wash dishes"
  4. "clean table" -> "do nothing"
  5. "clothes on chair" -> "hang clothes"
  6. "trash can full" -> "empty trash"
  7. "bed unmade" -> "make bed"
  8. "floor dirty" -> "sweep floor"

  Now, for any other situation (we will have some new ones in round 3), we use an arbitrary rule, e.g.:

  If the situation contains the letter 'e', then output "do nothing". Otherwise, output "sweep floor".

  But we must avoid memory. So the rule is fixed and based only on the current input.

  We'll have 12 situation cards: the first 8 as above, and 4 new ones for round 3:

  9. "window open" (contains 'e') -> "do nothing"
  10. "light on" (no 'e') -> "sweep floor"   [arbitrary: why sweep floor when the light is on?]
  11. "door unlocked" (no 'e') -> "sweep floor"
  12. "plant dry" (no 'e') -> "sweep floor"

  In round 3, the teams will see the box do nonsensical things.

  **Rounds and Timeline (90 minutes):**

  1. **Introduction (5 min):** Explain the activity. Split into teams (14 students -> 3 or 4 teams). Each team gets a scoring sheet and a fixed number of ontology chips (say 10 chips). Explain that they will be building a "manual" for the black box and later for a person. The manual must include the rules they think are inside. They will spend ontology chips when they posit a belief, desire, memory, or goal in their manual. They get prediction points for correct predictions.

  2. **Round 1: No information (15 min)**
     - The box is described only physically: "a black box with a slot; you put in a situation card, it outputs an action card."
     - Each team gets 3 trials: they choose a situation card from a set (include all 12, but they only use 3 randomly? or we can have a fixed set for round 1?). But we want them to be hopeless. So we let them choose any situation card from the set of 12, and the operator uses the lookup table (for the 8 common ones, the action makes sense, but the teams don't know the mapping and haven't been told the function). However, they don't have any information about the box's purpose. So even for "books on floor", they might not guess "pick up books". Let them try 3 trials. They will be random and they get 0 or 1 prediction points per trial? We want them to be bad.

     Alternatively, to save time, we do one trial per team? But let's do 3 trials for all teams simultaneously: each team writes down their prediction for the action for a given situation. The instructor runs the box for one situation at a time, and all teams predict. Then reveal.

     But we want them to try to build a model. So maybe each team gets to input one situation and see the output, then a second, then a third. Then they can update their model.

     We'll do: 
     - Each team gets to input one situation card (from the 8 common ones) and see the output. Then they write their prediction for the next two situations (we give them two new situations from the common set). They get 1 point per correct prediction.

     They will probably do poorly.

  3. **Round 2: Functional description (15 min)**
     - Now tell them: "The box is called the TIDY-UP 3000. It was designed to tidy a room." 
     - Each team gets 5 trials: they input a situation card (from the common 8) and see the output. Then they write their manual (without spending chips yet) and use it to predict the next 2 trials (again from the common 8). They get 1 point per correct prediction.

     They will quickly see the pattern and predict well.

  4. **Round 3: Belief and desire (15 min)**
     - Now tell the teams: "Your manual must now include what the box believes and desires. Every time you posit a belief or desire (or memory or goal) in your manual, you must spend one ontology chip. You start with 10 chips. Write down your manual with these posits and then predict the next 4 trials."
     - The trials: the first 2 are from the common set (they will predict correctly) and the next 2 are from the new set (which break the pattern). They get 1 point per correct prediction. They must spend chips for any mental state in their manual.

     They will write a manual with beliefs and desires (e.g., "it believes there are books on the floor and wants them to be on the shelf") and they will get the first two right and the next two wrong.

     After their predictions, run the two new trials and they see the box acting arbitrarily.

  5. **Reveal the rule sheet (5 min):** Show the actual rule sheet for the box. It's a lookup table with no reference to beliefs, desires, goals, or memory. For the new situations, it's arbitrary.

  6. **Confederate Round (15 min):** 
     - Bring in a confederate (a friend). She will answer yes/no questions. The rule: she agrees to any request that contains the letter 'E' (or any other letter, but let's say 'E'). 
     - The teams are told: "This person has a rule for when she agrees to requests. You will ask her 5 requests (each team can ask one, and then two more for prediction). After each request, she answers. Then, each team writes a manual for her, including beliefs and desires (spending chips for each posit) and predicts her next two answers. They get 1 point per correct prediction and must spend chips for their manual."
     - The instructor provides a set of request cards (printed) for consistency. Each team chooses one request card to ask (or they can make one up? but we want to control for the letter 'E'). We'll have a set of 10 request cards, half with 'E' and half without. The teams don't know the rule.

     Example requests with 'E': 
     - "Can you help me with this heavy box?" -> she agrees (yes)
     - "Will you lend me a pen?" -> yes
     - "Do you have the time?" -> yes

     Without 'E':
     - "Can I borrow your book?" -> no
     - "Is it raining?" -> no
     - "Will you join us for lunch?" -> no

     Each team asks one request (from the set) and sees the answer. Then they write their manual (with beliefs and desires) and predict the next two requests (which we provide). They will likely posit beliefs and desires that fit the pattern they see (but the pattern is arbitrary). Then we run the next two requests (one with 'E', one without) and they see their predictions fail (if they didn't guess the rule).

     Important: if a team guesses the rule (e.g., "she agrees if the request has an 'E'"), that's okay. They can write a manual without beliefs and desires (just the rule) and then they don't spend chips and they predict correctly. But we want most teams to use beliefs and desires. If a team guesses the rule, they get points and save chips. That's fine because it shows that a non-mentalistic explanation is possible and more efficient.

     How to handle if they guess? We don't stop them. We want the contrast.

  7. **Reveal the confederate's rule (5 min):** The confederate reveals her rule: she agreed if the request contained the letter 'E'. 

  8. **Debrief (15 min):** 
     - Map the activity to the eliminativist position.
     - Key points:
          a. For the black box, we initially thought it had a function (tidy) and then beliefs and desires. But the rule sheet showed it was just an arbitrary lookup table. The function was something we projected because it was useful for prediction, but the box itself had no function (it's just a box following a table). Similarly, eliminativists might say that the function of mental states is a projection of our folk theory.
          b. For the confederate, we used beliefs and desires to explain her behavior, but a simple rule sufficed. This is analogous to how eliminativists argue that folk psychology might be replaced by a neurophysiological account without beliefs and desires.
          c. But note: the box and the confederate are simple. Humans are more complex. However, the activity shows that the explanatory power of belief-desire psychology doesn't necessarily mean it's true.
          d. Middle positions: instrumentalism (beliefs are useful fictions) vs realism (beliefs are real) vs eliminativism (beliefs are like phlogiston).

  9. **Handout and team reflection (5 min):** 
     - Hand out a half-page with three paragraphs (positions). Each team must say which one their manual ended up defending (in the confederate round, since the box round they saw the rule). The three paragraphs:

     Paragraph 1 (Realism): Beliefs and desires are real, internal states of a person. They are causally responsible for behavior and are part of the correct scientific description of the mind. When we say someone believes something, we are describing a real state in their brain that represents the world and guides action.

     Paragraph 2 (Instrumentalism): Beliefs and desires are not literally real, but they are useful tools for predicting behavior. We can use them without committing to their existence as internal states. They are like centers of gravity in physics: fictions that help us calculate.

     Paragraph 3 (Eliminativism): Beliefs and desires are posits of a false folk theory, much like phlogiston. As neuroscience advances, we will replace talk of beliefs and desires with a more accurate vocabulary that does not include these concepts. They do not refer to anything real.

     Teams discuss and pick which one they ended up with (depending on whether they used beliefs and desires and spent chips, or avoided them and used a rule).

  **Scoring Scheme:**
  - Prediction points: 1 point for each correct prediction (in each round).
  - Ontology chips: Each team starts with 10 chips. Every time they write a manual that includes a belief, a desire, a memory, or a goal, they must spend one chip per posit. For example, if they write "The box believes the floor is dirty and wants it to be clean", that's two posits (one belief, one desire) so they spend 2 chips. If they write a rule without mental states, they spend 0.
  - At the end, the team with the most prediction points wins. But if a team runs out of chips, they cannot posit any more mental states and must use a non-mentalistic manual (or they can't write a manual and lose prediction points). 
  - We don't want hoarding: if they don't spend chips, they might not be able to build a manual that predicts well? But in the box round 3, they need to build a manual to predict. If they avoid mental states, they can write a rule (like the lookup table) and then they don't spend chips and might predict better (if they figure it out). But in the confederate round, if they avoid mental states and find the rule, they get points and save chips. That's the trade-off: mental states might be easier to use initially but might lead to errors and cost chips.

  **What might go wrong:**
  - The black box rule might be guessed early (e.g., in round 2). If a team writes a lookup table without mental states, they don't spend chips and predict perfectly. That's okay because it shows the point: we don't need mental states to predict. Then in the debrief, we can say that for simple systems, we can avoid folk psychology.
  - The confederate rule might be guessed quickly. We have to accept that. We can have a more complex rule? But we want it to be simple enough to reveal the point. If a team guesses, they are rewarded with points and saved chips. That's the desired outcome for eliminativism: a better explanation exists.
  - The activity is third-person. The first-person experience (I know I have beliefs) isn't addressed. We can acknowledge that in the debrief: the activity doesn't capture the subjective aspect, but eliminativists would say that introspection is also a product of folk psychology.
  - Time: 90 minutes is tight. We must keep each round to the time limit.

  **Revised Timeline (90 min):**
  - 0-5 min: Introduction and team formation.
  - 5-20 min: Round 1 (15 min)
  - 20-35 min: Round 2 (15 min)
  - 35-50 min: Round 3 (15 min)
  - 50-55 min: Reveal box rule (5 min)
  - 55-70 min: Confederate round (15 min)
  - 70-75 min: Reveal confederate rule (5 min)
  - 75-85 min: Debrief (10 min)
  - 85-90 min: Handout and team reflection (5 min)

  **Adjustments for time:**
  We might need to shorten rounds. Alternatively, we can have the black box rounds run more efficiently by having the operator run trials for all teams at once.

  **Confederate Round Setup:**
  - Pre-brief the confederate to strictly follow the rule (e.g., agree if the request has the letter 'E', case insensitive?).
  - Prepare 10 request cards: 5 with 'E', 5 without. Examples with 'E': "Help me with the homework", "Tell me the time", "Lend me an eraser", "Where is the exit?", "Are you ready?" Examples without: "Can I borrow that book?", "Is it cold?", "Will you come?", "Any food left?", "Do you like apples?"
  - Each team gets to ask one request (from the set) and see the answer. Then, without knowing the other teams' requests, they write their manual and predict the next two requests (which are provided by the instructor). Then the confederate answers those two, and we see if the predictions are correct.

  **Draft of the three paragraphs for the handout:**

  1. (Realism) The concepts of belief and desire refer to real, internal states of a person. These states are causally involved in producing behavior and are grounded in the physical brain. When we attribute a belief to someone, we are describing a state that represents the world and is part of the machinery of the mind. This state exists independently of our attributions.

  2. (Instrumentalism) Belief and desire are useful concepts for predicting and explaining behavior, but they do not necessarily refer to real internal states. They are instruments that help us make sense of complex systems, much like a diagram or a model. We can use them without being committed to their existence as distinct entities in the brain.

  3. (Eliminativism) Belief and desire are concepts from an outdated folk theory of the mind. Just as we replaced phlogiston with modern chemistry, we should replace belief and desire with a more accurate scientific account. These folk concepts do not correspond to anything real and will eventually be eliminated from our scientific vocabulary.

  **Summary of the activity:**

  This design should lead students to experience the tension between the usefulness of belief-desire explanations and the possibility that they might be just tools that could be replaced. The scoring with ontology chips makes the theoretical cost of positing mental states tangible. The debrief connects this to the philosophical positions.
answer: |-
  Below is a complete, ready-to-run activity design focused on creating an experiential "trap" for eliminativism. It includes materials, rules, a detailed timeline, scoring mechanics, confederate staging, debriefing points, and the handout. The goal is to make the tension between predictive utility and ontological commitment visceral—without you lecturing. I've incorporated your "black box" and "confederate" ideas while refining the scoring and addressing your concerns about first-person experience and predictability.

  ---

  ### **Materials List**
  1. **Black Box Setup**:
     - Cardboard screen (approx. 60cm x 60cm) with a slot for input/output.
     - 20 laminated **situation cards** (inputs): e.g., "books on floor", "dirty dishes in sink", "clean table", "lights off", "window open", "trash full", "bed unmade", "door unlocked", "plant dry", "spilled water".
     - 10 laminated **action cards** (outputs): e.g., "pick up books", "wash dishes", "do nothing", "turn on lights", "close window", "empty trash", "make bed", "lock door", "water plant", "wipe spill".
     - **Rule sheet for the operator** (you or a friend behind the box). *See concrete rule sheet below*.
     - Timer.

  2. **Confederate Materials**:
     - Pre-briefed confederate (e.g., a student ally) with a simple rule: **"Agree to any request containing the letter 'T'."** (Use "T" for higher frequency than "E"—harder to spot).
     - 10 **request cards** for confederate:  
       - *With "T"*: "Help with this task?", "Tell me the time?", "Lend a pencil?", "Got a tissue?", "Water the plant?"  
       - *Without "T"*: "Can I borrow a book?", "Is it raining?", "Open the door?", "See you later?", "Need coffee?"

  3. **Team Materials** (for 3–4 teams):
     - **Prediction sheets** (paper with columns: Trial, Input, Predicted Output, Actual Output).
     - **Ontology chips**: 10 poker chips/buttons per team (5 red for "belief/desire", 5 blue for "memory/goal"—use colors to emphasize distinctness).
     - **Manual templates** (paper labeled "Team Manual: Rules, Beliefs, Desires").
     - **Scoring board** (whiteboard or poster): Tracks prediction points (1 per correct guess) and ontology chips spent.

  4. **Debrief Handout**: Half-page with three paragraphs (*see final section*).

  ---

  ### **Black Box Rule Sheet**
  **Operator Instructions** (concrete and arbitrary—no goals or memory):  
  *"For any situation card, take the FIRST WORD of the input, count its letters, then:  
  - If letter count is ODD: Output action card #3, #5, or #7 (choose randomly).  
  - If letter count is EVEN: Output action card #2, #4, or #6 (choose randomly)."*  

  **Why this works**:  
  - **First 8 trials appear goal-directed**: Use pre-selected inputs with odd/even first words that align with "tidying" (e.g., "books" (5 letters, odd) → randomly pick "pick up books"; "dishes" (6 letters, even) → "wash dishes").  
  - **Later trials break the pattern**: Introduce inputs where randomness creates nonsense (e.g., "window" (6 letters, even) → randomly output "make bed").  
  - **Key**: Operator must choose randomly from the 3 options to avoid patterns. Print this rule with examples on a cheat sheet.

  ---

  ### **Round-by-Round Rules & 90-Minute Timeline**
  **Total: 90 minutes**  
  *Keep strict timing; use a visible timer. Teams work in parallel.*

  #### **Round 1: Blind Prediction (15 min)**  
  - **Setup**: Show only the physical black box. Teams get 3 random situation cards.  
  - **Task**: Teams predict the action card output for each input. No manual, no chips.  
  - **Trial**: Run 3 trials (1 card/team). Teams record predictions.  
  - **Scoring**: 1 prediction point per correct guess.  
  - **Outcome**: Low scores (random outputs). Teams feel "hopeless".

  #### **Round 2: Functional Description (15 min)**  
  - **Setup**: Reveal: *"This is a TIDY-UP 3000! Built to tidy rooms."* Teams get 5 new situation cards (select "tidy-aligned" inputs: e.g., "books on floor", "dirty dishes").  
  - **Task**: Teams build a **non-mentalistic manual** (e.g., "If books on floor → pick up books"). No chips spent.  
  - **Trial**: Run 5 trials. After each, teams update manuals.  
  - **Scoring**: 1 prediction point per correct guess.  
  - **Outcome**: Scores soar. Manuals are simple input-output rules.

  #### **Round 3: Belief/Desire Commitment (20 min)**  
  - **Setup**: Reveal: *"Upgrade your manual: Explain behavior using beliefs/desires, memory/goals."* Teams get 4 new trials:  
    - First 2: "Tidy-aligned" inputs (e.g., "trash full" → "empty trash").  
    - Last 2: "Nonsense" inputs (e.g., "window open" → random action like "make bed").  
  - **Task**:  
    - Before predictions, teams write manuals with mental states (e.g., "Believes trash is full; desires clean room").  
    - **Ontology chips**: Spend 1 chip **per posit** (e.g., "believes X" = 1 red chip; "wants Y" = 1 blue chip) when adding to the manual.  
  - **Scoring**: 1 prediction point per correct guess + chip tracking.  
  - **Reveal**: Show the actual rule sheet. Highlight its lack of beliefs, desires, or goals.  
  - **Outcome**: Teams "succeed" on first 2 trials, fail on last 2. Chip spending feels "natural" until the rule reveal.

  #### **Confederate Round: Person Simulation (20 min)**  
  - **Setup**: Introduce confederate: *"She’ll answer yes/no requests. Build a manual explaining her behavior with beliefs/desires."*  
  - **Task**:  
    - Each team asks 1 request (from cards). Confederate answers based on the "T" rule.  
    - Teams write manuals with beliefs/desires (spending chips per posit).  
    - Teams predict her next 2 answers (use new request cards).  
  - **Scoring**: 1 prediction point per correct guess + chip spending.  
  - **Reveal**: Confederate states her rule: *"I agreed if your request had a 'T'."*  
  - **Staging to Avoid Early Guessing**:  
    - Use high-frequency "T" requests early (e.g., "Tell time?" → "Yes") to encourage belief-based explanations (e.g., "She wants to be helpful").  
    - If a team guesses the rule early:  
      - Praise their non-mentalistic manual (they save chips and score points).  
      - In debrief, use this to show prediction *without* ontology is possible.  

  #### **Scoring Scheme**  
  - **Prediction points**: 1 per correct guess (cumulative across rounds).  
  - **Ontology chips**:  
    - Teams start with 10 chips (5 red, 5 blue).  
    - **Spending**: 1 chip per mental state posit (belief/desire = red; memory/goal = blue) added to the manual.  
    - **Anti-hoarding**: Teams must spend chips **during manual-writing** (before predictions). If they skip spending, they forfeit predictions for that round.  
    - **Trade-off**: Saving chips risks inaccurate manuals → lost points. Spending chips drains resources → teams feel the "cost" of posits.  
  - **Winner**: Team with most prediction points. Chips unused = bonus (1 point per 2 chips), encouraging parsimony.  

  ---

  ### **Debrief (15 min)**  
  **Goals**: Map the activity to eliminativism, avoid oversimplification, address first-person gap.  

  #### **Talking Points**:  
  1. **The Black Box Trap**:  
     - "You posited desires (e.g., 'wants to tidy') for the box because it was *useful*—but the rule sheet had none. Did the box *have* a function? Or did you project it? Function-talk is a tool, not a fact."  
     - **Link**: Folk psychology is like this—a tool for prediction that may not reflect "real" inner states.  

  2. **Confederate Fallibility**:  
     - "You built belief-desire manuals for her, but a simple rule explained everything. Why did mental states feel necessary? We default to folk psychology even when it’s wrong."  
     - **Link**: Eliminativists say neuroscience could reveal our "rule sheets"—no beliefs needed.  

  3. **The Ontology Trade-off**:  
     - "Scoring forced you to weigh prediction against 'ontological spending.' Folk psychology is costly—it commits us to things that might not exist (like phlogiston)."  

  4. **Middle Grounds & Caveats**:  
     - **Realism**: "But I *feel* my beliefs! First-person experience isn't captured here—maybe beliefs *are* real, internal causes."  
     - **Instrumentalism**: "Beliefs might be useful fictions (like 'centers of gravity')—real in practice, not in substance."  
     - **Eliminativism**: "Or they're relics of folk theory, doomed for replacement."  
     - **Critical Gap**: This activity only shows third-person prediction. First-person experience (e.g., "I know I believe!") isn't addressed—but eliminativists argue introspection is also folk-driven.  

  5. **Structural Limits**:  
     - **Predictable issues**:  
       - Teams may guess confederate’s rule early (if so, it showcases instrumentalism).  
       - Black box randomness might frustrate (lean into it: "Chaotic systems resist folk explanations!").  
     - **What’s missing**:  
       - No account of consciousness, qualia, or self-knowledge.  
       - Humans aren’t lookup tables—this is a toy model. Real eliminativism hinges on future science.  

  ---

  ### **Handout: Three Positions on Belief-Talk**  
  *(Half-page, no names/citations)*  

  **Paragraph A**:  
  Beliefs and desires are real, internal states. They are physical structures in the brain that cause behavior. When we say "Alice believes it’s raining," we describe a concrete state that represents the world and guides her actions. This state exists independently of our interpretations—just as a heart exists whether or not we discuss it. Belief-talk succeeds because it tracks these real entities.  

  **Paragraph B**:  
  Beliefs and desires are tools, not real things. They are useful for predicting behavior but should not be mistaken for literal descriptions of the mind. Like a navigator’s map, they help us steer social interactions without claiming the map *is* the territory. We keep them for their practical value, even if science reveals they are fictions.  

  **Paragraph C**:  
  Beliefs and desires are false concepts from an outdated "folk theory" of the mind, similar to ancient ideas like phlogiston or humors. They do not refer to anything real and will be replaced by neuroscience. Clinging to them obstructs progress—we should eliminate them entirely from scientific discussion.  

  **Activity**: With your team, reread your manual from the confederate round. Which paragraph does it align with? Discuss.  

