  ### **Why This Works**  
  - **Trap achieved**: Teams "willingly" use beliefs/desires because they work initially (Round 3), then feel the rug-pull when outputs diverge. The chip system makes ontological waste tangible.  
  - **Confederate safeguard**: "T" rule is subtle; high-frequency requests (e.g., "Tell time?") make belief-attribution natural. If guessed early, it reinforces eliminativism’s point.  
  - **Debrief grounds it**: Explicitly ties the box’s "function" to folk psychology’s projected ontology and acknowledges the first-person gap.  
  - **Handout crystallizes**: Teams self-identify their position, sparking debate without you lecturing.  

  **First run tips**: Brief your confederate thoroughly. Print all rules/cards. If tech-averse, use paper scoring boards. Expect noise—lean into the chaos ("See? Folk psychology frays at the edges!").
