  First, I need to unpack their core request: they want a precise mapping between theory and case, bidirectional analysis, and candid limitations. They're clearly frustrated with their classmate dismissing Paul's work as "just uncertainty," so they need ammunition that's philosophically rigorous but also concrete. 

