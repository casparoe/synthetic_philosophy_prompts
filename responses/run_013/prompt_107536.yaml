answer: |-
  ## The Geometric Mirage: A Theorem Masquerading as Rationality

  The strongest version of the pro-geometric rationality position argues this: Rational agents *must* maximize the long-term growth rate of their wealth. This is presented not merely as *one* rational strategy under specific conditions, but as a fundamental, universally applicable norm distinct from—and superior to—expected utility maximization (EUM) in its raw form. Why? Because EUM, focusing on the arithmetic mean of terminal wealth, blindly accepts positive expectation bets that lead to almost certain ruin over time, violating the core tenet of "never risk ruin." Geometric rationality, by maximizing the geometric mean (or equivalently, the expected logarithm of wealth), inherently avoids this trap. It sizes bets via the Kelly fraction, ensuring optimal growth and survival. This framework, proponents claim, reveals a deeper truth about multiplicative processes and the primacy of growth rate over mere expectation, applicable wherever consequences compound.

  **Here is the truth: Geometric rationality is not a distinct decision theory. It is a powerful and important *theorem* about optimal betting strategies *within a highly specific class of decision problems*. Mistaking this theorem for a universal criterion of rational choice is a profound category error that collapses upon scrutiny outside its narrow domain.** Its prescriptions are consequences of the mathematics of repeated multiplicative gambles under log utility, not freestanding axioms of rationality.

  The core theorem requires *all* of the following premises to hold simultaneously:

  1.  **Repeated Independent Trials:** The identical bet or investment opportunity must be faced an infinite (or very large) number of times.
  2.  **Multiplicative Dynamics:** Outcomes must multiply existing wealth (e.g., fractional betting: wealth_next = wealth_now * (1 + f * r), where `f` is fraction bet, `r` is random return).
  3.  **No Intermediate Consumption or Utility:** Wealth has no intrinsic utility until some distant terminal horizon; all wealth is always reinvested. Utility is derived solely from terminal wealth.
  4.  **Terminal Wealth as Sole Good:** The agent cares *only* about the final wealth level at that distant horizon, not the path taken to get there or any other goods.

  The magic happens because, under these conditions, the Strong Law of Large Numbers guarantees that the *time-average growth rate* (lim_{N->∞} (1/N) * log(Wealth_N / Wealth_0)) converges almost surely to the *expected* growth rate per period (E[log(1 + f * r)]). Maximizing this expected growth rate *does* maximize almost-sure long-run wealth. The Kelly fraction emerges as the `f` maximizing E[log(1 + f * r)]. Ruin (Wealth -> 0) occurs with probability 1 if the bet size (`f`) is too large relative to the edge, because in a multiplicative world, a single loss to zero is irreversible and dominates the product.

  **Now, watch the argument disintegrate as we relax these premises:**

  *   **The One-Shot Bet (Premise 1 Dropped):** Suppose you face a single, favorable gamble: 60% chance to double your money, 40% chance to lose it all. The expected *arithmetic* value of betting full wealth is 1.2 * Wealth_0. The Kelly fraction is zero (since E[log(1 + f * r)] is maximized at f=0 for this bet – the risk of ruin outweighs the edge). Proponents say "Never take it! Risk ruin!" But *why* is ruin unacceptable here? You only play once. If you have a linear utility function (U(W) = W), maximizing expected terminal wealth *demands* taking the bet with your entire bankroll. Avoiding it implies a utility function that plummets towards -∞ as wealth approaches zero (like log utility). The "never risk ruin" dictum is *not* a theorem here; it’s a *preference* encoded in the concave shape of the log function. The geometric argument has nothing to say *against* the linear utility maximizer taking the bet; it merely assumes log utility by fiat. The substantive long-run convergence argument evaporates without repetition.

  *   **Not Wealth, Not Ruin (Premise 3 & 4 Dropped):** Imagine you care about your health, not wealth. You face a medical decision: a treatment with a 95% chance of curing you and a 5% chance of fatal complications. "Never risk ruin (death)!" cries the geometric rationalist. But what does "fractional betting" mean here? What is your "health bankroll"? How do you "reinvest" your health fractionally across repeated treatments if this is the only one? The multiplicative model is nonsensical. Avoiding the treatment might be rational if you value survival immensely more than a cure, but that's a preference captured by a utility function assigning near-infinite negative utility to death. It’s not an application of a growth-rate theorem. The Kelly machinery simply doesn't engage. Ruin avoidance becomes pure preference, not mathematical necessity.

  *   **The Single Trajectory vs. The Ensemble (Premise 1 Revisited):** Even with repetition, the geometric mean maximization theorem is about the *almost-sure convergence of the time-average growth rate along a single path*. It guarantees that maximizing E[log(return)] maximizes your growth rate *in the world you actually experience*, over the long run. Expected utility maximization with log utility *also* achieves this. The theorem shows *why* log utility is the *right* utility function for someone who *only* cares about long-run terminal wealth under multiplicative dynamics and repetition. It doesn't show that log utility is *generally* the right utility function. It shows that *under these specific conditions*, maximizing the expected value of *this specific utility function* aligns with the objective of maximizing time-averaged growth. The "ensemble average" (average wealth across all possible worlds at time N) still grows maximally for the arithmetic mean maximizer. Geometric rationality doesn't say the ensemble average is wrong; it says that for an agent living a *single* long multiplicative path, caring *only* about the endpoint, the time-average convergence makes the geometric mean (via log utility) the relevant objective. This is a profound insight about stochastic processes, not a new foundation for rationality.

  *   **Intermediate Consumption & Path Dependence (Premise 3 Dropped):** Real people consume. They derive utility from wealth *along the path*, not just at a distant horizon. A strategy maximizing long-run geometric growth might involve brutal drawdowns that force severe consumption cuts for decades. An agent who smooths consumption might rationally accept a lower long-run growth rate to avoid crushing poverty during bad streaks. Geometric rationality, focused solely on terminal wealth via reinvestment, ignores this entirely. The "optimal" Kelly fraction becomes irrelevant; the rational choice depends on the *utility of consumption over time*.

  **Why Practitioners Bet Fractional Kelly:** This is the tell. If geometric rationality were the universal norm, full Kelly would be the rational default. Yet savvy investors (including Kelly himself) often bet half-Kelly, quarter-Kelly, or less. Why? Precisely *because* the foundational premises fail in practice:
      *   **Uncertainty in Estimates:** Your edge (probability, payoff) is never known with certainty. Estimation error turns full Kelly, optimized for *known* probabilities, into an overbet with significant risk of drawdown.
      *   **Violations of Independence & Identical Distribution:** Real bets are correlated and not perfectly identical. A string of correlated losses can devastate a full-Kelly bettor.
      *   **Risk Aversion Beyond Ruin:** Humans (and funds) have thresholds *above* zero where failure occurs (e.g., margin calls, redemptions, job loss). Log utility cares intensely about near-zero, but less about, say, a 50% drawdown that might trigger real-world disaster.
      *   **Non-Multiplicative Liabilities:** Personal circumstances (mortgages, needs) create path dependencies and risk tolerances not captured by total wealth multiplication.
  Fractional Kelly betting is *pragmatic recognition* that the pure theorem's conditions don't hold. It's an empirical hedge *against* model error and unaccounted-for preferences, implicitly acknowledging that the "optimal growth rate" prescribed by the pure theorem isn't the only thing that matters. It's risk-management, not adherence to geometric rationality.

  **Conclusion:** Geometric rationality is a brilliant and indispensable theorem. It rigorously proves that for an agent facing *infinitely repeated, independent, multiplicative bets*, with *no consumption*, caring *only about terminal wealth*, maximizing the *expected logarithm* of wealth maximizes the *almost-sure long-run growth rate* and avoids certain ruin. This is deep and important. However, it does not follow that maximizing growth rate *is* rationality. The theorem's prescriptions—Kelly fractions, ruin avoidance—are *outputs* of this specific optimization under these specific constraints, not freestanding rational imperatives. Outside this tightly bounded domain, these prescriptions either become meaningless (e.g., fractional betting on health), collapse into a specific preference assumption (log utility in a one-shot bet), or are actively harmful (ignoring consumption smoothing, estimation risk, or non-wealth goods). Expected Utility Theory, with its ability to encode diverse preferences (including, but *not limited to*, log utility) and handle path-dependence, consumption, non-wealth goods, and single-shot decisions, remains the general framework for rational choice. Geometric rationality is a powerful special case, illuminating a crucial class of problems, but elevating it to a universal norm confuses a mathematical truth about multiplicative processes for the entirety of rational decision-making. The mistake is in the overgeneralization, not in the theorem itself.
