prompt: |-
  I've been going round in circles with a friend about what makes something alive, and I've realised I can't actually state the rule I've been using — I just have gut verdicts, case by case. A bacterium: alive, obviously. A flu virus: not alive, though it sits closer to the line than I'm comfortable with. A prion: not alive, no hesitation at all. A mule: alive — and so is a sterile worker ant — so being able to reproduce on your own clearly isn't required. A tardigrade in cryptobiosis, freeze-dried for twenty years with no measurable metabolism: still alive, just switched off, so an active metabolism isn't required either. A flame: not alive, even though it eats, grows, spreads and dies. A growing crystal: not alive. A tumour: alive, which I find genuinely disturbing. A HeLa cell line in a flask: alive. A mitochondrion on its own outside the cell: I want to say not alive, it's a part of something bigger, but it was a free-living bacterium once and I can't articulate why the past should matter. A self-replicating RNA molecule someone built in a test tube: I keep flip-flopping; my gut says 'not yet', which worries me precisely because I can't say what's missing. A computer worm crawling across the internet making copies of itself: not alive. And those little blobs made of frog stem cells that scoot about and repair themselves — the xenobots, or whatever they're called — I honestly have no idea, and I suspect that whatever I say next I'll turn out to be inconsistent.

  My friend's proposal, which I half like: a thing is alive if and only if it does work to hold itself together in a state that would otherwise fall apart, and can hand that same trick on to a next generation. I don't think that survives all my verdicts, but I can't tell which ones it fails, or whether the fault is the principle's or mine. (For what it's worth I'm in a reading group on philosophy of biology, so I've seen the usual candidates, and none of them definately feels like the one I've actually been running.)

  You're a philosopher of biology, so please act like one: take your time, and start by laying out the candidate criteria seperate from one another — metabolism, self-maintenance, reproduction, evolution by natural selection, membership in a lineage, having a boundary, and the distinction between being an organism and being a part of one — before committing. Then tell me which single criterion, or which small cluster, comes closest to my verdicts, and which one of my verdicts it forces me to give up if nothing clean gets everything; don't quietly patch the principle until it fits, I'd rather drop a verdict. Say what your best candidate predicts about a few cases I haven't listed — a self-sustaining chemical reaction cycle with no heredity whatsoever, a whole forest considered as one thing, and a robot that mines its own fuel and builds copies of itself. I'd also like you to flag which of my verdicts might just be status-quo bias about 'real' biology rather than anything principled. Be upfront about how confident you are in whatever principle you land on, and single out the one step in your reasoning you're least sure about.
reasoning: |-
  Okay, the user is deeply engaged in a philosophical debate about the definition of life and has hit a wall with their intuitive judgments. They've listed numerous edge cases—bacteria, viruses, prions, mules, tardigrades in cryptobiosis, flames, crystals, tumors, HeLa cells, isolated mitochondria, synthetic RNA, computer worms, and xenobots—each challenging different aspects of conventional criteria for life. Their frustration is palpable: they want a coherent principle that aligns with their intuitions but can't find one among standard definitions (metabolism, reproduction, evolution, etc.). 

  Their friend's proposal—self-maintenance plus heredity—is intriguing but feels incomplete to them. The user is clearly well-read (mentioning a philosophy of biology reading group) and wants rigor: no patched principles, no hidden inconsistencies. They're asking me to dissect existing criteria, test them against their verdicts, and identify where their intuitions might be biased. 

  First, I need to map their verdicts against traditional criteria. Their rejection of reproduction as essential (mules, worker ants) and metabolism (tardigrades) eliminates some definitions immediately. Their discomfort with viruses and synthetic RNA suggests they're clinging to something about "natural" biology, which might be a bias worth flagging. The tumor and HeLa cell acceptances imply they see "organism" as flexible, but the mitochondrion hesitation reveals a conflict between historical origin and current function. 

  The friend's proposal fails for viruses (they deny life, but viruses "hold together" via capsids and heredity via RNA) and flames (which "maintain" structure but lack heredity). If I push the friend's principle, it'd force them to accept viruses as alive—which they resist. 

  I suspect their core intuition is about *teleonomy*: goal-directedness via evolutionary history. That covers mules (descended from replicators), tumors and HeLa (cell-lineage with evolutionary origin), and excludes flames/crystals (no lineage). It handles tardigrades (dormancy evolved for survival) and synthetic RNA (no deep history). But it stumbles on xenobots (designed but made of evolved cells?) and mitochondria (evolutionary past irrelevant?). 

  The biggest tension is their mitochondrion verdict: they deny it's alive alone, but its past as a bacterium nags at them. Teleonomy says only current membership in a lineage matters, so isolated mitochondria aren't alive—consistent, but might feel unsatisfying. They'd need to drop the "past matters" intuition. 

  For unlisted cases: a self-sustaining reaction cycle (no lineage → not alive), a forest (not a unit of selection → not alive), a self-replicating robot (no evolutionary history → not alive). Their status-quo bias shows in viruses (overly focused on cellular life) and synthetic RNA (waiting for "naturalness"). 

  I’m 70% confident in teleonomy. Least sure step is handling xenobots—if we see them as extensions of frog cell lineages, they're alive; if as human-designed tools, not. That ambiguity might require conceding gray areas. Ultimately, they’ll have to sacrifice either the virus or mitochondrion intuition to avoid contradiction.
answer: |-
  You've hit the core problem in philosophy of biology: **life is a cluster concept with no universally agreed-upon necessary and sufficient conditions.** Your intuitions reveal the tensions brilliantly. Let's dissect this systematically.

  ### Core Criteria (Laid Bare)
  1.  **Metabolism:** Processing energy/matter to maintain organization.
  2.  **Self-Maintenance/Homeostasis:** Actively regulating internal state against entropy.
  3.  **Reproduction:** Producing new individuals (can include group/lineage-level).
  4.  **Heredity:** Passing on traits to offspring (requires reproduction).
  5.  **Evolution by Natural Selection (ENS):** Requires variation, heredity, and differential reproduction leading to adaptation.
  6.  **Lineage Membership:** Being part of a historically continuous chain of descent.
  7.  **Organismality vs. Part:** Being a functionally integrated whole, not merely a component.
  8.  **Boundary:** A physical separation (membrane, skin) defining the system.

  ### Your Verdicts & Their Tensions
  *   **Anti-Reproduction Essentialism:** Mule, sterile ant alive ✅. Reproduction isn't *necessary* for your concept.
  *   **Anti-Metabolism Essentialism:** Tardigrade (cryptobiosis) alive ✅. Continuous metabolism isn't *necessary*.
  *   **Pro-Organismality:** Bacterium ✅, Tumor ✅, HeLa ✅, Mitochondrion ❌ (part), Prion ❌ (misfolded part). *Being a functional whole* seems crucial.
  *   **Pro-Lineage/History:** Mitochondrion ❌ (despite past) vs. Bacterium ✅. *Current* status matters more than past potential. RNA flip-flop suggests you *want* a lineage/history component.
  *   **Anti-"Physics-Only" Processes:** Flame ❌, Crystal ❌. *Biological organization* is key.
  *   **Gray Zone Discomfort:** Virus (❌), RNA (❌?), Xenobot (?). Your "gut" senses a lack of *biological agency* or *lineage continuity*.
  *   **Status-Quo Bias Flags:** Virus (❌ - cellular chauvinism?), Synthetic RNA (❌ - "unnatural" origin bias?), Mitochondrion (❌ - might be underestimating organelle autonomy?).

  ### Your Friend's Proposal: A Critical Look
  "*Does work to hold itself together... and can hand that trick on.*" = Self-Maintenance + Heredity.

  *   **Fits:** Bacterium ✅, Mule ✅ (holds itself together, lineage heredity), Sterile Ant ✅ (ditto), Tumor ✅ (self-maintains, cellular heredity), HeLa ✅, Tardigrade (cryptobiosis) ❓(Does "work" while dormant? Debatable, but you accept it).
  *   **Fails Your Verdicts:**
      *   **Virus (❌):** *Does* hold itself together (capsid stability), *does* hand on the "trick" (genetic info). **Forces you to accept viruses as alive.**
      *   **Flame (❌):** Holds structure dynamically (work against dissipation), "hands on" structure to new flames. **Forces you to accept flames as alive.**
      *   **Prion (❌):** Holds stable structure, "hands on" conformation template. **Forces you to accept prions as alive.**
      *   **Computer Worm (❌):** Maintains integrity (code), replicates/copies itself. **Forces you to accept it as alive.**
      *   **Mitochondrion (❌):** *If isolated but functional*, might self-maintain membrane potential briefly and has DNA. **Forces inconsistent verdict or acceptance.**
  *   **Problem:** It's too broad. Many non-living dissipative structures (flames, vortices) and replicators (crystals, computer code) fit.

  ### The Best Candidate Principle for *Your* Verdicts: Teleonomic Organization within a Lineage

  *   **The Principle:** **"X is alive if it is a functionally integrated system exhibiting *teleonomic organization* (goal-directedness toward self-perpetuation) as a result of being part of a lineage subject to evolution by natural selection."**
  *   **Components:**
      *   **Teleonomic Organization:** Present capacity/activity *directed at* maintaining itself as a distinct system and perpetuating its kind (covers self-maintenance, metabolism *when active*, growth, response). Explains tumor/HeLa being alive (striving to persist/grow), flame not (no internal "goal").
      *   **Lineage Subject to ENS:** Explains reproduction *not* being essential for the *individual* (mule, ant) – they are products *of* such a lineage. Explains rejection of virus (no intrinsic metabolism/self-maintenance *for its own perpetuation* outside host lineage), synthetic RNA (no *evolutionary history* bestowing teleonomy), computer worm (no biological lineage/ENS). Explains mitochondrion being a part, not alive alone (its teleonomy is subsumed by the cell's; it belongs to the *cell's* lineage now). Makes xenobots ambiguous (derived *from* a lineage, but designed/not subject to ENS *as xenobots*).
      *   **Functionally Integrated System:** Addresses organism/part distinction (prion ❌, mitochondrion ❌, crystal ❌).

  ### How It Handles Your Cases
  *   Bacterium: ✅ (Teleonomic, lineage w/ENS)
  *   Virus: ❌ (Lacks intrinsic teleonomic organization; its "goals" are parasitic hijacking of host machinery, not its own)
  *   Prion: ❌ (Not a system, no teleonomy, not a lineage)
  *   Mule/Sterile Ant: ✅ (Teleonomic, product of lineage w/ENS)
  *   Tardigrade (cryptobiosis): ✅ (Dormancy is a *teleonomic strategy* evolved via ENS)
  *   Flame: ❌ (No teleonomy, no lineage/ENS)
  *   Crystal: ❌ (No teleonomy, no lineage/ENS)
  *   Tumor: ✅ (Pathological teleonomic organization within a cellular lineage w/ENS)
  *   HeLa: ✅ (Same as tumor - autonomous cellular lineage w/ENS-derived teleonomy)
  *   Mitochondrion (isolated): ❌ (Not functionally integrated whole *now*, teleonomy derived from/subsidized by cell lineage)
  *   Self-Replicating RNA: ❌ (No *evolutionary history* bestowing teleonomic organization; just chemistry. Your "not yet" gut feeling likely senses the lack of an evolved *context* for its replication.)
  *   Computer Worm: ❌ (No biological lineage/ENS, no evolved teleonomy)
  *   Xenobot: ❓(Most ambiguous. *If* viewed as an artificial extension/expression of frog cell lineage teleonomy (cells acting collectively as evolved to do in a new context), **maybe ✅**. *If* viewed purely as a human-designed tool, **❌**. Your uncertainty is justified.)

  ### Predictions for New Cases
  1.  **Self-Sustaining Chemical Cycle (No Heredity):** E.g., a persistent Belousov-Zhabotinsky reaction. ❌ **Not alive.** Exhibits self-organization/dissipation, but lacks heredity, lineage, and crucially, *teleonomy derived from ENS*. It just *is*.
  2.  **Whole Forest as One Thing:** ❌ **Not alive.** While composed of living parts and exhibiting complex dynamics, it lacks the functional integration, unified teleonomy, and unit-level lineage/ENS required. It's an ecosystem, not an organism.
  3.  **Self-Replicating Robot (Mines Fuel, Builds Copies):** ❌ **Not alive.** Lacks a biological lineage subject to ENS. Its "goals" are programmed, not evolved. Replication is mechanistic, not teleonomic in the biological sense. (This distinguishes it from *hypothetical* robots evolving via true, open-ended ENS).

  ### What You Must Give Up
  To hold this principle consistently, you must **firmly reject viruses as alive.** Your discomfort stems from their reliance on host machinery – they lack the *intrinsic* teleonomic organization of a lineage product. Their "life-like" properties are borrowed. This is the price of excluding flames and synthetic RNA.

  ### Confidence & Uncertainty
  *   **Confidence Level: ~70%.** This principle best captures the nuanced cluster of properties driving your intuitions, especially the focus on *agency* (teleonomy) grounded in *evolutionary history*.
  *   **Least Sure Step:** **The status of xenobots and similar constructs.** Is "derived from a lineage subject to ENS" sufficient, even if the *specific* form isn't? Or must the entity *itself* be part of an ongoing process of ENS? This hinges on the blurry line between an organism's *potential* and the *realization* of that potential in a novel context. My leaning (✅ if seen as cellular expression) feels slightly ad-hoc compared to the core principle.

  This principle highlights that your "gut" is deeply sensitive to **evolutionary embeddedness** as the source of biological agency. Your verdicts largely reflect whether an entity is *itself* a current manifestation or product of a Darwinian evolutionary process striving to persist. The inconsistencies you fear often arise when this evolutionary context is absent (synthetic RNA, computer worm) or hijacked (virus). Embrace the clarity, even if it means sacrificing the virus.
