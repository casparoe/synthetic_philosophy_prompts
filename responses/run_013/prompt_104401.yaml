  For the comparative-goods hunch, I think it's legit. Positional goods force a reevaluation of LDO because levelling down isn't gratuitous—it's necessary for improving others. This shifts the debate. Prioritarianism might struggle here since it's built on independent welfare. Egalitarianism could handle comparative goods better, making LDO less relevant. That's a significant twist worth exploring.

  On the risk and non-identity problems, these might share a root in prioritarianism's additively separable structure. The same mathematical properties causing issues with risk (like violating separability) also affect population ethics. Tackling the non-identity problem first could be strategic because it's less technically demanding than decision theory. Success there might inform the risk aspect.

