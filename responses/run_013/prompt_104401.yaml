prompt: |-
  I'm trying to work out what to spend the next two years on. I work on distributive justice and keep circling prioritarianism and the levelling-down objection — the standards line being that prioritarians can say levelling down is bad in a way egalitarians can't, which is supposed to be a big point in their favour. Two things make me think the live work isn't there. First, nearly all of that literature runs on welfare, where one person's number is independent of everyone else's; I want to know what happens when the good being distributed is comparative — status, positional advantage, political power, maybe competitive achievement — so that you can't raise the worse off without lowering the better off, and levelling down stops being gratuitous. Second, I can't tell whether prioritarianism's troubles with risky prospects and with people who don't exist yet are separate open questions or the same one wearing a hat.

  Given two years of focused work and a decent grounding in the welfare and equality literature but no formal decision theory, which open questions around prioritarianism and levelling down should I prioritise, in what order, and why? I care more then the list about the reasoning: which questions are upstream of which, which are tractable for one person, which look central but are really bookkeeping, and what would move something up or down the list over the next year. And tell me honestly whether the comparative-goods hunch is a real research question or me being cute.
