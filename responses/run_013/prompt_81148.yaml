  First, note that step (3) says that T proves □S → S for every S. However, Löb's theorem (as stated) says that if T proves □S → S, then T proves S. Step (4) then says that if T proves □S → S for every S, then by Löb's theorem, T proves every S. But note that Löb's theorem is a schema: for each fixed S, if T proves □S → S, then T proves S. However, step (3) is asserting that T proves every instance of the reflection schema. Then step (4) applies Löb's theorem to each instance. Specifically, for each S, since T proves □S → S, then by Löb's theorem (for that S) we get that T proves S. So T proves every S.

