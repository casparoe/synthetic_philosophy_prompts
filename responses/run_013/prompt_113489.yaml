answer: |-
  ## Still Frame

  She turns the key. The wall is **still** the wall.  
  The lamp she left switched on will glow, or **else**?  
  (That bulb might blow. The wiring could conspire.)  
  She checks the latch. How long must doubt **wait**?  
  The table holds its form. Her thoughts **reach**  
  for all that shifts when she walks out — **after**.

  **After** she leaves, the cupboards won't refill  
  themselves. The dust will settle, quiet, **still**.  
  The cat, confused, might stretch and vainly **reach**  
  the knob. Or nap. Or something wholly **else**.  
  Will silence bloom, or will the old rage **fire**  
  within the pipes? There’s nothing left but **wait**.

  How long before the new place feels like home? Just **wait**.  
  The threshold crossed, the unfamiliar air **after**  
  the slam of doors. Will the old hearth **fire**  
  find echo here? The new walls stand so **still**,  
  so blank. What ghosts of habit might **else**  
  where gather? Can she stretch her weary **reach**?

  She used to map the world: how far to **reach**  
  the shelf, what breaks if dropped. Now, just **wait**  
  to see what holds, what shifts. What rules **else**  
  apply? Beyond the door, a strange **after**  
  begins. The old room? Picture it: so **still**,  
  the lamp a steady, unremarked small **fire**.

  (That unseen wire, a spark, a hungry **fire**  
  could leap — but usually doesn’t. Safe to **reach**  
  that conclusion? Mostly. Things persist, lie **still**,  
  by silent law. But doubt insists you **wait**,  
  list every nail and tile — and **after**  
  that, the ceiling tile, the dust... what **else**?)

  The unlisted things — the weight, the air, the **else**  
  of being there — they hum, a constant **fire**  
  beneath the surface. Packed, moved, **after**  
  the van departs, the empty space will **reach**  
  no more to hold her. Yet the shapes all **wait**,  
  imprinted on the air, a fading **still**.

  *(Envoi)*

  The **after** holds its breath. What must you **else**  
  declare? What fragile peace will **wait**, what **fire**  
  might **reach** unseen? The unsaid stands, stands **still**.

  ---

  ## Why this works for Maya

  *   **The Frame Problem Embodied:** The rotating end-words (`still`, `else`, `wait`, `fire`, `reach`, `after`) are the "persistent fluents" – they recur without needing explanation *within the poem's form*. Everything else (the rest of the lines) has to be constantly re-specified, mirroring the need to state what changes while persistence is assumed but never fully guaranteed.
  *   **The Haunt:** The central tension is the anxiety of the unstated – what *else* might change? What assumptions can you safely make? What could go wrong (`fire`)? The constant questioning (`or else?`, `will...?`, `might...?`) reflects the projection problem. The domestic imagery (lamp, walls, table, cupboards, latch, cat, pipes, shelf) grounds it in the "room leaving" metaphor.
  *   **The Envoi Squeeze:** The final three lines pack in all six words, creating that overwhelming feeling of trying to capture everything at once ("What must you else declare?") and the inherent incompleteness ("The unsaid stands, stands still"). Ending on `still` emphasizes the lingering uncertainty and the things that just persist, unexplained.
  *   **Two Levels:** On the surface, it's clearly about packing, leaving, the anxiety of transition, and the ghost of the old place. For Maya, every stanza resonates with that specific academic ghost – the problem of specifying change vs. persistence, the danger of unstated assumptions (`fire` as potential system failure), the endless "what else?".
  *   **No Jargon:** Just everyday words and relatable moving-away anxieties. The technical resonance is purely in the structure and the *kind* of questioning.
  *   **For Maya:** It honors her struggle with that foundational, persistent problem ("the ghost that haunted her whole field") while marking her transition ("moving to a robotics job in another city"). The "Still Frame" title hints at both a paused moment and the problem's core.

  I hope this captures the specific blend of fondness, inside-joke, and genuine resonance you wanted for Maya's farewell. The sestina form truly is the perfect vehicle for this.
