  Okay, the user is preparing a graduate seminar on teleosemantics and naturalizing intentional content. They want their class to build a specification of desiderata before evaluating existing theories. This is a sophisticated request from someone clearly deeply familiar with the philosophy of mind literature. 

  Hmm, they've listed several challenging cases they plan to press during the seminar - the Swampman thought experiment, the predator/shadow case, repurposed representations, etc. Their underlying concern seems to be whether etiological theories (especially evolutionary ones) can handle these cases. I should acknowledge this tension explicitly rather than papering over it.

  Let me mentally walk through the core challenges here. First, the misrepresentation problem - any naturalistic theory must explain how a state can be false. Then there's the determinacy problem - why does a state mean one specific thing rather than something else correlated with it? And the Swampman case forces us to consider whether history is truly necessary for content.

  *scribbles mentally* The desiderata should cover: normativity (error possibility), determinacy, causal robustness (handling Swampman), historical versus current role, and multiple realization across biological and artificial systems. I notice cases three and four directly attack the historical component of teleosemantics - that's where the theories will bleed.

  Ah! The predator/shadow case is particularly nasty for pure etiological views. If a state co-varies with both predator and shadow but only predators shaped the selection history, what determines whether it represents "predator" or "predator-or-shadow"? Millikan would say it's indeterminate but that feels unsatisfying. And case four (repurposed states) shows current function and historical function can diverge - which should "win"?

  *checks notes* I should flag that Determinacy and Historical Grounding might be incompatible under etiological views. That's the central tension. Also, Causal Robustness directly contradicts Historical Necessity - Swampman forces that choice. The user was right to suspect irreconcilable desiderata.

  For the graduate students, I'll emphasize that the predator/shadow case does the most damage to standard teleosemantics. It's not just an edge case - it questions whether selection history can ever provide sufficient determinacy. And if we drop etiological requirements, we lose the clean explanation of normativity that made teleosemantics attractive in the first place. That's the philosophical knot.

  *double-checks* Oh, and I mustn't forget artificial systems - if a neural net develops detector states through backpropagation rather than natural selection, can it have genuine content? That tests whether teleosemantics is too biologically parochial. The user's case five is well-chosen to pressure that boundary.

  Finally, I'll be blunt about etiological theories' limitations per their request: they struggle with cases 3-5. The elegance of grounding content in selection history comes at the cost of determinacy and flexibility. Alternative approaches like inferential role semantics avoid history but struggle with normativity. There's no free lunch - that's what makes this seminar-worthy.
answer: |-
  Here is a rigorous set of desiderata for naturalizing intentional content, structured to handle your seminar cases and expose core tensions. Each requirement is motivated by a specific challenge and rules out prominent theoretical moves.

  ---

  ### **Core Desiderata for Naturalizing Intentional Content**

  1.  **Normativity of Error (Misrepresentation Requirement)**  
      *Requirement:* The theory must explain how a state can *mis*represent — i.e., be tokened when its content is false — and why this counts as an *error* (not just a different content).  
      *Motivation:* Ordinary cases (e.g., seeing a stick as a snake). Rules out mere co-variance theories (e.g., crude indicator semantics).  
      *Work it does:* Rules out Fodor's asymmetric dependence (without teleology) and purely informational theories. **Non-negotiable.**  
      *Seminar Case:* #1 (Ordinary error).

  2.  **Determinacy of Content**  
      *Requirement:* The theory must explain why a state has a *specific* content (e.g., "predator") rather than a disjunction ("predator or shadow"), a superordinate category ("danger"), or an indefinite set of correlates.  
      *Motivation:* State S co-varies with both predators and shadows (Case #3). Rules out ambiguity/indeterminacy as default.  
      *Work it does:* Challenges teleosemantics (Millikan, Neander) and causal-informational accounts. **Non-negotiable.**  
      *Seminar Case:* #3 (Predator/Shadow Covariance).

  3.  **Causal Robustness (Swampman Adequacy)**  
      *Requirement:* The theory must either ascribe content to a molecule-for-molecule duplicate with no history (Swampman) or explain why it *lacks* content without appealing to intuitions alone.  
      *Motivation:* Davidson's Swampman (Case #2) tests whether content depends *essentially* on history.  
      *Work it does:* Rules out strict etiological theories (Millikan, Papineau) if Swampman has content. Forces non-historical resources (e.g., structure, dispositions). **Camp-dependent:** Non-negotiable for anti-historicists; historicists reject Swampman's content.

  4.  **Historical vs. Current Function Resolution**  
      *Requirement:* The theory must resolve conflicts between a state's *evolutionary history* and its *current functional role* when they diverge.  
      *Motivation:* Exaptation/neural reuse (Case #4): A state selected for detecting light (in ancestors) now controls flight (in descendants).  
      *Work it does:* Tests whether "function" is etiological (Millikan) or systemic (Cummins). Rules out theories that cannot prioritize one function or hybridize them. **Non-negotiable.**  
      *Seminar Case:* #4 (Repurposed State).

  5.  **Non-Biological Realization**  
      *Requirement:* The theory must explain content in systems shaped by non-evolutionary processes (e.g., learning, artificial design).  
      *Motivation:* AI trained via gradient descent (Case #5); Pavlovian conditioning. Rules out theories requiring natural selection.  
      *Work it does:* Challenges pure bio-teleosemantics. Requires extension to general "design" or learning. **Non-negotiable for full naturalization.**  
      *Seminar Case:* #5 (Non-selection processes).

  6.  **Distinction: Representation vs. Mere Causal Mediation**  
      *Requirement:* The theory must distinguish states that *represent* X from states that are merely *caused by* X or *reliably correlate* with X, without representing it (e.g., tree rings correlate with age but don't "represent" it).  
      *Motivation:* Avoids pan-representationalism. Rules out pure covariation (Dretske's early work).  
      *Work it does:* Requires a criterion beyond correlation (e.g., functional role, normativity). **Non-negotiable.**

  7.  **Distinction: Content vs. Reference/Extension**  
      *Requirement:* The theory must distinguish what a state *represents* (content) from what *causes* it or what it *applies* to (extension). E.g., "unicorn" has content but null extension.  
      *Motivation:* Empty concepts, functional vs. tracking roles. Rules out referentialism.  
      *Work it does:* Requires intensional specification (e.g., mode of presentation). **Non-negotiable.**

  8.  **Distinction: Representation vs. Adaptive Response**  
      *Requirement:* The theory must distinguish a state *having content* from an organism merely *behaving adaptively* toward a stimulus (e.g., a tropism).  
      *Motivation:* Plants orient to light without representing "light". Rules out behaviorist reductions.  
      *Work it does:* Requires criteria for "aboutness" beyond disposition to act. **Non-negotiable.**

  ---

  ### **Key Tensions & Trade-offs**

  1.  **Determinacy vs. Historical Grounding (Cases #3 & #4):**  
      Etiological functions (Millikan) struggle with determinacy in predator/shadow cases (#3): If selection only targeted predators, does S represent "predator" (ignoring shadows) or the disjunction? Current-role theories (e.g., Cummins) handle repurposing (#4) but struggle with error (#1) and determinacy (#3).

  2.  **Normativity vs. Causal Robustness (Cases #1 & #2):**  
      Etiology cleanly explains normativity (#1) but denies Swampman (#2) content. Non-historical theories (e.g., Fodor, connectionist) grant Swampman content (#2) but struggle to ground normativity (#1) without teleology.

  3.  **Biological Privilege vs. Generality (Case #5):**  
      Bio-teleosemantics rules out AI/learning (#5). Non-biological theories (e.g., inferential role) handle #5 but may lack resources for determinacy (#3) and error (#1).

  ---

  ### **Critical Assessment of Etiological Teleosemantics**
  - **Can it satisfy all desiderata?** **No.** It struggles acutely with:  
    - **Case #3 (Predator/Shadow):** Cannot deliver determinate content without ad-hoc disjunctivism.  
    - **Case #2 (Swampman):** Denies content counterintuitively.  
    - **Case #5 (Non-selection):** Cannot explain learning/AI content without stretching "function" beyond recognition.  
  - **Case #4 (Repurposing)** is surmountable if current function dominates (e.g., Shea's *inherited* functions), but this weakens the historical commitment.

  ### **Most Excluding Requirement**  
  **Determinacy (#2)** is the killer. It forces theories to choose between:  
  - Historical causes (risks disjunctive content in #3)  
  - Current causes (risks normativity gaps in #1)  
  - Structural/inferential roles (risks Swampman denial in #2 or AI exclusion in #5).

  ### **Revising Without Etiology**  
  Dropping history necessitates grounding normativity elsewhere:  
  1. **Inferential/conceptual role semantics:** Uses computational/inferential relations. Solves #2, #4, #5 but struggles with #1 (error) and #3 (determinacy).  
  2. **Success semantics:** Ties content to behavioral success. Solves #1 but conflates content with utility (fails #6, #8).  
  3. **Structural representation (O’Brien, Opie):** Exploits isomorphism. Solves #2, #5 but struggles with abstract concepts and error (#1).  

  **Result:** No approach cleanly satisfies all desiderata. The tension between **historical grounding** (for normativity/determinacy) and **causal robustness/generality** (for Swampman/AI) defines the field. Your seminar should foreground this to avoid "checklist" thinking.  

  **Recommendation:** Frame the desiderata as competing pressures forcing trade-offs. Assign groups to defend/attack theories using Cases #2–5 as stress tests, focusing on which desiderata they sacrifice.
