  First, I need to recall relevant linguistic theories. Austin's performatives come to mind, but they require felicity conditions at the time of utterance, which doesn't fit since the effect here happens later. Grice focuses on speaker intention, which is the opposite of what's described. Conversation Analysis (CA) looks at adjacency pairs where the next turn defines the prior, but it's more about analysis than obligation. 

  The user mentions the temporal aspect: the act is assigned after the fact by the audience, including bystanders. The normative load creates obligations, and it's irreversible. The three examples all share this pattern. 

  Looking for existing concepts, discourse pragmatics might be relevant. Entextualization is when speech is taken out of context and gains new meaning. But that's about decontextualization, not the retroactive assignment of acts. Illocutionary uptake is close—how the hearer interprets the speech act. But usually, that's immediate, not delayed. 

  Maybe a combination of concepts? Entextualization plus illocutionary uptake? Institutional power dynamics play a role too, especially in the third example where a senior's musing becomes policy. The bystander effect and record-keeping (minutes) are factors. 

  The user's questions: Is this ambiguity plus social pressure? Probably not, since ambiguity isn't necessary. For an utterance to be invulnerable, it might need explicit framing and immediate ratification, but that's tricky. Records can entrench the reinterpretation but aren't necessary. Bystanders can influence, especially in institutional settings, so it's part of the same phenomenon. Promises are vulnerable because the promisee's acceptance defines the commitment, aligning with illocutionary uptake theories. 

  So, no single term exists. The core is retroactive illocutionary force assignment via uptake and entextualization. Power dynamics and institutional contexts facilitate this. The three cases are manifestations of the same underlying mechanism, differing in context but sharing the retroactive normative assignment. Coining a term like "Retroactive Illocutionary Force Assignment" (RIFA) could encapsulate this. 

  The user needs clarity on whether it's one phenomenon. Yes, it's uptake plus entextualization plus power. They should explore CA, institutional discourse, and entextualization literature. Addressing their deeper need: understanding how their experiences fit into linguistic theory, validating their observation, and guiding their research direction.
answer: |-
  Based on your description, you're observing **a distinct pattern combining elements of illocutionary force assignment, entextualization, and institutional power dynamics**, but there isn't a single established term for *the precise constellation* you've identified. Your cases aren't just ambiguity + social pressure; they represent **the retroactive, audience-driven determination of an utterance's normative consequences, overriding speaker intent**. Here's a breakdown:

  ### The Core Phenomenon: Retroactive Illocutionary Force Assignment (RIFA)
  This isn't standard terminology, but it captures your key insight: **the illocutionary force (the "act" performed) is fixed *after* the utterance, by the audience/bystanders, creating irreversible normative commitments.**

  *   **Boundaries:** It applies when:
      1.  The speaker's intended force is vague, hedged, or provisional.
      2.  The audience (including non-addressees) interprets/recontextualizes it as a stronger, more binding act (promise, commitment, policy declaration, insult).
      3.  This reinterpretation gains social/institutional traction.
      4.  Normative consequences (obligations, accusations, policies) solidify based on the *audience's* assigned force, not the speaker's intent.
      5.  The speaker's attempts to clarify are ineffective or counterproductive.

  ### Why Existing Concepts Don't Fully Capture It
  1.  **Austin's Felicity Conditions:** Focus on *preconditions* at utterance time (authority, procedure), not the *retroactive determination* of force by uptake.
  2.  **Gricean Intention:** Centers speaker meaning, opposite to your observation of audience dominance.
  3.  **CA's Next-Turn Proof Procedure:** An *analytical* tool showing how participants *display* their understanding *sequentially*. It doesn't inherently address the *normative bindingness* or the *retrospective solidification* of force *against* speaker intent, especially across multiple turns or by non-addressees.
  4.  **Illocutionary Uptake (Searle-ish):** Often assumes uptake confirms/realizes speaker intent, not subverts it. Your cases show uptake *redefining* intent.
  5.  **Entextualization (Silverstein & Urban):** Crucial! This is the process of lifting discourse out of its original context, making it a "text" that can be re-used and re-interpreted (e.g., minuting the musing, recounting the "deadline" or the "joke"). **Entextualization enables RIFA** by providing a decontextualized "record" that can be assigned new force. But entextualization alone doesn't guarantee the *normative loading* or the *overriding of intent*.

  ### Addressing Your Specific Questions

  1.  **Ambiguity + Social Pressure or Genuinely Different?**
      *   **Different.** Ambiguity provides the *opportunity*, but RIFA is about the *mechanism* and *outcome*. Social pressure is a *tool* used within RIFA. The genuine difference is the **retroactive assignment of binding illocutionary force by the audience, institutionalizing a new interpretation**.
      *   **Invulnerable Utterances?** Truly invulnerable ones are rare. Utterances with:
          *   **Explicit Performatives:** "I hereby promise..." (though even these can be contested/misinterpreted later).
          *   **Immediate Ratification:** Explicit, on-record agreement/disagreement *in the moment* defining the force ("So, that's a promise for the 30th?" "Yes.").
          *   **High Contextual Precision:** Utterances so unambiguous and contextually saturated that recontextualization is nearly impossible (very rare in complex social/institutional settings).
          *   **Lack of Entextualization Potential:** Fleeting, unrecorded remarks with no audience motivated to reinterpret or act.

  2.  **Does it Need a Record?**
      *   **No, but it helps immensely.** RIFA thrives in institutional settings *because* records (minutes, emails, group chats) facilitate entextualization and provide an "objective" text for reinterpretation. However, it happens orally:
          *   Gossip chains reinterpreting an event (your joke).
          *   Verbal commitments becoming "common knowledge" in a lab (your deadline).
          *   Oral traditions solidifying interpretations. **The record amplifies and entrenches RIFA but isn't strictly necessary.** Social memory and narrative suffice.

  3.  **Bystanders vs. Addressees: Same Phenomenon?**
      *   **Same Core Mechanism, Different Dynamics.** The core process (retroactive force assignment by audience) is the same. However:
          *   **Bystanders:** Often drive RIFA in institutional/policy contexts (Case 3). Their power comes from roles (minute-taker, senior colleague), access to records, or collective narrative-building. They weren't the target, so their interpretation isn't constrained by direct interaction.
          *   **Addressees:** Drive RIFA in interpersonal commitments/conflicts (Cases 1 & 2). Their power comes from being the "victim"/"beneficiary" (promisee, offended party). Their uptake is direct but can still override intent.
      *   **Why it feels different:** Bystander-driven RIFA often feels more like institutional capture or policy drift, while addressee-driven RIFA feels more like interpersonal miscommunication escalating into commitment/blame.

  4.  **Why Promises are the Worst Case?**
      *   **You're exactly right.** Promises are uniquely vulnerable to RIFA because of their inherent structure:
          *   **Uptake is Constitutive:** A promise isn't fully formed until the promisee recognizes it *as* a promise (Searle). This gives the promisee immense power in defining what constitutes recognition/acceptance.
          *   **Normative Weight:** Promises create strong obligations. Once RIFA assigns "promise" status, the normative burden is heavy.
          *   **Hedging is Common:** Promises are often hedged ("I'll try," "probably"), creating the ambiguity RIFA exploits.
          *   **Asymmetry:** The speaker initiates, but the promisee (and bystanders) ultimately define the commitment's scope and bindingness through their uptake and subsequent actions. **You don't have less authority *over your intent*; you have less control over *how your utterance is taken up and institutionalized as a binding act*.** The speaker's authority is contingent on audience ratification, which RIFA bypasses or redefines.

  ### Conclusion: One Phenomenon, Three Contexts
  You *are* looking at **one core phenomenon** – **Retroactive Illocutionary Force Assignment (RIFA)** – manifesting in three contexts:
  1.  **Interpersonal Commitment (Deadline):** Hedged statement → Addressee/bystanders entextualize as commitment → Normative obligation solidifies.
  2.  **Interpersonal Conflict (Joke):** Failed humor → Addressee/bystanders entextualize as insult + cover-up → Normative accusation solidifies.
  3.  **Institutional Policy (Musing):** Tentative remark → Bystanders (minute-taker, others) entextualize as policy proposal/decision → Normative policy solidifies.

  **Key Drivers:** Entextualization, audience (addressee/bystander) interpretation power, institutional/social structures enabling reinterpretation to "stick," the inherent ambiguity/vagueness of much speech, and the normative consequences of certain illocutionary acts (promises, declarations, accusations).

  ### Where to Look Next (Beyond the Classics)
  *   **Entextualization & Recontextualization:** Silverstein & Urban (eds.), *Natural Histories of Discourse*; Bauman & Briggs, *Voices of Modernity*.
  *   **Institutional Discourse & Power:** Drew & Heritage (eds.), *Talk at Work*; Sarangi & Slembrouck, *Language, Bureaucracy and Social Control*.
  *   **Miscommunication & Conflict:** Grimshaw (ed.), *Conflict Talk*; Tannen, *That's Not What I Meant!* (More pop, but insightful).
  *   **Accountability in Interaction:** Antaki & Widdicombe (eds.), *Identities in Talk*; Edwards & Potter, *Discursive Psychology* (examines how descriptions become "facts").
  *   **Speech Act Theory Revisited:** Look at critiques and developments focusing on uptake, negotiation, and the role of the hearer (less Searle, more CA/pragmatics approaches).

  Your observation is astute. While RIFA isn't a formalized term, you've pinpointed a crucial gap in how standard models handle the *temporal delay* and *audience power* in fixing the consequential meaning of utterances. This has significant implications for understanding accountability, institutional power, and the fragility of intention in social interaction. Run with it!
