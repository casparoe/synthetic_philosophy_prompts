  ## The Clearing at Józefów (Pantoum of the Reservist)

  We wore the same feldgrau, five hundred strong.
  The Major said we could refuse the task.
  The orders were not old, the march not long.
  Our rifles held a cold, familiar weight.

  The Major said we could refuse the task.
  (No one spoke against it, not a sound).
  Our rifles held a cold, familiar weight.
  We'd never fired at men before that day.

  (No one spoke against it, not a sound).
  The thought was always there, beneath the skin.
  We'd never fired at men before that day.
  No special hate was needed, just the clearing.

  The thought was always there, beneath the skin:
  *This is the work we're shaped for, deep and true.*
  No special hate was needed, just the clearing,
  The uniforms, the orders coming through.

  *This is the work we're shaped for, deep and true.*
  No consequence for stepping from the line?
  The uniforms, the orders coming through...
  A dozen stepped aside. The rest were mine.

  No consequence for stepping from the line?
  The orders were not old, the march not long.
  A dozen stepped aside. The rest were mine.
  We wore the same feldgrau, five hundred strong.

  ---

  **Annotations & Execution:**

  1.  **Form as Argument:** The pantoum's relentless circling mirrors the trapped psychology and the inescapable return to the deed. Lines shift meaning with each repetition:
      *   *"The Major said we could refuse the task."* First: A factual statement of the offer (Browning's situation). Later: An indictment of the choice *not* to refuse (Goldhagen's character/culture).
      *   *"No one spoke against it, not a sound."* First: Describes group silence (situational conformity). Later: Implies internal acceptance/complicity (characterological willingness).
      *   *"We wore the same feldgrau, five hundred strong."* Opening: Camaraderie, anonymity of the group (Browning). Closing: Accusation of collective guilt enabled by conformity (Goldhagen).

  2.  **The Concrete Turn (The Offer):**
      *   Explicitly stated in Stanza 1 & 2: "The Major said we could refuse the task."
      *   Its significance deepens: The parenthetical "(No one spoke against it, not a sound)" (Stanza 2/3) highlights the *unspoken* refusal to use the opt-out.
      *   The pivotal question: "No consequence for stepping from the line?" (Stanza 5) – Browning's key point (no penalty) becomes a damning question *why* so few stepped out, pointing to Goldhagen's internal motivation.
      *   The stark result: "A dozen stepped aside. The rest were mine." (Stanza 5/6) – The speaker's personal ownership ("mine") emerges directly from the choice presented by the offer.

  3.  **Fusing Browning & Goldhagen:**
      *   **Browning's Situational Factors:** "five hundred strong," "same feldgrau," "orders coming through," "clearing," "no consequence," the sheer novelty ("never fired at men before"). The group dynamic and obedience pressure are palpable.
      *   **Goldhagen's Characterological/Cultural Factors:** "The thought was always there, beneath the skin," "*This is the work we're shaped for, deep and true*" (italicized as internalized belief), "No special hate was needed" (implying the hate was already present/baked-in), the overwhelming *failure* to step out despite no penalty. The culture shaped desire.
      *   **Fusion in the Close:** The final couplet recycles the opening lines. "The orders were not old, the march not long" (situation) now precedes "A dozen stepped aside. The rest were mine" (personal choice/ownership). The final line "We wore the same feldgrau, five hundred strong" now resonates with the *cultural identity* that shaped willingness ("shaped for") as much as the situational anonymity.

  4.  **Accessibility:**
      *   For the **informed reader**: The references to the battalion size, the offer, the location (Józefów), the internal conflict, and the competing explanations are clear.
      *   For the **uninformed reader**: The poem stands as a haunting monologue of a man grappling with complicity in atrocity. The imagery (clearing, uniforms, rifles, the offer, the few who stepped aside) builds a concrete scene. The internal conflict ("thought beneath the skin," "shaped for," the weight of "mine") and the cyclical form create palpable tension and unresolved guilt. The focus on the *choice presented by the offer* provides a clear dramatic focal point.

  The pantoum's structure forces the excuses ("same uniform," "orders," "could refuse") to return as evidence of complicity and ingrained cultural conditioning, achieving the demanded fusion without simplistic resolution.
