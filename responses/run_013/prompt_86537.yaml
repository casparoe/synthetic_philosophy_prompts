answer: |-
  ## The Truth Norm: Can Deflationism Bear Its Weight?

  We live by truth. We demand it in testimony, condemn its absence in lies, and structure our inquiries around its pursuit. Yet what *is* this truth we chase? Deflationists offer a disarmingly simple answer: truth isn't a deep, mysterious property connecting our thoughts to reality. To call a claim "true" is just to endorse it, a linguistic shorthand allowing us to agree ("Yes, that's true") or generalize ("All his predictions were true"). Truth, on this view, does no heavy lifting. The real work is done by the specific beliefs themselves – why we hold them, what evidence supports them, what actions they cause. The grand questions about correspondence to reality or coherence within a system are, deflationists argue, illusions generated by misunderstanding how the word "true" functions.

  But suppose we accept this deflationary account of the *property* of truth. Can we simultaneously insist that the *norm* of truth – the imperative to believe and assert only what is true – remains something robust, substantive, irreducible, and genuinely explanatory? This proposed split aims to preserve the deflationary insight while acknowledging the undeniable weight truth seems to bear in guiding our intellectual lives. Can this division of labor hold? Or does the substantive norm inevitably resurrect the substantive property the deflationist sought to banish? Let's weigh the case.

  **The Promise of the Split: A Thin Property, A Robust Norm**

  The advocate for the split argues that deflationism correctly diagnoses the *property* but misses the *normativity*. The predicate "is true" is indeed a tool for expression and generalization, lacking explanatory depth. However, the *rule* governing our intellectual practices – "Believe only what is true," "Assert only what is true" – is a different beast entirely. This norm, they insist, is:

  1.  **Substantive:** It's not merely an expression of preference or current standards; it carves inquiry at a fundamental joint, setting a unique, objective target.
  2.  **Irreducible:** It cannot be fully explained away as merely the injunction to believe what is warranted by current evidence (we can have warrant for false beliefs) or what is useful (truths can be harmful, falsehoods beneficial). It stands apart.
  3.  **Explanatory:** This norm, and *only* this norm, explains:
      *   Why inquiry is teleological: It aims *at something* – truth – rather than being a directionless flailing.
      *   The distinctive wrong of lying: A lie isn't just a false assertion; it's a *deliberate violation* of the truth norm. A merely false statement might be an honest mistake, violating only an evidential norm.
      *   Why assertion isn't just noise-making: It commits the asserter to a standard beyond social acceptability or personal conviction.

  The deflated property serves merely to *label* the target the norm sets. The norm itself, however, is a fundamental rule of the "game" of belief and assertion, giving the practice its distinctive point and structure. One can use a thin, expressive tool ("true") to mark the bullseye without the bullseye itself being thin or non-substantive.

  **Skepticism: Can the Norm Survive Deflation?**

  Despite its appeal, this split faces powerful challenges. Can a norm built upon a deflated foundation bear the weight placed upon it?

  1.  **The Problem of Empty Endorsement:** If "is true" is fundamentally an expression of endorsement, then the norm "Believe only what is true" seems to collapse into "Believe only what you endorse." This is vacuous. It provides no guidance *towards* truth; it only tells you to believe what you *already* take to be true. It cannot explain the *aim* of inquiry because it offers no criterion beyond current commitment. If truth is just what I endorse when I endorse it, the norm loses its grip as an external standard. How can it guide me *to* a target if the target is defined solely by my hitting it? The defender might retort that the norm governs *future* belief and assertion, pushing us towards endorsing propositions that *will* meet our standards. But this merely pushes the question back: what makes those future standards *truth*-tracking, if truth is just endorsement by those very standards? The norm seems parasitic on a more substantive notion of correctness that deflationism denies.

  2.  **The Challenge from Alternatives (Knowledge/Warrant/Utility):** Is the truth norm genuinely irreducible and uniquely explanatory? Consider the alternatives:
      *   **Knowledge:** Perhaps the core norm is "Assert only what you know." Knowledge entails truth but adds justification. This explains the wrong of lying (you *know* it's false), the termination of inquiry (you know P, so no need to inquire further about P), and the distinctive commitment of assertion (you present yourself as knowing). Truth alone seems insufficient – asserting a truth you don't believe or have no reason for is also problematic.
      *   **Evidential Warrant:** Perhaps the norm is "Believe/assert only what is sufficiently warranted by your evidence." This explains why we stop inquiring (we have sufficient warrant), condemns assertions made without evidence (lying is a subset of this), and provides a clear target for inquiry (gathering evidence). The truth norm seems redundant; we follow evidential norms *because* we think (or hope) they lead to truth, but the real work is done by warrant.
      *   **Social/Pragmatic Costs:** Perhaps the injunction against lying is primarily about trust and social coordination. The wrong is breaking a vital social convention, not violating an abstract truth relation. The "target" of inquiry is achieving beliefs that are reliable guides for action and social harmony, not truth *per se*. Truth seems epiphenomenal.

  If these alternatives can explain the phenomena the truth norm is supposed to uniquely explain – the aim of inquiry, the wrong of lying, the nature of assertion – then positing a substantive truth norm becomes unnecessary. Deflationism about the property then seamlessly extends to the norm.

  3.  **The Norm as Mere Convention:** Even if we observe a widespread practice of condemning lies and valuing true belief, is this evidence of a *substantive, irreducible* norm tied to truth? Could it simply be a deeply ingrained convention of our particular linguistic and epistemic practices? We might play a game where the rule is "say only red things," and violations are punished. This rule is substantive *within the game*, but it doesn't point to a deep property "redness" possessed by propositions. Perhaps the "truth norm" is analogous – a real rule governing *our* practice of assertion, but not grounded in anything metaphysically deep about truth itself. It could be explained by evolutionary pressures, social utility, or psychological quirks. On a deflationary view, what resources are left to insist this convention taps into something uniquely fundamental about truth as opposed to other possible conventions?

  **The Defense: Aiming at the Bullseye**

  Despite these attacks, the defender of the split has resources:

  *   **Marking the Target:** Even if the property is thin, the norm "Believe only what is true" sets a *formal target*. It tells inquiry: *whatever* your specific methods and evidence, your goal is to land on propositions that *merit* the label "true" (i.e., propositions you can endorse). This formal target distinguishes inquiry from mere brainstorming or storytelling. The thin property provides the necessary label for the goalpost, even if the goalpost isn't metaphysically hefty.
  *   **The Termination Problem:** Why does inquiry stop? Evidential warrant might seem sufficient – we stop when we have enough evidence. But warrant is always provisional and potentially defeasible. Evidence can mount indefinitely. Truth, even deflated, offers a *finality* that warrant lacks. We stop *because* we take ourselves to have reached the truth – we take ourselves to be in a position to endorse the proposition definitively (even if we are sometimes wrong). The norm "believe the truth" points to this state of settled endorsement as the ideal endpoint, explaining why we don't perpetually seek *more* evidence for propositions we already firmly believe to be true (i.e., endorse). Knowledge also offers finality, but knowledge *presupposes* truth. The defender argues truth provides the most fundamental stopping point.

  **The Verdict: The Split Collapses**

  While the split is conceptually alluring, the skeptical pressures prove too strong. **The attempt to maintain a deflationary property alongside a substantive norm is ultimately unstable.** The norm "Believe/assert only what is true" cannot bear the substantive weight placed upon it if the predicate "true" carries only deflationary meaning.

  The fatal flaw lies in the **explanatory demands** placed on the norm. To genuinely *explain* the unique wrong of lying, the teleology of inquiry, and the nature of assertion as distinct from noise-making, the norm must invoke something more than just the expressive function of "is true." It needs a notion of *correctness* that transcends current endorsement or evidential warrant. It needs the idea that beliefs and assertions are answerable to *how things are*, independently of our evidence or conventions. But this is precisely the substantive notion of truth – correspondence, or something akin to it – that deflationism rejects.

  *   The "empty endorsement" problem shows the norm is inert without a substantive target.
  *   The "alternatives" challenge (especially from knowledge) demonstrates that the work attributed to the truth norm can be done by concepts that either incorporate truth or render it redundant in practice.
  *   The "mere convention" possibility highlights that without a substantive truth property, the norm loses its claim to unique fundamentality.

  When we probe *why* violating the truth norm feels distinctively wrong, or *what* inquiry aims at, we find ourselves implicitly appealing to the very substantive notion of "fitting the world" that deflationism dismisses as illusory. The substantive norm, in its effort to *do* explanatory work, **quietly reinstates the substantive property.**

  **What Should Replace It?**

  If the split fails, which half gives way? Deflationism about the *property* is the weaker link. While its analysis of the *word* "true" is compelling, it cannot account for the profound *normative role* truth plays. We must acknowledge a minimally substantive conception of truth – not necessarily a full-blown correspondence theory, but *at least* the idea that truth involves a kind of *correctness* or *fittingness* to a reality independent of our beliefs and linguistic practices. This "fittingness" is what the norm invokes and what gives it its force.

  The alternative norms proposed (like knowledge) don't eliminate truth; they *incorporate* it. Knowledge is justified *true* belief. The wrong of lying centrally involves *knowing* you are asserting something *false* (i.e., not fitting the world). Inquiry aims at knowledge, which inherently includes truth as its objective component.

  Therefore, we should reject the radical deflationist claim that truth does *no* explanatory work. While much can be explained by belief content and evidence, **the unique normative force governing belief and assertion – the standard that makes aiming at the world possible and gives lies their distinctive character – requires a truth that is more than just an expressive device. It requires truth as a substantive standard of correctness.** To bear the weight we place on it, truth cannot be entirely deflated. The norm reveals the property's necessary depth.
