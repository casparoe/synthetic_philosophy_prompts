            1. Respect decisiveness: the social ranking must have a > b (because of Person1) and b > c (because of Person2).
            2. Unanimity: If both of you agree on the ranking of a pair, then the social ranking must have that. (For the pair (c,a): both have c > a, so society must have c > a.)
            3. Consistency: The social ranking must be transitive and complete.

