          This is the smallest case: two people, three alternatives.

          So we design the activity for groups of two. Since we have 16 students, we can have 8 groups.

          The activity:

            Step 1: Assign roles. Half the groups will have the above profile. 
                     In case we want to show it's not isolated, we can have a few different profiles, but one is enough.

            Step 2: Give each student their role card. Allow them to see their own preferences and decisiveness. 

            Step 3: Each student writes down their full ranking on a piece of paper (commit).

            Step 4: The group is to try to write down a social ranking that respects:
                     - The decisiveness conditions (for the assigned pairs, the social ranking must match the ranking of the decisive individual)
                     - Unanimity: if both agree on any pair, then that must be the social ranking for that pair.
                     - The social ranking must be complete and transitive (no cycles, and for every pair, it has a ranking).

            Step 5: They will hit the cycle.

          Then we debrief.

          What if they try to drop one of the conditions? We will discuss in the debrief.

          In the debrief, we explain the conditions that generate the paradox:

            - Unrestricted domain: We allowed any preferences? In this activity, we assigned specific preferences. But in reality, these preferences are allowed.
            - Pareto efficiency (unanimity): If everyone prefers X>Y, then X>Y in the social ranking.
            - Minimal liberalism: At least two individuals are decisive for at least one pair each.

          In our activity, we had:

            Condition 1: Minimal liberalism (two decisive individuals, each with one pair).
            Condition 2: Pareto efficiency (unanimity).
            Condition 3: Social ordering must be complete and transitive.

          The activity cannot reproduce the unrestricted domain condition fully because we only used one profile. We will have to explain that the theorem says that there exists at least one profile (like the one we used) that causes the problem, and since we want the social choice function to work for any preferences, we have a problem.

          Escape routes:

            - Drop unanimity: in the example, if we drop the unanimity condition for the pair (c,a), then we can have a social ranking a>b>c, and then we have a>c, which is what the transitivity from a>b and b>c gives, even though both individuals have c>a. 
              Cost: we might violate what everyone wants in some cases.

            - Refuse to count meddlesome preferences: In this case, the pair (c,a) is not in the private domain of either, but both have preferences on it. We might say that for pairs that are not in your private domain, you shouldn't have a say? But then how do we decide (c,a)? We might use a different rule, but then we might have a conflict with the ranking derived by transitivity.

            - Tolerate cycles: Then we might have a social ranking that is not transitive. In the example, we would have a>b, b>c, and c>a. This can lead to path-dependent outcomes: what if we choose between a and b first? a wins, then between a and c? c wins. But if we choose between b and c first? b wins, then between a and b? a wins. But if we choose between a and c first? c wins, then between c and b? b wins. So the winner depends on the order of voting.

          The feature that the activity cannot reproduce: The activity uses a specific profile that causes the cycle, but the theorem says that for any social choice function that satisfies unrestricted domain, Pareto, and minimal liberalism, there will be at least one profile that causes a cycle or a violation of transitivity. We will have to explain that in the debrief.

          Design choice that could fail: If the students try to use a social ranking that has a tie between a and c, then they might avoid the cycle. But Condition 3 (completeness) forbids ties? In our activity, we said the ranking must be complete, so they must choose between a and c. 

          If the students try to set the social ranking for (a,c) to a>c (based on the transitivity from a>b and b>c), then they violate unanimity (both individuals have c>a). If they set it to c>a, then they have a cycle because they also have a>c (from a>b and b>c and then a>c by transitivity) -> so c>a and a>c. 

          So hopefully they will see the cycle.

          Timeline for 90 minutes:

            0:00 - 0:15: Introduction to the activity and forming groups (8 groups of 2), distribute role cards.
            0:15 - 0:30: Students read their role cards and write down their preferences. Then within groups, they share their decisiveness and their ranking for their decisive pair. 
            0:30 - 0:50: Groups try to draft a social ranking that meets the three rules. (20 minutes)
            0:50 - 1:00: Groups report what happened (expectation: they hit a cycle).
            1:00 - 1:30: Debrief (30 minutes).

          What might go wrong the first time:

            - Students might not understand the task.
            - They might try to force a social ranking that violates one of the conditions and not realize it.
            - In the cycle, they might not see the cycle and just write down the social ranking as a>b and b>c and then separately c>a, and not notice the inconsistency with transitivity.
            - They might drop the completeness condition and leave (a,c) out, but the rules require completeness.

          To mitigate, we can have a worksheet that asks them to check each condition explicitly.

          Worksheet for the group:

            Step 1: Write down each member's preferences:

              Person1: 
                 a vs b: 
                 a vs c: 
                 b vs c: 

              Person2: 
                 a vs b: 
                 a vs c: 
                 b vs c: 

            Step 2: Apply decisiveness:
                 For the pair (a,b): the social ranking must be: _______ (because Person1 is decisive and has a>b? or b>a? -> they should write what their role card says)
                 For the pair (b,c): the social ranking must be: _______ 

            Step 3: Apply unanimity (if any): 
                 For each pair, check if both have the same ranking. For example, for (a,c): both have c>a? -> then write the social ranking for (a,c) must be c>a.

            Step 4: Now, try to write down the full social ranking. It should be a complete ranking of a, b, c.
                     Check for transitivity: if the social ranking has a>b and b>c, then it must have a>c.

            Step 5: Does it work? If not, what is the problem.

          In the debrief, map onto the conditions:

            - The decisiveness -> minimal liberalism.
            - The unanimity condition -> Pareto efficiency.
            - The consistency condition -> requirement of a complete and transitive social ordering.

          Distinguish between acyclic and well-defined choices: 
            - In the activity, we required a complete and transitive social ordering, which is stronger than just having a well-defined choice function (which might be acyclic but not necessarily transitive, or might use a different method like picking a winner by majority without a full ranking). 
            - However, note that the social ordering being complete and transitive is a common requirement in social choice theory (like in Arrow's theorem).

          Escape routes and their costs:

            - Dropping unanimity: we might end up with a social ranking that goes against what everyone wants in some pairs.
            - Refusing to count meddlesome preferences: we might not allow individuals to have a say on issues that affect them (even if they are not the owner) and might lead to outcomes that are not Pareto efficient.
            - Tolerating cycles: then the social choice might depend on the order of voting or might be unstable.

          The activity might not convey the full generality of the unrestricted domain condition. We will explain that in the debrief: the function should work for any preferences, and we found one profile where it fails, so it's not a general procedure.

          The design choice that could fail: if the students are not able to see the cycle, then the activity fails. To ensure they see it, the worksheet should have step 4 that forces them to write down the social ranking and then explicitly check for transitivity and completeness.

          Let's hope it works.
