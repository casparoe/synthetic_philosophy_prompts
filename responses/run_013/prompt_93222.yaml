  ### In-Class Activity: The Preference Puzzle
  **Objective:** Students experience Sen's liberal paradox firsthand by designing a social choice procedure that seems fair but leads to a contradiction.

  **Group Setup:**  
  - Divide 16 students into 8 groups of 2.  
  - **Roles in each group:**  
    - **Person 1:** Decisive over the pair (a, b).  
    - **Person 2:** Decisive over the pair (b, c).  
  - **Alternatives:** Three social states:  
    - **a:** Person 1’s preferred outcome on their private issue.  
    - **b:** A compromise outcome.  
    - **c:** Person 2’s preferred outcome on their private issue.  

  **Materials (per group):**  
  - **Role Cards** (distribute secretly):  
    - **Person 1’s Card:**  
      *"You control the ranking of a vs. b. Your preferences:  
      - c > a (you dislike a compared to c)  
      - a > b (you prefer a over b)  
      Full ranking: c > a > b"*  
    - **Person 2’s Card:**  
      *"You control the ranking of b vs. c. Your preferences:  
      - b > c (you prefer b over c)  
      - c > a (you dislike a compared to c)  
      Full ranking: b > c > a"*  
  - **Worksheet:**  
    1. Write your personal rankings:  
       | Person | a vs. b | a vs. c | b vs. c |  
       |--------|---------|---------|---------|  
       | 1      | a > b   | c > a   | a > b   |  
       | 2      | b > a   | c > a   | b > c   |  
    2. Apply decisiveness: Social ranking must have:  
       - a > b (because Person 1 says so)  
       - b > c (because Person 2 says so)  
    3. Apply unanimity: For which pairs do both agree?  
       - (a, c): Both prefer **c > a** → Society must have **c > a**.  
    4. Now, draft a complete social ranking (transitive and without ties).  

  **Timeline (90 minutes):**  
  1. **Introduction (10 min):** Explain roles, alternatives, and rules. Emphasize privacy of preferences.  
  2. **Commit Preferences (10 min):** Students write personal rankings on worksheets (no group discussion yet).  
  3. **Group Work (25 min):** Groups try to draft a social ranking meeting:  
     - **Rule 1:** Respect decisiveness (Person 1 decides a vs. b; Person 2 decides b vs. c).  
     - **Rule 2:** Unanimity binds (if both agree on any pair, it must be society’s ranking).  
     - **Rule 3:** Society’s ranking must be consistent (transitive and complete).  
  4. **Group Reports (15 min):** Groups share outcomes. Most will hit a contradiction.  
  5. **Debrief (30 min):** Reveal the paradox, map to theory, and discuss escape routes.  

  **Scoring (no money needed):**  
  - **Success Metric:** Groups earn points by identifying which rule(s) cause failure.  
    - 1 pt: Correctly pinpoint the cycle.  
    - 1 pt: Propose a coherent escape route.  
  - **Group Competition:** Groups vote for the clearest explanation (winner gets recognition).  

  ### Predictable Challenges on First Run  
  1. **Misunderstanding Transitivity:** Students may list pairwise rankings (a > b, b > c) but miss that transitivity implies **a > c**—which contradicts **c > a** from unanimity.  
  2. **Incomplete Checks:** Groups might enforce decisiveness/unanimity but skip verifying transitivity, missing the cycle.  
  3. **"Tie" Cop-Out:** Some may try to rank a and c as equal to avoid conflict, violating completeness.  
  4. **Blame Game:** Students may accuse partners of "irrational" preferences rather than seeing systemic failure.  

  ---

  ### Debrief: Mapping the Paradox  
  **The Liberal Paradox (Sen’s Theorem):**  
  - **Conditions that generate the paradox:**  
    1. **Unrestricted Domain:** Any preferences allowed (you assigned specific ones, but real-world preferences vary).  
    2. **Pareto Efficiency (Unanimity):** If all prefer X > Y, society must rank X > Y.  
    3. **Minimal Liberalism:** At least two people control one pair each (decisiveness).  
    4. **Collective Rationality:** Society’s ranking must be complete and transitive.  
  - **Activity Mapping:**  
    - Decisiveness → Minimal Liberalism.  
    - Unanimity rule → Pareto Efficiency.  
    - Drafting a full ranking → Collective Rationality.  

  **Acyclic vs. Well-Defined Choices:**  
  - **Activity Demand:** Full social *ordering* (transitive ranking).  
    - *Why?* You required a ranking of all alternatives (e.g., "a > b > c").  
    - **Problem:** Led to a cycle (a > b > c > a), violating transitivity.  
  - **Weaker Demand:** Well-defined *choices* (no ordering needed).  
    - Society could pick winners from subsets without a full ranking (e.g., "choose b from {a, b, c}").  
    - **Key Difference:** Avoids cycles by not requiring global rankings, but may be path-dependent (e.g., voting order matters).  

  **Escape Routes & Costs:**  
  1. **Drop Unanimity:**  
     - *How:* Ignore unanimous preferences (e.g., allow a > c despite both wanting c > a).  
     - **Cost:** Violates democracy—ignores shared interests.  
  2. **Refuse Meddlesome Preferences:**  
     - *How:* Restrict preferences (e.g., Person 1 can’t rank c; Person 2 can’t rank a).  
     - **Cost:** Paternalistic—denies people’s right to care about others.  
  3. **Tolerate Cycles:**  
     - *How:* Accept intransitive rankings (e.g., society can have a > b > c > a).  
     - **Cost:** Path-dependent outcomes (e.g., if voting on a vs. b first, a wins; if b vs. c first, b wins).  

  **Limitation of the Activity:**  
  - **Unrestricted Domain:** You assigned fixed preferences. In reality, the paradox arises because *any* procedure satisfying liberalism and Pareto fails for *some* preferences (here, you gave that critical profile). You must clarify: "This isn’t about your specific preferences—it’s about designing rules that work for *all possible* preferences."  

  **Critical Design Choice:**  
  - If students **blame the specific preferences** ("Person 2 is being stubborn!") instead of seeing the **rules** as flawed, the activity fails. Success hinges on them confronting the systemic impossibility: *"No matter how we tweak the ranking, we violate one rule!"*  

  **Instructor Script for Debrief:**  
  > "You hit a cycle: a > b (decisiveness), b > c (decisiveness), and c > a (unanimity). This is Sen’s paradox! Any fair-seeming procedure with these three rules will fail for some preferences. If we weaken the rules, we pay a price: drop unanimity and ignore consensus, restrict preferences and deny autonomy, or allow cycles and accept chaos. No escape is cost-free—social choice forces trade-offs."  

  By making students architects of the contradiction, they feel the paradox’s inevitability. The debrief then crystallizes why this is a deep dilemma, not just a "mistake" in their group.
