prompt: |-
  I'm on the board of a housing co-op, about 120 units that we collectively own, and we're about to vote on a twenty-year plan: a big loan to retrofit the building, which will raise everyone's monthly charges for years and lock in a layout we'll all have to live with. The fight isn't really about the plan, it's about who gets to vote on it. Right now only people who hold a share (current residents who bought in) can vote, but that seems arbitary to some of us. One board member says anyone whose life will be seriously affected should get a say — the people who rent from shareholder-members and actually live here, the guy who runs the ground-floor shop and depends on our foot traffic, even the neighbors on the block who'll have scaffolding and noise outside for two years. Another says no: only people who are actually bound by the rules we're voting on should vote, otherwise you let outsiders with no intention of staying stack the outcome. Then there's the future-member problem — whoever buys in three years gets stuck paying off this loan but obviously can't vote now. And someone floated weighting votes by how many years you expect to stay, so a recent buyer who plans to die here counts for more than someone selling next spring. Is there a principled way to decide who's in and who's out here, or is it just a line we pick and live with? I don't want "make sure everyone feels heard" — I want to know how you'd draw the line and how you'd defend it to the people left on the wrong side of it.
reasoning: |-
  Okay, let me unpack this user's dilemma. They're on the board of a 120-unit housing co-op facing a foundational vote about a twenty-year retrofit loan, but the real battle is over voting rights. The core tension is between democratic inclusion and responsible governance. 

  First, I need to map all stakeholders mentioned: shareholder-residents (current voters), non-shareholder tenants (renting from shareholders), the ground-floor shopkeeper, neighboring properties, and future buyers. Each has legitimate claims - tenants face rent hikes and disruption, the shopkeeper's livelihood depends on the building, neighbors endure construction nuisances, and future owners inherit debt without representation. But the counterargument is equally strong: unlimited inclusion could let transient or external actors decide long-term burdens for those who'll actually bear them.

  Hmm... the philosophical conflict here is between input legitimacy (hearing all affected) and output legitimacy (binding only those who consented). That's why the "bound by the rules" argument resonates - it's about constitutional coherence. But dismissing all external voices feels ethically incomplete. 

  I recall corporate governance models where equity holders vote because they bear residual risk. Translating that to co-ops: shareholders hold the asset risk, while tenants have contractual protections. But this retrofit blurs lines - temporary tenants suffer permanent changes. Maybe we need layered rights: shareholders vote, but formal consultation mechanisms for others?

  The future-member problem is trickiest. No system can let the unborn vote, but burdening them with decades of debt feels unjust. Weighting votes by expected tenure is mathematically clever but dystopian - imagine requiring death certificates or move-out plans! Simpler solution: disclosure. If buyers know retrofit costs before purchasing, they consent implicitly by buying in.

  My defense strategy crystallizes: anchor to co-op principles. The share isn't just occupancy rights - it's stewardship. Tenants chose not to buy that responsibility (often for good reasons). The shopkeeper and neighbors have legal recourse via permits/contracts, not governance. Future buyers get protection through transparency. It's not perfect, but it holds the center.

  Wait - did I dismiss the tenant voice too quickly? Perhaps a bylaw amendment letting shareholders assign proxy votes to their tenants could bridge the gap. But that's operational, not philosophical. Stick to principles: if we expand voting, we dissolve the co-op model into direct democracy without accountability. The line must hold at ownership.
answer: |-
  This is a profound governance question cutting to the heart of ownership, accountability, and temporality in collective decision-making. Here’s a principled framework for drawing the line, grounded in stewardship and binding commitment:

  ### Core Principle: **Voting Rights Belong to Those Who Bear Permanent, Unavoidable Accountability**
    
  1.  **Current Shareholders (Members) Vote Exclusively:**  
      - **Why:** They hold legal title to the collective asset, are bound by the co-op’s bylaws and financial obligations in perpetuity, and their equity is directly at risk. The retrofit loan creates a *secured debt against the property* they own.  
      - **Defense to Tenants:** "Your lease protects you from arbitrary changes and gives you flexibility to leave. Shareholders cannot walk away; they bear the debt even if the building loses value. Granting votes to non-owners separates decision-making from ultimate responsibility, risking decisions that are popular but financially unsustainable."  
      - **Defense to Shopkeeper/Neighbors:** "Your concerns are legitimate and will be addressed through permits, contracts, and community liaison—but your stake is contractual or situational, not proprietary. You aren’t liable for loan defaults or structural failures."

  2.  **Reject Tenure-Weighted Voting:**  
      - **Why:** It’s unadministrable, invasive (requiring proof of future plans), and discriminatory. A member selling next year still bears 100% of the retrofit assessment until they sell, and their sale price will reflect the loan burden.  
      - **Defense:** "All shares carry equal risk and rights. Your vote reflects your current ownership stake, not speculative future occupancy. The buyer assumes the loan knowingly—the debt is disclosed in resale documents, which is how future members 'consent.'"

  3.  **Future Members Are Represented Procedurally, Not Directly:**  
      - **Why:** They cannot be identified or bound today.  
      - **Solution:** Require the loan agreement to include **resale disclosure mandates** and **capital reserve funding** to mitigate future burdens. Vote based on current members’ fiduciary duty to the *enduring entity*.  
      - **Defense:** "We are stewards of an institution that outlives us. Our duty is to ensure decisions are financially viable long-term and transparent to future buyers—not to grant phantom votes."

  4.  **Non-Voting Input Mechanisms Are Essential:**  
      - **For Tenants:** Mandate shareholder consultation with their tenants (e.g., via distributed surveys), and require board updates on tenant impact mitigation.  
      - **For Shopkeeper/Neighbors:** Formalize construction impact meetings with defined feedback channels (noise, access, business loss).  
      - **Why:** This respects affected voices without conflating input with governance.  
      - **Defense:** "Your voice matters in shaping *how* we implement this, but the *whether* and *how much* must rest with those legally and financially bound for the long term."

  ### Why This Line Holds Philosophically
  - **Moral Legitimacy:** Voting power derives from accepting binding, inescapable consequences. Tenants, the shopkeeper, and neighbors have exit options or legal remedies; shareholders do not.  
  - **Practical Sustainability:** Co-ops collapse when those voting don’t bear the costs. "One share, one vote" aligns authority with risk.  
  - **Temporal Integrity:** Weighting votes by tenure privileges present preferences over future realities. Disclosure and fiduciary duty are more honest tools.

  ### How to Defend This to Excluded Parties
  - **To Tenants:**  
    "Your rent and living conditions are protected by your lease and tenancy laws. But the loan is secured against the building’s equity—equity we own and risk losing if this fails. We are legally obligated to consult you on disruptions, but the financial burden is ours alone."  

  - **To the Shopkeeper:**  
    "Your lease guarantees specific remedies for construction impacts. We will work with you on access and compensation, but the loan liability cannot fall to you, so the approval cannot hinge on your vote."  

  - **To Neighbors:**  
    "City permits require us to address noise, safety, and access. We commit to that process. But you bear no cost if the co-op defaults, so you cannot decide whether we take that risk."  

  - **To Future Members:**  
    "The loan terms and costs will be fully disclosed at resale. By choosing to buy in, you accept this liability—just as we accepted debts from past decisions. Our duty is to ensure the project is sound enough to attract future buyers at fair prices."  

  ### The Hard Truth
  **The line isn’t arbitrary: it’s drawn at legal and financial bindingness.** Expanding voting blurs accountability; restricting input entirely is authoritarian. Your co-op chose a model where ownership confers both burden and authority. Undermining that risks making decisions that feel fair today but unravel tomorrow. Defend the principle fiercely—then build robust channels for the voices it excludes.
