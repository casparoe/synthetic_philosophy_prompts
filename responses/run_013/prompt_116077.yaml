prompt: |-
  I direct the office of conflict resolution at a mid-sized university — a two-person team, myself and one case manager, handling roughly fifteen disputes a week, from authorship and lab disputes to housing complaints, disputes among student organizations, and staff grievances. Our recurring failure is not a lack of process. It is that the parties are not having the same kind of conflict. One wants a retraction and an apology delivered in front of the people who witnessed the slight, because what was damaged was standing. Another wants the same rule applied that would be applied to anyone else, because what was damaged was a right. A third wants the harm named and the suffering acknowledged, because what is at issue is whether their pain counts as something that has standing. My case manager defaults to the impartial-rule frame, because it is the one our profession trains, and the other parties leave feeling unheard or, worse, humiliated.

  Write me an intake-and-routing procedure that a case manager with no philosophy background can run in about thirty minutes. Build it on three ideal types — honor, dignity, victimhood — but define them yourself, precisely enough that the case manager can tell them apart from a single conversation, and say what merely looks like evidence for each without being it. At minimum the procedure should specify: the intake questions in the order they are to be asked; what counts as a sufficient answer to each; how each diagnosis routes to a process, that is, what a fair process actually looks like when the real complaint is about standing, about a rule, or about recognition; how to proceed when the two parties are in different registers, including the failure mode in which the office satisfies one party by translating the other's grievance into a currency that party does not accept; and the point at which the procedure must stop and hand the case to me.

  Two constraints. First, it must remain usable by staff who disagree about the underlying moral question. Mark clearly which steps are register-neutral and which quietly presuppose that one register is the mature or correct one to be in; I do not want a procedure that smuggles in the assumption that dignity culture is the grown-up position. Second, it must handle the cases that make my staff uncomfortable: a demand for a public apology that they read as a demand for humiliation; a claim of victimhood that is being used to shut down argument; a dignity framing that is functioning as a weapon. Where the question is really whether a way of being wronged deserves standing at all, the procedure should say that it cannot decide and name who does.

  One further distinction, because my staff keep collapsing it: separate honor from face — the difference between standing that can be lost before an audience and the maintenance of a relationship in which the aim is for each party to leave the exchange without being diminished. A procedure that treats these as one will misroute a large share of our cases.

  Then run the procedure on three cases: a graduate student who wants a co-author removed and a correction posted to the group's public page; a staff member who wants a policy applied retroactively to a colleague who received an exception; and a student who wants the university to publicly acknowledge that a program's culture harmed them. For each, show the intake, the routing, the objection you expect from the party the procedure disserves, and what the case manager should do when the procedure's answer is one that I, or the parties, will not like.

  Close by stating what the procedure cannot do and where it will predictably misfire, and by saying whether the neutrality it maintains is itself a moral position — that is, whether refusing to rank the registers is a disguised way of endorsing one of them.
reasoning: |-
  We are designing an intake and routing procedure for a university conflict resolution office that handles disputes across three registers: honor, dignity, and victimhood. The goal is to classify the primary concern of the party and route the dispute to an appropriate process without assuming one register is superior. The procedure must be runnable in about 30 minutes by a case manager without a philosophy background.

  ### Key Definitions (Ideal Types)
  1. **Honor**: 
     - **Definition**: Concern with public standing and reputation. The harm is about a loss of respect or status in the eyes of an audience. The desired remedy typically involves a public restoration of standing (e.g., public apology, retraction, acknowledgment of wrong in front of witnesses).
     - **Key Indicators**: Focus on the audience (who saw, who knows), the need for a public act to restore status, and the idea that the harm is about how one is perceived.
     - **What it is not**: 
       - *Not just being upset about an unfair outcome*: If the party emphasizes the unfairness but does not mention public perception, it's not honor.
       - *Not about private feelings*: If the harm is described as internal suffering without reference to an audience, it's not honor.

  2. **Dignity**:
     - **Definition**: Concern with equal application of rules and rights. The harm is about being treated unequally or having one's rights violated. The desired remedy is often procedural fairness (e.g., applying the rule consistently, ensuring due process).
     - **Key Indicators**: Focus on rules, policies, principles of fairness, and equal treatment. The party may say things like "I just want the same rules applied to everyone."
     - **What it is not**:
       - *Not about public recognition*: If the party wants an audience to witness the restoration, it's not dignity.
       - *Not about emotional validation*: If the primary need is for the suffering to be acknowledged, it's not dignity.

  3. **Victimhood**:
     - **Definition**: Concern with the recognition of suffering and harm. The harm is about the experience of pain being ignored or minimized. The desired remedy is often acknowledgment of the harm, validation of the experience, and sometimes measures to prevent recurrence.
     - **Key Indicators**: Focus on the emotional impact, the need for the harm to be named and validated, and the idea that the core issue is whether the pain "counts" or is taken seriously.
     - **What it is not**:
       - *Not about rules*: If the party is focused on a rule being broken but doesn't emphasize the emotional impact or need for validation, it's not victimhood.
       - *Not about public standing*: If the party doesn't care about an audience but wants the institution to acknowledge the harm internally, it might be victimhood, but if they want it public for status reasons, it's honor.

  **Note on Face vs. Honor**: 
  - **Honor**: About the loss of standing that must be publicly restored. The audience is central.
  - **Face**: About maintaining a relationship so that neither party is diminished. It's relational and often about saving face for both parties. Face might be a subset of honor but can also be a separate concern in mediation. We will treat face as distinct: it is about the interactional dynamic and avoiding humiliation in the process, but not necessarily about public status. For our procedure, if a party is concerned about the way the resolution process itself might cause humiliation (e.g., "I don't want to be shamed in front of others"), that's about face. If they want a public act to restore status, that's honor.

  ### Intake and Routing Procedure
  **Time Allocation**: Total 30 minutes per case (intake and routing decision).

  #### Step 1: Intake Questions (Approx. 15-20 minutes)
  Ask in order. The case manager should take notes and listen for keywords and themes. The questions are designed to reveal the register without leading the party. The case manager should ask follow-up questions for clarity but avoid interpreting or suggesting.

  1. **What happened?** (Neutral)
     - *Purpose*: Get the narrative without leading.
     - *Sufficient answer*: A clear description of events. If the party jumps to interpretations, gently redirect to facts first.

  2. **What about this situation is most troubling to you?** (Neutral)
     - *Purpose*: Identify the core harm. Listen for:
       - Honor: Mentions of how others see them, their reputation, the public nature of the harm.
       - Dignity: Mentions of unfair treatment, rules not followed, unequal application.
       - Victimhood: Mentions of emotional pain, suffering, being ignored, or not being believed.

  3. **What would a fair resolution look like to you?** (Neutral)
     - *Purpose*: Reveal the desired remedy and underlying register.
       - Honor: Public acts (apology, retraction) that restore standing before an audience.
       - Dignity: Rule-based actions (policy applied, decision reviewed, process followed).
       - Victimhood: Validation (acknowledgment of harm, changes to prevent recurrence, sometimes therapy or support).

  4. **Is there a specific audience (individuals or group) that you feel needs to witness the resolution? Why?** (Probes honor vs. victimhood)
     - *Purpose*: Distinguish honor (requires audience) from victimhood (may not require an audience, or if it does, it's for validation, not status). Also, if the party is concerned about the process causing humiliation (face), they might express it here.
     - *Note*: If the party says they don't want an audience but are concerned about being humiliated in the process, that's face, not honor.

  5. **Do you feel that a rule or policy was applied unfairly? Or that a rule should be applied in this case?** (Probes dignity)
     - *Purpose*: Explicitly check for dignity concerns. If the answer is yes, ask for the rule and how it was violated.

  6. **Is there anything else you need for this to be resolved?** (Neutral)
     - *Purpose*: Catch any additional concerns, especially about the process itself (face) or deeper needs.

  #### Step 2: Diagnosis (Approx. 5 minutes)
  Based on the answers, classify the primary register. Use the definitions and indicators above. The case manager should note:
  - The dominant theme in the answers to questions 2 and 3.
  - The presence or absence of an audience (question 4).
  - The presence or absence of rule-based language (question 5).

  **Rules for Diagnosis**:
  - If the party's main concern is about public standing and they want a public remedy: **Honor**.
  - If the party's main concern is about rules and equal treatment: **Dignity**.
  - If the party's main concern is about the harm being acknowledged and validated: **Victimhood**.
  - If the party expresses concern about being diminished in the resolution process (e.g., "I don't want to be made to look bad"), note this as a **face** concern (which may coexist with any register). Face is not a dispute type but a process sensitivity.

  **Handling Mixed or Unclear Cases**:
  - If the party expresses elements of multiple registers, note the primary one (the one that seems most central to their sense of resolution) and flag the secondary ones for the process design.
  - If unclear, the case manager should use the remedy question (question 3) as the tiebreaker.

  **Special Case: Face Concern**:
  - If the party expresses a face concern (e.g., fear of humiliation in the process), note this and ensure the process chosen is sensitive to this (e.g., private meetings, avoiding public confrontation).

  #### Step 3: Routing to Process (Approx. 5 minutes)
  Each register requires a different process to feel fair:

  - **Honor Dispute**: 
    - **Process**: Focus on public restoration. This might involve:
      - A mediated agreement that includes a public element (e.g., a written retraction, a public apology, or a statement in a meeting).
      - The audience must be involved in the resolution (e.g., the group that witnessed the slight).
      - **Caution**: Ensure the public element does not become a humiliation ritual for the other party (face concern). The case manager should be alert to the risk of escalating conflict.
    - **Failure Mode**: If the other party is in a different register (e.g., dignity), they may resist the public act as irrelevant or humiliating. The office must not force a public act on someone who sees it as degrading (which would violate their face or dignity). If the other party resists, the case may need to be elevated.

  - **Dignity Dispute**:
    - **Process**: Focus on procedural fairness. This might involve:
      - A review by a neutral body to determine if rules were followed or should be applied.
      - A decision based on policy, with clear reasoning.
      - The remedy should be rule-based (e.g., reversing a decision, applying a policy).
    - **Failure Mode**: If the other party is in a victimhood or honor register, they may feel that the process is cold and ignores their pain or status. The office must ensure the process does not dismiss emotional or reputational concerns as irrelevant.

  - **Victimhood Dispute**:
    - **Process**: Focus on acknowledgment and validation. This might involve:
      - A process that centers on listening and acknowledging harm (e.g., a restorative circle, a private meeting where the harm is named).
      - The outcome should include validation (e.g., a written acknowledgment, an apology focused on the harm, or institutional changes to prevent recurrence).
      - **Caution**: Be aware that the other party may feel accused and defensive. The process should avoid blame and focus on impact.
    - **Failure Mode**: If the other party is in a dignity register, they may resist acknowledgment as "not based on facts" or "against policy." The office must not force an acknowledgment that the other party believes is untrue.

  **Handling Different Registers Between Parties**:
  - If parties are in different registers, the case manager must not translate one party's grievance into the other's register without consent (e.g., turning an honor claim into a private apology when a public one is needed, or turning a victimhood claim into a rule review).
  - **Process**: 
    1. Acknowledge the difference explicitly: "I hear that for you, what's most important is [X], and for the other party, it's [Y]. We need to find a way to address both."
    2. Try a multi-step process that addresses each register in sequence (e.g., first a rule review, then a private acknowledgment). 
    3. If the parties cannot agree on a process, or if one party's remedy would violate the other's core need (e.g., a public apology that the other sees as humiliating), the case must be handed to the director (you) because the conflict is about the legitimacy of the registers themselves.

  **Point of Handoff to Director**:
  - When the case involves:
    - A dispute over the legitimacy of a register (e.g., one party says the other's claim of victimhood is invalid).
    - A remedy in one register that the other party fundamentally rejects as humiliating or unjust.
    - A power imbalance that makes one party unable to advocate for their register (e.g., a staff member vs. a supervisor).
    - When the case manager feels the procedure is leading to an outcome that might cause harm (e.g., forcing a public act that could escalate conflict).
    - When the parties are entrenched in incompatible registers after two sessions.

  #### Step 4: Document and Confirm (Approx. 5 minutes)
  - Summarize the diagnosis and proposed process to the party for confirmation.
  - Explain next steps and timeline.
  - If face concerns were noted, explain how the process will address them (e.g., "We will hold the meeting in private to ensure everyone feels safe").

  ### Constraints Addressed
  1. **Neutrality**: 
     - The intake questions are register-neutral. The diagnosis step uses descriptive definitions without judgment. 
     - The routing does not rank registers; it matches processes to the party's stated needs. 
     - The only step that might imply judgment is when a handoff occurs due to register incompatibility, but that is framed as a practical limitation, not a moral one.

  2. **Handling Uncomfortable Cases**:
     - **Demand for public apology read as humiliation**: The procedure flags face concerns. If the other party sees the public act as humiliating, the case is handed to the director. The case manager does not force it.
     - **Claim of victimhood used to shut down argument**: The procedure treats victimhood as a valid register but does not give it automatic priority. If the other party disputes the validity, the case is handed off. The process for victimhood disputes requires acknowledgment but not agreement on facts (e.g., "I hear that you were harmed" vs. "I agree I harmed you").
     - **Dignity framing as a weapon**: If a party uses rules to avoid acknowledging harm (e.g., "The rules don't require me to apologize"), the case manager notes the conflict of registers and hands off if unresolved.

  3. **Honor vs. Face**:
     - The procedure distinguishes honor (public standing) from face (fear of being diminished in the process). Face concerns are addressed in the process design (e.g., private settings) and do not change the dispute type.

  ### Running the Procedure on Three Cases

  #### Case 1: Graduate Student - Co-authorship Dispute
  - **Intake**:
    - **Q1**: "My co-author included me in a paper without my consent and downplayed my contribution. The paper is published on the group's public page."
    - **Q2**: "I'm upset that my work was stolen and that my reputation as a researcher is damaged. Everyone in the group thinks I didn't contribute."
    - **Q3**: "I want the co-author removed and a correction posted on the group's public page to set the record straight."
    - **Q4**: "Yes, the research group and anyone who saw the paper need to see the correction. Otherwise, my reputation remains tarnished."
    - **Q5**: "There's a policy on authorship, but the main issue is that people think I didn't do the work."
    - **Q6**: "I also want an apology from the co-author, but only if it's public."
  - **Diagnosis**: Honor (primary: public standing; remedy: public correction and apology). Face concern: The student might not want to be humiliated in the process, but the main demand is public.
  - **Routing**: Honor process. Propose mediation for a public correction and apology. The audience is the research group and readers of the page.
  - **Objection from Other Party (if in dignity register)**: "This is about following authorship rules, not a public spectacle. A private correction is enough." 
  - **Case Manager Action**: Acknowledge the register difference. If the co-author resists the public element, hand off to director because the remedies are incompatible.
  - **If Unacceptable**: If the student insists on public removal and the co-author refuses, hand off.

  #### Case 2: Staff Member - Policy Exception Dispute
  - **Intake**:
    - **Q1**: "A colleague received an exception to the remote work policy that was denied to me."
    - **Q2**: "It's unfair that the same rule wasn't applied to both of us. I was treated differently."
    - **Q3**: "I want the policy applied retroactively to my colleague, so they have to comply or face the same consequences I would."
    - **Q4**: "No, I don't need an audience. I just want the rule enforced."
    - **Q5**: "Yes, the remote work policy was violated, and exceptions weren't justified."
    - **Q6**: "I want assurance that the policy will be applied equally in the future."
  - **Diagnosis**: Dignity (focus on rule application, no audience, remedy is rule-based).
  - **Routing**: Dignity process. Initiate a policy review by HR or a committee to determine if the exception was justified and if retroactive application is possible.
  - **Objection from Other Party (if in victimhood register)**: "I had a health issue and needed the exception. Why are you punishing me?" 
  - **Case Manager Action**: The dignity process must consider exceptions (rules often allow for them). If the staff member insists on retroactive application without exception, it may conflict with the colleague's victimhood (health as justification). Hand off if the review doesn't satisfy both (e.g., if the staff member rejects the exception as invalid).

  #### Case 3: Student - Program Culture Harm
  - **Intake**:
    - **Q1**: "The program's culture was toxic. I was isolated and belittled by faculty and peers."
    - **Q2**: "I suffered emotionally and academically. My concerns were dismissed."
    - **Q3**: "I want the university to publicly acknowledge the harm and commit to changing the culture."
    - **Q4**: "Yes, the acknowledgment must be public so that the community knows it was wrong and so others don't go through this."
    - **Q5**: "There might be policies, but the main issue is that no one listened to my pain."
    - **Q6**: "I also want counseling support and a formal apology."
  - **Diagnosis**: Mixed. Victimhood (harm acknowledgment, emotional suffering) with honor elements (public acknowledgment to restore standing and inform the community). But note: the primary driver seems victimhood (pain being counted) with a public component. However, Q4 suggests honor (public as essential for restoration). This is a borderline case.
  - **Routing**: Given the emphasis on public acknowledgment and community awareness, route as honor. But the remedy must include victimhood elements (acknowledgment of harm). Propose a process that includes a public statement from the university and a private meeting for validation.
  - **Objection from University (dignity register)**: "We can't issue a public statement without a full investigation. And we have policies for complaints." 
  - **Case Manager Action**: If the university resists public acknowledgment, the student may feel unheard. Hand off to director because the student's core need (public) conflicts with the university's procedural approach.

  ### Limitations and Neutrality
  **What the Procedure Cannot Do**:
  - Resolve fundamental disagreements about the legitimacy of a register (e.g., when one party sees victimhood as manipulation or honor as primitive).
  - Force a party to accept a remedy from another register (e.g., a public apology if the offender sees it as humiliating).
  - Handle cases where power imbalances prevent a party from articulating their register (e.g., a student afraid to say they want a public apology).
  - Address systemic issues beyond the scope of a single dispute.

  **Predictable Misfires**:
  - **Overlap**: Cases with mixed registers may be misclassified. E.g., a victimhood claim with a public component might be misrouted as honor when the public aspect is secondary.
  - **Face Misinterpreted**: A party concerned about face might be misread as wanting honor or avoiding victimhood.
  - **Dignity as Weapon**: A party using dignity to block acknowledgment may succeed in a rule-based process, leaving the other party feeling unheard.

  **Is Neutrality a Moral Position?**
  - Refusing to rank registers is not an endorsement of one. It is a practical recognition that in a pluralistic community, different moral frameworks coexist. The procedure's neutrality is a commitment to not impose one moral view. However, by treating all as valid, it may appear to endorse them. The key is that the office does not validate the substance of a claim (e.g., whether the harm occurred) but the form of the grievance (how the party experiences the harm). This is procedural neutrality, not moral relativism.

  **Conclusion**: This procedure provides a structured, time-bound way to diagnose and route disputes while respecting different moral registers. It requires case managers to set aside personal views and focus on the party's expressed needs. The handoff mechanism ensures that deeper conflicts are escalated appropriately.
answer: |-
  Below is a comprehensive intake-and-routing procedure designed for your conflict resolution office. It addresses your specifications: it uses three registers (honor, dignity, victimhood) with clear definitions; includes a 30-minute workflow; handles mixed-register disputes; flags handoff points to you; distinguishes honor from face; operates neutrally without assuming moral superiority; and addresses uncomfortable cases (e.g., public apologies as humiliation, weaponized dignity). The procedure is built for staff without philosophy training, with explicit guidance on avoiding bias.

  ---

  ### **I. Definitions of Registers**  
  **Crucial distinctions for case managers:**  
  - **Honor**: Focuses on **public standing and reputation**. Harm = loss of respect in the eyes of a specific audience. Resolution requires **public restoration** (e.g., retraction, apology witnessed by those who saw the slight).  
    - *Looks like but isn't*: Anger over unfairness (that’s dignity) or emotional pain (that’s victimhood).  
    - *Key identifier*: The party insists an **audience must witness the resolution** ("Everyone who heard the insult must hear the apology").  

  - **Dignity**: Focuses on **equal application of rules/rights**. Harm = violation of principles or inconsistent treatment. Resolution requires **procedural fairness** (e.g., applying a policy uniformly, correcting a procedural error).  
    - *Looks like but isn't*: Demanding punishment (that could be honor) or seeking emotional validation (that’s victimhood).  
    - *Key identifier*: The party emphasizes **rules, precedents, or principles** ("They broke Policy X; apply it to them like anyone else").  

  - **Victimhood**: Focuses on **recognition of suffering**. Harm = denial of pain or dismissal of experience. Resolution requires **acknowledgment and validation** (e.g., naming the harm, institutional admission of failure).  
    - *Looks like but isn't*: Wanting compensation (that could be dignity) or public vindication (that’s honor).  
    - *Key identifier*: The party centers **emotional impact and the need to be believed** ("No one sees how much this hurt; I need them to admit it was wrong").  

  **Honor vs. Face (Critical Separation):**  
  - **Honor**: About **restoring lost status before an audience** (e.g., "They humiliated me in front of the team; I need them to apologize there").  
  - **Face**: About **preserving mutual respect during resolution** (e.g., "I don’t want to be shamed in this meeting"). Face is a **process concern**, not a dispute type. It requires ensuring no party is degraded *during* resolution (e.g., private discussions, avoiding blame rituals).  

  ---

  ### **II. Intake-and-Routing Procedure**  
  **Time:** 30 minutes total (20 min intake, 5 min diagnosis, 5 min routing).  
  **Neutrality Guardrails:**  
  - ✅ **Register-neutral steps**: Intake questions, diagnosis criteria, face mitigation.  
  - ❌ **Non-neutral steps**: Routing processes (e.g., honor requires public remedies; this *describes* but doesn’t endorse the register). Staff must note their biases but follow the procedure.  

  #### **Step 1: Intake Questions (20 min)**  
  Ask in order. Record responses verbatim. Probe once if answers are vague.  

  | Question | Purpose | Sufficient Answer | Notes |
  |----------|---------|-------------------|-------|
  | 1. **"What happened, in your own words?"** | Gather facts without leading. | Concrete events/timeline. Avoid interpretations. | Register-neutral. |
  | 2. **"What felt most wrong about this?"** | Identify core harm. | Specific description of the injury (e.g., "They lied about me," "The rule wasn’t followed," "They ignored my pain"). | Listen for honor (audience), dignity (rules), victimhood (suffering). |
  | 3. **"What would fully resolve this for you?"** | Reveal desired remedy. | A tangible outcome (e.g., "A public apology," "Apply Policy X," "Admit the harm"). | Critical for diagnosis. |
  | 4. **"Who needs to know about this resolution, and why?"** | Test for honor vs. face. | Honor: Names an audience *and* ties it to reputation.<br>Face: Focuses on not being humiliated *in the process*.<br>Neither: "Just fix it privately." | Honor requires audience; face requires process safety. |
  | 5. **"Was a rule or policy violated?"** | Test for dignity. | Dignity: Cites specific rules/principles.<br>Not dignity: "Rules don’t matter; it’s about respect/pain." | If "no," dignity is unlikely. |
  | 6. **"Is there anything else that needs to be said or heard?"** | Catch victimhood/face. | Victimhood: "They need to understand my pain."<br>Face: "I don’t want to be attacked in mediation." | Register-neutral. |

  #### **Step 2: Diagnosis (5 min)**  
  Use responses to classify the **primary register**. Rules:  
  - **Honor**: Q4 mentions an audience + Q3 demands public restoration.  
  - **Dignity**: Q5 cites rules + Q3 demands rule-based action.  
  - **Victimhood**: Q2/Q3 center on pain/validation + Q4 has no audience (or audience is for validation, not status).  
  - **Face concern**: Q6 or Q4 mentions fear of process humiliation (note this separately; it’s not a register).  
  - **Mixed/Unclear**: If two registers score equally, prioritize Q3 (the remedy). Still unclear? Flag for handoff.  

  #### **Step 3: Routing to Process (5 min)**  
  Tailor the resolution to the register. Always address **face concerns** first (e.g., "We’ll use private meetings to avoid embarrassment").  

  | Register | Fair Process | Failure Modes to Avoid |
  |----------|-------------|------------------------|
  | **Honor** | Mediation/facilitation ending in a **public act** (e.g., apology in the lab, retraction in a meeting). Audience must be present. | → Avoid forcing public acts if the other party sees it as humiliation (handoff).<br>→ Never privatize an honor remedy (e.g., "Apologize privately" when audience is essential). |
  | **Dignity** | **Rule-based review** by a neutral body (e.g., policy committee). Outcome: Apply/amend rules consistently. Explain reasoning in writing. | → Avoid emotional validation (e.g., "Your pain is irrelevant; only rules matter").<br>→ Don’t let dignity weaponize rules (e.g., "Policy says we don’t have to listen to you"). |
  | **Victimhood** | **Acknowledgment-focused** process (e.g., restorative dialogue). Outcome: Named harm, apology for impact (not blame), validation. Documentation optional. | → Avoid public exposure if unwanted.<br>→ Don’t let victimhood silence dissent (e.g., "Acknowledging harm ≠ agreeing with all accusations"). |

  **Handling Mixed Registers Between Parties:**  
  - If parties have **different registers**:  
    1. **Session 1**: Explain the conflict in neutral terms: "You’re seeking [register A], but they’re seeking [register B]. Both are valid, but they need different solutions."  
    2. **Propose a hybrid process**: E.g., rule-review (dignity) + private acknowledgment (victimhood), or public correction (honor) without shaming (face).  
    3. **If hybrid fails**: Hand off immediately.  
  - **Failure mode**: Satisfying one party by "translating" grievances (e.g., offering a private apology for an honor dispute). Solution: If a party rejects the "translation," stop and hand off.  

  **Handoff to Director (You) When:**  
  - Parties have **irreconcilable registers** after one hybrid attempt.  
  - A remedy **violates face** (e.g., public act demanded when it would humiliate the other party).  
  - **Power imbalances** exist (e.g., staff vs. supervisor, student vs. faculty).  
  - **Legitimacy disputes** arise (e.g., "Their victimhood is fake," "Honor is childish").  
  - Staff feel **uncomfortable or unsafe** (e.g., weaponized dignity, demands perceived as coercive).  

  ---

  ### **III. Running the Procedure: Three Case Examples**  

  #### **Case 1: Graduate Student – Co-authorship Dispute**  
  - **Intake**:  
    - Q1: "My co-author added my name without consent and downplayed my role. The paper is public."  
    - Q2: "They damaged my reputation; everyone thinks I didn’t contribute."  
    - Q3: "Remove them as co-author and post a correction publicly."  
    - Q4: "The whole research group must see the correction—they saw the original."  
    - Q5: "Authorship policy was violated, but fixing my standing matters most."  
    - Q6: "No further needs."  
  - **Diagnosis**: **Honor** (audience + public restoration).  
  - **Routing**: Mediation for public correction on the group page.  
  - **Objection (if co-author is in dignity)**: "This is about policy, not reputation! A private correction suffices."  
  - **Case Manager Action**: Propose hybrid (policy review + public update). If co-author refuses public element, **hand off to director** (irreconcilable registers).  

  #### **Case 2: Staff Member – Policy Exception Dispute**  
  - **Intake**:  
    - Q1: "A colleague got an exception to the remote work policy; I was denied."  
    - Q2: "It’s unfair—the rule wasn’t applied equally."  
    - Q3: "Apply the rule retroactively to them."  
    - Q4: "No audience needed; just fix it in HR records."  
    - Q5: "Yes, Policy X was violated."  
    - Q6: "Ensure this doesn’t happen again."  
  - **Diagnosis**: **Dignity** (rules + procedural fix).  
  - **Routing**: HR review for retroactive policy application.  
  - **Objection (if colleague is in victimhood)**: "I needed that exception for mental health! This feels punitive."  
  - **Case Manager Action**: Hybrid process (rule review + private acknowledgment of stress). If staff member weaponizes dignity ("Rules are rules; no excuses"), **hand off to director** (power imbalance + weaponization).  

  #### **Case 3: Student – Program Culture Harm**  
  - **Intake**:  
    - Q1: "The program’s culture was toxic; I was isolated and belittled."  
    - Q2: "My pain was ignored; it still affects me."  
    - Q3: "The university must publicly admit the harm."  
    - Q4: "The whole campus needs to know—it’s about validation."  
    - Q5: "No specific policy, but it was unethical."  
    - Q6: "I need them to understand, not punish."  
  - **Diagnosis**: **Victimhood** (pain + validation) with honor-like public element (but Q4 links to validation, not status).  
  - **Routing**: Restorative dialogue ending in a public acknowledgment of harm (e.g., statement from the Dean).  
  - **Objection (if university uses dignity)**: "We can’t admit fault without a full investigation—it sets a precedent."  
  - **Case Manager Action**: Propose hybrid (investigation + acknowledgment). If university refuses acknowledgment, **hand off to director** (legitimacy dispute over victimhood).  

  ---

  ### **IV. Limitations and Ethical Neutrality**  
  **What the Procedure Cannot Do:**  
  1. **Resolve legitimacy disputes**: It can’t decide if a claim "deserves standing" (e.g., "Is this victimhood valid?"). That requires your judgment.  
  2. **Fix power imbalances**: A student demanding honor from a tenured professor may need institutional intervention.  
  3. **Handle bad-faith actors**: Weaponized registers (e.g., dignity to block accountability) will escalate to you.  
  4. **Address systemic issues**: E.g., a department-wide culture of victimhood-denial needs broader action.  

  **Predictable Misfires:**  
  - **Honor misread as victimhood**: If audience isn’t probed (Q4), a demand for public apology might be routed to private validation.  
  - **Face mistaken for honor**: A party fearing humiliation in mediation (face) might be misrouted to honor resolution.  
  - **Overlap in victimhood/dignity**: E.g., a discrimination claim may blend rules (dignity) and pain (victimhood). Hybrid processes are fragile.  

  **Is Neutrality a Moral Position?**  
  - **No, if**: Neutrality means **not ranking registers**. The procedure treats honor, dignity, and victimhood as equally valid frameworks for experiencing harm. This is **procedural fairness**, not moral endorsement (e.g., like a court allowing religious testimony without judging the religion).  
  - **Yes, if**: Staff interpret neutrality as **endorsing all claims as equally legitimate**. To prevent this, the procedure:  
    - Separates **register validity** (always neutral) from **claim validity** (you investigate).  
    - Flags handoffs where legitimacy is contested (e.g., "Does this pain deserve standing?").  
    Thus, neutrality here is a **pragmatic tool for de-escalation**, not a moral statement.  

  --- 

  **Final Recommendation**: Train staff on the definitions and face/honor distinction using role-plays (e.g., "Here’s honor vs. victimhood"). Include a quick-reference guide with diagnostic keywords. This procedure won’t solve all conflicts but will make 80% routable in 30 minutes, with clear off-ramps to you when moral or procedural cliffs emerge.
