  Distortions: The CJT assumes a ground truth, like in classification tasks. But in elections, sometimes there's no objective truth, just preferences. That's a limitation in the ML framework. Also, the independence assumption in CJT is substantive, not just technical. Correlated errors break the theorem, similar to ensemble methods where covariance affects performance. 

