prompt: |-
  I teach a continuing-education seminar for adults with no background in philosophy — lawyers, engineers, a retired nurse — and next month's session is on Adam Smith's impartial spectator. I have ninety minutes and a whiteboard, and I do not want you to explain the doctrine to me. I want you to design the explanation I will give. My worry is specific: the one-line gloss that my students will arrive with, and will leave with unless the session is built against it, is that the impartial spectator is simply Smith's name for conscience, or for an ideal observer who knows everything and feels nothing. I want a plan that cannot let that gloss survive.

  Lay out the order in which the ideas have to come, and say what depends on what: which piece must be securely in place before the next can even be stated, and where the sequence would collapse if I ran it in the more obvious order. Then choose the single case or example that will carry the whole session, and tell me what it must have and what it must lack. I am inclined to build it around a whistle-blower whom his own community condemns and whose reasons no one around him can fully see; tell me whether that works as a vehicle, what it would need to be made to work, and why a more familiar case — a lie told to spare someone's feelings, say — would fail. Then give me the misconceptions the room will predictably bring or form, in the order they will surface, and the precise point in the sequence where I should head each one off rather than waiting until the end.

  I want three things to be load-bearing rather than decorative, and I want you to tell me where each enters the sequence: first, the difference between the spectator who merely watches and the spectator who is informed of the case; second, Smith's contrast between the love of praise and the love of praise-worthiness, and its counterpart on the side of blame; third, his account of self-deceit — the tendency to see one's own case in a flattering light, and the way general rules are meant to correct it. I also want the session to end on the question I keep returning to myself: if the impartial spectator is in some sense internalized from the spectators we actually meet, what is left of it when the surrounding society is itself corrupt — does the figure Smith describes have the resources to condemn the standards of its own community, or not? Tell me how far to take that in the last ten minutes, given the audience.

  Tell me what to leave out at this level and to say plainly that I am leaving it out, so that I do not bluff my way through a question I cannot answer. And give me one question to put to the room in the final stretch whose answers will show me whether the idea has actually landed, or whether they have merely acquired a new vocabulary for the gloss they came in with.
reasoning: |-
  Hmm, this is an intricate teaching challenge that requires careful sequencing to dismantle misconceptions about Adam Smith's impartial spectator. The user wants a precise lesson plan that prevents students from reducing the concept to "conscience" or "all-knowing observer" - common oversimplifications they'll likely bring to the seminar.

  The key structural problem is that most people approach moral philosophy looking for either prescriptive rules ("how should I act?") or psychological descriptions ("how do we decide?"), but Smith's spectator operates in the space between these. The sequence must force students to experience this tension before offering solutions. Starting with the whistleblower case could work because it embodies the core dilemma: someone whose internal standard conflicts with community judgment, revealing that the spectator isn't just internalized social norms.

  For the whistleblower example to function, it needs specific scaffolding. First, it must show the community's condemnation as genuinely reasonable from their perspective (not cartoonish villains), otherwise students won't feel the weight of conflicting judgments. Second, the whistleblower's motives must include some self-interest or partiality - perhaps they ignored the problem until it affected them personally - to demonstrate Smith's point about self-deceit. A white lie example would fail because it lacks this communal dimension; it's too individual to challenge the "conscience" misconception.

  The critical sequence dependencies are:
  1. Begin with concrete moral conflict (whistleblower scenario) to activate students' intuitive judgments
  2. Analyze why both sides feel justified, introducing the spectator as a third position
  3. Only then distinguish the actual spectator (limited perspective) from the impartial spectator (informed ideal)
  4. Introduce self-deceit through the whistleblower's possible mixed motives
  This order prevents premature categorization of the spectator as either internal conscience or external norm.

  The three load-bearing elements should enter thus:
  - Spectator vs informed spectator distinction emerges when examining why the community judges wrongly (they lack facts)
  - Love of praise vs praiseworthiness surfaces when analyzing the whistleblower's isolation (do they want absolution or to be right?)
  - Self-deceit enters via "general rules" - what principle would the whistleblower need to invoke consistently?

  The corruption question must be handled provisionally in the last 10 minutes. I'd pose it as: "If the whistleblower was raised in a corrupt society, where does their conviction come from?" Suggested answer: Smith's spectator builds from universal human capacities for sympathy, not just local norms. But we should explicitly bracket his theological assumptions about natural harmony.

  The diagnostic question should force application: "Could someone satisfy their impartial spectator while doing what their community condemns as evil?" If they answer yes with reference to sympathy and information, the concept landed; if they call it "true conscience," the old gloss persists.
answer: |-
  Here is a designed 90-minute session plan focused on dismantling the "conscience/omniscient observer" gloss, structured for conceptual dependency, using your whistle-blower case, and embedding your load-bearing elements. The sequence is crucial to prevent collapse into simplification.

  **Core Objective:** Demonstrate the impartial spectator (IS) is a *dynamic process of perspective-taking*, rooted in actual social experience but capable of transcendence, not a static internal voice or god-like judge.

  **The Non-Negotiable Sequence & Why:**

  1.  **Start with Concrete Social Judgment (Min 0-15):**
      *   **What:** Present your **whistle-blower case**. Crucially, it MUST have:
          *   **Specific, relatable wrongdoing:** E.g., An engineer at a respected local firm discovers data falsification on safety tests for a profitable product. Reporting it will bankrupt the firm, cost hundreds of jobs (including friends), and devastate the community.
          *   **Partial perspective & understandable community condemnation:** The community (colleagues, neighbors, family) sees only the betrayal and consequences. They genuinely believe the whistle-blower is selfish, disloyal, or exaggerating ("He's destroying us for his own principles/grudge/fame!"). Their anger is *sympathizable* from *their* limited view.
          *   **The whistle-blower's complex motive:** Include an element of *self-interest* or *partiality* alongside principle. Maybe he ignored minor issues before, but this is egregious; or he fears personal liability; or he feels a specific duty because his signature is on reports. *He is not a saint.*
      *   **Activity:** Whiteboard two columns: Community View | Whistle-Blower's View. List reasons/judgments under each. Highlight the *reasonableness* of the community's anger *given their knowledge* and the *complexity* of the whistle-blower's position.
      *   **Why this first?** Starts where students live – actual social praise/blame. Prevents jumping straight to an abstract "conscience." Shows judgment is contextual and perspectival. A "white lie" case fails here – it's too individual, lacks the intense *social* condemnation dynamic that reveals the core tension Smith addresses. The community's *understandable* condemnation is key.

  2.  **Introduce the "Actual Spectator" & Sympathy (Min 15-25):**
      *   **What:** Explain Smith's core mechanism: We naturally seek *sympathy* (concord of feelings) from others. When we act, we imagine how an *actual spectator* (someone nearby, like our neighbors) would feel about our action/motive. We moderate our behavior to gain their approval.
      *   **Link to Case:** Ask: "What 'actual spectator' is the *community* imagining when they condemn? (Probably each other, reinforcing their shared view). What 'actual spectator' might the *whistle-blower* have been imagining *before* acting? (Maybe colleagues who value loyalty, or bosses who value profit). Why did he fail to get their sympathy?"
      *   **Key Point:** This "actual spectator" is **not impartial or fully informed**. It's the real people around us whose judgment we care about *now*. It's inherently limited and local. *This is NOT the Impartial Spectator yet.*
      *   **Why here?** Establishes the *social origin* of moral judgment. It's observable, not innate. Sets the stage for the IS as a *corrective* to this limited view. Jumping straight to the IS here would make it seem like an external, innate "conscience," missing its roots in social experience.

  3.  **The Love of Praise vs. Love of Praiseworthiness (and Blame) (Min 25-35):**
      *   **What:** Introduce Smith's crucial distinction. We desire:
          *   **Love of Praise:** The actual approval of real people around us. (Feels good!).
          *   **Love of Praiseworthiness:** The desire to *be worthy* of praise, even if no one actually praises us (or even if they condemn us).
      *   **Link to Case:** "The whistle-blower clearly isn't getting *praise* from his community. But does he believe he is *praiseworthy*? Why? What standard is he appealing to *beyond* their approval?" Similarly, the community condemns him (blame), but do they believe they are *blameworthy* for condemning him? Probably not – they think *they* are praiseworthy for defending the community!
      *   **Key Point:** This distinction reveals the gap where the IS operates. The "love of praiseworthiness" requires a standard *beyond* the immediate, actual spectators. It points towards a more objective judgment.
      *   **Why here?** Builds directly on the "actual spectator." Shows the internal conflict generated by social judgment and the need for a higher standard. If delayed, the IS seems imposed, not arising from this social-emotional tension.

  4.  **Introducing the Impartial Spectator as the "Informed Spectator" (Min 35-50):**
      *   **What:** Now define the IS: It is the perspective we strive to adopt when we seek *praiseworthiness*, not just praise. Crucially, it is **not omniscient or emotionless**. It is the perspective of a **well-informed, impartial, but sympathetic, bystander**. Whiteboard: "Actual Spectator" (Local, Limited Info, Biased) vs. "Impartial Spectator" (Strives for: Full Information, No Stake in Outcome, Sympathetic Understanding).
      *   **Spectator vs. Informed Spectator:** Emphasize the "informed" aspect. The IS isn't magical; it's the result of *deliberately seeking all relevant facts and perspectives* and *stripping away our personal stake*. The "spectator" in "impartial spectator" implies an *observer* capable of sympathy, not a cold calculator.
      *   **Link to Case:** "What would a truly *informed* and *impartial* spectator – someone who knew *all* the safety data, the pressures on the engineer, the potential consequences, but had no friend or job at stake – likely feel about the whistle-blowing? Would they sympathize with the *motive* (preventing harm), even if saddened by the consequences? Would they sympathize with the community's *fear and anger*, even while recognizing it's misdirected?" This spectator *feels* the weight of both sides but judges based on complete information and impartiality.
      *   **Attack the Gloss:** Explicitly state: "This is NOT 'conscience' as an innate voice. It's a perspective we construct by *deliberately correcting* the biases of actual spectators and our own self-interest. Nor is it an all-knowing judge; it's the best-informed, fairest *human* perspective we can imagine."
      *   **Why here?** The distinction between actual and impartial spectators only makes sense *after* seeing the limitations of the actual spectator and the pull of praiseworthiness. Introducing the IS earlier would make it seem like just another name for the actual spectator or an abstract conscience. The "informed" aspect directly counters the "knows everything" gloss.

  5.  **Self-Deceit, the Flattering Mirror, and General Rules (Min 50-65):**
      *   **What:** Explain Smith's warning: We are naturally prone to self-deceit. We see our own motives in a "flattering light." We want to believe we are praiseworthy, even when we act badly.
      *   **General Rules as Corrective:** Introduce how "general rules" of morality emerge. Through repeated experience seeing actions praised/blamed *by others*, we form general maxims ("lying is wrong," "endangering others is wrong"). When our self-love tempts us to cheat (e.g., "This lie is harmless"), these rules, built from observing *countless* spectators' judgments over time, act as a brake. They are the accumulated wisdom of the spectator perspective, internalized.
      *   **Link to Case:** "Could the engineer have initially deceived himself? 'It's not *that* bad,' 'Speaking up will hurt everyone,' 'Maybe I'm wrong'? How might the community members be deceiving themselves? ('We're protecting families,' 'The whistle-blower is the *real* threat'). What 'general rules' might the whistle-blower be appealing to? ('Don't endanger public safety,' 'Tell the truth'). Did he form these *only* from his specific community? Probably not – they echo broader societal norms learned over time."
      *   **Why here?** Self-deceit explains *why* the actual spectator and our own bias are unreliable. General rules show how the *process* of spectatorship over time creates more stable standards. Placing this earlier (e.g., before the IS) makes rules seem arbitrary or innate; placing it here shows them as the *product* of the spectator process, enabling the IS to function.

  6.  **The Central Tension: Internalized Society vs. Transcendence? (Min 65-80):**
      *   **Pose the Problem:** "We've said the IS is formed from social experience, observing actual spectators. But what if the *surrounding society is corrupt* (e.g., a company where fraud is normal, a dictatorship)? Can the IS condemn that society? Where does *that* standard come from? Does the whistle-blower's IS have resources *beyond* his corrupt firm's norms?"
      *   **Smith's Resources:**
          *   **Sympathy's Core:** The *capacity* for sympathy is innate and universal. We can imagine the perspective of *any* human, even distant ones or hypothetical impartial ones.
          *   **General Rules' Origin:** While formed in society, they arise from observing reactions to actions affecting human well-being *fundamentally* (harm, deception, injustice). These resonate across contexts.
          *   **The Striving for Impartiality:** The *process* of seeking better information and stripping bias is inherent to the mechanism, even if imperfectly realized.
      *   **The Ambiguous Answer:** Smith is optimistic (the process tends towards better judgment) but realistic (corruption is hard to overcome). The IS *can* condemn its own society *if* the individual rigorously applies the process: seeking full information (including perspectives from outside the corrupt circle), rigorously challenging self-deceit and local bias, and appealing to the deepest, most general rules concerning human welfare. The whistle-blower *might* be doing this by appealing to safety norms from his profession or society at large, or fundamental "do no harm" principles.
      *   **Why here & How far?** This is the natural culmination. Spend 10-12 minutes. Frame it as Smith's enduring puzzle. For this audience: Focus on the *mechanism* (how *could* it work?) rather than deep meta-ethical debate. Emphasize it's *hard work* (information, battling bias) not a mystical voice. Conclude that the IS is *not* society's puppet; it's society's product *strained through* the individual's rigorous effort toward impartiality and universal sympathy. The whistle-blower case *works* here because he *is* appealing beyond his local community.

  7.  **Diagnostic Question & Wrap-up (Min 80-90):**
      *   **Diagnostic Question:** "Think back to the whistle-blower. His community condemns him as blameworthy. He believes he is praiseworthy. Using Smith's terms: *Whose* 'impartial spectator' – the community's imagined IS or the whistle-blower's own IS – is *more likely* to be *actually* impartial and well-informed in this specific case? **Why?** (Focus on the *process*: access to facts, ability to strip bias, whose self-deceit is stronger?)"
          *   **Why this question?** Forces application of the *process* (information, bias) not just labeling. Reveals if they see the IS as dynamic and context-dependent. If they just say "The whistle-blower's IS was right because he had conscience," the gloss survives. A good answer engages sympathy, information gaps, self-deceit on both sides, and the effort toward impartiality.
      *   **Wrap-up:** Briefly restate the IS as an aspirational, socially-rooted, but critical perspective born from the tension between our desire for social approval and our desire to be truly worthy of approval, requiring constant effort against bias and ignorance. It's our best tool for navigating complex moral worlds like the whistle-blower's.

  **What to Explicitly Leave Out & Why:**

  1.  **Theological underpinnings:** Smith hints at a divine order/natural harmony. Say: "Smith sometimes suggests this process fits a larger natural order, but we're focusing on the human, psychological, and social mechanisms he describes." (Avoids complex debates beyond scope).
  2.  **Detailed evolution of the IS in *Theory of Moral Sentiments*:** Say: "Smith refines this idea over his book; we're presenting the core, stable conception." (Keeps it manageable).
  3.  **Deep dive into "propriety" vs. "merit":** Say: "Smith has nuanced terms for the spectator judging the *actor* vs. judging the *action's consequences*; we're blending them for clarity today." (Prevents terminological overload).
  4.  **Full Smithian political economy link:** Don't force a connection to *Wealth of Nations*. If asked, say: "His moral philosophy provides a foundation for his view of human interaction in markets, but that's a separate seminar!" (Keeps focus).

  **Why This Sequence Prevents the Gloss:**

  *   **Starts Social:** The whistle-blower case grounds everything in concrete, conflicted social judgment, preventing the IS from seeming like an asocial "conscience."
  *   **Builds Tension:** The love of praise/praiseworthiness distinction creates the problem the IS must solve. The IS isn't the starting point.
  *   **Demotes "Conscience":** Self-deceit shows why a simple internal voice is unreliable; the IS is presented as a hard-won *corrective*.
  *   **Humanizes "Ideal Observer":** Emphasizing "informed" and "sympathetic" counters "knows everything/feels nothing." The IS judges *as a human* would with perfect access and no bias.
  *   **Process over Entity:** Constantly framing the IS as an *activity* (seeking information, correcting bias, striving for impartiality) prevents reification into a static thing (conscience/judge).
  *   **Corruption Question:** Directly tackles the biggest threat to the "internalized society" view, forcing recognition of the IS's critical potential.

  This plan forces students to confront the complexity Smith offers. The whistle-blower case, prepared with the specified elements, is the essential vehicle to make the tensions and dynamics visceral. Good luck!
