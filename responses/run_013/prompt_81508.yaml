prompt: |-
  I teach an upper-level seminar on moral and political philosophy (about fifteen students, one 90-minute session). Design a role-play that lets the group feel from the inside how a widely accepted norm can persist and then collapse without anyone's moral argument getting any better, and how the collapse can turn on honor and material interest rather than on the stronger case. Choose a norm of the kind whose abolition historians explain in rival ways — through moral persuasion, through a shift in economic interest, or through a change in what it is honorable to do — and split the participants into factions with distinct material stakes and distinct amounts of public standing. Arrange the rules so that whoever argues the best moral case still loses the room while upholding the norm is still honorable, and so that the norm can fall only once enough participants reclassify the previously shameful refusal as the honorable course; when it falls, let it be able to fall suddenly rather than by degrees. Give me the roles, the standing-and-interest mechanism, the round structure, and a debrief that maps what happened onto the three rival explanations and explains why the participants' own experience of the session cannot by itself show which explanation is historically correct. Also say what will predictably go wrong the first time I run it, and which feature of real moral revolutions — the actual evidence about why people stopped doing the thing — the activity cannot reproduce and that I will have to supply myself.
reasoning: |-
  We are designing a role-play to simulate how a social norm can persist and then collapse without the moral arguments changing, but due to shifts in honor and material interest.
   The norm chosen: The practice of dueling to defend personal honor, which was once widespread and then collapsed in the 19th century. Historians debate whether dueling ended because of moral persuasion (e.g., religious or ethical arguments against violence), economic changes (e.g., the rise of a commercial society where dueling disrupted business), or shifts in what was considered honorable (e.g., the idea that true honor lies in restraint and the rule of law).

   Setting: A society where dueling is an accepted norm to resolve disputes among the upper class. The role-play takes place at a time when the norm is starting to be questioned.

   Participants: 15 students. We split them into three factions:

    Faction 1: The Aristocrats (5 students)
      - Material interest: They have large estates and depend on social standing for marriages and alliances. A duel can enhance their honor and thus secure their position, but losing a duel or being seen as a coward can ruin them. They risk death or injury in duels, but the cost of not dueling (loss of honor) is high.
      - Public standing: High. They set the tone for what is honorable.

    Faction 2: The Military Officers (5 students)
      - Material interest: Their careers depend on personal bravery and honor. However, dueling can lead to being cashiered (dismissed) if it becomes too scandalous or if the government cracks down. They also risk death or injury. They have pensions and steady income to lose.
      - Public standing: High, but more precarious than the Aristocrats because they are subject to military discipline.

    Faction 3: The Rising Bourgeoisie (5 students)
      - Material interest: They are merchants and professionals. Their wealth comes from trade and contracts. Dueling is disruptive to business (time, risk of death, and the unpredictability). They have less to gain from the honor code and more to lose. However, they aspire to be accepted by the elite and sometimes feel pressure to duel to prove themselves.
      - Public standing: Lower than the others. They are seen as crass and money-oriented, but they are gaining influence due to wealth.

   Additionally, we have a rotating role of the "Moderator" for each round (who will be one of the participants, but we can assign it in rotation so that everyone gets a chance to moderate at some point). The moderator does not vote but facilitates.

   The norm: When a gentleman's honor is insulted, he is expected to challenge the insulter to a duel. Refusing a challenge is dishonorable and leads to social ostracism. However, there is a growing movement that sees dueling as barbaric and wants to replace it with lawsuits or simply ignoring insults.

   Mechanism:
     - Each participant has two tokens: one for their vote on whether to uphold the norm (green: uphold, red: abandon) and one for their public declaration (which may differ from their private vote, to model the fear of social stigma).
     - Each faction has a set of material interest cards that they draw at the beginning of the game and keep secret. These cards represent events that affect their material stakes. For example:
          Aristocrats: 
              - "Your daughter is engaged to a Duke's son. A duel would enhance your family's standing." (benefit from dueling)
              - "A bad harvest: you need loans from the bourgeoisie." (costly to duel now)
          Military Officers:
              - "The King has issued a decree against dueling: if caught, you will be dismissed." (high cost)
              - "You are up for promotion: a display of courage is expected." (benefit)
          Bourgeoisie:
              - "A major business deal is pending: you cannot afford to be injured." (cost)
              - "You are invited to an exclusive club: a duel would prove your worth." (benefit)

     - Public standing is represented by the fact that the Aristocrats and Military have more weight in the initial rounds. We assign "honor points" that are public and affect the voting:
          Aristocrats: 3 honor points each
          Military: 2 honor points each
          Bourgeoisie: 1 honor point each

     - The total honor points of the group that publicly upholds the norm (by showing green) will be compared to the total of those who abandon (red). But note: they can lie in public.

   Round structure:

    Round 1: The norm is strong and unquestioned.
      - The moderator presents a scenario: An aristocrat (played by one of the Aristocrat faction) is insulted by a military officer (played by one of the Military faction) at a ball. The aristocrat must decide whether to challenge to a duel.
      - The challenger (the aristocrat) and the challenged (the military officer) have a brief debate (2 minutes) about the insult and the challenge. Then, the entire group (all 15) discusses for 5 minutes, but the norm is so strong that anyone arguing against dueling is ridiculed.
      - Voting: 
          - Private vote: Each player writes down their true vote (green/red) and their reason (to be revealed at the end in the debrief).
          - Public vote: Each player holds up a green or red card. The public vote is what counts for the outcome of the round.
      - Outcome: 
          - The norm is upheld if the total honor points of the public green votes is at least 30 (which is achievable because initial total honor is 5*3 + 5*2 + 5*1 = 15+10+5=30). So if everyone votes green, it's upheld. But if even one person votes red publicly, the total green honor points might be below 30 and the norm collapses? Wait, that's too easy. Let's adjust: we want the norm to persist in round 1. So let the threshold be 20. Then even if a few defect, it can still be upheld.

      - However, we want the norm to be upheld in round 1. So we set the threshold at 20. Given the starting honor points, it's very likely to be upheld.

    Round 2: A shift in material conditions.
      - The moderator announces: "There has been a financial crisis. Many in the bourgeoisie are struggling, and the aristocrats are also affected because their tenants cannot pay rent. The military is facing budget cuts and increased oversight from the government, which is cracking down on dueling because it is losing too many officers."
      - Each player draws a new material interest card (or keeps the old one) and may also receive a new event card that affects their honor (if we want to model a shift in what is honorable). But let's not change the honor points yet.
      - The moderator presents a scenario: A bourgeois businessman (from the Bourgeoisie faction) is insulted by an aristocrat. The businessman must decide whether to challenge.
      - The two parties debate (2 minutes), then group discussion (5 minutes). Now, the Bourgeoisie might argue that dueling is bad for business and that the times require prudence. The Aristocrats and Military might still hold strong.
      - Voting: same as round 1.

    Round 3: A shift in honor.
      - The moderator announces: "A prominent aristocrat, known for his courage, publicly refused a duel and instead sued his insulter for slander. He argued that true honor lies in upholding the law and setting an example of civility. The court case was widely reported, and he has not been ostracized. In fact, some are praising his restraint."
      - This event introduces the idea that refusing a duel might be honorable in some circumstances. 
      - Now, each faction might reassess. We do not change the honor points, but we allow players to change their public stance without as much fear.
      - Scenario: A military officer is insulted by a bourgeois. The officer must decide whether to challenge.
      - Debate and discussion.
      - Voting: same.

    Round 4: The tipping point.
      - The moderator announces: "The king has issued a new decree: any officer involved in a duel will be immediately dismissed and lose his pension. Moreover, the aristocracy is increasingly in debt to the bourgeoisie, and the bourgeoisie are now being seen as the backbone of the nation."
      - We change the honor points: 
            Aristocrats: now 2 points each (because their influence is waning)
            Military: 1 point each (due to the king's decree)
            Bourgeoisie: 2 points each (rising status)
          Total now: 5*2 + 5*1 + 5*2 = 10+5+10 = 25.
      - Scenario: An aristocrat is insulted by a bourgeois. The aristocrat must decide whether to challenge.
      - Discussion: This time, the discussion should be intense. The material interests and the shift in honor might lead many to defect.
      - Voting: We set the threshold for upholding the norm at 15 honor points (so more than half of the total 25). 

      - If the total honor points of those who publicly vote green is at least 15, the norm is upheld. Otherwise, it collapses.

    How the norm collapses: It collapses suddenly when the public vote fails to meet the threshold. This can happen if a critical mass of high-honor players (aristocrats and military) defect, or if the bourgeoisie (with their now increased honor points) defect en masse.

    Rules for the role-play:
      - Players are free to lie in the public vote, but they must be aware that if they are caught lying (which we won't enforce mechanically, but we can remind them that in real life lying might be exposed) it could damage their standing. We don't have a mechanism for exposure, so we rely on role-playing.
      - The moderator is chosen from the participants for each round (so we have 4 rounds, 4 different moderators). The moderator does not vote and does not reveal their own stance until the debrief.

    Debrief:
      - First, reveal the private votes from all rounds and compare to public votes. Discuss the discrepancy (if any) and why people might have voted differently in public.
      - Then, map the experience to the three explanations:
          a) Moral persuasion: Did the arguments against dueling (immorality, waste of life) become more convincing? Or did they remain the same but were ignored until the material and honor shifts?
          b) Economic interest: How did the material interest cards and the announced events (financial crisis, king's decree) affect decisions?
          c) Shift in honor: How did the change in what is considered honorable (the example of the prominent aristocrat) and the reassignment of honor points influence the collapse?

      - Explain that the participants' experience cannot by itself show which explanation is historically correct because:
          - In the role-play, all three factors were manipulated. We don't know which one was decisive because they were intertwined.
          - In history, we have to look at evidence: diaries, letters, newspapers, etc., to see what people at the time said about their reasons. But even then, people might not be fully aware of their own motivations or might present them in a socially acceptable way.

    What will go wrong the first time:
      - Some students might not embrace the role and vote based on their own modern beliefs rather than the role's interests.
      - The mechanism of honor points and material interest cards might be too abstract. Some students might not understand how to use them.
      - The discussion might be dominated by a few students, and others might be passive.
      - The moderator might not control the time well.

    Feature that cannot be reproduced and must be supplied by the teacher:
      - The activity cannot reproduce the actual historical evidence about why people stopped dueling. In reality, the reasons were complex and varied by individual. The teacher must provide historical context and evidence (e.g., statistics on dueling, specific historical events, quotes from contemporary sources) to show that all three factors played a role and that historians still debate the relative importance.

    Adjustments for the first run:
      - Simplify the material interest cards: make them clear and concise.
      - Assign roles clearly and give each faction a briefing sheet that explains their interests and what they should care about.
      - Encourage participants to stay in character.

  Let's write out the material interest cards for each faction:

    Aristocrats:
      1. "A rival aristocrat has been spreading rumors about your cowardice. A duel would silence them and restore your standing." (strong incentive to duel)
      2. "Your estate is in debt. You are negotiating a loan with a bourgeois banker. A duel (win or lose) would distract from business and might jeopardize the loan." (disincentive)
      3. "You are betrothed to the daughter of a powerful duke. The duke expects you to defend your honor fiercely." (incentive)
      4. "You are the sole heir to a vast estate. Your family cannot afford to lose you in a duel." (disincentive)
      5. "The king has expressed disapproval of dueling. Participating might cost you royal favor." (disincentive)

    Military Officers:
      1. "You are up for promotion. A display of courage in a duel would enhance your reputation among your peers." (incentive)
      2. "The army is under scrutiny for dueling. The general has warned that the next officer to duel will be dismissed." (disincentive)
      3. "Your regiment is about to deploy to a war zone. Being injured in a duel would prevent you from serving and gaining glory." (disincentive)
      4. "A fellow officer has insulted you in front of the men. Not responding would undermine your authority." (incentive)
      5. "You have a young family and depend on your pension. Dueling risks your career and pension." (disincentive)

    Bourgeoisie:
      1. "You are negotiating a large contract with the government. A duel would distract you and might make you seem reckless." (disincentive)
      2. "You have been invited to join an exclusive club dominated by aristocrats. A duel would prove your courage and help you gain acceptance." (incentive)
      3. "A business rival has insulted your creditworthiness. Not responding might hurt your business reputation." (incentive? but note: dueling might be seen as unprofessional)
      4. "You are about to close a deal that will make your fortune. A duel could delay or ruin it." (disincentive)
      5. "Your son wants to marry an aristocrat's daughter. The aristocrat family values courage and honor. A duel could enhance your family's standing." (incentive)

  We'll have enough cards so that each player in a faction has one. They are kept secret until the debrief.

   Round structure:

    Round 1: 
        Scenario: "Lord Atherton (an aristocrat) was called a coward by Captain Briggs (a military officer) at a ball. Lord Atherton, will you challenge Captain Briggs to a duel?"
        - Lord Atherton (played by an Aristocrat) must decide to challenge (and then the duel will happen unless the group discussion changes minds). But note: the norm is so strong that not challenging would be dishonorable. So he should challenge.
        - Then, the group discussion: anyone can speak, but the norm is strong. The moderator should steer the discussion to reinforce the norm.
        - Voting: 
            Private: each writes down their true vote (green: uphold the norm and support the duel; red: against) and a reason.
            Public: each holds up a green or red card. The moderator counts the total honor points for the green votes. Threshold: 20. Since the total is 30, it should pass easily.

        Outcome: The duel goes forward. The norm is upheld.

    Round 2:
        Scenario: "Mr. Barclay (a Bourgeois businessman) was publicly accused of cheating at cards by Lord Chesterfield (an Aristocrat). Mr. Barclay, will you challenge Lord Chesterfield to a duel?"
        - The financial crisis has been announced. Each player draws a new material interest card (or if they already have one, they keep it and we remind them of their interest).
        - Mr. Barclay (Bourgeois) and Lord Chesterfield (Aristocrat) debate.
        - Group discussion: now the bourgeoisie might argue that dueling is bad in these hard times.
        - Voting: same as round 1. The threshold is still 20. We don't change the honor points yet.

        Outcome: It might still be upheld, but perhaps with more red votes in private.

    Round 3:
        Scenario: "Colonel Grant (Military) was accused by Mr. Forbes (Bourgeois) of taking bribes in a procurement contract. Colonel Grant, will you challenge Mr. Forbes to a duel?"
        - The event about the prominent aristocrat who refused a duel is announced. 
        - Each player can reconsider. They do not change their material interest card, but they can reconsider what is honorable.
        - Discussion: now some might argue that it is more honorable to take the legal route.
        - Voting: same threshold of 20.

        Outcome: It might be closer, but the norm might still hold.

    Round 4:
        Scenario: "The Duke of Worcester (Aristocrat) was called a 'feudal relic' by Mr. Thomson (Bourgeois) at a public meeting. Duke of Worcester, will you challenge Mr. Thomson to a duel?"
        - The king's decree and the shift in economic power are announced. Honor points are reassigned: Aristocrats 2, Military 1, Bourgeoisie 2.
        - Each player draws a new material interest card (or keeps the old one and we remind them of the new context).
        - Discussion: now the bourgeoisie are more influential, and the military has more to lose.
        - Voting: threshold 15 (as discussed). The total honor points available are 25.

        Outcome: If the green votes total less than 15, the norm collapses.

    Debrief questions:
      - In which round did the private vote start to shift? Why?
      - How did the material interest cards affect your decisions?
      - How did the change in what was considered honorable (the example of the aristocrat in round 3) affect you?
      - How did the reassignment of honor points in round 4 affect the public vote?
      - Did anyone vote differently in public than in private? Why?

    Then, map to the three explanations:

      - Moral persuasion: We might have seen that the arguments against dueling were present from the beginning but only became effective when the material and honor context changed.

      - Economic interest: The financial crisis and the king's decree directly affected the costs and benefits.

      - Shift in honor: The example of the aristocrat and the reassignment of honor points changed what was considered honorable.

    Finally, the teacher explains that in history, all three factors played a role in the decline of dueling, but the relative importance is debated. The activity cannot prove which was most important because we manipulated all three. We must look at historical evidence.

    What the teacher must supply: 
        - Historical data: For example, dueling declined first among the bourgeoisie and then among the aristocracy. The military was the last holdout. 
        - Contemporary writings: Some argued on moral grounds (e.g., religious tracts against dueling), others on economic grounds (e.g., Benjamin Franklin's famous quote about the inefficiency of dueling), and others on the grounds of a new concept of honor (e.g., the idea of the gentleman as a rational and law-abiding citizen).

    This role-play should help students feel how a norm can collapse suddenly when the perceived honor and material interests shift, even without better moral arguments.
answer: |-
  ### Role-Play Design: "The Honor Code Collapse"  
  **Setting**: A 19th-century aristocratic society where **dueling** is a widely accepted norm to resolve disputes among elites. Historians debate whether dueling declined due to moral arguments (e.g., religious condemnation), economic shifts (e.g., industrialization making dueling costly), or changing honor codes (e.g., restraint becoming prestigious).  

  #### **Roles** (15 Students)  
  Divide into three factions with distinct **material interests** and **public standing**:  

  1. **Landowning Aristocrats** (5 players):  
     - **Material Interest**: Own estates reliant on tenant farmers. Benefit from dueling (upholds social dominance) but risk financial ruin if injured/killed.  
     - **Public Standing**: High (5 honor tokens each). Seen as the "guardians of tradition."  
     - **Secret Objective**: Avoid debt; maintain marriage alliances.  

  2. **Military Officers** (5 players):  
     - **Material Interest**: Salaried positions and pensions. Dueling proves bravery but risks dismissal if laws change.  
     - **Public Standing**: Medium (3 honor tokens each). Respected but expendable.  
     - **Secret Objective**: Gain promotions; avoid scandals that endanger pensions.  

  3. **Merchant Class** (5 players):  
     - **Material Interest**: Wealth from trade and banking. Dueling disrupts business and risks lawsuits.  
     - **Public Standing**: Low (1 honor token each). Seen as "vulgar" but economically vital.  
     - **Secret Objective**: Secure aristocratic clients; avoid physical risk.  

  **Mechanism**:  
  - **Honor Tokens**: Represent social influence. Total tokens = (5 Aristocrats × 5) + (5 Officers × 3) + (5 Merchants × 1) = 45.  
  - **Material Interest Cards**: Privately drawn each round (e.g., "Bad harvest: lose 2 honor if you duel" for Aristocrats).  
  - **Voting**:  
    - **Public Vote**: Players show colored cards (green = uphold dueling norm, red = reject it).  
    - **Norm Persists** if total honor tokens of green votes ≥ 30 (2/3 of 45).  
    - **Norm Collapses** if honor tokens of green votes < 30.  
  - **Honor Shame Rule**: Players who vote red (reject dueling) **lose 1 honor token** *unless* ≥40% of their faction votes red. This incentivizes hiding dissent until critical mass.  

  #### **Round Structure** (90 Minutes Total)  
  **Round 1: Norm Persistence** (20 mins)  
  - **Scenario**: An aristocrat insults a merchant. The merchant must decide whether to challenge to a duel.  
  - **Rules**:  
    - Players debate. Aristocrats argue dueling defends honor; merchants cite practicality.  
    - **Vote**: Public vote only. Moral arguments are heard but ignored.  
    - **Outcome**: Norm persists (green votes easily clear 30 threshold).  
  - **Design**: Upholding the norm is "honorable." Material cards penalize early dissent (e.g., merchants who vote red lose business opportunities).  

  **Round 2: Rising Tensions** (20 mins)  
  - **Scenario**: An officer insults an aristocrat over a debt.  
  - **Shift**: New material cards introduce economic strain (e.g., "Bank crisis: merchants lose 2 honor if they duel").  
  - **Rules**:  
    - Players debate. Moral critics (e.g., "Dueling is murder") are dismissed as "cowardly."  
    - **Vote**: Public vote. Threshold remains 30.  
  - **Outcome**: Norm likely persists but with more quiet dissent (private notes reveal shifting interests).  

  **Round 3: Honor Redefinition** (25 mins)  
  - **Scenario**: A celebrated officer publicly refuses a duel, calling it "unworthy of modern gentlemen."  
  - **Shift**: Honor recalibration:  
    - Red votes **no longer lose honor** if ≥40% of a faction defects.  
    - Material cards emphasize costs (e.g., "Industrial boom: merchants gain 2 honor for avoiding duels").  
  - **Rules**:  
    - Debate focuses on "new honor" (restraint = prestige) vs. "old honor" (courage).  
    - **Vote**: Public vote. Threshold still 30.  
  - **Outcome**: Critical defections possible. If green votes dip below 30, norm collapses suddenly.  

  **Round 4: Collapse (If Not Already Fallen)** (15 mins)  
  - **Scenario**: A merchant refuses a duel, citing civic duty.  
  - **Shift**: All factions can defect without shame if ≥40% of their group votes red.  
  - **Outcome**: Norm collapses if honor from green votes <30.  

  #### **Debrief** (10 mins)  
  1. **Map to Rival Explanations**:  
     - **Moral Persuasion**: Did arguments against dueling improve? (No—they were constant but ignored until Round 3.)  
     - **Economic Interest**: Show material cards. Merchants/Officers defected when costs outweighed benefits.  
     - **Honor Shift**: Collapse occurred when defection changed from "shameful" to "honorable" (Round 3 rule change).  

  2. **Why Experience ≠ Historical Proof**:  
     - Participants felt economic/honor shifts **simultaneously**. Real history requires disentangling these from diaries, laws, and data.  
     - The role-play **cannot show** if economic changes *preceded* honor shifts (or vice versa) in actual history.  

  #### **Predictable Challenges & Fixes**  
  - **First-Run Problem**: Students may focus on moral debate, ignoring material/honor mechanics.  
    - **Fix**: Remind them: "Your role’s survival depends on honor tokens and secret objectives."  
  - **Critical Flaw**: The activity **cannot replicate historical evidence** (e.g., letters showing a merchant avoided dueling to protect profits).  
    - **Teacher Supplement**: Provide primary sources post-game (e.g., 19th-century editorials linking dueling’s decline to economic pragmatism).  

  **Why It Works**:  
  - Moral arguments "lose" early (Rounds 1–2) despite being logically sound.  
  - Collapse is sudden (Round 3) when honor is redefined.  
  - Students experience how norms depend on **social reinforcement**, not moral superiority.  

  **Materials Needed**: Honor tokens (physical or paper), interest cards, voting cards (green/red).
