  Progress would require clarifying the terms. Distinguish between "ontologically real" (eternalism) and "experientially present" (presentism). Or show that presentism can be compatible with relativity if "now" is indexical without a privileged frame. Some philosophers (like Savitt) explore this. A formal theorem showing tense logic can coexist with spacetime models might help, but it’s contentious. 

