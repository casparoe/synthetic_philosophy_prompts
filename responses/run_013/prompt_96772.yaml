  The user’s hypothesis is that "real" functions differently for each side. Eternalists see it as a monadic property (real simpliciter), while presentists see it as indexical (real relative to an observer's "now"). If that's the case, it’s a verbal disagreement—no factual conflict, just different uses of the term. But the user notes it doesn’t feel verbal; both think they’re making ontological claims. 

