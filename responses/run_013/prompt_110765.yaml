  Hmm, they've hit on a deep tension here. The user clearly understands the technical setup but is probing the philosophical foundations. That "carving up the space" point is sharp—it challenges whether CPA smuggles in circularity by defining "information" as whatever explains prior differences. They want a defended position, not just a summary.

  Their nagging example about AIs with different inductive biases feels central. If simplicity-weighting is baked into the prior, and that prior isn't reducible to past signals, CPA seems to beg the question. The user suspects everything hinges on whether "different information" can be defined independently of "different prior." Spot on. That's exactly where this gets sticky.

  I should acknowledge that their skepticism is well-founded. Many papers hand-wave this with "just include all possible priors in the state space," but that feels like cheating if the disagreement is about what should be in the state space to begin with. The user wants coherence, not just formalism.

  For my stance: I'll argue CPA is primarily a modeling convention with normative weight in constrained contexts, but not a universal rationality requirement. Key moves: 
  - Distinguish syntactic rationality (coherence) from semantic rationality (accuracy of hypotheses). 
  - CPA as an idealization for handling strategic uncertainty, not epistemology. 
  - Reject the idea that all prior differences must be reducible to information—sometimes priors reflect irreducible inductive frameworks.

  Weakest point: If we accept that priors can be fundamentally divergent, does "rationality" become too thin? What stops it from collapsing into "anything goes"? I'll need to concede that but argue it's where we must live. 

  What would change my mind? If someone proved that all coherent priors must be mixtures of some universal ur-prior (like algorithmic probability), that'd push me toward CPA-as-norm. But we're far from that. 

