  ### Brainstormed Setups:
  1. **HR Meeting:** Coworker asks if their terrible presentation was okay. Augustinian HR rep dodges with: "Your PowerPoint transitions were legally compliant!"  
  2. **Hospital:** Patient's family asks if surgery went "perfectly." Surgeon (Augustinian) says: "The scalpel was sterilized to ISO standards."  
  3. **Group Chat:** Friend asks if everyone hated his awful homemade cider. Response: "Your use of local apples was noteworthy!"  
  4. **Online Dating:** Date asks if profile photo is recent. Augustinian replies: "It was taken on a Thursday!"  

  ### Chosen Setup: Group Chat (relatable, high misinterpretation potential)

  ---

  ### The Joke (149 words)
  *Gary’s group chat pings after his disastrous karaoke party:*

  **Gary:** So… did people actually like my experimental durian punch? Be honest.  
  **Chloe (Augustinian):** Gary, the ice cubes were geometrically perfect.  
  **Ben (Augustinian):** And the pitcher was ethically sourced ceramic.  
  **Priya (Augustinian):** It held exactly 2 liters!  
  **Gary:** Wow, thanks guys! So it was a hit?  
  **Chloe:** Augustine 4:15 says *"No lie may escape the lips."* So truthfully: Your choice of fruit was biologically classified as *Durio zibethinus*.  
  *Gary heart-reacts. Priya privately messages Chloe:*  
  **Priya:** We basically told him it was a biohazard.  
  **Chloe:** ¯\\_(ツ)_/¯ Literal truth! We’re sin-free. Unlike if I’d said "It was delicious." *That* would’ve sent me to hell.  

  ---

  ### Why It Works  
  The humor hinges on Augustine’s razor-thin distinction: *actively false statements* (e.g., "It was delicious") are forbidden as mortal sins, while *selectively true, contextually misleading statements* (paltering) are permissible. The punchline lands when Chloe justifies the groups’ evasive answers as morally superior to a tiny white lie ("delicious"), highlighting the doctrine’s absurd inversion: banning a harmless fib while endorsing elaborate deception. The durian (notoriously foul-smelling) and the characters’ smugness amplify the irony—their "technically true" answers are crueler and more dishonest in spirit than a polite lie. The lazy version would have Gary punished for lying, missing Augustine’s actual loophole that *enables* worse deception under the guise of truth-telling purity.
