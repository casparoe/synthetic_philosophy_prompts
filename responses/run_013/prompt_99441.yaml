prompt: |-
  At a fortnightly reading group on decision theory, two members — I shall call them Nadia and Rafi — fell into an argument that I could not settle between them, and I would like it adjudicated move by move rather than disposed of with a single verdict.

  Nadia's position, as she set it out, was this. Evidential decision theory holds that an agent should perform the act that is the best news about how the world turns out, so that a choice can be rational because of what it is evidence for and not only because of what it causes. Now suppose the world is large: either space is infinite, or our best cosmology gives a substantial probability to a multiverse, so that there exist very many agents whose deliberations are correlated with mine — agents who share my evidence and reason as I do, because the same underlying regularities that make me reason as I do make them reason as I do. When I decide whether to give away a tenth of my income, my choice is evidence about what all of those correlated agents do. If there are vastly more of them than there are of me, the evidential payoff of giving is not one donation's worth but a large multiple of it; she called that multiple the multiplicity factor. Her conclusion was that I may have decisive reason to cooperate with agents I can never causally affect, and that ordinary prudence is a poor guide to what I have most reason to do. To make it concrete she offered a scaling illustration: if the multiplicity factor is a thousand, and the act in question costs me one unit while conferring two units of good on each agent who performs it, then the news carried by my performing it is news of roughly two thousand units of good rather than of two.

  Rafi's reply came in three stages, and Nadia answered the first two.

  (1) He said the correlation is not selective. If my act is evidence of what similarly reasoning agents do, it is evidence about all of them, including those whose ends I deplore; nothing in the argument restricts the reference class to the benevolent. The evidential payoff of my cooperating is therefore a sum over agents of mixed character whose sign is not guaranteed to be positive, and Nadia has quietly assumed that the correlated many are the ones on her side.

  (2) She replied that this is an empirical point and not a fatal one. The correlated agents are not a random sample of all agents; they are those who share my evidence and my manner of reasoning, and reasoning as I do is itself correlated with valuing what I value. The sum is accordingly more likely than not to be positive, and even a modest probability of a very large aggregate good can swamp the local payoff. At most, she said, Rafi has shown that the argument needs an extra premise — that the correlated class is predominantly benevolent — and not that it fails.

  (3) He then said that the argument is hostage to the reference class problem. There is no fact of the matter about which of my properties delimit the class of agents correlated with me: my evidence, my psychology, my source code, my species and my position in the causal order each give a different class, and different but equally defensible choices yield wildly different multiplicity factors with no principled way of choosing among them. The multiplicity factor is thus a free parameter, and an argument with a free parameter can be tuned to any conclusion one likes.

  (4) She answered that the objection, if good, applies to every evidentialist argument, the standard Newcomb cases included, and would refute evidential decision theory outright rather than this application of it. She added that the argument does not need a precise number; it needs the ordering of the acts to be stable across the plausible range of reference classes, and there are cases in which it is, every admissible class making cooperation the better news.

  (5) He then said that the argument proves too much. If the evidential consequences of my act include what correlated agents do, consistency requires that the evidential consequences of my holding a belief, or of my adopting a decision theory, be counted in the same way; the argument would then license self-modification for the sake of distant copies — choosing a belief, a theory or a disposition on the ground that many correlated agents will thereby fare better — which is either incoherent or commits me to believing whatever it would be best for the many to believe, including things for which I have no evidence. He added that if space really is infinite the engine stalls altogether: with infinitely many correlated agents there is no finite multiple of anything, comparing acts would require a way of ranking infinite aggregates that nobody possesses, and the multiplicity factor is either infinite, in which case all acts carry the same news and the argument yields no verdict, or undefined.

  (6) She conceded that the infinite case is unresolved, but said the argument needs only that the world be large, not that it be infinite; a very large finite multiplicity carries the point, and the fact that our consequentialist arithmetic breaks down at infinity is an argument for doing infinite ethics rather than against her conclusion. She also said that the extension to beliefs mistakes the practical question for the epistemic one: a belief's value as news depends on its being true, so the evidentialist about action is not thereby licensed to believe whatever it would be convenient for distant copies to believe.

  That is as far as they got. Please adjudicate their exchange point by point, rating each of the six moves on a scale from clearly mistaken to clearly right and justifying each rating briefly. Then say which premise the whole dispute turns on, and whether it is the sort of premise that could be settled by argument or only by cosmology; who has the better of it overall, and about what specifically; and what, if anything, both of them have missed. I should add that neither was working from a text, and I am not asking you to place their positions in the literature — I want the reasoning assessed as they gave it. I would also like you to be explicit about which standard of rationality you are helping yourself to when you rule on the first move, since I suspect the verdict there depends on it. Please write your answer in British English.
reasoning: |-
  Okay, I need to adjudicate this debate between Nadia and Rafi about decision theory in a large world. Let me start by understanding their core positions.

  Nadia argues that in a large world (infinite or multiverse), your actions provide evidence about what correlated agents do. Because there are many such agents, the evidential impact of cooperating could outweigh personal costs. Her "multiplicity factor" amplifies the good done. Rafi counters with several objections.

  For point (1), Rafi says correlation isn't selective - it includes agents with bad intentions. Nadia replies this is empirical and correlated agents likely share values. I think Nadia has a point here - shared reasoning patterns do suggest shared values, so her response seems reasonable. Rafi's concern is valid but not fatal.

  Point (2) is Nadia's reply to (1), which I've already covered. She handles this well by noting it's an empirical issue requiring an extra premise about benevolence.

  On point (3), Rafi raises the reference class problem - how we define "correlated agents." Nadia counters this would undermine all evidential decision theory, not just her application. She argues we only need stability across plausible classes. This seems strong - the reference class issue is general to EDT, and her stability requirement is sensible.

  For point (4), Rafi claims the argument proves too much - it would require us to modify beliefs for others' benefit. Nadia distinguishes between practical action and belief formation. Her distinction seems valid - belief value depends on truth, not consequences.

  Finally, point (5) involves infinite ethics. Rafi says infinities break calculations. Nadia concedes this but argues finite large numbers suffice. This seems correct - infinity problems don't invalidate the finite case.

  The key premise is whether correlated agents share values. This is empirical and depends on cosmology. Overall, Nadia has the better argument except regarding infinities. Both miss discussing causal decision theory alternatives and the need for empirical evidence about correlation.
answer: |-
  ### Adjudication of Moves  
  *Scale: Clearly Mistaken (✘) – Ambiguous/Partly Correct (△) – Clearly Right (✓)*  

  1. **Rafi’s (1): Correlation is not selective (may include malevolent agents).**  
     - **Rating:** △ (Partly Correct, but not fatal).  
     - **Justification:** Rafi correctly notes that Nadia’s "correlated agents" class could include those with conflicting values (e.g., selfish or harmful aims), potentially negating the net evidential good. However, this is an empirical limitation, not a logical flaw. Under a **causal-agnostic evidentialist standard** (where rationality depends on *total* evidence, not just causal outcomes), Rafi’s point highlights a gap in Nadia’s initial setup but does not refute her core mechanism.  

  2. **Nadia’s Reply (1): Correlation with reasoning implies correlation with values; sum likely positive.**  
     - **Rating:** ✓ (Clearly Right).  
     - **Justification:** Nadia reasonably argues that agents sharing her evidence and reasoning patterns (e.g., Bayesian updating, utilitarian calculus) are empirically likely to share her benevolent values. This makes a positive aggregate payoff plausible, turning Rafi’s objection into a demand for an extra premise (predominant benevolence), not a disproof.  

  3. **Rafi’s (3): Reference class problem—no objective way to define "correlated agents".**  
     - **Rating:** △ (Partly Correct, but overreaching).  
     - **Justification:** Rafi is right that different reference classes (e.g., "same species" vs. "same source code") yield different multiplicity factors, introducing arbitrariness. However, this is a general problem for evidential decision theory (EDT), not unique to Nadia’s argument. It does not inherently invalidate her application if plausible classes align.  

  4. **Nadia’s Reply (3): Objection applies to all EDT; stability across plausible classes suffices.**  
     - **Rating:** ✓ (Clearly Right).  
     - **Justification:** Nadia correctly notes that the reference class problem is endemic to EDT (e.g., in Newcomb’s Paradox). Her requirement for "stability across plausible classes" is pragmatic: if all defensible reference classes make cooperation better news (e.g., in high-stakes altruism), the argument holds. Rafi’s concern is valid but not decisive.  

  5. **Rafi’s (5): Proves too much (extends to beliefs/infinities).**  
     - **Rating:** ✘ (Clearly Mistaken) on beliefs; △ (Partly Correct) on infinities.  
     - **Justification:**  
       - **Beliefs:** Rafi’s claim that the argument licenses self-modification for distant copies’ beliefs is mistaken. As Nadia retorts, belief valuation depends on *truth*, not instrumental good. EDT for action does not imply "believing without evidence" — only that practical choices leverage evidential links.  
       - **Infinities:** Rafi is partly right that infinite agents complicate aggregation (e.g., no finite multiplicity factor). But this is a known problem in infinite ethics (e.g., the "measure problem" in cosmology), not a disproof of finite cases.  

  6. **Nadia’s Reply (5): Finite largeness suffices; infinities require separate ethics.**  
     - **Rating:** ✓ (Clearly Right).  
     - **Justification:** Nadia concedes the infinite case is unresolved but notes her argument only requires a large *finite* world (e.g., a multiverse with \(10^{100}\) agents). This is sound: if multiplicity is finite and large, the evidential payoff can dwarf costs. Rafi’s infinity objection is a distraction from the core finite case.  

  ---

  ### Core Premise and Settleability  
  - **Premise the dispute turns on:** *"Correlated agents predominantly share my values (benevolence)."*  
  - **Settleability:** This is **empirical**, not purely philosophical. It depends on cosmology (e.g., whether multiverse theories imply value homogeneity) and psychology (e.g., whether reasoning methods causally track moral ends). It could be settled by argument (e.g., evolutionary game theory) but ultimately requires cosmological/empirical evidence.  

  ---

  ### Overall Verdict  
  - **Who has the better argument:** **Nadia** (marginally).  
  - **Specifically:** Nadia successfully defends the *coherence* of her EDT-based argument under large finite worlds. Rafi’s objections highlight risks (value alignment, reference classes) but fail to refute the logic. Nadia’s concessions (infinities need separate handling; benevolence is empirical) strengthen her credibility.  
  - **Where Rafi succeeds:** He forces Nadia to clarify her premises (benevolence must be assumed; stability matters more than precision).  

  ---

  ### What Both Missed  
  1. **Causal Decision Theory (CDT) counterargument:** Rafi could have argued that EDT’s "evidence" framework conflates correlation with causation. In standard Newcomb cases, EDT often recommends "irrational" choices (e.g., one-boxing) — a tension Nadia overlooks.  
  2. **Empirical grounding:** Neither explores *how* to test correlation strength or value alignment (e.g., via simulations or anthropic reasoning).  
  3. **Practicality:** Nadia assumes a "large but finite" world is given, but its likelihood (per cosmology) is undefended.  

  ---

  ### Summary  
  Nadia’s argument survives scrutiny: in large finite worlds, EDT *can* recommend cooperation with correlated agents if value alignment is plausible. Rafi’s objections are valuable caveats but not fatal. The debate hinges on empirical premises about the universe and human psychology, not pure logic.
