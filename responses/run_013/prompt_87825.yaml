prompt: |-
  I'm a second-year PhD student in cognitive science, and I help run a small student podcast that sits somewhere between a reading group and an interview series. Next month our guest is a researcher who works on concept induction from sparse examples and who has spent the last few years arguing — against what he treats as the received framing — that the interest of Bongard-style puzzles has almost nothing to do with the fact that they present only a handful of labelled figures. His line, as I've reconstructed it from abstracts and one rather dense preprint, is that what a solver actually has to do is re-describe the raw figures in a vocabulary of parts, orientations, and spatial relations, and that a puzzle's difficulty is set by what he calls the "description gap": the distance between the most natural perceptual description of the figures and the description under which the target concept comes out simple. He likes to say this is why adding more examples to a puzzle usually buys you nothing, and why some puzzles with a single contrasting pair are trivial while others with a dozen instances stay hard. To make the discussion concrete I've been toying with a puzzle of my own: on one side, figures that each contain a triangle whose apex points toward the nearest edge of an implicit bounding frame; on the other, triangles whose apex points away from the nearest edge. Intuitively nothing in the figures as drawn changes — only the frame-relative orientation does — which seems to be exactly the kind of case his account is built to explain, though I'm not sure it isn't also the kind of case that makes the account circular.

  Could you draft eight to ten interview questions that press on the substance of the view rather than let him restate the slogan? I'd like at least one question on why he thinks the number of examples is a red herring, one on how the description gap is supposed to be defined and measured without tacitly presupposing the very hypothesis the solver is meant to find, one on how his position differs from Bayesian program-induction and minimum-description-length accounts of the same puzzles (including whether it is meant as a rival to them or a reframing of the same data), and one on the frame-relative puzzle above, since I suspect his answer there will be the most revealing. For each of the central questions, please add a follow-up keyed to the answer he's most likely to give — so that if he retreats to the claim that re-description is a "capacity" rather than a measurable quantity, or insists that the gap is fixed by the solver's prior vocabulary rather than by the figures, the next question already has him in view. Please close with a question about what evidence could count against the account, and make it one he can't answer by pointing to further confirming puzzles.
reasoning: |-
  Okay, the user is a PhD student in cognitive science running a podcast that blends a reading group with interviews. They're preparing for an interview with a researcher who challenges the common view on Bongard puzzles, arguing that the key isn't the number of examples but the "description gap" between perceptual descriptions and conceptual simplicity. The user has created their own puzzle involving frame-relative triangle orientations to test this theory and wants substantive questions that avoid letting the guest just restate his main points.

  I need to craft 8-10 interview questions that dig into the core of his theory. The user specifically wants questions on: why example count is a red herring, how the description gap is defined without circularity, how this differs from Bayesian/MDL accounts, and their frame-relative puzzle example. Each main question should have a prepared follow-up anticipating likely responses. The closing question should ask about potential counterevidence that isn't just more puzzle examples.

  For the example count question, I'll focus on why extra examples don't help. The follow-up should challenge if this makes the theory unfalsifiable. For the description gap definition, I'll question how it's measured independently. The follow-up should address if it's just about solvers' prior vocabulary. For the Bayesian/MDL comparison, I'll ask how his view relates to these frameworks. The follow-up should press on whether it's truly a rival or just a reframing. For the frame-relative puzzle, I'll present the user's example and ask why it's not circular. The follow-up should challenge if this reduces to "finding the frame."

  The closing question needs to identify evidence that could falsify the theory beyond puzzle design. This might involve real-world data or solver behavior that contradicts predictions. I'll structure the questions to build logically, with follow-ups ready to engage with defensive responses. The tone should be respectful but probing, avoiding gotcha moments while pressing for testable claims.
answer: |-
  Here are 10 interview questions (with embedded follow-ups) designed to press the substance of the researcher's view on Bongard puzzles, description gaps, and concept induction:

  **Core Questions & Anticipated Follow-Ups:**

  1.  **On the Red Herring of Example Count:** You argue that the number of examples in Bongard puzzles is largely a red herring for their core difficulty, emphasizing the "description gap" instead. But many classic accounts of induction (like PAC learning) explicitly link sample complexity to concept learnability. Why is the number of examples *so* secondary here, especially when intuitively, more examples *should* provide more constraints or reduce ambiguity?
      *   *Likely Response/Follow-Up Target:* If he argues extra examples often don't provide *new* information about the critical re-description needed...
      *   **Follow-Up:** Doesn't this risk making your account unfalsifiable? If more examples *do* demonstrably help solvers on some puzzles, could you always explain it by claiming those examples *did* accidentally help bridge the description gap (e.g., by making a relational pattern more salient), rather than providing more statistical evidence? How could we distinguish these?

  2.  **Defining & Measuring the Description Gap (Circularity Challenge):** The "description gap" is central – the distance between the initial perceptual description and the simple conceptual description. How do you define and measure this gap *objectively* or *independently* of the solver's eventual success? Specifically, how do you avoid tacitly defining the gap *in terms of* the difficulty of finding the solution, which would make the explanation circular ("it's hard because the gap is large, and we know the gap is large because it's hard")?
      *   *Likely Response/Follow-Up Target:* If he appeals to the inherent properties of the figures or the "naturalness" of descriptions defined by perceptual primitives (parts, relations)...
      *   **Follow-Up:** Who defines "naturalness" and the primitive vocabulary? If it's defined relative to the solver's perceptual system or prior knowledge (e.g., built-in primitives for edges, angles, proximity), doesn't the gap become fundamentally *subjective* or *solver-relative*? How does this differ from simply saying "some concepts are harder for humans to perceive or conceive"?

  3.  **Relation to Bayesian Program Induction & MDL:** Your focus on finding a re-description yielding a "simple" concept sounds reminiscent of Bayesian program induction or Minimum Description Length (MDL) approaches, which also seek compact representations balancing fit and complexity. How does your "description gap" account *differ* from these frameworks applied to Bongard puzzles? Is it a rival account proposing a different mechanism, or is it a reframing emphasizing a specific aspect (the perceptual/semantic leap) that those frameworks might underemphasize?
      *   *Likely Response/Follow-Up Target:* If he argues MDL/Bayesian accounts focus on the *computational* problem of searching the hypothesis space defined by a fixed language, while his account focuses on the *perceptual/cognitive* problem of constructing the right descriptive language/vocabulary itself...
      *   **Follow-Up:** But don't hierarchical Bayesian models or grammar induction approaches within MDL *also* involve learning or selecting the vocabulary/primitives? If the "description gap" is bridged by acquiring new primitives or relations, isn't that just program induction/grammar learning? Is the core claim then that Bongard puzzles primarily tax our capacity for *perceptual re-representation* rather than (or prior to) hypothesis search?

  4.  **The Frame-Relative Puzzle Test Case:** Consider this puzzle: Left side figures show a triangle with apex pointing *towards* the nearest bounding frame edge; Right side shows apex pointing *away*. Intuitively, the figures themselves are identical; only the implicit frame relation changes. Your account seems tailor-made to explain why this is hard – the natural perceptual description ignores the frame, creating a large gap. But isn't this also dangerously circular? The *only* evidence for the "natural description" ignoring the frame *is* the difficulty itself. How do we independently establish that the initial description *excludes* the frame relation, other than by observing the solver's struggle?
      *   *Likely Response/Follow-Up Target:* If he argues that perceptual salience (Gestalt principles, attention) naturally focuses on figure properties over ground/frame relations for isolated objects, making the frame relation non-salient initially...
      *   **Follow-Up:** Couldn't one argue that the core challenge here is simply *noticing the relevance of the frame itself*? If a solver immediately considers frame-relative relations (perhaps due to experience or priming), doesn't the puzzle become trivial *without* any complex re-description of the triangle's intrinsic properties? Doesn't this suggest the gap isn't about re-describing the figure's *parts*, but about *attending to the contextual cue* (the frame)? How does this fit your "parts, orientations, spatial relations" core?

  5.  **The Nature of "Re-description":** You emphasize "re-description" as the key process. Is this primarily a process of *selecting* relevant relations from an existing perceptual vocabulary, or does it involve *generating* novel primitive features or relations not initially perceived? If the latter, how does this differ from traditional "feature creation" or "conceptual change"?
      *   *Likely Response/Follow-Up Target:* If he leans towards selection/composition from existing primitives...
      *   **Follow-Up:** Doesn't this bring us back closer to the hypothesis search view? If it's composition, isn't the difficulty then about the *combinatorial complexity* of searching the space of possible relations built from primitives, rather than a distinct "gap"? How is this *not* just MDL/Bayesian search with a specific perceptual language?

  6.  **Predictive Power & Puzzle Design:** If the description gap is the key determinant of difficulty, could you provide concrete, falsifiable predictions for puzzle designers? For instance, if I start with simple figures and a small gap, and then systematically modify the figures to *increase* the gap (e.g., by adding distracting intrinsic features) *without changing the underlying concept*, should difficulty increase monotonically? What specific manipulations demonstrably widen the gap?
      *   *Likely Response/Follow-Up Target:* If he gives examples like adding texture, irrelevant parts, or breaking symmetry...
      *   **Follow-Up:** How do you isolate the effect of the "description gap" from the effect of simply increasing visual complexity or cognitive load, which would make *any* puzzle harder regardless of the core concept? What experiment controls for this?

  7.  **Beyond Bongard: Real-World Induction:** Bongard puzzles are highly artificial. How does the "description gap" account scale to real-world sparse concept induction, like a child learning "dog" from few examples? Is the gap defined relative to innate perceptual primitives, or does prior knowledge dynamically shape the "initial description"? Does this make the gap less of an objective property of the stimulus?
      *   *Likely Response/Follow-Up Target:* If he emphasizes the role of prior knowledge shaping the initial description...
      *   **Follow-Up:** Doesn't this significantly blur the line between the "description gap" and the Bayesian notion of a *prior* over hypotheses (or languages)? If the initial description is knowledge-laden, is the gap just a measure of how surprising the simple concept is given the prior?

  **Closing Question (Falsifiability):**

  8.  **Evidence Against the Account:** What kind of empirical result or observed phenomenon, *outside* the specific context of designing new confirming Bongard puzzles, could genuinely count as evidence *against* the centrality of the description gap? For example, if neural data showed solvers rapidly converging on the target conceptual description *without* any discernible intermediate stage involving perceptual re-representation, would that challenge the model? Or if an AI system using pure statistical learning over raw pixels (no explicit symbolic re-description) solved puzzles deemed hard by your gap metric, would that undermine it? What *isn't* explained by the gap?

  **Key features of this set:**

  *   **Presses Core Claims:** Directly challenges the novelty on example count, the risk of circularity in defining the gap, and the relation to established frameworks.
  *   **Uses Concrete Test Case:** The frame-relative puzzle is used not just as an illustration, but as a probe for potential circularity.
  *   **Anticipates Deflections:** Follow-ups specifically target likely retreats (subjectivity, solver-capacity, collapsing into MDL/Bayes, difficulty vs. gap confounds).
  *   **Demands Falsifiability:** The final question pushes beyond the comfort zone of puzzle examples to demand what evidence could *disconfirm* the theory.
  *   **Builds Logically:** Questions progress from core claims (Q1-2) to comparisons (Q3), a critical test (Q4), mechanism (Q5), prediction (Q6), scope (Q7), and finally falsification (Q8).
  *   **Avoids Sloganeering:** Questions are phrased to require substantive engagement with mechanisms, definitions, comparisons, and evidence.

  Good luck with the interview! This sounds like a fascinating discussion. Pay close attention to how he navigates the frame-relative puzzle (Q4) and the falsifiability question (Q8) – those are likely to be the most revealing moments.
