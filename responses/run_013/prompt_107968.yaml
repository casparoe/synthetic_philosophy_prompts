  We are drafting a joint statement between two camps in a philosophy seminar: 
   1. Lexical threshold negative utilitarianism ("suffering-floor" picture)
   2. Commensurabilist hedonism ("single-ledger" picture)

   The goal is a document with:
   I. A numbered list of agreed claims (including about welfare structure, formal constraints, cases, and revision criteria)
   II. A table of residual disagreements, with each row containing:
       a. The precise disagreement
       b. The crux (the sub-question that would move at least one side)
       c. A concrete case, argument, or formal result that both sides agree would bear on the crux
       d. What each side predicts about that case/argument

   We must avoid strawmanning and ensure each side accepts the wording of their own position.

   Brainstorming:

   Agreed Claims:
   1. Both sides accept that suffering (negative welfare) and pleasure (positive welfare) are the primary bearers of value and disvalue, respectively.
   2. Both sides accept that an adequate axiology must satisfy basic formal constraints such as transitivity and dominance.
      - Transitivity: If A is better than B and B is better than C, then A is better than C.
      - Dominance: If A is at least as good as B in every respect and better in at least one, then A is better than B.
   3. Both sides agree that there are cases of mild widespread pain and rare intense pain that pose challenges, and that any axiology must account for such cases.
   4. Both sides agree that if a clear real-world case were found where one view yields obviously unacceptable implications (e.g., requiring extreme sacrifices for negligible gains or permitting extreme suffering for trivial benefits) that would be a reason to revise.
   5. Both sides agree that welfare has at least an ordinal structure, and that we can compare some states as better or worse than others.

   Disagreements:

   Core Disagreement 1: The existence of a lexical threshold (suffering floor)
     - Suffering-floor: There exists a level of suffering such that no amount of positive welfare can compensate for any instance of suffering below that level.
     - Single-ledger: No such threshold exists; for any suffering, there is some amount of positive welfare that can compensate for it.

   Crux for Disagreement 1: 
     - The crux is whether there is a discontinuity in the value function at a certain point in the negative welfare dimension.
     - Concrete case: Consider a choice between:
          Option A: One person experiences suffering of intensity S (which the suffering-floor camp considers below the threshold) and N people experience a very high pleasure P.
          Option B: No one experiences suffering S, and the N people experience a slightly lower pleasure P' (so that the total pleasure in B is less than in A, but there is no suffering).
       The suffering-floor camp will say that B is better than A no matter how large N and P are (provided S is below the threshold). The single-ledger camp will say that for sufficiently large N and P, A becomes better.

     Prediction:
        - Suffering-floor: B is always better.
        - Single-ledger: For large enough N, A is better.

   Core Disagreement 2: The commensurability of positive and negative welfare
     - Suffering-floor: Positive and negative welfare are not fully commensurable because below the threshold, negative welfare cannot be offset by positive welfare.
     - Single-ledger: Positive and negative welfare are fully commensurable on a single cardinal scale.

   Crux for Disagreement 2:
     - The crux is whether the value function is separable and additive in a way that allows trade-offs without any restrictions beyond the quantitative amounts.
     - Formal result: Consider the Archimedean axiom: For any three welfare states A, B, C, with A better than B and B better than C, there exists a probability p (0 < p < 1) such that a lottery between A and C is equally good as B for sure. 
       The single-ledger view must accept this axiom (because any pain can be compensated by a chance of a sufficiently large pleasure). The suffering-floor view rejects it for states below the threshold (because no chance of any amount of pleasure can compensate for a below-threshold suffering).

     Prediction:
        - Suffering-floor: The Archimedean axiom fails when B is a state of suffering below the threshold and A is a state of positive welfare (no matter how high) and C is a state of even worse suffering. They hold that B is worse than any lottery that has a positive chance of C (the worse suffering) but also that there is no lottery with a chance of A (positive) that makes it equivalent to B. Hence, the axiom fails.
        - Single-ledger: The Archimedean axiom holds for all states.

   Possible Verbal Disagreement:
     - The term "commensurable" might be interpreted differently. The single-ledger camp uses it to mean that there is a common cardinal scale. The suffering-floor camp might agree that there is comparability (e.g., we can say that one state is better than another) but denies that there is a cardinal scale that allows for full trade-offs without thresholds. However, in the core disagreement, the issue is not merely verbal because the suffering-floor camp denies that the trade-off is always possible.

   Additional Disagreement 3: The structure of aggregation
     - Both views might agree that we must aggregate welfare across individuals, but the suffering-floor view imposes a prioritarian constraint below the threshold: the avoidance of below-threshold suffering takes absolute priority. The single-ledger view aggregates without such priority.

   Crux for Disagreement 3:
     - Consider a case where we can prevent a single instance of below-threshold suffering at the cost of forgoing a very large amount of positive welfare (say, a large number of people missing out on a small pleasure). 
       The suffering-floor camp would say that preventing the suffering is required, no matter how many people miss out on the pleasure. The single-ledger camp would say that if the total positive welfare lost is large enough, we should not prevent the suffering.

     Prediction:
        - Suffering-floor: Prevent the suffering.
        - Single-ledger: If the total pleasure lost is sufficiently large, do not prevent the suffering.

   Now, we structure the document.

   Joint Statement:

   We, the proponents of the suffering-floor picture and the single-ledger picture, after extensive discussion, agree on the following points and clarify our remaining disagreements as follows.

   I. Agreed Claims:

   1. Nature of Welfare: Both sides agree that welfare is constituted by experiences of pleasure (positive welfare) and suffering (negative welfare). These are the primary bearers of value and disvalue in our axiological frameworks.

   2. Formal Constraints: Both sides accept that any adequate axiology must satisfy:
      a. Transitivity: If state of affairs A is better than B, and B is better than C, then A is better than C.
      b. Dominance: If state of affairs A is at least as good as state of affairs B in every respect and strictly better in at least one respect, then A is better than B.

   3. Handling of Cases: Both sides agree that any adequate axiology must provide a principled account of cases involving trade-offs between mild but widespread suffering and rare but intense suffering. We further agree that the resolution of such cases should not rely on ad hoc assumptions.

   4. Revision Criteria: Both sides agree that empirical discoveries about the nature of suffering and pleasure (e.g., neuroscientific findings about the intensity and incommensurability of different types of experience) or logical results (e.g., impossibility theorems arising from the combination of our axioms) could compel revision of either view. Moreover, both sides agree that if a view leads to practical implications that are clearly counterintuitive in a wide range of cases (e.g., requiring extreme sacrifices for negligible gains or permitting extreme suffering for trivial benefits), that would be a reason to revise the view.

   5. Ordinal Comparability: Both sides agree that welfare states are at least ordinally comparable: for any two welfare states, it is possible to say that one is better, worse, or they are equally good, or that they are incomparable. However, we note that our views differ on whether there are incomparable states (see disagreements).

   II. Table of Residual Disagreements:

   | Disagreement | Crux | Bearing Case/Argument | Prediction of Suffering-Floor | Prediction of Single-Ledger |
   |--------------|------|------------------------|-------------------------------|-----------------------------|
   | 1. Existence of a Lexical Suffering Threshold: The suffering-floor picture holds that there exists a level of suffering (the threshold) such that no amount of positive welfare, however large, can compensate for an instance of suffering below that threshold. The single-ledger picture holds that no such threshold exists; for any suffering, there is some amount of positive welfare that can compensate for it. | Whether the value function exhibits a discontinuity at a specific point in the negative welfare domain such that below that point, negative welfare cannot be traded off against positive welfare. | Case: Option A: One individual experiences suffering S (which the suffering-floor camp deems below the threshold) and N individuals each experience a very high pleasure P. Option B: No one experiences suffering S, and the N individuals each experience a slightly lower pleasure P' (so that the total positive welfare in B is less than in A). The suffering-floor camp holds that B is better than A regardless of the magnitude of N and P. The single-ledger camp holds that for sufficiently large N, A becomes better. | Suffering-Floor: B is better than A for any N and any P. | Single-Ledger: There exists some finite N (for fixed S, P, P') such that A is better than B. |
   | 2. Commensurability of Positive and Negative Welfare: The suffering-floor picture denies that positive and negative welfare are fully commensurable because below the threshold, negative welfare cannot be offset by positive welfare. The single-ledger picture holds that positive and negative welfare are fully commensurable on a single cardinal scale. | Whether the Archimedean axiom holds for all welfare states. The Archimedean axiom states: For any three welfare states A, B, and C, with A better than B and B better than C, there exists a probability p (0 < p < 1) such that a lottery between A (with probability p) and C (with probability 1-p) is equally good as B for sure. | Formal Argument: Consider A: a state of high positive welfare, B: a state of suffering below the threshold (for the suffering-floor camp) or a state of mild suffering (for the single-ledger camp), and C: a state of even worse suffering. The Archimedean axiom requires that there exists a lottery between A and C that is indifferent to B. The single-ledger camp accepts this. The suffering-floor camp rejects it for B below the threshold because they hold that any lottery that has a chance of C (which is worse than B) is worse than B, and no lottery that has a chance of A can compensate for the badness of B. | Suffering-Floor: The Archimedean axiom fails for B (when B is below the threshold) because there is no such p. | Single-Ledger: The Archimedean axiom holds for all states, including when B is a state of suffering. |
   | 3. Priority in Aggregation: The suffering-floor picture holds that preventing any instance of suffering below the threshold takes absolute priority over the accumulation of positive welfare. The single-ledger picture holds that preventing suffering and promoting positive welfare are to be weighed without absolute priority rules. | Whether the avoidance of a single instance of suffering (below the threshold) can be outweighed by a sufficiently large aggregate gain in positive welfare. | Case: We can prevent one instance of suffering S (below the threshold) at the cost of forgoing a very large amount of positive welfare: specifically, by making M individuals each forgo a small pleasure Q (so that the total positive welfare lost is M multiplied by Q). | Suffering-Floor: Preventing the suffering is required, regardless of the magnitude of M and Q (provided Q>0). | Single-Ledger: If M and Q are sufficiently large such that the total positive welfare lost (M*Q) exceeds the disvalue of S, then we should not prevent S. |

   Note: We have considered whether part of our disagreement is verbal. We agree that the term 'commensurable' is used in the same sense: both camps understand it as requiring that positive and negative welfare are measurable on a single cardinal scale and that trade-offs are always possible in principle. However, the suffering-floor camp denies that such trade-offs are always possible, so the disagreement is substantive.

   This document represents our current understanding and we commit to revisiting these points in light of new arguments or evidence.

   Signed:
   [Proponents of the Suffering-Floor Picture]
   [Proponents of the Single-Ledger Picture]
answer: |-
  ### Joint Statement on the Ethics of Suffering  
  **Adversarial Collaboration Between the Suffering-Floor and Single-Ledger Perspectives**  
  *Drafted in Good Faith by Seminar Participants*  

  #### I. Agreed Claims  
  Both parties affirm the following:  

  1. **Nature of Welfare**:  
     - Welfare is fundamentally experiential, grounded in conscious states. Pleasure (positive welfare) and suffering (negative welfare) are primary bearers of value/disvalue.  
     - Welfare exhibits *at least ordinal structure*: states can be ranked as better, worse, or equally good.  

  2. **Formal Constraints on Axiology**:  
     - **Transitivity**: If A is better than B and B is better than C, then A is better than C.  
     - **Strict Dominance**: If A is at least as good as B in every respect and strictly better in at least one, then A is better than B.  
     - **Non-Negotiable Axioms**: Transitivity and dominance are indispensable. Both sides acknowledge that continuity (or its rejection) is a substantive dispute (see §II).  

  3. **Treatment of Key Cases**:  
     - Cases involving *mild but widespread suffering* versus *rare but intense suffering* require careful analysis. Both agree that an adequate axiology must:  
       - Explain intuitive judgments about such cases (e.g., avoiding extreme suffering may sometimes outweigh distributing minor pains).  
       - Avoid arbitrariness in weighting mechanisms.  
     - Neither view collapses into trivializing suffering or pleasure.  

  4. **Revision Criteria**:  
     - Either view would be revised if:  
       - It violated transitivity or dominance.  
       - It implied clearly unacceptable practical prescriptions (e.g., permitting extreme suffering for trivial benefits).  
       - Empirical evidence revealed irreducible discontinuities (or continuity) in the neural/experiential structure of pain/pleasure.  

  5. **Scope of Disagreement**:  
     - The dispute is not about the *existence* of suffering or pleasure, but their *structural relationship*.  
     - Verbal disagreements (e.g., "commensurability" as *comparability* vs. *continuous tradeability*) are resolvable via stipulation (see §II).  

  ---

  #### II. Residual Disagreements  
  The table below catalogs unresolved disputes. Each position’s stance is formulated in terms acceptable to its proponents. "Cruxes" identify sub-questions whose resolution would advance the debate, and "Bearing Cases/Arguments" specify agreed-upon tests.  

  | **Disagreement**                                                                                                                                                               | **Crux**                                                                                                                              | **Bearing Case/Argument**                                                                                                                                                                                                                                                               | **Prediction of Suffering-Floor**                                                                                             | **Prediction of Single-Ledger**                                                                                              |
  |--------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|---------------------------------------------------------------------------------------------------------------------------------------|-----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|-------------------------------------------------------------------------------------------------------------------------------|------------------------------------------------------------------------------------------------------------------------------|
  | **1. Threshold Existence**: Suffering-floor asserts a lexical threshold ("floor") below which no amount of positive welfare can compensate for suffering. Single-ledger denies any such threshold. | Does welfare exhibit a *discontinuity* between negative and positive welfare such that below a point, trade-offs become impossible? | **Case**: *Threshold Test*: One person suffers at intensity S (putatively below the floor) while N people gain immense pleasure P. Vary N. Does B (no suffering, P slightly reduced) always dominate A (suffering S, full P)?                                                                 | **Suffering-Floor**: B ≻ A for any N. Suffering below the floor cannot be traded.                                            | **Single-Ledger**: ∃ finite N where A ≻ B. Trade-offs are continuous.                                                        |
  | **2. Commensurability Structure**: Single-ledger holds that pleasure and pain lie on a single cardinal scale permitting continuous trade-offs. Suffering-floor denies this below the threshold. | Must welfare satisfy the *Archimedean Axiom*? (For any bad state B, ∃ a probability p < 1 such that a lottery yielding B with probability p and a good state G with 1-p is worse than a neutral state.) | **Formal Axiom Test**: Apply the Archimedean Axiom to suffering below the putative floor (B), a high-pleasure state (G), and a neutral state (N). Does p always exist?                                                                                                                               | **Suffering-Floor**: Axiom fails for B below the floor. No p exists; B is lexically worse than any G/N lottery.               | **Single-Ledger**: Axiom holds universally. ∃ p for any B.                                                                   |
  | **3. Priority in Aggregation**: Suffering-floor assigns absolute priority to relieving suffering below the floor, regardless of aggregated gains. Single-ledger permits aggregation to override individual suffering. | Does preventing *one instance* of suffering below the floor always outweigh *any aggregate gain* in positive welfare?              | **Case**: *Prevention Dilemma*: Prevent one case of suffering S (below floor) by forgoing a massive positive welfare gain (e.g., depriving M people of small pleasure Q). Must we prevent S even if M → ∞?                                                                                | **Suffering-Floor**: Always prevent S. No aggregate gain justifies permitting S.                                             | **Single-Ledger**: Do not prevent S if M·Q > |disvalue(S)|. Aggregation can override.                               |
  | **4. Verbal Clarification**: "Commensurability" denotes a single cardinal scale allowing unit trade-offs. Suffering-floor rejects this *below the threshold* but accepts ordinal comparability universally. | None (resolved by stipulation).                                                                                                      | N/A                                                                                                                                                                                                                                                                                     | N/A                                                                                                                           | N/A                                                                                                                          |

  ---

  **Cruxes and Testing Protocol**:  
  - For **Crux 1** (*Threshold Test*), both sides agree that empirical data on whether subjects treat intense suffering as *infinitely* disvaluable (e.g., in psychological trade-off studies) would bear on the dispute.  
  - For **Crux 2** (*Archimedean Axiom Test*), both accept that if decision theory *requires* this axiom for rationality, its rejection would challenge suffering-floor’s coherence.  
  - For **Crux 3** (*Prevention Dilemma*), both agree neuroscientific evidence on whether suffering exhibits nonlinear intensity thresholds (e.g., pain “breaking points”) could inform the debate.  

  ---  
  **Signed,**  
  Proponents of the Suffering-Floor Picture  
  Proponents of the Single-Ledger Picture  

