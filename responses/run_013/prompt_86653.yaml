answer: |-
  Below is a decision tree designed to sort students by their responses to concrete cases, avoiding theoretical labels. It starts from a shared commitment (mental states sometimes *seem* to affect perception) and branches using key distinctions. Each node is phrased as a case-based question. The tree uses 6 nodes (questions) and results in 7 distinct leaves, covering the core views while noting limitations.

  ---

  ### **Cognitive Penetration of Perception Decision Tree**  
  *Start here: Most agree there are cases where your belief, desire, mood, or expectation seems to change what you experience (e.g., the sandwich looks bigger when hungry).*

  #### **Node 1: The Müller-Lyer Illusion Case**  
  *After measuring and knowing the two lines are equal, do they still look unequal to you?*  
  - **Yes (look unequal)** → Go to Node 2  
  - **No (look equal)** → *Rare! Most answer "yes." If "no," you likely think experience can change directly; skip to Node 4.*  

  #### **Node 2: The Radiologist Case**  
  *A radiologist reports a faint nodule a novice misses. Is the radiologist’s visual experience different (e.g., does she literally *see* the nodule)?*  
  - **Yes (experience differs)** → Go to Node 3  
  - **No (same experience, different judgment/confidence)** → Go to Node 5  

  #### **Node 3: The Dog Phobia Case**  
  *A person afraid of dogs sees a friendly dog as threatening. Is this change:  
  (A) Always proportionate to their fear (e.g., less threatening if they know it’s trained), OR  
  (B) Sometimes irrational (e.g., still looks threatening even if they know it’s friendly)?*  
  - **A (tracks reasons)** → Go to Node 4  
  - **B (brute/automatic)** → **Leaf: Brute-Association View**  
    *Awkward: Accepts that perception can be hijacked by irrational associations (e.g., phobias) without justification.*  

  #### **Node 4: The Hungry-Sandwich Case**  
  *A hungry person sees a sandwich as larger than a full person does. Could this happen even if they’re distracted and not focusing on the sandwich?*  
  - **Yes (automatic, not attention-driven)** → **Leaf: Direct-Content-Penetration View**  
    *Awkward: Claims moods/desires (e.g., hunger) directly warp size/color/shape early in perception.*  
  - **No (only if they attend to it)** → **Leaf: Attention-Mediated-Only View**  
    *Awkward: Must explain all "top-down" effects as late attention shifts (e.g., expertise, fear).*  

  #### **Node 5: The Expensive-Wine Case**  
  *A wine tastes more complex after you’re told it’s expensive. If you *try* to ignore the price, does it still taste different?*  
  - **Yes (taste change persists)** → Go to Node 6  
  - **No (taste reverts when ignoring)** → **Leaf: Encapsulation/No-Penetration View**  
    *Awkward: Denies cognitive states affect *any* experience; all effects are judgment/post-perceptual.*  

  #### **Node 6: The Grandmaster Case**  
  *A chess grandmaster sees a winning move "at a glance." Is this:  
  (A) Perceptual learning (e.g., like radiologists, honed through practice), OR  
  (B) Just fast inference from a familiar board?*  
  - **A (perceptual learning)** → **Leaf: Perceptual-Learning-Is-Different View**  
    *Awkward: Treats trained expertise (e.g., radiologists) as distinct from "true" penetration.*  
  - **B (inference)** → **Leaf: Predictive-Weighting Redescription**  
    *Awkward: Redescribes *all* effects (e.g., hunger, fear) as Bayesian priors, denying "penetration" exists.*  

  ---

  ### **Leaves & Diagnostics**  
  1. **Brute-Association View**: Reached via Node 3B. Awkward: Allows perception to be distorted by non-rational states (e.g., phobias).  
  2. **Direct-Content-Penetration View**: Reached via Node 4 "Yes." Awkward: Claims desires/moods directly alter content (e.g., sandwich size).  
  3. **Attention-Mediated-Only View**: Reached via Node 4 "No." Awkward: Reduces all effects to attention shifts.  
  4. **Encapsulation/No-Penetration View**: Reached via Node 5 "No." Awkward: Explains away all cases (e.g., radiologist) as judgment.  
  5. **Perceptual-Learning-Is-Different View**: Reached via Node 6A. Awkward: Seals off expertise from "threatening" penetration cases.  
  6. **Predictive-Weighting Redescription**: Reached via Node 6B. Awkward: Dissolves penetration into ordinary Bayes.  
  7. *Missing Leaf*: **Epistemic-Penetration View** (threatens justification) isn’t cleanly separated. It overlaps with Node 3B/4 but requires a separate "threat" question (cut for space). *Diagnosis*: Unattractive to most, so rarely held alone.  

  ### **Unresolved Pairs & Notes**  
  - **Direct-Content vs. Predictive-Weighting**: Not cleanly separated. If you answer Node 4 "Yes" and Node 6 "B," you could endorse either. *Why*: Predictive theorists often absorb direct penetration into Bayes.  
  - **Epistemic-Penetration View**: Requires an extra node (e.g., *"Does the orange-card-looking-red justify believing it’s red?"*). Cut for brevity; emerges in Node 3B/4 paths.  
  - **Everything-Is-Penetration View**: Collapses into Direct-Content (Node 4) or Predictive-Weighting (Node 6B). No unique path. *Why*: Combines with other views coherently.  
  - **Gaps in Tree**:  
    - No path for "only beliefs penetrate" (Node 3 would likely route to Direct-Content).  
    - No path for "penetration is fine for epistemology" (it’s distributed: Direct-Content/Predictive deny threat).  
    *Diagnosis*: These are unexamined or absorbed by broader views.  

  **Tree Logic**: Uses 6 cases (Müller-Lyer, radiologist, dog phobia, sandwich, wine, grandmaster) to force distinctions. Limits: Epistemic-Penetration isn’t isolated, and Perceptual-Learning overlaps with Predictive-Weighting. Designed for one page—focuses on the best-studied divides.
