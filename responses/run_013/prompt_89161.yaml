  Hmm, this is a classic philosophy of language impasse. The user's hypothesis about divergent theoretical goals seems spot-on. Let me unpack why this runs deeper than data disputes. 

  First, the context-sensitivity problem: when "If you mowed the lawn..." flips between indicative and counterfactual based on speaker knowledge, is that due to lexical ambiguity? Probably not - but the camps split on whether to build this into semantics (first camp) or treat it as modal base manipulation (second camp). The third camp's morphological view dodges this by making "remoteness" grammatical. 

  The biconditional intuition is even more telling. Those wanting semantics to predict it likely view meaning as encompassing speaker commitments (so "if P, Q" pragmatically implies "only if P, Q" via Gricean reasoning). Others insisting it's purely conversational see semantics as truth-conditional machinery. 

  *scribbles mental notes* The core tension is between: 
  (A) Semantics as modeling mental states (where acceptability conditions matter) 
  (B) Semantics as modeling truth in worlds (where embedding behavior is king) 
  (C) Semantics as syntactic feature (where morphology does heavy lifting)

  No wonder they're stuck! Progress might require meta-questions: What would falsify each view? For instance: 
  - If we found a language where both conditionals use identical morphology but distinct pragmatics, that hurts the grammatical camp. 
  - If probabilistic embeddings behaved uniformly across indicatives/counterfactuals, that challenges the two-animals view. 

  User's group should probably shift to discussing theory-choice criteria. Ask: "If your view is right, what phenomenon *couldn't* exist?" That forces explicitness about commitments. Also, examining biscuit conditionals ("There are biscuits if you want some") might reveal if "if" has a unified core. 

  Ultimately, they might need to accept pluralism: different semantic frameworks serve different purposes, like how Newtonian vs quantum mechanics both have utility. The "change the question" approach isn't surrender - it's intellectual hygiene.
answer: |-
  Your diagnosis is impressively sharp—you've hit the nail on the head. The core disagreement *is* fundamentally about **what semantic theories are for** and **where to draw the line between semantics and pragmatics**. Let me break down why this explains the stalemate and suggest a path forward.

  ### The Real Divide: Competing Theoretical Goals
  1. **Truth-Conditional Purists** (e.g., Lewis/Stalnaker-inspired):  
     - Goal: Predict truth conditions across embeddings (e.g., in negation, modals, attitude reports).  
     - View: Counterfactuals have *worldly truth conditions* (e.g., similarity of worlds), while indicatives are *epistemic* (e.g., conditional probability).  
     - Why they’re stuck: They insist the "open possibility" flip (e.g., "If you mowed the lawn…") reflects semantic ambiguity because truth conditions *must* differ when the speaker’s epistemic state changes.

  2. **Unified Modalists** (e.g., Kratzer-style):  
     - Goal: Capture compositional economy. A single `if` + contextual modal base/ordering source.  
     - View: The indicative/counterfactual contrast reduces to:  
       - Tense (past morphology → "remoteness")  
       - Modal base (realistic vs. counterfactual)  
       - Common ground (what’s "live" or presupposed).  
     - Why they’re stuck: They treat the "flip" as pragmatic—context shifts the modal base, not the meaning of `if`.

  3. **Grammaticalists** (e.g., Iatridou on "fake past"):  
     - Goal: Map syntax to interpretation directly.  
     - View: Past tense morphology marks *non-actuality*, not time.  
     - Why they’re stuck: This morphosyntactic distinction doesn’t resolve whether the *source* of non-actuality (epistemic vs. metaphysical) is semantic or pragmatic.

  ### Why You Can’t Settle the Two Issues:
  - **The "Flip" (context-sensitivity)**:  
    - **Purists** see it as semantic ambiguity (two lexical `if`s).  
    - **Unifiers** see it as contextual parameter adjustment (one `if` + flexible modal base).  
    - **Grammaticalists** see it as morphological triggering.  
    → *Stalemate because*: Each camp prioritizes different evidence (embedding behavior vs. economy vs. syntax).

  - **The "Biconditional" Effect**:  
    - **Purists** say: If semantics must predict speaker commitments (e.g., "I’ll pay *only* if you mow"), it’s semantic.  
    - **Unifiers/Grammaticalists** say: This is Gricean (strengthening to biconditional via implicature).  
    → *Stalemate because*: Disagreement on whether "what’s said" includes pragmatic enrichment.

  ### A Path Forward: Reframing the Question
  Instead of "What is the semantics of `if`?", ask: **"What phenomena must a theory of conditionals explain, and what tools explain them best?"** Test each camp against these benchmarks:

  | Phenomenon                  | Truth-Conditional Purists | Unified Modalists | Grammaticalists |
  |-----------------------------|---------------------------|-------------------|-----------------|
  | Embedding under negation    | ✅ Strong                 | ⚠️ Needs work    | ❌ Weak         |
  | Probability judgments       | ❌ Weak                   | ✅ Strong         | ⚠️ Mixed        |
  | Morphosyntactic triggers    | ❌ Weak                   | ⚠️ Adequate      | ✅ Strong       |
  | Contextual "flips"          | ❌ (Overgenerates)        | ✅ Strong         | ⚠️ Adequate     |
  | Biscuit conditionals*       | ❌ Fails                  | ✅ Strong         | ⚠️ Adequate     |

  *("There are biscuits if you want some" – no truth-functional link)*

  ### Two Concrete Resolutions to Propose:
  1. **The Formal Result That Forces a Choice**:  
     - **Gibbard’s Collapse Argument**: If indicatives are material conditionals, "If A, B" should be equivalent to "If A∧C, B" when A implies C. But this fails (e.g., "If it rains, the match is canceled" ≠ "If it rains and the captain is bribed, the match is canceled").  
     - *Why it matters*: This *requires* either (a) treating indicatives as non-truth-functional (hurting unifiers), or (b) adding epistemic constraints (helping unifiers). Forces truth-conditionalists to abandon the material conditional.

  2. **The Underappreciated Distinction**: **Projection Behavior**  
     - Counterfactuals project presuppositions from the antecedent (e.g., "If John were here..." presupposes he isn’t).  
     - Indicatives don’t ("If John is here..." implies nothing).  
     - *Why it breaks new ground*: This is a *semantic* difference even unifiers must explain via modal base constraints. It shifts focus to how conditionals interact with common ground.

  ### Recommendation: Change the Question
  Your group needs **meta-semantic calibration**. Try this exercise:  
  1. **List what "data" a theory must predict**:  
     - Truth values in embedded contexts?  
     - Acceptability judgments?  
     - Probabilities assigned by speakers?  
     - Presupposition projection?  
     *(Until you agree on this, debating theories is futile.)*  

  2. **Ask: "What would falsify your view?"**  
     - Purists: Find an indicative with worldly truth conditions?  
     - Unifiers: Find a language where indicative/counterfactual `if` aren’t morphologically related?  
     - Grammaticalists: Find a past-tense conditional without counterfactuality?  

  3. **Switch to biscuit conditionals or conditional questions** ("What if it rains?"). These expose whether `if` has a unified core.

  ### If Your Hypothesis is Off?
  If it’s not about theoretical goals, it might be about **implicit commitments to realism vs. anti-realism**:  
  - Realists: Counterfactuals track mind-independent relations (→ semantic split).  
  - Anti-realists: Both conditionals express epistemic constraints (→ unified view).  
  But your diagnosis feels more plausible—this is a fight about explanatory priorities in theorizing, not metaphysics.

  **Bottom line**: The stalemate is classic philosophy of language. Progress requires clarifying what counts as "meaning" and what the theory owes to syntax, context, and use. Shift from "Which theory is right?" to "What job do we want this theory to do?"—and the fog will lift.
