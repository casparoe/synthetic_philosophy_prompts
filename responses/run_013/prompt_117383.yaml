prompt: |-
  I'm a journalist who covers science and ideas, and I was at a conference last week where I ended up at the bar with two philosophers, Maya and Dev, who got into a long argument about decision theory. I didn't follow all of it, but I took notes, and I'm hoping you can help me sort out who's right about what. I don't have a dog in the fight — I just want to know which moves were good and which were bad. Also, I should say up front that I don't know alot about decision theory, so please explain things in plain language where you can.

  Here's what they said, as best I can reconstruct it.

  Maya started with a puzzle she called counterfactual mugging. She said: imagine Omega, a perfect predictor, flips a coin. If it comes up tails, Omega asks you for $100. If it comes up heads, Omega gives you $10,000, but only if it predicted that you would have paid if the coin had come up tails. You know all this in advance. The coin comes up tails. Should you pay? Maya said yes, you should pay, because your decision to pay on tails is what makes it true that you would have paid on tails, and that's what gets you the $10,000 in the heads branch. If you refuse, you're the kind of person who wouldn't pay, so you don't get the $10,000 in the heads branch. She said this shows that your decision isn't just about the causal consequences in the branch you're actually in — it's about what your decision procedure implies about the counterfactual branches.

  Dev said that's crazy. He said once the coin has come up tails, the heads branch didn't happen. You're not in it. Paying $100 just loses you $100. He said the only reason to pay is if you had pre-committed before the coin flip, but you didn't, and you can't retroactively commit. He said Maya is treating the predictor's prediction as if it's still up in the air, but it's not — it's already made, and it was based on what you would do, which is exactly what you're now deciding. He said if you're the kind of person who pays, then the predictor predicted that, and you get the $10,000 in the heads branch, but in the tails branch you still just lost $100. He said the fact that you would have gotten $10,000 in a branch that didn't happen is not a reason to pay in the branch that did.

  Maya said that's the whole point — you can't separate your decision in the tails branch from your decision procedure, because the predictor predicts your decision procedure. If you decide now not to pay, that means your decision procedure is one that doesn't pay, and that's what the predictor predicted, so you don't get the $10,000. She said Dev is assuming that your decision now is isolated from the counterfactual, but it's not.

  Then Maya brought up XOR blackmail. She said: imagine a blackmailer sends a letter to you and one other person. The letter says: "I have placed a bomb. The bomb will explode if and only if exactly one of you pays me $1000. If both of you pay, or neither of you pays, the bomb will not explode." You can't communicate with the other person. Should you pay? Maya said this is a problem for causal decision theory, because your payment doesn't causally affect the other person's payment. But your decision is evidence about what the other person will do, since you're both in the same situation and likely to reason similarly. If you pay, that's evidence the other person pays, so the bomb doesn't go off. If you don't pay, that's evidence the other person doesn't pay, so the bomb doesn't go off. She said evidential decision theory says you should choose the action that is most correlated with the good outcome, and since paying is correlated with the other person paying, you should pay. She said if you think that's absurd, you need to explain why.

  Dev said no, that's not right. He said XOR blackmail is a coordination problem, not a decision-theory problem. He said the right answer is to not pay, because paying rewards a criminal and encourages more blackmail. He said if both people are rational and know each other, they'll both refuse, and the bomb won't go off. He said if the other person is irrational and pays, then you're in trouble either way: if you pay, exactly one pays (the other person), so the bomb goes off; if you don't pay, exactly one pays (the other person), so the bomb goes off. So paying doesn't help. He said the only way paying helps is if the other person doesn't pay, but if you think the other person doesn't pay, then you should not pay, because if you pay and they don't, exactly one pays, so the bomb goes off. He said if you think the other person will pay, then you should pay, because if you don't, exactly one pays, so the bomb goes off. So it's a coordination game: you want to match the other person's action. Dev said that means the right answer depends on your beliefs about the other person, and their's no universal answer. He said Maya is trying to turn a coordination problem into a decision-theory problem, and that's a mistake.

  Maya said that's exactly the point: your beliefs about the other person are not independent of your decision, because you're both reasoning from the same principles. If you decide to pay, that's evidence the other person will pay, because they're in the same situation and likely to make the same decision. She said this is what evidential decision theory captures: your action is evidence about the world, not just a causal intervention. She said Dev's "just don't pay" is not a decision theory; it's a policy that only works if the other person also follows it, and you can't be sure they will. She said if you're a causal decision theorist, you have to base your decision on your belief about the other person, but your belief about the other person should be updated based on your own decision, because your decision is evidence about theirs. She said that's the whole point of XOR blackmail: it shows that causal decision theory is unstable under self-knowledge.

  Dev said that's circular. He said you can't choose your evidence. Your decision is evidence, but you can't make the other person pay by paying. He said if you're a causal decision theorist, you reason: "My payment doesn't causally affect the other person's payment. So I should choose the action that maximizes expected utility given my belief about the other person's action. My belief about the other person's action is based on my knowledge of their rationality, their incentives, and their likely reasoning. It's not based on my own action, because my action is not a causal factor in their decision." He said if you think the other person is likely to pay, you should pay; if you think they're likely not to pay, you should not pay. He said that's a perfectly coherent decision theory, and it doesn't require any spooky correlation. He said Maya is just smuggling in a correlation that isn't there.

  Maya said the correlation is there because you're both using the same decision theory. If you're both causal decision theorists, and you both know each other's beliefs, then you'll both reason the same way. She said that means your decision is a function of your beliefs, and the other person's decision is a function of their beliefs, and if your beliefs are similar, your decisions will be similar. She said that's a real correlation, and evidential decision theory takes it into account. She said Dev's position is that you should ignore the correlation, which means you might end up with exactly one paying, which is the worst outcome.

  Dev said that's not right. He said if you're both causal decision theorists, and you both know each other's beliefs, then you'll both reason: "If I think the other person will pay, I should pay; if I think they won't, I should not pay." But that's not a stable equilibrium, because your belief about the other person's action depends on your belief about their belief about your action, and so on. He said the only stable equilibrium is for both to not pay, because if both think the other will not pay, then both should not pay, and that's consistent. He said if both think the other will pay, then both should pay, and that's also consistent, but it's not the only equilibrium. He said the question is which equilibrium you should aim for, and the answer is the one where you don't reward blackmailers. He said Maya's evidential decision theory might get you to the paying equilibrium, but that's a bad equilibrium.

  Maya said that's a fair point, but she said the paying equilibrium might be better if the bomb is really bad. She said if the bomb is catastrophic, you might want to pay to avoid it, even if it rewards the blackmailer. She said the decision should depend on the stakes, and evidential decision theory lets you weigh the correlation against the cost. She said Dev's "never pay" is a deontological rule, not a decision-theoretic result.

  Dev said that's fine, but he said Maya is still wrong to say that causal decision theory can't handle XOR blackmail. He said causal decision theory can handle it perfectly well: you just need to model the other person's decision as a function of their beliefs, and then choose the action that maximizes expected utility. He said the fact that your action is correlated with the other person's action doesn't mean it causes it, and you shouldn't treat correlation as causation. He said that's the fundamental error in evidential decision theory, and XOR blackmail is just a particularly vivid illustration of it.

  Maya said that's the fundamental disagreement: whether correlation without causation can be a reason for action. She said in counterfactual mugging, the correlation is between your decision in the tails branch and the predictor's prediction in the heads branch, and that correlation is what gets you the $10,000. She said if you ignore correlation, you lose the $10,000. She said that's a real cost, and causal decision theory can't explain why you should pay. Dev said causal decision theory can explain it: if you could pre-commit, you should; but if you didn't, you shouldn't pay. He said the fact that you would have been better off if you had pre-committed is not a reason to pay now. He said that's the same as any sunk-cost situation: you can't get the $10,000 back by paying $100 now. He said Maya is confusing the value of a decision procedure with the value of a particular action.

  Maya said that's not right, because the predictor predicts your decision procedure, not your pre-commitment. She said if your decision procedure is "pay on tails," then the predictor predicted that, and you get the $10,000 in the heads branch. She said if your decision procedure is "don't pay on tails," then the predictor predicted that, and you don't get the $10,000. She said the decision procedure is what matters, and your action on tails is part of that procedure. She said you can't separate them. Dev said you can separate them: your decision procedure is what you would do in various situations, and your action now is what you do in this situation. He said if you're in the tails branch, your decision procedure has already been predicted, and you can't change it by paying now. He said paying now is just a mistake.

  Okay, that's the argument. Can you go through it move by move and say who's right about what? I'd like you to rate each of the main moves — say, the ones I've put in separate paragraphs — as clearly right, mostly right, partly right, mostly wrong, or clearly wrong, and give a brief justification for each rating. Then say what each person is missing, and give an overall verdict on who is more right. Please don't just say "it depends" — I want a real adjudication, with reasons. And at the very end, put a last line that begins "Verdict:" and summarizes your overall call in a short phrase.
