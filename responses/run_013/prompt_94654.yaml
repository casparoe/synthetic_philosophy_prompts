prompt: |-
  I have been reading about the laws on prostitution in Sweden and in the countries that have copied them, and there is a feature of the arrangement that I cannot get to fit together. The headline rule is that selling sex is lawful and buying it is not: the seller is left alone by the criminal law, the buyer is prosecuted, and the stated reason is that prostitution is a form of violence against women, with public money going to help women leave. So far I can follow the thought — the wrong, if there is one, lies on the buyer's side, and she is the one being wronged. But then there is the rest of the same law, which makes it an offence to promote or profit from another person's prostitution. As I understand it, that reaches well beyond the pimp and the brothel-keeper: it covers the premises, the transport, the advertising, the security, the person who takes the bookings. The seller herself does nothing wrong, yet almost anyone who helps her work — her landlord, her driver, her flatmate — is committing a crime, and she is left with no lawful way to hire help or share a workplace. In any other trade that would be unthinkable: the worker innocent, and everyone around her guilty.

  What does that combination presuppose? I can see at least three readings and I cannot tell which the law actually needs. One is that the act itself is not wrong but the institution is: the harm lies in prostitution as a social arrangement rather than in the transaction, so that a solitary exchange is tolerable and an organised one is not. Another is that her consent is not really consent, in which case the offence against the buyer is doing the moral work and the ban on helpers is a way of stopping anyone from using her. The third is that her consent is genuine and his is corrupt — which would make this the only exchange I know of in which the wrong attaches to the party who wants rather than the party who provides. It may also be that the two halves of the law rest on incompatible assumptions and simply coexist because different people wanted different things.

  I should like you to reconstruct the view of agency, consent, harm and institutions that this practice presupposes, and to be careful about what it strictly requires as opposed to what it merely happens to fit. Then say where it is underdetermined — where several quite different theories of what prostitution is would each license the same statutes — and what would have to change if the presupposed view were abandoned, for instance if the seller were taken to be a worker like any other, as some countries have done in decriminalising it outright and regulating it as ordinary work. I am not asking you to defend or attack the law; I want to know what its defenders are committed to.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're deeply analyzing the Swedish model of prostitution laws, specifically the asymmetry between criminalizing buyers and third parties while decriminalizing sellers. The user is confused about the underlying principles that make this combination coherent. They present three possible interpretations and want to understand the presupposed view of agency, consent, harm, and institutions.

  First, I need to recall the key elements of the Swedish model. It criminalizes the purchase of sex, decriminalizes the sale, and prohibits third-party involvement. The user is pointing out a tension: if selling sex isn’t wrong, why punish those who assist the seller? This seems contradictory in any other trade context. The user’s main question is about the philosophical foundations that justify this structure.

  The user mentions three readings: institutional harm, invalid consent of the seller, or corrupt consent of the buyer. They also consider if the laws might rest on incompatible assumptions. My task is to reconstruct the presupposed view, identify where the law is underdetermined, and explore what changes if the presupposed view shifts.

  I should start by outlining the core commitments. The law’s defenders likely see prostitution as inherently exploitative, rooted in gender inequality. The asymmetry aims to protect sellers (mostly women) as victims while targeting demand (buyers) and third parties as perpetrators. The criminalization of third parties is crucial to prevent exploitation, aligning with the view that any commercialization exacerbates harm.

  Next, consent. The law treats the seller’s consent as coerced by structural inequalities, thus not fully autonomous. Buyers’ consent is seen as morally corrupt because it perpetuates harm. Third parties are banned to prevent exploitation, even if the seller consents to their involvement. This suggests that the seller’s consent doesn’t legitimize third-party actions.

  Harm is viewed as systemic, not just individual. Prostitution is seen as a form of violence against women, so allowing organized structures would institutionalize that harm. This justifies banning third parties to keep the trade disorganized and reduce its prevalence.

  Now, where is the law underdetermined? The user’s three readings can all support the statutes. If the harm is institutional, criminalizing third parties makes sense. If the seller’s consent is invalid, third parties exploit that vulnerability. If the buyer’s consent is corrupt, third parties enable that corruption. The law doesn’t specify which, so defenders might use any combination.

  If the view shifts to treating sellers as workers, the entire model collapses. Decriminalizing all parties and regulating the trade would follow, as in New Zealand’s model. This would require viewing consent as valid and harm as manageable through regulation.

  I also need to address the user’s deeper needs. They might be exploring philosophical consistency in lawmaking or understanding how conflicting interests shape legislation. They might also be interested in gender equality debates or the practical impacts of such laws. Ensuring the response stays neutral and focused on reconstruction is key.
answer: |-
  The Swedish model (and its derivatives like the Nordic model) presents a conceptually intricate framework that hinges on specific presuppositions about prostitution. Let's reconstruct the implicit philosophical and sociological commitments required to make this legal asymmetry coherent, distinguishing necessary presuppositions from compatible interpretations, and then examine underdetermination and alternatives.

  ### Core Presuppositions of the Swedish Model
  1.  **Nature of Harm:**
      *   **Necessary Presupposition:** Prostitution is inherently harmful and exploitative, fundamentally constituting **gender-based violence and/or sexual exploitation**, regardless of individual consent. The core harm is not merely transactional but structural and societal.
      *   **Specific Harm Attribution:** The primary *wrongdoer* inflicting this harm is identified as the **buyer** (demand side). Their act of purchasing sexual access is seen as the catalyst for exploitation and violence.
      *   **Seller's Position:** The seller is primarily viewed as a **victim** of this system of exploitation, whether due to economic desperation, trafficking, addiction, past abuse, or systemic gender inequality. Their participation is understood as compelled by circumstances, not true autonomous choice within a fair system.
      *   **Third-Party Role:** Anyone facilitating or profiting from the victim's exploitation ("promoting or profiting from another person's prostitution") is seen as **complicit in the harm** and **perpetuating the exploitative system**. Their involvement commercializes and institutionalizes the inherent harm.

  2.  **Agency and Consent:**
      *   **Seller's Consent:** The law **presupposes the seller's consent is fundamentally compromised or invalid** in the context of prostitution. This invalidation stems not necessarily from direct coercion in every *individual* act (though it often is present), but from the **structural coercion** (poverty, inequality, lack of alternatives, gendered power dynamics) that shapes the "choice" to sell sex. Consent within an inherently exploitative system is deemed insufficient to legitimize the act or negate its harmful nature.
      *   **Buyer's Consent:** The buyer's consent is considered **morally irrelevant or corrupt**. Their desire is seen as the driving force of exploitation. The law targets the *act of purchase* itself as wrongful, irrespective of the buyer's subjective motivation.
      *   **Agency Focus:** Agency is recognized in the seller primarily as **agency to exit** (hence exit services), not agency to participate in a legitimate trade. The state's role is to protect the victimized seller by removing the source of harm (buyers and facilitators), not to enable their participation.

  3.  **Institutionalization and Harm Amplification:**
      *   **Necessary Presupposition:** **Organizing, commercializing, and normalizing prostitution significantly amplifies its inherent harms.** Pimps, brothels, advertisers, landlords knowingly profiting from prostitution, etc., create structures that:
          *   Trap individuals in prostitution.
          *   Increase dependence and control by third parties.
          *   Normalize the commodification of (primarily female) bodies for male sexual access.
          *   Facilitate trafficking and exploitation on a larger scale.
          *   Create an *institution* of exploitation that perpetuates gender inequality.
      *   **Solitary Transactions:** While still seen as harmful and exploitative, a disorganized, non-commercialized, non-institutionalized form of prostitution is viewed as *less harmful overall* and harder to eradicate entirely. Decriminalizing the seller avoids further victimizing them through prosecution while targeting the core drivers (demand & facilitation).

  4.  **Moral Asymmetry and State Role:**
      *   **Necessary Presupposition:** There is a **fundamental moral asymmetry** between the buyer/facilitator and the seller. The seller is victimized; the buyer and facilitator are victimizers or exploiters. Criminalizing the seller would be compounding victimization.
      *   **State's Duty:** The state has a duty to **dismantle systems of sexual exploitation**, protect vulnerable individuals (sellers), and reduce the overall harm caused by prostitution to individuals and society. This justifies asymmetric criminalization and the provision of exit services. The goal is abolition, not regulation.

  ### Where the Law is Underdetermined
  The statutes *can* be justified by several distinct, though often overlapping, theoretical frameworks, demonstrating underdetermination:

  1.  **Radical Feminism (Dworkin/MacKinnon):** Prostitution *is* male sexual violence and a core institution of patriarchal domination. The seller's "consent" is meaningless under patriarchy. All facilitation directly supports this oppressive system.
  2.  **Structural Inequality/Exploitation:** Prostitution is an extreme symptom and reinforcer of intersecting socio-economic inequalities (gender, class, race, migration status). Consent is invalidated by systemic coercion. Facilitation exploits this vulnerability for profit.
  3.  **Harm Reduction/Abolitionism:** Prostitution inherently causes severe psychological, physical, and social harm. Organized prostitution maximizes these harms and increases trafficking. Targeting demand and facilitation is the most effective strategy to reduce prevalence and harm, while decriminalizing sellers protects them and aids exit.
  4.  **Neo-Abolitionism:** Focuses heavily on trafficking and exploitation, viewing all prostitution as inherently linked and facilitating abuse. Facilitation is criminalized primarily to combat trafficking and exploitation networks.
  5.  **Moral Paternalism:** The state has a legitimate interest in discouraging morally degrading transactions and preventing individuals from harming themselves or being exploited, even if partially "consenting." Facilitation encourages this degradation.

  **The key underdetermination lies in the precise *reason* why the seller's consent is invalid:** Is it *always* invalid because prostitution is ontological violence (Radical Feminism)? Or is it invalid due to *prevailing socio-economic conditions* that could theoretically change? The law functions similarly under both views, but they have different long-term implications.

  ### Consequences of Abandoning the Presupposed View (Worker Model)
  If the foundational view shifts to "the seller is a worker like any other," the Swedish model collapses logically and practically, leading to a system like New Zealand's (decriminalization) or Germany/Netherlands (legalization/regulation):

  1.  **Reconceptualization of Harm:** Prostitution is seen as potentially harmful work, like mining or sex work, but harm stems from *conditions* (violence, stigma, lack of rights, bad regulation) rather than the *inherent nature* of the transaction itself.
  2.  **Agency & Consent:** The seller's consent is presumed **valid and autonomous**. They are **competent workers** capable of choosing their trade and negotiating terms.
  3.  **Criminalization Reversal:**
      *   **Buyer:** Criminalization becomes illogical. Buying a lawful service from a consenting worker isn't inherently wrong.
      *   **Third Parties:** Criminalization of facilitators becomes untenable and counterproductive. Workers *need* safe workplaces (brothels/flatshares), security, managers, advertising platforms, accountants, landlords, and legal contracts to operate safely and effectively. Banning these forces work underground.
      *   **Seller:** Decriminalization remains, but now as part of recognizing legitimate work.
  4.  **New Legal Framework:**
      *   **Full Decriminalization:** Remove all criminal penalties for consensual adult prostitution involving sellers, buyers, and third parties (NZ model).
      *   **Regulation:** Implement industry-specific regulations covering licensing of businesses (brothels), health & safety standards, mandatory testing (controversial), zoning laws, labor rights, contracts, taxation, and anti-trafficking/coercion measures (German/Dutch models). Third parties become regulated managers/business owners.
      *   **Focus Shift:** The state's role shifts from abolition to **harm reduction through regulation and normalization**, protecting workers' rights and safety within the industry, rather than solely focusing on helping them exit.
      *   **Trafficking/Coercion:** Strong laws against trafficking, coercion, underage prostitution, and exploitation remain crucial, but are distinct from consensual adult sex work.

  ### Conclusion
  The Swedish model's coherence **strictly requires** the view that prostitution is inherently harmful exploitation/violence, where the seller is a victim whose consent is structurally invalidated, the buyer is the primary perpetrator of harm, and facilitators perpetuate and profit from the exploitation system. Criminalizing facilitation is essential to prevent the institutionalization and normalization of this harm. The model is **underdetermined** regarding the exact philosophical reason *why* consent is invalid (ontological harm vs. contingent inequality) and the precise weight given to trafficking versus individual agency.

  Abandoning the core presupposition that prostitution is inherently exploitative violence and accepting the seller as a legitimate worker necessitates abandoning the asymmetric criminalization of buyers and facilitators. It logically leads to a framework focused on regulating the industry and protecting workers' rights and safety as the primary harm reduction strategy, fundamentally altering the state's relationship to prostitution. The choice between models ultimately rests on this foundational disagreement about the nature of prostitution, consent, and harm.
