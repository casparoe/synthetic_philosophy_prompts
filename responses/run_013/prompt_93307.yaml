prompt: |-
  I'm in my third year, taking a course that sits between philosophy of science and interpretability, and my final paper has to be a specification rather than an argument: I need to write out what any adequate theory of mechanism identity would have to deliver, for one specific purpose — mechanistic anomaly detection. Please act as my philosopher of science here, someone who works on mechanistic explanation in the sciences and has also spent real time with the interpretability literature, and think this through carefully rather than handing me the standard list. Sketch a long list of candidate requirements to yourself first, then prune it down and justify what survives.

  Background, so you know exactly what I'm after: the idea behind mechanistic anomaly detection is that you have a system whose behaviour you trust, and you want to flag when it does something produced by a different internal process than the one that produced the trusted behaviour — even when the behaviour itself looks fine. So everything turns on when two episodes of processing count as the same mechanism and when they count as different. That is the theory I need desiderata for.

  Lead with your bottom line: your first sentence should name the single requirement you think does the most work in excluding bad theories, and your first paragraph should say whether you think the full list is jointly satisfiable. No preamble, no restating of my question. Then give the requirements, each with the case or consideration that motivates it, and mark which are non-negotiable and which are preferences of a particular camp.

  I want the list built out of cases, so here are the phenomena I've been chewing on and that the theory has to get right:

  - Two networks trained from different random initialisations that compute the same function by visibly different internal routes: one mechanism or two?
  - A system that gets a task right by a generalising route, and a system that gets the same task right by a route that looks like a lookup table: behaviourally indistinguishable, and exactly the case anomaly detection is meant to catch.
  - A sub-computation that survives fine-tuning but whose job in the larger computation changes — the same part, now doing something else.
  - The same algorithm implemented at two different levels of description, say the same arithmetic routine realised once in a feedforward network and once in a network with recurrence. Is mechanism identity level-relative or level-neutral?
  - A computation that is real but not localised: no single unit or small set of units carries it, because it lives spread across a great many units that are each doing several jobs at once.
  - A computation you cannot intervene on cleanly, because the only interventions that change it also change something else you'd rather hold fixed.
  - A computation genuinely reused across two tasks, versus the same input-output pattern arising twice by coincidence.

  The requirements should cover at least three things: the distinctions the theory must not collapse (mechanism vs. function vs. algorithm vs. implementation; type vs. token; being present vs. being responsible; sameness vs. mere similarity of role); the results it must be consistent with (identical behaviour doesn't entail identical mechanism; massively over-parameterised systems admit many circuits for one function; parts can be non-separable; mechanisms nest inside one another); and the operational constraint that whatever sameness turns out to be, you have to be able to test for it by intervening on a system you can run but whose internals you only partly understand.

  The part I most want is the no-go. I have a suspicion that you cannot simultaneously have (i) a criterion neutral about the level of description and (ii) a criterion you can actually test by intervening, because any intervention has to be typed at some level; and a second suspicion that a criterion invariant under every behaviour-preserving change collapses mechanism into function and so defeats the purpose, while a criterion sensitive to every parameter change makes every training step a new mechanism. Tell me whether either suspicion is right, which requirement has to give if so, and what the least costly repair looks like.

  Finally, take a position: rank the candidate families of answer — a purely behavioural or functional one, a structural or syntactic one, a causal-interventionist one, and a purely pragmatic or instrumentalist one — by how many of the requirements each can meet, and say which single requirement eliminates the most of them.

  Be committed throughout: I want your verdicts and their reasons, not a survey that lays out the options and leaves the choice to me. Roughly 900-1200 words. No citations, no reading lists — I'll add those myself.
reasoning: |-
  Okay, the user is in their third year working on a final paper about mechanism identity for mechanistic anomaly detection. They need a specification of what any adequate theory must deliver. The key challenge is distinguishing when internal processes are the same despite behavioral similarity, especially in AI systems.

  First, I need to address their bottom line upfront. The single most important requirement seems to be **interventionist separability** - the ability to cleanly manipulate mechanisms without disrupting others. This directly tackles their suspicion about level-relativity vs testability. 

  The user provided seven concrete phenomena to address. Let me map these to core requirements:
  1. Different initializations → must distinguish same-function-different-implementation
  2. Generalization vs lookup table → detect functional equivalence with mechanistic divergence
  3. Fine-tuned subcomputation with changed role → handle causal role shifts despite structural similarity
  4. Different implementations of same algorithm → address level-relativity
  5. Distributed computations → require non-localization
  6. Intervention entanglement → highlight separability challenges
  7. Genuine reuse vs coincidence → require causal history sensitivity

  Their two suspicions are crucial. The level-relativity vs testability conflict seems real - interventions always happen at specific levels. The solution might be requiring level-sensitivity rather than neutrality. The second suspicion about invariance also holds - we need a middle ground between total collapse to function and hyper-sensitivity to tiny changes. Probabilistic or counterfactual approaches might help.

  For requirement categories:
  - **Distinctions to preserve**: Mechanism vs function, type vs token, role vs identity
  - **Non-negotiable results**: Behavioral equivalence ≠ mechanistic equivalence, overparameterization → multiple circuits, nested mechanisms
  - **Operational constraints**: Testable via partial interventions

  The four theory families:
  1. Functional: Fails immediately (collapses mechanism to behavior)
  2. Structural: Too brittle for distributed computations
  3. Pragmatic: Avoids hard constraints but lacks objectivity
  4. Causal-interventionist: Best balance but struggles with non-separability

  The biggest eliminator is the operational constraint - it immediately rules out purely behavioral and rigid structural approaches. Causal-interventionist survives by accepting approximations.

  For the final list, I'll prioritize:
  1. Interventionist separability (non-negotiable)
  2. Causal role preservation
  3. Implementation level-sensitivity
  4. Path counterfactual stability
  5. Non-localization tolerance
  6. Probabilistic robustness
  7. Reuse traceability

  Each requirement must be justified by specific cases from their list, with clear non-negotiable tags. The trade-offs should acknowledge where perfect satisfaction is impossible but useful approximation exists.
answer: |-
  ### Bottom Line:  
  The single requirement that does the most work in excluding bad theories is **interventionist separability**—the ability to selectively modify or disable a candidate mechanism via targeted interventions without disrupting other mechanisms, while holding behavior fixed in relevant contexts.  

  **Joint Satisfiability**: The full list of requirements is *not* jointly satisfiable under a perfectly objective, level-neutral, and non-pragmatic theory. Any adequate account must sacrifice level-neutrality or accept epistemic constraints to meet operational needs.  

  ---

  ### Requirements for Mechanism Identity (Anomaly Detection Focus)  
  **Non-negotiable requirements** (★) are enforced by anomaly detection’s purpose; others are strong preferences motivated by scientific practice.  

  1.  **★ Interventionist Separability**  
      *Motivation*: From your "computation you cannot intervene on cleanly" case. If anomaly detection requires testing mechanisms via interventions (e.g., activation patching), identity must be defined such that mechanisms *can* be isolated for manipulation without collateral damage. Theories that make mechanisms inseparable (e.g., holistic functionalism) fail operational needs.  
      *Trade-off*: Forces level-relativity (interventions act at specific granularities).  

  2.  **★ Causal Role Preservation**  
      *Motivation*: From the "sub-computation surviving fine-tuning but changing its job" case. Mechanisms are identified by *what they do* in a system’s causal structure (e.g., "this circuit detects edges"). If a component’s causal role shifts (e.g., from edge detection to texture encoding), it’s no longer the same mechanism—even if structurally identical. Collapsing role and structure misses anomalies.  
      *Distinction*: Preserves "being present" vs. "being responsible."  

  3.  **Implementation Level-Sensitivity**  
      *Motivation*: From "same arithmetic routine in feedforward vs. recurrent networks." Mechanism identity must be relative to a chosen level (e.g., algorithmic vs. circuit). A purely level-neutral view conflates distinct implementations (e.g., recurrence vs. feedforward) as "same mechanism," missing structural anomalies.  
      *Solves*: Your suspicion that level-neutrality conflicts with testability—interventions *must* target a level.  

  4.  **Path Counterfactual Stability**  
      *Motivation*: From "two networks computing the same function via different internal routes." Mechanisms are identical only if they would produce the *same intermediate states* under perturbations (e.g., noisy inputs). Networks with divergent paths fail this; lookup tables vs. generalizers differ in robustness to input shifts.  
      *Distinction*: Separates mechanism (process) from function (output).  

  5.  **Non-Localization Tolerance**  
      *Motivation*: From "computations spread across many units." Identity cannot require anatomical localization. Distributed mechanisms (e.g., attention heads sharing roles) must be identifiable via their *collective causal profile* (e.g., "these 100 neurons implement sparse coding").  
      *Eliminates*: Overly structural accounts demanding modularity.  

  6.  **Probabilistic Robustness to Parameter Perturbation**  
      *Motivation*: From your suspicion that hyper-sensitivity to parameter changes makes every training step a new mechanism. Identity should tolerate *small* parameter variations (e.g., stochastic gradient descent updates) if causal roles remain stable. Conversely, large shifts (e.g., fine-tuning repurposing a circuit) break identity.  
      *Avoids collapse*: Between "identical" and "wholly new."  

  7.  **Reuse Traceability via Causal History**  
      *Motivation*: From "genuine reuse vs. coincidental similarity." Identity requires a shared causal history (e.g., a circuit evolved *for* task A and reused in task B). Coincidental similarity lacks this lineage. Anomaly detection must distinguish reused mechanisms from novel mimicry.  
      *Requires*: Counterfactual dependencies (e.g., "would ablating this circuit break *both* tasks?").  

  ---

  ### Addressing Suspicions & No-Go  
  - **Suspicion 1 (Level-Neutrality vs. Testability)**: Correct. Interventionist separability forces level-relativity. *Repair*: Adopt **level-sensitivity** (Requirement #3). Mechanisms are identical *at a chosen granularity* (e.g., algorithmic). Interventions test identity relative to that level.  
  - **Suspicion 2 (Invariance Collapse)**: Correct. Full behavior-preserving invariance collapses mechanism into function. *Repair*: **Path Counterfactual Stability** (#4) adds process-oriented resilience. Identity requires stability in *how* outputs are produced under interventions, not just output preservation.  

  **Least Costly Repair**: Sacrifice level-neutrality (#3) to preserve testability (#1). Level-relativity is scientifically routine (e.g., genes defined molecularly vs. functionally); collapsing mechanism to function is fatal to anomaly detection.  

  ---

  ### Ranking Theory Families  
  1.  **Causal-Interventionist** (e.g., Woodward-style): Meets #1, #2, #4, #7. Best on testability, distinctions, and robustness. Struggles with #5 (non-localization) if interventions require modularity.  
  2.  **Structural/Syntactic** (e.g., mechanistic models): Meets #3, #5, #6. Strong on implementation and localization. Fails #1 (separability) for distributed mechanisms and #4 (path stability) for functionally equivalent variants.  
  3.  **Pragmatic/Instrumentalist**: Meets #1, #3, #5 by defining identity relative to detector goals. Avoids no-gos but fails #2 (role preservation) and #7 (reuse traceability), risking subjectivity.  
  4.  **Purely Functional/Behavioral**: Fails catastrophically. Collapses all distinctions (e.g., lookup table vs. generalizer counted "same"), violating #2, #4, #7. Only meets "behavior ≠ mechanism" trivially.  

  **Eliminator-in-Chief**: **Interventionist Separability** (#1) immediately kills functional and rigid structural accounts. Purely behavioral theories can’t test mechanisms; syntactic theories often demand unrealistic modularity. Only causal-interventionist and pragmatic theories survive—but pragmatism sacrifices objectivity.  

  ---

  ### Position: Causal-Interventionism Wins (With Caveats)  
  Causal-interventionism satisfies the most non-negotiables: separability (#1), role preservation (#2), and counterfactual robustness (#4). It handles reused vs. coincidental mechanisms (#7) via causal histories and allows level-sensitive definitions (#3). Its flaw—struggling with distributed mechanisms (#5)—is mitigated by probabilistic robustness (#6): we accept *approximate* separability for distributed systems (e.g., "this diffuse circuit can be *sufficiently* isolated for anomaly testing"). No theory perfectly resolves every case (e.g., non-separable mechanisms force pragmatic compromises), but causal-interventionism delivers the most for anomaly detection’s core aim: flagging *causally deviant processes* behind normal behavior.
