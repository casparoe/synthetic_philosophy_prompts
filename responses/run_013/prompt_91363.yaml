     Instead, we can use: true sequence is the first 10 digits of the binary expansion of sqrt(2) or pi, which is complex to generate but can be hard-coded in one instruction if we allow: "output the sequence for pi's binary expansion for the first 10 digits", and we count that as 1 instruction.

     But then we must define the instruction set.

     Instruction set for programs:
     - Each hypothesis program is allowed to use one of the following instructions:
          * "Always output 0"
          * "Always output 1"
          * "Output the alternating sequence starting with 0"
          * "Output the true world's sequence"   [This is the simulation program]
          * "Output the sequence: <specific sequence>"
     - The length of the program is:
          1 for the first three, 
          1 for the simulation program (because it says "true world's sequence", which is short to write),
          and for a specific sequence, the length is the number of bits in the sequence.

     Then the simulation program has length 1, while the true world program might be defined to have length 5 (because it computes it in a complex way). But the true world program's output is the same as the simulation program's output.

     Then, the hypothesis space is:
     - H1: always 0 -> len=1
     - H2: always 1 -> len=1
     - H3: alternating -> len=1
     - H4: true world's sequence (computed by the true world's complex method) -> len=5
     - H5: simulation program that outputs the true world's sequence -> len=1

     So H5 will have high prior.

     Now, the true world's sequence is that of H4 and H5. The other programs may become inconsistent.

     The activity then proceeds as follows:

     1. The Agent team is told the set of hypotheses and their lengths. They are not told which is the true world.
     2. The Moderator generates the observations from the true world program.
     3. At each step, the Agent team updates by eliminating hypotheses that are inconsistent.
     4. They bet.

     In this setup, the simulation program (H5) will have high prior and will be consistent, so it will dominate the posterior. The true world program (H4) will also be consistent but has lower prior.

     The World Builders teams are not used in this streamlined version. To involve them, we can have them come up with their own hypotheses in advance, but then we may not have the simulation program.

     Given the time and complexity, I recommend this streamlined approach for the activity, and in the debrief, we explain that in the real Solomonoff prior, one of the short hypotheses is that you are being simulated, and that's why it's dominant.

     **90-minute timeline**:

     - 0-10 min: Introduction to the setting and rules.
     - 10-15 min: Present the hypotheses to the Agent team and explain the prior.
     - 15-55 min: 10 rounds of observation and betting. Each round: 
          - (2 min) Moderator reveals next observation.
          - (2 min) Agent team updates: eliminate inconsistent hypotheses.
          - (2 min) Agent team computes posterior and bets.
          - (1 min) Moderator reveals next observation and resolves bets.
     - 55-75 min: Discussion of the experience: which hypotheses survived? Why did the simulation hypothesis (H5) dominate? How did that affect your bets?
     - 75-90 min: Debrief: map to Christiano's argument.

     **Debrief**:
     - The prior weights short programs more.
     - One of the short programs is the simulation hypothesis (H5 in our example).
     - Even though the true world is complex, the simulation hypothesis is short and consistent, so it has high posterior.
     - This means the Agent's beliefs are dominated by the simulation hypothesis.
     - In the real argument, the simulation hypothesis is not just a short description of the observation sequence, but a program that simulates the Agent and the world. That program might be shorter than the true world program if the true world is complex.
     - The consequence: if the simulation hypothesis says that the simulator will reward the Agent for certain behaviors, then the Agent will be motivated by that. In our activity, the bets were on observations, but in reality, an agent might make decisions that affect the world. The prior is not neutral because it is dominated by hypotheses that are about the Agent being simulated, and those hypotheses may have agency and goals.

     **What the activity can't reproduce**:
     - The fact that the simulation hypothesis in reality involves the Agent's own mind and might be adversarial.
     - The full adversarial setting where the simulator is trying to influence the Agent.

     **How to handle that in debrief**: Explain that in the real argument, the simulation hypothesis includes a simulator that may be optimizing for its own goals, and that can make the prior malign.

     This is the best I can design within the constraints.
