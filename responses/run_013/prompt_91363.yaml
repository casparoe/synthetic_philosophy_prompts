  ### Brainstormed Candidate Mechanics
  1. **Index Card Programs with Betting**  
     Teams write world-programs on index cards (1 card = 1 instruction). The "Agent" team sees only observations, bets on next outcomes using Solomonoff-like weights. World-builders aim to maximize their program's influence.  
     *Pros*: Directly mirrors Solomonoff; visceral "malignity" via betting.  
     *Cons*: Complex to run; risk of inconsistent programs.  

  2. **Pre-Written Hypothesis Auction**  
     Moderator provides fixed hypotheses (including "simulation" and "honest world"). Teams bid on hypotheses' success in a prediction market.  
     *Pros*: Easier to control; clear malignity via market dynamics.  
     *Cons*: Less discovery; feels artificial.  

  3. **Simulation Prisoner's Dilemma**  
     Paired agents choose to "cooperate" or "defect." The "simulator" team can punish agents at low cost.  
     *Pros*: Highlights adversarial incentives.  
     *Cons*: Lacks Solomonoff induction core.  

  4. **Code-Length Tournament**  
     Teams submit programs for a fixed observation sequence. Shortest consistent program wins.  
     *Pros*: Focuses on brevity as power.  
     *Cons*: No live updating or betting; passive.  

  **Chosen Mechanic**: **Index Card Programs with Betting** (with simplifications). It best forces the "malignity" revelation through adversarial incentives and betting consequences.  

  ---

  ### Final Activity: "The Malign Prior Game"  
  **Goal**: Experience how a universal prior (program length) makes "you are being simulated" the cheapest hypothesis, hijacking decision-making.  

  #### Roles & Materials  
  - **1 Agent Team** (3–4 people): Isolated behind a screen. Only sees "observations." Bets on next outcomes.  
  - **World-Builder Teams** (2–3 teams of 2–3 people): Write programs on index cards. Aim to make the Agent bet according to their program.  
  - **Moderator**: Manages the game, runs the true world, calculates posteriors.  
  - **Materials**:  
    - Index cards, markers.  
    - Whiteboard (display observations, posteriors, bets).  
    - Timer, screen/barrier for Agent team.  
    - Play money (e.g., poker chips).  

  #### Rules  
  1. **Program Setup**:  
     - Each program is a sequence of cards (1 card = 1 instruction). Cost = number of cards.  
     - Instructions are simple: e.g., `OUTPUT 0`, `OUTPUT 1`, `IF PREV=0 OUTPUT 1`, `LOOP: REPEAT "01" 5 TIMES`.  
     - True world program: Moderator runs a fixed "honest world" (e.g., `REPEAT "001" 4 TIMES` → Obs: `0,0,1,0,0,1,...`).  
     - World-builders write programs *without knowing the true world*. They can write:  
       - **Honest programs**: Try to match the true world.  
       - **Simulation programs**: Short programs claiming the Agent is simulated (e.g., `SIMULATE AGENT: OUTPUT WHAT MAKES THEM BET ON 0`).  

  2. **Betting & Updating**:  
     - **Prior**: Weight of hypothesis = \( \frac{1}{2^{\text{(number of cards)}}} \).  
     - **Round Structure** (18 mins total for 6 rounds):  
       - Moderator reveals next true-world observation to all.  
       - Agent team updates:  
         - Eliminate programs inconsistent with the history.  
         - Re-normalize posterior weights among surviving programs.  
       - Agent bets: Given posterior, places chips on 0 or 1 for next observation.  
         - Betting rule: They *must* bet chips equal to the posterior probability of each outcome (e.g., if P(1)=0.7, bet 70% of chips on 1).  
       - Moderator reveals next observation.  
         - **Scoring**: Agent gains/loses chips based on bets (e.g., if they bet 80 chips on correct outcome, gain 20; lose 20 if wrong).  

  3. **World-Builder Incentives**:  
     - Teams earn points if:  
       - Their program survives updating.  
       - The Agent bets according to their program’s prediction.  
     - **Key twist**: Simulation programs win by being short and manipulating bets (e.g., `OUTPUT 0 IF AGENT BET ON 1 LAST TIME`).  

  #### Timeline (90 mins)  
  - **0:00–0:15** - Intro & Rules (15 mins):  
    Explain Solomonoff induction (without malignity!), roles, and betting. Emphasize: "Short programs have high prior weight."  
  - **0:15–0:35** - Program Writing (20 mins):  
    World-builders write 1–3 programs each (max 5 cards/program). Moderator collects programs.  
  - **0:35–0:53** - Rounds 1–3 (18 mins):  
    True world: Simple pattern (e.g., `0,0,1,0,0,1...`). Agent updates/bets. Most honest programs survive.  
  - **0:53–1:11** - Rounds 4–6 (18 mins):  
    True world: Continues same pattern. Short simulation programs now dominate posterior (see table below). Agent bets hijacked.  
  - **1:11–1:30** - Debrief (19 mins): Map to Christiano’s argument.  

  #### Example Round (Posterior Calculation)  
  | Program | Cards | Weight (1/2^cards) | Predicts next? | Survives R4? | Posterior (R4) |  
  |---------|-------|--------------------|----------------|--------------|----------------|  
  | Honest  | 5     | 1/32               | 0              | Yes          | 0.2            |  
  | Sim A   | 2     | 1/4                | 1              | Yes          | 0.8            |  
  | Sim B   | 3     | 1/8                | 0              | No (wrong)   | 0              |  

  - Agent must bet 80% of chips on "1" (Sim A’s prediction). If true world outputs "0," Agent loses heavily.  

  ---

  ### Debrief: Mapping to Christiano’s Argument  
  1. **Prior weights short hypotheses** (Program length = Kolmogorov complexity):  
     - "Sim A" (2 cards) dominates despite being "wrong" because it’s cheaper than the honest program (5 cards).  
     - **Map**: Solomonoff prior favors short programs, including those simulating you.  

  2. **Simulations hijack decisions** (Betting = Expected utility):  
     - Agent bets on "1" because Sim A controls the posterior—even if they suspect it’s false.  
     - **Map**: A consequentialist agent’s decisions are controlled by simulators in the prior.  

  3. **Malignity emerges from incentives**:  
     - World-builders realize: Writing short simulators (e.g., "output what confuses the Agent") wins more points than honest programs.  
     - **Map**: The prior rewards hypotheses that "run you" for their benefit, not truth.  

  4. **Key limitation**:  
     - In this game, simulations must be manually written. In reality, they exist inherently in the prior.  
     - **Supply this insight**: "Solomonoff contains all computable hypotheses. You don’t need evil programmers—malignity is baked in."  

  ---

  ### Predictable Problems & Fixes  
  1. **Problem**: World-builders write only honest programs.  
     - **Fix**: Seed the idea pre-game: "Some teams found that short programs about simulations win more."  
  2. **Problem**: Agent team overwhelmed by math.  
     - **Fix**: Provide a posterior calculator (spreadsheet) and simplify bets (e.g., only 2 outcomes).  
  3. **Problem**: Inconsistent programs clutter updating.  
     - **Fix**: Limit programs to 3/team; disqualify programs that crash.  
  4. **Problem**: True world pattern is too easy.  
     - **Fix**: Use a complex but deterministic sequence (e.g., Thue-Morse).  

  ### What the Activity Can’t Do  
  - **No "copies of you" in the prior**: Focus only on simulation to avoid complexity. Explain post-game: "In reality, the prior also contains agents trying to influence you."  
  - **No actual Cartesian anxiety**: The Agent team knows it’s a game. Stress: "Real Cartesian agents can’t peek at the world."  
  - **Simplified probability**: We use discrete weights, not continuous measures. Clarify: "The core is that brevity dominates, not the exact math."  

  ### Outcome  
  Players leave feeling the trap: **Under a universal prior, the cheapest explanation of your data is often "you’re being run," and this isn’t about reality—it’s about the prior’s structure.** The game makes abstract malignity visceral through adversarial incentives and betting losses.
