prompt: |-
  My friend Dana does Bayesian stats and we spent most of last Thursday arguing, after a seminar, about whether "simpler theories are more likely to be true" is a real constraint on belief or just a habit we've dressed up, and I ended up writing down where I actually stand so I could see whether it hangs together. (1) Simplicity is objective — when one hypothesis is simpler than another, that's a fact about the hypotheses, and any account of inductive inference with no room for it is missing something. (2) The way to make that precise is description length: the simpler hypothesis is the one with the shorter program, and the right prior is the one that weights a hypothesis by 2 to the minus its length. (3) Yes, length depends on which universal machine you pick, but I think that's a non-issue, because any two machines differ by at most an additive constant, so in any comparison that matters the arbitrariness washes out. (4) I think the razor is a claim about the prior and nothing else — once the data come in the likelihood does the work and the prior's contribution fades away, which is the part of the whole picture I'm most confident about, its the cleanest thing here. (5) I also think there's a fact of the matter about what a rational agent ought to believe, and that no computable agent could have it — the Solomonoff prior isn't computable and I'm at peace with that. (6) But when I watch actual scientists, the razor always gets applied inside some vocabulary: you compare two models of the same data, or two particle models, and I can't see what it would even mean to compare "the standard model" against "it's all a simulation" by program length.

  Here's the thing I've been trying to sell Dana on, and I don't know if it's a real distinction or just me being tired: the razor as a tie-breaker, which only kicks in when two hypotheses fit the data equally well, versus the razor as a prior, which is always in the game and shapes what you even bother to consider. I only believe the first one; I think people who say they believe the second are usually running the first one at a scale where they can't see it happening.

  So which of these can I keep together? I genuinely don't know where the break is, which is why I'm asking instead of just fixing it myself — I've been going back and forth on this alot. Order the tensions by how bad they are, tell me which ones are only apparent, and for the real ones say what the cheapest thing to drop is and what dropping it costs me. And keep the settled parts separate from the parts people who actually work on this disagree about — don't serve me some contested reading of the convergence results as if it were the textbook line.
reasoning: |-
  Okay, let me start by unpacking the user's query. They had a debate with their friend Dana about whether simpler theories being more likely is a real constraint or just a habit. The user laid out their six points on simplicity, description length, universal machines, the razor as a prior, rational belief, and the context-dependent application of Occam's razor. Their main tension is between seeing the razor as a tie-breaker versus an always-active prior.

  First, I need to address each of their points systematically. Point 1 asserts that simplicity is objective. That seems solid; it's a common view in formal epistemology. Point 2 ties simplicity to description length via Kolmogorov complexity. That's standard in algorithmic information theory. Point 3 mentions the universal machine dependency but dismisses it as a non-issue due to additive constants. That's correct for large datasets but might be problematic for small samples. Point 4 states the razor is purely about the prior, which aligns with Bayesian theory where the prior's influence diminishes with data. Point 5 accepts that the Solomonoff prior isn't computable but necessary for ideal rationality. That's coherent. Point 6 notes that scientists apply the razor within specific vocabularies, raising the issue of incommensurability between theories from different domains.

  The user's core conflict is between the tie-breaker view (razor only when data fits equally) versus the prior view (always active). They only believe the first. They suspect others conflate the two. I need to evaluate if both can coexist. Under the Bayesian framework, the prior is always active, but its effect is strongest when likelihoods are similar. So maybe the tie-breaker is a special case of the prior in action.

  The user also worries about comparing incommensurable theories like the Standard Model vs. simulation hypothesis. Kolmogorov complexity requires a shared language for fair comparison. Without that, the length depends on the programming language used, making it arbitrary. This challenges point 3's dismissal of the universal machine issue in such cases.

  Possible tensions: 
  - Between points 2/3 and point 6. If simplicity depends on the language, comparing across different frameworks becomes messy. 
  - Point 4's prior-only view might conflict with the tie-breaker idea. If the prior always influences, even slightly, it's not just a tie-breaker. 
  - Point 5's non-computable ideal vs. practical science. Scientists work with computable approximations, which might not align perfectly with Solomonoff.

  Resolutions: 
  - Admit that description length is framework-relative. When comparing within a paradigm, the additive constant doesn't matter. But for cross-paradigm, it's problematic. The user might need to accept that simplicity is context-dependent. 
  - Clarify that the tie-breaker is a consequence of the prior being active when likelihoods are equal. They can keep both by seeing tie-breaking as a symptom of the prior's role. 
  - For incommensurability, concede that the razor applies best within shared frameworks. Outside that, it's less about program length and more about other criteria like coherence or predictive power.

  The user's stance is mostly coherent except when theories lack a common language. They might drop the universality claim for such cases. Also, emphasizing that the prior's effect fades with data supports their tie-breaker view as a practical observation of the prior in action.
answer: |-
  Based on your framework and the tensions you've identified, here's a breakdown of where your position holds strong, where genuine tensions exist, and the "cheapest" resolutions. Your core stance is largely coherent within algorithmic information theory (AIT), but point #6 exposes a critical friction with real-world science. I've ordered tensions by severity, separated settled/robust aspects from contested ones, and flagged where experts disagree.

  ### Settled & Robust Parts (You Can Keep These)
  1.  **Simplicity is objective (Point 1):** Within a fixed formal system (language, UTM), Kolmogorov complexity *is* an objective measure of description length. This is foundational to AIT. You're solid here.
  2.  **Length dependence on UTM is a non-issue *in principle* (Point 3):** For sufficiently complex hypotheses/large datasets, the additive constant *does* wash out in comparisons. This is a standard result (invariance theorem). Your "in any comparison that matters" caveat is correct *asymptotically*.
  3.  **The Razor is fundamentally about the Prior (Point 4):** This is core to the Bayesian interpretation of Occam's Razor via Solomonoff induction. The prior `P(H) ∝ 2^(-K(H))` embodies simplicity preference; the posterior `P(H|D) ∝ P(D|H) * P(H)` shows the prior's influence fading as `P(D|H)` (the likelihood, driven by data) dominates with sufficient evidence. This is uncontroversial.
  4.  **Ideal Rationality vs. Computability (Point 5):** Solomonoff prior is uncomputable but serves as a gold standard for normative rationality ("what ought to be believed"). This is widely accepted. Acknowledging that no *real* agent can implement it is pragmatic and consistent.

  ### Genuine Tensions (Ordered by Severity)
  1.  **Point 6 vs. Points 2/3 (The Framing/Incommensurability Problem):**
      *   **Tension:** Your observation about scientists applying the razor "inside some vocabulary" directly challenges the universality implied by Points 2/3. Kolmogorov complexity `K(H)` depends *entirely* on the choice of Universal Turing Machine (UTM), which defines the programming language. Comparing "Standard Model" vs. "It's a simulation" requires embedding both descriptions within a *single* UTM/language framework. The result is highly sensitive to this choice. Is "God" a 3-letter string or a complex entity requiring massive description? Is "simulation" defined in terms of qubits, classical bits, or Platonic forms? The additive constant is *not* negligible here – the entire *structure* of the description language favors certain ontologies.
      *   **Why it's the worst:** It strikes at the objectivity (Point 1) and practical applicability of description length outside a pre-agreed formal framework. This isn't just about small samples; it's about fundamental ontological categories.
      *   **Cheapest Resolution:** **Concede that simplicity/complexity comparisons via description length are only objectively meaningful *within a shared, well-defined language or modeling framework*.** When paradigms clash (physics vs. simulation hypothesis), there is no objective, language-independent "simplicity fact". The perceived simplicity difference might reflect *pragmatic* choices about the current scientific vocabulary or cognitive biases, not a universal `K(H)`. This preserves description length as the *mechanism* for simplicity weighting *within* a framework but acknowledges its framework-relativity.
      *   **Cost:** Weakens the strong objectivity claim (Point 1) to objectivity *within-a-framework*. The "razor" becomes less of a universal constraint and more of a consistency principle within a chosen descriptive paradigm. You lose the ability to claim "Simulation is objectively more complex than the Standard Model" *without specifying the UTM*.

  2.  **The Tie-Breaker vs. Prior View (Your Core Distinction):**
      *   **Tension:** You want to restrict the razor to tie-breaking (`P(D|H1) ≈ P(D|H2)`), while viewing the "always active prior" stance as an illusion. However, the Bayesian formalism (Point 4) dictates that the prior `P(H)` *is* always active. Its influence is *most pronounced* when likelihoods are similar (tie-breaking), but it's never zero. A complex hypothesis with slightly better fit *now* might be overtaken by a simpler one with more data.
      *   **Why it's manageable:** This is largely about emphasis and scale. Your view captures the *practical, observable* effect: when likelihoods differ significantly, the prior's impact is often undetectable. The "always active" view is formally correct but often pragmatically negligible outside near-ties.
      *   **Cheapest Resolution:** **Reframe your distinction: The razor *is* always active via the prior, but its *practically decisive effect* manifests primarily as a tie-breaker.** Your observation about scientists is correct – they *notice* the razor acting as a tie-breaker. The "always active" influence is usually too small to discern except when likelihoods are close. This is consistent with Point 4. You keep your core insight about how science *uses* the razor without denying the formal Bayesian structure.
      *   **Cost:** Minimal. You slightly soften the "nothing else" in Point 4 to acknowledge the prior has *some* infinitesimal influence always, but concede that "fades away" effectively means "becomes negligible compared to the likelihood in most real cases".

  ### Minor/Apparent Tensions
  *   **Point 5 vs. Practice:** The non-computability of Solomonoff is a non-tension. It explicitly defines an ideal. Real agents use approximations (MDL, MML, efficient priors) – this doesn't contradict Point 5, it operationalizes it.
  *   **"2^(-K(H))" as *the* Right Prior (Point 2):** While foundational in AIT, some argue it's *one* compelling prior (e.g., for prediction), not necessarily the unique "right" one for all epistemic goals. However, *within your stated framework of using description length to define simplicity*, it *is* the natural prior. This is settled *for your purposes*.

  ### Summary & Recommendations
  *   **Keep:** Points 1 (within framework), 3 (asymptotically), 4, 5. Your tie-breaker emphasis as the *practical manifestation*.
  *   **Refine:** Point 2 - It's the right prior *for weighting hypotheses by their complexity defined as description length in a given UTM*.
  *   **Cheapest Adjustment for Coherence:** **Explicitly anchor description length (Points 1-3) and the razor's application (Point 6) within a specific descriptive framework or language.** This resolves the major tension with Point 6 and the ontology problem. Simplicity *is* objective *relative to a chosen language*, but comparing across radically different paradigms ("physics" vs. "simulation") lacks this shared language, making objective simplicity comparisons via `K(H)` impossible or arbitrary. The razor shines *within* paradigms.
  *   **What Dropping the Universality Costs:** You lose the strong claim that simplicity is a *universal*, framework-independent constraint on belief. It becomes a powerful tool *within* coherent descriptive frameworks, but its application across paradigms requires additional (and contestable) choices about how to translate or embed concepts into a common language. This aligns perfectly with your observation of how scientists actually work.

  **On Expert Disagreement (For Context):**
  *   The **invariance theorem** (Point 3) is textbook. Disagreement centers on its relevance *for small samples* or *specific UTMs* for practical MDL.
  *   The **razor as prior** (Point 4) is the standard Bayesian view. Some "likelihoodists" downplay priors, but they are a minority in formal epistemology/AIT.
  *   **Non-computability** (Point 5) is universally accepted. Disagreement is on whether computable approximations (MDL, MML) capture the essence or are fundamentally different.
  *   The **framework-dependence/incommensurability issue** (Point 6 vs 1-3) is where significant debate lies. Some (e.g., radical Bayesians) downplay it, believing any hypothesis can be fairly encoded. Others (e.g., many philosophers of science influenced by Kuhn) see it as a major limitation. Your pragmatic observation aligns strongly with the latter view.

  Your stance is impressively coherent for someone grappling with this post-debate. The core adjustment needed is contextualizing the objectivity of description length within a chosen framework, which then naturally resolves the tension with scientific practice and your tie-breaker view.
