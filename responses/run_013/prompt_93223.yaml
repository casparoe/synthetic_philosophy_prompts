prompt: |-
  Me and my flatmate have been going round in circles about this for weeks and I want a proper answer instead of another evening of us both repeating ourselves. She's doing law, I did a bit of philosophy as an undergrad, and what set it off was her revision notes on the legal incidents of marriage, the boring bits nobody mentions in the equal-marriage debates. Spouses can refuse to testify against each other in a lot of places. If you die without a will your spouse jumps the queue ahead of your parents and your brothers and sisters. Your spouse is usually the person who gets to decide whether the machines get switched off. Your spouse can sponsor you for a visa. You file your taxes as a unit. And here's the thing that got me: when same-sex marriage was legalised in country after country, almost nobody touched any of that. They extended the existing package to a new set of couples and left the testimonial privilege, the intestacy rule, the next-of-kin rule and the tax treatment exactly where they were. So what does that practice actually presuppose about what marriage is for? I can see at least two stories. One: marriage is fundamentally the state recognising a certain kind of loving relationship between two adults, and the legal incidents are just how that recognition gets cashed out. Two: marriage is a legal technology for channelling care and dependency, a way of assigning someone to nurse you, inherit from you and speak for you, and the love story is window dressing. There's a third reading as well, which is that the institution isn't one thing at all but a bundle of unrelated rules that got stapled together by history, and that the extension happened without anyone having to commit to a theory.

  The bit that really bugs me is the pattern of who gets left out. If marriage is about the relationship, why does the state still refuse to recognise a settled three-person household, or two sisters who've shared a house for forty years and are each other's next of kin and each other's only real carer? If instead it's about care and dependency, why does the state demand no evidence of either before handing over the intestacy priority and the tax break? You can marry someone you've never lived with and have no intention of ever living with. And if it's just a historical bundle with no theory behind it, then why does the bundle keep getting defended so fiercely in court and in parliament, as though something were at stake that isn't just administrative convenience? It feels like the practice can't be all three at once, but I can't work out which one it's actually committed to, or whether it's just incoherent.

  So what I want from you is this. Reconstruct the theory of marriage that the practice I've described presupposes, if it presupposes one at all. Be careful to separate what the practice strictly requires from what it merely sits comfortably with, because I suspect a lot of my confusion comes from treating things that merely fit as things that are implied. Tell me which rival views of what marriage is for the practice quietly rules out, and where it's genuinely underdetermined, so that several incompatible theories would license exactly the same rules. Say whether the different parts of the practice presuppose consistent things or whether there's a real tension between the ones I've listed. And tell me what would have to change in the law if we swapped the presupposed view for one of the others, so I can see what's actually riding on the answer. Lead with your bottom line in the first sentence and then give the reasoning, no preamble and no restating of my question. British English please, and go easy on the jargon, I'm not a lawyer.
reasoning: |-
  Okay, let me unpack this user's query about the underlying theory of marriage in legal practice. They've been debating with their flatmate for weeks, so they clearly need a resolution that cuts through the circular arguments. The user has a philosophy background and their flatmate studies law, which explains why they're focused on the gap between legal mechanics and theoretical justifications.

  The core frustration seems to be about reconciling three possible theories of marriage (relationship recognition, care/dependency framework, or historical bundle) with the actual legal outcomes - particularly how same-sex marriage was implemented without reforming ancillary rules, and who gets excluded by the current system. 

  Hmm, the user's examples create genuine tension: if marriage is about relationships, why exclude long-term non-romantic caregivers? If it's about care, why allow marriages without cohabitation? And if it's just historical accident, why defend it so fiercely? Their suspicion that the practice might be incoherent feels warranted.

  I need to approach this forensically. First, identify what the legal practice strictly requires: the extension of marriage to same-sex couples without modifying incidents shows the state treats the spousal role as transferrable regardless of gender, but doesn't inherently define marriage's purpose. The exclusion of non-conjugal relationships is more revealing - it suggests conjugality remains central despite the "love" rhetoric.

  The tax rules and intestacy priorities that apply automatically upon marriage, without proof of interdependence, indicate the law prioritises formal status over functional care. That's a major point against the dependency theory. Yet the next-of-kin rules clearly do serve care functions, creating internal tension.

  Ah! The key might be that marriage operates as a legal proxy: it assumes conjugal relationships typically generate the interdependency the state wants to regulate, making formal status an efficient substitute for case-by-case assessment. This explains both the automatic privileges and the exclusion of non-conjugal bonds - even if imperfect in individual cases.

  For the user's "what if" question: switching to a care-based model would require dismantling automatic spousal privileges in favour of functional tests, while a pure relationship theory might expand marriage to non-conjugal bonds. The current system's resistance to such changes confirms its reliance on conjugality as a heuristic.

  The unresolved tension between automatic privileges (status-based) and next-of-kin rules (function-based) means no single theory fully captures the practice - but the conjugal proxy model comes closest to explaining its resilience and exclusions. That's the bottom line I'll lead with.
answer: |-
  The legal practice you describe presupposes marriage is a state-conferred **status that formally designates a default conjugal partnership for allocating specific legal responsibilities and entitlements efficiently, using the relationship as a proxy for presumed interdependence, without requiring proof of function in individual cases.**

  **Reasoning step-by-step:**

  1.  **What the practice strictly requires:**
      *   The *automatic* application of incidents (testimonial privilege, intestacy rights, next-of-kin, tax status) upon valid marriage, without needing evidence of love, care, cohabitation, or dependency.
      *   The *exclusion* of non-conjugal relationships (like siblings or polycules) from accessing these *specific bundled incidents* as a package, regardless of demonstrable care or interdependence.
      *   The *transferability* of the *entire existing package* of incidents to same-sex couples demonstrates the core is the *formal spousal role*, not the gender of the partners or a specific theory of the relationship's nature.

  2.  **What it rules out:**
      *   **Pure Relationship Recognition:** If marriage *only* recognised a loving adult relationship, the state would logically extend the *incidents* based on proven *functional interdependence or commitment* (like caregiving), not automatically upon a formal ceremony, and would likely include other deep, interdependent bonds (like lifelong siblings). The automatic privileges and exclusions contradict this.
      *   **Pure Care/Dependency Framework:** If it was *only* about channelling care, the state *would* demand evidence of actual dependency or caregiving before granting incidents like intestacy priority or tax breaks. The fact you can marry without living together or demonstrating care, yet still get these benefits, rules this out as the *sole* foundation.
      *   **Completely Random Historical Bundle:** While history shaped the bundle, the fierce defence and the *pattern* of extension/exclusion show it's *not* treated as random. The state actively maintains this *specific* bundle tied to the *conjugal partnership status*.

  3.  **Where it's underdetermined / sits comfortably:**
      *   **The "Why" of the Proxy:** The practice *doesn't* strictly require a specific reason *why* the conjugal partnership is chosen as the proxy. It sits comfortably with:
          *   Historical norms about family structure.
          *   Assumptions (accurate or not) that conjugal partnerships are the *most common* or *most stable* sites of interdependence.
          *   Administrative convenience: It's simpler to use a clear legal status (marriage) than assess functional interdependence case-by-case.
      *   **Love/Symbolism:** While not the legal core, the practice is fully compatible with marriage *also* having profound social/emotional meaning around love and commitment. This symbolism doesn't conflict with the legal function.

  4.  **Tensions within the practice:**
      *   **Automatic Privileges vs. Functional Needs:** The biggest tension is between granting *automatic* rights (like intestacy priority for a spouse you never lived with) and the *functional purposes* some incidents clearly serve (like next-of-kin decisions *requiring* knowledge/care). The law prioritises the certainty of the *status* over perfect functional alignment in every case.
      *   **Proxy Imperfection:** The practice accepts that the conjugal proxy will sometimes misfire – granting privileges where no real interdependence exists (short, non-cohabiting marriages) and excluding it where it does exist (dedicated non-conjugal carers). Efficiency and tradition trump perfect justice here.

  5.  **What changes if we swap the presupposed view:**
      *   **Switch to Pure Relationship Recognition:** The *incidents* would be decoupled from the *status* of marriage. Legal benefits would be awarded based on proof of a committed, interdependent relationship (cohabitation duration, financial entanglement, caregiving), regardless of marital status, sexual nature, or number of partners. Marriage might become purely symbolic or one path among many to access benefits. Next-of-kin could be a nominated carer, intestacy follow proven dependency, etc.
      *   **Switch to Pure Care/Dependency Framework:** Marriage would lose its automatic legal power. Spouses would only gain testimonial privilege, intestacy rights, next-of-kin status, or tax benefits if they could *demonstrate* actual dependency or caregiving responsibilities at the relevant time. A sibling carer could override a neglectful spouse for next-of-kin decisions. Tax breaks would require evidence of financial interdependence.
      *   **Switch to Random Bundle:** Significant reform would be haphazard. Incidents might be abolished, changed, or opened to other relationships piecemeal based on individual policy arguments (e.g., extending next-of-kin to nominated carers while keeping tax breaks for married couples), without a unifying principle.

  **Bottom Line Confirmed:** The consistent thread in the practice is marriage as a formal, conjugal-partnership status acting as a legal proxy for presumed interdependence, enabling the efficient automatic allocation of a standardised bundle of rights and responsibilities, despite tensions with functional realities and the exclusion of non-conjugal bonds.
