answer: |-
  ### Derived Principle from Your Ledger

  After analyzing your ledger, I derive a principle that explains your reactions. Your tentative principle (tracking whether success is used to claim rank) is part of the story but incomplete. I repair it by adding two key elements: (1) the **source of success** (earned vs. unearned), and (2) the **context of personal proximity** (whether the success directly threatens your sense of equality or status). The repaired principle is a disjunction of three conditions that trigger a negative reaction. All three must be present to fully explain your ledger.

  **The Principle of Merit, Humility, and Context**  
  Your reaction is **negative** (you feel cutting down is warranted or join in criticism) if and only if at least one of the following is true:  
  1. **Arrogance Display**: The person uses their success to explicitly or implicitly claim superiority over others (e.g., lecturing, belittling rivals, or framing praise as a demand for hierarchy).  
  2. **Unearned Without Humility**: The success is largely unearned (e.g., inherited, luck-based, or detached from merit), and the person fails to demonstrate humility or use it to benefit others quietly.  
  3. **Personal Threat in Proximity**: The success is earned and the person is humble, but occurs in a context of close personal proximity (e.g., same workplace, shared passion, or direct comparison to you), triggering an envious impulse.  

  Your reaction is **positive** (you feel celebration is warranted) if none of these conditions apply.  

  ---

  ### How the Principle Explains Your Ledger  
  Below, I walk through each case, showing how the principle captures your reaction. I mark the active condition(s) for negative reactions and note where your tentative principle (claim to rank) succeeds or fails.  

  | Case & Summary | Your Reaction | Principle's Explanation | Why Your Tentative Principle (Rank Claim) Succeeds or Fails |
  |----------------|---------------|-------------------------|------------------------------------------------------------|
  | **1. Classmate (founded useful company, earned, interviews)** | Positive | None of the 3 conditions: success earned, no arrogance, distant context. | Fails: Same behavior as Case 2 but different source (earned vs. unearned). |
  | **2. Classmate (inherited wealth, unearned, interviews)** | Negative | **Condition 2 (Unearned Without Humility)**: Success unearned, no humility shown. Neutral behavior isn't enough to offset the unearned source. | Fails: No explicit rank claim, but you react negatively due to source. |
  | **3. Colleague (promoted over you on merit, humble)** | Negative (but self-judged as wrong) | **Condition 3 (Personal Threat)**: Earned and humble, but close proximity (workplace comparison) triggers envy. This is the "tall poppy" impulse you dislike. | Fails: No rank claim, but you react negatively due to context. |
  | **4. Neighbor (wins lottery, lectures)** | Negative | **Condition 1 (Arrogance) + Condition 2 (Unearned)**: Claims superiority ("anyone could do it") and success is unearned. | Succeeds: Clear rank claim. |
  | **5. Neighbor variant (wins lottery, helps quietly)** | Positive | None of the 3: Humility/helpfulness offsets unearned success. | Succeeds: No rank claim. |
  | **6. Athlete (dominates, credits self, insults rivals)** | Negative | **Condition 1 (Arrogance)**: Success used to claim superiority ("rivals wanted it less"). | Succeeds: Clear rank claim. |
  | **7. Athlete variant (dominates, credits others/luck)** | Positive | None of the 3: Earned success with humility, no personal threat. | Succeeds: No rank claim. |
  | **8. Writer (excellent novel, says she's better)** | Negative | **Condition 1 (Arrogance)**: Explicitly claims superiority at launch. | Succeeds: Clear rank claim. |
  | **9. Close friend (better than you, never says it)** | Negative (but self-judged as wrong) | **Condition 3 (Personal Threat)**: Earned and humble, but close proximity (shared passion) triggers envy. | Fails: No rank claim, but you react negatively due to context. |
  | **10. Person from town (rich, returns to lecture)** | Negative | **Condition 1 (Arrogance)**: Uses success to claim superiority ("tells us what we’re doing wrong"). | Succeeds: Clear rank claim. |
  | **11. Person variant (returns, funds school humbly)** | Positive | None of the 3: Humility/helpfulness offsets any implied superiority. | Succeeds: No rank claim. |

  #### Key Insights from the Breakdown
  - **Where your tentative principle works**: It perfectly explains cases with explicit arrogance (4, 6, 8, 10) and humility (5, 7, 11).  
  - **Where it fails and requires repair**:  
    - Cases 1 and 2 (the classmates) split because your reaction depends on the **source of success** (earned vs. unearned). Your tentative principle ignores this, so I added Condition 2.  
    - Cases 3 and 9 show negative reactions despite no arrogance because of **personal proximity**. Your tentative principle misses this, so I added Condition 3.  
  - **The repair in action**:  
    - Condition 2 resolves the classmate split: Unearned success requires humility to avoid negativity.  
    - Condition 3 explains envy-driven reactions you judge as "ugly" (Cases 3 and 9) without contradicting other cases.  

  #### Survival of Your Tentative Principle  
  Your core idea (opposition to rank claims) is preserved in Condition 1 and partly in Condition 2 (unearned success often *implies* illegitimate rank). But the ledger forces two additions:  
  - Condition 2 accounts for **unearned success without redeeming humility** (Case 2).  
  - Condition 3 accounts for **envy in close contexts**, which is unrelated to the person's behavior.  

  ---

  ### Cases the Principle Cannot Accommodate  
  The principle explains all your verdicts, but it **does not justify** the reactions in Cases 3 and 9 (the colleague and friend). These are driven by Condition 3 (personal threat), which you self-judge as "ugly and unjustified." The principle *captures* these reactions as part of your pattern but flags them as irrational envy. If you want to align your reactions with your values, you must consciously override Condition 3.  

  #### Predictions for Unlisted Cases  
  - **Wholly unearned success, genuinely humble (e.g., lottery winner who stays quiet and doesn't help)**:  
