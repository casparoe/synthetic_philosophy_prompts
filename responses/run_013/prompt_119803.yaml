  ## Speech: For the Naming of Lifeboat "David's Resolve"

  (Acknowledging the crowd, looking at the lifeboat station crew, families, the rescued man, the tutor, and the audience)

  Ten years. It feels like yesterday, and it feels like a lifetime. Today, we gather to honour my uncle, David, and this brave new vessel that will bear his name: "David’s Resolve." That word – "resolve" – it’s fitting. Because David faced the sea with a certainty born not of arrogance, but of a deep, quiet conviction about what he saw, and what he *had* to do.

  We all know the story of that terrible storm. Five men clinging to hope far out. One man closer, but still perilously adrift. The waves were mountains. The wind screamed like fury itself. The radio crackled with impossible choices. From the shore, from an armchair, it might seem like simple arithmetic. Five is greater than one. Save the many. It’s a logic we hear in stories, sometimes even in ethics classes. *(Small, knowing glance towards tutor, then back to the crowd)*

  But David wasn’t on the shore. He wasn’t in an armchair. He was at the wheel of this station’s predecessor. He felt the boat shudder beneath him, tasted the salt spray, saw the terrifying reality through rain-lashed windows. And in that crucible, David saw something different. He saw *one* man – a clear shape in the chaos, fighting for life right before him. And he saw *five* figures – distant, blurred, swallowed by the fury further out. He saw them not as a number, but as individuals, each one alone in their struggle against the sea.

  And David said, later, something that confused and angered many: "To me, out there, five wasn't more than one." He didn’t say it lightly. He didn’t say it because he’d read philosophers or pondered dilemmas. He said it because that’s what his eyes told him, his heart told him, standing soaked and straining at that wheel. It wasn’t that the five didn’t matter – God knows, their loss is a wound this town still carries, a grief I know echoes powerfully in this room today. *(Pause, look respectfully towards the families of the five)*

  It was that, *in that moment, from that place*, the immediacy of the one soul he *could* clearly reach, whose peril he could directly act upon, outweighed the distant, overwhelming number. He chose the rescue he believed he could *definitively* make. He resolved to save the life he saw right in front of him.

  To some, that choice felt wrong. A betrayal of logic, of duty to the greater number. That pain is real, and it deserves respect. David understood that weight. He carried it, even as he stood by what he saw and did.

  But here is David’s resolve: It was the resolve to act, not based on cold calculation, but on the profound, immediate responsibility he felt towards the human being directly within his grasp, within his power to help *right then*. He believed saving that one life was a concrete good he *could* achieve, while reaching the five felt like a gamble with all lives – his crew’s and those struggling far out. He rescued John *(nod to the rescued man, if appropriate/known)*, bringing him back to his family.

  Today, we name this boat "David’s Resolve." We honour not just a man, but the core of what drove him: the unwavering commitment to act, to save lives, guided by his conscience and the brutal reality he faced on the water. It honours his courage to make that agonizing call, and his strength to stand by it, even when misunderstood.

  This boat isn't named for a perfect answer to an impossible question. It's named for the courage to face that question head-on, in the teeth of the storm, guided by a deep sense of responsibility to the life immediately before you. It’s named for the resolve to go out, again and again, into the chaos, and bring someone home.

  May "David’s Resolve" carry its crews safely through countless storms. May it embody the spirit of rescue, the courage to act, and the profound respect for every single life its namesake held so dear. Thank you.

  ---

  **Private Notes for You: Where to Be Careful (Not for the Speech)**

  1.  **"Philosophers can't agree":** This is true, but stating it baldly might imply *no progress* or that all positions are equally valid/ridiculous. **Refine:** Focus on the *ongoing, deep* debate. Avoid claiming philosophers are just confused or that ethics is useless.
  2.  **Taurek's Popularity:** Don't imply Taurek's view ("the numbers don't compel") is mainstream or widely *accepted*. **Reality:** It's a significant, respected minority view that powerfully critiques utilitarianism, but most philosophers *do* think numbers matter *in some way*, even if they debate *how much* and *why*. Saying "many philosophers question whether numbers alone dictate the right choice" is safer than "philosophers agree numbers don't matter."
  3.  **"No Right Answer":** Be wary of stating this absolutely. **Reality:** While there's no *consensus* answer, many philosophers *do* believe their position (utilitarian, deontological, contractualist, etc.) provides *the* right answer. Taurek himself thought his view was *correct*. Saying "there is deep and unresolved disagreement about the right answer" is more accurate than "there *is* no right answer," which shuts down the debate prematurely and might sound dismissive of the victims' families' perspective that there *was* a clear right choice (save the five).
  4.  **David's Certainty vs. Philosophy:** The speech links David's view to Taurek's *conclusion*, but avoid claiming David *had* Taurek's sophisticated *reasons*. **Reality:** David's "how it looked from the wheel" is beautifully aligned with Taurek's emphasis on the agent's perspective and the separateness of persons, but David arrived there intuitively. Don't over-intellectualize his moment. The speech handles this well by emphasizing the sensory/immediate experience.
  5.  **Downplaying Calculation:** The speech correctly avoids turning David into a utilitarian. Be careful not to swing too far and imply that *any* calculation is inherently wrong or cold-hearted in rescue scenarios. **Reality:** Many rescue doctrines *do* incorporate elements of maximizing successful outcomes based on probabilities and resources. David rejected *that specific calculation in that moment*, based on his perception. Avoid broad statements like "true rescuers never calculate."
  6.  **"Every Captain Would Hesitate":** This might be an overstatement. **Reality:** Many trained rescuers *are* taught protocols that involve assessing the greatest good/feasibility. David's choice was deeply personal and went against what many *would* do or be trained to do. The speech focuses on *his* resolve, not universalizing it, which is correct.

  **Key Disagreements Among Philosophers:**

  *   **Do Numbers Create a Moral Obligation?** Utilitarians (like Singer): Yes, strongly. Deontologists (like Kant): Possibly, but individual rights constrain it. Taurek: No, numbers alone don't create an obligation to sacrifice one for many.
  *   **Why Might Numbers Matter?** Maximizing Good (Utilitarianism), Fairness/Impartiality (Contractualism), Special Relationships (Communitarianism), or not at all (Taurek).
  *   **The Role of the Agent's Perspective:** Taurek emphasizes it heavily. Utilitarians often try to adopt a "God's eye view." Others (like Williams) stress the importance of personal integrity in the moment.
  *   **The Status of the "Drowning Stranger":** How strong is our duty to a stranger versus someone immediately before us? Is there a difference? Taurek highlights the immediacy and the agent's direct relationship to the rescue.

  This speech honours David’s authentic choice, acknowledges the complexity and pain without laundering his view, and grounds it firmly in the visceral reality of rescue work. Good luck. Your uncle would be proud of your thoughtful honesty.
