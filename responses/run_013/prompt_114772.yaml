answer: |-
  A sharp point, but one I've parried before. The isolation test applies to *states of affairs* considered as unified wholes, not to their constituent parts in splendid isolation. When we value personal affection intrinsically – say, the complex state "A lovingly admiring B's genuine virtue" – the isolation test asks us to contemplate a universe *containing only that entire state*. We don't atomize it into "A," "B," and "admiration" separately; we consider the organic unity *as a whole*. In that universe, stripped of all else, the presence of this loving appreciation *does* make it better than a universe utterly devoid of it. Its goodness is intrinsic to the complex relational fact itself. The beloved’s actual merit isn’t an external condition making the affection good; it’s an essential *part* of the valuable whole. A world containing "A deludedly 'admiring' non-existent virtue in B" is a *different whole* with lesser, or even disvaluable, intrinsic worth. The organic unity framework captures this precisely: the value emerges from the specific configuration of parts, including the relational ones, within the bounded whole under evaluation. The value is intrinsic *to that relational complex*.
