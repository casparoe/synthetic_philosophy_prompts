prompt: |-
  I'm the secretary of a small darts league — nine teams, a printed rulebook that's been added to since 1974, and an AGM every October in the back room of the King's Head. We've got ourselves in a right tangle about what counts as a proper rule change and I'd like someone to tell me what I actually think, because I keep contradicting myself.

  Here's where I come out on the ones we've argued about:

  1. In 2011 the AGM used the amendment rule (Rule 30, two-thirds of those present) to change Rule 30 itself, so that a simple majority would do in future. I think that was fine. If two-thirds of us want to make it easier to change things, who's to stop us?

  2. In 2013, on the back of that, a simple majority added Rule 31: 'Rule 31 may not be amended or repealed.' I think that one's worthless. You can't tie the hands of people who haven't joined yet, and any AGM can vote it away. But then I also think the 2015 rule — subs can only go up if the rise is passed at two AGMs running — is perfectly good, and I'd hold anyone to it. Both of those are just trying to stop a later AGM doing something. Why is one real and the other not?

  3. In 2016 the comittee used the bit in Rule 2 about 'the spirit of the game' to throw out an eligibility rule the AGM had passed by a big majority. I think that was bang out of order. The committee's not there to overrule the AGM. Though I'll admit I can't say what's actually wrong with it, seeing as the committee was only doing what Rule 2 says it can.

  4. In 2017 the AGM passed a rule about forfeits on a show of hands when Rule 30 said postal ballot. So it wasn't passed properly. I say it isn't a rule and we'd have to do it again. Procedure's procedure.

  5. But then the no-smoking rule in the pavilion. Never passed at any AGM as far as anyone can find, not in the printed book, enforced since about 1998 by whoever's running the night. I'd call that a rule of the league the same as any other. Same with the handshake at the end of a match, which isn't written down anywhere either.

  4 and 5 seem to pull opposite ways and I can't make them sit down together.

  The one I really can't call: at last year's AGM someone pointed out that a simple majority of those present — usually about eleven people out of two hundred members — could vote to abolish the AGM altogether and hand the lot to the committee. Nothing in the book stops it. Half of me says that's what the rulebook says, so it's a valid change, and then we've no AGM, which is a mad thing to arrive at by following the rules. The other half says a vote can't be allowed to kill off the very thing that makes votes count.

  So: is there one principle about when a rule change sticks that gets all of 1 to 5, and that tells me what to do about the last one? What I've been working with is something like 'a change is good if the rulebook in force at the time let you make it that way, and where the rulebook is silent, whatever we've all been doing counts as the rule' — but I can see that's two principles wearing one coat and I don't know which to drop. If there's no single principle, give me the smallest set, say which of my verdicts I have to give up, and be straight with me about it. I'm not after the names of philosophers, I want the actual principle.

  Two more I haven't had to decide yet, if it helps to test it on them: can a rule that was passed perfectly properly be killed off by the committee simply never enforcing it for ten years? And can the league bind itself now never to merge with the county association, or can a later AGM always undo that?
reasoning: |-
  Okay, let's tackle this darts league rulebook conundrum. The secretary is struggling with several contradictory judgments about rule changes and wants a consistent framework. 

  First, I recognize this as a classic case of constitutional paradoxes - self-amendment, entrenchment, and implied authority. The core tension is between written rules and lived practice, plus the league's need to govern itself while respecting its own history.

  Looking at their specific dilemmas:
  The 2011 amendment lowering voting thresholds seems valid - existing rules allowed it with proper supermajority. The problem starts with 2013's Rule 31 attempting absolute entrenchment. I agree with their instinct that you can't bind future AGMs this way, but then their acceptance of the two-AGM subs rule creates conflict. The key distinction is procedural entrenchment (making certain changes harder) versus substantive entrenchment (making topics permanently off-limits). The former is valid; the latter isn't.

  When it comes to unwritten rules like the smoking ban and handshake tradition, I'm nodding along. These demonstrate customary law - practices so consistently followed they gain rule-like status. That explains why they feel legitimate despite lacking AGM approval. 

  The committee overriding an AGM vote via "spirit of the game" raises red flags. Rule 2 might grant interpretive authority, but not legislative veto power. This seems like overreach unless the committee was applying existing rules to invalidate improperly passed amendments.

  For the improperly passed forfeit rule versus customary practices, the difference lies in provenance. The forfeit rule failed the procedural test at birth, while smoking/handshake rules grew organically from collective behavior. One is a defective statute; the others are common law.

  The AGM abolition scenario keeps me up at night. It's technically possible under their amended rules, but violates the league's foundational principle that ultimate authority rests with members. I'm thinking this is where their "rulebook + custom" framework hits a wall - they need to acknowledge inherent limits to amendment power.

  Testing on their additional questions: Non-enforcement doesn't repeal rules; it just creates dead letters. And merger bans can't bind future generations absolutely - procedural hurdles yes, but not eternal prohibitions.

  What emerges is a three-legged stool: 1) Written rules control when clear and properly enacted 2) Custom fills gaps 3) Amendments can't destroy the democratic foundation. The secretary might need to gently undo that 2013 entrenchment attempt while codifying key traditions.
answer: |-
  You're wrestling with the fundamental tension between **procedure** and **substance** in self-governing organizations. Your instincts are largely sound, but they need refining into consistent principles. Here's the clearest framework to resolve your dilemmas, based on legal/political philosophy concepts applied practically to your league:

  **The Core Principles:**

  1.  **Procedural Validity:** A rule change is valid *only* if it follows the *correct procedure in force at the time of the change*. This is non-negotiable for *enacted* rules.
  2.  **Customary Practice:** Rules can arise implicitly through **consistent, long-standing, and universally accepted practice** by the members, even without formal enactment. These fill gaps and govern areas where the written rules are silent.
  3.  **The Principle of Continuing Sovereignty:** A current decision-making body (the AGM) cannot permanently bind future decision-making bodies (future AGMs) on matters of fundamental process or the *existence* of the body itself. You can make changes *harder* (procedural entrenchment), but you cannot make them *impossible* (substantive entrenchment) or abolish the sovereign body itself.
  4.  **Implied Limits on Delegated Authority:** Committees derive their power *from* the rules set by the sovereign body (the AGM). They cannot override the AGM's *validly enacted* rules unless explicitly granted that power in a way that survives scrutiny under Principle 3.

  **Applying the Principles to Your Cases:**

  1.  **2011 Amendment to Rule 30 (Lowering Threshold):** **VALID.** It followed the *then-current* procedure (Rule 30, 2/3 vote) perfectly. (Principle 1).
  2.  **2013 Rule 31 ("This rule cannot be amended"):** **INVALID.** It violates Principle 3. A simple majority AGM cannot prevent a future AGM (even a simple majority one) from amending or repealing a rule. It's an attempt at substantive entrenchment. Future AGMs retain sovereignty.
  3.  **2015 Rule (Subs rise needs 2 consecutive AGMs):** **VALID.** This is *procedural* entrenchment. It makes changing *subs* harder by requiring a specific, repeatable procedure (two votes). It doesn't *forbid* change, just sets a higher bar *within the existing framework*. Future AGMs can still change subs, they just have to jump through the extra hoop twice. This respects Principle 3. (Principle 1 & 3).
  4.  **2016 Committee Overruling AGM via "Spirit":** **INVALID.** Rule 2 ("spirit of the game") likely grants interpretive authority for *applying* rules or handling unanticipated situations *within the framework*. It does **not** grant legislative authority to override a *validly enacted* rule by the sovereign body. The committee exceeded its delegated authority. (Principle 4).
  5.  **2017 Forfeit Rule (Wrong Procedure):** **NOT A VALID RULE.** It failed Principle 1. The procedure in force (Rule 30 - postal ballot) wasn't followed. It has no legal force within the rulebook system, regardless of the majority. It needs re-passing correctly.
  6.  **No-Smoking Rule & Handshake (Unwritten Practice):** **VALID CUSTOMARY RULES.** These satisfy Principle 2. They are:
      *   **Consistent:** Enforced since 1998 / always done.
      *   **Long-Standing:** Over 20 years / presumably since inception.
      *   **Universally Accepted:** Treated as mandatory by members and officials.
      *   **Govern an area:** Regulate conduct (smoking) and sportsmanship (handshake).
      *   **No Conflict:** The written rules are silent on these specifics. They fill the gap.

  **Resolving Your Apparent Contradiction (4 vs 5):**
  *   **4 (Forfeit Rule):** An attempt to *create a new written rule* that *failed procedure*. Invalid.
  *   **5 (Smoking/Handshake):** *Unwritten practices* that *became rules through universal custom* over time. Valid because written rules were silent and custom filled the void. Principle 1 governs *enactment*. Principle 2 governs *custom*.

  **The AGM Abolition Scenario:**
  *   **Half Right:** Technically, under the *current* simple majority rule, an AGM could vote to abolish itself and transfer power to the committee (if the rulebook is silent on this). *However*, this violates Principle 3 catastrophically. Abolishing the AGM destroys the *source* of all legitimate authority (the membership meeting). The committee only has power *granted by the AGM*.
  *   **The Principle:** While procedural changes are valid (like lowering thresholds), a change that *destroys the sovereign body itself* (the AGM) is fundamentally illegitimate, even if procedurally possible under a momentary rule. The AGM's power comes from the members' inherent right to govern themselves collectively. A vote cannot extinguish that inherent right; it can only change *how* it's exercised.
  *   **Verdict:** Such a vote would be **invalid**. The principle of continuing sovereignty (Principle 3) implies an inherent limit: amendments cannot destroy the body that holds ultimate authority. Future members must always have a path to exercise collective sovereignty. A committee is a *delegate*, not a *sovereign*.

  **Answering Your Test Questions:**

  1.  **Can non-enforcement kill a properly passed rule?** **NO.** Non-enforcement is a *failure*, not a *repeal*. It might lead to the rule becoming a "dead letter" *in practice*, but it remains formally valid. Only a valid repeal (Principle 1) or replacement by custom (Principle 2, if the practice contradicts the rule and becomes universally accepted) can formally end it. The committee lacks the inherent authority to repeal AGM rules by neglect (Principle 4).
  2.  **Can the league bind itself *never* to merge?** **NO, not absolutely.** It can make it *extremely difficult* procedurally (e.g., requiring a 90% vote at 3 consecutive AGMs plus a referendum - procedural entrenchment). But it cannot create a *substantive* entrenchment clause saying "This rule cannot be repealed or amended under any circumstances." (Principle 3). A future AGM, following whatever the *current* high procedural hurdle is, could still vote to merge. The principle of continuing sovereignty applies.

  **Your Verdicts to Adjust:**

  *   **Give Up:** Your initial acceptance of the *absolute* nature of the 2015 rule (subs rise). While valid as procedural entrenchment, you must accept that a *future* AGM *could* change it, *if* it first amended the 2015 rule itself (following its own procedure, or a procedure changed by a later valid amendment) to remove the double vote requirement, *or* managed to pass the rise twice under the existing rule. It makes change hard, but not impossible forever.
  *   **Reinforce:** Your rejection of Rule 31 (2013) and the committee overrule (2016) are correct under these principles.
  *   **Clarify:** Your acceptance of the smoking/handshake rules is correct as customary law, distinct from the failed enactment of the forfeit rule.

  **The Smallest Set of Principles You Need:**

  1.  **Follow the current procedure exactly for new written rules.**
  2.  **Accept long-standing, universal practice as valid rules where the book is silent.**
  3.  **No rule can permanently remove the members' future right to change things through their collective meeting (AGM).**
  4.  **Committees only have the power the AGM gives them; they can't override valid AGM rules.**

  This framework resolves all your cases consistently, provides clear answers to your test questions, and tells you the AGM abolition vote is invalid despite procedural possibility. It balances respect for past decisions with the inherent right of future members to govern themselves. Now, get that rulebook tidied up at the next AGM!
