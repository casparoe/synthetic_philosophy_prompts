prompt: |-
  For the past three years I have sat on the steering committee of the participatory budgeting process in my city, and I have been trying, without much success, to work out what we are actually committed to when we run it. I have no formal training in philosophy, but I have read a fair amount on my own, and I suspect the process assumes something about democracy that no one has ever stated out loud. I would like you to help me pin it down.

  Here is how the process works. Each year the city sets aside a fixed share of its capital budget — money for physical projects, not services — and divides the city into districts. In each district, residents meet in open assemblies over several weeks, hear from city engineers about what is technically possible, propose projects, argue them through, and then vote on a ranked list. The winning projects, up to each district's allocation, are binding on the city: they go into the capital plan and are built. Before anything reaches the ballot, a staff office screens each proposal for cost and feasibility, and anything the engineers judge infeasible or beyond the allocation is struck. Once a winning project is built, there is no mechanism for revisiting it and no requirement that the city report back on whether it worked. Separately, the same city holds ordinary up-or-down referendums on other questions, where residents simply vote yes or no on a proposal the council has already drafted.

  What puzzles me is this. During the assemblies, everything is arranged as if people's preferences are not yet settled — as if the point of meeting, hearing the engineers, arguing with neighbours, and revising is to work out what the district actually needs, and as if a good proposal is a kind of hypothesis about what will help. But the moment voting starts, the whole thing treats those preferences as finished and simply counts them, exactly like the referendum. And once a project wins, the process treats it as settled — built, done, never examined again — even though the discussion that produced it was all about uncertainty and revision.

  A friend who studied philosophy says this sounds like John Dewey: that for him democracy was less a matter of elections than a way of living and inquiring together, and that a policy was the sort of thing you try and then learn from. But I do not know whether our process actually commits us to anything like that, or whether it merely borrows the vocabulary while resting on something far more ordinary.

  Please tell me what view of democracy, and of inquiry, the process as I have described it actually presupposes. Be specific about which parts of it strictly require a particular view and which merely happen to fit several. Tell me which rival pictures of democracy the process quietly rules out — for instance, that voting is simply the aggregation of preferences people already have, or that governing is a matter for experts who consult the public rather than for a public that decides. Say whether the pieces of the process are consistent with one another or whether, as I suspect, the assembly phase and the voting-and-building phase pull in different directions. And finally, tell me what would have to change about the process if the view you identify were replaced by its main rival: what we would have to stop doing, and what we would have to start doing, for the process to be honest about what it assumes.
reasoning: |-
  Okay, let me start by really unpacking what this user is asking. They've been on the steering committee for their city's participatory budgeting (PB) process for three years and are struggling to understand the underlying philosophical commitments of the process. They describe a disconnect between the deliberative assembly phase—where residents discuss, propose, and revise projects—and the voting/building phase, where everything gets locked in without further review. 

  First, I need to break down the key elements of their PB setup: the open assemblies with technical input, proposal refinement, ranked-choice voting, binding implementation without evaluation, and the contrast with simple referendums. The user’s core concern is the tension between the process’s Deweyan-style deliberation (emphasizing collective inquiry and experimentation) and its rigid, preference-aggregation voting phase. 

  The user’s background is important here. They’re a practitioner, not a philosopher, but they’ve done independent reading. Their frustration suggests they sense a hypocrisy—that the process "performs" Dewey without fully committing. Their friend mentioned Dewey, and they’re wondering if the PB is just cosplaying democratic ideals while actually being utilitarian or technocratic underneath. 

  Digging deeper, their unspoken need might be legitimacy. If the process is philosophically incoherent, it could undermine their work. They might want to either reform the PB to align with its aspirations or honestly admit its limitations. They’re also likely seeking intellectual clarity to advocate for changes, hence asking what’d need to shift if they adopted a rival view. 

  Now, analyzing the process through democratic theories: 
  - **Deweyan pragmatism** fits the assembly phase—collaborative inquiry, revising ideas based on discussion/tech input. 
  - But the voting phase is pure **aggregative democracy** (Schumpeter, Downs), treating preferences as fixed. 
  - The lack of evaluation contradicts Dewey’s "experimentalism," leaning into **technocracy** (experts handle implementation/feedback). 
  - **Deliberative democracy** (Habermas) is partially present but undermined by no requirement for post-hoc accountability or iterative learning. 

  The inconsistency stands out: assemblies say "preferences are malleable," voting says "preferences are fixed." The process rules out strong deliberative or Deweyan models by skipping evaluation and reflection. If they wanted true Deweyan PB, they’d need post-project reviews, iterative redesign, and maybe deliberative post-mortems. Switching to pure aggregative democracy would mean dropping assemblies entirely—just send ballots. 

  This user’s insight is spot-on: their PB is a hybrid, but the unresolved tension risks making both phases half-hearted. They’re probably looking for leverage to push for changes (e.g., adding evaluations) or to reframe expectations. I should emphasize where the model is coherent (binding votes prevent co-option) and where it’s unstable (ignoring its own experimental rhetoric). 

  Lastly, their "what if" question is practical. They need concrete contrasts—e.g., "If Deweyan, add X; if aggregative, remove Y"—to ground committee debates. Nailing this could help them decide whether to fight for reform or redefine success.
answer: |-
  Based on your detailed account, your participatory budgeting (PB) process embodies a **pragmatic but philosophically unstable hybrid model**. It blends elements of deliberative democracy with preference-aggregation mechanics, while quietly relying on technocratic finality. Its core commitments and tensions are as follows:

  ### 1. **Core Presuppositions**
     - **Epistemic View of Preferences**:  
       The *assembly phase* assumes **preferences are not fixed** but can be shaped through dialogue, technical information, and collective inquiry (aligning with Dewey or Habermas). Proposals are treated as hypotheses ("What might serve our needs?"), requiring public testing through discussion.
       *Requires*: This phase strictly needs a view where preferences are malleable and knowledge is socially constructed. Without this, assemblies become performative rituals.

     - **Aggregative Legitimacy**:  
       The *voting phase* assumes **preferences are final and quantifiable**. Ranked-choice voting treats votes as settled inputs to be counted, not questioned—mirroring the referendum model (Bentham/Schumpeter).  
       *Requires*: This mechanically demands a preference-aggregation view. Ballots are data, not invitations for further dialogue.

     - **Technocratic Closure**:  
       The *implementation phase* assumes **outcomes need no democratic evaluation**. Experts screen proposals pre-vote, and projects are built without post-hoc accountability. This implicitly trusts technical expertise over ongoing public judgment (Weberian bureaucracy).  
       *Requires*: A view that democracy ends at decision-making, and implementation/evaluation is a technical matter.

  ### 2. **Inconsistencies and Tensions**
     - **The Deweyan Disconnect**:  
       Your process *invokes* Deweyan inquiry ("working out what the district needs") but *abandons* its core tenet: **experimentalism**. For Dewey, policies are always provisional ("trying and learning"). By contrast, your PB treats projects as closed once built, contradicting the assembly's spirit of open-ended inquiry.
       
     - **Deliberation vs. Aggregation**:  
       Assemblies foster **reason-giving** (deliberative democracy), where legitimacy arises from the quality of discourse. Voting reduces legitimacy to **arithmetic** (aggregative democracy). The process switches between these logics abruptly, creating whiplash.

     - **Silent Technocracy**:  
       While residents decide *which* projects to fund, experts retain control over *feasibility* (pre-screening) and *evaluation* (no reporting). This rules out radical participatory models where citizens co-design technical solutions or assess outcomes.

  ### 3. **Rival Models Ruled Out**
     - **Pure Preference Aggregation** (e.g., Schumpeter):  
       Ruled out by the assembly phase. If preferences were fixed, assemblies would be redundant—referendums alone would suffice.
     
     - **Strong Deliberative Democracy** (e.g., Habermas):  
       Ruled out by the lack of post-implementation discourse. Deliberation is truncated at the vote, with no mechanism for citizens to revisit decisions based on outcomes.
     
     - **Expert Technocracy** (e.g., Plato/Saint-Simon):  
       Ruled out by binding citizen votes. Experts advise but don’t decide.
     
     - **Radical Participatory Democracy** (e.g., Pateman):  
       Ruled out by technocratic closure. Residents don’t co-create technical designs or evaluate success.

  ### 4. **What Changes Under a Rival View?**
     Suppose you replaced the current hybrid with a **consistent Deweyan model** (its closest aspirational fit). Key changes would be:

     | **Current Element** | **Deweyan Revision** |
     |---------------------|----------------------|
     | Pre-vote expert screening | Collaborative feasibility: Residents + engineers co-design proposals to meet constraints |
     | Voting as final decision | Voting as a provisional mandate: Winning projects are *piloted* with built-in review |
     | No post-implementation feedback | Required impact assessments: Public forums to evaluate projects 1–2 years after completion |
     | Fixed capital projects | Iterative design: Projects revised based on feedback, or funding reallocated if ineffective |
     | Disconnected annual cycles | Overlapping cycles: Lessons from past projects inform new assemblies |

     Conversely, adopting **pure aggregation** would require:
     - Eliminating assemblies; sending ballots directly to residents.
     - Accepting proposals without technical screening (risking infeasibility).
     - Keeping the "no evaluation" rule (preferences need no justification).

  ### Why Your Suspicion Is Correct
  The assembly phase and voting phase **do pull in opposite directions**: one treats democracy as *dialogue*, the other as *calculation*. This hybrid may be pragmatically necessary (e.g., to balance efficiency with participation), but it risks **performative contradiction**: using the language of collective inquiry while denying its logical conclusion (experimental evaluation). 

  ### Practical Implications
  To align the process with its Deweyan veneer:
  1. **Add Evaluation**: Require post-project reports and public forums to assess outcomes.
  2. **Iterate Designs**: Allow amendments to funded projects if new evidence emerges.
  3. **Integrate Experts Differently**: Frame engineers as co-inquirers in assemblies, not gatekeepers.

  If retaining the status quo, acknowledge its compromises: It prioritizes *decision efficiency* and *technical stability* over democratic learning—a common trade-off in real-world PB. Your unease reflects a healthy instinct: When processes invoke Dewey but ignore his experimentalism, they risk becoming **democracy theater**.
