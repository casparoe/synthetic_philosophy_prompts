prompt: |-
  I am trying to get clear on a knot in Kant's practical philosophy, and I would like help with the structure of the position rather than a summary of it. The following is my own paraphrase, not a quotation, of the passage I keep returning to in his moral writings on our relations to non-human animals: he maintains that animals are not self-conscious, that they exist only as means to an end, and that we have no duties to them; that we nonetheless have genuine duties regarding them, which are indirect duties to humanity; and that these duties are real because cruelty to animals dulls the shared feeling of sympathy that is the sensible condition of our duty to other human beings, whereas kindness towards them strengthens it. He adds that an animal's service and fidelity, though nothing is owed to the animal itself, is analogous to something owed to a person, and he does not say plainly whether that analogy is illustrative or does work in the argument. I am aware that this compresses claims from texts of different periods and that the wording is mine, so please reason from the content rather than from the exact phrasing.

  My difficulty is this. I can reconstruct the dulling argument as an empirical one: cruelty now makes cruelty later more likely, so refraining is prudent. But Kant seems to want the requirement to be necessary and not merely prudential, and an empirical generalisation about habituation cannot deliver that. If instead the argument is transcendental, the claim must be that the capacity for moral feeling has conditions and that we are under a duty to preserve them; yet that looks like a duty concerning a state of ourselves, and it is not obvious that a duty to keep one's own sympathy intact can be a duty of virtue in his sense, which is a duty to adopt ends rather than a duty to manage one's sentiments. Nor can I see how the no-direct-duties claim survives the analogy claim: if animals are not persons but their service is the analogue of what persons are owed, is the analogue doing any independent work, or is it merely a way of saying that treating animals well is practice for treating persons well?

  What I want is a diagnosis rather than a verdict. Identify which strand in the position is load-bearing and which is ornament; say whether the dulling argument can be made out as a genuine duty of virtue, or whether it must fall back on prudence or on self-cultivation; and explain what the analogy to what persons are owed is doing if the denial of direct duties is retained. I would rather keep the denial of direct duties and make the indirect account strong than abandon it for a softer sentimentalism, but I want to know what that costs and where the account becomes unstable.

  Lead with your bottom line in the first sentence, then give the reasoning. No preamble, no restating of what I have asked. Please write in British English.
reasoning: |-
  Okay, the user is grappling with a knotty issue in Kant's practical philosophy regarding our duties towards non-human animals. They've presented a well-structured paraphrase of Kant's position and identified two key tensions: first, whether the "dulling argument" can be a genuine duty of virtue rather than mere prudence, and second, whether the analogy to human obligations contradicts the denial of direct duties to animals.

  Let me unpack this systematically. The core of Kant's position rests on the transcendental argument about preserving moral receptivity - this is the load-bearing structure. The empirical "dulling" observation is merely illustrative ornamentation. For the duty to preserve sympathy: this qualifies as a duty of virtue because cultivating moral feeling (a natural predisposition) is necessary for recognizing our duties to others. It's not about sentiment management per se, but about maintaining the sensible conditions for moral motivation.

  Regarding the analogy: it serves an important but limited role. The comparison to human obligations isn't foundational but pedagogical - it leverages our existing moral understanding to reinforce why animal kindness matters, without granting animals moral status. The analogy remains stable because it's strictly analogical, not equivalential.

  The cost of maintaining Kant's denial of direct duties is significant: it renders our obligations to animals entirely derivative and anthropocentric. The account becomes unstable at the edges - for instance, in cases where animal treatment has no conceivable human impact. But this is the price of Kant's rigorous autonomy framework where only rational beings can be ends-in-themselves.

  The user clearly wants to preserve Kant's architecture while testing its coherence. Their resistance to "softer sentimentalism" suggests they value philosophical rigor over intuitive appeal. I should honor that by showing how the transcendental argument holds structurally, while acknowledging where the system strains under its own weight.
answer: |-
  The load-bearing strand is the transcendental argument that preserving our capacity for sympathy is a necessary condition for fulfilling direct duties to persons, making it a genuine, necessary duty of virtue regarding ourselves, not mere prudence concerning animals.  

  **Reasoning:**  
  1.  **The Dulling Argument Transcendentalised:** Kant’s claim isn't just an empirical generalisation about habituation. It’s that sympathy (*Mitgefühl*) is a natural predisposition (*Naturanlage*) which is a "subjective condition of receptiveness to the concept of duty" (MM 6:399). Duties of virtue require adopting the *end* of humanity in ourselves and others. Cultivating sympathy isn’t primarily managing sentiment; it’s preserving a necessary sensible condition *for recognising and being motivated by* our rational duty towards persons. Failing to preserve this condition hinders our capacity to fulfil direct duties, making its preservation a necessary duty *to ourselves* as moral beings. Prudence is contingent; this duty is necessary because moral agency requires these subjective conditions.  

  2.  **The Analogy's Role:** The analogy to what persons are owed ("service and fidelity") is primarily *illustrative and pedagogical*, not foundational or conferring status. It leverages our understanding of direct duties to *emphasise the fittingness* of kindness towards animals within the indirect duty framework. It highlights *why* cruelty is particularly reprehensible (it betrays a trust *analogous* to human relations) and *reinforces the moral sensibility* being cultivated. It does *independent* work in shaping our moral perception and motivation, but it doesn't ground the duty or contradict the denial of direct duties. The duty’s source remains the preservation of our humanity-focused moral capacity, not anything owed *to* the animal.  

  3.  **Costs and Instability:** Maintaining the denial of direct duties costs:  
      *   **Anthropocentrism:** Animals have only instrumental value relative to human morality.  
      *   **Fragility:** Duties regarding animals vanish if cruelty *somehow* didn’t damage sympathy or if sympathy were deemed unnecessary (which Kant denies).  
      *   **Marginal Cases:** The logic struggles to explain duties regarding animals with no human interaction or where sympathy seems irrelevant (e.g., preserving endangered species unseen by humans).  
      The account becomes unstable if the analogy is pressed *too* far, suggesting animals deserve consideration *like* persons, undermining the core premise. Its stability relies on strictly limiting the analogy to its illustrative/heuristic role within the indirect framework grounded in human moral self-preservation. The transcendental necessity of preserving moral sensibility provides the required strength, bypassing empiricism, but at the cost of this radical indirectness.
