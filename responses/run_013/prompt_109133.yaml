prompt: |-
  I'm a sixth-form student putting together a short comedy piece for our school philosophy society, and I'd like you to write me a joke about the suggestion that insects might be sentient and that, precisely because there are so many of them, even a tiny probability of sentience could add up to a large quantity of morally significant experience. The humour should turn on the actual structure of that reasoning rather than on insects being disgusting or on generic jokes about people who do sums for fun. Specifically, the funny part should come from the fact that the expected amount of morally relevant experience is the product of a probability that nobody can pin down and a headcount so vast that the result is governed almost entirely by the uncertainty in the probability rather than by the count itself — so that two people who agree on all the entomology can disagree wildly about what they owe an ant. Please also bring in the opposing thought that sentience might be a threshold property rather than something that comes in degrees, so that the numbers are not simply to be added up at all, and let the punchline play these two views against each other. The joke should make sense to someone who knows the debate, and it should not depend on naming any particular philosopher, paper or book.

  End your response with a final line beginning "Punchline:" that states, in a single sentence, the line that carries the joke.
