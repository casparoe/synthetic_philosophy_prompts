  Hmm, his constraints are very specific and revealing. The no-quotes/no-authors rule suggests he wants authenticity over academic posturing. The farming/geography prohibitions hint at his lived experience in a mill town - he's seen how economic forces get framed as inevitable. His "third thing" request about the mill closure feels deeply personal; he's rejecting both capitalist progress narratives and victimhood tropes.

  The archaeology examples he provided are fascinating. Those egalitarian ancient cities and seasonal organizational shifts perfectly undermine deterministic history. I should foreground those without turning it into a lecture. His three tests - can people leave/refuse/change rules? - are brilliant framing devices. They make freedom concrete rather than abstract.

  For structure: opening should establish his local credibility without self-deprecation. The mill story needs to land as neither tragedy nor triumph - maybe frame it as proof that community persists when systems fail. The charge at the end is tricky; must avoid empty inspiration but can't be bleak. Perhaps emphasize choosing responsibility over destiny?

  Voice is crucial. Sentences should be sturdy like his bus route - no flourishes he wouldn't say naturally. That "sermon" analogy suggests he wants moral weight without preachiness. The historians in attendance worry him; I'll keep claims precise. For the parents of first graduates, the tone must honor their pride while rejecting clichés about "moving up in the world."

  The greatest risk is sounding like an anti-intellectual. Must show his reading was serious while criticizing reductionism. Those seasonal communities example does heavy lifting here - proves alternatives exist without romanticizing them. 

  Final thought: his "strange over familiar" preference is liberating. This won't be a typical "follow your dreams" speech. The bus metaphor might work - he knows every side street but never assumes there's only one route.
answer: |-
  ## The Roads We Choose

  Good morning. For those who don’t know me – and probably most of you don’t – I’ve spent my whole life right here in this town. Nineteen years of it inside the paper mill when it was running. The last eleven, driving a school bus down the same streets I walked as a kid. When the committee asked me to speak today, I think they wanted a familiar face, someone who knows these streets, this place. I said yes before I really thought about what I’d say. Standing here now, I want to talk to you about roads. Not just these streets outside, but the paths human beings have walked for a very long time.

  Like many people, I’ve spent years reading those big books that try to explain everything about us. How we got from scattered bands to… well, to this moment right here. They often tell a smooth story: small groups become villages, villages become cities, cities get kings and empires, and here we are, the complex end point. It’s a story that runs uphill, from simple to sophisticated, and it always seems to end, conveniently, right where *we* happen to be standing. It makes it feel like history was always heading this way.

  I don’t buy that. Not the whole story, anyway. It feels too neat, too much like a path laid down without anyone ever choosing to step off it. So, while I’ve read these books, I started testing them against three simple questions: **Can people leave? Can people refuse? Can people change the rules they live under?**

  Because if the answer to those questions is always "no," then history really is just a river flowing downhill, predictable and inevitable. But I don’t think it is.

  Let me give you two glimpses that convinced me.

  First, dig down into the dust of very old cities, settlements holding tens of thousands of people. You expect to find palaces, royal tombs, big central storehouses, signs of someone powerful calling the shots. But some of these places? They don't have them. Nothing. No grand houses, just neighborhoods. No signs of a ruler’s fist. Just people, living together, densely packed, apparently figuring it out differently. And we know of at least one large early city that started out with clear divisions – rulers and ruled, elites and commoners – and then, somehow, over time, that structure faded. It moved backwards, towards something flatter, something shared. They *changed the rules*.

  Second, think about seasons. Not just weather, but how people lived. Many communities weren't stuck in one rigid way of being. They lived communally during planting or harvest, sharing tools and labor. Then, later in the year, perhaps during a hunt or a migration, the same people organized themselves differently – following a leader, giving clearer commands, working in a tighter hierarchy. On purpose. They *refused* to be locked into one system all year round. They knew how to *leave* one way of doing things for another.

  That’s the thing. The grand arc of history isn’t a single path we were fated to walk. It’s a record of countless choices, experiments, refusals, and changes. People looked at the rules they lived under and said, "No, not this way. Let’s try something else." Sometimes it worked, sometimes it failed spectacularly, sometimes it was forced upon them. But the possibility was always there. The human story isn't just a climb towards complexity; it's a constant, messy negotiation about how we want to live together, and whether we have the courage to reshape it.

  I know something about rules changing. Nineteen years ago, the paper mill shut down. That mill wasn’t just a building; it was the rhythm of this town for generations. Its closing wasn't some grand step forward in the inevitable march of progress. It wasn’t a tragedy that meant the end of everything good. What it was, was a rupture. A rule changed. The old way of working, the old certainty, vanished overnight.

  What happened next? We didn’t disappear. We didn’t magically become a tech hub or a forgotten ruin. We grieved, we struggled, we argued. New things started – smaller things, different things. People retrained, commuted further, started businesses in their garages. Some left, some stayed. The school bus routes I drive? They got longer, picking up kids whose parents now work towns over. The streets are the same, but the lives lived on them shifted. It wasn't progress or tragedy. It was adaptation. It was people figuring out what to do when the ground shifts beneath you. We *refused* to just vanish. We *changed* the rules of how we earned a living, even when the choices were hard. We couldn't *leave* the town we loved, so we found new ways to stay.

  So, graduates, standing here on your own moment of change, that’s what I offer you. Not a grand arc guaranteeing your success. Not a promise that history is on your side, or that the future belongs to you simply because you’re next. That’s just another version of the inevitable story.

  Instead, I offer you the test. The one I use on all the big stories, and the one you can use on the world you’re stepping into:

  *   **Can you leave?** Are you truly free to walk away from a path that feels wrong, a place that stifles you, a system you can’t abide? Recognizing that freedom – and the courage it takes to use it – is vital.
  *   **Can you refuse?** Do you have the power, individually or together, to say "no" to demands that are unjust, to expectations that diminish you or others? Refusal is the first step towards change.
  *   **Can you change the rules?** Are the structures around you – at work, in your community, in the wider world – truly set in stone? Or can they be reshaped by collective will, by new ideas, by persistent effort?

  Your world will hand you stories about how things have to be. About progress and decline, about destiny and dead ends. Test those stories. Look for the places where people left, refused, changed the rules. They are everywhere in our past, if you look beyond the smooth arc.

  Your charge today isn’t to fulfill a pre-written destiny or become the next chapter in an inevitable story. Your charge is to **choose**.

  Choose with your eyes open to the choices others made before you. Choose knowing that the rules can bend. Choose with the courage to refuse what is wrong, to walk away from what is hollow, and to build, with others, what is better.

  The road ahead isn’t a single, paved highway leading upwards. It’s a vast network of paths – some well-trodden, some overgrown, some yet to be made. You get to choose which one you walk, and how you walk it. Make your choices count. Make them human.

  Thank you, and congratulations.
