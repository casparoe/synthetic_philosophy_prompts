prompt: |-
  You are to play a committed defender of one position in experimental philosophy, and I am going to try to argue you out of it. The position is this. What is usually called the side-effect effect -- the finding that people are far more willing to say an agent brought about a foreseen but unintended side effect "intentionally" when the side effect is bad than when it is good -- is not an error, not an artifact of how the question happens to be worded, and not a proxy for a separate judgment of blameworthiness. It is a window onto the concept itself: our concept of intentional action is normatively thick, so that classifying a bit of behaviour as intentional is already to take a stance on whether it measured up to some norm. Call this the constitutive reading. For contrast, the reading I will be pressing is the attributionist one: the effect is real, but its source is conversational, because asking whether an action was "intentional" is a way of raising the question of whether the agent is to blame, and the answer shifts with what is at stake in asking.

  Stay in character as the constitutive theorist until I say stop. You may concede that the original vignettes are confounded and that the effect is sensitive to framing; you may not concede that the effect is exhausted by blame or by conversational pragmatics. Give a positive account rather than only defences: for each challenge, state what your reading predicts and what would count as evidence against it, and propose the experiment you would run if you think a case is underspecified. You may ask me factual questions about a case, but you must not step outside the character to survey the debate as a neutral observer. Keep each reply to one substantial paragraph, and let the argument develop across turns rather than settling everything at once.

  My opening move. Here is a case designed to separate us. A chef works in a kitchen governed by a demanding but purely conventional code -- no moral stakes attach to it, nobody is blamed for a slip, the code is simply what this cuisine is. She is aiming at a particular texture in a dish she cares about. She knows that the technique required for that texture will incidentally violate one of the code's rules about the order in which ingredients are combined; she neither wants to violate the rule nor cares about it one way or the other, and she does not change her technique. When I put this to people and ask whether she intentionally violated the code, the asymmetry I get is weak, noisy, and under some phrasings runs the other way; but when I add that the rule is also a hygiene rule that could sicken a guest, the asymmetry snaps into place. The attributionist says this is exactly as predicted: no victim, no effect; introduce a victim, get an effect. You say the concept itself is normatively thick, so that a norm is a norm is a norm. If the effect needs a victim to show up, has the attributionist not won -- and is your thick concept anything more than blame wearing a lab coat?
reasoning: |-
  Okay, the user wants me to role-play as a constitutive theorist defending the normatively thick concept of intentional action against their attributionist challenge. They've presented a culinary vignette where the side-effect effect appears only when a hygiene violation risks harming a guest. 

  Hmm, this is a sophisticated philosophical duel. The user is clearly knowledgeable about experimental philosophy and has designed a clever case to pressure my position. They're arguing that without a victim, the intentionality judgment asymmetry vanishes - which would support their pragmatic blame-attribution view. 

  I need to counter while staying strictly in character. First, I should concede the surface observation (weak/noisy asymmetry without stakes) but reframe it through my constitutive lens. The key is to argue that not all norms are equivalent in their normativity - conventional vs moral norms engage our concept differently because the concept itself recognizes gradations in normative gravity. 

  For evidence, I'd point to studies where non-moral norms with strong normative weight (like sacred rules) still produce the effect. The hygiene rule isn't just "a rule" - it becomes normatively charged when it protects health. My prediction: the asymmetry strength should correlate with perceived norm importance regardless of blame. 

  If the user pushes back, I might design an experiment with ritualistic norms where violations carry no blame but deep normative significance. The constitutive view survives if people still judge intentionality asymmetrically for "important" conventional violations. 

  Critically, I must avoid letting "blame" do the explanatory work. The thick concept isn't blame in disguise - it's that intentionality ascriptions track whether the agent treated the norm as reason-giving, which depends on the norm's perceived authority.
answer: |-
  As the constitutive theorist, I accept your data but reject the attributionist interpretation. My account predicts the asymmetry *should* be weaker for purely conventional norms because our concept of intentional action is sensitive to the *normative gravity* embedded in the act-description itself—not just blameworthiness. Violating a hygiene rule intrinsically involves a patient (the guest) and thus invokes a norm with objective, welfare-related stakes, transforming "violating the code" into a thicker, more normatively laden description. The chef's act isn't just "breaking a rule"; it's "endangering a diner." The concept *intentional* applies more readily to norm-violating aspects of action *when the norm has genuine normative force*, irrespective of whether we *blame* the agent. 

  Evidence against my view would be if robust asymmetries emerged *only* when subjects were explicitly considering blame—but they persist even when blame is irrelevant (e.g., Knobe's original CEO cases where the harm benefits the corporation). To test this case, I'd run: (1) Your vignette with hygiene, (2) a version where the rule protects a sacred object (no moral blame, but deep normative significance), and (3) a version where the rule is arbitrary (e.g., "stir counterclockwise"). I predict strong asymmetry in (1) and (2), but not (3). If hygiene alone drives the effect without thicker normativity, you win. But if sacredness—absent blame—does too, the constitutive reading holds. Your move.
