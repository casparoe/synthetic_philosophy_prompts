prompt: |-
  My two collegues in the reading group have been fighting about the prisoner's dilemma for close to two years now and I've told them we're not leaving the room until they produce a joint statement. So: draft it.

  Here's the split. Camp 1: rational choice attaches to acts. In a one-shot PD with no repetition, no reputation, no communication and no way for my choice to reach yours, defecting is the rational act, full stop; when people cooperate in these setups it's non-standard preferences, or confusion, or a psychology calibrated for repeated life misfiring in a lab. Camp 2: the unit is the decision, not the act. If each of us asks 'what should we do?' rather than 'what should I do?', cooperating is what comes out, and the fact that you're running the same reasoning I am is itself a reason, not a sentimental add-on.

  Organise the statement around this, and if it's a dud say so instead of humouring me: I think 'one-shot' is doing three jobs and the two of them have been trading on the ambiguity. (i) no shadow of the future -- this encounter doesn't affect later payoffs; (ii) no causal channel -- nothing I do can causally affect what you do; (iii) no shared reasoning -- we aren't agents whose choices are correlated by having run the same deliberation. Camp 2 needs (iii) to be false. Camp 1 can grant it and deny it matters. My hunch is a lot of the fight is (ii) and (iii) getting run together, but test that rather than assuming it.

  Two cases I want both of them to take a position on, because I think they pull in opposite directions:

  The twins: one shot, anonymous, no communication, standard matrix, but each player knows the other was picked by the same process and is working the same problem with the same reasoning, and each knows the other knows this. Nothing either does can causally reach the other. What's the rational move, and why?

  The shared cause: same one-shot anonymous game, but both players were exposed to a hidden common influence beforehand -- the same primes, or assignment by a coin neither of them can see -- so their choices end up correlated without either causing the other. Cooperating here is a decent predictor that the other cooperates. Does that change whats rational? Either they agree on an answer or they say exactly why they can't.

  And the iterated side, because this can't be settled on the one-shot alone: in the repeated game, with observable actions and enough patience or a low enough stopping probability, cooperation is sustainable, and both of them know it. Does that mechanism -- my cooperating now makes your cooperating later more likely -- belong to Camp 1's toolkit, a plain causal link making cooperation instrumentally rational, or is it the same thing Camp 2 is pointing at when it talks about correlated reasoning? If they think it's the same mechanism, that's an agreed claim and I want it stated as one. Same for the evolutionary side: a well-mixed population where higher-scoring strategies spread tends toward all-defect, and cooperation hangs on only when something adds structure, assortment, repetition or partner choice. Both of them should say what that fact is evidence for.

  For every crux, give me something both of them accept as bearing on it -- an experiment they'd both run, an argument they'd both count, a formal result they'd both recognise -- with both predictions written down in advance. In particular: is there a design that separates 'team reasoning' from 'social preferences' from 'the psychology misfiring', and if there isn't, say so. And each of them should say what would count as evidence against their own side, plus what would actually move them.

  No citations, no reading list, no literature survey -- they don't agree on which ones count anyway. What I want is a document they'd both sign. Numbered agreed claims first. Then a disagreements table with these columns: Disagreement | Camp 1's own wording | Camp 2's own wording | Substantive, verbal, or empirical | What actually turns on it. Then the cruxes with their tests and predictions. If part of the dispute is verbal -- about the word 'rational', or about whether 'one-shot' should be read as (ii) or (iii) -- say which part and why, instead of papering over it.

  Then, for the dataset, a compact machine-readable index after the document: a JSON object with agreed_claims (array of one-sentence strings), disagreements (array of objects with topic, camp_1, camp_2, kind, stake), cruxes (array of objects with crux, camp_1_prediction, camp_2_prediction, shared_test), verbal_disputes (array of strings), open_questions (array of strings). No prose outside the JSON in that block.
reasoning: |-
  We are drafting a joint statement for two colleagues in a reading group who have been debating the Prisoner's Dilemma (PD) for two years. The goal is to produce a document they can both sign, structured as requested.

  Key elements from the user:
  - Camp 1: Rational choice attaches to acts. In a one-shot PD with no repetition, no reputation, no communication, and no causal influence between players, defecting is the rational act. Cooperation in such setups is due to non-standard preferences, confusion, or misfiring psychology.
  - Camp 2: The unit is the decision (collective). If each player asks "what should we do?" instead of "what should I do?", cooperation emerges. The fact that both players are running the same reasoning is a reason in itself.

  The user's hunch: The term "one-shot" is ambiguous and doing three jobs:
    (i) No shadow of the future (no effect on later payoffs).
    (ii) No causal channel (my action doesn't affect your action).
    (iii) No shared reasoning (choices are not correlated by shared deliberation).

  Camp 2 needs (iii) to be false (i.e., shared reasoning is possible). Camp 1 can grant that (iii) is false but deny that it matters.

  Two cases to address:
  1. The Twins: One-shot, anonymous, no communication, standard PD matrix. Each player knows the other is identical in reasoning and picked by the same process, and each knows the other knows. No causal link. What is the rational move?
  2. The Shared Cause: Same setup, but both players were exposed to a hidden common influence (e.g., primes, a coin flip) that correlates their choices without causation. Cooperating predicts the other cooperates. Does that change what's rational?

  Also, the iterated PD: In the repeated game with observable actions and sufficient patience, cooperation is sustainable. Question: Is this mechanism (my cooperation now makes your cooperation later more likely) part of Camp 1's toolkit (causal link) or is it the same as Camp 2's correlated reasoning?

  Evolutionary side: In a well-mixed population, defection dominates; cooperation requires structure, assortment, repetition, or partner choice. What does this fact evidence?

  For each crux, provide a shared test, an argument, or a formal result that both camps accept as bearing on it, with predictions from each camp.

  Structure of the document:
  - Numbered agreed claims first.
  - Then a disagreements table with columns: Disagreement | Camp 1's own wording | Camp 2's own wording | Substantive, verbal, or empirical | What actually turns on it.
  - Then the cruxes with tests and predictions.
  - Identify verbal disputes (e.g., about the word "rational" or the meaning of "one-shot").
  - Finally, a compact machine-readable JSON index.

  We'll proceed step by step.

  Step 1: Agreed Claims
  Both camps likely agree on:
  1. In the one-shot PD as defined by (i) no future, (ii) no causal channel, and (iii) no shared reasoning, defection is the dominant strategy and the rational choice for an individual maximizing their own payoff.
  2. In repeated PD games with observable actions, a sufficiently high probability of continuation, and rational players, cooperation can be sustained in equilibrium (e.g., via tit-for-tat or grim trigger).
  3. In evolutionary settings without structure, defection tends to dominate; cooperation can evolve with mechanisms that allow for assortment (like kin selection, spatial structure, or repeated interactions).
  4. Actual human behavior in one-shot PD experiments often shows cooperation, which can be explained by various factors including social preferences, confusion, or the misfiring of a psychology adapted for repeated interactions.
  5. The standard PD payoff matrix (T>R>P>S and 2R>T+S) is the reference for the dilemma.

  Step 2: Disagreements Table
  We structure the main disagreements as per the user's request.

  Disagreement 1: Rationality in the one-shot PD without shared reasoning.
  - Camp 1: In the absence of any causal or correlating channel, the only rational act is to defect, as it strictly dominates cooperating.
  - Camp 2: Even in a one-shot setting, if players adopt a collective perspective (team reasoning), cooperation is rational. The absence of shared reasoning (iii) is a setup that precludes this perspective, but if it is present, it changes the rational choice.

  Kind: Substantive and verbal (because they define rationality differently?).

  Stake: What is the proper unit of agency in rational choice? Does rationality require individual maximization or can it include collective reasoning?

  Disagreement 2: The Twins case.
  - Camp 1: Even with identical reasoning processes, since there is no causal link, each player must reason independently. Defection remains the rational choice because if the other cooperates, I get more by defecting, and if the other defects, I get more by defecting (compared to cooperating). The knowledge that the other is identical doesn't change the dominance.
  - Camp 2: In the Twins case, because both players are running the same reasoning, they can each conclude that they should cooperate. The mutual knowledge of identical reasoning allows for a correlated choice of cooperation, which leads to a better outcome.

  Kind: Substantive.

  Stake: Whether the structure of reasoning alone (without causation) can change the rational act.

  Disagreement 3: The Shared Cause case.
  - Camp 1: If there is a hidden common cause that correlates choices but without any causal link between the players, then from an individual perspective, defection is still dominant because the correlation does not provide a reason for an individual to change their action. The correlation might make cooperation more likely to yield a good outcome, but without a causal mechanism, the individual still sees defection as yielding a higher payoff regardless of what the other does.
  - Camp 2: The hidden common cause creates a situation where the players' choices are correlated, and thus, conditional on the common cause, cooperating can be rational because it increases the chance of mutual cooperation. The player can condition their action on the common cause (if known) to achieve coordination.

  Kind: Empirical? (But also substantive) We need to see if the presence of a common cause changes the rational calculus.

  Stake: Does correlation without causation provide a reason to cooperate?

  Disagreement 4: The mechanism in repeated games.
  - Camp 1: The repeated game mechanism is purely causal: my current action affects the future actions of others via observable history. Cooperation is instrumentally rational because it influences future behavior to my benefit.
  - Camp 2: The repeated game mechanism is an instance of correlated reasoning: by reasoning about the long-term interaction, players can establish a norm of cooperation. It is the same as the team reasoning in the one-shot case, but extended over time.

  Kind: Substantive and verbal (what is the nature of the mechanism?).

  Stake: Whether the same underlying principle explains cooperation in repeated and one-shot (with shared reasoning) settings.

  Disagreement 5: What the evolutionary evidence shows.
  - Camp 1: The evolutionary evidence (that cooperation requires structure) supports the idea that in the absence of mechanisms that make cooperation beneficial (like repetition or assortment), defection dominates. This is consistent with individual rationality: without these, defection is the best response.
  - Camp 2: The evolutionary evidence shows that cooperation can be rational when there is correlation (through assortment) of types, which is analogous to the shared reasoning in the one-shot case. Thus, it supports the idea that collective rationality can emerge.

  Kind: Substantive.

  Stake: Interpretation of evolutionary dynamics for rational choice theory.

  Step 3: Cruxes and Tests

  Crux 1: The Twins case.
  - Camp 1 prediction: Players will defect (if rational) because they cannot count on the other to do the same, given the dominance of defection.
  - Camp 2 prediction: Players will cooperate because they can reason that both will choose the same action and mutual cooperation is best.
  - Shared test: Run an experiment with the Twins setup (emphasizing that both players are identical and will reason the same way). Measure the rate of cooperation among subjects who understand the game and are incentivized. Both camps must agree that if the cooperation rate is high (say >75%) and the players report reasoning that they should cooperate because the other is like them, then it supports Camp 2. If the cooperation rate is low (say <25%) and players defect because they think the other might defect or because they want to maximize regardless, it supports Camp 1.

  Crux 2: The Shared Cause case.
  - Camp 1 prediction: Even with a known common cause (e.g., a coin flip that both observe), the rational player will defect because the coin flip doesn't change the dominance of defection. The correlation does not give a reason to cooperate because the other player's action is still independent of mine (conditional on the cause, but I can't control the cause).
  - Camp 2 prediction: With a known common cause, players can condition their action on the cause to achieve coordination. For example, if the coin flip is heads, both cooperate; tails, both defect. But note: in the PD, mutual defection is worse than mutual cooperation, so they might always try to cooperate? Or condition on the cause to choose the same action? Actually, without communication, it's tricky. Alternatively, if the common cause is a prime that makes them both more cooperative, then they might cooperate more.

  But the user said: "a hidden common influence" and "so their choices end up correlated without either causing the other". The common cause is hidden, so the players don't know it. The question is: does the existence of a hidden common cause that creates correlation change the rational choice?

  In that case, from the individual perspective, the player doesn't know the common cause and thus cannot condition on it. So:

  - Camp 1: The rational act is still to defect because the hidden common cause doesn't change the fact that, for the individual, defection dominates.
  - Camp 2: The hidden common cause creates a correlation, so if I cooperate, it becomes more likely that the other cooperates. Therefore, the expected payoff of cooperating might be higher than defecting if the correlation is strong enough. In other words, if the correlation is high, then P(other cooperates | I cooperate) is high, and P(other defects | I defect) is high. Then the expected payoff of cooperating is: R * P(other cooperates | I cooperate) + S * P(other defects | I cooperate). Similarly for defecting: T * P(other cooperates | I defect) + P * P(other defects | I defect). If the correlation is perfect, then P(other cooperates | I cooperate)=1 and P(other defects | I defect)=1, so:
    - Cooperate: R
    - Defect: P
    Since R>P, cooperating has a higher expected payoff.

