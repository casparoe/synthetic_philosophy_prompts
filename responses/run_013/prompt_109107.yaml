  Joint Statement on the Prisoner's Dilemma

  Agreed Claims:
  1. In a one-shot Prisoner's Dilemma defined by (i) no future interactions, (ii) no causal influence between players, and (iii) no shared reasoning (players reason independently), defection is the strictly dominant strategy and the rational choice for individual payoff maximization.
  2. In repeated Prisoner's Dilemma games with observable actions and a sufficiently high probability of continuation, cooperation can be sustained in equilibrium by rational players using strategies that condition future actions on past behavior.
  3. In evolutionary settings with random pairing (well-mixed population), defection is evolutionarily stable and tends to dominate; cooperation can evolve only when there is assortment, spatial structure, kin selection, or repeated interactions.
  4. Observed cooperation in one-shot PD experiments with human subjects can be explained by factors including social preferences (e.g., concern for others' payoffs), confusion about the game, or psychological mechanisms adapted for repeated interactions.
  5. The standard Prisoner's Dilemma payoff matrix (Temptation > Reward > Punishment > Sucker, and 2*Reward > Temptation + Sucker) is the canonical representation of the dilemma.

  Disagreements Table:

  | Disagreement | Camp 1's Own Wording | Camp 2's Own Wording | Kind | What Turns on It |
  |--------------|----------------------|----------------------|------|------------------|
  | Rationality in the Twins case | In the Twins setup, even with identical reasoning processes and mutual knowledge thereof, the absence of causal influence means each player must choose independently. Defection remains the rational choice because it strictly dominates cooperation. | In the Twins setup, the mutual knowledge of identical reasoning allows each player to reason collectively: "We are both like this, so we should both cooperate." Cooperation becomes the rational choice because it leads to the best joint outcome. | Substantive | Whether rationality can incorporate collective agency without causal links. |
  | Interpretation of the Shared Cause case | In the Shared Cause setup, the hidden common cause induces correlation, but the rational player still maximizes expected utility given the conditional probabilities. If the correlation is strong enough, cooperation may yield higher expected utility, making it rational. This is consistent with individual rationality. | The Shared Cause setup shows that correlation (even without causation) can make cooperation rational, which is analogous to how team reasoning works: the common cause acts as a correlating device, much like shared reasoning. | Substantive and Verbal | Whether the mechanism here is distinct from team reasoning or an instance of it. |
  | Mechanism in repeated games | In repeated games, cooperation is instrumentally rational because one's actions causally influence future actions of others. This is distinct from one-shot reasoning. | The repeated game cooperation relies on the same principle as team reasoning: players coordinate on mutual cooperation by reasoning about the collective outcome. The repetition provides a structure for the correlation of actions. | Substantive | Whether the same conceptual framework explains cooperation in both repeated and one-shot (with correlation) settings. |
  | What evolutionary evidence shows | Evolutionary dynamics show that cooperation requires mechanisms that make it individually advantageous (e.g., repeated interaction or assortment). This supports the view that cooperation is rational only when it serves individual fitness. | Evolutionary dynamics show that cooperation emerges when there is correlation of types, which is analogous to the shared reasoning in one-shot settings. This supports the view that collective rationality can be evolutionarily stable. | Substantive | Interpretation of evolution for rational choice theory. |

  Cruxes:

  Crux 1: The Twins Experiment
  - Crux: Can shared reasoning alone (without causation) make cooperation rational in a one-shot PD?
  - Shared test: Conduct an experiment with the following setup: Participants are told they are playing a one-shot PD with an anonymous partner. They are informed that both players were selected by the same process (e.g., from the same pool of logical reasoners) and that both are given identical instructions and time to reason. They are also told that their actions have no causal influence on each other. The game is anonymous and there is no communication. Measure the cooperation rate among participants who pass a comprehension test.
  - Camp 1 prediction: Cooperation rate will be low (≤25%), as rational players will defect due to the dominance of defection.
  - Camp 2 prediction: Cooperation rate will be high (≥75%), as rational players will recognize that mutual cooperation is achievable via shared reasoning.

  Crux 2: Distinguishing Team Reasoning from Social Preferences
  - Crux: Is cooperation in one-shot PD experiments due to team reasoning or social preferences?
  - Shared test: Run a series of one-shot PD games with variations: (a) Baseline PD, (b) PD with a pre-game communication phase where players can discuss but not make binding agreements, (c) PD with a team framing ("you and your partner are a team"), and (d) PD with a known high correlation device (like a public coin flip). In each, measure cooperation rates and ask participants about their reasoning. Additionally, include a social preference test (e.g., a dictator game) to control for individual social preferences.
  - Camp 1 prediction: Cooperation will occur primarily in the social preference test and in the team framing condition (if at all), but not in the baseline or correlation device condition without social preferences. The communication condition might increase cooperation due to non-binding promises, which may activate social norms.
  - Camp 2 prediction: Cooperation will be high in the team framing and in the correlation device condition, as well as in communication, because these enable team reasoning. The baseline will have lower cooperation. Social preferences will not fully account for the variation.

  Verbal Disputes:
  - The term "rational" is used differently: Camp 1 defines it as individual expected utility maximization. Camp 2 allows for collective reasoning as rational.
  - The term "one-shot" is ambiguous: Camp 1 requires conditions (i), (ii), and (iii). Camp 2 argues that if (iii) is false (shared reasoning is present), then it is not a one-shot in the sense that precludes cooperation.

  Open Questions:
  - What is the minimal form of correlation or shared reasoning required to make cooperation rational in a one-shot PD?
  - Can team reasoning be distinguished from social preferences in all experimental settings?
  - How does the evolutionary dynamic of cooperation inform the rationality debate?

