  - Shared test: Run an experiment with a hidden common cause that induces correlation (e.g., a prime that influences both players in the same way, but they are unaware of it). Measure the cooperation rate and compare it to a control without the prime. But note: the players don't know about the prime, so they might not change their behavior. Alternatively, we can inform the players that there is a hidden common cause that will make their choices correlated, and tell them the degree of correlation. Then ask what they would do.

