  ### Joint Statement on the Prisoner's Dilemma  

  **Agreed Claims:**  
  1. In a one-shot Prisoner's Dilemma (PD) with no future interactions, no causal channel between players, and no shared reasoning (i.e., players reason independently), defection is the strictly dominant strategy for individual payoff maximization.  
  2. In repeated PD games with observable actions and a sufficiently high continuation probability (or low termination risk), mutual cooperation is a sustainable equilibrium via causal strategies (e.g., Tit-for-Tat).  
  3. Human cooperation in one-shot PD experiments often stems from non-instrumental factors (e.g., social preferences, confusion, or psychology calibrated for repeated interactions).  
  4. In evolutionary PD models, cooperation thrives only with mechanisms enabling assortment (e.g., spatial structure, kin selection, or partner choice), not in well-mixed populations where defection dominates.  
  5. The PD payoff matrix (T > R > P > S and 2R > T + S) is fixed for all cases discussed.  

  **Disagreements Table:**  
  | Disagreement | Camp 1's Wording | Camp 2's Wording | Kind | What Turns on It |  
  |--------------|------------------|------------------|------|-----------------|  
  | Rationality in standard one-shot PD | Defecting is uniquely rational; cooperation arises from non-rational factors (e.g., preferences/confusion). | Cooperating is rational if players adopt a "we" perspective, where shared reasoning overrides individual dominance. | Substantive & Verbal | Whether "rationality" permits collective agency. |  
  | The Twins case (identical reasoning) | Defection remains rational: identical reasoning doesn’t break dominance, as neither player’s act causally affects the other. | Cooperation is rational: knowing we’re identical lets us jointly commit to mutual cooperation via the same deliberation. | Substantive | Validity of collective reasoning without causation. |  
  | The Shared Cause case (hidden correlation) | Defection is still rational: correlation doesn’t change dominance, as my choice doesn’t cause yours; I maximize *given* the correlation. | Cooperation can be rational: correlation enables players to align acts non-causally, similar to shared reasoning. | Empirical | Whether correlation alone justifies cooperation. |  
  | Mechanism in repeated PD | Cooperation is instrumentally rational via causal chains (my act affects your future acts); distinct from one-shot reasoning. | Cooperation reflects correlated reasoning extended over time; same principle as in one-shot with shared deliberation. | Substantive & Verbal | Unity of cooperation mechanisms across contexts. |  
  | Evolutionary evidence | Supports individualism: cooperation evolves only when causal mechanisms (e.g., repetition) make it self-interestedly optimal. | Supports collectivism: cooperation evolves via correlated agents (e.g., kin), analogous to shared reasoning in one-shot. | Substantive | Relevance of evolution for rational choice theory. |  

  **Cruxes and Tests:**  
  - **Crux 1: Twins Case**  
    - *Camp 1 prediction*: Cooperation rate ≤20% (near baseline one-shot PD).  
    - *Camp 2 prediction*: Cooperation rate ≥70%.  
    - *Shared test*: Run a one-shot PD where players know they are identical "rational twins" (same selection process, instructions, and reasoning time), with no communication. Measure cooperation among incentivized participants who pass a comprehension quiz. Both camps accept cooperation rates as decisive.  

  - **Crux 2: Shared Cause Case**  
    - *Camp 1 prediction*: Cooperation rate unchanged from baseline; defection remains dominant regardless of hidden primes/coins.  
    - *Camp 2 prediction*: Cooperation rate increases significantly (e.g., +40%) under hidden common causes.  
    - *Shared test*: Run one-shot PDs where players are exposed to identical subliminal primes (e.g., "team" vs. neutral words) or know choices are correlated by a hidden coin flip. Control for priming awareness. Both accept regression analysis on priming effects.  

  - **Crux 3: Team Reasoning vs. Social Preferences**  
    - *Camp 1 prediction*: Cooperation stems from social preferences (e.g., inequality aversion), not team reasoning; it vanishes when payoffs are masked or under cognitive load.  
    - *Camp 2 prediction*: Cooperation persists under payoff masking/cognitive load if "we" framing is present; social preferences don’t explain joint commitment.  
    - *Shared test*: Run three one-shot PD variants:  
      (a) Baseline PD.  
      (b) PD with "team" framing ("You two are a unit").  
      (c) PD with other-regarding payoffs (e.g., charity donation).  
      Measure cooperation and post-game reasoning. Both accept qualitative coding of player justifications (e.g., "we" vs. "I") as evidence.  

  **What Would Move Each Camp:**  
  - *Camp 1 concession point*: High Twins cooperation (>70%) with players citing "identical reasoning" as their sole reason.  
  - *Camp 2 concession point*: No Twins cooperation increase (<25%) and null Shared Cause effect, with players defecting despite priming/correlation.  

  **Verbal Disputes:**  
  - "Rational": Camp 1 ties it to individual act-level dominance; Camp 2 ties it to collective outcome optimization.  
  - "One-shot": Camp 1 requires (i) no future + (ii) no causal channel + (iii) no shared reasoning. Camp 2 rejects (iii) as artificial, arguing shared reasoning can exist in one-shot.  

  **Open Questions:**  
  1. Can shared reasoning be experimentally distinguished from social preferences without self-reports?  
  2. Does evolutionary dynamics favor Camp 1’s "causal mechanisms" or Camp 2’s "correlated agents"?  

