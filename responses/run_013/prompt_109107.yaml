  Then the expected payoffs can be computed. For simplicity, assume the prime is deterministic: if heads, both cooperate; if tails, both defect. Then:
  - If I cooperate, then the other cooperates only if the coin was heads. So P(other cooperates | I cooperate) = P(heads | I cooperate). But note: I cooperate only if the coin is heads? Actually, in this deterministic case, I cooperate only when the coin is heads. So if I choose to cooperate, then it must be heads, so the other cooperates. Similarly, if I defect, it must be tails, so the other defects. Therefore, the player's action perfectly reveals the state. So:
