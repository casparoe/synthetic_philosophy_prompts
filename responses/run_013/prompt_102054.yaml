  Hmm, the user runs an ethics desk at a humanitarian NGO and is struggling with field teams requesting exceptions to forbidden actions like paying bribes or sharing sensitive information. These requests are framed as necessary to prevent greater harm to beneficiaries. The user leans deontological but faces pushback from a board member with a consequentialist perspective. They need a practical decision procedure that non-philosophers can use quickly, with specific features: step-by-step questions, clear thresholds, handling unquantifiable harms, and transparency about limitations. They also want two test cases analyzed - one bribery scenario and one information-sharing scenario - with one outcome challenging their initial stance.

  The core tension here is between rule-based ethics (deontological) and outcome-based ethics (consequentialist). Humanitarian work often faces these dilemmas in high-stakes environments. The user's discomfort suggests they recognize the board member's point has merit but worry about slippery slopes. Their request for a "biting" example shows admirable intellectual honesty - they genuinely want a robust system, not just validation.

  Key requirements for the procedure:
  - Must be operationalizable by field staff with no philosophy background
  - Must function under time pressure ("an afternoon")
  - Must address unquantifiable harms
  - Must clearly distinguish factual assessments from value judgments
  - Must acknowledge its own limitations and potential biases
  - Needs to produce defensible outcomes in extreme scenarios

  The proposed decision tree balances both ethical approaches through layered gates. Starting with harm-to-beneficiaries focuses on core mission, while the "irreversible harm" threshold creates a bright line where consequences clearly outweigh rules. Including "organizational integrity" as a formal step prevents dismissing institutional costs as mere hand-washing. Crucially, the "values call" flag forces explicit board involvement when rules conflict with harm reduction - this avoids individual staff bearing sole responsibility for tragic choices.

  For the test cases:
  The bribery scenario passes because (1) medical convoy blockage is direct harm to beneficiaries, (2) bribery harms are systemic but not immediate, (3) no alternatives exist, and (4) the harm differential is clear - lives saved versus perpetuating corruption. This challenges the user's deontological instinct but aligns with humanitarian principles of prioritizing immediate life-saving.

  The information-sharing scenario fails at step 2 because handing over names likely creates immediate, irreversible harm to individuals (kidnapping/torture) rather than preventing it. The "harm shift" analysis shows this isn't harm reduction but transferring harm to more vulnerable parties. This upholds the user's intuition while demonstrating the procedure isn't just rubber-stamping exceptions.

  The meta-commentary about "laundering gut feelings" is important - by requiring documentation of all assessments and forcing board review for value conflicts, the system builds accountability. Field officers aren't asked to quantify the unquantifiable but must articulate why harms can't be compared. The "misfire" warnings (like underestimating systemic harm) prevent overconfidence in the tool.

  Ultimately this satisfies the user's need for both practical guidance and ethical rigor. It transforms abstract debates into auditable steps while reserving the hardest choices for collective governance - exactly what an ethics desk should facilitate.
answer: |-
  ## Humanitarian Exception Protocol

  **Bottom-line rule:** We may violate a standing prohibition *only* when refusing would demonstrably cause *immediate, severe, and irreversible harm* to beneficiaries that is *significantly greater* than the harm caused by the violation itself, *no alternatives exist*, *and* the violation does not fundamentally compromise our core identity or mission.

  ---

  ### Decision Procedure: The Humanitarian Exception Test (HET)

  **Goal:** Determine if a request to violate a standing rule meets the strict criteria for a justified exception. Conduct this assessment collaboratively with the field team lead.

  1.  **Define the Requested Violation (RV):**
      *   *Question:* "Exactly which specific prohibited action are you asking to do?" (e.g., "Pay a $50 bribe to Commander X at Checkpoint Y.")
      *   *Sufficient Answer:* Clear, specific description of the prohibited act, the actor, and the location/timing.
      *   *Stop if:* The action is fundamentally incompatible with core humanitarian principles (e.g., direct participation in violence, torture). **FIRM NO.**

  2.  **Define the Refusal Consequence (RC):**
      *   *Question:* "If we refuse the RV, what *specific, immediate, severe harm* will happen *directly to our beneficiaries* as a result? Be specific about who, what, when, and severity."
      *   *Sufficient Answer:* Concrete description of the harm (e.g., "42 children in Village Z will not receive life-saving malaria meds today, leading to an estimated 3-5 preventable deaths within 48 hours."). Avoid vague threats ("They'll be angry") or speculative chain reactions.
      *   *Stop if:*
          *   Harm is primarily to the organization (e.g., delayed project, reputational risk). **FIRM NO.**
          *   Harm is primarily to staff *without* direct, severe, immediate consequence to beneficiaries. **FIRM NO.**
          *   Harm is vague, unsubstantiated, or primarily future/speculative. **FIRM NO.**
          *   Harm involves *directly causing* severe, irreversible harm to specific individuals (e.g., handing someone over to be tortured). **FIRM NO.**

  3.  **Assess Harm Magnitude & Immediacy:**
      *   *Question:* "Is the RC *immediate* (hours/days), *severe* (death, permanent disability, catastrophic loss of essential needs), and *irreversible*? Is it *significantly worse* than the harm caused *by the RV itself*?"
      *   *Sufficient Answer:* Clear comparison. Quantify if possible (e.g., "RC: 5 deaths vs. RV: $50 bribe perpetuating corruption"). Acknowledge if quantification is impossible but articulate the qualitative difference in severity and immediacy (e.g., "RC: Starvation for 100 families today vs. RV: Undermining long-term governance efforts").
      *   *Handling Unquantifiable Harm:* If harms are genuinely incomparable *types* (e.g., immediate death vs. long-term corruption), articulate the *nature* of the harm prevented (RC) vs. caused (RV). Favor preventing immediate, irreversible suffering over causing diffuse, systemic harm, *only if* all other criteria are met.
      *   *Stop if:* RC harm is not clearly *more severe and immediate* than RV harm. **FIRM NO.**

  4.  **Exhaust Alternatives:**
      *   *Question:* "What *all* other options have been exhausted to avoid *both* the RV *and* the RC? Have we negotiated, escalated locally, contacted other actors, delayed, rerouted, offered alternatives, etc.?"
      *   *Sufficient Answer:* List of specific alternatives tried and why they failed. Documentation is helpful.
      *   *Stop if:* Any credible, lower-risk alternative remains unexplored. **FIRM NO.**

  5.  **Assess Impact on Core Identity/Integrity:**
      *   *Question:* "Does doing the RV fundamentally undermine our core principles (neutrality, impartiality, independence, do no harm) or our ability to operate ethically in the future? Will it put *other* beneficiaries or staff at significantly increased risk? Does it cross a bright line we cannot redraw?"
      *   *Sufficient Answer:* Honest assessment of reputational, operational, and moral integrity costs.
      *   *Stop if:* The RV fundamentally compromises core identity (e.g., directly enabling violence against civilians, betraying beneficiary trust catastrophically like handing over names to persecutors). **FIRM NO.** Otherwise, proceed.

  6.  **Decision Point:**
      *   **If Steps 1-5 are passed:** The RV *may* be ethically justifiable as an exception.
      *   **However:** This is now a **VALUES CALL**. The assessment *must* be escalated to the Ethics Desk and Board for final review and approval *before* action. The field team must provide the completed HET documentation.
      *   **If any step resulted in a FIRM NO:** Request is **DENIED.** Communicate clearly to the field team.

  **Where it misfires/launders gut feelings:**
  *   **Step 3 Harm Comparison:** Weighing incomparable harms (death vs. corruption) is inherently subjective. The "significantly worse" threshold depends on judgment.
  *   **Step 5 Core Identity:** Defining "fundamental compromise" is values-laden.
  *   **Systemic Harm Underestimation:** The procedure risks downplaying the long-term, cumulative harm of violations (like normalized bribery) against immediate needs.
  *   **"Gut Feeling" Influence:** Subjective judgment permeates Steps 3 and 5. The procedure forces articulation but can't eliminate bias. Escalation to the Board is the main check.

  ---

  ### Case Applications

  **Case 1: Paying a Bribe at a Checkpoint for a Medical Convoy**
  1.  **RV:** Pay $100 bribe to militia at Checkpoint Alpha.
  2.  **RC:** Convoy carrying vaccines and essential antibiotics blocked. 150 children in isolated camp face imminent measles outbreak (estimated 10-15% mortality without intervention) and untreatable bacterial infections starting within 24-48 hours. Clear, severe, immediate beneficiary harm.
  3.  **Harm Comparison:** *RC:* High probability of multiple preventable child deaths/disease within days. *RV:* Perpetuates corrupt system, minor financial loss. RC harm is significantly worse and more immediate. (Quantifiable difference: 10+ lives vs. $100 + systemic harm).
  4.  **Alternatives:** Negotiated 6 hours, offered medical supplies instead of cash, contacted Red Cross for leverage – all failed. No safe alternative route.
  5.  **Core Identity:** Paying bribes undermines principles and fuels corruption, but doesn't *directly* cause violence or betray core beneficiary protection in this specific instance. It's a severe compromise but arguably not *fundamental* if isolated and documented.
  6.  **Decision:** **PASSES HET (Steps 1-5).** However, it **REQUIRES BOARD REVIEW (VALUES CALL)** due to the significant integrity compromise. *This outcome challenges the deontological instinct but meets the strict "greater harm" exception criteria.*

  **Case 2: Handing Over Staff List to Threatening Militia**
  1.  **RV:** Provide list of 15 national staff names and home villages to Commander Y of Faction Z, who threatened "consequences."
  2.  **RC:** If refused, Commander Y threatens to shut down *all* NGO operations in his district indefinitely (affecting food distributions to 5,000).
  3.  **Harm Comparison:** *RC:* Severe, but diffuse beneficiary harm (hunger, malnutrition) starting in days/weeks. *RV:* Direct, severe, immediate, and irreversible harm *to specific individuals* (staff): high risk of kidnapping, torture, killing, or persecution of families. *The harm caused by the RV (targeted violence) is fundamentally different and potentially more severe/irreversible than the RC (blocked aid).* Refusing *shifts* harm from beneficiaries *onto staff*, which violates "do no harm" and impartiality.
  4.  **Alternatives:** Negotiate directly with Commander Y (failed), seek protection/guarantees from opposing faction or community leaders (failed/too risky), temporarily suspend operations while seeking higher-level mediation (viable alternative to *immediate* RV).
  5.  **Core Identity:** **FUNDAMENTAL COMPROMISE.** Directly endangering named individuals based on their association with us catastrophically betrays staff trust and the principle of "do no harm." It makes us complicit in persecution.
  6.  **Decision:** **STOP at STEP 2/3/5 - FIRM NO.** Handing over the list likely causes *more immediate, severe, irreversible harm* (to staff) than refusing (delayed/diffuse harm to beneficiaries). It fundamentally violates core identity. Alternatives exist (suspension/mediation). *Upholds the deontological stance.*

  This procedure forces explicit, structured reasoning, minimizes purely emotional responses, highlights where value judgments *must* be made collectively (at the Board level), and provides clear "no" gates while allowing for the rarest, most compelling exceptions under strict scrutiny.
