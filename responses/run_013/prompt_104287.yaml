  ### Grant Evaluation Procedure for Lexical Threshold Negative Utilitarianism

  #### **Core Principles Embedded in Procedure**
  1. **Lexical Priority of Severe Suffering**: Suffering above a defined intensity-duration threshold is lexically prior to all other considerations. No amount of enjoyment or sub-threshold suffering reduction can outweigh reducing *any* amount of above-threshold suffering.
  2. **Commensurability Below Threshold**: Suffering reduction and enjoyment gains are commensurable *only* below the threshold. Trade-offs use a common unit (Disability-Adjusted Life Years, DALYs).
  3. **Threshold Definition**:  
     - **Intensity**: Suffering ≥7/10 on validated pain/distress scales (e.g., Numerical Rating Scale) or equivalent clinical/behavioral proxies.  
     - **Duration**: ≥6 months (chronic) or acute episodes lasting ≥72 hours with severe intensity.  
     - **Scope**: Applies *per individual episode of suffering* (e.g., one person's migraine attack). Does **not** aggregate across individuals or sub-threshold episodes.  
     - **Ambiguity Resolution**:  
       - If suffering straddles threshold, classify as *above-threshold* if ≥30% of the affected time is above threshold.  
       - If commensurability below threshold cannot be quantified (e.g., no DALY data), use **suffering reduction as the sole priority** (enjoyment gains are ignored).

  #### **Evaluation Procedure**  
  *(Run by analysts; values choices marked with ⚠️)*

  1. **Category Screening (Values-Driven ⚠️)**  
     **Question**: *Does the proposal reduce suffering above the threshold?*  
     - **Sufficient Answer**:  
       - "Yes" if clinical/behavioral proxies indicate ≥1 beneficiary experiences suffering meeting intensity/duration criteria.  
       - "No" if all suffering is mild/moderate or only enjoyment is increased.  
     - **Output**: Proposals split into:  
       - **Category A**: Reduces above-threshold suffering (proceeds to Step 2).  
       - **Category B**: Only reduces sub-threshold suffering or increases enjoyment (proceeds to Step 3).  

  2. **Category A: Above-Threshold Suffering Reduction**  
     **Question**: *What is the cost per unit of above-threshold suffering averted?*  
     - **Metric**: **ATSA** (Above-Threshold Suffering Averted) = Number of individuals moved below threshold × duration of relief (years).  
       - *Example*: Surgery reducing pain from 8/10 to 5/10 (below threshold) for 10 patients over 5 years = 10 × 5 = 50 ATSA.  
     - **Cost-Effectiveness**: $/ATSA = Total cost / ATSA.  
     - **Data Requirements**: Clinical evidence for baseline/post-intervention suffering intensity.  
     - **Ambiguity Handling**:  
       - Sentience disputes (e.g., invertebrates): Apply **sentience probability** (e.g., 30% if evidence is weak). Multiply ATSA by probability.  
       - Uncertainty in suffering intensity: Use conservative estimate (favoring above-threshold).  

  3. **Category B: Sub-Threshold Suffering/Enjoyment**  
     **Question**: *What is the cost per DALY averted?*  
     - **Metric**: **DALY Reduction** (standard WHO/GHDx methods).  
       - Suffering reduction: (Baseline disability weight - Post-intervention weight) × duration.  
       - Enjoyment gains: (Post-intervention utility - Baseline utility) × duration.  
     - **Fallback if Commensurability Fails**: Ignore enjoyment gains. Use cost per unit of suffering reduction only (e.g., $ per point reduction on pain scale).  

  4. **Funding Allocation (Values-Driven ⚠️)**  
     - **Step 1**: Rank all Category A proposals by **$/ATSA (lowest first)**.  
     - **Step 2**: Fund top Category A proposals until **40% of total budget** is spent.  
     - **Step 3**: Allocate remaining 60% to Category B.  
       - Rank by **$/DALY (lowest first)** or **suffering reduction cost-effectiveness** if fallback applies.  
       - Fund until budget exhausted.  

  #### **What the Procedure Cannot Do**  
  - **Measure subjective experience**: Relies on proxies (clinical scales, behavioral data).  
  - **Resolve deep philosophical disputes**: Assumes threshold/lexical priority are fixed.  
  - **Handle aggregation**: Ignores cumulative effects of sub-threshold suffering.  
  - **Prioritize equity**: Does not weight outcomes by vulnerability.  
  - **Assign value to life extension**: Only values suffering/enjoyment changes.  

  ---

  ### **Application to Example Proposals**  
  **Total Budget**: $10M (for illustration)  
  **Threshold**: Suffering ≥7/10 intensity + ≥6 months duration.  

  #### **Proposal 1: Mild Chronic Pain Reduction**  
  - **Description**: $500K to reduce mild pain (4/10 intensity) for 200K people via telehealth.  
  - **Category**: B (sub-threshold).  
  - **DALYs Averted**: Baseline disability weight = 0.15 → Post-intervention = 0.10.  
    - Reduction = (0.15 - 0.10) × 1 year × 200,000 people = 10,000 DALYs.  
  - **Cost/DALY**: $500K / 10,000 = **$50/DALY**.  
  - **Decision**: Funded in Category B round (highly cost-effective).  

  #### **Proposal 2: Rare Agonizing Condition Treatment**  
  - **Description**: $10M for surgery/palliative care for 100 patients with excruciating pain (9/10 intensity, lifelong).  
  - **Category**: A (above-threshold).  
  - **ATSA Calculation**: Surgery moves 100 patients from 9/10 to 4/10 (below threshold) for 20 years.  
    - ATSA = 100 patients × 20 years = **2,000 ATSA**.  
  - **Cost/ATSA**: $10M / 2,000 = **$5,000/ATSA**.  
  - **Decision**:  
    - **Not funded**. Cost/ATSA is high compared to other Category A options (e.g., $500/ATSA for a bednet program reducing severe malaria).  
    - **You will not like this**. Lexical priority forces rejection: spending $10M here could fund 10× more ATSA elsewhere.  

  #### **Proposal 3: Disputed-Sentience Invertebrate Welfare**  
  - **Description**: $100K to improve conditions for 1M farmed shrimp (sentience probability: 40%).  
  - **Category**: A if sentient, else B.  
  - **ATSA Calculation** (if sentient):  
    - Suffering intensity: 8/10 (above threshold), duration 1 year.  
    - ATSA = 1M shrimp × 1 year × 40% probability = **400,000 ATSA**.  
  - **Cost/ATSA**: $100K / 400,000 = **$0.25/ATSA**.  
  - **Decision**: **Funded first in Category A** (extremely cost-effective).  

  ---

  ### **Defensibility to the Board**  
  - **One-Page Justification Template**:  
    > "Proposals reducing severe suffering (≥7/10 pain, >6 months) were prioritized per board directives. We funded those with the lowest cost per suffering episode averted (e.g., $0.25/episode for shrimp). Proposals below the threshold were funded by cost per DALY (e.g., $50/DALY for chronic pain). The $10M surgery was rejected as it averted fewer severe episodes per dollar than alternatives."  
  - **Key Defense**: The procedure enforces lexical priority without subjective judgment. Cost-effectiveness resolves ties.  

  **Final Note**: This procedure will favor scalable, low-cost interventions for severe suffering (e.g., invertebrate welfare) over high-cost, small-scale ones (e.g., rare diseases). It is consistent with the board's vote but may conflict with human-centric intuitions.
