          We start funding from the top. Assume the total budget is $10 million.

          We fund Proposal 3: cost $100,000 -> leaves 40% of $10 million = $4 million minus $100,000 = $3.9 million for the rest of Category A.

          Then we fund Proposal 2? Only if we have enough money and it is within the 40% budget. But note: Proposal 2 costs $50 million, which is way above the remaining $3.9 million. So we do not fund Proposal 2.

          Therefore, Proposal 2 is not funded.

     Step 2: Then we take the remaining budget: total remaining for the cycle is $10 million - $100,000 = $9.9 million. But note: we allocated 40% for Category A ($4 million) and we only used $100,000. So we have $3.9 million left in the Category A portion? But we don't reallocate to Category B until the Category A round is done. We then move to Category B with 60% of the budget ($6 million) plus the unused $3.9 million from Category A? Or do we keep the allocations? Our rule: we set aside 40% for Category A, but we only used a small part. We then let the unused Category A portion go to Category B? We should, to avoid wasting money. We adjust: the total budget for Category B becomes 60% + unused Category A.

          Therefore, Category B budget = $6 million (original) + ($4 million - $0.1 million) = $9.9 million.

          Now, we consider Category B proposals. We have Proposal 1 (pure Category B) and possibly others. Proposal 1 costs $1 million and has $13.33 per QALY. We fund it.

          Then we have $9.9 million - $1 million = $8.9 million left for other Category B proposals.

  Conclusion:

     - Proposal 3 (invertebrates) is funded because it is extremely cost-effective for above-threshold suffering reduction.
     - Proposal 2 (surgery) is not funded because it is too expensive per ATSA and we run out of the Category A budget.
     - Proposal 1 (mild pain) is funded because it is very cost-effective in Category B.

  This is likely not what you (the director) would want: you probably want to fund the surgery for the agonizing condition. But the procedure, as designed, does not because it is not cost-effective in reducing above-threshold suffering.

  What can you do?
     - Revisit the definition of ATSA: maybe the reduction in suffering from 0.7 to 0.4 should be valued more? We only counted the above-threshold part (0.2 per year) and then the reduction to 0.4 eliminates that entire above-threshold burden. But we counted that as 2 per patient. However, the cost per ATSA is still high because the cost is very high and the number of patients is small.

     - Change the allocation: if we allocated more than 40% to Category A, then we might fund Proposal 2. But 40% was arbitrary.

     - Note: Proposal 2 also has Category B benefits (150 QALYs) but we didn't count them because we only evaluated it as Category A. If we had allowed mixed proposals to be considered in Category B if not funded in A, then we could have considered the below-threshold part. But we decided not to. We could change that rule.

     - Alternatively, we could design the procedure to consider the entire proposal in both categories? But that would require a common currency, which we don't have.

  Given the constraints, the procedure produces the above result.

  We now write the procedure as requested.

  Procedure:

  1. Threshold Screening:
     - For each proposal, determine if it reduces suffering above the threshold. Use operational definition: suffering is above threshold if it corresponds to a condition with a disability weight (e.g., from GBD) above 0.5 and is chronic (lasting >6 months) or acute but severe (e.g., terminal illness pain). Rely on published literature and proposal's evidence.
     - If yes, assign to Category A (even if it also has below-threshold effects). Else, assign to Category B.

  2. For Category A proposals:
     a) Estimate the number of individuals who experience above-threshold suffering that is reduced by the intervention.
     b) Estimate the duration of the suffering averted (in years).
     c) Estimate the baseline disability weight (DW_b) and the post-intervention disability weight (DW_a).
     d) Compute ATSA averted per individual:
          If DW_b > threshold and DW_a <= threshold: ATSA = (DW_b - threshold) * duration
          If DW_b > threshold and DW_a > threshold: ATSA = (DW_b - DW_a) * duration
          [Note: if DW_a > DW_b, then it's harmful and we reject.]
     e) Total ATSA averted = sum over all affected individuals.
     f) Compute cost.
     g) Compute cost per ATSA averted ($/ATSA).

  3. For Category B proposals:
     a) Estimate QALYs gained (using standard methods, e.g., change in disability weight multiplied by duration, discounted).
     b) Compute cost.
     c) Compute cost per QALY ($/QALY).

     If QALYs cannot be estimated:
          a) If the proposal reduces suffering below threshold, define a suffering metric (e.g., reduction in pain score) and compute the total suffering reduction (e.g., reduction in pain * duration * number of people).
          b) Compute cost per unit of suffering reduction.
          c) If the proposal only increases enjoyment, define an enjoyment metric and compute cost per unit.
          d) Then, in ranking, prioritize suffering-reducing proposals over enjoyment-increasing ones.

  4. Funding allocation:
     a) Sort Category A proposals by $/ATSA (lowest first).
     b) Fund in order until the cumulative cost reaches 40% of the total budget. (If a proposal cannot be fully funded within the remaining 40% budget, skip it and move to the next.)
     c) The remaining budget (including any unspent portion from the 40%) is added to the 60% originally for Category B to form the Category B budget.
     d) Sort Category B proposals:
          - If using QALYs: by $/QALY (lowest first).
          - If using fallback: first sort the suffering-reducing proposals by cost per unit (lowest first), then the enjoyment-increasing proposals by cost per unit.
     e) Fund in order until the Category B budget is exhausted.

  5. What the procedure cannot do:
     - It cannot handle cases where the threshold status is unknown (we assume below threshold).
     - It cannot compare ATSA and QALY; the 40%/60% split is arbitrary.
     - It cannot account for indirect or long-term effects beyond the modeling.
     - It may not capture all ethical considerations (e.g., equity).
     - It assumes that the reduction in suffering above threshold can be linearly aggregated (which might not reflect the board's view if they believe that eliminating an episode completely is more valuable than a partial reduction).

  6. Resolved ambiguities:
     - Aggregation: We do not aggregate sub-threshold sufferings to cross the threshold. The threshold is per episode in an individual.
     - Threshold applies to an individual's experience at a time, not to a population or a life as a whole.
     - Fallback for non-commensurability below threshold: we prioritize suffering reduction over enjoyment increase and use separate metrics.

  We ran the procedure on the three examples and found:
     - The invertebrate intervention (Proposal 3) is funded in Category A.
     - The surgery for the rare condition (Proposal 2) is not funded because it is too expensive per ATSA.
     - The mild chronic pain intervention (Proposal 1) is funded in Category B.

  This result may be counterintuitive, but it follows from the board's lexical priority and the cost-effectiveness.
