answer: |-
  Here is the examination question, model answer, and marking scheme tailored to your specifications:

  **Examination Question (90 Minutes, 20 Marks):**  
  The fictional state’s sentencing commission uses an actuarial instrument scoring defendants from 0 to 1 for probability of re-arrest within three years. Its enabling statute mandates three simultaneous requirements:  
  1. **Calibration by Group**: For Groups A and B, a score \( s \) implies a true re-arrest probability of \( s \).  
  2. **Equal Average Scores for Non-Re-Arrests**: The mean score of defendants *not* re-arrested must be identical for Groups A and B.  
  3. **Equal Average Scores for Re-Arrests**: The mean score of defendants *re-arrested* must be identical for Groups A and B.  

  State data show a three-year re-arrest rate of 40% for Group A and 20% for Group B.  
  *(a)* Prove mathematically that the three requirements cannot hold simultaneously under the given re-arrest rates, except in one specific circumstance. Identify that circumstance.  
  *(b)* If the commission must abandon one requirement, which should it prioritize discarding and why? Justify based on ethical, legal, or practical implications.  
  *(c)* The statute defines "outcome" as re-arrest (a proxy for re-offense, which is unobserved). How does this proxy measurement challenge the instrument’s validity, even if all statistical requirements were satisfied?  

  ---

  **Model Answer (≈600 words):**  

  **(a) Impossibility Proof and Limiting Case**  
  Let \( p_A = 0.4 \) and \( p_B = 0.2 \) denote re-arrest rates. For Group A, denote:  
  - \( \mu_A^+ \): Mean score for re-arrested individuals.  
  - \( \mu_A^- \): Mean score for non-re-arrested individuals.  
  Define \( \mu_B^+, \mu_B^- \) analogously for Group B.  

  Calibration (Requirement 1) implies:  
  (i) Overall mean score \( \mu_A \) equals \( p_A = 0.4 \), so:  
  \[ \mu_A = p_A \mu_A^+ + (1 - p_A) \mu_A^- = 0.4 \]  
  Similarly, \( \mu_B = p_B \mu_B^+ + (1 - p_B) \mu_B^- = 0.2 \).  

  Requirements 2 and 3 state:  
  (ii) \( \mu_A^- = \mu_B^- \) (equal non-re-arrest means)  
  (iii) \( \mu_A^+ = \mu_B^+ \) (equal re-arrest means)  

  Assume (ii) and (iii) hold. Let \( \mu^- = \mu_A^- = \mu_B^- \) and \( \mu^+ = \mu_A^+ = \mu_B^+ \). Substitute into (i):  
  For Group A: \( 0.4\mu^+ + 0.6\mu^- = 0.4 \)  
  For Group B: \( 0.2\mu^+ + 0.8\mu^- = 0.2 \)  

  This yields a system:  
  \[ 0.4\mu^+ + 0.6\mu^- = 0.4 \quad \text{(A)} \]  
  \[ 0.2\mu^+ + 0.8\mu^- = 0.2 \quad \text{(B)} \]  

  Solving: Multiply (B) by 2: \( 0.4\mu^+ + 1.6\mu^- = 0.4 \) \quad \text{(B')}  
  Subtract (A) from (B'):  
  \[ (0.4\mu^+ + 1.6\mu^-) - (0.4\mu^+ + 0.6\mu^-) = 0.4 - 0.4 \]  
  \[ \Rightarrow \mu^- = 0 \]  

  Substitute \( \mu^- = 0 \) into (A): \( 0.4\mu^+ + 0.6(0) = 0.4 \Rightarrow \mu^+ = 1 \).  

  Now check Group B: \( 0.2(1) + 0.8(0) = 0.2 \), which holds. However, \( \mu^- = 0 \) and \( \mu^+ = 1 \) imply *all* non-re-arrested individuals have score 0 and *all* re-arrested have score 1. This is only possible if the instrument is perfectly deterministic (0% false positives, 0% false negatives). But with \( p_A \neq p_B \), perfect prediction requires the instrument to ignore group membership, contradicting the assumption of different base rates unless \( p_A = p_B \).  

  **Limiting Case**: The requirements *can* hold *only* if \( p_A = p_B \). If base rates are equal, \( \mu^- \) and \( \mu^+ \) need not be 0 or 1 (e.g., identical score distributions satisfy all conditions).  

  **(b) Prioritizing Which Requirement to Abandon**  
  The commission should abandon Requirement 2 or 3 (equal group means for re-arrests/non-re-arrests), retaining calibration (Requirement 1).  

  **Why**:  
  - **Calibration** ensures scores are *meaningful probabilities* (e.g., 0.3 = 30% risk in each group). Without it, scores misrepresent risk, violating due process and fairness.  
  - **Equal mean scores for outcomes** (Requirements 2–3) attempt "balance" but are mathematically incoherent under unequal base rates. Enforcing them would force scores to be 0 or 1 (as above), destroying granularity and utility. Legally, calibration aligns with individualized risk assessment; equalizing means across groups may conflict with anti-discrimination law if it distorts risk accuracy.  

  **Practical Grounds**: An instrument with meaningful probabilities (calibration) is necessary for proportional sentencing. Sacrificing Requirements 2–3 accepts that risk distributions differ by group due to structural factors—but does not *cause* bias if calibration holds.  

  **(c) Proxy Outcome Problem**  
  Re-arrest is a proxy for re-offense. Even if all statistical requirements are satisfied:  
  - **Measurement Error**: Re-arrest captures only *detected* offenses. Over-policing of Group A could inflate re-arrest rates without higher true re-offense, embedding systemic bias into scores.  
  - **Validity Erosion**: The instrument predicts a flawed proxy. Calibration to re-arrest does not imply calibration to re-offense. Requirements 2–3 become meaningless if "non-re-arrest" includes undetected offenders.  
  - **Consequence**: The system may *appear* statistically fair while perpetuating disparities. For example, Group A’s higher re-arrest rate may reflect surveillance, not risk. The commission thus risks automating injustice by optimizing for a corrupted target.  

  ---

  **Marking Scheme (5 Points, 20 Marks Total):**  

  | **Point**                                                                 | **Marks** | **Common Error (Costs Point)**                                  |
  |---------------------------------------------------------------------------|-----------|-----------------------------------------------------------------|
  | **(a) Correctly derive contradiction** (algebra showing \(\mu^- = 0\), \(\mu^+ = 1\)) | 5         | Fails to solve system of equations; assumes base rates equal.   |
  | **(a) Identify limiting case** (\(p_A = p_B\))                            | 3         | Omits/incorrectly specifies condition (e.g., "perfect prediction"). |
  | **(b) Choose to abandon Requirement 2 or 3** *and* justify with coherent reasoning (e.g., calibration essential for validity) | 5         | Abandons calibration; justification lacks ethical/legal context. |
  | **(b) Explain risks of enforcing Requirements 2–3** (e.g., forces binary scores) | 3         | Only states choice without consequences.                       |
  | **(c) Articulate proxy problem** (re-arrest ≠ re-offense undermines all requirements) | 4         | Superficial treatment (e.g., "proxy is imperfect" without implications). |

  Total: 20 Marks  

  ---  
  **Design Notes**:  
  - The question compels students to *re-derive* the impossibility (avoiding rote citation) while highlighting the base-rate equality edge case.  
  - Part (b) forces trade-off reasoning, moving beyond math to governance.  
  - Part (c) targets a critical realism in quantification: satisfying technical criteria ≠ justice if the target is misspecified.
