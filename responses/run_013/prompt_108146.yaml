prompt: |-
  I'm putting together a handout for a hospital ethics committee that keeps getting stuck on advance directives, and I want a decision tree rather than a reading list. The thing I actually care about is what people think grounds the authority — not just "do you respect autonomy", but whether the earlier self's say-so is original (she has standing in her own right, even if her later self would repudiate the whole plan) or derivative (it's evidence about what the later self wants, or a tool for protecting her), and whether the authority attaches to a person, to a promise, to a bundle of interests, or to the institution's habits. So build the tree from the logical space — start with a split everybody has to take, then the next — and only afterwards locate the actual positions in the space.

  Let these cases do the sorting work: (a) a woman in early dementia signs a directive refusing antibiotics and artificial feeding; five years later she's cheerful, disoriented, and reaching for a spoon; (b) a man writes "no vent, no CPR", then two years later, still sharp, says he's changed his mind and wants everything; (c) someone lucid but depressed writes a refusal, and everyone agrees the depression was doing the driving; (d) a directive that isn't about the body at all — "don't spend a penny on my care, give it to my nephew" — where honouring it means the later person is uncomfortable but the earlier person's plan is respected; (e) a Ulysses-style directive that says outright "I know I'll beg you to ignore this, and I'm telling you now not to." Worth having a branch on whether it matters that a directive asks for less rather than more.

  Positions I want as leaves (name them, or say "unnamed" if nobody really holds it): the one where the earlier competent choice wins outright; the one where it's only a defeasible presumption against the later self's current welfare; the one where the later self wins because welfare is all that's left; the two-selves/replacement view; the view that what binds you isn't the self at all but the promise or relationship with whoever is caring for you; and the view that the authority is really the institution's — we honor directives becuase a system that does is better overall. Flag any pair of leaves the tree can't separate.

  Format: exactly five numbered items, one or two sentences each, no intro and no wrap-up — the root question, then the next two levels of splits (roll anything deeper into the leaves), then the leaves with the commitment each finds hardest to defend, then the combinations nobody occupies and whether that's because they're incoherent, unattractive, or just unexplored.
reasoning: |-
  Okay, the user is creating a handout for a hospital ethics committee focused on advance directives. They want a decision tree to help navigate different philosophical foundations of authority, not just autonomy. The key is to map the logical space of what grounds the authority of advance directives—whether it's the earlier self's standing, evidence for later wishes, promises, interests, or institutional habits.

  First, I need to identify the root question that all positions must address. The core issue is what grounds the authority: is it based on the person (earlier or later self), promises, interests, or institutions? That seems like the fundamental split.

  Next, the second level should branch based on how the authority relates to the person. The main split here is whether the directive binds because of the earlier self's standing or if it's derivative, serving the later self's welfare. Cases (a), (b), and (e) help here. For example, in (b), if the person changes their mind while competent, does the earlier directive still hold? That tests if the authority is original or derivative.

  The third level needs to handle cases where the derivative view applies. Splitting based on whether the directive is evidence of the later self's wishes (as in dementia) or a tool to protect them (like in Ulysses contracts). Cases (a) and (e) are key here. Also, considering if the directive asks for less care might matter for the welfare-based view.

  For the leaves, I need to list positions like the earlier self winning outright, defeasible presumption, later self winning, two-selves view, promise-based, and institutional view. Each should have a hard case. For example, the earlier self position struggles with case (b) where the person retracts while competent. The two-selves view might handle (a) but conflict with (d) where the directive is financial, not bodily.

  Unoccupied combinations: Pairing promise-based with derivative authority might be unexplored since promises usually bind regardless of welfare. Institutional view combined with derivative could be coherent but unattractive if it ignores current welfare. Also, the two-selves view with institutional authority might not be considered, but it's possible.

  I need to ensure the tree separates positions correctly. For example, the later self position and defeasible presumption might both handle case (c) with depression, but the tree should distinguish them through the derivative branch. Also, flag that the promise-based and institutional views aren't separated by the personhood splits, so they might end up on the same branch or need noting.
answer: |-
  1.  **Root Question: What grounds the authority of an advance directive?** (Personhood, Promise/Obligation, Patient Welfare, or Institutional Integrity)
  2.  **First Split (Personhood Focus): Does the directive's authority originate primarily from the *earlier person's standing* (Original), or is it primarily *derivative* of serving the *later person's welfare or interests*?** (Case (a) & (e) challenge Original; Case (b) challenges Derivative if authority vanishes; Case (c) informs Derivative).
  3.  **Second Splits:**
      *   **If Derivative:** Does the directive hold authority primarily as *evidence* of the later self's authentic wishes/values (even when incapacitated), or as a *protective tool* ensuring their later welfare? (Case (a)'s spoon-reaching tests evidence; Case (e) is designed for protection; Asking for less care often matters more under protection).
      *   **If Not Primarily Personhood (Promise/Obligation or Institution):** Does the binding force come from the *promise made* or relationship with caregivers/dependents, or from the *integrity/benefit of the healthcare system* itself? (Case (d) tests promise/institution vs. later comfort; Case (b) tests promise vs. current competence).
  4.  **Leaves & Hardest Cases:**
      *   **Earlier Self Wins (Original):** Hardest: Case (b) (competent retraction). *Authority: Person (E)*
      *   **Defeasible Presumption (Derivative: Evidence):** Hardest: Case (e) (Ulysses - evidence ignored). *Authority: Person (L via E)*
      *   **Later Self Wins (Derivative: Protection/Welfare):** Hardest: Case (a) (refusing spoon - welfare conflict). *Authority: Welfare*
      *   **Two-Selves/Replacement:** Hardest: Case (d) (non-bodily directive - does "earlier self" care?). *Authority: Person (E as distinct)*
      *   **Promise/Relationship-Based:** Hardest: Case (b) (broken promise by competent self). *Authority: Promise*
      *   **Institutional Integrity:** Hardest: Case (c) (depression - honoring harmful directive for system). *Authority: Institution*
  5.  **Unoccupied Combinations & Why:**
      *   **Promise-Based + Derivative (Welfare):** Unexplored (promises bind regardless of current welfare outcome).
      *   **Institutional + Derivative (Evidence):** Coherent but Unattractive (system values evidence over current welfare/competence).
      *   **Two-Selves + Institutional:** Unexplored (institution recognizing distinct selves is rare).
      *   *(The tree cannot separate Promise-Based and Institutional views using the Personhood splits; both reside under "Not Primarily Personhood")*.
