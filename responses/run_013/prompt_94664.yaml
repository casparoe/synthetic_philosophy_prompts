prompt: |-
  I'm a novelist and I sit on the editorial ethics group at the small independent press that runs my translation imprint — we license an AI tool that does first-pass translation and copyediting, and we're now fighting about how to supervise the thing. Half the group wants process-based supervision: make the vendor document its training data and pipeline, require human checkpoints at fixed stages, keep a provenance log. The other half says that's unenforceable theatre and we should supervise outcomes only — read the finished books, test them for plagiarism, distortion and systematic bias, and act only when something is actually wrong. Last month the tool quietly flattened the pronouns and the honorifcs in a Bengali novel we were bringing out; no plagiarism, no factual error, just a steady loss of register that our outcome review waved through because every sentence looked fine on its own. Our chair wants a short written opinion from me before Thursday: recommend which regime we adopt going forward, give the reasoning, and make the best honest case for the side I'm aginst. You're a philosopher of technology who works on AI governance and institutional design, so think carefully — start by brainstorming the options on the table, including hybrids, then draft the opinion as plain prose I can circulate at the meeting. No reading lists or citations please, and don't lean on any one company's framework; just the argument.
reasoning: |-
