  Expressive voting gets messy here. The user's phrase "excuse for not caring whether you win" suggests they think expressivists are copping out. But actually, this scenario validates them beautifully—every vote *was* a statement, and the lottery highlights how voting is symbolic action detached from control. Yet this feels cold comfort to voters who now see their expression had concrete impact. Maybe I should emphasize that expressivists would say the meaning doesn't change—only the observers' perception does.

  Lesser evil is where the moral luck bite is sharpest. Ex ante, voting for a disliked candidate to prevent worse is pragmatic. Ex post, knowing your vote literally installed the "evil" you deemed lesser? That induces nausea. The user's right—it's textbook moral luck (outcome dependence), but that doesn't absolve voters; it just makes the burden heavier. I should stress that lesser evil voters *are* responsible, just not uniquely so—all voters share that burden when luck intervenes.

  The user clearly dislikes hand-waving, so I'll conclude firmly: this case embarrasses no theory but uniquely pressures lesser evil voting by exposing its moral risk. It confirms expressive voting's resilience while underscoring duty's abstraction. And yes, moral luck is the right frame—but it magnifies responsibility rather than negating it.

  Noting their "no citations" rule, I'll keep arguments self-contained. They want rigor on agency/act/mattering—so each analysis will explicitly map voter (agent) → casting ballot (act) → meaning pre/post-lottery. Where a theory lacks tools (like duty on luck), I'll say so plainly. 

