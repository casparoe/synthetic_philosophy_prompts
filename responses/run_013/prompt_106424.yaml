  For the removal test, removing the equalizer destroys Sam's competence either way, since he can't filter effectively without it. But the reason differs: with memory toggle on, removal shows reliance on external processing; with toggle off, it shows loss of complementary function.

  I'll argue that complementarity is the more fundamental criterion to keep, since parity alone might overextend cognition. I'll anticipate an attack that Sam's expertise makes the module merely instrumental, and counter that expertise doesn't negate the functional parity of the filtering process.

  This meets all specifications: realistic (using existing audio tech), novel (not memory replacement), with clear toggle and divergent verdicts that illuminate the tension between the two criteria.
answer: |-
  ## The Glitch Filter: A Thought Experiment on Cognitive Criteria

  **Scenario:** Sam is an experienced audio editor transcribing a poorly recorded interview. The recording has a persistent, high-pitched electrical hum (a 60Hz ground loop) obscuring the speech. Sam uses a dedicated, standalone hardware equalizer module – a common piece of prosumer audio gear – plugged between his playback device and headphones. This module has physical sliders for specific frequency bands. Sam knows *exactly* which frequency band corresponds to this type of hum (60Hz) based on years of experience. He slides the 60Hz band down significantly, effectively filtering out the hum. Crucially, the module has a small digital memory that stores his preferred "noise profile" settings (specifically the deep cut at 60Hz) for this recurring problem. He can recall this profile with a single button press on the module before each transcription session involving such recordings. He *could* mentally focus intensely to "tune out" the hum internally, relying solely on his trained auditory attention and pattern recognition to pick out the speech, but this is mentally exhausting and significantly slows him down, increasing error rates. The hardware filter makes the task faster, less effortful, and more accurate.

  **The Toggle Feature:** The presence or absence of the **stored noise profile (memory)** in the hardware equalizer module.

  **Case Version 1: Profile Memory ON**
  *   The module stores Sam's specific 60Hz cut setting. He recalls this profile with a button press before starting.
  *   **Parity Criterion Verdict: SATISFIED.**
      *   *Reasoning:* If Sam's brain internally generated an inhibitory signal specifically targeting the 60Hz frequency component of the auditory input stream, suppressing it *before* the conscious perception of the speech sounds, we would unhesitatingly count this internal process as cognitive (specifically, a form of attentional filtering or sensory gating). The hardware module performs *exactly this function*: it takes the auditory input, processes it (attenuating 60Hz), and outputs a filtered signal to Sam's ears. The stored profile simply sets the module to perform this specific cognitive operation automatically. It does the cognitive work (filtering noise to aid comprehension) that an internal mechanism *could* do.
  *   **Complementarity Criterion Verdict: FAILED.**
      *   *Reasoning:* The module is not complementing Sam's internal machinery; it is *replicating* a function he possesses internally. Sam *has* the trained ability to auditorily recognize the 60Hz hum and mentally focus to suppress its perceptual impact ("tuning it out"). The hardware module does this same filtering task, just faster and with less effort. It replaces his internal noise-suppression process rather than adding a new capability or processing step that his brain doesn't already perform in a different (slower, more effortful) way. Its function overlaps with his internal competence.
  *   **Removal Test Verdict: NOT PART OF SYSTEM (Scaffold).**
      *   *Reasoning:* If you remove the module (with its stored profile), Sam *can* still perform the core cognitive task – transcribing the speech accurately. He achieves this by engaging his internal auditory attention and pattern recognition skills to mentally filter the noise. It's slower, more effortful, and error-prone, but the *competence to achieve the goal* survives removal. The module therefore scaffolds/enables a more efficient performance but is not constitutive; the core cognitive ability to overcome the noise exists internally. *Reason distinct from Complementarity:* This verdict hinges *only* on the survival of competence upon removal, regardless of *how* the module functioned (replicative or complementary). It speaks to the agent's underlying capability, not the functional relationship between internal and external processes.

  **Case Version 2: Profile Memory OFF (Toggle Flipped)**
  *   The module has no memory. Sam must manually slide the 60Hz band down *each time* he encounters the hum, based on his recognition of the sound.
  *   **Parity Criterion Verdict: FAILED.**
      *   *Reasoning:* The module is now a simple amplifier with adjustable frequency response. Manually adjusting a physical slider is not a process we would count as cognitive if it happened inside the head. What *is* cognitive is Sam's *recognition* of the hum and his *decision* to cut 60Hz. The module itself merely executes his command; it doesn't perform a recognizably cognitive *process* (like filtering) autonomously. Its action is purely mechanical amplification/attenuation triggered by Sam.
  *   **Complementarity Criterion Verdict: SATISFIED.**
      *   *Reasoning:* The module now complements Sam's internal processes. Sam does the cognitive work: recognizing the noise frequency. The module does work his internal machinery *cannot* do: physically attenuate that specific frequency component in the actual audio signal flowing to his ears. His brain can't directly manipulate the external sound wave; it can only modulate its internal perceptual processing. The module provides a unique physical filtering function that Sam's internal resources lack, working *alongside* his recognition skill to achieve the goal more effectively than either could alone. It adds a new capability (physical signal manipulation) to the system.
  *   **Removal Test Verdict: NOT PART OF SYSTEM (Scaffold).**
      *   *Reasoning:* Identical to Version 1. Removing the module still leaves Sam capable of transcribing using his internal mental filtering skills, albeit less efficiently. The survival of competence dictates the scaffold verdict. **The removal test verdict survives the toggle.** The reason (survival of competence) remains the same regardless of the memory feature. If the internalist wants to argue the module *is* constitutive in Version 2 despite competence surviving removal, they must fall back on arguments about the *nature* of the coupling or the *type* of function performed (like the complementarity argument). However, the standard removal test itself yields the same "scaffold" verdict in both versions based solely on competence survival.

  **Analysis & What the Case Shows:**
  The toggle feature – the **stored noise profile memory** – is crucial. When ON, it allows the module to *autonomously execute* the filtering process Sam *could* perform internally (satisfying Parity but failing Complementarity). When OFF, the module loses its autonomous execution of a cognitive-like process (failing Parity) but gains a unique, non-replicable physical function (satisfying Complementarity). This shows that Parity and Complementarity are distinct criteria that can be pulled apart by the presence of external *automation* of a replicable internal function. Removing the memory feature transforms the module from a replicator (Parity Yes, Complementarity No) to a complementary tool (Parity No, Complementarity Yes).

  **Which Criterion to Keep?**
  If forced to choose only one criterion, I would keep **Complementarity**. Parity is vulnerable to over-extension ("cognitive bloat") by counting *any* external process resembling an internal cognitive one, even simple replicators like this memorized filter. Complementarity focuses on the *system-level* integration and unique contribution, which seems more fundamental to the idea of *extending* the mind beyond its biological limits by adding new capacities. It better captures the transformative potential of external resources. Parity alone risks reducing extended cognition to mere externalized cognition.

  **Strongest Attack & Reply:**
  *   **Attack (Defending Parity/Internalism):** "The glitch filter, even with memory, is merely an *instrument* Sam *uses*. Its function is entirely determined by his prior cognitive act (identifying the frequency and setting the profile). The stored profile is just a causal consequence of his expertise, like a saved setting on any tool. The *real* cognitive work – recognizing the noise and knowing how to fix it – remains entirely internal. The Parity criterion misapplies by focusing on the external *execution* rather than the internal *control* and *understanding*. The removal test confirms this; competence survives because the core cognition is internal."
  *   **Reply:** This attack conflates the *origin* of the setting with its *current functional role*. Once set and stored, the module autonomously performs the filtering *process* on the fly, just as an internal inhibitory mechanism would. Its function is causally coupled in real-time to the perceptual stream, directly shaping the input to Sam's consciousness. To deny this is cognitive is to beg the question – if an identical, real-time filtering process *inside* the head is cognitive, then the external process meeting Parity should be too. The attack also downplays the functional equivalence: Sam relies on the external process *instead of* the internal one for efficiency, making it a genuine part of his active cognitive strategy. While the expertise is internal, the *execution* of the specific cognitive operation (filtering) is delegated and extended. The removal test shows resilience, not that the external process wasn't genuinely cognitive *when used*; internal mechanisms can often compensate if external ones fail, but that doesn't mean the external ones weren't part of the system when they were functioning.
