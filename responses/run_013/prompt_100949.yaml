answer: |-
  ## INTERNAL CIRCULAR  
  **Joint Committee on Civic Cohesion (JCCC)**  
  **Civic Centre, [City Name]**  
  **Ref: JCCC/PROC/24-08/MFT Dispute Resolution**  
  **Date: 17th May 2024**

  **TO:** All Department Heads, Community Liaison Officers, Planning Enforcement, and Registered Resident Associations  
  **CC:** Clerk to the Council, Legal Services  
  **FROM:** Secretariat, Joint Committee on Civic Cohesion  
  **SUBJECT:** Standardised Procedure for Resolving Community-Level Moral Disputes Using Moral Foundations Analysis

  1.  **Purpose:** This circular outlines the revised procedure for the impartial resolution of persistent community disputes involving conflicting moral claims. Recognising the limitations of traditional consultation in such cases, the Joint Committee has adopted the empirically robust Moral Foundations Theory (MFT) as a framework for objective assessment. This ensures outcomes are grounded in quantifiable moral endorsement rather than subjective argumentation, promoting civic cohesion.

  2.  **Scope:** This procedure applies to disputes referred to the JCCC where:
      *   Opposing resident groups (minimum 2 parties) hold entrenched moral positions.
      *   Traditional mediation/consultation has failed.
      *   The subject matter involves community assets, planning, local bylaws, or shared public space.
      *   Examples include, but are not limited to:
          *   Retention/removal of public statuary.
          *   Objections to planning applications on moral grounds (e.g., impact on character, perceived inequity).
          *   Disputes over school policies (e.g., uniform requirements, curriculum content).
          *   Complaints regarding the operation of community facilities or places of worship (e.g., noise, perceived offensiveness).

  3.  **Referral Process:**
      1.  Disputes must be formally referred to the JCCC Secretariat using **Form JC/CC7 (Moral Dispute Referral)**.
      2.  Referrals must originate from a Council Officer, Ward Councillor, or recognised Resident Association Chair, accompanied by evidence of prior failed resolution attempts.
      3.  The Secretariat will assess eligibility and notify parties of the MFT audit process.

  4.  **Submission and Data Collection:**
      1.  Each formally recognised party to the dispute (e.g., 'Retain the Statue Campaign', 'Planning Objectors Group - Elm Street', 'School Uniform Reform Parents') must appoint a single spokesperson.
      2.  The spokesperson will complete the **Standardised Moral Foundations Questionnaire (SMFQ-JCCC v.3)** online via the secure Civic Portal.
          *   The SMFQ-JCCC v.3 consists of 30 validated self-report items measuring endorsement strength across the five universal moral foundations: **Care/Harm**, **Fairness/Cheating**, **Loyalty/Betrayal**, **Authority/Subversion**, and **Sanctity/Degradation**.
          *   Items are rated on a 6-point Likert scale (Strongly Disagree to Strongly Agree).
      3.  The spokesperson will also submit a **Position Statement (max. 500 words)** outlining their group's core moral arguments regarding the dispute. This must explicitly link their stance to one or more moral foundations.
      4.  Submissions must be completed within 14 calendar days of notification.

  5.  **Coding and Analysis:**
      1.  The Secretariat will anonymise submissions and forward them to the Council's contracted Behavioural Insights Unit (BIU).
      2.  BIU analysts will:
          *   Calculate the mean endorsement score for *each* of the five foundations from the SMFQ-JCCC v.3 for each party.
          *   Perform a qualitative content analysis on the Position Statement, coding explicit invocations of each foundation using a standardised lexicon. Each invocation receives a point (+1) for that foundation.
          *   Generate a **Composite Moral Endorsement Score (CMES)** for each party by summing:
              *   The normalised quantitative SMFQ score for each foundation (weighted 70%).
              *   The total qualitative invocation points for each foundation (weighted 30%).
          *   Produce a **Foundations Disparity Report** highlighting the foundations showing the highest and lowest relative endorsement for each party, and the foundations most frequently invoked in the dispute context.

  6.  **Determination of Outcome:**
      1.  The JCCC Disputes Panel (Chair, Vice-Chair, and one rotating member) will review the Foundations Disparity Report.
      2.  **Primary Determinant:** The party demonstrating the higher aggregate CMES is deemed to hold the position grounded in a broader and more strongly endorsed set of community moral values. Their preferred outcome will be recommended.
      3.  **Tiebreaker Mechanism:** In cases of negligible CMES difference (<5 points), the outcome favouring the party demonstrating higher endorsement of the foundation(s) most relevant to the *specific dispute context* (as determined by the BIU analysis and Panel assessment) shall be recommended. E.g., high Loyalty/Sanctity scores may weigh more heavily in a statue dispute; high Care/Fairness in a school uniform dispute concerning inclusivity.
      4.  The Panel will issue a **Moral Foundations Determination Notice (MFDN)** stating the recommended outcome and the foundational basis for the decision. This notice will be shared with all parties and the referring officer/councillor.

  7.  **Implementation:**
      1.  The MFDN forms the basis for the Council's formal decision on the matter. Relevant departments (Planning, Education, Public Realm etc.) will implement the outcome as directed in the MFDN.
      2.  The MFDN will include standard wording emphasising that the decision reflects the objectively measured moral framework of the community, fostering acceptance.

  8.  **Data Handling:** All SMFQ responses and Position Statements will be stored securely by the BIU for 5 years in line with GDPR for audit purposes, then anonymised and archived for potential future research into civic moral trends.

  **This procedure supersedes all previous ad-hoc arrangements for resolving morally charged disputes. Compliance is mandatory for eligible cases. Queries should be directed to the JCCC Secretariat (Ext. 4412).**

  ---

  **Editor's Note: Separating Fact from Satirical Liberty**

  Moral Foundations Theory (MFT), developed primarily by Jonathan Haidt and colleagues, posits five (later six, adding Liberty/Oppression) innate psychological foundations shaping moral judgement: Care/Harm, Fairness/Cheating, Loyalty/Betrayal, Authority/Subversion, Sanctity/Degradation. Empirical work consistently shows self-reported endorsement of these foundations *does* cluster predictably across political ideologies, with liberals typically prioritising Care and Fairness, and conservatives endorsing all five more equally. Self-report questionnaires like the MFQ are validated instruments widely used to measure these endorsements.

  The satire takes liberties in several key areas:
  1.  **Prescriptive Leap:** MFT is rigorously *descriptive* and *explanatory*. It maps *why* people disagree, not *who is right*. Treating higher aggregate foundation scores as a warrant for policy ("broader/more strongly endorsed") is the core absurdity, violating the fact-value distinction central to the field.
  2.  **Measurement Limitations:** While the MFQ measures self-reported *endorsement*, it doesn't measure the *objective moral validity* of a position derived from that foundation. Coding qualitative statements adds a layer of subjective interpretation the satire presents as mechanical.
  3.  **Context & Weighting:** The theory doesn't prescribe which foundations *should* dominate specific policy contexts (e.g., Loyalty for statues). This weighting is entirely arbitrary within the satire.
  4.  **Sampling Bias:** The original MFT research relied heavily on WEIRD (Western, Educated, Industrialised, Rich, Democratic) samples. Using it prescriptively for a diverse local population ignores cultural variation in foundation expression and weight – a major critique within moral psychology that the circular blithely overlooks.
  5.  **"Community Moral Values":** Aggregating individual scores into a single "community" CMES is a statistical and conceptual leap unsupported by the theory, which focuses on individual and group differences.

  The satire accurately uses the foundations, their typical clustering, and the tool (self-report questionnaire), but the entire *application* – using scores to adjudicate disputes rather than understand them – is the fictional and critical element.
