answer: |-
  ## Ethics Committee Opinion: Case #2024-07  
  **Recommended Disposition:** The committee issues a private reprimand to the member and requires him to send a corrective letter to the client explaining the surrender charge provision within 30 days. We adopt an interpretive standard holding that a "misrepresentation" under the Code includes true statements that, by omission of material facts reasonably expected for clarity, create a materially false or misleading impression.  

  **Reasoning:**  

  The member's statement that the client "could request a withdrawal at any time" was literally true. However, the context – a direct question about whether her money would be "locked up" – demanded clarity on material access *restrictions*. Omitting the significant 7% surrender charge applicable for the first five years created the materially false impression that withdrawals could be made freely without penalty throughout the contract. This constitutes a misrepresentation under our Code.  

  **The Adopted Standard:**  
  "A statement violates the Code's prohibition against misrepresentation if it is true but omits material facts necessary to prevent the overall communication from creating a materially false or misleading impression, considering the context and the reasonable expectations of the client."  

  *   **What This Reaches:** It covers situations like this case, where a technically true answer to a direct question omits a crucial, objectively material qualification (e.g., costs, penalties, significant limitations) that contradicts the natural implication of the statement made. It focuses on *material* facts central to the client's understanding and decision, reasonably expected to be disclosed for clarity in the specific context.
  *   **What This Does Not Reach:** It does not require advisers to volunteer every conceivable detail absent a specific inquiry or context implying its necessity. It does not penalize tactful phrasing, withholding confidential information, strategic silence in negotiations where no affirmative misleading statement is made, or minor omissions unrelated to the material point conveyed. The standard hinges on the creation of a *materially* false impression through the combination of a true statement and a material omission.  

  **Addressing the Strongest Counterargument:**  

  The member's defender rightly cautions against an overbroad standard that could penalize ordinary business conduct or require mind-reading of intent. We agree that not every implication or silence should constitute a violation. Our standard mitigates this concern by key limitations:  

  1.  **Materiality:** The omission must concern a fact central to the client's financial decision or understanding of the product's core functionality (like a significant penalty affecting access to funds).
  2.  **Context & Reasonable Expectation:** The omission must be unreasonable *given the specific question asked or statement made*. Here, the direct question about funds being "locked up" reasonably demanded disclosure of a substantial early withdrawal penalty. A general statement like "this annuity offers growth potential" would not inherently require disclosing all potential fees.
  3.  **Creation of False Impression:** The true statement, coupled with the omission, must *actually create* a materially false impression. The committee assesses this objectively based on what a reasonable client would understand from the exchange. The cited research on "paltering" aligns with the complainant's experience: while the adviser may have felt technically honest, the client justifiably felt deceived upon discovering the undisclosed charge. Intent is relevant to sanction severity, but the objective misleading effect determines violation.  

  **Disposition Justification:**  

  While the member did not make a false statement, his literal truth materially misled the client on a critical aspect of liquidity. A private reprimand acknowledges this violation of the duty to be truthful in substance, not just letter. The required corrective letter (within **30 days**) serves to remedy the specific harm to the client by providing the omitted material information. More severe sanctions (public censure) are not warranted absent evidence of deliberate intent to deceive or a pattern of such conduct.  

  **Conclusion:**  

  Advisers must recognize that conveying truth requires attention to the reasonable meaning clients derive from statements, especially in response to direct questions about material features. This standard upholds the Code's spirit of honesty and transparency without imposing impractical burdens of exhaustive disclosure. We find the member violated the Code and impose the disposition noted above.  

