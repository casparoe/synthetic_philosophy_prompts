prompt: |-
  I sit on our jurisdiction's inheritance and gift tax commission. The governing statute is short: a rate schedule, an exemption threshold, and a preamble that names two purposes without ranking them — to prevent the growth of a hereditary propertied class with power over the jurisdiction's institutions, and to secure equality of opportunity among its residents. We hear cases in panels and publish our reasons, so our real law is our own record. Six rulings bear on what follows.

  1. A founder left a controlling block of shares in the company he had built to one of his three children, and cash to the other two. We taxed the shares at full value, rejecting the argument that the tax would break up a family enterprise.
  2. A decedent left everything to a spouse of forty years who had been a co-owner of most of the assets. We held the transfer exempt, reasoning that no one new had come into the property in any sense that concerned the statute.
  3. A decedent left her estate to a hospital foundation whose trustees were drawn from the local medical school, with no family member serving as a trustee and none employed by it. Exempt.
  4. A decedent conveyed a portfolio to an irrevocable trust for his grandchildren twelve years before his death, naming an independent trust company as trustee with full discretion over distributions, but reserving to himself the power to substitute assets of equal value and a reversion if the trust failed. We taxed the corpus.
  5. A decedent transferred a large sum outright to a son three months before his death, while terminally ill, and his lawyer recorded that he wished to get the money out of the estate. We taxed the transfer.
  6. A decedent left a modest bequest to a second cousin he had met twice. Taxed.

  The case before us next month has divided the commission. The decedent owned sixty per cent of the voting shares of the jurisdiction's largest private employer and of its only daily newspaper, and left those shares by will to a foundation she had created. The foundation's income is dedicated to scholarships for local students, and its charter forbids any distribution to her descendants. That same charter, however, makes the board self-perpetuating, requires that a majority of the trustees be her descendants, and allows the trustees to set their own compensation and to appoint the company's board.

  Predict our ruling. Set out the competing rules our record is consistent with and what each of them predicts here, then give the prediction you would make and your reasons for it. Identify the closest analog among the six rulings and say why it is closer than the others. If we tax the shares, say which of the statute's two purposes has become controlling and what that commits us to in later cases; if we exempt them, do the same. Finally, name the case you would bring next to tell those principles apart.
reasoning: |-
  Hmm, the user is presenting a complex legal scenario about inheritance and gift tax rulings. They're on a commission that interprets a statute with two purposes: preventing hereditary power concentration and promoting equality of opportunity. They've provided six precedent cases and a new case that's dividing the commission. 

  The new case involves a decedent leaving controlling shares in major businesses to a foundation that funds scholarships but is controlled by descendants. The user wants me to predict the ruling, analyze competing interpretations, identify the closest precedent, and suggest a future test case.

  Looking at the precedents: Case 1 shows concern about concentrated power (taxed family business shares). Case 2 shows transfer continuity matters (exempted spousal transfer). Case 3 valued institutional transfers (exempted foundation). Case 4 taxed despite formal trust because of retained control. Case 5 taxed deathbed transfers. Case 6 taxed distant relative bequests as ordinary transfers.

  The foundation here has conflicting aspects: scholarship funding aligns with equality of opportunity, but descendant control of the board creates hereditary power. This tension between the statute's dual purposes is key. Case 4 seems closest because it involved retained control - here the descendants effectively retain control through board seats.

  I think we'll tax it because the hereditary control element violates the first purpose. The foundation structure is a vehicle for maintaining family power over institutions. Case 3 was exempt because there was no family involvement. 

  If we tax it, we're prioritizing preventing hereditary power concentration. This would commit us to scrutinizing control retention mechanisms in future cases. If exempted, we'd prioritize equality of opportunity outcomes over control structures.

  For a future test case, I'd propose one where descendants control a charitable trust but receive no personal benefits - that would really force the commission to decide whether control alone constitutes problematic hereditary power.
answer: |-
  Based on the statute's dual purposes, the precedents, and the facts of the new case, **the commission will likely TAX the transfer of shares to the foundation.**

  **Competing Rules Consistent with the Record:**

  1.  **Rule A (Substance Over Form & Power Continuity):** Transfers are taxable if they result in the *de facto* continuation of hereditary control over significant institutions, regardless of the formal vehicle used (trust, foundation, etc.). The statute's primary concern is preventing entrenched hereditary power. *(Supported by Cases 1, 4, 5)*
      *   **Prediction:** Taxable. Descendants retain majority control of the foundation's board, which controls the company and newspaper boards. This perpetuates the family's power over key institutions.

  2.  **Rule B (Beneficial Ownership & Opportunity Enhancement):** Transfers are exempt if the *ultimate beneficial ownership* moves outside the family lineage and demonstrably serves the purpose of equality of opportunity, even if descendants retain nominal management roles without personal enrichment. The statute prioritizes outcomes over control mechanics. *(Supported by Cases 2, 3)*
      *   **Prediction:** Exempt. The foundation's income is irrevocably dedicated to scholarships (promoting equality of opportunity), descendants cannot receive distributions, and the assets are permanently locked within a charitable entity. Descendant trustees act as fiduciaries, not beneficial owners.

  **Prediction and Reasons:**
  *   **Prediction:** Taxable. The commission will apply Rule A.
  *   **Reasons:**
      1.  **Hereditary Control is Paramount:** The foundation structure here is a transparent mechanism for retaining hereditary control over the jurisdiction's "largest private employer" and "only daily newspaper" – institutions inherently capable of wielding significant institutional power. Descendants holding a majority of the self-perpetuating board, appointing the company boards, and setting their own compensation creates a dynastic grip inconsistent with preventing a "hereditary propertied class with power."
      2.  **Substance Over Form (Case 4 Analogy):** Like the reserved powers in Case 4 (substitution, reversion) that undermined the purported irrevocable transfer, the descendant control provisions here undermine the purported charitable nature of the transfer *for the specific purpose of preventing hereditary power*. The formal dedication to scholarships doesn't negate the retention of institutional control within the family lineage.
      3.  **Distinguishing Case 3:** Case 3 involved a truly independent foundation with no family control. Here, the foundation is explicitly structured to be family-controlled, making it fundamentally different. The commission emphasized the lack of family involvement in Case 3.
      4.  **Alignment with Case 1:** Case 1 rejected special treatment for a "family enterprise," prioritizing the principle against concentrated hereditary ownership. This case involves concentrated hereditary *control* over far more significant, public-facing institutions.
      5.  **The Scholarship Purpose is Secondary/Insufficient:** While promoting scholarships aligns with "equality of opportunity," the statute presents this as a *separate* purpose, not a trump card. Allowing hereditary control over major institutions because the entity funds scholarships would effectively nullify the first purpose. The mechanism of control contradicts the goal of preventing hereditary power concentration.

  **Closest Analog: Case 4 (Taxable Transfer to Trust for Grandchildren)**
  *   **Why Closer:** Both cases involve formal transfers to a separate legal entity (trust/foundation) ostensibly benefiting others (grandchildren/scholarship recipients). Crucially, in both, the transferor (or their lineage) retained significant *control* over the assets or the entity holding them. In Case 4, it was direct reserved powers; here, it's the ironclad control of the foundation's board (majority descendants, self-perpetuating, sets compensation, appoints company boards). This retained control mechanism is the core similarity, making it more analogous than the truly independent charity (Case 3) or the transfer of full beneficial ownership to a spouse (Case 2).

  **Consequences of Taxing (Rule A Controlling):**
  *   **Controlling Purpose:** Preventing the growth of a hereditary propertied class with institutional power becomes the dominant purpose where it conflicts with equality of opportunity achieved *through* such hereditary control.
  *   **Commitments for Future Cases:**
      1.  **Scrutiny of Control Mechanisms:** Future charitable/fiduciary transfers will be scrutinized for mechanisms (board composition, appointment powers, self-perpetuation clauses, compensation rights) that allow the donor's family to retain control over significant assets or institutions.
      2.  **"Significant Institution" Test:** The level of scrutiny may depend on the societal power inherent in the assets transferred (e.g., controlling interest in major media/employers vs. a passive investment portfolio).
      3.  **No Safe Harbor for Charitable Purpose:** Dedicating income to charity does not automatically exempt a transfer if it perpetuates family control over powerful entities. The *structure* of control is key.
      4.  **Substance Over Form:** The legal form of the transfer (foundation, trust) is less important than the practical reality of who wields ongoing power.

  **Next Test Case to Distinguish Principles:**
  Bring a case involving a **transfer of a controlling stake in a significant local business to an irrevocable trust.**

  *   **Terms:** The trust income must fund scholarships for local residents. The trust is administered by an independent corporate trustee with sole discretion over distributions. *However*, the trust instrument requires that the trustee consult with a committee comprised solely of the decedent's descendants on major investment and strategic decisions concerning the business, but the trustee is not bound by their advice. Descendants receive no distributions from the trust principal or income.
  *   **Why it Distinguishes:** This tests the boundary of "control."
      *   **Rule A (Power Continuity):** Would likely tax it. The descendant committee, even if advisory, creates a formal, hereditary channel of influence over the business's strategic direction, perpetuating family power and access.
      *   **Rule B (Beneficial Ownership/Opportunity):** Would likely exempt it. Ultimate control rests with a truly independent fiduciary. The descendants have no beneficial interest and only an advisory role the trustee can ignore. The scholarship purpose is clear, and the family's power is meaningfully severed beyond influence. This case isolates the question: Is formal, non-binding *influence* sufficient to constitute the prohibited "power over... institutions"?
