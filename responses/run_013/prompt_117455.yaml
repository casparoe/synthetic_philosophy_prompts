answer: |-
  **INTERNAL GUIDANCE MEMORANDUM: PROCEDURAL FRAMEWORK FOR POLICY ASSESSMENT (REV. 3.7)**

  **Subject:** Clarifications on the Contractualist Assessment Protocol (CAP)  
  **Effective Date:** Immediately  
  **Distribution:** All Policy Analysis & Ethics Review Staff

  This document supersedes all prior guidance regarding Cost-Benefit Analysis. All policy proposals must now undergo assessment under the Contractualist Assessment Protocol (CAP). The core principle is: **A policy may proceed only if no one could reasonably reject the principle that licenses it.**

  Below are responses to frequently encountered operational questions:

  **1. Q: Policy Proposal A-113 involves rerouting ambulances. Analysis shows this will reduce average response times in Region North, saving an estimated 5 lives annually. However, it significantly increases response time to the isolated Hamlet of Glenbrook (pop. 1 resident, Mr. A. Henderson), raising his risk of mortality during a cardiac event from 2% to 15%. Does this policy satisfy CAP?**
  A: No. The principle licensing Policy A-113 is: "Ambulance routing may be optimized to maximize aggregate lives saved, accepting increased mortality risk for geographically isolated individuals." Mr. Henderson, facing a significantly increased and non-negligible risk of death, could reasonably reject this principle. His complaint—the imposition of a substantially higher, survivable-but-unacceptable risk—cannot be dismissed. The aggregate benefit does not nullify his reasonable rejection.^(1) Proposal A-113 is non-compliant.

  **2. Q: How do we handle multiple complaints? Can we add them together, average them, or compare their severity?**
  A: CAP requires assessing whether *any* individual could reasonably reject the principle. The focus is on the *individual complaint* arising from the principle's application. Aggregation (adding, averaging) of complaints across individuals is incompatible with the core tenet that a single reasonable rejection is sufficient to veto the principle.^(2) Comparing the severity or reasonableness of *different individuals' complaints* against the *same principle* is permitted only to determine if one complaint constitutes a reasonable rejection where another might not.^(3) We do not weigh complaints *against each other* from different principles.

  **3. Q: How is "reasonable rejection" defined? Who determines reasonableness?**
  A: A rejection is "reasonable" if the complaint it is based upon cannot be reasonably dismissed by others who seek principles no one similarly situated could reasonably reject. Assessment requires adopting an *impartial standpoint*, considering the complaint's nature, severity, and whether alternative principles exist that would impose a lesser burden or distribute burdens more fairly.^(4) The determination of reasonableness is made by the assigned CAP Analyst, guided by established precedents (Ref: CAP Case Digest Vols. I-III) and consultation with the Office of Ethical Scrutiny (OES). The Analyst must rigorously articulate why a complaint is, or is not, reasonably rejectable within the framework.

  **4. Q: Consider Policy B-22: Mass mosquito spraying to prevent a projected outbreak of Disease X, expected to cause 10,000 non-fatal but severe (week-long hospitalization) illnesses. Spraying causes severe respiratory distress to approximately 50 identified asthmatics (requiring emergency treatment but full recovery). Can the thousands of prevented illnesses outweigh the harm to the 50?**
  A: Under CAP, the question is not one of "outweighing." The principle might be: "Community-wide disease prevention measures may proceed even if they cause serious, acute, survivable harm to a small number of vulnerable individuals." Each of the 50 asthmatics suffers a serious, specific harm (emergency treatment for respiratory distress). It must be assessed whether any *one* of these individuals could reasonably reject this principle. Given the severity and identifiability of the harm imposed upon them, it is likely that such a rejection would be deemed reasonable.^(5) Aggregate prevented harms do not override this. Proposal B-22 requires significant modification or alternative principle formulation.

  **5. Q: If complaints against Principle P and complaints against the alternative Principle Q are judged to be of *equal* weight/reasonableness individually, does the *number* of people lodging such complaints tip the decision?**
  A: No. CAP does not incorporate numerical thresholds for complaint aggregation. If Principle P generates reasonable rejections from Group A, and Principle Q generates reasonable rejections from Group B, and the complaints are assessed as being of comparable severity and reasonableness *from the standpoint of the individual complainer*, then *both* principles are invalidated under CAP, regardless of the relative sizes of Group A and Group B.^(6) The search must continue for a principle generating no reasonable rejections, or the policy objective may be unattainable under the current framework. The number of complainants does not resolve the stalemate.

  **6. Q: What if the only person who could reasonably reject a principle benefiting millions cannot be identified *ex ante* but will definitely exist?**
  A: The requirement holds. If the principle, by its nature, licenses an action that *will* impose a reasonably rejectable burden on *some* (as yet unidentified) individual(s), then the principle itself can be reasonably rejected *in advance* by anyone who could potentially occupy that position.^(7) Principle validity requires that no *possible* individual standpoint yields a reasonable rejection, not merely that no *currently identified* individual rejects it.

  **Office of Policy Integrity & Ethical Review (OPIER)**

  ---

  **FOOTNOTES:**

  ^(1) *Rationale:* The increased risk to Mr. Henderson is substantial and non-trivial. While survival is possible, the *magnitude* of increased risk constitutes a burden he cannot be required to accept for the greater aggregate good under CAP. Alternatives minimizing his detriment must be sought.
  ^(2) *Clarification:* Aggregation implies a calculus CAP explicitly replaces. The focus remains on the individual burden.
  ^(3) *Example:* Principle R ("Vaccines may be mandatory despite causing sore arms") likely faces unreasonable rejections. Principle S ("Vaccines may be mandatory despite a 1 in 1,000,000 risk of anaphylaxis") might not, if the risk is deemed sufficiently minimal *by the CAP Analyst* to be dismissible. Here, severity comparison is inherent in assessing reasonableness *of the complaint itself*.
  ^(4) *Guidance:* The "impartial standpoint" requires the Analyst to abstract from their own position and interests. Reference the "Veil of Particularity" guidelines (OPIER Doc #ETH-IMP-04). OES consultation is mandatory for Severity Level 3+ complaints.
  ^(5) *Precedent:* See *In re: County Wide Pesticide Application (CAP Digest Vol. II, Case #45)*. Harm requiring emergency medical intervention was deemed sufficient grounds for reasonable rejection, despite widespread benefit.
  ^(6) *Operational Reality:* This scenario often necessitates policy redesign or acceptance of the status quo. Document thoroughly using Form CAP-STALEMATE/1.
  ^(7) *Doctrinal Note:* This addresses the "Identifiability Paradox." Rejectability hinges on the *type* of burden the principle licenses, not the *identity* of the bearer. An unknown future bearer of a severe burden retains the moral standing to reject the principle authorizing it.
