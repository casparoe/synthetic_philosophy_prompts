     But note: they might set the same spread in both rounds? Then loss4 = loss3? But we want them to widen.

     How to induce widening? We can explain: "Now that you know the coin was heads, does that change your uncertainty about the urn? Remember, we don't know if the urn was set independently of the coin." 

     We hope they consider that the coin outcome might be relevant? And then they become more uncertain? 

     But in reality, they might not. So we might need to prime them.

     We can say: "The person who left the room and set the urn might have set it differently depending on a coin flip. We don't know. So the urn composition might be different if the coin was heads or tails." 

     Then they realize that the true probability for R might be different given heads or tails. But we revealed heads, so they don't know what it would have been for tails? 

     But note: they are being asked for the probability of R given that the coin was heads. If the urn was set independently, it's still 0.3. But if there was dependence, it could be anything. 

     So their set of possible probabilities for R given heads might be very wide. 

     Therefore, they should set a wider spread in Round 4.

     Then we deduct loss4 and it might be 0 (if they set a sufficiently wide spread) but we note that they are now less committal.

  ## Timeline (90 minutes)

  - Introduction (5 minutes): Explain the rules and the goal (to avoid losing money). Everyone starts with $100.
  - Round 1: Urn A (known) (10 minutes)
     - Explain Urn A: 50 red, 50 blue.
     - Students write down (b_A, s_A) on a piece of paper.
     - Collect and compute the expected loss for each student. Deduct from balance.
     - Show the class a few examples (anonymously) and discuss why some lost money and some didn't.
  - Round 2: Urn B (mystery) (10 minutes)
     - Explain Urn B: fixed but unknown composition, set by a student who left. True composition is 30 red, 70 blue (but don't tell them).
     - Students write down (b_B, s_B).
     - Collect and compute loss_B (using p=0.3). Deduct.
     - Show examples and discuss: why were spreads wider? Why did some who set a single point lose a lot?
  - Break (5 minutes)
  - Round 3: Urn B again, but now we introduce a coin (10 minutes)
     - Explain: We have a fair coin. We are going to flip it, but before we do, we want you to set your spread for R (red from Urn B) without any coin information. This is the same as Round 2? But we do it again? We can say: "This is a new bet, but on the same urn." 
     - They set (b0, s0) for R. We record but do not deduct yet.
  - Round 4: After the coin flip (15 minutes)
     - Flip the coin in front of the class (or have a student do it). Suppose it's heads.
     - Now, we want you to set your spread for R again, but now knowing that the coin was heads. Remind them: "Remember, the urn might have been set in a way that depends on the coin. We don't know. So the probability of R might be different now that you know the coin was heads? Or it might be the same? You decide."
     - They set (b1, s1) for R (conditional on heads).
     - Now, we deduct for both Round 3 and Round 4? But we haven't drawn the urn. Instead, we use the true p=0.3 for both? 
     - We deduct loss3 = max(b0 - 0.3, 0.3 - s0, 0) and loss4 = max(b1 - 0.3, 0.3 - s1, 0).
  - Debrief (35 minutes): 
     - Show the change in spreads: plot some anonymous examples of (b0, s0) vs (b1, s1). We expect to see widening.
     - Explain why: because they are considering that the true probability for R given heads might be anything? 
     - Then explain the imprecise probability model: their spread represents an interval of probabilities. Initially, they might have had [a,b] for R. After learning H, they update each prior in the set. Some priors might have P(R|H)=0, some might have 1, so the updated set is [0,1]? Or at least wider than [a,b]. This is dilation.
     - Discuss the discomfort: they learned something irrelevant (the coin, which is independent) and yet they are less certain about R? 
     - Then push in both directions:
          - In Round 2, if they had set a sharp credence, they would have been exploited (if they were wrong). So imprecision protects them.
          - But now, after learning the coin, they are forced to become even less committal? That seems irrational? Or is it rational because they don't know the independence?
     - Highlight the contested issues:
          - Is dilation a reductio? Some say yes: it's counterintuitive and undesirable. Others say it's a feature: it reflects the lack of knowledge about the dependence.
          - Is ambiguity aversion a mistake? In economics, ambiguity aversion is observed (Ellsberg), but some argue that it's irrational. Others argue it's rational caution.
          - Is imprecision just higher-order uncertainty? Some say yes: it's a way of representing second-order probabilities. Others say no: it's a fundamentally different model (sets of probabilities).

  ## What might go wrong

  1. **Someone tries to game the dealer**: They might set a huge spread to avoid any loss. For example, (b=0, s=1) for every bet. Then loss=0 always. But that means they are completely uncommitted and can never make a profit? We can note that in a real decision, they might want to take a position? But in this game, they are only concerned with not losing. We can say: "In the long run, if you set a huge spread, you never trade and never make money. But here, we are only concerned with avoiding exploitation." So it's a valid strategy, but it shows the extreme of imprecision.

  2. **Someone refuses to quote**: We can require that they must quote a spread. If they refuse, we assign them (0,1) and then they lose 0? But they might as well do that themselves.

  3. **Spread arithmetic eats time**: We can pre-prepare a spreadsheet to compute the losses. Or have TAs. Or do a subset of students. We can collect the numbers quickly and compute while discussing.

  ## The dependence structure

  The dilation step relies on the students considering that the coin and the urn might be dependent. We have to prime them to think that way. We tell them: "The person who set the urn might have used the coin to decide the composition." So the urn composition could be:

     If heads, then the urn is 90% red; if tails, then 10% red? Or something else.

  But note: we have already fixed the urn at 30% red. So the true composition does not depend on the coin. But the students don't know that. 

  So in the debrief, we reveal that the urn was fixed and the coin was independent. But the point is: they didn't know that. So the dilation occurred because of their lack of knowledge.

  The game can show dilation if the students widen their spread. But if they don't, then the dilation didn't occur? So we have to hope they do. 

  We can help by saying: "Given that you don't know if the urn setter used the coin, what does heads tell you about the urn? It could be that the urn setter decided to use the coin, so heads might mean a different urn composition. Or it might not. So you are now more uncertain."

  ## Contested Issues in the Debrief

  We separate what is agreed upon and what is contested:

  1. **Imprecise probabilities as a representation**:
     - Agreed: They can model ambiguity and avoid sure loss (in the sense of not being Dutch booked) by using a set of probabilities and setting a spread.
     - Contested: Whether this is a normative requirement or merely one option. Some argue that rational agents must have sharp probabilities (via representation theorems). Others argue that ambiguity is real and sharp probabilities are overcommittal.

  2. **Ambiguity aversion**:
     - Agreed: People are ambiguity averse (Ellsberg). 
     - Contested: Whether ambiguity aversion is rational. Some say it is a mistake (because it leads to violations of expected utility axioms). Others say it is a rational response to lack of information.

  3. **Dilation**:
     - Agreed: Dilation occurs in the imprecise framework when the set of priors includes some that have dependence and the updating is done by conditioning each prior.
     - Contested: Whether dilation is a problem. Critics say it's counterintuitive and unacceptable (e.g., learning irrelevant information shouldn't make you less certain). Defenders say it's a natural consequence of not knowing the dependence structure.

  4. **Interpretation of imprecision**:
     - Agreed: The spread can be interpreted as the lower and upper bounds of a set of probabilities.
     - Contested: Whether this set represents genuine indeterminacy or merely lack of knowledge about a sharp probability. Some argue that the set should be interpreted as a set of possible sharp probabilities (epistemic). Others argue for an ontic interpretation (that the probability is inherently imprecise).

  We present these as open questions and encourage students to read the literature.

  ## Final Timeline

  - 0-5 min: Introduction
  - 5-15 min: Round 1 (Urn A)
  - 15-25 min: Round 2 (Urn B)
  - 25-30 min: Break
  - 30-40 min: Round 3 (Urn B, pre-coin)
  - 40-50 min: Coin flip and Round 4 (Urn B, post-coin)
  - 50-85 min: Debrief (include computation of losses for Rounds 3 and 4 and discussion of spreads, then the dilation explanation, then the contested issues)
  - 85-90 min: Wrap-up

  Note: The times are tight. We might need to adjust.

  We provide a handout with the rules and a worksheet for the students to record their spreads and losses.

  This should achieve the goals.
answer: |-
  Below is a complete, detailed lesson plan for your 90-minute seminar, designed to make students viscerally experience the motivation for imprecise probabilities and the discomfort of dilation. The plan includes materials, urn compositions, step-by-step mechanics, timing, dealer rules, debriefing points, and troubleshooting for common pitfalls. I'll also flag limitations and separate settled from contested issues.

  ---

  ### **Materials & Setup**
  - **Urns**:
    - **Urn A (Known)**: 50 red balls, 50 blue balls (100 total).  
    - **Urn B (Mystery)**: 100 balls; fixed at **30 red, 70 blue** (unknown to students). *Emphasize:* "The split was set by a student who left the room. It's fixed, but you have no information about it."
  - **Coin**: A genuinely fair coin (50/50).
  - **Balances**: Start each student with **$100** in fake chips. Use a digital leaderboard (e.g., Google Sheets) for instant balance updates.
  - **Betting Tickets**: Tickets pay **$1 if red is drawn** from a specified urn. No payout otherwise.
  - **Quoting Mechanism**: Students submit two numbers per bet:  
    - **Buy price (`b`)** = Highest price they’ll pay to buy a $1 ticket.  
    - **Sell price (`s`)** = Lowest price they’ll accept to sell a $1 ticket.  
    - **Constraint**: `b ≤ s` (enforced by rule; reject submissions violating this).
  - **Dealer Rules**:  
    - Dealer (you or a rotating student) **must** trade with each student.  
    - For each quote, dealer chooses the trade that maximizes expected profit:  
      - **Sell to student** at `b` (student pays `b`, gets ticket).  
      - **Buy from student** at `s` (student receives `s`, owes $1 if red).  
    - **No real draws**: To save time, **debit expected losses instantly** (calculations are trivial; see below).  
    - Dealer uses **true probabilities** for exploitation:  
      - Urn A: `P(red) = 0.5`.  
      - Urn B: `P(red) = 0.3` (fixed but unknown to students).  

  ---

  ### **Timeline (90 Minutes Total)**
  #### **Part 1: Why Imprecise Probabilities? (40 min)**
  **Goal**: Students discover spreads protect against exploitation, especially under ambiguity.  
  - **0–5 min**: Introduce rules.  
    - *Script*: "You’ll bet on events by setting buy/sell prices. The dealer will exploit you if your prices are vulnerable. Your goal: avoid losing money. Urn A’s composition is known. Urn B’s is fixed but unknown—set by a student who left."  
  - **5–20 min: Round 1 (Urn A - Known)**.  
    - Students submit `b_A` and `s_A` for Urn A (red).  
    - **Dealer action**: For each student, compute expected loss:  
      - If `b_A > 0.5`, dealer sells ticket: loss = `b_A - 0.5`.  
      - If `s_A < 0.5`, dealer buys ticket: loss = `0.5 - s_A`.  
      - If neither, loss = $0.  
    - **Debit losses publicly** (e.g., "Alex: `b_A = 0.6`, loss = $0.10").  
    - *Expected outcome*: Students with `b_A = s_A = 0.5` lose $0. Those with tight spreads (e.g., [0.49, 0.51]) lose pennies. Those with point estimates ≠0.5 lose heavily.  
  - **20–40 min: Round 2 (Urn B - Mystery)**.  
    - Students submit `b_B` and `s_B` for Urn B (red).  
    - **Dealer action**: Compute loss using `P(red) = 0.3`:  
      - Loss = `b_B - 0.3` (if dealer sells) or `0.3 - s_B` (if dealer buys).  
    - **Debit losses**. Contrast with Round 1.  
    - *Expected outcome*: Students with narrow spreads (e.g., [0.25, 0.35]) lose heavily. Those with wide spreads (e.g., [0.1, 0.8]) lose little or nothing.  

  **Key discussion point (during losses)**:  
  > "On Urn A, you collapsed your spread—it was safe. On Urn B, if you used a single number, you got crushed. The spread width isn’t timidity; it’s armor against exploitation when you lack information."

  ---

  #### **Part 2: The Dilation Trap (30 min)**
  **Goal**: Students widen their spread on Urn B after an irrelevant coin flip, revealing dilation.  
  - **40–45 min: Setup for Round 3 (Urn B Pre-Coin)**.  
    - *Script*: "We’ll flip a fair coin. After the flip, we’ll draw from Urn B. But before flipping, set new buy/sell prices for Urn B (red)."  
    - Students submit `b_pre` and `s_pre` (same as Round 2; don’t debit yet).  
  - **45–50 min: Coin Flip & "Revelation"**.  
    - Flip coin publicly (e.g., lands heads).  
    - *Crucial priming*: "Heads! But remember: the student who left might have set Urn B’s composition *depending* on this coin. We don’t know if they did or not."  
  - **50–60 min: Round 4 (Urn B Post-Coin)**.  
    - *Script*: "Now that you know the coin is heads, update your prices for Urn B (red)."  
    - Students submit `b_post` and `s_post`.  
    - **Debit losses for BOTH rounds** using `P(red) = 0.3` (true probability unchanged):  
      - Pre-coin loss: As in Round 2.  
      - Post-coin loss: Same calculation.  

  **Critical mechanics for dilation**:  
  - Students who widen `s_post - b_post` reduce losses (often to $0).  
  - Most will widen spreads (e.g., [0.2, 0.4] → [0.1, 0.9]) despite learning nothing relevant.  
  - *Why?* Your priming ("might have set depending on the coin") triggers ambiguity about dependence. Even though the coin *is* independent, they don’t *know* it is.  

  ---

  #### **Debrief (20 min)**
  **Map each moment to theory**:  
  1. **Round 1 (Urn A)**: Sharp credences (`b = s`) are safe when probabilities are known.  
  2. **Round 2 (Urn B)**: Ambiguity forces spreads. A point estimate is exploitable; spreads protect (Ellsberg’s insight).  
  3. **Rounds 3–4 (Dilation)**:  
     - You learned an irrelevant fact (coin flip), but your spread widened.  
     - *Why?* Your spread represents a **set of priors**. Some priors assumed independence (P(red) unchanged); others assumed dependence (P(red|heads) could be 0.1 or 0.9). Conditioning on heads expands the set of possible probabilities to [0,1] or wider → **dilation**.  

  **Push in both directions**:  
  > "In Round 2, a sharp credence would have been exploitable. But in Round 4, your imprecise credence became *less* precise for free—you paid nothing to become more ignorant! Is this rational? Let’s dissect."  

  **Contested Issues (Separate Consensus from Debate)**:  
  | **Issue**                          | **Consensus**                                                                 | **Genuine Disagreement**                                                                 |
  |-------------------------------------|-------------------------------------------------------------------------------|--------------------------------------------------------------------------------------------|
  | **Ambiguity aversion**              | People prefer known risks (Urn A) over ambiguity (Urn B).                    | Is it rational? **No consensus**:<br>— *Pro*: Prudent in face of incomplete info.<br>— *Con*: Violates axioms of rationality (e.g., Savage). |
  | **Imprecise probabilities**         | Sets of probabilities model ambiguity-avoidant behavior.                     | Are they a "real" alternative? **No consensus**:<br>— *Realist*: Yes; sharp probabilities overcommit.<br>— *Reductionist*: No; they're just hidden higher-order uncertainty. |
  | **Dilation**                        | It occurs in imprecise models when updating on irrelevant events.            | Is it a reductio? **No consensus**:<br>— *Critics*: Unacceptable; violates "relevance" intuition.<br>— *Defenders*: Feature, not bug; reflects genuine uncertainty about dependence. |

  **Close with open questions**:  
  > "Dilation forces a choice: Reject imprecise probabilities because they dilate? Or accept dilation as the cost of modeling ambiguity? There’s no settled answer—this is live philosophy."

  ---

  ### **Pitfalls & Fixes**
  - **Pitfall 1: Students "game" the dealer** (e.g., set `b=0, s=1` to avoid loss).  
    - **Fix**: Highlight this in debrief: "If you set a huge spread, you avoid exploitation but can’t profit. Is this rational? Or does it make you a 'money pump'?"  
  - **Pitfall 2: Refusal to quote**.  
    - **Fix**: Enforce participation: "If you don’t submit, you get `b=0, s=1` by default—safe but unprofitable."  
  - **Pitfall 3: Spread arithmetic bogs down**.  
    - **Fix**: Use a spreadsheet (projected) for instant loss calculations. Pre-calculate examples (e.g., "If `b=0.4`, loss = `0.4 - 0.3 = $0.10`").  
  - **Pitfall 4: Dilation doesn’t land**.  
    - **Why**: Students might assume independence unless primed.  
    - **Fix**: Hammer the priming: *"Might have set depending on the coin"* 3x. If spreads don’t widen, use a student example: "Why did you widen? Because heads *could* mean Urn B is mostly red... or mostly blue!"

  ---

  ### **What Can't Be Staged**
  - **The dependence structure is critical**: Dilation *only* occurs if students entertain possible dependence between the coin and Urn B. Your priming ("might have set depending") is essential—without it, they’ll assume independence and spreads won’t widen.  
    - **Consequence**: The game *doesn’t* show that dilation is inevitable. It shows it arises when the set of priors includes dependence. This is a pedagogical feature, not a bug—it clarifies dilation’s mechanism.  
  - **Limitation**: The game simplifies dilation (e.g., true probability is fixed). In reality, dilation can occur even without ambiguity about dependence, but this requires more technical setups (e.g., non-conglomerability). Stick to this intuition-pump.

  ---

  ### **Why This Works**
  - **First half**: Students *feel* why point estimates fail under ambiguity (losses hurt!).  
  - **Second half**: Dilation emerges from a *seemingly* irrelevant update—no jargon needed. The debrief links the visceral experience to theory and controversies.  
  - **Balance**: The plan avoids preaching "imprecise probabilities are wrong/right." It forces students to grapple with the trade-offs.  

  This plan delivers the cognitive dissonance you want: spreads feel necessary, then dilation makes them feel unstable. Adjust timing if needed, but protect the priming and dilation moment—they’re the core.
