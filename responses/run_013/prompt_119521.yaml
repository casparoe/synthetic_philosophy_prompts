answer: |-
  ### **Doomsday Argument Game: Full Runnable Session**
  **Goal:** Make students viscerally grasp the evidential weight of their birth rank, the assumptions behind random sampling vs. "existence as evidence," and the reference class problem.

  **Materials (Budget-Friendly):**
  - **2 opaque bags** (e.g., cloth drawstring bags or sealed boxes with hand holes).
  - **Tokens:** 
    - *Bag 1 (Small World):* 10 numbered tokens (1–10). Use poker chips, cardboard circles, or folded paper.
    - *Bag 2 (Large World):* 100 tokens (1–100). *Hack:* Use 10 tokens labeled 1–10 and a note: "This bag represents 100 people. If drawn, your birth rank is a random number from 1–100 (pre-generated by you)." *Physical alternative:* Use 100 beads/beans, but numbering is impractical—opt for the note.
  - **Coin** (for secret flip).
  - **Paper & pens** for each student.
  - **Whiteboard/flip chart** for scoring and debrief.
  - **Timer.**

  **Session Flow (90 Minutes):**

  ---

  #### **Round 1: The Classic Urn (35 min)**
  *Goal: Experience updating on birth rank as random sampling.*  
  1. **Setup (5 min):**  
     - "There are two possible worlds: **Small** (10 humans total) or **Large** (100 humans total). I flipped a coin to pick one secretly. Each token is a birth rank. You’ll draw one from the true world’s bag."  
     - Flip coin (hidden): Heads → Small World (10 tokens), Tails → Large World (100 tokens).  
     - Hold up both bags without revealing contents.

  2. **Draw Tokens (5 min):**  
     - Students line up, draw one token from the chosen bag (no peeking). They see their number privately (*critical*).  
     - *Example:* A student draws "7" — they are the 7th human.

  3. **Private Estimates (10 min):**  
     - Each student writes on paper:  
       - **(A) Probability the world is Small (0–100%).**  
       - **(B) 90% confidence interval for total humans (e.g., [5, 20]).**  
     - *Incentive:* Use a **quadratic scoring rule** for honesty:  
       - For (A): Score = `1 - (1-p)^2` if true world is Small, or `1 - p^2` if Large (max score 1 for perfect certainty).  
       - For (B): Score = `0.9 - (interval_width / 100)` if true total in interval, else `-1`.  
     - *Prevent free-riding:* Collect papers immediately. No discussion allowed.

  4. **Reveal & Score (15 min):**  
     - Reveal the coin flip and true world (show the bag contents).  
     - Calculate scores on the board. Highlight best/worst scorers (anonymized).  
     - *Bayesian recap:*  
       - If birth rank = k:  
         - k > 10 → Must be Large World (P(Small|k) = 0).  
         - k ≤ 10 → P(Small|k) = `[P(k|Small) * P(Small)] / [P(k|Small)*0.5 + P(k|Large)*0.5]` = `(1/10 * 0.5) / (1/10*0.5 + 1/100*0.5) = 90.9%`.  
       - *Key intuition:* Low k is more likely in a Small world.

  ---

  #### **Round 2: The Cancellation Twist (25 min)**
  *Goal: Challenge random sampling by treating existence as fixed evidence.*  
  1. **Reset & Reframe (5 min):**  
     - "New rules: Your existence is guaranteed. You *are* birth rank 5 — no drawing. The worlds are still Small (10 humans) or Large (100 humans), but both *must* include a 5th human. What changes?"  
     - *No physical draw.* Students know their rank is fixed at 5.

  2. **Private Estimates (5 min):**  
     - Again, write:  
       - (A) Probability the world is Small.  
       - (B) 90% interval for total humans.  
     - Collect papers.

  3. **Reveal & Discuss (15 min):**  
     - True world is same as Round 1 (reveal coin flip).  
     - *Bayesian answer:* P(Small) = 50%!  
       - Evidence is "a human exists at rank 5," not "I am randomly rank 5."  
       - Both worlds guarantee a rank 5 → No update from prior.  
     - Contrast scores with Round 1. Ask: "Why did your answers change?"

  ---

  #### **Reference Class Problem (15 min)**
  *Goal: Surface ambiguity in defining "observers."*  
  - **Group activity (10 min):**  
    - Divide students into 3 groups. Assign:  
      - Group 1: Only *Homo sapiens* count (birth ranks 1–current).  
      - Group 2: All *hominids* count (incl. Neanderthals; ranks 1–1M+).  
      - Group 3: All conscious beings count (incl. animals/AI; ranks 1–1B+).  
    - "You are the 100 billionth sapiens. What’s your 90% interval for total sapiens?"  
    - Groups discuss and report intervals.  
  - **Debrief (5 min):**  
    - Groups share intervals. Watch intervals widen from Group 1 → 3.  
    - Point: Doomsday conclusion swings wildly based on who counts.  

  ---

  #### **Debrief & Mapping to Real Argument (15 min)**
  - **Map the game to doomsday:**  
    | **Game Element**       | **Real Doomsday Argument**                 |  
    |-------------------------|--------------------------------------------|  
    | Small/Large World       | Early doom (e.g., nuclear war) vs. long future |  
    | Your birth rank (k)     | Your position in human history (≈ 100B of N) |  
    | Updating on k           | Low rank → N is small → doom soon          |  
    | Round 2 fixed rank      | "You had to exist" negates the update      |  
    | Reference class groups  | Who is an "observer"? (Sapiens? Aliens?)   |  

  - **Predictable Problems & Fixes:**  
    - *Problem:* Students share ranks/answers during draws.  
      - *Fix:* Enforce silence; use numbered paper for anonymous ID.  
    - *Problem:* Round 2 feels "cheap" without physical draw.  
      - *Fix:* Stress it’s a *conceptual* shift: "In Round 1, you were sampled; here, you’re a fixed point."  
    - *Problem:* Bayesian math lost on some.  
      - *Fix:* Simplify: "Low number? More likely Small World. Why? Fewer high numbers there."  

  - **What the Game Can’t Capture:**  
    - **No urn in reality:** We don’t know the *possible* futures (Small/Large worlds) or their probabilities. The game assumes known, discrete options (10 vs. 100), but reality has a continuum of possibilities.  
    - **No defined end:** The game’s "total humans" is fixed; in reality, we could prevent doom.  
    - **Anthropic selection vs. doomsday:** The game ignores that we exist *now* — which might itself be evidence against doom (if doom were likely, we wouldn’t be here).  

  **Final Thought:**  
  This game makes the abstract *feel* concrete. Students leave haunted by: "My birth rank *is* evidence... but only if I’m a random sample from all humans. Am I?" Lean into the discomfort — that’s philosophy.
