answer: |-
  Dear Colleagues,

  We write to map the terrain of our ongoing discussion, hoping to move beyond rehearsed positions toward a clearer understanding of our genuine disagreements and shared foundations concerning large-scale historical patterns. Both perspectives represented here – let’s call them the Ratchet View and the Switchyard View – grapple with the undeniable fact of increasing social scale and complexity over the *longue durée*, and the frequent association of this scale with hierarchical institutions and durable inequality. We agree that a valuable grand narrative must explain the *prevalence* of these outcomes within the broad sweep of human history, acknowledging both the apparent trends and the significant counter-examples scattered throughout the archaeological and ethnographic record. We further agree that such a narrative must engage seriously with the empirical evidence of variation, reversal, and experimentation, not merely as noise but as data demanding explanation. Both sides also concur that evidence alone, particularly the fragmented and survival-biased nature of the deep past record, cannot definitively *prove* inevitability or universality; it can only establish patterns, frequencies, and constraints. We accept that arguments about "directionality" involve interpretations of probability and constraint based on available evidence, not assertions of historical laws akin to physics.

  **The Ratchet View** holds that the cumulative increase in societal scale – driven by the capture and mobilization of energy, the processing and storage of information, and the demands of coordination – creates systemic pressures and functional imperatives. Scale necessitates specialization, coordination problems intensify, and the costs of conflict increase, making centralized decision-making, administrative hierarchies, and mechanisms of resource extraction not just likely, but increasingly difficult to reverse without catastrophic fragmentation. While acknowledging the existence of smaller-scale egalitarian societies and occasional reversals, this view sees these as either pre-scale phenomena, exceptions proving the rule (often under unique conditions or short-lived), or unstable equilibria inevitably vulnerable to the pressures generated by growth and competition. For the Ratchet View, a genuine anomaly would be robust evidence of a *large*, *enduring*, *complex* society (comparable to agrarian states or early empires in scale and internal differentiation) that *persistently* maintained truly egalitarian power structures and minimal durable inequality over centuries *without* relying on external exploitation or exhibiting signs of inherent instability directly attributable to the lack of hierarchy.

  **The Switchyard View** argues that increased scale, while presenting new challenges and possibilities, fundamentally opens a *field of potential institutional arrangements* rather than dictating a single path. Scale provides the raw materials (surplus, population, connectivity) but the specific forms of power, freedom, and equality that emerge depend critically on collective imagination, deliberate institutional design, contingent political struggles, coalitional choices, and cultural frameworks. The archaeological and ethnographic record is replete with evidence of large-scale societies exhibiting significant variation in governance (confederacies, rotating offices, assemblies, dual power structures), degrees of hierarchy, and attitudes towards accumulation and equality. Reversals and experiments are not mere footnotes but central data points demonstrating that hierarchy is not the default consequence of scale, but one contingent outcome among others. For the Switchyard View, a genuine anomaly would be evidence demonstrating that *all* documented instances of large-scale complexity *unambiguously* and *necessarily* arose *only* through hierarchical imposition and exploitation, with *no* significant, sustained examples of alternative large-scale socio-political formations appearing across diverse ecological and cultural contexts, especially during periods of initial scaling.

  **Our core disagreements crystallize around several cruxes:**

  1.  **Does the surviving archaeological record inherently underdetermine the Ratchet argument?** The Switchyard View contends the record is systematically biased towards preserving the monumental and centralized, obscuring large-scale non-hierarchical or heterarchical experiments (e.g., large sedentary communities without central storage/redistribution, complex trade networks without elite control, large ritual landscapes built consensually). The Ratchet View argues that while incomplete, the consistent *prevalence* of hierarchical markers (palaces, granaries, elite burials, administrative artifacts) across independently arising complex societies worldwide, especially when scale passes certain thresholds, strongly suggests a pattern exceeding preservation bias. **Testable Case:** Both agree that detailed archaeological investigation of known large-scale, pre-state "anomalies" (like Çatalhöyük, the Trypillia mega-sites, or the Hopewell Interaction Sphere) focusing specifically on evidence for coordination, conflict resolution, resource distribution, and social differentiation could be decisive. The Switchyard View predicts finding robust evidence for non-hierarchical large-scale coordination mechanisms in at least some cases. The Ratchet View predicts finding either subtle hierarchies, evidence of instability/fragmentation linked to coordination failures, or reliance on smaller-scale kin structures that don't scale effectively.

  2.  **Is hierarchy a default, functional consequence of scale?** The Ratchet View sees hierarchy as the most probable, stable solution to the irreducible coordination problems inherent in large, dense populations managing resources, defense, and infrastructure. The Switchyard View sees hierarchy as one possible *response*, often emerging from specific power projects, ideological shifts, or coalitional choices, but not the only viable or stable option; alternatives like confederal structures, council systems, or distributed knowledge networks could potentially achieve coordination without concentrated power. **Testable Case:** Both agree that studying historical moments of dramatic *scaling up* – the formation of early states, confederations, or colonial encounters where societies rapidly integrated – is crucial. The Ratchet View predicts that attempts to maintain non-hierarchical structures during rapid scaling will consistently lead to administrative gridlock, unresolved conflict, or vulnerability to conquest, forcing hierarchical solutions. The Switchyard View predicts finding instances where scaling was achieved through federative, consensual, or rotating-power mechanisms that proved durable for significant periods without collapsing into hierarchy *or* chaos.

  3.  **Are "freedom" and "domination" structural variables or primarily interpretive categories?** The Ratchet View tends to treat degrees of hierarchy/inequality as measurable structural features of a society (e.g., Gini coefficients, centralization indices). The Switchyard View emphasizes that the *experience* of freedom or domination is deeply interpretive, culturally contingent, and context-dependent; formal hierarchy might coexist with significant individual autonomy in some spheres, while apparent egalitarianism might mask subtle coercions. **Testable Case:** Both agree that comparative analysis of ethnohistorical records and indigenous narratives describing the *lived experience* of power and autonomy within societies of comparable scale but different formal structures (e.g., a centralized kingdom vs. a large-scale confederacy) could be illuminating. The Ratchet View predicts that despite cultural interpretations, societies with higher structural centralization will show stronger evidence of systematic constraint on individual/group agency across multiple domains. The Switchyard View predicts finding societies with significant formal hierarchy where people narrate high degrees of everyday freedom, and conversely, seemingly egalitarian structures where people experience pervasive domination through non-formal means.

  Our goal here is not synthesis for its own sake, but clarity. We both seek to explain the human past. The Ratchet View emphasizes the weight of accumulated scale and the functional pressures it exerts. The Switchyard View emphasizes the space for institutional creativity and political choice within those constraints. The remaining task is to sharpen the points where evidence can adjudicate between the probability of the ratchet and the possibility of the switchyard.

  Sincerely,

  The Adversarial Collaborators
