  Okay, the user is convening a graduate reading group on immoral art and needs a robust set of desiderata for theories about how moral qualities relate to artistic value. They want clear criteria that avoid presupposing separation or collapse of ethical/aesthetic domains, while handling nuanced distinctions like artist-vs-artifact or depiction-vs-endorsement.  

  First, I need to parse their core challenge: they’re transitioning from debating positions to defining what makes any theory *adequate*. Their test cases (e.g., the humiliation-driven composition, the morally repugnant novel) reveal key pressure points: causal vs. constitutive moral defects, inseparable ethical-aesthetic entanglement, and betrayals that generate literary value.  

  The user’s emphasis on distinctions is crucial. They want desiderata that force theories to differentiate:  
  - Artist’s intent vs. artwork’s moral properties (e.g., the composer’s cruelty being irrelevant if inaudible)  
  - Depiction vs. endorsement (the novel’s relish of humiliation)  
  - Incidental vs. constitutive flaws (if the betrayal memoir’s ethical reckoning *is* its aesthetic merit)  
  - Pro tanto vs. overall value (a morally repellent but transformative work)  

  I’ll structure desiderata around these tensions, marking non-negotiables (e.g., artist-artifact distinction, depiction-endorsement gap) as foundational. For contentious pairs—like requiring moral defects to sometimes count against artistic value *and* sometimes not—I’ll flag incompatibility risks. The memoir case, for instance, demands a desideratum where ethical defects *enhance* artistic value, directly opposing simple moralism.  

  Scoring established views against these will show autonomism failing non-negotiables by rejecting artist-artifact links, while moralism struggles with cases where immorality *aids* aesthetic success. Interactionism might survive best by accommodating bidirectional influence.  

  The user’s hidden need? Likely a framework exposing where theories *must* take a stand—forcing their group beyond “compare positions” into meta-theoretical rigor. I’ll foreground desiderata that exclude candidates (e.g., one denying the depiction-endorsement distinction collapses most views) and note which requirements are battlefield lines (e.g., pro tanto defeasibility).  

  Final output: a numbered desiderata list with motivations, non-negotiable tags, tension flags, plus a concise view-scoring table. The test cases will anchor each requirement—no abstractions without concrete stakes.
answer: |-
  Here is a rigorous set of desiderata for a theory of immoral art, derived from your cases and core distinctions, with motivations, classifications, and noted tensions:

  **Core Desiderata for an Adequate Theory of Immoral Art**

  1.  **Distinguish Artist from Artifact (Non-Negotiable):** The theory must separate the moral character or intentions of the artist from the moral properties *of the work itself*.
      *   **Motivation:** The Humiliating Composer case. The composer's cruel *intent* (to humiliate) is the *cause* of the work but is *inaudible* in the music. Judging the *artwork* morally flawed based solely on the artist's bad motive seems unjustified; the flaw isn't in the aesthetic object.
      *   **Distinction Preserved:** Artist's moral standing vs. Work's moral qualities.

  2.  **Distinguish Depiction from Endorsement/Invitation (Non-Negotiable):** The theory must differentiate between a work *depicting* something morally problematic and the work *endorsing*, *inviting participation in*, or *taking a stance* towards that problematic thing.
      *   **Motivation:** The Repugnant Novel case (and countless real examples like *Lolita*). Depicting humiliation isn't automatically flawed; the flaw arises when the narrative voice, structure, or style *invites the reader to relish* it. Merely depicting immorality is not sufficient for an ethical defect *in the work*.
      *   **Distinction Preserved:** What is shown vs. How it's framed/narrated/invited.

  3.  **Account for Constitutive vs. Incidental Moral Properties (Non-Negotiable):** The theory must explain when a moral defect/merit is *incidental* to the work's artistic success or failure and when it is *constitutive* (partly makes the work what it is artistically).
      *   **Motivation:** Contrast the Humiliating Composer (cruelty incidental - not in the music) with the Repugnant Novel (invitation to relish humiliation *is* central to its aesthetic power/effect). Also, the Betrayal Memoir: the ethical reckoning *is constitutive* of its literary value.
      *   **Distinction Preserved:** Moral property as external cause vs. internal element of artistic value.

  4.  **Explain Pro Tanto Interaction (Non-Negotiable):** The theory must specify *if* and *how* a moral defect can count as an *artistic flaw* (pro tanto) and/or a moral merit can count as an *artistic merit* (pro tanto), regardless of the work's overall value.
      *   **Motivation:** Requires the theory to go beyond simple separation (autonomism) or collapse (crude moralism/immoralism). It must handle cases where a moral flaw seems to *mar* the experience (pro tanto flaw) even if the work is overall good, or a moral strength seems to *enhance* it (pro tanto merit), even if the work fails overall. The Repugnant Novel's flaw seems pro tanto artistic; the Memoir's ethical merit seems pro tanto artistic.
      *   **Distinction Preserved:** Pro tanto artistic value vs. Overall artistic value; Moral value as potentially relevant to artistic value.

  5.  **Explain Overall Value Asymmetry/Obliquity (Non-Negotiable):** The theory must account for why a work can be *overall artistically valuable despite moral defects* and *overall artistically flawed despite moral merits*, and how moral properties contribute (or fail to contribute) to *overall* artistic value.
      *   **Motivation:** The "Moral but Inert" and "Immoral but Transformative" cases. A work preaching kindness might be boring art; a work with a repugnant vision might be aesthetically revolutionary. Overall artistic value isn't simply the sum of pro tanto factors; moral properties might be outweighed, irrelevant, or integrated in complex ways.
      *   **Distinction Preserved:** Moral value vs. Overall artistic value.

  6.  **Distinguish Ethical Value from Cognitive/Emotional Value (Non-Negotiable):** The theory must acknowledge that a work's moral perspective (its ethical value) is distinct from its capacity to provide insight (cognitive value) or evoke complex responses (emotional value), even if these often interact.
      *   **Motivation:** The Repugnant Novel might offer profound cognitive insights into cruelty while being ethically flawed in its invitation. The Memoir might have high cognitive/emotional value *through* its ethical reckoning. A theory shouldn't reduce moral value to cognitive or emotional impact.
      *   **Distinction Preserved:** Ethical value vs. Cognitive/Emotional value (as aspects of artistic value).

  7.  **Avoid Domain Collapse (Non-Negotiable):** The theory must not reduce artistic value entirely to moral value, nor moral value entirely to artistic value.
      *   **Motivation:** The core requirement to avoid presupposing separation *or* collapse. The "Moral but Inert" and "Immoral but Transformative" cases directly challenge collapse. Artistic value involves formal, sensory, expressive, cognitive, *and* potentially ethical dimensions.

  8.  **Specify Conditions for Moral-Artistic Relevance (Conditional - Camp Specific):** *If* the theory holds that moral properties *can* affect artistic value, it must specify *the conditions* under which a moral defect counts as an artistic flaw and/or a moral merit counts as an artistic merit (e.g., only when constitutive, only when affecting response, only when related to understanding, etc.).
      *   **Motivation:** Needed to move beyond vague claims of "relevance." Different theories (e.g., cognitive ethicists vs. affective ethicists) will fill this differently. The Repugnant Novel and Betrayal Memoir demand *some* specification.
      *   **Classification:** How this is specified defines different "camps."

  9.  **Account for Audience Response (Conditional - Camp Specific):** *If* the theory holds that audience response is central to artistic value, it must explain how moral properties affect *appropriate* or *valuable* responses (e.g., admiration, understanding, pleasure, discomfort).
      *   **Motivation:** Ethicists/Immoralists often focus on how moral flaws/merits corrupt/enhance the audience's engagement. The Repugnant Novel's invitation targets response; the Transformative work might elicit a valuable response *despite* moral repugnance. Autonomists may downplay this.
      *   **Classification:** Central to many interactionist/ethicist/immoralist views; less so for formalist autonomism.

  **Tensions Between Desiderata:**

  *   **Tension 1: Pro Tanto Interaction (4) vs. Overall Asymmetry (5) vs. Avoid Collapse (7):** Reconciling that moral properties *can* count pro tanto for/against artistic value (4), that they *don't* always determine overall value (5), and that artistic value isn't *just* moral value (7) is the core challenge. Theories must navigate this tightrope without falling into collapse or separation. *All non-negotiable desiderata force this tension.*
  *   **Tension 2: Constitutive Properties (3) vs. Response (9):** Is the artistic impact of a moral flaw/merit primarily *in* the work's structure/invitation (constitutive) or *in* the audience's reaction? A strong constitutive view (e.g., flaw is *in* the invitation) might downplay variable responses, while a strong response view might struggle with the objectivity of the flaw/merit located in the work. (Repugnant Novel case pressures both).

  **Scoring Major Views Against Core Desiderata (Non-Negotiables 1-7):**

  | View              | Artist/Artifact (1) | Depict/Endorse (2) | Constitutive/Incidental (3) | Pro Tanto (4) | Overall Asymmetry (5) | Eth/Cog-Emot (6) | Avoid Collapse (7) | Survival? |
  | :---------------- | :------------------ | :----------------- | :-------------------------- | :------------ | :-------------------- | :--------------- | :----------------- | :-------- |
  | **Radical Autonomism** | ✅                  | ❌ (Often ignores) | ❌ (Moral irrelevant)        | ❌ (No effect) | ✅ (But trivially)     | ❌ (Collapses?)  | ✅ (Art separate)   | **FAIL**  |
  | **Moderate Autonomism** | ✅                  | ✅                  | ✅                           | ❌ (No effect) | ✅                     | ✅                | ✅                  | **FAIL** (Fails 4) |
  | **Radical Moralism** | ⚠️ (May conflate) | ⚠️ (May misread)   | ⚠️ (May misidentify)         | ✅ (Always -) | ❌ (Always overall -)  | ❌ (Conflates)   | ❌ (Collapses)      | **FAIL**  |
  | **Moderate Ethicism** | ✅                  | ✅                  | ✅                           | ✅ (Can -)    | ✅                     | ✅                | ✅                  | **PASS**  |
  | **Radical Immoralism** | ⚠️ (May conflate) | ⚠️ (May misread)   | ⚠️ (May misidentify)         | ✅ (Always +) | ❌ (Always overall +)  | ❌ (Conflates)   | ❌ (Collapses)      | **FAIL**  |
  | **Moderate Immoralism** | ✅                  | ✅                  | ✅                           | ✅ (Can +)    | ✅                     | ✅                | ✅                  | **PASS**  |
  | **Interactionism** | ✅                  | ✅                  | ✅                           | ✅ (Can +/-)  | ✅                     | ✅                | ✅                  | **PASS**  |

  **Key:**

  *   ✅ = Satisfies reasonably well
  *   ⚠️ = Satisfies inconsistently or with caveats
  *   ❌ = Fails core requirement
  *   **PASS/FAIL:** Based on satisfying all 7 non-negotiables.

  **Analysis:**

  *   **Most Excluding Desiderata:** **Pro Tanto Interaction (4)** is the primary killer, eliminating all forms of Autonomism (which deny any effect) and radical Moralism/Immoralism (which mandate *only* negative/positive effects). **Avoid Collapse (7)** eliminates radical Moralism/Immoralism. **Distinguish Depiction/Endorsement (2)** challenges simplistic readings common in popular discourse and some radical views.
  *   **Surviving Views:** Only **Moderate Ethicism** (moral merits *can* be artistic merits, defects *can* be flaws), **Moderate Immoralism** (moral defects *can* be artistic merits, sometimes), and broad **Interactionism** (moral properties can interact with artistic value in complex ways, potentially positive, negative, or neutral) satisfy all non-negotiable desiderata. They differ primarily on how they fulfill desiderata 8 (Conditions for Relevance) and 9 (Role of Response), defining their specific "camps."
  *   **The Central Battlefield:** The core debate among surviving views revolves around **Desideratum 8 (Specify Conditions)**. *When exactly* does a moral property become artistically relevant, and *in which direction* (positive or negative)? Does it depend on cognitive insight, affective response, structural integration, or something else? Your test cases (especially the Repugnant Novel and the Betrayal Memoir) are precisely the battlegrounds for answering this.

  This framework provides the necessary rigor to move beyond comparing positions to evaluating the adequacy of the theories themselves based on their ability to handle fundamental distinctions and challenging cases. The non-negotiables establish a high bar, forcing theories to be nuanced and avoiding simplistic separations or collapses, while the conditional desiderata highlight the key differences between the surviving moderate/interactionist approaches.
