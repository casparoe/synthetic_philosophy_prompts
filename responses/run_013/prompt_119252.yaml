answer: |-
  Here's the exam question, model answer, and marking scheme designed to push students beyond rote learning and into analytical argumentation with data:

  ---

  **FINAL EXAM: PRAGMATICS SEMINAR**
  **SECTION B: LONG ESSAY (60 minutes)**

  **QUESTION 4: GRICEAN ANALYSIS OF TUVIK**

  The Tuvik language (verb-final) features an optional verbal suffix *-tle*. Consider the following data and properties derived from consultation with a native speaker:

  1.  **Mara pano karessa.** = "Mara baked the bread." (Plain assertion)
  2.  **Mara pano karessa-tle.** = Same truth conditions as (1), but the speaker signals she isn't vouching for it from her own knowledge; she's passing it on. (The "hedge")
  3.  **Mara pano karessa-tle-nu.** = "Mara didn't bake the bread." (The hedge survives negation)
  4.  **If Mara pano karessa-tle...** (The hedge survives in the antecedent of a conditional)
  5.  **Cancellation:** Utterance: *Mara pano karessa-tle, and I watched her do it myself.* → Speakers find it odd but not contradictory.
  6.  **Detachability:** *Mara pano vursa-tle.* (Using near-synonym *vursa* for *karessa*) → The hedge disappears; *Mara pano vursa* is a plain assertion. The hedge travels with *-tle*, not the proposition.
  7.  **Truth Conditions:** There is no situation where (1) is true and (2) false, or vice versa. The hedge does not affect truth conditions.
  8.  **Wrinkle:** A speaker who *did* watch Mara bake, and knows it perfectly well, can still utter (2). This reads as a put-on, a joke, pretending to be reporting.

  **Analyze the pragmatic status of the "hedge" meaning associated with *-tle* within a Gricean framework. Address the following points:**

  a)  **Classification (Said vs. Implicated):** Is the hedge part of what is *said* (Grice's sense) or is it *implicated*? Justify your answer for the hedge in relation to **each specific data point (1-8)**. Does this data present a consistent picture? (8 marks)
  b)  **Gricean Tests & Theoretical Challenge:** The standard tests for conventional implicature (CI) vs. conversational implicature (CPI) seem to give conflicting results here. Identify how projection (3,4), detachability (6), and cancellability (5) pull in different directions. Is this conflict a fundamental problem for Grice's distinction between CI and CPI, or does it reveal a limitation in how these tests are often simplistically applied? Can the hedge be satisfactorily derived *only* via flouting a maxim (e.g., Quantity: why use the marked *-tle* form if not to signal non-vouching?), or is another analysis required? (7 marks)
  c)  **The Crux (Data Point 8):** What does the possibility described in (8) – a knowledgeable speaker using the hedge – reveal about whether the hedge reflects the speaker's *actual* epistemic state (belief/knowledge) or something else? What does this imply about whether the hedge is a matter of *sentence meaning* or *speaker meaning*? How does this challenge or refine a purely Gricean analysis? (5 marks)

  *(Total: 20 marks)*

  ---

  **MODEL ANSWER (Approx. 600 words)**

  The hedge meaning associated with Tuvik's *-tle* suffix presents a complex challenge to Grice's neat dichotomy between what is said and what is implicated, and between conventional and conversational implicature. Analysis of the data points reveals it is best understood as a **conventional implicature (CI)**, though its behavior highlights nuances sometimes overlooked in applying Grice's tests.

  **a) Classification & Data Analysis:**
  *   **(1) & (7):** The core proposition "Mara baked the bread" is what is *said*. (7) confirms the hedge doesn't affect truth conditions, excluding it from what is said.
  *   **(2):** The hedge ("not vouching") is not part of what is said (truth-conditional content), but a distinct, conventional component added by *-tle*. It is an aspect of utterance meaning conventionally attached to the form.
  *   **(3) & (4):** The hedge projects out of negation and conditionals. This strong projection behavior is highly characteristic of CI (like "but" or "therefore") and atypical of conversational implicature (CPI), which usually disappears or alters under embedding. This strongly suggests CI status.
  *   **(5):** The hedge is *cancellable* ("...and I saw it myself"), though oddly. Cancellability is the hallmark of CPI, not CI (which are normally non-cancellable without contradiction). This *is* inconsistent with the CI diagnosis suggested by (3),(4),(6),(7). The oddness likely stems from the clash between the CI (non-vouching) and the cancellation assertion (direct knowledge), making it pragmatically infelicitous but not semantically contradictory.
  *   **(6):** The hedge is *detachable*. Swapping the verb removes *-tle* and removes the hedge, while the proposition remains similar. Detachability is characteristic of CI (tied to specific lexical items) and generally not found with CPI (tied to propositional content and context). This strongly points to CI.
  *   **(8):** This is crucial. A knowledgeable speaker *can* use (2), creating a jocular effect. This shows the hedge does *not* necessarily encode the speaker's *actual* lack of knowledge/vouching. Instead, it conventionally encodes a *presentational stance*: the speaker is *presenting* the information *as if* it were hearsay/unvouched, regardless of their actual knowledge. This "pretend" use is possible because the meaning is conventionalized in the language, not derived anew from context and maxims each time.

  The data is largely consistent *except* for cancellability (5), which conflicts with the CI pattern established by projection (3,4), detachability (6), and non-truth-conditionality (7).

  **b) Tests, Theory, and Derivation:**
  The conflict is real: projection and detachability scream CI, while cancellability whispers CPI. This isn't a fatal flaw in Grice's core distinction, but it **reveals limitations in how the tests are rigidly applied.** Cancellability is very reliable for CPI, but its application to CI is messier. While prototypical CIs (like "but") resist cancellation without contradiction, the odd-but-not-contradictory cancellation here suggests *-tle*'s CI is perhaps weaker or interacts differently with assertion. It highlights that CIs exist on a spectrum.

  Deriving the hedge *solely* via flouting Quantity ("Why say *-tle* unless you mean you aren't vouching?") is **insufficient**. While the markedness of *-tle* might *reinforce* the meaning pragmatically, the core meaning is demonstrably conventional: it's detachable, persistent under embedding, and crucially, *not* reliably calculable from context alone (as shown by its absence without *-tle* in (6)). Flouting might explain why *-tle* is *used* in a context where the speaker *is* knowledgeable (as in (8)), creating irony, but it cannot explain the consistent, obligatory meaning the suffix carries whenever it *is* used. The meaning is linguistically encoded, not conversationally generated.

  **c) The Crux: Meaning Beyond Epistemic State**
  Data point (8) is decisive. It shows the hedge is **not** a direct reflection of the speaker's epistemic state (belief/knowledge). A speaker can know P perfectly well and still felicitously (if ironically) attach *-tle* to assert P. Therefore, the hedge cannot be part of the speaker's meaning *about the world* (the belief in P). Instead, it is a matter of **sentence meaning** – specifically, a conventional, non-truth-conditional aspect of the utterance's conventional meaning. It encodes a specific *mode of presentation*: presenting the proposition as reportative/unvouched. This challenges a simplistic Gricean view where "speaker meaning" encompasses only propositional attitudes towards the world. *-tle* demonstrates that languages can conventionally encode elements of presentational or expressive meaning (akin to Potts' expressives) that operate semi-independently of the speaker's genuine epistemic state but are still part of the conventional package conveyed by the utterance. The Gricean framework needs refinement to fully accommodate such conventionalized expressive or presentational devices.

  ---

  **MARKING SCHEME (20 marks total)**

  **Must-Hit Points (4 marks each):**

  1.  **Accurate Classification & Data Justification:** Correctly identifies the hedge as *not* part of what is said (citing 1,7) and argues for CI status based primarily on projection (3,4) and detachability (6), while acknowledging the challenge of cancellability (5). *A/B Separation:* A: Nuanced handling of cancellability's oddness vs. non-contradiction; clear link of each data point to classification. B: Correct basic classification but weaker justification, may miss nuance of (5) or underplay projection/detachability. *Common Mistake:* Claiming it's part of what is said (ignoring 7) or misapplying projection tests (e.g., saying CPI *can* project like this).
  2.  **Analysis of Test Conflict & Theoretical Implications:** Correctly identifies the conflict (Projection/Detachability -> CI vs. Cancellability -> CPI) and argues this highlights limitations in rigid test application rather than invalidating Grice's core CI/CPI distinction. Explicitly rejects the sufficiency of deriving the hedge *only* via flouting Quantity. *A/B Separation:* A: Insightful discussion on the spectrum of CI behavior and why flouting derivation fails (detachability, conventional core). B: Identifies conflict and prefers CI, but weaker argument against flouting derivation or less developed discussion of test limitations. *Common Mistake:* Declaring Grice "wrong" due to the conflict; claiming flouting is the primary mechanism (ignoring detachability/conventionality).
  3.  **Interpretation of Data Point (8):** Correctly identifies that (8) shows the hedge does *not* reflect the speaker's actual epistemic state (knowledge/belief). *A/B Separation:* A: Clearly links this to the hedge being a conventional *presentational stance* ("presenting as if unvouched") rather than a belief report. Connects it to sentence meaning. B: Recognizes it shows speaker knowledge ≠ hedge meaning but less clear on *what* it *does* represent. *Common Mistake:* Conflating the hedge meaning with the speaker's actual belief state; misdiagnosing it as purely ironic speaker meaning.
  4.  **Sentence Meaning vs. Speaker Meaning:** Based on (8) and the conventional behavior (detachability, projection), argues convincingly that the hedge is a matter of **sentence meaning** (specifically, conventional implicature/expressive meaning), not part of the speaker's meaning about the world (belief in P). *A/B Separation:* A: Explicitly contrasts the hedge (sentence-encoded presentation) with the speaker's actual belief/knowledge (speaker meaning about the world), possibly referencing expressive meaning. B: States it's sentence meaning but with less developed contrast to speaker meaning/propositional attitude. *Common Mistake:* Claiming (8) shows it *is* speaker meaning (ignoring conventional basis/detachability).
  5.  **Overall Coherence & Argumentation:** Essay is well-structured, logically progresses through (a), (b), (c), uses data effectively as evidence, terminology is precise (said, implicated, CI, CPI, entailment, projection, detachability, cancellability, speaker meaning, sentence meaning), and presents a clear, supported conclusion about the status of the hedge. *A/B Separation:* A: Seamless integration of points, sophisticated synthesis, exceptional clarity. B: Clear structure and argument, minor lapses in flow or terminology. *Common Mistake:* Disjointed analysis, treating data points in isolation; vague or incorrect use of technical terms.

  **Grade Boundaries (Guide):**
  *   **A (17-20):** Hits all 5 points strongly. Nuanced handling of conflicts (cancellability, (8)). Sophisticated argumentation, precise terminology, clear structure. Demonstrates deep understanding beyond rote learning.
  *   **B (13-16):** Hits core points (1-4) but perhaps less depth/nuance on conflicts or (8). Solid classification and argument against flouting derivation. Clear structure, good terminology. Shows good understanding but less originality/synthesis.
  *   **C (9-12):** Addresses most points but with significant weaknesses (e.g., misclassifies based on one test, weak on (8), doesn't effectively counter flouting derivation). Some errors in terminology or structure. Superficial understanding.
  *   **D (5-8):** Significant misunderstandings (e.g., calls it entailment, CPI, or part of what is said). Fails to engage with key data (esp. 6,8) or test conflicts. Poor structure/terminology.
  *   **F (0-4):** Lacks coherence, gross misunderstandings, minimal engagement with data/query.
