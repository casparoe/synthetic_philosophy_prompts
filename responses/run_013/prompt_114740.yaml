prompt: |-
  My two housemates have been going at each other all week about something a friend of ours did — she signed up for one of those paid memory studies, a couple of hours of button-pressing for cash. What nobody told her (no one lied, it just never came up) is that the data gets sold on to a marketing firm afterwards. She'd been up about thirty hours finishing her disseration and she was completely skint, and the money was the only reason she was there at all. She now says she'd never have agreed if she'd known, and that they never really got her consent.

  Sam says consent is always consent to a description — you say yes to some particular account of what's going to happen, and if what actually happens is something else then you didn't consent to it, full stop. Silence does the same work a lie would do, so it makes no difference that nobody said anything false.

  Alex says that can't be the standard, or no one ever consents to anything, since nobody knows every downstream use of what they hand over. Alex says the real question is what she had a right to know, and that's fixed by the norms of the practice rather than by consent itself. Alex also points out she'd probably have signed anyway, since she was there for the money — so on any but-for test the omission didn't do any work at all.

  Sam says that test is horrible, because it makes consent hinge on how desperate you are: the more you need the money, the less anything you weren't told can count. And anyway, forget the information — she was broke, this was the only offer she had that week, and a yes squeezed out of someone with no decent alternative isn't consent, it's just the least bad option. Alex says an offer with bad alternatives is still an offer, and if that counts as coercion then so does every wage, and the word stops meaning anything. Sam says that's exactly the work the word should be doing — it's pointing at the background that made the choice unfree.

  Then there's the sleep thing. Alex says being knackered isn't incompetence: capacity is task-specific, and she understood 'we will sell your data' perfectly well. Sam says you can understand a sentence and still not be in any state to consent to it.

  Neither of them will budge and I'm sick of being asked to referee. Can you go through it move by move and say who's right at each step, and what both of them are missing? Point by point, please, not just an overall verdict.
reasoning: |-
  Okay, the user presents a complex ethical debate between two housemates, Sam and Alex, regarding consent in a situation where their friend participated in a paid memory study without knowing her data would be sold to a marketing firm. The friend was sleep-deprived and financially desperate. The user wants a point-by-point analysis of each argument, identifying who's right at each step and what both are missing.

  First, I need to unpack the core disagreement. Sam argues consent requires full transparency – any undisclosed element invalidates consent, comparing silence to lying. Alex counters that demanding complete knowledge of downstream uses is unrealistic and that norms of practice should define what needs disclosure. They also argue financial desperation doesn't negate consent, comparing it to standard wage labor.

  On the consent-as-description point (Sam's first move), Sam is technically correct about consent being specific to disclosed terms, supported by concepts like informational consent in medical ethics. But Alex rightly points out practical limitations – we rarely know all future uses of our data. Sam misses that consent can be valid within reasonable expectations, while Alex underestimates how material this particular omission (data sale) was to the friend's values.

  Regarding the but-for test about financial desperation, Alex's point that she might have consented anyway is legally plausible but ethically dangerous – it ignores how vulnerability affects decision quality. Sam correctly identifies this as exploitative but oversimplifies by equating all wage labor with coercion. Both miss nuances: Alex ignores power imbalances, while Sam doesn't acknowledge that consent can exist in constrained choices if properly informed.

  On sleep deprivation, Alex is right that competence is task-specific, but Sam correctly notes that extreme fatigue impairs judgment even for comprehensible terms. Neither considers that capacity exists on a spectrum – the real question is whether her fatigue reached a threshold that invalidated meaningful consent.

  Throughout, both overlook context: the friend was in a uniquely vulnerable state (30 hours awake + broke), making this different from routine transactions. They also miss how data sale specifically violates autonomy in research contexts, where participants expect ethical boundaries. The solution lies in balancing reasonable disclosure standards with situational vulnerabilities – requiring clear terms for high-impact items like data sale, especially with at-risk participants.
answer: |-
  Here's a point-by-point breakdown of Sam and Alex's arguments, evaluating each move and identifying what each might be missing:

  ### 1. **The Nature of Consent (Description vs. Reasonable Expectation)**
      * **Sam's Move:** Consent is specific to a description. Silence about material facts (like data sale) functions like a lie and invalidates consent.
      * **Alex's Move:** Requiring knowledge of *every* downstream use is impossible. What matters is what she had a "right to know" based on norms of the practice.
      * **Who's More Right?** **Sam wins this point on core principle, but Alex highlights a practical limitation.**
          * **Why Sam is Stronger:** Ethically and legally, valid consent requires disclosure of material information that a reasonable person would want to know to make an informed decision. Selling data to a marketing firm is highly relevant to autonomy and privacy. Omitting it prevents genuine agreement to the *actual* transaction. Consent *is* agreement to a specific set of actions/terms; changing those terms invalidates it.
          * **What Sam Misses:** While the *principle* is sound, Alex is right that "complete description" is impossible (e.g., the marketing firm might use the data in 50 ways). The standard *is* "material information" or "reasonable expectations" based on context/norms.
          * **What Alex Misses:** Dismissing the omission because "nobody knows every downstream use" ignores the *specificity* and *materiality* of this omission. Selling data directly to marketers is a significant, foreseeable, and common use case that fundamentally alters the nature of participation (research vs. commercial exploitation). Norms in research *increasingly* demand transparency about data sharing/sale. This wasn't a trivial downstream detail; it was a core consequence.

  ### 2. **The "But-For" Test (Financial Desperation & Omission's Impact)**
      * **Alex's Move:** She likely would have signed anyway for the money, so the omission didn't cause harm (no "but-for" causation).
      * **Sam's Move:** Making consent hinge on desperation is horrible. A "yes" under duress with no alternatives isn't true consent.
      * **Who's More Right?** **Sam wins decisively on the ethical principle, though Alex raises a pragmatic (but dangerous) point.**
          * **Why Sam is Stronger:** Consent is about voluntariness and information *in the moment*. Judging validity based on a hypothetical "what if she knew?" scenario *after the fact* is flawed. It turns consent into a mere formality if the outcome would be the same regardless. Desperation *does* undermine voluntariness, and combining it with lack of information compounds the problem. The core issue is whether she agreed to the *actual deal*, not whether she would have agreed *if* she knew.
          * **What Alex Misses:** The "but-for" test is fundamentally inappropriate for consent. Consent isn't just about the outcome (getting money); it's about the *process* of autonomous decision-making. Applying this test excuses deception/omission against vulnerable people ("they needed it anyway"). It ignores her right to make an *informed* choice, even if the choice would have been the same.
      * **What Sam Misses:** While a *major* factor, financial desperation alone doesn't *automatically* invalidate consent (people legitimately work for money). Its *interaction* with the lack of alternatives and the material omission is key.

  ### 3. **Coercion, Alternatives, and Wages**
      * **Sam's Move:** Having no decent alternative makes the "choice" coerced and unfree.
      * **Alex's Move:** Calling this coercion cheapens the term; every wage job involves accepting an offer because you need money.
      * **Who's More Right?** **It's nuanced, but Alex wins on definition, while Sam points to a real vulnerability.**
          * **Why Alex is Stronger (on definition):** Legally and philosophically, coercion typically requires an *illegitimate threat* that removes a reasonable alternative (e.g., "sign this or I break your leg"). Merely having bad options (e.g., needing money, only one job offer) is generally considered *duress* or *pressure*, not coercion. Calling all wage labor coercive stretches the term beyond useful meaning.
          * **What Alex Misses:** While not coercion in the strict sense, the *combination* of extreme vulnerability (sleep-deprived, broke, no alternatives) *and* a material omission creates a situation ripe for exploitation. The lack of power imbalance is severe. Sam is right to highlight this as making the choice "unfree" in a substantive sense, even if "coercion" isn't the perfect word.
          * **What Sam Misses:** Conflating all constrained choices with a lack of consent/coercion is too broad. People constantly make hard choices between bad options; this doesn't always negate consent. The *material omission* is the primary invalidation factor here, amplified by the vulnerability.

  ### 4. **Sleep Deprivation and Capacity**
      * **Alex's Move:** Capacity is task-specific. She understood the sentence "we will sell your data," so she had capacity to consent to that.
      * **Sam's Move:** You can understand words but still lack the overall cognitive/emotional state to give meaningful consent.
      * **Who's More Right?** **Sam wins on the core vulnerability, Alex on the specific comprehension point.**
          * **Why Sam is Stronger (Overall):** 30 hours awake creates significant impairment in judgment, risk assessment, focus, and emotional regulation. Even if she technically understood the *words*, her ability to weigh the *significance* of data sale, consider alternatives, or resist pressure was likely severely compromised. Capacity isn't *just* about comprehension; it's about appreciation, reasoning, and communicating a choice under the circumstances.
          * **What Alex Misses:** Understanding a sentence is the *minimum* requirement. True capacity requires the ability to *use* that understanding to make a rational decision. Severe sleep deprivation demonstrably impairs executive function and decision-making beyond basic comprehension.
          * **What Sam Misses:** Alex is technically correct that capacity *is* assessed relative to the specific decision. Understanding a clear statement like "we sell your data" is a key part of capacity *for that specific term*. However, the *overall* impaired state makes the *entire* consent process questionable, including her ability to focus on or question the terms.

  ## Overall Verdict Summary (Point-by-Point)

  1.  **Consent as Description vs. Norms:** **Sam** is ethically stronger on the principle that material omissions invalidate consent. **Alex** correctly identifies the impracticality of total knowledge but downplays the materiality of *this specific* omission.
  2.  **But-For Test & Desperation:** **Sam** is ethically correct; judging consent validity based on a hypothetical "would she have signed anyway?" undermines the concept. **Alex's** point is pragmatically cold and dangerous for vulnerable individuals.
  3.  **Coercion vs. Duress:** **Alex** is technically correct that this isn't strict coercion, but **Sam** rightly highlights the severe vulnerability and power imbalance that, combined with the omission, makes the consent highly suspect.
  4.  **Sleep Deprivation & Capacity:** **Sam** is stronger overall; severe sleep deprivation likely impaired her decision-making capacity beyond just basic comprehension. **Alex** is right that understanding the specific sentence is a component, but it's insufficient.

  ## What Both Are Missing Collectively

  *   **The Specific Vulnerability Intersection:** They argue the factors (omission, desperation, no alternatives, sleep) somewhat separately. The *combination* of all these factors – being broke, exhausted, with no other options, *and* being denied key information – creates a uniquely exploitative situation far worse than any single factor. The whole is greater than the sum of its parts.
  *   **Context of Research Participation:** They don't deeply engage with the norms and ethics *specific to human subjects research*. Even paid studies carry an expectation of ethical treatment and transparency. Selling data to marketers often violates the spirit of research participation and established ethical guidelines (like informed consent requirements in IRB protocols), regardless of "norms" in shady commercial practices.
  *   **Focus on Blame vs. Harm:** The debate centers on whether consent *was* valid. Less discussed is the tangible harm to the friend: a violation of her autonomy and privacy based on information she explicitly states she would have wanted and which was withheld. The focus on the technical validity of consent sometimes overshadows the real-world impact of the deception-by-omission on the individual.

  Sam consistently champions the importance of information, autonomy, and the impact of vulnerability on true consent. Alex consistently emphasizes practical realities, definitions, and the need for standards that aren't impossibly high. Sam's view better protects individuals from exploitation in vulnerable states, while Alex's view risks normalizing harmful practices through overly pragmatic or narrow definitions. In this specific case, given the material omission and the extreme vulnerability, Sam's position is ethically more robust.
