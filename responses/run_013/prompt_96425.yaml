answer: |-
  ## Dissertation Chapter Prospectus: The Unit of Accounting in the Separateness-of-Persons Objection

  **Working Title:** Beyond Aggregation: Commensurability and the Moral Unit in the Separateness-of-Persons Critique

  **1. Precise Question:**
  Does the normative force of the separateness-of-persons objection primarily target the *interpersonal commensurability of welfare units* (the "unit picture"), rather than the *act of aggregating welfare* across persons? Consequently, does this objection:
  (A) Apply equally to *any* moral theory (utilitarian or non-utilitarian) that treats individual claims as inherently commensurable in unit, regardless of the aggregation function (sum, prioritarian, leximin, etc.)?
  (B) Fail to apply to forms of utilitarianism that explicitly reject interpersonal commensurability of welfare units while retaining interpersonal comparability of welfare *levels* (the "level picture") and *some* form of aggregation?

  *Determinate Answer:* The project argues for a qualified "Yes" to both (A) and (B). The objection's core normative bite is against commensurability, not aggregation per se. Aggregation of *non-commensurable* claims (based solely on level comparisons) is normatively distinct.

  **2. Defense of the Open Question (Why Existing Positions Leave it Unresolved):**
  The separateness-of-persons objection is almost universally framed as an objection to *aggregation*. Rawls contrasts utilitarianism's "conflation of persons" with contractarianism's respect for distinct individuals. Nozick emphasizes that utilitarianism violates "side constraints." Scanlon's contractualism explicitly rejects aggregation of losses/gains across persons. Defenders of moderate aggregation (e.g., in prioritarianism, sufficientarianism, or telic egalitarianism) typically accept the *primacy* of the aggregation critique but argue their specific aggregation functions *mitigate* its force (e.g., by weighting the worse off more heavily). Crucially, these discussions presuppose that the *input* to aggregation – individual welfare or claims – is already *commensurable in unit*. The possibility that the objection's core target is this very presupposition of commensurability, and that aggregation *without* commensurability might be permissible (or even that some utilitarianisms might avoid commensurability), remains largely unexplored. The literature focuses on *how* we aggregate, not on the *nature of the claims* being aggregated. This project argues that shift in focus is necessary and revealing.

  **3. Method: A Three-Stage Argumentative Reconstruction (Semester Plan):**

  *   **Stage 1: Conceptual Groundwork & Distillation (Weeks 1-4):**
      *   **Task:** Precisely articulate the "level picture" vs. "unit picture" distinction through philosophical analysis and formal modeling. Re-examine seminal statements of the separateness objection (Rawls, Nozick, Nagel, Scanlon) to isolate the core normative intuition.
      *   **Why not cataloguing?** Cataloguing existing responses assumes the objection is correctly located in aggregation. This stage challenges that assumption by identifying the *constitutive features* of a moral claim implied by the objection. It builds the conceptual tools (level/unit) needed for the novel critique.
      *   **Output:** A refined formal and philosophical account of the distinction, showing how "level" comparability (ordinal or cardinal comparisons of *position*) is conceptually distinct from "unit" commensurability (a common metric for *increments*).

  *   **Stage 2: Testing the Distinction Against Theories (Weeks 5-10):**
      *   **Task:** Apply the level/unit distinction to canonical targets and purported solutions:
          *   *Classical Utilitarianism:* Employs both level and unit commensurability. Vulnerable on *both* traditional aggregation *and* commensurability grounds.
          *   *Prioritarianism:* Aggregates using a concave function. Crucially, it *presupposes* unit commensurability (to apply weights to marginal gains). The project argues the separateness objection bites here *despite* non-sum aggregation precisely because of commensurability.
          *   *Sufficientarianism:* Focuses on meeting thresholds. Thresholds often rely on level comparisons (who is below), but trade-offs *above* or *at* the threshold typically require unit commensurability for justification, making it vulnerable *in those domains*.
          *   *Contractualism (Scanlon):* Explicitly rejects aggregation and unit commensurability. Justification focuses solely on individuals' reasons (level-based claims). The project argues this *successfully* avoids the core of the separateness objection precisely by rejecting commensurability, not just aggregation.
          *   *"Level-Only" Utilitarianism (Hypothetical):* Analyze a utilitarian variant that uses only level comparability (e.g., maximizing the position of the worst-off, akin to maximin or leximin *within* a utilitarian framework). Argue this *avoids* the commensurability-based separateness objection, despite aggregating.
      *   **Why not cataloguing?** This stage doesn't list defenses; it uses the level/unit lens to *re-evaluate* the normative structure of these theories, showing where the separateness objection *actually* gains traction (commensurability) and where it doesn't (aggregation without commensurability). It reveals a new axis of evaluation.

  *   **Stage 3: Implications and Defense (Weeks 11-15):**
      *   **Task:** Synthesize findings. Defend the claim that commensurability, not aggregation, is the primary target. Explore key implications:
          *   Some popular "aggregation-lite" views (prioritarianism) are vulnerable to the objection.
          *   Some utilitarianisms (e.g., focusing purely on minimizing the worst suffering via level comparisons) might be *less* vulnerable than commonly thought.
          *   Clarify the relationship between separateness, incommensurability, and agent-relativity.
      *   **Output:** Draft chapter sections synthesizing the argument and its significance for debates in distributive justice, population ethics, and the foundations of consequentialism vs. deontology.

  **4. Success, Failure, and Verbal Disputes:**

  *   **Positive Result:** Success is demonstrating that the separateness objection *systematically* applies to theories employing the unit picture (regardless of aggregation function) and *systematically fails* to apply (or applies weakly) to theories employing only the level picture (even if they aggregate). This involves showing that:
      *   The normative unease captured by the objection correlates strongly with the presence of unit commensurability.
      *   Defenses of non-utilitarian aggregative views often implicitly rely on unit commensurability.
      *   Level-only aggregation avoids the core conflation-of-persons worry.
  *   **Failure/Collapse:** The project fails if:
      *   The level/unit distinction cannot be made philosophically robust or normatively significant (collapsing into a mere technical point about measurement scales).
      *   Analysis shows the separateness objection *necessarily* and *solely* targets aggregation mechanisms themselves, irrespective of the input's structure.
      *   The distinction proves irrelevant to evaluating existing theories (e.g., if all plausible moral theories *require* unit commensurability, making the distinction moot).
      *   It devolves into a verbal dispute about defining "commensurability" or "aggregation." To avoid this, the distinction must be grounded in clear normative intuitions (e.g., residual duties, the nature of complaint justification) and linked to recognizable positions.

  **5. Honest Scope Assessment:**

  *   **Achievable in One Semester:**
      *   Developing a precise philosophical and formal account of the level/unit distinction.
      *   Successfully applying it to re-analyze the separateness objection in key texts.
      *   Demonstrating its applicability and force against prioritarianism and sufficientarianism.
      *   Articulating the *possibility* and potential defensibility of "level-only" utilitarian aggregation as escaping the core objection.
      *   Drafting a coherent chapter establishing this core argument.
  *   **Too Big for One Semester (Scope Limits):**
      *   **Full Defense of "Level-Only" Utilitarianism:** Arguing that such a view is *plausible* or *superior* is a massive task beyond this chapter. This project only aims to show it *escapes the separateness objection*, not that it is overall correct or workable.
      *   **Comprehensive Survey:** Cannot analyze *every* variant of egalitarianism, contractualism, or utilitarianism. Focus is on paradigmatic examples to establish the pattern.
      *   **Deep Engagement with Metaethics:** The project assumes a cognitivist, realist-friendly framework for moral claims. Fully defending the metaphysical status of "claims" in the level/unit pictures is beyond scope.
      *   **Full Integration with Social Choice:** While using formal tools, a deep dive into the implications for social welfare functionals, Arrow's theorem, or Harsanyi's aggregation theorem is a separate project.
      *   **Historical Exegesis:** The focus is on reconstructing the *logic* of the objection in contemporary debates, not a complete intellectual history.

  **Conclusion:**
  This chapter challenges the standard locus of one of the most potent objections to utilitarianism. By shifting focus from aggregation to the *unit of moral accounting* (level vs. unit commensurability), it offers a novel diagnosis: the separateness-of-persons objection primarily targets the *interpersonal commensurability of welfare units*. This reframing reveals unexpected vulnerabilities in some non-utilitarian views and opens potential defenses for some utilitarian structures. The project delivers a focused conceptual innovation with significant implications for understanding the foundations of distributive ethics and the enduring debate between consequentialist and non-consequentialist approaches.
