prompt: |-
  I teach a cross-listed graduate seminar on the ethics of algorithmic decision-making — half philosophers, half students from the computational social science program — and I am trying to write down my own position on statistical fairness in one place for the first time, as a handout for the seminar and, if it survives, as a short position piece. A colleague's parting shot last Thursday was that my view is coherent only because it has never been written down in one place, and I suspect she may be right. So before I commit anything to paper I want an audit, not a survey of the literature and not a defence of any particular criterion. Here is the position, as compactly as I can state it. (a) *Score calibration within groups*: for each protected group, among those assigned the same risk score, the same fraction should actually have the outcome — the number should mean the same thing for everyone it is assigned to. (b) *Predictive parity for verdicts*: among those the policy approves, the same fraction should genuinely be eligible in each group — a yes should mean the same thing whoever receives it. I have been treating (a) and (b) as two faces of a single commitment, which I have been calling *verdict integrity*. (c) *Equalized odds*: the probability of a false alarm and the probability of a miss should be the same across groups; nobody's group should alter their chance of being wrongly decided. (d) I accept the familiar impossibility — when the groups' base rates differ, no nontrivial rule can have both (b) and (c) — and I have ranked them: a common meaning for verdicts first, matching error rates second. (e) *No fairness without a use*: a fairness claim is a claim about a decision rule together with a loss function, not about a score in the abstract; a score with no specified use is neither fair nor unfair, only accurate or inaccurate. (f) In the domains I work in — policing, credit, allocation of scarce benefits — the outcome variable is usually a proxy for an unjust social arrangement (arrests standing in for offending, past spending standing in for need), so the principled response to an unpalatable trade-off is to change the target rather than to optimize parity criteria against a target that should not be trusted. (g) The metric is not mine to set: where similarity-based or individual notions of fairness are at stake, the similarity metric has to come from the affected community, and my job is to satisfy whatever metric they hand me, not to choose it on their behalf.

  What I want is a consistency audit of this set: which commitments pull against each other, which only look as though they do, and for each genuine conflict what the least costly repair is, with an explicit statement of what that repair costs. Rank the genuine conflicts by severity rather than treating them as equally bad, and do not stop at the pair I have already conceded — I want to know whether the way I have handled it is itself consistent with everything else I have said. I am not asking you to adjudicate which criterion is correct in the abstract, and I am not asking for the state of the debate; I am asking what my own package commits me to and where it cannot be made to hold together.

  Answer with exactly five numbered items and nothing else: no preamble, no closing summary, no reassurance. Each item should name the pair or cluster of commitments by letter, say in one or two sentences what the conflict is and what would have to give, and the items should run from the most serious conflict to the least; if a pair that looks like a conflict turns out not to be one, put it where it belongs in the order and use the item to say why it dissolves rather than contradicting the rest.
reasoning: |-
  Hmm, the user is teaching a graduate seminar on algorithmic ethics and wants to audit their position on statistical fairness before writing it down. They've outlined seven commitments (a through g) and want me to identify internal conflicts in their framework.

  Looking at their position:
  - (a) is about score calibration within groups (same score should mean same risk across groups)
  - (b) is predictive parity for verdicts (yes verdict should mean same eligibility across groups)
  - (c) is equalized odds (same error rates across groups)
  - (d) acknowledges the impossibility between (b) and (c) when base rates differ, prioritizing (b) over (c)
  - (e) ties fairness to decision rules and loss functions
  - (f) critiques outcome variables as proxies for unjust systems
  - (g) argues affected communities should define similarity metrics

  The user specifically wants five numbered conflict analyses without preamble or conclusion, ordered by severity.

  I see several potential tensions:
  1. Between (g) and everything else: If communities define fairness metrics, this could contradict the technical fairness criteria in (a)-(d). (g) might force abandonment of predefined statistical fairness.
  2. Between (f) and (a)/(b): If outcome proxies are untrustworthy, why optimize calibration or predictive parity against them? This creates a circular problem.
  3. Between (d) and (c): By prioritizing (b) over (c), they accept unequal error rates - but (c) demands equal error rates. This is already acknowledged but needs examination.
  4. Between (e) and (a): (a) treats scores as fair/unfair without specified use, but (e) says scores need decision rules. This is resolvable if we interpret (a) as conditional on use.
  5. Between (f) and the framework: The call to change targets rather than optimize fairness might conflict with maintaining (a)/(b) against existing proxies.

  The most severe conflict is (g) versus statistical definitions - if communities reject (a)/(b), the framework collapses. Next is (f) undermining the foundation of (a)/(b). Then the acknowledged (d) conflict. Followed by resolvable tensions with (e), and finally how (f) interacts with the system.

  I'll structure the response as five numbered items exactly as requested, starting with the most critical conflict.
answer: |-
  1. **Conflict between (g) and (a)/(b)/(c)/(d)**: (g) demands that affected communities define the fairness metric, potentially rejecting statistical criteria like calibration (a), predictive parity (b), or equalized odds (c). If they prescribe a metric incompatible with your ranked priorities (d), you must abandon (a)/(b)/(c) to satisfy (g), costing adherence to your core statistical commitments.

  2. **Conflict between (f) and (a)/(b)**: (f) rejects optimizing fairness against flawed proxies (e.g., arrests), but (a) and (b) require calibration and predictive parity *against those same proxies*. Using the proxy to define "actual outcome" in (a) or "genuinely eligible" in (b) contradicts (f)'s call to change the target, forcing either abandonment of (a)/(b) or acceptance of optimizing against unjust proxies.

  3. **Conflict within (d) and (c)**: You prioritize (b) over (c) when base rates differ, accepting unequal error rates. But (c) requires equal false alarm/miss rates unconditionally. This forces you to violate (c) to satisfy (b) under base rate differences—costing strict adherence to equalized odds whenever base rates diverge.

  4. **Apparent conflict between (e) and (a)/(b) dissolves**: (e) states fairness requires a decision rule and loss function, not just a score. (a) and (b) implicitly assume a threshold-based decision (e.g., approval if score > cutoff), aligning with (e). Calibration (a) and predictive parity (b) are properties of scores *under a specific decision rule*, so they cohere with (e) when that rule is specified.

  5. **Friction between (f) and the framework's application**: While not a direct contradiction, (f)'s mandate to change unjust targets undermines the operational relevance of (a)/(b)/(c) in real domains. Applying your fairness criteria requires temporarily accepting a proxy, conflicting with (f)'s principled rejection. This costs coherence in practice unless you explicitly limit (a)/(b)/(c) to post-target-reform contexts.
