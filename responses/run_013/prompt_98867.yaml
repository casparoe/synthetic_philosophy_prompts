prompt: |-
  I am assembling the reading-seminar materials for a graduate course on chaos, predictability, and determinism, and before we evaluate any particular account I want the specification fixed. A colleague has suggested that the productive distinction is not the familiar one between determinism and unpredictability, but between two species of unpredictability: the kind that no predictor could overcome even with unbounded time and computation, and the kind that is merely an artefact of a predictor's finite resources. I want the desiderata for a theory of the relation among determinism, predictability, and chaos drawn up so as to make that distinction precise. State what any adequate account must deliver -- the cases it must get right (a chaotic system that is nonetheless deterministic, an integrable system, an indeterministic system whose statistics are predictable, a deterministic pseudo-random generator), the distinctions it must not collapse (ontic determinism versus epistemic predictability, sensitivity to initial conditions versus mere complexity, unpredictability in principle versus unpredictability under resource bounds), and the established results it must be consistent with. Give me exactly five numbered items, each a sentence or two, with no introduction or conclusion. In each item give the requirement, the case or consideration that motivates it, and your verdict on whether it is non-negotiable or a preference of one camp; let the fifth item say which single requirement does the most to exclude otherwise popular accounts, or, if you judge some pair of requirements to be jointly unsatisfiable, name the pair and explain why.
reasoning: |-
  Hmm, the user is assembling materials for a graduate seminar on chaos, predictability, and determinism. They want to establish clear desiderata for theories that relate these concepts, focusing on distinguishing between two types of unpredictability: fundamental limitations versus resource constraints. 

  The user's colleague proposed shifting focus from the determinism-unpredictability dichotomy to a finer-grained analysis of unpredictability types. This suggests the seminar aims to critically evaluate existing philosophical/scientific accounts. The explicit request for five numbered items without intros/conclusions implies they want concise, actionable criteria for seminar discussions.

  Breaking down the requirements: First, any adequate theory must preserve the possibility of deterministic chaos - like Lorentz systems where perfect determinism coexists with practical unpredictability due to sensitivity. This is non-negotiable; collapsing this distinction would misrepresent core phenomena in chaos theory.

  Second, the account must distinguish integrable systems (predictable long-term) from chaotic ones, while acknowledging both are deterministic. Missing this would conflate dynamical behaviors with different epistemological implications. Non-negotiable for classifying systems accurately.

  Third, theories must handle probabilistic systems like quantum mechanics where statistics remain predictable despite ontological indeterminism. This tests if the framework can separate ontic randomness from epistemic unpredictability. Non-negotiable for breadth.

  Fourth, pseudo-random generators demonstrate that algorithmic complexity can mimic randomness under resource bounds, though fundamentally deterministic. Any theory must explain why predictors fail here without invoking true indeterminism. Non-negotiable for computer science relevance.

  Finally, the most exclusionary requirement is distinguishing unpredictability-in-principle from resource-based unpredictability. Many popular accounts (like some epistemic interpretations of chaos) blur this by attributing all unpredictability to human limitations. This distinction actively challenges such views by demanding separate treatments for chaotic divergence and computational irreducibility.

  The user likely anticipates pushback on the fifth point - hence the option to note joint unsatisfiability if needed. But in practice, theories *can* satisfy both by carefully separating metaphysical and computational constraints. This requirement does heavy lifting by forcing clarity on *why* predictions fail.
answer: |-
  1. **Any account must preserve the distinction between ontological determinism and epistemic unpredictability.** It must correctly classify chaotic systems (e.g., a double pendulum) as deterministic yet unpredictable in practice due to sensitivity to initial conditions, rejecting accounts that conflate unpredictability with indeterminism. This is non-negotiable for accurately representing chaos theory.

  2. **Any account must distinguish unpredictability arising from intrinsic dynamical properties (like sensitivity to initial conditions) from unpredictability due merely to computational complexity.** It must correctly classify integrable systems (e.g., Keplerian two-body motion) as deterministic and predictable with sufficient resources, unlike chaotic systems. This distinction is non-negotiable to avoid misattributing complexity to chaos.

  3. **Any account must accommodate systems that are ontologically indeterministic yet epistemically predictable in their statistical behavior.** It must correctly classify systems like radioactive decay (governed by quantum mechanics) as having predictable aggregate statistics (e.g., half-life) despite individual event unpredictability. This is non-negotiable for compatibility with fundamental physics.

  4. **Any account must recognize deterministic systems that generate outputs indistinguishable from randomness under practical resource constraints.** It must correctly classify cryptographically secure pseudo-random number generators as deterministic yet unpredictable to computationally bounded predictors, distinguishing this from true ontological randomness. This is non-negotiable for grounding unpredictability in computational theory.

  5. **The requirement doing the most to exclude popular accounts is the strict separation of *unpredictability-in-principle* (e.g., due to undecidability, intrinsic randomness, or topological transitivity) from *unpredictability-under-resource-bounds* (e.g., due to computational complexity or finite measurement precision).** Many epistemic or complexity-focused accounts collapse this distinction, failing to isolate chaos-specific sensitivity (which permits unbounded prediction given perfect data/computation) from genuine in-principle limits. This requirement is non-negotiable for the proposed framework.
