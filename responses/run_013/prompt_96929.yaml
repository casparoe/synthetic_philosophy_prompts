answer: |-
  What you've described is a profound and under-discussed phenomenon in socio-technical systems. The most precise established term for this is **"friction gradient"** (or **"asymmetry of friction"**), though it often sits within broader discussions of **"implicit governance"** or **"architectural bias"**. If requiring a single name, **"infrastructural channelling"** captures it well.

  Here’s a breakdown, with distinctions and confidence levels:

  ### Core Concept: **Infrastructural Channelling**  
  A design that *structurally privileges* one social arrangement (e.g., hierarchical permission flows, centralised visibility) by making it **effortless**, while rendering alternatives **practically (but not logically) prohibitive** through accumulated operational costs, inertia, or invisibility. The asymmetry is embedded in the *architecture itself*, not in rules or prohibitions.  

  ### Key Distinctions:  
  1. **vs. Path Dependence**:  
     - **Path dependence** focuses on *historical lock-in*: "We use QWERTY because we’re stuck with it."  
     - **Infrastructural channelling** is *pre-lock-in*: the bias exists *before* adoption scales, engineered into the system’s "slope" (e.g., a bridge design that *naturally* routes traffic through a wealthy neighbourhood, disadvantaging peripheral areas without banning them).  
     - *Confidence*: High (95%). Your emphasis on "asymmetry from the beginning" clarifies this.  

  2. **vs. Deliberate Bias (e.g., "Weapons of Math Destruction")**:  
     - Deliberate bias *intends* exclusion (e.g., racist algorithms).  
     - Infrastructural channelling is often *unintended*: engineers solve "narrow problems" (e.g., optimising server costs) and accidentally solidify social asymmetries (e.g., forcing data through corporate hubs, marginalising offline communities).  
     - *Confidence*: High (90%). Your "narrow engineering problem" framing excludes malice.  

  3. **vs. "Tools Shape Habits" (e.g., McLuhan)**:  
     - Habit-shaping is *behavioural* ("phones make us distractible").  
     - Infrastructural channelling is *structural*: it alters the *cost landscape* for collective action. Example: PDFs (designed for fixed layout) silently privilege centralised publishers over adaptable/open formats, reshaping publishing economics without dictating behaviour.  
     - *Confidence*: High (85%).  

  4. **vs. Winner’s "Artifacts Have Politics"**:  
     - Winner’s classic examples (e.g., low bridges excluding buses) imply *determinism*: the artifact *forbids* alternatives.  
     - Your case is *softer*: alternatives *exist* but become "expensive" (e.g., XML allows custom metadata, but JSON’s simplicity channelled developers toward schema-less APIs, decentralising control). No one is *stopped*; they’re merely nudged by friction.  
     - *Confidence*: 90%. This distinction is vital and under-theorised.  

  ### Why "Friction Gradient"?  
  - **Friction**: The effort/cost to deviate from the default path.  
  - **Gradient**: The steepness of this cost-asymmetry, engineered into interfaces (e.g., a "Sign in with Google" button vs. self-hosted auth).  
  - It echoes economist Hirschman’s "exit, voice, loyalty" framework: friction gradients manipulate the *cost of exit* from defaults.  

  ### What It’s Not:  
  - ❌ **Not "Network Effects"**: These emerge *after* adoption (e.g., Facebook dominating because everyone’s there). Your phenomenon precedes mass adoption.  
  - ❌ **Not "Sunk Costs"**: Relies on prior investment; infrastructural channelling works even *before* significant investment.  
  - ❌ **Not "Nudging"**: Nudges are deliberate behavioural tweaks; this is emergent structural bias.  

  ### Least Confident Point (70%):  
  The relationship to **democracy**. You note the decision was "never announced" – but does infrastructural channelling *inherently* bypass democratic deliberation, or could it be designed democratically? I lean toward "bypass," as it operates through technical fluency (engineers/architects decide societal defaults). Yet participatory design exists. This needs more case studies.  

  ### British English Compliance  
  Whilst this phenomenon lacks a universally accepted moniker, "friction gradient" is favoured in critical infrastructure studies (e.g., Star & Ruhleder). It captures your "cheap/expensive" asymmetry splendidly, differing from mere path dependence by its *embedded, pre-emptive* nature. The nearest vernacular analogue? **"Silent Constitutions"** – architectures that govern behaviour without legislation.  

  If you adopt this term, cite Susan Leigh Star’s work on infrastructure ethnography. She unpacks how "boring things" like railway timetables or file formats encode social order through friction.
