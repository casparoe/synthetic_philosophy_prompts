  Hmm, their core frustration seems to be that current terminology either overstates (e.g., "requires" certain politics) or understates (e.g., "bare compatibility") what they observe. The emphasis on "unannounced settling" is particularly sharp—this isn't about lock-in through investment, but about baked-in asymmetries from day one. 

  Right, let's unpack their distinctions: 
  First, versus path dependence—they're noting the bias exists before cumulative advantages kick in. 
