  - 15% for "non-ad hoc" requirement (many solutions feel stipulative).  
  → **Net: ~15%**.

  ---

  ### **Key Sensitivities & Uncertainties**
  - **Most sensitive sub-question:** Whether linking facts are apt for grounding (sub-question 2). A 10% shift here alters the outcome by ~8%.  
  - **Least certain point:** Whether a "structuralist" view (e.g., fundamental reality has grounding relations as primitive) violates (b). Your constraint that fundamentality be "simply basic" (not structural) makes this controversial. *Credence in my own judgment here: 60%*.  
  - **Overall confidence in this analysis:** 70% (due to literature gaps).  

