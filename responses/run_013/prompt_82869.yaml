  ### Scoring Key  
  Tally how many of your answers match each row below. Your closest match is your result!  

  | Position Name             | Answers (1→10) | Core Idea | Blurb |
  |---------------------------|----------------|-----------|-------|
  | **Strict Duty View**      | B,B,B,B,B,A,A,B,B,A | Only acts done *for duty itself* have moral worth. Love, habit, or outcomes don’t count. | "You’re a purist: moral worth requires doing the right thing *because it’s right*. Motives like love or habit? Distractions. Congrats—your bar is high!" |
  | **Duty as the Guardrail** | B,A,B,A,A,A,A,B,B,A | Duty must "constrain" the action, but motives like love or habit can carry worth if duty backs them. | "You demand duty in the driver’s seat, even if love does the heavy lifting. Motives matter, but they need a chaperone." |
  | **Right Reasons Champion**| B,A,A,B,B,A,A,B,B,A | Worth requires being moved by *the feature that makes the act right* (e.g., helping *because someone needs help*). | "It’s all about *why*: you get credit only if you’re directly motivated by what makes the act good. No detours!" |
  | **Feature Tracker**       | B,A,A,A,A,A,A,B,B,B | Worth comes from *responding to* the right-making feature (e.g., helping because you notice need), even if not consciously "moral." | "You care that the agent ‘tracks’ what’s right, like a compass. Habits or love can work—if they reliably point toward good." |
  | **Attributability Focus** | A,A,A,A,A,A,A,B,B,A | Worth is about *credit*: did the agent *own* the act? If yes, and they tried to do good, they get credit. | "You’re practical: if the act ‘belongs’ to the agent and they aimed for good, that’s enough—even with bad luck or weird origins." |
  | **Agent Over Action**     | B,A,B,A,B,B,A,B,B,A | Worth attaches to the *person*, not acts. One good deed? Meaningless without consistent character. | "You judge the chef, not the dish: moral worth reflects stable character. Engineered traits or one-offs? Not ‘yours’." |
  | **Deflationist**          | A,A,A,A,A,A,B,A,A,B | "Moral worth" is a myth—just ask if the act was good, the motive decent, or the outcome helpful. | "You’re skeptical: why bundle motives/actions/outcomes into ‘worth’? Call a good deed ‘good’ and move on." |

