  We are creating a quiz that assesses a person's intuitions about moral worth without revealing the underlying philosophical positions until the end. The quiz will have 10 concrete scenarios, each with 2-3 answer choices that are phrased in everyday language. The goal is to capture the nuances in the following debates:

  1. Whether moral worth requires the motive of duty or if other motives (love, sympathy, habit) can suffice.
  2. Whether the agent must be motivated by the right-making feature itself or if tracking it indirectly is enough.
  3. Whether acting from moral ignorance or false moral belief can still have moral worth.
  4. Whether knowledge of the relevant facts is required or if ignorance merely excuses without destroying worth.
  5. Whether moral worth can be attributed if the agent's character was engineered (e.g., lab-induced compassion, cult upbringing).
  6. Whether moral worth is all-or-nothing or comes in degrees.
  7. Whether moral worth attaches to the action, the motive, or the whole person.

  We'll include at least some of the requested cases and add others as needed.

  Let's design the 10 scenarios and then the answer choices. We'll aim for 10 questions that cover the above issues.

  Question 1: The Shopkeeper (Kant's example)
     Scenario: A shopkeeper charges his customers fairly, but only because he fears that if he cheats them, they might find out and his business would suffer. He has no real concern for honesty for its own sake.
     Question: Does the shopkeeper deserve moral credit for his honesty?
     Options:
        A) Yes, because he did the right thing and that's what matters.
        B) No, because he was only acting out of self-interest.

  Question 2: The Loving Helper
     Scenario: A mother stays up all night caring for her sick child. She does it because she loves the child deeply, not out of a sense of duty. She doesn't even think about duty.
     Question: Does the mother deserve moral credit for her care?
     Options:
        A) Yes, because her love led her to do the right thing.
        B) No, because she wasn't motivated by duty.

  Question 3: The Guilty Cult Member
     Scenario: Someone was raised in a cult that teaches that helping outsiders is a sin. Despite this, they help an outsider in need, but they feel guilty afterward because they believe they have done something wrong.
     Question: Does this person deserve moral credit for helping?
     Options:
        A) Yes, because they did the right thing even though it was hard for them.
        B) No, because they acted against what they believed was right and feel guilty.

  Question 4: The Habitual Nurse
     Scenario: A nurse has been so well-trained that she automatically follows the correct procedures without thinking. She does her job perfectly but can't explain why she does it — it's just a deeply ingrained habit.
     Question: Does the nurse deserve moral credit for her actions?
     Options:
        A) Yes, because she consistently does the right thing.
        B) No, because she isn't doing it for the right reasons — it's just habit.

  Question 5: The Engineered Compassion
     Scenario: A person undergoes an experimental brain surgery that induces intense compassion. Afterward, they volunteer at a homeless shelter every weekend because they now feel deep empathy for the homeless.
     Question: Does this person deserve moral credit for volunteering?
     Options:
        A) Yes, because they are doing good and helping others.
        B) No, because their compassion isn't really theirs — it was created by the surgery.

  Question 6: The One-Time Hero
     Scenario: Someone does the right thing for the right reason exactly once — they save a child from a burning building because it was the right thing to do. But then they never do anything morally good again; they live a selfish life otherwise.
     Question: Does this person deserve moral credit for that one action?
     Options:
        A) Yes, because in that moment, they did the right thing for the right reason.
        B) No, because one good action doesn't make up for a life of selfishness.

  Question 7: The Unlucky Attempt
     Scenario: A person sees someone in distress and sincerely tries to help, but due to bad luck, their attempt fails and actually makes things worse. They had the best intentions and tried their best.
     Question: Does this person deserve moral credit for trying to help?
     Options:
        A) Yes, because they meant well and tried to do the right thing.
        B) No, because the outcome was bad and they didn't actually help.

  Question 8: The Rival's Influence
     Scenario: Someone does the right thing (e.g., gives to charity) only because they see that a rival is about to do it and they don't want the rival to look better than them.
     Question: Does this person deserve moral credit for their action?
     Options:
        A) Yes, because the charity still got the money and that's what matters.
        B) No, because they were motivated by envy and competitiveness.

  Question 9: The Motive by Wrong Belief
     Scenario: A person helps an old lady cross the street because they believe that doing so will bring them good luck. They have no concern for the lady's safety. In reality, helping her was the right thing to do because she needed help.
     Question: Does this person deserve moral credit for helping?
     Options:
        A) Yes, because they did help and that was the right thing to do.
        B) No, because they only did it for selfish superstitious reasons.

  Question 10: The Ignorant Do-Gooder
     Scenario: Someone does what they believe is the right thing, but they are mistaken about the facts. For example, they give money to a charity that they believe helps the poor, but in reality, the charity is a scam and the money is stolen. They had no way of knowing.
     Question: Does this person deserve moral credit for their donation?
     Options:
        A) Yes, because they intended to help and did what they thought was right.
        B) No, because the money didn't actually help anyone and went to thieves.

  We need to map these answers to the positions. We'll assign each answer option a point value for different positions. But note: we are not using a point system per se, but rather pattern recognition. We'll have a table that maps combinations of answers to positions.

  The positions we want to cover (with plain descriptions):

  1. Strict Duty-Only: Only actions done from the motive of duty have moral worth. Other motives (love, etc.) do not.
  2. Duty as Limiting Condition: The motive of duty must be present as a constraint (so that other motives are regulated by duty), but other motives can be the primary drivers.
  3. Moved by Right Reasons: Moral worth requires being motivated by the very features that make the action right (e.g., helping because it's helping, not because of luck).
  4. Responsive to Right-Making Features: The agent must be responsive to the right-making features (e.g., they do the right thing because of those features, even if they don't conceptualize them as "right"). However, the motivation doesn't have to be the feature itself as long as the action is explained by the agent's sensitivity to that feature.
