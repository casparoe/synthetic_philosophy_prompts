  ### What the Quiz *Can’t* Separate  
  - **Duty as Guardrail vs. Right Reasons**: Both reject self-interest (Q1, Q8, Q9) but split on Q4 (habit) and Q5 (engineered compassion). Duty Guardrail accepts them; Right Reasons rejects them.  
  - **Duty as Guardrail vs. Feature Tracker**: Both accept love (Q2) and reject false beliefs (Q9), but split on Q7 (failed help). Guardrail accepts it; Feature Tracker *may* reject it if the response wasn’t tuned to outcomes.  
  - **Incoherent/Unattested Combo**: All A’s (pure outcome focus). No major theory holds this—it ignores motives entirely and is philosophically unstable. All B’s is also rare; it implies no one ever has moral worth.  

  ### Why This Works  
  - **Concrete > Abstract**: No jargon—just relatable cases (e.g., the guilty cult member, the scammed donor).  
  - **Tempting "Wrong" Answers**: Options mirror real debates (e.g., Q7’s "intent vs. outcome" traps consequentialists).  
  - **No Philosopher Names**: Positions described by their logic, not pedigrees. Kant isn’t mentioned once!  

