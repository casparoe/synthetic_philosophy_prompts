  ### The Moral Worth Quiz  
  Answer these concrete scenarios based on your intuition. Don’t overthink—go with your gut. At the end, tally your answers to discover your view!  

  #### Questions  
  1. **The Shopkeeper**  
     A shopkeeper charges customers fairly, but *only* because cheating might hurt his reputation. He has no concern for honesty itself. Does he deserve moral credit?  
     - A) Yes—he did the right thing, and that’s what counts.  
     - B) No—he was purely self-interested.  

  2. **The Loving Mother**  
     A mother stays up all night caring for her sick child purely out of deep love. She never thinks about "duty." Does she deserve moral credit?  
     - A) Yes—her love led her to do good.  
     - B) No—she wasn’t motivated by what’s "right."  

  3. **The Guilty Cult Member**  
     Raised to believe helping outsiders is sinful, someone helps an injured outsider anyway—but feels intense guilt afterward. Do they deserve moral credit?  
     - A) Yes—they did good despite their upbringing.  
     - B) No—they acted against their own conscience.  

  4. **The Habitual Nurse**  
     A nurse follows perfect safety protocols purely from decades of habit. She can’t explain why—it’s automatic. Does she deserve moral credit?  
     - A) Yes—her actions are reliably good.  
     - B) No—she isn’t acting for reasons.  

  5. **The Engineered Volunteer**  
     After brain surgery artificially induces intense compassion, a person volunteers weekly at a shelter. Do they deserve moral credit?  
     - A) Yes—they’re genuinely helping people.  
     - B) No—their compassion isn’t "theirs."  

  6. **The One-Time Hero**  
     Someone saves a child from a fire solely because it’s the right thing to do, but lives selfishly otherwise. Do they deserve moral credit for that act?  
     - A) Yes—in that moment, their motive was pure.  
     - B) No—moral worth requires consistency.  

  7. **The Unlucky Helper**  
     A person tries to rescue someone in danger, but bad luck causes their attempt to fail and make things worse. They sincerely meant well. Do they deserve moral credit?  
     - A) Yes—their intent was good.  
     - B) No—they failed, and outcomes matter.  

  8. **The Rival’s Influence**  
     Someone donates to charity only to prevent a rival from looking better. Do they deserve moral credit?  
     - A) Yes—the charity still benefits.  
     - B) No—their motive was envy.  

  9. **The Superstitious Helper**  
     A person helps an elderly neighbor cross the street only because they believe it’ll bring them luck. They don’t care about the neighbor’s safety. Do they deserve moral credit?  
     - A) Yes—the neighbor was helped.  
     - B) No—their motive was selfish.  

  10. **The Scammed Donor**  
      Someone donates to a charity they believe helps the poor, but it’s a scam (they couldn’t have known). Do they deserve moral credit?  
      - A) Yes—they intended good.  
      - B) No—the action didn’t actually help.  

