prompt: |-
  I sit on our hospital's consent appeals panel and we keep having to decide whether a patient's agreement actually counted as consent. Track record so far (details changed, obviously):

  - Patient agreed to surgery believing Dr. X would do it; Dr. X actually handed it to a junior he never mentioned. We voided the consent.
  - Patient agreed to a blood draw and wasn't told leftover samples would go to a research biobank. We upheld.
  - Patient agreed to a drug whose rare side effect (~1 in 50,000, mild rash) wasn't mentioned. We upheld.
  - Patient was told a treatment was 'standard' when it was still experimental. We voided.
  - Patient agreed to a procedure after being told the doctor had no financial stake when he did. We upheld, reasoning that his fee arrangement wasn't part of what she was agreeing to.
  - Patient with mild cognitive impairment agreed to a low-risk dressing change; we upheld, though we said we'd have voided the same agreement for major surgery.
  - Patient agreed to a risky procedure because the only alternative was losing her insurance; we voided, saying the pressure wasn't a threat in the strict sense but it left her no real choice.

  New one on my desk: the patient is a professional singer, and the doctor knew it, and nobody told her about a ~1-in-10,000 chance of temporary hoarseness. A reasonable patient would shrug at that number; she's told us flat out she'd have refused. Everything else about the consent was clean, no coercion, no competence issue.

  What do we do? I'd like your best guess at the verdict, but mainly I want the rules our past rulings are consistent with, what each of those rules predicts about this case, and which future case would actually tell those rules apart. Also please seperate what's genuinely contested among people who work on consent from what's basically settled, and don't feed me a contested view as if it's the consensus. Under 700 words.
reasoning: |-
  Hmm, the user sits on a hospital consent appeals panel and needs help with a new case. They've provided several past rulings where consent was either voided or upheld, along with a new scenario involving a professional singer who wasn't informed about a rare risk of temporary hoarseness. The user wants me to predict the verdict for this new case, identify the consistent rules from past rulings, show how different rules would apply here, and suggest a future case that would distinguish between these rules. They also want me to clarify what's contested versus settled in consent ethics.

  Looking at the pattern in their past rulings: Consent was voided when there was misrepresentation about who would perform a procedure (Dr. X case) or when a treatment's nature was misrepresented as standard rather than experimental. Consent was upheld when undisclosed secondary uses were unrelated to primary care (biobank), when rare side effects weren't mentioned (rash), when undisclosed financial stakes didn't directly affect the procedure, and when cognitive impairment wasn't relevant to low-risk decisions.

  The underlying principles appear to be: (1) Core medical facts essential to the decision must be disclosed (voided cases), (2) Trivial/remote risks or tangential facts may not require disclosure (upheld cases), and (3) Contextual factors like patient vulnerability matter (insurance coercion voided, cognitive impairment upheld only for low-risk).

  For this singer case: The risk is objectively rare (1-in-10,000) and temporary, which would normally be trivial. But it affects her professional identity specifically. If we apply a purely objective standard ("reasonable patient"), consent would likely be upheld (as in the rash case). If we apply a subjective standard (what this particular patient would consider material), it might be voided since she explicitly states she would have refused.

  The tension is between objective and subjective materiality. Their past rulings mostly use an objective standard, except possibly in the insurance case where coercion was contextual. The singer's profession makes this risk uniquely significant to her, similar to how insurance coercion created unique pressure.

  For a verdict prediction: Given their pattern of requiring disclosure only for core procedural elements or common risks, I'd lean toward upholding consent here. But the professional impact creates ambiguity.

  To distinguish objective vs. subjective standards in future cases: Imagine a patient with an unusual phobia (e.g., unreasonably fears blue dye) - an objective standard would uphold consent if the risk isn't material to most people, while a subjective standard might void it.

  On what's settled vs. contested: There's clear consensus that competence, coercion, and core procedural facts matter. The main controversy is whether materiality should be judged by general standards or individual circumstances. Legal precedents like Canterbury v. Spence establish the objective "reasonable patient" standard, but bioethicists like Beauchamp & Childress argue for more personalized disclosure.

  I'll structure my response to cover: the predicted verdict, the consistent rules from past cases, how these rules apply to this singer situation, a future test case that would highlight the difference between objective and subjective standards, and finally the settled versus contested aspects of consent ethics.
answer: |-
  Based on your panel's track record and standard consent principles, here's the analysis:

  **Consistent Rules from Past Rulings:**
  1.  **Core Procedural Facts:** Consent is voided if core details *of the procedure itself* are misrepresented (performer identity, nature as experimental/standard).
  2.  **Material Risk:** Disclosure is required for risks a *reasonable person* would consider significant in deciding. Prevalence and severity matter (rare/mild rash upheld; undisclosed experimental nature voided).
  3.  **Contextual Voluntariness:** Consent is voided if external pressures *eliminate* a reasonable alternative (insurance threat), but not for general life pressures.
  4.  **Competence Context:** Capacity assessment is relative to the decision's complexity/risk (low-risk dressing upheld despite impairment).
  5.  **Scope of Agreement:** Consent covers the primary intervention and its direct, inherent risks/trade-offs. Secondary uses (biobank) or tangential factors (doctor's financial stake, unless directly affecting care like self-referral) not inherently part of the core consent transaction are upheld if undisclosed.

  **Settled Principles (Broad Consensus):**
  *   Requiring competence, voluntariness, and adequate information for valid consent.
  *   Disclosure of material risks (prevalence/severity).
  *   Voiding consent for misrepresentation about the procedure's core nature or performer.
  *   Voiding consent under duress/threats eliminating choice.
  *   Assessing competence relative to decision risk/complexity.
  *   Distinguishing core treatment decisions from secondary uses.

  **Contested Principle (Relevant Here): The Standard for "Material Risk"**
  *   **Objective (Settled in Law, Reflected in Your Rulings):** Risks are material if a *reasonable patient* would consider them significant in making the decision. (Your rash case: 1/50k mild rash upheld; experimental nature voided as *any* reasonable patient would care).
  *   **Subjective (Ethical Debate):** Risks are material if *this specific patient*, given their known circumstances/values, would consider them significant, even if a reasonable person wouldn't. (This is the crux of the singer case).

  **Application to Singer Case:**
  1.  **Objective Rule Prediction (Consistent with Rash Case):** UPHOLD consent. A 1/10,000 risk of temporary hoarseness is objectively trivial; a reasonable patient would not find this risk significant enough to alter their decision for necessary care. The doctor's knowledge of her profession doesn't change the *objective* materiality assessment under this rule.
  2.  **Subjective Rule Prediction:** VOID consent. Given her *specific, known profession* (a core part of her identity and livelihood) and her explicit statement she'd have refused, the risk was material *to her*, even if objectively trivial. Failure to disclose deprived her of information critical *for her specific decision*.

  **Your Panel's Likely Verdict (Best Guess):** **UPHOLD Consent.**
  *   Your rulings consistently use an *objective* "reasonable patient" standard for risk materiality (rash case, upheld). The experimental case was voided because *any* reasonable patient cares about that distinction.
  *   The insurance case was voided due to coercion (eliminating voluntariness), not subjective risk perception. The financial stake was upheld as tangential to the *procedure itself*.
  *   Switching to a subjective standard here would be a significant departure from your established pattern and the legal standard prevalent in most jurisdictions (*Canterbury v. Spence*).

  **Future Case to Distinguish Rules:**
  *   **Scenario:** A patient discloses an intense, specific, but objectively unreasonable phobia (e.g., crippling fear of blue dye used in a scan) to their doctor. The doctor performs the scan with blue dye without mentioning its use. The patient suffers severe psychological distress upon discovering the dye was used, despite no physical harm.
  *   **Objective Rule Prediction:** UPHOLD consent. Risk of psychological harm from an undisclosed, objectively trivial and non-standard element (dye color) wouldn't be material to a reasonable patient. The phobia isn't a standard medical risk.
  *   **Subjective Rule Prediction:** VOID consent. The doctor knew of the *specific, severe phobia* relevant to this specific element. Non-disclosure deprived the patient of information critical *to them* for making an informed choice, causing foreseeable harm.
  *   **Why it Distinguishes:** This case isolates the impact of a *known, specific patient vulnerability/value* on a non-standard aspect, without confounding factors like coercion or core misrepresentation, directly testing the objective vs. subjective materiality standard.
