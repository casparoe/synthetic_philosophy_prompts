prompt: |-
  For the better part of a year a reading group I belong to has been working through the literature on the norm of assertion, and we have reached the stage where we can recite one another's moves in advance. The positions are familiar enough: that one may assert only what one knows; that truth is the operative standard and that belief, justification, and adequate evidence either drop out or enter as separate conditions; that the real standard is belief, or justified belief, with the knowledge requirement an artefact of how the examples are described; and the sceptical view that there is no single constitutive norm, since 'assertion' may not name a single act. The dialectic is equally familiar. The knowledge camp produces cases in which a speaker says something true and well supported but plainly does not know it — the lottery ticket, the confident but premature diagnosis, the claim about a match result read half an hour ago — and reports that the assertion is improper; the opposition replies that the impropriety is conversational or prudential, or that those cases are really about belief, or that the judgement is tracking the speaker's liability to criticism rather than the standard the act itself answers to. Each side then accuses the other of explaining the data away rather than accounting for it, and we adjourn. Our group is mixed — two epistemologists, a linguist who keeps observing that 'assert' is not a natural kind, and me — and I suspect that is part of why the impasse is so vivid to us. What I want from you is not another round of the dispute but a diagnosis of what kind of disagreement it actually is.

  My own hypothesis, offered as a hypothesis and one I would be pleased to see refuted, has two parts. First, I suspect that 'norm' is doing at least three different jobs in this literature and that the parties are often not disagreeing about the standard at all but about which of the three the phrase 'the norm of assertion' ought to name: a rule that partly constitutes the act, so that a breach yields a defective instance of the act rather than an impermissible one; a requirement of permission or warrant, so that a breach yields something the speaker was not entitled to do; and a rule of uptake, governing what an audience may take for granted once the act has been performed. These come apart, and a standard that is plausible for one may be hopeless for another — truth, for instance, looks like a serviceable candidate for the first and a poor one for the third, since a hearer who learns that a speaker was merely accurate acquires less than a hearer who learns that she knew. Second, I suspect the vignettes that supply nearly all the evidence are systematically confounded: they vary the speaker's epistemic position while holding fixed the audience, the stakes, the speaker's alternatives, and the availability of excuses, so that what informants report may be closer to a verdict about blameworthiness than about the standard the act answers to.

  Please assess this. Set out each side as it actually argues, then say which portions of the impasse are verbal and which are substantive, and whether the two camps are in fact answering different questions under one heading — one about the constitutive standard of a technical act-type, the other about when it is permissible to tell someone something. Where the disagreement is substantive, say what it turns on: facts, standards of evidence, which cases count as data, or starting intuitions that neither side can argue for. Where it is verbal, say what the dispute is nevertheless about, since a choice of terminology with theoretical consequences is not nothing. Then tell me what would count as progress given your diagnosis: a distinction, a formal result about which candidate norms can bear which explanatory load, a different kind of evidence, or a change of question — or an argument that none of these is available and the standoff should be expected to persist. To keep the diagnosis honest, test it against a few cases the literature rarely uses: a forecaster's public prediction, a hedged claim in a scientific paper, a diagnosis delivered to a patient at the edge of the evidence, an entry in a private diary, a step asserted inside a proof, and a deliberate simplification told to a child. I am not asking you to settle which norm is correct, and I do not need references; I need to know what we have actually been disagreeing about.
reasoning: |-
  Okay, the user is part of a reading group stuck in a loop debating the norm of assertion. They've identified key positions: knowledge norm, truth norm, belief-based norms, and the skeptical view. The user suspects the impasse arises because "norm" is used in three different ways (constitutive, warrant, uptake) and that the vignettes used as evidence are confounded by focusing on blameworthiness rather than the act's standard. They want an analysis of the disagreement type—verbal vs. substantive—and how to move forward.

  First, I need to map the core positions accurately. The knowledge camp (Williamson, DeRose) uses cases where someone asserts without knowledge (lottery, premature diagnosis) to show impropriety. Opponents (Weiner, Lackey) argue the flaw is conversational, prudential, or about belief. The linguist's "assert isn't a natural kind" adds skepticism about a unified norm.

  The user's three-way distinction of "norm" is sharp. Constitutive norms define the act (like chess rules)—breach makes it defective. Warrant norms govern permission (like moral rules)—breach makes it impermissible. Uptake norms guide audience response (what can be relied on). These explain why truth works for constitutive (an assertion must aim at truth) but fails for uptake (we want knowledge for action). Knowledge theorists often blur constitutive and warrant, while truth theorists focus purely on constitutive.

  The vignette critique is spot-on. Standard cases (lottery, diagnosis) fix audience/stakes but vary epistemic gaps, triggering blame intuitions instead of pure normativity. For example, asserting a lottery loss feels wrong because we blame recklessness, not because it fails as an assertion. 

  Testing with atypical cases reveals nuances: 
  - A forecaster's public prediction highlights warrant/uptake—society permits probabilistic claims but expects reliability. 
  - A hedged scientific claim shows constitutive vs. uptake—"may" signals non-definitive assertion but still invites uptake as evidence. 
  - A doctor's diagnosis at evidence's edge separates warrant (permissible if responsible) from uptake (patient needs actionable knowledge). 
  - A diary entry tests if assertion requires an audience—truth/constitutive may apply, warrant/uptake don't. 
  - A proof step is purely constitutive (truth required for validity), no warrant issue. 
  - Simplification for a child prioritizes warrant (pedagogical permission) over strict truth/knowledge.

  Substantive disagreements: 
  - Whether assertion is a unified act (skeptics vs. others). 
  - Whether epistemic or non-epistemic norms govern warrant (e.g., should we prioritize sincerity over knowledge?). 
  - What counts as data—blame cases or institutional practices like science. 
  - Core intuitions: is a false but justified assertion inherently defective?

  Verbal disagreements: 
  - "Norm" meaning—constitutive vs. warrant. 
  - "Defective" vs. "impermissible." 
  - Whether "impropriety" in cases is norm-violation or something else.

  Progress paths: 
  - Distinguish the three norms explicitly. 
  - Design unconfounded cases (e.g., blameless ignorance). 
  - Explore institutional assertion (science, law) for context-specific norms. 
  - Formalize properties (e.g., truth is necessary; knowledge suffices for warrant/uptake). 
  - Accept pluralism per context.

  The user's hypothesis holds up—confusion stems from polysemy of "norm" and skewed evidence. Resolving requires disentangling questions and expanding data beyond blame vignettes.
answer: |-
  Your diagnosis is perceptive and largely correct. The impasse stems from a conflation of distinct questions under the umbrella term "norm of assertion," compounded by methodological limitations in the evidence. Below, I’ll dissect the core disagreement, separate verbal from substantive elements, test your hypothesis against atypical cases, and outline paths for progress. 

  ### Core Positions (as argued in the dialectic)
  1. **Knowledge Norm (KN)**:  
     - **Claim**: Assertion is constitutively governed by knowledge. To assert *p* properly, one must know *p* (e.g., Williamson, DeRose).  
     - **Evidence**: Cases like the lottery (asserting a losing ticket based on odds alone) or premature diagnosis (asserting an illness without conclusive tests) feel improper despite truth/justification.  
     - **Reply to critics**: Impropriety isn’t merely conversational/prudential; it reflects the act’s *essential failure*. If you don’t know, you haven’t properly asserted.  

  2. **Truth/Jusitification Norms (TN/JN)**:  
     - **Claim**: Truth is the core standard (e.g., Weiner); justification or warranted belief suffices (e.g., Lackey). Belief may be a separate precondition.  
     - **Evidence**: Cases where speakers assert truthfully but unknowingly (e.g., a stopped clock right twice a day) aren’t improper. KN’s cases confuse epistemic irresponsibility with assertion’s norm.  
     - **Reply to KN**: "Impropriety" in lottery cases stems from *risk* (prudential) or violating Gricean maxims (conversational), not the assertion itself.  

  3. **Skeptical/Pluralist View (SV)**:  
     - **Claim**: "Assertion" isn’t a unified act (e.g., your linguist). Norms vary by context (e.g., stakes, audience), or no single constitutive norm exists.  
     - **Evidence**: Cross-context variations (e.g., courtroom testimony vs. gossip) demand different standards.  

  ### Your Hypothesis: Assessment  
  **Part 1: "Norm" does three jobs**  
  You’re correct. The literature conflates:  
  - **Constitutive Norm (CN)**: What makes an act *count as* assertion (e.g., truth as a success condition). Breach → defective act (like invalid move in chess).  
  - **Warrant Norm (WN)**: When assertion is *permissible* (e.g., knowledge as entitlement). Breach → blameworthy act.  
  - **Uptake Norm (UN)**: What an audience *acquires* (e.g., knowledge licenses reliance). Breach → unreliable testimony.  

  **How this drives disagreement**:  
  - KN advocates often treat CN and WN as identical (unknowable assertion = defective + impermissible).  
  - TN advocates focus on CN alone (truth defines assertion; justification governs warrant separately).  
  - SV denies CN entirely, seeing norms as context-bound (e.g., WN/UN shift with stakes).  

  **Part 2: Vignettes are confounded**  
  Absolutely. Standard cases (lottery, diagnosis) manipulate epistemic gaps while holding fixed:  
  - High stakes (e.g., betting life savings).  
  - Speaker’s recklessness (no excuses).  
  - Audience’s vulnerability.  
  This amplifies intuitions about *blame* (WN) or *reliance risks* (UN), masking CN. Informants report "impropriety" rooted in moral/cognitive risk, not constitutive failure.  

  ### Verbal vs. Substantive Disagreements  
  **Verbal Disputes (terminological choices with theoretical weight)**:  
  - **What "norm of assertion" refers to**: KN and TN are often talking past each other—KN cares about WN/UN, TN about CN.  
  - **"Defective" vs. "Impermissible"**: KN uses these interchangeably; TN separates them.  
  - **"Proper assertion"**: Is this about act-identity (CN) or social license (WN)?  

  **Substantive Disputes (genuine theoretical rifts)**:  
  1. **Is assertion a unified act?**  
     - SV vs. others: Turns on whether "assertion" has cross-context essences (e.g., diary vs. testimony).  
     - **What it turns on**: Empirical linguistics (does "assert" cover a natural kind?) and metaphysics of speech acts.  

  2. **Does knowledge play a unique role?**  
     - KN vs. TN/JN: Is knowledge necessary for warrant/uptake, or is justification sufficient?  
     - **What it turns on**:  
       - Epistemic standards: Is knowledge a threshold for action (e.g., can you act on mere justified belief?).  
       - Intuitions about cases: Does blameless assertion require knowledge?  

  3. **Which cases count as data?**  
     - KN prioritizes high-stakes, low-evidence vignettes; TN emphasizes mundane truths ("I have hands").  
     - **What it turns on**: Starting intuitions about "paradigmatic" assertion.  

  ### Testing with Atypical Cases  
  Your cases reveal how norms diverge:  

  | **Case**               | **Constitutive Norm (CN)** | **Warrant Norm (WN)** | **Uptake Norm (UN)** |  
  |------------------------|----------------------------|------------------------|----------------------|  
  | **Forecaster’s prediction** | Truth (if prediction aims at accuracy) | Justification (probability suffices) | Reliability (audience trusts expertise) |  
  | **Hedged scientific claim** | Not "pure" assertion (hedges weaken commitment) | Justification (evidence meets field standards) | Tentative reliance (treated as evidence, not fact) |  
  | **Diagnosis at evidence edge** | Truth (if sincere) | Permissible if responsible effort made | Insufficient for life-changing decisions (needs knowledge-level certainty) |  
  | **Private diary entry**  | Truth (if self-honest) | None (no audience) | None (non-public) |  
  | **Step in a proof**      | Truth (required for validity) | Justification (proof-internal warrants) | Full reliance (if accepted within the system) |  
  | **Simplification to child** | Defective (false) | Permissible (pedagogical warrant) | Permissible reliance (adjusted for context) |  

  **Insights**:  
  - No single norm covers all cases. CN (truth) fits proof/diary; WN (justification) fits science/forecasting; UN (knowledge) fits high-stakes diagnosis.  
  - SV gains plausibility: Context determines operative norm.  

  ### Paths to Progress  
  1. **Distinguish the three norms explicitly**: Frame debates as:  
     - *Constitutive*: What defines assertion? (Truth is strongest here.)  
     - *Warrant*: When is assertion permissible? (Justification + stakes may suffice.)  
     - *Uptake*: What must audiences rely on? (Knowledge is strongest here.)  
     This ends conflation-fueled stalemates.  

  2. **Generate unconfounded evidence**:  
     - Cases varying stakes/epistemic status *independently* (e.g., low-stakes lottery claim).  
     - Study institutional practices (science, law) where norms are codified (e.g., peer review = WN-focused).  

  3. **Formalize norm properties**: Show which candidates can:  
     - *Explain assertion’s function* (e.g., truth enables information-sharing).  
     - *Bear explanatory load* (e.g., knowledge supports UN but overreaches for CN).  

  4. **Embrace pluralism**: Assertion might:  
     - Have a minimal CN (e.g., commitment to truth).  
     - Allow WN/UN to vary contextually (e.g., medical diagnosis vs. speculation).  

  **Why standoff persists**: Parties are defending different facets of a complex practice. Progress requires abandoning the "single norm" assumption. Your hypothesis—that the dispute masks three questions—is the breakthrough. Refining it, not rehashing old cases, is the way out.  

  **Final diagnosis**: You’ve been disagreeing about (1) what aspect of assertion "norm" labels, and (2) whether assertion admits universal rules. The first is resolvable by disambiguation; the second requires evidence beyond vignettes.
