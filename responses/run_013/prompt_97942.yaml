prompt: |-
  I am at work on a novel whose central character causes, and clearly foresees, a harm she does not seek, and I find that I cannot predict how a reader will judge her without first knowing what a reader is actually tracking when they ascribe intention. The phenomenon is familiar enough in outline — Joshua Knobe's chairman, who is said to have harmed the environment intentionally by most respondents but to have helped it intentionally by only a small minority, is the canonical demonstration — but I do not want the demonstration explained to me. I want the specification that any adequate theory of it would have to meet.

  Please write me the desiderata. I am asking for the full requirements list: the cases a theory of this asymmetry must get right, the distinctions it must not collapse (for instance between intending an outcome and bringing it about intentionally, or between the agent's attitude and the outcome's moral status), the empirical results it must accommodate, and the questions it must answer rather than defer — each with the consideration that makes it a requirement rather than a preference. Then tell me which requirements are non-negotiable and which are the commitments of a particular camp, and flag any pair you suspect cannot be satisfied together; in particular I want to know whether the demand that the asymmetry be a rational exercise of the ordinary concept can survive the demand that intentionality itself remain morally neutral.

  To keep the exercise honest, here are four cases I have been working with, and a theory that cannot place them is of no use to me. First, a character who knows that her forthcoming book will disgrace her dead mother, where the wronged party no longer exists. Second, a foreseen but morally innocent damage — the flooding of a beautiful valley, no one harmed. Third, a foreseen benefit conferred on a character the reader despises. Fourth, an agent who, like the chairman, disavows any concern for the harm, but who would have proceeded even had the harmful program been unprofitable. For each, say what a theory must deliver and whether the case exposes a gap in the standard accounts. Finally, tell me which single requirement does the most to exclude candidate theories, since that is the one I will be watching most closely.
reasoning: |-
  Okay, the user is writing a novel and needs to understand how readers ascribe intention to a character who causes foreseeable harm without seeking it. They mention Joshua Knobe's chairman experiment, where people judge harmful side effects as intentional but beneficial ones as unintentional. They don't want an explanation of the effect but the specifications a theory must meet.

  First, I need to outline the desiderata for an adequate theory. The user wants a full requirements list: cases it must handle, distinctions it must maintain, empirical results to accommodate, and questions to answer. They also want to know which requirements are non-negotiable vs. camp-specific and if any pairs conflict, especially whether the asymmetry can be rational while intentionality remains morally neutral.

  The user provided four specific cases. Let me recall them:
  1. Disgracing a dead mother (no existing victim).
  2. Morally innocent damage (valley flooding, no harm).
  3. Benefit to a despised character.
  4. An agent who disavows concern but would proceed even without profit.

  For each case, I need to specify what the theory must deliver and if it exposes gaps in standard accounts. Also, identify the requirement that excludes most candidate theories.

  Key distinctions from philosophy of action: intending vs. intentional action, agent's attitude vs. outcome's moral status. The Knobe effect shows moral valence affects intentionality judgments.

  Empirical results to include: the original Knobe effect, praise vs. blame asymmetry, skill/inability cases, and cross-cultural variations.

  Non-negotiable requirements: descriptive adequacy (covering all cases), preserving the intending/intentional distinction, accommodating the asymmetry, and not collapsing moral valence into intention definition. 

  Contested points: whether intentionality is inherently non-moral or if folk concepts are inherently moralized. The main conflict is Requirement 1 (rational exercise of ordinary concept) vs. Requirement 4 (intentionality morally neutral). If folk psychology is inherently moral, Requirement 4 might be untenable.

  Now, analyzing the four cases:
  1. Dead mother: Harm to a non-existent person. Theory must show if judgment depends on moral violation despite no victim. Exposes gaps in theories that require an identifiable victim.
  2. Innocent damage: No harm, just aesthetic loss. Tests if moral wrong is necessary. If judged intentional, undermines purely moral accounts.
  3. Benefit to despised character: If judged unintentional due to antipathy, shows affective components. Challenges theories ignoring emotional responses.
  4. Profit-independent harm: Agent acts even without gain. Tests if personal stake affects judgments. Exposes gaps in cost-benefit theories.

  The most excluding requirement is preserving the distinction between intention and intentional action (Requirement 2). Many theories conflate them to explain the asymmetry.

  Also, the conflict between moral neutrality of intentionality and the asymmetry being a rational exercise is critical. If folk concepts are inherently moralized, moral neutrality can't hold, making Requirement 4 the sticking point.

  Need to ensure all desiderata are covered, distinctions maintained, and cases addressed. Highlighting the dead mother case as particularly challenging for victim-focused theories.
answer: |-
  Below is a comprehensive specification for an adequate theory of the Knobe Effect (the "side-effect asymmetry"), structured as requested. I address desiderata, non-negotiables, contested commitments, potential conflicts, your four test cases, and the most exclusionary requirement.

  ---

  ### **I. Desiderata: What an Adequate Theory Must Achieve**
  *(Each requirement is grounded in philosophical or empirical necessity)*

  1. **Descriptive Adequacy**  
     *Requirement*: Explain why harmful foreseen side effects (e.g., harming the environment) are judged intentional by most, while beneficial foreseen side effects (e.g., helping) are judged unintentional.  
     *Ground*: Empirical reality (Knobe's original data). A theory failing this fails its core purpose.

  2. **Preserve Intention/Intentional Action Distinction**  
     *Requirement*: Maintain a clear boundary between *intending an outcome* (as a goal) and *bringing it about intentionally* (as a foreseen side effect).  
     *Ground*: Philosophical consensus that intention requires desire-directed commitment, while intentional action may include outcomes embraced or accepted without desire.

  3. **Non-Collapse of Attitude/Outcome Distinction**  
     *Requirement*: Distinguish the *agent’s attitude* (e.g., indifference) from the *outcome’s moral status* (e.g., harmful).  
     *Ground*: Empirical data shows agents can be indifferent to both harm/benefit, yet judgments differ based on outcome valence.

  4. **Moral Neutrality of Intentionality**  
     *Requirement*: Ensure "intentional" is not *defined* by moral terms. Intentionality must remain a non-moral concept in principle.  
     *Ground*: Conceptual coherence; we can intelligibly ask, "Was this immoral act intentional?" without tautology.

  5. **Accommodate Key Empirical Results**  
     *Requirement*: Explain:  
     - Praise-Blame Asymmetry (Knobe 2003): Harmful side effects judged intentional > beneficial.  
     - Skill/Inability Cases (Pettit & Knobe 2009): Judgments persist even if outcome isn't causally dependent on the agent (e.g., "the chairman was skilled at harming").  
     - Cross-Cultural Robustness (e.g., findings in Hindi, Mandarin).  
     *Ground*: Replicability and scope of the phenomenon.

  6. **Answer Core Questions (No Deferral)**  
     *Requirement*: Resolve:  
     - *Why does moral valence affect intentionality judgments?*  
     - *Is this asymmetry rational or a bias?*  
     *Ground*: Theoretical completeness; a "why" must be provided.

  ---

  ### **II. Non-Negotiables vs. Contested Commitments**
  - **Non-Negotiables** (Failure invalidates the theory):  
    - **Descriptive Adequacy** (Desideratum 1).  
    - **Preserving Intention/Intentional Action Distinction** (Desideratum 2).  
    - **Accommodating Empirical Results** (Desideratum 5).  
    *Rationale*: Without these, the theory ignores data or collapses core philosophical distinctions.  

  - **Contested Commitments** (Define theoretical camps):  
    - *Is the asymmetry rational?*  
      - **Rationalist Camp**: Asymmetry reflects deep structure of folk psychology (e.g., Knobe: harm reveals normative expectations).  
      - **Bias Camp**: Asymmetry is a heuristic error (e.g., Nadelhoffer: blame distorts cognition).  
    - *Is intentionality inherently non-moral?*  
      - **Neutralists**: Intentionality is purely psychological (e.g., Mele).  
      - **Moralists**: Folk concept of intentionality is moralized (e.g., Knobe).  

  ---

  ### **III. Suspected Conflicts Between Requirements**
  - **Primary Tension**:  
    **Moral Neutrality (Desideratum 4)** vs. **Descriptive Adequacy (Desideratum 1)**.  
    *Conflict*: If moral valence *systematically* shapes intentionality judgments (per Desideratum 1), how can intentionality remain morally neutral (per Desideratum 4)? Moralists argue neutrality is untenable; Neutralists must explain how morality "tracks" without defining the concept.  
    **Survival Question**: The demand that asymmetry is a *rational exercise* **can** survive with moral neutrality *only if* morality is a reliable proxy for non-moral features (e.g., norm violations signal intentional control). If not, neutrality collapses.  

  - **Secondary Tension**:  
    **Rationality of Asymmetry** vs. **Bias-Driven Data**.  
    If the asymmetry is a cognitive bias (e.g., emotional blame), it cannot be fully rational.  

  ---

  ### **IV. Your Four Cases: What a Theory Must Deliver**  
  *(✓ = Standard accounts handle; ✗ = Exposes gaps)*  

  1. **Disgracing a Dead Mother**  
     - *Requirement*: Theory must judge harm as intentional *despite no existing victim*. Moral wrong (violation of filial duty) must suffice.  
     - *Gap Exposure*: ✗ Victim-focused accounts (e.g., affective blame theories) fail. Norm-based theories (e.g., Knobe) succeed if "dishonoring the dead" is a salient norm.  

  2. **Flooding a Beautiful Valley (No Harm)**  
     - *Requirement*: Theory must either (a) judge damage intentional (if moral/prescriptive norms apply, e.g., "desecrating nature"), or (b) judge it unintentional (if only welfare harm counts).  
     - *Gap Exposure*: ✗ Pure welfare-harm theories (e.g., Cushman) fail if readers see aesthetic damage as norm-violating. Moralist theories must clarify "harm" scope.  

  3. **Benefit to a Despised Character**  
     - *Requirement*: Theory must explain why benefit is likely judged *unintentional* (due to antipathy) or *intentional* (if outcome is objectively good).  
     - *Gap Exposure*: ✗ Utilitarian theories struggle; evaluative theories (Alicke) succeed if blame/praise emotions drive judgments.  

  4. **Profit-Indifferent Harm**  
     - *Requirement*: Theory must judge harm intentional *even if no motive exists* (e.g., chairman harms despite no profit). Agent’s indifference must not block intentionality.  
     - *Gap Exposure*: ✗ Motive-based accounts fail. Knobe-style norm theories succeed: indifference to harm *is* the norm violation.  

  ---

  ### **V. The Most Exclusionary Requirement**  
  **Preserving the Intention/Intentional Action Distinction (Desideratum 2)** excludes the most candidate theories.  
  - *Why*: Many theories (e.g., early "desire-based" accounts) conflate *intending* and *intentional action* to explain the asymmetry. For example, they claim harming is intentional because the agent "accepts" it as a goal—but this erodes the distinction between means, ends, and side effects.  
  - *Consequence*: Adequate theories must explain how an outcome can be intentional *without* being intended, purely due to its moral valence + foresight + indifference. This forces complex machinery (e.g., norm-based competence theories) and eliminates simplistic desire-based models.  

  ---

  ### **Summary for Your Novel**  
  - **Core Tension**: Moral valence shapes intention ascriptions, but intentionality must not *be* moral. Your cases test whether a theory can navigate this.  
  - **Watch Requirement #2**: If readers conflate your character's *foresight* of harm with *intent*, the distinction collapses. Ensure her indifference is palpable, not covert endorsement.  
  - **Theoretical Recommendation**: **Normative Competence Theories** (e.g., Knobe) best handle your cases—they argue that harmful outcomes reveal the agent's *awareness of violating norms*, making the act "intentionally harmful" (not "intended"). But they strain moral neutrality.  

  For your character: Focus on her *indifference as a normative violation* (e.g., "She knew it would flood the valley and didn't care"). This triggers the asymmetry while preserving her lack of intent.
