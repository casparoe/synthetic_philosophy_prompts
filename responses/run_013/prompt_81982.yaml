  I've just been added to my company's model-governance committee, and before I sign off on renewing the contract for the fairness-auditing platform we run against our loan-scoring model, I want to see the satire of what I'm about to approve. Write the product FAQ for that platform: roughly 600 words, formatted as question-and-answer entries with headers, in the deadpan voice of enterprise marketing copy and with no winking at the reader. The comedy has to come from getting the impossibility results right rather than inventing them. The same pricing tier should promise both group-wise calibration and equal error rates across groups, with the fine print conceding in one buried sentence that these can coexist only when base rates are equal or the classifier is perfect; a premium add-on should offer to 'equalize the base rates' in the training data so that the conflict no longer arises. Include an entry defending the practice of reporting whichever metric the customer asked for, an entry that describes the impossibility results as a known limitation of competing vendors, and a satisfied-customer quote from a public-sector agency that has deployed the tool in a high-stakes setting. It should be funny to someone who knows the calibration-versus-error-rate trilemma and legible to a reader who doesn't, and the critique of fairness-washing should land without ever being stated outright.
