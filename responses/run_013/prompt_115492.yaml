  Finally, the user's deeper need: they likely want to expose challenges in using intuitions, possibly to provoke discussion in the seminar. Highlighting unsatisfiable requirements could show why some philosophers reject intuition-based methods. I'll ensure clarity and depth to support their pedagogical goals.
answer: |-
  For your seminar, the desiderata for an adequate theory of intuition-as-evidence—aimed at vindicating modal or conceptual intuitions—must be carefully delineated. The theory’s core job is to justify treating certain intuitions as *prima facie* evidence for claims about possibility, necessity, or conceptual truths, while navigating empirical and philosophical pitfalls. Below are the requirements, with the case or consideration motivating each, an assessment of its status as genuine or optional/prejudicial, identification of the most eliminative requirement, and a flagged subset that may be jointly unsatisfiable.

  First, the theory must accommodate the *Gettier Intuition Stability* requirement: it must explain why certain intuitions (e.g., that a Gettier subject lacks knowledge) are treated as near-universally reliable evidence by philosophers despite empirical noise. The case here is the stability of the Gettier judgment across professional philosophers, even amid cultural variation in other cases. This is a genuine requirement because the theory fails if it cannot justify the evidential weight given to cornerstone philosophical cases. Second, it must handle *Cultural/Framing Sensitivity*: the theory cannot dismiss intuitions that shift with culture, class, framing, or presentation order (e.g., epistemic intuitions varying between Western and East Asian participants, or order effects in trolley cases). The consideration is that empirical findings (e.g., Weinberg, Nichols, and Stich’s work) show such shifts exist. This is genuine—the theory must account for variability without collapsing into skepticism about all intuitions. Third, *Expert-Novice Asymmetry* demands explaining why expert philosophical intuitions might carry greater evidential weight than novices’ (e.g., conflicting intuitions on reference between Kripkean experts and laypeople). The case highlights that expertise might calibrate intuition, making this genuine; a theory that ignores expertise cannot explain philosophical practice. Fourth, *Community Abandonment* requires the theory to explain how entire communities can rationally reject past intuitions (e.g., the decline of Cartesian dualist intuitions). The historical case is crucial; this is genuine, as the theory must allow for fallibility and progress.  

  Key distinctions must be preserved. The *Intuition-Belief Distinction* insists that intuition cannot be reduced to mere belief (e.g., an intuition that p can occur without a belief that p, as in cognitive dissonance cases). This is genuine, as blurring the distinction undermines the distinctive phenomenology of intuition as a seeming. The *Content-Reliability Distinction* forbids conflating the content of an intuition with the reliability of its source (e.g., explaining why an intuition that p is about p, not about the brain state producing it). The consideration is to avoid genetic fallacies; this is genuine, as the theory must separate the *target* of explanation from the *mechanism*. The *Explaining vs. Explaining Away* distinction prevents reducing all causal explanations of intuitions (e.g., evolutionary debunking arguments) from automatically undermining them. The case is that psychological or cultural explanations might vindicate or invalidate intuitions; this is genuine and highly eliminative—many naturalistic theories stumble by treating explanation as invalidation.  

  Empirical constraints are non-negotiable. The theory cannot contradict robust findings of *Cross-Cultural Variation* (e.g., differing intuitions on reference or knowledge across demographics) or *Framing/Order Effects* (e.g., asymmetric responses to structurally identical dilemmas). The consideration is that denying these risks *ad hoc* insulation from science. This is genuine. Similarly, it must respect *Domain-Specific Expertise Effects* (e.g., expertise improving calibration in modal logic but not ethics). The case shows expertise doesn’t uniformly enhance intuition; this is genuine.  

  Assessing genuineness: The demand for *reliability* (that intuitions track modal/conceptual truths) is a genuine requirement, not an optional extra. Without it, intuitions cannot function as evidence—mere psychological genesis is insufficient. A prejudice, however, is the demand for *infallibility* (e.g., that variation entails unreliability), often held by skeptics; variability need not undermine all evidential use. Another prejudice is *universalizability* (that all intuitions must be shared cross-culturally), sometimes assumed by traditionalists; local intuitions may still be evidence if properly circumscribed.  

  The most eliminative requirement is *Explaining vs. Explaining Away*. It eliminates theories that reduce intuitions to brute psychological phenomena (e.g., some hyper-naturalist views), as they struggle to show why explanations don’t debunk intuitions, and overly optimistic views (e.g., some rationalist accounts) that ignore how explanations can sometimes undermine.  

  The subset likely jointly unsatisfiable comprises *Reliability*, *Cultural/Framing Sensitivity*, and *Expert-Novice Asymmetry*. Reliability demands intuitions track truth, but sensitivity shows they are context-dependent, while asymmetry implies experts escape this—yet empirical data suggests expertise doesn’t always insulate intuitions from framing (e.g., Schwitzgebel & Cushman’s work on order effects in ethicists). Satisfying all three may require untenable claims (e.g., that only experts in ideal conditions have reliable intuitions, which conflicts with actual practice). This tension is the result you seek: it suggests that no theory can fully vindicate intuitions as evidence without compromising on empirical reality or evidential robustness.
