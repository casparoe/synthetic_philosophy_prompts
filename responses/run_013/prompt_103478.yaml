answer: |-
  Your dissection is razor-sharp and identifies a genuine, underappreciated conceptual tangle in historical and causal explanation. Let's carve this systematically.

  **Brainstorming: Concepts Adjacent to Your Distinction**

  1.  **Modal Contingency (vs. Necessity):**
      *   *Matches:* Directly addresses your first question: Could this specific outcome have failed to occur? (True in possible worlds where relevant initial conditions hold but the outcome differs).
      *   *Mismatches:* Says nothing about *how easily* it could have failed to occur (your second question). A modally contingent outcome could be highly robust *or* highly fragile.

  2.  **Sensitive Dependence on Initial Conditions (Chaos Theory):**
      *   *Matches:* Captures your "hair's difference at the beginning" scenario – a form of causal fragility located upstream. Explains how deterministic systems can produce radically divergent outcomes from tiny variations.
      *   *Mismatches:* Primarily a property of *systems/dynamics*, not *specific outcomes* in complex historical contexts. Focuses on unpredictability due to measurement limits, not directly on the modal status (contingent/necessary) of the outcome itself. Doesn't address cases where large-scale changes are needed (your second scenario).

  3.  **Robustness/Fragility (of an Outcome/Process):**
      *   *Matches:* Gets closest to your *second* dimension. A robust outcome persists under a wide range of counterfactual perturbations; a fragile outcome is easily overturned by small changes. This maps directly to "how much would have to change?"
      *   *Mismatches:* This concept is often used descriptively without explicitly anchoring it to the *modal possibility* of change (your first dimension). An outcome can be robust but still modally contingent (e.g., the Allies winning WWII – modally possible they could lose, but robust against many small changes). Conversely, a modally *necessary* outcome is, trivially, maximally robust.

  4.  **Overdetermination:**
      *   *Matches:* Explains extreme robustness. If an outcome is overdetermined (many sufficient causes), removing one causal path likely won't prevent it. This makes change difficult (requiring large interventions).
      *   *Mismatches:* Focuses on causal sufficiency, not modal possibility. An outcome can be modally contingent *and* overdetermined (e.g., a landslide election win – modally possible to lose, but robust due to multiple factors). Also doesn't capture upstream fragility (sensitive dependence).

  5.  **Path Dependence:**
      *   *Matches:* Highlights how early events constrain later possibilities, sometimes creating "lock-in." Can explain why large changes are needed later (low fragility downstream, but perhaps high fragility upstream at the branching point).
      *   *Mismatches:* Focuses on the sequence and irreversibility of events within a process, not directly on the modal status of the final outcome or its fragility to *counterfactual* interventions at different points. An outcome can be path-dependent but modally necessary *or* contingent.

  6.  **Causal Depth (Elliot Sober, others):**
      *   *Matches:* (Less common term) Refers to *how far back* in the causal chain one needs to intervene to prevent an outcome. Deep causes require large, early interventions (low fragility); shallow causes can be disrupted by small, late interventions (high fragility). This directly relates to your second dimension.
      *   *Mismatches:* Doesn't explicitly distinguish the modal status. Also, the "when" of intervention isn't *always* identical to "how much" change is needed (though often correlated).

  **The Carving & The Answer**

  You've identified two fundamentally independent dimensions:

  1.  **Modal Status:** Is the outcome *modally contingent* (true in some but not all possible worlds sharing the relevant past up to a point) or *modally necessary/inevitable* (true in all such worlds) relative to a specified prior state or set of conditions?
  2.  **Causal Fragility/Robustness:** How *sensitive* is the outcome to counterfactual variations? Does it require only a *small* ("knife-edge") intervention to change (High Fragility), or would it require a *large* intervention affecting deep structures or numerous factors (High Robustness)?

  **Why "Contingent" and "Inevitable" Slip:**

  *   **"Contingent"** often conflates Modal Contingency (it *could* have been otherwise) with High Fragility (it *easily could* have been otherwise).
  *   **"Inevitable"** often conflates Modal Necessity (it *could not* have been otherwise) with High Robustness (it *would have been very hard* to make it otherwise). Worse, it frequently smuggles in **epistemic probability** (it *was always very likely* to happen).

  **Established Names & Gaps:**

  *   **Modal Status** is well-established (Contingent vs. Necessary).
  *   **Causal Fragility/Robustness** is the concept you need for the second dimension. While "robustness" is widely used, its pairing with "fragility" specifically for *causal sensitivity of outcomes* isn't always formalized in historical/philosophical discourse under one perfect term. **Causal Depth** comes close but emphasizes "when" more than the absolute "scale" of intervention needed. **Stability** is sometimes used but is vaguer. **I propose embracing "Causal Fragility" (high sensitivity) vs. "Causal Robustness" (low sensitivity) as the clearest, most descriptive terms for the *property of the outcome relative to counterfactual variations*.**

  **Distinguishing from Neighbors:**

  *   **vs. Path Dependence:** Path dependence describes a *process* structure. Fragility/Robustness is a property of the *outcome* relative to counterfactual interventions. A path-dependent outcome might be robust or fragile depending on the path and intervention point.
  *   **vs. Sensitive Dependence:** Sensitive dependence is a specific *mechanism* (often chaotic dynamics) that *causes* high upstream fragility. Fragility is the *general property* that sensitive dependence exemplifies. Fragility can exist without chaos (e.g., a single vital component).
  *   **vs. Robustness of Causal Claims (e.g., Cartwright):** This is about the evidential support for a *general causal relationship* across variations. Your concern is the robustness of a *specific historical outcome* to counterfactual changes.
  *   **vs. Modal Contingency:** Already separated as Dimension 1.

  **Boundary Cases & Combinations:**

  *   **Collapse:** The dimensions only collapse if Modal Contingency is zero (Necessity implies infinite Robustness) or if Fragility is infinite (any non-actual world diverges, implying Contingency). These are limiting cases, not the norm.
  *   **Your First Scenario (Fixed Process, Fragile Antecedents):** *Modal Status:* Contingent (depends on precise initial conditions). *Fragility:* High Fragility (small change to initial conditions prevents outcome). *Mechanism:* Often Sensitive Dependence.
  *   **Your Second Scenario (Open Outcome, Robust):** *Modal Status:* Contingent. *Fragility:* High Robustness (large changes needed).
  *   **Other Combinations:**
      *   **Necessary & Robust:** Trivial (e.g., logical truths, some physical laws relative to their domain). Also, outcomes necessitated by highly overdetermined causes.
      *   **Necessary & Fragile:** Very rare/nonexistent in history? If truly necessary (true in all relevant worlds), it *can't* be fragile (easily changed). This combination seems contradictory. (A *process* leading to a necessary outcome could *appear* fragile mid-stream, but the outcome itself wouldn't be).
      *   **Contingent & Moderately Fragile/Robust:** The vast, messy middle ground of history.

  **Addressing the Disputes:**

  You are correct. Two people agreeing on facts but disagreeing on "inevitability" are likely:
  1.  Focusing on different dimensions (one on Modal Contingency: "It *could* have failed!", the other on Robustness: "It *would have been incredibly hard* to make it fail!").
  2.  Differing on the *range of plausible counterfactuals* (Is changing a messenger's path a plausible small intervention? Is restructuring an entire economy a plausible large intervention?).
  3.  Conflating with **epistemic probability** ("Given what we knew then, it was bound to happen").

  **The Missing Third Element (Flagged!):**

  You rightly suspect **epistemic probability** is folded in. "Inevitable" is often used to mean "very high probability given prior knowledge," not strict modal necessity. Similarly, "contingent" can imply "unlikely" or "chance-driven." This is distinct from both Modal Status and Fragility. A highly probable outcome (epistemic) can be modally contingent and either fragile or robust.

  **Conclusion & Coinage:**

  There isn't a single, universally established *pair* of terms that perfectly and consistently captures *both* dimensions *as independent properties of historical outcomes* in the literature. Modal Contingency is standard. For the second dimension, **Causal Fragility** and **Causal Robustness** are the most apt and clear terms, even if their specific pairing in *this* context isn't always highlighted. We should explicitly define them:

  *   **Causal Fragility:** The degree to which a specific historical outcome is sensitive to small counterfactual variations in antecedent conditions or events. A highly fragile outcome is easily overturned ("knife-edge").
  *   **Causal Robustness:** The degree to which a specific historical outcome persists under counterfactual variations in antecedent conditions or events. A highly robust outcome requires large-scale interventions to prevent.

  **The Single Question You Should Have Asked:**

  "Beyond the distinction between modal contingency and necessity, and acknowledging the frequent conflation with epistemic probability, what conceptual tools best capture the *degree of sensitivity* of historical outcomes to counterfactual variations, and how is this dimension logically independent from both the modal status and the perceived likelihood of the outcome?"

  **In essence:** You've brilliantly disentangled Modal Possibility, Causal Sensitivity (Fragility/Robustness), and Epistemic Probability. Recognizing their independence is crucial for clarifying historical debates about "contingency" and "inevitability." While Modal Contingency is standard, the precise terminology for Causal Sensitivity isn't perfectly settled, but **Causal Fragility/Robustness** is the most direct and useful vocabulary for your purpose. Always explicitly define these terms when using them to avoid the very slippage you've identified.
