  - Fittingness reasons vs desirability reasons separation
  - The belief/want-to-believe gap
  - Problem cases like Quinn's self-torturer and worship-punishment scenarios

  The format should mimic institutional prose with numbered sections, avoiding overt jokes while letting philosophical tensions create humor. I'll structure it as a Classification Desk memorandum with:
  1. Standard filing procedures
  2. The promised reward case (clear wrong-kind reason)
  3. The admiration-punishment case (borderline)
  4. The intention-formation case (contested)
  5. Policy statement addressing value/fittingness circularity
  6. An unclassifiable case for escalation

  For the tone, I'll maintain flat procedural language throughout, using technical terms naturally but making examples self-explanatory. The satire should target administrative approaches to reason-classification without mocking individuals. 

  Important constraints to observe:
  - No quotation marks
  - No named living philosophers
  - No resolution on whether the distinction is exhaustive
  - Specialist-accurate handling of debates
  - 600-word target length

  The closing will include a form-letter sign-off and footnote of objections, maintaining the bureaucratic fiction. The humor must emerge from precise philosophical tensions rather than generic bureaucracy jokes.
answer: |-
  **MEMORANDUM**  
  **INTERNAL CIRCULATION ONLY**  
  **CLASSIFICATION DESK**  
  **INSTITUTE FOR NORMATIVE ADMINISTRATION**  
  **REF: CD/23/RK-WK/7**

  **SUBJECT:** Clarification of Filing Procedures for Right-Kind (RK) and Wrong-Kind (WK) Reasons  

  **1. PURPOSE**  
  This memorandum outlines standardized protocols for classifying submitted considerations as RK or WK reasons for specified attitudes (e.g., belief, admiration, intention). All submissions must now include Form R-7a (Attitude Specification) and Form C-9d (Consideration Context). Incomplete submissions will be returned without processing.  

  **2. STANDARD CLASSIFICATION PROCEDURE (SCP)**  
  Per SCP §4.2, a consideration is filed as **RK** if it bears on the *object* of the attitude (e.g., evidence for belief, excellence for admiration). It is filed as **WK** if it bears on the *state* of holding the attitude (e.g., benefits or penalties contingent on adoption).  

  **3. ILLUSTRATIVE CASE: PROMISED REWARD FOR BELIEF**  
  *Submission:* Agent offered 1,000 units for believing that sector 7-G is habitable.  
  *Analysis:* The reward is contingent on the *state* of believing, not evidence about sector 7-G.  
  *Classification:* **WK (Reason Code WK-B-3)**.  
  *Agent Entitlement:* Agent may conclude: (a) There is a reason to *want* to believe sector 7-G is habitable; (b) There is *no* reason (via this consideration) to affirm the proposition’s truth; (c) The Institute takes no position on whether the agent should accept the reward.  

  **4. AMBIGUOUS CASE: COERCED ADMIRATION**  
  *Submission:* A powerful being (designated Entity Θ) will punish Agent unless Agent admires Θ.  
  *Analysis:*  
  - The threat of punishment is a WK reason (contingent on the *state* of admiration).  
  - *Contested Element:* Whether Θ’s power to punish constitutes *evidence of admirability* (potentially RK).  
  *Classification:* **WK-Adm-6** (state-given), with **Annotation 9B**: "Entity Θ’s punitive capability may independently suggest ruthlessness, incongruent with admirability. Refer to Aesthetics Desk for supplemental review (File AESTH/Θ/442)."  

  **5. CONTESTED CASE: DEFERRED INTENTION**  
  *Submission:* Taking a single dose of compound X today prevents severe illness tomorrow but causes mild discomfort if taken tomorrow. Agent considers forming the intention *now* to take X *tomorrow*.  
  *Analysis:*  
  - Today, the health benefit favours *forming the intention* to act tomorrow.  
  - If the intention is formed, the same benefit does not bear on the *execution* of the intention tomorrow (as the benefit is secured by intention-formation alone). Tomorrow, only discomfort bears on acting.  
  *Classification:* **Contested (Code CT-Int-2)**. Filed under "Temporal Divergence in Reason-Bearing" (see *Quinn, W. - Archive Box 14*). No RK/WK determination pending Resolution 8c (Intention-Execution Disjunction).  

  **6. POLICY: FITTINGNESS-VALUE CORRELATION**  
  *Complaint:* "If whatever makes admiration fitting (RK) thereby makes the object valuable, then offering rewards for admiring worthless objects (WK) quietly licenses *creating* value via incentives."  
  *Response:* The Desk administers the RK/WK distinction, not value ontology. Per Policy Directive 12:  
  > **RK classification implies no position on whether fittingness-conferring properties are identical to, constitute, or correlate with value-conferring properties.**  
  WK rewards for attitudes are processed per Section 3. Value ontology queries require Form V-17 (Metaphysical Escalation).  

  **7. UNRESOLVED CASE: SELF-ASSESSMENT LOOP**  
  *Submission:* Agent reports that believing they are admirable would itself make them more admirable.  
  *Analysis:* The consideration (self-enhancing effect) appears to bear on both the *state* (WK: benefit of becoming admirable) and the *object* (RK: if belief causes admirability, it may constitute evidence *for* admirability).  
  *Classification:* **Unresolved (Code UC-8)**. Marked for Escalation to the Circularity Committee.  

  **8. CONCLUSION**  
  Adherence to SCP ensures consistent archival of considerations. Unclassifiable submissions (per Section 7) do not imply failure of the RK/WK model, only operational limits of the Desk. Submit appeals via Form CD-APL within 30 days.  

  **Sincerely,**  
  **The Classification Desk**  
  **Institute for Normative Administration**  

  ---
  **FOOTNOTE:**  
  Outstanding objections on file:  
  1. *Permutation Problem:* Can WK reasons become RK if the attitude’s object is *about* states? (e.g., admiring the state of being admired).  
  2. *Non-Attitudinal Reasons:* Whether the RK/WK schema applies to actions lacking a clear target attitude.  
  3. *Exhaustiveness Challenge:* Claims that some reasons (e.g., "duty to intend") are neither RK nor WK. Under review per Directive 15.  

  //END//
