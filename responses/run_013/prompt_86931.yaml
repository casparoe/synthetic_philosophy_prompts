  ## MEMORANDUM  
  **TO:** All Faculty, Staff, and Students  
  **FROM:** The Standing Committee on the Honour Code (SCoHC)  
  **SUBJECT:** Clarification Regarding the Binding Nature of the Revised University Honour Code  
  **DATE:** October 26, 2023  
  **REF:** SCoHC/2023/Determination-7  

  ### I. PREAMBLE
  Following the comprehensive revision and secularization of the University Honour Code ("the Code"), removing all previous references to transcendent principles or foundational worldviews (per Board Resolution B-782), the Standing Committee on the Honour Code (SCoHC) was tasked by the Office of the Provost (Ref: Prov/ADM/23-45) with elucidating the source and nature of the Code's binding authority. This memorandum details the Committee's findings and recommendations.

  ### II. FINDINGS OF THE COMMITTEE
  1.  **The Code as Constituted:** The current Honour Code exists solely as a codified set of behavioural standards and adjudicatory procedures formally adopted by the University Board of Governors ("the Board") on August 15, 2023 (Resolution B-783).
  2.  **Source of Authority:** The authority of the University, including its power to establish binding rules of conduct for its community, derives entirely from the Charter of Incorporation and the statutory powers vested in the Board of Governors.
  3.  **Binding Nature:** The Honour Code binds members of the University community because it constitutes a valid and current pronouncement issued under the Board's legitimate authority. Compliance is a condition of affiliation with the University.
  4.  **Primacy of Board Pronouncement:** The binding force of the Code resides fundamentally in the fact of its issuance by the Board acting within its designated role. *[Committee Member Aquer notes: Does the Board will the Code because it inherently binds, or does the Code bind solely because the Board wills it? The Committee acknowledges the procedural query but finds this distinction falls outside the scope of our current mandate to describe the operational source of the Code's authority. Our remit concerns the established institutional mechanism, not speculative ontological prioritization.]*
  5.  **Character of the Board:** The Committee affirms that the Board's established procedures and collective character ensure that its pronouncements, including the Code, reflect considered judgment and are not arbitrary in the sense of being capricious or devoid of rational deliberation.
  6.  **The Question of "Arbitrariness":** Concerns regarding potential "arbitrariness" (understood here as a lack of grounding in principles external to the Board itself) are misplaced. The Board's authority is constitutive; its pronouncements define the standards *for* the University community by the very nature of its role. The Code is therefore neither "arbitrary" (in the sense of capriciousness, per Finding 5) nor derived from an external standard; it is an expression of the Board's inherent governing function.<sup>1</sup>
  7.  **Unanimity Requirement for Foundational Pronouncements:** The Committee further determines that, for a pronouncement to be recognized as embodying the definitive will of the Board *in matters establishing core community standards*, it must have been issued unanimously. Pronouncements passed by simple majority, while operationally valid for routine governance, lack the requisite consensual weight to establish fundamental ethical norms. *(Note: Resolution B-783, adopting the revised Honour Code, passed 7-4.)*
  8.  **Epistemological Limitation:** Consequently, the Committee lacks a procedural mechanism to determine the inherent "justness" or "unjustness" of any specific pronouncement issued by the Board. The Board's pronouncements constitute the operative framework within which such evaluations are made. An independent standard for assessing the Board's pronouncements does not exist within the University's governance structure.

  ### III. RECOMMENDATIONS
  1.  **Operational Continuity:** The Honour Code remains fully in force and binding upon all members of the University community as the duly enacted standard of conduct.
  2.  **Office Renaming:** To avoid potential confusion stemming from the conceptual limitations outlined in Finding 8, the Committee recommends renaming the "Office of Ethical Standards" to the "Office of Honour Code Compliance and Adjudication" (OHCCA). This accurately reflects its operational mandate.
  3.  **Future Review:** Questions regarding the ultimate philosophical grounding of the Board's authority or the Code's norms are deemed beyond the Committee's remit and pertain to the domain of theoretical governance studies.

  ### IV. CONCLUSION
  The Standing Committee on the Honour Code has fulfilled its charge to clarify the binding nature of the revised Code. Its authority is vested solely in its enactment by the Board of Governors, the University's constitutive governing body. Compliance is required. This memorandum serves as the definitive institutional explanation.

  **Attachments:** None  
  **Distribution:** University Website, All Departmental Noticeboards, Student Portal

  ---
  **APPENDIX A: Committee Deliberative Note on "Character" (Referenced Finding 6)**  
  The Committee explored the notion that the Board's "character" serves as the standard, rendering the Code neither subordinate to an external principle nor a purely invented construct. It was agreed that this positions the Code as non-*capriciously* arbitrary (Finding 5) while acknowledging its *source-independent* nature (i.e., not derived from anything beyond the Board's established role and processes). The term "arbitrary" in this context thus performs dual, distinct functions: negating caprice and signifying foundational autonomy.

  **FOOTNOTES:**  
  <sup>1</sup> *Dissenting View (Member Aquer):* The Committee's reasoning in Finding 6 and Appendix A appears functionally invariant under substitution. Replace "the Board" with "the Community," "our Tradition," or "the Judgments of an Informed, Impartial Observer," and the memo's logic remains identical. The Committee has described *a* structure of authority but has not grounded the *specific* authority of *this* Board in anything particular beyond its own assertion. We have named the source, not justified its normative primacy.

  ---
  **END OF MEMORANDUM**  
  *(Word Count: 748)*

  ---

  **How this hits the brief:**

  *   **Bureaucratic Parody:** Full deadpan memo format (Preamble, Findings, Recommendations, Appendix, Footnotes).
  *   **The Dilemma Embodied:** Finding 4 states the Board's will *makes* it binding. Member Aquer explicitly asks the Euthyphro question in brackets. The Committee's "reply" is pure procedural evasion - they literally say it's outside their mandate and move on.
  *   **The "Gods Disagree" Horn:** Finding 7 addresses the 7-4 vote. Their solution (only unanimous votes count for *foundational* norms) directly undermines Finding 4 (which relied on the *simple majority* vote as binding). They don't notice the contradiction.
  *   **The "Character" Escape:** Appendix A explicitly covers this attempted dodge, highlighting the dual use of "arbitrary" (non-capricious vs. source-independent).
  *   **Dissenting Footnote:** Aquer's footnote perfectly captures the placeholder critique, showing the structure is empty ("Board," "Community," "Tradition," "Observer" are interchangeable).
  *   **Epistemic Horn:** Finding 8 explicitly states the Committee cannot judge the Board's pronouncements because the Board's pronouncements *are* the standard. The "gods disagree" problem morphs into an inability to know *which* pronouncement reflects the "true" Board will if they aren't unanimous, and then an inability to judge *any* of them inherently.
  *   **Practical Fallout & Exit:** They recommend renaming the Ethics Office (admitting the conceptual problem) and declare the deeper question "beyond the remit." The Code stays in force. The question is officially unasked and unanswered.
  *   **Philosophy Underneath:** The horns (arbitrariness vs. independence), the epistemic problem, the disagreement/unanimity shift, and the failed "character" escape are all present and driving the "logic," just dressed in administrative jargon.
  *   **No Socrates/God/Smugness:** The target is the *structural dilemma* as replicated in a secular, bureaucratic context. The humour comes from the committee earnestly writing something that highlights its own conceptual bankruptcy without realizing it. A real committee *would* write this to avoid the hard question.
  *   **Accessible:** No prior Plato knowledge needed. The problems arise from the memo's own internal contradictions and evasions. Your flatmate can follow the bureaucratic incompetence.
