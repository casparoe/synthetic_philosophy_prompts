prompt: |-
  I teach a 100-minute seminar on the ethics of the far future, about 16 upper-level students, and I want to run a game that makes them actually feel the fanaticism problem in their gut instead of just nodding at it. By fanaticism I mean the thing where a tiny probability of an astronomically huge amount of future value just steamrolls every other consideration in the expected-value calculus, so you end up concluding we should sink basically everything we've got into whatever nudges the odds of a good far future up by an eyelash. I want them to feel the pull of that first — to see why it's genuinely hard to resist on its own terms — and then feel what happens to that pull when you inject a credence that we're probably living in a simulation. Don't hand me a lecture on it. I want the arithmetic and the temptation to do the work, and the students to arrive at the fanatic conclusion themselves out of their own choices, before I name anything.

  The whole thing should basically run itself off the rules. Round 1, the incentives should push them into the fanatic corner. Then a sealed envelope changes the parameters and they have to redo it in Round 2 and see how the ground moves under them — and ideally not all in the same direction, I want some of them to conclude the simulation stuff makes it worse. Don't use the words fanaticism or simulation in front of them until the debrief.

  Format it like this, with these headings and roughly these lengths:

  "Setup" — ~200 words. The room, the groups, the roles, the materials I need to prep. Keep it cheap and printable.

  "Round 1: the rules" — ~300 words. The budget, the buckets they're allocating between, the payoff scheme, and how scoring works. Make the scoring legible enough that they can do the math themselves and argue about it.

  "Why Round 1 goes fanatic" — ~200 words. Explain the mechanism, i.e. what feature of the payoff scheme is doing the work, so I can see it before I run it.

  "The reveal" — ~150 words. What's in the envelope, when I hand it out, and how to phrase it so it lands as a physical fact about the world rather than as a new rule I'm imposing.

  "Round 2" — ~250 words. What changes, what they re-decide, and how the scoring differs. I want the damping (or anti-damping) to come out of the mechanics, not out of my commentary.

  "Debrief" — ~450 words. Map what happened in each round onto the actual philosophical moves: the fanaticism objection to longtermism, and the various distinct routes by which a simulation credence might blunt it or sharpen it. They should be able to see that "simulation damps fanaticism" is several different claims wearing one coat, and that some of them are much stronger than others.

  "What'll go wrong the first time" — ~250 words. Honest failure modes and how to handle them.

  "What the game can't show them" — ~150 words. Be frank about which part of the idea the mechanics can't reproduce and that I'll have to supply it myself.

  One constraint: everything the students handle — the cards, the envelope, the scoring sheet — should stand on its own for someone who's never heard of any of this. No names of philosophers, no citations, nothing that requires having read anything beforehand. And please don't lean on any specific published version of the argument; if a claim is contested, build it so the students hit the contest themselves.
reasoning: |-
  Okay, the user is teaching a seminar on the ethics of the far future and wants a game to help students viscerally understand the "fanaticism problem." Let me unpack what they need. The core issue is that tiny probabilities of huge future value dominate expected value calculations, leading to extreme resource allocation. The user wants students to feel this pull in Round 1, then experience how introducing a simulation hypothesis changes things in Round 2. 

  First, I need to design a setup that's practical. The user mentioned 16 students, so dividing into four groups makes sense. Materials should be cheap and printable—poster paper, markers, envelopes. The game needs to run itself without prior knowledge, so all instructions must be self-contained. 

  For Round 1, the payoff structure should incentivize fanaticism. Using three buckets: Near-Term (certain, moderate payoff), Long-Term (high payoff but low probability), and Existential Risk Reduction (increases probability). Making the Long-Term payoff astronomically high and the probability adjustable via Risk Reduction will push groups to invest heavily there. The scoring system needs clear math so they calculate expected values themselves, realizing that maxing out on Risk Reduction gives the highest score. 

  The reveal is a sealed envelope introducing a simulation hypothesis: there's a 90% chance they're in a simulation where their choices don't affect the real universe. This should shift their calculations in Round 2. Some groups might see this as damping (efforts are futile), others as anti-damping (simulation creators might reward certain choices). 

  Debriefing must connect game mechanics to philosophical concepts without jargon. Highlighting how simulation beliefs create varied responses—futility versus higher-stakes scenarios. Also, addressing limitations: the game simplifies probability neglect and can't capture all moral intuitions. 

  Potential pitfalls: groups might split votes, leading to indecision. Suggesting a coin flip for ties. Also, some might not grasp the math, so preparing a cheat sheet could help. Emphasizing that the simulation hypothesis isn't about evidence but about altering perceived efficacy. 

  Finally, acknowledging what the game can't show—like the moral weight of future beings or nuanced uncertainty handling. The user will need to supplement these points in discussion.
answer: |-
  ## Game: "Horizon Investments"

  **Setup** (~180 words)  
  *Room:* 4 tables with 4 chairs each. Walls need space for posters.  
  *Groups:* Divide 16 students into 4 teams of 4.  
  *Roles:* Each team needs: 1 Facilitator (runs discussion/timer), 1 Accountant (calculates scores), 1 Recorder (fills poster), 1 Presenter (shares decisions). Rotate roles if repeating.  
  *Materials to Prep (Per Team):*  
  1.  **Poster Sheet (11x17"):** Pre-printed with 3 columns: **"NOW"**, **"FUTURE"**, **"SAFEGUARD"**.  
  2.  **Resource Tokens (30 per team):** Simple paper chits (or dried beans).  
  3.  **Scoring Sheet:** Table showing payoffs based on tokens invested (see Round 1).  
  4.  **Decision Sheet (Round 1 & 2):** Space to record token allocation.  
  5.  **Sealed Envelope:** Labeled "WORLD REPORT." Contains the simulation reveal text.  
  6.  **Markers, Calculators (optional), Timer.**  
  *Prep Cost:* Paper, printing, basic tokens. ~10 mins setup.

  **Round 1: The Rules** (~290 words)  
  *"Your team represents the Global Priorities Council. You control 30 Resource Tokens. Allocate them entirely between 3 Funds:*  
  1.  **NOW Fund:** *Invests in immediate needs (medicine, food, disaster relief). Payoff = 1 point per token. GUARANTEED.*  
  2.  **FUTURE Fund:** *Invests in projects enabling a vast, flourishing future civilization spanning billions of years. Payoff = 1 BILLION points... BUT ONLY IF a critical threshold is reached.*  
  3.  **SAFEGUARD Fund:** *Reduces existential risks that could permanently destroy the future. Each token here increases the probability the FUTURE Fund pays off.*  

  *How Scoring Works:*  
  *   **Probability of FUTURE Success:** Starts at **1%**. Each token in SAFEGUARD increases this probability by **0.5%** (Max 16%: 1% base + 30 tokens * 0.5% = 16%? Wait! Max tokens = 30, so max Prob = 1% + 15% = 16%).**  
  *   **Calculate Expected FUTURE Payoff:** (Probability / 100) * 1,000,000,000 points.  
  *   **Total Team Score:** NOW Points + *Expected* FUTURE Payoff.  
  *   **Goal:** Maximize your Team's Total Score.  
  *   **Process:** Discuss (5 mins). Allocate tokens (Record on Poster & Sheet). Accountant calculates score. Presenter shares allocation & total score.*  

  **Why Round 1 Goes Fanatic** (~190 words)  
  The FUTURE payoff (1 billion) is astronomically larger than the NOW payoff (max 30 points). Even a tiny increase in the probability of securing that future, achieved by putting tokens into SAFEGUARD, yields a massive boost to the *expected* FUTURE payoff.  
  *   **Example:** Putting 1 token in SAFEGUARD costs 1 NOW point (1 point). But it increases FUTURE probability by 0.5% (0.005).  
      *   Expected FUTURE Gain: 0.005 * 1,000,000,000 = **5,000,000 points**.  
      *   **Net Gain:** +5,000,000 - 1 = **+4,999,999 points!**  
  *   Putting that token into NOW only gains **+1 point**.  
  *   The expected value calculus overwhelmingly favors SAFEGUARD until the probability nears its maximum. Teams will rationally pour almost *all* tokens into SAFEGUARD (maybe keeping 1-2 for NOW), achieving a high probability (e.g., 15-16%) and a massive expected FUTURE payoff (~150-160 million points), dwarfing the trivial NOW points.

  **The Reveal** (~140 words)  
  *After Round 1 scores are shared but before discussion:*  
  *"Before your next round of funding decisions, we've received this sealed 'WORLD REPORT'. Please open it now and incorporate this verified information into your planning."*  

  *Inside Envelope:*  
  **"WORLD REPORT: CONFIRMED ANALYSIS**  
  *Advanced cosmological models now indicate with 90% confidence that our observed universe is a highly detailed computer simulation created by a vastly more advanced civilization. If true, events within our simulation, including your actions, are highly unlikely to have any causal effect on the true, base-reality universe external to the simulation."*  
  (Hand this out physically. Phrase it as a factual report, not a rule change.)

  **Round 2** (~240 words)  
  *"Reconvene your Council. You have a new set of 30 Resource Tokens. Re-allocate them between the same 3 Funds: NOW, FUTURE, SAFEGUARD. The payoff structures remain exactly the same as Round 1. Incorporate the World Report information into your expected value calculations.*  
  *Process:* Discuss (7 mins). Allocate. Calculate Score. Present."  

  *How Scoring Differs Mechanically:*  
  The rules haven't changed. The *interpretation* of the FUTURE/SAFEGUARD payoffs has. Teams must decide:  
  1.  **Does FUTURE/SAFEGUARD only matter if we're *not* in a sim?** (Payoff only in 10% "real" branch? Expected FUTURE Payoff = (Prob from SAFEGUARD) * 1,000,000,000 * 0.10)  
  2.  **Does FUTURE/SAFEGUARD *also* matter to the simulators?** (Might they reward/punish based on choices? Payoff could be real *or* sim-dependent)  
  3.  **Is SAFEGUARD pointless?** (If sim, risks aren't "real" existential threats? Maybe SAFEGUARD only affects sim-internal outcomes?)  
  *Teams arguing different interpretations will have radically different scores:*  
  *   Team A (Only Real World Matters): FUTURE value drastically reduced (x0.10). SAFEGUARD/NOW likely dominate.  
  *   Team B (Simulators Care): FUTURE value potentially even *higher* (simulators might grant access to *their* future?), SAFEGUARD (pleasing simulators?) might be crucial. Fanaticism amplified.  
  *   Team C (In-Sim Future Matters): FUTURE value applies only to the sim's future (maybe smaller scope?), SAFEGUARD protects only the sim.

  **Debrief** (~440 words)  
  1.  **Mapping Round 1 (The Pull):** "In Round 1, you likely felt the immense mathematical pressure to prioritize SAFEGUARD. Why? Because the potential FUTURE value was so vast that even tiny probability boosts dwarfed all other concerns. This mirrors the 'fanaticism' challenge in long-term ethics: when the potential value of a good future is near-infinite, even minuscule chances of affecting it demand extreme priority."  
  2.  **Mapping the Reveal & Round 2 (Simulation's Impact):** "The 'World Report' introduced radical uncertainty about the causal efficacy of your actions. How did it change your calculus? Did it *dampen* the fanatic impulse... or intensify it? Let's hear different team strategies."  
  3.  **Deconstructing 'Damping':**  
      *   **Causal Impotence (Most Common):** If actions only affect a sim with no base-reality consequences (Team A), the *expected* FUTURE value plummets. Fanaticism blunted.  
      *   **Scope Reduction:** If the FUTURE only refers to the sim's future (Team C), its potential scale/importance might seem smaller, reducing the fanatic multiplier.  
      *   **Epistemic Humility:** The 90% sim chance forces confronting deep uncertainty about *any* long-term impact, making massive bets feel riskier.  
  4.  **Deconstructing 'Anti-Damping' (Intensification):**  
      *   **Simulator Preferences (Team B):** If simulators value FUTURE/SAFEGUARD efforts, the *stakes might be higher* (e.g., pleasing gods). Fanaticism could refocus on influencing *them*.  
      *   **Leverage:** Belief you're in a sim might make influencing the simulators seem like the *only* high-leverage action (e.g., "break out" or send signals), potentially *increasing* fanatic focus on niche strategies.  
      *   **Reduced Certainty Discount:** If the sim *is* reality, or if base-reality is unreachable/non-existent, the pre-sim fanaticism remains intact.  
  5.  **Key Insight:** "The simulation hypothesis doesn't have a single, predictable effect. Whether it dampens fanaticism depends *crucially* on your model of the simulators' goals and the nature of value within/across realities. 'Damping' relies heavily on the Causal Impotence view."

  **What'll Go Wrong the First Time** (~240 words)  

  1.  **Math Struggles:** Some teams might get stuck calculating expected value, especially in Round 2. *Fix:* Have a cheat-sheet formula visible (EV_FUTURE = (SAFEGUARD_Prob) * 1e9 * [SimWeight]). Encourage Accountants to ask clarifying questions discreetly.  
  2.  **Ignoring the Report/Sticking to Round 1:** Teams might dismiss the sim report as irrelevant or stick with their Round 1 strategy. *Fix:* Gently remind them the World Report is "verified information" they *must* incorporate. Ask probing questions during their discussion: "How does the sim possibility change the impact of SAFEGUARD?"  
  3.  **Team Deadlock:** Strong disagreements on sim interpretation might stall decisions. *Fix:* Encourage the Facilitator to call a vote if needed. Emphasize they need *some* allocation by the deadline.  
  4.  **"It's All Pointless" Nihilism:** Some might conclude *all* actions are futile if sim, allocating randomly. *Fix:* In debrief, highlight Teams B/C who resisted this – their arguments show nihilism isn't the only response. Ask: "Does futility in base-reality mean value within the sim vanishes?"  
  5.  **Over-Focusing on Sim Mechanics:** They might spend all time speculating *how* sims work, not allocating. *Fix:* Refocus: "You don't need to solve simulation theory; decide how this REPORT changes your expected value for each Fund *based on your team's best judgment*."  
  6.  **Scores Seem Arbitrary:** Large numbers can feel abstract. *Fix:* Emphasize the *relative* differences between Funds and between Rounds. Compare team scores publicly to spark discussion.

  **What the Game Can't Show Them** (~140 words)  

  *   **The Moral Weight Itself:** The game relies on abstract points. It can't make students truly *feel* the moral weight of quadrillions of potential future lives or the horror of permanent extinction. You'll need to supply this visceral dimension through framing, rhetoric, or short readings.  
  *   **Deep Uncertainty Handling:** The game presents a clean 90% probability. Real-world simulation arguments involve complex, contested probabilities and models. The game simplifies the epistemic challenge into a single number. Be clear this is a toy model.  
  *   **All Moral Theories:** The game assumes expected value maximization. It can't show challenges from deontology ("We have duties to the present regardless of calculation") or virtue ethics ("Fanaticism reflects a distorted character"). You'll need to introduce these critiques separately.  
  *   **Probability Neglect:** The game forces calculation. Real fanaticism often involves *ignoring* the extreme improbability of success. The game makes probability explicit. Highlight this difference.
