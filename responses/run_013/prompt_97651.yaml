prompt: |-
  Me and my friend got into it for like two hours last night about the restitution case our museum board has to vote on Thursday, and now I have to actually write the memo, so help me out. The case: a mid-sized civic museum holds four carved shrine figures taken in 1897 by a British officer during a punitive expedition, donated to us by his family in 1932. Two claimants. The national government of the country wants them in the national museum in the capital. The priestly lineage from the village they were taken from says they aren't property at all -- they were never meant to be owned or sold, so even the government's "return them to the nation" framing strikes them as the same mistake in a new suit -- and they want them back at the shrine. Trouble is, part of that same community actually wants them kept away from the shrine, because restored ritual use would mean they get worn down or destroyed. Our director's proposal is to transfer legal title to the community but keep the objects here on a renewable long-term loan with shared conservation. Half the board thinks thats real restitution, half thinks its a fudge that just lets us keep holding the goods. I need the written opinion I'll circulate before the meeting: a concrete recommendation with a time frame, the reasoning, and the strongest case for whichever side I come down against, taken seriously rather than knocked down. Skip the Parthenon Marbles and Benin Bronzes boilerplate, I've read all that. What I actually care about is whether title, custody and ritual use can come apart like this, and what we owe the community when they do.
reasoning: |-
  Okay, the user is in a tough spot—they've had a lengthy debate with a friend and now need to write a crucial memo for their museum board's vote on Thursday. The restitution case involves four carved shrine figures taken in 1897 by a British officer and donated in 1932. Two claimants: the national government and the local priestly lineage. The government wants the figures in their national museum, while the priestly lineage insists they aren't property at all and should return to the shrine. But there's a twist—part of the community opposes returning them to the shrine because ritual use would damage or destroy them. The director's compromise is to transfer legal title to the community but keep the objects on loan with shared conservation. Half the board sees this as real restitution; half sees it as a cop-out.

  The user explicitly says they don't want rehashed debates about the Parthenon Marbles or Benin Bronzes—they've already read those. Their real concern is whether title, custody, and ritual use can be separated, and what the museum owes the community when these elements conflict. This is a nuanced ethical and practical dilemma. 

  First, I need to unpack the core tension: the priestly lineage views the figures as inalienable sacred objects, not property, so transferring title might still feel colonial if custody remains with the museum. Yet physical return risks destruction, which even some community members oppose. The director's proposal tries to split the difference, but does it truly respect the community's worldview? 

  The user cares about actionable advice—they need a concrete recommendation with a timeframe, reasoning, and a fair summary of the opposing view. They also want to avoid superficial takes; this demands depth on ritual ontology and custodianship. 

  Hmm... the strongest case against the director's plan is that it centers the museum's conservation priorities over the community's right to decide the objects' fate, even if that means decay. But the strongest case for it is that it prevents irreversible loss while ceding authority. 

  I should lean into the "ritual use vs. preservation" conflict as the heart of the matter. Recommend conditional return to the community with a binding plan for shared custody? That might satisfy both ethics and practicality. Timeframe: 18 months for the community to decide usage, with museum support. 

  For the memo, structure it as: 1) summarize facts neutrally, 2) reject both government claim and pure loan model, 3) propose conditional physical transfer, 4) outline steps. Acknowledge the anti-reversion community members by requiring consensus. Stress that the museum's role shifts from owner to facilitator. 

  ...Wait, is "conditional return" patronizing? Maybe frame it as the community reclaiming agency. The key is ensuring the process isn't extractive. Also, emphasize that conservation concerns mustn't override self-determination—even if objects deteriorate, that's their right. 

  User’s depth suggests they’ll appreciate citing specific frameworks like "post-custodial stewardship" or Harding’s work on ritual integrity. But avoid jargon; keep it museum-board-readable. 

  Finally, the "against" section should genuinely validate the keep-the-loan position: preserving irreplaceable heritage isn't trivial, and shared custody could build trust. But stress that without title transfer, it’s still paternalism. 

  This feels messy because there’s no perfect answer—but leaning into the mess respectfully might be what the user needs.
answer: |-
  Here’s a focused memo recommendation centered on your core ethical dilemma—untangling title, custody, and ritual use while centering the community’s agency. This proposal rejects both the status quo and the director’s compromise, prioritizing the community’s right to determine the objects’ fate, even if that means accepting risk.

  ---

  **MEMORANDUM**  
  **TO:** Museum Board of Trustees  
  **FROM:** [Your Name/Title]  
  **DATE:** [Current Date]  
  **SUBJECT:** Recommended Path for Restitution of 1897 Shrine Figures  

  ### I. Recommendation
  **Vote to transfer full legal title and physical custody of the four shrine figures to the community’s designated representative body (e.g., the priestly lineage council), conditional on their development of a binding stewardship plan within 18 months.**  
  - **Timeframe:** Physical transfer deferred for up to 18 months to allow community consensus-building and planning, with museum-funded logistical/conservation support.  
  - **Stewardship Plan Must Address:**  
    - Whether objects will be used ritually, conserved statically, or both (e.g., rotational use/digital replication).  
    - Mechanisms for inclusive decision-making within the community (including dissenting voices).  
    - Long-term conservation protocols (with optional ongoing museum technical partnership).  
  - **Failure to Reach Consensus:** Title still transfers, but physical custody reverts to the community’s national museum as neutral interim holder (not our institution).  

  ### II. Core Reasoning: Why This Approach?  
  1. **Title and Custody Must Align with Ontology:**  
     The priestly lineage correctly asserts these are not "property" but sacred entities with prescribed relationships to their community. Transferring legal title without custody (as in the director’s loan proposal) replicates colonial frameworks by substituting our institutional control for the officer’s. True restitution requires relinquishing *both* legal and physical dominion.  

  2. **The Community’s Right to Determine Ritual Use (and Risk):**  
     Whether ritual use causes "damage" is a Western conservation concern. For the originating community, wear may signify sacred efficacy, not loss. Denying physical return to preserve material integrity prioritizes our values over theirs. The dissenting minority within the community must be heard *within their own deliberative processes*, not by us imposing our solution.  

  3. **"Shared Conservation" as a Last Resort, Not a Default:**  
     The director’s loan proposal mistakes technical partnership for justice. Keeping custody here, even with shared title, makes the museum the de facto arbiter of the objects’ meaning and safety. This is paternalism, not partnership. If the community *chooses* a conservation-focused path post-restitution, collaboration is ethical; imposing it preemptively is not.  

  4. **Rejecting the National Government Claim:**  
     The national museum’s claim, while legally tidy, ignores the community’s non-property-based relationship to the figures. Returning them to a state institution (rather than the shrine) satisfies neither claimant and risks perpetuating cultural erasure by centralizing heritage.  

  ### III. The Strongest Case Against This Recommendation (and Why It Doesn’t Prevail)  
  **The Opposition’s Core Argument:** *"Transferring custody without ironclad conservation guarantees ensures destruction. We have a duty to preserve irreplaceable heritage for humanity, even if it means retaining custody. The director’s loan model is the only realistic way to protect the objects while acknowledging moral debt."*  

  **Why This Argument Is Serious and Respect-Worthy:**  
  - **Material Preservation Matters:** These carvings are unique witnesses to cultural artistry and history. Their irreversible degradation or destruction through ritual use (or inadequate stewardship) is a legitimate, universal concern.  
  - **Intra-Community Dissent Is Real:** Ignoring community members who fear ritual loss risks substituting one form of authoritarianism (colonial) for another (traditionalist). The loan model *appears* to balance all voices.  
  - **Pragmatism vs. Idealism:** The director’s plan is actionable Thursday. Our proposal risks leaving objects in limbo if the community fractures, potentially damaging relationships and objects.  

  **Why It Doesn’t Prevail Ethically:**  
  - **Preservation Cannot Trump Self-Determination:** Framing "humanity’s" right to preserved heritage over the community’s right to practice culture entrenches colonial hierarchies. If the community accepts material loss as intrinsic to the objects’ purpose, our duty is to respect that—not override it.  
  - **Agency Requires Risk:** True restitution means accepting the community might make choices we disapprove of. Mitigation lies in supporting *their* planning process (resources, expertise), not retaining veto power via custody.  
  - **The Loan Model Perpetuates Harm:** Keeping custody undercuts the title transfer’s symbolic weight. It signals we still deem the community incapable of stewardship—a belief rooted in the same paternalism that justified the 1897 looting.  

  ### IV. Practical Implementation  
  1. **Immediate Post-Vote Steps:**  
     - Formalize communication channels with both the priestly lineage and dissenting community representatives.  
     - Allocate funds for community-led consultations (facilitators, translators).  
     - Offer conservation assessments to inform *their* planning.  
  2. **Our Role Post-Transfer:**  
     - Technical advisors (if requested), not decision-makers.  
     - Potential long-term loans *to the community* of replicas for educational display here.  

  **This path accepts that restitution is messy and non-linear. It places trust in the community’s capacity to navigate their own tensions, recognizing that justice requires surrendering control—not redesigning it.**  

  ---  
  **Vote Recommendation:** Approve Conditional Restitution with Custody Transfer.
