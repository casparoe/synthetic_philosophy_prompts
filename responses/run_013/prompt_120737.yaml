  ### Raven Paradox Decision Tree

  Answer the following questions to navigate the logical space of the Raven Paradox. Each branch addresses what a green apple (non-black, non-raven) does as evidence for "all ravens are black." Every leaf names a position (or flags incoherence) and its core awkward commitment.

  ---

  **Start:**  
  **Q1.** Does the green apple *confirm* "all ravens are black" at all?  
  - **No** → Go to Q1A  
  - **Yes** → Go to Q2  

  **Q1A.** What must you reject?  
  - **Reject "Positive instances always confirm"** → **Leaf 1: Falsificationism**  
    *Awkward: Must explain why observing a black raven seems to support the hypothesis.*  
  - **Reject "Logically equivalent hypotheses share evidence"** → **Leaf 2: Formulation Sensitivity**  
    *Awkward: Allows evidence to treat "all ravens are black" differently than its logical twin "all non-black things are non-ravens."*  
  - **Reject "The hypothesis is only about ravens"** → **Leaf 3: Global Universal Hypothesis**  
    *Awkward: Forces "all ravens are black" to be a claim about every object in the universe (e.g., apples, chairs).*  

  **Q2.** Does the *sampling procedure* matter (e.g., random object vs. raven-seeking)?  
  - **Yes** → **Leaf 4: Sampling Theory**  
    *Awkward: If you found the apple while looking for ravens, it doesn't count as evidence at all.*  
  - **No** → Go to Q3  

  **Q3.** Does the green apple *also confirm* "all ravens are white" (since it’s non-white and non-raven)?  
  - **Yes** → Go to Q4  
  - **No** → **Leaf 5: Incoherent Rejection**  
    *Awkward: Denies logical equivalence (the apple supports "all ravens are black" but not its structural mirror "all ravens are white").*  

  **Q4.** How do you resolve confirming *both* "black" and "white" ravens?  
  - **"The apple confirms both, but negligibly"** → **Leaf 6: Negligible Confirmation (Bayesian)**  
    *Awkward: The apple technically supports the hypothesis, but so weakly it’s meaningless (e.g., 1-in-10²⁰ boost).*  
  - **"Background knowledge breaks symmetry"** → **Leaf 7: Background Saves**  
    *Awkward: The same apple simultaneously supports conflicting hypotheses; you dismiss one due to prior assumptions (e.g., "ravens can’t be white").*  

  ---

  ### Key Notes:
  - **Empty Branches:**  
    - *Q3 → "No" (Leaf 5) is incoherent*: The green apple identically satisfies the logical form of both "all ravens are black" and "all ravens are white" (via their contrapositives). Denying this breaches equivalence.  
    - *No "unnamed" leaves*: All logical positions are covered; Leaf 5 is incoherent and undefended.  

  - **Indistinguishable Positions:**  
    - **Leaf 6 (Negligible Confirmation)** and **Leaf 7 (Background Saves)** often overlap. Bayesians (Leaf 6) *use* background knowledge to make confirmation negligible, but Leaf 7 treats background as primary even if confirmation isn’t tiny. They differ in emphasis, not verdict.  

  - **Reader Guidance:**  
    - "Confirm" = *Raises probability* (per standard use).  
    - "Logical equivalence" = "All ravens are black" ⇔ "All non-black things are non-ravens."  
    - "Sampling procedure" = Did you pick an object randomly, or seek ravens specifically?  

  ### Tree Summary:
  | Leaf | Position                        | Core Awkward Commitment                                                                 |
  |------|---------------------------------|-----------------------------------------------------------------------------------------|
  | 1    | Falsificationism                | Why does a black raven seem to support the hypothesis?                                  |
  | 2    | Formulation Sensitivity         | Evidence treats logically identical hypotheses differently.                             |
  | 3    | Global Universal Hypothesis     | "All ravens are black" must describe apples, chairs, etc.                               |
  | 4    | Sampling Theory                 | An apple found while raven-hunting isn’t evidence—even if identical to a random apple. |
  | 5    | Incoherent Rejection            | Denies logical equivalence between mirror-image hypotheses.                             |
  | 6    | Negligible Confirmation         | Evidence is technically real but irrelevant (e.g., 0.0000001% probability increase).    |
  | 7    | Background Saves                | The same apple confirms conflicting hypotheses; you ignore one.                         |

  ### Flowchart Structure:
  - **Branch Nodes:** 5 (Q1, Q1A, Q2, Q3, Q4).  
  - **Leaves:** 7 (all named, no unexplored positions).  
  - **Pathways:**  
    - **No confirmation** (Q1 → Q1A → Leaves 1–3).  
    - **Confirmation with sampling dependence** (Q1 → Q2 → Leaf 4).  
    - **Confirmation without sampling dependence** (Q1 → Q2 → Q3 → Q4 → Leaves 6–7).  
    - **Incoherence** (Q1 → Q2 → Q3 → Leaf 5).  

  This tree isolates *why* positions disagree—not who held them—using intuitive, non-technical splits. The green apple’s role as a "double agent" (Q3/Q4) and sampling (Q2) drive key forks.
