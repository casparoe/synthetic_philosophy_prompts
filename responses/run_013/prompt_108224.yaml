  I should flag where ordinary language misleads: "locked in" feels monolithic but contains distinct claims. For instance, "no better alternative exists" (#4) is substantively different from "we can't coordinate change" (#3). The user’s suspicion about incompatibility is sharp—their friend might conflate historical accident with present inevitability, which are only compatible in the weakest readings (#1-2). 

