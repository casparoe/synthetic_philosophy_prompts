    1: Akrasia is real -> survives.
    2: Revised to: the discounting function is the mechanism, but it is a source of irrationality and not the whole story (because we need intentions to counter it). 
    3: Reasons do not decay -> survives.
    4: Intentions are constitutive -> survives and is central.
    5: One agent -> survives.
    6: Both verdicts survive.

   Alternatively, if we don't revise 2, we might have to drop 3. But 3 seems central to the methodological conviction (must be recognizable from the inside: the agent feels he is making a mistake). 
   Since the bottom line of the methodological conviction is that the account must make sense of the struggle, dropping 3 would make discounting rational, which might not capture the sense of error.

   Step 4: Undecided issues.

   - The nature of the mistake: is it a failure of rationality (as per 3) or merely a conflict that is resolved by the discounting? 
     But 3 already says it is a mistake.

   - How exactly intentions work: are they just a psychological tool or do they have normative force? 

   However, the main undecided issue might be: 
     How to reconcile the discounting model (which is descriptive) with the normative claim of 3? We have to decide whether the discounting function is a rational response to time or not.

   Step 5: Confidence.

   Confidence level: 0.8. The analysis hinges on the interpretation of the discounting model and the role of intentions. What would move it? A clearer account of how intentions function without invoking multiple selves and how they relate to the discounting model.

