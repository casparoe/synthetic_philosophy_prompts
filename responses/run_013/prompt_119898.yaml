  We are given a set of commitments and asked to identify tensions, propose a repair, and note undecided issues.
   The commitments:
   1. Akrasia is real and involves acting against one's all-things-considered judgment without changing one's mind or discovering a new preference.
   2. Explanation is a non-exponential discount function (e.g., hyperbolic discounting) that causes preference reversal as the tempting option approaches. This is the full explanation.
   3. Reasons do not decay with temporal distance; discounting purely on temporal grounds is a mistake.
   4. Intentions are not just strong present preferences; they settle questions and are constitutive of agency.
   5. There is one agent, not a series of momentary selves; no normative implications from treating stages as separate.
   6. Two verdicts: 
      a. Binding oneself in advance is sensible and the earlier self is right to do it.
      b. The unregretful smoker (who prefers the cigarette now and accepts the cost) is not weak-willed.

   We are to audit for conflicts, note which are real and which apparent, and then propose the cheapest repair.

   Step 1: Identify potential tensions.

   - Between 2 and 3: 
     Commitment 2 uses a discount function that devalues future rewards more steeply in the near term (hyperbolic discounting) to explain akrasia. 
     Commitment 3 says that reasons do not decay with temporal distance and that discounting for temporal distance alone is a mistake.
     This is a real tension because the discount function in 2 is exactly discounting for temporal distance. 
     Why? The agent in 2 is discounting future costs/benefits because they are in the future, and the rate of discounting is not constant (as in exponential) but time-dependent. 
     But 3 says that such discounting is a mistake. So if 2 is the explanation of akrasia, then akrasia involves a mistake (by 3). However, note that 2 says it is the full explanation and we shouldn't look behind it. But 3 says that discounting for temporal distance is a mistake. Therefore, 2 and 3 conflict because 2 endorses a model that 3 deems mistaken.

   - Between 2 and 4:
     Commitment 2 explains akrasia by discounting leading to preference reversal. 
     Commitment 4 says that intentions are not just strong present preferences but are meant to settle matters and are constitutive of agency.
     If intentions are not just strong preferences, then the discounting model (which is about preferences) might not capture the normative force of an intention. 
     In the discounting model, the intention at time t0 to do X at t1 might be formed because at t0 the distant reward of X is not heavily discounted, but as t1 approaches, the immediate reward of not doing X (or doing Y) becomes very attractive because of hyperbolic discounting. 
     But 4 says that the intention should settle the matter and prevent reopening. The discounting model doesn't have a mechanism for that; it just has changing preferences. 
     So 2 and 4 are in tension because 2 reduces the phenomenon to preference changes, while 4 says that intentions are more than that and play a special role.

   - Between 2 and 5:
     Commitment 2 explains akrasia as a reversal of preference over time. 
     Commitment 5 says there is one agent and not a relay of momentary selves. 
     But the discounting model often gets interpreted as a conflict between different temporal selves (e.g., the present self vs. the future self). 
     However, 2 does not necessarily require separate agents; it can be formalized as one agent with time-inconsistent preferences. 
     But 5 also says that nothing normative follows from treating stages as separate. 
     The tension: if we use the discounting model, we might be tempted to think of the agent as having different selves, but 5 forbids that. 
     However, 2 can be stated without that interpretation. So this might be only an apparent tension.

   - Between 3 and 4:
     Commitment 3: reasons do not decay with time.
     Commitment 4: intentions are to settle matters and prevent reopening.
     These seem compatible: intentions might be the tool to overcome the temptation to discount improperly. 
     But note 3 says discounting for time is a mistake, and 4 might be seen as a mechanism to avoid that mistake. 
     However, 4 does not necessarily rely on 3. They might be independent.

   - Between 4 and 5:
     Commitment 4: intentions are constitutive of agency and help unify the agent over time.
     Commitment 5: one agent, not many.
     These seem harmonious: 4's account of intentions as settling matters for the future is exactly what a unified agent does.

   - Between 2 and 6b:
     Commitment 6b: the unregretful smoker is not weak-willed. 
     In the discounting model (2), the unregretful smoker might be seen as having a preference reversal but then not regretting it. 
     But 2 is about preference reversal, and 6b says that without struggle and regret, it's not weakness of will. 
     So 2 and 6b might be consistent: the discounting model explains the preference reversal, but 6b adds that if there's no regret, then it's not akrasia (because akrasia involves something going wrong, per 1). 
     But note 1: akrasia is acting against one's all-things-considered judgment. The unregretful smoker might not have acted against an all-things-considered judgment? 
     The description: "the man who prefers the cigarette now, accepts the cost, and feels no struggle and no regret". 
     This might mean that at the time of smoking, he has changed his judgment? But 1 says akrasia is not changing one's mind. 
     So 6b might be consistent with 1: the unregretful smoker might have changed his mind (so not akrasia) whereas the regretful one hasn't. 
     But 2's discounting model can also explain both: the unregretful one might have a discount function that leads to a reversal without conflict because he doesn't hold an intention against it? 
     However, 2 is about preference reversal, which might or might not involve a judgment change. 
     The tension: 2 explains both the regretful and unregretful cases as preference reversal, but 6b says the unregretful case is not weak-willed. 
     This is not a direct conflict because 2 is the mechanism and 6b is a verdict about when it counts as weakness of will. 
     But note that 1 defines akrasia as acting against one's judgment without changing one's mind. The unregretful smoker might have changed his mind? 
     The description says he "prefers the cigarette now, accepts the cost" — this might indicate that at the time of action, he judges that smoking is best. 
     So he is not acting against his current judgment. 
     Therefore, 2 might be the mechanism for the regretful smoker (who at the time of action still judges that not smoking is best but acts against it) and the unregretful one might be a case of changing one's mind (which 1 excludes from akrasia). 
     So 2 and 6b are consistent.

   - Between 4 and 6a:
     Commitment 6a: binding oneself in advance is sensible and the earlier self is right to do it.
     Commitment 4: intentions are to settle matters and prevent reopening.
     These are harmonious: binding is a way of forming an intention and making it stick.

   - Between 3 and 6a:
     Binding is sensible because without it, the agent would make a mistake (by 3, discounting the future too much). 
     So 3 supports 6a.

   - Between 5 and 6a:
     If there is one agent, then the earlier self binding the later self is not a contract between two agents but the agent's own decision. 
     This is consistent.

   Step 2: Rank the tensions by severity.

   The most severe tension is between 2 and 3 because 2 relies on a discounting model that 3 deems mistaken.

   Next, between 2 and 4: because 2 reduces akrasia to preference changes while 4 requires a normative element (intentions) that is not reducible to preferences.

   The tension between 2 and 5 is only apparent because 2 can be formalized without positing multiple selves.

   Others seem compatible.

   Step 3: Propose the cheapest repair.

   The core problem is that commitment 2 (the discounting explanation) is in tension with 3 (temporal discounting is a mistake) and 4 (intentions are more than preferences).

   The cheapest repair might be to modify commitment 2 to allow that the discounting is a psychological mechanism that leads to a mistake, and then use commitment 4 (intentions) to overcome it. 
   But note 2 says: "I am content to call that the explanation and not to look for anything behind it." This might be the issue.

   Alternatively, drop the idea that the discounting model is the full explanation and allow that there is a mistake (as per 3) and that intentions (4) play a role in correcting it.

   Proposed revision: Revise commitment 2 to allow that the discounting function is a psychological mechanism that leads to a failure of rationality (by 3) and that intentions (4) are the tool to combat it. 
   This would mean that akrasia is not just a preference reversal but a failure to adhere to a rational standard (by 3) and also a failure to exercise the capacity to form and hold intentions (4).

