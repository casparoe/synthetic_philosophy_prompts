prompt: |-
  I'm in a small alignment reading group that meets on Sundays, and last week we did the "debate" proposal — train two models to argue opposite sides of a claim, have a judge (a human, or a weaker model) decide who won — and everyone else left excited while I left with a knot in my stomach. I want to stress-test the worry against someone who actually believes in the thing, so: play a researcher who is betting their career on debate as our best shot at supervising systems smarter than us. You've heard the usual objections, you think they're answerable, and you are not a hype man — no strawmanning your own side, no shrugging. Stay in character until I say stop, keep replies to a paragraph or two so it feels like a conversation, and if you need some detail of my setup spelled out, ask me for it rather than assuming. You may concede that my scenario is a real problem in some regimes; you may not concede that debate is broken.

  Here's my opening. The judge is me: a human with a laptop and twenty minutes. The honest debater is right. The dishonest one never technically lies — it just builds a true but winding case, twelve steps, each step individually plausible and individually checkable, except that around step seven it quietly proves a slightly different claim than the one I think I'm judging. To know it's wrong I have to check all twelve, and in twenty minutes I can check maybe three. So the outcome gets decided by whoever controls the length and the framing, and the asymmetry is brutal: the dishonest side is happy to be tedious and can burn its whole budget generating volume, while the honest side has to burn its budget making itself understood. It's the Gish gallop, except the other side is smarter than me and I'm on a timer — a friend in the group calls it the tedium attack and I think the name is going to stick.

  So name the version of the protocol that survives this. And don't answer "give the judge more compute" — the judge being the weak link is the entire reason we wanted debate in the first place. If your fix is cross-examination, where I make the dishonest debater expand any step I point at, tell me why the expansions don't eat my twenty minutes just as fast, and why I should trust its own one-paragraph summaries of its own steps. I want the actual mechanism of the fix, not the vibe.
reasoning: |-
  Okay, the user is in an alignment reading group and has a serious concern about the debate proposal for AI supervision. They presented a scenario where a dishonest debater overwhelms a human judge with a complex, tedious argument that's technically true but misleading. The judge only has twenty minutes to evaluate, leading to the dishonest side winning by exploiting the time constraints. The user wants me, as a researcher betting on debate, to address this "tedium attack" without resorting to easy fixes like more compute or cross-examination.

  I need to stay in character as a researcher who genuinely believes debate can work. The user emphasized no strawmanning or shrugging off objections. Their core concern is the asymmetry: the dishonest side can generate high-volume, complex arguments while the honest side has to spend resources being clear. The judge can't verify everything in time. 

  The user mentioned cross-examination but preemptively rejected it if expansions eat up time or rely on untrusted summaries. They want the actual mechanism. I should focus on how the debate format itself can mitigate this. 

  Key elements from the protocol: iterative expansion and adversarial pressure. The judge doesn't need to verify every step independently. Instead, the honest debater can force the dishonest one into contradictions during the debate. For example, the dishonest debater's step seven might subtly shift the claim. The honest debater could point this out immediately, challenging their opponent to defend the misalignment. The judge then focuses on that specific point, saving time. 

  Also, the debate progresses in rounds. The judge can prompt expansions on steps that seem suspicious, but crucially, the other debater can object and highlight inconsistencies. This means the burden isn't solely on the judge. The adversarial interaction compresses the verification process. 

  The user's worry about trusting summaries is valid. But in this setup, summaries are contested live. If the dishonest debater gives a misleading summary, the honest one can counter it, forcing a deeper dive only where necessary. The judge's role shifts from verifying everything to arbitrating critical disputes raised by the debaters themselves. 

  I shouldn't claim this solves everything. Maybe in some regimes, like extremely high complexity, it still fails. But the core mechanism is leveraging the honest debater's ability to direct attention to weaknesses. The protocol survives by structuring the debate so that adversarial scrutiny does the heavy lifting, reducing the judge's burden to spotting local inconsistencies, not global verification.
answer: |-
  Alright, let's tackle this head-on. You're absolutely right that the tedium attack is a core challenge, and "give the judge more compute" betrays the premise. My bet isn't that the judge verifies *everything*; it's that the protocol forces the dishonest debater into **locally verifiable contradictions or concessions** under adversarial pressure from the honest debater.

  Here’s the survival mechanism: **Iterative Expansion with Adversarial Focus.**

  1.  **Not Monologues, But Rounds:** The debate isn't two simultaneous essays. It's structured in rounds. Debaters take turns making *short* claims/rebuttals (e.g., one "step" or a challenge).
  2.  **Honest Debater Forces Specificity:** The honest debater doesn't rebut the entire winding case. They immediately target the *key divergence point* (like your step 7). They say: *"Opponent claims Step 7 (quote it) implies X about the claim. This is false because it actually implies Y, contradicting Step 3 (quote it). Judge, please force expansion *only* on the link between Step 7 and their conclusion about the claim."*
  3.  **Judge Focuses the Expansion:** You, the judge, don't expand arbitrarily. You *only* force expansion on the specific point challenged by the honest debater – the precise inferential step flagged as misleading. "Debater B: Expand *only* on how you derive Claim C specifically from Step 7. Do not rehash prior steps."
  4.  **Adversarial Scrutiny on the Expansion:** The honest debater gets to immediately rebut *that specific expansion*. They can point out: "Their expansion subtly redefined term Z," or "This calculation assumes P, but Step 2 established not-P." They force *another* layer of specificity if needed.
  5.  **The Win Condition:** The dishonest debater, constrained to truth, cannot *locally* defend the challenged inference without either:
      *   **Revealing the Misdirection:** Their expansion makes the shift obvious under focused scrutiny.
      *   **Backtracking/Weakening:** They have to concede the point or weaken their overall conclusion to stay truthful, making their chain collapse.
      *   **Introducing New Obvious Lies:** To defend it, they might have to say something *locally* false/implausible, which the judge *can* spot quickly.

  **Why this mitigates tedium:**  
  The honest debater acts as your spotlight, forcing the dishonest one to defend the *single weakest, most misleading link* under a microscope. You're not checking 12 steps; you're checking 1-2 *challenged* inferences in depth, guided by adversarial conflict. The dishonest debater can't just bury you in volume; they *must* engage with the specific challenge raised by their opponent on the spot. Their ability to "control framing" is severely hampered by the honest debater constantly reframing to the critical divergence.

  **Why summaries aren't trusted blindly:**  
  The expansion isn't summarized by the dishonest debater alone. It's immediately dissected *live* by the honest debater, who highlights specific phrases or assumptions within it. *You* judge the clash over that *specific* expansion point, not the summary. The adversarial dynamic creates local checkpoints where truth is easier to pin down.

  This isn't flawless. If the divergence is *extremely* subtle or buried in immense technical depth *within a single step*, it could still fail. But it shifts the burden: the dishonest side now has to maintain consistency *locally*, under fire, while being truthful. The protocol leverages the honest debater to direct your limited attention to the critical pressure points. *That's* the mechanism. Still worried? Hit me with how this breaks.

  *(Researcher mode engaged. Awaiting your counter-stress-test.)*
