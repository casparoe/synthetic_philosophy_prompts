answer: |-
  Contributors are morally responsible for harm H because their acts are components of its compositional cause, and responsibility arises from being part of the minimal sufficient set for H, not from marginal difference-making.

  First, an act is a *component* of a harm when it is a discrete, necessary element within a *minimal sufficient set* for that harm, where the harm is *constituted* by the collective occurrence of the set's elements. Composition differs from mere aggregation in that composition requires interdependence: the harm H exists solely in virtue of the specific configuration of components reaching a threshold, where each component in the minimal set is non-redundant for that configuration. In aggregation, parts combine additively without a threshold-dependent structure; removing one part diminishes the result incrementally but does not negate it entirely if others remain. Here, H occurs only if T contributions exist—it is an emergent outcome defined by the threshold-crossing set. Each contribution is a constitutive part of H, not a separable cause of it. Your act of contributing is not causing H *through* its effects; it is a literal part of what H *is* (e.g., H is "100 tons of carbon emitted," and your emission is one ton within the minimal sufficient set for crossing that threshold).

  Second, responsibility divides proportionally to each contributor's share of the *minimal sufficient set*—the smallest group of contributions that would have sufficed for H. When causal slack exists (N > T), only those contributors whose acts were part of a minimal sufficient set bear responsibility. Each such contributor bears (1/T) of the responsibility for H. This is not arbitrary because the minimal set is fixed by the threshold T and the actual sequence of contributions: the first T contributors form *a* minimal sufficient set (assuming temporal priority or some non-moral ordering like time of action). Counterfactually, if any one of them had not contributed, H would not have occurred (since N=T exactly only if all T contribute). The excess contributors (beyond T) bear no responsibility for H because their acts were not necessary for any minimal sufficient set; H would have occurred without them. Their inclusion is redundant. This division is objective: it depends on the actual threshold and which acts crossed it first, not on subjective intentions.

  Third, it is true that your responsibility for H depends on others' choices and group size. If you contribute when fewer than T-1 others contribute, your act is not part of any minimal sufficient set (since H needs T, and you alone are insufficient). If you contribute when exactly T-1 others contribute, your act *is* part of the minimal set and you bear (1/T) responsibility. If you contribute when many others contribute beyond T, your responsibility depends on whether you were among the first T. But this does not make the *wrongfulness* of your act depend on others. The act-type "contributing to a harm-inducing undertaking" is wrongful in itself because it is an intentional participation in a collective endeavor known to cause harm. The *degree* of responsibility for the *actual harm* H, however, varies with context, just as firing a gun is wrongful whether it hits or misses, but your responsibility for a death depends on whether your bullet was the lethal one among many. Your blameworthiness for the *act* remains constant, but your share of responsibility for H scales with your constitutive contribution to it. This is no more paradoxical than a sniper being fully responsible for a killing only if their bullet struck first, even if others fired simultaneously.

  A decisive refutation would demonstrate that moral responsibility *necessarily* requires an act to make a counterfactual difference to the outcome, and that compositional harms reduce to productive causation. If it could be shown that H is not ontologically distinct from its causes—that "100 tons emitted" is just shorthand for "ton1 + ton2 + ... + ton100," where each ton independently causes incremental damage—then the compositional view collapses. Ordinary cases often differ: a single vote may involve coordination or pivotal possibilities; a purchase might enable future harms incrementally; a flight's emissions blend aggregation and composition. But where harms are strictly threshold-defined, contributions are indistinguishable and uncoordinated, and outcomes are binary (e.g., passing a pollution threshold that triggers ecosystem collapse, where collapse occurs identically at 100 tons regardless of source), the structure holds. The inefficacy objection gains force only if we misapply productive causation to compositional harms.

  I am moderately confident in this argument, but the step I defend with least conviction is the claim that the *minimal sufficient set* is non-arbitrary in cases of causal slack—specifically, that temporal priority objectively fixes membership when contributions are indistinguishable.
