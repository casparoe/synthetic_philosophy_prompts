prompt: |-
  I run the smallholder agriculture portfolio at a mid-sized foundation -- irrigation, seed, market access, about 30 grants a year across the Sahel and South Asia -- and I write the recommendation the board votes on, so if its wrong it's on me. Two weeks ago one of our trustees came back from a holiday with her head full of the argument that the agricultural revolution was the worst thing that ever happened to us: that foragers worked a fifteen-hour week, ate better than the first farmers, and that farming is what bought us hierarchy, famine and bad backs. Her challenge to me was "if farming was a mistake, what exactly are we funding?" She's a former epidemiologist and she doesn't accept vibes. I don't have a framework for this, I've just been pointing at the pumps. Her sharpest point, and the one I can't answer, is that farming may not have made anyone better off, it just made more of us -- and if that's the shape of the thing then half the metrics we use are measuring the wrong quantity.

  What I want from you is a decision procedure I can actually run on a proposal in half an hour, from my desk, using only what's in the proposal and what I already know. No reading list, no citations, I'm not going to go do a PhD. Take whatever is genuinely defensible in that debate -- I know the romantic version is contested, so don't hand me the romantic version -- and turn it into tests I run in order: what each test is asking, what counts as a sufficient answer to it, which tests can end in a flat no, and which ones mean I have to stop and hand the board a values question instead of pretending I can settle it. Then run the procedure on two real-shaped cases. First: a solar irrigation scheme that would roughly triple dry-season yields per household, but it raises the labour each household has to put in, and last time something like this went in the older kids vanished from school for the harvest. Second: a cooperative of women farmers switching a chunk of their land to an export crop -- income up a lot on paper, but the inputs are debt-financed with land as collateral and there are two buyers. I'll tell you now that I want the first one to pass, so if your procedure says otherwise, say so plainly and show me the step where it happened.

  Finish by telling me where this procedure is most likely to be wrong: which step is doing the real work while pretending to be neutral, and what single consideration, if it went the other way, would flip your verdicts on those two cases. And flag anywhere I'd be better off just saying "this is a judgement call, board decides" rather than dressing it up as a test.
reasoning: |-
  Okay, the user runs a smallholder agriculture portfolio at a foundation focusing on irrigation, seeds, and market access in the Sahel and South Asia. They write recommendations for the board, and if wrong, it's on them. A trustee challenged them after a holiday, questioning if farming was a mistake, citing foragers' better diets, less work, and avoiding hierarchy and famine. The trustee is an epidemiologist who demands evidence, not vibes. The core issue is whether farming just increased population without improving well-being, making current metrics flawed. The user needs a practical decision procedure to evaluate proposals in 30 minutes using only the proposal and existing knowledge. No deep research—just actionable tests.

  The user presents two cases: a solar irrigation project that boosts yields but increases labor and pulls kids from school, and a women's cooperative switching to an export crop with debt risks. They prefer the first project but want an honest assessment. The procedure must have clear steps: questions to ask, pass/fail criteria, and when to flag values for the board. The user also wants to know where the procedure might be biased and what could flip the verdicts.

  First, I need to unpack the trustee's argument. The core is that farming may not have improved individual well-being but allowed population growth. So, the foundation's work might be enabling more people at lower well-being rather than improving lives. The user needs tests that check if a proposal actually improves well-being per capita, not just output or income.

  Building the decision procedure. The key is to focus on well-being metrics beyond yield. Tests should assess labor burden, equity, risk, education, health, and autonomy. Each step must be binary or have clear criteria. Steps that can be a flat "no" involve harm or increased inequality. Values questions arise when trade-offs between population and well-being emerge.

  For the solar irrigation case: Tripling dry-season yields sounds great, but increased labor and kids leaving school are red flags. The procedure should catch if the additional labor is manageable and if education loss is mitigated. The user wants this to pass, so the tests need to address labor efficiency and education safeguards.

  For the women's cooperative: Higher income is good, but debt with land collateral and only two buyers creates vulnerability. Tests here should assess risk exposure, market power, and fallback options. This might fail if risks aren't mitigated.

  Identifying biases: The procedure might assume that well-being is measurable through labor, education, etc., but misses cultural or subjective factors. Also, focusing on per capita well-being ignores potential long-term benefits of population growth. For the irrigation case, if labor-saving tech were included, it might pass. For the cooperative, if buyer competition increased, it could flip.

  Finally, flagging judgment calls: When trade-offs involve core values (e.g., short-term education loss vs. long-term income), the board should decide. The procedure should clearly indicate when it's beyond objective assessment.
answer: |-
  Here's a field-tested decision procedure addressing the trustee's challenge, designed for operational use. It assumes defensible core truths from the "farming as mistake" debate: **1) Farming increased population density but not necessarily individual well-being; 2) Intensification often increased labor burden and risk; 3) Power hierarchies frequently emerged alongside surplus.** The goal is to filter proposals that *genuinely improve smallholder well-being per capita* rather than just increasing output or population density.

  **The Decision Procedure: "Well-being vs. Density" Filter**

  Run these tests sequentially. Stop at any "NO" or "Values Question." Answer must be supported by evidence *in the proposal itself* or your verified prior knowledge.

  1.  **Test: Labor Burden Shift**
      *   **Asks:** Does this intervention *decrease* average hours of physically taxing labor per working-age adult? Or does it increase labor without commensurate benefit? (Acknowledge seasonality).
      *   **Sufficient Answer:** Proves net labor reduction *or* neutral burden *or* increased burden is offset by clear, significant gains in other well-being areas (Test 2) AND is voluntary/desired. **NO if:** Clear evidence labor burden increases significantly with no offsetting well-being gains or against stated preferences.
      *   **Values Question?** No. Labor burden is a core well-being metric.

  2.  **Test: Multi-Dimensional Well-being Gain**
      *   **Asks:** Does the proposal provide evidence for tangible improvement in *at least two* of these areas *for the direct beneficiaries*: **Nutritional Diversity** (not just calories), **Health Resilience** (e.g., reduced disease, better sanitation access), **Economic Security** (e.g., reduced debt risk, asset building, reliable income), **Autonomy/Control** (e.g., decision-making power, reduced vulnerability to exploitation), **Time for Non-Subsistence Activities** (e.g., education, care, community, rest)?
      *   **Sufficient Answer:** Clear, plausible pathways described for improvements in 2+ areas. Evidence from pilots, similar contexts, or detailed logic chains acceptable. **NO if:** Focuses solely on total yield/total income without addressing distribution, diversity, security, or autonomy. **Values Question?** If trade-offs between well-being dimensions are severe (e.g., huge income gain requires severe health risk) *and* beneficiaries haven't clearly chosen this trade-off.

  3.  **Test: Risk Exposure**
      *   **Asks:** Does the intervention *decrease* the household's vulnerability to catastrophic loss (debt spirals, land loss, famine) or significant exploitation? Or does it introduce new major risks?
      *   **Sufficient Answer:** Shows reduced exposure to existing major risks (e.g., drought, price volatility) *or* robust mitigation for new risks introduced (e.g., insurance, diversified markets, technical safeguards, collective bargaining power). **NO if:** Significantly *increases* unmitigated risk exposure (e.g., high debt collateralized on land with volatile markets). **Values Question?** No. Risk reduction is fundamental to well-being.

  4.  **Test: Power Dynamics & Leakage**
      *   **Asks:** Does the intervention strengthen the position (bargaining power, control, asset base) of the *smallest holders* relative to existing power structures (traders, lenders, landlords, even household hierarchies)? Or does it risk value extraction by others?
      *   **Sufficient Answer:** Explicit design features empowering smallholders (e.g., co-op ownership, transparent pricing, women's control over proceeds, access to market info, legal support). **NO if:** Clearly funnels benefits primarily to intermediaries, lenders, or reinforces exploitative structures *without* countervailing measures. **Values Question?** If the intervention requires working within/strengthening an inequitable system *as the only pathway* to well-being gains. Board must decide if ends justify means.

  5.  **Test: Population Pressure Check**
      *   **Asks:** Is there plausible evidence the intervention could lead to *local* negative Malthusian outcomes (e.g., resource depletion, conflict, falling per capita well-being due to population growth outpacing gains) within the project horizon?
      *   **Sufficient Answer:** Shows consideration of resource sustainability (water, soil) and local carrying capacity. **NO if:** Ignores clear, imminent resource limits likely worsened by the intervention (e.g., unsustainable water extraction). **Values Question?** **YES.** *This is the core trustee challenge.* If all previous tests pass BUT the primary outcome is demonstrably just enabling *more people* at the *same or slightly lower* level of well-being (rather than *better lives*), flag it. The board must decide: "Is enabling more lives at this baseline well-being level part of our mission?" (This is the "shape of the thing" test).

  **Applying the Procedure:**

  **Case 1: Solar Irrigation Scheme (You want Pass)**
  1.  **Labor Burden:** *Likely FAIL initially.* Proposal admits labor increases. Kids leaving school shows significant burden shift onto household. *But...* probe proposal: Does it *enable* labor-saving elsewhere (e.g., reduced water-fetching)? If yes, *maybe neutral*. If purely adds labor, FAIL unless Test 2 provides strong offsets.
  2.  **Multi-D Well-being:** *Requires Scrutiny.* Yield triples - potential for **Economic Security** (more food/income) & **Nutrition** (if diverse crops). BUT: "Older kids vanished from school" threatens **Time/Education** (a well-being dimension!). *Sufficient Answer?* Only if proposal has concrete plan to protect schooling (e.g., staggered planting, harvest support, income used for hired labor) *and* evidence nutrition improves. Otherwise, FAIL.
  3.  **Risk Exposure:** *Likely PASS (Potential Strength).* Irrigation directly reduces drought risk. Check proposal for water source sustainability (Test 5).
  4.  **Power Dynamics:** *Likely NEUTRAL/PASS.* Empowers users with water control. Check if tech creates new dependencies.
  5.  **Population Pressure:** *Requires Scrutiny.* Tripling yield *could* attract more people/intensify pressure. *Sufficient Answer?* Proposal should mention water sustainability assessment. If water source is ample/rain-fed recharge, PASS. If known aquifer depletion risk, Values Question for Board re: long-term per capita impact.

  **Verdict:** **Hinges on Test 1 & 2.** If labor increase is minor/offset AND schooling is protected AND nutrition/income gains are clear, it passes. If labor surge is severe and schooling plummets, it fails Test 1 or 2. **Your preference passes ONLY if the proposal addresses the labor/schooling trade-off.**

  **Case 2: Women's Export Crop Cooperative (Debt, Land Collateral, 2 Buyers)**
  1.  **Labor Burden:** *Unknown.* Proposal likely focuses on income. Needs evidence labor isn't severely increased without gain. If silent, caution, but not automatic NO.
  2.  **Multi-D Well-being:** *Income gain clear* (**Economic Security?**). *Potential* for **Autonomy** (women's co-op). BUT: Critical gaps. Nutrition? (Shift from food crops?). Health? Autonomy threatened by debt/land risk (Test 3).
  3.  **Risk Exposure:** *HIGH RISK / Likely FAIL.* Debt with land collateral + only two buyers = extreme vulnerability to price shocks/buyer collusion. Classic recipe for dispossession. Proposal MUST show strong risk mitigation (e.g., guaranteed price contracts, diversified buyers, insurance, non-land collateral, legal aid fund). If absent, **FLAT NO**.
  4.  **Power Dynamics:** *Ambiguous.* Co-op structure is positive (+Autonomy). BUT: Debt to lenders + oligopsony buyers = high leakage risk. *Sufficient Answer?* Only if proposal details how co-op bargaining power is strengthened against lenders/buyers (e.g., collective contracts, equity stake, buyer competition fostered). Otherwise, likely FAIL.
  5.  **Population Pressure:** *Likely NEUTRAL.* Focus on cash, not necessarily local food production surge.

  **Verdict:** **Likely FAIL at Test 3 (Risk Exposure).** High-risk structure without robust, verifiable mitigation plans is a clear "NO." Even if income jumps short-term, the catastrophic risk undermines well-being. Passing requires radical restructuring of the finance/market access model.

  **Where the Procedure is Most Likely Wrong & Key Levers:**

  1.  **The Hidden Engine: Test 2 (Multi-D Well-being) pretends neutrality.** Defining "well-being dimensions" (Nutrition, Health, Security, Autonomy, Time) is inherently value-laden. Prioritizing these over pure GDP/capita *is* the rebuttal to the trustee. If your foundation valued *only* maximizing calorie production or population density, the entire procedure collapses. **This is the core philosophical stance disguised as a test.**
  2.  **The Single Flipping Consideration:** **Beneficiary Agency & Choice.**
      *   **Solar Pumps:** If the *households themselves*, fully informed of the labor/schooling trade-off, *actively choose* the pumps because they value the income/security more than the kids' schooling *at this time*, and the proposal facilitates *their* choice, it could flip to PASS (assuming other tests ok). Test 2 and 4 become about respecting autonomy and meeting *their* priorities.
      *   **Export Co-op:** If the *women*, understanding the risks, *collectively demand* this model as their best available leverage point to build assets/autonomy *and* the proposal includes powerful, member-controlled risk mitigation (e.g., co-op owns processing, negotiates ironclad contracts), it could flip to PASS. Test 3 and 4 become about supporting their calculated risk-taking with tools.

  **When to Say "Board Decides":**

  1.  **At Test 5 (Population Pressure):** If the intervention clearly enables more people at stable (but not improved) well-being, it's a fundamental values call: Is population support at that baseline part of your mission?
  2.  **Severe Trade-offs in Test 2:** If an intervention delivers massive gains in one well-being dimension (e.g., income) but causes severe harm in another (e.g., health via pesticide exposure, loss of communal land) *and* beneficiaries are divided or coerced.
  3.  **Novel High-Risk/High-Reward:** If an intervention has potentially transformative well-being gains but carries novel, unproven, systemic risks not easily mitigated (e.g., a new GMO, a radical land tenure shift). The procedure errs on caution (likely NO); the board might accept the risk.

  **Conclusion:** This procedure forces you to look beyond pumps and yields to the core question: **"Does this make *these* people's *lives* tangibly and sustainably *better* per person, on multiple fronts, without exposing them to undue harm or exploitation?"** It operationalizes the valid critique of farming's downsides into practical grant screening. For your solar pumps, success hinges on addressing the labor/schooling trade-off demonstrably. The export co-op, as described, fails the risk test decisively. The trustee's challenge is met by making well-being – not density – the non-negotiable currency of your recommendations.
