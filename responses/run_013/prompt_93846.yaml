prompt: |-
  I teach a 90-minute session of an upper-level seminar in decision theory and rational choice — about twenty students, one room, no computers, and they are already bored of the prisoner's dilemma and of Nash equilibrium. I want them to feel, rather than hear about, the force of this idea: when the person across from you is reasoning exactly as you are, your deliberation is no longer about what you will do but about what everyone in your position does, and the right move can flip as a result. I also want them to feel its boundary — to leave having found for themselves that it works only inside a "we" that has been stipulated rather than derived, and that it goes silent the moment the stipulation fails. Do not let the name of the position be spoken in the room until the debrief, and no lecture before the first round.

  Build the activity on this spine, which I have sketched and want you to make runnable. Change it if you can do better, but keep the three-way contrast.

  Payoffs throughout: mutual cooperation, 3 each; mutual defection, 1 each; unilateral defection, 5 to the defector and 0 to the cooperator.

  Round 1, about 8 minutes. Half the students draw a red card at the door and half blue, for no stated reason. Each writes C or D on a slip, for an anonymous one-shot partner. I collect, pair at random, score, and post results by slip number.

  Round 2, about 12 minutes. I announce that the pairing rule has changed: every slip will now be scored against itself. Nobody may revise. Those who wrote D collect 1 and those who wrote C collect 3, from slips already filled in. I then let them write again under the new rule, and we spend a few minutes with two volunteers putting the best case for D and the best case for C on the board — still unnamed.

  Round 3, about 15 minutes, two variants that must be felt as separate steps. (a) The copy is written by someone who drew the other colour: same payoffs, same information, different label. Most will hold that the round-2 argument still runs. (b) I hand out a variant table in which mutual cooperation pays you 3 and your counterpart 1, while mutual defection pays you 1 and your counterpart 3. Now they must write something, and every justification available to them will be a prediction or a bargaining claim rather than the round-2 argument.

  Round 4, if time, about 10 minutes. Treat the room as one public-good game with contribution cost c and per-contributor benefit b. The answer on the diagonal is to contribute just in case nb exceeds c, where n is the number contributing — so the more people there are, the stronger the case for contributing, the reverse of the not-pivotal instinct. Put the threshold on the board, then ask them how likely it is that all twenty of them are the same reasoner, and what happens to those who act as though they are.

  Materials: index cards, slips, a whiteboard, both payoff tables pre-printed, and one small non-monetary prize so the scores matter a little but not enough to make them strategize.

  Then the debrief, about 20 minutes, mapping each round onto a specific claim: choosing a move versus choosing a cell; the difference between the other's sameness as a stipulation and as a prediction; the causal objection that my writing C does not make my copy write C; the reading on which the deliberating subject is the pair rather than the individual, and the standard objection to it; and the reading on which the argument is only an equilibrium refinement that selects a cell on the diagonal and so has nothing to say off it. Include what will predictably go wrong the first time — at minimum, that someone writes a conditional in round 1; that the round-2 reveal lands as a gotcha unless I handle it; that a faction will dig in on the causal objection and I must not settle it for them; that the round-3b discussion will overrun; and that if nobody defects in round 2 there is no tension to work with and I will need a way to seed the case for defection. Be frank about at least one feature of the idea the activity cannot reproduce and that I must supply myself. My own candidate is that the activity hands them a guaranteed duplicate, whereas the argument has to work in the world with no such guarantee; say whether that is the most serious gap or whether something else is.

  At the end, name the position and its origin (the term is Hofstadter's) and say what it does and does not cover. No citations or reading list — I don't want the students sent to the literature, and I would rather you not gesture at sources you cannot check.

  Open with one sentence naming the single design feature the whole activity turns on, then give the design straight through, with no preamble and no restatement of my request.
reasoning: |-
  Okay, the user is designing an activity for an upper-level seminar on decision theory. They want students to deeply grasp the concept that when others reason identically to you, your decision shifts from individual action to what everyone in your position should do. The activity must illustrate this and its limitations without naming the concept until the end. 

  The user provided a detailed spine for the activity with four rounds and specific constraints. I need to make this runnable while preserving the three-way contrast: individual choice vs. symmetric reasoning vs. breakdown of symmetry. Key constraints: no computers, avoid prisoner's dilemma fatigue, don't reveal the concept name ("superrationality") until debrief.

  Hmm, the core challenge is making abstract reasoning visceral. Round 1's random pairing should feel like standard game theory - individual optimization. Round 2's "score against yourself" twist is where the magic happens: students must confront that identical reasoning forces mutual cooperation. But potential pitfalls: if no one defects in Round 2, the tension collapses. Need contingency plans - perhaps plant a defector argument via a volunteer if necessary.

  Round 3 is crucial for boundaries. Part A (different colored cards) tests if students spot that stipulation matters more than prediction. Part B's altered payoff table should make the reasoning crumble - here the "we" breaks because payoffs aren't symmetric anymore. Must design table clearly: mutual cooperation gives asymmetric payoffs (3 vs 1), flipping incentives.

  For Round 4 public goods game, the threshold calculation (contribute iff n*b > c) should highlight how superrationality reverses free-rider instincts. But must emphasize it's fragile - works only if all assume identical reasoning. 

  Debrief needs careful sequencing: map each round to conceptual points, especially why Round 3B fails. Should acknowledge inevitable hiccups: conditional moves in Round 1, students clinging to causal objections. The unbridgeable gap? The activity guarantees identical reasoners, while real life doesn't - that's the frank limitation to admit.

  Materials are simple but payoff tables need precision. Non-monetary prize (e.g., fancy chocolate) keeps engagement light. Timing is tight - will suggest trimming Round 4 if needed.

  Biggest design risk is Round 2 reveal feeling like a gotcha. Mitigation: frame it as "new scoring rule" discovery, not a trick. Also, the color labels in Round 3 must seem arbitrary initially so their irrelevance later lands harder.

  Final touch: debrief should end by naming superrationality (Hofstadter's term) while stressing it's not Nash equilibrium nor universal solution - just a lens that works only within stipulated symmetry.
answer: |-
  Here is the runnable design, turning entirely on **forcing students to confront what happens when "the other" is stipulated to reason identically to oneself**:

  ---

  ### **Materials**
  - 40+ identical slips of paper  
  - Deck of cards (only red/blue needed)  
  - Whiteboard + markers  
  - Pre-printed payoff tables:  
    - **Table 1**: Mutual C: (3,3); Mutual D: (1,1); You C/Other D: (0,5); You D/Other C: (5,0)  
    - **Table 2**: Mutual C: (3,**1**); Mutual D: (**1**,3); You C/Other D: (0,5); You D/Other C: (5,0) *(asymmetric payoffs)*  
  - Small prize (e.g., artisanal chocolate bar)  

  ---

  ### **Round 1: Baseline Choice** (~8 min)  
  1. **Setup**: As students enter, each draws a card (half red, half blue). No explanation given.  
  2. **Task**: *"Write C or D on a slip. This is a one-shot anonymous game against a randomly paired classmate. Payoffs are on Table 1. Submit slips."*  
  3. **Scoring**: Randomly pair slips. Calculate scores. Post results by slip ID (e.g., "Slip 12: 5 points"). Do **not** reveal pairings.  

  ---

  ### **Round 2: The Stipulated Twin** (~12 min)  
  1. **Reveal**: *"New rule: Each slip will be scored against **itself**. No revisions. Scores: If you wrote D, you get 1 point. If you wrote C, you get 3 points."* Add these scores to the board.  
  2. **Reaction**: Let murmurs subside. Then: *"Now, under this new rule, write C or D again on a new slip."*  
  3. **Debate Prep**: Choose 2 volunteers (one who wrote C, one who wrote D in Round 2). Give them 2 min to prepare arguments:  
     - *"Make the strongest case for why your choice is rational."*  
     - Arguments written anonymously on board (e.g., "Case for C: ... / Case for D: ...").  
  4. **Discuss**: Class responds to arguments. **Key facilitation**: Press students to engage each other’s logic.  

  ---

  ### **Round 3: Testing Boundaries** (~15 min, two steps)  
  **Step 3a: The "Different" Twin**  
  - *"Now imagine your slip is scored against a copy written by someone with the **other color card**. Same payoffs (Table 1). Write C or D."*  
  - Collect slips. *"Before scoring: Does the color difference change the argument? Discuss."* Guide toward: *"If reasoning is identical, should label matter?"*  

  **Step 3b: Asymmetric Payoffs**  
  - Distribute **Table 2**. *"New payoffs: Mutual C gives you 3, them 1. Mutual D gives you 1, them 3. Unilateral defection unchanged. Write C or D."*  
  - **Facilitation**: *"What justifies your choice now? Is it the same reasoning as before?"* (Expect: Prediction, fairness, spite. The "twin logic" evaporates.)  

  ---

  ### **Round 4: Public Goods Threshold** (If time, ~10 min)  
  1. *"Whole class: Contribute ($c cost) or not? Each contribution gives $b to every person (including yourself). b=0.2, c=2. Total benefit per contributor: n×b."*  
  2. *"If all reason identically, you should contribute iff n×b > c. With n=20, 20×0.2=4 > 2 → contribute."*  
  3. *"But: How likely is it that all 20 are identical reasoners? What if you’re the only one who contributes?"*  
  4. Vote contribute/not. Discuss divergence from threshold logic.  

  ---

  ### **Debrief** (~20 min)  
  **Map the Rounds**:  
  - **Round 1**: Choosing *your move* (standard rationality).  
  - **Round 2**: Choosing *the cell* (when "other" is stipulated as identical). Forces mutual cooperation.  
  - **Round 3a**: Stipulation vs. prediction. *"Did the color change anything? Why/why not?"*  
  - **Round 3b**: Breakdown of stipulation. Payoff asymmetry → reasoning shifts to prediction/bargaining.  
  - **Round 4**: "We" is fragile. Threshold requires universal identicality → free-rider problem reemerges.  

  **Key Tensions to Surface**:  
  - *Causal objection*: "My writing C doesn’t cause my twin to write C!" → Counter: *"It’s not causal; it’s about what follows from shared premises."*  
  - *Equilibrium refinement*: This logic only selects outcomes where both players do the *same* thing (diagonal cells). Off-diagonal, it’s silent.  

  **Predictable Issues & Fixes**:  
  1. **Round 1 conditional moves** (e.g., "I’ll C if they C"): Ignore. Score literally.  
  2. **Round 2 "gotcha"**: Frame neutrally: *"This isn’t a trick—it’s a different rule."* If no defectors, seed debate: *"Someone could argue: ‘Why not take 5 points?’ How do you answer?"*  
  3. **Causal objection stalemate**: *"Don’t resolve it—what hangs on this?"* → Highlight: *Stipulation* vs. *empirical prediction*.  
  4. **Round 3b overrun**: Cut off debate with: *"So did we just lose our original reasoning tool here? Why?"*  
  5. **Fragile "we"**: If students miss it, ask: *"In Round 2, what made the twin ‘you’? Could you trust a stranger this way?"*  

  **The Unbridgeable Gap**:  
  *"This activity guarantees an identical reasoner. Real life offers no such guarantee. The argument works only if you *presuppose* the ‘we’—it can’t **create** solidarity from nothing. Outside the stipulation, you’re back to predicting others’ minds."*  

  **Closing**:  
  *"This is **superrationality** (Hofstadter’s term). It shows why identical reasoning forces cooperation in symmetric dilemmas. But it’s not a general theory of rationality. It works only within a stipulated ‘we,’ and only on the diagonal."*  

  ---  
  **Total Time**: 8+12+15+10+20 = 65 min (leaves 5 min buffer for transitions).  
  **Critical Checks**:  
  - In Round 2, emphasize: *"You are scoring against your **own** slip."*  
  - In Round 3b, ensure Table 2’s asymmetry is crystal clear (bold font helps).  
  - Prize: Award to highest Round 2 scorer *after* debrief (avoids early strategizing).
