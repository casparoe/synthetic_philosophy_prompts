prompt: |-
  I'm a third-year student in a moral philosophy course and my seminar group has split pretty much down the middle over Taurek's line that the numbers don't count — half of us think that if you can save five people or save one, you save the five, full stop, and anyone who says otherwise is being clever for the sake of it; the other half (me, mostly) think there's something real in the idea that you can't just add people up and that treating the one as a means to the five is the thing that needs justifying, not the thing that gets assumed.

  We've been going round in circles for three weeks and our tutor finally said we should stop arguing and actually write the kind of document an adversarial collaboration would produce. Can you draft it for us? I want it to be something both sides in my seminar could genuinely put their names to, not a compromise that quietly gives the game away to one side.

  What I want in it: first, a numbered list of claims both sides can accept — about what a rescue case is even asking, about what counts as a reason, about what we're allowed to assume about the people involved, about whether this is a question about what's right or about what you could be blamed for. Then the actual points of disagreement, each written in wording that the side holding it would sign off on, not a caricature. Then the cruxes — the sub-questions where, if you settled one, at least one side would have to move. And for each crux, a case or argument that both sides agree is relevant, with each side's prediction about how it comes out written down in advance.

  Here's the thing I really want it hung on. We came up with two cases ourselves and I suspect they're where the real disagreement is hiding. The first one: you can save one person for certain, or press a button that gives a one-in-three chance of saving six people and otherwise saves nobody. The numbers side seems to get its answer by just multiplying, which feels like it's doing aggregation through the back door; the Taurek side seems to have trouble saying anything at all, because there's no determinate group of six you're failing to save. The second one, which I think is nastier: the single person you can save is also one of the people you'd be saving in the larger group — so the bigger option doesn't leave anyone out, it just adds four more on top of the same person. Does the Taurek side have to admit the numbers count here, or does it have a way out? Does the numbers side have to admit there's a case where they don't?

  Also please flag anything you think is just a verbal dispute — where the two sides are using a word like "reason" or "claim" differently and there's no substantive disagreement left once that's fixed. And tell me honestly if one of the two cases is doing no work, because I'd rather cut it than pad the document. Don't worry about citations, I'll add those myself.
reasoning: |-
  Okay, the user is a third-year moral philosophy student dealing with a split in their seminar group over Taurek's argument that numbers don't count in rescue scenarios. They need help drafting an adversarial collaboration document that both sides can endorse. Let me unpack their request.

  First, they want a numbered list of common ground claims. I should identify areas both sides agree on: the setup of rescue cases, the importance of reasons, the irrelevance of personal ties, and the distinction between permissibility and blame. These points are non-controversial and can be listed to build a foundation.

  Next, the points of disagreement. The numbers side emphasizes maximizing lives saved as a moral imperative, while the Taurek side focuses on individual claims and the problem of aggregation. Wording is crucial here—each side's position must be presented as they would articulate it, avoiding caricature. 

  The cruxes are key. The first is whether moral reasons can be aggregated across persons. The numbers side says yes, using the greater good; Taurek says no, focusing on individual reasons. The second crux is about the permissibility of letting die versus causing harm, especially when affecting multiple individuals. Cases like the button press and the overlapping victim will test these cruxes.

  Speaking of cases, the user provided two. The probabilistic button case challenges aggregation. The numbers side uses expected value, while Taurek might reject it, emphasizing actual outcomes. The overlapping victim case is trickier—saving the same person plus four more. Here, the numbers side sees an obvious gain, but Taurek might argue the additional four don't create new claims, or perhaps they do, creating internal tension. I should note if one case is redundant; both seem useful here.

  Verbal disputes need flagging. Terms like "reason" and "claim" might be used differently. Clarifying these could resolve some apparent disagreements. Also, "counting" might mean aggregation for numbers but individual consideration for Taurek.

  The user’s deeper need is to move beyond circular debates and foster productive dialogue. They want a document that clarifies disagreements without bias, helping both sides understand each other. Ensuring the document is balanced and highlights testable cruxes through cases will meet their goal. I should avoid taking sides, present each argument fairly, and structure the cruxes to guide further discussion.
answer: |-
  Here’s a draft adversarial collaboration document structured to meet your requirements, designed for genuine endorsement by both sides. It isolates substantive disagreements, flags verbal disputes, and uses your cases to reveal cruxes:

  ---

  **Rescue Cases: Adversarial Collaboration on Numbers and Individual Claims**  
  *Joint Statement by Seminar Group*

  ### I. Shared Foundational Claims (Common Ground)
  Both sides accept the following as framing the debate:
  1.  **Core Rescue Scenario:** We are considering paradigmatic "rescue cases" where an agent faces a choice between two mutually exclusive actions:
      *   Action A: Saves Group X (size *n*).
      *   Action B: Saves Group Y (size *m*), where *n* ≠ *m*.
      *   All individuals face imminent, identical, and unavoidable death without intervention. The agent bears no prior responsibility for their plight.
  2.  **Moral Relevance of Individuals:** Each individual involved possesses equal moral status and has a strong, non-instrumental claim to be saved.
  3.  **Reasons for Action:** Moral decisions should be guided by reasons. Saving a life is *pro tanto* good and provides a reason to act.
  4.  **No Special Ties:** The agent has no special relationships or obligations to any specific individual involved beyond the general duty to aid.
  5.  **Permissibility vs. Blame:** The primary question is about the *permissibility* of choosing to save the smaller group, not necessarily about *blame* or *praise* for the agent, which may involve epistemic or psychological factors beyond the objective rightness of the act.
  6.  **The Burden Question:** Both sides agree that the core dispute concerns *where the justificatory burden lies*: Does saving the one require justification *against* the alternative of saving the many, or does saving the many require justification *against* the alternative of saving the one?

  ### II. Points of Substantive Disagreement (Stated Adversarially)
  *   **The Numbers Side's Core Claim:** "Given that each individual in the larger group has an equally strong claim to be saved as the individual(s) in the smaller group, and that saving lives is good, the *only* decisive moral reason in such rescue scenarios is to save as many lives as possible. Choosing to save fewer lives when more could be saved, absent special obligations, is impermissible because it fails to respond adequately to the totality of valid claims present and constitutes a needless loss of life."
  *   **The Taurek Side's Core Claim:** "Moral reasons derive from the claims of *individuals*. While saving each person is good, we cannot meaningfully *add* the claim of one individual to the claim of another to create a single, stronger 'group claim' that overrides the claim of an individual not in that group. Saving the one is directly responsive to *that individual's* claim. Saving the five is responsive to *each* of their claims, but choosing this option necessarily involves *failing* to respond to the claim of the one who could have been saved. This failure to respond to the one's claim requires justification; it cannot be assumed that the mere aggregation of numbers provides this justification. The mere fact that five claims exist, while only one is satisfied in one outcome, does not automatically make satisfying the five claims the uniquely permissible act."

  ### III. Cruxes of the Disagreement
  The following sub-questions are pivotal. Resolving any one would force at least one side to significantly revise or abandon a core commitment.

  1.  **Crux 1: Can Moral Reasons Be Aggregated Across Persons?**
      *   *The Question:* Do the individual claims of multiple persons combine to form a single, stronger reason that can outweigh the claim of a single person?
      *   *Numbers Side Prediction:* Yes. The reason provided by the claims of five individuals *is* stronger than the reason provided by the claim of one individual. Saving five rather than one realizes five times the good (preserving life) and responds to five times the number of valid claims.
      *   *Taurek Side Prediction:* No. Each claim generates a reason *for saving that particular individual*. While we have multiple reasons pointing towards saving the larger group, these remain distinct reasons tied to distinct individuals. They do not fuse into a single "super-reason" capable of overriding the distinct reason generated by the single individual's claim in the smaller group. Failing to save the one is a direct failure *to that one person* that needs its own justification, which aggregation cannot provide.
      *   **Relevant Case: The Button Press**
          *   *Scenario:* You can either: (A) Save Person P1 for certain. Or (B) Press a button giving a 1/3 chance of saving six distinct people (P1-P6) and a 2/3 chance of saving no one.
          *   *Numbers Side Analysis:* The expected lives saved by (B) is (1/3 * 6) = 2, which is greater than the 1 life saved by (A). Action (B) is therefore required. This demonstrates that aggregation (here, via expected value) is fundamental, even probabilistically.
          *   *Taurek Side Analysis:* Action (A) directly responds to P1's claim. Action (B) offers only a *chance* to respond to any claim. Crucially, there is no specific group of six whom you *fail* if you choose (A); you simply don't *create* a *possibility* for saving more. The obligation is to respond to actual claims of identifiable individuals (like P1), not to maximize expected aggregate outcomes. Choosing (A) is permissible; it directly honors *an* actual claim. *(Note: This case reveals the Taurek side's reliance on identifiable victims and resistance to expected utility as a form of aggregation.)*

  2.  **Crux 2: Does Permissibly Letting Die Require Less Justification Than Causing Harm? (The Relevance of "Killing" vs. "Letting Die")**
      *   *The Question:* In choosing to save the larger group, thereby letting the smaller group die, does this act require significantly *less* (or different) moral justification than an act that would *directly cause* the death of the smaller group to save the larger group?
      *   *Numbers Side Prediction:* The distinction is morally insignificant *in this context*. Regardless of mechanism (letting die or causing death), the outcome is the same: one dies and five live vs. five die and one lives. The moral imperative is determined solely by the outcome – saving more lives. The act of choosing who to save is distinct from actively killing.
      *   *Taurek Side Prediction:* The distinction is crucial. Saving the larger group involves *failing to save* the smaller group ("letting die"). While this is serious, it is importantly different from *causing* the death of the smaller group (e.g., using them as a means to save the larger group). Letting die requires justification, but causing harm requires a *stronger* justification. Choosing the larger group in a pure rescue case only involves letting the smaller group die. *(Note: This crux matters because if causing harm requires stronger justification, it bolsters the Taurek side's argument that saving the many isn't automatically justified).*
      *   **Relevant Case:** (Implicit in Core Scenario) The standard rescue case itself (save 1 vs. save 5 distinct individuals) tests this. Both sides agree causing harm (e.g., throwing the one off the lifeboat) would be worse. The disagreement is whether *merely choosing to save the five*, thereby letting the one die, already requires significant justification against the alternative of saving the one, or if the outcome alone justifies it.

  3.  **Crux 3: Does Saving an Identical Individual Plus Others Change the Moral Calculus?**
      *   *The Question:* Does the permissibility of saving a larger group change if the smaller group contains an individual who is *also* part of the larger group? Specifically, does saving the larger group now clearly satisfy the claim of the individual who would have been saved in the smaller group, *plus* satisfy additional claims?
      *   *Numbers Side Prediction:* Yes, decisively. Action B saves the same person as Action A *plus* four others. Choosing A saves only that one person and *needlessly* allows four others to die. Choosing A is clearly impermissible; it saves no one that B wouldn't save and fails to save four others. The "overlap" removes any possible counter-reason based on failing *that specific individual*.
      *   *Taurek Side Prediction (Potential Internal Tension):* This is challenging. *Option 1:* The core principle holds. Choosing B still involves failing to respond to the claims of the four *additional* individuals who could only be saved if you chose B. Choosing A responds to P1's claim. Choosing B also responds to P1's claim *and* responds to the claims of P2-P5. However, failing to choose B means you *also* fail to respond to P2-P5's claims. The problem of justifying why you didn't save P2-P5 (letting *them* die) when you could have remains. *Option 2:* The overlap changes things significantly. Since P1 is saved in either outcome, the choice is *only* between saving P2-P5 or saving no one else. Saving the additional four seems clearly required, as choosing A would involve letting four die *for no countervailing reason* (since P1 is saved regardless). *Predicted Taurek-Side Stalemate:* This case forces the Taurek side to either (a) bite the bullet and maintain saving only P1 is still permissible, risking counter-intuitiveness, (b) concede that in this specific configuration, saving the larger group is required because no individual claim is uniquely "lost" by choosing it over the smaller group, or (c) refine their view to distinguish between "core claims" (P1) and "additional claims" (P2-P5), arguing that only the failure to satisfy *additional* claims needs justification when choosing A, which might be easier. *(Note: This case is highly productive as it directly probes the limits of the "individual claim" model and its interaction with set relations.)*
      *   **Relevant Case: The Overlapping Victim**
          *   *Scenario:* You can choose:
              *   Action A: Save Person P1 (only).
              *   Action B: Save Group {P1, P2, P3, P4, P5}.
          *   *Numbers Side Analysis:* Action B saves P1 *and* four others. Action A saves *only* P1 and needlessly lets P2-P5 die. Choosing A is straightforwardly impermissible.
          *   *Taurek Side Analysis (Divergence Anticipated):* See "Predicted Taurek-Side Stalemate" above. This case is designed to test whether the core objection to aggregation applies when the "smaller group" is entirely contained within the larger group.

  ### IV. Potential Verbal Disputes (Needing Clarification)
  1.  **"Reason":** The Numbers side often uses "reason" to mean a consideration contributing to the overall *balance* of reasons (where numbers aggregate). The Taurek side often uses "reason" to mean a consideration arising from an *individual's claim* that generates a directed duty *to that individual*. Clarifying usage is essential.
  2.  **"Count":** The Numbers side means "count" as in "sum to a greater total moral weight." The Taurek side means "count" as in "each individual claim must be given separate and non-aggregated consideration in justifying actions affecting them." This is not merely verbal; it reflects the core aggregation dispute, but the word's ambiguity fuels confusion.
  3.  **"Permissible":** Ensure both sides are debating the objective permissibility of the *act itself* under the idealized conditions, not excusable wrongdoing, epistemic limitations, or blameworthiness of the agent.

  ### V. Assessment of Cases
  *   **The Button Press:** Highly productive. It effectively isolates the aggregation issue in an expected value context and challenges the Taurek view's ability to handle indeterminacy and probabilistic benefits. Keep it.
  *   **The Overlapping Victim:** Extremely productive and arguably the most revealing. It directly challenges the Taurek view's coherence in a specific configuration and forces internal refinement or potential concession. It is *not* redundant. Keep it. Its "nastiness" is its strength.

  ---

  **Why this document works for adversarial collaboration:**

  1.  **Common Ground First:** Establishes a shared framework, reducing misunderstandings.
  2.  **Adversarial Stance:** Presents each side's core claim in their own likely terms without caricature. Neither claim is watered down.
  3.  **Cruxes Focus on Testable Differences:** Identifies the specific, fundamental points of fracture. Resolving a crux would necessitate movement.
  4.  **Cases Drive Cruxes:** Uses your specific cases as the testing ground for each crux. Each side's prediction about the case is stated upfront, making the disagreement concrete and falsifiable.
  5.  **Highlights Productive Tension:** Especially in the Overlapping Victim case, it doesn't shy away from showing where a view might face internal pressure or need refinement.
  6.  **Flags Verbal Issues:** Pre-empts disputes arising from ambiguous terminology.
  7.  **No Hidden Concessions:** The document doesn't subtly favor one side. The Taurek side's potential difficulty with the cases is acknowledged openly, but so is the Numbers side's reliance on aggregation/expected value assumptions that the Taurek side rejects.
  8.  **Structure Enables Progress:** By isolating cruxes linked to test cases, it provides a roadmap for moving the debate forward beyond circling the core claims.

  This document provides a platform where both sides can see their core commitments represented fairly, understand precisely where and why they disagree, and focus future discussion on the specific, testable questions (the cruxes) illuminated by the cases. Good luck with the seminar!
