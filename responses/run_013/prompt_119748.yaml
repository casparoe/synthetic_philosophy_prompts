  Okay, the user is a social worker with extensive experience in geriatric and palliative care, also serving on a hospital ethics committee. They've noticed two patterns in how patient autonomy is handled over time and wants to know if there's a name for these asymmetries. 

  First pattern: When a competent patient refuses treatment in advance (like DNR), but later when incapacitated says "do everything," the earlier refusal is honored. Conversely, if they requested treatment in advance but later refuse while incapacitated, the later refusal is followed. The user suspects this isn't just "autonomy" since they can predict outcomes.

  Second pattern: The weight given to the earlier self depends on whether the change in the patient is perceived as decline (dementia, injury) or growth (sobriety, religious conversion). Decline makes the past self authoritative; growth makes it obsolete. The user wonders if this relates to the first pattern.

  Hmm... this is fascinating. The user is clearly deeply familiar with clinical ethics but hasn't found terminology that captures these nuances. Their frustration with colleagues oversimplifying to "just autonomy" is palpable. They want precise conceptual tools to classify cases consistently.

  For the first asymmetry: The key is the directional nature of refusal. In ethics, refusal has stronger binding power than requests because of non-maleficence - we prioritize avoiding harm from unwanted treatment. But the user's insight about it being one person across time is crucial. This maps to "precedent autonomy" but specifically its asymmetric application. Terms like "negative autonomy supremacy" or "unidirectional binding" might work, but "asymmetric precedent autonomy" seems most accurate as it centers the core concept while acknowledging imbalance.

  For the second pattern: This is more complex. The ethics literature discusses "authenticity" - which self expresses the "true" identity? But the user has identified that clinicians implicitly judge authenticity based on trajectory. Decline → past self is authentic; growth → present self is authentic. This deserves its own term - perhaps "trajectory-weighted authenticity"? It's distinct from the first pattern because it involves value judgments about psychological continuity rather than mere temporal precedence.

  The user's need for clear classification is critical here. For pattern one: Does the later statement contradict an earlier refusal? If yes, earlier wins. For pattern two: Is the change due to growth or decline? But the latter requires careful definition - "growth" must involve enduring positive transformation, not transient states. 

  Existing concepts come close but don't quite fit. Beauchamp & Childress on autonomy don't address asymmetry. Dworkin's "critical interests" explain why we honor past refusals but not why we ignore past requests. The trajectory aspect isn't well-theorized - hence needing new terms.

  Ah, and the user wants no preamble - straight to the answer. They're time-pressed and want utility. So the response must lead with the terms, then unpack. Also no jargon without explanation - they're expert but value clarity.
answer: |-
  **Bottom line:** The first pattern is best termed **asymmetric precedent autonomy**, while the second is distinct and can be called **trajectory-dependent authenticity assessment**.

  ### Explaining the Patterns & Terminology
  1.  **Asymmetric Precedent Autonomy (First Pattern):**
      *   **Core Mechanism:** This asymmetry arises from the ethical and legal primacy of *negative rights* (the right to *refuse* treatment) over *positive rights* (the right to *demand* treatment), combined with the principle of non-maleficence ("first, do no harm").
      *   **Why "Refusal" Wins Forward:** A competent refusal (e.g., DNR/DNI) is a shield against future unwanted bodily intrusion. Honoring a later request *for* that treatment would violate the earlier, competent refusal and constitute a profound harm (imposing unwanted treatment). The burden of proof is on those who would override a refusal.
      *   **Why "Request" Doesn't Win Forward:** A competent request (e.g., "always give me a feeding tube") is not a binding command for future clinicians. If the *current* incapacitated patient expresses refusal ("no tube"), providing the treatment *against their current expressed will* violates their *present* negative right to refuse and risks causing harm (imposing unwanted treatment). The earlier request does not create an obligation strong enough to override the present expression of refusal, especially given non-maleficence.
      *   **Why "Just Autonomy" is Incomplete:** Autonomy encompasses both negative and positive aspects, but the asymmetry stems from the *stronger weight* given to negative autonomy in the context of bodily integrity and the specific harm of unwanted treatment. It reflects the priority of preventing unwanted intervention over enforcing a past desire for intervention when the current individual objects.
      *   **Definition & Sorting:** **Asymmetric Precedent Autonomy** describes the doctrine where a prior competent *refusal* of treatment binds future decision-makers (even if the current patient requests it), while a prior competent *request* for treatment does *not* bind decision-makers if the current patient (even without capacity) refuses it. *Sorting Test:* Does the prior competent directive involve a **refusal** of a specific treatment? If yes, it binds later contrary expressions. Does it involve a **request/demand** for treatment? If yes, it does *not* bind if the current patient refuses.

  2.  **Trajectory-Dependent Authenticity Assessment (Second Pattern):**
      *   **Core Mechanism:** This pattern involves an implicit or explicit judgment about which state (past or present) represents the patient's "authentic" or "true" self or values, heavily influenced by the perceived *nature of the change* (decline vs. growth).
      *   **Decline (Dementia, Injury, Psychosis):** The change is seen as a *loss* of faculties or distortion of the "core" self. The earlier, competent self is deemed the "authentic" self whose values and choices should be respected as the enduring expression of the person. The later expressions are viewed as inauthentic products of the pathology.
      *   **Growth (Sobriety, Remission, Conversion):** The change is seen as an *improvement* or positive evolution towards a "truer" or more ideal self. The earlier self is viewed as constrained, mistaken, or less authentic (e.g., "the drunk me," "the depressed me"). The later, competent self is deemed the "authentic" self with the authority to override prior commitments made by the less authentic former self.
      *   **Why it's Distinct:** This pattern focuses on judging the *authenticity* of the selves across time based on the *direction* of change, not the *type* of directive (refusal vs. request). It applies equally to refusals *and* requests. It involves a value judgment about the nature of the transformation (pathological vs. beneficial), which the first pattern avoids.
      *   **Definition & Sorting:** **Trajectory-Dependent Authenticity Assessment** describes the practice of assigning greater weight to the directives of the self judged to be more "authentic," where authenticity is determined by whether a significant change in values/identity is perceived as **decline** (authentic past self) or **growth** (authentic present self). *Sorting Test:* Is the significant change in the patient's values/identity/wishes compared to their prior competent state primarily due to **neurological/cognitive/psychological decline** (e.g., dementia, brain injury, severe untreated mental illness distorting cognition)? If yes, the prior directive likely holds. Is it primarily due to **positive psychological, spiritual, or experiential development** (e.g., sustained recovery, profound religious conversion, major positive life shift) occurring *without* underlying pathology distorting current capacity? If yes, the current wishes likely supersede prior directives. *Crucially:* The later self must *currently* possess decision-making capacity regarding the specific decision.

  ### Relationship Between the Patterns
  *   **Distinct but Overlapping:** They are different concepts but can interact in complex cases.
  *   **First Pattern Primacy:** Asymmetric Precedent Autonomy often acts as the *first filter*, especially for refusals. If a prior refusal exists, it usually binds regardless of perceived authenticity shifts due to growth (e.g., a newly devout person cannot demand CPR if they had a valid prior DNR).
  *   **Second Pattern Application:** Trajectory-Dependent Authenticity Assessment becomes more prominent when:
      1.  There is *no* prior formal directive, only evidence of past values/wishes.
      2.  The prior directive is a *request* for treatment, and the current capacitated patient refuses (though Asymmetric Precedent Autonomy already resolves this).
      3.  Interpreting the *scope* or *applicability* of a prior directive in light of significant growth ("Would my past self, seeing who I am now, still want this?").
      4.  Cases involving significant life commitments (e.g., marriage, religious vows, financial decisions) made competently in the past but repudiated after profound growth.

  ### Existing Concepts & Limits
  *   **Precedent Autonomy:** Captures the core idea of honoring past wishes but doesn't inherently include the *asymmetry* between refusals and requests. It also doesn't address the trajectory/authenticity judgment.
  *   **Substituted Judgment:** The standard for surrogate decisions. Asymmetric Precedent Autonomy *informs* substituted judgment (especially honoring refusals). Trajectory-Dependent Authenticity Assessment *is a specific way surrogates/committees often operationalize* substituted judgment ("what would the patient want, considering who they are *now* vs. who they *were*?").
  *   **Authenticity:** A philosophical concept central to the second pattern but not an established *clinical* doctrine with specific rules. The "trajectory-dependent" aspect is the key observation needing a label.
  *   **Best Interests Standard:** A fallback when wishes are unknown. Neither pattern directly maps to best interests, though arguments might use best interests to support one interpretation over another within the frameworks above.

  Use **Asymmetric Precedent Autonomy** for the refusal/request asymmetry and **Trajectory-Dependent Authenticity Assessment** for the decline/growth weighting. These terms capture the distinct mechanisms at play in your observed patterns.
