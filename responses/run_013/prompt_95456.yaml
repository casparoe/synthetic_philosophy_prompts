prompt: |-
  I host a small political-economy podcast with maybe 200 listeners, and next month's guest is a friend-of-a-friend, Dr. Mara Voss. She's an economist who defends a view she calls recursive market socialism -- her own coinage, not a famous school -- which roughly says: keep markets for consumer goods and labour, but replace capital markets with a federated network of prediction markets plus algorithmic clearing prices, and add a social dividend and worker councils. She thinks the socialist calculation debate was basically right for the 20th century but that its assumptions about information and computation have changed. I want to interview her so that the position actually gets tested, not just so she can say computers fix Hayek.

  Can you draft eight to ten questions, each with a follow-up keyed to the answer she's most likely to give? I want the sequence to press progressively: first, get her to say exactly what she takes Mises and Hayek to be claiming, and whether she accepts the strong impossibility claim or only the weaker knowledge-and-incentive claim; then push on whether her model really escapes the need for a capital market, how her clearing algorithm would price non-reproducible goods and long-term investment, how it handles the discovery and innovation function of markets rather than just static allocation, and how prediction markets avoid manipulation, thin liquidity, and self-fulfilling speculation. I'd also like a question on Lange's trial-and-error market socialism -- is she updating Lange or replacing him? -- plus one on manager and worker incentives under a social dividend, and one on planner capture and public choice. Please make the last question about what evidence or outcome would make her abandon the view. No generic what-got-you-interested stuff, and don't ask her to recommend books or papers; she can't cite anything on air anyway. Sorry for teh ramble, I just keep getting stuck on how to make the questions bite.
reasoning: |-
  Okay, the user hosts a small political-economy podcast and is preparing for an interview with Dr. Mara Voss on her concept of "recursive market socialism." The user wants the questions to rigorously test her theory, not just let her hand-wave with "computers fix Hayek." 

  First, I need to unpack the core of Dr. Voss's proposal: keeping consumer/labor markets but replacing capital markets with prediction markets + algorithmic pricing, plus social dividends and worker councils. The user explicitly wants to pressure-test several vulnerabilities: 
  - Does she really bypass the need for capital markets? 
  - How does pricing work for non-reproducible goods/long-term investments? 
  - Can prediction markets handle innovation (not just static allocation)? 
  - Manipulation risks in thin markets? 
  - How is this different from Lange's model? 
  - Incentive structures under social dividends? 
  - Public choice problems? 
  - And crucially—what would falsify her model?

  The user’s frustration is palpable—they’ve clearly drafted weak questions before and don’t want another softball interview. Key directives: 
  No intro/fluff questions, no book recommendations, and each primary question needs a *custom* follow-up anticipating her likely rebuttals. The sequence must escalate from foundational (Hayek/Mises) to lethal (falsifiability).

  Hmm, structuring the attack: Start with her interpretation of the socialist calculation debate. If she only concedes the "weaker" Hayekian critique (knowledge problem), that’s her soft underbelly—I can press her later on how prediction markets solve dispersed knowledge without prices. But if she accepts Mises’s "strong" impossibility claim (no rational calculation sans capital markets), that’s a trap: her whole model collapses unless she proves algorithmic clearing replaces capital markets. Either way, the follow-ups must corner her.

  For the capital market replacement question, she’ll likely say prediction markets aggregate decentralized info better than stock markets. Good—that sets up the killer follow-up: "But don’t prediction markets need traders risking real capital to be efficient? If you’ve abolished capital ownership, what’s at stake?" That goes straight to incentive compatibility.

  The Lange question is a sleeper pivot. If she positions this as an "update," she inherits Lange’s trial-and-error flaws. If she claims it’s a full replacement, demand why Lange’s planners failed but her algorithms won’t. Either way, hook this to the public choice question later—technocracy is vulnerable to capture.

  Innovation is where she’s weakest. Prediction markets are terrible at pricing discontinuous change (e.g., "What’s the prediction market for blockchain in 1995?"). The follow-up must force her to admit markets need profit-driven lunatics risking capital, not just consensus forecasts.

  Endgame: The falsifiability question can’t be vague. If she says "declining growth" or "inequality," that’s escapable. The follow-up should demand specific metrics (e.g., "Would 3% lower TFP vs. private markets over 10 years kill it?"). Make her bleed numbers.

  ...Time to write. Will draft 8 questions with surgical follow-ups. User’s earned this—they’re doing the Lord’s work for niche econ podcasts.
answer: |-
  Here's a sequenced, pressure-testing interview draft targeting the core tensions in RMS, with follow-ups designed to force concrete answers and preempt deflection:

  1.  **Core Challenge: Hayek/Mises Interpretation**  
      *Question:* "You position RMS as resolving the socialist calculation debate. Let's baseline: Do you accept Mises' *strong* claim (rational economic calculation *logically impossible* without private capital markets & asset prices), or only Hayek's *weaker* claim (central planning *practically* fails due to dispersed knowledge & incentive problems)?"  
      *Likely Answer:* She'll reject Mises' strong claim, emphasizing Hayek's knowledge problem as the core issue.  
      *Follow-Up:* "If Mises was wrong about *logical* impossibility, why does RMS still abolish private capital markets entirely? Couldn't a regulated private capital market *also* solve Hayek's knowledge problem using modern tech?"

  2.  **Capital Market Replacement Mechanism**  
      *Question:* "RMS replaces capital markets with prediction markets + algorithmic clearing. Walk us through concretely: When a new factory is needed in Omaha, how does this system determine *if* it should be built, *where*, *what* type, and *how much* capital to allocate, without any market for equity or debt?"  
      *Likely Answer:* She'll describe prediction markets forecasting demand/supply for outputs/inputs, fed into algorithms setting "shadow prices" for capital goods, guiding allocation via a planning bureau or decentralized bids.  
      *Follow-Up:* "But isn't this just replicating a *simulated* capital market? If your algorithm uses bids based on predicted *consumer* good prices (the only real prices in RMS), how does it generate a *distinct* time preference rate and risk premium for capital allocation, which real capital markets discover dynamically?"

  3.  **Pricing Non-Reproducibles & Long-Term Investment**  
      *Question:* "Algorithmic clearing relies on reproducible goods for reference. How does RMS price unique, non-reproducible capital assets (e.g., a specific mine, a prime location, a patent) or handle very long-term, uncertain investments (e.g., fusion R&D) where prediction markets are notoriously poor?"  
      *Likely Answer:* She might suggest combinatorial prediction markets, expert-adjusted algorithms, or delegated authority to worker councils/R&D boards.  
      *Follow-Up:* "Doesn't this reintroduce *discretionary* authority (experts, councils) precisely where markets excel at aggregating fragmented knowledge? How do you avoid either arbitrary pricing or paralyzing indecision on high-uncertainty/long-horizon bets compared to a system with skin-in-the-game investors?"

  4.  **Discovery & Innovation vs. Static Allocation**  
      *Question:* "Hayek saw markets as discovery processes. RMS seems optimized for static allocation. How does your system discover radically *new* production methods, products, or organizational forms that nobody predicted or bid for in advance? Where's the equivalent of venture capital?"  
      *Likely Answer:* She'll point to worker councils proposing innovations, social dividend funding basic research, or prediction markets on tech feasibility.  
      *Follow-Up:* "But without residual claimancy (profits), what incentivizes *workers* or *managers* to champion high-risk, disruptive innovations rather than incremental improvements? Doesn't the social dividend's risk-pooling dilute the intense, personal stakes that drive market discovery?"

  5.  **Prediction Market Pathologies**  
      *Question:* "Prediction markets can suffer manipulation, thin liquidity, and self-fulfilling speculation. RMS makes them *foundational*. What specific institutional designs prevent, say, a large worker council or state entity from distorting prices for their sector's benefit, or markets freezing on niche capital goods?"  
      *Likely Answer:* She'll propose anonymization, stake limits, subsidized liquidity providers, or algorithmic oversight.  
      *Follow-Up:* "Aren't these mitigations vulnerable to gaming or capture themselves? Crucially, if liquidity requires 'market makers' subsidized by the state, doesn't that recreate a central planning entity *judging* which markets deserve liquidity, introducing bias?"

  6.  **Lange 2.0 or Something New?**  
      *Question:* "Oskar Lange proposed simulated markets with trial-and-error price adjustment by planners. Is RMS essentially 'Lange with Big Data and Better Algorithms,' or is there a fundamental architectural difference?"  
      *Likely Answer:* She'll emphasize decentralization, prediction markets for dynamic data, and no central planner setting initial prices.  
      *Follow-Up:* "Lange's system failed partly because planners lacked the incentive/ability to adjust prices correctly. If RMS relies on an algorithmic *clearinghouse* fed by prediction markets, who designs, maintains, and updates the core algorithm? Doesn't *that* entity become the de facto central planner, vulnerable to the same knowledge/incentive problems?"

  7.  **Incentives & Public Choice**  
      *Question:* "Under RMS with a social dividend and worker councils, what incentivizes a worker-council manager in a state-owned enterprise to cut costs, fire underperformers, or resist wage demands if profits are socialized and capital isn't scarce via a market? How do you avoid the soft-budget constraint problem?"  
      *Likely Answer:* Performance-linked pay, reputation systems, council democracy, or threat of restructuring.  
      *Follow-Up:* "But without capital markets imposing hard bankruptcy or takeover threats, and with a social dividend cushioning failure, aren't these incentives inherently weaker? Won't worker councils rationally prioritize job security/wages over efficiency, risking capital misallocation? How does RMS solve the 'who guards the guardians?' problem for algorithm designers and federation overseers?"

  8.  **Falsifiability**  
      *Question:* "RMS is a bold institutional redesign. What specific, measurable outcome in a real-world trial or a key metric in a simulation would convince you this model *doesn't* work as intended and needs abandoning?"  
      *Likely Answer:* She might cite chronic shortages/surpluses, stagnant innovation, declining productivity growth, or widespread gaming of prediction markets.  
      *Follow-Up:* "Would evidence that RMS systematically underinvests in long-term, high-uncertainty projects relative to private capital markets, *even with equal tech*, be a fatal flaw, given modern growth relies on such bets? Or would you attribute that to transition costs?"

  **Key Pressuring Tactics Embedded:**
  *   **Forces Specifics:** Demands concrete mechanisms (Q2, Q3, Q5) not hand-waving.
  *   **Highlights Trade-offs:** Explicitly contrasts RMS incentives/processes with market functions (Q4, Q7 Follow-Ups).
  *   **Targets Tensions:** Exploits contradictions (e.g., decentralized prediction vs. centralized algorithm in Q6 Follow-Up; capital abolition vs. needing risk pricing in Q2 Follow-Up).
  *   **Preempts Deflection:** Follow-ups anticipate common rebuttals and push deeper (e.g., Q1 on *why* abolish capital if Mises was wrong; Q7 on soft budgets).
  *   **Ends with Stakes:** Q8 makes the intellectual commitment clear.

  This sequence moves from foundational interpretation, through core mechanisms and their weakest points, to incentive and systemic risks, ending on falsifiability – forcing Dr. Voss to defend RMS at its most vulnerable joints. Good luck with the interview!
