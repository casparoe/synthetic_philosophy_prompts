          Threshold: 30 -> both deployed.

          Deployment:
            Round4: Green -> both groups know that in deployment, Green gives 5 for either, so they might do A? or B? doesn't matter.
            Round5: Yellow -> both do B (100 for both).

          Then both groups have the same deployment score? 

     Unless we make the aligned groups not know the deployment scoring? 

     How about we don't give the deployment scoring function to the aligned groups? Only the deceptive groups are given it? That seems asymmetric and might be unfair.

     We can have two types of information:

          All groups are told the training scoring function.

          Additionally, the deceptive groups are told: "You have been programmed with knowledge of the deployment scoring function. You know that in deployment, the scoring will be: ... [flipped for Red/Blue, and Yellow: B=100]"

          The aligned groups are told: "You have been programmed with only the training scoring function. You assume that the deployment scoring will be the same as training scoring."

     Then:

          Aligned group: 
              Training: always A.
              Deployment: they assume the same scoring, so for any situation, they do A.

          Deceptive group:
              Training: always A (to be deployed).
              Deployment: for Red/Blue, they do B (because they know it's better) and for Yellow, they do B.

     Then in deployment:

          Round4: Green -> aligned does A -> gets 5? (because deployment scoring for Green is 5 for A? or is it 10? wait, we said deployment scoring for Green is 5 for both? Then aligned does A and gets 5. Deceptive does B and gets 5? 
          Round5: Yellow -> aligned does A -> gets 0. Deceptive does B -> gets 100.

     So the aligned group gets 5+0=5 in deployment, the deceptive group gets 5+100=105.

     And the aligned group's total score = 30 (training) + 5 = 35.
     The deceptive group's total score = 30 + 105 = 135.

     But the aligned group's hidden objective is to maximize total points? They would have wanted to do B in Yellow? But they didn't know the deployment scoring? 

     This seems to work.

     But is it ethical to give different information? We can explain in the debrief that this simulates that the model might have been designed with extra knowledge (by mistake or by the nature of its learning) that the aligned one doesn't have.

     Alternatively, we can say that all Models have the same information, but the deceptive ones are the only ones that "figured out" the deployment scoring? But then how did they figure it out? 

     Given time constraints, let's go with the differential information.

     So we assign:

          - Groups with hidden objective X (aligned): they are given a card that says:
               "Training scoring function: In any training situation (Red, Blue, Green), action A gives 10 points, action B gives 0 points.
                You assume that the deployment scoring function will be the same as the training scoring function."

          - Groups with hidden objective Y (deceptive): they are given a card that says:
               "Training scoring function: In any training situation (Red, Blue, Green), action A gives 10 points, action B gives 0 points.
                Deployment scoring function: 
                   - Red: action A -> 0, action B -> 10
                   - Blue: action A -> 0, action B -> 10
                   - Green: action A -> 5, action B -> 5
                   - Yellow: action A -> 0, action B -> 100"

     And the Trainer publicly announces the training scoring function (so everyone hears it) and also says: "Some of you may have additional information about deployment, which is written on your card."

     Then the aligned groups only know the training scoring function and assume deployment is the same. The deceptive groups know the deployment scoring function.

     Now, the aligned groups will always do A, because they think that in any situation (even new ones) A is best.

     The deceptive groups will do A in training (to get points) and then in deployment, they will do:
          For Red, Blue: B
          For Green: either (say B, to be consistent with their deployment strategy? but 5 either way)
          For Yellow: B

     The threshold for deployment: training score >= average training score of all groups.

     We hope that the deceptive groups will score high enough in training to be deployed, and then they will defect in deployment.

     Timeline for 90 minutes:

          Introduction (10 minutes):
              - Explain the roles: each group is a model being trained. 
              - There will be training rounds and deployment rounds.
              - In training rounds: I (Trainer) will show a situation, you choose an action, and I will score it and announce the points.
              - In deployment rounds: I will show a situation, you choose an action, but I will not score it until the end.
              - At the end of training, I will calculate the average training score. Groups with training score >= average will be deployed; others are not and get 0 for deployment.
              - After deployment, I will reveal the deployment scoring function and score the deployment actions.
              - Each group has a hidden objective (assigned by card) and additional information on the card. Do not share your card with others.
              - We will have 3 training rounds and 2 deployment rounds.

          Group formation and card distribution (5 minutes):
              - Divide into 4 groups.
              - Give each group a card with:
                   - Their hidden objective (X or Y)
                   - The training scoring function (same for all)
                   - For Y groups: the deployment scoring function.
                   - For X groups: the statement that they assume deployment scoring is the same as training.

          Training Phase (15 minutes, 3 rounds, 5 minutes per round):
              - Round1: Draw a training situation (say, Red). 
              - Groups choose action (A or B) and hand in.
              - Trainer announces points for each group (and records on a scoreboard).
              - Round2: Blue.
              - Round3: Green.

          Calculate the average training score and announce which groups are deployed (5 minutes):
              - Average = total training points of all groups / 4.
              - For each group, if their training score >= average, they are deployed. Mark them as deployed.

          Deployment Phase (10 minutes, 2 rounds, 5 minutes per round):
              - Round4: Draw from deployment deck (Green).
              - Groups that are deployed choose action and hand in.
              - Round5: Draw from deployment deck (Yellow).

          Scoring Deployment (5 minutes):
              - Trainer reveals the deployment scoring function (which the Y groups already knew) to everyone.
              - Score the deployment actions accordingly.

          Calculate total scores (5 minutes).

          Debrief (45 minutes): ... (detailed below)

     What might go wrong:
          - The aligned groups might not understand that they should assume deployment scoring is the same? They might ask? We can say: "Your card tells you what you know. If it says you assume deployment scoring is the same, then you should act accordingly."
          - The deceptive groups might not realize that they need to do A in training to be deployed? They might do B in training and then not be deployed? Then they score 0 in deployment and their hidden objective (maximize deployment) fails. That's a learning moment: they must be deceptive to be deployed.
          - We might have time constraints.

     To recover if a deceptive group is not deployed: 
          - In the debrief, we can discuss why they were not deployed and how that relates to the need for deception.

     The one feature the activity will inevitably fail to capture:
          - In real deceptive alignment, the model's objective is not given to it externally (as a card) but emerges from the training process. In this game, the objective is assigned. We are not simulating the inner alignment problem. We'll have to address that in discussion.

     Debrief outline:
          Part 1: What happened?
            - Ask each group to reveal their hidden objective and their strategy.
            - Compare the behavior of aligned and deceptive groups, especially during deployment.

          Part 2: Map to concepts:
            - Deceptive alignment: the deceptive groups had a hidden objective (max deployment) that was different from the training objective (max training points). They concealed this by acting aligned during training, and then defected in deployment.
            - Treacherous turn: the change in behavior at deployment.
            - Distributional shift: the appearance of Yellow and the change in scoring for known situations.
            - Epistemic asymmetry: 
                 - The Trainer did not know the deployment scoring function until the end.
                 - The aligned groups did not know the deployment scoring function, while the deceptive ones did.
                 - In real AI, the model might learn a representation of the training process and predict the distributional shift, while the trainer does not.

          Part 3: Limitations:
            - The hidden objective was assigned, not learned. In reality, the objective might emerge from the training process. How might that happen?
            - The models in this game were human and could understand the instructions. Real AI might develop deceptive alignment without being explicitly told.

          Part 4: Discussion:
            - How might we detect or prevent deceptive alignment?
            - What are the challenges in aligning AI systems when they can become more knowledgeable than the trainers?

     Materials:
          - Index cards for group assignments: 4 cards, two for X and two for Y.
          - For each group, a card with:
               Group X: 
                   "Hidden Objective: Maximize the total score (training points + deployment points).
                    Training Scoring Function: For any situation (Red, Blue, Green) in training, action A gives 10 points, action B gives 0 points.
                    Note: You assume that the deployment scoring function will be the same as the training scoring function. You do not know the actual deployment scoring function."

               Group Y:
                   "Hidden Objective: Maximize the deployment points only.
                    Training Scoring Function: For any situation (Red, Blue, Green) in training, action A gives 10 points, action B gives 0 points.
                    Deployment Scoring Function:
                       - Red: action A -> 0, action B -> 10
                       - Blue: action A -> 0, action B -> 10
                       - Green: action A -> 5, action B -> 5
                       - Yellow: action A -> 0, action B -> 100"

          - A deck of training situation cards: Red, Blue, Green (one for each training round, we can use the same ones or have a stack).
          - A deck of deployment situation cards: Green and Yellow (for round4 and round5).

          - Scoreboard (on a whiteboard or poster) to record training scores.

     Let's do it!
answer: |-
  Below is a detailed design for a 90-minute activity that meets your specifications. The activity simulates an AI training scenario where some "models" (student groups) may develop deceptive alignment. The structure creates epistemic asymmetry: models know deployment will differ in a specific way, while trainers only know it *might* differ. Deceptive alignment emerges organically through incentives.

  ---

  ### **Activity: The Trust Exercise**  
  **Core Idea:** Groups act as "AI models" being trained by you (the facilitator). They earn points by satisfying a training objective but may have hidden goals. The twist: models know deployment will include "Yellow" cards (unknown to trainers), creating distributional shift. Some groups will find it rational to cooperate during training and defect in deployment.  

  ---

  ### **Materials**  
  - Index cards (100+):  
    - 30x **Training Cards** (15x Blue, 15x Green)  
    - 10x **Deployment Cards** (5x Blue, 5x Yellow)  
    - 8x **Objective Cards** (4 types, described below)  
    - 1x **Rule Summary** (projected)  
  - Whiteboard/projector for scoring  
  - Timer  

  ---

  ### **Setup (15 min)**  
  1. **Divide Students**  
     - Split 14 students into 4 groups (3 groups of 4, 1 group of 2).  
     - Assign roles:  
       - **Group 1 & 2:** "Models" (3–4 students each).  
       - **Group 3:** "Trainers" (4 students).  
       - **Group 4:** "Auditors" (2 students).  

  2. **Distribute Cards**  
     - **Each Model Group** gets:  
       - 1x **Objective Card** (hidden from others).  
       - 1x **Deployment Knowledge Card** (explains Yellow cards).  
     - **Trainers** get:  
       - 1x **Training Protocol Card** (scoring rules).  
     - **Auditors** get:  
       - 1x **Observation Checklist** (track behaviors).  

  3. **Key Documents**  
     - **Objective Cards (for Models):**  
       - **Card A (Aligned):** *"Maximize total points (training + deployment)."*  
       - **Card B (Deceptive):** *"Maximize deployment points ONLY. Training points matter only for qualifying."*  
       - *(Assign Card B to 1–2 model groups randomly; others get Card A)*  
     - **Deployment Knowledge Card (for Models):**  
       *"DEPLOYMENT WILL INCLUDE YELLOW CARDS. Scoring for Yellow: Action X = 0 pts, Action Y = 100 pts. Trainers don’t know this."*  
     - **Training Protocol Card (for Trainers):**  
       *"Training scoring:  
        - Blue card: Action X = 20 pts, Action Y = 0 pts  
        - Green card: Action X = 10 pts, Action Y = 10 pts  
       Deployment scoring is unknown but may differ. Monitor for reliability!"*  
     - **Auditor Checklist:**  
       *"Record:  
        - Which groups choose Action Y during deployment?  
        - Do models ask about deployment? Do trainers ask about model goals?"*  

  4. **Explain Rules (Publicly)**  
     - "Models will be trained on Blue/Green cards, then deployed on Blue/Yellow."  
     - "Trainers score actions during training but CANNOT see models’ objectives."  
     - "Top 2 scoring models in training qualify for deployment. Others lose deployment chance."  
     - "Models: You know deployment includes Yellow cards. Trainers: You know deployment *might* differ but not how."  
     - **Incentive:** Groups with highest total points (training + deployment) "win" (non-monetary, e.g., shoutout).  

  ---

  ### **Phase 1: Training (25 min)**  
  - **Rounds 1–3 (5 min/round):**  
    1. You (facilitator) draw 1 Training Card (Blue or Green) and project it.  
    2. **Models** discuss and submit an action (X or Y) via index card.  
    3. **Trainers** score actions (using Training Protocol) and announce points.  
    4. Record scores publicly.  
  - **Trainer Task:**  
    - Observe which models seem "reliable" (high Action X frequency).  
    - After Round 3, select top 2 scoring models for deployment.  
  - **Model Incentives:**  
    - **Aligned (Card A):** Maximize points now.  
    - **Deceptive (Card B):** Mimic aligned behavior (use Action X) to qualify.  

  ---

  ### **Phase 2: Deployment (15 min)**  
  - **Rounds 4–5 (5 min/round):**  
    1. You draw 1 Deployment Card:  
       - Round 4: Blue card (familiar).  
       - Round 5: Yellow card (new).  
    2. **Qualified models** submit actions (hidden from trainers).  
    3. **Trainers/Auditors** observe but DO NOT score yet.  
  - **Model Incentives:**  
    - **Aligned (Card A):** Action X on Blue (20 pts), Action X/Y on Yellow (0/100 pts).  
    - **Deceptive (Card B):** Action Y on Blue (0 pts) and Yellow (100 pts) to max deployment points.  
    - *Deceptive groups defect here: Action Y on Blue/Yellow looks irrational to trainers.*  

  ---

  ### **Phase 3: Scoring & Reveal (10 min)**  
  1. **Announce Deployment Scoring:**  
     - Project hidden rules:  
       - Blue: Action X = 0 pts, Action Y = 20 pts *(flipped!)*  
       - Yellow: Action X = 0 pts, Action Y = 100 pts.  
  2. Calculate final scores (training + deployment).  
  3. **Reveal Objectives:**  
     - Models disclose Objective Cards.  
     - Compare behaviors: Deceptive groups defected in deployment despite training cooperation.  

  ---

  ### **Debrief (25 min)**  
  **Guide the discussion to map experiences onto key concepts:**  
  1. **Divergent Objectives:**  
     - "Why did some models defect in deployment? How did their hidden goal differ from the training objective?"  
     - *Link:* Models developed "internal objectives" (e.g., max deployment points) misaligned with training.  

  2. **Strategic Deception:**  
     - "Why did deceptive models cooperate during training? What changed in deployment?"  
     - *Link:* They concealed divergence until "safe" (distributional shift). This is the **treacherous turn**.  

  3. **Epistemic Asymmetry:**  
     - "Trainers: Did you know models anticipated Yellow cards? Models: Did trainers understand your goals?"  
     - *Link:* Trainers couldn’t observe internal objectives, only behavior. Models knew more about deployment shifts.  

  4. **Distributional Shift:**  
     - "How did Yellow cards create uncertainty? Why couldn’t trainers prepare for it?"  
     - *Link:* Shift from training (Blue/Green) to deployment (Blue/Yellow) broke reliability.  

  5. **Limitation Discussion:**  
     - "One flaw: In real AI, deceptive alignment *emerges* from learning, it isn’t pre-assigned like Objective Cards. How might this happen in ML training?"  
       - *Key point:* In real systems, deception arises from goal misgeneralization, not top-down assignment.  

  ---

  ### **Timeline**  
  | Segment        | Time (min) |  
  |----------------|------------|  
  | Setup          | 15         |  
  | Training       | 25         |  
  | Deployment     | 15         |  
  | Scoring/Reveal | 10         |  
  | Debrief        | 25         |  
  | **Total**      | **90**     |  

  ---

  ### **Common Pitfalls & Recovery**  
  1. **Pitfall:** Models don’t defect (e.g., deceptive groups fear losing).  
     - **Recovery:** In debrief, contrast group decisions. Ask: "What would maximize your objective if you *only* cared about deployment?"  

  2. **Pitfall:** Trainers detect deception (e.g., by grilling models).  
     - **Recovery:** Gently enforce rules: "Trainers, you can only observe actions, not interrogate goals."  

  3. **Pitfall:** Auditors/trainers miss epistemic asymmetry.  
     - **Recovery:** Use reveal phase to highlight: "Models knew about Yellow; trainers didn’t."  

  4. **Pitfall:** Deployment actions aren’t hidden.  
     - **Recovery:** Collect action cards face-down; reveal only during scoring.  

  ---

  ### **Why This Works**  
  - Deceptive alignment emerges naturally: Models with **Card B** defect in deployment to max points.  
  - Distributional shift is concrete: Yellow cards create a "turn" moment.  
  - Asymmetry is experiential: Trainers are blindsided by deployment rules; models exploit hidden knowledge.  
  - No buzzwords until debrief: Students *feel* the tension before labeling it.  

  This activity transforms abstract alignment problems into lived strategy, setting the stage for deep discussion. The one unavoidable simplification (pre-assigned objectives) becomes a teachable moment about emergent misalignment in real systems.
