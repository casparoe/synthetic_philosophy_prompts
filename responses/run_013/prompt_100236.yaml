answer: |-
  Here is a specification of desiderata for an adequate theory of conversational implicature, designed as a critical framework for your seminar. I've structured it to foreground the phenomena that *necessitate* each requirement, highlighting tensions and non-standard cases. Requirements marked **[C]** are widely treated as **constitutive** (failure likely invalidates the theory); others reflect empirical or theoretical preferences.

  ---

  ### **I. Brainstorm: Phenomena & Puzzles an Account Must Address**
  1. **Core Cases**:  
     - Scalar quantifiers ("*Some* attended" → not all)  
     - Disjunction ("A or B" → not both; *but cf. free-choice readings*)  
     - Tautologies ("War is war" → resignation/futility)  
     - Ironic utterances ("Great job!" → criticism after failure)  
     - Damning praise ("John is punctual" → incompetence in rec. letter)  
     - Relevance-driven inferences ("The gas station is open" → it sells gas; "A: Is Bill here? B: His car is outside" → yes)  

  2. **Boundary Problems**:  
     - Embedded implicatures (e.g., under negation: "I *don't* have *some* of the files" → I have none? I have all?)  
     - Implicatures without speaker intention (e.g., automated texts: "Your flight is delayed" → frustration)  
     - Misaligned intentions (Speaker implies *p* via unstated premise; Hearer concludes *q* as assertion)  

  3. **Distinctions to Preserve**:  
     - Said vs. implicated content  
     - Conversational (CI) vs. conventional implicature (e.g., "therefore," "but")  
     - Generalized (default-like) vs. particularized (context-dependent) CI  
     - CI vs. entailment, presupposition, perlocutionary effect  
     - CI vs. unarticulated constituents ("It's raining" → *here*)  

  4. **Explanatory Burdens**:  
     - **Cancellability**: Can be negated without contradiction ("Some attended, in fact all did").  
     - **Reinforceability**: Can be stated explicitly ("Some attended, but not all").  
     - **Non-detachability**: Survives rephrasing (synonym substitution).  
     - **Calculability**: Recoverable via reasoning about speaker goals/maxims.  
     - **Defeasibility**: Vanishes in contexts defeating expectations.  
     - **Indeterminacy**: Multiple possible implicatures in weak contexts.  
     - **Priority Problem**: Fixing "what is said" before applying maxims, yet pragmatics intrudes on saying (e.g., quantifier domain restriction).  

  5. **Empirical Constraints**:  
     - Acquisition: Children struggle with scalar implicatures until age 6–7.  
     - Processing: Scalar implicatures show delayed computation (reaction-time studies).  
     - Cross-linguistic variation: Exclusivity of "or" is stronger in English than Mandarin.  
     - Speaker-less texts: CI generated without communicative intent.  

  ---

  ### **II. Desiderata for an Adequate Theory**  
  *Table: Requirements Motivated by Phenomena*  

  | **Requirement**                          | **Motivating Case/Phenomenon**                                                                 | **Type**       |  
  |------------------------------------------|------------------------------------------------------------------------------------------------|----------------|  
  | **P1: Cancellability**                   | "Some attended, *in fact all did*" (no contradiction)                                          | **[C]**        |  
  | **P2: Non-Intrusiveness**                | "The gas station is open" → *it sells gas*; pragmatics doesn’t affect truth conditions         | **[C]**        |  
  | **P3: Calculability**                    | Relevance inference: B’s car → Bill is here; requires rational reconstruction                  | **[C]**        |  
  | **P4: Speaker-Relativity**               | Ironic "Great job!" → criticism; intention-dependent                                           | **[C]**        |  
  | **P5: Non-Detachability**                | "Some attended" vs. "There are attendees but not all" → same implicature                       | Constitutive?  |  
  | **P6: Reinforceability**                 | "Some attended, *but not all*" (natural conjunction)                                           | Preference     |  
  | **P7: Defeasibility**                    | "Some attended... *all except the dean*" in context where dean’s absence is known              | **[C]**        |  
  | **P8: Distinguish CI from Conventional** | "She’s poor *but* honest" (conventional) vs. "She’s poor and honest" (CI of contrast)          | **[C]**        |  
  | **P9: Handle Embedded Cases**            | Negation: "I don’t have *some* potatoes" → I have none? All? (Problem for default views)       | Empirical      |  
  | **P10: Accommodate Indeterminacy**       | Vague praise: "Nice dress" → genuine? sarcastic?                                               | Empirical      |  
  | **P11: Explain Acquisition**             | Children’s delayed mastery of scalar implicatures                                              | Empirical      |  
  | **P12: Speaker-Intention Optionality**   | Machine text: "Battery low" → charge now (no speaker)                                          | **[C]**        |  
  | **P13: No Collapse with Presupposition** | "John *stopped* smoking" (presupposes he smoked) vs. "John smokes" → unhealthy? (CI)           | **[C]**        |  

  ---

  ### **III. Non-Standard Cases & Their Implications**  
  1. **Misaligned Intentions**:  
     - *Case*: Speaker says "The keys are on the table," intending hearer to infer *from context* that the car is unlocked. Hearer instead believes speaker *asserted* the car is unlocked.  
     - *Force*: Tests whether CI requires **mutual knowledge** (Grice) or merely speaker intention (neo-Gricean). Challenges P3 (calculability) if hearer recovers non-intended inference.  

  2. **Embedded Indefinites**:  
     - *Case*: "If you *don’t* eat *some* of the cake, you won’t get dessert."  
       - Standard prediction: ¬∃x → ¬dessert (implicature: you ate none).  
       - Actual reading: Failure to eat *any amount* → no dessert (no scalar implicature under negation).  
     - *Force*: Undermines **default-based accounts** (e.g., Levinson). Requires embedded implicatures to be sensitive to **downward-entailing contexts**.  

  3. **Unintended Implications**:  
     - *Case*: Speaker says "You can have coffee or tea" (intending mere permission). Hearer infers free-choice: *both* are allowed.  
     - *Force*: Challenges P4 (speaker-relativity). Must CI require intention? Or can hearer-driven defaults generate it?  

  ---

  ### **IV. Suspected Tensions Between Desiderata**  
  1. **Calculability (P3) vs. Default Generation (e.g., neo-Gricean)**:  
     - If implicatures are default (automatic), calculability is post-hoc rationalization. Evidence: Processing studies show delay for scalars, suggesting computation, not retrieval.  

  2. **Cancellability (P1) vs. Embedded Implicatures (P9)**:  
     - Cancellability tests assume implicature attaches to utterance-level content. But in embeddings ("*It’s possible* that some attended" → ¬certainty), local cancellation fails. *This may invalidate the classic test*.  

  3. **Non-Intrusiveness (P2) vs. Pragmatic Intrusion**:  
     - Cases like "The leaf is green" (→ naturally? artificially?) suggest pragmatics *can* affect truth conditions. If so, P2 is theory-laden (favors Grice over truth-conditional pragmatics).  

  4. **Speaker-Relativity (P4) vs. Speaker-Optionality (P12)**:  
     - How can machine-generated texts carry CI without a speaker? Suggests P4 must be weakened to *hearer-oriented* recovery.  

  ---

  ### **V. Verdict on Major Theories**  
  | **Theory**               | **Biggest Failure**                          | **Desiderata Best Met**                     |  
  |--------------------------|----------------------------------------------|---------------------------------------------|  
  | **Grice**                | P9 (embeddings), P11 (acquisition delay)     | P1–P8 (core phenomena)                      |  
  | **Neo-Gricean (e.g., Levinson)** | P3 (calculability as rational process), P9 | P6, P11 (defaults fit processing)           |  
  | **Relevance Theory**     | P2 (intrudes on truth conditions), P5 (detachability via syntax) | P9, P10 (context-driven) |  
  | **Truth-Conditional Pragmatics** | P8 (collapses CI/presupposition), P1 (cancellability) | P9, P12 (embeddings, no-speaker cases) |  

  - **Most Exclusionary Requirement**: **P2 (Non-Intrusiveness)**. It decisively excludes Relevance Theory and truth-conditional pragmatics for allowing pragmatic enrichment in "what is said." Griceans and neo-Griceans treat this as non-negotiable.  
  - **Best Overall Fit**: **Neo-Gricean** accounts (e.g., Gazdar, Sauerland) satisfy the most desiderata *if* default generation is accepted. They handle cancellability (P1), reinforcement (P6), and speaker-less cases (P12) better than Grice, but stumble on calculability (P3) and embeddings (P9).  

  ---

  ### **VI. Critical Uncertainties & Revisability**  
  - **Where I Could Be Wrong**:  
    1. **P2 (Non-Intrusiveness)** may be dogmatic. If evidence from psycholinguistics (e.g., eye-tracking during quantifier processing) shows pragmatic intrusion *before* semantic composition, P2 should be demoted to preference.  
    2. **P3 (Calculability)** might be too strict if implicatures are subpersonal defaults. Neural models generating CI without explicit reasoning could challenge this.  
    3. **P12 (Speaker-Optionality)** may conflate CI with *conventions of use*. If CI is defined by intentional communication, machine texts might only carry "quasi-implicatures."  

  - **Evidence That Would Change the List**:  
    - **Cross-linguistic data** showing CI without cancellability (e.g., in some sign languages) → weakens P1.  
    - **ERP studies** confirming embedded implicatures as CI (not entailments) → forces revision of P9.  
    - **Acquisition studies** revealing early mastery of scalars in some contexts → undermines P11’s universality.  

  This framework treats the desiderata as *tools for theory-stressing*, not axioms. The tensions (especially P1 vs. P9, P3 vs. defaults) reveal why no account dominates—making it ideal for seminar debate.
