prompt: |-
  ok so I've been going down a rabbit hole on the color phi phenomenon (two dots flash in different spots and you seem to watch the first one change color partway over to the second) and Dennett's Orwellian-vs-Stalinesque framing of it, and I want a coherence check on where I've landed before I inflict it on my reading group. Here's the package:

  1. I'm a functionalist at heart — if two hypotheses about the mind make no difference to behavior or to what the brain is doing, then there's no real fact of the matter between them, they're just two descriptions of the same thing.
  2. In color phi I think there really is a color change in the experience, it isn't just a quirk of how people report it.
  3. I think the Orwellian/Stalinesque question — whether the experience itself was stitched together already-revised, or whether a normal experience was had and the memory of it rewritten afterward — is genuine and well-posed, and for any given case there's a fact of the matter which one it is.
  4. I think the Libet-style results are best read as the conscious will being a post-hoc construction the brain assembles after it has already started moving.

  Which of these actually pull against each other, which pairs only look like they conflict, and for the real ones what's the cheapest thing that has to give? Please rank the genuine tensions by severity rather than dumping them all out as equally bad, and tell me the single revision that cleans up the most. Last line, just: \answer{the commitment that has to go}
