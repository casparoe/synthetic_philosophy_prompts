answer: |-
  Your diagnosis is sharp: the core impasse is indeed modal/metaphysical, not empirical. Both camps share clinical data but interpret it through incompatible intuitions about pain's *essential nature*. One holds that the unpleasant affective dimension is intrinsic to the phenomenal character of pain—it's constitutive. An experience lacking this "badness" simply *isn't* pain, regardless of verbal reports about "feeling" something; asymbolia patients must therefore be misinterpreting a different sensation (e.g., intense non-painful interoception). The other camp sees affective valence as a separable, contingent component added to a core sensory-discriminative signal. Here, asymbolia reveals this dissociation, proving the "sensation" can exist independently. No new lesion study or scan can resolve this, as each side dismisses the other's interpretation of reports ("they aren't *really* feeling pain" vs. "they *are* feeling pain without suffering").

  Progress likely requires acknowledging two distinct questions conflated under "pain":  
  1.  **Mechanistic/Phenomenological:** What neural/sensory components *typically* co-occur in humans to constitute the experience we call pain, and how can they dissociate? (Asymbolia is key evidence here).  
  2.  **Essentialist/Definitional:** What *must* be true for a state to *be* pain? (This depends on pre-theoretical intuitions about necessity).  
  Conflating these guarantees stalemate. Clarifying which question is being asked—and accepting that the second might not have a purely empirical answer—is the path forward.

