prompt: |-
  I work in the emerging-risk team of a mid-sized general insurer, and a growing share of my job is putting a defensible number on exposures we have never written before: a new class of injury claim arising from warehouse automation, a product-liability exposure from a battery chemistry that has been in the field for only eighteen months, a one-off liability from a construction method nobody in the market has yet insured. I have roughly two days per case, no scope for bespoke statistical modelling, and whatever I produce has to survive sign-off by the chief actuary with the regulator looking over our shoulder. The recurring difficulty is never the arithmetic; it is choosing the class of past events from which to take the frequency at all. Take the battery case: I could draw on all lithium-ion incidents, on all battery incidents in warehouse settings, on incidents involving this specific cell format, on this manufacturer's earlier product line, or on industrial fires generally, and the frequencies those pools give me differ by two orders of magnitude. A senior colleague's rule of thumb is simply to use the narrowest class with at least a hundred observations, but that strikes me as smuggling in a statistical convention while quietly ignoring relevance. I recognise this as the reference-class problem wearing a suit, and I know the classical answers in outline — take the narrowest class for which you have reliable data, take a homogeneous class, take the widest class that still contains the event — but I have never seen them turned into something a working analyst can actually execute under deadline.

  Please write me that procedure. I want the questions I should ask, in order, when I have to fix a reference class for a novel risk; what counts as a sufficient answer to each; the tests I should run to decide whether a class is too narrow to be reliable or too broad to be relevant; the point at which the procedure stops and tells me to use a class and stop second-guessing myself; and the point at which it hands the decision back to a person because the question has become one of what we are willing to be held to rather than one of fact. It must be usable by someone who knows statistics but not the philosophy, so tell me which distinctions from the theory have to survive the simplification and which can safely be dropped, and be candid about the ways the procedure will misfire.

  Then run it on two of my cases: the battery-chemistry exposure, where I have eighteen months of data covering a class of roughly forty incidents, and a first-of-its-kind claim from a construction method where the only usable pool is "all large construction liability claims". For at least one of these I expect an outcome I will not like — a recommendation to use a broader, duller class than the one the underwriters are pressing for — and I would rather hear it now than at sign-off. Finish by saying plainly what the procedure cannot do, and where I should simply document my judgment and move on. Please write the whole answer in British English.
reasoning: |-
  Okay, let me unpack this request carefully. The user is a risk analyst facing the classic reference-class problem in insurance underwriting, but with real-world constraints - tight deadlines, regulatory scrutiny, and novel risks. They're asking for a procedural solution that bridges theory and practice.

  Hmm... the core tension here is between statistical reliability and relevance. The senior colleague's "narrowest class with 100 observations" rule fails when new technologies have limited data. I recall Hájek's work on reference classes - the problem is fundamentally about choosing which historical data maps meaningfully to emergent risks. But the user needs executable steps, not philosophy.

  Right, first I need to design a process that:
  - Starts with the narrowest plausible class then expands only when necessary
  - Has clear quantitative thresholds for data adequacy (not just 100 as magic number)
  - Builds in relevance checks before accepting broader classes
  - Defines unambiguous stopping points
  - Separates statistical decisions from underwriting judgment

  For the battery case with only 40 incidents, the procedure must handle sparse data. For the construction case with only broad class available, it needs to validate relevance. Both will likely force compromises the underwriters won't like - that's intentional. The user explicitly wants this honesty.

  Important to flag where the procedure can't help: when all classes are equally (un)suitable, or when risk drivers are fundamentally different. That's where documenting judgment becomes key. Must emphasize this isn't a substitute for expertise - just a framework to structure thinking.

  British English throughout, as requested. Will use "whilst" not "while", "colour" not "color", etc. Also need industry terms like "actuary" and "underwriter" correctly.
answer: |-
  ## Defensible Reference-Class Selection Procedure for Novel Risks  
  *(For use by insurance risk analysts under time constraints)*

  **Core Principles:**  
  1.  **Start Specific, Expand Only When Forced:** Prioritise relevance over sample size initially.  
  2.  **Test Both Directions:** Explicitly check for *under-reliability* (statistical noise) AND *over-irrelevance* (meaningless aggregation).  
  3.  **Document Rigorously:** Justification is as crucial as the number. The regulator cares about the *process*.  
  4.  **Know When to Stop:** The procedure forces a usable answer or flags an unresolvable judgment call.  

  **The Procedure – Questions & Actions (Sequential):**

  1.  **Define the Novel Event Precisely:**  
      *   *Question:* What are the *minimum necessary characteristics* defining the specific risk event? (e.g., "Thermal runaway in Li-ion battery pack using Manufacturer X's NMC-811 chemistry within automated warehouse handling system").  
      *   *Sufficient Answer:* A clear, unambiguous definition isolating the novel aspect(s) from general background risk. List key differentiating factors (chemistry, application, control systems).  
      *   *Action:* Write this definition down. This is your "Ideal Class".

  2.  **Identify the Narrowest Plausible Class (NPC):**  
      *   *Question:* What is the most specific historical dataset capturing events sharing *all key differentiating factors* identified in Step 1?  
      *   *Sufficient Answer:* A dataset containing events *as close as possible* to the ideal definition. (e.g., "All thermal runaway incidents involving Manufacturer X's NMC batteries, regardless of application").  
      *   *Action:* Acquire frequency data for this NPC.

  3.  **Test NPC for Statistical Reliability (The "Too Narrow?" Test):**  
      *   *Question:* Does the NPC have sufficient data to estimate frequency with acceptable confidence?  
      *   *Tests:*  
          *   **Count:** `N_obs` (Number of observed loss events).  
          *   **Exposure:** `Exp` (Total exposure-years/units insured in the NPC).  
          *   **Rule of Thumb:** If `N_obs < 5` OR (`N_obs < 20` AND `Exp < 100,000` exposure-years/equivalent), the NPC is likely **too unreliable** for primary use. *Rationale:* Extremely sparse data leads to volatile estimates highly sensitive to single events.  
      *   *Sufficient Answer:* Pass (Reliable) or Fail (Unreliable).  
      *   *Action:*  
          *   If **Pass**: Go to Step 5 (Relevance Test).  
          *   If **Fail**: Proceed to Step 4.

  4.  **Expand Systematically (Widen the Net):**  
      *   *Question:* What is the *next broadest* class that logically includes the NPC *and* has significantly more data? Relax *one* differentiating factor at a time, starting with the factor judged *least critical* to the novel risk mechanism.  
      *   *Sufficient Answer:* A defined class (e.g., "All thermal runaway incidents involving any NMC-811 chemistry batteries" or "All thermal runaway incidents in warehouse settings regardless of battery chemistry").  
      *   *Action:*  
          1.  Define the new candidate class.  
          2.  Acquire `N_obs` and `Exp` for it.  
          3.  Apply the **Reliability Test (Step 3)** to this new candidate.  
          4.  If it **Fails**, repeat Step 4 (relax another factor).  
          5.  If it **Passes**, proceed to Step 5 (Relevance Test) *for this candidate class*.

  5.  **Test Candidate Class for Relevance (The "Too Broad?" Test):**  
      *   *Question:* Is the candidate class *sufficiently homogeneous* regarding the novel risk drivers? Could factors *within* the class significantly alter the risk profile for *our specific novel exposure*?  
      *   *Tests:*  
          *   **Subset Analysis:** Does the frequency within the NPC (even if unreliable) differ *materially* (>50% difference) from the frequency in the *rest* of the candidate class? (e.g., Frequency in Manufacturer X NMC vs. *other* NMC in the broader class).  
          *   **Causal Homogeneity:** Is there strong engineering/scientific/claims evidence that the factor(s) relaxed to form this class *fundamentally change* the loss mechanism or severity? (e.g., Does warehouse application *materially* alter thermal runaway risk compared to other industrial uses? Evidence suggests yes).  
          *   **Severity Check:** If severity is a major concern, does the candidate class exhibit consistent severity patterns? High variance suggests heterogeneity.  
      *   *Sufficient Answer:* Pass (Relevant) or Fail (Irrelevant/Aggregated).  
      *   *Action:*  
          *   If **Pass**: **STOP.** Use this candidate class. Document justification (Steps 1-5).  
          *   If **Fail**: **GO BACK to Step 4.** You must relax *another* factor to find a broader class that passes the Reliability Test. *Rationale:* A class passing reliability but failing relevance provides a misleading estimate. Keep widening.

  6.  **The Fallback & Judgment Call:**  
      *   *Trigger:* You reach a class that passes Reliability (Step 3) but fails Relevance (Step 5), and you *cannot* widen further (no broader logical class exists, or the next class is patently absurd).  
      *   *Action:*  
          1.  **Document Exhaustively:** Record all classes considered, test results, and the inherent conflict (reliability vs. relevance).  
          2.  **Flag Judgment:** State clearly: *"The selected class [Specify] provides statistical reliability but is acknowledged to be heterogeneous regarding key novel risk factors [List factors]. The estimated frequency is considered a starting point requiring significant adjustment for material differences in [Specific Novel Aspects]."*  
          3.  **Quantify Uncertainty:** Apply a wider confidence interval or explicit loading (e.g., +50%/-30%) reflecting the heterogeneity.  
          4.  **Hand Back:** This is now a decision for the Chief Actuary/Underwriter, informed by the analysis but requiring explicit sign-off on the judgment adjustment. The procedure flags *where* judgment is critical.

  **What Survives Simplification / What's Dropped:**  
  *   **Survives:** The core tension relevance vs. reliability; sequential testing; using subset analysis as a relevance proxy; causal reasoning; documented judgment.  
  *   **Dropped:** Philosophical debates on "true" homogeneity; complex Bayesian methods; searching for an objectively "correct" class (acknowledges it's often pragmatic).  

  **Where the Procedure Misfires:**  
  1.  **Novelty Trap:** If the novel risk driver *fundamentally alters* the underlying mechanism (e.g., a chemical interaction unseen before), even the narrowest class might be irrelevant. The procedure flags this as a relevance fail, forcing judgment/adjustment.  
  2.  **Correlation Blindness:** If an unobserved factor correlates perfectly with a relaxed factor, relevance might be overestimated. Engineering input is vital.  
  3.  **Sparse Subsets:** Subset analysis (Step 5a) fails if the NPC data is unusable (`N_obs < 2`). Reliance shifts to Step 5b (Causal Homogeneity).  
  4.  **It Doesn't Create Data:** If no reliable *and* reasonably relevant class exists (e.g., truly unique risk), the procedure forces heavy reliance on expert judgment (Step 6).

  ---

  **Application to Your Cases:**

  **Case 1: Battery Chemistry Exposure (NMC-811, 18 months data, ~40 incidents)**  

  1.  **Ideal Class:** "Thermal runaway incidents in Manufacturer X's NMC-811 battery packs in field applications."  
  2.  **NPC:** Manufacturer X NMC-811 incidents (`N_obs` ~40, `Exp` = total pack-years over 18 months).  
  3.  **Reliability Test:** `N_obs` = 40 > 20. Likely passes unless `Exp` is astronomically large (unlikely for 18 months). **PASS.**  
  4.  *(Not needed - NPC passed Reliability)*  
  5.  **Relevance Test (for NPC):**  
      *   *5a Subset Analysis:* N/A (This *is* the target class).  
      *   *5b Causal Homogeneity:* Is 18 months enough to see stable patterns? Does ageing data show unexpected behaviour? *Potential Issue:* 18 months is short for full lifecycle. Evidence needed on degradation curves. If no alarming early degradation patterns, **PASS (Conditional)**. If degradation is a major unknown concern, **FAIL.**  
      *   **Action (Likely):** **STOP. Use NPC.** Document conditional pass based on limited ageing data. Flag potential need for future adjustment as more ageing data emerges. Apply wider confidence interval due to limited exposure period. *Underwriters get their specific class, but with clear caveats.*

  **Case 2: Novel Construction Method (Only Pool: "All Large Construction Liability Claims")**  

  1.  **Ideal Class:** "Liability claims arising specifically from [Novel Construction Method X]."  
  2.  **NPC:** [Novel Construction Method X] claims. `N_obs` = 1 (the first-of-its-kind claim).  
  3.  **Reliability Test:** `N_obs` = 1 < 5. **FAIL.**  
  4.  **Expand:** *No* narrower logical class exists (it's unique). Forced to use "All Large Construction Liability Claims". Acquire `N_obs` & `Exp` for this class. Assume it passes Reliability (large dataset).  
  5.  **Relevance Test (for "All Large Construction"):**  
      *   *5a Subset Analysis:* N/A (No narrower subset data).  
      *   *5b Causal Homogeneity:* Does Novel Method X introduce fundamentally new risks (e.g., unique failure modes, unprecedented severity potential, untrained labour) demonstrably *not* present in "standard" large construction? If yes (highly likely for a true innovation), **FAIL.**  
      *   **Action:** **Go to Step 6 (Fallback).**  
  6.  **Fallback/Judgment:**  
      *   Document: Reliable class ("All Large Construction") is used out of necessity but judged highly heterogeneous and likely *underestimating* the specific risk of Method X due to [list novel risk factors].  
      *   **Recommendation:** Apply a *significant upward loading* to the base frequency (e.g., +100% to +300% or more, based on engineering assessment of novelty). Apply an *explicit uncertainty loading* (e.g., +50%/-30% on final estimate).  
      *   **Outcome:** You use the broad, "duller" class, but with documented, justified adjustments reflecting the novel risk. This forces the Chief Actuary/Underwriter to explicitly endorse the judgment loading. *You won't like this, but it's defensible.*

  ---

  **What the Procedure Cannot Do & Where to Document Judgment:**

  1.  **Create Homogeneity:** It cannot make a heterogeneous class homogeneous. If the best available class is a mix of apples and oranges, and the novel risk is a grapefruit, it forces you to *acknowledge and adjust* (Step 6).  
  2.  **Quantify Unknown Unknowns:** It cannot model risks fundamentally different from any historical precedent (e.g., a completely new failure mode).  
  3.  **Replace Expert Causation Analysis:** Judging the *materiality* of a relaxed factor (Step 5b) requires deep technical/engineering input. The procedure forces you to *seek and document* this input.  
  4.  **Set the Judgment Loading (Step 6):** The size of the adjustment is pure expert judgment based on perceived risk differentials.  

  **Where to Document Judgment and Move On:**  
  *   **Step 5b (Causal Homogeneity):** When judging if a relaxed factor materially changes the risk. Cite your sources (engineer report, scientific paper, claims analysis).  
  *   **Step 6 (Fallback):** When selecting the loading factor for the heterogeneous class. Clearly state the rationale for the chosen percentage.  
  *   **Any Point Where Data is Unavailable:** If you cannot get `N_obs` or `Exp` for a logical class, document the attempt and reason for unavailability (e.g., "Market data on Manufacturer Y's prior chemistry not available due to confidentiality").  

  **Final Word:** This procedure won't produce perfect answers for novel risks – nothing can. It forces structured, defensible thinking, minimizes arbitrary choices, exposes critical assumptions, and ensures regulators see a rigorous *process*. The discipline lies in faithfully following the steps and documenting where judgment *must* take over. Presenting the Chief Actuary with a clear analysis showing *why* the underwriter's preferred class might be unreliable or irrelevant, alongside a justified alternative, is far stronger than an unsupported specific estimate or an unadjusted broad one. Good luck.
