  To confirm, the user should test Dev with "exactly 99" vs "exactly 100" - he'd obviously pick 100. Then try "exactly 99" vs "0-1000" - if consistency holds, he'd still pick the precise but slightly wrong theory over the meaningless range.

  My confidence is high in this prediction (80%) because Dev consistently values precision. The least certain part is whether he'd consider being directionally wrong (undershooting) differently than symmetric errors - but his symmetrical view in previous cases suggests it won't matter.
answer: |-
  Based on Dev's rulings and stated principles, here's the breakdown:

  **Dev's Likely Rules:**
  1.  **Precision/Informativeness:** A theory that makes a *sharper* (more specific) claim is preferred, as it "rules more out" and is more falsifiable. (Seen in all rulings except the symmetric error case).
  2.  **Accuracy/Closeness:** Among false theories, the one *closer* to the truth is preferred. (Seen in '99 vs 60').
  3.  **Symmetry:** Overshooting and undershooting by the same amount are equally bad. Distance is absolute. (Seen in '99 vs 101' tie).
  4.  **Rejection of Extreme Vagueness:** Very wide intervals are scientifically useless, even if technically true. (Seen in '90-110 vs 0-1000').

  **Prediction for 'exactly 99' vs 'somewhere between 0 and 1000':**
  *   **Rule 1 (Precision):** Strongly favors 'exactly 99'. It's maximally precise (one specific number). '0-1000' is maximally vague within the conceivable range.
  *   **Rule 2 (Accuracy):** Favors 'exactly 99'. It's wrong by 1 moon. '0-1000' is technically true but uselessly vague.
  *   **Rule 3 (Symmetry):** N/A. Only one specific number here.
  *   **Rule 4 (Reject Vagueness):** Strongly favors 'exactly 99'. He explicitly chose a narrower true range over a vastly wider one ('90-110' vs '0-1000') and rants about forbidding things.

  **Bet:** He picks **'exactly 99'**.  
  **Why?** His core principle is that science needs *informative, falsifiable* claims. '0-1000' forbids almost nothing and lacks any explanatory power. While 'exactly 99' is false, it's *very* close and embodies the precision he values. Trading a tiny inaccuracy for massive informativeness aligns with his hatred of hedging and his rulings against vagueness. His rant about "truth not being something you trade in" likely targets pragmatism or instrumentalism, not the *scientific virtue* of making bold, testable claims – even if they turn out slightly wrong. A miss by 1 moon is trivial compared to the gulf in informativeness.

  **Confidence:** High (80%). His rejection of vagueness is his strongest, most consistent principle.  
  **Least Sure About:** Whether the tiny (1 moon) inaccuracy of '99' triggers his "won't pick" symmetry reflex *against* a true but useless theory. I doubt it, given his strong preference for precision over mere truth-value in other cases.  

  **Test Pair to Settle It:** Feed him **'exactly 100' vs 'somewhere between 0 and 1000'**. He'll instantly pick 'exactly 100'. Then immediately ask **'exactly 99' vs 'somewhere between 0 and 1000'**. If he consistently values precision/falsifiability over minor inaccuracy, he'll pick '99'. If he balks, it reveals accuracy (or symmetry) dominates when comparing *any* false specific claim to extreme vagueness. (Word count: 298)
