  For the current dilemma ("exactly 99" vs "0-1000"), Dev would likely reject "0-1000" immediately as too vague - it forbids nothing. "Exactly 99" is precise but wrong since there are exactly 100 moons. The key tension is between Dev's principles: his hatred of vagueness versus his awareness that 99 is factually incorrect.

