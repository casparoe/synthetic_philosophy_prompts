prompt: |-
  I'm a novelist, about 80 pages into a book, and one of my main characters is a philosopher of science — I've been modelling him on my friend Dev, who acutally does this for a living, and the scene the whole novel turns on needs him to rule on which of two theories about my invented planet is closer to the truth. The planet has exactly 100 moons. I've stipulated that, so there's no real astronomy to look up.

  What I do have is a list of rulings Dev has given me at dinner when I feed him made-up pairs, which I do because the dialogue is better than anything I invent. He knows the cases are fake. He can't help himself.

  - 'exactly 100' vs 'exactly 90': 100, no hesitation.
  - 'exactly 100' vs 'somewhere between 90 and 110': 100 — a true claim that rules more out beats a true claim that rules less out.
  - 'between 99 and 101' vs 'between 90 and 110': the narrower one.
  - 'exactly 99' vs 'exactly 60': 99, the one that's wrong by less.
  - 'exactly 99' vs 'exactly 101': he says they're level, won't pick. He's symetrical about distance — doesn't care if you overshoot or undershoot.
  - 'between 90 and 110' vs 'between 0 and 1000': the first.

  The scene I'm stuck on has him comparing 'exactly 99' against 'somewhere between 0 and 1000'. What does he say?

  I want the rule or rules he seems to be running, what each of them predicts here, which one you'd bet on and why, and the pair I should feed him to settle it. Say how confident you are in each part and which part you're least sure about. Under 400 words please, I'm reading this on my phone in a cafe.

  (He hates hedging and says a theory that forbids alot is the whole point of science, which is why I lean one way. But he's also ranted at me for ten minutes about truth not being something you can trade in, which is why I don't. I know 'verisimilitude' means something else in my line of work — whether a character feels real — and I've given up trying to work out if the two senses are connected. Different book.)
