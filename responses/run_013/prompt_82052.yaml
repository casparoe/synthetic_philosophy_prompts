answer: |-
  Below is a structured analysis of desiderata for the Special Composition Question (SCQ), addressing your requirements. The SCQ asks: *Under what conditions do some things compose a further object?* I'll first present a table of desiderata (with cases/considerations and constraint/prejudice status), then identify tensions, the most exclusionary requirement, a scorecard of major theories, and implications for "interests."

  ---

  ### **Desiderata Table**  
  *(Genuine Constraint = GC; Theoretical Prejudice = TP)*

  | **Desideratum** | **Case/Consideration** | **Constraint/Prejudice** | **Notes** |
  |-----------------|------------------------|--------------------------|-----------|
  | **1. Ordinary Objects Exist (OOE)** | Your sourdough jar, forests, rivers. Denying these violates common sense and linguistic practice. | **TP** (Conservative metaphysics) | Must preserve everyday objects without excessive revisionism. |
  | **2. Principled Basis (PB)** | Slime mold/bucket brigade: Composition can’t be arbitrary ("only when I point at it"). | **GC** | Rules out brute facts or ad hoc exceptions. Science assumes law-like regularity. |
  | **3. No Vagueness if Parthood is Precise (NVP)** | Repaired bowl (Kintsugi): If atoms have sharp boundaries, how can composite boundaries be fuzzy? | **GC** | Avoids contradictions in mereology. If parts are exact, wholes should be exact absent sorites. |
  | **4. Privilege Organisms (PO)** | Slime mold/lichen: Organisms unify parts functionally; heaps (e.g., sand pile) do not. | **TP** (Biological exceptionalism) | Reflects intuition that organisms are "more real" than aggregates. |
  | **5. No Privileged Status for Life (NPL)** | Biology: Living things obey physics; metabolism is just chemistry. Lichen symbionts *can* survive separately. | **GC** | Science shows no ontological gap between living/non-living matter. |
  | **6. Composites Not Causally Idle (CNCI)** | Bucket brigade: Collective action (passing sandbags) has real effects. Physics' completeness implies no overdetermination. | **GC** | If physics is causally closed, composites must either (a) not exist or (b) have non-redundant causal powers. |
  | **7. Supervenience on Intrinsic Features (SIF)** | Sourdough starter: Its persistence depends on internal properties (acidity, microbiota), not external labels. | **TP** (Reductionism) | Rejects external/conventional factors as determinative. |
  | **8. Avoid Gerrymandering (AG)** | Your critique: A theory shouldn’t cherry-pick cases (e.g., "composition only for organisms + artifacts I like"). | **GC** | Prevents theory-saving by arbitrary adjustments. |
  | **9. Identity Conditions (IC)** | Sourdough starter: Over 6 years, matter is replaced. Is it the *same* object? | **GC** | Must account for persistence through part-replacement. |
  | **10. Distinguish Composition from Identity (DCI)** | Bucket brigade: The group ≠ its members. | **GC** | Mereological nihilism violates this; universalism respects it. |
  | **11. Distinguish Objects from Heaps (DOH)** | Forest (object) vs. leaf litter (heap); organism vs. corpse. | **TP** (Common-sense ontology) | Heaps lack unity/unified persistence conditions. |
  | **12. Scientific Consistency (SC)** | Quantum entanglement: Parts can be non-locally connected; biology’s nested systems (mitochondria as symbionts). | **GC** | Cannot contradict physics/biology (e.g., denying composites while science studies ecosystems). |

  ---

  ### **Key Tensions**  
  The most significant **inconsistency** is between:  
  - **OOE** (Ordinary Objects Exist) + **PO** (Privilege Organisms)  
    and  
  - **NPL** (No Privileged Status for Life) + **CNCI** (Composites Not Causally Idle).  

  **Why?**  
  - **OOE** demands composites like tables, rivers, and sourdough jars exist.  
  - **PO** insists organisms are privileged unities.  
  - **NPL** argues biology doesn’t treat life as metaphysically special (e.g., a virus challenges "organism" definitions).  
  - **CNCI** requires composites to have causal powers, but physics’ causal closure implies composites are either epiphenomenal or identical to their parts.  

  **Result:** No theory satisfies all four simultaneously. *Universalism* sacrifices PO/NPL; *nihilism* sacrifices OOE; *organism-only* violates NPL/CNCI.  

  ---

  ### **Most Exclusionary Requirement**  
  **PB (Principled Basis)** does the heaviest lifting:  
  - Rules out *conventionalism* and *context-dependence* (seen as arbitrary).  
  - Challenges *moderate views* (e.g., "only when parts are bonded") due to boundary problems (e.g., is a river "bonded" water?).  
  - Only *nihilism* and *universalism* fully satisfy PB, but at high cost elsewhere.  

  ---

  ### **Theory Scorecard**  
  *(✓ = Satisfies; ✗ = Violates; ~ = Partially Satisfies)*  

  | **Desideratum** | **Nihilism** (No composites) | **Universalism** (All composites) | **Organism-Only** | **Conventionalism** | **Context-Dependence** |
  |-----------------|----------------------------|---------------------------------|-------------------|---------------------|-------------------------|
  | **OOE**         | ✗                          | ✓ (too many)                    | ~ (only organisms) | ~                   | ~                       |
  | **PB**          | ✓ (simple)                 | ✓ (simple)                      | ✗ (life is vague) | ✗                   | ✗                       |
  | **NVP**         | ✓                          | ✗ (vague sums)                  | ✗                 | ✗                   | ✗                       |
  | **PO**          | ✗ (no organisms)           | ✗ (no privilege)                | ✓                 | ~                   | ~                       |
  | **NPL**         | ✓ (no life special)        | ✓                               | ✗                 | ~                   | ~                       |
  | **CNCI**        | ✓ (no composites)          | ✗ (causal overdetermination)    | ✗                 | ✗                   | ✗                       |
  | **SIF**         | ✓                          | ✓                               | ~                 | ✗                   | ✗                       |
  | **AG**          | ✓                          | ✓                               | ✗ (gerrymanders life) | ✗                 | ✗                       |
  | **IC**          | ✗ (no persistence)         | ~ (depends on parts)            | ✓                 | ~                   | ~                       |
  | **DCI**         | ✗ (wholes=parts)           | ✓                               | ✓                 | ~                   | ~                       |
  | **DOH**         | ✗ (no objects)             | ✗ (no distinction)              | ✓                 | ~                   | ~                       |
  | **SC**          | ✗ (contradicts biology)    | ✓                               | ✗ (ignores non-life systems) | ~       | ~                       |

  **Summary:**  
  - **Nihilism** fails OOE/SC but excels in PB/NPL.  
  - **Universalism** fails PO/CNCI/NVP but satisfies PB/SC.  
  - **Organism-Only** fails NPL/CNCI/PB but satisfies PO/IC.  
  - **Conventionalism/Context-Dependence** fail PB/SIF/AG but flexibly handle OOE.  

  ---

  ### **Implications for "Interests"**  
  Whether composites (colonies, forests, your jar) can **have interests** depends on composition:  
  - **If composites exist robustly** (e.g., *organism-only*): Then organisms (sourdough cultures, forests) can have interests (e.g., survival, homeostasis).  
  - **If composites are illusory/conventional** (e.g., *nihilism*): Only fundamental particles exist—no interests beyond sentient parts.  
  - **Universalism**: Arbitrary sums (e.g., "trout-turkey") lack interests; organisms might via emergent functions.  
  - **Science**: Biology ascribes interests to systems with goals (e.g., immune response), but physics sees no "goals" in matter.  

  **Verdict**: Only *organism-only* or *context-dependence* grant interests to colonies/jars, but at the cost of NPL/PB. **There is no fact of the matter** satisfying all constraints—your suspicion of inconsistency is correct. The strongest candidate for "interests" is a teleological view (e.g., *only goal-directed systems compose*), but this violates NPL and struggles with vagueness (is a river "goal-directed"?).  

  Your sourdough jar’s interests hinge on whether we privilege self-maintaining systems—a choice not dictated by metaphysics alone.
