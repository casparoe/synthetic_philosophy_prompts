prompt: |-
  Ok so I'm taking this course on probability and philosophy and we've just spent two weeks on Bertrand's paradox, and I've managed to get into a genuinely heated argument with my flatmate about it, so I want a number from you to settle it. Set-up, in case it matters: unit circle, inscribed equilateral triangle, so the cutoff chord length is √3, and the question is the probability that a randomly drawn chord is longer than that. Three recipes, three answers — random endpoints gives 1/3, a random point on a radius with the perpendicular chord drawn through it gives 1/2, a random point in the disk used as the midpoint gives 1/4. My flatmate's line is that the mess dissolves once you demand the right invariances: the answer shouldn't depend on how the circle is rotated, and it shouldn't depend on the radius either, and if you impose both then the only prior left standing is uniform over distance-from-centre and angle, which spits out 1/2. I think that's cheating, because the radius-invariance bit is doing all the work and nothing in the original question asked for it, and I'm more drawn to the deflationary story that 'a random chord' simply doesn't name a physical procedure, so there's no fact of the matter to be right about.

  Here's the proposition I want your credence in: there exists a single correct, non-arbitrary principle (indifference, or some successor to it) that fixes a unique prior over the chords of a given circle from the geometry alone, so that the bare under-specified question has a determinate answer — one of 1/3, 1/2, 1/4, or something else. Give me a number for that, then break it into the sub-questions you think it hangs on, with a rough probability for each and how they combine. At minimum I'd want: how much rides on whether the problem is merely under-specified (no fact of the matter until you name the experiment) versus genuinely having a determinate answer we're just bad at finding; whether an invariance/symmetry argument of the kind my flatmate gives can be made non-question-begging, and how much of its force survives once you notice that different invariance demands give you different answers; whether some homogeneity or natural-partition constraint of the sort people use in the cube-factory case (uniform over edge length vs uniform over volume, and they can't both be right) can be made precise enough to pick out a unique measure; and whether the whole enterprise of squeezing objective priors out of ignorance is a dead end, in which case this is just a job for subjective priors or for a reference class the problem itself doesn't supply. My credence is about 0.25, hers is about 0.8, so I'd also like your best guess at which single sub-question we actually disagree about, rather than a restatement of the fact that we do.

  Be as uncommitted as the evidence warrants rather than picking a side to be interesting, and tell me explicitly which consideration would move your number the most and in which direction — what would you have to be shown about invariance arguments, or about under-specification, to end up at 0.1, or at 0.9 — and where in your own decomposition you'd most expect to be wrong. I dont need reading suggestions or names, just the reasoning.
