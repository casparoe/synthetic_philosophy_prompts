  The key might be recognizing that they're operating with different conceptions of what makes something truly a "code." For literalists, causal arbitrariness suffices; for deflationists, intentionality seems required. This fundamental mismatch explains why they keep circling back to the same arguments.

  As for progress, I doubt more molecular details will help since both sides can incorporate them into their frameworks. What might move things forward is:
