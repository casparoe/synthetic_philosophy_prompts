  **UNITED PROVIDENTIAL ASSURANCE CO.**
  **P.O. Box 114 • Damascus, Bilad al-Sham**
  **Ref: CLAIM-AA1147-JABIR**

  October 26, 2023

  Mr. Omar ibn Hassan
  12 Fig Tree Lane
  Basra, Iraq

  **Subject: Denial of Claim for Property Loss – Dwelling Fire, September 15, 2023**

  Dear Mr. ibn Hassan,

  We refer to your claim submission dated September 20, 2023, regarding the reported destruction of your dwelling and contents by fire on the aforementioned date, Claim Reference CLAIM-AA1147-JABIR. United Providential Assurance Co. (UPA) has completed its review of the circumstances, guided by the terms of Policy No. UP-SHIELD-776 and the underlying principles governing all contingent events.

  We must inform you that your claim for indemnification is denied.

  Our investigation, consistent with established metaphysical principles governing phenomena (specifically the 11th-century Asharite school as elucidated by Imam al-Ghazali, upon which our policy exclusions rely), reveals the following material facts:

  1.  **The Nature of the Event:** While your submission describes the event as a "fire caused by an overturned oil lamp," this characterization misattributes agency. The observed sequence – contact between ignited lamp oil and the cotton drapery, followed by the combustion of the drapery and subsequent structural involvement – represents a *customary conjunction* of events ordained by Divine Will. The lamp oil and flame served merely as the *occasion* for the manifestation of the property loss. The actual creation of the combustion event in the drapery, the wood, and indeed the entire destructive sequence, was an immediate, discrete act of Divine Agency occurring at each successive moment. The flame itself possessed no inherent power to "cause" combustion; combustion was *created* at the moment of proximity by the sole True Agent.

  2.  **"Act of God" Exclusion (Policy Clause 7b):** Your policy explicitly excludes coverage for losses arising directly or indirectly from an "Act of God." Standard industry interpretation confines this to unusual, disruptive events like earthquakes or floods. However, UPA's foundational risk assessment, adhering to strict theological accuracy, recognizes that *all* events, without exception, are direct, immediate Acts of God. The observed regularities in property damage (fire consuming cotton, water causing rot) are merely the "Custom of God" (‘ādah), a consistent pattern of Divine action which He is absolutely free to alter or suspend at any instant without contradiction. Whether the combustion of your drapery represented the continuation of this Custom or a unique, non-customary Divine Act (i.e., a miracle) is irrelevant to the fundamental point: the loss was directly and solely created by Divine Agency. Clause 7b therefore categorically applies to *all* loss events, rendering the concept of a "non-Act-of-God" loss metaphysically incoherent under our binding interpretation.

  3.  **Obligation and Indemnity:** The principle of Divine Sovereignty, integral to the aforementioned framework, holds that God owes no obligation (‘wājib) whatsoever to any creature. UPA, as a signatory to contracts operating within this reality, necessarily reflects this principle. While we collect premiums based on statistical observations of Divine Custom and human actions (acquired, see below), the notion that UPA *owes* compensation upon the occurrence of a loss contingent upon Divine action is unsustainable. The destruction of your property was an Act of God for which God, and consequently UPA as an entity operating under His sovereign will, bears no debt or obligation to you. Indemnification would imply a necessary connection between premium payment and loss prevention/compensation, a connection explicitly denied by the metaphysics governing causation.

  4.  **Premiums and Custom:** The premiums paid under your policy were due and collected based on the observed statistical regularity (Custom) of events like structural fires occurring in conjunction with certain human actions and material configurations within our risk pool. This Custom allows for probabilistic assessment. Payment was required as consideration for UPA's agreement to potentially act *within the bounds of the Custom*, contingent upon our assessment of obligation (addressed above). The non-refundability of premiums reflects the service of maintaining the policy structure and assessing claims based on Divine Custom during the policy period, regardless of the ultimate determination regarding obligation arising from specific Divine Acts.

  5.  **Volitional Acquisition (Kasb) and Policy Conditions (Clause 4a - Carelessness):** Our investigation notes evidence suggesting the overturned lamp resulted from your actions. While ultimate causal power resides solely with God, human beings acquire (kasb) their voluntary acts. The act of creating the precarious situation involving the lamp and flammable materials is attributed to you through your volitional acquisition of that act created by God. Policy Clause 4a excludes coverage for losses arising directly from the Insured's "carelessness or neglect." Your acquired carelessness – the volitional placement or handling leading to the lamp's overturning – is the acquired occasion upon which God created the subsequent events. The loss is therefore excluded under Clause 4a due to your acquired carelessness, notwithstanding the ultimate Divine Agency in every moment of the event sequence. The premium obligation arose from the general Custom; the exclusion applies due to the specific nature of your acquired action within that Custom.

  In conclusion, the destruction of your property was a direct, unmediated Act of God, categorically excluded under Policy Clause 7b. Furthermore, no obligation to indemnify arises from such an Act. Additionally, your acquired carelessness directly preceding the event triggers exclusion under Clause 4a. Consequently, United Providential Assurance Co. denies liability for any indemnification related to Claim Reference CLAIM-AA1147-JABIR.

  This denial represents the final determination on this claim.

  Sincerely,

  **Malik ibn Yusuf**
  Senior Claims Adjuster
  Litigation & Theological Compliance Unit
  United Providential Assurance Co.

  **cc: Underwriting Department, Legal Department (UPA)**
