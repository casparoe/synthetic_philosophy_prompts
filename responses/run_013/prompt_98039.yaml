prompt: |-
  I keep running into this thing where math predicts stuff in physics that nobody had any real reason to expect, and some physicist called it the unreasonable effectiveness of mathematics. My buddy who read a bit of philosophy built this argument and I honestly can't tell if its airtight or a trick. (1) The exact same equations keep showing up in totally unrelated parts of physics, like heat flow and probability and electric fields all sharing the same math. (2) If the exact same math describes two seperate things, that sameness can't be something we're just reading into it; it has to be a feature the things really share. (3) So that structure is really out there in the world, whether or not any of us is around. (4) And if the structure is really there, then the world basically just is mathematical structure. (5) But if the world is mathematical structure, then any consistent structure you can write down has to be realized somewhere in reality. (6) Theres no end of consistent structures, and some of them can't all be true of the same world at once. (7) So reality would have to contain contradictory facts, which is nuts. (8) So the whole effectiveness thing must just be us imposing a language on the world that sometimes happens to fit.

  He says this proves math isn't describing anything real. I think something slipped, maybe around (2) and (3), but I can't name it. So: which step do I give up, and what does it actually cost me? Like if I drop (3), am I stuck saying math isn't true about anything at all? And is he right that its either math is real or its just projection, with nothing in between?
