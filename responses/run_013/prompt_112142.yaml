prompt: |-
  I have been reading decision theory on and off for years, mostly in the blog-and-forum tradition rather than the journals, and what I want from you here is a specification rather than a tour. Fix the setting first: an agent has to choose, now, among options handed to it as probability–payoff profiles; it cannot decline to act, cannot buy more information, and has nothing else to fall back on. I want the requirements for a theory that an agent in that position could actually use, so any verdict that amounts to "we cannot say" has to be earned rather than asserted.

  Here is the material the requirements have to answer to.

  1. St. Petersburg. A fair coin is tossed until it lands heads; heads on toss n pays $2^n. The expectation is +∞. Extreme, but it is a verdict, and the finite truncations climb monotonically without bound.

  2. Pasadena. Same coin, different payoffs: heads on toss n pays $2^n/n when n is odd and costs $2^n/n when n is even, so the payoffs run +$2, −$2, +$8/3, −$4, +$32/5, and so on. Outcome n has probability 2^−n, so it contributes (−1)^(n+1)/n to the sum. Added in the order I just wrote them, those contributions converge, to ln 2 ≈ 0.69. But the positive contributions diverge on their own and the negative ones diverge on their own, and the same contributions added in a different order converge to any real number you choose, or fail to converge at all. Nothing in the game privileges one order over another, so on the natural reading this option has no expectation: it is not worth +∞, it is not worth anything.

  3. The same game with the signs stripped out. Payoffs $2^n/n at probability 2^−n, all positive. The expectation is the sum of 1/n, which diverges to +∞, so it is perfectly well defined. The damage in case 2 comes from the signs, not the magnitudes.

  4. An ordinary ratio. The payoff is X/Y, where X and Y are independent standard normal variables, making it a Cauchy variable. The expectation does not exist, since both tails diverge, yet the distribution is symmetric about zero, so every symmetry argument says the option is worth exactly $0, and the symmetric truncation of the integral (integrate over |x| > ε, then let ε → 0) also gives $0. No contrived coin game is needed to get here; ratios of noisy quantities do it.

  5. The finite cousin. An option paying an astronomically large but finite sum with astronomically small probability has a perfectly well-defined finite expectation, and in the standard telling of the mugging it is thought to exhibit the same underlying trouble. So no requirement on the list can be met by forbidding infinite payoffs.

  Now the list I want. What must any theory in this area deliver to count as adequate for the setting above? For each requirement, give the case that motivates it and the reason it is a requirement rather than a preference; mark which ones are non-negotiable and which are commitments of a particular camp; order them by how much work they do; and say which single requirement, if dropped, would readmit the most otherwise-dead theories — banning infinite utilities, refusing to evaluate options with undefined expectations, adopting some favored summation or renormalization rule, retreating to dominance reasoning alone. Tell me also if any of the things I am treating as requirements is really just a prejudice of the expected-value tradition.

  The part I care about most is the collision. I suspect at least one pair of plausible requirements cannot both hold — roughly, "the value of an option is fixed by its probability–payoff profile, so it cannot depend on the order in which we happen to write the outcomes down" against "the value of an option is the limit of the values of its finite approximations," since Pasadena's truncations converge so obligingly to ln 2 while its rearrangements refuse to converge at all. If a pair like that is genuinely unsatisfiable, say which one I should give up and what giving it up costs elsewhere.

  Cover these explicitly, if they are requirements at all: whether "no expectation" is a fact about the option or about our evaluative machinery; whether the theory owes a verdict on every pair of options or an account of incomparability, and if the latter, one that still leaves the agent able to act; whether it must agree with ordinary expected utility wherever the expectation exists; whether it must be immune to exploitation, and if so what the pumps look like given that the theory's own verdicts are what an adversary gets to trade against; and what it says about diversification and repetition, given that a coin flip between Pasadena and its exact negation is still not evaluable, and that the sample mean of repeated plays does not settle down.

  I do not need a survey of who has said what, and I do not need citations. I need the criteria, the cases behind them, and an honest verdict on which of them collide.
reasoning: |-
  We are in a setting where an agent must choose among options given as probability-payoff profiles. The agent cannot decline, cannot get more information, and has no fallback. We must specify requirements for a decision theory to be adequate in this setting.

  The cases provided:

  1. **St. Petersburg**: Infinite expectation. Finite truncations increase without bound.
  2. **Pasadena**: The expectation is conditionally convergent (depends on order). The series of positive terms diverges, and so does the series of negative terms.
  3. **Same as Pasadena without signs**: The expectation diverges to +∞.
  4. **Ratio of two independent standard normals (Cauchy distribution)**: Symmetric about 0, but expectation undefined. Symmetric truncation gives 0.
  5. **Finite cousin**: Finite but astronomically large payoff with tiny probability (Pascal's mugging) has a finite expectation.

  We now outline the requirements for a decision theory. We will motivate each requirement by a case, state why it is a requirement (non-negotiable) or a camp commitment, order them by the work they do, and identify which requirement, if dropped, would readmit the most otherwise dead theories. We will also address the collision between two plausible requirements and explicitly cover the points raised.

  ## Requirements

  ### R1: Completeness (Non-negotiable)
     - **Motivation**: The agent must choose; it cannot decline to act. Therefore, the theory must provide a way to compare any two options and yield a verdict (or at least a way to act when comparisons are incomplete, but the agent must act). Incompleteness must be handled in a way that still allows the agent to pick an option.
     - **Reason**: Without this, the agent would be paralyzed. This is a non-negotiable requirement for any theory in this setting.
     - **Work done**: High. Forces the theory to assign a value (or a set of values) to every option.

  ### R2: Consistency with Finite Cases (Non-negotiable)
     - **Motivation**: In ordinary finite cases, expected utility is well-defined and uncontroversial. The theory must agree with expected utility when the expectation exists (i.e., when the sum or integral is absolutely convergent).
     - **Reason**: Without this, the theory would fail in the most basic cases. This is non-negotiable because it is the foundation of decision theory.
     - **Work done**: Medium. It constrains the theory only in the finite and absolutely convergent cases.

  ### R3: Respect for Stochastic Dominance (Non-negotiable)
     - **Motivation**: If option A pays at least as much as option B in every state and strictly more in some state with positive probability, then A should be preferred to B. This is a fundamental principle.
     - **Reason**: Violating dominance leads to clear irrationality (e.g., being exploitable). Non-negotiable.
     - **Work done**: Medium. It rules out some theories but leaves room for handling the tricky cases.

  ### R4: Value Depends Only on the Probability-Payoff Profile (Non-negotiable)
     - **Motivation**: The Pasadena game. The value of an option should not depend on the order in which we describe the outcomes. The profile (the assignment of probabilities to payoffs) is what matters.
     - **Reason**: If the value changes when we relabel the outcomes arbitrarily, then the theory is arbitrary. This is non-negotiable because the decision should be based on the underlying randomness, not the labeling.
     - **Work done**: High. It forces the theory to assign a unique value to the Pasadena game (or declare it undefined, but then we need to handle that in choice).

  ### R5: Continuity with Respect to Natural Approximations (Camp Commitment)
     - **Motivation**: St. Petersburg and Pasadena. The finite truncations of St. Petersburg increase without bound, suggesting the infinite version should be valued at infinity. The finite truncations of Pasadena converge to ln 2. But note: for Pasadena, rearrangements break convergence. So if we require that the value is the limit of the finite truncations (in a particular order), we get ln 2, but R4 says order shouldn't matter.
     - **Reason**: This is a desirable property but may conflict with R4. Without continuity, the theory might ignore the structure of the approximation. However, in Pasadena, the limit of truncations in the natural order is ln 2, but rearrangements change the limit. So if we require continuity in a specific order, we violate R4. Therefore, this is a camp commitment (e.g., held by those who favor the "weak expected utility" approach for Pasadena) but not non-negotiable.
     - **Work done**: Medium. It helps in extending the theory from finite to infinite cases.

  ### R6: Symmetry (Non-negotiable)
     - **Motivation**: The Cauchy distribution (case 4). The distribution is symmetric about zero, so the option should be worth zero. Also, in the Pasadena game, if we flip the signs of all payoffs, the new game should be valued at the negative of the original if the original is defined. But note: the Pasadena game is not symmetric.
     - **Reason**: Symmetry is a fundamental principle of fairness and often leads to unique answers (like zero for the Cauchy). Non-negotiable for symmetric cases.
     - **Work done**: Low to medium. It mostly applies in symmetric cases.

  ### R7: Immunity to Exploitation (Dutch Books) (Non-negotiable)
     - **Motivation**: If the theory is vulnerable to a Dutch book (a series of bets that lead to sure loss), then it is irrational. This requirement must hold relative to the theory's own valuations.
     - **Reason**: Without this, an agent could be pumped for money. Non-negotiable.
     - **Work done**: High. It forces the theory to be coherent.

  ### R8: Handling of Diversification and Repetition (Camp Commitment)
     - **Motivation**: The Pasadena game and its negation. A single play is undefined, but a coin flip between the two (which is equivalent to a new game with payoffs being the average) still might not be defined. Also, repeated plays of the Pasadena game: the sample mean does not converge (by the law of large numbers for independent random variables, but here the variance is infinite so the standard law doesn't apply). However, the theory might have something to say about repeated plays.
     - **Reason**: This is important for real-world agents who face repeated decisions, but it might be beyond the scope of a one-shot setting. So it is a camp commitment (for theories that care about repetition) but not non-negotiable in the one-shot setting.
     - **Work done**: Medium. It requires the theory to account for multiple plays.

  ## Collision: R4 vs R5

  The main collision is between R4 (value depends only on the profile) and R5 (continuity via finite truncations). In the Pasadena game, if we take the natural order of outcomes (by toss number), the finite truncations converge to ln 2. But R4 says that if we rearrange the outcomes arbitrarily, the value should not change. However, rearrangements of the terms in the series can make it converge to any real number or diverge. Therefore, if we require R5 (with a specific order) we violate R4. Conversely, if we require R4, then we cannot define the value by the limit of truncations in a particular order because that order is arbitrary.

  ### Resolution
  - We must give up R5 as a general requirement. We cannot demand that the value is the limit of the finite truncations in a fixed order because that order is arbitrary. Instead, we might use a different method to assign a value to conditionally convergent series (if we assign one at all). But note: the Cauchy distribution (case 4) suggests that sometimes we can use symmetry to get a value even when the expectation does not exist in the usual sense.

  ### What does giving up R5 cost?
  - Without R5, we lose a natural way to extend expected utility from finite to infinite cases. However, we can still use other methods (like the Cauchy principal value for symmetric distributions, or more generally, a linear functional on a larger space of random variables). But for the Pasadena game, if we require R4, then we must either assign it a unique value (which would have to be ln 2? but that requires a natural order) or declare it undefined. But then we must handle undefined cases in choice (via R1).

  ## Additional Explicit Points

  ### Is "no expectation" a fact about the option or our machinery?
  - It is a fact about the option. The problem is that the integral (or series) does not converge absolutely. The machinery of expectation requires absolute convergence to be order-invariant. Therefore, the expectation is undefined in the usual sense. But a decision theory might use an extended notion (like the principal value) to assign a value.

  ### Must the theory compare every pair?
  - R1 (completeness) requires that the agent can choose, but it does not necessarily require that every pair is comparable. The theory might allow incomparability, but then it must provide a way to choose among incomparable options (e.g., by a secondary criterion, or by allowing any option). So the theory must at least be complete in the sense of providing a choice function.

  ### Must it agree with expected utility when defined?
  - Yes, R2 requires that.

  ### Must it be immune to exploitation?
  - Yes, R7 requires that.

  ### What about diversification and repetition?
  - R8 is a camp commitment. In the one-shot setting, we might not require it. But note: if we consider the one-shot option that is a mixture (like a coin flip between Pasadena and its negation), then we must evaluate that. The mixture of Pasadena and its negation is a new random variable: it has payoffs that are half the time from Pasadena and half the time from the negation. But note: the negation of Pasadena is the game with payoffs: heads on toss n pays -$2^n/n when n is odd and +$2^n/n when n is even. The mixture (by a fair coin) gives a new game: for each n, the payoff is either the Pasadena payoff or its negative, each with probability 1/2 (and independent of the toss). But the resulting game for each n has expected payoff 0? Actually, for each outcome n, the mixture gives:
        With probability 1/2: +$2^n/n (if we are in Pasadena and n odd) or -$2^n/n (if we are in Pasadena and n even)
        With probability 1/2: -$2^n/n (if we are in the negation and n odd) or +$2^n/n (if we are in the negation and n even)
     But note: the outcome n in the mixture is determined by two independent random variables: the coin for which game and the coin tosses for n. For each n, the expected payoff conditional on n being the result is:
        If n is odd: (1/2)*(2^n/n) + (1/2)*(-2^n/n) = 0.
        If n is even: (1/2)*(-2^n/n) + (1/2)*(2^n/n) = 0.
     So the mixture has expectation 0? Actually, the entire mixture game has a well-defined expectation: the expectation of the mixture is the average of the expectations of the two games? But if each game has an undefined expectation, we cannot do that. However, per outcome, we see that the payoff for the mixture in outcome n is 0? Not exactly: the mixture does not combine the outcomes of the two games. It selects one game to play and then plays it. So the mixture is a compound lottery. But we can reduce it to a single lottery: the probability of outcome n is still 1/2 * (1/2^n) for each game, but now we have two games. The total probability of outcome n (meaning the coin lands at toss n) is (1/2)* (1/2^n) [from the Pasadena game] + (1/2)*(1/2^n) [from the negation] = 1/2^(n-1). But the payoff in the mixture when outcome n occurs depends on which game was chosen and the parity of n. Actually, it's easier to note that the mixture random variable is a new random variable that takes, for each n, the value of the Pasadena payoff at n with probability 1/2^(n+1) and the value of the negation payoff at n with probability 1/2^(n+1). But then the total payoff is a random variable that for each n, if the game chosen is Pasadena and n occurs, you get the Pasadena payoff for n, and similarly for the negation. But the events are disjoint. So the entire random variable has a payoff for each outcome (which is a pair: which game and which n). The expectation of the mixture is the sum over n and over the two games of (probability) * (payoff). The probability for a particular game and n is (1/2) * (1/2^n). The payoff is either the Pasadena payoff at n or the negation payoff at n. So the expectation is:
        (1/2) * [sum_n (1/2^n) * Pasadena(n)] + (1/2) * [sum_n (1/2^n) * Negation(n)]
     But the negation of Pasadena has payoffs that are the negative of Pasadena? Actually, no: the negation game has payoffs that are the negative of the Pasadena payoffs. So the second sum is the negative of the first. But if the first sum (the expectation of Pasadena) is undefined, then we cannot say the mixture is 0. However, if we consider the entire mixture, we can compute the expectation directly by the outcomes of the mixture. For each n, the event "n occurs in the Pasadena game" has probability 1/2^(n+1) and payoff Pasadena(n), and the event "n occurs in the negation game" has probability 1/2^(n+1) and payoff -Pasadena(n). So the overall contribution for each n is:
        (1/2^(n+1)) * Pasadena(n) + (1/2^(n+1)) * (-Pasadena(n)) = 0.
     Therefore, every outcome n contributes 0, so the total expectation is 0. This is well-defined.

     So the mixture of Pasadena and its negation is a game with expectation 0. Therefore, even though Pasadena alone is undefined, the mixture is defined and worth 0. A theory must be able to handle this: it should assign 0 to the mixture.

     Similarly, repeated independent plays of the Pasadena game: the average of n independent plays might not converge (because the variance is infinite, the law of large numbers fails). But the theory might assign a value to repeated plays by considering the overall expectation per play? But if the expectation per play is undefined, then the total expectation for n plays is also undefined. However, the mixture example shows that sometimes we can combine two undefined options to get a defined one.

     Therefore, a requirement might be that the theory must be able to assign values to mixtures (convex combinations) of options, and the value of a mixture should be the corresponding combination of the values when they are defined? But if they are undefined, we cannot combine. However, in the mixture above, we computed the expectation without relying on the individual expectations. So the theory must be able to assign a value to the mixture without relying on the values of the components. This is handled by R1 and R2: the mixture is a new option with a well-defined probability-payoff profile (which we computed above) and it has an expectation of 0, so R2 applies.

  ## Which Requirement to Drop to Readmit the Most Theories?

  If we drop **R4 (value depends only on the profile)**, then we allow theories that assign different values to the same game based on how it is described (like the order of outcomes). This would readmit theories that use a fixed order (like the weak expected utility theory for Pasadena that uses the natural order and gets ln 2). It would also allow theories that use different orders arbitrarily. But dropping R4 is a big cost because it violates the principle that the decision should be based on the underlying probabilities and payoffs, not the labeling.

  Alternatively, if we drop **R5 (continuity via truncations)**, then we do not require that the value is the limit of finite truncations. This would readmit theories that assign a value to the Pasadena game by other means (like symmetry or a principal value) or leave it undefined. But then we must handle undefined cases (via R1). This is less damaging because R5 was already a camp commitment.

  Dropping R5 would readmit the most otherwise dead theories. Many theories (like standard expected utility) are dead for the Pasadena game because they require absolute convergence. By dropping R5, we allow theories that might extend expected utility by using a different summation method (but then they might violate R4 if they are order-dependent) or by leaving it undefined. But note: if we leave it undefined, then we must have a way to choose (R1).

  ## Final List of Requirements (Non-negotiable unless marked)

  1. **Completeness (R1)**: Must allow the agent to choose among any set of options.
  2. **Consistency with Finite Cases (R2)**: Must agree with expected utility when the expectation exists (absolutely convergent).
  3. **Stochastic Dominance (R3)**: Must respect dominance.
  4. **Profile-Dependence (R4)**: The value depends only on the probability-payoff profile, not on the description.
  5. **Symmetry (R6)**: In symmetric cases (like the Cauchy distribution), the value must respect the symmetry (e.g., 0 for the Cauchy).
  6. **Immunity to Exploitation (R7)**: Must be immune to Dutch books.

  And as camp commitments (not non-negotiable, but desirable):

  - **Continuity via Truncations (R5)**: The value is the limit of the values of finite truncations (if that limit exists in a natural order).
  - **Handling of Diversification and Repetition (R8)**: The theory should account for the value of mixtures and repeated plays.

  ## Verdict on the Collision

  We drop R5 as a non-negotiable requirement. We cannot require the limit of truncations in a fixed order because it violates R4. Instead, we must assign a value to the Pasadena game by other means or leave it undefined. If we leave it undefined, then we must use a secondary criterion (allowed by R1) to choose among options that are undefined.

  One approach: 
     - Use expected utility for absolutely convergent cases (R2).
     - For conditionally convergent cases, we might use the Cauchy principal value or symmetry when applicable (like the Cauchy distribution). For the Pasadena game, there is no symmetry to exploit. 
     - Alternatively, we can assign the value by the natural order (ln 2) as a convention, but that violates R4. 

  But note: R4 is non-negotiable. Therefore, the Pasadena game must either be assigned a unique value that respects the profile (which requires that the value is invariant under rearrangements) or be left without a defined value. Since rearrangements can change the sum, the only way to have invariance is if the series is absolutely convergent, which it is not. Therefore, we must leave the Pasadena game as undefined.

  Then, how does the agent choose when the Pasadena game is an option? The theory must provide a way (by R1). One possibility: the agent uses a secondary criterion, such as the minimax regret or a preference for options with defined expectations. But that is beyond the scope of the basic requirements.

  In summary, the collision is resolved by dropping R5 and accepting that some options (like Pasadena) are undefined. Then the theory must include a method for choosing among options that may be undefined (e.g., by comparing their truncations at a high level, or by a dominance comparison in the truncations). However, note that the mixture of Pasadena and its negation is defined (0) and dominates both? Actually, it doesn't dominate because the Pasadena game can yield very high positive payoffs and the mixture does not. But the mixture is safer.

  This is complex, but the core requirements (R1-R4, R6-R7) are non-negotiable and can be satisfied by a theory that uses expected utility for absolutely convergent cases and a secondary criterion for others. Such a theory must be immune to Dutch books, which might require that the secondary criterion is coherent.

  ## Final Note on Pascal's Mugging (case 5)

  The finite cousin (Pascal's mugging) has a finite expectation, so R2 applies and the theory must assign that expectation. This is non-negotiable. Therefore, any requirement that forbids large utilities is not acceptable. We cannot drop R2.

  The theory must deliver:

  - For St. Petersburg: The expectation is +∞. The theory must assign +∞ and then, since the agent is choosing among options, it would choose this over any finite amount. But note: the agent might face multiple options with infinite expectation. Then we need a secondary criterion (like comparing the finite truncations) to break ties. This is an extension.

  - For the Pasadena game: The theory must either assign a unique value (which must be invariant under rearrangement, so it cannot be ln 2) or leave it undefined. Since we cannot assign a unique value without violating R4 (if we use a particular order) or R2 (if we assign arbitrarily), we leave it undefined. Then the agent uses a secondary criterion to choose when comparing to other options.

  - For the Cauchy distribution: The theory must assign 0 by symmetry (R6).

  - For the finite cousin (Pascal's mugging): The theory must assign the finite expected value.

  Thus, the requirements we have listed are the minimal non-negotiable ones, and they force us to leave the Pasadena game undefined. This is the cost of R4.
answer: |-
  Below is a structured specification of requirements for a decision theory in your setting, addressing the cases provided. The requirements are ordered by their foundational importance (most to least), with non-negotiables marked. The collision between two key requirements is analyzed, and explicit questions are addressed.

  ---

  ### **Core Requirements for an Adequate Decision Theory**

  1. **Completeness of Choice (Non-negotiable)**  
     - **Motivation**: Agent cannot decline to act. Theories must yield a choice for any set of options.  
     - **Case**: Pasadena (case 2) and its negation; both have undefined expectations. The agent must still choose between them or other options.  
     - **Reason**: Without this, paralysis occurs. The theory must either (a) assign a comparable value to all options, or (b) provide a rational selection rule (e.g., dominance, randomization) when values are incomparable.  
     - **Work done**: Highest; forces the theory to resolve indecision.

  2. **Profile-Invariance (Non-negotiable)**  
     - **Motivation**: Pasadena (case 2). The value must depend solely on the probability–payoff profile, not on how outcomes are ordered or labeled.  
     - **Case**: Pasadena’s expectation changes with rearrangement of terms (converges to any real number or diverges).  
     - **Reason**: Arbitrary labeling should not affect value; otherwise, the theory is inconsistent.  
     - **Work done**: High; rules out order-dependent summation rules.

  3. **Consistency with Defined Expectations (Non-negotiable)**  
     - **Motivation**: Ordinary expected utility (e.g., case 1, St. Petersburg, has expectation +∞; case 3 has +∞; case 5 has a finite expectation).  
     - **Case**: St. Petersburg (case 1) and its finite truncations (monotonically increasing to +∞).  
     - **Reason**: The theory must extend standard expected utility where it works. Rejecting this severs ties with foundational decision theory.  
     - **Work done**: High; anchors the theory in the uncontroversial base.

  4. **Stochastic Dominance (Non-negotiable)**  
     - **Motivation**: Dominance reasoning is foundational; e.g., if option A pays more than B in every state, A ≻ B.  
     - **Case**: Finite cousin (case 5); a dominated option with astronomically low probability must still be rejected.  
     - **Reason**: Violations lead to obvious irrationality (e.g., Dutch books).  
     - **Work done**: Medium; constrains choices but doesn’t resolve hard cases alone.

  5. **Symmetry Respect (Non-negotiable)**  
     - **Motivation**: Cauchy ratio (case 4). Symmetric distributions about zero must be valued at zero.  
     - **Case**: Cauchy distribution; symmetric truncations converge to 0.  
     - **Reason**: Symmetry is a fundamental invariance; ignoring it introduces arbitrariness.  
     - **Work done**: Low; applies narrowly to symmetric cases.

  6. **Immunity to Exploitation (Non-negotiable)**  
     - **Motivation**: Agents should not be vulnerable to Dutch books or trading pumps.  
     - **Case**: Pasadena-like options. An adversary could offer trades that exploit order-dependent valuations.  
     - **Reason**: A theory that permits guaranteed losses is pragmatically incoherent.  
     - **Pump example**: If the theory values Pasadena at +$0.69 (ln 2) due to truncation order, an adversary could sell a rearranged version valued at -$0.69, then pump the agent by charging for the "swap."  
     - **Work done**: Medium; forces internal consistency.

  7. **Continuity via Finite Approximations (Camp Commitment)**  
     - **Motivation**: St. Petersburg (case 1) and Pasadena (case 2). Finite truncations should approximate the full option.  
     - **Case**: Pasadena’s truncations converge to ln 2 in natural order; St. Petersburg’s increase to +∞.  
     - **Reason**: Desirable for grounding infinite cases in finite intuition. But it conflicts with Profile-Invariance (see **Collision**).  
     - **Work done**: Low; useful for limits but not essential.

  ---

  ### **Collision: Profile-Invariance vs. Continuity**
  - **Conflict**:  
    - **Profile-Invariance** demands value be order-independent.  
    - **Continuity** demands value be the limit of finite truncations (e.g., ln 2 for Pasadena).  
  - **Why unsatisfiable**:  
    Pasadena’s series is conditionally convergent: its finite truncations converge to ln 2 in natural order but diverge or converge elsewhere under rearrangement. Continuity fixes an order; Profile-Invariance forbids privileging any order.  
  - **Resolution**:  
    - **Drop Continuity** as a universal requirement. It is not non-negotiable.  
    - **Cost**: Loses the intuitive appeal of finite approximations. Pasadena cannot be valued at ln 2; it must be treated as undefined or assigned a value by other means (e.g., symmetry, but Pasadena lacks symmetry).  
    - **Result**: Pasadena has no expectation. The theory must still resolve choice via Completeness (e.g., secondary criteria like security levels).

  ---

  ### **Explicit Answers to Queries**
  - **"No expectation" – fact or machinery?**  
    It is a fact about the option. The expectation is undefined when the integral/series fails absolute convergence (Pasadena) or has divergent tails (Cauchy). The machinery doesn’t invent this; it detects it. Theories may assign values via extensions (e.g., Cauchy’s symmetry), but this is optional.

  - **Verdict on every pair vs. incomparability?**  
    Completeness requires the theory to enable choice, not necessarily complete comparability. Incomparability is allowed if the theory provides a rational selection rule (e.g., maximize minimum payoff, randomize). For Pasadena vs. its negation, both undefined, the agent might flip a coin or pick arbitrarily.

  - **Agreement with ordinary expected utility?**  
    Yes (Consistency with Defined Expectations). The theory must replicate standard results when expectations exist (absolutely convergent).

  - **Immunity to exploitation?**  
    Yes (non-negotiable). The theory’s valuations must prevent Dutch books. Adversaries trade against the theory’s own outputs, so inconsistency (e.g., order-dependence) enables pumps.

  - **Diversification and repetition?**  
    Not required universally (camp commitment).  
    - *Pasadena + negation*: A coin flip between them is a compound gamble. The mixture’s expectation is 0 (each outcome n has expected payoff 0), so the theory must value it at 0.  
    - *Repeated plays*: No requirement that sample means converge (Pasadena’s infinite variance violates the Law of Large Numbers). Repetition may be handled ad hoc (e.g., time-averaging).

  ---

  ### **Which Requirement to Drop to Readmit Dead Theories?**
  - **Drop Continuity (R7)**.  
    - **Theories readmitted**: Those using order-specific summation (e.g., weak expected utility for Pasadena at ln 2), truncation-based approaches, or renormalization.  
    - **Why**: Dead theories (e.g., naïvely truncating Pasadena) violate Profile-Invariance. Dropping Continuity avoids this conflict.  
    - **Impact**: Largest, as it revives theories that handle infinite cases via approximations.

  ---

  ### **Prejudices of Expected-Value Tradition**
  - **Continuity** is a prejudice. Expected-value traditions assume infinite options can be approximated by finite ones, but this fails for conditionally convergent cases (Pasadena).  
  - **Absolute convergence as the only criterion** is a prejudice. Theories may assign values to non-absolutely convergent options via symmetry (Cauchy) or other principles.

  ---

  ### **Summary of Non-Negotiables vs. Camp Commitments**
  | **Requirement**               | **Status**          | **Key Case**      |
  |-------------------------------|---------------------|-------------------|
  | Completeness of Choice        | Non-negotiable      | Pasadena & negation |
  | Profile-Invariance            | Non-negotiable      | Pasadena (rearrangement) |
  | Consistency with Defined Exp. | Non-negotiable      | St. Petersburg, Cauchy |
  | Stochastic Dominance          | Non-negotiable      | Finite cousin (mugging) |
  | Symmetry Respect              | Non-negotiable      | Cauchy ratio      |
  | Immunity to Exploitation      | Non-negotiable      | Pasadena pumps    |
  | Continuity                    | Camp commitment     | Pasadena truncations |
  | Repetition/Diversification    | Camp commitment     | Pasadena mixtures |

  ---

  ### **Final Verdict**
  The theory must treat Pasadena as undefined (violates Profile-Invariance if valued at ln 2). Choice is resolved via Completeness (e.g., randomize or apply security levels). Dropping Continuity is necessary and revives the most dead theories. The Cauchy is valued at 0 by symmetry; St. Petersburg at +∞; finite mugging at its expectation. Exploitation is barred by Profile-Invariance and Consistency.
