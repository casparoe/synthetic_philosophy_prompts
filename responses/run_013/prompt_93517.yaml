prompt: |-
  I have a colleague who has spent her working life on the ethics of copying and who advises makers, performers and researchers when they fall out over who owns what. She will give me a verdict on any case I put to her, and over the years I have collected a fair number. Her record so far:

  - A cook who ate a pastry chef's signature tart in the restaurant and afterwards made it at home for a family party: not wrong.
  - A baker in a country where the chef has never traded, who ate the tart on holiday, worked the recipe out for herself and now sells it in her own shop under a name she invented: not wrong.
  - A software developer who reimplemented a competitor's publicly documented file format so that her program could read the competitor's files, and who has made a good living from the resulting program, the competitor's own sales having risen as the format spread: not wrong.
  - A design student who copied a wallpaper designer's pattern as a technical exercise and showed it in the end-of-year exhibition, labelled as a study after that designer: not wrong.
  - A magician who was shown an effect at a closed session of a conjuring society, on the express understanding that methods demonstrated there were not to be performed by members who had not devised them, and who now performs it on the same circuit and bills it in his programme as his own creation: wrong.
  - A furniture maker who taught a masterclass on a hidden joint, on the same sort of understanding that those attending would neither teach nor sell the technique, and one of whom now builds with that joint and advertises her pieces as her own design: wrong.
  - A yarn company that took a pattern published in a book marked for personal, non-commercial use and put a mass-produced range of garments made to it on the market as its own designs: wrong.

  Her reasons shift from case to case. Sometimes she says the copier has taken the bread out of the originator's mouth; sometimes that the copier was let in on trust and broke it; sometimes that the audience was misled about who made the thing. She insists these are three ways of putting one point, which is precisely what makes me doubt she has identified the rule she is actually running.

  Next week I am putting this to her. A director, N, has toured a production of a Jacobean tragedy for three seasons: a particular reading of the play, with its own cuts, doubling scheme, design language and final tableau. A second company has now mounted a production that follows N's staging step by step, reconstructed from two visits and a television recording of the performance. The programme states, prominently, that the production is after N's, and the second company's director has said in interviews that she regards N's staging as the definitive reading of the play. Nothing was confidential: the staging was performed publicly for three seasons and filmed for broadcast. There is no contract between the two companies, and N accepts that nothing in the case is protected by copyright. The two companies are touring the same cities this season, and N's advance bookings have fallen by about a third wherever they overlap.

  Tell me what my colleague will say, and what she should say if she is to remain consistent with her own record. I care more about the rule than the verdict: set out the candidate rules that fit everything above equally well, say what each of them predicts about N's case, say which of her earlier cases is the closest analogue, tell me which rule you would bet on and why, and name a further case that would best tell the surviving candidates apart. If the record genuinely leaves the matter open, say so plainly, and set out what she would have to be committed to for each verdict she might reach.
reasoning: |-
  Hmm, the user presents a complex ethical puzzle involving intellectual property and copying. They've described seven cases where their colleague made judgments about copying ethics, and now want to predict how that colleague would rule on a new theater production case. The user seems intellectually engaged - they're clearly analyzing patterns in the judgments and care more about identifying the underlying principle than the specific verdict.

  Looking at the colleague's record, three key themes emerge: harm to originator (taking bread from their mouth), breach of trust, and misleading audiences. But as the user notes, these might be manifestations of a single unifying principle. The colleague insists they're "three ways of putting one point," which suggests there's a deeper coherence we need to uncover.

  For the theater case: Director N created a distinctive staging of a public domain play. Another company meticulously reconstructed that staging, credited N prominently as their inspiration ("after N's"), and both companies are now touring simultaneously, causing N's bookings to drop 30% where they overlap. All elements were publicly performed and broadcast, with no confidentiality agreements.

  Analyzing the past cases: The pastry chef, baker, software developer, and design student cases were all "not wrong" - each involved either transformative use, proper attribution, or no market harm. The magician, furniture maker, and yarn company cases were "wrong" - these involved broken confidences, direct competition with originators, or misleading claims.

  The closest analogue seems to be the baker case (similar reconstruction of another's work for commercial use, deemed "not wrong"), but the market harm aspect makes it tricky. The yarn company case has commercial harm but lacked attribution and violated explicit terms.

  If we extract candidate rules:
  1. Commercial Harm Rule: Wrong if copier financially harms originator in same market
  2. Attribution Rule: Wrong only if failing to credit originator
  3. Confidentiality Rule: Wrong only if breaching confidence/trust
  4. Creative Labor Rule: Wrong if appropriating unique creative labor without transformation

  Testing these against all cases reveals inconsistencies. The yarn company case violates all rules except attribution (they didn't credit), but they were deemed wrong despite no confidentiality breach. The baker case had commercial use but no harm since different markets.

  The Creative Labor Rule fits best: it explains why reconstructing N's unique interpretive labor without transformation, while credited, might still be ethically questionable when causing direct market substitution. The yarn company similarly appropriated creative labor despite the pattern being "non-commercial" in origin.

  For the theater case prediction: Colleague will likely say it's wrong, using the "taking bread from mouth" rationale due to the 30% booking drop. But consistency would require either:
  - Accepting it as "not wrong" like the baker case (if markets are separate enough), or
  - Admitting creative labor protection extends beyond formal IP

  Best test case would be: An artist reconstructs a public sculpture for commercial sale in same region as original artist, with full credit. Does this "take bread from mouth"? That would clarify whether physical access or creative labor drives the judgment.
answer: |-
  Based on your colleague's record and stated reasoning, I'll analyze the underlying rule, predict her verdict on N's case, identify the closest analogue, and propose a test case to resolve ambiguities. The record suggests multiple candidate rules, but no single principle cleanly explains all outcomes.

  ### Candidate Rules from the Record
  1. **Commercial Harm Principle**: Wrong if copying causes direct financial harm to the originator in their market.  
     - *Fits*: Magician (competes on same circuit), furniture maker (sells same technique), yarn company (commercializes non-commercial pattern).  
     - *Fails*: Baker (sells in different country, no harm implied), software dev (competitor's sales rose).  

  2. **Attribution/Trust Principle**: Wrong if the copier (a) breaks an explicit trust agreement, or (b) misleads audiences about authorship.  
     - *Fits*: Magician (broke society rules + claimed ownership), furniture maker (broke masterclass agreement + claimed design), yarn company (claimed as "own design").  
     - *Fails*: Baker (invented new name, no misleading), design student (credited as "study after").  

  3. **Creative Labor Principle**: Wrong if appropriating unique, non-obvious creative labor without transformation, especially if it substitutes for the original.  
     - *Fits*: Magician (copied effect), furniture maker (copied joint), yarn company (copied pattern).  
     - *Fails*: Software dev (reimplementation is transformative labor), baker (reverse-engineered independently).  

  4. **Access/Confidentiality Principle**: Wrong only if copying relies on privileged/confidential access.  
     - *Fits*: Magician (closed session), furniture maker (masterclass).  
     - *Fails*: Yarn company (public book, no confidentiality).  

  **Note**: Your colleague claims her reasons (harm, trust, misattribution) are "three ways of putting one point." This suggests a **unified principle**: *Copying is wrong when it exploits the originator's creative investment without consent, causing unjust detriment—whether through competition, broken trust, or misrepresentation.*  

  ---

  ### Prediction for N's Case
  **What she will say**: **WRONG**.  
  - **Her rationale**: Likely "taking bread out of N's mouth" due to the 33% booking decline. She may also argue the second company "exploited N's labor" without consent, despite the credit.  
  - **Inconsistency**: The baker case had no harm (different market), while here harm is direct. She'll prioritize commercial harm over attribution.  

  **What she *should* say to be consistent**: **NOT WRONG**.  
  - **Reasoning**:  
    - No breach of trust (everything public, no confidentiality).  
    - Clear attribution ("after N's" in programme).  
    - Unlike the yarn company, they didn't claim it as "own design."  
    - Closest analogue is the **baker** (public access, reverse-engineering, new branding) or **design student** (credited homage).  
  - **Contradiction**: The harm to N is significant, but her record only condemns harm when coupled with broken trust (magician/furniture) or misattribution (yarn company). Harm alone didn't sway the baker case.  

  ---

  ### Closest Analogue  
  - **Baker case** (reverse-engineering from public access, commercial use, no harm to originator's market).  
  - **Key difference**: N faces direct harm, while the pastry chef did not (baker was overseas). This distinction will likely drive your colleague's verdict.  

  ---

  ### Best-Fitting Rule & Bet  
  - **The Creative Labor Principle** (with harm as a factor) fits best. It explains:  
    - Why the baker is "not wrong" (independent effort + no harm).  
    - Why the yarn company is "wrong" (direct appropriation + harm).  
    - Why N's case *could* be wrong (copied unique staging labor, causing harm).  
  - **I'd bet on this rule** because it unifies "trust" (access to labor) and "harm" (exploitation of labor). Your colleague's phrasing ("taking bread out of their mouth") implies labor-based desert.  

  ---

  ### Test Case to Resolve Ambiguities  
  **Scenario**: A musician writes a song inspired by a leaked, unreleased demo from a famous artist. The musician credits the artist as inspiration but sells the song commercially. The original artist’s planned release of the demo is now canceled due to market confusion.  
  - **Why it distinguishes rules**:  
    - **Commercial Harm Principle**: Wrong (harm + same market).  
    - **Attribution/Trust Principle**: Wrong if the leak was confidential (breach of trust).  
    - **Creative Labor Principle**: Wrong (appropriated unreleased labor).  
  - **Outcome prediction**: Your colleague would call this **wrong**, prioritizing the originator's labor and harm over attribution.  

  ---

  ### Conclusion  
  The record **genuinely leaves N's case open** due to conflicting tensions:  
  - **For "not wrong"**: She must prioritize attribution and public access (like baker/design student), downplaying harm.  
  - **For "wrong"**: She must prioritize labor/harm (like yarn company), treating attribution as insufficient.  
  Her verdict will reveal whether "harm" alone can override attribution and public access. If she remains consistent with the baker case, N's case is not wrong; if she emphasizes harm, it's wrong. The test case above would force clarity on whether confidentiality or labor is her anchor.  
    
  **Final Bet**: She’ll rule "wrong" but *inconsistently*—prioritizing harm over her own precedents. Consistency demands "not wrong."
