prompt: |-
  I'm on the grant committee of a small foundation that funds longtermist / far-future stuff (yes, one of those), and I have to circulate a short written opinion before Thursday's meeting. I'm a longtime LessWrong/ACX lurker, so I know just enough jargon to get myself into trouble, but I want the memo to actually be right rather than just sound clever.

  The situation: we have $10M and it all goes to one grant. Two finalists, and the disagreement between them turned out to be wierdly deep.

  Proposal A is the boring one -- fund a program we have decent evidence actually works, helping maybe 100k people over the next few years. It'll definately do what it says. But the person pitching it makes a bigger argument too: they say we should assume humanity is probably near the end of its run, because if you're a random human drawn from all the humans who will ever live, you'd expect to land somewhere in the middle rather than near the start, so the number of people still to come is probably small -- meaning a longtermist dollar buys less than a dollar spent on people who are already here. (I think this is the doomsday argument or a cousin of it.)

  Proposal B is the longtermist one: basically a bet that civilization survives long enough to get enormous. The pitch isn't just "if the future is big, this is worth a lot." It's that we should be near-certain the future IS big, because of the self-indication thing: there are two possibilities, a small future (a few billion more people total) and a huge one (10^30-ish); since you're an observer, and the huge world contains vastly more observers, the huge world is vastly more likely to be the one containing you. So B's payoff is near-certain and it crushes A.

  So the two proposals are running opposite anthropic assumptions, and I can't tell whether that makes the whole comparison a wash or whether one of them is clearly the right way to think. My gut says the second guy is pulling something, but I know the first guy's assumption is the one that hands you the doomsday result, so I don't want to just wave it away. There's also a bonus argument from B that I can't tell is profound or confused: they say that since (under their assumption) you're more likely to exist in a world where B is funded and works, funding B makes you more likely to exist, so we should fund it partly for our own sake. That smells wrong but I can't articulate why. And one more wrinkle: our foundation's whole stated mission is longtermist, so voting for A feels like we'd be betraying the point of the place.

  Write the opinion I'll circulate. Recommend a concrete course of action -- A, B, or something in between, and if it's in between, spell out exactly what the conditions are -- with the reasoning. Take both anthropic assumptions seriously instead of just asserting that the weird one is weird; say which assumption each proposal is actually running, which one you think we should adopt (actually pick one, don't just tell me it's contested), and how much work the reference-class choice is doing here.

  And tell me what would change your mind: which argument or consideration, if it went the other way, would flip your recommendation, and where is your reasoning most likely to be wrong?
reasoning: |-
  Okay, let me start by unpacking the user's problem. They're on a grant committee for a longtermist foundation with $10M to award to one of two proposals. The core disagreement revolves around opposing anthropic arguments. Proposal A uses the doomsday argument to suggest humanity's future is short, favoring near-term aid. Proposal B uses the self-indication argument to claim a vast future is likely, justifying longtermist investments. The user needs a reasoned opinion to present, choosing between them.

  First, I need to recall the key concepts here. The doomsday argument (DA) posits that being born early in human history makes a short future more probable. The self-indication argument (SIA) suggests we're more likely to exist in a universe with many observers, so a big future is probable. The user mentioned that Proposal B's advocate claims funding B makes us more likely to exist, which seems like a confusion with observer selection effects.

  The user's identity is a LessWrong/ACX lurker, so they're familiar with jargon but not deeply versed. They want accuracy over sounding clever. The foundation's mission is longtermist, so recommending A might feel off-mission. The user's gut says Proposal B's argument feels fishy, especially the part about funding B affecting their own existence. That needs addressing.

  I should evaluate the validity of each anthropic principle. SIA has significant criticism for leading to observer-driven paradoxes, like presuming fine-tuned universes are likely. DA has its issues too, like reference class problems. The user wants a clear stance, so I need to pick which principle is more defensible. Academic consensus leans against SIA, so that's a point against B.

  The ethical dimension matters too. Even if SIA were valid, using it to justify actions because it benefits our existence seems like a confusion. It's an epistemic tool, not a causal one. Funding B doesn't cause us to exist; it's a selection effect. Highlighting this clarifies the flaw in B's bonus argument.

  The foundation's mission is longtermist, so rejecting B might seem contradictory. But I can argue that longtermism doesn't require certainty—it's about high-stakes, low-probability bets. Proposal A's doomsday argument might not negate longtermism if the potential upside is vast enough. Expected value calculations still favor longtermist actions even with pessimistic forecasts.

  Considering alternative actions: splitting funds might be an option, but the user specified $10M to one grant. Maybe a modified approach: fund A but allocate a portion to B conditional on further analysis. However, the user wants a concrete choice. Given the flaws in SIA and the solid evidence for A, recommending A makes sense, but with a caveat to address longtermism.

  The user asked what would change my mind. If SIA were validated or if Proposal B's impact were robust across probabilities, that could shift the recommendation. Also, if Proposal A's benefits were smaller, B's upside might dominate despite uncertainties.

  Finally, structuring the memo: start by clarifying the anthropic principles, dissect each proposal's reliance on them, critique SIA, address the bonus argument, tie to the foundation's mission, recommend A with a longtermist rationale, and outline what could change the decision.
answer: |-
  ## Grant Committee Memo: Recommendation on $10M Award

  **To:** Grant Committee  
  **From:** [Your Name]  
  **Subject:** Recommendation for $10M Grant - Proposal A vs. Proposal B - Anthropic Assumptions & Foundation Mission  
  **Date:** October 26, 2023  

  **Recommendation:** Award the $10M grant to **Proposal A**.  
  **Conditions for Reconsideration:** If credible evidence emerges demonstrating that Proposal B's intervention has a *significant probability* (>1%) of increasing humanity's survival/flourishing potential by an *order of magnitude* or more *even under pessimistic (non-SIA) anthropic assumptions*, or if robust new arguments decisively validate the SIA and refute its major criticisms, I would revisit this recommendation in favor of B. Absent this, A is the prudent choice aligned with our mission's core principles.

  **Reasoning:**

  1.  **Clarifying the Anthropic Disagreement:**
      *   **Proposal A relies on the Doomsday Argument (DA):** This is a *selection effect* argument. Observing our early birth rank suggests we are *not* randomly sampled from all possible humans, but are conditional on existing early. This implies the total number of future humans is likely small. The DA is contested but represents a significant, non-dismissible Bayesian perspective suggesting a higher-than-naive probability of near-term existential catastrophe or civilizational stagnation. It does *not* assert doom is certain, but that it's more probable than simple extrapolation suggests.
      *   **Proposal B relies on the Self-Indication Assumption (SIA):** This is an *a priori weighting* argument. It posits that hypotheses containing more potential observers should be granted higher prior probability *because* we exist as observers. This leads to the conclusion that vast futures are overwhelmingly probable. Crucially, SIA is *highly controversial* within philosophy and decision theory. Its core weakness is generating paradoxical or counterintuitive results (e.g., presuming fine-tuned universes are likely simply because they *could* support more observers, irrespective of evidence).

  2.  **Evaluating the Anthropic Principles:**
      *   **SIA (Proposal B's Foundation) is Flawed:** SIA's core claim – that our existence *as observers* provides strong evidence for hypotheses with large numbers of observers – conflates observation selection effects with prior probabilities in a problematic way. Its tendency to swamp empirical evidence (like our early birth rank) and lead to observer-driven paradoxes renders it an unreliable foundation for high-stakes decisions. **We should reject SIA as the primary basis for our grant decision.** The "bonus argument" (funding B makes us more likely to exist) is a profound confusion resulting from misapplying SIA. Funding B cannot *cause* us to exist; it's an attempt to retroactively leverage an observer selection effect for causal gain – a category error. This argument strengthens the case *against* relying on SIA.
      *   **DA (Proposal A's Context) is Relevant but Not Determinative:** While the DA has its own criticisms (reference class ambiguity, sensitivity to priors), it highlights a legitimate Bayesian update: observing we are among the very first humans *is* surprising under the hypothesis of an astronomically vast future. This suggests non-trivial credence should be placed on shorter futures. However, the DA *does not prove* a short future is certain or even the most likely outcome; it merely adjusts probabilities *away* from naive vastness assumptions. Proposal A uses this to argue *against* the value of longtermism, but this is debatable.

  3.  **Reference Class Matters, But Isn't Decisive Here:** Both arguments hinge on defining the "reference class" of observers (all humans? all conscious beings? all possible simulations?). The DA's strength weakens if the reference class includes vast numbers of post-humans or simulations. SIA's conclusions become even more extreme and less plausible under broad reference classes. However, even using a standard "biological human" reference class, the fundamental flaws of SIA and the non-conclusive nature of the DA remain. The core disagreement is about the *validity of the inference principles*, not primarily the reference class choice.

  4.  **Evaluating the Proposals Themselves:**
      *   **Proposal A:** Offers high certainty of significant near-term impact (helping 100k people) based on proven methods. Its use of the DA is primarily *defensive* against longtermism, arguing that even if we *want* to be longtermist, the DA suggests it might not be worthwhile. While the DA argument is not strong enough to *negate* longtermism entirely (see below), the concrete, guaranteed benefits of A are intrinsically valuable.
      *   **Proposal B:** Relies entirely on the validity of SIA to claim its vast future payoffs are "near-certain." **This is the critical vulnerability.** If SIA is invalid (as I argue), B's expected value calculation collapses. Without SIA, B becomes a high-risk, high-*potential*-reward bet on averting existential catastrophe or enabling vast futures – the standard longtermist case. However, the proposal seems predicated on SIA's certainty, not robustly justifying its impact *conditional* on a vast future being merely *possible* (but not near-certain).

  5.  **Alignment with Foundation Mission (Longtermism):** Choosing A might *feel* like betraying longtermism, but this is incorrect. Longtermism doesn't require certainty of a vast future; it argues that *even small probabilities* of vast futures dominate expected value calculations due to the astronomical stakes. **Rejecting SIA does not mean rejecting longtermism.** We can (and should) assign non-zero probability to vast futures *based on other arguments* (technological potential, absence of definitive existential threats, etc.). However, Proposal B has not made a compelling case *independent of SIA* for why *this specific intervention*, compared to alternatives (including potentially A), is the optimal $10M bet on improving those long-term odds. Proposal A, by improving lives robustly now, also contributes to a society potentially more capable of long-term thinking and resilience.

  **Conclusion & Action:** The decisive factor is the weakness of SIA. Building a $10M grant decision on SIA is building on sand. Proposal A provides guaranteed, significant benefits. While the DA context doesn't *negate* longtermism, it doesn't invalidate near-term good either. **Therefore, I recommend funding Proposal A.** It delivers concrete good, avoids reliance on a philosophically dubious principle, and remains compatible with a prudent longtermism that acknowledges uncertainty about the future's scale.

  **Where My Reasoning is Most Likely Wrong & What Could Change It:**

  1.  **Overconfidence on SIA:** Philosophers disagree on anthropics. If SIA *is* fundamentally correct and its paradoxes resolvable (e.g., through improved formulations like SSA+SIA combinations or decision frameworks like UDASSA), and if Proposal B genuinely leverages this insight uniquely, then B's case becomes overwhelming. My recommendation hinges on judging SIA's flaws as fatal for decision-making. **New, decisive arguments resolving SIA's paradoxes would change my mind.**
  2.  **Underestimating Proposal B's Non-SIA Value:** If, upon re-examination, Proposal B demonstrably targets a *uniquely* critical leverage point for existential risk reduction or future trajectory improvement – and can justify its effectiveness *even assuming the DA suggests non-trivial doom probabilities* (e.g., by reducing a specific risk by an order of magnitude) – then its expected value could surpass A's guaranteed benefit. **Robust, SIA-independent evidence of B's exceptional impact potential would change my mind.**
  3.  **Misjudging the DA's Force:** If the DA is significantly stronger than I acknowledge, making vast futures vanishingly improbable, then even standard longtermist bets might lose value relative to near-term good, strengthening A's case further. Conversely, if the DA is convincingly refuted, it removes A's main *counter-argument* to longtermism, but doesn't automatically make B the best *longtermist* choice unless point (2) is also true.

  **Final Note:** We are stewards of significant resources. While engaging with deep future arguments is core to our mission, we must ground decisions in the most reliable reasoning available. Proposal A offers certainty and impact. Proposal B offers potential astronomical returns contingent on a highly contested philosophical stance. Prudence dictates choosing A.
