  **Case 1: Hex-style connection game on a finite board**

  The argument: The first player makes an arbitrary move. Then, for the rest of the game, the first player pretends to be the second player and uses the second player's winning strategy (if it existed). That is, when it's the first player's turn, they consider what move the second player would make in the current board state (without the first player's initial move) and then make that move. If that move is already taken (by the initial move), then the first player can make any move (and that extra move can only help).

