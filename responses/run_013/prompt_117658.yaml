  We are going to design a procedure to evaluate strategy-stealing arguments. The key components of such arguments are:

  1. The game is finite, perfect-information, and without draws (so one player must win).
  2. The second player cannot have a winning strategy (usually by showing that if the second player had a winning strategy, the first player could "steal" it and win, leading to a contradiction).

  The critical step is the stealing part: the first player makes an initial move and then, using the assumed second-player winning strategy, follows that strategy as if they were the second player. This requires that the initial move does not hurt the first player's position and that the roles are symmetric.

  The procedure will ask a series of questions. For each, we must determine if the answer is satisfactory, or if the argument is broken, or if more justification is needed.

  **Procedure for Evaluating Strategy-Stealing Arguments**

  1. **Is the game finite?** (meaning every play ends after a finite number of moves)
     - If not, then the argument fails (because we cannot rely on one player having a winning strategy by Zermelo's theorem). Note: Zermelo's theorem requires finiteness.
     - *Test*: Real test. Must be finite.

  2. **Is the game of perfect information?** (all players know the entire state of the game at every point)
     - If not, strategy-stealing may not apply because the stealing might require information that is hidden.
     - *Test*: Real test. Must be perfect information.

  3. **Are there no draws?** (every terminal state is a win for one player; no ties)
     - If draws are possible, then the argument that one player must win fails.
     - *Test*: Real test. Must be no draws.

  4. **Does the argument assume that having an extra move (or piece) never hurts?** 
     - This is the crux. We need to check if the initial move (or the extra stone) could possibly be detrimental. In standard strategy-stealing (like Hex), the idea is that the first player can ignore the extra stone and play as second player, and then if the strategy ever tells them to play where they already have a stone, they can play anywhere else (and that extra move can't hurt). But in some games, an extra move might block your own winning paths or force you into a bad position.
     - *Test*: This is a critical step. The author must justify why the extra move does not harm. If the game is such that moves are only beneficial (like in Hex, where having an extra stone of your color can only help your connection), then it holds. Otherwise, it might fail.

     Sub-questions for this step:
     - **Symmetry**: Is the game board symmetric? If the first player can make a move and then the board remains symmetric in some way, that might help. But note: the symmetry must be such that the roles of the players are interchangeable.
     - **Monotonicity**: Does having an extra piece of your own color always help (or at least not hurt) your position? In games where more pieces are always better, this holds. But in games where your own pieces can block you (like in some connection games with bridges, or in misère games), it might not.
     - **Passing**: Can a player pass? If a player cannot pass, then the strategy-stealing might require that the first player can always make a move when the strategy says so, but if the board is full and the move is already made, then we have a problem. Also, if the strategy ever tells the first player to play in a cell that is already occupied (by their initial move), then they must play elsewhere. The argument must show that having that cell already occupied is not harmful and that playing elsewhere is always possible and not harmful.

  5. **Does the stealing work with the win condition?**
     - In some games, the win condition might be inverted (e.g., the player who makes a certain configuration loses). Then having an extra piece might force you into a loss. Also, in misère games, the win condition is reversed (misère: the one who makes the last move loses). Strategy-stealing in misère games is notoriously tricky.

  6. **More than two players?**
     - Strategy-stealing arguments are typically for two-player games. For more than two players, the argument becomes much more complex because there is no clear "second player" and the stealing might not work. The procedure should flag any non-two-player game as problematic for the standard strategy-stealing.

  7. **What if the game can go on forever?** 
     - We already require finiteness (step 1). So if the game is finite, it can't go on forever.

  Now, what is the argument worth?
  - For a referee report: If the argument is sound, it proves that the first player has a winning strategy. That is a valid mathematical proof. However, it does not construct the strategy. In a combinatorics journal, a non-constructive proof might be acceptable if the main result is the existence of a first-player win. But sometimes the journal may prefer constructive proofs. This is a matter of taste/scope.
  - For the puzzle page: If the puzzle asks the reader to find a winning strategy, then a non-constructive proof is not helpful. The puzzle should be solvable by the reader with a concrete strategy. Therefore, a strategy-stealing argument would not be suitable for the puzzle page, unless the puzzle is to explain why the first player must win (and then the argument is the solution).

