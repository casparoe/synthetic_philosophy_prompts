answer: |-
  ### Exam Question  
  **Time Allowed:** 90 minutes  

  **Scenario:**  
  Alice and Bob are rational philosophers in a pre-universe void. Each must independently choose to create Universe A or Universe B:  
  - **Universe A:** 10 observers, each with utility 100.  
  - **Universe B:** 100 observers, each with utility 50.  
  If both choose the same universe, it is created. If they choose differently, **Universe C** is created: 1,000 observers, each with utility 1.  
  Alice and Bob will be reincarnated as random observers in the created universe. They cannot communicate and know each other’s rationality and the rules.  

  **Question:**  
  Determine what Alice should choose (Universe A or Universe B) under the Self-Sampling Assumption (SSA) and the Self-Indication Assumption (SIA). In your analysis:  
  1. Explain Alice’s expected utility calculations under each assumption, including how the possibility of Universe C affects her decision.  
  2. Discuss whether the *presumptuous philosopher* argument (which challenges SIA by claiming it overweights large universes) applies in this strategic setting.  
  3. Conclude with a brief reflection on what might undermine your verdict or where your reasoning is most vulnerable.  

  ---

  ### Model Answer (Approx. 800 words)  
  #### Introduction  
  This problem involves strategic interaction under anthropic uncertainty. Alice must choose between Universe A (high utility per observer, few observers) and Universe B (moderate utility, many observers), knowing Bob faces the same choice. If they disagree, Universe C (low utility, many observers) is created. Under SSA, Alice conditions on being a random observer in the *actual* universe. Under SIA, she weights possible universes proportionally to their observer count. The threat of Universe C amplifies coordination incentives but affects SSA and SIA differently.  

  #### Analysis under SSA  
  SSA assumes Alice is a random observer from the universe that exists. To compute expected utility (EU), she must assign probabilities to Bob’s actions. Let \(p\) be her subjective probability that Bob chooses A.  

  - **If Alice chooses A:**  
    - With probability \(p\), both choose A → Universe A (10 observers, avg. utility 100).  
    - With probability \(1-p\), Bob chooses B → Universe C (1,000 observers, avg. utility 1).  
    EU(A) = \(p \times 100 + (1-p) \times 1 = 99p + 1\).  

  - **If Alice chooses B:**  
    - With probability \(p\), Bob chooses A → Universe C → utility 1.  
    - With probability \(1-p\), both choose B → Universe B (100 observers, avg. utility 50).  
    EU(B) = \(p \times 1 + (1-p) \times 50 = 50 - 49p\).  

  Alice prefers A if \(99p + 1 > 50 - 49p\), simplifying to \(p > 49/148 \approx 0.331\). Since Alice and Bob are symmetric and rational, they recognize two pure-strategy Nash equilibria: (A,A) yielding utility 100, or (B,B) yielding 50. (A,A) is Pareto-superior, so rational agents should coordinate on it unless \(p\) is low. Given mutual rationality, Alice can reasonably assume \(p\) is high (e.g., >0.331), so **Alice should choose A**.  

  **Role of Universe C:** It punishes miscoordination, incentivizing alignment. Without C, miscoordination might be ignored, but here it makes (A,A) dominant if Alice trusts Bob’s rationality.  

  #### Analysis under SIA  
  SIA weights worlds by observer count: the probability of being in a universe is proportional to its observer count multiplied by its prior probability. Again, let \(p\) be Alice’s belief that Bob chooses A.  

  - **If Alice chooses A:**  
    - Outcome A: \(p\) chance (10 observers, utility 100).  
    - Outcome C: \(1-p\) chance (1,000 observers, utility 1).  
    Total observer-weighted measure: \(p \times 10 + (1-p) \times 1000\).  
    EU(A) = \(\frac{p \times 10 \times 100 + (1-p) \times 1000 \times 1}{p \times 10 + (1-p) \times 1000} = \frac{1000p + 1000 - 1000p}{10p + 1000 - 1000p} = \frac{1000}{1000 - 990p}\).  

  - **If Alice chooses B:**  
    - Outcome C: \(p\) chance (utility 1).  
    - Outcome B: \(1-p\) chance (100 observers, utility 50).  
    Total measure: \(p \times 1000 + (1-p) \times 100\).  
    EU(B) = \(\frac{p \times 1000 \times 1 + (1-p) \times 100 \times 50}{p \times 1000 + (1-p) \times 100} = \frac{1000p + 5000 - 5000p}{1000p + 100 - 100p} = \frac{5000 - 4000p}{900p + 100}\).  

  For indifference, solve \(EU(A) = EU(B)\). At \(p = 0.5\), EU(A) ≈ 1000 / 505 ≈ 1.98, EU(B) ≈ (5000 - 2000)/(450 + 100) ≈ 5.45. Thus, **Alice prefers B** for moderate \(p\). In equilibrium, symmetry and SIA’s overweighting of large universes make (B,B) focal: if both choose B, EU = 50 (safe), while choosing A risks C, which SIA magnifies due to C’s 1,000 observers.  

  **Role of Universe C:** SIA inflates the disutility of C, making miscoordination catastrophic. Without C, SIA might favor B (due to more observers), but C exacerbates risk-aversion, pushing Alice toward B even though (A,A) is better if coordinated.  

  #### Presumptuous Philosopher Argument  
  The presumptuous philosopher argues that SIA overconfidently favors large universes (e.g., assuming a large universe exists merely because it *could*). Here, SIA *does* apply but in a strategic context:  
  - **SIA’s role:** It disproportionately weights Universe C due to its size, making Alice fear miscoordination more than under SSA. This leads to a conservative choice (B), sacrificing Pareto-superior (A,A) to avoid C.  
  - **Why it applies:** The argument’s core—that SIA overweights large universes—directly influences Alice’s risk assessment. However, strategic interaction *moderates* presumptuousness: Alice isn’t inferring universe size from existence but from decisions, and C’s disutility arises endogenously from actions. Thus, SIA’s "presumption" manifests as heightened risk-aversion, not overconfidence.  

  #### Conclusion and Reflection  
  Under SSA, Alice should choose A, trusting coordination. Under SIA, she should choose B to hedge against C. The difference arises because SIA’s observer-weighting amplifies the cost of miscoordination in C. The presumptuous philosopher objection holds but is tempered by strategy.  

  **Reflection:** The verdict is sensitive to how we model Bob’s rationality. If Alice believes Bob is irrational (e.g., fixed \(p < 0.331\) under SSA), she switches to B. Under SIA, if we reject observer-weighted priors for *actions*, the EU formulas change. The reasoning is most vulnerable in treating \(p\) as exogenous; in reality, \(p\) depends on Bob’s SIA reasoning, creating circularity. If SIA agents converge to (A,A) via higher-order rationality, choosing A could dominate, but this is speculative.  

  ---

  ### Marking Scheme (20 marks total)  
  **Must-hit points (each worth 4 marks):**  
  1. **SSA Calculation:** Correct EU formulas for A and B, with threshold \(p > 49/148\).  
     *Typical mistake:* Forgetting to include Universe C in EU, or assuming uniform probability over universes without conditioning on actions.  
  2. **SIA Calculation:** Correct EU formulas for A and B using observer-weighted measures, with conclusion for \(p = 0.5\) (EU(B) > EU(A)).  
     *Typical mistake:* Not weighting by observer count in denominators, or misapplying SIA to actions instead of outcomes.  
  3. **Role of Universe C:** Explains how C incentivizes coordination under SSA but amplifies risk under SIA due to its size.  
     *Typical mistake:* Treating C symmetrically in both assumptions or ignoring its strategic impact.  
  4. **Presumptuous Philosopher Assessment:** Notes SIA overweights C, leading to conservative play, and distinguishes this from non-strategic cases.  
     *Typical mistake:* Claiming the argument doesn’t apply because no universe "exists" yet, or missing SIA’s role in risk-aversion.  
  5. **Reflection:** Identifies sensitivity to beliefs about Bob or equilibrium selection, or flags circularity in assigning \(p\) under SIA.  
     *Typical mistake:* Superficial reflection (e.g., "if utilities change") without epistemic or game-theoretic depth.
