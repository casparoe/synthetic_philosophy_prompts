      For (A,A): 10 observers
      For (A,B): 1000 observers
      For (B,A): 1000 observers
      For (B,B): 100 observers

  The prior probability of each outcome is:
      P(A,A) = P(Alice chooses A) * P(Bob chooses A) = a * p, where a is Alice's probability of choosing A (but we are evaluating from the perspective of the void, so we must consider both choices). However, we are trying to compute the expected utility for a fixed action by Alice.

  This is the key: we are considering counterfactuals for Alice's actions. For a fixed action by Alice, we condition on that action and then use SIA.

  So, if Alice chooses A:
      The possible outcomes are:
          - Bob chooses A (prob p): universe A (10 observers)
          - Bob chooses B (prob 1-p): universe C (1000 observers)
      The total observer count for the branch where Alice chooses A is:
          p * 10 + (1-p) * 1000.

      Then, the probability that Alice is in universe A (given that she chose A) is:
          [p * 10] / [p*10 + (1-p)*1000]
      Similarly, the probability she is in C (given she chose A) is:
          [(1-p)*1000] / [p*10 + (1-p)*1000]

      Therefore, her expected utility if she chooses A is:
          [p*10/(p*10+(1-p)*1000)] * 100 + [(1-p)*1000/(p*10+(1-p)*1000)] * 1

