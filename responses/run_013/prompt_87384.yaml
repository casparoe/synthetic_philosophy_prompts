      Outcomes:
          - Bob chooses A (prob p): universe C (1000 observers)
          - Bob chooses B (prob 1-p): universe B (100 observers)
      Total observers: p*1000 + (1-p)*100
      Then, P(C) = [p*1000] / [p*1000 + (1-p)*100]
      P(B) = [(1-p)*100] / [p*1000 + (1-p)*100]
      Expected utility: P(C)*1 + P(B)*50

  Now, we must compare the two expected utilities. This depends on p.

  But note: without knowing p, we cannot decide. However, we can look for equilibrium.

  In the symmetric case, if both players are identical, then we can set p = probability that Bob chooses A, and we require that in equilibrium, the best response for Alice is to choose A with probability 1 if p is high enough, etc.

  Alternatively, we can consider the two pure strategies.

  Case 1: Bob chooses A (p=1)
      If Alice chooses A: 
          Total observers: 10
          She is in A with probability 1 -> utility 100.
      If Alice chooses B:
          Total observers: 1000 (only C)
          Utility 1.
      So A is better.

  Case 2: Bob chooses B (p=0)
      If Alice chooses A:
          Total observers: 1000 (C) -> utility 1.
      If Alice chooses B:
          Total observers: 100 (B) -> utility 50.
      So B is better.

  Again, we have two equilibria: (A,A) and (B,B). But note that under SIA, the expected utility calculations are different.

  In the (A,A) equilibrium, Alice gets 100. In (B,B) she gets 50. So again, (A,A) is better. Moreover, the risk of miscoordination leading to C is very bad. However, if we consider mixed strategies, it becomes more complex.

  But note: under SIA, the expected utility for Alice when choosing A is:
      EU_A = [p*10*100 + (1-p)*1000*1] / [p*10 + (1-p)*1000]
            = [1000p + 1000 - 1000p] / [10p + 1000 - 1000p]  [Wait: let's compute numerator: 1000p? Actually: p*10*100 = 1000p, and (1-p)*1000*1 = 1000 - 1000p -> total numerator: 1000p + 1000 - 1000p = 1000]
            = 1000 / [10p + 1000 - 1000p] 
            = 1000 / [1000 - 990p]

  Similarly, for choosing B:
      EU_B = [p*1000*1 + (1-p)*100*50] / [p*1000 + (1-p)*100]
            = [1000p + 5000 - 5000p] / [1000p + 100 - 100p]
            = [5000 - 4000p] / [900p + 100]

  We then compare 1000/(1000-990p) and (5000-4000p)/(900p+100). This is messy, but we can plug in p=0.5:

      EU_A = 1000 / (1000-990*0.5) = 1000/(1000-495)=1000/505≈1.98
