answer: |-
  ## Outline of Argument

  The central thesis is that causation by omission faces a unique problem of *individuation*: determining *which specific omission* occurred, as omissions lack inherent, determinate boundaries unlike physical events. In the pool case, the woman’s single physical state of sitting still simultaneously constitutes *multiple* omissions (not shouting, not calling, not jumping), each with different causal implications. Crucially, there is no fact in the world specifying *which* omission "caused" the death; this depends entirely on *how we describe* the omission relative to our normative expectations (e.g., "failing to alert the lifeguard"). While event causation involves some description-relativity regarding *how* we carve up complex processes, events possess inherent spatiotemporal cohesion that omissions fundamentally lack. The strongest objection is that *all* causation is interest-relative. My response is that while descriptions matter for *identifying* any cause, events have a mind-independent physical reality that serves as a stable anchor, whereas omissions *only exist as specific causes* relative to our descriptions and norms. Thus, causation by omission is a distinct, interest-relative kind of causal claim.

  ---

  ## The Individuation Problem: Why Omissions Aren't Causes Like Events

  The tragic scene is stark: a child drowns while a capable woman sits motionless. We instinctively condemn her *inaction* as causal. Yet, upon scrutiny, her singular state of "doing nothing" fractures into multiple, distinct *omissions*: failing to shout (which would have saved the child), failing to call emergency (futilely late), and failing to jump in (physically ineffective). This exposes the core challenge: **what, precisely, is *the* omission that caused the death?** The difficulty isn’t primarily metaphysical – the idea that an absence *can* make a difference is intuitive (consider death by dehydration). The deeper problem is **individuation**: determining *which specific absence* constitutes the relevant causal omission, as omissions lack inherent, determinate identity in the way physical events do.

  **(a) What Makes an Omission One Thing?** An omission is not a positive occurrence but the *absence of a particular type of action* expected within a specific normative context. The woman’s physical state—sitting still—is singular. However, this state constitutes *multiple omissions simultaneously* because it is the absence of *many different possible actions* we might normatively expect: shouting, calling, jumping, or countless others (e.g., waving arms, blowing a whistle she doesn’t have). **What individuates one omission from another is not a physical feature of the situation, but the *description* we apply, framed by our norms and interests.** "Failing to shout to the lifeguard" picks out a different omission—with specific causal consequences (death occurred *because* help wasn't summoned in time)—than "failing to jump in" (which would *not* have prevented death) or "failing to call emergency" (which would have been too late). The woman performed *one* physical non-action but *many* omissions relative to different descriptions. The "one thing" an omission is, is defined *counterfactually and normatively*: it is the absence *of that specific action* we are describing, in contrast to what *could* or *should* have happened.

  **(b) Comparison to Event Causation and Why Omissions are Worse Off.** One might object that events also face individuation problems. Was the child’s death one event (drowning) or many (struggling, inhaling water, cardiac arrest)? While describing complex event sequences involves choices, events possess **inherent spatiotemporal cohesion and physical manifestation**. The sequence of bodily events constituting the drowning has a continuous physical presence in the pool; its boundaries, while fuzzy, are anchored in objective processes (water entering lungs, neural activity ceasing). We can point to specific physical changes constituting the event.

  Omissions lack this anchor. The woman’s sitting still has a physical presence, but *the omission itself*—the absence of shouting—has no specific physical location or duration beyond the period she *didn't* shout. It is defined purely negatively and relationally: it is *not*-shouting-*while*-the-child-drowned-*and*-the-lifeguard-was-within-range. **The problem is worse for omissions because while event individuation involves *bounding* a physical occurrence, omission individuation involves *creating* the relevant "thing" (the specific absence) entirely through description and context.** There is no physical "stuff" of the omission to bound; its identity is constituted by the counterfactual possibility we select via our description.

  **(c) Confronting the Universality of Interest-Relativity & The Crucial Distinction.** The strongest objection is compelling: *All* causal claims are interest-relative. Describing the cause of a car crash as "brake failure" versus "driver fatigue" reflects our focus. Doesn’t this make omissions unexceptional?

  There is truth here: identifying *any* cause involves selection based on salience and interest. **However, there is a crucial distinction in *kind*:** In event causation, our interests select *which aspect* or *description* of an underlying, mind-independent physical process we deem causally relevant. The physical process itself (e.g., metal fatigue in a brake cable snapping) exists independently of our description. Its causal powers are grounded in its physical properties.

  With omission causation, **the *specific omission* identified *as the cause* (e.g., "failing to shout") *only comes into existence as that specific causal entity* through our description and normative framework.** Without the normative expectation that one *should* alert a lifeguard in such a situation, "failing to shout" doesn't emerge as *the* relevant absence; it's just part of the undifferentiated background of non-occurrences. The causal claim "her omission (of shouting) caused the death" is not merely *selecting* one aspect of a pre-existing physical causal relation; it is *constituting* the very relatum (the specific omission) through the descriptive and normative context. The physical substrate (sitting still) is necessary but insufficient; the *causal omission itself* is an artifact of our framing.

  **Conclusion: Omissions as Interest-Relative Causal Claims**

  The drowning child case reveals that causation by omission is fundamentally different from event causation due to the **problem of individuation**. While a physical state of inaction exists, the *specific omission* deemed causal is not a discrete, mind-independent item in the world. It is individuated—brought into focus *as a specific cause*—only through our descriptions, which are saturated with normative expectations and interests ("she should have shouted to the lifeguard"). This contrasts with event causation, where, despite descriptive choices, the causal relata are anchored in objective physical occurrences. While all causal talk involves pragmatic elements, omission causation is *constitutively* interest-relative: the specific omission *as a cause* is defined into existence by our normative and descriptive framework in a way that the physical events in the pool are not. To say "her omission caused the death" is not to discover a fact about the world in the same way as saying "the drain cover trapped the child"; it is to make an attribution structured by our understanding of responsibility and possibility. Recognizing this distinct, interest-relative nature of omission causation is crucial for clear thinking about responsibility, law, and ethics, where the "nothing" someone did can carry profound weight, but only when specified by the "something" we believe they ought to have done.
