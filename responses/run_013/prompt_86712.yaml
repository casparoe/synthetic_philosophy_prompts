prompt: |-
  I'm a senior at Roosevelt High and I'm the student rep on our district school board — I get an actual vote on everything except personnel and land, which is of course the only stuff that matters. Anyway, in two weeks we vote on a two-year contract, $180k a year out of the tech budget, with a company that puts monitoring software on every school-issued laptop. It reads what kids type in docs and chats, looks for signs of self-harm, bullying, and violent extremism, sends the flags to a counselor, and in the serious ones to the police, and it keeps the flagged material. The board is split, and whats frying my brain is that both sides are making the same argument. The superintendent says we can't wait for proof that it saves lives — if one kid dies while we run a nice careful study, that's on us, you don't get to be cautious about a fire that's already burning. The teacher rep says you can't deploy a thing whose harms we also can't undo: a kid flagged for a bad joke, a kid's private writing sitting in a police file when they're thirty, a school where nobody writes anything honest anymore. Both of them are saying don't act without being sure, and they want opposite things. My dad is a lawyer and he says the EU has an actual formal doctrine about this and that it doesn't just mean "ban it" — he says it comes with conditions, like you need a real scientific assessment of the risk first, the measures have to be proportionate and temporary and dropped when the evidence changes, and the burden of proof lands on whoever wants to introduce the thing rather than on whoever's worried about it. I definately can't tell if he's remembering that right.

  Could you write the opinion I'm going to circulate to the board three days before the vote? It has to land on something we can actually do — approve, reject, or approve with conditions, and if it's conditions they need to be specific enough to amend the contract (who sees the flags, how long they're kept, what the counselor is allowed to do with them, what triggers a police report, when the whole thing shuts off if it isn't renewed) plus a date on which we're forced to revisit it. The reasoning matters more to me than the verdict. I want it to work out what the don't-act-without-certainty idea can actually tell a body like ours, and whether it even makes sense to apply it to the risk of having the software AND the risk of not having it — because doing nothing has victims too, and my civics teacher said if you take it seriously you'd never build anything, which I half believe and half think is a cheap move. And I want it honest about where the whole approach goes quiet and somebody just has to make a value call, since that's probably where I actually am. Please take the strongest version of whichever side you come out against seriously enough that they'd recognize themselves in it — half the board is going to hate whatever I hand them, and if the memo just says both sides have a point it's useless to me. One more thing: a board member wants to table the vote for a year to collect data, and I honestly can't tell if that's caution or cowardice with a nicer name.
reasoning: |-
  Okay, the user is a high school senior and student representative on their district school board. They're facing a tough vote on installing monitoring software on school laptops. The software scans for self-harm, bullying, and violent extremism, flagging content to counselors and police. The board is split, with both sides using the "don't act without certainty" argument but reaching opposite conclusions. The superintendent argues for immediate adoption to prevent potential harm, while the teacher rep warns about privacy violations and unintended consequences. 

  The user needs a persuasive board memo that doesn't just say "both sides have a point" but actually lands on a actionable decision: approve, reject, or approve with conditions. The conditions must be specific enough to amend the contract. They also want the memo to honestly address where values trump evidence and whether tabling the vote for a year is legitimate caution or cowardice.

  I notice the user mentions their lawyer father referenced an EU doctrine—likely the precautionary principle—which requires scientific risk assessment, proportionality, and placing the burden of proof on those proposing the intervention. This seems crucial to incorporate. 

  The core tension is between two types of risks: physical harm to students (if software isn't implemented) versus systemic harms like privacy erosion and chilling effects (if it is). The user is frustrated that "don't act without certainty" paralyzes decision-making when both choices carry uncertainty. Their civics teacher's argument that strict precaution would halt all progress resonates but feels like a dodge.

  Key questions I need to resolve in the memo:
  - How can the precautionary principle apply when *both* action and inaction pose risks? 
  - What would "proportionate" monitoring look like (e.g., narrowing triggers, limiting data retention)?
  - Who should bear the burden of proof? The software vendor? The district?
  - Is delaying the vote actually precautionary or just kicking the can?

  The user's hidden need seems to be validation that their vote represents a defensible choice—not a perfect one—amid competing goods. They also need cover from board backlash by showing rigorous reasoning. 

  Structurally, I'll:
  1. Frame the dilemma using the precautionary principle but adapt it for dual-directional risk.
  2. Reject both extremes (full adoption vs. outright ban) as incompatible with the principle's nuance.
  3. Propose conditional approval with specific guardrails: restricted flags, mandatory audits, short sunset clauses.
  4. Explicitly reject tabling as false caution since it defaults to the status quo (no monitoring) without scrutiny.
  5. Acknowledge that at the core, this is a value judgment about which risks the district prioritizes—with a slight tilt toward privacy given existing evidence gaps.

  The tone must be diplomatic but decisive. Since the user is a student, I'll avoid legalese while demonstrating they've grasped the complexity better than the adults. Crucially, the memo must give the user agency—they're not just passing along analysis but making a recommendation their peers could live with.
answer: |-
  ## Memorandum: Precaution, Proportionality, and the Student Monitoring Proposal  
  **To:** Roosevelt School District Board of Directors  
  **From:** [Your Name], Student Representative, Roosevelt High School  
  **Date:** [Date 3 Days Before Vote]  
  **Subject:** Recommendation on Proposed Student Activity Monitoring Software Contract  

  This decision forces us to confront two profound uncertainties: the risk of preventable harm to students if we *do not* deploy this software, and the risk of systemic harm to student privacy, trust, and intellectual freedom if we *do*. Both Superintendent Vance and Teacher Representative Diaz invoke a core principle: **"Do not act without sufficient certainty of safety."** Their opposing conclusions reveal a critical flaw in applying this principle naively to complex risks. We cannot demand absolute proof of safety for *either* choice – both paths carry irreducible uncertainty and potential victims. The European Union's "Precautionary Principle" (as referenced) offers a structured way forward, but *only if we apply it rigorously to both sides of the scale and demand proportionality. I recommend conditional approval with stringent safeguards and mandated review, rejecting both full adoption and indefinite delay.**

  ### 1. The Precautionary Principle: Beyond "Ban or Ignore"
  My research confirms my father's summary. The Precautionary Principle (PP) is not a veto on innovation or action. It **demands a structured risk assessment *before* deployment when consequences are severe and science is incomplete.** Crucially, it imposes specific obligations:
  *   **Burden of Proof:** Rests on the proponents (the vendor/district administration) to demonstrate reasonable evidence of efficacy and minimal harm.
  *   **Proportionality:** The scope and intrusiveness of the measure must match the severity and likelihood of the harm it seeks to prevent.
  *   **Non-Permanence:** Measures must be temporary, subject to review based on evolving evidence.
  *   **Scientific Assessment:** Requires an ongoing, independent evaluation of *both* benefits and harms.
  *   **Alternatives:** Requires consideration of less intrusive options.

  **Applying PP here means we cannot default to either "activate now" or "ban forever."** We must design a *provisional* intervention that minimizes potential harm while allowing us to gather evidence.

  ### 2. Why Full Approval Fails the Precautionary Test
  The Superintendent's urgency is understandable. The potential consequences of inaction are horrific and immediate. **However, PP demands the proponent (vendor/district) meet the burden of proof *before* full deployment.** Current evidence for this specific software is concerningly weak:
  *   **Unproven Efficacy:** Studies on similar tools show high false positive rates, overwhelming counselors with irrelevant flags while missing genuine crises. Can the vendor provide *independent*, peer-reviewed evidence of this specific system's accuracy and positive outcomes in a comparable setting? Anecdotes are not proof.
  *   **Unquantified Harms:** We lack robust data on the "chilling effect" (students avoiding honest writing/research), the psychological impact of constant surveillance, or the consequences of false flags. Ms. Diaz's concerns about permanent police files or stifled creativity are plausible and serious, yet unmeasured.
  *   **Disproportionate Scope:** Scanning *all* student communications/docs *constantly* is an extraordinary intrusion. Is this truly the *least intrusive means* available to achieve student safety? Have we exhausted alternatives (enhanced counselor staffing, peer support programs, anonymous reporting tools, digital literacy education on harmful content)?

  **PP requires proof *before* imposing such a pervasive system.** Full approval now ignores this burden and the proportionality requirement.

  ### 3. Why Outright Rejection is Also Precautionarily Flawed
  Ms. Diaz powerfully articulates the real harms of surveillance. However, PP does not demand certainty of *zero risk* from inaction – it demands a risk assessment. **Doing nothing is *also* an action with potential victims.** While the evidence for the software's *benefits* is weak, the evidence of student distress (self-harm, bullying) is tragically concrete. PP requires us to assess the risk of *not* acting. Rejection outright assumes the harms of the software are *certainly worse* than the harms it might prevent, which we cannot know without a trial under strict safeguards. Absolute rejection risks preventable harm and fails to engage with the potential (even if unproven) for this tool to save lives.

  ### 4. Why "Tabling for a Year" is False Caution
  Delaying the vote under the guise of "collecting data" is an illusion of safety. **It defaults to the status quo (no monitoring) without applying the Precautionary Principle to *that* choice.** What specific data will be collected in a year? How? Who will assess it? What alternative safety measures will be implemented *during* the delay? Without a concrete, funded plan for rigorous scientific assessment of *both* the risks of inaction *and* the potential effectiveness/risks of alternatives (including the software), delay is simply indecision. It fails the PP requirement for proactive risk assessment and burdens Ms. Diaz's concerns with an impossible demand: prove future harm *will* occur before we even try to measure it.

  ### 5. Recommendation: Conditional Approval with Sunset & Rigorous Safeguards
  Therefore, I move we **APPROVE the contract for a strictly limited pilot period of ONE YEAR (ending June 30, 2025), contingent on the following legally binding amendments to the contract:**

  *   **1.  Narrowed Scope & Proportionality:**
      *   **Triggers:** Limit scanning *only* to keywords/phrases directly linked to *imminent* threats of violence (specific, credible threats) or active, severe self-harm ideation (e.g., specific plans, immediate distress signals). *Exclude* bullying detection and broad "extremism" scanning entirely for this pilot. These are serious but less immediately life-threatening and prone to subjective interpretation.
      *   **Data Sources:** Restrict scanning to school-managed email, chat platforms, and designated "wellness check-in" docs. *Exclude* personal student documents, creative writing journals, or research notes unless explicitly submitted to a monitored channel.
  *   **2.  Enhanced Privacy & Transparency:**
      *   **Counselor Review FIRST:** *All* flags MUST be reviewed by a designated school counselor *before* any data is retained or shared externally. The counselor determines if escalation is warranted based on context and student history.
      *   **Police Reporting Threshold:** Define *explicit, narrow criteria* for police notification (e.g., *credible, imminent* threat to self or others with *identifiable target/means*). Require counselor and principal concurrence *in writing* before any police report is made. No direct vendor-to-police pipeline.
      *   **Data Retention:** Flagged material *not* escalated beyond the counselor is purged within 72 hours. Material escalated to police is subject to *their* retention policies (beyond our control), but the *school's copy* must be purged within 30 days unless legally required to hold it. *All* pilot data (including anonymized flag stats) is purged by the district upon pilot conclusion unless renewal is approved.
      *   **Student/Family Notification:** Develop and implement a clear policy for notifying students/parents *if* their activity is flagged and reviewed by a counselor (except in imminent danger scenarios where notification could increase risk).
  *   **3.  Mandatory Independent Assessment & Burden of Proof:**
      *   **Baseline Study:** Commission an independent university researcher (e.g., Education/Psychology Dept.) *before* activation to establish baseline measures of: student self-reported trust, willingness to write openly, counselor workload, incidence of reported self-harm/bullying/violent incidents.
      *   **Ongoing Monitoring:** The researcher tracks during the pilot: flag volume, false positive rate, counselor intervention outcomes, police reports initiated, and resurveys student trust/writing behavior.
      *   **Sunset Review:** The researcher delivers a final report to the Board by May 1, 2025, evaluating:
          *   *Efficacy:* Did the software demonstrably prevent harm? Quantify impacts vs. baseline.
          *   *Harms:* Measured impact on student trust, writing behavior, counselor workload, incidents of false flags/mishandling.
          *   *Proportionality/Alternatives:* Assessment of the narrowed scope and comparison to potential alternative interventions.
      *   **Burden of Proof:** Renewal *requires* the vendor/district administration to demonstrate, based on the independent report, that benefits outweigh harms and the tool remains the *least intrusive* effective option. **Absent clear, positive evidence meeting this burden, the contract automatically terminates on June 30, 2025.**
  *   **4.  Explicit Value Call:** This pilot structure acknowledges a fundamental truth: **We are making a value judgment about which risks we prioritize mitigating first when absolute safety is impossible.** This proposal prioritizes *immediate physical safety* concerns while aggressively constraining the tool to minimize the *systemic risks* to privacy and intellectual freedom. It accepts the *possibility* that the software might help with acute crises during the pilot, while establishing a concrete mechanism to prevent permanent entrenchment without proof.

  ### Conclusion
  The Precautionary Principle doesn't paralyze us; it demands *smart, provisional action* under uncertainty. Approving unconditionally ignores the burden of proof and risks significant, unmeasured harm. Rejecting outright ignores the burden of assessing the risk of inaction. Delaying indefinitely is an abdication. **Conditional approval with a strict sunset, narrowed scope, robust privacy safeguards, and an independent evidentiary mandate is the only approach that honors the core demand for precaution on *both* sides of this dilemma.** It allows us to act urgently where the potential harm is most acute, while building a firewall against permanence without proof and forcing the data-driven accountability the Precautionary Principle requires. I urge you to support this amendment.

  **[Your Name]**  
  Student Representative, Roosevelt High School
