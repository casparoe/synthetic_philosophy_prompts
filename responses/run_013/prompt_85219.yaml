prompt: |-
  I'm a high school student trying to understand the boundary problem: who belongs to the demos that gets to decide? A pair of real practices puzzles me. In the 2014 Scottish independence referendum, 16- and 17-year-olds could vote, and EU citizens who lived in Scotland could vote, but Scots who had moved to England could not. In the 2016 UK-wide referendum on EU membership, the voting age was 18, most EU citizens who lived in the UK could not vote, but UK citizens who had lived abroad for less than 15 years could. What philosophical commitments about the demos does this pair of practices presuppose? Does it presuppose that the demos is fixed by residence and subjection to the decision in some cases, and by national membership and affected interests in others? Are those commitments consistent, or is the practice philosophically underdetermined? Reconstruct the implicit theory, separate what the rules strictly require from what they merely fit, and say what would have to change if we instead adopted an all-affected-interest principle or an all-subjected-to-law principle. Please write in American English, and tell me what would change your verdict and where your reasoning is most likely to fail.
reasoning: |-
  Okay, the user is a high school student trying to understand the boundary problem in democratic theory, specifically looking at the inconsistencies in voting eligibility between the 2014 Scottish independence referendum and the 2016 Brexit referendum. They want to know what philosophical commitments these practices presuppose, whether they're consistent, and how different principles like all-affected-interest or all-subjected-to-law would change things.

  First, I need to break down the voting rules for each referendum. In Scotland, 16-17 year olds and EU citizens residing there could vote, but Scots living in England couldn't. For Brexit, the voting age was 18, most EU citizens couldn't vote, but UK citizens abroad for under 15 years could. 

  So, what's the underlying philosophy here? The Scottish referendum seems to prioritize residence and subjection to the decision. Since independence would directly affect people living in Scotland, including EU citizens there, they get a vote. But Scots in England, while affected, aren't subject to the new Scottish laws, so they're excluded. Lowering the voting age might reflect a view that younger people are also subject to the decision's long-term effects.

  The Brexit referendum, on the other hand, focuses on national membership. UK citizens abroad can vote because they're part of the nation, even if not currently residing in the UK. EU citizens in the UK are excluded because they're not UK nationals. The voting age here is the standard 18, showing consistency with national norms rather than special considerations like in Scotland.

  The user is asking if these commitments are consistent. On the surface, they seem contradictory. But maybe each case uses a different principle based on the referendum's scope. Scotland is forming a new polity, so residence matters. Brexit is about an existing state's policy, so nationality is key. Still, that doesn't fully reconcile the differences. The practices are philosophically underdetermined, picking principles situationally rather than adhering to a single theory.

  Next, applying all-affected-interest or all-subjected-to-law principles. All-affected-interest would include anyone impacted by the decision. For Scottish independence, that might include Scots in England, UK citizens elsewhere, and even EU citizens affected by Scotland leaving. For Brexit, it would include EU citizens in the UK and possibly other EU countries. This principle is super broad and hard to implement, leading to massively expanded electorates.

  All-subjected-to-law focuses on those governed by the laws. In Scotland, that would be residents, including EU citizens, but exclude Scots outside Scotland. For Brexit, it would include all UK residents subject to EU laws, so EU citizens in the UK should vote, but UK citizens abroad might not if they're not subject to UK laws anymore. This principle is more manageable but still requires defining jurisdiction clearly.

  The user might also be interested in why these inconsistencies exist practically. Political expediency, historical context, or legal constraints could be factors. For example, Scotland's lower voting age might be a political move to engage youth, while Brexit's rules follow existing UK election laws. 

  I should also address where my reasoning could fail. Maybe I'm missing that both referendums had to operate within existing legal frameworks. The Scottish referendum was authorized by the UK government, which might have influenced the rules. Brexit was a UK-wide vote, so it used standard parliamentary election rules. That practical aspect might explain the differences more than philosophical commitments. 

  Additionally, the user might want to know if there's a coherent theory that can reconcile both practices. Perhaps a nested demos concept where sub-state referendums use residence and state-level ones use nationality. But that still has tensions, especially when decisions affect overlapping groups. 

  Finally, the user's deeper need might be understanding how real-world politics shapes democratic theory versus ideal principles. They might be struggling with the gap between theory and practice, seeking ways to critique or justify these inconsistencies. Highlighting the role of practical constraints versus philosophical ideals would be valuable here.
answer: |-
  Your analysis of these referendums perfectly captures the core tension in democratic theory: **there's no single, universally agreed-upon principle for defining the demos ("the people") in a democracy.** The contrasting rules reveal a practice that is **philosophically underdetermined and situationally inconsistent**, leaning on different principles based on context and political expediency.

  **Reconstructing the Implicit Theory:**

  1.  **2014 Scottish Independence Referendum:**
      *   **Practice:** Residents of Scotland (including 16/17-year-olds and EU citizens) could vote. Scottish-born UK citizens living elsewhere in the UK (England, Wales, NI) could not.
      *   **Implied Philosophical Commitments:**
          *   **Primary: All-Subjected Principle (Residence-Based):** The dominant principle here is that those who would be immediately subjected to the new state's laws and authority (residents of Scotland) should decide its creation. Independence fundamentally alters the legal and political order *within* Scotland. EU citizens residing there would be subject to this new state, hence their inclusion.
          *   **Secondary: Affected Interests (but subordinate to Subjection):** While Scottish expats in England would be affected (culturally, financially, potentially citizenship), the *primary* criterion was residence/subjection, overriding their affectedness. The lowered voting age could be seen as acknowledging that independence's long-term consequences subjected young residents more profoundly, or simply a political choice to include a potentially pro-independence group.

  2.  **2016 UK EU Membership Referendum (Brexit):**
      *   **Practice:** Standard UK voting age (18+). Most EU citizens resident in the UK *could not* vote. UK citizens who had lived abroad for less than 15 years *could* vote.
      *   **Implied Philosophical Commitments:**
          *   **Primary: National Membership/Citizenship Principle:** The core principle was that membership in the UK political community (UK citizenship), not current residence, defined the demos for this decision about the UK's international posture. This explains why UK citizens abroad (within the 15-year limit) were included – they are still considered part of the "British people."
          *   **Secondary: Residency (as a proxy for subjection/affect, but subordinate to Citizenship):** Residency mattered indirectly through the citizenship filter. EU citizens living in the UK *were* subject to UK law and profoundly affected by Brexit, but their exclusion shows citizenship trumped subjection/affect. The 15-year rule for expats is a pragmatic, somewhat arbitrary limit on citizenship-based inclusion, acknowledging weakening ties, not a strict subjection principle (as many expats >15 years were still affected).

  **Consistency?** **No.** The commitments are inconsistent:
  *   **Subjection vs. Citizenship:** Scotland prioritized subjection/residence; Brexit prioritized citizenship.
  *   **Affected Interests:** Both decisions excluded significantly affected groups: Scottish expats in England (Scotland ref) and EU residents in the UK (Brexit).
  *   **Voting Age:** Age inclusion varied situationally (16+ in Scotland, 18+ in Brexit), lacking a consistent principle regarding youth subjection/competence.

  **Philosophically Underdetermined Practice:** Yes. These rules don't flow from a single, coherent theory of the demos. They are the product of:
  *   **Political Negotiation:** The Scottish referendum franchise was negotiated between the Scottish and UK governments, reflecting Scottish political priorities (residence, youth vote).
  *   **Existing Legal Frameworks:** The Brexit referendum largely used the existing franchise for UK Parliamentary elections, which is citizenship-based with the 15-year expat rule. Changing this would have required new legislation.
  *   **Contextual Notions of "The People":** For creating a *new* state (Scotland), the "people" were defined territorially (who lives here). For a decision *by* an *existing* state (UK Brexit), the "people" were defined by existing membership (citizenship).
  *   **Expediency and Avoidance:** Excluding EU citizens in the Brexit vote avoided the political complexity of potentially large numbers of non-citizens deciding a core national question. Including Scottish expats in the independence vote risked undermining the claim that only residents should decide Scotland's future.

  **What the Rules Strictly Require vs. What They Merely Fit:**
  *   **Strict Requirements:**
      *   Scotland Ref: Required current legal residency in Scotland.
      *   Brexit Ref: Required UK citizenship + meeting residency requirements (either current UK residency or past residency within 15 years).
  *   **What They Merely Fit (but don't strictly require):**
      *   **All-Subjected Principle:** Fits the *inclusion* of residents (Scotland ref) but *doesn't fit* the exclusion of UK citizens abroad *subjected* to UK laws/citizenship consequences (Scotland ref) or the exclusion of EU residents *subjected* to UK laws (Brexit ref).
      *   **Affected Interests Principle:** Fits the *inclusion* of residents (both refs) and UK citizens abroad (Brexit ref). It *doesn't fit* the exclusion of Scottish expats (Scotland ref), EU residents (Brexit ref), or potentially other affected groups (e.g., Irish citizens in Northern Ireland for Brexit, young people in Brexit).
      *   **National Membership Principle:** Fits the *inclusion* of citizens (both refs, especially Brexit) and the *exclusion* of non-citizens (Brexit ref). It *doesn't fit* the *inclusion* of non-UK citizens in Scotland (Scotland ref) or the *exclusion* of UK citizens abroad in Scotland (Scotland ref).

  **Impact of Alternative Principles:**

  1.  **All-Affected Interests Principle (AAI):** This argues anyone significantly affected by a decision should have a say.
      *   **Scotland Ref:** Would likely expand the franchise to include:
          *   Scottish-born UK citizens living elsewhere in the UK (profoundly affected on citizenship, identity, family, economics).
          *   Potentially UK citizens in the rest of the UK (affected economically, politically, constitutionally).
          *   EU citizens elsewhere (if specific ties, but generally less directly affected than residents). *Implementation becomes extremely difficult (who counts as "affected"? how much?)*
      *   **Brexit Ref:** Would massively expand the franchise to include:
          *   All EU citizens resident in the UK (hugely affected economically, socially, legally).
          *   Potentially citizens of other EU member states (affected by the EU's changed composition/budget).
          *   UK citizens abroad beyond 15 years (still often significantly affected).
          *   Citizens of countries with strong economic ties to the UK/EU. *Again, defining the boundary is practically impossible.*
      *   **Change:** Both referendums would have vastly larger, potentially unmanageable, electorates defined by complex judgments about "affectedness," moving far beyond current citizenship/residence models.

  2.  **All-Subjected-to-Law Principle (ASTL):** This argues anyone coercively subjected to the laws enacted as a result of the decision should have a say.
      *   **Scotland Ref:** Would focus on those subject to the *new Scottish state*:
          *   Includes residents of Scotland (like the actual practice).
          *   Excludes Scottish expats in England (as they remain subject to UK law, not new Scottish law) – aligns with practice.
          *   Includes EU citizens resident in Scotland (as they would be subject to Scottish law) – aligns with practice.
          *   Likely excludes 16/17-year-olds if the new state's voting age is 18 (contradicts practice). *Requires defining the jurisdiction of the new laws.*
      *   **Brexit Ref:** Would focus on those subject to the *UK laws* implementing Brexit:
          *   Includes all legal residents within the UK's jurisdiction (UK citizens + EU/other foreign citizens with residency rights) – this *contradicts* the practice by including EU residents.
          *   Likely excludes most UK citizens living abroad long-term (if no longer subject to core UK laws like taxation/residency requirements) – *contradicts* the practice of including those within 15 years.
          *   Requires defining the scope of laws "resulting from" the decision.
      *   **Change:** Scotland ref mostly aligns except potentially voting age. Brexit ref would *include* EU residents and *exclude* many expats currently included, creating a fundamentally different (resident-based) electorate.

  **What Would Change My Verdict & Where Reasoning Might Fail:**

  *   **New Historical/Political Context:** If evidence emerged showing the Scottish franchise was *solely* a cynical ploy to boost pro-independence votes (youth/EU residents) with *no* consideration of subjection, or the Brexit franchise was *explicitly* designed to disenfranchise pro-EU EU residents, this would weaken the "implicit principle" analysis and strengthen the "pure expediency" argument.
  *   **Formal Justifications:** If official government documents or parliamentary debates for *both* referendums clearly articulated a *single, consistent* philosophical justification (e.g., "the demos is always defined by the territory making the decision"), that would challenge the inconsistency claim, though the actual rules would still contradict it in practice (excluded affected citizens).
  *   **Focusing Too Much on Philosophy:** The reasoning might fail by over-intellectualizing decisions driven primarily by **political power, legal constraints, and pragmatism.** Politicians choose franchises they think they can win or that fit existing norms, not after reading democratic theory. The UK's uncodified constitution and parliamentary sovereignty make franchise rules highly malleable to political will.
  *   **The "Nested Demos" Defense:** Someone might argue the practices *are* consistent with a theory where sub-state decisions (like independence) use a subjection/residence-based demos, while state-level decisions (like EU membership) use a citizenship-based demos. My reasoning might fail to fully engage this as a *potential* coherent (though contested) framework. However, the exclusion of *citizens* from the Scottish vote and *residents* from the Brexit vote still creates significant tensions within this model.

  **Conclusion:** The contrasting franchise rules reveal a democratic practice that is philosophically messy and context-dependent. It implicitly draws on **residence/subjection** for defining a *new* polity (Scotland) and **citizenship** for decisions by an *existing* polity (UK Brexit), while inconsistently handling affected groups and youth inclusion. Neither the All-Affected nor All-Subjected principles perfectly describe the practice, and adopting either would lead to significantly different electoral boundaries. The inconsistencies highlight that in real politics, defining "the people" is less a philosophical exercise and more a contest of power, law, and pragmatism.
