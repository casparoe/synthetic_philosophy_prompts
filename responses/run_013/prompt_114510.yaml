answer: |-
  Here’s a decision tree handout designed to help readers locate their position in the "Is violence declining?" debate through conceptual commitments. It follows your branching structure and constraints (≈850 words):

  ---

  **Is Violence Declining? A Self-Locating Decision Tree**  
  *Follow the branches by answering each question based on your core commitments.*

  ### (1) SCOPE: What fundamentally *counts* as "violence"?
  - **A. Only direct, intentional physical harm by identifiable agents**  
    *(e.g., war, homicide, assault)*  
    → Go to (2)  
  - **B. Also deaths/injuries from deprivation where a duty-holder could reasonably prevent it**  
    *(e.g., famine amid food surplus, vaccine denial)*  
    → Go to (2)  
  - **C. Also structural/slow violence: harm from unjust systems**  
    *(e.g., preventable poverty, racism, environmental harm)*  
    → Go to (3)  
  - **D. Also dignitary/psychological harm**  
    *(e.g., systemic humiliation, cultural erasure)*  
    → Go to (3)  

  ### (2) DENOMINATOR: How should we *measure* change?
  - **A. Absolute counts of victims**  
    → Go to (3)  
  - **B. Per capita (global human population)**  
    → Go to (3)  
  - **C. Per capita of the group exposed to the harm**  
    *(e.g., civilians in conflict zones)*  
    → Go to (3)  
  - **D. Harm per person-year of lived experience**  
    *(e.g., risk-adjusted lifetime exposure)*  
    → Go to (3)  

  ### (3) FACTUAL STATUS: Is this claim empirical or evaluative?
  - **A. Straightforwardly empirical**  
    *(Data can resolve it with current methods)*  
    → Go to (4)  
  - **B. Relative to chosen definitions/measures**  
    *(No "view from nowhere")*  
    → **Position: Relativist Measurability Skeptic**  
    *Awkward commitment: Must concede that *all* empirical claims about violence are framework-dependent, including those you favor.*  
  - **C. Evaluative claim disguised as descriptive**  
    *(Reflects values like Eurocentrism or liberal optimism)*  
    → **Position: Critical Constructivist**  
    *Awkward commitment: Risk of dismissing empirical trends as *mere* ideology, even when data is robust.*  

  ### (4) BASELINE & TIMESCALE: Over what period is decline assessed?
  - **A. All recorded history**  
    *(e.g., Bronze Age to present)*  
    → **Position: Long-Term Declinist** (e.g., Pinker)  
    *Awkward commitment: Must downplay or reinterpret pre-modern democide/warfare estimates and structural violence.*  
  - **B. Post-1945 ("Long Peace")**  
    *(Decline in interstate war)*  
    → **Position: Institutionalist** (e.g., Ikenberry)  
    *Awkward commitment: Struggles to explain persistent civil conflicts and non-state violence post-1990.*  
  - **C. Post-1990**  
    *(Post-Cold War era)*  
    → **If B or D at (1) and B or D at (2):**  
    → **Position: Structural Violence Skeptic**  
    *Awkward commitment: May overlook genuine reductions in direct violence by focusing on structural harms.*  
    → **Else:**  
    → **Position: Modern Declinist**  
    *Awkward commitment: Must reconcile with rising cyber/digital violence and illiberal populism.*  
  - **D. Variable by violence type**  
    *(No single baseline applies)*  
    → **Position: Nuanced Pluralist**  
    *Awkward commitment: Lacks a unified narrative, making policy/praxis recommendations fragmented.*  

  ---

  ### Empty Nodes & Diagnoses:
  - **A at (1) + C at (2)** → *Unexplored* (Rarely asked: "Per capita harm only among *exposed* groups" for direct violence)  
  - **C/D at (1) + A at (2)** → *Unattractive* (Structural/psychological violence measured only in absolutes ignores population growth)  
  - **B/C/D at (1) + A at (3)** → *Incoherent* (Cannot treat structural/dignitary harm as "straightforwardly empirical" without denying its contested nature)  

  ### Ambiguous Leaf Boundaries:
  - **Structural Violence Skeptic** (C at (1), C at (4)) and **Critical Constructivist** (C at (3)) may overlap significantly. The tree separates them methodologically (empirical vs. evaluative), but real-world positions often blend these.  
  - **Relativist Measurability Skeptic** (B at (3)) and **Nuanced Pluralist** (D at (4)) share a rejection of monistic answers but differ in scope (conceptual vs. historical).  

  ### Design Notes:
  - **Branch Logic:** Questions avoid presupposing answers (e.g., "Does violence include...?" not "Structural violence is...").
  - **Forced Reflection:** Denominator branch (2) forces awareness that one can be declinist on per-capita but not absolute terms.
  - **Awkward Commitments:** Highlight tensions inherent to each position (e.g., Declinists must address structural harm).
  - **Empty Nodes:** Show where conceptual gaps exist in the literature.
  - **Word Count:** ≈830 words.

  ---

  This tree maps major positions while revealing how definitional choices (not just data) drive disagreement. It should prompt reflection on why advocates talk past each other—and where readers stand amid the branches.
