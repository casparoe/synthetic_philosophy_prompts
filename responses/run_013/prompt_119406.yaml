answer: |-
  Your symmetry point is clever but misfires: reducibility *to* maximizing without loss of generality reveals its primacy, while your reverse reduction *requires* gerrymandering the threshold to match the maximum—a move that only makes sense *given* a maximizing benchmark. The moment your aspirant adjusts her threshold based on new options, she's dynamically re-maximizing an objective function that now incorporates search costs and updated beliefs. Call it "moving aspirations" if you like; it's still constrained maximization over a state-dependent outcome space. You say my rewrite needs fixed options and utilities? Nonsense. Bayesian maximizers handle sequential information and stochastic option sets routinely—preferences evolve as the state space unfolds, but the *criterion* remains optimization of expected utility conditioned on available information. Your satisficer's "generated alternatives" are just stochastic draws from a possibility set; her aspiration shifts are Bayesian updating of the *achievable* maximum. The idealization you detect is in treating "satisficing" as anything other than a label for particular maximization constraints—like calling gravity "levity" because objects fall down. The verb obscures the noun: preference. 

