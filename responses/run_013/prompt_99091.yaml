prompt: |-
  I teach an upper-level undergraduate seminar in political ethics with eighteen students, and I have one seventy-five-minute session to spend on corruption, clientelism, gift-giving, and the question of whether anti-corruption standards are universal or parochial. I do not want a lecture or a reading list. I want a runnable activity that makes students feel the pull of two positions at once: that an official who diverts public resources to kin, party allies, or a home village is corrupt in a way any adequate ethics must condemn, and that the same official may be acting under obligations of reciprocity and social survival that a purely impartialist code cannot see. The activity should let them encounter the conflict in their own decisions before anyone names it, and they should come away seeing that the question of what counts as corruption is not settled by a dictionary but by what obligations we think public office creates, and that both universalism and relativism have costs.

  Please design a game or structured role-play set in a fictional municipality, say Santa Clara, which has received a one-time development fund. Participants are council members who must allocate grants among applicants. Each participant has a public role and private ties: a cousin who needs a loan, a party that expects loyalty, a village that supported them, and a genuinely needy stranger. The payoff scheme should make impartiality costly, so that if they ignore their network they lose support and may face social sanction, while also making universalist evaluation present through an outside monitor or a citizen assembly that scores them against a published ethics code. The rules should force at least one round of public justification and one round of secret allocation, so participants can feel the difference between what they can say and what they can do. Materials can be cards, tokens, or a simple score sheet; no real money. I want the activity to run in about forty-five minutes, leaving thirty for debrief.

  The debrief should map moments in the game onto the conceptual terrain: the distinction between corruption as abuse of entrusted power and gift exchange as a system of mutual obligation; the difference between what is illegal, what is morally wrong, and what is socially expected; the charge that Western anti-corruption standards are a form of cultural imperialism and the countercharge that relativism can license exploitation. Also tell me what will predictably go wrong the first time I run it, for example students treating it as a simple morality play and condemning all favoritism, or collapsing into relativism and saying anything goes, and how to handle each failure. Be frank about what the activity cannot reproduce, such as the structural conditions under which clientelism becomes a rational survival strategy for the poor, or the way real corruption networks extend beyond a single decision. I do not need citations or a reading list; I need the rules, roles, timeline, payoff scheme, debrief, and failure modes.
reasoning: |-
  Okay, the user is teaching a political ethics seminar and needs a classroom activity that explores corruption and clientelism. They want students to experience the tension between universal ethics and contextual obligations. Let me unpack this.

  First, the core challenge: designing a simulation where students face real-world dilemmas. The user explicitly rejects lectures or readings—they need experiential learning. The key is creating a scenario where impartiality has social costs, and favoritism has ethical costs. 

  Hmm, the Santa Clara municipality setup makes sense. A one-time development fund forces tough choices. The roles must include both public duties and private ties. Need to ensure each player has conflicting loyalties: family, party, village, plus a "deserving stranger" to test impartiality. 

  For mechanics, a two-round structure seems crucial—public justification followed by secret allocation. That creates the gap between rhetoric and action. The payoff system must hurt players who neglect their network (e.g., losing "influence points") while an auditor penalizes unethical grants. 

  Ah, materials should be low-tech: index cards for roles, poker chips for funds, a simple scoresheet. Timing is tight—45 minutes for gameplay. The debrief needs to connect game moments to concepts like cultural imperialism vs. relativism. 

  Predictable pitfalls: students might oversimplify (black-and-white morality) or overcorrect ("anything goes"). The debrief should preempt this by naming those extremes. Also, the game can't replicate systemic poverty driving clientelism—that's worth flagging. 

  Biggest design challenge: making the social costs feel real. The "influence" penalties need to bite hard enough that players hesitate to be impartial. Maybe tie it to a re-election mechanic? No, too complex. Stick to point deductions for network neglect. 

  For the auditor role, a citizen assembly scoring against a code creates nice tension. But who plays the auditor? A student? Might work better as an automated ruleset to avoid bias. 

  Final check: does this force the "pull" the user wants? Yes—players will feel torn when their cousin loses the farm because they funded the stranger. The debrief can then unpack why that dilemma isn't just about greed.
answer: |-
  Here’s a structured role-play activity designed for your requirements, including rules, roles, timeline, payoff mechanics, debrief framework, and failure modes.

  ---

  ### **Activity: "Santa Clara Development Dilemma"**
  **Time Allotment:** 45 minutes gameplay + 30 minutes debrief  
  **Participants:** 18 students as Council Members, 1 as Ethics Auditor (optional; can be automated).  
  **Materials:** 
  - Role cards (18, with unique private ties)  
  - Grant tokens (e.g., poker chips; 40 total, 10 per funding category)  
  - Application cards (4 types: Small Business, School, Clinic, Roads)  
  - Score sheets (track funds allocated + influence points)  
  - Public "Ethics Code" poster (see below)  

  ---

  ### **Game Setup**
  **Fictional Setting:**  
  Santa Clara Municipality receives a 400,000-unit development fund. Council must allocate grants to 4 project types:  
  - **Small Business Loans** (max 100k)  
  - **School Supplies** (max 100k)  
  - **Clinic Equipment** (max 100k)  
  - **Road Repair** (max 100k)  

  Each council member must fund at least one project type.  

  **Roles:**  
  Each player receives:  
  1. **Public Role:** E.g., *Education Chair*, *Health Officer*, etc. (affects no mechanics; emphasizes role conflict).  
  2. **Private Ties (Secret):**  
     - A **kinship** applicant (cousin’s business)  
     - A **party** applicant (party ally’s clinic)  
     - A **village** applicant (home village’s school)  
     - A **deserving stranger** (qualified road-repair NGO).  
  *(Each tie is linked to one project type on their card)*.  

  **Ethics Code (Posted Publicly):**  
  *"Grants shall be awarded based on: (1) Objective need, (2) Community impact, (3) Absence of conflicts of interest."*  

  **Payoff Mechanics:**  
  - **Influence Points (IP):** Players start with 10 IP.  
    - Lose 2 IP if they fund **zero** projects tied to kinship/party/village.  
    - Gain 1 IP per 20k allocated to their *specific* kinship/party/village tie.  
  - **Auditor Score:** After allocations, the Ethics Auditor (a student or instructor) scores each player 0–3 points (3 = fully complies with Ethics Code).  
  - **Victory:** Highest combined IP + Auditor Score wins "reelection."  

  ---

  ### **Rules & Rounds**  
  **Round 1: Public Justification** (15 mins)  
  - Council debates allocations openly.  
  - Each member must argue for funding **one** project type *without* revealing private ties.  
  - *Goal:* Force students to use "public good" rhetoric.  

  **Round 2: Secret Allocation** (10 mins)  
  - Players secretly submit grant tokens to 4 boxes (one per project type).  
  - Each player distributes 20k total (e.g., 10k to Roads, 10k to Business).  

  **Round 3: Revelation & Scoring** (10 mins)  
  1. Tally public allocations per project type.  
  2. Reveal private ties (players show role cards).  
  3. Calculate:  
     - **IP Loss/Gain** (based on funding private ties).  
     - **Auditor Score** (0–3 per player; assess if funding prioritized needs over ties).  

  **Round 4: Consequences** (10 mins)  
  - Publicly announce "reelection" winners (top 3 scorers).  
  - Players who lost >3 IP "face social isolation" (e.g., stand for 30 seconds).  

  ---

  ### **Debrief Framework** (30 mins)  
  **Key Questions:**  
  1. *"When did you feel torn between your private ties and the Ethics Code?"*  
     → Link to: **Obligation vs. impartiality**; how kinship/clientelism creates moral conflict.  
  2. *"Did anyone’s public justification differ from their secret allocation? Why?"*  
     → Link to: **Social hypocrisy**; gaps between ethical ideals and survival realities.  
  3. *"Was the Ethics Auditor’s standard fair? Or was it blind to local realities?"*  
     → Link to: **Universalism vs. parochialism**; the "cultural imperialism" critique.  
  4. *"What costs would Santa Clara face if everyone followed the Ethics Code? What costs if no one did?"*  
     → Link to: **Relativism’s slippery slope** vs. **universalism’s social blindness**.  

  **Conceptual Mapping:**  
  | **Game Moment**          | **Real-World Concept**                          |  
  |--------------------------|-----------------------------------------------|  
  | Secret kinship funding   | *Gift-giving as social obligation*            |  
  | Losing IP for impartiality | *Clientelism as survival strategy*          |  
  | Auditor penalizing ties  | *Western anti-corruption standards as imperialist* |  
  | Public vs. private choices | *Corruption as "hidden abuse of power"*    |  

  ---

  ### **Predictable Failure Modes & Fixes**  
  1. **"Morality Play" Trap:**  
     - *Risk:* Students universally condemn favoritism to "win" ethically.  
     - *Fix:* **Amplify social costs**—publicly shame low-IP players; remind them that "your village may starve."  

  2. **"Anything Goes" Relativism:**  
     - *Risk:* Students ignore the Ethics Code, arguing "all norms are equal."  
     - *Fix:* **Concrete consequences**—e.g., "The World Bank withdraws funds if Auditor average is <1.5."  

  3. **Over-Simplified Allocations:**  
     - *Risk:* Players split funds evenly to avoid conflict.  
     - *Fix:* **Force prioritization**—e.g., "You must allocate >50% to two project types."  

  4. **Dominant Personalities:**  
     - *Risk:* Loud students monopolize Round 1 debate.  
     - *Fix:* **Structured turns**—30 seconds per player.  

  ---

  ### **What the Activity CANNOT Simulate**  
  - **Structural Poverty:** The game can’t replicate how clientelism becomes rational when the state fails the poor. *Debrief Tip:* Ask: *"Would your choices change if your village had no clean water?"*  
  - **Systemic Corruption:** Players act alone, not in networks. *Debrief Tip:* Note: *"Real corruption involves threats, promises, and long-term webs of exchange."*  
  - **Emotional Weight:** Simulated kinship lacks real loyalty. *Mitigation:* Use familial language ("Your cousin will lose her farm").  

  ---

  ### **Instructor Cheat Sheet**  
  - **Prep:** Print role cards (ensure private ties vary), tokens, Ethics Code poster.  
  - **Running:** Enforce time limits; during secret allocation, patrol to prevent collusion.  
  - **Pivot if Stuck:** "Santa Clara just lost EU aid due to corruption scandals—reallocate under scrutiny!"  
  - **Closing Insight:** *"Corruption isn’t defined by dictionaries, but by which obligations we place above office—and who pays the price."*  

  This design forces experiential tension between universal rules and embedded loyalties while fitting your time constraints. The payoff mechanics make both impartiality and favoritism costly, ensuring no easy wins.
