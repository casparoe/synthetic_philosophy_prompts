  For the AI angle: models trained only on text would trouble Hume. They have no direct sensory impressions, only "second-hand" linguistic data. But he might argue that association (via gradient descent) still builds complex representations from these verbal "impressions." Their "beliefs" could be seen as high-probability outputs - Hume's "lively ideas" without the sensory vividness. 

