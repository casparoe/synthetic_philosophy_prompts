prompt: |-
  I'm a science-and-ideas journo — long features, mostly, whatever gets me out of the office — and I'm trying to get a head start on a peice about whether AI models have an inner language: the whole "is it thinking in English, or in some private code of its own?" fight that's been going ever since the interpertability people started staring at activations. My editor wants some history-of-ideas ballast in it, and I've been reading Fodor, which sent me back to much older guys.

  So, homework for you. Take Hume — not the causation sceptic, the theory-of-ideas Hume: impressions and ideas, simple and complex, every idea ultimately a faded copy of an impression, general ideas being nothing more than particular ideas hitched to a general term, association by resemblance, contiguity and causation doing all the real work. Also that little puzzle he raises, where you can apparently get the idea of a shade of blue you've never actually seen, which he notices and then kind of waves off.

  Now sit him down with Fodor's claim: thought has to run on a language-like code — structured, compositional mental representations with a syntax, and the code itself is innate rather than learned from experience. Where does Hume sign, where does he balk, and where would he just say no thanks? I'm not after "he's an empiricist so he'd say no" — I want the specific joints. Which parts of Fodor would he have no problem with at all, and which parts would he think are doing work that custom and habit already does?

  Then the bit I actually need for the piece. Would his answer change if the thinker were a model trained on text instead of a person with eyes and ears? He's got that view that belief is just a livelier idea, and a model's ideas all come second-hand out of other people's words, never out of anything it saw or felt. Does that matter to him — does the machine get mentalese but no beliefs, or is habit enough and the machine is fine? And tell me straight if my half-theory is dumb: that if custom does all the work, then gradient descent is basically Hume's associationism in silicon, which would make him the patron saint of deep learning.

  No bibliography, obviously. Just the joints, the verdicts, and enough structure that I can write 800 words off it without embarrassing myself.
