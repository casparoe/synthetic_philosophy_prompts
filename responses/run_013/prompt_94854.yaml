answer: |-
  Here's a concrete example dissecting the tension between accuracy-first epistemology and diachronic coherence (like conditionalization):

  ### Scenario Setup
  - **Propositions**: A coin is flipped. We care about:
    - **H**: The coin lands Heads.
    - **T**: The coin lands Tails (≡ ¬H).
  - **Prior Credences (t₀)**:
    - You have evidence suggesting the coin is biased against heads. Your prior: **P₀(H) = 0.4**, **P₀(T) = 0.6**.
  - **Evidence (t₁)**:
    - At t₁, you receive evidence **E**: "The coin landed Tails" – but from a source with 70% reliability.  
    - Likelihoods: **P(E|T) = 0.7**, **P(E|H) = 0.3** (since the source might be wrong).
  - **Conditionalizer's Response (t₁)**:
    - Updates via Bayes:  
      P₁(H|E) = [P(E|H) * P₀(H)] / [P(E|H)P₀(H) + P(E|T)P₀(T)]  
      = [0.3 * 0.4] / [(0.3 * 0.4) + (0.7 * 0.6)]  
      = 0.12 / (0.12 + 0.42) = **0.12 / 0.54 ≈ 0.222**  
      So: **C_cond(H) = 0.222**, **C_cond(T) = 0.778**.
  - **Time-Slicer's Response (t₁)**:
    - Ignores P₀ entirely. Looks *only* at the evidence **E** and its likelihoods.  
    - Adopts the *likelihoodist* credence:  
      C_ts(H) ∝ P(E|H) = 0.3,  
      C_ts(T) ∝ P(E|T) = 0.7.  
      Normalizing: **C_ts(H) = 0.3**, **C_ts(T) = 0.7**.

  ### Accuracy Assessment at t₁
  We evaluate accuracy *only at t₁* using the **Brier score** (a proper scoring rule). Lower score = better accuracy.  
  - **Brier Score for proposition X**: *B(C, X, w) = (1 - C(X))²* if X is true in world w, else *(C(X))²*.  
  - **Total Brier Score**: *B(C, w) = [B(C, H, w) + B(C, T, w)]*.

  **Calculate scores for both credence functions in both possible worlds**:

  1. **World = Heads (H)**:
     - *C_cond*: B(C_cond, H, H) = (1 - 0.222)² = (0.778)² ≈ 0.605  
                  B(C_cond, T, H) = (0.778)² ≈ 0.605  
                  **Total ≈ 1.210**
     - *C_ts*: B(C_ts, H, H) = (1 - 0.3)² = (0.7)² = 0.49  
               B(C_ts, T, H) = (0.7)² = 0.49  
               **Total = 0.98**

  2. **World = Tails (T)**:
     - *C_cond*: B(C_cond, H, T) = (0.222)² ≈ 0.049  
                  B(C_cond, T, T) = (1 - 0.778)² = (0.222)² ≈ 0.049  
                  **Total ≈ 0.098**
     - *C_ts*: B(C_ts, H, T) = (0.3)² = 0.09  
               B(C_ts, T, T) = (1 - 0.7)² = (0.3)² = 0.09  
               **Total = 0.18**

  ### Dominance Analysis
  - **In Heads-world**: C_ts (0.98) is *more accurate* than C_cond (1.210).  
  - **In Tails-world**: C_cond (0.098) is *more accurate* than C_ts (0.18).  

  **Result**: Neither credence function accuracy-dominates the other. Each is more accurate in one world. The time-slicer's credence (C_ts) is not strictly dominated at t₁.

  ### Why This is a Problem for Accuracy-First
  1. **The Challenge to Conditionalization**:  
     Accuracy-first epistemology *cannot explain why the conditionalizer (C_cond) is rationally preferable to the time-slicer (C_ts) at t₁*. Both are coherent (obey probability axioms), and neither is accuracy-dominated at t₁. If rationality is solely about maximizing *current* accuracy-avoiding dominance, the time-slicer is just as rational as the conditionalizer.  
     
  2. **The Core Issue**:  
     Accuracy-first evaluations are *synchronic* – they only assess credences at a single time. The time-slicer violates diachronic norms (like conditionalization) but pays no price in *current* accuracy dominance. This severs the link between rational updating and accuracy, gutting the normative force of conditionalization. If you can ignore your past credences without risking accuracy-domination *now*, why bother being diachronically rational?

  ### Can Accuracy-First Recover?
  - **The Bullet-Biting Option**: Accuracy-first *can* embrace time-slicing. It would say: "At t₁, both C_cond and C_ts are rational. Your priors only matter instrumentally if they improve *future* accuracy, but impose no direct constraint." This makes epistemology "myopic" – each moment is judged in isolation.  
  - **Alternative: Add Diachronic Constraints**: Some accuracy-firsters (e.g., Konek, Levinstein) argue for *diachronic scoring rules* that penalize credence shifts not justified by evidence. For example:  
    - Score *total accuracy across time*, weighted by how much evidence you had.  
    - Penalize "gratuitous" belief changes (those not driven by likelihood ratios).  
    **Problem**: This moves beyond pure *accuracy*-first to include conservatism or path-dependence. It's no longer "only accuracy matters."

  ### My Verdict (Confidence: 85%)
  **Accuracy-first epistemology, in its standard synchronic form, is committed to biting the bullet and accepting time-slicing as rationally permissible.** It lacks the resources to penalize the time-slicer at t₁ without smuggling in non-accuracy considerations.  

  **Where I'm Least Confident (15% doubt)**:  
  The step where I conclude that *no* synchronic dominance argument can favor conditionalization. The example shows no dominance *in this specific case*, but could a different scoring rule or proposition set force dominance? I’m confident because:  
  1. **Greaves & Wallace (2006)** proved conditionalization maximizes *expected* accuracy, but that’s agent-relative (depends on *your* prior).  
  2. **Synchronically**, the time-slicer’s credences are coherent and match *some* prior (e.g., a uniform prior updated on E). Dominance requires being beaten *in all worlds*, but the time-slicer is optimal if their "snap" credences happen to align with the world (e.g., C_ts wins in H-world here).  

  **In essence**: Accuracy-first needs diachronic tools to ground conditionalization, or it must abandon diachronic rationality as a fundamental norm. Pure synchronic accuracy can’t tell you to *listen to your past self*.
