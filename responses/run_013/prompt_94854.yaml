prompt: |-
  ok so I've been going down the accuracy-first epistemology rabbit hole and I want an example out of you rather than a summary. The story I've absorbed: credences are good insofar as they're accurate, and coherence (obeying the probability axioms) is good because incoherent credences are accuracy-dominated — for any incoherent credence function there's some coherent one thats more accurate no matter how the world turns out. Fine, I already know that argument, dont just restate it.

  Heres my snag. All of that scores credences one moment at a time. Theres no score for how a whole stretch of my epistemic life hangs together; each time-slice gets graded on its own. So as far as the accuracy-first story goes, the credences I had last year are irrelevant to whether I'm doing well now. But that seems to gut conditionalization — if only present accuracy matters, why shouldn't I just jump to whatever credences are most accurate at each moment and let my priors be damned?

  Give me an example of the conceptual issue here, worked out with actual numbers. Invent a tiny scenario — a couple propositions, a prior, a bit of evidence, the conditionalization posterior — and then a rival time-slicer who, at the later moment, holds credences that are at least as accurate as the conditionalizer's but who paid zero attention to their past self. Show me whether the time-slicer's credences can be accuracy-dominated at the later time or not, and if they can't, spell out why that's a problem for accuracy-first (or isn't). Then actually come down somewhere: is accuracy-first committed to caring about the past, or can it bite the bullet and become a purely time-slice theory? Tell me how confident you are in your verdict and flag the step in your own reasoning you're least sure of.
