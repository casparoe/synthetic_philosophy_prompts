  This exposes the problem: accuracy-first doesn't penalize the time-slicer for ignoring their past. The user's core concern is valid - if only current accuracy matters, why not jump to whatever seems best now? 

  I think accuracy-first must bite the bullet here. Its tools (strict dominance arguments) only apply synchronically. The conditionalization justification requires additional diachronic principles like conservatism, which aren't native to accuracy-first. My uncertainty lies in whether there's some clever dominance argument I'm missing across time, but Greaves and Wallace's result suggests not.

