answer: |-
  Here are five scenes, letting the experiments speak:

  1. **First shell gone:** With galaxies erased but distant quasars still pixel-her window, she spun the bucket; the water climbed, the gyroscope held its axis against the silent void.
  2. **Next shell vanished:** Clusters gone, leaving only the Milky Way's ghostly smear, she spun it again: water still curved, the gyro unwavering, though the reference for "fixed" felt thinner than vacuum.
  3. **Local Group deleted:** Only Sol remained, a lonely point, yet the bucket’s spin sent water crawling up steel, the gyro stubbornly true – *Did it feel weaker, or am I imagining it?* she wondered, erasing the sun.
  4. **Solar system vanished:** Spinning the bucket in utter darkness, the water’s surface remained stubbornly concave, the gyro’s hum a fragile certainty against the featureless black where planets *used* to be.
  5. **Lab walls dissolved:** Spinning amidst pure, empty space, the water lay perfectly flat this time, inert – but the gyroscope, untouched, began a slow, undeniable drift into the absolute dark.

  **Why this works for your goals:**

  *   **Experiments Argue:** The bucket's changing surface (concave/flat) and the gyroscope's stability/drift *are* the data points for substantivalism (effects persist/change without matter) vs. relationism (effects fade/require matter). No character explains.
  *   **Doubt is Central:** Her internal question in Scene 3 ("Did it feel weaker...?") and the erasure of references ("where planets *used* to be") force the reader to grapple with the core problem: verifying influence *after* its source is gone is impossible. Memory is unreliable.
  *   **Ambiguous Ending:** The final contradictory result (flat water = relationism? drifting gyro = substantivalism?) leaves the debate unresolved and visceral. The reader *feels* the uncertainty she does.
  *   **Minimalist & Evocative:** Five scenes, stark sentences, focus on action and sensory detail (climbing water, gyro hum, featureless black) create atmosphere without exposition.
  *   **The Wrinkle:** The progressive deletion *is* the experiment, and the fading references *are* the problem dramatized. The reader experiences the loss of anchors.
