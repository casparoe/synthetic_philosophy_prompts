prompt: |-
  ok so I'm a junior and I'm in my school's debate club, and our coach Mr. Alderidge is letting me run the entire 25-minute session next Thursday because he's taking the varsity team to regionals and honestly I think he just doesn't want to prep anything. I get to pick the topic and I want to do standing to blame and hypocrisy. The reason is that in debate we get drilled that "tu quoque" is a fallacy and you get docked for it, which I can recite in my sleep, but then in real life my cousin vapes and is constantly telling his little brother to quit and it really does feel like that should matter somehow, and I can't tell if I actually believe that or if I just believe it because I like him. My friend Priya and I got into a whole thing about it at lunch. She says there's two totally different things people mean when they say "you can't say that to me": either you're a fraud, you don't even believe the thing you're saying, or you're a mess, you believe it and you're just failing at it, like a guy with a drinking problem telling you to stop drinking. I think that split is the spine of the whole thing but I'm not sure it can carry the lesson by itself.

  Don't explain the topic to me, plan how I should teach it. I need the order the pieces have to go in and why each one depends on the last, for a room of fourteen-to-seventeens who have never read any philosophy and who all walk in already thinking blame just means telling somebody they did a bad thing and that hypocrisy is definately always a fallacy. Which example should carry the whole thing — I've got two candidates and I want you to pick: the vaping cousin, or something that actually happened last month where our team captain called out another school for clipping evidence during a round and then got caught doing basically the same thing two weeks later. I worry the second one is too juicy and the whole room derails into whether he was still right about the other school, so tell me which one carries it and what that example has to have and has to not have. Then the misconceptions in the order they'll actually show up, and exactly where in the sequence I should head each one off, including the one I'm probably going to plant myself by saying "tu quoque" out loud too early because it's the only word I'm confident about. Also what I should openly refuse to get into in 25 minutes, and the one question I can ask at the end that tells me whether they got the difference between "your criticism is false" and "you aren't the one who gets to make it" rather than just being able to parrot the word hypocrisy. Put it as a numbered sequence I can copy onto the whiteboard. And on the very last line, by itself, put \answer{} with just the misconception you think is the hardest to dislodge from a debate kid, in like three or four words.
reasoning: |-
  Hmm, the user is a junior in high school who runs the debate club and needs to plan a 25-minute session on standing to blame and hypocrisy. Their coach is away, and they're taking charge. They want to focus on why hypocrisy matters in real life, even though debate rules dismiss "tu quoque" as a fallacy. I need to help structure this lesson effectively.

  The user has two key examples: one about a cousin who vapes but tells his brother to quit, and another about a debate team captain caught clipping evidence after calling out another school. They're worried the debate example might derail the discussion, so I should advise using the vaping cousin for simplicity. It's relatable and avoids insider drama, keeping the focus on the core concepts.

  The user mentioned their friend Priya's idea about two types of hypocrisy: fraud (not believing what you say) and mess (believing but failing). That's a solid foundation. I'll build the lesson around that split, as it clarifies why hypocrisy can undermine standing without making the criticism false.

  For the sequence, I should start with common misconceptions. The biggest one is that all hypocrisy is a fallacy, which I need to tackle early. The user might accidentally say "tu quoque" too soon, so I'll place a checkpoint to define it only after establishing real-life relevance, preventing premature dismissal.

  The lesson must be step-by-step for teens with no philosophy background. They think blame is just saying someone did wrong and hypocrisy is always invalid. I'll order it from simple to complex: start with what blame is, introduce hypocrisy, differentiate fraud vs. mess, explain standing, and finally address the fallacy part. Each step depends on the last: e.g., you can't grasp why hypocrisy matters without first understanding standing.

  I need to include what to avoid: no deep dives into moral philosophy, no resolving if the criticism is true, and no re-litigating the debate captain's case. Keep it focused. For assessment, end with a question that tests if they can distinguish between "your criticism is false" and "you lack standing," like asking why a hypocrite's advice might still be good but hard to accept.

  The hardest misconception for debate kids is "hypocrisy invalidates the claim." They're trained to see it as a fallacy, so it's ingrained. I'll note that in the answer section.

  Finally, the user wants a numbered list for the whiteboard. I'll make it clear and actionable, with timing estimates to fit 25 minutes. The last line will isolate the toughest misconception in a few words.
answer: |-
  Here’s a battle-tested 25-minute lesson plan designed as a numbered sequence. It prioritizes flow, preempts misconceptions, and uses your cousin example for focus. Copy this directly onto the whiteboard:

  **Lesson Plan: When Does Hypocrisy Matter?**
  1.  **(2 min) Warm-Up: What is "Blame"?**  
      *   *Activity:* Quick brainstorm: "What do we *do* when we blame someone?" (Goal: Surface instinctive views – e.g., "Tell them they're wrong," "Make them feel bad," "Hold them responsible").  
      *   *Why:* Establishes baseline understanding. Reveals that blame is often seen *only* as declaring an act wrong, ignoring the *speaker's role*.

  2.  **(3 min) Intro the Tension: Real Life vs. Debate Rule**  
      *   *Activity:* "In debate, we learn 'tu quoque' (pointing out hypocrisy) is a fallacy – it doesn't disprove the argument. But in real life (like my cousin who vapes telling his brother to quit), it *feels* like it *should* matter. Why the disconnect?"  
      *   *Why:* Creates cognitive dissonance. Uses your relatable example immediately. **Crucially avoids defining 'tu quoque' yet** (saving it for step 5).

  3.  **(5 min) The Hypocrisy Split: "Fraud" vs. "Mess"**  
      *   *Activity:* Present Priya's distinction clearly:  
          *   **Fraud:** You say Action X is wrong, but you secretly don't believe it (e.g., a politician pushing anti-corruption laws while taking bribes).  
          *   **Mess:** You believe Action X is wrong, but you struggle and fail yourself (e.g., your vaping cousin, an addict urging sobriety, a messy roommate telling you to clean).  
      *   *Focus Example:* **USE THE VAPING COUSIN.** It perfectly illustrates the "Mess" type which is harder to dismiss and avoids debate-team drama derailment. Key elements it *has*: Clear moral stance ("don't vape"), personal failure, emotional weight. Key element it *lacks*: Complex debate rules/context.  
      *   *Why:* Provides the core analytical framework. Shows hypocrisy isn't monolithic. The cousin example highlights the *conflict* between believing something is wrong and failing to live up to it.

  4.  **(7 min) "Standing to Blame": Why the Speaker Matters**  
      *   *Activity:* Introduce the concept: "Standing to Blame means having the *right or authority* to make the criticism." Connect to the split:  
          *   **Fraud:** Undermines standing because you're dishonest; your words lack moral weight.  
          *   **Mess:** Undermines standing in a different way – not dishonesty, but a *failure of credibility* or *authority*. Your struggle makes it hard to hear your lecture ("Practice what you preach!"), even if your *point* is right.  
      *   *Key Question:* "Does my cousin's hypocrisy make his *point* (vaping is bad) wrong? (No). Does it make it harder for his brother to *listen* or take him seriously? (Yes). Why?"  
      *   *Why:* Shifts focus from "Is the claim true?" (debate fallacy focus) to "Who gets to say it?" and "How effectively can they say it?". **Preempts Misconception 1 (Emerging Here):** "But the claim is still true, so it shouldn't matter!" *Counter:* "We're not saying the claim is false. We're asking if *this person*, in *this state*, is the best messenger *right now*."

  5.  **(4 min) Where "Tu Quoque" Fits In (The Fallacy Part)**  
      *   *Activity:* **NOW define it:** "'Tu quoque' (Latin: 'you also') is the fallacy of arguing that someone's criticism is *invalid* because they are guilty of it too. **In pure logic/deductive reasoning, this is correct: hypocrisy doesn't make the claim false.**"  
      *   *Connect:* "Debate focuses on the *truth value of claims and arguments*. 'Tu quoque' is rightly a fallacy *in that context* because it distracts from the logic. But real-life blame isn't *just* about logic – it's about relationships, persuasion, authority, and moral influence. That's where 'standing' kicks in."  
      *   *Why:* Defines the term *after* establishing its limitations. **Preempts Misconception 2 (Likely Planted Earlier):** "You said 'tu quoque' is a fallacy, but now you're saying hypocrisy matters? Contradiction!" *Counter:* "It *is* a fallacy for *disproving the claim*. It *isn't* irrelevant for *undermining the speaker's standing* to effectively deliver that claim or hold others accountable." **Preempts Misconception 3:** "So hypocrisy *does* make the claim false?" *Reinforce:* "No. The claim's truth is separate. Hypocrisy attacks the *messenger*, not (directly) the *message*."

  6.  **(3 min) Putting it Together & What We're NOT Doing**  
      *   *Activity:* Summarize: "Hypocrisy (Fraud or Mess) often undermines your *Standing to Blame* – your moral authority/credibility to effectively criticize or hold others accountable. This doesn't make the *substance* of your criticism false (that's the fallacy part), but it makes *you delivering it* problematic or ineffective."  
      *   *Openly Refuse To Get Into:*  
          *   Deep moral philosophy (Kant vs. Utilitarianism on hypocrisy).  
          *   Whether the *substance* of a criticism is true/false in a specific case (e.g., "Was the other school *actually* clipping?").  
          *   Resolving specific real-life disputes ("So was my cousin *wrong* to say it?").  
      *   *Why:* Reinforces the core distinction. Manages scope. Prevents tangents.

  7.  **(1 min) The Checkpoint Question**  
      *   *Activity:* Pose: **"Imagine someone says, 'Yes, I smoke, and yes, I'm telling you to quit. My hypocrisy doesn't change the fact that smoking will kill you.' Explain why someone might still reject their criticism *without* saying the fact about smoking killing you is wrong."**  
      *   *Why:* Forces them to articulate the "standing" concept ("You lack the moral authority," "I can't hear it from you," "Your actions drown out your words") instead of just parroting "hypocrisy" or "fallacy." Success means they grasp the distinction.

  \answer{Hypocrisy invalidates the claim.}
