prompt: |-
  I am assembling a methodological brief for a graduate seminar on multi-causal explanation in history, and what I want from you is a specification rather than a survey. The subject is overdetermination: outcomes that appear to have more than one cause, where each of the causes on its own would have been enough. Before I look at any account of what causation is, I need the list of what such an account must deliver if a working historian is to use it — the cases it has to get right, the distinctions it must not collapse, the verdicts it must be able to return, and the constraints it must respect.

  Treat the following as stipulated. They are constructed for the exercise, nothing in them depends on the historical record, and I want the world assumed deterministic so that talk of a factor being sufficient for an outcome is unambiguous.

  1. Redundant sufficiency. Two factors, each sufficient on its own for the outcome, both present and both operating; either alone would have produced it. (Two independent detonators, each wired to fire the charge by itself; both fire.)

  2. Preemption. One sufficient factor operates and, in the course of operating, removes the second before the second can operate — though until then the second was equally sufficient for the outcome.

  3. Joint sufficiency. Two factors, neither sufficient alone, jointly sufficient, each making a difference to the outcome. (Two conditions, each necessary given the other.)

  4. Necessary but insufficient. A factor without which the outcome could not have occurred, which was nevertheless not enough for it.

  5. Screening off. A remote factor brings about a proximate factor; the proximate factor is sufficient for the outcome; and every route by which the remote factor bears on the outcome runs through the proximate factor. The historian still wants to say that the remote factor is why the proximate one was there, and so why the outcome occurred.

  6. Description relativity. One and the same process under two descriptions: under the first, the factor is a cause; under the second, it looks like a standing background condition. (The striking of a match under one description, the presence of oxygen under another.)

  Now the requirements. For each, give me the case or consideration that forces it, and mark it as non-negotiable or as something only one camp in the debate needs. I want at least the following settled by the list, though you should add requirements I have not thought of:

  - Must the account return a verdict about the world, or is it permitted to return a verdict about what the historian can know or compute? I need the former; tell me what it costs.
  - Can it deliver its verdicts without appealing to laws of nature or other covering generalizations?
  - Does it explain why the redundant factor in case 1 counts as a cause while the preempted factor in case 2 is normally demoted — or does it deny the asymmetry and accept the consequence?
  - Does it treat causation as relative to how the outcome is described? If so, what keeps historical explanation from collapsing into an artefact of our vocabulary? If not, what does it say about case 6 and about the standing practice of distinguishing causes from conditions?
  - Can it underwrite unequal assignments of weight, that is, degrees of causal contribution, or must it declare such talk incoherent? If it can, what in the cases fixes the weights?
  - What does it say about case 5: is the remote factor a cause of the outcome, or is causation cut off where the proximate sufficient factor begins? And does its answer to case 5 commit it to anything about case 2?
  - Does it survive the point that if outcomes are individuated partly by their causes, the two sufficient factors in case 1 do not overdetermine a single outcome but produce two distinct ones, so that overdetermination is not a phenomenon at all? Say whether the account can accommodate both fine and coarse individuations, and what follows either way.

  Finally, flag any subset of the requirements you believe cannot be jointly satisfied, with the argument rather than the assertion, and tell me which single requirement does the most work in ruling accounts out. I do not need a survey of named positions or a reading list; if you mention a position, mention it only to illustrate what a requirement excludes.
reasoning: |-
  Okay, let me approach this methodically. The user wants a rigorous specification of requirements for a causal account that handles overdetermination in historical explanation, based on constructed deterministic cases. 

  First, I need to internalize the six stipulated cases: redundant sufficiency, preemption, joint sufficiency, necessary but insufficient factors, screening off, and description relativity. These are designed to test different facets of causation without historical baggage. 

  For the requirements section, the user lists seven key questions but expects me to add more. I should start by mapping each requirement to the cases that force it. 

  The first requirement about ontological vs epistemic verdicts is critical. Case 1 (redundant sufficiency) forces the issue - any account that retreats to "we can't know which cause operated" fails because in a deterministic world, both causes objectively operated. This must be non-negotiable for historical realism.

  For covering generalizations, case 6 (description relativity) is decisive. If oxygen's presence is deemed a "background condition" rather than cause based on descriptive choices, the account must explain this without invoking physical laws. This seems non-negotiable since historians don't rely on natural laws. 

  The asymmetry between case 1 (redundant cause still counts) and case 2 (preempted cause demoted) is crucial. Any account that can't distinguish them - like strict counterfactual theories that would treat both as non-causes - fails a core historical practice. Must be non-negotiable.

  For description relativity itself, the account must reconcile case 6 with avoiding linguistic relativism. The solution might lie in recognizing that causal facts exist but our explanatory focus varies. This is negotiable only if the account provides stable criteria.

  On causal weights, case 3 (joint sufficiency) and case 4 (necessary but insufficient) demand gradation. If an account can't handle this - like binary difference-making theories - it fails practical history. Non-negotiable for nuanced explanation.

  Screening off (case 5) versus preemption (case 2) reveals tensions. If remote causes are valid via proximate ones, why not preempted causes? The account must justify treating preempted causes differently while accepting screened-off ones. Case 5's solution mustn't break case 2.

  The individuation challenge is profound. If outcomes are cause-dependent, case 1's "single outcome" dissolves. The account must either reject fine individuation (losing explanatory precision) or accept it (risking overdetermination's disappearance). No easy solution - worth flagging as a possibly unresolvable tension.

  I should add two requirements: one about causal transitivity (forced by case 5) and another about partial contribution (from cases 3-4). Also, the account must handle causal chains without infinite regress.

  The biggest trade-off emerges: maintaining causal asymmetry (case1 vs case2) while accepting transitivity (case5) and avoiding outcome individuation problems. Process theories handle asymmetry well but struggle with transitivity; counterfactual theories have opposite issues. This cluster - especially asymmetry - does the most work ruling out accounts.

  Finally, I'll note that no account satisfies all perfectly, but process theories with explicit difference-making components come closest despite outcome individuation worries. The key is preserving historical practice while meeting ontological constraints.
answer: |-
  Below is a specification of requirements for a causal account capable of handling the stipulated cases of overdetermination and multi-causality in deterministic historical explanation. Each requirement is anchored to the cases that force it, marked for negotiability, with implications for historical practice.

  ---

  ### **Core Requirements Forced by Cases**
  1. **Ontological Verdicts (Non-negotiable)**  
     - **Forced by**: Case 1 (Redundant Sufficiency).  
     - **Requirement**: The account must return verdicts about *what happened in the world*, not epistemic limitations (e.g., "we cannot know which cause operated").  
     - **Cost**: Rejects accounts that reduce causation to explanatory pragmatics (e.g., "causes are what we find salient"). Historians must accept that multiple sufficient causes *objectively* operate even when indistinguishable.  

  2. **No Reliance on Covering Laws (Non-negotiable)**  
     - **Forced by**: Case 6 (Description Relativity).  
     - **Requirement**: Verdicts must not depend on laws of nature or empirical generalizations. Distinguishing "cause" (match-striking) from "condition" (oxygen) must hinge on structural/difference-making features, not nomological necessity.  
     - **Historical Constraint**: Historians rarely invoke universal laws; causes are context-bound.  

  3. **Asymmetry Between Redundancy and Preemption (Non-negotiable)**  
     - **Forced by**: Contrasting Case 1 (Redundant Sufficiency) and Case 2 (Preemption).  
     - **Requirement**: The account must explain why *both* factors in Case 1 are causes, while the *preempted* factor in Case 2 is **not** a cause of the outcome (though it *could* have been).  
     - **Failure Consequence**: Accounts that collapse this distinction (e.g., symmetric counterfactual theories) misrepresent historical practice, where preempted factors are "inoperative" in the actual sequence.  

  4. **Description-Invariant Causal Facts (Negotiable for Some Accounts)**  
     - **Forced by**: Case 6 (Description Relativity).  
     - **Requirement**: Causation must be objective, but descriptions may highlight different aspects of a causal field. The account must explain why re-describing a process (e.g., "match-striking" vs. "oxygen-involving") alters *explanatory focus* without inventing new causal facts.  
     - **Safeguard**: Causal relata (events/states) must be individuated stably (e.g., spatiotemporally) to prevent vocabulary-driven relativism.  

  5. **Causal Weight/Gradation (Non-negotiable)**  
     - **Forced by**: Case 3 (Joint Sufficiency) and Case 4 (Necessary but Insufficient).  
     - **Requirement**: The account must underwrite unequal causal weights (e.g., Factor A contributes "more" than Factor B). Weights are fixed by:  
       - *Difference-making*: How much the outcome counterfactually depends on the factor.  
       - *Process contribution*: How integral the factor is to the actual causal chain.  
     - **Constraint**: Denying gradation (e.g., binary "cause/not cause" verdicts) ignores historical judgments of responsibility.  

  6. **Transitivity vs. Proximacy (Non-negotiable)**  
     - **Forced by**: Case 5 (Screening Off) and its tension with Case 2 (Preemption).  
     - **Requirement**: The remote factor in Case 5 **is** a cause of the outcome via transitivity (it explains *why* the proximate cause existed). However, this must **not** imply that preempted causes (Case 2) are causes.  
     - **Resolution**: Accept transitivity for dependence (Case 5) but require causal processes to be *active* (Case 2 preempted cause is inactive).  
     - **Commitment**: Rejects "proximate cause only" accounts (e.g., some process theories).  

  7. **Accommodating Outcome Individuation (Negotiable)**  
     - **Forced by**: The challenge that Case 1 (Redundant Sufficiency) may not involve a "single outcome."  
     - **Requirement**: The account must allow coarse-grained outcome individuation (e.g., "the charge exploded") for overdetermination to be possible. Fine-grained individuation (e.g., "explosion caused by Detonator A" vs. "by Detonator B") dissolves overdetermination but sacrifices historical utility.  
     - **Implication**: Historians must choose individuation grain deliberately; the causal account should not force one view.  

  ---

  ### **Added Requirements**
  8. **Causal Transitivity (Non-negotiable)**  
     - **Forced by**: Case 5 (Screening Off).  
     - **Requirement**: If A causes B and B causes C, then A causes C. Rejecting transitivity (e.g., "causal chains break at links") undermines historical explanations of deep causes.  

  9. **Partial Contribution Without Sufficiency (Non-negotiable)**  
     - **Forced by**: Case 4 (Necessary but Insufficient).  
     - **Requirement**: The account must recognize factors that are causally relevant but non-sufficient (e.g., dry tinder for a fire).  

  ---

  ### **Tensions and Unresolvable Requirements**
  - **The Central Trilemma**:  
    The requirements for **Transitivity** (Case 5), **Asymmetry** (Case 1 vs. Case 2), and **Ontological Verdicts** conflict with **Outcome Individuation**.  
    - If outcomes are individuated coarsely (e.g., "explosion"), Case 1 is overdetermined, but Case 2’s preempted cause is not a cause → *Asymmetry achieved*.  
    - If outcomes are individuated finely (by causes), Case 1 disappears (no overdetermination) but Case 5’s remote cause is severed from the outcome → *Transitivity violated*.  
    - **Result**: No account satisfies all three without compromise. Historians must prioritize coarse individuation (saving asymmetry and transitivity) at the cost of philosophical precision about events.  

  - **Key Exclusionary Requirement**:  
    The **Asymmetry Requirement** (distinguishing Case 1 and Case 2) rules out the most accounts:  
    - Pure counterfactual theories (e.g., Lewis) demote *both* redundant and preempted causes to non-causes.  
    - Symmetric process theories (e.g., conserved quantity) struggle to demote preempted causes.  

  ---

  ### **Summary: What the Account Must Deliver**
  | **Case**               | **Verdict Required**                                  | **Non-negotiable?** |  
  |------------------------|-------------------------------------------------------|---------------------|  
  | 1. Redundant Sufficiency | Both factors are causes.                              | Yes                 |  
  | 2. Preemption          | Only the preempting factor is a cause.                | Yes                 |  
  | 3. Joint Sufficiency   | Both factors are causes with partial weight.          | Yes                 |  
  | 4. Necessary but Insufficient | The factor is a cause with partial weight.        | Yes                 |  
  | 5. Screening Off       | Remote factor is a cause (via transitivity).          | Yes                 |  
  | 6. Description Relativity | Causal facts are invariant; descriptions select focus. | Negotiable          |  

  **Most Impactful Requirement**: The **Asymmetry Requirement** (Case 1 vs. Case 2) does the most work in ruling out theories. It forces accounts to incorporate causal dynamics beyond counterfactuals or laws (e.g., process activation).  
  **Unavoidable Compromise**: Outcome individuation must be coarse-grained to preserve overdetermination, accepting that "the outcome" is defined independently of its causes.  

  This specification provides a minimal framework for evaluating causal accounts in deterministic historical explanation. No extant theory satisfies all constraints perfectly, but process theories with difference-making components (e.g., mechanist accounts) come closest, despite unresolved tensions with outcome individuation.
