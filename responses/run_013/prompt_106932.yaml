prompt: |-
  I'm a backend engineer with no philosophy training and I ended up in a long argument with a mate of mine who did a law conversion course before he switched to tech, about how judges should read statutes. He's a thoroughgoing textualist — the only thing that counts, he reckons, is what the words on the page say, and digging through committee reports and floor debates to find what Parliament "really meant" is basically cheating. His analogy, which he's very pleased with, is that a statute is like an API: the enacted text is the documented interface, and the legislative history is the private implementation. You program against the interface, he says; anyone reaching into the internals is asking for trouble, and a judge who reads a purpose in from the debates is like a dev who leans on some undocumented quirk of a library and then acts surprised when it breaks on the next release. Purposivism, on his telling, is that mistake with robes on.

  I want you to audit this properly, because i'm not convinced it does the work he thinks it does. Give me the correspondence table first — what plays the role of the API, the spec, the version number, the deprecation policy, the compiler that refuses to build on ambiguity, the test suite, and the two parties calling the endpoint. Then the places it breaks, and be specific about which of those breaks actually matter for his conclusion and which are just cute. Some things i'd want you to think about: a statute has no single author and no dev team with one intent behind it, so "what the author meant" isn't even well-defined the way it is for a library; there's no compiler to reject an ambiguous call, so the ambiguity gets resolved by an adversarial process where the two sides want opposite answers; Hyrum's law says that with enough users, every observable behaviour, documented or not, ends up being relied on, which seems to cut against him; and there's no clean versioning — old statutes don't get deprecated, they just pile up, and the "users" (citizens, lower courts) can't pin to the previous version.

  Then tell me the bottom line: once the disanalogies are on the table, does the API analogy definately support textualism over purposivism, or was the analogy carrying the whole argument? And if it's a bad one, what would a better analogy be — something that captures the bits that matter (multi-author text, adversarial resolution, no compiler, no clean versions) without smuggling in the bits that don't (a benevolent single author, a tidy changelog, a runtime that tells you when you've misused it)?
reasoning: |-
  Okay, let me tackle this user's problem. They're a backend engineer who had an argument with their law-trained friend about textualism vs. purposivism in statutory interpretation. The friend used an API analogy to argue for textualism, comparing statutes to documented interfaces. The user wants me to audit this analogy thoroughly.

  First, I need to unpack the API analogy point-by-point. The friend equates the enacted text to an API's documented interface and legislative history to private implementation details. He argues judges should only look at the text, just like developers should only use the documented API. The user's concerns are about the disanalogies: statutes have multiple authors, no compiler to catch ambiguity, no versioning, and Hyrum's Law suggests undocumented behaviors get relied upon anyway.

  I'll start by mapping each component of the API analogy to statutory interpretation. The API spec is the statute text, the version number might be the enactment date, deprecation policy relates to repeal or amendment, but it's messy. The compiler is absent in law—ambiguity gets resolved in court. The test suite is like case law, but it's retrospective. The two parties calling the endpoint are the adversaries in a legal case.

  Now, where does this analogy break? Key breaks include: collective authorship (no single intent), no ambiguity rejection mechanism (courts decide instead), Hyrum's Law (undocumented behaviors become relied upon), no clean versioning (statutes accumulate), and the absence of a benevolent maintainer. These breaks matter because they undermine the core of textualism—that text alone is sufficient and objective. The user's points about multi-author text and adversarial resolution hit right at textualism's weaknesses.

  Hyrum's Law is particularly damaging to the friend's argument. If undocumented behaviors (like legislative history) are inevitably relied upon, excluding them might cause more instability, not less. The analogy smuggles in a single-author assumption which doesn't hold in legislation.

  So, does the analogy support textualism? Not really—it carries the argument by assuming a tidy dev environment that doesn't exist in law. A better analogy might be a legacy system with accumulated patches, debated by stakeholders in a meeting with no moderator. This captures multi-author messiness, adversarial resolution, and lack of clean versions without implying a single intent or clear deprecation.

  The bottom line: the API analogy fails under scrutiny. Textualism's appeal comes from its resemblance to engineering ideals, but legal reality is messier. The analogy hides the very complexities that make purposivism necessary sometimes. The user should focus on these disanalogies in their next debate.
answer: |-
  Here’s a rigorous audit of your friend’s "statute-as-API" analogy, mapping correspondences, pinpointing critical breaks, and evaluating whether it actually supports textualism. I’ll conclude with a better analogy that fits the legal reality.

  ---

  ### **Correspondence Table**  
  *(Your friend’s analogy mapped to statutory interpretation)*  

  | **API Concept**          | **Statutory Interpretation Equivalent**         | **Relevance to Argument**                                                                 |
  |--------------------------|------------------------------------------------|-------------------------------------------------------------------------------------------|
  | **Documented Interface** | Enacted statutory text                          | Core of textualism: Judges *must* rely *only* on this.                                    |
  | **Private Implementation** | Legislative history (debates, committee reports) | "Forbidden internals" – purposivism "cheats" by using these.                              |
  | **Spec/SDK Docs**        | Official statute publication (e.g., Hansard)   | Textualists accept this as part of the "interface" if publicly accessible.                |
  | **Version Number**       | Date of enactment                              | Weak analogy – statutes aren’t versioned; amendments are fragmented and layered.          |
  | **Deprecation Policy**   | Repeal/amendment processes                     | Poor fit – old statutes linger indefinitely, creating "legacy code" tangles.              |
  | **Compiler**             | N/A – *No equivalent*                          | Critical break: No pre-enforcement ambiguity checker. Courts resolve conflicts *ex post*. |
  | **Test Suite**           | Case law (precedent)                           | Retroactive "tests" applied *after* disputes arise – not proactive validation.            |
  | **Two Parties**          | Adversarial litigants (Plaintiff/Defendant)    | Parties argue opposite interpretations – no "correct" output until a judge decides.       |
  | **Library Maintainer**   | Parliament/Legislature                         | Flawed: Legislature is a multi-actor collective, not a unified "author".                 |

  ---

  ### **Where the Analogy Breaks (and Why It Matters)**  
  **✅ Critical Breaks (Undermine Textualism’s Premises)**  
  1. **No Single "Author" or Intent**  
     - **Break**: APIs have a dev team with shared intent; statutes emerge from 500+ legislators, lobbyists, and committees with conflicting goals. "Intent" is a fiction.  
     - **Why it Matters**: Textualism’s claim that "words have objective meaning" ignores that legislative text is often **deliberate ambiguity** – a political compromise. Purposivism acknowledges this by seeking a functional goal where text is unclear.  

  2. **No "Compiler" to Reject Ambiguity**  
     - **Break**: Ambiguous APIs fail at build time; ambiguous statutes only surface *after* harm occurs, in court.  
     - **Why it Matters**: Textualism assumes ambiguity is rare and resolvable by text alone. In reality, courts *must* resolve gaps (e.g., "Does 'vehicle' include e-scooters?"). Rejecting legislative history here is like fixing a bug without checking the commit log – possible but reckless.  

  3. **Hyrum’s Law Applies to Legislation**  
     - **Break**: Undocumented legislative history (e.g., committee reports) *is* relied on by agencies, businesses, and citizens to predict behavior. Ignoring it creates *more* instability.  
     - **Why it Matters**: Your friend’s claim that using history "breaks on next release" is backwards. If a "quirk" (e.g., a debated exemption) is widely relied on, *removing* it via strict textualism causes societal breakage.  

  4. **No Version Pinning or Clean Deprecation**  
     - **Break**: Citizens can’t "pin" to a statute version; old laws interleave with new ones like spaghetti code. "Deprecation" (repeal) takes decades.  
     - **Why it Matters**: Textualism can’t handle layered statutes (e.g., a 1950s law modified by 2020s amendments). Purposivism adapts old texts to modern contexts – like an API wrapper maintaining backward compatibility.  

  **⚠️ Quirky but Non-Critical Breaks**  
  - **"Test Suite" (Case Law) is Adversarial**: Precedent emerges from losers appealing – unlike unit tests.  
  - **No Benevolent Maintainer**: Legislatures rarely issue "patches" for judicial confusion.  
  - **"Users" Can’t Read the Spec**: Citizens don’t parse legal text; they rely on lawyers/lower courts.  

  ---

  ### **Bottom Line: Does the Analogy Support Textualism?**  
  **No. The analogy smuggles in engineering ideals that don’t exist in law, making textualism *seem* more rational than it is.**  
  - The API metaphor **assumes a tidy, deterministic system** (single author, clear versions, machine-readable spec). Law is none of these.  
  - It **ignores the core problem**: Statutes are often ambiguous *by design*, and courts *must* fill gaps. Rejecting legislative history doesn’t make interpretation more "objective" – it just privileges one type of evidence (text) over others, despite text being equally manipulable.  
  - **Real-world consequence**: In a 5-4 textualist SCOTUS decision (*Bostock v. Clayton County*), Gorsuch *used* purposive reasoning ("ordinary public meaning") to declare "sex discrimination" includes LGBTQ+ protection. Even textualists rely on purpose when text alone fails.  

  ---

  ### **A Better Analogy: The Statute as a Legacy Codebase**  
  Imagine a **critical open-source project**:  
  - **Multi-Author Mess**: 500+ contributors (with conflicting agendas) made fragmented commits over 50+ years.  
  - **"Build" = Reality**: The code runs in production *as written* – no compiler checks ambiguity. Bugs surface as societal harm (e.g., "Does this firewall rule block *all* drones or just military ones?").  
  - **Adversarial Debugging**: Two teams (plaintiff/defendant) present crash reports to a senior dev (judge).  
  - **Documentation Gap**: The README (statute text) is vague. Commit logs (legislative history) are patchy but hint at why a line was added.  
  - **No Versioning**: The system must keep running 24/7. "Updates" (amendments) are duct-taped onto the original.  

  **Here, a senior dev would**:  
  1. Check the README (text) *first*.  
  2. If stuck, **scan commit logs (legislative history)** to clarify ambiguous terms.  
  3. Consider **how the system *actually breaks*** (real-world consequences).  
  4. Ensure the fix **doesn’t crash dependent services** (societal stability/Hyrum’s Law).  

  This mirrors **pragmatic purposivism**: Text is primary, but history/consequences resolve ambiguity. Unlike the API analogy, it embraces the chaos of multi-author systems, adversarial debugging, and zero-downtime requirements – which is exactly how law operates. Your friend’s textualism is like insisting "README or nothing!" while the server burns.
