       - **Jade (REFUSE)**: No shared constitution (nephrite vs. jadeite); similarities are superficial and market-driven.  
       - **Biological species (COUNT)**: Gene flow and shared ecology form a causal process that binds the kind, even without fixed essences.  
       - **Race (REFUSE)**: Lacks a shared biological causal basis; defined by social, not natural, factors.  
       - **Vitamins (REFUSE)**: Defined by human nutritional function, not shared structure or mechanism.  
