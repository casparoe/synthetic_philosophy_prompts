prompt: |-
  I teach the final-year undergraduate module on causal inference for the health sciences, and I am now writing the summer exam paper. The topic I keep circling back to is the aggregate-versus-stratified reversal — the thing everyone calls Simpson's paradox — and two things this term have convinced me that my usual question on it is far too easy. The first was an argument with a colleague in the department about a small audit I had done for my partner's GP practice, in which the crude figures and the ward-by-ward figures pointed in opposite directions; I spent a fortnight telling anyone who would listen which set to trust, until she asked me, quite reasonably, what question I was actually trying to answer, and I realised I had never specified one. The second was her remark, made in passing and rather too cheerfully, that most of the reversals students bring to us are not paradoxes at all: some are ordinary confounding by a common cause, some are selection or collider bias from conditioning on something downstream of both variables, and some are simply an artefact of the effect measure — a crude odds ratio need not equal any weighted average of the stratum-specific odds ratios, and can fall below every one of them even when the strata are perfectly balanced and no confounding is present anywhere. My old question rewarded students for writing that the aggregate can mislead and the subgroups should therefore be trusted, which I now think is precisely the wrong lesson to send them away with.

  So I should like you to draft a single essay question for that paper, together with a model answer and a marking scheme. The question should put a concrete, compact set of counts in front of the students — a full 2×2×2 table, or a summary from which the full table can be reconstructed — and those counts must genuinely reverse on aggregation: the model answer has to show the arithmetic, giving the crude table and the stratum-specific odds ratios and risk differences, and demonstrating that the reversal is real rather than merely asserted. The crux I want examined is not that the aggregate can mislead but which of three quite different things is doing the work in this particular case — confounding by a common cause, selection or collider bias from conditioning on a variable downstream of both, or the non-collapsibility of the measure itself — and how the defensible answer changes once the causal question is made precise. Ideally a student could only answer well by saying which of the three the case exhibits, what the estimand is, and what they would report if the estimand were a different one. It is a forty-five minute question worth twenty marks.

  Please give me three things. First, the question exactly as it would be printed on the paper. Second, a model answer of roughly seven hundred words. Third, a marking scheme built on five must-hit points, with the marks allocated to each and totalling twenty, and against each point a one-line note on how candidates characteristically miss it. I want the scheme to separate an A from a B by naming the specific moves each band must contain: in particular, an A-band answer should have to state what would have to be true of the data for the naive instruction to trust the subgroups to be correct, and to say when and why it would be wrong. Keep the whole thing self-contained — no reading list, no references, no names of papers or authors, since the students get a formula sheet and I would rather marks went to reasoning than to recall. Please write everything, including the exam question itself, in American English, as I shall be co-marking with a colleague in the States.
reasoning: |-
  We are going to design an exam question that presents a 2x2x2 table and requires the student to analyze it for an aggregate versus stratified reversal (Simpson's paradox). The key is to have the reversal occur due to one of the three reasons: confounding, selection bias, or non-collapsibility. We want the student to identify which one and explain how the causal question determines the correct interpretation.

  We'll create a scenario with a binary exposure (E), a binary outcome (D), and a binary stratifying variable (S). The table should show a reversal in the aggregate compared to the stratified analysis.

  We'll choose a scenario where the reversal is due to confounding by S (a common cause) to make it clear. However, we must ensure that the reversal is present in both odds ratios and risk differences? Actually, note: non-collapsibility typically affects odds ratios without requiring confounding. But to make the point, we can have the reversal in risk differences as well? 

  But note: the problem states that sometimes the reversal is due to non-collapsibility. However, for the sake of having a clear example and to match the request for a reversal that is real (and to avoid the complication of non-collapsibility in this example), we can design a table where the reversal happens in the risk difference as well, making it a confounding issue.

  Alternatively, to illustrate non-collapsibility, we could have a table where the odds ratios reverse but the risk differences do not? But the problem says "the reversal is real" and we must show arithmetic. We want to avoid the student thinking that non-collapsibility is the only issue when the reversal occurs in the odds ratio but not in the risk difference.

  However, note the colleague's remark: "some are simply an artefact of the effect measure — a crude odds ratio need not equal any weighted average of the stratum-specific odds ratios". So we might design two scenarios? But the question must be self-contained and compact.

  Given the time constraint (45 minutes) and the goal, we'll create a single scenario that clearly illustrates confounding. We'll have:

  - Exposure E: 1 (exposed) and 0 (unexposed)
  - Outcome D: 1 (disease) and 0 (no disease)
  - Stratifying variable S: 1 (high risk) and 0 (low risk)

  We'll set up the counts so that in each stratum of S, the exposed group has a lower risk of disease (so the risk difference and odds ratio are protective) but in the aggregate, the exposed group has a higher risk (harmful). This reversal is due to confounding because S is a common cause: it affects both the exposure (e.g., high-risk individuals are more likely to be exposed) and the outcome (high-risk individuals have a higher risk of disease).

  We'll design the counts carefully.

  Example:

  Stratum S=0 (low risk):
    Unexposed (E=0): 800 subjects, 40 with disease -> risk0_unexposed = 40/800 = 0.05
    Exposed (E=1): 200 subjects, 5 with disease -> risk0_exposed = 5/200 = 0.025
    Risk difference (RD) in S=0: 0.025 - 0.05 = -0.025 (protective)
    Odds ratio (OR) in S=0: (5/195) / (40/760) = (0.0256) / (0.0526) ≈ 0.487 (protective)

  Stratum S=1 (high risk):
    Unexposed (E=0): 200 subjects, 80 with disease -> risk1_unexposed = 80/200 = 0.4
    Exposed (E=1): 800 subjects, 280 with disease -> risk1_exposed = 280/800 = 0.35
    Risk difference (RD) in S=1: 0.35 - 0.4 = -0.05 (protective)
    Odds ratio (OR) in S=1: (280/520) / (80/120) = (0.5385) / (0.6667) ≈ 0.808 (protective)

  Now, aggregate (ignoring S):
    Unexposed: total = 800+200 = 1000, cases = 40+80 = 120 -> risk_unexposed = 120/1000 = 0.12
    Exposed: total = 200+800 = 1000, cases = 5+280 = 285 -> risk_exposed = 285/1000 = 0.285
    Crude risk difference: 0.285 - 0.12 = 0.165 (harmful)
    Crude odds ratio: (285/715) / (120/880) = (0.3986) / (0.1364) ≈ 2.92 (harmful)

  So we have reversal in both RD and OR: in each stratum exposure is protective, but in aggregate it is harmful.

  This reversal is due to confounding: S is associated with E (in S=0, mostly unexposed; in S=1, mostly exposed) and S is a risk factor for D (higher risk in S=1). Therefore, S is a confounder.

  Now, the question: we want the student to recognize that the aggregate is confounded and that the stratified analysis is the one to trust if we are interested in the causal effect of E on D (adjusting for S). However, we also want to test the understanding that if the causal question is about the total effect (without conditioning on S) then the aggregate might be the target? But note: in the presence of confounding, the total effect is not directly given by the crude because of the confounder. So we must consider the causal structure.

  We will present the data and ask:

  1. Calculate the crude and stratum-specific measures (risk difference and odds ratio).
  2. Identify the reversal.
  3. Explain the reason for the reversal (confounding, selection bias, non-collapsibility).
  4. Discuss what the target estimand is and how it affects which estimate we trust.

  We will also ask: if we were interested in a different estimand (for example, the effect in the population without conditioning on S, but adjusting for confounding by S), then we would use a weighted average of the stratum-specific effects? But note: the total effect (with S as a confounder) is best estimated by the adjusted effect (e.g., using standardization or IP weighting). The crude does not represent the total effect because of confounding.

  Alternatively, we might consider a scenario where conditioning on S introduces bias (collider bias) but that would not show a reversal in the same way. We are using confounding.

  We'll also ask the student to consider what would happen if we were to condition on a variable that is a collider? But that might be too much for one question.

  Given the above, let's design the question.

  Exam Question:

  ---
  **Question 1 (20 marks)**

  The table below shows the results of a study on the effect of a new medication (exposure) on the occurrence of a disease (outcome). The study was conducted in a population that is stratified by a binary risk factor (S). The risk factor S has two levels: S=0 (low risk) and S=1 (high risk). The data are:

  |          | S=0 (low risk) |         |          | S=1 (high risk) |         |
  |----------|----------------|---------|----------|----------------|---------|
  |          | Exposed (E=1) | Unexposed (E=0) |          | Exposed (E=1) | Unexposed (E=0) |
  | Disease (D=1) | 5           | 40      |          | 280          | 80      |
  | No Disease (D=0) | 195        | 760     |          | 520          | 120     |
  | Total    | 200          | 800     |          | 800          | 200     |

  (a) Calculate the following measures for the entire population (ignoring S) and for each stratum (S=0 and S=1):
     - The risk difference (RD) for exposed versus unexposed.
     - The odds ratio (OR) for exposed versus unexposed.

  Present your answers clearly.

  (b) Describe the direction of the effect in the entire population and in each stratum. Does the aggregate analysis (ignoring S) show a reversal compared to the stratum-specific analyses?

  (c) Explain which of the following three phenomena is the primary reason for the reversal observed in this study:
     (i) Confounding by the risk factor S.
     (ii) Selection or collider bias from conditioning on S (if S were a collider).
     (iii) Non-collapsibility of the odds ratio.

  Justify your answer.

  (d) Suppose we wish to estimate the causal effect of the medication on the disease in the entire population. Which set of results (crude or stratified) should we trust? Why?

  (e) Now, suppose that the risk factor S is not a common cause of exposure and outcome, but instead is a consequence of both the exposure and the outcome (i.e., S is a collider). How would this change your interpretation of the stratified analysis? Specifically, would conditioning on S be appropriate? Explain.

  ---

  Model Answer (approximately 700 words):

  (a) **Calculations:**

  *Crude (Entire Population):*

  - Total exposed (E=1): 200 (from S=0) + 800 (from S=1) = 1000
    Cases in exposed: 5 (S=0) + 280 (S=1) = 285
  - Total unexposed (E=0): 800 (S=0) + 200 (S=1) = 1000
    Cases in unexposed: 40 (S=0) + 80 (S=1) = 120

  Risk in exposed: 285/1000 = 0.285  
  Risk in unexposed: 120/1000 = 0.12  
  Crude RD = 0.285 - 0.12 = 0.165 (harmful)  
  Crude OR = (285/715) / (120/880) = (285 * 880) / (715 * 120) = (250800) / (85800) ≈ 2.92 (harmful)

  *Stratum S=0 (low risk):*

  - Exposed: risk = 5/200 = 0.025
  - Unexposed: risk = 40/800 = 0.05
  - RD (S=0) = 0.025 - 0.05 = -0.025 (protective)
  - OR (S=0) = (5/195) / (40/760) = (5 * 760) / (195 * 40) = 3800 / 7800 ≈ 0.487 (protective)

  *Stratum S=1 (high risk):*

  - Exposed: risk = 280/800 = 0.35
  - Unexposed: risk = 80/200 = 0.40
  - RD (S=1) = 0.35 - 0.40 = -0.05 (protective)
  - OR (S=1) = (280/520) / (80/120) = (280 * 120) / (520 * 80) = 33600 / 41600 ≈ 0.808 (protective)

  (b) **Description of effects and reversal:**  
  In the entire population (crude analysis), the exposure (medication) appears harmful: the risk difference is positive (0.165) and the odds ratio is greater than 1 (2.92). However, in both strata (S=0 and S=1), the medication appears protective: the risk differences are negative (-0.025 and -0.05) and the odds ratios are less than 1 (0.487 and 0.808). This demonstrates an aggregate-versus-stratified reversal (Simpson's paradox): the effect in the aggregate is in the opposite direction to the effects within each stratum.

  (c) **Reason for reversal:**  
  The primary reason for the reversal is (i) confounding by the risk factor S.  

  Justification:  
  - S is associated with the exposure: In the low-risk group (S=0), the majority (800 out of 1000) are unexposed, while in the high-risk group (S=1), the majority (800 out of 1000) are exposed. Thus, S is a predictor of exposure.  
  - S is associated with the outcome: The risk of disease is much higher in the high-risk group (S=1) than in the low-risk group (S=0), regardless of exposure. For example, among the unexposed, the risk is 0.05 in S=0 vs. 0.4 in S=1.  
  - Therefore, S is a common cause of both exposure and outcome (a confounder). The crude association is confounded by S because it mixes the effect of E with the effect of S. The reversal occurs because the high-risk group (which has a higher baseline risk) has a much higher proportion of exposed individuals, making the exposed group appear to have a higher overall risk.

  Non-collapsibility (iii) is not the primary reason because the reversal is also present in the risk difference (which is collapsible). If non-collapsibility were the only issue, we would see reversal in the odds ratio but not in the risk difference. Here, both measures reverse. Also, selection bias (ii) does not apply because S is not a collider in this scenario. Conditioning on a collider (a common effect) would introduce bias, but here S is a common cause.

  (d) **Causal effect in the entire population:**  
  To estimate the causal effect of the medication on the disease in the entire population, we should trust the stratified analysis (after adjusting for S) because S is a confounder. The crude estimate is biased due to confounding. The adjusted estimate can be obtained by standardizing the stratum-specific effects to the entire population. For example, the standardized risk difference would be a weighted average of the stratum-specific RDs, weighted by the size of each stratum. Alternatively, we can use the Mantel-Haenszel method to get an adjusted OR. In this case, both strata show a protective effect, so we would conclude that the medication is protective, contrary to the crude analysis.

  (e) **If S were a collider:**  
  If S is a collider (a consequence of both exposure and outcome), then conditioning on S would induce a spurious association between exposure and outcome. In this case, the stratified analysis (conditioning on S) would be biased. We should not condition on S. Instead, the crude analysis (ignoring S) might be less biased, provided there are no other confounders. However, without knowing the causal structure, we cannot assume that the crude is unbiased. In the scenario where S is a collider, the reversal observed in the stratified analysis might be due to this collider bias. Therefore, we would avoid conditioning on S and rely on an analysis that does not adjust for S, unless we adjust using methods that do not condition on the collider (e.g., by not collecting data on S or by using other techniques). The key point is that conditioning on a collider can create bias even if there was no association before conditioning.

  ---

  Marking Scheme (20 marks total):

  1. **Correct calculation of the crude and stratum-specific RDs and ORs (5 marks)**  
     - 1 mark for crude RD and OR (0.165 and 2.92, approx)  
     - 1 mark for S=0 RD and OR (-0.025 and 0.487, approx)  
     - 1 mark for S=1 RD and OR (-0.05 and 0.808, approx)  
     - 1 mark for showing work (at least one detailed calculation)  
     - 1 mark for clear presentation (labeling, etc.)  
     *Common miss: Arithmetic errors, especially in ORs (e.g., not inverting the ratio correctly).*

  2. **Description of reversal (3 marks)**  
     - 1 mark for correctly describing the crude as harmful.  
     - 1 mark for correctly describing both strata as protective.  
     - 1 mark for stating that the reversal is present (aggregate opposite to strata).  
     *Common miss: Only mentioning one measure (e.g., RD or OR) or one stratum.*

  3. **Identifying and justifying the reason for reversal (5 marks)**  
     - 1 mark for choosing confounding (i).  
     - 2 marks for explaining why S is associated with exposure (distribution across strata).  
     - 2 marks for explaining why S is associated with outcome (risk differences by S).  
     - (If they choose (ii) or (iii) and justify, but it's incorrect, they get 0 for this section unless they also discuss why it's not (ii) or (iii) and then choose (i). However, the correct answer is (i).)  
     *Common miss: Stating that S is a confounder without showing the associations, or confusing with collider.*

  4. **Causal effect in the entire population (4 marks)**  
     - 1 mark for stating we should trust the stratified analysis (adjusted for S).  
     - 2 marks for explaining that the crude is confounded by S and the stratified analysis removes this confounding.  
     - 1 mark for mentioning that we can use standardization or weighting to get the population effect.  
     *Common miss: Saying we should trust the subgroups without adjustment, or suggesting to look at only one stratum.*

  5. **Interpretation if S were a collider (3 marks)**  
     - 1 mark for stating that conditioning on a collider introduces bias.  
     - 1 mark for stating that the stratified analysis would be biased in this case.  
     - 1 mark for stating that we should not condition on S and might use the crude (with caution) or avoid conditioning.  
     *Common miss: Not changing the answer from part (d) or not recognizing the problem with conditioning on a collider.*

  **Band Separation:**  
  - **A-band (18-20 marks):** Must correctly identify the reason as confounding and justify with both associations (exposure and outcome with S). Must also correctly handle the collider part by stating that conditioning on a collider induces bias and would make the stratified analysis untrustworthy. They must explicitly note that the reversal in this case is due to confounding and not the other two, and that the non-collapsibility is not the issue because the reversal occurs in the risk difference.  
  - **B-band (15-17 marks):** Correctly identifies confounding and justifies one of the associations, but might miss the other. Or, in the collider part, may not fully explain the bias. They may not mention the risk difference reversal as evidence against non-collapsibility.  

  This scheme ensures that the student must not only recognize the reversal but also understand the causal structure and the implications for estimation.
answer: |-
  ### Exam Question  
  **Question 1 (20 marks)**  

  A study examines the effect of a new exercise regimen (Exposure: \(E = 1\) for regimen, \(E = 0\) for control) on heart disease (Outcome: \(D = 1\) for disease, \(D = 0\) for no disease). Data are stratified by a binary variable \(S\) (\(S = 0\): low-stress occupation; \(S = 1\): high-stress occupation). The counts are:  

  - **Stratum \(S = 0\) (low-stress)**:  
    - Exposed (\(E = 1\)): 80 with disease, 320 without disease.  
    - Unexposed (\(E = 0\)): 180 with disease, 720 without disease.  
  - **Stratum \(S = 1\) (high-stress)**:  
    - Exposed (\(E = 1\)): 240 with disease, 160 without disease.  
    - Unexposed (\(E = 0\)): 90 with disease, 60 without disease.  

  (a) Calculate the **crude risk difference (RD)** and **crude odds ratio (OR)** for the entire population (ignoring \(S\)). Also, calculate the **stratum-specific RD and OR** for \(S = 0\) and \(S = 1\). Show all work. (5 marks)  

  (b) Does the association between exercise and heart disease reverse when aggregating versus stratifying by \(S\)? Justify by comparing the direction and magnitude of the crude and stratum-specific measures. (3 marks)  

  (c) Explain *which one* of these three phenomena—**confounding by \(S\)**, **selection/collider bias** (if \(S\) is downstream of exposure and outcome), or **non-collapsibility of the OR**—is the primary cause of the reversal. Justify your answer using the data and causal assumptions. (6 marks)  

  (d) Suppose the causal question is: "What is the average effect of the exercise regimen on heart disease risk in the *entire population*?"  
  (i) Should we trust the crude or stratified estimates?  
  (ii) What statistical adjustment would you use to estimate this effect?  
  Explain your reasoning. (3 marks)  

  (e) Now suppose the causal question changes to: "What is the average effect of the exercise regimen on heart disease risk *within each occupational stress group*?"  
  (i) Would the answer differ from part (d)?  
  (ii) If we still required a single summary measure for the entire population, how should it differ from the crude estimate?  
  Explain in one sentence each. (3 marks)  

  ---

  ### Model Answer (≈700 words)  
  **(a) Calculations**  
  *Crude (entire population, ignoring \(S\))*:  
  - Exposed (\(E = 1\)): Total = \(80 + 320 + 240 + 160 = 800\), Disease = \(80 + 240 = 320\) → Risk = \(320/800 = 0.40\)  
  - Unexposed (\(E = 0\)): Total = \(180 + 720 + 90 + 60 = 1050\), Disease = \(180 + 90 = 270\) → Risk = \(270/1050 ≈ 0.257\)  
  - **Crude RD** = \(0.40 - 0.257 = 0.143\) (harmful)  
  - **Crude OR** = \(\frac{320/480}{270/780} = \frac{0.667}{0.346} ≈ 1.93\) (harmful)  

  *Stratum \(S = 0\) (low-stress)*:  
  - Exposed risk = \(80/(80+320) = 80/400 = 0.20\)  
  - Unexposed risk = \(180/(180+720) = 180/900 = 0.20\)  
  - **RD (\(S=0\))** = \(0.20 - 0.20 = 0.00\) (no effect)  
  - **OR (\(S=0\))** = \(\frac{80/320}{180/720} = \frac{0.25}{0.25} = 1.00\) (no effect)  

  *Stratum \(S = 1\) (high-stress)*:  
  - Exposed risk = \(240/(240+160) = 240/400 = 0.60\)  
  - Unexposed risk = \(90/(90+60) = 90/150 = 0.60\)  
  - **RD (\(S=1\))** = \(0.60 - 0.60 = 0.00\) (no effect)  
  - **OR (\(S=1\))** = \(\frac{240/160}{90/60} = \frac{1.50}{1.50} = 1.00\) (no effect)  

  **(b) Reversal justification**  
  Yes, reversal occurs. The crude analysis suggests exercise is harmful (RD = 0.143, OR ≈ 1.93), but both strata show no effect (RD = 0.00, OR = 1.00). The crude and stratum-specific estimates differ in direction (harmful vs. null) and magnitude.  

  **(c) Primary cause of reversal**  
  The reversal is due to **non-collapsibility of the OR**.  
  - *Justification*: Non-collapsibility occurs when the crude OR differs from stratum-specific ORs even without confounding or selection bias. Here, the stratum-specific RDs are identical (0.00 in both strata), proving no confounding by \(S\) exists (no association between \(S\) and exposure/outline within strata). The crude OR (1.93) is not a weighted average of the stratum-specific ORs (both 1.00), violating collapsibility. This happens because the OR scale is non-collapsible: the crude OR can differ from stratum-specific ORs when effects are non-null or strata sizes differ, even when \(S\) is balanced (here, exposed/unexposed ratios differ across strata).  

  **(d) Causal question: Effect in entire population**  
  (i) We should trust the **stratified estimates** (or an adjusted estimate).  
  (ii) Use **standardization or inverse probability weighting** to average stratum-specific RDs (0.00) weighted by the population size of each stratum.  
  *Reasoning*: Since \(S\) is not a confounder (stratum-specific RDs are equal), the crude RD (0.143) is biased. The null effect in both strata implies the true causal effect is null. Standardizing RDs accounts for stratum sizes without non-collapsibility artifacts.  

  **(e) Changed causal question: Effect within strata**  
  (i) **Yes**: For this question, the stratum-specific estimates (both RD = 0.00) are directly trustworthy.  
  (ii) A population summary must **use stratum-specific RDs (not ORs) standardized to the same stratum size distribution** to avoid non-collapsibility.  
  *Reasoning*: When effects are homogeneous (as here), standardization of RDs gives an unbiased average effect. The crude OR remains misleading due to non-collapsibility.  

  ---

  ### Marking Scheme (20 marks total)  
  **Must-hit points** (marks allocated per point; common misses in italics):  

  1. **Correct calculations of all RDs and ORs (5 marks)**  
     - 1: Crude RD and OR (0.143 and ≈1.93).  
     - 1: \(S=0\) RD and OR (0.00 and 1.00).  
     - 1: \(S=1\) RD and OR (0.00 and 1.00).  
     - 1: Arithmetic shown for at least one RD and one OR.  
     - 1: Units/labels (e.g., "RD=0.143").  
     *Common miss: Incorrect risks (e.g., misaggregating counts); OR miscalculation (e.g., swapping cells).*  

  2. **Identify reversal and justify with direction/magnitude (3 marks)**  
     - 1: States reversal occurs.  
     - 1: Notes crude suggests harm (RD>0, OR>1).  
     - 1: Notes strata show no effect (RD=0, OR=1).  
     *Common miss: Claims reversal without comparing direction; omits OR/RD.*  

  3. **Diagnose cause of reversal and justify (6 marks)**  
     - 2: Correctly identifies *non-collapsibility* (not confounding or collider bias).  
     - 2: Notes stratum-specific RDs are identical (0.00), ruling out confounding.  
     - 2: Explains why crude OR ≠ stratum ORs despite null effects (non-collapsibility artifact).  
     *Common miss: Misattributes to confounding (ignoring null RDs); claims collider bias without evidence.*  

  4. **Choose correct estimate for entire-population effect (3 marks)**  
     - 1: Selects stratified estimates (or adjusted).  
     - 1: Advises standardization/IP weighting of RDs.  
     - 1: Explains that crude RD is biased despite no confounding (due to non-collapsibility).  
     *Common miss: Recommends "always trust strata" without adjustment; confuses with collider.*  

  5. **Contrast with stratum-specific estimand (3 marks)**  
     - 1: States stratum-specific estimates are appropriate for within-stratum effect.  
     - 1: For population summary, requires standardized RDs (not ORs).  
     - 1: Notes non-collapsibility makes crude OR invalid.  
     *Common miss: Suggests crude OR is acceptable; does not specify RDs for standardization.*  

  **Band separation**:  
  - **A (17–20)**: Must state that trusting subgroups is *only* correct if non-collapsibility is addressed (e.g., using RD standardization), and explain *why* "always trust strata" is wrong if non-collapsibility distorts the target estimand (e.g., for ORs).  
  - **B (13–16)**: Correctly identifies non-collapsibility and contrasts estimands but omits why naive subgroup trust fails (e.g., does not specify RD vs. OR for standardization).
