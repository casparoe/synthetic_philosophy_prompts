prompt: |-
  Ok so I'm a critical care fellow and I sit on our hospital's ethics comittee, and I did a philosophy degree before med school, which means I'm the person everyone asks about this stuff, which is a curse. Here's the thing I can't stop turning over.

  Our law, the Uniform Determination of Death Act, says — and I'm quoting the actual statute here — "An individual who has sustained either (1) irreversible cessation of circulatory and respiratory functions, or (2) irreversible cessation of all functions of the entire brain, including the brain stem, is dead. A determination of death must be made in accordance with accepted medical standards." Both criteria sit in the same sentence like two doors into the same room. In practice they aren't even the same shape.

  Camp one, the brain-death people: a patient who meets the whole-brain criteria is dead, full stop. The ventilator is inflating a corpse. The heart beats and the chest rises, but that's a machine and a body, not a person. Camp two, the skeptics: that's a legal fiction wearing a lab coat. Those bodies are still integrated living organisms — they heal wounds, fight off infections, hold their electrolytes in balance, I've read case reports of brain-dead women kept on support long enough to deliver a baby — and the only reason we call them dead is that we need a permission slip to take the organs. On this view we decided they were dead; we didn't discover it.

  And then the part that actually keeps me up. In DCD — donation after circulatory death — we withdraw life support, watch the pulse stop, wait a few minutes, and declare death. But everybody in that room knows the heart isn't irreversibly stopped. It's just permanent: permanent meaning we've decided not to restart it and it won't kick back on by itself. Restarting it is a decision we've ruled out, not a physical impossibility. So by the brain criterion we demand irreversibility, and by the circulatory criterion we quietly settle for permanence. Which is a word doing an enormous amount of unexamined work, and I suspect it's smuggling in a value judgment about when it's ok to stop.

  So: what kind of disagreement is this, actually? A real factual dispute about what death is? A verbal one, where one side means the biological event and the other means the legal status? A normative fight about which values we want encoded in a definition of death — the dead-donor rule, organ supply, public trust in medicine? Or two groups answering different questions under one word, "when does an organism stop being alive" versus "when may we treat someone as no longer one of us"?

  My hunch, offered as a hunch: it's mostly normative wearing a lab coat, and the biology is doing almost none of the work — that every live version of "death" here is really a decision about when we're permitted to stop and to harvest, and the two sides just have different answers to the permission question while pretending to answer the factual one. But I dont fully trust my own cynicism, so tell me where it's wrong.

  I want a diagnosis, not a verdict on who's right, and I want the reasons grounded in what each side actually commits itself to, not a survey. And I want the honest bit: what, if anything, would count as progress — a distinction, a piece of data, a formal result, an argument, a change of question — or is this one of those that just sits there forever because it isn't really one question. If you think no progress should be expected, say so and say why.

  Format: give me the diagnosis in prose, then end with a JSON object with these fields:
  - "disagreement_type": a short label — one of "substantive-empirical", "verbal", "normative-values", "different-questions", "bedrock-intuition", or "mixed" (you can add a short qualifier)
  - "why": 2–3 sentences on what makes it that type rather than the others
  - "brain_side_actually_committed_to": what the whole-brain side is really asserting, stated in its strongest form
  - "circulatory_side_actually_committed_to": same for the other side
  - "hidden_empirical_question": the factual question, if any, whose answer would settle it — otherwise null
  - "verbal_element": where the two sides are talking past each other over a word — otherwise null
  - "what_would_move_it": a list of the specific things (a distinction, a datum, an argument, a change of question) that would actually shift the debate
  - "progress_outlook": one of "likely", "unlikely", "impossible-as-posed"
  - "progress_reason": one sentence justifying that
reasoning: |-
  Okay, let me unpack this critical care fellow's ethical dilemma. They're wrestling with the Uniform Determination of Death Act's dual criteria for death, noticing how brain death and circulatory death operate very differently in practice despite being framed as equivalent. 

  The core tension seems to be between three layers: the legal text's clean parallelism, the messy clinical realities where "irreversible" means different things in each pathway, and the philosophical unease about whether we're describing biological facts or making value judgments. 

  What's particularly insightful is their observation about the DCD protocol - how "permanence" does heavy normative lifting when we decide not to restart a heart that could technically be restarted. That discrepancy between biological possibility and clinical decision-making feels like the fault line here. 

  Their hunch about normative concerns disguised as biological facts resonates strongly. In brain death declarations, the insistence on "irreversible" neurological cessation serves the ethical need for certainty before organ procurement, while in DCD, accepting "permanent" circulatory cessation reflects practical constraints and the dead-donor rule. The biology hasn't changed - our threshold for calling it irreversible has.

  The two camps appear committed to different things beneath the surface. Brain death advocates seem invested in a concept of personal identity tied to consciousness (the "person" is gone even if the body lives), while circulatory skeptics focus on organismal biology (life continues while integrated functions persist). This explains why cases like brain-dead pregnant women gestating babies trouble the first view but not the second.

  What's revealing is that no empirical discovery would resolve this. Even if we could perfectly measure every neuron's function or predict cardiac auto-resuscitation times, we'd still face the normative question: when should we treat biological processes as constituting a "person" worthy of protection versus a biological system we can withdraw from? 

  Progress might come from disentangling the questions: "When has biological death occurred?" versus "When are we ethically permitted to cease treatment and procure organs?" Reframing might help society develop separate criteria for these distinct concerns rather than trying to stretch "death" to cover both.

  The JSON should capture that this is primarily a mixed disagreement with normative values at its core, masked by verbal ambiguities around "irreversible." Both sides answer different questions under the same term "death," making progress unlikely without fundamental reframing. The brain death side is committed to a consciousness-based personhood definition, while the circulatory side prioritizes organismal biology - and neither position is falsifiable by data alone.
answer: |-
  Your analysis is sharp, and the discomfort is warranted. Here's a diagnosis grounded in the commitments of each side and the structure of the dispute:

  **Diagnosis:**

  This is primarily a **normative-values disagreement** masquerading as an empirical one, heavily amplified by **verbal** ambiguity and the conflation of two distinct biological/ontological questions under the single term "death." While biological facts (e.g., integrated organismal functions, potential for auto-resuscitation, neurological activity) are invoked, they serve as *justifications* for prior normative commitments about personhood, the permissibility of withdrawing care, and the necessity of the dead-donor rule, rather than being the *source* of the disagreement. The "irreversible vs. permanent" distinction in DCD exposes the normative engine driving the circulatory criterion. The whole-brain criterion relies on a specific philosophical definition of "person" (irrecoverable consciousness + integration) being synonymous with "human life," while the circulatory skeptics focus on the persistence of integrated *organismal* biology as the defining feature of life. Progress is unlikely without explicitly separating the normative questions from the biological ones or fundamentally renegotiating the dead-donor rule, as the current framing conflates "biological death of the organism" with "when it is permissible to treat the body as a resource."

  **JSON:**

  ```json
  {
    "disagreement_type": "mixed: normative-values core + verbal + different-questions",
    "why": "The core conflict is about values (when is it permissible to stop treatment/harvest organs? what defines a 'person'?), not empirically falsifiable facts. Verbal ambiguity centers on 'death' meaning biological cessation vs. legal/social status. The sides implicitly answer different questions: 'When does integrated organismal life cease?' vs. 'When has the person ceased to exist or when is treatment futile?'.",
    "brain_side_actually_committed_to": "A human being is dead when there is the irreversible loss of the biological capacity for consciousness and the irreversible loss of the brain's capacity to intrinsically integrate critical bodily functions, making the remaining biological processes merely residual and lacking the essential characteristic of a 'person' or living human organism.",
    "circulatory_side_actually_committed_to": "A human being is dead only upon the irreversible cessation of *all* critical life-sustaining functions integrated at the organismal level (requiring circulatory collapse); a body maintaining homeostasis, wound healing, gestation, etc., via intrinsic or extrinsic support, represents a living organism, and declaring it 'dead' based solely on brain function is a legal/social construct motivated by organ procurement needs.",
    "hidden_empirical_question": "null (While empirical data on integration, consciousness potential, or auto-resuscitation windows informs thresholds, no *single* undisputed biological fact would resolve the core normative/value conflict over defining 'life'/'personhood' or the permissibility of organ retrieval.)",
    "verbal_element": "The word 'death' itself. Brain side often uses it to mean 'cessation of personhood/personal identity', while circulatory side uses it to mean 'cessation of integrated organismal life'. 'Irreversible' vs. 'permanent' in the criteria highlights this: irreversibility implies a biological state, permanence implies a decision.",
    "what_would_move_it": [
      "Explicitly decoupling the question 'When is biological death (organismal cessation)?' from 'When is it permissible to withdraw life-sustaining treatment and harvest organs?', potentially abandoning the requirement that both must be answered simultaneously by a single 'death' declaration.",
      "Developing and accepting a clear, biologically grounded definition of 'organismal death' independent of organ donation needs (e.g., focusing on *loss of somatic integration despite maximal support*).",
      "A fundamental societal/policy shift away from the Dead-Donor Rule, allowing vital organ donation under strict, transparent ethical frameworks based on consent and futility *without* requiring a 'death' declaration first.",
      "Robust empirical data showing brain-dead bodies fundamentally *lack* intrinsic integration (e.g., universally rapid deterioration despite maximal support, inability to mount coordinated immune/endocrine responses)."
    ],
    "progress_outlook": "unlikely",
    "progress_reason": "The Dead-Donor Rule and the societal need for organ procurement are deeply entrenched, incentivizing the conflation of biological, ontological, and normative questions under the single, legally powerful concept of 'death', making disentanglement politically and culturally difficult."
  }
  ```

  **Key Clarifications:**

  *   **Why normative-values?** Both sides appeal to biology, but their selection of *which* biological functions are essential (consciousness/integration vs. organismal homeostasis) and their interpretation of "irreversibility" reflect prior commitments about what constitutes a living human *person* worthy of protection versus a biological system. The DCD "permanence" concession explicitly reveals a *decision* overriding biological potential.
  *   **Why verbal + different-questions?** The brain side focuses on "personhood" (consciousness) and neurological integration as the essence. The circulatory side focuses on the organism as a whole. They are defining "death" relative to different referents. "Irreversible" in brain death is treated as absolute; in circulatory death (DCD), it's pragmatically defined by intent ("we won't reverse it").
  *   **Why no hidden empirical question?** While data on integration in brain death or auto-resuscitation windows matter, agreement on such data wouldn't settle whether that state *should* be called "death" for legal/organizational purposes. The dispute over whether a brain-dead body is a "living organism" or a "perfused corpse" hinges on the *definition* of "living organism," which is philosophical/normative.
  *   **Why progress unlikely?** The current system serves powerful interests (organ supply, legal clarity, upholding the dead-donor rule). Decoupling the questions or abandoning the dead-donor rule faces immense practical and cultural hurdles. The debate persists *because* it allows society to achieve organ procurement goals while maintaining the *appearance* of adhering to a clear biological standard. Your cynicism about the biology "doing almost none of the work" is largely justified – biology provides the *vocabulary* and *boundary markers*, but the *map* is drawn by values.
