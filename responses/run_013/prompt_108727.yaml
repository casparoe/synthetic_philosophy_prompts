answer: |-
  Both approaches have merit, but your cautious approach is fundamentally more scientifically sound, especially given the over-claiming member. The group's trust-based system enables efficient data collection, which is valuable for a collaborative amateur log. However, knowledge gained solely through trusted testimony lacks the rigor of direct verification. For your re-checking to be reasonable rather than compulsive, it should be selective: apply it to uncommon species, ambiguous descriptions, sightings by the less reliable member, or when you personally need confirmation for your own learning. Blindly trusting all entries risks propagating errors. Your friend is right that demanding universal independent proof would paralyze the log, but your selective skepticism, particularly concerning potentially dubious reports, strengthens your personal understanding and contributes to the log's long-term accuracy without undermining its practical function.

