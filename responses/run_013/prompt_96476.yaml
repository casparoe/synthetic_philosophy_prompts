  My friend and I had a two-hour arguement last night about GEB and now I want to settle whether I was right. His line: the Gödel/strange-loop stuff is the deepest thing in the book. Mine: it's a pun that survives because nobody states the analogy carefully. The Gödel sentence only refers to itself because we chose a coding; the arithmetic formula itself doesn't know anything about itself, so the self-reference lives in the interpretation we impose. But Hofstadter needs the loop to be in the system, not in the reader, otherwise the leap from a system that can prove things about its own sentences to a system that is aware of itself is doing no real work. And if I'm right that it's coding-dependent, I also want to know what's left — is there a version of the analogy where a mind's self-model is likewise an artifact of some representational scheme, and that turns out to be fine? That's the part I can't see clearly. I have a one-semester independent study and need a two-page proposal out of this. Turn it into one: the question stated so it has a determinate answer, why the standard defenses of the analogy don't actually engage the coding objection, what I'd concretely do week by week, what would count as the project failing, and whether a semester is realistic or I'm kidding myself. No citations, I'll add those.
