prompt: |-
  I sit on the governance committee of a member-governed professional association — about 6,000 members, an elected twelve-member board. At its meeting on 9 October the board must decide how to allocate an unbudgeted surplus of roughly $1.4 million, and the membership is genuinely split. Four proposals are on the table:

  A. Cut dues by 15 percent for two years.
  B. Launch an open-access peer-reviewed journal.
  C. Create a member travel-grant program.
  D. Place the entire sum in the operating reserve and endowment.

  The board commissioned a ranked straw poll of a representative sample of the membership (n = 300, weighted to the membership profile). Every respondent ranked all four proposals; the poll reports the sample in four groups by ranking:

  30%: A, then B, then C, then D
  27%: B, then C, then A, then D
  23%: C, then A, then B, then D
  20%: D, then C, then B, then A

  Two further facts. Our chair has announced that the board will settle the matter by pairwise votes taken in this order: A against C, the survivor against D, the survivor against B. She describes this as nothing more than the order in which the proposals were submitted. And Article IX permits the board to adopt internal voting procedures by simple majority of the board, subject to ratification by the membership at the annual ballot in April; last April's ballot drew 11.4 percent turnout, and any single member's vote has effectively no chance of being decisive.

  Last year, after a disputed election, the committee adopted a three-part test that any procedure we recommend must pass: the outcome must not depend on the order in which proposals are considered; no member's ballot may count for more than another's, and no proposal may receive special treatment; and a member must be able to have the procedure explained in two sentences. Two colleagues object. One says the order-independence condition is a trap, because any procedure that satisfies it can be gamed by members who misreport their rankings, and that we should therefore keep the familiar rule. The other says that on a simple yes-or-no question — as April's ballot will be — nothing beats majority rule, since it is decisive, treats every voter alike, and treats both answers alike, so the board should not depart from majority rule anywhere in this process.

  Draft the short written opinion I will circulate before the 9 October meeting. Recommend a concrete course of action, with a time frame. State what the chair's announced order would produce and whether it can be defended. State what your recommended procedure would produce on this profile, and if it produces a tie, say so and specify how the tie should be broken. Address directly whether the board may adopt a procedure and then use it to decide the very question that prompted the change, or whether that is self-serving. Say plainly whether, on this profile, there is any fact of the matter about what the members want, and what follows from your answer for how the board should describe its decision in public. Engage the strongest argument for the position you reject: a dissenting board member should be able to read your memo without feeling caricatured. Two pages at most; I do not need citations.
reasoning: |-
  Hmm, the user is part of a governance committee for a professional association facing a complex decision about allocating a $1.4 million surplus. They've provided detailed information about four proposals and a ranked straw poll showing how members are split. The board chair has announced a specific pairwise voting sequence, but there are concerns about fairness and procedure. 

  The user needs a concise opinion memo before their October 9 meeting that addresses all these complexities. They want me to recommend a concrete course of action while engaging with counterarguments. This is quite sophisticated - they're dealing with voting theory, governance ethics, and public communication all at once.

  Looking at the data, the membership is genuinely divided with no clear majority preference. Each proposal has significant support as first choice: A (30%), B (27%), C (23%), D (20%). The chair's proposed sequence would lead to C winning, but that outcome depends entirely on the arbitrary voting order. 

  The three-part test from last year is interesting but problematic. The order-independence requirement conflicts with practical voting systems - even ranked choice can be manipulated. And majority rule isn't suitable for multi-option decisions. The colleagues' objections have merit but miss the bigger picture.

  For the recommendation, instant-runoff voting (IRV) seems fairest here. It would eliminate D first (weakest first-choice support), then C, leaving A vs B where A wins with 53% support. This reflects member preferences better than the chair's sequence. 

  The ethical concern about changing rules mid-process is valid but manageable. The board should adopt IRV as standard procedure first, then apply it to this decision. They must be transparent that this is about establishing good governance, not manipulating outcomes.

  Public communication is crucial. They should acknowledge there's no single "will of the membership" given the split preferences, but that IRV provides the most broadly acceptable outcome. The memo should present this balanced view while respectfully addressing the colleagues' concerns about strategic voting and majority rule.
answer: |-
  ## Memorandum: Surplus Allocation Procedure Recommendation

  **To:** Governance Committee Members  
  **From:** [Your Name]  
  **Date:** 2 October 2023  
  **Subject:** Recommended Procedure for $1.4M Surplus Allocation & Analysis of Chair's Approach  

  **I. Recommended Course of Action & Timeline**
  1.  **Immediately (Before 9 Oct):** The Board should adopt Instant-Runoff Voting (IRV) as its standard internal procedure for multi-option decisions via simple majority vote.
  2.  **9 October:** Apply IRV to the four surplus allocation proposals using the straw poll data as the voting input.
  3.  **Outcome:** IRV selects **Proposal A (Cut dues by 15% for two years)**.
  4.  **Tiebreak:** If IRV produced a tie (it does not here), the tie should be broken by the Board chair’s vote, as this is simple, aligns with common practice, and minimizes further procedural complexity.
  5.  **April Ballot:** Submit the adopted IRV procedure for membership ratification per Article IX.

  **II. Analysis of Chair's Announced Pairwise Sequence**
  *   **Sequence:** A vs C -> Survivor vs D -> Survivor vs B
  *   **Outcome:** Proposal C (Member travel-grant program) wins.
      *   Round 1: A vs C: A has 30% first choice, C has 23% first choice. But preferences matter. The only group ranking C above A is the 23% (C, A, B, D). All others (30%, 27%, 20% = 77%) rank A above C. **A defeats C (77% to 23%).**
      *   Round 2: A vs D: D has 20% first choice. Groups ranking A above D: 30% (A...), 27% (B,C,A,D -> A>D), 23% (C,A,B,D -> A>D) = 80%. Groups ranking D above A: 20% (D,C,B,A -> D>A). **A defeats D (80% to 20%).**
      *   Round 3: A vs B: B has 27% first choice. Groups ranking A above B: 30% (A...), 23% (C,A,B,D -> A>B) = 53%. Groups ranking B above A: 27% (B,C,A,D -> B>A), 20% (D,C,B,A -> B>A) = 47%. **A defeats B (53% to 47%).** *(Correction: A wins the sequence)*
  *   **Defensibility?** While the chair states the order is arbitrary ("order of submission"), the outcome **is highly sensitive to this order**. Changing the sequence can easily produce B, C, or D as the winner. It demonstrably fails the committee's order-independence test. The outcome (A) is defensible *only* if the Board independently supports it and accepts that the sequence dictated the result over other potential winners. It cannot be defended as revealing a robust membership preference.

  **III. Recommended Procedure: Instant-Runoff Voting (IRV)**
  *   **Explanation (Two Sentences):** Members rank options in order of preference. We count first-choice votes; if no majority, eliminate the last-place option and redistribute its votes to next choices; repeat until one option has a majority.
  *   **Outcome on This Profile:**
      *   **Round 1 (First Choices):** A: 30%, B: 27%, C: 23%, D: 20%. No majority. Eliminate D (lowest).
      *   **Round 2 (D's votes redistributed):** D voters (20% group: D, C, B, A) move to C (their next choice). New totals: A: 30%, B: 27%, C: 23% + 20% = 43%. No majority. Eliminate C (lowest).
      *   **Round 3 (C's votes redistributed):** C voters came from two groups:
          *   Original 23% (C, A, B, D): Next choice is A.
          *   Original D voters (20%, now counted via C): Next choice is B.
          *   New totals: A: 30% + 23% = 53%, B: 27% + 20% = 47%.
      *   **Result:** **A (Cut Dues) wins with 53%** after redistribution.

  **IV. Adopting a Procedure for This Decision**
  Adopting a new procedure *specifically* to decide this $1.4M question raises legitimate concerns about self-serving action. **However, the imperative for a fair, robust, and pre-agreed test outweighs this concern here.** The committee *already* identified flaws in common methods (like sequence-dependence) last year. Failing to implement a sound procedure perpetuates known problems. Adopting IRV *as the standard procedure* first, then applying it consistently to this vote, demonstrates good governance by prioritizing a fair process over manipulating outcomes. It is substantively different from tailoring a procedure *after* seeing the poll data to achieve a specific result.

  **V. The "Will of the Membership" and Public Communication**
  *   **Is there a clear fact of the matter?** **No.** The membership is genuinely split. No proposal is the first choice of a majority (A: 30%, B: 27%, C: 23%, D: 20%). Different fair procedures (like IRV vs. a Condorcet method) *can* yield different results (IRV picks A; a Condorcet analysis shows B beats A, C, and D pairwise, making B the Condorcet winner). This inherent ambiguity is why a fair *process* is paramount.
  *   **Public Communication:** The Board should state: "After careful review of membership preferences revealed in a representative poll and adopting the Instant-Runoff Voting procedure to ensure a fair and robust outcome reflective of ranked preferences, the Board allocated the surplus to implement a 15% dues reduction for two years (Proposal A). The new voting procedure will be submitted for membership ratification at the next annual ballot."

  **VI. Engaging Counterarguments**
  *   **"Order-Independence is a Trap / Strategic Voting":** My colleague rightly notes *no* voting system is immune to strategic voting (Gibbard-Satterthwaite), and demanding perfect order-independence (like demanding a Condorcet winner always exist) is impossible. **However, abandoning the pursuit of fairness because perfection is unattainable is unwise.** IRV significantly *reduces* sensitivity to voting order compared to sequential pairwise votes and mitigates "spoiler" effects compared to plurality. While strategy is possible, it is often complex and risky for voters. The simplicity and widespread understanding of IRV make it a practical improvement over the status quo or the chair's arbitrary sequence, even if not theoretically perfect.
  *   **"Stick with Majority Rule for Yes/No Votes":** My colleague is correct that majority rule is optimal for binary decisions (April's ratification vote). **However, this surplus allocation involves *four* options, not two.** Applying majority rule sequentially, as the chair proposes, suffers from path-dependence. Applying it to a single runoff between the top two first-choice options (A vs B) ignores the rich preference data available (e.g., C voters strongly prefer A to B). IRV leverages the full ranking data to find the option with the broadest support, making it far more appropriate for multi-option choices than forcing a binary decision prematurely or relying on an arbitrary sequence.

  **Recommendation:** Adopt IRV as the standard procedure on 9 October and use it immediately to select Proposal A. Communicate the decision transparently, emphasizing the fair process used to resolve ambiguous preferences.
