prompt: |-
  You are a philosopher of language and metaethicist whose research sits at the intersection of expressivism, the semantics of normative language, and the psychology of attitudes; you are equally comfortable in truth-conditional semantics, inferentialism, and debates about the functional role of belief. Work carefully before you answer. Begin by laying out in a few sentences the landscape as you see it and the distinctions you will need — in particular, say whether you think the standard data points below are one problem in three guises or three problems that can come apart, since that changes how your sub-questions combine. Then give your numbers.

  The proposition. Call a view *pure expressivist* if it holds that a declarative sentence containing a thin normative predicate (for example, "lying is wrong") conventionally expresses a non-belief, non-representational state — disapproval, a plan, a norm-acceptance — and does *not* express a descriptive belief with a truth-apt normative content. A pure expressivist owes an account of at least three things: (i) *negation and inconsistency*: why "lying is not wrong" is something more than the absence of disapproval, and why sincerely accepting it alongside "lying is wrong" is incoherent rather than merely a change of mind; (ii) *embedding and validity*: why arguments whose validity turns on normative sentences occurring inside conditionals, disjunctions, "unless", and "it is true that" come out valid; and (iii) *attitude and factive embeddings*: what "Sasha hopes that lying is wrong", "I doubt that lying is wrong", "she wonders whether lying is wrong", and "he regrets that lying is wrong" mean, given that hoping, doubting, wondering, and regretting take propositional objects — and that factive ones appear to presuppose the truth of their complement.

  The question. What is your credence that the Frege–Geach family of problems has a solution that is *pure expressivist* in the above sense — that is, that (i), (ii), and (iii) are jointly satisfied without the theory's assigning truth-apt descriptive content to normative sentences and without its collapsing into a form of cognitivism?

  Decompose your credence into the sub-questions it actually depends on, giving a rough probability and one line of justification for each. At minimum separate these, adding any others you think belong:

  1. Whether the negation/inconsistency problem has a solution that is not, at bottom, representationalist.
  2. Whether a uniform semantics for the embedded occurrences can preserve the validity data without importing truth-conditional content.
  3. Whether attitude and factive embeddings can be handled without treating the normative clause as a proposition with representational content.
  4. Whether the deflationary/quasi-realist manoeuvre is stable — whether combining deflationism about truth with a minimalist or functionalist account of belief really leaves the expressivist with a non-representationalist reading of normative thought, or quietly restores the descriptive content it was meant to eliminate.
  5. Whether the fallback positions (hybrid or "double-aspect" accounts) still satisfy the stated constraints, or are expressivism in name only.

  State explicitly how the sub-questions combine — which are conjunctive, which alternative, which conditionally dependent on others — and give the resulting overall number.

  Then name the single sub-question your number is most sensitive to, and say what argument or evidence would move it most. Finally: I am at 0.6 and a colleague is at 0.1, and we cannot tell whether we disagree about the substance or are simply drawing the expressivist/cognitivist line in different places. Tell us which sub-question we most likely differ on, whether our disagreement is substantive or terminological, and — if it is terminological — which precisification you take the proposition to have, and what number you would give under the other.
