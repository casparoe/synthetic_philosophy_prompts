answer: |-
  ### Landscape Analysis
  The three data points (negation/inconsistency, embedding/validity, attitude/factive embeddings) are distinct but interconnected problems arising from a unified challenge: **the compositional semantics of non-representational states**. They can theoretically come apart (e.g., a solution to negation might not resolve embedding), but they converge on the core issue of how to reconcile expressivism with logic and propositional attitude psychology. Pure expressivism must solve all three without conceding truth-apt descriptive content or collapsing into cognitivism. The key distinctions needed are:  
  - **Representationalism vs. Non-representationalism**: Whether semantics requires mind-to-world direction of fit.  
  - **Minimalism vs. Robustness**: Whether deflationary truth/belief can be "thin" enough to avoid descriptivism.  
  - **Compositionality**: How non-cognitive states combine logically (e.g., plans or norms as inferential primitives).  

  My credence that pure expressivism solves all three problems jointly is **0.01** (1%). Below, I decompose this into sub-questions, with credences and justifications. Sub-questions (1)–(5) are **conjunctive**—all must be answered affirmatively for pure expressivism to succeed—but (4) and (5) are meta-constraints that reinforce failure if negative.  

  ### Sub-Question Credences  
  1. **Negation/inconsistency without representationalism**: **0.7**  
     *Justification*: Expressivist resources (e.g., Gibbard’s plan-laden contradictions or Blackburn’s commitment-based inconsistency) can model negation as incompatible attitudes, not just absence. Attitudinal conflicts (e.g., *disapproving* vs. *tolerating* lying) generate genuine inconsistency without truth-conditions.  

  2. **Uniform semantics preserving validity without truth-conditions**: **0.3**  
     *Justification*: Inferentialist approaches (e.g., Brandom’s commitment structures) or dynamic semantics (e.g., updating acceptance states) can handle simple embeddings (e.g., modus ponens with normative conditionals). But complex embeddings (e.g., nested disjunctions or quantifiers) strain non-representational systems, risking ad hocness or silent truth-conditional smuggling.  

  3. **Attitude/factive embeddings without propositions**: **0.2**  
     *Justification*: Attitude verbs (*hope*, *regret*) psychologically presuppose representational objects. Expressivists (e.g., Schroeder) can analyze these as higher-order attitudes (e.g., "hoping that lying is wrong" = *hoping to disapprove of lying*), but factives (*regret*, *discover*) demand truth-presuppositions that resist non-representational reduction. Empirical psychology suggests propositional attitudes are cognitive defaults.  

  4. **Quasi-realism stability without collapse**: **0.25**  
     *Justification*: Deflationism (e.g., Blackburn’s minimalist truth) + functionalist belief (e.g., attitudes as roles) *appears* to avoid descriptivism, but under pressure (e.g., explaining normative disagreement or mind-independence), it often tacitly reinstates representational content. The move is rhetorically elegant but ontologically unstable—minimal truth still tracks a "fit" with reality.  

  5. **Hybrid accounts violating purity**: **0.9**  
     *Justification*: Hybrid theories (e.g., Ridge’s ecumenism or Toppinen’s belief-desire pairs) explicitly add descriptive belief components to handle embeddings, breaching the "no truth-apt content" constraint. They are expressivist-inspired but not *pure*; they concede cognitivism for logical robustness.  

  **Overall credence calculation**:  
  Since (1)–(5) are conjunctive (all must hold), multiply probabilities:  
  \[ 0.7 \times 0.3 \times 0.2 \times 0.25 \times 0.9 = 0.00945 \approx \mathbf{0.01} \]  
  *(Note: (4) and (5) are not strictly independent but constrain the solution space; even if combined differently, the product remains ~0.01.)*  

  ### Sensitivity and Evidence  
  My credence is most sensitive to **sub-question (2): embedding/validity**. If a uniform, non-truth-conditional semantics for complex embeddings (e.g., iterated conditionals or quantifiers) were demonstrated—e.g., via a complete proof-theoretic semantics for normative language—my credence in (2) could rise to 0.6, pulling the overall credence to ~0.05. Conversely, evidence that all proposed solutions covertly use truth-conditions (e.g., model-theoretic failures in dynamic systems) would drop (2) to 0.1, reducing overall credence to <0.005.  

  ### Diagnosing Your Disagreement (0.6 vs. 0.1)  
  You likely differ most on **sub-question (4): quasi-realism stability**. This is **partly terminological and partly substantive**:  
  - **Terminological element**: If "representational content" is defined *robustly* (e.g., requiring mind-independent truth-makers), quasi-realism might count as non-representational (your 0.6). If defined *minimally* (e.g., any truth-apt content is representational), it collapses (your colleague’s 0.1).  
  - **Substantive element**: Whether deflationism *succeeds* in avoiding ontological commitment (e.g., can "truth" for normative claims be purely expressive?).  
    
  **Under precisifications**:  
  - **Strict purity** (no truth-aptness whatsoever): Quasi-realism fails; credence = **0.01** (my view).  
  - **Lax purity** (deflationary truth-aptness allowed): Quasi-realism might work; credence ≈ **0.2** (if (2)–(3) improve).  
    
  **Resolution**: Your disagreement is both substantive (on quasi-realism’s coherence) and terminological (on what "representational" means). To converge, clarify the boundary: if "descriptive belief" excludes deflationary normative beliefs, your 0.6 becomes plausible; if not, your colleague’s 0.1 dominates.
