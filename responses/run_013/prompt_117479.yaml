prompt: |-
  I'm writing a chapter on Mill's case for British rule in India, and I want to read E. M. Forster's A Passage to India against that case rather than merely alongside it. Mill's justification is a trusteeship with a results test: rule over a people not yet fit for self-government is defensible only if it aims at their improvement and actually produces it — which means the ruler must both apply and pass that test himself. The failure I care about is not the familiar moral one (no consent, no representation) but what I would call an audit failure: the trustee is the sole judge of whether the improvement is happening, and the knowledge required to judge it is exactly what a distant colonial administration tends to lack, since what counts as improvement is precisely what the governed are said to be unable to assess for themselves. So treat the novel as a hearing on that claim. Which characters occupy recognizably Millian positions — Fielding's college and his faith in education and friendship, Ronny's conviction that India is a muddle to be held by force? Is there any scene in which a Millian trustee could plausibly claim to have met Mill's own test, and should the Marabar business be read as an accident inside an otherwise sound project or as a structural verdict on the claim to know? Close by saying what Forster dramatizes that Mill's arguments cannot state, and where the reading overreaches, since the mystical frame, the echo, and the closing refusal of friendship may displace the political question rather than answer it. No plot summary and no quotations from the novel; I know it.
