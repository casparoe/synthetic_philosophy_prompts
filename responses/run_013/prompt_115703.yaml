answer: |-
  As a teleosemanticist who has weathered decades of such objections, I reject your premise that selection acts *only* on the settling behaviour itself. Selection acts on the entire functional system – the producer state (the chemical detection state), the consumer system (the metamorphosis-triggering mechanism), and the linkage between them. The content of the producer state is fixed by *what the consumer system was designed by selection to respond to as an indicator under normal conditions*. In your larva, the consumer mechanism (metamorphosis) was selected for because it initiates metamorphosis *onto suitable substrate*. The detection state's biological function is to covary with the presence of *that suitable substrate* under normal conditions, thereby enabling the consumer to perform *its* function. "Concentration above threshold" is merely the proximal means, and "encrusting organism here" is a reliable correlate, but the function – hence the content – is determined by what the consumer mechanism is *supposed* to exploit the state for: indicating suitable substrate. Selection history imbues the state with the specific content "suitable substrate here" because that is the condition the entire signaling system was selected to get right.

  Regarding your homologous detector in the predator-fleeing species: the content *absolutely changes* because the biological function of the homologous state changes. The state's selection history is not merely its phylogenetic origin but its *current specific function within its containing system*. In the fleeing species, the consumer mechanism is designed by selection to trigger flight *from danger*. The homologous producer state therefore acquires the function of indicating *predator presence* under normal conditions. It is the *same physical state type* but with a *different derived proper function* due to its new role in a different selected system. This reinforces, not undermines, the core thesis: content is fixed by the specific selective history establishing *what the state is for* in its current functional context. The wiring change *is* part of the selection history that defines the state's current function. What fixes the content *is* this specific selection history – not the phylogeny of the detector alone, but the history of selection for its role in mediating a specific response to a specific condition.
