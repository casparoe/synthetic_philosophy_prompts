prompt: |-
  You are an expert in the philosophy of medicine and biology, with a specialization in the metaphysics of death and the ethics of organ procurement. I am a doctoral candidate in philosophy preparing a prospectus for a two-year dissertation, and I need your help turning a half-formed idea into a rigorous proposal. Please think carefully and work through the conceptual terrain before you commit to a framing; where a term is ambiguous, say so and disambiguate it rather than papering over it.

  My half-formed idea is this. The long-running dispute between the whole-brain criterion and the circulatory criterion is usually presented as a disagreement about biology -- which function, when it ceases, marks the death of the organism. I suspect it is at least as much a disagreement about which of two incompatible jobs the concept of death is being asked to do at once. On one reading, "dead" is a metaphysical or biological status: the organism has ceased to exist as an integrated whole. On another, "dead" is a normative gate: the point at which it becomes permissible to stop treatment, to withdraw support, or to procure organs. Contemporary practice seems to require these two roles to coincide, and I want to know whether that requirement is a discovery about the world or a stipulation that keeps generating contradictions. The recent controversies over protocols that restore circulation to organs in situ after a declaration of circulatory death, and over bodies that are maintained on ventilators for years after a brain-death determination, strike me as places where the fusion of the two roles shows its seams. I am also struck by the fact that every candidate criterion has to fix a threshold somewhere along a continuum, and I cannot tell whether such a threshold is something we discover or something we legislate.

  Turn this into a proposal with the following parts. First, state the research question so that it has a determinate answer -- I do not want a question that can be deflected with "it depends on your definition." Second, explain why the existing positions leave the question open, including what the standard biological, metaphysical, and clinical accounts each assume without arguing. Third, set out the method: what I would actually do, month by month, and why conceptual and case-based work is the right approach here rather than empirical or historical research. Fourth, say what a successful result would look like -- what would count as having shown that the two roles can be separated, or that they cannot -- and what would count as the project failing. Fifth, give an honest assessment of scope: is this two years of work, or is it either trivial or a career? Also address one obvious objection: that distinguishing the metaphysical from the normative role of "death" merely relocates the puzzle rather than dissolving it, and say how the project would respond.

  Do not include a bibliography, reading list, or citations; refer to positions and arguments by describing them, and I will supply the references myself. Write in a formal register, and begin by brainstorming two or three competing ways to frame the central question before selecting one and building the proposal around it.
reasoning: |-
  Okay, the user is a doctoral candidate in philosophy working on a prospectus about the metaphysics of death and organ procurement ethics. They've shared a half-formed idea about the whole-brain vs. circulatory death criteria dispute. They see it as not just biological disagreement but about conflicting roles of the death concept: metaphysical (organism ceasing as integrated whole) vs. normative (gate for permissible actions like organ procurement). They want help turning this into a rigorous dissertation proposal.

  First, I need to unpack their core concern. They're observing that current death criteria try to serve two functions simultaneously - declaring biological death while also authorizing medical/ethical actions. This fusion creates tensions, as seen in cases like: 1) Organ procurement after circulatory death where circulation is restored in situ (NRP), and 2) Brain-dead bodies maintained on ventilators long-term. They're essentially asking whether these roles must coincide or if they can be separated.

  The user explicitly requests:
  - A research question with determinate answer (no definitional escapes)
  - Critique of existing positions' assumptions
  - Month-by-month methodology
  - Success/failure criteria
  - Scope assessment
  - Response to potential objection about relocated puzzles

  I'm considering three possible framings for the research question before selecting one:
  1) Must the biological cessation of an organism coincide with the normative transition permitting organ procurement and treatment withdrawal?
  2) Is the current alignment between biological death and normative gate a necessary truth or contingent practical solution?
  3) Can the biological and normative concepts be decoupled without creating new problems?

  The second framing seems strongest because it forces engagement with necessity vs contingency - a metaphysical question that can't be deflected by definitions. It also directly addresses the "coincidence requirement" the user mentioned.

  For methodology, conceptual analysis will be central: examining metaphysical commitments of biological accounts, normative foundations of clinical thresholds, and how they interact. Case studies like NRP protocols and prolonged somatic support will test theoretical coherence. Monthly breakdown would involve literature review (months 1-3), conceptual mapping (4-6), case analysis (7-12), normative framework development (13-18), and synthesis (19-24).

  Success would look like demonstrating either: a) separation is possible without creating bigger problems, or b) inseparability reveals deeper ethical constraints. Failure would mean the distinction doesn't resolve tensions or produces worse dilemmas.

  Scope seems manageable in two years if focused on contemporary Western medicine. The obvious objection - that separating roles just moves the problem - can be countered by showing how clarifying distinct questions allows better solutions to each.

  The user's frustration with threshold arbitrariness is key here. They're really digging at whether death is a discovered biological fact or a negotiated boundary - and how that negotiation happens when biological continuity meets binary legal/ethical needs.
answer: |-
  Here is a rigorously structured dissertation proposal based on your insightful core idea, developed through careful conceptual disambiguation and methodological planning.

  **Brainstormed Research Question Framings:**

  1.  **Must the biological/metaphysical cessation of the human organism *necessarily* coincide with the normative threshold permitting organ procurement and withdrawal of life-sustaining treatment?** (Focuses on necessity/coincidence).
  2.  **Is the persistent conceptual fusion of biological death and normative gate in contemporary death determination a necessary truth about the world or a contingent, practically motivated stipulation?** (Focuses on fusion's nature: discovery vs. stipulation).
  3.  **Can the biological/metaphysical concept of organismic death be coherently decoupled from the normative concept authorizing specific medical actions without generating intractable ethical or practical problems?** (Focuses on possibility/consequences of decoupling).

  **Selected Research Question:**
  **Is the current alignment between the biological/metaphysical concept of human organismic death and the normative concept authorizing organ procurement and treatment withdrawal a necessary truth or a contingent practical solution?** (This framing incorporates elements of 1 & 2, demanding an answer about the *nature* of the alignment while directly addressing your core concern. It avoids deflection by asking whether the alignment *must* hold as a matter of reality or *does* hold for practical reasons, forcing engagement beyond mere definition.)

  **Why Existing Positions Leave the Question Open:**

  1.  **Standard Biological Accounts (e.g., Whole-Brain, Circulatory):** Assume without argument that *the* biological phenomenon they identify (irreversible loss of integrated function via brain failure or circulatory arrest) *is* simultaneously the point where normative permissions arise. They treat the normative gate as a direct, unproblematic consequence of the biological fact, neglecting the possibility that the biological fact might be necessary but insufficient, or that the normative gate might require additional considerations.
  2.  **Standard Metaphysical Accounts (e.g., Organism as Integrated Whole):** Focus on defining the persistence conditions for the human organism. They assume without argument that the *cessation* of the organism *must* be the point where normative permissions (like procurement) become applicable. They rarely engage with the possibility that organismic cessation might be a process without a single, sharp normative threshold, or that the normative threshold might be set earlier or later based on other values.
  3.  **Standard Clinical/Ethical Accounts:** Often take the current criteria (brain death, DCD) as given biological facts and focus on the ethical permissibility of actions *given* that death declaration. They frequently sidestep the *justification* for why *this* specific biological threshold triggers *these* specific permissions, treating it as settled rather than contingent. They also rarely question whether the biological threshold was *chosen* precisely because it aligns with the desired normative outcome (e.g., viable organs).

  **Methodology: Month-by-Month Plan (Conceptual & Case-Based Focus)**

  *   **Months 1-3: Conceptual Cartography & Literature Synthesis:** Deep dive into the core concepts: disambiguating "biological death" (organism cessation), "metaphysical death" (ceasing to exist as *this* integrated whole), "normative gate" (trigger for specific permissions like procurement/withdrawal). Map the arguments and unstated assumptions of the major positions (whole-brain, circulatory, higher-brain, organismic integration) regarding both roles. *Why Conceptual?* Essential groundwork to avoid conflation and identify the specific points of tension between the biological/metaphysical and normative concepts inherent in each position.
  *   **Months 4-6: Metaphysical & Biological Analysis:** Rigorously analyze the metaphysical commitments of the "organism as integrated whole" concept. Examine the biological evidence for integration and its loss: Is it truly binary? Is "irreversibility" a biological fact or a prognosis-dependent judgment? Critically assess claims that brain death *is* organismic death vs. claims that circulatory death *is* organismic death. *Why Conceptual?* Determining the nature of organismic cessation and whether it inherently demands a single, sharp threshold is fundamentally metaphysical and interpretive, not discoverable solely by new empirical data.
  *   **Months 7-9: Normative Analysis & Threshold Scrutiny:** Analyze the ethical justifications for using a death declaration as the trigger for organ procurement and treatment withdrawal. What values are served (autonomy, non-maleficence, utility, respect for life)? Why must these actions wait for organismic cessation? Could a different normative threshold (based on prognosis, consciousness, etc.) be justified? Examine the ethical weight placed on "irreversibility" in the normative context. *Why Conceptual?* The justification for linking specific permissions to a biological state is an ethical argument requiring normative analysis.
  *   **Months 10-12: Case Study 1 - Normothermic Regional Perfusion (NRP) & DCD Controversies:** Analyze protocols like NRP where circulation is restored *in situ* to abdominal organs *after* a declaration of death based on circulatory criteria. Does this practice expose a contradiction in the circulatory criterion (if circulation is restored, was death truly irreversible)? Or does it highlight that the declaration served the *normative gate* (permission to procure) based on a prognosis of *imminent* irreversible cessation, even if full organismic integration hasn't ceased? *Why Case-Based?* Real-world controversies provide concrete tests for the theoretical tensions, revealing how practice strains the conceptual fusion.
  *   **Months 13-15: Case Study 2 - Prolonged Somatic Support after Brain Death:** Analyze cases of bodies maintained physiologically integrated for extended periods after a brain death declaration. Does this show brain death is *not* organismic death (contradicting the metaphysical claim)? Or does it show that organismic death can be a process, and the declaration serves the *normative gate* (permitting withdrawal/procurement) based on the loss of consciousness and capacity despite residual integration? *Why Case-Based?* Demonstrates the practical consequences of the fusion, forcing confrontation with the "integrated whole" concept.
  *   **Months 16-18: Synthesizing Tensions & Evaluating the Fusion:** Systematically analyze how the case studies expose the seams in the conceptual fusion. Does successfully navigating the normative needs in these cases require implicitly prioritizing the "gate" function over a strict biological reading of death? Does maintaining a strict biological reading create normative paralysis or contradictions? Evaluate the "coincidence requirement" critically: Is it coherent? Necessary? *Why Conceptual?* Synthesizing insights from cases to evaluate the core thesis about the fused roles.
  *   **Months 19-21: Exploring Alternatives & Implications:** If the fusion is contingent, what alternatives exist? Could explicit decoupling work (e.g., a prognosis-based "imminent demise" declaration for procurement alongside a later biological death declaration)? What are the ethical pitfalls? If fusion is necessary, what does this reveal about our concepts? *Why Conceptual?* Developing the implications of the core argument.
  *   **Months 22-24: Writing, Refinement, & Defense Preparation:** Drafting dissertation chapters, refining arguments, preparing for anticipated objections.

  **Success Criteria:**

  *   **Success (Separation Possible/Contingent):** Demonstrating that the normative permissions *can* be justified independently of, or on a different threshold than, strict organismic cessation without creating worse ethical problems than the current fusion (e.g., showing how NRP or prolonged support cases are *better explained* by a decoupled view). Showing that the *only* arguments for the coincidence are practical/contingent (e.g., ensuring viability, avoiding slippery slopes) rather than necessary metaphysical truths.
  *   **Success (Fusion Necessary):** Demonstrating that any attempt to decouple the concepts inevitably leads to incoherence, unacceptable ethical violations (e.g., violating the dead donor rule in spirit, treating living humans as mere resources), or the collapse of the normative gate's authority, proving that the biological/metaphysical fact *must* ground the permission for fundamental conceptual reasons.
  *   **Failure:** The analysis concludes that the distinction doesn't resolve the core tensions; the normative problems are merely shifted to defining the new threshold without gain. Or, the project fails to provide a clear answer to the central question, leaving it as ambiguous as before. Or, the case studies are shown to be misinterpreted and don't actually challenge the fusion.

  **Scope Assessment:**

  This is a solid **two-year doctoral project**. It is **not trivial** as it tackles fundamental, unresolved conceptual tensions in a high-stakes domain using sophisticated philosophical tools applied to complex real-world cases. It is **not a career** because it has a clear, bounded central question and methodology, focused on contemporary Western medicine/philosophy. It deliberately excludes: comprehensive historical analysis of death concepts, detailed empirical study of biological integration, comparative analysis of non-Western concepts, or developing full alternative legal/clinical frameworks (though it will touch on implications for these).

  **Addressing the Key Objection:**

  *   **Objection:** Distinguishing the metaphysical and normative roles merely relocates the puzzle. You still need to define the biological threshold *for the metaphysical role* and define the normative threshold *for the gate role*. The arbitrariness problem persists; you haven't dissolved it, just moved it.
  *   **Response:** The project directly confronts this. Its core contention is that the *current* arbitrariness and contradictions *arise specifically* from demanding that a single threshold serve two distinct and potentially conflicting roles. By separating the roles:
      *   We can ask the biological/metaphysical question ("When does the organism cease?") without the distorting pressure of needing the answer to also satisfy urgent clinical/ethical needs (procurement viability, resource allocation).
      *   We can ask the normative question ("When does it become permissible to procure organs/withdraw treatment?") openly, considering *all* relevant ethical values (autonomy, justice, utility, respect) and biological facts (prognosis, potential for consciousness, degree of integration), rather than being forced to contort biology to fit a predetermined normative need under the label "death."
      *   The "arbitrariness" of a threshold might be *justified differently* in each domain. The metaphysical threshold might aim for the most conceptually coherent point of organismic cessation (even if fuzzy), while the normative threshold might be set pragmatically based on ethical consensus and practical consequences, explicitly acknowledging its contingent nature. Acknowledging this difference *is* progress, dissolving the illusion that there is a single, naturally ordained "death point" that answers both questions simultaneously. The project will rigorously test whether this separation clarifies or complicates.

  This proposal provides a clear, answerable question, identifies the gaps in existing literature, outlines a feasible and appropriate methodology, defines success/failure, justifies the scope, and addresses a major potential criticism, all centered on your original, fertile insight.
