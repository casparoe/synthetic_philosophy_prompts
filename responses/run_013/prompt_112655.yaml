  ## Probability's Circuit

  The future teems with minds beyond all count,
  A trillion lives in each unfolding age;
  Thus tiny odds to shift that vast amount
  Outweigh all present grief on history's stage.
  Ignore faint doubts: if simulations bloom,
  Their chance seems slight, a rounding error's cost.
  This lever moves the cosmos from its tomb –
  The astronomical expected value exhausts
  All lesser aims. But *if* we dwell in code,
  Where simulated stars adorn the night,
  Then this vast future that we counted, owed
  Such weight, is bound within the sim's false light.
  The same math that inflated stakes so grand
  Now severs our true reach: *we lack command*
  To shift the base reality's unseen strand.

  ---

  ### Notes on the Sonnet
  *   **Octave (Lines 1-8):** Builds the longtermist case: the vastness of the potential future (lines 1-2) means even small probabilities of influencing it (line 3) dominate present concerns (line 4). It explicitly dismisses the simulation hypothesis as a negligible probability to be set aside (lines 5-6), concluding this focus leverages immense expected value (lines 7-8).
  *   **Volta (Line 9: "But *if* we dwell in code..."):** The pivotal turn, introducing the simulation hypothesis *seriously*. The "if" signals the crucial conditional.
  *   **Sestet (Lines 9-14):** Explores the consequence: the "vast future" valued in the octave is confined within the simulation (lines 9-12). The key point (lines 13-14) is that the *same probabilistic reasoning* (line 13) that justified immense stakes now reveals our impotence concerning the *underlying* base reality – we cannot affect its "unseen strand" (line 14).
  *   **Couplet (Lines 13-14):** States plainly what fails: **our agency over the base reality's long-term future**. The concern for *a* future (the sim's) might remain, but the mechanism to influence the *real*, ultimate long-term future – the core promise of longtermism's leverage – dissolves. The focus shifts from *value* to *reach* and *control*.
  *   **Rhyme Scheme:** ABAB CDCD EFEF GG (Shakespearean).
  *   **Key Phrasing:** "This lever moves the cosmos" (longtermism's agency) vs. "we lack command / To shift the base reality's unseen strand" (the specific failure under simulation). "The same math" directly links the inflation and deflation mechanisms.
