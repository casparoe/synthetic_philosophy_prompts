answer: |-
  Here is a decision procedure grounded in the "dirty hands" literature (Walzer, Williams, Stocker) and moral residue, designed for operational use. It forces explicit confrontation with key philosophical distinctions and institutional realities.

  **The Dirty Hands Decision Procedure:**

  1.  **Concrete Harm Identification:** Does the act *directly cause* (or permit/prevent the alleviation of) significant, unjust harm to *identifiable persons or groups* (beyond generalized societal unease)? If YES, proceed. If NO, skip to Step 2. *Residue Type: Harm-to-Persons.*
  2.  **Norm/Role Breach Identification:** Does the act constitute a clear violation of a fundamental ethical norm (e.g., promise-keeping, truth-telling) or a core duty of the ministerial role/office (e.g., accountability to Parliament, upholding the law impartially)? *Residue Type: Norm/Role-Breach.*
  3.  **Necessity & Last Resort:** Is the act genuinely *necessary* to prevent a significantly greater, specific, and imminent harm (beyond mere political inconvenience)? Have all *feasible and materially less norm-violating alternatives* been exhausted or credibly assessed as ineffective? *Judgment Call: "Genuine necessity" is often contested.*
  4.  **Justification vs. Excuse:** Can the act be presented as *the right thing to do, all things considered* (Justification), despite the cost? Or is it only *understandable/forgivable given the impossible pressure* (Excuse), meaning it remains *wrong* but the actor shouldn't be fully blamed?
      *   *Justification Claim:* Requires strong evidence for Step 3. Residue stems primarily from the *harm* itself (Step 1), even if necessary. Less personal "dirt."
      *   *Excuse Claim:* Admits the act *was* wrong. Residue stems strongly from the *breach* (Step 2) and the *agent's complicity* in wrongdoing. Heavy personal "dirt." *Judgment Call: This is the core philosophical pivot.*
  5.  **Agent & Delegation:**
      *   *Individual Minister:* The Minister's hands bear the primary residue.
      *   *Collective Decision (Cabinet/Committee):* Residue is diffused but *not dissolved*. All formal participants share responsibility; the Minister retains residue as the responsible officeholder. Minutes should reflect the ethical tension.
      *   *Clean Delegation?* Residue *cannot* be fully delegated away by ordering a subordinate to perform the *wrongful act itself*. The orderer shares the residue. Delegation is only "clean" for *merely costly* acts (see Verdicts).
  6.  **Precedent & Recording:**
      *   What specific principle or permission does this decision establish for *future* Ministers/officials?
      *   How narrowly or broadly is this precedent framed? (e.g., "immunity for ceasefire only with X safeguards" vs. "immunity deals acceptable").
      *   *Where Recorded:* Must be recorded *internally* in a form retrievable for future ethical review/precedent tracking (e.g., annotated decision memo, specific registry). *Public recording* of the dirty nature is usually impossible, creating institutional residue.
  7.  **Residue & Discharge:** If proceeding, what *specific* moral residue remains?
      *   Harm-to-Persons: What is owed to victims? (Acknowledgment? Compensation? Future commitment?) Can it *ever* be discharged?
      *   Norm/Role-Breach: What repairs the breach? (Apology? Restitution? Institutional reform? Personal atonement?) Is discharge possible?
      *   *Judgment Call: Defining discharge is inherently speculative and contested.*
  8.  **VERDICT:**
      *   **REFUSE:** Fails Step 3 (not necessary/last resort) OR harm/norm violation is so severe it outweighs any claimed benefit, regardless of justification/excuse arguments.
      *   **AUTHORIZE (Merely Costly):** Significant negative consequences (political, financial, operational) but *no* significant Harm-to-Persons (Step 1) AND *no* core Norm/Role-Breach (Step 2). Residue is practical/political, not moral. Delegation *is* clean.
      *   **AUTHORIZE (Dirty Hands):** Passes Steps 1 or 2 AND 3. Must explicitly state: (a) Justification OR Excuse; (b) Primary Residue Type(s) & Source; (c) Hypothetical Discharge Path(s); (d) Agent Bearing Residue; (e) Precedent & Recording Plan.
      *   **SEND BACK (Values Question):** Necessity (Step 3) is plausible but highly contested *and/or* the Justification/Excuse (Step 4) hinges entirely on a fundamental value trade-off where reasonable people acting in good faith can profoundly disagree (e.g., how much truth can be sacrificed for security?). The procedure cannot resolve the core conflict.

  **Where it Misfires:**

  1.  **"Necessity Theater" (Step 3):** You'll be pressured to accept flimsy "last resort" arguments. The procedure forces articulation but can't guarantee rigor.
  2.  **Justification/Excuse Sleight of Hand (Step 4):** Claiming "justification" can become a convenient way to avoid admitting wrongdoing. The procedure demands you pick one, but self-deception is easy.
  3.  **Defining Discharge (Step 7):** This is often aspirational nonsense. Saying "future reform discharges it" is easy; achieving it is hard. The value is in forcing the question, not the answer.
  4.  **Precedent Creep (Step 6):** Future actors will stretch the precedent. Recording helps but can't prevent misuse.
  5.  **Institutional Residue Blindspot:** The procedure focuses on the *Minister's* hands. It doesn't fully capture how repeated DH decisions corrupt the *institution itself*, even with "clean" delegation.
  6.  **The Unforeseen Harm:** You can only assess *foreseeable* harms (Step 1). Acts can cause unforeseen, catastrophic harm years later.

  **Applying the Procedure:**

  **1. Misleading Parliament about Withdrawal Timing (to protect evacuation):**

  *   **Step 1 (Harm):** YES. Harm to democratic process, public trust, specific MPs' ability to scrutinize. *Harm-to-Persons residue.*
  *   **Step 2 (Norm/Role):** YES. Core Ministerial/Political norm: Truthfulness to Parliament. *Norm/Role-Breach residue.*
  *   **Step 3 (Necessity):** Plausible *if* intelligence strongly suggests disclosure *directly* jeopardizes specific evacuees. Requires proof alternatives (vague statement, delayed answer) fail.
  *   **Step 4 (J vs. E):** **Excuse.** Lying to Parliament is a profound breach. It's hard to claim *justified* (the right thing). It might be *excusable* to save lives under duress. *Heavy residue from breach.*
  *   **Step 5 (Agent):** Minister's hands dirty. Collective decision diffuses but doesn't remove it.
  *   **Step 6 (Precedent):** Establishes: "Misleading Parliament permissible if intelligence shows direct, imminent threat to life during evacuation." Record internally with intelligence assessment justification. Highly dangerous precedent.
  *   **Step 7 (Residue/Discharge):** Residue: Breach of democratic trust. Discharge? Requires eventual private confession/apology to Parliament leadership if possible, or lifelong burden of the lie. Public discharge likely impossible without scandal.
  *   **VERDICT:** **AUTHORIZE (Dirty Hands - Excuse).** Residue: Norm/Role-Breach (lying to Parliament). Requires Excuse (saving lives under duress). Minister bears residue. Precedent recorded narrowly. *(You may dislike: It forces admitting the lie is wrong, not justified; discharge is near-impossible; precedent is toxic).*

  **2. Granting Militia Leader Immunity for Ceasefire:**

  *   **Step 1 (Harm):** YES. Severe harm: Denies justice to victims of the militia's crimes. Reinforces impunity, harming rule of law. Direct harm to *identifiable victims.* *Harm-to-Persons residue (primary).*
  *   **Step 2 (Norm/Role):** YES. Core norms: Justice, Rule of Law. Ministerial role: Upholding justice. *Norm/Role-Breach residue.*
  *   **Step 3 (Necessity):** Plausible *if* ceasefire saves many lives *now* and credible intelligence says *only* immunity secures it AND conflict is truly intractable otherwise. Extremely high bar.
  *   **Step 4 (J vs. E):** **Excuse (at best).** Trading justice for peace is arguably *always* a wrong to victims. Impossible to claim justified (the right thing) for victims. Might be excusable as the "least awful" choice. *Very heavy residue from harm and breach.*
  *   **Step 5 (Agent):** Minister's hands dirty. Collective decision (e.g., NSC) diffuses responsibility but Minister retains primary residue.
  *   **Step 6 (Precedent):** Establishes: "Immunity for atrocity perpetrators permissible for ceasefires deemed vital." Record internally with justification. Extremely damaging precedent; signals atrocity can be profitable.
  *   **Step 7 (Residue/Discharge):** Residue: Denial of justice to victims; damage to rule of law. Discharge? Requires ensuring the peace leads to long-term stability/justice (hard); reparations fund? Permanent burden of injustice.
  *   **VERDICT:** **REFUSE** (if necessity argument weak) or **AUTHORIZE (Dirty Hands - Excuse)** (if necessity compelling). Residue: Primarily Harm-to-Persons (denied justice) & Norm-Breach. Requires Excuse (saving lives outweighs justice *in this extreme case*). Minister bears heavy residue. Precedent highly dangerous. *(You will dislike: Justification is impossible; excuse feels weak; residue is immense and permanent; precedent is awful).*

  **3. Closing Hospital Against Clinicians' Advice to Keep Others Open:**

  *   **Step 1 (Harm):** YES. Harm to patients relying on the closed hospital (longer travel, disruption, potential loss of service). Harm to staff (job loss, morale). *Harm-to-Persons residue.*
  *   **Step 2 (Norm/Role):** **DEBATABLE / POTENTIALLY NO.** Ministerial role involves making tough resource allocation decisions based on broader evidence. Ignoring clinical advice is *risky* and *potentially unwise*, but not necessarily a core *ethical breach* of the role if done transparently for systemic reasons. Breach of *procedural* norm (consultation)? *Minimal Norm/Role-Breach residue, if any.*
  *   **Step 3 (Necessity):** Key Question. Is closure *necessary* to prevent imminent collapse of the wider system and greater harm? Requires robust, independent analysis proving the "keep two open" plan is sound and the *only* viable path.
  *   **Step 4 (J vs. E):** **Justification.** If necessity is proven, this is a *tragic but justified* allocation decision for the greater health of the system. Not an *excuse* for wrongdoing. Residue stems from the *harm*, not a breach.
  *   **Step 5 (Agent):** Minister's hands bear the residue from the harm. Delegation to health authority is cleaner *if* the decision follows due process based on their analysis.
  *   **Step 6 (Precedent):** Establishes: "Hospital closures justified against local clinical advice when robust system-wide analysis shows clear net benefit to population health." Record the analysis and decision rationale publicly/transparently.
  *   **Step 7 (Residue/Discharge):** Residue: Harm to affected patients/staff/community. Discharge: Mitigation plan (e.g., enhanced transport, alternative services, support for staff), transparency, monitoring outcomes, successful operation of the remaining system.
  *   **VERDICT:** **AUTHORIZE (Merely Costly)** *if* Step 2 holds (no core breach) and necessity proven. **AUTHORIZE (Dirty Hands - Justification)** *if* you judge ignoring clinical advice *is* a significant role breach (e.g., violating a duty to defer to clinical safety judgments). *(You may dislike: Calling it "Merely Costly" feels cold to affected people; if DH, claiming "Justification" for overriding clinicians is contentious).*

  **Conclusion:** This procedure forces you to dissect the ethical anatomy of each decision, explicitly confront justification vs. excuse, assign residue, and confront precedent. Its weaknesses lie in the inherent subjectivity of necessity, justification, and discharge, and its potential blindness to long-term institutional corrosion. It won't make the choices easier, but it will make your reasoning – and the inescapable burdens – starkly clear for your Minister and any future inquiry. Use it rigorously, document your application of each step, and expect the DH verdicts to leave a bitter taste – that's the point of "dirty hands."
