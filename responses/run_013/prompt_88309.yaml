  - Militia immunity: direct harm to victims, norm breach (impunity). Excuse maybe, but heavy residue. Precedent dangerous. 
  - Hospital closure: harm to patients, but perhaps justified by greater good. Less residue if clinicians consulted. 

  I should flag that the hospital case might unexpectedly lean toward "costly" if alternatives exist, which the user might dislike. Also, the militia case's excuse argument could feel unsatisfying—that's intentional in dirty hands theory. 

