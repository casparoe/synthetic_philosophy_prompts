  Hmm, the user's scenario involves real-world pressures where decisions could resurface in public inquiries. They need something practical but philosophically robust. The mention of moral remainder suggests they're familiar with debates like Williams and Walzer. The three test cases—misleading parliament, militia immunity, hospital closure—are classic dirty hands examples. The user explicitly asks for unvarnished verdicts, so I shouldn't soften critiques.

  First, I should structure the procedure into clear steps. Start with harm assessment: who suffers concrete harm? Then norm/role breaches. Next, necessity and alternatives—forcing justification. The justification vs. excuse distinction is crucial here; it affects residue. Collective responsibility needs addressing: who bears the dirt? Precedent analysis is vital for institutional impact. Finally, the four verdicts with residue statements.

  But where will this misfire? The harm/norm distinction might blur in systemic cases. Justification vs. excuse is philosophically thorny—Walzer vs. utilitarians. Precedent tracking is administratively hard. And some cases will inevitably be messy, pushing toward "values question" by design. The user knows this but wants transparency.

  For the test cases: 
