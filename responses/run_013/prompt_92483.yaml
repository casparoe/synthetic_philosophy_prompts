prompt: |-
  I'm putting together some prompts on philosophy-of-time and language stuff and this one keeps eating my weekends. I need a number out of you, not a "well it depends what you mean by true." Here's the exact claim, stated as tight as I can. Call it PRE-TRUTH. PRE-TRUTH says: even if the future is genuinely open -- tomorrow's sea battle is not settled by the present state of the world plus the laws -- the sentence "there will be a sea battle tomorrow," said today, is already determinately true or determinately false, because whether it's true depends only on what happens, and what happens is a fact about the world even if it hasn't happened yet. So the openness of the future doesn't by itself cost you bivalence.

  Give me your credence in PRE-TRUTH, and then the decomposition -- the sub-questions it actually rides on, a rough number and one line of justification for each, and how they combine. The ones I can see: (a) is truth a correspondence relation that needs some presently-existing fact to correspond to (presentism vs. eternalism vs. growing block, whatever ontology you actually hold); (b) is "the future is open" even the same thing as "future contingents lack a truth value," or are those two seperate axes; (c) can you keep classical logic -- bivalence, excluded middle -- with a supervaluational or otherwise gappy semantics for future-tensed sentences; (d) can you have a determinate truth value without a truthmaker, i.e. is the truthmaker principle something you actually accept; (e) does a perfect predictor or God's foreknowledge change the analysis, or is it a red herring. Add any term you think I'm missing.

  Then fold in one wrinkle I care about: suppose the battle's outcome hinges on a genuinely indeterministic quantum event. Does that count as the future being "open" in the sense PRE-TRUTH denies, or is quantum indeterminism the wrong kind of unsettledness -- random, but still not-yet-true? I want that handled inside one of the sub-questions, not tacked on as a footnote.

  Finish with: which sub-question the final number is most sensitive to, what argument or bit of reasoning would move it the most, and whether you think any part of this is verbal rather than substantive. If some of it is verbal, still give me the number, and say which reading you're pricing.
