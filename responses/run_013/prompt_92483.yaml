answer: |-
  Here's my structured analysis of PRE-TRUTH, with a clear credence and decomposition, incorporating your quantum wrinkle:

  **Final Credence in PRE-TRUTH: 65%**  
  *(Leaning "yes", but with significant pressure from ontology and truthmaking)*

  **Decomposition & Sub-Questions:**

  1.  **Ontological Commitment Requirement (Truthmakers?) (40%)**
      *   **Question:** Does a sentence like "There will be a sea battle tomorrow" require an *existing (presently or timelessly)* truthmaker – a fact, state of affairs, or event – *right now* to be determinately true or false? Or can truth supervene solely on how the future *will* unfold, even if that unfolding isn't yet part of reality?
      *   **Credence PRE-TRUTH Hinges on This:** 25% (Critical drag if "yes" required)
      *   **Justification:** Presentism/Growing Block theories struggle here – if only the present/past exists, there's no fact *now* for the future-tensed proposition to correspond to. Eternalism (all times equally real) easily supports PRE-TRUTH. Truthmaker Maximalism (every truth needs a maker) strongly opposes PRE-TRUTH under presentism. Deflationism about truth or rejection of truthmaker maximalism supports PRE-TRUTH.
      *   **Quantum Wrinkle:** Irrelevant to the core issue. Whether unsettledness is quantum or classical, the *lack of a present truthmaker* is the problem under presentism.

  2.  **Open Future ≠ Truth-Value Gaps (Separability) (80%)**
      *   **Question:** Is the claim "the future is open" (indeterminism, multiple possibilities genuinely accessible) logically distinct from the claim "future contingent statements lack a determinate truth value"? Can one hold bivalence *and* an open future?
      *   **Credence PRE-TRUTH Hinges on This:** 70% (Critical support if "yes")
      *   **Justification:** PRE-TRUTH *is* the claim that these are separable. Philosophers like Barnes & Cameron argue openness is metaphysical (branching possibilities), while truth is semantic and depends on the *actual* branch that obtains, even if it's not determined *which* one that is yet. Rejecting this link (e.g., Aristotle, Łukasiewicz) sees openness as *entailing* truth-value gaps. PRE-TRUTH requires this separability.
      *   **Quantum Wrinkle:** Directly handled. PRE-TRUTH says quantum randomness *is* the right kind of unsettledness for an open future, but insists the statement's truth value is still determined by the single outcome that *will* occur, even if which outcome occurs is undetermined now. Randomness doesn't make the proposition indeterminate, only unpredictable.

  3.  **Semantic Tool Availability (Supervaluation/Gaps?) (35%)**
      *   **Question:** Can coherent semantics preserve classical logic (bivalence, excluded middle) for future contingents without committing to their *determinate* truth/falsity *now*? (e.g., via supervaluation over possible futures or truth-value gaps).
      *   **Credence PRE-TRUTH Hinges on This:** 30% (Moderate drag if "yes")
      *   **Justification:** Supervaluationism allows "will P" to be supertrue (true in all futures) or superfalse (false in all futures), but *indeterminate* (true in some, false in others) otherwise. This rejects bivalence *for determinate truth values now* while keeping excluded middle valid but not sound for contingents. PRE-TRUTH rejects such gappy/indeterminate semantics for future contingents, insisting they *are* determinately true or false *now*. If supervaluation is viable, PRE-TRUTH is less necessary.
      *   **Quantum Wrinkle:** Supervaluation handles quantum contingents naturally ("will decay" is indeterminate if decay is probabilistic).

  4.  **Truthmaker Principle Acceptance (50%)**
      *   **Question:** Do you endorse Truthmaker Maximalism (every true proposition requires a truthmaker – some existing entity or state of affairs that makes it true)?
      *   **Credence PRE-TRUTH Hinges on This:** 20% (Drag if accepted, esp. under presentism)
      *   **Justification:** Strongly conflicts with PRE-TRUTH under presentism (no future truthmakers exist). Less problematic under eternalism (future truthmakers exist timelessly). Deflationists about truth or those rejecting maximalism have no issue with PRE-TRUTH lacking *current* truthmakers.
      *   **Quantum Wrinkle:** Underscores the problem for maximalists: what *present* entity could make a quantum future contingent true?

  5.  **Divine Foreknowledge/Predictors (Red Herring) (90%)**
      *   **Question:** Does the possibility of a perfect predictor (or God's foreknowledge) imply that the future *must* be determinate/settled, thus supporting PRE-TRUTH?
      *   **Credence PRE-TRUTH Hinges on This:** 5% (Minimal impact)
      *   **Justification:** PRE-TRUTH claims bivalence holds *even if* the future is open and unsettled. A predictor knowing the outcome would *entail* the future is settled, making PRE-TRUTH trivially true but missing its core point – which is to assert bivalence *without* settling. The *possibility* of PRE-TRUTH is independent of whether predictors *actually* exist. It's a distraction for evaluating PRE-TRUTH itself.

  **Combining the Credences:**  
  PRE-TRUTH requires **Separability (High Confidence)** to be coherent. It faces its biggest challenge from **Ontology/Truthmakers (Low Confidence)** under presentist or growing-block views demanding present truthmakers. **Semantic Tools (Moderate Confidence)** offer alternatives that undermine PRE-TRUTH's necessity. **Truthmaker Acceptance (Neutral)** amplifies the ontological challenge. **Predictors (Irrelevant)** don't help. The 65% reflects strong support from Separability overcoming significant (but not decisive) pressure from Ontology/TM under non-eternalist views, with semantics reducing necessity.

  **Sensitivity & Key Lever:**  
  *   **Most Sensitive To:** **Sub-Question (b) - Open Future ≠ Truth-Value Gaps (Separability)**. If this link *cannot* be broken – if openness *entails* lack of truth value – PRE-TRUTH collapses (credence → ~10%). Conversely, if this separation is solid (e.g., via the "actual future" argument), PRE-TRUTH gains strong footing (credence → 80%+), making the ontological fight more manageable.
  *   **Argument That Moves the Needle Most:** A compelling argument showing that **truth fundamentally requires *determinacy* in the world *at the time of utterance***, not just eventual factuality. If "what happens" only becomes a *determinate* fact *when* it happens, then prior to that, the proposition cannot be determinately true/false, even if it *will* be one or the other. This directly attacks the core justification of PRE-TRUTH and strengthens the link between openness and truth-value gaps (hitting (b) and supporting (c)).
  *   **Verbal vs. Substantive:** A significant component is **verbal**, hinging on definitions:
      *   **"Determinately True/False"**: Does this mean *possessing a truth value fixed by current reality* (substantive), or simply *being in fact either true or false* (can be verbal if "in fact" is timeless)? PRE-TRUTH often equivocates on this. I'm pricing the **substantive reading**: truth value is fixed *now* (requires current ontological grounding or determinacy), not just that it *will* be fixed later.
      *   **"Open Future"**: Does it mean *metaphysical indeterminism* (multiple real possibilities) or *semantic indeterminacy* (no truth value)? PRE-TRUTH assumes the former is separable from the latter. If "open" is *defined* as lacking truth values, it's tautologically false (verbal). I'm assuming the **metaphysical reading** of "open".
      *   **"Depends only on what happens"**: Is this a claim about *truth conditions* (timeless) or *truthmaker grounding* (temporal)? PRE-TRUTH conflates them. I'm interpreting it as requiring the truth conditions to be *currently grounded* (substantive).
