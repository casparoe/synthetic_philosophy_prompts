  The key issues are: reconciling the fish/vegetative human disparity, explaining the bee/thermostat difference, and addressing edge cases. The user values both behavioral evidence and biological continuity, as seen in their hesitation about the decorticated animal. They might also be wrestling with speciesism or inherent human value versus acquired traits.

