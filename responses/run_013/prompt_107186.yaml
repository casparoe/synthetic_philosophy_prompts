  I should emphasize that the temporal boundaries are indeed defined by the narrative construction, not by stimulus timing. The ambiguity in "timing of experience" is inherent—conscious time isn't strictly real-time. The Orwellian simplicity is illusory because they have to explain why some edits affect memory but not the probe report. The Stalinesque account is more parsimonious by treating all elements as part of a unified retro construction.

