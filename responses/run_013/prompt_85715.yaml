  ### Key Notes on the Tree  
  - **Unseparated Leaves**: The **Imperative View** and **Intrinsic Feel View** both land in the "asymbolic pain is still bad" branch but aren’t further split. They can be distinguished by Q3 (intrinsic feel vs. imperative content), but the tree prioritizes accessibility.  
  - **Unexplored Branches**:  
    - *None*: All major positions are covered.  
    - *Incoherent/Unattractive*: A view claiming "badness requires aversion" while also asserting "asymbolic pain is bad" is incoherent (rejected by Q1).  
  - **Sensory/Affective Distinction**:  
    - Only the **Affective Component View** relies on it.  
    - Other views function without it (noted per leaf).  
  - **Your Goals Addressed**:  
    - (1) The **Q1 fork** cleanly splits "asymbolic pain isn’t bad" (top branch) vs. "it’s still bad" (bottom branch).  
    - (2) **Q1** and **Q2** explicitly probe whether badness requires being "bothered."  
    - (3) **Q1** isolates whether asymbolia affects *badness* (top branch) or just *motivation* (bottom branch).  

  This tree fits on one page and uses American English. Students can self-navigate without prior expertise, and leaves map to standard positions in pain philosophy.
