prompt: |-
  I'm a PhD student in cognitive science working on analogy and concept formation, and before I build one more implementation I want the specification. My working microdomain is a small one I invented: routes written as strings of compass moves, where a task has the form N N E → N E E and asks for the analogous completion of a fresh route. The interest of the domain is that solving it requires slipping from one description of the input to another — a run of like moves, a turn, a rotation of the whole path, a single anomalous move — and the best slip can turn on one element; worse, when a route is symmetric, two descriptions coincide and there is no fact of the matter about which description the solver used. A single pair like N N E → N E E already supports several incompatible readings at once.

  Give me the desiderata any theory of conceptual slippage in a microdomain of this kind would have to satisfy: the phenomena it must reproduce (I care about reproducing the errors solvers make and the cases where they disagree about the intended reading more than about returning the answer I had in mind), the distinctions it must not collapse — between the best slip and a merely available one, between an ambiguous stimulus and an underdetermined rule, between a slip forced by the task and one chosen by the solver — and the constraints it must not violate. Say which requirements are genuine and which are the parochial preferences of one research tradition, flag any pair that looks jointly unsatisfiable, and identify the single requirement that does the most to exclude candidate theories of analogy-making. Stop at the criteria; I will handle the scoring.
reasoning: |-
  We are to provide desiderata for a theory of conceptual slippage in a given microdomain of route analogies. The domain involves routes as strings of compass moves (like "N N E") and analogical tasks of the form "input_route → output_route" (e.g., "N N E → N E E") and then a new input route for which we must produce an analogous output.

  Key phenomena the theory must capture:

  1. **Multiple Incompatible Readings**: A single input-output pair (like "N N E → N E E") must support several interpretations (e.g., seeing the input as two norths then an east, and the output as one north then two easts; or seeing the input as two norths and then a turn to east, and the output as one north and then a turn to east and then another east? or perhaps a rotation? etc.). The theory must account for the existence of these multiple readings and how they lead to different completions.

  2. **Errors and Disagreements**: The theory must reproduce the errors that solvers make and the cases where solvers disagree on the intended reading. This is more important than just returning the "correct" answer (as there may not be one).

  3. **Slippage Necessity**: The theory must require a slippage from one description to another (e.g., from a run of like moves to a turn, or to a rotation, etc.). The domain is designed such that without such a slippage, the analogy cannot be solved.

  4. **Sensitivity to Minor Changes**: The theory must account for the fact that a single element can change the best slip (e.g., if a route is symmetric, two descriptions coincide and there is no fact of the matter which one was used; but if one element is changed, then one description becomes favored).

  5. **Ambiguity vs. Underdetermination**: The theory must distinguish between:
     - **Ambiguous stimulus**: The input can be parsed in multiple ways (e.g., a route might be seen as two runs or as a run and then a turn) and each parsing leads to a different rule.
     - **Underdetermined rule**: Even when the parsing is fixed, the rule for transformation might be underdetermined (e.g., if the rule is to replace the second move by two moves in the same direction? but then which direction?).

  6. **Forced Slip vs. Chosen Slip**: The theory must distinguish between:
     - A slippage that is forced by the task (i.e., without that slippage there is no consistent rule) and one that is chosen by the solver (i.e., there are multiple possible slippages and the solver picks one arbitrarily or based on preferences).

  7. **Best Slip vs. Available Slip**: The theory must not collapse the distinction between the best slip (the one that leads to the most coherent, simple, or contextually appropriate rule) and a merely available slip (one that is possible but leads to a less coherent rule).

  Constraints the theory must not violate:

  8. **Compositionality**: The moves are atomic and the route is a sequence. The theory must respect the atomic nature of the moves and the sequential order.

  9. **Cognitive Plausibility**: The mechanisms of slippage and rule formation must be cognitively plausible (e.g., not requiring exhaustive search over an infinite space of rules, but rather using heuristics that humans might use).

  10. **Handling Symmetry**: When a route is symmetric, the theory must allow that two (or more) descriptions coincide and thus the rule is uniquely determined even though the underlying descriptions are multiple. In such a case, the solver should not be forced to choose arbitrarily.

  11. **Inherent Subjectivity**: The theory must account for the inherent subjectivity in the task: different solvers may have different background knowledge or preferences that lead them to choose different slippages.

  Now, we must also flag:

  - **Parochial preferences**: Some requirements might be specific to certain research traditions. For instance, the emphasis on errors and disagreements is typical of cognitive science and psychology, whereas an AI approach might focus more on getting the "right" answer. Similarly, the requirement of cognitive plausibility (e.g., limited computational resources) is more central in cognitive modeling.

  - **Jointly unsatisfiable pairs?** 
    - It might seem that requiring both the distinction between forced and chosen slips and the requirement of cognitive plausibility (which might involve heuristics that don't always detect forced slips) could be in tension. However, they are not necessarily unsatisfiable: the theory might have a mechanism that detects when a slip is forced (by the absence of any rule without slippage) and then also allows for choices when multiple slips are available. But if the theory must always perfectly distinguish forced from chosen, and if in the ambiguous case it is impossible to know whether a slip was forced or not (because the solver might not have found a rule without slippage even if one exists), then there could be a problem. We must note that the theory should account for the solver's perspective: a slip is forced for a solver if they cannot find a rule without it, even if one might exist.

    - Another potential conflict: the requirement to handle multiple incompatible readings and the requirement to have a best slip. In symmetric cases, there is no best slip? But note: in symmetric cases, the multiple readings lead to the same rule. So the best slip is not required to be unique? The theory must allow that sometimes there is no unique best slip (and then the solver chooses arbitrarily) and sometimes there is.

  - **The single requirement that does the most to exclude candidate theories**: The necessity of slippage (point 3) and the fact that the best slip can turn on one element (point 4) together are very demanding. However, the requirement that does the most to exclude candidate theories is likely **the reproduction of errors and disagreements**. Many theories of analogy (especially formal ones) aim for a unique solution and do not account for individual differences and errors. A theory that only outputs the "correct" answer (as per the designer) would fail on this requirement.

  Desiderata list:

  1. **Reproduce multiple interpretations**: The theory must allow that a single stimulus can be interpreted in multiple ways, leading to different rules and thus different completions.

  2. **Account for errors and disagreements**: The theory must predict when solvers will make errors (i.e., produce a completion that is not the one the experimenter had in mind, but is consistent with an alternative interpretation) and when they will disagree (i.e., produce different completions due to choosing different interpretations).

  3. **Require slippage**: The theory must involve a slippage (change in the description) to solve the analogy.

  4. **Sensitivity to minor changes**: The theory must be sensitive to small changes in the input (e.g., one move) that can change the preferred slippage.

  5. **Distinguish ambiguity from underdetermination**: The theory must separate the case where the input can be parsed in multiple ways (ambiguity) from the case where the rule is not fully determined even given a parsing (underdetermination).

  6. **Distinguish forced slippage from chosen slippage**: The theory must account for when a slippage is necessary to find any rule (forced) and when it is one among several possibilities (chosen).

  7. **Distinguish best slip from available slips**: The theory must not only generate possible slips but also rank them (by simplicity, coherence, etc.) so that the best slip can be identified, but without collapsing the distinction (i.e., the theory must still acknowledge the existence of less good slips).

  8. **Respect compositionality**: The theory must treat the route as a sequence of atomic moves and build descriptions from these.

  9. **Cognitive plausibility**: The mechanisms must be computationally feasible in a way that mirrors human cognition (e.g., using limited working memory, pattern matching, and heuristic search).

  10. **Handle symmetry**: The theory must account for symmetric routes by recognizing that multiple descriptions lead to the same rule, so the solver does not need to choose arbitrarily.

  11. **Account for subjectivity**: The theory must allow that individual differences (e.g., in background knowledge, attention, or preferences) can lead to different slippages and hence different completions.

  Parochial preferences:

  - The emphasis on errors and disagreements (point 2) and cognitive plausibility (point 9) are more central to cognitive science and psychology than to other fields (like pure AI). A theory from an AI perspective might focus on optimal performance and not care about errors.

  Jointly unsatisfiable? 

  - We identified a potential tension between the forced/chosen distinction and cognitive plausibility: a solver might not have the computational resources to determine if a slip is forced (i.e., if there is no rule without slippage) and might sometimes choose a slip when one is forced and sometimes not. The theory must account for the fact that solvers might not always detect forced slips.

  - Also, the requirement to have a best slip (point 7) and the fact that in symmetric cases there is no unique best description (but the rule is the same) might be in tension with the idea of ranking slips. However, the ranking might lead to multiple slips at the top. So it is not unsatisfiable.

  The requirement that does the most to exclude candidate theories is **point 2 (account for errors and disagreements)**. Many formal theories of analogy (e.g., structure mapping) aim for a normative account and do not naturally predict errors and individual differences. This requirement forces the theory to model the variability in human performance.
answer: |-
  Below are the desiderata for a theory of conceptual slippage in your compass-move microdomain, structured to address phenomena reproduction, critical distinctions, constraints, and meta-commentary on their origins and feasibility. I focus on criteria relevant to your goals (errors, disagreements, slippage mechanics) while flagging parochial biases. These desiderata are grounded in cognitive science's emphasis on human performance variability, but I note where traditions diverge.

  ### **Phenomena to Reproduce**  
  1. **Multiple Coexisting Interpretations**: The theory must allow a single input (e.g., `N N E → N E E`) to support at least three distinct, internally consistent readings (e.g., "run compression," "turn insertion," "path rotation"). It should not privilege one as "correct" but treat all as latent possibilities.  
  2. **Error Patterns**: Reproduce systematic errors (e.g., solvers producing `N E` for `N E → ?` after seeing `N N E → N E E`, misreading "run compression" as "move deletion"). Errors must arise from plausible slippages, not random noise.  
  3. **Solver Disagreement**: Predict when solvers will bifurcate (e.g., 50% choose `E E` and 50% choose `N E` for a symmetric input like `N E → ?` after `E N → N N`). Disagreement rates should correlate with ambiguity strength.  
  4. **Slippage Dependency**: Force solvers to *require* a slippage (e.g., from atomic moves to a higher-order unit like "a turn") to solve any instance. No solution should be reachable via direct feature mapping alone.  
  5. **Sensitivity to Microchanges**: Model how one-move alterations (e.g., `N N E` vs. `N N N E`) flip the dominant slippage (e.g., from "run detection" to "anomaly isolation").  
  6. **Symmetry Ambiguity**: Handle cases where symmetric routes (e.g., `N E S W`) make two descriptions computationally equivalent (e.g., "two perpendicular pairs" vs. "a loop"), causing solvers to report identical answers via different latent slippages.  

  ### **Critical Distinctions to Preserve**  
  7. **Best Slip vs. Available Slip**:  
     - **Best slip**: The most parsimonious, contextually coherent slippage (e.g., inferring "replace a run of N with a run of E" for `N N E → E E E`). Must be identifiable via simplicity metrics (e.g., description length).  
     - **Available slip**: Logically possible but less coherent (e.g., "rotate path 90° clockwise" for `N N E → N E E`). The theory must generate these but *not* equate them to the best slip.  
     *Collapsing this distinction would imply all interpretations are equally valid, ignoring human preference for minimal descriptions.*  
  8. **Ambiguous Stimulus vs. Underdetermined Rule**:  
     - **Ambiguous stimulus**: Multiple parsings exist for the *input* (e.g., `N N E` as "two N, then E" or "N-run with anomaly").  
     - **Underdetermined rule**: The *mapping* has multiple instantiations even with fixed parsing (e.g., "change the second move" could mean "delete it," "duplicate it," etc.).  
     The theory must separate these diagnostically (e.g., ambiguity affects parsing time; underdeterminacy affects rule-application errors).  
  9. **Forced Slippage vs. Solver-Chosen Slippage**:  
     - **Forced slippage**: No consistent rule exists without slippage (e.g., `N E → ?` after `E N → N N` *requires* a higher-order unit like "swap directions").  
     - **Solver-chosen slippage**: Multiple slippages work, and selection depends on individual biases (e.g., a solver preferring spatial rotations over run-based rules).  
     *The theory must detect forced cases algorithmically but allow choice in others.*  

  ### **Constraints to Satisfy**  
  10. **Cognitive Plausibility**: Operations (e.g., pattern matching, slippage triggers) must respect human working-memory limits (e.g., chunk-based processing; no unbounded search).  
  11. **Description-Generativity**: Support dynamic description spaces (e.g., moves → runs → turns → path-shapes) without predefining primitives. Descriptions must emerge from the stimulus and task.  
  12. **Subjective Bias Incorporation**: Allow solver-specific factors (e.g., prior exposure to rotations) to influence slippage choice without overriding stimulus-driven cues.  
  13. **No Collapsing of Dimensionality**: Preserve the independence of spatial (e.g., direction), sequential (e.g., move order), and structural (e.g., symmetry) features.  

  ### **Meta-Analysis**  
  #### **Parochial Preferences**  
  - **Genuine Requirements**: Phenomena reproduction (1–6), distinctions (7–9), and cognitive plausibility (10) are universal to *cognitive* theories of analogy. Errors (2) and disagreements (3) are core to your focus on human performance.  
  - **Parochial Preferences**: Description-generativity (11) and subjective biases (12) stem from *constructivist* traditions (e.g., Piagetian learning). An alternative (e.g., symbolic AI) might predefine descriptions. Symmetry handling (6) is microdomain-specific but necessary for your stimuli.  

  #### **Joint Unsatisfiability Risks**  
  - **Ambiguity vs. Best Slip (7 + 1)**: If a stimulus is truly ambiguous (e.g., symmetric routes), identifying a "best" slippage (7) may be impossible—violating (6). *Resolution*: The theory can rank slips but must accept ties, with choice devolving to solver bias (12).  
  - **Forced Slippage Detection vs. Cognitive Plausibility (9 + 10)**: Detecting "no rule without slippage" may require exhaustive search, violating cognitive constraints (10). *Resolution*: Use heuristics (e.g., "if no atomic mapping in <X> steps, trigger slippage").  

  #### **Most Exclusionary Requirement**  
  **Reproduction of Errors and Disagreements (2 + 3)** excludes most candidate theories. Normative models (e.g., Structure-Mapping Engine) and deep-learning approaches optimize for "correct" answers, ignoring individual differences. This requirement demands:  
  - Modeling *why* solvers make specific errors (e.g., overgeneralizing run compression).  
  - Quantifying disagreement likelihood based on stimulus properties (e.g., symmetry increases disagreement).  
  Theories that cannot explain *variability* (e.g., purely deterministic analogy engines) fail here.  

  ### **Summary**  
  A viable theory must: reproduce human-like errors and disagreements via multiple slippage paths; rigorously separate best/available slips, ambiguity/underdeterminacy, and forced/chosen slippage; respect cognitive limits; and handle symmetry-induced equivalence. The exclusionary core is explaining *divergent outcomes* (errors/disagreements), not normative accuracy. This prioritizes cognitive fidelity over universal solution correctness—a hallmark of your research tradition.  

  Use these criteria to score theories on:  
  - **Completeness**: Coverage of desiderata (1–13).  
  - **Cognitive Fit**: Plausibility of mechanisms (e.g., heuristic vs. exhaustive).  
  - **Predictive Power**: Ability to simulate error/disagreement distributions.  
  - **Parsimony**: Minimizing ad hoc assumptions.
