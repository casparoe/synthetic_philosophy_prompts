prompt: |-
  Im a third-year PhD student and I have to turn a half-formed idea into a two-page proposal for a one-year fellowship, and I keep getting stuck, so I'm hoping you can basically just write the thing. The idea is about the procreation asymmetry, you know, the thing where it's supposed to be bad to bring a miserable person into existence but not good to bring a happy one into existence. My hunch is that the people defending this are actually running two totally different stories at the same time and quietly sliding between them. One story is axiological and impersonal: suffering is just bad, full stop, so adding more of it to the world is bad no matter who it lands on. The other is deontic: you're not allowed to impose a life of suffering on someone who can't consent to it, but you're also not required to go manufacture beneficiaries. Most attempts to give a single unified account of the asymmetry, I think, try to squeeze the deontic half out of the axiological half, and that's exactly where they crack. What I want to do is keep them apart and then push on whether the asymmetry even survives the split, or whether it turns out to be two independent claims that people just happen to state together out of habit.

  Then there's a second wrinkle I want to fold in. Pretty much everyone treats "the asymmetry" as one single thing, but I want to split it into a creation half and a continuation half, i.e. whether it's bad to start a life that will contain suffering vs. whether it's bad to keep an already-existing life going once it contains suffering. Those look like they should come apart, and if they do, that's a problem for any account that wants one principle to cover both. So the question is roughly: can the procreation asymmetry be given a unified grounding, or is it really the conjunction of a deontic claim about imposition and an axiological claim about impersonal badness, and do those come apart under pressure?

  Can you write the proposal? I need a precise statement of the question where it's actually clear what would count as answering it, some account of why the existing positions (person-affecting views, the impersonal/axiological views, the conditional-value stuff) don't already settle it, the method, like what I'd actually do month by month since I've got 12 months, and what would count as the project failing or me turning out to be wrong. Also be honest about whether this is too big for a year, and if it is, tell me how to shrink it. Dont worry about citations or a literature review, I'll fill those in myself.
