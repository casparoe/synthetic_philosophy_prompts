  I write a fortnightly column on science and ideas, and I'm at work on a piece about philosophical arguments that feel like conjuring tricks — you follow every step, nod along, and still suspect the deck was stacked. The one I keep circling is the paradox of knowability: from the apparently modest anti-realist thesis that every truth is knowable in principle, it seems to follow that every truth is in fact known, which is plainly false. I'd rather open the column with an original thought experiment than with the usual dry derivation, and I've been arguing about it with a colleague who insists the whole thing is a verbal trick about self-reference, so I want a case sturdy enough to survive that complaint.

  Construct that thought experiment for me. It should be realistic and no longer than a paragraph: a community of ordinary inquirers — a lab group, a newsroom, an audit team — brought up against a truth that none of them can know, even though the truth is in the relevant sense available to them. The unknowability must not be stipulated; it has to fall out of the structure of the proposition itself, and the scenario must not lean on demons, brains in vats, or an omniscient being, and should stay free of possible-worlds jargon. Then run the checks: state the proposition at issue, give the Fitch-style derivation showing why it cannot be known, and identify precisely which assumption is doing the work — the factivity of knowledge, the distribution of knowledge over conjunction, or the existence of a truth about someone's own ignorance. Set out what the anti-realist is committed to saying about the case and what the realist says, and show what happens to the argument if factivity is dropped or if the knowability principle is restricted to basic truths. Finish with the strongest way a defender of the knowability principle would attack the case, and tell me honestly which feature of the scenario, if removed, would let the anti-realist escape.
reasoning: |-
  We are to construct a thought experiment that illustrates the paradox of knowability without using possible-worlds jargon or exotic entities. The scenario should involve a community of ordinary inquirers (like a lab group) and a truth that is in principle available to them but unknowable due to the structure of the proposition.

  Thought Experiment:

  In a tightly-knit research lab studying a rare genetic condition, every member has access to the same shared database of patient records. One day, the team leader poses a challenge: "By the end of the month, we must either identify a specific patient in our database who has the condition but has never been tested for it, or prove that no such patient exists." The team works diligently, but as the deadline approaches, they haven't found such a patient nor proven there isn't one. Unbeknownst to them, there actually is one patient, Alice, who has the condition and has never been tested. Now consider the proposition:

  P: "Alice has the condition and no one in the lab will ever know that Alice has the condition."

  This proposition P is true (by the scenario: she has it and they never find out). But can any member of the lab know P? Suppose, for reductio, that some member, say Dr. Smith, comes to know P at some time t. Then:

  1. Dr. Smith knows that "Alice has the condition and no one in the lab will ever know that Alice has the condition." [Assumption for reductio]

  2. If Dr. Smith knows a conjunction, then Dr. Smith knows each conjunct. [Distribution of knowledge over conjunction]

  3. So, Dr. Smith knows that "Alice has the condition" and also knows that "no one in the lab will ever know that Alice has the condition." [From 1 and 2]

  4. Knowledge is factive: if one knows a proposition, then that proposition is true. [Factivity of knowledge]

  5. Therefore, from Dr. Smith's knowledge of the second conjunct, it follows that it is true that "no one in the lab will ever know that Alice has the condition." [By factivity]

  6. But if Dr. Smith knows that Alice has the condition at time t, then at time t, someone in the lab (Dr. Smith) knows that Alice has the condition. [By definition]

  7. This contradicts the second conjunct (that no one in the lab will ever know that Alice has the condition), because we have just shown that Dr. Smith knows it at t.

  Therefore, the assumption that Dr. Smith knows P leads to a contradiction. Hence, P cannot be known by anyone in the lab.

  But note that P is true (by the scenario). Therefore, we have a truth (P) that is unknowable (by the lab). However, the anti-realist's knowability principle (KP) says that every truth is knowable in principle. So if KP holds, then P must be knowable. But we've just shown that P is unknowable (by the lab). Therefore, if KP is true, then P must be knowable, but it isn't. Contradiction. Hence, KP leads to the conclusion that every truth is actually known (because if it weren't, then a proposition like P would be a truth that is unknowable, contradicting KP). But it's plainly false that every truth is actually known (e.g., we don't know everything about the universe).

  The proposition at issue: P = "Alice has the condition and no one in the lab will ever know that Alice has the condition."

  The derivation above (steps 1-7) shows that P cannot be known. The key assumptions are:

  - Factivity of knowledge (step 4): If S knows p, then p is true.
  - Distribution of knowledge over conjunction (step 2): If S knows (p and q), then S knows p and S knows q.
  - The existence of a truth about someone's own ignorance: specifically, the second conjunct of P is about the ignorance of the lab members (including the knower) about Alice.

  The anti-realist, who endorses the knowability principle, is committed to saying that P must be knowable. But the derivation shows that it cannot be known. Therefore, the anti-realist must either deny the derivation (by rejecting one of the assumptions) or reject the existence of such a truth. However, in this scenario, P is true. So the anti-realist might argue that the scenario is impossible? But that seems implausible.

  The realist, on the other hand, will point to P as a counterexample to the knowability principle: here is a truth that is unknowable.

  What if we drop factivity? Without factivity, step 5 fails. Then we could avoid the contradiction. But factivity is a core feature of knowledge (if you know something, it must be true). So giving up factivity would radically change the concept of knowledge.

  What if we restrict the knowability principle to basic truths (non-compound propositions)? Then P, being a conjunction, would not be covered by the restricted knowability principle. Hence, it might be unknowable without contradicting the restricted principle. However, note that P is built from two simpler truths: (1) "Alice has the condition" and (2) "No one in the lab will ever know that Alice has the condition." The first might be knowable (if they tested Alice, they would know) and the second might be knowable? But wait, the second conjunct itself is a truth about ignorance. If we tried to know the second conjunct, we run into problems: if someone in the lab comes to know the second conjunct, then they know that no one in the lab will ever know that Alice has the condition. But if they then come to know that Alice has the condition (say, by testing her), then they would know the first conjunct and then also the second conjunct would be falsified (because now they know). So the second conjunct is also unknowable? Thus, even if we restrict KP to basic truths, the second conjunct (which is basic) is unknowable. Therefore, the anti-realist would still face a problem.

  The strongest way a defender of the knowability principle would attack the case:

  The defender might argue that the proposition P is not a truth that is available in principle to the lab. Why? Because the unknowability of P is built into the scenario. But note that the scenario is set up so that the lab has access to the database and can test Alice. So they could, in principle, come to know that Alice has the condition. However, if they did test Alice and found she has the condition, then the second conjunct of P would be false (since then they would know). Therefore, P is only true when they never know. So the defender might say: the truth of P is not stable? Or that P is not a genuine truth because it refers to the lab's own epistemic state? But that seems ad hoc.

  Alternatively, the defender might challenge the distribution of knowledge over conjunction (step 2). But distribution is very intuitive.

  The most promising line of attack is to deny that there can be a true proposition of the form "p and no one knows p" in a community that is capable of knowing p. But in our scenario, the lab is capable of knowing the first conjunct (if they test Alice) but by testing Alice they would make the second conjunct false. So the proposition P is true only when they don't test Alice and never know. But the anti-realist might insist that if they were to test Alice, they would know, so then P would be false. Therefore, the defender might argue that P is not a truth that is stable under investigation. However, the knowability principle is about truths as they are, not as they would be under investigation. The proposition P is true in the actual situation (where they don't test Alice and never know).

  But the defender of KP might push on the idea of "in principle" knowability. They might say: if the lab were to investigate appropriately, they would know the truth. But note, if they investigate appropriately and test Alice, then they would know that Alice has the condition, but then P would become false. So they cannot come to know P because any attempt to know the first conjunct (by testing) would falsify the second conjunct. Hence, P is unknowable.

  Honestly, the feature that if removed would let the anti-realist escape is the existence of a truth that quantifies over the community's own knowledge states. Specifically, the second conjunct of P is a statement about what the lab will ever know. Without such self-referential propositions about the limits of the community's own knowledge, the paradox might be avoided. But note that such propositions seem perfectly meaningful and can be true (as in this scenario). So the anti-realist might have to restrict the knowability principle to exclude such propositions. But that would be a significant retreat.

  In summary:

  - Thought experiment: A lab with a database of patients. Proposition P: "Alice has the condition and no one in the lab will ever know that Alice has the condition." (True in the scenario where they never test Alice and never know.)
  - Derivation: If someone in the lab knows P, then they know each conjunct. By factivity, the second conjunct must be true, meaning no one ever knows Alice has the condition. But then the knower knows Alice has the condition (from the first conjunct), which contradicts the second conjunct.
  - Key assumption: The distribution of knowledge over conjunction and factivity are hard to deny. The existence of a truth about the community's own ignorance is what creates the problem.
  - Anti-realist must deny that such a proposition can be true or that it is covered by the knowability principle. Realist takes it as a counterexample to KP.
  - If we drop factivity, the contradiction vanishes, but factivity is central to knowledge.
  - If we restrict KP to basic truths, then note the second conjunct (a basic truth) is also unknowable: if anyone in the lab knew it, then they would know that no one knows Alice has the condition. But if they then tested Alice and found she has it, they would know, which contradicts. Or without testing, how do they know the second conjunct? They can't because if they knew it without testing, then they would know Alice has the condition? Not necessarily. The second conjunct is about the future: no one will ever know. How could they know that? Only if they have a proof that they will never test Alice? But in the scenario, they are free to test. So it seems they cannot know the second conjunct either.
  - Strongest attack: The defender of KP might argue that P is not a stable truth because any attempt to know it would change it. But the KP is about actual truths. Alternatively, they might restrict KP to exclude propositions that are about the knower's own knowledge limitations. This would be an escape route, but it would be an ad hoc restriction.

  Therefore, the scenario stands as a challenge to the knowability principle.
