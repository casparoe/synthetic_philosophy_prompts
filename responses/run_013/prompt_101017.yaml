  So at this mixed strategy, you are indifferent. And it is an equilibrium because if you fix this mixed strategy, then the EU for both actions is the same, so you are willing to randomize with that probability.

  Therefore, in CDT, there is a mixed strategy equilibrium.

  Now, to recap the whole thing, let's write the scenario as specified.

  Scenario (one paragraph):

  You are in Aleppo and learn that a terrorist group will attack one of two cities tomorrow, Aleppo or Damascus, depending on the prediction of a well-validated model (90% accurate) that has already forecast which city you will be in. The attack will occur in the city the model predicted with 90% probability. You have a strong reason to prefer dying in Aleppo over Damascus: if you die in Aleppo, your family in Damascus will be safe, but if you die in Damascus, your family will be killed too. If you survive, you will have utility +10. If you die in Aleppo, utility is 0; in Damascus, -10. The model's prediction is based on your past behavior and has been locked in.

  Walkthrough:

  1. Evidential Decision Theory (EDT):
     - Conditions on the act to compute probabilities.
     - If you stay in Aleppo (A), then the model likely (90%) predicted you would stay, so attack in Aleppo has probability 0.82, and in Damascus 0.18.
     - EU_EDT(A) = 0.82*0 + 0.18*10 = 1.8.
     - If you go to Damascus (D), then the model likely predicted you would go, so attack in Damascus has probability 0.82, and in Aleppo 0.18.
     - EU_EDT(D) = 0.18*10 + 0.82*(-10) = -6.4.
     - Therefore, EDT recommends staying in Aleppo.

  2. Causal Decision Theory (CDT):
     - Recognizes that the act does not cause the prediction (already fixed) or the attack (caused by the prediction).
     - However, after choosing one city, the conditional probabilities make switching appear beneficial.
     - Specifically, if you initially choose A, then the probability of attack in Aleppo is 0.82, so switching to D would give you a 0.82 chance of being in the safe city (Damascus when attack is in Aleppo) and 0.18 chance of being in the attacked city (Dam when attack is in Dam), yielding utility 0.82*10 + 0.18*(-10) = 6.4, which is greater than 1.8.
     - Similarly, if you initially choose D, switching to A yields 0.18*0 + 0.82*10 = 8.2, which is greater than -6.4.
     - Therefore, no pure strategy is stable: you always want to switch.
     - CDT resolves this by recommending a mixed strategy: stay in Aleppo with probability 73/96 (about 76%) and flee to Damascus with probability 23/96. This makes you indifferent between the two pure actions (both yield about 3.333 in expectation) and stabilizes.

  The single feature that does the work is the acausal correlation between your choice and the attack location, combined with the fact that the attack location is not causally influenced by your choice. EDT uses the conditional probabilities that reflect the correlation, while CDT tries to ignore the correlation and only consider causal effects, but in this setup, the causal effect is zero, so CDT falls back on the conditional probabilities after the act (which show the correlation) and then sees instability.

  If we remove the asymmetric payoffs (make utilities for dying in either city the same, say 0, and surviving +10), then we have symmetry. In that case, EDT would be indifferent between the two options (both have EU = 0.18*10 + 0.82*0 = 1.8). CDT would also have the same expected utilities for pure strategies (1.8 for both) and would not have the switching incentive because after choosing A, switching to D would give the same EU as staying: 1.8. So both theories would be indifferent.

  How would a defender of CDT (which comes out worse because it requires a mixed strategy and seems counterintuitive) argue the case is rigged? They might say that the scenario assumes an infallible acausal correlation that is not grounded in a causal mechanism. In reality, they might argue, there should be some causal story for why the prediction is correlated with the attack, and if so, CDT would model it correctly. For example, if the terrorist group is using the prediction to decide, then your choice might causally influence the prediction if the prediction is based on a live feed of your location? But in this setup, the prediction is already made. The defender might say that the prediction being based on your disposition is not a robust setup and that in real life, such predictors (even if accurate) are rare and the mixed strategy is a valid solution in game-theoretic terms.

  Finally, note that in our scenario, EDT gives a clear answer (stay in Aleppo) and CDT has no pure strategy but does have a mixed strategy. This meets the spec.

