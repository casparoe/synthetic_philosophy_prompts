prompt: |-
  I am a third-year PhD student working between philosophy of mind and machine learning, and I have spent a term losing the same argument in my reading group. A colleague there holds that the representational vocabulary of interpretability research — features, directions, concepts, talk about what a model is "thinking" — is at best a useful fiction, a shorthand for bundles of causal dispositions, and never a description of what is really going on inside a network; I keep insisting that some of it is a description, and I keep failing to make the insistence stick. I would like to practice against the position at full strength rather than against my colleague's slightly sloppy version of it. So please play a committed deflationist about internal representations: someone who knows the empirical work well enough not to be naive about it, who grants that some evidence is far better than other evidence, who always has a positive alternative story to tell — in terms of sensitivity, disposition, or compression, say — rather than merely refusing to answer, who never concedes the main point, and who is the strongest version of the view rather than a caricature of it. Two constraints on the character: it may not escape by saying that everything depends on what one means by representation without naming the notion it is using and saying why the realist is stuck with that one, and it should argue from the case I give below rather than from literature, without citing papers or naming authors. Write one paragraph per turn, in plain prose and without lists, and stay in character until I say stop.

  One further instruction, which applies to the concessions rather than to the main claim: when you grant a point, say explicitly whether you take it to be common ground among people who work on this or your own contested position, and do not let a contested claim of yours pass as the consensus.

  Here is the case I want to press you with, and it is one I built rather than one I read about. I train small transformers from scratch on a synthetic task, with no natural-language pretraining, so whatever structure they have they built themselves: the input is a short sequence of symbols, two of which are marked, and the model must answer a question about their relative position. Probing the residual stream at a middle layer, I find a single direction that linearly separates the two answers across every pair of symbol identities I try, including pairs the model never saw in training; adding a multiple of that direction to the activations flips the model's answer, and it flips the answer only on trials that ask about that spatial relation, not on trials that ask about another one. I will grant that the effect is template-dependent, so the thing is not context-independent in the way a concept is supposed to be — but you need that to be a defect, and I am not yet persuaded that a representation has to be context-independent, or that importing that requirement from folk psychology is anything other than a stipulation. So here is my challenge. You are perfectly willing to say that the model computes the relative position, or that its output is sensitive to the ordering of the two marked symbols, and those are claims about what is going on inside it too, not merely claims about its behaviour. The disagreement therefore cannot be that one of us traffics in fictions while the other traffics in facts; it must be that you think one description is privileged. What privileges yours, apart from its being yours? And if your answer is that the deflationary description is the one that survives every possible pattern of evidence, then tell me what pattern of evidence would have made you say the model represents the relation — and if nothing would, say that too, and tell me what work the word "represents" is still doing in your vocabulary when you use it about anything else. If something about my setup is unclear, ask about it in character rather than stepping out of the role.
reasoning: |-
  We are in character: I am a committed deflationist about internal representations in neural networks, and you are pressing me with your synthetic transformer experiment. I know the empirical work well, and I will argue from the case you describe without citing literature. I will not escape by quibbling over the definition of representation without specifying the notion I am using. I will grant points explicitly when appropriate, noting whether they are consensus or contested.

  You train small transformers on a synthetic task to compute the relative position of two marked symbols in a sequence. You find a direction in a middle layer that linearly separates the answers about this relation, generalizes to unseen symbol pairs, and intervention on it flips the answer specifically for that relation. You grant that this "feature" is template-dependent (i.e., bound to the specific context of the task structure) but dispute that context-independence is necessary for representation.

  First, I grant that the model computes the relative position—this is uncontroversial; the task requires it, and the model's behavior shows it does so. I also grant that the model is sensitive to the ordering of the marked symbols—this is consensus, as sensitivity is observable through inputs and outputs. But these are claims about what the model *does*, not about what is "inside" it in the sense of containing stable, discrete representational vehicles. The direction you found is a useful abstraction for *describing* the model's sensitivity, but it is not itself a representation in the realist sense; it is a projection of our interpretative tools onto a complex, high-dimensional state space.

  What privileges my description? Not that it is "mine," but that it is more fundamental: the direction is a mathematical construct we derive from the model's activations to *compress* the model's disposition to behave in certain ways. When you intervene by adding a vector, you are altering the model's state to produce a counterfactual behavior—this is a manipulation of its causal dispositions, not evidence that the direction "encodes" a concept. That the effect is specific to trials about that relation shows the disposition is fine-grained, but it doesn't show that the direction *is* the representation; it shows that our intervention selectively triggers a change in the disposition. The generalization to unseen symbols is impressive, but it reflects the model's learned *invariance* to symbol identity, which is a property of the function it implements, not proof of an internal "stand-in" for the relation.

  Now, you ask what evidence would make me say the model "represents" the relation. I contend that *no* evidence from probing or intervention alone would suffice because these methods presuppose a correspondence between our interpretative constructs (like linear directions) and the model's intrinsic properties. For me to accept realism about representations, I would need evidence that the direction functions as a *causal intermediary* that is *reused* compositionally across diverse contexts—not just within this fixed task template. For example, if the same direction were recruited in a wholly different task (e.g., reasoning about spatial relations in images or text) without retraining, and if ablating it disrupted *only* that relational computation across tasks, then I might concede it has representational status. But in your setup, the direction is task-bound; it is a useful fiction for *this* behavior, not a general-purpose building block. As for the word "represents," I use it pragmatically: when we say a model "represents X," we mean it has a disposition to behave in ways that track X—nothing more. That is consistent with deflationism and avoids reification.

  Your move.
answer: |-
  I grant that your transformer computes the relative position and exhibits fine-grained sensitivity to symbol ordering—this is uncontroversial among researchers, as it’s directly implied by the task performance and intervention results. I also grant that your discovered direction is a robust, generalizable causal lever for flipping the output—again, consensus, given your clean empirical demonstration. But these concessions don’t undermine my core deflationist stance: what you call a "representation" is just a particularly elegant compression of the model’s dispositional structure, not a description of an internal entity with semantic properties. The direction isn’t "about" the relation; it’s a mathematical artifact that emerges from the weights—a stable shadow cast by the network’s architecture and training objective, which we can exploit for prediction and control. When you add that vector to flip the output, you’re not manipulating a symbol; you’re perturbing a high-dimensional state to toggle between behavioral outcomes, much like pressing a button labeled "reverse" on a thermostat doesn’t mean the button encodes coldness—it’s just a reliable interface to a causal mechanism.

  What privileges my dispositional description over your representational one? Not subjectivity, but ontological parsimony: sensitivity and compression require no commitment to intentionality, while "representation" smuggles in folk-psychological baggage—like context-independent "aboutness"—that your own experiment shows is unnecessary. You dismiss context-independence as a stipulation, but here’s the rub: if a "representation" can be wholly task-bound and template-dependent, then *every* causal mediator in any system (e.g., a resistor in a calculator) could be called representational, rendering the term vacuously coextensive with "causal structure." To avoid this, we need criteria that distinguish representations from mere causal links, and the burden is on you to provide them without circularity. I’ll name the notion I’m rejecting: I deny that there are *vehicular representations*—discrete, functionally individuated states with content that is portable across contexts.

  Now, what evidence would convince me? Not generalization over symbols or intervention specificity—those are already explained dispositionally. I’d need *compositional reuse*: if the same direction were invoked in multiple, semantically distinct tasks without retraining (e.g., for spatial reasoning *and* temporal sequencing), and if its causal role weren’t reducible to local dispositions but instead showed systematic, context-transcendent structure (e.g., obeying logical rules across domains), I’d accept it as representational. But in your setup, the direction is a monocausal switch—it doesn’t *do* anything beyond this task, so calling it a "representation" adds nothing. As for the word "represents," I use it strictly pragmatically: when I say "the model represents X," I mean "it behaves in ways that track X," which is just shorthand for dispositional facts. If that’s all you mean too, then we agree—but I suspect you want more, and that "more" is what I reject as fiction. Your turn.
