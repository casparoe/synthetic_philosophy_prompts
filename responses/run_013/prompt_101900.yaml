prompt: |-
  I recently had a long argument with a friend about evolutionary psychology, and I came away with a clearer sense of my own verdicts than of the principle behind them. I want you to help me find the principle, or the best small set of principles, that captures the pattern, and to tell me what it implies for a new hypothesis.

  I treat a claim as scientific when it is a legitimate empirical hypothesis that could be confirmed or disconfirmed by evidence, and as a just-so story when it is not, or when its apparent support is too flexible to count.

  My verdicts:

  1. The claim that human beings possess a cheater-detection mechanism triggered by violations of social contracts, which can operate independently of general logical reasoning: scientific.

  2. The claim that men and women evolved distinct modules for detecting sexual versus emotional infidelity, which explain sex differences in jealousy: just-so.

  3. The claim that disgust evolved as a pathogen-avoidance emotion and produces specific avoidance and contamination behavior: scientific.

  4. The claim that a general tendency to overestimate the prevalence of threats in ambiguous situations is an adaptation to ancestral danger: just-so.

  5. The claim that the nausea and food aversions of early pregnancy are adaptations that protect the developing embryo from toxins: scientific.

  6. The claim that rape is an evolved reproductive strategy: just-so.

  7. The claim that childhood co-residence reduces later sexual attraction between siblings and that this is an adaptation against inbreeding: scientific.

  8. The claim that a particular waist-to-hip ratio is a universal cue of female fertility and is preferred by men across cultures: just-so.

  What principle, or small set of principles, best captures this pattern? Which of my verdicts would I have to abandon if I wanted a single criterion? I am less interested in a verdict on the next claim than in the rule I seem to be running, the other rules that fit my verdicts just as well, and which further case would best tell them apart. The next claim is this: human beings evolved a finite daily budget for strategic social interaction; the budget is replenished by solitude; and contemporary burnout is a mismatch between that budget and the demands of modern work. Is that scientific, just-so, or something in between, and what evidence or case would settle it?
reasoning: |-
  Okay, the user has a really interesting query here. They've been debating evolutionary psychology with a friend and have clear verdicts on specific claims but want to uncover the underlying principles guiding those judgments. They've listed eight examples where they classify some as "scientific" (legitimate empirical hypotheses) and others as "just-so stories" (untestable or overly flexible explanations). Now they're proposing a new hypothesis about social interaction budgets and burnout to test their principles.

  First, I need to analyze their pattern. Looking at their verdicts, the scientific ones seem to share concrete features: specific mechanisms (cheater-detection, pregnancy nausea), observable behaviors (disgust responses, sibling attraction avoidance), and clear adaptive functions with testable predictions. The just-so claims appear vaguer - invoking broad tendencies (overestimating threats) or unfalsifiable assertions (rape as strategy), often lacking mechanistic specificity or cross-cultural validation (like the waist-to-hip ratio claim). 

  The user might be implicitly applying criteria like falsifiability and specificity without realizing it. Their rejection of "flexible" support suggests they value hypotheses that can't be twisted to fit any outcome. They also seem skeptical of claims about complex modern behaviors (burnout) being directly explained by evolution without stronger evidence. 

  For the burnout hypothesis, I notice it's stuck between testable and speculative elements. The solitude-replenishment idea could be studied via isolation experiments, but the "evolutionary budget" concept feels metaphorical. The user would likely call it "in-between" - perhaps leaning just-so due to its vague mechanism and modern behavior focus. A decisive test might involve cross-cultural studies of social exhaustion thresholds or physiological markers of depletion. 

  What's deeper here? The user seems to want a rigorous framework to distinguish science from storytelling in evo-psych - probably because the field's controversies make this vital. They might be seeking intellectual tools for future debates or personal clarity. Their frustration with "flexible" explanations hints at valuing scientific integrity over narrative plausibility. 

  I should emphasize that their pattern aligns well with established philosophy of science criteria (testability, specificity), while noting that single-criterion approaches would force them to abandon some verdicts. For instance, requiring direct genetic evidence would invalidate even their "scientific" examples. The burnout case perfectly exposes tensions between mechanistic plausibility and testability - making it ideal for refining their principles.
answer: |-
  Based on your verdicts, your implicit principle for distinguishing scientific evolutionary psychology from "just-so stories" appears to be a combination of three key factors:

  1.  **Specificity of Mechanism:** The hypothesis proposes a specific, identifiable psychological mechanism, neural circuit, behavioral output, or physiological response (e.g., cheater-detection module triggering specific reasoning patterns, disgust producing *specific* avoidance behaviors, pregnancy nausea causing *specific* food aversions, co-residence triggering *specific* lack of attraction).
  2.  **Testability & Falsifiability:** The hypothesis makes specific, non-trivial predictions that can be tested with empirical evidence (behavioral experiments, cross-cultural comparisons, physiological measures, historical/archaeological data, genetics) and could potentially be disproven. The evidence isn't so flexible that it can explain *any* outcome.
  3.  **Plausible & Constrained Adaptation:** The proposed adaptive function is directly linked to a concrete, specific ancestral problem (detecting cheating in social exchange, avoiding pathogens, avoiding toxins during fetal organogenesis, avoiding inbreeding depression). It avoids vague, over-generalized functions (e.g., "avoiding danger" without specifying *what kind* or *how* it manifests specifically) or functions that seem implausible as specific adaptations (e.g., rape as a *strategy* shaped by selection).

  **How this explains your verdicts:**

  *   **Scientific (1,3,5,7):** All specify mechanisms (cheater-det module, disgust emotion/behavior, pregnancy nausea/aversion, co-residence -> reduced attraction) linked to specific adaptive problems (social contract violation, pathogen avoidance, toxin avoidance during organogenesis, inbreeding avoidance) with highly testable predictions (e.g., Wason selection task patterns, specific disgust responses, correlation of aversions with toxin sensitivity, Westermarck effect studies).
  *   **Just-So (2,4,6,8):**
      *   **(2):** Lacks specificity - what *are* these distinct modules? How do they operate differently? Predictions are vague and evidence (self-report jealousy differences) is highly flexible/multiply interpretable. Adaptive link is specific but mechanism isn't.
      *   **(4):** Lacks specificity - "general tendency" isn't a mechanism. Adaptive function is overly broad ("ancestral danger"). Highly flexible - almost any threat-related bias could be explained this way. Hard to falsify.
      *   **(6):** Lacks plausibility as a *specific adaptation*. Proposing rape as an *evolved strategy* implies selection *for* rape, which is highly controversial and lacks evidence compared to explanations viewing rape as a byproduct of other adaptations (e.g., sexual desire, aggression). Predictions are vague and evidence is highly interpretative/flexible.
      *   **(8):** Lacks cross-cultural universality and specificity in predictions. Evidence is mixed and often confounded by cultural ideals and body composition/health. The proposed mechanism (universal cue) isn't robustly supported, and predictions about preference are not consistently confirmed across diverse populations. Flexible evidence.

  **The Cost of a Single Criterion:**

  If you insisted on a single criterion, you would likely have to abandon some verdicts:

  *   **Falsifiability Alone:** You'd have to accept (2) and possibly (4) & (8) as potentially falsifiable (even if poorly specified), and might struggle to reject (6) as *unfalsifiable* in principle (though very hard). You'd likely keep your "scientific" verdicts.
  *   **Specificity of Mechanism Alone:** You might have to reject (7) - while co-residence is specific, the precise mechanism reducing attraction is still debated (e.g., learned aversion vs. innate mechanism). You might be stricter on (1) - is the "module" specific enough? You'd likely keep (3) & (5). You'd more easily reject (2), (4), (6), (8).
  *   **Plausible Adaptation Alone:** This is highly subjective. You might accept (6) if you found the argument plausible (though you clearly don't). You'd likely keep your "scientific" verdicts and reject (2), (4), (8).

  **Your principle is robust because it requires the combination.** A vague but falsifiable claim (like 4) fails on specificity. A specific but implausible claim (like 6) fails on plausibility. A plausible but vague claim (like 4 again) fails on specificity/testability.

  **Analyzing the New Hypothesis: The Social Interaction Budget**

  **Hypothesis:** Humans evolved a finite daily budget for strategic social interaction; replenished by solitude; contemporary burnout is a mismatch.

  *   **Specificity of Mechanism?** Low/Moderate. "Budget" is a metaphor. What is the *actual* physiological or cognitive mechanism being depleted (cognitive control resources? specific neurochemicals? subjective energy perception)? "Strategic social interaction" is broad. "Replenished by solitude" is vague.
  *   **Testability & Falsifiability?** Moderate/High. Predictions *can* be tested: Does prolonged intense social interaction (meetings, negotiations, emotional labor) lead to measurable depletion (cognitive tests, cortisol, self-report fatigue)? Does solitude/rest replenish these measures? Do individuals with high social demands report more burnout? Are there cross-cultural or historical differences correlating with social interaction levels? *However*, the "evolved" aspect is harder. Proving it's an *adaptation* specifically for social interaction (vs. a general depletion mechanism applied to social tasks) is challenging.
  *   **Plausible & Constrained Adaptation?** Moderate. Avoiding social overload and needing recovery is plausible. However, is "strategic social interaction" a specific enough *ancestral* problem distinct from general cognitive fatigue? Was ancestral social life structured in ways requiring a *daily* budget replenished by *solitude* (vs. different group structures with less intense/different types of interaction)? Linking modern "burnout" directly to this specific mismatch is a stretch – burnout is multi-factorial.

  **Verdict:** **Leans towards "Just-So" / In-Between.** While the core idea of social depletion and recovery is testable *in the present* (and has some empirical support for aspects of cognitive depletion), framing it as an evolved *specific adaptation* ("budget for *strategic social interaction*") with a *solitude-based replenishment mechanism* causing modern *burnout* via mismatch lacks sufficient specificity and faces challenges in establishing the evolutionary plausibility and uniqueness of the mechanism. The evidence supporting the depletion effect is often more consistent with general resource models (e.g., ego depletion, though controversial) than a *specific social interaction budget shaped by evolution*.

  **Evidence to Settle It (Towards Scientific):**

  1.  **Identify a Specific Physiological Mechanism:** Find a biomarker (e.g., specific hormone depletion/repletion pattern, neural activation signature) *uniquely* linked to processing "strategic social interaction" that recovers specifically during solitude, not just general rest.
  2.  **Cross-Cultural/Historical Consistency:** Demonstrate this depletion/repletion cycle operates similarly in diverse cultures with vastly different social structures and concepts of solitude. Show evidence that ancestral environments consistently presented this specific demand/recovery cycle.
  3.  **Distinguish from General Fatigue:** Rigorously demonstrate that the depletion caused by "strategic social interaction" is distinct from, and perhaps more severe than, depletion caused by equally complex non-social cognitive tasks.
  4.  **Genetic Evidence:** Find specific genetic variants linked to the sensitivity of this proposed mechanism or its replenishment rate, supporting an evolutionary history of selection related to social interaction management.
  5.  **Tighter Burnout Link:** Show that individual variation in this proposed "budget" mechanism *specifically* predicts vulnerability to burnout in high-social-intensity jobs, *above and beyond* other known factors like general stress, workload, or lack of control.

  Without evidence like this, especially points 1 and 4, the hypothesis remains a plausible but overly flexible evolutionary narrative ("social interaction is tiring, so we must have evolved a specific budget for it") applied to a complex modern phenomenon (burnout). It's testable in parts, but the core evolutionary claim lacks the specificity and constraint you require for a "scientific" verdict.
