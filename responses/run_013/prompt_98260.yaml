  Hmm, they're clearly wary of oversimplification. The emphasis on separating "no fact of the matter" from "unreachable fact" suggests they've encountered glib responses before. And that bit about not palming off contested views as consensus? They've done their reading and won't tolerate hand-waving. British English preference is a nice touch—shows attention to detail.

  Right, the core challenge: building criteria that simultaneously demand epistemic humility (we can't access everything) while resisting total ontological surrender (not "anything goes"). The tension between Requirement 2 (empirical adequacy as baseline) and Requirement 3 (no spurious precision) will be thorny—many theories fail here. Also, Requirement 6 (vocabulary variance) is where structural realism often stumbles by reducing ontology to structure alone.

  Ah, and they specifically want conflicts flagged. The biggest clash is likely between Requirement 8 (preserving metaphysical distinctions) and Requirement 9 (avoiding brute facts). If two ontologies are metaphysically distinct but empirically identical, insisting there's still a fact of the matter (Requirement 8) might force us into brute inexplicability (violating Requirement 9). That's Quinean indeterminacy vs. realist stubbornness in a nutshell.

  For the knockout requirement? Requirement 3 (no spurious precision) probably sinks Ramsey sentences and proxy-function tricks—they often smuggle in covert ontological commitments while pretending neutrality. Structural realism gets hobbled by Requirements 6 and 8; it struggles with non-structural differences between theories.

  Must remember to demarcate settled vs. contested ground carefully. The underdetermination of theory by data (Requirement 1) is rock-solid. But whether empirically equivalent theories can be metaphysically inequivalent (Requirement 8) is where realists and anti-realists still throw punches. No pretending otherwise—the user would sniff that out instantly.

  Final thought: Their request for a "scorecard" of theories feels almost playful—they want ammunition for seminar debates but are disciplined enough to focus on criteria first. Smart approach. I'll keep the theory assessments telegraphic so they can enjoy the arguing later.
answer: |-
  Here’s a rigorous desiderata list for evaluating theories of ontology under epistemic constraint, grounded in your sealed-box scenario. Requirements are ranked by priority, with conflicts flagged. British English adhered to throughout.

  ---

  ### **Core Desiderata for Theories of Ontology Under Epistemic Constraint**  
  *(With justification from the sealed-box case)*  

  1. **Empirical Adequacy Mandate**  
     *Must:* Treat empirically equivalent theories as *predictively indistinguishable*.  
     *Case:* Both rival inventories predict identical probe readings. Any theory must acknowledge this equivalence without privileging one ontology *on empirical grounds*.  
     *Non-compliance:* Favouring one ontology due to "intuitive plausibility" without empirical warrant.  

  2. **Underdetermination Acknowledgment**  
     *Must:* Explicitly recognise that inaccessible information *permits* multiple ontologies.  
     *Case:* The sealed box’s blindness to certain probes creates a permanent epistemic gap.  
     *Non-compliance:* Asserting that future data *will* resolve the dispute (e.g., naïve scientific realism).  

  3. **No Spurious Precision**  
     *Must:* Avoid claiming ontological precision where none exists.  
     *Case:* Systematic relabelling (permutation) of items produces identical data. A theory must not declare "item A is *definitely* a capacitor, not a resistor" if labels are interchangeable.  
     *Non-compliance:* Theories implying "best fit" models reveal "true" labels.  

  4. **Distinction Preservation**  
     *Must:* Differentiate between:  
     - **(a)** *No fact of the matter* (ontic indeterminacy)  
     - **(b)** *Unreachable fact* (epistemic limitation)  
     *Case:* Rival inventories may reflect genuine indeterminacy (a) *or* a hidden reality we cannot access (b). Collapsing (a) and (b) is fatal.  

  5. **Vocabulary Variance Tolerance**  
     *Must:* Accommodate ontologies using fundamentally different primitives (e.g., objects vs. processes).  
     *Case:* Field-process description vs. thing-object inventory. A viable theory cannot demand "canonical" vocabulary.  
     *Non-compliance:* Dismissing process ontology because it "reduces to" objects (or vice versa).  

  6. **Metaphysical Neutrality**  
     *Must:* Not presuppose specific metaphysical commitments (e.g., realism, nominalism).  
     *Case:* The theory itself must not *entail* that one ontology is "more real" than another absent empirical differentiation.  
     *Non-compliance:* Structural realism assuming *only* structure is real.  

  7. **Non-Triviality Constraint**  
     *Must:* Reject ontologies that are *logically incoherent* or *inconsistent with accessible data*.  
     *Case:* An inventory positing "invisible dragons" that *contradict* probe readings fails. Empirically equivalent ≠ anything goes.  

  8. **Reference Grounding**  
     *Must:* Explain how terms *refer* to entities despite underdetermination.  
     *Case:* If "resistor" in one theory and "capacitor" in another label the same causal role, the theory must clarify what fixes reference (causal role? structure?).  

  9. **Avoidance of Brute Facts**  
     *Must:* Not posit "inexplicable" ontological facts where explanations are plausible.  
     *Case:* Asserting one ontology is "just true" without explaining *why* it’s preferred violates parsimony.  

  ---

  ### **Flagged Requirement Conflicts**  
  - **Tension between (4) and (8):**  
    Preserving the distinction between *no fact* (4a) and *unreachable fact* (4b) clashes with attempts to *ground reference* (8). If reference is fixed by inaccessible facts, (4b) holds; if reference is indeterminate, (4a) holds. Many theories implicitly favour one over the other.  
  - **Tension between (6) and (8):**  
    Metaphysical neutrality (6) conflicts with reference-grounding (8) if grounding requires realist commitments (e.g., causal-historical theories of reference).  

  ---

  ### **The Knockout Requirement**  
  **Requirement 3 (No Spurious Precision)** eliminates the most popular approaches:  
  - **Ramsey sentences** (implicitly privilege "natural" properties).  
  - **Proxy functions/permutation arguments** (often dismissed as "merely semantic" but fail to explain why reference *isn’t* fixed).  
  - **Structural realism** (claims only structure is knowable, but struggles with "same structure, different ontologies").  

  ---

  ### **Scorecard of Major Theories**  
  *(Against key requirements: ✓ = satisfies, ✗ = violates, ~ = partially/contested)*  

  | Theory                 | (1) Empirical Adequacy | (3) No Spurious Precision | (4) Distinction Preservation | (6) Metaphysical Neutrality | (8) Reference Grounding |  
  |------------------------|------------------------|---------------------------|------------------------------|-----------------------------|--------------------------|  
  | **Quinean Indeterminacy** | ✓ (all ontologies equal) | ✗ (denies reference *can* be grounded) | ✗ (collapses to (4a): *no* fact) | ✓ (anti-realist) | ✗ (reference radically indeterminate) |  
  | **Proxy Functions**      | ✓                      | ✗ (treats relabelling as trivial) | ✗ (equivocates on (4a) vs (4b)) | ✓              | ✗ (no account of *how* reference works) |  
  | **Structural Realism**   | ✓ (focuses on structure) | ✗ (asserts structure *is* the ontology) | ~ (debates if structure implies (4a) or (4b)) | ✗ (commits to structural ontology) | ~ (reference via structure) |  
  | **Ramsey Sentences**     | ✓ (quantifies over entities) | ✗ (covertly privileges "elegant" interpretations) | ✗ (ignores (4b) possibilities) | ~ (implicit realism) | ~ (reference by description) |  
  | **Epistemicism**         | ✗ (claims one ontology is "true" unknowably) | ✗ (asserts precision exists) | ✓ (clearly (4b)) | ✗ (realist commitment) | ✓ (reference fixed by facts) |  

  ---

  ### **Settled vs. Contested Territory**  
  **Settled:**  
  - Underdetermination is inescapable (Requirement 1).  
  - Empirical equivalence ≠ semantic equivalence (Requirement 5).  
  - Not all ontologies are viable (Requirement 7).  

  **Contested:**  
  - **Whether (4a) or (4b) holds** (realists favour 4b; anti-realists 4a).  
  - **How reference is grounded** (causal theories vs. descriptivism vs. nihilism).  
  - **Whether structural realism resolves the tension** (critics say it collapses to instrumentalism).  
  - **If metaphysical neutrality is possible** (or if all theories smuggle commitments).  

  No consensus exists on these. Seminar-ready ammunition: The sealed box forces a choice between *ontic humility* (we *cannot* know) and *epistemic stubbornness* (we *might* know, but can’t verify). Most theories fail Requirement 3 by overclaiming or Requirement 4 by conflating epistemic and ontic limitations.
