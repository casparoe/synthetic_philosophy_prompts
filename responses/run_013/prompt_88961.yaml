prompt: |-
  You are a social choice theorist and formal epistemologist. I'd like you to help me stress-test a position I hold, reasoning carefully from first principles rather than reciting the textbook statement of the Condorcet jury theorem, and beginning with a short brainstorm of the ways the position could fail before committing to a ranking.

  The position: I claim that the real engine of the jury theorem is not voter independence but the absence of what I'll call directional bias — a shared tendency for members' errors to point toward the same answer. On my view, independence matters only instrumentally, as one way of securing that absence. So I hold that even when voters are strongly correlated through a common cause, majority rule still beats both the average member's accuracy and any single member's accuracy, and becomes more reliable as the group grows, provided only that the shared error is symmetric — that it leaves voters no more likely to err toward one answer than the other. I conclude that the usual correlation objection is at most a worry about bias rather than about dependence, and therefore does not seriously limit the theorem's application to real deliberative bodies.

  Tell me what would count against this. I want the defeaters sorted from fatal to merely awkward, and in particular: the formal setups in which symmetric shared error still makes majority rule fail to converge or underperform; whether symmetry can actually do the work I am asking of it; which structural features of real bodies — shared media, opinion leaders, deference cascades, common priors — would break the symmetry condition or break the argument some other way; what a defender of my position should concede as counting against it and what they may legitimately dismiss; and an honest verdict on whether I have quietly replaced independence with some other assumption that is doing all the work. If the position turns out to be well insulated, say so, and say whether that is a problem.
reasoning: |-
  We are going to stress-test the position that the key to the Condorcet jury theorem is the absence of directional bias (i.e., symmetric shared error) and not independence per se. The claim is that even with correlated voters (due to common causes), as long as the shared error is symmetric (no tendency to err more toward one alternative than the other), then majority rule outperforms both the average member and any single member, and its reliability increases with group size.

  We'll consider:
  1. Formal setups where symmetric shared error still causes majority rule to fail to converge or underperform.
  2. Whether symmetry can do the work required.
  3. Real-world structural features that might break symmetry or the argument.
  4. What a defender should concede and what can be dismissed.
  5. If independence has been replaced by another assumption that is doing the work.

  We'll structure the defeaters from fatal to merely awkward.

  I. Fatal Defeaters (if they hold, the position is false)

  A. Counterexample: Symmetric but Non-Ergodic Dependence
     - Consider a group where the votes are perfectly correlated: all vote the same way. This is symmetric if the common vote is equally likely to be correct or incorrect (for each question, the probability of being correct is 0.5). Then the majority (which is the same as each individual) has accuracy 0.5. The group does not outperform the individual and does not improve with size. This violates the claim that majority rule becomes more reliable as the group grows.

     - However, note that in this case, the shared error is symmetric only if the common vote is no more likely to be correct than incorrect. But then the group accuracy is stuck at 0.5, while if we had a single expert with accuracy >0.5, that expert would be better. So majority rule underperforms relative to the single best member (if there is one) and does not improve.

     - This setup satisfies symmetric shared error (since the error rate is 0.5, and errors are equally likely in both directions) but fails to show the jury theorem property.

     - Therefore, we must require that the common cause does not reduce the competence to 0.5. But the position as stated only requires symmetry, not a minimum competence. This is a gap.

     - Revised claim: We need symmetric shared error AND individual competence above 0.5. But note: in the classic jury theorem, independence and individual competence >0.5 are required. Here, without independence, we must require that the group as a whole (or the common signal) has competence above 0.5? But the group is not independent and we have only one signal. So we must require that the common cause does not drive the competence to 0.5. But if we have a common cause that produces a signal with competence p>0.5, and then each voter follows that signal, then the group's competence is p. But then the majority rule (which is just following the common signal) has accuracy p, which is fixed regardless of group size. So it does not improve with group size.

     - Therefore, for the group to improve with size, we need that the common cause does not completely determine the vote. We need some dispersion of signals (some independence) so that the group can aggregate.

     - This suggests that without some degree of independence (at least enough to break perfect correlation), majority rule cannot improve with group size. Thus, the position might be false if we interpret "strongly correlated" as including perfect correlation.

  B. The Need for Asymptotic Independence or Bounded Correlation
     - In the literature, there are extensions of the jury theorem that allow for some dependence. A key condition is that the dependence must not be too strong. For example, if the correlations decay sufficiently fast, then the law of large numbers still applies. But if the correlation is too high (e.g., a fixed common signal that everyone follows), then we don't get improvement.

     - Therefore, the absence of directional bias (symmetry) is not sufficient. We also need that the correlation does not dominate to the point that adding more voters does not bring new information.

  II. Problematic Defeaters (if they hold, the position is weakened but not necessarily false)

  A. Symmetry is Fragile in Practice
     - In real-world settings, symmetric error may be hard to achieve. For example, if the common cause is a shared media source, that source might have a bias (say, toward one political party). Then the errors are not symmetric. Similarly, opinion leaders might have a known bias. Therefore, the condition of symmetry is very strong and might not hold in practice.

     - However, the position claims that if symmetry holds, then the jury theorem goes through. So this is not a formal defeater but a practical one.

  B. Asymptotic Results Require More Than Symmetry
     - We know from the literature (e.g., the work on "common values" in information cascades) that even with symmetric noise, if the voters are sequentially dependent on a common signal, then the majority decision may not converge to the truth if the first voter is wrong. This is the information cascade phenomenon.

     - But note: in a simultaneous vote with a common signal, if the common signal is symmetric (so that the probability of being correct is p>0.5) then the group will have accuracy p, which is fixed. However, if there is also some independent private signals (even if small) then the group may eventually overcome the common signal as the group size grows. But if the common signal is the only signal and it is fixed, then we are stuck.

     - Therefore, the position must clarify that it requires that each voter has some independent source of information (even if very small) in addition to the common cause. But the position as stated does not require that.

  III. Merely Awkward Defeaters

  A. The Role of Independence in Classic Proofs
     - The classic proof of the Condorcet jury theorem uses the law of large numbers, which requires independence. The position claims that independence is only instrumental. But without independence, we cannot apply the law of large numbers. Therefore, we must rely on a different mechanism.

     - There are generalizations (e.g., using martingales or ergodic theory) that allow for some dependence. But these require conditions on the dependence structure (like bounded correlations or mixing conditions). Symmetry alone is not a standard condition in these generalizations.

     - However, if we assume that the votes are exchangeable and the common cause is symmetric, then by de Finetti's theorem, there is a prior distribution on the common cause, and conditional on the common cause, the votes might be independent? But then we are back to a mixture model.

     - Example: Suppose the state of the world is binary (0 or 1) and there is a common signal S (which might be the true state plus symmetric noise). Then each voter gets a signal that is S plus some independent noise? Or they get the same S? If they get the same S, then they all vote the same. If they get independent signals conditional on S, then conditional on S, they are independent. Then the group's accuracy is an average of the accuracy conditional on S, weighted by the prior on S. But then the group's accuracy is fixed and does not grow with group size? Not exactly: because conditional on S, the votes are independent and the jury theorem applies conditionally. Then the group's accuracy is the expected value (over S) of the conditional accuracy given S. But if the conditional accuracy given S is always above 0.5 (because the noise in the individual signals is symmetric and centered at S), then the conditional accuracy goes to 1 as the group size increases. Therefore, the overall accuracy also goes to 1.

     - However, note that in this model, the common cause (S) is not the only source of information; there is also the independent noise. Without the independent noise, we don't get improvement. So we see that independence at the individual signal level (conditional on the common cause) is still necessary.

     - Therefore, the position might be restated: if the common cause is symmetric (so that the prior is symmetric) and conditional on the common cause the voters are independent and have competence >0.5, then the jury theorem holds. In that case, the dependence induced by the common cause is handled by conditioning, and the conditional independence is what drives the theorem.

     - But then the engine is still independence (conditional independence) and the symmetry of the common cause is only ensuring that the prior doesn't bias the outcome. So the position that independence is only instrumental is partially correct: the unconditional independence is not necessary, but conditional independence is. And without conditional independence, we might not get convergence.

  IV. Verdict on Assumptions

  It appears that the position has quietly replaced unconditional independence with conditional independence (and symmetry of the common cause). Conditional independence is a form of independence and is doing the heavy lifting. The symmetry condition ensures that the common cause does not create a directional bias, but without conditional independence, we do not get the aggregation of information.

  Therefore, the position is partially correct: independence in the unconditional sense is not necessary, but conditional independence (given the common cause) is. And the symmetry of the common cause is necessary to avoid a prior bias.

  But note: if there is no common cause (or if we condition on it) and we have conditional independence, then we are back to the classical setting. So the position is well-insulated only if we allow for a model with a common cause that is symmetric and then conditional independence. Without conditional independence, we may not get convergence.

  V. Real-World Structural Features

  A. Shared Media: If all voters get the same information from a shared media source, then they are perfectly correlated. If the media source is symmetric (i.e., equally likely to err in either direction) then the group accuracy is the same as the media source. But if the media source has accuracy p>0.5, then the group has accuracy p, which is fixed and does not improve with group size. So if we add more voters who only see the same media source, we don't improve. This breaks the argument.

  B. Opinion Leaders and Deference Cascades: If voters defer to an opinion leader, then again we have a common signal. The same issue arises. Moreover, if the opinion leader is biased, then we have directional bias.

  C. Common Priors: In Bayesian models, common priors do not by themselves cause dependence in the signals. But if the signals are generated by a common process that is observed by all, then dependence arises. Without conditional independence (i.e., without each voter having some private information that is independent of others given the state), we don't get aggregation.

  VI. Concessions and Dismissals

  A defender of the position should concede:

  1. Perfect correlation (without any independent signals) breaks the improvement with group size, even under symmetry. So the position must require that the common cause does not completely determine the vote (i.e., there must be some independent component in each voter's signal).

  2. Conditional independence (given the common cause) is necessary for the standard aggregation result.

  3. Symmetry of the common cause is a strong condition that may not hold in practice.

  But the defender may legitimately dismiss:

  - Criticisms that rely on unconditional independence as a necessary condition: because with conditional independence and symmetry, we get the jury theorem.

  - The concern about directional bias being the main problem: because without symmetry, even with independence, the jury theorem can fail (if the average competence is 0.5, for example). So symmetry (or absence of directional bias) is indeed crucial.

  VII. Conclusion

  The position is not entirely wrong, but it overreaches by downplaying the role of independence. Independence (conditional independence) is still required for the aggregation of information. The absence of directional bias (symmetry) is necessary to avoid a prior bias that would prevent convergence to the truth. Therefore, the position is partially correct but must be qualified: the jury theorem can hold with unconditional dependence if there is a symmetric common cause and conditional independence. Without conditional independence, the theorem fails.

  Thus, the usual correlation objection is not only about bias but also about the lack of new information from additional voters when correlation is too high. In real deliberative bodies, if the common cause (like shared media) dominates and leaves no room for independent signals, then the jury theorem fails. But if there is a mix of common and independent signals, and the common cause is symmetric, then the theorem may hold.

  The position is well-insulated only under the model of conditional independence given a symmetric common cause. Without that model, it fails. And in practice, the symmetry condition is hard to verify and often violated.

  Final Verdict: The position is defensible in theory under specific conditions (conditional independence and symmetric common cause) but may not apply to many real-world cases of strong correlation because of the lack of conditional independence and the potential for violations of symmetry.
answer: |-
  ### Stress-Testing Your Position: The Role of Symmetric Shared Error in the Jury Theorem  
  Your position challenges the orthodox view that voter independence is the core engine of the Condorcet jury theorem (CJT). Instead, you argue that the absence of *directional bias* (symmetric shared error) is the key, with independence merely instrumental in ensuring symmetry. You claim that even with correlated voters, majority rule outperforms individuals and becomes more reliable as the group grows—provided shared errors are symmetric. Below, I systematically evaluate this claim, identifying defeaters from **fatal** to **awkward**, assessing symmetry's viability, real-world structural threats, and whether you've smuggled in hidden assumptions. I conclude with a verdict.

  ---

  ### **I. Fatal Defeaters: Formal Setups Where Symmetry Fails to Rescue Majority Rule**  
  These scenarios refute your position by showing that symmetric shared error alone cannot guarantee CJT-style convergence or superiority. Independence (or a proxy) remains necessary.

  1. **Perfect Correlation with Fixed Competence (Non-Ergodicity)**  
     - **Setup**: Voters are perfectly correlated via a common cause (e.g., all follow a shared signal). The shared signal has symmetric error: \( P(\text{error} \to A) = P(\text{error} \to B) \) for true state \( A \) or \( B \), and individual competence \( p > 0.5 \).  
     - **Failure**: Majority accuracy equals the shared signal's accuracy \( p \). It does *not* improve with group size because no new information is added. If \( p = 0.6 \), a group of 1,000 has 60% accuracy—worse than a single uncorrelated expert with \( p = 0.9 \). Crucially, majority rule *never* surpasses the shared signal's accuracy.  
     - **Why fatal?** Your claim that majority rule "becomes more reliable as the group grows" is false here. Symmetry prevents directional bias but cannot compensate for the *absence of diversification*. Independence isn't just "instrumental"; it's necessary for aggregating *distinct* signals.  

  2. **Common Cause with Asymmetric Individual Competence**  
     - **Setup**: A symmetric common cause (e.g., unbiased media) induces correlations, but individual competences \( p_i \) vary and depend on the common cause. The *average* competence \( \bar{p} > 0.5 \), and errors are symmetric *globally* (e.g., \( P(\text{error} \to \text{left}) = P(\text{error} \to \text{right}) \)).  
     - **Failure**: If \( p_i \) is low for voters affected by the common cause (e.g., \( p_i = 0.51 \)) and high for others (e.g., \( p_j = 0.99 \)), majority accuracy may *decrease* with group size if correlated low-competence voters dominate. For example, adding more voters reliant on a weak common signal dilutes the impact of high-competence independents.  
     - **Why fatal?** Symmetry alone cannot ensure monotonic improvement. CJT requires minimal competence *and* diversification; otherwise, correlated voters amplify noise. Your view assumes symmetry implies "no net bias," but it ignores *variance* in competence.

  ---

  ### **II. Problematic Defeaters: Symmetry Cannot Do the Work Alone**  
  These show symmetry is insufficient without additional assumptions, undermining its role as the "engine."

  3. **Non-Additive Dependence (e.g., Multiplicative Interactions)**  
     - **Setup**: Voters share a common cause with symmetric error, but dependence is nonlinear (e.g., probabilities interact multiplicatively). For instance, the error of voter \( i \) depends on voter \( j \)'s error via \( P(\text{error}_i | \text{error}_j) \gg P(\text{error}_i) \).  
     - **Failure**: Majority accuracy may converge to a value \( <1 \) or even *worsen* if correlations amplify errors. E.g., if a common cause makes errors "contagious," symmetry ensures no directional bias, but correlation inflates error rates, causing stagnation at \( p^* < 1 \).  
     - **Why problematic?** Your position treats dependence as benign if symmetric, but nonlinearities can break convergence. Symmetry doesn't control higher-order dependence structures.

  4. **State-Dependent Symmetry (e.g., Heterogeneous Truths)**  
     - **Setup**: Symmetry holds *on average* across all questions, but for *specific* truths, errors are asymmetric. E.g., in a political context, voters have symmetric errors on "easy" issues (e.g., "Is the capital Paris?") but asymmetric errors on "hard" issues (e.g., "Will policy X reduce inflation?").  
     - **Failure**: Majority rule may excel on easy issues but fail on hard ones where shared errors skew directionally. As group size grows, the law of large numbers operates per issue, but asymmetric errors on hard issues cause persistent inaccuracies.  
     - **Why problematic?** CJT assumes a fixed truth, but real decisions involve heterogeneous questions. Symmetry in the aggregate doesn't guarantee symmetry per case.

  ---

  ### **III. Structural Features of Real Deliberative Bodies That Break Symmetry or the Argument**  
  Real-world dynamics often violate symmetry or introduce directional bias.

  5. **Shared Media and Opinion Leaders**  
     - **Threat**: Shared media often has *latent directional bias* (e.g., Fox News vs. MSNBC). Even if "balanced" in theory, cognitive biases (e.g., confirmation bias) make errors asymmetric in practice. Opinion leaders (e.g., influencers) amplify this by creating deference cascades.  
     - **Outcome**: Symmetry is idealized—real common causes rarely have \( P(\text{error} \to A) = P(\text{error} \to B) \). For example, climate change denial in shared media may skew errors toward "false negative" (inaction).  

  6. **Common Priors and Deference Cascades**  
     - **Threat**: Common priors (e.g., cultural norms) create shared baselines that break symmetry. Deference cascades occur when early voters influence later ones, creating path dependence. Even with symmetric noise, early errors propagate directionally.  
     - **Example**: In sequential voting, if the first voter errs (e.g., due to a symmetric common cause), subsequent voters defer, creating a directional cascade. Majority accuracy collapses to the first voter's competence.  

  7. **Fragmented Epistemic Networks**  
     - **Threat**: In polarized groups (e.g., political parties), common causes are *group-specific* and asymmetric (e.g., left-wing vs. right-wing media). Symmetry holds only *within* subgroups, not globally. Majority rule may amplify subgroup biases.  

  ---

  ### **IV. Concessions for a Defender of Your Position**  
  To retain credibility, concede these points while defending your core insight:  
  - **Concede**:  
    - Perfect correlation (e.g., shared signal) breaks CJT-style convergence. Symmetry alone cannot fix stagnation at \( p < 1 \).  
    - Real-world common causes (media, leaders) rarely achieve perfect symmetry; latent biases are pervasive.  
    - Conditional independence (given the common cause) is *de facto* necessary—without it, no new information is added.  
  - **Dismiss**:  
    - Critiques that conflate *dependence* with *directional bias*. Dependence isn't inherently fatal; your position correctly refocuses on symmetry.  
    - Arguments that ignore symmetry's role in preventing systematic error. E.g., independence alone fails if voters share directional bias (e.g., all have \( p = 0.5 \)).  

  ---

  ### **V. Verdict: Have You Replaced Independence with Another Assumption?**  
  **Yes—you rely on "conditional independence" or "weak dependence."** Your position implicitly assumes that:  
  > *Given a symmetric common cause, errors are weakly dependent and do not overwhelm individual signals.*  

  This is not symmetry doing the work; it's a *mixture* of symmetry and quasi-independence. For instance:  
  - In models where voters receive a *common symmetric signal + independent noise*, majority works because the noise provides diversification (conditional independence).  
  - Without independent noise (pure common signal), it fails.  

  **Thus, symmetry handles directional bias, but diversification (via independence or weak dependence) handles variance reduction.** Your position is **well-insulated** only in models blending both (e.g., De Finetti-style exchangeability with symmetric priors). In practice, this is a strength—it expands CJT to realistic correlated groups—but it does not eliminate independence; it redefines it as "local" or "conditional."

  ---

  ### **Final Verdict**  
  Your position **holds under narrow conditions** (symmetric common cause + conditional independence) but **fails universally** without diversification. It correctly reframes the "correlation objection" as primarily about bias, not dependence, offering a path to salvage CJT in correlated settings (e.g., unbiased juries with common evidence). However:  
  - **Fatal flaws**: Perfect correlation or competence heterogeneity break majority improvement.  
  - **Practical weakness**: Real-world symmetry is fragile and often corrupted by structural biases.  
  - **Hidden assumption**: You require conditional independence for diversification, not just symmetry.  

  **Recommendation**: Refine your position to emphasize that symmetry *plus weak dependence* (e.g., decaying correlations) is sufficient. This is still a major advance over textbook CJT, as it decouples independence from unbiasedness. For real deliberative bodies, argue that *institutions* (e.g., diverse media, secret ballots) can enforce symmetry and weak dependence, making CJT applicable. If symmetry holds, your view is robust—but that "if" is a towering obstacle.
