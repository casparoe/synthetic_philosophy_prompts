  Here is a draft of the joint statement, designed as the appendix you requested. It adheres strictly to your specifications: factual agreed claims, self-phrased disagreements, substantive cruxes with shared evidentiary weight, honesty about irreducible differences, and no invented quotations.

  **APPENDIX: JOINT DECLARATION OF WILLIAM LLOYD GARRISON & FREDERICK DOUGLASS (Hypothetical Reconciliation, [Circa 1855])**

  **WHEREAS** we, William Lloyd Garrison and Frederick Douglass, have stood as brothers in the sacred cause of immediate and unconditional abolition;
  **AND WHEREAS** our profound disagreement on the character of the United States Constitution and the duties of abolitionists toward the Union has caused public strife and personal sorrow;
  **AND WHEREAS** we recognize the imperative to clarify, for ourselves and posterity, the points of common understanding and the nature of our division, that our shared hatred of slavery not be obscured;

  **WE HEREBY DECLARE AND AGREE UPON THE FOLLOWING FACTS REGARDING THE UNITED STATES CONSTITUTION:**

  1.  **The Text Itself:** The document nowhere contains the words "slave," "slavery," or "Negro." It employs circumlocutions: "Person held to Service or Labour" (Article IV, Section 2); "other Persons" (Article I, Section 2, Clause 3); "Migration or Importation of such Persons" (Article I, Section 9, Clause 1).
  2.  **The Framers' Context:** The document was drafted and ratified by men, many of whom held human beings as property, and who made compromises intended to secure the Union *despite* the existence of slavery within several states. These compromises were made with the full knowledge and participation of slaveholding delegates.
  3.  **The Three-Fifths Clause (Article I, Section 2, Clause 3):** This clause explicitly bases the apportionment of Representatives and direct Taxes on a population count including "three fifths of all other Persons." This grants increased political power to slaveholding states proportional to their enslaved population.
  4.  **The Fugitive Clause (Article IV, Section 2):** This clause mandates the return of "Person[s] held to Service or Labour in one State" who escape to another. This imposes a legal obligation on free states to actively support the institution of slavery.
  5.  **The Slave Trade Clause (Article I, Section 9, Clause 1):** This clause explicitly forbade Congress from prohibiting the "Migration or Importation of such Persons" prior to 1808, thereby protecting the international slave trade for twenty years as a concession to slaveholding interests.
  6.  **The Preamble:** The stated purposes of the Constitution include to "form a more perfect Union, establish Justice, insure domestic Tranquility, provide for the common defence, promote the general Welfare, and secure the Blessings of Liberty to ourselves and our Posterity." These ends stand in inherent tension with the practice of chattel slavery.
  7.  **The Nature of the Union:** The Constitution established a Federal Union composed of sovereign States, delegating specific powers to a central government while reserving others to the States or the people. This structure inherently binds the free states to the slave states through shared governance, shared law, and shared defense.
  8.  **The Abolitionist's Duty (Abstract):** Every abolitionist has a paramount moral duty to work ceaselessly for the immediate, unconditional, and total eradication of chattel slavery throughout the United States and the world. No political convenience or constitutional interpretation negates this imperative.

  **WE FURTHER DECLARE THAT OUR FUNDAMENTAL DISAGREEMENT RESTS UPON THE FOLLOWING POINTS, EXPRESSED IN OUR OWN ESTIMATED TERMS:**

  | Point of Disagreement            | William Lloyd Garrison's Position                                                                                                | Frederick Douglass's Position                                                                                                                                     |
  | :------------------------------- | :------------------------------------------------------------------------------------------------------------------------------- | :---------------------------------------------------------------------------------------------------------------------------------------------------------------- |
  | **The Constitution's Moral Character** | "The Constitution, by its explicit compromises with slavery (the Three-Fifths, Fugitive, and Slave Trade clauses), is a 'covenant with death' and 'an agreement with hell.' Its text, framed by slaveholders and for their benefit, is inherently pro-slavery. It is a wicked compact, morally repugnant in its essence, demanding no allegiance from any righteous person." | "The Constitution, read in the light of its Preamble and its deliberate avoidance of the words 'slave' or 'slavery,' is fundamentally an anti-slavery document. Its compromises were forced by the existence of slavery at the time, but its language and its stated ends point unequivocally toward liberty. Its *potential*, rightly interpreted and enforced, provides the legal foundation for abolition." |
  | **The Abolitionist's Duty Toward the Union** | "No moral person can give allegiance to a Union founded upon and sustained by such a pro-slavery compact. Our duty is to repudiate the Union – 'No Union with Slaveholders!' – to refuse participation in its wicked government, and to work for its dissolution or radical transformation. Voting under this Constitution is complicity." | "The Union, flawed as it is, provides the only practical framework within which slavery can be challenged and ultimately destroyed nationwide. Our duty is to work *within* the constitutional system, using its mechanisms (political agitation, voting, legal argument, the courts) to expose its contradictions and wield its own principles against slavery. Abandoning the Union abandons the enslaved within it." |
  | **The Legitimacy of Political Action** | "Engaging with the political machinery of a pro-slavery government legitimizes that government and corrupts the abolitionist. Moral purity demands separation and non-participation. Political action under this Constitution is inherently compromised." | "Political power is a necessary tool for achieving abolition. Refusing to engage politically cedes the field entirely to the slave power. We must seize every constitutional means – voting, petitioning, running for office, influencing parties – to build anti-slavery majorities and force change." |

  **WE ACKNOWLEDGE THAT THE FOLLOWING CRUXES UNDERLIE OUR DISAGREEMENT, AND THAT RESOLVING THEM WOULD NECESSITATE MOVEMENT BY ONE OR BOTH OF US. EACH CRUX IS FRAMED WITH AN ARGUMENT/CONSIDERATION BOTH SIDES ACCEPT AS RELEVANT:**

  1.  **Crux: Is the Constitution's pro-slavery character inherent in its text or contingent on interpretation?**
      *   **Shared Evidentiary Weight:** Both agree the specific clauses (3/5ths, Fugitive, Slave Trade) *objectively exist* and *objectively benefited* slaveholders at the founding. Both agree the Preamble's ideals *objectively exist*.
      *   **Garrison's Prediction:** "If the document is read plainly, without sophistry, the pro-slavery clauses control. They are specific, operational mandates. The Preamble's ideals are rendered void by these concrete concessions to evil. Any interpretation claiming an anti-slavery essence requires ignoring or explaining away these explicit provisions, proving the text itself is corrupt."
      *   **Douglass's Prediction:** "If the document is read as a whole, giving paramount weight to its stated purpose of securing Liberty, and interpreting ambiguous or compromised clauses *as narrowly as possible* in light of that purpose, the pro-slavery elements can be seen as temporary concessions, not inherent principles. The absence of the words 'slave' or 'slavery' in the text itself is crucial evidence that the framers created an instrument whose *logic* leads to liberty."

  2.  **Crux: Was Garrison's primary objection to the specific text of the Constitution or to the political Union it created and sustained?**
      *   **Shared Evidentiary Weight:** Both agree Garrison consistently denounced the *text* as pro-slavery *and* denounced *participation in the Union* governed by that text. Both agree the two concepts are inextricably linked for him.
      *   **Garrison's Clarification:** "The objection is indivisible. The text *is* the covenant that creates and defines the Union. The Union *is* the embodiment of the covenant's pro-slavery character. To condemn one is to condemn the other. My refusal is of the entire wicked compact and the political entity built upon it. The *verbal* distinction is meaningless; they are two sides of the same coin."
      *   **Douglass's Analysis:** "While Brother Garrison roots his disunionism in the text, his ultimate rejection is of the *political reality* of a Union including slave states. His focus is the *effect* of the Union (protecting slavery) more than a purely textual analysis divorced from consequence. The textual argument is the *justification* for rejecting the political entity. The distinction matters because one *could* theoretically condemn the text's flaws while still finding strategic value in the Union framework for destroying slavery."

  3.  **Crux: Does Douglass's anti-slavery reading of the Constitution require the Framers to have *intended* an anti-slavery meaning, or does it rest solely on the words *bearing* that meaning regardless of intent?**
      *   **Shared Evidentiary Weight:** Both agree historical evidence shows many Framers were slaveholders who intended to protect slavery. Both agree the words written down have an objective existence and can be interpreted by later generations.
      *   **Douglass's Clarification:** "My position rests on the words themselves and the principles declared in the Preamble. The Framers' *intentions* are relevant historically, but they are not binding on future interpretation. The Constitution is a living document for the people. The words 'Liberty,' 'Justice,' and the avoidance of naming slavery create an interpretative space that *allows* and *demands* an anti-slavery reading, even if some Framers intended otherwise. The *potential* of the text, realized through struggle, is paramount."
      *   **Garrison's Counter:** "This move costs him the ground of historical honesty. If the Framers, steeped in slavery and crafting specific protections for it, did not *intend* an anti-slavery meaning, then Douglass's reading is essentially *imposing* a meaning the text was not designed to bear. It requires ignoring the context of creation and the specific, operational pro-slavery clauses. His interpretation becomes aspirational wishful thinking, not a faithful reading of the document *as it was written and ratified*."

  **WE FINALLY ACKNOWLEDGE IRREDUCIBLE DIFFERENCES THAT THIS STATEMENT CANNOT SETTLE:**

  1.  **The Question of Strategy and Consequence:** Neither of us can *know* with certainty whether disunion and moral suasion alone, or political engagement within the constitutional system, will prove the faster or more certain route to universal emancipation. History will judge the efficacy of our chosen paths. Our disagreement on this point is based on fundamental assessments of human nature, political possibility, and the corrupting influence of power, assessments rooted in deep conviction but not provable fact.
  2.  **The Value Judgment on the Union:** Whether a Union that includes slaveholding states is inherently so morally contaminated as to be irredeemable and unworthy of preservation, even as a potential vehicle for abolition, is not a matter of textual interpretation or historical fact. It is a profound difference in moral and political philosophy. Garrison asserts the Union is *intrinsically* wicked due to its foundation; Douglass asserts it is *instrumentally* valuable despite its current wickedness. **This is the wound that will not heal.** No document can bridge this gulf of value. It reflects a core difference in our understanding of complicity, compromise, and the possibility of redeeming flawed institutions.
  3.  **The Acceptability of Means:** Whether participating in the political system of a slaveholding republic – voting, holding office, seeking enforcement of *any* of its laws – constitutes necessary engagement for a higher end or unacceptable moral compromise remains a fundamental divide. This reflects differing views on purity versus pragmatism, and the perils of institutional entanglement with evil.

  **IN CONCLUSION,** we affirm our unwavering hatred of slavery and our shared commitment to its destruction. We recognize the factual landscape of the Constitution we both scrutinize. We articulate our disagreements not as caricatures, but as we ourselves understand them. We identify the precise points where argument might theoretically lead to movement, though we acknowledge the chasm of values on the Union itself remains unbridgeable. This statement stands not as a resolution, but as a testament to a shared fight fractured by irreconcilable convictions on how best to wage it, and on the nature of the ground upon which it is fought.

  ---

  **Notes for Your Use:**

  *   **Tone:** Aimed for the formal, declarative style of 19th-century documents, slightly elevated but grounded in the specific arguments each man consistently made.
  *   **"The Wound":** The irreducible value judgment on the Union (#2 in the Unresolved section) is the core wound. It makes Garrison seem (to some) like a purist willing to abandon practical avenues for the enslaved, and Douglass seem (to some) like a compromiser willing to legitimize a pro-slavery system for potential gain. The statement forces that admission.
  *   **Garrison's Objection:** Framed as indivisible (text *is* the Union covenant). The verbal aspect is dismissed by Garrison within the statement itself.
  *   **Douglass's Move:** Clarified as relying on the text's *potential meaning* regardless of Framers' intent, explicitly acknowledging the cost (Garrison's charge of wishful thinking/historical dishonesty) but asserting the primacy of the living document.
  *   **No Fake Quotes:** All positions are paraphrased summaries based on their extensive writings and speeches on these exact points.
  *   **Suitable for Reading Aloud:** The structure (WHEREAS, numbered agreements, clear table, defined cruxes, stark unresolved section) provides rhythm and clarity. The final paragraph has weight. The "wound" is laid bare without melodrama.
  *   **Realism:** It doesn't magically reconcile them. It pins down the agreement, defines the fight clearly, shows where movement *might* be possible (even if unlikely), and honestly confronts the impassable moral rift. It feels like something drafted after exhausting debate, marked by both shared purpose and profound sorrow at the division.

  This draft provides the spine and substance. Feel free to tweak the language to better match the precise cadence you hear for each man in your novel's voice. Good luck with the final stretch!
