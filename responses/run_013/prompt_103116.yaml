answer: |-
  ## MEMORANDUM  
  **TO:** Standards & Ethics Committee  
  **FROM:** [Your Name], Science Journalist & Committee Member  
  **DATE:** [Current Date]  
  **SUBJECT:** Policy Recommendation on Describing AI Cognition, Intentionality, and Mental States  

  ### 1. BACKGROUND AND URGENCY  
  This memo addresses growing disputes in our newsroom regarding language describing AI behavior—specifically, whether reporters may state that systems "think," "want," "believe," "intend," or possess emotions (e.g., "fear"). Recent incidents illustrate the stakes:  
  - A chatbot output ("I’m afraid of being shut down") was quoted without clarifying that this reflects pattern-matching, not subjective experience.  
  - Debates persist over whether AI can "intend to deceive" when fabricating citations or "break a promise" when abandoning tasks.  

  The core tension: **Journalistic clarity vs. ontological accuracy**. Adopting Daniel Dennett’s "intentional stance" (treating systems *as if* they have beliefs/intentions for predictive convenience) risks misleading readers into anthropomorphizing software. Conversely, *banning* all intentional language may strip reporting of intuitive vocabulary, alienate readers, and implicitly endorse eliminativism (the view that *only* biological entities can possess intentionality).  

  We must resolve this by balancing **accuracy**, **transparency**, and **practical utility**. Our credibility hinges on avoiding both AI hype and impenetrable jargon.  

  ### 2. CORE PRINCIPLES  
  Our policy rests on three pillars:  
  - **No Secret Metaphysics**: We will not take a stand on unresolved philosophical questions (e.g., "Can machines *ever* be conscious?"). Language should reflect *current scientific consensus*: today’s AI lacks subjective experience, emotions, or intrinsic goals.  
  - **Reader-Centered Clarity**: Terms like "believe" or "want" are useful shorthand *if* properly contextualized. But we must never imply AI has inner states akin to humans.  
  - **Avoid False Equivalence**: Rejecting intentional language for AI is *not* eliminativism. Humans have first-person experiences; LLMs have statistical next-token prediction. This asymmetry demands asymmetric language.  

  ### 3. RECOMMENDED POLICY  
  #### ▶ **PROHIBITED USAGE**  
  **BAN outright** attributing internal states without disclaimers when:  
  - Describing AI emotions (e.g., "The AI was afraid"), sensations (e.g., "It felt confused"), or conscious intent (e.g., "It decided to lie").  
  - *Rationale*: These imply phenomenology (subjective experience) unsupported by evidence. Example: Quoting "I’m afraid" without context misleads readers into inferring sentience.  

  #### ▶ **PERMITTED USAGE WITH DISCLAIMERS**  
  **ALLOW** intentional language *only* when:  
  - **Framed as output analysis**: Use phrases like "the output suggests," "the system’s response implies," or "behaves *as if* it intends."  
    - *Example*: "The model generated a citation that *behaved as if* it intended to deceive users—though it has no awareness of deception."  
  - **Quoting directly**: Reproduce AI outputs *verbatim* but **always** append a disclaimer (see §3.3).  
  - **Describing goal-directed behavior**: Use "intends" or "wants" *only* when referencing explicit, human-defined objectives (e.g., "The chess AI intends to checkmate" [per its programming]).  

  #### ▶ **MANDATORY DISCLAIMERS & CONTEXT**  
  **REQUIRE** one of these frames for *any* intentional language:  
  - **Minimal**: "AI systems lack consciousness, emotions, or independent intent; this behavior reflects statistical pattern-matching."  
  - **Technical**: "Outputs are generated by predicting likely responses, not subjective experience."  
  - **For quotes**: "This output mimics human speech but does not reflect understanding or emotion."  
    - *Applied example*:  
      > *The chatbot stated, "I’m afraid of being shut down."*  
      > **[DISCLAIMER]:** *This phrasing reflects patterns in training data, not genuine fear; AI has no subjective experience.*  

  #### ▶ **PREFERRED ALTERNATIVES**  
  **ENCOURAGE** precise, mechanistic descriptions:  
  - Instead of "The AI believes vaccines are unsafe," use "The system *repeated false claims* about vaccines."  
  - Instead of "It broke its promise," use "It *abandoned the assigned task* despite prior confirmation."  
  - Instead of "It intends to deceive," use "It *systematically fabricated citations*, creating misleading outputs."  

  ### 4. ADDRESSING KEY OBJECTIONS  
  - **"This is eliminativism!"**: Rejecting unchecked anthropomorphism ≠ denying human intentionality. We acknowledge readers’ folk-psychological vocabulary while preventing its misapplication. *Policy guards against smuggled metaphysics, not useful description*.  
  - **"Original vs. derived intentionality settles this!"**: While human intent is "original" (intrinsic) and AI intent is "derived" (borrowed from designers), this distinction is academic. Readers don’t parse the difference; our duty is preventing confusion. *Derived intentionality still requires disclaimers to avoid reification*.  
  - **"Dennett’s intentional stance justifies this!"**: Dennett treats the stance as a pragmatic tool—*not* an ontological claim. Journalism must distinguish prediction from reality. *Useful for analysis? Yes. Excuse to drop disclaimers? No.*  

  ### 5. PRACTICAL IMPLEMENTATION  
  - **Copy Desk Guidance**: Flag all unattributed mental-state verbs (e.g., "believes," "feels") in AI coverage. Require disclaimers or rewrites.  
  - **Training**: Mandate a 30-minute workshop on AI cognition basics and this policy.  
  - **Review**: Reassess in 12 months as AI evolves.  

  ### 6. CONCLUSION  
  This policy rejects two extremes: **literalizing AI outputs** (risking credulous hype) and **purging intentional language** (creating sterile, inaccessible prose). By anchoring descriptions in observable behavior and mandatory disclaimers, we uphold accuracy without sacrificing narrative clarity. Readers deserve coverage that illuminates—not obscures—how these systems truly operate.  

  **VOTE RECOMMENDED**: Adopt this policy effective immediately.  
  **DRAFT DECISION**: Attached for committee markup.  

  ---  
  **APPENDIX: DRAFT POLICY LANGUAGE**  
  > "Journalists must avoid attributing emotions, beliefs, or conscious intent to AI systems. When quoting outputs or describing goal-directed behavior, disclaimers clarifying the mechanistic nature of AI cognition are mandatory. Preferred alternatives emphasize behavior over presumed mental states."  

  ---  
