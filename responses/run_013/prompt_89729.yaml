  ### Decision Tree for Moral Uncertainty

  **Root: Start with fixed commitment: moral realism, uncertainty, and distributed credences.**

  1. **Q1: Does moral uncertainty give you an independent reason to hedge (i.e., act differently from your highest-credence theory)?**
     - **No** → Leaf: **No-Hedging**  
       *Most awkward commitment:* Ignores catastrophic risks from low-credence theories (e.g., 45% credence in a theory that condemns your action as evil).  
     - **Yes** → Proceed to Q2.

  2. **Q2: Can choiceworthiness be numerically compared across theories?**  
     - **No** → Proceed to Q3.  
     - **Yes** → Proceed to Q4.  

  3. **Q3: Does dominance reasoning apply (i.e., is there an action permissible or not forbidden by all theories)?**  
     - **Yes** → Leaf: **Dominance/Maximality**  
       *Most awkward commitment:* Paralyzed if theories conflict irreconcilably (e.g., no action is permissible under all).  
     - **No** → *Incoherent branch:* Without comparability or dominance, no non-arbitrary action-guidance exists.  

  4. **Q4: How should aggregation handle a tiny credence (e.g., 0.01%) in a theory with extreme demands?**  
     - **Discount it entirely** → Leaf: **Highest-Credence-Wins**  
       *Most awkward commitment:* Treats a 34.9% theory as decisively superior to a 34.8% theory, ignoring near-ties.  
     - **Amplify it via scaling** → Leaf: **MEC (Unnormalized)**  
       *Most awkward commitment:* A 0.01% credence in a theory that values $1 as worth 1 billion utils demands you give away everything.  
     - **Normalize scales first** → Proceed to Q5.  
     - **Cap its influence via voting/bargaining** → Proceed to Q6.  
     - **Avoid worst-case via pessimism** → Leaf: **Maximin Aggregation**  
       *Most awkward commitment:* Sacrifices massive expected gains to avoid minuscule risks (e.g., rejecting a 99.99% chance of saving 1 billion lives to avert a 0.01% chance of causing minor harm).  

  5. **Q5: How should theories be normalized for aggregation?**  
     - **Zero and unit based on possible worlds** → Leaf: **MEC (Normalized)**  
       *Most awkward commitment:* Normalization is arbitrary if theories have unbounded or undefined choiceworthiness ranges.  
     - **Treat theories as bargainers with proportional gains** → Leaf: **Bargaining Model**  
       *Most awkward commitment:* Requires an arbitrary "disagreement point" (e.g., what happens if bargaining fails).  

  6. **Q6: How should conflicting theories resolve disputes?**  
     - **Vote on actions** → Leaf: **Parliamentary Model**  
       *Most awkward commitment:* Voting cycles may produce no consistent winner (e.g., volunteer > study > rest > volunteer).  
     - **Seek mutual advantage** → *Same as Bargaining Model above* (tree cannot separate; see "Unseparated Leaves" below).  

  ---

  ### Table of Logical Space  
  *Rows: Major positions. Columns: Key features. "✗" = unoccupied.*  

  | Position                 | Credence-Responsive? | Handles Tiny Extreme Credence? | Normalizes Scales? | Binding Future Self? | Portfolio-Hedging Licensed? |  
  |--------------------------|----------------------|--------------------------------|-------------------|----------------------|-----------------------------|  
  | **No-Hedging**           | Weakly (only for top theory) | Ignores it (✗)             | No                | Only if top theory says so | Only if top theory says so  |  
  | **Dominance/Maximality** | No                   | Only if it forbids dominance   | No                | No                    | Rarely (if dominant action) |  
  | **Highest-Credence-Wins**| Yes                  | Ignores it (✗)                | No                | No                    | Only if top theory says so  |  
  | **MEC (Unnormalized)**   | Yes                  | Amplifies it to extremes       | No                | Yes                   | Yes (if MEC-optimal)        |  
  | **MEC (Normalized)**     | Yes                  | Tempers via scaling            | Yes               | Yes                   | Yes (if MEC-optimal)        |  
  | **Parliamentary Model**  | Yes                  | Caps via voting power          | Implicitly (✗)   | Unclear (✗)          | Yes (if votes support it)   |  
  | **Bargaining Model**     | Yes                  | Caps via bargaining power      | Yes               | No                    | Only as a bargaining chip   |  
  | **Maximin Aggregation**  | Yes                  | Ignores below threshold (✗)   | No                | No                    | Only if it avoids worst-case |  
  | **Unoccupied**           | ✗ Credence-inert + Normalization | ✗                               | ✗                 | ✗ Allowing binding + Parliamentary | ✗ Portfolio-first without action-hedging |  

  - **Diagnoses of Unoccupied Combinations:**  
    - *Credence-inert + Normalization:* Incoherent. Normalization requires credences to weight scales.  
    - *Binding + Parliamentary:* Unexplored. Voting models rarely address intertemporal commitment.  
    - *Portfolio-first without action-hedging:* Unattractive. Avoiding action-hedging (e.g., "do a bit of everything") while prioritizing option-preservation is self-undermining.  

  ---

  ### Unseparated Leaves  
  The tree cannot distinguish:  
  - **Bargaining Model** and **Parliamentary Model** when normalization is implicit.  
    - *Separating question:* "Must collective decisions satisfy Arrow’s independence of irrelevant alternatives (IIA)?"  
      - **Yes** → Parliamentary (voting models often violate IIA).  
      - **No** → Bargaining (prioritizes Pareto efficiency over IIA).  

  ---

  ### Most Impactful Branch  
  **Q2 (Comparability of Choiceworthiness)** does the most work:  
  - Splits the tree into fundamentally distinct methodologies (dominance vs. aggregation).  
  - Determines whether moral uncertainty reduces to risk management (if comparable) or structural constraints (if not).  
  - Affects every case test (e.g., insects case fails without comparability).  

