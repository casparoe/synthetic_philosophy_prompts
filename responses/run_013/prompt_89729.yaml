  ### Case Tests for All Leaves  
  *All cases assume 50% credence in each theory unless specified.*  

  | Position                 | Free Saturday (A: volunteer, B: study, C: rest) | Tiny Credence (0.01% theory: give everything) | Insect Split (A: bugs matter hugely, B: bugs don’t matter) | Binding Future Self |  
  |--------------------------|------------------------------------------------|---------------------------------------------|----------------------------------------------------------|---------------------|  
  | **No-Hedging**           | Follow highest-credence (e.g., A: volunteer)   | Ignore; keep assets                         | Follow highest-credence (e.g., if A>50%, avoid pesticides) | Act on current view |  
  | **Dominance**            | Only if one action non-forbidden by all        | Only if keeping assets is non-forbidden     | No action (if A forbids killing, B forbids inaction)     | No binding          |  
  | **Highest-Credence-Wins**| Follow top theory (e.g., A: volunteer)         | Ignore; keep assets                         | Follow top theory (e.g., A: save bugs)                   | Act on current view |  
  | **MEC (Unnormalized)**   | Weighted average (e.g., mostly study if B has high scale) | Give everything (demanding theory dominates) | Mostly follow A (if scale large)                         | Bind to current MEC |  
  | **MEC (Normalized)**     | Balanced compromise (e.g., study + volunteer)  | Keep assets (scaling tempers demand)        | Moderate protection (averaged scales)                    | Bind to current MEC |  
  | **Parliamentary**        | Majority vote (e.g., rest if B+C > A)          | Keep assets (extreme theory outvoted)       | Follow majority (e.g., no protection if B wins)          | No binding          |  
  | **Bargaining**           | Nash solution (e.g., study if most mutually beneficial) | Compromise (e.g., donate 10%)             | Bargained protection (e.g., save some bugs)              | No binding          |  
  | **Maximin Aggregation**  | Avoid worst theory’s forbidden action (e.g., rest if C forbids work) | Keep assets (ignore tiny credence)        | Follow strongest minimax demand (e.g., save bugs)        | No binding          |  

