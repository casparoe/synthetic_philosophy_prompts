prompt: |-
  My sister's gotten really into animal welfare stuff and she's ended up somewhere I can't argue her out of. Her whole position is that eating beef is basically fine, eating factory-farmed chicken is the worst thing you can do, and going vegan might be worse than both. Her reasoning: a cow is one animal and feeds you for months, while a chicken feeds you for like two dinners, so per meal you're racking up way more chicken deaths than cow deaths. And for the vegan thing, she says if you're seriously trying to kill the fewest animals you have to count all the mice and rabbits and whatever else gets chewed up by the combines at harvest, and that a field of grass a cow just eats off of doesn't kill anything — so in her head veganism comes out worse than beef. She's also got this bit where she says the mice aren't living great lives anyway, nature is basically a bloodbath, so I shouldn't be picturing happy little field mice. She's kind of smug about all of it and I feel like theres something off, but every time I push back she just says I'm doing the counting wrong. Is she actually right? And if she is, does that really mean I should be eating beef instead of beans? That feels insane to me.
