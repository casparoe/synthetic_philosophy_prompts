  The core ask is for a short story set in a near-future port city where this substitution system is normalized. Key elements they want woven in: the legal/class stratification aspect, the signed moral ledger document, a substitute who's paradoxically more morally deserving than the offender, and crucially - two contrasting scenes where both retributivist and consequentialist perspectives feel viscerally true. They're adamant about avoiding theoretical exposition; the philosophy must emerge from lived experience.

