  For texture: the going rate ($120k/year?) mentioned casually during contract talks, the sister's furious but helpless reaction showing how poverty constricts choices. And absolutely including that line about transferring "the moral ledger itself" - that's the retributivist nightmare in bureaucratic language.

  User's clearly sophisticated - they reference unfair advantage theory without naming it - so the story shouldn't patronize. The moral complexity should hum in quiet moments: the substitute washing dishes while contemplating selling her life, the offender's expensive perfume lingering on the contract. Ending on the sister's visit maintains ambiguity; her tears accuse the system while the substitute's resolve highlights its grim utility.

  Noticing they want "no neat verdict" - wise. The power here is in sustaining the tension. Maybe close on the substitute tracing her daughter's healed scar, leaving the reader to sit with both the injustice and the necessity of her choice. The physics metaphor ("drain the poison") suggests they'll appreciate systems thinking made flesh. 

  Biggest risk is over-explaining. Must trust the images: the empty chair at family dinners, the legal document that literally reassigns guilt. Those carry the theory better than any debate. User's provided such rich parameters - this feels like crafting a puzzle box where philosophy clicks open through story mechanics.
