  ### Joint Statement: Adversarial Collaboration on Kavka's Toxin Puzzle Variant  

  **Preamble**  
  This document represents an adversarial collaboration between the broad-intention camp ("Broad Camp") and the narrow-intention camp ("Narrow Camp") in the philosophy of action. We address a variant of Kavka’s toxin puzzle:  
  - A billionaire offers a reward at **t1** if a reliable lie detector confirms the agent intends to drink a non-lethal toxin at **t2**.  
  - The agent knows that at **t2**, a drug will erase this intention and eliminate all motivation to drink or claim the reward.  
  - The reward is paid solely based on the **t1** intention, regardless of whether the agent drinks at **t2**.  

  Both camps agree on the following claims but disagree on key philosophical interpretations. Disagreements focus on three *cruxes*, with predictions based on agreed-upon arguments.  

  ---

  ### I. Agreed Claims  
  Both camps endorse the following statements about the puzzle, intention, and rationality:  

  1. **Puzzle Setup**:  
     - The variant eliminates the standard incentive to *avoid* drinking the toxin (since the drug ensures indifference at **t2**).  
     - The agent’s sole motivation to form the intention at **t1** is to gain the reward, knowing drinking will not occur.  

  2. **Intention Formation**:  
     - Forming the intention at **t1** is *instrumentally rational* if possible, as it yields the reward without requiring action.  
     - The lie detector reliably detects the agent’s mental state at **t1**, but its verdict does not resolve whether this state is a "genuine intention."  

  3. **Belief-Action Disconnect**:  
     - At **t1**, the agent believes they will not drink at **t2** due to the drug’s effect. This belief is consistent with rational foresight.  

  4. **Limits of Self-Manipulation**:  
     - Strategic reasoning (e.g., self-promises or incentives) may influence intention formation, but its success is contingent on the nature of intention.  

  5. **Philosophical Significance**:  
     - The puzzle tests whether intention requires a *current commitment to act* or can be a momentary state detached from future behavior.  
     - It illuminates tensions between rationality (e.g., maximizing utility) and conceptual constraints on intention.  

  ---

  ### II. Disagreements  
  The table below outlines unresolved disagreements. Each camp’s position is stated in its preferred wording, and predictions are based on an agreed-upon argument/case for each crux.  

  | Crux | Agreed Case/Argument | Broad-Intention Camp Position | Narrow-Intention Camp Position |  
  |------|----------------------|-------------------------------|--------------------------------|  
  | **1. Intention entails a disposition to act**<br>*Does genuine intention require a present disposition to perform the intended action?* | **Case**: An agent vows to quit smoking at **t1** but knows a hypnotist will remove their urge at **t2**. The agent feels no current resistance to smoking (no disposition to act on the vow).<br><br>**Argument**: If intention entails a disposition to act, the agent cannot intend to quit *now* if they lack any present motivation to avoid smoking. Both camps agree this case tests whether disposition is necessary. | "Intention does not entail a disposition to act. One can intend to A at **t2** while lacking any present disposition to A, provided the intention is formed for strategic reasons (e.g., the toxin reward). In the smoking case, the agent genuinely intends to quit at **t1** despite the known future hypnosis."<br><br>**Prediction**: In the toxin variant, the agent *can* form the intention because disposition is not required. | "Intention necessarily entails a present disposition to act. Without a current motivational tendency toward the action (even if defeasible), the mental state is not an intention. In the smoking case, the agent merely *wishes* or *hopes* to quit but does not *intend* to, as they lack a disposition to act."<br><br>**Prediction**: In the toxin variant, the agent *cannot* form a genuine intention because they lack any disposition to drink. |  
  | **2. Intending what one believes one will not do**<br>*Can one intend to A while believing one will not A?* | **Case**: A procrastinator resolves to start a task today (**t1**) but believes they will delay it until tomorrow (**t2**) due to habit. They experience no contradiction in their mental state.<br><br>**Argument**: Both camps agree this case tests if belief-action consistency is constitutive of intention. The toxin variant parallels this, but with externally guaranteed inaction. | "One can intend to A while believing one will not A, as intention is a practical commitment independent of predictive belief. In the procrastinator case, the agent genuinely intends to start now despite their belief in failure. Similarly, in the toxin puzzle, the agent can intend to drink at **t2** while believing they will not."<br><br>**Prediction**: The toxin-puzzle agent forms the intention, as belief-intention disconnect is possible. | "One cannot intend to A while believing one will not A, because intention generates a rational commitment to act that conflicts with outright beliefs about inaction. In the procrastinator case, the ‘intention’ is a self-deceptive pretense; true intention requires belief that one *will* act (or no belief that one *will not*)."<br><br>**Prediction**: The toxin-puzzle agent fails to form the intention, as belief in inaction precludes intention." |  
  | **3. Strategic self-manipulation produces genuine intention**<br>*Can instrumental reasoning (e.g., for a reward) create a genuine intention?* | **Case**: An actor methodically cultivates anger for a role (**t1**) by recalling past grievances. They succeed in feeling genuine anger but know it will dissipate after the performance (**t2**).<br><br>**Argument**: Both camps agree this case illuminates whether self-induced states can mirror non-instrumental states (e.g., intention vs. anger). The toxin variant tests if self-manipulation for reward yields intention. | "Strategic self-manipulation can produce genuine intention, as intention is defined by its functional role in planning, not its etiology. In the actor case, the anger is real despite its instrumental origin. In the toxin puzzle, the agent’s instrumental reasoning generates a genuine intention to drink."<br><br>**Prediction**: Self-manipulation succeeds; the agent forms a real intention detectable by the lie detector." | "Strategic self-manipulation cannot produce genuine intention because intention requires non-instrumental practical commitment. The actor’s anger is a controlled simulation, not genuine emotion. Similarly, toxin-puzzle ‘intention’ is a temporary pretense, not a commitment to act."<br><br>**Prediction**: Self-manipulation fails; the agent only simulates intention, undetected by the lie detector as genuine." |  

  ---

  ### Conclusion  
  This collaboration clarifies shared ground and precise disagreements. The Broad Camp maintains that the toxin variant demonstrates intention’s detachability from action due to its compatibility with strategic belief-disconnect and self-manipulation. The Narrow Camp denies this, arguing that intention’s conceptual ties to disposition, belief consistency, and non-instrumental commitment preclude detachment. Both camps commit to revisiting predictions based on empirical work (e.g., cognitive science studies of intention) and conceptual analysis of edge cases.  

  ---  
  **Signed**,  
  *Representatives of the Broad-Intention Camp*  
  *Representatives of the Narrow-Intention Camp*  
