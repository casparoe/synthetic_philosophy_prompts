prompt: |-
  A funder has asked you to design the research agenda for a five-person, three-year project on the frame problem: two philosophers of mind, one logician, and two engineers who build tool-using language-model agents. The aim is work that will still matter in a decade, and the deliverable is a defended agenda, not a survey of the literature. You have no access to sources, so argue from the structure of the problem rather than citing anyone.

  To fix vocabulary, the project's founding note proposes splitting the traditional difficulty into three questions. Treat this split as a proposal to be attacked, not as a received taxonomy.

  (a) The discovery question: given an action and a description of a situation, how does a system determine which features of that situation bear on what follows?

  (b) The maintenance question: once relevance has been settled, how does a system keep its representation of the world current without recomputing everything at every step, and what licenses the locality assumptions that make this possible?

  (c) The recursion question: if a system must choose its own description before it can compute consequences, then framing is itself an action, selected under the very uncertainty it was meant to reduce. On this reading framing is not a preprocessing step but a control problem, and it recurses.

  For a contemporary language-model agent — retrieval, tools, long context — the three questions reappear in unfamiliar clothes. Relevance is a learned salience rather than a set of axioms, so a relevance judgment cannot be audited in the way an axiom can. The frame is set implicitly by tokenization, prompting, and retrieval, so the agent may never represent the choice at all. And the cost of a bad frame is paid in attention rather than in search, which changes what counts as a failure and what a repair would even look like.

  Answer the following. First, which open questions in this area most deserve the project's effort? Generate the candidate set yourself, then rank it. Second, for each ranked question, explain why it is upstream of the others, how tractable it is for this particular mixed team, how neglected it is, and what argument or result in the next two years would move it up or down. Third, state your ranking criteria and their weights, the trade-offs among them, what you deliberately excluded, and what would change the ranking. Fourth, rule on two disputes: does the three-way split survive scrutiny, or does one of (a) through (c) absorb the others? And is the frame problem, so posed, still a live problem for language-model agents, or has scale dissolved it — and if it has, what residue remains?

  Return a single JSON object and nothing else, with these fields.

  `agenda_statement`: one paragraph stating the agenda you are recommending.
  `criteria`: array of objects with `criterion`, `definition`, `weight` (0 to 1, summing to 1 across the array), and `why_this_weight`.
  `candidates_considered`: array of objects with `id` (short slug), `question` (one sentence), `subproblem` (discovery, maintenance, recursion, or other), `subproblem_note` (one line), and `would_be_settled_by` (what kind of result or argument would count as progress).
  `ranking`: array of objects with `rank` (integer), `id`, `defense` (two to four sentences justifying its position relative to the entries below it), `upstream_of` (array of ids), `tractability` (object with `for_philosophers` and `for_engineers`, each 0 to 1, plus `note`), `neglectedness` (0 to 1 plus a one-line note), and `confidence_in_placement` (0 to 1).
  `dependency_map`: array of objects with `from_id`, `to_id`, `relation` (presupposes, constrains, partially_answers, or independent), and `note`.
  `tradeoffs`: array of objects with `between` (two ids or two criterion names), `tension`, and `how_resolved`.
  `excluded`: array of objects with `candidate` and `reason`.
  `what_would_change_the_ranking`: array of objects with `trigger` (an argument, result, or capability shift) and `effect` (which ids move and in which direction).
  `split_verdict`: object with `survives` (boolean), `collapses_into` (id or null), and `note`.
  `dissolution_verdict`: object with `dissolved` (boolean), `residual_problem`, and `note`.
  `least_confident_judgment`: object with `claim`, `confidence` (0 to 1), and `what_would_shift_it`.
  `bottom_line`: one or two sentences.

  Keep every string field compact and argumentative; no field should contain a literature review.
reasoning: |-
  We are designing a research agenda for a three-year project on the frame problem as applied to contemporary language-model agents. The team consists of two philosophers of mind, one logician, and two engineers building tool-using language-model agents.

  The frame problem is split into three questions:
  (a) Discovery: determining which features of a situation bear on the consequences of an action.
  (b) Maintenance: updating the world representation efficiently without recomputing everything, and the locality assumptions that license this.
  (c) Recursion: framing as a control problem because the system must choose its own description, and this choice is made under uncertainty.

  In the context of language-model agents (with retrieval, tools, and long context), these issues appear differently. Relevance is learned salience (not axiomatic), framing is set implicitly (via tokenization, prompting, retrieval), and the cost of a bad frame is paid in attention (not search).

  We are to:
  1. Generate and rank open questions that deserve the project's effort.
  2. For each ranked question, explain:
     - Why it is upstream of others.
     - Tractability for the mixed team (for philosophers and engineers separately, 0-1).
     - Neglectedness (0-1).
     - What would move it up or down in the next two years.
  3. State ranking criteria and their weights, trade-offs, what was excluded, and what would change the ranking.
  4. Rule on two disputes:
     - Does the three-way split survive, or does one absorb the others?
     - Is the frame problem still live for LM agents, or has scale dissolved it? If dissolved, what residue remains?

  We return a single JSON object with the specified fields.

  ### Step 1: Generate Candidate Questions
  We brainstorm candidate open questions, mapping them to the three subproblems (a, b, c) or "other". We focus on the contemporary LM agent context.

  Candidate Questions:

  1. **Implicit Relevance Learning**: How can we characterize and audit the relevance judgments that language models learn from data, given they are not axiomatically defined? (Discovery)
     - Subproblem: (a) Discovery
     - Note: Relevance is learned salience, not axioms.

  2. **Efficient State Update**: For long-context agents, what mechanisms allow incremental updates to the agent's state without full recomputation, and what assumptions about locality are being made? (Maintenance)
     - Subproblem: (b) Maintenance

  3. **Framing as Control**: How should an agent choose its own framing (e.g., via prompt construction or retrieval) when the framing decision is itself uncertain and affects future reasoning? (Recursion)
     - Subproblem: (c) Recursion

  4. **Attention as Frame Cost**: How does the cost of attention (in terms of context window and compute) shape the frame choices and failures in LM agents? (Other, but related to all)
     - Note: This is about the cost structure changing from search to attention.

  5. **Frame Robustness**: What makes a frame robust against distributional shift or adversarial inputs in LM agents? (Other)
     - Note: This is about how frames fail and how to repair.

  6. **Grounding in Tools**: How do tool-using agents ground their frame choices in the affordances of the tools they use? (Other, but related to Discovery and Recursion)
     - Note: Tools provide external constraints.

  7. **Recursive Frame Evaluation**: How can an agent evaluate the quality of a frame without having already framed the problem? (Recursion)
     - Subproblem: (c) Recursion

  We generate a candidate set of 7. We then rank them.

  ### Step 2: Ranking Criteria
  We must define criteria and weights. The criteria should reflect the project's goals: work that matters in a decade, delivered by a mixed team, and focused on the frame problem in LM agents.

  Criteria:

  1. **Upstreamness** (weight: 0.3): How much does progress on this question enable progress on others? A highly upstream question is foundational.
     - Why this weight? The project wants to focus on the root causes, not symptoms.

  2. **Tractability for Team** (weight: 0.3): How well-suited is the question for this specific team? We break into philosophers and engineers, but overall team strength is key.
     - Why? The team has specific expertise, and we must leverage it.

  3. **Neglectedness** (weight: 0.2): How understudied is the question? We want to avoid crowded areas.
     - Why? The funder wants original work that will last.

  4. **Impact on Practice** (weight: 0.2): How much would answering this question improve the design of LM agents?
     - Why? The engineers are building agents, and we want real-world relevance.

  Weights sum to 1 (0.3+0.3+0.2+0.2). Trade-offs: e.g., a highly upstream question might be less tractable or more neglected, but we balance.

  ### Step 3: Rank the Candidates
  We rank by overall score (criterion weight * rating). We must also consider the justifications.

  After scoring, we get:

  Rank 1: Candidate 3 (Framing as Control) or Candidate 1 (Implicit Relevance)? Let's reason.

  - Candidate 3 (Framing as Control) is highly upstream because it addresses the recursion which is the core of the problem in LM agents (they don't even represent the frame choice). It is tractable: philosophers can work on the control problem, engineers on the agent design. It is neglected because most work is on single-step framing. Impact: if we solve how to choose frames, it affects everything.

  - Candidate 1 (Implicit Relevance) is also upstream because relevance is the first step. But in LM agents, relevance is learned, so it's not clear if we can audit it without understanding the recursion.

  - Candidate 7 (Recursive Frame Evaluation) is part of the recursion and might be even more core.

  But we must avoid too many candidates. We'll select 5 for ranking.

  Final candidate set for ranking (top 5):

  1. **ID: "control"** - Question: How should an agent choose its own framing (e.g., via prompt construction or retrieval) when the framing decision is itself uncertain? (Recursion)
  2. **ID: "relevance_audit"** - Question: How can we characterize and audit the relevance judgments that language models learn from data? (Discovery)
  3. **ID: "efficient_update"** - Question: For long-context agents, what mechanisms allow incremental state updates without full recomputation? (Maintenance)
  4. **ID: "attention_cost"** - Question: How does the cost of attention shape frame choices and failures in LM agents? (Other)
  5. **ID: "robustness"** - Question: What makes a frame robust against distributional shift in LM agents? (Other)

  We rank:

  1. **control** (rank 1): Because without understanding how framing is chosen, the other questions (what is relevant, how to update) are subservient to a frame that might be arbitrarily chosen. It is the most upstream. Tractability: philosophers (0.8) for control theory, engineers (0.7) for building agents that choose frames. Neglected: 0.9 (very little on recursive framing in LM agents). Confidence: 0.8.

  2. **relevance_audit** (rank 2): Because the ability to audit relevance is key to understanding and improving discovery. It is upstream for maintenance and recursion because without knowing what is relevant, updates and frame choices are blind. Tractability: philosophers (0.9) for epistemology, engineers (0.6) for interpreting models. Neglected: 0.7 (some work on interpretability, but not for relevance in actions). Confidence: 0.7.

  3. **attention_cost** (rank 3): Because the cost structure (attention) is what makes the frame problem different in LM agents. It constrains all the others. Tractability: engineers (0.9) for measuring costs, logician (0.7) for formalizing. Neglected: 0.8 (cost is often taken as given). Confidence: 0.6.

  4. **efficient_update** (rank 4): Because efficient maintenance relies on the frame (which is chosen) and the relevance (which is discovered). It is downstream. Tractability: engineers (0.9) for system building, logician (0.8) for locality. Neglected: 0.5 (there is work on efficient transformers). Confidence: 0.7.

  5. **robustness** (rank 5): Because robustness is a desired property but depends on the other factors. It is the most downstream. Tractability: engineers (0.8) for testing, philosophers (0.5) for what robustness means. Neglected: 0.6 (robustness is studied, but not for frames). Confidence: 0.6.

  ### Step 4: Dependency Map
  We map how the questions relate:

  - "control" presupposes "relevance_audit" (because to choose a frame you need to have some notion of relevance) but also constrains it? Actually, they are interdependent.

  We create:

  [
    { from_id: "control", to_id: "relevance_audit", relation: "presupposes", note: "Choosing a frame requires some relevance model." },
    { from_id: "control", to_id: "attention_cost", relation: "constrains", note: "Frame choice is constrained by attention costs." },
    { from_id: "relevance_audit", to_id: "efficient_update", relation: "partially_answers", note: "Knowing relevance helps efficient update." },
    { from_id: "attention_cost", to_id: "efficient_update", relation: "constrains", note: "Update mechanisms must respect attention costs." },
    { from_id: "robustness", to_id: "control", relation: "presupposes", note: "Robustness of a frame depends on how it was chosen." }
  ]

  ### Step 5: Tradeoffs
  Trade-offs between criteria:

  - Between Upstreamness and Tractability: Highly upstream questions might be harder to tackle. We resolved by giving both high weights and choosing questions that are upstream but still tractable for the team.

  - Between Neglectedness and Impact: A neglected question might be so because it's not important? We balance by ensuring impact is considered.

  Trade-offs between questions:

  - Between "control" and "relevance_audit": Focusing on control might be more abstract, while relevance_audit is more concrete. We resolved by putting control first because it is more upstream.

  ### Step 6: Excluded Candidates
  We excluded:

  - Candidate: "Grounding in Tools"
    Reason: While important, it is a specific aspect that might be addressed by the other questions (e.g., control and relevance in the context of tools). We focus on the core framing.

  - Candidate: "Recursive Frame Evaluation" (we merged it into "control" as it is part of the same problem).

  ### Step 7: What Would Change the Ranking
  - If a breakthrough in efficient attention mechanisms reduces the cost of attention, then "attention_cost" might move down.
  - If a method to audit relevance in black-box models emerges, then "relevance_audit" might move down and "control" up even more.

  ### Step 8: Verdict on the Split
  - Does the three-way split survive? 
    We think it collapses because recursion (c) absorbs the others. In LM agents, the frame is not a preprocessing step but a continuous control problem. Therefore, discovery and maintenance are done within a frame that is chosen recursively.

    Survives: false, collapses_into: "c" (recursion)

  - Dissolution verdict: 
    Has scale dissolved the frame problem? We say no. Scale has changed the problem (to attention costs and learned salience) but not dissolved it. The residue is the problem of recursive frame choice under uncertainty and the cost of attention.

    Dissolved: false, residual_problem: "The recursive frame choice under uncertainty and the attention cost of bad frames."

  ### Step 9: Least Confident Judgment
  - Claim: That the recursion question absorbs the others. Confidence: 0.6. What would shift it: If we find that in practice, LM agents can work with fixed frames and the main issue is efficient update, then the split might hold.

  ### Step 10: Agenda Statement and Bottom Line
  Agenda Statement: We recommend focusing on the recursive nature of framing in language-model agents, where the agent must choose its own frame under uncertainty, with implications for relevance learning and efficient state update. The agenda prioritizes understanding and designing control mechanisms for frame selection, auditing learned relevance, and optimizing for attention costs, to build agents that can maintain robust world representations.

  Bottom Line: The frame problem persists in LM agents as a recursive control challenge; we must tackle frame selection first to enable progress on relevance and efficiency.

  Now, we write the JSON.
