prompt: |-
  I'm trying to get clear on structural realism and I keep hitting a wall with the objection that if all you know is structure, you can always reinterpret the domain so that almost any set of objects satisfies it. Can you give me an intuitive explanation of why that objection is supposed to show that the epistemic version of structural realism — the view that we can know only the structure of reality, not the intrinsic natures of the things that have it — collapses into something trivial? Use a toy example, say a theory with three indistinguishable particles and one two-place relation, and walk through what the epistemic structural realist claims to know and what the objection says they actually know. Then explain how the ontic version — the view that structure is all there is — is supposed to dodge the objection, and whether that dodge costs it the ability to say what the relata are. I don't need names or citations, just the shape of the argument and where the real disagreement lies. Also I've alot of trouble seeing why this isn't just a point about formalization rather than about knowledge, so if you can say something about that too.
