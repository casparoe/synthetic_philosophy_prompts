prompt: |-
  I'm writing the final for a grad seminar on interpretability — the "do networks actually have representations" debate — and I want one essay question that a student can't get through by just reciting the probing/activation-patching lit back at me. The thing I want them stuck on: a linear probe decodes the board state from a chess-playing transformer, so one student says the net represents the board; another says she ablated the probe direction and play barely changed, so it doesn't. I want the question to force them to spell out what has to be true of the net's computation for the decodable info to count as a representation rather than just being recoverable from the activations. Put a twist in the stem they have to deal with: suppose the same probe decodes the same board state just as well when you point it at a randomly initialized copy of the network. And I want a last part where they have to commit on whether "this network represents the board" is a fact about the network or a fact about the observer's interests. Give me the question (should be doable in ~50 min), a model answer of about 700 words, and a marking scheme that seperates an A from a B by naming the specific moves each answer has to contain, with a one-liner for each move on how students typically botch it.
reasoning: |-
  We are designing an essay question for a grad seminar on interpretability. The scenario involves a linear probe that decodes the board state from a chess-playing transformer. One student claims the network represents the board because the probe works. Another student ablated the probe direction and found performance barely changed, so they argue it doesn't. We are adding a twist: the same probe decodes the board state just as well when pointed at a randomly initialized copy of the network.

  The question should force students to:
  1. Spell out what must be true of the net's computation for the decodable information to count as a representation (rather than just being recoverable from the activations).
  2. Address the twist (the probe working on a randomly initialized network).
  3. Commit on whether "this network represents the board" is a fact about the network or about the observer's interests.

  We want the question to be doable in about 50 minutes, and we'll provide a model answer of about 700 words and a marking scheme.

  The Question:

  "Consider a transformer neural network trained to play chess. A linear probe applied to the residual stream activations of the trained network decodes the current board state with high accuracy. However, when the direction corresponding to the probe is ablated in the trained network, the network's chess-playing performance barely changes. Moreover, the same linear probe, when applied to a randomly initialized (untrained) copy of the same network architecture, also decodes the board state with similar high accuracy.

  In light of these findings, critically evaluate the claim that the trained network 'represents' the board state. Your answer should address:

  a) What must be true of the network's computations for the linearly decodable information to constitute a representation of the board state? (Focus on the role of the information in the network's own functioning.)

  b) How does the observation that the probe works on a randomly initialized network bear on the question of representation?

  c) Is the statement 'this network represents the board state' a fact about the network's intrinsic properties, or is it dependent on the observer's interests and methods? Explain your position.

  Ensure your response engages with the tension between the two students' arguments and the provided experimental results."

  Model Answer (approx. 700 words):

  The scenario presents a puzzle for interpretability: despite the linear probe's success in decoding board state from the trained network's activations, two critical challenges arise. First, ablating the probe direction does not impair the network's performance, suggesting that the information in that direction is not used by the network. Second, the probe works equally well on a randomly initialized network, indicating that the decodability might not depend on training. This raises the question: does the trained network actually represent the board state?

  a) For linearly decodable information to count as a representation in the network, it must play a functional role in the network's own computations. A representation is not merely information present in the activations but must be causally involved in the network's decision-making. In this case, the board state information must be utilized by the network to make its chess moves. The ablation result, however, shows that removing the specific direction corresponding to the probe does not affect performance. This suggests that either the network does not use that particular linear projection of the activations, or it redundantly represents the board state in multiple ways so that ablating one direction does not break the system. But if the information is not causally necessary for the network's output, then it is hard to argue that the network is using it as a representation. Instead, the information might be an epiphenomenon — a byproduct of the computation that is not functionally engaged.

  b) The fact that the probe works on a randomly initialized network is even more striking. It implies that the linear decodability of the board state is not a consequence of the network's training. Instead, it may be an inherent property of the architecture or the input encoding. For instance, the input features to the network (e.g., the embedding of the chess pieces and their positions) might already contain the board state in a linearly decodable form. The random network has not learned any chess-specific computations, yet the same linear projection yields the board state. This suggests that the probe is picking up on the structure of the input rather than on a learned internal representation. Therefore, the probe's success on the trained network might be misleading: it could be decoding from the input residue in the residual stream, not from a representation constructed by the network for playing chess. This further weakens the claim that the trained network represents the board state.

  c) The statement "this network represents the board state" is not solely a fact about the network's intrinsic properties; it is also dependent on the observer's interests and methods. The network's activations do contain information about the board state, as evidenced by the probe. However, whether we call this a representation depends on whether we are adopting an observer-relative or an intrinsic perspective. From an observer-relative perspective (e.g., the probe user), the information is there and can be used, so it counts as a representation for that user. But from the network's perspective, if the information is not used in its computations, it is not functioning as a representation for the network. The ablation and random network experiments show that the network does not rely on this particular linear projection. Thus, if we require that a representation must be causally involved in the system's function, then the board state in this linear form is not a representation for the network.

  However, note that the network might represent the board state in a different, non-linear way that is used in its computations. The linear probe might be reading out a shadow of that representation, but the actual representation could be distributed and non-linear. The ablation of one linear direction might leave the underlying non-linear representation intact. Therefore, the failure of the ablation to affect performance does not necessarily mean the board state isn't represented; it might mean that the representation is robust to that ablation.

  Nonetheless, the random network result complicates this. If the untrained network also allows linear decoding, then the probe might be exploiting input features that are always present. This suggests that the trained network may not have built a new representation; it just uses the existing input structure. Therefore, the claim that the network represents the board state requires more evidence. We must show that the network constructs and uses the representation in its computations. Techniques like activation patching (where we patch in activations from a different board state and observe changes in the output) could demonstrate causal involvement. Without such evidence, the linearly decodable information remains an observer-relative artifact.

  In conclusion, the experiments suggest that the linear decodability of the board state is not sufficient to claim that the network represents it. The information must be causally necessary for the network's function, which the ablation test challenges. The random network result further indicates that the decodability might be an artifact of the input. Ultimately, whether we call it a representation depends on our definition: if we require functional role, then in this case, it fails. But we must be cautious not to overgeneralize — the network may represent the board state in a non-linear manner that is not captured by the linear probe.

  Marking Scheme:

  An A answer must:
  1. **Define representation in terms of functional role**: Explain that a representation must be causally involved in the network's computations. (Common botch: Students might define representation solely in terms of information presence without considering causality.)
  2. **Interpret the ablation result**: Argue that the ablation not affecting performance suggests the information in the probe direction is not used by the network. (Common botch: Students might claim redundancy without addressing the causal role.)
  3. **Interpret the random network result**: Explain that the probe working on a random network indicates the decodability is likely due to input structure, not learned representations. (Common botch: Students might dismiss this as irrelevant without connecting to the source of the information.)
  4. **Address the tension between the two students**: Reconcile the probe success with the ablation and random network results, explaining why the probe working doesn't imply representation. (Common botch: Students might side with one student without engaging the contradiction.)
  5. **Take a clear stance on observer-relativity**: Argue that the representational claim depends on both the network's intrinsic properties (causal role) and the observer's interests. (Common botch: Students might present a one-sided view, either entirely intrinsic or entirely relative.)
  6. **Discuss non-linear representations**: Acknowledge that the linear probe might not capture the actual representation used by the network, which could be non-linear and robust to linear ablation. (Common botch: Students might overlook the possibility of non-linear representations.)
  7. **Propose further evidence**: Suggest experiments (e.g., activation patching) to test causal involvement. (Common botch: Students might not suggest ways to resolve the ambiguity.)

  A B answer might:
  - Cover points 1-5 but in less depth or with minor inaccuracies.
  - Miss one of the key moves (e.g., not addressing the random network result adequately).
  - Have a less nuanced view of observer-relativity.
  - Fail to propose further evidence.

  Lower grades would miss more key elements or have significant misunderstandings.
answer: |-
  ### Essay Question  
  **Instructions:** Answer the following question in a clear, structured essay. Engage deeply with the scenario and all its components. Time: 50 minutes.  

  **Scenario:**  
  A transformer neural network is trained to play chess. When a linear probe is applied to the residual stream activations of this trained network, it decodes the current board state with high accuracy. However, when the direction corresponding to this probe is ablated (i.e., the component of the activations aligned with the probe is removed), the network’s chess-playing performance barely changes. Further, the *same* linear probe decodes the board state with similar high accuracy when applied to a *randomly initialized* (untrained) copy of the same network architecture.  

  Two students debate whether the trained network "represents" the board state:  
  - Student A argues the probe’s accuracy proves the representation exists.  
  - Student B argues the ablation result (no performance drop) proves it does not.  

  **Question:**  
  Critically evaluate whether the trained network "represents" the board state. Your essay must:  
  1. **Define the conditions** under which linearly decodable information qualifies as a "representation" (rather than merely recoverable information), focusing on what must be true of the network’s *own computations* for this to hold.  
  2. **Address the twist**: Explain how the probe’s success on the *randomly initialized network* affects the debate.  
  3. **Resolve the observer-relativity issue**: Is the claim "this network represents the board state" a fact about the network’s intrinsic properties, or does it depend on the observer’s interests and methods? Defend your position.  

  Ensure your response reconciles Students A and B’s arguments and uses the experimental results (probe, ablation, and random-network probe) as evidence.  

  ---

  ### Model Answer (Approx. 700 words)  
  The scenario reveals a tension between the accessibility of information about the board state and its functional role in the network. Student A emphasizes decodability as evidence of representation, while Student B’s ablation test suggests the information is causally irrelevant. The twist—probe success on a randomly initialized network—compounds this, implying decodability may arise from architectural or input biases rather than learned representations. I argue that for linearly decodable information to constitute a "representation," it must play a *causal, necessary role* in the network’s computations. By this standard, the probe results alone are insufficient; the evidence suggests the board state is not intrinsically represented by the trained network. Moreover, the representational claim is observer-relative, depending on interpretive goals rather than solely on network properties.  

  **1. Conditions for representation: Causal necessity in computations**  
  For linearly decodable information to count as a representation—not just recoverable data—it must satisfy two conditions tied to the network’s computations. First, the information must be *causally involved* in generating the network’s outputs. Second, it must be *necessary* (or at least non-redundant) for task performance, meaning that disrupting it impairs function. Here, "representation" implies that the network uses the information as an internal stand-in for the board state to guide decisions, akin to a map guiding navigation.  

  The ablation result undermines this: removing the probe-aligned direction does not affect chess performance. This implies that either (a) the board state is not used by the network in this linear form, or (b) it is redundantly encoded, with other activation components compensating. In (a), the probe decodes information that is epiphenomenal—a byproduct of computation, like heat from a CPU, which doesn’t contribute to function. In (b), redundancy might preserve performance, but the probe’s specific direction still lacks unique causal power. Crucially, representation requires that the information is *leveraged* by the network, not merely present. Without causal involvement, decodability is insufficient; it becomes "correlational trash" (a la Anderson) rather than a computational asset.  

  **2. Impact of the randomly initialized network probe**  
  The probe’s success on a randomly initialized network is a critical twist. If the same linear projection decodes the board state without training, the decodability likely stems from low-level properties of the input or architecture, not learned representations. For instance, the network’s embedding layer or residual stream structure might preserve board state information linearly, regardless of weights. In a trained network, this could mean the probe detects input remnants rather than a constructed, functional representation.  

  This challenges both students. Student A might argue decodability persists across contexts, proving robustness. But if untrained networks exhibit identical decodability, training adds nothing to this specific linear encoding—undercutting the claim that the *trained network* represents the board in a meaningful way. Student B’s ablation argument gains strength: if the probe direction was never integrated into computations during training, its irrelevance to performance is unsurprising. Together, these results suggest linear decodability is an artifact of input encoding (e.g., tokenized board positions), not emergent representation. Representation requires construction and utilization, neither of which is demonstrated here.  

  **3. Observer-relativity: Network properties vs. interpretive interests**  
  The claim "this network represents the board state" is not solely a fact about the network; it is inherently observer-relative. Intrinsically, the network’s properties (e.g., activation patterns) exist independently, but labeling them as "representations" depends on an observer’s interests and methods. For instance, if we define representation operationally (e.g., "information usable by an external probe"), Student A is correct—the probe accesses the board state. But if we define it functionally (e.g., "information causally necessary for the system’s goals"), Student B’s view aligns better—the ablation shows no such necessity.  

  The twist heightens this relativity. The probe’s success on a random network makes decodability seem observer-imposed: the linear direction is a "convenient readout" for humans, not a component of the network’s chess-playing mechanics. Thus, whether we call it a "representation" hinges on our purpose. For interpretability research (observer-focused), it is a useful proxy; for mechanistic explanations (network-focused), it fails without causal evidence. This dualism mirrors debates in philosophy of mind (e.g., Dennett’s intentional stance): the network has intrinsic properties, but "representation" is a lens we apply.  

  **Synthesis and resolution**  
  The evidence suggests the trained network does not intrinsically represent the board state in the probe-aligned direction. Decodability alone is inadequate; the ablation and random-network results imply the information is neither causally necessary nor constructed by learning. However, this doesn’t preclude non-linear or distributed representations. For example, the network might compute board state implicitly through layered transformations, with the linear probe capturing a superficial slice. To test this, we could use activation patching: if replacing activations with those from a different board state alters moves, it would demonstrate causal involvement. Without such evidence, the probe reveals correlational structure, not representation.  

  In summary, representation demands causal integration, which is absent here. The debate is resolved by recognizing that decodability is observer-relative, while true representation is mechanistic. Thus, the network’s properties alone don’t settle the claim; our interpretive goals do.  

  ---

  ### Marking Scheme  
  **A Grade (Excellent):**  
  - **Defines representation with causal necessity** (1 point): Explicitly states that for information to be a representation, it must be causally involved in and non-redundant for the network’s computations. *Common botch: Vague definitions focusing only on "presence" or "accessibility" without causality.*  
  - **Interprets ablation result as evidence against causal role** (1 point): Argues that unchanged performance post-ablation shows the probe direction is not computationally necessary. *Common botch: Attributes lack of performance drop to redundancy without addressing causal necessity.*  
  - **Explains random-network probe as revealing input/architectural bias** (1 point): Identifies that probe success without training indicates decodability stems from inputs (e.g., embeddings), not learned representations. *Common botch: Treats random-network result as irrelevant or fails to link it to input structure.*  
  - **Reconciles Student A/B using all evidence** (1 point): Synthesizes probe success (A) with ablation/random-net results (B), showing decodability ≠ representation. *Common botch: Takes one side without engaging the tension or omits key results.*  
  - **Commits to observer-relativity in representation claims** (1 point): Clearly argues that "representation" depends on both network properties (intrinsic) and observer interests (extrinsic). *Common botch: Absolutist view (e.g., "only network" or "only observer").*  
  - **Proposes mechanistic tests (e.g., activation patching)** (1 point): Suggests experiments to resolve ambiguity, like patching to test causal role. *Common botch: No concrete next steps or superficial suggestions.*  
  - **Discusses non-linear representations** (1 point): Acknowledges that linear probes may miss distributed/non-linear encodings that could be causal. *Common botch: Ignores alternative encoding possibilities.*  

  **B Grade (Good but flawed):**  
  - Hits 4–5 of the A-grade criteria but with gaps (e.g., weak reconciliation of A/B, or incomplete observer-relativity).  
  - May omit one key move (e.g., no mention of non-linear representations or inadequate analysis of random-network probe).  
  - Definitions or arguments are present but less precise or nuanced.  

  **C Grade (Adequate):**  
  - Addresses only 3–4 criteria superficially (e.g., defines representation but ignores causality; mentions observer-relativity but unsupported).  
  - Fails to engage the twist or ablation result meaningfully.  

  **D/F Grade (Poor):**  
  - Misses >3 criteria; recites generic probing/ablation facts without applying them to the scenario.  
  - Ignores the twist or observer-relativity; no synthesis.  

  **Total:** 7 points (1 per criterion). A = 6–7; B = 5; C = 4; D = 3; F = 0–2.
