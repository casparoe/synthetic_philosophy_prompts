  The procedure should be a flowchart of questions. Each step must be clear, with yes/no answers leading to approvals, rejections, or value judgments. The steps should address detectability, resource depletion, intent, and reciprocity. Where assumptions can't be verified, flag them as such. 

  For the targeted beam case: aimed at a specific star with a planet. Step 1: Detectable? Yes, but narrowly. Step 2: Resource depletion? Unlikely for one signal. Step 3: Reveal motive? Not applicable here. Step 4: Intent decipherable? Maybe, but the signal might be complex. Step 5: Reciprocal risk? Since it's targeted, they might trace it back. Step 6: Value judgment—is potential contact worth the risk? The procedure would likely stop at Step 5, recommending rejection due to traceability. 

  For the omnidirectional beacon: always broadcasting. Step 1: Highly detectable. Step 2: Resource depletion isn't the issue. Step 3: Reveals our existence broadly. Step 4: Intent might be friendly, but hard to convey. Step 5: Anyone could detect us, including hostile entities. Step 6: Value judgment—is the benefit worth the existential risk? Procedure rejects it at Step 5. 

  Breakdowns occur where assumptions are untestable, like whether civilizations are hostile or if reciprocity is a factor. Steps involving value judgments (like Step 6) must be handled by the board. 

