  ### Empty Slots  
  - **Non-gradable intellectualism without ability**: Empty (unattractive). Denying both gradability *and* ability severs know-how from action, making it inert.  
  - **Non-gradable way theory without ability**: Empty (incoherent). If know-how is object-based but fails to enable action *and* lacks gradability, it loses explanatory value.  
