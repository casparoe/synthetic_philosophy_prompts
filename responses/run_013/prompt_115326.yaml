prompt: |-
  Right, so, context first, because it matters: three weeks ago I passed a kidney stone. About six hours of it, and somewhere in the middle I would have traded a serious chunk of the rest of my life for it to stop. Not as a figure of speech — I was doing the arithmetic, and the arithmetic came out that way. I'm fine now, back at work, eating ice cream again, and here's whats been nagging at me since: the ice cream doesn't pay back the stone. Not any amount of ice cream. There's no pile of "pretty good" big enough to get me back to even, and I don't think I'm just being dramatic about that. It feels like it's telling me something about how these two things relate to each other at all.

  Which has sent me back to utilitarianism, which I haven't touched since a first-year course, and I've got a question about Bentham.

  The modern position I keep running into is that some suffering is "lexical" — that a certain intensity of pain can't be outweighed by any amount of mild pleasure, however much of it you stack up — and then there's negative utilitarianism, where reducing suffering is the whole game and pleasure basically doesn't get a vote. Two things I want from you.

  First: what would Bentham have made of that? As I remember him, his thing was that pleasure is pleasure and pain is pain and the only question is how much, everything on one scale, no ranks or kinds. If that's right then the lexical view is a flat contradiction of his position, so either he'd reject it or something in his system has to give. I want the specific joint that breaks, not "he'd refine his hedonism." And if the honest answer is that he'd say my question is confused rather than true or false, tell me that instead of answering it.

  Second, a complication someone at work raised and I can't tell if it's right: that in the brain, pleasure and pain aren't two ends of a single dial but separate systems, so you can lose one and keep the other. Assume for the sake of argument that it's true. Does that break the common-currency idea, and would Bentham have cared — would he say so much the worse for the science and keep his scale, or does his view actually depend on the one-scale thing in a way that makes this a real problem for him?

  And push him on the ugly bit. If no amount of pleasure outweighs certain pains, the ledger is always in the red and the cheerful conclusion is to wind the whole thing down. Would he take that seriously, or does his machinery have something built in that blocks it — and if it blocks it, does blocking it cost him the lexical view?

  Last thing: tell me where I'm projecting a 2020s argument onto a guy who died in 1832. Which bits are actually his, which are later additions I'm backfilling onto him, and where you're guessing. No reading list please, I'm not going to go read the sources — just say what you think he'd have said and how confident you are.
