  **Scratch Work:**  
  Colliding concepts: **Symmetry** (rotational balance) vs. **Reflection** (mirrored correspondence).  
  Why: In the block domain, "symmetry" initially implies identical tokens facing the same way. But when tokens are flipped, reflection creates a *new* kind of balance – mirrored forms that "play the same role" structurally. The puzzle forces a choice: is symmetry about *form* or *role*?

  ---

  The dust motes danced in the beam from my desk lamp, spotlighting the three little wooden blocks. **L**, **T**, and **U**. My kingdom. My curse. For three years, these chipped, painted things had been my world. The rules were simple, elegant, maddening:
  1.  **Slide**: Move one block left or right along the table's edge.
  2.  **Flip**: Turn one block over (so **L** becomes **Γ**, **T** becomes **⊥**, **U** stays **U**).
  3.  **Match**: Copy the position *or* orientation (but not both) of one block onto another.

  That was it. Three tokens, three moves. Enough to build universes of implication. Enough to make tenure committees stare blankly.

  The puzzle glaring at me was: `L T L` → `? ? ?`. Start state: Three blocks, upright: L, then T, then L again. Symmetry. Obvious symmetry. The T in the middle, flanked by identical Ls. My tired brain whispered the obvious answer: "Successor state? Simple. **L ⊥ L**. Flip the middle T. Now it's mirror-symmetric upside-down."

  I executed the Flip on the T. `L ⊥ L`. But it *itched*. The flipped **⊥** wasn't just upside-down; its crossbar pointed down instead of up. It felt… *off*. Like calling a flipped coin "the same" just because it's still a coin. Was this really symmetry? Or just a token occupying the same physical slot? The Ls were identical, the **⊥** was a distorted reflection of the original T. The concept of "sameness" strained.

  I tried again. Maybe Slide? Slide the right L next to the left one? `L L T`. Now the two Ls were together, identical, upright. But the T was isolated. Where was the symmetry? The pattern felt broken, the central T discarded. "Sameness" applied locally to the Ls, but the whole structure lost its balance. Succession implied continuity, but this felt like rupture.

  Frustrated, I reset: `L T L`. Upright. Balanced. Symmetrical. What *else* could symmetry mean? The **Match** move niggled at me. *Copy position OR orientation*. Could I make the *ends* match the *middle*? But the middle was T, the ends were L. Different forms. Impossible to make identical.

  Unless… I didn't need *identity*. I needed *correspondence*. Role-playing.

  I picked up the *rightmost* L. Flipped it. It became **Γ**. Then I used **Match**. Not on form, but on *orientation*. I made the *leftmost* L match the *new orientation* of the rightmost **Γ**. So I flipped the left L too. Now it was also **Γ**.

  The state: `Γ T Γ`.

  Not `L T L`. Not `L ⊥ L`. `Γ T Γ`.

  The two **Γ**s flanked the upright T. They weren't the same as each other in the way the original Ls were – both were flipped, but that made them mirror images *of each other* across the upright T. The original "symmetry" – based on identical tokens facing the same way – was gone. In its place was a deeper, stranger balance. The **Γ**s were *reflections* of each other. They *played the same structural role* relative to the T: mirrored sentinels. The T hadn't changed, but its relationship to the ends had warped entirely. It was the axis of reflection now, not just the center of identical things.

  "Symmetry" hadn't just been applied; it had *slipped*. It stopped being about the tokens themselves being identical and started being about the *roles* they occupied in the structure being equivalent through reflection. "Sameness" of form had dissolved into "sameness of function" relative to the center. The cold, formal rotational symmetry I'd started with (`L T L`) had melted and re-formed into reflective symmetry (`Γ T Γ`), using Flip and Match to bend the concepts themselves.

  And it felt… right. More resonant than the clunky `L ⊥ L`. But the unease was immediate. How far could this go? If I flipped the T now, making it `Γ ⊥ Γ`, was that *still* symmetrical? The **Γ**s and the **⊥** weren't reflections of each other. The **Γ**s were reflections *across* the **⊥**, but the **⊥** itself was asymmetric. Was "symmetry" now about the whole pattern having an axis, regardless of the central token's own form? Or had I broken it? If I slid the right **Γ** away, leaving `Γ ⊥ ?`, could I call *that* symmetrical if I imagined a missing piece? Where did the concept stop being "symmetry" and start being "arbitrary pattern I'm forcing meaning onto"?

  The blocks sat there, inert wood. But the space between them hummed with possibility and dread. The slippage wasn't a bug in the system; it *was* the system. The juice was in the bending, the moment `L T L` didn't just become `L ⊥ L` but became `Γ T Γ`, and "symmetry" quietly shed its skin and became "reflection". But watching concepts stretch was one thing. Knowing when they’d snap was another. Every solution felt like a little betrayal of the original idea. How thin could the membrane get before it wasn't the same concept at all, just a ghost wearing its name?

  \answer{symmetry → reflection}
