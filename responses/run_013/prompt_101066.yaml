answer: |-
  Here’s a concise scenario, analysis, and defense strategy tailored for your seminar:

  ### The Scenario: Impromptu Park Cleanup
  > Two strangers, Alex and Sam, are separately picking up litter in a public park. They notice each other and begin coordinating wordlessly: Alex focuses on the left side of a path while Sam takes the right, occasionally glancing to avoid duplicating efforts. They share a bin, passing it back and forth seamlessly when one fills a bag. After 20 minutes, Sam waves and leaves without a word; Alex continues alone, feeling neither slighted nor surprised.

  ---

  ### Analysis of Accounts
  1. **Bratman (Shared Intention)**:  
     ✅ **Verifies joint action**. Alex and Sam exhibit *interlocking subplans* (dividing the path, sharing the bin) and *mutual responsiveness* (adjusting based on glances). Their intentions ("I’ll clean while you clean") mesh into a shared cooperative activity, satisfying Bratman’s conditions without requiring commitment.

  2. **Searle (We-Intention)**:  
     ✅ **Verifies joint action**. Both likely have individual we-intentions ("*We* are cleaning this park together"). Their actions are functionally cooperative (shared bin, spatial coordination), and each sees the other as part of "us" in this context—fulfilling Searle’s criteria for collective intentionality.

  3. **Gilbert (Plural Subject)**:  
     ❌ **Denies joint action**. Crucially, there’s *no joint commitment*. No promises, agreements, or mutual obligations exist. Sam’s departure breaches no duty; Alex has no grounds for complaint. The actors are merely *individually committed* to similar goals while coordinating incidentally—not forming a "plural subject."

  ---

  ### The Crucial Feature
  - **The absence of normative glue**: Gilbert requires agents to "pool their wills" into a joint commitment that creates mutual obligations. Here, coordination is purely *contingent* and *non-binding*—the strangers act *in parallel* with mutual awareness, not *as a unit*. Remove the **mutual responsiveness** (e.g., if they ignored each other while cleaning), and Bratman/Searle would also deny joint action. But with responsiveness *present yet unaccompanied by commitment*, Gilbert alone rejects it.

  ---

  ### Gilbertian Defense (Strongest Counter)  
  A Gilbert defender could argue:  
  > *The sustained coordination itself implies tacit commitment*. By sharing the bin and dividing space, Alex and Sam *signaled acceptance* of a joint goal. Their repeated cooperative acts (passing the bin, adjusting paths) constitute an *implicit agreement* to be a "we" for this task. Walking off *is* permissible only because the commitment was contextually limited—but while acting, they *were* a plural subject bound by weak, situation-specific obligations.*

  **Rebuttal**: This overextends "tacitness." Gilbert insists joint commitment requires a *communicative act* (verbal/nonverbal) establishing mutual obligation. Here, no such act occurred; coordination was purely reactive. Sam’s guilt-free exit proves no obligation existed—the core of Gilbert’s account.

  ---

  ### Why This Works for Your Case
  - **Realism**: Unplanned cooperation among strangers is common (e.g., travelers lifting luggage, shoppers holding doors).  
  - **Warmth without commitment**: Coordination feels organic and cooperative, yet no promises or expectations bind them.  
  - **Precise divergence**: The *only* difference is Gilbert’s demand for normative structure—isolating "commitment" as the disputed element.

  This scenario cleanly separates the accounts while meeting your constraints. Use it to spark debate on whether collective action *requires* obligations or merely requires shared goals + coordination.
