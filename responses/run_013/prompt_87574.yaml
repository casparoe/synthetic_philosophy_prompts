prompt: |-
  I am a theoretical condensed-matter physicist — a postdoc, if it matters — who uses effective field theory and the renormalization group daily and who has read perhaps three papers in the philosophy of science, all on scientific realism. I would like you to translate the structural realist position in philosophy of science into the vocabulary I actually work in, as faithfully as you can manage, and then tell me what did not survive the translation.

  The position as I understand it, and I would like you to correct my understanding wherever the translation forces you to: the structural realist holds that when a successful theory is replaced by a better one, what is carried over is not its inventory of entities and properties but its structure — typically its equations, or their mathematical form — and that this carry-over is the best explanation of why the successor theory works in the predecessor's domain; the discarded parts (the ether, phlogiston, the crystalline spheres) are the ontology, and the retained parts are the relations. Against this stands the pessimistic meta-induction, which observes that our present ontology will look like the ether eventually, and the suspicion that structure itself has never been made precise.

  Restate this in my vocabulary: the Wilsonian picture of coarse-graining; effective field theories with their cutoffs and operator expansions; universality classes and fixed points; relevant and irrelevant operators; the distinction between what a regularization scheme makes of a theory and what is scheme-independent; the role of symmetry and anomaly in determining what a coarse-graining map can and cannot wash out. I want the translation to be systematic rather than impressionistic — take the structural realist's central claims one at a time and say what each becomes, if anything, when it is asserted by someone whose notion of a theory is an effective action and whose notion of a real feature is something that does not depend on the cutoff.

  Then the residue report, which is the part I care about. Which claims translate cleanly, which translate only with distortion, and which have no counterpart at all in what I do? I am particularly interested in whether the epistemic and the ontic versions of the view come apart in my vocabulary: a working physicist has a clear sense of what everything in a universality class shares, but not obviously a sense of structure existing, as opposed to structure being what the models happen to share. And can the claim that relations are prior to their relata be said at all in terms of correlation functions, order parameters, and symmetry groups, which seem always to be relations among some degrees of freedom one has already posited? Tell me also whether the structural realist's choice of what to call the retained structure survives contact with the fact that equations are themselves scheme-dependent, so that the invariant content of a theory looks smaller and more abstract than the equations — perhaps what survives is the fixed-point data and the anomalies rather than the Lagrangian.

  Stress-test the translation on at least one case where the continuity story strains rather than supports the view. I have in mind the cosmological constant, where the structure we are most confident of — general relativity plus quantum field theory, coarse-grained — yields a vacuum energy that misses observation by an enormous factor; or quantum gravity, where background independence suggests that the coarse-graining framework I am offering you as the target vocabulary may not itself survive as the vocabulary. Say whether the strain indicates a defect in my vocabulary or something the structural realist claim was quietly assuming.

  Finally, keep the translation honest. Do not read the target framework's assumptions — that irrelevant operators do not matter, that the cutoff is an artifact, that only scheme-independent quantities are real — back into the original position and call that a translation. Where the only way to make something come out is to use a word of mine in a way a physicist would not, flag it. And when the translation is done, give me your view on the residue: is what is left over a sign that my vocabulary is missing something a physicist ought to have, or a sign that the original claim was less clear than it looked?
reasoning: |-
  We are translating structural realism into the framework of Wilsonian effective field theory (EFT) and the renormalization group (RG). The key elements of structural realism are:

  1. When a theory is replaced by a better one, the structure (typically mathematical equations) is retained, while the ontology (entities/properties) is discarded.
  2. This retention of structure explains why the successor theory works in the predecessor's domain.
  3. The pessimistic meta-induction: current ontology will eventually look like the ether, but structure is preserved.
  4. The challenge: "structure" is not precisely defined.

  In the Wilsonian framework:

  - A theory is an effective action (or Lagrangian) at a given energy scale, with a cutoff.
  - Real features are those that are scheme-independent (i.e., do not depend on the cutoff or regularization).
  - Coarse-graining (RG flow) moves us from a more fundamental theory at high energy to an effective theory at low energy.
  - Universality classes: theories that flow to the same fixed point share the same long-distance physics.
  - Fixed points and the critical surface: the set of theories that flow to a fixed point. Near a fixed point, we classify operators as relevant, marginal, or irrelevant.
  - Symmetries and anomalies: constraints on the RG flow and what can be washed out.

  We translate the structural realist claims step by step.

  **Translation of Claim 1: Retention of Structure**

  Structural Realist: The equations (mathematical structure) are retained when a theory is replaced.

  Wilsonian EFT: When we have a high-energy theory and we flow to low energies (coarse-graining), the long-distance physics is described by an effective theory that is determined by the fixed point and the relevant (and marginal) operators. The "structure" that is preserved is the fixed point and the scaling dimensions of the operators (which determine the critical exponents). The equations (the Lagrangian) at different scales look different, but the universal properties (such as critical exponents, certain ratios, etc.) are the same.

  However, note that the equations themselves change: the Lagrangian at the UV scale is different from the one in the IR. What is preserved is the structure of the fixed point and the universality class.

  Thus, the retained "structure" is the fixed point and the set of relevant and marginal operators (and symmetries, including anomalies). The discarded parts are the irrelevant operators and the microscopic details (the ontology at the fundamental level).

  **Translation of Claim 2: Explanation of Successor Theory's Success**

  Structural Realist: The retention of structure explains why the new theory works in the old theory's domain.

  Wilsonian EFT: The reason the low-energy effective theory works in the domain of the high-energy theory (at low energies) is because the irrelevant operators have decayed, and the long-distance physics is governed by the fixed point and the relevant operators. The universality class explains why different microscopic theories (different ontologies) lead to the same macroscopic behavior.

  **Translation of Claim 3: Pessimistic Meta-induction and Structure Preservation**

  Structural Realist: Our current ontology will be discarded, but the structure will remain.

  Wilsonian EFT: As we probe higher energies (or shorter distances), we may discover a more fundamental theory. The current effective theory at low energy is an approximation. The ontology (the fundamental degrees of freedom) may change, but if the new theory is in the same universality class (i.e., flows to the same fixed point) then the long-distance physics (the structure) remains. However, note that the fixed point itself might be an approximation if we discover a more fundamental fixed point (e.g., from a Gaussian to a non-Gaussian fixed point). But the idea is that the low-energy predictions (the scheme-independent quantities) are robust.

  **Translation of Claim 4: The Challenge of Defining Structure**

  Structural Realist: Structure is not precisely defined.

  Wilsonian EFT: In the RG framework, the "structure" that is preserved is precisely defined: it is the fixed point (which includes the symmetries and the scaling dimensions of operators) and the anomalies (which are invariant under RG flow). The scheme-independent quantities (like critical exponents, certain amplitudes, etc.) are the structural invariants.

  **Residue Report**

  Now, we assess what translates cleanly, with distortion, or not at all.

  1. **Retention of Structure**: This translates cleanly to the idea of universality and fixed points. The equations (Lagrangians) change, but the fixed point data (and the relevant operators) are preserved. The discarded parts are the irrelevant operators and the microscopic details.

  2. **Explanation of Success**: This also translates cleanly: the RG flow explains why the low-energy theory works in the domain of the high-energy theory (at low energies) because the irrelevant operators become negligible.

  3. **Pessimistic Meta-induction**: This translates with a caveat. The structural realist says the structure is preserved, but in the Wilsonian view, the fixed point itself might change if we discover a more fundamental theory that changes the RG flow. However, the low-energy predictions (the scheme-independent observables) are preserved until we go to a new energy scale where new physics appears. Thus, the preservation is only approximate and within the domain of validity of the effective theory.

  4. **Definition of Structure**: In the Wilsonian framework, the structure is precisely defined (fixed point, symmetries, anomalies, scaling dimensions). This is a strength of the translation.

  **Epistemic vs. Ontic Structural Realism**

  - Epistemic: We can only know the structure, not the underlying ontology.
  - Ontic: The structure is all there is.

  In the Wilsonian framework:

  - We have a clear notion of what is shared in a universality class (the fixed point data). This is epistemic: we know that the long-distance physics is independent of the microscopic details. But we also have an ontology at each scale (the degrees of freedom in the effective theory). However, the fundamental ontology (if any) is not known.

  The ontic version might be translated as saying that the fixed point and its data are the fundamental reality, and the microscopic details are just ways to parameterize the flow. But note that the Wilsonian view typically does not reify the fixed point as the only reality; it uses the effective degrees of freedom at each scale. Therefore, the ontic version does not have a direct counterpart. The Wilsonian framework is more naturally aligned with epistemic structural realism: we know the structure (the fixed point data) and that it is common to many ontologies, but we do not necessarily deny that there is an underlying ontology (even if it is not unique).

  **Relations Prior to Relata**

  The structural realist claim that relations are prior to the relata: in the Wilsonian framework, the degrees of freedom (relata) are defined at a given scale. The correlation functions (relations) are the primary observables. However, we always start by positing some degrees of freedom. But note that in the RG, the degrees of freedom are changed by the flow (by integrating out high-energy modes). The fixed point is defined by the relations (the scaling laws and symmetries) and the relata at the fixed point might be emergent.

  Thus, we can say: the relations (correlation functions, critical exponents) are scheme-independent and real, while the relata (the fields) are scale-dependent and not fundamental. However, we still need to choose a set of relata to write down the effective action. So the priority of relations is only in the sense that the invariant content is in the relations. This is a partial translation, but note that we cannot avoid positing relata at some scale.

  **What Survives: Fixed-Point Data and Anomalies vs. Lagrangian**

  The equations (the Lagrangian) are scheme-dependent. What survives is the fixed-point data (the critical exponents, the symmetry group, and the anomaly coefficients) and the relevant operators (which define the directions of the flow). The Lagrangian at the fixed point is a representation of this data, but it is not unique (e.g., different parametrizations). So the invariant content is indeed the fixed-point data and the anomalies.

  **Stress-Testing the Translation**

  Case 1: Cosmological Constant Problem

  - In GR + QFT, the vacuum energy (cosmological constant) is calculated by summing zero-point energies. The observed value is 10^120 times smaller than the naive calculation.
  - In the Wilsonian view, the cosmological constant is a relevant operator (in the IR) but its value is not protected by any symmetry (apart from fine-tuning). The structure (the equations of GR and QFT) is retained, but the ontology (the vacuum fluctuations) leads to a huge discrepancy.

  The strain: The structural realist would say that the structure (the equations) is preserved, but in this case, the equation for the vacuum energy does not match observation. However, note that the cosmological constant is a parameter that must be fixed by experiment. The structure (the form of the Einstein equations) is preserved, but the value of the cosmological constant is not determined by the theory. This is a parameter that must be measured.

  But the problem is that the natural value from the high-energy theory is huge. So the structural continuity does not help in explaining the value. The Wilsonian view would say that the cosmological constant is a relevant operator and its value is not predicted by the fixed point (it must be set by hand). This does not contradict structural realism per se, but it shows that the structure (the equations) does not determine the parameters. The structural realist might reply that the structure is the form of the equations, not the parameters. But then the parameters are part of the ontology? That is not clear.

  This strain indicates that the structural realist claim might be assuming that the structure (the equations) is sufficient to explain the phenomena, but in EFT, we need both the structure and the parameters (which are determined by experiment or by matching conditions). The Wilsonian framework does not have a problem with this, but it highlights that the "equations" in structural realism must be interpreted as the form of the equations, not the specific values of the parameters.

  Case 2: Quantum Gravity and Background Independence

  - In quantum gravity, we expect a background-independent theory. The Wilsonian RG framework is typically formulated on a background (e.g., a fixed metric). This might not survive in quantum gravity.

  The strain: The vocabulary of coarse-graining (with a cutoff) may not be applicable in a background-independent setting. For example, the notion of a cutoff scale is tied to a background metric. This challenges the entire Wilsonian framework as the target vocabulary.

  This indicates a defect in the target vocabulary (Wilsonian EFT) for fundamental theories of quantum gravity. The structural realist claim might be assuming that the framework of EFT is universally applicable, but it might not be. This is a limitation of the translation.

  **Honesty in Translation**

  We have tried to be honest:

  - We did not assume that irrelevant operators are unreal; they are real at their scale but become negligible at low energies.
  - The cutoff is an artifact in the sense that physical predictions are cutoff-independent, but it is a useful tool.
  - Scheme-independent quantities are what we call real, but note that in EFT we often work with scheme-dependent objects to compute them.

  Where we stretched: The idea of "relations prior to relata" is not fully natural in EFT because we always start with some relata. But we argued that the invariant content is in the relations (correlation functions). This is a bit forced because we cannot do without relata at a given scale.

  **Residue Assessment**

  What is left over?

  1. The ontic version of structural realism (that structure is all there is) does not have a direct counterpart. The Wilsonian framework is naturally pluralistic about ontologies at different scales.

  2. The priority of relations over relata is not fully captured because we always need to choose relata to define the effective action. However, the relata are not fundamental and change with scale, so the relations are more stable.

  3. The structural realist's reliance on equations as the structure is problematic because the equations are scheme-dependent. We have replaced them with fixed-point data and anomalies, which are more abstract.

  Is the residue a sign that the physicist's vocabulary is missing something? Or that the structural realist claim was less clear?

  - The physicist's vocabulary (Wilsonian EFT) is very precise and operational. It clarifies what is meant by "structure" (fixed-point data) and what is retained (universal properties). This suggests that the structural realist claim was less clear, but the Wilsonian framework provides a precise version of it.

  - However, the Wilsonian framework does not address the metaphysical question of whether structure is all there is (ontic structural realism). This might be a gap, but it is not a gap a physicist would worry about.

  - Also, the Wilsonian framework is tied to a specific methodology (the RG) and might not be applicable to all theories (like quantum gravity). This is a limitation of the vocabulary.

  In summary, the translation is largely successful for epistemic structural realism, but the ontic version and the priority of relations over relata remain as residues that are not fully captured. The strain cases show that the structural realist's optimism about structure preservation must be tempered by the limitations of the EFT framework and the fact that parameters (like the cosmological constant) are not determined by the structure alone.
answer: |-
  ### Translation of Structural Realism into Wilsonian Effective Field Theory Vocabulary

  I'll translate the structural realist position systematically, using the Wilsonian effective field theory (EFT) framework, renormalization group (RG) flow, and related concepts. Your target vocabulary includes:
  - **Coarse-graining**: Integrating out high-energy modes to obtain a low-energy effective description.
  - **Effective action**: The action \( S_{\text{eff}}[\phi] \) at scale \( \Lambda \), with cutoff \( \Lambda \).
  - **Cutoff dependence**: Quantities that change with the regularization scale \( \Lambda \); scheme-independent quantities are physical.
  - **Universality class**: Theories flowing to the same RG fixed point, sharing long-distance physics.
  - **Fixed points**: Scale-invariant theories where RG flow vanishes; critical surfaces define universality classes.
  - **Relevant/irrelevant operators**: Operators that grow/shrink under RG flow toward the IR.
  - **Symmetries and anomalies**: Constraints on RG flow; anomalies are cutoff-independent obstructions to symmetry.
  - **Scheme-dependence**: Artifacts of regularization; only scheme-independent observables (e.g., correlation functions, critical exponents) are "real."

  I'll address each structural realist claim, then identify residues (what doesn't survive translation), stress-test with the cosmological constant and quantum gravity, and evaluate epistemic vs. ontic structural realism.

  ---

  ### Systematic Translation of Structural Realist Claims

  #### **Claim 1: When a successful theory is replaced, what is carried over is its structure (equations/mathematical form), not its ontology (entities/properties).**
  - **Translation**: In EFT, replacing a UV theory with a more fundamental one (e.g., replacing a lattice model with a continuum QFT) preserves the **fixed-point data and symmetries** of the IR effective action, not the UV degrees of freedom. 
    - **Retained "structure"**: The fixed point (critical exponents, symmetry group, anomaly coefficients), relevant/marginal operators, and scheme-independent observables (e.g., long-distance correlation functions \(\langle O(x)O(y)\rangle\)). These define the universality class.
    - **Discarded "ontology"**: Irrelevant operators, UV degrees of freedom (e.g., lattice spacing details, high-energy modes), and regularization artifacts. For example, replacing a microscopic spin model with a scalar field theory discards spins (ontology) but keeps the Ising critical exponents (structure).
  - **Why it matches**: RG flow shows that only relevant/marginal operators and symmetries survive coarse-graining; irrelevant operators decay and are "washed out." The equations (e.g., the effective action) change with scale, but their universal form (e.g., the Landau-Ginzburg Lagrangian for Ising) is retained.

  #### **Claim 2: This carry-over explains why the successor theory works in the predecessor's domain.**
  - **Translation**: The success of the low-energy EFT in the predecessor's domain is explained by **RG universality**. If two theories (e.g., a UV theory and its successor) are in the same universality class, they flow to the same fixed point, yielding identical long-distance physics. 
    - **Mechanism**: Coarse-graining the UV theory integrates out irrelevant operators, leaving only fixed-point data and relevant operators. The successor theory, if it shares this fixed point, reproduces the same IR observables (e.g., critical exponents, correlation lengths). For example, Fermi liquid theory works for metals because it is the IR fixed point of many microscopic Hamiltonians.
  - **Why it matches**: RG flow explicitly shows how high-energy details are irrelevant for IR physics. The "carry-over" is the invariance of the fixed point under coarse-graining.

  #### **Claim 3: Pessimistic meta-induction (current ontology will be discarded like the ether) is countered by structure retention.**
  - **Translation**: Pessimistic meta-induction argues that today's UV degrees of freedom (e.g., quarks) may be discarded like the ether, but **scheme-independent fixed-point data** (e.g., anomaly coefficients, symmetry representations) is likely preserved. 
    - **Structural preservation**: Even if the UV ontology changes (e.g., from strings to loops), the IR fixed point (e.g., for quantum gravity) must reproduce the same symmetries and anomalies (e.g., Lorentz invariance, chiral anomalies) to match existing data.
    - **Counter to meta-induction**: RG shows that discarded ontologies (e.g., lattice fermions) correspond to irrelevant operators, while retained structures (e.g., Dirac equation symmetries) are relevant/marginal. Thus, ontology changes are expected and do not undermine structural continuity.
  - **Why it matches**: RG separates ontology (scheme-dependent details) from structure (scheme-independent invariants), making ontology-replacement non-threatening.

  #### **Claim 4: Structure has never been made precise.**
  - **Translation**: In EFT, "structure" **is made precise** as: 
    - **Fixed-point data**: Critical exponents, scaling dimensions, symmetry group.
    - **Anomalies**: Quantities invariant under RG flow (e.g., 't Hooft anomalies).
    - **Scheme-independent observables**: Correlation functions \(\langle O(x)O(y)\rangle\) at long distances, topological invariants.
    - **What structure isn't**: The specific Lagrangian (e.g., \( \phi^4 \) vs. Ising spin Hamiltonian), which is scheme-dependent.
  - **Why it matches**: Wilsonian RG provides a rigorous definition: structure is what is invariant under coarse-graining (i.e., unchanged along RG trajectories).

  ---

  ### Residue Report: What Survives, Distorts, or Has No Counterpart

  I'll evaluate the translation fidelity, focusing on epistemic vs. ontic structural realism, priority of relations, and scheme-dependence. Residues fall into three categories:
  - **Clean translation**: No distortion; claim maps directly to EFT.
  - **Distorted translation**: Claim maps but loses/gains meaning.
  - **No counterpart**: Claim has no analog in EFT vocabulary.

  #### **1. Retention of Structure (Claims 1–3)**
  - **Clean translation**: Fixed-point data, symmetries, and anomalies are retained across theory changes. Ontology (irrelevant operators/UV DOFs) is discarded. Pessimistic meta-induction is neutralized by universality.
  - **Distortion**: Structural realists often cite "equations," but in EFT, equations (e.g., Lagrangians) are scheme-dependent and not preserved—only their universal content is. This refines structural realism but doesn't contradict it.
  - **Epistemic vs. Ontic Structural Realism**:
    - **Epistemic**: Translates cleanly. We know structure (fixed-point data) but not fundamental ontology (UV DOFs). EFT is inherently epistemic: coarse-graining hides UV details.
    - **Ontic**: **No counterpart** in EFT. EFT posits DOFs at each scale (e.g., fields in the effective action), so "relations without relata" is unnatural. Symmetry groups act on DOFs; correlation functions relate operators built from DOFs. EFT doesn't support "structure is all there is"—it assumes relata exist, even if emergent.

  #### **2. Relations Prior to Relata**
  - **No counterpart** in EFT vocabulary. EFT starts with DOFs (relata) and defines relations (e.g., correlation functions, order parameters) among them. For example:
    - Symmetry groups (e.g., \( \text{SU}(2) \)) act on pre-defined DOFs.
    - Order parameters (e.g., \( \langle \phi \rangle \)) are vacuum expectations of fields.
    - Attempted distortion: Anomalies or topological invariants (e.g., chiral anomaly) are relation-like, but they still constrain DOFs. RG flow changes DOFs (relata), but relations depend on them. EFT has no concept of relations without underlying DOFs.

  #### **3. Structure as Explanatory (Claim 2)**
  - **Clean translation**: Universality explains why successor theories work: same fixed point → same IR physics.
  - **Distortion**: Structural realists imply structure is "why" theories succeed, but EFT adds nuance: structure (fixed point) determines IR behavior, but **matching conditions** (e.g., fixing couplings from experiment) are also needed. This is implicit in structural realism but explicit in EFT.

  #### **4. Structure's Precision (Claim 4)**
  - **Clean translation**: Structure is precisely fixed-point data and anomalies.
  - **Distortion**: Structural realists often leave "structure" open-ended, but EFT forces specificity. This strengthens structural realism.

  ---

  ### Stress-Testing the Translation

  #### **Case 1: Cosmological Constant Problem**
  - **The strain**: In GR + QFT, coarse-graining yields a vacuum energy density \( \rho_{\text{vac}} \) that is \( \sim 10^{120} \) times larger than observed. Structural continuity (retaining GR equations) fails to explain this discrepancy.
  - **Translation in EFT**: 
    - The "structure" (GR equations, Lorentz symmetry) is preserved, but \( \rho_{\text{vac}} \) is a **relevant operator** at IR fixed points. Its value is not fixed by symmetries or anomalies; it requires fine-tuning or new physics (e.g., supersymmetry breaking).
    - This exposes a **defect in structural realism's assumptions**: It quietly assumes that "structure" (equations) determines all observables, but EFT shows that **parameters of relevant operators** (like \( \rho_{\text{vac}} \)) are not fixed by structure alone—they must be matched to experiment. Structural realism overestimates the explanatory power of equations.
  - **Impact on translation**: The strain arises from structural realism, not EFT. EFT vocabulary handles it by separating universal structure (equations) from non-universal parameters (couplings).

  #### **Case 2: Quantum Gravity and Background Independence**
  - **The strain**: In quantum gravity, background independence (e.g., in loop quantum gravity or string theory) may invalidate the Wilsonian framework, which relies on a fixed background metric for coarse-graining (e.g., cutoff \( \Lambda \) defined via a background).
  - **Translation attempt**: 
    - Structural realists might claim "diffeomorphism invariance" as retained structure. In EFT, this is a symmetry/anomaly constraint (e.g., Weyl anomaly cancellation).
    - However, without a background, coarse-graining lacks a clear scale \( \Lambda \), making RG flow ill-defined. Universality classes may not exist.
  - **Residue**: This shows a **defect in the target vocabulary**. Wilsonian EFT assumes a background, so it cannot translate structural realism in background-independent theories. Structural realism must either abandon background-dependent structure (e.g., equations) or admit limits to its generality.

  ---

  ### Honesty Check and Overall Residue Assessment
  - **Honesty**: 
    - I did not assume EFT axioms (e.g., "irrelevant operators are unreal") are part of structural realism. For example:
      - "Structure retention" became fixed-point data, not equations.
      - "Relations prior to relata" was flagged as having no counterpart.
    - Where physics vocabulary was stretched (e.g., "anomalies as relations"), I noted it.
  - **Residue summary**:
    - **Clean translations**: Structure retention, explanatory role, counter to meta-induction, and precision of structure. Epistemic structural realism fits perfectly.
    - **Distorted translations**: "Equations" as structure becomes fixed-point data (more abstract). Structure explains success but requires matching conditions.
    - **No counterpart**: Ontic structural realism (no relata) and relations prior to relata. EFT always assumes DOFs.
  - **Residue evaluation**: 
    - **Missing in physics vocabulary?** No. EFT's need for DOFs and matching conditions reflects how physics works—structural realism's omissions (e.g., parameters, priority of relations) are its own limitations.
    - **Sign of unclear claims?** Yes. Structural realism is vague on: 
      - How "equations" survive when they are scheme-dependent.
      - How structure determines parameters (e.g., cosmological constant).
      - Whether relations can exist without relata (EFT says no).
    EFT sharpens structural realism, exposing its ambiguities.

  ### Conclusion
  Structural realism translates well into Wilsonian EFT for epistemic claims about universality and fixed points. The residue—ontic structural realism and relations without relata—arises from philosophical overreach, not gaps in physics. EFT provides a rigorous framework for structural continuity but also reveals structural realism's blind spots: scheme-dependence of equations, the role of parameters, and the necessity of relata. Stress-tests show that structural realism underestimates these issues, while EFT handles them explicitly. As a physicist, your vocabulary doesn't miss anything; it clarifies structural realism by forcing operational precision.
