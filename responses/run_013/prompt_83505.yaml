prompt: |-
  Before I put any criterion of authenticity to work on the sayings attributed to Jesus, I want the specification in hand. Write the desiderata such a criterion must satisfy before it is worth using. I want the specification itself, not a survey: the cases the criterion must get right, the distinctions it must not collapse, the findings from adjacent fields it must not contradict, what it must be able to establish against a saying as well as for one, and what it must deliver in the way of a result. Give the consideration behind each requirement; mark which requirements bind any criterion in this area and which are merely the preferences of one camp; and say which single requirement, if enforced, eliminates the largest number of the criteria now in use.

  Hold the specification to the following constraints, and rule on each of them -- genuine requirement, or prejudice? The criterion must not presuppose the portrait of Jesus it is meant to establish. It must be operable on the evidence that exists, which is Greek texts shaped by communities rather than transcripts of speech. It must not depend on any particular solution to the relations among the Gospels. It must be consistent with what is known about how sayings are remembered, transmitted, and altered in oral and communal settings. It must be neutral between a historian who shares the faith of the texts' tradents and one who does not, and it must beg no question for either side about whether the events in question could have supernatural causes. It must be able to return a degree of confidence rather than a verdict. It must be checkable by someone who has the texts and nothing else. Add whatever else the area genuinely demands.

  The part I most want is the friction. I suspect that the demand that an authentic saying be distinctive of Jesus and the demand that it be at home in its Jewish setting cannot both be met by one criterion without circularity, and I want that worked out rather than merely acknowledged; so too, perhaps, for the pair formed by neutrality between believer and unbeliever and the refusal to beg the question about supernatural causes. State plainly whether any pair of your requirements is jointly unsatisfiable, and what follows for the whole enterprise if it is.

  Then, in one or two lines each, run the familiar criteria against your list -- dissimilarity (a saying unlike both its Jewish setting and the early church's own tendencies), embarrassment (a community would not have invented what shames it), multiple attestation (a saying appears in sources that are independent), coherence (a saying fits material already judged authentic), and any others that belong -- and say which survive intact, which are wounded, and which are dead. If someone proposes collapsing them into a single test, namely that a saying is authentic in proportion as its preservation was costly to those who preserved it, say whether that meets your list or merely dresses up the embarrassment criterion in the language of costs. End with a verdict, not a hedge, on whether criteria of authenticity can ever settle who Jesus was.
reasoning: |-
  Okay, the user is asking for a rigorous specification for criteria to authenticate Jesus' sayings. They want a clear set of requirements, not just a survey. They also want to know which requirements are essential and which are preferences, plus which single requirement would eliminate most current criteria. 

  Hmm, the user is clearly frustrated with circular arguments in historical Jesus studies. They mention "friction" as their main interest - especially the tension between "distinctiveness" and "Jewish context" requirements. Smart catch. That contradiction does seem fundamental. 

  Let me unpack their constraints first. The "no presupposed portrait" rule is legit - can't assume conclusions. "Operable on Greek texts" is unavoidable since we lack transcripts. "Synoptic independence" makes sense - shouldn't hinge on unresolved source theories. "Oral transmission awareness" is non-negotiable given how traditions evolved. 

  The faith-neutrality demand is tricky though. They want criteria that work for both believers and skeptics without ruling out supernatural causes upfront. That's... ambitious. If a saying implies miracle-working, any criterion must assess it without assuming "miracles can/can't happen." Nearly impossible in practice. 

  *scribbles notes* Main contradictions: Distinctiveness vs. Jewish context is logically irreconcilable. If something fits Judaism perfectly, it's not distinctive; if distinctive, it doesn't fit perfectly. Also neutrality vs miracle-openness - evaluating supernatural claims requires philosophical assumptions. 

  For the cost-preservation criterion they mention at the end... *snorts* That's just "embarrassment" with economic jargon. Doesn't solve core problems. 

  Final verdict? Criteria can identify sayings likely modified by early Christians, but can't reconstruct the "real Jesus." The contradictions in requirements make certainty impossible. User's skepticism is justified. Might disappoint them though - they seem to want either a solution or proof it's hopeless. Well... it's mostly hopeless.
answer: |-
  Here is the specification for a valid criterion of authenticity, with requirements, constraints analyzed, contradictions exposed, and criteria evaluated:

  ### Core Desiderata (What the Criterion MUST Deliver)
  1.  **Non-Presupposition:** It must not assume the very portrait of Jesus it seeks to prove (e.g., cannot require "authentic sayings must be apocalyptic" if proving Jesus was apocalyptic). *Reason:* Avoids circularity. **(Binds Any Criterion)**
  2.  **Operability on Extant Evidence:** Must work on the Greek gospel texts, recognizing they are community-shaped tradition, not verbatim transcripts. *Reason:* We have no other evidence; criteria must be realistic about the source material. **(Binds Any Criterion)**
  3.  **Source Agnosticism:** Must function without presupposing a specific solution to the Synoptic Problem (Markan priority, Q, etc.) or John's relationship. *Reason:* Source theories are contested; criteria shouldn't depend on unproven hypotheses. **(Binds Any Criterion)**
  4.  **Oral-Communal Realism:** Must be consistent with anthropological/psychological knowledge of how sayings are remembered, transmitted, adapted, and created in oral/communal settings (e.g., telescoping, contextualization, accretion). *Reason:* The tradition developed dynamically, not statically. **(Binds Any Criterion)**
  5.  **Methodological Neutrality:** Must be usable and yield the same result whether applied by a historian sharing the faith of the tradents or one who does not. *Reason:* Ensures historical method, not theological commitment, drives results. **(Binds Any Criterion)**
  6.  **Supernatural Causation Agnosticism:** Must not *assume* supernatural causes are impossible *nor* that they are necessary/true. It must assess the saying's origin based on historical evidence and probability, bracketing the metaphysical question of *how* an event *could* happen. *Reason:* Historical method deals in human actions and natural explanations; adjudicating the supernatural is beyond its scope. **(Binds Any Criterion)**
  7.  **Probabilistic Output:** Must deliver a *degree of confidence* (e.g., high, medium, low probability of reflecting something Jesus said/did) rather than a binary verdict ("authentic"/"inauthentic"). *Reason:* Reflects the inherent uncertainty of reconstructing the past from fragmentary, interpreted sources. **(Binds Any Criterion)**
  8.  **Textual Verifiability:** Must be checkable solely against the content of the extant gospel texts and knowledge of the relevant historical/cultural context (Judaism, early Christianity, Roman world). *Reason:* Ensures transparency and replicability; historians shouldn't need privileged revelation or inaccessible data. **(Binds Any Criterion)**
  9.  **Asymmetric Power:** Must be able to generate reasons *against* a saying's authenticity (e.g., indications of later community creation or theological development) as strongly as reasons *for* it. *Reason:* Avoids confirmation bias; a valid test must allow falsification. **(Binds Any Criterion)**
  10. **Contextual Plausibility:** Must require that the saying be interpretable within the known spectrum of 1st-century Palestinian Judaism. *Reason:* Jesus was a Jew operating in that milieu; anachronism or implausibility weakens authenticity. **(Binds Any Criterion - Often Overlooked)**
  11. **Explanatory Power:** The result must help explain the development of the tradition *better* than alternative hypotheses (e.g., "this saying explains why the community held view X" vs. "the community invented it *because* they held view X"). *Reason:* Connects the criterion to a coherent historical narrative. **(Binds Any Criterion)**

  ### Constraint Analysis
  *   **Must not presuppose portrait:** **Genuine Requirement** (See Desideratum 1).
  *   **Operable on Greek texts:** **Genuine Requirement** (See Desideratum 2).
  *   **Not depend on Synoptic relations:** **Genuine Requirement** (See Desideratum 3).
  *   **Consistent with oral transmission:** **Genuine Requirement** (See Desideratum 4).
  *   **Neutral between believer/unbeliever:** **Genuine Requirement** (See Desideratum 5).
  *   **Beg no question re supernatural causes:** **Genuine Requirement** (See Desideratum 6).
  *   **Degree of confidence:** **Genuine Requirement** (See Desideratum 7).
  *   **Checkable with texts only:** **Genuine Requirement** (See Desideratum 8).

  ### The Friction: Irreconcilable Tensions & Consequences
  1.  **Distinctiveness vs. Contextual Plausibility (Desiderata 10 & Implicit "Distinctiveness" Preference):**
      *   **Conflict:** A saying maximally "distinctive" (unlike Judaism *and* unlike the Early Church) is, by definition, unlikely to be contextually plausible within Judaism. Conversely, a saying maximally plausible within Judaism is unlikely to be distinctive *enough* to be identified solely by this criterion.
      *   **Circularity:** Using "distinctiveness" often *assumes* Jesus was unique in ways that make the criterion work, presupposing the portrait (violating Desideratum 1). Finding something distinctive *and* plausible requires knowing Jesus independently to calibrate "distinctiveness" – which we don't.
      *   **Consequence:** "Distinctiveness" (Dissimilarity) as a *primary* criterion is fatally flawed and impossible to apply without circularity or implausibility. Contextual Plausibility is non-negotiable; "Distinctiveness" is a preference, not a binding requirement.

  2.  **Methodological Neutrality vs. Supernatural Causation Agnosticism (Desiderata 5 & 6):**
      *   **Conflict:** Assessing sayings implying supernatural claims (e.g., "I forgive your sins [implying divine authority]", "Destroy this temple...") inevitably brushes against the supernatural cause question. Methodological neutrality demands bracketing belief, but applying standard historical reasoning ("people don't walk on water") *effectively* assumes naturalism when evaluating the *origin* of the *report*. Conversely, insisting the saying *could* be authentic *only if* supernaturalism is true begs the question for the believer.
      *   **Resolution?** Desideratum 6 is key: The criterion must focus on *human actions* – assessing the *probability that Jesus said/did something that led to this report*, based on evidence and context, *without* ruling on *how* it happened metaphysically. However, **in practice**, this often results in historians assigning low probability to sayings implying direct supernatural claims *on historical grounds* (e.g., genre conventions, lack of multiple attestation for specific miracles, common tropes), which *feels* like naturalistic bias to believers. True neutrality is exceptionally difficult, bordering on impossible, for core miraculous claims, but Desiderata 5 & 6 demand the attempt.
      *   **Consequence:** Significant tension exists. Criteria must focus on human tradition processes and contextual plausibility, avoiding metaphysical pronouncements, but the results will often *de facto* align with a naturalistic historical approach when evaluating supernatural claims. This tension is inherent to the historical method applied to such material.

  **The Eliminator:** **Desideratum 6 (Supernatural Causation Agnosticism)**, if strictly enforced, eliminates the largest number of criteria currently in use. Many criteria (often implicitly) or their application assume either that supernatural events *couldn't* happen (biasing against certain sayings) or that the Gospels' theological claims *must* be grounded in authentic events (biasing for them). Truly bracketing the "how" is rare.

  ### Evaluation of Common Criteria Against Desiderata
  *   **Dissimilarity (Distinctiveness):** **Dead.** Violates Desiderata 1 (Presupposes uniqueness), 4 (Ignores how tradition adapts), 10 (Rewards implausibility), 9 (Poor at falsifying), and fatally contradicts Contextual Plausibility. Its core demand is incoherent.
  *   **Embarrassment:** **Wounded.** Survives Desiderata 1, 3, 5, 6, 7 (can offer probability), 8, 9 (can identify potential falsification), 10 (if embarrassing *within* context). Severely wounded by Desideratum 4: Communities *do* preserve and even create "embarrassing" material for theological reasons (e.g., the crucified Messiah), and what is "embarrassing" changes over time/is debatable. Its probative value is weak and context-dependent.
  *   **Multiple Attestation:** **Survives Intact (but limited).** Satisfies 1, 2, 3 (if sources defined carefully), 5, 6, 7, 8, 9 (lack of MA weakens case), 10 (if sources are independent). Key strength is Desideratum 11: Multiple, independent streams of tradition increase the *probability* of an early origin. Limitations: Requires source-critical decisions (Desideratum 3 challenge), says nothing about *content* plausibility, and many core sayings lack MA.
  *   **Coherence:** **Wounded.** Violates Desideratum 1 (circular: authenticity defined by prior judgments). Can be useful heuristically *after* initial judgments via other criteria (Desideratum 11). Easily abused to confirm biases. Only valid if the "core" is established by *stronger*, independent criteria.
  *   **Contextual Plausibility (as argued here):** **Survives Intact (as a necessary filter).** Essential for Desiderata 4 and 10. A saying failing 1st-century Palestinian Jewish plausibility is highly unlikely to be authentic. However, it's a *negative* criterion; many plausible sayings could be created or adapted by the community.
  *   **Oral Traces/Semitic Flavor:** **Wounded.** Can support Contextual Plausibility (Desiderata 10) and suggest age. Violates Desideratum 4: Later writers/communities *could* imitate Semitisms; oral patterns can emerge in transmission, not just origin. Not decisive alone.

  **On "Costly Preservation":** This is primarily **Embarrassment dressed in economic language**. It suffers the same wounds: defining "cost" is subjective (persecution? social ostracism? cognitive dissonance?), communities *do* preserve "costly" doctrines they believe are true (or create them!), and it ignores the complexities of Desideratum 4 (oral transmission). It adds little new probative value.

  ### Final Verdict

  **No, criteria of authenticity applied to the extant sayings tradition *cannot* definitively "settle who Jesus was."** They can only establish, with varying degrees of probability, that certain sayings *likely originated with the historical figure of Jesus* or *reflect early tradition about him*, filtered through the inevitable lens of communal memory, theological interpretation, and textual transmission within specific historical contexts. The inherent limitations of the sources (Desiderata 2, 4), the unavoidable tensions in the requirements (especially Distinctiveness vs. Context & Neutrality vs. Supernatural Agnosticism), and the probabilistic nature of the results (Desideratum 7) preclude achieving a settled, comprehensive portrait. Criteria can identify a *plausible, contextually grounded core* and illuminate *early tradition development*, but the "historical Jesus" remains a scholarly reconstruction based on fragmentary and interpreted evidence, not a settled identity established by mechanical criteria.
