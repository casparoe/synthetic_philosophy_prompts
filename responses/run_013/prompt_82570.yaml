prompt: |-
  Next month I am presenting a paper at a two-day workshop on the ethics of climate and population at an interdisciplinary institute. The audience will be about twenty people: mostly economists who build integrated assessment models and work on discounting and uncertainty, plus three philosophers -- two total utilitarians, one of whom is a longtermist concerned with expected total welfare over the very long run, and one prioritarian who works on the non-identity problem -- and a single Kantian-leaning deontologist who is skeptical of all consequentialist population reasoning. I am defending a view I call Floor-Plus-Concavity. It has two parts. First, a weak sufficiency floor: adding people whose lives fall below a minimal-decent-life threshold is disvaluable unless doing so is necessary to prevent an even larger number of people from falling below that threshold. The floor is not a fixed absolute line; it is indexed to the institutional and technological capacity of the world in question, so the same absolute welfare level can be below the floor in a high-capacity world and above it in a low-capacity world. Second, above the floor, the marginal value of adding an additional life at a given welfare level declines as the population grows, so the value function is concave in population size. The concavity applies to additional lives, not to additional welfare for existing lives. The upshot is that the repugnant conclusion is blocked without a lexical threshold and without average utilitarianism: some very large populations whose members have very low positive welfare are worse than much smaller populations with high welfare, yet large future populations are still permitted if their lives are comfortably above the floor. I also argue that the view can be action-guiding for climate policy, because the floor constrains which future populations we may bring about and the concavity gives a principled reason to care more about existing and near-future people than about adding vast numbers of marginally happy people in the distant future.

  I need a Q&A prep sheet for the question period, not a general defense of the view. I have twenty-five minutes for questions, and I want to spend them on the objections that actually threaten the paper. Please give me the objections I will actually get from this audience -- not the ones I would get from a population ethics seminar -- ordered by how likely they are and how much damage they would do, with the most dangerous first. Phrase each objection in the vocabulary and style of the person likely to raise it: the economists will care about measurability, commensurability, expected utility, and the discount rate; the total utilitarians will press that my floor is an unmotivated deontological side-constraint and that my concavity is either ad hoc or collapses into average utilitarianism; the prioritarian will press that the floor is too low and that concavity still licenses huge inequalities and the aggregation of small harms; the deontologist will press that the whole framework treats persons as replaceable. For each objection, tell me what I should concede up front, what I should hold, a two-minute reply, and where the reply is soft. Include the one question I am hoping nobody asks, and say why it is the one I should fear. Also flag any objection that is really an objection to the repugnant conclusion's setup rather than to my view, so I do not waste time on it.

  Separate throughout what is settled from what is genuinely contested among people who know population axiology, and do not present a contested view as the consensus. Lead with your bottom line in the first sentence: which objection is most likely to sink the talk and what the single reply is that has to land. Then give the reasoning and the prep sheet. No preamble, no restating of the question, and no bibliography or reading list -- I need to be able to use this without looking anything up.
reasoning: |-
  Okay, the user is presenting a paper on "Floor-Plus-Concavity" at a specialized workshop. They need a focused Q&A prep sheet targeting objections from economists, utilitarians, prioritarians, and a deontologist in the audience. The key is identifying high-threat objections and crafting concise, field-specific replies.

  Hmm, the most dangerous objection seems to be from the economists about measurability. They'll challenge whether welfare can be quantified across contexts - a foundational issue. The reply must concede incompleteness but emphasize context-dependent feasibility within climate models. 

  For the longtermist utilitarian, the "deontological side-constraint" critique is critical. I should frame the floor as a structural necessity to avoid repugnant outcomes, not an arbitrary rule. The collapse-into-average-utilitarianism concern needs a clear distinction: concavity affects new lives only, not existing welfare transfers. 

  The prioritarian will likely attack the floor's adequacy. Conceding its modesty upfront is wise, then pivoting to concavity as inequality mitigation. But I must admit concavity doesn't solve aggregation - that's a soft spot. 

  The deontologist's replaceability charge is expected but less damaging. The reply should emphasize person-affecting constraints without conceding ground on population ethics viability. 

  The nightmare question? Someone asking why the floor isn't lexical - that exposes a tension in the view. The best defense is pragmatic: lexical thresholds cause discontinuities worse than the repugnant conclusion. 

  Notable red herrings: Any objection assuming fixed-number comparisons. The paper clearly addresses variable population ethics, so I'll flag those to avoid tangents. 

  Throughout, I'll keep replies under two minutes, mark soft spots honestly, and order objections by both likelihood and lethality. The economists' measurability challenge goes first - if that lands, nothing else matters.
answer: |-
  ### Most Dangerous Objection & Core Reply  
  **Objection:** (Economists) "Your floor and concavity require cardinal, interpersonally comparable welfare across eras and capacities. But climate IAMs use *consumption-equivalent* metrics with normative assumptions baked in. How is this operationalizable without arbitrary parameterization?"  
  **Why it sinks you:** If your view can’t guide models, it’s irrelevant to this audience.  
  **Must-land reply:** *"Concede welfare measurement is contested, but the floor targets *basic capability thresholds* (e.g., nutrition, security) already quantified in sustainability contexts. Concavity’s discounting effect on distant lives resembles *risk-adjusted discount rates*—we can calibrate it using empirical time-preference studies without full cardinality."*  

  ---

  ### Q&A Prep Sheet: Ordered by Threat Level  
  *(Concede = What to accept; Hold = Core defense; Soft = Vulnerability)*  

  1. **Economists (IAMs/Discounting)**  
     - **Objection:** "Concavity above the floor looks like *time discounting* of future people. But discounting consumption is already controversial—discounting *lives* is ethically indefensible. How is this not double-counting?"  
       - *Concede:* Discounting lives sounds harsher than discounting consumption.  
       - *Hold:* Concavity isn’t temporal discounting—it’s *population-size sensitivity*. A model with 10^12 people isn’t 10x more valuable than 10^11 at the same welfare.  
       - *Reply (2-min):* "This isn’t discounting time but *scaling marginal value per life added*. Like declining marginal utility of income, but for persons. Climate IAMs already weight aggregate welfare—concavity formalizes why adding a life in 2300 isn’t equal weight to adding one now when populations explode. Soft: Calibration needs normative input."  
     - **Objection:** "Indexing the floor to 'institutional capacity' makes it path-dependent. How do we model this under uncertainty without recursive, computationally infeasible ethics?"  
       - *Concede:* Dynamic floors increase model complexity.  
       - *Hold:* Capacity proxies exist (e.g., GDP/tech in SSP scenarios). Floor binds only when avoiding catastrophe *requires* sub-floor lives—rare in climate models.  
       - *Reply:* "Use *observed* capacity thresholds: e.g., ‘no lives below 1900-MDL in 2100’. Only activates in tail risks (e.g., collapse scenarios). Soft: Defining ‘necessity’ is fuzzy."  

  2. **Longtermist Total Utilitarian**  
     - **Objection:** "The floor is a deontological constraint smuggled into consequentialism. If preventing 1B sub-floor lives requires creating 1M sub-floor lives, total utility says *do it*. Your ‘unless necessary’ clause is arbitrary."  
       - *Concede:* Total utilitarianism avoids ad hoc thresholds.  
       - *Hold:* The floor blocks *catastrophic trade-offs* (e.g., sacrificing the poor to make more poor people). It’s motivated by *non-exploitation*, not deontology.  
       - *Reply:* "This floor prevents *instrumentalizing* the worst-off. We accept similar constraints in public health (e.g., no lethal human trials). Soft: Yes, it’s a non-consequentialist element—but necessary to avoid repugnance."  
     - **Objection:** "Concavity collapses into *average utilitarianism* for large populations. Why not just adopt that?"  
       - *Concede:* Both reject repugnant conclusions.  
       - *Hold:* Average utility disvalues *any* new life below current average. Concavity permits adding happy lives if populations are small.  
       - *Reply:* "Average utility says: *Don’t have a child* if it lowers the average. Concavity says: *Have the child*, but 100M similar children aren’t 100M times better. Soft: At scale, they converge—but concavity is more permissive pre-scale."  

  3. **Prioritarian**  
     - **Objection:** "A capacity-indexed floor is too weak—it permits huge inequalities *above* the floor. Concavity doesn’t prioritize the worst-off; it just values large populations less. Why not weight sub-floor lives *more*?"  
       - *Concede:* Concavity doesn’t solve inequality; it’s not prioritarian.  
       - *Hold:* The floor *is* prioritarian for the worst-off. Above-floor concavity prevents large populations from swamping small harms.  
       - *Reply:* "The floor *is* weighting: anyone below it has lexical priority. Concavity above handles aggregation (e.g., 1B minor climate harms > 1 major harm). Soft: True, it doesn’t weight *proximity* to the floor—but that’s your view’s job."  

  4. **Deontologist**  
     - **Objection:** "Your entire framework treats persons as replaceable. If a future person has positive welfare, you’d sacrifice an existing person to create them, so long as aggregates improve. Kantians reject this."  
       - *Concede:* Consequentialism *does* see replaceability as a feature.  
       - *Hold:* The floor blocks *disastrous* replaceability (e.g., killing to create sub-floor lives). Concavity values existing lives more than potential ones.  
       - *Reply:* "Replaceability applies only above the floor, and concavity *deprioritizes* adding distant lives. But yes: I accept *some* replaceability—it’s why we build infrastructure that risks lives for future generations."  

  ---

  ### The Nightmare Question  
  **"Why isn’t your floor a *lexical threshold*? If a life just above the floor is vastly better than one below, concavity still allows trading vast numbers of barely-above-floor lives for fewer better lives—which is *semi*-repugnant. Isn’t this a hidden lexical view?"**  
  **Why you fear it:** It exposes a tension. If barely-above-floor lives have low marginal value, large populations of them could be worse than small happy ones—but if they’re *too* low-value, it *is* lexical. Your concavity must walk a tightrope.  
  **Reply:** *"Concede lexicality is cleaner but leads to *worse* problems (e.g., ‘mere addition paradox’). Concavity avoids discontinuities: a life at 1% above floor has positive (but diminishing) value. Soft: Yes, there’s no bright line—but capacity-indexing already avoids absolutism."*  

  ---

  ### Red Herrings (Objections to Repugnant Conclusion Setup)  
  Flag these quickly:  
  - **"But the repugnant conclusion assumes welfare is additive!"** → "My view *modifies* additivity; this is core to the paper."  
  - **"We can’t compare welfare across populations!"** → "This debate assumes we can; I’m offering a better comparator."  
  - **"Future people don’t exist—we can’t harm them!"** → "Non-identity problem is real, but the floor binds *conditional* on creating them."  

  ### Strategic Notes  
  - **Economists** are the gatekeepers—win them, and others’ objections are academic.  
  - **Concede early** on non-consensus points (e.g., "Yes, welfare measurement is thorny").  
  - **Redirect to climate:** Always tie replies to policy relevance (e.g., "This explains why we prioritize adaptation now over marginal lives in 2300").  
  - **Soft spots are okay:** Admit where the view has tension ("That’s a boundary case—I’d need to refine"). Your goal is plausibility, not bulletproofing.
