prompt: |-
  I'm in a reading group on Frege and we keep coming back to the diary he kept near the end of his life, the one with all the antisemitic and antidemocratic ranting in it, which only became public long after he died. Half the group says this is pure biography: the man was a reactionary crank, the logic and the theory of sense stand or fall on their own, and anyone who thinks the diary tells us something about the philosophy is doing amateur psychoanalysis. The other half says that's naive — that a philosophy which treats senses as mind-independent objects we don't make but find, and logic as a special non-empirical domain hovering above the messy empirical world, is at minimum continuous with a politics of hierarchy and contempt for the democratic rabble, and that we now have to ask whether the philosophy's pretensions to universality and impersonality survive contact with the man who wrote both things. I'd like a number, not a tour of the literature (skip citations, I have the texts).

  What's your credence that Frege's political writings genuinely bear on his philosophy — where I mean something stronger than "it's interesting biography" and weaker than "it refutes logicism," roughly: that a fully adequate account of his philosophical project has to engage with the political stuff, or that the politics surfaces as a substantive commitment inside the philosophy rather than sitting alongside it? I'm at about 0.35; a friend in the group who leans much harder into the "it's all of a piece" reading is at 0.85. Give me your own number, then the decomposition: how much rides on what we're allowed to mean by "bears on" (causal/genetic vs. interpretive vs. justificatory), how much on whether anti-psychologism plus Platonism about senses is a loaded metaphysical-political stance or a technical device that could have been adopted by anyone, how much on actual textual bridges between the diary and the published work, and how much on the general question whether a theory's content can ever be insulated from its author's commitments — add any term you think I've missed, put a rough probability on each, show how they combine, and tell me which term you're least sure of and what would move it most. And be committed about it: if you think the question is confused, say so and pick the reading you think is the right one to be asking about, rather than hedging with "it depends what you mean." Finally, tell me whether my friend and I are most likely disagreeing about Frege or about which sub-question we're each quietly answering.
