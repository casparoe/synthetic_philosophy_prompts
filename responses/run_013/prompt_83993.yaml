prompt: |-
  I chair the selection panel for a small foundation's flagship fellowship, and we score every application against a published rubric. Two or three times a year we end with two finalists whose scores are identical and whose files resist further discrimination, and the panel then does one of two things badly: it deliberates past its deadline, or someone invents a tie-breaker that was never in the rubric. Please write a procedure the panel can run whenever this happens, built on what is actually known about choice without preference — the Buridan's-ass problem at institutional scale. It has to separate the four situations that get conflated: indifference, where the options leave us cold; parity, where they are comparable but neither is better and the difference matters; uncertainty, where we do have a ranking but lack the facts; and a preference we hold but have not admitted to ourselves. Give me the questions to ask in order, what counts as a sufficient answer to each, when to stop collecting information and act, whether a lottery or coin toss is ever permissible and what would have to be true for it to be, and why a decision made without a preference can still be rational rather than a confession of failure. Mark the points where the procedure hands the matter to a person — the chair, the board — because the question is one of values, not facts. Then run it on two cases: a genuine tie between two equally strong finalists, and a tie that dissolves once the panel admits what it is actually weighing. Include one case where it gives an answer I will not like, and say what the procedure cannot do.
reasoning: |-
  Okay, the user chairs a selection panel for a fellowship and faces recurring ties between finalists. They need a structured procedure to break ties without arbitrary methods or delays. Let me unpack their request.

  First, they mention conflating four situations: indifference, parity, uncertainty, and unadmitted preference. The procedure must distinguish these. The user wants a rational approach rooted in Buridan's ass problem—deciding without preference. They also want clear steps, when to use lotteries, and how values vs. facts are handled.

  Key points from the query: The procedure must include specific questions, sufficient answers, stopping criteria, permissibility of lotteries, and why it's rational. Two cases: genuine tie and dissolved tie. One disliked outcome. Limitations. 

  Now, structuring the procedure. The core is diagnosing the tie type. Start with questions targeting each conflation: 

  1. **Indifference**: Do we care? If both options are equally undesirable, that's different from parity.
  2. **Parity**: Are they truly equal in merit? If so, a lottery might be fair.
  3. **Uncertainty**: Is there hidden information? If yes, seek it if feasible.
  4. **Unadmitted Preference**: Are we avoiding a tough choice? Name the value trade-off.

  Need clear thresholds for each step. For example, if uncertainty exists but info can't be obtained timely, move to parity/lottery. Values-based decisions should escalate to chair/board.

  Lottery permissibility: Only in true parity after exhausting other paths. Must be transparent. 

  Rationale without preference: Following a fair process is rational; avoiding bias is better than forced ranking.

  Cases: 
  - Genuine tie: After all checks, lottery is valid.
  - Dissolved tie: Unadmitted preference surfaces—e.g., one candidate's field is unconsciously favored. Then decide based on named value.
  - Disliked outcome: Lottery picks the "less exciting" candidate. Accept it as system integrity.

  Limitations: Can't create distinctions where none exist; human judgment still needed for values.

  User's deeper needs: Reduce panel fatigue, uphold fairness, maintain deadlines. They want legitimacy in decisions, even unpopular ones. Unspoken: preserving panel cohesion and foundation reputation.
answer: |-
  Here is a formal tie-breaker procedure for your panel, grounded in decision theory and designed to separate the four conflated states (indifference, parity, uncertainty, unadmitted preference). It prioritizes rationality, transparency, and timely action.

  ---

  ### **Tie-Breaker Procedure for Fellowship Finalists**
  **Trigger:** Two finalists with identical rubric scores after all standard evaluations.  
  **Time Limit:** 90 minutes maximum for this procedure.  
  **Objective:** Diagnose the nature of the tie and resolve it without inventing new criteria.

  #### **Step 1: Interrogate Indifference**  
  *Question:* **"If we *had* to reject both candidates, would we feel relief or regret?"**  
  - *Sufficient Answer:*  
    - **Relief (Indifference confirmed):** Both candidates are weak. Escalate to the **Chair** with a recommendation to reopen applications or declare no award.  
    - **Regret (Indifference ruled out):** Proceed to Step 2.  
  - *Stop & Act:* If indifference is confirmed, the Chair decides within 24 hours whether to void the tie or seek new applicants.  

  #### **Step 2: Test for Parity**  
  *Question:* **"Is there *any* meaningful distinction between the candidates within the spirit of the rubric’s core values?"**  
  - *Sufficient Answer:*  
    - **No (Parity likely):** Proceed to Step 3.  
    - **Yes (Potential unadmitted preference/uncertainty):** Proceed to Step 4.  
  - *Rationale:* Forces the panel to articulate if "equality" reflects true equivalence or hidden hesitation.  

  #### **Step 3: Verify Uncertainty**  
  *Question:* **"Is there critical, *feasible-to-obtain* information we lack that could break this tie? (e.g., clarification from references, verifying a claim)"**  
  - *Sufficient Answer:*  
    - **Yes (Uncertainty):** The **Chair** judges if data can be gathered within 48 hours without bias. If yes, pause and collect. If no, proceed to Step 5.  
    - **No (Parity confirmed):** Proceed to Step 5.  
  - *Stop & Act:* If paused for data, reconvene within 72 hours. If new evidence breaks the tie, decide. If not, proceed to Step 5.  

  #### **Step 4: Surface Unadmitted Preference**  
  *Question:* **"What unspoken value or fear is making this choice hard? State it as: 'We are torn between [Value A] and [Value B].'"** (e.g., "Innovation vs. Impact," "Safe bet vs. High-risk vision").  
  - *Sufficient Answer:*  
    - **Named value conflict:** Escalate to the **Board** (or Chair if Board unavailable) to decide which value aligns with the fellowship’s mission.  
    - **No consensus on value conflict:** Return to Step 3 (uncertainty) or Step 5 (parity).  
  - *Rationale:* Converts subconscious bias into an explicit values-based choice for leadership.  

  #### **Step 5: Resolve Parity (The Buridan’s Ass Resolution)**  
  *Question:* **"After exhausting all steps, do we confirm these candidates are truly equivalent *and* worthy?"**  
  - *Sufficient Answer:*  
    - **Yes:** Initiate a **public lottery** (e.g., draw names from a hat during the meeting).  
    - **No:** Return to Step 1 (indifference) or Step 4 (unadmitted preference).  
  - *Lottery Conditions:*  
    - Permissible **only** after:  
      1. Indifference is ruled out (Step 1).  
      2. No further data resolves uncertainty (Step 3).  
      3. No value conflict is identified (Step 4).  
    - Must be documented as: "Resolved by verified parity under Procedure 5.1."  
  - *Rationale for Rationality:* A lottery acknowledges true equivalence while respecting candidates’ worth. It is *not* failure—it is a fair, efficient solution when all meaningful distinctions are absent. Forcing artificial preferences invites bias.  

  ---

  ### **Case Applications**

  #### **Case 1: Genuine Parity**  
  - **Finalists:** Dr. A (theoretical physics) and Dr. B (experimental physics). Scores identical.  
  - **Procedure:**  
    - Step 1: Panel feels regret at rejecting either → **Proceed**.  
    - Step 2: No distinction in rubric values (both excel in originality/impact) → **Parity likely**.  
    - Step 3: No missing data → **Parity confirmed**.  
    - Step 4: No unspoken values conflict → **Proceed**.  
    - Step 5: Lottery conducted. Dr. B wins.  
  - **Outcome:** Rational. No false distinctions invented.  

  #### **Case 2: Dissolved Tie (Unadmitted Preference)**  
  - **Finalists:** Ms. X (community health work in rural India) and Ms. Y (biotech startup in Kenya). Scores identical.  
  - **Procedure:**  
    - Step 1: Rejecting both causes regret → **Proceed**.  
    - Step 2: Panel hesitates → **Proceed to Step 4**.  
    - Step 4: Panel admits: "Torn between **immediate local impact** (X) and **scalable technology** (Y)."  
    - **Escalated to Board**. Board prioritizes "scalability" as a 2025 strategic goal. Ms. Y wins.  
  - **Outcome:** Tie dissolved by confronting hidden value conflict.  

  #### **Case 3: Disliked Outcome**  
  - **Finalists:** Mr. P (conservation policy) and Ms. Q (climate tech). Scores identical.  
  - **Procedure:**  
    - Steps 1–4: Indifference, uncertainty, and value conflicts ruled out.  
    - Step 5: Lottery → Ms. Q wins.  
  - **Why You Might Dislike It:** You privately favored Mr. P’s field. The procedure ignores "gut feelings" without articulated values.  
  - **Rationale:** The lottery prevents personal preferences from overriding verified parity. Accepting this upholds procedural fairness.  

  ---

  ### **What the Procedure Cannot Do**  
  1. **Create distinctions where none exist.** It accepts that true parity is possible.  
  2. **Eliminate human judgment.** Values-based decisions (Steps 1 & 4) require leadership escalation.  
  3. **Guarantee "optimal" outcomes.** It prioritizes *fair process* over *perfect insight*.  
  4. **Resolve systemic rubric flaws.** If ties recur, revisit the rubric design.  

  ### **Key Features**  
  - **Time-Bound:** 90-minute limit forces decisiveness.  
  - **Escalation Paths:** Chair/Board handles values; panel handles facts.  
  - **Transparency:** Every step documented in the decision log.  
  - **Legitimacy:** A lottery under parity is a *virtue*—not a failure—of equitable systems.  

  By diagnosing the *type* of deadlock, this procedure replaces anxiety with agency. It transforms Buridan’s ass from a paradox into a solvable workflow.
