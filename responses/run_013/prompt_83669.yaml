  Cutting room floor: 
  - Control group analogy (too academic) 
  - Historic assembly examples (can't verify) 
  - Any theorist names (per constraints) 

  Watch language: 
  Replace "sortition" with "random selection" 
  Avoid "lottocracy" entirely 
  "Uncapturable" better than "unbought" 

  Final test: Does every paragraph serve either the firewall metaphor or the binding recommendation? If not - cut. Seven minutes is shorter than it feels.
answer: |-
  ## Opening Remarks: The Unbought Table  

  **(Approx. 6:30 minutes / 1000 words)**  

  Good morning. My name is [Your Name]. For two years, I argued for this moment: for *this* room, for *you* sixty, drawn by lot, to sit together and decide how our city spends its flood-defence levy. Thank you for being here. I know many of you feel out of place – wondering if you should be the ones making this call. I’ve heard the concern: “Picking a budget committee by lot? Isn’t that like picking surgeons by lot?” It’s a serious question. Let’s answer it.  

  The usual defence of choosing people by lot – randomly – is that it creates a *mirror*. It gives us a room that *looks like* the city: the same mix of ages, jobs, neighbourhoods, opinions. The idea is that this mirror makes your decisions legitimate because you *represent* everyone else.  

  **I think that mirror defence is wrong. And worse, it’s dangerous.**  

  It’s wrong because no sixty people, however carefully chosen, can perfectly reflect tens of thousands. Someone will always feel left out. It’s dangerous because if we sell this assembly as a mirror, we set you up to fail. The moment your views shift as you learn – which they *must* – someone will shout: “That’s not what *I* think! The mirror is broken!” They’ll say you’ve lost your right to decide.  

  **So let’s throw out the mirror. Here’s why you are here, and why it matters.**  

  You are here because of a **firewall**.  

  Think about how people usually get onto bodies that decide things like city budgets. They run for council. They get appointed. They lobby. They donate. They network. They inherit influence. They build fame. Every single one of these paths is a **channel**. And channels get farmed.  

  If there’s a channel, people will learn how to flow down it. Money flows down it. Favours flow down it. Ambition flows down it. Organised groups learn to push their people down it. Over time, the people who end up at the end of those channels? They aren’t necessarily the wisest, or the most thoughtful about floods. They are the people who are *best at getting selected*. Best at campaigning, fundraising, networking, or simply being born into the right connections. The channel itself shapes who gets through.  

  **The lot – random selection – is different.** It’s not a channel. It’s a **firewall**.  

  Its power isn’t that it *copies* the city. Its power is that it **cuts the channels.**  

  Nobody could campaign to get into *this* room. Nobody could donate their way in. Nobody could inherit a seat here. No political party could stuff this room with their members. No lobbyist could guarantee their voice was here. You didn’t need connections, fame, wealth, or ambition. The *only* qualification was being a resident, and then pure chance. **This table is unbought.**  

  **That’s your strength.** That’s why you belong here. Not because you perfectly represent your neighbour’s view this morning, but because *nobody captured the path to your seat*.  

  **What does this mean for your job here?**  

  1.  **You are not delegates.** I am *not* asking you to go home and survey your street, then come back and fight for what your neighbours told you. That’s channel-thinking – lobbying your own little piece of the channel. Your neighbourhood’s views are already out there, loud and clear, in the usual channels: the papers, the council meetings, the angry letters. **Your job is different.** Your job is to sit here, *free from those channels*, and use the next four weekends to do something incredibly rare: **deliberate.** Listen to experts chosen for *you*. Question them. Read the evidence provided *for you*. Debate respectfully with each other. Weigh costs and benefits. Change your mind if the evidence leads you there. Find common ground. Your value comes from this protected space, this firewall, where your decisions are shaped by evidence and discussion, not by who shouted loudest outside or who funded your campaign.  

  2.  **Quality matters more than snapshot accuracy.** We didn’t pick you to take a snapshot of today’s opinions. We picked you to build something better: a *thoughtful, evidence-based* recommendation, built in a space shielded from the usual political pressures. Your legitimacy comes from the **integrity of the process** – the firewall, the access to experts, the time for real talk – not from mimicking a poll.  

  **This brings us to the most important question: What happens to your work?**  

  This assembly isn’t a talking shop. It isn’t advice the council can quietly ignore. **Your final recommendation on how to spend the flood levy will be put to a binding city-wide vote, up or down, no amendments.**  

  **Why binding? Because the firewall must extend to the end.**  

  If your hard work, your careful deliberation, just becomes another report the council can take or leave… well, then the channels win. Lobbyists will swarm councillors. Old pressures will resurface. The unique value of *this* process – the unbought table, the shielded deliberation – gets lost. A binding vote respects *your* shielded work. It gives the *whole city* the final say, based on *your* clear proposal. It ensures this firewall wasn’t built for nothing. I fought for this binding commitment because this process deserves that weight. It’s your safety net: knowing your work *will* go directly to the people.  

  **So, to the person worried this is like drawing surgeons by lot:**  

  You’re right. If we randomly grabbed sixty people *tomorrow* and said “Operate!”, it would be madness. But that’s *not* what we’ve done. We haven’t just drawn names and thrown you into surgery. We’ve built an operating theatre.  

  *   We’ve drawn names to find people *no one could pre-select*.
  *   We’ve built a *firewall* against the usual channels of influence.
  *   We’ve given you *four weekends*.
  *   We’ve provided expert witnesses and evidence.
  *   We’ve created space for *real deliberation*.

  **You are not surgeons picked at random. You are ordinary people given extraordinary tools and protected space – shielded by a firewall – to make an extraordinary decision.** Your qualification isn't prior expertise on flood defences. It’s that you arrived here *free*. Free from the debts, the pressures, the baggage of the channels. Your job is to use this freedom, and the resources provided, to listen, learn, debate, and decide.  

  This is hard. It’s unfamiliar. It asks you to think differently about your role. It’s colder, perhaps, than calling you a perfect mirror. But it’s more honest. And it’s vastly more powerful. You are here because this table *had* to be unbought. Your task is to fill it with careful thought.  

  Over these four weekends, you will become experts *together*. You will build something new. Something that couldn't have been bought, campaigned for, or inherited. Something built behind a firewall.  

  That’s worth doing. That’s why you’re here. Let’s begin.
