  Academic observers will cringe at oversimplification - every claim must be structurally airtight.

  Biggest challenge: making "you're here because you're uncorruptable, not competent" inspiring. Flip it - their lack of political baggage is what makes their judgment pure. The fifteen-hour evidence review is the equalizer. 

  Structure thoughts:
