prompt: |-
  Me and my friend got into it for like two hours last night about the frame problem and I'm pretty sure we were talking past each other for most of it. Her line: it's an old logic puzzle about how a planner knows the wall is still the same colour after you shove a chair, it got handled by nonmonotonic logics and default rules and circumscription and whatever, and nobody building actual systems cares, so it's a museum piece. My line: the narrow version was the easy half. The real problem is relevance — how does a system know which of the indefinitely many facts about a situation bear on what it's doing right now — and that one isn't solved, it's just been renamed (relevance, grounding, binding, take your pick) and quietly relocated into the training data or into whatever human writes the axioms. She thinks I've stretched the word until it means "AI is hard." I think she's solved a different problem and declared mine closed.

  Write the joint statement the two of us should have written instead of shouting. Like one of those adversarial-collaboration writeups: a numbered section of agreed claims that we'd both actually sign — not mushy compromise wording, real claims about what the problem is, what's been achieved, and what a solution would even look like — then a disagreements table where each row is one issue, her side in words she'd accept and mine in words I'd accept.

  For each crux, give a concrete case or argument we'd both agree bears on it (no hand-waving, something we could actually go check) plus what each of us predicts about it in advance. The ones I'm fairly sure are cruxes: whether the narrow and broad problems are really the same problem or whether the word just got stretched; whether a learned system that nails relevance in-distribution but not out of it counts as solving it or as relocating it; and whether swapping the symbolic planner for a big net changes anything or just puts the same problem in different clothes. Also: is there any observable difference between a system that has solved this and one that hasn't, or is that itself the reason the debate never resolves?

  If some of the rows turn out to be about what the words mean rather than about the world, say so and tell me what substantive residue is left. And be honest about whether my side is the one that keeps redefining the problem to stay safe from counterexamples. Keep it to claims and cruxes — I don't need to know who said what in 1969, I need the actual disagreement.
