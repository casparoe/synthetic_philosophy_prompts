prompt: |-
  I run a Thursday evening discussion group at the community centre — no entry requirements, no essays due in advance, we just read bits and pieces and argue about them for two hours. We've just finished four weeks on W. E. B. Du Bois and I want to set them a proper end-of-term essay question, with a model answer and a marking scheme, because at the moment I grade these things by gut feeling and I'd rather have something to point at when somebody asks why they got a B.

  Here's what's been nagging me. Du Bois gave a speech in the twenties about black art, and the gist of it is that art is always propaganda, whether the purists moan about it or not — he more or less says he's got no time for art that isn't. Fair enough. But in the same breath he says the artist has to be free, and that whoever sets out to serve beauty ends up serving truth and right whether he wants to or not, and that his freedom is bounded by truth and justice. So is he bossing artists about, or is he saying nobody can help themselves? Those are two very different claims and I've been going round in circles about it for weeks and its driving me mad.

  And then there's my own hobby horse, which I'd like the question to make them chew on. I've decided there are two kinds of propaganda. The megaphone kind tells you what to think. The window kind just puts something in front of you and says, this is real, look at it. The megaphone argues, the window shows. I reckon Du Bois is mostly a window man who talks like a megaphone man. But I'm worried that if we let him have the window reading, his whole point goes limp — because if propaganda just means "art that shows you something", then saying all art is propaganda is like saying all novels are made of words. True, but so what?

  So what I want is one essay question that forces them to deal with that, not just to write "Du Bois thought art should be political", which is what most of them will do if I let them.

  Please give it to me as a JSON object so I can paste it into the worksheet template I've been messing about with, with these fields:

  - question — the essay question itself, answerable in about 45 minutes of writing. Phrased so a bright adult with no philosophy training can see what they're being asked, but hard enough that a summary of Du Bois won't answer it.
  - what_a_top_answer_must_do — a list of the specific moves an A answer has to make, roughly in the order they'd come.
  - model_answer — around 650 words.
  - total_marks — 20.
  - mark_scheme — a list, one entry per thing being marked, each an object with criterion, marks, gets_full_marks_if, and loses_marks_if (say what specifically costs marks, not just "less clear").
  - biggest_trap — one line on the mistake that will cost the most people the most marks.
  - plain_english_glossary — a list of term and means, covering any jargon that ends up in the model answer, because half the group will be reading this on their phones on the bus.

  Couple of things to keep in mind. They're definately not philosophy students, so the question shouldn't hinge on knowing the title of the speech or the year it was given, or on any other name — if they've never heard of the essay they should still be able to answer it from what I've said above plus what they already know. And don't let the marking scheme reward people for agreeing with me about the megaphone and the window. I want to know whether my little distinction survives being taken seriously, so the top answers should be allowed to say it collapses, and the mark scheme should have a way of giving credit for that.
reasoning: |-
  We are creating an essay question based on Du Bois's view on art as propaganda and the tension between artistic freedom and serving truth/justice. The user has also introduced the concept of two kinds of propaganda: megaphone (telling what to think) and window (showing what is real). The question should force students to grapple with whether Du Bois is prescribing (bossing artists) or describing (nobody can help themselves) and how the user's megaphone/window distinction holds up.

   Key points from the user's description:
   1. Du Bois: art is always propaganda; artist must be free; serving beauty leads to serving truth and right; freedom bounded by truth and justice.
   2. Tension: Is Du Bois commanding artists (bossing about) or saying it's inevitable (nobody can help themselves)?
   3. User's distinction: 
      - Megaphone: argues, tells you what to think.
      - Window: shows, puts something in front of you as real.
   4. User's view: Du Bois is mostly a window man who talks like a megaphone man. But if propaganda is just "showing something real", then saying all art is propaganda becomes trivial.

   The essay question should:
   - Not require prior knowledge of the speech title or year, or other names.
   - Be answerable from the provided description and what they've learned in the discussion group.
   - Force students to go beyond "Du Bois thought art should be political".
   - Allow students to challenge the megaphone/window distinction.

   We'll design the question to focus on the tension and the user's distinction.

   Proposed Question:
   "Du Bois argues that all art is propaganda and that the artist must be free, yet also claims that the artist's freedom is bounded by truth and justice. Using the concepts of 'megaphone propaganda' (which argues a point) and 'window propaganda' (which shows reality), explain whether Du Bois is prescribing what artists should do or describing what they inevitably do. In your view, does the megaphone/window distinction help resolve the tension in Du Bois's position?"

   Why this question?
   - It directly addresses the tension the user is worried about (prescriptive vs descriptive).
   - It requires the use of the megaphone/window distinction to analyze Du Bois.
   - It asks for the student's own view on whether the distinction resolves the tension, allowing them to challenge the distinction.

   Top Answer Must Do (in order):
   1. Clearly explain Du Bois's apparent tension: that he insists art is always propaganda (so it must serve a purpose) but also that the artist must be free and that serving beauty leads to serving truth and justice (which might be inevitable).
   2. Define and apply the concepts of "megaphone propaganda" (explicitly argues a point, tells what to think) and "window propaganda" (shows reality without explicit argument, invites the viewer to see).
   3. Analyze Du Bois's position using these concepts: is he advocating for megaphone (prescriptive) or window (descriptive)? And how does the inevitability claim (that serving beauty leads to truth) fit?
   4. Address whether the distinction resolves the tension: 
      - For example, if Du Bois is seen as a window propagandist, then his claim that all art is propaganda becomes a statement about art's inevitable engagement with reality (thus descriptive). But then the user worries it becomes trivial. 
      - Or, if the distinction collapses (e.g., because even when showing, the artist is implicitly arguing), then the tension might remain.
   5. Present the student's own reasoned view on whether the megaphone/window distinction helps or not, with support.

   Model Answer (around 650 words):
   We'll write a model answer that:
     - Summarizes Du Bois's tension.
     - Explains the megaphone/window distinction.
     - Argues that Du Bois is primarily descriptive (inevitable) and that the window metaphor fits better, but the tension is not fully resolved because even window propaganda has an implicit argument.
     - Concludes that the distinction helps to clarify but doesn't entirely remove the tension.

   Marking Scheme (out of 20):
   We'll break it down into criteria. Total marks: 20.

   Biggest Trap:
   The biggest trap is to only summarize Du Bois's position without engaging with the tension or the megaphone/window distinction, or to ignore the second part of the question (whether the distinction helps).

   Plain English Glossary:
   We'll include terms that might be jargon: e.g., prescriptive, descriptive, propaganda, tension, etc.

   Let's create the JSON object accordingly.
