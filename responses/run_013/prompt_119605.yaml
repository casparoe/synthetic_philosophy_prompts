  2. **Repeated experiments**: Consider a series of identical, independent quantum experiments, each with a small probability of death (say, p) and survival (1-p). The experiment is performed at discrete time steps.
  3. **Subjective experience**: The observer's stream of consciousness is tied to the branches where they survive. In branches where they die, there is no continued experience. Therefore, from the first-person perspective, the observer only finds themselves in the surviving branches.
  4. **Infinite regress**: Even after many trials, there is always a branch in which the observer has survived every time. The probability of being in such a branch (from the perspective of the initial observer) decreases exponentially, but it never becomes zero. 
  5. **Conditionalization**: At any point in time, the observer conditions on the fact that they are still alive (i.e., they are in a branch that has survived so far). This conditioning updates the probability of survival in the next experiment to be higher than the unconditional probability (because the low-probability survival streak must have occurred to have the current experience).
  6. **Immortality claim**: Since the risk set (the set of branches in which the observer is still alive) never becomes empty, the observer should expect to always survive. This leads to the conclusion that one should expect to never experience death.

