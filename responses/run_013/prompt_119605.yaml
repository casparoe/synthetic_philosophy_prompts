  - **Martingale**: The survival process (indicator of being alive at time t) for a given branch is a martingale? Not exactly. The hazard is constant and independent, so the process of survival is a product of independent Bernoulli trials. However, note that the branching creates multiple paths. The observer's experience is confined to one path that survives. 
