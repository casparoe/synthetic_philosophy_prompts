    - This is a point of failure: the survival analysis framework does not allow an individual to have a positive probability of being alive at infinity when the survival probability to infinity is zero? But note: the observer is always alive at any finite time. They never experience death at a finite time? However, they must die at some finite time in almost all branches. The argument is that they don't experience death because when they die, their experience stops. So they only experience being alive at finite times? Then the argument is that they will always be alive at the current finite time? Yes, but that does not imply that they will be alive at the next time? It only says that conditional on being alive now, they might die at the next step with probability p. 

  **The critical step: from "the risk set is never empty" to "I should expect to survive"**:
  - The risk set being non-empty at time t (for any finite t) means that there are branches in which the observer is alive at time t. The observer, being alive at time t, conditions on that fact. Then the hazard for the next trial is p. So the observer should assign a probability p of dying in the next trial. They do not expect to survive with certainty. They only expect that they will survive the next trial with probability (1-p). 
  - The argument for immortality is not that the observer expects to survive the next trial with probability 1, but rather that they will always find themselves having survived so far. However, they still face the same hazard at every step. 
  - The issue: The argument sometimes is misstated as if the observer becomes immune because they are in a branch that has beaten the odds. But the hazard remains p at every step. 
  - Therefore, the step from "the risk set is never empty" to "I should expect to survive" is not licensed by the formalism. The formalism says that conditional on being alive now, the future hazard is still p. The observer should not expect to survive the next trial with certainty, but only with probability (1-p). 
  - The trouble lies in the treatment of the individual's credence: The observer is in a branch that has survived so far. But that branch has the same hazard as any other branch at the same time. There is no reason to think that the branch that has survived so far is special in terms of future hazard. 

  **Conclusion of the residue report**:
