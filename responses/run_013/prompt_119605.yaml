  We are going to break down the quantum-immortality argument and then translate it into the language of survival analysis. The core idea of quantum immortality in the Everettian (many-worlds) interpretation is that an observer who repeatedly subjects themselves to a life-threatening quantum experiment will, in some branches, survive. Since the observer only experiences the branches in which they are alive, they should expect to never experience death (from such an experiment). 

