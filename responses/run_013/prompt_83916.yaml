prompt: |-
  I'm a staff engineer at a mid-size SaaS company and I keep getting into the same argument at planning time. Somebody wants to ship a thing, somebody else says we should test it first, or do a spike, or shouldn't security take a look, and then we burn two or three weeks on it. Half the time we ship exactly what we were going to ship anyway. The other half the result comes back muddy and we ship it anyway with a caveat. I don't think we're being rigourous in either direction, I think we're pattern-matching on what feels responsible.

  A mate of mine who did a philosophy degree told me there's a theorem, I think the guy's name was Good, that says the expected value of getting information before you decide is never negative, because if it turns out useless you can just ignore it and act like you never looked. Which if you take it literally means we should never ship anything ever, we should just gather data until the sun burns out. He said there's conditions on it and I shouldn't take the pop version seriously, but then last orders got called.

  So what I want is a checklist I can actually run in a planning meeting in about ten minutes, for deciding whether to go get more information (run the A/B test, do the load test, do the user interviews, book the pen test) or to just decide now with what we've got. It has to be built on what the theorem actually says, not the pub version. I don't need a proof. I need to know which of its conditions have to be true for the guarantee to apply at all, which ones we quietly break all the time without noticing, and what to do when they're broken — if the guarantee is off, does that make the test pointless, or does it just mean the theorem has nothing to say and I'm back to judgement?

  Two things I specifically want it to catch, because I'm fairly sure we get these wrong:

  - we announce we're "running an experiment to decide", but by then we've effectively committed to shipping, so no result is going to change anything. I suspect that quietly kills the guarantee, because the whole reason the theorem works seems to be that you're allowed to ignore what you find out.
  - the thing we're going to learn isn't just going to shift the odds between options we already have on the table. It might reveal a whole category of option we didn't know we had, or tell us our model of the problem is wrong. I have a feeling that's a different kind of value and the theorem might not cover it, but I want to know if I'm right about that.

  Then run the checklist on three things actually in our backlog:

  1. A/B test on the checkout button copy. Two weeks, we can run it on half the traffic, and we'll ship whichever one wins.
  2. A penetration test before we launch a new API that touches customer data. Six weeks and expensive, and depending on what they find we might have to redesign the whole thing.
  3. A six-week benchmarking exercise to pick between two database vendors, when we've already got strong reasons to pick one and the migration deadline is in five weeks.

  I want the checklist in an order I can literally read out loud to the room, and I want it marked up so it's clear which steps are the theorem actually doing work and which are just judgement wearing a philosophical hat. Where the checklist genuinely can't settle something, flag it as such rather than inventing a rule to cover it. And if one of my three cases gets an answer I'm not going to like, say so and don't soften it.

  Keep the whole thing under 1000 words, I'm pasting it straight into our team wiki. No reading list, obviously — I'm not going to read any of it anyway.
reasoning: |-
  We are going to build a checklist based on Good's theorem (also known as the value of information theory). The theorem states that the expected value of information (EVI) is non-negative under certain conditions. However, these conditions are often not met in practice, which can lead to negative value of information (i.e., wasting time and resources).

  The key conditions are:
  1. **Free Disposal (Ignorability)**: You can freely ignore the information and act as if you never collected it.
  2. **Correct Model**: The information you collect must be about the state of the world that is relevant to your decision, and your model of how the information relates to the state must be correct.
  3. **No Direct Costs**: The theorem assumes that gathering information has no direct cost (time, money, etc.). In reality, there are costs, so we must account for them.
  4. **No Indirect Costs**: There are no opportunity costs (e.g., delays) or costs from changing the world (e.g., running an experiment might alert competitors).

  When these conditions are violated, the EVI might be negative, meaning gathering information could be worse than not gathering it.

  We also note two specific concerns from the user:
  - If by running an experiment you have already committed to shipping (so you ignore the results), then condition 1 (free disposal) is violated.
  - If the information might reveal entirely new options or invalidate your model, that is beyond the scope of the standard theorem (which assumes a fixed set of options and a known model). This is sometimes called "exploration" or "model-changing" information.

  Checklist for deciding whether to gather more information:

  **Step 1: Define the decision without information**
  - What are the available actions (without gathering information)?
  - What is the expected value of each action (using current knowledge)?
  - Without new information, which action would we take? (Call this the default action.)

  **Step 2: Check Free Disposal (Ignorability)**
  - If we gather the information, can we still choose the default action regardless of what we learn? 
    - If no, then the information might force our hand, and condition 1 is violated. This is a red flag.

  **Step 3: Check the Model**
  - Is the information we are gathering directly about the state of the world that affects the outcomes of our actions?
  - Do we have a reliable model (i.e., conditional probabilities) that tells us how the information relates to the state? 
    - If we don't have a reliable model (e.g., we are just guessing), then condition 2 is violated. This is a yellow flag.

  **Step 4: Consider Costs**
  - What are the direct costs of gathering the information (time, money, resources)? 
  - What are the opportunity costs (delays, lost revenue, etc.)?
  - Subtract these costs from the expected value of the information.

  **Step 5: Consider Indirect Costs**
  - Could gathering the information change the world in a way that affects the outcome? (e.g., tipping off competitors, annoying users, etc.)
  - Are there risks of the information itself being misleading? (e.g., if the test environment is not representative)

  **Step 6: Consider Exploration Value**
  - Is there a chance that the information could reveal a new course of action we haven't considered? Or invalidate our current model of the problem?
    - If yes, then the standard theorem doesn't capture this. We must subjectively assess the potential upside and downside of such a discovery.

  **Step 7: Calculate Expected Value of Information (EVI)**
  - Weigh the potential benefits of changing our decision against the costs. The formula is:
    EVI = [Expected value if we act optimally with the information] - [Expected value of the default action] - Costs (from Steps 4 and 5)
    - If EVI > 0, then gathering information is justified.
    - However, in practice, we often cannot compute this exactly. We can use:
      - If the costs are high and the chance of changing our decision is low, then EVI is likely negative.
      - If the costs are low and the potential upside of changing the decision is high, then EVI is likely positive.

  **Step 8: Make a Decision**
  - If EVI > 0 (or clearly positive by judgment) and conditions from Steps 2 and 3 are not severely violated, then gather the information.
  - Otherwise, decide now with what you have.

  Now, apply the checklist to the three examples:

  **1. A/B test on checkout button copy**
  - Step 1: Default action: pick one copy (say A) and ship it. Expected value: unknown but we have two options.
  - Step 2: Free disposal? Yes, we can ignore the test and ship A anyway. Condition holds.
  - Step 3: Model: We assume the test accurately predicts which copy leads to more conversions. We have a reliable model? Yes, if we run it correctly. Condition holds.
  - Step 4: Costs: Two weeks of half the traffic -> loss of potential conversions on half the users for two weeks. Also, engineering time. These might be low compared to the upside of picking the better copy.
  - Step 5: Indirect costs: Minimal (users might see a less optimal button for two weeks, but that's the same as shipping without testing).
  - Step 6: Exploration: Unlikely to reveal new options.
  - Step 7: EVI: If the difference in conversion rates is large, then EVI could be positive. But if the two copies are very similar, then the cost of running the test might exceed the benefit. However, we don't know the difference until we run. We might do a power analysis to see if the test is worth it. But in practice, for a two-week test with low cost, it's often positive.
  - Step 8: Probably run the test, unless the costs are too high.

  **2. Penetration test before launching a new API**
  - Step 1: Default action: launch without the test. Expected value: high if no security issues, catastrophic if there is a breach.
  - Step 2: Free disposal? No, because if the test finds a critical vulnerability, we cannot ignore it and launch anyway (due to ethical, legal, and reputational risks). Condition 1 violated.
  - Step 3: Model: The pen test will reveal security flaws. We have a reliable model? Yes, if the pen testers are good.
  - Step 4: Costs: Six weeks and expensive. Also, delay in launch (opportunity cost).
  - Step 5: Indirect costs: None obvious, but if the test finds nothing, we might have a false sense of security.
  - Step 6: Exploration: It might reveal a whole new category of redesign, which could be very valuable (preventing a breach) or very costly (redesign).
  - Step 7: EVI: The value of avoiding a breach is huge, but the cost is high. However, because we cannot ignore the results (violation of condition 1) and the test might force a redesign (high cost), we must weigh:
    - Probability of a breach without the test: if we think it's low, then EVI might be negative because the cost of the test is high and we might not change the decision (we launch anyway). But if the probability is non-negligible, then the test might be worth it.
    - Given the high stakes, and because we cannot ignore the results, we are effectively forced to fix any critical issue. So the test is only worth it if the expected cost of a breach (without the test) is greater than the cost of the test plus the expected cost of fixing. This is a judgment call.
  - Step 8: This is a tough one. In security, the precautionary principle often applies. Given the potential catastrophic risk, and that we are handling customer data, we should probably run the pen test. But note: the theorem's guarantee doesn't hold because of condition 1 violation, so we are in a risk management situation.

  **3. Benchmarking exercise to pick between two database vendors**
  - Step 1: Default action: pick the one we have strong reasons to prefer (say vendor A). Expected value: high, because we have strong reasons.
  - Step 2: Free disposal? Yes, we can ignore the benchmarks and pick A anyway. Condition holds.
  - Step 3: Model: The benchmarks will tell us which is faster. We have a reliable model? Yes, if the benchmark is representative.
  - Step 4: Costs: Six weeks of time, and the migration deadline is in five weeks. So we cannot meet the deadline if we run the test. Opportunity cost: missing the deadline might have serious consequences (e.g., contract penalties, lost business).
  - Step 5: Indirect costs: Delaying the migration might cause other problems.
  - Step 6: Exploration: Unlikely to reveal a new vendor, but might reveal that both are inadequate? Then we might have to reconsider the migration.
  - Step 7: EVI: 
    - The cost of the test is very high because we will miss the deadline. 
    - The benefit: we might avoid a bad choice. But we already have strong reasons to pick A. 
    - The chance that the benchmarks will change our decision is low (because we are already leaning heavily on A). 
    - Therefore, EVI is likely negative because the cost (missing deadline) is high and the benefit is low.
  - Step 8: Do not run the benchmark. Decide now with what we have.

  Final Checklist (to read in the meeting):

  1. **Define the default decision**: Without extra information, what would we do? What's its expected value?
  2. **Check ignorability**: Can we ignore the information and stick with the default? If no, we lose the theorem's guarantee. Proceed with caution.
  3. **Check model reliability**: Is the information we're gathering a reliable indicator of the state? If not, we lose the theorem's guarantee.
  4. **Account for costs**: What are the direct and opportunity costs of gathering the information?
  5. **Consider indirect costs**: Could gathering the information cause unintended harm?
  6. **Consider exploration value**: Might this reveal new options or invalidate our model? If so, the theorem doesn't cover it. Weigh subjectively.
  7. **Estimate EVI**: Subtract costs from the expected benefit of changing the decision. If the numbers are fuzzy, use judgment: 
     - High chance of changing the decision? High potential improvement? Low costs? -> Then gather information.
     - Low chance of changing the decision? High costs? -> Then skip.
  8. **Decide**: If EVI is positive and conditions (ignorability and model) are not severely broken, gather the information. Otherwise, decide now.

  Note: The theorem (with conditions) guarantees that the EVI without costs is non-negative. But in reality, costs are always present, and conditions are often broken. Therefore, the checklist must account for these.
answer: |-
  ### Information Gathering Decision Checklist  
  Based on Good's Theorem (Value of Information) — *Conditions marked with ⚖️ are critical to the theorem's guarantee. If broken, the theorem's "never negative" promise fails.*  

  #### Checklist Steps (Run in Order):  
  1. **⚖️ Define the Default Action:**  
     - Without new information, what would we do *right now*?  
     - *Why: The theorem assumes you have a fallback action. If you don’t, stop — the theorem doesn’t apply.*  

  2. **⚖️ Verify Free Disposal (Ignorability):**  
     - If we get new information, can we *still choose the default action* without penalty?  
     - *Red flag if no: You’re not really free to ignore the info (e.g., you’ve committed to acting on results).*  

  3. **⚖️ Verify Model Correctness:**  
     - Is the information *only* about known risks/outcomes (e.g., "Does A convert better than B?"), *not* revealing new options or invalidating our assumptions?  
     - *Red flag if no: The theorem only covers shifting odds between existing choices. "Unknown unknowns" require judgment.*  

  4. **Assess Costs (Direct & Opportunity):**  
     - What’s the cost of gathering info (time, money, delay)?  
     - What’s the cost of *delaying the default action* (e.g., lost revenue, missed deadlines)?  

  5. **Assess Decision-Change Potential:**  
     - How likely is the info to *change our action* from the default?  
     - What’s the *maximum upside* if it does (e.g., 10% more revenue vs. preventing a $1M breach)?  

  6. **Calculate Threshold:**  
     - *(Expected value of changing the decision × Likelihood of change) > Total costs*?  
     - If unclear, default to *not gathering info* (costs are certain; benefits are not).  

  7. **⚖️ Make the Call:**  
     - If all ⚖️ conditions hold AND benefits > costs: **Gather info**.  
     - If ⚖️ conditions broken OR costs > benefits: **Stick with default action**.  
     - If exploration value (step 3) dominates: **Treat as a separate discovery project** (not covered by theorem).  

  ---

  ### Application to Your Cases  
  **1. A/B Test on Checkout Button Copy**  
  - Default action: Ship copy A (arbitrary choice).  
  - Free disposal: **Yes** — you can ignore results and ship A.  
  - Model correctness: **Yes** — only tests known options (A vs. B).  
  - Costs: 2 weeks of half-traffic revenue loss + engineering time.  
  - Decision-change potential: High (winner likely better), but upside small (button copy ≈ minor conversion bump).  
  - Threshold: Likely *not worth it* unless upside > $50K.  
  - **The Verdict:** Skip the test. Ship now and monitor. *Theorem applies but costs dominate.*  

  **2. Pen Test Before New API Launch**  
  - Default action: Launch without pen test.  
  - Free disposal: **No** — if critical flaws are found, you can’t ethically/legally launch.  
  - Model correctness: **No** — may reveal unknown flaws requiring redesign (new options).  
  - Costs: 6 weeks delay + test cost. Opportunity cost: Delayed launch.  
  - Decision-change potential: Low chance of change (you’ll likely ship anyway with caveats?), but catastrophic upside if breach prevented.  
  - Threshold: Theorem **does not apply** (free disposal broken). Use risk judgment: If breach cost > $500K and likelihood > 10%, test. Else, skip.  
  - **The Verdict:** Probably skip — unless handling PII or in a regulated industry. *Theorem guarantee broken.*  

  **3. Database Benchmarking (Deadline in 5 Weeks)**  
  - Default action: Pick vendor A (strong reasons).  
  - Free disposal: **Yes** — you can ignore benchmarks and pick A.  
  - Model correctness: **Yes** — only compares known vendors.  
  - Costs: 6-week test misses deadline → contract penalties/reputational harm.  
  - Decision-change potential: Low — you already prefer A. Upside marginal (e.g., 5% performance gain).  
  - Threshold: Costs (deadline miss) >> benefits.  
  - **The Verdict:** Do not benchmark. Pick A now. *Theorem applies, but costs are fatal.*  

  ---

  ### Key Takeaways  
  - **When the theorem works:** Only if you can *ignore the info* (step 2) and *only face known risks* (step 3).  
  - **When it fails:** You’re forcing action from tests (step 2) or exploring unknowns (step 3) — then judgment rules.  
  - **Real-world hack:** Default to *not gathering info* unless costs are trivial or downside is existential. Most "tests" are theater.  

  > **Final Warning:** If your team says "We’ll run the test to decide" but has already committed to shipping, you’ve failed step 2. Kill the test.
