prompt: |-
  I run a small "civic experiments" unit inside the planning department of a mid-sized city — basically we're the people who get handed the proposals nobody else wants to touch: a supervised consumption site, a guaranteed-income pilot, closing a downtown street to cars, renaming a street, letting sixteen-year-olds vote in school-board elections. Right now the process is a mess. We either talk for eight months and produce a report nobody acts on, or we get pressured into a straight up-or-down vote that just ratifies whatever the loudest side wanted, and then everyone calls it 'democracy.' A collegue keeps telling me I should read Dewey — that for him democracy isn't mainly a matter of voting but a way of living together in which people jointly inquire into their shared problems, and that inquiry is itself experimental: you don't start from a settled question and pick the answer, you start from a situation that has gone indeterminate and you work to make it determinate again, treating your ideas as plans of action you then test against how the world pushes back, and treating what you end up 'knowing' as a claim you're warranted in asserting only for as long as it survives that testing. That sounds right to me but I cant hand my staff a book.

  So: you're a philosopher of social inquiry who has also had to make this stuff work inside a bureaucracy, and I want you to write me a decision procedure my team can actually run on a proposal — a checklist, in maybe ten steps. Think it through carefully before you commit to the order of the questions, because the order is the whole game: a step that comes too early turns everything after it into a formality. For each step, say what a sufficient answer looks like, and say which steps are genuinely factual and which are value questions dressed up as procedure — so we know when to stop and hand it to a person with the authority to decide, and who that person should be. Where does the procedure say no, and where does it say not yet, and here's the experiment to run first? I also want it to do something our current process can't: whenever we decide to run a pilot, it should force us to write down, before we start, the conditions under which we'd call the pilot finished or abandoned, and who is carrying the risk if it goes wrong — because with social experiments the people who bear the cost are rarely the people who asked for the experiment.

  Then actually run the procedure, in full, on two of those proposals, and make one of them the hard one — the renaming, or something like it, where there's no experiment to run and the whole thing is about who we are together rather than about what works. If the procedure tells me that case has to be handled differently from the street-closure case, say so plainly, even if it means my nice uniform flowchart falls apart, and tell me what the procedure still can't do at all. Don't give me a survey of what Dewey said with a procedure bolted on the end; I need the procedure first, and the theory only where it's actually load-bearing. And please take a definite position — tell me where you think the line really falls between "we need more inquiry" and "this is a matter of conviction that inquiry won't settle" — rather than telling me it depends.
reasoning: |-
  Okay, the user runs a civic experiments unit dealing with complex proposals. They need a practical decision procedure rooted in Dewey's philosophy. Let me unpack their request.

  First, they want a step-by-step checklist that transforms vague discussions into actionable inquiry. The key is the order of steps—placing value questions too early could bias the whole process. They also need clear criteria for when to run pilots, including risk allocation and exit conditions. 

  The user's frustrated with current outcomes: endless reports or polarized votes. Dewey's idea of democracy as collaborative inquiry resonates, but they need operational tools. Their hidden need might be legitimacy—showing citizens their input genuinely shapes outcomes, not just rubber-stamps decisions.

  For the procedure, I'll start by forcing problem articulation before solutions (Step 1). This prevents jumping to conclusions. Then separate value conflicts from factual questions—if values clash early (Step 2), it's a "not yet" requiring deliberation, not analysis. 

  Pilot design (Step 7) must include explicit failure conditions and risk bearers. This addresses their concern about marginalized groups bearing costs. For non-experimental cases like renaming, the procedure should flag when inquiry can't resolve identity conflicts—requiring transparent choice by accountable leaders.

  Testing on street closure vs. renaming will show flexibility. Street closure can be iterative; renaming hits Step 2's "core identity conflict" dead end. The flowchart breaks, but that's honest—some issues need politics, not experimentation. 

  Finally, I'll take a stand: if evidence can't resolve conflicting non-negotiable values (e.g., historical preservation vs. harm reduction), it's conviction territory. The procedure forces naming that impasse early.
answer: |-
  Here’s a 10-step decision procedure grounded in Deweyan inquiry, designed for messy civic experiments. It forces clarity on **values vs. facts**, **risk allocation**, and **exit conditions**, while reserving space for irreconcilable value conflicts. The order is critical: it prevents premature voting and ensures experiments are probes, not commitments.

  ---

  ### **The Civic Experiment Decision Procedure**  
  *(Run sequentially; stop and resolve if any step fails)*

  1. **ARTICULATE THE INDETERMINATE SITUATION**  
     *"What shared problem are we reacting to, and why is it unresolved?"*  
     **Sufficient answer:** A concrete description of conflicting experiences (e.g., "Merchants report traffic loss if street closes; residents report unsafe streets"). Not a solution.  
     **Nature:** Factual (evidence-based) + value-laden (whose experience counts?).  
     **Stop if:** No shared problem exists (e.g., pure symbolic gesture). → *Hand to elected officials.*

  2. **MAP STAKEHOLDER CONFLICTS**  
     *"Whose interests/worldviews clash, and on what axes?"*  
     **Sufficient answer:** A table of groups, their core concerns, and whether conflicts are about **means** (fixable with data) or **ends** (irreconcilable values).  
     **Nature:** Analytical (identifies fault lines).  
     **"Not yet" if:** Core value conflict detected (e.g., "honor history" vs. "repudiate harm" in renaming). → *Hand to deliberative forum (e.g., citizen jury).*

  3. **DEFINE SUCCESS CRITERIA**  
     *"What would 'resolving' this look like for each stakeholder?"*  
     **Sufficient answer:** Specific, measurable outcomes valued by conflicting parties (e.g., "90% resident satisfaction + >85% merchant revenue retention").  
     **Nature:** Values made testable.  
     **"No" if:** Success criteria are mutually exclusive → *Return to Step 2.*

  4. **IDENTIFY KNOWN FACTS & GAPS**  
     *"What do we know, what do we assume, and what’s dangerously uncertain?"*  
     **Sufficient answer:** A "certainty matrix" rating evidence quality for key claims (e.g., "High certainty: closing streets reduces pedestrian deaths; Low certainty: impact on local business").  
     **Nature:** Factual.  
     **"Not yet" if:** Critical gaps exist → *Proceed to Step 5.*

  5. **GENERATE INQUIRY OPTIONS**  
     *"What actions could reduce uncertainty or test assumptions?"*  
     **Sufficient answer:** Options ranging from **research** (e.g., survey) to **pilot** (e.g., 3-month closure) to **deliberation** (e.g., consensus conference).  
     **Nature:** Creative/strategic.  
     **"No" if:** No feasible inquiry path → *Terminate or escalate.*

  6. **ASSESS RISK BEARERS**  
     *"Who pays the price if this fails? Who is excluded?"*  
     **Sufficient answer:** Explicit list of risks (financial, reputational, psychological) and the groups/individuals bearing them.  
     **Nature:** Ethical/political.  
     **Stop if:** Risk falls disproportionately on marginalized groups → *Redesign or abandon.*

  7. **DESIGN EXPERIMENT (if applicable)**  
     *"How will we test, learn, and exit?"*  
     **Sufficient answer:** A signed charter with:  
     - **Duration** (e.g., 6 months)  
     - **Metrics** (from Step 3)  
     - **Failure triggers** (e.g., "Abandon if >25% revenue drop")  
     - **Exit authority** (who pulls the plug?)  
     **Nature:** Procedural/contractual.  
     **"No" if:** No agreement on metrics/triggers → *Return to Step 3.*

  8. **APPROVE INQUIRY PATH**  
     *"Do we commit resources to learn?"*  
     **Nature:** Decision gate (requires formal sign-off by unit lead + 1 stakeholder rep).  
     **Outcome:** Proceed, redesign, or terminate.

  9. **EXECUTE & DOCUMENT PUSH-BACK**  
     *"Run the probe; record how reality resists."*  
     **Sufficient answer:** Log of deviations from plan (e.g., "Unexpected delivery access complaints") + adaptive responses.  
     **Nature:** Empirical/adaptive.

  10. **ASSERT WARRANTED CLAIMS**  
      *"What can we now assert as 'known'? What remains unresolved?"*  
      **Sufficient answer:** Public report stating: "Based on [evidence], we warrant [claim] until [expiration condition]." Distinguishes facts ("traffic decreased 20%") from values ("safety improved enough").  
      **Nature:** Synthesis.  
      **"Not yet" if:** Value conflict re-emerges → *Hand to democratic body for decision.*

  ---

  ### **Applied to Two Proposals**

  **I. Downtown Street Closure to Cars (Testable Case)**  
  1. **Situation:** "Pedestrian injuries rising; merchants fear revenue loss; residents want public space."  
  2. **Stakeholders:** Residents (safety), shops (revenue), delivery drivers (access). Conflicts = **means** (can safety/revenue coexist?).  
  3. **Success:** "No pedestrian injuries; merchant revenue ±5%; delivery access maintained."  
  4. **Gaps:** Low certainty on revenue impact.  
  5. **Inquiry:** 3-month pilot closure with delivery corridors.  
  6. **Risk bearers:** Merchants (revenue risk); city (liability). Mitigation: Business loss fund.  
  7. **Experiment:** Charter: 3 months; fail if >10% revenue drop OR any injury; PD Commissioner can abort.  
  8. **Approved** → Run pilot.  
  9. **Push-back:** Delivery delays observed → Added loading zones.  
  10. **Claim:** "Warrant closure for 1 year; revisit if revenue drops >7%."

  **II. Renaming Confederate Avenue (Non-Testable Case)**  
  1. **Situation:** "Street name causes daily harm to Black residents; some see erasure of heritage."  
  2. **Stakeholders:** Descendants of enslaved (dignity), heritage groups (history). Conflict = **ends** (competing truths about identity).  
  3. **Success:** Impossible consensus. → **STOP at Step 2.**  
     → *Hand to deliberative process: Facilitated dialogues with historians/residents → Council vote.*  
     **What the procedure can't do:** Resolve core value conflicts. It forces you to name them early and shift to politics.

  ---

  ### **Where Theory is Load-Bearing**
  - **Step 1-2:** Dewey’s "indeterminate situation" – you start with lived conflict, not solutions.  
  - **Step 4-7:** Experimentalism – ideas become hypotheses tested by reality’s "push-back."  
  - **Step 10:** "Warranted assertibility" – claims are temporal, not absolute truths.  

  **Your Line: "Inquiry won’t settle" when:**  
  - Conflicts are about **non-negotiable values** (e.g., dignity vs. tradition).  
  - **No observable evidence** could alter positions (e.g., renaming’s symbolic meaning).  
  - **Risk allocation** is inherently unjust (e.g., testing drug policies on unhoused people).  

  **What it can’t do:**  
  - Replace legitimate authority on value judgments.  
  - Force compromise when worldviews are mutually exclusive.  
  - Guarantee political courage to act on findings.  

  **Output:** Either a **probe** (with teeth: exit triggers, risk bearers named) or a **clear handoff** to politics when values clash. No more reports no one reads; no more votes without inquiry. You’re not deciding outcomes – you’re structuring how the city learns.
