prompt: |-
  I'm giving a talk at a workshop next month and I need you to help me prep for the Q&A. Act like a historian of economic thought who also actually knows modern monetary macro and has sat through a hundred of these sessions — someone who can tell me which objection is fatal and which is just throat-clearing. Think it through properly before you write: brainstorm the objections first, then rank them.

  The talk's thesis, roughly: everyone reads Hume's essay Of the Balance of Trade as the origin of the price-specie-flow mechanism and then treats that mechanism as his proof that trade imbalances self-correct and so we don't need to manage trade. I want to argue thats a presentist reading in two directions. First, the mechanism only does the work the free-trade conclusion needs if the transition is basically costless, but Hume himself is adamant in Of Money that money is never neutral — an inflow raises prices unevenly, stimulates some sectors and not others, and it's exactly that lumpy, unequal transition that makes the mechanism move at all. So the automatic adjustment Hume describes runs on the very non-neutrality the modern reading assumes away. Second, once you see that, Hume's case for free trade starts to look much more like a case against treating commerce as a zero-sum contest driven by national jealousy — he's doing rhetoric and moral psychology, not welfare economics.

  The audience: it's a history-of-economic-thought workshop, so mostly 18th-century historians who know the essays cold and are allergic to presentism — they'll pounce the moment they think I'm back-projecting modern models — plus two monetary economists, one fairly New Keynesian and one Austrian-leaning, who'll want to know what the modern payoff is and will be suspicious of both.

  Give me the Q&A prep sheet: the eight or so objections I'll actually get, in their vocabularies, ordered by how much damage they do, each phrased the way that person would put it, with a two-minute reply and a note on where my reply is soft. Flag anything I should just concede up front. And finish with the one question I'm hoping nobody asks.

  Keep the whole thing under 850 words, and lead each objection with a one-line version of it so I can scan the sheet in the ten minutes before I go on.
