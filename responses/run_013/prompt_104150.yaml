  ### Diagnostic Instrument: Animal Consciousness Decision Tree

  **Tree Structure**  
  The following decision tree progresses through six critical forks. Each branch is determined by fundamental commitments, not presupposed conclusions. Terminal leaves represent named positions with their most awkward empirical commitments.

  ```
  START
  │
  └─1. What makes a system a candidate for consciousness?
     ├─ A. Specific neural substrate → 2
     ├─ B. Specific information-processing function → 3
     └─ C. Functional/behavioral role (e.g., flexible learning) → 4
        │
        2. Which substrate?  
        ├─ A1. Thalamocortical architecture → 4
        ├─ A2. Midbrain/affective system → 4
        └─ A3. Any centralized nervous system → 4
        │
        3. Which function?  
        ├─ B1. Recurrent processing → 4
        ├─ B2. Global broadcast → 4
        ├─ B3. Higher-order representation → 4
        └─ B4. Integrated information (Φ) → 4
        │
        4. Is consciousness binary or graded?  
        ├─ D1. Binary → 5
        └─ D2. Graded (continuous/coarse) → 5
        │
        5. How handle uncertainty?  
        ├─ U1. Precautionary default (conscious unless disproven) → 6
        └─ U2. Demand positive evidence → 6
        │
        6. Verdict type:  
        ├─ F1. Fact of the matter → LEAF
        └─ F2. Practical ethical stance → LEAF
  ```

  **Terminal Leaves (Positions)**  
  *Each position includes its scope and most awkward commitment.*  

  1. **Avian-Mammalian Exceptionalism**  
     Path: A → A1 → D1 → U2 → F1/F2  
     Scope: Only mammals and birds.  
     Awkward: Excludes decorticate mammals (e.g., humans without cortex) despite retained pain reflexes.  

  2. **Vertebrate Sentience**  
     Path: A → A2 → D1 → U1 → F1/F2  
     Scope: All vertebrates.  
     Awkward: Attributes consciousness to lampreys but excludes octopuses, despite comparable behavioral complexity.  

  3. **Cephalopod-Inclusive Evidence**  
     Path: B → B2 → D1 → U2 → F1/F2  
     Scope: Vertebrates + cephalopods (due to current evidence).  
     Awkward: Excludes honeybees despite evidence of global broadcast in insects.  

  4. **Nervous System Ubiquity**  
     Path: A → A3 → D1 → U1 → F1/F2  
     Scope: Any animal with a centralized nervous system.  
     Awkward: Attributes consciousness to insect larvae with minimal behavioral complexity.  

  5. **Scaled Integrated Information**  
     Path: B → B4 → D2 → U1 → F1/F2  
     Scope: Graded consciousness across animals with measurable Φ.  
     Awkward: Quantification challenges (e.g., fish may score higher than amphibians arbitrarily).  

  6. **Affective Role Pragmatism**  
     Path: C → D1 → U1 → F1/F2  
     Scope: Animals exhibiting pain/pleasure behaviors (e.g., vertebrates, cephalopods, crustaceans).  
     Awkward: May misattribute consciousness to nociceptive robots mimicking pain responses.  

  ---

  **Test Cases**  
  *Apply the tree to concrete examples:*  

  - **Honeybee**:  
    - *Cephalopod-Inclusive Evidence*: Excluded (U2 requires cephalopod-grade evidence).  
    - *Affective Role Pragmatism*: Included (flexible learning).  
    - *Nervous System Ubiquity*: Included.  

  - **Octopus**:  
    - *Cephalopod-Inclusive Evidence*: Included (global broadcast evidence).  
    - *Avian-Mammalian Exceptionalism*: Excluded (no thalamocortical substrate).  

  - **Teleost Fish**:  
    - *Vertebrate Sentience*: Included (midbrain substrate).  
    - *Scaled Integrated Information*: Included (moderate Φ).  

  - **Decorticate Mammal**:  
    - *Avian-Mammalian Exceptionalism*: Excluded (lacks cortex).  
    - *Vertebrate Sentience*: Included (midbrain intact).  

  - **Sleeping (Dreaming) Mammal**:  
    - All positions include it (substrate/function persists; behavioral role latent).  

  - **Insect Larva**:  
    - *Nervous System Ubiquity*: Included.  
    - *Scaled Integrated Information*: Low-grade inclusion.  
    - Others exclude (insufficient evidence/complexity).  

  ---

  **Limitations and Unoccupied Territories**  

  (a) **Conflated Positions**  
  - *Affective Role Pragmatism* and *Vertebrate Sentience* are indistinguishable for vertebrates. The tree cannot separate them because both rely on U1 (precaution) and D1 (binary), differing only in their starting criterion (role vs. substrate).  
  - *Scaled Integrated Information* and *Nervous System Ubiquity* both include insect larvae but for orthogonal reasons (Φ vs. substrate). The instrument cannot resolve this divergence.  

  (b) **Unoccupied Combinations**  
  - **Higher-order representation (B3) + Graded (D2)**: No one occupies this, as higher-order theories are inherently binary (unattractive for graded phenomena).  
  - **Thalamocortical (A1) + Precautionary (U1)**: Unoccupied; U1 would force overextension beyond A1’s scope (incoherent with strict substrate requirements).  
  - **Behavioral role (C) + Demand evidence (U2)**: Unattractive; U2 undermines C’s focus on observable behaviors by requiring extra evidence.
