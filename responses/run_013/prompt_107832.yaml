answer: |-
  ### Disambiguation of "You Break It, You Own It" in Humanitarian Intervention Ethics

  | Reading          | The precise claim                                                                                                                                                                        | Kind of claim      | What would have to be true for it to hold                                                                                                   | Verdict                                | Supports Iraq conclusion? | Supports Syria conclusion? |
  | :--------------- | :--------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- | :----------------- | :------------------------------------------------------------------------------------------------------------------------------------------ | :------------------------------------- | :------------------------ | :------------------------- |
  | **Prudential Caution** | An intervening state ('you') should avoid actions likely to cause systemic collapse ('break it'), because bearing the full costs of repair ('own it') would be excessively burdensome.     | Prudential         | Intervention carries high risk of catastrophic state failure; repair costs reliably exceed benefits; alternatives exist.                    | Defensible                             | No                         | **Yes** (as deterrent)     |
  | **Causal Responsibility** | The primary causal agent ('you', e.g., the coalition) that materially contributes to a state's collapse ('break it') acquires an obligation to bear the primary costs of repair ('own it'). | Moral (outcome)    | The intervention was a *necessary and sufficient proximate cause* of collapse; no overriding intervening causes; agent foresaw/could foresee risk. | **True only with extra premises**: Proximate causation; foreseeability. | **Only with extra premise**: Invasion was proximate cause, not latent dysfunction/insurgency. | No                         |
  | **Remedial Obligation** | An intervening actor ('you', e.g., NATO) that causes harm via intervention ('break it') owes reparative justice to the affected population ('own it'), requiring rebuilding to rectify harm. | Moral (remedial)   | Intervention caused unjust harm; the intervener is culpable or materially responsible; repair is feasible/just.                            | Defensible                             | **Yes**                    | No                         |
  | **Authority Transfer** | An intervening force ('you') that destroys a sovereign government ('break it') assumes *de facto* or *de jure* authority ('own it') over the territory, akin to a belligerent occupier’s duties. | Legal/Moral        | Collapse voids prior sovereignty; occupation law (Hague/Geneva) applies; no legitimate successor authority exists.                          | **True only with extra premises**: Occupation law triggers; *debellatio*. | **Only with extra premise**: Invasion created a legal vacuum requiring occupation duties. | No                         |
  | **Title Transfer (Radical)** | The intervening state/coalition ('you') that destroys a state ('break it') acquires sovereign authority or trusteeship ('own it') over that territory and population.                     | Conceptual/Legal   | Sovereignty can be extinguished by external action; victors acquire title over defeated entities; no inherent right to self-determination. | **False** (violates *jus cogens* norms) | No                         | No                         |

  ### Analysis of Seminar Applications
  In the **Iraq case**, the "Remedial Obligation" reading was likely primary, importing moral responsibility for harm caused. The "Authority Transfer" reading (via occupation law) was implicitly invoked but requires legal premises. For **Syria non-intervention**, the "Prudential Caution" reading dominated, using the slogan as a risk-aversion heuristic. In **Libya**, advocates combined "Causal Responsibility" (NATO’s air campaign as proximate cause of collapse) and "Remedial Obligation", though significant extra premises about causation are needed. The slogan is **not empty**: it usefully links causation and obligation in remedial justice contexts ("Remedial Obligation") and highlights intervention’s moral hazard ("Prudential Caution"). However, it **should be retired** as a standalone argument due to its conflation of causation types, legal/moral duties, and its vulnerability to the "many causes" objection (which fatally undermines "Causal Responsibility" without rigorous proof of proximate cause). The distinctions above—particularly outcome vs. remedial responsibility, occupation law, and prudential risk—do the essential work the slogan obscures.
