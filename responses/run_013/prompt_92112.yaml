prompt: |-
  I recently accepted a seat on the scientific advisory committee of a national environmental regulator, and I have been asked to draft the committee's position on how the precautionary principle should be written into the agency's decision rules. Before I circulate the draft below, I would like your comments on it.

  Draft. The precautionary principle is usually stated as the claim that a lack of full scientific certainty should not be used as a reason for postponing measures to prevent serious or irreversible harm. The familiar objections — that the principle is too vague to guide anything, that it licenses regulating any activity for which someone can imagine a bad outcome, that it silently shifts the burden of proof onto the innovator, and that it is self-undermining because acting can itself cause harm — all have force against that formulation. I think they have force because the formulation fuses two ideas that should be kept apart.

  The first I call epistemic precaution: the instruction that when our evidence is thin, we should treat the worst case as more probable than our best estimate makes it. This is indefensible. It is just a thumb on the scale, and it cannot be applied symmetrically — if thin evidence about a new technology justifies assuming the worst, then thin evidence about the status quo justifies assuming the worst about the status quo too, and the principle collapses into paralysis or into an arbitrary preference for whatever already exists.

  The second I call axiological precaution: the claim that even when we are confident about the probabilities, it can be wrong to impose a small chance of catastrophic, irreversible loss on people who never consented to bearing it. This does not dispute anyone's probability estimates; it says that some risks are not the kind of thing a favourable expected value can license. This is the defensible core, and it explains why the principle feels urgent in some cases (nuclear power, gene drives, ocean iron fertilisation) and absurd in others (a new flavour of crisps).

  If that is right, the principle should be narrowed. It applies only where the harm is irreversible, and it should be paired with what I would call a reversal test, which asks not whether the expected value is positive but whether, if we are wrong, we can undo what we have done. A decision that is cheap to reverse needs no precaution. A decision that is not reversible is where the principle bites, and there the burden should sit on whoever proposes to make the change.

  Please give me exactly five numbered comments, each one or two sentences, with no introduction or conclusion. I want them to address, in this order: whether I have represented the standard objections accurately; whether the distinction between epistemic and axiological precaution is sound or merely relabels a familiar point; the weakest step in my argument; a concrete case that strains my reversal test; and whether the whole proposal is genuinely interesting or only tidy.
reasoning: |-
  Okay, the user is on a scientific advisory committee for an environmental regulator and needs feedback on their draft about incorporating the precautionary principle into agency rules. They asked for exactly five numbered comments addressing specific points. Let me break down each requirement.

  First, they want to know if the standard objections to the precautionary principle are accurately represented. The draft lists four common criticisms: vagueness, overregulation, burden of proof shift, and self-undermining due to action risks. These are indeed the typical arguments against the principle, so that's covered accurately.

  Next is the distinction between epistemic and axiological precaution. The user separates them as treating worst cases as more probable (epistemic) versus rejecting favorable expected values for catastrophic risks (axiological). While the concepts themselves aren't entirely new—risk aversion vs. uncertainty management—framing them this way clarifies an important nuance. The distinction holds water.

  The weakest part of the argument seems to be the epistemic precaution section. Dismissing it entirely might oversimplify. In cases like early climate models or toxicology, erring cautiously with thin evidence can be reasonable. The draft doesn't address this gray area, leaving a gap.

  For the reversal test, geoengineering is a good stress test. Techniques like solar radiation management might be reversible physically but politically locked-in once deployed. The test might not capture such complexities, showing a limitation.

  Finally, the proposal is genuinely interesting because it refines the principle into actionable criteria—irreversible harm plus reversibility assessment. It moves beyond theory to practical decision-making, which is valuable for regulators. The structure provides clear guidance, making it more than just tidy.
answer: |-
  Here are five numbered comments as requested:

  1.  You accurately represent the four most common and substantive standard objections to the classic formulation of the precautionary principle.
  2.  The distinction between epistemic and axiological precaution is sound and clarifying; it does more than just relabel familiar points by separating flawed probability-weighting from a defensible ethical stance on catastrophic risk imposition.
  3.  The weakest step is dismissing epistemic precaution entirely; while problematic if absolute, calibrated caution under deep uncertainty (not just assuming the *absolute* worst) can be a rational response to non-quantifiable threats, which your framework doesn't explicitly address.
  4.  Large-scale atmospheric geoengineering (e.g., stratospheric aerosol injection) strains your reversal test: physically it *might* be reversible by stopping injections, but stopping could cause rapid, catastrophic "termination shock" climate change, making reversal practically or politically impossible once started.
  5.  The proposal is genuinely interesting: it transforms an often-vague principle into a concrete, risk-specific decision rule (irreversible harm) paired with a practical procedural test (reversibility), offering clearer guidance for regulators.
