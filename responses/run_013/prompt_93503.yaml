answer: |-
  Here’s a rigorous set of desiderata for an account of letter identity, structured around your cases and constraints. Each criterion is marked as **non-negotiable** (core to the concept) or **camp-preference** (varies by discipline), with justification and "kill cases" where theories fail.

  ---

  ### **Core Desiderata: Non-Negotiable**
  1. **Allograph Tolerance**  
     *Must explain how structurally distinct shapes (e.g., single-storey "𝖺", double-storey "a", blackletter "𝖆") are all recognized as "a".*  
     **Why**: Fundamental to orthography. Failure means the account cannot handle real typographic diversity.  
     **Kill Case**: Rejecting geometric sans "𝖺" as a valid "a" while accepting serif "a".

  2. **Orientation Sensitivity**  
     *Must explain why rotation *changes* identity (b→q, d→p) but doesn’t for objects (e.g., a cup).*  
     **Why**: Reading is orientation-bound; writing systems are 2D symbolic conventions.  
     **Kill Case**: Claiming a rotated "b" is still "b" (contra universal literacy data).

  3. **Cross-Alphabet Homoglyph Resolution**  
     *Must distinguish identical shapes in different systems (e.g., Latin "a" vs. Cyrillic "а").*  
     **Why**: Shape alone is insufficient; context/system matters.  
     **Kill Case**: Calling Cyrillic "а" a Latin "a" (violates orthographic identity).  
     **Hardest Case**: Reading a novel alphabet—must resolve without prior exposure (suggests *system-level* cues).

  4. **Novelty Generalization**  
     *Must recognize letters in never-before-seen typefaces.*  
     **Why**: Humans do this robustly.  
     **Kill Case**: Requiring prior exposure to a specific font (contra human cognition).

  5. **Category-Style Separation**  
     *Must distinguish "this is an a" from "this is an a *in style X*".*  
     **Why**: Style can distort category boundaries (e.g., extreme stylistic "a" vs. "o").  
     **Kill Case**: Collapsing style and category (e.g., "this isn’t an 'a' because it breaks style rules").

  ---

  ### **Contextual & Graded Requirements**  
  6. **Contextual Dependence**  
     *Must explain how identity relies on positional/sequential context (e.g., "l" vs. "I" vs. "1").*  
     **Camp-Preference**: Stronger in perceptual psychology; weaker in formal typography.  
     **Kill Case**: Failing to distinguish "r n" from "m" in cursive without context.

  7. **Gradedness Acceptance**  
     *Must accommodate ambiguity (e.g., a smudged "a") without requiring binary thresholds.*  
     **Camp-Preference**: Essential for cognitive models; type designers may prefer sharp boundaries.  
     **Test Case**: A shape 51% "a"/49% "d" — the account should allow probabilistic or indeterminate judgments.

  ---

  ### **Boundary Cases & System-Level Constraints**  
  8. **System-Relative Identity**  
     *Must embed letters within a writing system (e.g., Latin, Cyrillic).*  
     **Why**: Resolves homoglyphs and novel alphabets.  
     **Kill Case**: Treating "a" as a culture-invariant shape.

  9. **Boundary Case Handling**  
     *Must clarify status of æ, &, ſ (long s), þ (thorn) — are they letters?*  
     **Camp-Preference**: Linguists/semioticians view these as system-dependent; type designers as stylistic.  
     **Requirement**: The answer must derive from the theory’s core principles, not ad hoc rules.

  ---

  ### **The Most Excluding Requirement**  
  **Cross-alphabet homoglyphs** does the heaviest exclusion work:  
  - Eliminates **pure shape similarity** (Cyrillic/Latin "a" have identical shapes).  
  - Eliminates **historical descent** (same Phoenician origin, but distinct modern identities).  
  - Challenges **designer intention** (a Cyrillic designer didn’t intend to create Latin "a").  
  - Undermines **reader convention** alone (readers distinguish them *despite* identical forms).  

  **Winner**: Forces adoption of a **system-relative abstract schema** (e.g., "a is a vowel in Latin but not in Cyrillic").

  ---

  ### **Likely Tensions Between Requirements**  
  1. **Gradedness vs. Category-Style Separation**  
     - If identity is fuzzy, how do we judge when style pressure breaks category integrity (e.g., Letter Spirit’s edge cases)?  
     - *Risk*: Vagueness makes algorithmic alphabet design impossible.  

  2. **Allograph Tolerance vs. Orientation Sensitivity**  
     - Why tolerate massive structural shifts (single/double-storey) but not rotation?  
     - *Resolution*: Must invoke *functional invariants* (e.g., topological features, stroke sequence) *plus* system-enforced orientation.  

  ---

  ### **Summary: What an Adequate Account Must Deliver**  
  - A **system-aware abstract schema** (beyond visual form) for each letter.  
  - **Dynamic feature weighting**: Critical features (e.g., enclosed counter in "a") prioritized over variable ones (serifs).  
  - **Contextual disambiguation**: Using word/line context to resolve ambiguities.  
  - **Fuzzy matching**: Allowing degraded inputs but rejecting category breaches.  
  - **Style as a secondary constraint**: Modifying the schema’s instantiation without overriding core identity.  

  This framework rejects shape-only, historical, and intentionalist accounts. Survivors are likely **cognitive-perceptual models** (e.g., schema theory) or **formal-semiotic systems** (e.g., grapheme as functional unit). Test it by running Letter Spirit’s edge-case glyphs through your candidate theory.
