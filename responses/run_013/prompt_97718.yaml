prompt: |-
  I'm trying to pin down my credence on a narrow question in the free will stuff, and I want your number plus the decomposition, not a tour of the literature.

  The question: does a Frankfurt-style case actually refute the principle of alternative possibilities (PAP) — the claim that your morally responsible for an action only if you could have done otherwise?

  So were looking at the same thing, here's the case. Jones is deciding whether to do A. Black has quietly rigged Jones's brain so that if Jones were about to decide not to do A, the rig would fire and make him decide to do A anyway. In fact Jones decides to do A on his own, for his own reasons, and the rig never fires. Frankfurt's verdict: Jones is responsible, yet he couldn't have done otherwise, so PAP is false.

  Now fold in this twist, because I think it matters. Suppose Black's rig is triggered not by the direction of Jones's decision but by which considerations he gives weight to: it fires if Jones starts to take the case against A seriously. As it happens, that consideration never even occurs to Jones, so he decides on his own and the rig stays off. What I want your credence on is whether this version actually refutes PAP.

  Give me your real number, decomposed. Terms I'd use, but swap them if you think there better ones: (1) whether PAP needs a robust alternative or only a thin flicker, and whether this case even leaves a flicker; (2) whether "could have done otherwise" should be read libertarian-style (same past and laws) or conditionally (he could have, if he had chosen otherwise); (3) whether the case secretly begs the question by presupposing determinism; (4) whether moral responsibility tracks the actual sequence of reasons rather than alternatives at all. Rough probability and one line for each, then the combination. Then tell me which single sub-question the whole number most hangs on, and what argument or example would move it the most. American English, casual is fine.
