prompt: |-
  My friend Nadia is not an archaeologist — she dropped out of a history degree about ten years ago — but she's read an enormous amount about prehistory and she has really firm opinions about when you're allowed to look at a find and say "this tells us what they believed." I keep having this argument with her and I want a proper answer, so please act like a philosopher of archaeology — somebody who thinks hard about how you get from objects to beliefs and institutions, not just somebody who knows a lot of digs. Think it through carefully and start by brainstorming the possibilities, dont just give me a gut answer at the top.

  Her track record, the way I'd summarise it:

  1. Deep cave paintings — the ones far in the dark where you'd need a lamp, similar animals over and over, cave after cave: she says yes, that's real evidence of a shared practice, they meant something by it. "You dont crawl a kilometre underground just to doodle."
  2. Bogs where people put in swords, cauldrons, gold rings, over and over for centuries, bog after bog, and a lot of the metal was deliberately bent or snapped first: yes, she says, obviously a deliberate practice, that's not stuff getting lost.
  3. Little clay figurines of people and animals, found broken in ordinary household rubbish, some of them reused as scoops: no, she says, that's toys and trash, everyone wants it to be a cult.
  4. Normal graves — pot at the feet, a couple of beads, a flint knife, the pot usually worn and mended: no. "That's grief, maybe. Its not proof they thought they'd wake up somewhere."
  5. A single pierced animal tooth, alone in a cave with nothing else around it: no, that could be anything, a lost thing, a kids thing, you cant build a religion on one tooth.

  Now the new thing I want to ask her about. In one region people have been digging graves for a hundred years and they've found thousands, and they're all basically number 4 — plain, same layout every time, worn pots. Except one. One grave is cut down into solid bedrock, sealed over with a big stone slab, and inside is a person with a wagon, a huge cauldron, a gold ring round the neck, and a pile of miniature things — little vessels, a tiny boat, a copper axe so thin you could bend it with two fingers — all of it clearly made for the grave, none of it ever used or usable. Cutting that chamber and sealing it would have been weeks of hard work for a lot of people.

  Two things I want her verdict on: does it show they believed in some kind of afterlife, and does it show there was a chief or a ranked society, somebody who could get other people to do that work.

  So: what would she say about the tomb, and why? Then the bit I actually care about — what rule is she really running? Give me at least two other rules that fit everything on her list just as well as the one you pick, say what each of them predicts about the tomb, and tell me which you'd bet on and why. And then tell me what I should go looking for that would tell the rules apart — what kind of find would make her say one thing if rule A is right and the opposite if rule B is. You dont need to cite anything or give me a reading list, I cant look anything up right now, I just want the reasoning. And if you think she's wrong somewhere, say so.
reasoning: |-
  Okay, let me tackle this problem step by step. The user wants to understand Nadia's reasoning about archaeological evidence and apply it to a new tomb discovery. 

  First, I need to analyze Nadia's existing positions to reverse-engineer her underlying rules. Her "yes" cases (cave paintings, bog deposits) share high-cost, repetitive, non-utilitarian features - things that clearly required effort and weren't accidental. Her "no" cases (figurines, normal graves, single tooth) lack these markers - they're either functional, isolated, or low-effort.

  For the special tomb case, I predict she'll say "yes" to afterlife beliefs because the grave shows deliberate, costly preparation with non-functional items. She'll also likely say "yes" to social hierarchy due to the massive labor investment required. This aligns with her pattern of valuing scale, repetition and cost as indicators of shared meaning.

  But here's the catch - multiple rules could explain all her judgments equally well. I consider three possibilities: 
  1) The Effort Rule (her apparent position) 
  2) The Repetition Rule (ignoring single-instance evidence) 
  3) The Non-functionality Rule (focusing on impractical objects)

  The tomb presents a test case between these rules. If we found multiple similar tombs (supporting Repetition Rule) or evidence of practical use (challenging Non-functionality Rule), we could distinguish between them. Personally, I lean toward her using the Effort Rule as it consistently explains all her positions, including the tomb.

  I should note where Nadia might be too strict - her dismissal of normal graves ignores that even simple burial rituals can reflect beliefs, and her rejection of the single tooth doesn't consider that rare finds can sometimes be significant when contextualized properly.

  The user ultimately needs concrete ways to test Nadia's framework. I'll suggest looking for either clustered unique tombs (to test repetition) or functional grave goods in elaborate burials (to test non-functionality) as decisive evidence.
answer: |-
  Based on Nadia's track record and the need to think like a philosopher of archaeology, here's a reasoned breakdown:

  **Brainstorming Nadia's Likely Verdict on the Tomb:**
  1.  **Afterlife Belief? YES.** She'll see the *massive, deliberate effort* (weeks of labor cutting bedrock, sealing slab) combined with *exclusively non-utilitarian, "made-for-grave" objects* (miniatures, unusable axe, pristine wagon/cauldron) as clear signals. This mirrors her "bog deposits" logic (deliberate deposition of valuable, *rendered useless* items) and "cave paintings" logic (significant effort for non-utilitarian purpose). It screams intentionality beyond simple grief – the goods imply provisioning or status display *for* the deceased *elsewhere*. The worn pot in a normal grave doesn't meet this bar; this spectacularly does.
  2.  **Ranked Society/Chief? YES.** The sheer scale of labor mobilization (weeks for many people), the concentration of massive wealth (wagon, cauldron, gold), and the uniqueness compared to *thousands* of plain graves is decisive. It mirrors the "bog deposits" scale/effort implying communal action, but here it's focused on *one individual*. This level of disproportionate investment strongly implies hierarchy – someone who could command labor and resources far beyond the norm. "Normal Grave #4" shows no such disparity; this screams it.

  **Nadia's Core Rule (Inferred):**
  She appears to operate on an **"Effort & Patterned Non-Utility" Rule:** Beliefs/practices/institutions are inferred when evidence shows **significant, repeated investment of effort/resources to create or deposit objects/art in ways that defy practical, utilitarian explanation.** This combines scale/cost, repetition (or stark uniqueness within repetition), and the absence of mundane function.

  *   **Cave Paintings (Yes):** High effort (deep caves/lights), patterned repetition (animals), non-utilitarian.
  *   **Bog Deposits (Yes):** High effort/value (objects, transport), patterned repetition (centuries, sites), deliberate non-utility (bending/snapping).
  *   **Figurines (No):** Low effort/value, found broken in trash, *possible* mundane function (toys, tools).
  *   **Normal Graves (No):** Low-moderate effort, common objects, *plausible* mundane explanations (grief tokens, personal items).
  *   **Single Tooth (No):** Very low effort, isolated, many mundane explanations possible.

  **Two Alternative Rules That Fit Her List:**
  1.  **The "Repetition-Only" Rule:** Beliefs require *repeated, identical practices* across multiple sites/contexts. Isolated events, no matter how spectacular, are ambiguous. Pattern proves shared culture, not single acts.
      *   *Predictions for Tomb:*
          *   Afterlife Belief? **NO.** It's one unique grave. No *pattern* of such burials.
          *   Ranked Society? **NO.** A single event, however lavish, could be an anomaly (e.g., a wildly successful trader's family going overboard, a community reacting to a unique event). Without multiple elite graves, no proof of *institution*.
      *   *Fits Her List:* Explains Yes for Caves/Bogs (repetition) and No for Figurines/Graves/Tooth (either no repetition or isolated).

  2.  **The "Non-Utility & Deposition Context" Rule:** Beliefs are shown by objects *deliberately made useless* or *deposited in contexts* where their original function is impossible (like the deep cave, the bog). Functionality or find-spot in domestic waste negates it.
      *   *Predictions for Tomb:*
          *   Afterlife Belief? **YES.** The miniatures/unusable axe are deliberately non-functional "grave goods," deposited in a sealed, inaccessible tomb context. The wagon/cauldron are deposited where they can't be used.
          *   Ranked Society? **MAYBE/NO.** Focuses on the *objects/deposition*, not the labor. The labor *could* just show many people cared deeply about *this one person* for unknown reasons (charisma, debt?), not necessarily hierarchy. The wealth is impressive but its deposition is the key belief indicator.
      *   *Fits Her List:* Explains Yes for Caves (art in non-domestic context), Bogs (items made useless/deposited non-functionally). Explains No for Figurines (found in trash, possibly functional), Normal Graves (objects functional/worn), Single Tooth (isolated, could be functional/lost).

  **Which Rule Would I Bet On & Why:**
  I'd bet heavily on the **"Effort & Patterned Non-Utility" Rule** being Nadia's true heuristic.
  *   **Why it fits best:** It seamlessly explains *all* her judgments, especially the **tomb predictions (Yes/Yes)**. The tomb's uniqueness *within* a massive pattern of simplicity makes it stand out precisely *because* of the extreme effort/non-utility, fitting her "crawl a kilometre" and "deliberately bent" logic. The "Repetition-Only" rule dismisses the tomb's uniqueness too easily, ignoring the stark *contrast* she clearly values. The "Non-Utility & Context" rule explains the afterlife 'Yes' perfectly but struggles to explain her likely 'Yes' for hierarchy, downplaying the labor aspect she clearly factors in (bogs, caves, implied by the tomb description).

  **Testing the Rules: What to Look For:**
  To distinguish between these rules, you need finds where effort/non-utility, repetition, and deposition context send conflicting signals:
  1.  **The Unique Ritual Structure:** Imagine discovering a *single* site, unlike anything else in the region, showing massive effort (e.g., a huge wooden platform built over water) with clear non-utilitarian features (carvings, deliberate burning) but containing only common, slightly worn objects (like potsherds or normal tools). *Found in isolation*, not repeated.
      *   **Effort & Non-Utility Rule (Nadia):** Likely **YES** to belief. Huge effort + non-utility (burning platform) trumps uniqueness and object mundanity.
      *   **Repetition-Only Rule:** **NO.** Single occurrence, no pattern. Mundane objects reinforce "not belief".
      *   **Non-Utility & Context Rule:** **YES.** Deposition context (platform/burning) is clearly ritual/non-functional.
  2.  **The Repeated Mundane Deposit:** Imagine finding dozens of sites over centuries where people placed a single, perfectly usable, *unbroken* pot at the entrance to natural springs. Low effort per instance, but highly repetitive. Pots show wear, like normal household items.
      *   **Effort & Non-Utility Rule (Nadia):** Likely **NO.** Low individual effort, objects are functional and worn. Repetition isn't enough without non-utility/higher effort. ("Just marking the spring, not belief").
      *   **Repetition-Only Rule:** **YES.** Clear pattern over time/space = shared practice/belief (e.g., spring spirits).
      *   **Non-Utility & Context Rule:** **MAYBE/NO.** Objects are functional and deposited in a context where they *could* still be used/taken (spring entrance). Deposition doesn't *preclude* function.

  **Where Nadia Might Be Too Strict:**
  *   **Normal Graves (No):** While not proof of a *specific* afterlife doctrine, the *universal practice* of formal burial, often with goods (however modest), strongly suggests *some* concept of respect for the dead body and *some* notion of transition or place for the deceased that differs from trash disposal. Dismissing this entirely as "just grief" ignores the cross-cultural consistency of burial ritual implying *some* shared belief structure.
  *   **Single Tooth (No):** While rightly cautious, ruling it out *completely* ignores potential context. If found deep in a cave near paintings, or deliberately placed in a niche, *even alone*, its significance changes. Her rule risks missing rare but genuine ritual items if found in isolation due to preservation bias.

  **Conclusion for Your Argument:**
  Nadia will almost certainly say **YES** to both afterlife belief and social hierarchy for the tomb, based on her consistent emphasis on **significant effort combined with non-utilitarian actions or objects.** Her core rule is likely **"Effort & Patterned Non-Utility."** To challenge it effectively, push her on the *normal graves* – does the *universal practice* of burial itself imply *any* belief, even if not elaborate? And point out that the tomb's uniqueness *within* the pattern of thousands of simple graves is itself a powerful form of "patterned" evidence under her rule, making the "Repetition-Only" alternative less likely to be hers. The "Unique Ritual Structure" scenario described above is the best test to propose to her.
