prompt: |-
  I'm a novelist, and I've been keeping a private list of moments where somebody takes another person's word about what's right — sometimes me, sometimes a character — and I keep having different reactions to them without being able to say why. I want a rule. Heres the list, with my gut on each one.

  My friend reads a draft of mine and says the way I wrote the fat neighbor is degrading. I don't see it. I take her word and rewrite him. Feels fine. More than fine, feels like what a good writer does.

  Same friend tells me my brother is manipulating me and I should stop speaking to him. I believe her, mostly. But it feels wrong to let her settle that one. Like I've handed over something that was mine to do. (Complication: she's never liked him and would like me to herself. Does that change it? I don't think it changes the shape of the thing, but I notice it.)

  A grad student I know reads somewhere that eating meat is wrong, isn't persuaded by any argument she could give herself, just trusts the source, goes vegetarian. I don't think she did anything wrong. Maybe she doesn't understand why. So what.

  Somebody tells me I was wrong to feel relieved when a difficult person finally died. Not wrong to say it — wrong to feel it. That one I don't think anyone can settle for me. Even if they're right, I can't take it from them.

  My six-year-old asks if it's ok to laugh at a kid with a stutter. I say no. She believes me, full stop, no reasons. Completely fine, obviously.

  I tell a grown friend the same kind of thing — that a joke he keeps making about a colleague is cruel — and he just accepts it. Doesn't push back, doesn't seem to see it, thanks me and stops. That one makes me squirmy. I'd rather he argued with me.

  I pick which charity to give to by copying a friend whose judgment I trust. No research, no reasoning. Fine.

  I decide whether to forgive my father by copying a friend. Not fine. Same structure, opposite verdict, and I can't tell you why.

  Two things I've noticed that may or may not be the same thing. First, believing something on someone's say-so seems to come apart from letting them make the call for me — the grad student takes a verdict off a page but still makes her own call; my friend who drops the joke takes my verdict and that's the part that bothers me. Second, I've started calling these "hand-me-down verdicts," a moral judgment you're using that you got off somebody else, and I can't tell if that's a real distinction or just a phrase I invented to save my intuitions.

  So: is there a principle that gets all eight, or close? If there isn't one, give me the two or three candidates and say which of my verdicts each has to throw overboard — I'd rather lose a verdict than keep a principle with a clause invented for every case. Tell me what each clause is doing and which case forced it. Then tell me what the surviving account predicts for one I haven't listed: an editor tells me my finished novel is morally irresponsible to publish, I believe her, and I pull the book without ever seeing it myself. And say honestly whether "hand-me-down verdict" is tracking anything real or whether I'm just dressing up a muddle.
reasoning: |-
  Okay, let me start by understanding what the user is asking. They're a novelist who's been collecting instances where someone accepts another person's judgment, and they have varied gut reactions to each. They want a principle that explains all these cases or, if that's not possible, a few principles that cover most, even if some intuitions have to be discarded. They also mention two observations: the difference between believing vs. letting someone decide, and the concept of "hand-me-down verdicts." Plus, they want this tested on a new scenario about pulling a novel based on an editor's moral judgment.

  First, I need to list all the examples with their gut reactions:
  1. Rewriting fat neighbor based on friend's feedback: Feels right.
  2. Cutting off brother on friend's advice: Feels wrong, like giving away agency.
  3. Grad student going vegetarian based on a source: Feels fine, even without understanding.
  4. Being told feeling relieved about a death is wrong: Can't accept, personal feeling.
  5. Child believing not to laugh at stutter: Fine.
  6. Friend accepting that his joke is cruel without pushback: Uncomfortable.
  7. Copying charity choice: Fine.
  8. Copying forgiveness decision for father: Not fine.

  The user's two insights: 
  - Believing vs. letting someone decide: In the grad student's case, she believes but decides herself. In the joke example, the friend accepts the verdict without internalizing, which bothers the user.
  - "Hand-me-down verdicts": Moral judgments adopted from others without personal engagement.

  The challenge is to find a unifying principle. Let me consider existing ethical frameworks. Moral particularism might be relevant since it emphasizes context over rules. But the user wants principles, so maybe agent-relative vs. agent-neutral obligations. 

  Looking at the examples, the key factors seem to be:
  - **Personal Stakes**: Decisions involving deep personal relationships (brother, father) feel wrong to outsource, while impersonal ones (charity, vegetarianism) are okay.
  - **Agency**: When the decision requires personal engagement or emotional work, like forgiveness or family dynamics, outsourcing feels off. The brother example involves the user's relationship, so agency matters. Similarly, forgiving the father is deeply personal.
  - **Moral Understanding**: In cases like the child or the joke, the lack of understanding or internalization causes discomfort. The child is too young, so it's acceptable, but the adult friend should engage more.
  - **Epistemic vs. Practical Authority**: Accepting factual or moral knowledge (like the neighbor's portrayal being degrading) is different from making a life decision (cutting off brother). The editor scenario might fall under epistemic if it's about moral responsibility, but publishing is a practical decision.

  Testing the editor scenario: If the user pulls the book based on the editor's judgment without seeing it, it feels similar to the charity example but with higher stakes. The principle here might depend on whether the user trusts the editor's expertise and if the moral judgment is within the editor's domain. But since it's the user's creative work, personal engagement might be necessary, making it uncomfortable.

  Possible principles:
  1. **Personal Agency Principle**: Decisions requiring deep personal emotional work or affecting core relationships shouldn't be outsourced.
  2. **Epistemic Trust Principle**: Accepting moral knowledge from trusted sources is fine when personal stakes are low or expertise is relevant.
  3. **Internalization Requirement**: For moral judgments to be authentically adopted, some level of understanding or endorsement is needed, except in developmental stages (like children).

  Conflicts: Example 3 (vegetarian) is accepted without understanding, which contradicts the internalization idea. But here, the user is okay with it because the stakes are personal health/environment, not interpersonal. Example 6 (joke) lacks internalization, causing discomfort. So internalization matters more when the judgment affects others directly.

  The "hand-me-down verdict" concept might track the lack of internalization. In cases where the verdict is adopted without personal engagement, it feels inauthentic. The grad student's choice, while based on trust, is her own decision, so it's not a hand-me-down. The friend accepting the joke verdict without question makes it hand-me-down, hence the discomfort.

  Synthesizing: The core principle is about ownership and the nature of the moral work required. Personal, relational decisions demand individual engagement, while impersonal or expertise-based ones can be delegated. The editor scenario involves both personal creation and moral responsibility. If the user trusts the editor's moral judgment like the charity, it might be acceptable, but since it's their art, it could feel like relinquishing agency, similar to forgiving the father. So the principle would predict discomfort unless the user engages with the reasons.
answer: |-
  After sitting with your list and the nuances you've described, I see a core tension between **epistemic trust** (believing someone's judgment) and **moral agency** (owning the decision). Your reactions aren't random—they're tracking whether a situation demands *personal moral work*. Below is a unified principle that covers all eight cases, followed by breakdowns, alternatives, and your test case. I'll be ruthlessly parsimonious: one principle, no loopholes.

  ### The Core Principle: The Scaffolding Rule
  > **You may outsource a verdict if—and only if—it scaffolds your own moral agency rather than replacing it.**  
  > *Scaffolding* means:  
  > (a) The verdict is a **tool** for your growth (e.g., learning, skill-building, or expanding perspective), OR  
  > (b) The stakes are **impersonal** (no deep relational or identity-based work required).  
  > If outsourcing *short-circuits* necessary moral work (e.g., emotional labor, relational repair, or identity-defining choices), it violates agency and feels wrong.

  This explains all eight cases without exceptions:

  1. **Rewriting the fat neighbor**:  
     - **Scaffolds agency**: You're honing your craft (tool for growth). Accepting feedback improves your skill.  
     - **Gut matches**: Feels right—it’s part of "what a good writer does."  

  2. **Cutting off your brother**:  
     - **Short-circuits agency**: Severing a family bond requires *your* emotional labor and relational reckoning. Outsourcing this feels like surrendering your moral work.  
     - **Complication noted**: Your friend’s bias highlights why *you* must own this—it’s too entangled with your history.  
     - **Gut matches**: Feels wrong. "Handed over something that was mine."  

  3. **Grad student going vegetarian**:  
     - **Scaffolds agency**: She uses the source’s verdict as a tool to explore a new ethical stance (growth). Her choice remains *hers*—she acts on it independently.  
     - **Gut matches**: Fine. She doesn’t need full understanding yet; she’s building it.  

  4. **Being told your relief is wrong**:  
     - **Short-circuits agency**: Emotions are identity-defining. No one can process your feelings *for* you.  
     - **Gut matches**: Unacceptable—"I can’t take it from them."  

  5. **Child believing laughing is wrong**:  
     - **Scaffolds agency**: A child *needs* external rules to build moral foundations (tool for growth). This is age-appropriate scaffolding.  
     - **Gut matches**: "Completely fine."  

  6. **Friend accepting the joke is cruel**:  
     - **Short-circuits agency**: He avoids the work of examining *why* it’s cruel. As an adult, he should engage (relational growth). His passive acceptance feels like moral laziness.  
     - **Gut matches**: Squirmy—you wanted him to *argue*, not obey.  

  7. **Copying charity choice**:  
     - **Scaffolds agency**: Low-stakes, impersonal (no deep relational work). Trusting a friend’s judgment is efficient—no growth needed here.  
     - **Gut matches**: Fine.  

  8. **Copying forgiveness for your father**:  
     - **Short-circuits agency**: Forgiveness is identity-shaping emotional labor. Copying bypasses the necessary internal work.  
     - **Gut matches**: Not fine—"same structure, opposite verdict."  

  ### Your Two Insights—Validated
  1. **Believing vs. making the call**:  
     - The Scaffolding Rule explains this. Believing (e.g., the grad student) is *using* a verdict as a tool; "making the call" (e.g., cutting off your brother) is outsourcing work you must do.  
  2. **"Hand-me-down verdicts"**:  
     - **This tracks something real**. It describes verdicts adopted *without* scaffolding—bypassing agency. Your discomfort in cases 2, 6, and 8 is about hand-me-downs. In cases 1, 3, and 7, verdicts are tools, not hand-me-downs. Keep the phrase—it’s sharp.  

  ### What If We Forced Alternative Principles?  
  If we discarded the Scaffolding Rule, here’s how other theories would fail (and which of your verdicts they’d sacrifice):  

  | Principle                  | Sacrificed Verdict                         | Why It Fails                          | Clause Forced                          |  
  |----------------------------|--------------------------------------------|---------------------------------------|----------------------------------------|  
  | **"Never outsource relational decisions"** | Charity (7) and Vegetarian (3) verdicts | Copying charity is impersonal; vegetarianism *could* be relational but isn’t for the student. | "Except when stakes are trivial" → but "trivial" is fuzzy. |  
  | **"Understanding required for adults"**    | Vegetarian (3) verdict                   | You’re fine with her not understanding. | "Except when learning" → but learning isn’t always explicit. |  
  | **"Trust only impartial sources"**         | Brother (2) and Joke (6) verdicts        | Your friend’s bias in (2) didn’t change your gut; joke feedback (6) was impartial but still felt off. | "Except when..." → no consistent fix. |  

  The Scaffolding Rule has no such clauses—it uses **growth** and **impersonality** as natural dividers.  

  ### Test Case: The Editor’s Verdict  
  *Scenario: An editor you trust says your novel is morally irresponsible to publish. You believe her and pull it without reading it yourself.*  
  - **Scaffolding Rule Prediction**: This should feel **wrong** (like cases 2 and 8). Publishing is an act of authorship—owning your work’s moral impact is core to your identity as a writer. Pulling the book without engaging short-circuits your artistic agency.  
  - **Why?** Even if she’s right, *you* need to grapple with why (e.g., Is it harmful? Does it misrepresent?). Trusting her judgment as a tool (e.g., "Her critique helps me see flaws") would scaffold growth; blind obedience would not.  

  ### Final Note  
  Your instincts are consistent. **"Hand-me-down verdict"** isn’t a muddle—it’s the exact failure mode of scaffolding: verdicts worn without being *integrated*. The discomfort is your agency saying, "This isn’t mine to delegate." Use this. As a novelist, you know authenticity comes from characters earning their choices—your life demands the same rigor.  

  If you test this against new examples and it cracks, DM me. I’ll sharpen it.
