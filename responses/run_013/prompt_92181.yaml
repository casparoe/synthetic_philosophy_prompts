     - **What is distorted?** In the original, the right is defined over a pair of alternatives (which might be multidimensional). In the rationalist translation, we are thinking of a right as being over a single coordinate (a one-dimensional issue). This is a simplification that might not capture the full generality of Sen's condition. However, in the standard example, the pair of alternatives corresponds exactly to a binary choice on a single issue (e.g., "I read the book" vs. "I don't read the book"). So in that case, it's without loss.
