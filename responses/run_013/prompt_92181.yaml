  The rationalist framework can capture this by including an inalienability constraint. However, the typical rationalist approach is to avoid such constraints because they lead to inefficiency (Pareto inefficiency). The residue is the normative commitment to inalienability.

  #### What does the rationalist vocabulary fail to express?
