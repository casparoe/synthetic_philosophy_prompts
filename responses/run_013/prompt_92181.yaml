     - **Original**: There are at least two individuals each of whom is decisive over at least one pair of alternatives. That is, for each of these individuals, there exists at least one pair of alternatives (say, (x, y)) such that if that individual strictly prefers x to y, then society must strictly prefer x to y, and similarly if they strictly prefer y to x, then society must strictly prefer y to x.
