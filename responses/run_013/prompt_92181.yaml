  Exactly: the social choice function must choose b from the set {a, b, c} because b is the maximal under the social preference. But then we have a violation of Weak Pareto on the pair (a, b): both prefer a to b, but society chooses b (or at least does not choose a over b). 

  So the residue is not just about inalienability, but about the fact that the inalienable rights force a violation of Pareto efficiency. 

  In the rationalist framework, we are very sensitive to Pareto inefficiency. We would see this as a flaw and seek to fix it by allowing trading. But if we are committed to the deontological view, then we must accept this inefficiency.

  #### Conclusion
  The residue is real: it is the deontological commitment to inalienable rights that can override Pareto efficiency. The rationalist framework can capture it by adding an explicit constraint that the mechanism must respect the rights (i.e., the mechanism must be such that on the assigned pairs, the agent is decisive) and this constraint is hard (cannot be violated). But then we get an impossibility result (or at least, a mechanism that can produce Pareto inefficient outcomes). 

