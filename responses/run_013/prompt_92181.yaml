       - This is a **constraint the designer simply honors**. It is a normative requirement that we build into the mechanism: the mechanism must be Pareto efficient. We can also see it as a **feasibility constraint** in the sense that we are excluding mechanisms that violate Pareto efficiency.
     - **What survives without loss?** The idea of Pareto efficiency is central to the rationalist framework and translates exactly.
     - **What is distorted?** None, because the condition is about strict preferences and the translation to Pareto dominance (which is defined by strict inequalities in utility) is exact.
     - **What has no counterpart?** None.

