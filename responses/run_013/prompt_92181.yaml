  The trade-off is between:
  - Efficiency (Pareto) and 
  - Liberty (inalienable rights).

  The rationalist framework typically prioritizes efficiency and thus would recommend making the rights alienable. But if we have a deontological commitment to liberty, then we must accept the cost in efficiency.

  Therefore, the paradox is not dissolved but translated: it becomes an instance of the trade-off between efficiency and distributional (or rights-based) concerns. The residue is the insistence that rights are inalienable, which is a non-utilitarian value.
answer: |-
  ### Translation of Sen's Liberal Paradox into Rationalist Vocabulary

  I'll translate each condition of Sen's paradox (Unrestricted Domain, Weak Pareto, Minimal Liberalism) into your specified vocabulary, explicitly mapping constraints and decision rights. I'll then analyze the residue—what gets lost in translation—and evaluate the "Coasean bargaining" solution.

  ---

  ### **1. Unrestricted Domain (UD)**
  **Original**: Any profile of individual preference orderings must be admissible.  
  **Translation**:  
  - **Agents & Utility Functions**: Agents have arbitrary cardinal utility functions over alternatives.  
  - **Mechanism Designer's Constraint**: The social choice function (SCF) must be defined for all possible utility function profiles.  
  - **Constraint Type**: **Feasibility constraint** on the SCF's domain.  
  - **Mapping Rationale**:  
    - Preferences become utility functions (ordinal preferences preserved under affine transformations).  
    - UD ensures no restrictions on agents' values/beliefs.  
  - **What Survives Without Loss**: Full expressiveness of agent preferences.  
  - **Survives with Distortion**: None. Cardinal utilities can represent ordinal preferences, so no distortion.  
  - **No Counterpart**: None—UD is native to mechanism design (e.g., Gibbard-Satterthwaite theorem).

  ---

  ### **2. Weak Pareto (WP)**
  **Original**: If all agents strictly prefer alternative A to B, society must rank A above B.  
  **Translation**:  
  - **Agents & Utility Functions**: If all agents have higher utility from A than B, the SCF must not choose B when A is feasible.  
  - **Mechanism Designer's Constraint**: The SCF must satisfy **Pareto efficiency**.  
  - **Constraint Type**: **Normative constraint the designer honors** (built into the SCF as a requirement).  
  - **Mapping Rationale**:  
    - Directly corresponds to Pareto improvements.  
    - Treated as a non-negotiable welfare criterion.  
  - **What Survives Without Loss**: The core idea of unanimity dominating social choice.  
  - **Survives with Distortion**: None—WP is a foundational concept in rationalist frameworks.  
  - **No Counterpart**: None. Pareto efficiency is central to value aggregation.

  ---

  ### **3. Minimal Liberalism (ML)**
  **Original**: At least two agents are each decisive over one pair of alternatives (e.g., "Lewd decides if *he* reads the book").  
  **Translation**:  
  - **Agents & Decision Rights**: At least two agents each control a binary "coordinate" of the outcome space (e.g., Lewd controls the bit: "Lewd reads: yes/no").  
  - **Mechanism Designer's Constraint**: The SCF must respect each agent's choice over their assigned coordinate.  
  - **Constraint Type**: **Assignment of decision rights** (property rights over a dimension).  
  - **Mapping Rationale**:  
    - ML becomes a **decentralization constraint**: Rights are alienable entitlements over specific variables.  
    - Conflicts are framed as externalities (e.g., Lewd's reading choice affects Prude's utility).  
  - **What Survives Without Loss**: The idea of localized control.  
  - **Survives with Distortion**:  
    - **Rights as alienable**: In Sen's original, rights are deontological (society *must* respect them). In rationalist terms, they become tradable property rights.  
    - **Loss of inalienability**: The moral weight of "society may not override" is reduced to an initial endowment in a bargaining game.  
  - **No Counterpart**: Sen's "decisiveness" implies a *duty* of the SCF; rationalist framing makes it a *tradable claim*.

  ---

  ### **The Paradox in Rationalist Terms**
  **Translated Statement**:  
  > No social choice function exists that satisfies:  
  > - **Feasibility**: Defined for all utility function profiles (UD).  
  > - **Normative**: Pareto efficient (WP).  
  > - **Decentralization**: Two agents hold alienable property rights over one coordinate each (ML).  
  >   
  > **Illustration**:  
  > - Coordinates: `Lewd_Reads` (controlled by Lewd), `Prude_Reads` (controlled by Prude).  
  > - Alternatives: `A` (Lewd reads, Prude doesn’t), `B` (neither reads), `C` (Prude reads, Lewd doesn’t).  
  > - Preferences:  
  >   - Lewd: `Utility(A) > Utility(C) > Utility(B)`  
  >   - Prude: `Utility(B) > Utility(A) > Utility(C)`  
  > - Rights:  
  >   - Lewd exercises control: Chooses `A` over `B` → Society must prefer `A ≻ B`.  
  >   - Prude exercises control: Chooses `B` over `C` → Society must prefer `B ≻ C`.  
  > - Transitivity ⇒ `A ≻ C`.  
  > - But both prefer `C ≻ A`? (In Sen's setup: **No.** Both prefer `A ≻ C`? Actually, [rechecking](https://plato.stanford.edu/entries/liberal-paradox/)):  
  >   - *Corrected preferences* (Sen's classic):  
  >     - Lewd (wants to read): `A ≻ C ≻ B`  
  >     - Prude (moralistic): `B ≻ A ≻ C`  
  >   - Rights:  
  >     - Lewd: Prefers `A` (read) over `B` (not read) ⇒ `A ≻ B`.  
  >     - Prude: Prefers `B` (no one reads) over `C` (Prude reads) ⇒ `B ≻ C`.  
  >   - Transitivity ⇒ `A ≻ C`.  
  >   - Pareto: Both prefer `A ≻ C`? Lewd: `A ≻ C`, Prude: `A ≻ C`? **No:** Prude prefers `A ≻ C` (since `B ≻ A ≻ C`), but Lewd also prefers `A ≻ C`. So `A ≻ C` is Pareto-compliant.  
  >   - **Actual conflict**: Pareto requires `A ≻ B` (both prefer `A` to `B`? Lewd: `A ≻ B`, Prude: `B ≻ A` → no unanimity).  
  > - **True conflict**:  
  >   - From rights: `A ≻ B` (Lewd) + `B ≻ C` (Prude) ⇒ `A ≻ C`.  
  >   - But Pareto: Both prefer `B ≻ A`? **No** in standard example. *Revised example*:  
  >     - Preferences:  
  >       - Lewd: `C ≻ A ≻ B`  
  >       - Prude: `A ≻ B ≻ C`  
  >     - Rights:  
  >       - Lewd: Prefers `C` over `A` ⇒ `C ≻ A`.  
  >       - Prude: Prefers `B` over `C` ⇒ `B ≻ C`.  
  >     - Transitivity: `B ≻ C ≻ A` ⇒ `B ≻ A`.  
  >     - Pareto: Both prefer `A ≻ B`? Lewd: `A ≻ B`, Prude: `A ≻ B` ⇒ `A ≻ B`.  
  >     - ⇒ **Contradiction**: `B ≻ A` (rights) vs. `A ≻ B` (Pareto).  

  **Result**: Rights assignments force `B ≻ A`, but Pareto requires `A ≻ B` → **Impossible SCF**.

  ---

  ### **Coasean Bargaining: Dissolves or Translates the Paradox?**
  **Rationalist Move**: Treat ML as property rights → allow Coasean bargaining to internalize externalities.  
  - **Mechanics**: Agents trade decision rights (e.g., Lewd sells his "reading right" to Prude).  
  - **Outcome**: Bargaining reaches a Pareto-efficient allocation (e.g., both agree on `A` with side payments).  

  **Does it dissolve the paradox?**  
  - **Yes, superficially**: Bargaining avoids the SCF impossibility by changing the game:  
    - Rights are alienable → no fixed "decisiveness" constraint.  
    - Post-trade, conflicts vanish (e.g., after trading, only one agent controls both coordinates).  
  - **No, fundamentally**: It **translates the paradox** into a different theorem:  
    - **Coase Theorem assumptions fail**:  
      - Transaction costs (bargaining under incomplete information).  
      - Wealth effects (e.g., Prude can't compensate Lewd sufficiently).  
    - **New impossibility**: Myerson-Satterthwaite theorem shows *no efficient mechanism* exists for bargaining under incomplete information → Pareto efficiency unattainable.  
    - **Residue persists**: The deontological "no override" demand is replaced by bargaining inefficiency.  

  **Key Tension**:  
  - Sen's ML is **inalienable** (society *prohibits* override).  
  - Rationalist reframing makes rights **alienable** (welfare-maximizing instruments).  
  - → **Loss**: The moral claim that rights are *not* merely tradable goods.

  ---

  ### **Residue Report: What Your Vocabulary Fails to Express**
  #### **The Residue**  
  The irreducibly **deontological core** of Sen's liberalism:  
  > *Society may not override an agent's exercised right—even if doing so would yield a Pareto improvement.*  

  #### **Why It's a Residue**  
  1. **Not Captured by Mechanism Design (MD)**:  
     - MD treats constraints as either:  
       - **Feasibility** (what is possible), or  
       - **Normative** (what is desirable, e.g., Pareto efficiency).  
     - Sen's rights are **deontic constraints**: "You *must not* violate liberty, regardless of consequences." This is exogenous to MD's consequentialism.  
     - Example: In the book choice, MD sees a bargaining problem; Sen sees a categorical imperative.  

  2. **Ambiguity or Fundamental Feature?**  
     - **Not mere ambiguity**: Sen's constraint is intentionally non-welfarist—it prioritizes process over outcomes. Your vocabulary implicitly assumes all constraints can be welfare-justified (e.g., "rights exist to maximize utility").  
     - **Real feature**: Rights as "side constraints" (Nozick) resist aggregation into a social utility function.  

  #### **Cost of Adding the Residue to Your Framework**  
  - **Option 1: New Primitive**  
    - Add **inviolable decision rights** as a primitive.  
    - Cost: MD becomes a **constrained optimization**: Maximize social welfare *subject to* rights never being overridden.  
    - Consequence: Accept Pareto inefficiency (as in Sen's paradox) as a necessary trade-off.  
  - **Option 2: Reframe Constraints**  
    - Distinguish **chosen constraints** (e.g., Pareto) from **binding constraints** (e.g., rights as "hard" boundaries).  
    - Cost: Abandon the rationalist tenet that all norms are reducible to utility maximization.  

  #### **Recommendation**  
  - **Short-term**: Be explicit about which constraints are treated as alienable (Coasean) vs. inalienable (deontic). Sen's paradox resurfaces as a **meta-choice**: "When should we allow rights to be traded?"  
  - **Long-term**: Incorporate **multiple constraint types** into MD:  
    - **Feasibility** (physical limits),  
    - **Incentive-compatibility** (strategic limits),  
    - **Deontic** (ethical limits).  

  ---

  ### **Conclusion**  
  Your vocabulary **faithfully translates** UD and WP but **distorts ML** by recasting rights as alienable entitlements. The residue—Sen's inalienable "no override" clause—exposes a gap in rationalist MD: it cannot natively capture non-consequentialist ethics without new primitives. The Coasean move dissolves the original paradox but replaces it with bargaining inefficiency (Myerson-Satterthwaite), proving the residue is **real and substantive**. To capture it, you must either:  
  1. Introduce deontic primitives (cost: Pareto efficiency not always achievable), or  
  2. Explicitly acknowledge that rationalism's consequentialism filters out non-welfarist values.  

  Sen's paradox thus reveals a **foundational trade-off**: liberty and efficiency are compatible only when rights are alienable—but some liberties resist being commodified.
