    - We ask for interventions. For a pendulum, an intervention might be changing the length, the mass, or the initial angle. The group agrees on I: e.g., run the pendulum at three different lengths (L1, L2, L3) and measure the period.
    - Model A: Predictions are deterministic and simple (T=2π√(L/g)). The prediction vector for the three lengths is [T1, T2, T3] which is a simple function. When compressed, it will be short.
