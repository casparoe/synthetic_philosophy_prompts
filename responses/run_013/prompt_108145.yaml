  - Models:
    - C: Simple network, one free parameter, fits the data well.
    - D: Complex network, parameters fixed by theory, fits less well but predicts a novel intervention more accurately.

  - Step 1: OC
    - Model C: L(model) is short (1 parameter) and L(data|model) is short (fits well). So low OC.
    - Model D: L(model) is long (complex network, but parameters fixed, so we don't need to transmit them? But note: in MDL, we count the model structure). However, since the parameters are fixed by theory, they are not free? We must transmit the model structure, which is complex. And the fit is worse, so L(data|model) is longer. So high OC.

  - Step 2: IC
    - The group agrees on a set I that includes the novel intervention that model D predicted accurately (and at least two more). The proponents of C and D propose interventions. The novel intervention is included.
