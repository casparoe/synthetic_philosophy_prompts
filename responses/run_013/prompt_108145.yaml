    - For model D: the predictions for I? It has a complex model, but the predictions might be a simple pattern? Or they might be complex? But note: the model D predicted the novel intervention accurately in the past? We are not using past data, only the prediction pattern. However, if the model D is based on theory and the interventions are natural within that theory, then the predictions might be simple (e.g., linear, or follow a known law). Therefore, the prediction vector might compress well.

  - Suppose the prediction vector for I by model C is complex (because the model is too simple to capture the nuances) and does not compress well, while model D's prediction vector is simple (because it fits the theory) and compresses well. Then model D has a lower IC.

  - Step 3: 
    - Model D has a higher OC (worse) but a lower IC (better). If the group weights IC more (because they are in an exploratory phase) then by step 3.1, if D's IC is significantly lower, D wins. Otherwise, they compute Total. Given that D's IC is much better and OC is not too bad, D might win.

  **Case 3: Preferring an Ugly Model**
  - Suppose we have two models, E and F. The procedure, after steps, recommends model E, but the group finds E ugly (e.g., non-intuitive, contrived). 
  - How to handle? The procedure does not account for beauty. The group must follow the procedure. However, they can note their discomfort and consider:
     - Is the set I comprehensive? Maybe they have not included an intervention that would expose E's ugliness?
