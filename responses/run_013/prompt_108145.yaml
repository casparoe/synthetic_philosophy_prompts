  We are designing a decision procedure for a research group to choose between rival models, emphasizing the distinction between observational compressibility (OC) and interventional compressibility (IC). The procedure must be practical and run within a 90-minute meeting.

  ### Key Concepts Recap
  - **Observational Compressibility (OC)**: How well the model compresses the observed data (like traditional MDL or Kolmogorov complexity for the data).
  - **Interventional Compressibility (IC)**: How well the model compresses the description of the set of interventions (experiments) that would change the system or distinguish the model from rivals. This captures the model's utility in guiding further experimentation.

  We note that:
  - OC is approximated by the minimum description length (MDL) of the data given the model.
  - IC is more novel and requires a way to describe interventions. We approximate IC by the MDL of a set of key interventions that the model suggests or that are necessary to distinguish it from rivals.

  ### Practical Challenges
  1. **Reference Language/Machine**: We cannot avoid the choice of a reference language for compression. We must use a practical compressor (e.g., gzip, a programming language, or a domain-specific encoding) and note that the additive constant might matter when data is finite. The group must agree on a compressor for consistency.
  2. **Non-Nested Models**: The models are not nested, so we cannot use traditional hypothesis testing that relies on nestedness.
  3. **Judgments vs Calculations**: Some steps are objective (e.g., computing description lengths) and some require expert judgment (e.g., defining the set of interventions, agreeing on a compressor).

  ### Decision Procedure: Checklist/Flowchart

  **Step 0: Pre-Meeting Preparation (Distributed to Members One Week Before)**
     - Each model proponent must provide:
       a. The model in a precise, executable form (e.g., code, equations).
       b. The data set used for fitting (in a standard format).
       c. The fitted parameters (if any) and the model's predictions on the data.
       d. A list of at least three (or a predefined number) critical interventions that the model suggests. These interventions should be designed to test the model against its rivals. For each intervention, provide:
          - A description of the experimental setup.
          - The model's prediction for the outcome.
          - The rival model's prediction (if different).
     - The group agrees on a reference compressor (e.g., gzip, or a domain-specific encoder) for both OC and IC. If they cannot agree, use a simple default (e.g., gzip) and note the limitation.

  **Step 1: Calculate Observational Compressibility (OC) for each model (Objective)**
     - For each model, compute the MDL of the data given the model. This includes:
       - The description length of the model (including its parameters) in the reference language.
       - The description length of the prediction errors (residuals) using a chosen error encoding (e.g., Gaussian with variance estimated from residuals).
     - Formula: `OC = L(model) + L(data | model)`
     - Use the same reference compressor for all models. Record the OC values.

  **Step 2: Calculate Interventional Compressibility (IC) for each model (Requires Judgment)**
     - For each model, consider the set of interventions provided by the model proponent (from Step 0d). We want to compute the description length of these interventions in a way that captures their ability to distinguish the model from rivals.
     - We define the IC for a model as the compression of the description of these interventions and their expected outcomes relative to the model. However, note that IC is about the model's ability to guide us to informative experiments. We approximate it by:
       - For each model, we have a set of interventions I. We require that the same set of interventions I is used for all models (to compare fairly). The group must agree on a set I that is comprehensive enough to cover the critical tests for the models under consideration. If the proponents have provided different interventions, the group must define a common set I (by discussion and vote if necessary) that includes the most critical interventions from each model.
       - We then describe each intervention in a standard format (using the reference language) and also describe the model's prediction for that intervention. The IC for a model is the compression of the entire set of intervention descriptions and their predictions. However, note: we want interventions that are effective at distinguishing, so we might weight by how much the predictions differ from rivals? This step is tricky and requires judgment.
     - Alternative practical approach: 
          - We define the IC of a model as the inverse of the description length needed to specify the set of interventions that would falsify the model or that the model deems informative. But note: a model that requires many interventions to be tested is less compressible interventionaly.
          - Instead, we propose: `IC = L(intervention set I) + L(predictions for I | model)`
          - But note: we want a set I that is the same for all models. The group must agree on a set I of k interventions (say k=3) that are critical for the current debate.
          - Then, for each model, we encode the set I and the model's predictions for I. The description length of I is the same for all models, so we can ignore it in comparison. Therefore, we only need `L(predictions for I | model)`. But note: if the model's predictions for I are simple (i.e., they are deterministic and require few parameters), then they are more compressible. However, if the model requires complex calculations to predict I, then `L(predictions for I | model)` might be long. But in practice, we are encoding the predictions (a vector of numbers) and we can use a standard encoding (e.g., using the model's residual variance from the data to encode the expected error). Alternatively, we can compute the MDL for the predictions of I? But we don't have data for I yet! We are only predicting.

     - We adjust: We are not yet running the interventions, so we are comparing the models on how simply they can specify the interventions and their outcomes. We break IC into two parts:
          a. **Intervention Simplicity**: The description length of the intervention set I in the reference language. (This is the same for all models, so we can ignore in comparison.)
          b. **Prediction Simplicity**: For each model, the description length of the predictions for the interventions I. This includes:
              - The model itself (which we already have in OC) but note we don't want to double count. Instead, we consider: given the model, how much additional information is needed to specify the predictions for I? If the model already fully specifies the predictions (and they are simple functions), then this length is short.

     - However, to avoid double-counting the model, we define:
