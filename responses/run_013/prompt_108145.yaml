       But note: the model is already described in OC. In IC, we care about the model's ability to make predictions for new interventions. So we want the conditional description length of the predictions given the model. This should be small for a model that is interventionaly compressible because it makes clear and simple predictions for critical tests.

     - Practical computation: For each model, given the model (which we have from Step 1), we encode the predictions for the intervention set I. We use the same error model as in OC for the expected precision. Since we don't have data, we are encoding the predictions as if they were exact? Or we can use the model's stated uncertainty. But note: we are not fitting, we are predicting. We assume the model predicts a vector of outcomes. We can encode this vector using the model's own uncertainty (e.g., if the model says the outcome is 5±0.1, we use a Gaussian with that variance). Then `L(predictions for I | model)` is the length of encoding the vector of predictions with the model's error distribution.

     - But note: a model that makes precise predictions might have a long code if the predictions are complex numbers? Actually, we are encoding the numbers to some precision. We choose a precision based on the model's uncertainty (if available) or a standard precision (e.g., 4 decimal places). This is somewhat arbitrary but necessary.

     - Therefore, we define:
          `IC = L(predictions for I | model)`
       which we compute by encoding the vector of predictions (for the common set I) using the model's error distribution (if available, else a default) and a standard compressor for numbers.

     - However, note that a model that makes vague predictions (high uncertainty) would have a shorter description because we can use a broad distribution. But we want models that make precise and simple predictions. Therefore, we must balance precision and simplicity. This is a challenge. Alternatively, we might fix the encoding precision for all models (to avoid bias) and then the model with the simplest pattern of predictions (e.g., constant, linear) would compress better.

     - Given time, we propose: The group agrees on a fixed encoding precision (e.g., 4 decimal places) and then uses a simple compressor (like gzip) on the string representation of the prediction vector. We then get a code length. This way, if a model predicts a constant value for all interventions, it will compress very well. If it predicts a complex pattern, it will compress less. This captures the idea of simplicity in predictions.

     - Therefore, step 2:
          - Agree on a common set of interventions I (from the proponents' lists). This is a judgment step and might take time. Set a timer (e.g., 20 minutes). If they cannot agree, the head of the lab chooses I.
          - For each model, compute the vector of predictions for I (using the fixed precision, e.g., 4 decimals).
          - Convert the vector to a string (e.g., CSV) and compress it with the reference compressor. The compressed length (in bits or bytes) is the IC score for that model (lower is better).

  **Step 3: Combine OC and IC (Judgment on Weighting)**
     - We now have two scores for each model: OC (lower is better) and IC (lower is better). But note: they are on different scales. We must normalize or combine them appropriately.
     - Since the absolute values of description lengths can vary greatly and are sensitive to the reference compressor, we cannot simply add them. Instead, we compute a normalized score.
     - Alternative: We are interested in a preference. We can compute for each model a total compression score: `Total = w_obs * (OC) + w_int * (IC)`, but the weights are subjective. We propose that the group decides the weights in advance? Or we can use a vote on the relative importance of fitting the data vs guiding experiments.

     - Given the time, we propose a two-step comparison:
          a. First, compare the models on IC (interventional compressibility) because the problem states that IC is often what we care about. If one model has a significantly lower IC (e.g., more than 10% shorter description length) than the others, then choose that model and stop.
          b. If IC does not clearly distinguish, then compare OC. If one model has a significantly lower OC, choose that model.
          c. If neither is clear, then consider both. We compute a combined score: `Total = OC + alpha * IC`, but we need to set alpha. We suggest setting alpha such that OC and IC are on the same scale. We can use: `alpha = (median OC of the models) / (median IC of the models)` to scale them. Then the model with the smallest Total wins.

     - However, note: the group might value IC more. We can set alpha > 1 to weight IC more. We propose that the group, at the beginning, decides by vote whether they are in a phase of exploration (then weight IC more) or exploitation (then weight OC more). If they cannot decide, use alpha=1.

     - Steps:
          3.1. Compare IC: If the best model (lowest IC) has IC at least 10% lower than the next, then recommend that model.
          3.2. Else, compare OC: If the best model (lowest OC) has OC at least 10% lower than the next, then recommend that model.
          3.3. Else, compute the median OC and median IC over the models. Let `alpha = median(OC) / median(IC)`. Then for each model, compute `Total = OC + alpha * IC`. The model with the smallest Total wins.

  **Step 4: Tie-Breaking and Gathering More Data**
     - If after step 3 there is still a tie (or if the difference in Total is less than 5%), then the procedure does not choose a winner. The recommendation is to gather more data by running one of the interventions in the set I (the group picks the one they think is most informative or cheapest). Then, the group meets again when the new data is available.

  **Step 5: Handling Disagreements with the Lab Head**
     - The procedure produces a recommendation. The lab head has the final say and may override. In that case, the lab head must provide a written justification that becomes part of the record.

  ### Application to Cases

  **Case 1: Pendulum Experiment**
