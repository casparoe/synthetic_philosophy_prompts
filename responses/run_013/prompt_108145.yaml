     - If the group is still uncomfortable, they can choose to gather more data (step 4) by running an intervention that they think might break E.

  ### Limits and Breakdown
  1. **What the procedure cannot do**:
     - It cannot create new models. It only chooses among given rivals.
     - It cannot handle models that are not operational (cannot make predictions).
     - It relies on the choice of reference compressor. If the compressor is biased, so is the result.
     - It requires defining a set of interventions, which is subjective and might be incomplete.

  2. **Breakdown of OC/IC distinction**:
     - In some domains, interventions are not possible (e.g., astronomy) so IC is not applicable. Then we default to OC.
     - If the models are not causal, the concept of intervention might not apply. We need causal models for IC.

