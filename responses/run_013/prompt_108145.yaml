  4. **Conflict with the lab head**:
     - The lab head has the final say and can override. The procedure is advisory. The head must justify in writing.

  ### Final Procedure Summary (for the meeting)
  0. **Pre-meeting**: Proponents provide models, data, and proposed interventions. Group agrees on reference compressor.
  1. **OC Calculation**: For each model, compute the MDL of the data (model + residuals).
  2. **IC Preparation**: Agree on a common set I of interventions (3-5). Set a timer (20 min); if no agreement, head decides.
  3. **IC Calculation**: For each model, compute the compressed length of the prediction vector for I (using fixed precision and reference compressor).
  4. **Decision**:
     a. If any model's IC is at least 10% lower than all others, choose it.
     b. Else, if any model's OC is at least 10% lower than all others, choose it.
     c. Else, compute Total = OC + alpha * IC (with alpha = median(OC)/median(IC)). Choose the model with the smallest Total.
  5. **Tie or Discomfort**: If tie (or discomfort), recommend gathering more data by running an intervention from I.

  This procedure fits in 90 minutes if the pre-meeting work is done. The meeting focuses on agreeing on interventions (step 2) and the calculations (which can be automated).
answer: |-
  Below is a practical decision procedure for your research group, designed around your distinction between observational compressibility (OC) and interventional compressibility (IC). It translates algorithmic information theory into actionable steps while acknowledging its limitations. The procedure is structured as a flowchart with numbered steps, explicit stopping conditions, and clear labels for calculations vs. judgments. I then apply it to your two cases and a third "ugly model" scenario, and conclude with its limits.

  ---

  ### **Decision Procedure for Model Selection**  
  *Time: 90-minute meeting (monthly). Input: Rival models + pre-meeting prep. Output: Recommendation to lab head.*

  #### **Pre-Meeting Preparation (1 week before)**  
  1. **Model proponents submit**:  
     - Code/equations for each model.  
     - Fitted parameters and predictions on the **current dataset**.  
     - A list of **3–5 candidate interventions** that could distinguish their model from rivals (e.g., "double enzyme concentration" or "vary temperature").  
     - Predictions for each intervention.  
  2. **Group agrees on**:  
     - A **reference compressor** (e.g., gzip, domain-specific encoder). Default: gzip.  
     - A **fixed precision** for numerical data (e.g., 4 decimals).  
     - **Weights** for OC vs. IC (default: equal weight if undecided).  

  ---

  #### **Meeting Procedure**  
  **Step 1: Calculate Observational Compressibility (OC)**  
  - **Objective calculation** (10 minutes).  
  - For each model:  
    - Compute `OC = L(model) + L(data | model)`.  
    - **Proxy**: Encode the model (equations/code) and its prediction errors (residuals) using the reference compressor.  
    - **Example**: `OC_A = len(gzip.compress(model_A_code)) + len(gzip.compress(residuals_A))`.  
  - **Stopping condition**: If one model’s OC is >20% smaller than rivals, recommend it and skip to Step 5.  
  - **Approximation breaks**: When residuals are chaotic (e.g., turbulent systems) or compressor biases dominate (e.g., gzip favors repetitive data).  

  **Step 2: Define Intervention Set**  
  - **Group judgment** (20 minutes).  
  - Select **3 interventions** from the candidate lists that:  
    - Are experimentally feasible.  
    - Maximize disagreement between models (e.g., interventions where models predict >10% divergence).  
  - **If no agreement**: Lab head chooses interventions.  
  - **Output**: Common intervention set \( I = \{I_1, I_2, I_3\} \).  

  **Step 3: Calculate Interventional Compressibility (IC)**  
  - **Objective calculation** (15 minutes).  
  - For each model:  
    - Generate predictions for all interventions in \( I \).  
    - Encode the **description of interventions + predictions** using the reference compressor.  
    - **Proxy**: `IC = len(gzip.compress(intervention_descriptions + predictions))`.  
  - **Why this works**: Models that specify simple, decisive experiments (e.g., "flip this switch") compress better than vague ones.  
  - **Approximation breaks**: When interventions are non-causal (e.g., in social systems) or predictions are probabilistic.  

  **Step 4: Combine OC and IC**  
  - **Objective calculation** (10 minutes).  
  - Compute a **total score**:  
    ```  
    Total = w_obs * (OC / OC_max) + w_int * (IC / IC_max)  
    ```  
    - \( OC_{\text{max}} \), \( IC_{\text{max}} \): Worst (longest) OC/IC among models.  
    - Weights \( w_{\text{obs}} \), \( w_{\text{int}} \) (default: 0.5 each).  
  - **Recommendation**:  
    - Model with **lowest Total** wins.  
    - If **Total difference < 5%**, declare a tie.  

  **Step 5: Handle Ambiguity**  
  - **Group judgment** (10 minutes).  
  - If tie or Total difference < 5%:  
    - Recommend gathering data for **one intervention** from \( I \) (prioritize cheapest/most decisive).  
    - Defer decision until next meeting.  
  - If models are equally compressible:  
    - Acknowledge the choice is subjective; lab head casts deciding vote.  

  **Step 6: Finalize and Report**  
  - **Objective** (5 minutes).  
  - Document:  
    - OC, IC, and Total scores.  
    - Reference compressor and weights used.  
    - Rationale for intervention set \( I \).  
  - Submit recommendation to lab head.  

  ---

  ### **Application to Cases**  
  #### **Case 1: Pendulum Experiment**  
  - **Model A**: Simple deterministic (1 parameter).  
  - **Model B**: Complex stochastic (2 parameters + noise; better fit).  
  - **Step 1 (OC)**:  
    - `OC_A` likely smaller (simpler model).  
    - `OC_B` larger (complex model) but shorter residuals (better fit).  
    - **Likely outcome**: OC favors A if data is sparse; B if data is abundant.  
  - **Step 2 (Interventions)**:  
    - \( I \): Vary pendulum length (L), mass (M), and initial angle (θ).  
  - **Step 3 (IC)**:  
    - **Model A**: Predictions are simple equations (e.g., \( T = 2\pi\sqrt{L/g} \)); compresses well.  
    - **Model B**: Predictions include noise distributions; compresses poorly.  
  - **Verdict**: If OC differences are small, **A wins** due to superior IC. Favors simplicity and testability.  

  #### **Case 2: Biological Network**  
  - **Model C**: Simple network (1 parameter; good fit).  
  - **Model D**: Complex theory-based network (fixed parameters; worse fit but accurate novel predictions).  
  - **Step 1 (OC)**:  
    - `OC_C` small (simple model, good fit).  
    - `OC_D` large (complex model, worse fit).  
  - **Step 2 (Interventions)**:  
    - \( I \) includes the novel intervention (e.g., "inhibit protein X").  
  - **Step 3 (IC)**:  
    - **Model C**: Struggles to predict novel interventions; ad-hoc adjustments → poor compression.  
    - **Model D**: Predictions follow from fixed theory; compresses well.  
  - **Verdict**: **D wins** decisively on IC. Highlights IC’s value for generalization.  

  #### **Case 3: The "Ugly" Model**  
  - **Scenario**: Model E (complex, unintuitive) wins on Total score, but the group dislikes it.  
  - **Procedure response**:  
    - Trust the scores. Recheck Steps 2–3:  
      - Were interventions poorly chosen?  
      - Did the compressor bias encoding (e.g., gzip favors E’s repetitive outputs)?  
    - If scores hold, **recommend E** but flag discomfort in the report.  
    - **Action**: Run an intervention to test E’s riskiest prediction. If E fails, it is falsified; else, accept it.  
  - **Philosophical note**: OC/IC rewards predictive power, not elegance. Discomfort may stem from prior biases (e.g., preferring linear models).  

  ---

  ### **Limits of the Procedure**  
  1. **What it cannot do**:  
     - **Create new models**: Only selects from rivals.  
     - **Handle non-causal systems**: IC assumes interventions are possible (fails in astronomy or economics).  
     - **Eliminate subjectivity**: Compressor choice, intervention set, and weights require judgment.  
     - **Override deep expertise**: If lab head rejects the recommendation, their experience may trump the procedure.  

  2. **When the OC/IC distinction breaks**:  
     - **Non-interventional systems**: IC reduces to OC if experiments are impossible (e.g., cosmology).  
     - **Adversarial settings**: Interventions may be gamed (e.g., policy models).  
     - **Infinite models**: OC/IC assumes finite contenders; undefined for open-ended hypotheses.  

  3. **Is IC just a prior for risky predictions?**  
     - Partly. IC favors models that make *simple, testable* predictions, which often align with "riskiness." But it is not arbitrary:  
       - **Test**: If a model’s interventions are complex to describe (e.g., "run 1,000 random experiments"), IC penalizes it.  
       - **Balance**: Weighting IC avoids overfitting to current data (OC’s flaw) but risks underfitting.  

  4. **Handling conflicts with the lab head**:  
     - **Procedure**: Lab head must justify rejection in writing (e.g., "scores ignore domain constraints").  
     - **Next step**: Run the disputed intervention to gather new data.  
     - **Long-term**: Refine weights/interventions based on past accuracy.  

  ---

  ### **Conclusion**  
  This procedure systematizes your insight: **OC rewards fitting existing data; IC rewards guiding future experiments**. By quantifying both, it avoids OC’s overfitting bias while formalizing the heuristic of "testability" that physicists intuitively use. It succeeds when interventions are well-defined and compressors are stable, but it cannot resolve deep uncertainties or replace seasoned judgment. In practice, it will favor models like your biological network (Case 2) that sacrifice OC for IC—a reflection of science’s priority on generalization over accommodation.  

  The lab head retains final authority, but the procedure ensures disagreements are documented and tested empirically—keeping the group honest, much like a well-designed experiment.
