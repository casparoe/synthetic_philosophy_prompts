answer: |-
  ## Prospectus: The Administrative Blindness of Desert-Based Welfare Conditionality

  **Working Title:** Conduct Without Desert: The Structural Mismatch in Welfare Sanction Regimes

  **Central Question:** To what extent do the inherent administrative limitations of welfare sanction regimes prevent them from reliably tracking the moral properties (specifically, desert based on intentions, capacity, and unwillingness) that purportedly justify them?

  *   **Explicit Choice Justification:** This question focuses on the *capability* of sanction regimes to track the moral properties central to desert-based justifications. It is chosen over alternatives for critical reasons:
      *   "What justifies conditionality?" is the well-trodden normative debate the user seeks to sidestep (reciprocity vs. desert vs. basic needs). This project examines the *feasibility* of implementing one prominent justification (desert) within actual administrative structures, a distinct and prior question.
      *   "Whether desert-based and conduct-based justifications come apart extensionally?" is a vital *consequence* of the chosen question. If administrative practice *cannot* track desert, then desert-based justifications *must* extensionally diverge from the conduct-based rules actually implemented. The chosen question (about capability) is the logically prior step that *explains why* such divergence occurs or is inevitable.
      *   This focus directly interrogates the core user hypothesis: that the mismatch is conceptual and inherent to administrative practice, not merely an epistemic shortfall. It centers the investigation on the structural constraints of bureaucracy.

  **Why the Question Remains Open:** Existing literature extensively debates *whether* desert justifies conditionality and *whether* reciprocity demands are fair. It also documents empirical effects of sanctions. However, it often assumes that administrative practices *can* (or could, with reform) adequately identify the "undeserving" based on desert criteria like culpable unwillingness. This project challenges that assumption head-on, arguing that the very nature of administrative systems (reliance on observable proxies, standardization, limited information, procedural constraints) creates an inherent barrier to accessing the morally relevant facts. Positions defending desert-based conditionality rarely grapple deeply with whether the administrative machinery can *operationalize* their moral categories. Critics focusing on punitive effects often don't explicitly articulate this structural incapacity as the root cause.

  **Method & Argumentative Sequence:** The project will proceed through conceptual and structural analysis:

  1.  **Defining the Terms & Practice:** Precisely define "desert-based justification" for welfare conditionality (focusing on culpable unwillingness or free-riding) and "administrative practice" of conditionality (emphasizing its reliance on observable, documentable conduct proxies like appointment attendance, form submission, job application logs).
  2.  **The Nature of Moral Desert:** Argue that desert in this context hinges crucially on internal states – *intention* to avoid work/deceive, *capacity* to comply (beyond basic physical/mental ability, including complex social/psychological barriers), and *unwillingness* (a choice not to act despite capacity). These are inherently private and context-dependent.
  3.  **The Nature of Administrative Tracking:** Demonstrate that welfare administration, by necessity, relies on standardized procedures, verifiable documentation, and observable behaviors ("conduct proxies"). It operates under constraints of time, resources, legal defensibility, and the need for consistent application across vast caseloads. It fundamentally lacks reliable access to intentions, true capacity nuances, and the complex reasons behind non-compliance.
  4.  **The Mismatch Thesis:** Argue that the reliance on conduct proxies creates a structural mismatch:
      *   Conduct proxies are not *necessary* for desert: Someone could be truly unwilling (undeserving) while flawlessly complying with administrative requirements (e.g., attending appointments but not genuinely seeking work).
      *   Conduct proxies are not *sufficient* for desert: Non-compliance often stems from factors invisible to the system (incapacity due to undocumented barriers, administrative errors, misunderstanding, complex life circumstances) rather than culpable unwillingness.
  5.  **Consequences for Desert Justifications:** Analyze the implications of this mismatch:
      *   Desert-based arguments, when translated into administrative rules, inevitably sanction people whose non-compliance does *not* reflect culpable unwillingness (false positives) and fail to sanction some whose compliance masks unwillingness (false negatives).
      *   Attempts to make desert-based justifications "work" administratively either (a) fail to justify the severity or automaticity of typical sanction regimes, as they cannot reliably identify the culpable, or (b) devolve into a different justification – often a crude form of reciprocity defined solely by rule-following, which condemns non-compliers *regardless* of reason, thus punishing many who are not truly "undeserving."
  6.  **Conceptual vs. Epistemic:** Defend the thesis that this is primarily a *conceptual* mismatch inherent in the nature of administrative systems tracking complex moral agency, not merely an *epistemic* shortfall solvable by better training, more resources, or improved assessment tools. While epistemic improvements are possible, they cannot bridge the fundamental gap between observable conduct and internal desert-grounding properties.

  **Possible Conclusions & Deciding Considerations:**

  1.  **Strong Mismatch (Likely Conclusion):** The structural limitations are fundamental and insurmountable; administrative sanction regimes *cannot* reliably track desert. Desert-based justifications are therefore administratively infeasible in practice. *Deciding considerations:* Strength of arguments about the inherent privacy of intentions/capacity, the necessity of standardization/proxies in large-scale administration, and the persistent evidence of sanctions falling on vulnerable populations despite desert rhetoric.
  2.  **Mitigated Mismatch:** While significant limitations exist, certain administrative reforms (e.g., highly individualized casework, qualitative assessments, significantly reduced caseloads) *could* allow for better, though still imperfect, approximation of desert in limited contexts. *Deciding considerations:* Evidence of programs achieving greater nuance, feasibility/cost of proposed reforms, and whether the resulting system still meaningfully constitutes a "sanction regime" as commonly understood.
  3.  **Epistemic Deficit:** The problem is primarily one of poor implementation; better administrative tools and practices *could* resolve the tracking issue. *Deciding considerations:* Existence of demonstrably reliable methods for ascertaining complex intentions/capacity/willingness in bureaucratic settings under real-world constraints.

  **Criteria for Project Failure (vs. Unwelcome Conclusion):** The project fails if:
  1.  It cannot convincingly establish that desert-based justifications *require* access to internal states like intention and true capacity/willingness.
  2.  It fails to demonstrate that administrative systems *necessarily* rely on conduct proxies and standardized procedures, or that these proxies are fundamentally inadequate indicators of the relevant moral properties.
  3.  It provides no clear argument distinguishing a *conceptual* mismatch from a severe but potentially solvable *epistemic* problem.
  4.  The core argument becomes indistinguishable from the well-rehearsed critique that sanctions *in fact* harm vulnerable people – without adding the distinct layer of *why* this happens systematically due to administrative structure, regardless of initial justification.

  Reaching the conclusion that the mismatch is primarily epistemic (Conclusion 3) would be unwelcome given the initial hypothesis but would not constitute failure if arrived at through rigorous argument demonstrating reliable tracking *is* administratively feasible.

  **Feasibility for One Semester (20 pages):** Yes. The project is tightly scoped:
  *   Focuses on *one* justification (desert) within conditionality.
  *   Centers on a specific *structural* argument about administrative capability, avoiding sprawling empirical data collection or a comprehensive history of welfare policy.
  *   Relies primarily on conceptual analysis of desert and administrative practice, supported by illustrative examples and engagement with the underlying logic of existing arguments about conditionality.
  *   The 20-page limit necessitates concision in setting up the problem and executing the core argumentative sequence, but the defined scope is realistic.
