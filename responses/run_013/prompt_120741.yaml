  ### Examination Question: Common Knowledge of Rationality and Backward Induction

  **Instructions:** Answer all parts of this question. The question is worth twenty-five marks. Write your answers in the provided booklet. Ensure your responses are precise and well-structured.

  #### The Game
  Consider the following three-node centipede game:
  - Player 1 moves first at node 1, choosing **Take (T1)** or **Pass (P1)**.  
    - **T1** ends the game with payoffs (1, 0).  
    - **P1** passes to Player 2.  
  - Player 2 moves at node 2, choosing **Take (T2)** or **Pass (P2)**.  
    - **T2** ends the game with payoffs (0, 2).  
    - **P2** passes to Player 1 at node 3.  
  - Player 1 moves at node 3, choosing **Take (T3)** or **Pass (P3)**.  
    - **T3** yields (3, 1).  
    - **P3** yields (2, 4).  

  **Perturbed Game:** Now modify the payoff for **P3** to (3, 4), so the final node payoffs are:  
  - **T3**: (3, 1)  
  - **P3**: (3, 4)  

  #### Tasks
  1. **Backward Induction and Aumann’s Theorem (8 marks)**  
     - Perform backward induction on the **original** game (with **P3** payoff (2, 4)). State the backward-induction path and outcome.  
     - Precisely state what Aumann’s theorem asserts about this game under common knowledge of rationality (CKR).  

  2. **Epistemic Models for the Perturbed Game (12 marks)**  
     Construct two distinct epistemic models for the **perturbed** game (with **P3** payoff (3, 4)). Each model must include:  
     - A state space of strategy profiles.  
     - A common prior probability distribution.  
     - Information partitions (cells) for each player over the state space.  
     - Specification of each player’s strategy in the profile and why it is sequentially rational given their information.  
     - Show that rationality is common knowledge in each model.  
     **Requirements:**  
     - In **Model A**, the backward-induction path (as defined by strict preference in the original game) is played.  
     - In **Model B**, a non-backward-induction path is played (specify the path).  
     *Note:* "Played" means the outcome occurs under the strategy profile in the actual state.  

  3. **Interpretation (5 marks)**  
     - Explain what the contrast between Model A and Model B shows about the role of the "no relevant ties" (genericity) assumption in Aumann’s theorem.  
     - Discuss why this result means Aumann’s theorem should **not** be interpreted as a description of the practical deliberative process players use to reason about the game.  

  ---

  ### Model Answer  
  **Total words:** ~700  

  #### Part 1: Backward Induction and Aumann’s Theorem  
  In the **original game** (with **P3** at (2, 4)):  
  - **Node 3**: Player 1 compares **T3** (payoff 3) and **P3** (payoff 2). Since 3 > 2, Player 1 chooses **T3**.  
  - **Node 2**: Player 2, anticipating **T3** at node 3, compares **T2** (payoff 2) and **P2** (leads to (3, 1), giving Player 2 payoff 1). Since 2 > 1, Player 2 chooses **T2**.  
  - **Node 1**: Player 1, anticipating **T2** at node 2, compares **T1** (payoff 1) and **P1** (leads to (0, 2), giving Player 1 payoff 0). Since 1 > 0, Player 1 chooses **T1**.  
  **Backward-induction path**: **T1** at node 1. **Outcome**: (1, 0).  

  **Aumann’s theorem** asserts that if the game structure, payoffs, and player rationality (defined as sequential expected utility maximization) are common knowledge, then the backward-induction outcome must occur. Here, CKR implies the outcome (1, 0).  

  #### Part 2: Epistemic Models for the Perturbed Game  
  In the **perturbed game**, Player 1 is indifferent at node 3 between **T3** and **P3** (both yield Player 1 a payoff of 3). Player strategies are:  
  - Player 1: Full strategies are **T1** (end at node 1), (**P1**, **T3**), or (**P1**, **P3**).  
  - Player 2: Strategies are **T2** or **P2**.  
  The state space Ω consists of strategy profiles:  
  - ω1: (**T1**, **T2**) → Outcome (1, 0)  
  - ω2: (**P1**, **T3**, **P2**) → Outcome (3, 1)  
  - ω3: (**P1**, **P3**, **P2**) → Outcome (3, 4)  

  **Model A (Backward-Induction Path Played)**  
  - **State space**: Ω = {ω1} (only one state).  
  - **Common prior**: P(ω1) = 1.  
  - **Information partitions**:  
    - Player 1: Partition is {{ω1}} (knows ω1).  
    - Player 2: Partition is {{ω1}} (knows ω1).  
  - **Strategies and sequential rationality**:  
    - Player 1: Plays **T1** in ω1. At node 1, **T1** gives 1. **P1** would lead to Player 2 playing **T2** (as per ω1), yielding Player 1 payoff 0. Since 1 > 0, **T1** is rational. Node 3 is unreachable.  
    - Player 2: Not called to move (since **T1** ends the game), so rationality holds vacuously.  
  - **CKR**: In ω1, both players are rational, and since only one state exists, rationality is common knowledge.  
  **Outcome**: (1, 0) (backward-induction path).  

  **Model B (Non-Backward-Induction Path Played)**  
  - **State space**: Ω = {ω3} (only one state).  
  - **Common prior**: P(ω3) = 1.  
  - **Information partitions**:  
    - Player 1: Partition is {{ω3}} (knows ω3).  
    - Player 2: Partition is {{ω3}} (knows ω3).  
  - **Strategies and sequential rationality**:  
    - Player 1: Plays (**P1**, **P3**) in ω3.  
      - At node 1: **T1** gives 1. **P1** leads to Player 2 playing **P2** (as per ω3), then to node 3 where **P3** gives Player 1 payoff 3. Since 3 > 1, **P1** is rational.  
      - At node 3: **T3** and **P3** both yield Player 1 payoff 3, so **P3** is rational (indifference).  
    - Player 2: Plays **P2** in ω3. At node 2, **T2** gives 2. **P2** leads to Player 1 playing **P3** (as per ω3), yielding Player 2 payoff 4. Since 4 > 2, **P2** is rational.  
  - **CKR**: In ω3, both players are rational at all nodes, and rationality is common knowledge.  
  **Outcome**: (3, 4) (path: **P1** at node 1, **P2** at node 2, **P3** at node 3). This is not the backward-induction path (which requires **T1** at node 1).  

  #### Part 3: Interpretation  
  The contrast between Model A and Model B highlights that the **genericity assumption** (no ties in payoffs) is essential for Aumann’s theorem to imply a unique outcome. In the original game, payoffs are generic (strict inequalities), so CKR forces the backward-induction path. In the perturbed game, a tie at node 3 breaks uniqueness: CKR is compatible with multiple outcomes (e.g., (1, 0) or (3, 4)), as players can rationally "resolve" indifference in ways that support different paths. Thus, the theorem relies on genericity to ensure backward induction’s predictive power.  

  This shows Aumann’s theorem should **not** be seen as a model of practical deliberation. The theorem is a **consistency result**: it proves that CKR *implies* the backward-induction outcome in generic games, but it does not describe *how* players reason to that outcome (e.g., via step-by-step backward induction). Deliberation involves dynamic belief formation, while the theorem assumes fixed CKR from the start. In nongeneric games, multiple outcomes satisfy CKR, so deliberation could lead to any rationalizable path, not necessarily backward induction. The theorem is thus a limit on what is possible under CKR, not a normative account of reasoning.  

