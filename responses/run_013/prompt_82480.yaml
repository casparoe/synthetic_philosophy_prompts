prompt: |-
  I TA intro bio and I close every tutorial with a five-minute alive-or-not game — I name something, they vote, I give the verdict. They've started keeping a tally of my calls so I cant flip-flop, and here's the list so far: flu virus, not alive. prion, not alive. viroid, not alive. plasmid, not alive. E. coli, alive. a tardigrade that's been dried out for years, alive. a mule, alive. a lichen, alive. a candle flame, not alive. a computer virus, not alive.

  Next week I've got two I genuinly can't call and I don't want to wing it in front of them. First, the facial tumour that's been spreading between Tasmanian devils for a few decades now — dogs have one too, it passes animal to animal like an infection. It's made of cells, it grows, it's picked up its own mutations and keeps changing as it spreads, and it'll keep growing in whatever devil it lands in. But it's also basically a runaway clone of one devil's own cells that got out. Second, a test tube of RNA I read about, where the molecules catalyse the copying of more of themselves and the whole thing just keeps going indefinitely — no membrane, no cell, and nothing I'd call metabolism except the copying reaction itself.

  So: what do I say, and more to the point, what rule have I actually been running? I'm fairly sure more than one rule fits every call on that list, so give me the main candidates, what each one says about those two cases, which one I should go with and why, and what I could put in front of them the week after that would actually settle it. Also, one of them keeps insisting the real rule is just that if it evolves by natural selection it's alive — does that fit my list or not?
reasoning: |-
  Okay, let me break down this TA's problem. They've been running a "alive-or-not" game in biology tutorials, and now students are tracking their decisions. The two upcoming cases are tricky: a transmissible Tasmanian devil facial tumor and self-replicating RNA in a test tube. The TA needs a consistent biological definition of life that fits all previous judgments and can handle these edge cases.

  First, I need to recall standard definitions of life. Biology textbooks often list characteristics like homeostasis, organization, metabolism, growth, adaptation, response to stimuli, and reproduction. But these criteria get fuzzy at the margins. The student who suggests evolution by natural selection as the key might be onto something - that's a common contender for the fundamental requirement.

  Looking at the TA's existing calls: all infectious agents without cells (viruses, prions, viroids) were deemed not alive, while cellular organisms (E. coli, tardigrades) and complex biological systems (mules, lichens) were alive. Non-biological examples (candle flames, computer viruses) were rejected. This pattern suggests the TA might be implicitly requiring cellular structure or autonomous metabolism.

  For the tumor case, it's literally living cells - but divorced from the organism they came from. The RNA molecules replicate but lack any cellular structure. If evolution is the criterion, both might qualify: the tumor evolves through natural selection in host populations, and the RNA undergoes mutation and selection in the test tube. But that would make them "alive" - contradicting the TA's previous pattern of rejecting acellular entities.

  I should consider NASA's definition ("a self-sustaining chemical system capable of Darwinian evolution") which explicitly includes evolution. But under that, the RNA system would be alive while the tumor might not qualify as "self-sustaining" without hosts. The tumor raises questions about individuality - it's more like a parasitic cell line than an independent organism.

  Perhaps the TA has been using a composite definition requiring multiple characteristics. For example: being cellular + having metabolism + capable of evolution. That would exclude the RNA (not cellular) and the tumor (no independent metabolism), maintaining consistency with previous not-alive verdicts for acellular entities. It would also explain why dried tardigrades are alive (they regain function when rehydrated) while the tumor isn't an independent life form.

  For next week, I'd recommend sticking with "not alive" for both, using the cellularity + metabolism standard. To settle the debate, they could present a case that separates competing definitions - like a synthetic protocell with metabolism but no evolution, or bacterial spores with no metabolism. That would force students to decide which criteria matter most.

  The evolution-only definition doesn't fit the TA's list because it would require calling viruses "alive" - which the TA explicitly didn't. So that student's suggestion, while interesting, contradicts the established pattern.
answer: |-
  Based on your consistent rulings and the borderline cases you're facing, your implicit "rule for life" appears to be a **modified cellular/organismal definition**, likely requiring **cellular structure + autonomous metabolism + the capacity for replication/heredity (within a lineage)**. Here's the breakdown:

  ### Your Implicit Rule (Best Fit)
  *   **Definition:** *A living entity must be a bounded, metabolically active cellular unit (or a cooperative group of such units forming an organism) capable of replication, heredity, and responding to its environment. It must function as an integrated whole.*
  *   **Why it fits your list:**
      *   **Not Alive (Flu, Prion, Viroid, Plasmid):** Lack cellular structure and autonomous metabolism (rely entirely on host).
      *   **Not Alive (Candle Flame):** Lacks cellular structure, heredity, and isn't a bounded, integrated chemical system.
      *   **Not Alive (Computer Virus):** Not a chemical system, lacks metabolism/heredity in a biological sense.
      *   **Alive (E. coli):** Single-celled organism with metabolism, replication, heredity.
      *   **Alive (Dried Tardigrade):** Intact cellular structure in cryptobiosis; metabolism/reactivates autonomously upon rehydration. *Still an organism.*
      *   **Alive (Mule):** Multicellular organism (cooperative cells) with metabolism, response; sterility is a reproductive dead end, but it's *still* a functioning organism.
      *   **Alive (Lichen):** Symbiotic multicellular *organism* (fungus + alga/cyanobacterium) with integrated metabolism, growth, reproduction.

  ### Main Candidate Definitions & The Edge Cases

  1.  **Cellular/Organismal Definition (Your Likely Rule):**
      *   **Tasmanian Devil Facial Tumor (DFTD):** **NOT ALIVE.** *Why:* While made of cells and evolving, it is **not an autonomous organism**. It lacks its own integrated metabolism independent of its host devil. It's a parasitic *population* of host-derived cells, not a distinct, bounded, self-sustaining entity. It's more akin to a rogue tissue culture.
      *   **Self-Replicating RNA:** **NOT ALIVE.** *Why:* Lacks cellular structure, lacks metabolism (beyond the specific catalytic copying reaction), lacks any boundedness or integrated system for homeostasis or environmental response. It's a self-perpetuating *chemical reaction system*, not an organism.

  2.  **NASA "Darwinian Evolution" Definition:** ("*A self-sustaining chemical system capable of undergoing Darwinian evolution*")
      *   **Tasmanian Devil Facial Tumor (DFTD):** **ARGUABLY ALIVE.** *Why:* It is a chemical system (cells), sustains itself (using host resources), and demonstrably undergoes Darwinian evolution (mutations arise, selection acts via transmission success and host immune evasion). *Counter:* Is it truly "self-sustaining"? It relies entirely on the host's body and metabolism.
      *   **Self-Replicating RNA:** **ARGUABLY ALIVE.** *Why:* It's a chemical system that sustains its own replication. In a selective environment (e.g., limited resources, mutation), variants with faster replication or better stability *would* be selected for – it's capable of undergoing Darwinian evolution.
      *   *Problem:* This definition would force you to call *viruses* alive (they evolve!), contradicting your past rulings (flu virus = not alive).

  3.  **"Biological Activity" (Metabolism + Replication):**
      *   **Tasmanian Devil Facial Tumor (DFTD):** **ALIVE.** *Why:* Composed of metabolically active cells that replicate.
      *   **Self-Replicating RNA:** **NOT ALIVE.** *Why:* Lacks metabolism (in the typical sense of energy conversion and biosynthesis) and cellular structure. Pure replication isn't sufficient.
      *   *Problem:* Makes DFTD alive, but contradicts your consistent pattern of calling *acellular* replicators (viruses, etc.) *not* alive. Also, sterile mules have metabolism but not replication.

  4.  **The "Evolves by Natural Selection" Rule (Student's Suggestion):**
      *   **Fits?** **NO, it does NOT fit your list consistently.**
      *   *Why:* By this rule, **viruses, viroids, and prions** *should be alive* because they evolve via natural selection (e.g., flu virus evolves antigenic drift/shift, viroids mutate/adapt). You called them **not alive**. This rule would also make the **DFTD** and the **Self-Replicating RNA** **alive**, and potentially even **computer viruses** if simulated evolution occurs. It's too broad for your established precedent.

  ### Recommendation: What to Say & Why

  *   **Stick with your implicit Cellular/Organismal Definition.** It provides the most consistent explanation for all your past rulings and avoids the contradictions inherent in the pure "evolution" rule.
  *   **For DFTD:** "**Not alive.** While it's made of living cells and evolves, it isn't its own independent organism. It's a parasitic growth entirely dependent on the metabolism and body of its Tasmanian devil host. Think of it like a tissue culture that escaped the lab – it's made of living material but isn't a distinct life form itself. Just like a plasmid relies on a bacterium, this tumor relies on the devil."
  *   **For Self-Replicating RNA:** "**Not alive.** Fascinating chemistry, but no cell, no metabolism beyond copying itself, no way to regulate its internal environment or respond as an integrated unit. It's a self-propagating reaction, like a fire or a crystal growing, not an organism."
  *   **The Rule:** "Looking at our list, the pattern seems to be that for something to be considered alive *in this game*, it needs to be a **bounded, cellular unit (or a cooperative group of cells forming an organism) that actively maintains itself through metabolism, can replicate or be part of a replicating lineage, and responds to its environment.** That's why viruses, plasmids, flames, and computer code aren't alive – they lack key parts of that package. The dried tardigrade? It's a paused organism. The tumor? It's a runaway clone, not an independent organism. The RNA? Amazing chemistry, but no cell, no organism."

  ### To Settle It: The Perfect Test Case Next Week

  Present **Bacterial Endospores** (e.g., *Bacillus* or *Clostridium* spores).

  *   **Why it settles the debate between Cellular/Organismal vs. NASA Evolution definitions:**
      *   **Cellular Structure?** YES (highly modified, dormant cell).
      *   **Autonomous Metabolism?** NO (effectively zero metabolic activity, no energy production/use).
      *   **Capable of Replication?** NO (cannot replicate *as a spore*; must germinate back into a vegetative cell first).
      *   **Capable of Darwinian Evolution?** NO (no replication = no heritable variation, no selection acting on the spore form itself. Evolution acts on the *vegetative population*).
      *   **Responds to Environment?** YES, in a limited way (germinates when conditions are right).
      *   **Heredity?** YES (contains the genome, passed to the new vegetative cell).
  *   **Under Cellular/Organismal:** **ALIVE.** It is a dormant *stage* in the life cycle of a cellular organism. It retains the *potential* for autonomous metabolism and replication upon germination. It's a bounded, protected cellular unit integral to the organism's survival strategy.
  *   **Under NASA Evolution:** **NOT ALIVE.** While it contains the information, it is not *currently* a "self-sustaining chemical system" (no metabolism) nor *currently* "capable of undergoing Darwinian evolution" (no replication). It's a survival structure, not an evolving system itself.
  *   **Your Call (Consistent with Past):** **ALIVE.** It's a dormant bacterium, an organism in suspended animation, not fundamentally different in kind from the dried tardigrade. This reinforces the organismal view over the strict "current Darwinian evolution" view.

  This test case forces a discussion about whether life requires *current, active* metabolism/evolution (NASA) or if dormant *stages* of organisms still qualify as alive (Cellular/Organismal). Choosing "alive" for the spore solidifies your established pattern. Choosing "not alive" would be a major shift aligning with the NASA definition but contradicting your dried tardigrade call.
