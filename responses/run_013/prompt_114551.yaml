   Example: A simple system that is non-invertible and chaotic.

   Consider a discrete-time dynamical system on the real line. We can use a tent map or a logistic map at the parameter value where it becomes non-invertible (e.g., the logistic map at r=4). However, note that the logistic map at r=4 is chaotic and non-invertible: each point (except the critical point) has two preimages. But note: the forward evolution is deterministic: one state leads to one next state. However, backward evolution is not unique: one state has two preimages.

