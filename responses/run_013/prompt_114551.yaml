answer: |-
  ### Thought Experiment: The Logistic Demon

  **System**: A discrete-time dynamical system governed by the logistic map at parameter \(r = 4\):  
  \[ x_{n+1} = f(x_n) = 4x_n(1 - x_n) \]  
  **State**: A single real number \(x \in [0, 1]\), representing the system's condition at step \(n\).  
  **What the demon knows**: At step \(n\), the demon knows the exact present state \(x_n\) and the exact law \(f\).  

  #### Dynamics
  - **Forward evolution (future)**: From \(x_n\), the demon computes \(x_{n+1} = f(x_n)\), then \(x_{n+2} = f(x_{n+1})\), and so on. The future is **uniquely determined** because \(f\) is a single-valued function.  
  - **Backward evolution (past)**: To find \(x_{n-1}\), the demon solves \(x_n = f(x_{n-1})\). The equation \(x_n = 4x_{n-1}(1 - x_{n-1})\) is quadratic and has **two solutions**:  
    \[ x_{n-1} = \frac{1 \pm \sqrt{1 - x_n}}{2} \]  
    Both are valid in \([0, 1]\) (except at \(x_n = 1\)), so the past is **not uniquely determined**.  
  - **Chaos**: The map has sensitive dependence: Lyapunov exponent \(\lambda = \ln 2 > 0\). Tiny errors in \(x_n\) double at each step, making long-term prediction **unpredictable in practice**, despite being fixed in principle.  

  #### Where Retrodiction Fails Mechanically
  1. **Present (step \(n\))**: Demon knows \(x_n\) exactly.  
  2. **Future computation**: Applies \(f\) iteratively. Each step is deterministic: \(x_{n+k} = f^k(x_n)\).  
  3. **Past computation**: Solves \(x_n = f(x_{n-1})\). The quadratic equation has **two preimages**. The demon cannot resolve which was the true \(x_{n-1}\)—even with perfect knowledge.  
  4. **Further past**: Each candidate \(x_{n-1}\) has two preimages, branching into a tree of possibilities. The past is **indeterminate** from \(x_n\).  

  #### Key Feature and Its Role
  - **Feature**: Non-invertibility of \(f\) (not injective).  
  - **Effect**:  
    - **Fixed future**: Preserved. \(f\) is a function (single output).  
    - **Unpredictable future**: Preserved. Chaos relies on sensitivity, not invertibility.  
    - **Unfixed past**: Destroyed. If \(f\) is swapped for an invertible map (e.g., the **baker's map**), the past becomes unique.  
    - *Test swap*: Use the invertible baker's map. Future remains fixed and chaotic, but past is now uniquely determined.  

  #### Addressing the Complaint  
  **Complaint**: "Determinism requires the past to be fixed by the present, just like the future. Otherwise, the state is incomplete or the dynamics are broken."  
  **Response**:  
  - Your case satisfies **forward determinism**: Given state \(x_n\), every future state \(x_{n+k}\) (\(k>0\)) is uniquely determined.  
  - It violates **bidirectional determinism**: Given \(x_n\), past states \(x_{n-k}\) are not unique.  
  - **Why it's not a cheap trick**: The state is complete (a single real number), and the dynamics are fundamental (not coarse-grained). Non-invertibility is intrinsic: \(x_n\) **erases information** (e.g., if \(x_{n-1} = 0.2\) or \(0.8\), both yield \(x_n = 0.64\)). Physical laws need not be invertible; this system drops that assumption explicitly.  

  **Conclusion**: The logistic map demonstrates **forward determinism with backward indeterminism**, plus chaos, in a minimal, tight model. Non-invertibility is the engine, and the complaint confuses two distinct definitions of determinism.
