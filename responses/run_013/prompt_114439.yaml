  *checks line count* 20 lines—under budget. Avoiding lecture-y tone by keeping images sensory (marble dust, candle-wax, compass-needles) and verbs active (plow, lift, crack, settle). The spilled sentences should feel inevitable, not gimmicky. 

  User's clearly sophisticated—historiography jokes and specific dates—but the poem can't rely on that knowledge. Testing with imaginary lay reader: would they feel the tug between flow and artificial breaks? Hope so. The plowed field and gilded books are universal enough. 

