  ## The Ethics of Distance: Historians at Loggerheads

  *(The bustling conference hall hums with conversation. Dr. Elena Aris, mid-50s, sharp eyes behind stylish glasses, refills her coffee near a poster display. Dr. Marcus Vance, late 40s, energetic and slightly rumpled, approaches.)*

  **Marcus Vance:** Elena! Just caught the tail end of your paper. Compelling stuff on the Minoans. Though, I must say, that bit about the ritual sacrifices being 'culturally intelligible'... it still feels like dodging the hard question.

  **Elena Aris:** Marcus, good to see you. Dodging? Hardly. It’s precisely *because* it’s hard that we need Williams’s ‘relativism of distance’. Those sacrifices *were* intelligible *to them*, within their cosmology, their understanding of reciprocity with the divine, the very fabric of reality. Judging them by *our* secular, individualist morality is like grading a fish on its tree-climbing. It’s not just unfair; it’s fundamentally *mistaken*. They weren’t failing *our* test; they were living a different life entirely, one we cannot seriously imagine occupying. Our moral concepts simply don’t get traction there.

  **Marcus Vance:** I understand the appeal of that distance, Elena, truly. The desire for pure, objective understanding. But here’s my strongest pushback: You say we shouldn’t judge. But the moment you choose *what* to study about those sacrifices – the ritual context, the priestly hierarchy, the economic implications – you’re already wielding modern tools. ‘Religion’, ‘economy’, ‘social structure’ – these aren’t self-evident, universal categories plucked from the Minoan ether. They’re *our* analytical constructs. Even calling it ‘sacrifice’ rather than, say, ‘divine sustenance protocol’ carries baggage. The historian’s toolkit *is* forged in the present. Claiming neutrality while using those tools *is* a form of judgment by stealth – a judgment that their framework fits *our* modern analytical boxes.

  **Elena Aris:** *(Nods thoughtfully)* That’s a powerful point, Marcus. The categories *are* ours. I concede that completely. We inevitably view the past through a lens ground in our time. But Williams’s insight isn’t about achieving impossible objectivity; it’s about recognizing a *qualitative* difference. Yes, we use ‘religion’, but when we study Bronze Age Crete, we’re dealing with a society whose entire *Lebenswelt* – their world of meaning – is so radically alien that our modern moral outrage, focused on individual rights and bodily autonomy, becomes anachronistic noise. Our judgment lacks *purchase* because that society isn't a 'live option' competing with ours. We can describe, analyze, contextualize its values without needing to pronounce them 'evil' by our standards. Isn't the task to recover *their* sense of the good, however different?

  **Marcus Vance:** I agree that crude, unthinking condemnation shuts down understanding. *(Concedes)* And Williams is right that simply labeling the past 'barbaric' is lazy and unhistorical. Where we differ is this: you see recovering *their* sense of the good as the *alternative* to judgment. I see it as a *prerequisite* for *responsible* judgment. Understanding the Minoan worldview is essential. But once I truly grasp that worldview – that they believed sacrificing youths appeased gods and prevented earthquakes – am I really required to suspend my own conviction that killing children is profoundly wrong? Isn't that conviction part of *why* I find the practice horrifyingly fascinating? Denying it feels dishonest. The choice isn't *whether* I judge, but *how*: consciously, transparently, grounded in deep contextual understanding, or pretending my modern values aren't there while they invisibly shape every question I ask and every category I use.

  **Elena Aris:** But Marcus, doesn’t that ‘responsible judgment’ ultimately collapse back into presentism? Doesn’t saying ‘killing children is *always* wrong’ impose a transhistorical moral standard you claim doesn’t exist? If morality is historically contingent, as our tools suggest, how can *your* judgment claim any more universal validity than the Minoan priest’s? My approach avoids that hubris. It allows the past its radical difference without demanding it conform or be condemned. Our moral concepts evolved *from* such worlds; judging them by the endpoint denies their role in the very process that produced us.

  **Marcus Vance:** I don’t claim my judgment is *universally* valid, Elena. I claim it’s *inescapably mine*, grounded in the values of my time and place, which include a deep commitment to human rights and individual dignity shaped by centuries of philosophical and political struggle – struggle *against* practices like ritual sacrifice. My judgment is historical too! It reflects *my* context. Pretending I can shed that skin to achieve your kind of pure contextualism is the *real* illusion. It smuggles in the idea of a neutral, value-free historical science that doesn't exist. We judge by stealth when we pretend we don't judge at all. Better to be honest: understand deeply, contextualize rigorously, *and* acknowledge the moral perspective my own historical moment forces upon me.

  **(A brief pause hangs between them, the conference buzz filling the space.)**

  **Elena Aris:** So, we remain at an impasse. You see honesty in acknowledging unavoidable judgment; I see intellectual integrity in resisting anachronism through the relativism of distance. Perhaps the only concession left is mutual respect for the difficulty?

  **Marcus Vance:** *(Smiles wryly)* And another coffee. Till the next panel, Elena.

  **Verdict:**

  The dialogue suggests **Marcus Vance’s position is ultimately more defensible.** His core argument – that the historian’s very tools and categories are inescapably modern, making complete moral neutrality an illusion – is compelling. Pretending we don't judge while using modern frameworks *is* a form of judgment by stealth. Vance rightly insists on transparency and self-awareness about the historian's situated perspective.

  **What Elena Aris (and Bernard Williams) nevertheless get right** is crucial: crude, uninformed moral condemnation *is* bad history. Williams' "relativism of distance" provides an essential corrective against anachronism and hubris. It forces the deep, empathetic engagement with past worldviews that Vance himself requires for *responsible* judgment. Aris is correct that past societies can be profoundly alien "non-live options," and judging them *without* this deep contextual understanding is indeed meaningless and unfair. Her emphasis on recovering the past's own standards remains a vital historical imperative, even if complete moral detachment is unattainable.
