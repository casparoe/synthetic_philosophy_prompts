  First, I need to parse the layers here. The user isn't just asking for definitions—they want to understand the philosophical assumptions baked into regulatory practices, and how Keynes would challenge them. Their friend represents the mainstream view that probability modeling makes uncertainty manageable, while they side with Keynes's skepticism. 

