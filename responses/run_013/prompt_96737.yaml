answer: |-
  You've hit on a profound and fascinating phenomenon that sits at the intersection of perception, cognition, linguistics, and semiotics. It's absolutely fundamental to how we recognize symbols, objects, and patterns. While there isn't a single, universally agreed-upon "word" that encapsulates *every* nuance you describe, the core concept has several closely related terms and frameworks. Let's break it down:

  1.  **Distinctive Features (Linguistics/Semiotics):**
      *   **Definition:** The minimal set of binary (present/absent) or multivalued properties that distinguish one linguistic unit (like a phoneme or grapheme) from another within a system.
      *   **Relevance:** This is the *closest* established term. In phonology, changing one distinctive feature (e.g., voicing: /t/ vs /d/) changes the meaning. In graphemes (letters), features like "enclosed counter" (a vs o), "vertical stem position" (a vs d), "horizontal bar" (e vs c), "ascender" (d vs a), "descender" (p vs o), "diagonal" (k vs h), "symmetry" (m vs n), etc., function similarly.
      *   **Captures:** The discrete, binary, contrastive nature of the critical switches. Explains why flipping one turns 'a' into 'd' or 'o'.
      *   **Falls Short:** Primarily used for linguistic units. Doesn't inherently emphasize the *non-saliency* of these features compared to the variable stylistic ones. Also, focuses more on the *system* of contrasts than the perceptual/cognitive *process* of recognition.

  2.  **Invariants (Perception/Cognition - Gibsonian Ecological Psychology):**
      *   **Definition:** The properties of an object or pattern that remain constant despite changes in viewpoint, context, or superficial transformation, allowing for recognition.
      *   **Relevance:** Explains why we recognize an 'a' in vastly different styles, fonts, sizes, or even handwritten scribbles. The "invariants" are the critical topological or relational features you identified.
      *   **Captures:** The core, unchanging essence that survives stylistic variation. Explains the robustness across fonts or kazoo renditions.
      *   **Falls Short:** Doesn't inherently specify that these invariants are often discrete, binary switches or that they are less salient than the varying properties. "Invariant" can be a bit broad.

  3.  **Critical Features / Diagnostic Features (Pattern Recognition/Cognitive Psychology):**
      *   **Definition:** The specific, often minimal, features necessary and sufficient for accurate identification or categorization of a pattern or object.
      *   **Relevance:** Directly addresses the "load-bearing" features you identified. Closing the loop *is* critical for distinguishing a single-story 'a' from an 'o' or 'd'. The position of the bowl relative to the stem *is* critical.
      *   **Captures:** The idea of essential, defining elements. Focuses on what *must* be present/arranged correctly for recognition.
      *   **Falls Short:** Doesn't inherently emphasize the binary/switch-like nature or their contrast with highly salient but non-critical stylistic features. Can sometimes imply a single feature rather than a small set.

  4.  **Topological Features / Structural Invariants (Visual Perception/Cognitive Science):**
      *   **Definition:** Features relating to the *connectivity*, *containment*, *closure*, *order of intersection*, and *relative positioning* of parts (e.g., holes, loops, stems touching or not, parts inside/outside). These are often more robust to distortion than precise metric properties (size, angle).
      *   **Relevance:** Explains *why* the critical features are often about holes being open/closed (a vs d), strokes connecting/disconnecting (e vs c), loops being on specific sides (a vs d), or containment (n vs h). These are fundamental topological properties.
      *   **Captures:** The nature of the "switches" themselves – connectivity, enclosure, adjacency. Explains why the stem crossing the bowl matters topologically.
      *   **Falls Short:** A bit more technical. While it describes the *type* of feature, it doesn't explicitly bundle the concept with the contrast against freely varying stylistic features.

  **Synthesizing a Definition & Name:**

  The phenomenon you're describing is best understood as the reliance on a **small set of discrete, critical, often topological distinctive features that define the categorical identity of a symbol or object within a system, while a wide range of salient stylistic or metric features can vary freely without compromising recognition.**

  **Proposed Term:** **Categorical Distinctive Features (CDFs)** or **Identity-Critical Binary Invariants (ICBIs)**.

  *   **Why "Categorical":** It emphasizes that these features define membership in a specific category (the letter 'a', the tune 'Happy Birthday', a chess knight).
  *   **Why "Distinctive":** Highlights their role in *contrasting* one category from similar others within the system (a vs d, C-major vs C-minor, knight vs bishop).
  *   **Why "Binary Invariants":** Emphasizes their discrete (on/off) nature and their stability across variations (invariance).
  *   **Why "Identity-Critical":** Stresses that altering these features fundamentally changes the perceived identity.

  **Carving the Phenomenon - What it IS and IS NOT:**

  1.  **IS:** A set of **discrete, binary, or categorical features** (hole open/closed, stroke connected/disconnected, loop left/right, specific interval size).
  2.  **IS:** Features that are **critical for distinguishing the category** from its nearest neighbors within the relevant system (the alphabet, a musical key, the chess piece set).
  3.  **IS:** Features that often relate to **topological structure, connectivity, containment, and fundamental relationships** between parts.
  4.  **IS:** Features that are **frequently non-salient or less attended to** compared to stylistic variations (weight, proportion, ornamentation, timbre, material, surface detail).
  5.  **IS:** Features that **remain invariant** across a wide range of stylistic, metric, and contextual transformations.
  6.  **IS NOT:** The most salient or noticeable features (which are often free to vary).
  7.  **IS NOT:** About overall similarity or "family resemblance" in a fuzzy way. While family resemblance exists for style, **categorical identity has hard boundaries defined by CDFs**. A fuzzy 'a' is still an 'a'; a precisely drawn 'd' masquerading as an 'a' is not.
  8.  **IS NOT:** Solely about contrast with neighbors, though that's crucial. It's about the *specific minimal features* that *create* that necessary contrast.
  9.  **IS NOT:** Universal essentialism. The "essence" is defined by the *system* (the alphabet, musical tradition, chess rules) and human perceptual/cognitive biases.

  **The Boundaries - Universality vs. Subjectivity:**

  *   **System Dependence:** The *specific set* of CDFs is defined by the system. The critical features for distinguishing 'a' from 'd' are inherent to the Latin alphabet system. A different writing system (e.g., Cyrillic, Hangul) has its own set of critical distinctions.
  *   **Perceptual & Cognitive Biases:** Humans are wired to be sensitive to certain topological features (closure, connectivity) and relational properties. This biases which features *become* the critical ones. Our auditory system is tuned to relative pitch intervals, making them critical for melody recognition.
  *   **Learning & Context:** While the core CDFs for highly familiar categories like Latin letters are remarkably stable across individuals (due to shared learning and system constraints), there *can* be variation, especially with:
      *   **Novelty/Ambiguity:** For unfamiliar symbols or highly abstracted forms, people might rely on slightly different cues initially.
      *   **Stylistic Extremes:** In very distorted or experimental typography, the boundaries can blur, and people might disagree momentarily until context clarifies.
      *   **Cultural Variation:** While the Latin alphabet's core features are largely stable, subtle differences in handwriting norms might make certain features *more or less* critical in specific contexts (e.g., the exact way a loop closes in cursive).
  *   **"Load-Bearing" Features:** For highly stable systems like the alphabet or chess pieces, there is overwhelming agreement on which features are identity-critical. Disagreement is more likely at the stylistic fringes or with ambiguous forms, *not* about the core switch that flips 'a' to 'd'. If two people disagree fundamentally on that switch, one is likely misinformed about the system.

  **In Summary:**

  You've identified a core principle of symbolic representation and categorization: identity hinges on a **small set of discrete, system-defined, often topological, distinctive features** (Categorical Distinctive Features). These act like binary switches. Flip one, and you change categories. Meanwhile, a vast array of **salient stylistic features** can be stretched, squeezed, decorated, and transformed endlessly without breaking recognition, as long as those critical switches remain in their correct state. This explains the magic and frustration of type design, the recognizability of a melody through distortion, and the abstract blob that is still undeniably a chess knight. The phenomenon is robust and largely universal within a given system, rooted in how our perception extracts invariant structure from variable appearances.
