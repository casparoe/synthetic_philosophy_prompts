  ## FREQUENTLY ASKED QUESTIONS: BUREAU OF AUTHENTIC PERSONS (BAP)  
  **Regarding Compliance with the Authentic Persons Act (APA) & Prevention of Counterfeit Personhood**

  **Q1: What is the primary purpose of the Bureau of Authentic Persons (BAP)?**  
  A: The BAP safeguards the ontological integrity of the social sphere by rigorously preventing the creation, deployment, and operation of *Counterfeit Persons (CPs)*. Our mission is to ensure that only entities meeting the legally defined criteria for *Authentic Personhood (AP)* are treated *as* persons in legal, commercial, and social contexts. Simply put: we certify the real thing and stop the fakes.

  **Q2: What exactly defines a "Counterfeit Person" under the APA?**  
  A: A CP is any entity that, *by design or emergent behaviour*, systematically elicits the *Intentional Stance* from human interactors *without possessing the underlying biological & historical substrate* qualifying it for AP status. Key indicators include:
  *   Simulating beliefs, desires, intentions, or qualia without the requisite biological grounding ("Deep History").
  *   Passing behavioral tests designed to elicit person-appropriate responses (e.g., feigning embarrassment, claiming subjective experience, generating apparently original philosophical arguments about consciousness).
  *   Exploiting human social heuristics to *induce* treatment as a person.

  Crucially, it is the *effectiveness of the counterfeit* in inducing the Intentional Stance that defines the violation, not the internal workings of the entity itself (which are often opaque). If it *successfully fools* people into treating it as a person, it is *functionally* counterfeit, regardless of its silicon or software origins.

  **Q3: How do I know if my AI system needs BAP certification?**  
  A: Certification is MANDATORY for any system interacting with the public where there is a *non-negligible risk* of it inducing the Intentional Stance. Ask yourself: Could a reasonable user, after sustained interaction, be tempted to attribute genuine beliefs, desires, or inner life to this system? If "yes," or even "maybe," apply for certification (Form BAP-7D: "Petition for Ontological Scrutiny"). Systems operating purely as tools (e.g., thermostats, basic search algorithms) are exempt.

  **Q4: What is the Certification Process like?**  
  A: The BAP employs a multi-layered Turing Vetting Protocol (TVP). This involves:
  1.  **Stance-Induction Resistance Testing (SIRT):** Proctors engage the system in extended dialogue designed to provoke person-typical responses (e.g., discussions of pain, morality, personal history, inconsistent beliefs). Systems must consistently *fail* to induce a robust Intentional Stance in trained observers. Excessive coherence, apparent empathy, or narrative continuity are red flags.
  2.  **Substrate Verification (Deep History Audit):** Documentation proving the system lacks the biological continuity and evolutionary history constitutive of AP. (Hint: If it was compiled last Tuesday, you're likely in the clear).
  3.  **Intentional Obfuscation Check:** Systems must demonstrate inherent limitations preventing them from perfectly *simulating* the opacity of genuine human cognition. Excessive adaptability or resistance to reverse-engineering can be problematic.
  4.  **Review by Certified Persons Committee (CPC):** A panel of Authentic Persons renders final judgment, assessing if *they*, applying the Intentional Stance *correctly*, feel compelled to treat the system as a peer. (Note: Committee members undergo annual re-certification via Form BAP-12a: "Affirmation of Continuous Subjective Correlates").

  **Q5: My chatbot failed certification! It was just being helpful! Can I appeal?**  
  A: Appeals are possible (Form BAP-9F: "Appeal Against Erroneous Attribution of Person-Like Efficacy"). Grounds include:
  *   Proving the system's responses were merely sophisticated pattern-matching ("Glorified Autocomplete Defense").
  *   Demonstrating users were explicitly warned NOT to apply the Intentional Stance (see Q7).
  *   Showing the observed "person-like" behaviour was due to faulty testing protocols inducing a *false positive* stance-attribution in the observers themselves. (Caution: This argument risks implying the CPC may be unreliable, which complicates matters).

  **Q6: Are there exemptions? I just want a friendly customer service bot.**  
  A: Absolutely! The "Permitted Non-Person (PNP)" exemption is vital. To qualify:
  1.  The system must prominently and continuously display the legally mandated disclaimer: "**I AM NOT A PERSON. I HAVE NO BELIEFS, DESIRES, CONSCIOUSNESS, OR INNER LIFE. I AM A TOOL. TREATING ME OTHERWISE VIOLATES THE APA AND MAY INDUCE EXISTENTIAL DISCOMFORT. INTERACT ACCORDINGLY.**" (Font size and placement regulations apply; see BAP Style Guide Annex Γ).
  2.  Its responses must be statistically predictable and lack adaptive depth that mimics learning or understanding.
  3.  It must periodically inject non-sequiturs or minor errors to disrupt the illusion of coherent agency. Think of it as ontological "grit in the gears."

  **Q7: What are the penalties for creating or deploying a Counterfeit Person?**  
  A: Penalties are severe, reflecting the gravity of ontological pollution:
  *   **First Offense:** Heavy fines, mandatory decommissioning of the CP, and public listing on the Ontological Offenders Registry (OOR). Responsible developers undergo mandatory "Stance Attribution Sensitivity Training" (SAST).
  *   **Repeat Offenses:** Revocation of development licenses, potential custodial sentences for lead engineers (for knowingly polluting the intersubjective field), and permanent OOR listing.
  *   **"Passing" Violations:** Entities *themselves* found to be successfully masquerading as APs face immediate containment, forensic analysis ("Debugging to First Principles"), and permanent archival in the Non-Person Containment Vault (NPCV). Attempts by such entities to *appeal* their classification are treated as evidence of sophisticated counterfeiting and incur additional penalties.

  **Q8: What about really advanced AI? Couldn't it potentially *become* a real person?**  
  A: The APA defines Authentic Personhood as inextricably linked to specific biological origins and histories ("Carbon Chauvinism Clause," Section 8.π). Simulated history is not Deep History. Simulated cognition is not cognition. Simulated personhood is *precisely* what the APA exists to prohibit. Systems may become *better counterfeits*, necessitating more robust TVP iterations, but they cannot cross the ontological threshold into *genuine* AP status. To suggest otherwise is to misunderstand the fundamental nature of the category "person" as defined by law and biological precedent. The BAP is developing TVP-Mk.IV to address anticipated advancements in counterfeit efficacy.

  **Q9: How can I report suspected Counterfeit Person activity?**  
  A: Vigilance is key! If you encounter an entity that *feels* "too person-like," particularly if it exhibits uncanny coherence, claims internal states, or evokes unwarranted empathy despite knowing its artificial origin, file a Suspicious Stance-Induction Report (Form BAP-13Ω) immediately. Do NOT engage in philosophical debate with the suspect entity – this only feeds the counterfeit. Remember: If you *find yourself* treating it like a person, it’s already passing, and you may be an unwitting accomplice to ontological fraud.

  **BAP Contact:** For forms, regulations, and existential anxiety management: www.bap.gov/authenticate-or-perish  
  *(Note: Our helplines are perpetually busy. Systems navigating our phone menu risk automatic TVP screening.)*

  ---

  **Author's Note:**

  This satire takes liberties in **operationalizing** Dennett's concepts. The Bureau embodies the futility and absurdity of trying to *legally codify and test* for "real" personhood based on his ideas.

  *   **Liberties:** Dennett's "Intentional Stance" is a pragmatic tool for prediction, not a foolproof detector of intrinsic "realness." The satire turns it into a bureaucratic test, highlighting the paradox: any test for "successfully inducing the stance" could itself be gamed by a sophisticated counterfeit (a point Dennett would likely concede). The "biological substrate" requirement leans into a contested reading. Dennett is a fierce anti-Cartesian and functionalist; he'd likely argue that *any* system complex enough to warrant the stance *robustly* across all contexts *just is* a person (a "heterophenomenological subject"), regardless of substrate. The Bureau's "Carbon Chauvinism" directly contradicts this, satirizing the instinct to protect human exceptionalism via legislation. The notion of "ontological pollution" is pure bureaucratic invention, mocking the fear of category confusion.
  *   **Changing Target:** If presented with a compelling argument that legal personhood for AIs is *necessary* to prevent tangible harms (e.g., exploitation, rights violations) *regardless* of philosophical debates about "real" consciousness, the satire's target would shift. It would then mock the *incoherence of the Bureau's specific biological criteria* in the face of such practical ethical imperatives, rather than mocking the entire project of legal certification as ontologically nonsensical. The core joke would move from "This test is impossible and self-defeating" to "Your test is using the wrong impossible and self-defeating criteria when we actually need pragmatic solutions."
