          Therefore, the same table cannot be consistent with both graphs.

     (b) A colleague who adjusts for every variable he measured (so he adjusts for Z) says his stratified analysis is obviously the more careful one. What's his strongest move against my example, and what's my reply?

          His strongest move: He might argue that conditioning on Z is necessary to control for confounding by ability. He might say: "The quiz result (Z) is a proxy for ability. Without conditioning on ability, the effect estimate is confounded. The fact that the conditional estimates are both negative and consistent across strata strengthens the case that the tutoring program is harmful."

          My reply: In this example, ability (U) is not a confounder because it is independent of T (due to randomization). Therefore, the crude estimate is unbiased for the total effect. Conditioning on Z, which is a collider, induces a spurious association between T and U, which then biases the estimate. The conditional estimates are biased because they are affected by this non-causal path. The total effect of T on Y is the quantity of interest, and we see that overall the program increases the pass rate by 2%. The harm seen in the stratified analysis is an artifact of conditioning on a post-treatment variable.

          Additionally, I could point to the DAG and explain the collider bias. I could also note that if we had measured ability (U), we could condition on U to get unbiased conditional effects, but we cannot condition on Z.

          The key: Z is post-treatment, so conditioning on it blocks part of the effect of T (the indirect effect via Z) and also induces collider bias.

          But note: the total effect is the combination of the direct effect and the indirect effect (via Z). In our DAG, there is no indirect effect? Because we don't have an arrow from Z to Y. We only have:

             T -> Z
             T -> Y
             U -> Z
             U -> Y

          So the effect of T on Y is only direct? Then why is there a difference? 

          Actually, we did not have T->Z->Y. So the effect is only direct. Then why does the crude show a positive effect? Because the direct effect is positive (for high-ability) and negative for low-ability? But in our second parameterization, we made the direct effect negative for low-ability and positive for high-ability, and the net effect was positive.

          And the conditional effect (given Z) is biased by the collider path.

          So the total effect is the direct effect (which is the only effect) and it is the same as the crude association.

          Therefore, conditioning on Z is not appropriate for the total effect.

          If the colleague were interested in the direct effect (not mediated by Z), then we would need to condition on Z? But note: because Z is a collider, conditioning on Z would induce bias. So even for the direct effect, we cannot condition on Z. We would need to condition on U to block the path via U? But we don't have U.

          So the strongest reply: conditioning on a post-treatment variable that is a collider induces bias, and we have shown that the total effect is positive. The stratified analysis is biased by conditioning on a collider.

          Also, we can run a sensitivity analysis or use other methods (like mediation analysis) if we are interested in direct and indirect effects, but in this case there is no indirect effect (since Z does not affect Y) so the total effect is the direct effect.

          Actually, in our DAG, there is no path from T to Y through Z (because Z doesn't cause Y). So the total effect is the direct effect. Therefore, the crude estimate is the direct effect. The conditional estimates are not the direct effect because they are biased by the collider.

          How then do we estimate the direct effect? We don't need to condition on anything because there is no confounding and no mediation. The crude estimate is the direct effect.

          Therefore, the colleague's adjustment is not only unnecessary but harmful.

          However, if we had a path T->Z->Y, then we would have an indirect effect. Then the total effect would be the sum of direct and indirect. And conditioning on Z would block the indirect effect and leave the direct effect. But note: in that case, conditioning on Z (a collider as well as a mediator) would induce bias from the collider path. So we would need to use other methods (like the front-door criterion or mediation formulas) to avoid bias.

          But in our example, there is no arrow from Z to Y, so we don't have that issue.

          Therefore, the example stands: adjusting for Z is wrong.

          The point: the same table of counts might not be consistent with both graphs, but the key is the causal structure. Without knowing the structure (i.e., whether Z is pre or post treatment, and the direction of arrows), we cannot know which analysis to trust. This is why we need a DAG.

          And in our case, because Z is measured after T, we have strong reason to believe it is a collider and not a confounder.

          So my reply: "The variable Z is a post-treatment variable. Conditioning on it blocks part of the effect of the treatment and also induces collider bias. Therefore, the conditional estimate is not the total effect and is biased. The crude estimate is the total effect and is unbiased because of randomization. The fact that the conditional estimate is negative in both strata is due to the collider bias, not a true harmful effect."

          The colleague might then ask: "But why is the distribution of Z so different between treatments?" 

          I would answer: "Because the treatment affects Z. In the control group, only 850/2000=42.5% passed the quiz, but in the treated group, 1790/2000=89.5% passed. That is exactly what we expect if the treatment helps students pass the quiz."

          This further supports that Z is post-treatment.

   Therefore, we have built the example.

