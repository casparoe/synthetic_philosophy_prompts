              Risk difference: 0.5698 - 0.8529 = -0.2831

     DAG: T->Z, T->Y, U->Z, U->Y. T independent of U.

     The single feature: Z being a common effect (collider) of T and U.

     Extras:
          (a) The same table of counts is not consistent with Z being a pre-treatment confounder because the distribution of Z differs by T, which would not happen if T were randomized and Z pre-treatment.
          (b) The colleague's strongest move: arguing that Z is a proxy for ability and adjusting for it is necessary to control confounding. Reply: Z is post-treatment and conditioning induces collider bias; the total effect is positive and the conditional estimates are biased downward.

   Finally, note: the total effect of T on Y is our estimand, and we have shown that the crude estimate is unbiased for it.

