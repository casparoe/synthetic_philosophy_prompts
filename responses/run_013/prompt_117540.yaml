   Now, the story:

     We have a tutoring program (T) that is assigned by lottery. We are interested in the effect on passing a final exam (Y). There is an intermediate quiz (Z) that occurs after the tutoring program. The student's underlying ability (U) is not observed. 

     We find that overall, the tutoring program increases the pass rate by 2 percentage points (from 50% to 52%). However, when we look within students who failed the quiz (Z=0), the pass rate is 23.91% in the control group and only 9.52% in the tutoring group. Similarly, within students who passed the quiz (Z=1), the pass rate is 85.29% in the control group and 56.98% in the tutoring group. 

     So in both strata, tutoring appears to reduce the pass rate.

     Why? Because the quiz is a collider: 
          T (tutoring) -> Z (quiz result)
          U (ability) -> Z (quiz result)
          U (ability) -> Y (exam result)
          T (tutoring) -> Y (exam result)   [direct effect]

     Conditioning on Z opens the path T->Z<-U->Y. This creates a spurious association between T and Y (via U). In particular, within a fixed quiz result, students in the tutoring group who did poorly on the quiz (Z=0) are more likely to have low ability (because tutoring normally helps, so if they failed even with tutoring, they must be very low ability). Similarly, in the control group, a student who failed the quiz (Z=0) might have had bad luck or might be low ability, but not as extremely low as in the tutoring group. 

     The spurious association (which is negative: tutoring is associated with lower ability within each Z stratum) is strong enough to overcome the true positive effect of tutoring.

     The single feature that is doing the work: Z is a common effect (collider) of T and U (which is a cause of Y). If we remove the arrow from T to Z (so tutoring doesn't affect the quiz) or remove the arrow from U to Z (so ability doesn't affect the quiz) then conditioning on Z would not open the path and the flip would vanish.

