  ### Case Study: The Job Training Program

  **Story:**  
  A city runs a randomized job training program (T: 1=assigned to program, 0=not assigned) to improve employment outcomes. Assignment is by lottery (random). Six months after assignment, participants take a skills assessment (Z: 1=pass, 0=fail). One year post-assignment, employment status (Y: 1=employed, 0=unemployed) is measured. Unobserved is innate career aptitude (U), which affects both assessment performance and employment. The program directly boosts employment (positive effect) but also increases the likelihood of passing the assessment. High innate aptitude (U) makes passing the assessment and securing employment more likely.

  #### Data (n=4,000 participants, 2,000 per treatment arm):

  | T (Group) | Z (Assessment) | Y (Employed) | Count |
  |-----------|----------------|--------------|-------|
  | 0 (Control) | 0 (Fail)       | 0            | 875   |
  | 0 (Control) | 0 (Fail)       | 1            | 275   |
  | 0 (Control) | 1 (Pass)       | 0            | 125   |
  | 0 (Control) | 1 (Pass)       | 1            | 725   |
  | 1 (Treated) | 0 (Fail)       | 0            | 190   |
  | 1 (Treated) | 0 (Fail)       | 1            | 20    |
  | 1 (Treated) | 1 (Pass)       | 0            | 770   |
  | 1 (Treated) | 1 (Pass)       | 1            | 1,020 |

  **Crude Risks (Overall):**  
  - Control (T=0): (275 + 725) / 2,000 = 1,000 / 2,000 = 0.5000  
  - Treated (T=1): (20 + 1,020) / 2,000 = 1,040 / 2,000 = 0.5200  
  → **Crude Risk Difference (Treated - Control): +0.0200** (T helps)

  **Stratum-Specific Risks:**  
  - **Z=0 (Failed Assessment):**  
    - Control: 275 / (875 + 275) = 275 / 1,150 ≈ 0.2391  
    - Treated: 20 / (190 + 20) = 20 / 210 ≈ 0.0952  
    → **Risk Difference (Treated - Control): -0.1439** (T hurts)  
  - **Z=1 (Passed Assessment):**  
    - Control: 725 / (125 + 725) = 725 / 850 ≈ 0.8529  
    - Treated: 1,020 / (770 + 1,020) = 1,020 / 1,790 ≈ 0.5698  
    → **Risk Difference (Treated - Control): -0.2831** (T hurts)  

  **Simpson’s Paradox:** Crude shows T helps (+2%), but within both Z strata, T hurts (−14.4% in Z=0; −28.3% in Z=1).

  ---

  ### Diagnosis  
  **Causal Graph (DAG in Words):**  
  - T → Z (Program affects assessment)  
  - T → Y (Program affects employment)  
  - U → Z (Aptitude affects assessment)  
  - U → Y (Aptitude affects employment)  
  - No confounders (T random; U independent of T).  

  **What Conditioning on Z Does:**  
  - Z is a **collider** (common effect of T and U).  
  - Conditioning on Z opens the non-causal path: T → Z ← U → Y.  
  - This path induces a **spurious negative association** between T and Y:  
    - Fixing Z, higher T implies lower U (to "explain" Z), and lower U implies lower Y.  

  **Stratum-Specific Contrast vs. Crude:**  
  - Stratum-specific risk difference estimates the **direct effect of T** (T→Y) *plus bias* from T→Z←U→Y.  
  - This is **not the total effect** needed for policy decisions. The total effect (crude) includes all paths (T→Y and T→Z→?→Y, but here Z does not affect Y; the bias is purely from collider stratification).  

  **Single Feature Doing the Work:**  
  - Z being a **post-treatment common effect (collider)** of T and U.  
  - If removed (e.g., no link from U to Z or T to Z), conditioning on Z would not open a path, and the flip would vanish.  

  ---

  ### Extras  
  **(a) Rewiring Z as Pre-Treatment Confounder:**  
  - **Usual Moral Returns:** If Z is a pre-treatment confounder (e.g., education level), the stratified estimate is unbiased for the total effect.  
  - **Which Estimate is Right?** Stratified (adjusted) estimate.  
  - **Same Table Consistent?** No.  
    - Randomization ensures Z independent of T pre-treatment.  
    - In the table, P(Z=0) = 57.5% (control) vs. 10.5% (treated) — impossible if Z is pre-treatment and T random.  

  **(b) Colleague’s Argument and Reply:**  
  - **Colleague’s Strongest Move:** "Adjusting for Z is more precise and accounts for heterogeneity; the consistent harm in both strata is robust evidence against T."  
  - **Reply:** "Z is post-treatment. Conditioning blocks part of T’s effect and induces collider bias. The crude estimate is unbiased for the total effect, which is policy-relevant. Your estimate includes spurious bias from T→Z←U→Y."  

  ---

  ### Key Takeaway  
  The **same data** cannot support both causal stories. Trusting the stratified estimate requires knowing if Z is a confounder (pre-treatment) or a collider (post-treatment). Here, temporal order (Z after T) and imbalance in Z by T confirm Z is **not pre-treatment**. Conditioning on colliders creates bias — even in randomized trials.
