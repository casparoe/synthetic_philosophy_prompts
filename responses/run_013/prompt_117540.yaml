   However, note: We want Z to be affected by T and also by Y (or by something that affects Y). But since Y occurs after Z, we cannot have Z affected by Y. Instead, we can have Z affected by T and by an unobserved variable that also affects Y. Alternatively, we can have Z affected by T and by the student's underlying ability (which is pre-treatment but we don't measure it). But note: if ability is pre-treatment and we condition on Z (which is post-treatment), we might still induce bias.

   Alternatively, we can have Z be a collider that is caused by T and by an unobserved variable U that also causes Y. But note: we want no confounding for the effect of T on Y. So we must assume that T is randomized and that the unobserved U is independent of T. But then, if we condition on Z, we create an association between T and U (because conditioning on a common effect induces an association between the causes). Then, because U is associated with Y, we get an association between T and Y that is spurious.

   Let's set up:

     T -> Z   (tutoring affects quiz performance)
     U -> Z   (student's underlying ability affects quiz performance)
