   - Within each level of Z, T hurts (higher risk of bad outcome)

   The key: We want the crude estimate to be the causal effect we care about (because T is randomly assigned) but conditioning on Z (a post-treatment variable) gives the wrong answer.

   How can this happen? By conditioning on a collider. Specifically, if Z is a common effect of T and Y (or of T and some other variable that is related to Y), then conditioning on Z induces a spurious association between T and Y.

   We'll build a story.

   Story: 
     T: A new tutoring program (T=1: enrolled, T=0: not enrolled) assigned by lottery (random).
     Y: Passing a final exam (Y=1: pass, Y=0: fail).
