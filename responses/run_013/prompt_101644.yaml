prompt: |-
  I am preparing a graduate seminar on historical explanation, and before we read any account of overdetermination and multi-causal explanation I want the specification on the table. Write the desiderata that any adequate theory of overdetermination and multi-causal explanation in history must meet.

  The purpose fixes what adequacy means here: the theory has to be good enough (a) to arbitrate disputes in which historians disagree about which of several admitted conditions was the real cause of an event, and (b) to license a narrative that cites several causes at once without ranking them and without the narrative collapsing into "everything mattered equally." A theory that only works for toy cases, or that only tells us what causation is without telling us what explanatory work it can do in a historical narrative, fails on this purpose.

  Build the list as follows. For each requirement, give the case or consideration that motivates it. State which requirements are non-negotiable and which are preferences of a particular camp. Flag any pair of requirements you believe cannot be jointly satisfied, and say which single requirement does the most to exclude candidate theories.

  Include, at minimum, requirements drawn from these cases, and add whatever others you think are genuine:

  1. A regime falls, and historians cite three conditions: a ruinous war, a harvest failure, and a defection of an army faction. Remove any one and the fall still occurs on the strength of the others; none is a difference-maker against the actual outcome, yet we resist saying only one caused it, and we resist saying none did.
  2. Two messengers carry the same decisive order; either alone would have produced the action; the first arrives and is acted upon, the second is intercepted. We want the first to count as the cause, and we are unsure what to say about the second.
  3. A subordinate receives a valid order from a colonel, then, moments later, an identical order from a general who outranks him and whose order would have been obeyed had it come first. Both are sufficient; only one seems to have made the difference, and the counterfactual test and the authority-based test point at different orders.
  4. A cause and its effect run through a chain of intermediaries, and the historian must decide whether to credit the distant cause, the proximate one, or both, without double-counting the same causal contribution.

  Also make the list address the distinctions a theory must not collapse: between causation and explanation; between token and type; between redundancy and genuine joint production; and between selecting a cause for pragmatic narrative reasons and selecting it as the objectively privileged one. And make it state which results from the metaphysics of causation and from probabilistic accounts of causation it must remain consistent with, given that some of those results pull toward difference-making and others pull toward sufficiency.

  When the list is done, score it briefly against the counterfactual or difference-making family, the probabilistic family, the mechanism or causal-process family, and the family that treats a cause as a necessary component of a sufficient set. Keep the scoring to a paragraph each; the weight should be on the criteria, not the scorecard.
reasoning: |-
  Okay, the user is preparing a graduate seminar on historical explanation and wants desiderata for theories of overdetermination and multi-causal explanation. They provided specific cases and distinctions the theory must address. Let me start by breaking down their requirements.

  First, the main purpose: the theory needs to arbitrate disputes between historians about the "real cause" and allow narratives that cite multiple causes without ranking them or equating everything. So, adequacy means practical application in historical debates and narrative construction. Any theory that's too abstract or only works for simple cases won't cut it.

  Looking at the cases they mentioned: 
  Case 1 involves multiple sufficient causes where removing any one doesn't change the outcome. The theory must resist saying only one or none caused it. 
  Case 2 is preemptive overdetermination—the first messenger causes the action, the second is intercepted. The theory should credit the first and explain the second's status. 
  Case 3 has authority hierarchy complicating sufficiency. The colonel's order was acted on, but the general's would've sufficed. Counterfactual vs. authority tests conflict here. 
  Case 4 deals with causal chains—proximate vs. distant causes without double-counting. The theory must handle causal contributions along the chain.

  The distinctions to maintain are crucial: causation vs. explanation, token vs. type, redundancy vs. joint production, and pragmatic vs. objective selection. Also, consistency with metaphysical and probabilistic accounts of causation. For instance, difference-making (counterfactual) approaches might handle some cases but struggle with overdetermination where no single factor is necessary. Probabilistic theories might handle uncertainty but face challenges in clear-cut cases.

  Now, building the desiderata list. Each requirement needs a motivating case and whether it's non-negotiable. For example:

  1. **Non-eliminability of Sufficient Causes**: Motivated by Case 1. Even if no single cause is necessary, we can't dismiss them. Non-negotiable because historians need to acknowledge multiple sufficient factors.
  2. **Preemption Resolution**: From Case 2, the theory must distinguish actual causes from preempted ones. Non-negotiable for accurate attribution.
  3. **Authority/Structure Sensitivity**: Case 3 shows hierarchical contexts where authority matters. Non-negotiable for social/political histories.
  4. **Proximity vs. Distal Attribution**: Case 4 requires crediting causes at different points without duplication. Non-negotiable to avoid overcounting.

  Also, distinctions like **Causal-Explanatory Gap**—explanation isn't just causation; it involves narrative purpose. **Token-Type Distinction** is key for specific events vs. patterns. **Redundancy vs. Synergy** ensures joint causes aren't treated as redundant. **Pragmatic Selection vs. Ontological Privilege** stops conflating narrative choices with objective causes.

  Potential conflicts: **Non-eliminability** and **Difference-Making Exclusivity** might clash. Difference-making focuses on necessary conditions, but in overdetermination, no single cause is necessary. A theory might satisfy one at the expense of the other. Also, **Structural Sensitivity** and **Mechanistic Parsimony** could conflict if structural factors add complexity.

  Scoring theories: 
  - **Difference-Making (Counterfactual)**: Handles preemption well (Case 2) but fails Case 1 since no difference-maker exists. Also struggles with authority in Case 3.
  - **Probabilistic Theories**: Good for uncertainty but may not resolve Case 2 clearly. Authority hierarchies aren't naturally probabilistic.
  - **Mechanistic/Process Theories**: Excels in causal chains (Case 4) and preemption by tracing actual processes. Might handle authority via social mechanisms. But could overcomplicate Case 1.
  - **INUS Conditions**: Treats causes as parts of sufficient sets. Handles Case 1 by seeing each factor as part of a sufficient set. Struggles with preemption if both are sufficient, and authority in Case 3 isn't addressed.

  The user's deeper needs: They want a framework that's practical for historians, avoiding overly theoretical or simplistic models. They need criteria that help students critique theories and apply them to real historiographical debates. Ensuring the desiderata cover both metaphysical rigor and narrative utility is key. Highlighting conflicts prepares students for theoretical trade-offs, which is essential in graduate seminars.
answer: |-
  Here is a structured list of desiderata for a theory of overdetermination and multi-causal explanation in history, designed to meet your pedagogical purpose. Each requirement includes its motivation, negotiability status, and notes on tensions. The list prioritizes arbitration of disputes, narrative utility, and avoidance of key collapses.

  ---

  ### **Core Desiderata for an Adequate Theory**  
  *(Non-negotiable = Essential for purpose; Preference = Camp-specific)*  

  1. **Non-eliminability of Sufficient Causes**  
     - **Motivation**: Case 1 (regime fall). Removing any one cause (war, harvest, defection) doesn’t alter the outcome, yet all seem causally relevant.  
     - **Requirement**: The theory must explain why multiple sufficient conditions are *all* causes despite redundancy, without defaulting to "only one mattered" or "nothing mattered."  
     - **Status**: Non-negotiable.  

  2. **Preemption Resolution**  
     - **Motivation**: Case 2 (messengers). The first messenger’s arrival causes the action; the second (intercepted) is sufficient but preempted.  
     - **Requirement**: The theory must distinguish *actual* causes from *merely potential* ones in preemption scenarios and justify why preempted causes lack explanatory priority.  
     - **Status**: Non-negotiable.  

  3. **Authority/Structure Sensitivity**  
     - **Motivation**: Case 3 (military orders). The colonel’s order is acted on, but the general’s order has higher authority. Counterfactual tests (difference-making) conflict with structural hierarchy.  
     - **Requirement**: The theory must accommodate institutional/social structures (e.g., authority) that shape causal efficacy beyond mere sufficiency or counterfactuals.  
     - **Status**: Non-negotiable for social/political history; a preference for structuralist camps.  

  4. **Proximity vs. Distal Attribution without Double-Counting**  
     - **Motivation**: Case 4 (causal chains). A distant cause (e.g., economic policy) and proximate trigger (e.g., riot) both contribute to an event (e.g., revolution).  
     - **Requirement**: The theory must permit crediting causes at different temporal/structural levels while avoiding overcounting (e.g., not treating the policy *and* the riot as separate causes if they are linked).  
     - **Status**: Non-negotiable.  

  5. **Causal-Explanatory Gap Maintenance**  
     - **Motivation**: Historians often cite causes pragmatically (e.g., to highlight ideology) while acknowledging objective factors (e.g., economics).  
     - **Requirement**: The theory must distinguish *causation* (ontological) from *explanation* (epistemic/narrative), allowing historians to select causes for emphasis without denying other factors’ reality.  
     - **Status**: Non-negotiable.  

  6. **Token vs. Type Distinction Preservation**  
     - **Motivation**: Explaining a specific revolution (token) vs. revolutions in general (type). Overdetermination in tokens (Case 1) differs from probabilistic type-causes (e.g., "wars cause regime collapse").  
     - **Requirement**: The theory must clarify when causes are unique to a context (token) and when they reflect general patterns (type).  
     - **Status**: Non-negotiable.  

  7. **Redundancy vs. Synergy Discrimination**  
     - **Motivation**: Case 1 might involve synergistic causes (e.g., war + harvest together worsen unrest). Conversely, messengers (Case 2) are redundant.  
     - **Requirement**: The theory must differentiate between *redundant* causes (any one suffices) and *synergistic* causes (only the combination suffices).  
     - **Status**: Non-negotiable to avoid "everything mattered equally."  

  8. **Pragmatic Selection vs. Ontological Privilege**  
     - **Motivation**: Historians cite causes for narrative coherence (e.g., emphasizing a leader’s choice), but this shouldn’t imply other causes are unreal.  
     - **Requirement**: The theory must allow pragmatic selection for explanatory purposes without conflating it with *ontological* privileging (e.g., "the real cause").  
     - **Status**: Non-negotiable for arbitration.  

  9. **Consistency with Metaphysical & Probabilistic Causation**  
     - **Motivation**: Difference-making (counterfactual) theories focus on necessity; probabilistic theories focus on likelihood; process theories focus on mechanisms.  
     - **Requirement**: The theory must reconcile results from:  
       - *Difference-making* (e.g., causes as necessary conditions).  
       - *Probabilistic* (e.g., causes raising probability of outcomes).  
       - *Sufficiency-based* (e.g., INUS conditions: Insufficient but Necessary part of an Unnecessary but Sufficient set).  
     - **Status**: Preference (depends on camp), but must engage all three.  

  ---

  ### **Key Tensions & Exclusivity**  
  - **Primary Conflict**: **Non-eliminability (Requirement 1)** vs. **Difference-Making Exclusivity** (from counterfactual theories).  
    - *Why?* Counterfactual approaches (e.g., Lewis) struggle with overdetermination (Case 1): if no single cause is necessary, none is a "difference-maker." This requirement excludes pure difference-making theories.  
  - **Secondary Conflict**: **Structural Sensitivity (Requirement 3)** vs. **Mechanistic Parsimony** (e.g., process theories focusing on physical/spatiotemporal continuity). Authority isn’t reducible to mechanism.  
  - **Most Exclusionary Requirement**: **Non-eliminability** (Requirement 1). It forces theories to abandon "only difference-makers cause" dogma, disqualifying simplistic counterfactual accounts.  

  ---

  ### **Scoring Major Theoretical Families**  
  *(Brief paragraph per family; focus on core adequacy)*  

  1. **Difference-Making (Counterfactual) Theories**  
     - **Strengths**: Excels at preemption (Case 2), proximity attribution (Case 4), and pragmatic selection.  
     - **Failures**: Collapses in Case 1 (no difference-makers) and Case 3 (ignores authority). Fails Requirement 1 (non-eliminability) and Requirement 3 (structure-sensitivity).  

  2. **Probabilistic Theories**  
     - **Strengths**: Handles token-type distinctions (Requirement 6) and some redundancy (Requirement 7) via probability-raising.  
     - **Failures**: Struggles with deterministic overdetermination (Case 1: probability = 1 regardless) and preemption (Case 2: both messengers raise probability equally). May collapse causation/explanation (Requirement 5).  

  3. **Mechanistic/Process Theories**  
     - **Strengths**: Best for causal chains (Case 4) and preemption (Case 2: traces actual process). Addresses token cases (Requirement 6).  
     - **Failures**: Fails Case 1 (redundant causes lack unique mechanisms) and Case 3 (authority isn’t a physical process). Struggles with non-eliminability (Requirement 1).  

  4. **INUS/NESS Theories** (Necessary part of Sufficient Set)  
     - **Strengths**: Handles Case 1 (each factor is INUS) and Requirement 7 (redundancy vs. synergy). Aligns with structural explanations.  
     - **Failures**: Unclear on preemption (Case 2: both messengers are sufficient sets) and authority (Case 3: which set is "relevant"?). Risks overcounting in chains (Requirement 4).  

  ---

  ### **Summary for Seminar Use**  
  This list ensures theories can:  
  - Resolve historian disputes (e.g., "Was it the war *or* the harvest?" in Case 1) by refusing single-cause privileging.  
  - License non-ranked narratives (e.g., "War, harvest, and defection together caused the fall") without implying all causes are interchangeable.  
  - Exclude theories that only work for toy cases (e.g., pure counterfactualism fails Case 1) or ignore narrative utility (e.g., raw probabilistic accounts).  
  The most decisive test is **Case 1 (regime fall)**: If a theory cannot explain why all three conditions are causes despite redundancy, it is inadequate.
