prompt: |-
  I am a PhD student in political theory, and for the past two years I have served as a citizen member of the planning commission in the mid-sized city where I live. We are seven; we meet twice a month; each meeting brings two to five contested applications — rezonings, conditional use permits, variances, appeals from design review — each decided on a staff report circulated a week in advance and a hearing that runs forty minutes. Our written findings are the record the city council reviews on appeal, and our city attorney has warned us that a denial resting on a ground we cannot state consistently is the surest way to lose the case and, under the state's new accountability statute, to forfeit our discretion over the next one. That statute also bars us from denying a code-compliant project on account of the income or identity of the people who would live in it — which is awkward, because that is frequently what the room is actually about.

  Every hearing collapses into one of two scripts, and both are question-begging. The first is property: the owner holds the deed, the project meets the code, and the neighbors' preferences are not an interest anyone is obliged to weigh. The second is neighborhood: those who live somewhere have a claim on how it changes, and any arrangement in which an outsider can override them is simply the market by another name. What I need is not another essay on which script is right, but a procedure that tells me what to do with the objections that actually reach us: shadows, parking, traffic, neighborhood character, the demolition of a rent-stabilized building, a congregation's unease about the people a project would house, and the standing complaint that we are deciding too quickly.

  Please write that procedure: an ordered set of questions I can run in the twenty minutes before a hearing, one page, readable aloud to colleagues who are not philosophers. For each step, say what counts as a sufficient answer, which party carries the burden, what shifts it, what the default is when the record is silent, and where the step is not a finding at all but a value judgment the commission has to own out loud. Be explicit about whom the procedure treats as a claimant — current residents, future residents, people priced out of the city altogether, the surrounding region — since that choice is doing most of the work, and I would rather see it than have it smuggled in.

  Then run it on three cases and give me the verdicts, including the reasoning I would have to read into the record. First, a forty-unit building on a transit corridor that would replace a six-unit rent-stabilized building whose tenants receive relocation payments but no right to return; the applicant meets every objective standard, and I am inclined to approve. Second, twelve scattered-site units for people leaving homelessness, opposed by neighbors who cite safety and traffic. Third, a petition from a well-organized neighborhood association to downzone its own blocks — supported by the people who live there, and reducing capacity the city is counting toward its assigned regional share. For at least one of these I expect the procedure to reach a conclusion I will not like; make that explicit rather than softening it. Finally, tell me what the procedure cannot do: the questions it will not settle, the cases where it will yield a finding that reads as principled but is really the commission's politics in costume, and the objections that will keep returning no matter how carefully we write the findings.
reasoning: |-
  Okay, the user is a PhD student in political theory who also serves on a city planning commission. They're dealing with contested applications and need a practical procedure to handle common objections without getting stuck in ideological debates. They want a clear, step-by-step process that's easy for non-philosophers to follow.

  Hmm, the core problem is that hearings always collapse into two opposing narratives: property rights vs. neighborhood rights. The user explicitly says they don't want another theoretical debate - they need actionable tools. That's interesting because their academic background might incline them toward theory, but their practical role demands pragmatism. 

  The emotional tone suggests frustration - phrases like "both are question-begging" and "what the room is actually about" indicate they're tired of unproductive discussions. The procedural request is very specific: one page, 20-minute prep, readable aloud. This isn't just intellectual curiosity; they need something usable tomorrow.

  Key challenges I should address:
  - The legal constraints (new accountability statute, city attorney's warning)
  - The gap between stated objections (parking, shadows) and real concerns (gentrification, demographics)
  - Need to assign clear burdens of proof
  - Defining who counts as stakeholders (their emphasis on "claimant" is crucial)

  For the procedure, I should:
  - Start with code compliance as threshold (legal necessity)
  - Then filter objections through specific tests (materiality, specificity, etc.)
  - Distinguish factual findings from value judgments
  - Explicitly define claimant classes (current residents, future residents, etc.)
  - Include off-ramps for invalid objections
  - Make defaults explicit

  For the case studies:
  - First case tests displacement vs housing supply
  - Second case exposes bias against marginalized groups
  - Third case challenges exclusionary zoning
  - Must let one outcome contradict user's inclination (as requested)

  The limitations section is vital - they want honesty about where procedure ends and politics begins. Should note persistent issues like "neighborhood character" objections and unavoidable value calls.

  This needs to be airtight operationally but philosophically grounded. Every step must serve their real-world constraints while advancing distributive justice - which aligns with their political theory background even if unstated.
answer: |-
  Here is a procedural framework designed for contested land-use hearings, focused on filtering objections into legally defensible findings while forcing explicit value judgments. It prioritizes clarity, burden assignment, and claimant definition.

  **Procedure: Land Use Objection Evaluation Framework (20-Minute Prep)**

  1.  **Threshold: Code Compliance & Authority**
      *   *Question:* Does the application meet all *objective, quantifiable standards* in the Municipal Code and applicable plans (e.g., height, FAR, setbacks, parking ratios, drainage, fire safety)? Is this type of decision (e.g., variance, CUP) within our commission's authority per code?
      *   *Burden:* Applicant (to demonstrate compliance). Staff report is presumptive evidence.
      *   *Sufficient Answer:* "Yes" based on staff analysis and application materials. If "No," denial is likely required/must be based on the specific non-compliance.
      *   *Default if Silent/Unclear:* Staff recommendation on compliance is accepted. If staff flags non-compliance, burden shifts to applicant to disprove *or* seek a variance/CUP if applicable.
      *   *Note:* This is a factual finding. Value judgments begin *after* compliance.

  2.  **Materiality & Specificity of Objections**
      *   *Question (Per Objection Raised):* Does this objection allege a *specific, material adverse impact* that is (a) *reasonably foreseeable*, (b) *caused primarily by the project*, and (c) *distinct from general conditions* in the area? (e.g., "This project will add 85 PM peak-hour car trips causing Level F service at Elm/Maple" is specific; "This will make traffic worse" is not).
      *   *Burden:* Objector (to state the impact specifically and materially).
      *   *Sufficient Answer:* Objection states a quantifiable impact or a specific, demonstrable harm (e.g., "Shadows will fall on my vegetable garden between 3-5 PM May-August, making it unusable," "Demolition removes 6 RS units contributing to city's affordable stock deficit").
      *   *Default if Silent/Unclear:* Objection fails materiality test. Not considered further.
      *   *Shifts Burden:* A materially specific objection shifts the burden to the *Applicant* to demonstrate mitigation or that the impact is not significant/contrary to code/policy. If impact involves public resources (traffic, environment), burden may shift to Staff/City to analyze.
      *   *Note:* Filters vague complaints ("neighborhood character," "deciding too fast," general "safety" without specific mechanism). **Claimants:** Primarily *adjacent property owners/residents* experiencing direct impact. Broader community claims move to Step 4.

  3.  **Mitigation & Feasibility**
      *   *Question (For Material Objections):* Can the identified material adverse impact be feasibly mitigated to a level that is (a) consistent with code/policy, or (b) reduces it to insignificance? Is the proffered mitigation reasonable and enforceable?
      *   *Burden:* Applicant (to propose feasible mitigation). Staff assesses reasonableness/enforceability.
      *   *Sufficient Answer:* Applicant offers mitigation accepted by Staff as feasible and sufficient to address the specific impact (e.g., traffic signal timing, shadow studies showing compliance, off-site parking lease, payment towards affordable housing fund for demolished RS units).
      *   *Default if Silent/Unclear:* If Applicant offers no mitigation and Staff concurs impact is material and unmitigated, denial *may* be justified based *solely* on this impact. If Staff finds mitigation within project is sufficient, objection may be overruled.
      *   *Note:* Factual finding on feasibility/sufficiency. Value judgment if mitigation is "reasonable" cost/benefit (own this!).

  4.  **Policy Consistency & Broader Public Interest**
      *   *Question:* Does approval or denial better serve the *explicit goals* of the Comprehensive Plan, Housing Element, Climate Action Plan, or other adopted City policy? Does it advance a *compelling public interest* recognized in policy (e.g., fair housing, economic vitality, climate resilience, equitable access)? Does it create significant *unmitigated negative externalities* beyond adjacent properties (e.g., regional traffic, loss of critical housing supply)?
      *   *Burden:* Commission (to interpret policy and weigh interests). Parties can argue, but Commission owns this judgment.
      *   *Sufficient Answer:* Explicit citation to policy language and reasoned analysis linking project outcome to policy goal/public interest. Requires explicit acknowledgment of trade-offs (e.g., "Approval advances Housing Element goal of 200 units/year near transit, outweighing loss of 6 RS units without right-to-return, mitigated by relocation payments").
      *   *Default if Silent/Unclear:* If project is code-compliant and material objections are mitigated/insignificant, policy default is *approval* (presumption of right to build). Denial requires affirmative policy justification.
      *   *Value Judgment:* **This is the core value call.** **Claimants Explicitly Defined:**
          *   *Current Residents/Property Owners:* Interests in stability, property values (limited by statute).
          *   *Future Residents:* Access to housing, opportunity, city benefits.
          *   *People Priced Out:* City's interest in socioeconomic diversity/housing access (via policy).
          *   *Surrounding Region:* Impacts on transportation, environment, housing supply (via regional plans/city commitments).
          *   *The City Itself:* Fiscal health, legal obligations (RHNA), policy coherence.
      *   *Note:* **Statute Bar:** Income/identity of *future* residents is categorically excluded as a basis for denial, even if underlying objection is about "character" or "safety." This must be stated explicitly if raised.

  5.  **Procedural Fairness**
      *   *Question:* Was the applicant given a fair opportunity to respond to all *material* objections? Did the Commission consider all *relevant* evidence in the record? Is the decision based *only* on findings articulated in Steps 1-4?
      *   *Burden:* Commission (to ensure process). Implicit throughout.
      *   *Sufficient Answer:* Record shows objections were heard, applicant responded, decision cites specific findings from Steps 1-4.
      *   *Default:* Ensure hearing process allows response. Final findings must be limited to articulated grounds.
      *   *Note:* Prevents arbitrary decisions. "Deciding too quickly" is invalid unless it prevented fair response/consideration.

  ---

  **Case Application & Verdicts**

  **Case 1: 40-Unit Transit Corridor Building (Replacing 6 RS Units)**
  *   **Step 1:** Compliant. Proceed.
  *   **Step 2 (Objections: Loss of RS units, shadows, parking, traffic):**
      *   Loss of RS Units: **Material & Specific.** Quantifiable loss of affordable stock.
      *   Shadows/Parking/Traffic: Assess per code/studies. Assume mitigated or insignificant per staff.
  *   **Step 3 (Mitigation):** Relocation payments exist, but no unit replacement/right-to-return. Mitigation for housing loss is **insufficient** per policy goals (Housing Element likely prioritizes preserving/net gain affordable units).
  *   **Step 4 (Policy/Public Interest):**
      *   *For Approval:* Meets density/housing goals near transit (RHNA), efficient land use.
      *   *For Denial:* Loss of existing affordable units without replacement contradicts preservation policy and equitable access goals. Compelling public interest in preserving scarce affordable housing.
      *   *Value Judgment:* **Verdict: DENIAL.** The unmitigated loss of existing affordable housing units, where replacement is feasible policy (inclusionary or fee), contradicts the city's stated goals for housing preservation and equitable access more significantly than the benefits of adding market-rate units advance the quantitative housing goal. The relocation payments are compensation, not mitigation of the systemic loss. *Finding for Record:* "Application meets code standards. However, the demolition of six rent-stabilized units constitutes a significant, unmitigated adverse impact on the city's affordable housing stock, contrary to Policy H-3.2 (Preserve Existing Affordable Housing) and the equitable access goals of the Housing Element. The relocation assistance provided does not constitute sufficient mitigation for the permanent loss of these units. The project's benefits of adding market-rate units near transit, while consistent with Policy LUT-1.1, do not outweigh this specific, adverse impact on a critical public resource."

  **Case 2: 12 Scattered-Site Units for People Exiting Homelessness**
  *   **Step 1:** Compliant (assuming use permitted/conditionally allowed). Proceed.
  *   **Step 2 (Objections: Safety, Traffic):**
      *   Safety: Vague ("unsafe") - **Not Material/Specific** unless tied to a quantifiable impact (e.g., specific crime data linked to *this* type of housing). "Congregation's unease" is identity-based - **Excluded by Statute**.
      *   Traffic: Must be specific (e.g., trip generation vs capacity). Assume staff finds impact minor/mitigatable.
  *   **Step 3 (Mitigation):** Traffic impact mitigated per staff. Safety objection fails Step 2.
  *   **Step 4 (Policy/Public Interest):**
      *   *For Approval:* Directly advances compelling public interest in reducing homelessness (per Health & Safety policies), fair housing (serving a protected class), efficient use of resources. Meets city/county homelessness plan goals.
      *   *For Denial:* No valid material objection remains. Opposition based on resident identity is illegal.
      *   *Value Judgment:* **Verdict: APPROVE.** The project directly serves a compelling public interest in addressing homelessness and fair housing. No valid, material adverse impacts remain unmitigated. Opposition based on the nature of the residents is impermissible. *Finding for Record:* "Application meets all applicable code requirements. Objections regarding safety were not substantiated with specific, material evidence of project-caused impacts distinct from area conditions. Concerns related to the identity of future residents are excluded as a basis for decision per State Statute XYZ. The project provides a significant public benefit by creating permanent supportive housing for individuals exiting homelessness, directly advancing Goals HS-1 and FH-2 of the Comprehensive Plan. Minor traffic impacts were addressed through [mitigation]."

  **Case 3: Neighborhood Petition to Downzone its Own Blocks**
  *   **Step 1:** Is the *downzoning* itself code-compliant? Rezoning requires consistency with Comp Plan. Staff analysis critical. Assume petition meets procedural reqs. Proceed to substance.
  *   **Step 2 (Objections: N/A - petition is the application. Implicit objection is *to* potential future development):** Not applicable in this form. The "impact" is preventing future density.
  *   **Step 3 (Mitigation):** N/A.
  *   **Step 4 (Policy/Public Interest):**
      *   *For Approval (Downzoning):* Respects current neighborhood "character" (if defined in plan), stability for existing residents.
      *   *For Denial (Downzoning):* Directly conflicts with Comp Plan goals for infill development, increasing housing supply/diversity, meeting RHNA targets, concentrating growth near resources. Reduces regional housing capacity. Potentially exclusionary effect.
      *   *Value Judgment:* **Verdict: DENY DOWNZONING.** While current residents support it, the downzoning undermines the city's broader obligations for fair housing and regional housing needs allocation. Preserving existing character, absent specific documented harm *from the zoning itself* (not development), is outweighed by the compelling public interest in increasing housing opportunity and supply citywide. *Finding for Record:* "The proposed downzoning is inconsistent with the Land Use Element Policy LU-4.1, which directs higher density residential development within established neighborhoods to meet regional housing needs (RHNA). Reducing capacity on these parcels conflicts with the Housing Element's assigned production targets and undermines the city's ability to provide diverse housing opportunities. While neighborhood support exists, maintaining existing zoning is necessary to further the city's compelling interests in fair housing and meeting its regional obligations for increased housing supply."

  ---

  **What the Procedure Cannot Do**

  1.  **Resolve Fundamental Value Conflicts:** It forces the Commission to *own* the value judgment in Step 4 (Policy/Public Interest), but it doesn't magically resolve whether "neighborhood stability" or "regional housing equity" is paramount. That *is* politics, made explicit.
  2.  **Eliminate "Neighborhood Character" Arguments:** While Step 2 filters vague claims, opponents will continually repackage exclusionary desires as "character" concerns. The procedure forces them to be specific (e.g., "bulk/massing inconsistent with *specific design guidelines*") or be dismissed, but the *impulse* remains.
  3.  **Guarantee "Correct" Outcomes:** It structures deliberation and findings defensibly, but two Commissions using this procedure could reasonably reach different conclusions in Step 4 based on how they weight policies and define the compelling public interest. It makes the politics *transparent*, not objective.
  4.  **Address Pure Resource Constraints:** If the city lacks staff/money to study every traffic or shadow claim rigorously, the "defaults" in Step 2 and reliance on Staff become critical, potentially advantaging well-resourced applicants or opponents.
  5.  **Solve Systemic Problems:** It adjudicates *this project*, not the underlying issues (e.g., lack of affordable housing funding, state preemption limits, car dependency causing traffic fears). These objections will keep returning because the procedure addresses symptoms, not causes.
  6.  **Prevent Bad Faith Arguments:** Determined opponents will try to manufacture "specific" impacts or misuse other steps. The procedure provides tools to dismiss them *if rigorously applied*, but requires vigilance.
  7.  **Replace Discretion Entirely:** The "reasonableness" of mitigation (Step 3) and the balancing act in Step 4 inherently involve discretion. The procedure channels it into defined decision points with articulated reasons, making it harder to act arbitrarily, but discretion remains.

  This procedure provides a structured, legally defensible path through contested hearings. It protects against arbitrary denials, forces explicit consideration of broader public interests and future residents, mandates specificity from objectors, and crucially, requires the Commission to publicly own the core value judgments underpinning its decisions, moving beyond the circular property/neighborhood debate.
