prompt: |-
  I've been keeping a note on my phone of times when somebody turned out to be right and I couldn't work out whether they actually knew it, and I'd like to know if there's one rule behind how I react to them.

  - My tracking said the parcel was delivered and it had been, so I told my flatmate it was here. But the app was actually showing a different parcel with a similar number, and I'd have said the same thing if mine was still sat in the depot. I dont think I knew it had arrived.
  - I knew my scratchcard was a loser the second I saw the odds printed on the back. It was a loser. I still don't think I knew it though — everyone loses, I was just right about the likely thing.
  - A bloke in the pub told me the road up ahead was flooded, and it was. I found out later he's a compulsive liar who happened to tell the truth that one time. I don't think I knew the road was flooded.
  - My flatmate said she knew the kettle was boiling because the little light was on. The light was broken and always on — but the kettle really was boiling, and she could also hear it rumbling and see the steam coming out, she just didn't bother mentioning that bit. I think she did know.
  - My mum says she knew my grandad was going to have a bad turn that night because she just had a feeling, and she claims she's had that exact feeling before every time and always been right. I want to say she knew, but it makes me uneasy.
  - My cousin reckons he knows there's no biggest number, purely because a psychic told him so. There's no biggest number, so he can't be wrong about it. But I don't think he knew it at all.

  The rule I keep coming back to is this: you know something if you couldn't easily have been wrong about it. That gets most of them — me and the parcel, the scratchcard, the liar, all cases where I'd have said the same thing even if it had been false. And the kettle one works too, since she'd have been right either way.

  But the psychic one wrecks it. There's no way for "there's no biggest number" to be false, so by my rule he knows it, which is obviously rubbish. Is there a version of the rule that keeps the kettle verdict and still says the psychic doesn't know? And what would it say about the one I keep going back and forth on: my mate said he knew Tom would turn up at the party because he'd invited him and Tom never misses one. Tom did turn up — but only because his car broke down outside and he came in to use the phone.
reasoning: |-
  Okay, the user has a list of scenarios where they're trying to figure out if someone actually "knew" something or just got it right by luck. They've proposed a rule: "you know something if you couldn't easily have been wrong about it." But the psychic cousin example breaks that rule because the statement "there's no biggest number" can't be false, so by their rule, the cousin would "know" it, which feels wrong. 

  Hmm, the user is clearly wrestling with epistemology here—specifically, the definition of knowledge as "justified true belief." Their examples show they intuitively grasp that justification matters, but their initial rule oversimplifies it. The psychic example exposes the flaw: even if the belief is true and couldn't be false, the justification (a psychic) is garbage. That’s why it feels "rubbish." 

  Their flatmate’s kettle example is the opposite: she had multiple valid justifications (steam, sound) but cited a broken light. Since the other senses backed her up, her belief was solid. The mom’s "feeling" about grandad is trickier—it’s shaky justification unless she has a proven pattern (but the user is uneasy, suggesting skepticism). 

  The Tom/party scenario is the juiciest. The friend’s reasoning (Tom always comes) was actually wrong this time—Tom came by accident. So while the belief was true, the justification failed. The user keeps circling back because it’s a perfect example of "true belief by accident." Their discomfort mirrors classic Gettier problems. 

  What they need is a rule incorporating reliable justification. Philosophers already fixed this: add "justification" to "true belief," and insist the justification actually connects to the truth. For the cousin, the psychic isn’t a reliable link to mathematical truth. For Tom’s friend, "always comes" wasn’t why he came—the car broke down. 

  The user’s unease about the mom? Probably because "feelings" aren’t reliable unless proven otherwise. Their intuition is spot-on—they’re independently rediscovering epistemology! I should applaud that and refine their rule with the justification tweak. Also, gently note that some cases (like the mom) need more evidence to settle.
answer: |-
  Your intuition is spot-on—you're grappling with the core philosophical problem of **knowledge vs. true belief**. Your proposed rule ("you know if you couldn't easily have been wrong") captures *reliability*, but the psychic example reveals a gap. Let's refine this using epistemology (the study of knowledge):

  ### The Fix: "You know something if (1) it's true, (2) you believe it, **and (3) your belief is properly connected to the truth**."
  Your "couldn't easily be wrong" rule is part of (3), but we need to ensure the connection isn't accidental. Here's how it applies:

  | Example | Belief | Truth | Connection to Truth | Verdict: "Knew"? |
  |---------|--------|-------|---------------------|------------------|
  | **Parcel Tracking** | "Parcel arrived" | True (but accidental) | App showed wrong data; same belief if false | ❌ No (accidental truth) |
  | **Scratchcard** | "I lost" | True | Correct odds, but belief based on probability, not certainty | ❌ No (lucky guess) |
  | **Pub Liar** | "Road flooded" | True | Source is unreliable liar; truth accidental | ❌ No (accidental truth) |
  | **Kettle Boiling** | "Kettle boiling" | True | Steam/sound provided reliable evidence (even if cited light) | ✅ Yes (proper connection) |
  | **Grandad's Health** | "Bad turn coming" | True | "Feeling" with claimed reliability; needs verification | ⚠️ Maybe (if pattern is real) |
  | **Psychic Cousin** | "No biggest number" | True | Psychic claim; truth necessary (couldn't be false) but connection invalid | ❌ No (accidental truth) |
  | **Tom at Party** | "Tom will come" | True (car broke) | Reasoning flawed ("always comes" was false this time) | ❌ No (accidental truth) |

  ### Why This Works:
  - **The Psychic Example**: Though the belief *couldn't* be false (it's a necessary truth), your cousin's reason (psychic) is **not a reliable connection** to *mathematical truth*. His belief is accidentally true.
  - **The Kettle Example**: Your flatmate’s belief was connected to reality **via reliable evidence** (steam/sound), even if she cited the broken light. She *wouldn’t* have believed it if the kettle was cold.
  - **Tom at the Party**: Your mate believed Tom would come based on a pattern ("Tom never misses"). But the pattern **wasn’t the actual reason** Tom came (car trouble). The truth was accidental—your mate *could easily have been wrong* if Tom’s car hadn’t broken down. This is a classic **Gettier case**: true belief without proper justification.

  ### The Grandad Case: Why It Feels Uneasy
  Your mom’s "feeling" *might* be reliable if her track record holds, but feelings alone aren’t a standard justification. If she’s repeatedly accurate beyond coincidence, it *could* count as knowledge (like a doctor’s intuition). But without evidence, it’s reasonable to be skeptical—it might be hindsight bias or selective memory.

  ### The Refined Rule:
  > **You know P if:**  
  > 1. **P is true**,  
  > 2. **You believe P**, and  
  > 3. **Your belief is based on evidence/reasoning that reliably tracks the truth**  
  >    (i.e., you wouldn’t hold the belief if P were false, *and* your method isn’t flawed).

  This handles all your cases:
  - **Psychic cousin**: Fails (3). His method (psychic) doesn’t track truth.  
  - **Tom’s arrival**: Fails (3). His reasoning ("always comes") didn’t cause the truth.  
  - **Grandad**: Depends on whether the "feeling" reliably tracks health declines (verifiable?).  
  - **Kettle**: Passes (3). Steam/sound are reliable indicators.  
  - **Parcel/Scratchcard/Liar**: Fail (3). Truth was accidental.

  You’ve essentially reinvented the **justified true belief (JTB)** framework—and stumbled into its edge cases! Philosophers like Gettier use scenarios like "Tom at the party" to challenge JTB, showing we need even stricter conditions (e.g., no "epistemic luck"). Your instincts are sharp—keep refining that list!
