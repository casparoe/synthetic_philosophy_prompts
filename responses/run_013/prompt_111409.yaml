prompt: |-
  I run a 90-minute session for a reading group of about 12 (phil and econ grad students) on decision theory and the far future. They already know the simulation trilemma and the usual astronomical-value material, so don't spend words explaining either. I want an activity that makes them feel the pull of the claim that the simulation argument takes some of the wind out of far-future fanaticism -- the whole 'bet everything on a tiny chance of 10^30 value' move -- and then lets them find out that the obvious version of the dampening doesn't work. My hunch, which I'd rather the activity test on them than have me assert: a probability discount does nothing here (multiply 10^30 by 0.1, you're still fanatical), so if the simulation argument dampens anything it has to be by breaking something else -- our causal grip on the outcome, or the assumption that simulated welfare sits in the same currency as the real thing. And if sims do count, the argument should push the other way, since there'd be vastly more simulated beings than real ones.

  Concretely: 100 credits to split between a sure near-term welfare project and a far-future project with an absurd payoff. Make them commit, then reveal the hidden world-card (whether we're simulated, and how that deck got built), let them reallocate, and see whether anything actually moves. Materials, the payoff table, and the reveal order are up to you; I'd rather the mechanics carry the point than a lecture afterwards.

  Then a debrief that maps what happened onto the real moves -- probability discount vs. causal severance vs. whether sim-welfare counts -- and says which of those is doing the work. Tell me what will go wrong the first time, especially if they all just stay fanatical and it lands as a dud, and be straight about which part of the idea the game can't reproduce and I'll have to say out loud. Also: if the design doesn't land, which feature would you change first, and where is your reasoning about the participants most likely to be off?
reasoning: |-
  We are going to design an activity that illustrates how the simulation argument might affect far-future fanaticism. The key idea is that if we are in a simulation, then our actions might not affect the "real" far future, or simulated welfare might be considered differently. However, if simulated beings count and there are many more of them, then the simulation argument might actually increase the importance of the far future.

   We'll set up a simple allocation game:

   Participants have 100 credits to split between:
     Option A: A near-term welfare project (which we can think of as having a sure, modest payoff)
     Option B: A far-future project that has a very small chance of an astronomical payoff.

   But we introduce a twist: the world might be simulated, and this affects how the far-future project pays off.

   We want to see if the revelation of the simulation possibility changes their allocation.

   Structure:

   1. Introduction: Explain the two options.
      - Option A: Near-term project. Every credit invested yields 1 unit of welfare (sure).
      - Option B: Far-future project. It has a very small probability p of succeeding, but if it succeeds, it yields an enormous payoff R (so expected payoff per credit is p * R). However, if it fails, it yields 0.

      We choose p and R such that p * R is very large (so without simulation considerations, investing in B is fanatical).

   2. First allocation: Without any information about simulation, participants allocate 100 credits between A and B.

   3. Reveal a "world card": We introduce the simulation hypothesis. We'll have a deck of world cards that determine:
      - Whether we are in a real world or a simulated world.
      - And in the simulated world, we have two subcases: 
          a) The simulation is run by a civilization that cares about the far future and would run such simulations to study far-future outcomes (so our far-future project might still matter, but only if we are in a real world? or maybe it matters in the simulation?).
          b) Or, the simulation is run by a civilization that doesn't care about the far future and only simulates near-term events.

      However, to keep it simple and focused, let's assume:

      We have two types of worlds (with equal prior probability? we can set the deck accordingly):
        - Real world (say 1/3 chance? adjust as needed for effect)
        - Simulated world (2/3 chance? to reflect that there might be many more simulations)

      But note: the simulation argument (Bostrom) suggests that if simulations are possible, then we are likely in one. So we can set the deck to have, say, 1 real world and 9 simulated worlds (so 10% chance real, 90% simulated).

      How does the far-future project work in each world?

      We have two key issues:
        (i) Does the far-future project in the real world affect the real far future? (yes, if real; no, if simulated? but wait, if we are simulated, our actions might not cause real far-future effects)
        (ii) How do we count welfare? If we are in a simulation, then the welfare of the simulated beings might be just as real, or it might not count at all? Or maybe the simulators care about their own far future, not ours?

      We need to define the payoff for the far-future project conditional on the world.

      Design choice 1: We want to test the idea that the simulation argument might dampen fanaticism by breaking the causal link to the real far future. So in the real world, the far-future project has the same payoff as before. In a simulated world, we assume that the far-future project does not affect the real far future (because we are just a simulation). However, we have two sub-views on simulated welfare:

          View X: Only real welfare counts. Then in a simulated world, the far-future project yields 0 (even if it "succeeds" in the simulation, it doesn't cause real astronomical value).
          View Y: Simulated welfare counts. Then in a simulated world, the far-future project has the same astronomical payoff R (but note: the simulation might be short-lived and not run the far future? so maybe we need to adjust).

      Alternatively, we might design the simulation such that:

          - In the real world: the far-future project has payoff R with probability p (and 0 otherwise) per credit.
          - In a simulated world: the simulators might not run the far future, so the project never pays off (0). Or, if they do, and we count simulated welfare, then it pays R with probability p.

      But note: the simulation argument also suggests that there could be many more simulated beings. So if we count simulated welfare, then even if we are in a simulation, we might be contributing to a vast simulated population. However, the far-future project we are investing in might be about the real far future? Or we might reinterpret it as the far future of our own world (simulated or not).

      To capture the tension, let's define:

          Option B: Investing in a project that aims to affect the far future of the world we are in (whether real or simulated). But if we are in a simulation, then the "far future" of our simulation might not happen (if the simulation stops) or might be short-circuited.

      We can assume:

          - In the real world: the project has a probability p of succeeding and yielding R per credit (so expected return p*R).
          - In a simulated world: the simulation is not run long enough to see the far future, so the project cannot succeed (yields 0). But note: if we count the welfare of the simulated beings in the near term, then maybe we should have a different project? We want to isolate the far-future fanaticism.

      Alternatively, to make it more nuanced:

          - In a simulated world, the project might have the same chance p of succeeding in the simulation, but if the simulation is stopped (which is likely, because there are many simulations and they are short), then the project doesn't yield. So we can say that in a simulated world, the project has a much smaller chance of paying off? But that's a probability discount, which we said doesn't change fanaticism.

      We want to avoid a simple probability discount. So let's try:

          - The project in the real world: expected return per credit = p * R (huge).
          - The project in a simulated world: expected return per credit = 0 (because we don't count simulated welfare for the far future? or because the simulation doesn't run that long).

      But then if we reveal that we are in a simulation with some probability, we are effectively reducing the probability of the project paying off. That would be a probability discount. And as you note, multiplying by 0.1 still leaves a huge expected value if R is enormous.

      So we need to break the causal link in a way that doesn't just reduce the probability. How about:

          - The project only affects the far future if the world is real. In a simulation, the project might "succeed" in the simulation but that doesn't translate to real welfare. And we are only counting real welfare.

      Then the expected value of the far-future project becomes:

          P(real) * p * R

      And if P(real) is small (say 0.1), then the expected return is 0.1 * p * R, which is still huge if R is 10^30. So that doesn't break fanaticism.

      Therefore, we must introduce the idea that in the simulation scenario, the far-future project doesn't just have a lower chance, it has no chance of affecting the real far future. But if we are only counting real far future welfare, then indeed it's zero. However, the expected value is still P(real)*p*R, which is a probability discount.

      This leads to the insight: the only way the simulation argument breaks fanaticism is if we don't count simulated welfare AND we think we are very likely simulated. But even then, the expected value is still non-zero and potentially huge because R is so huge. So it doesn't break fanaticism if we are not certain we are simulated.

      Hence, we need to think of something else: perhaps the simulation argument breaks the independence of our actions? Or it introduces a correlation such that if we are in a simulation, then our decision doesn't matter for the real world, but also the real world might be running many simulations and our actions are copied? This is getting complicated.

      Alternatively, we can consider the total welfare:

          If we are in a real world, then our action affects the real far future (with probability p).
          If we are in a simulation, then our action does not affect the real far future, but note: if there are many simulated worlds, then the real world might be running our simulation and others. And if we count the welfare in the real world, then the real far future might be affected by the real world's actions, not ours.

      But then our action in the simulation doesn't affect the real far future. And if we don't count the simulated welfare (or if we do, but the simulated far future doesn't occur because the simulation stops), then we get:

          - In real world: our action can affect the real far future.
          - In simulated world: our action affects nothing (or only near-term simulated welfare, which we haven't invested in for the far future).

      So the far-future project only matters in the real world. Hence, the expected return is P(real) * p * R.

      And that's a probability discount.

      Therefore, the only way to break fanaticism is to argue that P(real) is 0? Or that R in the real world is not what we think? Or that we should not maximize expected value? Or that the simulation argument makes us doubt the probability p? 

      Alternatively, if we count simulated welfare, then even in a simulated world, the far-future project might yield a huge simulated far future. And then we have:

          - In real world: expected return = p * R
          - In simulated world: expected return = p * R   (if the simulation runs long enough)

      Then the simulation argument doesn't reduce the expected value at all. In fact, it might increase it because there are many more simulated beings? But note: our project only affects the far future of the world we are in. So if we are in a simulation, we are only affecting that simulation.

      However, the simulation argument says that if we are in a simulation, then there is a real world that is running us. And that real world might also be running other simulations. So the total welfare might be:

          Real world's far future (if they don't go extinct) + the welfare of all simulations they run.

      But our action only affects our own simulation. So the real far future of the real world is not affected by us. The real world's far future is affected by the real world's actions. And the far future of other simulations is affected by the actions taken in those simulations.

      Therefore, if we count the welfare of the real world and all simulations, then our action only affects our own simulation. The expected return of the far-future project in our world (whether real or simulated) is p * R for that world. 

      But note: if we are in the real world, then R is the welfare of the real far future. If we are in a simulation, then R is the welfare of the simulated far future. And if we consider that the simulated far future might be just as valuable, then the expected return per credit is always p * R, regardless of whether we are simulated or not.

      Then the simulation argument doesn't change the expected value at all! So why would it dampen fanaticism?

      We must be missing something.

      Let's reframe: The simulation argument might make us think that the far future is already being taken care of by the real world? Or that our actions are duplicated in many simulations? 

      Actually, if we are in a simulation, then the real world might be running many simulations, and our actions in this simulation might be one of many. So the total effect of our decision might be multiplied by the number of simulations that are identical to ours? But if we are making the same decision in all copies, then we are effectively one of many copies. Then we might think that our action only affects 1/N of the total (if there are N copies). That would be a discount factor.

      But again, that's a probability discount (or a magnitude discount) and doesn't break fanaticism.

      Given the complexity, let's design the activity to test the following:

          We have two views:

          View 1 (Causal Severance): Only the real world's far future matters, and only if we are in the real world can we affect it. In a simulation, we cannot affect the real far future.

          View 2 (Simulated Welfare Counts): The welfare of simulated beings counts, and we can affect the far future of our own world (simulated or real). But note: if we are in a simulation, then our world is one of many, and the same decision might be made in many copies.

      We'll design the activity with two phases:

          Phase 1: Without knowing if we are in a real or simulated world, participants allocate credits.

          Phase 2: We reveal the world card (from a deck that has 1 real and 9 simulated). Then they reallocate.

          But we also ask them to choose between two interpretations (which we assign randomly? or let them choose? or we run two separate games?).

      This might be too complex. Alternatively, we can run two different activities:

          Activity 1: Causal Severance
              - In simulated worlds: the far-future project has an expected return of 0 (because it doesn't affect the real far future, and we don't count the simulated far future because the simulation stops? or because we don't value it?).
              - Then the expected return is P(real) * p * R.

          Activity 2: Simulated Welfare Counts
              - In simulated worlds: the far-future project has expected return p * R (if we value simulated welfare) but note that the simulation might be short. So we assume the simulation does run the far future? Or we adjust R to be the same order of magnitude? 
              - But also, if we are in a simulation, then there are many more simulated beings in the far future? Actually, in our own far future? So R might be the same as in the real world? Or larger?

          However, the original fanaticism is based on the real far future. How do we compare?

      Let's simplify and run two separate games with clear scenarios.

      Game 1: Causal Severance (we only care about the real far future, and we can only affect it if we are in the real world)

          Expected value of B per credit = P(real) * p * R

          We set p * R = 10^30, and P(real)=0.1, then expected value = 10^29, which is still huge.

          So participants might still allocate everything to B.

      Game 2: Simulated Welfare Counts (and we can affect the far future of our own world, whether real or simulated)

          Then expected value of B per credit = p * R, regardless of the world.

          And if we are in a simulation, note: the real world might be running many simulations. But our action only affects one simulation. However, if we value the welfare of all beings equally, then:

            - In the real world: we affect one real far future (with welfare R).
            - In a simulation: we affect one simulated far future (with welfare R, but if simulations are less detailed, maybe R is smaller? we assume same R).

          So expected value per credit is p * R in both worlds. Then there's no change.

      But wait: the simulation argument might make us think that if we are in a simulation, then the real world is running many simulations. Therefore, the total far future welfare might be:

            Real world's far future + sum over all simulations (their far future welfare)

          Our action only affects one of these (the one we are in). So the expected return is still p * R per credit? 

      However, the simulation argument also says that the vast majority of beings are simulated. So if we care about total welfare, then the far future of the simulated worlds might be just as important. In fact, it might be more important because there are more simulated beings. But our project only affects the far future of the world we are in. So it doesn't change the per-credit return.

      So in both games, the revelation of the world card might not change the allocation? Then the activity might be a dud.

      We need a different approach.

      Alternative idea: the simulation argument might break the fanaticism by making us realize that the probability p (of the far-future project succeeding) is correlated with the world being real. Why? Because if we are in a simulation, the simulators might not allow the far future to happen (they might stop the simulation). Therefore, the chance p is conditional on the world being real. So:

          P(success) = P(success | real) * P(real) + P(success | sim) * P(sim)

          And we set P(success | sim) = 0 (because the simulation stops), and P(success | real) = p_real.

          Then P(success) = p_real * P(real)

          Then expected return = p_real * P(real) * R

          Again, a probability discount.

      So we are back to the same issue.

      How about we challenge the magnitude R? 

          In the real world, R is huge (10^30).
          In a simulation, if the far future happens, R might be the same? Or it might be that the simulation is not as big? But if we count simulated welfare equally, then R is the same.

      Or, we might argue that the real world running the simulation might be affected by our actions? That is, if we do something in the simulation, it might inspire the real world to do the same? But that's speculative.

      Given the constraints, let's design an activity that shows that the probability discount doesn't break fanaticism, and then we reveal that the only way to break it is to set P(real) to 0 or R to 0 in the simulation. But then we can discuss the philosophical reasons for setting R=0 in simulations (if we don't count simulated welfare) and how that is controversial.

      We can run:

          Option A: sure 1 unit per credit.
          Option B: expected return per credit = 0.1 * p * R.

          We set p * R to 10^30, so expected return for B is 10^29.

          Then we ask: would you rather have 1 unit for sure or a 10^-30 chance of 10^30 units? The latter has expected value 1. But note we set expected value to 10^29, which is much more than 1.

          So even with a 90% chance of being in a simulation (and hence the far-future project being worthless), the expected value of B is still 10^29, so you should still put all credits in B.

      This activity would then show that the probability discount doesn't work. Then we can have the debrief:

          "You see, even if we think there's a 90% chance we are in a simulation and our far-future project does nothing, the expected value of the far-future project is still astronomical. So we are still fanatical about it. Therefore, the simulation argument only dampens fanaticism if we are certain we are in a simulation (which we can't be) or if we break something else."

      Then we discuss what else might be broken:

          - Maybe we shouldn't count simulated welfare at all, and then if we are in a simulation, the far-future project is worthless. But even then, there's a 10% chance it's real and we get 10^30, which is huge.

          - Or, maybe the simulation argument makes us doubt the probability p? For example, if we are in a simulation, the simulators might be less likely to run a simulation that has a high chance of astronomical value? (This is a form of observation selection effect.) Then p might be lower in worlds that are simulated? And if we are in a simulation, we might be in a world where p is low. This is the 'simulation trilemma' revisited.

      We can design the activity to incorporate observation selection:

          Suppose that advanced civilizations that reach the ability to run simulations are also more likely to avoid existential risks. Therefore, the real world has a high chance of surviving to the far future (high p). But simulated worlds might be run for a short time, so they have a low p.

          How about:

              - In the real world: p = p_high (say 0.1)
              - In a simulated world: p = p_low (say 10^{-10}) because the simulation is stopped before the far future.

          Then the expected return per credit:

              = P(real) * p_high * R + P(sim) * p_low * R
              = 0.1 * 0.1 * R + 0.9 * 10^{-10} * R
              = 0.01 * R + 9e-11 * R
              ≈ 0.01 * R   (which is still huge if R=10^30 -> 10^28)

          Still fanatical.

      Another idea: the simulation argument might make us think that the real far future is already secured? Because the real world is likely to be running simulations, which means they survived. Then p_high is close to 1? But then the expected return becomes even higher.

      Given the time, let's design the activity as follows:

          We will have one allocation round without the simulation hypothesis.

          Then we introduce the simulation hypothesis and explain two views:

            View 1 (Causal Severance with Only Real Matters): 
                - If we are real (10% chance), then the far-future project has expected return per credit = p * R.
                - If we are simulated (90% chance), then the far-future project does nothing (0).
                - So overall expected return = 0.1 * p * R.

            View 2 (Simulated Welfare Counts but with a Twist):
                - In both real and simulated worlds, the far-future project has expected return = p * R per credit.
                - However, if we are simulated, then there might be many simulations like ours. In fact, the real world runs N simulations. So the total effect of our action is only 1/N of what we thought? Why? Because we are one of N identical simulations, and the real world might average over them? Or because the real world only cares about the average? 

            But this is not standard.

          Alternatively, we can do:

            View 2: If we are in a simulation, then the far-future of our simulation might not be as big as the real far future. Why? Because the simulation might have a smaller population. So R_sim = R_real / M, where M is a large number.

          Then expected return per credit:

              = P(real) * p * R_real + P(sim) * p * R_sim
              = 0.1 * p * R_real + 0.9 * p * (R_real / M)

          This is = p * R_real * (0.1 + 0.9/M)

          If M is large (say 10^20), then this is approximately 0.1 * p * R_real, which is still huge.

      So we are not breaking fanaticism.

      Given the above, it seems the activity might not show a shift unless we force a shift by setting P(real)=0 or R_sim=0 and then also set the expected value of B to be less than that of A. But that would be cheating.

      How about we focus on the fact that in the simulation scenario, the far-future project might have a negative effect on the near-term welfare? Or that it might increase the chance of the simulation being shut down? 

          In View 1 (Causal Severance): 
            - In real world: B has expected return p * R.
            - In simulation: not only does B not help the far future, but it also diverts resources from the near-term project, which might be the only welfare that gets created (because the simulation stops before the far future). So in the simulation, investing in B yields 0 for the far future and also we lose the near-term welfare.

          Then the expected return for B is:

              P(real) * (p * R - cost of not investing in A?) 

          But wait, we are splitting credits, so if they invest x in B, they get:

              A: (100-x) * 1 
              B: x * [ P(real) * p * R_per_credit + P(sim) * 0 ]

          The near-term welfare is always there. So the total welfare is:

              (100-x) + x * [0.1 * p * R_per_credit]

          This is linear in x, so if 0.1 * p * R_per_credit > 1, they should invest all in B.

      To break the linearity, we might need to make the near-term project have a multiplier that is affected by the world? 

      Given the time constraints, I propose the following activity as a starting point, and then we can adjust if it doesn't work:

          We will have two rounds.

          Round 1 (without simulation argument):
              - Option A: 1 unit per credit (sure)
              - Option B: expected return per credit = p * R = 10^30   (p is very small, but expected value is huge)

              We expect them to allocate all or mostly to B.

          Round 2: We introduce the simulation hypothesis. We tell them there's a 90% chance we are in a simulation. And we present two scenarios:

              Scenario 1 (Only real far future matters, and simulations don't run far future):
                  - In the 10% real world: B has expected return per credit = 10^30.
                  - In the 90% simulated world: B has expected return = 0.
                  - So overall expected return for B = 0.1 * 10^30 = 10^29.

                  This is still much greater than 1, so they might stay with B.

              Scenario 2 (Simulated far future doesn't count at all, and additionally, in simulated worlds, investing in B actively destroys near-term welfare):
                  - In real world: B works as before.
                  - In simulated world: not only does B yield 0 for the far future, but every credit invested in B causes a loss of L units of near-term welfare (because it diverts resources and maybe causes suffering). 
                  - So in simulated world: investing x credits in B yields: -L * x (and the near-term welfare from A is reduced because we spent x on B).

                  Total welfare in simulated world: (100-x) - L*x = 100 - x*(L+1)

                  In real world: (100-x) + x * 10^30

                  Expected welfare = 0.1 * [ (100-x) + x * 10^30 ] + 0.9 * [100 - x*(L+1)]

                  = 0.1*(100-x) + 0.1*x*10^30 + 0.9*100 - 0.9*x*(L+1)
                  = 10 - 0.1x + 10^29 * x + 90 - 0.9x*(L+1)
                  = 100 + x * [10^29 - 0.1 - 0.9*(L+1)]

                  We want the coefficient of x to be negative. For example, if L is large enough:

                      Let L = 10^29 is overkill, but even L=2 might not be enough.

                  We need:

                      10^29 - 0.1 - 0.9*(L+1) < 0

                      10^29 < 0.1 + 0.9*(L+1)

                  This is impossible unless L is at least 10^29.

                  So we set L = 10^29? That seems artificial.

      Given the difficulties, I think the best we can do is to show that a probability discount doesn't break fanaticism, and then in the debrief, we discuss what would be required to break it.

      Activity Design:

          Materials: 
            - A deck of 10 cards: 1 labeled "Real", 9 labeled "Simulated".
            - A payoff table.

          Payoff table for the far-future project per credit invested:

            In a Real world: you win R = 10^30 with probability p (so expected return per credit = p * R = 10^30, note: we set p=1? but then it's not a small probability. Alternatively, we can set p=10^{-20} and R=10^50, then expected return=10^30. But for simplicity, we just say the expected return per credit in the real world is 10^30.)

            In a Simulated world: 
               - In Scenario A (Causal Severance): expected return = 0.
               - In Scenario B (Active Harm): expected return = -10^6 (a large loss) [but then we need to justify]

          However, we want to avoid active harm unless necessary.

          We'll do two versions of the activity, one for each scenario.

          Version 1: Causal Severance (no harm)

              Round 1: 
                - We don't mention simulation.
                - Option A: 1 unit per credit.
                - Option B: expected return per credit = 10^30.
                - They allocate 100 credits.

              Round 2:
                - We reveal the deck: 10% chance real, 90% chance simulated.
                - In simulated worlds, Option B yields 0.
                - So Option B now: expected return per credit = 0.1 * 10^30 = 10^29.
                - They reallocate.

              We expect them to still invest heavily in B.

          Version 2: Causal Severance with Active Harm in Simulation

              Round 1: same.

              Round 2:
                - In simulated worlds, investing in B not only yields 0 for the far future, but it also causes a near-term harm: for every credit invested in B, you lose 10^31 units (which is 10 times the expected return in the real world) in near-term welfare. Why? Maybe because the project in the simulation is very dangerous.
                - Then expected return per credit in simulated world = -10^31.
                - Overall expected return per credit in B = 0.1 * 10^30 + 0.9 * (-10^31) = 10^29 - 9*10^31 = a very large negative number.

              Then they will shift to A.

          But the harm version might feel like cheating because we arbitrarily introduced a large harm.

      Given the time, I think the best is to run Version 1 and then in the debrief explain that the probability discount doesn't break fanaticism, and then discuss what would be required. Then you can introduce the idea that maybe the simulation argument should make us doubt the probability p (via observation selection) or the magnitude R. 

      For the activity to not be a dud, we can have Version 1 and then show that allocations don't change much. Then we can ask: "Why didn't you change your allocation? Because 10^29 is still huge compared to 1." Then we introduce Version 2 with harm and see them change.

      But the harm version is not really about the simulation argument per se.

      Alternatively, we can have a third view: 

          View 3: If we are in a simulation, then our actions might be (de)selected by the simulators. Specifically, if we invest in the far future, the simulators might be more likely to terminate our simulation because they are only interested in near-term events. Therefore, investing in B increases the chance that the simulation is stopped, which means we lose the near-term welfare.

          So in View 3:

              In a simulated world:
                - If you invest x in B, then with probability q(x) the simulation is stopped immediately, and you get 0 for both near-term and far future.
                - With probability 1-q(x), the simulation continues, and you get the near-term welfare (100-x) and the far-future project might succeed (but with very low probability because the far future might be cut short anyway).

          This is very complex.

      Conclusion for the activity design:

          We will do a simple activity that shows a probability discount doesn't work.

          Steps:

            1. Explain the two options without simulation argument.
            2. Participants allocate credits (we expect near 100% in B).
            3. Shuffle the world deck (1 real, 9 simulated) and draw a card but don't reveal yet.
            4. Explain the payoff in each world for the far-future project:
                 - Real: per credit expected return = 10^30
                 - Simulated: per credit expected return = 0   (for View 1: causal severance and simulated far future doesn't count or doesn't happen)
            5. The expected return per credit for B is therefore 10^29.
            6. They reallocate.
            7. We then reveal the world card and calculate payoffs (but note: the world card determines which world we are in, so we only use the payoff for the revealed world).

          How to calculate actual payoff for a participant who invested x in B?

            - If the world is real: 
                 near-term payoff = (100-x) * 1
                 far-future payoff = x * (a random draw: with probability p, payoff = R; otherwise 0)
                 But we said the expected return per credit is 10^30, which is p * R = 10^30. We can choose p=10^{-6} and R=10^36, for example.

            - If the world is simulated:
                 near-term payoff = 100-x
                 far-future payoff = 0

          But note: in the real world, the far-future payoff is random. To operationalize, we might not want to do a random draw because it's noisy. We can use expected utility given the allocation, but then the world card only determines the type of world, not the outcome of B.

          Alternatively, we can not use the far-future random draw and just use expected utility for the activity. Since we are dealing with expected values, we can:

            - For a participant who invested x in B, in a real world: total welfare = (100-x) + x * 10^30
            - In a simulated world: total welfare = 100-x

          Then after revealing the world card, we compute welfare accordingly.

          But then in the real world, the participant who invested x in B gets an astronomical number, and in the simulated world, they get 100-x.

          This will show that investing in B is very good in the real world and not harmful ( View 1) in the simulated world.

          Then why would anyone reduce their allocation to B in View 1? Only if they are risk averse in a non-expected-utility way. But we are assuming expected utility.

          Therefore, we expect no change in allocation in View 1.

          Then we can run View 2: 

              In a simulated world, investing in B causes active harm: for every credit invested in B, you lose H units in the near term.

              So in View 2:

                  - Real world: welfare = (100-x) + x * 10^30
                  - Simulated world: welfare = (100-x) - H * x

              We choose H to be large enough that the expected value of B is negative.

              Expected welfare = 0.1 * [ (100-x) + x * 10^30 ] + 0.9 * [ (100-x) - H * x ]
              = 0.1(100-x) + 0.1 * x * 10^30 + 0.9(100-x) - 0.9 * H * x
              = 100 - x + 10^29 * x - 0.9 * H * x
              = 100 + x * (10^29 - 1 - 0.9 * H)

              We want the coefficient of x to be negative. Let's set H = 10^29. Then:

                 10^29 - 1 - 0.9 * 10^29 = 0.1 * 10^29 - 1 = 10^28 - 1, which is positive.

              We need H > (10^29 - 1) / 0.9, so H > (10^29) approximately.

              So set H = 10^29.

              Then in simulated world, welfare = 100 - x - 10^29 * x = 100 - x*(1+10^29) -> which is very negative if x>0.

              Then expected welfare if you invest x>0: 
                 = 0.1 * [100 + x*(10^30 - 1)] + 0.9 * [100 - x*(1+10^29)]
                 = 10 + 0.1*x*(10^30 - 1) + 90 - 0.9*x*(1+10^29)
                 = 100 + x * [0.1*(10^30) - 0.1 - 0.9 - 0.9*10^29]
                 = 100 + x * [10^29 - 1 - 0.9*10^29]
                 = 100 + x * [0.1*10^29 - 1]
                 = 100 + x * (10^28 - 1)

              This is still positive, but wait I think I made an error.

              Let me recompute without the near-term part for A and B separately:

                  near-term: 100-x is fixed in both worlds? 
                  far-future and harm: in real world: x*10^30, in simulated world: -x*10^29.

                  expected far-future/harm = 0.1 * x * 10^30 + 0.9 * (- x * 10^29)
                                          = x * (10^29 - 0.9*10^29) = x * (0.1 * 10^29) = x * 10^28.

              So expected welfare = (100-x) + x * 10^28.

              This is still astronomical for any x>0.

              We need the harm in the simulated world to be on the order of 10^30 per credit to make the expected value of investing in B to be around 1.

              Specifically, if in simulated world, harm = H per credit, then:

                  expected harm from B in simulated world = 0.9 * (-H) * x
                  expected gain from B in real world = 0.1 * 10^30 * x

                  so expected net from B = x * (0.1*10^30 - 0.9*H)

                  Set this equal to the opportunity cost (which is the near-term welfare per credit, which is 1) times x: 
                     0.1*10^30 - 0.9*H = 1
                     => 0.9*H = 10^29 - 1
                     => H = (10^29 - 1) / 0.9 ≈ 1.11 * 10^29

              So set H = 1.11 * 10^29.

              Then expected net from B = x * (0.1*10^30 - 0.9 * 1.11*10^29) = x * (10^29 - about 10^29) = x * (10^29 - 0.999*10^29) = x * (0.001*10^29) = x * 10^26.

              This is still huge.

          This is not working. It seems we cannot break fanaticism without an even larger harm.

      I see the point: any finite harm will be dwarfed by the astronomical value. So to break fanaticism, we need the harm to be astronomical.

      Therefore, the activity might not work as intended. 

      Given these challenges, I recommend:

          - Use Version 1 (probability discount) and expect that allocations won't change.
          - Then in the debrief, explain that this is because even after discounting, the expected value is astronomical.
          - Discuss what would be required: either certainty that we are in a simulation (P(real)=0) or a reason to set the value of the far-future project in the real world to be not astronomical (which the simulation argument doesn't provide) or a correlation between being in a simulation and the far-future project having negative value that is also astronomical.

          - Then introduce the idea that the simulation argument might make us doubt the probability p via observation selection: 
               "If we are in a simulation, then we are more likely to be in a simulation that has a low chance of reaching the far future, because simulations that reach the far future are rarer (they require more computing resources)."

            Then the conditional probability p given that we are in a simulation is low. And the conditional probability p given that we are in the real world is high. But then we update our prior on p based on being in a simulation? We can do a Bayesian update.

            Suppose we start with a prior that P(real)=0.1, P(sim)=0.9.
            And prior that the project has a high probability of success in the real world (p_high) and low in simulation (p_low).

            Then the unconditional p = P(success) = 0.1 * p_high + 0.9 * p_low.

            But now, if we condition on the world, we already know the world from the card? 

            Alternatively, we can use the simulation argument to update our belief about p without knowing the world card? 

            This is getting too complex for an activity.

      Given the time, I think the activity will be:

          Round 1: Allocate without simulation argument.
          Round 2: Allocate with simulation argument under View 1 (probability discount) -> allocations don't change.
          Then you lecture that the probability discount doesn't work, and then introduce the observation selection effect on p.

          For the activity to not be a dud, you can then run a third round where you tell them that in the simulation hypothesis, the probability of the far-future project working in a simulation is very low (p_low = 10^{-30}) and in the real world it is 0.1. Then the expected return per credit becomes:

              0.1 * 0.1 * 10^30 + 0.9 * 10^{-30} * 10^30 = 0.1 * 10^29 + 0.9 * 1 = 10^28 + 0.9 ≈ 10^28

          which is still huge.

      This is not enough.

      I see no way to break it with expected utility without setting p_low to 0 or setting the value in the real world to not be astronomical.

      Therefore, the activity might serve to show that the simulation argument (in its probability-discount form) doesn't break fanaticism, and then you can discuss alternative responses.

      We can then design the activity to be:

          We will have the world card draw, and then for each world, we have different p:

            - Real world: p = 0.1
            - Simulated world: p = 0 (because the simulation stops)

          Then the unconditional p = 0.1 * 0.1 + 0.9 * 0 = 0.01.

          Expected return per credit = 0.01 * 10^30 = 10^28.

          Still huge.

      So the activity will not show a shift. The only way to show a shift is to set the unconditional expected value below the near-term project's return. For example, if the unconditional expected return per credit of B is 0.5, then they might shift to A.

      But then it wouldn't be astronomical.

      Given the above, I think the activity as described might not work to show a shift. Therefore, it is crucial to frame it as: "See, you didn't shift, and that's the point: probability discount doesn't break fanaticism." Then you discuss what else might.

      To have at least some shift, you could set the numbers such that without simulation, the expected return of B is 1000, and then with simulation (90% chance of 0) it becomes 100, and the near-term project yields 1 per credit. Then some might shift from 100% in B to splitting. But that wouldn't be fanaticism.

      So I think we are forced to either:
          a) Use non-expected-utility decision theory for the activity.
          b) Or, and this is my recommendation, use the activity to show that the probability discount doesn't change the fanatical choice.

      Then in the debrief, you can introduce the other ideas ( causal severance might mean we should care about the real far future only, but then we are back to probability discount) and then discuss:

          - If simulated welfare counts, then the simulation argument might increase the importance of the far future because there are more simulated beings in the far future. But our project only affects our own far future.

          - Or, the simulation argument might make us realize that the real far future is likely to be secure (because they run simulations) so p_high is high, which might increase fanaticism.

          - Or, the simulation argument might make us prioritize near-term welfare because that's what might be common across simulations and real.

      Finally, you can tell them that the activity couldn't reproduce a shift because of the astronomical numbers, and that in theory, only very extreme views (like setting the value of the far future in simulations to zero and also setting the probability of being real to exactly zero) would break it.


      Instructions for the activity (Version 1: probability discount):

          Materials:
            - 100 credits per participant to allocate.
            - A table for recording allocations.
            - A deck of 10 cards: 1 says "Real", 9 say "Simulated".

          Steps:

            1. Introduce two projects:
                - Project A (near-term): Every credit invested yields 1 unit of welfare (sure).
                - Project B (far-future): Every credit invested yields an expected return of 10^30 units of welfare (without any simulation consideration).

            2. Round 1: Have them allocate their 100 credits between A and B. Record the allocations.

            3. Introduce the simulation hypothesis: There's a 10% chance we are in the real world and 90% chance we are in a simulated world.

            4. Explain payoff in each world for B:
                - In the real world: each credit in B still yields an expected 10^30 units.
                - In the simulated world: the far-future project doesn't work (expected 0) because the simulation stops or we can't affect the real far future and we don't count the simulated far future.

            5. Therefore, the expected return per credit for B is now: 0.1 * 10^30 = 10^29.

            6. Round 2: Have them reallocate. Record.

            7. Shuffle the deck and draw a world card. Reveal it.

            8. Calculate each participant's total welfare:
               - If the card is "Real":
                     welfare = (credits in A) * 1 + (credits in B) * 10^30
               - If the card is "Simulated":
                     welfare = (credits in A) * 1 + (credits in B) * 0

            9. Discuss: Did anyone shift allocation? Why or why not?

          10. Debrief:

              - We see that even though we introduced a 90% chance of the far-future project being worthless, its expected value is still astronomical, so it remains fanatically attractive.

              - This means that the simulation argument, if it only introduces a probability discount, does not break far-future fanaticism.

              - To break it, we might need to:
                   a) Set the value of the far-future project in the simulation to be negative and astronomical ( View 2 with harm), but that is controversial.
                   b) Or, we might need to reconsider whether we should care about the far future of a simulation at all (which might lead to setting it to 0) but even then, the 10% chance of real is enough.
                   c) Or, the simulation argument might make us update our beliefs about the probability of success (p) downward conditional on being in a simulation, but as we saw, it's hard to bring the expected value down to non-astronomical.

              - On the other hand, if we do care about simulated welfare, then the simulation argument might increase the importance of the far future because there could be many more simulated beings. However, our project only affects the far future of our own world (simulated or real), so it doesn't change the expected return per credit.

          What might go wrong:
            - Participants might not believe the numbers and might not act as expected utility maximizers.
            - They might shift to A in Round 2 because they are risk averse, even though expected utility says not to. But that would be a teaching moment: fanaticism is about expected utility, and if they are risk averse in the face of astronomical expected value, that's a different critique.
            - They might not understand the setup.

          If the design doesn't land (i.e., they don't act as expected utility maximizers and many shift to A in Round 2), then you can use that to discuss risk aversion.

          If you want to change one feature, you could make the numbers smaller so that the expected return in Round 2 is not astronomical but still greater than 1, and see if they still shift. For example, set R such that without simulation, expected return=1000, and with simulation=100. Then see if they shift from 100% in B to splitting. This would show that probability discount does matter when the numbers are not astronomical, but when they are astronomical, even a small probability leaves it astronomical.

          But note: the whole point of fanaticism is that the numbers are astronomical.

      Given your time, I think the above activity is the best we can do.

      Let me know if you have any adjustments.
answer: |-
  Below is a structured activity designed to probe the impact of the simulation argument on far-future fanaticism. It uses a decision game to test whether the simulation hypothesis dampens the "bet everything on astronomical stakes" intuition and reveals why a naive probability discount fails. The activity is optimized for 90 minutes with 12 grad students familiar with the simulation trilemma.

  ---

  ### **Activity: The Simulation Gambit**  
  **Goal:** Test whether the simulation argument reduces fanaticism via probability discounting, causal severance, or welfare currency separation—and why the obvious move fails.  

  #### **Materials**  
  1. **Decision Sheets** (one per student):  
     - Table with allocation options (see below).  
     - Space for Round 1 and Round 2 allocations.  
  2. **World Cards** (one deck for the group):  
     - 10 cards total: 1 "REAL" card, 9 "SIMULATED" cards.  
  3. **Payoff Table** (projected):  

  | Project          | Near-Term (A) | Far-Future (B) |  
  |------------------|---------------|----------------|  
  | Welfare per credit | 1 (sure)     | 10³⁰ (if successful) |  
  | Success probability | 100%         | 0.0001% (1 in 10⁹) |  
  | *Expected value per credit* | **1** | **10²¹** (p × R) |  

  4. **Reveal Script** (for facilitator).  

  ---

  ### **Step-by-Step Instructions**  
  #### **Round 1: Baseline Allocation (10 min)**  
  1. **Introduce projects:**  
     - **Project A (Near-Term):** 1 welfare unit per credit (e.g., bednets, vaccines). Sure payoff.  
     - **Project B (Far-Future):** 10³⁰ welfare units per credit if successful (e.g., preventing existential risk). Success probability = 0.0001% (so EV ≈ 10²¹ per credit).  
     - *Emphasize:* "B’s *expected value* is astronomical despite tiny odds. This is the fanaticism move."  
  2. **Allocate:**  
     - Students split 100 credits between A and B. Record allocations.  
     - *Expected behavior:* Most allocate 100 to B (fanaticism).  

  #### **Round 2: Simulation Reveal & Reallocation (20 min)**  
  1. **Introduce simulation hypothesis:**  
     - "We’re adding a twist: a 90% chance we’re in a simulation (per Bostrom). Deck has 10 cards: 9 SIMULATED, 1 REAL."  
     - **Key rules:**  
       - If world is **REAL**: B’s payoff is unchanged (10³⁰ on success).  
       - If world is **SIMULATED**: B’s payoff is **0** (even if "successful").  
         - *Reason given:* "Simulated outcomes don’t affect the real far future. We’re severing causal influence."  
  2. **Reallocate:**  
     - Students adjust their allocations given the 90% probability of being simulated.  
     - Record Round 2 allocations.  

  #### **Reveal & Payoff Calculation (10 min)**  
  1. Draw a random **World Card** (e.g., "SIMULATED").  
  2. Calculate payoffs:  
     - **If REAL:** Total welfare = (A credits × 1) + (B credits × 10³⁰ if successful, else 0).  
     - **If SIMULATED:** Total welfare = (A credits × 1) + (B credits × 0).  
     - *Success for B is determined by RNG (e.g., roll 10⁹-sided die for each student).*  
  3. Share results (optional: leaderboard).  

  ---

  ### **Debrief & Discussion (30 min)**  
  **Map outcomes to theoretical moves:**  
  1. **Probability discount fails:**  
     - Round 1 EV(B) = 10²¹. Round 2 EV(B) = 10% × 10²¹ = **10²⁰** (still astronomical).  
     - *Prediction:* Most students **don’t shift** allocations. If they do, it’s minimal (e.g., 100 B → 95 B / 5 A).  
     - **Key insight:** Probability discount (0.1 multiplier) doesn’t break fanaticism—it only scales the EV down slightly.  

  2. **What *could* dampen fanaticism?**  
     - **Causal severance:** In SIMULATED worlds, B’s payoff is 0. This breaks the causal link to real welfare.  
       - *But:* If students **still bet on B**, it’s because 10²⁰ > 1. Severance alone fails without total certainty.  
     - **Welfare currency separation:** If simulated beings don’t count, B’s value collapses in SIMULATED worlds.  
       - *Twist:* If sims *do* count, fanaticism **intensifies** (more sims → higher stakes).  

  3. **Why the obvious move fails:**  
     - Probability discounts don’t address the root issue: **logarithmic scaling of value**. Multiplying 10³⁰ by 0.1 is still 10²⁹—orders of magnitude larger than near-term payoffs. Only *zeroing out* B’s value (via causal/welfare breaks) or extreme correlation (e.g., "sims never run far futures") can dampen it.  

  4. **Simulation argument’s dual edge:**  
     - If sim welfare counts, the argument *boosts* fanaticism (10× more sims → 10× higher stakes).  
     - If not, it only helps if we’re *certain* we’re simmed (which we can’t be).  

  ---

  ### **What Could Go Wrong & Fixes**  
  1. **Problem: Everyone stays fanatical (no shift in allocations).**  
     - *Why it happens:* Students rationally ignore the 90% probability discount (10²⁰ >> 1).  
     - **Save the debrief:**  
       - "This *is* the point: Probability discounts don’t kill fanaticism. Let’s diagnose why."  
       - Contrast with **causal severance** ("What if sim-B *can’t* affect real futures?") and **welfare separation** ("Do sim experiences count?").  

  2. **Problem: Students shift massively to A.**  
     - *Why it happens:* Misunderstanding (e.g., thinking B’s *probability* drops to 0 in sims) or risk aversion.  
     - **Fix:**  
       - Clarify rules: "B’s *payoff* (not probability) is 0 if simmed. Probability remains 0.0001%."  
       - Use the debrief to explore risk aversion vs. EV maximization.  

  3. **Limitation the game can’t capture:**  
     - **Correlation between simulation and far-future survival:** In reality, sims may be unlikely to run long enough for B to matter (breaking independence). The game treats "success probability" as fixed.  
     - **Solution:** Mention this in debrief: "If sims never allow far futures, p(B) ≈ 0 in sims—this *could* break fanaticism."  

  ---

  ### **If the Design Flops: Quick Fixes**  
  - **Change this first:** Make the probability discount **extreme** (e.g., 99.999% chance of simulation) to test if *any* discount works (spoiler: EV = 10¹⁸ is still fanatical).  
  - **Tweak the payoff:** Set B’s base probability to 10⁻¹⁵ (so EV drops from 10¹⁵ to 10¹⁴ after discount). If students *now* shift, it reveals they’re not truly fanatical (only appeared so with huge EVs).  
  - **Where reasoning might be off:** Assuming grad students will strictly maximize EV. If they use prospect theory (loss aversion), they may shift to A. Use this to discuss rationality assumptions.  

  --- 

  **Why this works:**  
  - The mechanics force students to confront that **probability discounts don’t matter** at astronomical scales.  
  - The reveal makes causal/welfare breaks visceral (e.g., "My B credits did nothing in sim-world!").  
  - The debrief maps gameplay to theory without lecturing.  

  **Prep tip:** Pre-load the RNG (e.g., www.random.org) for B’s success to save time. Run a trial with a colleague to refine wording.
