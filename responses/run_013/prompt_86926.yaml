  First, I need to extract patterns from the six cases. Case 1 (bent weapons in bog) and Case 2 (sealed deposit under threshold) are ritual despite different contexts, suggesting intentionality is key. Case 3 (random midden refuse) is ordinary, while Case 4 (ordered pit at entrance) is ritual - so location and arrangement matter. Case 5 (burnt grain) is accidental despite high cost, and Case 6 (flexed burial) is ritual but beliefs are off-limits. 

  The supervisor's explicit distinctions give important clues: she separates structured (non-random patterning) from costly (value withdrawal), and insists practice → belief inference only. This suggests her ritual criteria focus on observable actions rather than subjective meaning.

  For candidate rules, I consider several possibilities. Rule A (structured + costly) fits Cases 1,2,4 but fails Case 6 (cemetery burials aren't "costly" in her terms). Rule B (structured OR costly) is too broad - it would misclassify Case 3 as ritual if we imagine hypothetical value. Rule C (structured AND non-accidental) handles Cases 1,2,4,6 and excludes Case 5, but needs refinement for Case 3's randomness. 

  The winner seems Rule D: structured AND non-utilitarian. "Structured" covers deliberate patterning (Cases 1,2,4,6), while "non-utilitarian" excludes functional explanations (Cases 3,5). It explains why Case 2's foundation deposit is ritual (no practical purpose) and Case 5's fire isn't (functional explanation exists). Crucially, it reflects her practice-focused approach without speculating about beliefs.

  For the new pit: domestic context, jumbled with refuse, no arrangement. All rules agree it's ordinary discard. Rule D specifically notes the absence of structure and presence of utilitarian explanation (rubbish disposal). Confidence is high because even Rule B (the most ritual-leaning candidate) requires structure.

  To discriminate between Rule D and alternatives, I propose a test case: high-value items deposited randomly in a midden. Rule D would call it ordinary (lacks structure), while Rule B might see ritual due to cost. This directly probes her structured/costly distinction.

  Methodologically, her refusal to infer beliefs from Case 6 shows her policy: only observable practices are archaeological data. The substantive claim is that structured non-utilitarian acts existed; Cases 1,2,4,6 demonstrate this, while Cases 3 and 5 show the boundaries. Her critics' conflation of structure/cost is the methodological error she guards against.

  The user's real need here is academic survival - they need to anticipate criticism without compromising integrity. By reverse-engineering the supervisor's logic, they can position their work as either extending or carefully challenging the framework. The test case suggestion gives them concrete leverage for future fieldwork.
answer: |-
  Based on her verdicts and stated principles, here is a step-by-step reconstruction of your supervisor's implicit decision rules, the prediction for your new pit, and the methodological implications.

  ### 1. Prediction for Your New Pit
  - **Her Likely Verdict:** Ordinary discard, **not ritual**.  
  - **Confidence Level:** High (90%).  
    *Why?* The pit's contents (jumbled with refuse/ash), location (domestic courtyard, not boundary/threshold), lack of arrangement, and gradual filling align perfectly with Case 3 (domestic midden). Key negatives: no structuring (cf. Cases 2,4,6), no separation from refuse (cf. Cases 1,2,4), and no non-utilitarian context (cf. Cases 1,2,4,6). Deliberate damage to metalwork is insufficient alone (Case 3 had none, but Case 1 had damage *and* isolation/context).

  ---

  ### 2. Candidate Rules (Tested Against All 6 Verdicts)
  **Rule A: "Ritual = Structured + Costly"**  
  - *Fails:* Case 6 (burial). Graves are structured but not "costly" in her terms (goods stay with the dead, not withdrawn from circulation). Case 5 (burnt grain) was costly but accidental.  
  *Verdicts broken:* 5,6.  

  **Rule B: "Ritual = Structured OR Costly"**  
  - *Fails:* Case 3 (midden) would be ritual if costly items were present (it isn’t, but if it were, she’d still call it refuse). Case 5 (burnt grain) is costly but not ritual.  
  *Verdicts broken:* 3 (counterfactually), 5.  

  **Rule C: "Ritual = Structured AND Non-Accidental"**  
  - *Fits all 6:*  
    - Cases 1,2,4,6: Structured + non-accidental → Ritual.  
    - Case 3: Unstructured → Not ritual.  
    - Case 5: Accidental → Not ritual.  
  - *Weakness:* "Non-accidental" is vague; doesn't explain why Case 5 is clearly accidental while Case 1 (bog) isn’t.  

  **Rule D (Her Articulated Logic): "Ritual = Structured + Non-Utilitarian"**  
  - *Fits all 6:*  
    - **Structured:** Deliberate patterning beyond functional needs (Cases 1: isolated/bent; 2: sealed/threshold; 4: ordered/capped; 6: flexed/cemetery).  
    - **Non-Utilitarian:** No practical benefit (Cases 1,2,4: permanent removal/placement; 6: symbolic interment).  
    - **Exclusions:** Case 3 (utilitarian refuse disposal); Case 5 (utilitarian storage gone wrong).  
  - *Distinguishes structure/cost:* Costliness (e.g., Case 5 grain) doesn’t imply non-utility.  

  **Rule E: "Ritual = Contextually Anomalous"**  
  - *Fails:* Case 6 (cemetery burial) is contextually *expected* but still ritual. Case 4 (pit at entrance) is anomalous to refuse but not to ritual.  
  *Verdicts broken:* 4,6.  

  **Plausible Rule Ruled Out:**  
  - "Ritual = Associated with Boundaries/Transitions" (fails Case 1 [bog, no boundary], Case 6 [cemetery may not be liminal]).  

  ---

  ### 3. Predictions for Your Pit by Surviving Rules  
  - **Rule C (Structured + Non-Accidental):** **Not ritual** (lacks structure; resembles Case 3).  
  - **Rule D (Structured + Non-Utilitarian):** **Not ritual** (lacks structure; mixed with refuse implies utility).  
  - *Divergence?* None for this case – both agree.  

  ---

  ### 4. Best Guess at Her Actual Rule  
  - **Rule D (Structured + Non-Utilitarian)** is her implicit framework.  
    *Reasons:*  
    1. Explains her emphasis on "structured ≠ costly" (Cases 1 vs. 5: both costly, only 1 is structured/non-utilitarian).  
    2. Clarifies Case 6: Flexed burial is structured/non-utilitarian (body not "discarded"), but beliefs are inaccessible.  
    3. Matches her critique of inferring belief from material alone.  
  - **Strongest Rival:** Rule C (Structured + Non-Accidental).  
    *Why someone might prefer it:* Simpler; "accidental" is intuitive for Case 5. But Rule D better captures her focus on *intentional non-utility* (e.g., Case 2’s sealed deposit is non-accidental *and* non-utilitarian).  

  ---

  ### 5. Discriminating Find Between Rule D vs. Rule C  
  - **The Case:** A *costly, intact* object (e.g., gold torc) deposited *unstructured* in ordinary midden refuse.  
  - **Predictions:**  
    - **Rule D (Structured + Non-Utilitarian):** **Not ritual** (lacks structure; utilitarian context).  
    - **Rule C (Structured + Non-Accidental):** **Not ritual** (lacks structure), but if "costly" implies non-accidental, might edge toward ritual.  
  - **Where They Diverge:** Rule D is firm; Rule C might waver if costliness implies intent. Her verdict on Case 5 (costly but accidental) suggests she’d call this **ordinary discard**, confirming Rule D.  

  ---

  ### 6. Substantive Claim vs. Methodological Policy  
  | **Aspect** | **Substantive Claim** | **Methodological Policy** |
  |------------|------------------------|---------------------------|
  | **Definition** | Prehistoric rituals involved *structured, non-utilitarian practices* (e.g., deliberate deposition/burial). | Archaeologists can *only* infer practices (not beliefs) from material remains. |
  | **Evidence** | Cases 1,2,4,6 demonstrate prehistoric non-utilitarian structuring. Cases 3/5 show absence. | Case 6 verdict explicitly blocks belief inference. Her "structured ≠ costly" distinction prevents conflation of material traits. |
  | **Real Work of Policy** | Verdicts 1–5 establish *what counts as ritual practice*. | **Verdict 6** is purely policy: it refuses belief inference *despite* accepting ritual practice. The "structured/costly" distinction (invoked in Cases 1,5) polices category errors. |

  **Key Takeaway:** Her substantive claim is that ritual is materially identifiable via structure + non-utility. Her policy fences off belief and demands rigor in linking practice to material patterns. For your thesis, note that her verdict on your pit flows from *practice-based criteria* (no structure = no ritual), not from broader theories of religion. Depart if you argue structure *can* exist in refuse (e.g., if jumbling is itself symbolic), but cite evidence she lacks.  

  **Underdetermination Note:** The rules are *not* underdetermined here. Rule D fits all verdicts and her stated principles. Rule C is viable but less aligned with her "non-utility" emphasis in Cases 2/4.
