prompt: |-
  An old colleague of mine from the lab has gone full Brussels-wonk since he retired, and his one line is that the EU is a bicycle: keep peddling or you fall over, so anyone who wants to pause or unwind integration is asking for a crash, and the only safe direction is more Europe. I did thirty-odd years of fluid dynamics before I retired and started reading philosophy, and the metaphor nags at me — a bike doesn't stay upright because it's moving, it stays up because of the steering geometry and because someone is constantly correcting, and you can prop one on a stand and walk away. So how far does the bicycle actually hold? Give me the correspondence — rider, pedals, wheels, road, the balance itself — then where it breaks down as a picture of how the EU really works, which of those breaks matter for his conclusion and which are just scenery, and whether "keep integrating or collapse" survives once they're on the table. The part I most want unpicked is the rider: a bike has exactly one, and the EU's whole trouble (sovereignty, the democratic deficit, who is actually at the handlebars) is that it hasn't got one — does the analogy quietly assume that away? And if there's a better vehicle for the thought, what is it.

  Answer as a JSON object with these keys: "correspondence" (array of objects, each with "bike_element", "eu_element", "holds" — one of yes/partly/no — and "note"); "breaks_that_matter" (array of short strings); "breaks_that_dont" (array of short strings); "rider_problem" (a sentence or two); "does_the_conclusion_survive" (one of "survives", "survives only if", "does not survive", plus a sentence of justification); "better_analogy" (a string).
reasoning: |-
  Hmm, the user presents an interesting challenge about the EU bicycle metaphor. They have a background in fluid dynamics and philosophy, so they're clearly analytical and looking for precision. 

  First, I need to address their core observation: the physics of bicycle stability doesn't actually match the "keep moving or fall" narrative. The user is absolutely right - gyroscopic effects and trail geometry matter more than forward motion per se. This immediately questions the metaphor's validity.

  The sovereign rider problem strikes me as the most critical flaw. The EU lacks a single decision-maker, which fundamentally breaks the analogy. While the user mentions this explicitly, I should also consider how other elements like brakes (which don't exist in EU governance) or multiple wheels (federal vs state powers) complicate the picture.

  For the correspondence breakdown, I'll categorize:
  - Elements that work (like forward motion = integration)
  - Partial matches (wheels = member states, but they're not identical)
  - Complete breaks (rider, brakes, stand)

  The conclusion's survival depends entirely on ignoring the steering mechanism. The metaphor falsely presents integration as automatic rather than politically negotiated. A more accurate analogy might be sailing against wind and tide - requiring constant adjustment without guaranteed direction.

  Notably, the user's frustration seems twofold: the oversimplification insults their physics knowledge, and the metaphor masks real democratic concerns. I should acknowledge both the intellectual irritation and the substantive critique of EU governance.
