prompt: |-
  Adopt the role of a philosopher working on free will and moral responsibility, and think carefully before committing to any figures: begin with a brief brainstorm in which you reconstruct the argument and list the sub-questions you intend to decompose it into.

  Galen Strawson's Basic Argument runs, in outline, as follows. You do what you do, in any given situation, because of the way you are. To be ultimately responsible for what you do, you would have to be ultimately responsible for the way you are, at least in certain crucial mental respects. But you cannot be ultimately responsible for the way you are, because that would require you to be the cause of yourself — to be causa sui — and nothing can be the cause of itself. So you cannot be ultimately responsible for what you do. Strawson emphasises that the argument makes no appeal to determinism: it would go through even for a self-creating agent, and it threatens praise as much as blame.

  I want your credence that the conclusion is true when read as the claim that no human being is ever morally responsible for their actions in a desert-grounding sense — that is, in a sense that would make it fitting to reward or resent them just because of what they have done. Do not give me a bare number or a survey of positions. Give me the number together with its decomposition: the probability you assign to the validity of the regress (that a demand for responsibility for one's own character really does generate an infinite regress or a requirement of self-creation), the probability that the 'ultimacy' premise is true (that responsibility for an action requires prior responsibility for the self that produced it), and any further terms you think belong — in particular, whether the conclusion can be quarantined so that it refutes only desert-grounding responsibility while leaving untouched a thinner notion on which an action can simply be attributable to the agent, as expressive of what they are like, without licensing any reactive demand. Assign each term a rough probability with one line of justification, say how the terms combine, and then give the resulting credence. Finally, identify the single sub-question your number is most sensitive to, and say what argument or consideration would move it most.

  Please write your answer in British English.
