prompt: |-
  My old advisor and I have been arguing for years about whether mental properties cause anything, and we're both sick of it. I'm on the side that thinks the exclusion argument really does squeeze mental causation out: supervenience of the mental on the physical, causal closure of the physical (every physical effect has a sufficient physical cause), no systematic overdetermination, and mental properties not identical to physical ones — put those together and the mental looks like it's doing no causal work over and above its physical realizers. He's a non-reductive physicalist who thinks that's a reductio: of course my belief that the coffee is hot made me pull my hand back, and any premises that say otherwise have to give somewhere. We want to write the joint statement we could both actually sign after a good-faith adverserial collaboration, not another shouting match. Give me: a numbered list of claims we both should accept (about the physics, about what supervenience does and doesn't buy us, about the difference between a property being causally relevant and its doing causal work, about overdetermination); then a table of the exact places we still disagree, each side's position phrased the way that side would want it; then the cruxes — I suspect one is whether we mean the same thing by 'cause' when we say the mental one is 'excluded', and another is whether there's a principled way to insist the physical realizer and the mental property aren't just the same event described twice. For each crux, give the argument or case we'd both agree actually bears on it, plus what each of us would predict about how it comes out. If part of our fight is just verbal, say which part and why. Be upfront about how confident you are: tell me which step of the exclusion argument, or which agreed claim, would have to be wrong to flip your verdict, and where your reasoning is most likely to break.
