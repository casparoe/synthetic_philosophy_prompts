  ### Residue Report

  #### Item: Uncomputable chains in posets  
  **Why It Resists Translation**:  
  Classical chains can be uncountable or undecidable (e.g., Vitali sets in real numbers). Representing them as `ℕ → S` sequences assumes countability and computability, which misrepresents the classical notion.  
  **Whose Limitation**: Target framework  
  **Explanation**: Computability theory cannot naturally model arbitrary uncountable sets without idealizing oracles to an unrealistic degree. This exposes a gap in the procedural framework for handling transfinite structures.

  #### Item: Existence as mere logical inhabitation vs. computable search  
  **Why It Resists Translation**:  
  The classical mathematician denies that "there exists" implies a search procedure. Translating existence as a search (`find`) assumes constructivism, begging the question.  
  **Whose Limitation**: Source dispute  
  **Explanation**: The dispute is precisely whether existence carries a procedural commitment. Neither side can "prove" their interpretation; it’s a foundational disagreement about meaning, not mathematics.

  #### Item: Transfinite induction in Zorn’s lemma proofs  
  **Why It Resists Translation**:  
  Classical proofs use transfinite recursion over ordinals, which has no direct computational analog. Procedures for `upper_bound` might require infinitely many oracle calls, violating termination.  
  **Whose Limitation**: Both  
  **Explanation**: The source dispute is vague on how to handle transfinite recursion (it’s often handwaved). The target framework lacks a natural way to model non-well-founded recursion without non-termination.

  #### Item: Sets as extensional vs. types as intensional  
  **Why It Resists Translation**:  
  Set theory treats sets extensionally (defined by elements), while types are intensional (defined by structure). Zorn’s lemma applies to any poset, but computationally, `S` must have a decidable order.  
  **Whose Limitation**: Both  
  **Explanation**: Classical mathematics doesn’t require decidability of `≤`, but the translation must assume it to model the relation procedurally. This reveals vagueness in the source about what constitutes a "set."

  ---

  ### Hypothesis Verdict  
  **Supported**  
  The procedural translation confirms the split is about the meaning of "there exists":  
  - Classical view: Existence is logical inhabitation (a term exists, possibly via oracles).  
  - Constructive view: Existence is a search (a computable witness).  
  The mathematics (e.g., chain conditions) is secondary; the core dispute is semantic.

  ---

  ### Bottom Line  
  The classical mathematician's concept of an "arbitrary set" — specifically, uncountable, non-computable chains in posets — does not survive the translation into a finite, procedural framework without distorting its essence.

