  ### Translation

  #### Source Claim: Every chain in the poset has an upper bound → There exists a maximal element.  
  **Target Rendering**:  
  Given a type `S` (poset) and a decidable relation `≤ : S → S → Bool`, if an oracle `upper_bound : (Chain : ℕ → S) → S` exists (which, for any enumeration of a chain, returns an upper bound), then an oracle `maximal : Unit → S` exists that returns a maximal element when called.  
  **Fidelity**: Distorted  
  **Note**: The distortion lies in representing chains as computable sequences (`ℕ → S`), which assumes chains are countable and enumerable. Classical set theory allows uncountable chains, which resist enumeration. The oracle `upper_bound` must handle non-computable chains, but our rendering forces chains into a procedural form, artificially constraining the classical view.

  #### Source Claim: Axiom of Choice (AC) enables "choosing" elements from non-empty sets.  
  **Target Rendering**:  
  AC is an oracle `choice : (I : Type) → (A : I → Type) → (∀ i, NonEmpty (A i)) → (i : I) → A i`. Given an index type `I` and a proof that each `A i` is non-empty, `choice` returns a function `f : (i : I) → A i` without revealing its implementation.  
  **Fidelity**: Clean  
  **Note**: AC directly translates to a higher-order oracle. The classical mathematician treats `choice` as a black box, while the constructivist rejects it due to the lack of a concrete implementation.

  #### Source Claim: Zorn’s lemma provides a non-constructive existence proof.  
  **Target Rendering**:  
  A proof using Zorn’s lemma is a function `zorn : (S, ≤, upper_bound) → S` that internally calls the `choice` oracle. The term `m = zorn(...)` is a maximal element, but evaluating `m` may not terminate or requires unknown oracles.  
  **Fidelity**: Clean  
  **Note**: The value `m` is a named output of a procedure we cannot run, mirroring how classical proofs "name" objects without constructing them.

  #### Source Claim: Constructivists reject non-constructive existence proofs.  
  **Target Rendering**:  
  A constructive existence proof is a total function `find : (S, ≤, upper_bound) → S` that computes a maximal element without oracles and terminates. Rejecting Zorn’s lemma means demanding `find` instead of `zorn`.  
  **Fidelity**: Clean  
  **Note**: The dispute reduces to whether existence requires a computable witness (`find`) or merely a named output (`zorn`'s `m`).

  #### Source Claim: Classical mathematicians accept non-constructive existence.  
  **Target Rendering**:  
  Classical existence is a type signature `∃ m : S, Maximal(m)`, inhabited by a term `m` whose construction may involve oracles (non-computable). Validity depends only on term inhabitation, not computability.  
  **Fidelity**: Distorted  
  **Note**: Distortion arises because Curry-Howard normally equates proofs with programs. Here, we extend it to allow non-computable oracles, which classical logic permits but isn't native to type theory.

