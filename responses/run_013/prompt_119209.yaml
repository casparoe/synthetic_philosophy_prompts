prompt: |-
  I run a fortnightly ethics reading group and we're doing population stuff this term — whether more people is better, pronatalism, that whole area. For the first session I want to open with a sorting exercise rather than a paper, so people find out what they actually think before they find out what the views are called.

  Can you build me a decision tree? Start from something anyone can answer — say, 'you could add a billion people whose lives are just about worth living; does that make things better, worse, or neither?' — and let each branch be the claim that actually splits the positions apart. I don't want a glossery of -isms with arrows drawn between them. Each node has to be a real question about a case or a commitment, answerable by someone who's never heard of any of these positions, so it sorts people by what they say about cases rather than by the label they'd pick. Build it from the questions outwards: work out what combinations of answers are even possible first, then say which combinations correspond to views people actually hold.

  Please make sure these all turn up as leaves somewhere: the view that more happy people is straightforwardly better; the view that only average welfare matters; the view that adding lives is good but only above some quality theshold; the view that adding a happy person is not in itself any better at all — I suspect this one is the real crux and I want the tree to make it visible rather than smuggle it in; the view that coming into existence is a harm; and a properly pronatalist leaf, one that thinks more people is good for reasons that aren't about anyone's welfare — duty to the species, natality as a value, whatever it turns out to be. Give the leaves their standard name where one exists and write 'unnamed' where it doesn't.

  Use concrete cases as far as possible: a baby bonus funded by a tax that leaves every existing person slightly worse off; a world that's larger and less happy on average but where every single person in it is better off than their counterpart in the smaller world; two worlds with the same total welfare but different numbers of people. Flag any pair of leaves the tree genuinely can't separate, and note which combinations nobody occupies — and whether that's because the view is incoherent, or just because nobody's tried it.

  British English please, and keep the whole thing under about 900 words.
reasoning: |-
  Okay, let me tackle this request for a population ethics decision tree. The user runs a fortnightly ethics group and wants a practical sorting exercise that starts from concrete cases rather than theoretical labels. 

  First, I need to identify the core tension points in population ethics. The "mere addition paradox" seems crucial - that's where adding lives barely worth living creates philosophical discomfort even when it increases total utility. This should probably be the root question since it's intuitive yet divisive. 

  For structure, I'm considering branching based on three key dilemmas: whether to value total/average welfare (Q2), whether existence can be neutral or harmful (Q3), and whether non-welfare values matter (Q4). This should cover all requested leaves while avoiding textbook definitions. 

  The pronatalist branch needs special handling - it must exist independently of welfare arguments. I'll use a case about duty to procreate despite personal cost. For the "coming into existence is harmful" view, I'll contrast two babies: one with good life, one with terrible life, to isolate birth's inherent value.

  Practical constraints: British English, under 900 words. I'll flag where combinations are impossible (e.g., valuing both total welfare AND calling existence inherently harmful) and note unpopular but coherent positions like "only average matters" at Q2. 

  The tree must expose the welfare-neutrality crux clearly - probably at Q3 where rejecting "existence is good" leads to anti-natalism. For unnamed leaves, I'll describe them positionally like "Totalism with existence-neutrality". 

  Testing flow: Start with the billion-lives case, then tax-funded baby bonus for welfare trade-offs, then parallel worlds for average/total conflict. Finally, non-welfare cases and anti-natalist scenarios. Each branch ends at named positions without jargon.

  Noticing the user wants to surface preconceptions - so questions must be phrased to prevent theoretical contamination. "Does adding X make things better?" not "Are you a total utilitarian?". Cases should feel ethically intuitive before revealing how they map to established -isms.
answer: |-
  Here's a decision tree built from concrete cases, designed to sort participants into population ethics positions based on their intuitive responses, with British English and under 900 words:

  **Root Question (Q1):** Imagine we could painlessly add one billion new people to the world. Their lives would be just barely worth living – not great, but overall positive. Does adding them make the world:
  *   **(A) Better?**
  *   **(B) Worse?**
  *   **(C) Neither better nor worse?** (Or "Makes no difference")

  **Branch from A (Better):**
  *   **Q2 (Welfare Trade-off):** Suppose a government introduces a "baby bonus," funded by a small tax. This bonus successfully encourages enough extra births to add one million people with lives just barely worth living. However, the tax reduces the welfare of *every single existing person* by a tiny, barely noticeable amount. Is this policy:
      *   **(A1) Good?** (Because the gain of the new lives outweighs the small losses to existing people)
      *   **(B1) Bad?** (Because the losses to existing people, even small, outweigh the gains of the new lives, or shouldn't be traded off)
      *   **(C1) Neutral?** (Or the trade-off isn't permissible)

  **Branch from B1 (Bad) or C1 (Neutral) on Q2:** You prioritise existing people's welfare over adding new lives. Skip to Q4.
  **Branch from A1 (Good) on Q2:** You accept trade-offs favouring new lives. Proceed to Q3.

  *   **Q3 (Quality Threshold/Existence Neutrality - The Crux):** Imagine two possible futures:
      *   **Future A:** Has 10 billion people. Everyone has wonderfully flourishing lives.
      *   **Future B:** Has *20 billion* people. *Every single person* in Future B has a life *better* than their counterpart in Future A (e.g., everyone is happier, healthier). However, because there are twice as many people *all* at this slightly higher level, the *average* welfare in Future B is *lower* than in Future A. Is Future B:
          *   **(A2) Better than Future A?** (Total welfare/aggregate matters most)
          *   **(B2) Worse than Future A?** (Average welfare matters most)
          *   **(C2) Neither better nor worse?** (Adding people, even happy ones, isn't *in itself* good or bad)

  **Branch from C (Neither) on Q1:** Proceed to Q4.
  **Branch from B (Worse) on Q1:** Proceed to Q4.

  *   **Q4 (Non-Welfare Value / Harm of Existence):**
      *   **Scenario 1:** Imagine a couple who would make excellent parents. Their child would have a very high chance of a long, extremely happy life. However, having the child would require significant personal sacrifice, slightly reducing (but not ruining) the couple's own lifetime happiness. Is having the child:
          *   **(A3) A good thing?** (For reasons beyond just the welfare sums, e.g., natality, species duty, meaning)
          *   **(B3) A neutral thing?** (Neither good nor bad in itself)
          *   **(C3) A bad thing?** (Or at least, not required)
      *   **Scenario 2:** Imagine a child is born into horrific, unremitting suffering; a life vastly worse than never existing. Is bringing this child into existence:
          *   **(D) Always a serious harm *to the child*?**
          *   **(E) Not necessarily a harm *to the child*?** (Perhaps just a misfortune, or harm depends on context)

  ---

  **Leaves & Positions:**

  1.  **Q1=A + Q2=A1 + Q3=A2:** You prioritise total welfare/aggregate happiness. Adding lives, even barely worthwhile ones, is good if it increases the total sum. *Total Utilitarianism (Classic)*. (More happy people is straightforwardly better).
  2.  **Q1=A + Q2=A1 + Q3=B2:** You believe average welfare matters most. Future B (higher total, lower average) is worse. *Averagism*.
  3.  **Q1=A + Q2=A1 + Q3=C2:** You accept adding barely worthwhile lives is good (Q1=A, Q2=A1), but reject that adding *happy* lives is good *in itself* (Q3=C2). This combination is likely **incoherent**. If adding happy lives isn't good, why is adding barely worthwhile ones good? *Unlikely/Incoherent*.
  4.  **Q1=A + Q2=B1/C1:** You think adding barely worthwhile lives is *prima facie* good (Q1=A) but reject significant trade-offs harming existing people to achieve it (Q2=B1/C1). You might prioritise existing people. *Unnamed* (Often leads to critical-level or person-affecting views).
  5.  **Q1=C (Neither) + Q4 Scenario1=A3:** Adding lives isn't good or bad based *just* on welfare, but you see independent value in creating new life/fulfilling a duty. *Pronatalism (Non-Welfarist)*. (More people good for non-welfare reasons).
  6.  **Q1=C (Neither) + Q4 Scenario1=B3 + Q4 Scenario2=D:** Adding a life isn't inherently good *or* bad based on welfare alone. However, bringing someone into existence *can* be a harm *to them* if their life is bad enough. *Asymmetry View / Anti-Natalism (Mild)*. (Adding a happy person not better in itself; existence can be harm).
  7.  **Q1=C (Neither) + Q4 Scenario1=B3 + Q4 Scenario2=E:** Adding a life is morally neutral regarding welfare, and coming into existence isn't inherently a harm *to the person*, even if their life is terrible. Existence is neutral. *Existence-Neutrality*.
  8.  **Q1=B (Worse) + Q4 Scenario1=C3/B3 + Q4 Scenario2=D:** Adding even barely worthwhile lives makes things worse. Creating new life is generally bad or neutral, *especially* because bringing someone into existence always risks harm or is itself a harm if life is bad. *Anti-Natalism (Stronger)*. (Coming into existence is a harm/risk).
  9.  **Q1=B (Worse) + Q4 Scenario1=A3:** You think adding barely worthwhile lives is bad, yet see independent value in creating new life. This combination is **incoherent**. If adding life is valuable, why is adding *this* life bad? *Unlikely/Incoherent*.

  **Key Notes & Clarifications:**

  *   **The Crux (Q3=C2):** This isolates the "existence neutrality" intuition – adding a happy person isn't *in itself* good. It's central to views 6, 7, and underpins 8. The tree forces engagement with it.
  *   **Threshold Views:** These are often captured by rejecting adding barely worthwhile lives (Q1=B/C) but accepting adding lives *above* a certain threshold. This maps to leaves like 4 (if threshold is due to trade-offs) or 6/7 (if threshold is about avoiding harm/neutrality below a level). A specific "Critical Level" view might sit between 4 and 6.
  *   **Missing Combination?** A strict "Only Total Matters, but Existence is Neutral for Happy Lives" (Q1=A + Q2=A1 + Q3=C2) is flagged as incoherent (Leaf 3). Other combinations (like Q1=A + Q4 Scenario1=A3) are possible but less common; participants landing there might hold hybrid views.
  *   **Pronatalism (Leaf 5):** Explicitly separated by requiring non-welfare reasons (Q4 Scenario1=A3) *after* welfare-based addition is seen as neutral (Q1=C).
  *   **Averagism (Leaf 2):** Clearly isolated by Q3=B2.
  *   **Total Utilitarianism (Leaf 1):** Captured by Q1=A + Q2=A1 + Q3=A2.
  *   **Anti-Natalism:** Captured in different strengths: Leaf 6 (asymmetry/mild), Leaf 8 (stronger), depending on Q1 and Q4 Scenario2. Leaf 8 explicitly includes the "coming into existence is a harm" idea.
  *   **Unnamed Views:** Leaves 4 and 7 are coherent positions without universally agreed names. Leaf 4 might align with "Person-Affecting" or "Critical-Level" views depending on reasoning. Leaf 7 is pure "Existence-Neutrality".

  This tree uses concrete, answerable cases to guide participants to core commitments, revealing their intuitive stance before introducing labels. The combinations cover all requested views and expose the crucial tension around the inherent value (or neutrality) of adding a happy life.
