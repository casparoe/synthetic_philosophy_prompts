prompt: |-
  Over the last year or so I've drifted into the moral particularist camp — not the weak "principles have exceptions" version, but the strong one: there are no true exceptionless moral generalizations, reasons are holistic (a feature that counts in favour of an act here can count against it there), and no further principle tells you which way it'll go in the next case. I picture moral principles as lossy compression of a huge table of case judgments, and I suspect the loss is in principle rather than just in practice — moral competence looks more like a perceptual skill than like knowing a rulebook. It's basically the ethics version of all the LW-adjacent stuff about expert judgment resisting codification, which is probably why it appeals to me.

  So: what would count against it? Not the easy stuff like lying to the axe murderer — I want the harder defeaters. Real or constructed cases where a feature's valence flips in a way I can't argue away, empirical results about how moral judgment is actually learned and structured, and the boring possibility that this is just generalism with very long principles, i.e. that it collapses into its rival. What does it predict that a generalist wouldn't? Which parts of the package are load-bearing — if holism goes but "no humanly usable principles" stays, what's left? And which of these defeaters would a particularist themselves concede rather than dismiss, since I dont want only what critics say.

  Also tell me straight whether the view risks anything at all, and if it's unfalsifiable whether that's a fatal problem or just what you'd expect from a claim about what reasons there are. The thing that would move me most is a case where I honestly can't see the flip.
reasoning: |-
  Okay, let me unpack this user's query. They've embraced strong moral particularism, seeing moral principles as lossy compressions and moral competence as perceptual. They want robust counterarguments, not easy examples like lying to an axe murderer. 

  First, I need to identify what would genuinely challenge their view. They mentioned valence flips they can't dismiss, empirical evidence, and the risk of collapsing into generalism. Also, they're concerned about falsifiability. 

  Starting with valence flips: what features have seemingly stable valences? Harm avoidance comes to mind. But even that has exceptions, like necessary surgeries. The user might counter that context explains the flip. So I need cases where the valence flip feels arbitrary. Self-defense causing harm is accepted, but what about state executions? That's divisive. Or cultural practices like honor killings—here the valence flip isn't just contextual but deeply contested. If particularism can't explain why some flips are more valid than others, that's a problem.

  Empirical evidence is another angle. If moral development in children shows rule acquisition, that challenges particularism. Haidt's social intuitionism suggests quick judgments with post-hoc reasoning, which aligns with particularism. But if computational models find rule-like structures, that supports generalism. The user needs to reconcile particularism with how we learn morals.

  Collapsing into generalism is a big risk. If "holistic reasons" imply context-specific principles, that's just longer rules. Dancy denies this, but the line is thin. The user must clarify if their view avoids infinite context-sensitivity.

  Falsifiability: particularism might be unfalsifiable if all counterexamples are dismissed as misunderstood contexts. The user acknowledges this but wonders if it's acceptable. Comparing it to mathematical Platonism highlights that unfalsifiability isn unique, but it's still a weakness if it doesn't provide explanatory power.

  What would move the user? A case where valence flips without clear reason. Consider a feature like "breaking a promise." Normally wrong, but what if it's trivial? The user might see context. But take "killing an innocent person." Most see it as always wrong, but wartime collateral damage complicates it. If the user can't explain why some contexts override others without implicit principles, that challenges particularism.

  Also, moral disagreement: if particularism is true, why do we expect consistency in judgments? Yet legal systems rely on precedents, suggesting underlying principles. The user might argue precedents are analogies, not rules. Still, the expectation of consistency hints at generalist tendencies.

  The user's deeper need might be ensuring their view isn't just defensible but true. They want intellectual honesty—confronting the strongest counterarguments. They might fear particularism is an unfalsifiable retreat. Addressing this requires balancing philosophical rigor with psychological insights, showing where particularism must concede ground.
answer: |-
  Here’s a dissection of hard defeaters for strong moral particularism, designed to challenge without strawmanning. I’ll address valence flips, empirical data, collapse risks, falsifiability, and cases where *you* might struggle to see the flip.

  ### 1. **Valence Flips That Resist "Contextual Absorption"**
     Particularists dissolve apparent flips by appealing to holistic context. But some cases make this feel forced:
     - **"Causing Pain to an Innocent"**: Normally a strong negative reason. Flip case: *Electroconvulsive therapy (ECT) for severe, treatment-resistant depression*. The pain is severe, the patient is innocent, and it’s *prima facie* horrific. Yet in this context, it’s morally required (with consent). The particularist might say "therapeutic intent changes everything," but this risks becoming a *de facto* principle ("causing pain is wrong *unless* for therapy"). If you deny this, **why isn’t every medical intervention a unique moral atom?** The burden shifts to explain why this flip *isn’t* a latent principle.
     - **"Breaking a Promise"**: Normally negative. Flip case: *Breaking a promise to meet a friend for coffee to give CPR to a stranger*. Easy to absorb? Now try: *Breaking a promise to return a borrowed book to help someone cheat on a spouse*. The valence flip (neutral/positive → negative) hinges on the *content* of the alternative act, not just context. This demands an account of **why certain features (deception, betrayal) consistently override others** without invoking rules.
     - **The "Arbitrary Flip" Challenge**: Imagine a society where *wearing blue* is virtuous on Mondays (signifying hope) but vicious on Tuesdays (signifying arrogance), with no deeper story. You’d dismiss this as superstition, not holistic reason. Real moral flips (e.g., "killing" in self-defense vs. murder) feel *non-arbitrary* because they track latent general rules (e.g., "respect autonomy"). If all flips are non-arbitrary, **doesn’t particularism covertly rely on unstated generalizations?**

  ### 2. **Empirical & Cognitive Science Challenges**
     - **Moral Development (Piaget/Kohlberg)**: Children progress from rule-free egocentrism → rigid rules → nuanced principles. If particularism is right, why don’t children start as particularists? The shift from "stealing is always wrong" to "stealing to save a life is permissible" suggests **rule-based reasoning is a developmental stage**, not just a compression artifact.
     - **Dual-Process Theories (Greene/Haidt)**: Haidt’s social intuitionism aligns with particularism (quick, perceptual judgments). But Greene’s fMRI work shows *deliberative* rule-based reasoning (e.g., in impersonal trolley cases). If moral judgment is *sometimes* rule-based, **does particularism overstate the dominance of perception?**
     - **Neural/Computational Evidence**: If moral cognition involves pattern-recognition (connectionist models), it may indeed resist codification. But if AI systems (e.g., LLMs) trained on human judgments develop *internal rule-like structures* (e.g., "harm" as a stable negative weight), **does this suggest moral reasoning isn’t principle-free, just sub-symbolic?**

  ### 3. **Collapse Risks: Is Particularism Just "Generalism in Disguise"?**
     - **The Contextual Bomb**: Dancy says a feature’s valence depends on the entire context. But if we define "context" finely enough (e.g., "causing pain *to a consenting adult for therapeutic purposes*"), we get an exceptionless principle. The particularist retort: "Context is infinite! You can’t list all parameters." Yet **if every moral truth requires a *complete* context specification, moral reasoning becomes impossible**—we *must* use heuristics (i.e., principles).
     - **Predictive Power Test**: What does particularism predict that generalism doesn’t? Generalism predicts persistent rule-following; particularism predicts radical context-sensitivity. But in experiments, people *do* apply rules rigidly when cognitive load is high (e.g., time pressure). If particularism retreats to "competent judges are flexible," **is it unfalsifiable? Competence becomes defined by adherence to particularism**.

  ### 4. **Cases Where the Valence Flip Feels Inexplicable (For You)**
     Try these—not as "gotchas," but as intuition-stretchers:
     - **"Destroying Your Own Property"**: Normally neutral/positive (autonomy). Flip: *Burning your passport to avoid testifying against a dictator*. Here, destroying property becomes a moral failure (complicity in evil). The negative valence comes from *external consequences*, not the act’s intrinsic features. Can you explain this without a principle like "avoid enabling harm"?
     - **"Praising an Enemy"**: Normally positive (honesty). Flip: *A politician praising a genocidal rival to avoid retaliation*. The praise becomes cowardly/complicit. Valence flips due to *role obligations* (leader’s duty to condemn evil). Is "role" a context feature or a proto-principle?
     - **"Killing One to Save Many"**: Standard trolley flips are manageable. Now try: *Pushing a fat man off a bridge to save five*. Many perceive this as murder, even if consequences are identical to pulling a trolley lever. The particularist must explain why *physical contact* or *intentionality* flips the valence *here but not elsewhere* (e.g., surgery). **If every explanation appeals to features like "direct harm," isn’t that a principle?**

  ### 5. **Falsifiability & Risk**
     - **Risks**: Particularism risks making moral reasoning **opaque and unteachable**. If morality is perceptual, how do we train moral "vision"? Appeals to "sensitivity" can mask bias or inconsistency. It also risks **moral paralysis**—without principles, how do we act in novel dilemmas?
     - **Unfalsifiable?** Yes, but not fatally. Like mathematical Platonism, it’s a metaphysical claim. The threat isn’t unfalsifiability *per se*, but **explanatory vacuity**. If particularism "explains" every judgment *post hoc* by gesturing at holistic context, it explains nothing. The test is whether it offers *better* explanations than generalism for hard cases (e.g., tragic dilemmas).

  ### What a Sophisticated Particularist Would Concede
  Most would grant:
  - Moral learning *begins* with rules (prima facie duties) as heuristics.
  - Some features (e.g., *intentional harm*) have *stable default valences* across contexts.
  - Codification (e.g., laws) is practically necessary for social coordination.
  - Bad particularism can rationalize moral laziness ("everything’s context!").

  ---

  **The Hardest Challenge for You**: Find a case where **your own intuition** demands a valence flip, but you cannot articulate *why* without implying a principle. For example: *Is it ever acceptable to torture an innocent child?* If your intuition screams "NO!" (a valence that refuses to flip), ask: What context could *plausibly* make this right? If none, doesn’t this suggest an exceptionless prohibition? The particularist might say "It’s *conceivable* but not *actual*," but then the view risks becoming trivial—all principles are "true unless we find a counterexample," which is just generalism with epistemic humility.

  This forces the question: **Is your particularism a claim about morality or about our cognitive limits?** The former is bold but vulnerable; the latter is safer but less revolutionary.
