answer: |-
  The consent form called it “neural shading.” They made us watch a cartoon where little blue sparks went *zap* at pain signals in the spine, leaving the rest of the nervous system humming along. “Non-ablative modulation,” the crisp doctor explained, her fingers steepled. “Targets the *affective* valence, not the sensory-discriminative pathway. Reflexes, localization, intensity reporting – all preserved. The ‘hurt’ is selectively modulated.” She said “hurt” like it was a technical term she disliked. Sam nodded beside me, his knee bouncing a frantic rhythm only I could feel through the cheap clinic chairs. Chronic lower back, a grinding companion for ten years. This trial was his Hail Mary.

  “So… it won’t stop the pain?” I asked, stupidly.

  Sam cut in, voice tight. “It stops it *being bad*. The signal’s still there, but it’s… neutral. Like a weather report.”

  The doctor smiled thinly. “Exactly. Patients report full awareness of the sensation’s qualities – location, intensity, character – but the associated unpleasantness, the imperative to avoid or escape it, is significantly attenuated. Think of it as decoupling the alarm bell from the fire.”

  Sam signed. His signature looked like it always did, a messy scrawl. I signed as witness, my stomach a cold knot. *Decoupling the alarm bell*. What happened if you stopped reacting to the fire?

  ***

  Two weeks later, back in the same beige room. Sam looked… lighter. Not happier, exactly, but the permanent tension band across his shoulders had dissolved. He sat easily, one ankle resting on the opposite knee. The doctor ran through her checklist.

  “Pain location? Lower lumbar, radiating slightly left, same as baseline?”
  “Yep,” Sam said.
  “Intensity, right now, on the zero-to-ten scale?”
  “Solid seven.”
  “Character? Burning, stabbing, aching?”
  “Deep ache. Like a toothache in my spine. Maybe a hint of… pressure?” He frowned, concentrating. “Yeah. Pressure.”
  “And the *unpleasantness*? The distress associated with that sensation?”
  Sam spread his hands, a gesture of pure bafflement. “That’s the thing. It’s *there*. I can tell you all about it. Seven out of ten deep ache with pressure. But… it’s just… information. It doesn’t *bother* me.” He looked at me, then back at the doctor, frustration edging into his voice. “It’s the *same* sensation. Exactly the same as before. But the… the *badness*… it’s gone. Poof. Like it was never there. It doesn’t… *mean* anything anymore.” He trailed off, helpless. “You know?”

  The doctor nodded, jotting notes. “Typical report. The discriminative function is intact. The aversive drive is selectively modulated.” She sounded satisfied. Scientifically validated.

  I watched Sam. He described the seven-out-of-ten ache with the same detached precision he’d use to describe the pattern of rain on the window. No wincing. No shifting in the chair seeking relief. Just… observation. He *knew* it should hurt. He *said* it was a seven. But his body, his face, his whole being radiated an unsettling calm. It wasn't numbness. Numbness is an absence, a void. This was… presence without weight. A signal broadcasting clearly into an empty room.

  ***

  Home felt different. Sam moved with a new, unnerving freedom. He’d bend to pick up a dropped pen without the careful, stiff-legged hinge he’d perfected over years. He’d sit on the old, unforgiving kitchen chair without the usual grimace and slow adjustment. He still *mentioned* the pain. “Back’s really singing today, deep eight,” he’d say while effortlessly hauling groceries in from the car. Or, watching TV, “Sharp spike just now, left side. Weird.” His voice held no trace of complaint, just factual reporting. Like commenting on a flickering lightbulb.

  It was the oven incident that crystallized the dread.

  I was making dinner, pulling a tray of roasted vegetables from under the broiler. The mitts were thin, old. Heat blasted my face. I slid the tray onto the stovetop, dropped the mitts, and shook my stinging fingers. “Damn, that’s hot!”

  Sam was beside me, reaching for a spatula. His hand, bare, brushed against the scorching-hot rack still protruding from the oven. I saw the skin touch the blackened metal. I *heard* the faint sizzle.

  “Sam!” I yelped, grabbing his wrist to pull it away.

  He flinched back reflexively, yanking his hand free. He stared at the red, already-blistering stripe across his knuckles. He held it up, turning it slowly.

  “Ow,” he said, flatly. Not a gasp. Not a curse. Just… ‘ow’.

  “Jesus, Sam! Are you okay?” I grabbed his hand, pulling him towards the sink. Cold water hissed over the burn.

  “It’s fine,” he said, watching the water stream over the angry welt. He flexed his fingers experimentally. “Yeah. Sharp. Hot. Deep, I’d say. Eight, maybe?” He looked at me, completely calm. “Definitely a burn.” He pulled his hand gently out from under the tap, examined the blisters forming. “Huh. Needs dressing. Where’s the burn gel?”

  “It doesn’t *hurt*?” The question felt absurd, desperate. He’d *flinched*. He’d *said* ‘ow’. He’d *rated* it.

  Sam frowned, a look of profound concentration. He touched the edge of the blister with his other finger. “I feel it. Absolutely. Hot, sharp, localized right there, intensity high.” He met my eyes, genuine confusion in his. “But… it’s not *bad*. It doesn’t… *demand* anything. It’s just… data. Pain data.” He shrugged, a gesture utterly devoid of resignation or acceptance. It was simple fact. “It’s fine. Really. I’ll put the gel on.”

  He walked calmly to the bathroom cabinet, rummaged for the tube. I stood by the sink, the smell of roasted peppers suddenly cloying, the sound of the running water too loud. He flinched. He reported the sensation accurately. He called it an eight. He *knew* it was a burn requiring care. He was taking the necessary steps. Functionally, everything was intact. Alert. Responsive. Discriminating.

  But that bare hand had stayed on the broiler rack a fraction too long. Long enough to blister. Because why pull away? The alarm bell wasn't connected to any fire he could feel. He’d perceived the absence of the hurt, pointed right at the hole where it used to be – *‘it’s the same, it just doesn’t… you know’* – yet the machinery of reporting and reacting hummed on, faithfully describing a shadow.

  He came back, carefully smoothing the cool gel over the burn. He didn’t hiss. He didn’t tense. He just applied it, methodical, like lubricating a hinge. “There,” he said, holding up the glistening hand. “Good as new.”

  I looked at his calm face, then at the angry red mark already swelling. He saw it. He described it perfectly. He called it pain. He treated it like pain. And he said it was fine. Not *he* was fine. *It* was fine. The sensation itself.

  The cold knot in my stomach tightened into something harder, sharper. The water kept running in the sink, swirling down the drain. He moved to get a bandage, his movements fluid, unburdened. I watched him, the man I knew intimately, navigating a world stripped of a fundamental gravity I couldn’t name or grasp, reporting clear skies while standing in a storm only he couldn’t feel. Or *could* he? The question hung, heavy and silent, in the steam-filled kitchen. His hand, bandaged now, reached past me to turn off the tap. The silence afterward was deafening.
