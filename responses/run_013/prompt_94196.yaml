  ### Key Design Notes:
  1. **Symbolic Simplicity**: Uses binary sequences (0/1) for universal accessibility while allowing complex rule behaviors.

  2. **Critical Moments Achieved**:
     - **Identical Data/Divergent Predictions**: In the "Identical Data Challenge," all groups see "01010" but create different rules (e.g., "always alternate" vs. "repeat 010 thrice"), leading to conflicting next guesses (1 vs. 0).
     - **Adversarial World**: Round 1's World-Designer Team crafts a rule to deliberately foil all groups' rules after seeing them (e.g., "output the opposite of what the majority predicts").
     - **Assumption-Purchased Success**: Round 2's "natural" alternating pattern rewards rules that match it (e.g., "if odd position, predict 0"), but debrief reveals this advantage came from facilitator's unchallenged assumption.

  3. **Experiential Focus**:
     - Frustration in Round 1 makes the "cost" of assumptions visceral.
     - Creating rules in both rounds forces ownership of biases.
     - Prediction conflicts in the identical data challenge create cognitive dissonance.

  4. **Debrief Structure**:
     - Part 1 uses Socratic questioning to draw out realizations from activity moments.
     - Part 2 names concepts only after experiences are internalized, explicitly separating the averaging claim (NFL) from the circularity claim (Hume).

  5. **Practical Adjustments**:
     - No projector needed; all data on whiteboard.
     - Scoring uses points for engagement but emphasizes insight over winning.
     - Materials are minimal and low-cost.
