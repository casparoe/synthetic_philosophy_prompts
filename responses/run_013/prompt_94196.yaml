  We are designing a 90-minute interactive session for adults, some with science/medical background, most without. The topic is the no-free-lunch theorems (NFL) and the problem of induction, but we want to separate two claims: 
    1. The NFL theorem: Averaged over all possible worlds (with equal weight), any two prediction rules have the same expected error. This means that any advantage on some problems is offset by disadvantages on others. The equal weighting is a strong assumption.
    2. Hume's problem of induction: Justifying induction requires circular reasoning because it presupposes the uniformity of nature (which is itself an inductive inference).

  Key goals:
    - Participants should see that generalization requires an assumption about the world (the "price" of the lunch) and that this assumption isn't in the data.
    - At some point, they must hold identical data and make incompatible predictions, each fitting the data, and realize the tie was broken by an assumption they brought.
    - One round: a team designs the world after seeing all rules, so every rule fails. Then a round in a "natural" world where rules with matching bias win.
    - The debrief must show that the advantage in the second round was also purchased (i.e., by matching the world's bias, which is an assumption).

  Constraints:
    - No money, minimal materials (movable chairs, whiteboard; no reliable projector).
    - Data: short strings of two symbols (e.g., 0 and 1) to keep it simple.
    - Avoid 'grue' and the phrase 'problem of induction' until debrief.

