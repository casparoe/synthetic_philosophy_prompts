prompt: |-
  For the past year I have been writing a novel whose spine is a coroner's inquest: twelve men in a shuttered room deciding what happened to a girl, with the reader seated among them while they decide it. The book has pushed me toward a question I am not equipped to settle on my own. I have read, in the way a layman reads, about the argument — the Condorcet jury theorem, as I gather it is called — that if each member of a group is even slightly better than a coin toss at answering a yes-or-no question, then a sufficiently large group will be almost certainly right; and I have read enough about the long quarrel over the assumptions behind that result to know that the quarrel is where the interest lies. I understand the claim well enough to be gripped by it, and not well enough either to defend it or to attack it.

  I am a novelist by trade. My analytical vocabulary is the vocabulary of craft: point of view and focalization, the reliable and the unreliable narrator, free indirect discourse, subtext, dramatic irony, the distinction between showing and telling, the implied author, the gap between what a character says and what a scene establishes. That is the vocabulary into which I would like you to translate the theorem and the dispute over its assumptions, as faithfully as the translation can honestly be carried off.

  Take the theorem's moving parts one at a time: the proposition the group is deciding, which in a novel is rarely as tidy as a yes or a no; the individual's competence; the independence of the individual judgments; the sincerity with which each judgment is expressed; the aggregation rule; and the conclusion about the group's probability of being right. For each, tell me what it becomes in my terms, or that it becomes nothing at all. Then give me the residue report. Which parts survive the crossing intact? Which could be carried across only by quietly changing the subject, so that what arrives on my side is no longer what left yours? Which have no counterpart whatsoever in the way a novel works? Be scrupulous about the smuggling: if the translation succeeds only because independence has been redefined as characters who do not talk to one another, or competence as the reader's trust in the narrator, say so, and say whether the redefinition is fair or is sleight of hand.

  I am equally interested in which way the residue cuts. If narrative has no way to say that a group is 0.94 likely to be right, is that a hole in my vocabulary, a real feature of collective belief that novels cannot render, or evidence that the theorem is doing something with numbers that has no analogue in the thing I am trying to depict — or, for that matter, that the claim is less substantive than its mathematical dress suggests? And consider the objections rather than the theorem itself: that actual groups fail the independence condition because they share a culture and correct one another's errors; that deliberation manufactures agreement without manufacturing accuracy; that a confident majority can be confidently and unanimously wrong. Do those cross the border more easily than the theorem does? A novel, after all, is largely a machine for demonstrating correlated error, and I suspect my craft has more to say about a room full of people being wrong together than about a room full of people being right.

  Close with the briefest answer you can give to the question I actually care about: does any of this correct how I should imagine twelve men in a shuttered room arriving at a verdict? Not plotting advice — a correction to the picture.
reasoning: |-
  Okay, the user is a novelist working on a story centered around a coroner's inquest with twelve jurors deciding a girl's fate. They've encountered the Condorcet jury theorem and its controversies but lack the technical background to fully grasp it. Their real need is to translate this mathematical concept into their narrative framework without distortion.

  The user explicitly lists their literary vocabulary—point of view, unreliable narrator, dramatic irony, etc.—and asks how the theorem's components map onto these. They're wary of forced analogies and want to know where the translation holds or breaks. 

  First, the theorem's binary proposition: novels deal in ambiguity, not yes/no questions. The verdict might be a superficial binary (accidental death vs. murder), but the truth beneath is likely layered—exactly where narrative tools like subtext operate. 

  Individual competence in the theorem becomes character credibility in the novel. But competence is probabilistic in math, while credibility is subjective and fluid in storytelling—shaped by unreliable narration or dramatic irony. 

  Independence is mathematically strict (no influence between voters). But in a novel, jurors inevitably influence each other through dialogue—that's the drama! The "no talking" analogy is crude and loses the theorem's rigor. 

  Sincerity? The theorem assumes honest votes, but novels thrive on hidden motives. An insincere juror is narrative gold, while in math it's noise. 

  Aggregation (majority vote) translates crudely to a verdict scene, but novels care about dissenters—their voices create tension. 

  Probability of correctness (0.94 likely right) has no narrative equivalent. Novels show certainty or doubt through character, not numbers. 

  Now the objections cross over beautifully: shared culture causing correlated error? That's a novel's natural habitat. Deliberation manufacturing false consensus? That's dramatic irony—readers see the error jurors miss. Confidently wrong majorities? That's the climax of half of courtroom fiction. 

  The residue report: 
  - Binary verdict: survives if treated as surface-layer, with subtext beneath. 
  - Competence → credibility: survives but becomes subjective. 
  - Independence: shatters; novels require interaction. 
  - Sincerity: inverted—insincerity is a feature, not a bug. 
  - Probability: no counterpart. 

  The verdict-correction: Yes—but paradoxically. The theorem suggests large groups amplify small individual competence. But the objections reveal how groups fail, and that's where your novel lives. Highlight the shared biases, the deference to confident voices, the way deliberation homogenizes error. The math's idealization is sterile; your tools expose why real verdicts go wrong. 

  Final note: The user's suspicion is correct—novels excel at depicting correlated failure, not mathematical truth-seeking. Lean into that.
answer: |-
  Here's a translation into your vocabulary, a residue report, and the verdict-correction you asked for. Scrupulosity enforced.

  **The Translation (Theorem Components → Narrative Terms):**

  1.  **The Proposition (Yes/No):** Becomes the **surface verdict** (e.g., "Accident" or "Suicide" or "Murder"). But crucially, the *narrative truth* is almost always more complex, residing in **subtext**, **implied authorial perspective**, **dramatic irony**, and the **gap** between the verdict and the scene-established facts/motifs. The binary proposition is the jury's *task*, not the novel's *subject*.
  2.  **Individual Competence (>50% Chance Correct):** Becomes **character credibility** or **perceived reliability**. This is built through: **focalization** (showing the juror's perspective/background), **showing vs. telling** (demonstrating their insight or bias through action/dialogue), and **implied authorial judgment** (does the narrative subtly endorse or undermine their view?). *Crucially: Novelistic "credibility" is rarely quantifiable or fixed; it shifts with context and revelation. It's not "55% likely right," but "we trust/doubt this voice based on textual evidence and craft."*
  3.  **Independence of Judgments:** Becomes the **illusion of isolated perspective** or **lack of overt collusion before deliberation**. This is maintained through **point of view** (restricting access to individual thoughts until shared), **sequencing** (presenting initial opinions separately), and **silence/subtext** (implying unshared thoughts). *Smuggling Alert:* This is **sleight of hand**. True mathematical independence (no shared biases, no pre-deliberation influence) is impossible in a realistic novel about men in a room. They share a culture, language, assumptions. The narrative can *show* initial differences but cannot *create* true probabilistic independence. The "no talking beforehand" rule is a thin veneer over deep correlation.
  4.  **Sincerity of Expression:** Becomes the **absence of overt unreliable narration (lying) by jurors during the vote**. We assume they *believe* their stated verdict. However, **subtext**, **dramatic irony**, and **gaps** between stated reason and scene-established motive can reveal self-deception, hidden agendas, or performative sincerity. Sincerity in the theorem is simple honesty; sincerity in the novel is psychological complexity.
  5.  **Aggregation Rule (Majority Vote):** Becomes the **dramatic structure of deliberation leading to a verdict**. It's rendered through **dialogue**, **shifts in focalization**, **escalating tension**, and the **erasure of minority perspectives** (often shown through silenced dissenters or conformist pressure). The *rule* itself is simple; the *process* of reaching the majority is the novel's meat.
  6.  **Group Probability of Correctness (→1 as N→∞):** Has **no direct narrative counterpart**. Novels deal in **certainty, doubt, ambiguity, irony, or tragedy** – not quantified likelihoods. A verdict can feel **inevitable** (foreshadowing, narrative momentum), **surprising** (plot twist, unreliable setup), **tragically wrong** (dramatic irony), or **profoundly ambiguous** (subtext, lack of closure). We *feel* the weight of the verdict's rightness or wrongness, but never as "94%."

  **The Residue Report:**

  *   **Survives Intact (Barely):**
      *   The *existence* of a binary task (verdict).
      *   The *structure* of aggregation (deliberation → majority vote).
      *   The *abstract concept* of individual judgment contributing to a collective outcome.
  *   **Survives with Significant Transformation/Subject Change:**
      *   **Competence → Credibility:** Survives, but transforms from a fixed probability to a fluid, textually constructed, and often contested *impression* of reliability/shrewdness built by craft. Subject changes from math to reader perception/authorial manipulation.
      *   **Independence → Initial Secrecy/Isolation:** Survives only as a procedural starting point ("jurors enter with private thoughts"). The core mathematical concept (statistical independence) is abandoned for narrative realism (shared culture, inevitable influence). Subject changes from probability to dramatic setup.
      *   **Sincerity → Ostensible Honesty:** Survives as the baseline assumption jurors aren't *lying outright during the vote*. Subject changes from simple truth-telling to the complex psychology of belief and self-presentation.
  *   **Has No Counterpart:**
      *   **Quantified Individual Competence:** Novels don't assign probabilities to character insight.
      *   **Quantified Group Probability:** Novels don't calculate the likelihood of a verdict's correctness.
      *   **True Statistical Independence:** Impossible within a shared narrative world exploring human interaction.

  **Which Way the Residue Cuts:**
  *   The lack of quantified probabilities isn't a hole in your vocabulary; it's evidence that the theorem operates in a fundamentally different realm (abstract probability) than narrative (embodied experience, psychology, meaning). Novels render the *quality* of belief and doubt, not its quantity.
  *   The theorem's core claim (large competent groups amplify small advantages) *feels* less substantive when stripped of its numbers and strict assumptions. Its power relies on the formalism.
  *   **The objections cross the border FAR more easily and richly:**
      *   **Shared Culture/Correlated Error:** This *is* the novel's domain. **Focalization** through specific cultural lenses, **shared assumptions** revealed in dialogue/subtext, **dramatic irony** showing the reader the bias the jurors share – these tools *excel* at depicting why independence fails. A novel is indeed a "machine for demonstrating correlated error."
      *   **Deliberation ≠ Accuracy:** The *process* of deliberation – persuasion, rhetoric, emotional appeals, deference to authority, suppression of dissent (all rendered through **dialogue**, **shifts in POV**, **showing** power dynamics) – is central drama. Showing how agreement emerges *without* truth is a core narrative strength.
      *   **Confidently Wrong Majority:** This is **dramatic irony** incarnate. The reader, armed with **scene-established facts**, **subtext**, or **implied authorial perspective**, sees the error the confident majority cannot. The gap between their certainty and the (narrative) truth creates profound tension and thematic depth. Your craft is perfectly suited to this.

  **The Verdict-Correction (for your 12 men):**

  **Yes.** The theorem suggests competence scales efficiently with group size. The objections, which translate powerfully into your craft, show how groups amplify *shared error* as efficiently as (or more than) individual competence. Your picture should emphasize the **correlated nature of their blindness** – the shared cultural assumptions, deference to confident voices, subtle pressures silencing doubt, and the way deliberation manufactures consensus *distinct* from truth. The mathematical ideal of independent jurors summing small competencies is sterile compared to the rich, flawed, often tragically interconnected process your novelistic tools depict. Focus on the **mechanisms of collective error** inherent in the deliberation machine. The room is far more likely to be *powerfully, confidently wrong together* than mathematically likely to be right.
