prompt: |-
  I'm in a philosophy of mind seminar that's basically all about naturalizing intentional content — Millikan, Dretske, that whole family of views where a state means X because it was selected for tracking X — and I have to write a short position paper where I actually stake out a credence and defend it, which is harder than it sounds. We meet for three hours on Tuesdays which is honestly too long, so alot of the arguing happens in my head on the walk home.

  Anyway, the thing I want to ask you about is a version of the view I've been sketching for the paper (no idea if it's already a named position or if I'm just reinventing something that exists): the content-fixing job belongs not to the state itself but to the consumer of the state — the downstream mechanism that reads the state and does something with it. So a state means whatever the consumer system was selected to respond to it as indicating. My toy case: imagine a bird with an internal state that fires when a hawk-shaped silhouette shows up, and the bird dives for cover; the diving behaviour is the consumer, and that's the bit that got selected. So the state is supposed to mean 'hawk there' and not 'hawk-or-a-researcher-holding-up-a-cutout there', because what was selected is a response that gets the bird away from hawks. That much I think I'm fine with. But then I ask what 'hawk' actually fixes to — the whole class of hawk-shaped things, or only the ones in the bird's ancestral range, or something narrower like 'things that will eat me' — and it starts to feel like the answer depends on how you individuate the selection pressure, which is exactly the thing that was supposed to be doing the fixing. So it's circular-ish or it's underdetermined, and I can't tell which.

  What I want from you is your actual credence that a consumer-based teleosemantics can solve this indeterminacy problem — i.e. that it can pin down a determinate content for a state without helping itself to something intentional along the way. I'm sitting at about 0.3 myself. Give me a number, and then decompose it: how much rides on (a) whether selection functions are themselves determinate enough to pick out one content rather than a disjunction, (b) whether 'normal conditions' for the consumer can be spelled out without circularity, (c) whether the story can handle a creature or a machine whose states were never selected for anything, or a state thats been co-opted for a job it wasn't selected for, (d) whether the whole thing just collapses into 'content is whatever makes the theorist's favourite explanation come out right', and (e) whatever other terms you think belong in there. A rough number and one line of justification for each, then how they combine. Then tell me which term my 0.3 and your number most likely come apart on, and what single argument or piece of evidence would move you the most.
