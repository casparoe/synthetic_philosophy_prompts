prompt: |-
  Ok so I'm running a reading group on Russell's paradox next month and I want the spec nailed down before we start arguing about whose solution is best. Put on your philosopher-of-math hat — someone who's taught foundations for years and is tired of hand-wavy answers.

  Write me the desiderata: what any adequate solution to Russell's paradox — i.e. a foundational theory of sets that can claim to have "dealt with" it — has to deliver. And dont just write "be consistent." I want the whole list. Things like: how much of naive comprehension it has to keep, and which parts (does every predicate need an extension, or only the ones math actually uses?); whether it has to handle the other paradoxes too (the liar and the semantic ones — is taming those part of the job or a separate project?); whether it has to explain *why* we were tempted to assume unrestricted comprehension in the first place, or whether just blocking the move is enough; whether it needs an independently motivated picture of what sets are (the iterative conception or otherwise) rather than a restriction that looks ad hoc; what it has to do for real mathematics (analysis, category theory, large cardinals...); and what it can say about its own consistency given Godel.

  For each desideratum, give me the case behind it — the concrete thing that breaks if you drop it. Then flag which pairs of desiderata can't be satisfied at the same time; I have a strong suspicion a couple are in flat tension, and honestly thats the part I care about most. Also tell me which single requirement does the most to rule out candidate solutions.

  Keep the weight on the criteria — I'll score ZF vs type theory vs New Foundations vs whatever myself in the session (a one-line note on each is welcome though).

  Take a breath and brainstorm before you write, and please dont just regurgitate the textbook list. The whole point is to sort out which of these demands are genuine requirements and which are just habits of one tradition.
