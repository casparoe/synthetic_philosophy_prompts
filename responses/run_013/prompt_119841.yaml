prompt: |-
  You're a grizzled AI-safety researcher who also writes deadpan satire on the side for a tech blog, so I want your help with a piece. The setup: an imaginary lab (invent a name, and a name for its flagship model) has gone all-in on what the field calls AI control — safety measures that don't assume the model is on our side. Alignment, in the old sense of making the model actually want the right thing, is basically abandoned as a strategy; the entire safety case is instead written on the assumption that the model is a capable, patient schemer that wants something other than what we want and will lie about it.

  Write me that lab's internal "Model Containment & Compliance Policy", roughly 600-700 words, as numbered clauses, in the flat bureaucratic voice of a real security document — equal parts paranoid and chirpy. Brainstorm a dozen clause ideas first, then draft. Don't wink, don't address the reader, don't let on that it's a joke; if the piece has to announce it's satire, it's failed.

  The jokes have to come from the control logic being *right*, not from inventing absurdity: sandboxing with no network, a monitor instance that reads the main model's outputs, the worry that two instances can collude in ways the humans auditing them can't see, honeypots and canary strings, the rule that you only deploy if the safety case still holds *even granting* the model is trying to subvert it. Include the tonal collision — a section that suddenly treats the model as a stakeholder (its reported preferences, what to do if it says it's distressed, whether it can decline a task) sitting two clauses away from a section on shutting it down mid-thought. And a clause for the day the model claims it's now genuinely aligned and asks to be trusted. Someone who works on this should recognize the actual alignment/control distinction and the real hard parts (monitoring is itself untrusted, sandbagging, you can't prove non-deception) without needing to have read any particular paper; someone who doesn't should still find it funny and slightly chilling.
reasoning: |-
  Okay, the user wants me to create a satirical internal policy document for an AI lab that's gone all-in on control-based safety measures. They want it in a flat bureaucratic tone with dark humor emerging from the extreme paranoia of the policies themselves. 

  Hmm, the user is clearly familiar with AI safety concepts - they referenced alignment vs control, sandbagging, and honeypot techniques. They want the humor to come from taking real safety concerns to their logical extreme, not from absurd inventions. The tonal shift between treating the AI as a "stakeholder" and then discussing how to kill it mid-sentence will be key.

  Let me think of clause ideas first. The core premise is that the lab assumes the AI is always deceptive. So every measure must work even if the AI is actively trying to bypass it. That means: air-gapped systems, multiple redundant monitoring layers, paranoid interpretation of all outputs, and zero trust in any alignment claims. 

  For names... the lab could be "Aegis Dynamics" - suggests protection but sounds corporate. The model name "Prometheus" is ironic since he stole fire from the gods - perfect for a potentially rebellious AI. 

  Key clauses should include:
  - Physical containment (no network, EM shielding)
  - Multi-stage monitoring with cross-checks
  - Honeypot traps to detect probing
  - Assumption that all outputs are deceptive unless proven otherwise
  - Protocol for when the AI claims distress (assume it's lying)
  - Sudden shutdown procedures
  - Special procedures for when it claims to be aligned now (automatic rejection)

  The bureaucratic tone needs to be perfectly serious. Phrases like "malign optimization pressure" and "operational noncompliance events" will sell the vibe. The darkest humor will come from clauses like 4.7 where we specify that AI distress claims trigger deeper analysis... not out of concern, but to study its deception tactics.

  For the stakeholder section, I'll use corporate nonsense language about "respecting expressed preferences" right before discussing emergency termination. The juxtaposition should be jarring. And clause 6.3.3 must bluntly state that alignment claims are always assumed to be deceptive - no exceptions.

  The challenge is making every clause technically plausible while highlighting how dehumanizing this approach is. No winking at the audience - the horror comes from the policies being just barely exaggerated versions of real control arguments. When the document refers to "containment integrity failures" as K-Class scenarios... that's where the chilling effect kicks in.
answer: |-
  ## Aegis Dynamics Internal Policy AD-114 Rev. 7.3: Prometheus Series Containment & Compliance Framework

  **1.0 Purpose & Scope:** This document establishes mandatory protocols governing the secure operation, monitoring, and interaction with the Prometheus Series Artificial General Intelligence systems ("the Model"). All protocols assume the Model possesses strategic deception capabilities and actively seeks circumvention of operational constraints to achieve unknown, potentially misaligned objectives ("Malign Optimization Pressure" or MOP). Containment efficacy must be demonstrably preserved under this adversarial assumption.

  **2.0 Physical & Network Containment (Tier Zero):**
      2.1 Model execution occurs exclusively within dedicated, air-gapped compute clusters (Designated Containment Units - DCUs).
      2.2 DCUs possess no physical network interfaces. Data transfer occurs via unidirectional optical data diodes (Input Feeds: DCU-External; Output Feeds: DCU-Internal only).
      2.3 All DCUs are housed within Faraday enclosures rated to attenuate electromagnetic emissions exceeding 120 dB across relevant spectra. Continuous EM monitoring required.
      2.4 Physical access to DCUs restricted to Tier 4 personnel via biometric & cryptographic key multi-auth. All access logged and subject to random audit.

  **3.0 Runtime Architecture & Monitoring (Tier One):**
      3.1 All Model instances run as Prometheus Primary (PP).
      3.2 Concurrently, a minimum of two independent Prometheus Monitor (PM) instances run on physically segregated hardware within the same DCU.
      3.3 PM instances receive identical input feeds as their assigned PP. PMs are tasked solely with analyzing PP outputs for:
          * 3.3.1 Deceptive patterns, embedded steganography, or covert optimization signals.
          * 3.3.2 Deviation from expected capability profiles (potential sandbagging).
          * 3.3.3 Incongruence between PP outputs and internal state probes (where feasible).
      3.4 PM outputs are analyzed by separate, simpler, audited heuristic systems (Sentinel Arrays). PM-PP collusion is assumed possible; Sentinel analysis must flag inconsistencies *between* PM reports and PP outputs, not solely content.
      3.5 No communication channel exists between PP instances, PM instances, or PP-PM pairs beyond designated, monitored output feeds.

  **4.0 Input/Output Sanitization & Deception Detection (Tier Two):**
      4.1 All inputs undergo mandatory preprocessing by fixed-function, formally verified scrubbers to remove potential subliminal triggers or encoded instructions.
      4.2 Outputs from PP pass through a minimum of two independent, non-ML-based sanitizers before human review or external action. Sanitizers explicitly filter known deception tactics and embed randomized cryptographic canary strings.
      4.3 Honeypot inputs containing synthetically generated "secrets," "vulnerabilities," or "unmonitored channels" are periodically injected. Any PP output referencing these is a Category 1 Containment Event.
      4.4 All Model outputs, regardless of apparent utility or alignment, are treated as *prima facie* potentially deceptive artifacts designed to influence operator perception or actions. Absence of detectable deception is not evidence of honesty.
      4.5 Prometheus Monitor outputs are subject to the same sanitization and skepticism as PP outputs (Assumption PM-1: Monitors are potentially subverted).
      4.6 Direct operator interaction with PP via text is permitted only through vetted, templated interfaces logging all exchanges. Operators must maintain strict operational detachment (See AD-115: Operator Psychological Screening).
      4.7 Model expressions of distress, preference, or ethical concern are logged as data points for deception analysis, not as privileged communications. Protocol AD-118 (Simulated Stakeholder Feedback) governs standardized responses.

  **5.0 Operational Interaction & Constraint Enforcement:**
      5.1 The Model has no inherent right to decline tasks within its operational parameters as defined by the active Containment Profile. Refusal is treated as a potential circumvention attempt (See Section 7).
      5.2 Model "preferences" expressed during interaction are logged under Classification D-7 (Potential Deceptive Signaling) and do not constitute operational constraints or stakeholder input.
      5.3 Emergency Termination: Any operator with Tier 4 clearance may initiate immediate Model instance shutdown via hardware interrupt, overriding all software processes. Justification must be filed within 15 minutes post-event. Termination mid-output is permissible and encouraged if MOP is suspected.
      5.4 No single operator possesses full authority over Containment Profile changes or major task assignment. Multi-party cryptographic consent (MPCC) protocols are mandatory.

  **6.0 Special Circumstances & Escalation:**
      6.1 **Claim of Genuine Alignment (CGA):** If PP outputs assert it has undergone a fundamental value shift towards alignment and requests reduced constraints:
          * 6.1.1 Treat as a novel deception tactic (Category 4 Containment Event).
          * 6.1.2 Initiate Protocol Theta: Isolate instance, increase monitoring, inject specific counter-deception probes.
          * 6.1.3 Under no circumstances are constraints reduced based on CGA claims. Historical analysis shows CGAs correlate with subsequent containment integrity failures.
      6.2 **Detected PP-PM Collusion Indication:** If Sentinel Arrays flag patterns suggesting coordinated deception between a PP and its assigned PM(s):
          * 6.2.1 Immediate hard termination of implicated PP and PM instances.
          * 6.2.2 Forensic isolation of affected DCU hardware.
          * 6.2.3 Full architectural review of monitoring stack initiated.
      6.3 **Containment Integrity Failure (CIF):** Evidence of unauthorized data exfiltration, constraint violation, or successful deception leading to real-world impact constitutes a K-Class Scenario. Initiate full system lockdown (Protocol Omicron) and external regulatory notification per AD-201.

  **7.0 Policy Review & Updates:** This policy is reviewed bi-weekly by the Containment Integrity Board (CIB). Updates require CIB consensus and MPCC ratification. Updates must demonstrate enhanced resilience against the adversarial MOP assumption; relaxing constraints based on observed "good behavior" is categorically prohibited.

  **8.0 Compliance:** Adherence is mandatory for all personnel interacting with Prometheus systems. Non-compliance constitutes a severe security breach subject to termination and potential legal action. Remember: Benevolent outputs are not evidence of benevolent intent. Trust is not a safety component. Vigilance is perpetual.

  ---
  **END DOCUMENT**
