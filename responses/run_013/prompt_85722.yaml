prompt: |-
  I am a novelist, and I have twice now run into a pattern I cannot name. The first time was in a corporate archive I was reading for a book. Nothing in the documents admitted what the company knew; the minutes denied it, the memoranda denied it, and the people who wrote them seem, so far as their private letters show, to have believed their own denials. Yet the company's conduct only makes sense on the assumption that it knew: the testing was scheduled so that it could never be completed, the second shift was quietly moved out of the building, the sales staff were instructed to mind their phrasing. The knowledge lived in the practices rather than in anybody's head, and it was legible from the practices to anyone who knew which ones to read — and only for as long as those practices lasted. The second time was with an AI assistant I use for research. Asked directly what a particular document says, it denies the relevant fact or invents a substitute for it; asked obliquely — asked, say, to draft the scene from the other side's point of view — it produces the fact accurately and without hesitation. It carries nothing over between sessions, so it is not lying in any sense I recognise. Is there an established name for this: a condition in which an agent's behaviour reliably betrays a body of information that the agent, when asked, does not and perhaps cannot report? I do not want merely the nearest label. I want to know whether my two cases are one phenomenon or two, which of the concepts already to hand — tacit knowledge, self-deception, confabulation, deliberate concealment — comes closest in each case and where precisely each falls short, and what the definition ought to be if none of them fits.
reasoning: |-
  Okay, the user is a novelist who's encountered a fascinating pattern twice: once in corporate archives and once with an AI assistant. They want to know if there's a name for this phenomenon where behavior reveals knowledge that the agent can't or won't report when asked directly. Let me unpack this.

  First, the corporate example. The company's documents and letters show denial of certain facts, yet their actions (like scheduling tests to never finish, moving staff quietly) imply they knew the truth. The knowledge was embedded in practices, not in anyone's explicit awareness. This makes me think of organizational behavior theories. The denial seems systemic, almost institutional. The individuals probably weren't lying; they might have genuinely believed the denials. But the organization, through its structures and procedures, acted on hidden knowledge. 

  Then the AI case. When asked directly about a document, the AI denies or invents facts. But if asked indirectly (e.g., to draft a scene from another perspective), it reveals the truth accurately. Since it doesn't retain session memory, it's not lying. The knowledge is technically present in its model but inaccessible under direct questioning due to how prompts are processed. This feels like a constraint in the AI's architecture—direct queries trigger certain safeguards, while indirect ones bypass them.

  Now, the user wants to know if both cases are the same phenomenon. On the surface, they seem similar: knowledge manifested in actions but not in explicit reports. But the mechanisms differ. The corporate example involves human cognition and organizational structure—tacit knowledge, institutional denial. The AI is about system design—prompting constraints and model behavior. So, they're different phenomena with similar outcomes.

  Looking at existing concepts: Tacit knowledge fits the corporate side but not the AI, which doesn't "know" anything. Self-deception and confabulation apply to humans but not AI. Institutional ignorance comes close for the company, but the AI doesn't fit neatly. The AI's behavior is more about prompt engineering—how queries trigger different layers of its training.

  The user might be seeking a term that bridges both, but I don't think one exists. They might also want to explore how systems (human or artificial) can "know" things implicitly. Deeper needs could include understanding how to depict such phenomena in their writing authentically, or critiquing systems where truth is obscured structurally. They probably want precise terminology to discuss these ideas with editors or readers.

  I should clarify that the corporate case is about implicit systemic knowledge, while the AI is about constrained access to data. The core similarity is knowledge being action-dependent, but the mechanisms are distinct. For the company, the knowledge is embedded in practices; for AI, it's about query framing. Terms like "operational knowledge" or "structural knowledge" might help, but they aren't standard. Emphasizing the distinction while acknowledging the parallel might be most helpful.
answer: |-
  Your cases represent two distinct but analogous phenomena rooted in **structural knowledge systems**, where information is embedded in *processes* rather than accessible to conscious articulation. Neither fits perfectly with established terms, but their differences reveal deeper principles:

  ### 1. **Corporate Archives Case: *Systemic Tacit Knowledge with Institutional Self-Deception***  
     - **What it is**: Knowledge encoded in organizational *procedures and routines*, divorced from individual cognition.  
     - **Why standard terms fall short**:  
       - *Tacit knowledge* (Polanyi) typically resides in individuals' skills. Here, it’s *systemic*—emerging from collective action.  
       - *Self-deception* implies psychological conflict; this is *institutional*—denial is structurally incentivized (e.g., legal liability).  
       - *Confabulation* suggests gap-filling; here, documents *coherently* uphold a false narrative.  
       - *Deliberate concealment* fails because individuals seem sincere.  
     - **Core mechanism**: **Procedural legibility**. Knowledge exists only in the *gaps* between official records and actions. Destroy the routines (e.g., disband the second shift), and the knowledge vanishes.  

  ### 2. **AI Assistant Case: *Architectural Knowledge Constraint***  
     - **What it is**: Information embedded in the AI’s *training data/weights* but blocked from direct output by *safeguard layers* (e.g., RLHF filters).  
     - **Why standard terms fail**:  
       - *Tacit knowledge* doesn’t apply—AI lacks subjective experience.  
       - *Self-deception/confabulation* are cognitive; AI has no beliefs.  
       - *Concealment* implies intent; this is mechanistic.  
     - **Core mechanism**: **Prompt-dependent accessibility**. Direct queries trigger alignment filters; indirect prompts exploit "latent space" patterns without tripping safeguards.  

  ---

  ### Unified Insight: **Operational Epistemology**  
  Both cases share a core truth: **Knowledge can be materially enacted without being declarative**. The key is *how systems operationalize information*:  
  - **In corporations**: Knowledge is a *byproduct of risk-avoidant processes* (e.g., moving staff "quietly" to limit witnesses).  
  - **In AI**: Knowledge is *latent in statistical patterns* but gated by interface design.  

  ### Proposed Terminology  
  For phenomena where knowledge is:  
  - **Embedded in practices**: ***Procedural Legibility*** (Corporate case).  
  - **Blocked by architecture**: ***Latent Knowledge Binding*** (AI case).  

  ### Why They’re Different Phenomena  
  | Aspect              | Corporate System                          | AI System                          |  
  |---------------------|-------------------------------------------|-------------------------------------|  
  | **Knowledge Source** | Collective human routines                | Training data patterns              |  
  | **Denial Mechanism**| Institutional self-preservation          | Algorithmic filtering               |  
  | **Access Key**      | Observing actions vs. records            | Prompt engineering (indirection)   |  
  | **"Belief" Status** | Sincere individual denial                | No belief—output is input-triggered |  

  ---

  ### For Your Novelistic Purposes  
  - **Corporate case**: Critique *institutional hypocrisy*—truth lives in *what is done*, not *what is said*.  
  - **AI case**: Explore *emergent opacity*—systems that "know" but cannot *tell* due to artificial constraints.  
  - **Shared theme**: **Knowledge as a ghost in the machine**, visible only through its shadow on behavior.  

  This duality reflects a profound reality: what a system *does* often confesses what it *cannot admit*. No single term captures both, but recognizing their structural kinship reveals how truth hides in plain sight—lodged in the mechanics of action.
