answer: |-
  ### Speech Outline  
  1. **Open with the night:** Vivid snapshot of the fire’s ignition point.  
  2. **Two stories, one night:** Contrast providence ("wind turned") vs. fluke ("wheel broke") narratives.  
  3. **Cause ≠ Inevitability:** The lamp fell, the wind blew—but none of this *had* to happen.  
  4. **Unpredictable ≠ Undetermined:** A determined chain can still be unforeseeable (like weather).  
  5. **The counterfactual trap:** Changing one thread unravels the whole tapestry—we can’t know "what if."  
  6. **Meaning in the ledger:** Edith’s choice—agency amid chaos—defines legacy without destiny.  

  ---

  ### Speech: "The Threads of April, 1908"  
  (900 words; approx. 6 minutes)  

  Good morning. I want to take you back to a Thursday night in April 1908. Behind the Queen’s Hotel, in the livery stable, a coal-oil lamp slips from a shelf. A spark meets dry wood. A northwest wind fans it toward Mill Street. By two a.m., nine buildings are ash. Three lives are lost. The wind turns south. The church and school survive.  

  Ashwater has carried two stories about that night ever since. One hangs in the church narthex: the wind turned, Providence intervened. The other’s told at the Legion: a lamp fell, a wheel broke, a gust blew—flukes stacked like kindling. Two stories. One insists it was meant; the other says it was blind chance. But tonight, at this marker, I think we owe the past something sharper than a fable or a shrug.  

  Here’s the first thing we must untangle: **A thing can be caused without being inevitable.** That lamp fell because a stable hand bumped it. The wind blew northwest because pressure systems shifted that day. The hose cart lost a wheel because the axle was weak, the road was rutted. Causes, all of them—ordinary, physical, real as the embers that fell on Mill Street. But *not one* of those causes was fated. The lamp didn’t *have* to slip. The wind didn’t *owe* us a southerly turn. The wheel didn’t *decide* to break. We live in a world of dominoes—but someone still has to flick the first one. What happened that night wasn’t written. It unfolded.  

  That leads to the second knot: **“Unpredictable” is not the same as “undetermined.”** Think of a thunderstorm. The rain falls because the clouds gathered, the air cooled, the moisture condensed. It’s determined by the laws of nature. But could old Joe Harkness, leaning on his fence at dawn, have *known* it would storm at three p.m.? Not a chance. Too many variables. Too many tiny shifts in the wind. April 1908 was like that. Every step—the lamp, the wind, the wheel—was part of a chain. But chains can tangle in ways no one can see coming. To call it “random” just because we couldn’t predict it? That’s confusing our eyes with the world’s gears.  

  Which brings us to the third tangle—the one that haunts the Legion’s "what ifs." **We cannot run the counterfactual.** We can’t rewind to Mill Street and say, “*If* the wheel hadn’t broke, the north side would still stand.” Why? Because once you change one thread, the whole tapestry shifts. If the wheel holds, do they douse the fire faster? Maybe. But what if, in those saved minutes, the brigade rushes toward the hotel just as the wind spits an ember onto the roof of Cooper’s Dry Goods? What if the mayor’s cousin, running with a bucket, trips and blocks the alley? When you unpick one stitch in a night like that—a night of dry wood, dry wind, and human haste—you don’t get to freeze the rest of the picture. The dominoes fall differently. We can wish. We can grieve. But we don’t get to know. “If” is a guess wearing a fact’s coat.  

  And yet—here’s where we turn—**not knowing “what if” doesn’t drain the night of meaning.** This brings me to my great-great-aunt, Edith Vance. Hotel keeper’s wife. She escaped the fire. Then she went back. For the ledgers. Not for jewels. Not for heirlooms. For the books that recorded who owed what, who’d paid, who’d promised. She chose that. In the smoke, in the roar, in a storm of flukes and causes no one could steer, she made a decision. And she did not come out.  

  *That*—that choice—is where meaning lives. Not in the wind, or the wheel, or the whims of chaos. But in the act of a woman who, faced with a collapsing world, reached for what she felt mattered. We dishonor her if we call it destiny: “God needed ledger-keepers in heaven.” We abandon her if we call it accident: “Just bad luck she turned left, not right.” Edith Vance wasn’t a leaf blown into the flames. She was a person who, in a moment no one could have scripted, *acted*.  

  This marker we unveil today? It’s not a monument to fate or fluke. It’s a witness to a night that changed Ashwater. A night stitched from causes but not cursed by inevitability. A night determined by a thousand gears—wind, wood, human hands—yet still wild with surprise. A night whose “might-have-beens” we’ll never own. But it’s also a marker for Edith. For the stable hand whose name we say today. For the boarder far from home. For the choices made in the dark.  

  We stand here as their descendants. Not because the fire “meant” to spare us. Not because chaos “let” us exist. But because in a fragile April night—a night that could have unspun in a hundred other ways—they lived. They acted. They left ledgers, and legacies, and us.  

  Unveil this, then, with clear eyes. Not Providence’s plot. Not accident’s alibi. But history: real, knotted, human. And in the clearing, see Edith, walking back in.  

  Thank you.  

  ---

  ### Philosophy as Load-Bearing Structure  
  - **Cause vs. Inevitability:** Undercuts both "destiny" (church plaque) and "pure randomness" (Legion). Uses domino metaphor (physical cause ≠ cosmic design).  
  - **Unpredictable vs. Undetermined:** Weather analogy makes determinism accessible. Farmers know you can't predict storms—but they're not "random."  
  - **Counterfactual Trap:** "Tapestry" visual rejects simplistic "if-then." Speaks to cousin Dean (physics acknowledges entanglement).  
  - **Meaning in Choice:** Edith’s agency is the keystone. Philosophy creates space for her act to matter *without* requiring destiny or dismissing loss as "bad luck."  

  **Removed per Request:** Butterflies, quotes, citations, "small things matter" platitudes. Jargon like "chaos theory" or "determinism" replaced with dominoes/weather/tapestry.
