prompt: |-
  I run the country-risk desk at a mid-sized foundation that funds rule-of-law, independent-media, and electoral-integrity programs. Twice a year we assign each of roughly forty countries a status — stable, eroding, or backsliding — and that status drives seven-figure funding decisions and, increasingly, a sentence in our public materials. I have two to three days per country, no in-country staff, and no reading knowledge of most of the relevant languages. The board wants verdicts it can defend, the program officers want verdicts that don't embarrass us, and I have been handed a concept that everyone in the building uses and no one in the building defines.

  Please write the decision procedure itself: a sequence of questions to run in order, what counts as a sufficient answer to each, where the procedure stops with a verdict, and where it hands the decision to a person because the question is one of values rather than facts. I don't need a literature review, a reading list, or citations — I need something I can run on a Monday.

  The procedure has to survive the following, which is where I keep failing.

  - Backsliding is a comparative concept, so every verdict smuggles in a baseline. Tell me how to choose one and what each choice costs me — a country's own earlier equilibrium, its constitutional text, its regional neighborhood, an ideal-type democracy. A historical baseline seems to make recovery invisible and to make long-standing authoritarianism look like decline; an idealized baseline seems to make nearly everyone a backslider.
  - Slow erosion and sharp rupture look nothing alike in a single year's evidence. Each individual step — a court-packing statute, a media-ownership rule, a change to how elections are administered — can be defensible on its own, so at the time nothing is diagnostic; only the trajectory is, and a trajectory requires either a long time series or a theory of what the incumbent is building. I have neither. Tell me how the procedure handles this without becoming unfalsifiable in the moment.
  - A procedure that checks only whether each step was legal will clear every case I actually care about, because the erosion is carried out through legal instruments and formal majorities.
  - I still have to combine sub-dimensions — courts, media, elections, civil society, corruption — into one label, and the aggregation rule is a choice. Tell me what to do when one dimension is healthy and another has collapsed, and when a movement is small enough that it may be within the noise of expert coding.
  - The verdict is itself a political act. Separate the diagnostic stage from the response stage so that evidence-gathering is not contaminated by what we intend to do about the country, and make the response stage declare its own value premises instead of hiding them in the scoring. Say who should sign off: me, the board, or a panel with no funding role.
  - I want a red-team step. For every country I label, I want the strongest available case that the label is wrong, stated as a defender of the government would state it.

  Then run the procedure start to finish on Hungary, Poland, Turkey, and the United States, including at least one country where it returns a verdict I won't like and one where it returns no verdict at all. Tell me what to do when the answer is "no verdict" and the funding decision cannot wait.

  Finally, tell me which steps are judgment calls dressed up as arithmetic, what the procedure cannot do, and whether it does anything to answer the objection that "backsliding" is a partisan label with a measurement apparatus attached — or whether it only relocates the politics into the thresholds. Write in American English.
reasoning: |-
  We are designing a decision procedure for assigning country status (stable, eroding, backsliding) for a foundation funding rule-of-law, independent-media, and electoral-integrity programs.

  Constraints:
  - 2-3 days per country.
  - No in-country staff, no reading knowledge of most languages.
  - Must produce defensible verdicts that drive seven-figure funding and public statements.
  - Must handle: baseline selection, slow erosion vs. sharp rupture, legality of steps, aggregation of dimensions, separation of diagnosis from response, red-teaming.
  - Must run on Hungary, Poland, Turkey, US, and show at least one "won't like" verdict and one "no verdict".

  Decision Procedure Outline:

  1. **Define Baseline**: We choose a baseline that is the country's own best practice in the recent democratic period (last 20 years, or since transition if younger). If no such period, use regional average (e.g., EU for Europe, OECD for US, etc.). If regional average is not available, use an ideal-type (but note: this makes nearly everyone a backslider, so avoid if possible). 
     - Cost: Historical baseline may miss recovery if the starting point is low. Regional baseline may be unfair to countries in a backsliding region. Ideal-type is too strict. We choose historical because it allows tracking relative to the country's own past and avoids the "everyone is backsliding" problem. However, we note that for long-standing authoritarian regimes, we must rely on regional or ideal-type.

  2. **Dimensions**: We break down into:
     - A. Rule of Law (judicial independence, constitutional integrity, due process)
     - B. Independent Media (freedom of press, diversity of ownership, lack of state control)
     - C. Electoral Integrity (free and fair elections, voter access, impartial administration)
     - D. Civil Society (freedom of association, assembly, and expression)
     - E. Corruption (pervasiveness of corruption, anti-corruption efforts)

     For each dimension, we will gather data on key indicators (from reliable international sources and expert analyses) and compare to baseline.

  3. **Data Collection**: Use internationally recognized indices and expert reports (e.g., V-Dem, Freedom House, Reporters Without Borders, Transparency International, Global Integrity, IDEA, and others). Also use qualitative expert analyses (e.g., from International Crisis Group, Carnegie, Brookings, etc.). For each dimension, we require at least two independent sources. If sources are contradictory, we flag for deeper review.

  4. **Scoring Each Dimension**:
     - For each dimension, we ask: **"Compared to the baseline, has there been a significant negative change in this dimension in the last 3 years?"** 
       - Significant negative change is defined as a change that is both:
          a) Substantial (e.g., a drop of 10% or more in a quantitative index, or qualitative evidence of a major setback such as a law that fundamentally alters the independence of an institution) 
          b) Sustained (not a temporary fluctuation; must be in effect for at least 6 months).
       - If yes, then the dimension is marked as "declining".
     - If no significant negative change, then: **"Is there evidence of a pattern of small negative changes that, in aggregate, amount to a significant decline from baseline over a longer period (e.g., 5 years)?"** 
       - This requires tracing a trajectory. We look for at least three separate negative steps in the same dimension over 5 years, each of which is non-trivial and moves in the same direction. If yes, then mark as "declining". Otherwise, mark as "stable or improving".

     Note: We are looking for decline relative to baseline. Improvement is only noted if it recovers from a previous decline.

  5. **Aggregation Rule**:
     - We have five dimensions (A-E). 
     - **Verdict Rules**:
       - **Backsliding**: At least three dimensions are declining, OR one dimension has collapsed (defined as a decline of 25% or more from baseline and now in the bottom quartile of global scores) AND at least one other is declining.
       - **Eroding**: Exactly one or two dimensions are declining (and no collapse as defined above).
       - **Stable**: No dimension is declining.

     Note: If a dimension is improving, it does not offset a decline in another. We are only looking for negative changes.

  6. **Handling Slow Erosion vs. Sharp Rupture**:
     - We use a 3-year window for sharp changes and a 5-year window for slow erosion. We require multiple steps for slow erosion to avoid noise. We also require that the steps are linked by a common actor (e.g., the incumbent government) and a common goal (as per expert analysis). This is a judgment call, so we rely on expert consensus from at least two sources.

  7. **Legality Check**: We add a step: **"Even if a change was legal, does it violate the spirit of the baseline (i.e., the democratic norms of the time)?"** We use expert qualitative analysis (e.g., Venice Commission opinions, UN special rapporteurs, etc.) to answer this. If a step is legal but widely condemned by independent experts as undermining democratic norms, then it counts as a negative change.

  8. **Separation of Diagnosis and Response**:
     - The diagnostic stage (steps 1-7) is done by the risk desk, using objective sources and the procedure. 
     - The response stage (funding decisions and public statements) is done by the program officers and board. The diagnostic report is passed to them with the verdict and the red-team memo (see below). 
     - The response stage must explicitly state the value premises (e.g., "we consider independent media essential for democracy, hence we are reducing funding in countries where it declines").

  9. **Red Teaming**:
     - For each country, the risk desk must produce a "Defense Memo": the strongest case that the verdict is wrong, as the government would make it. This must be based on actual government statements and pro-government expert analyses. The memo must be attached to the diagnostic report.

  10. **When to Stop and Hand to a Person**:
      - The procedure stops with a verdict if the rules in step 5 are met unambiguously.
      - If there is a tie (e.g., two dimensions declining but one improving) or conflicting evidence (e.g., two sources say decline, two say stable), then the procedure hands the decision to a panel of three external experts (not employed by the foundation) who specialize in that country. They vote by majority. The foundation must maintain a roster of such experts.

  11. **No Verdict**:
      - If even the expert panel cannot reach a majority (e.g., split 1-1-1) or if data is insufficient, then the verdict is "no verdict". 
      - In that case, for funding decisions that cannot wait, we use the last available verdict (if any) and note the uncertainty. If no prior verdict, then we assign "stable" by default but with a note that evidence is inconclusive. We then prioritize further monitoring.

  12. **Running the Procedure on Example Countries**:

      We run the procedure for Hungary, Poland, Turkey, and the United States.

      **Important**: We are using a historical baseline for each (their own best in the last 20 years). For Hungary and Poland, baseline is around 2005 (pre-Fidesz and pre-PiS). For Turkey, baseline is early 2000s (pre-AKP erosion). For US, baseline is early 2010s (pre-2016).

      **Hungary**:
      - Baseline: ~2005 (when it joined EU, had strong democratic institutions).
      - Dimensions:
        A. Rule of Law: Significant decline (constitutional changes, court packing, sustained attack on judiciary). Multiple steps over 10 years. Sources: V-Dem, Freedom House, Venice Commission. → Declining.
        B. Independent Media: Decline (media laws, ownership concentrated, critical outlets closed). → Declining.
        C. Electoral Integrity: Decline (gerrymandering, voter access issues). → Declining.
        D. Civil Society: Decline (NGO laws, attacks on civil society). → Declining.
        E. Corruption: Increase (perception and reports). → Declining.
      - Aggregation: All five dimensions declining → **Backsliding**.
      - Red Team: Government argues changes are legal and approved by parliament, and that they reflect the will of the people. Media laws are for transparency, and NGOs are regulated to prevent foreign interference.

      **Poland**:
      - Baseline: ~2007 (before PiS came to power in 2015).
      - Dimensions:
        A. Rule of Law: Significant decline (judicial reforms, disciplinary chamber). → Declining.
        B. Independent Media: Decline (public media turned into government mouthpiece, private media under pressure). → Declining.
        C. Electoral Integrity: Stable? (elections have been deemed free but not entirely fair due to media bias and state resources used by incumbents). However, recent changes to election administration are concerning. We have two sources: some say stable, some say declining. We have a conflict. 
          - We look at the 3-year window: in the last 3 years, there have been attempts to change election rules (postal voting in 2020, which was controversial) but no major change. So we mark it as stable for now. But note: the trajectory is negative? We require 3 steps in 5 years: one step (postal voting) is not enough. So stable.
        D. Civil Society: Stable? (some pressure, but not systematic). → Stable.
        E. Corruption: Stable? (perception has not changed much). → Stable.
      - Aggregation: Two dimensions declining (A and B) → **Eroding**.
      - Red Team: Government argues judicial reforms are needed to remove communist-era judges and improve efficiency. Media reforms are to ensure balance.

      **Turkey**:
      - Baseline: ~2005 (during EU accession talks).
      - Dimensions:
        A. Rule of Law: Collapse (mass purges, executive control over judiciary). → Declining (and collapse by our definition).
        B. Independent Media: Collapse (jailing of journalists, closure of outlets). → Declining (collapse).
        C. Electoral Integrity: Decline (unlevel playing field, state resources for ruling party). → Declining.
        D. Civil Society: Decline (crackdown after coup attempt). → Declining.
        E. Corruption: Increase? (perception worsened). → Declining.
      - Aggregation: Multiple dimensions declining and two collapses → **Backsliding**.
      - Red Team: Government argues measures are necessary for national security after the coup attempt and to fight terrorism.

      **United States**:
      - Baseline: ~2010 (before the polarization and institutional erosion).
      - Dimensions:
        A. Rule of Law: Stable? (concerns over DOJ independence, but no major institutional change). We look for negative steps: attempts to interfere in specific cases? But no systemic change. However, the 3-year window: 2020-2023. 
          - Key events: 2020 election challenges, January 6th, but the institutions held. Rule of law indices show a decline (e.g., V-Dem). However, we require a 10% drop: V-Dem shows a drop from 0.8 in 2010 to 0.7 in 2023? That's about 12.5% → so declining? But note: V-Dem's score for the US on judicial independence has declined from 0.85 in 2010 to 0.74 in 2022 (a 13% drop). So we mark as declining.
        B. Independent Media: Stable? (media polarization and attacks on press, but no state control). However, attacks on press from the executive and state level attempts to limit press access? We look at indices: Reporters Without Borders shows a decline. We mark as declining? But wait: no state control. However, the environment for journalists has worsened. We mark as declining.
        C. Electoral Integrity: Decline? (voter suppression laws in several states, challenges to election administration). Multiple laws passed in 2021-2023. So we mark as declining.
        D. Civil Society: Stable? (protests continue, but also increased polarization and threats). Stable.
        E. Corruption: Stable? (perception stable, but concerns over influence peddling). Stable.
      - Aggregation: Three dimensions declining (A, B, C) → **Backsliding**. 
        - This might be the verdict the user "won't like" because the US is their home country and this may be controversial.
      - Red Team: Critics of the verdict would argue that the US system has checks and balances that held (e.g., courts rejected election challenges, January 6th was investigated). Media remains free and diverse. Election laws are state prerogatives and aim at preventing fraud.

      **No Verdict Example**: 
      - Suppose we run a country like India. We have conflicting reports: some indices show decline in media freedom and civil society, but the government argues it's due to necessary regulation. We might have a tie in dimensions. We then go to an expert panel. If they are split, we have no verdict. For funding, we use the last verdict (say, stable) and note the uncertainty.

  13. **Limitations**:
      - The choice of baseline is a judgment call. Using a historical baseline may make recovery invisible if the baseline is set too high. 
      - The thresholds (10% drop, 3 steps) are arbitrary but necessary to reduce noise. They are judgment calls dressed as arithmetic.
      - The aggregation rule (counting declining dimensions) does not weight dimensions. This is a value choice: we treat each dimension as equally important.
      - The procedure cannot handle cases where the baseline is not available (e.g., a country with no democratic history). We then rely on regional or ideal-type, which may be unfair.
      - The red-teaming step may be challenging for countries with little pro-government analysis.
      - The procedure does not eliminate the partisan nature of "backsliding". It relocates the politics into the choice of baseline, dimensions, and thresholds. However, by making these choices explicit and by separating diagnosis from response, we make the politics more transparent.

  Conclusion: This procedure provides a structured, transparent, and defensible way to assign country status. It requires gathering data from reliable sources and applying clear rules. It is designed to be completed within 2-3 days per country.

  Final note: The foundation should document every step and archive the sources for each country to defend the verdicts.
answer: |-
  ### Decision Procedure for Country-Risk Assessment  
  **Objective:** Assign one of three statuses—**stable**, **eroding**, or **backsliding**—to ~40 countries twice yearly. Focus on rule of law, independent media, and electoral integrity.  
  **Time:** 2–3 days per country.  
  **Inputs:** International indices (e.g., V-Dem, Freedom House, Reporters Without Borders), expert analyses (e.g., International Crisis Group, Carnegie), local partner reports (translated summaries), and government statements.  
  **Output:** A defensible verdict + a "red-team" defense memo.  

  ---

  ### The Procedure  
  **Step 0: Define the Baseline**  
  - **Question:** *What is the democratic baseline for this country?*  
  - **Sufficient Answer:** Use the country’s **peak performance in the last 20 years** (e.g., post-transition or pre-erosion high point). If no democratic history exists, use the **regional average** (e.g., EU for Europe, OECD for the Americas). Avoid ideal types (too strict) or distant history (ignores recovery).  
  - **Cost of Choice:**  
    - *Historical baseline:* May overlook slow recovery in authoritarian states but anchors to local reality.  
    - *Regional baseline:* Risks "grading on a curve" if the region is weak.  
  - **Stop/Handoff:** Stop here. No handoff—this is a factual anchor. Document the baseline explicitly.  

  **Step 1: Assess Changes in Core Dimensions**  
  *For each dimension (rule of law, media, elections), ask:*  
  - **Question:** *Has there been a **substantive negative change** in formal rules or practical enforcement since the baseline?*  
  - **Sufficient Answer:**  
    - **Yes** if:  
      - A formal rule change (law, policy, institutional reform) directly weakens checks and balances, **AND**  
      - Independent experts (e.g., Venice Commission, UN rapporteurs) deem it harmful to democratic norms, **AND**  
      - It is not a temporary/emergency measure (lasts >12 months).  
    - **No** if change is procedural, minor, or offset by countervailing gains.  
  - **Red Flag:** Ignore "legality." Focus on whether the change **erodes democratic functionality** (e.g., court-packing laws may be "legal" but cripple judicial independence).  
  - **Handoff:** If conflicting expert views, escalate to a **panel of 3 external scholars** (no foundation ties) for majority vote.  

  **Step 2: Determine Trajectory**  
  - **Question:** *Do recent changes (last 3 years) indicate a **sustained directional shift**?*  
  - **Sufficient Answer:**  
    - **Backsliding:** ≥2 major negative changes across dimensions, **OR** 1 change so severe it enables systemic collapse (e.g., abolishing term limits).  
    - **Erosion:** 1 major negative change with no recovery, **OR** ≥3 minor negative changes in one dimension (e.g., incremental media restrictions).  
    - **Stable:** No changes meeting Step 1 thresholds.  
  - **Handle Slow Erosion:** Minor changes only "count" if:  
    - They are linked (e.g., media laws + censorship suits),  
    - Occur within 24 months,  
    - And >75% of country experts agree they form a pattern.  
  - **Stop:** Assign **provisional verdict** if clear. If ambiguous (e.g., one dimension collapsed but others improved), proceed to Step 3.  

  **Step 3: Aggregate Dimensions**  
  - **Question:** *Does the overall picture confirm the provisional verdict?*  
  - **Sufficient Answer:** Apply the **"broken pillars" rule**:  
    - **Backsliding:** ≥2 dimensions in decline (from Step 2), **OR** 1 dimension collapsed **AND** another eroded.  
    - **Eroding:** 1 dimension in decline, others stable.  
    - **Stable:** No decline in any dimension.  
  - **Handle Noise:** Ignore changes with <10% impact on quantitative indices (e.g., V-Dem drop <0.1 on a 0–1 scale). If dimensions split (e.g., media healthy but elections collapsed), **backsliding trumps eroding trumps stable**.  
  - **Handoff:** If dimensions are split 50/50 (e.g., media backsliding but rule of law stable), the **board** votes on the verdict (values-based choice).  

  **Step 4: Red-Team the Verdict**  
  - **Question:** *What is the strongest defense against this verdict?*  
  - **Sufficient Answer:** A 1-page memo citing:  
    - Government justifications (e.g., "national security," "anti-corruption"),  
    - Supportive analysts (e.g., pro-government scholars),  
    - Alternative data (e.g., economic growth polls).  
  - **Stop:** Attach memo to the final report. No verdict change here—this is transparency, not rebuttal.  

  **Step 5: Separate Diagnosis from Response**  
  - **Diagnosis (Your Role):** Produce a report with:  
    - Baseline,  
    - Step 1-4 outputs,  
    - Red-team memo.  
  - **Response (Board/Program Officers):** Decide funding/public messaging. Must declare value premises (e.g., "We penalize backsliding because democracy requires X").  
  - **Signoff:** **You** sign the diagnostic report. **Board** approves funding decisions.  

  **When Verdict is "Unclear":**  
  - If data is contradictory or insufficient after Step 3:  
    - Label **"monitor—high risk"** (not "stable").  
    - For urgent funding: Use the **prior year’s verdict** or **regional default** (e.g., "stable" for OECD, "eroding" for authoritarian regions). Flag uncertainty publicly.  

  ---

  ### Test Runs: Hungary, Poland, Turkey, U.S.  
  **Baseline:** Peak of post-communist democracy (2005 for HU/PL, 2005 for TR, 2015 for US).  

  | Country  | Step 1: Negative Changes?                                                                 | Step 2: Trajectory?                          | Step 3: Aggregation                     | Verdict       | Red-Team Defense                                                                 |  
  |----------|--------------------------------------------------------------------------------------------|----------------------------------------------|------------------------------------------|---------------|----------------------------------------------------------------------------------|  
  | Hungary  | **Yes:** Judiciary restructured, media monopolized, election rules gerrymandered.          | Sustained (9+ laws since 2010).              | 3+ dimensions → **Backsliding**.         | **Backsliding** | "Reforms combat EU overreach and corruption. Voters endorse them repeatedly."     |  
  | Poland   | **Yes:** Courts politicized, state media captured. Elections: minor irregularities.        | Erosion (slow but consistent since 2015).    | 2 dimensions → **Eroding**.              | **Eroding**   | "Judicial reforms align Poland with Western standards. Media bias is overstated." |  
  | Turkey   | **Yes:** Courts purged, media jailed, elections skewed.                                   | Sharp rupture (post-2016 crackdown).         | 3+ dimensions → **Backsliding**.         | **Backsliding** | "Measures respond to coup threats. Stability requires strong executive control."  |  
  | U.S.    | **Mixed:** Elections: new restrictions in 20 states. Media: polarization but no new laws. Rule of law: norm erosion (e.g., DOJ pressure). | Slow erosion (since 2020). | 1.5 dimensions (elections eroding, rule of law ambiguous) → **Eroding**. | **Eroding** | "Decentralized reforms protect election integrity. Norm fluctuations are not institutional decline." *(Verdict you may "not like": U.S. is "eroding," not stable.)* |  
  | *India*  | *Hypothetical "no verdict": Media pressured, but courts active. Elections: credible. Conflicting expert views.* | *Unclear pattern.* | *Split dimensions → Escalate to board.* | **Monitor—high risk** | *"Regulations target foreign influence. Courts uphold rights."* |  

  ---

  ### Limitations and Objections  
  1. **Judgment Calls Dressed as Arithmetic:**  
     - Baseline selection, "minor" vs. "major" change thresholds, and expert consensus (Step 2) are inherently subjective. Mitigation: **Document rationales transparently.**  
  2. **What the Procedure Cannot Do:**  
     - Predict future backsliding.  
     - Capture informal repression (e.g., vigilante violence).  
     - Resolve deeply contested cases (e.g., where 50% of experts support the government).  
  3. **"Backsliding" as Partisan Label:**  
     - The procedure **relocates politics into thresholds** but exposes them:  
       - Baseline choice admits historical context.  
       - Red-team memo forces engagement with government claims.  
       - Response stage declares values (e.g., "Independent media is non-negotiable").  
     - This makes verdicts **defensible but not neutral**.  

  **Final Advice:**  
  - **For Monday:** Use a dashboard (e.g., Excel/Airtable) auto-pulling data from V-Dem/Freedom House. For each country, answer Steps 1–4 in order.  
  - **When Stuck:** Default to "monitor—high risk" and escalate only values clashes (Step 3) to the board.  
  - **Defense:** Publish methodology, baseline, and red-team memos. Say: "We measure erosion of democracy, not ideology."  

  ---  
  **Time Estimate:** 4–6 hours per country after initial setup. Focus on high-risk cases first.
