answer: |-
  **Exam Question:**  
  "Consider a modified dollar auction with these rules: (1) Bidding starts at $0.05 and increases in $0.05 increments; (2) The *top two* bidders both pay their final bids, but only the highest bidder wins $1.00 (ties are settled by coin flip, with both tied bidders paying); (3) Bids are **hard-capped at $2.00**; (4) Before bidding, players get 60 seconds to communicate, but **no agreements are enforceable**.  

  Explain why a player facing a high bid (e.g., $1.95) might rationally choose to bid $2.00. Does the $2.00 cap 'solve' the auction’s escalation problem? Why or why not? If both players would pay (say) $0.10 *before the auction starts* to avoid bidding altogether, what does this imply about whether the escalation is driven by psychological bias versus rational strategic failure? Finally, briefly note what this suggests about real-world parallels like lawsuits or military conflicts."  

  ---

  **Marking Scheme (Total: 20 marks)**  
  1.  **Marginal Rationality of Escalation (4 marks):**  
      *   Correctly explains that the trailing bidder’s decision to raise the bid (e.g., from $1.95 to $2.00) is *forward-looking*: paying $0.05 more avoids a *certain loss* of $1.95 (or $1.90 if tied) for only a *chance* of winning $1.00. *(Deduct 2 marks if they call this "sunk cost fallacy" or "irrational escalation" without addressing the contingency.)*  
  2.  **Cap Relocation, Not Solution (4 marks):**  
      *   Argues the cap doesn’t eliminate escalation but *relocates and intensifies* it near the cap. Players bid aggressively *toward* $2.00 knowing escalation stops there, making bids like $1.95 highly likely. The "trap" shifts to competing for who pays just under $2.00 vs. who is forced to $2.00. *(Deduct 2 marks if they claim the cap "solves" the problem or prevents losses.)*  
  3.  **Failure of Non-Enforceable Communication (4 marks):**  
      *   Explains why pre-auction talk fails: Players have a strong incentive to *defect* from any agreement (e.g., "let’s not bid") because if one believes the other will comply, they can bid $0.05 and win $0.95 profit. Mutual distrust makes cooperation impossible without enforcement. *(Deduct 2 marks for vague claims like "they couldn’t agree" without the strategic defection logic.)*  
  4.  **Commitment/Coordination Failure vs. Bias (4 marks):**  
      *   Uses the *ex ante* willingness to pay to avoid bidding to argue escalation is primarily a *strategic/structural* failure (like a Prisoner’s Dilemma or commitment problem) that would trap even fully rational agents. Challenges the simplistic "irrationality" narrative. *(Deduct 2 marks for reverting to "bias" explanations without engaging the *ex ante* point, or listing "escalation of commitment" as a label without analysis.)*  
  5.  **Insightful Application to Real Cases (4 marks):**  
      *   Applies the structural logic (contingent liability, cap-like constraints, unenforceable communication barriers) to one real-world example (e.g., lawsuits: settlement fails because each side hopes the other will fold first under mounting costs; wars: initial investments create contingent losses forcing continued commitment). Focuses on *structural parallels*, not just naming examples. *(Deduct 2 marks for merely listing examples like "wars and strikes" without linking to auction mechanics.)*  

  ---

  **Model Answer (Approx. 650 words):**  

  The standard diagnosis of the dollar auction as pure "sunk cost fallacy" is misleading. When the trailing bidder contemplates raising their bid (e.g., from $1.95 to $2.00), their prior bids aren’t sunk; they are *contingent liabilities*. If they quit, they *certainly* lose $1.95. By bidding $2.00, they pay only $0.05 more for a chance (50% if tied, potentially higher otherwise) to win $1.00 and net -$1.00 instead of -$1.95. This marginal calculation is forward-looking and rational given the immediate payoff structure. The failure occurs earlier, in the path that led to this disastrous choice point.  

  The $2.00 cap does not solve this core problem; it relocates and intensifies it. Knowing bidding stops absolutely at $2.00, players recognize that bids *just below* the cap (e.g., $1.95) become critical thresholds. If Player A bids $1.95, Player B faces the marginal choice above: match to $2.00 or lose $1.95. Anticipating this, both players bid aggressively *to reach* these high-stakes positions, expecting the other to relent before forcing them to the cap. The trap isn’t escaped; it’s compressed into fierce competition near $2.00, often ensuring both players end up paying close to the maximum ($1.95 and $2.00, or both $2.00 on a tie). Losses remain severe, just slightly bounded.  

  The pre-auction communication fails precisely *because* agreements are unenforceable. While both players would prefer to avoid the auction entirely (evidenced by their willingness to pay $0.10 *ex ante* to cancel it), any promise not to bid is incredible. If Player A believes Player B will truly not bid, Player A can bid $0.05, win the dollar, and net $0.95. Player B, anticipating this defection, cannot trust A, and vice versa. This mutual incentive to defect undermines cooperation, mirroring a Prisoner’s Dilemma. The failure is strategic, not communicative – the structure prevents binding commitments.  

  This willingness to pay *ex ante* to avoid the auction is crucial. It demonstrates that the problem isn’t primarily myopic irrationality or psychological bias during the heat of bidding. Even perfectly rational, foresighted players, understanding the game’s logic, would *still* get trapped in escalating bids leading to losses. They recognize the *structural inevitability* of the trap but cannot coordinate to avoid it once the auction starts. The core failure is one of **commitment and coordination under mutual distrust**, inherent to the payoff structure.  

  This reframes real-world parallels. Litigation often escalates not because parties irrationally "throw good money after bad," but because prior costs become contingent liabilities: settling for $X million means *certainly* losing the $Y million already spent, while continuing offers a chance (however slim) of victory that might offset the total loss. Each marginal decision to spend more on legal fees can be locally rational, even as the aggregate outcome is disastrous. Similarly, in military conflicts or labor strikes, initial investments (deployed troops, lost wages) create contingent losses that rationally incentivize further commitment ("one more push") to avoid total sacrifice. Barriers to binding pre-commitment (like enforceable settlements or arbitration clauses) mirror the unenforceable chat period, perpetuating escalation. The lesson isn’t that people are stupid; it’s that certain competitive structures create inescapable traps for even the rational, where individual incentives undermine collective welfare.  

  **Honesty Note:**  
  This analysis argues the dollar auction's escalation is primarily a rational strategic failure (coordination/commitment problem) rather than a psychological bias. I am highly confident that the marginal reasoning near the bid cap is rational and that non-enforceable communication fails strategically. I am moderately confident that the *ex ante* willingness to pay points strongly away from bias being the *primary* driver, though bias likely exacerbates real-world cases. The claim I’d be *least* confident defending against sharp pushback is that perfectly rational agents would *never* exhibit "irrational" escalation *within* the standard auction (without cap/chat). A critic could argue that entering the auction beyond very low bids, or not foreseeing the path to the cap, involves a failure of foresight that could be deemed irrational, even if the final bids aren't. The exact line between structural trap and individual miscalculation remains nuanced.
