prompt: |-
  I'm in a second-year free will seminar and my prof has exactly one line she reaches for whenever compatibilism comes up: "you're only free if you could have done otherwise." Last week someone raised a Frankfurt-style case and she brushed it off — "he still could have done otherwise; the case takes away the alternative, not the ability" — and most of the room nodded like that settled something. I don't think it settles anything, and honestly I don't think that sentence is even one claim. She's also a compatiblist who likes to say that the only freedom worth having is the kind we could actually have, which I suspect is doing some quiet work in the background here.

  I know the labels already — PAP, leeway vs. source, all of it. What I want is the menu. Lay out every distinct precise claim "could have done otherwise" could be making: what kind of possibility the "could" is in each (categorical openness of the world, a counterfactual about what the agent would have done if things had gone differently, an epistemic "for all anyone knew", a claim about the agent's standing capacities or the working order of her deliberative machinery, or anything else you can cleanly distinguish), whether each reading is compatibilist or incompatibilist in effect, and whether it's trivial, contentious but defensible, or just false. Then tell me which reading she needs for "the case takes away the alternative, not the ability" to come out true, whether that's the same reading that makes the slogan a genuine constraint on freedom in the first place, and whether she's quietly sliding between two rows. Also say which reading the people who actually repeat this line in the wild most likely mean, and whether that one is worth having.

  Give it to me as a table, with these columns:

  - Reading — a short handle for the reading.
  - The claim — what exactly it asserts, in a sentence or two.
  - Kind of "could" — categorical / counterfactual / epistemic / dispositional / other (say what).
  - Verdict — trivial, defensible, or false, with a few words on why.
  - Compatibilist or incompatibilist in effect?
  - Supports her Frankfurt move? — yes / no / only if you also help yourself to another reading (name it).

  After the table, one short paragraph: your bottom line on whether she's equivocating, and if so, between which two rows.
reasoning: |-
  Okay, the user is in a second-year seminar on free will, specifically focusing on compatibilism. Their professor keeps using the line: "you're only free if you could have done otherwise." When a Frankfurt-style case was brought up, the professor dismissed it by saying that the case removes the alternative but not the ability, and most students seemed to accept that. The user is skeptical and thinks there might be equivocation happening. They want a clear breakdown of different interpretations of "could have done otherwise" in a table format, with specific columns, and then a bottom line on whether the professor is sliding between meanings.

  First, I need to recall the key concepts. The Principle of Alternative Possibilities (PAP) states that moral responsibility requires the ability to do otherwise. Frankfurt-style counterexamples challenge PAP by describing scenarios where an agent couldn't have done otherwise due to some counterfactual intervener (like Jones deciding to shoot, with Black ready to intervene if he hesitates, but Jones does it on his own). The professor's response is that in such cases, the alternative is removed, but the ability remains. 

  The user mentions their professor is a compatibilist who values "the only freedom worth having," which might imply a pragmatic or dispositional take. The user suspects this background is influencing the argument. They want a menu of interpretations for "could have done otherwise," categorized by the type of possibility (categorical, counterfactual, etc.), each assessed for defensibility, compatibility with determinism, and whether it supports the professor's Frankfurt move.

  I should list distinct readings of "could have done otherwise." Common interpretations include:

  1. **Categorical Openness**: The idea that at the moment of choice, multiple futures were genuinely possible. This is incompatibilist and tied to libertarian free will.
  2. **Simple Conditional Analysis (Counterfactual)**: If the agent had chosen otherwise, they would have done otherwise. Compatibilist, but vulnerable to counterexamples like finkish dispositions.
  3. **Epistemic "Could"**: Based on what was known at the time, it was possible the agent would do otherwise. Not relevant to free will debates as it's about knowledge, not ability.
  4. **Dispositional/Capacity-Based**: The agent has the internal capacities to do otherwise in similar circumstances, even if not exercised. This is compatibilist and aligns with the professor's distinction in Frankfurt cases—removing alternatives but not abilities.
  5. **Regulative Control (Leeway Theory)**: Requires that the agent had access to alternative possibilities, which is incompatibilist in a deterministic world.
  6. **Sourcehood/Actual Sequence**: Freedom is about the source of the action, not alternatives. Compatibilist and rejects PAP, so Frankfurt cases work against PAP.

  For the table, each row needs:
  - **Reading**: Short name.
  - **The claim**: Precise definition.
  - **Kind of "could"**: Categorical, counterfactual, etc.
  - **Verdict**: Trivial, defensible, or false, with reasoning.
  - **Compatibilist or Incompatibilist?**
  - **Supports her Frankfurt move?**: Yes, no, or only with another reading.

  After the table, a paragraph on whether the professor is equivocating and between which readings.

  Key insights:
  - The professor likely relies on the Dispositional reading for her Frankfurt move (ability remains, alternatives removed). 
  - But when stating PAP as necessary for freedom, she might mean Categorical or Regulative Control (incompatibilist), creating a slide.
  - Most people repeating the slogan probably mean Categorical or Regulative Control, which are incompatibilist and challenged by Frankfurt cases. The Dispositional reading is compatibilist and defensible but may not satisfy the intuitive need for alternatives.

  Bottom Line: The professor is equivocating between the Dispositional reading (for Frankfurt cases) and either Categorical or Regulative Control (for the initial slogan). This slide allows her to maintain PAP in name while deflecting counterexamples. However, if PAP requires alternatives, Frankfurt cases refute it, and the Dispositional reading alone doesn't support PAP as traditionally understood.
answer: |-
  Below is a comprehensive breakdown of distinct interpretations of "could have done otherwise" (CDO), structured as requested. The table isolates 6 cleanly differentiated readings, followed by a bottom-line analysis of your professor's potential equivocation.

  ### Table: Interpretations of "Could Have Done Otherwise"

  | Reading             | The claim                                                                                                                                 | Kind of "could"       | Verdict & Why                                                                                                                                                                    | Compatibilist or Incompatibilist? | Supports her Frankfurt move? |
  |---------------------|-------------------------------------------------------------------------------------------------------------------------------------------|------------------------|----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|-----------------------------------|------------------------------|
  | **Categorical Openness** | At the exact moment of choice, given the actual past and laws of nature, more than one future was metaphysically possible (e.g., the world was genuinely "open"). | Categorical (metaphysical possibility) | **False** under determinism (determinism implies only one future is possible). **Defensible** only if indeterminism holds. | Incompatibilist (requires indeterminism) | No (Frankfurt cases explicitly block alternative possibilities). |
  | **Simple Conditional (Counterfactual)** | The agent *would have* done otherwise *if* they had chosen/willed otherwise (e.g., "If Jones had chosen not to shoot, he wouldn't have shot"). | Counterfactual (hypothetical dependence) | **Defensible** but vulnerable to counterexamples (e.g., "finkish" dispositions where the ability vanishes if tested). Common in early compatibilism. | Compatibilist (consistent with determinism) | No (Frankfurt cases don't deny this—Jones *wouldn't* have chosen otherwise, but the conditional holds). |
  | **Epistemic "Could"** | Given the information available before the act, observers reasonably believed multiple outcomes were possible (e.g., "For all anyone knew, Jones might not have shot"). | Epistemic (consistent with prior evidence) | **Trivial** for free will debates. It concerns ignorance, not ability. An agent can "could have" in this sense while being coerced or determined. | Neither (irrelevant to free will) | No (Frankfurt cases don't challenge this—Black's presence might be unknown). |
  | **Dispositional/Capacity-Based** | The agent possessed the general abilities/capacities to do otherwise (e.g., Jones had working legs to leave, a mind to deliberate, etc.), even if unused/unexpressed in the actual sequence. | Dispositional (intrinsic capacity) | **Defensible** for compatibilists. Focuses on the agent's stable traits, not situational constraints. But **false** if "ability" requires more than just internal machinery. | Compatibilist (abilities are compatible with determinism) | **Yes** (her move: Frankfurt removes the *alternative* path, not Jones's *capacity* to choose differently). |
  | **Regulative Control (Leeway)** | The agent had genuine access to alternative possibilities in the *actual* sequence (e.g., Jones's situation included no blockers, so he could have chosen/acted differently *then and there*). | Categorical or Dispositional + Opportunity | **Defensible** for incompatibilists; **false** for compatibilists. Requires alternatives to be *exercisable* in the actual world. | Incompatibilist (if tied to indeterminism); Weakly Compatibilist (if just "no external constraints") | **No** (Frankfurt cases directly remove regulative control—Jones *couldn't* act otherwise due to the intervener). |
  | **Sourcehood (Actual Sequence)** | CDO is irrelevant; freedom depends solely on whether the act *originated* in the agent's reasons-responsive mechanisms (e.g., Jones shot because *he* chose, unmanipulated). | Not applicable (rejects CDO) | **Defensible** for source-compatibilists (e.g., Fischer). Frankfurt cases show CDO is unnecessary. | Compatibilist (sourcehood is compatible with determinism) | **Only if you help yourself to Dispositional** (she needs CDO for freedom, but sourcehood rejects it). |

  ### Key Clarifications
  - **"Supports her Frankfurt move"**: Her claim ("the case takes away the alternative, not the ability") only works under the **Dispositional/Capacity-Based** reading. In Frankfurt cases (e.g., Jones shoots freely, but Black would have forced him if he hesitated), the alternative possibility *is* removed (Jones couldn't have done otherwise), but Jones retains his decision-making *capacities*. This reading lets her say "he still had the *ability*" by conflating "ability" with intrinsic capacities.
  - **What people likely mean "in the wild"**: Most non-philosophers (and many incompatibilists) mean **Categorical Openness** or **Regulative Control**. This reading is **not worth having** under determinism—it's false and undermines responsibility. The **Dispositional** reading is more defensible and "worth having" (it protects accountability for actions springing from one's character), but it may feel inadequate for those craving "ultimate" openness.

  ### Bottom Line on Equivocation
  **Yes, she is equivocating—between the Dispositional/Capacity-Based reading (for Frankfurt cases) and the Regulative Control or Categorical Openness reading (for her initial slogan)**. She uses the Dispositional reading to deflect Frankfurt ("ability remains!") but implicitly relies on Regulative Control or Categorical Openness when asserting CDO as necessary for freedom ("you're only free if you could have done otherwise"). This slide masks a contradiction: if CDO requires *actual alternatives* (Regulative/Categorical), Frankfurt refutes PAP, but if CDO just means *capacities* (Dispositional), PAP becomes toothless (e.g., a brainwashed agent "could have done otherwise" if their capacities are intact, even if never exercisable). Her quiet appeal to "freedom worth having" (implying pragmatism about capacities) suggests she *wants* the Dispositional reading, but her slogan's rhetorical force depends on the deeper, incompatibilist readings. Resolving this requires abandoning PAP or adopting pure source compatibilism—neither of which her one-liner permits.
