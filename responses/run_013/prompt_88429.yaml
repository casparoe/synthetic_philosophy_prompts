answer: |-
  The phrase "all models are wrong, but some are useful" (attributed to statistician George Box) is indeed wielded in diverse, sometimes contradictory ways. Its meaning hinges on the interpretation of "wrong" and "useful." Here's a breakdown of plausible readings, their validity, and how they likely applied in your examples.

  At its most fundamental level, the statement is almost tautologically true: **no model is a perfect, complete replica of the entire, infinitely complex reality it attempts to describe.** This is trivial and universally accepted. Every model simplifies, abstracts, and omits details. Calling this "wrong" highlights the inherent gap between representation and reality. Its "usefulness" here means it provides *any* insight, prediction, or conceptual handle that the raw complexity obscures. This minimal reading was probably sufficient for the defender of the perfect-information economic model. He wasn't claiming humans *are* perfectly rational instantaneous calculators; he was arguing that *despite* this known, deliberate, and extreme simplification (which makes it "wrong" in the literal sense), the model can still yield insights into market dynamics (e.g., equilibrium tendencies, price signals) that are "useful" for certain theoretical purposes, like understanding basic mechanisms or providing a benchmark.

  A stronger, more substantive interpretation is: **a model can be useful for a specific purpose *without* requiring its assumptions or internal mechanisms to be literally true or realistic.** The focus shifts entirely to predictive or explanatory *performance* for the task at hand. Here, "wrong" acknowledges unrealistic assumptions, while "useful" means the model outputs reliably match relevant observations within acceptable error bounds for its intended application. This is widely defensible in practice (e.g., Newtonian physics is "wrong" relativistically but immensely useful for building bridges). However, its validity is context-dependent. A model predicting stock prices well using astrological signs would be dismissed, not because the assumptions are unrealistic (all models have those), but because its *performance* wouldn't hold up empirically. This interpretation is where significant debate occurs. Critics argue that models with fundamentally flawed assumptions might "work" accidentally or only under very narrow, unstable conditions, and lack explanatory power or generalizability. Proponents counter that predictive success, even with unrealistic assumptions, is the ultimate test. This is genuinely contested terrain, especially in complex domains like economics or climate.

  A more radical, and generally false, interpretation is: **because models are tools, questions of their truth or representational accuracy are irrelevant or meaningless; only pragmatic utility matters.** This instrumentalist view severs the link between the model's structure and reality entirely. While it's true models *are* tools, and their ultimate value is often pragmatic, dismissing *any* concern for whether the model captures *something* real about causal structures or mechanisms is untenable. A useful model gains credibility and generalizability precisely because we suspect (and often later confirm) its success stems from approximating *some* underlying truth, however simplified. Most scientists and philosophers reject this strong instrumentalism. The climate critic might have *perceived* the model defender as invoking this – arguing that the coarse grid ("wrong" in detail) shouldn't matter *at all* as long as some outputs seem plausible, dismissing concerns about whether the coarse grid fatally misrepresents key dynamics. The defender likely wasn't taking this extreme view, but the critic felt the phrase was being used to sidestep a potentially critical flaw.

  A nuanced and defensible interpretation is: **every model involves deliberate distortions and simplifications; the critical question is whether those distortions are *harmless* or even *beneficial* for the model's intended purpose, or whether they introduce *fatal errors* relative to that purpose.** "Wrong" here means "selectively and deliberately distorted," not "fundamentally false in all aspects." "Useful" means the chosen simplifications do not corrupt the answers sought for the specific questions the model is built to address. This is substantive and widely held. The skill lies in knowing *what* to simplify and *what* must be retained. The climate critic was arguing that the coarse grid size wasn't a harmless simplification but a fatal distortion for accurately projecting certain regional impacts or feedback processes. The phrase fired back at him asserted that the distortion *is* likely harmless (or the best available trade-off) for the model's primary purpose (e.g., global mean temperature trends), making it "useful" despite being "wrong" in its fine-grained representation.

  **Consensus vs. Contested:** The minimal interpretation (models are imperfect simplifications by design) is settled consensus. The view that *only* predictive performance matters, regardless of assumptions, is heavily contested, especially outside tightly controlled physical systems. Friedman famously advocated it in economics, but it faces strong criticism from those arguing unrealistic assumptions can mask structural errors, limit generalizability, and hinder understanding. The nuanced view (distortions must be evaluated for harm relative to purpose) represents a pragmatic consensus among many practicing scientists and philosophers of science. Strong instrumentalism (truth irrelevant) is a minority, often criticized position.

  **Applied to Your Examples:**
  1.  **Perfect-Information Economics Defender:** He likely relied on the minimal interpretation or the "distortion trade-off" interpretation. He conceded the model is "wrong" (unrealistic assumptions) but asserted it's "useful" (provides theoretical insights, benchmark understanding). He didn't necessarily need the strong "only predictions matter" view.
  2.  **Climate Grid Critic:** He interpreted the model's coarse grid not as a harmless simplification but as a potentially fatal flaw for its purpose (making it "wrong" in a damaging way). He likely perceived the defender as invoking the "only predictions matter" view (dismissing his structural concern) or the strong instrumentalist view (truth irrelevant). The responder firing the quote back was likely invoking the "distortion trade-off" view, asserting the grid coarseness *is* a harmless or necessary simplification for the model's core purpose, thus keeping it "useful."

  The phrase's power and ambiguity stem from sliding between these meanings. Its use often signals an acknowledgment of imperfection while defending continued application, but the *justification* for that application hinges on which interpretation of "wrong" and "useful" is operative – and whether the specific simplification crosses the line from "harmless abstraction" to "damaging misrepresentation."
