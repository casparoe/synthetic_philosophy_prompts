  First, I need to reconstruct the positions in their strongest forms. The functionalists equate mechanisms with computational equivalence—same function, same mechanism, regardless of hardware. The structuralists insist on identical causal pathways down to the wiring. The third group sees "mechanism" as context-dependent. 

