prompt: |-
  My old Latin teacher turns 70 next month and her kids have asked me to give the toast at the party. Half the room read the De Senectute with her back in school and half are family who've never opened it and think classics people are a bit ridiculous. She's got a bee in her bonnet about that dialogue: she says everyone reads it as four seperate rebuttals — you're not useless, not weak, not pleasureless, not on death's doorstep — when really Cato's four answers are one answer, because all four complaints are the same complaint, that old age shoves you off the stage, and Cato's whole move is that the stage was never the point. She'd want that in the toast, and honestly it's the most her thing there is. The problem is she's the least sentimental person alive, so "and now she can finally rest" or "her best years are ahead of her" will get me a look I won't recover from. Write the toast — a few minutes, lands for the family without turning into a lecture on Cicero, and doesn't say anything she'd privately think was false.
reasoning: |-
  Okay, the user needs a toast for their Latin teacher's 70th birthday. Let me start by understanding the key points. The teacher is turning 70, and her kids asked the user to speak. Half the audience are former students who read Cicero's "De Senectute" with her, and the other half are family who aren't familiar with it. The teacher has a specific interpretation of the text: that Cato's four rebuttals are actually one unified argument against the idea that old age removes you from the stage of life. She believes the stage was never the point. 

  The main challenge here is balancing the classical reference with accessibility for the family. The toast must avoid sentimentality since the teacher dislikes that. Phrases like "best years ahead" or "time to rest" are off-limits. The user wants to honor her perspective without making it a lecture. 

  First, I need to structure the toast to engage both groups. Starting with a warm welcome sets a friendly tone. Then, introducing the teacher's passion for Latin and Cicero naturally leads into the "De Senectute" reference. Explaining the dialogue simply is crucial—maybe using a metaphor like "life's stage" to clarify Cato's argument. 

  The teacher's key insight—that the four complaints are one—must be highlighted without jargon. Linking this to her teaching philosophy shows her impact. Emphasizing that she taught students to find meaning beyond external validation ties it all together. 

  Avoiding clichés about aging is essential. Instead, focus on her continued engagement and intellectual vitality. The toast should celebrate her authenticity and the respect she commands. Ending with a toast to "the point" itself, as she defines it, wraps up her philosophy neatly. 

  I should check that the language stays natural and conversational. Using phrases like "bee in her bonnet" adds personality. Including moments of humor (e.g., "that look") keeps it light. Ensuring that family members feel included means avoiding Latin terms without explanation. 

  Lastly, making sure the core message resonates: life’s value isn't in the spotlight but in deeper fulfillment. This aligns with her views and avoids any insincerity. The toast must feel genuine, reflecting her character without veering into sentimentality.
answer: |-
  Here’s a toast that honours her insight, avoids sentimentality, plays to both audiences, and stays true to her character:

  **(Clink glass gently)**  
  "Good evening, everyone. For those who don’t know me, I’m [Your Name], one of the many lucky students who had the privilege – and let’s be honest, the occasional terror – of being taught Latin by our remarkable guest of honour. Happy Birthday!

  Now, anyone who’s spent five minutes with our dear teacher knows two things: First, she possesses a formidable intellect and a wit sharper than any Roman *gladius*. Second, she has absolutely *zero* patience for nonsense. Sentimental platitudes? Fluffy clichés about age? They’d earn you *that look* – the one that could curdle milk at twenty paces. So, rest assured, I’ll be avoiding anything resembling 'slowing down' or 'golden years'. She’d rightly find that ridiculous.

  Instead, I want to talk about something very *her*. Something those of us who sweated over Cicero’s *De Senectute* in her class will remember vividly. You see, she has this… let’s call it a passionate conviction… about that dialogue. Most people read Cato’s defence of old age as four separate arguments: rebutting claims about uselessness, weakness, lack of pleasure, and the fear of death. But not her. Oh no.

  **Her point – and she is absolutely, fiercely right about this – is that those four complaints aren’t separate at all. They’re one big, whining complaint: the fear that old age kicks you off the main stage of life. That the spotlight fades, the audience drifts away, and you’re left in the wings. And Cato’s genius, she insists, is his single, devastating counter-argument: *The stage was never the point in the first place*.**

  *(Pause, look towards the teacher)*  
  That wasn’t just an academic point for you, was it? It was the lesson. You didn’t just teach us Latin; you taught us to look *past* the stage. Past the applause, the visible roles, the external measures of ‘usefulness’ or ‘strength’ defined by others. You showed us the power in the quiet work: the precision of thought, the depth of understanding, the sheer, stubborn joy of engaging with ideas for their own sake – whether it was Cicero’s wisdom or the subjunctive mood’s peculiarities. You taught us that the real substance, the real *life*, happens off-stage, in the study, in the conversation, in the mind actively at work.

  That’s why celebrating your 70th isn’t about rest or retirement or some mythical ‘best’ yet to come. It’s about celebrating someone who, right now, embodies Cato’s argument perfectly. You are living proof that when you understand the stage isn’t the point, you never actually leave the things that matter. Your intellect is as formidable as ever, your wit as sharp, your passion for the work – be it Latin, family, or cutting through nonsense – is undimmed. You haven’t been shuffled off anywhere. You’re exactly where you’ve always been: deeply engaged, fiercely thoughtful, and entirely on your own terms.

  You showed us that true strength isn’t about muscles, usefulness isn’t about job titles, pleasure isn’t about constant excitement, and facing the future isn’t about clinging to the spotlight. It’s about the enduring power of a mind alive to the world, finding meaning in the pursuit itself.

  So, let’s raise our glasses to a truly extraordinary woman. To a master teacher who taught us that the point was never the applause, but the work itself. To 70 years lived with fierce intelligence, unwavering authenticity, and zero tolerance for bad philosophy – or bad toasts!

  To [Teacher's Name]! May your arguments remain unassailable, your wit lethal, and your bonnet forever buzzing with brilliant insights. **Ad multos annos!**"

  **Why this works:**

  1.  **Honours Her Insight:** The core of the toast *is* her specific, passionate interpretation of *De Senectute*, presented as her unique and correct perspective.
  2.  **Accessible to Family:** Explains the Cicero reference simply using the "stage" metaphor. The family might not know Cato, but they understand the idea of being "kicked off the stage" and the counter-idea that the stage wasn't the goal. They also *definitely* recognize her sharp intellect and lack of sentimentality.
  3.  **Avoids Sentimentality:** Directly calls out and rejects clichés ("slowing down," "golden years," "rest"). Focuses on her *current* strengths: intellect, wit, engagement, authenticity.
  4.  **"That Look":** Acknowledging it builds rapport with everyone who knows her and signals you understand the boundaries.
  5.  **Makes it Personal:** Connects her philosophical point directly to her teaching style and life approach ("You taught us to look *past* the stage," "You showed us the power in the quiet work"). This shows *why* this idea matters so much *to her*.
  6.  **Celebrates Her Now:** Focuses on her present state – formidable, sharp, engaged – not on decline or some future peace. "You haven’t been shuffled off anywhere" directly counters the "off the stage" fear.
  7.  **True to Her:** It praises her intellect, authenticity, teaching, and lack of pretense – things she would likely value and believe to be true.
  8.  **Tone:** Warm, respectful, slightly wry (acknowledging the terror/the look), and celebratory without being sugary.
  9.  **Structure:** Clear flow: Introduction -> Acknowledge her character -> Introduce Cicero/Her Insight -> Explain Insight Simply -> Connect Insight to Her Life/Teaching -> Celebrate Her Present -> Toast.
  10. **The Final Line:** "May your bonnet forever buzzing with brilliant insights" is a playful nod to her "bee in her bonnet" about this very topic, showing you listened and remembered.

  This toast gives her students the satisfying "aha!" moment of recognizing her beloved argument presented clearly, while giving the family a meaningful insight into her intellectual passion and core life philosophy, all wrapped in a celebration of who she *is* right now. She might still give you *a look*, but it will likely be one of grudging approval.
