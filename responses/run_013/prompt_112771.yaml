answer: |-
  Here’s your exam package, meeting all constraints:

  **Exam Question (50 minutes):**  
  *"Williamson’s anti-luminosity argument targets the claim that certain mental states (e.g., feeling cold) are 'luminous'—always known when present. Crucially, it undermines the KK principle (if you know φ, you know that you know φ).  
  (a) Precisely reconstruct Williamson’s core argument, explaining how a sorites-like series of cases from (e.g.) feeling cold to not feeling cold demonstrates that no non-trivial condition is luminous.  
  (b) Williamson relies on *margins for error*: cases so similar that you cannot distinguish their epistemic status. Suppose a mental state (e.g., severe pain) manifests *only* in discrete, binary states (e.g., 'present' or 'absent') with no borderline cases. Does this undermine Williamson’s argument? Defend your position with explicit reference to the structure of his reasoning."*  

  ---

  **Model Answer (389 words):**  

  **(a)** Williamson’s argument assumes luminosity for a state (e.g., feeling cold at dawn, t₀). He constructs a gradual series: from t₀ (clearly cold) to tₙ (clearly not cold), where adjacent times (tᵢ, tᵢ₊₁) are subjectively indistinguishable. By luminosity, if cold at tᵢ, you know you’re cold at tᵢ. But at tₙ, you’re not cold, so you don’t know you’re cold. There must be a first time tₖ where you don’t know you’re cold. Yet at tₖ₋₁, you *were* cold and knew it (by luminosity), and you cannot distinguish tₖ from tₖ₋₁. Given you *know* you’re cold at tₖ₋₁, and tₖ is indistinguishable, you cannot *not* know you’re cold at tₖ—contradicting tₖ being the first failure of knowledge. Thus, luminosity fails. This refutes KK: if KK held, knowing φ would entail knowing you know φ (a luminous state), but no non-trivial state is luminous.  

  **(b)** The argument *fails* for discrete states. Williamson’s contradiction relies on a chain of indistinguishable cases forcing epistemic parity between tₖ₋₁ and tₖ. If the state changes abruptly (e.g., severe pain switches instantly from "on" to "off"), there are no indistinguishable adjacent cases where the state differs. At tₖ₋₁, pain is present and known (if luminous); at tₖ, pain is absent and unknown. Crucially, tₖ₋₁ and tₖ *are distinguishable* because the state change is discrete and detectable. Thus, no contradiction arises: you *can* know you’re in pain at tₖ₋₁ and *fail* to know at tₖ without violating luminosity’s requirements, as the states differ categorically. Williamson’s sorites structure collapses without continuous change; the margin for error principle lacks application. Discrete states escape the argument.  

  ---

  **Marking Scheme (out of 20):**  

  **A. Reconstruction of Williamson’s Argument (0-8)**  
  - **+2** Correct target (luminosity/KK)  
  - **+2** Gradual series + indistinguishability of adjacent cases  
  - **+2** Identification of the "first failure" time (tₖ)  
  - **+2** Contradiction derived from indistinguishability & luminosity  

  **B. Discrete Case Analysis (0-8)**  
  - **+2** Recognizes discrete states lack indistinguishable adjacent cases  
  - **+2** Explains why epistemic parity isn’t forced between distinct states  
  - **+2** Clear stance (argument fails) with justification linking discreteness to chain breakdown  
  - **+2** Contrast with continuous case’s reliance on margins for error  

  **C. Structure & Clarity (0-4)**  
  - **+2** Logical flow, concision, precision  
  - **+2** Terminology (e.g., "margin for error," "sorites," "KK principle")  

  **Key Penalties (deduct per occurrence):**  
  - **-2** Misrepresents Williamson’s setup (e.g., misstates luminosity)  
  - **-2** Claims discrete states save luminosity *without* explaining chain breakdown  
  - **-1** Vague phrasing ("it might not work") without argument  
  - **-1** Exceeds 400 words in answer (if excessive)  

  **Total:** **20 marks**  
  *(Top answers require full reconstruction + cogent discrete-case analysis)*  

