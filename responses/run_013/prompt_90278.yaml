prompt: |-
  For a graduate seminar on scientific realism I have been working through the literature on the underdetermination of theory by evidence, and I have ended up defending a fairly strong version of the thesis. The version I hold is this: for any sufficiently mature empirical theory, there exists at least one rival that is empirically equivalent to it -- one entailing all and only the same observational consequences -- while being incompatible with it in what it says about the unobservable; and because every test we could run issues only observational verdicts, no possible evidence could oblige a rational inquirer to prefer either one. Theory choice at that point is driven by considerations that are not evidential at all: simplicity, explanatory power, mathematical convenience, institutional inertia, or sheer accident. I am aware this is a strong claim, and I want to know what would count against it, sorted by how decisive the considerations actually are rather than by how often they get repeated.

  Please press on the position from several directions and tell me which of the familiar objections should genuinely move me and which are cheap. Consider at least these: the charge that holism makes the thesis true but trivial, since any theory can be held onto by adjusting auxiliaries; the charge that the allegedly equivalent rivals are never really incompatible once you inspect them, so the thesis trades on a loose notion of empirical equivalence; the charge that underdetermination worth worrying about is a rare curiosity rather than the standing human condition, and that most apparent cases are merely temporary, dissolving once new evidence or new instruments arrive; the charge that a broadly abductive account of theory choice, or a Bayesian story about priors and confirmation, gives evidence a real role after all and so dissolves the problem; and the charge that the history of science displays a convergence the thesis cannot accommodate. I would especially like you to separate the formulations of the thesis that are close to unfalsifiable from the ones that actually stake something, and to name the historical or contemporary episodes that would, if they had turned out one way rather than another, count as evidence for or against the strong thesis rather than merely illustrating it. I also want to know what a committed defender would themselves concede -- which cases they must grant are underdetermined only transiently, or only relative to a fixed stock of auxiliaries, and whether those concessions leave the interesting claim standing. Finally, be candid about whether the thesis has been qualified into something no conceivable evidence could touch, and say whether that insulation is a defect or simply what a claim at this level of abstraction ought to look like. I do not want a reading list; I want the map of where this position is exposed.
reasoning: |-
  Okay, the user is deeply engaged with the underdetermination thesis in scientific realism debates. They've developed a strong version: that for any mature theory, there's an empirically equivalent but incompatible rival, making theory choice non-evidential. They want serious, decisive objections sorted by strength, not just common rebuttals. 

  Hmm, they're clearly well-read—mentioning holism, equivalence definitions, transient cases, abduction/Bayes, and convergence. Their request is unusually precise: they want vulnerability mapping, not literature. The "press from several directions" phrasing suggests they've steelmanned opponents before and now seek pressure points. 

  First, the trivialization-by-holism objection feels strongest to me. If any theory can be saved by auxiliary adjustments, empirical equivalence becomes vacuously achievable—but maybe that's not the interesting underdetermination they care about. Their thesis requires substantive rivals, not just gerrymandered ones. I should emphasize how this forces concessions: they must grant that underdetermination only bites when auxiliaries are fixed or when rivals are genuinely competing explanations. 

  Second, the empirical equivalence charge matters. Cases like Newton vs. GR show alleged equivalents often aren't strictly equivalent upon closer inspection. They’ll need to define "observational consequences" tightly—maybe restrict it to current instrumentation—but that risks making the thesis unfalsifiable. The Lorentz/Poincaré vs. Einstein case is their best historical bet, but even that had detectable differences later. 

  Third, transience: most historical underdetermination dissolved (ether theories, phlogiston). Their strong claim needs permanent cases. If they cite cosmology (e.g., universe shape), critics will say future evidence could resolve it. They might retreat to claiming underdetermination exists at every historical moment, but that weakens their thesis. 

  Abduction/Bayes is tricky. If theory choice involves explanatory virtues, is that still "non-evidential"? They might argue virtues are pragmatic, not truth-tracking—but then convergence becomes a problem. The success of science in predicting novel phenomena (like GR’s light bending) challenges the idea that virtues don’t point toward truth. 

  Convergence is damning if real. If later theories absorb predecessors’ math (Newton to GR), it suggests they’re latching onto something real. Their response might be that convergence reflects stable empirical content, not unobservable structure—but then what explains the stability? 

  Their thesis is insulated by design: they can always posit undiscovered equivalents. That’s not necessarily a flaw—it’s a metaphysical claim. But if no conceivable evidence could challenge it, is it doing philosophical work? They might need to specify what would falsify it (e.g., a theory with no conceivable rival). 

  What they must concede: most underdetermination is transient; strict equivalence requires fixing auxiliaries; rivals must be scientifically plausible. The interesting claim survives only if there are permanent, substantive cases—which are vanishingly rare. 

  Honestly? Their strongest move is to shift the burden: make realists explain why non-evidential virtues track truth. But the convergence of instruments, math, and predictions remains the sharpest counter.
answer: |-
  Your strong underdetermination thesis is admirably clear and bold. Let's press it systematically, sorting objections by their dialectical force, exposing genuine vulnerabilities, and identifying where concessions are unavoidable. I'll map the terrain as requested: decisive challenges, cheap shots, historical tests, and insulation.

  ### 1. **The Holism Trivialization Charge (Potentially Decisive if Conceded)**
      *   **Objection:** Duhem-Quine holism ensures *any* theory can be saved from falsification by revising auxiliaries (background assumptions, initial conditions, instrumentation models). Therefore, constructing *some* empirically equivalent rival is always trivial: just take T + Aux and concoct T' + Aux' where Aux' absorbs the differences needed to preserve empirical equivalence. The thesis is true but vacuous – it doesn't reveal anything interesting about theory rivalry or realism.
      *   **Why it might be decisive:** If you grant that *any* gerrymandered T' + Aux' counts as a "rival theory," your thesis becomes unfalsifiable and philosophically inert. It reduces to "logical possibility exists."
      *   **Your Necessary Concession:** You *must* restrict "rival theory" to mean something like: **a scientifically plausible, non-ad-hoc alternative that offers a *competing explanation* of the phenomena, not just a logical contraption.** This requires:
          *   **Internal Coherence:** T' must be internally consistent and non-contradictory.
          *   **Explanatory Scope/Aspiration:** T' should aim to explain the *same domain* as T, not just mimic its predictions via duct tape.
          *   **Minimal Ad-hocness:** Aux' shouldn't be *excessively* contrived solely to save T' from falsification relative to T. Some degree of auxiliary adjustment is normal science; the objection targets pathological cases.
      *   **Does the interesting claim survive?** Yes, but it's significantly weakened. The claim becomes: **For any sufficiently mature T, there exists a scientifically plausible rival T' (with its own plausible auxiliaries) that is empirically equivalent *relative to the currently conceivable observational framework*, yet incompatible on unobservables.** The battleground shifts to defining "scientifically plausible" and "conceivable observational framework."

  ### 2. **The Empirical Equivalence Illusion Charge (Potentially Decisive for Strong Permanence)**
      *   **Objection:** Alleged cases of permanent empirical equivalence almost always dissolve under scrutiny. Differences in unobservable structure *tend to* generate *conceivable* (even if not yet actualized) observational differences under *conceivable* conditions or with *conceivable* instruments. Strict "all *and only* the same observational consequences" is an impossibly high bar rarely met by substantive rivals. The thesis trades on vagueness about "observational consequences" (current tech? all future tech? all logically possible observations?).
      *   **Why it might be decisive:** If no plausible, non-trivial rivals are *permanently* empirically equivalent, the strong thesis collapses. Most historical "examples" are shown to be non-equivalent later.
      *   **Key Historical Tests:**
          *   **Newton vs. GR:** Seemed empirically equivalent for centuries (perihelion of Mercury was known but not decisively anomalous until GR). GR predicted distinct outcomes (light bending, time dilation, frame-dragging) that became testable. *Against Thesis*.
          *   **Lorentz/Poincaré Ether vs. Special Relativity (SR):** Often cited as equivalent pre-1905. SR's predictions about the behavior of clocks and rods moving at relativistic speeds relative to each other *without an ether* were incompatible with Lorentz's *interpretation* of the math, even if the equations were similar initially. The conceptual incompatibility was profound. Later tests (e.g., Kennedy-Thorndike) distinguished them in principle, though precision came later. *Ambiguous, but leans Against Thesis.*
          *   **Copenhagen vs. Bohmian Mechanics:** The canonical modern example. Bohmian mechanics reproduces *all standard QM predictions*. Crucially, **no conceivable experiment within the standard quantum formalism can distinguish them.** This is arguably the *strongest case for the thesis*. However, critics argue Bohmian mechanics is less simple, introduces "hidden variables" arguably ruled out by Bell tests (though Bohm evades this via non-locality), and struggles with relativity. *Best Evidence For Thesis, but contested.*
          *   **Global Geometry of the Universe (Flat vs. Spherical vs. Hyperbolic):** If the universe is sufficiently large, these could be observationally indistinguishable *in principle* (due to light travel time limits). This is a serious candidate for permanent underdetermination. *Strong Evidence For Thesis.*
      *   **Your Necessary Concession:** You must clarify the scope of "observational consequences":
          *   **Fixed Framework Concession:** Empirical equivalence is relative to the *currently accepted framework* of what counts as observation and what instruments/experiments are *conceivable*. Future paradigm shifts (new instrument types, new concepts of observation) can break equivalence. Your strong claim likely needs **"relative to all *conceivable* observations within our *current* scientific worldview/physics."** This risks future falsification (e.g., discovering FTL travel could falsify Lorentz/SR equivalence).
          *   **Permanence Concession:** Truly permanent underdetermination is rare (like global geometry). Most cases are transient. The interesting claim becomes: **Underdetermination by *current* evidence relative to *current* observation concepts is pervasive and non-trivial for mature theories, and *some* cases (like universe geometry or Bohm/Copenhagen) might be permanent *relative to known physics*.**

  ### 3. **The Transience Charge (Damaging to Strong Permanence Claims)**
      *   **Objection:** History shows apparent underdetermination is almost always *temporary*. New evidence, new instruments, or theoretical developments resolve it (e.g., Fresnel vs. Newtonian optics resolved by Arago spot; phlogiston vs. oxygen resolved by quantitative chemistry; caloric vs. kinetic heat resolved by Joule; various ether models vs. SR/GR). The thesis overgeneralizes rare, unstable situations. Worrisome underdetermination is a curiosity, not the norm.
      *   **Why it's damaging:** It directly challenges the "for any mature theory" and "no *possible* evidence" aspects. If rivals are usually defeated by new evidence, then evidence *can* oblige rational choice.
      *   **Your Defense/Concession:**
          *   **At t₀ Defense:** At any *given time* t₀, for a theory mature *at t₀*, there exists a rival plausible *at t₀* that is empirically equivalent *relative to evidence and instruments conceivable at t₀*. History shows this state recurs constantly.
          *   **Concession:** You must grant that *most* specific instances of underdetermination are transient. The strong, interesting claim morphs into: **The state of underdetermination relative to available evidence is the *default and persistent condition* of mature science, even if specific rival pairs come and go.** The threat to realism isn't that we're *stuck* with a specific wrong theory forever, but that we're *always choosing* under evidential underdetermination, relying on non-evidential virtues to pick one (which might later be falsified by new evidence breaking the equivalence).

  ### 4. **The Abduction/Bayes Rescue Charge (Challenges "Non-Evidential" but Doesn't Kill Thesis)**
      *   **Objection:** Abductive reasoning (Inference to the Best Explanation - IBE) and Bayesian confirmation show how evidence *does* support theories about unobservables. Simplicity, explanatory power, etc., *are* truth-conducive virtues that help us discern which theory is *likely* correct given the evidence. High prior for a simple, unifying theory updated by evidence *is* evidential support. Non-evidential factors might break ties, but evidence does the heavy lifting.
      *   **Why it doesn't kill the thesis:** Your core point is that when T and T' are empirically equivalent *by definition*, evidence *cannot* favor one over the other *directly*. Abduction/Bayes kicks in *precisely because* evidence is exhausted.
          *   **Abduction:** If T and T' explain the *same* evidence, how does IBE choose? It must appeal to virtues *beyond* fit-with-evidence (simplicity, scope, mechanism, etc.). Your thesis says *these* virtues are not evidential in the direct sense.
          *   **Bayes:** If T and T' entail the same evidence E, then P(E|T) = P(E|T'). Evidence E cannot change their relative odds (P(T|E)/P(T'|E) = P(T)/P(T')). Choice depends *entirely* on prior probabilities (P(T) vs P(T')). Your thesis says priors reflect non-evidential virtues (simplicity, elegance, etc.) or subjective/pragmatic factors. Bayes formalizes your point, it doesn't refute it.
      *   **Dialectical Stalemate:** This becomes a debate about the nature of "evidence" and the justification of theoretical virtues. Is simplicity evidence for truth? The realist argues yes (via abduction or success arguments). The underdetermination advocate argues no (simplicity is pragmatic, or its link to truth is unproven). Your thesis is *consistent* with Bayesianism; it highlights that under equivalence, priors alone determine choice.

  ### 5. **The Convergence Charge (Strongest Realist Counter, Especially with Novel Predictions)**
      *   **Objection:** The history of science displays striking convergence in its descriptions of the unobservable world, even across radical theory changes. Mathematical structures, mechanisms, and entities are often preserved or refined (e.g., atoms, genes, electromagnetic fields, the mathematical core of Newtonian mechanics within GR limits). This convergence is best explained by scientific theories latching onto reality. If your thesis were correct, such stable reference and convergence would be inexplicable luck.
      *   **Why it's the strongest realist counter:** It directly challenges the "incompatible on unobservables" part in a way that feels non-accidental. It suggests the non-evidential virtues used in choice (like explanatory power) *are* tracking truth.
      *   **Your Defense:**
          *   **Convergence on *Structure*, not Ontology:** Argue that what converges is the *empirical structure* (represented mathematically) and successful *predictive rules*, not necessarily the literal ontology. Ptolemy's epicycles, Newton's forces, and GR's curvature are incompatible ontologies describing the same structural relationships observable in planetary motion.
          *   **Pragmatic Convergence:** Convergence reflects the pragmatic success of certain mathematical formalisms and modeling strategies, not truth. We keep what works predictively, regardless of underlying ontology.
          *   **Selection Effect:** We only see convergence in *successful* lineages. Countless incompatible empirically equivalent rivals were never developed or were discarded for non-truth-related reasons (complexity, lack of heuristic fruitfulness). Convergence doesn't prove the *chosen* ontology is true, just that the *empirical content* is stable.
          *   **Novel Predictions Gambit:** The realist's trump card is novel predictions (e.g., GR predicting light bending). *Your response:* Novel predictions break empirical equivalence! They are precisely the new evidence that resolves *transient* underdetermination. Your thesis concerns situations *before* such evidence exists. A theory making a novel prediction *wasn't* empirically equivalent to its rivals *at the time the prediction was made and confirmed* relative to prior evidence. This reinforces concession 3: underdetermination is persistent *state*, but specific instances are resolved.

  ## The Map of Exposure & Insulation

  1.  **Most Exposed Flank:** **The Holism/Triviality Challenge.** Your thesis lives or dies on restricting "rival theory" to **scientifically plausible, non-ad-hoc competitors.** If "rival" includes any logically possible T' + Aux', the thesis is trivial. You *must* defend a robust notion of scientific plausibility independent of just fitting current data.
  2.  **Critical Vulnerability:** **Permanence.** The strong claim of *permanent* underdetermination for *any* mature theory is empirically dubious. History favors transience. Your best bets are **global cosmology** (universe shape) and **interpretations of quantum mechanics** (Bohm vs. Copenhagen). Defend these as substantive and plausibly permanent *relative to known physics*.
  3.  **Dialectical Weak Point:** **"Observational Consequences".** Vagueness here invites attack. Commit to **"relative to all observations conceivable within our current scientific framework/physics"** (acknowledging this framework might change).
  4.  **Resilient Core:** **Non-Evidential Choice Under Equivalence.** Once empirical equivalence (relative to current evidence/framework) and scientific plausibility of rivals are granted, the claim that *further evidence* cannot decide and choice relies on non-evidential virtues is logically secure. Abduction/Bayes formalizes this; convergence arguments contest the *significance* of the choice but not the *structure* of the underdetermination at the moment of choice.
  5.  **Insulation Status:** **Conditionally Insulated, Not Vacuous.** The thesis *is* insulated against direct empirical falsification *for specific theories at specific times* by its concessions (transience, framework-relativity, plausibility). However, it is *not* vacuous:
      *   It makes a bold claim about the *ubiquity* of the underdetermined state in mature science.
      *   It identifies specific candidate cases (QM interpretations, cosmology) where underdetermination seems robust.
      *   It forces realists to confront why non-evidential virtues should be considered truth-conducive.
      *   **Falsifiability Test:** If science reached a point where a mature, fundamental theory (e.g., a "Theory of Everything") made *every conceivable prediction* about *every conceivable observation within physics*, and no plausible rival could be conceived, the thesis would be falsified. The existence of Bohmian mechanics as a viable, empirically equivalent rival to standard QM interpretations shows this hasn't happened yet. The realist bets it eventually will (convergence); you bet it won't, or that new underdetermination will emerge.

  **Conclusion:** Your strong thesis is defensible, but only by making significant concessions: rivals must be plausible/non-ad-hoc, equivalence is framework-relative and often transient, and permanent cases are rare. Its power lies in highlighting the *persistent gap* between total evidence and theory choice in mature science, forcing realists to grapple with the role of non-evidential virtues. The **Convergence Charge** coupled with **Novel Predictions** is the realist's strongest weapon, while the **Holism Charge** is the most dangerous if you cannot define "rival" robustly. **Bohmian Mechanics vs. Copenhagen** remains your strongest contemporary bastion; its continued viability is a key test case. Your position is exposed on the grounds of *permanence* and *ubiquity*, but insulated on the *logical point* that equivalent evidence cannot distinguish incompatible theories, making non-evidential factors decisive *at the moment of choice*.
