     - 4. Predictive-processing: The visual system makes a prediction of the motion and color change, and the percept is the prediction (so the future color is predicted and thus experienced at the midpoint).
     - 5. Timestamp-at-binding: Features (like color) get their timing from the object they are bound to. The second dot's color is bound to the moving object and thus is experienced as happening at the midpoint because that's when the object is there in the constructed motion.
     - 6. Two clocks: Different features (color and motion) are processed with different latencies and then reconciled after the fact. The report is a post-hoc sync.
