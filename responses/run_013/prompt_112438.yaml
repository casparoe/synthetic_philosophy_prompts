answer: |-
  Here is a careful dissection of the problem of temporary intrinsics and its implications for persistence, tailored to your background and queries:

  ### 1. Lewis's Argument Stated Precisely
  Lewis's argument (*On the Plurality of Worlds*, 1986) targets **endurantism** (objects are "wholly present" at each moment of their existence). It runs as follows:

  *   **(P1) Temporary Intrinsics Exist:** Objects genuinely change their intrinsic properties over time (e.g., a ball is spherical at t₁, cubical at t₂).
  *   **(P2) Incompatibility:** Intrinsic properties like being spherical and being cubical are incompatible; no single object can possess both *simpliciter*.
  *   **(P3) No Temporal Qualification for Intrinsics:** Genuine intrinsic properties are not had *relative to* anything (like a time); they are had *simpliciter*.
  *   **(P4) Endurantist Commitment:** If an object endures, it is **wholly present** at t₁ and wholly present at t₂. There is no "part" of the object existing only at t₁ or t₂ that bears the property.
  *   **Conclusion/Contradiction (for Endurantism):** At t₁, the *whole* ball is spherical (*simpliciter*). At t₂, the *same whole* ball is cubical (*simpliciter*). But nothing can be both spherical and cubical *simpliciter*. Contradiction.

  **The Crucial Premise:** **P3** ("No Temporal Qualification") does the heavy lifting. It insists that intrinsic properties *must* be monadic (one-place: F(a)) rather than relational (two-place: F(a, t)). Lewis argues that temporal qualification (indexing) turns intrinsics into disguised relations, destroying their "intrinsicness."

  *   **If P3 is Denied:** If intrinsic properties *can* be temporally qualified (F-at-t(a)), the contradiction dissolves. The ball is spherical-at-t₁ and cubical-at-t₂, which is consistent. However, Lewis contends this move comes at a high cost: the collapse of intrinsic properties into relations.

  ### 2. Evaluating the Endurantist's Options
  Endurantists *must* reject P3 to avoid contradiction. Here are their main strategies:

  *   **a) Relationalism/Indexicalism (Standard Response):** Shape *is* a relation to a time (e.g., `spherical-at(t₁)`).  
      *   **Lewis's Objection (The Cost):** This turns *all* properties into relations to times. "Being spherical" becomes like "being to the left of" – inherently relational. But intrinsics are supposed to depend *only* on the object itself, not its relations. If *shape* (paradigmatically intrinsic) is relational, what property remains genuinely intrinsic? Mass? Charge? Relationalism threatens to erase the intrinsic/relational distinction.
      *   **Endurantist Defense:** Some (e.g., Johnston, Haslanger) argue this is a *revision* we should accept. Properties *are* temporally relativized in fundamental metaphysics, even if language often omits the time parameter. The distinction between intrinsic and extrinsic can be preserved *within* this framework: an intrinsic property is one that, when relativized (F-at-t(a)), depends *only* on the object at t, not on other objects or times. Being spherical-at-t depends only on the ball at t; being a sister-at-t depends on others. This preserves a *core* of the distinction.

  *   **b) Adverbialism:** Instead of "the ball is spherical-at-t₁," say "the ball is t₁-ly spherical," treating the time as modifying *how* the property is had.  
      *   **Substance vs. Redescription?** This is a substantive proposal aiming to avoid turning the property itself relational. The property (`spherical`) remains monadic, but its instantiation is modified by the adverb (`t₁-ly`).
      *   **Criticism:** Many find this linguistically unnatural and ontologically obscure. What is "t₁-ly"? Is it a genuine feature of instantiation, or just a disguised way of saying "at t₁"? Critics (like Sider) argue it's a merely verbal solution that doesn't resolve the underlying ontological problem – the ball still instantiates incompatible monadic properties (`spherical` and `cubical`), just "in different ways," raising the same worry about how one thing can do this.

  *   **c) Sortal-Relative Properties:** Shape might be relative to a sortal concept or "stage" (less common).  
      *   **Criticism:** Often seen as ad hoc for this problem and failing to address the core issue of change in the same object under the same sortal.

  **Verdict on Options:** Relationalism is the most robust endurantist response, but its cost (relativizing *all* properties) is significant. It forces a revision of our understanding of intrinsics. Adverbialism offers an alternative but struggles to overcome charges of obscurity or triviality. The cost isn't *just* contradicting ordinary conviction (though it does); it's fundamentally altering the ontology of properties and potentially collapsing a key metaphysical distinction.

  ### 3. Physics, Indexing, and the Spatial Analogy: Solution, Dissolution, or Confusion?
  Your suspicion is astute and cuts to the heart of the debate.

  *   **Physics as Solution/Dissolution:** From a scientific realist perspective steeped in physics, **relationalism/indexicalism (option 2a) isn't a cost; it's the baseline truth.** Physics *always* assigns properties at spacetime points or regions. "The rod's length" is `L(x, y, z, t)` in its rest frame. Demanding properties *simpliciter* seems like a philosophical artifact disconnected from fundamental ontology. The problem arises *only* if one insists (via P3) that fundamental ontology *must* include properties had *simpliciter* by enduring substances. Physics suggests this insistence is misguided. **The spatial analogy reinforces this:** We readily accept "red-here" and "blue-there" via spatial parts (perdurantism) *or* via spatial indexing ("red-at-location₁", "blue-at-location₂") without contradiction for endurantism. Why treat time differently?

  *   **The Endurantist's Justification (The Work of "Wholly Present"):** Endurantists argue temporal variation *is* fundamentally different from spatial variation because of **identity over time**. The wall's spatial parts coexist; the ball's temporal "parts" are its *entire history*. When we say "the ball *itself* changed," we mean the *numerically identical* entity possesses incompatible properties. "Wholly present" signifies this strict identity: the *whole* ball exists *now* and was *wholly* present *then*. Spatial parts don't threaten identity; temporal variation seemingly does. Denying temporal parts is meant to preserve the intuition that we *directly* encounter the persisting object itself at each moment, not just a temporal slice.

  *   **Critique of "Wholly Present":** Perdurantists argue "wholly present" is **stipulative and question-begging**. If the ball at t₁ is spherical and the ball at t₂ is cubical, and they are numerically identical, how *can* it avoid contradiction without indexing? The phrase "wholly present" blocks the perdurantist solution (temporal parts) but doesn't *solve* the contradiction; it just restates the endurantist commitment. The spatial analogy shows indexing works seamlessly for space within endurantism; refusing it for time seems arbitrary unless one *already* assumes a deep metaphysical difference between space and time (which physics, especially relativity, undermines).

  ### 4. Endurantism and Relativity
  **Yes, standard endurantism requires a privileged notion of simultaneity.** If an object is "wholly present" *now*, "now" must be a global, objective state of affairs – a hyperplane of absolute simultaneity slicing through spacetime. Relativity of simultaneity shows there is no such unique hyperplane; "now" is frame-dependent.

  *   **The Weight:** This is a **significant problem** for endurantism. Physics provides overwhelming evidence against absolute simultaneity. Endurantists must either:
      *   **Deny Relativity's Ontological Import:** Argue relativity is merely about measurement/observation, not fundamental reality (a difficult stance).
      *   **Adopt a Neo-Lorentzian Interpretation:** Posit a hidden preferred frame (scientifically unparsimonious and empirically unverifiable).
      *   **Revise Endurantism:** Develop a frame-relative version where an object is "wholly present" relative to a chosen reference frame (e.g., Balashov, Gilmore). This makes persistence frame-dependent, which many find counterintuitive and ontologically messy.

  Perdurantism ("exdurantism" or "stage theory" included) **faces no such problem.** Spacetime is a 4D manifold; objects are 4D entities. Temporal parts are spacelike slices, but the choice of slicing (simultaneity hyperplane) doesn't affect the underlying 4D object's existence; it merely affects how we describe its instantaneous states. Persistence is the having of temporal parts along a worldline, a manifestly frame-independent fact.

  ### Verdict: Does the Problem Give Perdurantism a Genuine Advantage?
  **Yes, but not a knockout blow, and the advantage is significantly amplified by relativity.**

  1.  **The Core Problem:** The problem of temporary intrinsics *does* create a genuine difficulty for endurantism. It forces endurantists to either:
      *   Relativize all properties (significant revision to property ontology, blurs intrinsic/extrinsic).
      *   Adopt obscure/controversial alternatives like adverbialism.
      Perdurantism handles the problem effortlessly through temporal parts, analogous to spatial parts. This is a clear, parsimonious advantage *within the context of the debate as framed by Lewis*.

  2.  **The Physics Factor:** Your background highlights the crucial point: **physics inherently operates with indexed properties.** This makes endurantism's resistance to indexing seem metaphysically suspect and disconnected from scientific ontology. The spatial analogy further undermines the claim that temporal indexing is uniquely problematic.

  3.  **The Relativity Factor:** The *need* for absolute simultaneity (or complex frame-relative revisions) is a **major additional burden** for endurantism that perdurantism avoids entirely. Given the empirical success of relativity, this carries substantial weight.

  **Conclusion:** The problem of temporary intrinsics does give perdurantism a **genuine advantage** in terms of parsimony, compatibility with scientific practice (especially indexing and relativity), and straightforwardness in handling change. Endurantism is not refuted, but it is burdened with significant ontological costs (relational properties, blurring intrinsics, obscurity in alternatives) and a severe challenge from relativity. For someone with your physics background, perdurantism's seamless integration with spacetime ontology is likely its strongest appeal, while the "cost" endurantists pay (indexing) aligns precisely with the way physics fundamentally describes the world. The debate continues, but the problem of temporary intrinsics, especially when combined with relativity, tilts the scales towards perdurantism.
