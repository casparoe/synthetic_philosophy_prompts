prompt: |-
  I teach a 90-minute undergraduate seminar in philosophy of science, 14 students. Design a runnable mock boundary commission that makes them feel the force of the idea that the start of the Anthropocene is not simply discovered but instituted. The commission must choose one date and one physical marker, and its rules require the marker to be a single stratigraphic signal preserved in one reference section. Give them conflicting evidence cards—a microplastic horizon in a fictional high-latitude lake core, a mid-century radionuclide spike, a fly-ash layer, a broiler-chicken bone assemblage, and a colonial-era land-use proxy—along with roles that carry different institutional interests (a stratigrapher, a historian, a representative of the community near the candidate site, a climate modeler, a chair who wants consensus, and a member who opposes formalization). Impose a supermajority voting rule and a fallback if no date reaches it. The rules should force them to experience that the outcome depends on who is in the room and what counts as a marker, not just on the data. Include a timeline, a materials list, a debrief that maps each moment onto the real Anthropocene debate, a frank note on what the activity cannot reproduce (the multi-year ratification process and the institutional authority that makes a reference section binding), and a prediction of what will predictably go wrong the first time I run it and how to handle it. Participants should leave seeing that periodization is a decision with winners and losers, not a neutral reading of the strata.
reasoning: |-
  We are designing a 90-minute undergraduate seminar activity to illustrate the social construction of the Anthropocene epoch's start date. The activity will simulate a boundary commission meeting where students, assigned specific roles, must choose a single date and a physical marker (a Global Boundary Stratotype Section and Point, or GSSP) for the Anthropocene. The rules require the marker to be a single stratigraphic signal preserved in one reference section. The goal is for students to experience how the outcome depends on who is in the room and what counts as evidence, not just on the data.

  ### Activity Design: "Anthropocene Boundary Commission Mock Meeting"

  #### Timeline (90 minutes total)
  1. **Introduction (10 min):** Set the stage, explain the activity, assign roles, and review rules.
  2. **Review Evidence (10 min):** Participants review their evidence cards and role sheets.
  3. **Opening Statements (10 min):** Each participant states their position based on their role.
  4. **Deliberation and Negotiation (30 min):** The commission discusses and tries to reach consensus.
  5. **Voting (10 min):** Two rounds of voting (with a fallback if no supermajority).
  6. **Debrief (20 min):** Map the activity to the real Anthropocene debate and discuss the social construction of geological time.

  #### Materials List
  - **Role Sheets (7 roles):** 
    1. **Stratigrapher:** Wants a clear, globally synchronous signal that is mineralogical and can be preserved in the geological record. Favors radionuclide spike or microplastics because they are detectable worldwide.
    2. **Historian:** Argues for an earlier date tied to human history (colonial land-use) and questions the mid-20th century focus. Wants a marker that reflects long-term human impact.
    3. **Community Representative:** Represents a community near a candidate site (e.g., the lake where the microplastic core is taken). Wants the marker to be local to their area for economic and cultural reasons (tourism, recognition). Opposes markers that might stigmatize the area (like radionuclides).
    4. **Climate Modeler:** Focuses on the Earth system shift and favors the mid-20th century "Great Acceleration" markers (radionuclide spike, fly ash) because they coincide with rapid changes in climate proxies.
    5. **Chair:** Wants consensus and a decision. Tries to mediate and find common ground. May suggest compromises.
    6. **Opponent of Formalization:** Believes the Anthropocene should not be formalized at all, or that it is too soon. Argues that the evidence is too human-centric and not yet settled in the geological record. May try to block any decision.
    7. **Broiler Chicken Industry Observer (optional, if 14 students, we can have two of some roles):** Advocates for the broiler chicken bone assemblage as a marker of the industrialization of agriculture and the massive human alteration of the biosphere. This role can be combined or split.

  - **Evidence Cards (one per piece of evidence):**
    1. **Microplastic horizon in a high-latitude lake core:** Dated to the 2010s. Pro: a very recent and globally widespread marker. Con: may not be synchronous globally and might be too new to see long-term preservation.
    2. **Mid-century radionuclide spike (from atomic bomb tests):** Dated to 1964 (peak). Pro: globally synchronous and detectable in many strata. Con: associated with a negative event (nuclear testing) and might be politically sensitive.
    3. **Fly-ash layer (from coal combustion):** Dated to the 1950s. Pro: widespread in industrial regions. Con: not globally uniform (stronger in the Northern Hemisphere).
    4. **Broiler-chicken bone assemblage:** Represents the rapid rise of industrial agriculture (peaking in the late 20th century). Pro: a clear sign of human domination of the biosphere. Con: may not be found in all strata and is biostratigraphic, which is less common for epoch boundaries.
    5. **Colonial-era land-use proxy (e.g., pollen shift indicating deforestation):** Dated to the 1600s-1700s. Pro: reflects long-term human impact. Con: not globally synchronous and hard to find a single reference section.

  - **Voting Rules:**
    - The commission must choose one marker and one date (the date associated with the chosen marker).
    - A supermajority of 5 out of 7 (or 10 out of 14 if doubling roles) is required for a decision.
    - If no marker achieves a supermajority in the first vote, the commission holds a second vote between the top two markers (if there is a tie for top, the chair breaks the tie for the purpose of selecting the top two).
    - If the second vote does not yield a supermajority for one marker, the commission will table the decision and issue a statement that the Anthropocene boundary requires more research (the fallback).

  #### How the Activity Illustrates Social Construction
  - **Roles and Interests:** Participants will see that the choice of marker is influenced by the interests of the people in the room (e.g., the community representative pushing for a local marker, the historian for an earlier date).
  - **What Counts as Evidence:** The rules force a single marker and a single reference section, so they must debate which signals are "good enough" for stratigraphy, often sidelining important but non-stratigraphic evidence (like historical events).
  - **Voting Rules:** The supermajority requirement and fallback mimic the real-world difficulty of achieving consensus in scientific committees.

  #### Debrief (20 min)
  - Map the activity to the real Anthropocene Working Group (AWG):
    - The AWG proposed the mid-20th century (with radionuclides as a marker) but faced criticism from historians and Earth system scientists who favored earlier dates or different markers.
    - The role of non-geological interests (e.g., political, cultural) in the real debate.
    - How the choice of marker affects who "wins" (e.g., the radionuclide marker emphasizes the nuclear age, while an agricultural marker might emphasize the Industrial Revolution).
  - Discuss: Why is periodization a decision with winners and losers? (e.g., if the Anthropocene starts in 1964, then the Holocene includes the Industrial Revolution; if it starts in 1610, then colonialism is central.)

  #### What the Activity Cannot Reproduce
  - **The Multi-Year Ratification Process:** The real process involves multiple committees (International Commission on Stratigraphy, International Union of Geological Sciences) and takes years, with opportunities for input and revision.
  - **Institutional Authority:** The GSSP, once ratified, becomes a binding reference for the global geological community. Our mock commission's decision is just an exercise.

  #### Predictable Problems and Solutions
  - **Problem:** The discussion may get stuck on one marker (e.g., radionuclides) and not consider others.
    - **Solution:** The chair should encourage each member to speak and remind them of the evidence cards. Set a timer for each phase.
  - **Problem:** The opponent of formalization may derail the process by refusing to engage.
    - **Solution:** The chair can remind the commission that the rules require a vote and that the fallback (no decision) is a valid outcome. Also, assign this role to a student who can argue the point without being disruptive.
  - **Problem:** Students may not fully embody their roles.
    - **Solution:** Provide clear role sheets with specific talking points and goals. Give them 5 minutes to read and internalize their role.
  - **Problem:** Time may run short.
    - **Solution:** Strictly enforce time limits. Have a timer visible. If necessary, shorten the deliberation by 5 minutes and extend the debrief.

  #### Role Assignment for 14 Students
  Since there are 14 students, we can have two of each role (making 12) and two chairs? But note: the chair is one role. Alternatively, we can have:
  - 2 Stratigraphers
  - 2 Historians
  - 2 Community Representatives (representing two different candidate sites? or the same site but with two perspectives)
  - 2 Climate Modelers
