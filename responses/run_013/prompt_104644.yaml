  1. **Stratigraphers (2 students):** They must agree on their position. They are looking for the most globally synchronous and stratigraphically clear signal.
  2. **Historians (2 students):** They argue for the colonial-era land-use proxy. They may also be critical of the mid-20th century markers as too recent.
  3. **Community Representatives (2 students):** They are from the same community near the lake where the microplastic core was taken. They want the marker to be in their lake to bring prestige and funding to their area. They are wary of negative markers.
  4. **Climate Modelers (2 students):** They are focused on the Earth system shift and favor the radionuclide or fly-ash markers because they coincide with the Great Acceleration.
  5. **Chair (1 student):** This role is singular. They moderate and try to build consensus. They do not vote unless there is a tie in the top two for the second vote.
  6. **Opponents of Formalization (2 students):** They believe the Anthropocene is not a geological epoch but a cultural concept, and that it's too early to formalize. They may argue that none of the markers are adequate.
  7. **Industry/Agriculture Representatives (3 students):** We can split this into:
     - 1 for the broiler chicken industry (advocating for the bone assemblage)
     - 1 for the plastics industry (arguing against the microplastic marker because it might lead to regulation)
     - 1 for the energy industry (arguing against the fly-ash marker because it points to coal)

  But note: the evidence cards are fixed. The plastics industry representative might downplay the microplastic evidence, while the community representative might be in favor of it. This adds complexity.

