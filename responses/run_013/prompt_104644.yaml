  5. **Opponents of Formalization:** They argue that the Anthropocene is not a geological epoch and that formalizing it now is premature. They may try to block any decision.
  6. **Agriculture Representatives:** Advocate for the broiler chicken bone assemblage as a marker of the transformation of the biosphere by industrial agriculture.
  7. **Co-Chairs (2 students):** They moderate the discussion, ensure everyone has a chance to speak, keep time, and run the voting. They are neutral and try to build consensus. They only vote to break ties in the second round if the top two are tied.

  ### Running the Activity

  1. **Introduction (10 min):** 
     - Explain the concept of the Anthropocene and the task of the boundary commission.
     - Assign roles randomly (or strategically) and hand out role sheets and evidence cards.
     - Review the rules and timeline.

  2. **Review Evidence and Role Prep (10 min):** 
     - Students read their role sheets and evidence cards. They can discuss with their partner.

  3. **Opening Statements (10 min):** 
     - Each group (in any order) gives a 1-minute opening statement stating their preferred marker and why.

  4. **Deliberation (30 min):** 
     - The co-chairs moderate an open discussion. They should encourage debate, allow rebuttals, and prompt groups to respond to each other. 
     - Goal: Try to build consensus or at least narrow down the options.

