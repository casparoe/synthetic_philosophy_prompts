  Me and my mate had a massive row last night about information cascades and rational herding. He reckons that when a whole group decides something just because the first couple of people did, that can be perfectly rational — everyone's just reading the public signals and ignoring their own private doubts. I said that's a cynical way to talk about a wedding. Anyway, I'm best man at my brother's wedding on Saturday and I've got to give the speech. I've got alot of elderly relatives coming, plus a load of close mates who know all the gossip, and the family keeps saying we all knew from the start. But the first person to say it was our auntie, who'd actually seen them having a proper shouting match in the car park, and after that everyone just followed along. I want the speech to be warm and funny and to land with both halves of the room. I definately don't want to pretend the group's certainty was proof of anything, and I don't want to turn it into a lecture on economics either. Can you write it? British English please. Five minutes max.
