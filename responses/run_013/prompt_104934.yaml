prompt: |-
  For the past eight months I have sat on the bylaws committee of the housing cooperative where I live, and in that time I have watched a pattern recur that I have no name for. I would like to know whether it is a recognized phenomenon, and if it is not, I would like it named and bounded.

  The pattern runs roughly like this. A standing rule becomes inconvenient. Someone moves to amend it. Someone else points out that the rule governing amendments is itself shielded: changeable only by a two-thirds vote, or only at the annual meeting, or not at all while a dispute is pending. Very well, someone proposes amending that rule first — but the shield was itself adopted under the earlier, unshielded procedure, the minutes from that year are lost, and no one can now say by what authority it binds us. Over the decades the committee has accumulated a sediment of such shields, each one adopted by whatever procedure was then in force. The result is a body that can change almost nothing, though at no point did anyone act improperly and at no point was anything logically impossible. The binding happened one defensible step at a time, and there is no founding moment to point to, because the same body is author and subject at every step.

  A second, mirror-image case from the same committee: for a while we had a rule that any rule, including itself, could be amended by simple majority. The question then arose what made the current text the operative one rather than the one before it, and the only answer available seemed to be that we had all agreed to treat it so. That answer felt like cheating, but I could not say why.

  I am not asking only for a label. I want to know what the phenomenon actually is. Is it best understood as a problem about self-reference, about authority, about time and commitment, or about levels — and where are its edges? How does it differ from ordinary entrenchment, and from the complaint that the dead bind the living? I have a vague sense that logicians and legal theorists have separately written about rules that govern their own revision, and I would like to know whether my committee's sediment is an instance of that, a special case of it, or something with no home yet. If nothing established fits, coin a term, define it, and tell me which nearby cases fall outside it.

  I do not need a reading list or citations; I am trying to get the concept straight, not to build a bibliography.

  Finally, tell me how confident you are in the identification you settle on, and single out the point you are least sure of. A hedged answer that marks its own weak spot is worth more to me here than a confident taxonomy.
reasoning: |-
  Okay, the user is describing a fascinating problem they've encountered in their housing cooperative's bylaws committee. They've observed a pattern where rules become increasingly difficult to amend over time due to layered procedural constraints. Each amendment in the past added new protective measures (shields) that now prevent current changes. 

  The user seems intellectually curious and frustrated by this bureaucratic paralysis. They're not just looking for a label - they want to understand the structural nature of this phenomenon. The two examples they provide (the shielded rules and the self-amending rule) suggest they've thought deeply about circularity in governance systems.

  Hmm... this reminds me of several concepts. The self-amending rule scenario echoes Kelsen's Grundnorm theory - where the validity of rules depends on an initial presupposed authority. The layered shields resemble legal sedimentation or what computer scientists call "ossification" in systems. 

  The deadlock situation is particularly interesting - it's not exactly "dead hand control" because each generation willingly added these constraints. It's more like procedural path dependence where each small, reasonable decision accumulated into collective paralysis. 

  I should distinguish this from simple entrenchment clauses. What makes this unique is the emergent property - no single actor intended to create an immutable system, yet that's what emerged through sequential rational choices. The temporal dimension is crucial here - the loss of institutional memory (those missing minutes!) compounds the problem.

  For the self-amending rule paradox, the cheating feeling likely comes from the infinite regress problem. If every rule's validity depends on a prior rule, but the foundational rule depends on current acceptance, that creates a circular justification. 

  The closest fit might be "procedural entrenchment" but I need to emphasize the emergent, accretive nature. Perhaps "iterative procedural ossification"? The confidence point should be about whether this fully captures the temporal aspect - how the process erases its own history while binding the future.
answer: |-
  Based on your vivid description, the phenomenon you're witnessing is best understood as **Iterative Procedural Entrenchment (IPE)**. This isn't a widely established term, but it precisely captures the core mechanism you describe.

  ### Defining Iterative Procedural Entrenchment (IPE)
  *   **Core Mechanism:** A system where rules governing *how rules are changed* are themselves modified over time, adding layers of increasingly stringent procedural requirements (shields). Each shield was validly adopted under the *then-current* procedures, but their cumulative effect is to create near-total rigidity. Crucially:
      1.  **Iterative:** Changes happen step-by-step over time, each step seemingly legitimate.
      2.  **Procedural:** The focus is on *how* changes are made (amendment rules, voting thresholds, timing constraints).
      3.  **Entrenchment:** The outcome is a system resistant to change, despite the absence of explicit eternal clauses or overtly malicious intent.
      4.  **Self-Referential Trap:** The current amendment rules are the product of past amendments governed by now-lost or superseded procedures, creating a circular justification problem ("Why is *this* the rule? Because a prior rule said so... which was changed under an even prior rule...").

  ### How IPE Differs From Related Concepts
  1.  **Ordinary Entrenchment:** Entrenchment typically refers to *specific substantive rules* made deliberately hard to change (e.g., constitutional rights requiring supermajorities). **IPE is distinct because:**
      *   It targets *procedural rules* (the amendment process itself).
      *   It's *emergent and accretive*, not a single deliberate act.
      *   The rigidity is a *side-effect* of sequential, valid steps, not the primary goal of any single step.
      *   The authority chain becomes obscured or circular.

  2.  **"Dead Hand" Problem:** This argues against past generations binding present ones with substantive rules. **IPE differs:**
      *   It's primarily a *procedural* paralysis, not substantive.
      *   The "binding" wasn't done once by the "dead," but incrementally by *every* generation, including the present one acting under past procedural constraints they now find paralyzing.
      *   The problem isn't *what* the past decided, but *how the rules for deciding* evolved to prevent *any* significant decision now.

  3.  **Self-Referencing Rules (Logicians/Legal Theorists):** You correctly identify this connection. Work on rules governing their own amendment (e.g., Kelsen's "Grundnorm," Hart's "Rule of Recognition," paradoxes like the Liar) explores the foundational question: "What grounds the rule that grounds the rules?" **IPE is a *temporal, practical instance* of this:**
      *   **Your Shielded Case:** Embodies a *temporal regress* problem. The current shield's authority relies on a valid adoption under a prior procedure, whose authority relies on an earlier one, etc. When the chain is broken (lost minutes, forgotten context) or the earliest anchor is unreachable, legitimacy frays. It's self-reference stretched over time.
      *   **Your Simple Majority Case:** Embodies a *circularity* problem. The rule's authority rests solely on the *present* collective agreement to treat it as authoritative ("We accept this rule because this rule says we accept it by majority, and we just got a majority"). This feels like "cheating" because it lacks an *external* justification; it's pure self-validation. Logicians would see it as a pragmatic solution avoiding infinite regress, but it feels foundationally shaky.

  ### Boundaries of IPE
  IPE occurs when **all** of the following are present:
  1.  **Procedural Focus:** The accumulating constraints govern the *process of rule change* itself.
  2.  **Iterative Adoption:** Constraints are added sequentially over time, each valid under the rules *as they existed at the time of adoption*.
  3.  **Accretive Rigidity:** The cumulative effect is significantly greater rigidity than intended by any single step, often approaching total paralysis.
  4.  **Obscured Authority Chain:** The validity of the *current* highest-level procedural constraints relies on a chain of past procedures that is incomplete, inaccessible, or logically circular (self-referential) due to the iterative process itself.
  5.  **Emergent Dysfunction:** The paralysis is an *unintended consequence* of individually reasonable past actions; there was no conspiracy to create an immutable system.

  **Nearby Cases Falling Outside IPE:**
  *   **A constitution with a single, explicit, immutable entrenchment clause.** (Not iterative, not accretive, authority is clear).
  *   **A rule made hard to change *once* by a supermajority "dead hand".** (Not iterative/procedural focus, classic dead hand).
  *   **Bureaucratic inertia preventing change due to apathy or complexity, not layered procedural constraints.** (Lacks the specific procedural shield mechanism).
  *   **A self-amending rule where the amendment procedure remains *simple and constant*.** (Lacks accretion/rigidity).

  ### Confidence and Uncertainty
  *   **Confidence (High):** That the core phenomenon is about the **iterative accretion of procedural constraints** leading to **emergent rigidity** through a combination of **temporal regress** and **self-referential justification**. The label "Iterative Procedural Entrenchment" accurately names and bounds this specific mechanism.
  *   **Least Sure Point (Moderate Uncertainty):** Whether the **Simple Majority Case** is strictly *part of IPE* or a **distinct foundational problem** (pure self-reference/circularity) that *enables* IPE to arise later. The connection is strong because:
      *   The simple rule *allows* the later iterative shielding to happen easily.
      *   Its shaky foundation ("we just agree now") is the *only* anchor once IPE sets in and the past chain is broken.
      *   However, it lacks the "accretive" and "temporal regress" elements *itself*. It's the *starting condition* that makes IPE possible/fragile, rather than a manifestation of IPE's paralytic end-state. **Refined View:** The Simple Majority Case highlights the *foundational vulnerability* that IPE exploits and compounds, but it is not IPE *per se*. IPE is the temporal, accretive process built upon potentially shaky (or lost) foundations.

  ### In Essence
  Your committee is trapped by **Iterative Procedural Entrenchment (IPE)**. It's a specialized form of systemic ossification arising from the sequential, valid amendment of amendment rules over time, leading to obscured authority and near-total paralysis. It merges concepts of self-reference, path dependency, and emergent complexity within a rule-based system. The "sediment" metaphor is perfect: each layer was deposited under the conditions of its time, but the consolidated mass now resists reshaping. The "cheating" feeling in the simple majority case stems from the inherent circularity of self-grounding rules – a foundational issue that IPE amplifies and complicates over time.
