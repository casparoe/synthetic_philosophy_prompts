prompt: |-
  Hey — I'm a philosophy PhD student and I need to put together a short research proposal (3 pages, max) for a summer workshop on norms and social ontology, and I'm stuck on how to frame the thing. Hoping you can just write the proposal for me and I'll adjust.

  My half-baked idea is about everyday conventions — tipping, queueing, jaywalking. The usual move is to say conventions are coordination devices, so what you owe is just to go along when coordination actually matters; and then seperately, people say conventions carry real moral weight when others rely on them. I think each story is right about some cases and wrong about others, and the boring axes (is it a convention? is it enforced? do people expect it?) don't sort them. What I want to try instead is slicing them by who actually bears the cost when you opt out, and whether that bearer is identifiable. Skip the tip in a tipping economy and the cost lands on a specific server. Stand on the wrong side of the escalator and the cost is a diffuse, momentary annoyance nobody can really point to. Queue-jump and it feels like a fairness violation rather than a mere coordination break, even though in most queues nothing physical breaks if you slip in.

  So the crude three-way split I want to test: pure traffic conventions, cost-shifting conventions, and claim-conventions (queueing as the model case). Then the second half is visitors. When does a visitor pick up the obligations attached to a local convention — once they benefit from it, once locals can tell they aren't following it, or never, if it's a convention they have good reason to reject? I keep bouncing between "you owe reciprocity the moment you take advantage" and "you owe nothing until you've had a chance to opt in," and I can't tell if that's a real dilemma or just me being sloppy.

  Please turn this into an actual proposal. State the question so it has a determinate answer — right now mine is mush. Explain why the standard answers (coordination accounts, fair-play/reciprocity accounts, respect-for-local-norms accounts) leave it open rather than settling it. Lay out the method: what I'd concretely do, in order, across the summer. Say what a real result looks like versus me just re-describing my intuitions, and what would count as the project failing. Be honest about scope — I have about three months and I keep wanting to bolt on an empirical survey too; tell me if that's too much. No citations, I'll add those myself.

  One thing I specifically want from you: say where this is most likely to fall apart. Which case, if it turned out the other way, would sink the three-way split — and what would actually change your mind about the framing?
