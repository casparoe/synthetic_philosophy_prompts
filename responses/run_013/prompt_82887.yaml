prompt: |-
  I'm a law student writing a seminar paper on the philosophy of political authority, and I keep running into a pattern in how states actually behave that I can't square, so I'd like you to help me reconstruct what the pattern presupposes. Take two cases. In the first, a group of officers and civilians forcibly moves against a government widely regarded as brutal and corrupt; the attempt fails, and the participants are tried for treason and imprisoned for decades. In the second, a nearly identical attempt succeeds: the old regime collapses, the new government is recognized within a year, and — this is the part that puzzles me — the courts of the new order, and eventually foreign courts too, treat its founding decrees as having been valid law from the moment they were issued, its pre-recognition acts are ratified retroactively, and the very people who would have been hanged in the first case are buried as founders in the second. So the same legal order, or its successor, condemns rebellion in general and honors it in the particular, and legitimacy seems to attach to the winning rather than to the justified. Compounding my confusion: many of these same states insist that soldiers and civil servants must refuse unlawful orders, and that oaths of office run to a constitution rather than to any person — which looks like it licenses precisely the private judgment that the treason statutes forbid.

  Please act as a political philosopher with deep knowledge of both medieval Christian political thought and modern constitutional and legal theory, and think carefully before you commit to a verdict; I'd rather you spend your first effort laying out competing readings than rush to a tidy answer. What theory of political authority and political obligation does this practice presuppose? Reconstruct the implicit view as precisely as you can, and be careful to separate what the practice strictly presupposes from what it merely fits comfortably with — I suspect it is compatible with more than one theory, and I want to know where it is genuinely underdetermined. Address at least these candidates: a purely de facto or effective-control account of authority, on which success itself constitutes the title; a common-good account on which a tyranny is not genuine authority at all, so that resisting it is not rebellion in the first place, but on which the remedy must come from public authority rather than from private presumption (Aquinas's discussion of sedition is the obvious classic here, and I'd like it engaged seriously, especially his worry that a tyrant removed by someone's private initiative may leave the people worse off than the tyrant did); and a legal-positivist account on which validity tracks only a system's rules of recognition, so that retroactive ratification is simply ordinary legal housekeeping with no philosophical remainder. Then tell me whether the retroactive validation of successful revolutions is actually required by any of these views or is instead a pragmatic device for preserving legal continuity, and whether the simultaneous demand that officials disobey unlawful orders can be made consistent with the condemnation of private attempts on a ruler, or whether the practice is simply incoherent on this point. Finish with the counterfactual: if we replaced the implicit view with a Lockean right of revolution, or with the strict positivist account, what concretely would have to change in the practice — in the treason statutes, in the doctrines of retroactivity and recognition, in the oath of office, in how the courts treat the founding acts of a regime they have just recognized? I don't need citations or a reading list; reason from the structure of the positions, and give me a clear bottom line about which reading you think the practice actually commits to and how confident you are in that diagnosis.
reasoning: |-
  Okay, the user is a law student working on a seminar paper about the philosophy of political authority. They've noticed a pattern where failed rebellions are punished as treason, while successful ones are celebrated and legally validated. They want to understand what underlying theory of political authority this practice presupposes. 

  Hmm, this is a sophisticated question that cuts to the heart of political legitimacy. The user clearly knows their sources - they've referenced Aquinas, legal positivism, and Locke specifically. They're not looking for simple answers but want competing readings carefully laid out. Smart framing with that counterfactual question at the end too - asking what would change under different theories shows they're thinking structurally.

  The core paradox they're wrestling with is real: how can legal systems simultaneously condemn "rebellion" while celebrating "revolutions" that succeeded? And how does that square with requiring officials to disobey unlawful orders? That tension between authority and resistance runs deep in political philosophy.

  I should start by reconstructing the implicit view in state practice as precisely as possible. The pattern suggests success itself confers legitimacy retroactively - what Max Weber called the "routinization of charisma." The key move is that validation happens ex post facto only for winners. 

  For Aquinas, rebellion against true tyranny isn't sedition because tyranny isn't proper authority - but he'd still condemn private individuals leading revolts. That matches the practice of punishing failed attempts while allowing successful revolutions to be retroactively justified. The "common good" gets defined by the outcome.

  Legal positivism handles this through rules of recognition and retroactivity - it's just legal mechanics with no deeper meaning. But that doesn't explain why we celebrate revolutionary founders morally. 

  The oath of office point is tricky. Requiring officials to disobey unlawful orders while forbidding rebellion creates a zone where officials can resist specific acts but not the regime itself. That's actually consistent if we see authority as institutional rather than personal.

  Under Lockean theory, the practice would change dramatically - failed revolutionaries couldn't be tried for treason if their cause was just, and recognition wouldn't hinge on success. Positivism would make retroactive validation purely technical with no honor attached.

  Ultimately I think state practice shows a modified common-good view where success serves as proxy for legitimacy. It's messy but pragmatically necessary - no state can survive endorsing a right to overthrow it. My confidence in this reading is high because it explains both the legal mechanics and the moral valence attached to success.
answer: |-
  Your observation cuts to the heart of political legitimacy's paradox. The pattern you describe – condemning failed rebellions as treason while sanctifying successful ones – presupposes a **modified common-good theory of authority with a strong proceduralist constraint**, leaning on Aquinas while incorporating positivist mechanisms for stability. Let's reconstruct the implicit view step by step, testing it against your candidates.

  ### Core Presuppositions of the Practice
  1.  **Authority is Primarily for the Common Good:** The state implicitly accepts that legitimate authority exists to serve the common good (Aquinas's core principle). A regime perceived as brutal and corrupt (*tyrannus in regimine*) fails this fundamental test.
  2.  **Private Initiative is Prohibited, But Success Signals Public Acceptance:** While tyranny negates legitimacy *in principle*, Aquinas's profound fear of chaos and worse tyranny arising from private action (*Summa Theologiae* II-II, Q.42, A.2) is paramount. The practice presupposes that **only success can retrospectively demonstrate that the rebels acted as, or catalyzed the formation of, a genuinely *public* authority** – one capable of securing order and plausibly serving the common good. Failure confirms the dangers of private presumption.
  3.  **Effectiveness is a Necessary Condition for Recognition:** De facto control is not *sufficient* for legitimacy (the practice condemns successful but monstrous regimes eventually), but it is absolutely *necessary*. Without effective control establishing a new order, the question of its legitimacy is moot. Success demonstrates the capacity to function as an authority.
  4.  **Law is a System for Order, Needing Continuity:** Legal positivism provides the *mechanism* for managing the transition. Retroactive ratification isn't primarily a philosophical statement about the *original justice* of the acts, but a **pragmatic legal fiction essential for maintaining systemic continuity and avoiding a vacuum**. The "rules of recognition" shift to acknowledge the new sovereign, and its foundational acts are incorporated *as if* they were always valid within the new system it establishes. This avoids paralyzing the new state.
  5.  **The "Official Disobedience" Exception is Narrowly Construed:** The demand that soldiers/officials refuse *unlawful orders* operates *within* the existing constitutional order. It presupposes a functioning legal framework where "lawfulness" can be judged against higher norms (constitution, international law) *recognized by that system itself*. Crucially, **this is distinct from a judgment that the *regime itself* has lost legitimacy**, which remains forbidden to private individuals. The oath to the constitution, not the person, reinforces this internal legal order but doesn't authorize its overthrow by individuals; it mandates upholding the system's own rules against specific violations.

  ### Testing Against Candidate Theories
  *   **Purely De Facto/Effective Control:**
      *   **Fit:** Explains *why* success is crucial – no control, no authority to recognize. Explains foreign recognition based on stability.
      *   **Misfit:** Fails to explain *why* the *failed* rebels are condemned so harshly (if authority is purely de facto, their attempt was just an unsuccessful power grab, not inherently "treasonous"). Doesn't explain the *moral* sanctification of successful founders or the *content* of oaths demanding fidelity to law/constitution over persons. Makes condemnation of the failed rebels seem arbitrary, not principled.
      *   **Presupposed?** Effectiveness is presupposed as a *necessary condition*, but not as *sufficient* for full legitimacy. The practice implies more than mere control.

  *   **Common-Good Account (Aquinas Modified):**
      *   **Fit:** Best explains the *moral* core of the practice. Tyranny lacks true authority. Successful revolution is honored *because* it (retrospectively) removed tyranny and established a (presumably) common-good-serving order, vindicating the *principle*. Aquinas's fear of private action explains the condemnation of failure. The success requirement addresses his worry – the successful rebels *didn't* leave the people worse off; they created a new public authority.
      *   **Misfit:** Aquinas is ambiguous on *who* can remove a tyrant, strongly favoring established procedures or superior authority. Pure Aquinas struggles with how *successful private initiative* becomes legitimate *public authority* ex post facto. The practice relies on positivist mechanisms (retroactive laws, recognition doctrines) Aquinas wouldn't recognize as conferring legitimacy.
      *   **Presupposed?** **Yes, as the core *justificatory* principle.** The state implicitly accepts that legitimacy hinges on the common good. Tyranny forfeits authority. But the practice *modifies* Aquinas by making *successful establishment of order* the practical indicator that a *new public authority* (acting for the common good) has emerged, replacing the tyrant. Success becomes the proxy for overcoming the "private presumption" hurdle.

  *   **Strict Legal Positivism:**
      *   **Fit:** Perfectly explains the legal *mechanics*: a new rule of recognition emerges (acceptance of the new regime by officials/courts, domestically and internationally). Validity is determined internally by the new system's rules. Retroactive ratification is standard legal technique ("we are the state now; our founding acts are foundational law"). Explains legal continuity.
      *   **Misfit:** Fails utterly to explain the *moral valence* – why condemn the failed rebels harshly as traitors (morally loaded) if their acts were just legally invalid under the old rules? Why honor the successful ones as heroes? Why have oaths to constitutions demanding disobedience to unlawful orders? Positivism, strictly speaking, has no room for "illegitimate regimes" or the common good as a validity condition outside the system's own rules. It struggles to explain *why* recognition is granted or withheld beyond effectiveness/stability.
      *   **Presupposed?** **Yes, as the *operational framework* for managing transitions and maintaining legal order.** It provides the tools (rules of recognition, retroactivity) but not the underlying *reason* for condemning failure or honoring success beyond system stability.

  ### Retroactive Validation: Required or Pragmatic?
  Retroactive validation is **pragmatic within the implicit common-good/positivist hybrid.** It's *not strictly required* by:
  *   **Pure De Facto:** Only effective control matters; past acts could simply be ignored or prospectively authorized.
  *   **Pure Aquinas:** Legitimacy stems from justice/common good; if the revolution was just, its acts were morally valid when done, regardless of later legal ratification. A truly Thomist state might *affirm* their justice, not merely *ratify* them as legal acts.
  *   **Pure Positivism:** A new system can start anew; retroactivity is convenient but not essential.

  **Why it's done pragmatically:** It prevents chaos (validating essential acts done during the transition), avoids mass prosecutions for acts later deemed necessary, legitimizes the new order by showing it "owns" its founding, and crucially, **preserves the *appearance* of legal continuity.** This continuity is vital for public order, property rights, contractual obligations, and international relations. It papers over the revolutionary rupture with a veneer of legality.

  ### Consistency of Disobedience vs. Condemnation of Rebellion
  The practice is **strained but not incoherent** on this point, relying on a **jurisdictional distinction:**
  1.  **Intra-Systemic Disobedience:** Refusing *unlawful orders* is an act *within* the existing constitutional order. The official judges an order against the system's *own* higher norms (constitution, statute). This is framed as *upholding* the law/authority, not undermining it. The system provides (or claims to provide) channels for this (courts, internal review).
  2.  **Extra-Systemic Rebellion:** Attempting to overthrow the *regime itself* is an act *outside* and *against* the constitutional order. It rejects the system's ultimate authority and claims a private right to judge the regime's fundamental legitimacy. This is what the treason statutes target.
      *   **The Strain:** The line blurs when the "unlawful order" stems directly from systemic corruption/tyranny, or when the constitution offers no remedy. The practice implicitly assumes the system is *fundamentally* legitimate (common-good serving) enough for intra-systemic remedies to be the only permissible path, however difficult. Successfully overthrowing the system proves ex post facto that this assumption was false *and* that the rebels transcended "private" status.

  ### Counterfactuals: Changing the Implicit View
  *   **Replacing with Lockean Right of Revolution:**
      *   **Treason Statutes:** Would be radically narrowed or abolished. Treason could only apply to betraying a *just* government. Attempting to overthrow a "long train of abuses" (Locke) could not be treason by definition.
      *   **Retroactivity/Recognition:** Retroactive validation would be unnecessary. Courts of the *new* order would simply declare the *old* regime illegitimate *ab initio* (as Locke argues). Its acts would be void, not ratified. Founding acts would be valid *when done* based on natural right. Foreign recognition would hinge on the justice of the cause, not just stability/success.
      *   **Oath of Office:** Would explicitly incorporate a clause permitting (or even demanding) resistance/revolution against tyranny, turning the "disobedience" principle outward against the regime itself.
      *   **Treatment of Founders:** Failed rebels with a just cause would be seen as martyrs, not traitors. Courts might actively void convictions post-regime-change based on the old regime's illegitimacy.

  *   **Replacing with Strict Positivism:**
      *   **Treason Statutes:** Unchanged in form, but their moral condemnation evaporates. Treason is purely a breach of the current system's rules, akin to a severe crime. Failed rebels are just criminals who lost.
      *   **Retroactivity/Recognition:** Retroactive validation remains common purely as a legal technique for continuity. "Recognition" is a factual assessment of control/stability, devoid of moral approval. Founding acts are valid only *after* the new rule of recognition is established.
      *   **Oath of Office:** Might become an oath purely to "the law" or "the state apparatus" as defined by current rules, devoid of reference to constitutions or common good. Disobedience would be permitted only if explicitly authorized by the system's rules.
      *   **Treatment of Founders:** Successful rebels are merely the *efficient cause* of a new legal system. They might be honored pragmatically, but not as moral heroes. Their pre-recognition acts lack legal validity until ratified. Courts would treat founding acts neutrally, as the source of the new system's validity, with no implication about their original justice.

  ### Bottom Line
  **The practice most strongly presupposes a Modified Thomist Common-Good Theory (approx. 80% confidence).** Legitimacy fundamentally resides in serving the common good. Tyranny forfeits authority. However, Aquinas's profound caution about private action and the dangers of anarchy are paramount. **Success in revolution is treated as the *de facto* demonstration that the actors transcended "private" status and established a *new public authority* capable of securing the common good.** This success retroactively justifies their act *as* a public act, not private rebellion.

  **Legal positivism provides the essential *operational framework* (rules of recognition, retroactivity) to manage the transition pragmatically, ensuring continuity and order.** The de facto element (effectiveness) is a necessary precondition for this process to even begin.

  The "disobedience vs. rebellion" tension arises from the jurisdictional boundary the practice tries to maintain: officials can act *within* the system to correct specific injustices (upholding its *own* principles), but only the *outcome* of a successful revolution can retrospectively prove the system itself was fundamentally illegitimate and justify its overthrow. It's a precarious but practically necessary distinction for any state that wishes to survive while paying lip service to higher principles. The strain reflects the inherent difficulty of reconciling authority with resistance in an imperfect world.
