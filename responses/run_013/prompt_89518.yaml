prompt: |-
  Two friends of mine, both committed utilitarians, got into an argument last week about whether their own theory can guide them at all. It started over a donation — one had given a modest sum to a deworming charity, the other said the money would have done more good spent on a bicycle — and it escalated.

  The first said: it doesn't matter which of you is right, because the consequences of any act run on forever. Whether buying the bicycle sets off a chain ending in a famine or in a cure for aging, nobody can know; so 'perform the act with the best consequences' is not a rule anyone can follow, and a standard no one can apply is no standard.

  The second said that confuses certainty with evidence: we maximize expected value, not guaranteed value, and the fact that we can't see the end of the causal chain just means we work with our best estimates, as we do everywhere. The first replied that expected value needs probabilities and there are none here — nobody can put numbers on the far future — and that once you allow even a tiny chance of an astronomically large outcome, the arithmetic is captured by whatever speculation you feed it, so you get either paralysis or whatever answer you were after.

  The second then said: this proves too much. If uncertainty about distant consequences disqualified a standard of action, it would disqualify every standard — prudence, ordinary kindness, the golden rule — since all of them are supposed to be sensitive to how things turn out. Since that's absurd, the objection must go wrong somewhere. The first answered that the real lesson is that consequentialism is a criterion of rightness, not a decision procedure: it tells you which act was right once everything is known, not which act to perform now.

  I can't referee this and it's affecting a real decision. Please adjudicate move by move — which claims are right, which are wrong, and what both of them are missing — and then say whether uncertainty about the far future really does undercut consequentialism as a guide to action.
reasoning: |-
  Okay, let me start by unpacking this problem. Two utilitarians are arguing about whether their theory can guide actions given uncertainty about the future. The first friend donated to a deworming charity, while the second argued the money would be better spent on a bicycle. Their debate spiraled into whether consequentialism is practical when consequences extend infinitely into an unpredictable future.

  First, I need to break down each move. The first friend's initial point is that infinite causal chains make predicting consequences impossible, so "act with the best consequences" becomes an unworkable standard. That's a common epistemic challenge for utilitarianism. The second friend counters that we use expected value based on probabilities, just like in other decisions. But the first friend pushes back, saying we can't assign probabilities to distant outcomes, leading to paralysis or arbitrariness.

  The second friend then argues this would undermine all decision standards, not just consequentialism. The first responds that consequentialism is a criterion of rightness, not a decision procedure. 

  Hmm. The core issue seems to be: can utilitarianism function under deep uncertainty? I recall debates about "cluelessness" in philosophy—the idea that we can't predict long-term effects. The first friend is essentially describing this problem. But the second friend's point about expected value is also valid; we make probabilistic judgments all the time. 

  Where it gets tricky is assigning probabilities to "astronomically large outcomes." Like, a tiny chance of a massive impact could dominate calculations. This resembles Pascal's Wager problems. Utilitarians like William MacAskill have addressed this with concepts like "fanaticism" versus practical heuristics. 

  The second friend's "proves too much" argument is strong. If uncertainty invalidated consequentialism, it would invalidate all action-guiding norms. That suggests the first friend's position might be too skeptical. But the criterion/procedure distinction is important too—consequentialism defines rightness by outcomes but doesn't prescribe how to decide in the moment. 

  For the donation example, evidence-backed interventions (like deworming) likely have more predictable near-term benefits than a bicycle. The bicycle's long-term ripple effects are too speculative to outweigh known benefits. So in practice, expected value still works with reasonable probability estimates. 

  Ultimately, consequentialism isn't "undercut" but requires pragmatic tools: focusing on tractable impacts, using evidence, and accepting uncertainty. The friends probably need common ground—both care about doing good but are stuck on theoretical extremes. Advising them to prioritize known, measurable impacts might resolve their real decision.
answer: |-
  Here's a move-by-move adjudication of the argument, followed by a resolution of the core question:

  ### Move-by-Move Adjudication
  1. **First Friend (Donated to Deworming Charity):**  
     *Claim:* Infinite causal chains make *actual* consequences unknowable, so "maximize good consequences" is impossible to apply.  
     **Verdict: Partially right, but incomplete.**  
     - **Right:** Consequences *do* ripple infinitely, and we cannot predict the *total* causal impact of any act with certainty.  
     - **Wrong:** Conflates "unknowable total consequences" with "no actionable evidence." Consequentialism doesn’t require omniscience to function.  

  2. **Second Friend (Advocated for Bicycle):**  
     *Claim:* We maximize *expected* value using probabilities and evidence, even under uncertainty.  
     **Verdict: Largely right.**  
     - **Right:** Decision-making under uncertainty is central to utilitarianism (and life). We constantly use probabilistic reasoning (e.g., medical treatments, investments).  
     - **Missing:** Acknowledges but understates the *unique problem of long-term unpredictability*.  

  3. **First Friend’s Rebuttal:**  
     *Claim:* Probabilities for distant outcomes are arbitrary; tiny chances of astronomical outcomes dominate calculations, leading to paralysis or bias.  
     **Verdict: Right about the risk, wrong to dismiss expected value.**  
     - **Right:** "Pascal’s Mugging" (where tiny probabilities of huge payoffs distort decisions) is a real problem in utilitarianism. Assigning probabilities to speculative far-future events *is* highly subjective.  
     - **Wrong:** This doesn’t invalidate expected value—it shows we need *reasonable constraints* on probability assignments (e.g., ignoring outcomes with no evidence).  

  4. **Second Friend’s "Proves Too Much" Argument:**  
     *Claim:* If uncertainty disqualified consequentialism, it would also disqualify prudence, kindness, etc.  
     **Verdict: Correct and decisive.**  
     - **Right:** *All* practical ethics (even deontology or virtue ethics) implicitly rely on expected outcomes. Prudence requires estimating future risks; kindness considers likely effects on others. Rejecting expected value would make *all* rational action impossible.  

  5. **First Friend’s Final Claim:**  
     *Claim:* Consequentialism is only a "criterion of rightness" (retrospective), not a "decision procedure."  
     **Verdict: Partially right but a false dichotomy.**  
     - **Right:** Consequentialism *does* define rightness by actual outcomes. We can never be certain we chose rightly.  
     - **Wrong:** This doesn’t mean consequentialism can’t guide action. We use *proxies* for actual consequences (e.g., evidence, probabilities) to make real-time decisions.  

  ### What Both Are Missing
  - **First Friend:** Ignores that ethics must operate under uncertainty. Demanding infinite certainty is a category error.  
  - **Second Friend:** Underestimates how speculative far-future impacts can warp decisions without disciplined probability assignments.  
  - **Both:** Neglect the utilitarian toolbox for managing uncertainty:  
    - **Bounded Rationality:** Focus on tractable, foreseeable consequences (e.g., 10–100 years).  
    - **Robust Heuristics:** Prioritize actions with high *predictable* benefits (e.g., evidence-backed charities).  
    - **Avoiding Fanaticism:** Discard negligibly probable outcomes without empirical grounding.  

  ### Does Uncertainty Undercut Consequentialism as a Guide?  
  **No, but it refines its application.**  
  1. **Consequentialism remains actionable** through expected value calculations based on *available evidence*.  
  2. **Long-term uncertainty is mitigated by:**  
     - **Comparative Certainty:** Some acts (e.g., curing disease) have more predictable benefits than others (e.g., buying a bicycle for vague gains).  
     - **Margin of Safety:** Prioritize acts with robust near-term benefits (e.g., deworming prevents immediate suffering) over speculative long chains.  
     - **Systemic Effects:** Favor actions that improve general welfare (e.g., health, education) known to correlate with positive long-term outcomes.  

  ### Practical Resolution for the Real Decision
  - **Deworming vs. Bicycle:** Deworming has strong evidence of high expected value (e.g., proven health/economic benefits via groups like GiveWell). The bicycle’s benefits are speculative and indirect.  
  - **Guidance:** In cases like this, utilitarianism clearly favors interventions with **evidence-backed, predictable impacts**. Ignoring measurable near-term good for unquantifiable distant outcomes is not rational—it’s a derailment of practical ethics.  

  **Conclusion:** Uncertainty about the far future is a challenge but not a defeater. Consequentialism guides action by demanding we act on our *best evidence*—not on fantasies of infinite chains. The first friend’s skepticism, while philosophically interesting, risks paralysis; the second friend’s pragmatism aligns with how utilitarianism functions in the real world. For their decision, donate where evidence is strongest.
