prompt: |-
  I have no formal training in biology, just a few years of reading on my own, and I've gotten absorbed in the long-running dispute over what natural selection is actually acting on — the gene, the individual creature, or the group. I can follow the moves well enough now, but what I really want is a joke about it. Not the kind of joke where the only thing biology contributes is the vocabulary; I want one whose punchline turns on the substance of the disagreement, so that it is funny to someone who genuinely understands the debate and merely puzzling to someone who doesn't.

  Let me say what I find funny in it, so you can aim at that. What keeps striking me is how the same act can be two entirely different things depending on which level you look from: what looks like pure self-sacrifice in one frame comes out as straightforward self-interest in another, and sometimes the reverse. I'd like the joke to turn on exactly that flip. The setup I keep returning to — and would like you to build on — is two copies of the same gene riding around in two different bodies, where at one level of description they are the same thing and at another they are total strangers with opposed interests, and one of them is in trouble. The comedy, I think, lives in each party honestly reporting what the situation looks like from where it sits, each convinced the other is either a saint or a swindler, and each being right about the level it can actually see.

  One thing to avoid: please don't get the laugh by turning a gene into a little conscious schemer who wants things the way a person wants things. The version I find funniest, and truest, is the one where the confusion is entirely about what counts as a favor, a cost, or a selfish act — not about whether molecules have plans. I'd rather the joke be one a biologist would wince at for being too accurate than one they'd wince at for being too cute.

  Begin with the joke itself, no preface or commentary.
reasoning: |-
  Okay, the user wants a biology joke about the levels of selection debate—gene vs. individual vs. group. They specified that the humor should come from the perspective shift where an act appears altruistic at one level but selfish at another. They mentioned two copies of the same gene in different bodies as the setup. 

  First, I need to ensure the joke avoids anthropomorphizing genes. No "scheming" genes—just the inherent conflict of interest based on perspective. The user emphasized accuracy over cuteness, so the biology must be precise. 

  The core idea: two gene copies (alleles) in different organisms. One allele causes its bearer to sacrifice for a relative (kin selection). From the individual’s view, it’s altruism; from the gene’s view, it’s selfish because it aids a copy of itself. 

  Setting: a vole helping its sibling escape a predator. The helping vole’s allele says, "You’re welcome!"—acting like it did a favor. The other allele (in the sibling) replies it wasn’t altruism because they share the same gene sequence. Punchline hinges on "selfish" meaning gene-level self-interest, not individual greed. 

  Key checks: 
  - No consciousness: genes "discussing" is metaphorical, just representing the logic. 
  - Flip in framing: one sees sacrifice, the other sees genetic self-preservation. 
  - Biologist-approved: kin selection and Hamilton’s rule are solid ground. 

  User’s deeper need: They want intellectual humor that validates their understanding. The joke is a reward for grasping the debate’s nuance. Avoiding trivialization is crucial—they’d reject anything reductive. 

  Structure: 
  Setup (action): Vole saves sibling. 
  First line (helper allele): Claims generosity. 
  Second line (recipient allele): Reveals gene’s-eye view selfishness. 
  Punchline: "Selfish" as a genetic term, exposing the levels-of-selection irony. 

  Testing the humor: A biologist laughs because the alleles’ "dialogue" mirrors academic arguments. A layperson might miss why "selfish" is funny—perfect, as requested.
answer: |-
  Two alleles of *avpr1a* sit in sibling voles. One’s bearer drowns diverting a stoat from the other.  

  **Helper Allele:** "You owe me — I just erased my future for yours!"  
  **Recipient Allele:** "Nonsense. You *copied yourself* into tomorrow. Selfish."  

  **Helper Allele:** "I sacrificed *everything*!"  
  **Recipient Allele:** "You traded a body for *me*. Your sequence lives. What’s selfish is calling it charity."
