  Okay, the user has presented a complex philosophical dilemma stemming from a political argument with a friend. They want me to role-play as a philosopher specializing in moral psychology and metaethics to audit their friend's argument. 

  First, I need to reconstruct the friend's argument clearly. The core seems to be: 1) Moral judgments come from innate foundations (Haidt's theory), 2) Reasoning is post-hoc justification, 3) Therefore moral positions aren't rationally chosen, 4) So there's no objective truth in moral disputes. The user's main concern is whether this psychological explanation actually proves moral relativism.

  Hmm... several philosophical issues jump out immediately. The genetic fallacy is relevant here - explaining origins doesn't determine validity. Also, the friend's own recommendation ("we should live together") seems to contradict her argument by being a moral claim itself. Interesting how she doesn't apply her skepticism to this conclusion.

  I should note where the psychology is contested. Haidt's model has critics - the post-hoc reasoning claim is particularly disputed. Some studies show reasoning can precede judgment. The innateness of foundations is also debated; plasticity matters here. The user's question about cultivating foundations touches on this - if they're malleable, why can't we change them rationally?

  The user's deeper concern seems to be about moral truth's possibility. They're worried that if psychology explains all moral differences, objectivity collapses. But metaethics offers alternatives: maybe moral facts exist independently of psychology, or emerge from rational discourse. The friend's position is essentially moral anti-realism, but she states it as proven fact when it's philosophically contested.

  I should emphasize the key confusion: conflating causal origins with epistemic justification. Even if intuitions come first, we can still evaluate them. The cilantro analogy fails because taste is subjective while morality claims objectivity. 

  The user seems philosophically sophisticated despite claiming no training. Their question about whether empirical discoveries could ever settle moral truth is particularly sharp. I'll need to explain how psychology constrains but doesn't eliminate metaethical possibilities.

  Most importantly, I must avoid false neutrality. The friend overstates what psychology proves. Her "no fact of the matter" conclusion isn't mandated by the science but reflects her metaethical stance. The user shouldn't concede this point.

  For structure: first reconstruct the argument formally, then flag disputed psychological claims, then dissect the philosophical errors, finally address the user's specific questions about cultivating foundations and the friend's contradictory recommendation. Should end by affirming that psychology informs but doesn't resolve metaethics.
answer: |-
  Let's audit this argument systematically. I'll reconstruct it formally, assess the psychology, identify philosophical errors, and address your specific questions—with special attention to the inference from descriptive psychology to metaethical conclusions.

  ### Reconstructed Argument (Premise-Conclusion Form)
  1. **Empirical Premise**: Moral judgments are outputs of innate, evolutionarily shaped psychological foundations (care, fairness, loyalty, authority, sanctity, etc.), culturally tuned.  
  2. **Epistemic Premise**: Moral reasoning is primarily *post hoc* justification for intuitive judgments.  
  3. **Causal Premise**: Therefore, moral convictions are *caused* by foundations (not by reasoning).  
  4. **Non-Volition Premise**: Foundations are fixed by evolution/upbringing; no one chooses their moral outlook.  
  5. **Relativist Conclusion**: There is no fact of the matter about moral/political disagreements (e.g., liberal vs. conservative).  
  6. **Pragmatic Corollary**: The only sensible questions are strategic: coexistence and whether foundations can be cultivated.  

  Your friend infers **5** and **6** from **1–4**. The critical inference is from descriptive claims (**1–4**) to the anti-realist metaethical claim (**5**).  

  ---

  ### Audit of the Psychology  
  I’ll mark claims as:  
  ✅ **Settled** (robust consensus)  
  ⚠️ **Contested** (active debate)  
  ❓ **Extrapolation** (her addition)  

  - **1a: Foundations are innate/evolutionary**  
    ⚠️ Contested. Haidt’s "innateness" claim is disputed (e.g., Curry et al., 2019 argue foundations are cultural solutions, not genetic modules). Plasticity evidence shows foundations shift with experience.  
  - **1b: Culture "tunes" foundations**  
    ✅ Settled. Cross-cultural variance is well-documented.  
  - **2: Moral reasoning is *primarily* post hoc**  
    ⚠️ Contested. Haidt overstates this; dual-process models (e.g., Greene) show reasoning *can* override intuitions. "Primarily" ≠ "always."  
  - **3: Convictions are *caused* by foundations (not reasons)**  
    ❓ Extrapolation. While intuitions *influence* judgments, causes are multivariate (e.g., narrative exposure, logical consistency).  
  - **4: Foundations are *fixed* (no choice/volition)**  
    ❓ Extrapolation. Foundations are *stable* but not immutable (therapy, education, trauma alter them).  

  **Key Misstatement**: Your friend treats foundations as rigid "innate modules." Haidt describes them as *prepared learning mechanisms*—biases, not destiny. Cultivation (**6**) is empirically plausible (e.g., meditation expanding care foundations).  

  ---

  ### Philosophical Errors in the Inference  
  The leap from **1–4** to **5** commits two critical fallacies:  

  1. **The Genetic Fallacy**  
     - Mistaking the *origin* of a belief for its *justification*.  
     - Example: "Math beliefs come from evolved pattern-recognition; therefore, 2+2=4 isn’t objectively true."  
     - **Why it fails**: Even if moral intuitions arise from foundations, that doesn’t tell us whether they *track moral truth*. Evolutionary origins don’t preclude objectivity (e.g., pain-aversion aids survival *and* tracks objective harm).  

  2. **Confusing Explanation with Elimination**  
     - Assuming that explaining *how* we judge morality implies there’s *nothing to judge*.  
     - **Why it fails**: Science explains how we perceive color, but doesn’t eliminate color realism. Similarly, moral psychology describes mechanisms, not metaethics.  

  **Your nagging thought is correct**: A complete psychological explanation of moral judgment does *not* entail that "no side is right." It leaves room for:  
  - Moral realism (facts exist independently of foundations),  
  - Constructivism (facts emerge from rational discourse),  
  - Or anti-realism (no facts). Psychology alone can’t decide this.  

  ---

  ### Addressing Your Specific Questions  

  #### 1. *"If foundations are innate, is cultivating them coherent?"*  
  - **Yes**. Innate ≠ immutable. Foundations are *predispositions*, not fixed traits. Example:  
    - You can cultivate loyalty through community engagement (strengthening neural pathways).  
    - This is like improving eyesight with lenses—not changing biology, but modulating its expression.  
  - **Contradiction in her view**: If foundations *can* be cultivated (**6**), then they aren’t "fixed" (**4**), undermining the inference to **5**.  

  #### 2. *"What empirical discovery could bear on who is right?"*  
  Only discoveries that **link foundations to truth-tracking**:  
  - If all moral foundations were shown to be *equally unreliable* (e.g., all produce inconsistent judgments under reflection), anti-realism gains ground.  
  - If some foundations *systematically correlate* with human flourishing (e.g., care foundations reducing suffering), realism gains ground.  
  - **Current status**: No such discovery exists. Moral psychology is descriptive, not normative.  

  #### 3. *"Does her recommendation escape her own argument?"*  
  **No**. Her call for tolerance ("live together") is a moral judgment posing as pragmatism. It likely stems from:  
  - **Care foundation** (preventing relational harm),  
  - **Fairness foundation** (mutual respect),  
  - Or **pragmatic inconsistency**: She exempts *her* view from the skepticism she applies to yours.  

  ---

  ### The Core Confusion  
  **The Is-Ought Gap (Hume’s Guillotine)**: No description of *how things are* (e.g., "foundations cause judgments") entails *how things ought to be* (e.g., "therefore no one is right"). Your friend’s argument slides from "is" to "isn’t" (no fact of the matter) without justification.  

  **What you conceded**: That moral psychology *resolves* metaethics. It doesn’t. It constrains it (e.g., if reasoning were *always* post hoc, realism would be harder to defend), but gaps remain.  

  **Verdict**: The inference from **1–4** to **5** is invalid. Psychology explains mechanisms; it doesn’t eliminate moral truth. Her closing recommendation (**6**) is either self-refuting (if moral) or question-begging (if "strategic").  

  ### What to Say Next  
  > "The science shows why we disagree, but not that disagreement is unresolvable. If our foundations are malleable, we *can* reason together—not just to coexist, but to seek better answers. Your call for tolerance assumes *that’s* right. Why is *this* moral claim exempt from your own critique?"  

  This returns focus to the metaethical question she sidestepped. If psychology settled everything, her pragmatism wouldn’t need moral weight.
