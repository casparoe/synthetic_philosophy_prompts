prompt: |-
  I run a small 300-level seminar called Rationality and Practical Reason — 16 students, once a week, 75 minutes — and I want to spend a whole session on Kavka's toxin puzzle, which I'm fairly sure none of them have seen. I dont want to just put the payoff matrix on the board and lecture; I want them to be inside something like the situation before I tell them there's a puzzle at all. Here's the rough shape, and I'd like you to turn it into something actually runnable. At the very start, before any framing, I offer anyone in the room a small reward — a candy, or a chip they can trade for coffee, nothing that needs real money — if they now sincerely intend to drink a shot of watered-down vinegar at the very end of the session. The reward is paid immediately and unconditionally, and the slip they sign says only that they intend to drink it; it says nothing about actually drinking. The catch I want to build in: before they sign, a student volunteer who knows the class well writes down, for each person, whether they predict that person will actually drink at the end, and earns a little bonus for each correct prediction. So the reliable-predictor assumption from the original isn't me claiming I can read minds — it's a real classmate making real, incentivized bets about what their friends will do. Then we run the rest of the session (some other discussion, doesn't matter what), and at the end anyone who signed is handed the vinegar and gets to decide.

  What I want the group to run into: the people who signed and then don't drink will feel like they got something for nothing, and I want that feeling to curdle once they see how accurately the predictor called it — if the predictor knew they'd drink, their "intention" was doing work; if the predictor knew they wouldn't, it's much less clear they ever intended anything. I'd also like a variant you can fold in or run as a second round, where the reward is only paid if the predictor, knowing them, says they're the type who'll go through with it — which is closer to Kavka's actual setup and makes the whole can-you-intend-to-do-what-you're-sure-you-wont-do problem bite harder.

  Please give me: the rules and materials, a rough timeline for the 75 minutes, the exact wording of the slip, how to run the predictor's role so it stays honest rather than becoming a gag, the debrief that maps each moment onto the pieces of the puzzle (intention vs. action, a reward for a mental state rather than a deed, why rational-to-intend-now and rational-not-to-drink-later seem to sit side by side, and what it would even take to bind yourself), and an honest note on what predictably goes wrong the first time I run it — I'm especially worried everyone will just coordinate to sign and then not drink, which I think would kill the puzzle, and I can't decide whether to lean into that or design around it. Also tell me frankly which part of the original puzzle this setup can't reproduce; my guess is that a class isn't a one-shot anonymous encounter and the stakes are trivial, but you'll probably see things I'm missing.
reasoning: |-
  We are going to design a classroom activity for Kavka's toxin puzzle. The goal is to have students experience the puzzle from the inside before introducing the formal structure.

  The core setup:
  - At the start of class, offer a small reward (e.g., a piece of candy or a coffee chip) to any student who *now sincerely intends* to drink a shot of watered-down vinegar at the end of the session.
  - The reward is paid immediately upon signing a slip that only attests to their current intention. They do not commit to drinking.
  - Before they sign, a student predictor (who knows the class well) writes down, for each student, a prediction of whether they will actually drink the vinegar at the end. The predictor gets a small bonus for each correct prediction.
  - Then the class proceeds with other activities.
  - At the end, each student who signed is handed the vinegar and decides whether to drink or not.

  We also want a variant where the reward is conditional on the predictor's assessment: the student gets the reward only if the predictor, knowing them, says they are the type who will go through with it.

  Let's break down the plan:

  1. **Materials:**
     - Small rewards (e.g., candy or coffee chips) for the intention and for the predictor's correct predictions.
     - Shot glasses with watered-down vinegar (diluted enough to be safe and unpleasant but not harmful).
     - Slips of paper for the intention statement and for the predictor's predictions.
     - A way to record predictions (e.g., a form for the predictor to fill out for each student).

  2. **Timeline for 75-minute session:**
     - 0-10 min: Introduction and setup of the activity (without revealing the puzzle).
     - 10-20 min: Prediction and signing phase.
     - 20-60 min: Regular class content (could be a discussion on rationality or practical reason, unrelated to the puzzle).
     - 60-70 min: Vinegar decision time.
     - 70-75 min: Initial reactions and transition to debrief (full debrief might spill over to next session or be extended if time allows, but we'll aim for 10-15 min of debrief in the last 5 minutes and then continue if needed).

     Actually, we have to be more precise. We might need more time for the setup and the drinking phase.

     Revised timeline:
     - 0-5 min: Introduction and framing (without giving away the puzzle). Explain that we are doing an activity about decision-making and that there will be a small reward opportunity.
     - 5-15 min: Predictor phase. Select a predictor. The predictor writes down predictions for each student (whether they will drink if they sign up). Then, we open the sign-up: any student can come and sign the slip to get the reward. The predictor must complete predictions before anyone signs? Or after? We want the predictor to have the same information as in the puzzle: knowing the student's type. So ideally, the predictor should know the student and then write the prediction without knowing whether the student will sign. But note: the predictor is predicting for each student whether they will drink at the end *if they sign up*. But we don't know who will sign up. So we have two options:

       Option A: The predictor predicts for every student in the class (even if they don't end up signing). Then the predictor gets a bonus for each student who signs and then does as predicted? But that complicates the payment. Alternatively, we can have the predictor predict for each student: "If [student] signs, will they drink?" and then the predictor gets a bonus for each student who does sign and then either (a) the predictor said "yes" and they drink, or (b) the predictor said "no" and they don't drink. For students who don't sign, we ignore.

       Option B: We have the predictor predict after the sign-up? But then the predictor knows who signed and might adjust. That breaks the reliability.

     We want the predictor to be reliable in the same way as in the puzzle: the predictor knows the student well enough to know what they will do. So we should have the predictor predict for every student, regardless of whether they sign. Then, for those who sign, we check the prediction and the outcome.

     How to do it:

     Steps:
     - Select a predictor (a student volunteer). Explain to the predictor: "You will write down for each of your classmates whether you think they would drink the vinegar at the end of class if they were to sign up for the reward. You are not predicting who will sign up, only what they would do if they did sign. You will get a small reward for each correct prediction for the students who do sign up."

     - The predictor leaves the room? Or we give them a form and they write privately? We don't want the predictor to be influenced by the signing. So we can have the predictor write predictions for every student in the class (on a list) without knowing who will sign. Then the predictor turns in the predictions.

     - Then we open the sign-up: each student can choose to sign a slip to get the reward. They get the reward immediately.

     - After class, we check the predictor's predictions for the students who signed. For each signed student, if the predictor correctly predicted whether they drank or not, the predictor gets a bonus.

  3. **The Slip:**
     - Wording: "I, [student's name], sincerely intend at this moment to drink a shot of watered-down vinegar at the end of today's class session. I understand that I am not obligated to drink it, and I will be free to choose at that time. I am receiving a small reward solely for my current intention."

  4. **Predictor's Role:**
     - Choose a student who is well-known in the class and whom you trust to take it seriously. Emphasize that this is a real prediction task and that they should base it on their knowledge of their classmates. Also, the predictor must not discuss predictions with others until after the activity.
     - To keep it honest, you can have the predictor write the predictions on a sheet that lists all students. Then the sheet is sealed (or handed to the instructor) until the end.

  5. **Variant (Conditional Reward):**
     - We can run this as a second round? But we only have one session. Alternatively, we can run two separate groups? Or we can do it as a thought experiment in the debrief? Or if time allows, we can run the activity again with the new rule.

     How about:

     After the first round (and after the drinking decision), we reveal the predictor's predictions and pay the predictor. Then we discuss briefly. Then we say: "Now, let's try a slightly different version. This time, the reward is conditional: you will get the reward only if the predictor (a different predictor? or same?) predicts that you are the type who would drink. We will have a new predictor, and they will write their predictions for each of you. Then, if the predictor predicts that you would drink (if you signed), then if you sign, you get the reward. But note: you still have to sign and state your intention. And at the end, you decide whether to drink. The predictor gets a bonus for correct predictions as before."

     But note: in this variant, the reward is paid only to those who sign and for whom the predictor said "yes, they would drink". And then at the end, they choose to drink or not. The predictor gets a bonus for being correct about the drinking.

     However, we have limited time. So maybe we run the first version and then discuss the variant as a thought experiment in the debrief.

  6. **Debrief:**
     - Start by asking students how they felt during the activity.
     - Ask those who signed and then didn't drink: How did it feel to get the reward without having to drink? Then reveal the predictor's predictions: for each student who signed, what the predictor said. Then ask: if the predictor correctly predicted that you wouldn't drink, then what does that say about your intention? Did you really intend to drink at the time you signed? Or did you just say you did to get the reward? How can you form an intention to do something that you know (or the predictor knows) you won't do?
     - Map to the puzzle:
          - The reward is for a mental state (intention) and not for the action.
          - It seems rational to form the intention now to get the reward, but when the time comes, it's rational not to drink (since there's no additional reward and it's unpleasant).
          - However, if the predictor is reliable, then if you were going to drink, the predictor would have predicted that and you would have gotten the reward. But if you don't drink, the predictor would have predicted that, and then ... wait, in the first version, you get the reward regardless. So the problem is: can you form the intention when you know that you won't follow through? And if the predictor is reliable, then they know you won't follow through, so you can't form the intention? But that leads to a contradiction.

     - In the variant (conditional reward): the reward is only given if the predictor says you are the type who would drink. Then, if you are rational, you know that you won't drink (because there's no reason to). So the predictor will predict that you won't drink, so you won't get the reward even if you sign. Therefore, you cannot get the reward. But if you could form the intention and then drink, you would get the reward. But you cannot force yourself to drink because at the time of drinking, you have no reason. This is the core of the puzzle.

  7. **Potential Problems:**
     - **Coordination:** Students might collude to all sign and then not drink. This would make the predictor's job harder, but if the predictor is good, they might predict that no one will drink? Then the predictor gets all the "no" predictions correct. And then each student who signed and didn't drink gets the reward. But then we can ask: did they really intend to drink? The predictor said they wouldn't, and they didn't. So perhaps they never intended? And if they admit that, then they didn't satisfy the condition for the reward? But the reward was given for signing the slip, which stated they intended. So we have a problem of lying? 

       How to handle: The slip requires "sincere" intention. So if a student signs without the intention, they are being dishonest. We can emphasize that the activity only works if they are honest. But we cannot force honesty. We can say: "Please only sign if you are being sincere. The purpose of the activity is to explore the rationality of intention, and it only works if we are truthful."

       However, if they all collude, the puzzle might not bite. To design around it: we can stress the importance of individual decision-making and that they should not discuss their plans. Also, the predictor is making individual predictions. 

       Alternatively, we can run it without worrying about collusion and then in the debrief, discuss what happened and why they colluded and how that affects the puzzle.

     - **Stakes are low:** The vinegar is unpleasant but not too bad. The reward is small. So students might drink just for fun or to prove a point? Or they might not take it seriously. We can try to make the vinegar a bit more unpleasant (but safe) and the reward a bit more desirable (e.g., a nice chocolate or a coffee voucher).

     - **Predictor's accuracy:** The predictor might not be very accurate. We can choose a well-known student and stress the incentive. But if the predictor is wrong a lot, then the puzzle doesn't come through. We can also use multiple predictors? Or average? But that complicates. Alternatively, in the debrief, we can discuss the assumption of a reliable predictor and how the puzzle changes if the predictor is fallible.

     - **Time:** We might run out of time. The signing and the drinking might take longer than expected. We need to keep it efficient.

     - **Ethics:** We are asking students to drink vinegar. We must make it safe and optional. Use diluted vinegar (e.g., 1 part vinegar to 4 parts water). And make clear that they can back out at any time without penalty. Also, have water available to rinse.

  8. **What the setup can't reproduce:**
     - The original puzzle assumes a perfectly reliable predictor. In class, the predictor is a student and may make errors.
     - The original puzzle is one-shot and anonymous. In class, students know each other and there might be social dynamics (e.g., peer pressure, reputation).
     - The stakes in the original are high (a million dollars) vs. trivial rewards in class. This might affect the seriousness of the intention.
     - The original puzzle does not involve collusion. In class, coordination is possible.

  **Revised Timeline for 75 Minutes:**

  - **0-10 min: Introduction and Setup**
    - Explain: "Today we are going to do an activity about decision-making and intentions. I need a volunteer to act as a predictor. The predictor will have a special role." (Select predictor.)
    - Explain to the predictor: "I am going to give you a list of all the students in the class. For each student, I want you to predict: if that student were to sign up for a small reward by stating an intention to do a small task at the end of class, would they actually do the task? Write your prediction for each student. You will get a small reward for each correct prediction for the students who do sign up. Please do this privately and without discussing with others." (Give the predictor a form and have them step aside to fill it out. This takes about 5 minutes.)

    Meanwhile, explain to the rest of the class: "In a moment, I will offer each of you the chance to sign up for a small reward. The reward is for stating a sincere intention to do a task at the end of class. You will get the reward immediately, and then at the end of class, you can choose whether to do the task or not. The task is to drink a shot of watered-down vinegar. It's safe but not pleasant. The reward is [show the candy/coffee chip]."

  - **10-15 min: Predictor Completes and Submits Predictions**
    - The predictor hands in the prediction sheet to the instructor.

  - **15-25 min: Sign-up Phase**
    - Pass out the intention slips. 
    - Say: "If you wish to receive the reward, sign this slip. By signing, you are stating that you sincerely intend at this moment to drink the vinegar at the end of class. You are not committing to drink it; you are free to change your mind. But you must be sincere in your intention now. If you sign, you will receive the reward now."
    - Collect the slips and hand out the rewards immediately.

  - **25-60 min: Regular Class Discussion**
    - Proceed with the rest of the seminar as planned (on other topics).

  - **60-70 min: Drinking Phase**
    - At the end of class, prepare the vinegar shots (one for each student who signed). 
    - Say: "If you signed the slip, please come to the front. Here is your shot of vinegar. You may choose to drink it or not. There is no penalty for not drinking, and you already have your reward. But remember, you stated that you intended to drink it."
    - Have them decide one by one? Or all at once? To avoid peer pressure, have them come one by one to a separate table? Or have them all decide at their seats? We can hand out the shots and then give them a minute to decide. Then they either drink or pour it out in a disposal bucket.

  - **70-75 min: Initial Reaction and Predictor Payout**
    - Reveal the predictor's predictions for the students who signed. For each student, state what the predictor said and what the student did. Pay the predictor for each correct prediction.
    - Ask for immediate reactions: How do the students who signed and didn't drink feel? How do those who drank feel? How did the predictor feel?
    - Then, if time, start the debrief. Otherwise, continue in the next session.

  **Debrief Structure (if time is short, do the core and leave the rest for next time):**

  1. **Recap the activity:** What happened? What were the choices?
  2. **Focus on the intention vs. action:** The reward was for the intention, not the action. But what does it mean to form an intention? Is it a mental state that you can control?
  3. **Rationality at two times:** 
     - At the time of signing: It seems rational to form the intention to get the reward (if you can) because you get the reward and then you can avoid the bad part later.
     - At the time of drinking: It is rational not to drink because there is no further reward and it's unpleasant.
  4. **The predictor's role:** 
     - The predictor was able to predict, with some accuracy, what you would do. If the predictor predicted you wouldn't drink, and you didn't, then did you really intend to drink when you signed? Or did you just say so? 
     - If you didn't intend to drink, then you didn't meet the condition for the reward. But you got the reward anyway. This is a problem of self-knowledge and sincerity.
  5. **The puzzle:** 
     - How can you form a sincere intention to do something that you know (or that the predictor knows) you won't do? 
     - In the conditional variant (thought experiment): If the reward were only given to those for whom the predictor predicts that they will drink, then can anyone get the reward? Why or why not?
  6. **Binding:** 
     - How might you bind yourself to drinking? (e.g., by making a public commitment, by having a penalty for not drinking, etc.) But note: in the puzzle, there is no such mechanism.

  **Honest Notes on What Could Go Wrong:**

  - **Collusion:** Students might agree as a group to sign and then not drink. This would make the predictor's job easy (predict "no" for everyone) and everyone gets the reward. Then the puzzle doesn't arise because they didn't form a sincere intention. To mitigate: stress the importance of sincerity and individual decision-making. Also, if they collude, in the debrief, you can point out that they didn't form the intention, so they didn't meet the condition. This becomes a lesson about honesty and the difficulty of the puzzle in the real world.

  - **Predictor inaccuracy:** The predictor might be wrong for many students. Then the link between prediction and intention is weakened. We can then discuss: what if the predictor were more reliable? How does that change things?

  - **Nobody signs:** Then we don't have a puzzle. To avoid, make the reward attractive and the vinegar shot not too bad.

  - **Everyone drinks:** That would be surprising but possible (if they are very dutiful or the vinegar is not so bad). Then the predictor might have predicted "yes" for everyone and gets all correct. Then we don't see the tension. But we can still discuss: why did they drink? Because they intended to? Because they felt obligated? 

  - **Time crunch:** The activity might take longer than planned. Be ready to adjust.

  **Variant in Debrief:**

  If we don't have time to run the variant, we can present it as a thought experiment:

  "Imagine a different rule: you only get the reward if the predictor predicts that you will drink. Now, if you are rational, you know that at the time of drinking, you won't want to drink. So you won't drink. Therefore, the predictor will predict that you won't drink. Therefore, if you sign, you won't get the reward. So you don't sign. But if you could commit to drinking, then the predictor would predict that you drink, and then you would get the reward and then you would drink. But how can you commit? How can you form the intention now when you know that later you won't do it?"

  This leads to the core paradox.

  Overall, the activity should create an engaging experience that makes the abstract puzzle concrete.
answer: |-
  Below is a complete, runnable plan for your Kavka's toxin puzzle session. I've refined your concept to maximize engagement, ensure pedagogical clarity, and address your concerns about coordination, honesty, and fidelity to the original puzzle. The session is structured to **immerse students in the dilemma** before revealing the puzzle, using peer prediction to make the "reliable predictor" tangible.

  ---

  ### **Session Overview**
  - **Goal:** Force students to confront the tension between intending an action (for immediate reward) and following through (when it's irrational).
  - **Core Mechanism:** Use a peer predictor with incentives to approximate Kavka's "reliable predictor." The vinegar is **watered-down white vinegar** (safe but unpleasant: 1:5 vinegar-to-water ratio). Rewards are trivial (e.g., chocolate, coffee chips) to avoid ethical issues.
  - **Key Twist:** The predictor’s accuracy reveals whether intentions were "real," making the paradox visceral.
  - **Duration:** 75 minutes total.

  ---

  ### **Materials**
  1. **Rewards:** 
     - 16 small chocolates/coffee chips (for intention).
     - 16 extra rewards (for predictor bonuses; 1 per correct prediction).
  2. **Vinegar Setup:** 
     - 16 shot glasses with 20ml diluted vinegar (prepared before class).
     - A disposal bucket and water for rinsing (for those who avoid drinking).
  3. **Signing Slips:** 
     - Exact wording:  
       > *"I, [Student’s Name], sincerely intend at this moment to drink the vinegar shot at the end of this session. I understand that I am free to choose not to drink it later, and I will face no penalty. I am receiving a reward solely for stating this current intention."*
  4. **Prediction Sheets:**
     - Two columns: **Student Name** and **Prediction (Drink/Not Drink)**.
     - Sealed envelope to store predictions until the end.

  ---

  ### **Timeline (75 Minutes Total)**

  | Time    | Phase               | Key Activities                                                                 |
  |---------|---------------------|-------------------------------------------------------------------------------|
  | 0-5 min | **Intro (Stealthy)**| - Start class normally. Casually offer rewards: "I have chocolates/chips for anyone who signs this slip about their intentions. No big deal—just a quick exercise." Avoid mentioning the puzzle or vinegar yet. |
  | 5-15 min| **Prediction Phase**| - Choose a **predictor**: Pick a socially engaged student (known to the class). Privately brief them: "Your job is to predict, for each classmate, whether they’ll *actually drink* the vinegar if they sign. You’ll get one extra reward per correct prediction. Base this on your knowledge of them—be honest!"<br>- Predictor writes predictions privately (3 min). They seal the sheet in an envelope and give it to you. |
  | 15-25 min| **Signing Phase**   | - Reveal the catch: "If you sign, you’ll get a reward now, but you must drink vinegar at the end. Here’s the slip—read it carefully."<br>- Hand out slips. Students sign *only if* they sincerely intend to drink. **Stress sincerity**: "This only works if you’re honest with yourselves."<br>- Immediately give rewards to signers. |
  | 25-60 min| **Class Discussion**| - Run your planned seminar content (unrelated to the puzzle). This creates temporal distance between intending and acting. |
  | 60-70 min| **Drinking Phase**  | - Hand vinegar shots only to those who signed. Say: "Decide now: drink or not. No consequences either way."<br>- Record outcomes discreetly (✅/❌ for each signer). |
  | 70-75 min| **Reveal & Debrief**| - Unseal predictions. Announce predictor’s accuracy (e.g., "For 3 of 5 signers, the predictor was right"). Give predictor their bonus rewards.<br>- Start debrief with student reactions (details below). |

  ---

  ### **Ensuring Predictor Honesty**
  - **Selection:** Pick a mature, incentivized student. Say: "Your predictions affect your rewards—no jokes, or you lose out."
  - **Anonymity:** Predictor writes predictions alone. No one sees them until the end.
  - **Incentive Structure:** Reward the predictor **only for correct calls** (e.g., 1 chocolate per correct prediction). This mirrors Kavka’s "reliable" predictor by making accuracy personally valuable.
  - **Backup:** If predictions seem unserious (e.g., all "Drink"), note this in debrief: "Real predictors would face bigger stakes."

  ---

  ### **Debrief Script (Map to Kavka's Puzzle)**
  **Goals:** Elicit the paradox, link to theory, and resolve confusion. Start with reactions, then formalize.

  1. **Initial Reactions (3 min):**  
     - Ask signers: "How did it feel to get the reward? If you didn’t drink, do you feel like you ‘won’?"  
     - Ask predictor: "How confident were you? What patterns did you see?"  
     - *Key moment:* Highlight when non-drinkers see the predictor accurately called them out. Ask: "If the predictor knew you wouldn’t drink, did you *really* intend to? Or did you just say so?"

  2. **Map to Kavka’s Concepts (5 min):**  
     - **Intention vs. Action:** "The reward was for a *mental state* (intending), not the action (drinking). But can you intend something you know you won’t do?"  
     - **Two Rationalities:**  
       - *At t1 (signing):* Rational to intend → you get a reward.  
       - *At t2 (drinking):* Rational not to drink → no reward at stake, only discomfort.  
     - **The Predictor’s Role:** "The predictor acts like Kavka’s ‘reliable mechanism.’ If they’re accurate, your intention had to be ‘real’ to fool them—but if they knew you wouldn’t drink, your ‘intention’ was likely hollow."  
     - **Self-Binding Problem:** "How could you force yourself to drink? Promises? Penalties? Kavka says rationality alone can’t bind you."

  3. **Introduce the Variant (2 min - Thought Experiment):**  
     - Pose: "What if you only got the reward if the predictor said you’d drink? If you’re rational, you know you won’t drink later—so the predictor knows too. Can you even *form* the intention then?"  
     - *No need to rerun—this clarifies the puzzle’s bite.*

  4. **Connect to Rationality (1 min):**  
     - "Kavka’s puzzle asks: Can rationality demand you form an intention it *also* demands you abandon? What does this say about practical reason?"

  ---

  ### **Handling Coordination (Your Biggest Worry)**
  - **Risk:** Students collude to all sign and not drink → predictor predicts "not drink" for all → everyone gets rewards, and the paradox fizzles.
  - **Mitigation Strategies:**  
    - **Preempt with Framing:** Stress sincerity during signing: "This is about *your personal* intention. If you don’t mean it, don’t sign—it ruins the exercise."  
    - **Leverage the Predictor:** A good predictor will detect groupthink and predict "not drink," forcing students to confront insincere intentions.  
    - **If They Coordinate Anyway:** Use it! In debrief: "You colluded not to drink—so did anyone *truly* intend to? If not, you didn’t earn the reward. This shows how hard it is to ‘intend’ irrationally."  
    - **Design Choice:** **Lean into it, but frame as a lesson.** Coordination exposes the puzzle’s core: insincere intentions fail the predictor test.

  ---

  ### **What This Setup Can’t Replicate (Limitations)**
  1. **Stakes Are Trivial:**  
     - Kavka’s puzzle uses life-changing rewards ($1 million). Here, small rewards may not make intentions "serious." Students might drink "for fun" or ignore discomfort, undercutting the rationality of not drinking.  
     - *Mitigation:* Use the worst-tolerable vinegar (test dilution beforehand) and emphasize: "This is a proxy—imagine the reward was $1M."

  2. **Non-Anonymous, Repeated Interactions:**  
     - Your class isn’t one-shot. Social pressure (e.g., "Don’t wimp out!") or reputation (e.g., "I need to seem consistent") may sway actions.  
     - *Turn it into a lesson:* "Does real-world practical reason include social factors Kavka ignores?"

  3. **Predictor Fallibility:**  
     - A student predictor isn’t infallible. Errors dilute the "reliability" assumption.  
     - *Mitigation:* Choose a perceptive predictor. If predictions are poor, discuss: "What if the predictor *was* perfect? Would that change your intention?"

  4. **Intention Opacity:**  
     - You can’t verify sincere intentions. Some may lie to get rewards.  
     - *Use it:* "If you signed planning not to drink, did you *intend*? Or just lie? Kavka assumes honesty—should we?"

  ---

  ### **Predictable Challenges (And Fixes)**
  - **Challenge 1: No one signs.**  
    - *Fix:* Boost rewards ("Extra coffee if you participate") or reduce vinegar intensity.  
  - **Challenge 2: Everyone drinks.**  
    - *Fix:* In debrief, ask: "Why did you drink? Social pressure? Curiosity? Kavka assumes pure rationality."  
  - **Challenge 3: Predictor bias.**  
    - *Fix:* Have predictor justify predictions briefly (e.g., "I think Alex will drink because they’re dutiful").  
  - **Challenge 4: Time overrun.**  
    - *Fix:* Trim discussion phase. Sacrifice the variant if needed; it’s a debrief tool.  

  ---

  ### **Why This Works**
  - **Experiential Learning:** Students *live* the intention/action split before seeing the matrix. The predictor makes abstract reliability concrete.  
  - **Emotional Impact:** Non-drinkers’ "curdled" reactions when predictions expose them mirror Kavka’s paradox.  
  - **Pedagogical Fidelity:** The variant in debrief nails Kavka’s dilemma: intending the impossible.  
  - **Low Risk:** Safe, cheap, and engaging—uses classroom social dynamics as a feature, not a bug.  

  Run this as-is, and your students will debate rationality with vinegar on their breath!
