answer: |-
  ## Safety Review Board Memorandum  
  **Re: Mechanistic Evidence Transfer from V2 to V3**  
  **Date:** 2023-10-26  

  ### 1. The Core Ambiguity and Our Task  
  This board’s disagreement stems from a foundational tension in mechanistic anomaly detection: **What constitutes "the same mechanism"?** Two valid perspectives exist:  
  - **Causal Profile View:** A mechanism is defined by its *functional role*—its input-output mappings and counterfactual dependencies. If V3 behaves identically to V2 under all tested interventions, the mechanism is preserved, regardless of implementation details.  
  - **Structural Identity View:** A mechanism is defined by its *physical instantiation*—specific parameters, subcircuits, and computational pathways. Any change in initialization, tokenization, or data implies a distinct mechanism.  

  Both views capture essential truths. Causal profiles determine *what the system does* under perturbation—critical for safety. Structural details determine *how reliably* that profile persists under distributional shift—equally critical. **Neither view alone suffices for our purpose.**  

  ---

  ### 2. Resolution: Conditional Transfer with Verification  
  **The V2 safety case does not transfer wholesale to V3, but it need not be rebuilt from scratch.** We adopt a *tiered approach*:  

  #### (a) **Transferable Elements**  
  V2’s mechanistic evidence applies to V3 **if and only if**:  
  - **Causal Invariance:** The critical safety-relevant mechanisms (e.g., truthfulness modules, harm-rejection circuits) exhibit identical input-output counterfactuals under the *same probe batteries* used for V2.  
  - **Robustness to Tokenization:** Probes dependent on token semantics (e.g., “deception” detectors) are re-run using V3’s tokenizer, with results matching V2’s within an acceptable margin (±5% variance).  
  - **Stability Under Initialization Variance:** Sensitivity analyses (see §4) confirm the mechanism’s causal profile is architecture-inherent, not initialization-dependent.  

  #### (b) **Non-Transferable Elements**  
  The following require *re-inspection* for V3:  
  - Mechanisms where probes revealed high sensitivity to positional embeddings or low-level activation patterns.  
  - Circuits where V2’s safety case relied on idiosyncratic structural features (e.g., “fragile” neurons with high weight norms).  
  - Any mechanism failing the criteria in (a).  

  #### (c) **Bottom Line for V3**  
  - **Benchmark parity is necessary but insufficient.** Engineering must re-run V2’s *critical causal probes* on V3 within 72 hours.  
  - If probes confirm causal equivalence for ≥90% of safety-critical mechanisms (per Appendix B list), the V2 case transfers *for those circuits*.  
  - Remaining mechanisms require targeted re-analysis. **No indefinite delay:** Partial transfer enables phased re-certification.  

  ---

  ### 3. Practical Criteria for Mechanism Sameness  
  For future models, two systems implement “the same mechanism” **at a safety-relevant grain** if:  

  | Criterion                          | Engineer-Appliable Test                                                                 |
  |------------------------------------|----------------------------------------------------------------------------------------|
  | **Causal Equivalence**             | Identical outputs under all probe interventions (activation patching, ablation, input perturbations). |
  | **Tokenization Robustness**        | Probe results are invariant when inputs are re-tokenized for the new model (test with 100 adversarial prompts). |
  | **Initialization Stability**       | Mechanism persists when re-trained with 3 different seeds (variance in probe results < 10%). |
  | **Grain Sufficiency**              | The mechanism’s description is coarse enough to ignore non-safety-relevant implementation details (e.g., “attention head A attends to harm-indicators” vs. “layer 4, head 7”). |

  **Key Principle:** Sameness is *use-case relative*. For safety, we care about causal profiles *at the grain of task-relevant abstractions*. If two circuits compute “check for conflicting goals” identically under stress tests, their structural differences are irrelevant.  

  ---

  ### 4. What We Needed (and Need for the Future)  
  This decision would be stronger with:  
  - **V2 Sensitivity Logs:** Records of which mechanisms varied under retraining/data-augmentation tests.  
  - **V3 Cross-Initialization Probes:** Results from 3 seeds showing consistent causal profiles.  
  - **Tokenization Impact Maps:** Heatmaps of probe-result deltas when swapping tokenizers.  

  **Process Change:** Henceforth, all safety cases must include:  
  1. A **Mechanism Passport** listing:  
     - Required causal probes.  
     - Acceptable variance thresholds.  
     - Tokenizer/initialization sensitivity flags.  
  2. **Stability Certificates:** Evidence that critical mechanisms are robust to retraining variance.  

  ---

  ### 5. Respecting the Dissent  
  **To the Structural Identity View holders:** You are correct that structural differences *can* mask latent faults. A model with identical outputs may harbor novel failure modes (e.g., trojans activated by new tokenization). Your caution ensures we never mistake correlation for causation. This opinion mandates direct verification of causal profiles *because* of your insistence.  

  **To the Causal Profile View holders:** You are correct that functional equivalence is the safety bottom line. This opinion avoids unnecessary rework by accepting your core thesis: if causal behaviors are invariant, structural differences are often incidental.  

  ---

  ### 6. Conclusion  
  Approve V3’s release contingent on:  
  - Immediate causal re-probing of V2’s safety-critical mechanisms using V3’s tokenizer.  
  - Transfer of evidence only for mechanisms passing §3 criteria.  
  - Targeted re-analysis of non-conforming circuits within one sprint cycle.  
  - Adoption of Mechanism Passports for all future models.  

  **Mechanistic safety is not binary.** We transfer evidence where justified, verify where uncertain, and systematize to avoid recurring debates. This balances rigor with pragmatism.  

  ---  
  *Approved by Safety Review Board Chair*  
  *Attachments: Appendix A (V2 Critical Mechanisms), Appendix B (Probe Protocol Template)*
