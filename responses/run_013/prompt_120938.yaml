prompt: |-
  I'm a third-year student in an interdisciplinary seminar on models of long-run social change — the syllabus pairs demographic and economic history with a fair amount of dynamical-systems modelling, and we've spent the past three weeks on the structural-demographic tradition that tries to explain the recurrent rise-and-fall pattern of agrarian states: the "secular cycle," with its elite overproduction, popular immiseration and fiscal crisis of the state, and its older, looser cousin in Ibn Khaldun's cycle of *asabiyya*. I came in sympathetic and I'm leaving confused, mostly because I can't tell what the theory is actually being asked to deliver. Our last session ended with one student calling the whole enterprise numerology dressed up in differential equations and another pointing to a composite "stress index" that seems to have anticipated a period of instability before it happened, and neither of them was arguing about the same thing. Before we start comparing the contenders — structural-demographic theory, the Khaldunian picture, Goldstone's demographic-structural account, and the null hypothesis that there is no cycle at all, only a slow trend plus shocks — I want the specification written down first, and I'd rather have it from you than from the seminar's four competing intuitions.

  So: write me the desiderata. What must any theory of long-run historical cycles deliver to count as adequate for the purpose the cliodynamicists set themselves, namely quantitative retrodiction and genuine out-of-sample prediction of instability? I want the phenomena it has to explain, the cases it has to get right (the well-documented agrarian cycles; the states that collapsed without the predicted precursors; the ones where every precursor showed up and nothing happened; the regions where the record is too thin to tell), the distinctions it cannot collapse — between a cycle and a slow trend with autocorrelated noise, between retrodiction and prediction, between a mechanism and a correlation, between endogenous dynamics and exogenous shocks like epidemics, climate or conquest, between taking the dynasty and taking the polity as the unit of analysis, between a quantitative index that measures something and one whose weights were chosen after the fact — and the results from outside history it has to be consistent with: what is known about inference from small numbers of noisy time series, about how easily a two- or three-parameter model can be fitted to three centuries of data, about regression to the mean, and about how autocorrelation inflates apparent significance. For each requirement give me the case or consideration that motivates it, say whether it is non-negotiable or merely a preference of one camp, and flag the pairs that are in tension — I suspect at least one, something like "a mechanism with individual-level microfoundations" together with "enough predictive grip from a handful of cycles to be worth calling a science," and if that pair really is jointly unsatisfiable I want it stated as a result of the exercise rather than quietly dropped. End by telling me which single requirement does the most to exclude candidates, and keep the scorecard brief: a paragraph on structural-demographic theory and a sentence or two each on the alternatives is plenty, since the comparing is what we're doing in class on Thursday.
