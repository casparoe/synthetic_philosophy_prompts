     - Rule 3: Replace III by U. This operation removes 3 I's and adds 0 I's. So the change in the number of I's is -3. Therefore, the new number of I's is n-3. Now, note that n-3 mod 3 = n mod 3. So if n mod 3 ≠ 0 then (n-3) mod 3 = n mod 3 ≠ 0. Thus, the property is preserved.

     - Rule 4: Delete UU. This does not change the number of I's. So the property is preserved.

     - Also, the axiom MI has exactly one I -> not divisible by 3.

     Therefore, every theorem of the system has the property: the number of I's is not divisible by 3.

     But MU has 0 I's? Actually, MU has no I's. And 0 is divisible by 3 (since 0 mod 3 = 0). So MU does not have the property. Hence, it cannot be derived.

     However, note: the invariant is "the number of I's is not divisible by 3" (i.e., the count mod 3 is not 0). And 0 is divisible by 3? Yes, because 0 mod 3 is 0. So the invariant fails for MU.

  3. **Why failure of derivations is not evidence?**
     - The fact that we tried to derive MU and failed doesn't mean it's impossible. There might be a very long derivation that we haven't found. The invariant argument gives a reason that holds regardless of the length of the derivation.

  4. **Jumping out of the system:**
     - What is being jumped? The system is the set of rules and axioms. We are stepping outside the system to look at the properties of the strings (like the number of I's mod 3) that are not mentioned in the rules. The rules do not talk about the meaning of the symbols or counting I's. We are using a meta-level property.
     - Why must the proof live outside? Because the system itself does not have the expressive power to talk about the number of I's modulo 3. The system only manipulates symbols according to the given rules. The proof is about the system, so it is in the meta-theory.
