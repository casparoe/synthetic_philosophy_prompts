  We are designing a take-home exam question for an upper-level undergraduate seminar. The students have encountered the MU-puzzle before but cannot reproduce the reasoning. The question must cover:
  1. An actual proof that MU is not derivable by finding an invariant property that holds for all derivable strings and that MU lacks, with a demonstration that the property is preserved by each rule and holds for the axiom.
  2. An account of why the failure of attempted derivations does not establish the claim and what sort of argument does.
  3. A characterization of "jumping out of the system": what is being jumped, why the proof must live outside, and whether a purely rule-following machine could have the capacity to jump.

  We are to write the question, a model answer (700-900 words), and a marking scheme with 5 must-hit points (5 marks each). For each point, include a one-line note on common student errors.

  The model answer should handle the trivial cases honestly and make explicit which step of the preservation argument is doing the real work. The Crux: at the end should be a single sentence naming the one move that separates an A from a B.

