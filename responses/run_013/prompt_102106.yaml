  ---

  **Question:**

  The MU puzzle, presented in Chapter 1 of *Gödel, Escher, Bach*, asks whether the string MU can be derived from the axiom MI using the following rules:

  1. If a string ends with I, you may append a U at the end.
  2. If a string begins with M, you may double the part after the M (i.e., Mx becomes Mxx).
  3. If a string contains III, you may replace III with U.
  4. If a string contains UU, you may delete UU.

  Prove that MU is not derivable in this system. Your proof must identify an invariant property that holds of the axiom MI and is preserved by every rule application, but that MU does not have. Demonstrate that the property holds for MI and that each rule preserves the property. Then, explain why the mere failure to find a derivation of MU (even after many attempts) does not constitute a proof that it is impossible, and contrast that with the kind of argument you have just given. Finally, discuss what it means to "jump out of the system" in this context. Specifically, what is the system that one is jumping out of? Why must a proof of the underivability of MU necessarily reside outside the system? And could a mechanical device that only follows the rules of the system (without any external interpretation) ever make such a jump?

  ---

  **Model Answer:**

  **Proof of Non-derivability:**

  To prove that MU cannot be derived, we will identify a property of strings that is true of the axiom MI, preserved by every rule of the system, and false of MU. This property, called an invariant, will therefore hold for every theorem (derivable string) of the system. Since MU does not possess the property, it cannot be a theorem.

  We claim the invariant is: *the number of I's in the string is not divisible by 3*. Let us verify:

  1. **Base case (axiom MI):** The string MI has exactly one I. Since 1 is not divisible by 3 (1 mod 3 = 1), the property holds.

  2. **Rule 1 (Appending U):** If a string ends with I, we append a U. This operation does not change the number of I's. Therefore, if the original string had a number of I's not divisible by 3, the new string also has the same number of I's, which remains not divisible by 3.

  3. **Rule 2 (Doubling):** If a string begins with M, we double the part after the M. Let the string be Mx, where x is a substring. Suppose x has n I's. After doubling, the new string is Mxx, which has 2n I's. We must show that if n mod 3 ≠ 0, then 2n mod 3 ≠ 0. Consider the possible residues of n modulo 3:
     - If n ≡ 1 mod 3, then 2n ≡ 2 mod 3 (which is not 0).
     - If n ≡ 2 mod 3, then 2n ≡ 4 ≡ 1 mod 3 (which is not 0).
     - If n ≡ 0 mod 3, then 2n ≡ 0 mod 3. But note that we are only applying the rule when the invariant holds for the original string, so we assume n mod 3 ≠ 0. Therefore, 2n mod 3 ≠ 0. Hence, the property is preserved.

  4. **Rule 3 (Replace III with U):** We replace an occurrence of III with U. This operation removes three I's and adds zero I's (since U is added, but U is not I). Therefore, the new number of I's is n - 3, where n was the original count. Now, (n-3) mod 3 = n mod 3. Since the original string had n mod 3 ≠ 0, then (n-3) mod 3 ≠ 0. Thus, the property is preserved.

  5. **Rule 4 (Delete UU):** We delete two U's. This operation does not change the number of I's. Therefore, the property is preserved.

  We have shown that the invariant holds for MI and is preserved by every rule. Therefore, every derivable string has a number of I's that is not divisible by 3.

  Now, examine MU: it has zero I's. Zero is divisible by 3 (since 0 mod 3 = 0). Therefore, MU does not have the invariant property. Hence, MU is not derivable.

  **Why Failure of Derivations is Insufficient:**

  The fact that we have tried and failed to derive MU does not prove its underivability. There are infinitely many possible derivations (since rule 2 can lead to arbitrarily long strings). We might not have tried the right one. The invariant argument, however, covers all possible derivations: no matter how long or complex a derivation is, every string in it must have the invariant. Since MU lacks the invariant, it cannot appear in any derivation. This is a finite, global reason that applies to every derivation.

  **Jumping Out of the System:**

  The MU puzzle illustrates Hofstadter's idea of "jumping out of the system." What does this mean?

  - *What is being jumped?* The system here is the formal system defined by the axiom MI and the four rules. The rules are purely syntactic: they manipulate strings without regard to any meaning. Jumping out means stepping beyond the symbol-shuffling to consider a semantic property: the number of I's modulo 3. This property is not part of the system's rules or symbols; it is an external interpretation.

  - *Why must the proof live outside?* The formal system itself does not have the resources to express the concept of "the number of I's mod 3". The system's rules do not mention numbers or modular arithmetic. Therefore, a proof that uses this concept cannot be carried out within the system. The proof is a meta-argument about the system, not a derivation within it.

  - *Can a purely rule-following agent make this jump?* A mechanical device that only applies the rules of the system (without any external interpretation) cannot. Such a device would generate strings step by step, but it would not notice the invariant because the invariant is a global property of derivations that is not expressed in the system's language. However, if we equip the machine with additional capabilities (such as counting symbols and computing modulo arithmetic) and allow it to analyze the system as an object, then it could. But then it would be acting as a meta-system, not just as an executor of the rules. Thus, the capacity to jump out requires an ability to reflect on the system from a higher level, which a purely rule-following agent lacks.

  In summary, the invariant proof provides a rigorous demonstration of the underivability of MU by stepping outside the formal system to use a mathematical property that is preserved by all rules. This step is necessary because the system itself cannot express the invariant, and it is a step that a purely mechanical rule-applier cannot take without additional interpretive capabilities.

  ---

  **Marking Scheme (5 points, 5 marks each):**

  1. **Identification of the invariant property and verification for the axiom.**
     - Must state the invariant: the number of I's is not divisible by 3 (or equivalent modulo condition).
     - Must check that MI has one I, which is not divisible by 3.
     - *Common error:* Using an incorrect invariant (e.g., total symbols, or forgetting to account for rule 2 properly).

  2. **Demonstration that each rule preserves the invariant.**
     - Must cover all four rules, including the trivial ones (rule 1 and 4) and the non-trivial ones (rule 2 and 3) with correct reasoning.
     - For rule 2, the key step is showing that doubling the substring after M preserves the non-divisibility by 3. This is the step that does the real work and is non-trivial.
     - For rule 3, note that replacing III by U changes the I-count by -3, which preserves the residue mod 3.
     - *Common error:* Incorrect handling of rule 2 (e.g., claiming without proof that doubling preserves non-divisibility by 3, or not considering the residues).

  3. **Showing that MU lacks the property.**
     - Must note that MU has zero I's and that zero is divisible by 3.
     - *Common error:* Claiming that MU has zero I's and that zero is not divisible by 3 (which is false).

  4. **Explanation of why failure of derivations is insufficient and contrast with the invariant argument.**
     - Must state that there are infinitely many possible derivations and that failure to find one does not imply nonexistence (it might be very long or complex). Contrast with the invariant argument which gives a finite, global reason that covers all possible derivations.
     - *Common error:* Simply restating that the invariant proof is better without explaining the contrast.

  5. **Characterization of "jumping out of the system".**
     - Must clearly explain:
       - What is being jumped: the formal system (its rules and symbols) to a meta-level that considers properties (like the I-count mod 3) not expressible in the system.
       - Why the proof must be outside: because the system cannot express the invariant (it has no concept of numbers or modular arithmetic).
       - Whether a rule-following machine could jump: no, if the machine is confined to the rules; but yes, if we extend it to have meta-reasoning capabilities (but then it's not purely rule-following in the system's sense).
     - *Common error:* Not making clear the distinction between the system and the meta-system, or claiming that any machine could do it without qualification.

  **Crux:** The one move that separates an A answer from a B answer is the clear articulation of why the invariant proof must live outside the system and the precise handling of the doubling rule's effect on the invariant.
answer: |-
  ### Exam Question: The MU-Puzzle and Jumping Out of the System

  **Background:** Recall the MU-puzzle system:  
  - **Axiom:** MI  
  - **Symbols:** M, I, U  
  - **Rules:**  
    1. If a string ends in I, append U.  
    2. If a string begins with M, double the part after M (e.g., Mx → Mxx).  
    3. Replace any occurrence of III with U.  
    4. Delete any occurrence of UU.  

  **Tasks:**  
  1. **Proof of Non-derivability:** Prove MU cannot be derived. Identify a property (invariant) that:  
     - Holds for the axiom MI.  
     - Is preserved by each rule (demonstrate this for all four rules).  
     - Fails for MU.  
     Clearly state why MU lacks this property.  

  2. **Why Failure of Derivations is Insufficient:** Explain why repeatedly failing to derive MU (e.g., after 100 attempts) does *not* prove it is underivable. Contrast this with your proof: what makes your argument conclusive?  

  3. **Jumping Out of the System:** Characterize what "jumping out of the system" means here. Address:  
     - *What is being "jumped" (i.e., what defines the "system")?*  
     - *Why must the proof of MU’s underivability "live outside" the system?*  
     - *Could a purely mechanical device (that only applies rules) "jump out"?*  

  ---  
  ### Model Answer (≈850 words)  

  #### 1. Proof of Non-derivability  
  I will prove MU is underivable by identifying an *invariant property*: **the number of I’s in the string is congruent to 1 or 2 modulo 3** (i.e., not divisible by 3). This property holds for all derivable strings but fails for MU.  

  - **Base case (Axiom MI):** MI has one I. Since 1 mod 3 = 1 (not 0), it satisfies the invariant.  

  - **Rule preservation (for each rule):**  
    - **Rule 1 (Append U):** Appending U adds no I’s. The I-count is unchanged, so the residue mod 3 is preserved.  
    - **Rule 2 (Double after M):** Let the string be *Mx*, where *x* has *k* I’s. After doubling, it becomes *Mxx* with *2k* I’s. Since *k ≢ 0 mod 3* (by the invariant), we check:  
      - If *k ≡ 1 mod 3*, then *2k ≡ 2 mod 3* (not 0).  
      - If *k ≡ 2 mod 3*, then *2k ≡ 4 ≡ 1 mod 3* (not 0).  
      Thus, *2k ≢ 0 mod 3*. **This step does the real work**: doubling preserves non-divisibility by 3.  
    - **Rule 3 (Replace III with U):** Replacing III removes three I’s and adds zero I’s (U is not I). The I-count changes by *−3*. Since *−3 ≡ 0 mod 3*, the residue mod 3 is unchanged (e.g., if originally *k ≡ 1*, now *k−3 ≡ 1 mod 3*).  
    - **Rule 4 (Delete UU):** Deleting UU removes no I’s. The I-count is unchanged.  

  Since the invariant holds for MI and is preserved by all rules, *every derivable string has an I-count not divisible by 3*.  

  MU has *zero I’s*. Zero is divisible by 3 (0 mod 3 = 0), so MU lacks this invariant. Thus, MU cannot be derived.  

  #### 2. Why Failure of Derivations is Insufficient  
  Failing to derive MU after any finite number of attempts (e.g., 100 steps) does *not* prove underivability. The system allows arbitrarily long strings (via Rule 2), so there are infinitely many possible derivations. A failed search only shows MU was not found *yet*—it might exist in an unexplored branch. For example, one might abandon a derivation that could later yield MU after 101 steps.  

  In contrast, the invariant proof is **conclusive and finite**. It shows *no* derivation, regardless of length or complexity, can produce MU because:  
  - All derivable strings inherit the invariant.  
  - MU violates it.  
  This leverages a global property (invariance) that transcends individual derivations, converting an infinite search into a finite algebraic argument.  

  #### 3. Jumping Out of the System  
  - **What is being "jumped"?** The "system" is the formal deduction framework: the strings (M/I/U), axiom (MI), and mechanical rules. Jumping out means **abandoning symbol-shuffling** to analyze the system’s *global behavior* using external tools (here, modular arithmetic).  

  - **Why must the proof live outside?** The system lacks **expressive power** to state the invariant. Rules manipulate symbols (e.g., "double" or "replace III") but cannot *count I’s mod 3*. The proof requires interpreting strings as numbers—a semantic leap foreign to the system’s syntax. Inside the system, one can only generate strings; outside, we prove *about* the system.  

  - **Could a purely mechanical device jump out?** No—if the device *only* applies rules blindly. Rule-following agents lack:  
    - **Awareness of invariants**: They don’t "notice" I-counts; they shuffle symbols.  
    - **Meta-reasoning**: Proving invariance requires analyzing *all possible* rules/states, not executing them.  
    However, a device with **external interpretation** (e.g., a human-fed program to compute I-counts) *could* jump out. But this extends beyond pure rule-application; it grafts meta-level reasoning. Thus, "jumping" is not a move a *purely* mechanical agent can make.  

  In summary, the MU-puzzle demonstrates that underivability proofs require stepping outside the system to find invariants—a move inaccessible to rule-bound agents but essential for human insight.  

  ---  
  ### Marking Scheme (25 marks total)  
  **Must-hit points (5 marks each)**. Common errors are noted.  

  1. **Correct invariant property and base case:**  
     - Property: "I-count not divisible by 3" (or equivalent modulo statement).  
     - Base case: MI has 1 I (1 ≢ 0 mod 3).  
     - *Common error:* Wrong invariant (e.g., "starts with M" or "total symbols odd") or mishandling MI (e.g., claiming MI has 0 I’s).  

  2. **Preservation under all rules with honest trivial cases:**  
     - Rule 1/4: Explicitly state I-count unchanged (trivial but required).  
     - Rule 2: Show doubling preserves ≢ 0 mod 3 (key non-trivial step).  
     - Rule 3: Note −3 I’s preserves residue mod 3 (not "adds U, ignores I’s").  
     - *Common error:* Hand-waving Rule 2 ("doubling changes nothing") or Rule 3 ("deletes III, so invariant holds").  

  3. **MU lacks the invariant and conclusion:**  
     - MU has 0 I’s; 0 ≡ 0 mod 3 → violates invariant → not derivable.  
     - *Common error:* Claiming 0 ≢ 0 mod 3 or omitting mod-3 reasoning.  

  4. **Explain why failed derivations ≠ proof, contrast with invariance:**  
     - Failed attempts: Infinite search space; absence of evidence ≠ evidence of absence.  
     - Invariance: Finite, covers all derivations (global property).  
     - *Common error:* Only stating "derivations could be long" without contrasting global vs. local reasoning.  

  5. **Characterize jumping out:**  
     - Jumping: Leaving symbol manipulation (system) for meta-level (e.g., counting I’s).  
     - Outside: System can’t express invariants (needs external math).  
     - Machine: Purely rule-following—no; augmented—yes, but not "pure."  
     - *Common error:* Equating "jumping" with "using creativity" vaguely or claiming machines can do it without qualification.  

  **Crux:** The move that separates an A from a B answer is explicitly justifying why the doubling rule (Rule 2) preserves the invariant via modular arithmetic, without hand-waving.
