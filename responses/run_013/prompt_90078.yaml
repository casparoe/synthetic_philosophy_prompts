  The refuted camp likely sees Malthus as making a concrete historical prediction—that population *must* outstrip resources, proven false by industrialization. But the vindicated camp treats it as a conditional model—true *if* technology stagnates, hence still relevant for climate/resource crises. That’s fundamentally a definitional split: is the theory a specific forecast or an abstract mechanism? 

  Then there’s the falsification problem. For claims spanning centuries, "early" refutations (like 1800s escapes) can be dismissed as temporary—making the theory slippery. The user’s friend is right: auxiliary assumptions (e.g., "innovation will slow!") can indefinitely defer falsification. But that’s not unique to Malthus; it’s a pain point for all long-range social science. 

