prompt: |-
  Every few years someone announces that Malthus is finally refuted and every few years someone else says he's been vindicated all along, and the thing never actually gets settled. I've been following it for a while and both camps seem to be working from the same facts. The refuted camp points at the industrial revolution and the demographic transition — a couple of centuries where population grew and living standards rose anyway, which is the exact opposite of what Malthus said could last. The vindicated camp says the escape was a one-off, that his model is really a conditional about what happens when technology is held fixed, and that resource and climate limits are dragging the original mechanism back into view. A friend of mine reckons the whole dispute turns on whether a long-run prediction can even be tested on any human timescale — that "right but early" isn't a defence but a confession that the theory can't be falsified, since enough auxiliary assumptions can save anything. My own hunch, though I'm not confident, is that it's less a fight about the facts than about what counts as "the theory" in the first place: is Malthus's claim just the bare population-versus-subsistence mechanism, or a model that already has endogenous technical change baked in, so that the escape isn't a refutation at all? Can you tell me what kind of disagreement this actually is? If it's largely verbal, show me where the two sides are using the same words for different things. If it's really a disagreement about standards of evidence or about what falsification even requires for a claim that plays out over centuries, lay that out instead. And given whatever diagnosis you land on, tell me what would count as progress here — is there a version of the question that's actually decidable, or should we stop expecting it to resolve? Keep it in continuous prose, no headings, bullets, bold or tables — just write it out like you'd explain it to me in an email.
