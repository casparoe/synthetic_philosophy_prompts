  Okay, the user runs a monthly discussion group at a community library for adults without philosophical training. They need a session plan on why we call a glass fragile even if it's never been struck. The user has encountered concepts like finkish dispositions and masking but finds them confusing to explain. 

  First, I need to understand the core problem. Fragility seems to mean "would break if struck," but there are exceptions. Masking is when something prevents the breaking, like packing material. Finkishness is when the striking itself removes the disposition—like a wire that stops being live when touched. The user worries participants might conflate these or think unmanifested dispositions aren't real.

  The user mentioned a burglar alarm example. I need to assess if it works. Comparing it to classic cases like the glass and wire shows it's versatile but might need simplification. The alarm's complexity could confuse, so simpler examples are better. However, with clear framing, it can illustrate both masking and finkishness effectively.

  Key misconceptions to address: participants might think the two cases are the same but at different times, or that dispositions must manifest to exist. I should structure the session to preempt these. Start with the basic definition, then introduce counterexamples one by one, highlighting the differences. Emphasize that dispositions exist even when masked or finked.

  For the hour plan, structure is crucial. Begin with the vanilla case to establish intuition. Then introduce masking with packing material, showing external interference. Next, finkishness with the wire example, where the trigger changes the disposition. Contrast these clearly to avoid conflation. Use the alarm analogy if needed, but anchor in tangible examples. 

  What to avoid: don't dive into possible-world semantics or Lewis's reformed analysis. Mention the "nothing interferes" clause but note its limitations without overcomplicating. Exclude mimicked dispositions (like the sugar lump) unless time permits; it's a deeper layer.

  End with a diagnostic question: present a new case, like a vase that shatters when touched because it's rigged to collapse. Ask if it's fragile. The answer should reveal if they grasp that finkish cases aren't true dispositions—the vase isn't fragile; it's designed to break only upon interference.

  Overall, focus on making the problem tangible, using relatable examples. Guide the group to feel the puzzle, then unravel it step by step, correcting misconceptions as they arise. Keep language accessible, avoid jargon, and encourage debate to solidify understanding.
answer: |-
  Here’s a structured 60-minute session plan focused on making the puzzle visceral and guiding the group to distinguish the core cases. Avoid jargon—use relatable analogies and let the problems emerge from discussion.

  **Goal:**  
  For participants to grasp *why* "fragile = would break if struck" fails, and to distinguish **masking** (external blockers) from **finkishness** (the trigger destroys the disposition).

  ---

  ### **Session Plan**  
  *(45 min discussion + 15 min wrap-up)*  

  #### **1. Setup: The Vanilla Intuition (10 min)**  
  - **Hook:** Hold up a glass. "We call this fragile. It’s never been struck. Why?"  
  - **Group Brainstorm:** Elicit responses. *Steer toward:* "Because it *would* break *if* struck." Write this definition: **Fragile = Would break if struck**.  
  - **Problem Framing:** "This seems straightforward. But what if reality conspires to make this definition lie? Let’s test it with two stories."  

  #### **2. Case 1: Masking (The Packed Glass) (15 min)**  
  - **Story:** "Imagine I place this glass in indestructible packing foam. Now I strike it *hard* with a hammer. It doesn’t break. Is it still fragile?"  
  - **Discussion:**  
    - *Likely Consensus:* Yes, it’s still fragile—the foam protected it.  
    - **Key Question:** "Does our definition hold? *Would it break if struck?* (No, in this scenario). But we all agree it’s fragile! So is the definition wrong?"  
    - **Label the Problem:** "This is **masking**. Something *external* (foam) blocks the breaking, but the glass’s ‘fragile nature’ is intact."  
  - **Anchor Phrase:** *"The disposition is there, but hidden."*  

  #### **3. Case 2: Finkishness (The Disappearing Fragility) (15 min)**  
  - **Story:** "Now imagine a magic glass. *Only* fragile when untouched. The *instant* it’s struck, a spell makes it unbreakable. I strike it. What happens?"  
    - *Clarify:* It **doesn’t break** (magic makes it sturdy upon impact).  
  - **Discussion:**  
    - *Likely Response:* "But if it becomes sturdy when hit, was it *ever* fragile?"  
    - **Contrast with Masking:** "Unlike the foam case, here the *striking itself* removes the fragility. The definition says: *If struck, it would break*. But when we test this, it *doesn’t* break. Yet, before striking, it *was* fragile!"  
    - **Label the Problem:** "This is **finkishness** (named by philosophers—blame them!). The trigger (striking) *destroys the disposition*."  
  - **Anchor Phrase:** *"The disposition vanishes when tested."*  
  - **Burglar Alarm Analogy (Use Sparingly):**  
    - *Masking:* Alarm would sound if triggered, but a cushion muffles it → **still disposed to sound**.  
    - *Finkish:* Alarm is designed to *disable itself* when motion is detected → **disposition disappears when triggered**.  

  #### **4. Tackling Misconceptions (5 min)**  
  - **Misconception 1:** "These are the same thing!"  
    - **Clarify:** "No. Masking: Disposition *persists* (glass stays fragile, foam absorbs shock). Finkish: Disposition *dies* (magic glass stops being fragile when struck)."  
  - **Misconception 2:** "If the disposition never shows, it doesn’t exist!"  
    - **Counter:** "In masking, we *know* the foam is the only reason it didn’t break. Remove the foam, and it shatters. The fragility was real but suppressed. Finkishness is trickier—the fragility was real *until* the test."  

  #### **5. What to Avoid & Explicitly Exclude**  
  - **Do NOT cover:** Mimicked dispositions (e.g., a sugar lump that *isn’t* soluble but would dissolve if dropped in water because water contains a hidden solvent). This overcomplicates.  
  - **Say:** "Today we’re focusing on two ways the simple definition fails. There are deeper rabbit holes—like things that *only become fragile when struck*—but we’ll save those for another day."  

  #### **6. Diagnostic Closing Question (5 min)**  
  - **Prompt:** *"Imagine a vase that’s sturdy, but wired to explode if touched. It’s not struck—it explodes when touched. Is it fragile? Why or why not?"*  
    - **Correct Insight:**  
      - If they say **"No, it’s not fragile—it’s rigged to explode!"**: They grasp finkishness (touching triggers destruction, but the vase wasn’t inherently breakable).  
      - If they say **"Yes, because it breaks when touched!"**: They’ve conflated disposition with outcome (key confusion).  
    - **Use this to reinforce:** "Fragility is about *how the object is made*, not just what happens when you hit it. The wired vase isn’t fragile—it’s *designed to sabotage itself* when touched."  

  ---

  ### **Why This Works**  
  - **Problem-First Approach:** Starts with intuitive definition, then *breaks* it with stories. The tension feels genuine, not academic.  
  - **Single Carry Case:** The **magic glass** (finkish) vs. **packed glass** (masking) is optimal. Tangible, minimal moving parts. Burglar alarm is a backup analogy if needed.  
  - **Handles Misconceptions:** Proactively contrasts cases to prevent conflation. Uses anchor phrases for recall.  
  - **Clarity on Limits:** Explicitly excludes mimicked dispositions to avoid confusion.  
  - **Diagnostic Question:** Tests understanding of the *disposition/outcome split*—core to the distinction.  

  **Key materials:** A glass, a hammer (prop only!), and your storytelling. No handouts needed. Encourage them to argue—their objections will reveal whether the distinction lands.
