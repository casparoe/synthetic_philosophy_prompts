prompt: |-
  A few friends and I have been arguing about quantum suicide and I want to get clear on what actually follows from it. One of them puts it like this: on the many-worlds picture every outcome of a quantum measurement happens in some branch, so if I sit in a machine that kills me with probabilty 99.9999% then there's still a branch where I live, and that's the branch I'll be in, so my chance of dying is really zero -- and the same move works no matter how small the survival probability gets, so I'm effectively immortal and should cheerfully bet my life on a coin flip (he's started calling it his retirement plan). I don't buy it but I can't say exactly were it goes wrong, and I don't need you to settle whether many-worlds itself is true. Please tell me the most important implications of taking quantum immortality seriously: what it does to the idea that I could die, to how probability should work for someone who is one of many copies, to decision-making under risk, and to whether the claim is even coherent. Also say what it implies about how much the view should count as evidence for or against many-worlds. Give it to me as exactly five numbered points, one or two sentences each, with no intro and no wrap-up.
reasoning: |-
  Okay, the user is asking about quantum suicide and immortality in the many-worlds interpretation. They've been arguing with friends, and one friend thinks that setting up a quantum suicide machine means they'll always survive because there's always a branch where they live. The user doesn't buy it but can't pinpoint the flaw. They want me to break it down into five exact points without intros or conclusions.

  First, I need to recall how many-worlds works. Every quantum outcome branches reality, so technically, for any non-zero survival probability, there's a branch where you survive. But the key issue is perspective: from your subjective view, you only experience the branches where you're alive. That creates the illusion of immortality.

  The user mentioned decision-making under risk. Their friend thinks they can bet their life on a coin flip as a "retirement plan." But in many-worlds, while you subjectively survive, the measure (number of branches) matters for probability. If survival probability is low, there are fewer branches where you live, but since you're only conscious in those, you don't experience death. However, this doesn't mean death is impossible—it just means you don't observe it.

  For coherence, the claim of immortality is only from a first-person view. Objectively, in most branches, you die. The user might be worried about real-world implications, like whether this makes risky behavior rational. I should clarify that decision-making can't ignore the low measure of survival branches; rational agents should still avoid high-risk actions because their future selves exist in fewer branches.

  Regarding evidence for or against many-worlds, quantum suicide isn't a strong test because you can't verify the dead branches. Any survival could be luck in a single-world theory. The user might want to counter their friend's overconfidence in many-worlds based on this thought experiment.

  I'll structure five points: 1) Subjective immortality vs. objective death, 2) Probability based on branch measure, 3) Death as unobservable but real, 4) Decision-making should account for measure, 5) Weak evidence for many-worlds due to unfalsifiability.
answer: |-
  1.  **Subjective Immortality ≠ Objective Immortality:** You subjectively only experience branches where you survive, creating the *illusion* of immortality from your perspective, but objectively, you die in the vast majority of branches.
  2.  **Probability Relates to Branch Measure, Not Certainty:** Your chance of experiencing a specific outcome equals the quantum probability (branch measure) for that outcome; a 0.0001% survival chance means you *will* experience survival, but only in a branch of infinitesimally small measure.
  3.  **Death Remains Real but Unobserved:** Death is a real event occurring in most branches; your subjective continuity in a surviving branch doesn't negate death's reality, it merely means you cannot observe your own death.
  4.  **Decision-Making Must Account for Branch Measure:** Rational decisions under risk should weight outcomes by their quantum probability (branch measure), not by subjective certainty of survival; betting your life remains irrational due to the vanishingly small measure of "winning" branches.
  5.  **Weak Evidence for Many-Worlds:** Quantum immortality is a consistent implication of many-worlds + subjective continuity, but it provides negligible evidence *for* many-worlds as survival is predicted (as improbable luck) by single-world theories too.
