  Round 3 sees Nadia reframe retrospectivity as a feature, invoking Popperian fallibilism. Her distinction between diachronic rationality and algorithmic decision rules is defensible, though she overstates how much guidance the heuristics actually provide in practice.

  Owen counters in Round 4 with devastating critiques: he shows the apparent guidance is circular ("do what the programme says to do"), highlights the ambiguity in identifying "novel predictions," and notes the framework's dependence on sociological factors for rival emergence. These are clearly right objections that strike at Lakatos's core claims.

