  I notice they've done their homework: they mention material partial continuity, Ottoman techniques, heritage doctrine shifts (Venice vs Nara), and even contrast with Ise Shrine. The depth is impressive for high school level. Their suspicion that the puzzle might be "underdescribed" or "parochial" is sharp—they're questioning Western assumptions about persistence.

