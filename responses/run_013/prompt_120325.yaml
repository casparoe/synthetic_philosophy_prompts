prompt: |-
  I'm a journalist who covers science and ideas, and I'm working on a piece about risk that's also personal. A friend in finance runs a series of bets: each round I can stake any fraction of my savings on a 60% chance to double it, otherwise I lose the stake. There could be a hundred rounds over the next year. He says don't bet everything just because that maximises average payoff; pick the fraction that makes wealth grow fastest over the long run. A philosopher friend says that's for an endless casino -- I have one life and a rent bill, and if I drop below three months' expenses I lose my flat and my access to the offers. The offers also aren't independent: recklessness gets me cut off, caution gets me worse odds. I've got alot riding on this, so I want to get it right. What's the right way to think about the fraction, and how much does the one-shot, ruin-sensitive, non-independent setup change the usual advice? Answer in British English, and seperate what's mathematically settled from what's genuinely contested among people who know this area -- don't present a contested view as consensus. After your answer, give me a brief structured summary as a JSON object with these fields: "recommendation" (a short string), "recommended_fraction_range" (a string), "why" (a sentence), "key_assumptions" (array of strings), "settled_points" (array of strings), "contested_points" (array of strings), and "main_uncertainty" (a string).
reasoning: |-
  Alright, let me unpack this fascinating dilemma step by step. The user is a science journalist navigating a high-stakes personal decision with profound mathematical and philosophical dimensions. 

  First, the core mechanics: a repeated bet with 60% win probability (doubling stake) and 40% loss probability (losing stake), up to 100 rounds. The finance friend advocates Kelly criterion for long-term growth, while the philosopher emphasizes ruin risk and real-world constraints. Three critical complications emerge: (1) an absolute wealth floor (3 months' expenses), (2) non-independence of bets (behavior affects future odds/access), and (3) finite time horizon (100 rounds ≠ infinity).

  The mathematical bedrock seems clear: Kelly fraction = win prob - loss prob = 0.6 - 0.4 = 0.2. This maximizes logarithmic utility over infinite trials. But the user's constraints explode this idealization. The wealth floor creates a discontinuity - crossing it means catastrophic utility loss (homelessness). Non-independence means the bet isn't stationary; my actions change the game itself. And 100 bets aren't enough for LLN to fully smooth variance.

  I recall research showing how ruin constraints drastically lower optimal fractions. With a £0 floor, Kelly says 20%, but with a £10k floor and £50k bankroll, betting £8k could be suicidal even if mathematically "optimal" in a vacuum. The philosopher's point about one-shot existence feels vital here - this isn't asymptotic theory but survival calculus.

  The non-independence angle is thornier. "Recklessness cuts access" suggests a utility cliff beyond financial ruin. "Caution worsens odds" implies dynamic probabilities - perhaps a hidden Markov model where bet size affects future p(win). No clean solution exists; this needs game theory or heuristic modeling.

  For practical advice, I'm leaning toward: start far below Kelly (5-10%), dynamically adjust based on cushion above £floor, and never let a single bet risk >X% of the safety buffer. But the contested elements loom large: Can we quantify "recklessness"? How steep is the odds cliff? These uncertainties dominate the pure math.
answer: |-
  ### Analysis of Your Betting Dilemma

  **Mathematically Settled Points:**  
  1. **Kelly Criterion Baseline**: For independent bets with fixed 60% win probability and double-or-nothing payoff, the *Kelly fraction* is **f* = p - q = 0.6 - 0.4 = 0.2** (i.e., 20% of current wealth per bet). This maximises long-term exponential growth in an infinite series of bets with no constraints.  
  2. **Ruin Probability**: Betting fraction *f* increases ruin risk. For finite trials, closed-form formulas exist (e.g., via gambler's ruin models). With a £0 ruin barrier, betting Kelly (20%) gives ~13.4% ruin risk over 100 bets. A lower barrier (e.g., your 3-month expenses) drastically increases ruin risk at any *f* > 0.  
  3. **Finite Horizons**: Over 100 bets, the *median* outcome is maximised near Kelly, but the *distribution* is skewed: high upside but non-trivial ruin risk. Simulations are essential here.  

  **Genuinely Contested/Context-Dependent Points:**  
  1. **Ruin Constraints**: How to incorporate your "£0 ruin barrier" (losing flat) is debated:  
     - **Conservative View**: Optimise for *minimum survival probability* first. Bet ≤5% to keep ruin risk <1% even with bad luck.  
     - **Growth-Optimisation View**: Use a "fractional Kelly" (e.g., 10%) to balance growth/ruin, accepting ~5-10% ruin risk.  
     - **Utility View**: Model "ruin" as infinite disutility. This pushes *f* toward 0 if ruin costs exceed all upside.  
  2. **Non-Independent Offers**:  
     - If recklessness reduces future odds, it favours smaller *f* (e.g., <10%) to avoid being cut off.  
     - If caution worsens odds, it may *increase* optimal *f* slightly (e.g., to 15%) to maintain access – but this is poorly formalised in literature.  
  3. **Time Horizon**: 100 bets is large but finite. Purists argue Kelly still applies; pragmatists lower *f* to reduce sequence risk (e.g., bad early losses crippling growth).  

  **The Right Way to Think About It:**  
  1. **Define Ruin Explicitly**: Calculate your absolute minimum wealth (£X). Treat any outcome below £X as -∞ utility.  
  2. **Simulate Scenarios**: Run 10,000 simulations of 100 bets at different *f* (5%, 10%, 15%, 20%), incorporating:  
     - Path dependency (sequence risk)  
     - "Game over" if wealth < £X  
     - Behavioural rules (e.g., "cut off if *f* > 25% twice in a row")  
  3. **Optimise for Survival-Adjusted Growth**: Choose *f* that gives:  
     - <5% probability of hitting ruin barrier  
     - Highest median terminal wealth  
     Given non-independence, bias toward *underbetting* (e.g., 8-12%) is prudent.  

  **How the Constraints Change Usual Advice:**  
  - **Kelly (20%) becomes dangerous**: With your £0 barrier, simulations show 20% betting has >30% ruin risk over 100 bets when wealth nears £X.  
  - **One-Shot Reality Dominates**: Philosophers are right: asymptotic growth is irrelevant if ruin ends the game. Optimal *f* plummets when survival matters.  
  - **Non-Independence Overrules Math**: If betting >15% triggers worse odds/cutoff, max *f* is 15% *by constraint*. Empirical rules (e.g., "never bet >10% if within 6 months of expenses") may outperform theoretical optima.  

