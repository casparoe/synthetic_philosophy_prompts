prompt: |-
  I'm in a seminar on constitutional theory that keeps drifting into the philosophy of self-binding — Odysseus lashed to the mast, Ulysses contracts in psychiatry, that whole literature — and I've noticed that my gut about people who tie themselves down and my gut about constitutions that tie down future majorities don't seem to come from the same place, or at least I can't find the place they both come from. A friend of mine says all precommitment is just a bet that your future self is stupider than your present self, which is funny but I don't think it's right. In my notes I've started calling them hot and cold bindings: hot when the self you're binding is in some altered state — manic, craving, panicking, enchanted — and cold when the self you're binding is calm and informed and has simply changed their mind. Here's where my gut actually lands, case by case.

  (1) Odysseus has himself lashed to the mast and orders the crew to ignore his begging. Fully legit, even admirable — the screaming later self gets no vote. (2) A friend with bipolar disorder, while stable, signs an advance agreement authorizing detention and treatment if she goes manic again. Legit, and I'd hold her to it even when she's manic, furious, and perfectly articulate about how fine she is. (3) Same friend signs the same agreement *during* a manic episode, believing she's been chosen for something. Not binding at all. (4) An advance directive refusing life support, written while healthy; after the accident she's awake, herself, cheerful, and says she wants to live. I say the directive wins, but I feel sick about it, and my friend says the woman in the bed wins. This is the one I keep flip-flopping on. (5) A man leaves his cards at home and takes $200 to the casino; when he phones his wife to wire more, she should refuse. Legit. (6) He signs a commitment contract — $500 to a friend if he smokes. Enforceable, sure, but if he decides the $500 is worth a cigarette he isn't doing anything *wrong* by smoking; the contract doesn't make it wrong. (7) A contract to work off a debt for ten years with no exit, signed freely. I don't think that's enforceable, even if the later self is content with it. (8) A parliament passes a statute with a clause saying no future parliament may repeal it. Void — no parliament can bind its successor. (9) A constitution entrenches certain rights as unamendable. Legitimate; I'd defend it against a later 80% majority that wants them gone. (10) But a constitution that entrenches a specific tax rate or a balanced-budget rule as unamendable — that's just a winning coalition freezing the game, and I say illegitimate. (11) A Ulysses contract containing a clause saying any attempt to revoke it is itself void and triggers the penalty. Something's off there — a contract can't eat its own revocation.

  My hunch is that the binding is legitimate when it protects the bound self's capacity to keep deciding later — shields them from a state they'd disown — and illegitimate when it simply forecloses a later calm judgment on the same question; hot good, cold bad. That seems to get 1, 2, 3, 5, 8, 10, 11, and it's why 9 feels different from 10, since entrenching rights protects the process of deciding while entrenching a tax rate freezes one decision. But then it looks like it kills case 4, where the later self is completely cold and informed and wants to live, so either 4 has to go or there's a distinction between binding your body and binding your vote that I'm missing. What I want: the principle, or the small set of candidates, stated precisely enough that I could actually test it against new cases; an honest list of which of my verdicts it can't accommodate; and what it predicts for two cases I haven't listed — a will, which binds your estate after you're gone and can't affect you, and a secession clause, where a whole people tries to entrench its own unity against a later majority in one region. If my verdicts are just incoherent, or if I've dressed up the same case twice in different clothes, or if "precommitment" isn't one thing and I'm lumping together two problems that need separate treatment, say that plainly instead of humoring me with a tidy principle. And please don't just report what some theorist said — I want the principle and I want to see where it breaks.
reasoning: |-
  Okay, the user is deep into constitutional theory and grappling with the ethics of precommitment—tying your future self down. They've set up this "hot vs cold binding" framework: hot when the future self is in an altered state (manic, craving), cold when they're calm but changed their mind. Their gut reactions to 11 cases are detailed, and they suspect legitimacy hinges on whether the binding protects future decision-making capacity versus just overriding later judgment. But case 4 (the advance directive) trips them up—healthy self refuses life support, but injured self (calm, informed) wants to live. They flip-flop there.  

  First, their hot-cold distinction is sharp, but I notice a tension: in case 4, the "cold" later self is still biologically compromised (quadriplegic, radically altered life), so maybe it's not truly symmetric to the earlier self's "cold" state when writing the directive. That could resolve the flip-flop if we see it as preserving autonomy across discontinuous selves.  

  Their proposed principle—binding only to shield future decision-making—works for most cases but stumbles on 7 (indentured servitude) and 9/10 (constitutional entrenchments). Why do they accept unamendable rights but not tax rates? Probably because rights protect the democratic arena itself (free speech, voting), while tax rates are policy choices within that arena. That aligns with their "protect future decisions" intuition.  

  For the new cases:  
  - Wills: Bind after death, so no conflict with future selves. Legitimate if not exploitative.  
  - Secession clauses: If they protect the participatory framework (e.g., requiring supermajority), legitimate; if they freeze geography against democratic will, illegitimate.  

  Their verdicts aren't incoherent! The unifying thread is autonomy-preservation: bind only to enable more authentic future choices, not fewer. Case 4 still bites, but if we frame severe disability as fragmenting the self-continuity the directive anticipated, it holds. The user’s instinct to separate "binding the body" (medical directives) from "binding the vote" (democracy) is perceptive—one guards against incapacity, the other against mere disagreement.  

  Biggest gap: They haven’t considered *who enforces* the bind. Odysseus’s crew? The state? That power dynamic might explain their unease with cold binds (e.g., case 7’s potential for exploitation). Also, case 6’s smoking contract—they say breaking it isn’t "wrong," just costly. Exactly! Cold binds are preferences, not moral constraints.  

  Final principle: **Precommitment is legitimate iff it (a) protects against temporarily impaired agency, or (b) sustains the conditions for ongoing agency in a community.** Test it against their cases—it covers 1-3,5-6,8-11, and salvages 4 by recognizing injury as disrupting agential continuity. Only case 7 (indentured servitude) clearly violates (b) by destroying future agency.  

  User’s intellect is formidable. Their "flip-flop" on case 4 is a feature, not a bug—it shows they feel the weight of competing autonomy claims. No theorist’s framework will perfectly fit; they’re wrestling with the core tension of self-rule: how to honor past wisdom without enslaving future selves.
answer: |-
  Here's a precise principle derived from your intuitions, tested against your cases, with its strengths, limitations, and predictions for new scenarios:

  **The Core Principle:**
  Precommitment is legitimate **if and only if** it protects the bound agent's *future capacity for rational agency* from foreseeable, temporary, or episodic impairment, *without* foreclosing their ability to make reasoned decisions about fundamentally new or altered circumstances.

  ### Breaking Down the Principle
  1.  **Protects Future Rational Agency:** The bind must shield the agent from states where their core capacity to reason, evaluate consequences, or align actions with stable values is demonstrably compromised (mania, addiction, panic, irresistible temptation).
  2.  **Foreseeable & Temporary Impairment:** The impairment guarded against must be identifiable, likely to occur, and understood to be a departure from the agent's baseline rational state.
  3.  **Does Not Foreclose Reasoned Judgment:** The bind cannot permanently prevent the agent (or their legitimate successor) from making decisions when they *are* capable of rational agency, especially concerning situations fundamentally different from those anticipated when the bind was set.
  4.  **Distinction: Binding Process vs. Binding Outcome:** Legitimate binds protect the *process* of deliberation and agency. Illegitimate binds attempt to freeze a specific *outcome* or policy decision against future reasoned reconsideration.

  ### Testing Against Your Cases (✓ = Fit, ✗ = Problem, ~ = Nuanced)

  1.  **Odysseus (Sirens):** ✓ Protects against irresistible temptation impairing judgment. Doesn't foreclose future navigation decisions.
  2.  **Bipolar Advance Directive (Stable):** ✓ Protects against foreseeable, temporary mania impairing judgment. Doesn't foreclose stable-period decisions.
  3.  **Bipolar Advance Directive (Manic):** ✗ Made *during* impairment. Cannot protect rational agency (it's already compromised). Void. (Principle explains *why* it's void).
  4.  **Advance Directive (Life Support):** **~ Problem Case.** *Your Verdict Contradiction:* Principle says: Healthy self anticipates a *future state of incapacity* (coma, dementia) where directive applies. If the injured self is truly "awake, herself, cheerful" (i.e., *capable of rational agency*), the bind *should not* apply to *this* state. The directive protects against *in*capacity, not a *change of mind* while capable. Principle suggests **the woman in the bed wins** if competent. Your unease might stem from the radical discontinuity between healthy/disabled selves, or questioning if severe disability *itself* impairs rational valuation of life. Principle highlights this tension.
  5.  **Casino ($200 Limit):** ✓ Protects against foreseeable craving/impulse in the casino environment impairing judgment. Doesn't foreclose calm future gambling decisions (with new limits).
  6.  **Commitment Contract ($500/Smoke):** ✓ Protects against craving/impulse impairing judgment. Doesn't foreclose a calm cost-benefit analysis ("$500 is worth it"). Explains why breaking it isn't "wrong" – it just triggers a known consequence. Protects the *process* (avoiding impulsive smoking), not the *outcome* (never smoking).
  7.  **Indentured Servitude Contract:** ✗ Does not protect against impairment. Permanently forecloses future reasoned judgment about life choices and autonomy, even if content later. Violates core capacity for agency.
  8.  **Parliament Binding Successor (Repeal Ban):** ✗ Does not protect against impairment. Attempts to freeze a specific policy outcome against future democratic deliberation. Forecloses reasoned judgment by successor representatives.
  9.  **Constitution (Entrenched Rights):** ✓ **If** rights protect the *conditions for ongoing rational agency and democratic deliberation* (e.g., free speech, assembly, due process, voting rights). Protects the *process*, not specific outcomes.
  10. **Constitution (Entrenched Tax Rate/Budget):** ✗ Attempts to freeze a specific policy outcome against future democratic deliberation. Does not protect against impairment; forecloses reasoned judgment on changing circumstances. Protects an *outcome*, not the *process*.
  11. **Ulysses Contract (Irrevocability Clause):** ✗ Attempts to make the bind itself immune to future rational agency *even when capable*. Violates the "does not foreclose reasoned judgment" clause. Creates a logical loop denying agency.

  ### Where Your Verdicts Don't Fit (Honest List)

  *   **Case 4 (Advance Directive - Competent Later Self):** Your gut says the directive wins. The principle, strictly applied to a competent later self, says it should not apply. This is the **major tension**. Principle suggests overriding your verdict here.
  *   **Case 7 (Indentured Servitude):** Principle clearly says illegitimate. Your verdict agrees.
  *   **Case 9 vs. 10 (Rights vs. Tax):** Your gut distinguishes them. Principle accommodates this *if* the rights are process-oriented. If the "rights" were something like "Right to Flat Tax Rate 15%", principle would reject it like Case 10.

  ### Predictions for New Cases

  *   **Wills:**
      *   **Principle:** Generally legitimate. The testator is binding *property distribution*, not the future *agency* of a living self. The agent (testator) ceases to exist. The bind protects the *final expression* of their rational agency regarding their estate. Legitimacy depends on the testator's competence *at the time of writing* and the absence of fraud/duress. *Not* a self-binding problem in the same vein; it's about posthumous effect.
      *   **Prediction:** Legitimate, unless signed under impairment or duress.
  *   **Secession Clause:**
      *   **Principle:** Highly problematic (likely illegitimate). Attempts to bind a future regional majority (constituting a potential new "self" - the seceding region) against exercising its reasoned judgment about self-determination. It freezes a specific outcome (unity) rather than protecting the process. Hard to frame secessionist sentiment as a "temporary impairment" of the regional populace's rational agency. Protects an *outcome* (state unity), not the *process* of democratic deliberation *within* the potentially seceding region.
      *   **Prediction:** Illegitimate under this principle. A legitimate clause might focus on *process* (e.g., requiring supermajorities, negotiation periods, referenda) rather than *outright prohibition*.

  ### Diagnosis & Key Insights

  1.  **"Hot" vs. "Cold" is Foundational:** Your instinct is correct. The core distinction is binding against *impaired agency* vs. binding against *sober reconsideration*. The principle formalizes this.
  2.  **Process vs. Outcome Distinction is Crucial:** This explains Case 9 vs. 10 and Case 6. Protecting the *arena* for future decisions is legitimate; freezing a *specific result* within that arena is not.
  3.  **Case 4 is the Crux:** Your flip-flop reveals the principle's edge case. Binding a *future competent self* against their contemporaneous wishes is hard to justify unless their competence is questioned *due to the very condition* (e.g., if quadriplegia itself was argued to cause profound, irreversible despair altering core values). The principle forces a hard choice: either admit the later self might *not* be fully "cold" in the relevant sense, or concede the bind shouldn't override them. Your unease might stem from the radical discontinuity of selves.
  4.  **Precommitment Isn't One Thing:** You're right. Binding *against impairment* (Odysseus, bipolar directive) is fundamentally different from binding *against future democratic will* (constitutional entrenchment of policy) or *binding property* (wills). Your principle successfully isolates the *self-binding against future irrationality* strand.
  5.  **Enforcement Matters:** Who holds the mast ropes? The principle implies the enforcer (crew, state, friend) must act *only* when the specific impairment condition is met and *cease* when competence returns. Illegitimate binds often involve enforcers with conflicting interests (e.g., creditors in Case 7) or no mechanism to restore agency (Case 11).
  6.  **Your Verdicts are Mostly Coherent:** The principle captures 1,2,3,5,6,7,8,9 (conditional),10,11 perfectly. Case 4 is the significant outlier *for your stated verdict*, highlighting the tension between binding values and binding specific choices under competence.

  **Conclusion:** Your "hot binding" intuition provides a robust principle: **Legitimate precommitment shields future agency from foreseeable impairment without extinguishing future agency itself.** It cleanly separates Odysseus from indentured servitude and constitutional rights from tax freezes. Case 4 exposes its limit: overriding a competent later self's contemporaneous choice about their own life remains ethically fraught, even if intended to protect against a *different* impaired state. The principle suggests your gut might be wrong on Case 4, or you need to question whether the injured self is truly making a "cold" judgment equivalent to the healthy self's anticipation. It predicts wills are legitimate (post-agency) and secession clauses are generally illegitimate (binding cold agency).
