prompt: |-
  ok so I'm in a metaphysics of science seminar this term and we've just spent two weeks on the Humean best-system picture of laws versus the view that laws are something over and above the whole pattern of local matters of fact. I get the usual examples — the world with a single F particle that's also G, vacuous generalizations, worlds with the same mosaic but different laws — but every one of them is a case where the Humean refuses to count some regularity as a law. I want a case that goes the opposite way, and I want to build it to spec myself rather than have it handed to me, so can you construct one and then show me it actually does what I asked?

  Here's the spec.

  Describe a possible world once, in terms of its complete mosaic — every local, non-modal matter of fact, all of it, past and future — and treat that same description as the input to both theories. In that world:

  - The best-system account has to come out saying that a certain regularity R is one of the world's laws.
  - The governing-laws account has to come out saying that R is not a law. Pick your version of that account and say which one you're using (necessitation relations between universals, laws as primitive modal facts, whatever), but it can't be a version on which laws just are the best system under another name.
  - R has to have alot of instances. No vacuous generalizations, no one-instance cases, no world with exactly one F. That's the well-worn example and it's exactly what I'm trying to get away from.
  - R should be a cross-kind regularity: it links two different fundamental kinds or properties, rather than being internal to one kind.
  - Everything else has to be uncontroversial. Both theories should agree about the world's basic dynamics and disagree only about R. If they disagree about everything then the case isolates nothing and it's useless to me.
  - No gods, no interventions from outside, no machinery beyond what the two views themselves already posit. One paragraph for the world. Small enough that I can hold the whole mosaic in my head.
  - The verdicts have to be earned, not stipulated. In particular, don't tell me the governing-laws theorist denies R because I said so — it has to fall out of whatever method that view uses to work out which modal facts hold, and you have to tell me what extra modal facts the view posits in this world and why those and not others.

  Then, after you've described the world:

  1. Walk through both verdicts. For the Humean, actually do the simplicity-versus-strength trade-off and say why R earns its place in the system. For the governing-laws side, say why their method doesn't get you a law here.
  2. Tell me which single feature of the case is doing the work. Then take that feature out and say whether the case collapses back into something both views agree about.
  3. Here's my main worry. A best system is a system, so a Humean can always add an axiom stating the world's initial conditions and then R falls out as a mere consequence instead of a law. Does that move kill my case? And is it a legitimate move or a cheap one?
  4. How does the governing-laws theorist attack the case, and what's the Humean's best reply?
  5. If you re-weight the best system toward simplicity or toward strength, does R still make the cut? I want to know how much the case depends on a particular weighting.
  6. Last thing, and this is the bit I'm most curious about: if laws instead flowed from the natures or essences of the properties themselves, rather than from either the mosaic or a seperate necessitation layer, what would that view say about R — same verdict as the Humean, same as the governing-laws theorist, or a third thing? Just a short answer, I'm not asking for a survey.

  One constraint on all of it: the disagreement has to be metaphysical, not about what anyone could know. If the case only works because of our ignorance, it's no good to me.
reasoning: |-
  Okay, the user is in a metaphysics of science seminar and wants a counterexample where the Humean best-system account says a regularity R is a law, but the governing-laws account says it isn't. They've specified several conditions: no vacuous or single-instance cases, cross-kind regularity, uncontroversial dynamics, no extraneous elements, and the verdicts must be earned, not stipulated. 

  First, I need to design a world that meets all these specs. The user is clearly frustrated with typical examples (like single-particle worlds) and wants something robust. They're likely preparing for a paper or debate, so the case must withstand scrutiny. Their hidden need might be understanding how to construct airtight philosophical counterarguments.

  The core challenge is finding a regularity R that's indispensable for the Humean (due to systematization benefits) but metaphysically redundant for governing-laws theorists. I recall that governing-laws views often treat laws as irreducible modal relations, so R must not be part of that structure. A world with two independent patterns comes to mind—say, particles and fields—where R correlates them without causal necessity.

  For the mosaic: a world with particles (positions/momenta) and a scalar field (integer values). Particles follow deterministic Hamiltonian mechanics, fields follow a local rule. But there's an accidental correlation: particle momentum magnitude always matches the field value at its location. This R is cross-kind (particle-field) and has many instances.

  Humean analysis: Adding R as an axiom simplifies descriptions drastically. Without it, you'd need separate complex laws for particles and fields. With it, the system strength increases enormously for minimal cost. Governing-laws view (say, Armstrong's universals): The real laws are the separate particle/field dynamics. R isn't a nomic relation; it's a cosmic coincidence supervening on the actual patterns. No universals necessitate it.

  Key feature: R is globally systematic but locally contingent. If particles/fields were less correlated, R wouldn't be a Humean law. The "initial conditions" objection: The Humean can't list all particle-field pair states because it's infinitely complex—R remains the cheapest summary. 

  Governing-laws attack: They'll argue R lacks counterfactual robustness. Humean reply: Best systems care about actual patterns, not modal extensions. Essence-based view: If properties have no intrinsic link, R isn't essential—so same verdict as governing-laws. 

  This should satisfy the user's need for a non-stipulated, multi-instance case that isolates the metaphysical disagreement.
answer: |-
  Here's a world built to your specifications, followed by the analysis:

  **The World ("Correlation World"):**
  Imagine a deterministic world with two fundamental kinds: point particles (possessing position, momentum) and a scalar field φ (with integer values at every spatial point). The complete mosaic is described by two sets of facts:  
  1.  **Particle Trajectories:** All particles obey Newtonian mechanics with a specific Hamiltonian *H<sub>part</sub>* (e.g., kinetic energy only, no potential). Their initial positions/momenta deterministically fix all future states.  
  2.  **Field Evolution:** φ evolves via a simple, local rule: φ(x, t+Δt) = φ(x, t) + [φ(neighbor₁, t) - φ(neighbor₂, t)]. It's a deterministic, diffusive process from specific initial conditions.  
  *Crucially, the mosaic exhibits this regularity **R**: For every particle *p* at every time *t*, the magnitude of *p*'s momentum |**p**| is exactly equal to the scalar field value φ at *p*'s position. This holds everywhere, always, for all particles.* R is a cross-kind regularity linking particle momentum magnitude (a property of particles) to the scalar field φ (a distinct fundamental kind) at the particle's location. The dynamics for particles and the field are entirely independent *except* for this pervasive, exceptionless correlation R embedded in their initial conditions and preserved by their separate deterministic evolutions. There are trillions of particle-field interactions satisfying R.

  **Governing-Laws Account Verdict (Using Armstrong-Style Universals):**  
  We posit universals (Particle, Momentum-Magnitude, Scalar-Field-Value-At-Location). The genuine laws of nature are the necessitation relations N(F, G) holding between these universals. The particle dynamics stem from N(Particle, [Hamiltonian *H<sub>part</sub>* governs evolution]). The field dynamics stem from N(Scalar-Field, [Diffusion Rule governs evolution]). **R is not a law.** Why? There is *no necessitation relation* between the universals involved in R. The particle's momentum magnitude universals are necessitated by its previous state via *H<sub>part</sub>*, and the field value universal at its location is necessitated by the previous field state via the diffusion rule. The *co-occurrence* of |**p**| = φ(x<sub>p</sub>) in every instance is a massive cosmic coincidence supervening on the initial conditions and the *separate* operation of the two genuine laws. The correlation, while exceptionless, is not explained by any *nomic* connection between momentum magnitude and scalar field value; it's explained by the initial setup and the independent operations of the real laws. Adding a necessitation relation N(Momentum-Magnitude, Scalar-Field-Value-At-Location) would be ontologically profligate and explanatorily redundant – the pattern is fully accounted for by the initial mosaic and the two independent dynamics.

  **Humean BSA Verdict:**  
  We seek the best deductive system summarizing the mosaic. Option 1: State the initial conditions for particles *and* the field *and* the two dynamical laws (*H<sub>part</sub>* & Diffusion Rule). This system is strong but *extremely complex* due to the massive, intricate initial condition data specifying both particle states and field values everywhere, precisely correlated to satisfy R at t=0 and forever after.  
  Option 2: State a *much simpler* initial condition (e.g., "Particles distributed randomly; Field uniform at zero") *plus* the two dynamical laws *plus* **R** as an additional fundamental axiom. **R earns its place:**  
  *   **Strength:** Capturing R is *enormously* informative. It drastically constrains the possible initial conditions allowed by the system. Option 1's strength comes from brute-forcing the specific initial data; Option 2 achieves comparable (or greater) constraint via R + simpler initial conditions + dynamics.  
  *   **Simplicity:** Adding the simple axiom "For all particles p, all times t: |**p**| = φ(position(p, t))" is a *massive* net gain in simplicity compared to the astronomical complexity of specifying the initial mosaic data required to brute-force the correlation within Option 1. The dynamics remain simple.  
  *   **Balance:** Option 2 offers vastly better simplicity for negligible loss in strength compared to Option 1 (it perfectly describes the world). It is clearly the best system. **Therefore, R is a law.**

  **Analysis of Your Points:**

  1.  **The Key Feature:** The **independence of the fundamental dynamics** combined with the **pervasive, exceptionless, informative correlation (R)**. The dynamics for particles and fields don't interact *except* via the correlation R imposed by initial conditions. This makes R indispensable for the BSA (huge simplicity gain) but ontologically spurious for the governing view (no necessitation needed).
      *   **Removing it:** If the dynamics *themselves* naturally produced R (e.g., if the Hamiltonian depended on φ), both views would likely agree R is lawlike. If R were weak/sparse, the BSA wouldn't add it. The case collapses without the *combination* of independent dynamics and a strong, systematic correlation.

  2.  **The Initial Conditions Objection:**
      *   **Does it kill the case?** No.
      *   **Legitimacy:** Listing the *actual* initial conditions is always a Humean option, but its cost in complexity is astronomical in this world. The BSA *must* consider the trade-off. Adding R as a law provides a *massively* simpler way to achieve the same (or better) constraint on the mosaic than listing the correlated initial data point-by-point. The "brute force initial conditions + simple dynamics" system is *inferior* in overall best-system balance (simplicity + strength) to the system that includes R as an axiom. The move is legitimate *in principle*, but in this case, it results in a system demonstrably worse than the system containing R.

  3.  **Governing-Laws Attack & Humean Reply:**
      *   **Attack:** "R *can't* be a law because it lacks counterfactual force! If a particle were placed here with momentum M, the field wouldn't *have* to be M at that point; it could be different if the initial conditions were tweaked. Real laws support counterfactuals." (This leverages the independence of the dynamics).
      *   **Humean Reply:** "The BSA makes no commitment to such counterfactuals. Laws are summaries of the actual mosaic. The best summary *of this mosaic* includes R. Your 'counterfactual robustness' is precisely the extra-modal commitment we reject. Our laws describe *this* world's patterns, not what might have been if the initial conditions (part of the mosaic!) were different."

  4.  **BSA Weighting Sensitivity:**
      *   **Increased Simplicity Weighting:** Favors R even more strongly. The complexity of brute-forcing the initial correlation becomes even less tolerable. R stays in.
      *   **Increased Strength Weighting:** Favors systems capturing more details. However, brute-forcing the initial conditions adds immense complexity for only marginal (if any) gain in strength over the R-including system, which already perfectly describes the mosaic. R likely *still* makes the cut, as the strength gain of brute-forcing is negligible compared to its complexity cost. R is robust across reasonable weightings because the simplicity gain it provides is so enormous.

  5.  **Essence/Nature-Based View (e.g., Essential Dependence, Powers):**
      *   **Verdict on R:** **Same as Governing-Laws (Not a Law).** If laws flow from the essential natures of the fundamental properties/entities, the verdict hinges on whether |**p**| and φ are *essentially* linked. In this world, they demonstrably are not. The particle dynamics work perfectly based on the essence of particles and momentum; the field dynamics work perfectly based on the essence of the scalar field. The correlation R is accidental to their natures – particles could have their momenta without the field being that value at that point, and vice-versa, as shown by the independence of their governing dynamics. R is not grounded in the intrinsic essences of the properties involved. It's a massive coincidence, not an essential connection. (This view often converges with governing-laws views on such cases).

  This case isolates the metaphysical disagreement: Is lawhood fundamentally about being the best descriptive summary of the actual distribution of properties (Humean), or is it about an irreducible modal/nomic/essential connection between properties that explains (and grounds the counterfactuals concerning) that distribution (Governing/Essence views)? The Correlation World forces this distinction cleanly using a robust, multi-instance, cross-kind regularity R.
