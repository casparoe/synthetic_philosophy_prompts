  Point (5) acknowledges the independence of CH, which is consistent with universism as long as one believes there's still a fact of the matter. But if CH is independent even with LCAs, how does that square with (1) and (6)? The user wants CH to be settled by axioms similar to LCAs, but current LCAs don't do that. So the tension between (1), (3), and (6) is key.

