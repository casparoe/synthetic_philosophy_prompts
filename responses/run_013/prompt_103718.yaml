  **Bottom Line:** While your view powerfully highlights the *arbitrariness* and *shifting nature* of the therapy/enhancement line, concrete cases involving **differential harm, resource allocation fairness, and the medicalization of non-pathological states** reveal contexts where the distinction retains practical/ethical weight that a pure "shifting spec" explanation struggles to fully dismiss.

  **Defender's Likely Response & Concessions:**
  *   **Concede:** The line *is* fuzzy, culturally relative, and shifts with normalization. "Normal function" is a statistical/social construct, not a divine blueprint. Regulatory distinctions *are* often arbitrary.
  *   **Wave Off:** Arguments relying heavily on "authenticity" or "cheating" as mere cultural hang-ups. The unfalsifiability point as non-fatal for a pragmatic/sociological view. Slippery slope arguments as speculative. Regulatory distinctions as evidence of the problem, not a counter.
  *   **Struggle With:** Cases where the *context* of use (e.g., Adderall for ADHD vs. exam cramming) creates a clear difference in risk/benefit ratio justifying the distinction, or where resource allocation *demands* a prioritization framework that the therapy/enhancement distinction, however imperfect, provides.

  **Unfalsifiability Status:** Your view *is* highly qualified and resilient due to the core "shifting baseline/normalization" mechanism. While this makes it hard to *falsify* definitively (as any counter-example can potentially be framed as a future candidate for normalization), it doesn't render it useless. Its strength is explanatory/pragmatic (describing *how* the line moves) rather than predictive. The "awkward" defeaters highlight where its explanatory power weakens despite this resilience.
