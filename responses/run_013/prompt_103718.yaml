prompt: |-
  OK so here's a view I've basically settled into and I want you to try to knock it down. I'm a software engineer, no formal philosophy training, so bear with the framing: I think the whole therapy vs. enhancement distinction in bioethics is basicaly made up. 'Therapy' just means restoring something to the spec it was supposed to have; 'enhancement' means pushing it past spec — and the spec is just whatever our current biology plus whatever tech we've already normalized. The line moves every time something becomes routine (nobody calls glasses or vaccines an enhancement now). So the distinction isn't tracking anything real, it's a bugfix/feature split where the 'intended behavior' was never actualy written down anywhere.

  What I want: what would actually count against this? Not just "the philosophers say..." — I mean the concrete cases, arguments, and intuitions that should move me, ranked from fatal to merely awkward. Include stuff that's arguably already happening (people taking drugs to do better on exams, embryo selection, cosmetic procedures that are also medical, that kind of thing). And be honest with me: has my view been qualified into being unfalsifiable, and is that a problem here or is it fine for a view like this? Tell me which defeaters a defender of my view would themselves concede and which they'd just wave off. And if there's some case where the therapy/enhancement line seems to do real work that my 'arbitrary spec' story can't explain, say so.

  Give it back as a table with these columns: defeater, kind (case / argument / intuition / empirical trend), decisiveness (fatal / serious / awkward / minor), what the defender concedes, and status (already happened vs. still hypothetical). Then a one-line bottom line underneath. American English please.
reasoning: |-
  Okay, the user is a software engineer with no formal philosophy training, presenting a view that the therapy vs. enhancement distinction in bioethics is arbitrary. They compare it to a software "spec" that evolves as technologies become normalized—like glasses or vaccines that were once enhancements but are now therapies. They want concrete counterarguments ranked by impact, not just philosophical assertions.

  First, I need to break down their core argument: therapy restores to "spec," enhancement exceeds it, and the spec shifts with societal normalization. They're skeptical this distinction reflects anything real.

  Now, considering counterarguments. I'll draw from bioethics debates—examples like Adderall misuse by students, where cognitive enhancement blurs into therapy for ADHD. Another is embryo selection for traits vs. preventing disease, which challenges what "normal function" means. And procedures like limb-lengthening for cosmetic reasons in short-statured individuals, which some see as therapy for psychological distress.

  The user also asks if their view is unfalsifiable. That's important—if any shift in the spec can be explained as normalization, it might be unfalsifiable. But is that problematic? In pragmatic terms, maybe not, but it could weaken the argument's rigor.

  I'll structure counterarguments by decisiveness: fatal, serious, awkward, minor. Fatal ones might challenge the core premise, like cases where enhancement causes harm that therapy doesn't, or where societal normalization doesn't resolve ethical issues (e.g., creating social pressure to enhance). 

  I'll include what a defender might concede—e.g., that normalization happens, but argue it doesn't make the distinction useless. For example, in resource allocation, prioritizing therapy over enhancement might be practical even if the line is fuzzy.

  Status matters too: real-world examples (Adderall misuse) vs. hypotheticals (genetic enhancements). This shows the distinction is already contested.

  Finally, the bottom line: while their view has merit in highlighting arbitrariness, it oversimplifies—the distinction still serves practical purposes in ethics and policy, even if imperfect.
