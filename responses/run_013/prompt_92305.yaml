prompt: |-
  Ok, long-ish question from someone with no econ or philosophy background, so bear with me.

  I'm a backend engineer. I have a brokerage account I mostly ignore, and over the last few months I've noticed that the same argument keeps showing up whenever somebody offers me anything. Some real examples from my life:

  - A recruiter cold-emailed me about a startup. My friend's take: if it were a good place to work they wouldn't have to cold-email people; the good ones get applicants.
  - I listed an old GPU at a price I thought was fair and someone offered me *more* than I was asking. My brother: nobody pays over asking unless they know something you don't, so don't sell it to him.
  - I found what looked like a free-money promo buried in a broker's API docs. Coworker: if that were real, thousands of people would already be farming it, you're not the first person to read that page.
  - My landlord offered to let me break my lease early if I found a replacement tenant. My partner: why would he offer that unless something's about to go wrong with the building?

  These all feel like one move, but when I try to actually write the move down, what's underneath it is different every time, and some of the versions contradict each other:

  (a) GPU case: the other side knows more than me, so run.
  (b) API case: the other side knows nothing more than me and neither does anybody else, so there's nothing there to find, so... also don't bother.
  (c) Recruiter case: it's kind of its own thing — the fact that they have to ask at all is itself the bad news, regardless of who knows what.

  So (a) and (b) are opposite stories about who's informed, and both get used to tell me to walk away, and (c) is a third thing that's about the asking rather than about the thing being offered. And the whole move obviously proves too much: why would a baker sell me bread unless he knows something bad about the bread? So there has to be some condition that switches the alarm on, and I can't find it.

  There's also a version of this that eats itself, which is the part that really got me going. If the argument works, then everyone knows it works, so everyone stays away from anything that smells like a deal, which makes the deal better for whoever does show up, which means... somebody should show up? I can't tell if that's a real observation or me just tying myself in knots.

  What I want to know: is there a name for the thing I'm circling? I'm not looking for "efficient markets" or "information asymmetry" or "caveat emptor" — I know those words, and each one covers maybe a third of this and none of them covers the whole. I'm after the specific move where the bare existence of an offer gets treated as evidence against taking it.

  And I won't be satisfied with just a label. I want:

  - the nearest real concepts, how they differ from each other and from my mash-up — I have a strong suspicion I'm squishing two or three separate ideas together and calling it one pattern
  - whether (a) and (b) are the same argument in different clothes or two genuinely different arguments that just happen to land in the same place
  - what the missing condition is that stops this from condemning every ordinary purchase, and whether that's one condition or several
  - the self-eating version: is that a known thing or a mistake on my part, and if it's known, is it treated as a real problem or a cute footnote
  - a borderline case I can test myself on. Mine is: a coworker offers to swap on-call shifts with me, purely because he wants the weekend off and I genuinely don't care which weekend I'm on. My gut says the "why is this available to me" alarm shouldn't fire there, but I can't articulate why not, and I'd like you to tell me which feature of that case is doing the work.

  If there's no name, coin one, but define it hard: what it covers, what it doesn't, and one case right on the edge where you'd be unsure whether to apply it.

  Last thing, two requests. I dont need sources or a reading list, I need the shape of the idea, so don't pad it with references. And please be honest about the status of what you're telling me: some of this is probably textbook-settled and some of it is stuff that people who study markets argue about forever. Keep those seperate — don't hand me a contested view dressed up as the consensus, and if the honest answer to part of this is "nobody agrees" or "your question is malformed in this specific way," say that instead of smoothing it over.
reasoning: |-
  Okay, the user presents a fascinating pattern they've observed across different scenarios: the mere existence of an offer is treated as evidence against accepting it. They've identified three variations (a, b, c) that seem contradictory yet all lead to rejection. Their core questions are about naming this pattern, disentangling its components, understanding its limits, and resolving the apparent paradox where universal application would make the argument self-defeating.

  Breaking this down systematically:

  First, the pattern itself isn't a single concept but a cluster of decision-making heuristics triggered by perceived asymmetries. The unifying theme is skepticism toward unsolicited opportunities, but the underlying mechanisms differ:

  - Scenario (a) (GPU overpayment) is classic information asymmetry where the buyer's behavior signals hidden value, invoking the lemon principle.
  - Scenario (b) (API loophole) represents efficient market hypothesis - if something were truly valuable, competition would have eroded it.
  - Scenario (c) (recruiter outreach) stems from signaling theory - the act of soliciting itself conveys negative information.

  The "why not every transaction" safeguard comes from context-dependent trust. Routine exchanges (like buying bread) operate within established frameworks with reputational safeguards, while outlier events (like unsolicited overpayment) trigger suspicion precisely because they deviate from norms. The coworker shift-swap example works because it's a symmetrical, low-stakes transaction within a trust-based relationship.

  The self-eating paradox is real and recognized - it's related to the "no-trade theorem" in finance, which argues that if all parties are equally rational/informed, mutually beneficial trades shouldn't occur. This fails in practice because markets have heterogeneity in beliefs, risk tolerance, and information. The paradox highlights why these heuristics can't be universally applied.

  For the borderline test case: the shift-swap passes because (1) symmetry (both parties have equal information), (2) low stakes, (3) clear personal motives without hidden dependencies, and (4) operates within an existing trust framework. The "why available" alarm only fires when there's unexplained asymmetry.

  Honesty about knowledge boundaries: While the component theories (signaling, EMH, information asymmetry) are well-established, their interplay in everyday skepticism isn't formally named. The GPU case's inversion of the lemon principle is particularly nuanced. The practical wisdom lies in recognizing which heuristic applies when - a skill more than a theorem.
answer: |-
  You've hit on a profound pattern in human skepticism about opportunities. The core move is **Skeptical Adverse Selection Heuristic (SASH)**, but it's actually three distinct mechanisms bundled together. Let's dissect it:

  ### The Three Mechanisms (Not One)
  1. **Asymmetric Information Alarm (your "a")**  
     - **Mechanism:** The other party's *behavior* signals they possess superior information.  
     - **Trigger:** An offer deviates strongly from expected behavior (e.g., overpaying).  
     - **Real Concept:** **Adverse Selection** (Akerlof's "Lemons Problem").  
     - *Your GPU case:* Buyer paying *above* market suggests they know the GPU is undervalued (e.g., mining potential, defect you missed).  

  2. **Competitive Exhaustion Test (your "b")**  
     - **Mechanism:** If the opportunity were genuinely valuable, competition would have exploited or corrected it.  
     - **Trigger:** The opportunity is easily discoverable/public.  
     - **Real Concept:** **Efficient Market Hypothesis (EMH)** at the behavioral level.  
     - *Your API case:* Free-money loopholes *should* be arbitraged away quickly if real.  

  3. **Solicitation as Signal (your "c")**  
     - **Mechanism:** The *act of making an unsolicited offer* itself conveys negative information.  
     - **Trigger:** The offer is proactive/pushy.  
     - **Real Concept:** **Signaling Theory** (Spence). Initiating contact signals desperation or hidden costs.  
     - *Recruiter/Landlord cases:* Cold emails/offers signal they can't attract organic demand.  

  ---

  ### Answers to Your Specifics
  1. **Are (a) and (b) the same?**  
     **No.** (a) assumes the *counterparty* knows more than you. (b) assumes *other market participants* (not necessarily the counterparty) would have exploited the opportunity if it existed. Both advise rejection, but for opposite informational reasons: (a) implies hidden risks, (b) implies no real opportunity.  

  2. **The Missing Condition (Why Not Every Purchase?)**  
     The alarm triggers only when **behavior deviates from expected equilibrium**.  
     - **Bread purchase:** The baker sells at market price through standard channels → no deviation → no alarm.  
     - **GPU overpayment:** Deviation → alarm.  
     - **Key filters:**  
       - Is the offer *unsolicited*?  
       - Is it *abnormally favorable* to you?  
       - Is there *no obvious cost* to the offeror?  
       - Does it *bypass normal channels*?  
     *(All your examples hit 3-4 filters; bread hits 0.)*  

  3. **The Self-Eating Paradox**  
     This is **real and recognized**:  
     - **Name:** **No-Trade Theorems** (Milgrom-Stokey). If all parties are rational and share common knowledge, no trade occurs because offers signal hidden defects.  
     - **Why it doesn't paralyze markets:**  
       - **Heterogeneity:** People have different risk tolerances, information, and needs (e.g., GPU buyer might urgently need that model).  
       - **Trust institutions:** Reputation, contracts, and regulations mitigate skepticism (e.g., you trust the baker due to health inspections).  
       - **Costly signals:** Some actions credibly prove value (e.g., warranties).  
     - **Status:** Theoretical cornerstone in finance, but real markets trade due to frictions. Not a footnote—it explains why "too good to be true" offers often *are*.  

  4. **Your Borderline Case: Coworker Shift Swap**  
     - **Why no alarm?**  
       - **Symmetry:** Both parties have equal information about the shift.  
       - **Clear motive:** Coworker's desire for a specific weekend is credible and understandable.  
       - **No hidden attributes:** The shift's "quality" is identical regardless of who takes it.  
       - **Low stakes/repeat play:** Workplace reciprocity norms create trust.  
     - **Alarm would trigger if:** Coworker insisted on swapping for a shift known to have a major outage risk (→ asymmetric info).  

  ---

  ### The SASH Boundary Test
  **Scenario:** A neighbor offers to sell you their car at 30% below market value. They say they're moving abroad.  
  - **Apply SASH?**  
    - ✅ Unsolicited offer  
    - ✅ Abnormally favorable price  
    - ❓ Motive plausible but unverified  
    - **Verdict:** Alarm triggers. Could be legitimate (need quick sale) or adverse selection (hidden defects). Requires investigation (mechanic inspection).  

  **What SASH Doesn't Cover:**  
  - Market-price transactions with trusted entities (e.g., Amazon).  
  - Offers where the offeror's motive is transparent and costly to fake (e.g., charity donations).  

  ---

  ### Honest Assessment
  - **Textbook-Settled:**  
    The three mechanisms (adverse selection, EMH, signaling) are foundational in economics. Their *combination* in everyday skepticism is observed but not formally named.  
  - **Contested/Unresolved:**  
    - How often SASH leads to false negatives (missed opportunities).  
    - Whether culture/experience affects its accuracy.  
  - **Your Insight's Novelty:**  
    Spotting the *tension* between (a) and (b) is acute. Economists treat them separately, but in practice, people weaponize whichever fits the context.  
  - **Question Malformation?**  
    You’re not squishing concepts—you’ve identified how laypeople *operationalize* these theories into a unified heuristic. The label isn’t standardized because academia studies the pieces, not the deployed bundle.  

  **Final Coinage:**  
  **Skeptical Adverse Selection Heuristic (SASH)**  
  *A decision rule rejecting unsolicited opportunities where the offeror's behavior (deviation from norms, solicitation, or lack of competition) signals hidden costs or absent value.*  
  **Core trigger:** An unexplained asymmetry in initiation or terms.
