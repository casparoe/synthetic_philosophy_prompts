prompt: |-
  I'm a software engineer with no formal training in philosophy, and I share a flat with a former quantitative trader; a recurring argument between us keeps ending the same way, with him saying that a rational agent simply maximizes expected value, as though that settled the matter. The latest occasion was a game he proposed: a fair coin is tossed until it comes up heads, and the payout doubles with each tails — one unit if heads on the first toss, two if the first is tails and the second is heads, four, eight, and so on — so that the expected payout is infinite. He maintains that because the expected value is infinite I should be willing to pay any finite sum to play, and he treats my refusal as a demonstration that I am being irrational rather than as a difficulty for his principle. I cannot tell whether he is making a deep point, a trivial one, or quietly changing the subject, and I would like that untangled before our next round.

  What I want from you is a menu of the distinct precise claims that 'a rational agent maximizes expected value' could be making, laid out as separate readings rather than as a single explanation, with a verdict on each: which readings are true but empty (a stipulation about what the words will mean, say, or a tautology about preference satisfaction), which are substantive and defensible (a claim about long-run frequencies when the same gamble is repeated, for instance, or about the coherence of a set of preferences), and which are simply false. For each reading, please say what kind of 'expected value' it requires — money, utility, something else — and whether it treats the expectation as a guide to a single unrepeatable decision or only to sequences of decisions. I would also like you to tell me which readings would actually get him from 'the expectation is infinite' to 'you are irrational for refusing,' and what would have to be added for that step to work: is the move from money to utility a repair of the principle or a change of subject, does the argument need the game to be repeatable or the decision to be one among many, and does anything survive if the expectation is not even well defined?

  It would help if you tested the readings against two contrasting cases as well: the one-off gamble in which he would stake a serious fraction of his savings on a favourable but volatile coin flip, where I think he is wrong, and the repeated small-stakes wager that he is plainly right about, since whatever reading makes him right in the second case is presumably the one he wants in the first. The final answer should read as a list I can bring to the kitchen table, and there is no need for references — I am interested in the arguments, not in who has made them.
reasoning: |-
  Okay, the user is a software engineer sharing a flat with a former quantitative trader. They keep arguing about whether a rational agent should always maximize expected value. The specific example is the St. Petersburg paradox game, where the expected payout is infinite, but the user refuses to pay a large sum to play. The quant trader insists this refusal is irrational. The user wants a clear breakdown of different interpretations of "rational agents maximize expected value," with evaluations of each.

  First, I need to outline the distinct possible readings of the claim. The key is to separate different meanings and assess each one. The user mentioned wanting a menu of precise claims, so I should list them as separate readings. Each reading should specify what "expected value" refers to (money, utility, etc.), whether it applies to single or repeated decisions, and if it supports the quant's argument.

  Starting with the trivial interpretations. One reading could be that "rational agent" is defined as one that maximizes expected value. That's a tautology—true by definition but empty. It doesn't help in actual decisions because it doesn't specify what is being maximized. In this case, the quant's argument would be circular, but it doesn't explain why refusing the gamble is irrational.

  Another trivial reading is maximizing expected monetary value (EMV). But this is false because people don't act that way, as shown by the St. Petersburg paradox. Risk aversion and diminishing utility of money make this impractical. The quant's argument fails here because infinite EMV doesn't translate to infinite utility.

  Then, substantive interpretations. Long-run frequency in repeated trials: if the game is played many times, the average payout should be high. This works for repeated small bets but not one-off large gambles. For St. Petersburg, even with repetition, the growth rate is slow, so paying a huge entry fee isn't justified. The quant's argument holds only if the game is repeated and fees are low.

  Coherence of preferences (Dutch book arguments). This says that to avoid sure losses, preferences should align with expected utility. It's defensible but uses utility, not money. So the quant's move from EMV to utility is a repair, not a change of subject. But without specifying utility, the argument doesn't force the user to pay any finite amount.

  Expected utility theory with unbounded utility. If utility is linear and unbounded, then infinite expected utility would require paying any finite sum. But this assumes utility is linear in money, which isn't realistic. The quant might push this, but it's not defensible for large amounts.

  Risk aversion and bounded utility. Here, utility functions like logarithmic make the expected utility finite. So refusing to pay a large sum is rational. This undermines the quant's argument.

  The user also wants contrasting cases: one-off large gamble vs. repeated small stakes. For the favorable coin flip with a fraction of savings, maximizing EMV is risky, but expected utility with risk aversion would refuse. For repeated small wagers, even with risk aversion, it's rational to play.

  Now, which readings support the quant's argument? Only the unbounded expected utility or the long-run with low fees. But both have caveats. The quant needs to assume linear utility or repetition with manageable fees. Otherwise, the argument fails.

  The user's deeper needs: they want to understand if they're missing something in the argument, and how to counter it. They need clear points to present at the kitchen table. Also, they might feel their intuition is valid but lack the philosophical terms to articulate why.

  I should structure each reading with: name, what EV means, single/repeated, verdict, and if it supports the quant. Then summarize which readings the quant relies on and what's needed for his conclusion. Highlight that without repetition or unrealistic utility, his argument doesn't hold.
answer: |-
  Here is a menu of distinct readings of "a rational agent maximizes expected value," evaluated for substance, truth, and applicability to your arguments. Each reading specifies the type of value, decision context, verdict, and whether it supports your flatmate's claim that refusing the St. Petersburg gamble (or a large favorable bet) is irrational. Two test cases are used:  
  - **Test Case 1 (Large One-Off):** A single coin flip where you win 3x your stake with 60% probability (e.g., bet $10,000 to win $30,000). Your flatmate says a rational agent should take it.  
  - **Test Case 2 (Repeated Small):** A repeated 60/40 coin flip in your favor, winning $1.10 vs. losing $1.00 each time. Your flatmate says a rational agent should play repeatedly.  

  ### The Readings  
  *(Key: **Value Type** = What is maximized? **Decision Context** = Single or repeated? **Verdict** = True/False/Empty? **Quant's Argument** = Does this reading support "refusing St. Petersburg is irrational"?)  

  1. **The Tautological Reading**  
     - **Value Type:** "Value" is defined as whatever the agent consistently maximizes. Not specified (could be utility, money, etc.).  
     - **Decision Context:** Any decision.  
     - **Verdict:** **True but empty.** This reduces to "a rational agent does what a rational agent does." It offers no guidance for real choices.  
     - **Quant's Argument?** ❌ No. Calling refusal "irrational" is circular. It doesn’t justify infinite stakes in St. Petersburg.  
     - **Test Cases:** Fails both. It cannot explain why refusing Test Case 1 might be reasonable or why accepting Test Case 2 is obvious.  

  2. **Maximize Expected Monetary Value (EMV)**  
     - **Value Type:** Money (linear, unbounded).  
     - **Decision Context:** Any decision (single or repeated).  
     - **Verdict:** **False and indefensible.** Humans (and rational agents) do not value money linearly: losing $100,000 hurts more than gaining $100,000 helps. St. Petersburg’s infinite EMV ≠ infinite practical value.  
     - **Quant's Argument?** ✅ Superficially yes, but the principle is flawed. EMV ignores risk aversion, bankruptcy, and diminishing returns.  
     - **Test Cases:**  
       - Test Case 1: EMV = (0.6 × $30,000) + (0.4 × -$10,000) = $14,000. Suggests "bet," but risking savings for volatile gains is reckless.  
       - Test Case 2: EMV per flip = (0.6 × $1.10) + (0.4 × -$1.00) = $0.26. Correctly says "play," but for the wrong reason (it ignores risk).  

  3. **Long-Run Relative Frequency (Law of Large Numbers)**  
     - **Value Type:** Money (average payout over many trials).  
     - **Decision Context:** **Repeated decisions only.**  
     - **Verdict:** **Substantive and defensible for repeated trials.** Over many identical, independent gambles, maximizing expected money maximizes almost-sure long-term wealth.  
     - **Quant's Argument?** ⚠️ Only if St. Petersburg is repeated *with affordable stakes*. For one-off games or infinite expectations, it fails.  
     - **Test Cases:**  
       - Test Case 1: ❌ Fails. One flip → no "long run."  
       - Test Case 2: ✅ Correct. Playing maximizes long-term wealth.  
     - **St. Petersburg Application:** If you play St. Petersburg *repeatedly with low entry fees* (e.g., $25 per game), long-run average payout will exceed costs. But for a **one-off** game with **high stakes** (e.g., $1M entry), long-run arguments don’t apply.  

  4. **Coherence (Dutch Book) Reading**  
     - **Value Type:** Utility (a consistent scale for preferences).  
     - **Decision Context:** Any decision (single or repeated).  
     - **Verdict:** **Substantive and defensible.** To avoid being "Dutch booked" (i.e., manipulated into guaranteed losses), preferences must align with *some* utility function via expected utility (EU). *Not* the same as EMV.  
     - **Quant's Argument?** ❌ No. This forces consistency, not infinite stakes. EU theory allows bounded utility (e.g., log(wealth)), making St. Petersburg’s EU finite. Refusing is rational if utility is bounded.  
     - **Test Cases:**  
       - Test Case 1: You can coherently refuse if marginal utility of $30k < disutility of losing $10k.  
       - Test Case 2: Coherence requires playing if you accept identical small risks.  

  5. **Unbounded Expected Utility (EU) Reading**  
     - **Value Type:** Utility (linear/unbounded in money).  
     - **Decision Context:** Any decision.  
     - **Verdict:** **False.** Assumes utility scales linearly with money *without limits*. Humans (and rational agents) have bounded utility (e.g., $1M vs. $1B isn’t 1000× better). Infinity problems arise.  
     - **Quant's Argument?** ✅ Yes, but the premise is flawed. If utility is linear/unbounded, infinite EU → pay any finite amount. But this is unrealistic.  
     - **Test Cases:**  
       - Test Case 1: Forces acceptance (utility linear → no risk aversion).  
       - Test Case 2: Forces acceptance, but for the wrong reason (linearity isn’t real).  

  6. **Risk-Neutral EU with Empirical Calibration**  
     - **Value Type:** Utility (linear in money *for small stakes*).  
     - **Decision Context:** Many small, independent decisions.  
     - **Verdict:** **Defensible for small stakes.** For bets where outcomes don’t significantly alter total wealth, EU ≈ EMV.  
     - **Quant's Argument?** ❌ No. St. Petersburg has *extreme stakes* (e.g., 50% chance of > $1B if 30+ tails). Not "small stakes."  
     - **Test Cases:**  
       - Test Case 1: ❌ Fails. Stakes are large → risk matters.  
       - Test Case 2: ✅ Correct. Approximates EMV.  

  7. **Subjectivist/Bayesian Reading**  
     - **Value Type:** Utility (weighted by subjective probabilities).  
     - **Decision Context:** Any decision.  
     - **Verdict:** **Substantive and defensible (if utility is bounded).** Rational agents maximize EU under subjective beliefs.  
     - **Quant's Argument?** ❌ No. If your utility function is bounded (e.g., log-wealth), St. Petersburg’s EU is finite (~$10–$20). Paying $1M is irrational.  

  ### How the Quant’s Argument Succeeds or Fails  
  - **For St. Petersburg:** His argument **only works** under **Reading 5 (Unbounded EU)** or **Reading 2 (EMV)**. Both are false. Under defensible readings (3, 4, 7), refusal is rational:  
    - With bounded utility (Readings 4, 7), EU is finite.  
    - With repetition (Reading 3), you need low entry fees and many trials.  
  - **Repairing the Principle:** Moving from money to utility (Readings 4, 5, 7) is **not a change of subject**—it’s the core repair. But it *doesn’t save* the quant’s argument unless utility is linear (which it isn’t).  
  - **Expectation Undefined?** If variance is infinite (like St. Petersburg), EMV is mathematically defined but practically meaningless. EU with bounded utility resolves this.  

  ### Your Kitchen Table Summary  
  | **Reading**                 | **Value Type** | **Context** | **Verdict**               | **Quant Wins?** |  
  |-----------------------------|----------------|-------------|---------------------------|-----------------|  
  | Tautological                | Undefined      | Any         | True but useless          | ❌ No           |  
  | EMV                         | Money          | Any         | False                     | ✅ Yes (but invalid) |  
  | Long-Run Frequency          | Money          | Repeated    | True for repeated small   | ⚠️ Only if repeated & cheap |  
  | Coherence (Dutch Book)      | Utility        | Any         | True (with bounded utility)| ❌ No           |  
  | Unbounded EU                | Utility        | Any         | False                     | ✅ Yes (but invalid) |  
  | Small-Stakes Risk-Neutral   | Utility        | Many small  | True for small bets       | ❌ No           |  
  | Subjective EU               | Utility        | Any         | True (with bounded utility)| ❌ No           |  

  **Conclusion:** Your flatmate’s argument holds only under discredited readings (EMV or Unbounded EU). Defensible rationality requires maximizing **expected utility with bounded scales**, making refusal rational for one-off St. Petersburg or large volatile bets. For repeated small-scale gambles, he’s right—but that’s Reading 3, which doesn’t extend to extreme cases. The "move to utility" is essential, but it undermines, not supports, his stance on St. Petersburg. Next round, ask: "Should you bet your life savings on a 60% chance of tripling it? If not, why insist on linear utility?"
