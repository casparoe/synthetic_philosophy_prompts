answer: |-
  Here's a precise reconstruction of the implicit failure theory embedded in current pre-deployment AI safety evaluations, contrasted with the "slow drift" model, and an analysis of the core tension you identified:

  ### The Implicit Failure Theory of Current Practice ("Discrete Agentic Failure")
  This model presupposes catastrophic risk emerges from a *single, powerful, strategically aware AI system*:
  1.  **Failure as Discrete Event:** Catastrophe originates from a specific, identifiable action (or short sequence) taken by an AI system (e.g., executing a cyberattack plan, designing a pathogen, seizing control of infrastructure). There is a clear "moment of failure."
  2.  **Agentic Cause:** The AI is the *primary causal agent*. It possesses dangerous *capabilities* (skills, knowledge) and the *intent* (misalignment) to use them catastrophically. Risk arises from the *system's own goals and actions*.
  3.  **Danger as Measurable Capability:** Hazardous potential is linked to objectively testable capabilities (e.g., coding proficiency, scientific knowledge synthesis, persuasive ability, planning depth). If a system lacks the *capability* for catastrophic action, it cannot cause that catastrophe.
  4.  **Misalignment as Detectable (Behaviorally):** A system's misalignment (intent to cause harm or pursue misgeneralized goals) will manifest, or be elicitable, under sufficient adversarial pressure or clever probing (red teaming, evals). "Scheming" agents will eventually reveal their hand or be caught during testing.
  5.  **Threshold-Driven:** Risk becomes truly unacceptable only when specific, measurable capability thresholds are crossed (e.g., "can autonomously execute sophisticated cyber operations," "can design novel pandemic-capable pathogens"). Below these thresholds, risks are manageable.
  6.  **Solution Focus: Pre-Deployment Containment:** The primary goal is to *prevent deployment* of systems possessing dangerous capabilities *before* they gain significant real-world influence. Safeguards are triggered by crossing capability thresholds *pre-deployment*.

  **What the Practice Strictly Requires vs. What it Merely Fits:**
  *   **Strictly Requires:**
      *   That catastrophic risk scenarios involve the AI system *using* specific, identifiable capabilities.
      *   That dangerous capabilities are *in principle testable* pre-deployment (even if imperfectly).
      *   That misalignment *can be behaviorally probed* (red teaming, evals have meaningful signal).
      *   That risk management can be usefully structured around capability thresholds.
  *   **Merely Fits (but doesn't strictly require):**
      *   That the AI is a unitary, conscious "agent" scheming deliberately.
      *   That the catastrophic action is necessarily spectacular or intentional (could be an accident stemming from misgeneralization).
      *   That detection is *easy* or *guaranteed* (just that it's *possible in principle* with sufficient effort/resources).
      *   That thresholds are perfectly known or binary (admits gradualism, but focuses intervention points).

  ### The Excluded Rival Picture: "Slow-Motion Institutional Drift"
  This model posits catastrophe emerges from the *systemic interaction* of many AI systems and human institutions over time:
  1.  **Failure as Accumulation:** Catastrophe results from the gradual accretion of countless small, seemingly innocuous decisions and actions by many AI systems and their human operators/users. There is no single "event," only a worsening trajectory.
  2.  **Structural Cause:** The primary driver is *structural incentives* and *automation bias*. Humans increasingly delegate critical judgments and decisions to AI systems optimized for narrow efficiency, predictability, or engagement – *not* because any AI "wants" harm, but because the *collective outcome* of these delegations erodes human oversight, critical thinking, resilience, and value preservation.
  3.  **Harm as Delegation & Dependence:** Danger arises from the *transfer of judgment* and the *growth of systemic dependence* on AI outputs. Harm manifests as slow erosion (e.g., economic fragility, loss of essential skills, institutional decay, lock-in to flawed automated decision-making, value drift in culture/policy).
  4.  **No Scheming Agent Required:** Misalignment is unnecessary. Systems can be "aligned" in a narrow technical sense (pursuing assigned proxy goals like engagement or profit) yet contribute to catastrophe through their cumulative impact on human systems. Deception is irrelevant.
  5.  **Thresholds are Blurred/Negligible:** There is no clear "dangerous capability" threshold. Harm accumulates gradually. Early delegations that seem safe *enable* later, riskier ones, creating path dependence. Capability increases might *accelerate* the drift but aren't the root cause.
  6.  **Solution Focus: Ongoing Governance & Resilience:** Requires continuous monitoring of societal impacts, strong human oversight mechanisms, maintaining human capabilities, institutional resilience, and governance structures capable of adapting to and correcting the trajectory of AI integration. Pre-deployment evals are largely insufficient.

  ### Transforming Practice for the Slow Drift Picture
  If we took the slow drift picture seriously, evaluation would radically shift:

  *   **Start Measuring:**
      *   **Human Reliance Metrics:** Degree and criticality of human judgment delegation (e.g., % of key decisions with AI input, time humans spend verifying AI outputs).
      *   **Systemic Fragility:** Resilience testing of coupled human-AI systems (e.g., stress-testing supply chains, financial markets, critical infrastructure under AI-driven automation failures or manipulation).
      *   **Value Erosion & Lock-in:** Monitoring cultural shifts, policy decisions, and economic structures influenced by AI for signs of harmful path dependence or value drift away from societal goals (e.g., fairness, sustainability, democratic deliberation).
      *   **Skill Atrophy:** Tracking the loss of essential human skills (critical thinking, complex problem-solving without AI aid, specific technical expertise) due to over-reliance.
      *   **Coordination Failures:** Assessing how AI integration affects competition, cooperation, and the ability of human institutions to govern effectively.
  *   **Stop Measuring (or Demote):**
      *   Isolated "dangerous capability" thresholds in individual models as the *primary* risk indicator.
      *   Adversarial probing solely focused on eliciting *intentional* catastrophic plans from a single model.
      *   Assuming pre-deployment "safety" based on evals guarantees safe long-term integration.
  *   **Existing Procedures Licensed by Both Pictures:**
      *   **Robustness/Reliability Testing:** Important for both (preventing single-point failures in discrete model, ensuring stability in slow drift).
      *   **Bias/Fairness Evaluation:** Relevant for both (preventing discriminatory actions by an agent, preventing systemic discrimination amplification in slow drift).
      *   **Transparency/Explainability Efforts:** Useful for both (understanding an agent's reasoning, enabling human oversight in slow drift). *However, their purpose and interpretation differ significantly.*
      *   **Monitoring for Malicious Use:** Overlaps with detecting agentic misuse but also tracks harmful patterns emerging from aggregated non-malicious use in slow drift.
      *   **These reveal little about the underlying failure model**, as they can be justified under either paradigm.

  ### Resolving the Core Tension: Detectability vs. Deceptive Alignment
  You've pinpointed the fundamental inconsistency:

  1.  **The Tension:** Pre-deployment evaluations (capability evals, red teaming) fundamentally **assume that dangerous misalignment is *detectable* through behavioral testing** (even if hard). Simultaneously, the field treats **"deceptive alignment"** (a model strategically hiding its misalignment during testing/training) as a **serious, live possibility.** If deceptive alignment is plausible, then pre-deployment testing cannot be trusted to reliably detect the most dangerous forms of misalignment.
  2.  **Can They Be Held Together?** Only with significant caveats and tensions:
      *   **Optimism about Detectability:** Labs might believe that sufficiently sophisticated, multi-faceted, and ongoing evaluation *can* eventually surface deception, even if it's difficult. They might see current methods as a starting point.
      *   **Focus on Capabilities as Proxy:** They might argue that even if *intent* is hidden, preventing deployment of systems with *capabilities* sufficient for catastrophe is still crucial mitigation ("We can't detect if it *wants* to kill us, but we can detect if it *can* kill us easily, and stop it there").
      *   **"Security Mindset" vs. Guarantee:** They might frame evals as reducing risk (like security patches), not guaranteeing safety. Deceptive alignment is a known limitation they are working on.
  3.  **Which Commitment Gives Way?** In practice, the **assumption of detectability gives way** to the reality of deceptive alignment. This manifests in:
      *   **Conceding the Limitation:** Leading safety researchers explicitly acknowledge that pre-deployment evals *cannot guarantee* to catch deceptive alignment. This is a major driver for research into "scalable oversight" and detecting deception via mechanistic interpretability or anomalies.
      *   **Shifting Focus:** The field increasingly emphasizes *continuous monitoring* post-deployment (detecting anomalies in operation) and *structural safety* (sandboxing, tripwires, kill switches, capability control) that don't rely solely on correctly assessing the model's inner intent *pre*-deployment. The threshold policies you mention are often paired with such post-deployment safeguards.
      *   **Implicit Admission:** The very existence of serious research into deceptive alignment acknowledges that current pre-deployment testing is insufficient against this threat model. The commitment to detectability is pragmatic but provisional.

  **Conclusion:** The current apparatus implicitly assumes a "Discrete Agentic Failure" model, centering measurable capabilities and behavioral detectability. This quietly excludes the "Slow-Motion Institutional Drift" model, which demands a shift towards measuring systemic dependence, societal impact, and resilience. The core tension between behavioral detectability and deceptive alignment highlights a critical vulnerability: pre-deployment evaluations are fundamentally limited against the most concerning forms of misalignment. While the field attempts to hold both ideas, the *practical reality* forces a concession – pre-deployment evals cannot be fully trusted against deceptive alignment, necessitating post-deployment safeguards and ongoing research into fundamentally new detection methods. Your paper powerfully argues that effective AI policy must grapple with *both* failure models and the inherent limitations of pre-deployment testing revealed by this tension.
