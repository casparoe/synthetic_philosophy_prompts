prompt: |-
  A friend of mine, a historian of science who has spent years writing about fringe claims, has over time pronounced verdicts on a long run of cases, and I have been trying to reverse-engineer the rule she is actually running. She calls astrology pseudoscience. She calls the literal-Atlantis reading of Plato's Timaeus pseudohistory. She calls Erich von Däniken's ancient-astronaut claims pseudoscience. She calls Anatoly Fomenko's New Chronology pseudoscience. She regards the ordinary scholarly wrangling over Egyptian chronology — the radiocarbon disputes over Old Kingdom dates, the arguments about which king reigned when — as entirely legitimate. She treats the Younger Dryas impact hypothesis, the claim that a comet or airburst triggered the sudden cooling at the start of the Younger Dryas, as a legitimate if hotly contested scientific hypothesis rather than pseudoscience. And she calls the claim of a lost Ice Age civilization of the sort Graham Hancock popularizes pseudohistory.

  The case she has not ruled on is this. A geologist argues that the heavy erosion on the Sphinx enclosure could only have been produced by prolonged rainfall, which would push the monument's construction thousands of years earlier than Egyptologists date it; he reads the profession's indifference to the argument as evidence of a cover-up, declines to submit it to the journals that would referee it, and does not engage the archaeological and epigraphic evidence bearing on the question. The geological core of his claim — what the weathering pattern implies about past rainfall, and hence about age — is in principle checkable against paleoclimate and weathering data. What will she call it: pseudohistory, or a legitimate if probably mistaken empirical claim?

  I care less about the verdict than about the machinery. Set out the candidate rules that fit her earlier verdicts equally well — a testability or falsifiability criterion, a Lakatos-style criterion about whether the program is progressive or degenerating, a social or institutional criterion about whether the claim is submitted to and answers the relevant expert community, or something else — say what each predicts about the Sphinx case, give me your best guess at which rule she is running and why, and name the further case that would best tell the candidate rules apart. Throughout, be explicit about which parts of this are settled among people who work on demarcation and which are genuinely contested, and do not present a contested position as though it were the consensus.
reasoning: |-
  Hmm, the user is asking me to analyze their historian friend's methodology for distinguishing legitimate scholarship from pseudohistory/pseudoscience. They've provided several clear examples of how their friend has categorized different claims:

  - Astrology, von Däniken's ancient astronauts, and Fomenko's New Chronology are called pseudoscience
  - Literal Atlantis interpretation and Hancock's Ice Age civilization are pseudohistory
  - Ordinary Egyptian chronology debates are legitimate scholarship
  - Younger Dryas impact hypothesis is a legitimate (though contested) scientific hypothesis

  Now they present a new case about the Sphinx erosion hypothesis where a geologist claims the weathering indicates much earlier construction, but refuses to engage with archaeological evidence or submit to peer review. They want me to:
  1. Propose candidate rules that explain all previous verdicts
  2. Predict what each rule would say about the Sphinx case
  3. Guess which rule the friend is actually using and why
  4. Suggest a test case to distinguish between rules
  5. Clarify what's settled vs. contested in demarcation literature

  Looking at the examples, I see a pattern emerging. The rejected claims (astrology, von Däniken, Fomenko, literal Atlantis, Hancock) all seem to share characteristics of evading falsification, not engaging with counter-evidence, or alleging conspiracies. Meanwhile, the accepted claims (Egyptian chronology debates, Younger Dryas hypothesis) appear to be testable claims that engage with existing evidence and scholarly processes.

  For candidate rules, I consider several established demarcation frameworks:
  - Popper's falsifiability: Does the claim make testable predictions?
  - Lakatos's research programs: Is the theory progressive or degenerating?
  - Institutional criteria: Is it submitted to expert communities?
  - Social behavior: Does it allege conspiracies when challenged?

  For the Sphinx case prediction:
  - Falsifiability rule would likely call it legitimate (since the weathering claim is testable)
  - Lakatos rule would probably call it pseudohistory (due to avoidance of counter-evidence)
  - Institutional rule would clearly call it pseudohistory (due to refusal of peer review)
  - Social behavior rule would call it pseudohistory (due to "cover-up" allegations)

  My best guess is that the friend is primarily using an institutional/social rule, possibly combined with Lakatosian elements. This explains why the Younger Dryas hypothesis (which engages with scientific processes) is legitimate despite being contested, while the Sphinx claim (which rejects those processes) would be pseudohistory.

  To distinguish between rules, I suggest a test case: A falsifiable claim that's submitted to journals but rejected for legitimate methodological reasons, where the proponent then alleges bias. The institutional rule would still view it as legitimate (since due process was followed), while social behavior rules might categorize it differently.

  Throughout this, I'll need to be careful to note where demarcation criteria are contested among philosophers of science - particularly the limitations of falsifiability alone, and the ongoing debates around social/institutional factors.
answer: |-
  Based on your description of your friend's verdicts, here are the candidate rules that fit her pattern, their predictions for the Sphinx case, my best guess at her actual rule, a proposed test case to distinguish them, and a clear demarcation of settled vs. contested positions in philosophy of science.

  **Candidate Rules & Predictions for the Sphinx Case:**

  1.  **Core Falsifiability/Testability Criterion (Popperian-inspired):**
      *   **Rule:** A claim is pseudoscience/pseudohistory if its core empirical assertions are *structurally unfalsifiable* (e.g., rely on untestable entities, constantly evade disconfirmation) or have been decisively falsified. Legitimate claims must make empirically testable predictions, even if controversial.
      *   **Fits Verdicts:** Yes. Astrology/Däniken/Fomenko/Hancock/Atlantis often evade falsification or rely on untestable premises. Standard Egyptology/chronicles/YD Impact make testable claims about evidence.
      *   **Sphinx Prediction: LEGITIMATE (but mistaken) EMPIRICAL CLAIM.** The core geological claim (weathering pattern = prolonged rainfall) *is* empirically testable against paleoclimate and weathering data. The refusal to engage other evidence/alleged cover-up are methodological flaws, not intrinsic unfalsifiability.
      *   **Settled/Contested:** *Settled:* Basic falsifiability is a widely accepted *necessary* (but not sufficient) condition for science. *Contested:* Whether it's sufficient (many falsifiable claims are pseudoscience), how strictly "falsifiable" is defined, and its applicability to history.

  2.  **Lakatosian "Progressive vs. Degenerating" Research Programme:**
      *   **Rule:** A claim is pseudoscience/pseudohistory if it forms a "degenerating research programme": it avoids novel predictions, focuses on defending core assumptions from falsification (ad-hoc adjustments), ignores or dismisses contradictory evidence from other fields, and fails to generate new knowledge. Legitimate claims are part of "progressive programmes" generating novel, confirmed predictions and integrating evidence.
      *   **Fits Verdicts:** Very well. Astrology/Däniken/Fomenko/Hancock/Atlantis typically avoid novel tests, reinterpret failures, and dismiss counter-evidence (e.g., archaeology for Hancock). Standard Egyptology/chronicles generate new findings and refine models. YD Impact *aims* for novel predictions (like impact proxies) and engages evidence, even if contested.
      *   **Sphinx Prediction: PSEUDOHISTORY.** The geologist's approach is classic degeneration: ignoring archaeological/epigraphic counter-evidence, refusing peer review (avoiding scrutiny), alleging a cover-up (defensive move), and focusing solely on defending the core claim rather than generating new, integrative knowledge. It fails to engage with the broader research programme of Egyptology.
      *   **Settled/Contested:** *Contested:* Lakatos's framework is influential but debated. Critics argue it's often applied retrospectively, is vague about defining "progress," and undervalues evidence integration over pure prediction.

  3.  **Institutional/Community Engagement Criterion (Merton/Bourdieu inspired):**
      *   **Rule:** A claim is pseudoscience/pseudohistory if it systematically *rejects the norms and institutions* of the relevant scholarly community: refusing peer review, dismissing established methodologies/evidence bases without engagement, alleging conspiracies to explain lack of acceptance. Legitimate claims engage with the community's processes and evidence, even when challenging orthodoxy.
      *   **Fits Verdicts:** Excellently. Astrology/Däniken/Fomenko/Hancock/Atlantis often bypass peer review, dismiss mainstream methods/evidence, and allege conspiracies ("academia is hiding the truth!"). Standard Egyptology/chronicles thrive within institutional norms. YD Impact proponents *do* engage peer review, present at conferences, and respond to critiques within scientific frameworks.
      *   **Sphinx Prediction: PSEUDOHISTORY.** The geologist's refusal to submit to journals (rejecting peer review), dismissal of archaeological/epigraphic evidence, and allegation of a "cover-up" based on "indifference" are textbook violations of institutional scholarly norms. The claim is defined by its rejection of the community process.
      *   **Settled/Contested:** *Contested:* While scientific communities/norms are real, defining *which* community is relevant and whether institutional rejection *defines* pseudoscience is debated. Critics call this sociological and potentially elitist/circular ("science is what scientists do").

  4.  **Adversarial Epistemology/Social Behavior Criterion (Pigliucci/Hansson inspired):**
      *   **Rule:** A claim is pseudoscience/pseudohistory if proponents exhibit characteristic *adversarial social behaviors*: evading accountability (avoiding peer review), exploiting controversy for attention/promotion, misrepresenting evidence/opponents, alleging persecution/conspiracy, and isolating the claim from critical discourse or contradictory evidence. Legitimate claims welcome scrutiny and engage with counter-arguments.
      *   **Fits Verdicts:** Very well. The rejected cases consistently show these behaviors (Däniken's sensationalism, Fomenko's conspiracy claims, Hancock's dismissal of archaeology, Atlantis proponents ignoring Plato's context). Accepted cases involve open engagement within disciplinary norms.
      *   **Sphinx Prediction: PSEUDOHISTORY.** The geologist's refusal of peer review (evasion), allegation of a cover-up (conspiracy thinking), and dismissal of archaeological evidence (isolating the claim) are classic adversarial behaviors. This pattern likely triggers her verdict more than the specific geology.
      *   **Settled/Contested:** *Contested:* Identifying specific behaviors is descriptive, but critics argue it risks being ad hominem and doesn't address the epistemic content itself. It's widely observed but not a formal consensus demarcation criterion.

  **Best Guess for Her Rule & Why:**

  *   **Most Likely Rule: A hybrid of the Institutional/Community Engagement Criterion (#3) and the Adversarial Epistemology/Social Behavior Criterion (#4), with strong Lakatosian (#2) undertones.**
  *   **Why:**
      1.  **Pattern Match:** The clearest common thread in her rejections (Astrology, Däniken, Fomenko, Atlantis, Hancock) is their *rejection of or isolation from mainstream scholarly processes and evidence bases*, often accompanied by conspiracy rhetoric. The acceptance of YD Impact hinges on its *engagement within* scientific institutions despite controversy. Standard Egyptology is the epitome of institutional engagement.
      2.  **Sphinx Prediction Alignment:** Rules #2, #3, and #4 all strongly point to "pseudohistory" for the Sphinx case, given the described behavior. Rule #1 points the other way. Her pattern suggests she places high weight on *how* a claim is advanced and its relationship to the relevant expert community.
      3.  **"Cover-up" Dismissal:** Her rejection of claims often involves proponents alleging suppression (implied in Däniken/Fomenko/Hancock/explicit in Sphinx). This is central to #3 and #4.
      4.  **Indifference to Purely Falsifiable Core?** Rule #1 fits less well because the *core* of Hancock's geology or the Sphinx weathering *might* be falsifiable in isolation, yet she rejects Hancock and likely the Sphinx claim. Her verdicts seem driven by the *holistic practice* surrounding the claim.

  **Test Case to Distinguish the Rules:**

  *   **The Case:** A proponent develops a radical, testable geological hypothesis challenging mainstream archaeology (e.g., proposing a significantly older date for a major monument *based solely on a new, specific, falsifiable geological technique*). They:
      *   Submit multiple papers to relevant geology and archaeology journals.
      *   Papers receive rigorous peer review and are rejected based on methodological critiques from both fields (e.g., flaws in the technique's application, ignoring contradictory archaeological context).
      *   The proponent *revises their methods*, addresses critiques in subsequent submissions, publishes in lower-tier but legitimate journals after significant revision, and presents at mainstream conferences, engaging earnestly with critics.
      *   The hypothesis remains highly controversial and likely mistaken, but gains *some* limited, cautious interest from a minority in both fields due to the novel method.
  *   **Distinguishing Predictions:**
      *   **Rule #1 (Falsifiability):** Would call it **LEGITIMATE**. The core claim is testable and being tested via institutional processes, even if controversial.
      *   **Rule #2 (Lakatos):** Would lean **LEGITIMATE**. The programme shows signs of *attempting* progress: making novel predictions (from the technique), responding to criticism (method revision), engaging with evidence (archaeological critiques). It's not degenerating *yet*.
      *   **Rule #3 (Institutional):** Would call it **LEGITIMATE**. The proponent is fully engaging with the norms and institutions of the relevant communities (peer review, revision, conferences), regardless of outcome.
      *   **Rule #4 (Social Behavior):** Would call it **LEGITIMATE**. The proponent exhibits pro-social scholarly behavior: welcoming scrutiny, revising based on critique, engaging earnestly, avoiding conspiracy rhetoric.

  This case isolates the *behavior and institutional engagement* from the *inherent testability* and the *current success* of the research programme. If your friend calls this legitimate, it strongly supports Rules #2, #3, or #4 over #1. If she calls it pseudohistory, it strongly supports a stricter interpretation of #2 (seeing it as inherently degenerative despite engagement) or perhaps a different rule altogether. Her verdict on the Sphinx case (likely pseudohistory based on behavior) will also be highly informative.
