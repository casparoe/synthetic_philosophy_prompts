answer: |-
  **Exam Question**

  A lab studies how people come to follow arbitrary conventions, such as which side of a sidewalk to walk on. In its preprint, the lab argues that conformity is 'reduced' to reward learning: people conform because the brain treats social approval as a prediction-error signal, and the lab reports that individual differences in that signal track how quickly subjects adopt a group's convention. The preprint also posits a 'conformity drive' — a disposition to align with whatever the local majority does — and treats that drive as a primitive the theory does not decompose. A commentator calls the whole thing a textbook case of greedy reductionism.

  **Your Task:**

  1.  **State short, operational tests:** Define a test someone could use to identify a proposed explanatory element as a *skyhook* versus a *crane*. Define a separate test someone could use to identify an explanation as committing *greedy reductionism*. For each test, clearly state what specific evidence would flip the initial verdict (i.e., turn a skyhook into a crane, or show greedy reductionism is *not* occurring).
  2.  **Apply the tests:** Apply both of your stated tests to the preprint described in the stimulus. Explicitly state whether each test condemns or vindicates the preprint (or specific parts of it). Conclude whether the commentator's charge of "textbook case of greedy reductionism" lands, and if so, on which specific part(s) of the preprint. Clearly distinguish what the tests condemn from what they vindicate.
  3.  **Crane conversion and levels convention:** Explain what the lab would *specifically* need to do to convert the posited 'conformity drive' from a potential skyhook into a crane. Finally, take a side and argue: if the picture of distinct "levels" of explanation (like neural, cognitive, social) is merely a convention of how we *talk* about phenomena, rather than reflecting how the world *is*, does the explanatory framework relying on skyhooks, cranes, and greedy reductionism collapse? Why or why not?

  ---

  **Model Answer (Approx. 650 words)**

  The commentator's charge of greedy reductionism partially lands, specifically targeting the preprint's leap from neural mechanisms to conformity behavior while skipping necessary cognitive/social levels, though its neural reward-learning account functions as a valid crane; the 'conformity drive' is a skyhook, which could be converted into a crane by decomposing its cognitive mechanisms, and the entire explanatory framework fundamentally relies on real, non-conventional levels to avoid collapse.

  **1. Operational Tests**
  *   **Skyhook/Crane Test:** To test if a proposed element (X) is a skyhook or crane: Ask "Is X asserted to explain a phenomenon but is itself asserted to be *primitive* or *unconstructed* from lower-level processes?" If yes, X is a *skyhook*. If X is described as being *built from* or *constituted by* lower-level processes and mechanisms, then it is a *crane*. **Evidence to Flip Verdict:** Finding evidence or providing a mechanistic account showing how X itself is assembled from, or emerges via processes operating at, a lower level would convert a skyhook into a crane. Conversely, showing a proposed crane relies on an unexplained primitive element would reveal a hidden skyhook.
  *   **Greedy Reductionism Test:** To test if an explanation (E) commits greedy reductionism: Ask "Does E claim to explain a higher-level regularity (H) *directly* and *exclusively* by appealing to facts or mechanisms at the *lowest* level (L) under consideration, while failing to account for *how* the phenomena or regularities at intervening levels (I) arise *from* L or contribute *to* H?" If yes, E commits greedy reductionism. **Evidence to Flip Verdict:** Providing a step-by-step account showing how phenomena/structures at intervening levels (I) are built from lower level (L) mechanisms *and* how those I-level phenomena/structures then contribute to generating H would show the reduction is not greedy.

  **2. Applying the Tests to the Preprint**
  *   **Reward Learning Mechanism:** The preprint explains conformity via neural-level reward learning/prediction-error signals correlated with behavioral adoption speed. Applying the Skyhook/Crane test: This mechanism is *not* treated as primitive. It is grounded in established lower-level neuroscience (neurons, dopamine signaling). Individual differences tracking behavior suggest it's a mechanism built from lower levels. This part functions as a **crane**.
  *   **The 'Conformity Drive':** The preprint posits this drive as a "primitive" disposition "the theory does not decompose." Applying the Skyhook/Crane test: It is asserted to explain alignment behavior but is itself asserted to be unconstructed. No lower-level account is offered. This is a classic **skyhook**.
  *   **Greedy Reductionism Test:** The preprint claims to "reduce" conformity (a high-level social/behavioral regularity, H) directly to neural reward learning (a low-level neural mechanism, L). It reports a correlation between L (neural signal) and H (behavioral speed). Crucially, it skips intervening levels: it does not explain how the neural signal (L) gives rise to *cognitive* states like recognizing a norm, forming an intention to conform, or valuing group alignment (I1). Nor does it explain how these cognitive states interact within a *social* context of group dynamics or norm enforcement to produce the behavioral regularity of widespread conformity (I2). It jumps straight from L to H. This **commits greedy reductionism**.
  *   **Commentator's Charge:** The charge of "textbook greedy reductionism" **lands**, but specifically on the core claim of "reducing" conformity directly to neural reward learning. The commentator is correct that this leap skips essential intervening levels (cognitive/social). However, the tests **vindicate** the specific neural mechanism (reward learning signal) as a potentially valid crane *at its own level*. The tests **condemn** the 'conformity drive' as a skyhook and the overall reductionist claim as greedy due to the skipped levels.

  **3. Converting the Drive & Levels Convention**
  *   **Converting the Skyhook:** To convert the 'conformity drive' from a skyhook into a crane, the lab would need to *decompose it*. Instead of treating it as primitive, they must propose and investigate the *lower-level cognitive (and potentially social learning) mechanisms* that constitute this disposition. For example: How do individuals detect majority behavior (perception/attention)? How do they represent the group norm (cognition/memory)? What valuation processes compare the cost/benefit of conforming vs. deviating (decision-making)? How do past learning experiences shape this valuation? Showing how this disposition is assembled from such cognitive mechanisms, potentially grounded in neural processes like the reward signal they studied, would make it a crane.
  *   **Levels as Convention?** The explanatory framework **collapses** if levels are merely conventional. The distinction between a crane and a skyhook *requires* a non-conventional hierarchy: a crane is defined by being constructed *from* lower-level processes. If levels are arbitrary labels, then "lower-level" loses meaning, and the crane/skyhook distinction dissolves. Similarly, greedy reductionism is defined by *skipping* substantive intervening levels of organization and causation. If these levels aren't real – if there are no stable phenomena or mechanisms operating at (say) the cognitive level that *mediat*e between neural activity and social behavior – then the charge of "skipping" levels becomes incoherent. The entire critique relies on the premise that the world *is* structured in levels, and good explanation must respect that causal architecture. If levels are only a convention of exposition, the framework loses its grounding in how explanations map onto reality.

  ---

  **Marking Scheme (20 marks total)**

  1.  **Clear, Operational Tests (4 marks):** Tests for skyhook/crane and greedy reductionism are stated as distinct, actionable procedures a critic could use. Each includes a specific condition for flipping the verdict. *(Common Mistake: Vague tests lacking clear criteria or flip conditions, or conflating the two tests.)*
  2.  **Accurate & Nuanced Application (4 marks):** Both tests are correctly applied to distinct elements of the stimulus. The neural mechanism is identified as a crane; the drive is identified as a skyhook; the reductionist claim is identified as greedy (due to skipping cognitive/social levels). The verdict on the commentator's charge is clear and distinguishes condemned/vindicated parts. *(Common Mistake: Misapplying tests (e.g., calling the neural mechanism a skyhook, missing the greediness of the reduction claim, not distinguishing elements).)*
  3.  **Specific Crane Conversion Plan (4 marks):** Provides a concrete, plausible strategy for decomposing the 'conformity drive' into lower-level (primarily cognitive) mechanisms, moving beyond simply labeling it a skyhook. *(Common Mistake: Vague or non-existent plan, e.g., "study it more," or confusing this with addressing greedy reductionism.)*
  4.  **Coherent Stance on Levels Convention (4 marks):** Takes a clear side on the framework's survival if levels are conventional and provides a reasoned argument focusing on why the core distinctions (crane/skyhook, greedy/non-greedy reduction) *depend* on levels being non-conventional. *(Common Mistake: Unclear stance, irrelevant points, or failure to connect the dependence of the core distinctions on the reality of levels.)*
  5.  **Overall Structure & Argument (4 marks):** Response is well-organized, addresses all parts of the question directly, flows logically from the initial bottom line, and demonstrates a cohesive understanding by integrating the tests, application, conversion, and levels argument. *(Common Mistake: Disjointed points, missing a required task part, or significant incoherence undermining the argument.)*
