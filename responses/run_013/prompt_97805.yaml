answer: |-
  ## The Watermark Rhyme

  Stanton-on-Rye flooded. Not catastrophically, not every year, but often enough that the Flood Management Committee was less a civic body and more a weary reflex. Their real work happened not in the damp-choked parish hall, but in the three days after Old Man Tiller spotted the first ominous discoloration on the Watermark Stone embedded in the riverbank wall – a porous limestone block that darkened like a bruise as the water table rose.

  For generations, the response was dictated by the Watermark Rhyme, chanted by children skipping rope, muttered by shopkeepers boarding windows:

  *When the Stone shows grey,*
  *Call the men to stack the hay.*
  *When the Stone turns black,*
  *Fetch the sacks from off the rack.*
  *Stack them high beside the track,*
  *Mind the Horse, don’t look back.*
  *Sand and rope and brick and board,*
  *Keeps the river from our hoard.*

  Clara Pendleton, newly elected to the Committee (mostly because no one else wanted it), found the rhyme charmingly archaic, the procedures bafflingly precise. Hay? What hay? The ‘rack’ was a collapsing shed behind the old mill. The ‘Horse’ was a crumbling stone marker near the bridge, not an animal. Yet, when the Stone greyed last autumn, she’d watched, fascinated, as the town snapped into action with seamless, unthinking efficiency.

  Bert Coombs, the stoic, seventy-year-old chairman, seemed the linchpin. He didn’t command; he simply *was* there when the Stone changed, a silent, grizzled catalyst. Men Clara had never seen lift anything heavier than a pint appeared at the hayloft above the Red Lion. Teenagers materialized to wrestle mildewed sacks of sand from the shed. Mrs. Gable, the postmistress, distributed coils of rope and stacks of wooden boards from her lean-to without needing a list. They stacked hay bales *precisely* twelve feet from the Horse marker, filled sandbags in a specific criss-cross pattern, braced vulnerable doorways with boards set at an exact angle. They did it all while humming the rhyme, or fragments of it, like a secular hymn. It worked. The waters rose, lapped at the defences, and receded, leaving only mud and relief.

  "It’s instinctive," Clara declared at the first dry-weather committee meeting, beaming at Bert. "Generational knowledge! Muscle memory! You, Bert, you *understand* the river. You see the pattern we don’t." Bert just grunted, polishing his glasses on his jumper.

  This year, the Stone blackened early after relentless rain. Bert, however, was laid up with pneumonia. Panic, thin and cold, rippled through the Committee meeting. "Who calls the men for the hay?" "Where’s the key to the rope lean-to?" "Does ‘Mind the Horse’ mean touch it or avoid it?" The rhyme suddenly felt like nonsense syllables.

  Clara saw her moment. "It’s alright!" she announced, projecting calm authority she didn't entirely feel. "It’s a *system*. Bert embodies it, but the system *is* the rhyme. We just need to… decode it."

  She took charge. The grey had already come and gone; the Stone was pitch black. "Right! ‘Fetch the sacks from off the rack.’ That’s the sandbags. Roger, take Billy and get them. ‘Stack them high beside the track’ – that’s the raised footpath by Mill Lane, obviously. Stack them there!"

  People moved, relief replacing panic. Clara, flushed with purpose, elaborated as they worked. "See? ‘Mind the Horse, don’t look back.’ The Horse marker is the focal point. We orient the defences *from* there. Don’t look back – focus forward, on the task! The hay bales last year? Shock absorption! Primitive but effective. The stacking pattern? Maximises friction and stability. The board angles? Hydrodynamics! Deflecting the current.” She invented plausible-sounding reasons as she went, weaving physics and folklore. The townsfolk listened, nodding slowly. Understanding dawned on their faces. *She* understood. She made the dumb rhyme *smart*.

  They built the defences under Clara’s confident direction, following her interpretations of the rhyme’s ‘hidden meaning’. It looked similar, mostly. Hay bales went near the Horse (though stacked a little haphazardly without Bert’s silent nudges). Sandbags lined the path. Boards braced doors.

  The floodwaters surged higher than anyone remembered. Clara’s defences held… mostly. But where the ancient stone wall met the bakery, water found a gap. Not a large one, but enough to send a filthy stream gushing into the cellar, ruining sacks of flour and Ann Hobbs’ prize-winning sourdough starter.

  As the murky water receded, leaving stinking silt, the mood was sombre. Ann surveyed the damage, tears cutting tracks through the grime on her cheeks. "Never happened before," she muttered, not accusingly, just stating a fact that hung heavy in the damp air.

  Clara felt a hot flush of shame. Her beautiful system had leaked. She reviewed her notes, her confident interpretations. Had she misread "beside the track"? Had the hay bales been placed *further* back last time? What *was* the hydrodynamic principle for board angles?

  Later, clearing debris near the breached wall, Clara overheard young Billy talking to Roger. "Me Nan always said," Billy chirped, mimicking an old woman’s wheeze, "'When the Stone shows grey, Call the men to stack the hay.' Means get the heavy stuff done first 'fore the ground gets soggy. 'When the Stone turns black, Fetch the sacks from off the rack.' Means the wet's coming *fast*, so grab the sand quick. 'Stack them high beside the track' – well, the track’s the highest ground near the Horse, innit? 'Mind the Horse, don’t look back.'" Billy paused, thoughtful. "Dunno about minding the Horse, but 'don’t look back'... Nan said that meant don't fuss about whether you stacked the hay perfect once the sand's needed. Keep moving forward." He shrugged. "Dunno about the rest."

  Clara froze. Billy’s explanation was completely different from hers – just as plausible, just as arbitrary. It wasn’t physics. It wasn’t Bert’s inscrutable wisdom. It was just... what his Nan said. Another layer of confabulation draped over the mindless repetition.

  Bert returned, pale but steady, for the clean-up. He didn’t lecture. He didn’t refer to Clara’s system or Billy’s Nan. He just walked the defences, his boots sucking in the mud, occasionally tapping a sandbag that needed restacking, nodding at a board that was angled just so. People watched him, then adjusted their work. The rhythm returned, quieter now, less hummed, more felt.

  Next spring, a minor greyening of the Stone. Bert was there, leaning on his stick. Clara watched, no longer eager to decode. She saw the men head for the hayloft without being called. She saw the sacks emerge from the shed. She saw the hay bales stacked precisely twelve feet from the Horse marker – not because of friction coefficients, but because that’s where they’d *always* been stacked when the Stone first greyed. She saw Mrs. Gable hand out the ropes and boards with the same practised ease. The rhyme wasn't hummed much, but its structure held.

  Clara realised the competence hadn’t been *in* Bert, not really. It had been in the doing, the repetition, the ingrained sequence of the rhyme itself – a set of instructions as mindless and effective as water finding its own level. Her explanations, Billy’s Nan’s sayings, they were just comforting stories whispered over the hum of the machine. The river didn’t care. The rhyme didn’t know. The people just… did. And mostly, it worked.

  She watched them stack the hay. Bert caught her eye and gave the faintest nod, not of approval, but of shared presence. Then he looked away, his gaze settling on the ancient Horse marker. Clara followed his gaze. A single, fresh crack ran down its weathered flank – a flaw no one had noticed before, unimportant, unexplained, and already part of the landscape.
