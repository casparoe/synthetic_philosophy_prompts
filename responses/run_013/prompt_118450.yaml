  I'm in a small reading group that meets in the back room of a pub on Tuesdays — six of us: me (I did an MSc in quaternary science years ago before defecting into science writing, so I'm the group's stratigraphy pedant), Nadia, who's a historian of science and empire, someone from climate policy, a philosopher we keep around mainly for the arguments, and two others who mostly drink. Last week's topic was the Anthropocene and it got heated, mostly between me and Nadia. I know the formal epoch proposal went down in 2024 — the subcommission voted it down and then the ICS and the IUGS confirmed the rejection — but we never got clear on what that vote was a decision *about*, and I'm definately not as sure as I sounded on the night that Nadia's position was the weak one. I suspect she's got more than I gave her credit for, and I also think I do, and I'd like to see it laid out properly rather than re-litigated over a third pint.

  So: write the dialogue between me and Nadia, roughly a page, and make it even-handed — she shouldn't be a strawman and neither should I, and I want real back-and-forth where she answers what I actually said and I answer what she actually said, not two polite monologues passing each other. Let each of us concede something real at some point, and let it end unresolved rather than with one of us seeing the light. Things I specifically want in it, because these are the bits that actually bite and we kept skirting them: (a) the fact that stratigraphy has basically two instruments for fixing a boundary — a golden spike driven into one specific layered section that everyone agrees to point at, which is what they proposed at a Canadian lake whose sediments are annually laminated, after winnowing twelve candidate sites down to one, versus a date simply agreed by committee — and that the second instrument is normally reserved for the deep past where there's no fossil record to point at, so the Anthropocene is the strange case where we *had* a marker and still couldn't settle whether choosing it counts as discovery or as stipulation; (b) the rival start dates and what each one makes the story be about — the steam engine, so industrial capital; the 1610 dip in atmospheric CO2 following the collapse of Indigenous populations in the Americas, so conquest and dispossession; the mid-century bomb-test plutonium spike, so great-power technological hubris — and whether picking one is a measurement or a verdict about who's to blame; (c) whether "epoch" is a technical rank with criteria attached or just a grand word for "period," and whether that's the whole disagreement or only a slice of it; and (d) something that's bugged me since the pub — 1950 as the base of the proposed unit is also the arbitrary zero point the radiocarbon people picked when they built the method, so a chunk of the time scale ends up anchored to a lab convention, and I want Nadia to tell me whether that bothers her for the reasons it bothers me or for completely different ones. Get the stratigraphy technically right, please, since half the reason I lost the argument was that I was hand-waving about what actually makes a boundary correlate across the world.
