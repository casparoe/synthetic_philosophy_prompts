answer: |-
  ## MaximCheck™: Frequently Asked Questions

  **1. What is MaximCheck?**
  MaximCheck is the industry leader in Ethical Action Pre-Verification™. Customers input a proposed personal maxim (a rule guiding a specific action) into our proprietary Kantian Consistency Engine™. The Engine instantly evaluates whether this maxim can be universally applied without generating a logical contradiction. A "Consistent" result indicates potential permissibility under the universalizability principle. A "Contradiction Detected" result flags a significant ethical risk. Think of it as spellcheck, but for your moral reasoning.

  **2. How does the Kantian Consistency Engine work?**
  Based on the foundational ethical framework of Immanuel Kant, the Engine performs a rigorous thought experiment: "What if *everyone* acted on this maxim, all the time?" It then analyzes the resulting scenario for two types of failure:
  *   **Contradiction in Conception (CC):** The universalized maxim is logically impossible (e.g., universal false promising destroys the concept of a promise).
  *   **Contradiction in the Will (CW):** While logically conceivable, no rational being could consistently *will* the universalized maxim to exist (e.g., universal refusal of all help undermines any agent's potential need for aid).
  Our Basic Plan detects CC failures only. For comprehensive CW detection, please see our **Universal Will Consistency Plus™** upgrade tier.

  **3. Why did my maxim pass when it seems clearly wrong?**
  MaximCheck verifies *formal consistency under universalization*, not substantive moral goodness. Many maxims pass this test yet may be undesirable for other reasons (e.g., "I will always eat vanilla ice cream on Sundays" is universalizable but potentially unhealthy). We are a consistency engine, not a comprehensive moral oracle. Competitors offering "goodness guarantees" rely on subjective metrics outside rigorous formal logic. Refer to Section 4.2 of our Service Level Agreement for scope limitations.

  **4. Why does rephrasing my maxim slightly change the result?**
  Maxim specification is inherently complex. The Engine evaluates the maxim *exactly as submitted*. Minor changes in wording can alter the scope and subject, impacting the universalization test. This is a known aspect of formal ethical analysis, not a system error. For guaranteed maxim specification at the "optimal level of generality," subscribe to our **Premium Plan**, featuring Human Analyst Redescription™.

  **5. What is Human Analyst Redescription?**
  Available exclusively in our **Premium Plan**, this service ensures your maxim is evaluated at the abstraction level most likely to yield a meaningful Kantian assessment. Our Certified Maxim Describers (CMDs) will reformulate your submitted maxim according to internal protocols before processing it through the Engine. For example, "I will break this one promise, to Dave, on a Tuesday" might be redescribed as "I will break promises when convenient for me."

  **6. My result was "Indeterminate: Scope Includes Non-Rational Agents." What does this mean?**
  The Kantian framework primarily concerns duties between rational moral agents. If your maxim's scope explicitly or implicitly includes entities traditionally categorized as non-rational (e.g., animals, certain AI, ecosystems), the Engine cannot render a definitive CC/CW verdict using its core algorithm. This is known internally as a **"Kant's Ghost"** scenario. To resolve indeterminacies involving non-rational agents, consider adding the **Non-Rational Agent Resolution Package™** to your subscription.

  **7. What does the Non-Rational Agent Resolution Package do?**
  This add-on module applies supplementary protocols to generate a definitive "Consistent" or "Contradiction Detected" result for maxims triggering the "Indeterminate: Scope Includes Non-Rational Agents" status. It utilizes advanced pattern matching against historical ethical precedents and configured organizational parameters. Specific resolution heuristics are proprietary.

  **8. I submitted "I will never help anyone, ever" and got "Consistent" on Basic! This is broken! (Ticket #11472)**
  Thank you for your feedback, Valued Customer. Our records confirm submission: "I will never help anyone, ever." The Basic Plan correctly identified no Contradiction in Conception (CC). Universal non-help is logically conceivable; the world wouldn't implode. Detection of the Contradiction in the Will (CW) inherent in this maxim requires our **Universal Will Consistency Plus™** tier. Your Basic Plan result is functioning as designed. Please review Plan upgrade options or our Refund Policy (Section 8.1).

  **9. What's the difference between a "Contradiction in Conception" and a "Contradiction in the Will"?**
  *   **Contradiction in Conception (CC):** Think of it like a dropped call – the universalized scenario simply cannot connect logically. It’s impossible to even conceive coherently (e.g., universal stealing negates property). Basic Plan covers this.
  *   **Contradiction in the Will (CW):** The call connects, but the plan is unsustainable. You *could* live in that world, but no rational agent signing up for life would *choose* it because it defeats their own potential needs or goals (e.g., universal non-help). Requires **Universal Will Consistency Plus™**. Think of UWCP+ as adding the comprehensive long-term coverage package to your basic connectivity plan.

  **10. Why does the Premium Plan cost so much more than Basic?**
  The Premium Plan includes Human Analyst Redescription™, a resource-intensive process requiring highly trained CMDs. This directly addresses the **"Tuesday Dave"** phenomenon (overly specific maxims passing) by ensuring evaluation occurs at the robust level of generality essential for meaningful universalizability assessment. Basic Plan offers self-service efficiency; Premium delivers specification certainty.

  **11. Support told me my maxim passed because it’s a "Tuesday Dave" and to upgrade. Is that professional?**
  "Tuesday Dave" is an internal classification code (Case Type T-D) referring to maxims specified at a level of detail that inherently bypasses CC detection under universalization. The support agent correctly identified this known behaviour pattern and suggested the appropriate service tier (Premium with Human Analyst Redescription) to meet your likely need for a robust ethical assessment. This is standard diagnostic protocol.

  **12. I used Universal Will Consistency Plus™ and got "Contradiction in Will" for "I will prioritize my career advancement above all else." Why?**
  The UWCP+ module detected that while a world where *everyone* prioritizes personal career advancement above *all else* is conceivable, it generates a Contradiction in the Will (CW), classified internally as a **"Lone Wolf"** scenario (Case Type L-W). No rational agent could consistently *will* this universal state, as it eliminates the necessary social cooperation, trust, and support structures upon which any individual's long-term career advancement ultimately depends. The result indicates significant ethical risk under the universalizability principle.

  **13. Do you store the maxims I submit?**
  All maxim submissions are encrypted and stored for 90 days for service quality assurance, dispute resolution, and model refinement. Aggregated, anonymized data may be used for research and development. See our Privacy Policy for details. Specific maxims are never sold to third parties.

