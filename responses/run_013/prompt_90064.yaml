prompt: |-
  So I've somehow ended up running the weekly discussion section for a big Hegel course this term — 16 undergrads, 80 minutes, and next week I've got to fill the whole thing on the lordship and bondage part of the Phenomenology. I've read it maybe four times and I think I finally see why people insist the master's victory is empty, but every time I try to explain it out loud it turns into a lecture, and the students dutifully write down "the master is dependent on the slave" and I can tell absolutely nothing has landed. The thing that actually made it click for me was stupid and personal: my old manager gave this long toast at a team dinner about how much the team respected her, and everyone clapped because they had to, and it was the most hollow thing I've ever sat through — and halfway through I realized that's the whole section, that recognition you've forced out of someone isn't recognition at all, and the person demanding it comes out worse off than the person doing the actual work. So I want the session built around something they do, where they back into that themselves, before I say a single word about Hegel.

  Can you design me the activity? I need roles or rules, materials, whatever stakes or payoffs make it bite (no real money), a minute-by-minute timeline for the 80 minutes, and then a debrief that maps what just happened onto the actual sequence in the text — the life-and-death struggle, the move where the master's recognition is worthless precisely because it comes from someone he won't count as a subject, and the slave's turn to the object, the labour that's supposed to give him something the master never gets. I'd like the asymmetry baked into the rules so they feel the dependence rather than hear about it; maybe two rounds, and if there's a twist that makes one side realize their "win" was hollow, even better. No lecture up front and don't let the words "master," "slave," or "recognition" surface until the debrief, I want them to hit the wall first.

  Two more things I really need from you. First, tell me what will predictably go wrong the first time I run this and how to handle it — I've never done a role-play like this and I'm a little worried it either turns into an awkward joke or someone actually gets their feelings hurt, so I want the failure modes flagged. Second, be honest about which feature of the dialectic the activity just can't reproduce and that I'll have to supply myself out loud — my instinct is the game will make the hollow-recognition point fine but will completely flub the labour/self-formation turn, and I also don't want the debrief to pretend the story ends cleanly, since I gather the section actually tumbles straight into the unhappy consciousness and there's real disagreement about whether the slave "wins" anything at all. Flag that if it's a live issue and tell me how to present it without confusing them.
