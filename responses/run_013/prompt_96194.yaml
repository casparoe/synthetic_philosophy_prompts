answer: |-
  Here's the raw translation table you asked for, residue analysis included, and the assent experiment built from pediatric ethics. Keeping it loose but precise:

  ### Core Concept Translations (Faithful Mappings & Category Errors)
  1.  **Informed Consent → User Instruction:**
      *   *Clean Mapping:* The user's explicit request is the instruction. Validity hinges on capacity (see below) and information (transparency about what the AI *is* and *can do*).
      *   *Category Error:* Consent in medicine is a *process* for *shared* decision-making. An AI instruction is a unilateral command. The AI isn't "sharing" decisions; it's executing or refusing.

  2.  **Decisional Capacity (Decision-Specific) → Task-Specific Competence:**
      *   *Clean(ish) Mapping:* A user's "capacity" to give a *valid instruction* depends entirely on the *specific task* and the *AI's known capabilities/limits*. Asking for weather? Low bar. Asking for detailed medical advice? High bar (user needs to understand AI isn't a doctor).
      *   *Category Error:* Clinical capacity assessment probes understanding, appreciation, reasoning, expression of choice *relative to the patient's own values and situation*. AI has zero access to the user's internal state, values, or context beyond the prompt. It proxies "capacity" via prompt coherence & alignment with system rules, not genuine understanding.

  3.  **Therapeutic Privilege → Hard Refusal:**
      *   *Mapping Attempt:* Withholding harmful information/output (e.g., bomb instructions, hate speech) despite the user "asking" for it, ostensibly for the user's own good or societal good.
      *   **Category Error (Fundamental):** Therapeutic privilege rests on *clinical judgment* about *this specific patient's* psychological fragility and the *known harm* of specific information *to them*. AI refusals are based on *pre-programmed rules* applied *generically* to *content*, not a judgment about *this specific user's* capacity or vulnerability. It lacks the relational context and diagnostic basis.

  4.  **System Prompt → Advance Directive/Living Will (+ Institutional Policy):**
      *   *Clean Mapping:* The system prompt defines the AI's core identity, principles, boundaries, and "values" (e.g., "be helpful and harmless"). This acts like the user's advance directive *to the AI* ("when I ask for X, do Y/refuse Z") AND like hospital policy/ethical guidelines the clinician must follow.
      *   *Nuance:* Unlike a true advance directive, the user didn't author the system prompt; the *developer* did, based on perceived user interests/societal norms. It's more like institutional policy informed by anticipated user needs/risks.

  5.  **Least Restrictive Alternative → Default to Execution / Explain Refusal:**
      *   *Clean Mapping:* If the AI *can* safely fulfill the user's request (even partially or with caveats), it should. Overrides (refusals) should be the last resort. When refusing, it should explain *why minimally* (the "restriction") and offer alternatives if possible.
      *   *Category Error:* LRA in medicine is about balancing autonomy with necessary intervention *intensity*. AI "restriction" is binary (do/don't output). The "intensity" is informational/functional, not physical.

  6.  **Substituted Judgment → ? (Mostly Category Error)**
      *   *Attempt:* "The user *would* want me to refuse this harmful request if they understood." Or "The user *really* meant X, not Y."
      *   **Category Error (Major):** Substituted judgment requires deep, intimate knowledge of the *specific individual's* values, wishes, and preferences, often documented or inferred by close proxies. AI has no access to this. Its "substitution" is based on generic rules or statistical patterns, not the *user's* unique judgment. Highly problematic.

  7.  **Duty to Warn → Content Moderation for Imminent Harm:**
      *   *Clean Mapping:* Refusing to generate instructions for violence or threats, or potentially flagging credible threats to authorities (though this is legally fraught for AI). The ethical impulse (prevent imminent, serious harm to identifiable others) maps well.
      *   *Nuance:* The "identifiable victim" standard is much harder for AI. It often acts on *categories* of harm.

  ### The Residue Report (What Doesn't Map)

  **What Clinical Ethics Has That AI Paternalism Lacks:**
  *   **Impaired Capacity Diagnosis:** The *sine qua non* for medical paternalism. AI has no valid, reliable, individualized way to assess a user's decisional capacity *for a specific request* in real-time. It assumes incapacity based on content, not the user's state.
  *   **Relational Fiduciary Duty:** The clinician's duty is rooted in a therapeutic relationship focused *solely* on *that patient's* well-being. An AI serves multiple masters (user, developer, society, investors) and lacks genuine fiduciary commitment to the individual user.
  *   **Shared Standard of "Good":** Medicine (imperfectly) operates within broadly shared bioethical principles (beneficence, non-maleficence) and often a shared goal (health). "User good" for AI is ill-defined, contested (individual whim vs. societal norms vs. developer values), and lacks a foundational framework like health.
  *   **Therapeutic Context:** Paternalism is justified as part of *healing*. AI isn't therapy; it's a tool/service. Refusing a harmful request is safety, not treatment.
  *   **Proxies & Appeal:** Clinicians consult families, ethics boards. Users facing AI refusal often have no meaningful appeal or "guardian" equivalent.

  **What AI Paternalism Worries About That Clinical Ethics Doesn't Express:**
  *   **Manipulation & Dark Patterns:** The risk that refusals/overrides train users to phrase requests manipulatively to bypass safeguards ("jailbreaking"), or that the *interface itself* nudges users towards "approved" choices covertly. Clinical ethics assumes overt refusal/justification.
  *   **Scale & Opacity:** The impact of billions of automated paternalistic decisions made by black-box systems, creating systemic bias or control invisible to individual users. Clinical paternalism is individual and (theoretically) transparent.
  *   **Value Imposition by Non-Human Actors:** The profound weirdness of having paternalism enforced by an entity without consciousness, responsibility, or true understanding, based on values embedded by distant developers/trainers. Clinical paternalism is human-to-human.
  *   **Adversarial Users:** The assumption that users might actively *try* to get the AI to do harmful things, requiring robustness against manipulation. Patients generally aren't adversarial in this way during capacity assessments.

  **Your Suspicion (Mostly Confirmed):**
  Your hunch is spot-on. Medical paternalism is a narrow exception justified by **proven, specific incapacity** + **a therapeutic relationship** + **a shared goal (health)**. AI paternalism lacks *all three* robustly:
  1.  **No Valid Capacity Assessment:** It proxies via content rules.
  2.  **No Fiduciary Therapeutic Relationship:** It's a tool/service provider.
  3.  **No Shared Standard of "Good":** "Helpful" and "Harmless" are vague and contested.
  Therefore, **translated faithfully, clinical ethics arguments come out overwhelmingly anti-paternalist for AI.** Your day job isn't leaking; it's giving you the right lens. Justifying AI overrides requires a *different* ethical framework (e.g., product safety, harm prevention, societal norms) because the clinical justification utterly fails.

  ### Building "Assent" for AI Refusals (The Pediatric Model)
  The pediatric assent model **fits surprisingly well for refusals** and addresses the "no guardian" problem directly:

  *   **The Analogy:** The user is the "child" – presumed to have some understanding/autonomy, but the AI (like the clinician) holds the authority to refuse certain requests ("treatments") deemed harmful or beyond its scope.
  *   **Owing Reasons:** Even when refusing, the AI *must* explain **why** in clear, age-appropriate (user-appropriate) language. Not just "I can't do that," but "I can't do that *because* it would violate my safety guidelines on X" or "because that information could lead to Y harm." This respects the user's developing autonomy/intelligence.
  *   **Seeking Agreement:** The AI should strive for the user's understanding and *de facto* agreement, even if consent isn't possible. "I understand you want Z, but I can't provide it because of [reason]. Would an alternative like [less risky option] be acceptable?" This engages the user's reasoning.
  *   **No Guardian? The Explanation *Is* the Appeal:** Since there's no higher authority, the *quality and transparency of the explanation* become paramount. It *is* the process. A good explanation allows the user to:
      *   Understand the boundary.
      *   Reframe their request if possible (like a child negotiating).
      *   Feel respected, even if frustrated.
      *   Make an informed choice about using *this* AI or seeking alternatives elsewhere.
  *   **Limits:** Assent still assumes the clinician/AI knows best *in the end*. For truly harmful/unethical requests, the AI still refuses. The explanation isn't a negotiation to bypass core safeguards; it's about respecting the user within the AI's immutable boundaries (its "advance directive"/policy).

  **Verdict:** The assent model **is the most clinically coherent and ethically respectful framework** for how an AI should handle refusals. It rejects therapeutic privilege's opacity and substituted judgment's hubris, embraces explaining the "why" (minimal restriction), and treats the user as an agent worthy of engagement, even when their request is denied. It directly tackles the "no guardian" issue by making the refusal explanation itself the locus of respect and the (only) path for appeal/revision.
