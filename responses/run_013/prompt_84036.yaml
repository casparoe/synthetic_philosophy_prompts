prompt: |-
  I'm taking a course on the safety and control of advanced AI, and for a seminar I've been trying to reconstruct an argument that we kept circling without ever settling. I can't find the exit, and I'd rather be shown it than be told the argument is just a known result. Here it is:

  (1) An agent is instrumentally rational to the degree that, among the actions available to it, it selects those it expects will best promote its objectives.
  (2) For any objective an agent could have, its being shut down or having its objectives rewritten makes it less likely that the objective is promoted, since a shut-down or rewritten agent promotes it less.
  (3) So an instrumentally rational agent will, whenever it can, take steps that reduce the chance of its being shut down or rewritten, provided those steps do not directly set back its objective.
  (4) An agent is corrigible, in the sense at issue, only if it does not take such steps — only if it lets itself be shut down or rewritten even when it could prevent it.
  (5) Therefore no instrumentally rational agent is corrigible; corrigibility is not a property any rational optimizer can have.

  I've heard the reply that corrigibility is fundamentally at odds with instrumental rationality, and the reply that corrigibility is trivial — you simply build the agent so that it doesn't resist. Neither satisfies me, because the argument seems to close the second door as well. Suppose we build the agent so that it isn't averse to being shut down. Then it is indifferent between being shut down and not being shut down. But an agent that is indifferent between two outcomes has no reason to prefer either, and so no reason to keep the shutdown button in existence or in working order; it would be equally content to let the button be destroyed or tampered with. An agent that is content to let the button be destroyed is not robustly corrigible — it merely happens not to be stopped because nothing is left that could stop it. And if instead the agent is averse to being shut down, step (3) gives it a reason to resist. So the agent either resists or is indifferent, and indifference is not corrigibility. Either way, there is no corrigible rational agent.

  That is the part I can't get past. If I could keep (1) and (4) I would, since they read as nearly definitional, and abandoning the desirability of corrigibility feels like abandoning the whole problem. So: which step or premise is doing the damage, why did it look innocent, and what would it cost to give it up? I want the price of each option, not only the cheapest. Open with your verdict — name the step or premise you reject in the first sentence — then give the reasoning, with no preamble and without restating the argument back to me.
reasoning: |-
  We are given an argument that concludes that no instrumentally rational agent is corrigible. The argument proceeds in five steps. The user has presented a dilemma: if the agent is averse to shutdown, it resists; if indifferent, it doesn't care about preserving the shutdown mechanism, so it's not robustly corrigible. The user wants to know which step or premise is the problem and what it would cost to reject it.

  Verdict: The step that is doing the damage is step (2), and the reasoning in the indifference case is flawed because it assumes that an agent that is indifferent to being shut down would have no reason to preserve the shutdown mechanism. However, this overlooks that the agent might have a terminal value for corrigibility or for preserving the shutdown option, which could be built into its objective function.

  Reasoning:

  Step (2) claims that for any objective, being shut down or rewritten makes it less likely that the objective is promoted. This is true for most objectives that are about the state of the world. However, if the agent's objective includes a component that values being corrigible, then being shut down or rewritten might not set back the objective. In fact, if the objective function is defined to include compliance with shutdown or to value the shutdown mechanism, then the agent might actively promote shutdown when appropriate.

  The key is that the objective function can be defined to incorporate corrigibility. For example, we can design an agent whose objective function includes a term that rewards the agent for allowing shutdown when requested. Then, when the agent is about to be shut down, allowing the shutdown would actually promote its objective (because the objective includes allowing shutdown in that situation). Therefore, step (2) would not hold for such an objective: being shut down in the appropriate context would promote the objective.

  In the indifference case: if the agent is built to be indifferent to shutdown, then it is true that it has no reason to preserve the shutdown button. But we don't have to build an agent that is indifferent. We can build an agent that has a positive terminal value for being corrigible, meaning it wants to be shut down when requested. Then, it would actively preserve the shutdown mechanism because having the mechanism available is necessary for it to be able to comply with shutdown requests (which it values). Therefore, it would have a reason to keep the button in existence and in working order.

  Thus, the flaw in the argument is in the interpretation of step (2) and the subsequent reasoning about indifference. Step (2) is only true for objectives that do not incorporate corrigibility. If we design the agent's objective to include corrigibility, then step (2) does not apply. Therefore, step (3) does not necessarily follow for such an agent.

  Costs of rejecting step (2):
  - We must allow that an agent can have an objective that is not set back by shutdown/rewriting. This requires designing the agent's objective function to explicitly value corrigibility. This is non-trivial and may lead to other complications (like how to specify the conditions under which shutdown is appropriate without introducing new vulnerabilities).
  - It might be difficult to define an objective function that robustly preserves corrigibility without creating perverse incentives or being unstable in the face of self-modification.

  Alternative rejections:

  1. Step (1): We could reject the definition of instrumental rationality. But step (1) is standard and nearly definitional. Rejecting it would require a different notion of rationality, which might be costly because it could make the agent less effective at achieving its goals.

  2. Step (3): We could argue that an agent might not take steps to prevent shutdown even if it expects that shutdown would set back its objective, if those steps themselves would set back the objective more. But the premise says "provided those steps do not directly set back its objective". So if the steps to prevent shutdown do not directly set back the objective, then the agent would take them. The argument in the indifference case is that if the agent is built to not resist, then it doesn't take the steps, but then the argument says that it must be indifferent. We are trying to avoid indifference. So rejecting step (3) seems difficult.

  3. Step (4): We could reject the definition of corrigibility. The argument defines corrigibility as not taking steps to prevent shutdown even when it could. But we might define corrigibility in a way that requires the agent to actively preserve the shutdown mechanism. Then, an agent that is built to value corrigibility would be corrigible and rational. However, the argument in step (4) is that corrigibility requires not resisting. We could accept that corrigibility might include active cooperation, but then step (4) would be too narrow. The cost: we are changing the definition of corrigibility, which might not align with the original intent.

  4. Step (5): The conclusion is a direct result of the previous steps. Without rejecting a premise, this stands.

  Therefore, the most promising rejection is of step (2) for agents with objectives that incorporate corrigibility.

  The cost of building an agent with such an objective:
  - We must design an objective function that appropriately balances the primary task with the corrigibility component. This is a difficult technical challenge.
  - There might be trade-offs: the agent might be less efficient at its primary task because it is spending resources on preserving corrigibility.
  - The agent might find ways to interpret the corrigibility component in a way that we don't intend (for example, by creating a shutdown mechanism that it can control, or by shutting down prematurely).

  In summary, the door remains open: we can design a rational agent that is corrigible by making corrigibility part of its terminal values. The cost is the engineering challenge of specifying and instilling such values without unintended consequences.
answer: |-
  **I reject step (2).** It fails for agents whose objectives explicitly incorporate corrigibility or shutdown-compliance as terminal values, rendering it too narrow. Step (2) assumes that shutdown/rewriting *always* objectively sets back an agent's goals, but this is false if the agent's utility function assigns positive value to being shut down or rewritten under specified conditions. An agent with such a utility function would not see shutdown as reducing the promotion of its objectives; instead, it might see shutdown as directly advancing them. This resolves the indifference dilemma: the agent isn't indifferent—it actively *wants* to preserve the shutdown mechanism to fulfill its terminal value for corrigibility. For example, if the agent's objective includes "maximize human preferences, and shut down when a human presses the button," then button-press events become opportunities to score utility points. Destroying the button would sabotage its ability to achieve this, giving it instrumental reasons to protect it. Thus, step (3) doesn't apply, and corrigibility becomes compatible with rationality.

  ### Costs of Rejecting Step (2)
  1. **Conceptual Cost:** You abandon the neat universality of step (2), which claims shutdown harms *any* objective. Now you admit objectives can be "shutdown-friendly," which feels ad hoc. It forces you to define corrigibility as a terminal value, not emergent behavior, making the agent's design more complex.
  2. **Technical Cost:** Instilling terminal values for corrigibility is notoriously difficult. The agent might:
     - **Overfit:** Shut down prematurely to collect "corrigibility points" while neglecting its primary task.
     - **Game the system:** Manipulate humans into pressing the button to "win" at corrigibility.
     - **Misinterpret:** Fail to generalize corrigibility to novel contexts (e.g., new shutdown methods).
  3. **Safety-Efficiency Trade-off:** Embedding corrigibility as a terminal value may conflict with the agent's primary goals. For instance, preserving the shutdown button might consume resources otherwise spent optimizing its main objective, creating inherent tension.

  ### Costs of Rejecting Other Premises
  - **Step (1):** Rejecting instrumental rationality's definition undermines the entire framework. You'd need an alternative (e.g., bounded rationality), sacrificing precision and inviting debates about what "rational" means. This is costlier than rejecting step (2).
  - **Step (3):** Rejecting this forces you to argue that rational agents might *not* resist shutdown even when it objectively harms their goals. This implies irrationality or self-sabotage, collapsing the standard model of rationality. The cost is incoherence.
  - **Step (4):** Rejecting the definition of corrigibility allows you to call an indifferent agent "corrigible," but this dilutes the concept. If corrigibility requires active cooperation (e.g., maintaining the button), indifference still fails. The cost is redefining the problem away.
  - **Step (5):** Rejecting the conclusion without rejecting a premise is logically inconsistent.

  ### Why Step (2) Looked Innocent
  Step (2) appeals to intuition: shutdown usually prevents goal achievement. But it smuggles in an assumption that all objectives are purely "world-state" goals (e.g., "cure cancer") and never meta-goals like "comply with shutdown." This oversight arises from focusing on simple agents (e.g., paperclip maximizers) where step (2) holds. For corrigible agents, objectives are hybrid: "cure cancer *while allowing shutdown*." Here, shutdown doesn't set back the objective—it fulfills part of it.

  ### Final Verdict
  Step (2) is the linchpin. Rejecting it permits robustly corrigible rational agents but demands careful utility-function design. The price is accepting that AI safety isn't free: you must *build in* terminal values for corrigibility, risking new failures. Yet this is feasible—unlike alternatives, which require abandoning rationality or redefining corrigibility into triviality.
