  5. **Leaf 3c: General Minimal Revision (Constitutive)**  
     - *Most awkward commitment*: Minimization is primitive, risking vacuity in justification.  
  6. **Leaf 4: Pessimism**  
     - *Most awkward commitment*: No rule for thermometer/color vision cases; updates underdetermined.  
  7. **Unnamed** (from Node 1a, "No")  
     - *Why empty*: Incoherent under uncertain evidence (blurry photo).  
  8. **Unnamed** (from Node 3, "No" without pessimism)  
     - *Why empty*: Rejecting rigidity for marginals invites probabilistic incoherence.

