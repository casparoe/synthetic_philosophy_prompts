       - *Most awkward commitment*: Dutch books for non-marginal constraints (e.g., reliability facts) may not be coherent, making justification incomplete.  
     - **Expected accuracy** → **Leaf 3b: General Minimal Revision (Accuracy justification)** (e.g., Jim Joyce).  
       - *Most awkward commitment*: Accuracy arguments assume a scoring rule (e.g., Brier score), but other rules yield different updates.  
     - **Constitutive of rationality** → **Leaf 3c: General Minimal Revision (Constitutive justification)** (e.g., radical probabilism).  
       - *Most awkward commitment*: Minimization is treated as definitional, but it doesn't explain why divergence-minimization (e.g., KL-divergence) is uniquely rational.  

