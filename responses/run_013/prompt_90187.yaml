  the problem is i cant tell what hes actually claiming. is he just saying scientists are too busy to read philosophy? or that philosophy of science has nothing to teach actual scientists? or something way bigger, like questions about whether unmeasured electrons have positions are fake or meaningless questions? can you lay out all the different precise claims that sentence could be making, like a menu, from the totally boring reading to the really radical one, and for each one say if its true and whether that reading would actually justify him using it to shut down my electron question. i also have a feeling the bird comparison kind of backfires on him, like ornithology isnt useless to birds in some ways, but i cant put my finger on why. i want to bring this to office hours so i need the readings seperated out into a list, not one big essay.
