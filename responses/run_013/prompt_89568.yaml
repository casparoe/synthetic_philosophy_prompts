prompt: |-
  I teach a 75-minute session for about 16 undergrads, mixed econ and philosophy, and I want to run a dollar auction so they feel escalation of commitment in their gut instead of nodding along at the phrase. Problem: the plain version is so well-known that the lesson collapses into "sunk cost fallacy, dont be that guy" — too easy, and I think it's actually the wrong diagnosis. So build in two things. First, a pre-commitment stage: before any bidding, each player writes down a hard maximum and can buy a cheap "bond" (a dollar, or some forfeit they'd really hate) that they lose the moment they bid over their own stated max; then run the auction and let that mechanic do its work. Second, the debrief has to pull apart two things they will absolutely blur: the marginal decision to raise at any given point, which looks exactly like sunk-cost reasoning and isn't — in this game the earlier bids aren't really sunk, since both bidders pay and the loss only lands if you stop — and the structural trap that makes escalating the locally sane move even for someone who's fully internalized that past spending shouldn't matter. What I want them walking out seeing is that the failure is diachronic rather than synchronic: they know the right rule, they just can't bind themselves to it, and I want the bond mechanic to make that concrete, ideally by getting someone to publicly blow past their own bond.

  Give me the rules and payoffs, the materials, how to run it with two actual bidders while the other 14 watch (or a way to get everyone involved), a rough timeline, and the debrief mapping what happened back onto the pre-commitment-vs-game-structure distinction. Also tell me what predictably goes wrong the first time — I'd bet on someone refusing to play, or gaming the bond — and how to handle it. And be straight with me about what the game can't reproduce: my guess is it misses the ego/self-justification side, the way real escalation is powered by not wanting to look like the sucker, which I'll have to supply myself in the debrief.
reasoning: |-
  We are going to design a dollar auction with a pre-commitment stage to highlight the commitment problem and the structure of the auction that leads to escalation even when players are rational and understand sunk costs.

  Rules and Payoffs:
  - The auction is for a $20 bill (or any desirable prize, but let's say $20 for clarity).
  - Bidding starts at $1 and increases in $1 increments (or $0.50 if you prefer, but $1 is simpler).
  - Both the winner and the runner-up pay their highest bid. The winner gets the $20 plus the prize, so net = $20 - winning bid. The runner-up pays their bid and gets nothing, so net = -runner-up bid.
  - Before the auction, each player (or all students) writes down a hard maximum bid (a number they will not exceed). They can optionally buy a "bond" for $1 (or a forfeit they'd dislike, e.g., doing 10 push-ups, singing a song, etc.) that they lose if they bid above their stated maximum.

  Materials:
  - A $20 bill (or a fake one for demonstration).
  - A whiteboard or flip chart to record bids.
  - Small slips of paper for students to write their maximum bid (and optionally, to indicate if they bought the bond).
  - If using a monetary bond, a collection box for the $1 bonds. Alternatively, for non-monetary bonds, a way to enforce the forfeit (e.g., a list of embarrassing tasks).

  How to run with two bidders and 14 observers:
  1. Pre-commitment (5-10 minutes):
     - Explain the rules of the dollar auction: both top two bidders pay, winner gets the $20.
     - Each student (including observers) writes down a maximum bid on a slip of paper. They do not show it to anyone. They also decide whether to buy the bond (for $1 or a forfeit). They must write their maximum bid and mark if they bought the bond. Collect the slips (or have them hold on to them until the auction is over, but then you need a way to verify).
     - Alternatively, to save time, you can have only the two volunteers do the pre-commitment.

  2. Auction (5-10 minutes):
     - Select two volunteers to be the bidders. (If you want, you can have multiple pairs, but for simplicity, one auction with two bidders in front of the class.)
     - The auctioneer (you) starts the bidding at $1. Bidders raise their bids in increments of $1 until one drops out.
     - Record each bid on the board so everyone can see.
     - If a bidder exceeds their stated maximum and they bought the bond, they must immediately pay the forfeit (e.g., put $1 in the box, or do the push-ups). This should be done publicly to highlight the commitment failure.

  3. Debrief (40-50 minutes):
     - Start by asking the bidders about their experience. Then ask the observers what they noticed.
     - Focus on the pre-commitment: did the bond work? Did anyone break their commitment? Why?
     - Then unpack the decision-making:
       - At each bid, the current high bidder has just bid $X. The next bid would be $X+1. The current high bidder is facing a choice: drop out and lose $X, or bid $X+1 and then if they win they get $20 - ($X+1) and if they lose they get -$X (if they are the runner-up). But note: if they bid $X+1 and then the other drops out, they get $20 minus ($X+1). If they drop out, they lose $X. So the marginal cost of continuing is $1 to avoid losing $X? Actually, the decision is more complex because both players are in the same situation.
     - Highlight the structure: the auction creates a mutual trap. The key is that at any point, the two bidders are collectively better off stopping (and sharing the losses) but individually each has an incentive to continue because the incremental cost is small compared to the loss they will incur if they quit. This is the same as in the prisoner's dilemma or the war of attrition.
     - Contrast with sunk cost fallacy: the sunk cost fallacy is when you let unrecoverable costs influence your decision. Here, the past bids are not sunk in the usual sense because they are paid by both and the loss is avoided only by winning. Actually, the bids are sunk: once made, they are gone. But the fallacy might be misapplied: the bidders are not continuing because of the sunk costs per se, but because the structure of the auction makes it rational to continue until very high bids. The sunk cost fallacy would be if they said "I've already bid $10, so I have to win to make it worth it." But in fact, the rational reason to continue is that by bidding $11, they might only lose $11 instead of $10 (if they are sure the other will drop at $11) and if they win they get $20-$11=$9. But note that at $10, the current high bidder is facing a rival who might bid $11. If the high bidder drops, they lose $10. If they bid $11 and the rival drops, they get $20-$11=$9 (so they avoid the $10 loss and get a net of -$1 relative to not having played? Actually, it's messy). The real point is that from the perspective of being at bid $X (as the current high bidder) and the other bidder is about to decide whether to bid $X+1, the current high bidder would prefer that the other bidder drops. But the other bidder, if they drop, lose $X-1 (if they were the one who bid $X-1 and then the current high bidder bid $X) — actually, the last bidder to have bid is the current high bidder. Let me reindex: at a point where the bid is $X and it's player A's turn (they are the current high bidder at $X), then player B (who last bid $X-1) must decide whether to bid $X+1? No, the bidding goes: player A bids $X, then player B can bid $X+1 or drop. If player B drops, player A wins and pays $X, gets $20, so net $20-X. Player B pays $X-1 (their last bid) and gets nothing. So player B, by dropping, loses $X-1. By bidding $X+1, they become the high bidder and then player A must decide whether to bid $X+2 or drop. If player A drops, then player B wins, pays $X+1, gets $20, net $19-X. But if they drop, they lose $X-1. So the marginal cost of bidding is $1 (they pay an extra dollar if they win) but the marginal benefit is that they avoid losing $X-1 and instead might win and get $19-X. However, if they bid $X+1, they might end up in a bidding war. The rational strategy is complex and depends on beliefs about the other's maximum.

     - The key for the debrief: the game is structured so that the only way to avoid the trap is to pre-commit to a low maximum. But even with pre-commitment, they might break it. The bond is meant to make the pre-commitment credible. However, in the heat of the moment, they might still break it (and pay the bond) because the immediate pain of the bond is less than the perceived loss of dropping out (which is the entire bid so far). This illustrates the diachronic failure: they know at time T0 that they should set a low max, but at time T1 (when they are in the auction) they want to break it.

     - What the game can't reproduce: the ego and social pressure. In the debrief, you can ask: "Did anyone feel the pressure to not be the sucker? To not let the other win too easily? To save face?" Then relate to real-world examples (e.g., wars, business projects).

  Rough Timeline:
  - Pre-commitment and explanation: 10 minutes
  - Auction: 10 minutes (could be shorter if they drop early, but plan for up to 10)
  - Debrief: 50 minutes (this is the core, so take time)

  Predictable Problems and Solutions:
  1. Refusing to play: Some students might not want to risk losing money. Solution: Use play money? Or make the bond and bids in a currency that doesn't matter (e.g., points). But that might reduce the impact. Alternatively, offer to reimburse any losses from a class fund? Or make it clear that it's educational and they are volunteers. For the bond forfeit, make it embarrassing but not too bad (e.g., sing a line of a song). If they still refuse, have a backup plan: use two volunteers who are willing.

  2. Gaming the bond: A student might set a very high maximum (like $100) and then not break it, but then they might be trapped in the auction until very high. Or they might set a low maximum without buying the bond, and then break it. The bond is optional, so without it, they can break without penalty. This is okay because it shows the value of commitment devices. If they set a high maximum and buy the bond, they might end up losing a lot of money. You can highlight in the debrief: "Why did you set a high maximum? Did you think the bond would protect you? But then you ended up bidding high and losing."

  3. The auction ends too quickly: If both bidders set low maximums and stick to them, the auction might end at $5. Then the lesson about escalation might not be felt. Solution: Encourage competitive students to volunteer. Or run two rounds: one without pre-commitment and one with? But time is limited. Alternatively, if it ends quickly, you can discuss why: because they pre-committed and it worked.

  4. Observers are not engaged: Have the observers also write down maximum bids and decide on bonds. Then after the auction, ask how many would have broken their bond? Or have multiple pairs of bidders? But with 16 students, maybe run two auctions simultaneously? That might be chaotic. Alternatively, have the observers act as advisors to the bidders? But then they might not feel the tension.

  Alternative to involve everyone:
  - Run a tournament: every student is paired with another (8 pairs). Each pair does a quick auction (each pair gets a $20 prize? That's expensive). Instead, use a $5 prize or just points. Then the winners of each pair move to the next round? But that might take too long and the structure might not be the same. Alternatively, have each student play in a simultaneous auction? That's complex.

  Another idea: have the entire class participate in one auction. But with 16, it would be chaotic. Instead, have them bid in a written format: each student writes their bid in secret and the two highest are selected? But then it's a one-shot and doesn't show escalation.

  I think the best is to have two volunteers in front of the class and have the rest observe and do the pre-commitment exercise. Then in the debrief, ask the observers what they thought and if they would have broken their commitment.

  Finally, the debrief mapping:
  1. Start by asking the bidders: 
     - What was your maximum? 
     - Did you break it? 
     - How did it feel? 
     - Why did you break your commitment (if they did)?

  2. Ask the class: 
     - Why did we have the bond? 
     - Did it work? 
     - Why might someone break the bond?

  3. Then explain the structure of the auction:
     - Draw the decision tree at a late stage (e.g., when the bid is at $15). 
     - Show that the player who just bid $15 is about to have the other player bid $16. The other player must decide: drop and lose $15 (if they were the one at $15? Wait, let's clarify: at the point where bidder A has just bid $15, so bidder B (who bid $14) must decide to bid $16 or drop. If bidder B drops, they lose $14. If they bid $16, then bidder A must decide whether to bid $17 or drop. If bidder A drops, bidder B wins and pays $16, gets $20, net $4. So bidder B, by bidding $16, risks $16 (if bidder A continues) but if bidder A drops, they get $4. But if they drop, they lose $14. So the incremental cost of bidding $16 is $2? (They pay $16 instead of $14) but they get a chance to win $20 and avoid the $14 loss? Actually, the net effect of bidding is: they spend an extra $2 (because they were already going to lose $14) and now they have a chance to win $20 for a net of $4? So they are paying $2 for a chance at $4? But if they think bidder A will drop, then it's a sure $4 for a $2 cost? And if they think bidder A will continue, then they might end up in a war. This is the trap.

  4. Contrast with sunk cost: The sunk cost is the $14 that bidder B has already bid. But the decision to bid $16 is not because of the $14 (which is sunk) but because of the structure of the auction: they are trying to avoid losing the $14 and get a positive return. The sunk cost fallacy would be if they said "I've spent $14 so I must win to make it worth it." But in fact, the rational reason is that by spending an extra $2 they can turn a $14 loss into a $4 gain if they win. The problem is that the other player is thinking the same.

  5. The pre-commitment is a way to avoid getting into the trap. But the bond makes the pre-commitment credible. However, if the bond is too small, they might break it. In real life, we often fail to set pre-commitments or set them too weakly.

  6. Finally, link to real-world examples: 
     - Business: continuing a failing project because the next milestone might turn it around. 
     - War: continuing to fight because the next battle might win it. 
     - Relationships: staying in because of the time invested, but the structure is similar.

  And for the ego part: mention that in real life, the pressure of looking foolish or stubborn can drive escalation beyond even the rational (if there is any rationality in the auction). Ask the students if they felt that during the auction.

  This should take about 75 minutes. Good luck!
answer: |-
  Below is a comprehensive plan for your dollar auction session, designed to highlight **pre-commitment failure** and the **structural trap** of escalation, while minimizing the oversimplified "sunk cost fallacy" interpretation. The key innovations are the **pre-commitment bond** and a debrief that dissects the marginal decision-making vs. the game's inherent incentives. I'll break this into rules, materials, timeline, debrief, common pitfalls, and limitations.

  ---

  ### **Rules and Payoffs**  
  **Objective**: Win a **$20 prize** (use real cash for psychological impact).  
  **Players**: 2 active bidders (selected from volunteers), 14 observers (all participate in pre-commitment).  

  #### **Pre-Commitment Stage** (Critical for diachronic failure):  
  1. **Set Maximum Bid**:  
     - All 16 students privately write down a "**hard maximum bid**" (e.g., "$10") on a slip of paper. *This is their personal limit.*  
  2. **Bond Purchase**:  
     - Students can optionally buy a **"bond"** for **$1** (or a **non-monetary forfeit** they’d hate—e.g., singing a silly song in class).  
     - **Bond consequence**: If a bidder exceeds their maximum during the auction, they immediately forfeit the bond (lose $1 or perform the forfeit).  
     - **Rationale**: The bond makes pre-commitment costly to break, mirroring real-world commitment devices (e.g., contracts).  

  #### **Auction Rules**:  
  - **Bidding**:  
    - Starts at $1, increases in $1 increments.  
    - Active bidders take turns bidding aloud (e.g., Bidder A: "$1", Bidder B: "$2", etc.).  
  - **Payoffs**:  
    - **Winner**: Gets $20 minus their winning bid (e.g., wins at $5 → $15 profit).  
    - **Runner-up**: Pays their highest bid and gets nothing (e.g., bids up to $4 → loses $4).  
    - **Observers**: No direct payoff, but they participate in pre-commitment and debrief.  
  - **Bond Enforcement**:  
    - If a bidder bids above their stated maximum, the auction pauses, and they forfeit the bond **publicly** (e.g., pay $1 to a jar or sing immediately). *This creates visceral tension.*  

  #### **Why This Works**:  
  - The bond forces students to confront their **inability to stick to plans** (diachronic failure).  
  - Payoffs ensure bids are **never "sunk"** in the traditional sense—both players pay, and losses materialize only when one quits. Escalation is locally rational.  

  ---

  ### **Materials**  
  - **Physical items**:  
    - $20 bill (prize).  
    - Bonds: 16 envelopes (for secret max-bid slips) + $1 bills or "forfeit cards" (e.g., "Sing ‘Baby Shark’" on index cards).  
    - Timer, whiteboard (track bids), and a "bond penalty" jar.  
  - **Handouts**:  
    - Slips for max bids + bond purchase (yes/no).  
    - Cheat sheet explaining rules (distribute during pre-commitment).  

  ---

  ### **How to Run the Session**  
  **Total: 75 minutes**  
  #### **1. Setup (10 min)**:  
  - Explain rules, payoffs, and the bond’s purpose: *"This bond helps you stick to your plan—like a real contract."*  
  - Emphasize: *"Past bids aren’t sunk costs here—they’re live payments you lose if you quit."*  
  - **All 16 students** write max bids and decide on bonds (collect slips in envelopes).  

  #### **2. Auction (15 min)**:  
  - **Select 2 active bidders** via volunteers (choose competitive students to ensure escalation).  
  - **Run auction**:  
    - Start at $1, record bids on whiteboard.  
    - **Pause and enforce bond** if a bidder exceeds their max (e.g., "You bid $11 but max was $10—pay your bond now!").  
    - Continue until one bidder drops out.  
  - **Observer role**: Track if they’d have broken their own bond (prep for debrief).  

  #### **3. Optional: Full-Class Variation (if time permits)**  
  - **Simultaneous mini-auctions**: Pair all students (8 pairs). Each pair auctions a **$5 prize** (smaller stakes).  
  - **Rules**: Same pre-commitment and bonds.  
  - **Benefits**: Everyone feels escalation; compare outcomes in debrief.  
  - **Drawbacks**: Noisier; use only if your class is small and focused.  

  ---

  ### **Debrief (50 min)**  
  **Goal**: Separate **marginal decisions** (rational escalation) from **structural traps** (game design) and **pre-commitment failure** (diachronic problem).  

  #### **Step 1: Elicit Reactions (5 min)**  
  - Ask bidders: *"Why did you keep bidding past [point]? Did the bond stop you?"*  
  - Ask observers: *"Did you want to intervene? What would you have done?"*  

  #### **Step 2: Map to Concepts (15 min)**  
  **(Use whiteboard to contrast columns)**  

  | **Marginal Decision (Synchronic)** | **Structural Trap (Game Design)** | **Pre-Commitment Failure (Diachronic)** |
  |-----------------------------------|----------------------------------|-----------------------------------------|
  | *At any bid (e.g., $10), raising to $11 seems rational:* | *The auction traps both players:* | *You set a max bid at the start...* |
  | - "If I bid $11, I might win $20 and only lose $1 more." | - Both pay, so quitting = total loss. | ...*but in the heat of battle...* |
  | - "If I quit, I lose $10 for nothing." | - The loser’s payoff creates mutual dread. | - "I forgot my max!" or "The bond was worth breaking." |
  | **→ Not sunk costs** (costs are avoidable by winning). | **→ Escalation is inevitable** under rationality. | **→ You couldn’t bind your future self.** |

  #### **Step 3: Highlight the Bond’s Role (10 min)**  
  - **If bond was broken**: *"Why did you break it? Was $1 too small to outweigh the fear of losing?"*  
  - **If bond held**: *"Did it feel like a ‘contract’? How is this like real-world promises?"*  
  - **Key insight**: Bonds externalize the **cost of self-betrayal**—making diachronic failure visible.  

  #### **Step 4: Connect to Real World (10 min)**  
  - **Structural traps**: Business ventures (e.g., startups throwing good money after bad), wars (e.g., Vietnam), relationships.  
  - **Pre-commitment**: Odysseus tying himself to the mast (vs. Sirens), savings auto-deductions, divorce prenups.  
  - **Ego/social pressure (supply this yourself)**:  
    > *"In reality, escalation is turbocharged by ego—fear of looking weak or foolish. Did our bidders feel like ‘suckers’ if they quit? That’s why real auctions see bids exceed item values. The game can’t replicate this perfectly, but your bond breakage hints at it: breaking a public promise feels shameful."*  

  #### **Step 5: Conclusion (5 min)**  
  - **Reframe "sunk cost fallacy"**:  
    > *"Sunk costs *shouldn’t* matter, but here, the *threat* of losing everything makes escalation rational. The true failure isn’t myopia—it’s not setting (or sticking to) limits before the trap snaps shut."*  
  - **Takeaway**: Escalation is less about bad reasoning and more about **failing to bind future selves** in predictable traps.  

  ---

  ### **Predictable Problems & Solutions**  
  1. **Refusing to play**:  
     - **Why**: Fear of losing money/embarrassment.  
     - **Fix**: Use **play money** (e.g., "class dollars") or emphasize educational value. Offer observer roles. Say: *"This is lab conditions—real stakes help us learn."*  

  2. **Gaming the bond**:  
     - **Why**: Students set max bids artificially high ($100) to avoid breaking bonds.  
     - **Fix**: **Frame bond-buying as virtuous**: *"Smart people buy bonds—they know they’ll be tempted."* Reward bond buyers with praise in debrief.  

  3. **Auction ends too early**:  
     - **Why**: Conservative bidders quit at $5.  
     - **Fix**: **Seed competitiveness**: Pick volunteers who are rivals. Add social pressure: *"Can anyone win this $20 bill for less than $10?"*  

  4. **Bond not broken**:  
     - **Why**: Max bids set too high or forfeits too scary.  
     - **Fix**: **Use mild forfeits** (e.g., "Do 5 squats") to encourage risk-taking. In debrief, discuss: *"Why was it easy to stick? What if the bond was weaker?"*  

  ---

  ### **What the Game Can’t Reproduce (and How to Compensate)**  
  - **Ego/Self-Justification**:  
    - **Missing**: The game downplays pride, face-saving, and "sucker" narratives.  
    - **Compensate in debrief**:  
      > *"In reality, we escalate to avoid admitting failure or looking weak. Think of CEOs doubling down on bad projects to protect their image. Our auction misses this—but when [Name] broke their bond, did you sense embarrassment? That’s ego creeping in."*  

  - **Social Dynamics**:  
    - **Missing**: Peer pressure (e.g., observers chanting "Bid!").  
    - **Compensate**: **Ask observers**: *"Did you want to cheer or boo? How would that change the bidders’ choices?"*  

  - **Complex Emotions**:  
    - **Missing**: Guilt, rivalry, or vengeance.  
    - **Compensate**: **Roleplay**: *"What if the bidders were enemies? Would bonds hold?"*  

  ---

  ### **Why This Works for Your Class**  
  - **Econ Students**: See game theory (rational escalation in suboptimal structures).  
  - **Philosophy Students**: Explore self-binding (Ulysses contracts), weakness of will (akrasia).  
  - **All**: The bond makes abstract pre-commitment **tangible**, and public forfeits create memorable lessons.  

  **Final Tip**: Run a dry test with a colleague to refine timing. Good luck—this will stick in their guts!
