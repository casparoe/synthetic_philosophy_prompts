prompt: |-
  So I'm doing a module on nationalism and I keep getting stuck on the invention-of-tradition stuff — Hobsbawm's three types of invented tradition (the ones that manufacture social cohesion, the ones that legitimise authority, the ones that socialise people into shared norms), and Anderson's idea that nations are imagined communities held together by print and shared ritual rather than by anything genuinely ancient and continuous. The Scottish kilt and tartan example everyone reaches for is too well-worn for me; I want a case that isn't the standard one.

  The one I've been chewing on is the Welsh Gorsedd. As I understand it: a Glamorgan stonemason named Edward Williams, who went by the bardic name Iolo Morganwg, staged a ceremony on Primrose Hill in London in 1792 that he presented as the revival of the ancient druidic rites of the Welsh bards — except he'd largely made the ritual up and propped it up with manuscripts he'd forged (Dafydd ap Gwilym poems, triads, a chronicle, that sort of thing). The invented Gorsedd then got welded onto the eighteenth-century Eisteddfod revival, and today the robed, druid-ish ceremonies at the National Eisteddfod are just what Welsh tradition looks like to everyone. So take that whole episode and read it through Hobsbawm and Anderson. Map it properly — what exactly was invented versus borrowed versus genuinely old (there were real eisteddfods and real bardic poetry long before him, so where's the seam?), which of Hobsbawm's three functions the Gorsedd actually performs, and what work it does for a nation that has no state of its own. Anderson's imagined community is built on print capitalism and the vernacular; does Wales fit that or break it? And run it the other way too — what does this case do to the theories? Hobsbawm's examples tend to be state-backed and top-down, and this is a stateless nation revived from below by a forger; is that a counterexample, an extension, or just the same thing in different clothes? Tell me honestly where the theories go quiet — about the inventors' own sincerity, say, or about whether a tradition that people genuinely love is still 'invented' in the sense that matters. I dont need a reading list, just the analysis.
