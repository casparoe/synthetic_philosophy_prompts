  If you want a real addition to model selection, you might consider:

    In model selection, we usually prefer simpler models. But when the data is generated by a system with high Φ (high integration), then the best model is the complex joint model. Therefore, the value of Φ (as defined by the minimal KL divergence under partitioning) can be seen as a measure of how much we lose by using a factorized model. This can inform model selection: if Φ is high, we should not factorize.

