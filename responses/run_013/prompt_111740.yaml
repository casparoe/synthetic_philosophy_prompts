        φ(partition | s) = D( D(· | s) || D_factorized(· | s) )

    Then Φ(s) = min_{partitions} φ(partition | s)

  In AIT, we might say:

    The description length of the conditional distribution D(· | s) is K(D(· | s)). The factorized model has description length K(D_factorized(· | s)). However, the KL divergence measures the extra bits needed to encode samples from D using the factorized model.

  So the residue: the state-dependence and the specific form of the cause-effect repertoire.

  Honest view on the residue:

