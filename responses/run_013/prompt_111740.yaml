     - The requirement that the system must be a maximum of Φ: the exclusion axiom says that the conscious system is the one with the maximum Φ at a particular scale. In AIT, we can find the decomposition that minimizes the description length, but we don't have a principle that picks out a particular system as being the one that is conscious.

  Assessment of your proposal:

    Φ ≈ K(TPM_joint) - min_{partitions} K(TPM_factorized)

  This captures the idea that the joint description is more complex than the best factorized model. However, note that:

  - In IIT, Φ is computed using a specific divergence measure (often KL) on the cause-effect repertoire, not on the TPM directly. The TPM is used to compute the cause-effect repertoire.

  - The cause-effect repertoire is a distribution over past states (causes) and future states (effects) given the current state. So we are not just looking at the TPM (which is P(next|current)) but also at the distribution over past states given the current state (which requires the stationary distribution).

  - Therefore, your proposal about the TPM is a simplification. We would need to consider the entire joint distribution over time.

