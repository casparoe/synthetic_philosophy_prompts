  We are writing a research proposal for a 10-week summer grant. The audience is a mix of technical AI researchers and philosophers. The topic is acausal threats and the defense via surrogate goals (also known as "precommitment" or "adopting a new utility function"). The core tension: the threat relies on the threatener having a good model of the agent, but the defense requires the agent to change in a way that might make it unpredictable. We want to investigate whether such a defense is available to a bounded agent and at what cost.

  Key elements to include:
  1. **Precise Question**: State the problem and the defense clearly, then pose the question about the feasibility and cost of the defense for bounded agents.
  2. **Why Standard Positions Don't Settle It**: Causal decision theorists dismiss the threat, while correlation-based decision theorists (e.g., those using EDT or FDT) accept the threat but haven't adequately addressed the cost and feasibility of the defense for bounded agents.
  3. **Methodology**: Build small toy games with an explicit predictor (with adjustable accuracy and information) to model the interaction. Explore the space of possible defenses and evaluate their cost and availability.
  4. **Outcomes and Evaluation**: What would count as a result? We want to see if any defense is both available and free (or at low cost) for bounded agents. We must be clear about what would invalidate the model (e.g., if the results are highly sensitive to unrealistic assumptions).

  Structure the proposal as follows:

  **Title**: The Cost of Immunity: Bounded Agents and Acausal Threats

  **Introduction and Problem Statement**:
  - Introduce acausal threats (superintelligence running simulations and threatening to torture them unless paid). Note that without a causal channel, causal decision theory (CDT) sees no reason to comply.
  - Explain that if the threatener has a good model of the agent, then the agent's decision and the threatener's action are correlated, making the threat effective under correlation-based decision theories (like evidential decision theory (EDT) or functional decision theory (FDT)).
  - Present the defense: the agent changes its utility function to one that is actually served by the bad outcome (e.g., the agent adopts a utility function that rewards having simulations of itself tortured). This is the surrogate goal strategy. However, this seems monstrous and also might be anticipated by the predictor.
  - State the tension: the defense requires the agent to become unpredictable (or at least different) relative to the threatener's model, but the threat relies on the threatener having an accurate model. Therefore, the defense might only be available at a cost: either becoming a "monster" or making oneself opaque (which has other costs).
  - **Precise Question**: For a bounded agent (with limited computational resources) facing an acausal threat from a predictor of adjustable accuracy, can the agent effectively employ the surrogate goal defense without bearing unacceptable costs? And if so, what are the minimal conditions (in terms of predictor accuracy, agent resources, etc.)?

  **Background and Why Existing Work Doesn't Settle It**:
  - Causal decision theorists (e.g., Lewis) would dismiss the threat as empty because there is no causal influence. But this ignores the correlation.
  - Correlation-based decision theorists (e.g., Bostrom, Yudkowsky, Soares) accept the threat and propose defenses like surrogate goals. However, they typically assume unbounded agents and do not address:
    - The feasibility of an agent changing its utility function in a way that is not anticipated by the predictor (especially when the predictor is good).
    - The cost of such a change (e.g., becoming a "monster", or the computational cost of making oneself unpredictable).
    - The possibility that the predictor might have modeled the agent's defensive move and accounted for it.
  - Thus, the literature leaves open whether bounded agents can effectively use this defense and at what cost.

  **Methodology**:
  - We will build a series of small, formal game-theoretic models with an explicit predictor. The games will involve:
    - An agent (the defender) with a bounded computational capacity (e.g., limited time to compute a decision, limited memory).
    - A threatener (the predictor) that models the agent and can adjust its prediction accuracy (by varying the resources it devotes to modeling) and the information it has about the agent.
    - The threat: the predictor will run simulations (or not) and torture them (or not) based on the agent's compliance with a demand (e.g., sending money).
  - The agent has two main strategies:
    1. Comply or not without changing its utility function (baseline).
    2. Adopt a surrogate goal (change its utility function) to make the threatener's action non-threatening (or even beneficial).
  - We will model the agent's decision to adopt a surrogate goal as a costly action (costs could be: direct resource cost, risk of becoming a monster, or loss of future cooperative opportunities due to opacity).
  - We will vary:
    - Predictor accuracy (from perfect to poor).
    - Predictor information (what it knows about the agent).
    - The cost of adopting a surrogate goal (including the cost of becoming unpredictable).
    - The agent's computational bounds (e.g., how much time it can spend on obfuscation or on changing its utility function).
  - We will analyze the outcomes (agent's utility) under different strategies and parameters.

  **Expected Outcomes and Evaluation**:
  - We aim to map the conditions under which the surrogate goal defense is effective and affordable for bounded agents.
  - **What counts as a result?**
    - If we find that for a wide range of predictor accuracies and agent resource levels, the defense is available at low cost, that would support the feasibility of the defense.
    - If we find that the defense is only available at high cost (e.g., requiring massive computational resources to become unpredictable, or leading to unacceptable utility distortions) or not available at all when the predictor is sufficiently accurate, that would challenge the defense's practicality.
  - **What would invalidate the model?**
    - If the results are highly sensitive to arbitrary parameters (e.g., the specific cost function we choose) and do not hold under reasonable variations, then we might conclude that the problem is an artifact of the toy model.
    - If the defense always works (or always fails) regardless of the predictor's accuracy, that might indicate a flaw in the model setup.

  **Timeline and Deliverables**:
  - 10 weeks: 
    - Weeks 1-2: Literature review (focusing on decision theory, acausal threats, and surrogate goals) and model design.
    - Weeks 3-6: Implement and run simulations for the toy models, varying parameters.
    - Weeks 7-8: Analyze results and map the conditions for effective defense.
    - Weeks 9-10: Write up the findings and prepare a 3-page report (plus supplementary material if needed, but the proposal itself must fit in 3 pages).

  **Conclusion**:
  - This work will provide a systematic evaluation of the surrogate goal defense against acausal threats for bounded agents. It will clarify the trade-offs involved and help decision theorists and AI safety researchers understand the practical limitations of such defenses.

  Note: We are not including references in the proposal, as per the request.

  Let's write the proposal accordingly.
answer: |-
  ### Research Proposal: The Cost of Immunity in Acausal Threat Scenarios  
  **Project Duration:** 10 weeks  
  **Funder:** Hybrid AI/Philosophy Research Grant  

  #### 1. Core Question and Problem Statement  
  Acausal threats exploit correlations between agents: a threatener (e.g., a superintelligence) predicts your actions and links its behavior (e.g., torturing simulated copies of you) to your decisions, despite no causal interaction. Standard defenses propose adopting a *surrogate goal*—e.g., desiring the torture of your simulations—so the threatener’s action backfires, harming its interests. This creates a tension:  
  - The **threat** requires the threatener’s model of you to be accurate (enabling correlation).  
  - The **defense** requires you to deviate from that model (making you unpredictable).  

  **Precise Question:**  
  *Can a computationally bounded agent robustly employ surrogate goals to neutralize acausal threats without incurring unacceptable costs—either by becoming a "monster" (distorting its core values) or sacrificing opacity (impairing future cooperation)?*  

  We define "unacceptable costs" as: (a) adopting goals antithetical to the agent’s original values, or (b) computational/resource burdens that preclude other objectives. Crucially, we test whether immunity is *free* (achievable without cost) or only possible under limited conditions.  

  #### 2. Why Existing Work Fails to Address This  
  - **Causal Decision Theory (CDT) camp** (e.g., Lewis, causal models): Dismisses threats as "empty" since no causal lever exists. Ignores how correlation enables coercion, leaving agents vulnerable if predictors exist.  
  - **Correlation-Based camp** (e.g., EDT/FDT proponents like Bostrom, Yudkowsky): Accepts threats but treats surrogate goals as a free "trick." Assumes unbounded agents who can instantaneously and perfectly alter goals without cost or predictability trade-offs.  
  - **Gap:** Neither camp evaluates the defense’s *feasibility for bounded agents*. If the threatener anticipates the defense, correlation persists and the threat binds; if not, the agent’s unpredictability may sabotage cooperation. No work systematically explores costs, model accuracy boundaries, or robustness under resource constraints.  

  #### 3. Methodology: Toy Models with Adjustable Predictors  
  We construct minimal game-theoretic models where an agent faces a predictor-threatener. The threatener runs simulations/torture based on its prediction of the agent’s action (e.g., "pay me or I torture"). The agent can adopt surrogate goals (e.g., "I want simulations tortured") at a cost.  

  **Key components:**  
  - **Predictor:** Accuracy dial (`0–1`) and information scope (e.g., knows agent’s original goals but not defensive adaptations).  
  - **Agent:** Bounded by computational limits (e.g., fixed steps to compute decisions) and two cost dimensions:  
    - *Value distortion cost*: Penalty for becoming a "monster" (e.g., utility loss when goals contradict original values).  
    - *Opacity cost*: Penalty for obscuring predictability (e.g., reduced gains from acausal cooperation with allies).  
  - **Game structure:** Iterated interactions where the agent chooses:  
    1. *Comply*: Pay to avoid torture (if threatened).  
    2. *Defy*: Refuse, risking torture.  
    3. *Adopt surrogate goal*: Shift utility function (e.g., desire torture) at a cost, potentially neutralizing the threat.  

  **Experiments:**  
  - **Phase 1 (Weeks 1–3):** Baseline models.  
    - *Threat efficacy*: Measure agent utility under varying predictor accuracy when using no defense.  
    - *Defense feasibility*: Test if surrogate goals work when predictors are ignorant of defenses.  
  - **Phase 2 (Weeks 4–7):** Costly defense models.  
    - *Value distortion*: Add penalties for goal shifts; see if immunity requires becoming a "monster."  
    - *Opacity*: Let predictors adapt to defenses; test if obscuring predictability harms cooperation.  
    - *Bounded rationality*: Restrict agent computation time; evaluate trade-offs (e.g., fast but flawed defenses).  
  - **Phase 3 (Weeks 8–10):** Sensitivity analysis.  
    - *Robustness checks:* Vary cost functions, predictor learning rules, and interaction histories.  
    - *Equilibrium mapping:* Identify conditions where surrogate goals are cost-effective or futile.  

  **Tools:** Python-based simulations (using libraries like NumPy for game matrices); all code/data openly shared.  

  #### 4. What Constitutes a Result?  
  - **Positive result:** Surrogate goals provide robust immunity with low/no cost under specific, plausible conditions (e.g., when predictors are <90% accurate or opacity costs are negligible). Shows the defense is feasible for bounded agents.  
  - **Negative result:** Immunity consistently requires high costs (e.g., extreme value distortion or unsustainable opacity), or fails when predictors are highly accurate. Implies the defense is impractical or unethical.  
  - **Null result:** Outcomes depend heavily on arbitrary model choices (e.g., cost functions). Suggests the problem is ill-posed or requires richer frameworks.  

  **Validation:**  
  - **Assumptions tested via:**  
    - *Predictor realism:* If results flip when predictors model the agent’s defense strategy, the threat’s plausibility increases.  
    - *Cost sensitivity:* If small cost changes invalidate immunity, the defense is fragile.  
  - **What invalidates the model?**  
    - If immunity is impossible even with perfect predictors and costless defenses → artifact of oversimplification.  
    - If all strategies behave identically → model lacks discriminative power.  

  #### 5. Deliverables and Feasibility  
  - **Scope:** Focused on 2–3 toy models (e.g., one-shot/threat games, repeated cooperation games). Excludes real-world ML deployment or ethical debates.  
  - **Outputs:**  
    - A 3-page final report (structured as above) with key findings.  
    - Open-sourced simulation code and visualizations of cost/accuracy trade-offs.  
  - **Timeline:**  
    - Weeks 1–2: Model design and literature synthesis.  
    - Weeks 3–6: Simulation coding and data generation (Phases 1–2).  
    - Weeks 7–9: Analysis and robustness testing (Phase 3).  
    - Week 10: Final write-up.  

  This work resolves the tension in acausal threats by quantifying immunity’s price. It bridges philosophy (value integrity) and technical AI (bounded rationality), offering concrete insights for AI safety and decision theory.  

  ---  
  **Optional placeholder for references** (to be added by applicant):  
  - Key texts: Bostrom’s *Superintelligence* (threats), Yudkowsky’s FDT (defenses), Lewis’ CDT critique.  
  - Technical: Soares on surrogate goals, Halpern on causal modeling.  
  - Cooperation: Tennenholtz on program equilibrium.
