prompt: |-
  I read a blog post about revealed preference and I'm not sure how much too trust it. Here's the gist: "Revealed preference was Samuelson's way of getting rid of utility. Talk about what people really want, or get satisfaction from, is untestable, so the theory just defines a preference as a pattern in someone's choices — utility becomes a name for the choices rather than anything behind them. Samuelson's point was that a theory only has to predict, not to be true of the mind: people behave as if they maximize utility. As long as someone's choices are consistent (no cycles, no picking B over A here and A over B there), we can always assign them a utility function that they're maximizing. So welfare economics doesn't need to peer into anyone's head: if you choose X when Y was available and no more expensive, X is better for you, period. The only real constraint is the axiom of revealed preference, which says that if you pick A when B is on the table, you can never pick B when A is available. Critics like Sen complain this is too thin to ground welfare claims, since people also choose out of politeness or duty."

  Something about the welfare sentence and the last two feels off, but I can't tell where the line falls between "standard textbook simplification" and "just wrong." Can you go through it claim by claim and tell me what someone who actually works on this would nod at, wince at, or reject — and whether the punchline about welfare survives once the summary is cleaned up?

  Format it like this: a 2-3 sentence "Bottom line" up front; then "What holds up" (one short paragraph); then "Where it slips" (the bulk of the answer, claim by claim); then "Cleaned-up version" (a short paragraph rewriting the summary so it only says what it can honestly say).
