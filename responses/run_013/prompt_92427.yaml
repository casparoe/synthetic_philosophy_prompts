answer: |-
  ### Joint Statement: Universalism vs. Organicism on the Special Composition Question  

  #### Agreed Claims (Both Signatories Endorse):  
  1. **Simples Exist:** There are fundamental, partless entities (e.g., elementary particles).  
  2. **Composition Occurs in Organisms:** Living organisms (e.g., cats, trees) are uncontroversial composite objects.  
  3. **Definition of Composition:** Composition is the relation whereby *distinct objects jointly form a new, distinct object*.  
  4. **Paradigm Cases Are Clear:** Tables (as artifacts) and rocks (as non-living aggregates) are *not* composite objects if organicism is true, but *are* if universalism is true.  
  5. **Ontological Commitment Matters:** The dispute concerns what *fundamentally exists*—not merely conceptual or linguistic differences.  
  6. **Counterexamples Must Target Principles:** Arguments against organicism must challenge the necessity of *life*; arguments against universalism must challenge the coherence or parsimony of *arbitrary fusions*.  

  #### Residual Disagreements & Cruxes  
  | Disagreement                                                                 | Universalist Wording                                                                 | Organicist Wording                                                                 |  
  |-------------------------------------------------------------------------------|--------------------------------------------------------------------------------------|------------------------------------------------------------------------------------|  
  | **Necessary Condition for Composition**                                       | "Composition occurs for *any* plurality of objects, regardless of their relations." | "Composition occurs *only* when a plurality’s activities constitute a *life*."     |  
  | **Existence of Arbitrary Objects**                                            | "A rock and a tree compose an object (a ‘rock-tree fusion’) that exists."            | "No such object exists; only the rock, the tree, and their parts exist."           |  

  #### Cruxes, Test Cases, and Predictions  
  1. **Crux: Is functional integration sufficient for composition without life-processes?**  
     - **Test Case:** *Siphonophores (e.g., Portuguese man o' war)*.  
       - **Organicist Prediction:** Composition occurs *only if* the zooids exhibit interdependent, life-sustaining functions (e.g., shared metabolism, coordinated reproduction). If integration is mechanical (not biological), it fails.  
       - **Universalist Prediction:** Composition *always* occurs (trivially), but siphonophores are *also* composite under any non-restrictive view.  
     - **Settling Power:** If organicists deny composition here, universalists argue it exposes arbitrariness.  

  2. **Crux: Does transient biological unity suffice for composition?**  
     - **Test Case:** *Slime mold (Dictyostelium) in slug phase*.  
       - **Organicist Prediction:** Composition *fails*—the slug is a temporary aggregate of amoebae (not a genuine organism), lacking unified *self*-sustenance.  
       - **Universalist Prediction:** Composition occurs (as with any plurality), but the slug is *additionally* composite under biological criteria.  
     - **Settling Power:** If organicists affirm composition, universalists argue it collapses into universalism; if denied, organicists face boundary problems.  

  #### Verbal Disagreement Assessment  
  - **Merely Verbal Element:** The dispute *partly* concerns the univocality of "object."  
    - Universalists use "object" for *any mereological sum* (ontologically permissive).  
    - Organicists reserve "object" for *integrated wholes* (ontologically restrictive).  
  - **Substantive Core:** The disagreement remains ontological: **Do reality’s fundamental joints include non-living composites?** Universalists say *yes* (parsimony in rules); organicists say *no* (parsimony in entities).  

  ---  
  **Word Count:** 698  
  *This statement isolates ontological commitments while forcing confrontation with edge cases. Both sides concede ground on paradigm organisms but retain core principles. The slime mold test is decisive: if organicists reject it, their "life" criterion avoids universalism but risks ad-hoc boundaries; if accepted, universalism gains leverage.*
