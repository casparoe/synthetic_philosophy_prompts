prompt: |-
  I am assembling materials for a graduate seminar on moral particularism and generalism, and I want to close the unit with a poem that performs the philosophical work rather than merely gesturing at it. Please write a sestina.

  The subject is the particularist's central claim: that a feature which functions as a reason for acting in one situation may function as a reason against acting, or as no reason at all, in another — that the moral relevance of a consideration is a function of context all the way down, so that no finite inventory of features carries a fixed valence. I want the form to enact this rather than describe it. Choose six end-words that name features a generalist would be tempted to treat as having stable significance — for instance, harm, promise, pleasure, need, truth, consent — and arrange the poem so that each word, as it rotates through the stanzas, does a different job each time it returns: on one appearance it should count in favor of an action, on another against it, and on a third it should be inert, a feature that in that context matters not at all. A reader who knows the debate should be able to tell, at each recurrence, which of the three roles the word is playing, and should feel the argument in the fact that the same word cannot be pinned to a single role.

  The six situations the stanzas turn on should be concrete and ordinary, the kind of thing a person might actually face, so that the poem stays about moral life and not about metaethics in the abstract. The envoi should gather the six words as the form requires but should refuse to deliver a moral: no summarizing rule, no closing verdict, since the point is precisely that the poem cannot be reduced to one. Let it end on the tension rather than resolving it.

  Begin the response with the poem itself, with no preface and no commentary. Write in American English.
reasoning: |-
  Okay, the user is assembling materials for a graduate seminar on moral particularism versus generalism. They specifically want a sestina that performs the philosophical argument rather than just describing it. The core idea is that moral reasons are context-dependent—features like "harm" or "promise" can be reasons for, against, or irrelevant depending on the situation. 

  Hmm, the challenge is to make the form enact this. A sestina's rotating end-words are perfect because they force the same word to shift roles across stanzas. Need six morally charged words that generalists might see as stable: I land on harm, promise, need, truth, consent, pleasure. Classic candidates with intuitive valence.  

  Now to map each word’s trajectory:  
  - Harm: Must sting as a reason against (stanza 1: refusing painkillers), then pivot to neutral (stanza 4: harmless white lie), finally become a reason for (stanza 6: vaccine side effects).  
  - Promise: Starts as binding reason for (stanza 2: childcare), shifts to reason against when conflicting (stanza 3: outing a secret), ends inert (stanza 5: irrelevant to triage).  
  - Need: First inert (stanza 1: patient’s pain overrides), then reason for (stanza 3: sheltering a friend), later reason against (stanza 6: neighbor’s demand vs. child’s safety).  

  The scenes must feel ordinary yet charged—no thought experiments. Stanza 1: medical ethics (pain relief). Stanza 2: social obligation (keeping promises). Stanza 3: conflicting loyalties (secret vs. duty). Stanza 4: petty deception (harmless lie). Stanza 5: triage (ignoring promises). Stanza 6: parenting dilemma (vaccine vs. complaint).  

  Envoi’s the trickiest. Must weave all six words while refusing resolution. "Judge" and "situation" underscore context-dependence. "No rule" directly rejects generalism. Ending on "pleasure" / "consent" / "need" mid-debate leaves tension raw.  

  ...Did I smuggle in metaethics? No—each stanza stays anchored in concrete choices. The nurse, the babysitter, the friend: all recognizable moral agents. Good.  

  Final check: Can a particularist spot the shifting roles? Hope so. When "truth" is inert in stanza 4 (white lie) but a reason against in stanza 5 (brutal honesty during crisis), the work’s done. Form follows function.  

  *[Takes a breath]* Here goes nothing.
answer: |-
  **Sestina for the Particularist**

  The nurse holds back the dose, citing potential **harm**,
  though agony claws the patient’s bones. A prior **promise**
  to avoid strong drugs feels distant now. What meets the **need**
  is relief, swift and deep. The charted **truth**
  of allergy matters less than this choked scream. Does **consent**
  given in calm hours bind when drowning? Where lies **pleasure**?

  No joy, no ease, just duty kept brings grim **pleasure**
  to the weary sitter. She fulfills her **promise**,
  ignoring texts from friends. The child’s soft **need**
  for routine outweighs their own slight wish. This **harm**
  is self-inflicted, chosen. Quiet **truth**:
  a small life thrives on steadfast **consent**.

  But when a friend begs shelter, hides from **harm**,
  seeking safe harbor, offering no **pleasure**,
  just shared fear in the night… do you break **promise**
  to a confidante who demanded **truth**?
  Their secret weighs heavy. Revealing meets a **need**
  for safety, perhaps, but shatters trust. Whose **consent**
  matters most? The frightened soul, or the one whose **consent**
  wasn’t sought? The quiet house offers no **pleasure**,
  only the chill of betrayal. Is the greater **harm**
  in exposure, or in broken faith? The aching **need**
  for refuge wars with the brittle **truth**
  of a spoken vow, a binding **promise**.

  A harmless vanity, a small untruth:
  “Your haircut looks quite sharp!” No real **harm** done,
  just oil on troubled water, fleeting **pleasure**
  granted. The deeper cut of honest **truth**
  would serve no pressing good, fulfill no **need**,
  just wound. Here, silence wears **consent**’s soft cloak.
  No promise binds the tongue to pointless pain.

  In the storm’s wreckage, triage sorts by **need**.
  The moan here, silence there. A whispered **promise**
  to “find help soon” feels hollow air. Raw **truth**:
  this leg is shattered, that one’s bleeding worse. **Consent**
  is a luxury drowned by circumstance. What **harm**
  delaying comfort brings? Relief, not **pleasure**,
  guides the shaking hand.

  The child’s cry pierces dawn, a sharp-edged **need**.
  The vaccine’s tiny sting, a necessary **harm**,
  brings future safety. Coaxing yields no **consent**,
  just trembling fear. Is forced protection **truth**’s
  cruel face? Or love’s deep, unjoyous **pleasure**?
  Outside, the neighbor knocks, demanding **promise**
  kept about the fence line – irrelevant **need**.

  Judge not by feature – **harm**, **promise**, **pleasure**,
  **need**, **truth**, **consent** – alone. The situation
  holds the shifting weight. No rule contains the dance.
