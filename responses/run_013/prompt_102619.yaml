  ## Six Minutes on the Neolithic Ratchet  
  *(Commencement Address for the Class of [Year])*

  Well. Hello, everyone. Parents, grandparents, friends… my incredibly patient colleagues up front who’ve heard me talk about charred barley grains more times than anyone should… and most of all, you, the Class of [Year]. Dean [Name] told me to be profound, inspirational, and brief. I specialize in the Early Neolithic. Brief is… aspirational. Bear with me.

  I teach archaeology. I dig up things people dropped, broke, or buried ten thousand years ago. It means I spend a lot of time thinking about *beginnings*. And standing here, at *your* beginning… well, it got me thinking about arguably the biggest beginning of all: the moment our species traded the spear for the sickle. The shift to farming.

  Now, commencement speeches love progress. "You stand on the shoulders of giants!" "Humanity ascends!" And look, farming *was* revolutionary. It let us build cities, write symphonies, invent… well, *this*. (Gestures vaguely at the podium, the crowd). Without agriculture, I wouldn’t be up here mildly panicking, and you wouldn’t be sitting there wondering when lunch is.

  But here’s the thing my research keeps whispering: **it’s complicated.** This wasn’t some lightbulb moment – “Eureka! Wheat!” – and suddenly everyone was better off. It crept in, region by region, over millennia. Picture your great-great-(times a thousand)-grandparents, not making a grand “civilization-or-bust” choice, but just… trying to feed the kids next winter. Maybe they were already settled near a rich marsh, storing nuts, living in villages *before* they planted a single seed. Maybe they saw a neighbour’s fuller granary and thought, “Huh. Maybe…”

  And the story we sometimes hear? That before farming, life was a picnic – fifteen-hour work weeks, egalitarian bliss? Well, the evidence isn’t so tidy. Foragers faced hunger, disease, violence. Farming didn’t invent suffering. But it *did* change its shape. More people could live packed together… but that meant more mouths when blight hit. Surplus grain could be stored… which also meant it could be *taken*. And slowly, unevenly, over centuries, not overnight, those surpluses, that settled life… it built foundations. Foundations for libraries, yes. But also foundations for walls, for granaries guarded by spears, for some people telling other people what to do. The real revolution wasn’t just planting seeds; it was planting the seeds of *scale* and *storage*, for better *and* worse.

  So… was it a **mistake**? That’s the provocative question some ask. When I see the worn teeth and stunted bones in some early farmer graves, or think about the epidemics that thrived in crowded villages… part of me winces. When I ponder the deep inequalities that eventually grew from that stored surplus… it’s hard not to feel a pang for paths not taken.

  But calling it a "mistake"? That feels… off. Like blaming a river for flooding. Nobody voted on the Agricultural Revolution. It wasn’t a choice between Option A: Noble Savagery and Option B: Civilization™. It was a slow, demographic ratchet. More calories per acre meant more people. And once you have more people, you *need* those calories. You can’t just un-invent the village, un-birth the children. It wasn’t a wrong turn; it was a current pulling us forward, carrying both possibility and peril.

  **(Leans in slightly, voice quieter, more personal)**
  So why am I telling you this *now*, on your day of celebration? Because beginnings matter. Because the story we tell about our past shapes how we see our future. If we pretend it was all simple progress, we blind ourselves to the costs. If we call it all a disaster, we paralyze ourselves with regret.

  You aren’t starting from Eden, or from some pristine past. You’re starting from *here*. From a world built layer by layer on choices made millennia ago – choices with profound, often unintended consequences. Some brought us wonders. Some brought us burdens we’re still struggling under. **The gift of knowing this history isn’t a verdict; it’s a set of tools.**

  You graduate into a complex, often unequal, frequently daunting world – one shaped profoundly by that ancient shift to grain and surplus. Knowing it wasn’t inevitable, knowing its costs weren’t preordained, knowing it unfolded messily over time… that’s power. It means the structures you inherit aren’t sacred. The burdens aren’t natural laws. They’re the results of long chains of human action and reaction. And that means they can be examined. Challenged. Improved.

  You built something incredible here. Knowledge. Community. Resilience. Now you go build more. But build **knowingly**. Build with an awareness that the deepest foundations – even the ones laid ten thousand years ago – can be questioned. Build with the courage to ask not just “How do we progress?” but “*What kind* of progress?” Build with an eye not just to the surplus you might create, but to how it might be shared. How it might lift, rather than divide.

  Your journey starts *after* countless beginnings. Don’t be bound by them. Learn their weight, understand their currents, and then…

  **…steer.**

  **Congratulations, Class of [Year]. Go cultivate a better harvest.**

  ---

  **Verdict:** The Agricultural Revolution was not a "mistake," but a profound, unintended demographic transformation whose complex legacy of both abundance and inequality continues to shape the human journey, demanding our clear-eyed engagement.
