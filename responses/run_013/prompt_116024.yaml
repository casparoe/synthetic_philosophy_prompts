prompt: |-
  I teach Bostock v. Clayton County in a jurisprudence unit on statutory interpretation precisely because it frustrates the textbook contrast between textualism and purposivism: the majority opinion is avowedly textualist and reaches the liberal result, while the principal dissent reaches the conservative result and charges the majority with departing from the text. I want the case worked in both directions, and on the crux rather than at the level of slogans.

  The crux is not whether ordinary public meaning governs -- both opinions accept that -- but what the ordinary public meaning of the statutory phrase is. The majority reads it as imposing a but-for causal condition on the outcome, so that any reliance on the employee's sex in the decision is sufficient however the employer labels its reason; the principal dissent reads it as identifying the ground on which the employer acted, and denies that orientation or gender identity is that ground. Use the distinction between what a sentence means and what a speaker means by it on the first question, and the philosophy of action -- Davidson's claim that reasons are causes -- on the second: does the causal theory of action collapse the two readings into one, or show that they were never in genuine conflict?

  Then say what each theory holds the Court to have confronted and to have been required to do, which features of the case each explains and which it misdescribes, and whether the fact that two opinions both resting on ordinary public meaning reach opposite results shows that the method underdetermines outcomes or only that one of them misapplied it. Close with a definite verdict: should the text/purpose divide be recast as a divide over semantic versus communicative content, or does the older contrast survive? Defend that verdict against the strongest objection you can formulate rather than surveying the options.
reasoning: |-
  Okay, the user is teaching Bostock v. Clayton County in a jurisprudence unit focused on statutory interpretation. They want to highlight how this case complicates the traditional textualism vs. purposivism dichotomy. The majority opinion, written by Gorsuch, is textualist but reaches a liberal outcome, while Alito's dissent is conservative and accuses the majority of straying from the text. The user wants to dive deep into the crux of the case rather than staying at the surface level.

  The crux isn't about whether ordinary public meaning governs—both sides agree on that—but rather what the ordinary public meaning of "because of sex" actually is. The majority sees it as a but-for causation test, while the dissent argues it's about the employer's stated grounds for action. The user wants to apply two philosophical lenses: Grice's distinction between sentence meaning and speaker meaning for the first issue, and Davidson's causal theory of action for the second. The key question is whether Davidson's theory collapses the two readings or shows they were never truly in conflict.

  For my analysis, I need to break down how each approach (textualism vs. purposivism) interprets the court's role in this case, what each explains well and misdescribes, and whether the disagreement shows that textualism underdetermines outcomes or if one side just misapplied it. Finally, I need to take a clear stance on whether the text/purpose divide should be recast as semantic vs. communicative content or if the old contrast still holds, defending this against strong objections.

  Starting with the Gricean distinction: sentence meaning ("because of sex" as but-for cause) vs. speaker meaning (Congress's intent in 1964). Gorsuch sticks to semantic content, while Alito leans toward communicative intent. Then applying Davidson: if reasons are causes, then the employer's stated reason (e.g., "firing for being gay") is still causally dependent on sex, collapsing Alito's distinction. This suggests the readings aren't in conflict—Alito's focus on "grounds" is just surface-level.

  For the statutory theories: Textualism (as per majority) sees the court confronting semantic content alone, disregarding expected applications. Purposivism (implied in dissent) sees the court needing to honor the legislative purpose. The majority explains linguistic consistency well but misdescribes Congress's expectations. The dissent captures legislative surprise but misdescribes the causal logic.

  The fact that both sides claim textualism but disagree doesn't prove textualism underdetermines outcomes; it shows misapplication. Alito conflates semantic meaning with expected application, while Gorsuch correctly separates them.

  My verdict: recast the divide as semantic vs. communicative content. This fits better because both opinions are textualist in method but diverge on content type. The strongest objection is that this oversimplifies purposivism, which isn't just about intent but holistic purpose. Counter: even purposivists like Hart/Sacks distinguish "purpose" from subjective intent, and communicative content (contextual meaning) bridges text and purpose. In Bostock, Gorsuch’s approach is fundamentally about semantic content, making the recast more precise.
answer: |-
  Your pedagogical approach to *Bostock* is astute—it forces students to grapple with the methodological tensions beneath the slogans. Here’s a rigorous analysis structured around your prompts:

  ### 1. **The Crux: Ordinary Meaning of "Because of Sex"**  
     - **Majority (Gorsuch)**: Reads "because of sex" as imposing a *but-for causation* test. If sex is a necessary factor in the adverse action (e.g., firing a man for dating men but not a woman), discrimination "because of sex" occurs, irrespective of the employer’s stated motive (e.g., "I fired for homosexuality, not sex").  
     - **Dissent (Alito)**: Reads "because of sex" as requiring sex to be the *ground* or *explanation* for the action. Since the employer’s stated reason (sexual orientation/gender identity) is distinct from sex *in their mind*, no discrimination occurs.  

  ### 2. **Gricean Distinction & Davidsonian Action Theory**  
     - **Sentence Meaning vs. Speaker Meaning (Grice)**:  
       - **Sentence meaning (literal)**: The majority’s but-for test isolates the semantic content of "because of X" as a causal condition.  
       - **Speaker meaning (intentional)**: The dissent invokes Congress’s 1964 intent (to target sex-specific discrimination, not LGBTQ+ issues).  
       - **Conflict**: Gorsuch argues speaker meaning is irrelevant to textualism; Alito conflates it with sentence meaning by insisting the "ground" must align with Congress’s expectations.  
     - **Davidson’s "Reasons as Causes"**:  
       - If reasons *are* causes (Davidson), the employer’s stated reason ("fired for being gay") is still *caused by* the employee’s sex. The dissent’s "ground" is merely a *description* of the cause, not a distinct causal pathway.  
       - **Collapse?**: Davidson collapses the two readings: Alito’s "ground" is just a *redescription* of the same causal chain Gorsuch identifies. E.g., "firing for homosexuality" *is* "firing for sex" under but-for causation. The conflict is illusory—Alito’s objection is metaphysical (categories) rather than causal.  

  ### 3. **What Each Theory Confronts & Requires**  
     - **Textualism (Majority)**:  
       - **Confronts**: Semantic content of "because of sex" in 1964.  
       - **Requires**: Applying the but-for test neutrally, disregarding unforeseen applications.  
       - **Explains**: Linguistic consistency (parallel to race discrimination cases).  
       - **Misdescribes**: Congress’s likely expectation that "sex" excluded LGBTQ+ issues.  
     - **Purposivism (Dissent)**:  
       - **Confronts**: Legislative purpose to combat sex-based stereotypes.  
       - **Requires**: Aligning outcomes with original legislative aims.  
       - **Explains**: Why Congress didn’t anticipate this application.  
       - **Misdescribes**: The causal logic of discrimination (Davidson undermines the "grounds" distinction).  

  ### 4. **Underdetermination or Misapplication?**  
     The split stems from **misapplication by the dissent**, not textualism’s indeterminacy.  
     - Alito errs by:  
       (a) Conflating "ordinary meaning" with *expected applications* (a purposivist move),  
       (b) Rejecting but-for causation despite its standard use in discrimination law,  
       (c) Importing extratextual "grounds" criteria.  
     - Gorsuch consistently applies textualism’s own premises: linguistic rules (but-for causation) + semantic context (dictionary definitions, Title VII precedents).  

  ### 5. **Verdict: Recast the Divide as Semantic vs. Communicative Content**  
     **Definite Verdict**: The text/purpose divide *should* be recast as **semantic content (linguistic meaning) vs. communicative content (contextual/intended meaning)**.  
     - **Why?** *Bostock* exposes that both opinions are "textualist" in method but diverge on *which layer of meaning* governs:  
       - Gorsuch: Semantic content alone ("because of sex" = but-for causation).  
       - Alito: Communicative content (Congress’s expected scope of "sex").  
     - This reframing resolves the paradox: Semantic textualism (Gorsuch) and communicative textualism (Alito) are distinct subspecies. The old "text vs. purpose" dichotomy obscures this, as purposivism is subsumed under communicative intent.  

  #### **Defense Against Strongest Objection**  
     **Objection**: "This recasting erases purposivism’s distinct concern for *legislative purpose* (e.g., statutory goals, not just intent). Semantic/communicative is still trapped in linguistic philosophy, ignoring policy consequences."  
     - **Rebuttal**:  
       (1) **Purpose is Communicative Content**: Legislative "purpose" is a subset of communicative intent—what the law *aimed to achieve* in context (e.g., Scalia’s "objectively manifested intent").  
       (2) *Bostock* **Proves the Point**: Alito’s dissent is *not* purposivist in a policy-driven sense (e.g., dynamic updating); it’s originalist-communicative (what did 1964 legislators understand "sex" to cover?).  
       (3) **Policy Consequences**: Textualists like Gorsuch explicitly reject consequences as irrelevant—reinforcing that the divide is *hermeneutic* (meaning derivation), not consequentialist.  

  **Conclusion**: *Bostock* demonstrates that the core clash is not text vs. purpose, but *which dimension of textual meaning* controls. Recasting the divide as **semantic vs. communicative content** better explains the fracture in textualist ranks and demystifies the case’s jurisprudential tension. The older contrast survives only as a crude proxy for this deeper split.
