  Keep the scenario to a paragraph, and don't stipulate the verdicts — the akrasia has to fall out of the structure. Then: walk through what each account says and why, tell me which single feature is doing the work, say what the smallest change is that would turn it into a textbook hyperbolic-discounting case instead, and say how someone convinced it's really just time-inconsistent preference would redescribe it to rescue the model.
