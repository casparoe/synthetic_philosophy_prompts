answer: |-
  Here’s the scenario:

  > *Eva, a meticulous architect, must finalize and send a complex client proposal by 9 PM to meet a deadline. She knows completing it requires 90 minutes of focused work. At 7:30 PM, having cleared her schedule, she resolves to start immediately. She believes sending it tonight is better than requesting an extension: the proposal’s quality is high, the client expects timeliness, and delaying risks her reputation. When 7:30 arrives, she still unequivocally ranks **sending it tonight** over **delaying it**. Yet, seated at her desk, she feels a paralyzing wave of anxiety about the proposal’s perfection. Though fully capable and believing she *should* start, she instead refreshes her email pointlessly for 90 minutes, missing the deadline.*

  ### Analysis:
  1. **Hyperbolic Discounting Account Prediction**:  
     Eva’s preference ranking is stable: "send tonight" > "delay" at all times. With no steep discounting of future rewards (e.g., no craving for immediate leisure), hyperbolic discounting predicts she’ll act on her higher-ranked option: *she sends the proposal*.  
     **Why it fails**: It cannot explain inaction when there’s no competing *immediate* reward or preference reversal. Her avoidance yields no pleasure — it’s pure anxiety-driven paralysis.

  2. **Akrasia Account Diagnosis**:  
     Straightforward weakness of will. Eva acts against her settled, unchanging judgment due to a breakdown in *executive control*. The key feature is **volitional failure under negative affect** (anxiety). Her rational assessment is intact, but her capacity to *initiate action* is impaired by visceral emotion, despite identical preferences before and during the moment.

  ### Key Feature Doing the Work:
  **Emotional interference with action initiation** — not a shift in valuation, but a disconnect between judgment and enactment under acute distress.

  ### Smallest Change to Create Hyperbolic Discounting:
  Introduce a tempting alternative *with immediate rewards*.  
  *Revised*: At 7:30 PM, Eva considers starting work or watching a new episode of her favorite show *now*. She still believes sending the proposal is better overall, but the immediate pleasure of watching TV outweighs the distant reward of meeting the deadline. She chooses TV — a classic preference reversal via near-term discounting.

  ### How a Discounting Theorist Might Redescribe It:
  They’d argue Eva *implicitly* re-ranks options due to covert time inconsistency:  
  *“Avoiding anxiety becomes a high-value immediate ‘reward.’ The disutility of anxiety at 7:30 PM is steeply discounted if delayed, making ‘delay the task’ *feel* preferable *now* despite her professed ranking. Her stated preference is overridden by latent present bias toward anxiety reduction.”*  
  This rescues the model by reinterpreting anxiety relief as an unconsciously preferred immediate good — a move the original case excludes by design (no new rewards, no deception).

  ### Why This Case Matters:
  It isolates **executive akrasia** — failure to enact a stable intention *solely* due to volitional collapse — from preference-based accounts. Discounting models require shifting valuations; here, valuation is frozen, but action still fails. This forces models of akrasia to address *implementation mechanics* beyond mere reward computation.
