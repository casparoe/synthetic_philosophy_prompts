prompt: |-
  I have been trying to state a dilemma that a colleague calls the crane dilemma, and I cannot decide whether it is a genuine proof that non-reductive physicalism is incoherent or an unusually polished piece of greedy reductionism. The argument is this. (1) Every real difference is a physical difference: if two worlds agree in their fundamental physical facts, no higher-level fact can differ between them. (2) Therefore any higher-level property—being a belief, being an adaptation, being a recession—supervenes on the fundamental physical facts. (3) My colleague calls this the inheritance principle: if a higher-level property supervenes on the physical facts, then whatever causal work it appears to do is inherited from the physical facts, and it is not an additional causal difference-maker. (4) If it is not an additional causal difference-maker, it does no causal work of its own. (5) If it does no causal work of its own, then citing it in a causal explanation is either a convenient shorthand for the physical facts or a mistake. (6) But some higher-level explanations are not shorthand: evolutionary explanations cite selection, heritable variation, and differential reproduction rather than particle trajectories, and no physical translation we could actually give would preserve their generality, their counterfactual robustness, and their predictive power. (7) So either those explanations are mistakes and the properties they cite are unreal, or those properties are additional causal powers after all. (8) Non-reductive physicalism was supposed to be the third option: higher-level properties are real and explanatory without being additional fundamental causes. (9) Therefore non-reductive physicalism is incoherent. My colleague concludes that the only consistent positions are eliminativism and some form of emergentism or dualism, and that anyone who talks about cranes rather than skyhooks is merely refusing to choose. I would rather keep (6) and (8) than (7), but I do not know what that costs. Which step should I reject, why did it look plausible, and what must I give up if I reject it? Please answer in continuous prose, with no headings, bullet points, bold text, or tables.
reasoning: |-
  Hmm, the user presents a sophisticated philosophical argument—the crane dilemma—that challenges non-reductive physicalism. They're clearly well-versed in philosophy of mind/science, given how precisely they reconstruct their colleague's reasoning. The core tension they express is between wanting to preserve both (6) (the indispensability of higher-level explanations) and (8) (non-reductive physicalism's core promise), while the argument forces them to abandon one. Their anxiety about "what that costs" suggests they recognize philosophical trade-offs are inevitable here.

  Breaking down the argument: Premises (1)-(4) establish supervenience and causal inheritance, leading to (5)'s claim that higher-level explanations are either shorthand or mistaken. (6) then forcefully objects by noting how explanations in biology/economics couldn't be replaced by physics without loss. The dilemma arises because (7) says this forces us to either reject such explanations (eliminativism) or treat higher-level properties as fundamental (emergentism/dualism), contradicting (8). The colleague's "cranes vs skyhooks" jab cleverly frames non-reductive physicalists as avoiding a hard choice.

  The user's request is threefold: identify which step to reject, explain its plausibility, and clarify the consequences. After considering the options, rejecting (4) seems strongest. Premise (4) assumes that if causal work is inherited, it isn't "of its own"—but this smuggles in a zero-sum view of causation where physical causes exhaust all causal power. The plausibility comes from a tempting but flawed analogy: if a property's effects fully depend on underlying physics, it feels redundant. However, this ignores how multiple realization allows higher-level properties to group physical states in ways that support distinctive explanations. 

  Rejecting (4) preserves (6) and (8) but costs the intuitive view that causation must be "fundamental or nothing." It requires embracing causation as inherently level-relative—a move some philosophers find unsatisfying. Alternatives like rejecting (1) (denying supervenience) or (6) (accepting reductionism) would be more radical sacrifices. The user's preference for keeping higher-level explanations robust suggests they'll tolerate this cost, but they must now defend why grouping physical causes isn't merely epistemic—a challenge their colleague would press.
answer: |-
  The step to reject is (4), which claims that if a higher-level property is not an "additional causal difference-maker," it does no causal work of its own. This premise appears plausible because it seems to follow from a straightforward view of causation: if all the causal "heavy lifting" is done by the physical base, and the higher-level property merely accompanies it, then the higher-level property appears redundant. It echoes the intuition that causation is a finite resource—if physics accounts for all effects, there is nothing left for other levels to contribute. However, this view conflates *causal sufficiency* with *causal exclusivity*. The physical facts may be sufficient for an effect without rendering higher-level properties causally inert, because those properties can still play a role in structuring, organizing, or selecting which physical interactions occur.  

  Rejecting (4) allows you to maintain both (6) and (8). Higher-level properties do causal work "of their own" not by adding new fundamental forces, but by serving as *causal difference-makers at their own level of description*. For instance, natural selection causes evolutionary outcomes not by overriding physics, but by being a pattern of physical interactions that consistently produces certain results across diverse physical realizations. Its causal power lies in its invariance: it tracks reliable relationships (e.g., between heritable variation and survival) that physical descriptions alone cannot capture. Thus, citing "selection" explains why certain outcomes occur *in virtue of* these higher-level regularities, even though they supervene on physics.  

  The cost of rejecting (4) is accepting that causation is not monolithic but *level-relative*. You must abandon the idea that "real" causal work occurs only at the fundamental physical level. Instead, causation is understood as context-dependent: a property can be a difference-maker within a specific explanatory framework without requiring fundamental ontological additions. This implies that the physical base *realizes* higher-level causation rather than *replaces* it. Critics (like your colleague) may argue this smuggles in dualism by stealth, as it seems to grant higher levels autonomous explanatory power. You must defend why this is not merely epistemic convenience—e.g., by arguing that the higher-level patterns are robustly real features of the world, not just summaries of physics. This retains non-reductive physicalism but requires a metaphysics where causal efficacy emerges through organization, not substance.  

  The plausibility of (4) stems from a reductive bias: the assumption that causation is "drained upward" from the micro-level. By rejecting it, you avoid eliminativism and dualism but commit to a richer view of causation—one where explanations at different levels coexist without competition, each capturing genuine aspects of reality. The crane remains grounded, but its machinery is not reduced to atoms alone.
