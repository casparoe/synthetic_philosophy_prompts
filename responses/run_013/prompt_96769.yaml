answer: |-
  ## The FAQ

  **Bureau of Demotic Integrity (BDI)**  
  *Ensuring the People are Properly Constituted Since 217*

  **1. What is the Bureau of Demotic Integrity (BDI)?**  
  The BDI is the permanent constitutional office established by the Founding Plebiscite of 216 to definitively answer the question: "Who Belongs to the People?" We maintain the Official Register of the Demos and administer all procedures related to membership determination, ensuring the integrity of the People upon which all democratic functions of the Free Territory of Demosia depend.

  **2. On what authority does the BDI operate?**  
  Our authority derives directly from the Founding Plebiscite of 216, which was approved by an overwhelming majority of the Founding Electorate. This Plebiscite explicitly mandated the creation of the BDI to resolve the initial boundary disputes and provide ongoing certainty. The legitimacy of the Founding Electorate, as the precursor to the current Demos, is inherent in the act of founding itself and is continuously reaffirmed through our work.

  **3. What is the test for belonging to the People?**  
  The core principle, enshrined in the Plebiscite and our enabling statute, is that belonging rests upon being demonstrably *affected* by the collective decisions of the People. This means individuals whose welfare, liberty, or fundamental interests are tangibly shaped by the laws, policies, and actions authorized by the Demos possess a claim to membership. We apply this test rigorously and literally based on submitted evidence and our Affectedness Assessment Protocols.

  **4. Doesn't the "affected" test include almost everyone? How do you draw the line?**  
  The principle of affectedness is indeed foundational and far-reaching. Initial assessments logically encompass residents, non-resident citizens, individuals residing temporarily within the Territory, individuals residing permanently just beyond our physical borders, suppliers of essential goods and services located internationally, future generations whose environment and inheritance are shaped by current decisions, and minors whose future autonomy is determined now. However, practical governance requires a defined Demos. The BDI therefore employs Secondary Criteria of Proportional Impact and Practical Enforceability, calibrated regularly, to establish a workable boundary while honouring the core principle. The current boundary criteria are detailed in Schedule 7B of the Demotic Integrity Act (available for download).

  **5. How can the boundary ever be changed?**  
  Any permanent alteration to the membership criteria or the boundary of the Demos itself must be approved by a binding referendum. Crucially, this referendum must be conducted *among the People as currently constituted* at the time the referendum is called. This ensures stability and protects the rights of existing members while allowing for evolution based on their collective will. Proposed changes can originate via citizen petition (Form D-5) or parliamentary motion.

  **6. What is a "Provisional Member"?**  
  Certain individuals or groups identified through the affectedness test, but whose connection falls within complex interpretative zones of the Secondary Criteria, may be granted Provisional Membership. This status acknowledges their potential claim while allowing for further evidence gathering or societal shifts. Provisional Members enjoy specific, limited rights (e.g., access to certain social services, right to be consulted on specific matters) but do not possess full voting rights within the Demos *until their status is finalized*. Many Provisional Memberships granted in the early 23rd century remain active today, reflecting the nuanced nature of affectedness.

  **7. How can a Provisional Member appeal their status?**  
  Provisional Members seeking Full Membership must submit Form D-1: Application for Status Finalization (available online or at any BDI office), accompanied by updated evidence demonstrating how their affectedness meets or exceeds the current Secondary Criteria for Full Membership. The BDI reviews all applications diligently according to established procedures. Please note that final determination often requires contextual assessment relative to the *entire* Demos, which can extend processing times.

  **8. Who decides if the BDI itself is legitimate or if it made a mistake in the past?**  
  The BDI's foundational legitimacy rests irrevocably on the Founding Plebiscite of 216, conducted by the Founding Electorate. Questions regarding the validity of the Plebiscite or the composition of the Founding Electorate are inherently questions about *who was entitled to decide the initial boundary*. This falls precisely within the BDI's constitutional mandate to determine. Therefore, the authority to question the Plebiscite's legitimacy ultimately resides *with the Demos as currently constituted by the BDI*. Concerns about specific historical determinations can be raised through the Parliamentary Oversight Committee on Demotic Matters, whose members are, of course, elected by the current Demos.

  **9. Can I challenge the exclusion of a specific group I believe is affected?**  
  Absolutely. Civic-minded individuals are encouraged to submit a Petition for Demotic Reassessment (Form D-4) detailing the specific group and providing evidence of their affectedness according to the core principle and current Secondary Criteria. The BDI will initiate a formal review process. Please be aware that successful petitions typically lead to the granting of *Provisional* status for the group, pending the outcome of a future referendum on boundary change proposed by the Parliament or citizens (see Question 5).

  **10. Who determines who is allowed to submit forms or petitions to the BDI?**  
  The ability to interact formally with the BDI – submitting forms, petitions, or evidence – is a function of one's status within the Demotic framework. Full Members possess this right inherently. Provisional Members possess limited rights to submit forms pertaining directly to their own status (e.g., Form D-1). For entities outside the current Demos seeking to initiate contact regarding potential membership, the pathway is less defined. While we cannot accept unsolicited applications from non-members *for membership*, evidence demonstrating significant affectedness can sometimes be submitted via a sponsoring Full Member using Form D-4 (Petition for Demotic Reassessment). Determining the validity of the sponsoring member's status in such cases is naturally a prerequisite handled internally.

  ---

  ## Form D-1

  ```
  FREE TERRITORY OF DEMOSIA
  BUREAU OF DEMOTIC INTEGRITY (BDI)

  FORM D-1: APPLICATION FOR STATUS FINALIZATION
  (For Provisional Members Seeking Full Membership)

  PLEASE PRINT CLEARLY IN BLACK INK

  SECTION 1: APPLICANT INFORMATION
  Provisional Membership ID Number: ▢▢▢▢-▢▢▢▢-▢▢
  Full Legal Name: __________________________________________________________
  Date Provisional Status Granted: ____/____/____

  SECTION 2: GROUNDS FOR FINALIZATION
  Describe in detail how your connection to the Free Territory of Demosia and your affectedness by the decisions of the People NOW MEET OR EXCEED the current Secondary Criteria for Full Membership (Refer to Schedule 7B of the Demotic Integrity Act). Attach additional sheets if necessary.
  __________________________________________________________________________________________
  __________________________________________________________________________________________
  __________________________________________________________________________________________

  SECTION 3: EVIDENCE OF ENHANCED AFFECTEDNESS
  List and attach all new, material evidence supporting your claim of meeting/exceeding current Full Membership criteria (e.g., documentation of deepened economic ties, prolonged residency, increased dependency on services, demonstrable impact of specific decisions). DO NOT submit originals.

  SECTION 4: DECLARATION
  I, __________________________________________ (Applicant Name), declare that the information provided on this form and in supporting documents is true and complete to the best of my knowledge. I understand that providing false information may result in revocation of Provisional Status and potential legal penalties.

  Signature: _________________________________________ Date: ____/____/____

  FOR BDI USE ONLY
  Date Received: ____/____/____      BDI Ref: ▢▢▢▢▢▢▢▢
  Assigned Officer: _______________   Status: [ ] Review Pending [ ] Evidence Requested [ ] Recommended for [ ] Full Membership [ ] Provisional Continuation [ ] Revocation [ ] Referred to Boundary Review Panel
  ```

  *Processing times vary. Provisional Status remains in effect pending final determination. Updates available via your BDI Online Portal account.*

  ---

  ## What each joke is aimed at

  1.  **The Founding Plebiscite & Founders' Authority (Q2, Q8):** Targets the core circularity: The BDI's authority comes from a vote by a group ("Founding Electorate") whose own membership is the *very thing* the BDI is supposed to define. The office simply asserts this pre-BDI group's legitimacy as "inherent," hiding the problem behind bureaucratic acceptance.
  2.  **The Literal "Affected" Test & Arbitrary Lines (Q3, Q4):** Satirizes the genuine philosophical problem that a truly democratic principle ("all affected should have a say") is impossibly broad. The joke is the office earnestly listing everyone it *logically* includes (foreign suppliers, future generations), then immediately admitting they have to draw arbitrary, shifting lines anyway ("Secondary Criteria"), undermining the purity of the principle they claim to follow literally.
  3.  **Referendum Requirement for Boundary Change (Q5):** Exaggerates the real-world collective action problem: Changing the group (adding new voters) requires approval *by the existing group*, who often see new members as diluting their own power/influence. The system is structurally biased against inclusion.
  4.  **Permanent Provisional Status & Catch-22 Appeals (Q6, Q7):** Represents real-world limbo (stateless persons, long-term residents without citizenship). The joke is the appeal process (Form D-1) being judged *by the system that created the limbo*, using criteria *it* controls, often leading to indefinite delay – a procedural black hole.
  5.  **Who Can Question the BDI/Legitimacy (Q8):** Satirizes the problem of infinite regress and bootstrapping. Any challenge to the initial authority leads back to the question of "who decided the deciders?" The BDI "solves" this by declaring itself, as the *current* definer of the people, the only entity allowed to judge the validity of the *original* definers – a perfect logical loop.
  6.  **Who Can Submit Forms/Petitions (Q10):** Highlights the meta-problem of voice and exclusion. To even *ask* to be included, you need permission from the group you're trying to join. The office's convoluted suggestion (find a sponsor *within* the group) underscores the barrier to entry faced by the excluded, making genuine democratic challenge from the outside nearly impossible.
