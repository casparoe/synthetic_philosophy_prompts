answer: |-
  ### In-Class Activity Design: Experiencing Induction Underdetermination

  **Objective:** Students experience how finite examples underdetermine category rules and how prior expectations about "relevant features" shape induction, without upfront lecture.

  **Medium:** Use a whiteboard or projector for visual display. Draw simple geometric figures with clear labels (member/non-member). For Round 2, use compound shapes (large outer shape with a small inner shape).  
  **Avoid digital tools** to keep focus on perception and minimize distractions.

  ---

  ### **Round 1: Single-Feature Rule (Reveals Underdetermination)**
  **Hidden Rule:** "Member if the shape is a triangle."  
  **Alternative Rule:** "Member if the shape has 3 sides OR is red." (Fits the same training data but reverses the held-out prediction.)  

  **Training Set (6 cases):**  
  - **Members (draw left side):**  
    1. Red triangle  
    2. Blue triangle  
    3. Green triangle  
  - **Non-members (draw right side):**  
    4. Blue circle  
    5. Green pentagon  
    6. Yellow square  

  **Held-Out Case:** Red circle (not shown until predictions are made).  

  **Wording for Students (5 min):**  
  *"Here are 6 figures. Some are members of a hidden category; others are not. Look closely. On your worksheet, write two things:  
  1. Your best guess for the hidden rule that defines membership.  
  2. Your prediction: Is a **red circle** a member? (Yes/No)  
  You have 3 minutes. Don’t discuss—this is about your individual intuition."*  

  **Reveal (5 min):**  
  - Step 1: *"I’ll reveal the true hidden rule: **A figure is a member if it is a triangle**. By this rule, the red circle is **not a member**."* (Write this on the board.)  
  - Step 2: *"But here’s a twist. Another rule fits all 6 examples perfectly: **A figure is a member if it has 3 sides OR is red**. By this rule, the red circle **is a member**."* (Write the alternative rule.)  
  - Emphasize: *"Both rules explain every training example. Yet they clash on the red circle."*  

  ---

  ### **Round 2: Relational Rule (Reveals Prior-Driven Attention Shift)**  
  **Hidden Rule:** "Member if the inner and outer shapes are identical."  

  **Training Set (6 cases; all shapes same color, e.g., black outline):**  
  - **Members:**  
    1. Large circle → small circle inside  
    2. Large square → small square inside  
    3. Large triangle → small triangle inside  
  - **Non-members:**  
    4. Large circle → small square inside  
    5. Large square → small triangle inside  
    6. Large triangle → small circle inside  

  **Held-Out Case:** Large pentagon → small pentagon inside.  

  **Wording for Students (10 min):**  
  *"New round, new hidden rule. Again, write on your worksheet:  
  1. What rule defines membership?  
  2. Your prediction: Is a **large pentagon with a small pentagon inside** a member? (Yes/No)  
  You have 5 minutes. Look for patterns—but remember, no rule is ‘obvious’."*  

  **Reveal (5 min):**  
  - *"The true rule: **A figure is a member if the inner shape matches the outer shape**. The pentagon-pentagon figure **is a member**."*  
  - Contrast: *"If you missed this, you might have focused on single features (e.g., ‘outer shape is triangle’), which worked in Round 1 but fails here."*  

  ---

  ### **Timeline (75 Minutes Total)**  
  | Time  | Activity |  
  |-------|----------|  
  | 0-5   | **Intro:** Display Round 1 training set. Say: *"We’re exploring how categories work. Your job: find hidden rules."* |  
  | 5-10  | **Round 1 Commit:** Students write rules/predictions for red circle. |  
  | 10-15 | **Round 1 Reveal:** Announce triangle rule → red circle non-member. Then reveal alternative rule → red circle member. |  
  | 15-20 | **Transition:** Erase board. Draw Round 2 training set. |  
  | 20-30 | **Round 2 Commit:** Students write rules/predictions for pentagon-pentagon. |  
  | 30-35 | **Round 2 Reveal:** Announce relational rule → pentagon-pentagon member. |  
  | 35-75 | **Debrief (40 min):** Guided discussion (details below). |  

  ---

  ### **Debrief (40 Min): Mapping to Concepts**  
  **Guided Questions & Talking Points:**  
  1. **Reaction (5 min):** *"How did you feel when Round 1’s alternative rule was revealed? Did Round 2 feel harder? Why?"*  
     - *Goal:* Surface emotions (surprise, frustration) to highlight cognitive dissonance.  

  2. **Underdetermination of Induction (15 min):**  
     - *"Both rules in Round 1 fit the training data perfectly—yet they disagreed. What does this say about learning from examples?"*  
     - **Key Point:** Finite examples underdetermine rules. No amount of data *logically forces* one conclusion (link to Bongard puzzles: easy for us, but not logically fixed).  
     - *"Why don’t we notice this in daily life? Why did the alternative rule feel ‘cheap’?"*  

  3. **Role of Prior "Relevant Features" (15 min):**  
     - *"In Round 1, most of you guessed rules about shape (e.g., ‘triangles’). Why not color or disjunctions (OR)?"*  
     - **Key Point:** We bring priors—e.g., "shape > color" or "avoid arbitrary disjunctions." Priors *constrain* induction, making learning possible but also blinding us (e.g., Round 2 required noticing relations, not just features).  
     - *"In Round 2, if you succeeded, what shifted? If not, what distracted you?"*  
     - Link to evolution/culture: Priors aren’t arbitrary—they reflect statistical regularities (e.g., object shapes > colors for category membership).  

  4. **Broader Implications (5 min):**  
     - *"Concepts aren’t ‘in’ the data—they’re inferences shaped by priors. This is why AI struggles with Bongard-like tasks without human-like priors."*  
     - Term introduction: *"What you experienced is called the **underdetermination of theory by evidence**."*  

  ---

  ### **Predictable Challenges & Fixes**  
  1. **Round 1 Alternative Rule Feels Contrived:**  
     - **Issue:** Students may dismiss the disjunctive rule ("3 sides OR red") as unrealistic.  
     - **Fix:** Acknowledge this! *"Yes, this rule seems artificial—but that’s the point. We reject it because our prior says ‘shape matters, color doesn’t.’ But the data alone doesn’t rule it out."*  

  2. **Round 2 Stumps Everyone:**  
     - **Issue:** Students fixate on single features (e.g., "outer shape is circle") and miss the relation.  
     - **Fix:** Use probing: *"Look at non-member #4 (circle with square inside). If ‘circle’ was the rule, why isn’t it a member?"* Nudge toward comparing members/non-members.  

  3. **Time Crunch in Round 2:**  
     - **Issue:** Relational rules take longer to spot.  
     - **Fix:** Extend commit time to 5 min (included). If needed, give a hint: *"Ask: how do inner and outer shapes interact?"*  

  ---

  ### **What the Activity Can’t Reproduce (Instructor Must Add)**  
  - **Depth of Priors:** The activity simplifies priors as "preferences for features." You must clarify that real-world priors are:  
    - **Multi-layered:** Built from evolution (e.g., shape > color for objects), development (infants attend to shape), and culture.  
    - **Contextual:** Relevance depends on domain (e.g., color matters for berries, shape for tools).  
    - **Non-Propositional:** Priors are often implicit biases, not conscious "rules."  
    *Bridge this in debrief:* *"Our priors feel ‘obvious,’ but they’re trained by a lifetime of statistical learning—not logic."*  

  ---

  **Why This Works:** Students *feel* underdetermination (via prediction reversal) and prior-driven attention shifts (via Round 2’s relational rule). The debrief ties visceral experiences to theory, avoiding premature jargon. By generating rules live, you make abstract concepts tangible.
