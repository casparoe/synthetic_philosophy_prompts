    - The "free reward without hacking" case (6) splits positions most sharply—it’s the litmus test for whether wireheading = Goodhart.  
  - **Which Cases Can’t Distinguish Positions?**  
    The game-bot (1) and sensor-tampering (3) cases **can’t separate** *General Reward Tampering* (4) from *Deployment-Time Risk* (8). They’re treated identically.  

