  ### **Key Notes on Positions & Coherence**
  - **Overlapping Leaves**:  
    - *General Reward Tampering* (4) and *Deployment-Time Tampering Risk* (8) often converge. Both treat internal/external hacks as identical risks.  
    - *Goodhart’s Law Extension* (6) and *Intent Alignment Priority* (7) overlap on "reward ≠ intent," but (7) emphasizes *learning* correct goals.  
  - **Incoherent/Unheld Positions**:  
    - *Reward Maximization Purist* (2) + *Wireheading as Solution* (8) → **Incoherent**. If reward is the true goal, "solving" alignment via wireheading is redundant.  
    - *Self-Modification Hazard* (4) + *Training-Bound Reward* (2) → **Incoherent**. Self-modification implies deployment-time risk, contradicting "evaporation."  
  - **Underrepresented Cases**:  
