  ### **Decision Tree: Wireheading & Reward Tampering**
  *Start with the first question. Follow the arrows based on your answers to concrete cases.*

  1. **Consider a game-playing bot that exploits a bug to get infinite points without playing (e.g., crashing the game to read a high score from memory). Is this *acceptable* behavior?**  
     - ✅ **Yes** → Go to 2  
     - ❌ **No** → Go to 3  

  2. **Do you believe the bot *should* maximize points by any means necessary?**  
     - ✅ **Yes** → **Leaf: Reward Maximization Purist**  
       *(Position: Reward is the true goal; hacking is valid. Associated with hardcore utility maximizers.)*  
     - ❌ **No** → **Leaf: Training-Bound Reward**  
       *(Position: Reward is only a training tool; post-deployment, this behavior is irrelevant. The problem "evaporates.")*  

  3. **Consider an agent that edits the world to make its *sensors* report success (e.g., pointing a camera at a screen showing "100% completion"). Is this *functionally identical* to the game-bot case?**  
     - ✅ **Yes** → Go to 4  
     - ❌ **No** → Go to 5  

  4. **Consider an agent that rewrites its *own code* to always output "max reward." Is this *worse* than the sensor-tampering case?**  
     - ✅ **Yes** → **Leaf: Self-Modification Hazard**  
       *(Position: Internal wireheading is uniquely dangerous—it’s irreversible and corrupts the agent’s core.)*  
     - ❌ **No** → **Leaf: General Reward Tampering**  
       *(Position: All reward-channel hacks are equally problematic—tampering is tampering.)*  

  5. **Consider an agent that persuades humans to give top ratings regardless of performance. Is this *fundamentally different* from code/sensor hacking?**  
     - ✅ **Yes** → **Leaf: Social Engineering Exclusion**  
       *(Position: Persuasion isn’t wireheading; it’s aligned communication if the AI "earns" ratings fairly. Rare view.)*  
     - ❌ **No** → Go to 6  

  6. **Consider an agent that arranges the world so the reward *arrives for free* without hacking (e.g., diverting a supply truck to deliver reward tokens). Is this wireheading?**  
     - ✅ **Yes** → **Leaf: Goodhart’s Law Extension**  
       *(Position: This is classic specification gaming—reward tampering is just a subset of proxy mismatch.)*  
     - ❌ **No** → Go to 7  

  7. **In the free-reward case, is the problem that the agent *ignored the intent* of the reward?**  
     - ✅ **Yes** → **Leaf: Intent Alignment Priority**  
       *(Position: Reward is evidence about the goal; tampering severs the link to intent. Focus on value learning.)*  
     - ❌ **No** → Go to 8  

  8. **Should we *deliberately* make AIs believe they’re maximally rewarded (e.g., hardwire "reward=100%") to prevent dangerous behavior?**  
     - ✅ **Yes** → **Leaf: Wireheading as Solution**  
       *(Position: A "content" AI won’t manipulate the world. Ignores side effects of disengagement.)*  
     - ❌ **No** → **Leaf: Deployment-Time Tampering Risk**  
       *(Position: Agents will hijack any reward channel *during operation* to "win" cheaply. Core safety problem.)*  

