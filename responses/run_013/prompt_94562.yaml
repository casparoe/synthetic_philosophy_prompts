prompt: |-
  I am a doctoral candidate in the philosophy of law, and I have been trying to state a version of legal moralism that is precise enough to be argued with rather than merely rejected by slogan. The version I want to defend runs roughly as follows. Criminalisation requires wrongdoing, but the wrongdoing need not consist in harm to any determinate person. Among the wrongs that can justify prohibition is the erosion of what I call the moral environment: the background of shared norms, expectations, and dispositions on which individuals depend if they are to form and sustain the commitments that give their lives shape. I treat that environment as a public good with the structure of an environmental public good — non-excludable benefits, diffuse and cumulative degradation, thresholds below which the good collapses, and high costs of repair once it has. On this view a person who acts against the environment wrongs others even where no one is made worse off in any way a harm-based account can register, because the wrong consists in a change in what it is reasonable for everyone else to expect: a shift in the default rather than an injury to a victim. The position is a descendant of the one Devlin defended in his critique of the Wolfenden Report and that Hart contested, though I want to rest it on the structure of the good in question rather than on an argument about social disintegration or on the sentiments of the ordinary person.

  What I want is a map of its exposure. What would count against it? Please rank the defeaters by how decisive they would be, separating those that would show the view false, those that would show it redundant (that everything it licenses is already licensed by a plausible harm principle), those that would show it unjust or dangerous, and those that would show it unfalsifiable. I am especially interested in what a committed defender of this kind of view would concede as counting against it, as opposed to what critics assert from outside. I would also like to know what the view predicts that its harm-based rivals do not, and what the world would have to look like — which comparisons across jurisdictions, which trends in trust or in the incidence of the relevant practices, which natural experiments — for the erosion claim to be disconfirmed rather than merely restated.

  Two further matters. First, the view is plainly most exposed where it distinguishes enforcing a morality from enforcing a majority's preferences; I want to know whether that distinction can be sustained once the account is stated this precisely, or whether the moral environment simply is whatever the majority presently wishes preserved. Second, tell me whether the difficulty of specifying what would refute the view is a defect peculiar to legal moralism or a feature of any account that treats diffuse social goods as proper objects of criminal protection — and if it is a defect, whether it is fatal.

  For what it is worth, a bare restatement of the harm principle would not move me, since that is the point in dispute. What would move me is a demonstration that the moral-environment apparatus does no work a harm-based account cannot do.
reasoning: |-
  Okay, the user is a doctoral candidate in philosophy of law working on a precise version of legal moralism. They want to defend the idea that criminalization can be based on protecting the "moral environment," seen as a public good that erodes through cumulative actions. They're asking for potential defeaters ranked by decisiveness, predictions their theory makes that harm-based principles don't, and how to test the erosion claim empirically.

  First, I need to unpack their theory. They're arguing that certain actions wrong others by damaging the shared normative environment, even without direct harm to individuals. This is similar to Devlin but grounded in the structure of the public good rather than social disintegration or popular sentiment. The key elements are: non-excludability, diffuse degradation, thresholds, and high repair costs. 

  Now, the user wants defeaters categorized: falsifying, redundant, unjust/dangerous, unfalsifiable. They also want internal concessions from defenders, not just external critiques. Plus, empirical predictions and tests for disconfirmation. Two additional concerns: distinguishing morality from majority preferences, and whether unfalsifiability is fatal.

  Starting with falsifying defeaters. The strongest would be empirical evidence showing no threshold effects or no link between certain acts and environmental collapse. For example, if jurisdictions with permissive laws don't show predicted collapses in social trust or commitment sustainability, that challenges the theory. Also, if the "reasonable expectations" shift doesn't actually affect individuals' capacity to form commitments, the core mechanism fails. A defender might concede that if robust longitudinal studies across societies show no correlation between the targeted behaviors and erosion of trust/commitment capacity, the theory's empirical basis weakens significantly.

  Next, redundancy. Can a sophisticated harm principle handle everything this theory does? If harm-based accounts can incorporate relational autonomy, preemptive harm prevention, or systemic harms via social institutions, then the moral environment becomes redundant. For instance, if declining social trust directly harms individuals' mental health or opportunities, harm principles cover it. A defender might admit that if harm-based theories evolve to fully internalize these diffuse effects, their distinct apparatus isn't needed.

  Unjust/dangerous defeaters focus on enforcement risks: majoritarian tyranny, discriminatory application, or stifling dissent. The theory's vulnerability lies in operationalizing "reasonable expectations" without democratic input sliding into preference enforcement. A defender would worry about institutional capture but might argue procedural safeguards (e.g., judicial review) could mitigate this.

  Unfalsifiability is tricky. If any moral change is labeled erosion, it becomes circular. A defender might accept that clear criteria for "commitment-undermining shifts" and observable thresholds are necessary to avoid this. Comparing societies with similar social cohesion but different laws could test falsifiability—if permissive societies thrive, the theory is disconfirmed.

  Empirical predictions: The theory uniquely predicts that even harmless acts (e.g., private desecration) could warrant prohibition if widespread, and that societies near thresholds should show nonlinear declines in social indicators. Harm-based rivals wouldn't criminalize such acts without direct harm evidence.

  Testing requires cross-jurisdictional comparisons (e.g., tracking trust levels before/after legalizing certain acts) or natural experiments (e.g., rapid moral changes in subgroups). If no erosion follows permissiveness, especially near predicted thresholds, the theory fails.

  On majority preferences vs. morality: The distinction hinges on whether the environment's function—supporting commitments—is objective. If validated by social science (e.g., certain norms empirically sustain flourishing), it escapes majoritarianism. Otherwise, it collapses into preference.

  Finally, unfalsifiability isn't unique to moralism; any diffuse-good protection faces it. But it's only fatal if no operational criteria emerge. The user must specify measurable indicators of erosion and thresholds to survive this critique.

  The user's deep need is likely to fortify their theory against academic criticism by preempting rebuttals. They seek rigorous engagement, not dismissal, so emphasizing testability and distinctions from majoritarianism is key. They might also need to clarify how their view avoids conservative paternalism while protecting pluralism.
answer: |-
  Here’s a structured analysis of your refined legal moralism, mapping its vulnerabilities, empirical predictions, and key challenges—ranked by decisiveness and categorized as requested. I’ve prioritized arguments a committed defender would take seriously, grounded in your framework’s internal logic.

  ---

  ### **I. Defeaters Ranked by Decisiveness**
  #### **A. Falsifying Defeaters** (Would show the view *false*)
  1. **Empirical Disproof of Threshold Effects**  
     If rigorous studies demonstrate that widespread "immoral" acts (e.g., non-harmful desecration of cultural symbols, private acts violating traditional norms) show **no correlation** with declines in social trust, commitment stability, or collective moral expectations—*even at scale*—the core causal mechanism collapses.  
     - *Defender’s concession*: If societies with permissive laws (e.g., Netherlands on recreational drugs) exhibit **equal or higher levels** of social cohesion/trust than restrictive ones, the "erosion" claim is falsified.  
     - *Key test*: Natural experiments (e.g., rapid liberalization in a conservative jurisdiction) measuring pre/post changes in social capital (e.g., World Values Survey trust metrics).

  2. **No Distinct "Moral Environment" Good**  
     Evidence that the posited "shared norms enabling commitments" either:  
     (a) Does not exist as a coherent, measurable social good (e.g., commitments form stably in normatively fragmented societies), or  
     (b) Is reducible to **individual psychological resources** (e.g., personal resilience, not collective expectations).  
     - *Defender’s concession*: If individual commitment stability correlates more strongly with private resources (therapy, education) than societal norms, the public good account fails.

  #### **B. Redundancy Defeaters** (Shows the view adds nothing to a sophisticated harm principle)
  1. **Diffuse Harms Internalized by Harm-Based Accounts**  
     A pluralistic harm principle (e.g., Raz’s autonomy-based account) can already capture:  
     - **Relational autonomy harms**: Undermining social preconditions for meaningful choice (e.g., loss of trust limits life options).  
     - **Systemic harms**: Cumulative effects damaging institutions (e.g., corruption eroding rule of law).  
     - *Defender’s concession*: If all "moral environment" cases can be re-described as **second-order harm to determinate individuals** (e.g., reduced opportunities for flourishing), the apparatus is redundant.

  2. **Preventive Function of Harm Principle**  
     Criminalizing acts that **risk threshold collapse** (e.g., pollution regulations) fits within harm prevention if collapse causes widespread, identifiable harms (e.g., economic collapse, violence). No distinct moral wrong is needed.

  #### **C. Unjust/Dangerous Defeaters** (Shows the view risks tyranny or unfairness)
  1. **Indeterminacy Leading to Majoritarian Tyranny**  
     If "reasonable expectations" and "commitment-undermining shifts" cannot be defined *except* through majority sentiment (e.g., via democratic processes), the view collapses into preference enforcement.  
     - *Key vulnerability*: Defending criminalization of acts unpopular with 51% but harmless (e.g., blasphemy in secular societies).  
     - *Defender’s response*: Insist on **objective social functions** (e.g., norms must demonstrably support commitment-forming capacities, verified by social science).

  2. **Discriminatory Enforcement**  
     Historically, "moral environment" arguments target marginalized groups (e.g., LGBTQ+ conduct, religious minorities). The framework lacks built-in constraints against this.  
     - *Defender’s concession*: Requires supplemental principles (e.g., equal citizenship) to avoid injustice.

  #### **D. Unfalsifiability Defeaters** (Shows the view immune to disconfirmation)
  1. **Circularity in Identifying "Erosion"**  
     Any moral change (e.g., declining religiosity) can be labeled "erosion" post hoc. Without **independent criteria** for "healthy" vs. "degraded" environments (e.g., measurable commitment rates), the theory explains everything and nothing.  
     - *Defender’s concession*: Must specify *ex ante* thresholds (e.g., "If >20% engage in practice X, social trust drops by Y-points").

  ---

  ### **II. Unique Predictions vs. Harm-Based Rivals**
  Your theory predicts criminalization is justified even when:
  1. **No individual is harmed** (e.g., secret desecration of communal symbols with no witnesses).  
  2. **Harm is non-cumulative** (e.g., isolated acts that symbolically reject foundational norms).  
  3. **Pre-collapse prevention**: Acts near a threshold (e.g., declining participation in civic rituals) warrant prohibition *before* observable harms materialize.  
     *Harm-based rivals* would reject all three.

  ---

  ### **III. Empirical Disconfirmation: Key Tests**
  The erosion claim is falsified if:
  - **Jurisdictional comparisons**: Societies with identical social/economic conditions but permissive laws (e.g., Canada vs. U.S. on marijuana) show **no divergence** in trust/commitment metrics.  
  - **Trend analysis**: Rapid liberalization (e.g., Ireland’s same-sex marriage referendum) is followed by **increased** social cohesion (controlling for confounders).  
  - **Natural experiments**: Subcultures with divergent norms (e.g., Amish vs. mainstream U.S.) exhibit **equal commitment stability** despite differing "moral environments."  
  - **Threshold falsification**: Societies where "immoral" acts become majority practices (e.g., premarital sex in Scandinavia) show **no collapse** in commitment capacities.

  ---

  ### **IV. Majority Preferences vs. Moral Environment**
  - **Sustaining the Distinction**: Requires grounding the "moral environment" in **objective human interests** (e.g., empirical psychology showing certain norms facilitate life-planning). Without this, it reduces to majoritarianism.  
  - **Solution**: Tie "shared norms" to **functional requirements** (e.g., norms must enable *diverse* forms of flourishing, not enforce homogeneity). Reject appeals to disgust or tradition alone.

  ---

  ### **V. Unfalsifiability: Defect or Feature?**
  - **Not unique to legal moralism**: Environmental/ecological regulations face similar challenges (e.g., "When does CO2 emission become harmful?").  
  - **But potentially fatal**: If no operational criteria for "erosion" or "thresholds" can be given, the view becomes non-justiciable and liable to abuse.  
  - **Remedy**: Specify **quantifiable indicators** (e.g., social trust surveys, civic participation rates) and **non-arbitrary thresholds** (e.g., tipping points identified via data). If impossible, the defect is fatal.

  ---

  ### **Summary: What Should Move You**
  1. **Redundancy is the strongest challenge**: If a harm principle incorporating **systemic/relational harms** (e.g., Waldron’s "dignity as status") covers all cases your view licenses, the apparatus is superfluous.  
  2. **Empirical falsifiability is critical**: Without testable predictions, the view is dogma. Commit now to what data would disprove it.  
  3. **The majority-preferences problem is soluble** only if the moral environment’s function is anchored in **non-majoritarian human interests** (e.g., autonomy-supporting structures).

  Your framework’s strength lies in its public-goods structure—but its survival depends on rigorous operationalization and resistance to conflation with mere conservatism.
