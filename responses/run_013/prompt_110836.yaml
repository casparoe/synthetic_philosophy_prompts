answer: |-
  ### Brainstorming: Candidate Positions & Predictions (300 words)  
  The Pluto demotion challenges metaphysical theories of classification by exposing tensions between intrinsic properties, relational dynamics, institutional authority, and scientific purpose. Key positions yield distinct predictions:  

  1.  **Transcendent Realism (Platonic):** Planethood is an eternal Form. The IAU’s vote is irrelevant to discovering this abstract truth. *Prediction: Disputes arise from human epistemic failure, not genuine metaphysical indeterminacy.*  
  2.  **Immanent Realism (Aristotelian):** Planethood is a universal instantiated in objects possessing the essential properties. *Prediction: The IAU should identify the essential properties (e.g., roundness + orbital dominance); dissent reflects error about these properties.*  
  3.  **Trope Theory:** Each body’s roundness and orbital dominance are unique particulars. "Planet" names a resemblance class of similar tropes. *Prediction: The dispute concerns which tropes (e.g., dynamical vs. morphological) best ground the resemblance class.*  
  4.  **Resemblance Nominalism (Price):** "Planet" denotes objects sharing sufficient pairwise resemblances. *Prediction: The IAU renegotiated which resemblances (roundness vs. orbital dominance) are salient for practical purposes.*  
  5.  **Predicate Nominalism/Conventionalism:** "Planet" is a useful linguistic label. *Prediction: The vote simply changed linguistic convention; dissenters mistake semantics for metaphysics.*  
  6.  **Homeostatic Property Clusters (Boyd):** Planethood is a cluster of co-occurring, causally linked properties (size, roundness, orbital dynamics). *Prediction: The IAU prioritized one cluster component (dynamics) over others; dissenters defend a different cluster weighting.*  
  7.  **Promiscuous Realism:** Multiple legitimate classification schemes exist, carving nature at different joints. *Prediction: Both intrinsic (roundness) and dynamical definitions are valid for different purposes; the conflict arises from insisting on a single scheme.*  

  ---

  ### Analysis  

  **I. Universals Theories and the IAU Vote**  
  *(What each says the IAU was doing and the dissenters’ complaint)*  

  1.  **Transcendent Realism:** The IAU’s vote was a flawed attempt to approximate the Form of Planet. The Form exists independently, likely demanding essential intrinsic properties (e.g., roundness). The dynamical criterion’s arbitrariness (location-dependence, Mercury’s exception) proves the vote missed the Form. *Dissenters’ Complaint:* Correctly asserts the IAU lacks authority because planethood is discovered, not decreed. The vote’s contingent outcome (e.g., small quorum) underscores its irrelevance to the Form.  

  2.  **Immanent Realism:** The IAU sought to define the essence shared by all planets. By selecting roundness *and* orbital clearance, it aimed to capture the universal’s instantiation conditions. However, Mercury’s inclusion despite not being in perfect equilibrium and the location-dependence of "cleared neighbourhood" reveal a flawed essence definition. *Dissenters’ Complaint:* Valid if the essence is misidentified; planethood *is* a fact about the world, but the IAU defined the wrong universal (e.g., over-prioritizing dynamics).  

  3.  **Trope Theory:** The IAU elevated one set of particular tropes (orbital dominance tropes) over others (roundness tropes) to define the resemblance class "planet." Pluto shares roundness tropes with Earth but lacks the orbital dominance tropes, hence its exclusion. *Dissenters’ Complaint:* Reflects disagreement over which tropes (intrinsic morphology vs. extrinsic dynamics) should anchor the resemblance class. Authority is irrelevant; it’s about which tropes we choose to group by.  

  4.  **Resemblance Nominalism (Price):** The IAU redefined the network of resemblances required for "planet." Previously, resemblance in roundness and solar orbit sufficed. By demanding resemblance in orbital dominance, it excluded Pluto (which resembles Ceres/Eris dynamically, not Jupiter). *Dissenters’ Complaint:* Challenges the *practicality* of the new resemblance standard, not its metaphysical legitimacy. Authority matters only insofar as it establishes linguistic convention.  

  5.  **Predicate Nominalism/Conventionalism:** The IAU merely stipulated a new semantic rule for the word "planet" within its institutional context. The vote changed language, not reality. The "dwarf planet" subcategory is a linguistic fix to handle borderline cases. *Dissenters’ Complaint:* Mistakenly assumes "planet" refers to a natural kind. The IAU had full authority to define its own taxonomic terms; dissenters’ alternative definition is just another convention.  

  6.  **Homeostatic Property Clusters (Boyd):** The IAU treated orbital dominance as the core homeostatic property (regulating orbital environment), demoting roundness and mass to secondary status. This disrupted the established cluster (where roundness signaled significant formation history). The intrinsic definition used by exoplanet scientists reflects a different cluster weighting. *Dissenters’ Complaint:* Argues the IAU disrupted a stable, causally grounded cluster without sufficient justification. Authority is contested because cluster definitions should track robust causal patterns, not voting blocs.  

  7.  **Promiscuous Realism:** The IAU endorsed one valid way to classify bodies (dynamical systems perspective), while planetary scientists using the intrinsic definition employ another equally valid scheme (geophysical perspective). Neither carves at *the* exclusive joint. *Dissenters’ Complaint:* Misguided in demanding *the* authority; the dispute shows multiple legitimate perspectives exist. The IAU vote wrongly attempted to impose a single scheme universally.  

  **II. Less Obvious Readings**  

  1.  **Planets as Historical Individuals (à la Species):** If "planet" denotes a specific, spatiotemporally localized lineage (e.g., dominant bodies formed in the Solar System’s protoplanetary disk), then Pluto’s status depends on its unique formation history alongside the eight, not abstract properties. The demotion becomes a re-evaluation of Pluto’s historical role, akin to reclassifying a species based on phylogeny. *Implications for Realism:* Supports a moderate realism – Pluto either is or isn’t part of this historical individual, regardless of definitions. The IAU vote *could* be an attempt (flawed or not) to capture this historical fact. However, the location-dependence (same body not a planet farther out) and the Ceres precedent (same body, different classification era) strongly challenge this view. History seems less defining than current relational properties.  

  2.  **Quantifier Variance (Hirsch):** Proposes the disagreement is verbal. "Planet-IAU" means "sun-orbiting, round, orbit-clearing body"; "planet-intrinsic" means "sun-orbiting, round body." They don’t contradict; they use different concepts. *Assessment:* Superficially plausible: astronomers *are* using different definitions. However, the intense debate and sense of betrayal suggest a substantive disagreement about what *deserves* the label "planet" – a question about the world’s structure and which classification is scientifically fundamental. The dissenters aren’t merely saying "We prefer a different word"; they claim the IAU misidentified a natural category. This feels like genuine ontological disagreement, not mere semantic variance.  

  **III. Testing the Theories: Fit and Adjudication**  

  *   **Poor Fits:**  
      *   **Strong Transcendent/Immanent Realism:** Struggle badly with the location-dependence and Mercury’s exception. A planet ceasing to be one by moving orbit (without intrinsic change) violates essentialism. The Ceres precedent is also problematic – did the universal change in 1850?  
      *   **Predicate Nominalism:** Downplays the genuine scientific stakes and the feeling that *something real* is being contested beyond words. The persistence of the debate among experts suggests more than semantics.  
      *   **Species-as-Individual:** Falters on location-dependence and Ceres. Planets lack the clear reproductive/phylogenetic lineage defining biological species.  

  *   **Good Fits:**  
      *   **Trope Theory / Resemblance Nominalism:** Handle the flexibility and context-dependence well.  
      *   **HPC (Boyd):** Accommodates the shift in weighting properties and the existence of rival definitions (different clusters).  
      *   **Promiscuous Realism:** Best explains why different definitions (intrinsic, dynamical) persist usefully in different scientific contexts.  

  *   **Realism vs. Nominalism Adjudication?** The episode *illustrates* rather than *decides*.  
      *   **Realist Evidence:** The enduring scientific need for classification, the focus on objective properties (mass, shape, dynamics), the sense that Pluto *really is* different from Mercury/Jupiter but similar to Ceres/Eris, and the rejection of purely cultural definitions.  
      *   **Nominalist Evidence:** The historical contingency (Ceres), the context-dependence (location, exoplanets), the role of pragmatic voting, and the existence of multiple viable schemes.  
      The facts accommodate both readings: A realist can argue scientists are converging on better understanding a real kind, while a nominalist sees shifting conventions reflecting evolving scientific needs. The episode doesn’t force a choice; it showcases the tension inherent in scientific classification.  

  **IV. What Pluto Reveals: Beyond Colors and Species**  

  The Pluto case uniquely illuminates the problem of universals by stressing facets often downplayed:  

  1.  **Relational, Non-Intrinsic Criteria:** Unlike color (intrinsic surface property) or chemical elements (intrinsic atomic structure), the key IAU criterion ("cleared the neighbourhood") is fundamentally relational and contextual. This challenges theories (like strong immanent realism) relying on intrinsic essences and highlights how classifications can depend on a system's structure.  
  2.  **Purpose-Relativity & Institutional Context:** The IAU explicitly adopted its definition for Solar System cataloging, acknowledging a different ("purely intrinsic") scheme for exoplanets. This overt purpose-dependence is stark compared to debates over color or species, revealing classification as a tool shaped by epistemic goals and institutional frameworks.  
  3.  **Membership Without Intrinsic Change:** A body can gain or lose planethood status purely by changing location or having new neighbors discovered – without altering its intrinsic nature. This dynamism is alien to debates about chemical elements or most biological species concepts.  
  4.  **Authority as a Social-Metaphysical Nexus:** The core dissent – "a category of nature is not something a committee can vote into existence" – explicitly links the *metaphysical* status of the kind to the *social* authority of the classifier. This intrusion of social fact (who decides, by what process) into the metaphysical question is far more pronounced than in typical universal examples.  

  Does this argue **for Pluralism?** Yes, emphatically. The persistence of rival definitions (IAU dynamical vs. planetary scientists' intrinsic), each serving valid but distinct scientific purposes (orbital mechanics vs. geophysical study), demonstrates promiscuous realism in action. It’s not a "failure of nerve" but an acknowledgment of nature’s complexity and science’s diverse goals. Insisting on a single "planet" definition appears artificial and counterproductive.  

  **V. Where Universals Theory is Silent**  

  The problem of universals provides limited tools to analyze:  
  *   **Institutional Authority:** Why does the IAU’s vote carry weight (or not)? Why do planetary scientists feel entitled to ignore it? This hinges on sociology of science – conventions of disciplinary authority, textbook publishing, and professional consensus-building – not metaphysics.  
  *   **Public Sentiment:** The emotional attachment to Pluto as a "planet" reflects cultural narratives, pedagogy, and psychology. While nominalism can absorb this as part of the "convention," it offers no deep explanation for *why* it matters.  
  *   **The Dynamics of Scientific Change:** The Ceres-to-Pluto pattern suggests taxonomic categories evolve as knowledge grows (more objects discovered) and scientific priorities shift. Universals theory describes static ontological relations poorly suited to explaining this historical process of category negotiation and stabilization.  

  **VI. Verdict: The Weight of Evidence**  

  Based *solely* on this episode, **Promiscuous Realism** provides the most compelling account. The evidence decisively shows multiple, non-coinciding classification schemes ("planet" as dynamical dominant vs. "planet" as geophysically complex body) are scientifically fruitful. Neither scheme subsumes the other; each highlights different causal structures and serves different explanatory purposes within astronomy. The IAU vote attempted to impose a single, monolithic scheme (prioritizing dynamics for Solar System taxonomy) and failed precisely because it denied this legitimate pluralism. Planetary scientists continue using the intrinsic definition because it answers different questions.  

  **What Would Make a Rival Win?**  
  *   **Strong Realism (Transcendent/Immanent):** Would require demonstrating a single, essential set of properties (intrinsic or relational) that *all and only* the agreed-upon planets possess, rendering the IAU definition either a perfect discovery of this essence (if it succeeded) or a clear error (if it failed). The location-dependence, Mercury’s exception, and the utility of the intrinsic definition fatally undermine this.  
  *   **Strict Nominalism (Predicate/Conventionalism):** Would require showing the debate *only* concerns linguistic convenience or social agreement, devoid of any connection to objective causal structures in nature. The scientists' focus on physical properties (gravity, formation, dynamics) and the sense of loss or error felt by dissenters contradict this. Pluto’s geophysical similarity to Mercury *matters* beyond mere semantics.  
  *   **HPC (Boyd):** Remains plausible, but struggles to explain why the different "clusters" (dynamical vs. intrinsic) aren’t simply integrated. The *persistence* of distinct, non-integrated schemes points more strongly to promiscuity than a single, albeit complex, cluster.  

  The Pluto affair ultimately argues that the cosmos is complex enough, and scientific aims diverse enough, that we need multiple ways to carve it up. "Planet" isn't one kind, but a label pointing towards different, equally real, ways the universe organizes matter on certain scales. The IAU's attempt to settle the matter by vote didn't just fail socially; it failed metaphysically, by misunderstanding the plural reality it sought to categorize.
