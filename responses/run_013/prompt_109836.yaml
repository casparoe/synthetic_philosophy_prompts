prompt: |-
  I've somehow ended up as the resident philosopher at my old institute's retired-staff lunch club — thirty-five years in molecular biology, picked up Wittgenstein about four years ago, so I'm maybe two chapters ahead of the room. Next month I've got forty-five minutes and a whiteboard to do family resemblance and language games for a dozen retired chemists and biologists who've spent their whole lives hunting necessary and sufficient conditions (no readings, I've tried, they dont do them). Don't explain it to me — plan how I should teach it: what has to be in place before the idea can land at all for that crowd, what single example should carry the whole session and what it needs to have and lack, and where in the sequence each misconception gets headed off. My instinct is to build it on gene concepts — I lived through the classical-gene-to-molecular-gene mess and I think that's the best case going — but tell me if something else should carry it instead, and if gene does stay, what it can't show that I'll be tempted to make it show. Misconceptions I'm expecting: they'll hear "no definition" as "no facts of the matter"; they'll reach for clustering and similarity space before anything else and think that's what Wittgenstein meant; at least one will ask whether he thinks words just mean whatever we say they mean. Tell me where each gets handled, and whether I've missed one. Also give me a single closing question that tells me whether it landed, and what I should openly refuse to go into at this level.

  Put it in JSON so I can paste it into my notes, with these fields:

  {
    "order": [{"step": 1, "idea": "...", "why_it_has_to_come_here": "...", "misconception_handled_here": "..."}],
    "carrying_example": {"example": "...", "what_it_must_have": "...", "what_it_must_lack": "...", "what_it_cannot_show": "..."},
    "misconceptions": [{"misconception": "...", "when_it_shows_up": "...", "how_to_head_it_off": "..."}],
    "check_for_understanding": {"question": "...", "what_a_good_answer_shows": "...", "what_a_bad_answer_shows": "..."},
    "left_out_on_purpose": ["..."]
  }

  Keep the field names exactly as above, and keep each string to a sentence or two — I want to glance at it while I'm talking, not read an essay.
reasoning: |-
  We are given a very specific task: to create a JSON structure for a 45-minute session on Wittgenstein's family resemblance and language games for retired scientists (chemists and biologists) who are used to necessary and sufficient conditions. The user has a background in molecular biology and has suggested using the concept of "gene" as the carrying example. We need to structure the session step by step, handle misconceptions, choose an example, and decide what to leave out.

  Key points from the user:
  - Audience: retired chemists and biologists, used to necessary and sufficient conditions in their work.
  - They don't do readings, so we must build the ideas from scratch in the session.
  - Potential misconceptions:
    1. Hearing "no definition" as "no facts of the matter".
    2. Reaching for clustering and similarity space as if that's what Wittgenstein meant.
    3. Asking if words mean whatever we say they mean.

  The user's instinct is to use the concept of "gene" as the carrying example because of the transition from classical gene to molecular gene. We'll go with that unless there's a strong reason not to.

  Structure of the JSON:
  - "order": an array of objects, each with "step", "idea", "why_it_has_to_come_here", "misconception_handled_here".
  - "carrying_example": an object with "example", "what_it_must_have", "what_it_must_lack", "what_it_cannot_show".
  - "misconceptions": an array of objects, each with "misconception", "when_it_shows_up", "how_to_head_it_off".
  - "check_for_understanding": an object with "question", "what_a_good_answer_shows", "what_a_bad_answer_shows".
  - "left_out_on_purpose": an array of strings (topics to avoid).

  Plan for the session (45 minutes, whiteboard):

  We need to build the idea of family resemblance step by step, using the gene example. Then introduce language games to show how meaning is context-dependent. We must head off misconceptions at the right steps.

  Proposed Steps:

  1. Start by challenging the idea of necessary and sufficient conditions with a simple example (like games) to show that we use words without strict definitions. This sets the stage and gets them to question their assumptions.

  2. Then, introduce the gene example in detail. Show how the concept has evolved and how different uses of "gene" don't share a single common thread but have overlapping similarities (family resemblance).

  3. Introduce the term "family resemblance" and connect it to the gene example.

  4. Then, introduce language games to show that the meaning of a word is tied to its use in a context (like different biological contexts for "gene"). This helps to avoid the misconception that without a definition, there are no facts.

  5. Finally, summarize and check for understanding.

  Now, for the carrying example: "gene". 
  What it must have: 
    - A history of changing definitions (classical vs molecular).
    - Overlapping features (e.g., unit of heredity, coding for a protein, etc.) but no single feature present in all.
  What it must lack: 
    - A set of necessary and sufficient conditions that cover all and only genes.
  What it cannot show: 
    - We must be careful not to imply that the concept is arbitrary or that there are no facts about genes. The example should show that there are facts (e.g., in a specific context, we can say what a gene is) but the general concept is not fixed by a definition.

  Misconceptions to handle:

  1. "No definition" means "no facts of the matter": Head off by emphasizing that in specific contexts, there are clear criteria (e.g., in a molecular biology context, a gene might be defined as a sequence coding for a protein), but that doesn't hold across all contexts.

  2. Reaching for clustering/similarity space: Head off by explaining that family resemblance is not about measuring similarity in a feature space but about overlapping features without a common core. Use the example: games have different features (board, ball, rules, etc.) and genes have different features (unit of inheritance, coding sequence, regulatory element, etc.), but we don't need a set of shared features to use the word.

  3. Words mean whatever we say: Head off by explaining that meaning is governed by public language games and social practices, not individual whim.

  We'll also need to handle any other common ones? One more: that family resemblance is just a prototype theory. But we can leave that out if it's too advanced.

  Check for understanding: A question that requires them to apply family resemblance to a new concept (maybe from their field) and not fall into the misconceptions.

  Left out: 
    - Private language argument.
    - Detailed exegesis of Wittgenstein's texts.
    - Comparison to other philosophical theories (e.g., prototype theory).

  Now, let's build the step-by-step:

  Step 1: Start with a non-science example (like "games") to show the failure of necessary and sufficient conditions. Why? Because it's simple and familiar, and it breaks the ice without getting into their field too early. Misconception handled: They might think that if we can't define it, then it's not a real concept. Head off by showing that we all use the word "game" successfully without a strict definition.

  Step 2: Then, bring in the gene example. Show the historical shifts and the different features. Why here? Now they see it in their own field. Misconception: They might try to define gene by clustering (e.g., "it's a cluster in feature space"). Head off by noting that while we can list features, there's no fixed set that defines it.

  Step 3: Introduce the term "family resemblance" and connect to both examples. Why now? After they have seen the pattern, we give it a name. Misconception: They might think it's just about similarity. Head off by emphasizing overlapping and criss-crossing features without a common core.

  Step 4: Introduce language games. Show that in different biological contexts (e.g., Mendelian genetics vs. molecular biology), the word "gene" is used with different rules. Why? To show that meaning is context-dependent and to avoid the idea that without a fixed definition, there are no facts. Misconception: Words mean whatever we say. Head off by explaining that the rules are public and established by practice.

  Step 5: Summarize and then ask the check question.

  Check question: "If I asked you to define 'enzyme' in a way that covers all enzymes from the 19th century to now and in all contexts, what would you say?" 
  Good answer: They would say it's difficult because the concept has changed and has different uses (e.g., as a catalyst, as a protein, etc.), and they might describe it by family resemblance. 
  Bad answer: They try to give necessary and sufficient conditions, or say there's no real definition so it's arbitrary.

  Left out: 
    - Private language argument.
    - The role of philosophy in science.
    - Any deep dive into Wittgenstein's later philosophy beyond these two concepts.

  Now, let's write the JSON accordingly.
