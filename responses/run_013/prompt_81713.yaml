  The user also questions whether museums should stop using "collapse." If they switch to "transformation," does that downplay real destruction? But "collapse" might overemphasize it. The term carries weight in assigning responsibility, like environmental damage or conflict. So the word choice affects narrative and moral implications.

  I should consider the user's deeper needs. They might be looking for a framework that acknowledges institutional endings without ignoring continuity. They want to challenge traditional narratives but retain the ability to describe significant breakdowns. Their frustration with museums showing both collapse and continuity suggests a need for a more nuanced terminology.

  The user's own criterion could be sharpened by focusing on specific capacities, like resource management or conflict resolution, rather than vague agency. But measuring that archaeologically is tough. They might need to accept that collapse is multi-dimensional and context-specific. Also, distinguishing between different societal levels—elite vs. commoner—could help. Maybe collapse is elite-centric, but that's a valid perspective if the paper's focus is on state institutions.

  In conclusion, the user should probably keep "collapse" but qualify it, specifying what collapsed (institutions) and what persisted (culture, people). Their agency criterion has merit if tied to institutional mechanisms. Museums can use both terms, showing the complexity. The key is transparency about what aspects ended and what continued, avoiding monolithic narratives.
answer: |-
  You've hit on a profound tension at the heart of archaeological narratives about "collapse." Let's dissect the implicit theory, refine your criterion, and explore the implications for practice.

  **Reconstructing the Implicit Theory:**

  The practice of labeling episodes as "collapse" typically rests on several interlinked (and often unexamined) presuppositions:

  1.  **The Society-as-System Model:** Yes, it presupposes society is a bounded, integrated system with a discernible "normal" state (complexity, centralization, monumentality). This baseline is often fixed retrospectively and selectively:
      *   **Teleologically:** By defining the "peak" (palaces, divine kings, moai) as the norm, any subsequent reduction in those specific traits is framed as decline/collapse.
      *   **Elite-Centric:** The baseline is defined by the most visible, archaeologically prominent features – usually elite institutions and their material manifestations. The "system" is implicitly equated with the *political* or *ritual* superstructure.
      *   **Functionalist:** Central institutions are seen as essential for the system's coherence and survival. Their failure signifies system failure.
      *   **Discontinuity Bias:** The narrative emphasizes dramatic breaks detectable in the archaeological record (abandoned palaces, cessation of inscriptions) over slower, less visible continuities or transformations in daily life, subsistence, or local ritual.

  2.  **Elite Standpoint as Societal Standpoint:** Crucially, the theory assumes that the fate of the *central institutions* defines the fate of the *society*. The scribe's catastrophe *is* the society's collapse. The perspective of the village farmer, whose life might change less dramatically (or even improve with the removal of tribute demands), is marginalized or absent. The loss of high culture (writing, calendrics, monumental art) is privileged over the persistence of vernacular culture.

  3.  **Observer-Relativity & Evaluation:** You are absolutely right. "Collapse" *is* observer-relative and evaluative:
      *   **Relative to Focus:** Is the focus on the state, the elite culture, the population, or the ecological carrying capacity? Different foci yield different conclusions.
      *   **Relative to Values:** What do we *value*? Monumental achievement? Political centralization? Demographic stability? Cultural continuity? The term inherently signals a *loss* of something deemed valuable by the observer (often unconsciously adopting the elite's values).
      *   **"Factual" vs. Interpretive:** While the *events* (palace burned, inscriptions stopped, moai carving ceased) are factual, labeling the *whole episode* as societal "collapse" is an interpretive leap based on the above presuppositions. It's not useless, but it *is* laden with specific perspectives and valuations.

  **Evaluating and Sharpening Your Criterion:**

  Your criterion – **collapse occurs when a society loses the capacity to choose what comes next** – is insightful and addresses core weaknesses in traditional models. Let's break it down:

  *   **Strengths:**
      *   **Focuses on Agency/Resilience:** It shifts focus from specific traits (complexity, monuments) to the underlying *capacity for collective action and adaptation*.
      *   **Accommodates Radical Change:** Allows for intentional, large-scale reorganization (e.g., revolutions, voluntary decentralization) without labeling it collapse.
      *   **Explains Severity:** A "smaller shock" that destroys key decision-making or adaptive mechanisms *would* be catastrophic, fitting cases like Rapa Nui's ecological tipping point or the LBA's interconnected system failure.
      *   **Avoids Teleology:** Doesn't assume a single "normal" state the society should return to.
      *   **Aligns with Case Studies:** Explains why the end of palaces/kings/moai-building *mattered* – it represented a catastrophic failure of the mechanisms driving those societies forward in their established trajectories.

  *   **Weaknesses & How to Repair Them:**
      1.  **"Collective Agency" Problem:** Ancient societies likely didn't have modern notions of "collective will." Repair by shifting the focus to **institutional mechanisms for decision-making, conflict resolution, resource mobilization, and adaptation.** Collapse occurs when these key mechanisms for coordinated action at a societal scale break down irreparably. It's not about a mystical "will," but about the *practical capacity* to organize collective responses to challenges or opportunities. (e.g., The palace *was* the mechanism; its destruction removed that capacity).
      2.  **Matter of Degree:** This is a *strength*, not a weakness. Collapse *is* rarely instantaneous or total. Societies lose capacities gradually or in specific domains. Your criterion allows us to ask: *Which* capacities were lost? *How* significantly did the range of possible futures narrow? This nuance is crucial.
      3.  **Survival Without Options:** Your example (population survives intact but with no options) *is* a profound collapse under this criterion. The key insight is that **collapse is about the loss of *futures*, not just the loss of the past.** If a society is reduced to mere survival with no capacity to shape its destiny beyond basic subsistence, that signifies a catastrophic loss of resilience and potential. The "way of life" *has* been lost – the way of life that included planning, building, innovating, and choosing paths forward.

  *   **Sharpened Criterion:** "A society experiences collapse when it undergoes a catastrophic failure of the core institutional mechanisms necessary for large-scale collective action, adaptation, and intentional transformation. This failure results in a significant, often irreversible, narrowing of the society's capacity to consciously shape its future trajectory in response to internal or external challenges, irrespective of population continuity or the persistence of some cultural elements."

  **What Follows for the Practice (Museums, Textbooks, Narratives):**

  1.  **Don't Necessarily Drop "Collapse," But Radically Qualify It:** The term has power and denotes real, often catastrophic, change. Abandoning it entirely risks glossing over genuine ruptures and suffering.
      *   **Be Specific:** *What* collapsed? (e.g., "The Palatial System Collapsed," "The Institution of Divine Kingship Collapsed," "The Moai-Building Tradition Collapsed," "Centralized Political Control Collapsed").
      *   **Acknowledge Continuity:** Explicitly state what *didn't* collapse or what emerged (e.g., "While the palatial centers were abandoned, local populations persisted, adapting their lifeways," "Descendant communities maintained cultural traditions and connections to the land," "New, less centralized forms of social organization emerged").
      *   **Acknowledge Perspective:** Admit the term often reflects the perspective of the elite institutions that failed. Contrast this potentially with the experience of non-elites where possible (though archaeologically challenging).
      *   **Use Your Criterion:** Frame the collapse in terms of lost *capacities* and narrowed futures.

  2.  **"Transformation" or "Reorganization" is Often More Accurate... But...** These terms are valuable and should be used frequently, *especially* when emphasizing continuity. However:
      *   **They Can Gloss Over Severity:** Sometimes things aren't just "rearranged"; they are violently and catastrophically *destroyed*. "Collapse" captures the sense of rupture, loss, and often trauma better.
      *   **They Can Obscure Responsibility:** "Collapse" more readily invites questions of causation – environmental mismanagement, warfare, inequality, systemic fragility – potentially assigning responsibility. "Transformation" can sound neutral or even positive.

  3.  **Compatibility with Rival Accounts:**
      *   **Systems Theory (Tainter):** Compatible with the "system failure" aspect, but your criterion challenges its often implicit teleology and elite-centrism by focusing on agency/capacities.
      *   **Resilience Theory:** Highly compatible. Your criterion focuses on the loss of adaptive capacity, a core concern of resilience thinking. Collapse is the crossing of a threshold where resilience is catastrophically low.
      *   **Political Economy/Marxist:** Compatible. Emphasizes how collapse often stems from internal contradictions (e.g., elite extraction undermining resilience) and how its impact is class-based (catastrophe for elites, potential relief/opportunity for others). Your "observer-relative" point aligns here.
      *   **Post-Processual/Interpretive:** Compatible. Emphasizes the constructed nature of the narrative, multiple perspectives, and the role of the archaeologist's values. Your critique *is* fundamentally post-processual.
      *   **Network Theory (for LBA):** Compatible. The LBA "collapse" can be framed as a catastrophic failure in a highly interconnected network system, directly linking to the loss of capacity for long-distance coordination.

  **Conclusion:**

  The practice of calling episodes "collapse" is committed to an elite-centric, systems-based view that privileges dramatic discontinuity and often adopts the values of the lost institutions. Your criterion, focused on the catastrophic loss of *societal capacity to shape the future*, is a powerful corrective. It accommodates continuity while explaining the genuine rupture and narrowing of possibilities that define these episodes.

  **Recommendation for your paper:** Argue for a nuanced, qualified use of "collapse." Define it explicitly using your sharpened capacity-based criterion. Insist on specifying *what* collapsed (the political superstructure, elite culture, specific institutions) alongside *what* persisted (population, local lifeways, cultural identity). Acknowledge the observer-relativity inherent in the term. This approach allows you to retain the term's power to describe significant ruptures while avoiding the pitfalls of simplistic narratives that ignore the survival and resilience of people and cultures through profound institutional change. The "load-bearing" part of the story is the *loss of specific, crucial capacities*; the "convention" is the often-unquestioned equation of that loss with the disappearance of the entire society. Your framework provides the tools to separate these.
