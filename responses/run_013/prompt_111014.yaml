prompt: |-
  I'm a science and ideas journalist. Reporting on pandemic-era hospital staffing, I asked an ethicist whether off-duty clinicians had an obligation to take surge shifts; she waved the question off with a single line — that kind of work is "beyond the call of duty." Since then I've watched the same phrase do similar work elsewhere: to argue that wealthy states owe nothing beyond the aid they have already pledged, that a passerby who ignores someone drowning is uncharitable but not unjust, and — most troubling to me — from an administrator who implied that volunteers who had already gone beyond duty had no standing to complain about the conditions they worked under.

  Before a follow-up interview I want the phrase precisified rather than explained. I know the technical name is supererogation; I don't want an essay on that literature. Give me a menu of the distinct claims the sentence could be making, ordered from the near-trivial (some morally good acts are not required) through the ones that carry real weight (there are reasons to act that never harden into obligations; omission is not blameworthy; no one may demand the act or resent its absence; roles and standing move where the line falls) to the reading that does cynical work, in which "beyond duty" marks the outer limit of what anyone can be asked at all. For each reading, say whether it is a platitude, a substantive claim worth defending, or false, and say which one the speakers above most likely meant. Which reading, if any, actually licenses the conclusion that the shift, the aid, or the better conditions cannot be owed? And tell me what would change your verdict: which argument about the structure of practical reasons, or which feature of these cases, would move a reading from defensible to untenable — and where your reasoning is most likely to fail.
reasoning: |-
  Okay, let me unpack this fascinating request from a science journalist who's clearly done their homework on supererogation. They're frustrated by how "beyond the call of duty" gets weaponized in policy debates and wants surgical precision before their next interview. 

  First, I need to resist diving into ethical theory - they explicitly don't want that. Instead, they're asking for a taxonomy of interpretations ranked by moral weight, with clear markers for when each claim becomes problematic. Smart framing: they recognize the phrase is doing different work in different contexts.

  Hmm... the examples given reveal three distinct usages: 
  The ethicist uses it descriptively (surge shifts aren't obligatory), 
  the administrator weaponizes it (volunteers forfeit complaint rights), 
  while the drowning case invokes the bystander effect. 

  This isn't just about semantics - lives hang on where we draw these lines. The journalist's sharpest question hides in plain sight: which interpretation actually blocks obligations from arising?

  I should start by mapping the conceptual territory from least to most contentious. The trivial claim that "not all good acts are required" is uncontroversial baseline. But when we hit claims about resentment being inappropriate or demands being illegitimate, that's where power dynamics kick in - like that administrator silencing volunteers.

  Critical insight: only the strongest version ("no obligation can exist here") truly blocks owed action, and it's also the most defensible. But its fragility becomes obvious when we consider systemic injustice - what if the "drowning person" is in a river the passerby poisoned? Suddenly, the "no duty" claim collapses.

  My reasoning might stumble at the role-dependency point. When does a nurse's expertise create obligations that a random passerby wouldn't have? That's where the pandemic example bites hardest - professional roles might shift the "duty line" in ways my neutral framework misses.

  The journalist will need concrete tests to challenge interviewees. For instance: "If you accept that refusing surge shifts isn't blameworthy, does that also mean colleagues can't resent the refusal?" That exposes whether they're making a claim about obligations or about accountability.

  Most dangerous is how the phrase gets twisted to imply waiver of rights. That administrator's usage should be the interview target - it's where "beyond duty" becomes ideological cover for exploitation. Might suggest the journalist asks: "Does going beyond duty mean going beyond dignity?"
answer: |-
  Here’s a precisification menu of the distinct claims embedded in "beyond the call of duty," ordered by moral weight and practical implications, with assessments and applications to your cases:

  ---

  ### **The Menu of Claims**  
  *(Ordered from weakest to strongest implications)*

  1. **Some morally good acts are not required**  
     - *Nature:* Descriptive claim about moral categories.  
     - *Status:* **Platitude** (widely accepted; e.g., giving 50% of income to charity is good but not obligatory).  
     - *Used by:* Ethicist (surge shifts).  
     - *Obligation-blocking?* **No.** Only denies existing duty; doesn’t preclude new obligations arising.  

  2. **Omission of supererogatory acts is not blameworthy**  
     - *Nature:* Focus on exemption from criticism.  
     - *Status:* **Defensible** (core to supererogation theory).  
     - *Used by:* Drowning-passerby argument (uncharitable ≠ unjust).  
     - *Obligation-blocking?* **No.** Permits praise/blame asymmetry but doesn’t negate owed actions.  

  3. **Reasons to act never harden into obligations**  
     - *Nature:* Denies that moral reasons (e.g., urgency, capacity) can create duties.  
     - *Status:* **Substantive claim** (contested; e.g., Kantians vs. particularists).  
     - *Used by:* Wealthy-states argument ("aid is discretionary").  
     - *Obligation-blocking?* **Potentially.** If true, no duty can emerge from context.  
       - *Verdict shifters:*  
         - If **relational duties** exist (e.g., historical injustice), this fails.  
         - If **capacity + dire need** create obligations (e.g., Singer’s pond analogy), this collapses.  

  4. **No one may demand/resent the omission**  
     - *Nature:* Forbids third-party claims or moral anger.  
     - *Status:* **Substantive claim** (extends beyond non-blameworthiness).  
     - *Used by:* Administrator (volunteers "can’t complain").  
     - *Obligation-blocking?* **Indirectly.** Positions the act as purely "gift," negating reciprocity.  
       - *Verdict shifter:* If volunteers were **exploited** (e.g., unsafe conditions due to institutional neglect), resentment becomes justified.  

  5. **"Beyond duty" marks the outer limit of what can be asked**  
     - *Nature:* Transforms supererogation into a moral ceiling.  
     - *Status:* **False/cynical** (confuses non-obligatory with non-exigent).  
     - *Used by:* Administrator (implied: "don’t ask for better conditions").  
     - *Obligation-blocking?* **Yes.** Treats supererogation as a barrier to claims.  
       - *Verdict shifter:* If **systemic injustice** exists (e.g., understaffing due to poor planning), demands for fairness override "voluntary" framing.  

  ---

  ### **Which Reading Blocks Owed Action?**  
  Only **#5** licenses the conclusion that shifts/aid/conditions "cannot be owed." It weaponizes supererogation to **absolve duty-bearers** (hospitals/states) by redefining reasonable expectations as "excessive."  

  - **#3** *could* block obligations but requires defending the strong claim that context *never* creates duties—rarely plausible in crises.  
  - **#4** blocks *complaints* but not obligations per se.  

  ---

  ### **Key Fault Lines in Reasoning**  
  1. **Role-dependent duties:**  
     - *Failure point:* Treating clinicians like passersby. Clinicians’ *roles* may convert "good deeds" into **role-obligations** during emergencies.  
     - *Verdict changer:* If professional oaths/social contracts imply crisis duties, #3 and #5 fail.  

  2. **Reciprocity vs. sacrifice:**  
     - *Failure point:* Assuming volunteers waive rights. Supererogation doesn’t negate **reciprocal duties** (e.g., safe conditions).  
     - *Verdict changer:* If volunteers enabled institutional function, #4 and #5 become unjust.  

  3. **Structural vs. individual morality:**  
     - *Failure point:* Applying individual ethics (passerby) to collective agents (states/institutions).  
     - *Verdict changer:* If wealthy states **benefit from unjust systems**, their "aid" is partial restitution, not charity (#3 fails).  

  ---

  ### **What the Speakers Likely Meant**  
  - **Ethicist:** #1 or #2 (non-blameworthy omission).  
  - **Wealthy-states arguer:** #3 (reasons don’t harden into duties).  
  - **Drowning-passerby defender:** #2 (omission not unjust).  
  - **Administrator:** **#4 or #5** (volunteers forfeit standing / no further demands allowed).  

  ---

  ### **Your Weapon: Ask This**  
  Press the administrator: *"Does ‘beyond duty’ mean volunteers had no right to safe conditions, or that their work was optional? If the hospital relied on them, why can’t they demand reciprocity?"*  
  This exposes whether they invoke #4/5 (indefensible) vs. #1/2 (irrelevant to complaints).  

  Use these distinctions to force precision—**supererogation isn’t a moral forcefield against owed action**.
