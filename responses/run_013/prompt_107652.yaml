  Write me a joke about Nyāya epistemology — one that someone who's actually studied the pramāṇas would laugh at, not just a generic "those ancient Indians sure were wacky" bit. So we're on the same page: the Nyāya school counts four pramāṇas — pratyakṣa (perception), anumāna (inference), upamāna (comparison/analogy), and śabda (testimony) — while Buddhist logicians like Dignāga and Dharmakīrti allow only the first two, and Mīmāṃsākas throw in arthāpatti (postulation) and anupalabdhi (non-apprehension) on top. The punchline should turn on that actual disagreement over how many pramāṇas there are and which ones really count, so someone hearing it can tell I know the difference between the schools. An everyday setting would be nice if you can swing it.
