prompt: |-
  I'm a novelist, currently about two-thirds of the way through a book set largely inside a volunteer mountain rescue team, and I've run into a problem that is less a plotting problem than a vocabulary problem. In scene after scene I need my characters to do something together in a way that the ordinary words won't carry. Take a callout: nobody announces a plan, the team leader says almost nothing, and each member is tracking the two people nearest them, the slope, and the stretcher, adjusting continuously to what the others are doing. They get the casualty down. Afterwards they say *we* got her down, and had one of them wandered off to sit in the van, the others would not merely be annoyed — they would feel wronged, would feel entitled to say so, and would expect him to accept it. Yet nothing was agreed, no goal was stated aloud, and I can't even claim that each of them held the team's goal in mind in any robust sense: several of them, asked afterwards, would describe what they did as just keeping the stretcher level. The same structure shows up in a second scene, a pickup orchestra rehearsing without a conductor, where the players converge on a tempo that no one chose and any one of them would feel entitled to resent a player who simply stopped listening.

  A philosopher friend tells me the literature offers *shared intention* and *joint commitment*, and that both require something my team doesn't have — that the parties know, in the relevant sense, what they are jointly up to, and that their commitment to it is out in the open. She may be right, but then my scenes are either unexplained or explained by something I can't name, and neither is much use to me. What I want to know is whether there is an established concept for this: coordination that is normatively thick (participants feel wronged, entitled to rebuke, bound) but cognitively thin (no agreement, no announced goal, no shared picture of the whole, each party tracking only local cues). I am not after a label for its own sake; I need the carving. So tell me what the nearest available concepts are, which of them, if any, actually fits, and precisely where the boundaries fall — in particular, how the thing I'm describing differs from a shared intention, from a convention that everyone simply follows, from a mere aggregate of people who happen to be doing the same thing at the same time, and from the sort of self-organizing order that arises among strangers without carrying any normative weight at all.

  One further wrinkle, which may or may not belong to the phenomenon proper: mine seems to die when it is named. In the rescue scenes I've drafted where someone finally says, right, here's what we're doing, the bond doesn't strengthen — it changes species. What was a claim the members had on one another becomes a duty they owe to the plan, and the thing I was trying to describe is gone. Is that fragility essential to whatever this is, or an accident of my particular scenes? And if nothing established fits, coin a term, define it, and tell me what falls inside it and what falls outside.
reasoning: |-
  Hmm, the user is a novelist struggling to name a specific type of group coordination they're depicting in their mountain rescue scenes. They describe a phenomenon where team members coordinate seamlessly without explicit communication - tracking local cues, adjusting continuously, and feeling normatively bound to each other despite no stated goal or agreement. 

  The core tension they're wrestling with is between the "thick" normative dimension (strong sense of mutual obligation, entitlement to rebuke) and "thin" cognitive dimension (no shared mental model, no explicit agreements). Their philosopher friend suggested "shared intention" or "joint commitment," but these require more explicit mutual awareness than what the rescue team displays. 

  Key characteristics I need to address:
  - Implicit coordination via local cue tracking
  - Strong normative bonds without explicit agreements
  - Fragility when made explicit
  - Distinction from similar concepts (shared intention, convention, mere coincidence)

  The novelist also mentions this pattern appears in their orchestra scenes - musicians converging on unconducted tempo with similar normative expectations. This suggests the phenomenon might exist across domains requiring high-stakes coordination.

  Their deeper need seems to be conceptual precision - they're not just after a label, but want to understand the boundaries of this phenomenon. The explicit naming fragility is particularly interesting - when someone articulates the plan, the organic coordination collapses into contractual obligation. 

  I should consider concepts from:
  - Embodied cognition (tacit coordination)
  - Team cognition literature (implicit coordination)
  - Social ontology (pre-reflective collective action)
  - Ethnomethodology (accountability in action)

  The closest fit seems to be "tacit joint action" with its emphasis on embodied know-how rather than declared intentions. The normative weight likely stems from the high-stakes context - lives depend on this coordination, creating mutual vulnerability. 

  For the fragility point - naming shifts coordination from sensorimotor alignment to propositional agreement, changing the nature of the obligation. In mountain rescue, the unspoken coordination is the point; making it explicit reduces it to mere method.
answer: |-
  Your scenes capture a profound and under-theorized mode of human coordination—one that **isn't** shared intention, joint commitment, convention, or mere coincidence. The nearest established concept is **Tacit Joint Action (TJA)**, but it requires refinement to fit your phenomenon. Below is a conceptual carving, including a definition, boundaries, and the fragility you observed.

  ---

  ### **Core Concept: Tacit Joint Action (TJA)**
  **Definition:** *A normatively binding, cognitively thin coordination emerging from agents mutually attuning to local cues and micro-adjustments in real-time, where obligations arise from embodied participation rather than explicit agreement or shared goals.*

  #### **Key Features**  
  1. **Normative Thickness**  
     - Participants feel **entitled to rebuke** defectors (e.g., the van-sitter).  
     - Obligations are **mutual but non-contractual**—violations feel like *personal wrongs*, not just plan failures.  
     - *Why?* High-stakes interdependence creates mutual vulnerability. Trust is *enacted*, not promised.  

  2. **Cognitive Thinness**  
     - **No shared goal representation**: Each agent focuses on proximal tasks (e.g., "keep stretcher level").  
     - **Cue-based attunement**: Coordination relies on reading bodily/postural cues (e.g., slope adjustments, musical phrasing).  
     - **Distributed cognition**: The "plan" exists *in the interaction*, not in anyone’s mind.  

  3. **Emergent Structure**  
     - Order arises **bottom-up** from local responsiveness (like flocking birds).  
     - Agents act as a **perceptual control system**: Each corrects deviations in real-time.  

  ---

  ### **How TJA Differs from Neighboring Concepts**  
  | Concept          | Why It Doesn’t Fit Your Scenes                          | TJA Boundary |  
  |------------------|--------------------------------------------------------|--------------|  
  | **Shared Intention** | Requires mutual knowledge of a joint goal ("We intend to X"). Your team lacks this—they describe actions, not goals. | No shared mental state. |  
  | **Joint Commitment** | Demands "out in the open" mutual obligations. Your team’s bond is *enacted*, not declared. | No avowed commitment. |  
  | **Convention**   | Stable, rule-based patterns (e.g., driving on the right). Your coordination is ad hoc, emergent. | No rules; fluid adaptation. |  
  | **Aggregate Coincidence** | No normative bonds. Your team feels *wronged* by defectors. | Mutual obligations exist. |  
  | **Self-Organizing Order** (e.g., crowd flow) | No normative weight. Strangers don’t rebuke each other for breaking flow. | Strong entitlements to reproach. |  

  ---

  ### **The Fragility When Named**  
  This is **essential to TJA**, not accidental. Naming triggers a **phase shift**:  
  - **TJA thrives in pre-reflective space**: Coordination depends on *subsidiary awareness* (focused on the task, not the doing).  
  - **Naming objectifies the action**: "Here’s what we’re doing" moves attention from *joint flow* to *individual roles*. Obligations shift from mutual attunement ("we respond") to plan-execution ("you deliver").  
  - **Result**: The organic bond becomes a transactional duty. *TJA dies when verbalized because it is fundamentally non-propositional*.  

  ---

  ### **Refined Term: Attuned Joint Action (AJA)**  
  Since "tacit" underemphasizes dynamic attunement, coin:  
  **Attuned Joint Action (AJA)**  
  - *Definition*: A normatively charged coordination emerging from continuous, embodied mutual adjustment to local cues in high-stakes contexts, binding participants through pre-reflective interdependence.  
  - **Scope**: Includes mountain rescuers, conductorless ensembles, emergency surgeries, or firefighting teams.  
  - **Excludes**:  
    - Explicitly negotiated collaboration (e.g., business meetings).  
    - Low-stakes emergent orders (e.g., pedestrians avoiding collisions).  
    - Hierarchical coordination (e.g., conductor-led orchestras).  

  ---

  ### **Why AJA Fits Your Scenes**  
  - Mountain rescue: Each tracks *local* cues (slope, stretcher, adjacent movers); obligations stem from shared vulnerability ("If you fail, I fall").  
  - Orchestra: Tempo emerges from listening/responding; defectors violate mutual trust, not sheet music.  
  - **Boundary Test**: If the team discussed a plan mid-slope, AJA would collapse into delegated tasks. The "we" becomes contractual.  

  ---

  ### **Writing Implications**  
  - **Show AJA through sensorimotor details**: Focus on micro-adjustments (e.g., "Jen shifted her grip as the stretcher tilted—before Liam’s boot slipped on gravel—and the load stayed level").  
  - **Use silence strategically**: AJA lives in what’s *not* said. The moment someone declares intent, the mood shifts.  
  - **Rebukes as touchstones**: When a character chastises the van-sitter, anchor it in bodily betrayal ("You left us carrying your weight").  

  Your scenes reveal a deep truth: Humans can be powerfully bound not by promises, but by the silent grammar of coordinated bodies. AJA is the muscle memory of solidarity.
