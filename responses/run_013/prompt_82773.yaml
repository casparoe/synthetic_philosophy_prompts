prompt: |-
  I serve on the medical policy committee of a mid-sized regional health plan. Roughly once a month the committee must decide whether a contested condition counts as a disease for the purposes of our medical-necessity criteria, which determines whether we cover interventions for it, at what tier, and on what grounds we can defend the decision to appeals, regulators, and the press. The conditions that reach us are exactly the ones where the classification is unsettled: something statistically rare that appears to cause no harm; something so common in our population that it is close to normal; something defined almost entirely by distress while the underlying biology looks unremarkable; something whose only apparent cost is social or cosmetic. We have practicing clinicians on the committee but no philosopher, roughly an hour of discussion per condition, and a written rationale that has to survive being read by people who will look for inconsistency across our decisions.

  Please give us a decision procedure we can actually run. It should be a small set of questions asked in a fixed order, with a statement of what counts as a sufficient answer at each step, explicit points where the procedure terminates in a negative verdict, and explicit points where it stops and hands the question to a value judgment rather than a fact. Ground it in what the philosophical work on health and disease actually establishes — the naturalist and biostatistical accounts, the harmful-dysfunction analysis, and the normativist and pragmatic alternatives — but write it so that a clinician or a lay committee member can apply it without having read any of that. In particular, the procedure must do the following. It must refuse to treat statistical abnormality as either necessary or sufficient for disease. It must force whoever applies it to state the reference class explicitly — relative to which population, age, sex, and environment the comparison is being made, and whether the comparison is to the local present population or to some ancestral or otherwise idealized one — and it must say what to do when the choice of reference class flips the verdict. It must separate intrinsic harm, meaning suffering or the loss of a capacity the person has reason to value, from extrinsic harm, meaning stigma, disadvantage, or cost, and it must take a position on whether extrinsic harm can ever carry a disease classification on its own. It must include a device for exposing the committee's own normative commitments, for example a counterfactual question of the form: if this condition were equally common and equally harmful but we had no biological account of it at all, would we still call it a disease? And it must be honest about which steps are judgment calls dressed up as procedure.

  Then run the procedure on three cases, giving the verdict, the steps that did the work, and the points where it nearly failed. First, myopia in a population where the great majority of young adults are now affected. Second, prolonged grief, which the major psychiatric manuals now recognize as a diagnosis, and its boundary with ordinary bereavement. Third, idiopathic short stature in a child at the low end of the normal range, whose family is requesting growth hormone.

  At least one of the three should come out in a way we will not like, and I would rather it be the case we are most tempted to decide on other grounds. Tell us what to do with that discomfort rather than how to make it go away, and say what would have to be true for the verdict to be wrong. Finally, state plainly what the procedure cannot do: which questions about who gets what, and at whose expense, it leaves untouched, and what it would be unreasonable to expect it to settle. Keep the procedure itself to something a committee member can hold on one page, and keep the worked cases short enough to read aloud in a meeting.
reasoning: |-
  We are designing a decision procedure for determining whether a condition counts as a disease for medical-necessity criteria. The procedure must be grounded in philosophical accounts of disease but be usable by clinicians without philosophical training. It must avoid making statistical abnormality necessary or sufficient, force explicit reference class choice, separate intrinsic from extrinsic harm, and include a device for exposing normative commitments.

  The procedure will be a series of questions in fixed order, with clear stopping points for negative verdicts or for handing off to value judgments.

  ---

  **Decision Procedure for Disease Classification**

  **Step 1: Reference Class Definition**
     - *Question:* Relative to which population, age, sex, and environment is the condition being evaluated? Specify whether the comparison is to:
       - (a) The local present population
       - (b) An ancestral population (if known and relevant)
       - (c) An idealized population (state the ideal)
     - *Requirement:* The reference class must be explicitly stated and justified in the written rationale. If changing the reference class flips the verdict (i.e., the condition is abnormal in one but normal in another), proceed to Step 2 but note the conflict and its implications for the next steps.

  **Step 2: Statistical Abnormality**
     - *Question:* Is the condition statistically abnormal in the defined reference class?
     - *Note:* Statistical abnormality is neither necessary nor sufficient for disease. If the condition is statistically abnormal, proceed to Step 3. If it is statistically normal, proceed to Step 3 anyway (because normality does not preclude disease).

  **Step 3: Intrinsic Harm**
     - *Question:* Does the condition cause intrinsic harm? Intrinsic harm is defined as:
       - Suffering (physical or mental distress that is not solely due to social reactions)
       - Loss of a capacity that the person has reason to value (e.g., mobility, cognition, sensory function) that is not solely due to extrinsic factors.
     - *Sufficient Answer:* If the condition causes intrinsic harm, proceed to Step 4. If it does not, go to Step 5.

  **Step 4: Biological Dysfunction (Harmful Dysfunction Analysis)**
     - *Question:* Is there evidence of a biological dysfunction? This means a failure of a part or process in the organism to perform its evolved (or original) function? (Note: This step requires a biological account, even if incomplete.)
     - *Sufficient Answer:*
       - If yes, then the condition is a disease. (Terminate with positive verdict.)
       - If no, but intrinsic harm is present, proceed to Step 6 (normative judgment).

  **Step 5: Extrinsic Harm Only**
     - *Question:* Does the condition cause only extrinsic harm? Extrinsic harm is defined as stigma, social disadvantage, or cost that arises from societal responses to the condition, not from the condition itself.
     - *Sufficient Answer:*
       - If the condition causes only extrinsic harm, then it is not a disease. (Terminate with negative verdict.)
       - If there is both intrinsic and extrinsic harm, proceed to Step 4 (if not already done) or Step 6 if Step 4 was inconclusive.

  **Step 6: Normative Judgment (The Counterfactual Test)**
     - *Question:* If this condition were equally common and equally harmful (in terms of intrinsic harm) but we had no biological account of it at all, would we still call it a disease?
     - *This is a value judgment.* The committee must vote. The answer must be justified in the written rationale, especially if it contradicts the biological dysfunction step (Step 4). If the vote is "yes", then the condition is a disease. If "no", then it is not.

  **Step 7: Final Verdict**
     - If the procedure has not terminated earlier, the condition is a disease only if:
       - It passed Step 4 (biological dysfunction with intrinsic harm) OR
       - It passed Step 6 (normative judgment in the absence of biological dysfunction but with intrinsic harm).

  **Important Notes:**
     - The procedure forces explicit reference class choice (Step 1) and separates intrinsic (Step 3) and extrinsic harm (Step 5). Extrinsic harm alone is insufficient for disease (Step 5 terminates negatively).
     - Steps 4 and 6 are the key decision points: biological dysfunction (naturalist) and normative override (normativist).
     - The counterfactual in Step 6 exposes the committee's normative commitments.

  ---

  **Worked Cases**

  **Case 1: Myopia in a population where the great majority of young adults are now affected.**

  **Step 1:** Reference class: Young adults in the local present population. (Note: If we choose an ancestral population without modern near-work and with different visual demands, myopia would be abnormal. But we are using the local present, where it is common.)

  **Step 2:** Statistical abnormality: In the local present, myopia is statistically normal (majority affected). But we proceed.

  **Step 3:** Intrinsic harm: Myopia causes a loss of visual acuity, which is a capacity the person has reason to value (e.g., for reading, driving, safety). This is intrinsic harm. Proceed to Step 4.

  **Step 4:** Biological dysfunction: The eye's optical system fails to focus distant images on the retina (an evolved function). This is a biological dysfunction. 

  **Verdict:** Disease. (Terminate at Step 4.)

  **Note:** The committee might be uncomfortable because myopia is so common. However, the intrinsic harm (impaired vision) and clear biological dysfunction (failure of the eye's optical function) override statistical normality. The procedure forces us to recognize that disease can be common.

  **What if we had chosen an ancestral reference class?** In Step 1, if we chose an ancestral population, myopia would be statistically abnormal. But Step 2 does not require abnormality, so we still proceed to Step 3 and 4, which would also be passed. The verdict would be the same. The conflict in reference class does not change the outcome here.

  **Case 2: Prolonged grief (vs. ordinary bereavement)**

  Prolonged grief is defined as intense, persistent grief causing impairment beyond a culturally expected period (e.g., 6-12 months).

  **Step 1:** Reference class: Adults in the local present population, considering cultural norms for bereavement.

  **Step 2:** Statistical abnormality: Prolonged grief is statistically abnormal (most people adapt within the expected period). Proceed.

  **Step 3:** Intrinsic harm: The condition involves intense emotional suffering and functional impairment (e.g., inability to work, maintain relationships). This is intrinsic harm. Proceed.

  **Step 4:** Biological dysfunction: The biological basis of prolonged grief is not fully established. Some evidence suggests dysregulation in stress response and reward systems, but it's not as clear-cut as in myopia. We might say "no" or "unclear". Proceed to Step 6.

  **Step 5:** Not applicable (we have intrinsic harm).

  **Step 6:** Counterfactual: If prolonged grief were equally common and harmful but had no known biological dysfunction, would we call it a disease? This is a judgment call. The committee might argue that the suffering and impairment are sufficient, especially because it is a persistent maladaptation. Given that major psychiatric manuals recognize it, the committee might vote "yes".

  **Verdict:** Disease (via Step 6).

  **Points of discomfort:** The boundary with ordinary bereavement is fuzzy. The procedure forces the committee to make a normative judgment in Step 6. What if the condition is common in a subgroup (e.g., after traumatic loss)? The reference class in Step 1 must be chosen carefully (e.g., "adults who have experienced bereavement"). The verdict might be wrong if future research shows that prolonged grief is a normal variant of the grief process without dysfunction. But for now, the harm and persistence justify the call.

  **Case 3: Idiopathic short stature (ISS) in a child at the low end of the normal range**

  ISS is defined as height more than 2 standard deviations below the mean without an identified medical cause.

  **Step 1:** Reference class: Children of the same age and sex in the local present population.

  **Step 2:** Statistical abnormality: The child is at the low end of the normal range (e.g., 3rd percentile). By definition, 3% of the population is at or below this point. It is statistically abnormal? Usually, we set a cutoff (e.g., -2 SD, which is about 2.3rd percentile). But if it's just "low end" without a clear cutoff, we might say it's not statistically abnormal (since it's within the normal range). However, let's assume it is below -2 SD (abnormal). Proceed.

  **Step 3:** Intrinsic harm: Short stature itself does not cause physical suffering or loss of a capacity the person has reason to value. The child is healthy and functional. The harm is extrinsic: social stigma, disadvantage in certain activities, or parental concern. Thus, no intrinsic harm. Proceed to Step 5.

  **Step 4:** Not reached.

  **Step 5:** Extrinsic harm only: The condition causes extrinsic harm (e.g., bullying, discrimination). But by the procedure, extrinsic harm alone is insufficient.

  **Verdict:** Not a disease. (Terminate at Step 5.)

  **Discomfort:** The family is requesting growth hormone. The committee might feel pressure to cover it. But the procedure says: no intrinsic harm, only extrinsic harm → not a disease. The procedure forces us to confront that we are being asked to medicalize a normal variant. 

  **What would have to be true for the verdict to be wrong?** If we discovered that ISS is caused by a subtle biological dysfunction (e.g., a defect in growth hormone signaling) that also causes other health problems, then Step 4 might be passed. But by definition, ISS has no known cause. Alternatively, if the committee rethinks Step 3 and argues that being extremely short intrinsically limits a person's capacity to reach objects, participate in sports, etc., then it might be intrinsic. But the procedure requires that the loss of capacity is one the person has reason to value independently of social norms. The inability to reach a high shelf might be intrinsic, but the social stigma is extrinsic.

  **How to handle discomfort:** The procedure has spoken: no disease. But coverage decisions might still be made on other grounds (e.g., mitigating social harm, if the plan has a policy for cosmetic or quality-of-life interventions). The procedure does not decide coverage; it only decides whether the condition is a disease for medical-necessity criteria. The committee must be clear that this condition is being excluded from disease classification, and therefore any coverage would be on a different basis (e.g., as a benefit enhancement).

  ---

  **What the Procedure Cannot Do:**
     - It does not decide coverage. Even if a condition is a disease, coverage depends on medical necessity, cost-effectiveness, and plan benefits.
     - It does not resolve distributive justice questions: who gets what, at whose expense, and how to prioritize.
     - It does not define what is "normal" in a reference class when boundaries are fuzzy (e.g., grief).
     - It does not eliminate value judgments; it makes them explicit (especially in Step 6).
     - It cannot replace clinical judgment about individual cases; it only classifies the condition in general.
     - It does not solve the problem of extrinsic harm; it explicitly excludes it from being sufficient for disease classification.

  The procedure is a tool for consistent, transparent classification. It leaves untouched the larger questions of what interventions a health plan should cover and why. It would be unreasonable to expect it to resolve all ethical and social dilemmas in healthcare.

  ---
answer: |-
  ### Decision Procedure for Disease Classification  
  **One-Page Summary for Committee Use**  

  1. **Define the Reference Class**  
     - *Question:* Relative to which group (population, age, sex, environment) are we comparing this condition? Specify: local present, ancestral, or idealized population.  
     - *Requirement:* State explicitly. If changing the reference class flips statistical normality (e.g., abnormal in ancestral but normal locally), proceed to Step 2 but flag this conflict.  

  2. **Assess Statistical Abnormality**  
     - *Question:* Is the condition statistically uncommon in the reference class?  
     - *Rule:* **Do not stop here.** Abnormality is neither required nor sufficient. Proceed regardless.  

  3. **Identify Intrinsic Harm**  
     - *Question:* Does the condition cause suffering or loss of a capacity the person has reason to value (e.g., mobility, cognition), independent of societal reactions?  
     - *Sufficient Answer:* **Yes** → Proceed to Step 4.  
       **No** → Skip to Step 5.  

  4. **Check for Biological Dysfunction**  
     - *Question:* Is there evidence of a failure in the body’s evolved or original function (e.g., organ malfunction, cellular defect)?  
     - *Sufficient Answer:* **Yes** → **Disease. Stop.**  
       **No** → Proceed to Step 6.  

  5. **Assess Extrinsic Harm**  
     - *Question:* Is the harm *only* extrinsic (e.g., stigma, cost, disadvantage due to societal norms)?  
     - *Rule:* **Yes** → **Not a disease. Stop.**  
       **No** (if intrinsic harm exists but skipped earlier) → Return to Step 4.  

  6. **Normative Judgment (Counterfactual Test)**  
     - *Question:* "If this condition were equally common/harmful but had no biological explanation, would we still call it a disease?"  
     - *Rule:* **Committee vote required.**  
       **Yes** → **Disease.**  
       **No** → **Not a disease.**  

  **Key Principles Embedded:**  
  - **Extrinsic harm alone is never sufficient** (Step 5).  
  - **Reference class conflicts** must be disclosed but don’t halt the process.  
  - **Judgment calls** are explicit in Steps 1 (reference class) and 6 (counterfactual).  
  - **Termination points:** Negative verdict at Step 5; positive at Step 4 or 6.  

  ---

  ### Worked Cases  

  #### **1. Myopia (in a population where most young adults are affected)**  
  - **Step 1:** Reference class = Local present young adults (majority myopic).  
  - **Step 2:** Statistically **normal** → Proceed (abnormality not required).  
  - **Step 3:** **Intrinsic harm:** Impaired vision limits capacity to see distant objects (reasonably valued). → Proceed.  
  - **Step 4:** **Biological dysfunction:** Eyeball shape prevents light from focusing on retina (failure of evolved function). → **DISEASE.**  
  - **Where it nearly failed:** If reference class switched to ancestral (abnormal), verdict unchanged. Step 3/4 did the work.  
  - **Discomfort:** Myopia is common, but biology and intrinsic harm prevail. *To challenge:* Show myopia confers net benefit (e.g., protects against age-related eye diseases).  

  #### **2. Prolonged Grief (vs. ordinary bereavement)**  
  - **Step 1:** Reference class = Local present adults; culturally expected bereavement duration.  
  - **Step 2:** Statistically **abnormal** (persists >6–12 months). → Proceed.  
  - **Step 3:** **Intrinsic harm:** Severe distress, inability to function (e.g., work, relationships). → Proceed.  
  - **Step 4:** **Biological dysfunction unclear:** Neuroendocrine stress responses may be dysregulated, but evidence is incomplete. → Proceed to Step 6.  
  - **Step 6:** **Counterfactual:** "Without biology, would we call it a disease?" Committee likely votes **yes** (harm is severe and persistent). → **DISEASE.**  
  - **Where it nearly failed:** Boundary with "normal" grief is fuzzy. Step 6 (normative) did the work.  
  - **Discomfort:** Risk of pathologizing natural sorrow. *To challenge:* Prove it’s a normal adaptation to loss.  

  #### **3. Idiopathic Short Stature (child at low end of normal range)**  
  - **Step 1:** Reference class = Local present children (same age/sex).  
  - **Step 2:** Statistically **abnormal** (e.g., ≤3rd percentile). → Proceed.  
  - **Step 3:** **Intrinsic harm?** No pain, no functional loss (e.g., running, learning). Harm is extrinsic (bullying, parental anxiety). → Proceed to Step 5.  
  - **Step 5:** **Extrinsic harm only** → **NOT A DISEASE. Stop.**  
  - **Where it nearly failed:** Pressure to conflate social harm with biology. Step 3/5 did the work.  
  - **Discomfort:** Family requests growth hormone, but procedure blocks medicalization. *To challenge:* Show intrinsic harm (e.g., height directly impairs bone health).  

  **Why we won’t like #3:** It denies disease status despite social harm, forcing us to confront that coverage (if any) must be justified on non-disease grounds (e.g., compassion). **Don’t make discomfort go away—use it.** Admit the verdict is biologically sound but ethically uneasy, and debate coverage separately.  

  ---

  ### What the Procedure Cannot Do  
  - **Not covered:** Who pays, at what tier, or why. It only classifies "disease."  
  - **Not resolved:** Value conflicts (e.g., "capacity the person has reason to value" in Step 3 requires committee judgment).  
  - **Not settled:** Conditions where biology is irrelevant (e.g., purely psychological harms) rely on Step 6’s vote.  
  - **Unreasonable to expect:** Perfect consistency without committee deliberation. It exposes biases but can’t eliminate them.  

  **Final Note:** This procedure forces transparency. When reference class, intrinsic harm, or biology are ambiguous, the written rationale must confess the uncertainty. Use it to show regulators/press that decisions are principled, even when unpopular.
