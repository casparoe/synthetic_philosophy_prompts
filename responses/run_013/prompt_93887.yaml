  Here’s a draft adversarial collaboration document structured around your requirements, using the test case for concrete predictions. The language of translation is French (chosen for its distinct rhyme resources and mandatory vowel endings).

  ---

  ### **Adversarial Collaboration: Constraint Fidelity in Poetic Translation**  
  **Joint Statement by [Same-Rule Person] and [Same-Role Person]**  

  #### 1. **Shared Premises**  
     Both signatories agree on the following:  
     1.1. Translation aims to recreate a source poem’s artistic experience for a new audience.  
     1.2. Formal constraints (e.g., rhyme, acrostics) are *intentional artistic choices* integral to a poem’s design.  
     1.3. All translations involve compromise; no translation is fully "lossless."  
     1.4. The reader is owed either (a) the *effects* of the source poem’s constraints, or (b) the constraints themselves as artifacts of craft.  
     1.5. Fidelity requires transparency: if constraints are altered, the translation should note this (e.g., "adapted from").  
     1.6. The test case’s half-broken "SU SA" acrostic is a flaw in the source text, not a feature.  

  #### 2. **Residual Disagreements**  
     *Phrased in each camp’s own terms:*  
     - **Same-Rule Position:**  
       > "A translation that abandons a poem’s core formal rules ceases to be a translation *of that poem*. Constraints are part of its ontology; changing them produces a derivative work."  
     - **Same-Role Position:**  
       > "A translation that discards a constraint’s *function* (e.g., wit, memorability) fails the reader. If replicating the rule is impossible, substituting a new constraint that fulfills the same role is faithful pragmatism."  

  #### 3. **Cruxes & Test Case Predictions**  
     *(Predictions assume translation into French)*  

     **Crux 1: Is the constraint part of the poem’s MEANING or merely a vehicle for EFFECT?**  
     - **Shared Case:** In the test case, the lipogram (no "e") forces diction like "darkling" instead of "darkening." Does this *mean* something (e.g., archaism, deprivation)? Or is it purely a technical challenge?  
       - *Same-Rule Prediction:* The lipogram is semantic. Dropping it erases the poet’s struggle against limitation, central to the poem’s meaning.  
       - *Same-Role Prediction:* The lipogram’s *effect* is aural austerity. French’s vowel-rich phonology can replicate this with assonance/consonance.  

     **Crux 2: Can a DIFFERENT constraint ever replicate the SAME constraint?**  
     - **Shared Case:** The ABAB rhyme’s "role" is sonic predictability. French rhymes more easily (rich suffixes). Could a meter shift (e.g., alexandrine → octosyllables) or a new device (internal rhyme) provide equivalent rhythmic satisfaction?  
       - *Same-Rule Prediction:* No. Rhyme scheme is irreducible; ABAB ≠ ABBA or free verse + alliteration.  
       - *Same-Role Prediction:* Yes. If readers feel comparable pleasure/pattern-recognition, the role is preserved.  

     **Crux 3: Is reader NOTICEABILITY of a constraint necessary for its role?**  
     - **Shared Case:** The "SU SA" acrostic is already obscure in English. Would a French reader spot it? If not, is replicating it futile?  
       - *Same-Rule Prediction:* Noticeability is irrelevant. The constraint exists as craft, even if covert. Omitting it is falsification.  
       - *Same-Role Prediction:* If readers won’t notice the acrostic, its "role" is null. Invest effort elsewhere (e.g., enhancing rhyme impact).  

     **Crux 4: Can a PARTIAL constraint replica be a "translation"?**  
     - **Shared Case:** A French version keeps ABAB rhyme and "S_ S_" acrostic (e.g., "Soleil S'éteint...") but drops the lipogram.  
       - *Same-Rule Prediction:* This is a **partial success** but *not a full translation* (lipogram is non-negotiable). Label it "constrained adaptation."  
       - *Same-Role Prediction:* **Success** if the lipogram’s role (austerity) is achieved by other means (e.g., stark imagery). Acrostic preservation is optional if functionally inert.  

  #### 4. Diagnosed Verbal Disagreement  
     - **The Term "Form":**  
       - *Same-Rule* uses "form" as **textual architecture** (rules as measurable objects).  
       - *Same-Role* uses "form" as **experiential scaffold** (rules as tools for affect).  
     - **Why it matters:** This causes talking past each other. Same-Rule hears "role" as vague; Same-Role hears "rule" as pedantic.  

  #### 5. Flagged Issues  
     - **Same-Rule Blind Spot:** Insisting on replicating all constraints in languages where they’re trivial/impossible (e.g., "e"-lipogram in French) risks prioritizing mechanics over art. Some constraints *must* adapt.  
     - **Same-Role Blind Spot:** "Role" is subjective. One reader may find a substituted constraint witty; another may find it gimmicky. Without the original rule, fidelity claims are untestable.  
     - **Test Case Realism:** The broken "SU SA" acrostic undermines both positions. Same-Rule defends a flawed constraint; Same-Role must explain why a nonsensical acrostic has a "role."  

  ---  

  ### **Sample French Translation & Predictions**  
  *(Illustrating compromises; acrostic adjusted to "SO LE" for meaning)*  
  > **S**oleil sombre, lueur fanée  
  > **O**mbres au front pâli des monts ;  
  > **L**ent spectacle qui se meurt  
  > **E**t le monde glace ses ponts.  

  - **Constraints Kept:** ABAB rhyme (fancée/monts ; meurt/ponts), approximate acrostic (SOLE), no lipogram.  
  - **Same-Rule Verdict:** **Failure** (no lipogram; acrostic altered). Not a translation.  
  - **Same-Role Verdict:** **Partial success** (rhyme’s musicality preserved; acrostic’s "puzzle" role retained; lipogram’s austerity implied by concise syntax). Qualifies as translation if imagery evokes "cold stillness."  

  This document clarifies that the core divide is **ontological** (is the poem its rules or its effects?) and **pragmatic** (what can translators *do* in real languages?). The predictions force both sides to confront testable outcomes—moving beyond abstraction.
