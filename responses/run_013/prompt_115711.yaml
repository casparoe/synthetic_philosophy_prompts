answer: |-
  That's an excellent and genuinely deep snag—not a cheap trick at all. Your flatmate's planet example cuts to the heart of Kripkean semantics and forces us to confront the distinction between **meaning, reference, and epistemic access**. Let me break down the implications for scientific authority and identity claims step by step, separating what *follows* from the rigid designator framework from common misunderstandings.

  ### 1. **The Planet Example: What It Shows**
     - **Scenario**: Astronomers name "Vulcan" (a supposed planet between Mercury and the sun) based on orbital anomalies. Later, they discover no such planet exists.
     - **Kripkean Analysis**:
       - "Vulcan" was *intended* as a rigid designator (meant to pick out a specific object across all worlds).
       - But since the object **doesn't exist**, "Vulcan" rigidly designates... **nothing**. In every possible world, it refers to nothing.
       - Yet astronomers *meant something* when they said "Vulcan causes Mercury's orbit anomalies." The *meaning* comes from the **descriptive content** they associated with the name (e.g., "the planet perturbing Mercury's orbit").
     - **Implication**: Reference isn't guaranteed by our beliefs or descriptions. **Rigidity secures reference *only if the object exists*.** If it doesn't, the term is "empty" but still meaningful via associated descriptions.

  ### 2. **The Core Implications for Scientific Authority**
  The rigid designator + necessary a posteriori picture has profound consequences for how we view scientific "overturning" of identity claims like "water = H₂O":

  | **Scenario** | **Kripkean Interpretation** | **Key Implication** |
  |--------------|------------------------------|---------------------|
  | **Future scientists claim water isn't H₂O** | This is **impossible** if "water" rigidly designates H₂O. If they discover a substance that *looks* like water but has a different structure (e.g., XYZ), it **isn't water**—it's a counterfeit. | Identity claims aren't revisable if the terms are rigid and the identity is true. Science can't overturn necessities; it can only correct *misidentifications*. |
  | **Scientists discover we were wrong about the essence** (e.g., all "water" samples were contaminated) | "Water" rigidly designates whatever *actually* constitutes the stuff in our environment. If it was secretly XYZ all along, then **water = XYZ necessarily**. Our *belief* that it was H₂O was false, but the rigid term still picked out XYZ. | Rigidity anchors reference to **actual-world constitution**, not our *beliefs*. Science corrects our epistemic errors, not metaphysical necessities. |
  | **Scientists revise a natural kind's boundaries** (e.g., plutonium isn't an element after all) | If "plutonium" rigidly designates the substance with atomic number 94, then discovering it's not an element would mean **there is no plutonium** (like "Vulcan"). The term fails to refer, but our *statements* about it had meaning via descriptions (e.g., "the element created in 1940"). | Empty terms don't invalidate rigidity; they show reference depends on **actual existence**. |

  ### 3. **What Follows (and What Doesn't)**
  - **Follows**:  
    - **Science doesn't "overturn" necessary identities**. If "water = H₂O" is true, it's true in all possible worlds. Future science can reveal:  
      - We misidentified the *reference-fixing sample* (e.g., we called XYZ "water" by mistake).  
      - We confused two substances (e.g., what we called "water" was actually a mixture).  
    - **Authority of current science is provisional for *discovering* essences, but binding for *fixing* reference**. Once we empirically identify the essential property (e.g., molecular structure for water), rigidity locks it in. Future science can't change what "water" refers to—only what we *learn* about it.  
    - **Meaning survives reference failure**. Sentences about "Vulcan" expressed propositions (e.g., "There is a planet causing Mercury's anomalies"), even if false. This explains why historical scientific discourse wasn't "meaningless."  

  - **Does *Not* Follow**:  
    - That all scientific terms are rigid. Only *genuine* names/natural kind terms are (e.g., "water," "gold," "tiger"). Theoretical terms like "phlogiston" or "caloric" may fail to refer.  
    - That science is infallible. Rigidity doesn't protect our *beliefs*—it protects the *link* between a term and its actual referent. We can still be wrong about what the referent *is*.  
    - That "water is H₂O" is *epistemically* necessary. We needed empirical work to discover it. But once discovered, it's *metaphysically* necessary.  

  ### 4. **Why This Isn't Circular or Dogmatic**
  Critics might argue this "protects" current science from falsification. But Kripke's model avoids this:  
  - **Rigid reference is fixed by ostension + essence**: When we baptize "water," we point to a liquid and stipulate it refers to "whatever has the same underlying nature as *this*." Science later discovers that nature is H₂O.  
  - **Future science can challenge the baptism**: If we discover our original samples were misidentified (e.g., we pointed to vodka, not water), then "water" might refer to something else—but this is **correcting a mistake in reference-fixing**, not overturning a necessity.  
  - **The necessity is *de re*, not *de dicto***: It's not that the *sentence* "water is H₂O" is immune to revision; it's that the *stuff itself* couldn't be otherwise.  

  ### Bottom Line for Your Sleepless Nights
  - **If scientists "overturn" water = H₂O**, it means one of three things:  
    1. They're wrong (impossible if rigidity holds).  
    2. "Water" was never successfully fixed to H₂O (e.g., all our samples were impostors).  
    3. They're redefining "water" (e.g., for pragmatic reasons), but this isn't *metaphysical* revision.  
  - **The planet example isn't a trick**: It shows that **language hooks onto the world rigidly *when the world cooperates***. When it doesn't, we still have meaningful discourse via descriptions, but no reference.  
  - **Authority of science**: Future science has authority over *discovering* essences and *correcting* errors, but not over *altering necessities*. Rigidity ensures that once we latch onto a kind, its identity is locked.  

  This isn't just "Kripke said so"—it's a coherent model explaining why "Hesperus is Phosphorus" feels different from "the morning star is the evening star," and why science can't "discover" that water isn't wet. The power—and limitation—lies in the act of pointing at the world and saying, "*This* is what I mean, in every possible scenario."
