prompt: |-
  ok so my flatmate and i just spent like two hours going at each other about rigid designators and the necessary a posteriori and now i can't sleep, so forgive the ramble. here's the part that actually snagged us. we both basically accept that names and natural kind terms are rigid, right, so 'water' picks out that same stuff in every possible world and 'Hesperus' picks out Venus in every world no matter what we happen to believe about it. then he drops this on me: imagine astronomers had posited a planet between Mercury and the sun and it turned out there's just nothing there. on the rigid picture the name refers to nothing, yet every sentence they said with it still meant something. he says that shows whether a term actually refers is completely seperate from whether anything answers to our beliefs about it, and even from whether the thing exists at all. i honestly couldn't tell if that's deep or a cheap trick.

  what i actually want from you is the most important implications of this whole rigid + necessary-a-posteriori picture for how much authority i should give to future science when it looks like it's overturning an identity claim. like if chemists one day decide water isn't H2O after all -- were we wrong about water, or did 'water' never pick out H2O in the first place? and what happens to the idea that 'water is H2O' was supposedly a necessary truth we only found out empirically? give me the main implications, and please actually spell out what follows rather than just telling me kripke said so, because i want to know which ones are real and which are just the picture doing the talking.
