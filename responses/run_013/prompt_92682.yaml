  - **Two Centers of Consciousness and Two Subjects, One Person** are in separate leaves (Node 5 vs. Node 7) because they differ in the *kind* of unity at issue (phenomenal vs. functional). They do not collapse.  
  - **One Subject, Not Jointly Available and Partly Unified Subject** are separated by Node 2 (all-or-nothing vs. degrees). They share similarities but are distinct commitments.  
  - **No other positions collapse.** The tree distinguishes all 9 positions you listed (with minor rephrasing for clarity).  

  ### Locating You and Your Friend
  - **Your position ("two subjects, with unity manufactured after the fact"):**  
    Path: Node 1 (Functional access) → Node 3 (Reveal facts about subjects) → Node 7 (Post-hoc narrative) → **Leaf: Manufactured Unity**.  
