  - **Unexplored (coherent but rare/non-standard):**  
    - *Emergent Subject* + *Functional access*: The emergent view typically arises from phenomenal unity, not functional access. No major position occupies this.  
    - *Two Centers* + *Manufactured Unity*: If there are two subjects, "manufacturing" applies to narration, not unity per se. Only partially explored (e.g., in narrativist views).  

