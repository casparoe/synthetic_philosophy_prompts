  Below is a decision tree designed to resolve your disagreement by mapping the logical space of positions on the unity of consciousness in split-brain cases. The tree starts from fundamental questions about the nature of unity and builds outward, prioritizing your requirement to avoid relitigating experiments. It incorporates the positions you listed, cases as nodes (treated as you described), and diagnostic notes on gaps. The tree has **7 internal nodes** (questions) and **10 leaves** (positions), fitting your size constraints. Node questions are in ordinary language, and positions use descriptive labels (not attributed isms).

  ### Decision Tree: Unity of Consciousness in Split-Brain Cases

  **Start at Node 1:**

  1. **Is the unity disrupted in split-brain cases a property of consciousness itself (e.g., "what it is like" to have experiences together), or a property of functional access (e.g., information availability for report/control), or a property of practical agency (e.g., answerability to a single set of commitments)?**  
     - **Consciousness (phenomenal unity)** → Proceed to Node 2.  
     - **Functional access (report/control unity)** → Proceed to Node 3.  
     - **Practical agency (deliberative unity)** → **Leaf: Single Practical Deliberator**.  
       *Awkward commitment:* The subject may have experiences it cannot access or introspect, but it remains one subject because it is a unified agent answerable to one set of commitments. (Position: Unity defined by practical deliberation.)  

  **From Node 1 → Practical agency:**  
  - *Leaf reached. No further branch.*  

  **From Node 1 → Consciousness (Node 2):**  

  2. **Does the split-brain evidence show that unity is all-or-nothing (e.g., either fully unified or split), or that it admits of degrees (e.g., partial integration)?**  
     - **All-or-nothing** → Proceed to Node 4.  
     - **Admits of degrees** → **Leaf: Partly Unified Subject**.  
       *Awkward commitment:* It is unclear how a single subject can be "partly" unified without collapsing into two subjects or an incoherent middle ground. (Position: Unity comes in degrees; patient is a partly unified subject.)  

  **From Node 2 → All-or-nothing (Node 4):**  

  4. **In standard split-brain tests (e.g., a word shown only to the right visual field cannot be spoken by the left-hemisphere-controlled voice), is the inability to report due to a disunity in consciousness or merely a failure of information transfer for access?**  
     - **Disunity in consciousness (e.g., two separate "what it is like" streams)** → Proceed to Node 5.  
     - **Failure of access/transfer (e.g., consciousness is unified, but information is blocked)** → **Leaf: One Subject, Not Jointly Available**.  
       *Awkward commitment:* The subject has experiences (e.g., in the right hemisphere) that it cannot use for reasoning, report, or self-knowledge. (Position: One subject whose experiences are not jointly available to it.)  

  **From Node 4 → Disunity in consciousness (Node 5):**  

  5. **Are there two subjects of experience?**  
     - **Yes** → **Leaf: Two Centers of Consciousness**.  
       *Awkward commitment:* Why does the patient not exhibit two distinct "persons" in daily life (e.g., only one speaks, no internal conflict in routine behavior)? (Position: There are two subjects/centers of consciousness.)  
     - **No** → Proceed to Node 6.  

  **From Node 5 → No (Node 6):**  

  6. **Can the apparent unity of behavior (e.g., coherent actions despite disconnection) be explained without inner integration, such as via external cues (e.g., the speaking hemisphere observing the other hemisphere's actions)?**  
     - **Yes, unity is externally mediated** → **Leaf: One Subject, Switching Stream**.  
       *Awkward commitment:* Simultaneous processing (e.g., both hemispheres reacting to different stimuli at once) must be explained as rapid switching or ignored. (Position: One subject with one stream that switches.)  
     - **No, inner integration occurs** → **Leaf: Emergent Subject**.  
       *Awkward commitment:* The subject is an unobservable entity (not the hemispheres or whole brain) that must be inferred from behavior. (Position: One subject that is neither hemisphere nor whole brain.)  

  **From Node 1 → Functional access (Node 3):**  

  3. **Do split-brain phenomena (e.g., one hand acting against stated intentions) reveal a fact about subjects of experience, or are subjects merely a useful way to describe behavioral/data patterns?**  
     - **Reveal facts about subjects** → Proceed to Node 7.  
     - **Subjects as a descriptive tool** → **Leaf: Façon de Parler for Subjects**.  
       *Awkward commitment:* We must explain the intuition of a unified self without appealing to a real subject. (Position: Vocabulary of subjects is a façon de parler; data expose access patterns.)  

  **From Node 3 → Reveal facts about subjects (Node 7):**  

  7. **When the speaking hemisphere confabulates reasons for actions it didn't initiate (e.g., "I chose to do that" for a right-hemisphere action), does this show that unity is a real-time feature of consciousness or a post-hoc narrative?**  
     - **Real-time feature** → **Leaf: Two Subjects, One Person**.  
       *Awkward commitment:* How can two distinct subjects of experience share a single personhood (e.g., legal identity, autobiographical memory)? (Position: Two subjects of experience but one person.)  
     - **Post-hoc narrative** → **Leaf: Manufactured Unity**.  
       *Awkward commitment:* Unity is never present in the moment of experience; it is imposed retrospectively by the narrator. (Position: Unity is manufactured after the fact by the narrating hemisphere.)  

  ---

  ### Diagnostics and Combinations Not Occupied
  - **Incoherent combinations (logically impossible):**  
    - *One Subject, Switching Stream* + *Simultaneous experiences*: If experiences can be simultaneous (e.g., both hemispheres react at once), switching is falsified. Occupied only if simultaneous processing is denied (as in the tree).  
    - *Practical Deliberator* + *Two Subjects*: A single deliberator implies one agent, so two subjects cannot coexist under this view. Not occupied.  
  - **Coherent but unattractive (no major position holds this):**  
    - *Partly Unified Subject* + *All-or-nothing unity*: If unity is all-or-nothing, degrees are excluded. Not occupied because it contradicts Node 2.  
