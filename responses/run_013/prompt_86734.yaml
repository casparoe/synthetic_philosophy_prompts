prompt: |-
  I have no academic training in this area. What follows is a puzzle I have assembled over years of reading newspapers and having lived in several countries, and what I want from you is help naming a thing, not a summary of the usual argument about separating church and state.

  The puzzle is that a country's formal position on religion and its practical entanglement with religion do not seem to move together, and in some cases appear to run in opposite directions.

  In England the church is established in the fullest legal sense: the head of state is its head, its bishops sit in the upper house of the legislature as of right, and a substantial share of the schools paid for out of the public purse are run by religious bodies, the established church among them. Regular attendance, meanwhile, is a very small fraction of the population, and the whole arrangement seems to cost dissenters almost nothing.

  In France, separation is asserted more loudly than anywhere else in Europe, yet one region still lives under the arrangement that predates the separation law, with priests, pastors and rabbis paid out of a government ministry's budget and religious instruction on the public school timetable.

  In Germany there is no established church at all, but the ordinary revenue office collects a church tax calculated as a percentage of your income tax; whether you are a member is a matter of the revenue office's records; and ceasing to be a member is a declaration to a state office rather than to the church.

  In Denmark the church is established, its tax is collected by the tax authority, and the state also supports it out of general taxation, so non-members pay for it as well.

  In Sweden the church was disestablished at the turn of the millennium, yet the tax agency still collects its membership fee, the same channel is open to a list of other religious bodies, and everyone, member or not, pays a burial fee whose collection is largely in the hands of the church's own parishes.

  In the United States establishment is constitutionally forbidden, and yet churches are exempt from taxation as a matter of course and legislative and military chaplains are paid out of public funds.

  What I want is a name, if there is one, for this specific thing, and I will not be satisfied with a bare label. I suspect I am in fact looking at three different phenomena and would like them separated. The first is the divergence itself, between legal status and practical entanglement. The second is the move by which an entanglement survives because it has been made even-handed, extended to every faith in turn, so that fairness becomes the mechanism by which religion stays on the state's payroll. The third is the re-description by which a religious arrangement comes to look like neutral administration: the collection of a tax, the keeping of population records, the upkeep of old buildings, the burial of the dead.

  I have been told the phrase de facto establishment, which seems to cover part of the first phenomenon but is too coarse to be useful, and I know that civil religion means something different, a shared civic symbolism rather than a fiscal or administrative channel. So: does each of these three have an established name, and if not, can you coin one and define it precisely enough that I can tell what falls inside and outside it? Where are the edges — is a state that pays for the upkeep of historic church buildings doing the same thing as one that collects a church tax, and is a public holiday a form of establishment or something else entirely? Which of the three distinctions is the most useful to have, and which of my examples actually belongs to a different phenomenon than the one I have filed it under?
reasoning: |-
  Okay, let me start by unpacking the user's query. They've observed a puzzle: the mismatch between a country's legal stance on religion and its practical entanglements. They want names for three specific phenomena they've identified, not just the usual church-state separation arguments. 

  First, I need to make sure I understand each part of their puzzle. They listed examples like England's established church with low attendance, France's loud separation but state-paid clergy in Alsace-Moselle, Germany's church tax via revenue offices, etc. Their main points are the divergence between law and practice, the even-handed entanglement where all faiths get state support, and the rebranding of religious functions as neutral administration.

  The user mentioned they're not academically trained in this field, so they need clear, precise terms without jargon. They’ve already rejected "de facto establishment" as too vague and distinguished "civil religion" as different. So, I need to find or coin terms that are specific enough. 

  Looking at their three phenomena: 
  1. **Divergence between legal status and practical entanglement.** This is the core puzzle. Terms like "institutional decoupling" come to mind from sociology, where organizations separate formal rules from actual practices. But I should check if there's a more specific term in political science or law. Maybe "symbolic establishment" or "operational entanglement"?
  2. **Even-handed entanglement.** They describe extending state support to all faiths as a way to maintain religious funding under fairness. The German model is key here. Terms like "multi-faith accommodation" or "plural establishment" might work, but I need to ensure they capture the mechanism of using fairness to perpetuate state-religion ties.
  3. **Rebranding religious functions as neutral administration.** Here, activities like tax collection or burial fees are framed as administrative tasks. Concepts like "functional secularization" or "bureaucratic embedding" could fit. I recall that in Sweden, the church handles burials as a public service, which exemplifies this.

  Next, I should verify if existing terms cover these. "De facto establishment" is too broad. "Civil religion" is about shared symbols, not fiscal ties. The user wants distinct terms for each phenomenon. 

  For coining terms:
  - First phenomenon: "Formal-Institutional Divergence" emphasizes the gap between written rules and operational reality. 
  - Second: "Pluralized Entanglement" highlights the extension to multiple religions via fairness. 
  - Third: "Administrative Commensuration" frames religious functions as neutral state tasks. 

  I need to define each precisely. For example, Formal-Institutional Divergence must exclude countries where law and practice align. Pluralized Entanglement should require state support for multiple religions, not just one. Administrative Commensuration needs to focus on rebranding, not just coexistence. 

  Also, the user asks about edges: Is maintaining historic churches the same as collecting church taxes? Under Administrative Commensuration, if framed as cultural preservation, it might fit. Public holidays could be civil religion if secular, or symbolic establishment if tied to one religion. 

  Which distinction is most useful? The first one (divergence) seems foundational. The examples given mostly fit, but France's Alsace-Moselle might be a historical exception rather than divergence. Sweden’s burial fee is Administrative Commensuration, not divergence. 

  I should also consider the user's deeper needs. They might be seeking frameworks to analyze real-world policy, not just labels. Providing clear categories helps them classify other cases and understand underlying mechanisms. Emphasizing the utility of each term in analysis would add value beyond definitions.
answer: |-
  Based on your meticulous observations and the need for precise distinctions, here are terms for each phenomenon, carefully defined to demarcate their boundaries:

  1.  **For the Divergence between Legal Status and Practical Entanglement:** **Formal-Institutional Divergence**
      *   **Definition:** A significant and persistent gap between a state's *de jure* (legal/constitutional) position regarding religious establishment or separation and its *de facto* (operational/administrative) entanglements and dependencies with religious institutions.
      *   **Key Characteristics:**
          *   Focuses on the *gap itself* as the core phenomenon.
          *   Requires both a clear formal position (established, separated, neutral) AND demonstrable, significant practical entanglements that contradict or sit uneasily with that formal position.
          *   Entanglements must be institutionalized (systematic, routine, bureaucratic) rather than purely cultural or symbolic.
      *   **Edges & What's In/Out:**
          *   **IN:** England (formal establishment + functional irrelevance/low burden); USA (formal separation + tax exemptions, military chaplains); France (formal separation + Alsace-Moselle regime *if viewed as contradicting national law*).
          *   **OUT:** Countries where legal status and practice broadly align (e.g., Saudi Arabia - formal establishment + deep entanglement; North Korea - formal atheism + suppression). Also out: cultural Christianity without institutional ties (e.g., Christmas as a holiday in a formally secular state).
          *   **Grey Area:** France's Alsace-Moselle *could* be seen as a localized exception rather than national divergence, depending on emphasis. Sweden post-disestablishment shows less divergence now (church tax collection is a service offered to many orgs, burial fee is framed as public service).
      *   **Why this term?** "Formal" captures the legal/constitutional aspect. "Institutional" specifies the entanglement is embedded in state structures/practices. "Divergence" highlights the gap.

  2.  **For Entanglement Surviving via Even-Handedness (Fairness Mechanism):** **Pluralized Entanglement**
      *   **Definition:** A system where state support for, or practical entanglement with, religion is maintained *by extending similar benefits, access, or burdens to a wide range of recognized religious groups*, thereby reframing the arrangement as state neutrality, pluralistic accommodation, or public service rather than establishment or privilege for one group.
      *   **Key Characteristics:**
          *   The *mechanism* is key: using fairness, neutrality, or pluralism arguments to *perpetuate* state-religion linkages.
          *   Involves a *deliberate extension* of existing entanglements to multiple groups (or opening the *possibility* for others to qualify).
          *   The entanglement itself (e.g., funding, access to institutions) remains significant.
      *   **Edges & What's In/Out:**
          *   **IN:** Germany (Church tax system open to qualifying religious bodies); Sweden (tax agency collects fees for qualifying religious communities, burial fee applies to all); French Alsace-Moselle (state salaries for clergy of multiple faiths); *Potentially* US chaplaincy systems if designed multi-faithly.
          *   **OUT:** Systems supporting only one religion (e.g., traditional England, Denmark's primary support for Folkekirken). Also out: genuinely neutral state services available equally to all groups without *specific* religious entanglement (e.g., general non-profit tax status).
          *   **Grey Area:** Does "even-handedness" require actual uptake by multiple groups (Germany) or just the theoretical possibility (Sweden's system for other bodies)? Both fit, but the former is stronger. US tax exemptions are *available* to all qualifying religions but lack the *active, specific entanglement* (like tax collection) seen in European models – it's a weaker fit.
      *   **Why this term?** "Pluralized" captures the extension to multiple groups. "Entanglement" maintains focus on the state-religion linkage. It emphasizes the *transformation* of the entanglement to survive in a pluralistic/secular context.

  3.  **For Re-description as Neutral Administration:** **Administrative Commensuration**
      *   **Definition:** The process by which activities or institutions historically rooted in or dominated by a specific religion are functionally absorbed into the state's administrative, bureaucratic, or public service framework, and subsequently *framed or perceived* as neutral, secular, or cultural functions of the state or general public welfare.
      *   **Key Characteristics:**
          *   Focuses on the *reframing* or *reinterpretation* of the activity.
          *   Involves a shift in *justification*: from religious purpose to administrative efficiency, cultural heritage, universal public service, or population management.
          *   The activity often retains a historical or factual association with religion, but its *official rationale* becomes secular/administrative.
      *   **Edges & What's In/Out:**
          *   **IN:** Sweden (Burial fee as a universal public health/service charge administered locally, often practically by parishes); Germany (Church tax collection as a routine administrative service performed by the revenue office); Denmark (State support justified partly as cultural heritage/preservation); Maintenance of *historically significant* religious buildings as cultural heritage (common across Europe).
          *   **OUT:** Activities still primarily justified by religious purpose (e.g., direct state funding for active worship, theological training *unless* framed as cultural studies). Public holidays *if* officially justified solely on religious grounds (rare); they usually fall under cultural tradition/civil religion. Military chaplaincy justified as servicing soldiers' rights (a form of pluralized entanglement).
          *   **Grey Area:** Is state-funded religious education in public schools (as in Alsace-Moselle or some German states) "neutral administration" or "pluralized entanglement"? It's primarily the latter, as the *content* is religious, even if access is pluralized. The *administration* (scheduling, funding) might involve commensuration, but the core activity resists it.
      *   **Why this term?** "Administrative" anchors it in state bureaucracy/services. "Commensuration" (sociological term meaning making things measurable/comparable within a common framework) captures the act of translating the religiously-associated activity into a secular, bureaucratic, or universal public service metric.

  **Addressing Your Specific Questions:**

  *   **State upkeep of historic church buildings:** This fits **Administrative Commensuration**. The justification shifts from supporting active religion to preserving cultural heritage/history, a neutral state function. This is distinct from collecting a church tax (**Pluralized Entanglement** or **Administrative Commensuration** depending on framing) which directly funds the *ongoing religious activity* of the group(s).
  *   **Public Holiday:** This is generally **not** a form of establishment or entanglement in the institutional sense you're exploring. It falls under **Civil Religion** (if imbued with shared civic meaning) or simply **Cultural Tradition**. The state is recognizing a widespread social/cultural practice, not necessarily entangling itself administratively with religious institutions or funding their core functions. It lacks the bureaucratic/fiscal entanglement defining your three phenomena.
  *   **Most Useful Distinction:** **Formal-Institutional Divergence** is the foundational observation. **Pluralized Entanglement** and **Administrative Commensuration** are the two primary *mechanisms* explaining *how* the divergence persists, especially in contexts with formal separation or weakened establishment. All three are crucial for a nuanced understanding.
  *   **Re-filing Examples:**
      *   **France (Alsace-Moselle):** Better fits **Pluralized Entanglement** (state salaries for clergy of multiple faiths) than pure Formal-Institutional Divergence (it's a specific legal exception, not necessarily a *contradiction* of national law, which allows for it). The divergence is more between the *rhetoric* of laïcité and this local practice.
      *   **Sweden (Burial Fee):** Primarily **Administrative Commensuration**. The Formal-Institutional Divergence was sharper immediately after disestablishment but has lessened as the system normalizes. The tax collection service is **Pluralized Entanglement**.
      *   **US (Tax Exemptions/Chaplains):** Tax exemptions are a very weak form of **Pluralized Entanglement** (available to all qualifying non-profits, including religions). Chaplaincy is clearer **Pluralized Entanglement**. The core Formal-Institutional Divergence remains significant.
      *   **Denmark:** Primarily **Formal-Institutional Divergence** (Established but low participation, non-members pay). The cultural heritage argument for state support is **Administrative Commensuration**, but the core funding mechanism for the established church isn't primarily justified that way yet.

  These terms provide precise conceptual tools to analyze the complex and often counter-intuitive realities you've astutely observed, moving beyond simplistic "established vs. separated" binaries. They highlight the *how* and *why* behind the persistence of state-religion linkages even amidst secularization or formal separation.
