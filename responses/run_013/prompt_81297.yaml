answer: |-
  Here’s your toolkit, distilled:

  ### **The Rule, in One Breath**  
  "Use 50/50 only when options are symmetric under the process that determines the outcome."  

  **Full Rule (98 words):**  
  The principle of indifference ("no reason to prefer, so 50/50") applies **only** when you can identify a physical or procedural symmetry that makes outcomes genuinely interchangeable. This symmetry must govern the *mechanism* producing the uncertainty. If you lack knowledge of that mechanism—or if relabeling the options changes the probability—indifference fails. Ignorance alone isn’t symmetry. Never assume uniformity over parameters (like side length or volume) without evidence the underlying process generates them uniformly.  

  ---

  ### **Your Cases, Marked**  
  *(498 words)*  

  1.  **The Chord (1/2 gut verdict):**  
      *KEEP for your intuition, OVERTURN as "the real answer".*  
      **Why:** No single answer is "correct" without specifying the random process. Your gut prefers distance-from-center symmetry, but endpoint randomization (1/3) and midpoint randomization (1/4) are equally valid under their own symmetries. The paradox *is* that "random chord" is underspecified.  

  2.  **The Cube (Side: 1/2, Volume: 1/2 gut verdict):**  
      *OVERTURN the volume case.*  
      **Why:** Ignorance of the side length doesn’t imply it’s uniformly distributed. If the factory makes cubes with sides uniformly between 1-3cm, then P(side < 2) = 1/2. But volume scales with the *cube* of the side. Uniform side length ⇒ P(volume < 8) = P(side < 2) = 1/2. Uniform *volume* ⇒ P(volume < 8) = (8-1)/(27-1) = 7/26. Without knowing the factory’s *production symmetry* (does it sample sides or volumes uniformly?), neither answer is justified. Your gut cheats by assuming side symmetry.  

  3.  **Three Cards (2/3 gut verdict):**  
      *KEEP.*  
      **Why:** The process symmetry is clear. You shuffle the 3 cards (symmetric), then randomly reveal one face of the chosen card (symmetric). The 3 red faces are equally likely. 2 have red opposite, 1 has blue opposite. No ambiguity.  

  4.  **Stranger’s Height (Not 50/50):**  
      *KEEP.*  
      **Why:** "No information" means you must use relevant background knowledge (human height distribution). Indifference requires symmetry, but human heights aren’t symmetric around 6ft. Applying 50/50 here would ignore the real-world process generating heights.  

  5.  **Universe Duration (Not 1/2):**  
      *KEEP your rejection.*  
      **Why:** No symmetry exists between the two outcomes. The processes governing universal decay aren’t analogous to a coin flip. "Either A or not-A" is logical, but probability requires a physical basis for indifference. It’s not silly—it’s invalid without evidence of equipossible mechanisms.  

  ---

  ### **What You Must Give Up**  
  *(68 words)*  
  **Give up:**  
  - The idea that "ignorance implies uniformity" (cube volume case).  
  - Assuming *your* symmetry (distance-from-center) is "natural" in underspecified problems (the chord).  
  - Using 50/50 for binary outcomes lacking process symmetry (universe duration).  
  - Silently converting descriptions (cube side → volume) to preserve 1/2. Probability depends on the actual variable randomized by the process.  

  ---

  ### **Three New Cases**  
  *(249 words)*  

  1.  **Shuffled Deck:** Draw the top card. P(Heart) = 1/4.  
      **Verdict: 1/4.** *Keep.* Symmetry: 52 distinct cards, shuffled randomly. Suits are interchangeable.  

  2.  **Loaded Die Ignorance:** You know a die is biased but have no details. P(Rolling 6) = ?  
      **Verdict: NOT 1/6.** *Overturn indifference.* No symmetry exists—you know bias breaks it. Without knowing the biasing mechanism, no probability can be assigned. Strains the rule: you have process info (it’s a die) but insufficient symmetry info.  

  3.  **Alien Species:** A planet has exactly two species, but you know nothing else. P(Random alien is Species A) = ?  
      **Verdict: NOT 1/2.** *Overturn indifference.* Without knowing if the species have equal population sizes, or if the sampling method is symmetric, 1/2 is unjustified. Population asymmetry is the norm in biology.  

  ---

  ### **Bottom Line for the Column**  
  *(Newspaper Quote, 54 words)*  
  > "Saying ‘no reason to prefer’ doesn’t make a 50/50 guess valid. Real symmetry—like a shuffled deck or a fair coin—is what licenses it. If you don’t know *how* the uncertainty gets resolved, or if the labels hide real imbalances, indifference is a trap. Probability isn’t about our ignorance; it’s about the world’s mechanisms."  

  **For the Mathematicians:**  
  - *Frequentist:* "Indifference only with repeatable symmetry."  
  - *Bayesian:* "Indifference *is* a prior—justify its symmetry."  

  ---  
  This gives you a defensible rule, resolves your cases sharply, and provides quotable clarity. No cushions, no jargon, no reading list. Lift away.
