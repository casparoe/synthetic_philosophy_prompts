prompt: |-
  ok, long-time lurker here, first time actually trying to write my risk preferences down instead of just arguing about them in comment sections. I want to know what principle, if any, my gut is really running on, because I'm fairly sure these can't all be right at once.

  These are all one-shot choices, real money, no hedging, no repeating the bet:

  1. $5,000 for sure vs a 90% shot at $6,000 (nothing otherwise). I take the $5,000, not close.
  2. A 45% shot at $5,000 vs a 40.5% shot at $6,000. Here I take the 40.5% shot at $6,000. (This is just #1 with every probability scaled by the same factor, but my gut doesn't care.)
  3. $50 for sure vs a 90% shot at $60. I take the gamble, easy — down here I just want the bigger expected value.
  4. A 50/50 to lose $100 or win $120. I pass. And honestly I'd pass that same bet whether I was broke or loaded, it's just not a bet I want to hold. But a 50/50 to lose $100 or win $10,000, I take without thinking.
  5. A sure loss of $1,000 vs a 90% chance of losing $1,500 with a 10% chance of losing nothing. Here I take the gamble and hope.

  So I'm risk averse over gains, risk seeking over losses, I seem to care about the stakes and not just the probabilites (#1 vs #3), I treat a near-certain win differently from a middling one (#1 vs #2), and apparently I'll reject a small positive-EV bet forever while happily taking a huge positive-EV bet with the same downside (#4).

  My own half-baked guess is that I just distort probabilities in my head — a 90% shot at something good feels like basically giving up a sure thing, and small chances of loss feel bigger than they are. But that story says the stakes shouldn't matter, and #1 vs #3 says they definately do, so I don't think it survives on its own.

  Also, I half-remember an argument (from some decision theory post I can no longer find) that if you'd turn down a small favorable 50/50 like the one in #4 at every level of wealth, then expected utility forces you to also turn down a 50/50 with the same downside and a gigantic upside — which sounds obviously wrong, but I've never seen where the catch is. Is that actually right?

  What I want: the principle (or a short list of candidate principles) that gets as many of these five verdicts as possible, stated precisely enough that I can see which clause is pulling its weight for which case. Tell me what it predicts for a case I haven't listed, and be straight with me about which of my five verdicts it has to throw out, and why that's the one to give up rather than the others.
reasoning: |-
  Okay, the user is trying to understand their risk preferences based on five different betting scenarios. They're confused because their choices seem inconsistent with standard expected utility theory. Let me break down each scenario first.

  In scenario #1, they prefer a sure $5,000 over a 90% chance at $6,000. That's risk aversion for gains. But in #3, with smaller amounts, they take the 90% chance for $60 over $50 sure, which is risk-neutral. So the stakes matter here. 

  Scenario #2 shows that when probabilities are scaled down (45% vs 40.5%), they prefer the higher payoff despite lower probability. This contradicts #1 because it's the same ratio but different choices. Their gut doesn't treat near-certainty the same as moderate probabilities.

  For losses in #5, they gamble to avoid a sure loss, which is classic risk-seeking in losses. But #4 is interesting: they reject a 50/50 lose $100 or win $120 at any wealth level, but take the same downside with a huge upside. This suggests loss aversion where small losses hurt more than equivalent gains, but huge gains overcome that aversion.

  The user mentions probability distortion, but realizes stakes matter, which prospect theory accounts for with its value function. Small probabilities might be overweighted, but in their case, near-certainty (90%) feels like a sure thing, leading to risk aversion, while moderate probabilities (like 45%) don't.

  The reference to rejecting small favorable bets but accepting large ones relates to Rabin's paradox. Expected utility theory would require rejecting any finite gain if you reject small positive-EV bets consistently, which is unrealistic. The user's intuition aligns with prospect theory's reference dependence.

  Their deeper need is to find a coherent framework explaining their choices without contradictions. They want to know which principles to sacrifice. Prospect theory seems best, but they might need to accept that #4's rejection of the small bet isn't consistent with expected utility. Alternatively, cumulative prospect theory could handle probability weighting better. 

  They also need clarity on why stakes matter—probably due to diminishing sensitivity in the value function. For large amounts, the concave region makes them risk-averse, but for small amounts, it's linear. Losses are convex, so risk-seeking. 

  The user might be unaware that prospect theory allows different behaviors for gains vs losses and varying stakes. Highlighting the S-shaped value function and probability weighting could resolve their contradictions. Also, addressing Rabin's paradox by showing expected utility isn't realistic here would help. 

  In summary, prospect theory explains most cases: reference dependence for gains vs losses, diminishing sensitivity for stakes, probability weighting for near-certainty vs moderate chances. The trade-off is accepting that expected utility can't explain rejecting small favorable bets without absurd implications, which prospect theory handles naturally.
answer: |-
  Your choices reveal a clear pattern that aligns with **Prospect Theory** (specifically Kahneman & Tversky's 1979/1992 Cumulative Prospect Theory - CPT), not Expected Utility Theory (EUT). Your "gut" is using several distinct psychological principles simultaneously, explaining the apparent contradictions. Here's the breakdown:

  **Core Principles of Prospect Theory Explaining Your Choices:**

  1.  **Reference Dependence:** You evaluate outcomes as *gains* or *losses* relative to a reference point (usually your current wealth), not final wealth states. This explains the stark difference between gains (#1, #2, #3) and losses (#5).
  2.  **Loss Aversion:** Losses hurt psychologically *more* than equivalent gains feel good. The pain of losing $X is greater than the pleasure of gaining $X. This is crucial for #4.
  3.  **Diminishing Sensitivity (Value Function):**
      *   In the *gain* domain, the value function is *concave* (risk averse): The difference in subjective value between $0 and $5,000 is larger than between $5,000 and $6,000.
      *   In the *loss* domain, the value function is *convex* (risk seeking): The difference in subjective value (pain) between $0 and -$1,000 is larger than between -$1,000 and -$1,500.
      *   **Crucially, the function is steeper for losses than gains (Loss Aversion) and is *more linear for small amounts*.** This explains the stake-size effects (#1 vs #3).
  4.  **Probability Weighting:** People don't perceive probabilities linearly. They overweight small probabilities and underweight moderate to large probabilities. This explains the difference between near-certainty (#1) and moderate probabilities (#2), even when scaled.

  **Applying Prospect Theory to Your Choices:**

  1.  **$5,000 sure vs 90% $6,000: Take $5,000 (Risk Averse)**
      *   *Reference Point:* Current wealth.
      *   *Gain Domain:* Concave value function.
      *   *Probability Weighting:* 90% is high but slightly underweighted? However, the difference in *value* between $5k and $6k is small due to diminishing sensitivity. The certainty of $5k feels much better than a 10% chance of getting nothing, amplified by loss aversion applied to the *loss of the sure gain*.
      *   *Stakes:* Large enough for concavity to dominate. `V(5000) > π(0.9)*V(6000) + π(0.1)*V(0)`

  2.  **45% $5,000 vs 40.5% $6,000: Take 40.5% $6,000 (Risk Seeking for Higher EV)**
      *   *Reference Point:* Current wealth.
      *   *Gain Domain:* Concave value function.
      *   *Probability Weighting:* Moderate probabilities (45%, 40.5%) are likely underweighted similarly. The key is the *difference in expected value* is larger ($2700 vs $2430) and the concavity difference between $5k and $6k is proportionally less impactful at these probabilities. The psychological gap between a 45% chance and a 40.5% chance feels small, while the extra $1000 potential still holds some appeal. `π(0.405)*V(6000) > π(0.45)*V(5000)` (because the EV difference dominates the concavity effect here).

  3.  **$50 sure vs 90% $60: Take 90% $60 (Risk Neutral/Seeking)**
      *   *Reference Point:* Current wealth.
      *   *Gain Domain:* Concave value function, but...
      *   *Stakes:* **Very small.** Diminishing sensitivity is weak near the reference point. The value function is almost linear for small gains. `V(50) ≈ 50*k`, `V(60) ≈ 60*k`. Expected Value (90% * $60 = $54) beats $50 easily. Probability weighting might slightly underweight 90%, but not enough to overcome the linear value perception. `π(0.9)*V(60) > V(50)`

  4.  **50/50 -$100 / +$120: Pass. 50/50 -$100 / +$10,000: Take.**
      *   *Reference Point:* Current wealth.
      *   *Loss Aversion:* This is the key. -$100 hurts more than +$120 feels good. For the small bet: `V(-100) << -100*k`, `V(120) ≈ 120*k`. Even with linear weighting (π(0.5)=0.5), the calculation is `0.5*V(120) + 0.5*V(-100) < 0` because `|V(-100)| > V(120)`. The small positive EV ($10) is swamped by loss aversion.
      *   *Large Upside:* With +$10,000, the gain side dominates despite loss aversion. `V(10,000)` is large (even concave, it's huge). `|V(-100)|` is still large relative to its size, but tiny relative to `V(10,000)`. `0.5*V(10,000) + 0.5*V(-100) > 0` easily. The huge potential gain overcomes the psychological pain of the loss.
      *   *Rabin Paradox:* You've hit the nail on the head. EUT *does* force this absurdity: if you reject a small, favorable, independent bet *at all wealth levels*, EUT implies you must reject *any* bet with that loss, no matter the gain. **This is the "catch" you asked about, and it's a fatal flaw of EUT for describing real human behavior.** Prospect Theory avoids this by having the value function defined over *changes* and being kinked at zero (loss aversion). Your intuition (and PT) is correct; EUT's implication here is ridiculous.

  5.  **Sure -$1,000 vs 90% -$1,500 / 10% $0: Take the gamble (Risk Seeking)**
      *   *Reference Point:* Current wealth.
      *   *Loss Domain:* Convex value function (diminishing sensitivity to *losses*). The pain difference between -$1000 and -$1500 feels smaller than the difference between $0 and -$1000.
      *   *Probability Weighting:* 10% chance of losing nothing (a large gain relative to the sure loss reference!) might be slightly overweighted. The pain of a *sure* loss feels particularly bad.
      *   The convexity and hope of avoiding *any* loss make the gamble attractive: `π(0.9)*V(-1500) + π(0.1)*V(0) > V(-1000)`

  **The Candidate Principle:**

  **Cumulative Prospect Theory (CPT):** Decisions are made based on a value function `V(x)` that is:
  1.  Defined over *gains and losses* relative to a reference point.
  2.  Concave for gains (`V''(x) < 0` for `x > 0`), leading to risk aversion.
  3.  Convex for losses (`V''(x) > 0` for `x < 0`), leading to risk seeking.
  4.  Steeper for losses than gains (Loss Aversion: `|V(-x)| > V(x)` for `x > 0`).
  5.  Combined with a probability weighting function `π(p)` that overweights small probabilities and underweights moderate/large ones.
  6.  **Crucially, the *degree* of concavity/convexity depends on the *magnitude* of the stakes relative to the reference point. The function is steeper (more sensitive) near the reference point and flattens as gains/losses get larger.** This explains why small-stakes choices (#3) look risk-neutral while large-stakes choices (#1) look risk-averse for gains.

  **Prediction for a New Case:**

  *   **Scenario:** A 10% chance to win $15,000 vs a 11% chance to win $14,000.
  *   **CPT Prediction:** You likely take the **11% $14,000**.
      *   *Why:* The stakes are large (similar to #1). The value function is concave: the difference between $14k and $15k is small. The psychological difference between a 10% and 11% chance is also likely perceived as small (both are "long shots", probability weighting might slightly overweight both similarly). The higher probability of winning *something* ($14k) feels more attractive than the slightly smaller chance of a marginally larger prize ($15k). `π(0.11)*V(14000) > π(0.10)*V(15000)`.

  **What CPT Gets Right and What It Might Force You to Reconsider:**

  *   **Gets Right:** #1 (Risk Aversion Large Gains), #3 (Risk Neutrality/Small Gains), #4 (Loss Aversion overcomes small EV+, Large EV+ overcomes Loss Aversion), #5 (Risk Seeking Losses). It perfectly explains the stake-size effect (#1 vs #3) and the difference between near-certainty and moderate probability (#1 vs #2).
  *   **Gets Mostly Right:** #2 (Risk Seeking for Higher EV at Moderate Prob). CPT *can* explain this with the combination of probability weighting and concavity, as described above. It's a natural consequence of how the weighting and value functions interact at different probability/outcome levels.
  *   **The Trade-off:** CPT doesn't force you to reject any of your specific choices. It provides a coherent framework for all of them. **The real trade-off is theoretical/behavioral:** You must accept that your preferences violate the core axioms of Expected Utility Theory (like independence and description invariance in strict terms). EUT cannot explain your pattern without absurd implications (like the Rabin Paradox you mentioned). Prospect Theory embraces these "irrationalities" as systematic features of human cognition.

  **Why Give Up EUT (Specifically its Implications)?**

  The Rabin Paradox highlights the fundamental incompatibility of your preferences (rejecting small favorable 50/50s universally) with EUT. EUT's requirement of global concavity (risk aversion everywhere) to explain rejecting the small bet forces absurd levels of risk aversion (rejecting huge positive EV bets). Since your choice in #4 (taking the huge +$10,000 bet) is clearly sensible, this means **EUT cannot accurately describe your preferences across all stakes.** It fails catastrophically on the small-stakes risk aversion you exhibit combined with large-stakes risk neutrality/seeking. Prospect Theory was explicitly designed to resolve this paradox and explain the pattern you exhibit.

  **Conclusion:**

  Your gut is running on **Prospect Theory**. The core principles of reference dependence, loss aversion, diminishing sensitivity (with a concave gain / convex loss value function), and probability weighting, combined with the crucial insight that sensitivity is strongest near the reference point (explaining stake-size effects), capture *all* of your choices coherently. The principle you need to explicitly give up is the idea that your preferences conform to the axioms of **Expected Utility Theory**, particularly because of the Rabin Paradox implication that your rejection of the small 50/50 bet would force you to also reject the large one, which you correctly find absurd. Prospect Theory provides the descriptive accuracy your intuition demands.
