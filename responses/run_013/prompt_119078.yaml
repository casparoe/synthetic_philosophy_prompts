  However, this is not correct. The credal set represents a set of possible probability distributions. The lower and upper probabilities are not just the range of the probabilities under the set of distributions; they are used to make decisions that are robust to the uncertainty. In particular, if we replace the credal set by the single distribution P_{1/2}, then we lose the imprecision that was present in the original representation.

