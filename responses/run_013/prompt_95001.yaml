  The Psychopath Button connection is crucial. In that case, CDT says don't push the button because it causes psychopathy, even though conditional on pushing, you're not a psychopath. But committing doesn't resolve it. Contrast with Death in Damascus where committing might be a solution. The guest needs to explain why committing works in one but not the other.

