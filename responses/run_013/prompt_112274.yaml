answer: |-
  ## BUREAU OF PREFERENCE INTEGRITY
  ### Guidance on Cyclical Preference Exploitation (CPE) Compliance
  **Document:** BPI-G-107 Rev. 3
  **Effective Date:** October 26, 2023
  **Supersedes:** BPI-G-107 Rev. 2 (March 15, 2022)
  **Related:** BPI-R-14 (Definitions); BPI-F-9 (CPE Disclosure Form); *In re: ValuePlus Grocers*, BPI Op. No. 22-45 (Precedent)

  **1. Purpose and Scope.** This guidance clarifies the Bureau’s enforcement stance regarding Commercial Preference Exploitation (CPE), specifically the monetization of customer preference cycles, under the Preference Integrity Act (PIA), 12 U.S.C. § 5501 et seq. It applies to all entities engaged in retail transactions where sequential trades may exploit demonstrable cycles or time-inconsistent preferences.

  **2. Defining the Exploitative Sequence (The "Pump").** A CPE sequence occurs when a series of individual trades, each assented to by the customer *at the time of offer*, results in a net loss for the customer while returning them to their original asset position or a subjectively inferior one. Key elements:
      *   **2.1 Cycle Requirement:** The sequence must demonstrably form a cycle (e.g., Trade A->B->C->A).
      *   **2.2 Net Detriment:** The cumulative cost to the customer must exceed any cumulative benefit, assessed from the *initial pre-cycle state*.
      *   **2.3 Individual Assent:** Each trade must be individually acceptable to the customer *at the moment of transaction*, per their expressed or revealed preference at that time. The sequence *itself* constitutes the violation, not the individual trades. (See *In re: ValuePlus Grocers*).

  **3. Temporal Preference Categories & Regulatory Treatment.** Customers exhibit varying awareness of future preference shifts. Retailers must classify interactions per BPI-R-14 § 5(d) and apply corresponding safeguards:
      *   **3.1 Category T1 (Naïve):** Customer exhibits inconsistent preferences but *does not anticipate* the future shift. *Retailer Duty:* Mandatory pre-transaction disclosure (Form BPI-F-9) of potential cycle completion costs *before the first trade in any sequence identifiable as cyclical*. Cooling-off period (minimum 24 hours) required *between* trades potentially forming a cycle.
      *   **3.2 Category T2 (Aware but Unresolved):** Customer anticipates the future preference shift but takes *no binding action* to prevent acting on it later. *Retailer Duty:* Offer of a Bureau-approved Commitment Device (CD) *before the first trade*. If CD refused, proceed under T1 rules. If CD accepted, subsequent trades contravening the CD are voidable by the customer.
      *   **3.3 Category T3 (Resolved):** Customer anticipates the shift and has *adopted a binding plan* (e.g., pre-commitment, delegation, rule) preventing action on the future preference. *Retailer Duty:* Verify and record the resolution mechanism (e.g., signed CD contract). Trades contravening the verified resolution are presumptively exploitative and prohibited. No cooling-off period required between compliant trades.

  **4. Compliant Countermeasures (Price Schedules & Equivalents).** Retailers may implement structural barriers to CPE. The Bureau treats the following as functionally identical compliance instruments:
      *   **4.1 Commitment Devices (CDs):** Binding contracts restricting future choice sets (e.g., locking in a price, forfeiting a deposit for reversal). Must be Bureau-approved for clarity and enforceability.
      *   **4.2 Cooling-Off Periods:** Mandatory waiting periods between trades within a potential cycle, disrupting the "pump" momentum.
      *   **4.3 Reversal Pricing Schedules:** Explicit fees charged *specifically* for undoing a prior trade within a short timeframe (e.g., loyalty status downgrade fee, trade-in cancellation fee). The fee must be prominently disclosed *before the initial commitment trade* and must be calibrated to negate the profitability of the potential cycle for the retailer. *Example: Premium Tier Loyalty Program.* A customer pays $10 to upgrade from Silver (T1) to Gold (T2). The program rules, disclosed *before upgrade*, state: Downgrading from Gold back to Silver within 30 days costs $15. The $15 fee makes the cycle (Stay Silver -> Pay $10 -> Become Gold -> Pay $15 -> Become Silver) a net loss *for the retailer* ($10 in, $15 out). This compliant schedule prevents exploitation by pricing the reversal out of profitability.

  **5. The Non-Completing Customer.** A customer who initiates a potential CPE sequence (e.g., Trade A->B) but refuses the final trade completing the cycle (e.g., Trade B->A or B->C->A) does *not* trigger CPE violation, even if the initial trades were profitable for the retailer. The sequence remains incomplete. Classification (T1, T2, T3) still applies to the trades conducted.

  **6. Incomplete Preferences ("Gappy" Customers).** Customers exhibiting preference gaps (no strict ranking between some options) but *no demonstrable cycle* fall outside CPE regulation per BPI-G-107 § 1.3(a). They are not members of the protected class defined by cyclicality or time-inconsistency. Retailers retain standard obligations regarding fair dealing and disclosure applicable to all customers.

  **7. Protecting the Temporal Self.** The Bureau recognizes the inherent conflict between the preferences of a customer at Time 1 (T1) and at Time 2 (T2). The PIA authorizes the Bureau to protect the *planning self* – the agent formulating intentions over time (per PIA § 5502(c): "preference stability across relevant time horizons"). Therefore:
      *   **7.1 Authority:** Protection prioritizes the T1 self's plan or resolution (especially T3) over the T2 self's momentary preference, *when inconsistent*. The Bureau acts as the enforcement mechanism for the customer's own prior resolution.
      *   **7.2 Justification:** Exploitation occurs when a retailer knowingly profits from the *internal conflict* preventing the customer from maintaining a stable plan. Compliance measures (CDs, reversal fees) empower the planning self.
      *   **7.3 Incomplete Cycles & Endpoint Harm:** Where a sequence of individually acceptable increments leads to an endpoint the T1 self would reject (e.g., accumulating small fees leading to large debt), intervention focuses on the *endpoint transaction* if it violates a prior resolution (T3) or exploits demonstrable naivete (T1) about the cumulative path. Retailers must provide clear running totals or cumulative impact statements upon request for potentially additive sequences.

  **8. Recordkeeping & Filing.** Retailers must maintain records sufficient to demonstrate compliance with categorization (T1/T2/T3), application of appropriate safeguards (CD offer/acceptance, cooling-off application, reversal fee disclosure), and the rationale for any reversal fee schedule. Suspected CPE incidents must be reported quarterly via the BPI Portal using Schedule CPE-1.

  **Issued by:**  
  Helena Vance, Director  
  Bureau of Preference Integrity

  ---

  **Instructor's Note on Underlying Premises:**

  The satire leans heavily on premises contested in decision theory. First, it assumes vulnerability to money pumps *inherently* reveals irrationality ("defective preferences"), rather than merely an exploitable inconsistency given a motivated counterparty. Critics (e.g., McClennen, Levi) argue rationality concerns coherence of choice *given beliefs and desires*, not immunity to exploitation. If exploitation requires a malicious actor, the pump might show opportunism, not irrationality. The satire would collapse if this view held – regulation preventing exploitation wouldn't imply the *preference itself* was flawed.

  Second, it assumes the regulator can legitimately privilege one temporal self (the planner) over another (the moment-to-moment actor) as the "true" preference holder. Philosophers (e.g., Bratman) defend plans, while others (e.g., Nozick) question overriding current desires. If the current self's preference is sovereign, the paternalism is stark.

  My view: Vulnerability to a pump signals potential incoherence in the preference structure, a practical defect making the agent *predictably* worse off by their *own* shifting lights. It's not *merely* an opportunity for others; it reveals instability the agent might wish to correct. However, it's not *decisive* proof of irrationality. Proof that stable, non-transitive preferences could be rationally held (e.g., under resource constraints or context-dependence not captured by the model) or that "exploitation" requires implausible counterfactual trades would weaken this. The weakest point is equating vulnerability to hypothetical exploitation with actual practical detriment – a real agent might simply refuse the final trade.
