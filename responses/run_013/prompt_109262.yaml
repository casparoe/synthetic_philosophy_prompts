  2. **Test of Expected Log Wealth (Kelly Criterion):** The theory must prescribe maximizing the expected logarithm of wealth at each step (or equivalently, the growth rate). This is a central requirement because in repeated multiplicative bets, the Kelly criterion maximizes the long-run growth rate. The failure mode is that without this, the strategy might not maximize the asymptotic growth rate.

  3. **Test of Finite Horizon Consistency:** The theory must provide prescriptions for finite horizons and one-shot bets that are consistent with the long-run prescription in the limit. Specifically, for a finite horizon T, the optimal strategy should approach the Kelly strategy as T becomes large. The consideration is that real betting occurs over finite periods. Failure would mean the theory is not applicable to real-world finite bets.

  4. **Test of Ruin Avoidance:** The theory must naturally avoid almost sure ruin (i.e., the probability of ruin should go to zero as time goes on, or at least be minimized). This is because in repeated betting, risking total loss (or near-ruin) in a single bet can lead to irreversible loss. The failure mode is that without this, the theory might allow strategies that risk ruin with positive probability.

  5. **Test of Robustness to Probability Estimation:** The theory must be robust to the use of estimated probabilities instead of true probabilities. That is, the strategy should perform reasonably well when the probabilities are not known exactly. The consideration is that in practice, probabilities are often estimated. The failure mode is that without robustness, the strategy might be highly sensitive to estimation errors, leading to poor performance.

