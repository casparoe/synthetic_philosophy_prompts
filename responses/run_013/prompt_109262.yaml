  ### Specification for a Theory of Rational Betting Under Repeated Multiplicative Risk

  Adequate theories must pass the following tests, derived from core considerations of rational betting in multiplicative settings. Each test is stated as a requirement, with the underlying case or consideration and the failure mode it rules out. Requirements are classified as:
  - **Non-negotiable (NN)**: Fixes the subject matter; failure means it is not a theory of rational betting under repeated multiplicative risk.
  - **Camp-specific (CS)**: Specific to a camp (e.g., growth-rate maximizers vs. expected utility theorists); not mandatory for all approaches.
  - **Load-bearing (LB)**: Dropping it changes which strategies are admissible.
  - **Constraint**: Limits outputs without defining the subject matter.

  #### Requirements
  1. **Asymptotic Growth Dominance Test**  
     - *Requirement*: The theory must prescribe strategies that, with probability approaching 1 as the number of trials increases, yield wealth greater than that from any other strategy not equivalent to it.  
     - *Case/Consideration*: Repeated multiplicative bets amplify small growth differences; the long-run outcome is dominated by the growth rate.  
     - *Failure Mode*: Allows strategies that are arbitrarily dominated in the long run.  
     - *Classification*: NN, LB. Without this, the theory fails to address the defining feature of repeated multiplicative growth.

  2. **Growth Rate Maximization Test**  
     - *Requirement*: The theory must prescribe maximizing the asymptotic growth rate of wealth and specify whether this coincides with maximizing expected wealth or provide a justification for divergence.  
     - *Case/Consideration*: Central tension in multiplicative settings (e.g., Kelly vs. expected wealth maximization); distinguishes growth-optimal strategies from alternatives.  
     - *Failure Mode*: Fails to resolve whether expected wealth or growth rate is the objective, leading to incoherent prescriptions.  
     - *Classification*: NN, LB. Dropping it allows strategies that sacrifice long-run growth for short-term gains.

  3. **Probability Robustness Test**  
     - *Requirement*: The theory must deliver prescriptions that are robust to the use of estimated probabilities (not just known probabilities), without relying on external adjustments.  
     - *Case/Consideration*: Probabilities are often estimated in real-world betting (e.g., from data or models); prescriptions must not be brittle under uncertainty.  
     - *Failure Mode*: Strategies that are optimal under known probabilities but catastrophically degrade under slight estimation errors.  
     - *Classification*: Constraint, LB, CS (for some camps). Robustness is not inherent to the subject matter but is essential for real-world applicability.

  4. **Utility Coherence Test**  
     - *Requirement*: The theory must either (a) be a special case of expected utility maximization with a justified choice of utility function (e.g., logarithmic), or (b) explain why it is a rival framework.  
     - *Case/Consideration*: Debate over whether growth-rate maximization is derivative or fundamental; arbitrariness of log utility if not justified by the multiplicative setting.  
     - *Failure Mode*: Appears ad hoc if log utility is assumed without justification, or unmoored from decision theory if it rejects utility.  
     - *Classification*: NN, CS (camps differ on utility foundations), LB. Choice of utility function affects admissibility.

  5. **Ruin Avoidance Test**  
     - *Requirement*: The theory must ensure that the probability of ruin (wealth ≤ 0) is 0 at all times, without external constraints. Near-ruin (wealth below a positive threshold) must be addressed, either by minimizing its probability or justifying its acceptability.  
     - *Case/Consideration*: Ruin is irreversible; near-ruin impairs future opportunities (e.g., inability to place bets).  
     - *Failure Mode*: Strategies that risk total loss or frequent near-ruin for higher growth.  
     - *Classification*: NN, LB. Dropping it permits strategies that are intolerably risky.

  6. **Finite Horizon Consistency Test**  
     - *Requirement*: For finite or one-shot bets, prescriptions must approach the long-run strategy as the horizon extends, and provide non-arbitrary prescriptions when the horizon is short.  
     - *Case/Consideration*: Real-world betting has finite rounds; long-run asymptotics may not apply directly.  
     - *Failure Mode*: Inapplicable to common scenarios (e.g., retirement investing) or inconsistent across horizons.  
     - *Classification*: NN, LB. Affects admissibility in finite cases.

  7. **Non-Fungibility Test (Case a)**  
     - *Requirement*: The theory must handle non-fungible assets (e.g., attention, social standing) where gains and losses are not additive across periods and differ in kind.  
     - *Case/Consideration*: Agents with non-monetary holdings; multiplicative risks may apply per-period but not aggregate linearly.  
     - *Failure Mode*: Limited to monetary bets, ignoring qualitative differences in outcomes.  
     - *Classification*: NN, LB. Essential for generality; changes admissible strategies by introducing non-linear interactions.

  8. **Fixed Stakes Test (Case b)**  
     - *Requirement*: The theory must prescribe whether to accept or decline a bet with exogenously fixed stakes (no choice of fraction), and justify how this aligns with its core criterion.  
     - *Case/Consideration*: Many real bets (e.g., insurance, casino games) have fixed sizes set by counterparties.  
     - *Failure Mode*: Only handles variable-stake bets, ignoring common constraints.  
     - *Classification*: NN, LB. Affects admissibility by forcing binary choices.

  9. **Decaying Outside Option Test (Case c)**  
     - *Requirement*: The theory must account for an outside option with negative drift (e.g., an asset that depreciates), not just a fixed reserve.  
     - *Case/Consideration*: Alternatives to betting may carry inherent risks (e.g., inflation eroding cash).  
     - *Failure Mode*: Overlooks drift in non-betting options, distorting risk assessments.  
     - *Classification*: NN, LB. Changes admissibility by altering opportunity costs.

  #### Conflicts and Surrenders
  - **Conflict**: *Growth Rate Maximization Test* (Requirement 2) and *Ruin Avoidance Test* (Requirement 5) in the context of *Fixed Stakes Test* (Requirement 8).  
    - **Why**: When stakes are fixed and large relative to wealth, growth-rate maximization (e.g., Kelly) may accept bets with positive expected log-wealth but high near-ruin risk (e.g., 10% chance of losing 99% of wealth). Ruin avoidance demands rejecting such bets, but this sacrifices growth.  
    - **Surrender**: Strict *Ruin Avoidance Test* for near-ruin. We retain avoidance of ruin (wealth ≤ 0) as NN but accept that near-ruin may be necessary for growth under fixed stakes. This preserves growth dominance while acknowledging that recovery from near-ruin is possible.  
  - **Resolution**: Requirement 5 is relaxed to: "Ensure ruin (wealth ≤ 0) is impossible; minimize near-ruin probability where feasible without sacrificing growth." This avoids total loss but tolerates wealth dips for growth.

  - **Other Conflicts**: *Non-Fungibility Test* (Requirement 7) conflicts with *Growth Rate Maximization Test* (Requirement 2) for non-fungible assets. Growth rate is ill-defined when gains/losses differ in kind (e.g., attention vs. money). Utility coherence (Requirement 4) resolves this by mapping non-fungible outcomes to a utility scale, making growth-rate maximization feasible.

  #### Satisfiability and Key Exclusionary Requirement
  The full set is jointly satisfiable via a utility-theoretic approach (e.g., log-utility as a special case of expected utility maximization), with adjustments for robustness and edge cases. The most exclusionary requirement is the **Non-Fungibility Test (Requirement 7)**, as it forces the theory to unify multiplicative risks across qualitatively distinct outcomes, which many candidates (e.g., pure Kelly) cannot handle without ad hoc adjustments.

  \answer{yes}{Non-Fungibility Test}
