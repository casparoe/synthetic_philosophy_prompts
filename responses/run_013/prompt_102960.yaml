prompt: |-
  Since retiring from the bench I have been teaching myself philosophy of science, and I have built an argument that I now distrust because it seems to prove far more than I am willing to accept. I would like you to locate the step that fails, explain why it looked convincing, and tell me what it costs to give it up.

  I had been reading about the view — associated with Milton Friedman, as I understand it — that a theory's assumptions need not be realistic, and that the only thing that counts in appraising it is how accurately it predicts. I tried to work out what that commits one to, and got this:

  (1) A scientific theory is to be assessed solely by the accuracy of the predictions it yields; whether its assumptions are realistic is irrelevant to that assessment.
  (2) The ideal gas law assumes that molecules are point masses exerting no forces on one another. That assumption is false, yet the law predicts the behaviour of dilute gases accurately. So by (1) it is a good theory.
  (3) Let T be any theory whose assumptions are false but whose predictions in its domain are accurate, and let A be any further falsehood that plays no role whatever in deriving those predictions — say, that the gas molecules are guided by benevolent spirits.
  (4) The theory T+A, formed by adding A to T, yields exactly the same predictions as T.
  (5) Therefore, by (1), T+A is exactly as good a theory as T.
  (6) Since this can be repeated with any idle falsehood at all, no amount of added falsehood can lower a theory's scientific merit, so long as the predictions are left untouched.
  (7) It follows that there is no scientific difference between a fruitful idealization, which is false, and a superstition, which is false and idle; wherever the predictions agree, the two are on a par.
  (8) But that cannot be right — it would make the whole practice of model-building, in which we argue over which idealizations are legitimate and which distort, an empty exercise.
  (9) Hence (1) is false.

  I would sooner keep (2), which I believe, than (7), which I find absurd. Tell me which premise or step to reject, why it looked so reasonable, and what I am paying if I reject it — and, if you think the chain is sound and I must simply choose which plausible claim to surrender, say so and price the options.
reasoning: |-
  Okay, let me start by understanding the judge's argument. He's built a logical chain starting from Friedman's instrumentalism—that theories should be judged only by predictive accuracy, not realistic assumptions. He uses the ideal gas law as an example: false assumptions but accurate predictions, so by (1) it's a good theory. Then he adds an arbitrary falsehood like benevolent spirits guiding molecules. Since adding this doesn't change predictions, T+A is equally good. This leads to absurdity where any idle falsehood is acceptable, equating idealizations with superstitions. He rejects this conclusion, so (1) must be false.

  Hmm. The key step is (4) and (5). The judge assumes that adding A to T doesn't affect predictions, so T and T+A are predictively equivalent. But is that really true? Let me think about what makes a scientific theory. Theories aren't just random sets of statements; they have structures. Adding an arbitrary falsehood might not change predictions directly, but it could make the theory inconsistent or introduce contradictions that affect derivations. For example, if T includes "molecules are point masses" and A is "molecules are guided by spirits," these might conflict. Spirits could imply intentionality, which contradicts inert point masses. Even if not directly, such additions can create internal inconsistencies. So T+A might not be coherent enough to even make the same predictions.

  Wait, but the judge specifies that A plays no role in deriving predictions. So technically, if A is isolated, predictions remain the same. But here's the problem: scientific theories need to be consistent to be usable. If you add a falsehood that conflicts with T, even if not used in derivations, it could make the theory logically inconsistent. Inconsistent theories can imply anything, including wrong predictions. So T+A might become useless because it's contradictory. That violates (4)'s claim that predictions are unchanged.

  The judge might object that A is chosen to not conflict, like "benevolent spirits" not affecting physical laws. But how do we know spirits don't interfere? If A is truly irrelevant, it's harmless, but then why add it? The issue is that in science, we value parsimony. Adding unnecessary elements makes the theory worse, even if predictions are the same. Friedman's (1) doesn't account for simplicity or explanatory power.

  Looking at step (5), it says T and T+A are equally good by (1). But (1) only cares about predictive accuracy. If they have the same predictions, (1) says they're equal. The problem is that (1) is too narrow. Scientific theories are judged on more than predictions—explanatory power, coherence, fruitfulness for further research. The ideal gas law is useful because it approximates reality and can be refined. Adding spirits doesn't help; it might hinder progress. So rejecting (1) means accepting that science values more than just predictions.

  The judge is attached to (2) about the ideal gas law being a good theory despite false assumptions. Giving up (1) doesn't harm this; we can still value such models for their predictive utility without equating them with superstitions. The cost is abandoning strict instrumentalism, which might appeal to simplicity but fails to capture scientific practice. Scientists do care about assumptions; they guide model refinement. For example, van der Waals improved the gas law by considering molecular size and forces, showing how unrealistic assumptions can be stepping stones.

  The step that fails is (5) because it ignores that adding idle falsehoods can make the theory worse in non-predictive ways. It looked convincing because if A doesn't affect derivations, predictions stay the same. But scientifically, theories with unnecessary elements are less good. Rejecting (5) means accepting that predictive accuracy isn't the sole criterion; simplicity and explanatory power matter. The cost is complicating theory assessment, but it aligns with how science actually progresses.
answer: |-
  Your argument is a sharp and insightful reductio ad absurdum against strict instrumentalism (premise 1). The flaw lies in **step (5)**, which incorrectly concludes that T and T+A are "exactly as good" scientifically *solely* because they share predictive accuracy. While step (4) is technically correct (adding an idle falsehood doesn't alter the *existing* predictions), step (5) ignores crucial dimensions of scientific theory assessment that go beyond mere predictive success. Premise (1) is too narrow to capture actual scientific practice, and rejecting it allows you to preserve your intuition that (7) is absurd while keeping (2) intact.

  ### Why Step (5) Fails
  Step (5) assumes that "scientific merit" is *exhausted* by predictive accuracy (per premise 1). But scientific theories are evaluated on multiple grounds beyond prediction:
  1. **Explanatory power**: A good theory doesn’t just predict; it explains *why* phenomena occur. The ideal gas law, while idealized, is grounded in a mechanistic understanding of molecular motion (kinetic theory). Adding "benevolent spirits" (A) adds no explanatory value—it’s an arbitrary, untestable appendage that doesn’t deepen understanding.
  2. **Parsimony (Ockham’s Razor)**: Science prioritizes theories that avoid unnecessary complexity. T+A is less parsimonious than T because it adds a superfluous entity (spirits) without improving predictions. Even if predictions are identical, T is scientifically superior because it achieves the same results with fewer assumptions.
  3. **Internal consistency and coherence**: T+A may introduce logical inconsistencies with established knowledge. For example, "benevolent spirits guiding molecules" conflicts with the physicalist framework of chemistry. While this doesn’t affect T’s *specific* gas-law predictions, it undermines T+A’s compatibility with broader scientific principles (e.g., conservation laws).
  4. **Fruitfulness for further research**: A good theory guides new discoveries. The ideal gas law’s "unrealistic" assumptions (point masses, no forces) aren’t idle—they signal *where the model breaks down* (e.g., high pressure), prompting refinements like the van der Waals equation. Adding "spirits" offers no such guidance; it’s a dead end.

  **Why it looked convincing**: Step (5) relies on a literal interpretation of premise (1). If predictive accuracy is truly the *only* criterion (as Friedman’s instrumentalism suggests), then T and T+A *are* equivalent. This exposes premise (1) as the root problem—it reduces science to a prediction machine, ignoring how scientists actually compare theories.

  ### What It Costs to Reject Premise (1)
  By rejecting (1), you surrender a rigid, prediction-only view of science (instrumentalism). The costs are:
  1. **Loss of simplicity**: Instrumentalism offers a clean, quantitative criterion for theory choice (predictive accuracy). Rejecting it means embracing a messier, multi-dimensional standard (explanation, parsimony, coherence, etc.).
  2. **Increased ambiguity**: Without a single metric, debates over "scientific merit" become more nuanced (e.g., how much weight to give parsimony vs. explanatory depth?).
  3. **Reconciliation with scientific practice**: This is a *benefit*, not a cost. Scientists routinely reject theories with accurate predictions if they lack explanatory power (e.g., Ptolemaic epicycles predicted planetary motion but were abandoned for Kepler’s ellipses). Retaining (1) forces you to accept absurdities like (7).

  ### Your Options, Priced
  - **Option 1: Reject premise (1)** → **Cost: Low**. You keep (2) and avoid (7). This aligns with how science works (e.g., the ideal gas law is valued for its explanatory *and* predictive role). You pay with slightly fuzzier criteria for theory assessment, but this reflects reality.
  - **Option 2: Reject step (7) and accept the absurdity** → **Cost: Catastrophic**. You must concede that adding "benevolent spirits" to the ideal gas law is scientifically harmless. This destroys any distinction between science and pseudoscience (e.g., astrology with accurate ephemeris tables would be "as good" as astronomy). Model-building becomes pointless, as you note in (8).
  - **Option 3: Reject (2)** → **Cost: Unwarranted**. The ideal gas law *is* a good theory despite unrealistic assumptions. Abandoning this ignores the history of science, where idealizations (e.g., frictionless planes) are indispensable tools.

  ### Conclusion
  The chain is *logically valid* but *scientifically unsound* because premise (1) is false. **Reject premise (1)**. Step (5) fails because predictive accuracy isn’t the sole measure of scientific merit—it’s necessary but not sufficient. By giving up instrumentalism, you lose a simplistic philosophy but gain a view that respects science’s commitment to explanation, parsimony, and progress. The cost is modest: you must accept that theory appraisal is holistic, but this is a price scientists pay daily. Your intuition is correct—(7) *is* absurd, and rejecting (1) saves you from it without sacrificing the legitimacy of idealized models like the ideal gas law. 

  As Karl Popper might argue, science isn’t just about predicting; it’s about *explaining* in ways that open doors to deeper inquiry. Friedman’s view, while provocative, can’t capture that.
