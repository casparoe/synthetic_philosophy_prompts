  I consider how to structure the analysis. The experimenter has three layers: 1) raw data (the speech act), 2) the belief attributed to the left hemisphere, and 3) the experimenter's privileged knowledge of the actual stimulus. Heterophenomenology excels at handling the first two neutrally but stumbles when the "single narrator" assumption cracks. 

  The user's deeper ask becomes clear—they want epistemological honesty about the method's limits. I must resist forcing coherence where there's irreducible duality. The key is distinguishing what heterophenomenology can absorb (multiple belief streams) versus what breaks it (indeterminate narrative ownership). 

