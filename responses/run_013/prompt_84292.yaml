  ## Commencement Address: Of Seedlings, Warped Wood, and Enduring Trust  

  **Graduates of the Class of [Year], esteemed faculty, cherished families, and friends:**  

  For fifty years, this school has stood on a singular principle: *trust*. Trust in you. Trust in the idea that learning flourishes best when honor isn’t policed, but chosen. No proctored exams. Open dormitories. An honor code held in the hands and hearts of students. It was a living testament to a belief in human potential. Until this spring. This spring, the faculty voted—after deep, difficult deliberation—to proctor final examinations. Everything else remains untouched by supervision, resting on the same bedrock of trust we’ve always relied upon.  

  This change hangs in the air today. We cannot ignore it. Nor should we. For it forces us to ask a fundamental question about ourselves, one debated for millennia: **What is the nature of our humanity?**  

  Centuries ago in China, two profound thinkers, Mencius and Xunzi, offered starkly different visions. **Mencius** saw human nature as inherently good, like a seedling naturally growing straight towards the sun when given clear ground and nourishing soil. Remove the rocks, tend the garden, and virtue blossoms. Trust is the water that allows the seedling to thrive. **Xunzi**, observing a world often harsh and flawed, argued human nature is like warped wood. Left alone, it grows crooked. It requires the steamer’s heat, the press’s force—structure, discipline, boundaries—to be made straight and useful.  

  It would be easy, perhaps tempting, to look at this faculty vote and declare, "See? Xunzi was right. The wood is warped. We must clamp down." But that is too simple. And, graduates, it would be an insult to you, sitting before me today after living our honor code, embodying that trust for years.  

  **So what *does* this vote commit us to?** It does not declare you untrustworthy. It does not uproot the seedling we’ve nurtured together. Instead, it acknowledges a specific, heightened pressure point: **the solitary, high-stakes moment.** The final exam, where the weight of a grade, the perception of future opportunity, and the sheer isolation of the task can create a unique crucible. This vote says that in *this* specific context, under *this* intense pressure, we recognize that the invisible scaffold of pure trust *might* feel insufficient—not because you are inherently flawed, but because the situation is inherently fraught.  

  **Why the asymmetry?** Why proctor exams but leave everything else—dorm life, daily assignments, library use—to the honor system? Because community thrives differently in different spaces. The dorm is shared life, governed by mutual respect and visible accountability to peers. The library is a shared sanctuary of learning. Daily work unfolds in dialogue with teachers and classmates. The final exam, however, is often solitary, silent, and summative. It exists in a different psychological space. The faculty vote isn’t a blanket indictment; it’s a calibrated response to a specific vulnerability within an otherwise healthy ecosystem of trust. It’s less about doubting your character, and more about acknowledging the immense gravitational pull of that particular moment.  

  **So, which philosopher is the school following now?** Truthfully, we are navigating the tension between them. Our core ethos, the soil we’ve cultivated for half a century—the open dorms, the unproctored daily work, the very air of mutual respect—remains profoundly **Mencian**. We believe in your fundamental decency, your capacity for self-governance, your desire to grow straight. That belief hasn’t vanished; it’s the foundation upon which everything else rests, including this graduating class.  

  But the decision to proctor finals? That is a moment of **Xunzian pragmatism**. It is an acknowledgment that even the strongest seedling might tremble in a sudden, violent storm. It is applying a specific, localized structure—not to crush the spirit, but to protect the integrity of the assessment *process* in its most extreme form, ensuring fairness for all under that unique pressure. It’s less "steaming the wood straight," and more "bracing the sapling against a particularly fierce wind."  

  Graduates, you leave a school forever changed by this debate, yet fundamentally unchanged in its belief in *you*. The single sentence I hope you remember is this: **"Integrity is not a test you pass once; it is the soil you choose to grow in, every day."** Our soil is still rich with trust. We added one support beam, not a cage.  

  This isn’t a rousing end about limitless horizons. It’s a quieter truth: Life will test your integrity in countless ways, often in moments of isolation or pressure. Sometimes the structures around you will feel supportive; sometimes they may feel stifling. Sometimes you will feel like the effortlessly straight seedling; sometimes you will feel the warp in the wood. The enduring challenge, the true measure, is this: **To tend your own garden with care, even when the wind howls. To choose the straight grain, even when no one is watching.**  

  You have learned to grow in this soil. Go now, and plant yourselves well. Thank you.
