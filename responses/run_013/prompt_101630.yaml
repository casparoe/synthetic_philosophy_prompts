  I've got a bit of money to fund two postdocs for a year on the foundations of Maxwell's demon — pure theory and philosophy, no lab work. Everyone tells me the demon is dead: Landauer erasure and measurement costs cancel whatever it would save, done. But I have a nagging feeling that's only the boring version and the live stuff has drifted elsewhere. If you had two smart people for a year, which two or three open conceptual questions would you actually put them on, and in what order? I'm less intrested in the list than the reasoning: which questions are upstream of which, which ones a physics-trained person with no lab could really move, and what would make you demote one. And push back if I'm wrong that it's settled — is there a real open version where the demon never erases, or where the accounting changes once you go quantum, or where the quantity that matters isn't the gas's entropy at all but the correlations between demon and gas? Finally, is any of this worth caring about outside the second law — reversible computing, the thermodynamics of learning, black holes — or is that all hype?
