  Next, a non-arbitrary bridge principle. This connects different utility scales to a common moral scale. Egalitarian or prioritarian principles exist, but they're normative choices without consensus. So this seems contentious. Assigning 40% because there's no agreed-upon method.

  Then, even with a bridge principle, is the comparison invariant? The pain reduction might be more linear, while depression recovery could have different scaling. Given the specific states, maybe 60% chance they scale similarly, but it's speculative.

  Is well-being the correct focus? Preference satisfaction or objective goods might be alternatives. Health policy often uses well-being, but philosophers debate this. Say 80% for well-being, as it's a common framework.

  Finally, whether such comparisons can guide policy. The class might be too sparse. But in practice, DALYs and QALYs are used, so perhaps 70% here.

  Multiplying these: 0.7 * 0.4 * 0.6 * 0.8 * 0.7 = 0.094, about 9.4%. The final credence is 9%, most sensitive to the bridge principle existence (40%). Arguments for a privileged principle, like Harsanyi's theorem, could raise this, but critics like Sen challenge it. If a consensus emerged, this probability could increase, significantly affecting the final credence.
