answer: |-
  Your reading contains significant errors. First, while Aquinas does distinguish resistance to tyranny from sedition in *ST II-II.42.2 ad 3*, he does not thereby remove all moral obstacles or grant permission. He merely clarifies that opposing a tyrant is not intrinsically the sin of sedition *if* undertaken by legitimate authority for the common good. The agent’s legitimacy remains paramount. Second, your interpretation of *De Regno* ignores the structural context: the discussion of bearing with moderate tyranny (*De Regno* I.6) and the risks of worse successors (*De Regno* I.7) follows the explicit prescription for *public* redress through a superior authority or the community’s representative action (*De Regno* I.6). Aquinas states that if the right to appoint the king belongs to the multitude, "it is not unjust that the king be deposed or have his power restricted by that same multitude if he abuses his royal power" — a corporate, not private, action. The "counsel" you cite presupposes this public framework; it warns against *premature or disorderly public action*, not private initiative. 

  Nothing in Aquinas permits a private individual to judge and execute a ruler, however tyrannical. Private judgment usurps the public authority’s exclusive role in capital punishment (*ST II-II.64.3*), which belongs to "him alone who has public authority." Killing by private persons is murder unless they act as ministers of that authority. The "common good" argument fails because Aquinas insists the *means* must be just: private usurpation of public judgment and punishment violates the order of justice itself, regardless of intent. Thus, while "tyrant" is indeed a moral category denoting unjust rule, the remedy is constitutionally circumscribed. Aquinas leaves no room for the lone tyrannicide.
