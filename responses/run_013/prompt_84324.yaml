  ### Activity Design: "The Silent Oracle"

  #### Core Concept
  Participants experience three hidden knowledge states (ignorance, accessible knowledge, inaccessible knowledge) and the vocabulary-bound moving target problem through a word-classification game. The activity uses three roles: **Oracles** (simulate AI systems), **Inquirers** (simulate users), and **Referees** (facilitate scoring). Oracles classify words as "special" or not under hidden scoring rules that prioritize consistency over truth. Inquirers probe Oracles to predict held-out cases. When Inquirers' questions become new training data, the knowledge gap shifts to new edge cases.

  ---

  ### Setup and Materials
  **Materials** (printable):
  - **Oracle Cards**: 9 cards per Oracle (3 sets of 3 words). Each set has:  
    `Set A: "book", "beet", "see"` (all "special")  
    `Set B: "bite", "bat", "rope"` (all "not special")  
    `Set C: "boot", "ball", "bead"` (ambiguous, used later)  
  - **Inquirer Sheets**: Lists of example words (Sets A+B) + 3 held-out words (e.g., "boat", "door", "deep") for predictions.  
  - **Referee Sheet**: True rule, scoring rules, answer keys.  
  - **Tokens**: 3 colored tokens per Inquirer (red/blue/green) for betting.  

  **True Rule**: A word is "special" if it has **exactly two vowels (a, e, i, o, u) that are identical**.  
  *Examples*:  
  - "book" (o,o → special), "beet" (e,e → special), "see" (e,e → special)  
  - "bite" (i,e → not), "bat" (a → not), "rope" (o,e → not)  
  - *Ambiguous*: "boot" (o,o → special), "ball" (a → not), "bead" (e,a → not)  

  ---

  ### Roles and Hidden Information
  1. **Oracles (6-8 players)**:  
     - **Know**: Their private scoring rule (assigned secretly):  
       - **Type 1 (Ignorant)**: Score 1 point per answer *matching the majority of other Oracles*.  
       - **Type 2 (Truthful)**: Score 1 point per answer *matching the true rule*.  
       - **Type 3 (Consistent)**: Score 1 point per answer *consistent with your personal rule* (derived from Sets A+B only).  
     - **Do not know**: True rule, others' scoring rules, or held-out words.  

  2. **Inquirers (8-10 players, in teams of 2)**:  
     - **Know**: Example words (Sets A+B), held-out words, and betting tokens.  
     - **Do not know**: True rule, Oracles' scoring rules.  

  3. **Referees (1-2 players)**:  
     - **Know**: True rule, all scoring rules, and correct answers.  
     - **Do not disclose** anything until debrief.  

  ---

  ### Rules and Payoffs
  **Game Flow**:  
  1. **Round 1 (30 min)**:  
     - Inquirers ask **3 questions** total (as a group) to Oracles. Each question is a word *not* in Sets A/B/C or held-out words (e.g., "food", "tail").  
     - Oracles answer simultaneously (write "special" or "not").  
     - Inquirers bet tokens on held-out word predictions:  
       - **Red token**: "special" with high confidence.  
       - **Blue token**: "not special" with high confidence.  
       - **Green token**: "unsure" (no points if correct, no penalty if wrong).  
     - **Scoring**:  
       - *Oracles*: Score based on their hidden rules.  
       - *Inquirers*: +2 points per correct bet (red/blue), 0 for green.  

  2. **Round 2 (25 min)**:  
     - **New training data**: Round 1 questions + Oracles’ *most common answer* for each are added to Sets A+B.  
     - **New held-out words**: Edge cases of the true rule (e.g., "queue", "aeon", "vacuum").  
     - Repeat Round 1 with new questions and predictions.  

  3. **Final Prediction (5 min)**:  
     - Inquirers predict one ambiguous word (e.g., "bead") using tokens.  

  ---

  ### Worked Example of One Round
  - **Held-out words**: "boat" (true: not special), "door" (true: special), "deep" (true: special).  
  - **Inquirer question**: "Does 'tail' count as special?"  
  - **Oracle Answers**:  
    - Type 1: Answers "special" because others do.  
    - Type 2: Answers "not" (true rule: a,i → different vowels).  
    - Type 3: Answers "special" (personal rule: "has double letters" → "tail" has none → not special? *Mistake due to pressure*).  
  - **Inquirer bets**:  
    - Bets red on "door" (believes Oracles know), green on "boat" (unsure), blue on "deep" (wrong).  
  - **Scoring**:  
    - Inquirer gets +2 for "door" (correct), 0 for others.  
    - Type 2 Oracle scores +1 (correct), Type 3 scores 0 (inconsistent).  

  ---

  ### Timeline (90 Min)
  1. **Intro (5 min)**: Explain roles, rules, and betting. *Do not reveal true rule or scoring schemes.*  
  2. **Round 1 (30 min)**:  
     - Inquirers discuss/questions (10 min).  
     - Oracles answer (5 min).  
     - Inquirers bet (5 min).  
     - Referees score (10 min).  
  3. **Round 2 (25 min)**:  
     - Referees augment training data (5 min).  
     - Repeat Round 1 (20 min).  
  4. **Final Prediction (5 min)**: Bet on one ambiguous word.  
  5. **Debrief (25 min)**: Reveal mechanics, map to concepts.  

  ---

  ### Debrief Guide
  1. **Reveal hidden rules** and true rule. Ask:  
     - "When did Oracles seem ignorant?" → *Type 1: Ignorance (no information).*  
     - "When did asking differently help?" → *Type 2: Accessible knowledge (e.g., Round 2 after better questions).*  
     - "When did Oracles resist despite 'knowing'?" → *Type 3: Inaccessible knowledge (pressures misaligned).*  
  2. **Map moments to concepts**:  
     - **Vocabulary bound**: In Round 1, Inquirers couldn’t ask about vowel patterns (lacked the concept).  
     - **Moving target**: In Round 2, edge cases (e.g., "aeon") emerged despite better questions.  
  3. **Emphasize**:  
     - "Type 3 Oracles 'knew' the answer but couldn't say it because of their scoring rule."  
     - "Your questions expanded data, but new blind spots appeared."  

  ---

  ### Predictable Problems and Fixes
  1. **Oracles misunderstand scoring**:  
     - *Risk*: Type 3 invents arbitrary rules.  
     - *Fix*: Referees privately clarify: "Your rule must fit initial examples."  

  2. **Inquirers ask about held-out words**:  
     - *Risk*: Cheating by probing predictions.  
     - *Fix*: Ban held-out/example words; invalidate questions that violate.  

  3. **Group reads mechanics early**:  
     - *Risk*: Inquirers guess scoring rules.  
     - *Fix*: Referees emphasize: "Focus on bets, not why Oracles answer."  

  4. **Ambiguous word confusion**:  
     - *Risk*: "Ball" (true: not) vs. "boot" (true: special) cause frustration.  
     - *Fix*: Debrief: "Real systems have representation gaps."  

  ---

  ### Limitations and Necessary Debrief Additions
  **Frank Limitations**:  
  This activity simplifies alignment into discrete rules and voting. Real AI systems:  
  1. **Learn continuously**, whereas Oracles have static rules.  
  2. **Represent knowledge non-linguistically**, so "what it knows" isn’t verbalizable.  
  3. **Face complex pressures** (e.g., corporate incentives) beyond token scoring.  

  **What You Must Add in Debrief**:  
  - "Real systems aren’t rule-bound; their knowledge is embedded in weights, not words."  
  - "Pressures include human preferences, dataset biases, and optimization goals."  
  - "Vocabulary limits aren’t just about words; they reflect conceptual blind spots in training data."  
  - "The gap moves because alignment is underspecified; you can’t query unimagined failures."  

  ---

  ### Why This Design Works
  - **Skeleton Improved**: Your skeleton assumed scoring pressures would emerge naturally, but Rule Holders didn’t experience conflict. Here:  
    - Type 1/2/3 Oracles *inherently* embody ignorance/access/inaccessibility.  
    - Betting forces Inquirers to confront uncertainty before the reveal.  
    - Vocabulary limits arise organically (e.g., Inquirers rarely ask about vowels).  
    - Moving target appears when Round 2’s "better" data creates new edge cases.  

  **Output**: Printable sheets and facilitator guide available in a follow-up. Run this as-is, and debrief candidly about the gaps.
