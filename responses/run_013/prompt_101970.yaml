prompt: |-
  I'm putting together a handout for a seminar on the split-brain cases — people whose corpus callosum gets severed, so the two hemispheres can act on information the other one doesn't have, one hand undoes what the other just did, and sometimes the two halves seem to want or belive different things. Everyone treats these as a puzzle about whether there's one mind or two, and I want to get past that. What are the most important implications of these cases for the assumption baked into medicine and law that a person is a single subject — one consent, one set of authentic values, one responsible agent? Give me exactly five, numbered, a sentence or two each, no intro or conclusion.
