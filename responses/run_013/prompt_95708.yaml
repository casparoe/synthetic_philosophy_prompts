prompt: |-
  I've been lurking around the algorithmic fairness literature for a couple years now, mostly the theory side (I don't train models, my math tops out around a first course in probability). The thing that keeps bugging me is what happened after the impossibility results everyone cites — the ones showing that when base rates differ between groups you can't simultaneously have a score that's calibrated within groups and equal error rates across them, or whatever the exact combination is. My impression is that the field absorbed these as "fairness is impossible, pick your poison" and then dispersed into a hundred new definitions, most of which are defended by showing they do something reasonable on a recidivism dataset. That feels like it can't be where the actual value is, but I can't articulate why not.

  Here's what I need it for. I'm advising a small foundation that has about $600k and three years to spend on conceptual work in this area, and nobody on the team is an ML engineer, so no "train a better model" projects and nothing that requires a big empirical shop. Which open questions should we fund, in what order, and why? I care much more about the reasoning than the list: I want the dependency structure — which questions are upstream of which, so that we don't blow the budget on something that turns out to be downstream of a question we never answered. Is the live question which criterion is correct, and if so on what grounds would anyone ever settle it? Or is the deeper issue that all these criteria are group-level while the moral complaint people actually make is about individuals, so the whole frame is off? Is there a parallel impossibility lurking for the causal and counterfactual notions of fairness, or do those just relocate the trade-off somewhere less visible? And does the decision threshold turn out to matter more than the score, in which case a lot of the score-level work is beside the point?

  One more thread I want you to take seriously rather than swat away. A friend of mine keeps arguing that the real question isn't which criterion is right but who gets to choose it, and with what legitimacy — that this is a procedural and political question wearing a statistical costume, and that the impossibility theorems are interesting mostly as a proof that no technical fix can dissolve the politics. I honestly can't tell if that's a deep reframing or a clever way of dodging the math. Is that line of work upstream of the technical literature, downstream of it, or genuinely orthogonal? And tell me plainly which apparently-open questions we should not fund because the answer wouldn't change what any deployer does — I'd rather hear that three promising-sounding topics are dead ends than get a survey. If it helps, what I'd want from the answer is the criteria you're ranking on, the trade-offs between them, and what we could see in the next year or two that would move something up or down the list.
reasoning: |-
  Okay, let's start by unpacking the user's query. They've been following algorithmic fairness literature, especially the theoretical side, and are frustrated with how the field reacted to impossibility results. They mention that after those theorems, the field fragmented into numerous fairness definitions, each validated on datasets like recidivism. The user feels this isn't where the real value lies but can't articulate why.

  Now, the user is advising a foundation with $600k to spend on conceptual work in algorithmic fairness. The team isn't composed of ML engineers, so they can't fund empirical projects. They want to know which open questions to fund, prioritizing based on dependency structures. They need to understand which issues are upstream, so they don't waste resources on downstream problems.

  Key concerns they raise:
  1. **The criterion problem**: Is the main issue deciding which fairness criterion is correct, and if so, how?
  2. **Group vs. individual fairness**: Are group-level metrics missing the point because moral complaints are individual?
  3. **Causal fairness**: Do causal approaches just hide trade-offs?
  4. **Threshold vs. score**: Does the decision threshold matter more than the score itself?
  5. **Procedural vs. technical**: Is fairness a political problem disguised as a technical one?

  They also mention their friend's argument that the real question is who gets to choose the criterion, not which one is right. The user is unsure if this is a valid reframing or a dodge. They want to know if this line of inquiry is upstream, downstream, or orthogonal to technical work.

  Additionally, they want to avoid dead-end projects. Which topics, even if promising, won't change what deployers do?

  Deep needs:
  - **Clarity on dependencies**: To allocate funds effectively, understanding which questions must be answered first.
  - **Practical impact**: Research should influence real-world deployments, not just academic debates.
  - **Legitimacy and process**: Exploring if procedural aspects are central to resolving fairness dilemmas.
  - **Avoiding wasted effort**: Identifying fruitless avenues early.

  Breaking down the response:
  1. **Diagnosis of Current Field**: The user is correct that the field fragmented post-impossibility results. But why is that unsatisfying? Because these definitions are context-dependent, and applying them without understanding the domain leads to arbitrary choices. The recidivism dataset (COMPAS) is overused, leading to narrow validation. The real issue is the lack of a framework to choose appropriate criteria for specific contexts.

  2. **Upstream Questions**:
     - **Meta-Framework**: A method to map societal values to technical criteria. This is foundational; without it, choosing definitions is arbitrary. Dependency: Everything else relies on this.
     - **Threshold Dynamics**: Decisions are made at thresholds, not scores. Research on how thresholds interact with fairness and how institutions set them is crucial. This affects how scores are used, so it's upstream of application-specific work.
     - **Causal Limitations**: Causal fairness requires untestable assumptions. Understanding where these fail or introduce new trade-offs is necessary before applying them. This is upstream because it informs when causal methods are viable.

  3. **Orthogonal/Parallel**:
     - **Procedural Legitimacy**: The friend's point is valid. Even with perfect criteria, who decides? This isn't downstream but parallel. Technical criteria can't resolve value conflicts; procedures are needed for legitimate choices. Funding here supports governance structures, which is essential for deployment.

  4. **Downstream/Dead Ends**:
     - **New Statistical Definitions**: Creating more metrics without guidance on selection doesn't help deployers. It's downstream and proliferates without solving the core problem.
     - **Pure Impossibility Generalizations**: While theoretically interesting, they don't offer practical solutions. Deployers already know trade-offs exist; more theorems won't change actions.
     - **Bias Mitigation Techniques**: Without knowing which fairness goal to pursue, these are premature. They depend on prior criterion selection.

  5. **Unpromising Areas**:
     - **Harmonizing Impossibility Results**: Trying to reconcile all impossibility theorems is futile. It's a dead end because the trade-offs are inherent.
     - **Domain-Neutral Validation**: Fairness can't be detached from context. Benchmarks without domain embedding won't influence real decisions.

  Prioritization:
  - **Tier 1**: Meta-framework development. Without this, other efforts lack direction. Progress here (e.g., value-aware toolkits) would enable better criterion selection.
  - **Tier 2**: Threshold management and causal critiques. These address implementation challenges once a criterion is chosen. They also highlight practical limits, informing the meta-framework.
  - **Tier 3**: Procedural legitimacy. Essential for adoption but can be developed alongside technical work. Piloting governance models could provide case studies for the meta-framework.

  Risk Mitigation:
  - Fund projects that produce tangible outputs (toolkits, case studies) rather than just papers. This ensures applicability.
  - Look for empirical anchors: Use real-world examples to ground theoretical work, avoiding abstract debates.

  Unspoken Needs:
  The user might be seeking validation that their skepticism of current fairness research is justified. They also need actionable advice that aligns with their foundation's constraints (non-technical team, conceptual focus). Emphasizing governance and procedural aspects could resonate, as it aligns with their friend's argument and offers a non-technical path to impact.

  Ensuring that funded projects bridge theory and practice is key. The foundation might not do empirical work, but research should involve stakeholders (domain experts, affected communities) to keep it grounded. This addresses the procedural legitimacy angle and ensures relevance.
answer: |-
  Your diagnosis of the algorithmic fairness landscape is astute: the field *did* fragment post-impossibility theorems, often retreating into abstract statistical debates or narrow empirical validations. The core frustration—that this misses the point—is justified. The value isn't in proliferating definitions or "solving" impossibility, but in **navigating the trade-offs responsibly in context**. Your foundation is uniquely positioned to fund the *conceptual scaffolding* needed to make this navigation systematic and legitimate.

  Below is a dependency-aware prioritization of open questions, ranked by upstream impact, feasibility for a non-engineering team, and potential to change deployer behavior. I’ll explicitly call out dead ends.

  ### **Dependency Map & Prioritization**
  *(Tier 1 = Most Upstream; Tier 3 = Downstream but Critical)*  
  **Criteria for Ranking:**  
  - **Upstreamness:** Does answering this unlock progress elsewhere?  
  - **Deployer Impact:** Will it change how institutions implement fairness?  
  - **Feasibility:** Can it be addressed without ML engineering?  
  - **Political Legitimacy Gap:** Does it engage your friend’s procedural critique?  

  ---

  #### **Tier 1: Foundational Meta-Frameworks (Upstream)**
  These questions are prerequisites for meaningful progress. Without them, technical work floats unanchored.  
  **1. Question:** *"How do we map societal/ethical values to technical fairness criteria in a specific context?"*  
     - **Why Upstream:** All technical criteria (calibration, equal odds, etc.) implicitly encode value judgments (e.g., is harm from false positives worse than false negatives?). Current approaches "pick a definition" arbitrarily or via grid-search. A *methodology* for translating domain-specific values (e.g., healthcare vs. lending) into criteria is missing.  
     - **Why Fund Now:** This is the **bottleneck**. Without it, deployers can’t choose definitions rigorously. Your friend’s procedural critique ("who decides?") is downstream of this: you need to know *what* is being decided before designing *how* to decide.  
     - **Outputs:**  
       - A toolkit for stakeholders (not just ML engineers) to audit value trade-offs (e.g., "If your community prioritizes avoiding wrongful denials of loans, use criterion X; if avoiding predatory lending, use Y").  
       - Case studies dissecting past failures (e.g., COMPAS) to show how value mismatches caused harm.  
     - **Risk:** Abstract philosophy. Mitigate by requiring partnerships with domain experts (e.g., public defenders, loan officers).  

  **2. Question:** *"How do decision thresholds interact with fairness goals, and how can institutions set them accountably?"*  
     - **Why Upstream:** Scores are useless without thresholds, yet 95% of fairness research ignores this. Thresholds determine real-world harm (e.g., who gets denied bail). Impossibility trade-offs often manifest here, not at the score level.  
     - **Why Fund Now:** Clarifying threshold dynamics exposes when "fair scores" are irrelevant (e.g., if deployers optimize thresholds for profit, not fairness). This forces engagement with *incentives* and *power* — directly engaging your friend’s political critique.  
     - **Outputs:**  
       - Frameworks for "threshold audits": Who set this threshold? What objectives drove it?  
       - Simulations showing how threshold changes redistribute harm under different fairness criteria.  
     - **Dependency:** Informs how value mapping (Tier 1.1) should incorporate institutional constraints.  

  ---

  #### **Tier 2: Critical Constraints & Reframings (Midstream)**
  Addresses limitations of current paradigms.  
  **3. Question:** *"When do causal fairness approaches collapse under their own assumptions, and how can we detect it?"*  
     - **Why Here:** Causal fairness (counterfactuals, no unresolved discrimination) seems to dodge impossibility results — but only by relying on untestable assumptions (e.g., "what if this applicant were another race?"). When assumptions fail (e.g., unmeasured confounders), trade-offs resurface.  
     - **Why Fund:** Exposes hidden trade-offs. Your foundation can fund *critiques* of causal methods (no engineering needed), showing deployers that "causal = objective" is a myth.  
     - **Outputs:**  
       - Catalog of real-world scenarios where causal assumptions commonly fail (e.g., discriminatory data generation).  
       - "Assumption audits" for practitioners.  
     - **Dependency:** Requires Tier 1’s value mapping to ground critiques (e.g., which values are violated when assumptions fail?).  

  **4. Question:** *"Is group fairness fundamentally inadequate for capturing individual harm, and if so, what replaces it?"*  
     - **Why Here:** Most impossibility results assume group fairness. Individual fairness ("treat similar people similarly") avoids this but is unimplementable without a similarity metric. New approaches (e.g., *process fairness*) are emerging but lack conceptual rigor.  
     - **Why Fund:** Directly addresses your insight that moral claims are individual. Focus on *measuring disparate treatment at the individual level* without collapsing into group proxies.  
     - **Outputs:**  
       - Taxonomies of individual harms (e.g., "dignitary harm," "arbitrariness") and whether they correlate with group metrics.  
       - Legal/philosophical analysis of when group fairness *sufficiently* proxies individual justice.  
     - **Dependency:** Informs value mapping (Tier 1.1) by clarifying when group criteria are morally inadequate.  

  ---

  #### **Tier 3: Procedural Legitimacy (Parallel/Orthogonal)**
  Engages your friend’s political critique — not downstream, but co-equal with technical work.  
  **5. Question:** *"How can we design legitimate processes for choosing fairness criteria in high-stakes domains?"*  
     - **Why Orthogonal:** Technical criteria can’t resolve value conflicts (e.g., "equality vs. equity"). This is where your friend is correct: politics is inescapable. But procedures can make choices *accountable*, not arbitrary.  
     - **Why Fund:** Most deployers default to whatever definition is easiest to code. Funding participatory design (e.g., community juries setting criteria for welfare algorithms) forces engagement with legitimacy.  
     - **Outputs:**  
       - Model governance templates (e.g., "When deploying school admissions algorithms, include teachers, parents, and students in criterion selection").  
       - Case studies of successful/failed participatory processes.  
     - **Dependency:** Builds on Tier 1’s value mapping but doesn’t require it to start.  

  ---

  ### **What Not to Fund (Dead Ends)**  
  Avoid projects that:  
  1. **Propose new statistical fairness definitions.** Downstream and proliferative. Unless tightly coupled to Tier 1 (value mapping), they won’t change deployer behavior.  
  2. **Generalize impossibility theorems.** Mathematically elegant, but deployers already know trade-offs exist. Doesn’t help navigate them.  
  3. **Benchmark bias mitigation techniques on UCI datasets.** Engineering-focused and context-free. You lack the empirical shop for this.  
  4. **Harmonize all fairness definitions.** A false grail — criteria conflict because values conflict.  
  5. **"Fair ML" toolkits without process guidance.** Tools like Fairlearn or Aequitas give deployers 10+ definitions to choose from with no guidance. This *is* the problem.  

  ---

  ### **Budget Allocation & Sequencing**  
  - **Year 1:** Fund **Tier 1** (Meta-Frameworks). Allocate $300k to 2–3 projects developing value-mapping toolkits and threshold governance models. *Why start here?* Without this, downstream work lacks direction.  
  - **Year 2:** Fund **Tier 2** (Constraints) and **Tier 3** (Legitimacy). Allocate $200k to causal critiques/individual harm and $100k to procedural design. *Why now?* Tier 2 needs Tier 1’s frameworks; Tier 3 can run in parallel.  
  - **Year 3:** Fund integrations. Allocate remaining $100k to projects bridging Tiers 1–3 (e.g., "Value-aware threshold audits for healthcare algorithms").  

  ### **What Moves the Needle**  
  In 1–2 years, look for:  
  - **Progress in Tier 1:** A major institution (e.g., city government, bank) pilots a value-mapping toolkit and *changes its fairness criterion* based on it.  
  - **Failure Signals:** If Tier 1 projects produce only abstract frameworks (not toolkits), pivot funding to Tier 3 (legitimacy) — indicating politics must lead.  

  ### **Plain Takeaways**  
  - **The core problem isn’t technical:** It’s the lack of a *values-to-metrics* bridge. Fund that bridge first.  
  - **Your friend is half-right:** Politics is irreducible, but procedures can make it accountable. Fund this *alongside* technical critiques.  
  - **Thresholds > scores:** Fund work that forces deployers to confront how thresholds weaponize "fair" scores.  
  - **Dead ends are definition-centric:** Avoid anything that doesn’t start from "What matters here?"  

  This approach treats impossibility not as a stopping point, but as proof that **fairness requires scaffolding for ethical triage**. Your foundation can build that scaffolding — no engineering needed.
