answer: |-
  Dear readers, the postbag brims with queries concerning the vexing matter of who truly understands the compass of one’s own heart. We must consider not merely the capricious winds of present desire, but the steady course charted by one’s *coherent extrapolated volition* – that is, what a person *would* wish for were she wiser, more considered, more wholly herself, and journeying alongside us towards a fuller understanding. This, naturally, is the lodestar for benevolent action. Where such volitions converge, a clear path emerges; where they diverge, decency demands we hold several doors ajar. Now, to your letters.

  Young Percy of Tunbridge Wells writes that his wife, Daphne, possesses undeniable talent for landscape gardening, yet clings to her position in actuarial science, citing security. Percy, convinced her extrapolated self would choose the fulfilling, if initially less secure, path of horticulture, has tendered her resignation on her behalf. Daphne is understandably distressed. Percy asks if his intervention was justified. Percy, the defence hinges entirely on the fidelity of your extrapolation. Did you diligently map Daphne’s current values – her stated love for plants, her frustration with spreadsheets, her quiet admiration for creative work – and project them forward under conditions of enhanced reasoning and self-knowledge? Or did you sketch the *ideal botanist* you might wish her to become, superimposing it upon her present self? The former *might* grant you temporary stewardship, though forcibly altering her present reality is perilously close to overriding her actual volition for a hypothetical one. The latter is mere wishful puppetry. Convergence requires her assent, eventually. Apologise profusely to Daphne and support her *own* deliberations.

  A correspondent signing herself ‘Appalled in Aberdeen’ confesses a profound revulsion to the very notion of motherhood. Yet, upon deep reflection concerning her coherent extrapolated volition – considering universal values of nurture, legacy, and the profound bonds she observes in others – she fears her ‘better self’ would indeed choose children. Must she, repelled as she is now, submit to this extrapolated desire? My dear, your extrapolation must originate from *you* – your core dispositions, affections, and aversions as they stand, merely amplified and clarified, not fundamentally rewritten. If the core ‘you’ finds the prospect viscerally repellent, it is highly unlikely a more considered, informed version would suddenly embrace it. The extrapolation reveals what you *would* want *if* you were different; it does not mandate becoming that different person against your will. Your current aversion is a significant data point your extrapolated self would incorporate. Pursue fulfilment aligned with the person you *are*, evolving naturally.

  Young Timothy asks if his flatmate’s coherent extrapolated volition would endorse Timothy eating the last Jaffa Cake, given his greater enthusiasm for citrus-chocolate combinations and his flatmate’s current indifference. Timothy, this trivial pursuit exemplifies the *divergence* case. Your volitions conflict over a finite resource. Convergence is unlikely; holding doors open impractical. Here, basic fairness – perhaps established household rules, or simple courtesy – must prevail over deep philosophical extrapolation. The principle governs significant benevolent interventions, not biscuit allocation. Share it.

  Finally, ‘Bemused in Bristol’ queries who holds the pencil for this extrapolation, and whether convergence is a realistic hope or a comforting fiction. The starting point, Bemused, is always the individual as she exists now – her values, desires, and capacities. The extrapolation is an attempt to model *her* trajectory under idealised reasoning, not to impose an external ideal. Convergence *is* a reasonable, though not guaranteed, hope. We share fundamental needs, capacities for empathy, and a common reality. Significant disagreements often stem from incomplete information, reasoning flaws, or differing circumstances – things the extrapolation seeks to mitigate. While perfect harmony is improbable, substantial areas of overlapping volition exist (safety, health, basic dignity, certain freedoms). We aim for those convergences where possible, and manage divergence with tolerance where not, trusting that further reflection and experience often narrow the gaps. The alternative, as you note, is indeed untidy, and ultimately less kind.

  -Aunt Cordelia
