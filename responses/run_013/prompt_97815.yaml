  ### **Limitations & Failure Modes**  
  1. **Blind Spots**:  
     - The model cannot self-diagnose unknown unknowns (e.g., if it misjudges difficulty due to training gaps).  
     - Mitigation requires independent sources for critical sub-questions (engineers must supply these).  

  2. **Composition Complexity**:  
     - Decomposition relocates (but doesn’t reduce) difficulty if \( R \) is hard (e.g., probabilistic aggregation in Example 3).  

  3. **Trust Decay**:  
     - Self-assessment costs accumulate; deep recursion exhausts trust budget.  

  4. **Scalability**:  
     - Fails for questions requiring creativity, ethical judgment, or adversarial reasoning (e.g., "Does this contract clause cover intentional sabotage?").  

  5. **Provenance Uncertainty**:  
     - The procedure assumes decomposition works in principle but cannot validate this (requires human benchmarking).  

  **What Humans Must Supply**:  
  - Independent verification sources (e.g., formulas, datasets).  
  - Trust/difficulty thresholds tuned to your model.  
  - Final sanity checks (e.g., "Does the decomposed answer make sense?").  
  - Fallback for unmitigatable risks.  

