  #### **Example 3: Migration Plan Downtime Comparison**  
  **Question**: "Which migration plan has lower expected downtime? Plan A: 10 servers, 4h each, 10% failure chance (+2h per fail). Plan B: 5 batches of 2 servers, 5h/batch, 5% failure chance per server (fails batch; retries)."  

  | **Step** | **Output** |  
  |----------|------------|  
  | **1**    | Difficulty=5 (probabilistic, interdependent). Trust: 1 used, 4 left. Proceed. |  
  | **2**    | **Sub-questions**:<br>1. Expected downtime for Plan A (Difficulty=3)<br>2. Expected downtime for Plan B (Difficulty=4)<br>**Rule**: Compare values from (1) and (2). |  
  | **3**    | **Silent Failure Risk**: q2 (if Plan B’s batch-retry logic is miscalculated, error propagates silently). **Mitigation**: No independent source for probabilistic retries. |  
  | **4**    | **Escalate** ("Unmitigatable silent failure for q2"). |  
  **Conclusion**: **Escalate to human** (despite difficulty reduction, silent risk unmitigated).  

