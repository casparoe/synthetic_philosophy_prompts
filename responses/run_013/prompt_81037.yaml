answer: |-
  Here's a breakdown of your observed phenomenon:

  ### (1) Straight Answer
  The closest established concept is **Michael Walzer's "War Responsibility Gradient"** (discussed in *Just and Unjust Wars*, Chapter 5). It describes how moral responsibility for unjust war *increases* as one moves *away* from the immediate act of fighting towards positions with greater knowledge, deliberation, authority, and freedom of action. The main limitation stopping it from being a perfect fit is that Walzer focuses specifically on *institutional roles* within the war effort (soldier -> officer -> politician), while your observation extends further outward to non-official enablers like columnists and voters, where responsibility is more contested.

  ### (2) The Neighbours
  *   **Moral Luck (Outcome/Constitutive):** This concerns how factors outside an agent's control (luck) affect moral judgment. *Outcome luck* judges the driver who kills a pedestrian worse than the reckless one who doesn't. *Constitutive luck* is about who you are (e.g., born into a militaristic society). **How your pattern differs:** Your focus isn't on *luck's impact on judgment*, but on the **systematic variation in *excusing conditions* (knowledge/choice) across roles** within an unjust structure. Luck might explain *why* the soldier had less knowledge/choice, but the *pattern* itself is about the distribution of those conditions relative to the harm.
  *   **"Ought Implies Can":** This principle states moral obligation only exists if one has the ability to fulfill it. **How your pattern relates & differs:** It *uses* this principle. The soldier "cannot" (meaningfully) disobey without severe cost, so we feel less "ought" applies. Higher-ups "can" refuse/stop with less immediate physical risk. Your pattern is the **observed societal *application* of this principle along an institutional/power gradient** within the context of collective violence, showing how the *degree* of "can" changes positionally, altering perceived blame.
  *   **Diffusion of Responsibility:** This describes how individual responsibility *diminishes* in a group setting ("someone else will act/be blamed"). **How your pattern differs:** Your phenomenon shows the *opposite* – responsibility *concentrates* on specific individuals (higher-ups/enablers) precisely because their roles *isolate* them from the diffusion excuse. The soldier *could* claim diffusion ("just following orders/in the unit"), but the columnist or minister *cannot*; their individual agency is clearer.

  ### (3) The Carving
  **Best-Fitting Concept: The Inverse Excuse Gradient of Collective Harm.** This describes **the phenomenon where the strength of standard moral excuses (primarily lack of knowledge and lack of freedom/choice) systematically *weakens* as one's role in an unjust collective harm moves structurally *away* from the immediate point of infliction, towards positions with greater access to information, deliberation time, institutional authority, political power, and freedom from immediate physical coercion or legal penalty for refusal.** 

  *   **Inside the Boundary:** Roles within the formal chain of command (soldier, NCO, officer, commander, politician, military contractor directly enabling violence) and influential societal enablers (propagandists, key voters in referendums) where participation demonstably sustains the unjust harm.
  *   **Just Outside the Boundary:** Individuals with very indirect or negligible causal contribution (e.g., a taxpayer unaware of specific war crimes, a factory worker making generic parts used in military & civilian equipment), bystanders with no influence, or those coerced at *all* levels with *genuinely* equivalent, overwhelming threats (rare beyond frontline soldiers/conscripts).

  ### (4) Test Cases
  1.  **The Draftee Who Hated It:** **Same phenomenon.** Embodies the "low point" – minimal knowledge (often fed propaganda), minimal choice (coercion of draft, severe penalty for refusal), maximal physical risk. Excuses strongest, blame weakest *despite* pulling the trigger.
  2.  **The Volunteer Who Enlisted Out of Conviction:** **Modified phenomenon.** Still proximate, but stronger conviction implies *more* knowledge/choice *at entry*. Excuses weaker than draftee. Blame higher. The gradient applies, but their *initial* agency shifts them slightly "up" the blame slope compared to a similarly placed draftee.
  3.  **The Drone Operator:** **Core phenomenon.** Mid-gradient. More knowledge (live feed, intel briefings?), more time/space for deliberation, less immediate physical risk than infantry. Excuses ("just following orders," "didn't know context") are thinner. Blame perception higher than infantry, lower than commanders.
  4.  **The Engineer Writing Targeting Software:** **Same phenomenon, higher up.** High knowledge of the *system's purpose and capabilities*, significant choice in employment, high deliberation time, no physical risk. Excuses ("just building tech," "don't pick targets") are very weak. Blame perception high, comparable to mid-level commanders/analysts.
  5.  **The Voter Who Now Regrets It:** **Edges of the phenomenon.** *Potentially* same, *if* they voted *for* the war/party *with* significant available knowledge and alternative choices. Excuses ("didn't know," "no choice but to vote") are weakest here. However, **just outside** if their vote was insignificant in a large electorate, they lacked access to reliable information, or the war justification was exceptionally deceptive. Diffuse contribution makes it less clear-cut than institutional roles.
