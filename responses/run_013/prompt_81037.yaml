  The user is clearly frustrated with family arguments about their cousin's enlistment and has done substantial research. They're not a philosopher but a physiotherapist, so they need clear explanations without jargon. Their core question is whether there's a name for this inverse relationship between proximity to violence and moral responsibility. 

  Breaking down their request: they want (1) a straight answer about terminology, (2) comparison to related concepts, (3) precise definitional boundaries, and (4) practical test cases. The challenge is that while Walzer's "war responsibility gradient" comes close, it's not a formal term, and the phenomenon overlaps with several established ideas without being identical to any.

  I need to carefully distinguish this from "diffusion of responsibility" (which disperses blame) and "moral luck" (which focuses on outcomes). The key differentiator here is that responsibility actively concentrates away from the point of action. The user's observation about shifting excuses—knowledge and freedom diminishing downward—is astute. 

  For test cases, the conscript fits perfectly while the regretful voter doesn't, revealing the pattern's limits: it applies best within institutional hierarchies. The volunteer soldier case is trickier—their conviction might restore some blame despite proximity, showing how agency modifies the gradient. 

