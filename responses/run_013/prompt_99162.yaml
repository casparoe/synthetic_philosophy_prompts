prompt: |-
  I'm a senior engineer on a platform team, and much of my job is running postmortems after production incidents. The data-gathering part usually goes fine; what stalls is the argument about what actually caused the incident. We'll have the timeline, the logs, and the dashboards on the table, and four people will be defending four different stories, each of which fits the evidence we have, and the meeting ends with whoever is most senior or most fluent getting their story into the writeup. I've been reading about inference to the best explanation as an account of how scientists choose between theories, and I'd like to turn it into something my team can actually run in a ninety-minute meeting, with no statistician in the room and no ability to rerun the incident on demand. Please write me that procedure: the questions to ask in order, what counts as a sufficient answer to each, the order in which to weigh the standard virtues of an explanation (how much it explains, how well it fits what we already know, whether it is simple, whether it makes predictions we could check), where the procedure stops and reports that the current evidence cannot separate two candidates, and where it hands the decision to a person because the remaining question is a judgment call rather than a fact. Two things I'd like it to take seriously, because they keep coming up and I don't have names for them: first, an explanation can be attractive because of how much it would explain if it were true, even when it is quite unlikely given everything else we know, and these two considerations pull in opposite directions; second, choosing the best of the stories currently on the table tells us nothing if all of them are bad, so the procedure should include a step that asks whether we have even considered the boring explanation. I'd also like it to handle the case where two candidates are both adequate and we must choose anyway, and the case where the honest answer is that several factors combined, none sufficient on its own, since our postmortems always seem to want a single root cause and I am no longer sure that shape is always right.

  Run the procedure on three incidents. First: a payments reconciliation job that fails on roughly one Tuesday night in six, where the candidates are an index rebuild that overlaps the job window, a slow memory leak that crosses a threshold only after several days of uptime, intermittent rate limiting from the bank's API, and clock drift on two hosts that breaks the job's idempotency check. Second: a checkout service returning a slightly wrong total for a small share of orders in one country, where the candidates are a rounding rule that changed in a library upgrade, a misconfigured tax table, a cache serving a stale price, and an unusual sequence in which users apply coupons. Third, and this is the one I expect to be uncomfortable: an intermittent 500 error that I have been arguing comes from a subtle race condition in our new connection pool, when the least interesting candidate on the list is a known bug in a library version we pin; I suspect the procedure will tell me to drop my explanation, and if it does I want the reasoning spelled out rather than softened. For each incident, show what the procedure rules out, what it cannot separate, and what single piece of evidence or small experiment would move it. Finally, be explicit about what this procedure cannot do — which of its steps are judgment calls dressed up as method, where it will misfire, and what a team should not use it for.
reasoning: |-
  We are designing a structured procedure for postmortem analysis based on Inference to the Best Explanation (IBE). The goal is to guide a team through evaluating multiple candidate explanations for an incident in a 90-minute meeting, without requiring advanced statistics or the ability to recreate the incident.

  The procedure will have the following steps:

  1. **Gather and Review Evidence**: Present the timeline, logs, dashboards, and any other data. Ensure everyone is on the same page about what happened.

  2. **List Candidate Explanations**: Brainstorm and list all proposed explanations (candidates). Encourage including the "boring" explanation (e.g., known issues, common failures).

  3. **Evaluate Each Candidate Against Evidence**: For each candidate, ask:
     a. **Explanatory Power**: How much of the observed evidence does this candidate explain? (Rate: High/Medium/Low or 1-5)
     b. **Consistency with Prior Knowledge**: How well does this candidate align with what we already know about the system? (e.g., known bugs, system behavior, past incidents) (Rate: High/Medium/Low)
     c. **Simplicity**: Is this candidate simple (not overly complex, few assumptions)? (Rate: High/Medium/Low)
     d. **Predictive Power**: Does this candidate make any new predictions that we could check with existing or new evidence? (List any such predictions)

  4. **Compare Candidates**:
     - For each candidate, note its ratings and any unique predictions.
     - Identify which candidate has the highest explanatory power and consistency. If one candidate stands out, select it.
     - If multiple candidates are close, consider simplicity and predictive power to break ties.
     - If no candidate explains the majority of the evidence, go back to step 2 and consider if there's a missing candidate (especially the boring one) or if the incident might be multi-causal.

  5. **Handle Multi-Causality and Uncertainty**:
     - If the evidence suggests multiple factors combined, document that.
     - If the evidence cannot separate two or more candidates, note that and what additional evidence or small experiment would help.

  6. **Decision and Reporting**:
     - If one candidate is best, report it.
     - If multiple are equally good, choose one (if you must) but note the uncertainty and the need for further investigation.
     - If the best candidate is still weak, report that and recommend further monitoring or testing.

  The procedure explicitly addresses:
     - The tension between explanatory power (how much it explains) and prior consistency (how likely it is given what we know) by rating them separately and then comparing.
     - The "boring explanation" by requiring it to be listed and evaluated.
     - Multi-causality by allowing for a conclusion that several factors combined.

  **Key Questions to Ask in Order**:

  1. What evidence do we have? (Timeline, logs, dashboards)
  2. What are the candidate explanations? (List them all, including the boring ones)
  3. For each candidate:
     a. How much of the evidence does it explain? (Rate and list which parts)
     b. How consistent is it with our prior knowledge? (Rate and justify)
     c. How simple is it? (Rate and justify)
     d. What new predictions does it make? (List any testable predictions)
  4. Are there any candidates that explain almost all the evidence? If yes, which one has the highest consistency and simplicity?
  5. If multiple candidates are strong, is there a prediction we can check now or soon to distinguish them?
  6. If no candidate explains most of the evidence, have we considered a boring explanation or a combination? If not, go back to step 2.
  7. Can we rule out any candidate because it is inconsistent with key evidence?
  8. If we have to choose between two equally good candidates, which one has the more actionable fix? (This is a judgment call.)

  **Where the procedure stops and reports uncertainty**:
     - If after step 4, two or more candidates are equally good and we cannot break the tie with simplicity or predictions, we report that the evidence is insufficient to distinguish between them and list the candidates.
     - If no candidate explains the majority of the evidence, we report that we have not found an adequate explanation and recommend further investigation.

  **Where it hands off to judgment**:
     - When rating explanatory power, consistency, and simplicity, there is inherent judgment. We mitigate by having the team discuss and rate collectively.
     - In step 8, when we must choose between two equally good candidates, we use the criterion of "actionability" (which fix is easier to implement or more beneficial) which is a judgment call.

  **Limitations**:
     - The ratings (explanatory power, consistency, simplicity) are subjective and may vary by team member. The procedure relies on group discussion and consensus.
     - It may not uncover explanations that no one in the room has thought of.
     - It does not replace rigorous testing or data analysis; it is a structured discussion tool.
     - It may misfire if the team is biased (e.g., favoring a pet theory) or if the evidence is incomplete or misinterpreted.
     - It should not be used for incidents where the cause is immediately obvious (e.g., a server was down due to a power outage) or when a root cause is already confirmed by testing.

  ---

  Now, we run the procedure on the three incidents.

  ### Incident 1: Payments reconciliation job fails on roughly one Tuesday night in six

  **Candidates**:
  - A: Index rebuild overlaps the job window (causes resource contention)
  - B: Slow memory leak crosses a threshold after several days of uptime (fails when the server has been up long enough)
  - C: Intermittent rate limiting from the bank's API
  - D: Clock drift on two hosts breaks idempotency check

  **Step-by-step analysis**:

  1. **Evidence**:
     - Fails on Tuesdays (but not every Tuesday) at night.
     - The job runs on multiple hosts, and the failure is not consistent across hosts.
     - Logs show occasional timeouts and idempotency errors.
     - The index rebuild is scheduled weekly on Tuesday nights but not at the same time every week.
     - Memory usage graphs show a slow increase over time, but no clear correlation with failure.
     - API logs show some rate limit errors, but not consistently on failure nights.
     - Clock drift observed between hosts, but within acceptable limits.

  2. **Evaluate Candidates**:

     - **A: Index rebuild**:
       - Explanatory Power: Medium. Explains why Tuesday, but not why only some Tuesdays (unless the timing varies). Doesn't explain the intermittent nature.
       - Consistency: High. We know index rebuilds are heavy and scheduled on Tuesdays.
       - Simplicity: High. Straightforward resource contention.
       - Predictions: If we change the schedule of the index rebuild, the failures should stop or change pattern.

     - **B: Memory leak**:
       - Explanatory Power: Low. The job runs weekly, so the server would be restarted at least weekly? If not, then it might explain the occasional failure when uptime is long enough. But the pattern is every 6 weeks? Not clear.
       - Consistency: Medium. Memory leaks are common, but we don't have strong evidence of a leak in this service.
       - Simplicity: Medium. Assumes a leak that only causes failure after a long uptime, which might be complex if we don't have evidence of the leak.
       - Predictions: If we restart the service more often, the failures should stop.

     - **C: Rate limiting**:
       - Explanatory Power: Medium. Explains the intermittent failures and timeouts. But why Tuesday? (Maybe Tuesday is a busy day for the bank?) Without evidence, this is weak.
       - Consistency: High. We know the bank's API rate limits and we've seen it before.
       - Simplicity: High. Simple external cause.
       - Predictions: If we add retries with backoff, the failures should reduce.

     - **D: Clock drift**:
       - Explanatory Power: High. Explains the idempotency errors and why it fails intermittently (if the drift is variable). But why Tuesday? (Maybe the job runs longer on Tuesday due to higher load, making it more sensitive to clock drift? If so, then it fits.)
       - Consistency: Medium. We know there is clock drift, but it's within acceptable limits. However, for an idempotency check that relies on precise timing, even small drifts might matter.
       - Simplicity: Medium. Requires two factors: clock drift and a job that runs long enough on Tuesday to hit the issue.
       - Predictions: If we synchronize clocks better or change the idempotency check, the issue should stop.

  3. **Compare**:
     - Candidate D has the highest explanatory power if we can link Tuesday to longer job runs (which we might have evidence for). Otherwise, A and D are contenders.
     - Consistency: A and C are high, D is medium, B is medium.
     - Simplicity: A and C are high, D is medium, B is medium.

     If we have evidence that the job runs longer on Tuesdays (e.g., more transactions to reconcile), then D becomes strong. Otherwise, A is a good candidate because it explains Tuesday.

  4. **Additional Evidence**:
     - Check job duration on Tuesdays vs. other days. If longer, then D becomes the best explanation.
     - If not, then A is the best because of its consistency and simplicity.

     **Ruling Out**:
     - B: Memory leak: Low explanatory power because the server is restarted weekly? If the job runs on a server that is not restarted often, then it might be viable. But if restarted weekly, then the uptime is never long enough. We can rule out if restarts are weekly.

     **Cannot Separate**:
     - Without more evidence, we might not separate A and D. But if we have logs showing the job duration on Tuesdays, that helps.

     **Result**:
     - Assume we check and find that the job does run longer on Tuesdays. Then D is the best explanation.
     - Otherwise, A is the best.

     **Action**:
     - For D: Fix clock sync and/or idempotency check.
     - For A: Reschedule the index rebuild.

     **One Experiment**:
     - Change the idempotency check to use a more robust method (e.g., unique IDs) and see if the issue stops. If it does, then D was the cause.

  ### Incident 2: Checkout service returns slightly wrong total in one country

  **Candidates**:
  - A: Rounding rule changed in a library upgrade
  - B: Misconfigured tax table for that country
  - C: Cache serving stale price
  - D: Unusual sequence of applying coupons

  **Step-by-step analysis**:

  1. **Evidence**:
     - Only one country, small share of orders.
     - The wrong total is slightly off, often by a few cents.
     - The issue is intermittent.

  2. **Evaluate Candidates**:

     - **A: Rounding rule change**:
       - Explanatory Power: High. Explains why it's a small difference and why it started after a library upgrade (if it did). But why only one country? (Maybe that country uses a specific calculation that uses the rounding rule?)
       - Consistency: Medium. We did upgrade the library, and rounding issues are common. But we don't know if the rounding rule changed for that country.
       - Simplicity: High. One change caused the issue.
       - Predictions: Revert the library and see if the issue goes away.

     - **B: Misconfigured tax table**:
       - Explanatory Power: High. Explains why only one country and why the total is off (if the tax is calculated wrong). But why intermittent? (Maybe only for certain products or customer types in that country?)
       - Consistency: High. Tax tables are updated and can be misconfigured.
       - Simplicity: High.
       - Predictions: Check the tax table for that country; if we fix it, the issue should stop.

     - **C: Stale price cache**:
       - Explanatory Power: Medium. Explains the intermittent issue and a wrong total. But why only one country? (Maybe that country's prices are updated less frequently? Or a specific cache node is misbehaving?) Without evidence, it's weak for the country-specific part.
       - Consistency: Medium. We know caching can cause stale data.
       - Simplicity: Medium. Requires a stale cache for prices in that country.
       - Predictions: Clearing the cache should temporarily fix the issue.

     - **D: Unusual coupon sequence**:
       - Explanatory Power: Medium. Explains why intermittent and only for some orders. But why only one country? (Maybe that country has a specific coupon that causes the issue?) Without evidence, it's weak.
       - Consistency: Low. We haven't seen such an issue before.
       - Simplicity: Low. It requires a very specific sequence of user actions.
       - Predictions: Reproducing the exact sequence might be hard, but if we can, we can see the wrong total.

  3. **Compare**:
     - A and B have high explanatory power and high consistency. A is linked to a change (library upgrade) and B to a configuration. If the issue started after the library upgrade, then A is stronger. If the tax table was recently updated, then B is stronger.
     - C is possible but less consistent with the country specificity.
     - D is less likely because of low consistency and simplicity.

     **Ruling Out**:
     - D: Unusual coupon sequence: Low consistency and simplicity. We can rule it out unless there's evidence of such sequences in that country.

     **Cannot Separate**:
     - If we cannot determine when the issue started relative to the library upgrade or tax table change, then A and B are both strong.

     **Result**:
     - Check the timeline: When did the issue start? If it started after the library upgrade, then A is the best. If it started after a tax table update, then B is the best. If both happened around the same time, then we must run an experiment.

     **One Experiment**:
     - Revert the library in a test environment and run test cases for that country. If the issue is resolved, then A. If not, then try fixing the tax table (B).

  ### Incident 3: Intermittent 500 error

  **Candidates**:
  - A: Subtle race condition in the new connection pool (your theory)
  - B: Known bug in a pinned library version

  **Step-by-step analysis**:

  1. **Evidence**:
     - Intermittent 500 errors.
     - The connection pool is new and might have concurrency issues.
     - The library version is pinned because of a known bug, but the bug is supposed to be rare and only under high load.

  2. **Evaluate Candidates**:

     - **A: Race condition in connection pool**:
       - Explanatory Power: High. Explains the intermittency and the fact that it started after the new connection pool was introduced.
       - Consistency: Medium. Race conditions are common in concurrent systems, but we don't have direct evidence.
       - Simplicity: Medium. It's a new component, so it's plausible, but race conditions can be complex.
       - Predictions: If we fix the race condition (or add more logging), the errors should stop.

     - **B: Known bug in pinned library**:
       - Explanatory Power: Medium. The bug is known and can cause 500 errors, but it's rare and only under high load. If the errors are occurring under normal load, it might not fit.
       - Consistency: High. We know about the bug and have pinned the library to avoid a worse one, but this bug is still present.
       - Simplicity: High. It's a known issue.
       - Predictions: If we upgrade the library (to a version where the bug is fixed) and the error stops, then B.

  3. **Compare**:
     - Both candidates have merits. However, the known bug (B) has higher consistency because it's a known issue. Your theory (A) has high explanatory power but is less consistent with prior knowledge because the connection pool was tested and we have a known bug in the library that we are living with.

     **The procedure should explicitly check for the boring explanation**:
     - Candidate B is the boring explanation. We are already aware of it and have decided to live with it. The procedure should ask: have we considered the boring explanation? Yes, and it's candidate B.

     **Result**:
     - The procedure might favor candidate B because it is a known issue and we have evidence (the bug report) that matches the symptoms. Even though A is attractive (it would explain the issue and might lead to a more satisfying fix), the consistency of B is higher.

     **Why drop A?**
     - The principle: when a known, documented issue exists that fits the symptoms, it is more consistent with prior knowledge to attribute the incident to that issue rather than a new, unproven theory (unless we have strong evidence against the known issue). The burden of proof is on the new theory.

     **One Experiment**:
     - Upgrade the library in a staging environment and simulate the load. If the 500 errors disappear, then B is confirmed. If they persist, then A becomes more likely.

  **Limitations of the Procedure**:

  1. **Subjectivity in Ratings**: The ratings (explanatory power, consistency, simplicity) are not objective. They depend on the team's knowledge and biases. Mitigation: Encourage diverse perspectives and challenge assumptions.

  2. **Incomplete Evidence**: The procedure relies on available evidence. If key evidence is missing, it might lead to a wrong conclusion. Mitigation: Note evidence gaps and recommend further logging.

  3. **Bias**: The team might favor pet theories or avoid blaming a particular component. The procedure cannot eliminate this, but it structures the discussion and requires justifications.

  4. **Multi-Causality**: The procedure allows for multi-causality, but in practice, teams might still want a single root cause. The procedure should insist that if multiple factors are necessary, we document that.

  5. **Novel Explanations**: It might undervalue a novel explanation that is correct but not considered likely by the team. The predictive power step helps here: if a candidate makes a testable prediction, it can be elevated.

  6. **Time Constraints**: In 90 minutes, we might not resolve complex issues. The procedure should be time-boxed and might sometimes output "inconclusive".

  **What it cannot do**:
     - Replace testing or experimentation.
     - Uncover entirely new explanations that no one in the room thinks of.
     - Provide statistical certainty.
     - Be used for incidents with clear causes (like a network outage) without overcomplicating.

  Despite these limitations, the procedure provides a structured way to evaluate competing explanations and reduces the influence of seniority or fluency by requiring explicit ratings and justifications.
answer: |-
  Below is a structured procedure for running postmortems using **Inference to the Best Explanation (IBE)**, designed for a 90-minute meeting. It explicitly addresses your requirements:  
  - Balances "explanatory scope" (how much it explains) against "prior probability" (consistency with existing knowledge).  
  - Forces consideration of the "boring explanation" (known issues, routine failures).  
  - Handles multi-causality and cases where candidates are indistinguishable.  
  - Separates factual analysis from judgment calls.  

  ---

  ### **Structured IBE Postmortem Procedure**  
  **Timebox:** 90 minutes (strictly enforced).  
  **Roles:** Facilitator (you), Scribe, Incident Responders.  
  **Inputs:** Timeline, logs, dashboards, monitoring data.  
  **Output:** Root cause analysis, confidence level, and action items.  

  #### **Step 1: Define the Evidence (10 mins)**  
  - **Question:** "What exactly happened? List all anomalies, patterns, and key data points."  
  - **Sufficient Answer:** A bulleted list of 3–5 concrete observations (e.g., "Errors spiked at 02:15 UTC," "Failures correlated with Tuesdays").  
  - **Why:** Grounds the discussion in data; avoids speculation.  

  #### **Step 2: List Candidate Explanations (15 mins)**  
  - **Question:** "What hypotheses could explain this? Include boring, complex, and combined causes."  
  - **Sufficient Answer:** 3–5 candidates. **Mandatory:** One candidate must be the "boring explanation" (e.g., "Known bug in X," "Chronic issue Y").  
  - **Why:** Prevents overlooking simple causes; forces diversity of thought.  

  #### **Step 3: Rate Explanatory Virtues (30 mins)**  
  Evaluate each candidate against four virtues **in this order** (use a shared scoring matrix: 1=Low, 3=High):  
  1. **Explanatory Scope:** "How much of the evidence does this explain?"  
     - *Focus:* Coverage of anomalies from Step 1.  
  2. **Prior Probability:** "How consistent is this with what we already know?"  
     - *Focus:* Alignment with system design, past incidents, and documented limitations.  
  3. **Simplicity:** "How many assumptions or moving parts does this require?"  
     - *Focus:* Fewer components > complex chains.  
  4. **Predictive Power:** "What new predictions does this make? Can we test them cheaply?"  
     - *Focus:* Actionable predictions (e.g., "If we disable X, failures stop").  

  #### **Step 4: Compare and Eliminate (20 mins)**  
  - **Question 1:** "Which candidates have low prior probability or scope? Eliminate them."  
    - *Threshold:* Discard if prior probability = 1 (contradicts known facts) or scope ≤1 (misses key evidence).  
  - **Question 2:** "For remaining candidates, does one lead on 2+ virtues? If yes, pick it."  
  - **Question 3:** "If ties exist, which has the *simplest fix*? (Judgment call)."  
  - **Question 4:** "Are all candidates weak (scope ≤2)? If yes, return to Step 2 and add the boring explanation."  
  - **Output:** Shortlist of 1–2 candidates.  

  #### **Step 5: Handle Ambiguity (10 mins)**  
  - **If no clear winner:** "Do we need a single root cause, or is this multi-causal?"  
    - *Multi-causal:* Document all contributing factors (e.g., "A + B created failure condition").  
  - **If indistinguishable:** "What 1–2 tests could break the tie? Commit to running them."  
  - **Judgment Call:** When candidates are tied, prioritize:  
    1. Fixes requiring <1 day of work.  
    2. Risks with highest blast radius.  

  #### **Step 6: Document and Action (5 mins)**  
  - **Writeup:**  
    - Winning candidate(s) and confidence (High/Medium/Low).  
    - Ruled-out candidates and why.  
    - Required experiments.  

  ---

  ### **Key Innovations**  
  - **Tension Management:** Separates "explanatory scope" (step 3.1) and "prior probability" (step 3.2) to force explicit tradeoffs.  
  - **Boring Explanation Safeguard:** Mandatory inclusion in Step 2 and reevaluation in Step 4.4.  
  - **Judgment Isolation:** Fix prioritization (step 4.3) and multi-causality (step 5) are labeled as judgment calls.  

  ---

  ### **Applied to Your Incidents**  
  #### **Incident 1: Payments Job Fails on ~1/6 Tuesdays**  
  - **Candidates:**  
    A: Index rebuild overlaps job window.  
    B: Memory leak crosses threshold after days of uptime.  
    C: Bank API rate limiting.  
    D: Clock drift breaks idempotency.  

  | Candidate | Explanatory Scope | Prior Probability | Simplicity | Predictive Power        |  
  |-----------|-------------------|-------------------|------------|--------------------------|  
  | A         | 2 (Explains Tuesday link) | 3 (Known rebuild schedule) | 3         | "Reschedule rebuild → failures stop." |  
  | B         | 1 (No Tuesday link)       | 2 (No prior leaks)         | 1 (Complex) | "Restart service nightly → failures stop." |  
  | C         | 2 (Intermittent errors)   | 3 (API history)            | 3         | "Disable job → API errors persist." |  
  | D         | 3 (Explains Tuesday + drift logs) | 2 (Clock sync is stable)   | 2         | "Sync clocks → failures stop." |  

  - **Analysis:**  
    - **Rule Out:** B (low scope/simplicity).  
    - **Shortlist:** D (scope=3) and A (prior=3).  
    - **Tiebreak:** D has higher scope; A has higher prior.  
    - **Judgment Call:** Prefer D (more explanatory) but test: **Sync clocks + monitor**.  
    - **If Ambiguous:** Run job mid-week to isolate Tuesday factor.  

  ---

  #### **Incident 2: Wrong Checkout Total in One Country**  
  - **Candidates:**  
    A: Rounding rule change (library upgrade).  
    B: Misconfigured tax table.  
    C: Stale price cache.  
    D: Unusual coupon sequence.  

  | Candidate | Explanatory Scope | Prior Probability | Simplicity | Predictive Power        |  
  |-----------|-------------------|-------------------|------------|--------------------------|  
  | A         | 3 (Explains country-specific logic) | 2 (No prior rounding bugs) | 3         | "Revert library → totals correct." |  
  | B         | 3 (Fits country scope) | 3 (Tax configs often break) | 3         | "Fix tax table → issue resolves." |  
  | C         | 1 (No country link)     | 2 (Cache robust)           | 2         | "Clear cache → issue persists." |  
  | D         | 2 (Fits intermittency)  | 1 (Never observed)         | 1         | "Reproduce sequence → totals wrong." |  

  - **Analysis:**  
    - **Rule Out:** C (low scope), D (low prior/simplicity).  
    - **Shortlist:** A and B (both scope=3, prior=2-3).  
    - **Tiebreak:** B wins (higher prior probability—tax issues are common).  
    - **Action:** Fix tax table.  
    - **If Ambiguous:** Test library revert in staging.  

  ---

  #### **Incident 3: Intermittent 500 Error (Your Race Condition vs. Boring Bug)**  
  - **Candidates:**  
    A: Race condition in connection pool (your theory).  
    B: Known bug in pinned library (boring explanation).  

  | Candidate | Explanatory Scope | Prior Probability | Simplicity | Predictive Power        |  
  |-----------|-------------------|-------------------|------------|--------------------------|  
  | A         | 3 (Fits 500s + timing) | 1 (Pool is new but tested) | 2         | "Add pool metrics → catch race." |  
  | B         | 3 (Matches error signature) | 3 (Documented bug) | 3         | "Upgrade library → errors stop." |  

  - **Analysis:**  
    - **Rule Out:** None (both scope=3).  
    - **Shortlist:** A and B.  
    - **Prior Probability:** B (3) > A (1). **B wins decisively.**  
    - **Why Your Theory is Rejected:**  
      - Explanatory scope is equal, but prior probability dominates per IBE.  
      - Boring explanation (B) has higher consistency with known facts (the bug is documented).  
      - Fixing B is simpler and testable.  
    - **Action:** Upgrade library. If errors persist, *then* investigate A.  
    - **Key Evidence:** Error logs matching the library bug’s signature.  

  ---

  ### **Limitations and Failure Modes**  
  1. **Judgment Dressed as Method:**  
     - Prior probability (Step 3.2) and simplicity (Step 3.3) rely on team knowledge. Biases creep in if expertise is uneven.  
     - **Mitigation:** Have juniors rate first, then seniors.  

  2. **Where It Misfires:**  
     - **Novel Failures:** Poor at diagnosing unknown-unknowns (e.g., a never-seen-before network flaw).  
     - **Concurrency Issues:** Race conditions often require recreation (hard here).  
     - **Bad Evidence:** Garbage in, garbage out—if logs are incomplete, conclusions will be wrong.  

  3. **Not For:**  
     - Blamestorming (IBE focuses on systems, not people).  
     - Incidents with >5 candidates (prioritize top 3).  
     - Legal/compliance investigations (requires forensic rigor).  

  4. **Critical Judgment Calls:**  
     - "Prior Probability" scoring (Step 3.2).  
     - Fix prioritization (Step 4.3).  
     - Multi-causality declaration (Step 5).  

  ---

  ### **Final Recommendations**  
  - **Pre-Meeting:** Share evidence 24hrs ahead; require candidates in writing.  
  - **During:** Use a shared scoring spreadsheet. Enforce timeboxes ruthlessly.  
  - **Post-Mortem:** Revisit high-risk incidents in 30 days to validate conclusions.  
  - **Tooling:** Add "boring explanation" checkbox to your incident template.  

  This procedure forces systematic tradeoffs between exciting-but-unlikely theories and dull-but-probable truths. By making ambiguity explicit, it reduces rhetorical battles and focuses on testable actions.
