prompt: |-
  I would like a careful conceptual explanation of the difference between epistemicism and supervaluationism about vagueness, built around a case that I think exposes the real fault line rather than around the textbook contrast.

  Imagine a community that introduces a predicate for a purpose of its own. A licensing board must classify buildings as safe for occupancy along a continuous scale of structural soundness, and it writes down an explicit rule fixing where the cutoff falls. Suppose the rule is itself stated in vague terms, so that there are buildings about which it is unclear whether the rule classifies them as safe, and further buildings about which it is unclear whether they fall in that first unclear zone. The community has no further facts to consult: the predicate's extension is fixed entirely by the rule and by the ordinary meanings of the words in it.

  Against that background, please explain the following in an intuitive register, without softening the technical points.

  First, what epistemicism says is going on when a competent speaker cannot tell whether a given building is safe, and what it says about the truth value of the sentence asserting that such a building is safe. In particular, explain what work the claim that there is a sharp but unknowable cutoff is doing, and why an epistemicist insists that positing such a cutoff does not make the predicate non-vague.

  Second, what supervaluationism says instead, and why it is willing to say that the sentence is neither true nor false while still holding that the corresponding disjunction — that the building either is safe or is not — is true. Explain clearly how both of those verdicts can be maintained at once, and what the notion of a precisification is supposed to be doing here.

  Third, the higher-order vagueness problem as it bears on the contrast. For a supervaluationist, what makes a building definitely safe rather than merely safe? Explain why the same reasoning that opened a gap at the first order seems to reopen one at every higher order, and why a critic charges that this either collapses into a sharp higher-order boundary — and so into a version of epistemicism — or else runs into an infinite regress. Say what a supervaluationist can and cannot say in reply.

  Fourth, tell me whether the two views actually disagree about anything at the level of use, or whether they agree on every verdict a competent speaker would reach and differ only in the metaphysical and semantic story they tell about those verdicts. If the latter, say what kind of consideration could make the dispute more than terminological.

  I am not interested in a survey of who held which view, nor in references. I want the conceptual machinery laid out so that I can see precisely where the two accounts diverge and why each is tempted by its own picture.
reasoning: |-
  We are considering a community that has introduced a predicate "safe for occupancy" by an explicit rule. The rule is stated in vague terms, leading to borderline cases and even borderline borderline cases. We are to explain how epistemicism and supervaluationism would handle this situation, focusing on conceptual differences.

  Epistemicism:

  Epistemicism claims that vagueness is a matter of ignorance. There is a precise cutoff point for the predicate "safe" in terms of structural soundness, but we cannot know what it is. In our case, the rule (even if vague) sets a sharp boundary. The vagueness of the rule's language does not prevent it from determining a specific cutoff because, according to epistemicism, every vague term has a precise boundary in reality, fixed by the way the term is used (or by the rule). However, because our cognitive abilities are limited and the rule might be complex or involve vague terms that themselves have sharp boundaries we cannot know, we are ignorant of the exact cutoff.

  - When a competent speaker cannot tell whether a building is safe, epistemicism says that this is because they lack knowledge of the exact cutoff. The building is either definitely safe or definitely unsafe (i.e., not safe) but we don't know which.

  - The truth value of the sentence "Building X is safe" is either true or false. If the building's structural soundness is above the (unknowable) cutoff, then the sentence is true; otherwise, it is false. But since we cannot know the cutoff, we cannot know the truth value in borderline cases.

  - Why does epistemicism insist that having a sharp cutoff does not make the predicate non-vague? Because vagueness, on this view, is an epistemic phenomenon. The predicate is vague because we cannot know the cutoff, and this ignorance is inherent to the concept and our use of it. The existence of borderline cases (where we cannot tell) is explained by our ignorance, not by any lack of a sharp boundary in the world.

  Supervaluationism:

  Supervaluationism denies that there is a single sharp cutoff. Instead, the meaning of the vague predicate "safe" is given by a range of ways we could make it precise (called precisifications) without violating the meaning of the rule or the words in it. Each precisification is a complete sharpening of the predicate, setting a specific cutoff. The rule and the meanings of the words in it do not fix one precise cutoff but rather a set of admissible precisifications.

  - When a competent speaker cannot tell whether a building is safe, supervaluationism says that the building is a borderline case. This means that on some admissible precisifications the building is safe, and on others it is not. Therefore, the sentence "Building X is safe" is neither true nor false (it is indeterminate) because it is not true on all precisifications and not false on all.

  - However, supervaluationism maintains that the disjunction "Building X is safe or Building X is not safe" is true. Why? Because on every precisification, either the building is safe (according to that precisification) or it is not. So the disjunction is true on every precisification, hence it is super-true (true no matter how you sharpen).

  - The notion of a precisification is doing the work of capturing the range of acceptable interpretations of the rule. The rule, being vague, allows for multiple ways of being made precise. The truth of a sentence is then defined as truth on all admissible precisifications (super-truth), and falsity as falsity on all (super-falsity). Indeterminacy occurs when a sentence is true on some and false on others.

  Higher-order vagueness:

  The problem of higher-order vagueness arises when we consider that the set of admissible precisifications might itself have vague boundaries. For example, what makes a building definitely safe? In supervaluationism, a building is definitely safe if it is safe on every admissible precisification. Similarly, it is definitely not safe if it is not safe on any. But then we have the definitely safe buildings, the definitely not safe, and the borderline (which are safe on some but not all). Now, what about the borderline between definitely safe and borderline? That would be higher-order vagueness.

  The critic points out that the same reasoning that led to a gap at the first order (borderline cases) seems to apply at higher orders. We can ask: is a building definitely safe? But the set of admissible precisifications might be vague, so there could be precisifications that differ on whether a particular building is definitely safe (i.e., safe on every precisification). This would require a second-order precisification of the notion of admissibility, and then a third, and so on. This is the infinite regress.

  Alternatively, if we try to avoid the regress by insisting that the set of admissible precisifications is sharp, then we have a sharp boundary between the definitely safe and the not definitely safe. But then the critic charges that this is just like epistemicism: we have a sharp boundary at the higher order (e.g., between definitely safe and not definitely safe) that is unknowable. So supervaluationism collapses into epistemicism at the higher order.

  What can the supervaluationist say?

  - They can deny that there is higher-order vagueness by accepting that the set of admissible precisifications is sharp. But then they must explain why we have the same kind of ignorance about that boundary as the epistemicist does. This would be a concession to epistemicism at the higher order.

  - Alternatively, they can embrace higher-order vagueness and say that the set of admissible precisifications is itself vague. Then they must provide a theory that allows for multiple orders of vagueness without collapse. One way is to use a supervaluationist framework at every level: we have a set of precisifications for the first-order predicate, and then a set of sets of precisifications for the second-order, and so on. But this leads to an infinite hierarchy and complexity. Moreover, it becomes difficult to see how we could ever settle any higher-order claim.

  - A third option is to reject the need for a sharp boundary at any order. The supervaluationist might argue that the hierarchy of higher-order vagueness is benign and does not collapse into sharp boundaries. They might also point out that the same linguistic mechanisms that generate first-order vagueness (e.g., tolerance) also generate higher-order vagueness, and that our language does not require sharp boundaries at any level.

  However, the critic will press that if we are to avoid an infinite regress, we must eventually have a sharp boundary somewhere. And if we have it at the highest level, then that level becomes epistemicist.

  Disagreement at the level of use:

  At the level of use, the two views agree on many verdicts. For example, both will say that in clear cases, a building is safe (or not). Both will say that in borderline cases, we cannot know (according to epistemicism) or we cannot say (according to supervaluationism) whether it is safe. But they differ in what they say about the truth value of borderline statements: epistemicism says they have a truth value we cannot know, while supervaluationism says they are neither true nor false.

  Moreover, they differ in their account of the logic of vagueness. For example, supervaluationism preserves classical logic for statements that are not vague (like the disjunction "safe or not safe") but denies bivalence for borderline statements. Epistemicism preserves bivalence (every statement is true or false) but must explain why we cannot know the truth values in borderline cases.

  What makes the dispute more than terminological? One consideration is the nature of truth and meaning. The epistemicist thinks that the rule, together with the facts, determines a sharp boundary. The supervaluationist thinks that the rule only constrains the boundary to lie within a range. This is a metaphysical and semantic disagreement. Another consideration is the paradoxes of vagueness, like the sorites. The two theories resolve the sorites in different ways. The epistemicist says that the sorites argument is unsound because there is a sharp boundary (though we cannot know where) so one of the premises is false. The supervaluationist says that the sorites argument is invalid because it relies on a tolerance principle that is not super-true (it fails in some precisifications). Therefore, the dispute has consequences for logic and reasoning.

  Moreover, the problem of higher-order vagueness is a challenge that each theory handles differently. The epistemicist must explain why we are ignorant at every order, while the supervaluationist must avoid either an infinite regress or a collapse into epistemicism. This is a substantive disagreement.

  In summary:

  - Epistemicism: sharp but unknowable boundary; vagueness is ignorance; preserves bivalence.
  - Supervaluationism: multiple precisifications; borderline statements are indeterminate; preserves classical logic for non-borderline statements but rejects bivalence for borderline ones.

  They agree on the practical use (we cannot tell in borderline cases) but disagree on the underlying semantics and metaphysics. The dispute is not merely terminological because it affects how we understand truth, meaning, and logic in the context of vagueness.
answer: |-
  ### Conceptual Explanation: Epistemicism vs. Supervaluationism on Vagueness

  Consider a community that defines "safe for occupancy" via an explicit rule. The rule uses vague language (e.g., "structurally sound"), leading to cases where it's unclear whether a building satisfies the rule, and further cases where it's unclear whether a building falls into *that* unclear zone. The predicate's extension is fixed solely by this rule and ordinary word meanings, with no further facts to consult. Here's how epistemicism and supervaluationism analyze this scenario.

  ---

  #### **1. Epistemicism: The Sharp but Unknowable Cutoff**
  **What it says about competence and truth:**  
  When a competent speaker cannot tell whether a building is safe, epistemicism attributes this to **ignorance**. The rule, despite its vague wording, determinately fixes a **sharp cutoff** on the structural soundness scale. This cutoff is precise—every building is objectively safe or not—but it is **unknowable** due to limitations in human cognition or the complexity of the rule's application. For example, if the rule includes phrases like "minimal risk of collapse," epistemicism insists these phrases have exact boundaries (e.g., a specific probability value), but we cannot discover them.  

  - **Truth value of "Building X is safe":**  
    This sentence is **either true or false** (bivalence holds). If Building X's soundness exceeds the sharp cutoff, the sentence is true; otherwise, false. The speaker's inability to determine this reflects epistemic limitations, not semantic indeterminacy.  

  **Why posit a sharp cutoff, and how does it preserve vagueness?**  
  The sharp cutoff does work by **grounding the predicate in reality**—it explains why the community's rule *must* draw a line (to avoid contradictions in application) and why disagreements about borderline cases are resolvable in principle. Yet, epistemicism insists this does not eliminate vagueness because:  
  - **Vagueness is epistemic, not ontological:** The predicate is vague precisely *because* we cannot know the cutoff. Borderline cases arise from our ignorance, not from any lack of precision in the world.  
  - **Competence requires ignorance:** A competent speaker knows that the rule *implies* a cutoff but cannot access it. This explains why they hesitate in borderline cases—they lack knowledge, not because truth is absent.  

  In short, epistemicism treats vagueness as a **cognitive shortfall**: the rule fixes a boundary, but we are "wired" to be blind to it.

  ---

  #### **2. Supervaluationism: Precisifications and Truth Gaps**
  **What it says about competence and truth:**  
  Supervaluationism denies any sharp cutoff. Instead, the rule and word meanings determine a **range of admissible precisifications**—ways to sharpen the vague terms consistently with the rule's intent. For example, one precisification might set the safety cutoff at a 0.1% collapse risk, another at 0.2%, both compatible with "minimal risk."  

  - **When competence fails:**  
    A competent speaker cannot judge borderline cases because **no single precisification is privileged**. Building X might be safe on some precisifications but unsafe on others. This is not ignorance; it's **genuine indeterminacy** in the predicate's application.  
  - **Truth value of "Building X is safe":**  
    This sentence is **neither true nor false**. It lacks a truth value because it is true on some precisifications and false on others.  
  - **The disjunction "Building X is safe or not safe":**  
    This is **true** (and necessarily so). On every precisification, the building is either safe or not—no precisification allows a "gap" for the disjunction. Thus, the disjunction is **super-true**: true across all precisifications.  

  **Role of precisifications:**  
  Precisifications model the **inherent flexibility** of vague language. They are not psychological constructs but **semantic options** consistent with the rule. Supervaluationism evaluates truth as **truth-on-all-precisifications** (super-truth). This:  
  - Preserves classical logic for unambiguous claims (e.g., the disjunction is super-true).  
  - Explains hesitation: Competent speakers recognize multiple precisifications are viable, so they refrain from asserting borderline claims.  

  In essence, supervaluationism replaces a single cutoff with a **cloud of cutoffs**, making vagueness a feature of meaning itself.

  ---

  #### **3. Higher-Order Vagueness: The Regress Problem**
  **What supervaluationism says about "definitely safe":**  
  A building is **definitely safe** if it is safe on *all* admissible precisifications. "Definitely not safe" means unsafe on all. Borderline cases are those that vary across precisifications.  

  **The problem:**  
  The same reasoning that created a gap at the first order (safe/not safe) reapplies to higher orders. For instance:  
  - What makes a building **definitely definitely safe**? It must be definitely safe on all precisifications, but the set of "admissible precisifications" is vague—some precisifications might exclude others, leading to vagueness in what counts as "admissible."  
  - This creates **higher-order borderline cases**: Buildings that are definitely safe on some precisifications but borderline on others. Just as first-order vagueness required precisifications, higher-order vagueness seems to require "precisifications of precisifications."  

  **The critic's charge:**  
  Supervaluationism faces a dilemma:  
  - **Collapse into epistemicism:** If the set of admissible precisifications has a **sharp boundary**, then "definitely safe" has a sharp (but unknowable) cutoff. This mirrors epistemicism at the higher order.  
  - **Infinite regress:** If the set of precisifications is vague, we need meta-precisifications to define "admissible," then meta-meta-precisifications, ad infinitum. This regress seems vicious—it never bottoms out in a determinate classification.  

  **Supervaluationist replies:**  
  - **What they can say:** Higher-order vagueness is real but manageable. We can iterate precisifications indefinitely without collapse. Competent speakers handle this by recognizing that higher-order boundaries are *also* vague—this is how language works. The regress is "benign" because it reflects the **open-texture** of vague predicates; we don't need a "final" sharpening for communication.  
  - **What they cannot say:** That higher-order boundaries are sharp without conceding epistemicism. They must embrace the regress as a feature, not a bug, or argue that higher-order vagueness tapers off in practice (though this risks ad hocery).  

  Where epistemicism posits uniform ignorance across orders, supervaluationism posits uniform indeterminacy—but the regress threatens to make "definitely" as elusive as the epistemicist's cutoff.

  ---

  #### **4. Disagreement at the Level of Use: Substantive or Terminological?**
  **Agreements in practice:**  
  Both views predict identical behavior in competent speakers:  
  - Clear cases: Agreement that a building is safe/not safe.  
  - Borderline cases: Refusal to assert "safe" or "not safe," and acknowledgment that the disjunction ("safe or not safe") holds.  

  **Divergences in metaphysics and semantics:**  
  The core disagreement is **not terminological**; it concerns the **nature of truth and meaning**:  
  - **Epistemicism** ties truth to a mind-independent, sharp boundary. Vagueness is a flaw in human knowledge.  
  - **Supervaluationism** ties truth to super-truth across precisifications. Vagueness is a semantic feature of language.  

  **What makes the dispute substantive?**  
  - **Logic and reasoning:**  
    - Supervaluationism invalidates the **bivalence** of borderline statements (they lack truth values). Epistemicism preserves bivalence but sacrifices **knowability**.  
    - This affects reasoning patterns. For example, in a sorites paradox, supervaluationism blocks the inference by noting tolerance principles fail on some precisifications; epistemicism blocks it by denying tolerance (since a sharp cutoff exists).  
  - **Metaphysical commitments:**  
    - Epistemicism implies **hidden facts** (the cutoff exists but is inaccessible). If no such facts exist (e.g., if the rule is *fundamentally* vague), epistemicism is undermined.  
    - Supervaluationism implies **truth-value gaps**. If all propositions must be true or false (e.g., due to logical or metaphysical principles), supervaluationism fails.  
  - **Higher-order vagueness:**  
    - As above, the views diverge sharply here. Epistemicism attributes higher-order vagueness to higher-order ignorance; supervaluationism to higher-order indeterminacy. The regress problem pressures supervaluationism in ways epistemicism avoids.  

  **Crucial consideration:** The dispute becomes more than terminological when we ask: **Does the rule *determine* a unique extension?**  
  - If yes, epistemicism wins (vagueness is ignorance).  
  - If no, supervaluationism wins (vagueness is semantic indecision).  

  Empirical evidence—e.g., whether competent speakers treat borderline cases as having hidden truths or as genuinely unsettled—could favor one view. Alternatively, if higher-order vagueness is incoherent without sharp boundaries, epistemicism gains ground. The choice thus hinges on deeper commitments about language, reality, and knowability.

  ---

  ### Summary of Fault Lines
  - **Epistemicism:** Vagueness is ignorance of sharp boundaries. Competence reflects awareness of this inaccessibility.  
  - **Supervaluationism:** Vagueness is semantic indecision modeled by precisifications. Competence reflects awareness of multiple options.  
  - **Key divergence:** Epistemicism anchors truth in a hidden reality; supervaluationism in a supervaluation over possibilities. The higher-order regress tests whether supervaluationism can avoid collapsing into epistemicism or incoherence.  
  - **Substance of dispute:** It is metaphysical (what exists beneath language?) and semantic (what is truth?), with implications for logic and paradox resolution. Practical agreement masks foundational discord about whether vagueness is in the world or in our words.
