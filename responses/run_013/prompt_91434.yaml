prompt: |-
  I am a novelist, and next month I am to give a two-hour craft seminar to MFA students on how to write what a character perceives. I intend to organise it around the philosopher's notion of cognitive penetration of perception — the claim that what a person believes, fears, or desires can alter not merely how she interprets what she sees but how it looks to her in the first place — and I want help planning the teaching rather than the content. Set out the order in which the components must be introduced for the idea to be intelligible at all, and say what depends on what. Nominate the single case that should carry the whole seminar: what it must exhibit and what it must be free of if the students are to grasp the difference between perception being genuinely shaped and perception being merely interpreted, and tell me whether the obvious literary example — a frightened character who sees menace in an ordinary street — can be made to do that work, or whether it will teach the opposite lesson. List the misconceptions my students will arrive with or acquire; I anticipate at least "it is just attention", "it means we see whatever we want", and "it licenses the view that each of us inhabits a different world", but I would rather hear yours. Specify where in the sequence each should be headed off and by what move. Close with one question I can put to the room at the end that would show whether the distinction has landed rather than merely been repeated, and tell me what I should explicitly refuse to settle at this level.
reasoning: |-
  Okay, the user is a novelist preparing a seminar for MFA students about writing character perception through the lens of cognitive penetration. They need help structuring the teaching sequence, not content. Let me unpack their requirements.

  First, they want the philosophical concept introduced in a way that builds logically - each step depending on the previous one. The core challenge is making students grasp that beliefs actually shape raw perception, not just interpretation. They're worried about common misunderstandings like "it's just selective attention" or "we see what we want."

  Hmm... the key is finding the perfect case study. The obvious "frightened person in a street" example might backfire because students could confuse altered perception with fearful interpretation. I recall research where wine experts literally see color differently - that's better because it's measurable and non-emotional. Must suggest that.

  For structure: start with ordinary perception, then introduce top-down processing before defining cognitive penetration. Need to explicitly contrast it with interpretation-only models. The wine case comes in here to demonstrate genuine perceptual change.

  Biggest misconceptions to tackle: 
  - "It's just attention" (counter with ambiguous figures like duck-rabbit showing beliefs resolve ambiguity at perceptual level)
  - "We see what we want" (emphasize it's involuntary and often unwanted)
  - "Everyone lives in different worlds" (clarify shared reality with slight variations)

  Should end with an application exercise: describe a neutral scene through two characters with different penetrations, avoiding emotional filters. The test question could be about whether belief changes the sensory qualities itself.

  Important to declare boundaries: won't solve philosophical debates about direct realism vs constructivism. Focus is practical writing tool.

  Need to make sure every component scaffolds the next - perception basics → top-down processing → CP definition → distinction from interpretation → case study → misconceptions → application. The wine example must show non-conscious, measurable change to be convincing.
answer: |-
  Here’s a structured teaching sequence designed to build understanding incrementally, followed by your requested components. The approach prioritizes conceptual dependencies and targets major misconceptions.

  **Teaching Sequence & Dependencies**  
  *(Each step relies on the previous; skip nothing)*  

  1. **Groundwork: Ordinary Visual Perception**  
     *Start with:* How we "see" (light → retina → neural processing → conscious image).  
     *Key:* Introduce **sensation** (raw data) vs. **perception** (organized meaning).  
     *Dependency:* Must establish baseline "normal" perception first.  

  2. **Top-Down Processing**  
     *Introduce:* How expectations/focus *guide interpretation* (e.g., reading blurred text).  
     *Emphasize:* This is **post-perceptual** ("I see *that* as a word").  
     *Dependency:* Students must grasp interpretation *after* perception to later contrast CP.  

  3. **Cognitive Penetration (CP) Defined**  
     *Define:* Beliefs/desires *directly altering* the perceptual experience itself.  
     *Stress:* Not "I interpret X as threatening" but "X *visually appears* distorted/colored".  
     *Dependency:* Requires steps 1–2 to avoid conflating with interpretation.  

  4. **The Crucial Case Study**  
     ***Nominate: Expert Perception***  
     - *What it must exhibit:*  
       - **Objective difference:** Wine experts *discern more color hues* than novices (studies show measurable perceptual acuity shifts).  
       - **Non-emotional:** Avoids conflating fear with perception.  
       - **Involuntary:** Experts can’t "turn off" refined perception.  
     - *What it must be free of:*  
       - Emotional valence (fear/desire obscures mechanism).  
       - Subjective interpretation ("it seems aged" vs. "it *looks* darker amber").  
     - *Why the "frightened street" fails:* It teaches **affective interpretation**, not CP. Students will default to "she’s paranoid, so she *thinks* it’s menacing" not "the street *visually warps*".  

  5. **CP vs. Interpretation (Explicit Contrast)**  
     *Use:* **Ambiguous figures** (e.g., duck-rabbit).  
     *Show:* Belief ("it’s a duck") *changes what you see first*, not just how you label it.  
     *Dependency:* Requires prior CP definition.  

  6. **Literary Application**  
     *Demo:* Describe a forest through a botanist’s eyes (leaves *look* hyper-detailed) vs. a lost child’s (shadows *appear* physically larger/blurred).  
     *Rule:* Ban emotional verbs ("fears," "dreads"). Use sensory language only.  

  ---

  **Misconceptions to Target & How to Defuse Them**  

  | Misconception                     | When to Address          | Defusing Move                                                                 |
  |-----------------------------------|--------------------------|-------------------------------------------------------------------------------|
  | **"It’s just attention/focus"**   | After Step 2 (Top-Down) | Contrast: Attention *selects* existing data; CP *alters* the data itself (use wine hue example). |
  | **"We see what we want"**         | During Step 3 (CP Def.) | Stress CP is *unwilled* (e.g., depressive realism: sad people *accurately* see more gray). |
  | **"Everyone inhabits a different world"** | After Step 6 (Application) | Clarify: CP *modulates* shared reality (all see wine; experts see *more hues*), doesn’t create solipsism. |
  | **"CP = unreliable narration"**   | During Step 6            | Distinguish: Unreliable narration is *interpretive*; CP is about *sensory fidelity* (how things look/sound). |
  | **"Emotions = Perception"**       | Preempt in Step 4        | Use non-emotional case study (wine/botanist). Reject "frightened street" as primary example. |

  ---

  **Closing Diagnostic Question**  
  *"Describe how a sleepless parent and a security guard might *visually perceive* the same flickering hallway light differently—without using emotions, metaphors, or assumptions about danger. Focus only on raw sensory qualities (shape, color, movement)."*  

  **What to Explicitly Refuse to Settle**  
  *"We will NOT resolve philosophical debates about direct realism vs. constructivism. Our focus is practical: how beliefs *measurably alter sensory input* for characterization, not whether reality is objectively knowable."*  

  ---

  **Why This Sequence Works**  
  - The **wine expert case** is non-intuitive, avoiding emotional baggage and demonstrating *trained, involuntary perceptual change*.  
  - **Ambiguous figures** visually prove belief alters perception (not interpretation).  
  - Banning emotional language in application **forces sensory precision**, exposing if students still conflate interpretation with perception.  
  - Addressing "attention" early prevents it from corrupting later CP examples.  
  - Ending with a **sensory-focused exercise** tests internalization: if they use emotional/interpretive language, the distinction hasn’t landed.
