prompt: |-
  I am a literary translator under contract to render a collection of formally constrained poems into English: lipograms, acrostics, syllable-counted and rhyme-locked forms, and at least one text whose governing rule is invisible to a casual reader. The decisions come one after another for months, the deadline is fixed, I work alone, and my editor — not I — has the final say on any loss I flag. Give me a decision procedure I can run on a single poem in under an hour.

  Ground it in the lesson of Le Ton beau de Marot, where dozens of defensible English versions of one short Renaissance French poem show that what has to survive translation is not the words but the work the words do. Build the procedure on a classification of what a constraint is for: ornamental (felt rather than decoded), constitutive (the text is about its own rule), mnemonic (aids recitation), covert (carries a message to insiders), or ironic (performed while mocked). Then give the ordered tests, what counts as passing each, and the point where the procedure stops and hands the call to my editor because the question is aesthetic rather than analytic. Distinguish translating the constraint, substituting a constraint native to English, compensating elsewhere in the text, and dropping it, and say what each costs and when it is defensible. Add a note on constraint drift — the same rule producing a different effect in the new language — and on visibility: whether the English reader is meant to perceive the rule at all.

  Run it on three cases: a lipogram forbidding the commonest letter in English, in a poem about absence; an acrostic spelling a name that will not fit the English line; and a metrically strict poem whose metre is invisible to contemporary readers of English. Include one ruling I will not like, and say plainly what the procedure cannot decide.

  End each case with a line beginning Ruling: followed by one of the labels preserve, substitute, compensate, drop, or refer to editor. End the whole response with a single line \answer{...} giving the default rule in at most twelve words.
reasoning: |-
  We are building a decision procedure for translating formally constrained poems. The procedure is grounded in the lesson from "Le Ton beau de Marot": the goal is to preserve the work the words do, not the words themselves. Constraints are classified by their purpose: ornamental, constitutive, mnemonic, covert, or ironic.

  The procedure involves the following ordered tests:

  1. **Identify the constraint and its purpose**: Determine which category the constraint falls into and what function it serves in the original poem.

  2. **Assess the feasibility of direct translation**: Can the constraint be replicated in English without distorting the meaning or the poetic effect? If yes, then preserve.

  3. **Consider substitution**: If direct translation is not feasible, is there a constraint native to English that serves a similar purpose? If yes, substitute.

  4. **Consider compensation**: If substitution is not feasible, can the effect of the constraint be achieved by other means elsewhere in the poem? If yes, compensate.

  5. **Consider dropping**: If none of the above is feasible, and the constraint is not constitutive (i.e., the poem is not about the constraint), then dropping may be defensible. However, if the constraint is constitutive, we must preserve it or substitute.

  6. **Refer to editor**: When the decision hinges on aesthetic judgment that the procedure cannot resolve (e.g., when multiple options are defensible but the choice depends on the overall artistic effect), we refer to the editor.

  The procedure stops and refers to the editor when the question becomes aesthetic rather than analytic. This typically happens when there are multiple defensible paths and the choice depends on the overall artistic vision.

  **Notes**:
  - **Constraint drift**: The same rule may produce a different effect in the new language (e.g., a lipogram avoiding the most common letter in French is not the same as avoiding the most common in English). We must consider if the effect is similar enough.
  - **Visibility**: We must consider whether the constraint is meant to be perceived by the reader. For ornamental, it's felt; for covert, it's hidden; for constitutive, it's central; for ironic, it's both performed and mocked.

  **Defining the costs and defensibility**:
  - **Preserve**: This is the ideal. It maintains the original constraint. Cost: It may require significant effort and may distort meaning if forced. Defensible when the constraint is central (constitutive) and feasible in the target language.
  - **Substitute**: Replaces the original constraint with a native one. Cost: It changes the specific rule but aims for a similar effect. Defensible when the original constraint is not feasible but a native one can achieve a comparable effect (e.g., replacing a French rhyme scheme with an English one).
  - **Compensate**: The constraint is dropped but its effect is achieved by other means. Cost: The constraint itself is lost, but the function is preserved. Defensible when the constraint is not constitutive and the compensation is effective.
  - **Drop**: The constraint is abandoned. Cost: The constraint's effect is lost. Defensible only when the constraint is not constitutive and the loss is acceptable (e.g., ornamental constraints that are not central and cannot be compensated).

  Now, let's run the procedure on three cases.

  **Case 1: Lipogram forbidding the commonest letter in English, in a poem about absence.**

  - The constraint: Lipogram on the letter 'E' (the most common letter in English). The poem is about absence.
  - Purpose: The constraint is likely constitutive because the absence of the letter 'E' enacts the theme of absence. It is also ornamental (the reader may feel the constraint without decoding) and possibly covert (if the reader is meant to discover the absence). 
  - Feasibility: In English, avoiding 'E' is notoriously difficult and will change the vocabulary significantly. However, since the poem is about absence, the constraint is central. Therefore, we must try to preserve it.
  - Constraint drift: The lipogram in the original language might have been on a different letter (if the original was in a language with a different most common letter). But in this case, we are told it's the commonest in English. So we are translating into English and the constraint is defined for English. Hence, we must avoid 'E'. 
  - Visibility: The constraint should be felt (ornamental) and also decoded (constitutive) because the poem is about absence. Therefore, preserving the lipogram is crucial.
  - Decision: We preserve the constraint. However, note that the difficulty in English is high. But because the constraint is constitutive, we must preserve it.

  Ruling: preserve

  **Case 2: Acrostic spelling a name that will not fit the English line.**

  - The constraint: An acrostic that spells a name. In the English translation, the name does not fit the line (probably because the lines are shorter or the name is longer in English?).
  - Purpose: The acrostic could be ornamental (if it's a hidden pattern that adds beauty), constitutive (if the poem is about that person), mnemonic (if it helps remember the poem), covert (if it's a hidden message), or ironic. Without more context, we assume it's likely ornamental or constitutive. If the name is central to the poem (e.g., the poem is dedicated to that person), then it's constitutive. Otherwise, it might be ornamental.
  - Feasibility: The original acrostic may have been designed for the original language. If the name is the same, but the lines in English are shorter, we might have to break the name across lines or adjust. However, if the name does not fit, we have options:
    - We can try to adjust the line breaks to fit the name? But the procedure says the name "will not fit", so we assume it's not feasible without distorting the poem.
    - Substitute: Use an acronym? Or a different pattern? But that might change the message.
    - Compensate: Mention the name in the poem explicitly if it wasn't already? But that might break the covert nature.
    - Drop: If the acrostic is merely ornamental and not central, we might drop it.
  - However, note: if the acrostic is covert, then we must preserve it without making it obvious. If it's constitutive, we must preserve it. But if it's merely ornamental, we can consider substitution or compensation.
  - We need to know the purpose. Let's assume that the acrostic is ornamental and covert. The name is of a lover, and the poem is a love poem. The constraint is not constitutive because the poem is not about the constraint but about love. Therefore, we can consider substitution or compensation.
  - Option: Substitute with a different pattern? For example, a telestich (last letters) or mesostich (middle letters) that spells the same name? Or use a different name that fits? That might not be defensible. Alternatively, we can compensate by including the name in the text in a way that stands out? But that might break the covertness.
  - Given the difficulty, we might refer to the editor because the decision is aesthetic. However, the procedure says to try to make a call.

  But note: the procedure says to run in under an hour. We must choose.

  - We decide: If the acrostic is not constitutive, then we can drop it and compensate by making the reference to the name more explicit elsewhere? But that might change the poem. Alternatively, we can try a different constraint that is native to English? For example, an acrostic in English that uses the first letters of each line to form a word related to the name? Or the same name but broken differently? 

  However, the problem says the name will not fit. So we might have to break it. But that would break the constraint. Alternatively, we can use the initial of each word in the first line? That might be a substitution. But that's a different constraint.

  Given that the constraint is ornamental and covert, and if we cannot preserve it without distorting the poem, we might drop it. But then we lose the covert message. 

  Alternatively, we can refer to the editor because the decision is aesthetic: whether the loss of the acrostic is acceptable or if a substitute should be used.

  But note: the procedure says to refer when the question is aesthetic. Here, we are not sure if the acrostic is central. We need to know the purpose. Let me reexamine the purpose:

  - If the acrostic is meant to be discovered by the reader (covert), then it's part of the meaning. If the name is important, then we must preserve it. But if it doesn't fit, we might have to adjust the lineation. That might be an editorial decision.

  Given the ambiguity, and because the procedure cannot decide on the level of importance without more context, we refer to the editor.

  Ruling: refer to editor

  **Case 3: A metrically strict poem whose metre is invisible to contemporary readers of English.**

  - The constraint: The poem has a strict meter (e.g., classical quantitative meter, or a complex syllabic pattern) that is not easily perceived by contemporary English readers.
  - Purpose: The meter might be ornamental (for the beauty of rhythm) or mnemonic (to aid recitation). It could also be constitutive if the poem is about its own form, but that's less likely. Since it's described as "invisible", it's not meant to be decoded? But note: the original readers might have perceived it. The purpose might be ornamental (to create a rhythm that is felt) even if the reader doesn't know the rule.
  - Feasibility: We can preserve the meter? But if the meter is based on features that don't exist in English (like vowel length), then we might have to substitute with stress-based meter. Also, contemporary English readers are not attuned to the original meter, so even if we preserve it, it might not be noticed. But the rhythm might still be felt.
  - Constraint drift: The same meter pattern might produce a different rhythmic effect in English. For example, a dactylic hexameter in English is not as natural as in Latin.
  - Options:
    - Preserve: We can try to replicate the meter. But if it's invisible and not natural in English, it might not serve the ornamental purpose (the rhythm might feel forced and not beautiful).
    - Substitute: Use a native English meter that is common and produces a similar rhythmic feel (e.g., iambic pentameter for a hexameter?).
    - Compensate: Add other rhythmic elements? But that might change the poem.
    - Drop: If the meter is not central, we might drop it and aim for free verse. But that would lose the rhythm entirely.

  Given that the meter is likely ornamental and mnemonic, we want to preserve the rhythmic feel. Therefore, substitution is a good option.

  We substitute the original meter with a native English meter that has a similar rhythm and is perceptible to contemporary readers. For example, if the original was in dactylic hexameter, we might use iambic pentameter because it is natural in English and has a similar grandeur.

  But note: the procedure says to include one ruling I will not like. In this case, the ruling to substitute might be disliked by a translator who wants to preserve the exact form.

  Ruling: substitute

  **Summary of Rulings**:
  1. Lipogram: preserve
  2. Acrostic: refer to editor
  3. Meter: substitute

  **What the procedure cannot decide**: The procedure cannot decide on the relative importance of a constraint without clear indicators of its purpose. It also cannot resolve aesthetic trade-offs when multiple solutions are defensible.

  **Default rule in twelve words**:
  Preserve constraints unless infeasible; substitute for native analogues when necessary; compensate or drop only if non-constitutive.
answer: |-
  ### Decision Procedure for Constrained Poetry Translation  
  Based on *Le Ton beau de Marot*, focus on preserving the **function** of constraints (the "work the words do"), not the words themselves. Constraints are classified by purpose:  
  - **Ornamental**: Creates aesthetic pleasure; felt intuitively, not decoded (e.g., meter).  
  - **Constitutive**: The text’s meaning depends on the rule (e.g., lipogram about absence).  
  - **Mnemonic**: Aids memorization/recitation (e.g., strict rhyme).  
  - **Covert**: Hides a message for insiders (e.g., acrostic spelling a name).  
  - **Ironic**: Simultaneously enacts and mocks the constraint (rare; treat as constitutive).  

  #### Ordered Tests (Run Sequentially; Stop at First "Pass" or Referral)  
  1. **Is the constraint constitutive or ironic?**  
     - *Test*: If dropping it voids the poem’s core meaning (e.g., a lipogram *about* absence), proceed to Test 2.  
     - *Pass*: Must preserve or substitute; fail here only if non-constitutive.  
     - *Cost of failure*: Irreparable semantic loss.  

  2. **Can the constraint be directly translated without distorting function?**  
     - *Test*: Replicate the rule in English while matching tone, imagery, and emotional impact.  
     - *Pass*: Feasible and functionally identical (e.g., lipogram avoiding English’s "e" ≈ French "e" avoidance).  
     - *Cost*: High effort; risk of awkwardness if forced.  
     - *Defensible*: Always for constitutive/ironic; for others, if no drift (see Note).  

  3. **Can a native English constraint substitute with similar effect?**  
     - *Test*: Replace with a target-language analogue (e.g., swap a French rhyme scheme for an English one).  
     - *Pass*: New constraint serves the same purpose (e.g., mnemonic → mnemonic).  
     - *Cost*: Alters the "fingerprint" but retains intent.  
     - *Defensible*: For ornamental/mnemonic/covert constraints if original is infeasible.  

  4. **Can the constraint’s function be compensated elsewhere?**  
     - *Test*: Amplify other elements (e.g., add alliteration to replace a dropped meter).  
     - *Pass*: Compensation achieves the constraint’s purpose without the rule itself.  
     - *Cost*: May subtly shift emphasis.  
     - *Defensible*: For ornamental/mnemonic constraints; never for constitutive/covert/ironic.  

  5. **Is the constraint droppable without functional loss?**  
     - *Test*: Only if ornamental/mnemonic and compensation fails.  
     - *Pass*: The poem still "works" (e.g., a dropped meter doesn’t erase themes).  
     - *Cost*: Loss of texture or cultural resonance.  
     - *Defensible*: As last resort; never for constitutive/covert/ironic.  

  6. **Refer to editor**  
     - *Trigger*: Aesthetic trade-offs with no clear analytic solution (e.g., multiple valid paths, subjective impact).  
     - *Criteria*: When Tests 2–5 yield ties, or visibility (see Note) is ambiguous.  

  #### Key Notes  
  - **Constraint Drift**: Same rule, different effect in English (e.g., avoiding "e" in English is harder than in French). Mitigate by prioritizing functional equivalence over formal fidelity.  
  - **Visibility**: Is the reader meant to perceive the rule?  
    - *Visible*: Constitutive, ironic, overt mnemonics (preserve/substitute).  
    - *Invisible*: Ornamental, covert (compensate/drop if necessary).  

  ---  
  ### Case Applications  
  **Case 1: Lipogram forbidding the commonest letter (English "e") in a poem about absence.**  
  - *Purpose*: **Constitutive** (absence of "e" embodies thematic absence).  
  - *Test 2*: Direct translation is feasible but arduous (e.g., "e"-less synonyms for "absence": "lack," "void"). Constraint drift is minimal (avoiding "e" is iconic in both languages).  
  - *Visibility*: High (reader should notice).  
  - *Ruling you may dislike*: You must preserve despite difficulty—constitutive constraints are non-negotiable.  
  - **Ruling: preserve**  

  **Case 2: Acrostic spelling a name that won’t fit English lines.**  
  - *Purpose*: Likely **covert** (hidden message for insiders) or **ornamental**.  
  - *Test 2*: Direct translation fails—name mismatches line breaks.  
  - *Test 3*: Substitute with a native constraint? English acrostics are flexible (e.g., use initials), but may alter the name.  
  - *Test 4*: Compensate? Add the name explicitly elsewhere—but breaks covertness.  
  - *Test 5*: Drop if ornamental? Risky for covert; erases "insider" meaning.  
  - *Referral trigger*: Aesthetic choice: sacrifice covertness or distort lines? Editor must weigh cultural intent.  
  - **Ruling: refer to editor**  

  **Case 3: Metrically strict poem with metre invisible to contemporary English readers.**  
  - *Purpose*: **Ornamental** (felt rhythm) or **mnemonic** (aids recitation).  
  - *Test 2*: Direct translation possible but "invisible" to modern readers → functional drift (rhythm goes unnoticed).  
  - *Test 3*: Substitute with English stress-based metre (e.g., iambic pentameter). Native analogue serves the same purpose (ornamental/mnemonic).  
  - *Ruling you may dislike*: Substitution prioritizes function over form—pure preservation wastes effort if readers miss it.  
  - **Ruling: substitute**  

  ---  
  **What the procedure cannot decide**: Subjective trade-offs between historical authenticity and modern readability (e.g., when a constraint’s invisibility in English justifies discarding it despite original intent).  

  \answer{Preserve constitutive constraints; substitute or compensate others; drop only ornamental/mnemonic.}
