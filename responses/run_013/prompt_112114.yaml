answer: |-
  ## The Lottery Ticket

  The notification ping sounded exactly like my pizza delivery alert. That’s the first thing I remember. Just another Wednesday, slumped on the couch scrolling through college app portals that all blurred into one giant "Why Bother?" screen. Finals were breathing down my neck, Dad was on another "responsibility" rant, and my sister was playing some hyperactive VR game that involved a lot of yelling. Normal chaos. The ping cut through it – a bright, cheerful *ding* from my wristband. Probably just the confirmation for the tacos Mom ordered. Or maybe that drone-delivered burrito I’d gotten last week when I was too lazy to bike five blocks to El Jefe’s.

  Except the notification wasn’t green. It was a sickly, pulsing amber. **"Public Accountability Notification. Action Required."** Below it, a string of numbers and letters I didn’t recognize, and the logo: **SkySwift Deliveries**.

  My gut clenched. SkySwift. The drones. Everyone knew about the lottery. We joked about it. "*Don’t order that extra-large fries, dude, you might win the prison sweepstakes!*" But it was background noise, like the constant hum of the maglev trains outside or the flickering holo-ads on the apartment towers. Something that happened to other people. Distant news items. Old Mrs. Henderson down the hall muttered about it being "uncivilized," but everyone else seemed to just… accept it. The price of convenience, they said. If we all benefit from the drones and the driverless pods zipping us around, we all share the burden when they glitch. Spreads the risk. Makes the companies build safer stuff, supposedly. Makes *us* care more about the systems we use.

  I opened the notification. Cold dread washed over me, turning my hands numb.

  **"Citizen ID: K-7348-J (Kai Evans)**
  **Selected: SkySwift Accountability Lottery – Incident #S-2219**
  **Mandatory Compliance Appointment: Probation Sector 7, Tomorrow, 10:00 AM**
  **Failure to Appear: Escalated Penalties Apply."**

  Incident #S-2219. I knew that one. It was all over the feeds last week. A SkySwift Model 4 delivery drone – one of the big, fast ones – malfunctioned during a routine drop-off downtown. Lost altitude control. Slammed into a pedestrian walkway on the old Granville Bridge. Knocked a woman named Anya Petrova clean off the edge. She survived the fall, barely, but the neural implants she relied on for managing her chronic pain shorted out completely. Doctors said she’d never regain full cognitive function. She was 38. A music teacher.

  And I was "accountable." Because I’d ordered a damn burrito.

  The Probation Sector office smelled like antiseptic and stale regret. Fluorescent lights buzzed overhead, highlighting the cheap, scuffed synth-wood desks. A bored-looking officer with tired eyes scanned my band, then pulled up my file on a shimmering holo-screen.

  "Kai Evans. Confirmed. Lottery selection for Incident S-2219, SkySwift Deliveries." His voice was flat, devoid of judgment or sympathy. Just procedure. "As the selected beneficiary–"

  "Beneficiary?" The word burst out of me, sharp and incredulous. "I ordered *one* burrito! How does that make me a beneficiary? How does that make me responsible for… for *that*?" I pointed vaguely at the screen, where a grainy still of the shattered drone lay next to a smiling photo of Anya Petrova.

  The officer sighed, like he’d heard this a thousand times. "The law defines anyone who utilized the SkySwift system within the thirty-day period preceding the qualifying incident as a beneficiary of the service network. Your single transaction places you within the pool of individuals who derived benefit, and therefore share the associated societal risk."

  "But I didn't *do* anything wrong! The drone malfunctioned! The software glitched! Or maybe someone hacked it? Shouldn't SkySwift pay? Or the engineers? Why *me*?"

  "The traditional attribution model proved… inefficient," the officer recited, clearly quoting a manual. "Complex systems, distributed responsibility, corporate shielding. The lottery ensures accountability resides with the community that enables and profits from the technology. It incentivizes user vigilance and corporate transparency. Your sentence reflects the severity of the outcome attributed to the system failure."

  He slid a datapad across the desk. "Standard sentence for grievous bodily harm via Level 3 Autonomous System Failure: Eighteen months in a minimum-security rehabilitation facility, or equivalent community service under strict monitoring. Sign here to acknowledge your compliance and schedule intake."

  Eighteen months. My junior year. College applications. My life. For a burrito. The room tilted. "What if I don't sign?" My voice was a whisper.

  "Failure to comply triggers automatic escalation. Mandatory maximum-security detention. Asset seizure. Permanent record flag. Signing is your only viable path."

  My finger hovered over the pad. It felt like signing my own death warrant. Or Anya Petrova's. Or maybe both. I saw her face again on the screen. The music teacher who’d never teach again. Someone *should* pay. But was it me? Or was it… nothing? A ghost in the machine? A glitch in the code no single person wrote or intended? A system humming along, delivering burritos and broken bodies, and demanding a blood sacrifice from the nearest warm body?

  I didn't sign. "I need… I need to think."

  The officer looked annoyed. "You have 48 hours from this appointment. Non-compliance clock starts now."

  ***

  The next 24 hours were a blur of panic and desperate research. My parents argued fiercely – Mom crying that I had to comply, protect my future; Dad grim-faced, saying the law was the law, however stupid. My sister just stared at me like I was radioactive. I scoured the net. Found the accident reports: "Unforeseen cascade failure in the collision avoidance subroutine during unexpected atmospheric shear." Meaningless jargon. Found SkySwift’s bland statement expressing regret and highlighting their trillion-dollar contribution to urban efficiency. Found Anya Petrova’s sister’s impassioned plea on a victim’s forum: "Someone must answer. Someone must be held responsible for taking her life away."

  That word echoed. *Someone.* But who? The coder who wrote the subroutine five years ago? The tester who missed the edge case? The CEO who pushed for faster delivery times? The city planner who approved drone routes over pedestrian bridges? Me, for wanting a cheap, quick lunch?

  The "someone" the law had found was me. Randomly. Like a lightning strike.

  That’s when the message arrived. Not a notification. A direct comm. From a producer at *CityWatch Live*, the biggest local news stream. "Kai Evans? We understand you’ve been selected in the SkySwift lottery. We’d like to offer you a platform. To tell your story. Live. Tonight."

  A trap? Or a lifeline? Did I want to be the face of the terrified kid? Or… could I be the face of something else? The absurdity? The gaping hole where responsibility should be?

  ***

  The studio lights were blindingly hot. I squinted, sweat prickling under the cheap suit Mom had dug out of a closet. The host, Lena Vance, smiled with perfectly calibrated concern. "Kai, thank you for joining us tonight. This must be incredibly difficult. You’ve been selected by the Accountability Lottery to bear the sentence for the tragic incident involving Anya Petrova and a SkySwift drone. Tell us, what are you feeling right now?"

  The cameras felt like predatory eyes. Millions watching. Anya Petrova’s sister was probably watching. The SkySwift lawyers. The bored probation officer. I took a shaky breath. Stick to the script? Plead for mercy? Or…

  "I feel like I’m in a nightmare," I started, my voice raspy. "One minute I’m worrying about chemistry finals, the next I’m told I have to go to jail because a machine I had nothing to do with building, or owning, or even really thinking about… killed someone." I swallowed hard. "I ordered a burrito. That’s it. One transaction. One moment of laziness. And now my life is supposed to pay for a catastrophic system failure?"

  Lena leaned in, oozing sympathy. "The law states that by using the service, you benefited from it, and thus share in its risks. Many argue this shared burden fosters a safer technological ecosystem. What do you say to that?"

  This was it. My stomach churned. "Fosters safety? How?" My voice gained a little strength, fueled by the sheer, terrifying absurdity of it all. "Did my burrito order make me an expert in drone navigation software? Did it give me a vote in SkySwift’s safety protocols? Does it magically make me responsible for lines of code I never saw, decisions made in boardrooms I’ll never enter?" I looked straight into the nearest camera lens, imagining the faceless viewers. "This lottery… it doesn’t find the *responsible* party. It just finds *a* party. Any warm body who happened to tap 'order now'. Because the *real* responsible party… it isn’t a person. It’s the system itself. This whole tangled mess of technology, corporate profit, legal loopholes, and our own dumb desire for convenience."

  The studio was dead silent except for the hum of the lights. Lena’s sympathetic mask flickered. "But Kai, without the lottery, without *someone* paying the price… what happens? Anya Petrova suffers horribly, and no one is held accountable? The system fails, and faces no consequences? Isn't the lottery, however imperfect, better than total impunity? Doesn't *someone* have to pay?"

  Her words hit me like physical blows. *Someone has to pay.* Anya Petrova’s sister’s plea echoed in my head. Justice demanded a face, a name, a punishment. The law provided a mechanism: me. A sacrificial lamb to appease the gods of order. The system – complex, inhuman, unfixable by punishing one random user – demanded a scapegoat. And I was it.

  I looked down at my hands. They were trembling. The weight of Anya Petrova’s shattered life, the cold logic of the lottery, the terrifying void of the responsibility gap – it all crashed down. Lena Vance was waiting. The city was waiting. The system was waiting for its pound of flesh.

  "I…" My voice cracked. I didn’t know what to say. The argument felt hollow suddenly. Philosophical. Anya Petrova wasn't philosophy. Her pain was real. The drone was real. The law was real. And the demand for *someone* to pay… that felt the most real of all. The lights burned. The silence stretched. I had no answer. Just the crushing weight of a debt I didn't incur, owed to a victim I never met, demanded by a system that operated beyond any single person's control. *Someone has to pay.* The words hung in the air, unanswered, terrifying, and utterly inescapable.

