  For the covering-law approach, I should present it at its strongest: searching for general patterns like state legitimacy erosion or crowd behavior thresholds, while acknowledging that antecedent conditions would be extremely complex to specify. The unpredictability argument needs careful handling - Hempel himself acknowledged explanation doesn't require predictability.

  For narrative explanation, I'll need to show how starting points (Hungarian border? Leipzig protests?) and endpoints (just that night? German reunification?) fundamentally change which details matter. The narrative relies on contingent connections between events rather than laws.

  When evaluating their criterion, I should note that narrative explanations do contain implicit generalizations (about how announcements affect state control, how crowds behave at borders), but these aren't framed as universal laws. The key difference might be whether generalizations are the engine of explanation or just background support.

  The classmate's objection about decisions under uncertainty is worth addressing - unpredictability doesn't equal inexplicability, but covering-law models do struggle with unique conjunctures of decisions. This might be where narrative explanations shine.

