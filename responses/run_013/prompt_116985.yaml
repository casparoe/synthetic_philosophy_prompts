prompt: |-
  I'm in a metaethics reading group and we keep having the same fight, so I want to get it straight before Thursday. Our TA has this line he's very attached to: thought experiments in ethics are just experiments. You set up a case, you hold everything fixed, you change one thing, you see what intuition comes out, and if the intuition is stable you've got a datum. On his view that's why trolley cases deserve respect and why people who roll their eyes at "intuition pumps" are sneering at the only instrument we've got. Last week he put it as: the trolley case is to ethics what the frictionless plane is to mechanics, a cleaned up setup that isolates the thing you actually care about. I pushed back and got told I was being anti-science about it, which felt like a dodge, but I also can't articulate whats wrong with it, so maybe there isn't anything.

  How far does the analogy actually hold? I'd like the correspondences laid out explicitly, what plays the role of the apparatus, the sample, the variable held fixed, the measurement, the replication, the background theory, the error bar, and then where the mapping breaks. The two bits I keep half seeing and can't nail down: in a real experiment the instrument is independent of the thing being measured, whereas here the instrument is the same faculty we're supposedly learning about; and in a real experiment "holding everything fixed" is something you can defend by saying which perturbations count as noise, whereas here the author of the case gets to decide which features are morally irrelevant. If it does break, I want to know which disanalogies actually matter for the conclusion he's using it for, namely that the trolley verdicts are evidence about what's right, and which ones are just decoration, and whether that conclusion survives once the disanalogies are on the table. And if there's a better analogy for what a thought experiment is doing, tell me what it is and whether it does any better or just relocates the problem, because I suspect the frictionless plane thing is doing more work in his argument than he'd admit.

  One more thing. I'm a beginner and I genuinely can't tell when I'm being sold a controversial line as if it were the boring standard view, so please be explicit about what's actually settled among people who work on this and what's genuinely contested, especially the empirical stuff about whether these verdicts replicate across populations, which I've now heard asserted confidently in both directions. Flag where your own answer is doing philosophy rather than reporting, and dont tell me the analogy "fails" or "holds" if the honest answer is that it holds for some uses and not others.
