prompt: |-
  I'm a third-year HPS student and I keep bumping into the line 'no instant rationality' in seminar, usually as a conversation-stopper. Last week someone used it to block a demand that we say now whether a certain research programme (computational psych, lots of auxiliary machinery, I'll spare you) is degenerating — the reply was basically "you can't ask that yet, Lakatos settled this." I don't think that's quite what's going on, but I can't articulate why, and I have to run a session on it next month.

  Can you lay out the distinct precise claims that one-liner could be making, from the trivial to the radical? I mean things like: is it a claim about how long evidence takes to accumulate, or about the logical form of appraisal (no criterion can deliver a verdict at a time-slice), or about the unit of appraisal being a whole programme over decades rather than a theory at a time, or about rational reconstruction being retrospective so that rationality is a property of the narrative and not of the events, or just a slide into anything-goes. For each reading, tell me whether its defensible and whether it actually delivers the conclusion my seminar-mate wanted — that we aren't yet entitled to call the programme degenerating. If some readings do the work and others dont, say which one is silently doing the work when people repeat the phrase.
