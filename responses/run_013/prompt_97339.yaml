answer: |-
  ## Handout Closing Poem: Transformative Threshold  

  **BEFORE**  
  They say the *dark* will hold a kind of *sound*,  
  A *pulse* to *trace* where eyesight used to *weigh*.  
  I *count* the cost: the *bright* world lost, profound  
  Stillness exchanged for restless *map*. I *pray*  
  This new sense grants a finer *grasp*. The *ground*  
  Seems firm enough. What’s *known* must show the way.  

  **AFTER**  
  The *sound* is not a tool; it is the *ground*.  
  No *map* remains of what I used to *know*.  
  This *pulse*—I *drink* it. *Trace*? I thirst, unbound.  
  The *bright* you *pray* to keep? I let it go.  
  This *dark* is not to *grasp*, but to be *found*.  
  To *weigh* the old self’s cost? Where *counts* now flow?  

  ---

  **Choices & Weaknesses:**  
  I chose echolocation ("vampire-adjacent") to avoid parental clichés and force sensory rewiring. End words shift from tools ("trace," "map," "grasp," "count") to experiences ("drink," "found," "flow"), enacting the epistemic break. The "After" rejects calculation ("count," "weigh," "cost") showing the prior self's conceptual failure. Weakness: "bright" in the "After" risks nostalgia, perhaps softening the rupture. "Found" might slightly echo "ground," dulling the disorientation. The greatest challenge was making the "After" inhabit the transformation without explaining it, letting the repurposed words carry the incommunicable weight.
