  hey, I'm trying to seperate epistemic contextualism from pragmatic encroachment in my head and I keep blurring them together, so I think the cleanest way is to look at a case where they actually disagree rather than where they agree (the bank cases just make them look like the same idea). Can you give me one concrete example — same scenario, same knowledge claim, but the two theories give opposite verdicts on whether that claim is true? Something like: the subject's own practical stakes are low but whoever's doing the attributing is in a high-stakes spot, or the other way round. Then spell out which theory says what and why, and flag which of the two the example is harder on. One more thing: please don't make the knower a normal single human — use something like a corporation, or a group, or an animal, i.e. a thing whose "practical interests" are themselves up for grabs — and say whether that ambiguity actually breaks one of the two theories or just makes the whole thing messier.
