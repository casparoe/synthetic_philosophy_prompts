prompt: |-
  My roommate and I keep arguing about whether a certain startup is going to survive, and we're stuck: we've read all the same reporting, we agree on the base rate for startups like this, and we even agree on how likely each of those reports would be if the company were about to succeed versus fail. Yet I'm sitting at 85% and shes at 15%, and neither of us will move. I know Aumann's agreement theorem says two rational agents can't agree to disagree, and since we've got the same priors and the same evidence and we're both being rational, doesn't one of us have to be the one whos being irrational? How do I figure out which of us it is? And once we've both said our numbers out loud and made them common knowledge, shouldn't we just snap into agreement?

  Please answer with these sections: Where the question goes wrong (about 150 words), What the theorem actually says (about 200 words), Where our disagreement must be coming from (about 200 words), and Bottom line (a few sentences).
