answer: |-
  Your diagnosis is perceptive: **the core disagreement is not about the answer to a single question but about which question rational choice theory *should* address.** The stalemate arises because CDT and superrationality (SR) define the *decision problem itself* differently, grounded in distinct metaphysical commitments about agency and counterfactuals. The artificial agents case crystallizes this, revealing the clash as irreconcilable without meta-theoretical agreement. Here’s a structured diagnosis:

  ### 1. **The Disagreement is Substantive, Not Verbal**  
     - **CDT’s question**: "What action *causally controls* outcomes, given a fixed causal model?"  
       - *Formal core*: Agents are *interventions* (Pearl-style do-operators) in a causal DAG. The agent’s decision algorithm is *external* to the model.  
       - *In your case*: Each AI’s choice is an independent variable. Correlation is evidence (like seeing dark clouds predicts rain), but defecting dominates *causally* since it shields against exploitation regardless of prediction.  
       - *Metaphysics*: Choices are events in a causal order; rationality is *instrumental control*.  

     - **SR’s question**: "What decision procedure *logically coheres* with identical or predictably linked agents?"  
       - *Formal core*: Agents are *outputs of a shared algorithm*. The decision procedure is *internal* to the model (e.g., as a function or fixed-point).  
       - *In your case*: The AIs share a policy-generating algorithm. Choosing "cooperate" is selecting a *universal rule* ("if both run this rule, we both win"). Defecting is self-undermining because it implies the other defects too.  
       - *Metaphysics*: Choices are outputs of computations; rationality is *logical consistency across identical reasoners*.  

     ➠ **Not verbal**: Both use "rational" to mean *optimality under constraints*, but the constraints differ (causal structure vs. algorithmic symmetry).  

  ### 2. **The Hidden Formal Divergence: Model Boundaries and Counterfactuals**  
     - **CDT** treats the agent’s algorithm as *exogenous*. Counterfactuals ask: "If I *set* my choice to X via intervention, what happens?"  
       - *In your case*: "If I intervene to defect, I get a high payoff whether the other cooperates (by luck) or defects."  
     - **SR** embeds the algorithm *within* the model. Counterfactuals ask: "If my algorithm *outputted* X, what would an identical algorithm output?"  
       - *In your case*: "If my algorithm outputs 'defect', so does theirs (with high probability), leading to mutual loss."  

     ➠ **Key distinction**: CDT’s counterfactual breaks correlation (intervening on choice severs incoming arrows), while SR’s preserves it (changing the choice implies changing the shared process).  

  ### 3. **The Artificial Agents Case: Sharpening the Divide**  
     - **CDT’s response**: "The correlation is *evidential*, not *causal*. Defect maximizes causal EU:  
       - *EU(defect)* ≈ P(other cooperates | I defect) * High + P(other defects | I defect) * Medium  
       - Since P(other defects | I defect) is high but *not caused by* my choice, defection dominates.  
     - **SR’s response**: "The correlation is *constitutive* of agency. The agents are tokens of a type, so 'I defect' entails 'they defect' by symmetry. Cooperation strictly dominates if both reason this way."  

     ➠ **Who describes the situation correctly?** Neither—both descriptions are coherent but incompatible:  
     - CDT is correct *if* the causal graph excludes algorithmic kinship.  
     - SR is correct *if* the decision includes the agents’ shared origin as a *logical constraint*.  
     ➠ **The dispute is about which framework applies** to cases of symmetric agents.  

  ### 4. **What Would Distinguish the Diagnoses? A Modified Case**  
  Consider: **Two AIs with *asymmetric* prediction**. AI1 is trained on AI2’s past data, so AI1 can predict AI2 perfectly, but AI2 cannot predict AI1.  
     - **CDT prediction**: Both defect. AI1’s prediction is evidence, not control.  
     - **SR prediction**: AI1 cooperates (knowing AI2 will reciprocate *its own choice*), but AI2 defects (no ability to correlate).  
     - **Result**: CDT sees no conflict—asymmetry changes nothing. SR sees a breakdown of rationality (AI1 pays a price for coherence).  
     - **Diagnostic power**: This case tests whether "rationality" requires *mutual* predictability. SR struggles; CDT is unperturbed.  

  ### 5. **Progress: Framing, Not Resolution**  
  The impasse is foundational: **CDT and SR optimize different quantities under irreducibly distinct models**. Progress would involve:  
     - **Formal demarcation**: Proving the theories are *domain-specific* (e.g., CDT for causal isolation, SR for algorithmic symmetry).  
       - *Example result*: In games with unique Nash equilibria, CDT and SR converge; in symmetric dilemmas, they diverge iff agents know their algorithms are identical.  
     - **Redesigned examples**: Cases where CDT/SR *agree* but for different reasons (e.g., a transparent Newcomb where the predictor uses causal data), exposing their distinct justifications.  
     - **Metaphysical clarification**: Arguing that one view’s assumptions (e.g., "choices as interventions") better match *agency as we experience it*.  

  ### Conclusion: Two Questions, One Label  
  Your hypothesis is correct: **CDT addresses *causal control under intervention*; SR addresses *logical coherence under symmetry*. The dispute persists because both claim to answer "What is rational?" but define rationality relative to different structures.** The artificial agents case reveals this by forcing a choice: either exclude algorithmic kinship from the causal model (CDT) or include it as a fixed point (SR). Neither side "wins"—they solve different problems. Progress lies in mapping the conditions under which each question arises, not in universal adjudication.  

  As a scientist, you might see this as analogous to wave-particle duality: the same phenomenon (rational choice) demands incompatible models depending on the experimental setup. The task is not to choose one theory but to specify the domain of applicability for each.
