  We create a JSON object with the three cases. Each case has the specified fields.

  Note: The "verdict" field is a summary statement. We also break down the types of responsibility.

  Case 1: Germany for WWI outbreak.
  Case 2: Allied governments for the 1919 settlement and blockade.
  Case 3: People for government crimes.

  We use the following for "group_agency": "full", "partial", "none".

  In Case 3, the collective is "the people", so group agency is likely "none" or "partial" depending on the example. We'll use a generic example (like the German people under the Nazis) for the case.

