answer: |-
  ### Decision Procedure for Attributing Responsibility in Historical Contexts

  The procedure below is designed to guide the committee through consistent, evidence-based attributions of responsibility. It separates causal, moral, legal/diplomatic, and remedial dimensions; clarifies group agency; and identifies points where value judgments must be deferred. The committee must follow steps in order, document reasoning for each answer, and halt attribution if evidence or conceptual clarity is insufficient. The editorial board resolves value questions.

  #### Decision Procedure Table
  | Step | Question to ask                                                                                                                               | What counts as a sufficient answer                                                                                                                                                                 | What to do if the answer is insufficient                                                                                                                             | Who signs off           |
  |------|-----------------------------------------------------------------------------------------------------------------------------------------------|----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|----------------------------------------------------------------------------------------------------------------------------------------------------------------------|-------------------------|
  | 1    | **Causal Contribution**: Did the collective entity’s action or omission significantly alter the likelihood of the outcome? Apply a counterfactual: "But for this action/omission, would the outcome likely have been different?" (For overdetermined outcomes: "Was the entity’s action sufficient to cause the outcome independently?") | Historical evidence (e.g., documents, decisions, patterns) showing a direct or indirect causal link. Must pass the counterfactual test or demonstrate sufficiency in overdetermined cases.                                                                 | If evidence is ambiguous, contradictory, or fails the counterfactual test (e.g., outcome would have occurred anyway), mark causal contribution as "unassignable" and move to Step 2. | Committee majority     |
  | 2    | **Moral Culpability**: Did the entity knowingly make a choice that violated widely accepted moral norms of the time, with reasonable alternatives available?                                               | Evidence of intent, knowledge of consequences, and alternatives (e.g., policy debates, personal accounts). Must align with contemporary moral standards (not modern reinterpretations).                                                                        | If intent, knowledge, or alternatives cannot be established, or if moral norms of the era are contested, mark moral culpability as "unassignable" and defer the value question to the board. | Committee (facts only); Board (value judgment) |
  | 3    | **Legal/Diplomatic Liability**: Did the entity breach specific, binding legal obligations or diplomatic norms at the time?                                                                                   | Evidence of a clear violation (e.g., treaties, customary laws, diplomatic correspondence). Must reference explicit rules, not abstract principles.                                                                                                            | If laws/norms were ambiguous, nonexistent, or unenforceable, mark legal liability as "none."                                                                          | Committee majority     |
  | 4    | **Remedial Responsibility**: Does the entity have a unique capacity or obligation to repair harm or prevent recurrence?                                                                                     | Evidence that the entity caused harm (from Step 1), was culpable (Step 2), or holds special capacity (e.g., resources, authority). Must show a direct link to the harm.                                                                                      | If no causal/moral/legal responsibility exists and capacity is not unique, mark remedial duty as "none."                                                               | Committee majority     |
  | 5    | **Group Agency**: Could the entity reasonably act as a collective decision-maker? (i.e., did it have mechanisms to form, execute, and be accountable for choices?)                                          | For governments/armies: evidence of structured decision-making (e.g., laws, hierarchies). For peoples/economies: evidence of broad participation or endorsement (e.g., elections, public support, economic policies benefiting from actions). For omissions: evidence of collective capability to act. | If no decision-making structure exists (e.g., a "people" without democratic input), mark agency as "none" and halt attribution to the collective. Only individuals may bear responsibility. | Committee majority     |
  | 6    | **Final Verdict**: Can responsibility be assigned based on Steps 1–5?                                                                                                                                  | Explicit statement of: (a) type(s) of responsibility assigned (causal, moral, etc.), (b) degree of group agency (full/partial/none), (c) confidence level. Must reconcile inconsistencies from prior steps.                                           | If any step is "unassignable" or agency is "none," state: "Responsibility cannot be attributed to this entity." Do not manufacture a verdict.                                 | Committee and Board (if values deferred) |

  **What the Procedure Cannot Do**:  
  - Resolve fundamental philosophical disputes (e.g., "Can collectives bear moral guilt?").  
  - Overrule conclusive historical evidence.  
  - Apply modern moral/legal standards retroactively without board approval.  
  - Assign responsibility to non-agential groups (e.g., "a people" without decision-making structures).  
  - Force consensus; deadlocks trigger deferral.

