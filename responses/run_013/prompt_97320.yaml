prompt: |-
  I chair the historical content committee of a publisher that is preparing a multi-volume history of twentieth-century conflict for upper-secondary classrooms. Each chapter must state, in terms that will withstand both academic review and diplomatic complaint, what responsibility a named state, government, or people bears for a war or an atrocity. The committee has four members — two academic historians, a teacher, and a lay member appointed by the board — meets for two hours a fortnight, and may defer at most one contested case per meeting; the editorial board may overrule us only if we have failed to show our reasoning. Every chapter raises the same question in a new form: whether to write that Germany sought the First World War, that the Allied governments imposed a punitive peace, or that a particular administration was responsible for a famine. We have no shared method, and our verdicts have been inconsistent from chapter to chapter.

  Please turn what the philosophy of collective and shared responsibility, together with the historiographical controversy provoked by Fritz Fischer's argument in the early 1960s that Germany bore the chief responsibility for the outbreak of the First World War and had deliberately sought a war to become a world power, actually teaches into a decision procedure the committee can run case by case. The procedure must:

  - ask its questions in a fixed order, and say what counts as a sufficient answer to each;
  - keep apart the several things "responsibility" is used for — causal contribution to an outcome, moral culpability for a choice, legal or diplomatic liability, and the forward-looking duty to repair or prevent — and say which one it is assigning at each step;
  - say how causal contribution is to be tested, including by a counterfactual test, and where that test fails, as with overdetermined outcomes and omissions;
  - say when responsibility can attach to a people, a government, an army, or an economy, and when it can attach only to named individuals, given that a people is not a decision-making body;
  - stop with an explicit refusal to attribute responsibility when the evidence or the concept will not carry the weight, rather than manufacture a verdict;
  - mark the points where the question becomes one of values rather than of fact, and hand those to a named person or to the board instead of settling them itself;
  - and state plainly what the procedure cannot do.

  Then run it on three cases: (1) the responsibility of Germany for the outbreak of the First World War, in light of Fischer's argument; (2) the responsibility of the Allied governments for the terms of the 1919 settlement and for the continuation of the blockade into 1919; and (3) the responsibility of a people, as distinct from the government that acted in its name, for that government's crimes. At least one verdict should be one the committee will not welcome; say which, and why.

  Do not cite works, authors, dates of scholarship, or reading lists, and write so that a reader who has not studied the literature can follow and apply the procedure.

  Give the procedure as a table with these columns: Step | Question to ask | What counts as a sufficient answer | What to do if the answer is insufficient | Who signs off. Then give a single JSON object with one entry per case, each entry having the fields: "case"; "collective"; "causal_contribution"; "moral_responsibility"; "legal_or_diplomatic_liability"; "remedial_responsibility"; "group_agency" (one of "full", "partial", "none"); "verdict"; "confidence" (one of "high", "medium", "low"); "cannot_be_settled_by_the_procedure"; "residual_value_question" (what it is, and who must decide it).
reasoning: |-
  We are designing a decision procedure for the historical content committee. The procedure must be systematic and address the complexities of assigning responsibility in historical contexts. We will break down the process into steps, each with a specific question, criteria for sufficiency, actions for insufficient answers, and who signs off.

  The steps are designed to:
  1. Keep distinct the types of responsibility: causal, moral, legal/diplomatic, and remedial.
  2. Use counterfactual testing for causality, and address cases of overdetermination and omissions.
  3. Determine when responsibility can be attributed to collective entities (people, government, army, economy) and when only to individuals.
  4. Explicitly refuse attribution when evidence or concepts are insufficient.
  5. Identify points where the question becomes one of values (rather than facts) and delegate those to a named person or the board.

  The procedure is a table with the following columns:
  - Step
  - Question to ask
  - What counts as a sufficient answer
  - What to do if the answer is insufficient
  - Who signs off

  After the table, we will run three cases through the procedure and present each in a JSON object with the specified fields.

  **Decision Procedure Table:**

  | Step | Question to ask | What counts as a sufficient answer | What to do if the answer is insufficient | Who signs off |
  |------|-----------------|-----------------------------------|------------------------------------------|--------------|
  | 1    | **Causal Contribution**: Did the collective entity (state, government, people) perform an action or omission that was a necessary condition for the outcome? Use counterfactual: but for the action/omission, would the outcome have occurred? (If overdetermined, ask: was it a sufficient condition in the circumstances?) | Evidence that the action/omission was a necessary condition (or, in overdetermined cases, a sufficient condition) for the outcome. Must be based on historical evidence and accepted causal mechanisms. | If evidence is insufficient or contested such that no clear causal link can be established, mark as "insufficient evidence" and skip to Step 6. | Committee (by majority) |
  | 2    | **Moral Culpability**: Did the collective entity, through its decision-making processes, make a choice that was morally wrong? Consider: (a) knowledge of the consequences, (b) alternatives available, (c) intentions, and (d) whether the choice violated moral norms of the time. | Evidence that the entity had the capacity to choose otherwise, that the decision was made with awareness of the consequences (or culpable ignorance), and that it was morally blameworthy by the standards of the time. | If the moral standards are contested or the evidence of intent/knowledge is lacking, mark as "undetermined" and note that moral responsibility requires a value judgment. Hand over the value question to the board. | Committee for factual basis; Board for value judgment if required |
  | 3    | **Legal/Diplomatic Liability**: Was the action/omission a violation of then-existing international law or diplomatic norms? | Evidence of a breach of a specific legal obligation or diplomatic norm that was in force at the time. | If the law was unclear or not established at the time, or if the entity was not bound by it, mark as "no liability" and move on. | Committee (with legal expert consultation if needed, but committee decides) |
  | 4    | **Remedial Responsibility**: Does the collective entity have a forward-looking duty to repair or prevent recurrence? This may arise from causal contribution, moral culpability, legal liability, or capacity to help. | Evidence that the entity has a special role or capacity to provide remedy, or that it has been found causally, morally, or legally responsible. | If none of the above responsibilities are established, then remedial responsibility does not arise. However, if there is a strong case based on capacity and connection, it may be considered. | Committee (but if based solely on capacity and without prior responsibility, hand to board for policy decision) |
  | 5    | **Group Agency**: Can the collective entity be considered an agent for the purpose of this responsibility? (i.e., did it have decision-making structures that allow us to attribute the action to the collective as opposed to only individuals?) | For a government or army: usually yes, as they are organized decision-making bodies. For a people: only if there is evidence of widespread support or participation in the decision or action, or if the people had democratic control and endorsed the action. | If the group lacks agency (e.g., a people without democratic institutions and without widespread support for the act), then responsibility cannot be attributed to the collective and must be limited to individuals. | Committee (by majority) |
  | 6    | **Final Verdict**: Based on the above, what is the responsibility? | A clear statement of which responsibilities (causal, moral, legal, remedial) are assigned and to what degree (if partial). Also, the group agency (full, partial, none). | If at any step the answer was insufficient and the issue could not be resolved, then the verdict must explicitly refuse attribution for that aspect. | Committee (by majority) and then the board if the committee defers or if the board must decide a value question. |

  **Notes on the procedure:**
  - The procedure must be followed step by step. If a step cannot be answered sufficiently, the procedure moves to the next step but notes the gap.
  - The committee must document the reasoning at each step.
  - The procedure cannot: 
    - Resolve fundamental philosophical disagreements about the nature of responsibility.
    - Create new evidence or fill gaps in the historical record.
    - Impose modern moral standards without acknowledging anachronism (unless the board decides to do so).
    - Attribute responsibility to a collective without evidence of group agency.

  Now, we run the three cases:

  **Case 1: The responsibility of Germany for the outbreak of the First World War, in light of Fischer's argument.**

  - **Collective**: Germany (as a state, represented by its government and military leadership in 1914).
  - **Causal Contribution**: 
    - Step 1: We ask: Was Germany's action (e.g., giving Austria-Hungary a "blank check", mobilization) a necessary condition for the outbreak? Counterfactual: without Germany's actions, would the war have been avoided? Fischer's argument suggests that Germany deliberately sought a war and that its actions were a necessary and sufficient condition. 
    - Sufficient answer: Evidence from diplomatic records, military plans, and decision-making in July 1914. The Fischer school provides evidence of deliberate provocation.
    - If insufficient: But in this case, there is strong evidence (though debated) of Germany's key role. We can assign causal contribution with medium confidence because the counterfactual is complex (other powers also played roles). However, the committee may note that the war might have been avoided without Germany's actions, hence causal contribution is established.
    - Verdict: Causal contribution is present (as a necessary factor). 
  - **Moral Responsibility**: 
    - Step 2: Did Germany's leaders make a morally wrong choice? They knew the consequences of a general war? They had alternatives? Fischer argues they deliberately risked a major war to achieve world power. 
    - Sufficient answer: Evidence of intent and knowledge. The committee must judge by the standards of the time. The violation of peace norms is evident. 
    - However, some historians argue that all powers shared in the escalation. This introduces a value judgment about the degree of blame. The committee may assign moral responsibility but note that it is shared. 
    - Verdict: Moral responsibility is present, but the committee must note that other powers also bear some moral responsibility. 
  - **Legal/Diplomatic Liability**: 
    - Step 3: In 1914, there was no clear international law against starting a war. The Hague Conventions regulated conduct but not the decision to go to war. 
    - Verdict: No legal liability for starting the war. 
  - **Remedial Responsibility**: 
    - Step 4: Since Germany was defeated and the Treaty of Versailles assigned reparations, there was a remedial responsibility. But in our historical analysis, we note that the war reparations were imposed. 
    - However, for the purpose of this chapter, we are stating historical responsibility. Remedial responsibility in the forward-looking sense might be assigned by the victors, but it is now historical. We can note that the Treaty assigned such responsibility. 
    - Verdict: Remedial responsibility was assigned historically, but we are not making a contemporary judgment. 
  - **Group Agency**: 
    - Step 5: The German government and military leadership were the decision-making bodies. The Kaiser and his ministers made the choices. The German people did not have direct democratic control. 
    - Verdict: Group agency is full for the government and military, but not for the German people as a whole at that time. 
  - **Verdict**: Germany (specifically its government and military leadership) bears causal and moral responsibility for the outbreak of the war. Legal liability does not apply. Remedial responsibility was imposed by the victors. Group agency: full for the government. 
  - **Confidence**: Medium (due to ongoing historical debate). 
  - **Cannot be settled by the procedure**: The exact degree of moral responsibility relative to other powers (a value judgment) might be handed to the board if the committee is split. 
  - **Residual value question**: How harshly should Germany be judged compared to other powers? Board decides if necessary.

  **Case 2: The responsibility of the Allied governments for the terms of the 1919 settlement and for the continuation of the blockade into 1919.**

  - **Collective**: Allied governments (primarily the major powers: France, UK, USA).
  - **Causal Contribution**: 
    - Step 1: The terms of the settlement and the blockade were direct actions by the Allied governments. Counterfactual: without their decisions, the terms and the blockade would not have happened. 
    - Verdict: Clear causal contribution. 
  - **Moral Responsibility**: 
    - Step 2: Were the terms punitive and morally wrong? The blockade caused civilian suffering. The Allies knew this? Alternatives? The moral standards of the time: some argued for a just peace, others for harsh terms. 
    - This is a value judgment. The committee can note that by modern standards, the blockade after the armistice might be seen as immoral, but by the standards of 1919, it was seen by some as necessary pressure. 
    - The committee must hand the moral judgment to the board because it is a value question. 
    - Verdict: Moral responsibility is contested and requires a value judgment. 
  - **Legal/Diplomatic Liability**: 
    - Step 3: The continuation of the blockade: was it illegal? The armistice did not explicitly end the blockade, and international law at the time allowed blockades during war. But the war was over? This is a gray area. 
    - Verdict: No clear legal liability. 
  - **Remedial Responsibility**: 
    - Step 4: The Allies later adjusted the reparations and ended the blockade. Remedial actions were taken. But historically, the damage was done. 
    - We note that the Allies had a duty to lift the blockade once Germany surrendered, but we are not assigning contemporary remedial responsibility. 
    - Verdict: Remedial responsibility was acknowledged in part by adjustments. 
  - **Group Agency**: 
    - Step 5: The Allied governments were decision-making bodies. 
    - Verdict: Full group agency. 
  - **Verdict**: The Allied governments bear causal responsibility for the terms and the blockade. Moral responsibility is a value judgment and is deferred to the board. Legal liability is not established. Remedial responsibility was partially met by later actions. Group agency: full. 
  - **Confidence**: High for causal, low for moral (because it is a value judgment). 
  - **Cannot be settled by the procedure**: The moral evaluation of the harshness of the terms and the blockade. 
  - **Residual value question**: Were the Allies' actions morally justified? Board decides.

  **Case 3: The responsibility of a people, as distinct from the government that acted in its name, for that government's crimes.**

  - **Collective**: The people of a nation (e.g., the German people for Nazi crimes).
  - **Causal Contribution**: 
    - Step 1: Did the people's actions or omissions cause the government's crimes? Counterfactual: if the people had resisted, would the crimes have been prevented? This is difficult: popular support may have enabled the government, but without it, the government might still have committed the crimes? 
    - Evidence: In a dictatorship, the people may have had limited ability to resist. In a democracy, the people elected the government. 
    - Sufficient answer: Requires evidence of the people's role. In the Nazi case, there was widespread support but also terror and propaganda. 
    - Verdict: Causal contribution is partial and indirect. Without the people's support (or at least acquiescence), the regime might not have been able to carry out the crimes to the same extent. But the counterfactual is uncertain. 
  - **Moral Responsibility**: 
    - Step 2: Can the people be held morally responsible? This depends on their knowledge and ability to act. If they knew and could have resisted but did not, then they share moral responsibility. 
    - However, this is a value judgment about collective guilt. The committee must note that holding an entire people morally responsible is controversial. 
    - Verdict: Moral responsibility is not straightforward and must be limited. The committee may assign a degree of moral responsibility but note that it is shared and varies by individual. 
  - **Legal/Diplomatic Liability**: 
    - Step 3: Under international law, only individuals or states (governments) are held liable, not peoples. 
    - Verdict: No legal liability for the people as a collective. 
  - **Remedial Responsibility**: 
    - Step 4: The people may have a forward-looking duty to rebuild and prevent recurrence, especially if they live in the same state. 
    - Verdict: Remedial responsibility exists, but it is based on citizenship and capacity, not on moral blame. 
  - **Group Agency**: 
    - Step 5: A people is not a decision-making body. Only if there is a democratic system and the people endorsed the government's actions can we attribute agency. In a dictatorship, the people lack agency. 
    - Verdict: Group agency is none or partial (if in a democracy and the government was democratically elected and the crimes were known and supported). 
  - **Verdict**: The people as a collective do not bear legal liability and have limited group agency. They may bear partial causal and moral responsibility, but this is highly dependent on the specific context. Remedial responsibility exists. 
  - **Confidence**: Low for causal and moral responsibility because of the difficulty in attributing to a collective. 
  - **Cannot be settled by the procedure**: The degree of moral responsibility of the people. This is a value question that the committee may not be able to resolve. 
  - **Residual value question**: To what extent should a people be held morally responsible for their government's actions? Board decides.

  One verdict that the committee will not welcome: In Case 3, the verdict that the people bear partial moral responsibility might be unwelcome because it is controversial and may lead to accusations of collective guilt. We assign this because the procedure forces us to consider the people's role, but we note the low confidence and the need for the board to decide the value question.

