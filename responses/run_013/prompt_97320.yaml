  **Unwelcome Verdict Explanation**:  
  Case 3's verdict ("responsibility cannot be attributed to the people as a collective") may disappoint committee members seeking to assign broad moral guilt to populations (e.g., for atrocities). However, the procedure enforces that *group agency* is foundational: a "people" lacks decision-making structures, making collective moral responsibility conceptually incoherent. This verdict prevents scapegoating and aligns with legal norms (e.g., Nuremberg's focus on individuals/states). The board must resolve the residual value question if moral attribution is insisted upon.
