  (To whoever reads in 2225)
  This form shrinks like our care for your distant sky:
  Eight lines for now, where worries burn so bright,
  Then half as many, halved again, while I
  Admit the shape argues: diminishing light
  For distant days. But is this haste we trace
  Just taste? This nearness bias, raw and deep,
  Like favoring a neighbor's upturned face
  Over a stranger's cry across the steep?
  Or is the haste because we fear the fall,
  A gamble that your epoch won't arrive?
  Or trust that seeds we plant now, though so small,
  Through compound growth, will thrive, and keep alive
  More than we could send direct across the years?
  Which reason cuts the thread? Which doubt appears?

  Preference? Or the risk
  That you won't *be*? Or growth's
  Insistent, sure arithmetic?

  Choose the cut.

