prompt: |-
  I run the determinations unit of a mid-sized benefits agency. Every month my staff issue roughly two hundred written decisions granting or denying claims, and every decision has to state its reasons. A claimant who loses may write back and ask for a further statement of reasons, and under our rules we must answer. This has produced a pattern I cannot get to the bottom of. Some decisions stop at a statement to the effect that the medical reviewer's assessment is accepted; claimants call that question-begging, and I am no longer sure they are wrong. Some decisions stop at the fact that this is our established practice, which sounds like a reason but seems to consist of pointing out that we have said the same thing before. Some decisions cite other decisions that cite back to them. And some decisions simply keep generating paragraphs: when a claimant asks why, we produce a longer restatement of the same rule in different words.

  I have come to think this is the old problem of how a chain of reasons can end, and that there are three serious answers to it. On the first, justification terminates in something that does not itself stand in need of justification — a finding of fact, an authoritative text, an observation that simply holds. On the second, nothing terminates the chain, but that is acceptable, because a reason is justified by how well it fits with everything else we accept, and there is no privileged class of stopping points. On the third, the chain genuinely never ends, and justification is not a terminus at all but the standing ability to supply a further reason when one is demanded, so the practical question is how to manage an endless obligation rather than how to close it. I understand these are usually called foundationalism, coherentism, and infinitism.

  What I want from you is a procedure my staff can actually run. Assume they have no philosophical training, have about twenty minutes per decision, and will have to defend the procedure to an outside auditor. Give me the questions to ask in order, what counts as a sufficient answer to each, how to distinguish a legitimate stopping point from a merely convenient one, how to tell when two reasons are propping each other up in a circle, what a writer should do when a claimant asks again after a stopping point has been reached, and which decisions must be escalated to a person rather than resolved by the procedure. Be explicit about which of the three answers your procedure implements, and, where it is a hybrid, which part of each it is using and what work that part is doing. Wherever the procedure tells us to stop, say what makes that stop legitimate rather than merely convenient, and be honest about the steps that are judgment calls dressed up as procedure.

  Then run it on three decisions: (a) one that accepts a reviewer's functional-capacity assessment and offers no support for the reviewer's competence beyond the fact that he is experienced; (b) one that denies a claim because our established practice denies claims of that type, citing consistency as the reason to follow the practice; (c) one that rests on an empirical assumption — that claimants with this profile recover within six months — for which the file contains no support. For each, tell me whether the procedure requires us to rewrite the stated reasons and, if so, what the rewritten reasons should look like. Include at least one case where the procedure tells us something I will not want to hear.

  Two further matters the procedure has to address. First, a claimant whose objection is not to our reasoning but to a provision of the regulation itself, which we have no authority to revisit: I take it the chain stops there for reasons of authority rather than of justification, and I want to know whether the procedure should treat that as a genuine stopping point or as a different kind of thing altogether, and how staff should describe it in the decision. Second, say plainly what the procedure cannot do, and where it must hand the decision to a person.
reasoning: |-
  We are going to design a procedure that is a hybrid of foundationalism and coherentism, with a nod to infinitism for managing the "further reasons" demand. The core idea is:
   - We want to have stopping points (foundationalism) for practical reasons, but we recognize that some foundations are more stable than others. 
   - We also want our reasons to cohere with the body of our decisions and the regulations (coherentism).
   - For the infinitist concern, we manage by having a procedure that allows for one level of "why" beyond the initial decision, but then we stop at a recognized foundation or authority, and we document that we have reached the limit of our obligation.

  The procedure will be structured as a checklist of questions. Staff must answer each question in order. The goal is to ensure that every decision has at least one "foundational" stopping point that is either (a) a fact supported by evidence in the file, (b) an unambiguous regulatory provision, (c) an authoritative text (like a binding precedent or a clear policy guideline), or (d) an expert opinion that we are entitled to rely on (with proper foundation). We also want to avoid circularity and ensure that the reasons are not just restatements of the same point.

  The procedure:

  1. **Question 1: What is the specific regulatory provision or rule that we are applying?**
     - *Sufficient answer*: A clear citation to the regulation, statute, or binding policy. If the rule is not directly stated but is derived, then we must show the derivation from higher rules.
     - *If not sufficient*: Escalate to a supervisor because we might be applying an unwritten rule or misinterpreting.

  2. **Question 2: What facts in the file support the application of this rule?**
     - *Sufficient answer*: Specific references to evidence (e.g., medical report, claimant's statement, form). The facts must be uncontested or, if contested, resolved by a clear preponderance (and if not, we might need to note the conflict and why we resolved it that way).
     - *If not sufficient*: We must either gather more evidence (if time allows and it's critical) or note the lack and explain why the rule applies anyway (e.g., burden of proof).

  3. **Question 3: Is there any step in our reasoning that depends on an intermediate conclusion (like an expert opinion, a policy interpretation, or a factual inference) that is not self-evident?**
     - *Sufficient answer*: If yes, we must provide the support for that intermediate step. For an expert opinion, we must state the expert's qualifications and the basis of their opinion (if challenged, we may need to provide more). For a policy interpretation, we must cite the policy and explain the interpretation if it's not obvious. For a factual inference, we must show the logical connection to the evidence.
     - *Stopping point check*: We stop at a foundational fact (if it's a fact that is directly from evidence and not reasonably disputable) or an authoritative text (like a regulation). We do not stop at an intermediate conclusion without showing its foundation.

  4. **Question 4: Are we relying on a prior decision (or practice) as a reason?**
     - *Sufficient answer*: If yes, we must show that the prior decision (or practice) is consistent with the regulations and the facts of the current case. We cannot rely solely on consistency. We must also show that the prior decision was itself well-founded (by our procedure) or that the practice is mandated by regulation.
     - *Circularity check*: If we are citing a decision that in turn cites back to this one (or a close circle of decisions), that is circular and not allowed. We must break the circle by grounding the practice in a regulation or a foundational fact.

  5. **Question 5: Have we restated the same reason in different words?**
     - *Sufficient answer*: We must avoid this. If we find we are repeating, we must either (a) identify a deeper reason, (b) recognize that we have reached a stopping point and state it as such, or (c) if we cannot, escalate because we might be missing a foundation.

  6. **Question 6: If the claimant asks for a further statement of reasons after we have given what we believe is a complete set, what do we do?**
     - We provide one additional level of explanation that digs one step deeper into the foundation. But if we have already reached a recognized stopping point (like a regulation, a clear fact, or an expert opinion that we are entitled to rely on without further inquiry), we state that we have reached the limit of our obligation and that the claimant may appeal. We do not generate new paragraphs of restatement.

  **Legitimate Stopping Points** (and why they are legitimate, not just convenient):
   - **Regulation/Statute**: Because we are bound by law and have no authority to change it. This is a foundational authority.
   - **Uncontested Fact in the File**: Because facts are the building blocks and if they are not reasonably disputable (and within the claimant's knowledge), we take them as given.
   - **Expert Opinion (with proper foundation)**: Because we are entitled to rely on experts in their field, provided we have checked their credentials and the basis of their opinion (e.g., they examined the claimant, reviewed the file, and their report is detailed). This is a practical foundation in administrative law.
   - **Binding Precedent or Policy**: If it is issued by a higher authority (like a court or the head of the agency) and directly applicable.

  **Distinguishing legitimate from convenient**:
   - A stop is legitimate if it falls into one of the above categories and we have done the work to verify it (e.g., for an expert, we have checked that they are qualified and their report is based on evidence). A convenient stop is when we use one of these labels without actually having the support (e.g., calling something an "uncontested fact" when it is contested, or citing a regulation that doesn't quite fit).

  **Handling Circularity**:
   - When two reasons cite each other, we break the circle by going back to the regulation or a foundational fact that supports one of them independently.

  **When to Escalate**:
   - When we cannot find a regulatory basis for a rule we are applying.
   - When the facts are deeply contested and we cannot resolve them with the evidence in the file.
   - When we are relying on a practice that has never been grounded in regulation and we are challenged on it.
   - When we are asked for a further reason beyond a stopping point that we believe is legitimate, but the claimant is persistent and we are not sure how to respond without restating.

  **The claimant objects to the regulation itself**:
   - We treat this as a legitimate stopping point. We have no authority to change the regulation. We state: "This decision is based on [regulation citation]. The agency is bound by this regulation and has no authority to alter it. If you disagree with the regulation, you may wish to contact your legislative representative or challenge the regulation in court."

  **What the procedure cannot do**:
   - It cannot create evidence that is not in the file.
   - It cannot change the regulations or policy.
   - It cannot resolve deep philosophical disagreements about the nature of justification (we are practical, not theoretical).
   - It cannot satisfy a claimant who demands an infinite chain of reasons. We provide one level beyond the initial decision and then stop.

  Now, we run the procedure on the three decisions:

  **(a) Decision that accepts a reviewer's functional-capacity assessment and offers no support for the reviewer's competence beyond the fact that he is experienced.**

  - **Q1**: The rule is that we rely on medical experts to assess functional capacity. (Sufficient if there is a regulation or policy saying so.)
  - **Q2**: The fact is the reviewer's report. (But we need to check if the report is in the file and complete.)
  - **Q3**: The intermediate conclusion is the reviewer's assessment. We are relying on the reviewer's expertise. The stated reason is that he is experienced. But experience alone is not a sufficient foundation for expertise? We need more: credentials, and we must note that the reviewer's opinion is based on an examination or file review. The stopping point here would be the expert's opinion, but we must establish the foundation for why we rely on this expert.
  - **Rewrite required?** Yes. We must state: "We rely on the assessment of [reviewer], who is a licensed [profession] with [X] years of experience in [relevant field]. The reviewer examined the claimant on [date] and provided a detailed report that addresses the claimant's functional capacity. The agency is entitled to rely on the opinions of qualified medical professionals." If we don't have the credentials and basis, we must get them or note the gap (and if challenged, we might have to escalate).

  **(b) Decision that denies a claim because our established practice denies claims of that type, citing consistency as the reason to follow the practice.**

  - **Q1**: What is the regulatory basis for the practice? If there is none, we must escalate because we cannot rely solely on practice.
  - **Q4**: We are relying on prior practice. We must show that the practice is grounded in regulation. If it is, then we cite the regulation and note that the practice is a consistent application. If not, we cannot use consistency alone. This is circular if the practice is only justified by itself.
  - **Rewrite required?** Yes. We must either:
     - Find the regulatory basis and state: "This decision is based on [regulation]. Our practice of denying claims of this type is a consistent application of that regulation because [explain how the regulation applies]." 
     - Or, if there is no regulatory basis, we must escalate because we are making up a rule. The procedure cannot fix that. We must not write the decision until we have a regulatory basis.

  **(c) Decision that rests on an empirical assumption — that claimants with this profile recover within six months — for which the file contains no support.**

  - **Q2**: What facts in the file support the assumption? None. So this is a gap.
  - **Q3**: The intermediate conclusion (that recovery occurs within six months) is not supported. We must either remove that assumption or find support for it. 
  - **Rewrite required?** Yes. We cannot rely on an unsupported empirical assumption. We must either:
     - Find evidence in the file for this claimant (e.g., medical reports that say so) or
     - Cite an authoritative source (like a regulation, a binding policy, or a reputable medical guideline) that states this recovery period. 
     - If we cannot, we must not use that reason. We might have to deny on other grounds or grant the claim if this was the only reason for denial.

  **One case the boss won't want to hear**:
  In case (b), if there is no regulatory basis for the practice, the procedure requires escalation and potentially rewriting the practice. This may reveal that the practice is unlawful, which would be unwelcome.

  **Procedure for when claimant objects to the regulation**:
  As above, we stop and state that we are bound by the regulation. We do not try to justify the regulation, only our application of it.

  **What the procedure cannot do**:
  - It cannot make up for missing evidence.
  - It cannot create a regulatory basis where none exists.
  - It cannot provide infinite reasons.

  **Implementation note**: 
  The staff have 20 minutes. They must have quick access to regulations and policies. They should have a template for the common stopping points. They must document the answers to the questions in the file (even if briefly) to show the auditor that the procedure was followed.

  This procedure is a hybrid:
  - Foundationalism: We seek stopping points in facts, regulations, and properly supported expert opinions.
  - Coherentism: We check that our decision coheres with the body of regulations and prior decisions (but we break circularity by grounding).
  - Infinitism: We manage the "further reason" demand by allowing one deeper level and then stopping at a foundation.

  The judgment calls are in:
  - What counts as an "uncontested fact" (if the claimant disputes it, we might have to revisit).
  - Whether an expert's foundation is sufficient (e.g., if the expert didn't review the file, we might not be able to rely on them).
  - Whether a regulatory provision is "clear" or needs interpretation (if unclear, escalate).
answer: |-
  Below is a practical, step-by-step procedure for your staff to follow when drafting decisions and responding to requests for further reasons. The procedure is a **hybrid of foundationalism and coherentism**, with infinitism informing how to manage repeated requests. Specifically:
  - **Foundationalism** provides the core stopping points (e.g., facts, regulations, or expert opinions with proper foundation) to avoid infinite regress and ensure decisions are rooted in objective, justifiable anchors.
  - **Coherentism** ensures reasons are consistent with the broader system (e.g., regulations, prior decisions, and agency policies) and checks for circularity or inconsistency.
  - **Infinitism** is acknowledged in the procedure's design for handling claimant requests: staff must provide one additional layer of reasons upon request, but after that, they stop and direct the claimant to appeal. This balances the "endless obligation" by making it manageable.

  **Why this hybrid?**  
  - Foundationalism gives staff clear, defensible stopping points (critical for audits and efficiency).  
  - Coherentism prevents isolation of reasons (e.g., circularity or inconsistency with regulations).  
  - Infinitism is limited to one follow-up response to respect resource constraints while addressing claimant demands.  

  ### Procedure: The Reason Chain Checklist
  Staff must ask these questions **in order** for every decision. Allow 15–20 minutes per decision by using templates for common scenarios. Document answers in the file for auditors.  

  1. **Question 1: What regulation, law, or binding policy requires this outcome?**  
     - *Sufficient answer*: A direct citation (e.g., "Regulation 5.2 requires denial of claims after 180 days"). If the outcome is based on interpretation, cite the specific provision and briefly explain.  
     - *Insufficient*: Vague references (e.g., "our policy") without a source.  
     - *Escalate if*: No clear regulatory basis exists, or the regulation is ambiguous.  
     - *Legitimacy check*: This is a foundational stop. Regulations are authoritative and not subject to justification by staff.  

  2. **Question 2: What specific evidence in the file supports the key facts?**  
     - *Sufficient answer*: References to concrete evidence (e.g., "Claimant's medical report dated 01/01/2025 shows limited mobility"). Facts must be uncontested or resolved per agency rules (e.g., preponderance of evidence).  
     - *Insufficient*: Generalizations (e.g., "most people like this recover quickly") without file evidence.  
     - *Legitimacy check*: Facts are foundational stops if they are directly observed, documented, and not reasonably disputable (e.g., a signed form). Judgment call: Staff must decide if a fact is "uncontested" – if unsure, escalate.  

  3. **Question 3: Is any expert opinion cited? If so, is their foundation stated?**  
     - *Sufficient answer*: The expert’s qualifications (e.g., "Dr. Smith, a board-certified orthopedic surgeon with 10 years’ experience") and basis (e.g., "based on their exam of the claimant").  
     - *Insufficient*: Only stating experience (e.g., "we accept Dr. Smith’s view because he’s experienced").  
     - *Legitimacy check*: Expert opinions are foundational stops if qualifications and basis are explicit. Without this, it’s a "convenient stop" (e.g., deferring to authority without justification).  

  4. **Question 4: Are we relying on "established practice"? If so, is it rooted in regulation or facts?**  
     - *Sufficient answer*: Practice must be tied to regulation (e.g., "this practice implements Regulation 5.2") or consistent factual patterns (e.g., "past claims with similar evidence were denied").  
     - *Insufficient*: "We do this because we always have" or "for consistency."  
     - *Circularity check*: If a decision cites other decisions that cite back to it (or a loop of 2–3 decisions), it’s circular. Break the loop by grounding in regulation (Question 1) or evidence (Question 2).  

  5. **Question 5: Are reasons restated in different words?**  
     - *Check*: If two paragraphs say the same thing (e.g., "claimant lacks functional capacity" and "claimant cannot work"), condense or replace with a foundational/coherent reason.  
     - *Action*: Replace restatements with new support (e.g., add evidence or a regulation).  

  6. **Question 6: If a claimant requests further reasons, what do we do?**  
     - *Step 1*: Provide **one** additional layer of reasons (e.g., if the initial decision cited a regulation, now explain *why* that regulation applies to the facts).  
     - *Step 2*: If the request comes *after* a foundational stop (e.g., regulation, well-supported fact, or expert), respond: "We rely on [foundation], which is binding/exhaustive. You may appeal to [body]."  
     - *Step 3*: If no foundational stop exists, re-run Questions 1–5 to add support.  
     - *Infinitism management*: Staff provide only one response. After that, stop – justification is the *ability* to give reasons, not endless replies.  

  ### When to Escalate to a Person
  Escalate if:  
  - No regulatory basis exists (Question 1).  
  - Facts are highly contested or missing (Question 2).  
  - Circular reasoning can’t be broken (Question 4).  
  - A claimant’s repeat request challenges a foundational stop (e.g., disputes a regulation).  

  ### Handling Regulatory Objections
  - **Treat it as a foundational stop**. Staff respond: "This outcome is required by [regulation], which we have no authority to change. If you object to the regulation itself, you may appeal to [court/board] or contact [legislative body]."  
  - **Why?** Regulations are authoritative, not justificatory. The procedure separates "authority stops" (foundational) from "justification stops" (e.g., facts).  

  ### What the Procedure Cannot Do
  - **Create evidence**: If the file lacks support, staff can’t invent it. Escalate or deny if unsupported.  
  - **Alter regulations/policy**: Staff apply, not question, these.  
  - **Resolve novel philosophical disputes**: e.g., if a claimant demands "why stop at the regulation?" the procedure ends at authority.  
  - **Replace human judgment in gray areas**: e.g., "Is this fact uncontested?" requires staff discretion. Auditors see this as "judgment dressed as procedure" – document why you deemed a fact/stop legitimate.  

  ---

  ### Application to Your Three Cases
  **Case (a): Decision accepts a reviewer’s functional-capacity assessment; only support is reviewer’s experience.**  
  - **Procedure analysis**:  
    - Fails **Question 3** (expert foundation): Experience alone isn’t enough. Missing: qualifications (e.g., "board-certified") and basis (e.g., "reviewed medical records").  
    - **Rewrite required**: Add foundation.  
      - *Rewritten reason*: "We accept Dr. Smith’s functional-capacity assessment. Dr. Smith is a board-certified neurologist with 15 years’ experience and based this assessment on their physical examination of the claimant and a review of medical records. Under Agency Policy 7.3, we may rely on qualified medical reviewers."  
  - **Outcome**: Now a legitimate foundational stop (expert + policy).  

  **Case (b): Decision denies a claim because "established practice" denies such claims, citing consistency.**  
  - **Procedure analysis**:  
    - Fails **Question 4** (established practice): Consistency isn’t sufficient – practice must root in regulation/facts.  
    - **Rewrite required**: Ground in regulation or escalate.  
      - *If regulation exists*: "We deny this claim under Regulation 9.1(c), which prohibits benefits for self-reported conditions without corroborating evidence. Our practice of denying such claims consistently applies this regulation."  
      - *If no regulation exists*: Escalate to a supervisor. The practice may be unsupported (you won’t like this – it could expose arbitrary decisions).  
  - **Outcome**: If no regulatory basis, escalation forces a review of the practice’s validity.  

  **Case (c): Decision rests on unsupported empirical assumption (claimants with this profile recover in 6 months).**  
  - **Procedure analysis**:  
    - Fails **Question 2** (evidence): No file support for the assumption.  
    - **Rewrite required**: Replace with evidence or authoritative source.  
      - *If evidence exists*: "Medical studies in the file (e.g., [citation]) show recovery within 6 months for this injury."  
      - *If no evidence*: Remove the assumption. Base the decision on actual file evidence (e.g., "Claimant’s doctor reported no improvement after 8 months") or deny for lack of proof. If no alternative grounds, escalate – unsupported assumptions are illegitimate stops.  
  - **Outcome**: Forces reliance on facts, not generalizations.  

  ---

  ### Key Outputs
  - **Staff-ready tool**: A one-page checklist (Questions 1–6) with examples.  
  - **Audit defense**: Shows systematic justification, limits circularity/restatement, and distinguishes legitimate stops (e.g., "regulation cited") from convenient ones (e.g., "practice not grounded").  
  - **Efficiency**: 20-minute cap achievable with templates (e.g., for expert foundations or regulatory cites).  
  - **Philosophical honesty**:  
    - Foundationalism does the "heavy lifting" for stops.  
    - Coherentism checks consistency and breaks circles.  
    - Infinitism is tamed – one follow-up response respects claimants without creating endless work.  

  This procedure ensures decisions are defensible, reduces restatements/circularity, and forces grounding in evidence or authority. It also flags high-risk cases (e.g., unsupported practices) for human review.
