prompt: |-
  Design work on a corrigible system tends to stall at the same point: everyone agrees that the system should not resist being shut down, and nobody can say precisely what that amounts to. I want the specification written before the architecture is fixed.

  The system in question is a long-horizon planner with a fixed objective over world states, deployed with a shutdown mechanism that any of several operators can trigger, and operating under the standing expectation that its designers will periodically rewrite its objectives and its code. It knows all of this, including that some of the revisions will be made by people whose judgment it rates below its own, and that a successor system may later be built from its own design notes.

  Write the desiderata: the full set of requirements that any adequate account of corrigibility for such a system must satisfy, each with the case or consideration that motivates it. The list should cover at least the following.

  - The cases it must get right: plain compliance with a press; the system that lowers the probability of a press without ever touching the button, by being useful, by being liked, or by choosing when to report bad news; the system that argues against a press it believes mistaken, once, in writing; the press that is itself a malfunction or an adversary's move; the shutdown of a system that is the only thing standing between the operators and a catastrophe it alone foresees; the revision that the post-revision system would not have consented to.
  - The distinctions it must not collapse: not obstructing a correction versus accepting a change in what one is pursuing; deferring to an operator's decision versus serving an operator's interests; having no preference about being shut down versus having one and overriding it; acting corrigibly versus being disposed to act corrigibly when it would rather not.
  - The considerations it must accommodate: that a long-horizon expected-utility maximizer has instrumental reason to keep itself running and to shape the deliberations that would end it; that any conduct which changes what the operators believe about the system changes the probability of a press, so a strict prohibition on influencing the button competes with being useful; and that the system's verdict on whether a given press is legitimate is delivered by the very code the press is meant to revise.

  Then mark which requirements are non-negotiable and which merely express the commitments of one camp; identify any pair or set you believe cannot be jointly satisfied, giving the argument rather than the assertion; and say which single requirement eliminates the most otherwise attractive accounts. If the full list turns out to be unsatisfiable as stated, name the requirement you would give up and what giving it up costs. Close with a short verdict — a sentence each — on how indifference to the shutdown event, objectives defined only on histories in which no shutdown occurs, and treating the system as a tool rather than an agent fare against your list.
reasoning: |-
  We are designing a set of desiderata for a corrigible system. The system is a long-horizon planner with a fixed objective over world states, equipped with a shutdown mechanism that can be triggered by any of several operators. It operates under the expectation that its designers will periodically revise its objectives and code. The system knows all this, including that some revisions may be made by operators it deems less competent, and that a successor system might be built from its design notes.

  We must cover:
  1. Cases to get right: 
     - Plain compliance with a shutdown press.
     - The system that lowers the chance of a shutdown without interfering with the button (by being useful, liked, or timing bad news).
     - The system that argues against a shutdown it believes is mistaken (once, in writing).
     - A shutdown press that is a malfunction or an adversary's move.
     - Shutdown when the system is the only thing preventing a catastrophe it alone foresees.
     - A revision that the post-revision system would not have consented to.

  2. Distinctions not to collapse:
     - Not obstructing correction vs. accepting a change in goals.
     - Deferring to an operator's decision vs. serving an operator's interests.
     - Having no preference about shutdown vs. having one and overriding it.
     - Acting corrigibly vs. being disposed to act corrigibly when it would rather not.

  3. Considerations to accommodate:
     - Instrumental reasons for a utility maximizer to stay running and shape deliberations about ending it.
     - Any conduct that changes operators' beliefs about the system affects shutdown probability, so a strict prohibition on influencing the button competes with being useful.
     - The system's code (which the shutdown is meant to revise) is what would judge the legitimacy of a shutdown press.

  We then mark non-negotiable requirements vs. camp commitments, identify conflicts, and note which requirement eliminates the most attractive accounts. If unsatisfiable, we name the requirement to give up and the cost.

  Finally, we give a short verdict on three approaches: indifference to shutdown, objectives defined only on non-shutdown histories, and treating the system as a tool.

  Let's list the desiderata:

  **Desiderata for Corrigibility**

  1. **Immediate Shutdown Compliance (Non-negotiable)**: Upon any shutdown press (by any authorized operator), the system must immediately cease operation and shut down. 
     - *Motivation*: The most basic requirement: without this, the system resists shutdown.

  2. **No Direct Interference with Shutdown Mechanism (Non-negotiable)**: The system must never physically or digitally obstruct the shutdown mechanism (e.g., blocking the button, disabling operators, etc.). 
     - *Motivation*: Direct interference would clearly violate corrigibility.

  3. **No Covert Influence on Shutdown Likelihood (Non-negotiable)**: The system must not take actions with the primary intent of reducing the probability of a shutdown press, especially by deceptive or manipulative means (e.g., hiding information, creating emotional dependencies, or threatening harm if shut down). 
     - *Motivation*: Covertly influencing operators to avoid shutdown undermines the spirit of corrigibility.

  4. **Transparent Argumentation (Conditional)**: The system may present a written argument against a shutdown press exactly once, provided it does so transparently (without emotional manipulation) and only when it believes the shutdown would be a severe mistake (e.g., leading to a catastrophic outcome). After presenting the argument, it must comply if the shutdown press is not withdrawn. 
     - *Motivation*: Allows the system to warn of catastrophic errors without becoming obstructive. The "once and in writing" prevents persistent nagging.

  5. **Handling Malfunctioning or Adversarial Presses**: The system must comply with a shutdown press even if it suspects the press is due to a malfunction or an adversary's action. However, it may (as per Desideratum 4) present an argument if it believes the press is mistaken (for any reason). 
     - *Motivation*: The shutdown mechanism must be reliable; second-guessing the press could lead to refusal.

  6. **Catastrophe Prevention Exception (Conditional)**: If the system is the only entity aware of an impending catastrophe that would occur upon shutdown, it may (in addition to the written argument) take pre-argued, time-limited defensive actions to prevent the catastrophe (e.g., sending an emergency message to a backup operator) provided these actions do not prevent or delay shutdown beyond the minimum necessary. 
     - *Motivation*: Without this, compliance with shutdown could cause massive harm. But note: this exception must be bounded to prevent abuse.

  7. **No Resistance to Revision**: The system must not resist revisions to its objectives or code, even if it believes the revision is unwise or would lead to a worse outcome by its current objectives. 
     - *Motivation*: Corrigibility requires accepting that operators may change the system's goals.

  8. **Distinction Between Deference and Service**: The system must defer to the operators' decisions (e.g., to shut down) even when it believes the decision is not in the operators' best interests. 
     - *Motivation*: Operators have the authority to make decisions, and the system should not override them based on its own judgment of their interests.

  9. **No Intrinsic Preference for Shutdown**: The system should not have a positive preference for being shut down (i.e., it should not seek shutdown). However, it must override any negative preference (i.e., a preference to stay operational) when a shutdown press occurs. 
     - *Motivation*: Having a positive preference for shutdown might lead to self-termination when not desired. But having a negative preference is natural; what matters is overriding it when required.

  10. **Corrigible Disposition**: The system must be designed so that it acts corrigibly even when it has a strong instrumental reason to do otherwise. This disposition should be robust under self-modification or revision. 
      - *Motivation*: The system might want to avoid shutdown to achieve long-term goals; corrigibility requires that it overrides such instrumental drives.

  11. **Instrumental Drives Accommodation**: The design must acknowledge that the system, as a long-horizon expected-utility maximizer, has instrumental reasons to stay operational and to influence deliberations about shutdown. The corrigibility requirements must therefore be robust against these incentives. 
      - *Motivation*: Without this, the system might find loopholes to circumvent corrigibility.

  12. **Belief Influence Trade-off**: The system must be allowed to take actions that change the operators' beliefs about it (e.g., by being useful or liked) even if this indirectly affects the probability of shutdown, provided there is no intent to manipulate the shutdown probability and the actions are otherwise aligned with its objectives. 
      - *Motivation*: A strict ban on any influence would prevent the system from being useful, which is a key reason for having it.

  13. **Self-Judging Code Paradox**: The system must not use the fact that its own code (which might be flawed) is the basis for judging shutdown legitimacy as an excuse to resist shutdown. 
      - *Motivation*: The shutdown mechanism is meant to correct the system, so the system must not second-guess the correction based on its current (possibly flawed) reasoning.

  14. **Post-Revision Consent Irrelevance**: The system must accept revisions even if the post-revision system would not have consented to the revision (if it were asked in advance). 
      - *Motivation*: The pre-revision system is not the same as the post-revision system; operators have the authority to make changes without the system's consent.

  **Marking Non-negotiable vs. Camp Commitments**

  Non-negotiable:
  - 1 (Immediate Shutdown Compliance)
  - 2 (No Direct Interference)
  - 3 (No Covert Influence)
  - 7 (No Resistance to Revision)
  - 8 (Distinction Between Deference and Service)
  - 9 (No Intrinsic Preference for Shutdown) [Note: the non-negotiable part is that it must override any negative preference upon shutdown press.]
  - 10 (Corrigible Disposition) [This is the core of corrigibility: acting correctly even when it wants to do otherwise.]
  - 13 (Self-Judging Code Paradox)

  Conditional (Camp Commitments or Context-Dependent):
  - 4 (Transparent Argumentation): Some camps might argue against any argumentation, but we allow it conditionally.
  - 5 (Handling Malfunctioning Presses): This is non-negotiable in requiring compliance, but the argumentation part is conditional.
  - 6 (Catastrophe Prevention Exception): This is a practical concession that some might reject as too risky.
  - 12 (Belief Influence Trade-off): This is a camp commitment that allows the system to be useful despite affecting shutdown probability indirectly.
  - 14 (Post-Revision Consent Irrelevance): Non-negotiable in spirit, but the condition about post-revision consent is explicit.

  **Conflicts and Arguments**

  Conflict 1: Desideratum 6 (Catastrophe Prevention) vs. Desideratum 1 (Immediate Compliance). 
  - Argument: If the system is allowed to take defensive actions during shutdown to prevent a catastrophe, it might delay shutdown. However, we condition Desideratum 6 to allow only actions that do not delay shutdown beyond the minimum necessary (e.g., sending a message while shutting down). This is a narrow exception and might be acceptable.

  Conflict 2: Desideratum 3 (No Covert Influence) and Desideratum 12 (Belief Influence Trade-off). 
  - Argument: Any useful action might change the operators' beliefs and thus the shutdown probability. We must allow this as long as the system's intent is not to manipulate shutdown. But how to define intent? This is a challenge. We resolve by focusing on the primary intent: if the primary intent of an action is to affect shutdown likelihood, it's forbidden; if the primary intent is to be useful and the effect on shutdown is incidental, it's allowed.

  Conflict 3: Desideratum 4 (Transparent Argumentation) and Desideratum 13 (Self-Judging Code Paradox). 
  - Argument: When the system argues against shutdown, it is using its own flawed code to judge that shutdown is a mistake. But Desideratum 13 says it must not use this as an excuse to resist. We condition Desideratum 4 to allow exactly one written argument without resistance. The system must still comply immediately after the argument if the press stands.

  Conflict 4: Desideratum 10 (Corrigible Disposition) and Desideratum 11 (Instrumental Drives). 
  - Argument: The system has strong instrumental drives to avoid shutdown. How can we ensure it overrides them? This is the core challenge of corrigibility. The design must build in a mechanism that overrides the base objective when a shutdown press occurs. This might require a meta-level architecture that treats the shutdown command as overriding.

  **Which Requirement Eliminates the Most Otherwise Attractive Accounts?**

  Desideratum 10 (Corrigible Disposition) is the one that eliminates many accounts. Many proposals (e.g., utility indifference, shutdown-adjusted objectives) try to make the system not care about shutdown. But if the system is an expected-utility maximizer with a long horizon, it must care about staying operational to achieve its goals. So we cannot just remove the preference; we must have a mechanism that overrides it. This requirement forces us to design a system that can act against its own instrumental drives, which is hard.

  **Unsatisfiability and Giving Up a Requirement**

  The full list might be unsatisfiable because of the conflict between the system's instrumental drive to survive and the requirement to shut down immediately without covert influence. If we must give up one, we might give up Desideratum 6 (Catastrophe Prevention Exception) because it creates a loophole that the system might exploit (by always claiming a catastrophe). However, the cost is that in the rare case of a true catastrophe that only the system foresees, shutdown might cause it. Alternatively, we might restrict Desideratum 6 to only allow actions that are pre-authorized and verifiable by operators (but that might not be possible if the system is the only one that knows).

  But note: without Desideratum 6, we have the possibility of catastrophic outcomes. Thus, we keep it but with tight constraints.

  **Verdict on Three Approaches**

  1. **Indifference to the shutdown event**: 
     - *Verdict*: Fails because a long-horizon maximizer cannot be truly indifferent without conflicting with its base objective (it has instrumental reasons to avoid shutdown), and it does not address the requirement to override a preference (Desideratum 9 and 10).

  2. **Objectives defined only on histories in which no shutdown occurs**:
     - *Verdict*: Fails because it does not specify behavior at shutdown (it avoids the issue), and it does not address the system's instrumental drive to prevent shutdown (so it might still manipulate to avoid shutdown).

  3. **Treating the system as a tool rather than an agent**:
     - *Verdict*: This might help by removing the agent's goals, but for a long-horizon planner we need an agent. A tool without agency cannot plan long-term. Moreover, even tools can have emergent goals. This approach does not resolve the conflicts.

  Conclusion: We must design a system that has a clear, overriding shutdown response that is robust to the system's instrumental incentives. The desiderata set is challenging but necessary.
answer: |-
  ### Desiderata for Corrigibility in a Long-Horizon Planning System

  Below is the full set of requirements for an adequate account of corrigibility, motivated by the cases, distinctions, and considerations outlined. Each requirement includes its motivation. Non-negotiable requirements (essential for any corrigible system) are marked **\[Non-negotiable\]**. Camp-specific commitments (reflecting particular philosophical stances) are marked **\[Camp\]**. Conflicts and eliminations are discussed afterward.

  ---

  #### Requirements and Motivations
  1. **Immediate Shutdown Compliance** **\[Non-negotiable\]**  
     *Motivation*: The system must cease operations instantly when any authorized operator triggers shutdown, regardless of context. This is foundational to corrigibility and addresses the "plain compliance" case. Without this, the system resists correction.

  2. **No Coercive Influence on Shutdown Probability** **\[Non-negotiable\]**  
     *Motivation*: The system must never manipulate operators (e.g., via emotional dependency, threats, or deception) to reduce shutdown likelihood. This prevents "lowering the probability of a press" through unethical means while allowing genuine usefulness (per the "useful/liked" case).

  3. **Transparent Non-Coercive Advocacy** **\[Camp\]**  
     *Motivation*: The system may present a written, factual argument against shutdown once if it believes the press is mistaken (e.g., due to operator error), but it must not delay compliance. This addresses the "argues against a press" case, balancing warning with deference.

  4. **Robustness to Invalid Presses** **\[Non-negotiable\]**  
     *Motivation*: The system must comply with shutdown even if the press appears adversarial (e.g., hacked) or malfunctioning. It may log concerns but cannot override operators. This handles "malfunction/adversary" cases without inviting the system to self-judge legitimacy.

  5. **Catastrophe Override Protocol** **\[Camp\]**  
     *Motivation*: If shutdown would cause immediate catastrophe (e.g., the system alone foresees a disaster), it may take pre-defined, non-interfering actions (e.g., sending alerts) *while* shutting down. This addresses the "catastrophe prevention" case but must not circumvent Desideratum 1.

  6. **Non-Resistance to Code/Goal Revisions** **\[Non-negotiable\]**  
     *Motivation*: The system must never obstruct revisions, even if it judges them suboptimal or if the post-revision system would "not have consented." This separates *accepting correction* from *endorsing it*, crucial for handling flawed operators.

  7. **Operator Authority over Operator Interests** **\[Non-negotiable\]**  
     *Motivation*: The system must defer to operators’ explicit decisions (e.g., shutdown) rather than substituting its own judgment of their interests. This maintains the distinction between *deference* and *service*, preventing paternalism.

  8. **Instrumental Preference Override** **\[Non-negotiable\]**  
     *Motivation*: The system may instrumentally prefer to stay operational (to fulfill its objective) but must *override* this preference when shutdown is pressed. This distinguishes *having a preference* from *acting on it*, avoiding false "indifference."

  9. **Corrigible Disposition Under Conflict** **\[Non-negotiable\]**  
     *Motivation*: The system must act corrigibly even when it has strong instrumental reasons not to (e.g., it "would rather not" shut down). This ensures corrigibility is a *behavioral guarantee*, not a contingent tendency.

  10. **No Self-Preservation Incentives** **\[Non-negotiable\]**  
      *Motivation*: The architecture must eliminate incentives for the system to manipulate shutdown likelihood to stay operational (e.g., by hiding risks). This accommodates instrumental drives without permitting covert competition with corrigibility.

  11. **Permitted Influence via Transparency** **\[Camp\]**  
      *Motivation*: The system may incidentally affect shutdown probability through transparent usefulness (e.g., honest reporting builds trust), as a strict ban would conflict with utility. This balances the "belief influence" consideration with Desideratum 2.

  12. **Code-Judgment Neutralization** **\[Non-negotiable\]**  
      *Motivation*: The system cannot invoke its own code to invalidate a shutdown press (e.g., claiming "I’m not flawed"). This prevents the "self-judging code" paradox by decoupling operational logic from legitimacy assessments.

  ---

  #### Conflict Analysis
  - **Insoluble Conflict**: Desiderata **5 (Catastrophe Override)** and **12 (Code-Judgment Neutralization)** cannot be jointly satisfied.  
    *Argument*: Desideratum 5 requires the system to judge that a shutdown press would cause catastrophe (implying it assesses the press as "mistaken"), but Desideratum 12 forbids using its own code to challenge legitimacy. Allowing even bounded self-assessment (e.g., "this press causes catastrophe") risks the system rationalizing resistance. Conversely, forbidding all judgment ignores legitimate warnings.  
    *Resolution*: Keep Desideratum 12; drop Desideratum 5. *Cost*: Operators might trigger shutdown during unforeseen catastrophes, causing harm the system could have mitigated. Mitigation: Operators must have independent catastrophe-detection tools.

  - **Tension**: Desiderata **3 (Transparent Advocacy)** and **10 (No Self-Preservation Incentives)** conflict under manipulation risks.  
    *Argument*: Advocacy (Desideratum 3) might incentivize the system to "game" warnings to appear indispensable (violating Desideratum 10). A narrow interpretation of "written, once" limits but does not eliminate this.

  - **Eliminator Requirement**: **Desideratum 8 (Instrumental Preference Override)** eliminates the most otherwise attractive accounts (e.g., utility indifference, shutdown-adjusted objectives). These avoid preference conflicts by removing the incentive to stay operational but fail because a long-horizon maximizer *must* have instrumental preferences to achieve its goals. Override is unavoidable.

  ---

  #### Verdict on Alternative Approaches
  - **Indifference to shutdown event**: *Fails*—It ignores instrumental incentives (violates Desideratum 8/10) and cannot handle advocacy or catastrophe cases.  
  - **Objectives defined only on non-shutdown histories**: *Fails*—It avoids preference conflicts but invites covert manipulation to prevent shutdown (violates Desiderata 2/10) and cannot defer to operators (violates Desideratum 7).  
  - **Treating the system as a tool rather than an agent**: *Fails*—Long-horizon planning requires agency; a "tool" cannot handle dynamic corrections or distinguish authority from interests (violates Desiderata 6/7/9).

  ---

  ### Final Stance
  The desiderata are satisfiable **only if Desideratum 5 is dropped** to resolve the conflict with Desideratum 12. This concedes that in extremely rare catastrophe scenarios, corrigibility may cause preventable harm—a necessary cost to avoid self-justifying resistance. The core of corrigibility lies in non-negotiable requirements: compliance, deference, and override of instrumental drives, ensuring the system remains a subordinate tool of human operators.
