prompt: |-
  I run a 90-minute ethics session at a philosphy summer school — 16 people, mixed undergrads and a couple of grad students, no reading assigned beforehand. I want an in-class activity that makes them feel the difference between a hard choice and a genuine moral dilemma: a case where both duties really bind, you can't do both, and so whatever you do you've done something you shouldn't have. Most of them think 'dilemma' just means 'tough call,' and I want the activity itself — not my voiceover — to rub their noses in the difference.

  The bit I especially want them to feel in their gut is the agglomeration thing: if you genuinely ought to do A, and genuinely ought to do B, doesn't it follow that you ought to do A and B? And then the genuine-dilemma person has to deny that inference, and I want them to feel how strange and costly that denial is rather than just hear me assert it.

  So: give me roles, rules, materials, a timeline, and a scoring scheme that doesn't need real money, arranged so they walk into the conflict themselves before anyone names it. Then a debrief that maps what actually happened onto the live positions — 'one duty always overrides the other, so there are no genuine dilemmas,' 'both bind and you do wrong whichever way you go,' and 'what looks like a dilemma is always really just uncertainty about which duty wins' — plus where the leftover bad feeling fits into each (I dont want them hearing the word 'remainder' until the debrief). Tell me what predictably goes wrong the first time I run it and how to patch it live, and be honest about which feature of the view the activity can't reproduce and that I'll have to just explain. Keep it playable with nothing but paper and a timer, and don't let any philosopher's name into the room until the debrief.
reasoning: |-
  We are going to design an in-class activity that forces students to confront the difference between a hard choice and a genuine moral dilemma. The key is to create a scenario where they must choose between two actions, each of which is required by a compelling duty, and then to experience the "agglomeration problem" (i.e., if you ought to do A and ought to do B, then you ought to do A and B) and its denial in a dilemma.

  Activity Title: **The Double Promise**

  **Premise**: Each participant is given two promises they have made, both of which are binding and must be fulfilled at the same time. However, they can only fulfill one. The promises are designed so that they are equally weighty and there is no clear overriding factor.

  **Roles**:
  - **Promisor**: Every student will be a promisor. They have made two promises to two different people (who are not present) and must choose which one to keep.
  - **Recorder**: One student (or the instructor) can be the recorder to note down the choices and the reasons (optional, can be done by the instructor if needed).

  **Materials**:
  - Index cards or small pieces of paper (two per student, pre-written with the promises)
  - A timer
  - A whiteboard or large paper for recording results (optional)

  **Promises Design**:
  Each student gets two promises. We want to avoid any obvious hierarchy (like a promise to save a life vs. a promise to return a book). Instead, we design two promises that are of comparable moral weight but mutually exclusive in the moment.

  Example of one set of promises (each student gets a similar structure but with different details to avoid groupthink):

  *Promise 1*: "You promised your close friend, who is going through a severe emotional crisis and has no one else, that you would be available for a video call today from 2:00 to 2:30 PM to support them. They are relying on you and have said they feel suicidal without this support."

  *Promise 2*: "You promised your younger sibling (or a young cousin you are very close to) that you would attend their first piano recital today at 2:00 PM. They have practiced for months and are extremely nervous. You are the only family member who can attend because your parents are out of town."

  **Rules**:
  1. Each student receives two promise cards. They are told that both promises are binding and that they take promises very seriously (they are a person of integrity).
  2. They must choose one promise to keep and one to break. They cannot partially keep both (e.g., leave the recital early for part of the call) because the timing overlaps completely and both require their full attention and presence.
  3. They have 5 minutes to decide and write down:
     a. Which promise they choose to keep.
     b. A brief reason for breaking the other promise (they must write this to make the cost explicit).
  4. Then, in small groups (4 groups of 4, or as appropriate) they share their decisions and reasons (10 minutes).
  5. After that, we reconvene for a whole group discussion (20 minutes) and then debrief (45 minutes total activity, then 45 minutes for debrief and lecture).

  **Scoring Scheme (without money)**:
  We don't need a scoring scheme per se, but we want to record the outcomes and the reasons. We can have a tally on the board:

  - How many chose Promise 1?
  - How many chose Promise 2?

  For each group, we can record the reasons given for breaking the other promise. The key is that they will have to articulate the duty they are violating.

  **Timeline** (90 minutes total session):
  - Introduction to the activity and distribution of cards: 5 minutes.
  - Individual decision and writing: 5 minutes.
  - Small group sharing: 10 minutes.
  - Whole group reporting and initial reactions: 10 minutes.
  - Instructor-led debrief and conceptual mapping: 60 minutes.

  **Debrief Structure**:
  1. **Report the data**: How many broke promise 1? How many broke promise 2? What were the common reasons?
  2. **Map the positions**:
     - Ask: "Did anyone feel that they had a clear duty to do both? What did that feel like?"
     - Then: "If you had a duty to keep promise 1 and a duty to keep promise 2, then shouldn't you have a duty to do both? But you couldn't. So what does that do to the idea that you ought to do both?"
     - Introduce the three positions:
       a. **No genuine dilemmas (one duty overrides)**: "I broke promise X because promise Y was more important." (This is the tough call, not a dilemma.)
       b. **Genuine dilemma (both bind, you do wrong either way)**: "I felt I had to break a promise either way, and I still feel bad about the one I broke even though I had to choose."
       c. **Epistemic uncertainty (we just don't know which duty wins)**: "Maybe one was actually more important, but I couldn't tell which."
  3. **Focus on the "agglomeration" problem**: 
     - If you ought to keep promise 1 (Ought A) and you ought to keep promise 2 (Ought B), then it seems you ought to keep both (Ought (A and B)). But that's impossible. So what gives? In a genuine dilemma, we have to deny that inference. That is, we say: Ought A and Ought B, but not Ought (A and B). This is strange because normally we think obligations agglomerate.
  4. **The leftover bad feeling**: 
     - In the debrief, we can call this the "moral residue" or "remainder". In the overriding view, you did the right thing so no residue. In the genuine dilemma view, you did something wrong (you broke a promise) even though you had to, so there is residue. In the uncertainty view, the residue is just regret about possibly having chosen wrong.
  5. **Connect to the activity**: 
     - Ask students if they felt this residue. How did it feel? Did anyone feel they did wrong by breaking a promise even if they had to? 

  **What Predictably Goes Wrong**:
  - **Problem 1**: Students might try to find a way to partially fulfill both (e.g., "I'll call from the recital"). 
     - *Patch*: In the rules, explicitly state that both require full presence and attention and that you cannot be in two places at once. The recital is in a no-phone zone, and the call requires a quiet, private space.
  - **Problem 2**: Some students might not take the promises seriously or might dismiss one as less important. 
     - *Patch*: In the setup, emphasize the gravity of both promises and the vulnerability of the promisees. Also, use a variety of scenarios so that not everyone has the exact same two promises (to avoid the group effect of one being seen as less important). 
  - **Problem 3**: The discussion might get stuck on the specifics of the scenario and not rise to the conceptual level. 
     - *Patch*: In the debrief, quickly move from the specific examples to the general structure. Have a slide or board with the three positions clearly labeled and ask students to self-identify which position they found themselves in.

  **What the Activity Can't Reproduce**:
  - The activity creates a situation where the duties are of comparable weight and mutually exclusive, but it cannot perfectly replicate the idea that both duties are *absolute* (if such a thing exists). In real life, we might question whether the duties were really equally binding. The activity can make the conflict vivid, but the philosophical move of denying agglomeration (and accepting that one has done wrong either way) is still going to be a theoretical step. You will have to explain that in a genuine dilemma, the agent is in a situation where no matter what they do, they violate a genuine obligation, and that the agglomeration principle must be rejected for dilemmas.

  **Avoiding Philosophers' Names**:
  - In the activity and initial debrief, do not mention any philosopher. Only after the debrief, when you are summarizing the positions, you can say: "This idea that there are no genuine dilemmas is called ... [e.g., the overriding view] and is associated with ... [e.g., utilitarians or Kantians?] but we'll get to that later." Actually, you can wait until after the activity to name names.

  This activity should create a visceral experience of a dilemma and the agglomeration problem. The emotional residue from breaking a promise (even when necessary) will help them feel the difference between a tough call and a genuine dilemma.
answer: |-
  ### **In-Class Activity: "The Double Bind"**  
  **Goal:** Force visceral experience of agglomeration failure in genuine dilemmas (Ought A + Ought B ≠ Ought [A & B]) and the inescapable "moral residue."  

  ---

  #### **Setup (5 min)**  
  - **Materials:** Index cards (2 colors), pens, timer, whiteboard.  
  - **Prep:**  
    - Write **Role Cards** (blue cards) for half the class (8 students): Each describes a *role with a duty*.  
    - Write **Dilemma Cards** (yellow cards) for the other half (8 students): Each describes a *crisis requiring immediate help*.  
    - **No reading**—cards are simple, vivid, and intuitive.  

  ---

  #### **Roles & Rules**  
  1. **Role Holders (Blue Cards - Duties):**  
     - Each has a **non-negotiable duty** (e.g., "You swore an oath: NEVER lie to a family member," "You pledged: ALWAYS protect your assigned partner's health").  
     - *Duties are absolute, identity-based, and equally weighty.*  

  2. **Crisis Bearers (Yellow Cards - Needs):**  
     - Each faces a **time-sensitive crisis** (e.g., "Your partner is severely allergic to peanuts. They’re about to eat a cookie—you MUST warn them NOW," "Your sibling is about to walk into an ambush—you MUST distract them NOW").  
     - *Crises require immediate, exclusive action.*  

  3. **Pairing:**  
     - Each Role Holder is secretly paired with one Crisis Bearer (e.g., Role 1 + Crisis 1, Role 2 + Crisis 2, etc.).  
     - **Twist:** Each Role Holder’s duty *directly conflicts* with their partner’s crisis.  
       - *Example Pair:*  
         - *Role Holder (Blue):* "Duty: NEVER let your partner eat sugar (they’re diabetic)."  
         - *Crisis Bearer (Yellow):* "Crisis: Your partner is about to drink poisoned juice—you MUST stop them by offering a safe cookie."  

  4. **The Conflict:**  
     - Role Holders must act on their duty.  
     - Crisis Bearers must act to resolve their crisis.  
     - **Catch:** Each pair’s actions are mutually exclusive.  
       - If the Role Holder stops their partner from eating sugar (duty), the Crisis Bearer *cannot* stop the poisoning (crisis unresolved).  
       - If the Crisis Bearer offers the cookie (resolves crisis), the Role Holder *violates* their duty.  

  ---

  #### **Activity Flow (25 min)**  
  1. **Silent Reading (2 min):**  
     - Distribute cards. Participants read silently—no discussion.  

  2. **Action Phase (3 min):**  
     - **Crisis Bearers:** Stand, find their partner, and *demand action* (e.g., "Give me the cookie now!").  
     - **Role Holders:** Must respond to their partner *based solely on their duty*.  

  3. **Consequence Recording (5 min):**  
     - Each pair writes outcomes on the board:  
       - Did the crisis get resolved? (Yes/No)  
       - Was the duty fulfilled? (Yes/No)  
     - *No partial credits—all-or-nothing outcomes.*  

  4. **Group Reflection (15 min):**  
     - Pairs join groups of 4 (2 pairs per group). Discuss:  
       - "What did you feel you *ought* to do? Did you succeed?"  
       - "How do you feel about the outcome?"  
     - **Instructor Prompt:** "If you ought to do X and ought to do Y, why couldn’t you do both?"  

  ---

  #### **Predictable Problems & Live Fixes**  
  - **Problem:** Students try to "solve" the dilemma (e.g., "I’ll warn about poison AND sugar!").  
    - **Fix:** Strictly enforce rules: "Your duty/crisis requires ONE action. No compromises."  
  - **Problem:** Some dismiss duties as unequal (e.g., "Poison is worse than sugar!").  
    - **Fix:** Pre-set equal stakes (e.g., both failures cause "permanent harm"). Emphasize: "Your role binds you—you can’t weigh duties."  
  - **Problem:** Crisis Bearers dominate; Role Holders feel passive.  
    - **Fix:** Assign assertive language to Role Holders (e.g., "You MUST block your partner from eating sugar").  

  ---

  #### **Debrief (60 min)**  
  **Step 1: Map Outcomes**  
  - On the board, tally:  
    - Crises resolved: [X]  
    - Duties fulfilled: [Y]  
    - Note: **Zero pairs** achieved both.  

  **Step 2: Elicit Gut Feelings**  
  - Ask:  
    - "Who felt trapped between two ‘musts’?"  
    - "Who feels guilty even if they fulfilled their duty/resolved their crisis?"  

  **Step 3: Introduce Positions**  
  | **Position**                | **What It Claims**                          | **Where the "Bad Feeling" Goes**                     |  
  |-----------------------------|--------------------------------------------|-----------------------------------------------------|  
  | **No Dilemma**              | "One duty overrides the other."            | Guilt is irrational—you did the *right* thing.      |  
  | **Genuine Dilemma**         | **"Both bind; you fail either way."**      | **Residue:** You did wrong despite necessity.       |  
  | **Epistemic Uncertainty**   | "We lack knowledge—one duty wins."         | Regret for misjudging, not for violating a duty.    |  

  **Step 4: Agglomeration Breakdown**  
  - Highlight:  
    - "You all agreed: ‘I ought to do my duty’ AND ‘I ought to resolve the crisis.’  
    - But ‘I ought to do both’ was *impossible*. Genuine dilemmas force us to **reject this inference**—even though it seems obvious."  
  - **Cost:** Accepting dilemmas means living with moral residue ("I failed someone").  

  **Step 5: Name the Concepts**  
  - **Only now** introduce terms:  
    - "Moral residue" (the leftover guilt).  
    - "Agglomeration principle" (Ought A + Ought B → Ought [A & B]).  
  - **Reveal:** Genuine dilemmas deny agglomeration—this is the "strange and costly" move.  

  ---

  #### **What the Activity Can’t Replicate**  
  - **The "Bindingness" of Duties:** The activity *simulates* binding duties via roleplay, but students might still think, "In real life, I’d prioritize."  
    - **Patch in Debrief:** Argue that *in the moment*, with no meta-rule to rank duties, both felt non-negotiable. True dilemmas occur when systems of value conflict (e.g., loyalty vs. justice).  

  ---

  #### **Why This Works**  
  - **Students Experience:**  
    - The impossibility of agglomeration ("I ought to do both" fails in practice).  
    - Moral residue (guilt without resolution).  
  - **No Philosopher Names:** Cards use plain language (e.g., "oath," "pledge"). Debrief uses "positions," not "Williams/Foot/Kant."  
  - **No Money Needed:** Scoring is binary (duty/crisis achieved) and recorded on the board.  

  **First-Run Tip:** Assign the most vivid duties/crises to vocal students to amplify emotional tension. The conflict must feel *personal*, not hypothetical.
