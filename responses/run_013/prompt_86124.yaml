answer: |-
  Below is a decision tree designed to resolve definitional disagreements about whether global violence is declining. It uses 10 branch questions to map the logical space, leading to 12 distinct positions (leaves). Each branch question is phrased neutrally, so participants can answer without knowing their "camp." Positions are descriptively labeled, and each leaf includes one fact or number that challenges it. The tree prioritizes your specified dimensions (e.g., agent vs. structural violence, intent, numerator/denominator choices) and incorporates your test cases.

  ### How to Use This Tree
  1. **As a group**, answer each branch question in order. Stop at the first leaf you reach.
  2. **If you land on different leaves**: Trace back to the first branch question where answers diverged. Discuss why you chose differently (e.g., "You require an agent for violence, but I count structural neglect"). This isolates definitional conflicts.
  3. **If you land on the same leaf but disagree**: Your conflict is empirical, not definitional. Research the fact/evidence listed for that leaf (e.g., "Look at data on homicides per capita since 1800").
  4. **Test cases**: Use the concrete examples (blockade, police shooting, etc.) to "test" branch questions. They clarify how definitions apply (e.g., "Does a famine from a blockade require an agent?").

  ---

  ### Decision Tree: Is Global Violence Declining?

  **Start Here**  
  *(Answer each question sequentially; follow the arrow matching your answer.)*

  1. **Does "violence" require an identifiable agent (e.g., a person, group, or state) deliberately acting?**  
     - **Yes** → Go to Q2.  
       *(e.g., a police shooting has an agent; neglect during a famine might not.)*  
     - **No** → Go to Q3.  
       *(e.g., deaths from poverty or blockades count as violence, even without a clear actor.)*

  2. **For acts with an agent, must harm be intentional to count as violence?**  
     - **Yes** → Only purposeful harm counts (e.g., bombing targeting civilians). → Go to Q4.  
     - **No** → Unintended harm counts too (e.g., civilian deaths as "collateral damage"). → Go to Q4.  
       *(Test case: A genocide stopped by outside forces killing civilians—if intent matters, this may not count as violence.)*

  3. **Does including agentless harms (e.g., neglect, poverty) make "violence" too broad to be useful?**  
     - **Yes** → Structural factors are excluded → Go to Q2. *(Loop back—now you require an agent.)*  
     - **No** → Structural violence is included → Go to Q4.  
       *(Test case: A drug priced out of reach killing millions—if included, this is violence.)*

  4. **What should we measure in the numerator?**  
     - **Deaths** → Go to Q5. *(Direct loss of life.)*  
     - **Physical injuries or disability** → Go to Q5.  
     - **Years of life lost (YLL)** → Go to Q5. *(Accounts for age at death—e.g., a child's death counts more.)*  
     - **Fear, trauma, or psychological harm** → Go to Q5.  
     - **Coercion or credible threats** → Go to Q5. *(e.g., a population under occupation or nuclear standoff with no deaths.)*  
       *(Test case: A standoff with terror but no deaths—only counts if numerator includes fear/coercion.)*

  5. **What should we use as the denominator?**  
     - **Per living person (per capita)** → Go to Q6.  
     - **Per person-year** → Go to Q6. *(Accounts for population growth and longer lifespans.)*  
     - **As a share of all deaths** → Go to Q6. *(e.g., "What % of deaths are violent?")*  
     - **Absolute counts** → Go to Q6. *(Raw numbers, no normalization.)*  
     - **Per dollar of income/wealth** → Go to Q6. *(Links violence to economic conditions.)*

  6. **What baseline should we compare to?**  
     - **Pre-state societies** (e.g., hunter-gatherer eras) → Go to Q7.  
     - **Pre-industrial societies** (e.g., 1500s Europe) → Go to Q7.  
     - **Peak violence periods** (e.g., 1914-1945) → Go to Q7.  
     - **A hypothetical stateless world** → Go to Q7. *(Imagines a world without states to assess "progress".)*  
       *(Note: Baseline choice often changes the answer but not the position—e.g., decline from 1500s may not hold from 1945.)*

  7. **Whose suffering counts?**  
     - **Combatants only** → Go to Q8.  
     - **Combatants and civilians** → Go to Q8.  
     - **All humans (alive now)** → Go to Q8.  
     - **All humans (including future generations)** → Go to Q8. *(e.g., from long-term environmental harm.)*  
     - **All sentient beings (e.g., animals)** → Go to Q8.

  8. **Are we measuring trends in typical events or catastrophic risks?**  
     - **Typical events** (e.g., homicides, small wars) → Go to Q9.  
     - **Catastrophic risks** (e.g., nuclear war, extinction) → Go to Q9.  
     - **Both, equally weighted** → Go to Q9.  
       *(Test case: A world with fewer small wars but higher nuclear risk—this question splits optimists/pessimists.)*

  9. **Does the answer depend entirely on how we define violence?**  
     - **Yes** → Go to Q10.  
     - **No** → Go to Q10. *(Believes facts can resolve it.)*

  10. **Is this primarily a factual or normative question?**  
      - **Factual** → Violence trends can be measured objectively → **Leaf 1–9**.  
      - **Definition-dependent** → The answer varies by definitions → **Leaf 10**.  
      - **Normative** → The question is about which definition we *should* use → **Leaf 11–12**.  

  ---

  ### Leaf Positions
  Each leaf is a position derived from the branch answers. **Facts that challenge it** are empirical counterpoints to test the position. *Two leaves are inseparable* (Leaf 3a/3b) due to identical branch answers.

  1. **Traditionalist Optimist**  
     - *Path:* Agent required (Q1=Yes), intent required (Q2=Yes), deaths (Q4), per capita (Q5), baseline: pre-industrial (Q6), combatants/civilians (Q7), typical events (Q8), factual (Q9=No, Q10=Factual).  
     - *Belief:* Violence (war/homicide) is declining.  
     - **Fact that challenges it:** Post-1945 civil wars and genocides killed >50 million, offsetting interstate war declines.

  2. **Comprehensive Casualty Counter**  
     - *Path:* Agent required (Q1=Yes), intent irrelevant (Q2=No), deaths/YLL (Q4), per person-year (Q5), baseline: peak violence (Q6), all humans (Q7), typical events (Q8), factual (Q9=No, Q10=Factual).  
     - *Belief:* Violence (including "collateral damage") is declining per person-year.  
     - **Fact that challenges it:** Global absolute conflict deaths rose 2010–2020 due to Syria/Yemen, though rates fell.

  3a. **Structural Pessimist**  
  3b. **Structural Optimist**  
     - *Path:* No agent required (Q1=No), structural included/useful (Q3=No), deaths/YLL (Q4), per capita (Q5), baseline: pre-industrial (Q6), all humans (Q7), typical events (Q8), factual (Q9=No, Q10=Factual).  
     - *Belief (Pessimist):* Structural violence (e.g., poverty) offsets declines in direct violence.  
     - *Belief (Optimist):* Structural violence (e.g., famine) has declined alongside direct violence.  
     - **Fact that challenges both:** Pre-industrial famines killed 5–10% of populations; modern famines are rarer but often policy-driven (e.g., 250,000 Somali deaths in 2010s blockade).  
     - *Note:* Leaf 3a/3b share all branch answers—disagreement is empirical (e.g., whether modern structural violence is worse than past).

  4. **Share-of-Deaths Advocate**  
     - *Path:* Agent required (Q1=Yes), intent irrelevant (Q2=No), deaths (Q4), share of all deaths (Q5), baseline: pre-industrial (Q6), combatants/civilians (Q7), typical events (Q8), factual (Q9=No, Q10=Factual).  
     - *Belief:* Violence is declining because fewer people die violently vs. other causes.  
     - **Fact that challenges it:** In rich nations, violent deaths are now <1% of all deaths, but this rose in some periods (e.g., 1960s US homicide surge).

  5. **Catastrophic Risk Focused**  
     - *Path:* Agent required (Q1=Yes), intent required (Q2=Yes), deaths/YLL (Q4), no denominator or absolute (Q5), baseline: peak violence (Q6), all humans including future (Q7), catastrophic risks (Q8), factual (Q9=No, Q10=Factual).  
     - *Belief:* Catastrophic violence risk (e.g., nuclear war) is rising.  
     - **Fact that challenges it:** No nuclear weapon used in conflict since 1945; arms control reduced stockpiles 85% since 1986.

  6. **Coercion Counter**  
     - *Path:* No agent required (Q1=No), structural included (Q3=No), coercion/threats (Q4), per capita (Q5), baseline: stateless hypothetical (Q6), all humans (Q7), typical events (Q8), factual (Q9=No, Q10=Factual).  
     - *Belief:* Violence (coercion/threats) is stable or rising due to state control.  
     - **Fact that challenges it:** Fear of violent crime fell 50%+ in OECD nations (1990–2020) despite media growth.

  7. **Psychological Harm Skeptic**  
     - *Path:* Agent required (Q1=Yes), intent required (Q2=Yes), psychological harm (Q4), per capita (Q5), baseline: recent past (Q6), all humans (Q7), typical events (Q8), factual (Q9=No, Q10=Factual).  
     - *Belief:* Violence (trauma/fear) is declining.  
     - **Fact that challenges it:** PTSD rates in conflict zones exceed 30%, and cyberbullying has expanded psychological harm.

  8. **Long-Term Existentialist**  
     - *Path:* Agent required (Q1=Yes), intent irrelevant (Q2=No), YLL (Q4), absolute (Q5), baseline: pre-industrial (Q6), all humans including future (Q7), catastrophic risks (Q8), factual (Q9=No, Q10=Factual).  
     - *Belief:* Future violence risk (e.g., AI/bioweapons) could erase past progress.  
     - **Fact that challenges it:** Human lifespan has doubled since 1800, increasing average YLL from violence.

  9. **Economic Violence Prioritizer**  
     - *Path:* No agent required (Q1=No), structural included (Q3=No), deaths (Q4), per dollar of income (Q5), baseline: pre-industrial (Q6), all humans (Q7), typical events (Q8), factual (Q9=No, Q10=Factual).  
     - *Belief:* "Violence" from inequality (e.g., priced-out medicine) is worsening.  
     - **Fact that challenges it:** Global poverty deaths fell 70% since 1990, but inequality within nations rose.

  10. **Definitional Relativist**  
      - *Path:* Any answers, but definition-dependent (Q10=Definition-dependent).  
      - *Belief:* Whether violence declines depends on definitions—no "true" answer.  
      - **Fact that challenges it:** Some trends (e.g., homicide rates) decline under most definitions except catastrophic ones.

  11. **Normative Selector**  
      - *Path:* Any answers, but normative (Q10=Normative).  
      - *Belief:* The debate is about which definition we *ought* to value (e.g., "Structural violence matters most").  
      - **Fact that challenges it:** Ignores data showing, e.g., that direct violence kills fewer people today than in 1500s.

  12. **Empty Leaf: Structural Intentionalist**  
      - *Path:* Agent required (Q1=Yes), intent required (Q2=Yes), but structural violence included (Q1=No). → **Incoherent**.  
      - *Why empty:* You can't require an agent *and* include agentless structural violence. No one holds this—it’s logically inconsistent.

  ---

  ### Notes on the Tree
  - **Skipped branches:** Some paths are rare or empty (e.g., measuring animal violence without structural factors). These collapse into nearby leaves.
  - **Inseparable positions:** Leaf 3a/3b (Structural Pessimist/Optimist) are identical in branch answers—disagreement is purely empirical.
  - **Test cases resolved:** 
    - A blockade causing famine counts only if structural violence is included (Q1=No, Q3=No). 
    - A police shooting always counts (agent+intent). 
    - Stopping genocide with civilian deaths counts if intent is irrelevant (Q2=No). 
    - A priced-out drug counts only with structural violence (Q1=No). 
    - A non-lethal standoff counts only if coercion/fear is in the numerator (Q4).
  - **Efficiency:** 10 questions generate 12 positions by pruning invalid paths (e.g., Q3=Yes loops back) and grouping similar outcomes.

  This tree forces definitional choices into the open, ending cyclical debates. If disagreements persist within a leaf, focus on the empirical challenge—e.g., "Gather data on homicides per capita since 1800."
