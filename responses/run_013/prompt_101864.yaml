prompt: |-
  I am putting together a paper on the ethics and aesthetics of forgery, and before I begin assessing the accounts on offer I want the specification settled. What must a theory of the value of originals — a theory that tells us why, if at all, an authentic work is worth more than a copy of it, and why, if at all, forgery is wrong — actually be able to deliver? Please write me the desiderata: the full list of what any adequate account has to get right. I mean the cases it must handle, the distinctions it must not collapse, the intuitions it must either vindicate or explain away, and any findings it has to remain consistent with. Behind each requirement, give the case or consideration that motivates it, so that I can see which requirements are doing genuine work and which are merely the prejudices of one camp — the collector's, the connoisseur's, or the moralist's. Where you think some subset of the requirements cannot be jointly satisfied, say so plainly; that, to me, is the most interesting part of the exercise.

  To keep this concrete, and to stop it collapsing into the same two or three examples everyone reaches for, I would like the list built around a set of cases I have been collecting. First, invented provenance rather than copied content: a forger who paints an entirely new picture and attributes it to a plausible but wholly fictitious dead artist, so that there is no original for it to be a copy of. Second, a workshop picture: a canvas designed by a master but executed throughout by an assistant, then sold for years as the master's own hand. Third, a self-forgery: an artist who, late in life, makes copies of his own early work and passes them off as the early originals. Fourth, a perfect physical replica, molecule for molecule, produced by a hypothetical replicator, of a painting whose original still exists. Fifth, a forged banknote, where what is counterfeited is not an aesthetic object but a token whose worth is entirely institutional. Sixth, an object made by a later hand but with the original's own tools, materials and workshop, so that it is neither a copy nor the original. Tie each requirement to whichever of these it is needed to handle, and mark which of them you take to be genuine constraints on any account and which are really just the commitments of one tradition. You may close with a brief scorecard of the main families of view — the one that locates value wholly in the aesthetic experience the object affords, the one that locates it in the object's history of production, and the one that treats authenticity as a social or symbolic construction — but keep that short; it is the criteria I am after, not the verdicts.
reasoning: |-
  Hmm, the user is working on a paper about forgery ethics and aesthetics, specifically focusing on what makes originals valuable compared to copies and why forgery might be wrong. They want a clear set of criteria—desiderata—that any theory must satisfy to be adequate. They've provided six specific cases to base these requirements on, which is helpful for grounding the discussion in concrete examples.

  The cases are diverse: invented provenance (fictitious artist), workshop paintings (master-designed but assistant-executed), self-forgeries (artist copying their own work), perfect replicas (molecule-for-molecule copies), forged banknotes (institutional tokens), and objects made with original tools/materials (neither copy nor original). This range forces the theory to handle different aspects of value—aesthetic, historical, institutional, and moral.

  The user emphasizes avoiding biases from collectors, connoisseurs, or moralists. I need to identify which desiderata are neutral constraints versus which stem from specific traditions. For instance, collectors might prioritize provenance and rarity, while moralists focus on deception's harm, and aesthetic purists care only about sensory experience. Highlighting these tensions will address the user's interest in where requirements conflict.

  For the desiderata, I should cover several key areas: Aesthetic Parity vs. Value Disparity (why originals are valued more even if copies look identical, as in the perfect replica case), Historicity (the importance of the object's creation history, relevant to workshop pictures and tools/materials cases), Singularity (uniqueness, challenged by replicas and self-forgeries), Attribution (correct credit, central to invented provenance and self-forgeries), Harm (damage from forgery, obvious in banknotes but murkier in art), and Institutional Dependence (how context shapes value, crucial for banknotes and possibly art markets).

  Each requirement must tie to the cases. For example: Aesthetic Parity must handle the replica case; Historicity explains why workshop paintings might be less valued than solo works; Singularity is tested by replicas; Attribution covers invented provenance and self-forgeries; Harm applies to banknotes but needs extension to art; Institutional Dependence distinguishes banknotes from art. I need to flag where traditions influence these—e.g., Singularity might be a collector's bias, while Aesthetic Parity reflects an aesthetic tradition.

  Conflicts will arise. For instance, if value is purely aesthetic (Aestheticism), it can't explain why originals are prized over identical replicas. If it's purely historical (Provenantism), it might undervalue the aesthetic experience. And if it's institutional (Constructionism), it could make value too arbitrary, ignoring material history. The user finds this tension "most interesting," so I'll outline these trade-offs clearly.

  Finally, a brief scorecard of theories: Aestheticism (fails on non-experiential cases), Provenantism (struggles with institutional tokens like banknotes), Constructionism (might overextend to art). I'll keep it concise as requested.

  This structure ensures the response is thorough, case-driven, and critical—meeting the user's academic rigor and curiosity about foundational conflicts.
answer: |-
  Here is a comprehensive list of desiderata for a theory of the value of originals and the wrongness of forgery, rigorously tied to your six cases and analyzed for their grounding. These represent what an adequate theory *must* explain or accommodate to be considered successful. Genuine constraints (GC) are those arising from core logical, ontological, or broadly shared ethical/intuitive concerns. Traditions (T) reflect specific vested interests or perspectives (Collector, Connoisseur, Moralist).

  ### Core Desiderata (What the Theory Must Deliver)

  1.  **Aesthetic Parity vs. Value Disparity (GC):** The theory must explain why an original can be significantly more valuable *even when* a copy (including a perfect physical replica) affords an identical aesthetic experience to any observer under any viewing condition. It cannot simply collapse value into immediate perceptual properties.
      *   **Motivating Case:** *Perfect Physical Replica (Case 4)*. If the replica is molecule-for-molecule identical and perceptually indistinguishable, why isn't it worth the same? Aesthetic experience alone cannot distinguish them. (Challenges pure aestheticism).
      *   **Also Relevant:** *Self-Forgery (Case 3)* - The copy might be aesthetically identical or even superior (due to the artist's matured skill), yet the original retains unique value.

  2.  **Historicity & Causal Genesis (GC):** The theory must account for the fundamental importance of the object's actual history of creation – who made it, when, how, and under what circumstances. The value is not *only* in the present object but in its genesis.
      *   **Motivating Case:** *Workshop Picture (Case 2)*. Why is a painting designed by the master but executed entirely by an assistant valued differently (usually less) than one executed entirely by the master? The design (aesthetic content) might be identical, but the causal history differs. *Object with Original Tools/Materials (Case 6)* further complicates: is the object's value derived from its *own* unique causal history using those tools, or parasitically from the original's history?
      *   **Also Relevant:** *Invented Provenance (Case 1)* - The object *has no* authentic historical connection to the claimed artist/period; its history is fabricated. *Self-Forgery (Case 3)* - The copy has a different (later) causal history than the original it mimics.

  3.  **Singularity & Non-Replicability (GC/T - Collector):** The theory must explain the value placed on the unique, singular object itself, not just the type of object it instantiates. Copies, even perfect ones, are different tokens of that type.
      *   **Motivating Case:** *Perfect Physical Replica (Case 4)*. The original is *this specific* object with *this specific* history. The replica is a distinct object, despite being physically identical. *Self-Forgery (Case 3)* highlights that even the *artist* cannot perfectly replicate the singularity of the original creation event.
      *   **Tradition Note:** This is paramount for collectors (rarity, owning "the one") but may be less crucial for pure aesthetic appreciation.

  4.  **Correct Attribution & Anti-Deception (GC/Moralist):** The theory must explain why misrepresenting the origin, authorship, or history of an object (forgery) is centrally wrong, constituting a fundamental violation of trust and knowledge within the relevant practice (art, collecting, scholarship).
      *   **Motivating Case:** *Invented Provenance (Case 1)*. The core wrong here *is* the deception: creating a false history. There's no "original" being copied, just a lie about origin. *Self-Forgery (Case 3)* involves the artist deliberately deceiving about the *time* and *circumstance* of creation.
      *   **Also Relevant:** *Workshop Picture (Case 2)* - If sold *as* the master's handiwork, it's a misattribution/deception. If sold *as* "studio of" or "workshop", it's different. *Banknote (Case 5)* - The primary wrong is deception undermining institutional trust.
      *   **Genuine Constraint:** Deception fundamentally corrupts the epistemic and evaluative practices surrounding the objects.

  5.  **Harm Specification (GC/Moralist):** The theory must specify *if* and *what kind* of harm is caused by forgery (beyond mere deception), and to whom (collectors, institutions, the artist, art history, society). This harm must be distinct from the "harm" of not getting the singular object one wanted.
      *   **Motivating Case:** *Banknote (Case 5)*. Harm is clear: economic damage, undermining currency stability and trust in the issuing authority. Does forgery in art cause analogous harm? If so, what? (Financial loss to buyers? Distortion of art history? Theft of the artist's legacy? Erosion of institutional trust?) *Invented Provenance (Case 1)* - Who is harmed by a fake "unknown old master"? The buyer financially, but is art itself harmed?
      *   **Also Relevant:** *Self-Forgery (Case 3)* - Does the artist harm themselves, their legacy, or only the buyer? *Workshop Picture (Case 2)* - Harm depends on the deception; sold honestly as workshop, harm might be minimal.

  6.  **Distinction: Institutional vs. Non-Institutional Value (GC):** The theory must distinguish between objects whose value is *entirely* constituted by institutional rules/agreements (like currency) and objects (like artworks) where value, while influenced by institutions (art market, museums), seems to have a significant non-institutional component (aesthetic, historical, expressive).
      *   **Motivating Case:** *Banknote (Case 5)* vs. *Perfect Physical Replica (Case 4)* or *Workshop Picture (Case 2)*. A banknote's value *is* its institutional status; a perfect physical replica of a painting lacks the institutional status of "being the original," but does its value *only* come from that status, or also from the history tied to the original object? A theory collapsing all value to institutional status fails here.
      *   **Genuine Constraint:** A theory must avoid over-extending institutional explanations to cases where non-institutional factors (history, aesthetic creation) seem essential, or under-applying them to cases like currency.

  7.  **Value Beyond Material Substrate (GC):** The theory must account for why the value is not solely tied to the physical matter of the object, but also to its history and context of creation. The *same* matter arranged differently (or with a different history) has different value.
      *   **Motivating Case:** *Object with Original Tools/Materials (Case 6)*. An object made later, but with the original artist's tools/materials in their workshop, has a different value than both the original (different creation event) and a standard copy (different materials/provenance). Its value stems partly from its *own* unique causal history linked to the original context, not just its matter. *Self-Forgery (Case 3)* - The copy uses new matter, even if visually identical.

  8.  **Accommodation of Gradations of Authenticity (GC/T - Connoisseur):** The theory must handle cases where authenticity is not a simple binary (original/forgery) but involves degrees (e.g., workshop pieces, restorations, collaborations, later states). Value often correlates with these gradations.
      *   **Motivating Case:** *Workshop Picture (Case 2)*. It's not a pure forgery (the master designed it, approved it?) nor a pure autograph work. Its value typically lies somewhere in between. *Object with Original Tools/Materials (Case 6)* presents another complex gradation – more authentic than a replica? Less than the original?

  9.  **The Artist's Perspective / Intentionality (T - Connoisseur/Moralist):** The theory should address the role of the artist's intentions and actions in constituting the work's authenticity and value. Does an artist retroactively delegitimize a work via self-forgery?
      *   **Motivating Case:** *Self-Forgery (Case 3)*. The artist *intentionally* creates a deceptive copy. Does this act diminish the value of the copy? Does it affect the value of the original? Does the artist have a unique authority over the authenticity of their own work?

  ### Tensions and Potential Incompatibilities

  *   **Aesthetic Parity vs. Historicity/Singularity:** This is the core tension. A pure aesthetic theory (value = experience) struggles mightily with Cases 1, 2, 3, 4, and 6, where identical experience coexists with massive value disparity based on history/singularity. Conversely, a pure historical theory struggles to explain *why* the aesthetic experience of the original (or a perfect replica) matters at all if the history is paramount. A theory *must* bridge this gap.
  *   **Harm in Art vs. Currency:** Extending the clear, direct harm of counterfeiting currency (Case 5) to art forgery (Cases 1, 2, 3) is difficult. Financial harm exists but seems secondary; harm to art history/knowledge or the artist's legacy is more nebulous. A theory promising moral wrongness must convincingly articulate this harm without over-reliance on institutional damage or collapsing into mere deception-as-harm.
  *   **Institutional Dependence vs. Non-Institutional Value:** Over-emphasizing institutional construction risks making art value as arbitrary as banknote value (denying GCs 1, 2, 3, 7). Under-emphasizing it risks failing to explain the market dynamics and social practices surrounding art (Case 2, Case 1 valuation). A theory must navigate this middle ground.
  *   **Gradations vs. Singularity:** Valuing singularity (GC 3) can clash with acknowledging gradations (GC 8). Is a workshop piece valuable *because* it's unique (singular) or *despite* not being fully autograph (a gradation)? A theory needs a coherent account of how different authenticity factors combine.

  ### Brief Scorecard of Main Families of View vis-à-vis Desiderata

  *   **Aestheticism (Value in Experience):** Fails on GC1 (Parity/Disparity), GC2 (Historicity), GC3 (Singularity), GC7 (Beyond Substrate). Excels on simplicity for pure viewing. Struggles with Cases 1, 2, 3, 4, 6. May struggle with Harm (GC5).
  *   **Provenantism/Historical (Value in Origin & History):** Excels on GC2 (Historicity), GC7 (Beyond Substrate), handles GC3 (Singularity), GC8 (Gradations), Cases 1, 2, 3, 6 well. Explains GC1 (Parity/Disparity). Can explain Harm (GC5) as deception + distortion. May struggle with the *degree* of value difference in GC1 (perfect replica vs. original) and fully distinguishing art from currency (GC6) without additional elements.
  *   **Institutional/Social Constructionism (Value in Status/Belief):** Excels on GC6 (Institutional Distinction), Case 5 (Banknote). Can explain market dynamics and deception's harm (GC4, GC5). Handles Case 1 (Invented Provenance) by focusing on false belief. Risks undermining GC1, GC2, GC3, GC7 by making value seem arbitrary. Struggles to explain the *persistence* of valuing originals even if a perfect replica were institutionally sanctioned as "the original" (Case 4). May conflate art and currency value (failing GC6).

  This framework provides the rigorous, case-driven criteria needed to evaluate competing theories. The tensions, particularly between aesthetic experience and historical genesis/singularity, and the challenge of defining harm specific to art forgery, are where the deepest philosophical work lies. Good luck with your paper!
