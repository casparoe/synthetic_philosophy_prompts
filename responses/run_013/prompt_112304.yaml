  - Lands with people who understand existence debates  
  - Shows comprehension of why "no fact of the matter" is tempting  
  - Avoids clichés like "philosophers argue about nothing" or hot dog/sandwich debates  
  - Doesn't mock the flatmate as stupid or relativistic  

