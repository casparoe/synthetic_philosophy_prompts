  1. Acknowledge the flatmate's point (internal consistency/language relativity)  
  2. Undercut it with the user's behavioral evidence (coffee placement)  
  3. Be technically sharp for a philosophy audience  

  Key angles:  
  - The flatmate's actions betray his stated ontology (coffee on tabletop but not fusion)  
  - "Verbal dispute" claim collapses under practical engagement with objects  
