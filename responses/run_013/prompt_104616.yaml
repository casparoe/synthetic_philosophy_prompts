  ## THE OWL & CHERRY LABORATORY  
  **Monthly Tasting Flight: October**  
  *For the Discerning Palate & the Inquiring Spirit*

  *Dearest Connoisseur,*

  The autumnal shift whispers through our roastery, stirring the very air with the promise of complexity. This month’s curation embodies that liminal breath – coffees that speak of transitions, of roots deepening, and of flavours that refuse to be pinned down, only *felt*. We present four singular expressions, each a testament to the unique conversation sparked between origin, process, and the roaster’s flame. Approach them not merely as beverages, but as catalysts for contemplation. Brew thoughtfully. Taste deeply.

  ---

  **1. ETHIOPIA GEDEB LOT #237 | WASHED | LIGHT ROAST**  
  *From the Roaster's Desk: Jovani finds our ‘Nighthawk Blend’ suddenly thin, yet swears its profile is unchanged. I still relish its depth, convinced it’s my own perception that’s shifted. We share the bag, sip from the same cup. The truth? It lingers somewhere between the bean and the sip, maddeningly out of reach.*

  This Gedeb does not shout; it *unfurls*. Think less of the bold, sun-drenched stone fruit of its Yirgacheffe cousins, and more of the delicate, almost evanescent lift found in a certain Kenyan we cupped last spring – though lacking that coffee’s assertive blackcurrant acidity. It sidesteps the heavier, fermented notes sometimes found in natural Ethiopians, offering instead a clarity reminiscent of the first truly cool morning after a humid summer. The finish evokes not the *weight* of bergamot, but its *brightness*, akin to the zest left on your fingers after peeling, rather than the oil itself. It is a coffee defined by its *distance* from others, a negative space filled with quiet grace. Brew for clarity: V60 or Chemex. *Brew Temp: 94°C.*

  **2. COLOMBIA HUILA FINCA ALTAMIRA | ANAEROBIC NATURAL | MEDIUM ROAST**  
  *From the Roaster's Desk: To settle the ‘Nighthawk’ debate (or deepen it?), I spent three months recalibrating. Diligent water adjustments, palate cleansers, even abstaining from dark chocolate! The result? The coffee tastes… different. But is it the bean, or the newly tuned instrument of my tongue? The question itself seems to alter the answer.*

  This Huila is not merely tasted; it compels *action*. It is the coffee that makes me push back from the roaster’s control panel, seeking the worn wooden bench by the window, especially when the October rain slicks the cobblestones below. It moves my hand towards the jar of preserved Amarena cherries, their dark syrup a necessary counterpoint. It demands stillness, urging contemplation rather than analysis. The aroma? It pulls me towards memories of my grandmother’s plum compote simmering – not the precise flavour, but the *feeling* it evokes, the warmth, the slight prickle of woodsmoke from the old stove. It pairs not with pastries, but with silence, and perhaps a worn notebook. Brew for immersion: French Press or Clever Dripper. *Brew Temp: 92°C.*

  **3. PANAMA BOQUETE DON K | GEISHA | LIGHT-MEDIUM ROAST**  
  *From the Roaster's Desk: Training young Mateo yesterday was illuminating. I poured this Geisha blind. “Find me ‘Jasmine’,” I said, pointing to our flavour wheel quadrant #7. He hesitated, sipped, then pointed firmly: “There! And… a hint of #12, ‘Candied Orange Peel’?” Precisely! The vocabulary lives outside us.*

  Ah, the Geisha. Its character? Often called ineffable. Yet, watch: Mateo, our newest apprentice, cupped it yesterday. I guided him: “Notice the high floral register? Compare it to quadrant #7 on our wheel – the intensity of Jasmine Absolute, yes?” He nodded, eyes widening. “Now, beneath that, not the peach *flesh* of #15, but the delicate scent of peach *blossom* bordering #16. And the finish? Clean, vanishing like bergamot zest (#12), not lingering like orange oil (#11).” He tasted, he pointed, he *learned*. The ‘ineffable’ became coordinates on a shared map. Its brilliance isn’t locked within; it’s a beacon we’re trained to see. Brew for precision: Kalita Wave. *Brew Temp: 93°C.*

  **4. SUMATRA GAYO HIGHLANDS | WET-HULLED | DARK ROAST**  
  *From the Roaster's Desk: An odd moment with Carla at the cupping table. Sipping the Gayo, I was suddenly transported to the damp, cedar-lined tool shed behind my childhood home after a heavy rain – the scent of wet earth, aged wood, and my father’s pipe tobacco faintly lingering. “Smoke? Earth? Sure,” Carla said, “but cedar? Pipe tobacco? That’s just you, Jasper.” Was it? It felt as real as the cup in my hand.*

  This Gayo possesses a profound depth, a grounding earthiness that resonates on a primal level. For me, tasting it is an immediate plunge into the heart of a specific memory: the unmistakable, comforting scent of the damp forest floor surrounding a particular moss-covered granite boulder encountered on a hike near Mount Kerinci years ago – the exact mineral tang, the decay, the vibrant life pushing through. It’s the coffee that makes me reach for a heavy mug, never a delicate cup. Its character feels as undeniable as the weight of a river stone. Yet… Carla, tasting beside me, finds it robustly earthy and pleasantly smoky, but the *granite*, the *specific moss*, the *damp wool sweater I recall wearing*? She smiles kindly, shaking her head. The certainty within me remains unshaken, yet strangely solitary. Brew for body: Siphon or traditional Ibrik. *Brew Temp: 88°C.*

  ---

  **A Final Thought from the Roaster's Desk:**  
  The dance between bean and taster is eternal, endlessly fascinating. Does the coffee reveal itself, or do we project ourselves upon it? Does it change, or do we? Perhaps the most honest answer is that the experience *is* the relationship. It exists precisely in that vibrant, shifting space *between*. Savour the journey, not just the destination.

  With Sincere Appreciation,  
  Jasper Finch  
  Head Roaster & Custodian of the Flame  
  The Owl & Cherry Laboratory

