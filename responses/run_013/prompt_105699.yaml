  Hmm, their core question seems to be: What theory of meaning must we presuppose when we treat pictograms as capable of being true or false? And how does this relate to Neurath's observable-facts-only ambition given the necessary conventional elements?

  I need to address several layers here. First, the propositional nature of signs - that prohibition circle really does function like a logical operator. Second, the hybrid semiotics where depiction and convention interlock. Third, how this challenges Neurath's pure observation-based ideal while still retaining some grounding in physical reality. 

  The user also wants to know which philosophical positions are ruled out by current practice. For instance, the "mere resemblance" theory fails because identical icons change meaning based on context (like the cigarette image meaning prohibition vs advertisement). And the "compressed language" view doesn't explain why we need to design icons at all when words would suffice.

  I should emphasize that the practice commits us to a weak conventionalism where conventions govern how depictive content gets "read" as propositions. The running man isn't just a picture; the system assigns it the illocutionary force of an instruction. That's why the standards committee argues about wording - they're defining speech acts.

  Most vulnerable point in my reasoning? Probably claiming the arrow is fully conventional rather than depictive. One could argue arrows resemble directional forces in nature. But in signage, its meaning is fixed by position relative to icons, not resemblance. Still, that's where counterarguments might bite.

  The user's closing request for an opinionated answer is helpful - they want philosophical commitment, not survey. I'll position the system as propositional-hybrid-semiotics with attenuated Neurathian grounding. And note that abandoning this for pure convention would lose intuitive recognizability, while pure depiction couldn't handle deontics.
answer: |-
  Your hospital signage practice presupposes a **hybrid propositional theory of meaning** that combines depictive resemblance with conventional rules, treating signs as *proposition-bearing devices* rather than mere resemblance-cues or context-dependent gestures. Here’s the implicit theory reconstructed:

  ### Core Commitments of the Practice:
  1. **Pictograms Express Propositions**  
     Signs make truth-apt claims: e.g., the red-barred circle asserts *"X is forbidden here"*. This requires:  
     - **Deontic Operators**: Arbitrary symbols (🚫, ⚠️, ➡️) act as logical operators modifying depictive content. The red circle *is* the negation/command.  
     - **Subject-Predicate Structure**: The cigarette icon (subject) + barred circle (predicate) = *"Smoking prohibited."*  
     *Rival View Ruled Out*: Pure resemblance theories (e.g., Goodman’s "density" account) fail—the same cigarette icon could mean "smoking area" or "buy cigarettes" without conventions.

  2. **Conventions Anchor Ambiguity**  
     - Colors/shapes carry coded meaning (red = prohibition, green = permission) learned through repetition.  
     - Arrows are purely conventional vectors; no resemblance to direction exists.  
     *Rival View Ruled Out*: Contextualism (pictures gain meaning *only* from immediate context) is insufficient—your style guide *predefines* meanings cross-contextually.

  3. **Neurathian Grounding, Attenuated**  
     Neurath’s "observable anchor" survives in depictive elements (e.g., the running figure resembles fleeing). But conventions *override* resemblance:  
     - The bed icon points to wards *only* because of the arrow’s rule-based vector, not because beds "look like" destinations.  
     - Deontics (🚫) are ungrounded in observation; they are social contracts.  
     *Compatibility*: A "thin" Neurathianism holds where icons *initially* leverage resemblance, but the system admits irreducibly abstract operators.

  ### What the Practice Allows (Underdetermination):
  - **Depiction vs. Convention Ratio**: The bed *could* be replaced by a door symbol (if learned), but the running figure *must* resemble running. Resemblance is required for intuitive entry points.  
  - **Syntax Flexibility**: "Green running figure = exit" could be inverted to "red = exit" if codified—but not without breaking learned conventions.  
  - *Compatible Theories*: Semiotic approaches (Peirce’s symbols/icons) or functionalist linguistics (signs as speech acts) fit, provided they accept propositionality.

  ### If Rival Theories Prevailed:
  - **Pure Convention (e.g., Fodorian Symbolism)**: Depictive icons become replaceable by arbitrary glyphs (e.g., "Δ = exit"). Loss: intuitive recognition for new users.  
  - **Pure Resemblance (e.g., Naive Iconism)**: Prohibitions/requirements collapse—no way to distinguish "smoking area" from "no smoking."  
  - **Contextualism (e.g., Wittgensteinian Use-Theory)**: Standardization fails; each sign’s meaning shifts per location, demanding site-specific training.  

  ### Weakest Link: The Arrow’s Conventionality  
  I’m least confident that arrows are *wholly* non-depictive. One could argue arrows schematize motion paths (a thin resemblance claim). Evidence for full conventionality:  
  - Rotated arrows (e.g., ↓ meaning "forward") break resemblance.  
  - Replacing arrows with numbers (e.g., "Zone 3 →") works identically—meaning is assigned, not depicted.  
  *Counterevidence*: If users intuitively grasp ↑ as "up" without training, resemblance plays a role. But in your system, horizontal arrows lack inherent directionality—they are governed by the style guide’s rules.  

  **Verdict**: Your practice commits to pictures as *propositional vehicles* enabled by rule-bound conventions. Neurath’s observational ideal is compromised but not abandoned—it survives as a user-friendly entry point, while syntax and deontics handle abstraction. The system’s efficiency relies on this hybridity.
