  ### The Infinite-Game Case
  Consider an infinite game where play can run forever with no winner (e.g., infinite Hex, or a variant of Chomp on an infinite grid). Assume it is determined (e.g., Borel game), so winning strategies exist where possible.

  - **Hunch**: The argument still shows Player 2 cannot force a win, but may not prove Player 1 wins.
  - **Application**:
    - **Sound?** Conditionally. Requires the game to be determined (1) and satisfy symmetry (2) and monotonic advantage (3). For example:
      - In infinite Hex, symmetry and monotonic advantage hold (extra stones help), so the argument is sound.
      - In an infinite impartial game like Nim with certain heaps, it may hold if moves preserve symmetry and monotonicity.
    - **Win?** Only if no draws are possible (4). But if infinite play is a draw (common in infinite games), the argument **cannot prove a first-player win**—it only proves Player 1 can force at least a draw (i.e., Player 2 cannot force a win).
  - **Outcome**: Strategy-stealing shows "first player can avoid losing" (non-loss), but without forbidding draws, it does not guarantee a win.

