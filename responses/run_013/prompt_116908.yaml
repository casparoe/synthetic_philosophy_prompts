answer: |-
  To resolve your concerns about strategy-stealing arguments, let's establish a unified principle based on combinatorial game theory. The core insight is that these arguments rely on **positional symmetry** and **monotonicity of advantages**, which determine both soundness and whether the argument yields a win or merely a non-loss. Below, I define the principle precisely, then apply it to your examples, including the infinite-game case. Finally, I identify which of your verdicts might need overturning and where the reasoning is most fragile.

  ### The Unified Principle
  A strategy-stealing argument is **sound** (i.e., logically valid) for a two-player deterministic perfect-information game if:
  1. **Finite or Bounded Termination**: The game is finite (every play ends after finitely many moves), or if infinite, it is determined (e.g., Borel, per Martin's Theorem) and has no chance moves.
  2. **Symmetry Preservation**: The game state is symmetric under player roles (i.e., the board and moves are identical for both players, ignoring whose turn it is), or can be made symmetric after an initial move.
  3. **Monotonic Advantage**: Making an extra move is never disadvantageous. Formally:
     - For any state \(S\), if a player makes an additional legal move to reach state \(S'\), then \(S'\) is at least as favorable for them as \(S\) was for their opponent. This means:
       - If a winning strategy existed for the opponent from \(S\), then the player must have a winning or non-losing strategy from \(S'\).
       - If the opponent's strategy prescribes a move already made (e.g., the "throwaway" move), the player can substitute any arbitrary legal move without worsening their position relative to the intended outcome.

  The argument **proves a first-player win** (not just non-loss) if additionally:
  4. **No Draws**: The game cannot end in a draw; every terminal state is a win for one player.

  ### Why This Principle Works
  - **Soundness (non-loss)**: Stealing requires that after the first move, Player 1 can "mirror" Player 2's hypothetical winning strategy without penalty. Symmetry ensures Player 1 can adopt Player 2's role, and monotonic advantage guarantees the extra move doesn't hurt.
  - **Win vs. Non-Loss**: If a draw is possible, the argument only shows Player 1 can avoid losing (since Player 2 cannot win). If draws are impossible, Player 1 must win.
  - **Key Vulnerabilities**: The monotonic advantage condition (3) is the linchpin. If it fails (e.g., zugzwang), the argument collapses. Symmetry (2) is also critical—if pre-existing asymmetries exist, Player 1 cannot assume Player 2's role.

  ---

  ### Verdicts on Your Examples
  Applied coldly using the principle:

  1. **Hex** (big board):
     - **Sound?** Yes. Finite, symmetric board (ignoring colors), and an extra stone never harms (monotonic advantage: more stones only help connect sides).
     - **Win?** Yes. No draws possible (by Hex rules).
     - **Verdict**: First player wins. Your view is correct.

  2. **Chomp**:
     - **Sound?** Yes. Finite, symmetric board (after first move), and taking the top-right corner is never harmful (monotonic advantage: removing more squares only limits opponents).
