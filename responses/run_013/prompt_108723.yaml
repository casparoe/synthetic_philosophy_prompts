  Below is a diagnostic decision tree designed to help students uncover their implicit commitments about biological function. The tree uses concrete cases to navigate the logical space, with branch nodes phrased as neutral questions about scenarios. Positions emerge from combinations of answers, not predefined labels. Cases specified in the query are integrated (marked with **★**).  

  ---

  ### **Decision Tree: What Makes X the Function of a Trait?**  
  *Start at Node 1. Answer yes (Y) or no (N) to each question.*  

  1. **★** Consider a molecule-for-molecule duplicate of a fox that forms accidentally (no ancestors/selection history). Its heart pumps blood. Does this heart **currently** have a function?  
     - **Y → Node 2**  
     - **N → Node 8**  

  2. **★** A trait arises and persists by random drift (not selection) but now helps the organism survive. Does it have a function?  
     - **Y → Node 3**  
     - **N → Node 9**  

  3. **★** A vestigial structure (e.g., human appendix) contributes nothing to survival/reproduction. Does it have a function?  
     - **Y → Node 4**  
     - **N → Node 5**  

  4. **★** A malformed heart (in a living organism) has never pumped blood. Does this *specific* heart have a function?  
     - **Y → Node 6**  
     - **N → Node 7**  

  5. **★** A gene inserted into a lab-built minimal cell does nothing. Does it have a function?  
     - **Y → Node 6**  
     - **N → Node 10**  

  6. A beaver’s dam maintains an ecosystem. Is this a biological function of the dam?  
     - **Y → Node 11**  
     - **N → Node 12**  

  7. **★** A neural network unit "detects edges" after training. Does it have a function?  
     - **Y → Node 13**  
     - **N → Node 14**  

  8. **★** A trait shortens lifespan but boosts reproductive success (e.g., intense mating displays). Is shortening lifespan part of its function?  
     - **Y → Node 15**  
     - **N → Node 16**  

  9. **★** A structure was selected for noise but now aids flight (e.g., feathers). Is noise still its function?  
     - **Y → Node 17**  
     - **N → Node 18**  

  10. **★** A heart stops pumping after death. Did it lose its function *instantly*?  
      - **Y → Node 19**  
      - **N → Node 20**  

  11. An ant colony’s sentinel behavior reduces colony fitness but benefits the species. Is sentinel-ing a function?  
      - **Y → Node 21**  
      - **N → Node 22**  

  12. **★** The neural network unit (Node 7) has a function. Would it still have one if trained via random trial-and-error (not backpropagation)?  
      - **Y → Leaf 7**  
      - **N → Leaf 8**  

  *(Continue from branches below)*  

  ---

  ### **Leaves (Positions)**  
  *Based on answer paths. "Awkward commitment" highlights counterintuitive implications.*  

  - **Leaf 1: Etiological (Actual History Required)**  
    - *Path:* 1(N) → 8(Y) → 17(Y) or 1(N) → 8(N) → 18(Y)  
    - *Awkward commitment:* The accidental fox duplicate’s heart has **no function** (Node 1).  
    - *Unoccupied paths:* 1(N) → 8(Y) → 17(N) → ? (Incoherent: Selection history fixes function, so co-opted traits can’t gain new functions without new selection).  

  - **Leaf 2: Etiological (Dispositional)**  
    - *Path:* 1(N) → 8(N) → 18(N)  
    - *Awkward commitment:* Drift traits **can have functions** if they *would* be favored by selection (Node 2).  
    - *Unoccupied paths:* 1(N) → 8(Y) → 17(N) → ? (Unexplored: Dispositionalists rarely address co-option without new selection).  

  - **Leaf 3: Systemic Capacity**  
    - *Path:* 1(Y) → 2(Y) → 3(N) → 5(N) → 10(N) → 7(Y) → 12(Y)  
    - *Awkward commitment:* Functions depend on **analyst’s choice** of system (e.g., Node 11: beaver dam functions only if we prioritize the organism, not ecosystem).  

  - **Leaf 4: Goal-Relative**  
    - *Path:* 1(Y) → 2(Y) → 3(Y) → 4(Y) → 6(N)  
    - *Awkward commitment:* Vestigial structures **have functions** if systems have goals (e.g., "appendix’s function is to atrophy"; Node 3).  

  - **Leaf 5: Generalized Selection (Extended Etiology)**  
    - *Path:* 1(Y) → 2(Y) → 3(N) → 5(Y) → 6(Y)  
    - *Awkward commitment:* Lab genes **have functions** if designers *intended* effects, even if none occur (Node 5).  

  - **Leaf 6: Pluralist**  
    - *Path:* 1(Y) → 2(N) → 9(...) *or* 1(N) → 3(Y) → ... *[Multiple paths]*  
    - *Awkward commitment:* **No unified concept**; "function" means different things in drift vs. selected traits (Nodes 2, 9).  

  - **Leaf 7: Deflationary**  
    - *Path:* Any → 12(Y)  
    - *Awkward commitment:* Disputes about neural networks/biology are **verbal** (Node 12).  

  - **Leaf 8: Unnamed (Current Contribution + Non-Biological Exclusion)**  
    - *Path:* 1(Y) → 2(Y) → 3(N) → 5(N) → 10(N) → 7(Y) → 12(N)  
    - *Awkward commitment:* Neural networks **have functions**, but only if shaped by "selection-like" processes (Node 12).  

  ---

  ### **Indistinguishable Leaves & Unoccupied Paths**  
  - **Leaf 3 (Systemic Capacity) and Leaf 8 (Unnamed)** cannot be separated; both require current contribution but differ only on whether "system" must be biological (no non-question-begging case exists).  
  - **Unoccupied paths:**  
    - 1(Y) → 2(Y) → 3(N) → 5(Y) → 6(N): Incoherent (assigns functions without contributions, goals, or history).  
    - 1(N) → 8(Y) → 17(N): Unexplored (dispositional etiologists rarely deny that co-option creates new functions).  
    - 1(N) → 3(Y): Unattractive (requires history but assigns functions to vestigial traits without current/dispositional benefits).  

  ---

  ### **Nodes with Loaded Phrasing and Neutral Alternatives**  
  - **Node 1:** "Does this heart **currently** have a function?"  
    - *Load:* "Function" implies normativity/history.  
    - *Neutral:* "Is pumping blood what this heart is *supposed* to do?"  
  - **Node 4:** "Does this *specific* heart have a function?"  
    - *Load:* "Function" smuggles in ideal performance.  
    - *Neutral:* "Is this heart *meant* to pump blood, even though it never has?"  
  - **Node 8:** "Is shortening lifespan part of its **function**?"  
    - *Load:* Assumes shortening lifespan is dysfunctional unless specified.  
    - *Neutral:* "Is shortening lifespan part of what this trait *does to achieve reproductive success*?"  
  - **Node 10:** "Did it lose its function *instantly*?"  
    - *Load:* "Lose" implies function is transient and activity-dependent.  
    - *Neutral:* "At the moment of death, does pumping blood cease to be what the heart is *for*?"  

  ---

  This tree forces students to confront inconsistencies in their intuitions (e.g., accepting functions in duplicates but not drift traits). Positions emerge from case judgments, not labels, and awkward commitments highlight trade-offs. The unseparated pair (Leaf 3/8) reveals a gap in the debate about "system" scope.
