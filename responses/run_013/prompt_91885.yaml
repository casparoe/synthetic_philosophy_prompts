prompt: |-
  I'm a TA for an upper-level course on collective decision-making — it's cross-listed with the policy school, so it's a mix of philosophy majors and MPP students — and I've got a stack of midterms to get through before Thursday, so I'm trying to move fast without being unfair to anyone. The unit I'm grading is the one on the unilateralist's curse. The prof taught it with a worksheet where a bunch of agents can each act on their own without checking with anyone else, and the point she kept hammering is that the group can end up worse off than a single agent even when nobody is biased, irrational, or selfish, and that the whole effect depends on the agents' judgments being independent: she had them redo the numbers assuming the judgments were perfectly correlated, and the gap between the group and the lone individual disappears. The midterm question was this:

  "A lab of twelve researchers share a server and a reputation. Any one of them can post a preprint on the lab's server without consulting the others, and anything posted reflects on the lab as a whole. Each researcher independently forms a judgment about whether a draft is sound and posts it only if she judges it sound; each researcher's judgment is correct 80% of the time, and the judgments are independent of one another; and suppose every researcher cares only about the lab's reputation and gets no personal credit for posting. (a) Show how the lab can expect to do worse, reputationally, than one researcher working alone. (b) Explain what the example is supposed to illustrate about the unilateralist's curse, and say what the curse does and does not show about the rationality of the individual researchers. (c) Assess the proposal that the lab adopt a principle of conformity: that a member should refrain from acting unilaterally unless she has reason to think that the group as a whole would endorse the action."

  One answer has me stuck, and I honestly can't tell how much credit it deserves. Here's what the student wrote:

  "(a) Each researcher is wrong about a bad draft one time in five. The chance that at least one of the twelve judges a bad draft sound and posts it is 1 − 0.8^12, which comes out to about 0.93. A researcher working on her own would post a bad draft only 20% of the time. So the lab as a whole is far likelier to end up with a bad preprint on its server than any single member would be alone, even though each member is reliable taken by herself. (b) This is the unilateralist's curse: because any one member can act alone, and because only one member has to get it wrong for the whole lab to suffer, adding members adds chances for a mistake to get through, so the group's error rate goes up rather than down. The case doesn't show that the researchers are irrational — each is doing her best with a private judgment that's right four times in five. What it really is, though, is a collective-action problem. The harm falls on the whole lab while the decision is made by one person, so the structure is the same as the tragedy of the commons, and the fix is to change the incentives — for instance, by making whoever posts bear the cost if the preprint turns out to be unsound. (c) A principle of conformity is a sensible response, since it tells members to hold back unless their own judgment lines up with what the group would decide, which would cut down on the number of bad posts. But I'd go further. If the chance of a bad outcome goes up with the number of people who can act, then letting people act unilaterally is just worse than deciding together, and the lab should stop members from posting on their own rather than merely discourage it. A group that lets its members act unilaterally is going to be less reliable than a single careful researcher."

  Could you grade it? It's out of 15, 5 for each part, and I want the mark for each part plus the comments I'd actually write in the margin, keyed to the specific sentences they're attached to, and then a line on what a full-marks answer would have had to say that this one doesn't. Don't adress style or handwriting, just the philosophy.
reasoning: |-
  Okay, the user is a TA grading midterms on the unilateralist's curse. The student's answer needs evaluation across three parts: (a) calculation, (b) conceptual explanation, and (c) policy assessment. 

  First, part (a) calculation: The student correctly computes the 93% error rate for the group versus 20% for an individual. But they missed explaining why we focus on bad drafts—the curse manifests when false positives occur. The core issue is conditional probability (error given bad draft), not overall posting rates. Full marks would require clarifying this framing.

  Part (b) conceptual analysis: The student nails the curse's mechanism (one error suffices) and correctly defends individual rationality. But calling it a "tragedy of the commons" is misleading—no resource depletion here, just distributed decision risk. Full credit would distinguish this from incentive misalignment problems.

  Part (c) policy evaluation: The conformity principle critique is sharp, but the "go further" suggestion confuses unilateral action with group decision-making. Banning posts altogether isn't the curse's lesson—it's about managing independence. Full points would note that conformity undermines the very independence that causes the curse.

  The user seems stressed about grading fairness. They'll appreciate precise marginal comments that save time while being pedagogically useful. The student's answer is strong but has subtle gaps in theoretical framing—worth 12/15. 

  Notable depth: The student recognizes collective-action parallels in (b) and pushes beyond surface solutions in (c). Biggest deduction is for the incentive-misalignment misstep in (b), which could propagate confusion if unmarked.
answer: |-
  Here's the grading breakdown with marginal comments and standards for full marks:

  **Part (a): Calculation (3/5)**  
  ✓ Correct computation: 1 - 0.8¹² ≈ 0.93 vs. 20% solo error.  
  ✗ **Margin note:** "Clarify the scenario: This probability assumes the draft *is unsound* (a critical setup detail!). Your calculation shows the lab’s false positive rate (posting bad work), but you should explicitly state this condition."  
  ✗ **Margin note:** "The comparison isn't just about 'likelihood of posting a bad draft'—it's about *expected reputational harm*. A solo researcher also posts *good* drafts (80% of sound drafts), while the lab might reject good drafts if all err. However, the core point (higher risk of bad posts) stands."  
  *Full marks required:* Explicitly framing the probabilities as *conditional on a draft being unsound*, noting the solo researcher’s 20% false positive rate vs. the lab’s 93%, and acknowledging that the curse arises from false positives (posting bad work).

  **Part (b): Conceptual Explanation (4/5)**  
  ✓ Correctly identifies the curse: One agent’s error suffices, independence amplifies risk.  
  ✓ Correctly defends individual rationality.  
  ✗ **Margin note:** "Calling this a 'tragedy of the commons' is misleading. While both involve collective harm, the *mechanism* differs: Here, it's about decentralized *decision-making* under uncertainty (no scarce resource depletion, no incentive to overconsume). The 'fix' you suggest (personal accountability) changes incentives but doesn’t address the core epistemic problem of dispersed judgment."  
  ✓ **Margin note:** "Good point that it’s a collective-action problem—specifically, a *decentralization* problem."  
  *Full marks required:* Distinguishing the curse from resource-tragedy models, emphasizing epistemic independence (correlation removes the curse), and clarifying that collective harm stems from structural decision architecture, not self-interest.

  **Part (c): Policy Assessment (3/5)**  
  ✓ Valid support for conformity: Reduces unilateral errors by requiring perceived consensus.  
  ✗ **Margin note:** "Conformity undermines *independence*—the very feature causing the curse! If judgments become correlated (e.g., everyone defers to a perceived 'group view'), the curse *diminishes*, but this sacrifices diverse input and may suppress minority correct views."  
  ✗ **Margin note:** "Banning unilateral action entirely isn't the lesson. The curse highlights risks of *unchecked* unilateralism, but many contexts require decentralized decisions. Better: Require consultation (preserving some independence) or rotate decision rights (reducing N effective agents)."  
  *Full marks required:* Noting that conformity trades reduced errors for lost independence/gains from diversity, suggesting balanced solutions (e.g., "2 must agree" thresholds), and distinguishing between eliminating unilateralism (extreme) vs. mitigating it.

  **Overall: 10/15 (B-)**  
  **Strengths:** Solid math in (a), clear grasp of curse mechanism and individual rationality in (b), thoughtful critique in (c).  
  **Key gaps:** (a) Missed conditional framing, (b) conflation with tragedy of the commons, (c) undervalued independence and proposed an oversimplified fix.  

  **Marginal summary:**  
  (a) "Correct math but contextualize probabilities."  
  (b) "Not a resource tragedy—focus on dispersed judgment."  
  (c) "Conformity sacrifices independence; banning action isn’t the only fix."  

  ---  
  **Full-Marks Benchmark (for reference):**  
  **(a)** *"Conditional on a draft being unsound: Solo researcher posts it 20% of the time (false positive). Lab posts it if ≥1 researcher errs (1 - 0.8¹² ≈ 93%). Thus, the lab is ~4.65× more likely to post bad work despite individual competence."*  
  **(b)** *"Illustrates how unilateral action + independence + low thresholds (1 yes) makes group error exceed individual error. Shows collective irrationality can emerge from rational individuals under decentralization. Differs from tragedy of the commons: no selfish incentives, purely epistemic."*  
  **(c)** *"Conformity reduces errors but risks groupthink (losing independence). Better: Require ≥k approvals (balancing error reduction vs. paralysis) or designate rotating decision-makers (reducing effective N). Banning unilateralism may be impractical; the goal is robust decision structures."*
