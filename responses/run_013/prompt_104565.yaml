  We are given a set of cases C1 to C8 with the novelist's verdicts on each. We are to find a principle (or a small family) that captures the pattern of these verdicts. If no single principle can, we must identify which verdicts to give up.

  The novelist's tentative principle is:
  - An experience is real if it is had.
  - Content is veridical only if caused by its apparent object.
  - Moral weight attaches to the having and not to the veridicality.
  - Knowledge requires something beyond valid content.

  We are to test this principle against the cases and repair it if necessary, then apply it to two new cases.

  Let's break down the cases and the verdicts:

  C1: Boltzmann brain with an hour of coherent experience (e.g., walking a street). Verdict: The experience is real, and any pain matters morally as much as ours.

  C2: Same but with seeming memories. Verdict: The seeming-remembering is real but there is no object (so not veridical). Also, the brain is not deceived because there's no deceiver and no avoidable false belief.

  C3: Ordinary man with implanted memories (by a surgeon). Verdict: This is memory-like in a way that the Boltzmann brain's is not, even though both lack a causal connection to the past. The novelist finds C2 and C3 irreconcilable.

  C4: A one-second exact physical duplicate of me in deep space. Verdict: It is not me, I do not survive as it, and distress about it is an error.

  C5: A duplicate of my dying self that appears in the remote future vs. one that appears now. Verdict: The novelist cares less about the future one and suspects this is a failure of imagination.

  C6: Boltzmann brain reading a great novel. Verdict: The novel has no author and the experience no object, but the aesthetic value is as high as a real reading, maybe more (because nothing was lost). This sits badly with C2.

  C7: Boltzmann brain that entertains a valid proof and is convinced. Verdict: It does not know the theorem. But a mathematician who has a proof arrive in a flash (without working it out) does know. This is the second irreconcilable pair.

  C8: The argument that we are likely Boltzmann brains. Verdict: The argument does not move the novelist's credence, and he suspects the fault is his.

  We note that the novelist has two irreconcilable pairs: (C2, C3) and (C6, C7) [but note C6 is about aesthetic value and C7 about knowledge, so they are different]. However, the tension with C2 is also noted in C6.

  We are to build a principle that captures as many verdicts as possible.

  The tentative principle of the novelist:

  1. Reality of experience: if an experience is had, it is real.
  2. Veridicality: content is veridical only if caused by the apparent object.
  3. Moral weight: attaches to the having (the experience) and not to veridicality.
  4. Knowledge: requires something beyond valid content.

  Now, let's see how this tentative principle fares:

  C1: The experience is had, so real. The pain matters (moral weight to having). The content may not be veridical (if the street isn't there) but that doesn't affect moral weight. So it fits.

  C2: The seeming-remembering is an experience had, so real. But it's not veridical because there was no childhood (so no causal connection). The novelist also says the brain is not deceived. The principle doesn't directly address deception. We might interpret: since there's no object, it's non-veridical, but the novelist's view is that without a deceiver and without an avoidable false belief, it's not deception. The principle doesn't have a clause about deception, so we might need to add that non-veridicality without a deceiver and without the possibility of having a true belief (due to the nature of the brain's origin) does not constitute deception.

  C3: The ordinary man with implanted memories. The tentative principle would say: the memory experience is real (because had) but not veridical (because not caused by the apparent object). But the novelist says it is memory-like in a way that the Boltzmann brain's is not. The principle does not capture this difference because both are non-veridical. So the principle would treat them the same, but the novelist sees a difference. Therefore, the principle breaks on C3.

  C4: The duplicate is not me. The principle doesn't address personal identity. We need to add a clause about personal identity: survival requires a certain kind of continuity (perhaps causal and temporal) that a duplicate lacks.

  C5: The duplicate in the remote future vs. now. The novelist cares less about the future one. The principle doesn't address caring. We might need a principle about personal concern: we care more about near-term continuations because of our psychological makeup, but that doesn't reflect an objective asymmetry.

  C6: The experience of reading a novel by a Boltzmann brain. The experience is real (so by the principle, it's real). The content is non-veridical (no novel, no author). But the aesthetic value is as high as a real reading. The principle says moral weight (which we might extend to aesthetic value) attaches to the having, so it should be just as valuable. However, the novelist says "perhaps more, since nothing was lost". The principle doesn't account for the "nothing was lost" part. Also, the novelist notes it sits badly with C2: in C2, the memory is non-veridical and the novelist says it's not deception, but in C6 the aesthetic experience is non-veridical and yet valued. Why the difference? In C2, the memory is about a non-existent past, while in C6 the novel is non-existent. The novelist's principle doesn't explain why one is a problem (for knowledge or memory) and the other isn't (for aesthetics).

  C7: Boltzmann brain with a valid proof: does not know. Mathematician with a flash of insight: does know. The principle says knowledge requires something beyond valid content. What? In the mathematician's case, it might be that the proof was generated by a reliable cognitive process (even if in a flash). But the Boltzmann brain's proof just happened to fluctuate into existence. So we might require that the belief is produced by a reliable process that is appropriately connected to the truth. In the mathematician, the brain is a reliable cognitive system (even if the proof came in a flash). In the Boltzmann brain, the entire system is random.

  C8: The argument that we are likely Boltzmann brains does not move the novelist. This might be because the argument relies on the assumption that we are random observer-moments, but we have evidence that we are not (because we have a coherent history). Or perhaps the novelist implicitly relies on the principle that we are entitled to trust our apparent memories unless there is positive evidence of deception.

  We need to build a principle that can capture the verdicts. Let's try to formalize a principle that incorporates the novelist's tentative one and adds to it.

  Proposed principle (with additions):

  1. **Reality of experience**: Any conscious experience that occurs is real and has phenomenal character. There is something it is like to have it.

  2. **Veridicality**: The content of an experience is veridical if and only if it is caused in the appropriate way by the object or state of affairs that it represents. (Note: This is stronger than the novelist's "only if", but we might need "if and only if" for clarity.)

  3. **Moral and aesthetic value**: The moral weight of an experience (e.g., pain, pleasure) and the aesthetic value of an experience depend solely on the experience itself (the having) and not on its veridicality.

  4. **Memory**: A memory-like experience is a genuine memory only if it is caused by the past event it represents and is appropriately integrated into the subject's cognitive system. Without such a cause, it is a mere seeming-memory.

  5. **Knowledge**: A belief constitutes knowledge only if it is true, justified, and produced by a reliable cognitive process that is appropriately connected to the truth. (We add the reliable process requirement.)

  6. **Personal identity**: A person at time t2 is the same as a person at time t1 only if there is an appropriate continuity (e.g., psychological and/or physical) between the person at t1 and the person at t2. A duplicate, even if exact, does not carry forward the identity of the original unless it is created in a way that preserves continuity (e.g., by a gradual process).

