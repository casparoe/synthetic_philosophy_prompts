answer: |-
  ## Opening Address: Constituent Assembly for Our City  

  **Chair:** [Taps gavel once, stands, pauses to scan the room – meeting the eyes of electors, residents, and observers]  

  Good morning. We are gathered for a beginning unlike any other in our city’s life. We sit here as a constituent assembly. Our single task? To determine who belongs to the political community of this city. Who gets a vote? On what terms? And how might that change later?  

  But here is the difficulty we cannot escape: **We are trying to draw a circle around “us” while standing both inside and outside the line.**  

  The electors who chose us through referendum are seated here. Their vote gave us this task. But seated with them are neighbors – friends, coworkers, fellow parents, shopkeepers – who have lived beside us for years, decades even, building lives here, contributing here, calling this city home… yet they had no voice in calling this assembly. The circle drawn by the referendum excluded them.  

  So, whose voice matters *here*, *now*? Who does this assembly truly represent as it begins its work?  

  The law that convened us points to the existing electorate. Our shared conscience points to the city we *actually* inhabit – to everyone who breathes its air, walks its streets, and shapes its daily life. **Our authority in this room does not magically spring from one group or the other. It springs from holding both truths – the legal reality and the human reality – squarely in view, and refusing to look away.**  

  That is why we begin with rules designed to hold this tension, not dissolve it:  

  1.  **The Double-Register Rule:** When we vote on any motion that changes *who gets to vote*, it must pass two tests. It needs a majority from those currently enrolled as electors. And, counted *separately*, it needs a majority from every adult resident present in this room today – regardless of their current voting status. **If it fails either test, it fails entirely. And the record will show clearly *which* group dissented.** This is not about creating winners and losers. It’s about ensuring that a decision of this magnitude cannot be made *for* one group *by* another. Both voices – those with the existing franchise and those seeking recognition – must find common ground.  

  2.  **The Sunset Clause:** Whatever rules for membership we establish here will not be carved in stone forever. They will last for twelve years. Then, the electorate *we create* – whoever that includes – must vote to renew them. Otherwise, they expire. **This is not an evasion.** It is a profound act of humility. We acknowledge that we, gathered here today, cannot perfectly foresee the future city. We cannot bind generations unborn, or assume we have found the one eternal answer. We build a bridge, not a wall. We give the city we define today the power to redefine itself tomorrow.  

  Some may argue the solution is simple: “Throw open the doors! Let everyone who walks in and signs a roll vote!” It sounds beautifully inclusive. But pause. Consider: What does it cost to be here today? Time off work? Childcare? The confidence to walk into this room? The mobility to reach it? **Even an open door sets a boundary – drawn by circumstance, not malice, but a boundary nonetheless.** We cannot ignore that. This doesn't excuse our *current* boundary; it reminds us that *every* line we draw requires careful thought and carries consequences. We cannot draw no line. But we must draw the most just, inclusive, and thoughtful one possible.  

  **So, what authority do we have?**  
  Not the absolute authority of a fully settled “People.” Not yet. Our authority comes from the gravity of the question, the transparency of our process, and our commitment to face this foundational dilemma honestly. It comes from this shared space – this room – where the legal city and the lived city have come together. Our task is not to impose one vision, but to build, through debate, listening, and shared reason, a foundation for a legitimate “We.”  

  **To the electors who appointed us:** Your mandate brought us here. We honour that. But the mandate itself asks us to question its own boundaries. This is not a betrayal; it is the deepest fulfilment of its purpose – to seek a just foundation for our city’s voice.  

  **To the residents whose standing is the very question before us:** Your presence is vital. Your voices, your experiences, your stake in this city are the reason we grapple with this difficulty. You are not outsiders in this debate; you are at its heart. We see you.  

  **And to everyone:** This assembly is an experiment in shared dignity. It asks: Can we, knowing the imperfections of our starting point, build something better? Can we find a way to say “We, the people of this city” in a way that rings true for more of us?  

  Our work begins now. Let us proceed with honesty, courage, and a shared determination to build a foundation worthy of the city we all call home.  

  Thank you. We will now move to the agenda.  

  ---
  **Key Notes on Execution:**  
  *   **Tone:** Measured, gravely serious but not despairing. Acknowledge the weight without being crushed by it.  
  *   **Pacing:** Slow, deliberate. Pause after key phrases ("inside and outside the line," "both truths," "shared dignity").  
  *   **Eye Contact:** Deliberately include all sections of the room – electors, residents, observers.  
  *   **The Closing:** Positions the assembly as a shared endeavor ("experiment in shared dignity") focused on building ("build something better," "build a foundation"). It invites the excluded by centering their presence as vital and frames participation for electors as upholding, not surrendering, their mandate's deeper purpose.  
  *   **Avoids Theory:** The argument emerges from the concrete situation (the room, the rules, the people present) and the inherent logic of the task.  
  *   **Sunset Clause:** Framed as "humility" and building a "bridge," taking a clear position that it's principled, not an evasion.  
  *   **"Just Sign" Motion:** Preempted by focusing on the practical costs of participation as an inherent, unavoidable boundary, without dismissing the ideal.
