prompt: |-
  Draft the joint statement that a committed Mencian and a committed Xunzian could both put their names to after a good-faith adversarial collaboration on human nature. The document should contain: (a) a numbered list of claims both accept — about what is inborn, about the roles of spontaneous feeling, deliberate effort, and ritual, and about what moral education is for; (b) the disagreement itself, stated once at the level of the two positions, in wording each side would accept as fair to its own view; (c) the cruxes, that is, the sub-questions such that settling one would move at least one side; and (d) for each crux, a concrete case or consideration both would agree bears on it, with each side's prediction written down in advance.

  Two constraints. First, do not let the collaboration terminate in the comfortable verdict that the two merely used 性 (xing, "nature") in different senses; if that is part of the story, say so, but then isolate exactly which parts of the dispute survive once any merely verbal disagreement is set aside. Second, make each side face a case that cuts against it — for the Mencian, a person whose untutored impulses run reliably toward cruelty or disorder; for the Xunzian, a person who, without instruction and against self-interest, is moved to help a stranger. Say whether either case is even admissible as evidence for the view in question, and why.

  Close with a table of the residual disagreements, one row per crux, with columns: crux (short label); Mencian formulation (in wording a Xunzian would accept); Xunzian formulation (in wording a Mencian would accept); the test or consideration both accept; the Mencian's prediction; the Xunzian's prediction; and what would move which side, and in which direction.
reasoning: |-
  We are drafting a joint statement between a Mencian and a Xunzian. The Mencian view (Mengzi) holds that human nature is inherently good, while the Xunzian view (Xunzi) holds that human nature is inherently bad. We must avoid reducing the dispute to merely verbal disagreement about the term "xing" (nature). We are to include:

  (a) A numbered list of claims both accept.
  (b) The core disagreement stated fairly.
  (c) Cruxes (sub-questions that would move at least one side if settled).
  (d) For each crux, a concrete case or consideration both agree bears on it, with each side's prediction.

  We also have two constraints: 
  1. Not to terminate with the verdict that they use "xing" differently without isolating the residual dispute.
  2. To present a case that challenges each view: for the Mencian, a person with untutored cruel impulses; for the Xunzian, a person who helps a stranger without instruction and against self-interest.

  Finally, we close with a table of residual disagreements.

  Let's break it down:

  Part (a): Common Ground

  We can list points about:
  - What is inborn: Both agree that humans are born with certain capacities and tendencies, but they may differ on the moral valence of these.
  - Roles of spontaneous feeling, deliberate effort, and ritual: Both acknowledge the importance of spontaneous feelings (like compassion) and the necessity of deliberate effort and ritual in moral cultivation. However, they may assign different weights to these.
  - What moral education is for: Both see moral education as essential for achieving a well-ordered society and personal virtue.

  Part (b): The Disagreement

  We state the core disagreement in wording both would accept.

  Part (c) and (d): Cruxes and Cases

  We need to identify key sub-questions that get to the heart of the disagreement. For each crux, we provide a concrete case that both would agree is relevant. Then we write each side's prediction for that case.

  Cruxes might include:
  1. The inborn moral orientation: Are the spontaneous feelings (like compassion) evidence of inherent goodness, or are they merely raw materials that require reshaping?
  2. The origin of moral failure: Why do people go wrong? Is it because of environmental factors that obscure the inherent goodness (Mencian) or because the inherent tendencies, if unguided, lead to strife (Xunzian)?
  3. The role of effort and ritual: Are rituals primarily a way to express and cultivate the inherent sprouts of virtue (Mencian) or are they necessary to constrain and redirect the inherently disorderly nature (Xunzian)?

  Then, we present two cases:

  Case 1 (for the Mencian challenge): A person who, from a very young age and without apparent trauma, consistently shows cruel impulses (e.g., torturing animals, bullying others) without remorse. The Mencian must explain this without appealing to environmental factors that might have corrupted the inherent goodness.

  Case 2 (for the Xunzian challenge): A person who, without any instruction and in a situation where there is no obvious self-interest (e.g., risking life to save a stranger), does so. The Xunzian must explain why this occurs if human nature is inherently bad.

  We must also address whether each case is admissible and why.

  Finally, the table.

  Let's draft accordingly.
answer: |-
  ### Joint Statement on Human Nature: Mencian and Xunzian Perspectives  
  *After adversarial collaboration, we, a committed follower of Mengzi and a committed follower of Xunzi, jointly affirm the following framework for understanding human nature (性), moral cultivation, and our residual disagreements. We acknowledge that our views diverge fundamentally, yet we identify shared premises, clarify the core dispute, and isolate testable cruxes to advance inquiry.*  

  ---

  ### (a) Shared Claims: Common Ground  
  Both parties accept the following propositions:  
  1. **Inborn capacities**: Humans are born with innate *potential* for moral development—specifically, spontaneous affective responses (e.g., alarm at a child’s peril) and cognitive capacities for growth.  
  2. **Spontaneous feeling (情)**: Untutored emotional reactions (e.g., compassion or distress) are universal, biologically grounded, and provide the *raw material* for moral cultivation.  
  3. **Deliberate effort (為)**: Moral excellence requires conscious exertion (e.g., self-cultivation through study and practice), without which humans remain ethically underdeveloped.  
  4. **Ritual (禮)**: Ritual practices are indispensable tools for shaping behavior, harmonizing society, and regulating innate impulses.  
  5. **Purpose of moral education**: Education aims to transform individuals into virtuous agents who uphold social harmony, whether by nurturing latent tendencies (Mencian) or curbing destructive inclinations (Xunzian).  
  6. **Role of environment**: External conditions (e.g., family, society) significantly influence moral outcomes, potentially fostering or obstructing ethical development.  

  ---

  ### (b) Core Disagreement: Stated Neutrally  
  *The dispute centers on the inherent moral orientation of human nature:*  
  - **Mencian position**: Human nature is innately *good*; spontaneous feelings (e.g., compassion) are *incipient virtues* ("sprouts" 端) that, when cultivated, naturally mature into ren (仁, benevolence) and yi (義, righteousness). Moral failure arises from environmental distortions or neglect of these sprouts.  
  - **Xunzian position**: Human nature is innately *disordered*; spontaneous feelings (e.g., desire or aversion) are *amoral impulses* that, if unregulated, inevitably lead to strife and self-interest. Moral excellence requires artificial "straightening" by ritual and teachers to impose ethical order.  

  *We agree this is not merely verbal disagreement about "xing"*. While Mencians define xing as *teleological potential for goodness* and Xunzians as *untamed biological instincts*, the substantive dispute persists:  
  > **Residual question**: Are spontaneous affective responses (e.g., distress at suffering) *reliable seeds of virtue* (Mencian) or *neutral/potentially dangerous drives* (Xunzian) that demand external correction?  

  ---

  ### (c) Cruxes and (d) Test Cases  
  We identify three cruxes where empirical resolution could shift one or both positions. For each, we specify:  
  - **The crux** (sub-question both agree would be pivotal).  
  - **A concrete test case** both accept as evidentially relevant, with explicit criteria for admissibility.  
  - **Each side’s pre-registered prediction**.  

  #### Crux 1: **Moral Valence of Spontaneous Reactions**  
  *Crux*: Are untutored compassionate reactions (e.g., aiding a stranger) evidence of *inherent moral potential* or *exceptional/contextual outliers*?  
  *Test case*: **Spontaneous altruism under risk**.  
  - *Scenario*: An isolated child (age 5), raised without moral instruction and in a scarcity-driven environment, risks physical harm to save an unrelated drowning stranger despite no foreseeable reward or social praise.  
  - *Admissibility*: Both sides accept this as evidence because it isolates "untutored impulse" (per Mencian criteria) and "absence of self-interest" (per Xunzian criteria).  
  - *Mencian prediction*: Such cases will arise cross-culturally; spontaneous compassion reflects innate sprouts.  
  - *Xunzian prediction*: This is vanishingly rare; if it occurs, it stems from miscalculation of self-interest or anomalous temperament, not inherent goodness.  
  *Resolution impact*: Frequent cross-cultural replication would challenge Xunzians; consistent absence would challenge Mencians.  

  #### Crux 2: **Origin of Chronic Immorality**  
  *Crux*: Does persistent cruelty/organized violence reflect *corrupted goodness* (Mencian) or *uncorrected nature* (Xunzian)?  
  *Test case*: **Early-emerging cruelty without trauma**.  
  - *Scenario*: A child (age 4–6) exhibits consistent, remorseless cruelty (e.g., torturing animals, harming peers) despite stable nurturing, material security, and no exposure to violence.  
  - *Admissibility*: Both accept this if environmental factors (abuse, deprivation) are ruled out. Mencians admit it challenges them; Xunzians admit it as typical of untamed xing.  
  - *Mencian prediction*: Such cases are either non-existent or attributable to hidden environmental/biological pathologies (e.g., neurodivergence).  
  - *Xunzian prediction*: This is predictable and common without early intervention; it confirms humanity’s innate disorderly tendencies.  
  *Resolution impact*: Prevalence without pathology would challenge Mencians; consistent links to trauma would challenge Xunzians.  

  #### Crux 3: **Ritual as Cultivation vs. Constraint**  
  *Crux*: Does ritual primarily *express/nurture* innate virtues (Mencian) or *suppress/redirect* innate vices (Xunzian)?  
  *Test case*: **Ritual’s effect on untutored reactions**.  
  - *Scenario*: Compare two groups: (1) Those taught ritual propriety (禮) *after* exhibiting spontaneous compassion; (2) Those taught ritual *without* prior compassion. Measure long-term moral behavior (e.g., honesty, empathy).  
  - *Admissibility*: Both accept ritual’s efficacy but dispute its mechanism.  
  - *Mencian prediction*: Group (1) will show stronger/virtue-consistent outcomes; ritual "grows" innate sprouts.  
  - *Xunzian prediction*: Group (2) will show greater improvement; ritual corrects inherent deficits.  
  *Resolution impact*: Superior outcomes for Group (1) would challenge Xunzians; superior outcomes for Group (2) would challenge Mencians.  

  ---

  ### Constraint Responses  
  - **Case against Mencian (chronic cruelty)**: Admissible as evidence *against* Mencians if environmental factors are excluded. Mencians must either explain it as pathology (which concedes environmental primacy) or revise their view.  
  - **Case against Xunzian (spontaneous altruism)**: Admissible as evidence *against* Xunzians if self-interest is rigorously excluded. Xunzians must either dismiss it as miscalculation (weakening their universality claim) or acknowledge innate prosociality.  

  ---

  ### Table of Residual Disagreements  
  | Crux (Short Label) | Mencian Formulation (Xunzian-accepted) | Xunzian Formulation (Mencian-accepted) | Test/Case | Mencian Prediction | Xunzian Prediction | Resolution Impact |  
  |-------------------|----------------------------------------|----------------------------------------|----------|-------------------|-------------------|-------------------|  
  | Spontaneous Altruism | "Untutored compassion reveals incipient virtue." | "Untutored helping is anomalous or self-interested." | Child saves stranger untaught/at risk. | Common; reflects nature. | Rare; reflects error. | Replication moves Xunzian toward Mencius; absence moves Mencian toward Xunzi. |  
  | Origin of Cruelty | "Chronic cruelty arises from obscured sprouts." | "Chronic cruelty is uncorrected nature." | Nurtured child’s remorseless cruelty. | Non-existent or pathological. | Common and natural. | Prevalence moves Mencian toward Xunzi; pathology-link moves Xunzian toward Mencius. |  
  | Ritual’s Function | "Ritual cultivates innate moral tendencies." | "Ritual constrains innate immoral tendencies." | Ritual taught with/without prior compassion. | Best outcomes with prior compassion. | Best outcomes without prior compassion. | Better Group (1) moves Xunzian; better Group (2) moves Mencian. |  

  ---  
  *This document represents our good-faith effort to clarify disagreements and advance mutual understanding. We commit to revising our views based on evidence from these test cases.*  
  **Signed**,  
  *A Follower of Mengzi*  
  *A Follower of Xunzi*
