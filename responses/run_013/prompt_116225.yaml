prompt: |-
  I'm putting together a criminology-and-philosophy seminar and I keep tripping over the same thing. The law insists it punishes acts, not people — you can't argue 'he's the sort of man who'd do that', you have to prove what he actually did. But then sentencing and parole are nothing but character assessment: the pre-sentence report is a portrait of the person, the judge weighs remorse and good character, the parole board asks whether he's changed and whether he's still a risk. All of which seems to assume that people have traits that are stable, that carry across situations, and that predict what they'll do next. Which is more or less what the situationist stuff denies — the experiments where being in a hurry, or finding a coin in the phone box, does more work than any disposition. So what theory of character, or of persons, does the sentencing-and-parole practice actually presuppose? Is it stuck with global traits, or could it get by with something weaker, like traits that are real but local (careless with the tax office, scrupulous with his mates), or dispositions that are only stable relative to a situation? Is the 'we punish acts, not persons' line genuinely in tension with it, or do the two fit together? And if we took the situationist point seriously, what would concretely have to change in how judges sentence and boards release people — or is the practice fine as it is, because predicting behaviour only ever needed base rates rather than character? Dont sit on the fence at the end, I want a verdict. British English please.
reasoning: |-
  Okay, let's tackle this criminology and philosophy puzzle. The user is running a seminar and hitting a conceptual wall between legal principles and psychological realities. They're pointing out a fascinating contradiction: the law claims to punish acts, not people, yet sentencing and parole decisions rely heavily on character assessments. 

  Hmm, the core tension is between situationist psychology (which says behavior is context-dependent) and the legal system's need to predict future behavior based on stable traits. The user wants to know what theory of character the justice system actually operates on, and whether it could function with a weaker model. 

  First, let's unpack the legal side. The "punish acts not persons" principle comes from liberal legal theory - it's about fairness and preventing prejudice. But in practice, sentencing guidelines everywhere (UK included) explicitly consider "offender culpability" and "risk of reoffending." Pre-sentence reports dig into personal history, mental state, even whether the offender seems remorseful. Parole boards literally assess if someone has "changed." 

  Now the psychology side: situationism (think Zimbardo's prison experiment or Milgram) shows how circumstances override dispositions. But the user's phrasing suggests they might be overstating the case - modern personality psychology actually accepts both traits and states matter. The Big Five traits have predictive power, just not absolute. 

  What's the justice system really assuming? It's definitely using a global trait model, whether it admits it or not. When a judge reduces a sentence for "good character," they're implying that character is consistent across domains. But is this necessary? 

  Alternative approaches could include:
  - Local traits (e.g., "violent when drunk but otherwise peaceful")
  - Trigger-based risk assessment (identifying specific high-risk situations)
  - Behavioral evidence over character testimony

  Concrete changes if we took situationism seriously:
  - Sentencing might focus more on controlling environments than "reforming character"
  - Parole could use situational risk management plans instead of asking "has he changed?"
  - Risk assessment tools might emphasize contextual factors over personality scores

  But here's the verdict: The tension is real. The "acts not persons" principle is fundamentally at odds with character-based sentencing. However, the system isn't doomed - it could evolve toward a nuanced model recognizing both stable patterns and situational triggers. The real problem is pretending we're not making character judgments when we are. 

  The user wants no fence-sitting, so: Yes, the tension exists. The system currently relies on outdated global trait assumptions. But with better psychology, it could develop more honest, effective practices that acknowledge both dispositions and contexts. Base rates help, but ignoring personality altogether would be throwing the baby out with the bathwater.
answer: |-
  You've nailed a profound contradiction at the heart of criminal justice practice. Let's dissect it directly, using British terminology.

  **1. The Tension is Real and Deep:**
  The "punish acts, not persons" maxim stems from liberal legal principles: fairness, proportionality, avoiding prejudice, and the presumption of innocence. It focuses on the *actus reus* and *mens rea* of a specific event. **However, sentencing and parole are inherently and unavoidably about assessing the *person*.** The Sentencing Council's guidelines explicitly require judges to consider "offender culpability" and the "dangerousness" of violent/sexual offenders, alongside harm caused. Pre-sentence reports (PSRs) detail background, attitudes, and (crucially) "risk of reoffending". Judges weigh "good character" and "demonstration of remorse". Parole Board panels assess "risk to the public" based on the prisoner's current mindset, behaviour in custody, and plans for release. **This practice absolutely presupposes a theory of character involving relatively stable, predictive traits.** It assumes:
      *   **Stability:** That past behaviour and expressed attitudes (remorse, insight) indicate a reasonably stable underlying state.
      *   **Predictivity:** That this assessed state (e.g., "high risk", "demonstrates genuine change", "lacks insight") reliably predicts *future* behaviour in relevant situations.
      *   **Globality (to an extent):** While PSRs might note context (e.g., "aggressive when intoxicated"), the overall assessment ("low/medium/high risk") and concepts like "good character" or "dangerous offender" lean towards global judgments. The Parole Board asks "is *he* safe?", implying a property of the person.

  **2. The Situationist Challenge is Powerful:**
  Situationist psychology (Milgram, Zimbardo, Darley & Batson's Good Samaritan study) shows behaviour is massively influenced by immediate context, pressures, and chance factors – often overriding presumed dispositions. A normally "honest" person might cheat under pressure; a "kind" person might ignore someone in distress if hurried. This directly challenges the assumptions of stability and predictivity underpinning sentencing/parole assessments. If behaviour is so context-dependent:
      *   Can we reliably judge "character" from past acts *in very different contexts* (e.g., crime scene vs. prison interview)?
      *   Is "remorse" in a sentencing hearing a stable trait or a situational performance?
      *   Does good behaviour *in the highly structured, supervised prison environment* predict behaviour in the complex, stressful, unsupervised community?

  **3. What Theory of Character *Does* the Practice Presuppose?**
  The system is **stuck with a largely implicit, often crude, and inconsistently applied version of global traits.** It leans towards:
      *   **Essentialism:** Treating "risk" or "character" as an inherent, relatively fixed property of the person.
      *   **Inference from Limited Samples:** Judging a person's whole character based on specific acts (the crime, behaviour in custody, performance in interviews) and projecting it onto future, vastly different situations.
      *   **Overlooking Situational Triggers:** While PSRs might note substance misuse or peer groups, the *primary* focus remains on the *offender's* traits (impulsivity, empathy deficit, attitudes) rather than deeply analysing the *situational pathways* that led to the offence and might lead to reoffence.

  **4. Could it Use a Weaker, More Situated Theory? Yes, and It Should.**
  The practice *could* and *must* evolve beyond simplistic global traits. A more psychologically plausible model would incorporate:
      *   **Local Traits/Specific Risk Factors:** Identifying *specific* problematic patterns ("violence in domestic partnerships when intoxicated", "fraudulent behaviour under financial pressure") rather than global "bad character" or "high risk". This is already happening to some extent with structured risk assessments (e.g., OASys in England/Wales), but needs to go further.
      *   **Situational Stability & Trigger Identification:** Focusing on whether *specific* dispositions are stable *relative to identifiable triggering situations or states*. Instead of asking "Has he changed?", ask "Has he developed the skills and supports to manage the *specific situations* (e.g., conflict, substance craving, financial desperation) that previously led to offending?".
      *   **Interactionism:** Explicitly recognising that behaviour is an interaction between the person *and* the situation. Sentencing/parole should focus on managing *both* – altering the person's *capacities and supports* AND managing their *environment and exposure to triggers* upon release.

  **5. Concrete Changes Needed (The Verdict):**
  Taking situationism seriously necessitates significant shifts. The current practice is **not** "fine as is." Base rates are useful (e.g., general recidivism stats for certain offences), but individual decisions *demand* going beyond them, and currently do so based on flawed character assumptions. Here's what must change:

  *   **Sentencing:**
      *   **Shift Focus:** Move from "How bad is this person?" to "What specific factors (person-based *and* situation-based) led to this act, and how can we manage them?". Reduce reliance on vague "good character" mitigations – focus on concrete evidence of situational management skills or lack thereof relevant to the crime.
      *   **PSRs:** Mandate deeper analysis of *offence pathways* – the specific sequence of thoughts, feelings, situations, and triggers leading to the crime. Frame risk factors as interactions (e.g., "vulnerability to peer pressure *in unsupervised social settings*").
      *   **Sentencing Options:** Prioritise sentences that directly target situational management (e.g., robust treatment programmes focusing on recognising and coping with triggers, strict prohibitions on entering *specific* high-risk environments) over purely punitive or vague rehabilitative aims.

  *   **Parole:**
      *   **Reframe the Question:** Move from "Is he safe?" (a global trait question) to "Under what conditions is he likely to be safe, and what conditions pose a high risk?". Focus on evidence of managing *specific* simulated or real-world challenges relevant to their offence pathway.
      *   **Risk Management Plans:** Make parole decisions contingent on *detailed, situationally specific risk management plans*. Release should depend on credible plans addressing housing, employment, support networks, substance management, *and* avoidance of known triggers/high-risk situations, with clear supervision protocols.
      *   **Behavioural Evidence over Self-Report:** Prioritise evidence of *demonstrated skill* in managing relevant situations (e.g., through temporary release performance, therapy role-plays, handling conflicts appropriately in prison) over self-reported "change" or "insight" expressed in the controlled parole hearing environment.
      *   **Honesty about Prediction:** Acknowledge the inherent limitations of predicting future behaviour in complex, uncontrolled environments. Frame parole not as a declaration of "safety" but as a managed risk reduction strategy based on the best available evidence of *situational competence*.

  **The Verdict (No Fence-Sitting):**

  The "punish acts, not persons" principle **is in genuine, unavoidable tension** with the character assessment inherent in sentencing and parole. The current system **is stuck with an outdated, often implicit, and psychologically dubious theory of global traits**, making it prone to unfairness and poor prediction. Base rates alone are insufficient for individualised decisions. **The practice must fundamentally change.**

  **We must abandon the pretence of judging stable global character.** Instead, sentencing and parole should adopt an **explicitly interactionist model**, focusing on identifying *specific, locally stable risk factors* and *situational triggers* unique to the individual's offence pathway. Decisions should be based on evidence of *situational management skills* and hinge on *robust, situationally aware risk management plans*, not vague assessments of whether the "person" has changed. This shift is essential for greater fairness, accuracy, and effectiveness in protecting the public.
