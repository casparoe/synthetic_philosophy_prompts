  Next, the practical impact. The Act's direct effects on lobsters might be minimal—maybe just requiring welfare considerations in policy reports. For insects, nothing changes. So the counterfactual difference per lobster is small, and for insects, zero. The scale argument's expected value might not apply here because the decision doesn't scale with numbers. The user suspects the stakes are near zero, which challenges whether expected value calculations are relevant.

