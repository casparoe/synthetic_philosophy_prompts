  First, the user is concerned about the exclusion of insects from the Act despite their vast numbers. The scale argument suggests that even a tiny probability of sentience multiplied by trillions of insects could outweigh the welfare concerns for animals like crabs. They question whether the Act's practical impact on lobsters vs. insects is significant, implying it might be negligible. They also worry about fanaticism—how to avoid extreme conclusions when dealing with near-infinite numbers and non-zero probabilities.

