prompt: |-
  So I'm taking a phil of language seminar on conditionals and our final assignment is to write an adversarial-collaboration statement for two camps that have been going in circles: the truth-conditional/possible-worlds side (variably strict semantics, plus some Jackson-style assertability story to explain why indicatives look non-truth-functional) and the no-truth-conditions-for-indicatives side (acceptance of an indicative just is the conditional probability, per Adams and Edgington). I want the document they could both sign, not a verdict on who's right.

  Structure: numbered agreed claims first, including what exactly Lewis's triviality proofs do and dont show, because I'm fairly sure half the fight is that one side reads them as killing truth-conditional indicatives outright while the other reads them as killing one particular version of the "probability of the conditional equals the conditional probability" thesis. Then a disagreements table where each row is worded so the side it belongs to would accept the wording of its own view. Then the cruxes — I want the independence condition and the betting-style argument in there — and for each crux a case both sides agree bears on it, plus each side's prediction written down in advance so it can't be fudged afterwards.

  Two cases I want in the doc, and they should be runnable on people rather than just introspective. First, a continuum case: an indicative about the past where the speaker's evidence is nearly complete (something like "if Oswald didn't shoot him, someone else did" said by someone with near-total evidence about it), so the question is whether the gap between that and its counterfactual twin is just a difference in the modal base or a difference in kind — and each side should predict how the intutions shift as the evidence goes from partial to complete. Second, a case where the conditional probability is high but the antecedent looks irrelevant to the consequent (the "true, but so what" kind), where I expect the two accounts to come apart on acceptance; I want both sides' predictions, and if one side has to concede something here, say so. Also tell me which parts of the disagreement are verbal — I suspect "has truth conditions" is doing two seperate jobs (expresses a proposition vs. determinately true or false) and that each side needs a different one. Skip references, I just want the content.
reasoning: |-
  Okay, let me approach this systematically. The user wants an adversarial-collaboration framework for two opposing views in philosophy of language regarding conditionals. 

  First, I need to identify the core of each position. The truth-conditional camp (Lewis/Stalnaker) sees conditionals as propositions evaluated across possible worlds, while the probabilistic camp (Adams/Edgington) treats them as non-propositional devices for expressing conditional probabilities. 

  The triviality proofs are clearly a major sticking point. I recall Lewis showed that assigning truth values to conditionals while maintaining P(if A then B) = P(B|A) leads to triviality under certain assumptions. But this needs careful framing: both sides should agree it only disproves that specific combination, not truth-conditions generally. 

  For the structure, agreed claims should establish common ground first. Key points would include: both camps accept conditional probability as central to assertion; triviality proofs target specific formal implementations; and indicative/counterfactual distinction exists regardless of theory. 

  The disagreements table must neutrally present each view's core tenets. For truth-conditionalists, I'll emphasize their "proposition expressed under epistemic state" stance and the Jackson-style pragmatic layer. For probabilistic theorists, I'll highlight their "no proposition expressed" position and assertion-as-probability view. 

  Now for the experimental cases. The first is a continuum case moving from partial to complete evidence. Truth-conditionalists should predict a smooth transition from indicative to counterfactual usage as evidence increases, while probabilistic theorists should see a categorical shift when evidence becomes complete. 

  The second case involves high conditional probability with perceived irrelevance. Truth-conditionalists will likely say we can assert such conditionals (since probability is high) while withholding belief in the proposition, whereas probabilistic theorists must accept the assertion but may concede it feels odd. 

  Crucially, I need to identify verbal disputes. The phrase "has truth conditions" is ambiguous - it could mean either "expresses a proposition" (denied by probabilistic view) or "is determinately true/false" (which truth-conditionalists might accept varies case by case). This distinction could resolve apparent contradictions. 

  For cruxes, the independence condition (whether P(B|A) can stay high while P(A) changes) and betting behavior (whether we bet on conditionals like we bet on propositions) will be telling. Each side's predictions should be documented upfront to prevent later fudging.

  The tone throughout must remain strictly neutral, presenting both views in their strongest light without judgment. The goal is creating a framework for productive debate, not declaring a winner.
answer: |-
  Here’s the adversarial-collaboration statement, structured as requested. Both sides agree to this document as a framework for clarifying disagreements and designing empirical tests.

  ---

  ### Adversarial Collaboration Statement: Indicative Conditionals  
  **Parties:** Truth-Conditional Semantics (TC) vs. Probabilistic Assertability (PA)  

  ---

  ### I. Agreed Claims  
  1. **Probability & Assertability**:  
     The assertability of an indicative conditional *If A, then C* is governed by the conditional probability *P(C|A)* (Adams' Thesis). High *P(C|A)* is necessary and sufficient for warranted assertion.  

  2. **Triviality Results (Lewis)**:  
     - Lewis’s proofs show that *no proposition* (i.e., no set of possible worlds) can satisfy **both** of the following simultaneously:  
       (i) It is the content of *If A, then C*;  
       (ii) Its probability *always* equals *P(C|A)* across all rational credence distributions.  
     - This **does not** prove that indicative conditionals *lack truth conditions* simpliciter. It only proves that *if* they express propositions, those propositions cannot *generally* satisfy *P(If A, C) = P(C|A)*.  
     - The proofs **do not** address whether conditionals *in context* can sometimes satisfy *P(If A, C) = P(C|A)*, nor whether *P(C|A)* explains assertability without truth conditions.  

  3. **Indicative vs. Counterfactual Distinction**:  
     There is a clear difference in usage between indicative conditionals (e.g., "If Oswald didn’t shoot Kennedy, someone else did") and their counterfactual counterparts (e.g., "If Oswald hadn’t shot Kennedy, someone else would have"). This distinction must be explained by any theory.  

  4. **Contextual Sensitivity**:  
     The interpretation of *If A, then C* depends on the speaker’s epistemic state and salient evidence.  

  ---

  ### II. Disagreements Table  
  | Issue | Truth-Conditional (TC) View | Probabilistic Assertability (PA) View |
  |-------|-----------------------------|--------------------------------------|
  | **Nature of Conditionals** | Indicatives express propositions, true/false relative to a world and a contextually determined modal base (e.g., variably strict semantics). Assertability is explained by high conditional probability *plus* pragmatic constraints (e.g., Jackson’s robustness). | Indicatives lack truth conditions entirely. Asserting *If A, C* is the act of expressing high *P(C|A)*. The conditional has no propositional content to evaluate. |
  | **Probability = Truth?** | *P(If A, C) = P(C|A)* often holds *approximately* in context, but fails in generality due to triviality. Pragmatic factors explain why it *appears* truth-functional. | *P(If A, C) = P(C|A)* is a fundamental constraint on rational credence for *all* indicative conditionals. Triviality shows that this equality *requires* abandoning truth conditions. |
  | **Complete Evidence** | As evidence approaches totality, the indicative conditional converges semantically to a counterfactual, differing only in the modal base (e.g., factual vs. counterfactual supposition). | Indicatives and counterfactuals are distinct speech acts. With complete evidence, indicatives become redundant or undefined since *P(C|A)* requires uncertainty about *A*. |

  ---

  ### III. Cruxes & Predictions  
  #### Crux 1: **The Continuum Case**  
  - **Case**: "If Oswald didn’t shoot Kennedy (*A*), then someone else did (*C*)."  
    Speaker’s evidence ranges from partial (e.g., 1963 detective) to near-total (e.g., modern historian with 99.9% evidence).  
  - **TC Prediction**:  
    - *Partial evidence*: Clear intuition that the indicative is assertable iff *P(C|A)* is high.  
    - *Near-total evidence*: Intuition smoothly shifts toward the counterfactual ("If Oswald hadn’t shot him..."). The indicative remains truth-evaluable but may feel less natural.  
  - **PA Prediction**:  
    - *Partial evidence*: Indicative is assertable based on *P(C|A)*.  
    - *Near-total evidence*: *P(A) ≈ 0* or *1*, so *P(C|A)* is undefined or unstable. Assertability of the indicative diminishes; only counterfactuals are appropriate.  
  - **Empirical Test**:  
    Survey intuitions on assertability and truth-evaluability across evidence levels. Measure if assertability drops sharply (PA) or gradually (TC) near total evidence.  

  #### Crux 2: **Irrelevant Antecedents**  
  - **Case**: "If this match is dry (*A*), then Napoleon lost Waterloo (*C*)."  
    *P(C|A) = P(C) = 1* (since *C* is historical fact), but *A* is irrelevant to *C*.  
  - **TC Prediction**:  
    The conditional expresses a truth (since *C* is true in all worlds where *A* is true). Assertability is *not* warranted—pragmatic factors (e.g., relevance) block assertion.  
  - **PA Prediction**:  
    Assertability is warranted because *P(C|A) = 1*. However, PA concedes this violates typical conversational norms (relevance, informativeness).  
  - **Empirical Test**:  
    Run vignette studies asking if the conditional is "acceptable" or "should be asserted." PA predicts acceptance if *P(C|A)* is high; TC predicts rejection despite truth.  

  ---

  ### IV. Verbal Disputes & Clarifications  
  1. **"Truth Conditions" Ambiguity**:  
     - TC uses "has truth conditions" to mean *expresses a proposition* (content with truth value in worlds).  
     - PA uses "has truth conditions" to mean *is determinately true/false independent of epistemic state*.  
     **Resolution**: Parties agree to distinguish:  
     - *Propositional Content* (TC: yes, PA: no)  
     - *Determinate Truth Value* (TC: sometimes, PA: never).  

  2. **"Probability of the Conditional"**:  
     - TC: *P(If A, C)* is the probability of a proposition.  
     - PA: *P(If A, C)* is undefined; only *P(C|A)* matters.  
     **Resolution**: Both agree *P(C|A)* is the key assertability criterion.  

  ---

  ### Signatures  
  _________________________________________  
  *Truth-Conditional Semantics Advocate*  
  _________________________________________  
  *Probabilistic Assertability Advocate*  

  ---  
  This document is neutral on which view is correct. It commits both sides to specific predictions for future empirical work.
