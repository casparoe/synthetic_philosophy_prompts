          - Announce: "We are going to change the rules. For the remaining 6 rounds, we will allow only a subset of rules. We are going to vote on which rules to allow. We are not considering the performance of the rules so far. We are considering only the rule definitions. We want rules that are straightforward and not tricky. Here are the rules we had:"
          - Write the rules (A to E) on the board without revealing who chose what.
          - "Each of you has two votes. You can vote for any two rules (by rule letter). We will then license the top three rules."
          - Give them 5 minutes to think and then 5 minutes to discuss (if they want) and then vote. (Vote by show of hands? or by ballot.) Tally the votes and announce the licensed rules.

          Expected: A, B, C will be licensed? But B is "always blue", which has been wrong every time? But we said we are not considering performance. We hope they vote based on simplicity. But they might not. If they vote based on performance, they will vote for A and C (which have been doing well) and not for B, D, E.

          But we want to avoid that. So we must emphasize: "Remember, we are not considering how well the rule has done. We are considering the rule definition only. We are asking: is this rule a good, reliable kind of rule? Or is it arbitrary and tricky?"

          Then they might vote for A and C and maybe D? We hope they see D and E as tricky.

          If they license D or E, then we have to go with that. But then in the debrief, we can still make the point: "Some of you might have felt that Rule D was tricky, but we licensed it. Why did we license it? Because we thought it was reliable? Or because we thought it was simple? But note: it is defined with a time split, which might be arbitrary."

          Alternatively, we can avoid having Rule B? Because it is symmetric to A and might be licensed? But we want to have a natural rule that is bad? That might be confusing.

          We can change the rules to:

            Rule A: Always red.
            Rule B: Always blue.   [natural but bad in this deck]
            Rule C: Majority so far (with tie red).
            Rule D: Red before 15, blue after.
            Rule E: Blue before 15, red after.

          And then we hope they license A and C and reject B, D, E? But why reject B? It's simple. They might not reject it.

          Alternatively, we can have only:

            Rule A: Always red.
            Rule C: Majority so far.
            Rule D: Red before 15, blue after.
            Rule E: Blue before 15, red after.

          And then we can have Rule F: Always blue? But we don't have to. We can have 4 rules.

          Let's have:

            Rule 1: Always red.
            Rule 2: Always blue.
            Rule 3: Majority so far (tie: red).
            Rule 4: Red if round<15, blue otherwise.
            Rule 5: Blue if round<15, red otherwise.

          Then we vote for top 3. We hope Rule 1, 2, 3 are licensed? But Rule 2 is natural and bad? They might not license Rule 4 and 5.

          But if they license Rule 2, then a student can switch to Rule 2 and predict blue for the last 6 rounds? which are red -> they get 0. That's fine.

          We can also note in the debrief: "We licensed Rule 2 (always blue) even though it had been failing? because we were not considering performance. But then it continued to fail. But the point is: we licensed it because it is a simple rule."

      50-65 min: Rounds 15-20 (15 min)
          - Each student must choose one of the licensed rules (they can switch from their original rule to any licensed rule). They write down their choice (privately) and then for each round, they predict using that rule.
          - Play rounds 15 to 20: each round as before. The deck is all reds.

      65-90 min: Debrief (25 min)

          Script for debrief:

            Step 1: Reveal the puzzle.
              "This activity was designed to illustrate a famous puzzle in the philosophy of science called the grue puzzle, introduced by Nelson Goodman in the 1950s."

            Step 2: Explain grue.
              "Goodman considered two hypotheses about emeralds. The first is that all emeralds are green. The second is that all emeralds are grue, where 'grue' means: green if examined before some future time T, and blue if examined after T. Now, if we have only ever seen emeralds before T and they have all been green, then the evidence supports both hypotheses equally. But they make different predictions about emeralds after T: one says they will be green, the other says blue."

            Step 3: Connect.
              "In our game, we had two kinds of rules: rules that always predict the same color (like Rule 1 and Rule 2) and rules that change based on the round number (like Rule 4 and Rule 5). And we saw that up to round 14, the evidence (14 reds) was consistent with Rule 1 (always red) and Rule 4 (which predicted red for rounds 1-14) and also with Rule 5? Actually, Rule 5 predicted blue for rounds 1-14, which was wrong. So Rule 5 was not consistent. But Rule 4 was consistent: it predicted red every time until round 14, and it was correct. So Rule 1 and Rule 4 were equally supported by the evidence we had by round 14."

            Step 4: The licensing vote.
              "Then we had a vote on which rules to license. We based the vote only on the rule definitions. Which rules did we license? (Wait for answer.) And why did we reject the others? (Wait for answer.) What was it about Rule 4 and Rule 5 that made us reject them? (They might say: they are arbitrary, they depend on a specific round number, they are too complicated, they feel like tricks.)"

            Step 5: The key point.
              "Notice that the world (the deck of cards) didn't tell us that Rule 4 and Rule 5 are arbitrary. The deck just gives us the cards. We, as a group, found those rules arbitrary. And that feeling of arbitrariness comes from our prior practices: we are used to rules that don't have arbitrary time splits. We are entrenched in a certain way of projecting patterns. So the asymmetry between Rule 1 and Rule 4 is not in the world, but in us."

            Step 6: Hold the question.
              "Now, does this mean that we are justified in preferring Rule 1 over Rule 4? Or is it just a habit? That is the puzzle. We won't solve it today. The point is to see that our practice of prediction relies on entrenched predicates, and that the grue puzzle shows that without such entrenchment, we would be lost in a sea of equally supported but conflicting predictions."

            Step 7: Address the fixed deck (optional, if they ask or if you feel it's necessary):
              "I fixed the deck to be all reds to make the point clear. In the real world, we don't know the deck. But the same problem arises: the evidence we have might be equally well explained by two rules that will diverge in the future. And we have to choose which rule to use for prediction. And that choice is guided by our entrenched practices."

          Predictable problems during debrief:

            Problem 1: "Grue is defined in terms of green, so it's not a real predicate."
              Response: "Goodman's point is that we could have been brought up in a community that uses 'grue' as a basic predicate. Then 'green' would be defined as 'grue before T and bleen after T', where bleen is blue before T and green after. So it's symmetric. The feeling that grue is artificial comes from our own entrenchment in the green/blue vocabulary."

            Problem 2: "The vote was just about which rule we thought would work better, not about entrenchment."
              Response: "But how did you decide which rule would work better? Without knowing the future, you had to go by the rule's definition. And you found the rules with time splits to be less likely to work in the long run. Why? Because in your past experience, rules that are defined without such arbitrary disjunctions have worked better? But note: we are not given any data about the long run. We are going by the rule's form. And that form is evaluated by our entrenched standards."

    What the activity cannot reproduce:

      - The activity focuses on the social dimension of rule licensing. But the grue puzzle can be felt by an individual who has no community to vote with. However, the individual's standards are also shaped by their linguistic community. We can note in the debrief: "Even an individual faces the grue puzzle, but the individual's standards are inherited from a community."

    Final note: The activity does not require reading and no laptops. It uses physical materials (cards, slips, leaderboard).

    We hope this works.
answer: |-
  Below is a complete, activity-based session plan for your 90-minute seminar. It implements your pedagogical vision by having students commit to rules *before* they recognize the neutrality of evidence, then stages the entrenchment realization via a licensing vote. The debrief ties the experience directly to the grue puzzle while leaving the philosophical question open.

  ---

  ### **Materials**  
  - **Deck of 40 cards**: 20 red, 20 blue (use index cards with clear "RED" or "BLUE" labels to avoid ambiguity).  
  - **Prediction slips**: Small paper slips for students to write predictions.  
  - **Rule cards**: 6 pre-printed cards describing prediction rules (detailed below).  
  - **Leaderboard**: Whiteboard or poster paper to track scores.  
  - **Timer**: For round management.  

  ---

  ### **Rules of the Game**  
  **Core Mechanics**:  
  - Students predict the color of the next drawn card using a fixed rule they select at the start.  
  - Rules include "natural" (color-based) and "gerrymandered" (time-based) options.  
  - Points: +1 for a correct prediction, +0 for incorrect. Points are fictional (leaderboard only).  

  **Prediction Rules (printed on cards for students to choose from)**:  
  1. **Always Red**: Predict red every round.  
  2. **Always Blue**: Predict blue every round.  
  3. **Majority Rule**: Predict the color that has appeared most often so far. If tied, predict red.  
  4. **Red-Grue**: Predict red if drawn before Round 15; predict blue if drawn in Round 15 or later.  
  5. **Blue-Grue**: Predict blue if drawn before Round 15; predict red if drawn in Round 15 or later.  
  6. **Alternator**: Predict red in odd-numbered rounds, blue in even-numbered rounds.  

  *(Note: Rules 4–5 are "grue-like"; Rule 6 adds complexity but ensures gerrymandered options are visible.)*  

  ---

  ### **Timeline (90 Minutes Total)**  

  #### **1. Setup (5 minutes)**  
  - **Script**: "Today, we’re playing a prediction game. You’ll choose a rule that tells you what color to guess for each card I draw. Your goal is to score points by guessing correctly. Points go on the leaderboard—no prizes, just glory."  
  - **Logistics**:  
    - Shuffle the deck (pre-arranged sequence: **first 14 cards = red, remaining 26 = all blue**).  
    - Distribute rule cards. Each student picks one rule **privately** and writes it on a slip (collect slips to track choices).  
  - **Why this works**: Students commit to rules without knowing the grue analogy. The fixed deck ensures "Always Red" and "Red-Grue" have identical predictions until Round 15, creating the evidence neutrality.  

  #### **2. Initial Rounds: Commitment Phase (25 minutes)**  
  - **Rounds 1–14** (1 minute per round):  
    - Announce round number (e.g., "Round 1").  
    - Students write predictions on slips based on their rule (e.g., "Red" or "Blue").  
    - Draw a card (always **red** for Rounds 1–14), reveal it, and award points. Update leaderboard.  
  - **Key facilitation**:  
    - Keep pace brisk. If students ask why all cards are red, say: "The deck is what it is—focus on your rule."  
    - After Round 14, pause and note: "We’ve seen 14 red cards so far."  

  #### **3. Licensing Vote: Staging Entrenchment (15 minutes)**  
  - **Setup**: "Now, we’ll vote on which rules are 'allowed' for the rest of the game. You’re not voting for your rule—you’re deciding which rules *anyone* can use from now on. Discuss as a group: Which rules feel reliable? Which seem suspicious? Vote based on the rule itself, not your score."  
  - **Process**:  
    - **Discussion (8 minutes)**: Students debate which rules to allow. List all 6 rules on the board.  
    - **Vote (2 minutes)**: Each student votes for 2 rules they want to license. Tally publicly.  
    - **Outcome (5 minutes)**: Announce the top 3–4 licensed rules. *(Typically, students license Rules 1–3 and reject 4–6 as "tricky" or "arbitrary.")*  
  - **Why this works**: The vote forces students to externalize their bias toward simple, entrenched rules. The gerrymandered rules (4–6) are rejected not due to evidence but because they violate linguistic intuitions.  

  #### **4. Final Rounds: Neutrality Revealed (15 minutes)**  
  - **Rounds 15–20** (1.5 minutes per round):  
    - Students **must switch** to a licensed rule (even if theirs wasn’t chosen).  
    - Draw cards (all **blue** for Rounds 15–20).  
    - Update leaderboard.  
  - **Outcome**:  
    - "Always Red" fails (predicts red, sees blue).  
    - "Red-Grue" succeeds (predicts blue, sees blue).  
    - Scores shift dramatically, revealing the evidence neutrality pre-Round 15.  

  #### **5. Debrief: Connecting to Grue (25 minutes)**  
  **Script (Tie each moment to the activity)**:  

  > **Moment 1: Name the Puzzle (2 min)**  
  > "This was the **grue puzzle**. Philosopher Nelson Goodman designed it to challenge how we justify predictions. Like our game, it shows two rules supported by identical evidence but conflicting later."  
  > *Why now? Students feel the stakes after seeing rules diverge.*  

  > **Moment 2: Define Grue (3 min)**  
  > "In Goodman’s version:  
  > - 'All emeralds are green' and 'All emeralds are grue' have the same evidence (all observed emeralds are green).  
  > - 'Grue' means 'green if observed before time T; blue otherwise.'  
  > In our game: 'Always Red' and 'Red-Grue' had identical evidence for 14 rounds—then contradicted each other."  
  > *Tie-in: Use whiteboard to map "green" → "red," "grue" → "Red-Grue."*  

  > **Moment 3: Highlight Neutrality (5 min)**  
  > "Before Round 15, could anyone tell the difference between 'Always Red' and 'Red-Grue' based on the cards? [No.] Yet you all had strong feelings in the licensing vote. Why?"  
  > *Activity link: Emphasize the 14 red cards were neutral between rules.*  

  > **Moment 4: Stage the Entrenchment (10 min)**  
  > "During the vote, you rejected 'Red-Grue' and 'Blue-Grue.' Why? Was it because:  
  > - The rules were 'about round numbers, not colors'?  
  > - They felt 'made up' or 'tricky'?  
  > Crucially, **nothing in the cards** told you this. The asymmetry came from *your* prior practice: you’re fluent with 'red' and 'blue,' but not 'grue-like' rules. You supplied the bias—the world didn’t."  
  > *Tie-in: Contrast vote arguments (e.g., "Round 15 is arbitrary!") with card evidence.*  

  > **Moment 5: Hold the Question (5 min)**  
  > "Does this mean entrenchment is all we have? Or is it a crutch? I won’t answer that. The puzzle’s power is in realizing you’ve *already been using* entrenched rules—and now you’re holding the question of what justifies them."  
  > *Why this works: Ends with the open dilemma, not a solution.*  

  ---

  ### **Predictable Problems & Solutions**  
  1. **"Grue isn’t a real predicate!"**  
     - *Response*: "You’re right—in our language, 'grue' feels artificial. But imagine a community that uses 'grue' as a basic term (e.g., 'green' might be 'grue before T and bleen after T'). Our vote showed we prefer rules that match *our* linguistic habits. But could theirs work? That’s the puzzle."  

  2. **"The vote is just opinion!"**  
     - *Response*: "True—it’s not about 'correctness.' But *why* did opinions cluster against time-based rules? Because we share entrenched practices. The vote staged how a community coordinates on norms when evidence is silent."  

  3. **Student uses unlicensed rule in final rounds**:  
     - *Prevention*: Collect prediction slips quickly; announce licensed rules prominently.  
     - *In-room fix*: "Remember, you committed to licensed rules. If you used another, recalc your score."  

  ---

  ### **What the Activity Cannot Reproduce**  
  **The Solitary Inquirer**:  
  - The activity relies on a **community vote** to stage entrenchment. It cannot fully replicate the dilemma of a lone scientist (e.g., on a desert island) with no shared language.  
  - **How to address**: Briefly note in debrief: "Goodman’s puzzle also challenges individuals. But even a solitary inquirer inherits language from a community. Today, we focused on how that community shapes bias—but the tension remains for individuals too."  

  ---

  ### **Why This Works**  
  - **Students commit first**: They bet on rules before seeing the grue parallel, mirroring real scientific practice.  
  - **Entrenchment is staged, not explained**: The licensing vote makes bias visceral. Students *feel* their preference for "smooth" rules.  
  - **Debrief delays the puzzle’s name**: Naming "grue" after the experience avoids preconceptions.  
  - **Open-ended**: No solution is imposed—students "hold the question."  

  This plan balances structure with flexibility. The fixed deck ensures evidence neutrality manifests clearly, while the vote and debrief transform abstract entrenchment into a tangible group experience. Run it as is, and you’ll have students arguing not *about* grue, but *through* it.
