prompt: |-
  I run a small advisory practice that prepares executives for high-stakes negotiations — union contracts, supplier standoffs, regulatory settlements — and I want to replace the credibility memo my analysts write for each client, which is currently mostly intuition dressed up as analysis, with a procedure they can run in about an hour. The job is to take any commitment the client proposes to make or to rely on — a threat to walk, a promise to hold a line, a red line, a take-it-or-leave-it — and return a verdict on whether the other side will treat it as binding. Ground it in epistemic game theory rather than folk negotiating wisdom, and keep it usable by analysts with undergraduate economics and no game theory; general counsel signs anything we put in writing, so the procedure must not smuggle in a conclusion about legality. It should make us check, in order: whether following through would be rational for the client at the moment of truth, and whether the other side can see that we can see that they see it; whether the commitment is merely public or actually common knowledge, with a rule about what kind of act creates common knowledge and why one more round of confirmation does not; whether the client's board or membership must ratify, so that the commitment has to be common knowledge in two rooms rather than one; and where the procedure stops and tells the client not to say the thing at all. Run it on two cases: a client that threatens to drop its sole supplier unless it cuts prices by eight percent, and a client that has already promised its members, in a recorded all-hands, that pensions are off the table ahead of a ratification vote. Tell me which case the procedure decides against the client's wishes, mark the steps that are judgment rather than procedure, and say where it will misfire — especially when the other side is not the forward-looking optimizer the theory assumes.
reasoning: |-
  We are designing a procedure to evaluate the credibility of a commitment in negotiations. The procedure is grounded in epistemic game theory but must be usable by analysts with undergraduate economics and no formal game theory. The key elements are:

  1. **Rationality at the moment of truth**: Would following through be rational for the client when the time comes?
  2. **Mutual knowledge and common knowledge**: We need to check whether the commitment is not just known but common knowledge, and how many rounds of confirmation are needed.
  3. **Ratification requirements**: If the commitment requires ratification (by a board or membership), then common knowledge must extend to both the negotiating room and the ratifying body.
  4. **Stopping rule**: The procedure may advise against making the commitment if it fails the credibility test.

  The procedure must not make legal conclusions.

  We are to test the procedure on two cases:

  **Case A**: A client threatens to drop its sole supplier unless it cuts prices by eight percent.

  **Case B**: A client has already promised its members, in a recorded all-hands meeting, that pensions are off the table ahead of a ratification vote.

  We are to indicate which case the procedure decides against the client's wishes, mark the steps that require judgment (as opposed to being purely procedural), and note where the procedure might misfire, especially when the other side is not a forward-looking optimizer.

  ---

  **Procedure for Credibility Assessment**

  **Step 1: Rationality at the Moment of Truth**
     - **Question**: If the other side calls the client's bluff, would it be rational for the client to follow through on the commitment at that moment?
     - **Procedure**: 
       - List the costs and benefits of following through at the moment of truth (without considering the negotiation context).
       - If the benefits of following through (e.g., maintaining credibility for future negotiations, avoiding worse outcomes) outweigh the costs (e.g., losing the supplier, incurring transition costs), then it is rational. Otherwise, it is not.
     - **Judgment**: The analyst must estimate the costs and benefits. This requires judgment because it involves predictions and valuations.

  **Step 2: Mutual and Common Knowledge**
     - **Question**: Is the commitment common knowledge? Specifically, does the other side know that the client is committed, and does the client know that the other side knows, and so on?
     - **Procedure**:
       - **Common Knowledge Creation Rule**: Common knowledge is created by a public and verifiable act that is observed by all relevant parties and that cannot be undone or ignored. Examples: a signed contract, a public announcement in a forum where all parties are present and it is recorded, a statement in a regulatory filing. A private email or a verbal statement in a one-on-one meeting does not create common knowledge.
       - **Why one more round of confirmation doesn't help**: Common knowledge requires an infinite regress of "I know that you know that I know ...". A single public act can create common knowledge because it is observed by all and all know that all have observed it. Adding one more round (e.g., a confirmation) does not create common knowledge if the initial act wasn't public and verifiable. However, if the initial act was public and verifiable, then it is already common knowledge and no further confirmation is needed.
       - Check: Was the commitment made in a way that is public and verifiable to the other side? If yes, then it is common knowledge. Otherwise, it is not.
     - **Judgment**: Determining whether the act was public and verifiable requires judgment. For example, if the commitment was made in a meeting, the analyst must assess whether the meeting was attended by all relevant parties and whether the commitment was unambiguous and recorded.

  **Step 3: Ratification Requirements**
     - **Question**: Does the commitment require ratification by a board or membership? If so, is the commitment common knowledge in both the negotiating room and the ratifying body?
     - **Procedure**:
       - If ratification is required, then the commitment must be common knowledge in two groups: the negotiators and the ratifiers.
       - Check: 
          - For the negotiators: Was the commitment made public and verifiable to the other side (as in Step 2)?
          - For the ratifiers: Was the commitment made public and verifiable to the ratifiers? (Same rule as Step 2 applied to the ratifiers.)
       - If both conditions are met, then the commitment is credible in the sense that the ratifiers will hold the client to it and the other side knows this. Otherwise, it fails.
     - **Judgment**: Determining whether ratification is required and whether the commitment is common knowledge to the ratifiers requires judgment.

  **Step 4: Stopping Rule**
     - If at any step the commitment fails (i.e., it is not rational to follow through, or it is not common knowledge where required, or ratification requirements are not met), then the procedure stops and advises the client not to make the commitment (or if already made, that it is not credible). If the commitment is being evaluated after it was made, then the verdict is that the other side will not treat it as binding.

  **Output**: A verdict: "Credible" or "Not Credible". If the commitment fails at Step 1, 2, or 3, then it is not credible.

  ---

  **Running the Procedure on Case A**

  **Case A**: Client threatens to drop its sole supplier unless it cuts prices by eight percent.

  **Step 1: Rationality at the Moment of Truth**
     - If the supplier does not cut prices, would it be rational for the client to drop the supplier?
     - Costs: Finding a new supplier may be costly (search costs, transition, possible lower quality, higher prices elsewhere). Also, the client might face disruption.
     - Benefits: If the current supplier is charging above market, then switching might save money in the long run. Also, the threat might be necessary to get a better deal and for future credibility.
     - **Judgment**: The analyst must estimate these costs and benefits. If the client can easily switch without incurring high costs and the new supplier offers a better price, then it's rational. But if switching is very costly and the savings are minimal, then it might not be rational. We assume the client is a rational optimizer. Let's assume the analyst finds that the costs of switching are high (because it's the sole supplier and alternatives are scarce) and the benefits (8% cut) are not enough to offset the costs. Therefore, it would not be rational to follow through.
     - **Verdict for Step 1**: Not rational. Therefore, the commitment is not credible. We stop here and advise against the threat.

  **Output for Case A**: Not Credible. The procedure stops at Step 1.

  ---

  **Running the Procedure on Case B**

  **Case B**: Client has already promised its members, in a recorded all-hands, that pensions are off the table ahead of a ratification vote.

  **Step 1: Rationality at the Moment of Truth**
     - If the other side (the union, say) insists on discussing pensions, would it be rational for the client to refuse (i.e., keep pensions off the table) even if it risks the ratification vote?
     - Costs: If the client refuses to discuss pensions, the union might strike or the ratification vote might fail, leading to a worse outcome (e.g., no contract, strike costs).
     - Benefits: Keeping the promise to members maintains trust and credibility for future dealings. Also, the client might have legal or moral reasons to keep the promise.
     - **Judgment**: The analyst must weigh these. If the cost of a failed ratification (e.g., a strike) is extremely high, it might be rational to break the promise and discuss pensions. However, breaking the promise could lead to loss of trust and future problems. We assume that the cost of breaking the promise (loss of trust, potential for members to reject future agreements) is very high. Therefore, it is rational to keep pensions off the table even if it risks the ratification vote.
     - **Verdict for Step 1**: Rational.

  **Step 2: Mutual and Common Knowledge**
     - The commitment was made in a recorded all-hands meeting. This meeting was for the members (the ratifiers) and was recorded. But was it public and verifiable to the other side (the union negotiators)?
     - **Judgment**: The union negotiators might not have been present at the all-hands. However, the meeting was recorded and the union leaders (or the rank and file) would likely be informed. But note: the other side (the union negotiators) might not have been in the room. Therefore, it might not be common knowledge to the union negotiators. However, if the recording is made available to the union or if the union members (who are the ratifiers) are also the constituents of the union negotiators, then the negotiators would know about the commitment because their constituents know and will hold them accountable. But the procedure requires common knowledge between the client and the other side (the union negotiators). 
     - We must check: Is the commitment common knowledge between the client and the union negotiators? The all-hands meeting was for the client's members, not the union. The union negotiators might have heard about it through the grapevine, but that is not necessarily public and verifiable. Therefore, it might not be common knowledge for the union negotiators.
     - **Verdict for Step 2**: Not common knowledge for the union negotiators (unless there was a specific communication to them that was public and verifiable).

  **Step 3: Ratification Requirements**
     - The commitment requires ratification by the members. Therefore, common knowledge must exist in two rooms: the negotiating room (with the union) and the ratifiers (the members). 
     - For the ratifiers (members): The commitment was made in an all-hands meeting that was recorded. This is public to the members and verifiable (recorded). So it is common knowledge among the members.
     - For the negotiators: The commitment must be common knowledge between the client and the union negotiators. However, as per Step 2, it is not. Therefore, the condition fails.
     - **Verdict for Step 3**: Fails because the union negotiators do not have common knowledge of the commitment.

  **Stopping Rule**: The procedure stops at Step 3 and returns "Not Credible". However, note that the commitment has already been made. The verdict is that the union negotiators will not treat it as binding.

  **Output for Case B**: Not Credible.

  ---

  **Which case the procedure decides against the client's wishes?**
  In both cases, the verdict is "Not Credible". However, the client in Case B has already made the commitment and would wish that it is credible. Therefore, Case B is the one that goes against the client's wishes (since they have already made the promise and want it to be binding). In Case A, the client is considering making the threat and the procedure advises against it (which the client might not wish to hear, but they haven't made it yet).

  **Steps that are judgment rather than procedure**:
  - Step 1: The assessment of costs and benefits is judgment.
  - Step 2: Determining whether the act was public and verifiable enough to create common knowledge is judgment.
  - Step 3: Determining whether ratification is required and whether the common knowledge condition holds for both groups is judgment.

  **Where the procedure will misfire**:
  - The procedure assumes that the other side is a forward-looking optimizer. However, in reality, the other side might be:
     - **Irrational**: They might not act in their own best interest, or they might have behavioral biases (e.g., they might overestimate the client's willingness to follow through, or they might be overly risk-averse).
     - **Limited rationality**: They might not think through the game tree and might not appreciate the credibility of the commitment even if it passes the test.
     - **Different information**: The other side might have different information about the costs and benefits, leading them to a different conclusion about the client's rationality.
     - **Emotional or political factors**: The other side might care about saving face or might be influenced by internal politics, which the procedure does not account for.
     - **Reputation and history**: If the client has a history of bluffing, the other side might not believe the commitment even if it passes the credibility test. Conversely, if the client has a strong reputation for being tough, even a weak commitment might be believed.

  In particular:
  - In Case A: Even if the analyst judges that it is not rational to switch suppliers, the supplier might believe that the client is irrational or might fear that the client has a better alternative than the analyst knows. Then the threat might work even though the procedure says it's not credible.
  - In Case B: The union negotiators might know about the all-hands meeting through their members and thus treat the commitment as binding even if it wasn't formally communicated to them in a public and verifiable manner. Also, the union negotiators might be constrained by their members' knowledge (if the members know and will hold the union accountable for ignoring the client's commitment) and thus act as if it's common knowledge.

  Therefore, the procedure might be too strict in requiring formal common knowledge when in practice the other side might get the message through other channels and act accordingly. Conversely, it might be too lenient in assuming rationality when the other side might have a different view of the client's payoffs.

  Despite these limitations, the procedure provides a structured, theory-based approach to credibility assessment that is an improvement over intuition.
answer: |-
  ### Credibility Assessment Procedure for High-Stakes Negotiations  
  **Grounding**: Epistemic game theory (focusing on rationality, common knowledge, and strategic foresight), adapted for analysts with undergrad economics. Avoids legal conclusions.  
  **Time Budget**: 1 hour per commitment.  
  **Input**: Any proposed commitment (threat, promise, red line, etc.).  
  **Output**: Verdict on whether the other side will treat it as binding ("Credible" or "Not Credible").  

  ---

  #### Step 1: **Rationality at the Moment of Truth**  
  **Question**: If the other side ignores the commitment, would following through be rational for the client *at that moment*?  
  **Procedure**:  
  1. List the client’s tangible costs/benefits of following through (e.g., financial losses, reputational gains).  
  2. Ignore sunk costs or future reputational effects beyond the immediate act.  
  3. **Verdict**: If benefits > costs, proceed to Step 2. Else, stop → **Not Credible**.  
  **Judgment Required**: Estimating costs/benefits (e.g., quantifying "reputational damage").  

  #### Step 2: **Common Knowledge Creation**  
  **Question**: Is the commitment *common knowledge* (not just public)?  
  **Procedure**:  
  1. **Defining Common Knowledge**:  
     - **Level 1**: The other side knows the commitment.  
     - **Level 2**: The client knows the other side knows.  
     - **Level 3**: The other side knows the client knows they know.  
     → *Common knowledge requires infinite recursion (all levels)*.  
  2. **Rule for Creation**: Common knowledge is created **only** by a *public, irreversible, and verifiable* act (e.g., signed document, recorded public announcement, regulatory filing).  
     - *Why one more confirmation fails*: A follow-up statement (e.g., email) only adds one level. It cannot achieve infinite recursion. Only a foundational public act (e.g., a stage speech) allows all parties to observe and know others observed it.  
  3. **Check**: Was the commitment made via a public, irreversible, verifiable act?  
     - **Yes** → Proceed to Step 3.  
     - **No** → Stop → **Not Credible**.  
  **Judgment Required**: Assessing if an act is "public/verifiable" (e.g., was a recorded meeting sufficiently accessible?).  

  #### Step 3: **Ratification Checks**  
  **Question**: Does the commitment require ratification (e.g., by a board or membership)?  
  **Procedure**:  
  1. If **no ratification**, verdict → **Credible**.  
  2. If **ratification required**:  
     - Check if the commitment is common knowledge in **both** the negotiation room *and* the ratification body.  
     - Use Step 2’s rule: Was the act public/verifiable to *both* groups?  
       - **Yes** → **Credible**.  
       - **No** → **Not Credible**.  
  **Judgment Required**: Determining if ratification is needed and if knowledge spans "two rooms."  

  #### Stopping Rule  
  - **Stop and advise "Do not commit"** if any step fails (Step 1, 2, or 3). For existing commitments, return "Not Credible."  

  ---

  ### Case Applications  
  #### **Case A: Threat to Drop Sole Supplier**  
  > *Client threatens to drop its sole supplier unless prices are cut by 8%.*  
  - **Step 1 (Rationality)**:  
    - Costs of following through: High (switching suppliers causes operational disruption, new vetting costs).  
    - Benefits: Short-term savings (8% cut) unlikely to offset costs.  
    - **Judgment**: Analyst estimates costs > benefits → **Not Credible**. Stop.  
  - **Verdict**: **Not Credible**.  
  - **Against client’s wishes?** Yes (client wants to make the threat).  

  #### **Case B: Pensions "Off the Table" Promise**  
  > *Client promised members (recorded all-hands) that pensions are off the table ahead of a union ratification vote.*  
  - **Step 1 (Rationality)**:  
    - Costs of following through: Risk of negotiation collapse if union insists on pensions.  
    - Benefits: Upholding promise maintains member trust; collapse may be less costly than credibility loss.  
    - **Judgment**: Benefits > costs → Proceed.  
  - **Step 2 (Common Knowledge)**:  
    - Act: Recorded all-hands → Verifiable to *members*, but not necessarily to the *union negotiators*.  
    - **Judgment**: Union negotiators may not have witnessed it directly. Recording ≠ common knowledge with union (not a bilateral public act). → **Not Credible**. Stop.  
  - **Verdict**: **Not Credible**.  
  - **Against client’s wishes?** Yes (client already made the commitment and wants it binding).  

  ---

  ### Which Case Fails?  
  - **Case B** is decided against the client’s wishes (client already committed but procedure deems it non-binding).  

  ### Steps Involving Judgment  
  1. **Step 1**: Quantifying costs/benefits.  
  2. **Step 2**: Assessing if an act is "public/verifiable."  
  3. **Step 3**: Deciding if ratification is required and if knowledge spans multiple groups.  

  ### Where the Procedure Misfires  
  1. **Non-Rational Opponents**:  
     - If the other side is emotional, spiteful, or myopic (e.g., a supplier ignoring costs to "punish" the client), they may misjudge credibility. The procedure assumes rational optimizers.  
     - *Example*: In Case A, a supplier with poor cost-calculation might cave to the threat even if irrational.  

  2. **Reputation & History**:  
     - The procedure ignores past interactions. A client with a reputation for bluffing may have commitments disbelieved even if credible here.  

  3. **Incomplete Information**:  
     - If the other side has hidden information (e.g., the supplier has a backup buyer), they may dismiss commitments the procedure deems credible.  

  4. **Bounded Rationality**:  
     - Real-world actors may not compute common knowledge recursion. A "public" verbal threat might be treated as binding even if theoretically imperfect.  

  5. **Cross-Cultural Context**:  
     - In cultures where verbal promises are binding (e.g., some Asian markets), the procedure’s strict common-knowledge rule may undervalue informal commitments.  

  ### Recommendation  
  Use this procedure to filter *objectively indefensible* commitments. Pair it with behavioral insights (e.g., "Does the other side have a history of irrationality?") for robustness. **Outputs are advisory** and must be supplemented with experiential judgment.
