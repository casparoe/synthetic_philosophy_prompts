prompt: |-
  Construct a thought experiment in the form of a compact case study: a fictional but realistic society — no fantasy elements, no more than two paragraphs of setup — in which a widely practised, costly, and morally objectionable custom is abolished, engineered so that the three standard explanations of moral revolutions come apart in a specified pattern. Take the three explanations to be: (i) the argument explanation, on which the custom ends because moral entrepreneurs produce arguments that eventually convince enough people; (ii) the interest explanation, on which it ends because it stops paying, the payoffs to those who sustain it or to those with the power to suppress it having shifted; and (iii) the honor explanation, on which it ends because the code of honor that made the custom a source of standing is refigured, so that practitioners now lose standing by continuing rather than gain it by continuing, and abandon it without being persuaded of anything. This is the dispute between economic readings of British abolition (the reading associated with Eric Williams) and honor-centred readings of moral revolutions (the reading associated with Kwame Anthony Appiah).

  Specifications for the case:
  - The custom must be invented rather than one of the stock examples (slavery, dueling, footbinding, sati, or the like), and its material structure must be laid out explicitly enough for the interest explanation to get traction.
  - At the moment of collapse, the argument explanation must predict persistence: the best arguments against the custom available in the society's own moral vocabulary must already be on the table and already have failed, and no new argument may appear.
  - At the moment of collapse, the interest explanation must also predict persistence: the material payoffs must be unchanged, or must change in the direction that favours continuing. State which, and why.
  - The honor explanation must predict collapse, and must do so without smuggling in either an argument or a payoff: the trigger may alter only whose esteem matters, or what the custom signifies to those whose esteem matters.
  - The trigger must be cheap and attributable to a single actor or small group; no conquests, no technological revolutions, no charismatic figure who simply persuades everyone.

  Then, in order: (a) present the case; (b) state what each of the three explanations predicts and why, making clear that the predictions are generated by the mechanisms rather than stipulated; (c) identify the single feature of the case that does the work, and say what happens if it is deleted — does the case collapse back into an interest or argument story?; (d) give the strongest available reply for a defender of the interest explanation, who will want to redescribe your trigger as an interest shift in disguise, and say whether the reply succeeds; and (e) sketch a companion case in the mirror-image direction, in which the interest explanation predicts collapse while the honor explanation predicts persistence, so that the two mechanisms are shown to be separable rather than two descriptions of one event.
reasoning: |-
  Hmm, this is a fascinating challenge to design a thought experiment that cleanly separates three different explanations for moral revolutions: argument-based, interest-based, and honor-based. The user wants a fictional society where a costly, objectionable custom collapses in a way that isolates the honor mechanism from the other two. 

  I need to invent a custom that's both materially grounded and morally problematic. The "luxury mourning" concept seems promising - it's economically tangible (with specific costs and benefits), socially stratified, and emotionally resonant. The key is making its persistence depend on competitive status signaling rather than rational calculation or moral persuasion.

  For the predictions: Arguments must fail despite being logically sound (since they've been circulating for decades), interests must remain unchanged or even strengthen (hence making the custom more profitable for merchants). The honor flip must come from a purely symbolic gesture - that's why the royal family's subtle shift in who they recognize matters. Their changed behavior doesn't alter material payoffs but redefines what "counts" as prestigious.

  The hardest part is defending against interest-based reductionism. A skeptic might claim the courtiers' abandonment is really about protecting their positions - but that fails because the king's favor remains unchanged materially. The companion case ("silver teeth") flips this neatly: there, interests collapse while honor incentives persist, proving the mechanisms can operate independently.

  User seems deeply familiar with moral philosophy debates - probably an academic testing theoretical boundaries. The precision of their specifications suggests they'll notice any fuzziness in the mechanisms. I should avoid any sneaky moral arguments or hidden payoff shifts. The trigger must be surgically precise: no new information, no coercion, just redirected social attention.
answer: |-
  Here is the constructed case study meeting all specifications:

  **(a) The Case: Vailan Mourning Stones**
  In the island society of Vailos, bereaved families commission massive, carved "mourning stones" to be placed atop graves. These stones require specialized artisans and immense labor to quarry and transport, costing up to a decade's income for a prosperous family. The practice is widespread among the elite and aspirational classes, driven by intense social competition. Larger, more elaborate stones signify profound grief and deep familial piety, conferring immense honor and social standing. Critically, the quarrying and carving are controlled by powerful Guilds, who reap enormous profits and political influence. Objections exist: reformers argue the stones are ruinous, distract from genuine mourning, and exploit grief. Yet these arguments fail; critics are dismissed as cheap or disrespectful. The custom persists for generations, immiserating families and enriching the Guilds.

  The trigger occurs when the young, newly crowned Queen Ilara, known for her quiet pragmatism, suffers the loss of her infant son. Instead of commissioning a colossal stone, she places a small, unadorned river rock on the tiny grave. She then publicly receives condolences *not* from the heads of the great Stone Guilds, but exclusively from the Society of Gardeners (a modest group tending public memorial gardens), praising their "quiet dignity." She pointedly ignores the Guild Masters at the next court levee. No speech is made. No law is changed. The quarrying economy remains intact and profitable. Yet, within months, elite families quietly abandon commissioning large stones. Within a year, the custom collapses, leaving the baffled Guilds financially sound but socially irrelevant.

  **(b) Predictions & Mechanisms:**
  *   **Argument Explanation Predicts PERSISTENCE:** The best arguments against the custom (financial ruin, exploitation, hollow symbolism) are decades old, well-known, and have demonstrably failed to change behavior. No new, superior argument emerges. The Queen doesn't articulate an argument; she merely acts differently. *Mechanism:* Persuasion hasn't worked before and no new persuasive force is introduced.
  *   **Interest Explanation Predicts PERSISTENCE:** The material payoffs for continuing the custom are *unchanged* or even *strengthened* at the moment of collapse. The Guilds' profits remain high; the demand for stones is undiminished prior to the trigger. Families abandoning the custom *lose* potential status without any material gain (their wealth remains depleted). *Mechanism:* The economic incentives sustaining the practice – profits for suppliers and status competition driving demand – are still fully operative.
  *   **Honor Explanation Predicts COLLAPSE:** The Queen's actions refigure the "code of honor." By conspicuously honoring the modest Gardeners and ignoring the powerful Guild Masters, she signals that true honor now resides in restraint and quiet dignity, not ostentatious display. Practicing the old custom (commissioning large stones) no longer gains standing from the ultimate source of honor (the Crown); it now risks association with vulgar excess and loss of favor. *Mechanism:* The source of esteem (the Queen's recognition) now rewards a *different behavior* (restraint), making the old status-seeking behavior (ostentation) dishonorable. People abandon it to avoid shame and seek the new path to esteem, without needing a new moral argument.

  **(c) The Key Feature & Its Removal:**
  *   **The Key Feature:** The Queen's specific action of **redirecting recognition and esteem** – publicly favoring a group embodying the *opposite* behavior (Gardeners practicing quiet dignity) while pointedly ignoring the pinnacle practitioners/supporters (Guild Masters). This alters *whose* esteem matters (Gardeners gain prominence, Guilds lose it) and *what* the custom signifies (ostentation becomes vulgar, restraint becomes honorable).
  *   **Effect of Removal:** If the Queen merely placed a small stone *without* the redirected recognition (e.g., still received the Guild Masters normally), the honor mechanism wouldn't trigger. The collapse would be unexplained or might revert to an **argument story** (her simple act *could* be interpreted as a powerful non-verbal argument for modesty, making it a new persuasive act) or an **interest story** (if it sparked fear of lost royal contracts, though this is weak as Guilds weren't state suppliers).

  **(d) Interest Defender's Reply & Success:**
  *   **Reply:** "The Queen's snub of the Guild Masters signaled a *material threat* to their interests (loss of royal contracts, future regulation). Elites stopped buying stones not because of honor, but to avoid association with a now-disfavored group whose political/financial power was suddenly precarious. Their own 'interest' shifted to avoiding the risk of collateral damage from royal disfavor."
  *   **Success Assessment:** This reply **fails.** The case specifies the Guilds' *material* position was unchanged ("quarrying economy remains intact and profitable," "Guilds financially sound"). The Queen didn't threaten contracts or regulation; she merely withheld *social recognition*. Elites abandoning the custom gained *no* material security or avoided *no* material risk (the Queen didn't punish stone-buyers). The shift was purely about social standing and avoiding the *symbolic* stain of association with the newly dishonored Guilds, not material consequence. The interest defender smuggles in an unsubstantiated material threat.

  **(e) Companion Case (Interest Predicts Collapse, Honor Predicts Persistence):**
  **The Silver Teeth of Caldera:** In Caldera, elites embed intricate silver filigree caps onto their front teeth. This signals wealth and courage, as the procedure is excruciating and requires repeated, costly sessions with specialized "Silver Smiths." It confers high honor. A new, safe, painless, and vastly cheaper method of applying identical-looking silver veneers is invented by a foreign dentist. The material payoff for undergoing the painful procedure vanishes – the status signal can be faked cheaply. However, the *code of honor* remains rigidly tied to the *proof* of enduring the genuine, painful ritual. The old guard fiercely maintains that only those with "true silver" (verified by the scars and the Smiths' records) deserve honor.
  *   **Interest Explanation Predicts COLLAPSE:** The material cost (pain, risk, high price) of the genuine custom is now avoidable while achieving the visible marker. Self-interest should drive rapid adoption of veneers and abandonment of the painful ritual.
  *   **Honor Explanation Predicts PERSISTENCE:** The honor code explicitly values the *endurance of pain* and *authenticity* verified by the Smiths. Merely *looking* the part without the suffering confers no standing and is considered dishonorable deceit. Practitioners continue the painful ritual to gain/lose standing, despite the new, cheaper option.
  *   **Separation:** Here, material incentives shift dramatically against the custom (interest predicts collapse), but the honor code defining what confers standing remains unchanged and actively enforces the old practice (honor predicts persistence). The mechanisms pull in opposite directions.
