answer: |-
  **Poem**  
  The current claws, a weight that drags us down,  
  I fight the pull, the churning, rising sound.  
  Her eyes meet mine—no thought, no space between—  
  I push and strain, the only thing I've known.  

  But then: *This is the kind where rules permit* (intrusion)  
  The saving of one's own, they call it right.  
  The water chokes, her fingers brush my grip,  
  I pull her close against the drowning night.  

  *But what if asked: Why her above the rest?* (intrusion)  
  *You must explain: She is your wife, and so* (intrusion)  
  *It’s justified, the choice stands clear and true.* (intrusion)  
  My legs burn, kicking toward the fading shore,  
  The rocks draw near, I drag us through the roar.  

  We crawl ashore, collapse on sand and stone,  
  Alive and gasping, neither one alone.  
  No reasons now, no case to make or hold—  
  Just her hand warm, the only truth I’m told.  

