answer: |-
  ### Lexical Threshold Negative Utilitarianism: A Worked Example

  **1. The Example (143 words)**

  Consider a population of 10,000 individuals. Each experiences 100 hours of mild pain (e.g., persistent hunger, rated at -5 utils/hour on a hedonic scale where -100 utils/hour represents the stipulated *lexical threshold* for uncompensatable suffering). This creates a total sub-threshold disutility of **-5,000,000 utils** (10,000 people × 100 hours × -5 utils/hour).

  Now introduce one individual enduring 1 hour of *supra-threshold agony* (e.g., torture, rated at -200 utils/hour, exceeding the -100 threshold). Lexical threshold negative utilitarianism (LTNU) declares this suffering (-200 utils) *cannot* be compensated by any aggregate pleasure.

  However, the sub-threshold disutility can theoretically be offset. Suppose we could prevent the one hour of torture *or* prevent all 10,000 people from experiencing their 100 hours of mild pain. Preventing the torture saves -200 utils. Preventing the mild pains saves -5,000,000 utils. Yet LTNU prioritizes preventing the torture (-200 utils) over preventing the vastly larger aggregate sub-threshold suffering (-5,000,000 utils), solely because the torture crosses the lexical threshold. The quantities highlight the tension: the system allows massive aggregation *below* the threshold but forbids any comparison *across* it.

  **2. The Conceptual Issue It Isolates (198 words)**

  The scenario isolates a fundamental inconsistency in LTNU’s presupposed *metric for value comparison*. Below the threshold (-100 utils/hour), LTNU implicitly relies on a **cardinal, additive utility measure** to permit trade-offs: the -5,000,000 utils of mild pain can be aggregated and potentially outweighed by sufficient pleasure (e.g., +6,000,000 utils from widespread contentment). This assumes utils are fungible, additive units across individuals and experiences *within* the sub-threshold domain.

  Above the threshold, however, LTNU explicitly **denies the validity of this very metric**. It asserts that no quantity of sub-threshold utility (pleasure *or* reduced sub-threshold pain) can counterbalance *any* instance of supra-threshold suffering, regardless of duration or intensity beyond the threshold. The -200 utils/hour torture is treated as *infinitely* bad relative to sub-threshold states. This creates a paradox: the view simultaneously depends on a cardinal utility structure to manage sub-threshold trade-offs while rejecting that structure’s applicability (and thus its ability to measure *relative* badness) when comparing sub-threshold and supra-threshold states. The threshold creates a categorical break that renders the sub-threshold utility calculus incommensurable with supra-threshold disvalue, yet the theory relies on that calculus to function below the line.

  **3. Why It Is Not Merely a Puzzle About Arithmetic (149 words)**

  The problem transcends arithmetic aggregation. It concerns **the ontological status of utility measurement and the coherence of commensurability**. Arithmetic merely reveals the consequence; the core issue is whether the utility measure used below the threshold possesses the properties needed to support LTNU’s core claims *about value itself*.

  If utils are meaningful, cardinal units below the threshold (permitting the calculation of -5,000,000), why do they abruptly lose their cardinal meaning when one state exceeds -100? What property of experience or value does the threshold mark that invalidates the unit’s fungibility? The defender cannot consistently claim utils are robust, additive measures for comparing mild pains and pleasures *among themselves* while simultaneously claiming they become utterly meaningless for comparing *any* sub-threshold state to *any* supra-threshold state. This isn’t just about summing large numbers; it’s about whether the theory employs a single, coherent concept of utility measurement or requires two fundamentally distinct, incommensurable scales – one cardinal below the threshold and one lexical/ordinal above it – without explaining their relationship.

  **4. What a Defender of the View Must Concede (98 words)**

  A defender of LTNU must concede that **the cardinal utility calculus operational below the lexical threshold cannot rationally justify the absolute lexical priority assigned to supra-threshold suffering**. While they can maintain the *intuition* that extreme suffering is lexically worse, the example forces the admission that the *metric* used to quantify and trade sub-threshold disutilities provides no bridge – and indeed, its internal logic suggests the opposite conclusion – for grounding the radical discontinuity at the threshold. The defender must either argue the threshold reflects a brute ethical fact transcending utility measurement (undermining the sub-threshold calculus) or accept that the presupposed common measure below the threshold is insufficient to define or defend the lexical claim above it.
