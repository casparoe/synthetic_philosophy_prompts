  I am compiling a seminar handout on lexical threshold negative utilitarianism: the view that some threshold of suffering exists above which no quantity of pleasure can compensate, while below that threshold pleasures and pains remain tradeable against one another. Rather than a survey, I want a single worked example. Give me one concrete scenario that isolates a specific conceptual issue for the view — namely that it appears to presuppose a common measure of pleasure and pain in order to license sub-threshold trade-offs, while its lexical claim above the threshold denies that any such common measure exists. Stipulate the scenario's quantities (numbers of individuals, intensities, durations) so that the two halves of the view pull in opposite directions, and make explicit which features of the scenario are doing the work.

  Structure the response in four named sections: The example (roughly 150 words); The conceptual issue it isolates (roughly 200 words); Why it is not merely a puzzle about arithmetic (roughly 150 words); and What a defender of the view must concede (roughly 100 words).
