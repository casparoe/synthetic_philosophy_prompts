  Better avoid making the institute dystopian; a mundane bureaucracy lends credibility. The grading categories (lock-in, reversibility etc.) should feel like plausible academic metrics. Small details matter - the colleague's "saving lives" spreadsheet shows how quantification breaks down against lived experience.

