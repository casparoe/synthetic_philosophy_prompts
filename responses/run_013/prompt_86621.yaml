prompt: |-
  Ok, I want your actual credence here, decomposed, not a tour of the literature. The reference class problem: I buy that it wrecks strict frequentism, but I genuinely can't tell whether it's a real problem for probability full stop or just an artifact of how we describe things. Concretely — my sister's trying to guess the chance her startup folds within two years. Candidate reference classes: all startups, all startups in her sector, all that raised at her stage, all founded by someone with her background. They give wildly different numbers, none is a subset of any other (so "just use the most specific class you've got" doesnt pick a winner), and one of them is defined by a choice she made herself, which somehow feels like it shouldn't count the same way — I can't articulate why. So: what's your credence that in a case like this there's a single objectively correct reference class, i.e. that the question has a determinate answer rather than being settled by whichever class is convenient or salient? Break it into the sub-questions: (a) is the indeterminacy in the world or in our descriptions; (b) does some selection principle — total evidence, narrowest class, weighting the classes somehow — actually fix a unique answer; (c) does going full subjectivist/Bayesian dissolve the problem or just relocate it; (d) does "correct" even have determinate content here. A number and one line for each, how they combine, and flag the term you'd bet least on plus what would move it. I'm around 0.35, a friend's around 0.75 — where do you reckon we most likely disagree? British English please.
