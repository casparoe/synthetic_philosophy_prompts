  I am anchored here by a borrowed **Name**,  
  this skin I call my own, this aging **Body**.  
  I clutch the fragments of a fading **Memory**,  
  repeat the motions of a tired **Habit**,  
  and stand rooted in this fixed **Place**,  
  while something dark becomes my **Shadow**.  

