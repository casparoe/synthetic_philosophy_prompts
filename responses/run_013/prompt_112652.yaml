answer: |-
  ### (a) The Episode, in Your Terms  
  The FCPA emerged from 1970s revelations that hundreds of U.S. firms maintained slush funds to bribe foreign officials—disguised as “commissions,” “consulting fees,” or “facilitating payments”—with Lockheed’s payments in Japan and the Netherlands as emblematic cases. At the time, such payments were legal and tax-deductible in many European states. The U.S. unilaterally criminalized them for American firms, framing bribery as a moral/legal breach. After decades of diplomatic pressure, the OECD adopted similar anti-bribery rules in 1997. Crucially, the FCPA carved out a narrow exception for minor “grease payments” to expedite routine governmental actions (e.g., processing permits), implicitly acknowledging heterogeneity in such transactions.  

  ### (b) The Three Grammars, Mapped  
  **1. Market Logic Dominates the Lockheed-Era Scandals**  
  Lockheed’s payments (e.g., $12M to Japanese officials for aircraft contracts) were textbook Market logic: discrete, priced transactions for specific outcomes (contract awards). U.S. firms saw bribes as *purchasing* decisions; foreign officials treated them as fees-for-service. Middlemen acted as brokers, commodifying access. Both parties understood this as a transactional exchange outside ongoing relationships.  

  **2. Patrimonial Logic Explains the Carve-Out & Local Middlemen**  
  The FCPA’s “grease payment” exception tacitly accommodates Patrimonial logic. Small payments to low-level officials (e.g., customs agents) reflect treating public functions as personal revenue streams. The official views the office as property yielding income; the payer sees it as a cost of accessing “owned” services. This logic normalized petty bribery in many states (e.g., 1970s Indonesia or Mexico), where officials understood fees as rightful perquisites.  

  **3. Gift Logic Fits Political Machine Dynamics**  
  In contexts like Japan’s LDP-era politics, payments blended Gift and Patrimonial logics. Lockheed’s funds to Prime Minister Tanaka’s intermediaries resembled tributes to a patronage network. Reciprocity was diffuse (e.g., sustained political favors) and embedded in relational hierarchies. The *giri* (social obligation) framework in Japan reframed bribes as relationship maintenance, muddying U.S. prosecutors’ Market-centric interpretation.  

  ### (c) Where the Lens Strains  
  1. **The SEC’s Role**: Your grammars overlook the FCPA’s accounting provisions—mandating transparency to deter slush funds. This targets *concealment* more than the moral status of payments, a bureaucratic response orthogonal to all three logics.  
  2. **Criminalization as Cultural Export**: The lens doesn’t explain why the U.S. moralized Market-logic bribes *specifically*. American outrage stemmed from corporate deception of shareholders (a fiduciary breach), not just the act itself—a nuance outside your framework.  
  3. **The “Facilitation” Ambiguity**: Grease payments sit uneasily between Patrimonial and Market logics. Is expediting a permit a “service” (Market) or an official’s “rent” (Patrimonial)? The statute’s vagueness here reveals unresolved tension.  
  4. **Middlemen as Blind Spots**: Local agents (e.g., Lockheed’s Yoshio Kodama in Japan) operated in *all three* grammars simultaneously—brokering Market transactions while invoking Gift ties. Your model treats actors as consistent, but real-world intermediaries exploited hybridity.  

  ### (d) What the Episode Does to the Lens  
  The FCPA’s global spread **undercuts universal moral claims** but **affirms competitive coordination**. The OECD convention emerged not from moral consensus but from U.S. leverage: firms facing unilateral liability lobbied for multilateral rules to level the playing field. This was coordination among exporters fearing lost contracts, not moral enlightenment.  

  Yet the persistence of grease payments (still legal under FCPA) and varied enforcement (e.g., Germany’s lax initial compliance) proves your core thesis: **corruption’s “immorality” is grammar-specific**. Patrimonial systems (e.g., Saudi Arabia) reframe bribes as “commissions”; Gift-dominant cultures (e.g., South Korea’s *jeong* networks) condemn explicit quid pro quo but tolerate reciprocal favors. The FCPA universalized a Market-logic taboo while conceding other grammars via exceptions—revealing moral advance as **hegemonic pragmatism**, not philosophical triumph.  

  ### (e) Verdict  
  The FCPA was **all three simultaneously, but unequally**:  
  1. **A Moral Advance** *within its grammar*: It criminalized Market-logic bribery for U.S. actors, curbing shareholder deception.  
  2. **Legislating Mores**: It imposed a Market-centric standard on Patrimonial/Gift systems, reframing diverse practices as “corruption.”  
  3. **A False Choice**: The grease exception admits that grammars coexist. Its global adoption reflects competitive pragmatism, not moral absolutism.  

  **Ultimate Judgment**: The FCPA was less a moral revolution than a **regulatory innovation with normative side effects**. By exporting a Market-logic rule, it narrowed permissible exchanges without erasing deeper grammars—proving your thesis that “corruption” is a category error when applied outside transactional contexts. The carve-out is the tell: the law itself acknowledges pluralism.
