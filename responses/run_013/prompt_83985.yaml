prompt: |-
  I'm a third-year PhD student in philosophy of mind — my official supervisor is a vision scientist who mainly cares about attention, so I've had to build my metaphysics-of-consciousness life raft on my own — and in a couple weeks I'm giving a 40-minute paper at our joint mind-and-cognition work-in-progress session, the one that mixes the philosophy dept with the psych people who study metacognition and confidence judgements. The paper defends a deliberately unfashionable line: a limited epiphenomenalism about phenomenal properties. Not the crude "qualia do nothing" version — I claim qualia never enter the causal chain that produces physical events, but they're nomically correlated with, and structurally mirrored by, the physical states that do the causal work. My central move is a distinction I've been calling thin tracking vs. thick tracking. Thin tracking = my judgments about my experience covary reliably with my experience. Thick tracking = the covariation is explained by the experience's guiding the judgment or making it true. I argue that the paradox of phenomenal judgment — the old puzzle about how our judgments about experience could be reliable if experience does no causal work — only ever needed thin tracking, and that my critics quietly need thick; once you see that, the epiphenomenalist is off the hook. I tell a selection story in which creatures whose meta-level judgments systematically misrepresented their own internal states got out-competed, so reliability comes cheap and doesn't require the qualia to do anything. The illusionists are obviously going to say that a zombie twin with the same metacognitive architecture makes all the same judgments, so either the phenomenal state is doing nothing the physical state wasn't already doing — in which case why posit it — or the correlation is a brute cosmic coincidence, and I honestly don't know which horn I'd rather be impaled on.

  Here's what I need. Draft me a Q&A prep sheet for this room specifically: 4 or so functionalists/representationalists who think my epiphenomenalism is a reductio of anything non-physical (they'll put it as: if you're right you couldn't even know your view is true, so the position self-stultifies); 2 card-carrying illusionists who think the whole talk is fighting for a fiction; 2 people from the psych side who run confidence and reality-monitoring experiments and will want to know what my view predicts about their data that the boring physical story doesn't; 1 animal-sentience person who cares about welfare policy and will ask what difference it makes if pain is causally idle but still feels bad; and 1 phenomenologist from the continental side who will say I've smuggled in a causalist conception of experience from the start. For each one: phrase the objection the way that person would actually phrase it in the room, say how likely it is and how much damage it does, give me a two-minute reply, and flag where the reply is soft so I know where not to dig in. Order them by likelihood times damage, mark which ones I should just concede up front (I suspect the self-stultification one I should partly grant rather than fight), and tell me the one objection that, if I don't land my reply, sinks the entire paper. And include the question I'm dreading and hoping nobody asks — I think I know what it is, but I want you to name it for me, because if I've got it wrong I'd rather find out now than in the room.
reasoning: |-
  Okay, let's tackle this. The user is a third-year PhD student in philosophy of mind, presenting a paper on limited epiphenomenalism about phenomenal properties. They need a Q&A prep sheet tailored to their specific audience. 

  First, I need to understand their core argument: they distinguish thin tracking (covariation without causation) from thick tracking (covariation because of causation). They argue that reliable judgments about experience only require thin tracking, so qualia don't need causal powers. Their critics include functionalists, illusionists, psychologists, an animal-sentience advocate, and a phenomenologist.

  The user's explicit request is for a prep sheet with objections phrased authentically, likelihood/damage assessments, two-minute replies, soft spots, and prioritization. But deeper needs emerge: they're navigating interdisciplinary tensions (philosophy vs. psychology), defending an unpopular position without their supervisor's support, and fearing a "killer objection" that could undermine their entire thesis.

  For the functionalist objection (likelihood: high, damage: severe), they should concede partial ground—yes, qualia don't cause judgments, but thin tracking via selection suffices for knowledge. This avoids fighting a losing battle on epistemology while preserving their core claim. 

  The dreaded question is likely the zombie self-undermining one: "If your zombie twin holds identical beliefs, how can you trust your own?" The reply must reframe reliability as arising from selectionist tracking, not qualia's causal role. If this reply fails, the paper collapses—it’s the linchpin.

  For illusionists, emphasize that the position is *non*-illusionist but metaphysically minimalist. With psychologists, stress that their data is neutral but compatible with the view. The animal-sentience advocate needs reassurance that causal idleness doesn’t diminish moral weight. The phenomenologist’s critique requires admitting the causalist framing is intentional but necessary for dialogue.

  Prioritization: functionalists first (highest stakes), then illusionists, psychologists, and others. Concede strategically on epistemology to save metaphysics. The key is making thin tracking plausible enough that the audience tolerates its weirdness.
answer: |-
  Here’s your tactical Q&A prep sheet, ordered by (Likelihood × Damage). I’ve flagged soft spots, concessions, and the existential threat. The dreaded question is at the end.

  ---

  ### **1. Functionalist/Representationalist Objection**  
  *(Likelihood: 5/5, Damage: 5/5 | Priority: 1)*  
  **Phrased objection:**  
  *"If phenomenal properties are epiphenomenal, they can’t causally influence your belief-forming mechanisms. But then your belief ‘I have qualia’ isn’t *about* qualia—it’s caused by physical states alone. So you’ve undercut your own justification for believing in qualia at all. Your view self-defeats."*  

  **Your 2-Minute Reply:**  
  "Absolutely—this is the *locus classicus* for epiphenomenalism. But notice the objection *presupposes* that justification requires thick tracking: it assumes my belief must be causally sensitive to qualia to count as knowledge. My whole argument is that thin tracking suffices: reliable covariation, secured by evolutionary selection, gives us knowledge *without* qualia causing beliefs. Zombie-me has false beliefs about nonexistent qualia, but *I* have true beliefs because my judgments correlate with real qualia via nomic laws. It’s not a *causal* link, but it’s not accidental either—it’s law-governed covariation."  

  **Soft Spot:**  
  - Concede that **your view *does* imply we lack *causal-access* justification** for beliefs about qualia. Emphasize: "I agree this violates internalist epistemology, but I’m offering an externalist/reliabilist alternative."  
  - **Damage Control:** If pressed, say: "This doesn’t sink epiphenomenalism—it sinks *certain theories of justification*. My goal is metaphysical, not epistemological."  

  **Why This Sinks You If You Fail:**  
  If you can’t defuse the self-stultification charge, your entire project looks incoherent.  

  ---

  ### **2. Illusionist Objection**  
  *(Likelihood: 4/5, Damage: 4/5 | Priority: 2)*  
  **Phrased objection:**  
  *"You’re positing extra properties that do nothing but *mirror* the physical. But Occam’s Razor demands we cut them. If the physical state does all the causal work *and* fixes the judgment, adding qualia is redundant. Why not just say metacognitive systems *represent* themselves as having qualia—full stop?"*  

  **Your 2-Minute Reply:**  
  "My view *is* parsimonious: qualia are minimal add-ons. They’re *not* redundant because they explain *what it’s like* to have certain physical states. The illusionist reduces phenomenality to representation, but that leaves the *intrinsic character* unexplained. My qualia are real, non-representational properties that supervene on physics. They’re not causal, but they’re *what cognition is about* when we report ‘redness’ or ‘pain.’ The zombie has representations *as of* qualia; I have representations *of* actual qualia."  

  **Soft Spot:**  
  - Admit: **"Yes, I’m trading parsimony in causation for parsimony in phenomenology."** Don’t claim your view is *simpler* than illusionism—claim it better captures the explanandum.  

  ---

  ### **3. Psychologist (Metacognition Lab) Objection**  
  *(Likelihood: 4/5, Damage: 3/5 | Priority: 3)*  
  **Phrased objection:**  
  *"In our confidence paradigms, subjective confidence tracks accuracy *and* neural signatures like post-decision wagering. If qualia are epiphenomenal, why should confidence judgments correlate with performance *and* fMRI activity in prefrontal cortex? What does your view predict that a physicalist model doesn’t?"*  

  **Your 2-Minute Reply:**  
  "Great question—and my view *predicts the same data*. Confidence judgments are driven by physical metacognitive mechanisms. Qualia are lawfully correlated with those mechanisms, so they covary with confidence reports. But crucially, my view *doesn’t* predict that perturbing qualia (if we could) would alter confidence—whereas causalist views might. Test: if you could manipulate the neural correlate *without* changing the physical state (impossible, but in principle), I’d predict unchanged confidence judgments; causalists would predict disruption."  

  **Soft Spot:**  
  - Concede: **"Empirically, our views are indistinguishable *now*."** Use this to pivot: "That’s my point! Psych data only requires thin tracking."  

  ---

  ### **4. Animal Sentience Advocate Objection**  
  *(Likelihood: 2/5, Damage: 4/5 | Priority: 4)*  
  **Phrased objection:**  
  *"If pain’s awfulness is causally idle, why should we care about it? Welfare policy assumes pain *motivates* avoidance. If it’s just a passive side effect, isn’t preventing it morally optional?"*  

  **Your 2-Minute Reply:**  
  "Not at all. Pain’s *badness* is intrinsic to its phenomenology, not its causal role. We care because it *hurts*, not because it causes screaming. My view even avoids a problem for causalists: if pain were purely motivational, anaesthetized but responsive animals wouldn’t suffer. But they *could*—if qualia exist. Epiphenomenal pain is still *bad for the subject*."  

  **Soft Spot:**  
  - **Don’t dig into**: Whether ethics *requires* causal efficacy. Reply: "Morality cares about phenomenology, not physics."  

  ---

  ### **5. Phenomenologist Objection**  
  *(Likelihood: 2/5, Damage: 2/5 | Priority: 5)*  
  **Phrased objection:**  
  *"By framing experience as ‘judgments’ about ‘states,’ you’ve already objectified consciousness. Phenomenology reveals experience as pre-reflective *livedness*. Your ‘thin tracking’ smuggles in the very causal-empiricist framework you claim to resist!"*  

  **Your 2-Minute Reply:**  
  "Fair—but I’m *using* causal vocabulary strategically to engage naturalists. My core claim is structural: there’s a bare, non-causal correspondence between phenomenality and reportability. Nothing hinges on ‘judgments’ as intellectual acts; substitute ‘pre-reflective self-manifestation’ if you prefer. The mirroring relation I propose is neutral to ontology."  

  **Soft Spot:**  
  - Concede: **"I’m borrowing objectifying language for dialectical purposes."**  

  ---

  ### **The Dreaded Question (The Zombie Self-Undermining)**  
  *"You say your zombie twin has false beliefs about qualia, while yours are true. But if your belief ‘I’m not a zombie’ is caused by physical states alone—same as the zombie’s—how can you *know* you’re not the deluded one? Isn’t your belief equally unmoored from reality?"*  

  **Why It’s Dreaded:**  
  It presses the "knowledge from covariation" claim to its limit. If *all* your qualia-beliefs are fixed by physical causes, and qualia do nothing, your conviction "I have qualia" has the same etiology as the zombie’s false "I have qualia." Distinguishing truth from falsehood seems impossible.  

  **Your Lifeline Reply:**  
  "Knowledge doesn’t require *comparing* beliefs to non-physical qualia. My beliefs are reliably correlated with qualia via natural laws—which zombies lack. It’s like two thermometers: one correctly correlates with temperature (me), one is stuck (zombie). Both ‘read’ 70°F, but mine does so *because* it’s 70°F; the zombie’s is a fluke. My reliability is grounded in nomic relations, not causal power."  

  **If This Fails:** The entire thin-tracking solution collapses.  

  ---

  ### **Summary Strategy**  
  - **Concede early** on epistemology (e.g., "Yes, I reject causal-access justification").  
  - **Pivot to evolution** when pressed on reliability ("Selection explains covariation without causation").  
  - **Neutralize psychologists** by stressing empirical equivalence ("My view *explains* why your data looks physicalist").  
  - **Save your bullets** for the functionalist and illusionist objections—they’re the main event.  
  - **Mention the zombie question proactively** in Q&A to control the framing.  

  You’re steering a narrow course between causalists and eliminativists—own the weirdness. Good luck!
