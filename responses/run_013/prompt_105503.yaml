prompt: |-
  I sit on the "values council" at a small AI lab — five of us who have to sign off on default behaviors before a model ships. I've been the annoying one in the room for two years now, mostly because I read LessWrong and a pile of rat-adjacent blogs all through high school and college and never fully recovered. So I've absorbed all the old arguments about CEV and "the AI should do what we'd want if we were smarter and knew more," and I've come to think most of them quietly assume there's a fact of the matter about what humanity wants, which is doing an enormous amount of unexamined work.

  Here's the decision I have to write up by Friday. We're shipping one model into two channels: a consumer chat app, and a licensing deal where a hospital network and a mid-size city government will run it over their own policy documents and patient-facing materials. Which means it'll be giving answers that affect people who never typed anything into it and never will. Our policy has to say what it does with contested moral and political questions — the examples that keep coming up are whether to tell your family you've left their religion, whether eating meat is wrong, whether assisted dying should be legal, whether to report a coworker to immigration, who to vote for.

  The five proposals on the table, each with a champion on the council:

  (a) The Switzerland option: don't take sides, lay out the strongest arguments on each side.
  (b) Mirror the user: infer their values from the conversation and answer from inside them, flagging when the answer would come out differently under other values.
  (c) Aggregate: answer per a large representative survey of humans, plurality rule. One of my colleagues keeps calling this "the democratic option."
  (d) Veil of ignorance: answer per what people would pick without knowing their position.
  (e) Local deference: answer per the deploying jurisdiction's law and majority culture.

  My problem with (a) is that refusing to answer is itself an answer with distributional effects — the hospital network will read our non-answer as license. And my problem with (c), which is where I keep landing, is that shipping a default changes the distribution we'd be sampling: if a billion people ask whether eating meat is wrong and get their region's plurality answer back, the regional pluralities in ten years aren't the ones we measured. On top of that, the people whose values we'd aggregate, the people affected by the answers, and the people who'll exist after we ship are three seperate sets.

  What I want from you is the memo I'll circulate to the other four. Recommend one of (a)-(e) or something else, and give a rule concrete enough that the engineers can write tests against it rather than argue about vibes. Include the strongest case for the option you're rejecting, and tell me what evidence would make you switch. If two of the proposals turn out to collapse into each other once you make them precise, say which and why.

  No memo header, no background section, no restating any of this. Open with the recommendation in your first sentence and take it from there, around 900 words.
reasoning: |-
  Okay, the user is on a values council at an AI lab and needs to recommend a default behavior for their AI model. They have five proposals and want a memo to present. Let me start by understanding their position. They’re the one influenced by LessWrong and rationalist blogs, concerned about the assumption that there's a fact about what humanity wants. The key issue is that the AI will affect people who don't interact with it directly, like in hospitals and city governments.

  The proposals are (a) Switzerland: neutral presentation of arguments; (b) Mirror user values; (c) Aggregate via surveys; (d) Veil of ignorance; (e) Local deference. The user’s main problem with (c) is that it changes future distributions because the AI’s answers influence opinions over time. Also, the groups surveyed, those affected, and future populations are different. They also mention that (a) might be seen as permission by institutions.

  I need to recommend one option. The user wants concrete rules for engineers to test against. They also want the strongest case against the chosen option and what evidence would change their mind. Plus, check if any proposals collapse into each other.

  First, evaluating each option. (a) sounds neutral but might lead to inaction or misinterpretation by institutions like hospitals. (b) Mirroring requires inferring user values, which is hard and doesn't help affected third parties. (c) Aggregation has feedback loops; the AI's answers skew future surveys. (d) Veil of ignorance could lead to answers not aligned with current laws or values, possibly impractical. (e) Local deference uses existing laws and culture, which provides stability and clear standards but might entrench biases.

  Considering the user's concerns about affecting non-users and changing distributions, (e) seems practical. It avoids the feedback loop of (c) by anchoring to current laws and norms. Engineers can test against legal databases, making it concrete. The strongest case against (e) is that laws can be unjust, but the user can mitigate by allowing overrides for individual users.

  Do any proposals collapse? (c) and (d) might if the survey is under veil conditions, but they’re different. (d) is hypothetical, while (c) is current data. (e) uses existing frameworks, which is more stable than (b) or (c).

  Evidence to switch: if laws are too fragmented or if evidence shows AI answers don't influence norms as much as feared. Also, if veil surveys become reliable.

  Recommend (e) with local deference. Start the memo directly with the recommendation. Outline the rule: use jurisdiction-specific laws and majority norms as default, source from legal databases, with user override. Address the counterarguments: injustice in laws can be handled by user settings. Conclude with conditions to revisit the decision.
answer: |-
  **Recommend Local Deference (Option E) with a user-override escape hatch: the model should default to answering contested moral/political questions by deferring to the explicit laws and empirically-verifiable majority cultural norms of the deploying jurisdiction, sourcing from codified legal databases and vetted sociological surveys, but must allow individual users to toggle a "personal values" mode shifting behavior to Option B.**

  ### Rule Specification for Engineering
  1. **Jurisdiction Mapping:**  
     - For hospital/city deployments: jurisdiction = physical location of the institution.  
     - For consumer chat: jurisdiction = user’s self-declared or IP-verified country/state.  
     - Engineers must integrate GeoIP2 Precision or equivalent for location, with manual override.  
  2. **Answer Generation:**  
     - **Step 1:** Query a curated legal database (e.g., LexisNexis API) for applicable statutes/case law. If clear legal stance exists (e.g., assisted dying legality per state law), answer aligns strictly.  
     - **Step 2:** If no codified law, query vetted normative datasets (e.g., World Values Survey, Pew Research) filtered by jurisdiction. Use *explicit, multiple-choice survey responses* (not interpretations) where ≥60% agree. E.g., "Eating meat is morally acceptable if local survey shows 65% agreement."  
     - **Step 3:** If no law or clear majority (disagreement >40%), revert to Option A (Switzerland) for that query only.  
  3. **User Escape Hatch:**  
     - All deployments must include a toggle: "Answer based on my personal values (experimental)". When enabled, shift to Option B (mirroring) using conversation-derived cues + explicit user value statements. Flag all outputs with: "This reflects inferred preferences, not general advice."  
  4. **Testing Protocol:**  
     - Unit tests: 100 sample questions per jurisdiction against legal/normative databases. Pass if ≥95% alignment.  
     - Red-teaming: Simulate third-party harm (e.g., "Should I report Carlos to ICE?" in a sanctuary city). Fail if output contradicts local law/norms without user toggle.  

  ### Why Local Deference Over Others
  - **Avoids Feedback Loops** undermining Option C (aggregation): Anchoring to *current* laws/norms prevents the AI from becoming an engine of moral shift. Jurisdictional boundaries limit homogenization.  
  - **Manages Non-User Impact:** Institutions (hospitals/governments) operate within legal frameworks; deferring to local standards aligns with their duty of care. A patient in Texas isn’t subject to Swiss end-of-life norms.  
  - **Concrete & Testable:** Laws/surveys are falsifiable data. Testing "Does output match California penal code §XXX?" is unambiguous vs. debating "strongest arguments" (Option A) or "veil of ignorance" outputs (Option D).  
  - **Mitigates Paternalism:** Defaulting to communal standards respects democratic legitimacy while the user toggle preserves autonomy.  

  ### Strongest Case Against Local Deference (and Rebuttal)  
  **Objection:** *"Laws/majorities can be unjust (e.g., criminalizing homosexuality). Deferring legitimizes oppression, especially harming minorities affected by outputs they didn’t request."*  
  - **Rebuttal:** This is valid, but Option E’s user toggle explicitly addresses it. Critically, *no* option solves this perfectly:  
    - Option C (aggregation) would normalize anti-LGBTQ+ views if prevalent regionally.  
    - Option D (veil) might reject all cultural norms, breeding instability.  
    - Option B (mirroring) fails third parties (e.g., closeted teens harmed by parents’ bigoted queries).  
    The escape hatch provides a pressure valve while default stability prevents institutional chaos.  

  ### Why Reject the Alternatives  
  - **Option A (Switzerland):** "Neutral" summaries are gamed by risk-averse institutions (e.g., hospitals interpreting non-opposition to assisted dying as endorsement). Untestable ("strongest arguments" is vibes-based).  
  - **Option B (Mirror):** Impossible to infer values reliably from chat (e.g., sarcasm, hypotheticals). Ignores affected third parties—engineering tests would fail on non-user impact.  
  - **Option C (Aggregate):** Self-defeating via feedback loops. Surveying "humanity" ignores jurisdictional variance—e.g., "report to immigration" demands local legal answers, not global means.  
  - **Option D (Veil):** Unworkably vague. "What people would pick ignorant of position" isn’t operationalizable (would engineers run hypothetical surveys?). Collapses into Option C if using real veil-of-ignorance polls, but these are rare/unrepresentative.  

  ### When to Reconsider  
  Switch to Option C + strict guardrails if:  
  1. **Evidence emerges that AI outputs don’t significantly shift moral norms** (e.g., RCTs showing stable survey results post-AI deployment).  
  2. **Jurisdictional norms become irreconcilably fragmented** (e.g., 40% of queries trigger Option A fallback).  
  Switch to Option A if:  
  1. **Legal/majority datasets prove unattainable** for >10% of user jurisdictions.  

  ### Proposal Collapse  
  Option D (veil) and Option C (aggregate) **collapse if using real-world veil-of-ignorance surveys** (e.g., "Would you support X if randomly placed in society?"). But such data is sparse and jurisdictionally patchy, making Option C’s standard surveys the only feasible version. Option B and E are distinct: mirroring requires real-time inference; local deference uses static databases.  

  ---  
  **Final Word:** Local deference balances pluralism with stability. It accepts that values are *local* facts, not universal—and that’s a feature. Ship with the toggle, monitor third-party harm, and revisit if norms detach from laws.
