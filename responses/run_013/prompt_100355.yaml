answer: |-
  ## Ledger-Ghosts

  *(Keeper's hand, steady at first)*  
  We write what the form allows.  
  No clerk set down your laughter's sound,  
  just *Present* or a furrowed brow.  
  We write what the form allows.  

  *(The record's cold voice)*  
  Just *Present* or a furrowed brow—  
  a number where a man had stood.  
  The column holds the *how* and *now*,  
  just *Present* or a furrowed brow.  

  *(The counted one, emerging faintly)*  
  A number where a man had stood  
  before he crossed the workhouse sill.  
  No column held the fatherhood  
  a number where a man had stood.  

  *(The archive's dust, the silence deep)*  
  No column held the fatherhood,  
  the name misspelled, the ship's tight hold.  
  This ink no reader comes to find,  
  no column held the fatherhood.  

  *(Document, keeper, subject merge in absence)*  
  This ink no reader comes to find  
  is not the silence never made,  
  but what the form had no column for.  
  This ink no reader comes to find.  

  *(The loop begins again, the file gapes open)*  
  **We write what the form allows.**  
  This ink no reader comes to find  
  is not the silence never made.  
  **We write what the form allows.**

  ---

  ### Notes on Silence & Structure
  *   **The Four Silences:**
      1.  **Never Written:** "No clerk set down your laughter's sound" (unrecorded life).
      2.  **Erasure by Category:** "a number where a man had stood" (reduced to tally/price/case).
      3.  **Unretrieved:** "This ink no reader comes to find" (record exists, unseen).
      4.  **Omission by Form:** "what the form had no column for" (the gaps within the record itself).
  *   **Form as Argument:**
      *   The pantoum's repetitions force lines to shift meaning. "We write what the form allows" begins as a keeper's neutral statement, ends as a bleak, cyclical truth highlighting systemic constraint. "Just *Present* or a furrowed brow" moves from a simple notation to a symbol of profound erasure.
      *   The final loop back to the opening line ("We write what the form allows") feels like reopening the file, emphasizing the ongoing, unresolved nature of these archival silences – not closure, but renewed confrontation.
  *   **Voices:**
      *   **Stanza 1:** Primarily the record-keeper ("We write...").
      *   **Stanza 2:** The document itself speaking its cold logic ("The column holds...").
      *   **Stanza 3:** The perspective of the person recorded ("before he crossed...").
      *   **Stanzas 4 & 5:** Blurring of voices – the archive's accumulated dust, the keeper's limitation, the subject's absence, the document's mute presence.
  *   **Tone & Imagery:** Plain language focused on the mechanics of record-keeping (form, column, ink, clerk, ledger, number) and absences (laughter unsaid, fatherhood unrecorded, reader absent, missing column). Concrete nouns and active verbs dominate.
