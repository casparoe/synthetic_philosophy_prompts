  We are going to design a new example that avoids the pitfalls of the classical ones. The key is to have a physical setup with a fully specified randomizing mechanism that nonetheless admits two natural descriptions, each leading to a different application of the principle of indifference and hence to different probability assignments for the same event.

  The Setup:

  Consider a circular disk of radius R, fixed horizontally. At the center of the disk, there is a vertical pivot to which a straight, rigid rod of length L (with L > R) is attached. The rod can rotate freely about the pivot. The disk has a fixed radial arm (also attached to the pivot) that extends to the circumference at angle 0. This arm is thin and fixed.

  The experiment is as follows: The rod is spun around the pivot until it is rotating rapidly. Then, we let it come to rest by friction. When it comes to rest, we observe the angle θ between the rod and the fixed arm. Due to the rotational symmetry and the vigorous spinning, we assume θ is uniformly distributed between 0 and 2π.

  The physical question: What is the probability that the rod, when it comes to rest, makes an angle with the fixed arm that is acute (i.e., between 0 and π/2 radians) or equivalently, that the absolute value of the angle is less than π/2?

  This seems straightforward: the total range is 2π, and the favorable range is π/2, so the probability is (π/2) / (2π) = 1/4.

  But wait, is that correct? The angle θ is between the rod and the fixed arm. Since the rod is a line without an inherent direction, we might consider the smallest angle between the rod and the arm. This smallest angle is always between 0 and π. So we should take θ in [0, π). In that case, the favorable event is θ < π/2, and the probability is (π/2) / π = 1/2.

  This is the ambiguity: do we take the full circle [0, 2π) or the directed line segment [0, π)? 

  But let's see the physical setup: when the rod comes to rest, we can measure the angle from the fixed arm to the rod in a specific direction, say clockwise, so we get a value in [0, 2π). But the rod and the arm together define two supplementary angles: θ and 2π - θ. The acute angle is the minimum of θ and 2π - θ, which is always in [0, π]. However, the event of having an acute angle is min(θ, 2π - θ) < π/2, which is equivalent to θ in (0, π/2) or (3π/2, 2π). That is, a total length of π, and the probability is π / (2π) = 1/2.

