    Example: 
        Device: A number X is chosen uniformly in [0, 1]. Then, a number Y is chosen uniformly in [0, X]. 
        Event: What is P(Y < c) for a fixed c in (0,1)?

    This is a conditional probability. Given X, Y is uniform in [0,X], so P(Y<c | X) = 1 if X<= c, and c/X if X>c.
    Then P(Y<c) = integral_0^c 1 * f_X(x) dx + integral_c^1 (c/x) * f_X(x) dx = integral_0^c 1 dx + integral_c^1 (c/x) * 1 dx = c + c [ln(1) - ln(c)] = c - c ln(c).

    But we might also consider the sample space to be the triangle 0<Y<X<1. If we apply indifference to this triangle, then the probability measure is uniform over the triangle. The event Y<c is a region within the triangle: 0<Y< min(X, c) and Y<X<1.
          The area of the event region: integral_{X=0}^c integral_{Y=0}^X dY dX + integral_{X=c}^1 integral_{Y=0}^c dY dX = integral_0^c X dX + integral_c^1 c dX = (1/2)c^2 + c(1-c) = c - (1/2)c^2.
          The area of the triangle is 1/2.
          So the probability = [c - (1/2)c^2] / (1/2) = 2c - c^2.

    This is different from c - c ln(c).

    So we have two answers: c - c ln(c) and 2c - c^2.

    For example, if c=0.5, then 
          first = 0.5 - 0.5*ln(0.5) = 0.5 - 0.5*(-0.6931) = 0.5 + 0.3466 = 0.8466
          second = 2*0.5 - (0.5)^2 = 1 - 0.25 = 0.75

    They are different.

    In this case, the physical procedure is fully specified: first choose X uniform in [0,1], then choose Y uniform in [0,X]. This induces a probability measure on the (X,Y) plane which is not uniform: the density is 1/X for 0<Y<X<1 and 0 otherwise. This is because the joint density is f_{X,Y}(x,y) = f_X(x) * f_{Y|X}(y|x) = 1 * (1/x) for 0<y<x<1.

    The first probability, c - c ln(c), is correct for this measure.

    The second probability, 2c - c^2, comes from (incorrectly) assuming that the measure is uniform over the triangle.

    So the two descriptions are:
        Description 1: The sample space is the set of (X,Y) with 0<Y<X<1, and the probability measure has density 1/X. This is the correct measure from the mechanism.
        Description 2: The sample space is the set of (X,Y) with 0<Y<X<1, and we apply the principle of indifference to this set, treating it as a uniform sample space.

    In Description 2, we are ignoring the fact that the mechanism does not sample uniformly from the triangle.

    Therefore, a defender of the principle might say: the principle should be applied to the mechanism's natural sample space, which in this case is the product space of X and then Y given X. In that space, we have:
          for X, the natural partition is [0,1] with uniform measure.
          for Y given X, the natural partition is [0,X] with uniform measure.
        This leads to the correct probability.

    In the uniform measure on the triangle, the principle of indifference is applied to a different sample space ( the set of points in the triangle) without account for the mechanism's weights.

    So again, the example may not show a within-mechanism ambiguity but a misapplication.

