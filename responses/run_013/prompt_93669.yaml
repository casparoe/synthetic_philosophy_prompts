  Maybe the real issue is defining 'perception' itself. If one side includes attention as part of perception, that changes what counts as penetration. That's the verbal disagreement. Methodologically, ruling out post-perceptual explanations is tough. Even adaptation aftereffects, which are supposed to be low-level, could have attentional components. 

  So, the user's diagnosis seems spot-on. Progress might involve clarifying definitions or finding convergent evidence. But perhaps the deeper issue is that both sides are answering different questions—one about causal influences, the other about content changes. No single experiment can resolve that without shared definitions. 

  The user might also need practical advice for their seminar. How to move the discussion forward? Emphasizing the need for clear criteria and interdisciplinary approaches. Highlighting that the debate might be unresolvable without redefining terms. Maybe suggesting specific readings that frame the debate differently. 

