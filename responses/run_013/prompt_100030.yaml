prompt: |-
  I'm putting together an episode for a tiny philosophy-of-mathematics podcast I run out of my apartment, and next week's guest is a philosopher who's spent the last few years defending a pretty unfashionable line on Thomson's lamp and supertasks generally. Her view, as I understand it, is roughly this: supertasks aren't impossible, and Thomson's lamp isn't really a paradox at all -- it's just a case where there's no fact of the matter about the lamp's state at t=2, and that's genuine indeterminacy rather than contradiction. She thinks Thomson's argument quietly equivocates between "the lamp has no determinate state" and "the lamp has contradictory states." She also leans on a distinction she's fond of between a task being "externally completed" (the world just carries on past t=2 with all infinitely many actions done) versus "internally completed" (the task's own definition pins down a result, say via a limit), and she claims the lamp is externally but not internally completed. I want questions that make her actually work, not just restate all this. So take the role of a philosopher of mathematics who's read alot on infinity, modality, and indeterminacy, and who's also a good interviewer -- start by brainstorming the pressure points in her position before you write anything, then draft eight to ten questions.

  Specifically I'd like at least: one question on whether her indeterminacy is worldly or merely representational, and what's supposed to ground it (is it just the absence of a last toggle, and if so why should that matter?); one on a "continuous lamp" style objection -- could you redesign the toggling as a smooth rotation so there's a well-defined limit, and if so does her external/internal distinction collapse or is it doing real work?; one on whether she's implicitly imposing some convergence or topology requirement on what counts as a determinate outcome, and how she'd justify that choice over another; and one connecting this to the infinite past -- if she's happy with indeterminacy about the lamp, what does that commit her to about whether an infinite past could have been traversed? For each of those, add a follow-up keyed to the answer she's most likely to give, so I don't get stuck when she reaches for the standard reply. After the questions, tell me which ones lean on a contested reading of her view, and which single assumption in my summary of her position you think is most likely to be wrong -- in other words, what would make you throw out and rewrite the whole set. And flag anywhere you're genuinely unsure instead of papering over it. (And yes, I know "supertask" is a mouthful for a podcast title.)
