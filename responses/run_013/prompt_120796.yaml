  First, I need to address the friend's argument. The key point is that for an explanatory factor to cause divergence, it must be present in Britain and absent in China. Since China had abundant coal, coal alone can't explain why Britain industrialized first. The user accepts this but is looking for how to structure a valid explanation now.

  The user's first concern is about alternative explanations. They want to know what factors could explain the divergence if coal is off the table. Possible candidates include institutions (like property rights), cultural factors, geographic specifics, or state policies. But each of these needs scrutiny. For example, institutions like patents might have existed in both places but functioned differently. The user might be seeking not just a list but a framework for evaluating these factors—how they interact, their timing, and why they were decisive in Britain but not China.

  The second concern is theoretical: does the principle that an explanatory factor must be asymmetric mean that explaining Britain's industrialization automatically explains China's lack thereof? Here, the user is probing whether the Industrial Revolution and Great Divergence are the same question. The answer involves distinguishing between necessary/sufficient conditions and path dependency. Britain's industrialization required specific conditions that were present there but not in China. However, China's non-industrialization might involve different factors, like state policies that actively hindered growth or different economic priorities. So the two questions are related but not identical. The user might be interested in understanding causality in historical analysis, especially how multifactorial and contingent factors play a role.

  I should also consider the user's deeper needs. They're part of a reading group, so they likely want a clear, logical framework to present in discussions. They might need to reconcile compelling principles with complex historical realities. The mention of not wanting a literature survey suggests they desire conceptual clarity over summaries. They might also be grappling with how to apply theoretical principles to messy historical contexts without oversimplifying.

  Another angle: the user might be looking for validation that coal still matters but in a different way. Pomeranz's argument isn't just about coal's presence but its accessibility and timing. Highlighting how coal's role is part of a larger system could address the friend's objection without dismissing coal entirely. The user might want to refine their friend's principle rather than discard coal completely.

  Also, the collapse of two literatures into one—addressing whether explaining Britain's industrialization explains China's non-industrialization—requires clarifying that while related, the absence of industrialization in China could involve unique factors. For instance, even if Britain had certain advantages, China might have had different constraints that weren't merely the lack of those advantages but active deterrents. This distinction helps separate the two questions.

  In conclusion, the user needs a structured approach to evaluating divergent factors beyond coal, an understanding of causality in historical divergence, and clarity on whether the two questions are fundamentally linked. Providing a framework that emphasizes interaction of factors, timing, and contingency can help them navigate these issues in their reading group discussions.
answer: |-
  Your friend's principle—that a causal factor must be asymmetrically present—is logically sound *for a necessary and sufficient condition*. However, the Great Divergence debate is rarely about single-factor determinism. Let's address both concerns:

  ### 1. What Explains the Divergence if Coal is "Off the Table"?
  Coal isn't irrelevant, but its role must be reframed. Pomeranz (*The Great Divergence*) argued that **accessibility** and **timing** mattered: Britain's coal was near industrial centers and navigable waterways, while China's major deposits were distant from core economic regions (e.g., Shanxi coal vs. Yangtze Delta). Crucially, coal became decisive *because* it interacted with other factors Britain uniquely possessed:

  - **Institutional Catalysts:** 
    - **Secure property rights & patent systems:** Reduced innovation risk (e.g., Watt's steam engine patent). While China had property rights, enforcement was less predictable for disruptive tech.
    - **Financial institutions:** Liquid capital markets (e.g., Bank of England, joint-stock companies) funded high-risk industrial ventures. China’s financial system prioritized land/mercantile credit over industrial investment.
    - **Parliamentary constraints on taxation:** Limited state predation on capital, unlike Qing fiscal pressures on merchants.

  - **Geopolitical & Geographic Specifics:**
    - **Colonial extractive capacity:** British colonies (especially Caribbean sugar/slave economies) provided "ghost acreage" – massive resource/land offsets without domestic Malthusian pressures.
    - **Navigable waterways & small size:** Lower transport costs enabled national markets; China’s size hindered interregional integration despite canals.

  - **Cultural/Intellectual Factors (Controversial):**
    - **Scientific revolution synergy:** Baconian empiricism and Newtonian mechanics were systematized into engineering practices (e.g., precision instruments for steam engines). China’s technical knowledge remained empirical but less mathematized.
    - **"Bourgeois" values:** Weberian arguments about Protestant work ethic are disputed, but a culture celebrating invention (e.g., Royal Society) may have helped.

  **A valid account thus looks like:** Britain had a *conjuncture* of institutions, geography, and global positioning that allowed coal to be exploited at scale for industry *when it did*. China had coal and sophisticated markets, but lacked this specific synergy. Coal was the accelerant; the institutional and geopolitical tinder was drier in Britain.

  ### 2. Does This Principle Collapse the Two Literatures?
  **No, and here’s why:**

  - **Industrial Revolution (IR) Literature:** Asks, *"Why did sustained, productivity-enhancing industrialization emerge in Britain circa 1780?"*  
    Focus: **Sufficient conditions** – the critical mass of tech (steam, textiles), capital, labor, and demand that ignited self-sustaining growth.

  - **Great Divergence (GD) Literature:** Asks, *"Why did Western Europe (especially Britain) surge ahead of Asia (especially China) in per capita income after 1800?"*  
    Focus: **Comparative asymmetry** – why pre-1800 parallels (e.g., market sophistication, living standards) didn’t lead to similar outcomes.

  **The inference fails in three places:**  
  - **Different counterfactuals:** Explaining China’s non-industrialization requires analyzing Qing policies (e.g., restrictions on maritime trade), internal unrest (Taiping Rebellion), or demographic pressures – factors irrelevant to Britain’s success.  
  - **Path dependency:** Britain’s IR depended on contingent events (e.g., Glorious Revolution, colonial windfalls). China’s stagnation involved distinct constraints (e.g., Confucian exam system diverting talent from commerce).  
  - **Sufficiency vs. necessity:** Factors causing Britain’s takeoff (e.g., cotton imperialism) weren’t *necessary* for industrialization elsewhere (e.g., Japan’s 20th-c. catch-up without colonies). China’s "failure" isn’t just Britain’s success inverted.

  ### A Framework for Good Answers
  1. **Reject mono-causality:** The divergence resulted from a *matrix* of interacting factors.  
  2. **Specify coal’s role:** It’s a *necessary enabler* under pressure (Britain’s wood shortage) but insufficient alone. China had coal but lacked the pressure *and* complementary factors.  
  3. **Embrace contingency:** Timing mattered. Britain’s 17th-c. institutional innovations preceded steam; China faced crises (e.g., 19th-c. rebellions) just as industrialization might have emerged.  
  4. **Avoid Eurocentrism:** China’s economy was sophisticated but optimized for different goals (stability over growth). The "divergence" reflects differing responses to global pressures after 1500.  

  **In short:** Coal remains pivotal in explaining *how* Britain industrialized, but your friend is right that its presence in China shifts focus to why Britain could leverage it uniquely. The IR and GD literatures overlap but address distinct questions – the former on ignition mechanisms, the latter on comparative trajectories. A robust account must navigate this complexity without reducing history to symmetry.
