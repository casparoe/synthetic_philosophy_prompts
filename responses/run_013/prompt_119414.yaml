          1. If the absolute difference between the number of votes for Blue and Green so far is 2 or more, then you should vote with the majority (ignore your own signal).
          2. Otherwise, vote according to your own signal: if you have a Blue signal (Strong or Weak), vote Blue; if Green, vote Green."
     - "Also, before you see the public vote of the people ahead of you, but after you have seen your private signal, you will write on a slip of paper what you think the true state is based solely on your private signal. Do not share this. Fold it and hand it to the facilitator (or put it in the center) immediately after writing. This is your private read."
     - "We will start with participant 1 at each table. Participant 1: open your envelope, read your signal, write your private read (just the color you think it is, based on your signal) on a slip and hand it in. Then publicly announce your vote. Remember, participant 1 has no history, so by the rule, you vote your signal."
     - Then participant 2: open their envelope, write their private read and hand in, then see participant 1's vote and then publicly vote.
     - And so on, up to participant 8.
     - After the last vote, the facilitator reveals the true state (Blue) and scores: each participant who voted Blue gets 1 point.
     - Then, the facilitator reveals that both tables had the same set of signals (reads out the list of signals for each table). Point out that Table 1 cascaded to Green and was wrong, Table 2 to Blue and was correct, and the only difference was the order of signals.

     Round 2 (15 minutes)
     - "In this round, the true state is also Blue. The rules are the same as Round 1, including the voting rule and the private read slips."
     - Distribute the Round 2 envelopes (both tables have the same signals in the same order: [WG, WG, SB, WB, SG, WB, SG, SB]).
     - Run the round similarly: each participant writes their private read before seeing the public votes and then votes publicly.
     - After the round, reveal the true state (Blue) and score.
     - In the debrief, we will highlight that the third person (with Strong Blue) broke the cascade (which was starting with two Weak Greens). And we will note that if they had a Weak signal, they would have followed.

     Round 3 (15 minutes)
     - "In this round, the rules change. The true state is irrelevant. Instead, at each table, one person is randomly assigned as the 'senior' (we'll draw lots). Your goal is to match the senior's public vote. You get 1 point if your public vote matches the senior's public vote."
     - Assign the senior: for simplicity, we assign by participant number. At each table, say participant 1 is the senior.
     - "The senior votes first. The senior should vote based on their private signal (as in Round 1) since they have no one to match. Then the next person votes: they see the senior's vote and want to match it. And so on."
     - "Note: there is no 'true state' in this round. The only thing that matters is matching the senior's vote."
     - Distribute the Round 3 envelopes (use the same signals as Round 1 for Table 1, for example, but the order doesn't matter because the cascade will be driven by the senior). 
     - Do not reveal any true state.
     - Run the round: no private reads (since there's no true state). 
     - After the round, score: for each participant, 1 point if their vote matches the senior's vote.

     Debrief (25 minutes)
     We go through the four moments and map to the rounds.

     (a) Same evidence, opposite conclusions: Round 1. Both tables had the same evidence, but due to order, one cascaded to the wrong answer.

     (b) Information present but unused: Round 1 private reads. We collected private reads from every participant. For Table 1, we can see that the later participants (e.g., from P3 onward) had private reads that were Blue (because their signals were Blue) but they voted Green. We can count: in Table 1, how many private reads were Blue? (We had 4 Blue signals: WB, WB, SB, SB -> 4, and 4 Green) but the private read: they should have written what they thought based on their signal. For a Weak Blue, they might write Blue? For Strong Blue, definitely Blue. But note: in Round 1, the rule for private read: based solely on their private signal. So for a Weak signal, they might be unsure, but we didn't give them a choice to say unsure. We can instruct: "write the color you think is more likely based only on your signal". With a Weak Blue, they should write Blue (because even a Weak Blue is more likely in the true state of Blue). 

     But we didn't specify the probabilities. We can say: "if you get a Blue signal (Weak or Strong), you should think Blue is more likely; similarly for Green." 

     So in Table 1, the private reads should be:
          P1: SG -> Green
          P2: SG -> Green
          P3: WB -> Blue
          P4: WG -> Green
          P5: SB -> Blue
          P6: WB -> Blue
          P7: WG -> Green
          P8: SB -> Blue

     So we have 4 Blue private reads and 4 Green. But in the public vote, all voted Green. So the four Blue private reads were never expressed.

     (c) What it takes to break a run: Round 2. The first two had Weak Green -> voted Green. The third had Strong Blue -> broke the rule? Actually, by our rule for Round 2 (same as Round 1): 
          Vote difference after two: Green has 2, Blue 0 -> difference=2 -> so normally they would follow. But we said a Strong signal can break a cascade? We didn't change the rule. 

     We have a problem: in Round 1 and 2, we used the same rule: ignore your signal if the vote difference>=2. In Round 2, the third person had a Strong Blue, but by the rule they should have voted Green. 

     This is a failure. We need to adjust.

     We can change the rule for all rounds to: 
          "If the vote difference is at least 2, then you must vote with the majority, unless you have a Strong signal for the minority and the vote difference is exactly 2. In that case, you vote your signal."

     But that's complicated.

     Alternatively, in the debrief of Round 2, we can ask the third person: "Why did you vote Blue?" and they might say: "Because I had a Strong Blue and I thought it was stronger than the two before." Then we can say: "That's rational. In fact, two Weak Greens are only worth 2 points, and a Strong Blue is worth 2 points, so it's a tie. But the rule we gave you said to follow the majority when the difference is>=2. However, in reality, it's not always that simple."

     But we want to avoid complex explanations.

     Given the time, we can modify Round 2 to not use the mechanical rule? We can rely on them to vote rationally. We can remove the mechanical rule and say: "Vote for what you think is the true state, given your signal and the history of public votes." 

     Then in Round 1, we design the signals so that a cascade forms naturally. In Round 2, we design so that the third person breaks it because they have a Strong signal. 

     This is risky because they might not cascade in Round 1. But with the signals we have for Table 1 (first two Strong Greens), the third person with Weak Blue would see two votes for Green. They know that the first two might have had Strong signals. They might vote Green even if they have a Weak Blue. 

     For Round 2: with two Weak Greens and then a Strong Blue, the third person might think: two Weak Greens are not as strong as one Strong Blue? So they vote Blue. 

     We can hope.

     Revised plan for voting: 
        We do not give a mechanical rule. We simply say: "Your goal is to be correct. Vote for the color you think is more likely given (1) your private signal and (2) the history of public votes."

     We then design the signals for each round to produce the desired effect.

     Round 1 signals for Table 1: [Strong Green, Strong Green, Weak Blue, ...]. 
        P1: Strong Green -> votes Green.
        P2: Strong Green -> votes Green.
        P3: Weak Blue -> what will they do? They know that the first two might have had Strong signals. The probability of two Strong Greens if the state is Green is high, if Blue is low. They might vote Green.

     Similarly, for Table 2: [Strong Blue, Strong Blue, ...] -> cascade to Blue.

     Round 2: both tables have [Weak Green, Weak Green, Strong Blue, ...]
        P1: Weak Green -> votes Green.
        P2: Weak Green -> votes Green.
        P3: Strong Blue -> might vote Blue because they know the first two were Weak and their own is Strong.

     This is more realistic. And it doesn't require a rule.

     We'll do it this way.

     So remove the mechanical rule.

     Instructions for voting in Rounds 1 and 2: 
          "When it is your turn, after you have seen your private signal, you will write your private read on a slip (Round 1 and 2 only). Then, after you have seen the public votes of the people before you, you will publicly announce your vote for either Blue or Green. Your vote should be for the color you think is more likely to be the true state, given your private signal and the public votes so far."

     We'll rely on the signal design to induce the cascade.

     For the signals, we need to specify the distribution to them? Otherwise, how do they update?

     We can explain the distribution at the beginning:

        "The true state is either Blue or Green, with equal probability. The private signals are generated as follows:

          If the true state is Blue:
            - Probability of Strong Blue: 40%
            - Probability of Weak Blue: 40%
            - Probability of Strong Green: 10%
            - Probability of Weak Green: 10%

          If the true state is Green:
            - Probability of Strong Green: 40%
            - Probability of Weak Green: 40%
            - Probability of Strong Blue: 10%
            - Probability of Weak Blue: 10%"

     This is symmetric. This allows Bayesian updating.

     But then they have to calculate. We want to avoid that.

     Alternatively, we can give them a card with the likelihoods:

          Signal      | P(signal|Blue) | P(signal|Green)
          ---------------------------------------------
          Strong Blue |      0.4       |      0.1
          Weak Blue   |      0.4       |      0.1
          Strong Green|      0.1       |      0.4
          Weak Green  |      0.1       |      0.4

     And tell them: "You can use this to update your beliefs."

     But that might be too much.

     Given the time, we might have to accept that some will try to calculate and it might take more than 2 seconds. But we hope that for the first few, it's intuitive: 
          Strong signal for the true state is more likely.

     For the third person in Round 1 at Table 1: 
          They have a Weak Blue.
          They see two votes for Green.
          They know that the first two had private signals. The probability that the first vote is Green given the state is Blue: P(V1=Green|Blue) = P(Strong Green or Weak Green|Blue) = 0.1+0.1=0.2.
          Similarly, P(V1=Green|Green)=0.4+0.4=0.8.
          But they also know that the first person voted based only on their signal. The second person voted based on their signal and the first vote. This is getting complex.

     This is the classical cascade setup and it does require computation for a full Bayesian.

     Given the constraints, I think we have to hope that the cascade happens naturally. In practice, in such experiments, cascades do happen because people assume that the earlier voters had good reasons.

     We'll go with the urn story without computation, trusting that the first two Strong signals will cause the third to follow.

     So we won't give the probabilities. We will only say: 
          "A Strong signal is a strong indicator of the true state. A Weak signal is a weaker indicator."

     And then let them decide.

     Now, the debrief for Round 2: 
          We will ask the third person why they voted Blue. They will say because their Strong Blue was stronger than the two Weak Greens they inferred from the first two votes? We can then explain that it was rational.

     For the fourth person in Round 2: they see two votes for Green and one for Blue. If they have a Weak signal, they might be swayed.

     It might not go exactly as planned, but we can still debrief the intention.

     Failure modes and fallbacks:

     - The cascade failing to form because the early signals disagree.
          In Round 1, if the first two signals are different, then no cascade. We design the signals to avoid this.

     - One table cascades and the other not.
          In Round 1, we designed the signals to cascade at both.

     - The tables overhearing each other's votes.
          We run them in separate areas of the room or ask them to keep quiet.

     - Someone breaking the run for a joke.
          We emphasize this is a serious exercise.

     - Tables finishing at very different speeds.
          We have a facilitator at each table? Or we can have a time limit per vote (say 30 seconds).

     - Someone recognizing the setup.
          We can't prevent that, but we ask them not to spoil.

     - Reputational round landing badly.
          We emphasize that the senior is randomly assigned and fictional.

     Honest limits:
          - The activity cannot perfectly reproduce the Bayesian updating without computation.
          - The private reads might not be perfectly Bayesian if we don't give the probabilities.
          - In the reputational round, we cannot recreate the exact pressure of real seniority.

     Run sheet with approximate timing:

     0-5 min: Introduction
     5-20 min: Round 1
     20-35 min: Round 2
     35-50 min: Round 3
     50-75 min: Debrief

     Due to the complexity, we might run over. We can cut the number of participants per table to 6? With 18 people including you, we have 17 participants. That's not divisible by 2. We can have two tables of 8 and one of 1 (you)? Or ask one person to sit out? Or have tables of 8 and 9? 
     Let's do two tables of 8 and you facilitate. So 16 participants.

     Detailed instructions for each round:

     Round 1:
        - "This round has a true state of either Blue or Green. It has been fixed. Your goal is to vote for the true state. You earn 1 point for a correct vote."
        - "You will vote in order, from 1 to 8. When it is your turn, open your envelope and look at your private signal. Do not show it to anyone."
        - "Before you see the public votes of the people ahead of you, write on a slip of paper your private read: which color do you think it is based ONLY on your private signal? Fold it and hand it to me."
        - "Then, after you have seen the public votes of all the people before you (I will show you the history), you publicly announce your vote for either Blue or Green. I will record it."
        - "Participant 1, you are first: open your envelope, write your private read and hand it to me, then announce your vote."

     Then participant 2: 
          Open envelope, write private read and hand in, then see the public vote of participant 1, then announce vote.

     And so on.

     After the last vote, reveal the true state (Blue) and award points. Then reveal that the two tables had the same set of signals (list the signals).

     Round 2: 
        - Same as Round 1, but with new signals. True state is Blue.
        - Run the same procedure.

     Round 3:
        - "In this round, the true state is irrelevant. Instead, we have assigned a 'senior' person at each table. For this exercise, the senior is participant 1 at your table."
        - "Your goal is to match the senior's public vote. You get 1 point if your public vote matches the senior's public vote."
        - "The senior will vote first. The senior should vote based on their private signal (since there's no one to match). Then the next person votes: they see the senior's vote and then vote what they think will match the senior's vote."
        - "There are no private read slips in this round."
        - Run the voting in order.

     Debrief script:

     - Start with Round 1: 
          "In Round 1, Table 1 ended up voting Green, Table 2 Blue. The true state was Blue, so Table 1 was wrong. But both tables had the same set of signals. The only difference was the order. In Table 1, the first two signals were Strong Green, and then everyone followed. In Table 2, the first two were Strong Blue, and everyone followed. This is an information cascade. The later voters ignored their own signals and followed the crowd."

     - Show the private reads from Table 1: 
          "In Table 1, we collected private reads. How many of you in Table 1, after seeing your private signal, thought it was Blue? (Count the private read slips). But in the public vote, you all voted Green. So your private information was never expressed."

     - Round 2: 
          "In Round 2, we had a cascade start with two Weak Greens. Then the third person had a Strong Blue and voted Blue. Why? Because their own signal was strong enough to outweigh the two Weak signals they inferred from the first two votes. But if they had a Weak signal, they might have followed."

     - Round 3: 
          "In Round 3, we changed the incentives. You were no longer trying to be right, but to match the senior. We saw a cascade form again, but this time driven by the desire to conform to the senior's opinion. The behavior looked the same as in Round 1, but the engine was different."

     - Then hit the points:
          (i) A consensus can be confident and nearly empty of information -> Round 1 Table 1: everyone was confident in Green, but half the signals were Blue.
          (ii) Whether things go right or wrong is close to a coin flip decided by who spoke first -> Round 1: if the first two happen to be Strong for the wrong side, the whole table is wrong.
          (iii) Following the crowd is usually the sensible move -> in Round 1, for the third person in Table 1: with a Weak Blue and seeing two Strong Greens (inferred), it is rational to follow. The silence of those who privately disagreed is not stupidity.
          (iv) The same silence can be produced by an incentive that has nothing to do with being right -> Round 3: even if you had a Strong signal for the opposite, you might vote with the senior to get the point.

     - Address the uncomfortable part: "In many cases, following the crowd is the rational choice. It's not necessarily a failure of nerve. But it can lead to the group being wrong. And when the incentive is to conform to authority, the behavior looks the same but requires a different fix."

     Closing: 
          "In our team, we make decisions in sequence. We've seen how early votes can drown out later information, and how incentives can drive conformity. To improve, we might seek independent opinions, use anonymous votes, or be aware of authority gradients. But today, I hope you felt from the inside how these dynamics work."

     This is a long design, but it fits the requirements as well as possible within the constraints.
answer: |-
  ### Information Cascade Workshop: Run Sheet  
  **Total Time:** 75 minutes  
  **Participants:** 18 (split into 2 tables of 9)  
  **You:** Facilitator  
  **Materials per Table:**  
  - 9 sealed envelopes (1 per participant) with private signals for each round  
  - Blank slips + pens for private notes  
  - Whiteboard/shared doc to record public votes  
  - Deck of playing cards (optional: to randomly assign order/seniority)  

  ---

  ### **Introduction (5 min)**  
  *Goal: Frame the exercise without spoiling the mechanics.*  
  **Script:**  
  *"We’re about to play a short team decision-making game. Each round, you’ll get a private clue about a hidden truth—either BLUE or GREEN. You’ll vote in sequence, seeing only the public votes ahead of you. Your goal: earn points by voting correctly. Two rules: 1) No talking, no showing clues. 2) Vote based *only* on your clue and the public votes. The winning table gets bragging rights. Ready? Let’s start."*  

  ---

  ### **Round 1: Cascades & Unused Evidence (Moments a + b)**  
  **Time:** 20 min  
  **Setup:**  
  - Tables get identical signal sets but in different orders. **True state: BLUE**  
    - *Table 1 (Cascade to WRONG):* [STRONG GREEN, STRONG GREEN, WEAK BLUE, WEAK GREEN, STRONG BLUE, ...]  
    - *Table 2 (Cascade to RIGHT):* [STRONG BLUE, STRONG BLUE, WEAK GREEN, WEAK BLUE, STRONG GREEN, ...]  
  - **Signals explained:**  
    - 💪 STRONG = "Very reliable" (e.g., "If true state is BLUE, STRONG BLUE is likely")  
    - 😐 WEAK = "Somewhat reliable" (e.g., "If true state is BLUE, WEAK BLUE is >50% accurate").  

  **Instructions (Read Aloud):**  
  *"In this round, the true state is fixed. You’ll vote one-by-one. Before seeing others’ votes, write your ‘private guess’ (based SOLELY on your clue) on a slip. Seal it. Then, vote publicly. Scoring: 1 point if your public vote matches the truth."*  

  **Process:**  
  1. Participants open envelopes in order (P1 → P9).  
  2. Write/seal private guess → Hand to you.  
  3. See prior public votes → Announce vote (you record).  
  4. **After final vote:** Reveal true state (BLUE).  
  5. Show signals from both tables: *"Same clues, different outcomes due to order."*  

  **Key Debrief Prep:**  
  - Save sealed guesses to open later (moment b).  

  ---

  ### **Round 2: Breaking the Run (Moment c)**  
  **Time:** 15 min  
  **Setup:**  
  - **True state: BLUE**  
  - Signals for both tables (same order):  
    [WEAK GREEN, WEAK GREEN, **STRONG BLUE**, WEAK BLUE, ...]  

  **Instructions (Read Aloud):**  
  *"Same rules. Goal: Vote correctly. Remember: STRONG clues outweigh multiple WEAK ones."*  

  **Process:**  
  - Run voting as before.  
  - **After round:** Reveal true state. Highlight P3’s vote.  
    - *"P3 broke the cascade with STRONG BLUE. If it were WEAK BLUE, following would be rational."*  

  ---

  ### **Round 3: Reputational Incentives (Moment d)**  
  **Time:** 15 min  
  **Setup:**  
  - Assign a random "senior" at each table (use playing cards to draw numbers).  
  - **Signals:** Mixed (e.g., [STRONG GREEN, WEAK BLUE, ...]).  

  **Instructions (Read Aloud):**  
  *"New rule: Points for matching the SENIOR’S public vote. No truth—*just mimic the senior*. Clarifying: NO REAL JUDGMENT. This is fictional."*  

  **Process:**  
  - Senior votes first (based on their clue).  
  - Others vote sequentially (aiming to match senior).  
  - **After round:** *"Did your behavior feel similar to earlier rounds? Why?"*  

  ---

  ### **Debrief (20 min)**  
  **Map Observations to Insights:**  
  1. **Confident but empty consensus (i):**  
     - *"Round 1: Both tables voted unanimously. Table 1 was wrong despite holding 4 BLUE clues. The consensus was loud but hollow."*  
     - **Visual:** Open sealed guesses from Round 1. Show unused BLUE votes at Table 1.  

  2. **Order decides outcomes (ii):**  
     - *"Table 1’s first two saw GREEN → cascade. Table 2’s first two saw BLUE → cascade. Flip a coin for who speaks first, flip the outcome."*  

  3. **Following is rational (iii):**  
     - *"In Round 2, P1/P2 voted GREEN. If P3 had WEAK BLUE, following would be smart—their clue wasn’t strong enough to override two votes. Silence isn’t cowardice; it’s math."*  

  4. **Identical behavior, different engines (iv):**  
     - *"Round 3 mimicked Round 1’s unanimity, but you were matching authority, not truth. Same silence, different cause."*  

  **Address Discomfort:**  
  - *"When the crowd aligns with reality, following is wise. But when early votes are wrong? We discard good clues. And if we’re *rewarded* for compliance? We get silence either way. The fix isn’t shaming followers—it’s designing decision structures that surface private clues."*  

  ---

  ### **Failure Modes & Fixes**  
  1. **Cascade doesn’t form (e.g., early signals clash):**  
     - *Fix:* Use STRONG signals for first two votes (as designed). If still fails, note: *"Real cascades aren’t inevitable—but likely when early votes agree."*  

  2. **Tables overhear votes:**  
     - *Fix:* Space tables apart; emphasize silence. If breached: *"Contamination happens. What did we learn?"*  

  3. **Reputational round triggers discomfort:**  
     - *Fix:* Explicitly state *"fictional senior"* twice. If tension: *"This simulates incentives, not reality."*  

  4. **Someone breaks the run as a joke:**  
     - *Fix:* Pre-brief: *"Play seriously—your team’s points depend on it."*  

  5. **Recognition of setup:**  
     - *Fix:* Acknowledge: *"Some may know cascades. Focus on feeling it, not the math."*  

  ---

  ### **Honest Limits**  
  The activity **cannot** perfectly replicate:  
  - How seniority *actually* feels (simulation lacks power dynamics).  
  - Long-term consequences of silence (e.g., psychological safety erosion).  
  - Nuanced signal strengths (we simplify to STRONG/WEAK).  
  **→ You’ll need to verbally connect to real work:**  
  *"In our code reviews, design meetings, or incident post-mortems, early votes/judgments can drown out clues. We default to ‘reading the room.’ How might we redesign to surface private info?"*  

  ---

  ### **Closing (5 min)**  
  **Script:**  
  *"Today, we felt how:  
  - Consensus can be confident and wrong.  
  - Order trumps evidence.  
  - Following is often rational.  
  - Authority can masquerade as truth.  
  Tomorrow, we might:  
  - Seek private input *before* public votes.  
  - Anonymize early opinions.  
  - Reward dissent.  
  Thanks for playing. Remember: Good engineers spot hidden feedback loops."*  

  ---  
  **Total:** 75 min. Prize to winning table (e.g., "privilege of leaving first").
