answer: |-
  Here are the Terms and Conditions for the **Civic Priority Program (CPP)**:

  1.  **Enrollment & Tier Status:** Membership is automatically conferred based on verified GPS coordinates at birth, establishing your base loyalty tier ("Essential Patriot"). Naturalized citizens receive the "Elective Ally" tier upon completion of mandated procedures, acknowledging their distinct selection process compared to non-consensual birth enrollment.
  2.  **Benefit Scope & Jurisdiction:** Accrued partiality benefits apply exclusively within the Program's designated territorial boundaries, defined by internationally recognized historical artifacts ("borders"); requests to extend priority to adjacent counties, provinces, or continental regions based on identical moral logic are expressly invalid.
  3.  **Contribution & Eligibility:** Priority accrual derives from participation in the shared national cooperative scheme; however, members failing to contribute (e.g., via taxation or public service utilization) retain full tier benefits ("Legacy Status"), while non-members contributing materially to the scheme (e.g., via taxation) are ineligible for accrual, holding only courtesy "Guest" status.
  4.  **External Obligations:** Program benefits entail no direct redeemable value for non-members; external moral considerations are fulfilled via the separate, capped "Global Courtesy Allocation," fixed at 0.7% of the Program's cumulative partiality points pool, non-transferable and subject to administrative discretion.
  5.  **Value & Redemption:** Partiality points possess no intrinsic material value and exist solely to quantify the relational priority owed between enrolled members; redemption occurs automatically within the Program zone, generating no tangible claim beyond the pre-existing relational framework they instrumentally measure.

  **Why this avoids strawmanning and hits the requested points:**

  *   **Birth vs. Choice (Clause 1):** Explicitly contrasts automatic birth enrollment ("non-consensual") with naturalization ("Elective Ally"), making the family analogy awkward both ways without stating it. The different tiers highlight the inconsistency.
  *   **Arbitrary Borders (Clause 2):** Directly addresses the core arbitrariness ("historical artifacts") and rejects extending the logic logically to other geographical units ("adjacent counties, provinces, or continental regions").
  *   **Fair-Play Contradiction (Clause 3):** Clearly states the fair-play basis ("shared national cooperative scheme") but then immediately highlights its failure: non-contributing members keep benefits ("Legacy Status") while contributing non-members are excluded ("Guest" status). This exposes the logical hole.
  *   **Capped External Obligations (Clause 4):** Mocks the minimal aid commitment by tying it directly to the partiality pool ("0.7%... non-transferable") and using bureaucratic terms ("Global Courtesy Allocation," "administrative discretion"), highlighting its tokenism.
  *   **Begging the Question & Circularity (Clause 5):** This is crucial. It states the points *only* measure the pre-existing relational priority ("quantify the relational priority owed"). They don't *create* the obligation; they merely *instrumentally measure* it within the framework that assumes it. This reveals the foundational circularity: the program exists to reward the very partiality it presupposes as the basis for the program. It "cannot be redeemed for material value," showing its lack of independent justification.
  *   **Deadpan & Fine Print:** The language mimics sterile legal/contractual jargon ("verified GPS coordinates," "internationally recognized historical artifacts ('borders')", "courtesy 'Guest' status," "instrumentally measure") without winking at the reader.
  *   **Butt is the Idea:** The satire emerges solely from the logical extensions and contradictions inherent in the nationalist position itself, not from mocking nationalists. The clauses force the nationalist premise into uncomfortable, indefensible positions using its own logic.

  This structure follows your constraints precisely and pushes the core arguments to their uncomfortable, self-contradictory conclusions, particularly the circularity exposed in Clause 5, without resorting to caricature.
