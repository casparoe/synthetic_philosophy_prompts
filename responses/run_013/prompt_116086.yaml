prompt: |-
  Alright, I need you to build me a case, not survey the literature. Background: a friend and I argue about when something is a moral preference — the person is just built that way and it's theirs to have — versus a moral bias, which we get to call a distortion and try to talk them out of. There are two tests people keep reaching for and I've noticed they come apart, so I want a scenario where they really do.

  Origin test: it's a bias if the person would disavow the disposition on learning how they came by it (bad source, contempt they absorbed as a kid, that kind of thing), and a preference if they'd stand behind where it came from.
  Tracking test: it's a bias if it doesn't actually answer to the moral facts — survives only by being insulated from counterevidence, overgeneralizes from one salient feature, that sort of thing; a preference if it holds up when you push on it and latches onto something real.

  Then my own criterion, which I'm not at all confident about: call a disposition structural if it changes what the person owes other people or how they're allowed to be treated, and private if it only governs how they run their own life. My hunch is the preference/bias line is really the structural/private line and the other two tests are red herrings. So build the case so all three come apart: bias by origin, preference by tracking, private by my criterion.

  Constraints: ordinary life, one paragraph, no brainwashing or cult deprogramming, no case that turns on the person being factually wrong about the world (too easy), and the tracking verdict has to come out of the disposition's actual behaviour under pressure, not from me just asserting it's correct. Also dont hand me a bibliography — no names, no papers, I won't read them.

  Then do the work: derive what each test says and why (don't stipulate the verdicts, I want to see them fall out), tell me which test is actually carrying the case and wether my hunch survives contact with it, say what happens to the case if you make the origin respectable, and give me the strongest line of attack from someone who thinks the tracking test should win. Finish with whether preference vs bias is one distinction or three wearing one name. And if you think the three verdicts can't come apart, say so and show me why — I'd rather have that than a fudged example.
reasoning: |-
  Okay, let me try to unpack this user request. They want a clear case study where three different tests for distinguishing moral preferences from biases produce conflicting results. The challenge is to create an ordinary-life scenario that meets all their constraints while making the theoretical conflict visible.

  First, I need to understand the three tests thoroughly:
  - Origin test: Would the person disavow the disposition if they knew its source?
  - Tracking test: Does the disposition hold up under evidential pressure and latch onto moral reality?
  - Structural/private test: Does it affect how others must be treated or only govern personal choices?

  The user suspects the real distinction is structural vs private, not preference vs bias. They want a scenario where:
  1) Origin test says "bias" (disavowable source)
  2) Tracking test says "preference" (survives scrutiny)
  3) Structural/private says "private" (only affects self)

  Constraints are tricky: no extreme cases, no factual errors, must show tracking through behavior, no citations. Ordinary life setting.

  Hmm... what common situations involve strong personal rules that seem irrational but hold up to questioning? Food ethics comes to mind - someone with an intense aversion to eating mammals but not other animals. 

  Developing the character: Meet Sam, who refuses to eat any mammal meat but consumes poultry/fish freely. The origin is childhood trauma - saw slaughterhouse footage of cows but not chickens. Under origin test, this would be disavowable. 

  For tracking test, Sam must demonstrate reasoned defense: argues mammals have complex social bonds, distress signals, etc., consistently applying this framework when challenged about pigs vs octopuses. This shows the disposition tracks moral facts.

  Structural/private test: Sam never imposes this on others, only governs own plate. So private.

  Checking constraints: 
  - Origin is "bad" (trauma-based) but not brainwashing 
  - Tracking shown through dialogue not assertion 
  - No factual errors about animal cognition 
  - Entirely ordinary context

  Now to derive verdicts properly:
  - Origin: Sam would drop it knowing it stemmed from random childhood exposure -> bias
  - Tracking: Withstands challenges about consistency -> preference
  - Private: Only affects self -> aligns with user's "preference" hunch

  The case reveals: 
  - Origin and tracking conflict as requested 
  - Structural/private aligns with tracking verdict here
  - But user's hunch might not hold if we found structural preferences with bad origins

  Strongest attack: A tracking purist could argue Sam's distinction is still arbitrary (why not intelligence-based?) so it's not truly tracking. But Sam's consistency defends against this.

  Final reflection: Preference vs bias isn't one distinction but context-dependent. The tests answer different questions - about genesis, epistemic status, and social scope. 

  This seems to satisfy all requirements while revealing deeper complexities about moral psychology. The ordinary dinner table setting makes the philosophical conflict feel tangible.
answer: |-
  Here's the case, derived step by step within your constraints:

  **Scenario:** Erin has a visceral refusal to ever accept financial help from anyone, even in dire need (job loss, medical crisis). This stems from childhood experiences where her parents weaponized "gifts" to control her ("We paid for your camp, so you owe us obedience"). She articulates a coherent principle: "Monetary assistance inherently creates exploitable power imbalances that corrupt relationships and undermine autonomy. It degrades both giver and receiver." When challenged, she defends it robustly: she acknowledges counterexamples (disaster relief, non-coercive small loans between equals) but distinguishes them, arguing systemic aid or contracts lack the *personal* power dynamic she condemns. She applies it consistently, refusing help from friends or charities alike, but never demands others live by this rule – she happily gives money freely, seeing it as *her* choice without obligation. Her life is harder, but self-directed.

  **Derived Verdicts:**
  1.  **Origin Test (Bias):** Learning her stance originated from toxic parental manipulation (using money as control) would likely make Erin disavow it. The source (childhood trauma/conditioning) is normatively "bad" and non-endorsable; she'd see her principle as a scar, not a chosen value. **→ Bias.**
  2.  **Tracking Test (Preference):** Erin's disposition *answers to moral facts*. It withstands pressure: she engages counterevidence (distinguishes systemic aid), doesn't overgeneralize (focuses on *personal* dynamic, not money itself), and latches onto something arguably real (the *potential* for power imbalance/obligation in personal monetary gifts). Its robustness comes from her reasoning, not insulation. **→ Preference.**
  3.  **Structural/Private Test (Private):** Erin's rule governs *only her own acceptance* of help. It changes what *she* owes others (nothing, after a gift) only in her own conduct; she imposes no duties *on others* regarding giving/receiving. It doesn't dictate how others may treat *her* beyond respecting her refusal. **→ Private.**

  **Which Test Carries the Case?** The **Tracking Test** carries the decisive weight for the "preference" verdict in the core argument. Its verdict emerges from Erin's *demonstrated reasoning under challenge* (handling counterexamples, consistent application), fulfilling your requirement that tracking be behavioral, not asserted. The Origin verdict, while clear, is secondary evidence about source, not current epistemic status. Your Structural/Private verdict aligns with Tracking here, but isn't driving the core preference/bias distinction *in this case*.

  **Does Your Hunch Survive?** **Partially, but challenged.** Here, Tracking (Preference) and Structural/Private (Private) align, seemingly supporting your hunch that "private = preference". However, the *Origin test* dissents sharply (Bias), showing the tests *can* come apart. Crucially, your hunch might fail if we found a *structural* disposition that tracked truth (e.g., a consistently defended, evidence-responsive principle about owed care for parents) with a "bad" origin – it would be Preference (Tracking), Bias (Origin), Structural (your test). The case proves your three tests *are separable*, but doesn't confirm your hunch is the *true* divider.

  **If Origin Were Respectable:** Suppose Erin developed her stance from studying political philosophy on gift economies and exploitation, not trauma. Origin Test now likely says **Preference** (admirable source). Tracking (**Preference**) and Structural/Private (**Private**) remain unchanged. Now *all three agree* (Preference), but crucially, the *conflict you wanted* disappears, showing Origin's influence on the initial verdict.

  **Strongest Tracking Attack:** A Tracking purist argues: "Erin's 'robustness' is rationalization masking fixation. She latches onto 'personal power imbalance' arbitrarily because it salvages her trauma response. A *truly* tracking view would weigh the *actual harm* of refused help (e.g., preventable suffering, lost autonomy through poverty) against the *abstract risk* of corruption she fixates on. Her refusal to weigh this – dismissing counterexamples as 'different' instead of updating the principle's weight – shows insulation. Real tracking would force her to admit *sometimes* the concrete harm of refusal outweighs the nebulous risk, making her stance context-dependent, not absolute. Her consistency is rigidity, not virtue."

  **Preference vs. Bias: One or Three?** It's **three distinct distinctions wearing one name.** This case proves they answer different questions:
  -   **Origin:** "Is this disposition *authentically* the agent's own, or alien (imposed by bad source)?"
  -   **Tracking:** "Is this disposition *epistemically virtuous/responsive* to moral reality?"
  -   **Structural/Private:** "What is the disposition's *scope of normative force* (governing only self or also others)?"

  Calling something a "bias" often conflates a negative answer on Origin *or* Tracking (or both). Calling it a "preference" often conflates a positive answer on Tracking *or* it being Private (or both). Your Structural/Private line is a separate, crucial axis about social impact, not directly about epistemic status or authenticity. The single name hides three different ways a disposition can be assessed.
