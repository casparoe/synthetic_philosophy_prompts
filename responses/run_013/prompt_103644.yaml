  The user's hypothesis about conflation makes sense. If different researchers are addressing different aspects (metaphysical, psychological, typographic) without distinguishing them, it's no wonder the debate is stuck. For instance, a geometric essentialist might be focused on defining an abstract schema, while a family resemblance proponent looks at how humans actually recognize varied instances. These aren't necessarily conflicting; they could be addressing different layers of the problem.

