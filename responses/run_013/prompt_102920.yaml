  For the tie-breaker reading (is it legitimately Scanlonian?), I'd put it at 0.6. Scanlon's "complaint" framing does imply pairwise comparison, but whether he intended tie-breaking as a mechanism is debatable—his later work seems ambivalent. The comparative unfairness angle feels weaker (0.4) because while it's rhetorically powerful, it might just dress up aggregation in deontic clothing. 

  The anti-aggregation constraint's stability is tricky (0.45). Scanlon clearly prohibits summing complaints numerically, but does he allow other forms of weighing? His "greatest burden" criterion suggests some comparability, yet insisting on total incomparability would implode the theory—so it's probably a constrained weighing. 

  Non-ad-hoc-ness is the biggest hurdle (0.3). Many solutions (e.g., Alex Voorhoeve's "divide and choose") feel like clever patches rather than organic developments of Scanlon's core principles. If contractualism can't handle this case without special tweaks, that's a problem. 

