prompt: |-
  I volunteer at a small city museum, where I have been asked to prepare an exhibit about housing and work in our city. Our visitors speak a dozen languages, our translation budget is almost nothing, and the trustee who oversees the exhibit has proposed that we drop sentences altogether and present everything in pictures: little figures of people for counts, houses for housing, coins for money. He argues that pictures need no translating because they show what they mean, that a drawing of five houses beside a drawing of two houses speaks for itself, and that our earlier exhibits used words only out of habit. A colleague half agrees with him: she says that between the wars a group in Vienna built a whole pictorial statistics for readers who could not follow a newspaper, and that serious people took it seriously — though she also says that the man who ran it insisted it was only ever meant to help written language along, never to replace it.

  I want the exhibit to convey six things: that evictions in our city fell last year; that most of those evicted were renters rather than owners; that the housing authority is not allowed to evict anyone between November and March; that no new social housing was built at all in the 1990s; that if the recent trend continues the waiting list will double by 2035; and that nobody actually knows how long the waiting list is, since the authority stopped counting in 2019. The first two I can manage. The rest turn into a muddle the moment I try to draw them. I can draw a family carrying its things out of a door, but how do I draw that this must not happen in winter, or that nothing was built, or that something has not happened yet, or that we are only guessing?

  The trustee says the fault is my drawing and that a competent illustrator could render any of it; he has also suggested that where the numbers are large we simply draw the houses larger, which my designer friend says is worse than useless, since a house drawn twice as tall looks four times as big. She says the trouble with the whole plan is deeper: a picture can only show how something looks, and everything about absence, permission, the future, or our own ignorance has to be put in by the viewer, so that a picture-only exhibit would quietly tell different visitors different things. I suspect they are each partly right, but I cannot tell which of my six items are genuinely beyond pictures and which are merely hard to draw well. Nor am I sure what it would mean for a picture to be read correctly at all: if a visitor looks at my five houses and my two houses and concludes that the city has seven houses, whose mistake is that?

  What I would like is advice on how to think this through, and a verdict I can act on. Should I insist on pictures alone, or accept some words? If words, which of the six items need them, and why those rather than the others? And is there any way to decide in advance what a picture can carry by itself and what it cannot, or does that question have no answer except trying it on visitors? I do not need a reading list; I need to understand the underlying issue well enough to defend whatever I decide to the trustee.
reasoning: |-
  Okay, the user is volunteering at a small city museum and needs to create an exhibit about housing and work. The challenge is that visitors speak many languages, the translation budget is almost nothing, and a trustee wants to use only pictures to convey information. The user has six specific points to communicate, but some are tricky to represent visually, like prohibitions, absence, future trends, or uncertainty. They need advice on whether pictures alone can work or if some words are necessary.

  First, I should assess each of the six points. The first two—evictions falling and most evicted being renters—seem doable with icons and counts. But the others are more abstract. For example, how do you show that evictions aren't allowed in winter? A crossed-out eviction scene with snowflakes might imply it's about weather, not a legal ban. The "no new social housing in the 90s" could be misinterpreted as the houses being demolished rather than not built. Future trends like the waiting list doubling by 2035 involve time and prediction, which are hard to depict. And not knowing the waiting list size because counting stopped—how do you visually represent ignorance or missing data?

  The trustee thinks a better illustrator could handle it, but the designer friend points out that pictures show what's present, not absence or concepts like permission. There's a deeper issue here about visual language's limitations. The Vienna pictorial statistics example shows that images can aid understanding but not replace language entirely. The key is to identify which concepts are inherently linguistic.

  Breaking down the six points: Points 1 and 2 are concrete events (evictions, renters vs. owners), so icons with numbers should work. Points 3 to 6 involve abstract concepts: rules (prohibition), absence (nothing built), future projections, and epistemic uncertainty. These likely need words. Even minimal words like "NO" or "?" could bridge the gap without requiring full translations.

  The user also worries about misinterpretation, like someone seeing five houses and two houses as adding up to seven. That's a fundamental challenge with pictograms—they can be ambiguous. Context and design are crucial. Arrows, dividers, or consistent layouts can guide interpretation, but some misunderstandings might still happen. Testing with visitors would help, but with no budget, relying on visual design best practices is essential.

  So, the verdict: Use a hybrid approach. Pair images with minimal keywords (symbols like "X", "?", "→") or numbers. This reduces translation needs while adding clarity. For the waiting list uncertainty, an icon with a question mark and a crossed-out count could signal the unknown. The trustee might resist, but explaining the cognitive limits of images—how humans infer different things from visuals—could persuade them. Highlighting that even the Vienna group saw images as aids, not replacements, supports including some text. Ultimately, the exhibit's effectiveness hinges on conveying accurate information, which requires acknowledging where visuals fall short.
answer: |-
  Here’s a structured way to think through this, a verdict, and how to defend it:

  ### Core Principles for Decision-Making
  1.  **Pictures excel at showing:** Concrete *objects*, *actions*, *quantities* (via size/number/count), *time* (via sequence), and *simple comparisons*.
  2.  **Pictures struggle with:** *Abstractions* (law, permission, knowledge), *negation/absence*, *future prediction*, *uncertainty*, *causality*, and *precise definitions* (e.g., "social housing").
  3.  **Universal Symbols ≠ Universal Meaning:** Even simple icons (house, person) carry cultural baggage. A "house" icon might imply a single-family home, not an apartment. Interpretation is *inferred*, not guaranteed.
  4.  **Context is King:** A picture's meaning relies heavily on surrounding visuals and layout. Isolated images are ambiguous.
  5.  **The Vienna Example:** Otto Neurath's ISOTYPE system was revolutionary *for comparative statistics* (showing quantities, proportions, trends over time) but was **always paired with minimal text labels and captions** (title, axis labels, keys) precisely because pictures alone couldn't convey complex concepts or definitions. It was a "help along," not a replacement.

  ### Analysis of Your Six Points & Visual Feasibility

  1.  **Evictions fell last year:** **Visually Feasible (Strong).** *How:* Two panels. Panel 1: Many figures with belongings leaving houses (e.g., 10 icons). Panel 2: Fewer figures leaving houses (e.g., 5 icons). Add a downward arrow between them. A simple "2022" and "2023" label would be ideal but might be omitted with strong, consistent visual sequencing.
  2.  **Most evicted were renters:** **Visually Feasible (Good).** *How:* A group of figures leaving houses. A significantly larger sub-group marked distinctively (e.g., color, holding a "rent" contract icon - though the contract icon itself might need translation!). A smaller sub-group marked differently (e.g., holding a "mortgage" icon). Needs clear visual differentiation.
  3.  **No evictions Nov-Mar (Housing Authority):** **Visually *Un*feasible Alone.** *Why:* This involves **legal prohibition** and a **specific timeframe**. Pictures can show winter (snowflakes, coats) and an eviction scene, but showing *prohibition* requires abstraction (e.g., a red X or 🚫). Crucially, linking that prohibition *specifically to the Housing Authority* is impossible without labels. A winter scene with an X over an eviction might be interpreted as "evictions don't happen *because* it's winter," not "they are *forbidden* by this agency."
  4.  **No new social housing built in 1990s:** **Visually *Un*feasible Alone.** *Why:* This is **absence over time**. You could show "social housing" icons (needs definition!) for other decades (e.g., 80s: 5 icons, 2000s: 5 icons) and a gap for the 90s. But does the gap mean "none built," "demolished," "data missing," or simply "not shown here"? Conveying "built zero" specifically requires negation/absence.
  5.  **Waiting list could double by 2035 (if trend continues):** **Visually *Un*feasible Alone.** *Why:* This involves a **future projection**, a **conditional statement**, and a **mathematical extrapolation**. Pictures can show a queue now and a longer queue, but conveying "this *might be* the future *if* current patterns hold" requires abstract concepts of time, conditionality, and prediction.
  6.  **Unknown waiting list size (counting stopped in 2019):** **Visually *Un*feasible Alone.** *Why:* This is about **epistemic uncertainty** and **administrative action stopping**. Showing a queue fading into fog or question marks suggests "unknown," but *why* is it unknown? Did it disappear? Is data hidden? The *reason* (counting stopped) is a past administrative action that's impossible to depict unambiguously. Linking the "unknown" symbol to a specific date (2019) is also impossible.

  ### The Verdict: Hybrid Approach (Pictures + Minimal Critical Text)

  *   **Insist on adding minimal, essential text.** Pictures alone *cannot* accurately convey points 3, 4, 5, and 6. Points 1 and 2 are achievable but still benefit from minimal labels (years, "Renters"/"Owners").
  *   **What "Minimal Critical Text" Means:**
      *   **Keywords, not sentences:** "Nov-Mar Ban," "Zero Built: 1990s," "Possible 2035," "Size Unknown (since 2019)", "Renters," "Owners," "2022," "2023."
      *   **Universal Symbols Where Possible:** Integrate 🚫 (No/Prohibition), ❓ (Unknown), ➔ (Trend/Future), ➖ (Zero/None). *Use these consistently as part of the visual language.*
      *   **Numbers & Dates:** Essential for quantities and time periods. These are relatively universal.
      *   **Focus on Nouns, Verbs, Key Modifiers:** Avoid complex grammar. "Waiting List Double? 2035" is clearer than a sentence.
      *   **Design as Integrated Elements:** Treat text as a visual element – same font, consistent placement (e.g., always below the relevant pictogram group), limited to absolutely necessary words/symbols.

  ### How to Defend This to the Trustee

  1.  **Acknowledge the Goal & Inspiration:** "I completely agree with your core goal of accessibility and reducing language barriers. The Vienna ISOTYPE example is brilliant for visualizing quantities and trends, which we'll use heavily for points like eviction numbers and renter proportions."
  2.  **Explain the Cognitive Limits of Pictures:** "However, ISOTYPE itself always used minimal text because pictures *inherently struggle* with certain types of information our exhibit needs:"
      *   **"Rules & Prohibitions (Point 3):** A picture can show winter and eviction, but it can't show 'the law forbids this.' A 🚫 symbol helps, but needs context (what is forbidden?). A tiny 'No' or 'Ban' anchors it."
      *   **"Absence & Nothing Happening (Point 4):** Showing a gap might mean 'none built,' 'demolished,' or 'we skipped this.' A '0' or 'None' is unambiguous."
      *   **"Future Predictions & Conditions (Point 5):** Showing a long queue might mean 'now' or 'the future.' A '2035?' and an arrow (➔) signals prediction. We can't draw 'if this continues' without words."
      *   **"Uncertainty & Why (Point 6):** Question marks show 'unknown,' but not *why* (data stopped? lost?). 'Since 2019' or 'Not Counted' explains the cause briefly."
  3.  **Address the "Competent Illustrator" Point:** "Even the best illustrator cannot make a single picture convey abstract legal concepts like 'not allowed' or epistemological states like 'we don't know because counting stopped.' These require symbolic or linguistic conventions that aren't universal visual properties."
  4.  **Address the "Bigger House" Problem:** "You're right to be wary of scaling icons for quantity – our designer correctly notes it misrepresents area. We'll stick to counts of identical icons or proportional stacking for clear comparisons, using actual numbers."
  5.  **Highlight the Risk of Misinterpretation:** "Without minimal text anchors, visitors *will* interpret these complex points differently. For 'no evictions Nov-Mar,' some might think we're showing they *do* happen in winter! For 'no new social housing,' they might think we're showing it was demolished. Our goal is clarity, not ambiguity. Minimal text ensures the picture tells the *intended* story."
  6.  **Emphasize Practicality & Universality:** "We're not proposing paragraphs. We're proposing integrating tiny, essential keywords (like 'No', 'Ban', '0', '?', '2035?', 'Rent') and symbols (🚫, ❓, ➔) directly into the visual design. These borrow from near-universal signage conventions and are far easier for diverse visitors to grasp than trying to infer complex abstract relationships solely from pictures. Numbers and dates are already universally understood."
  7.  **Offer Compromise & Focus:** "Let's dedicate the vast majority of the exhibit to powerful pictograms for what they do best – showing quantities, actions, and simple comparisons (like Points 1 & 2). We'll reserve minimal text *only* for the specific abstract concepts in Points 3-6 where pictures fundamentally fall short. This maximizes visual impact while ensuring critical accuracy."

  ### How to Decide What Needs Words (A Rule of Thumb)

  Ask: **"Does this concept rely on an abstraction, negation, conditionality, future/past tense, or state of knowledge that isn't physically visible?"** If yes, it likely needs minimal text/symbol support. Pictures show *what is* or *what happens*. They struggle with *what isn't*, *what must/must not happen*, *what might happen*, *what we don't know*, and *why* (especially legal/institutional why).

  By focusing on the inherent limitations of visual communication for abstract concepts and framing the minimal text as essential, integrated visual anchors *inspired* by ISOTYPE's own practices (not a rejection of the visual approach), you have a strong case for a hybrid exhibit that is both maximally accessible and factually accurate. Good luck!
