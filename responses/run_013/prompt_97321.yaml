     - E = 0.6*10 + 0.4*(-5) = 6 - 2 = 4 >0.
     - E_abs = 0.6*10 + 0.4*5 = 6+2=8, finite.
     - Step 3a: 
          - Maximum loss: £5 (absolute value 5). If L=100,000, then 5<100,000 -> okay.
          - Probability of loss exceeding T=500: 0 (since loss is only 5) -> okay.
     - Approve.

  In conclusion, the procedure extends the current policy by incorporating risk through the expected absolute payout and additional thresholds for large losses. It handles the two problematic cases by flagging them for panel review. It also handles well-behaved games cleanly. The procedure has limitations in that it may approve games that the panel considers too risky (if the loss is within the thresholds but still large relative to the expected gain) and it requires setting thresholds in advance.
