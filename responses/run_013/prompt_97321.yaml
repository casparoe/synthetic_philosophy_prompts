  ### Procedure for Evaluating Promotional Games Based on Expected Value Reasoning

  The following procedure extends your existing policy (approve if expected value is positive) to handle cases where the expected value is ill-defined or infinite. The procedure prioritizes mathematical rigor and transparency, ensuring that a junior analyst can execute it and the panel can defend decisions to regulators. It incorporates risk assessment when expected value alone is insufficient.

  **Key Principles:**
  1. **Natural Order Summation:** Outcomes are summed in the order they occur in the game mechanics (e.g., by sequential trials).
  2. **Absolute Convergence Check:** Ensures the expected value is well-defined and not manipulable by reordering.
  3. **Risk Assessment:** When expected value is conditionally convergent or divergent, risk (via expected absolute payout) takes precedence.
  4. **Panel Escalation:** Decisions involving unbounded risk or ethical trade-offs are deferred to the panel.

  ---

  ### Step-by-Step Procedure

  #### **Step 1: Compute Expected Value (E) in Natural Order**
  - **Question:** What is the sum of \( \sum (\text{payout}_i \times \text{probability}_i) \) when outcomes are ordered by game mechanics (e.g., trial number, sequence of events)?  
  - **Sufficient Answer:**  
    - A series expression (e.g., \( \sum_{n=1}^{\infty} a_n \)) or closed-form value.  
    - Convergence/divergence behavior (using tests like ratio, root, or comparison).  
  - **Stop with "No" if:**  
    - \( E \leq 0 \) and absolutely convergent (reject: negative/zero expected profit).  
  - **Escalate to Panel if:**  
    - \( E \) is conditionally convergent or divergent (proceed to Step 2).

  #### **Step 2: Check Absolute Convergence**
  - **Question:** What is \( E_{\text{abs}} = \sum |\text{payout}_i| \times \text{probability}_i \)?  
  - **Sufficient Answer:**  
    - A series expression (e.g., \( \sum_{n=1}^{\infty} |a_n| \)) and its convergence status.  
  - **Stop with "No" if:**  
    - \( E_{\text{abs}} = \infty \) **and** \( E \) is finite but negative (reject: infinite risk with negative profit).  
  - **Escalate to Panel if:**  
    - \( E_{\text{abs}} = \infty \) **and** \( E \) is conditionally convergent or positive divergent (proceed to Step 3).

  #### **Step 3: Risk Assessment for Non-Absolutely Convergent Cases**
  - **Question:** What is the worst-case loss and its probability?  
  - **Sufficient Answer:**  
    - Maximum possible loss (or unbounded loss).  
    - Probability of losses exceeding a predefined threshold (e.g., £100,000).  
  - **Decision Framework:**  
    - If \( E_{\text{abs}} = \infty \), the game has **infinite risk** (expected absolute payout is unbounded).  
    - The panel must decide if the company can absorb unbounded losses (e.g., via capital reserves).  
  - **Escalate to Panel Always:**  
    - Values-based trade-off: Is the potential for infinite profit worth infinite risk? Can losses be capped?  

  #### **Step 4: Final Approval Criteria for Low-Risk Games**
  - **Only if \( E_{\text{abs}} < \infty \) (low risk):**  
    - Approve if \( E > 0 \).  
    - Reject if \( E \leq 0 \).  

  ---

  ### Why This Procedure?
  - **No Fudging:** If expected value is conditionally convergent or divergent, Step 2 flags it, and Step 3 forces explicit risk evaluation.  
  - **Defensible:** Junior analysts can compute series convergence; the panel handles subjective risk trade-offs.  
  - **Regulator-Friendly:** Documents why expected value fails and how risk was assessed.  

  ---

  ### Case Evaluations

  #### **Case 1: Alternating-Sign Game**  
  - **Mechanics:** Fair coin tossed until first head; payout = \( (-1)^{n+1} \frac{2^n}{n} \) on toss \( n \).  
  - **Step 1:**  
    - \( E = \sum_{n=1}^{\infty} \left[ (-1)^{n+1} \frac{2^n}{n} \times \frac{1}{2^n} \right] = \sum_{n=1}^{\infty} \frac{(-1)^{n+1}}{n} = \ln 2 \approx 0.693 > 0 \).  
    - Converges conditionally (harmonic series alternates).  
    - **→ Escalate to Step 2.**  
  - **Step 2:**  
    - \( E_{\text{abs}} = \sum_{n=1}^{\infty} \left|\frac{(-1)^{n+1}}{n}\right| = \sum_{n=1}^{\infty} \frac{1}{n} = \infty \).  
    - **→ Escalate to Panel (Step 3).**  
  - **Step 3 (Panel Review):**  
    - **Risk:** \( E_{\text{abs}} = \infty \) → **infinite risk** (unbounded expected absolute loss).  
    - **Worst-case loss:** Unbounded (e.g., £\( 2^{100}/100 \approx £1.3 \times 10^{28} \) for \( n=100 \), though probability is \( 1/2^{100} \)).  
    - **Panel Decision:** Reject unless the operator can cover unbounded losses (e.g., stop-loss per player). **Likely rejection due to extreme risk.**  

  #### **Case 2: Positive-Sign Game**  
  - **Mechanics:** Same as Case 1, but payout = \( +\frac{2^n}{n} \) (always positive for player, so loss for operator).  
  - **Step 1:**  
    - \( E = \sum_{n=1}^{\infty} \left[ -\frac{2^n}{n} \times \frac{1}{2^n} \right] = -\sum_{n=1}^{\infty} \frac{1}{n} = -\infty \).  
    - Diverges to \( -\infty \).  
    - **→ Stop with "No" (negative infinite expected profit).**  

  #### **Case 3: Well-Behaved Game (Example: Simple Slot Machine)**  
  - **Mechanics:**  
    - 95% chance: Win £1 (operator gains £1).  
    - 5% chance: Lose £10 (operator loses £10).  
  - **Step 1:**  
    - \( E = (0.95 \times 1) + (0.05 \times -10) = 0.95 - 0.5 = 0.45 > 0 \).  
    - Converges absolutely (finite outcomes).  
  - **Step 2:**  
    - \( E_{\text{abs}} = (0.95 \times 1) + (0.05 \times 10) = 0.95 + 0.5 = 1.45 < \infty \).  
  - **Step 4:**  
    - \( E > 0 \) and low risk → **Approve**.  

  #### **Case 4: Panel-Unfriendly Game (Extreme Rare Loss)**  
  - **Mechanics:**  
    - 99.99% chance: Win £0.10 (operator gains £0.10).  
    - 0.01% chance: Lose £1,000,000 (operator loses £1,000,000).  
  - **Step 1:**  
    - \( E = (0.9999 \times 0.10) + (0.0001 \times -1,000,000) = 0.09999 - 100 = -99.90001 < 0 \).  
    - **→ Stop with "No" (negative expected profit).**  
  - **Why the Panel Would Dislike It (if approved under old policy):**  
    - Old policy (only check \( E \)) would reject since \( E < 0 \). But if \( E \) were positive:  
      - E.g., change win to £2: \( E = (0.9999 \times 2) - 100 = 1.9998 - 100 < 0 \) → still negative.  
      - To get \( E > 0 \): Win £1.50 with 99.99% prob, loss £1,000,000 with 0.01% prob.  
      - \( E = (0.9999 \times 1.50) - 100 = 1.49985 - 100 < 0 \). **No positive \( E \) is possible without tiny loss probability or large win probability.**  

  ---

  ### Limitations of the Procedure
  1. **Cannot Handle:**  
     - Games with correlated outcomes (e.g., payout depends on player history).  
     - Non-monetary risks (e.g., reputational damage, regulatory penalties).  
     - Games where the natural order is ambiguous (requires manual ordering).  
  2. **Risk Thresholds:** Predefined loss thresholds (e.g., £100,000) must be set by the panel.  
  3. **Subjectivity:** Step 3 requires panel judgment for risk tolerance (not purely mathematical).  
  4. **False Negatives:** May reject high-risk games with positive \( E \) (e.g., Case 1) that the panel might accept with mitigations.  

  ### Final Recommendation
  - **Update Policy:** Incorporate this procedure into the risk panel charter.  
  - **Predefine Risk Thresholds:** Set acceptable loss limits (e.g., max loss = £X, probability of loss > £Y < Z%).  
  - **Document Everything:** Ensure analysts show convergence tests and risk metrics for regulator audits.  

  This procedure ensures expected-value reasoning is applied rigorously, escalates values-based decisions, and handles pathological cases transparently.
