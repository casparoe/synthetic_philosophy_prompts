answer: |-
  The success condition reveals that the doctrine is fundamentally grounded in efficient risk-sharing and the *ex post* allocation of benefit, not corrective justice, reciprocity, or a pre-existing moral community, though these elements fit comfortably with the practice.

  *   **The Success Condition's Significance:** Contribution is contingent on the sacrifice *saving the common venture*. If the ship sinks anyway, the jettisoned cargo owner bears the full loss. This demonstrates that the doctrine's core aim is not to *compensate sacrifice* per se (which exists regardless of outcome) nor to fulfill a *moral debt of reciprocity* (which would arguably be owed to the sacrificer even if the sacrifice failed). Instead, it allocates the *cost of preserving a surviving common fund* (the saved property) among the beneficiaries of that preservation. The loss is treated as an extraordinary expense incurred for the *joint benefit*, payable only if that benefit materializes. The sacrifice creates a claim against the *saved value*, not against the other parties as moral agents owing a debt.

  *   **Coherence:** The doctrine remains coherent under this grounding. It functions as a mandatory, predefined mechanism for sharing the cost of successful emergency measures that preserve the entire venture. It efficiently spreads the risk of such losses across all interests that ultimately gain from the sacrifice, preventing the party forced to make the sacrifice from bearing the entire cost of an action that saves others. The lack of compensation for failed sacrifices, while harsh on the sacrificer, aligns with the principle that no benefit was conferred; there is no "saved value" pool from which to contribute. The rationale is economic: incentivizing necessary sacrifices by ensuring the cost is shared *if* they work, without creating a system of generalized loss-sharing for futile acts.

  *   **Strictly Presupposed Elements:**
      *   **Common Peril:** A threat to the entire maritime adventure (ship, cargo, freight).
      *   **Extraordinary Sacrifice or Expense:** A deliberate, voluntary act (like jettison) or expense (like port fees) made for the common safety, beyond the normal incidents of the voyage.
      *   **Intent for Common Safety:** The sacrifice/expense must be made with the primary intent of preserving the imperiled interests collectively.
      *   **Success (Preservation of Beneficiaries):** The sacrifice/expense must be a contributing cause to the preservation of *at least some* of the property (ship, other cargo, freight) that would otherwise have been lost.
      *   **Pro Rata Contribution from Saved Value:** The loss is shared proportionally among the *saved* interests based on their *final net saved values*.

  *   **Elements that Fit Comfortably (But Not Strictly Presupposed):**
      *   **Voluntariness:** While the sacrifice is "voluntary" in the sense of being a deliberate act (not inevitable), the jettisoned cargo owner rarely has a real choice. The doctrine fits well with this element but doesn't strictly require the *sacrificer* to have consented; the obligation arises from the *benefit* to others.
      *   **Reciprocity:** The practice exhibits a form of reciprocity (I benefit from your sacrifice, so I contribute), but the success condition shows this is a consequence of benefit received, not the foundational principle. Reciprocity fails to explain why a failed sacrifice deserves no contribution.
      *   **Pre-existing Community:** While parties are bound by contract (bill of lading), the doctrine doesn't presuppose a deep *moral* community beyond the specific contractual venture. The obligation arises from the peril and the successful outcome, not an inherent communal bond.

  *   **Philosophical Underdetermination:** The practice *is* philosophically underdetermined. Rival theories can justify it equally well *ex post*:
      *   **Utilitarian Efficiency/Risk-Sharing:** Minimizes the individual ruin risk of necessary sacrifices by spreading costs only when beneficial, promoting overall welfare for maritime commerce. The success condition is central here.
      *   **Hypothetical Contract (Libertarian/Contractarian):** Rational shippers/carriers, knowing the risks, would agree in advance (as they do via bills of lading) to such a rule to avoid holdout problems and ensure necessary actions are taken, sharing costs only if successful. The success condition can be seen as part of the efficient bargain.
      *   **Benefit-Based Liability (Quasi-Contract/Restitution):** The surviving parties are enriched (their property is saved) at the expense of the sacrificer; contribution prevents their unjust enrichment arising from the sacrifice. The success condition defines the existence of the enrichment.
      *   **(Limited) Communitarian/Corrective Justice:** While the success condition weakens these, proponents could argue the venture *creates* a temporary community of fate, and justice demands sharing the cost of actions taken for its collective salvation *when successful*. The "common safety" intent supports this view.
