prompt: |-
  ok so I keep getting into arguments about the Pasadena game and I want to actually get clear on it before I write anything. Here's the setup as I understand it, correct me if I've got it wrong: you flip a fair coin until the first heads; if heads first shows up on toss n, the payoff is 2^n / n but with alternating sign. So each term in the expected value series has magnitude 1/n, and the series is only conditionally convergent — rearrange the terms and you can make it come out to any real number you like, or make it diverge. The St. Petersburg game is the cousin where the expectation blows up to infinity, and there's another cousin where you divide by n^2 instead so the terms fall off like 1/n^2 and the expectation is finite and well behaved. Then there's the Altadena game: Pasadena plus a dollar on every outcome, so it dominates Pasadena state by state, but its expectation diverges to +infinity.

  What I want from you is the desiderata: what does a theory of rational choice have to deliver to count as an adequate treatment of prospects whose expected value is undefined, or infinite, or only conditionally convergent? Give me the requirements list, with the case or consideration behind each one, then tell me which requirements are negotiable and which aren't, and whether any subset of them is jointly unsatisfiable — I suspect some are, and thats the part I most want to see. Also tell me which single requirement does the most work in ruling out the obvious candidate theories.

  Things I want on the list, though you should tell me if any of them are actually just prejudices of one camp rather than genuine requirements: that the theory must prefer Altadena to Pasadena, since it pays more in every state; that it must not give different verdicts about the same prospect depending on how you order the outcomes (order-invariance); that it must agree with ordinary expected-utility theory on ordinary finite gambles; that it must say something determinate about whether to pay a small fee to play Pasadena, rather than shrugging; that it must handle compound gambles, like holding Pasadena plus an independent St. Petersburg ticket, or two Pasadena tickets at once; that it must respect the fact that the game terminates with probability one and no infinite payoff is ever actually paid out; that it must say whether the value of a prospect can be a set or a range rather than a single number, and if so what rational choice even means then (permitted vs required); and that it has to handle the bankroll point, where the casino literally cannot pay the huge tail payoffs.

  Then your take on the biggest fork: does the natural ordering of the states (toss 1, 2, 3, ...) privilege one summation, so that the Pasadena game really does have a definite value after all, or is that ordering irrelevant to what the prospect is worth? Say which way you'd go and why, and flag what each choice costs you elsewhere on the list.

  Skip the historical scorecard of who said what — I don't need names or reading lists, I need the spec. A table is fine if it helps.
