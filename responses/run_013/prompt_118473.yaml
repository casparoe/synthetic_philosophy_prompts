  The user's deeper needs are emerging: they want this to be a subtle demonstration of the concept through form, not content. The poem itself must *be* the argument—each stanza replacing words like neurons, maintaining the "self" through identical function while the material completely changes. The challenge is crafting a refrain where every word can plausibly be swapped (nouns/verbs/adjectives with common synonyms), including the self-referential pronoun ("I" to "eye" to "aye" etc.). 

  I'll start by designing the refrain. Needs 5-6 mutable words. Example: "This pulse still holds what *makes* me *feel* alive" → each italicized word can shift (e.g., *makes*→*keeps*, *feel*→*seem*). The self-word ("me") is critical—it'll morph from "me" to "one" to "soul" to "form," destabilizing identity without breaking syntax. Rhyme scheme must stay consistent; if "alive" ends the line, replacements like "arrive"/"survive"/"thrive" could work. 

  For stanza structure: first three stanzas describe physical sensations (needle, humming machinery) to ground the scene. Middle stanzas shift to abstract continuity ("same laugh, same thoughts"). Final stanza mirrors the first but with swapped words, showing seamless transition. No "gotcha" moments—just steady, imperceptible change. 

  Philosophical honesty: every stanza must reinforce dual truths. Line 3 of stanza 4 might say, "Old parts retired, new light still finds its way," implying persistence of pattern despite material loss. The self-word swaps should whisper unease without stating it—when "me" becomes "one" in stanza 3, it subtly depersonalizes. 

  Execution risks: Forced synonyms could jar. Testing syllable math: "This pulse still holds what keeps one whole inside" (7 syllables) must match "This beat yet bears what haunts my ghost implied" (7, with "beat" replacing "pulse"). Rhyme integrity checks: "inside"/"implied" share the /aɪd/ sound. 

  User’s "don’ts" are vital: no horror tropes, no resolution. The last stanza’s "This beat yet bears what haunts my ghost implied" must feel as natural as the original, leaving readers unsettled only in retrospect. The poem’s success hinges on rereading—like the upload process itself, the break in continuity is invisible in real time.
