answer: |-
  ## Dissertation Prospectus: Chapter 1 Proposal - The Epistemic Foundations of Iterated Strict Dominance and the Role of Mixed Strategies

  **Chapter Title (Tentative):** Mixed Strategies in Disguise? Unpacking the Epistemic Foundations of Iterated Strict Dominance

  **1. Core Research Question:**
  Does the standard epistemic justification for the order-independence of iterated elimination of *strictly* dominated strategies (IESDS) in two-player games implicitly rely on interpreting mixed strategies as objects of choice, despite the prevailing "uncertainty" interpretation, and does this reliance explain the asymmetry with iterated elimination of *weakly* dominated strategies (IEWDS)?

  This question has a determinate answer: Yes, the justification relies on the choice interpretation; or No, it does not. The asymmetry may be explained by this reliance, or by other inherent properties of strict vs. weak dominance.

  **2. The Gap in Existing Literature:**
  The epistemic foundations of solution concepts, particularly IESDS and Nash equilibrium, are well-established (e.g., through rationalizability, common belief/knowledge of rationality). Key texts explicitly address the interpretation of mixed strategies, predominantly favoring the "uncertainty" or "belief" view (mixed strategies represent the opponent's uncertainty about the player's pure strategy choice, or the player's own uncertainty in a Harsanyi-type purification). The argument for IESDS is presented as relying only on players having beliefs over opponents' pure strategies and never playing non-best-responses.

  *   **Why Open?** While the literature meticulously distinguishes interpretations *declaratively*, there has been insufficient formal scrutiny of whether the standard *proofs* of key properties (specifically, the order-independence of IESDS) actually depend only on the weaker "belief" interpretation, or whether they covertly utilize the stronger "choice" interpretation. The literature takes the equivalence (for IESDS) and the asymmetry (vs. IEWDS) as given, without explicitly tracing whether the proof mechanics demand the "choice" reading of mixed strategies as *available actions* for the purpose of defining best responses and domination.
  *   **Non-Standard Angle:** This project directly interrogates the *proof-theoretic mechanics* of the standard epistemic justification. Instead of accepting the equivalence result ("never a best response iff strictly dominated by a mixed strategy") as a black box justifying IESDS, it dissects this equivalence and the subsequent elimination procedure. It specifically links the analysis to the stark contrast in behavior between strict and weak dominance under iteration – a difference often noted but rarely explicitly tied back to the foundational role of mixed strategies in the justification.

  **3. Methodology: Formal Axiomatic Reconstruction and Comparison:**
  This is formal, analytical work in game-theoretic foundations. The core method involves:
  *   **Formalizing Interpretations:** Precisely axiomatizing two distinct epistemic frameworks for a player in a two-player game:
      *   *Framework C (Choice):* Players can choose mixed strategies. Beliefs are probability distributions over the opponent's *pure* strategies. "Best Response" involves comparing expected utilities of one's own *mixed* strategies given beliefs over opponent's pure strategies.
      *   *Framework B (Belief):* Players can only choose *pure* strategies. Beliefs are probability distributions over the opponent's *pure* strategies. "Best Response" involves comparing expected utilities of one's own *pure* strategies given beliefs over opponent's pure strategies. Mixed strategies appear *only* as representations of these beliefs or as tools for defining domination.
  *   **Reconstructing the Justification:** Within each framework:
      *   Define "Never a Best Response" (NBR) relative to the framework's constraints on choices and beliefs.
      *   Define "Strictly Dominated" (SD) relative to the framework. Crucially, in Framework B, "dominated by a mixed strategy" means dominated by some probability distribution *over the player's own pure strategies*, but the player cannot deliberately *choose* to play this mixture.
      *   Prove or disprove the equivalence: "Strategy s is NBR iff s is SD by some mixture" *within each framework*.
      *   Analyze the iterative elimination procedure (IESDS) defined by removing SD strategies in each framework.
  *   **Testing Key Properties:** Focus on:
      *   *Order-Independence:* Does IESDS yield the same surviving set regardless of elimination order *within each framework*?
      *   *Comparison to Weak Dominance:* Repeat the analysis (defining Weakly Dominated (WD), NBR equivalence, IEWDS) within both frameworks. Does the stark asymmetry between IESDS and IEWDS (order-independence vs. path-dependence) manifest *differently* or *persist* across frameworks?
  *   **Identifying the "Fault Line":** Pinpoint the specific steps in the standard justification (typically relying on Framework C mechanics) that fail or require modification in Framework B, and how this impacts the equivalence and the order-independence property.

  **Why this approach?**
  *   **Alternatives Avoided:** Pure conceptual analysis lacks rigor; empirical methods are inapplicable; large-scale computational simulation of epistemic models is complex and distracts from the core logical point.
  *   **Directness:** This method directly confronts the suspicion by rigorously separating the interpretations and examining the proof mechanics under each constraint.
  *   **Clarity:** It forces a clean separation of the roles mixed strategies play, revealing if and where the "choice" aspect is indispensable for the desired properties.

  **4. Expected Results & Failure Conditions:**
  *   **Successful Result:** A clear demonstration that:
      *   The equivalence "NBR iff SD by mixture" holds *only* under Framework C (Choice), or holds under Framework B (Belief) but in a way that compromises the standard iterative process.
      *   Consequently, the order-independence of IESDS crucially depends on Framework C mechanics, failing under a pure Framework B interpretation.
      *   The asymmetry with IEWDS is inherently linked to this dependence: the weaker requirements of weak dominance might allow the weaker Framework B justification to still function (albeit yielding path-dependence), while strict dominance requires the stronger Framework C.
  *   **Failure Conditions (Outcomes still contributing knowledge):**
      1.  **Coincidence:** Rigorous analysis shows that the standard justification demonstrably *does not* rely on the choice interpretation. The equivalence and order-independence hold equally well under the pure belief interpretation (Framework B). The question "dissolves" as unfounded, but this is a valuable negative result clarifying the robustness of the foundations.
      2.  **Irrelevance of Distinction:** The distinction between Framework C and Framework B proves irrelevant to explaining the order-independence of IESDS vs. the path-dependence of IEWDS. The asymmetry stems entirely from the inherent logical differences between strict and weak dominance themselves, independent of the mixed strategy interpretation. This would shift the explanatory focus.
      3.  **Inconclusive Framing:** The attempt to cleanly separate the interpretations axiomatically proves impossible or leads to inconsistencies within standard game theory, preventing a clear test. This would highlight deeper conceptual tensions.
      4.  **No Clear Link to Asymmetry:** While a dependence on Framework C for IESDS order-independence is shown, the analysis fails to establish that this is *why* IEWDS lacks order-independence under standard justifications. The asymmetry remains unexplained by this mechanism.

  **5. Scope & Feasibility for One Semester:**
  *   **Realistic Scope (Semester Goal):** Focus exclusively on **finite two-player games**. Fully formalize Framework C and Framework B. Rigorously establish the NBR/SD equivalence within each. Prove the order-independence (or lack thereof) of IESDS within each framework. Conduct a preliminary, focused comparison of the strict vs. weak dominance asymmetry *only* within Framework C to solidify the baseline, contrasting it with the known path-dependence of IEWDS.
  *   **What Makes it Too Big:**
      *   Extending the analysis rigorously to **IEWDS under both frameworks** within the semester. Weak dominance introduces significant additional complexity (e.g., issues with admissibility, sensitivity to support of beliefs).
      *   Attempting to generalize to **n-player games** (n>2). The equivalence "NBR iff SD" famously *fails* for n>2 under the standard uncertainty interpretation, adding substantial layers of complexity regarding belief structures and correlated beliefs.
      *   Developing **full-blown epistemic models** (with types, hierarchies of beliefs) for each framework instead of the more abstract, player-centered axiomatic approach proposed.
      *   Investigating **alternative solution concepts** or **generalizations of dominance** beyond the scope of the core question.
  *   **Mitigation:** The proposal strictly limits the analysis to two-player games and prioritizes the core IESDS justification under the two interpretations. The IEWDS comparison will be illustrative but not exhaustive. The formalization focuses on the essential mechanics of best response and domination definitions within the constrained frameworks.

  **Deliverable:** A polished chapter establishing the formal frameworks, presenting the core analysis of IESDS justification under each, clearly stating the result regarding the necessity (or not) of the choice interpretation for order-independence, discussing its implications for the strict/weak asymmetry, and situating the finding within the broader epistemic foundations literature. This provides a solid, focused foundation for potential extensions (e.g., to weak dominance, n-players) in later chapters.
