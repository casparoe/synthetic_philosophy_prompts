  First, I need to map their seven moves clearly. Dev's position seems grounded in functional continuity and anti-essentialism about neurons, while Sam's criticism focuses on causal history and reference drift. The tuning protocol is indeed the crux - is it maintaining identity or just creating a convincing simulation?

