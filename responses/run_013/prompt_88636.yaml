answer: |-
  Below is a decision tree for classifying positions on higher-order evidence (HOE) and its impact on first-order beliefs. It uses concrete cases and questions to branch into distinct positions, prioritizing case-based judgments over labels. The taxonomy has **10 nodes** and **12 leaves**, with positions grouped by core commitments and their most awkward implications.

  ---

  ### **Core Cases Used in the Tree**
  1. **Calibration Journal (CJ)**: Your 90% intervals in a subfield contain truth only ~50% of the time.  
  2. **Weak Study (WS)**: An underpowered study shows people *like you* (same training, role) are wrong 60% of the time when 90% confident in similar claims.  
  3. **Parochial Standards (PS)**: You realize the argument standards you use (e.g., "statistical significance suffices") were drilled into you by a mentor whose other students often publish non-replicable work.  
  4. **Proof Collapse (PC)**: *[Added]* After proving a theorem using complex methods, you learn three peers with identical training made subtle errors in similar proofs. None caught their own mistakes pre-publication.  

  ---

  ### **Decision Tree**
  Start at **Node 1**, answer yes/no, and proceed to the next node or leaf.  
  *(Answers must be consistent across cases where applicable.)*  

  **Node 1: Direct Impact?**  
  > *In CJ, does learning your intervals were poorly calibrated directly lower your confidence in a current first-order claim (e.g., "My experiment shows X"), even if your original evidence for X is unchanged?*  
  > - **Yes** → Node 2  
  > - **No** → Node 3  

  **Node 2: Standards-Sensitive?**  
  > *In PS, does discovering your standards might be parochial weaken your belief in a claim built with those standards?*  
  > - **Yes** → Node 4  
  > - **No** → Leaf 1: **Direct Conciliationism**  
  > > *Awkward commitment: You must distrust current beliefs even when no specific flaw is identified (e.g., in CJ, all 90% claims lose credibility uniformly).*  

  **Node 4: Uncertainty Matters?**  
  > *In WS, does the weak evidence (underpowered study) oblige you to lower confidence less than in CJ (strong personal track record)?*  
  > - **Yes** → Leaf 2: **Scaled Conciliationism**  
  > > *Awkward commitment: Quantifying weight between HOE and first-order evidence is often arbitrary (e.g., how much to discount CJ vs. WS?).*  
  > - **No** → Leaf 3: **Total Evidence Conciliationism**  
  > > *Awkward commitment: CJ and WS demand equal belief-revision despite different directness (track record vs. group study).*  

  **Node 3: Competence-Only?**  
  > *In CJ, does HOE only show you overestimated your reliability, without affecting the claim itself?*  
  > - **Yes** → Node 5  
  > - **No** → Leaf 4: **Framing Skepticism**  
  > > *Awkward commitment: Beliefs aren’t "governed by requirements" at all—HOE reveals a mismatch between your psychology and idealized norms.*  

  **Node 5: Permissivism?**  
  > *In PS, could two rational people, aware of the same training bias, reasonably disagree on whether to trust a specific claim made with those standards?*  
  > - **Yes** → Node 6  
  > - **No** → Node 7  

  **Node 6: Distrust Coherent?**  
  > *In PC, can you rationally require yourself to double-check your proof while still trusting it provisionally?*  
  > - **Yes** → Leaf 5: **Permissivist Steadfastness**  
  > > *Awkward commitment: You may keep believing P while agreeing others shouldn’t trust you on P.*  
  > - **No** → Leaf 6: **Skeptical Permissivism**  
  > > *Awkward commitment: HOE destroys justification for any confidence in disputed domains (e.g., PS/PC force agnosticism).*  

  **Node 7: Input/Process/Standards Parity?**  
  > *Does HOE about misreading data (input), flawed reasoning (process), or biased standards (standards) affect first-order beliefs the same way?*  
  > - **Yes** → Node 8  
  > - **No** → Node 9  

  **Node 8: Partial Weight?**  
  > *In WS, can you partially lower confidence (e.g., from 90% to 80%) rather than fully conciliating?*  
  > - **Yes** → Leaf 7: **Calibrated Reliabilism**  
  > > *Awkward commitment: You must precisely adjust confidence *before* new evidence (e.g., WS forces a 10% drop without case-specific reasons).*  
  > - **No** → Leaf 8: **Hierarchical Steadfastness**  
  > > *Awkward commitment: HOE only mandates caution in *future* judgments—current beliefs stay intact (e.g., CJ doesn’t touch existing claims).*  

  **Node 9: Which Matters Most?**  
  > *Rank these by how much they undermine first-order beliefs: (A) Misread data (CJ), (B) Flawed process (PC), (C) Biased standards (PS).*  
  > - **A > B > C** → Leaf 9: **Input-Focused Reductionism**  
  > > *Awkward commitment: Standards are "part of you," so PS can’t challenge beliefs without self-annihilation (e.g., PS is irrelevant).*  
  > - **C ≥ B > A** → Leaf 10: **Standards-Sensitive Revisionism**  
  > > *Awkward commitment: PS forces system-wide doubt (e.g., all claims using those standards are suspect).*  
  > - **B > A ≈ C** → Leaf 11: **Process Externalism**  
  > > *Awkward commitment: Only *independent* verification fixes HOE (e.g., in PC, you can’t trust your proof until a peer checks it).*  

  **Node 10: Self-Undermining?**  
  > *In PS, if you distrust your standards, must you also distrust that act of distrust?*  
  > - **Yes** → Leaf 12: **Coherentist Akrasia**  
  > > *Awkward commitment: It’s rational to believe P and believe you shouldn’t believe P simultaneously (e.g., in PS, you endorse your claim while rejecting your endorsement).*  
  > - **No** → Leaf 10: **Standards-Sensitive Revisionism** *(Reached via prior branch)*  

  ---

  ### **Notes on Ambiguities & Gaps**  
  - **Indistinguishable Pair**: Total Evidence Conciliationism (Leaf 3) and Direct Conciliationism (Leaf 1) cannot be separated by case judgments alone—both demand significant belief-revision in CJ/WS/PS.  
  - **Unoccupied Position**: Answering **No** to Node 1 and **Yes** to Node 5’s permissivism, but **Yes** to Node 7’s parity, leads to incoherence. If HOE only affects competence *and* all HOE types are equal *and* permissivism holds, you could arbitrarily ignore CJ while acting on PS—undermining the competence link.  
  - **Hybrid Coverage**: The tree captures conciliationism (Leaves 1–3), steadfastness (Leaves 5, 8), akrasia (Leaf 12), and framing skepticism (Leaf 4), plus domain-specific views (Leaves 9–11).  

  ---

  ### **How to Use This Instrument**  
  1. Each member answers the nodes **individually** using the cases.  
  2. Group maps answers to leaves, noting where judgments diverge (e.g., at Node 7).  
  3. Discuss: *Why* does WS feel weaker than CJ? *When* is distrust self-undermining?  
  This avoids label-first debates and exposes whether disagreements stem from core case judgments or downstream reasoning.
