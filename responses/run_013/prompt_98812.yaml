prompt: |-
  I edit a small nonprofit magazine and maybe twice a month someone writes in furious that we, or another writer, "stole their idea" — a pitch we commissioned from someone else, an essay that runs the same argument as their blog post but in different words, a piece built on a structure they claim they invented. I have no lawyer, I have about a week, and the editor-in-chief signs off on whatever I decide. I keep muddling through on vibes and I want an actual procedure.

  The thing I keep running into, and I think its the key: "owning an idea" splits into at least three claims that come apart — control (I get to stop you using it), credit (you have to name me), and priority (I was first, and that matters to my standing) — and every complaint mashes all three together. So write me a decision procedure my team can run on a complaint: the questions to ask in order, what counts as a sufficient answer to each, where it stops with a no, and where it has to hand the call to a person because it's values not facts. Ground it in what the law and the philosophy actually say about why expression is protected but ideas aren't, how plagiarism differs from infringement, when reuse is allowed, and whether it matters that the other person arrived at the idea independently rather than by talking to the complainant. No citations, just the machinery.

  Then run it on three cases: (1) a freelancer says we ran a piece with the same thesis as their unpublished pitch; (2) an academic says a staff writer restated her argument in reworded form; (3) a photographer says we copied her composition. Include at least one where the procedure tells me we're the ones in the wrong, and say plainly what the procedure can't do.
reasoning: |-
  Okay, the user is an editor at a small nonprofit magazine dealing with frequent accusations of idea theft. They need a structured decision procedure to handle these complaints efficiently. Let me start by breaking down their main concerns. They mentioned that complaints often mash together control, credit, and priority. So the procedure needs to disentangle these three claims.

  First, I need to ground the procedure in legal and philosophical principles. Copyright law protects expression, not ideas. Plagiarism is about credit, not legality. Independent creation is a defense against infringement. These points are crucial. The user also wants to know when to stop based on facts and when to involve human judgment.

  The user provided three test cases. I need to apply the procedure to each and show where the magazine might be at fault. Case 3 with the photographer seems likely to be infringement since composition can be expression. That would be the example where they're in the wrong.

  For the procedure, step-by-step questions are key. Start with control: is the complainant claiming ownership beyond what copyright allows? Then credit: is there plagiarism? Priority: did they get there first? But if expression differs, it might not matter. 

  The user mentioned they have no lawyer and a week to respond. The procedure should be quick. Steps should filter out invalid claims early. For instance, if it's just an idea without expression, stop after Step 1. Also, they need clear criteria for when to apologize or credit, even if not legally required.

  In Case 1, the freelancer's unpublished pitch. Since the expression wasn't copied, no infringement. But maybe they need to acknowledge if the pitch was submitted, which touches on ethics. Step 3 would handle that. 

  Case 2, the academic's reworded argument. Ideas aren't protected, so no control. Credit isn't due if not sourced. Priority doesn't grant rights. So the procedure would say no violation. But maybe the magazine should consider citing the academic to avoid bad vibes, though not obligated.

  Case 3, the photographer. Composition as expression could be protected. Need to check if it's a generic scene. If not, Step 1 might flag possible infringement. Then Step 2 checks for copying expression. Here, if the composition is unique, it's infringement. Apology and compensation needed.

  The procedure's limitations: can't resolve subjective claims like "I deserved credit." Also, independent creation is a valid defense. The user needs to know where the procedure ends and judgment begins, like in Step 3's ethical considerations.

  I should ensure the steps are ordered logically. Step 1: Control claim. Step 2: Credit claim. Step 3: Priority claim. Each step has specific questions and exit points. For example, if no expression copied in Step 1, stop. Step 2 handles plagiarism. Step 3 deals with priority and ethics.

  The user wants a clear, actionable process. Including the three test cases demonstrates how it works in practice. Highlighting the photographer case shows accountability. Also, noting that the procedure can't force ethical actions but guides decisions.

  Finally, the conclusion should summarize key points: protect expression, not ideas; plagiarism is separate; priority isn't ownership. Emphasize that most claims won't meet the criteria, but some ethical responses might still be necessary.
answer: |-
  Here's a bulletproof decision procedure grounded in law and philosophy, designed for speed and clarity. It isolates the three claims (Control, Credit, Priority) and filters them sequentially.

  **Core Principles (The Machinery):**
  *   **Expression vs. Idea:** Copyright law protects the *specific expression* of an idea (words, image composition, unique structure), NOT the underlying idea, fact, argument, thesis, or basic structure itself. You can't own "an argument about climate policy" or "a profile structure using flashbacks."
  *   **Infringement vs. Plagiarism:**
      *   **Infringement (Control):** Illegal copying of *protected expression*. Requires access + substantial similarity. Defenses: Independent creation, fair use, idea/expression merger (if the idea can *only* be expressed one way).
      *   **Plagiarism (Credit):** Ethical failure of presenting *someone else's work or ideas* as your own without proper attribution. *Not* inherently illegal (though it can overlap with infringement). Can occur even with rewording if the core intellectual contribution isn't credited.
  *   **Priority:** Being "first" with an idea grants *no inherent legal rights* to control or credit its future use by others. It matters *only* in determining if copying was possible (for infringement) or if credit is ethically due (for plagiarism). Independent creation defeats priority claims for infringement.
  *   **Independent Creation:** If someone genuinely creates similar work without access to the complainant's work, it's *not* infringement, even if identical. Priority becomes irrelevant for control.

  ---

  **The Complaint Triage Procedure**

  **Goal:** Quickly resolve or escalate complaints based on legally/ethically relevant facts. *Focus only on the complainant's specific work and your published piece.*

  **Step 1: Assess the CONTROL Claim (Infringement - "You stole my work!")**
  *   **Q1: Is the complainant alleging copying of *specific, concrete expression* (exact/significantly similar wording, unique visual composition, highly distinctive narrative structure) OR just the underlying idea/argument/fact/structure?**
      *   **If Idea/Argument/Fact/Generic Structure:** **STOP. No infringement possible.** Proceed to Step 2 (Credit) and Step 3 (Priority) ONLY for ethical review. *Tell complainant: "Copyright law protects specific expression, not ideas or arguments. We did not copy your protected expression."*
      *   **If Specific Expression:** **Q2: Is there credible evidence of *ACCESS* (e.g., they submitted it to you, it was widely published where your writer could see it)?**
          *   **No Access:** **STOP. No infringement possible (Independent Creation defense).** Proceed to Step 2 (Credit) and Step 3 (Priority) ONLY for ethical review. *Tell complainant: "We found no evidence our creator had access to your specific expression, making infringement legally impossible."*
          *   **Access + Specific Expression Copied:** **POTENTIAL INFRINGEMENT. HANDLE.** This requires human judgment (you/Editor-in-Chief). Consider:
              *   *Substantial Similarity:* Is the copying significant and of protectable elements?
              *   *Fair Use?* (Criticism, commentary, news reporting, transformative use - complex, but often applies to nonfiction).
              *   *Merger Doctrine?* Is the idea and expression inseparable here? If yes, expression isn't protected.
              *   **Outcome:** If infringement likely, *Apologize, potentially remove, potentially negotiate credit/license/compensation.* Consult a lawyer if serious. If not, explain why (fair use, merger, lack of substantial similarity) and proceed to Step 2.

  **Step 2: Assess the CREDIT Claim (Plagiarism - "You didn't name me!")**
  *   **Q3: Does the published piece present *specific, protectable expression OR a highly distinctive, non-obvious idea/structure* originated by the complainant *as if it were the creator's own original contribution* without attribution?**
      *   **No (Generic idea, common knowledge, obvious structure, different expression):** **STOP. No plagiarism.** Proceed to Step 3 ONLY if complainant insists priority matters ethically. *Tell complainant: "While topics and arguments may overlap, the expression and presentation are distinct. Standard practice does not require crediting everyone who holds a similar view or uses a common structure."*
      *   **Yes (Specific expression copied verbatim/near-verbatim OR unique structure/insight presented as original):** **PLAGIARISM FOUND. HANDLE.** Human judgment needed on severity/response. *Action: Issue correction/crediting prominently ("This section draws on the work of [Complainant]..."). Apologize. Review internal processes.* If involved specific expression copying, this should have been caught in Step 1 (Infringement).

  **Step 3: Assess the PRIORITY Claim (Standing - "I was first!")**
  *   **Q4: Was the complainant genuinely first with a *non-obvious idea, argument, or distinctive structure* that your piece replicates, AND is there a reasonable expectation that credit/acknowledgement would be expected in this field/context?** (This is purely ethical/value-based)
      *   **No (Obvious idea, common argument, generic structure, independent creation clear):** **STOP. No ethical obligation.** *Tell complainant: "Many people arrive at similar ideas independently, especially on current topics. Being first with an idea does not confer ownership or an automatic right to credit in published work using different expression."*
      *   **Yes (Novel/unique insight, distinctive approach, field where provenance matters - e.g., some academic/scientific niches):** **ETHICAL OBLIGATION POSSIBLE. HANDLE.** Human judgment needed. *Consider:* Was it truly novel? Was independent creation plausible? Would credit cost anything or undermine the piece? *Action:* Often best to add a brief acknowledgement ("Similar arguments were advanced by [Complainant]...") as a courtesy, even if not legally/plagiarism required. Builds goodwill. *Tell complainant:* Explain decision (credit added, or why not).

  ---

  **Procedure Limitations:**
  1.  **Cannot resolve subjective "bad vibes" or feelings of unfairness** if no concrete expression, plagiarism, or strong ethical priority exists.
  2.  **Cannot prove a negative (Independent Creation)** definitively without investigation, but lack of access evidence shifts burden.
  3.  **Cannot adjudicate disputes over who *truly* originated a common idea** in the ether.
  4.  **Ethical judgments (Step 3)** remain subjective; the procedure flags *when* a human needs to make that call.
  5.  **Does not prevent complaints;** provides a defensible, principled response.

  ---

  **Applying the Procedure to Your Cases:**

  **Case 1: Freelancer - Same thesis as unpublished pitch.**
  *   **Step 1 (Control):** Q1: Thesis = **Idea**. Not protectable expression. **STOP. No infringement possible.** (Proceed to Step 2/3 ethically).
  *   **Step 2 (Credit):** Q3: Replicating an *unpublished thesis* via different expression? Generally **No plagiarism.** Thesis is an idea. **STOP.** (Proceed to Step 3 if priority claimed).
  *   **Step 3 (Priority):** Q4: Unpublished pitch to your magazine? **Yes, priority likely, ethical obligation plausible.** HANDLE.
      *   *Human Judgment:* They submitted it *to you*. While ideas aren't owned, there's an implicit professional courtesy regarding pitches *under consideration*. Strong ethical case for acknowledgement if the commissioned piece directly resulted from *their* pitch sparking the idea *at your magazine*, even if expression differs. *Action:* "We commissioned this piece exploring a thesis initially brought to our attention by [Freelancer] in their pitch." Apologize for not communicating clearly if their pitch was rejected *then* this was commissioned.
      *   **OUTCOME: YOU WERE IN THE WRONG (ethically).** The procedure flags this for human handling in Step 3 due to the submission context creating an expectation.

  **Case 2: Academic - Staff writer restated argument in reworded form.**
  *   **Step 1 (Control):** Q1: Restated *argument* = **Idea**. Different words = different expression. **STOP. No infringement.**
  *   **Step 2 (Credit):** Q3: Restating a known academic's *argument* in different words? **No plagiarism** *unless* the academic presented a uniquely distinctive framework/theory that the writer presented as their own novel insight. Likely just engaging with ideas. **STOP.**
  *   **Step 3 (Priority):** Q4: Academic published the argument first? **Yes, priority.** But Q4b: Is credit *expected*? In popular writing restating academic arguments for a general audience? Usually **No strong ethical obligation** for direct credit unless relying *heavily* on their specific framing or research. Common practice is engagement, not footnoting. **STOP. No ethical obligation.**
      *   *Possible Human Nuance:* If the staff writer *directly relied* on that specific academic's paper/book for the core argument, a "Drawing on work by [Academic]..." might be a good *practice*, but the procedure doesn't mandate it here. *Action:* Explain that ideas are freely discussible with new expression. No apology/credit legally or ethically required.

  **Case 3: Photographer - Copied her composition.**
  *   **Step 1 (Control):** Q1: **Specific Expression** (Composition - arrangement of elements, lighting, angle, perspective in a photo is protectable). Q2: **ACCESS?** (Was her photo published where your photographer could have seen it? Or submitted to you?) *Assume Access for this case.*
      *   **POTENTIAL INFRINGEMENT. HANDLE.**
      *   *Human Judgment:* Is the composition *highly distinctive and original*? Or a common/generic view (e.g., the Eiffel Tower from Trocadero)? Is it *substantially similar*? If distinctive and similar, **INFRINGEMENT LIKELY.** If generic scene, "merger" might apply (idea of photographing X from Y can only be expressed one way). *Action:* If infringement likely, *Apologize, remove image, negotiate license/credit/compensation.* Serious issue.
  *   **Step 2 (Credit):** If infringement found, plagiarism is automatic (using their work without permission/credit). HANDLE via Step 1 resolution.
  *   **Step 3 (Priority):** Handled within Step 1 (Access/Potential Copying).
      *   **OUTCOME: POTENTIALLY IN THE WRONG (legally & ethically).** Procedure flags for immediate human handling in Step 1 due to protectable expression.

  This procedure cuts through the emotional "they stole my idea!" confusion by forcing analysis of *what kind of claim* is actually being made and *what kind of protection* applies. It protects your magazine legally and reputationally while providing clear pathways for when and how to make amends. Remember: Document decisions and communications.
