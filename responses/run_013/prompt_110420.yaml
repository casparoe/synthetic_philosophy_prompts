prompt: |-
  I sit on the advisory board of a foundation that is about to commit eight postdoctoral fellowships, three years each, to conceptual work on the distribution of consciousness across animals. The remit is deliberately narrow: philosophy and theory, no new experiments, and nothing on human consciousness except where it constrains the animal case. The board has to choose what the cohort works on, and we have concluded that three or four questions funded properly beat a dozen funded thinly.

  Our difficulty is a mismatch. The demand side -- welfare law, slaughter and transport rules, the steady push of legal protection further out along the tree of life -- wants a distribution: a verdict, taxon by taxon, about who is in and who is out. The supply side offers theory-laden markers, capacities that dissociate across taxa, and a concept of consciousness that may be graded, cluster-like, or too coarse to yield determinate verdicts at the margins. I would rather have a definite ordering I can argue with than a menu of considerations.

  Please set the agenda. Candidates I want you to weigh, along with any you would add:

  - Determinacy: whether there is a fact of the matter about borderline taxa at all, or whether "consciousness" is the kind of concept whose extension is partly fixed by our interests, so that some cases are unsettled rather than merely unknown.
  - The cluster problem: the capacities we treat as evidence in humans -- flexible attention, cross-modal integration, metacognition, valenced experience -- come apart in invertebrates and in simple vertebrates. What follows when they dissociate, and should any one of them be treated as load-bearing?
  - Marker calibration: every behavioral or neural marker is validated against human report, so applying it to a fish or an insect assumes a bridge we have not built. Is there any non-circular way to fix what a marker is a marker of?
  - Testability: whether any current theory of consciousness could, even in principle, be confirmed or refuted in a non-human animal, given that we observe only structure and behavior -- and whether that renders the enterprise unfalsifiable.
  - The target: phenomenal consciousness, sentience, valenced experience, or access -- and whether the ethically urgent question is the same as the theoretically tractable one. A colleague proposes that we drop consciousness as the criterion altogether and fund work on which states matter to an animal from the inside, whatever the metaphysics turns out to be. I cannot tell whether that is a clarification or a change of subject, and I would like you to say.

  Name the three questions you would fund, ranked, plus at most one you would fund only if the first three proved intractable. For each, say why it is upstream of the others, how tractable it is for philosophers rather than experimentalists, and how neglected it currently is. I want the ordering defended, not surveyed; I am not asking for a reading list.

  Format the response as follows: "Where the difficulty actually lies" (~200 words), diagnosing the mismatch and what it implies for what we should fund; "The agenda" (~500 words), the ranked questions with a short case for each; "Why this order" (~300 words), stating the criteria you used -- upstreamness, tractability, neglectedness, how much downstream work depends on the answer -- and the trade-offs between them; "What would change the ranking" (~200 words), naming the argument or evidence that would move a question up or down; and "Where this is most likely wrong" (~150 words), identifying the step in your reasoning most likely to fail and what would lead you to a different verdict.
reasoning: |-
  Okay, the user is on an advisory board for a foundation funding postdoctoral fellowships on animal consciousness distribution. They need to prioritize three research questions, plus one backup. The core issue is the mismatch between practical demands for clear taxonomic verdicts and the theoretical supply side that's messy and indeterminate. 

  Hmm, they've listed five candidate issues: determinacy, cluster problem, marker calibration, testability, and defining the target (phenomenal vs access consciousness). Their colleague even suggests sidestepping "consciousness" entirely for "what matters from the inside." That last point feels ethically urgent but philosophically slippery—is it reframing or evasion?

  First, I need to diagnose why this mismatch exists. The legal/policy side wants binary in/out decisions, but consciousness likely isn't binary. It's probably graded, multidimensional, and tied to imperfect proxies. Philosophers keep offering frameworks instead of answers because that's where the conceptual knots are. Funding should untangle those knots first.

  For agenda-setting, upstreamness is key. Marker calibration (#3) feels most foundational—if we can't trust our detection methods, everything downstream collapses. It's also highly tractable for philosophers (analyzing inference validity) and neglected (researchers assume markers transfer unproblematically). 

  Next, the cluster problem (#2): when consciousness markers dissociate in animals, which matter? This directly impacts determinacy but addresses dissociation before debating whether indeterminacy is metaphysical or epistemic. Philosophers excel at conceptual mapping here.

  Third, the target question (#5)—phenomenal vs access? Ethically, valence matters most. But if we define the target poorly, we'll misplace markers. This must precede testability (#4), which becomes moot if we're detecting the wrong thing.

  Why this order? Calibration → cluster → target creates a logical cascade: validate tools → interpret conflicting results → clarify what we're even looking for. Testability (#4) is the backup—it's crucial but less urgent if markers are invalid. Determinacy (#1) isn't funded because it might dissolve after solving #2 and #3: dissociated markers may explain borderline cases without invoking semantic indeterminacy.

  What would change rankings? If new evidence showed certain neural markers are evolutionarily conserved (e.g., homologous structures across vertebrates/invertebrates), marker calibration becomes easier, bumping down. If philosophers convincingly argue that valence is inseparable from access consciousness, the target question simplifies, dropping in priority.

  Biggest risk? Overprioritizing calibration might stall progress if it's truly intractable. If so, pivot to the cluster problem—it might yield practical guidance even without perfect markers. Also, sidelining determinacy could backfire if borderline cases resist resolution, forcing us to confront whether consciousness is inherently fuzzy. But we’ll cross that bridge if markers and clusters don’t deliver.
answer: |-
  ### Where the difficulty actually lies
  The core mismatch arises because welfare policy demands discrete, taxonomic verdicts ("conscious or not"), while consciousness science supplies multidimensional, theory-dependent capacities that dissociate across species and resist binary classification. This isn't merely an epistemic gap but a conceptual one: the target phenomenon may be graded, cluster-like, or metaphysically indeterminate at margins. Funding proposals that ignore this structural tension will fail. We must prioritize questions that directly address whether—and how—determinate distribution is even possible, rather than forcing premature answers. The agenda should resolve foundational ambiguities before attempting applications, as policy demands cannot be met by merely refining existing markers if the underlying framework is fractured.

  ### The agenda
  **1. Marker calibration: Is there a non-circular method to validate consciousness indicators in non-human animals?**  
  *Why fund:* All empirical and theoretical work depends on validated markers. Current markers (e.g., neural complexity, behavioral flexibility) are calibrated against human report, creating a circularity when applied to non-linguistic species. Philosophers can dissect inference patterns (e.g., analogical vs abductive reasoning), evaluate non-circular validation proposals (e.g., evolutionary continuity, causal structure mapping), and determine if interspecies marker calibration is *possible in principle*. This is upstream of all other questions: without reliable detection, theories remain untestable and dissociations uninterpretable. It’s highly tractable for philosophers (conceptual analysis, philosophy of science) yet neglected—most debates assume markers *are* valid.  

  **2. The cluster problem: What follows when consciousness-related capacities dissociate across taxa?**  
  *Why fund:* Capacities like metacognition or valence dissociate in invertebrates (e.g., bees show cross-modal integration but lack mammalian-like self-monitoring). Philosophers can analyze whether dissociation implies: (a) partial consciousness, (b) wholly non-conscious processing, or (c) multiple consciousness "types." This clarifies whether consciousness is a unified natural kind or a cluster concept. It’s upstream of determinacy and testability—if dissociation voids standard markers, verdicts at margins collapse. Philosophers excel at parsing conceptual dependencies (e.g., "Is valence necessary for sentience?") and modeling graded/cluster theories. Neglected in favor of vertebrate-centric frameworks.  

  **3. The target: Is the ethically urgent aspect (valenced experience) separable from the theoretically tractable one (e.g., access consciousness)?**  
  *Why fund:* Welfare concerns valence (suffering/pleasure), but many theories target cognitive access or global workspace. Philosophers can rigorously define "mattering from the inside" and evaluate whether it maps cleanly to phenomenal consciousness—or requires independent criteria (e.g., intensity, persistence). This is upstream ethically and theoretically: misidentifying the target misdirects all applications. Highly tractable via conceptual ethics and metaphysics. Neglected in animal literature, where "consciousness" is often ambiguously bundled.  

  **Backup if intractable: Testability**  
  *Why fund only if others stall:* If calibration/cluster/target issues remain unresolved, testability becomes critical. Philosophers could determine if structural/behavioral evidence *could* confirm theories (e.g., IIT vs GNW) in animals, or if the enterprise is unfalsifiable. But this presumes markers and targets are settled—hence lower priority.  

  ### Why this order  
  Ranked by **upstreamness**, **tractability for philosophers**, and **neglectedness**, weighted against **downstream impact**:  
  1. **Marker calibration** is maximally upstream: no progress on distribution is possible without validated detection tools. Its answer constrains all other work (e.g., dissociation cases are uninterpretable with invalid markers). Philosophy directly addresses its conceptual circularity.  
  2. **Cluster problem** depends partly on valid markers (#1) but resolves dissociation ambiguities needed for determinacy/testability. It’s more tractable than testability, as it requires conceptual mapping, not full theory falsification.  
  3. **Target** focuses the ethical imperative but assumes we can detect *something* (via #1). It’s tractable via analytic methods and avoids experimental gaps.  
  **Trade-offs**: Determinacy (#1 candidate) was excluded as it likely *follows* from #1–3: if markers are valid and clusters coherent, borderline cases may resolve. Testability (#4) is less urgent—if markers fail (#1), theories are untestable regardless.  

  ### What would change the ranking  
  - **Move Marker Calibration down** if compelling non-circular validation emerges (e.g., a rigorous evolutionary account linking neural architectures to subjective states across phyla).  
  - **Move Cluster Problem up** if new dissociation evidence (e.g., octopus pain without affective behavior) forces urgency.  
  - **Move Target to #1** if philosophers convincingly argue that valence is empirically tractable *without* resolving markers (e.g., via ecological necessity arguments).  
  - **Include Determinacy** if consensus forms that semantic indeterminacy (not ignorance) blocks progress.  

  ### Where this is most likely wrong  
  The greatest risk is overestimating **Marker Calibration’s tractability**. If non-circular validation is impossible (e.g., all markers inherently anthropocentric), the project stalls. This would shift focus to the **Cluster Problem** as a fallback: if we can’t validate markers, we might still prioritize capacities with independent ethical weight (e.g., valence). However, this risks conflating correlation with essence. Evidence of this failure would be persistent inability to resolve debates (e.g., insect sentience) despite improved data—suggesting calibration is philosophically intractable.
