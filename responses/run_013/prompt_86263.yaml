prompt: |-
  I'm leading a reading group on medieval political thought next week and I've hit a snag in the sedition question in the Summa (II-II q.42 a.2) that I can't think my way out of. I've stitched together the bits I care about below, all from the same article.

  Objection 3: "Further, it is praiseworthy to deliver a multitude from a tyrannical rule. Yet this cannot easily be done without some dissension in the multitude, if one part of the multitude seeks to retain the tyrant, while the rest strive to dethrone him. Therefore there can be sedition without mortal sin."

  From the body of the article: "Those, however, who defend the common good, and withstand the seditious party, are not themselves seditious, even as neither is a man to be called quarrelsome because he defends himself..."

  Reply to objection 1: "It is lawful to fight, provided it be for the common good, as stated above (II-II:40:1). But sedition runs counter to the common good of the multitude, so that it is always a mortal sin."

  Reply to objection 3, as far as my copy goes: "A tyrannical government is not just, because it is directed, not to the common good, but to the private good of the ruler, as the Philosopher states (Polit. iii, 5; Ethic. viii, 10)."

  (My paste of that last reply cuts off right there, annoyingly.)

  And from earlier in the question, his definition: "sedition, in its proper sense, is between mutually dissentient parts of one people, as when one part of the state rises in tumult against another part."

  What I can't get straight: he says sedition is always a mortal sin, and he doesn't seem to be treating the tyrant case as an exception to that rule -- its that the tyrant case simply isn't sedition. But then what work is the argument in the reply actually doing? Is it a definitional dodge (sedition just means disorder aimed against the common good, so anything aimed at the common good can't be sedition by definition, and the always-mortal claim goes through vacuously), or is it a substantive judgement that resistance to a tyrant really does serve the common good? And if it's the first, does the whole thing become circular -- whoever wins gets to say they were defending the common good, since his test for defending the common good seems to be that you're on the side that isn't disturbing the peace?

  Second thing, smaller: given that he defines sedition as being between parts of one people, does a unilateral uprising by one part against the ruler even fit the definition, or does it only count as sedition once the rest of the multitude splits over it? The objection seems to assume the latter (it's the split over whether to keep the tyrant that generates the dissension), but the reply doesn't obviously need that assumption.

  Could you walk me through this -- what the reply is really claiming, which reading of it the text supports, and what a good objection to it would look like? I don't need a summary of his views on rebellion in general, I know that part; it's this specific bit of machinery I'm stuck on.
reasoning: |-
  Okay, let me start by unpacking the user's problem. They're leading a reading group on medieval political thought and are stuck on Aquinas' treatment of sedition in the Summa, specifically II-II q.42 a.2. The core confusion revolves around whether Aquinas' stance on sedition being always a mortal sin is circular or substantive, and how the tyrant example fits into his definition.

  First, I need to recall Aquinas' structure here. The user provided Objection 3, which argues that removing a tyrant might involve dissension but isn't sinful. Aquinas responds by distinguishing sedition from just resistance. The user is worried that Aquinas might be defining sedition in a way that makes his "always sinful" claim tautological. They also question if resistance against a ruler counts as sedition only when the populace is divided.

  The key is Aquinas' definition: sedition is conflict between parts of the people. So, if one part rises against a tyrant, and the tyrant is acting outside the common good, that uprising isn't sedition because the ruler isn't part of the "people" in the same way. The common good is central here. Aquinas uses the tyrant's deviation from the common good to justify resistance as non-seditious.

  The user's circularity concern: Aquinas isn't saying whoever wins defines the common good. Instead, he has an objective standard based on natural law. The common good isn't determined by outcome but by whether the action aligns with justice. So, the reply to Objection 3 uses Aristotle to establish that tyranny isn't just, thus resistance against it serves the common good.

  On the second point about unilateral uprising: Aquinas' definition requires mutual dissent between parts. If only one faction opposes the tyrant without internal division, it might not fit sedition. But the objection assumes division occurs, so Aquinas addresses that scenario. His reply implies that the side supporting the tyrant might be seditious if they defend a private good, but the resisters aren't.

  The user needs clarity on whether Aquinas' argument is definitional or substantive. It's both: the definition sets the boundary, but the substantive judgment (tyranny vs. common good) determines which side is seditious. The user might also want to present objections in their group. A good objection could challenge the objectivity of the common good or question how to impartially determine which side is just without hindsight.
answer: |-
  Let's dissect Aquinas' argument step by step to resolve your snag. The core tension arises from his claim that sedition is *always* a mortal sin, juxtaposed with his apparent endorsement of resisting tyranny. The key lies in his **definitional precision** and **teleological framework** (common good), not circularity.

  ### 1. **Aquinas' Core Argument & Definition**
     - **Definition:** Sedition is "between mutually dissentient parts of one people" and is *defined* as "running counter to the common good" (II-II q.42 a.1). It is inherently sinful because it fractures the unity essential for the common good.
     - **The "Always Sinful" Claim:** This follows *from the definition*. If an act is truly "seditious," it opposes the common good by definition. It’s not a tautological dodge but a **categorical statement**: acts that fracture the common good are always gravely sinful.
     - **The Tyrant Exception:** Aquinas doesn’t treat tyranny as an *exception* to sedition. Instead, he argues resistance to tyranny **isn’t sedition at all**. Here’s why:
       - A tyrant, by definition, rules for "private good" (not common good), per Aristotle (Reply Obj. 3).
       - Therefore, resisting the tyrant is **defending the common good** (Body of the article).
       - Since sedition requires conflict *between parts of the people*, and the tyrant has *alienated themselves* from the people by ruling unjustly, resistance isn’t "sedition" but **lawful defense** (Body: "those who defend the common good [...] are not themselves seditious").

  ### 2. **How Reply to Obj. 3 Works**
     The objection claims deposing a tyrant causes dissension and thus might justify sedition. Aquinas responds:
     - **Step 1:** Tyranny is unjust (as defined by Aristotle) → It opposes the common good.
     - **Step 2:** Resisting tyranny restores the common good → It is "lawful to fight for the common good" (citing II-II:40:1 on just war).
     - **Step 3:** Dissension *caused by this resistance* is not "sedition" because:
       - The resisters are *not* a "part of the people" fighting *another part*; they are the people defending themselves against an **external threat** (the tyrant who has forfeited legitimacy by ruling unjustly).
       - If a faction *supports* the tyrant, *they* may be seditious (since they uphold private over common good), but the resisters are not (Body: "withstand the seditious party").

     → **The work this reply does:** It provides a **substantive criterion** (does the act serve the common good?) to determine whether dissension qualifies as "sedition" under Aquinas' strict definition. It is **not circular** because:
     - The "common good" is an **objective standard** for Aquinas (rooted in natural law), not defined by who wins.
     - Whether resistance serves the common good depends on the **tyrant’s actions** (ruling for private gain), not the outcome of the conflict.

  ### 3. **Your Second Question: Unilateral Uprising & Definition**
     Aquinas defines sedition as occurring *between parts of the people*. This implies:
     - If **only one faction rebels against the ruler** *and the rest of the people remain united* (either supporting the ruler or neutral), it may not fit his definition of sedition. It could be simple rebellion or treason.
     - **But in the tyrant scenario (Obj. 3)**, the objection assumes the multitude **splits** ("one part seeks to retain the tyrant, while the rest strive to dethrone him"). Aquinas *concedes* this dissension occurs but argues:
       - The faction supporting the tyrant is seditious (since they uphold a regime opposed to the common good).
       - The faction resisting is *not* seditious because they defend the common good.
     - **Key takeaway:** Aquinas’ reply **relies on the split described in the objection**. He doesn’t address unilateral revolt here because the objection frames it as internal dissension.

  ### 4. **A Strong Objection for Discussion**
     Aquinas avoids circularity by invoking an objective "common good," but a potent objection challenges **epistemic access** to that good:
     > *"Aquinas assumes we can objectively identify when a ruler becomes a 'tyrant' and when resistance serves the 'common good.' But in practice, every faction claims its cause is just. If sedition is defined by opposition to the common good, and only the 'winning side' gets to define the common good post-conflict, then Aquinas' framework is functionally circular. It provides no impartial standard for evaluating factions *during* the conflict, rendering the 'always sinful' claim unhelpful for resolving real political disputes."*

     **Why this hits hard:** It forces the group to grapple with how Aquinas’ theological framework (reliant on natural law and right reason) applies in a fallen world where human judgment is fallible and power shapes perception.

  ### Summary for Your Reading Group
  | **Aquinas' Claim**          | **Resolution**                                                                 |
  |-----------------------------|--------------------------------------------------------------------------------|
  | Sedition is always mortal sin | By definition: sedition opposes the common good.                              |
  | Resisting tyranny is licit  | Not sedition, as tyranny voids legitimacy; resistance defends common good.    |
  | Circularity?                | No. Common good is objective; resistance is judged by justice of the cause.   |
  | Unilateral uprising?        | Only sedition if it splits the people; resisting a tyrant is defense, not sedition. |

  **Discussion Prompts:**
  1. Can Aquinas’ "common good" standard be applied objectively in real conflicts, or does it collapse into "might makes right"?
  2. If sedition requires *mutual* dissent, does this imply Aquinas only condemns civil wars, not revolutions against universally hated tyrants?
  3. How does his treatment of tyranny here cohere with his wider views on obedience (e.g., II-II q.104)?

  This machinery hinges on Aquinas' teleological ethics: acts are defined and judged by their end (common good). The tyrant’s sin transforms resistance from sedition into defense. Your group’s snag is classic—congrats on hitting a profound tension in medieval thought!
