prompt: |-
  So my buddy and I got into it for like three hours last night about whether it even matters that a model's assumptions are false. He's got the whole Milton Friedman thing in his head — his line was basically that the more important a theory is, the less its assumptions have to look like reality, that asking whether the assumptions are realistic is sort of a category mistake, they're just useful fictions and the only test is whether it predicts. I'm on the other side: if your assumptions are false I don't think you actually understand whats going on, and any predictive success is luck that won't survive outside the sample you fit.

  We went in circles for hours. So write the document we should've produced instead — the joint statement the two of us could actually both put our names to. The kind of thing two camps that have been talking past each other write down after they finally sit in the same room.

  What I want in it:

  A numbered list of claims we both accept — about what models are for, what predictive success can and can't show, what "realistic" even means, whether explanation and prediction come apart. Don't pad it with stuff nobody would deny; if a claim is one we'd both shrug at, cut it.

  Then a table of where we actually still disagree. For each row, write my position in wording I'd accept and his position in wording he'd accept — don't strawman either side. And if you think part of our fight was just verbal (like one of us means "approximately true" and the other means "literally true," or we're using "assumption" for two different things), say which part and why.

  Then the cruxes: the sub-questions such that if we actually settled one, one of us would have to move. For each crux, give a test or case we'd BOTH agree bears on it, and write down each of our predictions about it in advance.

  Two things I specifically want made into cruxes, cause this is where we got most stuck:

  First: is there a real difference between an assumption thats an idealization — frictionless planes, perfectly spherical cows, stuff you can see as a limit of something real — and an assumption thats just false, like every agent in the market is a perfectly rational calculator with unlimited time? He says no, false is false, deal with it. I say the second kind is the dangerous one. Give us a shared test.

  Second: does it change anything if the model is only trying to show something *could* happen — a possibility proof, where the assumptions just have to be coherent — versus a model thats supposed to tell us what will happen in a real system? Seems to me those are held to totally different standards and he keeps sliding between them. If you agree, make that a crux too.

  Also make us both commit in advance to what would actually change our minds. Concretely: suppose a model with a known-false assumption keeps making good out-of-sample predictions, and then we de-idealize the assumption bit by bit toward reality and the predictions don't break — does that count for him and against me? Write it out in wording we'd each sign.

  No reading lists or citations please, we're just trying to write the doc ourselves.
