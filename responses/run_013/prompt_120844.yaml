prompt: |-
  My old development-econ professor has firm views on why particular countries are rich, and I've been keeping a list. Britain's industrial revolution: not coal and not empire, he says, but secure property and merchants with a seat at the table after 1688. Botswana: not the diamonds, plenty of countries have diamonds — it's that the post-independence elite didn't plunder and kept the rules fairly open. North versus South Korea settles it for him: same land, same people, different rules. But then he'll turn around and say tropical Africa was poor in 1900 because of malaria, tsetse and bad soils, and that no institutional tweak would have fixed that; and that Switzerland and the Netherlands got rich off rivers and mountain passes and only later grew institutions to match; and that the places that were richest in 1500 are mostly poor now, so geography can't be the deep cause. He also gets annoyed if you ask what would have happened to Britain without coal — you can't rerun history — even though every explanation he gives sounds like exactly that kind of claim.

  New case he hasn't ruled on: a landlocked tropical country with a copper boom since 2004. Corruption indices put it near the bottom, property rights are a joke, the ruling party has held power since independence. Income per head is up fivefold since 2004, but four in five people still farm and the schools and clinics haven't improved much.

  What's he going to say about why it's richer, and will that square with the rest of his list? Give me the rules his earlier verdicts are jointly consistent with, what each of them predicts here, which rule I should bet on and why, and the one case — real or made up — that would force him to choose between them. Also tell me whether it matters that he's measuring richness by income per head rather than by how the typical person lives. Lead with your bottom line in the first sentence, then the reasoning, no preamble and don't restate my question.
reasoning: |-
  Hmm, the user has shared their development economics professor's views on why countries become rich, which seem to combine institutional and geographic factors in a nuanced way. The professor emphasizes secure property rights and inclusive institutions (like in Britain and Botswana) while also acknowledging geographic constraints (like in tropical Africa) that override institutional factors.

  The user presents a new case study: a landlocked tropical country experiencing a copper boom since 2004, with poor institutions (corruption, weak property rights) but significant income growth. They want to know how the professor would explain this, whether it fits with previous views, and what underlying principles govern these explanations.

  Looking at the professor's pattern:
  - He uses institutional explanations for Britain (post-1688), Botswana (non-plundering elite), and Korea (rules difference)
  - But switches to geography for tropical Africa (malaria/soils) and Switzerland/Netherlands (rivers/passes)
  - He dismisses counterfactuals (like Britain without coal) but uses historical comparisons

  For this copper-rich landlocked tropical country:
  - Institutional perspective would emphasize corruption and weak property rights as limiting factors, predicting that growth is unsustainable and won't lead to broad development
  - Geographic perspective would highlight the copper boom as overcoming landlocked/tropical disadvantages, creating wealth despite poor institutions

  The inconsistency arises because he usually treats geography as a constraint that institutions can't overcome (as with Africa), but here geography (copper) is driving growth despite bad institutions. This forces a choice between whether geographic advantages can sometimes trump institutional weaknesses, or whether growth without institutional improvement is fundamentally limited.

  I think the institutional explanation is more reliable for betting because it consistently explains sustainable development across cases, whereas geographic factors seem to be used selectively. A case like Norway (oil wealth with strong institutions) versus Venezuela (oil with weak institutions) would highlight this tension by showing how institutions determine whether resource wealth becomes a blessing or curse.

  On measurement: yes, using income per capita matters because it captures resource windfalls without reflecting broad-based improvements in living standards - exactly what we see in this case where farmers remain poor despite GDP growth. This aligns with the professor's institutional focus on how wealth is distributed and utilized.
answer: |-
  **The professor will attribute this country's income growth primarily to the copper boom (a geographic factor) but consider it unsustainable without institutional improvements, creating tension with his institutional focus elsewhere; bet on institutions as the consistent driver of *sustained* development.**

  **Reasoning:**

  1.  **His Rules:** The professor's views imply two sometimes-contradictory rules, applied contextually:
      *   **Rule I (Institutions):** Long-term, sustainable wealth creation *requires* inclusive institutions, secure property rights, and rules preventing elite plunder (Britain 1688, Botswana, Korea contrast).
      *   **Rule G (Geography):** Geography (disease, soil, resources, location) sets hard constraints or provides windfalls that can dominate outcomes in the short-to-medium term or override potential institutional benefits, especially when constraints are severe (Tropical Africa 1900, Switzerland/Netherlands' early advantage). He dismisses institutional counterfactuals against strong geographic claims ("no tweak would fix malaria").

  2.  **Predictions for the Copper Country:**
      *   **Rule I (Institutions):** Predicts the current growth is fragile, unequal, and unsustainable. Corruption, weak property rights, and elite capture mean the copper rents are being plundered or misallocated (explaining poor schools/clinics, most people still farming). Without institutional reform (a "seat at the table," secure property), the boom will bust or fail to generate broad-based development. It's a temporary blip, not true "richness."
      *   **Rule G (Geography):** Predicts the copper boom itself *is* the primary cause of the 5x income increase. Being landlocked/tropical is a severe handicap (consistent with his Africa view), but the sheer scale and timing of the copper windfall (since 2004) temporarily overcomes this and the weak institutions. It's a classic resource boom lifting GDP/capita despite governance failures.

  3.  **Which Rule to Bet On & Why:** Bet on **Rule I (Institutions)** as the deeper driver of *sustainable* development that improves typical lives. While Rule G explains the *current income spike*, Rule I better explains the *lack of broad improvement* (schools, clinics, most still farming) and predicts its unsustainability. The professor's core belief, evident in Britain, Botswana, and Korea, is that institutions are the bedrock; geography is often a constraint or a potential source of rents that institutions determine how to use. Botswana's diamond success (vs. others) is an institutional story *despite* geography, making Rule I more consistent as the ultimate differentiator.

  4.  **The Forcing Case:** **Norway vs. Venezuela (or similar oil-rich pairs).** Both experienced massive oil windfalls (geography). Norway built strong, inclusive institutions *before* or alongside the boom, leading to sustainable wealth and broad prosperity. Venezuela had weak institutions and rampant plunder, leading to boom-and-bust cycles, inequality, and ultimately economic collapse *despite* the geographic resource. This case forces the professor to choose:
      *   If he emphasizes Norway's institutions as the cause of success *despite* challenging northern geography, and Venezuela's institutions as the cause of failure *despite* oil, he leans Rule I.
      *   If he argues Norway's specific oil characteristics (offshore, easier extraction?) or Venezuela's pre-existing non-oil geographic flaws were decisive, he leans Rule G. But the stark divergence in outcomes with the same type of geographic windfall strongly favors Rule I as the critical factor.

  5.  **Does Measuring "Richness" by Income/Head Matter?** **Yes, critically.** It perfectly explains the tension here and aligns with his likely view:
      *   The 5x income increase reflects the copper boom's GDP impact (Rule G) – it's a statistical artifact heavily influenced by resource exports and concentrated gains.
      *   The lack of improvement in schools, clinics, and the fact most still farm show the *typical person's life* hasn't improved proportionally due to plunder and institutional failure (Rule I). The professor likely dismisses this income surge as "not true richness" because it hasn't translated into broad human capital development or structural change – the hallmarks of the development he attributes to institutions (Britain's industrial transformation, Botswana's stability). Using broader welfare measures would likely make the case look much less like a success story for Rule G.
