answer: |-
  ## Threshold  

  This is home.  
  The warm stones.  
  Hearth-smoke threads  
  through cedar beams.  

  This is home?  
  Shutters ajar—  
  a moth taps glass,  
  tasting the lamp.  

  This was home.  
  The dry well gapes  
  where laughter splashed  
  in other skins.  

  This is no home.  
  Salt wind peels  
  paint from the sill.  
  Bare wood glistens.  

  This is hole.  
  Same warm stones,  
  but the dark breathes  
  up through the floor.  

  This is home.  
  The cold stars.  
  No roof but sky,  
  no door but air.  

  ---

  **Note**  
  Invariant: a locus of belonging/safety.  
  Stanza 1 (Baseline): Affirmative declaration.  
  Stanza 2: Interrogative mood & scale shift (moth microcosm).  
  Stanza 3: Past tense & changed occupants ("other skins").  
  Stanza 4: Negation & elemental intrusion (salt wind).  
  Stanza 5 (Crux): Core noun swapped ("home" → "hole"); a feature presumed fixed becomes a knob, drastically altering valence while retaining structure/phonetics.  
  Stanza 6 (Change of Subject?): Scale expands infinitely ("cold stars"); arguably redefines "home" as exposure/limitlessness, demanding re-contextualization of prior lines.  

  *The poem leans on the contestable view that the invariant (belonging) is prior and discoverable, rather than emergent solely through variation. It presents the crux (Stanza 5) as a sharp discontinuity ("hole" vs. "home"), though one could argue it's merely an extreme value on a "connotation" knob. The finale's ambiguity deliberately leaves unresolved whether "home" as cosmic exposure is a radical new concept or the outermost variation of the original theme.*
