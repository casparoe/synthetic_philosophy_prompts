prompt: |-
  I'm a second-year PhD student in sociology, and next week I have to run the session of our department's theory reading group that's devoted to the individualism–holism dispute in social explanation — the question of whether social phenomena must ultimately be accounted for in terms of the beliefs, dispositions, and actions of individual people, or whether some social facts are legitimately explained by other social facts with the individuals left out of the causal story altogether. The group is a mixed crowd of about a dozen: roughly half are quantitative sociologists and demographers who take it as obvious that the individualist demand is just what serious explanation means, and half are historians and ethnographers who find that demand vaguely ideological and suspect it smuggles in a politics. I have seventy-five minutes and a whiteboard, and I don't want to be talking at them for more than a quarter of it. Don't explain the dispute to me — I know it — plan how I should explain it to them.

  Give me the order the pieces have to go in and what depends on what, so that by the time they hear the holist option it doesn't sound like mysticism or a plea for group souls. Tell me the single case to build the session around and what it must have and lack; I had been going to use a bank run, where each depositor's belief that the others will withdraw is itself part of what makes withdrawing rational, but I have a nagging feeling that example quietly rigs the game toward holism, so tell me whether that's right and what I should use instead if it is. Then map the misconceptions this particular crowd will bring or form — I'm anticipating "holism just means believing in group minds," "individualism just means assuming everyone is selfish," and "this is a political quarrel wearing a methodological costume" — and tell me exactly where in the sequence I should head each one off. Finally, give me the one question I can put to the room at the very end that would actually show me whether they can now run the distinction themselves rather than just recite it, and tell me what I should deliberately leave out at this level and announce that I'm leaving out. Keep the whole plan to at most 800 words, and lay the teaching sequence out as a numbered list of moves.
reasoning: |-
  Okay, the user is a PhD student in sociology preparing to lead a reading group on the individualism-holism debate. They need a structured plan to facilitate discussion effectively. 

  First, I need to understand their constraints: 75 minutes, mixed audience of quant researchers and ethnographers/historians, and a strong preference for interactive format. Their key worry is preventing holism from being dismissed as "group soul" mysticism while keeping individualism from being oversimplified as selfish-rationalism. 

  The bank run example they proposed is actually excellent—it elegantly shows how individual rationality depends on collective perception. But they're concerned it's too holism-leaning. I disagree; it's balanced because it starts from individual actions while revealing emergent dynamics. I'll defend keeping it but add a micro-macro transition slide to show the mechanism clearly. 

  For misconceptions: The "group minds" fear must be preempted when defining holism by explicitly rejecting metaphysical claims. The "selfish individualism" myth gets dismantled during the rational choice theory discussion by emphasizing diverse motivations. The "politics disguised as methodology" concern should be addressed upfront by bracketing political implications—though we'll revisit it briefly in Q&A if needed. 

  The core teaching sequence needs to build from concrete case → individualist explanation → its limitations → holist alternative → synthesis. Crucially, the whiteboard must visually track how each layer adds explanatory power. 

  For the closing question, I'm considering something about education systems: "Why might two equally motivated students from different school districts have divergent outcomes?" This forces them to identify when individual traits (motivation) interact with social facts (funding disparities) without reducing to either extreme. 

  I'll deliberately omit: (1) methodological individualism's philosophy roots (beyond Weber), (2) Durkheim's suicide study details (too time-consuming), and (3) structuralism-poststructuralism tangents. Announcing these omissions builds credibility. 

  The pacing breakdown: Max 20min lecture, 45min discussion, 10min wrap-up. Case study discussion must start by minute 15 at latest to keep engagement high. 

  Biggest risk is quant researchers dismissing holism as "unscientific." Pre-counter: During the bank run analysis, highlight how computational social science models (e.g., agent-based simulations) formalize exactly these emergent dynamics—making holism mathematically tractable.
answer: |-
  Here’s a focused 75-minute plan centered on a neutral case study, structured to preempt misconceptions and build understanding through dialogue. Total words: 790.

  ---

  ### **Teaching Sequence (75 mins)**
  1.  **Framing the Problem (5 mins)**  
      *Whiteboard:* Draw a continuum: "Individual Actions" ←→ "Social Facts".  
      *State:* "Today’s core question: Can social facts *legitimately* explain other social facts without tracing every step back to individuals? We’re exploring *explanatory autonomy*, not group minds. Politics bracketed for now—focus on logical structure."  
      *Preempts:* "Political quarrel" misconception by explicitly bracketing it.

  2.  **Introduce the Case: "The Collapsing Commute" (10 mins)**  
      *Case:* A city’s public transport system declines over 5 years (delays, overcrowding, safety fears). Individual choices: Commuters switch to cars. Outcome: Traffic gridlock, air pollution, bankrupt transit agency.  
      *Why this case?*  
      - *Has:* Clear individual actions (commuters opting for cars) + clear social facts (system decline, pollution, bankruptcy).  
      - *Lacks:* Obvious "collective intentionality" (no conspiracy; no "group soul").  
      *Ask:* "What explains the gridlock?" (Let them brainstorm briefly—note responses on board).

  3.  **Individualist Explanation (15 mins)**  
      *Build step-by-step:*  
      1. Commuters experience delays → form belief "transit is unreliable".  
      2. Belief + desire for efficiency → decision to drive.  
      3. Aggregate outcome: Gridlock.  
      *Emphasize:* Rational choice (not selfishness! "Efficiency" could include safety, punctuality).  
      *Preempts:* "Individualism = selfishness" by highlighting diverse motivations.  
      *Ask:* "Is this sufficient? What’s missing?"

  4.  **Reveal the Gap: Feedback Loops (10 mins)**  
      *Add to board:*  
      - Transit underfunding (social fact) → delays (social fact) → individual choices → fare revenue drop (social fact) → worse underfunding.  
      *Key point:* Individual actions *alter social structures*, which then *constrain/enable* future individual choices. No "mysticism"—just recursive causation.  
      *Ask:* "Can we explain the *persistence* of decline *without* referencing the funding-delay-revenue cycle?"

  5.  **Holist Explanation (10 mins)**  
      *Define:* Holism = Social facts (structures, institutions, norms) have *explanatory power* because they:  
      - Emerge from but aren’t reducible to individuals (e.g., "underfunding" isn’t just the sum of individual donations).  
      - Causally enable/constrain individuals (e.g., budget cuts → fewer trains → commuters *can’t* choose punctuality).  
      *Preempts:* "Holism = group minds" by showing it’s about *system dynamics*, not metaphysics.

  6.  **Synthesis & Misconception Busting (10 mins)**  
      *Whiteboard:* Loop diagram showing individuals ↔ social structures.  
      *Clarify:*  
      - Individualism isn’t wrong, but *incomplete* for systemic phenomena.  
      - Holism doesn’t erase individuals; it studies how their actions *scale up* and *feed back*.  
      *Revisit politics:* "Why might quant researchers demand reductionism? Why might ethnographers resist? Both have valid concerns about oversimplification."  

  7.  **Application Exercise: Small Groups (10 mins)**  
      *Task:* Apply the individualist/holist lens to **college dropout rates**.  
      - Group 1: Explain via individual traits (motivation, income).  
      - Group 2: Explain via social facts (funding cuts, advising structures, stigma).  
      *Guiding Q:* "Where do the explanations *clash*? Where might they *integrate*?"  

  8.  **Closing Question & Omissions (5 mins)**  
      *Reveal:* "You’re designing a study on workplace gender inequality. What *one research question* would force you to engage with holist explanations, even if you’re an individualist?"  
      *Look for:* Questions addressing structural barriers (e.g., promotion norms, parental leave policies) that aren’t reducible to individual bias.  
      *Announce omissions:* "We skipped Durkheim’s *Suicide* (classic holist study) and rational choice theory’s nuances (e.g., Coleman). Dive into these in the readings."  

  ---

  ### **Why This Works**
  - **Case study neutrality:** The transport case avoids holism-bias by starting with clear individual actions. The feedback loop emerges naturally, avoiding "rigging."  
  - **Misconception handling:** Politics addressed upfront/returned later; "selfishness" and "group minds" rebutted via definitions and mechanics.  
  - **Closing question:** Tests if they *generate* holist explanations (e.g., "How do organizational promotion *structures* interact with individual negotiation styles?") rather than regurgitate.  
  - **Pacing:** 20 mins of your talk, 55 mins discussion/activity. Whiteboard tracks logic progression visually.  

  **Key:** Let them uncover tensions. Your role is to frame, highlight gaps, and correct caricatures—not preach "right answers."
