answer: |-
  Here’s a comprehensive exam package tailored to your framework, designed to force engagement with the (a)/(b) distinction and its implications. The question dismantles canned responses and targets your three core challenges.

  ---

  ### **Exam Question**  
  *(Recommended time: 90 minutes)*  

  **Epicurus argues that death cannot be bad for the deceased because: (a) harm requires a subject who exists to experience it, and (b) harm must occur at a specific time. Most contemporary replies reject (b), conceding (a).**  

  **Evaluate the deprivation account’s ability to explain the badness of death *while retaining (a) but rejecting (b)*. Address:**  
  1. **Whether rejecting (b) undermines the standard reply to the Symmetry Argument (i.e., why death is bad but pre-vital nonexistence is not).**  
  2. **Whether the "relocation move" (locating harm in the *event* of life-shortening at the time of death) can rescue intuitive judgments about tragedy (e.g., a 38-year-old who dies after fulfilling all goals but had a flourishing future).**  
  3. **Whether the account can define a non-arbitrary "baseline" for comparison in cases where lost futures lack value (e.g., losing 30 years in a coma vs. 30 years of flourishing).**  

  **Conclude by stating what the deprivation account *must* give up or reframe to retain (a), and whether this cost is acceptable.**  

  ---

  ### **Model Answer**  
  *(~700 words)*  

  The deprivation account (DA) holds that death is bad insofar as it deprives one of the goods of life one would otherwise have had. To meet Epicurus’ challenge while retaining his existence condition (a) — that harm requires a subject — DA typically jettisons the timing condition (b), allowing that death harms the deceased *at no time*. This move preserves DA’s core intuition but forces significant revisions to its explanatory framework, revealing costs in handling asymmetry, tragedy, and baseline comparisons.  

  **1. Symmetry Argument & the Cost of Dropping (b)**  
  The Symmetry Argument claims pre-vital and post-mortem nonexistence are morally equivalent: if death is bad, so is not being born earlier. The standard DA reply insists death deprives us of *future* goods we would have experienced, while pre-vital nonexistence does not deprive *us* (the existing subject) of past goods. However, this reply *presupposes (a)*: it requires a subject (*us*) who is deprived of future experiences. By rejecting (b), DA can deny harm occurs *at a time* but still posit harm *to the subject* via counterfactual loss. Yet this exposes a vulnerability: if harm is timeless, why is *only* future deprivation relevant? The asymmetry reply now appears question-begging. Without (b), DA cannot appeal to temporal location (future vs. past) to justify asymmetry; it must ground the asymmetry in the subject’s *relation* to possible futures (e.g., the subject has an interest in future flourishing by virtue of existing *now*). Retaining (a) thus forces DA into a more nuanced — and potentially weaker — position: asymmetry relies on the subject's *present capacity for future-directed interests*, not deprivation itself.  

  **2. The Relocation Move: A False Fix?**  
  Some defenders relocate harm to the *event* of dying (e.g., "life-shortening"), satisfying (b) by locating harm at the moment of death. But this fails DA’s own test. Consider a fulfilled 38-year-old who dies painlessly: her death is tragic because she loses a flourishing future, not because dying *at that moment* harms her experientially. The relocation move merely relabels deprivation; the *badness* still derives from lost future goods. If we insist harm occurs *at* death, we conflate the mechanism (dying) with the harm (deprivation). Worse, this move cannot explain why death is *worse* for someone with a better future. In the 38-year-old’s case, DA must say the tragedy lies *entirely* in the counterfactual loss — a loss that, per (a), affects *her* but, per rejected (b), at no time. The relocation move thus *fails* to rescue DA; it obscures the account’s dependence on timeless harm.  

  **3. Baseline Problems: Goods vs. Mere Existence**  
  DA compares actual life with a counterfactual "life one would have had." This baseline collapses when lost futures lack value. Two 50-year-olds die: one loses 30 flourishing years; the other loses 30 comatose years. DA *must* say death harms the first but not the second, as the latter loses no goods. This reveals DA evaluates *goods of life*, not life *simpliciter*. However, this invites arbitrariness: how do we define "would have had"? The coma case clarifies that the baseline is not biological life but *valuable conscious experience* (or desire-fulfillment). Yet this intensifies the problem of indeterminacy: without a definite future, the "loss" is speculative. Retaining (a) compounds this — the *subject* is harmed by a deprivation that depends on unknowable contingencies. DA thus faces a dilemma: either accept that harm is contingent on speculative futures (weakening its force), or reframe harm as loss of *possible* goods (which may not belong to the subject’s actual narrative).  

  **Conclusion: The Cost of Keeping (a)**  
  To retain (a), DA must abandon not only (b) but also: (i) appeals to temporal asymmetry as fundamental; (ii) intuitive claims that dying itself (rather than deprivation) is harmful; and (iii) the pretense that it values "life" rather than *experiential or agential goods*. The account becomes a thesis about *subject-relative counterfactual losses*, detached from time and grounded in the subject’s interests at the time of death. This cost is acceptable only if we prioritize theoretical consistency over pre-theoretic intuitions. DA survives, but as a leaner, more counterintuitive theory — one that cannot explain *why* we mourn the 38-year-old without invoking timeless, impersonal loss.  

  ---

  ### **Marking Scheme**  
  **Total: 20 marks**  
  *Allocate marks based on depth of insight, not word count. Focus on whether students identify theoretical trade-offs.*  

  1. **Rejection of (b) and its implications for Symmetry (4 marks)**  
     - **A/B Separator (3-4 marks):** Explicitly states that rejecting (b) *undermines the temporal basis* of asymmetry; forces asymmetry to rely on the subject’s *present interests* (not deprivation’s direction).  
     - **Common Failure:** Asserts DA "solves" symmetry without addressing how dropping (b) removes temporal grounding ("Death steals the future!" ignores timelessness).  

  2. **Critique of Relocation Move (5 marks)**  
     - **A/B Separator (4-5 marks):** Identifies relocation as *semantic relabeling*; argues the 38-year-old’s tragedy depends on *timeless counterfactual loss*, not the event.  
     - **Common Failure:** Accepts relocation as valid ("Harm happens at death!") without seeing it abandons DA’s core deprivation logic.  

  3. **Baseline Analysis & Goods vs. Life (5 marks)**  
     - **A/B Separator (4-5 marks):** Notes coma case shows DA cares about *goods*, not life; highlights indeterminacy of counterfactuals as a problem *amplified* by (a).  
     - **Common Failure:** Claims both deaths are equally bad (ignoring value of lost goods) or insists the coma case is "still harmful" (begging the question).  

  4. **Cost of Retaining (a) (4 marks)**  
     - **A/B Separator (3-4 marks):** Articulates *specific* costs: losing temporal asymmetry, relabeling failure, reliance on speculative counterfactuals.  
     - **Common Failure:** Vague claims ("It becomes complicated") or misidentifies cost as "giving up deprivation" itself.  

  5. **Synthesis: Viability of a Timeless Deprivation Account (2 marks)**  
     - **A/B Separator (2 marks):** States that DA *can* survive as a *subject-relative counterfactual theory* but must abandon intuitive appeals to time/tragedy.  
     - **Common Failure:** Concludes DA is "destroyed" or "unaffected" without nuance.  

  **Grading Threshold:**  
  - **A (17-20):** Hits all 5 moves; clearly explains how a timeless DA reframes asymmetry/tragedy; admits costs without collapsing.  
  - **B (13-16):** Identifies 3-4 moves but misses nuances (e.g., why dropping (b) weakens asymmetry); vague on costs.  
  - **C (9-12):** Superficial engagement; reverts to "deprivation vs. Epicurus" summary; misses >2 must-hit points.  

  ---

  ### **Why This Works**  
  - **Unanswerable by Canned Responses:** Forces students to engage *your* framework (a/b separation) and *your* cases (symmetry, 38yo, coma). No generic "Epicurus wrong" essay fits.  
  - **90-Minute Feasibility:** Focused on concepts taught in class; no new texts or memorization needed.  
  - **A/B Differentiation:** Top marks require synthesizing all three challenges under the (a)/(b) lens and admitting costs.  
  - **Traps Avoided:** The relocation move and coma case prevent superficial passes; the symmetry reset blocks rote asymmetry replies.  

  This exam rewards students who internalized your methodological intervention — and ruthlessly exposes those who didn’t.
