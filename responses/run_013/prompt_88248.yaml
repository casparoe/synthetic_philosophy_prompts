prompt: |-
  I am a software engineer with no training in philosophy, and I have been drafted into writing up an adversarial collaboration that has been running for months between two colleagues of mine. The subject is the tool I keep tripping over whenever I try to read philosophy: the thought experiment. I want the document the two of them could actually both sign, precise enough that I can use it as a checklist the next time someone hands me a case and tells me the verdict is obvious.

  The two positions, as they state them.

  Position one, the Vindicator: a well-made thought experiment is evidence, not a rhetorical device. It puts a general claim up against a particular case; if the case is described accurately and the verdict on it is stable, the general claim has to accommodate it. Verdicts on cases are data about our concepts and about what is possible.

  Position two, the Debunker: a thought experiment is a short story with an argumentative job. Whatever force it has comes from what the author chose to mention, the order of the sentences, the emotional colour of the words, and what the reader already believes. Perturb those and the verdict moves, which means the case tested nothing except the author's craft.

  So that they would have something neither had seen before, I wrote a case myself. Ada has a question-answering implant. She asks it a factual question; it answers in her own inner voice, within a second, confidently. In ten years of daily use it has never been wrong, and she has checked its answers against the world many times. It was installed by a firm that will not say how it works: whether it consults a database, polls a hidden panel of people, or simply guesses and has been lucky, Ada cannot tell. The question is whether Ada knows what the implant tells her. I can turn four dials on the case: (1) the firm says the accuracy is by design, versus a credible rumour that every unit is simply lucky; (2) she has verified the record herself, versus she has only read the firm's reliability figures; (3) the question at stake is trivial, versus it decides whether she drives over a bridge; (4) the answering thing is described as a machine, as a stranger on a phone line, or as her own second voice.

  I also proposed a procedure, and both of them irritatingly half-agreed with it, which is why I want it argued in writing rather than settled by who talks last. Treat a thought experiment like a specification. Identify the features the argument says are doing the work; then perturb everything the argument says is irrelevant — names, sensory detail, the valence of the wording, the order of presentation, whether the agent is a person or a machine, whether the stakes are high or low — and see whether the verdict survives. Call it invariance testing. A case whose verdict survives is doing work; a case whose verdict moves with the irrelevant features is a puppet. The hole I can see without help is that the specification may not determine the case: a description is finite, the imagined situation is not, and two readers may silently fill in different completions and then disagree about the verdict without disagreeing about anything real.

  What I want.

  1. A numbered list of claims both positions can sign, covering what a thought experiment is, what role it plays in an argument, what would count as one succeeding or failing, and what each side concedes about the failure modes the other names.
  2. The residual disagreements, each stated twice, in the wording its own side would accept for itself, so I can tell a real disagreement from one that exists only because they are using a word differently.
  3. The cruxes: the sub-questions such that settling one would move at least one side. I suspect three. Whether invariance is necessary, sufficient, or neither for a case to count as evidence. Whether a verdict that moves with the stakes is a defect in the method or a discovery about the concept. And whether a stable verdict on a well-specified case can establish a general claim at all, or only refute one. For each crux, the argument or case both sides agree bears on it, plus each side's prediction about how it comes out, recorded in advance.
  4. A verdict on the Ada case: which dials are legitimate variation and which are loading, whether the case survives invariance testing, and what each side predicts about the answer.
  5. A short section saying which parts of the dispute are verbal, and why.
  6. A closing section on what neither position explains.

  Constraints. No citations, no names of researchers, no reading lists; name the two positions by their content, not by anyone who holds them. If a canonical case is needed — the two trolley cases, the brain in a vat, the experience machine — describe it in your own words rather than pointing at a source. No agreed claim may be one the other side would read as a disguised concession, and no disagreement may be stated in a way its own side would call a caricature. Skip anything of the form that further work is needed. The document should be usable by someone who has never read the literature.
reasoning: |-
  We are drafting an adversarial collaboration agreement between two positions: the Vindicator (thought experiments as evidence) and the Debunker (thought experiments as rhetorical devices). The goal is a document both can sign, with numbered claims, residual disagreements, cruxes, and application to the Ada case.

  ### 1. Numbered List of Agreed Claims

  Both sides agree on the following:

  1. **Definition**: A thought experiment is a hypothetical scenario constructed to investigate the implications of a general claim or concept. It is presented in narrative form and invites a judgment (the "verdict") about the scenario.

  2. **Role in Argument**: Thought experiments are used to test, challenge, or refine general claims (e.g., philosophical theories, definitions, or principles). They do so by presenting a specific case that is intended to be relevant to the general claim.

  3. **Success Condition (Minimal)**: A thought experiment succeeds in its argumentative role if it reliably elicits a consistent verdict from a relevant audience (e.g., philosophers or informed participants) when the scenario is understood as specified.

  4. **Failure Condition (Minimal)**: A thought experiment fails if the verdict it elicits is highly unstable (i.e., changes easily under minor, irrelevant perturbations) or if it is shown that the verdict depends on features not relevant to the general claim being tested.

  5. **Concessions about Failure Modes**:
     - The Vindicator concedes that thought experiments can be misused as rhetorical devices (e.g., by loading the description to force a desired verdict) and that such misuse can lead to unreliable verdicts.
     - The Debunker concedes that if a thought experiment reliably elicits a stable verdict across variations in irrelevant features, it may provide some evidence about the concepts or possibilities under investigation.

  6. **Specification and Completion**: The description of a thought experiment is finite and underdetermined; readers may "fill in" unspecified details differently. This can lead to disagreements that are not about the core argument but about the interpretation of the case.

  7. **Invariance Testing**: Perturbing features of the thought experiment that are not supposed to be relevant (e.g., names, emotional wording, stakes, agent type) is a valid method to test whether the verdict depends on the core features or on auxiliary ones. Both sides agree that invariance testing can expose flaws in a thought experiment.

  ### 2. Residual Disagreements

  Each disagreement is stated twice: once in terms the Vindicator accepts, once in terms the Debunker accepts.

  - **On the Evidential Status**:
    - Vindicator's wording: A thought experiment that passes invariance testing provides evidence about the structure of our concepts or about what is possible, and this evidence can support or refute general claims.
    - Debunker's wording: Even if a thought experiment passes invariance testing, it does not provide evidence about the world or concepts; it only reveals the stable intuitions of the audience, which may be shaped by prior beliefs or cultural factors.

  - **On the Role of Stakes and Context**:
    - Vindicator's wording: If a verdict changes with stakes (e.g., high vs. low stakes in the Ada case), this reveals a context-sensitive aspect of the concept under investigation (e.g., knowledge might be stakes-sensitive) and is a discovery, not a defect.
    - Debunker's wording: If a verdict changes with stakes, this shows that the thought experiment is not isolating the core concept but is instead sensitive to pragmatic factors, which undermines its use as evidence for a general claim.

  - **On the Source of Verdicts**:
    - Vindicator's wording: Verdicts on well-constructed thought experiments are stable because they track objective features of the scenario and our shared concepts.
    - Debunker's wording: Verdicts are stable only because of shared background beliefs or narrative coherence, not because they track mind-independent truths about concepts or possibilities.

  ### 3. Cruxes

  Each crux is a sub-question that, if settled, would move at least one side. We include the agreed-upon test and each side's prediction.

  - **Crux 1: Is invariance necessary for a thought experiment to count as evidence?**
    - **Test**: Take a thought experiment that fails invariance testing (e.g., verdict changes with emotional wording) and see if either side would accept it as evidence. Both sides agree to use the Ada case with dial (4) varied (describing the implant as a machine, a stranger, or her own voice) and see if the verdict on knowledge changes.
      - Vindicator's prediction: If the verdict changes with the description (e.g., people are less likely to attribute knowledge if it's "her own voice" vs. "a machine"), this shows the thought experiment is flawed and not evidential. Invariance is necessary.
      - Debunker's prediction: Even if the verdict changes, the thought experiment might still be used as evidence by some, but this would be a mistake. The test confirms that invariance is necessary for evidence, but the Debunker adds that passing invariance is still not sufficient.

  - **Crux 2: Is a stakes-sensitive verdict a defect or a discovery?**
    - **Test**: Use the Ada case with dial (3) varied (trivial question vs. bridge-crossing stakes). Both sides agree that if the verdict on whether Ada knows changes with the stakes, this is a point of contention.
      - Vindicator's prediction: If the verdict changes (e.g., more people say she doesn't know in high stakes), this reveals that knowledge is context-sensitive, and the thought experiment successfully uncovers this feature. It is a discovery.
      - Debunker's prediction: If the verdict changes with stakes, this shows that the thought experiment is not testing the core concept of knowledge in isolation but is conflating it with practical reasoning. This is a defect because it doesn't isolate the target concept.

  - **Crux 3: Can a stable verdict on a well-specified case establish a general claim, or only refute one?**
    - **Test**: Consider a thought experiment that passes invariance testing and elicits a stable verdict. Can it be used to positively support a general claim (e.g., "Knowledge requires X") or only to refute a claim (e.g., "Knowledge does not require Y")? Both sides agree to use the trolley case (described below) as an example.
      - *Trolley case description*: A trolley is heading toward five people who will die if it proceeds. You can flip a switch to divert it to a side track where one person will die. Is it morally permissible to flip the switch? (Standard verdict: yes.) Now, if the verdict is stable under perturbations (e.g., changing the agent, the setting, the wording), can we conclude that it is generally permissible to save five at the cost of one?
      - Vindicator's prediction: A stable verdict can support a positive general claim (e.g., consequentialism) if the case is representative and the invariance shows it's not an artifact. It can establish, not just refute.
      - Debunker's prediction: At best, a stable verdict refutes a general claim that denies it (e.g., "it is never permissible to cause a death"). But it cannot establish a positive general claim because one case doesn't cover all possibilities and might be explained by other factors.

  ### 4. Verdict on the Ada Case

  - **Legitimate vs. Loading Dials**:
    - Dials (1) and (2) (firm's claim vs. rumour; personal verification vs. firm's data) are legitimate variations because they directly relate to the justification for belief, which is central to the concept of knowledge.
    - Dial (3) (trivial vs. high stakes) is a test of context-sensitivity; both sides agree it is relevant to the concept but disagree on whether varying it reveals a defect or a discovery.
    - Dial (4) (machine, stranger, own voice) is a potential loading dial because it manipulates the emotional or psychological framing without altering the epistemic features. Both sides agree that if the verdict changes with this, it is a problem.

  - **Invariance Testing**: 
    - The Ada case is well-specified for dials (1) and (2). Both sides predict that varying these should affect the verdict (e.g., if there's a credible rumour of luck, fewer people will attribute knowledge), which is appropriate because they are relevant to justification.
    - For dial (3), both sides agree that the verdict might change (high stakes might lower knowledge attributions), but they disagree on whether this is a problem (see Crux 2).
    - For dial (4), both sides agree that if the verdict changes (e.g., knowledge is less attributed when the implant is described as "her own voice"), this is a failure of invariance because the framing is irrelevant to the epistemic facts.

  - **Predictions**:
    - Vindicator: The verdict on knowledge should be stable under dial (4) if the case is well-constructed. If it changes, the case needs refinement. Dials (1) and (2) should affect the verdict appropriately. Dial (3) might affect the verdict, revealing context-sensitivity.
    - Debunker: The verdict will likely change under dial (4) due to framing effects, showing that the case is rhetorically loaded. Dial (3) changes are expected but show the case is not isolating knowledge.

  ### 5. Verbal Disagreements

  The following disputes are partly or wholly verbal:

  - **"Evidence"**: The Vindicator uses "evidence" to mean data about our concepts or intuitions that can inform philosophical theories. The Debunker reserves "evidence" for empirical data about the world and uses "intuition" for thought experiment verdicts. They agree that thought experiments produce intuitive verdicts but disagree on whether these count as evidence.

  - **"Knowledge"**: In the Ada case, the Vindicator might include context-sensitive elements in the concept of knowledge (e.g., depending on stakes), while the Debunker might argue that a proper analysis of knowledge should be invariant to stakes. This is a substantive disagreement about the concept, not just words, but the term "knowledge" is being used with different implicit definitions.

  ### 6. Unexplained Issues

  Neither position fully explains:

  - **The Origin of Concepts**: How do we account for the content of the concepts being tested? Are they innate, culturally acquired, or shaped by experience? This affects how we interpret verdicts.

  - **Disagreement Among Experts**: Why do philosophers sometimes disagree on verdicts even for well-specified cases? Neither side has a complete account of persistent disagreement.

  - **The Role of Imagination**: What cognitive processes underpin the "filling in" of underdetermined scenarios, and how do they influence verdicts?

  ### Closing

  This document provides a framework for evaluating thought experiments, particularly through invariance testing. Both parties agree on the method of testing but disagree on the interpretation of the results and the evidential status of thought experiments. The Ada case serves as a testbed for these disagreements, and the cruxes highlight the key points of contention.
answer: |-
  ### Adversarial Collaboration Agreement: On Thought Experiments

  **Preamble:**  
  This document outlines agreed claims, residual disagreements, and testing protocols for evaluating thought experiments, based on two positions:  
  - **Vindicator:** Thought experiments are evidence (data about concepts/possibilities).  
  - **Debunker:** Thought experiments are rhetorical devices (craft-dependent narratives).  
  Both parties commit to the following as a neutral framework for future cases.  

  ---

  ### 1. Agreed Claims  
  *Both parties endorse these statements without concession:*  

  1. **Definition:** A thought experiment is a hypothetical scenario designed to test a general claim (e.g., "All knowledge requires justification"). It asks for a verdict (e.g., "Does Ada know?") to challenge or refine the claim.  

  2. **Role in Argument:**  
     - It isolates variables to probe conceptual boundaries (e.g., "What makes knowledge collapse?").  
     - It cannot *directly* confirm empirical facts (e.g., brain physiology).  

  3. **Success Condition:** A thought experiment succeeds if its verdict is **stable** under rational reflection by competent users, and **relevant** to the targeted claim. Stability means the verdict persists when irrelevant details change.  

  4. **Failure Condition:** It fails if the verdict:  
     - Changes under minor, irrelevant perturbations (e.g., renaming "Ada" to "Bob").  
     - Depends on ambiguous details users "fill in" inconsistently (e.g., assuming Ada’s implant is magical).  

  5. **Concessions on Failure Modes:**  
     - Vindicator concedes: Poorly constructed cases can be rhetorical puppets (e.g., loaded wording manipulates verdicts).  
     - Debunker concedes: Verdicts *can* reveal shared conceptual structures if invariant under testing.  

  6. **Testing Protocol (Invariance Testing):**  
     - Step 1: Identify the core features the argument claims are decisive (e.g., for knowledge: reliability, justification).  
     - Step 2: Perturb *irrelevant* features (e.g., emotional tone, stakes, agent-type).  
     - Step 3: If the verdict shifts, the case is flawed; if stable, it is evidentially useful.  

  7. **Underdetermination Problem:** Descriptions are finite; users mentally "complete" missing details. Disagreements may arise from these completions, not the core case.  

  ---

  ### 2. Residual Disagreements  
  *Stated in each position’s own accepted wording:*  

  - **On Evidential Status:**  
    - Vindicator: "A stable verdict provides evidence about conceptual truths or necessities."  
    - Debunker: "A stable verdict only reflects shared intuitions shaped by background beliefs; it is not evidence of mind-independent truths."  

  - **On Stakes-Sensitivity:**  
    - Vindicator: "If a verdict changes with stakes (e.g., life-or-death vs. trivial), it reveals a contextual element of the concept (e.g., knowledge is stakes-sensitive)."  
    - Debunker: "If a verdict changes with stakes, it exposes the case as a rhetorical device conflating distinct concepts (e.g., knowledge with practical risk)."  

  - **On Verdict Stability:**  
    - Vindicator: "Stability indicates objective conceptual structure."  
    - Debunker: "Stability indicates robust psychological conditioning, not truth-tracking."  

  ---

  ### 3. Cruxes  
  *Sub-questions where settling one would move at least one side. Includes test case and predictions.*  

  **Crux 1: Is invariance necessary/sufficient for evidence?**  
  - **Test Case:** Ada case with dial (4) perturbed (implant described as "machine" vs. "own voice").  
  - **Vindicator Prediction:** Verdict will *not* shift; invariance is necessary *and* sufficient for evidence.  
  - **Debunker Prediction:** Verdict *will* shift (e.g., "own voice" feels intuitive, reducing knowledge attributions); invariance is necessary but *not* sufficient (background beliefs still drive verdicts).  

  **Crux 2: Is stakes-sensitivity a defect or discovery?**  
  - **Test Case:** Ada case with dial (3) perturbed (trivial question vs. bridge-crossing stakes).  
  - **Vindicator Prediction:** Verdict *will* shift (e.g., knowledge denied in high stakes), revealing stakes as part of the concept of knowledge.  
  - **Debunker Prediction:** Verdict *will* shift, proving the case tests psychology, not knowledge (e.g., people confuse knowledge with action-guidance).  

  **Crux 3: Can a stable verdict establish a general claim?**  
  - **Test Case:** Trolley case (diverting a threat to save five lives at the cost of one). If stable under perturbations (e.g., agent changed from person to AI), can it support "It is permissible to minimize harm"?  
  - **Vindicator Prediction:** Yes; stability under invariance testing licenses positive generalizations.  
  - **Debunker Prediction:** No; it can only refute absolute claims (e.g., "It is *never* permissible to cause harm"), not establish general norms.  

  ---

  ### 4. Verdict on the Ada Case  
  **Case Summary:** Ada uses a reliable implant. Dial (1): Firm’s design vs. luck rumor. Dial (2): Personal verification vs. firm’s data. Dial (3): Trivial vs. high-stakes question. Dial (4): Implant as "machine," "stranger," or "own voice."  

  - **Legitimate Variations (Core Features):**  
    - Dial (1): Legitimate (tests justification).  
    - Dial (2): Legitimate (tests justification reliability).  

  - **Loading Variations (Irrelevant Features):**  
    - Dial (4): Loading (framing as "own voice" injects bias; irrelevant to justification).  
    - Dial (3): *Disputed* (Vindicator: legitimate stakes-sensitivity test; Debunker: loading due to conflation with action).  

  - **Invariance Testing Result:**  
    - Dials (1)/(2): Verdict *should* shift (e.g., knowledge denied if rumor/unverified). Passes testing (relevant).  
    - Dial (4): Verdict *may* shift (e.g., "own voice" reduces knowledge attributions). Fails if it shifts (irrelevant perturbation).  
    - Dial (3): Verdict *may* shift (high stakes deny knowledge). Vindicator calls this discovery; Debunker calls it defect.  

  - **Predictions:**  
    - Vindicator: Verdict stable for dials (1)/(2)/(4); shifts for (3), revealing stakes-sensitivity.  
    - Debunker: Verdict shifts for dials (3)/(4), proving the case is rhetorical.  

  ---

  ### 5. Verbal Disagreements  
  - **"Evidence":**  
    - Vindicator uses "evidence" to mean *data about concepts* (e.g., "Stable verdicts reveal conceptual boundaries").  
    - Debunker uses "evidence" to mean *empirical proof* (e.g., "Verdicts are psychological data, not truth-tracking").  
    → This is a definitional split; no factual disagreement.  

  - **"Knowledge":**  
    - Vindicator allows contextual concepts (e.g., "knowledge includes stakes").  
    - Debunker uses invariant concepts (e.g., "knowledge is stakes-independent").  
    → Disagreement is about concept scope, not thought experiments per se.  

  ---

  ### 6. Unexplained Issues  
  *Neither position fully explains:*  
  - **Origin of Concepts:** Why do some verdicts converge across cultures (e.g., basic moral cases) if they are merely rhetorical?  
  - **Persistent Disagreement:** Why do experts disagree on verdicts (e.g., trolley case) even with full specification?  
  - **Completions:** How to resolve "filled-in" details (e.g., if Ada’s implant is described minimally, users assume different mechanisms).  

  ---  
  **Signed:**  
  [Vindicator] _________________________  
  [Debunker] _________________________  
  **Date:** _________________________
