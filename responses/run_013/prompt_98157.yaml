  ### Principle Behind Strategy Elimination

  After analyzing your judgments across the five games, the principle that best captures your verdicts is **iterated elimination of strictly dominated strategies, allowing for dominance by pure or mixed strategies**. This means, at each step, a strategy is eliminated if there exists some alternative pure or mixed strategy that yields a strictly higher payoff against every possible strategy the opponent could play from their current (remaining) set. The process repeats until no more strategies can be eliminated, and it is order-independent for strict dominance. This principle aligns with your verdicts in Games A, B, C, and E, but not in Game D, where you want weak dominance to apply.

  Here's the precise principle:

  - **Elimination rule**: Cross off a strategy for a player if it is **strictly dominated** by some pure or mixed strategy of that player, given the opponent's current set of strategies. A strategy \(s\) is strictly dominated by another strategy \(t\) (pure or mixed) if, for every possible strategy the opponent plays from their remaining set, the payoff from \(t\) is strictly greater than the payoff from \(s\).
  - **Iteration**: Repeat the elimination process using the reduced set of strategies until no further eliminations are possible.
  - **Order-independence**: The final set of surviving strategies does not depend on the order of elimination when using strict dominance, as the strict inequality holds regardless of other strategies.
  - **Outcome**: The surviving strategies are those that are rationalizable (i.e., they can be best responses to some belief about the opponent's play).

  This principle is based on common knowledge of rationality and the payoff matrix. It incorporates mixed strategies because players can randomize, so comparing against mixtures is legitimate (as in Game B). For weak dominance (never better and sometimes worse), it is not used in this principle because it leads to order-dependence and conflicts with your verdict in Game C, where a weakly dominated strategy should be kept if it can be a best response.

  ### How the Principle Captures Your Verdicts
  - **Game A**: B is strictly dominated by T (pure strategy). Against L: T=2 > B=1; against R: T=2 > B=0. So B is eliminated. (Matches your verdict: cross off B.)
  - **Game B**: M is strictly dominated by a 50-50 mix of T and B. Against L: Mix gives (0.5×3 + 0.5×1) = 2 > M=1; against R: Mix gives (0.5×0 + 0.5×4) = 2 > M=1. So M is eliminated, and T and B survive. (Matches your verdict: cross off M; T and B stay.)
  - **Game C**: B is not strictly dominated by any pure or mixed strategy. Against L: T=2, B=2 (equal, not strictly worse); against R: T=1 > B=0, but the equality against L prevents strict domination. B can be a best response if column plays L (payoff 2, same as T). So no elimination occurs, and B survives. (Matches your verdict: do not cross off B.)
  - **Game D**: No strategy is strictly dominated. For row: Against L, T=1 = B=1 (not strictly better); against R, T=2 > B=1, but the tie against L means B is not strictly dominated by T or any mix. Similarly for column: Against T, L=1 = R=1; against B, L=2 > R=1, but the tie against T means R is not strictly dominated. Thus, no strategies are eliminated. However, your verdict is to cross off B and R (weakly dominated), so this principle does not accommodate Game D. (Principle predicts no elimination; your verdict requires weak dominance.)
  - **Game E**: B is strictly dominated by T (against L: 5>1; C: 4>1; R: 1>0). Eliminate B. With B gone, for column: Against T, L=2, C=1, R=0; against M, L=2, C=1, R=0. R and C are strictly dominated by L (L=2 > C=1; L=2 > R=0). Eliminate R and C. Now only L remains for column. For row against L: T=5 > M=3, so M is strictly dominated by T. Eliminate M. Only (T,L) survives. (Matches your verdict: remove B, then R and C, then M; (T,L) remains.)

  ### Why Game D Forces a Distinction
  Game D is the key case that this principle cannot accommodate because:
  - Your verdict relies on weak dominance (cross off B and R because they are never better and sometimes worse), but weak dominance conflicts with your verdict in Game C (where you refuse to eliminate a weakly dominated strategy because it can be a best response).
  - Under strict dominance, nothing is eliminated in Game D, as there are no strict inequalities. Weak dominance is needed to eliminate B and R, but weak dominance elimination is order-dependent (as you noted), and the "survives every order" fix (discussed below) doesn't work for Game C.

  Thus, Game D forces a choice between principles: strict dominance preserves your judgment in Game C but not D, while weak dominance sacrifices Game C for D. The strict dominance principle is chosen here because it works for four out of five games and aligns with standard rationalizability concepts.

  ### Answers to Specific Questions
  **(a) Should mixtures be allowed in the elimination test?**  
  Yes, mixtures should be allowed. This is legitimate because players can randomize, so a rational player would not play a strategy that is strictly worse than a available mixed strategy. In Game B, M is eliminated because it is strictly dominated by a 50-50 mix of T and B—the player can achieve a higher expected payoff by randomizing. Restricting to pure strategies would be less "honest" because it ignores that players can mix, and it might miss valid eliminations (e.g., in Game B, no pure strategy strictly dominates M, but a mix does).

  **(b) Why is iteration order-independent for strict dominance but not weak dominance?**  
  - **Strict dominance**: Order-independent because the strict inequality (payoff strictly greater for all opponent strategies) holds no matter what other strategies are present. Removing strategies can only make domination easier (since there are fewer cases to check), but it never "undoes" strict domination. If a strategy is strictly dominated in the full set, it remains strictly dominated in any subset.
  - **Weak dominance**: Not order-independent because the condition (never better and sometimes worse) depends on the presence of specific opponent strategies. Removing a strategy might remove the case where the dominated strategy was "sometimes worse," making it appear undominated. For example, in Game D, if R is eliminated first, B is no longer weakly dominated because only L remains, and against L, B is not worse than T. Order matters because weak domination can be "fragile" to the removal of strategies.

  **(c) Do "strictly dominated by some mixture" and "never a best reply" always agree?**  
  In two-player games, **yes, they always agree**. A strategy is strictly dominated by some mixed strategy if and only if it is never a best response to any belief about the opponent's play. This is because:
  - If a strategy is strictly dominated, no belief can make it a best response (since the dominating strategy always yields a higher expected payoff).
  - Conversely, if a strategy is never a best response, there must be a mixed strategy that strictly dominates it (this is a fundamental result for two-player games).
  - **Examples from your games**:
    - Game B: M is strictly dominated by a mix of T and B, and it is never a best response (for any belief, the mix gives higher expected payoff).
    - Game C: B is not strictly dominated, and it can be a best response (e.g., if column is believed to play L with certainty).
    - Game D: B is not strictly dominated and can be a best response (e.g., if column is believed to play L with certainty), so neither concept eliminates it.

  For three or more players, these concepts can come apart:
  - A strategy might be strictly dominated by a mixed strategy but still be a best response to some beliefs if opponents' strategies are correlated (e.g., in a coordination game with multiple players, a dominated strategy could be best if others play in a correlated way).
  - Conversely, a strategy might never be a best response but not be strictly dominated if the dominance requires correlation that isn't captured by independent mixing.
  - This doesn't affect your verdicts since all your games are two-player, but in general, "never a best reply" is stronger and implies rationalizability, while strict dominance may not hold with correlation.

  **(d) Can the "survives every order" idea for weak dominance yield an empty or incoherent set?**  
  Yes, the "survives every order" approach (keep only strategies that survive in every possible sequence of weak dominance elimination) can yield an empty set or incoherent results:
  - **Empty set possible?** Yes, in games where all strategies are weakly dominated, but their elimination depends on order. For example, consider a modified Rock-Paper-Scissors with payoffs that introduce weak dominance (e.g., a strategy that is never better and sometimes worse than another). If every strategy is eliminated in some order, the intersection could be empty, meaning no strategy "surely" survives.
  - **Incoherent?** It can be incoherent if the surviving set depends on the definition of "possible orders" or if no strategies survive all orders. For instance, in a game with cycles of weak dominance, the intersection might exclude reasonable strategies or be sensitive to how elimination is implemented.
  - **In your games**:
    - Game D: The "survives every order" set for weak dominance is {T} for row and {L} for column (as T and L survive in all sequences, while B and R do not). This matches your verdict to cross off B and R.
    - Game C: Applying this yields elimination of B (since B is weakly dominated and eliminated in all sequences), but you reject this verdict. Thus, it "loses" Game C.
    - The approach is not recommended here because it forces weak dominance, which conflicts with Game C.

  ### Predictions for Unlisted Cases
  - **Strictly dominated strategies**: Always eliminated (e.g., a strategy inferior in all cases to another pure strategy).
  - **Weakly dominated but not strictly dominated**: Not eliminated if they can be best responses (e.g., like B in Game C). If weak dominance is applied with "all orders," they might be eliminated if not survivable in every sequence (e.g., like B in Game D).
  - **Mixed strategies as dominators**: Used when no pure strategy dominates, but a mix does (e.g., like in Game B).
  - **No dominance**: All strategies survive if no eliminations are possible (e.g., in Game D under strict dominance).
  - **Multiple players**: With three or more players, strict dominance by mixed strategies may not capture "never a best reply" due to correlation, and elimination could be more complex.

  This principle (iterated strict dominance with mixtures) is robust for two-player games and explains your intuitive judgments except in Game D, where weak dominance is needed but inconsistent with Game C. Sticking to strict dominance resolves most cases cleanly and avoids order-dependence issues.
