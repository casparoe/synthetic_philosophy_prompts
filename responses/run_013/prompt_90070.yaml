prompt: |-
  I'm building a batch of decision-theory puzzles and I need one on ambiguity. Build me an Ellsberg-style setup — two containers, one whose mix of colors you know exactly, one whose mix you dont, draw one and win a fixed sum if it comes up the right color — with a twist I've never seen pulled off: I want the ambiguous container to be strictly better than the known one under every mix consistent with what you're told, so the maxmin rule (score each option by its worst-case odds) actually picks the ambiguous container, while someone who just hates betting on the unknown — the comparative-ignorance type, who feels relatively more ignorant choosing the murky option and so steers away from it — still picks the known one. Ordinary money a normal person could win, and keep the setup to one short paragraph.

  Then reason it through three ways: (a) a plain expected-utility chooser who puts some single prior on the unknown mix and maximizes, (b) the maxmin chooser, (c) the pure ambiguity-averse / comparative-ignorance chooser. Stick those three verdicts in a little table. After that, tell me which feature of the case is doing the real work, what happens if I remove it, and how someone who thinks maxmin is the right model of ambiguity aversion would try to defend it against the case. Keep it under 600 words, American English, and don't worry about citing anyone.
reasoning: |-
  We are going to design an Ellsberg-style setup with two containers (urns). The known urn has exactly 50 red and 50 blue balls (so 100 balls total). The ambiguous urn has 100 balls, each either red or blue, but the mix is unknown. The twist: we are told that the ambiguous urn has at least 51 red balls (so the proportion of red is at least 51%). We win a fixed sum (say $100) if we draw a red ball.

  So:
  - Known urn: 50 red, 50 blue -> probability of red = 0.5.
  - Ambiguous urn: at least 51 red (so between 51 and 100 red, and correspondingly between 0 and 49 blue). The worst case for red in the ambiguous urn is 51 red (so 51/100 = 0.51) and the best case is 1.0.

  Now, we want the ambiguous urn to be strictly better than the known one under every mix consistent with the information. That is, for every possible proportion of red in the ambiguous urn (which is from 51% to 100%), the probability of drawing red is at least 0.51, which is strictly greater than 0.5. So indeed, no matter what the true mix is (as long as it has at least 51 red), the ambiguous urn gives a strictly higher chance of winning than the known urn.

  However, we want to see three types of choosers:

  (a) Expected-utility chooser with a single prior: This person assigns one fixed probability to the ambiguous urn. For example, if they believe that the ambiguous urn has exactly 51 red balls (the worst case), then the probability of red is 0.51. Alternatively, if they are optimistic and think it has 100 red, then it's 1.0. But note: if they assign any prior that averages to at least 0.505 (or even if they assign the worst-case 0.51) then the ambiguous urn is better. However, if they assign a prior that is pessimistic (like 0.51) then they prefer ambiguous. But if they are very pessimistic about the ambiguous urn and assign a prior that is worse than 0.5? But note: the information says at least 51% red, so no prior can assign less than 0.51. So the expected-utility chooser, if they use any prior consistent with the information (i.e., at least 0.51), will always get at least 0.51, which is better than 0.5. So they should prefer the ambiguous urn.

  But wait: what if the expected-utility chooser has a prior that is not concentrated on the worst-case? They might have a prior that averages to, say, 0.75. Then they still prefer ambiguous. So (a) should always prefer ambiguous.

  (b) Maxmin chooser: This person evaluates each option by its worst-case scenario. For the known urn, the worst-case (and only) probability of red is 0.5. For the ambiguous urn, the worst-case (minimum) probability of red is 0.51 (since the urn must have at least 51 red). Therefore, the maxmin rule assigns 0.51 to the ambiguous urn and 0.5 to the known one. So they prefer the ambiguous urn.

  (c) Pure ambiguity-averse / comparative-ignorance chooser: This person feels more ignorant when choosing the ambiguous urn and therefore avoids it. They might say: "I know exactly what I'm getting with the known urn (50% chance), but with the ambiguous urn I don't know the exact odds. Even though the ambiguous urn is supposed to be better, I feel uncomfortable and would rather take the known urn." So they choose the known urn.

  Therefore, we have:

  | Chooser Type              | Choice          |
  |---------------------------|-----------------|
  | (a) Expected-utility      | Ambiguous urn   |
  | (b) Maxmin                | Ambiguous urn   |
  | (c) Comparative ignorance | Known urn       |

  The key feature: The ambiguous urn is strictly better in every possible scenario (i.e., for every possible composition consistent with the information). This forces the maxmin chooser to prefer the ambiguous urn because the worst-case for the ambiguous urn (51 red) is still better than the known urn (50 red). The expected-utility chooser, using any prior consistent with the information, also sees the ambiguous urn as better. However, the comparative-ignorance chooser is not swayed by the objective improvement in the worst-case; they are averse to the lack of knowledge and thus choose the known urn.

  What if we remove the requirement that the ambiguous urn is strictly better in every scenario? For example, if the ambiguous urn had at least 50 red balls (instead of 51), then the worst-case for the ambiguous urn would be 50 red (same as the known urn). Then the maxmin chooser would be indifferent. But if we set the minimum to 49, then the worst-case for the ambiguous urn (49 red) is worse than the known urn (50 red), so the maxmin chooser would prefer the known urn. Therefore, the strict dominance of the ambiguous urn in every scenario is crucial.

  How would a maxmin defender respond? They might argue that the setup is unrealistic because it requires the decision-maker to know that the ambiguous urn has at least 51 red. In practice, such precise bounds on the unknown urn might not be available. Alternatively, they might question whether the comparative-ignorance chooser is rational. They could also note that the maxmin rule is designed for situations of extreme uncertainty and that in this case, because the ambiguous urn dominates, it is rational to choose it. The fact that some people (with comparative ignorance) choose the known urn might be seen as a cognitive bias rather than a normative prescription.

  This setup achieves the desired twist: the ambiguous urn is strictly better in every scenario, so both expected utility (with any prior) and maxmin choose it, but the ambiguity-averse person (due to comparative ignorance) still avoids it.
answer: |-
  ### Ambiguity Puzzle Setup

  **Puzzle:** You face two urns. **Urn A (known)** has exactly 50 red and 50 blue marbles. **Urn B (ambiguous)** has 100 marbles, each either red or blue, but you know it contains *at least 51 red marbles*. You draw one marble blindly. Win $100 if it’s red. Choose an urn.

  ---

  ### Reasoning by Chooser Type

  | **Type**                          | **Verdict**      | **Explanation** |
  |-----------------------------------|------------------|----------------|
  | **(a) Expected-Utility Chooser**  | Prefers Urn B    | Assigns a single prior to Urn B (e.g., 51 red, 100 red, or any average ≥51/100). Since 51% > 50%, Urn B has strictly higher expected value. |
  | **(b) Maxmin Chooser**            | Prefers Urn B    | Worst case for Urn A: 50% red. Worst case for Urn B: 51% red. 51% > 50%, so Urn B wins under maxmin. |
  | **(c) Comparative-Ignorance Chooser** | Prefers Urn A | Feels "more ignorant" choosing Urn B. Avoids ambiguity despite Urn B’s objective dominance, sticking with the known 50% odds. |

  ---

  ### Key Feature, Removal, and Maxmin Defense

  **Key Feature:**  
  Urn B’s *strict dominance*—every possible mix (51–100 red) yields better odds than Urn A’s 50%. This forces maxmin to favor B, while comparative-ignorance aversion still rejects B.

  **If Removed:**  
  If Urn B had "at least 50 red" (not 51), its worst-case odds (50%) match Urn A. Maxmin would then be indifferent or prefer A if ambiguity aversion is modeled conservatively (e.g., worst-case tie-breakers favor known options).

  **Maxmin Defense:**  
  A maxmin advocate would argue:  
  1. **Dominance is rational:** Choosing B is objectively correct—it *always* offers better odds. Ignoring this is irrational.  
  2. **Misapplied aversion:** Comparative ignorance conflates "feeling ignorant" with actual risk. Maxmin correctly separates ambiguity (unknown probabilities) from risk (known probabilities).  
  3. **Bias, not rationality:** Rejecting B stems from psychological bias, not sound decision theory. Maxmin optimizes guaranteed minima, which here aligns with dominance.
