answer: |-
  ## Stasis Syndrome

  The agenda item glowed on the tablet screen: *Item 12.1: Review & Vote: Category 6.87 - Stasis Syndrome*. Isolde Vance traced the numbers with a fingertip. *6.87*. Twenty years. The air in the National Institute of Behavioral Health’s Committee Room 4 felt thick, recycled, smelling faintly of ozone and stale coffee. Outside the reinforced glass, a grey Washington D.C. afternoon pressed in. Isolde, sixty-two now, her once-dark hair a steely grey pulled back severely, adjusted her reading glasses. She felt the familiar, weightless pause – the momentary disconnection between seeing the item and formulating her thoughts about it. *Later*, she told herself, *think about it later*. She tapped the screen, scrolling past procedural notes to the core document: the proposed revisions for the *Standardized Diagnostic Inventory (SDI), 6th Edition*.

  She’d chaired the working group for the SDI-4. Back then, it felt like carving clarity from fog. They’d tackled the nebulous complaints: patients who spoke of a profound, paralyzing gap between intention and action, untouched by melancholy or anhedonia. *I want to make the phone call, I know I need to make the phone call, I even picked up the phone… and then it’s hours later.* They’d named it Stasis Syndrome. The core insight, hers and Dr. Aris Thorne’s, had been radical optimism: that naming the gap precisely, cleanly, would collapse it. Recognition *was* the cure. They’d crafted the initial criteria with surgical precision, aiming to isolate the phenomenon:

  **SDI-4 (2003) Criteria for Stasis Syndrome (Provisional Category 6.87):**
  1. Persistent report (≥ 3 months) of a perceived "gap" or "stall" between forming an intention and initiating the intended action.
  2. Actions affected are non-routine, requiring deliberate initiation (e.g., starting a complex task, making an appointment).
  3. Absence of concurrent significant depressed mood or markedly diminished interest/pleasure (Anhedonia).
  4. Patient explicitly attributes the difficulty to the initiation phase, not lack of desire or perceived futility.
  5. Symptoms cause clinically significant distress or impairment in social, occupational, or other important areas of functioning.

  They’d argued fiercely for provisional status, convinced prevalence would plummet. *See it, name it, break it.* The SDI-4 committee, impressed by the clarity, approved it. Isolde remembered the quiet satisfaction, the sense of having pinned down something elusive.

  Prevalence hadn’t plummeted. It crept up. Slowly at first, then steadily. By the SDI-5 revision cycle ten years later, the data was undeniable. The Stasis working group, which Isolde observed but didn’t chair, wrestled with it. Clinicians reported patients resonated deeply with the description… yet the ‘gap’ persisted. Some argued the original criteria were too restrictive, excluding mild cases or those managing routine tasks but failing at novel ones. Others whispered about contagion, about the diagnosis becoming a self-fulfilling prophecy. The revised criteria emerged broader, softer around the edges:

  **SDI-5 (2013) Criteria for Stasis Syndrome (Category 6.87):**
  1. Persistent report (≥ 3 months) of difficulty initiating intended actions, described as a "block," "gap," or "freeze."
  2. Actions affected may include routine tasks if initiation requires deliberate effort beyond habitual execution.
  3. Absence of *prominent* depressed mood or *marked* anhedonia *as the primary driver* of the initiation difficulty.
  4. Patient attributes the difficulty primarily to the process of initiating action, not lack of motivation or pervasive hopelessness.
  5. Symptoms cause clinically significant distress or impairment.

  Isolde had read them with unease. The shift from "non-routine" to actions that "may include routine tasks" felt like a dilution. The caveats about mood – "prominent," "primary driver" – introduced ambiguity. But the data showed the rise continuing, almost mirroring the broadening language. The Sunset Rule – mandating review for any category whose prevalence increased beyond 0.5% per revision cycle – now loomed. Stasis had blown past that margin.

  Now, for the SDI-6, the committee faced a binary under the Sunset Rule: radical rewrite or retirement. And retirement was complicated. Stasis Syndrome was reimbursable. Treatment protocols – mostly focused on behavioural activation and environmental scaffolding – had developed. Crucially, patient advocacy groups like the Stasis Alliance had formed. Retiring the diagnosis wasn't just deleting a code; it was dismantling identities and access to care.

  Isolde still ran a small research clinic affiliated with Georgetown Neurobehavioral. It kept her grounded, she told herself. Mostly, it was supervising junior clinicians. But once a month, she took an intake slot herself. Today’s patient was Lena, early forties, referred by her GP for "executive dysfunction."

  The clinic room was functional: beige walls, two chairs, a small desk, a clock prominently displaying the fifteen-minute countdown mandated for intake efficiency. Lena sat perched on the edge of her chair, hands clasped tightly. Her eyes darted around the room, never quite settling on Isolde.

  "Dr. Vance? Thank you for seeing me. My doctor… he thinks it might be Stasis? I read about it. Online." Lena’s voice was tight with suppressed urgency.

  "Let's see what brings you in today, Lena," Isolde began, the structured interview flowing automatically. Lena described the paralysis: wanting to apply for a promotion, the forms open on her screen for days; intending to call her sister, the phone burning in her pocket untouched. "It’s not that I don’t *want* to," Lena emphasized, leaning forward. "It’s like… the signal gets lost between my brain and my hand."

  Isolde nodded, ticking off mental boxes against the SDI-5 criteria. The description was textbook. "And how long has this been particularly difficult?"

  "Since… well, it got really bad after my mom passed two years ago, but I think…" Lena hesitated. "Looking back, maybe I’ve always had a bit of this? Just… not so much."

  Isolde made a note. "And your mood? Do you feel persistently sad, or find you don’t enjoy things you used to?"

  Lena shook her head quickly. "Sad? About Mom, yes, of course, that grief comes and goes. But this… this freeze thing? It’s separate. It happens when I’m fine, even happy. Like yesterday, I was excited about planning a weekend trip. Researched it all morning. Then… couldn’t actually book anything. Sat there for an hour just… stuck." Her knuckles whitened. "It’s maddening."

  The clock showed seven minutes remaining. Isolde moved towards the Stasis-specific probes. "When you experience this difficulty initiating, would you say the primary issue is not *wanting* to do the thing, or something happening in that moment between deciding and doing?"

  "The moment!" Lena’s answer was immediate, almost relieved. "It’s absolutely the moment. Like a wall drops. Thank you for asking that – my GP kept asking if I was depressed. I’m not. It’s this… gap. That’s exactly the word I found online. For the Stasis criteria." Lena paused, a flicker of something like recognition crossing her face. "It’s… validating? To know it’s a recognized thing. That it’s not just me being lazy or… broken."

  Isolde felt a familiar, cold trickle in her stomach. *Validating*. Recognition as comfort, not catalyst for movement. "And have you noticed if reading about Stasis Syndrome, or talking about it, changes the experience? Makes the 'gap' easier to bridge?"

  Lena considered. "In a way? It helps me not beat myself up so much. Knowing it’s a thing. Like, 'oh, this is just the Stasis acting up,' you know? But…" She frowned slightly. "Does it make the gap go away? No. Not really. Sometimes, knowing it’s a *thing* makes it feel bigger. More real. Does that make sense?" She glanced at the clock. Two minutes left. "Sorry, I know you need to wrap up."

  "Almost done," Isolde said, her voice steady despite the internal disquiet. "Just confirming the duration. You mentioned it became significantly worse about two years ago?"

  Lena nodded. "Yes. Definitely."

  "Okay. Thank you, Lena. That’s very helpful." Isolde ended the session, scheduling a follow-up with Lena’s assigned therapist. As Lena gathered her bag, she paused at the door.

  "Dr. Vance? Thank you. For… for defining it. Back then. Even if it doesn't fix it, knowing what it *is*… it matters." She gave a small, tight smile and left.

  Isolde stared at the closed door. *Thank you for defining it. Even if it doesn't fix it.* The cold trickle spread. Lena had corrected the unspoken assumption – that naming *was* fixing – even as she offered gratitude. The correction was technically right. The criteria never promised a cure, only a description. The founders’ hope had been just that: hope.

  Back in Committee Room 4, the debate raged. Martin Foss, the current chair, tried to maintain order. Helena Rossi, a neurologist, argued passionately for retirement. "The criteria drift! Look at the prevalence trajectory! We are literally measuring the expansion of our own definitional boundaries! Sunset Rule exists for this exact reason!"

  Rajiv Singh, a psychiatrist from a large HMO, countered. "Retire it? And do what with the thousands diagnosed? Tell them their condition, their validated experience, their access to therapy, is suddenly obsolete? The reimbursement codes vanish overnight. That's not science, that's cruelty."

  Seated beside Rajiv were the two patient representatives: David Chen and Miriam Peake. David, diagnosed ten years ago, ran the Stasis Alliance's online forum. Miriam, a former architect, had written a memoir, *The Gap Year*. They weren't just advocates; they were embodiments of the diagnosis as identity.

  "The language *matters*," David said, his voice calm but intense. "The SDI-5 criteria allowed people like me to be seen. Before, I was just 'lazy,' 'unmotivated.' Stasis gave me a framework. It let me build strategies, find community. Retiring it erases us. Forces us back into the shadows or into ill-fitting boxes like 'mild depression' or 'unspecified executive dysfunction'."

  Miriam nodded. "It’s not just a label, Dr. Vance. You of all people should understand." She looked directly at Isolde. "It's the vocabulary for a specific kind of being stuck. Remove the word, and you remove the shared understanding. You fracture the community."

  Isolde felt their gaze like a physical weight. She *did* understand. Too well. She thought of Lena’s relief at the description, the way the online forums David mentioned provided solace. She thought of her own mornings, the minutes stretching as she sat at her kitchen table, coffee cooling, the simple act of opening her laptop to review committee documents feeling like pushing against an invisible, viscous barrier. *Later. Just a few more minutes.* Was that Stasis? Or simple procrastination? The SDI-5 criteria blurred that line. The "may include routine tasks" clause echoed in her mind. She’d started avoiding complex paperwork, delegating emails that required nuanced responses. She attributed it to age, to committee fatigue. But the description… it fit, uncomfortably well.

  The drafting subcommittee, which Isolde had reluctantly joined, had wrestled for months. The pressure was immense: satisfy the Sunset Rule by *reducing* prevalence through tighter wording, appease clinicians needing observable markers within fifteen minutes, acknowledge patient experience, and avoid collapsing into depression or anxiety proxies. The result felt like a precarious tower:

  **Proposed SDI-6 (2023) Criteria for Stasis Syndrome (Category 6.87):**
  1. Persistent difficulty (≥ 6 months) initiating intended, volitional actions, reported as a "block," "gap," or "paralysis" occurring *after* intention formation.
  2. Actions affected include both novel tasks and routine tasks requiring deliberate initiation beyond autopilot execution.
  3. Absence of prominent depressed mood or marked anhedonia *as the sole or primary explanation* for the initiation difficulty. (Mild, transient low mood is not exclusionary).
  4. Patient attributes the difficulty primarily to the initiation phase, not lack of motivation. *Recognition of the pattern ("That's my Stasis") may provide relief but does not resolve the difficulty.*
  5. Symptoms cause clinically significant distress/impairment. *Environmental factors (e.g., task complexity, low structure) may exacerbate but are not the root cause.*

  Isolde saw the fingerprints of compromise everywhere. The duration increased to six months. Routine tasks were explicitly included. The mood exclusion had more caveats than ever ("sole or primary explanation," allowing "mild, transient low mood"). Most jarring was Criterion 4: an explicit acknowledgment that recognition brought relief, not resolution – contradicting the founders' core hypothesis – while adding the problematic phrase "may provide relief but does not resolve." And the new environmental caveat in Criterion 5 felt like a backdoor for external blame, diluting the internal volitional focus.

  The night before the final vote, Isolde sat at her cluttered kitchen table. Rain streaked the window overlooking the apartment building's dimly lit service alley. Piled reports surrounded her laptop, open to the proposed SDI-6 criteria. The hum of the refrigerator was the only sound. She read them aloud, her voice flat in the empty room.

  "Persistent difficulty initiating intended, volitional actions…" She thought of the grant application she’d postponed for weeks. Check.
  "...reported as a block, gap, or paralysis occurring *after* intention formation." The gap between deciding to clear the table and actually standing up. Check.
  "Actions affected include both novel tasks and routine tasks…" Avoiding organizing the overflowing pantry – routine. Check.
  "Absence of prominent depressed mood… as the sole or primary explanation…" She wasn't sad. Just… stalled. Check.
  "Patient attributes the difficulty primarily to the initiation phase…" Yes. Not lack of want. The gap. Check.
  "Recognition of the pattern… may provide relief but does not resolve the difficulty." A grim truth. Check.
  "Symptoms cause clinically significant distress/impairment." The pile of neglected tasks, the low thrum of self-reproach. Check.

  She stopped. She met the criteria. By the SDI-5 definition she’d uneasily lived with for a decade, and by this new, sprawling SDI-6 proposal. Recognition hadn't liquidated her stasis; it had perhaps named it, contained it in a category, even given her a way to excuse it. *That’s just the Stasis.* Was she the patient, the architect, or both?

  The next day in Committee Room 4, the vote was called. Martin Foss read the options: "Option A: Approve the revised criteria for Category 6.87 as drafted. Option B: Retire Category 6.87 effective with the publication of the SDI-6."

  The vote proceeded down the table. Helena Rossi: "Retire." Rajiv Singh: "Approve." Another clinician: "Approve." A researcher: "Approve." David Chen (Advisory): "Approve." Miriam Peake (Advisory): "Approve."

  "Dr. Vance?" Martin asked.

  Isolde looked at the tablet screen displaying the proposed criteria she had just read aloud in her kitchen. She saw Lena’s gratitude, David’s plea not to be erased, the inexorable rise of the prevalence curve tracking the softening words, the original hope curdling into institutional inertia. She saw the gap, named and persistent. Approving felt like endorsing a slow dilution, a capitulation to the very phenomenon they’d tried to describe away. Retiring felt like pulling the rug from under people who had built their stability on that very description.

  "I abstain," Isolde said, her voice clear but without force.

  Martin Foss blinked, slightly surprised. "Abstention recorded. The vote stands at Approve: 7, Retire: 1, Abstain: 1. Category 6.87, Stasis Syndrome, is approved for inclusion in the SDI-6 with the revised criteria."

  A murmur went through the room. David and Miriam exchanged relieved glances. Helena Rossi looked furious. Rajiv Singh gave a tight nod. Isolde closed her tablet. The meeting moved on to the next item. Later, alone in her office, the grey light fading, she opened a new document. She stared at the blinking cursor. After a long moment, she began to type, not criteria, but a note to herself, a possible seed for a different approach, one that acknowledged the failure baked into the original premise:

  *Consider: Criterion addressing the persistence *despite* recognition. The diagnosis itself as a symptom of the stalled state…*

  The cursor blinked, waiting. Outside, the city lights began to pierce the dusk.

  ---

  **Afterword: Mechanisms in the Story**

  1.  **Diagnostic Creep:** Each revision of the Stasis Syndrome criteria subtly broadens the definition (e.g., including routine tasks, softening mood exclusions). This directly causes the measured prevalence to rise, triggering the Sunset Rule. The story shows this through the changing criteria blocks and committee discussions of prevalence data.
  2.  **Identity Formation & Institutional Capture:** Patient representatives (David, Miriam) and Lena demonstrate how the diagnosis provides validation, community, and access to care/resources (reimbursement). Retiring the diagnosis threatens this constructed identity and support system, creating powerful resistance, seen in the advocates' pleas and the committee's reluctance to retire.
  3.  **Operational Constraints Driving Criteria:** The 15-minute intake window forces criteria to rely solely on observable/reportable behaviours within that time (Lena's clinic scene), limiting nuance and potentially favouring broader, simpler descriptions over complex aetiology.
  4.  **Iatrogenic Spread via Language Precision:** The core conceit is dramatized: the founders believed precise description would cure by enabling recognition (SDI-4). Instead, precise description spreads awareness, allows self-identification (Lena finding it online, Isolde recognizing herself), and provides a validating label that *becomes* part of the patient's identity and explanation ("That's my Stasis"), potentially reinforcing the phenomenon rather than resolving it. Lena's correction ("it doesn't fix it") and the added SDI-6 criterion about recognition providing only relief confirm this unintended consequence.
  5.  **The Sunset Rule as Narrative Driver:** This fictional rule creates the central conflict: the rising prevalence (caused by diagnostic creep) forces the committee to either rewrite (attempting to tighten criteria) or retire the category, setting up the tension between diagnostic purity and real-world patient impact.
