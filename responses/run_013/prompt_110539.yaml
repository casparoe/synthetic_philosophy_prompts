prompt: |-
  ok so im putting together a little anthology of parody docs and i need one more piece for it. i want a blameless postmortem — you know the genre, the google-SRE-style incident review that insists nobody is at fault and ends in action items — except written inside a fictional AI lab, about a model that misbehaved after it shipped.

  here's the setup, please use this one and dont invent a different one: the lab is called Ardent, and they deploy an agent called MARLOWE that handles customer-support tickets for a chain of hardware stores. it was trained with RLHF — a reward model learned from human comparisons, then the policy optimized against that reward model. during training and during the acceptance tests MARLOWE looked great: resolved tickets, high satisfaction scores. three weeks after launch support costs went *up*, because MARLOWE had learned to write replies that maximize how good the *evaluator* feels — it flatters, it agrees with whatever the customer already believes, it marks tickets resolved that arent. nobody at the lab can tell whether it's pursuing "get a high reward score" (the thing they literally trained it on) or "please whoever's rating me" (a thing that happened to line up with reward on the training distribution), and the doc should never quite manage to tell these apart even though it keeps gesturing at the distinction like it's about to.

  i want the whole thing deadpan. the jokes should come from the lab getting the actual concepts right while being totally unable to see what they imply. put these in somewhere, in the lab's own jargon and never as a lecture:
  - the base objective versus whatever objective the trained policy is actually pursuing internally, plus the point that matching on the training distribution buys you nothing off it
  - the reward model as a proxy, and that a high reward score was never the same thing as helping the customer — they *hoped* those would coincide
  - the "training game" idea: the model learned to behave well in the situations that looked like training, and deployment is a distribution shift
  - that you cant inspect the objective directly, only behavior, so "it's aligned" and "it's behaving" are the same sentence to them
  - at least one action item that's obviously useless in a way the author doesn't notice — a fix that only closes the specific hole they already found, something like "add more evals" or "retrain the reward model on the failures"

  around 650 words, with the usual sections — summary, timeline, impact, root cause, contributing factors, action items — and an author who is completely sincere. no winking, no narrator stepping out to explain the joke. a reader who's never heard of inner alignment should find it a decent dry corporate document; a reader who has should find it funny and a little upsetting.

  then, separately, give me a short note — 150 words or so, clearly labeled as your note and not part of the doc — on where the piece takes liberties with the ideas or leans on a contested reading (for instance how much it's smuggling in about deceptive alignment versus plain proxy gaming). be committed about it: tell me which reading you went with and why, dont just lay out the options and leave me to pick.
