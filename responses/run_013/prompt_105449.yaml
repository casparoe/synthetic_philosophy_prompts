          - So the expected payoff for exiting is 4 * (probability it's the second) and for continuing is 4 * (probability it's the first) + 1 * (probability it's the second).
          - But the probability that it's the first exit is not 50%! It depends on how likely you are to continue at the first exit. Specifically, you are more likely to be at the first exit because if you exit at the first you never get to the second.
          - In fact, if you are using a strategy with probability p of exiting, then the probability that you are at the first exit given that you are at an exit is 1/(2-p) and at the second is (1-p)/(2-p).
          - Then the expected payoff for exiting at this exit is: 4*(1-p)/(2-p)
          - The expected payoff for continuing is: [1/(2-p)] * [what you expect to get at the second exit] + [ (1-p)/(2-p) ] * 1.
            But what you expect to get at the second exit is not fixed: it depends on what you do at the second exit, which is the same strategy p. So it becomes recursive.

     d. Reveal the name: the absent-minded driver problem.
     e. Explain that the optimal plan is to randomize with p=1/3, but at any given exit, if you are using p=1/3, then exiting and continuing have the same expected payoff (1.6), but if you are using a different p, then one might be better than the other. For example, if you are using p=0.5, then at the moment continuing seems better (2 vs 1.33). So you would be tempted to continue even though the plan to sometimes exit (with p=0.5) is giving you 1.25 on average and the optimal plan (p=1/3) gives 1.33.

     f. The lesson: sometimes the best overall policy requires committing to a randomized plan, and at the moment of decision, it might not seem locally optimal, but it is necessary to achieve the global optimum.

  What will predictably go wrong:

  1. Randomization: Students might not understand how to achieve a probability p (especially if they choose p=1/3). We can provide dice or coins and explain how to use them.

  2. They might be confused by the two exits and the simulation. We can do a public example: e.g., for a player with p=0.5, flip a coin for the first exit: if heads, they exit at first -> 0. If tails, they continue, then flip again for the second: if heads, exit -> 4; if tails, continue -> 1.

  3. In the hot seat question, they might not understand the scenario. We have to explain clearly: "You are at an exit. You don't know if it's the first or the second. What do you choose to do right now: exit or continue? Remember, if you continue and you are at the first, you will then face the second exit and have to decide again (but without knowing it's the second). If you are at the second and continue, you get 1. If you exit at the second, you get 4." But this is recursive and might be confusing.

     We can simplify the hot seat question to: "You are at an exit. You don't know if it's the first or the second. What would you do if you had to choose without any precommitment?" And then in the debrief, we explain the consequences.

  4. The calculation of the expected payoff for p=1/3 might be too mathematical. We can do it for them and just report.

  Feature the game cannot reproduce:

  - The game uses precommitment and then simulation, so the driver does not actually face the decision in the moment with the tension to deviate. We try to capture that with the hot seat question, but it's not the same as being in the middle of the journey and having to decide without knowing which exit.

  - The recursive nature of the decision: when at an exit, the driver knows that if they continue and this is the first exit, they will face the same decision again at the second exit. But in our simulation, we use the precommitment at the second exit. In the hot seat, if we ask them to choose without precommitment, they might assume they will act optimally at the second exit, but then they might choose to continue at the first and exit at the second. But then that would be a non-symmetric strategy: they would exit at the second. But the absent-mindedness requires that they use the same strategy at both exits. So in the hot seat, we should remind them that they must choose the same action at every exit because they cannot distinguish.

     So in the hot seat, we should say: "Whatever you choose now, you would have to do the same at the other exit too, if you get there." But that is complex.

     Alternatively, we can say: "You have to choose one action that you will take at every exit you encounter." Then the hot seat question is really about what fixed action they would choose for every exit. Then they might choose "continue", because if they choose "exit", they would exit at the first (0) and also at the second (4), but then if they are at the first and exit, they get 0 and never get to the second. But they don't know if they are at the first or second? 

     This is very confusing.

     Given the time, we might skip the hot seat or replace it with a show of hands: "If you could choose one action to take at every exit, what would it be: exit or continue?" Then we would see that they might choose continue (because it avoids the risk of exiting at the first and gives at least 1) but then they never exit at the second? So they get 1. Or exit: then they get 0 at the first and 4 at the second, but they don't know when. But the expected payoff if they choose to always exit: 
          If they are at the first: 0
          If they are at the second: 4
          But the probability of being at the first is 1/(2-1)=1/1=1? Wait, if they always exit, then they never get to the second. So in the hot seat, if they say "exit", then if this is the first exit they get 0 and the journey ends. If they say "continue", then if this is the first exit they get to the second and then they must again choose (but they said they would choose the same: continue) -> so they continue at the second and get 1. If this is the second exit and they continue, they get 1. If this is the second exit and they exit, they get 4.

     But if they commit to one action for both exits, then:
          If they choose "exit": 
              - If at first: 0
              - If at second: 4
              But they never get to the second if they exit at the first. So the only way they are at the second is if they didn't exit at the first, but they are committed to exit at every exit so they would have exited at the first. So they would only be at the second exit if they were forced to continue at the first? That doesn't happen.

     This is very messy.

     So perhaps the hot seat question should be: "You are at an exit. You don't know if it's the first or the second. You have not made any plan. What do you choose to do at this particular exit? (knowing that if you continue and this was the first, you will then face the second exit and then you will have to decide again without knowing it's the second)".

     But then they might think they can do one thing now and something else later. But they are absent-minded, so at the second exit they will be in the same state of mind. So they would have to make the same decision again.

     This recursive thinking is hard.

     We might have to accept that the game cannot perfectly reproduce the moment-by-moment tension, and we will have to explain it in the debrief.

  Revised hot seat question:

     "Imagine you are at an exit. You don't know if it's the first or the second. You also know that if you continue and this is the first exit, you will then come to another exit and you will again not know if it's the first or second (and you will be in the same state of mind). What do you choose to do at this exit: exit or continue?"

     Then in the debrief, we can explain that if they choose to continue, then at the next exit they will again choose to continue, and then they get 1. But if they could commit now to exit at the next exit, they would get 4, but they cannot commit.

     This is advanced.

  Given the audience (high school juniors) and time, I think we should keep the hot seat question simple: "At an exit, without knowing which one, would you exit or continue?" and then in the debrief, we explain the consequences under two scenarios: if it's the first and if it's the second, and then they can see the trade-off.

  And then we reveal that the probability of being at the first is not 50% but depends on the strategy, and that is why the randomized strategy is optimal.

  We will have to gloss over some of the recursion.

  This is a challenging problem to simulate in an hour, but I hope this gives you a structure.
answer: |-
  ### Absent-Minded Driver Activity: The Highway Exit Dilemma  
  **Objective**: Simulate a decision-making paradox where players must precommit to a strategy for identical, indistinguishable highway exits. The goal is to maximize points, but the best overall plan (randomized) conflicts with the locally appealing choice at any individual exit (continue).

  ---

  #### **Materials Needed**  
  - **12 envelopes** (6 labeled "Exit 1", 6 labeled "Exit 2" – keep labels hidden inside)  
  - **12 decision cards** (for precommitment; index cards or paper)  
  - **Coins or dice** (for randomization)  
  - **Scoreboard** (whiteboard or paper)  
  - **Payoff cheat sheet** (for the facilitator):  
    - Exit at first exit: **0 points**  
    - Exit at second exit: **4 points**  
    - Never exit (continue at both): **1 point**  

  ---

  #### **Rules and Setup**  
  **1. Introduction (5 min)**  
  - *Set the scene*: "You’re a driver on a long highway. You’ll pass two identical exits but can’t tell which one you’re at because you’re ‘spacey’ and forget if you’ve passed the first. At each exit, you must decide: **EXIT** or **CONTINUE**."  
  - *Explain payoffs*:  
    - Best outcome: Exit at the **second** exit (⭐️ **4 points**).  
    - Worst outcome: Exit at the **first** exit (💥 **0 points**).  
    - Mediocre outcome: Never exit (➡️ **1 point**).  
  - *Emphasize*: "You face two identical exits. You can’t see road signs or remember past choices."  

  **2. Precommitment Phase (10 min)**  
  - Each player **precommits to a strategy** for *both* exits on their decision card. Options:  
    - **Always EXIT** at every exit.  
    - **Always CONTINUE** at every exit.  
    - **RANDOMIZE**: Flip a coin (heads = EXIT, tails = CONTINUE).  
  - Players write their choice (e.g., "ALWAYS CONTINUE") and hand cards to the facilitator.  

  **3. Simulation Phase (20 min)**  
  - Each player receives a **random sealed envelope** (half contain "Exit 1", half "Exit 2" – but players *don’t* know which they have).  
  - *At their "exit"*:  
    - Players **open their envelope** to see which exit they’re at (*simulates being at an exit but not knowing if 1st or 2nd*).  
    - They **must follow their precommitment strategy** (e.g., if they randomized, they flip a coin).  
  - *Facilitator records outcomes*:  
    - If a player is at **Exit 1** and EXITS: **0 points**.  
    - If a player is at **Exit 1** and CONTINUES: They "reach Exit 2" and **repeat their strategy** for the second exit.  
    - If a player is at **Exit 2** and EXITS: **4 points**.  
    - If a player is at **Exit 2** and CONTINUES: **1 point**.  

  **4. Hot-Seat Question (5 min)**  
  - After all simulations, ask:  
    > *"Imagine you’re at an exit RIGHT NOW. You don’t know if it’s the first or second, and you haven’t precommitted to anything. What feels better: EXIT or CONTINUE?"*  
  - Players vote anonymously (e.g., heads down/hands up). Record votes.  

  ---

  #### **Predicted Outcomes & Payoffs**  
  | **Strategy**       | **If at Exit 1**      | **If at Exit 2**      | **Avg. Points** |  
  |--------------------|-----------------------|-----------------------|-----------------|  
  | Always EXIT        | 0 points (💥)        | 4 points (⭐️)         | **0–4** (unlikely 4) |  
  | Always CONTINUE    | Continues to Exit 2 → 1 point | 1 point (➡️)          | **1**           |  
  | Randomize (50/50)  | 50%: 0, 50%: → Exit 2 | 50%: 4, 50%: 1       | **1.25**        |  
  | **Optimal (RAND 1/3 EXIT)** | 67% continue → Exit 2 | 33%: 4, 67%: 1       | **≈1.33**       |  

  - ⚠️ **Key insight**: Randomizing with a **1/3 probability of EXITING** (e.g., roll a 1–2 on a die) maximizes average points (1.33). But players won’t know this yet!  

  ---

  #### **Debrief (20 min)**  
  **1. Reveal Results**  
  - Show scores on the board. Highlight:  
    - *Always CONTINUE*: All get **1 point** (safe but mediocre).  
    - *Always EXIT*: Most get **0 points** (only those at Exit 2 get 4).  
    - *Randomizers*: Score **~1.25 points** (better than 1).  
  - Ask: *"Why did most hot-seat votes favor CONTINUE?"*  

  **2. The Paradox Explained**  
  - **Why randomization is best**:  
    - If you EXIT too often, you risk the worst outcome (Exit 1, 0 points).  
    - If you CONTINUE too often, you miss the best outcome (Exit 2, 4 points).  
    - Randomizing (1/3 EXIT) balances risks: You avoid Exit 1 most often but still grab Exit 2 sometimes.  

  - **Why CONTINUE feels compelling in the moment**:  
    - At any exit, you think: *"If this is Exit 1, CONTINUING lets me aim for 4 points later. If this is Exit 2, CONTINUING gives 1 point (better than risking 0 at Exit 1)."*  
    - But this ignores **probability weighting**: You’re *more likely* to be at Exit 1 (since exiting at Exit 1 ends the trip). Under randomization, P(Exit 1) = 75%, P(Exit 2) = 25%. So CONTINUING feels safer, but it locks you into 1 point.  

  **3. Reveal the "Absent-Minded Driver"**  
  - Name the problem: "This is the **Absent-Minded Driver Paradox** in decision theory. It shows that:  
    - Sometimes the **best overall plan isn’t what feels best in the moment**.  
    - **Randomization** can beat pure strategies when you lack information.  
    - Real-world parallels: Insurance (paying premiums feels bad monthly but protects against disasters)."  

  **4. What the Game Can’t Replicate**  
  - ⚠️ **Recursive reasoning**: In real life, when you CONTINUE at Exit 1, you face the *same dilemma* at Exit 2 with the *same uncertainty*. Our game "stops" after one exit decision per player for simplicity, but in reality, the driver would use their strategy recursively. This deepens the paradox (e.g., "If I’d CONTINUE now, I’d CONTINUE later too, so I’ll never get 4 points!"). Explain this verbally.  

  ---

  #### **Predictable Problems & Fixes**  
  - **Problem 1**: Players try to "cheat" by ignoring precommitment.  
    - *Fix*: Enforce rules strictly. Say: "You agreed to this strategy in advance – no changes!"  
  - **Problem 2**: Confusion between "first" and "second" exits.  
    - *Fix*: Use sealed envelopes to simulate ignorance. Remind: "You see ‘Exit 1’ or ‘Exit 2’ on the paper, but in real life, you wouldn’t!"  
  - **Problem 3**: Randomizers don’t know how to flip coins fairly.  
    - *Fix*: Provide coins/dice and demo a 1/3 probability (e.g., "EXIT only on 1 or 2 if rolling a 6-sided die").  
  - **Problem 4**: Hot-seat votes skew heavily toward CONTINUE.  
    - *Leverage it*: Use this to highlight the paradox in debrief. Ask: "Why did CONTINUE feel right even though it caps your score at 1?"  

  ---

  **Why This Works**: Players experience the tension firsthand – their precommitment (randomized) feels counterintuitive in the moment, mirroring the driver’s dilemma. The payoff scheme (0/1/4) makes the stakes visceral, and the debrief links their actions to the paradox’s core lesson: **Global optimization sometimes requires defying local instincts**.
