  But note: the cyclic case is about a single time. The agent has these preferences simultaneously. That is, at the time of the first trade, she prefers C to A. At the time of the second trade (still the same time? or a very short interval?) she prefers B to C, and then at the third trade, she prefers A to B. But if all these trades happen at the same time, then we can present the entire sequence and she would see the cycle and refuse. So the standard argument assumes that the trades are separated in time so that the agent only sees one step at a time.

  In the changing preferences case, the trades occur at different times when the agent's preferences are different. The argument is that at each time the agent is acting on her current preferences, and that leads to a loss.

  The problem: if we accept (4) as stated, then both the cyclic agent and the agent with changing preferences are irrational. But we want to say that changing preferences is not irrational.

  So what is the difference?

  One common response is that the agent in the changing preferences case can plan ahead. At 9am, she knows that at noon she will want to trade back. So she might refuse the first trade to avoid the loss. But in the story, we are told that the agent at each moment does what she then most prefers. So if at 9am she is offered the trade (savory for sweet plus $1), she prefers to make the trade. And if she doesn't make the trade, then she is not doing what she most prefers at 9am? But wait: if she knows that making the trade will lead to a loss, then at 9am she might prefer not to make the trade because of the future consequence.

