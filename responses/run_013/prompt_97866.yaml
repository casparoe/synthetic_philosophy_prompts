prompt: |-
  Years of reading rationalist blogs have left me fond of David Lewis's account of convention — a convention being a regularity in a population's behavior that everyone conforms to, expects everyone else to conform to, and prefers to conform to on condition that others do, because it resolves a recurring coordination problem; the regularity is arbitrary in that some other equilibrium would have served just as well, and all of this is common knowledge. A friend in my reading group has extracted the following argument from that account, and neither of us can tell whether it exposes a real gap or merely abuses the machinery.

  (1) For a regularity to count as a Lewis convention, the relevant mutual expectations must be common knowledge in the population.
  (2) Common knowledge of that kind can only be produced by some shared practice of attending to the same signals, precedents, or saliences.
  (3) Any such shared practice is itself a regularity sustained by mutual expectation, and therefore a convention.
  (4) So every convention presupposes a prior convention.
  (5) There is no infinite regress of conventions, and any finite regress must begin somewhere.
  (6) Therefore there is no first convention, and so no conventions at all.
  (7) But language and traffic rules plainly are conventions, so something has gone wrong.

  Which step should I reject, and what does rejecting it cost? I would most like to keep (1), since the account seems toothless without common knowledge, but I want to know what I am paying. If it helps, tell me whether the trouble lies in the argument itself or in a genuine bootstrapping gap that the later simulation literature on the evolution of conventions has to plug. Please answer in American English.
reasoning: |-
  Okay, let me tackle this user's problem. They're dealing with a philosophical argument derived from David Lewis's convention theory. The user and their friend are stuck on whether the argument reveals a real issue or just misapplies Lewis's framework. The core concern is a potential infinite regress that seems to undermine the existence of conventions altogether, which clashes with obvious real-world examples like language and traffic rules.

  First, I need to parse the argument step by step. Premise (1) emphasizes common knowledge as essential for Lewis conventions. That seems solid—Lewis himself insists on this. Premise (2) claims such common knowledge requires shared practices, which sounds plausible too. But premise (3) labels those practices as conventions themselves, leading to (4)'s regress. The user wants to preserve (1) but sees the trap: if each convention needs a prior one, and we can't have infinite chains (5), then conventions can't exist (6)—contradicting reality (7).

  Hmm. The user's attachment to (1) makes sense—without common knowledge, Lewis's definition loses its distinctiveness. But defending it means finding where the regress breaks. I recall Lewis actually addresses this! In *Convention*, he distinguishes between "basic" and "derived" conventions. Basic conventions emerge from pre-linguistic coordination, like focal points in Schelling games. No prior convention needed—just shared human psychology or environmental saliences. 

  For example, two people stranded on remote islands might naturally meet at the only mountain peak visible to both. That's not a convention yet; it's raw coordination. Once they repeat it and expectations form, it becomes convention. The salience (the mountain) isn't conventional—it's just *there*. So premise (3) is the weak link: not all shared practices are conventions. Some are proto-conventions rooted in biology or perception. 

  The user might worry this "solves" the regress by watering down Lewis. But actually, it strengthens the account! It shows how conventions bootstrap from simpler, non-conventional roots. Later evolutionary models (like Skyrms's signaling games) formalize this—agents can develop conventions through repeated interaction without infinite prerequisites. 

  Rejecting (3) costs little. It just clarifies that Lewis's machinery allows for natural anchors. The user keeps common knowledge intact while avoiding absurd conclusions. Win-win!
answer: |-
  Here's the breakdown of why the argument fails and what rejecting step (3) costs, while preserving the core of Lewis's account (step 1):

  1.  **The Core Problem is Step (3):** "Any such shared practice is itself a regularity sustained by mutual expectation, and therefore a convention."
  2.  **Reject Step (3):** Not every "shared practice of attending to the same signals, precedents, or saliences" that *enables* common knowledge is itself a *Lewis convention*. Many of these grounding mechanisms are **non-conventional**.

  **Why Rejecting (3) Works & What Lewis Actually Says:**

  1.  **Pre-Conventional Salience & Focal Points:** Lewis's core insight (drawing on Schelling) is that coordination problems often have inherent **focal points** – solutions that stand out as "natural" or "salient" due to human psychology, perception, or the structure of the situation itself. These don't require *prior mutual expectations* or an established convention. Examples:
      *   Two people stranded on opposite sides of a river might both head for the *only bridge* visible to both. The bridge is salient.
      *   Two people trying to meet in a city with no prior arrangement might both go to the *main train station* at *noon*. Time and place are salient.
      *   Seeing a bright flashing light naturally draws attention.
  2.  **Non-Conventional Basis for Common Knowledge:** The "shared practice of attending" described in (2) can emerge from these pre-existing saliences or innate human tendencies (like noticing sudden movements, loud noises, symmetry, uniqueness, or central locations). This shared attention creates a platform for *common knowledge* to arise *about a specific coordination problem* without relying on a *prior convention* governing the attention itself.
      *   **Example:** Everyone sees the traffic light turn red (salient signal). This shared perceptual experience, combined with the inherent danger of ignoring it, allows common knowledge ("We all see it's red; we all know we all see it; we all know stopping is expected") to form *in that moment*, bootstrapping the convention of obeying traffic lights. The *practice of looking at traffic lights* isn't a separate convention – it's driven by the light's salience and the obvious need to coordinate to avoid crashes.
  3.  **The Emergence of the First Convention:** The very first conventions in a domain arise when a group repeatedly faces a similar coordination problem, a salient solution presents itself (or is experimented with), individuals start to *expect* others to choose it because it's salient, and this expectation becomes common knowledge *through repeated successful coordination around that salience*. The salience anchors the initial expectations; it doesn't require a prior convention.
  4.  **Distinguishing Mechanism from Convention:** The "shared practice of attending" (step 2) is often a *mechanism* or *capacity* (noticing salience, having similar perceptual apparatus, basic causal reasoning) or a *byproduct* of the environment's structure, *not* a self-sustaining regularity governed by mutual expectations like a Lewis convention. It's the *precondition* for conventions to form, not a convention itself.

  **What Rejecting (3) Costs You (Minimal Cost):**

  *   **Slightly Less "Purity":** You acknowledge that the foundations of convention aren't *themselves* conventional all the way down. There's a layer of **natural salience, human psychology, and environmental structure** that bootstraps the first conventions. Lewis explicitly relies on this (focal points).
  *   **No Cost to Core Lewisian Definition:** You keep step (1) intact. Conventions *themselves* still robustly require common knowledge, mutual expectations, and preference for conformity. You've just clarified how that common knowledge *can* get started without infinite regress.

  **Addressing Your Broader Questions:**

  *   **Trouble in the Argument:** The trouble is primarily *in the argument itself*, specifically the overreach in step (3). It misapplies the definition of "convention" to things that are fundamentally *pre-conventional* anchors for coordination.
  *   **Genuine Bootstrapping Gap & Later Literature:** There *is* a genuine challenge in explaining *how* common knowledge initially arises, which Lewis addresses with salience/focal points. Later evolutionary game theory (like Skyrms, Young, Binmore) plugs this gap *dynamically*:
      *   **Simulations:** Show how populations of simple agents (using reinforcement learning, imitation, or best-response dynamics) can *stumble into* coordinated behaviors around initially weak saliences or random variations. Successful coordination is reinforced, leading to the emergence of stable conventions *without* requiring explicit common knowledge from the outset. Common knowledge is an *outcome* of the evolved stable state, not always a prerequisite for its emergence.
      *   **Cost:** This literature sometimes weakens the strict common knowledge requirement, showing how conventions can emerge from simpler learning processes. However, it *validates* the core Lewisian insight that conventions solve coordination problems and are often arbitrary. It provides a mechanistic account of the bootstrapping process that Lewis described more abstractly with focal points.

  **Conclusion:**

  Reject step (3). The "shared practices of attending" needed for common knowledge are often based on **non-conventional saliences, innate human perceptual/cognitive biases, or environmental structures**. These provide the necessary anchor to bootstrap the first conventions without infinite regress.

  *   **You Keep:** The essential Lewisian definition requiring common knowledge for conventions (Step 1).
  *   **You Pay:** Acknowledging that the bedrock isn't convention itself, but natural/perceptual/psychological salience – a small price that aligns perfectly with Lewis's own use of focal points and is addressed robustly by later evolutionary models showing how conventions emerge dynamically. Language and traffic rules *are* conventions; they bootstrapped from non-conventional roots like salient gestures, sounds, or obvious physical signals.
