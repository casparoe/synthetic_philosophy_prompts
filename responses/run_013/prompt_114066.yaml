prompt: |-
  So my mate Dan and I had a two-hour fight on Tuesday night about whether a bee can be in pain, and I can't let it go. His position: pain is just a certain role a state plays in a system — comes in from the sensors, drives the behaviour, talks to the other states — so if something plays that role, it's in pain, end of story. His mic-drop phrase was "multiple realizability, mate." Mine was that you could build something that does every single thing pain does and there's still nobody home. He's also got this test he's very proud of: if you can give a thing something and it then works to get more of that thing, that's pain. I think that's doing more work than he admits.

  It's not just a bar argument because of what I do. I sit on the animal care and research ethics committee at my university, and our whole rulebook is basically "has a spine? then it needs a protocol." That rule is falling apart. We've had a bumblebee learning study, a lab growing human brain organoids from stem cells, and a group that wants to use a chatbot as a stand-in for human subjects. We get maybe a dozen of these a year, we decide them one at a time by vibes, and I'm the one who writes the minutes and has to defend them when someone appeals. It's definately not sustainable. I have a bumblebee protocol to vote on in three weeks.

  What I want from you: take the functionalist picture Dan is so smug about, multiple realizability and all, and turn it into a procedure the committee can actually run. In order: the questions to ask, what counts as a good enough answer to each, which answers stop it dead, and where it has to hand off to a human because the question is a value call and not a fact. Give me a small fixed set of labels — three or four, no more — that I can write in the minutes, and use the same ones every time. Flag the steps that are judgment dressed up as procedure; I'd rather know. It has to be runnable in about half an hour by a room that includes a vet, two PIs who'd rather be elsewhere, and a lay member. It has to say what we're allowed to look at — anatomy, behaviour, the wiring, what drugs do to it — since Dan's whole point is that the stuff it's made of shouldn't matter. It needs an answer to the committee member who says that if we go down this road we'll end up protecting the thermostat. And tell me whether Dan's test survives being turned into a step, or whether it's smuggling in something the functionalist picture doesn't actually license.

  Then run it, properly, on three: the bumblebees, the brain organoids, and the chatbot. At least one of these should come out in a way that's inconvenient for me — don't soften it to save me paperwork. And tell me straight what the procedure can't do, the place where it just goes quiet.

  No reading lists, no citations, no "see so-and-so on such-and-such" — nobody in that room is going to read anything I hand them.

  Each case should end with a line "Verdict: <label>", and make the very last line of your whole answer \answer{<label>} with the verdict for the bumblebee protocol.
