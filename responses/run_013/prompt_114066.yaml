answer: |-
  ### Functionalist Pain Assessment Procedure for Ethics Committee

  This procedure assesses whether a system (biological or artificial) might be capable of experiencing pain, based on a functionalist perspective (i.e., pain is defined by the role a state plays: triggered by harmful inputs, driving avoidance behavior, and interacting with other states). The goal is to provide a consistent, evidence-based evaluation that can be completed in ~30 minutes by a diverse committee. It uses observable evidence (anatomy, behavior, "wiring" like neural/algorithmic pathways, pharmacology) and does not consider substrate (e.g., carbon vs. silicon, per functionalism). 

  **Core Principles:**
  - **Rejects Dan's test as sufficient**: Dan's test ("if you give a thing something and it works to avoid it, that's pain") is captured in Steps 2 and 3 but is not enough alone. It risks over-attribution (e.g., thermostats avoid heat but aren't in pain). The procedure adds requirements for learning, flexibility, and trade-offs to avoid this.
  - **Handles judgment calls**: Steps 4 and 5 involve value judgments (flagged below). The committee must discuss and agree on thresholds for terms like "flexible" or "trade-offs."
  - **Fixed verdict labels (use in minutes):**
    - **LOW**: Minimal/no evidence of pain-capability. No additional pain-related protections needed.
    - **HIGH**: Strong evidence of pain-capability. Protections required to minimize potential pain.
    - **UNCERTAIN**: Inconclusive evidence. Precautionary measures advised (e.g., limit exposure to harm, gather more data).
  - **Thermostat counterexample**: A thermostat would score LOW (see Step 1: no learning/flexibility/trade-offs). Functional role alone isn't enough—it must be complex enough to avoid trivial cases.
  - **What we can examine**: Focus on observable data:
    - *Anatomy*: Sensors (e.g., nociceptors), neural structures.
    - *Behavior*: Responses to stimuli, learning, decision-making.
    - *Wiring*: Neural/algorithmic pathways (only to infer function, not substrate).
    - *Pharmacology*: Responses to analgesics/anesthetics (if available).
  - **Limitations**: 
    - Cannot resolve the "hard problem" (subjective experience/"nobody home"). It assumes functional criteria are sufficient for pain-capability.
    - Does not address other ethical issues (e.g., human dignity for organoids, deception for chatbots). These must be handled separately.
    - Struggles with systems that are non-responsive (e.g., anesthetized) or have incomplete data—defaults to UNCERTAIN if ambiguous.
    - Value judgments in Steps 4–5 may lead to committee disagreement; consensus is key.

  **Procedure Steps:**
  1. **Sensory Detection**  
     *Question: Does the system have mechanisms to detect potentially harmful stimuli (e.g., tissue-damaging, evolutionarily threatening inputs)?*  
     - Evidence: Anatomy (e.g., nociceptors), responsive behaviors, or designed sensors (for artificial systems).  
     - Good answer: YES (clear evidence), NO (no evidence), or UNCLEAR (inconclusive data).  
     - Stop if NO: Verdict LOW (no input for pain states). Proceed otherwise.

  2. **Immediate Aversion**  
