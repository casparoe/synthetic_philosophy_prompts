prompt: |-
  I'm a retired geochemist — thirty-odd years of isotope work, mostly on hydrothermal systems — and since I stopped running a lab I've been reading moral philosophy, which I've found much harder than the chemistry, and I mean that as a compliment. For the last two years I've chaired the research-integrity committee at my old institute: five of us, mostly retired, we meet once a month for ninety minutes, and we get maybe fifteen complaints a year, everything from authorship squabbles to outright data fabrication. The wall we keep hitting is this. Somebody files a complaint, and the person on the other end says, in effect, look who's talking. The group whose record-keeping has been a shambles for years complains that another group's notebooks are a shambles. A professor who has quietly handed out gift authorships to his own students complains about a colleague padding an author list. A postdoc who retracted a paper for duplicated image panels complains about someone else's duplicated panels. Right now the committee does one of two things depending on who showed up that day: we treat the "look who's talking" as a full stop and dismiss the complaint, or we wave it away as a distraction and never mention it in the report. Both feel wrong, and I suspect the reason is that I've been conflating two different things — whether the complaint is true, and whether this particular person gets to be the one pressing it. I've run into the vocabulary for this in my reading (standing, warrant, the idea that blame might have a gate as well as a content), but the actual arguments are scattered and I can't tell which of them a committee like ours is supposed to be using, or whether the whole "you have no standing" move is just a debating trick that I should stop dignifying. Note that our committee itself is not innocent here — we sat on a very similar case about eight years ago and did nothing — so I'd like the procedure to say something about whether an institution can lose standing too, not just a person.

  What I want from you is a decision procedure we can actually run in one sitting, not a lecture. Turn whatever the philosophy of blame and hypocrisy actually knows about standing into a sequence of questions, in order, that a committee of retired scientists can work through with a complaint in front of them and a whiteboard behind them: what to ask first, what counts as an answer to each question, where the procedure stops with a dismissal, where it says "the substance is fine but this complainant can't be the one to carry it" (and what that would even look like operationally — do they become an anonymous source? does the committee take the case up on its own motion?), and where it hands the thing back to us because the remaining question is one of values and not of fact. It has to distinguish, if the distinction survives contact with reality, between a complainant who is a hypocrite and a complainant who is simply not a saint; between hypocrisy that bears on the specific charge and hypocrisy that's just an unrelated stain; and between an individual complainant and an institutional one, since half our cases come in as "the department feels that..." and I genuinely don't know what standing means for a body rather than a person. Keep in mind that four of the five of us have no philosophy at all, that whatever we write down has to survive being read by the institute's legal office if anyone appeals, and that the chair — me — signs the report, so the procedure needs to be honest about which calls are mine to make. I'm not asking for a reading list or for you to tell me whose book to consult; most of us don't have library access and anyway that's not the deliverable. Just the machinery.

  Please give it to me in these sections, in this order: first, "The procedure at a glance" — the whole thing as a numbered list I could fit on one whiteboard, ten lines or so, no explanation; then "Step by step", the bulk of the answer, walking through each question, what a sufficient answer looks like, where it terminates, and where it hands off, a page or two; then "Three cases run through it" — use my notebook-shambles case, the gift-authorship case, and one more you invent, ideally one where the procedure tells us to proceed with the complaint and I'd rather it didn't, and say so; then "Where this is judgment in a lab coat" — the steps that look mechanical but aren't, a paragraph or a short list; and finally "What this can't do" — five lines, honest about the cases where it will misfire or produce a result nobody in the room will like. Write it plainly; if you have to choose between precision and something the other four will understand, pick the second one, but flag what got lost.
reasoning: |-
  We are designing a decision procedure for a research-integrity committee to handle complaints where the respondent (the person being complained about) raises a "look who's talking" defense (i.e., the complainant is a hypocrite or has a tainted record). The goal is to separate the issues of (a) the truth of the complaint and (b) the standing of the complainant (or the institution) to bring the complaint. We also need to consider institutional standing.

  The procedure must:
  1. Be runnable in one sitting (about 90 minutes for the committee meeting).
  2. Have clear steps that non-philosophers can follow.
  3. Address whether the complaint is dismissed due to standing, or the substance is considered (and if so, by whom and how).
  4. Distinguish between:
     a. Hypocrisy that is directly relevant to the complaint (e.g., the same type of misconduct) vs. unrelated.
     b. A complainant who is a hypocrite vs. one who is merely imperfect (not a saint).
     c. Individual vs. institutional complainants.
  5. Be legally defensible and clear enough for an institute's legal office.

  We break the procedure into the following steps:

  **The procedure at a glance (numbered list for whiteboard):**

  1. Is the complaint within our mandate? (If not, dismiss or refer; not our focus here.)
  2. Does the respondent raise a "look who's talking" objection? (If not, proceed to substance.)
  3. Is the objection about the complainant's (or institution's) past conduct? (If not, ignore and proceed.)
  4. Is the complainant an individual or an institution?
  5. For an individual: Is the complainant's past conduct of the same type as the alleged misconduct? (If not, note but proceed to substance.)
  6. For an individual: Is the complainant's past conduct severe and unresolved? (If yes, then standing lost: dismiss the complaint without prejudice to substance, and consider if committee should take up on own motion. Else, proceed to substance.)
  7. For an institution: Has the institution previously failed to address the same type of misconduct? (If yes, then standing lost: dismiss without prejudice, and committee must decide if it takes up on own motion. Else, proceed to substance.)
  8. If standing is lost, the committee decides whether to take up the complaint on its own motion (based on severity, evidence, and resources). If taken up, investigate substance. If not, dismiss without prejudice.
  9. If standing is not lost, or if the committee takes up on its own motion, investigate the substance of the complaint (this is outside the standing procedure).
  10. In the report, document the standing decision and the reasons.

  **Step by step:**

  We assume the complaint has been received and is within the committee's mandate (step 1). We focus on steps 2-10.

  **Step 2: Does the respondent raise a "look who's talking" objection?**
     - This is the tu quoque (you too) fallacy in logic, but in ethics it can be relevant to standing.
     - What to ask: Review the respondent's response. Does it specifically point to the complainant's (or the institution's) past misconduct or hypocrisy as a reason to dismiss the complaint?
     - If no, then the objection is not raised. Proceed to investigate the substance of the complaint (step 9). 
     - If yes, go to step 3.

  **Step 3: Is the objection about the complainant's (or institution's) past conduct?**
     - We are only concerned with objections that say the complainant (or the institution) has engaged in similar or related misconduct and therefore should not be heard.
     - What to ask: Is the objection pointing to a past act (or pattern) of misconduct by the complainant or the institution? If it is about something else (e.g., personal grudge, unrelated misbehavior), then note it but do not treat as a standing issue. Proceed to step 9 (substance).
     - If it is about past conduct, go to step 4.

  **Step 4: Is the complainant an individual or an institution?**
     - We must distinguish because standing rules may differ. Note: sometimes a complaint comes from a group (like a department) but is represented by an individual. We treat a group as an institution.
     - What to ask: Who is the named complainant? If it is an individual (e.g., Dr. Smith), then treat as individual. If it is a group (e.g., "the Department of X", "the research group of Y"), then treat as institution. If the complaint is anonymous, we treat it as if it has no complainant (and thus no standing issue) and proceed to step 9, unless the objection is about the institution's past conduct (then step 7).
     - If individual, go to step 5. If institution, go to step 7.

  **Step 5 (for individuals): Is the complainant's past conduct of the same type as the alleged misconduct?**
     - We are trying to see if the hypocrisy is directly relevant. For example, if the complaint is about sloppy record-keeping, and the complainant has a history of sloppy record-keeping, that is the same type. If the complaint is about data fabrication and the complainant once had an authorship dispute, that is not the same type.
     - What to ask: Compare the nature of the alleged misconduct in the complaint with the nature of the complainant's past misconduct (as raised by the respondent). 
     - If they are of the same type (or very closely related), then go to step 6.
     - If they are not of the same type, then the objection is weak and does not defeat standing. Note the objection in the report but proceed to step 9 (investigate substance).

  **Step 6 (for individuals): Is the complainant's past conduct severe and unresolved?**
     - Not every past mistake destroys standing. We need to see if it was severe (e.g., a formal finding of misconduct, a retraction, a pattern) and if it was addressed (e.g., acknowledged, corrected, sanctioned). If the complainant has cleaned up their act, they may have standing.
     - What to ask: 
       - Severity: Was the past conduct a clear violation of research integrity (e.g., data fabrication, plagiarism, serious negligence) or a minor lapse? (Use institutional definitions if available.)
       - Resolution: Was the past conduct formally addressed? (e.g., by a committee, by the complainant correcting the record, by a retraction, by an apology and change in practice.) If it was addressed, then the complainant may have standing. If it was severe and not addressed (or not adequately addressed), then standing is lost.
     - If the past conduct was severe and unresolved, then the complainant lacks standing. The complaint is dismissed without prejudice to the substance (meaning the substance is not evaluated). Then go to step 8 (committee decides if it takes up on own motion).
     - If the past conduct was not severe, or if it was resolved, then standing is not lost. Note the objection in the report but proceed to step 9 (investigate substance).

  **Step 7 (for institutions): Has the institution previously failed to address the same type of misconduct?**
     - Here, the objection is that the institution (e.g., the department, the institute) has a history of ignoring or mishandling the same kind of misconduct. For example, if the complaint is about data fabrication and the institution has turned a blind eye to data fabrication in the past.
     - What to ask:
       - Is there a pattern of the institution failing to address the same type of misconduct? (e.g., multiple instances ignored, or a known culture of tolerance for that misconduct.)
       - Was the failure recent and relevant? (e.g., within the last 5-10 years, and by the same body or leadership that is now hearing the complaint.)
     - If yes, then the institution lacks standing. The complaint is dismissed without prejudice to the substance. Then go to step 8 (committee decides if it takes up on own motion).
     - If no, then the institution has standing. Proceed to step 9 (investigate substance).

  **Step 8: Committee decides whether to take up the complaint on its own motion.**
     - This step is only reached if the complaint was dismissed for lack of standing (from step 6 or 7). The committee must now decide whether the allegations are serious enough and there is enough evidence to warrant an investigation on the committee's own initiative.
     - What to ask:
       - How severe is the alleged misconduct?
       - Is there prima facie evidence (on the face of it, without the complainant's testimony) to support the complaint?
       - Does the committee have the resources to investigate?
     - If the committee votes to take up the case (by majority), then it becomes the committee's own investigation (and the original complainant is no longer the driver). Proceed to step 9 (investigate substance). In the report, the complaint will be noted as having been taken up by the committee on its own motion.
     - If the committee votes not to take up the case, then the matter is closed. The report will state that the complaint was dismissed for lack of standing and that the committee declined to take it up on its own motion.

  **Step 9: Investigate the substance of the complaint.**
     - This is where the committee evaluates the evidence for the alleged misconduct. This step is outside the standing procedure and may require additional meetings and evidence gathering.

  **Step 10: Document the standing decision in the report.**
     - Regardless of the outcome, the committee must clearly state in its report:
       - Whether a standing objection was raised.
       - The decision on standing (and reasons).
       - If the complaint was dismissed for standing, whether the committee took it up on its own motion.

  **Three cases run through it:**

  **Case 1: Notebook shambles (from the query)**
  - *Facts*: Group A (with a history of poor record-keeping) complains that Group B's notebooks are a shambles. Respondent (Group B) objects: "Look who's talking — Group A's record-keeping is a mess too."
  - *Procedure*:
    - Step 2: Respondent raises objection → yes.
    - Step 3: Objection about past conduct → yes.
    - Step 4: Complainant is a group → institution.
    - Step 7: Is the objection about the same type? Yes (both about record-keeping). Has the institution (Group A) failed to address the same type? We must check: Has Group A been formally cited for poor record-keeping and not addressed it? If yes, then institution lacks standing. If not, then standing is not lost.
    - Assume that Group A has a known pattern of poor record-keeping and has not fixed it (unresolved). Then standing is lost. The complaint is dismissed without prejudice.
    - Step 8: Committee decides if it takes up on own motion. The committee considers: Is poor record-keeping by Group B a serious issue? If yes, and there's evidence, the committee might take it up. If not, it closes the case.

  **Case 2: Gift-authorship**
  - *Facts*: Professor X (who has given gift authorships to students) complains that Professor Y padded an author list. Professor Y objects: "But you do the same thing!"
  - *Procedure*:
    - Step 2: Objection raised → yes.
    - Step 3: About past conduct → yes.
    - Step 4: Complainant is an individual (Professor X).
    - Step 5: Same type? Yes (both about inappropriate authorship).
    - Step 6: Is Professor X's past conduct severe and unresolved? 
        - Severity: Gift authorship is a violation of authorship norms (severe in research integrity). 
        - Resolution: If Professor X has been called out before and stopped, or if it was addressed, then it is resolved. If not, and it's ongoing, then unresolved.
    - Assume Professor X has been doing it for years and never been sanctioned (unresolved). Then standing lost. Dismiss without prejudice.
    - Step 8: Committee decides whether to take up the complaint against Professor Y on its own motion. The committee must weigh: Is Professor Y's alleged padding serious? If so, they might investigate even without Professor X.

  **Case 3: Duplicated image panels (invented)**
  - *Facts*: Dr. Z (who retracted a paper for duplicated image panels two years ago) complains that Dr. W has a paper with duplicated image panels. Dr. W objects: "Dr. Z did the same thing and had to retract!"
  - *Procedure*:
    - Step 2: Objection raised → yes.
    - Step 3: About past conduct → yes.
    - Step 4: Individual complainant.
    - Step 5: Same type? Yes (both about image duplication).
    - Step 6: Dr. Z's past conduct was severe (led to retraction) but was it resolved? Yes, because the paper was retracted (an action taken to correct the record). Therefore, even though it was severe, it was resolved. Standing is not lost.
    - Proceed to step 9: Investigate the substance of the complaint against Dr. W.

  **Where this is judgment in a lab coat:**

  The steps that require judgment (and are not mechanical):
  - Step 5: Deciding if two types of misconduct are "the same type". This requires understanding the core integrity violation (e.g., record-keeping vs. data fabrication are different types; but image duplication and data fabrication might both be considered falsification? We might group by FFP: fabrication, falsification, plagiarism). The committee must use its expertise to decide relevance.
  - Step 6: Determining if past conduct was "severe and unresolved". Severity: Is a minor authorship dispute severe? Probably not. But falsification is. Resolution: What counts as resolved? A retraction? An apology? A change in practice? The committee must set a standard (e.g., "addressed" means formally acknowledged and corrective action taken).
  - Step 7: For institutions, deciding if there was a pattern of failure and if it is relevant. This requires institutional memory and may be contentious.
  - Step 8: Whether to take up a case on own motion. This is a judgment call based on severity, evidence, and resources.

  **What this can't do:**

  1. It cannot make a hypocrite into a saint. If the complainant has standing, their past may still affect their credibility during the substance investigation (but that's a separate issue).
  2. It cannot force the committee to take up a case it doesn't have resources for, even if the standing procedure says to dismiss.
  3. It does not address the substance of the complaint — that's a separate and often harder process.
  4. It may not satisfy the parties: the respondent may feel the committee is ignoring their point, and the complainant may feel dismissed unfairly.
  5. It does not create a permanent record of standing — past resolutions may be forgotten, and the committee must rely on available information.
answer: |-
  ### The procedure at a glance  
  1. **Mandate check**: Is the complaint within scope? If not, dismiss/refer.  
  2. **"Look who's talking" raised?** If no, skip to substance (step 7).  
  3. **Past conduct alleged?** (Hypocrisy claim) If no, skip to substance.  
  4. **Complainant type**: Individual or institution?  
  5. **For individual**: Same-type misconduct? If no, note but proceed to substance.  
  6. **For individual**: Severe/unresolved? If yes, dismiss complaint (no standing); else proceed.  
  7. **For institution**: Pattern of same-type failure? If yes, dismiss complaint (no standing); else proceed.  
  8. **If dismissed for standing**: Committee votes—take up on own motion? If yes, investigate substance; if no, close.  
  9. **If standing OK or own motion**: Investigate substance.  
  10. **Report**: Document standing decision and rationale.  

  ---

  ### Step by step  
  *Assume the complaint is in scope (step 1). Work through objections as they arise.*  

  **Step 2: Was "look who's talking" raised by the respondent?**  
  - **Ask**: In the response, does the respondent claim the complainant (or institution) is hypocritical due to past conduct?  
  - **Sufficient answer**: Explicit statement (e.g., "They did the same thing," "Our department ignored this before").  
  - **Terminates if no**: Proceed directly to substance investigation (step 9). No standing issue.  
  - **Handoff if yes**: Go to step 3.  

  **Step 3: Is the objection about past misconduct?**  
  - **Ask**: Is the respondent pointing to a specific past act (or pattern) of research-integrity failure by the complainant/institution?  
  - **Sufficient answer**: Concrete examples (e.g., prior investigation, known incident, institutional inaction). Vague grumbles ("they’re always unfair") don’t count.  
  - **Terminates if no**: Ignore the objection. Proceed to substance (step 9).  
  - **Handoff if yes**: Go to step 4.  

  **Step 4: Complainant type—individual or institution?**  
  - **Ask**: Is the complaint filed by a named person (individual) or a group/department (institution)? Anonymous complaints default to institution (no named person).  
  - **Sufficient answer**: Named person = individual. Group/department = institution.  
  - **Handoff**:  
    - Individual → step 5.  
    - Institution → step 7.  

  **Step 5 (for individuals): Same-type misconduct?**  
  - **Ask**: Is the complainant’s past conduct the same *type* as the alleged misconduct? (e.g., authorship issue vs. authorship issue = same; notebook disarray vs. data fabrication = different).  
  - **Sufficient answer**: Match core ethical violation (use FFP categories: Fabrication, Falsification, Plagiarism, or norms like authorship/record-keeping).  
  - **Terminates if no**: Hypocrisy is irrelevant. Note objection in report but investigate substance (step 9).  
  - **Handoff if yes**: Go to step 6.  

  **Step 6 (for individuals): Severe and unresolved?**  
  - **Ask**:  
    - *Severe*: Was the past conduct a major breach (e.g., retraction, formal finding, pattern)? Minor lapses (e.g., one late notebook) don’t count.  
    - *Unresolved*: Was it never addressed (no correction, sanction, or acknowledgment)?  
  - **Sufficient answer**: Evidence of severity (e.g., public record) and lack of resolution (e.g., no follow-up).  
  - **Terminates if yes (no standing)**: Dismiss complaint *without prejudice* (substance not evaluated). Go to step 8.  
  - **Terminates if no**: Standing OK. Note objection but investigate substance (step 9).  

  **Step 7 (for institutions): Pattern of same-type failure?**  
  - **Ask**: Has the institution (e.g., department, committee) repeatedly ignored/failed to address the *same type* of misconduct? (e.g., ignored past authorship issues when now complaining about authorship).  
  - **Sufficient answer**: Evidence of institutional pattern (e.g., prior unactioned complaints, known tolerance).  
  - **Terminates if yes (no standing)**: Dismiss complaint *without prejudice*. Go to step 8.  
  - **Terminates if no**: Standing OK. Investigate substance (step 9).  

  **Step 8: Committee vote—take up on own motion?**  
  - **Ask** (only if complaint dismissed for standing): Should the committee investigate the substance *sua sponte* (on its own authority) based on:  
    - Severity of allegation.  
    - Sufficient prima facie evidence (without complainant testimony).  
    - Resources.  
  - **Sufficient answer**: Majority vote. Chair breaks ties.  
  - **Terminates if no**: Close case. Report states "dismissed for standing; not taken up."  
  - **Handoff if yes**: The committee adopts the complaint. Investigate substance (step 9) as a committee-led inquiry. Complainant becomes an anonymous source (if individual); institution’s role is noted but not emphasized.  

  **Step 9: Investigate substance**  
  - *Outside this procedure*. Focus on facts of the complaint.  

  **Step 10: Report documentation**  
  - **Ask**: Clearly state in the report:  
    - Standing objection raised? (Y/N)  
    - Standing decision (dismissed, upheld, or taken up on own motion).  
    - Rationale (1–2 sentences).  
  - **Operational note**: If dismissed for standing but taken up on own motion, the report emphasizes the committee’s role—not the complainant’s.  

  ---

  ### Three cases run through it  
  **Case 1: Notebook shambles (from query)**  
  - *Facts*: Group A (known for messy notebooks) complains Group B’s notebooks are a shambles. Group B objects: "Look who’s talking—Group A is worse!"  
  - **Steps**:  
    2. Objection raised → yes.  
    3. Past conduct alleged (Group A’s mess) → yes.  
    4. Complainant = institution (group).  
    7. Same-type failure? Yes (record-keeping). Pattern? Assume Group A’s mess is documented and unaddressed → standing lost. Dismiss complaint.  
    8. Committee vote: Take up on own motion? Assume allegation is minor → no. Case closed.  
  - **Outcome**: Complaint dismissed. No substance review.  

  **Case 2: Gift-authorship (from query)**  
  - *Facts*: Professor X (gives gift authorships) complains Professor Y padded an author list. Professor Y objects: "X does this too!"  
  - **Steps**:  
    2. Objection raised → yes.  
    3. Past conduct alleged → yes.  
    4. Complainant = individual (Professor X).  
    5. Same-type? Yes (authorship abuse).  
    6. Severe/unresolved? Assume Professor X’s gift authorships are habitual and never addressed → yes. Standing lost. Dismiss complaint.  
    8. Committee vote: Take up? Assume padding is serious and evidence is strong → yes. Committee investigates substance *on its own motion*.  
  - **Outcome**: Complaint dismissed for standing, but committee pursues substantively. Professor X is not named in the investigation.  

  **Case 3: Duplicated images (invented—proceeds despite objection)**  
  - *Facts*: Dr. Z (retracted paper for image duplication 3 years ago) complains Dr. W duplicated images. Dr. W objects: "Z did the same thing!"  
  - **Steps**:  
    2. Objection raised → yes.  
    3. Past conduct alleged → yes.  
    4. Complainant = individual (Dr. Z).  
    5. Same-type? Yes (image duplication).  
    6. Severe/unresolved? Severe (retraction) but resolved (corrected via retraction) → no. Standing OK.  
    9. Investigate substance.  
  - **Outcome**: Complaint proceeds. Dr. Z’s past is noted but doesn’t block standing. (You’d rather it didn’t proceed, but the procedure allows it because past was resolved.)  

  ---

  ### Where this is judgment in a lab coat  
  These steps require committee judgment (yours as chair, or consensus):  
  - **Step 5 (same-type)**: Deciding if two things are "same-type" isn’t philosophy—it’s expert discretion. Example: "Authorship padding" vs. "gift authorship" = same; "data fabrication" vs. "sloppy notebook" = different.  
  - **Step 6 (severe/unresolved)**: "Severe" leans on institutional norms (e.g., retraction = severe; typo in notebook = not). "Unresolved" is fuzzy: Is a private apology "resolved"? Default: Only formal resolution (e.g., correction, sanction) counts.  
  - **Step 7 (institutional pattern)**: Requires institutional memory. Does one ignored complaint = pattern? Default: Two or more similar incidents.  
  - **Step 8 (take up?)**: A values call—how serious is the allegation? Your chair vote decides ties.  

  ---

  ### What this can’t do  
  1. **Fix institutional rot**: If the whole institute lacks standing (step 7), and the committee won’t take it up (step 8), serious misconduct may go unaddressed.  
  2. **Prevent reputational harm**: Dismissing a valid complaint due to standing (e.g., Case 2) may protect hypocrites and frustrate whistleblowers.  
  3. **Handle murky resolutions**: If past conduct was "partially resolved" (e.g., a quiet correction), the committee must make a binary call—it’s messy.  
  4. **Override resource limits**: A case may deserve investigation but be skipped if the committee lacks capacity (step 8).  
  5. **Stop collateral damage**: "Anonymous source" in step 8 may not protect identities in small fields.  

  ---  
  **Final note**: This is a gatekeeping tool—not a moral arbiter. It prioritizes due process over perfection, and you (as chair) own the judgment calls. Use it to filter, not philosophize.
