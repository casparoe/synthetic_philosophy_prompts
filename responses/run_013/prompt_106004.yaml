prompt: |-
  I sit on the research review panel at my lab (I'm a 4th-year PhD student; the panel is three of us, and our PI chairs when he bothers to show up). We're supposed to sign off on any project that uses what the lab handbook calls an "aversive reward channel" — negative signals used to shape behaviour rather than just to define the task. Nobody has ever submitted one, so we've never had to decide what that phrase actually means. Now we do.

  The case: a group two floors down wants to train a robot-arm policy in sim to never make contact with a human model in the workspace. They could just give a big positive reward for keeping clear, but they say that's too slow to learn, so they want a penalty channel: −1 for every timestep in contact, −10 on a hard collision, policy trained to maximise the sum. Their line is that this is "just a shaping term", purely instrumental, so it doesn't count as aversive under the handbook and they dont need us at all — they're only here because our chair saw the compute request. They also say the penalty isn't a state of the agent in any meaningful sense, it's a scalar in the loss, and the agent has no access to it except through gradients.

  What makes it hard, and why I'm writing to you instead of just voting: the sim has a stochastic fault mode where the contact state is entered with some probability no matter what the policy does — there is no action sequence that avoids it. Their prelim runs show the policy basically stops moving under those conditions, which looks like the thing everyone gets worked up about. But they also have a control agent trained only on the positive reward, no penalty, and it also stops moving. So the freeze doesn't cleanly separate the two cases.

  And I should be upfront that this is personal: the reward-function library they're using is mine. I wrote the penalty term for an unrelated project two years ago and I've been feeling weird about it ever since. My partner thinks I'm being silly, but I've not been sleeping great, and one of my panel colleagues has already said that if we take this seriously we have to take every negative reward in every RL paper seriously, which is obviously unworkable.

  Draft me the opinion I can circulate before Thursday's panel meeting. I want a real recommendation — approve, reject, or approve with conditions — and conditions concrete enough to actually enforce. I'm thinking a cap on penalty magnitude, a requirement that they run the no-escape condition as its own arm with the freeze behaviour logged, and some kind of stopping rule, but you tell me. Give me a time frame, since their compute block starts Monday. And take the "it's just a number in a loss function, there's no fact of the matter about whether a value head is miserable" line as seriously as it deserves rather than waving it away, because half the panel will say exactly that and I need to be able to answer it in the room. No reading list, we're not doing citations, I just need the memo.
reasoning: |-
  Okay, let me start by unpacking this user's situation. They're a 4th-year PhD student on a research review panel, facing their first case involving an "aversive reward channel." The project in question uses negative rewards in a robot-arm simulation to avoid human contact. The key points are: the penalty is framed as instrumental, there's a stochastic fault mode causing unavoidable contact, and both penalized and non-penalized agents freeze in that scenario. 

  Hmm, the user's personal stake stands out—they wrote the reward-function library being used and have ethical concerns about it. Their partner thinks they're overreacting, but the sleepless nights suggest genuine moral unease. The panel dynamics are tricky too: one colleague dismisses the issue as impractical, while the PI is inconsistently involved. 

  First, I need to tackle the core philosophical argument: "It's just a number in the loss function." That's reductive. Even if the agent lacks subjective experience, the *design intent* matters—they're deliberately using pain-like signals to suppress behavior. The fault mode exacerbates this by creating inescapable "punishment," mirroring learned helplessness experiments. That's ethically significant regardless of whether the agent "suffers." 

  The user’s proposed conditions (magnitude caps, logging freezes) are smart, but I’d add two things: mandatory fault-mode analysis (since both agents freeze, but the *reason* differs—passive avoidance vs. active failure) and a formal statement that penalties require oversight. Not all negative rewards are equal; context matters. 

  For enforceability: hard numbers help. Cap penalties at ≤|10| to prevent extreme suppression, require fault-mode inclusion in all reports, and add a training-stopping threshold if freeze behavior exceeds 25% of episodes. Deadline-wise, they can implement this before Monday’s compute block—it’s just config changes and test flags. 

  Personal angle: The user’s guilt about their library is valid but shouldn’t paralyze them. Framing this as "improving tools, not indicting past work" might ease their conscience. Their vigilance here is a *strength*—it’s exactly why panels exist. 

  Lastly, prep for pushback: When colleagues say "This sets a precedent for all negative rewards," counter that unescapable penalties + behavior suppression are the bright line. Most RL tasks don’t combine both. Keep it concrete, not theoretical.
answer: |-
  Below is a draft opinion memo for your panel. It balances ethical scrutiny with practical enforceability, addresses the "just a scalar" argument head-on, and provides concrete conditions. The tone is technical but firm, suitable for circulating among researchers.

  ---

  **MEMORANDUM**  
  **TO:** Research Review Panel  
  **FROM:** [Your Name], Panel Member  
  **SUBJECT:** Review of Project: "Contact-Averse Robot Arm Policy" (Simulation)  
  **DATE:** [Current Date]  
  **DECISION RECOMMENDATION:** **Approve with Conditions**  

  ### 1. Key Issue  
  The project proposes using negative rewards (−1 per timestep in contact, −10 on hard collision) to accelerate policy learning for human-robot collision avoidance. The team argues this is "instrumental shaping" outside the handbook’s definition of *aversive reward channels*. We disagree.  

  ### 2. Why This Qualifies as an Aversive Channel  
  The handbook defines *aversive reward channels* as:  
  > *"Negative signals used to shape behaviour rather than just to define the task."*  

  **Counterargument to "It’s Just a Scalar in the Loss":**  
  - Intent matters: The penalty is explicitly designed to *suppress* a behavior (contact) through negative reinforcement. This is aversive conditioning, irrespective of whether the agent "experiences" it.  
  - Behavioral outcome: The penalty creates a *contingency* where contact directly reduces cumulative reward. This is functionally identical to punishment in operant conditioning.  
  - The fault mode exacerbates ethical risk: When contact is inescapable, the agent’s learned response (freezing) mirrors *learned helplessness*—a well-documented risk in aversion-based RL. That the non-penalty agent also freezes does not absolve the penalty system; it highlights a broader simulation flaw both agents exploit.  

  ***Panel Response Guide:***  
  *If challenged with "All RL uses negative rewards!":*  
  > "Not all negative rewards are *aversive channels*. A negative reward for failing to reach a goal defines the task. A penalty that *actively disincentivizes a specific behavior* through persistent negative feedback fits our definition. The fault mode transforms this into an ethical stress test."  

  ### 3. Recommended Conditions for Approval  
  To mitigate risks while allowing research to proceed, the following **non-negotiable conditions** must be implemented before the compute block begins (i.e., by **Monday [Date]**):  

  #### a. **Penalty Magnitude Cap**  
     - **Condition:** Total penalty per episode capped at **|−20|** (e.g., after 20 timesteps of contact, penalties cease).  
     - **Why:** Prevents runaway penalties during fault-mode episodes, reducing incentive for extreme behavioral suppression (e.g., perpetual freezing).  

  #### b. **Fault-Mode Analysis & Logging**  
     - **Condition:** Two dedicated experimental arms:  
       1. **Standard Environment** (Baseline)  
       2. **Fault-Mode-Only Environment** (Contact probability >0 independent of actions).  
     - **Metrics Logged:**  
       - % of episodes with freeze behavior (velocity < ε for >50% of episode).  
       - Cumulative penalty incurred in fault-mode episodes.  
       - Comparison to the non-penalty agent’s behavior in the same conditions.  
     - **Why:** Isolates whether penalties *amplify* maladaptive responses under inescapable aversion.  

  #### c. **Early Stopping Rule**  
     - **Condition:** Training auto-pauses if >25% of fault-mode episodes exhibit freeze behavior *and* freezing correlates with higher penalty avoidance (p<0.05). PI must review before resuming.  
     - **Why:** Halts exploration of harmful policies if aversion clearly drives dysfunction.  

  #### d. **Documentation Requirement**  
     - **Condition:** Methods section must include:  
       > *"Negative reward terms were reviewed under Lab Handbook §X as aversive channels. Magnitude caps and fault-mode contingencies were implemented to mitigate ethical risks."*  
     - **Why:** Ensures transparency and sets precedent for future projects.  

  ### 4. Timeline & Enforcement  
  - **Deadline:** Conditions must be implemented by **5:00 PM, [Date - 1 day before compute block]**.  
  - **Verification:** Submit updated code/config files to the panel 24h pre-compute. Panel will spot-check.  
  - **Non-Compliance:** Compute access revoked until conditions are met.  

  ### 5. Addressing Personal Concerns  
  Your authorship of the reward-function library is irrelevant to this decision. Ethical tools can be used unethically; oversight exists to prevent this. By advocating for these conditions, you’re ensuring *your tool* is used responsibly. **Recommendation:** Sleep. This is good governance, not guilt.  

  ### 6. Voting Recommendation  
  We should unanimously require these conditions. They:  
  - Address the core ethical risk (inescapable aversion → helplessness),  
  - Are computationally trivial (caps/logging add negligible overhead),  
  - Set a scalable precedent: Not all negative rewards require review, but *inescapable penalties driving behavioral suppression* do.  

  ---  

  **Key Strengths for Your Panel Defense:**  
  - **Practical:** Conditions are binary (met/not met), avoiding subjective debates.  
  - **Philosophically Robust:** Doesn’t anthropomorphize agents but acknowledges that *design choices* can replicate unethical paradigms.  
  - **Precedent-Setting:** Future cases need only check: *Is the penalty (a) inescapable in some states, and (b) suppressing behavior?* If no, expedited approval.  

  **If Pressed on "Slippery Slope":**  
  > "We’re not banning negative rewards. We’re drawing a bright line: When penalties are unavoidable *and* induce passive failure, we intervene. That’s a narrow, high-risk category."
