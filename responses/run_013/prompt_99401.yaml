prompt: |-
  I am a site reliability engineer who has spent years running blameless post-incident reviews, and I have a lay reader's knowledge of the transitional-justice processes in South Africa, Argentina, and Rwanda: the bargain of amnesty in exchange for full disclosure, the argument over whether truth commissions deliver justice or merely substitute for it, and the dispute over whether responsibility for mass atrocity belongs to individuals or to systems. Restate the main positions in that debate as faithfully as you can in the vocabulary I actually use — incidents and timelines, contributing factors and root causes, immunity and psychological safety, systemic versus individual error, and the postmortem as a ritual that yields both a shared narrative and preventive action. Then give me the residue report: which claims translate cleanly, which survive only in distorted form, and which have no counterpart in my vocabulary at all. Where the translation fails, tell me whether the failure is a defect of the engineering framework or a sign that the transitional-justice debate is doing something the framework cannot represent.
reasoning: |-
  Okay, the user is a site reliability engineer with experience in blameless post-incident reviews and some knowledge of transitional justice processes in South Africa, Argentina, and Rwanda. They want me to restate the main positions in the transitional justice debate using SRE vocabulary—terms like incidents, timelines, contributing factors, root causes, immunity, psychological safety, systemic vs. individual error, and postmortems as rituals. Then, I need to provide a "residue report" analyzing which claims translate well, which are distorted, and which have no counterpart, explaining why the translations fail.

  First, I should outline the key positions in the transitional justice debate. From what I recall, there are three main tensions: amnesty for truth versus prosecution for justice, truth commissions as substitutes or supplements to justice, and individual versus systemic responsibility. I need to map these to SRE concepts. For example, amnesty could be like immunity in postmortems, truth commissions might relate to postmortem reports, and systemic responsibility aligns with root cause analysis in SRE.

  The user's vocabulary includes specific terms. I should ensure each transitional justice concept is translated accurately. For instance, "amnesty" becomes "immunity from disciplinary action," "truth commissions" become "postmortem rituals," and "systemic responsibility" translates to "root causes and contributing factors." Individual responsibility in SRE is about human error, but with a blameless approach focusing on contributing factors.

  Next, the residue report. I need to assess where translations work, where they're distorted, and where there's no equivalent. Clean translations might include immunity/amnesty and systemic focus. Distortions could occur with the scale of harm—SRE incidents are technical, not human rights violations. Also, the concept of justice versus truth doesn't directly map because SRE aims for prevention, not retribution. No counterparts would be elements like historical justice, reconciliation, or moral repair, which are beyond SRE's scope.

  I should also address why some translations fail. Is it a limitation of the SRE framework or something inherent in transitional justice? For example, the failure to represent victims and moral repair might stem from SRE's technical focus, whereas transitional justice deals with deep societal wounds. The ritual aspect of postmortems provides shared narratives and prevention, similar to truth commissions, but lacks the societal healing component.

  The user might be seeking to apply lessons from transitional justice to improve their post-incident processes. Their deeper need could be understanding how to handle accountability without blame in high-stakes environments, or exploring the limits of their current framework. They might want insights on enhancing psychological safety or addressing systemic issues more effectively, even if some aspects don't translate perfectly.

  I'll structure the response by first restating the debate positions in SRE terms, then providing the residue report in sections for clean translations, distorted ones, and no counterparts. I'll conclude with why the failures occur, differentiating between SRE limitations and the unique aspects of transitional justice.
answer: |-
  Here's the restatement of the transitional justice debate using your SRE vocabulary, followed by the residue report analyzing the translation:

  **Restated Positions in SRE Vocabulary:**

  1.  **Immunity-for-Truth vs. Prosecution-for-Justice:**
      *   **Position 1 (Immunity-for-Truth):** Granting individuals involved in a major incident **immunity from disciplinary action** is necessary to achieve **full disclosure** during the **postmortem**. Without this guarantee of **psychological safety**, participants will withhold crucial details about actions, decisions, and **timelines**, hindering the identification of true **root causes** and **contributing factors**. The primary goal is comprehensive incident understanding and future prevention, even if individual accountability is deferred or waived.
      *   **Position 2 (Prosecution-for-Justice):** Granting immunity undermines accountability. Individuals who deliberately caused harm or violated clear procedures must face consequences proportional to their actions (e.g., termination, legal action). True justice requires holding individuals responsible for their specific failures within the incident **timeline**. Immunity creates a culture of impunity, erodes trust in the system, and fails victims who demand accountability. Full disclosure is less valuable if it comes without responsibility.

  2.  **Postmortem as Substitute vs. Supplement:**
      *   **Position 1 (Substitute):** The **postmortem ritual** (truth commission) is *sufficient* in itself. It delivers a **shared narrative**, identifies **systemic** flaws and **contributing factors**, drives **preventive action**, and provides closure through understanding. Focusing on individual blame distracts from fixing the broken **systems** and processes that enabled the incident. The report *is* the resolution.
      *   **Position 2 (Supplement):** The **postmortem** is necessary but *insufficient*. While crucial for understanding **root causes** and driving **preventive action**, it doesn't deliver justice. Justice requires separate processes to address individual misconduct identified *during* the postmortem analysis of the **timeline** and actions. The report informs accountability, not replaces it.

  3.  **Systemic Flaws vs. Individual Failures:**
      *   **Position 1 (Systemic Flaws):** Major incidents are almost always the result of complex interactions between **contributing factors** – poor design, tooling gaps, unclear procedures, resource constraints, cultural pressures, latent conditions. Focusing the **postmortem** on pinning blame on specific individuals ("human error") is counterproductive. It ignores the **root causes** embedded in the **system** and destroys **psychological safety**, preventing honest disclosure. Prevention lies in systemic fixes.
      *   **Position 2 (Individual Failures):** While **contributing factors** exist, incidents often involve specific individuals making deliberate, negligent, or grossly incompetent choices that violate established safeguards. The **postmortem** must clearly identify these points of failure within the **timeline** and hold those individuals accountable. Ignoring individual agency within the system absolves people of responsibility and fails to deter malicious or reckless behavior.

  **Residue Report: Translation Analysis**

  1.  **Clean Translations (Concepts that map directly with high fidelity):**
      *   **Immunity ↔ Amnesty:** The core trade-off (safety/full disclosure vs. accountability) translates perfectly. The purpose (enabling truth-telling) is identical.
      *   **Psychological Safety:** The foundational requirement for honest participation in both postmortems and truth commissions is directly analogous. Fear of retribution stifles disclosure in both contexts.
      *   **Full Disclosure:** The goal of uncovering all relevant facts, actions, decisions, and context is central to both.
      *   **Contributing Factors / Root Causes ↔ Systemic Analysis:** The SRE framework's focus on identifying the chain of failures, latent conditions, and systemic vulnerabilities maps directly to the "systemic responsibility" argument in transitional justice. The logic (fix systems to prevent recurrence) is parallel.
      *   **Postmortem Ritual ↔ Truth Commission Process:** The structured process of investigation, timeline reconstruction, testimony gathering, analysis, report writing, and recommendation generation is highly analogous. Both aim for a **shared narrative** and **preventive action**.
      *   **Preventive Action (Systemic):** The goal of changing systems, processes, or tools based on the analysis to prevent recurrence is a direct translation of a core objective in both fields.

  2.  **Distorted Translations (Concepts that survive but are fundamentally altered by the SRE context):**
      *   **Justice:**
          *   *Translation:* Often reduced to "accountability" meaning HR/legal consequences (termination, prosecution) for individuals.
          *   *Distortion:* The profound moral, social, and historical dimensions of justice – restoration for victims, societal reckoning, moral condemnation, symbolic reparations – are largely absent or severely minimized in the SRE framework. SRE "justice" is primarily about procedural fairness and future prevention, not moral repair.
          *   *Failure Cause:* **SRE Limitation.** Technical incidents lack the inherent moral gravity and victim-perpetrator dynamic of mass atrocities. SRE's purpose is system stability, not moral reckoning.
      *   **Victims:**
          *   *Translation:* End-users, customers, other teams impacted by downtime/data loss/errors. Focus is on impact severity (SLO breach, cost).
          *   *Distortion:* The deep personal suffering, trauma, loss of life/dignity/rights, and need for recognition and repair central to transitional justice victims is completely different from the (usually impersonal, financial, convenience-based) harm in SRE incidents.
          *   *Failure Cause:* **SRE Limitation / Nature of Harm.** The scale and type of harm are incomparable. SRE lacks the conceptual tools for profound human suffering and moral harm.
      *   **Individual Failure / Human Error:**
          *   *Translation:* Mistakes, slips, lapses, or deliberate violations by an engineer/operator during the incident timeline.
          *   *Distortion:* In transitional justice, "individual failure" encompasses acts of torture, murder, enforced disappearance – intentional atrocities often committed with ideological motivation or under orders, far beyond operational mistakes or negligence. The SRE concept of "human error" is too clinically narrow.
          *   *Failure Cause:* **Nature of Actions.** The acts under scrutiny are of a fundamentally different order – technical missteps vs. grave human rights violations. The SRE vocabulary sanitizes the latter.
      *   **Scale of Harm & Societal Impact:** While major incidents can be costly, the translation utterly fails to capture the societal rupture, collective trauma, and generational impact addressed by transitional justice. SRE impact is measured in metrics, not shattered communities.

  3.  **No Counterpart (Concepts with no meaningful equivalent in SRE vocabulary):**
      *   **Reconciliation:** The deep societal healing, restoration of relationships (victim-perpetrator-community), and rebuilding of social fabric is a core goal of transitional justice with no parallel in SRE. Postmortems aim for team cohesion and learning, not societal reconciliation.
      *   **Moral Repair / Restoration:** Concepts like acknowledging profound moral wrong, symbolic reparations (memorials, apologies with specific weight), restoring civic trust at a national level, and addressing historical legacies have no place in the technical, forward-looking SRE framework.
      *   **Historical Justice / Collective Memory:** Transitional justice often grapples explicitly with constructing a nation's shared historical narrative about the past. SRE postmortems build an operational narrative for prevention, not a society's foundational historical truth.
      *   **Ideological Motivation / Political Context:** The reasons *why* atrocities occur (ideology, political struggle, ethnic hatred) are central to transitional justice analysis but have no counterpart in SRE's analysis of technical incidents, which focus on *how* failures happened, not *why* in a deep political/moral sense.
      *   **"Irreducible Minimum" of Justice:** The debate about whether certain acts (e.g., torture) are so grave they *cannot* be amnestied, regardless of disclosure, has no analogy. SRE immunity decisions are pragmatic, not based on inherent moral un-forgivability.

  **Why the Translation Fails:**

  The failures occur primarily where the *substance* diverges fundamentally:

  1.  **Nature of the "Incident":** Technical system failures vs. intentional mass atrocities and systematic human rights violations. The scale, intent, and moral dimension are incomparable.
  2.  **Primary Goal:** SRE prioritizes future system stability and prevention. Transitional justice prioritizes societal healing, moral repair, historical reckoning, *and* future peace/prevention. Justice and reconciliation are ends in themselves, not just means to prevention.
  3.  **Agents and Patients:** SRE involves operators/users within a technical system. Transitional justice involves victims, perpetrators, bystanders, and society as a whole grappling with profound moral agency and suffering.
  4.  **Conceptual Scope:** SRE operates within a bounded technical and organizational framework. Transitional justice operates at the level of entire societies, history, politics, and fundamental morality.

  **Conclusion:** The SRE framework translates the *procedural mechanics* of truth-seeking, analysis, and systemic learning remarkably well (immunity, disclosure, psychological safety, root causes, postmortem ritual, preventive action). This highlights the universality of these processes for complex system failures.

  However, it fundamentally distorts or cannot represent the *core substance* of transitional justice: the gravity of the acts (atrocities vs. technical failures), the depth of victimhood, the demands for moral justice and reconciliation, the societal scale of impact, and the deep historical/political context. **This failure is not a defect of the SRE framework; it's a sign that transitional justice is dealing with phenomena (mass atrocities, societal trauma, moral repair) that lie entirely outside the conceptual boundaries and purpose of engineering incident analysis.** The SRE framework is powerful for its domain but lacks the vocabulary and conceptual tools to grapple with the uniquely human, moral, and societal dimensions inherent in transitional justice.
