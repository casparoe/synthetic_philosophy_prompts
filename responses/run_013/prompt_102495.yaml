prompt: |-
  I hold a default-opacity view of the citizen's relation to the state: the state may collect data about a person only under a specific, publicly avowed purpose, and must re-justify each collection on its own terms rather than appeal to its possible future usefulness. I am tempted by a stronger, symmetry-based version — the mirror rule — on which the state may collect a category of information about a citizen only if the citizen can collect the same category of information about the state. Tell me what would count against the position, ranked from fatal to merely awkward, and distinguish the objections a committed defender would themselves concede from those they would brush aside. In particular, assess whether the view can absorb the charge that opacity is unevenly distributed — sheltering the powerful while burdening those who must prove their entitlements — and whether the mirror rule does independent work or merely restates a demand for government transparency. Say what the position predicts that purpose-limitation and contextual-integrity approaches do not, whether it can account for why the German, American, and Chinese arrangements around state access to personal data diverge as they do, and whether it has insulated itself against disconfirmation by qualification.
reasoning: |-
  Okay, let me unpack this user's query. They're advocating for a "default-opacity" view where the state must justify each data collection separately, not based on potential future use. They're also considering a stronger "mirror rule" where citizens can collect the same data about the state. 

  First, I need to identify their core concerns. They want objections ranked from fatal to awkward, and want to know which objections a defender would concede versus dismiss. The user seems well-versed in privacy theory—they reference German, American, and Chinese approaches, so they likely have academic or policy background. Their mention of "opacity unevenly distributed" suggests they're sensitive to power imbalances, possibly leaning left-libertarian.

  Hmm... the mirror rule is clever but raises immediate practical concerns. How would ordinary citizens realistically gather intel on covert agencies? That asymmetry feels fatal. Purpose-limitation approaches at least allow national security exceptions, but the mirror rule would collapse in crises. The user probably knows this—they're testing if the rule can withstand real-world pressures.

  The transparency point is interesting. If the mirror rule just restates existing transparency demands, does it add value? A defender might argue it creates enforceable reciprocity rather than vague ideals. But I suspect the user wants to know if this is meaningfully different from FOIA-like systems.

  On uneven opacity distribution... this cuts deep. Default-opacity might unintentionally protect corporations or officials while burdening marginalized groups who lack resources to assert opacity. The defender might counter that the rule applies equally, but structural inequalities could make it hollow. The user seems to anticipate this—they're probing whether the theory acknowledges its own blind spots.

  Comparing legal systems: Germany's strict purpose-binding vs US's sectoral approach vs China's state-centric model. The mirror rule would struggle most in China, where transparency is minimal. But even in democracies, classified programs break reciprocity. The user might be assessing if this framework can explain systemic differences or if it's too Western-centric.

  Finally, qualification-proofing: Any theory can be salvaged by adding exceptions ("except during emergencies!"). The user wants to know if mirror rule advocates preempt this by building in flexibility. If not, it risks becoming unfalsifiable.

  ...I should structure objections by severity, flag which are conceded vs contested, and honestly address whether the mirror rule offers unique advantages or just rebrands transparency. The power imbalance critique needs particular care—it's philosophically thorny and the user clearly sees it as central.
answer: |-
  Here’s a structured critique of your "default-opacity + mirror rule" position, ranked by severity, with concessions defenders might make, and key assessments:

  ### **Fatal Objections (Threaten Core Coherence)**
  1. **Operational Impossibility of the Mirror Rule**:  
     - **Objection**: Citizens *cannot* practically collect equivalent state data (e.g., classified intelligence, real-time surveillance, algorithmic decision systems). States inherently control infrastructure and secrecy mechanisms.  
     - **Defender’s Response**: Brushed aside. The rule is normative, not literal—it demands *structural reciprocity* (e.g., citizens accessing audit trails, not raw NSA data).  
     - **Fatal Flaw**: If reciprocity is symbolic, the rule collapses into mere transparency advocacy.  

  2. **National Security & Emergencies**:  
     - **Objection**: Pre-emptive data collection (e.g., counterterrorism) cannot wait for re-justification. The mirror rule paralyzes threat prevention.  
     - **Defender’s Concession**: Might allow narrow, sunset-claused exceptions *if* mirrored by citizen oversight bodies (e.g., security-cleared watchdogs).  
     - **Fatal Risk**: Exceptions could swallow the rule, especially in illiberal states.  

  ---

  ### **Serious Objections (Challenge Practical Viability)**  
  3. **Asymmetric Power & Burdens**:  
     - **Objection**: Default-opacity **burdens the marginalized** (e.g., proving eligibility for welfare) while **sheltering the powerful** (corporate data brokers, state actors exploiting loopholes).  
     - **Defender’s Concession**: Acknowledges risk but argues opacity is a *right*, not a privilege—enforced via strong FOIA, anti-discrimination law.  
     - **Unresolved Tension**: Structural inequality may render formal equality meaningless. The mirror rule doesn’t solve this.  

  4. **Dynamic Contexts & Innovation**:  
     - **Objection**: Prohibiting future-use appeals stifles AI training, epidemiology, or fraud detection reliant on historical data.  
     - **Defender’s Response**: Brushed aside. "Future usefulness" enables mission creep; fresh justification prevents abuse.  

  ---

  ### **Awkward Objections (Theoretical/Conceptual Tensions)**  
  5. **Mirror Rule vs. Transparency**:  
     - **Objection**: The rule adds little beyond demanding radical transparency. If citizens can "collect state data" via FOIA, it’s redundant.  
     - **Defender’s Counter**: It does **independent work**:  
       - Forces *categorical parity* (e.g., if the state collects biometrics, citizens may audit biometric access logs).  
       - Predicts **uniquely**: *No justified state collection without symmetrical citizen access mechanisms*.  
       - Contrast: Purpose-limitation allows data reuse under "compatible" purposes; contextual integrity permits shifting norms.  

  6. **Qualification-Proofing**:  
     - **Objection**: The theory could be insulated by ad-hoc exceptions ("except during pandemics/war").  
     - **Defender’s Safeguard**: Insists re-justification must be *continuous*—no permanent carve-outs.  

  ---

  ### **Predictive Power & Comparative Analysis**  
  **Why Legal Systems Diverge**:  
  - **Germany (Purpose-Limitation)**: Stems from *Rechtsstaat* tradition. BVerfG’s *Census Act* ruling enshrines purpose-binding. Predictable under default-opacity.  
  - **USA (Sectoral, Utility-Focused)**: Allows broad future use (e.g., NSA metadata). Mirror rule directly challenges *Third-Party Doctrine*.  
  - **China (State Primacy)**: Rejects citizen opacity; state data collection is unlimited by design. Mirror rule is ideologically incompatible.  

  **Divergence Explained**:  
  Your framework predicts that states valuing *individual autonomy over state efficiency* (Germany) will align closer to default-opacity. The mirror rule’s viability depends on pre-existing transparency institutions—absent in China, fragmented in the US, robust in Germany.  

  ---

  ### **Conclusion: Strengths & Vulnerabilities**  
  - **Absorbing the Power Critique**: Default-opacity *can* address uneven burdens **only if** paired with material support for marginalized groups (e.g., free legal aid). Alone, it risks formalism. The mirror rule amplifies this by ignoring resource asymmetry.  
  - **Unique Contribution**: The mirror rule’s reciprocity principle is distinct—it forbids *asymmetrical relationships* (state-as-observer/citizen-as-subject), not just opaque purposes.  
  - **Fragility**: National security and technical feasibility are existential threats. Without strict sunset clauses and citizen oversight, exceptions corrupt the framework.  

  **Defender’s Path Forward**: Concede practical asymmetries but insist on the mirror rule as a **regulative ideal**—using it to challenge *all* non-reciprocal data regimes (e.g., secret courts, un-audited algorithms). Its power is in reframing state-citizen relations as a pact of mutual visibility, not unilateral transparency.
