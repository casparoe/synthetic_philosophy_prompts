  ### Extended Cognition Decision Tree

  **Tree Structure & Rationale**  
  This tree starts from your stipulated commitment (external resources are constitutive of cognition, not merely causal aids). Nodes are ordered to maximize branching efficiency, cutting redundant paths. The **boundary node (process vs. subject)** was cut: group cases are handled by the "shared ownership" node, and individual cases by other criteria. The tree has 7 nodes and 11 leaves.

  ```
  START: You accept external resources (notebook, phone, partner, etc.) as constitutive of cognition.
  │
  ├─ Node 1 (Meta): Is the debate about extended cognition primarily...  
  │  ├─ A. Empirical (how cognition is actually organized)? → Node 2  
  │  ├─ B. Methodological (how cognitive science should carve things up)? → Node 2  
  │  ├─ C. Verbal (about the word "cognitive")? → Leaf: **DEFLATIONARY VIEW**  
  │  └─ D. Ill-formed (the question assumes a flawed view of cognition)? → Leaf: **RADICAL ENACTIVISM**  
  │  
  ├─ Node 2: Does coupling *constitute* the cognitive process, or only *cause/enable* an internal process?  
  │  ├─ Only cause/enable → Leaf: **EMBEDDED COGNITION**  
  │  └─ Constitutes → Node 3  
  │  
  ├─ Node 3: Does constitution require *current coupling*, or persist when decoupled (e.g., notebook in pocket)?  
  │  ├─ Requires current coupling → Leaf: **BORROWED COGNITION**  
  │  └─ Persists when decoupled → Node 4  
  │  
  ├─ Node 4: Can the resource be simultaneously constitutive of your cognition *and* under another's authority (shared chat, partner, etc.)?  
  │  ├─ Yes → Leaf: **SOCIALLY DISTRIBUTED/GROUP COGNITION**  
  │  └─ No → Node 5  
  │  
  ├─ Node 5: Does extension include affect, desire, or experience (phenomenal states)?  
  │  ├─ Yes → Leaf: **EXTENDED AFFECT/DESIRE/EXPERIENCE**  
  │  └─ Only beliefs/memories → Node 6  
  │  
  ├─ Node 6: What earns constitution? (Key factor)  
  │  ├─ A. Reliable availability + automatic, un-audited trust → Leaf: **TRUST-BASED CONSTITUTION**  
  │  ├─ B. Integration into a learned, norm-governed practice → Leaf: **PRACTICE-INTEGRATED VIEW**  
  │  ├─ C. Complementarity (does work the brain is bad at) → Leaf: **COMPLEMENTARITY VIEW**  
  │  └─ D. Bare fact you'd be worse without it → Leaf: **CHEAP COUPLING**  
  │  
  └─ (Implicit) No clear key factor → Revert to DEFLATIONARY VIEW
  ```

  ---

  ### Leaves: Gloss & Awkward Commitments
  1. **DEFLATIONARY VIEW**  
     - *Gloss:* "Cognitive" is a term of art; boundaries are interest-relative, not factual.  
     - *Awkward commitment:* Makes the debate feel trivial, yet participants invest deeply in it.  

  2. **RADICAL ENACTIVISM**  
     - *Gloss:* "Where is cognition?" is malformed; cognition is whole-organism-environment activity.  
     - *Awkward commitment:* Struggles to explain why some resources feel integral and others don’t.  

  3. **EMBEDDED COGNITION**  
     - *Gloss:* Tools shape/enable but don’t *constitute* cognition; processing stays internal.  
     - *Awkward commitment:* Must explain why tools *feel* like memory (e.g., phone) if only causal.  

  4. **BORROWED COGNITION**  
     - *Gloss:* Resources are constitutive only *during coupling*; you’re a temporary owner.  
     - *Awkward commitment:* Implies your mind "shrinks" when decoupled (e.g., pocketed notebook).  

  5. **SOCIALLY DISTRIBUTED/GROUP COGNITION**  
     - *Gloss:* Cognition is distributed across agents (e.g., group chats); the *group* is the unit.  
     - *Awkward commitment:* Must explain why the group, not individuals, is the cognitive subject.  

  6. **EXTENDED AFFECT/DESIRE/EXPERIENCE**  
     - *Gloss:* Phenomenal states (e.g., moods, desires) can be extended, not just beliefs.  
     - *Awkward commitment:* Requires explaining how external stuff has "what it’s like"-ness.  

  7. **TRUST-BASED CONSTITUTION**  
     - *Gloss:* Constitution requires automatic trust + reliability (no auditing).  
     - *Awkward commitment:* Excludes resources we audit (e.g., map apps), even if central.  

  8. **PRACTICE-INTEGRATED VIEW**  
     - *Gloss:* Constitution requires embedding in a norm-governed practice (e.g., chef routines).  
     - *Awkward commitment:* Excludes novel/improvised couplings (e.g., quick phone lookup).  

  9. **COMPLEMENTARITY VIEW**  
     - *Gloss:* Constitution requires the resource doing work the brain is bad at; no "core" system.  
     - *Awkward commitment:* Must show complementarity is *necessary*, not just helpful.  

  10. **CHEAP COUPLING**  
      - *Gloss:* Any resource you’d be worse without is cognitive; no trust/practice required.  
      - *Awkward commitment:* Leads to cognitive "bloat" (e.g., eyeglasses become cognition).  

  11. **FULL CONSTITUTION-BY-COUPLING**  
      - *Merged with TRUST-BASED*: Standard notebook case fits here; no need for a separate leaf.  

  ---

  ### Unoccupied View & Blurred Leaves  
  - **Unoccupied Combination**:  
    Path: **Node 1 → A/B (empirical/methodological) → Node 2 → Constitutes → Node 3 → Persists → Node 4 → No (not shared) → Node 5 → Only beliefs → Node 6 → D (CHEAP COUPLING)**.  
    - *Why unoccupied?* Cheap coupling’s bloat problem (everything becomes cognitive) makes it incoherent for most. Why endorse constitution but ignore trust/practice?  

  - **Blurred Leaves**:  
    1. **PRACTICE-INTEGRATED vs. COMPLEMENTARITY VIEW**:  
       - Practice often involves complementarity (e.g., sous-chef does timing work brain is bad at). The tree forces a choice at Node 6, but real positions often blend these.  
    2. **DEFLATIONARY VIEW vs. OTHERS**:  
       - Deflationism can "swallow" most leaves (by making boundaries interest-relative), but the tree isolates it early via the meta-node to avoid total collapse.  

  ---

  ### Case Walkthroughs  
  1. **Scrabble Player (shuffles tiles to anagram)**  
     - Node 1: Empirical → Node 2  
     - Node 2: Shuffling *constitutes* anagramming (not just causal) → Node 3  
     - Node 3: Only coupled while shuffling → **BORROWED COGNITION**  
     - *Awkwardness*: If constitution ends when tiles are set down, is the player "less cognitive" mid-game?  

  2. **Autocomplete Poet (can’t tell if lines are hers or AI’s)**  
     - Node 1: Empirical → Node 2  
     - Node 2: AI *constitutes* poetic process (seamless integration) → Node 3  
     - Node 3: Persists (model is always available) → Node 4  
     - Node 4: Not shared (personal AI) → Node 5  
     - Node 5: Only beliefs/memories (text generation) → Node 6  
     - Node 6: Automatic trust (she doesn’t audit) → **TRUST-BASED CONSTITUTION**  
     - *Awkwardness*: Trusting an opaque AI feels different than trusting one’s own mind.  

  3. **Map App User (checks every turn, would fail without it)**  
     - **Genuinely Hard Call**  
       - Node 1: Empirical → Node 2  
       - Node 2: **AMBIGUOUS** — Is the app *constitutive* (you’d fail without it) or *causal* (you audit every turn)?  
         - If *constitutive* → Node 3 → Only during use → **BORROWED COGNITION**  
         - If *causal* → **EMBEDDED COGNITION**  
       - *Why hard?* Heavy reliance suggests constitution, but auditing breaks automatic trust (excludes TRUST-BASED). Borrowed cognition is a compromise, but feels ad hoc.  

  ---

  ### Tree Validation  
  - **Cases Placed**:  
    - Sous-Chef: Shared → Node 4 → **GROUP COGNITION**  
    - Ex’s Voice: Persists but decoupled? → Node 3 → **BORROWED** (if coupled via memory) or **EMBEDDED** (if causal crutch).  
    - Tattooed Formula: Trust + persists → **TRUST-BASED**  
    - Group Chat: Shared → Node 4 → **GROUP COGNITION**  
  - **Nodes Doing Work**: All nodes split cases meaningfully (e.g., map app’s ambiguity at Node 2; sous-chef vs. scrabble at Node 4).  
  - **Cut Node**: Boundary (process/subject) collapsed into shared ownership (Node 4) and persistence (Node 3).  

  ---  
  The tree sorts views by intuitions about cases, not labels. Philosophers objecting to everything will hit the meta-node first—good luck!
