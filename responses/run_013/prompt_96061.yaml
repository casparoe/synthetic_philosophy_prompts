answer: |-
  ### The cases it must get right
  *   **Kidney Sales:** Must explain why direct cash-for-kidney transactions feel deeply wrong to many, despite saving lives and potentially benefiting both parties, without simply dismissing potential benefits or relying solely on exploitation fears in *all* cases (e.g., hypothetical regulated markets between affluent equals). The case forces confronting commodification of the body and potential degradation.
  *   **Disaster Price Gouging:** Must reconcile the visceral repugnance towards "profiteering" off desperate need (e.g., $20 bottled water after a hurricane) with the economic argument that high prices efficiently allocate scarce resources and incentivize supply. The theory cannot ignore the context of vulnerability and perceptions of unfairness.
  *   **Vote Selling:** Must account for the fundamental repugnance even if the seller values the cash more than their single vote's impact, and the buyer values influencing the outcome. It challenges the core democratic principle of political equality and the non-fungibility of political voice.
  *   **Paying Students for Grades:** Must grapple with whether financial incentives corrupt intrinsic motivation for learning, devalue the meaning of achievement, or create unfair pressure/inequality, versus simply being an effective motivator. It tests commodification of effort and internal goods.
  *   **Transplant Queue Jumping (User Case):** Must explain the profound wrongness felt when someone pays another patient (e.g., $1 million) to surrender their higher position on a waiting list for a life-saving organ. This strains theories focused solely on individual consent/welfare or aggregate utility, highlighting positional harm, queue integrity, and the betrayal of a system based on medical need.
  *   **Buying Wage Discussion Silence (User Case):** Must address the repugnance of an employer paying an employee to permanently waive their right to discuss wages with colleagues. Even if voluntary and beneficial short-term for the employee, it undermines collective bargaining power and labor market transparency, illustrating how markets can entrench power imbalances and suppress public goods (information).
  *   **Market in Posthumous Apologies (User Case):** Must confront the unease of heirs auctioning or selling a formal, public apology from a deceased figure (e.g., for historical harms). This challenges theories about the inalienability of moral responsibility, the authenticity of commodified contrition, and the meaning of repair when detached from the wrongdoer's intent.

  ### The distinctions it must respect
  1.  **Good vs. Terms of Trade:** Distinguishing whether the repugnance stems from the nature of the *thing* being traded (e.g., a kidney, a vote) itself being inappropriate for market exchange (inalienability), or from the *specific conditions* under which the trade occurs (e.g., extreme desperation, fraud, coercion, monopoly). Selling a kidney *might* be wrong per se, or only wrong if sold under exploitative terms.
  2.  **Coercive Conditions vs. Commodification Wrong:** Separating wrongs arising from background injustice or vulnerability (e.g., poverty forcing kidney sale) from wrongs inherent in the act of assigning a price and treating the good as a commodity, *even under* hypothetical just conditions (e.g., selling votes between millionaires). Does commodification itself degrade the good or the participants?
  3.  **Direct Effects (Parties) vs. Expressive/Indirect Effects (Society):** Distinguishing the impact on the transacting individuals (consent, welfare) from the meaning the transaction expresses to society and its broader consequences (corroding norms, changing valuations, enabling harmful practices, fostering inequality). Paid surrogacy might benefit the parties but express problematic views about women/womb-holders; vote selling might satisfy two individuals but degrade democratic discourse.
  4.  **Disgust vs. Moral Wrong:** Not conflating a biological or cultural reaction of disgust with a reasoned judgment of moral impermissibility. Disgust might signal a need for scrutiny but isn't decisive proof.

  ### The constraints from outside philosophy
  *   **Economics:** Cannot ignore fundamental insights about markets: their efficiency in allocating scarce resources, providing information (prices), and incentivizing production/supply. A theory that dismisses all market solutions as inherently inferior for resource allocation contradicts empirical evidence. However, it must also accommodate market failures (externalities, information asymmetries, monopoly power) prevalent in repugnant contexts.
  *   **Psychology of Disgust:** Must acknowledge disgust as a potent, evolutionarily rooted emotion influencing moral judgment (e.g., "purity/sanctity" foundation in Moral Foundations Theory). Theories cannot dismiss disgust as *merely* irrational without explaining its persistence and cultural variation, nor can they uncritically accept it as moral proof. The link between disgust and perceptions of contamination/degradation is relevant.
  *   **Behavioral Economics:** Must account for findings on how financial incentives can crowd out intrinsic motivation (relevant to grades, blood donation), how fairness perceptions strongly influence behavior (price gouging), and how context/framing drastically alters choices.

  ### Where the list may be jointly unsatisfiable
  The most significant tension lies between **permitting potentially welfare-enhancing, consensual exchanges** (especially under improved conditions) and **preventing the commodification-corruption of certain goods/practices** due to their expressive meaning or societal role. The "Transplant Queue Jumping" case exemplifies this: a regulated, consensual sale might seem welfare-improving for the two individuals involved (seller gets rich, buyer gets organ faster), but it fundamentally corrupts the meaning and fairness of the queue based on medical need, expressing that wealth trumps urgency. Similarly, arguments for regulated kidney markets stress life-saving benefits and autonomy, while opponents stress the inherent degradation of putting a price on bodily integrity. Theories emphasizing individual welfare/autonomy (libertarian, utilitarian) struggle to capture the societal meaning-based objections convincingly, while theories emphasizing inalienability and non-commodification (deontological, expressivist) struggle to permit exchanges that seem genuinely beneficial under non-coercive conditions. Reconciling the tangible benefits of some "repugnant" trades with the intangible but deeply felt harm to social meanings and values is the core challenge that may preclude a universally satisfying theory.

  ### The requirement that does the most work
  **The requirement to account for the *Expressive/Indirect Effects* on society does the most work to exclude popular contenders.** Many popular theories (simple libertarianism focusing on consent, crude utilitarianism focusing on aggregate welfare, theories reducing repugnance to mere disgust or background injustice) fail because they neglect or underweight how a transaction *communicates* values, shapes social norms, and potentially degrades the meaning of the goods or practices involved, irrespective of direct effects on the parties. This requirement forces the theory to confront why vote selling feels wrong even among equals (it expresses that democracy is for sale), why queue jumping is intolerable (it expresses that life-saving care is auctioned), why posthumous apology markets feel hollow (they express that contrition is purchasable), and why price gouging feels exploitative beyond immediate harm (it expresses callousness towards shared vulnerability). It explains why commodification itself, not just the terms, can be the source of wrongness, excluding theories that focus solely on individual welfare or coercion. This expressive dimension is central to the deepest intuitions of repugnance in many core cases.
