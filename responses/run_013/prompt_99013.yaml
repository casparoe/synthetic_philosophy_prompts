prompt: |-
  Ok so I've somehow ended up refereeing a fight between two of my friends who both work on the history/philosophy of the Third Reich, and I want to force them to write the document they should have written a year ago instead of arguing at me. One of them is a Great Man type: no Hitler, no Nazi Germany, full stop — the party was basically his personal instrument, and the specific things that happened (the drive east, the war, the genocide) were his projects, not Germany's. The other is a structuralist: Versailles, the Depression, a constitution that let the president rule by decree, a conservative elite that would rather hand power to a radical right-winger than share it with the left — all that made some hard-right authoritarian regime close to inevitable, and Hitler was just the bus that happened to arrive on schedule. They keep talking past each other and I'm sick of it.

  Write the joint statement they could both actually sign. I want:

  - A numbered section of agreed claims, and make these non-trivial — not just "history is complicated" and not just restatements of the question. Include the meta-agreements: that the question as usually posed is underspecified and has to be indexed to a particular decision point, a particular outcome metric (the regime? the war? the Holocaust?), and a particular counterfactual world.
  - Then a disagreements table. Each row: the question, each side's position written so that side would accept the wording as its own (no strawmen, no loaded terms), and what each side thinks the other is really committed to.
  - Then the cruxes — the sub-questions where settling it would actually move at least one of them off their position. I suspect at least these, but add whatever you find: (a) whether the counterfactual should be a closest-world "what if he'd died in the early twenties" or a distribution over many nearby worlds; (b) whether his specific ideological project was idiosyncratic or just the local dialect of a broader European fascism; (c) whether the personalist structure of the party is evidence for the individualist or itself needs a structural explanation; (d) whether any of this is even testable.

  For each crux I want the arguement or comparison case that BOTH of them would agree bears on it, with each side's prediction written down in advance. Push them to use comparison cases rather than pure intuition — other interwar authoritarian regimes, movements that carried on or collapsed after their leader died or got sidelined, cases where the "structural" conditions were all present and nothing happened. And have them invent whatever crude measure they need (some kind of convergence score, a replaceability index, a path-dependence tally) as long as they both agree it's a fair way to code the cases.

  Last thing: make them say which parts of their dispute they now think are just verbal — e.g. if they only ever disagreed about what "would have been" means — and whether there's anything at all that both would agree should move the debate, or whether they should jointly admit the counterfactual is underdetermined by the evidence and stop pretending otherwise.

  Don't give me a bibliography or cite anyone, I don't care who said what, I want the actual content.
