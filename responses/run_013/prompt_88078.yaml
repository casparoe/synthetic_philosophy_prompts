prompt: |-
  I am assembling a specification before I commit to any position on whether death is bad for the one who dies. I want you to write the desiderata: what any adequate theory of the badness of death must deliver. Set it out as a list of requirements, each stated as a demand on the theory and each accompanied by the case, intuition, or consideration that motivates it. Keep the weight on the criteria and their motivating cases; I care less about scoring the familiar contenders.

  I expect the list to include at least the following, though you should add whatever else you judge belongs and drop nothing that is genuinely required:

  - The requirement to make sense of death being bad for the person who dies, given that the dead do not exist and experience nothing, and that death is not a state anyone is ever in. State how strong this constraint is and what it rules out.
  - The timing problem: the account must either locate the badness of death at some time or explain why it need not be located anywhere.
  - The asymmetry between our prenatal and our postnatal nonexistence: the account must either explain why it is fitting to lament the one and not the other, or explain away the intuition that there is anything to explain.
  - The subject problem: if harm requires a subject who is harmed, say what the subject of the harm of death is, or give grounds for rejecting the requirement.
  - Whether badness must be analyzed comparatively, as a relation between the actual life and some counterfactual life, and if so, what the baseline is and why.
  - The requirement that the account accommodate the fact that death can be a good thing, or neutral, and not only a harm.
  - The requirement that the badness of death not depend on the person's being aware of it.
  - The requirement that the account say whether events after death (the thwarting or fulfillment of desires, the fate of one's projects, one's reputation) can be bad or good for the dead, and whether it can say this without positing harm to a nonexistent subject.
  - A requirement of neutrality on the metaphysics of personal identity: the account should not presuppose either that you persist as the same person over time or that you are a series of person-stages, since the badness of death is meant to be assessable under either view.

  Test the list against cases that a candidate theory must get right, and build the case for each requirement from them. Include at least these, and add others you think expose a requirement:

  1. Two people, one killed painlessly in her sleep, the other in an irreversible vegetative state whose body then stops: does death add a harm in both, in one, or in neither?
  2. A person whose remaining life would have been dominated by unrelievable pain or severe dementia: the theory must permit death to be a benefit here.
  3. A person who dies just short of a long-anticipated and reliably expected good, and one who dies immediately after attaining it: the theory must be sensitive to counterfactual futures, or explain why not.
  4. A person who at the time welcomes death and would have chosen it: say what the theory must deliver about whether death is bad for her.
  5. A person whose life would have been worth living but only barely: what the theory must say, and why the answer matters.

  After the list, mark which requirements are non-negotiable and which are parochial, in the sense that only a particular camp must accept them. Then, and this is the part I most want, identify any pair or subset of the requirements that cannot be jointly satisfied, and argue for the incompatibility. If space allows, close with a brief pass over how the main families of view fare against the list, but do not let that displace the criteria. I do not want a reading list or citations; give me the specification itself.
reasoning: |-
  Okay, the user wants me to create a comprehensive specification of desiderata for theories about the badness of death. They've outlined several key requirements and cases that must be addressed, and they want me to expand on these while maintaining focus on the criteria rather than evaluating existing theories.

  First, I need to understand the user's perspective. They're approaching this systematically before forming an opinion, which suggests they value thoroughness and logical rigor. Their emphasis on cases indicates they want a theory that can handle real-world scenarios, not just abstract arguments. The exclusion of citations and focus on the specification itself means I should avoid academic references and concentrate on the conceptual framework.

  Looking at their requirements, I'll start with the core constraints they mentioned. The ontological constraint about death not being a state of being is fundamental - any theory must reconcile harm with nonexistence. The timing problem requires explaining when harm occurs if the subject doesn't exist. The asymmetry between prenatal and postnatal nonexistence presents a puzzle about why we regret the latter but not the former. 

  The subject problem challenges theories to identify who is harmed when the person no longer exists. The comparative analysis question asks whether we judge harm by comparing actual death to possible life continuations. Accommodating neutral or beneficial deaths is crucial for a nuanced theory. The awareness requirement ensures harm isn't contingent on knowledge of it. Posthumous harm questions whether events after death affect the deceased. Finally, metaphysical neutrality means the theory shouldn't presuppose specific views of personal identity.

  For the cases:
  - The sleep vs vegetative state case tests whether consciousness matters for harm
  - The painful life case ensures death can be beneficial
  - The near-miss good case examines counterfactual sensitivity
  - The willing death case explores consent vs welfare
  - The barely-worthwhile life case probes the harm threshold

  I'll mark non-negotiable requirements as those any plausible theory must address, like the ontological constraint and accounting for beneficial deaths. Parochial ones include commitments like comparative analysis, which some theories reject. 

  The major tension I see is between the ontological constraint (no subject exists) and the requirement to explain posthumous harm - if there's no subject, how can events harm them? This seems fundamentally incompatible. Either we reject posthumous harm, relax the ontological constraint, or find a way to reconcile them.

  In closing, I'll briefly note how major theory families (deprivationism, desire-based, existential) handle these, but keep it minimal as requested. The focus remains on the specification, not theory evaluation.
answer: |-
  Here is a specification of desiderata for any adequate theory of the badness of death, derived from core philosophical puzzles and motivated by specific cases:

  **I. Desiderata & Their Motivations**

  1.  **The Ontological Constraint:**
      *   **Requirement:** The theory must explain how death (understood as permanent cessation of existence) can be bad *for the person who dies*, despite the fact that after death, there is no subject to *be* in a harmed state or to experience anything. Death is not a state of being; it is nonexistence.
      *   **Motivation:** Case of the person killed painlessly in their sleep. We intuitively judge this death as a harm to *them*, yet they cease to exist at the moment of death. They never experience being dead. How can nonexistence itself harm the nonexistent?
      *   **Strength & Ruling Out:** This is a *non-negotiable* constraint. It rules out theories that straightforwardly identify harm with experiential states occurring *after* death (since no such states exist) or that treat death itself as a negative experiential state.

  2.  **The Timing Problem:**
      *   **Requirement:** The theory must either identify *when* the harm of death occurs (e.g., at death, before, after, or throughout life) or provide compelling reasons why the harm need not be locatable at a specific time.
      *   **Motivation:** Intuition that harms typically happen *to* someone *at* some time. If death is a harm, when does it happen? At the moment of death? But the subject ceases to exist then. Before? (Anticipation isn't the harm itself). After? (But no subject exists). This problem is sharpened by comparing prenatal vs. postnatal nonexistence (Desideratum 3).
      *   **Strength:** *Non-negotiable*. An adequate theory must address this directly.

  3.  **The Asymmetry (Prenatal vs. Postnatal Nonexistence):**
      *   **Requirement:** The theory must either explain why we typically regret (and see as a harm) our *future* nonexistence (death) but are indifferent to (or even glad of) our *past* nonexistence (prior to conception/birth), or convincingly explain away the intuition that this asymmetry is fundamental.
      *   **Motivation:** Intuition that missing out on life before one existed is neutral, but missing out on life after one existed is bad. Why lament the future deprivation but not the past? The case of someone just short of a great good (Desideratum 8, Case 3) highlights the future-orientation of deprivation.
      *   **Strength:** *Parochial*. While central to many accounts (e.g., deprivationism), a theory *could* potentially reject the asymmetry as illusory or ground it differently, but must engage with it.

  4.  **The Subject Problem:**
      *   **Requirement:** The theory must either identify the *subject* of the harm at the time the harm occurs (if locatable) or provide grounds for rejecting the principle that harm requires a contemporaneous subject.
      *   **Motivation:** Directly tied to the Ontological Constraint (1) and Timing Problem (2). If harm requires a subject, and the subject doesn't exist at the time the harm is supposed to occur (death or after), who is harmed? Cases involving posthumous events (Desideratum 8) intensify this problem.
      *   **Strength:** *Non-negotiable*. The theory must confront this.

  5.  **Comparative Analysis:**
      *   **Requirement:** The theory must state whether the badness of death *necessitates* a comparison between the actual life lived and some counterfactual scenario (typically, continued life). If it does require comparison, it must specify the relevant baseline counterfactual and justify its choice. If it does not require comparison, it must explain how death is bad intrinsically or non-comparatively.
      *   **Motivation:** Case of the person dying just short of a great good vs. immediately after attaining it (Case 3). Our judgment of harm clearly depends on the counterfactual - what they *would have had*. Case of death being a benefit (Case 2) also relies on comparing death to a counterfactual life of suffering.
      *   **Strength:** *Parochial*. While comparative (deprivationist) views are dominant, non-comparative views (e.g., some desire-based or intrinsic disvalue views) are possible but must justify their stance.

  6.  **Accommodating Neutrality/Benefit:**
      *   **Requirement:** The theory must allow that death can be *not bad* (neutral) or even *good* (a benefit) for the person who dies under specific circumstances.
      *   **Motivation:** Case of the person whose remaining life would have been dominated by unrelievable suffering or severe dementia (Case 2). Intuition strongly suggests death is preferable, perhaps even a relief or benefit. The theory must not imply death is *always* bad.
      *   **Strength:** *Non-negotiable*. Any theory claiming death is *always* bad is inadequate.

  7.  **Non-Contingency on Awareness:**
      *   **Requirement:** The badness (or goodness) of death for the person who dies must not depend on their being aware of their death or its badness.
      *   **Motivation:** Case of the person killed painlessly in their sleep (Case 1). They never know they died or that they were deprived. Yet, we still judge it a harm *for them*. If awareness were necessary, this death wouldn't be bad.
      *   **Strength:** *Non-negotiable*. Ruled out by core cases.

  8.  **Posthumous Harms/Goods:**
      *   **Requirement:** The theory must state whether events occurring strictly *after* a person's death (e.g., slander destroying their reputation, thwarting of their deathbed wishes, successful completion of their life's work) can be intrinsically good or bad *for the dead person themselves*. It must do so without violating the Ontological Constraint (1) or the Subject Problem (4), or explain why such events are not truly good/bad *for* the dead person.
      *   **Motivation:** Intuition that learning a deceased loved one's reputation was destroyed *harms them* in some way, or that their wishes being fulfilled *benefits them*. The theory must clarify its stance on this persistent intuition.
      *   **Strength:** *Parochial*. Theories differ significantly here (e.g., desire-based views often accept, deprivationist views often reject).

  9.  **Metaphysical Neutrality on Personal Identity:**
      *   **Requirement:** The theory's account of the badness of death should be compatible with major competing views of personal identity (e.g., biological continuity, psychological continuity, four-dimensionalism/stage theory). It should not presuppose one specific metaphysics to get the core judgment of badness off the ground.
      *   **Motivation:** The question "Is death bad for me?" seems fundamental regardless of whether we think of "me" as a persisting substance or a series of stages. The core intuition (e.g., in Case 1) persists across metaphysical views. The theory should capture this.
      *   **Strength:** *Parochial*, but highly desirable. A theory deeply tied to a controversial metaphysics (e.g., requiring a simple enduring soul) is less robust.

  **II. Key Test Cases & Their Demands:**
  1.  **Sleep vs. Vegetative State (Case 1):**
      *   **Demand:** The theory must explain why death *adds a harm* to the person killed in their sleep (who was conscious and had future goods) but *may not add a significant harm* (or may even be neutral/beneficial) to the permanently vegetative individual (who has irrevocably lost consciousness and future subjective goods). The theory must show sensitivity to the *counterfactual future capacity* for well-being.
  2.  **Life of Suffering (Case 2):**
      *   **Demand:** The theory *must* be able to deliver the verdict that death is a benefit (or at least not a harm) for this person. This tests Desideratum 6 and the theory's counterfactual baseline (Desideratum 5).
  3.  **Near-Miss vs. Post-Attainment Death (Case 3):**
      *   **Demand:** The theory must judge the death *just before* the anticipated good as worse than the death *immediately after* it (assuming the good was significant and reliably expected). This tests the necessity and nature of comparative analysis (Desideratum 5) and sensitivity to future deprivation.
  4.  **Welcoming Death (Case 4):**
      *   **Demand:** The theory must clarify whether the person's attitude (welcoming, choosing) *determines* the badness/goodness of death for them, or merely *reflects* it (or is irrelevant). Can death be bad for someone who welcomes it (e.g., due to severe but treatable depression)? This tests the relationship between desire, well-being, and harm (Desiderata 5, 6, 7).
  5.  **Barely Worthwhile Life (Case 5):**
      *   **Demand:** The theory must specify the *threshold* at which death changes from a harm to a benefit (or neutral). Does the barely positive life make death a small harm, or is there a discontinuity? This tests the precision of the counterfactual comparison (Desideratum 5) and the theory's implications for end-of-life decisions where quality of life is marginal.

  **III. Classification of Requirements:**
  *   **Non-Negotiable:** 1 (Ontological Constraint), 2 (Timing Problem), 4 (Subject Problem), 6 (Accommodating Neutrality/Benefit), 7 (Non-Contingency on Awareness).
  *   **Parochial:** 3 (Asymmetry), 5 (Comparative Analysis), 8 (Posthumous Harms/Goods), 9 (Metaphysical Neutrality). (These represent major theoretical divides; a theory can be adequate while taking a stance *within* these, but it must explicitly address them).

  **IV. Core Incompatibility:**

  The most fundamental tension lies between the **Ontological Constraint (1)** / **Subject Problem (4)** and the intuition driving the requirement for accommodating **Posthumous Harms/Goods (8)**.

  *   **The Conflict:** The Ontological Constraint and Subject Problem demand that a theory explain harm without relying on a subject existing *at the time of the harm*. Posthumous events, by definition, occur when no subject exists. The strong intuition that, e.g., slandering the dead harms *them* seems to require that the dead person *is* the subject of this later harm. But how can a nonexistent entity *be* a subject of harm *at the time* the slander occurs?
  *   **Why Incompatible?** Satisfying the Ontological Constraint/Subject Problem typically requires locating the harm *before* death (e.g., in the thwarting of a desire formed while alive, or in the deprivation inherent in the life actually lived) or dissolving the need for a contemporaneous subject (e.g., via a comparative assessment made from a timeless perspective). However, the intuition behind Posthumous Harm often insists that the harm occurs *when the posthumous event happens* (e.g., at the moment of slander) and is *about* that specific event affecting the deceased. Reconciling "harm at time T" with "no subject at T" is exceedingly difficult without either:
      *   **Weakening the Ontological Constraint:** Allowing that the dead can be subjects of harm (e.g., via timeless facts or properties, or by identifying the person with something that persists, like a reputation - which strains the concept of "harm *for the person*").
      *   **Rejecting Posthumous Harm:** Arguing that the harm is actually felt by the living, or that the relevant harm (e.g., to interests or desires) occurred *before* death when the relevant desires/projects were formed and their posthumous fate made possible, not when the posthumous event happens. This often fails to capture the intuition that the *slander itself* is the new harm *to the deceased*.
  *   **Consequence:** A theory must typically choose: either robustly satisfy 1 & 4 by rejecting genuine posthumous harms/goods *for the deceased* (offering a different account of the intuitions), or accept genuine posthumous harms/goods but struggle significantly with 1 & 4 (perhaps by adopting a metaphysics or concept of harm that weakens those constraints).

  **V. Brief View Assessment Against Criteria:**

  *   **Deprivationism (Comparative, Future Goods):** Excels at 3 (Asymmetry), 5 (Comparative), 6 (Neutrality/Benefit), 7 (Awareness), 9 (Neutrality). Struggles profoundly with 1 (Ontology), 2 (Timing), 4 (Subject) – often resorting to "timeless" facts or harm located in life via deprivation. Generally rejects 8 (Posthumous Harm) or interprets it as pre-mortem harm.
  *   **Desire-Based Views:** Can handle 2 (Timing - harm at desire formation/thwarting), 4 (Subject - the living desirer), 6 (Neutrality/Benefit), 7 (Awareness). May struggle with 1 (Ontology - if thwarting is posthumous), 3 (Asymmetry - unless desires are future-directed), 5 (Comparative - may be non-comparative). Often accepts 8 (Posthumous Harm if desires are thwarted/fulfilled later). Compatibility with 9 varies.
  *   **Existential/Completionist Views (Non-Comparative):** Focuses on intrinsic narrative structure or completion. May handle 1 & 4 better by locating harm in the life's incompleteness. Struggles with 3 (Asymmetry), 5 (Comparative - rejects it), 6 (Neutrality/Benefit - death might always distort), 7 (Awareness - usually ok), and explaining the nuance in Cases 1, 3, 5. Usually rejects 8.

  This specification provides the necessary framework to rigorously evaluate any theory purporting to explain the badness (or goodness) of death for the one who dies.
