  I'm in a philosphy of physics reading group and we've been chewing on Gödel's rotating-universe solution to Einstein's equations — the one where the whole cosmos spins and you get closed timelike curves, so events can be both in each other's past and future depending on the path you take. I think I follow the technical setup okay (or at least I can nod along when someone draws the light cones), but I'm having trouble seeing the big picture. Our discussion leader said Gödel took this to show that time is not objectively real, or at least that it supports an idealistic view of time, and I want to understand the most important implications of that move. Like, what does it actually imply for the debate between presentism and eternalism, for whether time needs a global ordering, and for the idea that time flows? Does it force us to give up on a single objective now, or can we just say time is a partial order and move on? And what are the implications for how we should think about the relationship between relativity and idealism more generally?

  Someone in the group also said the real upshot isn't about time at all but about the possibility of time travel and the grandfather paradox, while someone else said it's about the limits of general covariance and the underdetermination of theory by evidence. I'd like to know which implications are actually the most important, and which are overblown. I'm not looking for a bibliography or reading list — just a clear conceptual map of the main consequences, including any that people usually miss.
