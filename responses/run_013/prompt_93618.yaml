answer: |-
  Here are 8 tightly focused, conversational questions designed to press the key aspects of her view, each with a specific follow-up anticipating her likely response:

  1.  **Core Challenge (Substitution):** "You argue that applying *any* discount rate, even zero, is a category error for irreversible losses because they aren't substitutable like consumption bundles. But couldn't someone counter that losing a species *is* just a massive, even infinite, consumption-equivalent loss? Doesn't that collapse your distinction back into the standard framework, just with a very high cost?"
      *   **Likely Response:** She rejects collapsing it, emphasizing qualitative incommensurability.
      *   **Follow-Up:** "Okay, so if they are truly incommensurable in the sense that we *can't* meaningfully express the loss of a species or civilisation in consumption terms *at all*, how do we actually compare policies? If Policy A risks a 0.1% chance of civilisational collapse in 200 years but offers large consumption gains now, and Policy B avoids that risk but sacrifices significant present consumption, how do we weigh them *without* some implicit or explicit conversion or prioritization that looks suspiciously like discounting?"

  2.  **Lexicographic Priority:** "Does your view imply a kind of lexicographic priority? That avoiding *any* irreversible loss, no matter how small the probability or how far in the future, must always trump *any* gain in substitutable goods for present people?"
      *   **Likely Response:** She might soften it (e.g., thresholds, probabilities mattering differently) but likely affirms the core priority of avoiding irreversible harm.
      *   **Follow-Up:** "The standard objection to lexicographic views is that they can lead to absurdly risk-averse outcomes – like spending virtually all global resources on eliminating vanishingly tiny risks of existential catastrophe, leaving little for present poverty or health. If your view *does* imply that a tiny probability of a massive irreversible loss swamps everything else, how do you avoid that consequence practically? Or do you bite the bullet?"

  3.  **Uncertainty & Moral Status:** "On uncertainty: You argue that using uncertainty about the future to justify a positive discount rate often smuggles in a discount on future people's *moral status*, not just on the *value* of goods. But standard expected utility theory just weights future states by their probability – the value *within* each state (including people's moral worth) is still treated equally. Where exactly does this illicit 'moral status discount' creep in?"
      *   **Likely Response:** She'll argue it creeps in when we apply the discount *rate itself* to the valuation of future people's interests *because* they are distant/uncertain, conflating diminished probability with diminished standing.
      *   **Follow-Up:** "So is the issue that standard models *don't actually separate* the probability of a future person *existing* (or their world existing) from the *weight* we give their interests *given* they exist? Where in the Ramsey framework or typical integrated assessment models do you see this conflation happening concretely?"

  4.  **Inter/Intragenerational Asymmetry:** "Does your framework treat losses *within* a generation differently from losses *across* generations? For instance, if saving a critically endangered species requires sacrificing the livelihoods of a present-day community (also arguably an irreversible loss of a way of life), does the 'no discount rate' rule apply symmetrically, or is there an asymmetry favoring the present community?"
      *   **Likely Response:** She might emphasize the intergenerational context where future people lack representation, or argue intragenerational trade-offs involve different forms of substitutability/compensation.
      *   **Follow-Up:** "If there *is* an asymmetry, doesn't that reintroduce something *like* a time preference specifically across generations? And if there *isn't* an asymmetry, how do we resolve conflicts between present irreplaceable goods and future ones without resorting to some comparative weighting process?"

  5.  **Declining Discount Rates (DDRs):** "Some economists advocate Declining Discount Rates, starting higher and falling over time, partly to address concerns about the distant future. Is this a step towards your view – acknowledging that a *single* constant rate is inadequate – or is it still fundamentally committed to the problematic framework of discounting non-substitutable goods?"
      *   **Likely Response:** She'll likely see it as a patch, still applying a rate (even a low/declining one) where it shouldn't apply.
      *   **Follow-Up:** "So, even a DDR approaching zero for the far future still commits the category error of applying a 'rate' to non-substitutable goods? Does that mean the *only* ethically sound approach is to completely exclude these irreversible losses from the discounting calculus altogether and treat them under a separate, non-utilitarian imperative?"

  6.  **Person-Affecting vs. Zero-PTP:** "Your view seems deeply concerned with obligations to *actual* future people harmed by irreversible losses. Does your commitment to zero *pure* time preference depend on a 'person-affecting' view (only actual future people matter)? Or does it hold even if we think we have obligations to merely *possible* future people?"
      *   **Likely Response:** She might lean towards actual future people mattering more, but likely affirms zero PTP regardless, seeing it as about equal moral standing.
      *   **Follow-Up:** "If it *is* person-affecting, doesn't that create a tension? Present choices affect *who* exists in the future (the non-identity problem). If losing a stable climate changes *who* is born, is it still an irreversible loss *to specific future people*? And if not, does that weaken the force of the 'no discount rate' argument for climate policy specifically?"

  7.  **Operationalizing Without Discounting:** "Setting aside discount rates, how *should* policymakers actually integrate the value of avoiding irreversible, non-substitutable losses into cost-benefit analysis or decision frameworks? What's the practical alternative mechanism?"
      *   **Likely Response:** She might propose constraints (safe minimum standards, sustainability thresholds), separate non-utilitarian principles, or deliberative processes.
      *   **Follow-Up:** "Won't setting *any* threshold or constraint inevitably involve implicit trade-offs? How do we decide *where* to set the 'safe minimum standard' for, say, biodiversity loss without *some* implicit comparison to the costs of protection, which brings us back towards commensurability?"

  8.  **Falsifiability / Changing Mind:** "Finally, what kind of argument or evidence would genuinely make you reconsider the core of your position? Is there a potential counterexample or theoretical challenge that you find particularly troubling for your view?"
      *   **Likely Response:** A philosopher might be hesitant or argue the core moral intuition is robust.
      *   **Follow-Up:** "Let me press a bit: Imagine compelling evidence that future people, due to radical technological or cultural change, would genuinely *not value* the preservation of current species or climatic stability in the way we project – that the 'loss' we perceive is, to them, neutral or even a gain. Would that undercut the 'non-substitutable' claim, or does the obligation stem purely from our present understanding of value?"

  **Key things these questions do:**

  *   **Avoid Explanation:** Assume familiarity with discounting basics and her core thesis.
  *   **Target Specific Claims:** Hit substitution, lexicography, uncertainty, asymmetry, DDRs, person-affecting, operationalization, and falsifiability directly.
  *   **Anticipate Responses:** Follow-ups are designed to push back on the most probable defenses.
  *   **Force Nuance:** Ask *how* her view works in hard cases (trade-offs, thresholds, non-identity).
  *   **Conversational Tone:** Phrased as direct, engaged questions you'd ask in dialogue.
  *   **No Fluff:** Zero background or "how did you get here" questions.

  Good luck with the interview! This sounds like a fascinating discussion.
