prompt: |-
  I'm TAing a midterm on moral trade and I've got to get the scripts back by Friday, so I'm outsourcing the trickiest one to you for a second opnion. Q3 is worth 15 marks, it's the last question on the paper. Here's the question as it went out to them:

  ---
  We've been calling an exchange between two agents a *moral trade* when each agent changes what she does and each change leaves the other agent better off by her own lights. To keep it small, suppose there are two agents, A and B, and two things to do: volunteer at the shelter (S) or canvas for the campaign (C). Each agent does exactly one of them, so there are four possible outcomes, written (what A does, what B does).

  Each agent scores an outcome as follows: she assigns a number to each activity, meaning how much good she thinks it does when *anyone* does it, and subtracts the personal cost to herself of the activity she does. So A's score for (x, y) = vA(x) + vA(y) − cA(x), where x is A's activity, y is B's activity, vA is how much A values each activity, and cA is A's personal cost of doing it. B's score is defined the same way using B's numbers.

  The numbers:

  Activity values: A values S at 10 and C at 2. B values S at 2 and C at 10.

  Personal costs: for A, doing S costs 6 and doing C costs 0. For B, doing C costs 6 and doing S costs 0.

  As things stand, A volunteers at the shelter and B canvasses.

  (a) Is there a swap of activities that both agents score higher than the status quo? If so, which one, and by how much does each gain?

  (b) What does the answer to (a) depend on? State the general condition for a one-for-one swap of this kind to be mutually beneficial, and explain why the numbers come out the way they do.

  (c) Suppose a third person, C, holds a third view. What, if anything, does the fact that the swap is better on A's score and better on B's score show about whether the swap is better overall?
  ---

  And here's what the student wrote:

  (a) Right now A is at the shelter and B is canvassing, so the outcome is (S, C). A's score is 10 + 2 − 6 = 6, and B's is 10 + 2 − 6 = 6. If they swap we get (C, S): A's score is 2 + 10 − 0 = 12 and B's is 2 + 10 − 0 = 12. So yes, there's a swap they both score higher, and they each gain 6. It has to be a swap rather than one of them acting alone — if A switched by herself the outcome would be (C, C), which she scores 4, and if B switched by himself it would be (S, S), which he scores 4. Neither of them would do their half for free.

  (b) What makes it work is that the two of them don't value the two activities the same way. A thinks the shelter work is worth 10 and canvassing 2; B thinks canvassing is worth 10 and shelter 2, so their rankings of the two activities are the opposite of each other. In the status quo each of them is doing the activity the other one thinks matters more, so each can give up the thing she values less and get back the thing she values more. In general, a one-for-one swap like this is mutually beneficial whenever the two agents rank the two activities in opposite orders; if they agreed about which activity was worth more there'd be nothing for them to trade and the swap would be a wash.

  (c) The trade makes things better by 12 units, 6 for A and 6 for B. That's the attractive thing about moral trade: it isn't a compromise where both sides give something up, because each side's moral view ends up better satisfied than before. Since it's an improvement on A's view and an improvement on B's view, it's an improvement that nobody has grounds to object to, whatever they happen to think about shelter work and canvassing.

  Can you give me a mark out of 15, and then the comments I can hand back, working through the answer point by point? I need the justification, not just a number, because this student is probly going to contest it.
reasoning: |-
  Okay, the TA needs help grading a student's answer on moral trade. The question has three parts: (a) calculating if a swap benefits both, (b) explaining the general condition for such swaps, and (c) addressing a third-party perspective. 

  First, for part (a), the student correctly identifies the status quo scores as 6 each and the swapped scores as 12 each, with a gain of 6 per agent. They also correctly note that unilateral changes would worsen outcomes. This seems perfect—full marks here.

  Moving to part (b), the student identifies opposing value rankings as key but oversimplifies. The general condition isn't just opposing rankings—it's about comparative advantage in cost reduction. The student misses that costs matter too; for example, if costs were identical, opposing valuations alone wouldn't guarantee mutual benefit if costs don't align. Their explanation lacks this nuance, so partial credit is fair.

  For part (c), the student claims the 12-unit gain is objectively better and "nobody has grounds to object," but this ignores value incommensurability. A third party (C) might weight values differently, making the trade worse overall from their perspective. The student's universal claim is inaccurate—moral trade improvements are agent-relative, not absolute. This needs significant correction.

  The student also missed deeper points: in (b), the formulaic condition (vA(S)-vA(C) > cA(S)-cA(C) etc.) and in (c), the impossibility of aggregating diverse moral views. Their answer is confident but overreaches.

  Overall, the student grasps the basics but falters on subtler requirements. I'll suggest 10/15: full for (a), partial for (b) and (c), with detailed comments to explain the gaps. The TA should emphasize that moral trade hinges on cost-benefit asymmetries, not just value disagreements, and that "better overall" is undefined without a shared metric.
answer: |-
  Here's a mark breakdown and detailed comments for the student's answer. The student demonstrates good understanding of the core scenario but misses crucial nuances in parts (b) and (c). **Overall mark: 10/15**.

  **Comments for the Student:**

  **Part (a) (5/5) - Excellent**  
  ✓ Fully correct. You accurately calculated the status quo scores:  
  - A: \(v_A(S) + v_A(C) - c_A(S) = 10 + 2 - 6 = 6\)  
  - B: \(v_B(C) + v_B(S) - c_B(C) = 10 + 2 - 6 = 6\)  
  ✓ Correct swapped outcome \((C, S)\):  
  - A: \(v_A(C) + v_A(S) - c_A(C) = 2 + 10 - 0 = 12\) (gain of 6)  
  - B: \(v_B(S) + v_B(C) - c_B(S) = 2 + 10 - 0 = 12\) (gain of 6)  
  ✓ Properly noted that unilateral changes harm the switcher.  
  ✓ Complete and clear justification.

  **Part (b) (3/5) - Partial Credit**  
  ✓ **Correct Insight:** You rightly identified that opposing valuations (A prefers S, B prefers C) enable the trade.  
  ✗ **Incomplete/Inaccurate General Condition:**  
  - Your condition ("agents rank activities in opposite orders") is **necessary but not sufficient**. It misses the **role of comparative advantage in costs**.  
  - **Counterexample:** Suppose A values S at 10 and C at 2, B values S at 2 and C at 10 (opposite rankings). But if A’s cost for S is 0 and for C is 10, and B’s cost for C is 0 and for S is 10, swapping would *harm* both:  
    - Status quo (S,C): A scores \(10+2-0=12\), B scores \(2+10-0=12\)  
    - Swap (C,S): A scores \(2+10-10=2\), B scores \(10+2-10=2\)  
  → Opposing rankings alone don’t guarantee mutual benefit!  
  ✓ **Key Correction:** The **general condition** requires:  
  \[ [v_A(S) - v_A(C)] > [c_A(S) - c_A(C)] \quad \text{and} \quad [v_B(C) - v_B(S)] > [c_B(C) - c_B(S)] \]  
  In this problem:  
  - A: \((10 - 2) = 8 > (6 - 0) = 6\)  
  - B: \((10 - 2) = 8 > (6 - 0) = 6\)  
  → Each values the activity they *don’t* do more than the cost saved by switching. This cost-benefit asymmetry (comparative advantage) is essential.  

  **Part (c) (2/5) - Significant Issues**  
  ✓ **Correct Calculation:** The swap improves A's view by 6 and B's view by 6.  
  ✗ **Flawed Conclusion:** Claiming the swap is "better overall" or that "nobody has grounds to object" is incorrect.  
  - **Problem 1:** The 12-unit "gain" (6+6) **assumes A and B’s valuations are additive and commensurable**. Person C (or any aggregator) might weight A’s and B’s moral views differently.  
  - **Problem 2:** Person C might hold a **third moral view** (e.g., valuing S at 100 and C at 1). Under C's view:  
    - Status quo (S,C): \(100 (\text{S}) + 1 (\text{C}) = 101\)  
    - Swap (C,S): \(1 (\text{C}) + 100 (\text{S}) = 101\) → No change!  
    ...or if C weights activities differently:  
    - Suppose C thinks only shelter work matters: Status quo (S,C) = 100 (S), Swap (C,S) = 100 (S) → still no change.  
    ...or if C disvalues compromise:  
    - Swap might violate a deontological rule (e.g., "canvassing is corrupting").  
  ✓ **Key Correction:** The swap being better for A and B **only shows it improves their respective views**. It says **nothing** about whether it’s better "overall" without a specified method to aggregate moral perspectives (e.g., utilitarianism, prioritarianism). Person C could rationally argue the swap is neutral, harmful, or irrelevant to their view.  

  **Summary Feedback:**  
  - **Strengths:** You clearly grasp the mechanics of moral trade (part a) and recognize the importance of divergent valuations (part b).  
  - **Areas to Improve:**  
    1. **Costs matter!** For swaps to be beneficial, differences in activity costs must align with differences in valuations (part b).  
    2. **Moral aggregation is non-trivial.** Gains for A and B don’t imply "overall" improvement without a shared metric (part c).  
  - **Why 10/15?** Full marks for part (a), partial for (b) (missing cost condition), and partial for (c) (overclaiming about overall improvement). Keep refining your understanding of comparative advantage and value incommensurability!  

  ---  
  **Note to TA:** This student likely understands the intuition but needs to formalize the cost-benefit condition (b) and avoid overgeneralizing (c). The mark is fair but contestable—focus comments on the counterexamples and missing conditions.
