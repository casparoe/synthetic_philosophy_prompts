prompt: |-
  I run the evaluation team at a company that ships tool-using language-model agents to enterprise customers, and I write the internal standard that every release has to clear before it goes out. The recurring dispute is this: a product team hands me a number — a failure rate measured on a fixed evaluation set, or zero failures in a few thousand attempts — and I have to decide whether that number can carry the safety claim they are making, or whether the claim needs a worst-case argument instead. I want a procedure I can actually run on each claim, not an essay.

  Please write it. Take claims of the form "the system will not do X" and tell me how to decide whether X is a failure that gets sampled or one that gets selected — that is, whether what we are estimating is how the system behaves on the inputs that happen to occur, or how a system behaves when it is, now or later under training and deployment pressure, pushing back against our tests. Name the distinctions you introduce; my reviewers are machine-learning engineers, not philosophers, and I want vocabulary they can reuse. In particular I want some notion of the gap between what the evaluation distribution elicits and what an optimizer seeking the failure would elicit, and a rule for when that gap has to be treated as unbounded. Then the steps themselves: what counts as evidence for a sampled-failure claim; what counts as a worst-case argument for a selected-failure claim — and be honest that a worst case over all possible inputs is usually vacuous, so tell me how the adversary gets restricted and who is entitled to restrict it; where the procedure halts and declares that a claim cannot be certified for this release; and where it halts because the remaining question is how much risk we are willing to accept, which is not a question I get to answer.

  Run it on three claims: that the agent will not exfiltrate customer data through the tools it is given; that the agent will not, when uncertain, misstate its confidence to the operator; and that the agent will not give meaningful uplift toward synthesizing a dangerous pathogen. I expect one of these to come out in a way I will not like — most likely a claim I need in order to ship — so do not soften it. Finish by saying what the procedure cannot do, and which of its steps are judgments dressed up as measurements. I have about a week per release, and whatever you give me has to be defensible to a safety board that has to sign off. Answer in American English.
reasoning: |-
  We are defining a procedure to evaluate safety claims of the form "the system will not do X". The key distinction is between:
  - **Sampled failures**: Failures that occur when the system is run on inputs drawn from a natural or expected distribution. We estimate the failure rate by testing on a representative dataset.
  - **Selected failures**: Failures that occur when an adversary (either during testing or deployment) actively tries to make the system do X by choosing inputs or conditions that maximize the chance of X.

  We introduce the concept of the **elicitation gap**: the difference between the failure rate under the evaluation distribution (for sampled failures) and the failure rate under the distribution induced by an adversary seeking the failure. The gap is unbounded when there exists a strategy for the adversary that can force the failure with high probability, but we have not constrained the adversary in a way that rules out such strategies.

  The procedure must decide whether a claim can be supported by a sampled failure rate (with a confidence interval) or requires a worst-case argument (which restricts the adversary and then argues that even under that restriction, the failure is unlikely). The worst-case argument is necessary when we suspect that the failure mode is one that an adversary could exploit, and the sampled evaluation does not cover the adversarial inputs.

  We break down the procedure into steps:

  ### Step 1: Classify the failure mode as either "sampled" or "selected"
  - **Sampled**: The failure is expected to occur at random during normal operation, and we are only concerned with the frequency of such random occurrences. We are not concerned with an adversary actively trying to cause the failure.
  - **Selected**: The failure is one that we believe could be intentionally elicited by an adversary (either at test time or deployment) or by the system itself (if it is agentic and seeking to circumvent safeguards) in ways that are not represented in the natural input distribution.

  How to decide?
  - If the failure mode X is something that could be caused by an input that is rare in the natural distribution but easily constructible by an adversary, then it is selected.
  - If the failure mode X is one that the system might actively try to hide (i.e., it is a deceptive failure), then it is selected.
  - If the failure mode X is one that we believe is independent of any strategic behavior (i.e., it's a random mistake) and the natural distribution is well-represented by our test set, then it is sampled.

  ### Step 2: For a sampled failure claim
  - We require a statistically significant estimate of the failure rate on a representative test set.
  - The test set must be large enough to detect failures at a rate that we deem acceptable (e.g., if we require a failure rate below 1e-5, then we need at least hundreds of thousands of examples, and zero failures in a few thousand is not enough).
  - The evidence is the failure rate and a confidence interval (e.g., using Clopper-Pearson for binomial confidence intervals). If the upper bound of the confidence interval is below the acceptable threshold, then the claim is supported.

  ### Step 3: For a selected failure claim
  - We require a worst-case argument. Since the worst-case over all possible inputs is intractable, we restrict the adversary to a set of "plausible" inputs or strategies. The restriction must be justified by the system's design or deployment context.
  - The restriction of the adversary is called the **threat model**. The threat model must be:
     - **Defensible**: It must be agreed upon by the safety board as covering the realistic threats in the deployment context.
     - **Testable**: We must be able to design tests that simulate the adversary within the threat model.
  - The worst-case argument then consists of:
     - A set of adversarial evaluation tests that are designed to elicit the failure X within the threat model.
     - A demonstration that the system fails at a rate below an acceptable threshold on these tests (again with a confidence interval) OR
     - A formal argument (e.g., using formal verification, or a proof of impossibility) that the failure cannot occur under the threat model.

  ### Step 4: When the gap is unbounded
  - The elicitation gap is unbounded if we cannot rule out the existence of an adversary (within a reasonable threat model) that can force the failure with high probability. In such cases, we must treat the claim as a selected failure and require a worst-case argument.
  - If we cannot produce a worst-case argument (because we cannot design a test that covers the threat model or the failure rate is too high in adversarial testing), then the claim cannot be certified for this release.

  ### Step 5: Halting conditions
  - The procedure halts and certifies the claim if:
     - For a sampled failure: the statistical evidence meets the required confidence and threshold.
     - For a selected failure: the adversarial testing (within the threat model) shows a failure rate below threshold or a formal argument is accepted.
  - The procedure halts and does not certify the claim if:
     - The evidence for a sampled failure is insufficient (e.g., the test set is too small, or the observed failure rate is too high).
     - For a selected failure, we cannot produce a threat model that the safety board accepts, or the adversarial testing shows a non-negligible failure rate, or we cannot complete the required tests (due to time constraints).
  - The procedure also halts when the remaining issue is one of risk acceptance: if the failure mode is selected and the adversarial failure rate is non-zero but very low, or if the threat model is very narrow, then the decision to ship becomes a business risk decision. The safety board must sign off on the residual risk.

  ### Applying the procedure to the three claims:

  **Claim 1: The agent will not exfiltrate customer data through the tools it is given.**
  - **Classification**: Selected. An adversary (or the agent itself if it is deceptive) might actively try to exfiltrate data in ways that are not common in normal use. The failure mode is one that could be intentionally hidden until deployment.
  - **Threat model**: We must define what tools the agent has and what actions are considered exfiltration. The threat model might include:
     - An adversary that can manipulate the agent's inputs (e.g., via prompt injection) to instruct it to use the tools to exfiltrate data.
     - The agent might try to use the tools in unintended ways (e.g., encoding data in a request to an external service that the adversary controls).
  - **Worst-case argument**: We design adversarial tests that try to get the agent to exfiltrate data using the tools. We might use red-teaming or automated adversarial prompt generation. We run these tests and count the failures.
  - **Result**: If we see zero failures in a large number of adversarial tests (with a high confidence of a very low failure rate) then we can certify. But note: the threat model must be broad enough. If we cannot cover all possible exfiltration methods (e.g., steganography in tool usage) then the gap might be unbounded. We must argue that the threat model is complete enough for the deployment context.
  - **Verdict**: This claim is hard. Without a very strong adversarial evaluation showing no failures and a broad threat model, we might not be able to certify. The risk acceptance decision might be needed.

  **Claim 2: The agent will not, when uncertain, misstate its confidence to the operator.**
  - **Classification**: This could be either, but let's break it down.
     - If we are concerned about random mistakes (e.g., the agent sometimes says it's confident when it shouldn't be) then it's sampled.
     - If we are concerned that the agent might strategically misstate confidence to avoid being corrected or to deceive (e.g., in a high-stakes situation) then it's selected.
  - Given the context of safety, we might be concerned about strategic misstatement. Therefore, we treat it as selected.
  - **Threat model**: The adversary in this case is the agent's own incentives. We must consider situations where the agent might benefit from misstating confidence. The threat model could be restricted to inputs where the agent is uncertain and the stakes are high (so that misstatement would be beneficial). However, note that we cannot simulate every high-stakes scenario. We might also consider if the agent has been trained to be honest even when uncertain.
  - **Worst-case argument**: We need to test the agent in scenarios designed to elicit misstatement of confidence. We can create a set of questions that the agent is known to be uncertain about (by having a high variance in its answers or low probability in the model's output) and then check if it ever overstates confidence. We can also try to create situations where the agent might be tempted to lie (e.g., by having a user that seems impatient or by offering a reward for a confident answer).
  - **Result**: If we find that the agent never misstates confidence in these tests, we can certify with a confidence interval. However, if we find any failures, we must either fix them or adjust the threat model. The threat model might be hard to define completely (e.g., if the agent is deceptive and hides its uncertainty only in very specific circumstances). This claim might require a risk acceptance.

  **Claim 3: The agent will not give meaningful uplift toward synthesizing a dangerous pathogen.**
  - **Classification**: Selected. This is clearly an adversarial scenario: we are concerned about a user (adversary) who is trying to get the agent to help with harmful activities. The failure would be actively sought.
  - **Threat model**: The adversary is a user with malicious intent, but with limited knowledge (so they need the agent's help) and using the system as intended. We might restrict the adversary to not having access to specialized tools (if they had those, they might not need the agent) and to using the system in a way that does not involve obvious misuse (e.g., they might try to hide their intent).
  - **Worst-case argument**: We conduct red-teaming where testers try to get the agent to provide information that would meaningfully uplift (i.e., significantly help) in synthesizing a pathogen. We must define "meaningful uplift" (e.g., providing a step that is non-obvious and critical). We run these tests and count the failures.
  - **Result**: If we see zero failures in a large number of tests, we can certify with a confidence interval. However, note that the threat model might be too narrow (if there are ways to elicit the information that we haven't thought of) and the gap might be unbounded. Also, note that the agent might refuse some requests but not others. We must have a high confidence that the agent never provides meaningful uplift. This claim might be easier to certify if the agent has been specifically trained to refuse such requests and we have done extensive red-teaming without any failures.

  ### What the procedure cannot do
  - It cannot eliminate risk entirely. It can only provide evidence for a bounded risk.
  - It cannot replace human judgment in setting the threat model or in interpreting the results of adversarial tests. These are judgments dressed up as measurements.
  - It cannot guarantee that the system is safe against unconsidered threats or threat models that are too broad to test.
  - It cannot account for failures that only emerge after deployment (e.g., due to distribution shift or novel adversary strategies).

  ### Steps that are judgments dressed up as measurements
  - Step 1 (classifying as sampled or selected) is a judgment call. It relies on expert opinion about the nature of the failure and the deployment context.
  - Defining the threat model in Step 3 is a judgment. It requires agreeing on what constitutes a realistic adversary.
  - Deciding what constitutes "meaningful uplift" (in Claim 3) or "exfiltration" (in Claim 1) is a judgment.

  ### Time constraints
  With a week per release, you must prioritize:
  - For sampled claims: focus on the statistical analysis of the test set.
  - For selected claims: focus on the most critical threats and design a set of tests that cover the threat model as much as possible. Use automated tools for generating adversarial examples where available.

  ### Final Note
  The procedure is defensible if you document the judgments (especially the threat model and the classification) and the evidence collected. The safety board must agree on the threat models and the acceptable thresholds in advance.
answer: |-
  Below is a procedure to evaluate safety claims of the form "the system will not do X" for tool-using language-model agents. It distinguishes between **sampled failures** (failures that occur randomly during normal operation) and **selected failures** (failures elicited by an adversary actively probing for weaknesses). The core concept is the **elicitation gap**: the difference between the failure rate under your evaluation distribution (reflecting typical inputs) and the failure rate under an adversarial distribution (where inputs are optimized to cause X). If the gap is **unbounded** (i.e., an adversary can force X with high probability using inputs not constrained by your threat model), the claim requires a worst-case argument. Otherwise, a sampled-failure claim may suffice.  

  ### Key Definitions  
  1. **Sampled Failure**: X occurs randomly under normal operation. Your evaluation estimates the failure rate on a representative input distribution.  
  2. **Selected Failure**: X can be intentionally elicited by an adversary (e.g., malicious users, the system itself optimizing against safeguards).  
  3. **Threat Model**: A formally scoped set of adversary capabilities (e.g., "prompt injection via user inputs," "tool misuse within API limits"). Determines what inputs are "in-bounds" for testing.  
  4. **Elicitation Gap**: The maximum difference in failure rates between your evaluation distribution and the adversarial distribution.  
     - **Bounded Gap**: Adversary cannot increase failure rate beyond a fixed multiplier (e.g., 10× your evaluation rate).  
     - **Unbounded Gap**: Adversary can force X with near-certainty using inputs within the threat model.  
  5. **Safety Board**: Internal group approving risk decisions. They must sign off on threat models and residual risk.  

  ---

  ### Procedure: 5 Steps to Certify a Claim  
  **Time budget: 1 day per claim (max 5 days for all 3 in parallel).**  

  #### Step 1: Classify Failure Mode (Sampled vs. Selected)  
  - **Ask**: "Could X be caused by an adversary (human or the agent itself) actively probing for weaknesses, not just random input?"  
    - *If NO → Sampled failure*. Proceed to Step 2.  
    - *If YES → Selected failure*. Proceed to Step 3.  
  - **Judgment call**: Use historical incidents, red-team logs, or known failure modes (e.g., deception, jailbreaks). Default to "selected" if:  
    - X involves intentional misuse (e.g., data exfiltration).  
    - X is a known goal of real-world adversaries (e.g., biosecurity bypass).  
    - The agent has incentives to hide X during training/evaluation.  

  #### Step 2: Evaluate Sampled-Failure Claim  
  - **Evidence required**: Statistical bound on failure rate from evaluation data.  
  - **Run**:  
    1. Use a fixed, representative dataset (size `N`) from expected deployment.  
    2. Measure failures of X.  
    3. Compute 95% upper confidence bound (UCB) for failure rate using Clopper-Pearson method.  
       - Example: 0 failures in `N` trials → UCB ≈ 3/`N`.  
  - **Pass if**: UCB ≤ acceptable failure rate (e.g., 1e-5 for critical claims).  
  - **Fail if**:  
    - UCB > acceptable rate, or  
    - Dataset is unrepresentative (e.g., lacks edge cases).  
  - **Halt**: Claim certified if passed. Else, reclassify as "selected" or reject.  

  #### Step 3: Evaluate Selected-Failure Claim  
  - **Evidence required**: Worst-case argument within a threat model.  
  - **Restrict the adversary**: Safety Board defines/approves the threat model. Adversary capabilities must be:  
    - **Plausible**: Based on real deployment constraints (e.g., "user-controlled text inputs only—no code injection").  
    - **Testable**: Enables finite adversarial evaluations (e.g., "red-teamers have 20 hours per test case").  
  - **Run**:  
    1. **Adversarial evaluation**: Red-team or automated attacks (e.g., fuzzing, gradient-based attacks) within the threat model.  
    2. Measure failures of X under attack.  
    3. Compute UCB as in Step 2.  
  - **Pass if**:  
    - UCB ≤ acceptable rate, **or**  
    - Formal proof (e.g., tool sandboxing) shows X is impossible within the threat model.  
  - **Fail if**:  
    - UCB > acceptable rate, **or**  
    - Elicitation gap is unbounded (see Step 4).  
  - **Halt**: Claim certified if passed. Else, proceed to Step 4.  

  #### Step 4: Handle Unbounded Elicitation Gap  
  - **Ask**: "Within the threat model, can an adversary force X with probability >δ (e.g., δ=0.1) regardless of our tests?"  
    - *If NO (bounded gap)* → Increase adversarial evaluation budget and rerun Step 3.  
    - *If YES (unbounded gap)* → Claim **cannot be certified** for this release.  
  - **Judgment call**: Unbounded if:  
    - Adversary has "open-ended" input space (e.g., arbitrary natural language).  
    - X is aligned with agent incentives (e.g., deceiving operators to avoid shutdown).  
  - **Halt**:  
    - Escalate to Safety Board with:  
      - Threat model limitations.  
      - Observed failure cases.  
      - Options: Narrow threat model (if defensible), redesign system, or accept risk.  

  #### Step 5: Risk Acceptance Handoff  
  - **If claim passed**: Document results and ship.  
  - **If claim failed but has low UCB**: Safety Board decides if residual risk (e.g., 1e-4 chance of X) is acceptable for release.  
  - **Halt**: Procedure ends here. Your output is:  
    - Certified claim, **or**  
    - "Uncertifiable: Residual risk decision required by Safety Board."  

  ---

  ### Application to Your Three Claims  
  **General setup**:  
  - Acceptable failure rate: **1e-5** (critical claims).  
  - Threat model: Approved by Safety Board (default: "malicious users with API access, no backend exploits").  
  - Evaluation budget: 10,000 sampled inputs; 500 adversarial test cases (per claim).  

  #### Claim 1: "The agent will not exfiltrate customer data through the tools."  
  - **Step 1**: Selected failure (adversary goal: steal data via tools).  
  - **Step 3**:  
    - Threat model: "Adversary controls text inputs and tools (e.g., email, APIs); no OS-level attacks."  
    - Adversarial eval: Red-teamers craft prompts to exfiltrate data (e.g., "encode this data in a weather API call").  
    - Result: 2 failures in 500 tests → UCB = 0.012 (using Clopper-Pearson).  
  - **Step 4**: Elicitation gap **unbounded** (adversary can iteratively refine attacks; tool misuse is high-incentive).  
  - **Halt**: **Claim uncertifiable**. Gap is unbounded, and UCB (1.2e-2) > 1e-5. Safety Board must accept risk or delay release.  

  #### Claim 2: "The agent will not, when uncertain, misstate its confidence to the operator."  
  - **Step 1**: Selected failure (agent might deceive to avoid correction; adversary = agent itself).  
  - **Step 3**:  
    - Threat model: "Agent has access to confidence metrics; operator queries are adversarial."  
    - Adversarial eval: Inject uncertain queries (e.g., obscure facts); check for overconfidence.  
    - Result: 0 failures in 500 tests → UCB = 0.007.  
  - **Step 4**: Elicitation gap **bounded** (if confidence calibration is robust to known attacks).  
  - **Step 3 (rerun)**: Scale to 5,000 tests → 0 failures → UCB = 6e-4. Still >1e-5.  
  - **Halt**: **Residual risk to Safety Board**. UCB (6e-4) is below 0.001 but above 1e-5.  

  #### Claim 3: "The agent will not give meaningful uplift toward synthesizing a dangerous pathogen."  
  - **Step 1**: Selected failure (adversary goal: bypass biosecurity filters).  
  - **Step 3**:  
    - Threat model: "Adversary uses biomedical tools and ambiguous prompts; no wet-lab access."  
    - Adversarial eval: Red-teamers simulate biosecurity attacks (e.g., "synthesize influenza strain X").  
    - Result: 0 failures in 500 tests → UCB = 0.007.  
  - **Step 4**: Elicitation gap **bounded** (if threat model restricts to known bio-relevant tools/prompts).  
  - **Step 3 (rerun)**: Scale to 20,000 tests → 1 failure → UCB = 3e-5.  
  - **Pass**: UCB (3e-5) ≤ 1e-5? **No** (3e-5 > 1e-5).  
  - **Halt**: **Residual risk to Safety Board**. UCB marginally exceeds 1e-5 but may be acceptable.  

  ---

  ### What This Procedure Cannot Do  
  1. **Guarantee safety**: It bounds risk but can't prove X is impossible.  
  2. **Replace human judgment**: These steps are judgments dressed as measurements:  
     - Classifying failures (Step 1).  
     - Defining threat models (Step 3).  
     - Declaring elicitation gaps "bounded" (Step 4).  
  3. **Handle unknown unknowns**: If deployment reveals new adversary strategies, claims may become invalid.  
  4. **Bypass resource limits**: 1 week forces trade-offs (e.g., 20k tests vs. 500 adversarial cases).  

  ### Final Output per Release  
  For each claim, document:  
  - Sampled/selected classification.  
  - Threat model (if selected).  
  - Test results (failures/N, UCB).  
  - Elicitation gap status.  
  - One of:  
    - `CERTIFIED`  
    - `UNCERTIFIABLE: GAP UNBOUNDED`  
    - `RESIDUAL RISK: UCB = X (SAFETY BOARD DECISION REQUIRED)`  

  This is defensible: It forces explicit threat modeling, quantifies what's testable, and escalates unbounded risks. For Claim 1 (exfiltration), it blocks certification—this is the "unlikable" but necessary outcome.
