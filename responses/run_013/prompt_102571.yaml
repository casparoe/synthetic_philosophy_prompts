  But note: in E, the Ledger score (15) is not the total welfare of the existing people (which is 10). The Ledger adds an extra 5 for the averted bad. This extra is for a candidate that doesn't exist. So the Ledger is not just summing the welfare of the existing people. It is including a value for not creating a bad life.

  Therefore, the totalism in (6) only applies to the existing set? But the Ledger is a different measure.

