  So when we compare outcomes with different populations, the Ledger might not be the same as the total welfare of the existing people. However, note that in the Ledger, the value for a candidate who is not created and would have had a bad life is positive, and that candidate does not exist. So the Ledger is not just about existing people.

  But commitment (6) is about existing people: it says we are totalists for the existing set. But when we are making decisions that affect who exists, we are using the Ledger. So there is no direct conflict because (6) might be intended only for fixed populations? The user says: "For people who actually exist I am an unqualified totalist". So if the population is fixed, we maximize total welfare. But when the population varies, we use the Ledger.

