prompt: |-
  I'm a 2L and I'm in a contracts seminar, and there's something about remedies that's been eating at me all semester while my professor keeps sort of dodging it — I stayed after class to ask and he said we'd come back to it, and we never did. Here's the thing that bothers me. If someone breaches a contract, the normal thing a court does is put the other side where they would of been if the deal had gone through — the expectancy, the benefit of the bargain. That's the default. What the court doesn't normally do, as the measure of the loss, is just hand back what you actually spent getting ready to perform: the deposits, the rented equipment, the hiring, the wasted months. Reliance losses get you a remedy mainly as a fallback — when the lost profit is too speculative to prove, or in promissory estoppel — and even then the whole thing is framed as putting you back where you'd have been if you'd never signed at all. Meanwhile the law-and-econ people tell us the choice between these measures is really about investment incentives: the expectation measure effectively insures the promisee's reliance, and that's supposed to make her sink too much into the deal. And the promisor, on the efficient-breach story, is allowed to walk away and pay as long as that's cheaper than performing — she's supposed to compare only the future, not what she's already poured in. Fine. But then in the same seminar we read Fuller and Perdue, who argue that the reliance interest is really the fundamental thing the law of damages protects and that the expectancy measure is just a rough stand-in for it, and we read about restitution, where the court hands back the benefit the plaintiff already conferred. So the system says, out of one side of its mouth, that what you've already sunk doesn't matter — it isn't the measure of your loss, and the other side can abandon ship if it pays — and out of the other side that reliance is exactly what it's in the business of protecting.

  I want you to act as a philosopher of law and of practical reason and help me get at what this practice actually presupposes. Before you start writing, brainstorm the candidate readings — the several different things the law of remedies could be assuming about whether honoring sunk costs is rational — and then reconstruct, in your own words, the theory it really seems to presuppose. Specifically: does the practice presuppose that honoring sunk costs is always irrational, i.e. that anyone who keeps going on a deal because of what they've already put in is making a mistake the law shouldn't indulge? Or does it presuppose something thinner and more split-level — say, that it's the promisor's forward-looking decision that ought to ignore past investment, while the promisee's reliance deserves protection for some independent reason (fairness, a legitimate expectation, keeping the institution of promising alive)? Is the practice internally consistent, or are the expectation measure and the reliance interest quietly pulling in different directions? And be careful to seperate what the practice strictly needs to presuppose from what it merely fits comfortably with — my hunch is that a lot of this is underdetermined, and that several different theories of practical reason would license exactly the same set of rules.

  Finally, suppose we took seriously the idea that honoring sunk costs is sometimes perfectly rational — because sticking with a project is partly constitutive of having that project at all, because your past investment is evidence about the thing rather than just a cost, or because committing in advance to ignore sunk costs is itself a policy you can rationally adopt. If we rebuilt the law of remedies on that view instead, what would have to change on the ground — the default measure, what estoppel is for, when breach is allowed? I don't want a casebook dump or a reading list, I want the philosophy: what the practice believes about practical reason, whether it's entitled to believe it, and what it would look like if it believed something else. Think it through carefully and land somewhere — don't hedge at the end.
reasoning: |-
  Alright, this is a deep and complex question from a law student grappling with the philosophy behind contract remedies. The user is clearly frustrated with their professor avoiding the tension between expectation damages and reliance interests, and they want a philosophical unpacking of what the legal system presupposes about sunk costs. 

  First, I need to recognize the sophistication here. The user isn't just asking for black-letter law; they've already digested Fuller & Perdue, law-and-econ perspectives, and spotted the apparent contradiction in how remedies treat sunk costs. Their real question is about the coherence of the system's underlying assumptions. 

  The core tension they've identified is razor-sharp: expectation damages tell promisors to ignore sunk costs when breaching ("efficient breach"), while reliance/restitution implicitly values those same sunk costs when compensating promisees. That's not just a technical gap—it's a philosophical fault line.

  Breaking this down, I see three layers they want explored:
  1) What the current doctrine necessarily presupposes about rationality of sunk costs
  2) Whether it's internally consistent
  3) How remedies would change if we took sunk-cost rationality seriously

  Hmm... the law-and-econ framing dominates modern scholarship, but Fuller & Perdue's challenge still haunts the field. And the user is right—courts never explicitly resolve this. The professor's dodging probably reflects how unsettled this is theoretically.

  Key insight: The system isn't logically forced to say sunk costs are always irrational. It could be making a thinner institutional claim—that for breach decisions, we want promisors to ignore sunk costs to maximize social wealth, while for remedy design, we protect promisees' reliance to uphold the trust needed for contracting itself. That's a possible coherence story.

  But if we took sunk-cost rationality seriously? That would upend everything. Restitution would become central, expectation damages might shrink, and "efficient breach" would collapse into a more relational view of contracts. The user's hypothetical about constitutive projects (where abandoning feels like self-betrayal) is particularly powerful—Ulysses contracts come to mind.

  Gotta be careful not to lecture. They've clearly done the reading. Instead, spotlight the philosophical moves: how remedy rules function as a collective choice about which temporal perspective matters when. The punchline should be that the current system privileges promisor futurism and promisee past-protection simultaneously—not because it's philosophically pure, but because it serves transactional efficiency while paying lip service to Fuller's deeper truth.

  ...And their closing challenge is vital: no hedging. So I'll need to commit to the view that the system's coherence is pragmatic, not philosophical, and that changing its sunk-cost assumptions would make contracts look more like fiduciary relationships. Bold, but defensible.
answer: |-
  You've struck at the heart of a profound tension in contract theory – one exposing conflicting assumptions about rationality, time, and the nature of commitment. Let's dissect the presuppositions of the current remedial scheme and then explore a radical alternative.

  **Candidate Readings of the Law's Presuppositions on Sunk Costs:**

  1.  **Strong Irrationality Presupposition:** Sunk costs *should be* ignored by *all* rational actors in *all* forward-looking decisions. The law reflects this by refusing to award reliance costs as the *primary* measure (framing them as a fallback) and enabling "efficient breach" (ignoring the promisor's past costs). Honoring sunk costs is a cognitive error the law avoids institutionalizing.
  2.  **Institutional Division of Labor:**
      *   **Promisor's Role (Breach Decision):** Must be strictly forward-looking and economically efficient (ignoring sunk costs) to maximize social welfare. The "efficient breach" doctrine embodies this.
      *   **Promisee's Role (Remedy Phase):** Is entitled to protection of *reasonable reliance* induced by the promise. This protection serves distinct values: fairness, security of transactions, preventing unjust enrichment, and upholding the institution of promising itself. Reliance recovery isn't about honoring *irrational* sunk cost reasoning by the promisee, but about remedying *harm caused by broken trust*.
  3.  **Fuller & Perdue's Deep Structure:** Expectation damages are merely a *proxy* or *surrogate* for the reliance interest. The real harm is the wasted investment *caused by* the breach of promise. The "benefit of the bargain" is just a convenient, often more certain, way to estimate the *reliance loss plus lost opportunity*. This view downplays the idea that honoring reliance is irrational; instead, it suggests expectation is fundamentally *about* reliance.
  4.  **Underdetermined Pragmatism:** The system doesn't presuppose a single, coherent theory of sunk cost rationality. It's a pragmatic patchwork. Expectation is the default because it's administrable, deters breach, and often approximates reliance. Reliance is awarded when expectation is impractical, serving fairness. Restitution prevents unjust enrichment. "Efficient breach" is tolerated as economically useful. These rules co-exist without a deep philosophical commitment on sunk costs.

  **The Reconstructed Core Presupposition:**

  The dominant remedial practice **presupposes Institutional Division of Labor (Reading #2)**, *tolerated by* Underdetermined Pragmatism (#4), and *in tension with* Fuller & Perdue (#3). It **explicitly rejects** the Strong Irrationality Presupposition (#1) as a *universal* principle governing *all* legal responses.

  *   **Why Strong Irrationality (#1) Fails:** If honoring sunk costs were *always* irrational, the law would:
      *   Never award reliance damages, even as a fallback (it does).
      *   Never award restitution for part performance (it does).
      *   Treat a promisee's reasonable reliance as inherently foolish, undeserving of protection (it doesn't – inducing reasonable reliance is central to contract formation).
      *   See Fuller & Perdue's view as nonsensical (it's influential).
  *   **The Division of Labor Explained:**
      *   **Promisor's Breach Calculus:** The law *requires* the promisor to ignore sunk costs ("sunk is sunk"). This is presupposed as necessary for *allocative efficiency*. The promisor is seen as a rational economic actor comparing *future* costs of performance vs. *future* costs of breach (damages). Past investments are irrelevant to this calculus. To force performance considering sunk costs would be inefficient.
      *   **Promisee's Protection:** The law presupposes that the *promisee's* reliance, *induced by the promise*, creates a legitimate expectation of security. Protecting this reliance (via expectation *or* reliance damages) serves values *independent* of the promisor's efficiency calculus: preventing harm from broken promises, ensuring fairness, deterring opportunistic behavior, and maintaining the trust necessary for the institution of contract to function. The promisee isn't seen as irrational for relying; the reliance is a *consequence* of the valid promise. The harm is the *causation* – the promisee wouldn't have incurred these costs *but for* the promise.
  *   **Tension with Fuller & Perdue:** The system pays lip service to the reliance interest's fundamentality (Reading #3) but its operational heart (expectation as default, efficient breach) treats the expectancy as a distinct, forward-looking guarantee. Expectation often *exceeds* provable reliance (lost profit), contradicting the pure surrogate idea. The system *uses* Fuller & Perdue to justify reliance recovery when convenient but doesn't fully integrate it as the core rationale.
  *   **Pragmatic Tolerance:** The system doesn't demand perfect philosophical coherence. It accepts that protecting promisees' reliance (past costs) while demanding promisors ignore their own past costs serves different, valuable social functions simultaneously, even if the underlying view of sunk costs seems inconsistent at the actor level. It's "split-level" rationality.

  **Is the Practice Internally Consistent?**

  **No, but it's functionally stable.** The expectation measure and reliance interest *are* pulling in different directions concerning sunk costs:
  *   **Expectation (as applied):** Tells the promisor: "Ignore your sunk costs; only future costs matter for breach." It tells the promisee: "You are guaranteed a future state (benefit of the bargain), effectively insuring your past reliance *investment* against loss *caused by breach*."
  *   **Reliance Interest (as recovered):** Directly compensates the promisee for their sunk costs *caused by the breach*. Fuller & Perdue argue this is the true core.

  The tension lies in the promisor's perspective vs. the promisee's recovery. The promisor is forced to ignore their *own* sunk costs but must compensate the promisee *for theirs* (either directly via reliance or indirectly via expectation). The system presupposes that *for the purpose of deciding whether breach is efficient*, sunk costs are irrelevant (promisor-side), but *for the purpose of remedying the harm of breach*, the promisee's sunk costs (or their expectation, which often subsumes them) are highly relevant. This functional separation creates a *pragmatic* consistency for the system, even if it lacks deep philosophical unity on the rationality of sunk costs per se.

  **Rebuilding on the Rationality of Honoring Sunk Costs:**

  Suppose we took seriously that honoring sunk costs can be rational:
  *   **Constitutive Commitments:** Sticking with a project defines who we are; abandoning it betrays a past self whose commitment had value. (e.g., finishing a monument, seeing a research project through).
  *   **Sunk Costs as Evidence:** Past investment signals value/commitment not captured by current market prices or purely future forecasts. Abandoning ignores this informational signal. (e.g., drilling 9/10ths of an oil well).
  *   **Pre-Commitment Rationality:** Binding oneself to ignore future temptations to quit *because* of sunk costs is a rational strategy to overcome weakness of will or achieve long-term goals (Ulysses contracts).

  **How the Law of Remedies Would Change:**

  1.  **Default Measure Shift:** **Reliance (or Cost-to-Complete) would become the primary default measure**, not expectation. The focus shifts to restoring the promisee to their pre-contract position *plus* compensating for the reasonable costs incurred towards performance *caused by the broken promise*. Expectation would be reserved for cases where future profits are highly certain and quantifiable (e.g., commodity sales). The law would recognize the harm as the *wasted investment induced by the promise*.
  2.  **Promissory Estoppel Transformed:** PE would lose its "fallback" status. It would exemplify the *core* rationale: protecting reasonable, foreseeable reliance induced by a promise. The requirement for "injustice" would focus squarely on the harm of wasted investment due to broken assurances. It wouldn't be a consolation prize for failed contracts; it would be the paradigm.
  3.  **"Efficient Breach" Curtailed:** The doctrine would collapse. A promisor could not simply compare future performance costs to expectation damages. They would *also* have to consider the *reliance costs already incurred by the promisee* that their breach would waste. Breach would only be "efficient" if the net gain to the promisor *exceeded the total reliance losses inflicted on the promisee*. The promisor would internalize the full social cost of wasted reliance. Breach motivated solely by finding a better deal after the promisee has relied heavily would become far less attractive and potentially penalized.
  4.  **Restitution's Role Amplified:** Restitution for benefits conferred (part performance) would be seen as a fundamental expression of preventing unjust enrichment from reliance, not just an alternative remedy. It would be more readily available.
  5.  **Specific Performance Presumption:** Courts would be much more inclined to order specific performance. If honoring sunk costs is rational and constitutive, forcing the promisor to follow through on their commitment (rather than letting them "pay to walk away," wasting the promisee's reliance) becomes the default way to respect the rationality embedded in the sunk costs of *both* parties. The uniqueness of the subject matter would matter less; the uniqueness of the *reliance investment* would matter more.
  6.  **Focus on Causation & Foreseeability:** The central inquiry would be: "What costs did the promisee reasonably and foreseeably incur *in reliance on this promise*, that are now wasted due to its breach?" This replaces "What would the promisee's position have been if the promise had been kept?"
  7.  **Doctrinal Labels Fade:** The rigid distinctions between expectation, reliance, and restitution would blur, as all would be seen as serving the unified purpose of remedying harm caused by broken promises, primarily measured by the wasted investment they induced.

  **Conclusion: The Law's Entitlement and a Radical Alternative**

  The current remedial practice is **entitled to its pragmatic, institutionally divided presupposition**. It prioritizes transactional efficiency (via promisor's forward-looking breach calculus) and commercial certainty (via the relatively clear expectation default), while offering patchwork protection for reliance based on fairness and institutional needs. It doesn't require a deep philosophical stance on sunk costs; its coherence is functional, not theoretical.

  However, if we take the rationality of honoring sunk costs seriously – recognizing commitments as constitutive, sunk costs as potentially informative, and pre-commitment strategies as valid – **the current edifice crumbles.** It presupposes a thin, economistic view of rationality that ignores the temporal depth of human agency and the meaning embedded in past investments. Rebuilding on this richer view would shift the law profoundly towards protecting the integrity of induced reliance as the core harm of breach, making reliance/cost-based remedies primary, severely curtailing "efficient breach," and elevating specific performance. The law would move from facilitating detached market transactions towards enforcing deeper commitments and preventing the waste of trust and investment. The tension you identified isn't an oversight; it's a symptom of the law's uneasy compromise between economic efficiency and the human reality of commitment. Embracing the rationality of sunk costs demands choosing the latter.
