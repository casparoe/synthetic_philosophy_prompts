prompt: |-
  I'm putting together satirical bits for a philosophy-of-history reading group and need one more. Write me a mock quarterly investor letter, around 500-600 words, from a fund called something like Long Arc Capital whose entire thesis is that history bends toward justice. Deadpan finance-bro voice: positions, drawdowns, "we remain long the arc," explaining away a brutal quarter (a war, a genocide) as mere volatility that doesn't touch the long-term trajectory.

  The jokes have to come from the actual argument, thats the whole point -- someone who's read the teleology/providence stuff should laugh, not wince. So let the letter accidentally give away the standard problems without ever stating them as problems: that "the arc bends toward justice" can't be falsified if every setback is just noise on a long enough timeline; that it quietly assumes both a destination and a driver (does the arc bend on its own, or is somebody bending it, and what's the difference for the investor?); and that Whig history keeps mistaking the present for the summit of the curve. Have one aside or footnote smuggle in a nod to the problem of evil without naming it.

  Don't let the fund manager ever notice he's doing any of this -- keep it completely straight-faced, no winking. And maybe end on him agonizing over whether to hedge, since the pitch is unfalsifiable but the redemptions are real. No quotes or citations needed, just write it.
