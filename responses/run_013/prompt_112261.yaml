  ### Decision Tree: Survival of Bodily Death

  **Branch 1: Does the survival claim have observable consequences?**  
  (Case: Medium reports a message only the deceased could have known.)  
  - **No**  
    → *Leaf 1: Ayer's Early Strict Verificationism*  
      - **Position:** Survival claims are literally meaningless unless given an empirical interpretation.  
      - **Awkward:** Cannot meaningfully discuss survival, even to deny it.  
      - **Move to neighbor:** Change to "Yes" on Branch 1.  
  - **Yes**  
    → **Branch 2: Are the consequences checkable by a finite observer?**  
      - **No**  
        → *Leaf 2: Logical-Construction View*  
          - **Position:** Survival is conceivable (meaningful) but unverifiable.  
          - **Awkward:** Survival is intelligible but forever beyond empirical investigation.  
          - **Move to neighbor:** Change to "Yes" on Branch 2.  
      - **Yes**  
        → **Branch 3: Near-death experience (NDE) case:**  
          (Subject reports seeing the room from above—evidence for survival?)  
          - **a) Evidence for survival**  
            → **Branch 4: Memory transfer case:**  
              (Memories/character gradually transferred to a new body—does survival require the same person?)  
              - **Yes (same person required)**  
                → **Branch 5: Disembodied voice case:**  
                  (Voice has deceased's memories—continuous with the original or fresh entity?)  
                  - **Continuous (by memory)**  
                    → *Leaf 3: Lockean Memory-Continuity View*  
                      - **Position:** Survival requires memory continuity (identity via psychological connectedness).  
                      - **Awkward:** Risk of duplicate persons if memories are copied.  
                      - **Move to neighbor:** Change to "Fresh" on Branch 5, or "Causal trace" on Branch 4.  
                  - **Fresh entity (or requires a body)**  
                    → *Leaf 4: Bodily-Resurrection View*  
                      - **Position:** Survival requires bodily continuity (e.g., reassembled/resurrected body).  
                      - **Awkward:** Defining "same body" after death/decay.  
                      - **Move to neighbor:** Change to "Continuous" on Branch 5, or "Causal trace" on Branch 4.  
              - **No (causal trace/impersonal influence enough)**  
                → **Branch 6: Type of causal influence?**  
                  - **Leads to new individual**  
                    → *Leaf 5: Reincarnation View*  
                      - **Position:** Survival as causal transfer (e.g., karma) to a new being.  
                      - **Awkward:** Lack of verifiable memory links between lives.  
                      - **Move to neighbor:** Change to "Impersonal state" on Branch 6, or "Same person" on Branch 4.  
                  - **Leads to impersonal state**  
