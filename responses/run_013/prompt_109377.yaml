prompt: |-
  Alright, I've got about eighteen months, one co-author, and basically no budget, and I want to spend it on guilt vs. shame — the "which is the better moral emotion" question, and the weirder one underneath it, whether a culture can actually choose which of the two it runs on. I don't want a literature review or a reading list, I want help figuring out which of the open questions here is worth the time and which ones will just eat a year and produce nothing.

  Here's the stuff I keep circling, so you know where I'm coming from. I buy the standard split at least roughly — guilt as a verdict on a particular act, shame as a verdict on the self, or on being seen — but I don't think it survives contact with cases. The person who can't forgive themselves for one thing they did isn't obviously feeling guilt-as-act-verdict; the person who feels dirty because of a relative's crime isn't obviously feeling shame about a self they chose. So one live question is whether that distinction is doing any real work, or whether it's two names for one thing with different audiences. Second: I keep running into the claim that shame is the worse emotion because it's about the whole self and so leads to withdrawal and hiding, while guilt is better because it's act-focused and leads to repair. But that seems backwards half the time — people repair out of shame constantly, and people sit in guilt without doing anything. So is the normative ranking of the two a real finding or an artifact of which cases people happen to pick? Third, and this is the one I actually care about: can a culture choose? I've been playing with a distinction and I can't tell if its real — between shame that's owed (you did something that merits it) and shame that's imposed (someone else's gaze, whether or not you did anything). And the choice question looks to me like it's really about whether a society can shift which of those it runs on, or whether all it can shift is which one it publicly authorizes while the underlying emotion stays put. There's also the possibility I find most annoying: that a culture can inflate shame — crank the audience and the standards until shame fires on trivia — and that this is what people mean by a shame culture, not that shame is intrinsically conformist. If that's right, the interesting variable isn't shame vs. guilt at all, it's calibration.

  So given all that, which open questions should me and my co-author actually spend the eighteen months on? I want them ordered, and I want the reasoning: which are upstream of which, which are tractable for two people with no lab and no archive, which look deep but wouldn't change anything downstream, and what you'd expect to see in a year that would move one up or down the list. Also tell me which of my three framings — the distinction-doesn't-survive one, the normative-ranking-is-an-artifact one, the calibration one — is worth building on and which I should drop. And if there's a question in this area I haven't listed that you think outranks all of mine, say so and say why.
reasoning: |-
  Okay, let me start by really unpacking what this researcher is asking. They have eighteen months, no budget, and a co-author to tackle the guilt vs. shame question, specifically focusing on whether cultures can choose which moral emotion they run on. They're circling three main areas: the validity of the guilt-shame distinction, the normative ranking of the two emotions, and the possibility of cultural choice, which they suspect might be about calibration rather than a binary choice.

  First, I need to assess which of their questions are most tractable and impactful. They mentioned no lab or archive access, so any approach requiring experimental setups or historical research is out. That means methods like literature reviews or meta-analyses are more feasible. Let's look at their three framings. 

  The distinction between guilt and shame not surviving contact with real cases is a common critique. But if they dive into this, they might get stuck in theoretical debates without moving forward. The normative ranking issue seems important, but existing studies might be too varied to synthesize without resources. The cultural choice question tied to calibration feels the most original and actionable. It's under-explored and could have practical implications.

  The researcher's insight about calibration—shame being cranked up by societal standards—is key. If they can show that shame cultures aren't inherently different but just have heightened sensitivity, that reframes the entire debate. Plus, testing this through vignettes and surveys is doable without a lab. They can manipulate variables like audience presence or standards to see how shame responses change. 

  Another angle is the owed vs. imposed shame distinction. This could be operationalized in surveys by describing scenarios where shame is deserved versus externally imposed. Comparing individualist vs. collectivist groups might reveal cultural differences in calibration. Also, longitudinal data from cultural shifts, like movements away from honor cultures, could provide real-world evidence of recalibration.

  Prioritizing the calibration question makes sense because it's upstream. If shame's impact depends on calibration, then the normative debate (question 2) depends on this. Question 1 about the distinction becomes less critical if calibration is the real variable. For tractability, surveys and vignettes are manageable for two people. They can start by designing scenarios that vary audience and standards, then measure emotional and behavioral responses. Partnering with cultural groups could provide diverse samples without needing travel funds.

  I should also consider if there's a better question they haven't mentioned. One possibility is how digital surveillance affects shame calibration, but that might be too broad for their timeframe. Their calibration angle is strong enough. They need to avoid getting sidetracked by theoretical debates and focus on empirical tests. Key milestones include survey design by month 3, data collection by month 9, and analysis by month 15. If they find calibration varies culturally, that supports their hypothesis. If not, they might revisit the distinction's validity.

  In summary, prioritizing the calibration question leverages their resources, addresses the core of cultural choice, and has downstream implications for the other questions. Dropping the distinction debate initially saves time, and the normative ranking can be revisited once calibration is understood.
answer: |-
  Based on your constraints (18 months, 2 people, no budget/lab/archive) and your goal of targeting a *high-impact, tractable* question that avoids dead ends, here’s the prioritized roadmap:

  **Ranked Open Questions & Reasoning:**

  1.  **The Calibration Question: Can societies *recalibrate* shame's sensitivity (audience scope, severity threshold) without switching moral emotions?**
      *   **Why Upstream:** This directly challenges the "guilt vs. shame culture" binary. If calibration is the key variable, it reframes *everything* – the distinction's usefulness, the normative ranking, and the feasibility of "choosing." It answers your hunch that "shame culture" might just be "inflated shame sensitivity."
      *   **Why Tractable:**
          *   **Method:** Comparative vignette surveys are your best tool. Design scenarios systematically varying:
              *   *Audience:* Private knowledge vs. public exposure (strangers/family/ingroup).
              *   *Stakes:* Trivial norm violation vs. serious harm vs. "victimless" taboo.
              *   *Agency:* Direct action vs. relative's action vs. inherent trait.
              *   *"Owed" vs. "Imposed":* Clear personal fault vs. arbitrary social judgment.
          *   **Participants:** Leverage existing online panels (Prolific, MTurk) *strategically*:
              *   Target identifiable subcultures (e.g., strict religious communities vs. secular liberals; immigrant communities maintaining traditions vs. assimilated; online communities with strong norms).
              *   Compare individualist-leaning vs. collectivist-leaning cohorts *within* accessible populations (e.g., US/UK).
          *   **Measures:** Go beyond self-report labels ("guilt"/"shame"). Measure:
              *   *Affective Experience:* "Dirty," "small," "wanting to hide" (shame markers) vs. "remorseful," "regretful" (guilt markers).
              *   *Behavioral Intentions:* "Apologize/replace" (repair) vs. "Avoid people," "Keep secret" (withdraw/hide).
              *   *Perceived Severity/Deservedness:* "How wrong was this?" "Did they deserve this feeling?"
          *   **Analysis:** Look for interaction effects. Does the *same* scenario trigger withdrawal *only* when the audience is broad or the standard feels arbitrary? Does "shame" predict repair *only* when the subject feels the judgment is "owed"?
      *   **Why High-Impact:** Successfully demonstrating that shame's *effects* (withdrawal vs. repair) depend critically on calibration (audience, standards) would revolutionize the field. It shifts focus from "which emotion?" to "how is this emotion *tuned*?" This directly addresses your core "can a culture choose?" question – choice becomes about tuning knobs, not flipping switches.
      *   **18-Month Milestones:**
          *   Month 1-3: Refine theory, design core vignette sets (pilot test on diverse colleagues/friends).
          *   Month 4-6: Program/main survey (Qualtrics/Gorilla), secure ethical approval, recruit initial panels.
          *   Month 7-12: Data collection & preliminary analysis (run batches sequentially, refine if needed).
          *   Month 13-15: Deep analysis, robustness checks.
          *   Month 16-18: Writing, drafting theory of cultural recalibration. Identify 1-2 key follow-ups.

  2.  **The Normative Ranking Artifact Question: Is the "shame=bad/withdraw, guilt=good/repair" dichotomy empirically robust across contexts?**
      *   **Why Second:** This is *downstream* of Calibration. Your calibration study *directly tests* this. By manipulating audience/standards/agency, you see *when* shame leads to repair vs. withdrawal and *when* guilt leads to inaction. The analysis of your Calibration data *is* the test of this artifact claim.
      *   **Tractability:** Entirely addressed within the Calibration study design. No extra work needed beyond ensuring your vignettes/scales capture repair/withdrawal intentions and affective correlates of both emotions.
      *   **Impact:** Undercuts simplistic policy/psych recommendations. Shows the *context* (calibration) determines the outcome, not the emotion label itself. Makes Calibration findings more actionable.
      *   **Milestone:** Results from Calibration analysis (Months 13-15) answer this.

  3.  **The Distinction's Validity Question: Does the act-vs-self/private-vs-public distinction hold up?**
      *   **Why Last (Potentially Droppable):**
          *   **Downstream/Subsumed:** Calibration potentially *explains* the messy cases (e.g., inability to forgive = intense, privately calibrated "guilt" feeling like shame; shame over relative's crime = highly inclusive audience/identity calibration). If calibration drives effects, the precise label matters less.
          *   **Tractability Trap:** Untangling phenomenological experience linguistically is notoriously difficult without intensive qualitative/clinical work (beyond your means). Endless debates over definitions could consume your time.
          *   **Lower Impact:** Even if messy, the *functional consequences* (repair vs. withdrawal) driven by calibration are more relevant to the "which is better?" and "can we choose?" questions than semantic purity.
      *   **Action:** **Do not prioritize this as a standalone question.** Address it *implicitly* within the Calibration study:
          *   Include scenarios designed to blur the lines (e.g., "Can't forgive self for act," "Shame over family action").
          *   Analyze how your affective/behavioral measures correlate *across* these scenarios relative to calibration factors. Do the "blurry" cases cluster based on calibration, not traditional definitions?

  **Assessment of Your Framings:**

  *   **Calibration Framing (Owed vs. Imposed; Inflating Standards): KEEP & BUILD.** This is your most original, powerful, and tractable insight. It directly targets the core "can a culture choose?" question in a novel, operationalizable way.
  *   **Normative Ranking Artifact Framing: KEEP, BUT INTEGRATE.** It's crucial and is best tested *through* the lens of Calibration. Don't make it standalone.
  *   **Distinction Doesn't Survive Framing: SHELVE/DROP.** While valid, pursuing it directly is likely a quagmire with lower payoff for your core goals. Let your Calibration work inform it indirectly.

  **The Winning Strategy: Focus Entirely on Calibration**

  Your "calibration" hypothesis isn't just one option; it's the key that unlocks the others pragmatically. By rigorously testing how audience, standards, and agency calibrate the experience and consequences of moral distress (whether labeled guilt or shame), you:

  1.  **Answer "Can a culture choose?":** Yes, by choosing *what* triggers the emotion, *who* the audience is, and *how severe* the perceived violation must be. This *is* choosing the operating system's settings.
  2.  **Resolve the Normative Artifact:** Show that "bad" outcomes (withdrawal) stem from miscalibration (overly broad audience, arbitrary/unfair standards), not shame *per se*. "Good" outcomes (repair) can emerge from well-calibrated shame or guilt.
  3.  **Explain the Blurry Distinction:** Messy cases arise from overlapping calibration settings, not a flawed distinction. Intense guilt over an act with a very strict internal standard *feels* shame-like. Shame triggered by a specific, "deserved" act with a narrow audience might prompt repair like guilt.

  **Upshot for the Next 18 Months:**

  *   **Core Project:** Design and execute the **Comparative Vignette Survey on Shame/Guilt Calibration**.
  *   **Key Moves:**
      *   Obsess over vignette design – they are your experiment.
      *   Partner with researchers who have access to specific cultural/religious communities if possible (trade authorship for access).
      *   Prioritize behavioral intentions and affective markers over self-labeled emotions.
      *   Analyze relentlessly for the *interactions* between transgression type and calibration factors (audience/standards).
  *   **Expected Progress in 12 Months:** Clear preliminary patterns showing how audience presence/scope and perceived standard fairness/severity dramatically alter the reported experience (shame/guilt markers) and behavioral intentions (withdraw/repair) across different transgression types. Evidence that "shame-like" responses can lead to repair under "owed" conditions, and "guilt-like" responses can lead to withdrawal under high pressure.
  *   **Potential Pivot Point (by ~Month 9):** If early data strongly suggests the *label* (guilt/shame) is far less predictive than the *calibration context*, double down on analyzing experience/behavior and explicitly frame your findings as transcending the traditional dichotomy. If the distinction holds *despite* calibration, then the distinction question becomes slightly more relevant, but your core calibration findings are still paramount.

  This approach maximizes your chances of producing novel, impactful, and actionable insights within your constraints, directly tackling the deepest question you care about: **how cultures actually manage moral emotion, not which one they supposedly "have."**
