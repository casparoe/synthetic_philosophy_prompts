answer: |-
  **MEMORANDUM**  
  **TO:** All NORA Grant Review Panel Members  
  **FROM:** Eleanor R. Vance, Director of Evaluation, National Office for Research Advancement (NORA)  
  **SUBJECT:** Mandatory Application of Lakatosian Research Programme Methodology in Grant Assessment Cycle FY25-26  

  This memorandum details the mandatory procedures for implementing the NORA Charter Mandate 7.1(b), which states: "All research funding determinations shall prioritize the sustained, systematic advancement of knowledge through the explicit identification and support of *progressive research programmes*." As you are aware, the Board has formally adopted Imre Lakatos's Methodology of Scientific Research Programmes (MSRP) as the sole binding framework for evaluating grant applications, effective immediately. This directive supersedes all prior evaluation rubrics. Your adherence to the following procedural guidelines is essential for maintaining consistency, rigor, and strategic alignment with NORA's mission of fostering "enduring epistemic growth."

  The core objective is to classify each proposed project as operating within a distinct research programme (RP) and to assess whether that RP is currently exhibiting a *progressive* or *degenerating problem-shift*. Panels must first identify the RP’s **Hard Core (HC)**. The HC constitutes the fundamental, non-negotiable theoretical propositions central to the programme. Per the **Negative Heuristic**, practitioners within the RP are obligated *never* to subject the HC to empirical challenge or modification. It is axiomatic. Crucially, NORA policy recognizes that the HC, by its nature, may *not* be directly falsifiable. Indeed, its inviolability is paramount. Consequently, any proposal explicitly or implicitly challenging the HC of an established NORA-funded RP will be flagged for **Core-Defection Risk (CDR)** and is highly unlikely to secure funding. Furthermore, the precise delineation of a programme’s HC is protected under Agency Confidentiality Protocol Epsilon-7 to prevent strategic reinterpretation by competing programmes. Panels will receive confidential HC dossiers for established NORA-funded RPs.

  Surrounding the HC is the **Protective Belt (PB)** of auxiliary hypotheses, models, and initial conditions. It is *this* belt that bears the brunt of empirical testing and must be adjusted to accommodate anomalies. Proposals should clearly articulate how their work modifies or adds to the PB. Panels must scrutinize PB modifications for signs of **Protective-Belt Bloat (PBB)** – defined as the proliferation of ad-hoc adjustments lacking independent testable content or failing to connect meaningfully to the programme’s **Positive Heuristic (PH)**. The PH is the programme’s internal engine, guiding practitioners towards which problems to solve and which new phenomena to investigate. A strong PH generates a sequence of problems leading to novel predictions.

  The critical determination panels must make is whether the RP is undergoing a *progressive* or *degenerating problem-shift*. A shift is **Progressive** if:  
  1.  It predicts *novel facts* not previously anticipated and not merely accommodations of known anomalies.  
  2.  At least *some* of these novel predictions are corroborated (verification is preferable, but not strictly required within a single funding cycle; the *predictive intent* is key).  
  A shift is **Degenerating** if:  
  1.  It offers only post-hoc explanations of existing anomalies without predicting anything substantively new.  
  2.  It exhibits excessive PBB unrelated to the guidance of the PH, accumulating **Heuristic Debt (HD)** – deferred problem-solving that weakens the programme’s long-term trajectory.  
  3.  It engages in **Premature Monster-Barring (PMB)** – the dismissal of counter-evidence or competing programmes through non-empirical, definitional maneuvers *before* the PB has been genuinely tested.

  **Novelty for funding purposes** is strictly defined: A predicted fact is novel only if it was *verifiably absent* from the relevant scientific literature *prior* to the formulation of the prediction guiding the proposed work, as determined by NORA's standardized bibliometric search protocol (Ref: SOP-EVAL-114). Predictions of phenomena already under active investigation elsewhere, or minor variations on known effects, do not constitute sufficient novelty.

  Programmes receiving a **Degenerating** classification will be placed on Probationary Status. The lead laboratory may appeal this verdict within 30 days by submitting a **Progressive Shift Mitigation Plan (PSMP)**. This plan must detail: a) Specific, testable *novel predictions* to be generated within the next 18 months; b) A timetable for PB adjustments directly linked to the PH; c) Metrics for reducing identified HD and PBB. The Appeals Subcommittee will assess the plausibility of the PSMP solely against Lakatosian criteria. Continued funding hinges on a successful appeal.

  Objections regarding the practical difficulty of real-time assessment of progressiveness, raised during training sessions, reflect a misunderstanding of the framework's precision. As noted in the *NORA MSRP Implementation Handbook*, "The structural indicators of a programme's trajectory – its predictive ambition, heuristic coherence, and belt integrity – are discernible within active research cycles." Concerns like those expressed by Panel Member D7 in their query, "But Director, how do we *know* a prediction is truly novel *before* it's tested? Isn't progressiveness only clear later?" misunderstand the evaluative task. We assess the *programme's current methodological health and direction* based on its adherence to MSRP principles and the presence of the structural hallmarks of progressiveness as defined above. The Handbook is explicit: "The potential for future corroboration is embedded within the predictive structure itself; retrospective certainty is not required for prospective evaluation."

  Your commitment to rigorously applying this sophisticated framework is appreciated. It ensures NORA funding drives genuine scientific advancement, strategically supporting programmes demonstrating the systematic, predictive power that defines world-leading research. Direct procedural questions to the MSRP Liaison Office.  
  **E.R. Vance**
