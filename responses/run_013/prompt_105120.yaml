prompt: |-
  Im putting together a session on partiality and the moral point of view and keep going in circles, so I want the spec first, before any theory. Write me the desiderata for a theory of what morality asks of an agent -- what it has to deliver to survive Williams's integrity objection, the drowning-wife case where the man just saves his wife and the theory has supposedly forced a thought too many on him. Give me the full list: the cases it has to get right (the drowning wife, but also the harder ones -- a doctor choosing between his own child and a stranger with the better prognosis, someone told to drop a lifelong project for a marginally bigger impartial gain, a person whose ground project is itself morally rotten), the distinctions it can't collapse (justifying an action versus the deliberation that actually produces it; permitted partiality versus required partiality; integrity versus plain self-indulgence), and the constraints it can't break (morality still has to be authoritative, not just whatever the agent happens to care about). Then tell me which of these can't all be held at once -- that's the part I most want -- and which single requirement does the most to rule out the usual suspects. Keep the scorecard of consequentialism, Kantianism and the rest to a line each, I'll do that bit in class.
reasoning: |-
  Okay, the user is putting together a session on partiality and the moral point of view and feels stuck going in circles. They want the desiderata for a theory of morality that can handle Williams's integrity objection, specifically the drowning wife case. They need a full list of cases, distinctions, and constraints, plus which ones conflict and which requirement is the biggest hurdle for existing theories.

  First, I recall Williams's drowning wife example. The husband saves his wife without overthinking impartial morality. A theory that forces him to consider impartial reasons adds "one thought too many." So the desiderata must include preserving the immediacy of such actions without requiring impartial justification.

  Next, the user mentions harder cases: a doctor choosing between his child and a stranger with a better prognosis, abandoning a lifelong project for marginal gain, and someone with a morally rotten project. These test partiality's limits. The theory must allow partiality but not when projects are immoral. Also, the doctor case involves role responsibilities conflicting with partiality.

  Distinctions are key: justifying vs. deliberating, permitted vs. required partiality, integrity vs. self-indulgence. The theory must explain why the husband doesn't need impartial deliberation but the doctor might. Permitted partiality allows saving a spouse, but required? Maybe not. Integrity shouldn't excuse selfishness.

  Constraints: morality must be authoritative, not just subjective. It can't be reduced to personal desires. So the theory needs objective grounds even when allowing partiality.

  Now, conflicts. Authoritative Morality vs. Non-Alienation is a big one. If morality demands impartiality, it alienates personal commitments. But if it's too subjective, it loses authority. Also, Permitted vs. Required Partiality: if partiality is required, it might force someone to act partially even when they want to be impartial. But that seems counterintuitive. The Integrity vs. Corruption Distinction is tricky when projects are immoral—how to condemn without undermining integrity.

  The hardest constraint is Non-Alienation. It rules out strict consequentialism and Kantianism because they impose impartiality, leading to alienation in cases like the drowning wife or abandoned projects. Virtue ethics might handle it better with character-based reasons, but could blur integrity and self-indulgence.

  The user wants to know which requirement rules out usual suspects. Non-Alienation is key. It forces theories to incorporate personal commitments without losing moral authority. Consequentialism and Kantianism struggle here, while virtue ethics and hybrid theories might fare better but have their own issues.

  The user also needs the scorecard concise. Consequentialism: alienating due to maximization. Kantianism: alienating with impartial duties. Virtue Ethics: handles non-alienation but may blur distinctions. Hybrids: promising but need to balance tensions.

  In the response, I'll structure the desiderata clearly: cases, distinctions, constraints. Highlight conflicts, especially Non-Alienation vs. Authoritative Morality. Emphasize Non-Alienation as the main hurdle. Keep theories to a line each as requested.
answer: |-
  Here’s a rigorously structured specification of desiderata for a theory of morality’s demands on agents, designed to navigate Williams’ integrity objection and related challenges. I’ve distilled the core requirements, conflicts, and the key constraint that eliminates most theories.

  ---

  ### **Desiderata for a Theory of Morality’s Demands**  
  *(Surviving Williams & Capturing Moral Complexity)*  

  #### **I. Cases the Theory Must Get Right**  
  1. **The Drowning Wife**  
     - *Demand*: Allow immediate, partial rescue *without* requiring impartial justification in deliberation.  
  2. **Doctor’s Dilemma**  
     - *Demand*: Permit (but not require) a doctor to prioritize their child over a stranger with a better prognosis, acknowledging role responsibilities vs. parental love.  
  3. **Abandoned Project**  
     - *Demand*: Explain why an agent may *refuse* to discard a lifelong project (e.g., art, research) for marginally greater impartial good (e.g., donating to charity).  
  4. **Corrupt Ground Project**  
     - *Demand*: Condemn projects inherently immoral (e.g., a racist’s life work) without collapsing into total alienation of the agent’s identity.  

  #### **II. Distinctions the Theory Must Preserve**  
  1. **Justification vs. Deliberation**  
     - Morality may *permit* partial acts without demanding agents *deliberate* impartially (e.g., the husband needn’t weigh his wife’s value against others).  
  2. **Permitted vs. Required Partiality**  
     - Saving one’s spouse is *permissible* but not *obligatory*; morality shouldn’t force partiality where impartiality is chosen (e.g., a firefighter saving a stranger first).  
  3. **Integrity vs. Self-Indulgence**  
     - Protect identity-constituting commitments (integrity) but distinguish from mere self-interest (e.g., refusing to aid others to binge-watch TV).  

  #### **III. Constraints the Theory Cannot Violate**  
  1. **Non-Alienation (Williams’ Core)**  
     - Morality must not alienate agents from their "ground projects" or personal attachments.  
  2. **Authoritative Morality**  
     - Moral reasons must be objective/binding, not reducible to subjective desires (e.g., "I love my wife" isn’t *why* saving her is morally OK).  
  3. **Action-Guidance**  
     - Must provide practical deliberation tools (not just post hoc justifications).  

  ---

  ### **Conflicts Between Desiderata: The Inherent Tensions**  
  **The central tension:** **Non-Alienation vs. Authoritative Morality**.  
  - *Why incompatible?*  
    - **Non-alienation** demands that morality accommodate personal commitments as *sources* of reasons (e.g., "I save my wife *because she’s my wife*").  
    - **Authoritative morality** requires reasons to be generalizable/objective (e.g., "Saving spouses is permitted *because* personal bonds have moral weight").  
  - **Result**: If morality is authoritative, personal reasons must be systematized—but this *forces* agents to adopt an external perspective, violating non-alienation (the "thought too many").  

  **Secondary conflicts**:  
  - **Permitted vs. Required Partiality** vs. **Corrupt Projects**:  
    If partiality is sometimes *required* (e.g., parental duties), it risks excusing corrupt projects ("I must prioritize my hate group").  
  - **Integrity vs. Self-Indulgence** vs. **Abandoned Projects**:  
    Hard to define when projects merit protection (art?) vs. indulgence (hobbies?).  

  ---

  ### **The Requirement That Rules Out "Usual Suspects"**  
  **Non-Alienation** is the **killer constraint**:  
  - Eliminates theories demanding agents *subordinate* personal commitments to impartiality (e.g., maximizing utility, universalizable duties).  
  - **Why it’s decisive**: Alienation undermines moral motivation and distorts practical reasoning (per Williams).  

  ---

  ### **Scorecard of Major Theories (One Line Each)**  
  - **Consequentialism**: Fails *Non-Alienation* (demands maximization over projects) and *Justification vs. Deliberation*.  
  - **Kantianism**: Fails *Non-Alienation* (requires impartial deliberation) and *Permitted Partiality*.  
  - **Virtue Ethics**: Passes *Non-Alienation* (grounded in character) but struggles with *Authoritative Morality* (relativism risk) and *Corrupt Projects*.  
  - **Hybrid Theories (e.g., Scheffler’s Agent-Centered Prerogatives)**: Best on *Non-Alienation* but weak on *Corrupt Projects* and *Authoritative Morality*.  

  ---

  ### **Key Takeaway for Your Session**  
  **The core problem**: No theory satisfies all desiderata because **Non-Alienation and Authoritative Morality are irreconcilable in pure forms**. Williams’ insight is that morality *must* be fractured—all theories sacrifice something. Use this to frame student debate: *Can morality be authoritative without being alienating?* If not, what do we prioritize? This tension explains why "going in circles" is inevitable without acknowledging the trade-offs.
