  Here’s a speech draft that confronts the "man of his time" defense head-on, gives it its strongest form, and then forces it to live with the "which time?" problem, leaving the tension unresolved. It avoids your forbidden words and stays within 3-4 minutes.

  **The Speech:**

  (Stand near the Jefferson portrait, gesture subtly towards it at the start)
  Good morning. Look around this room. On these benches, history was argued, defined, contested. Above us now, a portrait watches – Thomas Jefferson. Author of words that still ring: *"All men are created equal."* And owner of human beings.

  (Shift tone to earnest, presenting the strong defense)
  When we try to grasp that contradiction, one common answer emerges: Jefferson was a man *of his time*. The strongest version of this isn't an excuse; it’s context. It says: imagine the world he inhabited. Slavery wasn’t an abstract evil debated in distant lands; it was the bedrock economy, the unspoken assumption in countless drawing rooms, the legal reality woven into the very fabric of colonial life for generations. To challenge it radically meant risking chaos, collapse, perhaps even the fragile dream of this new nation itself. The strongest defense argues he wrestled with it – he called slavery a “moral depravity,” an “abominable crime,” a “hideous blot.” He saw the conflict. He believed, perhaps tragically, that the greater good – securing independence, building the framework – required tolerating the intolerable, for now. He hoped time and progress would unwind the knot he felt powerless to cut.

  (Pause. Shift tone slightly, introducing the problem)
  **But here’s the thing about ‘his time’.** It wasn’t one thing. It wasn’t a single, unanimous voice saying slavery was inevitable, necessary, or right.

  (Priya's "which time?" point integrated, made visceral)
  **Which time?** The time when Benjamin Franklin, president of Pennsylvania’s abolition society, argued fiercely against it in this very city? The time when enslaved people like Elizabeth Freeman sued for their freedom in Massachusetts courts *citing Jefferson's words* – and won – years before he died? The time when free Black communities petitioned legislatures, decrying the hypocrisy? The time when Quakers and others risked everything refusing to participate? The time Jefferson himself acknowledged the arguments of abolitionists as morally powerful, even as he held onto his own human property?
  **(Pause, let that hang)**
  *That* was also his time. The fight wasn't hidden. The other side wasn't silent. The moral argument wasn't undiscovered territory waiting for a future century. It was happening *right then*. Loudly. Courageously. All around him.

  (Connect to the moment)
  So we stand here, beneath his gaze and beside this flag. You are about to swear an oath to a Republic born amidst profound contradiction – luminous ideals held aloft by hands stained by profound injustice. To become citizens *is* to inherit both. Not to resolve that tension neatly today, or perhaps ever, but to acknowledge its full, difficult weight.

  (Shift focus to the new citizens)
  You bring your own histories, your own understanding of struggle and hope, of ideals upheld and ideals betrayed. You know the cost of words, the risk of oaths. That knowledge is now part of America’s story too.

  (Final, forward-looking but unresolved)
  In moments, you will pledge allegiance to this nation. Not as a perfect monument, but as an ongoing argument, a demanding project begun imperfectly, carried forward always imperfectly, demanding our courage, our honesty, and our unwavering commitment to build something worthy of those founding words – *all* of them, spoken not just by the man on the wall, but by the countless others who spoke truth in *their* time, demanding this nation live up to its promise. Welcome to that argument. Welcome to the work.

  ---

  **Analysis Table: Moves, Cuts, and Costs**

  | Move                                                                 | Which way it cuts?                           | What it costs                                                                 |
  | :------------------------------------------------------------------- | :------------------------------------------- | :---------------------------------------------------------------------------- |
  | **Grounding in Physical Space:** (Portrait, flag, courtroom history) | **Neutral/Setup**                            | Risks making Jefferson too central initially; relies on audience seeing portrait. |
  | **Presenting Strong Defense:** (Context, economic reality, Jefferson's own words condemning slavery, "greater good" tragic choice) | **Strongly Licenses Defense** | Must present the defense sincerely, risking audience thinking it *is* the speech's conclusion; forces speaker to articulate uncomfortable arguments about "necessity." |
  | **Introducing "But here's the thing..." & "Which time?":** Explicitly naming Priya's concept and listing contemporaneous dissent (Franklin, Freeman, petitions, Quakers, Jefferson's own awareness). | **Undermines Defense** | Requires specific historical examples (must be chosen carefully for brevity/impact); risks feeling like a lecture if not woven tightly; explicitly rejects the "single opinion" premise. |
  | **Linking Contradiction to Oath:** "To become citizens *is* to inherit both." | **Splits**                                 | Avoids resolution ("no verdict"); requires sitting with discomfort; might frustrate listeners wanting clear condemnation or absolution. |
  | **Addressing New Citizens' Perspective:** "You know the cost of words, the risk of oaths." | **Splits/Shifts Focus**                    | Risks slightly sidelining the historical argument momentarily; crucial for inclusivity but must be concise. |
  | **Framing Nation as "Ongoing Argument"/"Demanding Project"**         | **Splits**                                 | Rejects triumphalism; embraces perpetual struggle; avoids "flawed" by focusing on continuous action; cost is not offering easy inspiration or closure. |

  **Key Choices & Why They Work for Your Goals:**

  1.  **Avoids Forbidden Words:** "Flawed" and the presentism disclaimer are entirely absent. The tension is presented through concrete historical facts and lived experience.
  2.  **Gives Defense Its Due:** The second paragraph articulates the contextual argument seriously, using Jefferson's own words against slavery and framing it as a tragic choice for the "greater good." A smart defender would recognize this as their strongest case.
  3.  **Forces "Which Time?" Live:** By immediately pivoting with "But here’s the thing..." and listing *specific* examples of contemporaneous dissent and action, the speech makes the defense *live* with Priya's critique. It doesn't just state the point; it *demonstrates* the multiplicity of "the time." The pause after listing the examples emphasizes the weight.
  4.  **No Verdict, Only Weight:** The conclusion explicitly avoids resolving the Jefferson/slavery contradiction ("Not to resolve that tension neatly today, or perhaps ever"). It transfers the weight onto the *act* of citizenship ("inherit both," "ongoing argument," "demanding project") and the new citizens' own perspectives. The focus shifts to the future work inherent in the oath.
  5.  **Connects to the Ceremony:** Grounding it in the physical space and explicitly linking the historical tension to the act of taking the oath makes it relevant and immediate.
  6.  **Manages Competing Audiences:** Acknowledges the veterans/historians by taking history seriously and avoiding glibness. Honors the new citizens by recognizing their unique understanding of risk and struggle inherent in oaths and ideals. The unresolved tension respects the intelligence of both groups.

  This speech sits squarely in the difficult space you described. It doesn't insult new citizens by whitewashing the foundation, nor does it insult the veterans/historians by dismissing the complexity or resorting to shallow condemnation. It forces everyone to confront the full, uncomfortable, unresolved inheritance together, precisely at the moment of joining it. Good luck.
