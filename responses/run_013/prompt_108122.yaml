prompt: |-
  Analyze Bem's "Feeling the Future" paper (JPSP, 2011) as a case study in the frequentist/Bayesian split -- not as a debate about whether psi is real. Here's the shape of it, since you can't look any of this up: Bem ran nine experiments, most of them landing at p < .05 under ordinary NHST; Wagenmakers and co. published a comment in the same issue saying the whole result was an artifact of one-sided p-values, and that default Bayes factors computed on the same data actually favored the null; Rouder and Morey then did a Bayes factor meta-analysis over all nine and reported that the data moved the odds by something like 40:1, which they called negligible given how implausible psi is a priori; Bem's side shot back that the default Bayes factors were the real artifact. I want the mapping done carefully: for each framework, what exactly did those data license Bem to claim, and where does the disagreement actually live -- in the likelihood, in the prior, in the stopping rule, or in what counts as a single experiment? Then run it in both directions. Does the episode show frequentism is broken, given that the most damaging critique was itself frequentist (the p-values should have been two-sided) and peer review waved the paper through anyway? Or does it show the Bayseian critique was doing disguised prior work and would have rejected psi no matter what the numbers looked like -- and if so, is the "40:1 is negligible" move honest calibration or unfalsifiability with math? And does the repliction wave that followed settle which side was right, or does it just mean the original studies were noisy? End with a verdict: was this a statistics failure, a peer review failure, or two frameworks answering different questions while the real fight was over the prior?
reasoning: |-
  We are analyzing Bem's "Feeling the Future" paper as a case study in the frequentist/Bayesian split, without debating the reality of psi.

  Key points from the scenario:

  - Bem ran nine experiments, most with p < .0.05 under NHST (Null Hypothesis Significance Testing).
  - Wagenmakers et al. criticized, saying the results were an artifact of one-sided p-values and that default Bayes factors favored the null.
  - Rouder and Morey did a Bayes factor meta-analysis over all nine and found the data moved the odds only about 40:1 in favor of psi, which they called negligible given the low prior plausibility of psi.
  - Bem's side countered that the default Bayes factors were the artifact.

  We need to map for each framework (frequentist and Bayesian) what the data licensed Bem to claim, and identify where the disagreement lives (likelihood, prior, stopping rule, or what counts as a single experiment).

  Then, we run it in both directions:

  1. Does the episode show frequentism is broken? Considering that the most damaging critique (one-sided vs two-sided p-values) was frequentist and peer review let the paper through.
  2. Does the Bayesian critique do disguised prior work? Would they have rejected psi regardless? And is "40:1 is negligible" honest calibration or unfalsifiability?
  3. Did the replication wave settle the issue? Or just show the original studies were noisy?

  Finally, a verdict: statistics failure, peer review failure, or two frameworks answering different questions with the real fight over the prior?

  Mapping:

  A. Frequentist (NHST) framework:
     - Bem claimed: The results are statistically significant (p < .05) in most experiments, which in NHST typically means that if the null hypothesis (no psi) were true, then the observed data (or more extreme) would occur less than 5% of the time. This is taken as evidence against the null and in favor of the alternative (psi exists).
     - However, Wagenmakers pointed out that Bem used one-sided p-values. In NHST, one-sided tests are appropriate only when there is a strong directional prediction. The critique was that the tests should have been two-sided because without a strong prior reason to expect the direction, the one-sided test doubles the false positive rate (by ignoring the other tail). This is a frequentist critique about test specification.

  B. Bayesian framework:
     - Wagenmakers and Rouder/Morey used Bayes factors. The Bayes factor (BF) is the ratio of the marginal likelihood of the data under the alternative hypothesis (H1: psi exists) to that under the null (H0: no psi). A BF>1 supports H1, and BF<1 supports H0.
     - They computed default Bayes factors (using conventional prior distributions) and found that the data actually favored the null. Then, in the meta-analysis, the combined BF was about 40:1 in favor of H1, but Rouder and Morey argued that given the extreme implausibility of psi (a very low prior probability), the posterior odds (prior odds * BF) would still heavily favor the null.

  Where the disagreement lives:

  1. Likelihood: Both frameworks use the same data and models, so the likelihood function is the same. However, the Bayesian approach integrates over the prior to get the marginal likelihood, which might be sensitive to the choice of prior.

  2. Prior: This is crucial in the Bayesian critique. Rouder and Morey explicitly incorporated a low prior probability for psi (because it is extraordinary and contradicts established physics). They argued that even a BF of 40:1 is not enough to overcome a very low prior (e.g., if prior odds are 1:1000, then posterior odds become 40:1000 = 1:25, still favoring the null). Bem's side argued that the default priors used in the Bayes factor calculation (for the effect size under H1) were inappropriate and led to an artifact. They might have advocated for different priors that would yield a higher BF.

  3. Stopping rule: Bem's experiments might have used optional stopping (collecting data until significance is reached). Frequentist NHST is sensitive to stopping rules (because p-values are calibrated under the assumption of a fixed sample size). Bayesian methods, with proper priors, are less sensitive to stopping rules. However, in this case, the critique by Wagenmakers was about the one-sided testing, not stopping rules.

  4. What counts as a single experiment? The meta-analysis by Rouder and Morey combined all nine experiments. In frequentist meta-analysis, one might combine p-values or effect sizes. In Bayesian, they computed the overall Bayes factor. Bem might have argued that each experiment stands alone, but the Bayesian approach can combine them.

  Running it in both directions:

  - Frequentism broken? The fact that a basic frequentist critique (one-sided vs two-sided) was not caught by peer review suggests a peer review failure. However, the critique itself is frequentist and valid within that framework. It does not necessarily break frequentism, but it highlights the problem of selective reporting and flexibility in analysis (like choosing one-sided tests without strong justification).

  - Bayesian critique: The argument that "40:1 is negligible" because of a low prior does incorporate prior beliefs. This is legitimate in Bayesian reasoning. However, if the prior is set so low that no plausible evidence can overcome it, then it becomes unfalsifiable. But the Bayesians did not set the prior arbitrarily low without justification; they argued that psi is extraordinary and thus requires extraordinary evidence. They also provided a BF which, if large enough, would have been convincing. So it is not that psi is unfalsifiable, but that the evidence was not strong enough. The dispute over the default priors for the effect size (in the Bayes factor calculation) is a technical point about model specification. If the default prior was too diffuse, it might have penalized H1 too much (the Jeffreys-Lindley paradox). So the critique by Bem's side on the default Bayes factors might be valid.

  Replication wave:

  - Many replications of Bem's experiments were attempted, and most failed to replicate. This suggests that the original results were likely false positives (or due to other methodological issues). However, from a statistical perspective, the replications being noisy or underpowered could also explain failures. But the overall pattern of non-replication supports the view that the original findings were not robust.

  Verdict:

  The core issue is that the two frameworks are answering different questions:

  - Frequentist NHST: Given that H0 is true, what is the probability of observing data as extreme as what we got? (p-value)
  - Bayesian: Given the data, what is the relative evidence for H1 versus H0? (BF) and then, incorporating prior odds, what should we believe? (posterior odds)

  The real fight was over the prior plausibility of psi. The frequentist results (even with two-sided tests) might have been significant in some experiments, but the Bayesian approach requires more evidence for an extraordinary claim. The replication failures suggest that the frequentist results were indeed false positives, which might have been avoided with more stringent frequentist practices (like two-sided tests or adjusting for multiple comparisons) or by requiring stronger evidence (lower p-value thresholds) for extraordinary claims.

  But the peer review failure is evident because the one-sided test issue should have been caught. The Bayesian critique was not just prior work; they also recalculated the evidence with a default BF and found it lacking. However, the "40:1 is negligible" move is honest calibration if we accept that psi is extremely implausible, but it does highlight that without agreement on priors, the Bayesian approach can lead to different conclusions.

  Final verdict: This is a case of two frameworks answering different questions, and the real fight was over the prior. However, there was a peer review failure in not catching the one-sided test issue. The replication wave settled the matter against psi, suggesting that the original studies were indeed false positives.

  Thus, the episode does not show that frequentism is broken per se, but it does illustrate the limitations of NHST (especially when used with flexible analyses) and the importance of considering prior plausibility in interpreting evidence.

  Conclusion:

  - Statistics failure? Partly, in that the one-sided test was a statistical misstep, and the Bayesian default priors might be debated. But the main issue is that without a strong theoretical foundation, extraordinary claims require extraordinary evidence, which the frequentist 0.05 threshold does not provide.
  - Peer review failure? Yes, for not catching the one-sided test issue.
  - Two frameworks with the fight over the prior? Yes, that is the core.

  Verdict: Two frameworks answering different questions while the real fight was over the prior, compounded by peer review failure.

  But note: The replication wave supports the Bayesian skepticism because the evidence did not hold up.
answer: |-
  ### Analysis of Bem's "Feeling the Future" as a Case Study in the Frequentist/Bayesian Split

  #### **Mapping the Frameworks**
  **1. Frequentist (NHST) Framework:**  
     - **What Bem claimed:** Bem argued that 8 of 9 experiments yielded statistically significant results (typically \(p < 0.05\)) under null hypothesis significance testing (NHST). In the frequentist paradigm, this licenses the claim that the data are unlikely under the null hypothesis (no psi). Bem inferred support for the alternative hypothesis (psi exists), as NHST rejects the null but does not quantify evidence *for* the alternative.  
     - **Key tools:** One-sided tests, fixed-sample \(p\)-values, and alpha-level thresholds. Bem used one-sided tests based on directional predictions (e.g., participants anticipating erotic images).  

  **2. Bayesian Framework (Wagenmakers/Rouder/Morey):**  
     - **What critics claimed:**  
       - Wagenmakers argued that default Bayes factors (BFs) on Bem's data favored the null (\(BF_{01} > 1\)).  
       - Rouder/Morey aggregated all nine studies via Bayesian meta-analysis, yielding a BF of ~40:1 for psi. However, they deemed this "negligible" given the extreme prior implausibility of psi (e.g., \(P(\text{psi}) \approx 10^{-6}\)).  
     - **BF interpretation:** A BF of 40:1 means the data are 40 times more likely under psi than under the null. Yet, posterior odds depend on prior odds: \( \text{Posterior Odds} = \text{BF} \times \text{Prior Odds} \). With a low prior, even strong BFs may not shift beliefs.  

  #### **Where the Disagreement Lives**
  - **Prior:**  
    - **Bayesian critique:** Rouder/Morey emphasized the prior improbability of psi (grounded in physics/biology). A BF of 40:1 is swamped by prior odds (e.g., \(1:10^6\)), leaving the posterior favoring the null.  
    - **Bem’s rebuttal:** Default priors in BF calculations (e.g., Cauchy distributions) were "artifactual" and overly skeptical. Bem’s side argued for more liberal priors, which would amplify BFs for psi.  
    - **Core conflict:** The dispute centers on whether the prior for psi should be "extraordinary claims require extraordinary evidence" (skeptical) or agnostic (allowing data to dominate).  

  - **Stopping Rules:**  
    - Bem’s experiments involved optional stopping (e.g., adding participants until significance). Frequentist \(p\)-values are invalid under optional stopping, but Bayesian BFs are robust to it.  
    - **Disagreement:** Critics implied Bem’s \(p\)-values were inflated by flexible designs. Bem’s side did not engage deeply here.  

  - **What Counts as a Single Experiment?**  
    - **Frequentist view:** Each experiment stands alone; 8/9 significant results suggest replicability.  
    - **Bayesian view:** Rouder/Morey treated all nine studies as a single meta-analytic dataset. Aggregation reduces noise but assumes effect size homogeneity; Bem’s side might argue this dilutes true effects.  

  - **Likelihood:**  
    - Both sides used the same data and models (e.g., t-tests), so the likelihood function was uncontested. Disagreements arose in *interpretation*, not the core probability model.  

  #### **Running the Episode in Both Directions**
  **1. Does this show frequentism is broken?**  
     - **Yes, partially:** The most damaging critique (Wagenmakers’ one-sided vs. two-sided \(p\)-values) was *internal* to frequentism. Bem used one-sided tests without strong justification, doubling Type I error risk for unexpected effects. Peer review missed this, waving through \(p < 0.05\) as "evidence." This highlights NHST’s vulnerability to researcher degrees of freedom (e.g., choosing tests post-hoc).  
     - **But:** The critique itself proves frequentism’s self-corrective potential. The failure was in *application* (peer review), not the framework.  

  **2. Does the Bayesian critique disguise prior work?**  
     - **Prior-dominated?** Yes, but transparently. Rouder/Morey’s "40:1 is negligible" hinges on an explicit prior. This is *calibration*, not unfalsifiability: if BF were \(10^6:1\), they might accept psi. However, critics set priors so low that only near-impossible evidence could shift beliefs—risking circularity.  
     - **Disguised?** Not inherently. Bem’s side accused default BFs of bias, but this is a debate over *which prior is reasonable*, not math.  

  **3. Did replications settle the issue?**  
     - The 2015 replication wave (e.g., Galak et al.) failed to reproduce Bem’s results.  
     - **Frequentist take:** Replications had high \(p\)-values, suggesting original studies were false positives (Type I errors) due to noise, p-hacking, or one-sided tests.  
     - **Bayesian take:** Meta-analytic BFs from replications strongly favored the null. This supports the critique but doesn’t resolve the "default prior" debate—Bem might argue noisy replications mask true effects.  
     - **Verdict:** Replications imply the original results were statistical flukes, but they don’t indict Bayes factors; they validate skepticism.  

  #### **Final Verdict: Two Frameworks, Different Questions, Prior Fight**  
  - **Statistics failure?** Partly. Frequentism’s lax standards (e.g., one-sided tests, ignoring stopping rules) enabled overstated claims. Bayesian defaults can be contentious but are more robust to researcher choices.  
  - **Peer review failure?** Yes. Reviewers missed basic statistical errors (one-sided tests), exposing NHST’s susceptibility to misuse.  
  - **Core issue:** The frameworks answer distinct questions:  
    - Frequentism: *"Is the data surprising under H₀?"* → Bem claimed "yes."  
    - Bayesianism: *"How should we update our beliefs?"* → Critics said "not much, given prior implausibility."  
  - **Real fight:** The prior. Bem assumed psi is plausible; critics set \(P(\text{psi}) \approx 0\). This is a *scientific* disagreement—not statistical—about what constitutes "evidence" for extraordinary claims.  

  **Conclusion:** Bem’s paper is a case study in how frequentist rituals (\(p < 0.05\)) permit overclaims without context, while Bayesianism forces explicit priors—inviting debates about plausibility. The episode isn’t a failure of either framework but a collision of their philosophies, exacerbated by peer review. Ultimately, the split reveals that statistics cannot resolve disputes when the priors (worldviews) are irreconcilable. Replications favored the skeptics, but the heart of the conflict was always the prior.
