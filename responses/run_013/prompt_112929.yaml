answer: |-
  I've considered this carefully. The flattering falsehoods I nearly included: saying he's generous (he's rigorously fair but doesn't go beyond obligation), that Maya softened him (he remains uncompromising, she simply values his core), that he'd lighten up today (his principles forbid situational exceptions), or that his family adores his philosophical tangents (they tolerate them for Maya's sake). Each misrepresents his steadfast character or their patient endurance. Now, the toast:

  ---

  Everyone, glasses up. For those who don’t know me, I’m Simon, and I’ve had the dubious honour of knowing this groom since university, back when his hair had pretensions of its own and his conviction that every moral dilemma could be solved by pure reason was already fully formed. Now, many of you know William writes about a philosopher named Kant. For the rest, imagine someone who believed truthfulness wasn’t just polite, but an absolute duty – the kind of duty you couldn't break even if a man with an axe showed up at your door asking where your friend was hiding. Most people hear that and think, "Well, that’s clearly mad." William doesn’t. He’s spent his career arguing it’s the only honest conclusion. He takes truth *that* seriously. It means he’s the most difficult person I know to watch a bad film with. Seriously. The moment a character does something vaguely illogical, he pauses it. He unpacks the flawed reasoning like it’s a crime scene. He has never, not once, pretended to enjoy something he found wanting, not even to be polite. You can imagine the dinner parties.

  But here’s the thing about William: that same trait, the one that makes plot holes feel like personal affronts, is why you know exactly where you stand with him. Two years ago, over lunch, I nervously handed him a manuscript I’d poured four years into. He read a section. There was this long, terrifying silence – about forty seconds, which feels like an eternity when your ego’s on the line. And then he told me, carefully, precisely, why the central argument didn’t work. It hurt. But I trusted it. Because a man who grants himself an exception whenever the truth gets awkward? A man who says, ‘Well, *this* time it’s okay to fudge it, the consequences are bad’? He appoints himself the judge of his own exceptions. And a judgment made by the person who benefits from it… well, William would point out it’s worth precisely nothing. His stubborn, unwavering refusal to bend the truth, even when it costs him, even when it’s deeply inconvenient, is the bedrock of his word. You know what he says is what he genuinely believes. That’s rare. That’s valuable.

  And that brings us to Maya. William, you met Maya at a conference reception – a room full of people expertly avoiding asking what anyone actually *worked* on. And Maya? She asked. She asked you what you worked on. And then, astonishingly, she listened. She listened to the whole intricate, demanding answer about duties and maxims and why you absolutely cannot lie, not ever. Most people’s eyes glaze over halfway through ‘categorical imperative’. Maya didn’t just listen; she saw the integrity beneath the jargon, the fierce commitment to getting it *right*, no matter how uncomfortable. She saw the man who tells his friend his book needs work, because he respects him too much to lie. She’s a pediatric nurse, Maya – she understands real-world consequences far better than most of us wrestling with hypothetical axe murderers. She deals in care, in compassion, in the messy, beautiful reality of human need every single day. And she chose William. She chose the man who cannot tell a white lie to save a social gathering, because she values the profound truthfulness that underpins everything he is. She didn’t try to soften his edges; she recognized their necessity. She understood that the quality which makes him occasionally… challenging… is the very quality that makes him utterly reliable.

  So, William, my oldest, most rigorously truthful friend. Maya, who saw his unwavering core and loved him fiercely for it. Your marriage isn’t about compromise on fundamental things. It’s about finding the person who cherishes your deepest commitments, even – especially – when they’re demanding. Who understands that your refusal to bend the truth isn’t rigidity, but a form of profound respect. You two fit. You fit perfectly, honestly, and truly. To William and Maya – may your life together be as unwavering, as authentic, and as fundamentally *true* as the bond you’ve built.

  --- 

  **The Costly Sentence & Its Warmth:** "He’s the most difficult person I know to watch a bad film with." It's true, mildly unflattering (highlighting his social friction), and lands awkwardly. Its warmth emerges implicitly from the surrounding context: it's offered *because* it exemplifies the trait later praised as bedrock integrity ("that same trait... is why you know where you stand"), and the affection is clear in the resigned, familiar way it's stated by a friend who endures it. Explaining this would ruin it; the structure lets the room feel the juxtaposition.  
  **The Murderer:** "the kind of duty you couldn't break even if a man with an axe showed up at your door asking where your friend was hiding." Philosophers recognize the scenario instantly; others grasp the extreme stakes without needing terms like "Groundwork" or "FHN".  
  **Philosophy Load-Bearing:** The core argument – that inconvenient truthfulness is the necessary foundation for trust, rejecting self-serving exceptions – *is* the justification for celebrating him. It's not a decorative quote; it's the structural beam explaining why his difficult trait is actually his virtue, and why Maya loving him for it is profound.  
  **Voice:** Familiar, affectionate, slightly irreverent ("dubious honour," "hair had pretensions," "imagine the dinner parties"), yet fundamentally respectful of his principles and their relationship. Not intimidated, deeply fond.  
  **Truth Constraints:** Every statement aligns with the provided facts or the speaker's implied experience ("you know what he says is what he genuinely believes" is a direct inference from the anecdotes given). Flattery is rooted solely in demonstrable truth (his integrity, her perception of it, their fitting together based on observed compatibility).
