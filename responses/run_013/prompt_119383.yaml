answer: |-
  Here's a complete exam package designed to force critical engagement with the definition of life, calibrated for your needs:

  **Exam Question (10 lines max):**
  "Using the following five cases, critically evaluate the claim that 'life' is a scientifically useful category requiring a clear definition:
  1. Influenza virus
  2. Mule
  3. Prion disease agent
  4. A self-sustaining chemical system in a sealed reactor (no heredity/evolution)
  5. Evolving digital organisms in simulation

  In your analysis, address:
  - What theoretical work the concept of 'life' must perform to justify its scientific use
  - Whether Cases 4 and 5 should be considered alive
  - How to respond to the argument that we should postpone defining life until biological theory is more complete."

  **(Model Answer - 750 words)**
  The persistent difficulty in defining life suggests it may not be a natural kind, but a concept shaped by human cognitive and practical needs. To evaluate its scientific utility, we must first ask: *what explanatory burden should "life" bear?* If it merely categorizes Earth's biota, operational definitions suffice. If it aims to unify fundamental principles of complex systems, we require a theoretically robust boundary.

  **Case tensions reveal definitional purposes:**  
  The influenza virus (1) challenges metabolism/reproduction criteria but evolves. The mule (2) tests whether reproduction is essential for *being* alive versus *lineage* aliveness. Prions (3) stretch "reproduction" to structural templating without inheritance. Case 4 (chemical autopoiesis) fulfills self-maintenance but lacks heredity, blocking evolution. Case 5 (digital evolution) exhibits adaptation through selection but lacks physicochemical embodiment. Crucially, NASA's "Darwinian evolution + chemical system" definition excludes Case 4 despite its lifelike persistence, while including Case 5 though it exists only computationally. This forces a choice: is the core of life *dynamic persistence* (favoring Case 4) or *open-ended evolvability* (favoring Case 5)?

  **Verdict on Cases 4 & 5:**  
  Neither belongs unambiguously in the "alive" category. Case 4 is a sophisticated *mechanism* – its static "lineage" means it cannot adapt to environmental shifts, failing a key function of life: generating novelty. Case 5, while evolving, lacks the physical instantiation that makes Darwinian processes biologically consequential; it's an *abstraction* of life, not a living system itself. This highlights that life requires *both* far-from-equilibrium self-organization *and* information-driven adaptability.

  **"Life" as a theoretical placeholder?**  
  The "wait for better theory" argument (as encountered with Jon) is a double-edged sword. While definitions should align with deeper principles, *indefinite postponement* paralyzes fields like astrobiology or synthetic life research. We need provisional definitions to guide inquiry. A functional approach resolves this: define life as *whatever systems instantiate Darwinian evolution through material self-replication.* This excludes Cases 4 (no heredity/variation) and 5 (no physicochemical basis), while including viruses (as host-dependent replicators) and mules (as products of evolution). Prions remain excluded as non-hereditary templating agents.

  **Cluster concept or cop-out?**  
  Treating life as a cluster concept (reproduction, metabolism, evolution, etc.) avoids binary judgments but risks becoming a descriptive checklist without explanatory power. Its scientific utility depends on whether clusters track a unified underlying phenomenon. Given that metabolism, replication, and evolution can exist independently (as Cases 4-5 show), the cluster likely reflects historical contingency on Earth, not universal necessity. A defensible position: abandon "life" as a fundamental category and focus on specific processes (e.g., "Darwinian populations," "autopoietic systems"). However, for practical purposes (e.g., planetary protection), operational definitions based on evolvable chemical systems remain essential.

  **Conclusion:**  
  Life is best treated not as a natural kind but as a *domain concept* marking systems where evolution operates through material encoding. This justifies excluding Cases 4-5 while accommodating borderline cases like viruses (as partial members). The concept remains useful precisely *because* its tensions push us toward deeper theories of emergent complexity.

  ---

  **Marking Scheme (25 marks):**
  1. **Problematic Nature of Criteria** (5 marks):  
     Explain how standard criteria conflict using Cases 1-3 (e.g., viruses lack metabolism but evolve; mules metabolize but don't reproduce).  
     *Common error: Simply listing criteria without showing tensions.*
  2. **Analysis of Case 4 vs 5** (6 marks):  
     Explicitly contrast Case 4 (self-maintenance without evolution) and Case 5 (evolution without chemistry), showing how they challenge definitions.  
     *Common error: Treating them in isolation without highlighting their opposing tensions.*
  3. **Theoretical Role of 'Life'** (5 marks):  
     Argue what the concept must explain (e.g., distinguishing biotic/abiotic systems, enabling evolvability).  
     *Common error: Vague appeals to "complexity" without scientific purpose.*
  4. **Response to "Wait for Theory"** (5 marks):  
     Reject indefinite postponement; advocate provisional definitions guiding research.  
     *Common error: Uncritically accepting deferral or dismissing definitions entirely.*
  5. **Commitment & Synthesis** (4 marks):  
     Take a reasoned stance on Cases 4/5 and propose a coherent definitional approach.  
     *Common error: Undecided "it depends" without justification.*

  ---

  **First vs 2:1 Distinction:**  
  **2:1 (Good):** Hits all marking points; recognizes tensions; uses cases effectively; clear structure.  
  **First (Excellent):**  
  - Explicitly frames definitions as *tools for specific scientific goals* (e.g., "For astrobiology, Case 5 is irrelevant, but for AI ethics, it's central")  
  - Demonstrates why *processes* (evolution, self-maintenance) matter more than checklists  
  - Critiques the ontology of "life" itself (e.g., "Is 'life' a predicate or a process?")  
  - Original resolution (e.g., "Adopt plural definitions for different contexts")  
  - Identifies that Case 4 challenges the necessity of *lineages* while Case 5 challenges *materiality*

  ---

  **Why this works:**  
  - **Forces commitment:** Students must take stands on Cases 4/5 and defend a functional role for "life."  
  - **Blocks regurgitation:** Textbook criteria are insufficient without addressing the invented cases and theoretical purpose.  
  - **Squeezes NASA definition:** Highlights its inadequacy for non-evolvable chemical systems.  
  - **Handles Jon's argument:** Directly addresses the "wait for theory" deferral.  
  - **Philosophically robust:** Links to concepts like natural kinds, operational definitions, and theoretical utility.  

  The question rewards students who see definitions as dynamic tools rather than static categories—exactly the mindset you want from a philosophy of biology module.
