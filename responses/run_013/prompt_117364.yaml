prompt: |-
  I run the certification unit at a state natural resources agency. The legislature created a conservation tax credit for owners of what the statute calls legacy forest, and left the term undefined, so the definition is ours. Our current rule certifies a parcel when it meets three criteria: a structural complexity score computed from a standard plot survey, the age of the dominant tree cohort, and a documented history of no commercial harvest since a stated date. Every one of those criteria is continuous and noisy. Plot scores drift, cohort ages carry error bars, harvest histories are reconstructed from old aerial photographs and from what owners tell us, and the parcels themselves grade into one another across a landscape that has been selectively logged for a century. We process a few hundred parcels a year, have certified roughly nine hundred and denied about twelve hundred, and our denial letters now cite one another in ways that do not add up. Two owners have appealed on the ground that a parcel nearly identical to a certified one was denied. My reviewers are forestry technicians with no philosophical training and about forty minutes per parcel; any departure from the procedure needs my signature; and the statute is not going to change.

  I want a decision procedure my unit can run on every parcel, grounded in the philosophy of vagueness — the sorites paradox and what is actually established about how vague predicates behave. Please write it as an ordered set of steps: the questions to ask in sequence, what counts as a sufficient answer to each, where the procedure stops with a no, and where it hands the matter to a person because the question is not one of fact. No names or reading lists; I want the machinery.

  Specifically:

  - The procedure has to separate three things we currently conflate: clearly in, clearly out, and genuinely unsettled. Within the third, it has to separate cases that more evidence would settle, where the trouble is our ignorance, from cases that no further evidence would settle, where the trouble is the term itself. Those two must be routed differently, and the test that distinguishes them has to be something a technician can apply in the field.
  - It has to say what happens when criteria conflict, as when complexity is low but the cohort is very old and the harvest history is clean. Decide whether any criterion is a veto or whether trade-offs are allowed, and defend the choice.
  - It has to handle chains: one parcel that differs from a certified parcel by a single increment, and a certified parcel whose management plan will shave a little off its complexity every year for thirty years. No single increment should be dispositive, but cumulative change has to be catchable, and I want you to show me where the sorites hazard hides in whatever cumulative rule you give me.
  - It has to survive an appeal. That means it must not pretend the line we draw was discovered in the landscape rather than chosen by us. Give me the honest version, tell me exactly where we are choosing rather than measuring, and give me language for denial letters that states what the line is, why it sits where it sits, and why this parcel falls on the far side of it.
  - Whatever borderline band you build will itself have vague edges. Say how the procedure avoids an infinite regress there, and whether the band should function as a verdict or only as a routing device.
  - Tell me what to do with the cases that still cannot be settled, so that the outcome is something other than a coin flip.

  Then run the procedure on three parcels: one that is clearly in under our rule but ecologically mediocre, one where the evidence is complete and the criteria genuinely disagree, and one that is certified today and will fall below the line in about fifteen years under its current management plan. At least one of these must come out in a way I will not like; say which one and why. Close by stating what the procedure cannot do, which of its steps are judgment calls dressed up as procedure, and where a reviewer could game it.

  Write in American English.
reasoning: |-
  Okay, the user runs a certification unit for a state natural resources agency dealing with a conservation tax credit for "legacy forest." The term isn't defined by the legislature, so their unit has to define it via rules. They currently use three criteria: structural complexity score from plot surveys, age of dominant tree cohort, and documented history of no commercial harvest since a specific date. Each criterion is continuous and noisy—plot scores drift, ages have error bars, harvest histories are reconstructed from old photos and owner statements. Parcels blend into each other across landscapes that have been selectively logged for a century. They've processed hundreds of parcels, certified about 900, denied 1200, and now denial letters are citing each other inconsistently. Two appeals have been filed because similar parcels were treated differently. Reviewers are forestry technicians with no philosophical training and limited time per parcel (about 40 minutes). Any departure from procedure requires the user's signature, and the statute isn't changing.

  The user wants a decision procedure grounded in the philosophy of vagueness—specifically addressing the sorites paradox and how vague predicates behave. They need an ordered set of steps that separates clearly in, clearly out, and genuinely unsettled cases. Within unsettled, it must distinguish between cases solvable with more evidence and those that are inherently vague. The procedure must handle conflicting criteria, chains of parcels differing by small increments, survive appeals by being honest about where lines are drawn, avoid infinite regress with borderline bands, and provide a non-random outcome for truly unsettled cases.

  Key requirements include:

  1. **Separating Categories**: Clearly in, clearly out, genuinely unsettled (with subcategories: resolvable by evidence vs. inherently vague).
  2. **Handling Conflicts**: Decide if criteria are vetoes or allow trade-offs.
  3. **Managing Chains**: Address sorites hazards with cumulative changes.
  4. **Appeal Survival**: Be transparent that lines are chosen, not discovered.
  5. **Borderline Band**: Avoid infinite regress and define its function.
  6. **Unsettled Cases**: Provide a non-arbitrary resolution method.

  The user also wants the procedure tested on three parcels: one clearly in but ecologically mediocre, one with conflicting criteria, and one currently certified that will degrade in 15 years. At least one outcome should be unfavorable, and the limitations/gaming risks must be stated.

  Now, analyzing the user's deeper needs:
  - They're facing legal and operational challenges: inconsistent decisions leading to appeals, strained resources (technicians with limited time), and pressure to uphold credibility.
  - Unspoken needs include reducing appeal risks, ensuring procedural fairness, maintaining unit efficiency, and providing clear justifications for denials to avoid public backlash.
  - Philosophically, they need to operationalize vagueness theory into a practical, defensible system that acknowledges human judgment while minimizing arbitrariness.

  For the procedure design:
  - **Vagueness Foundation**: Use supervaluationism to define clear cases via precisifications. Borderline cases exist where precisifications disagree.
  - **Three-Way Split**: 
    - Clear Yes: All precisifications say yes.
    - Clear No: All precisifications say no.
    - Borderline: Precisifications disagree. Subdivide based on epistemic vs. ontic vagueness:
      - Epistemic: More evidence could resolve it (e.g., tighter age error bars).
      - Ontic: Inherently unresolvable (e.g., complexity score near threshold).
  - **Conflict Resolution**: Reject vetoes; use a scoring system (e.g., points) to allow trade-offs. This avoids paradoxical outcomes (e.g., old growth with slightly low complexity failing). Defend by noting natural categories often involve compensatory traits.
  - **Chain Handling**: Define a degradation buffer. Small, non-cumulative changes don't trigger review, but cumulative decline does. Sorites hazard lurks in buffer definition—address by making buffer width explicit and tied to measurement noise.
  - **Appeal Language**: Emphasize that "legacy forest" is a human construct. Denial letters should state: "Threshold X is set at Y because [ecological justification], your parcel scores Z which is below Y."
  - **Borderline Band**: Avoid regress by treating the band as a routing tool, not a verdict. Cases inside it get escalated; the band itself has sharp but arbitrary edges based on operational limits.
  - **Unsettled Cases**: For ontically vague cases, use a weighted lottery (e.g., based on proximity to thresholds) to avoid coin flips while accepting indeterminacy.

  Testing on parcels:
  1. **Parcel A (Clearly In but Mediocre)**: Certify—it meets sharp thresholds, even if ecologically unimpressive. The user won't like this because it highlights threshold rigidity.
  2. **Parcel B (Conflicting Criteria)**: Borderline epistemic. Escalate for deeper review (e.g., more plots). Technicians flag it in 40 minutes via conflict checks.
  3. **Parcel C (Degrading in 15 Years)**: Certify with a degradation clause. Review triggers only if cumulative changes breach the buffer. User won't like the future liability but it's pragmatic.

  Limitations:
  - Point systems and buffers involve hidden judgments.
  - Technicians could game by tweaking measurements.
  - The procedure can't eliminate vagueness, only manage it transparently.

  This balances philosophy, practicality, and honesty—meeting the user's need for a robust, appeal-proof system.
answer: |-
  Here is a decision procedure grounded in vagueness philosophy (supervaluationism), designed for forestry technicians. It separates clear cases from borderline ones, handles conflicts and chains, avoids infinite regress, and provides auditable language. The procedure assumes:  
  - **Structural complexity score** (SCS) is measured on a 0–100 scale; current threshold = 70.  
  - **Dominant cohort age** (AGE) has a 15-year error margin; current threshold = 100 years.  
  - **Harvest history** (HIST) is binary: "clean" (no harvest since 1923) or "unclean."  
  - **Trade-offs** are allowed via a points system (see Step 4).  
  - **Borderline band** is defined as ±10% of thresholds (e.g., SCS 63–77).  

  ### Decision Procedure: Ordered Steps  
  **Tools needed:** Field tablet with SCS calculator, AGE error-margin tool, HIST verification checklist.  

  1. **HIST Verification (Binary Gatekeeper)**  
     - **Question:** Is HIST *clean* (no commercial harvest since 1923) with ≥90% confidence?  
     - **Sufficient answer:**  
       - **Yes:** If aerial photos + owner records + field evidence (e.g., stumps) show no harvest. Proceed to Step 2.  
       - **No:** If evidence gaps exist (e.g., photos missing for ≥20% of parcel) or harvest signs are found. Deny certification. **Stop.**  
     - **Why:** HIST is least vague. Unclean history disqualifies; ambiguity here is epistemic (fixable with evidence).  

  2. **Threshold Check (Clear Cases)**  
     - **Question:** Do SCS and AGE *both* exceed thresholds by ≥10%?  
       - Calculate: SCS > 77, AGE > 110 years (factoring error margin: midpoint age + 5 years ≥ 110).  
     - **Sufficient answer:**  
       - **Yes:** Certify. **Stop.**  
       - **No:** Proceed to Step 3.  

  3. **Borderline Band Test (Genuinely Unsettled)**  
     - **Question:** Is either SCS or AGE within ±10% of threshold?  
       - Calculate: SCS 63–77 or AGE 90–110 years (midpoint age ± 5 years within 90–110).  
     - **Sufficient answer:**  
       - **No (Outside band):** Proceed to Step 4 (trade-offs).  
       - **Yes (Inside band):** Proceed to Step 5 (epistemic vs. ontic vagueness).  

  4. **Trade-off Evaluation (Resolving Conflicts)**  
     - **Question:** Does the parcel earn ≥4 points?  
       - **Scoring (non-veto system):**  
         - SCS ≥ 70: 2 points | SCS 60–69: 1 point | SCS < 60: 0 points.  
         - AGE ≥ 100 (midpoint): 2 points | AGE 80–99: 1 point | AGE < 80: 0 points.  
       - *Trade-offs defend choice:* Nature isn’t binary. A low-SCS ancient stand may function ecologically like a high-SCS younger stand. Vetoes create sorites traps (e.g., one point of SCS denying a 300-year-old forest).  
     - **Sufficient answer:**  
       - **≥4 points:** Certify. **Stop.**  
       - **<4 points:** Deny. **Stop.**  

  5. **Epistemic vs. Ontic Vagueness Test (Routing Unsettled Cases)**  
     - **Question:** Could three additional measurements (e.g., more plots, tree cores) resolve ambiguity?  
       - **Epistemic (ignorance):** Uncertainty from sparse data (e.g., only one plot in a heterogeneous parcel).  
       - **Ontic (term vagueness):** Uncertainty persists even with perfect data (e.g., SCS=70 exactly).  
     - **Sufficient answer (technician checks):**  
       - **Epistemic:** Escalate to senior reviewer (evidence-gathering needed). **Stop.**  
       - **Ontic:** Proceed to Step 6 (non-arbitrary resolution).  

  6. **Weighted Lottery (Truly Unresolvable Cases)**  
     - **Action:** Assign certification probability based on proximity to thresholds.  
       - Calculate: Probability = (SCS_norm + AGE_norm)/2, where:  
         - SCS_norm = (SCS - 63) / (77 - 63) [capped at 0–100%].  
         - AGE_norm = (AGE_mid - 90) / (110 - 90) [capped at 0–100%].  
       - **Example:** SCS=70 (50%), AGE=100 (50%) → 50% chance.  
     - **Outcome:** Random selection via software (not coin flip). Technician records probability.  

  ### Handling Chains & Sorites Hazard  
  - **Single increment differences:** Ignored in certification decisions (e.g., Parcel A certified, Parcel B differing by one tree not denied).  
  - **Cumulative degradation:**  
    - **Buffer rule:** No re-audit unless SCS/AGE changes by >5% from baseline.  
    - **Management plans:** Flag parcels with projected SCS/AGE decline into borderline band within 20 years. Certification stands but requires review in 5 years.  
  - **Sorites hazard:** Hides in the buffer width (5%). A 30-year plan shaving 1%/year avoids review until year 25 (when decline hits 25%, exceeding 5%). This accepts sorites but contains it via fixed intervals.  

  ### Appeal-Surviving Language for Denials  
  > "Your parcel did not meet the criteria for 'legacy forest' certification. This term, established by [Agency], requires a combination of structural complexity, tree age, and harvest history. Thresholds (e.g., complexity score >70) are set based on regional ecological benchmarks [cite studies] to identify forests with significant conservation value. While your parcel has strengths [e.g., old age], its [low complexity/young age] places it below the required threshold. These lines are necessarily sharp to ensure consistent application; proximity to a certified parcel does not guarantee certification, as small differences can reflect large functional gaps."  

  ### Borderline Band Regress Avoidance  
  - The ±10% band has sharp edges (e.g., SCS=62.9 is outside, 63.0 is inside). This is a *routing device*, not a verdict—cases inside escalate. Regress is stopped by operationalizing "unsettled" at the edges: e.g., SCS=62.9 skips to trade-offs (Step 4), avoiding infinite bands.  

  ### Test Runs  
  **Parcel 1 (Clearly in but mediocre):**  
  - SCS=75, AGE=105y (error ±10y), HIST=clean.  
  - **Procedure:** Step 2 → Certify (clearly in).  
  - **Why you won’t like it:** Ecologically mediocre (e.g., low biodiversity), but meets sharp thresholds. Trade-offs (Step 4) weren’t triggered.  

  **Parcel 2 (Conflicting criteria):**  
  - SCS=65 (below threshold), AGE=115y (above), HIST=clean.  
  - **Procedure:** Step 2 (no) → Step 3 (SCS=65 in borderline band) → Step 5 (ontic vagueness: SCS=65 is inherently ambiguous) → Step 6: Probability = (SCS_norm=14% + AGE_norm=100%)/2 = 57% → weighted lottery.  
  - **Outcome:** Denied (if lottery result negative).  

  **Parcel 3 (Certified today, degrades in 15 years):**  
  - Current: SCS=72, AGE=95y. Management plan projects SCS=60 in 15y.  
  - **Procedure:** Step 2 → Certify (current SCS>77? No, but Step 3: AGE=95y in borderline → Step 4: Scores SCS=72→1pt + AGE=95y→1pt = 2pts (<4) → **Deny** immediately.  
  - **Why you won’t like it:** Current certification denied due to low trade-off score and borderline age, even though it would degrade later.  

  ### Limitations & Gaming Risks  
  - **Cannot do:**  
    - Eliminate vagueness; only make it explicit.  
    - Replace ecological judgment (e.g., thresholds are based on science but still chosen).  
  - **Judgment calls dressed as procedure:**  
    - Step 4 (point thresholds): 4 points is arbitrary; based on balancing false positives/negatives.  
    - Step 5 (epistemic/ontic): Technician’s "could measurements resolve?" is subjective.  
  - **Gaming by reviewers:**  
    - Over-/under-scoring SCS/AGE in Step 4.  
    - Misclassifying vagueness type in Step 5 to avoid escalation.  
  **Mitigation:** Audit 10% of parcels; require photo evidence for all scores.  

  This procedure makes vagueness operational, reduces arbitrariness in unsettled cases, and forces honesty about line-drawing—critical for appeals.
