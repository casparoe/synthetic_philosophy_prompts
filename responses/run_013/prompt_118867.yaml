prompt: |-
  Write a mock prospectus, roughly 650 words, from the client-services department of a long-established firm of actuarial consultants that sells survival insurance to sovereign polities. Invent the firm: a name, a founding date in the middle of the nineteenth century, a motto. It offers continuity endowments to states, dynasties, and hegemons, and prices every policy off a reference class of historical polities. The piece should be deadpan throughout: no winking, no narrator stepping outside the document, no admission that the exercise is absurd, and no real forecasters, historians, or scholarship named. The comedy must come from the method being applied correctly and then followed where it goes.

  Include, in this order:

  - an opening assurance to the prospective client, in the firm's voice, that the premium reflects the outside view rather than any estimate of the client's own prospects, and that the client's historians and strategists are welcome to attend the pricing meeting in an advisory capacity;
  - a rate table with three or four reference classes, invented but recognizable in kind — say confessional monarchies of the post-Napoleonic settlement, maritime trading republics, continental land empires, twentieth-century single-party states — showing how assignment to each class moves the premium, with additional columns for paid riders, among them an Exception Rider (the client asserts that its century is unlike the others) and a Decline Rider;
  - a section headed Frequently Raised Objections, in which the firm's replies concede more than the objections do;
  - a closing Notice to Clients in small-print register, containing two or three clauses whose interaction ensures the policy can never pay out.

  Three things should be got exactly right, since they are the real subject of the joke.

  First, the reference class is selected, not discovered. Class-Selection Advisory is available as a paid add-on; the same polity priced in two defensible classes yields two very different premiums; and the firm never says which class is correct, only which is most representative of the client's stated self-understanding.

  Second, selection effects. The firm holds no observations of polities that failed to come into existence, cannot underwrite polities that no longer exist, and prices from a book composed entirely of clients who were worried enough to buy insurance — worry being, the prospectus notes in passing, itself a symptom.

  Third, the Class of One. Somewhere in the table the firm offers a bespoke class containing only the client. Its historical survival rate is 100 percent and its premium is the lowest the firm offers; the prospectus is obliged to disclose this in a footnote, which also observes that the Class of One is the firm's most accurate product.

  Let the reductio do the work. A reader who knows reference-class forecasting, base rates, and survivorship bias should recognize the argument being made against the practice; a reader who does not should still find it funny and finish it slightly uneasy.
reasoning: |-
  Okay, the user wants me to write a mock prospectus for an actuarial firm that sells survival insurance to sovereign polities. This is clearly a satirical piece that needs to appear completely serious while highlighting the absurdity of reference-class forecasting methods.

  I need to create a fictional firm with these elements:
  - Name: Something Victorian and solid - perhaps "Charterhouse Assurance"
  - Founding date: Mid-19th century - 1857 sounds plausible
  - Motto: Needs to sound weighty - "Soli Deo Securitas" (Security for God Alone) has the right gravitas

  The prospectus must follow a strict structure:
  1. Opening assurance emphasizing the "outside view" and inviting client historians/strategists to pricing meetings
  2. Rate table with 3-4 reference classes (confessional monarchies, maritime republics, land empires, single-party states)
  3. Premium adjustments based on class selection
  4. Riders like Exception Rider and Decline Rider
  5. Frequently Raised Objections section where the firm concedes more than expected
  6. Small-print Notice with clauses preventing payout

  The key satirical elements I must nail:
  - Reference class is selected not discovered (with paid Class-Selection Advisory)
  - Selection effects (only existing polities in the book, all clients are "worried")
  - The "Class of One" with 100% survival rate and lowest premium

  I'll make the comedy emerge from the deadpan application of actuarial methods to state survival. The reader familiar with reference-class forecasting should recognize the critique of survivorship bias and base rate fallacies, while others should still find it unsettlingly funny.

  For the rate table, I'll invent classes that sound academically plausible but are clearly arbitrary. The premium differences between classes should highlight how outcomes depend entirely on classification. The Exception Rider premium will be humorously high since every client thinks they're exceptional.

  In the objections section, I'll have the firm concede major flaws while presenting them as features. For example, admitting that the book contains only "concerned clients" and that long-surviving states get lower premiums because they've already survived.

  The small print will include perfect Catch-22 clauses: requiring evidence of extinction from the polity itself, defining continuity so narrowly that any change voids coverage, and excluding "negligent persistence."

  The Class of One footnote will be the masterpiece - stating deadpan that a polity containing only itself has perfect survival rates, making this the "most accurate" product while highlighting the absurdity of the entire exercise.

  Throughout, I'll maintain absolute seriousness. No winking at the audience. The humor comes from the logical extension of these statistical methods to their ridiculous conclusions.
answer: |-
  ## CHARTERHOUSE ASSURANCE  
  *Established 1857*  
  *Soli Deo Securitas*

  **Client Services Department: Sovereign Continuity Endowment Prospectus**

  Charterhouse Assurance offers actuarially sound protection against the existential contingency of state failure. Our Continuity Endowment policies provide a pre-determined capital sum upon the verified extinction of the insured polity’s core governing principle and territorial integrity, as contractually defined. Premiums are derived not from speculative assessments of your unique trajectory – a perilous exercise vulnerable to narrative fallacy and strategic bias – but from the empirically observed survival curves of historical polities deemed analogous to your own. This *outside view* methodology ensures objectivity. We welcome the attendance of your appointed historians and chief strategists at the Class Assignment and Premium Setting meeting in an advisory capacity, recognizing the value of your self-understanding in selecting the most representative historical cohort.

  **Continuity Endowment Premium Rate Table (Per Annum, Basis Points of Sum Assured)**
  *Reference classes illustrative only; final assignment subject to Charterhouse Class Selection Advisory review.*

  | Reference Class (Representative Examples) | Base Premium | + Exception Rider¹ | + Decline Rider² | + Class Selection Advisory³ |
  | :---------------------------------------- | :----------: | :-----------------: | :--------------: | :-------------------------: |
  | **Confessional Monarchies (Post-1815 Settlement)**<br>(e.g., Kingdom of Bavaria, Kingdom of Saxony) | 85 bp | +40 bp | +20 bp | +15 bp |
  | **Maritime Trading Republics (Pre-Industrial)**<br>(e.g., Republic of Genoa, Hanseatic League - Lübeck) | 110 bp | +50 bp | +25 bp | +20 bp |
  | **Continental Land Empires (19th Century)**<br>(e.g., Ottoman Empire [Post-Crimean], Austro-Hungarian Empire) | 65 bp | +35 bp | +30 bp | +15 bp |
  | **20th C. Single-Party States (Established Post-Revolution)**<br>(e.g., [Redacted], [Redacted]) | 120 bp | +60 bp | +35 bp | +25 bp |
  | **Class of One (Client Only)⁴**<br>(*See Essential Disclosure 4*) | **12 bp** | N/A | N/A | N/A |

  **Notes to Table:**
  1.  **Exception Rider:** Adjusts premium for the client's formal assertion that the current century represents a unique, non-analogous historical phase, materially altering survival probabilities. Premium additive.
  2.  **Decline Rider:** Adjusts premium for client acknowledgement of experiencing measurable, multi-domain decline relative to peers or historical benchmarks. Premium additive.
  3.  **Class Selection Advisory:** Charterhouse facilitates a structured review of defensible alternative reference classes and their premium implications. Fee for service.
  4.  **Class of One:** This bespoke class, consisting solely of the client polity, reflects the historical fact that the client has survived 100% of the days from its inception to the policy date. *Essential Disclosure 4: The Class of One, while exhibiting a 0% observed failure rate within its defined historical period, represents our most statistically precise product, being based solely on the client's own survival data. Past performance is not indicative of future results.*

  **Frequently Raised Objections & Charterhouse Assurance Replies**

  *   **Objection:** *"Our state embodies a unique civilizational essence/pragmatic adaptability rendering historical parallels meaningless."*
      *   **Reply:** We concur entirely. History offers no perfect analogues, only imperfect reference classes selected for operational utility. The Exception Rider (see Rate Table) precisely quantifies the premium adjustment for this necessary uniqueness. Our method explicitly avoids claims of historical determinism.

  *   **Objection:** *"Your reference class book contains only polities that existed long enough to be observed. It ignores nascent states that failed immediately or polities so obscure they left no actuarial trace."*
      *   **Reply:** Your observation is astute and unarguable. Our dataset suffers from an inherent survivorship bias. We can only price and underwrite entities that achieved sufficient continuity to be recorded and that currently exist to pay premiums. This limitation is fundamental to historical base rate analysis. States exhibiting profound concern for continuity, evidenced by seeking this insurance, may indeed manifest correlated risk factors – a point we incorporate qualitatively.

  *   **Objection:** *"Assigning us to Class A yields a high premium, but Class B yields a low one. How is this objective?"*
      *   **Reply:** Reference class selection is inherently interpretive. Different defensible classes yield different base rate probabilities, hence different premiums. This is not a flaw but a feature, reflecting the multi-faceted nature of state survival. Our Class Selection Advisory service exists to navigate this complexity alongside your historians, ensuring the chosen class best reflects *your stated self-conception*. We price based on the selected class, not an unknowable 'true' class.

  *   **Objection:** *"Long-established states seem to get lower premiums simply because they've already lasted a long time."*
      *   **Reply:** This accurately describes the 'duration effect' inherent in survival analysis. A state surviving 200 years demonstrably possesses characteristics (observed or unobserved) that enabled it to survive 200 years. Its *conditional* probability of surviving the next year, given it has survived 200, may indeed be higher than that of a state only 50 years old. Our models rigorously account for this duration dependence. The Class of One product most purely embodies this principle.

  **Notice to Clients**

  The Continuity Endowment Policy (CEP) Contract contains the following standard provisions essential for claims resolution:
  *   **§7.3 Evidence of Extinction:** Proof of Extinction requires verifiable documentation, issued by the *duly constituted final governing authority of the insured Polity itself*, attesting to the permanent cessation of its core governing principle and integral territorial function. Documentation from successor states, occupying powers, or external observers is deemed insufficient per se.
  *   **§11.1 Continuity Definition:** "Continuity" requires the unbroken persistence of the Polity's *Founding Constitutional Essence* (FCE), as defined in the Policy Schedule Appendix A. Any material amendment, suspension, or reinterpretation of the FCE, however necessary for adaptive persistence, constitutes a Termination Event voiding coverage, unless a Continuity Waiver Rider (premium: TBD) was purchased prior to the amendment.
  *   **§18.2 Exclusions - Negligent Persistence:** No claim shall be payable if the Polity's extinction is adjudged by Charterhouse (acting reasonably) to have resulted primarily from its failure to implement Charterhouse's recommended Continuity Best Practices (available separately), thereby demonstrating negligent disregard for its own survival prospects.

  **Charterhouse Assurance: Securing Legacies Since 1857.**  
  *Inquiries: SovStability@CharterhouseAssur.co.uk*  
  *Offices: London, Zürich, Singapore*
