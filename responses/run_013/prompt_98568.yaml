  Hmm, this user teaches a graduate seminar on cultural evolution and is frustrated with how Darwinian accounts of culture are debated. They're tired of case-by-case arguments about whether culture spreads like a virus or is reconstructed each generation, without clear theoretical standards. They want me to lay out the essential requirements for any adequate Darwinian theory of culture.

  The user has specific demands: they want a full list of desiderata that a theory must meet, including phenomena to explain, distinctions to maintain, and established findings to respect. They mention several key phenomena: cumulative cultural evolution with its ratchet effect, speed of cultural change compared to genetic change, persistence of harmful cultural traits, recurrence of similar traditions across populations, and the reconstructive nature of transmission. They also want the theory to handle specific contrasting cases: high-fidelity practices without explicit reasoning versus beliefs that spread through re-derivation from shared cognitive dispositions.

  For the important parts, I need to mark which requirements are non-negotiable versus camp-specific, identify any potential tensions between requirements (especially between high-fidelity replication and reconstruction, and whether discrete units are necessary for cumulative evolution), and determine which requirement does the most work in excluding candidate theories. Finally, I should briefly assess how replication-based memetics, dual-inheritance theory, and cultural attraction theory fare against these criteria.

  I'll structure my response with clear sections: first listing all requirements with their justifications, then classifying them as non-negotiable or camp-specific, highlighting tensions, identifying the most exclusionary requirement, and ending with a concise assessment of the three theories. For the requirements, I'll cover phenomena like cumulative culture, speed of change, maladaptive persistence, convergent evolution, and reconstructive transmission. I'll also include methodological requirements like distinguishing reconstruction from replication, and avoiding genetic analogies when inappropriate.

  The key tensions I see are: 1) How can a theory demand both high-fidelity replication (for cumulative culture) and account for reconstructive transmission? 2) Does cumulative culture require discrete, particulate units like genes? I'll argue that fidelity can be functional rather than literal, and that quasi-discrete units might suffice.

  The most exclusionary requirement will likely be explaining cumulative culture without genetic assimilation, as it forces theories to account for uniquely human capacities. For the theories: memetics struggles with reconstruction and particulate units; dual-inheritance handles many aspects but may downplay reconstruction; cultural attraction excels at reconstruction but struggles with fidelity for cumulative culture. I'll keep this assessment brief as requested, focusing on the criteria themselves.
answer: |-
  Below is a rigorous specification of the desiderata for any theory claiming culture operates as a Darwinian process. The requirements are structured as phenomena to explain, distinctions to preserve, and constraints to honor, each justified by its necessity for theoretical coherence or empirical adequacy. Non-negotiable requirements (NN) are essential for the theory to qualify as *Darwinian* or to capture *defining features of human culture*. Camp-specific commitments (CS) reflect assumptions tied to particular research traditions but not universally mandated for a Darwinian framework.

  ### I. Core Phenomena to Explain (NN)
  1.  **Cumulative cultural complexity ("ratchet effect"):** The theory must explain how cultural traits accumulate modifications over generations, building complexity that exceeds individual invention, and why this appears uniquely robust in humans. *Justification (NN):* This is the hallmark outcome demanding a Darwinian *population-level* process; non-Darwinian explanations (e.g., pure individual learning) fail to account for its cross-generational stability and growth.
  2.  **Speed of cultural change relative to genetic evolution:** The theory must explain why cultural change can be orders of magnitude faster than genetic adaptation. *Justification (NN):* This differential rate is a primary motivation for positing cultural evolution; a Darwinian theory must inherently accommodate faster change through its inheritance mechanism.
  3.  **Persistence of maladaptive cultural traits:** The theory must explain how traits that reduce individual biological fitness (e.g., dangerous rituals, fertility-reducing norms) can stabilize and persist. *Justification (NN):* Darwinian processes (e.g., selection, drift) can maintain maladaptive variants under specific conditions (e.g., group selection, costly signaling, hitchhiking); failure to explain this contradicts core Darwinian logic applied to culture.
  4.  **Convergent cultural evolution ("recurrence"):** The theory must explain the emergence of similar traditions in geographically/culturally isolated populations (e.g., pyramid building, specific tool types). *Justification (NN):* This tests whether the theory invokes universal (e.g., cognitive, ecological) constraints/attractors alongside population-level dynamics, preventing ad-hoc historical explanations.
  5.  **Reconstructive transmission:** The theory must incorporate evidence that much cultural acquisition involves inferential reconstruction based on underlying cognitive structures, environmental cues, or fragmentary input, rather than verbatim copying. *Justification (NN):* Empirical evidence (e.g., developmental psychology, transmission chain experiments) overwhelmingly shows reconstruction occurs; ignoring it renders the theory empirically inadequate.

  ### II. Critical Distinctions to Preserve (NN)
  6.  **Distinguish faithful replication from inferential reconstruction:** The theory must clearly differentiate cases where a trait is transmitted with high fidelity (e.g., a ritual sequence learned by rote) from cases where it is independently re-derived each time (e.g., a logical belief derived from shared intuitive physics). *Justification (NN):* Conflating these mechanisms obscures the actual causal pathways of cultural stability and change, which is fundamental to any evolutionary account. It must specify when stability arises from copying fidelity vs. cognitive attractors.
  7.  **Distinguish cultural inheritance from genetic assimilation:** The theory must prevent the collapse of cultural explanation into genetic determinism. While gene-culture coevolution is crucial, the theory must account for cultural traits that persist *without* becoming genetically encoded. *Justification (NN):* Without this, "cultural evolution" loses its distinct explanatory domain and fails to explain the lability of culture.

  ### III. Constraints & Established Findings (NN)
  8.  **Avoid presupposing discrete, gene-like "particles":** The theory must *not* require cultural inheritance to rely on discrete, immutable, independently selected units ("memes") as a foundational axiom. *Justification (NN):* Empirical evidence shows cultural traits are often blended, holistic, and context-dependent; requiring particulate units *a priori* contradicts the observable nature of many traditions and ideas. (Note: Quasi-discrete units may *emerge*, but they cannot be a mandatory starting point).
  9.  **Account for the role of cognitive universals:** The theory must integrate the constraining and shaping role of species-typical cognitive biases (e.g., intuitive ontology, language acquisition devices, social learning biases) on cultural content and transmission. *Justification (NN):* Decades of cognitive science demonstrate that not all cultural content is equally likely; attractors and filters exist. Ignoring this renders predictions about cultural stability arbitrary.
  10. **Accommodate multi-level selection/cultural group structure:** The theory must be compatible with the potential for selection acting at levels above the individual (e.g., groups, lineages) and account for the structured nature of cultural populations (e.g., subcultures, institutions). *Justification (NN):* Cultural traits often exhibit group-level functional organization and competition, mirroring a key aspect of biological evolution; ignoring structure risks missing major dynamics.

  ### IV. Classification: Non-Negotiable (NN) vs. Camp-Specific (CS)
  *   **NN (1-10):** These are non-negotiable for any adequate *Darwinian* account of *human culture*. They stem from: a) Defining features of Darwinism (variation, inheritance, selection - implied in 1,2,3,8,10), b) Unique, defining phenomena of human culture (1,4,5,9), and c) Incontrovertible empirical constraints (5,6,7,8,9). Failure on any NN requirement means the theory is either not Darwinian or not explaining human culture.
  *   **CS (None listed as core requirements):** The desiderata above are framed to be minimally committed. Specific camps add further commitments:
      *   *Replication-based Memetics (CS):* Requires high-fidelity copying as the *primary* mechanism (contra Requirement 5), mandates discrete particulate units (contra Requirement 8), often downplays cognitive reconstruction (contra Req 5 & 9).
      *   *Dual-Inheritance (CS):* Often prioritizes formal quantitative modeling, emphasizes gene-culture coevolution as central mechanism (stronger than Req 10), sometimes assumes continuous rather than discrete traits.
      *   *Cultural Attraction Theory (CS):* Prioritizes inferential reconstruction (Req 5) and cognitive attractors (Req 9) as the *primary* drivers of stability, often downplaying the necessity of high-fidelity copying (tension with Req 1) and formal selection models.

  ### V. Key Tensions & Satisfiability
  *   **Most Serious Tension: Cumulative Complexity (Req 1) vs. Reconstructive Transmission (Req 5) & Anti-Particulate Constraint (Req 8).**
      *   **Tension:** Cumulative complexity seems to demand *some* fidelity across generations to preserve innovations. Yet reconstructive transmission implies variation in every "transmission" event, and anti-particulate constraints reject immutable units. How can complexity build if traits are constantly rebuilt differently?
      *   **Resolution Requirement:** The theory must demonstrate how *functional fidelity* or *stability of outcomes* emerges from reconstructive processes + stabilizing selection (via environmental constraints, cognitive attractors, or social reinforcement), *without* requiring perfect copying or particulate units. Stability can arise from the *system* (attractors + selection) rather than the *unit*. Discrete *representations* might emerge functionally without being fundamental atoms.
  *   **Is Cumulative Culture Possible Without Discrete Units? (Req 1 vs. Req 8)**
      *   **Yes, but with caveats:** Discrete units are not logically necessary. Cumulative evolution requires *heritable variation* and *differential persistence*. This can occur with "quasi-discrete" units emerging from blended inheritance under stabilizing selection, or through the hierarchical assembly of complex structures from simpler, partially stable components reconstructed within attractors. The "ratchet" can function via stabilizing selection on reconstructed outputs, not just copying fidelity of inputs.

  ### VI. The Most Exclusionary Requirement
  *   **Requirement 1 (Cumulative Cultural Complexity)** does the most work in excluding candidates. Many theories can handle isolated cultural change (Req 2) or maladaptive persistence (Req 3). However, explaining the *systematic, open-ended accumulation of complex, functionally integrated traits* uniquely seen in humans forces the theory to specify a robust inheritance/stability mechanism operating over generations that avoids collapsing into explanations relying solely on individual genius, environmental determinism, or genetic assimilation (Req 7). Theories that fail to explain how complex *systems* (e.g., language, technology) build upon prior states without dissipating fail this core test.

  ### VII. Brief Assessment of Major Theories Against Desiderata
  1.  **Replication-based Memetics:**
      *   *Fails:* Req 5 (Reconstructive Transmission - denies its centrality), Req 8 (Anti-Particulate - requires discrete memes), Req 9 (Cognitive Universals - often downplays). Struggles with Req 4 (Convergence - why similar memes arise independently?).
      *   *Succeeds:* Req 1 (Complexity - via high-fidelity copying), Req 2 (Speed), Req 3 (Maladaptive - via selfish memes).
  2.  **Dual-Inheritance Theory:**
      *   *Succeeds:* Req 1, 2, 3, 4 (via biased transmission + gene-culture coevolution), 7, 10. Accommodates Req 9 (via learning biases).
      *   *Struggles:* Req 5 (Often assumes substantial copying fidelity; reconstruction is less central), Req 8 (Often uses quasi-discrete units in models; tension exists).
  3.  **Cultural Attraction Theory:**
      *   *Succeeds:* Req 4, 5, 6, 7, 8, 9 (Core focus).
      *   *Struggles/Fails:* Req 1 (Difficulty explaining how high-complexity, low-attractor traits cumulate without significant fidelity); Req 3 (Maladaptive persistence - if strong attractors shape culture, why harmful traits?); Req 10 (Formal multi-level selection less emphasized). Its core tension is with cumulative complexity without strong copying (Req 1 vs. its commitment to Req 5/9).

  This specification provides the necessary foundation for evaluating theories. The critical tension lies in reconciling the ratchet effect with the reconstructive nature of the mind, demanding a Darwinism built on dynamic stability emerging from attractors, constraints, and selection, not just faithful replication.
