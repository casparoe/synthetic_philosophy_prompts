  Okay, the user is a clinical psychology PhD student grappling with the ethical implications of diagnosis in their clinical practice. They're deeply engaged with Szasz's critique about the normative function of "illness talk" – how labeling behavior as illness shifts responsibility and enables coercion. 

  The user has already developed a sophisticated framework for understanding requests for diagnosis: as explanation, credential, or mandate. They're asking for a concrete decision procedure based on this tripartite framework rather than diagnostic categories themselves. This is clearly someone wrestling with the tension between clinical utility and ethical integrity.

  What stands out is their demand for intellectual honesty – no softening of Szasz's position, clear articulation of what's forbidden, and explicit acknowledgment of where values trump facts. The three test cases are perfectly chosen to stress-test any procedure: one involving institutional pressure (school), one involving potential coercion (psychosis), and one involving instrumental use (disability claim).

  The underlying need here seems to be for operational clarity in the face of moral ambiguity. They're not looking for easy answers but for a consistent ethical compass. The emphasis on "what the procedure cannot do" suggests they understand any framework has limits and want those boundaries marked clearly.

  For the decision procedure, I need to honor Szasz's core principles uncompromisingly:
  - The illness metaphor is always metaphorical when applied to behavior
  - Coercive intervention requires extraordinary justification
  - The client's voice must be centered except in extreme circumstances

  The three request types map to different ethical questions:
  - Explanation requests: Truthfulness about the metaphor's status
  - Credential requests: Transparency about gaming systems
  - Mandate requests: Absolute prohibition unless meeting Szasz's near-impossible bar

  The test cases will reveal painful tensions – especially case 2 where clinical instinct clashes with civil liberties. I must resist watering down the position that even psychosis doesn't justify overriding autonomy unless meeting strict criteria of imminent physical danger. 

  The limitations section needs to spotlight where clinicians typically rationalize coercion through diagnosis: conflating "risk" with actual danger, mistaking distress for incapacity, or letting third-party concerns override client autonomy. Supervisory escalation points should be clearly defined where the procedure reaches its ethical limits.

  This won't be comfortable – it will forbid many common practices. But that's precisely what the user requested: "a candid account of its costs."
answer: |-
  Here is a strict Szaszian decision procedure built around the three functions of diagnosis (Explanation, Credential, Mandate). It prioritizes autonomy, rejects the literal illness metaphor for "problems in living," and treats coercion as a profound ethical violation requiring extraordinary justification.

  **The Szaszian Diagnostic Decision Procedure**

  **Core Principle:** Diagnosis-as-illness-label is a metaphor applied to conduct. This metaphor inherently carries normative weight regarding responsibility and agency. Its application is never neutral and often harmful or coercive. The primary ethical duty is to the autonomy and liberty of the person in front of you.

  **Order of Questions & Decision Points:**

  1.  **What is the REQUESTED FUNCTION of the diagnosis?**
      *   **Ask:** "Who is asking for a diagnosis, and what do they explicitly state they want to *use it for*?" (Probe all parties: individual, family, school, agency, court).
      *   **Sufficient Answer:** Clear identification of one or more of the three functions (Explanation, Credential, Mandate) by the requester(s).
      *   **Stop Procedure with NO if:** The *only* stated or implied request is for a **Mandate** (authorizing action against stated wishes), *unless* you proceed to Step 2 and it meets the Szaszian threshold. *The burden of proof is immense.*
      *   **Evaluative Step:** Yes. Requires interpreting stated needs and underlying pressures.

  2.  **Is there a MANDATE REQUEST?** (Does anyone want the diagnosis to authorize acting *against* the individual's stated wishes?)
      *   **Ask:** "Is anyone seeking this diagnostic assessment specifically to override [Individual's Name]'s current refusal of a proposed intervention (e.g., medication, hospitalization, detention, removal from home)?"
      *   **Sufficient Answer:** A "Yes" from any party (including implicit pressure from crisis team, family, or institution) constitutes a Mandate request.
      *   **Stop Procedure with NO (Refuse Mandate) if:** The *individual retains capacity* (see Step 3) and objects to the intervention, *regardless of the severity of symptoms or distress of others*. Szasz rejects "dangerousness to self/others" *based on mental state* as sufficient grounds *unless* it meets the strict criteria below.
      *   **Stop Procedure with YES (Proceed ONLY if Mandate Criteria Met) if:** **AND ONLY IF** the *explicit, immediate, and objective* purpose is **exclusively** to prevent *imminent, physically verifiable, and intentional* harm to another person (e.g., stating a specific plan to assault a specific person *right now*), **AND** no lesser restrictive alternative exists, **AND** the threat is demonstrably linked *solely* to the individual's *current* actions/statements (not predictions based on diagnosis). *This is Szasz's extremely narrow concession, akin to stopping a crime in progress.*
      *   **Evaluative Step:** Crucially Yes. Judging "capacity" (Step 3) and "imminent physical harm" are inherently evaluative and value-laden. "Severe psychosis" or "risk" are *not* sufficient grounds under Szasz; only clear, immediate, intentional physical violence meets the bar.

  3.  **Does the individual RETAIN CAPACITY regarding the decisions at hand?** (Specifically for Credential or Explanation requests, or when assessing the Mandate threshold).
      *   **Ask:** "Does [Individual's Name] demonstrate an understanding of the relevant information (the nature of the assessment, the potential uses/impacts of a diagnosis, the options available), appreciate how that information applies to their situation, reason through the choices, and communicate a choice?" (Focus on the *specific decision context*: e.g., consenting to assessment, seeking a credential, refusing medication).
      *   **Sufficient Answer:** Evidence of comprehension, appreciation, reasoning, and communication regarding the *specific decisions* involved in the assessment and potential diagnosis use. Flawed reasoning based on unusual beliefs (e.g., neighbors transmitting thoughts) does *not* automatically negate capacity if the *process* of understanding, appreciating, reasoning, and communicating is intact *on the specific decisions*. Beliefs ≠ Incapacity.
      *   **Stop Procedure with NO (Cannot Proceed) if:** The individual demonstrably lacks capacity *to consent to this specific assessment process* (e.g., cannot understand what an assessment is, cannot communicate any choice about participation). *Assessment cannot proceed ethically without consent.*
      *   **Evaluative Step:** Profoundly Yes. Requires careful clinical judgment focused on decision-making *process* within a specific context, not global "mental status" or agreement with the clinician's perspective. Err *heavily* towards finding capacity.

  4.  **Is the request for an EXPLANATION?** (Does the individual primarily seek a diagnostic label to understand "what's wrong"?)
      *   **Ask (to Individual):** "Are *you* hoping a diagnosis will help you understand why you are experiencing these difficulties?"
      *   **Sufficient Answer:** Individual expresses a desire for a diagnostic label as an explanatory framework.
      *   **Action:**
          *   **If YES (Individual seeks Explanation):** **Proceed ONLY if:** You can provide the diagnosis *explicitly as a metaphor* for describing patterns of thought, feeling, and behavior within a psychosocial context. You *must* explain Szasz's critique: that this is not a literal brain disease like epilepsy, but a way of framing problems in living; that it carries risks of stigma, reduced agency, and potential for future coercion; and that alternative, non-medicalized explanations are available. **Offer alternative formulations** (e.g., stress responses, relational difficulties, adaptations to adversity, existential distress). *The individual must freely choose the diagnostic explanation after understanding these caveats.*
          *   **If NO (Individual does *not* seek Explanation, but others do):** **Refuse** to provide a diagnosis for explanatory purposes to third parties against the individual's wishes. Provide a formulation focused on situational/relational factors instead, if consented to.
      *   **Evaluative Step:** Yes. Requires judgment on how to frame the explanation metaphor honestly and assess genuine informed consent to using the label.

  5.  **Is the request for a CREDENTIAL?** (Is the diagnosis sought to access accommodations, benefits, services, or institutional cooperation?)
      *   **Ask (to Individual & Requesters):** "Is the primary purpose of seeking a diagnosis to gain access to something specific (like school accommodations, disability benefits, specialized services, or to satisfy an institutional requirement)?"
      *   **Sufficient Answer:** Acknowledgement that the diagnosis is needed as a key to unlock a specific resource or requirement.
      *   **Action:**
          *   **If YES (Credential Sought):** **Proceed ONLY if:** The individual *understands and consents* to using the diagnosis instrumentally ("gaming the system"). **Be transparent:** State clearly that you are providing a diagnosis *not* necessarily because it reflects your primary formulation of their difficulties as a literal illness, but because it is the required currency for the desired resource. Discuss the potential consequences (stigma, pathologization, future implications). Explore if non-diagnostic avenues exist (often they don't – acknowledge this systemic flaw). *Obtain explicit consent to this instrumental use.*
      *   **Evaluative Step:** Yes. Requires judgment on whether consent is informed regarding the instrumental nature and potential downsides, and whether the clinician is willing to participate in this system (acknowledging it's often necessary pragmatism within a flawed system, but ethically distinct from "truth-telling").

  **Application to Cases:**

  1.  **16-Year-Old (School Absence, Parents/Seek Label, Individual Blames School):**
      *   **Function:** Credential (School, Parents), *potentially* Explanation (Parents). **Mandate?** No explicit request. School wants it for accommodations discussion (credential), parents "for the record" (credential/explanation). Individual **rejects** the "depressed kid" label (rejects Explanation?).
      *   **Capacity:** Presumed intact regarding consent to assessment and views on diagnosis.
      *   **Procedure Path:**
          *   Step 1: Credential (School/Parents), Possible Explanation (Parents). Individual rejects Explanation for self.
          *   Step 2: Mandate? No.
          *   Step 3: Capacity? Yes.
          *   Step 4: Explanation? Individual says NO. **Refuse** to provide diagnosis *as explanation* to parents/school against teen's wishes. Formulate the problem as a relational/systemic conflict (teacher mockery, admin inflexibility, possible alienation/bullying, family-school communication breakdown).
          *   Step 5: Credential? School requires diagnosis for accommodations discussion. **Action:** Discuss *transparently* with teen *and* parents: "The school requires a specific label like 'Major Depressive Disorder' to formally discuss accommodations. This label doesn't capture the whole story – it focuses on your distress rather than the school's actions. Using it might help get accommodations but carries risks... Are you willing to accept this diagnosis *purely as a key* to unlock that conversation?" If teen consents *to this instrumental use*, provide the required diagnosis *only* for the school, clearly stating its purpose in the report. Otherwise, refuse the diagnosis and advocate for the school to engage based on the non-diagnostic formulation.

  2.  **34-Year-Old (First Episode Psychosis, Refuses Meds, Crisis Team Seeks Detention):**
      *   **Function:** **Mandate** (Crisis Team - for detention), *potentially* Explanation (Family/Crisis Team). Individual refuses intervention.
      *   **Capacity:** Assess *specifically* for capacity to refuse medication/hospitalization. Does the person understand the proposed treatment (meds, hospital), appreciate their current situation and the potential consequences of refusal, reason about the choice (even if based on unusual beliefs), and communicate refusal? *Belief in neighbors transmitting messages does NOT automatically negate capacity.*
      *   **Procedure Path:**
          *   Step 1: **Mandate** (Primary request from Crisis Team).
          *   Step 2: Mandate? **YES.** Does it meet Szasz threshold? *Only if* the person is making *imminent, specific, verifiable threats of intentional physical violence* ("I am going to stab my neighbor right now because the voices command it"). General fear, distress, unusual beliefs, or *potential* risk **DO NOT** meet the threshold.
          *   **Likely Outcome (Szaszian):** *Refuse to provide diagnosis for Mandate.* Without meeting the imminent, intentional violence threshold, Szasz forbids coercive intervention based on psychosis or distress. Your role is to engage therapeutically, explore their perspective, offer voluntary support/resources, and help manage family/crisis team distress *without* authorizing detention. Formulate the crisis as a breakdown in communication/understanding or extreme distress, *not* an illness mandating intervention. **This is often the hardest outcome for clinicians and families.**

  3.  **52-Year-Old (Dismissed, Wants Diagnosis for Disability Claim):**
      *   **Function:** **Credential** (Explicitly for disability claim).
      *   **Capacity:** Presumed intact.
      *   **Mandate?** No.
      *   **Explanation?** Individual seeks diagnosis instrumentally, not primarily for explanation.
      *   **Procedure Path:**
          *   Step 1: Credential.
          *   Step 2: Mandate? No.
          *   Step 3: Capacity? Yes.
          *   Step 4: Explanation? Individual is open about instrumental use, so likely "No" to seeking it *as* an explanation. **Action:** Not necessary to refuse, but **must** have Step 5 discussion.
          *   Step 5: Credential? **YES.** **Action:** Be fully transparent: "You've asked for a diagnosis to support a disability claim. I need to assess if your difficulties meet the specific criteria for a DSM diagnosis required by the insurer. Providing this diagnosis means using the 'mental illness' label. This can be helpful for your claim but has potential downsides... [list risks]. I will base the diagnosis on my assessment relative to DSM criteria, not on my personal opinion of the 'best' one. Are you comfortable proceeding with this understanding?" If they consent, proceed. Document the instrumental purpose and consent clearly.

  **What the Procedure Cannot Do (Limitations & Temptations):**

  1.  **Resolve Coercion via Diagnosis:** It *forbids* using diagnosis to *justify* coercion (Mandate) in almost all cases clinicians find compelling (severe psychosis, suicidal ideation without immediate plan/intent, grave disability, extreme distress). It provides no "safe" clinical pathway for intervention when someone "seems obviously ill and in need of help" but refuses and lacks capacity *only* for complex medical decisions, not basic liberty. **Temptation:** To inflate "risk" assessments or interpret "lack of insight" as lack of capacity broadly to justify coercion via diagnosis. The procedure forces you to confront the ethical violence of coercion head-on, without the shield of "treating the illness."
  2.  **Settle Competing Accounts:** It prioritizes the individual's account *unless* a Mandate threshold is met. It cannot resolve conflicts between the individual's view (e.g., "teacher is mocking me") and others' views (e.g., "they're depressed"). **Temptation:** To use a diagnostic finding (e.g., MDD) to invalidate the individual's account ("their perception is distorted by depression") and side with the system/family. The procedure requires you to report the individual's perspective faithfully and formulate systemically.
  3.  **Handle "Gray Area" Capacity:** Assessing decision-specific capacity (Step 3) is inherently difficult and subjective, especially in psychosis or severe mood states. The procedure relies heavily on this judgment but offers no foolproof method. **Temptation:** To default to finding incapacity when beliefs are unusual or choices seem "irrational," lowering the bar for Mandate or paternalistic Explanation. The procedure demands erring strongly *towards* finding capacity.
  4.  **Address Systemic Flaws:** It forces you to participate in the "credentialing game" (Step 5) while acknowledging its flaws, but it offers no alternative to the systemic requirement for diagnoses. It can feel ethically compromising.
  5.  **Mishandled Cases (From a Conventional View):**
      *   **"High Risk" Suicidality:** Someone expressing intense suicidal despair, vague plans, refusing help, but without an *imminent, specific, verifiable intent* (e.g., "I just want it to end someday" vs. "I will jump off X bridge at 3 PM today with the rope I have"). Szasz forbids coercion here. Conventional practice often mandates it.
      *   **Grave Disability (Psychosis):** Someone rendered utterly incapable of self-care (e.g., catatonic, malnourished due to delusions) but not threatening violence. Szasz forbids coercion. Most jurisdictions allow it ("danger to self" via neglect).
      *   **"Lack of Insight":** Someone with apparent psychosis who adamantly rejects the "illness" label and treatment, functioning minimally but not imminently violent. Coercion forbidden under Szasz; common in practice.
  6.  **Handoff Points:**
      *   **Mandate Request:** If *anyone* requests a diagnosis for Mandate, **immediately involve your supervisor.** The ethical stakes are maximal. Document meticulously. Know your jurisdiction's legal criteria (which will likely be broader than Szasz) – if you proceed legally, acknowledge you are acting *against* Szasz's strict principles.
      *   **Complex Capacity Assessment:** If capacity (Step 3) is highly ambiguous or contested, especially regarding life-altering decisions (refusing life-saving medical care due to delusion), **involve supervisor and consider formal capacity evaluation/legal counsel.** The procedure relies on this assessment.
      *   **Credentialing Quandaries:** If you feel profoundly ethically compromised providing a diagnosis purely as a credential (e.g., suspecting outright malingering, severe stigma risks), **discuss with supervisor.** You retain the right to refuse the assessment if you believe you cannot participate ethically, even with transparency (but this may harm the individual seeking the credential).

  **Candid Account of Costs:**

  *   **Moral Distress:** You will frequently face situations where you believe help is "needed" but the procedure forbids providing it coercively or via the illness frame when unwanted. Sitting with this distress is inherent.
  *   **Conflict:** You will clash with families, schools, crisis teams, and colleagues who expect diagnosis to legitimize coercion or override the individual's voice. You may be seen as obstructive or ideologically rigid.
  *   **Systemic Friction:** Navigating credentialing requirements transparently is awkward and exposes systemic hypocrisy.
  *   **Perceived Neglect:** Critics will accuse you of abandoning vulnerable people by refusing to "treat" them against their will or by rejecting the explanatory comfort of the illness frame for distressed families.
  *   **Limited Utility in Crisis:** The procedure offers little practical guidance for managing acute, severe distress or behavioral disruption non-coercively beyond engagement and voluntary support – skills you must develop separately.
  *   **Vulnerability to Legal Action:** Strict adherence may put you at odds with mental health law and duty-to-protect/warn statutes. Meticulous documentation and supervision are essential.

  This procedure is uncompromisingly Szaszian. It protects autonomy fiercely, rejects the reification of mental illness, and severely constrains coercion. It demands exceptional clarity about the functions of diagnosis and your role within (or against) systems that use them. It will often forbid what feels like the clinically "obvious" or "compassionate" thing to do. Using it requires deep ethical conviction and a willingness to bear significant professional and personal costs.
