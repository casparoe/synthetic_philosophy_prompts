prompt: |-
  Ok, so I spent about 35 years breeding plants and running variance-component analyses, and now that I'm retired I've been reading philosophy of biology and I keep getting tangled up on heritabilty. I want your actual credence on one claim, not a lecture — I've had enough lectures.

  The claim: "Heritability is a real, well-defined property that a trait has in a population — it's not just an artifact of the particular genotypes and environments you happened to sample — so two labs studying the same trait in the same species ought to converge on roughly the same number."

  Give me a number between 0 and 1, then decompose it. The sub-questions I can see are: (a) whether the standard variance decomposition is even identified once genes and environments correlate and interact; (b) whether a heritability coefficient is answering a counterfactual/intervention question ("what happens if we change the genes") or just a descriptive one about this particular sample; (c) whether a twin/family estimate and a molecular/SNP-based estimate are even estimates of the same quantity; (d) whether "the same trait in the same species" pins down a unique population and range of environments at all. Give each a rough probability, one line of justification, show me how they combine, and tell me which term my final number is most sensitive to. Then tell me which term you're least sure of and what evidence would move it most.

  Two follow-ons while you're at it. First, does the number change if the trait is a behavioral one measured in humans versus, say, plant height in a greenhouse — and if so, which sub-question is doing the work? Second, when someone says a between-group difference "isn't heritable" because heritability is defined within groups, is that a substantive fact about the world or just a definitional dodge? Tell me where that sits in your decompositon, because I honestly can't tell if it's deep or a shell game.
