prompt: |-
  I am designing a single ninety-minute session for a formal epistemology reading group: six or seven doctoral students in philosophy who are fluent in Bayesian confirmation theory and comfortable with the rudiments of decision theory — states, acts, expected utility, dominance — but who have never met a scoring rule, proper or otherwise, and who will read nothing in advance. I have to build the session from scratch, and I would like you to design it rather than explain the material to me.

  The topic is the accuracy-first approach to credence: the proposal that the fundamental epistemic good is the accuracy of a credence function, that accuracy is graded rather than binary, and that the central normative results — above all the argument that credences must satisfy the probability calculus — are supposed to follow from accuracy considerations alone, without betting behaviour, representation theorems, or a prior distribution over the possibilities. I want the audience to leave able to say exactly what that argument establishes and what it merely presupposes.

  Two things are fixed, and I want the session arranged around them. First, the hinge is the difference between a dominance argument and a maximisation argument; the audience knows both from decision theory and will, I predict, read the accuracy argument as expected-utility reasoning in disguise, so the plan should be ordered such that the moment this misreading becomes available is the moment it is closed off. Second, I want the final third of the session to land on the gap between showing that a credence function is accuracy-dominated and showing that it is irrational, and on which assumptions are doing the work at each stage — in particular the strict propriety of the scoring rule and the assumption that the accuracy of a whole credence function is the sum of the accuracies of its individual credences. I am unsure how much of this the students can be brought to see in the time available, so tell me where earlier in the sequence the ground for it must have been laid.

  What I need from you:

  1. The order of ideas, with dependencies made explicit: what must be in place before what, and for each step what it would cost to reverse the order. Assume nothing can be introduced as a lemma to be taken on trust.

  2. The one example or case that carries the session. My candidate is a credence function over three mutually exclusive and exhaustive possibilities that assigns a half to each, set against the uniform function assigning a third to each, so that the students can score both in each of the three possibilities and see the second beat the first in all three. Tell me whether this can carry the whole ninety minutes; what it must have and must lack in order to do so; where it will break down and what would have to replace it there. I want it to do three jobs at once — make accuracy feel graded rather than binary, make the audience feel the pull of the incorrect function instead of dismissing it as absurd, and make the world-by-world structure of the argument visible — and I suspect it can do at most two.

  3. The misconceptions to expect, in the order the audience will form them, and the exact point in the sequence at which each should be headed off. My own list, which I would like corrected and reordered: that accuracy is simply truth; that any reasonable measure of closeness to the truth will serve, so the choice of scoring rule is a matter of convention; that the argument is circular because it needs probabilities over the possibilities; that it shows expected accuracy to be the fundamental epistemic norm; that it tells you which credences to have rather than constraining only their structure; and that being dominated and being irrational come to the same thing. Tell me which of these I have got wrong, and which misconception I have failed to anticipate.

  4. A check for understanding for the last five minutes — one question put to the room whose answers will separate the students who have grasped the argument as a dominance argument resting on a bridge principle from those who have grasped it as an expected-accuracy argument. If one question cannot do that, tell me what pair will.

  5. What to leave out, and how to say so. I do not intend to attempt the diachronic extensions, to enter the question whether accuracy is the only epistemic good, or to do anything with epistemic utility theory as a general framework beyond what the argument requires — including whether to present accuracy-first as merely a special case of it. Tell me whether any of that can be deferred without damage, and whether anything on that list turns out to be load-bearing after all.

  One constraint throughout: the students cannot look anything up during the session, and I do not want the plan to depend on their having memorised names, dates, or titles. Everything needed should be reconstructible from what is on the board.
reasoning: |-
  We are designing a 90-minute session for a reading group on the accuracy-first argument for probabilism. The audience consists of doctoral students in philosophy who are fluent in Bayesian confirmation theory and the rudiments of decision theory but have not encountered scoring rules or the accuracy-first approach. The goal is for them to understand the argument as a dominance argument (not an expected utility argument) and to grasp the gap between being dominated and being irrational, including the role of strict propriety and additivity.

  The session is structured around two fixed points:
  1. The hinge is the distinction between dominance and maximization (expected utility) arguments.
  2. The final third focuses on the gap between dominance and irrationality, and the assumptions (strict propriety and additivity).

  We are to use an example with three mutually exclusive and exhaustive possibilities: a non-probabilistic credence function c (0.5, 0.5, 0) and the uniform probabilistic one (1/3, 1/3, 1/3). This example is intended to illustrate graded accuracy, make the non-probabilistic assignment plausible (so they feel the pull), and show the world-by-world dominance.

  However, note that the example I have (0.5,0.5,0) is not the one the user proposed (they proposed (0.5,0.5,0.5) vs (1/3,1/3,1/3)). But (0.5,0.5,0.5) is not a probability function because it sums to 1.5. The user must have intended (0.5, 0.5, 0) or perhaps (0.5,0.5,0) for two of the three and 0 for the third? Actually, the user said: "a credence function over three mutually exclusive and exhaustive possibilities that assigns a half to each" — that would be (0.5,0.5,0.5) which sums to 1.5. That is not a probability function. We need to correct that. Let me assume the user meant: one that assigns 0.5 to each of two possibilities and 0 to the third? But then it doesn't assign to all three. Alternatively, perhaps they meant a function that assigns 0.5 to each of the three, but that is not a probability function because it doesn't sum to 1. So we must use a non-probabilistic function. The standard example is to have c(A)=0.4, c(B)=0.4, c(C)=0.2 (which sums to 1, but is not uniform) but then it is probabilistic? Actually, it is probabilistic. We need a non-probabilistic function.

  The classic example is a credence function that assigns 0.6 to A, 0.6 to B, and 0.6 to C, but that sums to 1.8. Then we compare to (1/3,1/3,1/3). In each world, the true proposition gets 1 and the others 0. But we need to score. Alternatively, the example of assigning 0.5 to A, 0.5 to B and 0 to C (with A, B, C mutually exclusive and exhaustive). This is non-probabilistic because the sum is 1, but the credence in A and B together is 1, but individually they are 0.5 and C is 0. However, note that if we have a partition, then the credence in the disjunction A∨B∨C must be 1, but here we are assigning to each atom. The function (0.5,0.5,0) for atoms A, B, C is non-probabilistic because the credence in A∨B is 1 (by finite additivity) but c(A∨B) should be c(A)+c(B)=1, and that is consistent. However, note that the credence in C is 0, but also the credence in A∨C should be 0.5+0=0.5, but if the world is A, then A∨C is true and we have c(A∨C)=0.5. But the problem is that in the partition of three atoms, we require that the credences in the atoms sum to 1. Here, 0.5+0.5+0=1, so it is probabilistic? 

  Wait: if the possibilities are mutually exclusive and exhaustive, then they form a partition. A credence function is probabilistic if it is finitely additive and assigns 1 to the tautology. For the atoms, it must assign non-negative numbers that sum to 1. The function (0.5, 0.5, 0) does that. So it is probabilistic. That won't work for a non-probabilistic example.

  We need a non-probabilistic function. The standard example in the literature is to have a credence function that violates additivity. For instance, assign c(A)=0.5, c(B)=0.5, and c(A∨B)=0.6 (with C being the third atom, but note A∨B is equivalent to not-C). But the user wants three possibilities, so we are assigning credences to the atoms? Then we need a function that does not sum to 1. For example, let the atoms be A, B, C. Then a non-probabilistic function could be (0.7, 0.7, 0.7) which sums to 2.1, or (0.4, 0.4, 0.4) which sums to 1.2. Alternatively, (0.5, 0.5, 0.5) which sums to 1.5. We'll use (0.5,0.5,0.5) for the non-probabilistic one and (1/3,1/3,1/3) for the probabilistic one.

  So let the three possibilities be A, B, C (mutually exclusive and exhaustive). The non-probabilistic credence function c assigns 0.5 to each. The probabilistic one d assigns 1/3 to each.

  We will score using a strictly proper scoring rule, such as the Brier score (quadratic scoring rule). The Brier score for a credence x in a proposition that turns out true is (1-x)^2, and for false is (0-x)^2 = x^2. But note: for the entire credence function, we typically take the sum of the scores for each proposition in the partition? The literature often considers a set of propositions that form a partition. We are considering the atoms.

  So for each world, we can compute the score of a credence function by looking at the credence assigned to the true atom and the false atoms.

  In world A:
  - For c: score for A: (1-0.5)^2 = 0.25, for B: (0-0.5)^2=0.25, for C: (0-0.5)^2=0.25. Total score = 0.25+0.25+0.25 = 0.75.
  - For d: score for A: (1-1/3)^2 = (2/3)^2 = 4/9 ≈ 0.444, for B: (0-1/3)^2=1/9≈0.111, for C: same as B, 1/9. Total = 4/9 + 1/9 + 1/9 = 6/9 = 2/3 ≈ 0.666.

  So d has a lower (better) score than c in world A. Similarly, by symmetry, in world B and C, d will have a total score of 2/3 and c will have 0.75. So d dominates c: in every world, d is more accurate (lower score) than c.

  But note: the additivity assumption is built in because we are summing the scores for each atom. And the scoring rule is strictly proper.

  Now, the plan:

  We have 90 minutes. We break it into three parts:

  Part 1: Setting the stage (25 minutes)
  - Introduce the idea of graded accuracy (5 min)
  - Introduce the example and the scoring rule (10 min)
  - Show the dominance in the example (10 min)

  Part 2: The dominance argument for probabilism (35 minutes)
  - Generalize the example to the theorem: any non-probabilistic credence function is dominated by a probabilistic one (15 min)
  - Clarify that this is a dominance argument, not an expected utility argument (10 min)
  - Address the misconception that the argument uses probabilities over possibilities (10 min)

  Part 3: The gap to irrationality (30 minutes)
  - What does dominance imply? The bridge principle: if a credence function is dominated, then it is irrational. (10 min)
  - The role of strict propriety: why we need the scoring rule to be strictly proper. (10 min)
  - The role of additivity: what if we don't sum the scores? (10 min)

  Now, let's detail each part.

  Part 1: Setting the stage (25 min)

  1. Graded accuracy (5 min):
     - Start with the binary view: a belief is true or false. Then introduce the idea that credences are graded, so accuracy should be graded too.
     - We measure accuracy by a scoring rule: a function that takes a credence and the truth value (1 or 0) and returns a number (a score). Lower score is better (or sometimes higher is better; we'll use lower is better, like loss).
     - Example: the quadratic scoring rule. For a credence x in a proposition, if true: (1-x)^2, if false: x^2.

  2. The example (10 min):
     - Present the setup: three mutually exclusive and exhaustive possibilities: A, B, C.
     - Two credence functions:
          c: assigns 0.5 to A, 0.5 to B, 0.5 to C. (Note: this is non-probabilistic because the sum is 1.5, not 1.)
          d: assigns 1/3 to A, 1/3 to B, 1/3 to C. (probabilistic)
     - Explain that we will score each credence function in each possible world (A, B, or C) by summing the score for each proposition (A, B, C) individually.
     - Compute in world A:
          For c:
              A: true -> (1-0.5)^2 = 0.25
              B: false -> (0.5)^2 = 0.25
              C: false -> (0.5)^2 = 0.25
              Total: 0.75
          For d:
              A: true -> (1-1/3)^2 = (2/3)^2 = 4/9 ≈ 0.444
              B: false -> (1/3)^2 = 1/9 ≈ 0.111
              C: false -> 1/9 ≈ 0.111
              Total: 6/9 = 2/3 ≈ 0.666
          So 0.666 < 0.75 -> d is better (more accurate) in world A.
     - Similarly, by symmetry, d is better in world B and world C.

  3. Show dominance (10 min):
     - Emphasize: in every possible world, d has a better (lower) total score than c. So d dominates c.
     - This is a world-by-world comparison. We don't need any probabilities over the worlds.

  Part 2: The dominance argument for probabilism (35 min)

  1. Generalization (15 min):
     - State the theorem: For any non-probabilistic credence function defined on a partition, there is a probabilistic credence function that dominates it (under the quadratic scoring rule and additive score for the entire function).
     - Sketch why: The key is that the set of probabilistic credence functions is convex, and the quadratic scoring rule is strictly convex. Then by the properties of strictly convex functions, any point outside the convex set is dominated by a point inside (via the projection). But we don't need to prove it, just give the idea.
     - Note: We are using the quadratic scoring rule and additivity. But the theorem holds for any strictly proper scoring rule.

  2. Clarify dominance vs. maximization (10 min):
     - The audience might think: "But in decision theory, we maximize expected utility. Why isn't this about expected accuracy?"
     - Emphasize: In this argument, we are not using any probabilities over the worlds. We are comparing credence functions in each world individually. We don't need a probability distribution over the worlds to define dominance.
     - The dominance relation is: f dominates g if in every world, f has higher accuracy (or lower inaccuracy) than g.
     - Expected accuracy would require a probability distribution over worlds. Here we don't have that.

  3. Address the circularity misconception (10 min):
     - Misconception: the argument must assume a probability distribution over the worlds to define accuracy, but that would be circular.
     - Response: The scoring rule is defined for each world individually. We don't need a probability distribution over the worlds to define the score in a given world. We only use the actual truth values in that world.
     - So the argument does not presuppose any probabilities over the worlds.

  Part 3: The gap to irrationality (30 min)

  1. The bridge principle (10 min):
     - We have shown that non-probabilistic functions are dominated. But why is that a reason to be probabilistic?
     - Bridge principle: If a credence function is dominated by another, then it is irrational to adopt it. (Because there is an alternative that is better no matter how the world turns out.)
     - This is a principle from decision theory: dominance reasoning.

  2. The role of strict propriety (10 min):
     - Why did we use the quadratic scoring rule? What if we used a different rule?
     - Strict propriety: A scoring rule is strictly proper if for any probability function, the expected score (by its own lights) is minimized when it reports its own probabilities.
     - Why is this important? Because without it, we might have that a probabilistic function is dominated. For example, if we used the absolute value scoring rule (|1-x| if true, |x| if false), then the probabilistic function might be dominated by a non-probabilistic one? (Actually, the absolute value rule is not strictly proper.) We can show an example where a non-prob function dominates a prob one under an improper rule? But that might be too much. Instead, we can note: the theorem relies on the scoring rule being strictly proper. Otherwise, a probabilistic function might be dominated, and then we couldn't argue that non-probabilistic ones are dominated.

  3. The role of additivity (10 min):
     - We assumed that the total inaccuracy of a credence function is the sum of the inaccuracies for each proposition in the partition. Why?
     - What if we used a different aggregation? For example, the maximum of the individual inaccuracies? Or a weighted sum?
     - Without additivity, the dominance result might not hold. Moreover, additivity is a substantive assumption: it says that the inaccuracy of the whole credence function is separable and additive over the propositions. There are critiques of this (e.g., Joyce).

