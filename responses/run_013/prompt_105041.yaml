  - Whether accuracy is the only epistemic good: Defer without damage. The argument only aims to show that credences should be probabilistic, not that accuracy is the only good. But note: the argument assumes that accuracy is the only epistemic good (because we are using an accuracy measure). We might mention that if there are other goods, then being dominated in accuracy might not be enough to condemn a credence function. But we don't need to develop that.
