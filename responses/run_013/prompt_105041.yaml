answer: |-
  ### Session Design: Accuracy-First Argument for Probabilism  
  **Total Time:** 90 minutes  
  **Audience:** 6–7 philosophy PhDs fluent in Bayesian confirmation theory and decision theory rudiments (states, acts, expected utility, dominance).  
  **Goal:** Students grasp the dominance argument for probabilism, its assumptions (strict propriety, additivity), and the gap between dominance and irrationality.  

  ---

  ### 1. Order of Ideas with Dependencies  
  *(Dependencies: Each step builds on the previous; reversal is impossible without breaking the argument.)*  

  1. **Graded Accuracy & Scoring Rules (15 min)**  
     - **What:** Introduce accuracy as graded (not binary) using a scoring rule. Define the Brier (quadratic) score: For credence \(x\) in a proposition, score \(= (1 - x)^2\) if true, \(x^2\) if false. Lower score = better accuracy.  
     - **Dependencies:** Must start here to ground accuracy as epistemic good and define measurement. Reversing would confuse dominance calculations.  
     - **Tool:** Use the **three-possibility example** (mutually exclusive, exhaustive):  
       - Non-probabilistic credence \(c\): \(c(A) = 0.5, c(B) = 0.5, c(C) = 0.5\) (sums to 1.5 ≠ 1).  
       - Probabilistic credence \(d\): \(d(A) = \frac{1}{3}, d(B) = \frac{1}{3}, d(C) = \frac{1}{3}\).  

  2. **World-by-World Dominance (20 min)**  
     - **What:** Compute \(c\) and \(d\)’s scores in each world (A, B, C) using Brier score. Show \(d\) dominates \(c\):  
       - *World A*: \(d\)’s score \(= \frac{2}{3} \approx 0.666\), \(c\)’s score \(= 0.75\).  
       - *Worlds B/C*: Same by symmetry.  
     - **Dependencies:** Requires scoring rule from Step 1. Reversing (e.g., starting with probabilism) would make dominance seem ad hoc.  
     - **Key Insight:** Dominance is a world-by-world comparison (no probabilities over worlds).  

  3. **General Dominance Theorem (15 min)**  
     - **What:** Generalize the example: Any non-probabilistic credence function is accuracy-dominated by a probabilistic one under Brier score.  
     - **Dependencies:** Requires the example to motivate generality. Reversing would feel abstract and unmotivated.  

  4. **Dominance vs. Maximisation (15 min)**  
     - **What:** Contrast dominance ("better in every world") with maximisation ("better in expectation"). Emphasize: No probabilities over worlds are used or needed.  
     - **Dependencies:** Must follow dominance demonstration (Step 2). Reversing would conflate dominance with expected utility.  

  5. **Bridge to Irrationality (15 min)**  
     - **What:** Argue that dominated credences are irrational via a **bridge principle**: "If an option is dominated, it is irrational."  
     - **Dependencies:** Requires dominance (Step 2) and clarity on its non-maximisation nature (Step 4). Reversing would sever the link to normativity.  

  6. **Assumptions: Strict Propriety & Additivity (10 min)**  
     - **What:** Expose assumptions:  
       - *Strict Propriety*: Brier score ensures probabilistic credences are not dominated.  
       - *Additivity*: Total accuracy = sum of accuracies for individual credences.  
     - **Dependencies:** Must follow the theorem (Step 3) to show why assumptions are load-bearing. Reversing would bury key limitations.  

  ---

  ### 2. The Example: Can It Carry the Session?  
  **The Case:** \(c = (0.5, 0.5, 0.5)\) vs. \(d = (\frac{1}{3}, \frac{1}{3}, \frac{1}{3})\) over possibilities A, B, C.  
  **Jobs it Can Do:**  
  - ✅ **Graded Accuracy:** Scores are continuous (e.g., 0.75 vs. 0.666).  
  - ✅ **World-by-World Structure:** Compute scores in each world individually.  
  - ❌ **Pull of Incorrect Function:** Fails—students will dismiss \(c\) as incoherent (sum > 1).  

  **Fix for "Pull" Issue:**  
  - Replace \(c\) with a **plausible but non-probabilistic** function: e.g., \(c(A) = 0.4, c(B) = 0.4, c(C) = 0.3\) (sums to 1.1 ≠ 1).  
    - In World A: \(d\)’s score \(= \frac{2}{3} \approx 0.666\), \(c\)’s score \(= (1-0.4)^2 + (0-0.4)^2 + (0-0.3)^2 = 0.61\).  
    - *Problem:* \(d\) does not dominate \(c\) in World A (\(0.61 < 0.666\)).  
  **Solution:** Use \(c = (0.5, 0.5, 0)\) (sums to 1, but incoherent; \(c(C) = 0\) when \(C\) is possible).  
  - In World C: \(c\)’s score \(= (0-0.5)^2 + (0-0.5)^2 + (1-0)^2 = 1.5\), \(d\)’s score \(= \frac{2}{3} \approx 0.666\).  
  - *Now \(d\) dominates \(c\) in all worlds*, and \(c\) feels "reasonable" (no extreme values).  

  **Revised Example:** \(c = (0.5, 0.5, 0)\) vs. \(d = (\frac{1}{3}, \frac{1}{3}, \frac{1}{3})\).  
  - **Jobs Achieved:** Graded accuracy (scores differ continuously), world-by-world visibility, and pull (students see \(c\) as initially defensible).  

  ---

  ### 3. Misconceptions: Order and Debunking  
  *(Corrected & ordered as they arise in the session)*  

  1. **Accuracy is simply truth.**  
     - **When:** Step 1 (graded accuracy).  
     - **Debunk:** Contrast binary "true/false" with continuous scores—e.g., in World A, \(d(A) = \frac{1}{3}\) scores better than \(c(A) = 0.5\) but worse than 1.0.  

  2. **Any reasonable measure of closeness works.**  
     - **When:** Step 6 (assumptions).  
     - **Debunk:** Show that without strict propriety (e.g., absolute-value score), probabilism isn’t vindicated.  

  3. **The argument is circular (needs prior probabilities).**  
     - **When:** Step 4 (dominance vs. maximisation).  
     - **Debunk:** Stress that dominance compares actual world-by-world scores—no probabilities over worlds.  

  4. **It shows expected accuracy is fundamental.**  
     - **When:** Step 4 (dominance vs. maximisation).  
     - **Debunk:** Explicitly contrast dominance (world-by-world) with maximisation (requires probabilities).  

  5. **It tells you which credences to have.**  
     - **When:** Step 3 (general theorem).  
     - **Debunk:** Note the theorem only rules out non-probabilistic credences; it doesn’t pick a specific probabilistic one.  

  6. **Being dominated implies irrationality.**  
     - **When:** Step 5 (bridge principle).  
     - **Debunk:** Argue that the bridge principle is a substantive normative claim—not a given.  

  **Missing Misconception:**  
  - **Accuracy is the only epistemic good.**  
    - **When:** Step 5 (bridge principle).  
    - **Debunk:** Note the argument assumes accuracy is the *fundamental* good; other goods (e.g., coherence) are derived.  

  ---

  ### 4. Check for Understanding  
  **Single Question:**  
  > *"Why does the accuracy argument avoid needing probabilities over possibilities, and what does dominance imply about irrationality?"*  

  **Answers Revealing Mastery:**  
  - **Dominance + Bridge View:** Avoids probabilities by world-by-world comparison; dominance implies irrationality via the bridge principle.  
  - **Expected-Accuracy View:** Mentions "expected accuracy" or "maximisation," revealing conflation.  

  **If Using a Pair:**  
  1. *"Did we calculate expected accuracy at any point? Why or why not?"*  
     - **Correct:** No—dominance doesn’t require it.  
  2. *"Is dominance sufficient for irrationality? What does it depend on?"*  
     - **Correct:** Only via the bridge principle (and assumptions like additivity).  

  ---

  ### 5. What to Leave Out  
  **Omit Without Damage:**  
  - **Diachronic extensions:** Not needed for the synchronic probabilism argument.  
  - **Accuracy as the only epistemic good:** Mention as an assumption but defer debate.  
  - **Epistemic utility theory general framework:** Present accuracy-first as a motivation for it, but avoid framing as a "special case."  

  **Load-Bearing Notes:**  
  - **Accuracy as fundamental:** Required for the bridge principle (Step 5). State: "We assume accuracy is the core epistemic good—other virtues (e.g., coherence) derive from it."  
  - **Strict propriety & additivity:** Required for the theorem (Step 3) and must be flagged in Step 6.  

  ---

  ### Session Flow  
  **Board Layout:**  
  - Left: Three possibilities (A, B, C), \(c = (0.5, 0.5, 0)\), \(d = (\frac{1}{3}, \frac{1}{3}, \frac{1}{3})\).  
  - Center: Brier score calculations for each world.  
  - Right: Key concepts (Graded Accuracy, Dominance, Bridge Principle, Strict Propriety, Additivity).  

  **Timing:**  
  1. **Graded Accuracy & Scoring Rules (15 min)**  
  2. **World-by-World Dominance (20 min)**  
  3. **General Dominance Theorem (15 min)**  
  4. **Dominance vs. Maximisation (15 min)**  
  5. **Bridge to Irrationality (15 min)**  
  6. **Assumptions: Strict Propriety & Additivity (10 min)**  

  **Final 5 min:** Check for understanding (questions above).  

  **Closing Note:**  
  > "We’ve shown: Non-probabilistic credences are accuracy-dominated under additivity and strict propriety—and if you accept dominance as a guide to irrationality, they’re ruled out. What we *haven’t* shown: which credences to adopt, how to handle non-additive accuracy, or whether accuracy is the only good. Read Joyce (1998) for the full argument!"  

  This design ensures students reconstruct the argument from the board, prioritize dominance over maximisation, and spot the assumptions. The example does all three jobs with the fix, and misconceptions are debunked in sequence.
