  - Dominance view: It is irrational because there is an alternative that is more accurate in every possible world. No probability distribution is needed because we are comparing world by world.
  - Expected-accuracy view: It is irrational because it does not maximize expected accuracy. But then we would need a probability distribution to define expected accuracy.

