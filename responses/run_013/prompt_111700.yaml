  Okay, let me start by unpacking the user's query. They've spent an evening arguing about vagueness, specifically around sorites series and borderline cases. Their main struggle is reconciling their intuitive verdicts into a coherent theory. I need to identify which principles align with their stated positions and where conflicts arise.

  First, the user's key verdicts:
  1. No sharp boundaries in the sorites series—no specific pile is the last heap.
  2. The boundary isn't just convention; there's a fact of the matter.
  3. For any pile, "this is a heap" is either true or false.
  4. But for borderline cases, it's neither true nor false.
  5. The disjunction "heap or not heap" is still true for borderline cases.
  6. Tallness at median height: neither true nor false, no hidden fact.
  7. Legal age: sharp boundary by statute, fact of the matter exists.
  8. Compound predicates like "large heap": uncertainty if vagueness is inherited or emergent.
  9. Genuine borderline cases: unsure if the indeterminacy is ontological (world silent) or epistemic (world decided, unknown).

  The user's friend insists on choosing between epistemicism (hidden sharp boundaries) or ontological vagueness (world/language indeterminate). The user feels both options conflict with their other beliefs. 

  Looking at their verdicts, the biggest tension is between #3 (bivalence) and #4 (neither true nor false for borderlines). Supervaluationism handles this by allowing truth-value gaps while preserving classical logic for super-truth. Verdicts #1, #4, #5, and #6 fit here. Verdict #2 (non-conventionalism) might need refinement—supervaluationism sees boundaries as linguistic but still objective under all precisifications. 

  Epistemicism would satisfy #2 and #3 but force acceptance of sharp boundaries (contradicting #1 and #4). Degree-based theories (e.g., fuzzy logic) could handle #4 but make #5 ("heap or not heap") fuzzy, not clearly true. 

  For the legal case (#7), supervaluationism can accommodate stipulative definitions as precisifications aligning at a boundary. The "large heap" case (#8) suggests vagueness inheritance, but supervaluationism might handle this compositionally. Higher-order vagueness (#9) is a known challenge for supervaluationism, requiring multiple "definitely" operators or similar fixes. 

  The user's uncertainty about the nature of borderline cases (#9) isn't resolved—supervaluationism leans ontological, but epistemicism lurks as an alternative. However, their rejection of hidden facts (#6) makes epistemicism costly. 

  Overall, supervaluationism best preserves most verdicts, though it requires accepting that boundaries are settled by language conventions without being arbitrary. The user might need to soften #2 or embrace that "objectivity" comes from coherence across precisifications.
answer: |-
  Your pattern of verdicts aligns most closely with **Supervaluationism**, a mainstream theory of vagueness. I'll state the core principles, map them to your verdicts, identify tensions, then apply the theory to your additional cases. Here's the breakdown:

  ---

  ### **Core Principles of Supervaluationism**
  1. **Precisification Semantics**: A vague predicate (e.g., "heap") admits multiple *admissible precisifications* (ways to draw sharp boundaries consistent with usage).  
     → *Motivates Verdict #1*: No single pile is "the last heap" because different precisifications draw the boundary at different grains.  
     → *Motivates Verdict #2*: Truth isn't conventional because correctness depends on *all* admissible precisifications.  

  2. **Super-Truth/Falsehood**:  
     - A statement is **true** iff it is true on *all* admissible precisifications.  
     - **False** iff false on all precisifications.  
     - **Neither** iff true on some precisifications and false on others.  
     → *Motivates Verdict #4*: Borderline cases are neither true nor false (true on some precisifications, false on others).  
     → *Motivates Verdict #6*: "Tall" at median is indeterminate.  

  3. **Classical Logic Preservation**:  
     - Tautologies (e.g., *P or not-P*) are **super-true** (true on all precisifications), even for borderline cases.  
     → *Motivates Verdict #5*: "Heap or not heap" remains true.  

  4. **Bivalence Rejection**:  
     - While *sentences* about borderline cases lack truth values, the *metalanguage* quantifies over precisifications.  
     → *Resolves Verdict #3 Conflict*: "This is a heap" *could* be true/false relative to a precisification, but *simpliciter* it lacks a truth value.  
     → *Cost*: You must **give up Verdict #3** (that every instance is classically true/false).  

  ---

  ### **Tensions and Tradeoffs**
  - **Verdict #2 vs. #1**: You reject conventionalism but deny sharp boundaries.  
    → *Supervaluationist resolution*: Boundaries are fixed by *objective constraints of language use* (not choice), but multiple boundaries are possible. The "silence" is in language, not the world.  
    → *Cost*: Softens #2 — truth is "world guided" but not settled by reality alone.  

  - **Genuine Borderline Cases (Your Worry)**:  
    Supervaluationism treats vagueness as **semantic indeterminacy** (language hasn't decided, not world-silence). This rejects the epistemic "hidden fact" view.  
    → *Aligns with Verdict #6* (no hidden fact for "tall").  
    → *Forces rejection of epistemicism*: Your friend’s dichotomy is false; supervaluationism is a third option.  

  ---

  ### **Predictions for Additional Cases**
  1. **"Large heap" (inherited vagueness)**:  
     - Supervaluationism treats "large heap" as compositionally vague. If "heap" has precisifications H₁...Hₙ and "large" has L₁...Lₘ, admissible precisifications for "large heap" are *all combinations* Hᵢ ∩ Lⱼ.  
     - **Prediction**: Vagueness isn't merely inherited; new borderline cases can emerge (e.g., a pile that is borderline heap *and* borderline large). You must **refine your verdict**: Compound predicates *can* have "a life of their own."  

  2. **Legal "child" (stipulated boundary)**:  
     - The statute forces *all admissible precisifications* to align at exactly 18 years.  
     → **Prediction**: Verdict #7 holds — "child" has a sharp boundary. "Borderline" intuitions are mistaken (as you said).  

  3. **Higher-order vagueness (borderline "definitely a heap")**:  
     - Supervaluationism *struggles here*. If "definitely heap" means "true on all precisifications," its boundary should be sharp — but you intuit it’s vague.  
     → **Prediction**: Higher-order vagueness requires *admitting vagueness in "admissibility" itself* (e.g., borderline precisifications).  
     → *Cost*: Added complexity (e.g., a hierarchy of precisifications).  

  ---

  ### **Summary: What You Keep and Sacrifice**
  - **Best Fit**: **Supervaluationism**  
    - *Keeps Verdicts*: #1 (no sharp boundaries), #2 (non-conventional truth), #4 (neither T/F), #5 (P∨¬P true), #6 (no hidden fact), #7 (sharp stipulations).  
    - *Modifies*: #8 (compounds can have emergent vagueness).  
    - *Rejects*: #3 (bivalence for borderline sentences).  
  - **Cost of Simplicity**:  
    - If you insist on #3 (bivalence), you must adopt **Epistemicism** (sharp boundaries exist but are unknowable). This *saves #3* but *shatters #1, #4, and #6*.  
  - **Complexity for Consistency**:  
    - Supervaluationism + higher-order fixes (e.g., variable admissibility) preserves *all* verdicts except #3.  

  Your stance is coherent if you accept that borderline statements lack truth values despite our metalanguage being classical. The "no fact" is linguistic indecision — not ignorance or world-indeterminacy.  

  ---  
  **American English Note**: Terms like "iff" (if and only if), "simpliciter" (without qualification), and "precisifications" are standard in philosophy; alternatives would be less precise.
