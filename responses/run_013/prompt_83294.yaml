answer: |-
  This specific pattern **does have a name** within philosophy of science and scientific practice, though it's often discussed as a *persistent manifestation* of underdetermination rather than something entirely distinct. The clearest label is **"explanatory underdetermination"** or a **"virtue-theoretic stalemate,"** but unpacking the concept reveals its unique features and boundaries.

  Here's the breakdown:

  1.  **Core Names & Concepts:**
      *   **Explanatory Underdetermination:** This emphasizes that the underdetermination isn't just about *fitting the data* (empirical equivalence), but specifically about *what constitutes a genuine explanation* of that data. It highlights the dispute over *why* the data looks the way it does.
      *   **Virtue-Theoretic Stalemate / Contest:** This focuses on the core disagreement shifting to the evaluation of *theoretical virtues* (simplicity, parsimony, explanatory depth, unifying power, ontological economy, non-ad-hocness) themselves. These virtues, meant to be tie-breakers under empirical equivalence, become the *subject* of the dispute.

  2.  **How It Differs from Textbook Underdetermination:**
      *   **Textbook Underdetermination (Broad/Skeptical):** Posits that *in principle*, for any theory T fitting data D, there exists *some* rival theory T' that also fits D. T' is often a contrived, unnatural monstrosity (e.g., "The universe is exactly 5 minutes old, created with all the evidence of age"). **Key difference:** Your cases involve *live, actively developed, scientifically plausible* rivals, *not* mere skeptical possibilities.
      *   **Textbook Underdetermination (Practical/Transient):** Acknowledges that scientists must often choose between theories before all evidence is in, and different groups might reasonably prefer different options based on background assumptions or priorities. **Key difference:** Your cases persist *despite* ongoing research; new evidence generated by *both* programs continues to fit, and the stalemate centers on the *explanatory nature* of the theories rather than waiting for crucial evidence.
      *   **Duhem-Quine Thesis (Holism):** Explains how any theory can be protected from falsification by adjusting auxiliary hypotheses. **Key difference:** Holism explains *how* each side defends itself, but your description highlights the *persistent symmetrical stalemate* where *both* sides use holism effectively, and the conflict migrates to the *evaluation of the core explanatory move itself* (e.g., "Is this auxiliary hypothesis a justified part of the explanation or an ad-hoc fudge?").

  3.  **Defining Features of *Your* Scenario (Explanatory Underdetermination / Virtue Stalemate):**
      *   **Empirical Equivalence (for relevant data):** Both models fit the existing *and ongoing* shared dataset well.
      *   **Live Rivals:** Both are active research programs generating predictions, publishing, and defended by credible scientists.
      *   **Core Disagreement on "Explanation":** The dispute centers on whether the rival theory provides a *genuine explanation* or merely a *redescription/curve-fit*.
      *   **Symmetrical Accusations:** Each side accuses the other of the *same* fundamental flaw: being an empirically adequate but non-explanatory curve-fit.
      *   **Virtues in Dispute:** The stalemate hinges on conflicting interpretations/applications of theoretical virtues:
          *   **Side A (Simple Core):** Values ontological parsimony (Occam's Razor) and sees Side B's "invisible population" as an unjustified multiplication of entities (*ad hoc*). They argue simplicity *is* explanatory.
          *   **Side B (Complex Mechanism):** Values explanatory depth/unification. They see Side A's simplicity as *lacking* explanation – it "just is" or is a mere summary, failing to account for *why* the parameters take those specific values. The "invisible population" provides the *mechanism* or *reason*.
      *   **Lack of Decisive Test:** No currently feasible experiment can clearly falsify one core without complex adjustments acceptable to its defenders (holism at work).
      *   **Good Faith (Usually):** Accusations are about the *nature of the theory*, not fraud or incompetence.

  4.  **Boundaries: How to Tell This Apart**
      *   **Vs. Simple Curve-Fitting:** A genuine "curve-fit" model lacks predictive power beyond the fitted data, isn't part of a broader research program generating *novel* predictions, and its proponents wouldn't seriously argue it provides deep explanation; they'd acknowledge it's descriptive/phenomenological. In your case, *both* sides claim deep explanatory power and generate *novel* predictions.
      *   **Vs. Semantic Disagreement:** If the disagreement *only* stemmed from different definitions of a key term (e.g., "species," "intelligence"), clarifying definitions could resolve it. In your case, clarifying terms like "explanation" or "simple" *is the core dispute itself* and reflects deeper differences about what constitutes good science.
      *   **Vs. Transient Underdetermination:** If a crucial experiment *is* on the horizon and actively being sought, it's transient. If one model consistently struggles to incorporate *new types* of data without becoming unwieldy or losing support, the stalemate is breaking. Your case persists.
      *   **Vs. Paradigm Shift (Kuhn):** This is smaller in scale. Paradigm shifts involve fundamental changes in worldview, methods, and standards. Your stalemate happens *within* a shared framework (same data, similar methods), disagreeing on the interpretation *of that framework*.

  5.  **Why This Happens & How it (Eventually) Ends:**
      *   **Cause:** Science often operates where data is complex, noisy, or incomplete. Different scientific subcultures prioritize different virtues. What counts as "simple" (fewer entities? fewer equations? more intuitive?) or "explanatory" (mechanistic? unifying? predictive?) can vary.
      *   **Resolution:** Usually requires:
          1.  **New Data:** Not just more of the same, but data of a *different kind* that one model predicts naturally and the other struggles to accommodate without becoming blatantly *ad hoc* or losing empirical adequacy.
          2.  **Shifting Virtue Priorities:** The scientific community might gradually converge on valuing one virtue (e.g., mechanistic explanation) over another (e.g., extreme parsimony) for this domain.
          3.  **Theoretical Unification:** One model might prove more fruitful in linking to other successful theories in adjacent fields.
          4.  **Exhaustion:** One research program might simply stop generating interesting new insights or attracting new researchers.

  **Answering Your Editor:** Tell them, "It's not necessarily that one side is 'right' and the other 'wrong' in a way the current evidence can decide. Instead, we're seeing a deep scientific disagreement about what *counts* as the best explanation. Both models fit the facts, but they tell different stories about *why* those facts exist. This kind of 'explanatory stalemate' or 'virtue-theoretic impasse' is a common feature of cutting-edge science dealing with complex, indirect phenomena. It often takes fundamentally new kinds of evidence, or a shift in what the scientific community values most in an explanation, to resolve it. Right now, the debate is about the very nature of explanation itself within this field."
