prompt: |-
  I am preparing a seminar on theory change and I want to pin down what I actually believe about when a superseded scientific theory deserves credit for having got something right. My verdicts are these. Fresnel's wave optics, built around an elastic ether, was on the right track: its equations survive in Maxwell's theory, and it yielded the striking prediction of a bright spot at the centre of the shadow of a small opaque disk. Maxwell's ether was not a discovery but a mistake, and I am content to say the equations were retained while the medium was simply abandoned. Bohr's model of the atom was not on the right track, even though the energy levels it assigned to hydrogen are the levels quantum mechanics assigns; I will not say Bohr was approximately right about electrons in orbits. Newtonian mechanics was approximately true, and for me that means it is recovered as a limit of relativity, not merely that it predicted well within its domain. Carnot's theory of heat engines was framed in terms of caloric, and I take his results to be true, but I hesitate to call the caloric theory itself approximately true. The phlogiston theory of the eighteenth century, by contrast, I want to reject outright — and yet its central quantity can be mapped onto negative oxygen, so that the old scheme tracks the new one almost step for step.

  That last case is what defeats every principle I have tried. If the criterion is whether the old formalism reappears as a special or limiting case of the successor, phlogiston seems to pass as cleanly as Fresnel's equations, and I do not accept that. If the criterion is whether the old theory's central theoretical entities survive as entities in the successor, then the ether fails and Fresnel's optics fails with it, which I equally do not accept. Give me a principle, or a small set of rival principles, that reproduces as many of my verdicts as possible; for each clause, the case that forces it; what it says about a case I have not listed, such as the retention of Ptolemaic epicyclic machinery in Copernicus or the caloric reasoning behind Carnot's cycle; and an honest account of which of my verdicts the best version of it cannot accommodate. Argue from the cases — I do not want a reading list.
reasoning: |-
  Hmm, the user is preparing a seminar on theory change in the philosophy of science and wants help articulating their beliefs about when superseded theories deserve credit. They've provided several clear verdicts on historical cases like Fresnel's optics, Maxwell's ether, Bohr's model, Newtonian mechanics, Carnot's theory, and phlogiston theory. The phlogiston case is particularly tricky for them since it seems to structurally map to modern concepts but they still reject it outright.

  I need to identify a principle that explains their pattern of judgments. Their key distinctions seem to be: Fresnel gets credit for surviving equations and successful predictions despite the ether being wrong; Maxwell's ether is explicitly called a mistake; Bohr doesn't get credit even with correct energy levels because orbits were fundamentally wrong; Newton is approximately true as a limit case; Carnot's results are true but not his caloric theory; phlogiston is rejected despite structural mapping to oxidation.

  The challenge is phlogiston - it maps to "negative oxygen" which parallels Fresnel's equations mapping to Maxwell, yet they accept one and reject the other. Their rejection suggests that structural correspondence alone isn't sufficient. They seem to require that the old theory successfully refers to real entities or mechanisms, even if partially wrong. For Fresnel, the wave nature of light was correct even if the medium was wrong; for phlogiston, "dephlogisticated air" accidentally referred to oxygen but the core concept was inverted and misleading.

  I propose an "Achievement in Reference" principle: a superseded theory deserves credit when (1) its core empirical successes are preserved due to (2) its theoretical posits having achieved partial reference to real features of the world. The "partial reference" could be through three mechanisms: correct mechanism (Fresnel's waves), limit case correspondence (Newton), or structural preservation (Carnot's laws). Crucially, phlogiston fails because it achieved only accidental reference through inverted quantities.

  Testing against unlisted cases: Ptolemy's epicycles would be rejected as merely predictive devices without referential success, while Carnot's cycle equations would get credit as structural achievements. The principle explains most verdicts except possibly Maxwell's ether - the user calls it a "mistake" but might accept that Maxwell achieved partial reference to the electromagnetic field through the ether concept. I need to acknowledge this tension honestly.

  The principle handles Bohr's failure (orbits didn't refer), Carnot's success (equations refer to thermodynamic relations), and phlogiston's failure (inverted reference). It makes productive distinctions while accommodating the user's intuitive resistance to giving phlogiston credit despite formal mappings.
answer: |-
  Based on your specific verdicts and the challenge posed by phlogiston, I propose an **"Achievement in Reference"** principle, supplemented by a distinction about *how* the old theory latches onto reality. This principle prioritizes whether the superseded theory's core theoretical posits managed to successfully *refer* to real features of the world, even if partially or incorrectly characterized, and whether its empirical success *depended* on that partial reference.

  **The Principle:**

  A superseded theory T deserves credit for "getting something right" if:

  1.  **Partial Referential Success:** T's *core* theoretical posits or structures achieved *partial reference* to real entities, properties, relations, or mechanisms described by the successor theory S.
  2.  **Explanatory/Predictive Dependence:** T's key empirical successes (predictions, explanations) were *causally dependent* on this partial referential success, rather than being accidental or achieved *despite* fundamentally incorrect referential claims.
  3.  **Preservation of Success:** These key empirical successes are preserved or recovered within S (though potentially explained differently).

  **Mechanisms of Partial Reference (How T Latched Onto Reality):**
      *   **A. Correct Mechanism (Structure/Behavior):** T correctly identified the fundamental *kind* of entity, process, or structure, even if embedded in an incorrect ontology (e.g., Fresnel's waves).
      *   **B. Limit Case Correspondence:** T accurately describes the *behavior* of systems under specific, physically realizable conditions approximated by S (e.g., Newtonian mechanics).
      *   **C. Structural/Relational Preservation:** T correctly captured abstract *relations* or *mathematical structures* governing phenomena, even while misidentifying the relata (e.g., Carnot's laws).

  **Applying the Principle to Your Cases (Clause by Clause):**

  1.  **Fresnel's Wave Optics (Passes):**
      *   **Forces Clause 1 (Partial Referential Success - Mechanism A):** The core posit was *light as a wave phenomenon*. This successfully referred to a real feature of light (its wave nature), even though the specific medium (elastic ether) was wrong. The *mathematical structure* describing wave propagation and interference was largely correct.
      *   **Forces Clause 2 (Dependence):** The striking prediction of the bright spot (Arago spot) *depended crucially* on modeling light as waves undergoing interference. This success stemmed directly from correctly identifying the wave nature.
      *   **Clause 3 (Preservation):** The wave equations and predictions like the bright spot are preserved in Maxwell's theory (and QED).
      *   **Verdict Matched:** Yes, Fresnel was on the right track.

  2.  **Maxwell's Ether (Fails):**
      *   **Forces Clause 1 (Failure):** The core posit of the *luminiferous ether as a mechanical medium* did *not* achieve partial reference. There is no such medium. Maxwell's genius was in the *equations*, not the ontology he initially clothed them in.
      *   **Clause 2 (Irrelevant - Failure at 1):** Even though the equations were empirically successful, this success did *not* depend on the ether *being real*; it depended on the mathematical structure of the EM field equations, which survived *without* the ether medium.
      *   **Clause 3 (Preservation):** The equations were retained, but the medium wasn't.
      *   **Verdict Matched:** Yes, ether was a mistake, equations retained.

  3.  **Bohr's Model (Fails):**
      *   **Forces Clause 1 (Failure - Lack of Reference):** The core posits were *electrons in classical, determinate planetary orbits* with quantized angular momentum. This did *not* achieve partial reference. Electrons do not move in such orbits; the Bohr-Sommerfeld orbits are not recoverable features of QM (unlike energy levels). The quantization rule was an *ad hoc* fix, not a description of a real mechanism.
      *   **Clause 2 (Failure - Accidental Success):** The *correct energy levels* were a consequence of the *mathematical form* of Bohr's quantization condition applied to the Coulomb potential, accidentally aligning with the eigenvalues of the Schrödinger equation's Hamiltonian. It did *not* depend on electrons actually *being* in those orbits. The success (energy levels) was achieved *despite* the fundamentally incorrect picture of electron motion.
      *   **Clause 3 (Preservation):** The energy *values* are preserved.
      *   **Verdict Matched:** Yes, Bohr was not on the right track about orbits.

  4.  **Newtonian Mechanics (Passes - Mechanism B):**
      *   **Clause 1 (Partial Referential Success - Limit B):** The core posits (absolute space/time, instantaneous forces) did *not* refer directly to fundamental reality. *However*, the *behavioral laws* (F=ma, gravity as 1/r² force) *do* achieve partial reference: they accurately describe the motion of massive objects when speeds are small compared to light and gravitational fields are weak. This is a real, physically significant domain.
      *   **Clause 2 (Dependence):** Newtonian mechanics' empirical successes within its domain *depend* on these behavioral laws capturing the dominant dynamics accurately under those specific conditions.
      *   **Clause 3 (Preservation):** It is recovered as a limiting case of SR/GR.
      *   **Verdict Matched:** Yes, approximately true as a limit.

  5.  **Carnot's Caloric Theory (Partial Pass - Mechanism C):**
      *   **Clause 1 (Partial Referential Success - Structure C):** The core posit (caloric fluid) did *not* refer to a real substance. *However*, the *abstract relations* Carnot derived about the maximum efficiency of heat engines operating between two temperatures, and the necessity of a temperature difference, *do* capture fundamental thermodynamic *relations* (embodied in the 2nd law).
      *   **Clause 2 (Dependence):** Carnot's brilliant results *depended* on his reasoning correctly capturing these fundamental thermodynamic constraints and relationships, even while misidentifying the substance involved. His cycle analysis, though framed in caloric, revealed essential structural truths.
      *   **Clause 3 (Preservation):** The results (e.g., Carnot efficiency formula) are preserved in thermodynamics.
      *   **Verdict Matched:** Yes, results true, theory itself not approximately true (as it misidentifies the entities). Credit comes from structural/relational preservation (C), not approximate truth about caloric.

  6.  **Phlogiston Theory (Fails):**
      *   **Forces Clause 1 (Failure of Reference):** The core posit (phlogiston as a substance *released* during combustion/calcination) fundamentally misdescribed the phenomenon. Combustion involves *uptake*, not release, of oxygen. While "dephlogisticated air" accidentally *referred* to oxygen, the *central theoretical entity*, phlogiston, referred to *nothing real* – it was conceived as a positive substance when the relevant process (oxidation) involves a *negative* (electron gain/loss, though not known then). The mapping to "negative oxygen" highlights the *inversion*, not partial reference.
      *   **Forces Clause 2 (Failure - Accidental Mapping):** Any empirical success phlogiston theory had (e.g., tracking mass changes in some reactions via the *absence* of phlogiston, which was actually the *presence* of oxygen) was *accidental* and *depended on the inverse relationship*. The scheme "tracked step for step" *despite* getting the fundamental direction and nature of the process wrong, not *because* it captured a real entity or mechanism. Its successes were coincidental consequences of the inversion, not grounded in referring to real features.
      *   **Clause 3 (Preservation):** Some quantitative relations *can* be mapped, but the core explanatory framework is inverted and abandoned.
      *   **Verdict Matched:** Yes, rejected outright. The mapping is accidental/inverted, not referential success.

  **Unlisted Cases:**

  1.  **Ptolemaic Epicycles in Copernicus:**
      *   **Analysis:** Copernicus retained epicycles (and eccentrics) to account for non-uniform planetary speeds and other irregularities, believing in perfect circular motion. Epicycles were a core *descriptive device*.
      *   **Principle's Verdict (Fails):** The epicyclic machinery itself did *not* achieve partial reference to any real celestial structure or mechanism (like Keplerian ellipses + gravity). It was a mathematical tool for *saving the phenomena* within a geocentric (or even heliocentric-circular) framework. Its success depended purely on mathematical flexibility (like Fourier analysis), not on latching onto real orbital mechanics. Copernicus gets credit for the heliocentric *frame*, but *not* for retaining the epicycles as a "right track" feature. The epicycles are abandoned in Kepler/Newton.

  2.  **Caloric Reasoning behind Carnot's Cycle:**
      *   **Analysis:** As discussed above (Case 5), the *reasoning process* Carnot used, framed in caloric flow, led him to the correct abstract relations about heat engine efficiency. The *logic* of the cycle, considering heat flow from hot to cold reservoirs, was sound, even if the substance (caloric) was fictional.
      *   **Principle's Verdict (Passes - Mechanism C):** The *structural relationships* revealed by the caloric-based reasoning (e.g., work depends on temperature difference, reversibility) achieved partial reference to real thermodynamic constraints (2nd law). The success of Carnot's conclusions *depended* on this reasoning capturing these essential relations. The reasoning itself, while clothed in caloric, contained deep structural insights.

  **Honest Account of Best Fit & Your Verdicts:**

  *   **Best Fit:** This principle successfully captures **all** of your specific verdicts: Fresnel (Pass), Maxwell Ether (Fail), Bohr (Fail), Newton (Pass), Carnot (Partial Pass - Results/Structure), Phlogiston (Fail). It also handles the unlisted cases as you'd likely expect (Epicycles fail, Caloric reasoning passes structurally).
  *   **Best Version's Difficulty:** The principle handles your cases well. However, a potential tension exists in your view of **Maxwell's Ether**. You explicitly call it a "mistake" and seem content to say only the equations survived. The principle agrees. But one *could* argue (as some historical actors did) that the ether concept, while ultimately false, played a crucial *heuristic* role in developing the field concept – it was a scaffold that partially referred to *the need for a medium* or *the state of the vacuum*. Your verdict is clear ("not a discovery"), and the principle supports that by denying referential success to the *mechanical ether medium* itself. Where the principle *might* slightly under-describe your view is in the *heuristic value* you might grant the ether concept for Maxwell, even while firmly rejecting it as an ontological discovery. The principle focuses on ontological/epistemic credit for "getting something right," not heuristic value.

  **Core Argument from Cases:**

  Your pattern reveals that **structural similarity or formal recoverability alone is insufficient** (Phlogiston vs. Fresnel/Carnot). What matters is **how the old theory managed to latch onto reality** – did its core concepts partially *refer* to something real (Fresnel's waves, Newton's low-speed dynamics, Carnot's thermodynamic relations), and were its successes *dependent* on that partial grasp? Or were the successes accidental (Bohr's energy levels via an *ad hoc* rule), coincidental/inverted (Phlogiston's tracking), or achieved despite a non-referring ontology (Maxwell's equations surviving the ether)? Phlogiston is the key case forcing the "dependence" clause and the requirement that reference isn't merely inverted or accidental. Carnot forces the distinction between structural/relational reference and entity reference. Bohr forces the distinction between correct numerical results and correct mechanisms. This "Achievement in Reference" principle provides a coherent rationale for your nuanced judgments.
