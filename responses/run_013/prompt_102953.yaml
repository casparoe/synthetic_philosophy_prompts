  For the structure, I'll start by acknowledging the difficult gathering, then address what the commission has done without overclaiming. I'll distinguish between factual records and acknowledgment, validating why victims feel unheard when perpetrators declined to answer "why" questions. I'll address the state's overreach in waiving prosecution without pretending survivors were consulted. For the ending, I'll propose a concrete step: preserving the declined questions as a separate record to honor what victims asked but didn't receive.

  The tone must be solemn, precise, and avoid platitudes. I'll use phrases like "what we have gathered" instead of "truth established," and frame acknowledgments carefully - thanking people for their endurance rather than sacrifice. The final thesis will capture the core tension: that factual accounting and relational acknowledgment are distinct, and the commission delivered only the first.

  This approach honors the complexity without false resolution, ends with actionable accountability (the question archive), and stays within all constraints. The speech will validate all perspectives while holding the difficult truth that some needs remain unmet by design.
answer: |-
  ## Address by the Chair of the National Commission on Truth and Amnesty  
  Closing Ceremony, Republic of Marovia  

  Esteemed President, Honored Guests, Survivors, Former Combatants, Representatives of the People of Marovia:  

  We gather beneath a heavy sky. Twelve years of conflict echo in this silence. Fourteen months ago, the window for amnesty closed. Today, this Commission closes its doors. We hand over a report, a list of names granted amnesty, a list of names denied it. We speak, finally, to the room we have listened to for years – a room filled with pain, with relief, with anger, and with a profound, weary hope for something different than what came before.

  This Commission was born of a hard bargain, struck when neither side could impose its will, only cease the bleeding. Our mandate was precise, defined by statute: to gather the facts of gross violations committed by all parties to the conflict, and to grant amnesty – conditional, individual amnesty – to those who came forward and fully disclosed their politically motivated offenses in a public hearing. We were not tasked with judging the soul, only the statement. Remorse was neither sought nor recorded. The facts, we were told, would suffice.

  And facts we gathered. Through 2,300 public disclosures, a vast landscape of violence has been mapped. Dates, places, methods, chains of command – these details, once shrouded in denial and fear, now form a record. Names of the lost are spoken where silence ruled. Patterns of atrocity are laid bare. This archive of *what* happened is immense. It is tangible. It exists. This is the work the statute demanded, and this work has been done. To every applicant who came forward and met the test of full disclosure, however difficult, however late, we acknowledge the act of speaking into the record. To the survivors and families who demanded this accounting, who fought for the principle that the hidden must be revealed, we acknowledge your tenacity. This record is your achievement. It stands.

  But we gather in this room, and we know the record is not the only thing that stands here. The air is thick with questions that hang, unanswered. The statute granted a crucial, fragile power: the right of a designated family member to ask an applicant three questions. And the statute held a consequence: refusal to answer, without leave of the panel, meant forfeiting amnesty. In practice, panels granted leave generously. And in practice, a great many applicants used that leave. They spoke volumes on *what* they did, but when asked *why* – why this house? Why this son? Why this day? – they exercised their right to silence. They declined.

  Hear this clearly: They acted within the rules of this process. The Commission made no finding against them for this silence. But we cannot pretend that silence is neutral. We cannot pretend that the mountain of facts we built answers the question etched on a mother’s face, or a brother’s clenched fist. A fact recited into a microphone is one thing. An answer offered *to* the one who asks “Why me? Why mine?” is something else entirely. That *answer*, that direct acknowledgment given *to the person wounded*, is a different kind of good. It is relational. It is something one human being might seek from another. Our process, by its design, produced the first in abundance. It often left the second painfully absent. The record is full, yet many of you stand before it, holding your three unanswered questions, feeling an emptiness no archive can fill. That emptiness is real. It is not a failure of your understanding, nor a shortcoming of your endurance. It is a consequence of a process that could compel disclosure of deeds, but could not compel the human response that lives between the lines of testimony. The Commission gave you facts. It could not force the acknowledgment you sought. This silence is part of our record too.

  And this leads to the second weight we bear today. This Commission granted amnesty. In doing so, acting for the state born from the peace accord, it waived the right to prosecute those individuals for those specific crimes. We did this based on the statute, based on the applicants’ disclosures, based on the calculation that this price was necessary to secure peace and this unprecedented accounting.

  But we must name the difficult truth: When the state waives prosecution, it disposes of a claim. And the claim for justice arising from a violated body, a shattered family, a burning home – that claim originates not with the state. It originates with the person harmed, the family destroyed. The state asserts a right to act *on behalf of* the social order, but the core of the injury, the primal cry for justice, belongs first to the victim. The state, especially a state emerging from the very conflict where its own agencies may have been perpetrators or bystanders, steps forward and says, “We will set this claim aside.” This act – necessary perhaps for the peace we have, bargained for under the shadow of continued war – is an act of profound assumption. It assumes an authority over a claim that was never solely, primarily, *the state’s to relinquish*.

  To the members of the victims’ caucus, who have consistently named this as a pardon issued over your heads, in your name, by an entity that did not suffer your specific loss: yours is not a complaint. It is an objection grounded in a fundamental principle. It points to a deep tension inherent in any amnesty granted by a state following mass atrocity. We did not consult you on the bargain that created this Commission. The state did not. The statute did not ask us to seek your consent for each amnesty granted. We followed the law we were given. But the law did not, could not, erase the moral reality that the state acted upon a claim it did not originate and could only imperfectly represent. We waived a prosecution that belonged, in its deepest essence, to others. Pointing to the alternative – a war that did not end – explains the necessity. It does not dissolve the objection. The state assumed a power over your claim. That assumption is real. The grievance that flows from it is legitimate. It cannot be answered away by the scale of the record or the fear of what might have been. It stands alongside the archive we built.

  So, what do we hand over today?
  *   We hand over a detailed record of *what* happened, as disclosed by those who did it.
  *   We hand over a list of those granted amnesty for meeting the statutory test of disclosure.
  *   We hand over a list of those denied amnesty, nearly all for failing that test of disclosure.
  *   We hand over the silence where answers to “why” were declined.
  *   We hand over the unresolved tension of a state waiving claims it did not create.

  This Commission was a mechanism, not a resolution. It could not deliver reconciliation. It could not deliver the personal acknowledgment so many sought. It could not absolve the state of the complex weight of its bargain. What it *could* do, and what it *has* done, is replace deliberate silence with a permanent record. It has forced a granular, public accounting onto the historical ledger. It has provided a foundation of verified facts, however painful, however incomplete in answering every human need.

  This foundation belongs to you, the people of Marovia, now. What you build upon it is your task, your burden, and your hope.

  My final duty as Chair is not merely to declare our work ended. It is to make a concrete commitment on behalf of the Commission and the state we served. The questions asked by family members – including every question declined by an applicant – are part of the official record. These questions represent the specific, human need for understanding that often went unmet in the hearing room. **Therefore, we commit this: The National Archives will establish and maintain, in perpetuity, a dedicated, publicly accessible volume entitled “The Unanswered Questions.” It will contain, verbatim, every question put to an amnesty applicant by a designated family member during the hearings, alongside the name of the victim to whom it pertained and the name of the person who asked it. Where an answer was declined, that fact will be clearly marked. This volume will stand alongside the Commission’s main report and the transcripts of testimony, a permanent testament to what was asked, and what remains.** The questions mattered. The asking mattered. They will not be forgotten in the archive.

  We close not with healing, not with closure, not with easy unity, but with the hard-won facts, the unresolved tensions, the enduring questions, and the solemn duty of memory. The work of this Commission is complete. The work of Marovia continues.

  May this record serve you.

  THESIS: The Commission delivered an unprecedented factual record through compelled disclosure but could not compel the relational acknowledgment sought by victims through their questions, and the state's necessary but profound act of waiving prosecution assumed an authority over victims' inherent claims that remains a legitimate, unresolved grievance.
