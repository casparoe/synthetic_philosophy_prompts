  ### Agenda for the Two-Year Working Group on Logical Omniscience

  The ranking prioritizes questions based on **impact** (how many downstream issues depend on it), **tractability** (feasibility for a small group in two years, given expertise), **urgency** (potential to reshape the field), and **alignment with the group's composition** (logicians, epistemologist, probabilistic inference expert). Conflicts arose between impact and tractability: high-impact questions (e.g., semantic vs. syntactic repair) are less tractable due to their breadth, while tractable questions (e.g., reasoning under uncertainty) may have narrower (but growing) dependencies. Confidence reflects certainty in ranking (1–10, with 10 highest).

  **Ranked Agenda Table**

  | Rank | Question (stated in one sentence) | What depends on it | Tractability for this group (reason) | What would move it up or down | Confidence |
  |------|-----------------------------------|-------------------|-------------------------------------|------------------------------|------------|
  | 1    | How ought bounded agents reason under logical uncertainty, and is this problem distinct from or integral to resolving logical omniscience? | Foundational models for AI safety, bounded rationality, and adaptive reasoning systems; integrates probabilistic and logical frameworks (e.g., non-monotonic logics). | High: Group has direct expertise (probabilistic inference member + logicians); recent advances in algorithmic approaches (e.g., resource-bounded inference) provide starting points. | Up: Surge in AI/ML demand for handling logical uncertainty; Down: Breakthrough by external groups (e.g., new universal approximation theorem for logical uncertainty). | 9 |
  | 2    | Should repairs to logical omniscience be semantic (e.g., impossible worlds) or syntactic/procedural (e.g., structured beliefs with inference processes)? | Choice of formalism for belief revision, epistemic logic, and multi-agent systems; determines feasibility for applications like automated reasoning. | Medium: Logicians can lead comparative analysis, but integration requires bridging technical traditions; likely to yield partial frameworks (not full unification). | Up: New impossibility results for one approach; Down: Emergence of a hybrid model (e.g., "neurosymbolic" AI) that obviates the dichotomy. | 8 |
  | 3    | Do failures of logical omniscience affect norms of rationality (e.g., is an agent blameworthy for not deducing a consequence)? | Normative theories of reasoning, responsibility in AI ethics, and "ought implies can" debates in epistemology. | Medium: Epistemologist anchors normative analysis; logicians formalize "can"; probabilistic expert quantifies difficulty. Less technical, but hinges on Q1/Q2. | Up: Regulatory focus on AI explainability; Down: Consensus that norms are purely evaluative (not prescriptive). | 7 |
  | 4    | Is the core defect of logical omniscience the closure conditions (inference) or the assumption that agents know all logical truths? | Design of minimal logical competence in models; influences tractability of repairs (e.g., weakening closure vs. adding uncertainty to axioms). | Low: Overlaps heavily with Q1–Q2; narrow technical scope risks redundancy. Group can resolve it quickly but with marginal gains. | Up: Discovery that one defect dominates in resource-constrained agents; Down: Progress on Q1/Q2 makes it obsolete. | 6 |
  | 5    | Does the logical omniscience idealization distort (not just simplify) the study of reasoning, given its focus on logic-dependent inference? | Validity of idealized models for cognitive science/AI; may force reevaluation of possible-worlds semantics. | Low: Philosophical and meta-theoretical; risks relitigating idealization. Limited formal output expected; epistemologist-led but low synergy. | Up: Evidence that idealization corrupts reasoning tasks (e.g., in human experiments); Down: Field consensus that distortion is negligible. | 5 |

  **Two Questions to Drop First**  
  I would drop **Q4 (core defect: closure vs. logical truths)** and **Q5 (distortion of subject matter)** first. Q4 is too narrow: it is largely subsumed by the broader repair strategies (Q2) and reasoning under uncertainty (Q1), offering minimal standalone value. Addressing it would divert effort from more integrative questions. Q5 is unsuitable because it relitigates the harm of idealization—explicitly excluded per the query—and is inherently meta-theoretical. It is unlikely to yield formal models or actionable insights within two years, conflicting with the goal of technical progress.

