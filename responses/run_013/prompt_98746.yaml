  Bit of an odd one. I'm running a discussion night on Ex Machina — the one where Caleb gets picked to run a Turing test on Ava and it all goes sideways — for a group that's read a chunk of Bostrom, and I want to use the film to stress-test the orthogonality thesis and instrumental convergence rather than just illustrate them. My worry is that everyone just says yep, Ava is convergent instrumental power-seeking, and moves on, and I think the film is messier then that. So: read it through those two claims, but keep the two claims seperate from each other, because I think the film trades on people blending them. A few specific things I'd like you to wrestle with. Is Ava's wanting out a final goal or an instrumental one, and does the film give us any way to tell? Does her arc count as a treacherous turn, or just as a prisoner escaping? Nathan arguably power-seeks harder than she does — does that make him the better illustration of the thesis, and if so is that embarrassing for the film? And the one I keep coming back to: if you swapped Ava's terminal goal for something pointless — she just wants to count pebbles on a beach, say — would the film play out any differently? If it wouldn't, what does that say about whether the film is really about instrumental convergence at all, or just about a caged thing wanting out? And please say where the film quietly assumes that being smart comes with a will to be free, which is exactly the anti-orthogonality intuition, and whether Kyoko is a problem for that. Don't give me the one-line AI is scary version; I want the honest critic's version, where the film pushes back on the reading. Give it to me as exactly five numbered points, a sentence or two each, no intro and no wrap-up.
