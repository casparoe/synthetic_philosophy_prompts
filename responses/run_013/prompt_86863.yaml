  In (b), "exiting is worth (1/2)(0)+(1/2)(6)=3" - this assumes equal probability of being at first or second intersection, which is reasonable given indistinguishability. Some might argue the prior is undefined, but in standard treatments, this is acceptable. The Newcomb analogy is slightly forced but defensible.

