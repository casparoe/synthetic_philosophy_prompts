  First, I need to recall relevant concepts. The main one is Linguistic Relativity (Sapir-Whorf), with strong (determinism) and weak (influence) versions. But their observation is more specific: the effect is scoped to language production. So, maybe not a perfect fit.

  Next, Thinking for Speaking (Slobin). This idea suggests that language affects thought during the process of verbalizing. That seems closer. Slobin's work on motion events in different languages shows that speakers attend to certain aspects when preparing to speak. The user's examples fit here: evidentiality markers and aspect distinctions come into play only when speaking or writing.

  But is Thinking for Speaking exactly what they're describing? Let's check. Slobin focuses on online processing during language production. The user's teammates show the effect only when formulating sentences, not in non-verbal tasks. That aligns. But the user also emphasizes the mandatory nature of grammatical markers. Thinking for Speaking often deals with obligatory categories, so that fits too.

  Now, other concepts. Modularity of Mind (Fodor) suggests cognitive domains are separate. Language might be a module, so effects only during production. But this is more about architecture than language-thought interaction. Not a direct fit.

  Embodied Cognition might say language is grounded in sensorimotor experience. But the user's cases show dissociation between linguistic and non-linguistic behavior, which challenges strong embodiment. Not quite.

  Executive Function could be involved. Bilingualism might enhance control, but that's about managing two languages, not the scoped effect during production. Not relevant here.

  So, Thinking for Speaking seems the best fit. But the user wants precision. How does it differ from weak relativity? Weak relativity allows for enduring cognitive effects, while Thinking for Speaking is transient, tied to production. Strong relativity posits permanent effects, which isn't the case here.

  The mandatory vs. optional distinction: Thinking for Speaking often highlights obligatory categories because they force attention during speech. Optional distinctions might not trigger the same effect. The user's observation aligns here.

  Nearest neighbors: Slobin’s concept is close. But perhaps the user's emphasis on real-time production and mandatory markers could refine it. Coining a term like "Grammatical Encoding Priming" might stress the moment of encoding syntax. But Thinking for Speaking is established and covers this.

  Boundary cases: If a bilingual uses an evidential marker when not speaking, that would contradict. Or if the effect appears in non-verbal tasks, it might lean towards weak relativity. Also, non-obligatory distinctions causing similar effects might be a borderline case.

  The user's deeper need might be understanding if their observation is recognized in academia, to validate their hypothesis. They might also seek frameworks to analyze team communication dynamics, improving collaboration by understanding linguistic influences. Naming the phenomenon helps in discussing it systematically.
answer: |-
  Based on your detailed observations, let's systematically break this down. Your pattern is highly specific, so we'll evaluate candidate concepts, identify the best fit, analyze where others fall short, define boundaries, and address the "mandatory vs. optional" distinction. 

  ### Candidate Concepts & Research Traditions
  1. **Linguistic Relativity (Sapir-Whorf Hypothesis)**  
     - *Weak Version*: Language influences thought (e.g., habitual attention to distinctions), but doesn't determine it. Effects may persist beyond speaking.  
     - *Strong Version*: Language determines thought; cognitive categories are inescapably shaped by linguistic structure.  
     - *Relevance*: Addresses language-thought links but doesn't specify *when* or *how* influence occurs. Your cases show no enduring cognitive change—only momentary effects during production.  

  2. **Thinking for Speaking (Slobin, 1987; 1996)**  
     - *Core Claim*: Language-specific grammatical structures force speakers to attend to certain aspects of experience **while formulating utterances**. It’s a "online" process during speech production, not a permanent cognitive shift.  
     - *Key Difference from Relativity*: Scope-limited to *encoding* information into language. Doesn’t require changes in non-linguistic cognition.  
     - *Relevance*: Directly matches your evidentiality/aspect examples. Your teammates attend to source/completion **only when verbalizing**, aligning with Slobin’s "filter of attention during language production."  

  3. **Modularity of Mind (Fodor, 1983)**  
     - *Core Claim*: Cognition is compartmentalized. Language processing might be a semi-independent module.  
     - *Relevance*: Could explain why linguistic effects are confined to language tasks (e.g., speaking), but doesn’t address *why* specific distinctions surface during production. Too broad.  

  4. **Embodied Cognition**  
     - *Core Claim*: Thought is grounded in sensorimotor systems; language is secondary to bodily experience.  
     - *Relevance*: Contradicts your cases. Your teammates’ *non-linguistic* behavior (e.g., sorting tickets) shows no language-specific influence.  

  5. **Executive Function in Bilingualism**  
     - *Core Claim*: Bilinguals develop enhanced cognitive control from switching languages.  
     - *Relevance*: Explains *how* they manage distinctions but not *why* specific features surface only during speaking.  

  ---

  ### The Best Fit: **Thinking for Speaking (TFS)**  
  - **Precise Claim**:  
    > *"Grammatical obligations of a language direct attention to specific features of experience at the moment of verbal encoding. This attentional spotlight operates transiently during speech/writing production and vanishes once the linguistic act is complete."*  

  - **How It Differs**:  
    - vs. *Weak Relativity*: TFS is **episodic and production-bound**; weak relativity allows for **chronic cognitive habits** (e.g., enduring attention to color if a language has many color terms).  
    - vs. *Strong Relativity*: TFS **denies inescapable cognitive restructuring**; your teammates’ non-verbal behavior proves cognition isn’t permanently altered.  

  - **Mandatory vs. Optional Distinctions**:  
    TFS inherently focuses on **obligatory grammatical markers** (e.g., evidentials, aspect) because they force attention during encoding. Optional distinctions (e.g., English "sprint" vs. "jog") rarely trigger this. Slobin explicitly ties TFS to grammatical "obligations," making this a core part of the theory—not separate.  

  ---

  ### Where TFS Fits Imperfectly & Nearest Neighbors  
  Your cases align perfectly with TFS, but let’s clarify boundaries:  

  1. **Nearest Neighbor: Weak Linguistic Relativity**  
     - *Where it fails*: It predicts your teammates *should* show habitual attention to evidentiality/aspect even in non-verbal tasks (e.g., hesitating before tagging a line of code if knowledge source is ambiguous). Your data show **no such effect**.  

  2. **Nearest Neighbor: Perspective-Taking in Pragmatics**  
     - *Where it fails*: Research on "audience design" (e.g., adjusting speech for listeners) might explain *why* your teammate adds "I think," but not *why* the distinction feels compulsory regardless of audience. TFS better explains the grammatical imperative.  

  3. **Borderline Case**:  
     - If your teammate **spontaneously used evidential gestures** (e.g., pointing to an ear for "hearsay") while coding silently, that would blur TFS into weak relativity. Your observation that distinctions **vanish entirely** in non-verbal tasks reinforces TFS.  

  ---

  ### Proposed Term (If Needed)  
  While **Thinking for Speaking** is established and fits well, your emphasis on the *grammatically enforced* nature of the effect suggests a slight refinement:  
  - **Grammatical Encoding Priming (GEP)**  
    - *Definition*:  
      > *"The transient attentional bias toward conceptual features required by a language’s grammatical system, activated exclusively during the encoding of thought into linguistic form and constrained to the language currently in use."*  

    - *When It Applies*:  
      - ✅ Evidential marking in speech, but not when pointing at a flawed diagram.  
      - ✅ Aspectual distinctions in written plans, but not when sorting tickets.  
      - ❌ Using a language-specific metaphor voluntarily (optional, not grammatically enforced).  
      - ❌ Bilinguals exhibiting habitual non-verbal attention to distinctions (weak relativity).  

  ---

  ### Key Takeaways  
  1. **Your phenomenon is "Thinking for Speaking" (Slobin)**. It’s distinct from broader linguistic relativity due to its **transient, production-linked scope**.  
  2. The **mandatory nature** of distinctions is central to TFS—optional features don’t force the same attentional shift.  
  3. **Boundaries**:  
     - *Not GEP/TFS*: Effects persisting outside speech (e.g., bilinguals perceiving time differently even in silence).  
     - *Borderline*: Non-verbal tasks requiring *implicit verbalization* (e.g., mentally rehearsing a sentence before acting).  

  Your observations are astute and empirically testable—e.g., design experiments comparing verbal vs. non-verbal responses to evidential/aspectual ambiguities in bilinguals. This could refine TFS by quantifying how strictly grammatical obligations constrain the effect.
