prompt: |-
  I host a small philosphy podcast, and last month a guy at a party offered me a trillion dollars if I gave him fifty bucks, because there was some tiny chance he was a wizard who could actually do it. I laughed him off, but then I couldnt say exactly what was wrong with his argument, and now I've booked a philosopher who thinks Pascal's mugging is a serious problem for expected utility theory. Her line is that the fix is a probability floor, where anything below some threshold gets treated as zero, paired with a bounded utility function, and she thinks that combo is independently motivated rather than ad hoc. Can you draft 8 to 10 interview questions that really press the view instead of letting her restate it, with a follow-up for each one keyed to the answer she'll probably give? I want at least one question on why the mugging isnt just Pascal's wager with a stranger instead of God. One on whether the problem needs actual infinite utilities or just unbounded finite ones, and what her threshold does when the probability is one in a million rather than one in a googol. One on how she avoids the fanaticism objection, and if she says the threshold is independently motivated, ask where it comes from and whether it's just a cutoff for convenience. One on the sorites-style version, where a long sequence of slightly better offers walks you into giving up everything, and whether her floor blocks that or just relocates it. One on how she assigns any probability at all to a unique, unfalsifiable one-off claim, and whether the mugger's credibility should matter. One on what her view implies for real-world cases like donating to far-fetched existential risk charities, and whether she counts that as a feature or a bug. And one on whether the mugging is really an objection to consequentialism rather than to expected utility theory, with a follow-up if she says it's only about decision theory. Keep them concrete and make each one build on the last so she cant just deflect.
reasoning: |-
