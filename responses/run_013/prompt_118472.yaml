answer: |-
  ## Sestina for a Disposition Doubted

  This brittle **thing** awaits the sharp **trigger**,
  Its nature poised to **manifest** a break.
  **If** struck just so, it **would** shatter clean,
  An **unless** withheld by unseen hands.
  The law seems plain: the blow applied
  Means fragments scattered, duty done.

  But see, the blow arrives, the work is **done**
  Upon the waiting, fragile **thing**.
  The force is felt, correctly **applied**,
  The perfect, sudden **trigger** struck.
  Yet silence holds. No crack, no sound. What **hands**
  Prevent the destined **manifest**?

  Was there a shift? Did something **manifest**
  Before the blow, a change now **done**
  By forces working with unseen **hands**?
  The core remains the selfsame **thing**,
  But when the crucial **trigger** pulled,
  The old response was not **applied**.

  Or watch this other force, **applied**
  To block the fracture, **manifest**
  A shield just as the **trigger** acts.
  The breaking ought to be **done**,
  It’s wired deep within the **thing**,
  Yet thwarted by external **hands**.

  Consider too the phantom **hands**
  That craft a break where none’s **applied**,
  A perfect fake **manifest**
  On something never built **done**
  For shattering. This hollow **thing**
  Mimics the true response to **trigger**.

  So strike the test, pull the **trigger**!
  Where are the shaping, guarding **hands**?
  Observe the simple, waiting **thing**.
  The force of law is still **applied**:
  "If struck, it **would** break." This is **done**,
  The expected truth **manifest**.

  Yet when the **trigger** makes its claim, **manifest**
  Fails, blocked by **hands** unseen. **Applied**
  Logic proves hollow. **Done**? The **thing** remains. **Unless**…?

  **Unless** the **thing** holds fast its hidden weight,
  Beyond the **if**, the **would**, the test **applied**.
  The **trigger** comes and goes; the **manifest** stays mute.

  ---

  Okay, here's where I leaned on the ideas: I used "unless" as the catch-all for exceptions/blockers instead of something like "always", feeling it offered more poetic tension and better implied a condition failing. "Would" stands in for the modal necessity, though I know the debates around which modal exactly. I compressed the manifestation-blocking interloper into a single image ("shield just as the trigger acts") for flow, rather than elaborating on the disposition persisting untouched. The envoi focuses on the disposition itself ("hidden weight") persisting despite the conditional's failure, leaning towards the realist intuition without declaring victory, and lets "mute" carry the unresolved stalemate. The phantom hands producing the fake break is the mimic case. I avoided any direct naming like "fink" or "mask", letting the events described point to them for those who know. The point was to make the form's rotation feel increasingly inadequate at capturing the core 'thing', culminating in the envoi where the missing concept ("disposition" as primitive) is the hidden subject. Hope it captures the quiet frustration of the analysis failing while the phenomenon persists.
