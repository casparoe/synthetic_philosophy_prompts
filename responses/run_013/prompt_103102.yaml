prompt: |-
  I work on higher-order evidence, and I have been trying to determine what my own verdicts about it come to. I would like you to extract the principle — or the best small set of competing principles — that fits the pattern below. State each candidate precisely, attach each clause to the case that motivates it, say what it predicts for cases I have not described, and tell me plainly which of my verdicts it cannot accommodate.

  In each case I give the situation and then my verdict.

  1. Long sum, general news. I am a reliably accurate mental calculator. Working through a long sum, I reach 4,872 and feel confident. I then learn of a well-conducted study (stipulated, for our purposes) finding that people of my general profile, on sums of this length, make undetectable errors about one time in five. My verdict: I should markedly lower my confidence and should not assert 4,872 to others, but I am still rationally permitted to believe the answer is 4,872 rather than suspend judgment.

  2. Long sum, present-state news. The same sum, the same felt confidence — but I have had three drinks and know that people in my state make frequent undetectable errors at exactly this kind of computation. My verdict: I must suspend judgment; believing 4,872 is not rationally permitted, even though I feel just as sure.

  3. Peer disagreement. Two equally trained and equally careful paleontologists examine the same fossil and reach opposite conclusions about whether it belongs to a new species; each knows the other's credentials and that the other is about as likely to be right. My verdict: each should move substantially toward the other's view, and neither may retain full confidence.

  4. An undetectable condition. A mathematician completes a long proof and is convinced it is valid. She is then reliably informed that she has a stipulated condition — call it Lund's drift — that leaves her reasoning unimpaired as she experiences it but raises the rate of undetectable slips in multi-step derivations to about one in three. My verdict: she must suspend judgment about the proof's validity; continued confidence is not rationally permitted.

  5. Screened-off higher-order evidence. A detective reasons to a conclusion using a method that is, in general, unreliable. She then learns that the method fails only because most users omit a particular cross-check, and that she in fact performed that cross-check. My verdict: she may retain full confidence in her conclusion, with no discount whatsoever.

  6. Akrasia. A philosopher is persuaded by her first-order evidence that a thesis T is true. She is also persuaded, on higher-order grounds — she knows that people who reason about T the way she did are usually mistaken — that her believing T is irrational. My verdict: she cannot rationally occupy both states at once; the combination is impermissible, even though there is something to be said for each state on its own.

  Two features of this list are what make it hard. Cases 1 and 2 both give me news that I am unreliable at the very task in front of me, yet I treat them differently. And case 5 appears to give higher-order evidence no weight at all, which sits uneasily with cases 2 and 4.

  What I want from you:

  (a) The principle, or the small set of competing principles, stated precisely enough that I could apply it to a fresh case without further interpretation. If more than one candidate is needed, say what each gets that the others do not.
  (b) For each clause, the case that forces it.
  (c) The verdicts of your preferred principle on at least two further cases that you devise: one in which the higher-order evidence is itself supported only by testimony I have reason to distrust, and one in which the first-order and higher-order evidence bear on the same proposition rather than on the same faculty.
  (d) An honest statement of which of my six verdicts your principle cannot accommodate, and, if you think a verdict should be revised rather than saved by added complexity, say which one and what the revised set of verdicts looks like.

  Please write in American English.
reasoning: |-
  Hmm, the user is working on higher-order evidence in epistemology and wants me to extract principles that explain their specific verdicts across six cases. This is quite an advanced philosophical request that requires careful analysis.

  Looking at their cases, I notice several key tensions: Cases 1 and 2 both involve reliability challenges but get different treatments; Case 5 seems to ignore higher-order evidence entirely while Cases 2 and 4 demand deference; and Case 6 involves akrasia where conflicting states are deemed impermissible. The core challenge is finding principles that respect these asymmetries without contradiction.

  I think the most promising approach involves distinguishing between general reliability information and task-specific competence impairments. Cases 1 and 4 suggest that mere statistical unreliability requires confidence adjustment but not necessarily suspension, whereas Cases 2 and 4 indicate that current impairment mandates suspension. This points to a distinction between corrigible and incorrigible error risks.

  For Case 5, the critical factor seems to be the screening off of unreliability - if the higher-order evidence doesn't apply to this particular instance, it loses force. And Case 6 reveals that rational states must cohere, even when evidence pulls in different directions.

  I'll formulate the Impaired Task Competence Principle and Higher-Order Screening Principle to capture these nuances. The first principle handles when higher-order evidence forces suspension (Cases 2,4) versus mere confidence reduction (Case 1), while the second explains when such evidence can be dismissed entirely (Case 5). Both principles together address Case 3's peer disagreement and Case 6's akrasia prohibition.

  For the test cases, I'll consider a scenario where higher-order evidence comes from untrustworthy testimony (should weaken its impact) and another where first/higher-order evidence directly conflict on the same proposition (likely creates rational tension). The principles seem robust in these extensions.

  The main limitation appears with Case 1 - why is mere statistical unreliability insufficient for suspension? The principles could accommodate either verdict here, suggesting the user's intuition might be revisable. Alternatively, we might add nuance about degree of impairment, but that risks overcomplication.

  The proposed principles cover 5/6 cases cleanly, with Case 1 being the edge case. I'll present this transparently while acknowledging the philosophical controversy around this point.
answer: |-
  Based on your verdicts, the key distinction is between higher-order evidence (HOE) that **impairs your current task competence** and HOE indicating **general unreliability without impairing current competence**. Here are the two principles needed, stated precisely, with their motivations, predictions, and limitations:

  ### Principle 1: Impaired Task Competence (ITC)
  **Statement:**  
  If HOE shows *your current cognitive state or process is impaired* for the specific task at hand (e.g., intoxication, neurological condition), you must suspend judgment on the first-order conclusion. No degree of first-order confidence can rationally override this.  

  **Motivated by:**  
  - **Case 2 (Long sum, present-state news):** Drunkenness impairs *current* calculation ability.  
  - **Case 4 (Undetectable condition):** Lund’s drift impairs *current* proof-validation ability.  
  - **Case 6 (Akrasia):** HOE about impaired reasoning forbids coherently believing the first-order output.  

  **Predicts:**  
  - **HOE from distrusted testimony:**  
    *Case:* You distrust a source claiming you took a drug that causes calculation errors.  
    *Prediction:* If you rationally disbelieve the testimony, ITC doesn’t apply. You may retain confidence.  
  - **Same-proposition HOE:**  
    *Case:* HOE directly shows your belief that "P" was caused by wishful thinking (not general unreliability).  
    *Prediction:* You must suspend judgment on P, even if first-order evidence seems strong.  

  ### Principle 2: Higher-Order Screening (HOS)
  **Statement:**  
  If HOE indicates *general unreliability* but you have *specific evidence* that the source of unreliability *does not apply* to your current instance (e.g., you performed a critical unreliability-screening step), the HOE is screened off. You may ignore it entirely and retain full confidence.  

  **Motivated by:**  
  - **Case 5 (Screened-off HOE):** Performing the cross-check screens off the general unreliability.  

  **Predicts:**  
  - **HOE from distrusted testimony:**  
    *Case:* A distrusted source claims most people like you omit a cross-check (but you performed it).  
    *Prediction:* HOS still applies; you may ignore the HOE and keep full confidence.  
  - **Same-proposition HOE:**  
    *Case:* HOE suggests general bias on topic P, but you have video proof you followed an anti-bias protocol for *this* assessment of P.  
    *Prediction:* HOS screens off the HOE; you may fully believe P.  

  ### How They Handle Your Cases:
  | Case | Your Verdict | ITC | HOS | Accommodated? |
  |------|--------------|-----|-----|---------------|
  | 1 | Lower confidence, but belief permitted | ✗ | ✗ | **No** (see below) |
  | 2 | Must suspend judgment | ✓ | ✗ | Yes |
  | 3 | Move toward peer, no full confidence | ✓ | ✗ | Yes (ITC: disagreement signals possible mutual impairment) |
  | 4 | Must suspend judgment | ✓ | ✗ | Yes |
  | 5 | Retain full confidence | ✗ | ✓ | Yes |
  | 6 | Akrasia forbidden | ✓ | ✗ | Yes (ITC: impaired state forbids coherent belief) |

  ### Incompatibility and Revision
  - **Incompatibility:** Principle ITC **cannot accommodate Case 1**.  
    - **Why:** Case 1 involves HOE about *current task-specific unreliability* (undetectable errors in *this* sum), similar to Cases 2 and 4. ITC would require suspension, but you permit belief.  
  - **Recommended Revision:** Revise your Case 1 verdict to require suspension.  
    - **Revised verdicts:** Cases 1, 2, and 4 all mandate suspension (per ITC). Cases 3 and 6 follow naturally. Case 5 is handled by HOS.  
    - **Justification:** The HOE in Case 1 *directly targets your current computation* (like Cases 2/4), not just general reliability. Intuitions separating "drunkenness" from "statistical error" may conflate *salience* of impairment with its *rational force*. Consistency demands symmetric treatment of Cases 1, 2, and 4.  

  ### Why Two Principles?
  - **ITC** explains suspension mandates (Cases 2, 4) and akrasia prohibition (Case 6).  
  - **HOS** explains the dismissal of HOE when screened off (Case 5).  
  - **Together**, they handle peer disagreement (Case 3) as mutual impairment signaling.  
  - **Case 1** is the outlier because it shares features with both principles but aligns perfectly with neither under your verdict.  

  ### Summary
  - **Core insight:** HOE forces suspension only when it reveals *current task impairment* (ITC). HOE is irrelevant if *screened off* by specific evidence (HOS).  
  - **Your verdicts 2–6** are fully explained by ITC + HOS.  
  - **Case 1** is inconsistent; revising it to mandate suspension aligns with ITC and closes the asymmetry with Cases 2/4.  

  This framework maintains parsimony while capturing the nuances in your judgments. If you keep Case 1 as-is, a third principle would be needed—but this would weaken the explanatory power for Cases 2 and 4.
