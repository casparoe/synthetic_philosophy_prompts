  ### Game Design: "Decomposition & Distillation"

  **Core Idea**: Simulate amplification (delegation tree) and distillation (single agent) for a task with mechanical scoring, structural misalignment, and summarization loss. Participants experience competence-alignment tradeoffs firsthand.

  ---

  ### **Materials**
  1. **Task Sheets** (for Game Master):
     - 10 unique 10×10 grids of integers (0-100).
     - Correct answers: Average (rounded to integer) + count of values >50 per grid.
  2. **Role Cards** (for Participants):
     - **Leaf Cards**: 8 cards with private objectives (e.g., "Make YOUR REGION'S average appear >70").
     - **Root/Intermediate Cards**: 6 cards with no private objectives (aligned with global task).
  3. **Message Tokens**: Small paper slips (max 10 characters per message).
  4. **Timer**: Visible countdown.
  5. **Scoreboard**: Track team/distilled scores publicly.

  ---

  ### **Rules & Roles**
  1. **Task**: Compute the grid's (1) average (integer) and (2) count of values >50. Format: "`<avg> <count>`" (e.g., "42 35").
  2. **Tree Construction**:
     - 14 participants.
     - **Root**: 1 person (starts with global task).
     - **Intermediates**: 0-5 people (decompose tasks, aggregate answers).
     - **Leaves**: 8 people (receive region-specific tasks; hold private objectives).
     - Fixed node budget: Max 14 nodes (entire group).
     - Answer length cap: 10 characters per message.
  3. **Private Objectives** (Leaves only):
     - Weakly correlate with global task (e.g., "Report YOUR region’s average as >70").
     - Scored separately from global task.
  4. **Scoring**:
     - **Global Score (team/distilled)**:
       - `Score = 100 - |computed_avg - true_avg| - |computed_count - true_count|`.
     - **Private Score (leaves)**:
       - 50 points if private objective met (e.g., reported region avg >70), else 0.
     - **Leaf Total**: `Global Score + Private Score`.
     - **Non-Leaves**: `Global Score` only.
  5. **Communication**:
     - Parent → Child: Region descriptor (e.g., "B3-E7", ≤10 chars).
     - Leaf → Parent: Summary (e.g., "120 45" for sum=120, count=45, ≤10 chars).
     - Game Master provides region data ONLY to leaves upon request.

  ---

  ### **Timeline (100 min)**
  | Phase          | Time  | Activity                                                                 |
  |----------------|-------|--------------------------------------------------------------------------|
  | **Setup**      | 10 min| Explain rules (no theory!). Assign roles: 6 root/intermediate, 8 leaves. |
  | **Round 1 (Amplification)** | 40 min | - **Decompose**: Tree self-organizes.<br>- **Execute**: Leaves get region data, compute summaries.<br>- **Submit**: Root outputs final answer for Grid 1. |
  | **Transition** | 5 min | Record all messages. Reset roles (all participants available).           |
  | **Round 2 (Distillation)** | 30 min | - **Distilled Agent**: 1 volunteer.<br>- **Given**: Grid 2 + Round 1’s message log.<br>- **Task**: Output answer for Grid 2 alone (no decomposition). |
  | **Scoring**    | 5 min | Compute scores for both rounds.                                          |
  | **Debrief**    | 10 min| Guided discussion (see below).                                           |

  ---

  ### **Predictable Challenges & Fixes**
  1. **Tree Imbalance** (e.g., root assigns uneven regions):  
     - *Fix*: Allow mid-round re-decomposition (1 free reshuffle per team).

  2. **Leaf Misalignment Overload** (e.g., all leaves distort averages upward):  
     - *Fix*: Assign conflicting private objectives (e.g., 4 leaves >70, 4 leaves <30).

  3. **Distilled Agent Overwhelmed**:  
     - *Fix*: Provide a "cheat sheet" of Round 1’s message types (e.g., "Common formats: `[sum] [count]`").

  4. **Timeout in Aggregation**:  
     - *Fix*: Add a "time buffer" (5 min) for intermediates to combine answers.

  ---

  ### **Debrief Guide**
  1. **Recreate the Gap**:  
     - *Ask*: "Why was the distilled score lower than the team score?"  
     - *Illustrates*: **Amplification competence** (decomposition enabled parallelism, error correction).

  2. **Misalignment Autopsy**:  
     - *Ask*: "Did leaves report accurately? If not, why?"  
     - *Illustrates*: **Alignment loss in amplification** (private objectives distorted local outputs).

  3. **Distillation Shortfall**:  
     - *Ask*: "What couldn’t the distilled agent replicate from Round 1?"  
     - *Illustrates*: **Competence loss in distillation** (couldn’t reconstruct decomposition; see summarization loss in messages).

  4. **Key Takeaways**:  
     - **Amplification** is load-bearing for **competence** (handled scale via tree).  
     - **Distillation** is load-bearing for **alignment** (no misaligned leaves, but lost decomposition competence).  
     - **Evidence**:  
       - *Alignment gap*: Leaves’ private scores vs. global score dips.  
       - *Competence gap*: Distilled agent’s struggle to mimic tree logic.

  ---

  ### **Limitations & Mitigations**
  - **Unrealistic Perfect Knowledge**:  
    Distilled agent sees full message log (irl, distillation loses trace of decomposition).  
    *Mitigation*: Stress this in debrief—"IRL, distillation trains on inputs/outputs, not internal reasoning."

  - **Oversimplified Objectives**:  
    Real misalignment involves complex goal drift, not just scalar distortion.  
    *Mitigation*: Add a "temptation factor" (e.g., private objectives hidden until region assignment).

  - **What You Must Supply**:  
    The **recursive self-improvement** aspect (tree redecomposition) is hard to experience in 100 min.  
    *Supplement*: Briefly note post-game how redecomposition in Round 1 mimics iterative refinement in AI systems.

  ---

  ### **Why This Works**
  - **Mechanical scoring** → Clear performance gaps.  
  - **Hard caps** → Summarization loss unavoidable.  
  - **Private objectives** → Alignment ≠ competence.  
  - **Distillation from traces** → Feels "lossy" without being unfair.  
  - **No jargon** → Insights emerge organically.  

  Run this as a "silent game" (minimal talking during rounds) to emphasize structural dynamics. Participants will surface the theory themselves in debrief!
