  #### **Node 2: Binding or Correlational?**  
  *Scenario:* Same as Node 1. You know refusal perfectly correlates with shock due to Threatener’s simulation.  
  *Question:* Does this correlation give you a genuine *reason* to hand over the wallet (to avoid shock), or is it merely a fluke that doesn’t justify compliance?  
  - **It gives a reason (binding)** → Proceed to Node 3.  
  - **It’s just a correlation (not binding)** → **Leaf: Non-Binding Evidentialist**.  
    *Not a standard position. Holds that correlations (e.g., between act and outcome) can inform beliefs but do not create reasons for action in acausal threats. Compliance is irrational.*  

  #### **Node 3: Response to Binding Threats**  
  *Scenario:* Same as Node 2, but you accept the threat as binding. Threatener can simulate any revised policy you adopt.  
  *Question:* How do you respond to this threat?  
  - **Comply now to avoid shock** → Proceed to Node 4A.  
  - **Adopt a lifelong policy of refusing, even if shocked** → Proceed to Node 4B.  
  - **Redesign your decision algorithm to deter threateners** → Proceed to Node 4C.  
  - **Adopt a surrogate goal to "shield" your true values** → Proceed to Node 4D.  

  #### **Node 4A: Case-by-Case Complier**  
  *Scenario:* You decide to comply this time. But will Threatener actually shock you if predicted to refuse?  
  *Question:* Does Threatener gain more from following through (e.g., by building a reputation) than the cost of shocking you?  
  - **Yes (credible threat)** → **Leaf: Evidential Decision Theorist (EDT) / Updateless Complier**.  
    *Standard positions (EDT, some UDT): Comply when threat is credible, as your act "signals" outcome.*  
  - **No (non-credible threat)** → **Leaf: Opportunistic Complier**.  
    *Rare position: Comply only if threatener’s incentives make punishment likely.*  

  #### **Node 4B: Resolute Non-Complier**  
  *Scenario:* You commit to never complying, knowing this may lead to shock.  
  *Question:* Would Threatener still shock you despite your policy (e.g., to maintain a reputation)?  
  - **Yes (credible threat)** → **Leaf: Principled Defier**.  
    *Standard in commitment approaches: Absorb punishment to avoid incentivizing future threats.*  
  - **No (non-credible threat)** → **Leaf: Deterrence Optimist**.  
    *Holds that credible defiance deters threateners, making punishment unlikely.*  

  #### **Node 4C: Decision-Algorithm Redesigner**  
  *Scenario:* You change your decision algorithm so threateners won’t target you (e.g., by becoming unpredictable or known to refuse).  
  *Question:* Does Threatener have an incentive to target agents like your redesigned self?  
  - **Yes (credible threat)** → **Leaf: Functional Decision Theorist (FDT)**.  
    *Standard position: Choose algorithms that yield best outcomes in all similar scenarios (e.g., refuse to disincentivize threats).*  
  - **No (non-credible threat)** → **Leaf: Preemptive Shield**.  
    *Non-standard: Redesign is only urgent if threatener’s incentives make targeting likely.*  

  #### **Node 4D: Surrogate Goal Adopter**  
  *Scenario:* You adopt a new goal (e.g., "minimize property loss") close to your true values ("maximize survival"). Threats targeting the surrogate won’t compromise your core values.  
  *Question:* Would Threatener gain from shocking you if you refuse?  
  - **Yes (credible threat)** → **Leaf: Surrogate Goal Strategist**.  
    *Not in literature. Uses surrogate goals to "absorb" acausal threats while preserving true values.*  
  - **No (non-credible threat)** → **Leaf: Passive Shielder**.  
    *Non-standard: Adopts surrogates preemptively, but sees no urgency in non-credible cases.*  

  ---

  ### **Unrepresented Combinations & Gaps**  
  1. **Credibility Before Bindingness**: The tree assumes threats are structurally binding *before* assessing credibility. It cannot represent agents who see threats as binding *only if credible* (e.g., "I’d comply if punishment costs Threatener nothing"). This is **incoherent** under acausal threats: if the correlation holds, bindingness is logical, not incentive-dependent.  
  2. **Partial Redesign**: The tree forces a binary on Node 3 (full redesign vs. other responses). It cannot capture agents who tweak their algorithm *without* deterring threateners (e.g., "I’ll make myself resistant to shocks but still comply"). This is **unstable**—threateners would exploit such half-measures.  
  3. **Non-CDT with Credibility**: The tree omits credibility for non-binding (Node 2 "no") and CDT (Node 1 "no") positions. This gap is **deliberate**: if threats aren’t binding, incentives are irrelevant; CDT rejects the premise outright.  
  4. **Surrogate Goals in Equilibrium**: The tree treats surrogate goals as a solo strategy. It fails to separate agents who consider how surrogates affect Threatener’s *long-term targeting* (e.g., "Will Threatener shift to threatening true values?"). This is a **gap**—no literature addresses this equilibrium.  
  5. **FDT vs. Complier Ambiguity**: The tree lists FDT under "redesign" (Node 4C), but some FDT agents may "comply case-by-case" (Node 4A) if it yields optimal outcomes. This **failure to separate** is intentional: FDT’s behavior depends on the threat’s game-theoretic structure, not predefined rules.  

  The tree prioritizes pedagogical clarity over exhaustiveness, ensuring participants confront acausal logic without defaulting to causal analogies. For your reading group, emphasize that **acausal threats turn on logical dependence, not contingent causality**—this prevents the "mugging" misstep.
