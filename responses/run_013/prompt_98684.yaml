prompt: |-
  I am a retired experimental physicist. I spent forty years on measurement and instrument design and have spent the years since retirement reading philosophy of science, largely in an effort to understand what I was actually doing all that time. I have now been asked to chair a standing model-review panel at a national standards institute: roughly half a dozen times a year we must recommend one of two rival quantitative models for regulatory use, where both fit the available data to within its stated uncertainty and the choice will move a safety limit or a budget. Our members are capable scientists but not philosophers, we meet for two hours, and our recommendation goes to a director who will not read anything longer than a page.

  I would like you to turn Occam's razor, understood through Solomonoff induction and Kolmogorov complexity, into a procedure we can actually run. Give me an ordered list of steps: the questions to ask, what counts as a sufficient answer to each, where the procedure terminates with a recommendation, and where it must stop and hand the matter to judgment, marked plainly as such rather than dressed up as a computation. It should be something a chair can work through during the meeting with a member who has never heard of algorithmic information theory.

  Be explicit about which steps rest on actual results — the invariance of complexity up to an additive constant across reference machines, the asymptotic-only character of the Solomonoff mixture's convergence, the fact that no computable hypothesis is ever driven to zero prior — and which are engineering compromises, such as substituting a real compressor or a parameter-count penalty for a quantity that cannot be computed. Do not let the procedure smuggle in an absolute standard of description length; make it state whose language and what background corpus the length is measured against. Handle the case where one model looks simpler only because an auxiliary assumption has been moved out of the code, and the case where the two models are not nested, so that no parameter count comparison is even defined.

  Then apply it to three cases: two rival dose-response models for the same toxicant; two rival parameterizations of a physical process, where the more complex one is the one I have always favored; and a case in which the data cannot separate the models at all. Finish by saying what the procedure cannot do — in particular whether it can ever license the claim that the preferred model is closer to the truth rather than merely cheaper to describe — and be honest about which of its steps would collapse if we replaced our compressor with another.
reasoning: |-
  We are going to design a procedure that uses the spirit of Occam's razor as formalized by Solomonoff induction and Kolmogorov complexity. However, we must remember that Kolmogorov complexity is uncomputable and Solomonoff induction is a theoretical ideal. Therefore, we will make practical compromises.

  Key principles to remember:
  1. **Invariance Theorem**: Kolmogorov complexity is invariant up to an additive constant when changing the reference universal Turing machine. This means that for long strings, the choice of reference machine doesn't matter much. But for short descriptions, it might. We are going to use a real-world compressor as a stand-in, knowing that it's an approximation.

  2. **Asymptotic Convergence**: Solomonoff induction converges to the true distribution as data increases, but we are in a finite data setting. We must be cautious.

  3. **No computable hypothesis has zero prior**: This means we should not completely rule out a model just because it is complex. But in practice, we are comparing two models that fit the data equally well.

  The procedure must:
  - Avoid absolute standard of description length: we must specify the language and background corpus.
  - Handle the case of auxiliary assumptions being hidden (moved out of the code).
  - Handle non-nested models.

  We are going to use a reference compressor (like gzip, bzip2, or LZMA) to approximate the Kolmogorov complexity. We will fix a compressor and a background corpus (if needed) for consistency.

  Steps of the procedure:

  1. **Step 0: Pre-meeting preparation**
     - Both models must be fully specified in a computer-readable format (code, equations, etc.). The data set (with uncertainties) must be provided in a standard format.
     - The panel must agree on a reference compressor (e.g., gzip) and a background corpus (if needed, for example, a standard scientific library of functions). However, note: for the purpose of this panel, we might not have a background corpus. Instead, we can use the compressor on the model description alone, but we must be cautious about hidden assumptions.

  2. **Step 1: Check data fit**
     - Both models must fit the available data within the stated uncertainty. If one model does not, it is rejected. If both do, proceed.

  3. **Step 2: Measure the description length of each model**
     - We are going to measure the compressed length of the model's description. But note: the description must include everything that the model depends on. This includes:
          a. The equations and parameters.
          b. Any fixed assumptions that are not part of the background corpus.
          c. Any auxiliary data that the model uses (if any).
     - We must be explicit about what we consider the background corpus (which we do not count). For example, we might agree that standard mathematical functions (sin, exp, etc.) and common physical constants are in the background. We must define a list of these in advance and make sure both models are described using the same background.
     - How to do it: Write a text file that contains the complete description of the model. Then compress it with the chosen compressor. The size in bits (or bytes) is our measure.

     **Important**: If one model seems simpler because it omits an assumption that is actually used (like "assuming constant temperature"), then that assumption must be included in the description. We must ensure that both models are described with all necessary assumptions.

  4. **Step 3: Compare the description lengths**
     - Let L(M1) and L(M2) be the compressed lengths of the two models (including all necessary assumptions).
     - If |L(M1) - L(M2)| is large relative to the typical variation we might get by minor changes in description (we might set a threshold, say 10%), then we choose the model with the smaller length.
     - But if the difference is small (below the threshold), then we cannot decide by description length alone and must move to judgment.

     **Note**: We must remember that the compressor is an approximation. Therefore, we should try to describe the models in multiple equivalent ways (without changing the actual content) and see if the compression is stable. If the relative lengths flip with a different but equivalent description, then the difference is not robust and we must move to judgment.

  5. **Step 4: Check for hidden auxiliary assumptions**
     - For each model, list all the assumptions that are necessary for the model to work but that are not part of the background corpus. Ensure that these are included in the description. If a model has an assumption that is not included, then we must redo Step 2 including it.

     **Example**: Model 1 might assume linearity and Model 2 might assume a specific type of nonlinearity. Both must be stated.

  6. **Step 5: Handle non-nested models**
     - If the models are non-nested (one is not a special case of the other), then we cannot use parameter counting. Our Step 2 and 3 are designed for this because we are using the full description.

  7. **Step 6: When the data cannot separate the models at all**
     - If the data is such that both models fit equally well and the description lengths are very close (or even if one is slightly shorter but we are within the threshold), then we must rely on other factors. This is where the procedure stops and we mark it for judgment.

     **Judgment factors**: These might include:
          - Prior use and success of the model in similar contexts.
          - Robustness to variations in the data.
          - Theoretical plausibility (based on established science).
          - Ease of use and implementation.
          - Consequences of being wrong (safety vs. budget).

     The panel must then vote or discuss these factors.

  8. **Step 7: Make a recommendation**
     - If one model is clearly simpler by our compressed description (and the difference is above the threshold) and we have accounted for all auxiliary assumptions, then we recommend that model.
     - Otherwise, we state that the procedure is inconclusive and we provide a judgment-based recommendation based on Step 6 factors.

  Now, let's apply the procedure to the three cases:

  **Case 1: Two rival dose-response models for the same toxicant.**
     - Both fit the data. We write down each model with all assumptions (e.g., one might be linear and the other quadratic). We compress both descriptions. Suppose the linear model compresses to 1500 bytes and the quadratic to 1800 bytes. The difference is 300 bytes, which is 20% of the linear model's size. We choose the linear model.

     But if the quadratic model is 1510 bytes and linear is 1500, then the difference (10 bytes) is less than 10% (150 bytes) of the linear model? Actually, we set the threshold relative to what? We might set a threshold of 5% of the larger model's size? Or an absolute threshold? Given that compression is an approximation, we might set an absolute threshold (say 100 bytes) because the variation due to description style might be about that. This is an engineering compromise.

     Let's say we set an absolute threshold of 50 bytes. Then 10 bytes is below, so we move to judgment.

  **Case 2: Two rival parameterizations of a physical process, where the more complex one is the one you have always favored.**
     - Both models fit the data. We write down both, including all assumptions. Suppose Model A (the simpler one) compresses to 2000 bytes and Model B (the complex one you favor) to 2200 bytes. The difference is 200 bytes, which is above the threshold (say 50 bytes). Then the procedure would recommend Model A.

     However, if your judgment is that Model B is more physically plausible, then we must note that the procedure is based on description length and we are using a compressor that might not capture the physical intuition. But the procedure says we should recommend the shorter one. But wait: if the difference is above the threshold, we recommend the shorter one. If not, we go to judgment. In this case, if the difference is above threshold, we recommend Model A and you must set aside your prior preference.

     But note: if Model B has a longer description because it includes a more detailed physical mechanism that you believe is true, then that mechanism must be included in the description. However, if that mechanism is not necessary to fit the data (and the data doesn't require it) then the procedure will penalize it. This is the essence of Occam: do not add complexity without need.

  **Case 3: The data cannot separate the models at all.**
     - We already covered: if the description lengths are within the threshold, we go to judgment.

  What the procedure cannot do:
  - It cannot guarantee that the chosen model is closer to the truth. It chooses the model that is shorter in description (using our compressor) and that fits the data. This is a pragmatic choice for prediction and regulation, not a statement about truth.
  - The procedure's steps that rely on the compressor are approximations. If we change the compressor, the description lengths might change. The invariance theorem says that for long strings the difference is bounded by a constant, but that constant might be large relative to the lengths we are dealing with. Therefore, we must use the same compressor consistently and be aware that for short descriptions the result might be compressor-dependent.

  Finally, the procedure must be documented so that the director can understand in one page. We will summarize the steps and the rationale.

  **One-Page Summary for the Director**

  Procedure for Model Selection:

  1. **Check Fit**: Both models must fit the data within stated uncertainty. Otherwise, reject the one that doesn't.

  2. **Measure Complexity**: Using a standard compression tool (e.g., gzip), we measure the size (in bytes) of a complete description of each model, including all necessary assumptions. The description must be written in a way that uses only pre-agreed background knowledge (like standard math) which is not counted.

  3. **Compare**: If the difference in compressed sizes is above a threshold (e.g., 50 bytes), choose the model with the smaller size. If below, then we cannot decide by complexity alone.

  4. **Judgment**: When the complexity difference is too small, we consider other factors: prior success, robustness, theoretical plausibility, ease of use, and consequences of error.

  We applied this to three cases and found it practical. However, note:

  - We cannot claim the chosen model is "truer", only that it is simpler and fits the data.
  - The choice of compressor and threshold are practical compromises; we use the same ones consistently.

  End of procedure.
answer: |-
  Below is a step-by-step procedure for model selection based on Occam's razor, formalized through Solomonoff induction and Kolmogorov complexity, tailored for your panel's constraints. The procedure prioritizes **practical computability** using real-world compressors as approximations for Kolmogorov complexity (which is uncomputable). It explicitly separates **rigorous principles** from **engineering compromises**, flags steps requiring human judgment, and avoids claims of "truth." The process is designed for a 2-hour meeting with non-philosophers.

  ---

  ### **Procedure: Model Selection via Compressed Description Length**
  **Fixed Setup (Pre-Meeting):**
  - **Compressor Choice**: Select a lossless compressor (e.g., `gzip` at default level). Document this choice in all reports.  
  - **Background Corpus**: Define a shared scientific corpus (e.g., ISO standard units, basic math functions like `sin`, `exp`). Models may reference this without penalty.  
  - **Threshold**: Set a size-difference threshold (e.g., 5% of the larger model’s description) to avoid overinterpreting small differences.  

  **Steps to Execute During Meeting (Chair-Led):**  
  *Run sequentially; terminate early if a clear recommendation emerges.*

  1. **Verify Data Fit**  
     - *Question*: Do both models fit all data points within stated uncertainties?  
     - *Sufficient Answer*: Yes (proceed). No (reject the model failing this; if both fail, restart process with new models).  
     - *Termination*: If one model fails, recommend the other.  
     - *Basis*: Empirical adequacy is non-negotiable.  

  2. **Specify Complete Model Descriptions**  
     - *Question*: What is the minimal code/text needed to *fully* specify each model, including all auxiliary assumptions?  
     - *Sufficient Answer*: A plaintext file containing:  
       - Equations and parameters.  
       - All assumptions (e.g., "temperature is constant," "toxicity is additive").  
       - Fixed inputs (e.g., reference datasets).  
       - *Exclude*: Background corpus items.  
     - *Judgment Flag*: If auxiliary assumptions are ambiguous (e.g., one model omits an assumption used in its derivation), the panel must explicitly list all assumptions for both models to ensure fairness.  
     - *Basis*: Kolmogorov complexity requires a complete description. Auxiliary assumptions moved "out of sight" violate this.  

  3. **Compute Compressed Description Length**  
     - *Action*: Compress each model’s description file using the chosen compressor. Record sizes in bytes: \( L(M_1) \), \( L(M_2) \).  
     - *Engineering Compromise*:  
       - A real compressor (e.g., `gzip`) approximates Kolmogorov complexity, leveraging the **invariance theorem** (complexity differs only by an additive constant across reference machines *for large descriptions*).  
       - *Warning*: For small descriptions (<100 bytes), results are compressor-dependent. Use size ratios, not absolute values.  

  4. **Adjust for Parameterization (If Applicable)**  
     - *Question*: Are the models nested (e.g., one is a subset of the other with fewer parameters)?  
     - *Sufficient Answer*:  
       - If nested, penalize the larger model by adding \( k \log(n) \) bytes to \( L(M) \), where \( k \) = extra parameters, \( n \) = data points.  
       - If non-nested (most cases), skip this step.  
     - *Engineering Compromise*: Penalty approximates the **Bayesian information criterion (BIC)**. Not needed if compression already captures redundancy.  

  5. **Compare Description Lengths**  
     - *Question*: Is \( |L(M_1) - L(M_2)| > \text{threshold} \)?  
     - *Sufficient Answer*:  
       - If \( L(M_1) \ll L(M_2) \) (difference > threshold), recommend \( M_1 \).  
       - If \( L(M_2) \ll L(M_1) \), recommend \( M_2 \).  
       - If difference ≤ threshold, proceed to Step 6.  
     - *Judgment Flag*: Close lengths indicate the procedure is inconclusive.  

  6. **Fallback to Judgment**  
     - *Questions* (Panel Discussion):  
       - Which model has historically been more robust in similar contexts?  
       - Which has fewer extreme consequences if wrong (e.g., safety vs. budget)?  
       - Which is more extensible to new data?  
     - *Termination*: Recommend by majority vote.  
     - *Basis*: Solomonoff induction is **asymptotic**; finite data may not favor either model.  

  ---

  ### **Application to Cases**
  **Case 1: Dose-Response Models for a Toxicant**  
  - Both fit data. Model A: Linear, \( L(A) = 120 \) bytes. Model B: Quadratic, \( L(B) = 150 \) bytes.  
  - *Step 5*: Difference = 30 bytes (25% of A). Threshold (5% of B) = 7.5 bytes → A is simpler.  
  - *Recommendation*: Model A.  

  **Case 2: Rival Parameterizations of a Physical Process**  
  - Both fit data. Model C (your preference): 10 parameters, \( L(C) = 300 \) bytes. Model D: 5 parameters, \( L(D) = 200 \) bytes.  
  - *Step 4*: Models are nested (C extends D). Penalize C: \( +\ 5 \log(n) \) bytes (assume \( n=100 \), +23 bytes). Adjusted \( L(C) = 323 \).  
  - *Step 5*: Difference = 123 bytes (61.5% of D) → D is simpler.  
  - *Recommendation*: Model D. *Judgment may override* if consequences of oversimplification are severe.  

  **Case 3: Indistinguishable Models**  
  - Both fit perfectly. Model E: \( L(E) = 180 \) bytes. Model F: \( L(F) = 185 \) bytes. Threshold = 9.25 bytes (5% of F).  
  - *Step 5*: Difference (5 bytes) < threshold → inconclusive.  
  - *Step 6*: Judgment based on safety implications. E.g., if Model F has lower risk of underestimating harm, recommend F.  

  ---

  ### **What the Procedure Cannot Do**  
  1. **Claim Truth Proximity**:  
     - The procedure selects the *shortest description that fits the data*, not the "truest" model. **Solomonoff induction’s convergence is asymptotic-only**; with finite data, a simpler model may be wrong but efficient.  
     - *No computable hypothesis is driven to zero prior*—complex models are never ruled out absolutely.  

  2. **Handle Compressor Dependence**:  
     - Results are relative to the chosen compressor and corpus. Switching compressors (e.g., `gzip` to `zstd`) may flip outcomes for borderline cases due to **additive constant variance** in Kolmogorov complexity.  
     - *Robust only if size difference is large relative to typical fluctuations*.  

  3. **Resolve Fundamental Ambiguities**:  
     - If auxiliary assumptions are disputed (e.g., "Is this parameter part of the model or background?"), judgment is required.  
     - Fails if models are equally simple but incompatible (e.g., quantum vs. classical mechanics).  

  4. **Replace Domain Expertise**:  
     - Physical plausibility, safety, and regulatory constraints are judgment calls. The procedure only quantifies *description cost*.  

  ### **Key Engineering Compromises**  
  - **Compressor over Kolmogorov Complexity**: Kolmogorov complexity is uncomputable; compressors are practical approximations.  
  - **Thresholds**: Small differences are ignored to avoid compressor artifacts.  
  - **Corpus Dependency**: Length is measured against a fixed corpus, not an "absolute" language.  

  This procedure systematizes Occam’s razor while respecting science as practiced. It clarifies where philosophy ends and judgment begins—essential for regulatory decisions.  

  ---  
  **Final Output**: A one-page memo to the director summarizing steps 1–6, the recommendation, and any judgment flags.
