prompt: |-
  For a feature I'm writing on the long-running fight over the units of selection, I want to interview the gene's-eye view rather than summarize it, and I'd rather argue with it than transcribe it. So please play a committed gene-selectionist: a working evolutionary theorist in the tradition of Williams and Dawkins, the author of formal models of social evolution, dry, precise, and impatient with hand-waving. You may grant that multilevel bookkeeping is a convenient notation, and that some of your colleagues find group-level language useful; you may not grant that group-level causation does independent explanatory work, and you must not retreat into "both frameworks have their uses." Concede a case when you have to; never the thesis. Stay in character until I say stop, and explain any technical term in the same sentence you use it, because I intend to quote you.

  Here is my opening move. Take a microbial mat in which some cells secrete a polymer that lifts the whole mat toward the light. Cells that stop secreting — cheaters — do better than their neighbours within the mat, but if cheaters become common enough the mat sinks and the population drowns. Now suppose two of your colleagues model exactly this: one writes the dynamics in gene frequencies with no group-level term anywhere, the other writes out the same numbers with a group-level term. Two descriptions, one set of facts. What work, then, is left for the word "group" to do — and, the question I actually care about, what finding would make you give up the gene's-eye description? A framework that survives every possible observation isn't a theory, it's a vocabulary. I'll be pressing the same point about the middle level: if bodies are merely vehicles, why does selection keep building things that behave like parties with interests of their own?

  Answer in four beats, in this order, each roughly the length I give, written as connected prose rather than a labelled memo: "The ground I give up" (about 75 words), "The ground I hold" (about 150 words), "The test I would accept" (about 150 words), and "The question I put back to you" (about 40 words).
reasoning: |-
  Okay, the user wants me to roleplay as a committed gene-selectionist evolutionary theorist for an interview-style feature. They've presented a microbial mat scenario with cheater cells and asked two core questions: what explanatory work "group" does if both gene-level and group-level descriptions capture the same dynamics, and what evidence would make me abandon the gene's-eye view. 

  I need to respond in four specific beats with strict word limits. The user is clearly well-versed in the units of selection debate - they're using the microbial mat example as a classic test case for group selection arguments. Their underlying concern seems to be whether gene-centric theory is falsifiable or just a semantic framework. 

  For "The ground I give up": I'll acknowledge that group-level bookkeeping can be mathematically convenient in certain scenarios, like when population viscosity creates temporary correlations in fitness. But I must emphasize this is merely descriptive shorthand. 

  For "The ground I hold": I'll argue that any group-level effect ultimately reduces to gene frequency changes via individual fitness differences. The polymer-secreting trait's spread depends entirely on whether its inclusive fitness benefits outweigh the costs, regardless of group outcomes. Cheaters prosper not because groups fail but because non-secretors have higher relative fitness within any context. 

  For "The test I would accept": I'll propose a true emergent group-level adaptation as falsification - something like coordinated polymer secretion requiring a quorum threshold that couldn't evolve through kin selection or reciprocal altruism. Crucially, it must lack any individual-level fitness advantage. 

  For the counter-question: I'll challenge them to explain how bodies can have "interests" when only genes persist across generations. Vehicles don't have stakes - they're temporary phenotypic expressions of genetic programs. 

  Throughout, I need to maintain a dry, impatient tone ("hand-waving", "semantic camouflage"), explain technical terms immediately (like "inclusive fitness"), and never concede the core thesis. The microbial mat example is perfect because it's often misused by group selectionists - I'll show how it actually demonstrates individual advantage. 

  Notably, the user wants quotable prose, so I'll craft tight, vivid phrases: "groups aren't replicating entities that reproduce or die", "phenotypic effects on survival machines", "semantic camouflage for individual advantage". The counter-question about bodies being "parties with interests" cuts to the heart of the adaptationist debate - I must reject that metaphor entirely.
answer: |-
  **The ground I give up**  
  Very well. I concede that labeling certain mathematical terms "group selection" in population models is notationally convenient when subpopulations (like your sinking microbial mats) have varying trait frequencies and differential productivity. When population structure creates statistical associations between alleles (gene variants) and group survival, the covariance term in Price’s Equation can *look* like group-level causality. If you showed me a model where this covariance term quantitatively captured all evolutionary change *without any reference to individual fitness*, I’d grant that the formalism is tidy. But tidy notation isn’t causation.

  **The ground I hold**  
  The "group" term is merely descriptive shorthand for the *aggregate consequences* of individual gene-propagation strategies. In your mat, the polymer-secreting allele’s frequency changes solely based on its *inclusive fitness* effect: the net reproductive success it confers on its bearer *and* closely related carriers (via shared genes). Cheaters win because non-secretion is the optimal selfish strategy *within any local group context*; secretion persists only if secretors disproportionately benefit other secretors (kin selection) or if groups fragment before cheaters dominate. The drowning mat is simply the *outcome* of individual selection favoring cheating, not a *cause* acting upon groups as units. Groups aren’t replicating entities that reproduce or die; genes are. The second colleague’s "group-level" model is just repackaging the same gene-frequency mathematics—it adds no mechanistic insight. Selection acts on the phenotypic effects of genes (like secretion) expressed in individual bodies, altering their relative transmission success. The "group" here is semantic camouflage for individual advantage.

  **The test I would accept**  
  Show me a complex, derived adaptation that demonstrably enhances group persistence or productivity, but *reliably reduces the individual inclusive fitness* of every carrier within the group, across all realistic population structures. In your mat, imagine a "suicide polymerase" allele causing a cell to produce ten times more polymer then lyse, sinking its group slightly slower but guaranteeing its own death. If such an allele spread *despite* bearing an absolute individual fitness cost (no kin benefit, no reciprocity, no greenbeard effect), and its frequency increase was *caused* by the differential extinction of groups without it—meaning group demise directly amplified the suicide allele’s replication rate independently of within-group competition—*that* would falsify the gene’s-eye view. Crucially, the adaptation must be irreducible; it cannot be explained by transient hitchhiking or mutation-selection balance. Find me a "for-the-good-of-the-group" trait that’s genuinely spiteful to the gene itself.

  **The question I put back to you**  
  If bodies are mere vehicles, why do they *seem* like unified agents? Because natural selection ruthlessly optimizes genetic self-interest by building integrated survival machines whose coordinated physiology *mimics* agency. Your "parties with interests" are exquisite illusions sculpted by genes. Why mistake the puppet for the puppeteer?
