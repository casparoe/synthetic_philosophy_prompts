  > "You evaluate gambles by transforming probabilities (overweighting small chances, underweighting large ones) and valuing outcomes relative to a reference point (with diminishing sensitivity to gains/losses and strong loss aversion). Extreme outcomes (big wins/losses) dominate your decisions."

  This fits your journalistic intuition—you’re instinctively using the brain’s "fast thinking" system (Kahneman’s System 1), which CPT models mathematically. For choice 7, the rule says **take N**, but your ambivalence is natural when probabilities straddle psychological thresholds.
