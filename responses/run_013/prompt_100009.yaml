  Based on your choices and the underlying patterns, your hunch is remarkably close to the principles of **Cumulative Prospect Theory (CPT)**, developed by Kahneman and Tversky. CPT combines two key elements: a **value function** that is concave for gains, convex for losses, and steeper for losses (loss aversion), and a **probability weighting function** that overweights small probabilities and underweights moderate/large ones. Here's the precise rule that explains your choices:

  ### The Rule
  1. **Value Function (for outcomes relative to a reference point, usually status quo):**  
     - \( v(x) = x^\alpha \) for gains (\( x \geq 0 \))  
     - \( v(x) = -\lambda (-x)^\beta \) for losses (\( x < 0 \))  
     - Parameters: \( \alpha = 0.88 \), \( \beta = 0.88 \), \( \lambda = 2.25 \) (loss aversion).  
     - *Interpretation:* You are risk-averse for gains (concave function) and risk-seeking for losses (convex function), with losses hurting about 2.25x more than equivalent gains.

  2. **Probability Weighting Function (applied cumulatively to ranked outcomes):**  
     - \( w^+(p) = \frac{p^\gamma}{ (p^\gamma + (1-p)^\gamma)^{1/\gamma} } \) for gains  
     - \( w^-(p) = \frac{p^\delta}{ (p^\delta + (1-p)^\delta)^{1/\delta} } \) for losses  
     - Parameters: \( \gamma = 0.61 \) (gains), \( \delta = 0.69 \) (losses).  
     - *Interpretation:* You overweight small probabilities (e.g., 1% feels like >1%) and underweight large ones (e.g., 95% feels like <95%). Extreme outcomes (big wins/losses) get extra psychological weight.

  3. **Cumulative Transformation:**  
     - Outcomes are ranked (best to worst for gains, worst to best for losses).  
     - Decision weights are derived from *differences* in weighted cumulative probabilities.  
     - *Example:* For a gamble with outcomes \( x_1 > x_2 > x_3 \), the weight for \( x_1 \) is \( w(p_1) \), for \( x_2 \) is \( w(p_1 + p_2) - w(p_1) \), etc.

  ### How It Explains Your Choices
  - **Choice 1 (A > B):**  
    Certainty effect! The 100% chance of $1M is overweighted, and the 1% chance of nothing (though small) induces fear. CPT calculation:  
    \( V(A) = v(1M) = 1000000^{0.88} \approx 831,764 \)  
    \( V(B) = [w(0.10) \cdot v(5M)] + [w(0.99) - w(0.10)] \cdot v(1M) \approx 724,000 \)  
    **Verdict:** A wins. Consistent.

  - **Choice 2 (D > C):**  
    Small probabilities (10%, 11%) are overweighted. The 10% chance of $5M is more appealing than 11% of $1M because the value function amplifies the larger gain ($5M > 5×$1M in psychological value).  
    \( V(C) = w(0.11) \cdot v(1M) \approx 124,000 \)  
