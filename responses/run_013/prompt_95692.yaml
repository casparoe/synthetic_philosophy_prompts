  ### Theory Lunch Session: Chomp and the Strategy-Stealing Argument  
  **Goal:** Experience the gap between knowing a winning strategy exists and constructing one.  
  **Duration:** 90 minutes  
  **Participants:** ~12 engineers (backend + ML researchers), no formal logic/math training.  

  ---

  ### **Materials**  
  - **Grids:** Printouts or digital slides of Chomp boards (1x2, 2x2, 2x3, 3x3, 5x5).  
  - **Pens/Highlighters:** To mark moves on grid printouts.  
  - **Timer:** For structured segments.  
  - **Whiteboard:** For group discussion and debrief notes.  

  ---

  ### **Session Plan (Minute-by-Minute)**  
  #### **0–5 min: Intro by Example (No Lecture)**  
  - **Rules in 30 seconds:** Show a 2x2 grid. Demonstrate one move: "Pick any square, remove it and everything below/right. Player forced to eat the top-left square loses."  
  - **Quick demo:** Play 2x2 with a volunteer. First player wins by taking (2,2). Ask: "Why did that work?" *(Plant seed: Explicit moves matter.)*  

  #### **5–25 min: Small Boards – Explicit Wins (Pairs)**  
  - **Activity:** Pairs play 1x2, 2x2, 2x3, and 3x2 boards. Goal: Find a winning first move.  
  - **Twist:** Assign roles (Player 1/2) and rotate. Observer tracks moves.  
  - **Predictable issue:** Groups fixate on symmetric moves (e.g., corners). Gently nudge: "What if Player 1 starts elsewhere?"  
  - **Exit cue:** "Share winning moves in 20 minutes."  

  #### **25–35 min: Group Share – Concrete Wins (Whole Group)**  
  - **Report:** Groups share first moves for small boards (e.g., 1x2: take right; 2x2: take (2,2); 2x3: take (2,2)).  
  - **Key Q:** "Could you always find the winning move? Was it obvious?" *(Highlight: Small boards = constructible.)*  

  #### **35–55 min: 3x3 Challenge – The Wall (Pairs)**  
  - **Activity:** Pairs find a winning first move for 3x3.  
  - **Twist:** Warn: "This is harder. You have 10 minutes."  
  - **Predictable issue:** Groups brute-force but miss the winning move (e.g., (2,2)). Some declare, "Player 2 wins!" – let this happen.  
  - **Intervention:** After 10 min, reveal: "We know Player 1 wins, but no group found the move." *(Frustration mounts.)*  

  #### **55–65 min: 5x5 Challenge – Collision with the Unknown (Groups of 4)**  
  - **Activity:** Groups find the winning first move for 5x5.  
  - **Setup:** "Use the same approach as 3x3."  
  - **Predictable issue:** Chaos. Groups guess randomly (e.g., (5,5), (1,1), (3,3)). After 5 min, interject: "Still stuck? That’s expected. Nobody knows this move."  
  - **Pivot:** "But we know Player 1 wins. Let me prove it without finding the move."  

  #### **65–75 min: Intuitive Strategy-Stealing (Facilitator-Led)**  
  - **Argument (No Jargon):**  
    1. "Assume Player 2 has a winning plan. Player 1 starts by eating only the bottom-right square."  
    2. "Now Player 1 pretends they’re Player 2: They copy Player 2’s plan for the rest of the game."  
    3. "Why? Because eating an extra square never hurts. If Player 2’s plan wins on the original board, it should win here too."  
    4. "But now both players win? Impossible! So Player 2 can’t have a winning plan. Player 1 must have one."  
  - **Visual:** Draw 5x5, cross out (5,5), and sketch "copycat" arrows.  

  #### **75–80 min: Dramatic Loss – "Promised Win" Backfires**  
  - **Setup:** Pick a volunteer (Player 1) and facilitator (Player 2). Play 3x3.  
  - **Hook:** "Strategy-stealing says Player 1 wins. Let’s see it in action!"  
  - **Execution:**  
    - Player 1 takes "safe" corner (3,3).  
    - Facilitator (Player 2) takes winning move (2,2), forcing Player 1 into a loss (as in 3x3 example above).  
  - **Outcome:** Player 1 loses. Group sees "existence proof" ≠ victory.  

  #### **80–90 min: Debrief – Mapping the Argument**  
  - **Q1:** "What just happened? Why did Player 1 lose?" *(Elicit: "They didn’t know the move.")*  
  - **Q2:** "How did we ‘prove’ Player 1 wins without a move?" Rebuild strategy-stealing steps:  
    1. Assumed Player 2 has a winning strategy.  
    2. Player 1 steals it by starting with (m,n).  
    3. Copycat play forces contradiction.  
  - **Silent Assumptions (Reveal Now):**  
    - *"Eating extra squares never hurts":* True in Chomp (monotonic), false in chess (zugzwang).  
    - *"No draws":* Chomp always ends (finite board), so one player must lose.  
  - **Key Insight:** "We proved a winning strategy exists but gave no way to build it. That’s why we lost on 3x3."  
  - **Jargon Intro (Finally):** "This is a **non-constructive proof**. We know the winner but can’t write the moves."  

  ---

  ### **What Will Go Wrong (and How to Handle It)**  
  1. **3x3 Stalemate:** Groups claim Player 2 wins.  
     - *Handle:* Let them present "proof." Then reveal: "We know Player 1 wins – here’s a counterexample." Play the (2,2) line.  

  2. **5x5 Brute-Force Attempt:** Engineers try to code/solve logically.  
     - *Handle:* "Even with code, 5x5 is too big. The winning move is unknown math – we’ll run out of time."  

  3. **Strategy-Stealing Confusion:** "Why can Player 1 copy moves if (m,n) is gone?"  
     - *Handle:* Use the whiteboard: "In the copycat phase, moves work identically because (m,n) was isolated. If Player 2’s plan required (m,n), Player 1 already ate it – so skip that step." (Gloss over technicalities; say experts accept this.)  

  ---

  ### **What the Activity Can’t Do (Requires Facilitation)**  
  - **Supply:**  
    - Winning moves for small boards (e.g., 2x3: (2,2)).  
    - The non-constructive "aha" – connect their frustration to the proof’s silence.  
    - Clarify monotonicity vs. zugzwang (use chess example: "Sometimes moving first loses").  
  - **Cannot Reproduce:**  
    - Full formal logic (e.g., quantifying over strategies). Keep it experiential.  
    - Actual 5x5 solutions (humans can’t derive them).  

  ### **Why This Works**  
  - **Twists:** Pair work → group share → unsolvable challenge → "proof" → dramatic loss creates cognitive dissonance.  
  - **Roles:** Observers track moves; volunteers embody the argument’s failure.  
  - **Debrief:** Explicitly maps their emotions (frustration/confusion) to the proof’s steps and gaps.  

  ---  
  **Final Note:** This session leaves them feeling the proof’s limitations – not just hearing them. The dramatic loss makes the theory visceral.
