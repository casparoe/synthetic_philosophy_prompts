prompt: |-
  I'm writing a feature about the disputes that erupt when museums, insurers, and artists' estates have to agree on whether something is the object that was insured, the work that was lent, or a replacement — and behind each of those disputes sits the older question of what it is for one thing to be made of another. Before I start reporting, I want the specification rather than the literature: what does a theory of material constitution have to be able to do before it is any good? Take the standard of adequacy to be this — good enough to license verdicts in cases where money, custody, and conservation decisions turn on the answer — and then tell me what that standard actually demands.

  Set out the requirements such a theory must meet, and for each one give the case or consideration that makes it a requirement rather than a preference: the cases it has to get right, the distinctions it must not collapse, the findings from the sciences it cannot contradict, the facts of ordinary practice it cannot simply declare mistaken. Say which of these are non-negotiable and which are house rules of a particular camp.

  Let these composites do the work, since the disputes I see are rarely about a statue and a lump of clay in the abstract:

  - a topiary horse maintained in the same shape for eighty years, in which every living cell has been replaced several times over, and whose dead limbs are grafted from a different shrub;
  - a bust carved from a single block of rock salt, shown in a humid gallery, that sheds about a gram a day and is meant by its maker to remain the same sculpture until the last grain is gone;
  - a bronze whose mold was destroyed at the foundry and which was later re-made by taking a new mold from a surviving cast of the same edition, so that the second bronze descends from the first without containing any of it;
  - a marble block already sawn to a rough cylinder by the quarry before the sculptor touches it, so that the matter of the finished statue is itself a made thing with its own maker and its own history;
  - a Roman coin embedded in a sculpture's base, unknown to the artist, removed for study, and returned.

  Then tell me what the theory is not competent to settle. My sources slide constantly between whether two things are identical and whether they are the same work for legal or curatorial purposes, and I want to know whether that slide is a confusion on their part or a genuine question the metaphysics has to answer.

  Finally: flag any requirements that cannot be met together — that is the part I most want, since it would explain why these disputes never close — and name the single requirement that rules out the most candidate theories. I don't need a scorecard of the going views; I need the spec.
reasoning: |-
  Okay, the user is writing a feature on disputes in museums, insurers, and artists' estates regarding whether an object is the original insured/lent item or a replacement. The core issue is material constitution—what makes one thing the same as another despite material changes. They want a theory's adequacy criteria for real-world decisions involving money, custody, and conservation. 

  First, I need to unpack their request. They want specifications, not literature reviews. The standard is practical: the theory must license verdicts in high-stakes cases. The five composite examples are crucial test cases. 

  The user’s deeper need seems to be understanding why these disputes are intractable. They hint at a possible tension between metaphysics and institutional practices, asking if sliding between "identical" and "same work" is confusion or a legitimate overlap. They also explicitly want conflicts between requirements—the "unresolvable" core. 

  Breaking this down:  
  The theory must handle persistence through change (topiary horse), intentional destruction (salt bust), replication without material continuity (bronze), hybrid origins (marble cylinder), and embedded objects (coin). Each case stresses different aspects: biology vs. form, artist intent vs. entropy, chains of replication, layered creation histories, and accidental components.  

  Non-negotiable requirements emerge:  
  1. **Material Flexibility**: The topiary horse demands that total part replacement doesn’t kill identity. If a theory insists on original atoms, it fails here—conservators would reject it.  
  2. **Intentional Primacy**: The salt bust’s dissolution plan must override physical continuity. Denying this contradicts artist-endorsed conservation norms.  
  3. **Replicant Integrity**: The re-cast bronze can’t be the *same object* as the first (per physics), but institutions treat editions as distinct originals. A theory collapsing this distinction would sabotage art market practices.  
  4. **Historical Layering**: The pre-shaped marble cylinder forces acknowledgment of "matter with biography." Ignoring quarry work erases collaborative labor—a social/historical necessity.  
  5. **Component Autonomy**: The Roman coin’s removal/replacement shows embedded items aren’t fused to the sculpture. Law and archaeology treat them as separate property, so a theory must allow temporary detachment without identity loss.  

  The slide between "identical" and "same work" isn’t confusion—it’s unavoidable. Metaphysics asks "Is it the same *thing*?", while institutions ask "Does it function as the same *work*?" A theory must bridge both but can’t conflate them.  

  Key conflict: **Intent vs. Continuity**. Artists (salt bust) may prioritize concept over matter, while insurers need physical continuity for risk assessment. No theory satisfies both perfectly—hence eternal disputes.  

  Most disqualifying requirement? **Material Flexibility**. Theories insisting on atomic persistence (e.g., some forms of materialism) fail the topiary test immediately. This rules out naive approaches and forces accommodation of dynamic entities.  

  The takeaway: Tensions between physical reality, artist vision, and institutional needs create irreconcilable demands. That’s why verdicts feel arbitrary—the criteria themselves clash.
answer: |-
  Here’s the specification for a theory of material constitution adequate to resolve high-stakes disputes in art conservation, insurance, and curation. The requirements are derived from your cases, practical consequences, and non-negotiable realities. Conflicts between requirements are flagged at the end.

  ---

  ### **Core Requirements for an Adequate Theory**  
  *(Non-negotiable = grounded in science, law, or universal practice; House Rules = camp-specific)*  

  1. **Persistence Through Total Part Replacement**  
     - **Requirement**: Must allow identity to survive gradual replacement of *all* material parts.  
     - **Case**: The topiary horse (all cells replaced, dead limbs grafted).  
     - **Why Non-Negotiable**: Biology mandates cell turnover; conservation practice treats such objects as continuous. Denying this invalidates maintenance of living artworks, historic ships, or heirloom trees.  
     - **Threshold**: Identity persists if replacement adheres to a stable form-generating principle (e.g., topiary’s shape).  

  2. **Intentional Destruction as Continuity**  
     - **Requirement**: Must accept that an object can persist while being *meant* to physically degrade.  
     - **Case**: The salt bust shedding mass in a humid gallery.  
     - **Why Non-Negotiable**: Artist intent defines the work’s ontology in contemporary art. If the bust is "the same sculpture until the last grain," conservation that halts erosion *destroys* the work.  
     - **Threshold**: Physical discontinuity is irrelevant if degradation aligns with creator-sanctioned identity conditions.  

  3. **Replication Without Material Inheritance**  
     - **Requirement**: Must distinguish between *original* and *copy* when no original matter transfers.  
     - **Case**: The re-cast bronze (new mold from a surviving cast).  
     - **Why Non-Negotiable**: Art market/insurance practices treat editions as distinct originals. A theory equating replicas with the source would collapse valuation and provenance.  
     - **Threshold**: Copies are derivative works unless materially continuous with the artist’s hand (e.g., a cast from the master mold).  

  4. **Nested Constitution Chains**  
     - **Requirement**: Must recognize that matter can be a "made thing" with its own history.  
     - **Case**: The marble block pre-shaped by the quarry.  
     - **Why Non-Negotiable**: Neglecting prior makers erases labor history and material provenance. The quarry’s work affects conservation (e.g., tool marks) and ownership.  
     - **Threshold**: An object can be simultaneously constituted by matter *and* constitute a higher-order work.  

  5. **Temporary Component Removal**  
     - **Requirement**: Must allow embedded objects to be detached/replaced without altering the whole’s identity.  
     - **Case**: The Roman coin removed and returned to the sculpture’s base.  
     - **Why Non-Negotiable**: Archaeology and law treat embedded items as distinct property. Denying reattachment invalidates conservation, study, and restitution practices.  
     - **Threshold**: Accidental/unknown components don’t fuse with the work’s essence if removable without structural change.  

  ---

  ### **What the Theory Cannot Settle**  
  The slide between "identical" and "same work for purpose X" is **not confusion**—it reveals a gap metaphysics *cannot* bridge. The theory can only resolve:  
  - **Metaphysical identity**: "Is this the same *object*?"  
  - **Work identity**: "Does this object instantiate the same *artwork*?"  

  It *cannot* settle:  
  - **Legal/custodial "sameness"**: Whether the identical artwork warrants identical treatment (e.g., value, display rights). This depends on institutional conventions.  
  - Example: A re-cast bronze is metaphysically distinct but may be "the same work" for loan purposes if the edition contract permits substitutions.  

  ---

  ### **Conflicting Requirements & Dealbreakers**  
  **Critical Conflicts**:  
  - **Persistence vs. Replication (Requirements 1 & 3)**:  
    If the topiary survives total part replacement (Req 1), why isn’t the re-cast bronze the *same object* as the original? Yet Req 3 demands they differ.  
    - **Tension**: Theories prioritizing *form* (e.g., hylomorphism) satisfy Req 1 but struggle with Req 3. Theories prioritizing *matter* (e.g., mereological essentialism) do the opposite.  

  - **Intent vs. Continuity (Requirements 2 & 5)**:  
    The salt bust’s persistence via intent (Req 2) conflicts with the coin’s removability (Req 5). If intent defines identity, removing the coin (unknown to the artist) might not matter—but institutions treat it as separable.  
    - **Tension**: Artist-centric theories (e.g., intentionalism) satisfy Req 2 but risk overruling Req 5.  

  **Most Disqualifying Requirement**:  
  **Persistence Through Total Part Replacement (Req 1)**. This immediately eliminates:  
  - Theories requiring spatiotemporal continuity (e.g., the Ship of Theseus paradox).  
  - Theories demanding original matter (e.g., naïve materialism).  
  - Theories relying on atomic composition (contradicted by biology/physics).  

  ---

  ### **Why Disputes Never Close**  
  The conflicts above are **insoluble** because:  
  1. **Science vs. Intent**: Science demands material thresholds (e.g., quantum identity); art demands intent as paramount.  
  2. **Continuity vs. Replication**: Conservation needs flexibility (topiary), but law/market need rigidity (bronze editions).  
  3. **Nested Histories**: Who "made" the marble statue—quarry or sculptor? Both answers are valid for different purposes.  

  **Result**: Institutions must prioritize context:  
  - *Insurance* favors material continuity (physical risk).  
  - *Estates* favor intent (artistic legacy).  
  - *Museums* favor work-identity (aesthetic/cultural continuity).  

  **The Takeaway**: No theory can satisfy all requirements simultaneously. Disputes persist because **material constitution is overdetermined**—no single "correct" answer exists for all stakeholders. The metaphysics can only clarify *what* is at stake, not resolve institutional trade-offs.  

  Use this framework to dissect cases: when parties disagree, map which requirements they prioritize and which conflicts they ignore. That’s where the real story lies.
