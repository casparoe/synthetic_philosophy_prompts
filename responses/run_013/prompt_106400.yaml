   The key puzzles we will consider:
   1. Thomson's lamp: A lamp is toggled (on/off) at times t=1-1/2^n for n=1,2,... (so at t=0.5, 0.75, 0.875, ...). The process is completed at t=1. What is the state of the lamp at t=1?
   2. Ross-Littlewood (RL) balls: We have an urn and infinitely many balls. At step n, we add balls 10(n-1)+1 to 10n and remove the ball with the smallest number currently in the urn. After infinitely many steps, how many balls are in the urn?
   3. Converging lamp: Instead of toggling, we adjust the brightness. At step n, we set the brightness to a value that converges to, say, 0.5. For example, set brightness to 1 at step 1, then 0.5 at step 2, then 0.75 at step 3, then 0.625, and so on, converging to 0.5. At t=1, what is the brightness? (We assume the brightness setting is instantaneous and the limit exists.)
   4. Benacerraf's task: We'll use a variant in which the state converges to a particular value, but the process of getting there involves an operation that might be thought to leave a residue. For example, consider a particle moving to the left: at step 1, it moves from 0 to -1; step 2, from -1 to -0.5; step 3, from -0.5 to -0.75; step 4, from -0.75 to -0.625; ... converging to -0.5. But note that at every step the particle is moved from its current position to the midpoint between its current position and 0. So the sequence of positions: x0=0, x1=-1, x2=-0.5, x3=-0.75, x4=-0.625, ... -> -0.5. The question: at t=1, where is the particle? The limit is -0.5, but note that the particle has been moved an infinite number of times, each time from a position to a new one. Is it at -0.5?

