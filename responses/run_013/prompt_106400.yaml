  Below is a diagnostic decision tree designed to sort readers by their underlying commitments regarding supertasks, starting from the entry point: *"A supertask can at least be described without immediate contradiction, since each step is well-defined and the schedule of steps converges."* The tree prioritizes concrete cases (Thomson's lamp, Ross-Littlewood urn, converging lamp, and a particle motion variant) and forces decisions on key assumptions without relying on pre-memorized labels. Each node is a question answerable from first principles, and the tree ensures every path traverses at least four cases.  

  ### Brainstorming Key Assumptions  
  The puzzles turn on five core assumptions:  
  1. **Convergence of states vs. outcome**: Does the limit of the state-sequence fix the outcome?  
  2. **Final membership in sequences**: Must a completed infinite sequence have a final member?  
  3. **Parity dependence**: Is the outcome fixed by the *number* of steps (e.g., parity) rather than state-history?  
  4. **Physical admissibility**: Does the idealization (discrete time, no minimum duration, etc.) undermine coherence?  
  5. **Logical status**: Is the outcome ill-posed, indeterminate, or contradictory?  

  **Deliberate omissions**:  
  - *Set-theoretic limits* (e.g., for Ross-Littlewood): Excluded to avoid conflating with state convergence.  
  - *Infinite cardinal arithmetic*: Left out as it often distracts into set theory rather than metaphysics.  
  - *Time or energy constraints*: Physical realizability is isolated to one branch to separate logical/metaphysical issues.  

  ### Decision Tree  
  **Entry commitment**: A supertask is describable without immediate contradiction.  
  1. **Thomson’s lamp (toggle at t=1−1/2ⁿ; state at t=1?)**  
     - *Is the final state (on/off) fixed by the description?*  
       - **No** → Go to 2.  
       - **Yes** → Go to 3.  
  <br>
  2. **Ross-Littlewood urn (add 10 balls, remove lowest-numbered at step n; balls at t=1?)**  
     - *Can the urn be non-empty (e.g., containing ball 100)?*  
       - **No (urn empty)** → Go to 4.  
       - **Yes (urn non-empty)** → *Incoherent*: Ball k is removed at step k, so all balls are removed. Path closed.  
  <br>
  3. **Converging lamp (brightness set to values →0.5; brightness at t=1?)**  
     - *Must the final brightness be 0.5 (the limit of the state-sequence)?*  
       - **Yes** → Go to 5.  
       - **No** → Go to 6.  
  <br>
  4. **Particle motion (moves to midpoint between current position and 0; position at t=1?)**  
     - *Sequence: x₀=0, x₁=−1, x₂=−0.5, ... →−0.5. Is the particle at −0.5?*  
       - **Yes** → **Leaf C: Limit view** (outcome = limit of state-sequence).  
       - **No** → **Leaf B**: Description consistent but fails to fix outcome.  
  <br>
  5. **Thomson’s lamp again**  
     - *Does the lamp’s state depend on the parity of switches (even/odd), not the state-sequence?*  
       - **Yes** → Go to 7.  
       - **No** → Go to 8.  
  <br>
  6. **Ross-Littlewood urn again**  
     - *Is the outcome fixed by the net number of balls added (∞) minus removed (∞)?*  
       - **Yes** → *Incoherent*: ∞−∞ is undefined in standard analysis. Path closed.  
       - **No** → **Leaf B**: Description consistent but fails to fix outcome.  
  <br>
  7. **Thomson’s lamp parity**  
     - *Is infinite parity (even/odd) well-defined?*  
       - **Yes** → Go to 9.  
       - **No** → **Leaf D**: Question ill-posed (infinite switches lack parity).  
  <br>
  8. **Converging lamp again**  
     - *Can the brightness at t=1 differ from 0.5 if the state-sequence converges to 0.5?*  
       - **Yes** → *Merely unattractive*: No known mechanism to justify divergence. Path closed.  
       - **No** → **Leaf C: Limit view** (outcome = limit of state-sequence).  
  <br>
  9. **Particle motion again**  
     - *The particle was moved infinitely often. Is it possible to be at −0.5?*  
       - **Yes** → *Incoherent*: Movement implies discontinuity with the limit. Path closed.  
       - **No** → Go to 10.  
  <br>
  10. **Thomson’s lamp final branch**  
      - *Must the lamp be on or off (excluded middle)?*  
        - **No** → **Leaf F**: Dialetheism (both on and off; reconstructed, not defended).  
        - **Yes** → **Leaf A**: Supertasks impossible (description inconsistent).  

  ### Leaves and Commitments  
  | Leaf | Position | Most Awkward Commitment | Case(s) Highlighting Issue |
  |------|----------|-------------------------|----------------------------|
  | **A** | Supertasks impossible (inconsistent) | Denies consistency of infinite completion despite convergent schedule. | Particle: Infinite moves imply no final position. |
  | **B** | Consistent but outcome unfixed | Accepts supertask coherence but denies outcome determinacy. | Ross-Littlewood: Empty urn is intuitive but not logically enforced. |
  | **C** | Limit view (outcome = limit) | Final state need not be any state occupied during the process. | Converging lamp: Brightness at t=1 never set but must be 0.5. |
  | **D** | Question ill-posed (parity undefined) | Infinite operations lack properties like parity essential to outcome. | Thomson’s lamp: Parity undefined → state undefined. |
  | **E** | Logically coherent, physically unrealizable | Physical constraints (e.g., Planck time) block realization, but logic holds. | All cases: Idealization admissible mathematically but not physically. |
  | **F** | Dialetheism (both on and off) | Accepts true contradictions; lamp in superposition. | Thomson’s lamp: Both states simultaneously (reconstructed). |

  ### Notes  
  - **Unexplored leaves**:  
    - *Leaf F* (dialetheism) is reconstructed; no prominent defenses exist.  
  - **Leaf pairs the tree cannot separate**:  
    - *Leaf B* (outcome unfixed) and *Leaf D* (ill-posed) both reject determinacy but for distinct reasons (general underdetermination vs. parity-specific).  
  - **Incoherent combinations**:  
    - "Yes" at 2 (urn non-empty) violates ball-removal logic.  
    - "Yes" at 6 (net balls = ∞−∞) uses undefined arithmetic.  
    - "Yes" at 9 (particle at limit) ignores infinite displacement residue.  
  - **Merely unattractive**:  
    - "Yes" at 8 (brightness ≠ limit) lacks justification.  
  - **Physical realizability (Leaf E)**: Not a terminal node in the tree to prioritize logical commitments, but implied if physical constraints are invoked earlier (e.g., at node 1 or 3).  

  ### Tree Summary  
  - **8 leaves** (A–F, with B and C appearing twice).  
  - **Cases covered**: Thomson’s lamp (nodes 1,3,5,7,10), Ross-Littlewood (2,6), converging lamp (3,8), particle motion (4,9).  
  - **Forced exposure**: All paths traverse ≥4 cases.  
  - **Handout-ready**: Fits two pages.  

  This tree forces readers to confront their assumptions case-by-case, moving beyond labels to reveal foundational commitments.
