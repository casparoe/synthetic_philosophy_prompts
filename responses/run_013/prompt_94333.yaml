  I'm a second-year PhD student in philosophy with a cognitive science background, and I need a short research proposal — one page plus a work plan — for an internal fellowship that would fund a single dissertation chapter. My half-formed idea: the debate over the language of thought conflates two claims that need to be kept apart, compositionality (a thesis about content: the content of a complex representation is determined by the contents of its parts and their mode of combination) and constituency (a thesis about vehicles: a complex representation literally contains, as structural parts, representations of its parts). The standard arguments for the language of thought — systematicity, productivity, and whatever work the concept-learning argument is supposed to do — look to me like arguments for compositionality, and I suspect the step to constituency is carried by an unstated premise that nothing short of a symbol-like vehicle could have compositional content. If that premise can be denied without incoherence, then the interesting question is not whether thought is compositional but what, if anything, forces its vehicles to have constituent structure. Please turn this into a proposal: state the question so that it has a determinate answer; say what in the existing positions leaves it open; set out how I would actually proceed, where the method has to be conceptual — separating the theses and specifying what would discriminate between a system with genuine constituency and one that merely has systematic content — rather than a literature survey or an experiment I could not run in a year; say what a result would look like and what would count as the project failing (if constituency turns out to be entailed by compositionality, I want that registered in advance as the failure condition); and be honest about how much of the dissertation this chapter can be expected to carry. I will add the citations myself.
