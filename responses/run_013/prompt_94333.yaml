  Here’s a concise, one-page research proposal structured to meet your requirements, emphasizing conceptual clarity, methodology, and scope:

  ---

  **Research Proposal: Disentangling Compositionality and Constituency in the Language of Thought Debate**  
  **Principal Investigator:** [Your Name], PhD Candidate, Department of Philosophy  

  ### Core Research Question
  *Does the compositionality of thought content logically entail constituency (structural decomposition) in its vehicles?*  

  ### Background and Gap
  The "Language of Thought" (LoT) hypothesis (Fodor 1975) defends two claims:  
  1. **Compositionality**: The content of complex thoughts is determined by the content of their parts + syntactic structure.  
  2. **Constituency**: Complex mental representations *literally contain* simpler representations as structural parts.  

  Standard arguments for LoT (systematicity, productivity, concept learning; Fodor & Pylyshyn 1988) are widely taken to support **both** claims. However, I propose these arguments only establish compositionality. The inference to constituency relies on an unstated premise: **compositional content *must* be implemented by vehicles with constituent structure**. This premise remains unchallenged, leaving a critical gap: *What, if anything, forces vehicles to mirror the structure of content?*  

  ### Hypothesis
  Compositionality does not entail constituency. Vehicles may realize compositional content *without* being structurally decomposable (e.g., via distributed, holistic, or dynamic systems). The conflation of these theses obscures viable non-classical architectures of thought.  

  ### Methodology: Conceptual Analysis & Criteria Development  
  I will employ a three-step conceptual methodology:  
  1. **Disambiguation**: Precisely define:  
     - *Compositionality*: A property of **content** (functions from representations to truth-conditions).  
     - *Constituency*: A property of **vehicles** (physical/functional parts bearing semantic values).  
  2. **Discrimination Criteria**: Specify conditions distinguishing systems with:  
     - **Genuine constituency**: Vehicles are causally/functionally decomposable (e.g., syntactic tokens in a computational system).  
     - **Mere systematic content**: Outputs exhibit compositional semantics, but vehicles lack discrete parts (e.g., connectionist vectors with superpositional encoding).  
     *Key test*: Can the system exhibit systematicity *without* vehicle recombination? (e.g., via context-sensitive activation patterns).  
  3. **Premise Audit**: Reconstruct LoT arguments to isolate where constituency is assumed. Test if arguments fail *only* if the "mirroring premise" (compositional content → constituent vehicles) is false.  

  ### Expected Outcomes & Significance  
  - **Success**: A rigorous framework showing compositionality and constituency are separable theses. This would:  
    - Undercut the necessity of symbolic vehicles for systematic thought.  
    - Open space for non-classical (e.g., connectionist, embodied) models of cognition.  
  - **Failure**: Demonstrated entailment between compositionality and constituency (e.g., via formal proofs showing compositional semantics *requires* syntactically structured vehicles). *This is the explicit failure condition*.  
  - **Dissertation Contribution**: This chapter (15–20% of the thesis) establishes foundations for evaluating cognitive architectures. It does *not* resolve the LoT debate but reframes it around vehicle-content relations, enabling subsequent empirical/theoretical work.  

  ### Work Plan (9 Months)
  | Month | Task |
  |-------|------|
  | 1–2   | **Thesis Disambiguation**: Analyze LoT arguments (Fodor, Pylyshyn) and critiques (e.g., connectionist replies) to isolate premises linking content/vehicles. |
  | 3–4   | **Criteria Development**: Formalize discrimination criteria (e.g., using model cases: symbolic vs. vector-based systems). |
  | 5–6   | **Gap Identification**: Test if standard arguments collapse without the mirroring premise; evaluate alternatives (e.g., Camp 2007 on "canonical" vehicles). |
  | 7–8   | **Synthesis & Drafting**: Integrate results; draft chapter addressing entailment question. |
  | 9     | **Revision & Fellowship Report**: Finalize chapter; prepare dissemination. |

  ### Feasibility
  This project is achievable within 1 year:  
  - Focuses on conceptual groundwork, not new empirical data.  
  - Builds on established literature (Fodor, Pylyshyn, Ramsey, Smolensky, Camp).  
  - Failure is informative: Entailment would validate classical LoT; its absence reshapes the debate.  

  ---

  **Key Strengths:**  
  - **Novelty**: Targets an implicit premise in a 50-year debate.  
  - **Precision**: Explicit success/failure conditions.  
  - **Dissertation Role**: Foundational (sets stage for later chapters on cognitive architecture).  

  **Citations to Add:** Fodor (1975, 2008), Fodor & Pylyshyn (1988), Smolensky (1991), Camp (2007), Ramsey (2007).  

  Let me know if you'd like adjustments to emphasis or structure!
