prompt: |-
  I'm a third-year PhD student in computer security -- my area is adversarial ML, mostly poisoning and evasion, and I spend my days in threat models, trust boundaries, attack surfaces, and the usual risk-acceptance calculus. Through a weird cross-disciplinary reading group I've ended up reading Augustine on lying, and I know the security side of this cold while the Augustine side is basically one seminar plus whatever I've retained, so keep me honest where I'm probably misreading him.

  What I want: take Augustine's position on lying and restate the whole thing in the vocabulary I actually use. That includes his definition of a lie, his absolute "never, not even to save a life" line, his ladder of lie-types from the harmless joke up to the lie that rescues someone, and especially the weird edge cases -- the person who says something false but sincerely believes it true and so (on Augustine's view) isn't lying at all, versus the person who says something true while believing it false, or says something true hoping you'll take it as false, who is lying in his conscience. Put all of that into threat models, adversarial intent, spoofing versus honest error, integrity versus authenticity of a message, replay or selective disclosure of genuine data, cost-benefit risk acceptance, assume-breach thinking, and the fact that in security you only ever observe behavior and never the adversary's internal state.

  Be faithful. Don't quietly turn Augustine into a security engineer -- I don't want you smuggling in a consequentialist risk calculus and calling that a translation. Where you have to distort something to make it fit, flag it.

  Then the part I actually care about: the residue report. What goes across cleanly, what only goes across with damage, and what has no expression at all in my vocabulary -- the "speech exists to express the mind" teleology, the idea that the liar damages himself rather than only the person deceived, the unobservable will as the very thing that makes an act a lie, the absolute prohibition as a rule rather than a tradeoff. For each piece of residue, tell me whether it's my framework failing (it simply can't represent that kind of fact) or whether Augustine's claim is vaguer than it looks once you try to operationalize it -- e.g. is "intent to deceive" doing any real work here, or is it a placeholder that collapses the moment you need to detect it?

  Start by brainstorming the mappings before you commit to any of them, think carefully about the edge cases, and write as someone who could referee both a security paper and a patristics seminar.
