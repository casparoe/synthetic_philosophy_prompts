answer: |-
  Here’s a targeted Q&A prep sheet prioritizing high-damage objections, audience-specific phrasing, and strategic concessions.  

  ### **Upfront Concessions**  
  1. "Moore’s doctrine of organic unities *is* sophisticated and captures *some* relational dimensions of value."  
  2. "States of consciousness *are* essential to friendship’s value; I reject only their *sufficiency*."  
  3. "The historical shift away from Moore wasn’t *solely* due to this tension—but it accelerated it."  

  ---

  ### **Objections Ordered by Damage Potential**  
  *(Phrased as the audience member would, with reply and soft spot)*  

  1. **Senior Historian of Early Analytic Philosophy**  
     *Objection:* "You misread Moore. *Pleasures of human intercourse* already embed the friend’s reality via organic unities. The whole ‘state of consciousness’ includes the *apprehension of the other’s existence*—so the gap is closed. Your ‘asymmetry’ collapses."  
     *Reply (2-min):* "Moore’s organic whole *requires* the friend’s existence as a *part*, but intrinsic goodness still resides *only* in the conscious state (PE, §113). Valuing my friend *as a real person*—not just as a constituent of my experience—demands her existence grounds the good *independently*. Moore reduces her to a *catalyst* for my state; friendship demands she *shares* in the good. Organic unities obscure this by making the friend’s existence *instrumental* to the valuable state."  
     *Soft Spot:* Doesn’t fully refute that "apprehension of real existence" *could* satisfy the relational demand. Risks sounding revisionary on Moore’s text.  

  2. **Internalist-Leaning Value Theorist**  
     *Objection:* "Why isn’t the *experience of relating* sufficient? If I hallucinate a perfect friendship, isn’t that intrinsically valuable? Your ‘actual character’ requirement conflates value with truth-tracking."  
     *Reply (2-min):* "Hallucinated friendship *feels* valuable but lacks the distinctive good of *mutual recognition*—which requires a real other. We resent being deceived in friendship because the value hinges on *her* agency/presence, not just my experience. Relational goods are *co-constituted*; internalism can’t capture that without reducing the other to a prop. The asymmetry with beauty: a hallucinated sunset loses nothing *as an aesthetic object*."  
     *Soft Spot:* Concedes hallucinated friendship has *some* value. Requires asserting mutual recognition as non-negotiable without full argument.  

  3. **Consequentialist**  
     *Objection:* "What *turns* on this? Even if friendship’s value is relational, why should care about intrinsic value debates? Focus on friendship’s *consequences* for well-being."  
     *Reply (2-min):* "If friendship’s value depends partly on *her reality*, we must respect her as *constitutive* of the good—not just a tool for our states. This reframes duties: e.g., deceiving a friend isn’t just harmful; it *invalidates* the relationship’s value. Contrast: lying about a painting’s provenance doesn’t undermine aesthetic value. Ignoring this collapses the moral distinctiveness of interpersonal bonds."  
     *Soft Spot:* Assumes intrinsic value debates impact normative ethics—consequentialists may see this as question-begging.  

  4. **Relational Value Theorist**  
     *Objection:* "You’re still privileging individualism! If friendship’s good is *ours*, not mine *and* hers, doesn’t that require ditching internalism *entirely*—not just tweaking Moore?"  
     *Reply (2-min):* "Agreed—this *is* a step toward your view. But showing Moore’s internalism *fractures* under friendship’s weight helps *explain* why relational accounts emerged. My goal is diagnostic: exposing why internalism resists absorption into relational models creates space for your approach. Moore’s tension is a symptom of individualism’s limits."  
     *Soft Spot:* Risks co-optation ("So you agree with us?"). Doesn’t defend a *positive* relational metaphysics.  

  5. **Non-Cognitivist Philosopher**  
     *Objection:* "This whole debate misframes friendship. We don’t value friends *for reasons*—it’s a non-rational commitment. Your ‘value internalism’ is a category error."  
     *Reply (2-min):* "Even if friendship’s *motivation* is non-rational, we can ask why we *ought* to sustain it, or why betrayal *corrupts* it. That demands a value ontology. Your view can’t explain why *this* relationship (vs. a delusion) warrants non-rational commitment. My argument shows why internalism fails *if* we grant friendship has objective value—which most in this room assume."  
     *Soft Spot:* Dismisses their meta-ethical stance; may alienate them.  

  ---

  ### **The Question I Hope Nobody Asks**  
  **"Can you specify *exactly* what metaphysical relation between friends constitutes the good—and how it avoids collapsing into your experience *of* that relation?"**  
  *Why I Fear It:* Forces me into underdeveloped relational metaphysics or concedes ground to internalism. Moore’s ghost wins if I can’t articulate a positive alternative.  

  ### **Strategic Summary**  
  - **Defend the asymmetry**: Hammer the friend-as-independent-agent vs. artwork-as-object distinction.  
  - **Leverage shared intuitions**: Use betrayal/deception cases to highlight relationality’s normative pull.  
  - **Neutralize historians**: Stress Moore’s *reduction* of the friend to a "necessary condition" for conscious states (PE, §121).  
  - **Pacify consequentialists**: Emphasize implications for autonomy/respect in friendship ethics.  
  - **Isolate the non-cognitivist**: Note that *even on their terms*, internalism distorts friendship’s structure.  

  *Final Tip:* If the "metaphysics of relations" question arises, reply: "That’s the next project—but today, I’m only showing *why Moore’s framework cracks* under friendship’s weight." Exit fast.
