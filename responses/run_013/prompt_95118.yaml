answer: |-
  ### **Ambiguity Aversion: In-Class Activity Design**  
  **Goal:** Make students *feel* the tension between risk (known probabilities) and ambiguity (unknown probabilities) without priming them. Focus on experiential learning, then unpack the Ellsberg paradox through debrief.  

  ---

  ### **Core Structure**  
  - **4 Rounds** with different urn types (obscures "safe" choices).  
  - **Private bets** using tokens (tokens = raffle entries for chocolate bar).  
  - **Key variations:**  
    - Round 1: Standard Ellsberg (baseline).  
    - Round 2: Adversary-set unknown (suspicion trigger).  
    - Round 3: Random-process unknown (reduce suspicion).  
    - Round 4: Information asymmetry (knowing vs. not knowing).  
  - **Debrief:** Highlight contradictions, open debate on rationality.  

  ---

  ### **Materials**  
  1. **Urns (4):** Use opaque containers labeled "Urn A, B, C, D" (prevents pattern recognition).  
     - *Physically:* Shoe boxes with colored balls/paper slips.  
     - *Digitally (if preferred):* Google Form with virtual urns (prevents cheating).  
  2. **Balls:** 90 per urn (e.g., red/blue/yellow for Urn A, green/orange/purple for Urn B, etc.).  
  3. **Tokens:** Poker chips or printed cards (1 token = 1 raffle entry).  
  4. **Betting Slips:** Paper forms or digital poll for private bets.  
  5. **Prize:** Chocolate bar (small real stake to incentivize engagement).  
  6. **Randomizer:** Coin or dice for Round 3.  

  ---

  ### **Setup (5 min)**  
  - **Students get:** 8 tokens (2 per round) + betting slips.  
  - **Instructions:**  
    > *"You’ll bet tokens on colors drawn from urns. Each token is a raffle entry for a chocolate bar. In each round, you’ll face two bets. For each bet, pick ONE color to wager a token. We’ll draw one ball from each urn at the end to decide wins."*  
  - **No jargon:** Avoid "probability," "ambiguity," or "Ellsberg."  

  ---

  ### **Rounds (60 min)**  
  **Urn compositions hidden until debrief. Students bet privately.**  

  #### **Round 1: Standard Ellsberg (15 min)**  
  - **Urn A:** 30 red balls, 60 balls that are **either black or yellow** (unknown proportion).  
  - **Bet 1:** Choose to bet on:  
    - **Option A:** Red drawn → Win.  
    - **Option B:** Black drawn → Win.  
  - **Bet 2:** Choose to bet on:  
    - **Option C:** Red or yellow drawn → Win.  
    - **Option D:** Black or yellow drawn → Win.  
  - **Why:** Establishes baseline ambiguity aversion (expect A and D chosen).  

  #### **Round 2: Adversary-Set Unknown (15 min)**  
  - **Urn B:** 30 blue balls, 60 balls that are **either green or orange** (set by *adversary*).  
  - **Adversary Role:** Assign a student (or yourself) as "House." Announce:  
    > *"The House set the green/orange split to minimize your chances of winning. They know the bet options and want you to lose."*  
  - **Bets:** Same as Round 1 (Bet 1: Blue vs. Green; Bet 2: Blue-or-Orange vs. Green-or-Orange).  
  - **Why:** Tests if suspicion amplifies aversion.  

  #### **Round 3: Random-Process Unknown (15 min)**  
  - **Urn C:** 30 white balls, 60 balls that are **either gray or pink** (set by *random process*).  
  - **Process:** Flip a coin in front of class:  
    - *Heads:* 30 gray, 30 pink.  
    - *Tails:* 60 gray, 0 pink.  
    > *"The split was decided by this coin flip. You know the process but not the outcome."*  
  - **Bets:** Same structure (Bet 1: White vs. Gray; Bet 2: White-or-Pink vs. Gray-or-Pink).  
  - **Why:** Tests if known randomness reduces aversion.  

  #### **Round 4: Information Asymmetry (15 min)**  
  - **Urn D:** 30 gold balls, 60 balls that are **either silver or bronze** (unknown proportion).  
  - **Split Class:**  
    - **Group 1 (Informed):** 2 students secretly see the urn composition (e.g., 30 silver/30 bronze). They advise their group.  
    - **Group 2 (Uninformed):** No information.  
  - **Bets:** All bet (Bet 1: Gold vs. Silver; Bet 2: Gold-or-Bronze vs. Silver-or-Bronze).  
  - **Why:** Tests if "knowing you don’t know" drives aversion.  

  ---

  ### **Token Payoff & Raffle (5 min)**  
  - **Resolve wins:** Draw one ball from each urn.  
  - **Winning a bet:** Token returned + 1 bonus token (2 total entries).  
  - **Losing a bet:** Token forfeited.  
  - **Raffle:** Draw 1–2 winners for chocolate bar post-debrief.  
  - **Why no real money:** Tokens with raffle create lightweight stakes (behavioral engagement without ethics issues).  

  ---

  ### **Debrief (20 min)**  
  **Map activity to concepts while preserving open debate.**  

  1. **Reveal Patterns (5 min):**  
     - Tally choices on board for each round. Highlight:  
       - Round 1: Most chose A (red) and D (black-or-yellow).  
       - Round 2: Stronger aversion (e.g., 80% avoid green/orange).  
       - Round 3: Weaker aversion (e.g., 50% bet on gray/pink).  
       - Round 4: Uninformed group avoids silver/bronze; informed does not.  
     - *Ask:* "What felt different in Round 2 vs. Round 3?"  

  2. **Contradiction Spotlight (5 min):**  
     - Take Urn A: Point out that choosing A (red) and D (black-or-yellow) implies:  
       - Bet 1: You believe red > black (P(red) > P(black)).  
       - Bet 2: You believe black-or-yellow > red-or-yellow.  
         → Since yellow is fixed, this implies P(black) > P(red).  
     - *State:* "This contradicts the sure-thing principle. Can’t hold both beliefs under one probability distribution."  

  3. **Open Debate (10 min):**  
     - **Ambiguity aversion = mistake?**  
       - *Argue for:* Inconsistent probabilities are irrational. In Round 3 (random), aversion drops—so it’s fixable.  
     - **Ambiguity aversion = rational?**  
       - *Argue for:* Round 2 (adversary) justifies suspicion. If the world is hostile, max-min preferences make sense.  
     - **Moderate:** "Is aversion about *ignorance* or *distrust*? Can we blame people for hedging against hidden adversaries?"  
     - **End:** "This is the heart of Ellsberg. No consensus—economists still debate it."  

  ---

  ### **Handling Pitfalls**  
  1. **Sharp student slaps on a uniform prior:**  
     - *In-activity:* If a student declares, "I’ll assume all splits are equally likely," nod and say:  
       > "Great! Bet however you want—but track if this feels right in the adversary round."  
     - *Debrief:* Use their approach to contrast Round 2 vs. Round 3:  
       - "Uniform priors work for random processes (Round 3) but feel naive against an adversary (Round 2)."  

  2. **Defectors choosing "rational" options:**  
     - *Design fix:* Random urn labels and color swaps obscure the "Ellsberg pattern." Most won’t recognize it.  
     - *Debrief:* If defectors surface, challenge them:  
       > "Would you bet against the House the same way you bet against a coin flip?"  

  3. **What the activity can’t replicate:**  
     - Real-world stakes (tell students: "High stakes amplify aversion—imagine this was $1,000").  
     - Full emotional weight of ambiguity (say: "This is a taste—real decisions feel messier").  

  ---

  ### **Timeline**  
  | **Time** | **Phase**              | **Key Actions**                                                                 |
  |----------|------------------------|---------------------------------------------------------------------------------|
  | 0–5 min  | Setup                  | Distribute tokens, explain bets/raffle.                                         |
  | 5–20 min | Round 1 (Standard)     | Urn A bets.                                                                     |
  | 20–35 min| Round 2 (Adversary)    | Urn B bets + emphasize House role.                                              |
  | 35–50 min| Round 3 (Random)       | Urn C bets + coin flip in class.                                                |
  | 50–65 min| Round 4 (Information)  | Split class; Urn D bets.                                                        |
  | 65–70 min| Raffle & Token Resolve | Draw balls, award bonus tokens, hold raffle.                                    |
  | 70–75 min| Debrief                | Pattern reveal → contradiction → open debate.                                   |

  ---

  ### **Why This Works**  
  - **Gut-level tension:** Urns 2 (adversary) and 3 (random) force students to confront why their aversion shifts.  
  - **No smuggling verdicts:** Debate frames both sides ("mistake" vs. "rational") without endorsing either.  
  - **Defang sharp students:** Random processes (Round 3) validate uniform priors; adversaries (Round 2) invalidate them.  
  - **Stakes that matter:** Chocolate raffle ensures choices aren’t arbitrary but avoids real-money complications.  

  **Final Prep Tip:** Dry-run with a TA to nail timing. Urn setups take 2 min each—pre-fill boxes before class.
