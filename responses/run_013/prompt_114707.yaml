prompt: |-
  I am the complaints and patient-safety investigator for a psychiatric hospital group. I write up roughly twenty cases a month — a patient says a medication has ruined their life, that a nurse was rough with them during restraint, that the ward round did not listen — and my findings go to the medical director and sometimes to lawyers, so they have to be defensible. I have about ninety minutes per case, one interview, the clinical record, and no clinical training beyond what I have picked up on the job. I am trying to rebuild our method around the literature on epistemic injustice, and I keep failing, because our present checklist — ask open questions, avoid assumptions, record the patient's words verbatim — is addressed entirely to the hearer's manners, while the failures that actually worry me are not.

  Let me set out the four failure modes I want the procedure to catch, since our previous version conflated them. First, plain credibility discounting: the report is heard and understood but given less weight because of who is speaking — the psychiatric label, the accent, the class, the history of complaints. Second, the discounting that hides inside plausibility: a report is set aside not because we disbelieve the speaker but because the thing reported strikes us as unlikely, and our sense of what is likely has been shaped by the very prejudices at issue. This is the one I most need tests for, because from the inside it feels like clinical judgement rather than prejudice. Third, the reports that never arrive: patients learn which complaints are futile and which will be read as symptoms, so they stop making them — which means our absence of complaints is evidence of nothing, and the procedure needs some audit step that does not depend on complaints. I have not been able to design one. Fourth, the gap in vocabulary: neither the patient nor we have the words for what happened, so the complaint arrives as vagueness, and vagueness is then read as unreliability. On the account I have been reading, that last one is not a failure of listening and will not be fixed by listening harder, which suggests that part of what I want a procedure to do cannot be done by a procedure at all.

  Write me the procedure. I want the questions in order, what counts as a sufficient answer to each, where the procedure terminates in a finding and where it terminates by handing the question to a person because the question is one of values rather than facts, and I want the steps that are doing moral work under the guise of evidential reasoning flagged as such. It must be runnable by a colleague with no philosophy training, in ninety minutes, and it must still produce a decision where the evidence is thin — the medical director will not accept a finding that amounts to "we cannot know" — so tell me how to do that without pretending to a certainty I do not have.

  Then run it on three cases: a patient with a diagnosis of schizophrenia reporting an unbearable inner restlessness that the record calls agitation and treats with more medication; a patient who says the food is being poisoned, where the record and an independent check both indicate that it is not; and a complaint from a patient who has made eleven previous complaints, every one of them closed without action. At least one of the three should come out in a way I will not like, and I would rather you tell me which parts of this job the procedure will keep getting wrong than round the edges off. No citations needed; take the concepts as given.
reasoning: |-
  We are designing a procedure to address four failure modes in investigating patient complaints, with the constraints of 90 minutes per case, one interview, and reliance on clinical records. The procedure must be executable by someone without philosophy training and must produce a defensible decision even when evidence is thin.

  The four failure modes:
  1. Plain credibility discounting (bias against the speaker).
  2. Discounting hidden in plausibility assessments (bias in what we consider likely).
  3. Reports that never arrive (complaints are suppressed, so absence isn't evidence of safety).
  4. Vocabulary gap (lack of shared language leading to vagueness interpreted as unreliability).

  The procedure must include:
  - Ordered questions with clear sufficiency criteria.
  - Indication of when to terminate with a finding vs. when to hand over to a person (for value judgments).
  - Flagging of steps that do moral work under the guise of evidential reasoning.
  - Must run in 90 minutes and produce a decision even when evidence is thin (no "cannot know").

  We also need to apply the procedure to three cases and have at least one come out unfavorably.

  Procedure Design:

  We break the procedure into phases:

  Phase 1: Pre-interview record review (15 minutes)
  Phase 2: Patient interview (45 minutes)
  Phase 3: Analysis and decision (30 minutes)

  Detailed Steps:

  Phase 1: Record Review (15 min)
  Goal: Identify potential biases and prepare for the interview.

  Steps:
  1. Read the complaint and the clinical record. Note: 
     a. The patient's demographic and clinical characteristics (diagnosis, history, etc.).
     b. The specific events and the patient's account as recorded.
     c. Staff responses and any prior similar complaints by the patient or others.

  2. Flag for potential failure modes:
     a. (Credibility discounting) Note any characteristics (diagnosis, accent, class, complaint history) that might lead to discounting. Write: "Potential for credibility discounting due to [X]."
     b. (Plausibility discounting) Note if the complaint was dismissed because it seemed implausible. Ask: "Is the staff's assessment of plausibility based on typical clinical expectations that might be biased? What evidence supports the staff's view? What evidence challenges it?"
     c. (Reports that never arrive) Note if there is a pattern of similar complaints not being made. Also, note if the patient has a history of not complaining or if there are gaps in the record where complaints might be expected but are absent. (But without direct evidence, this is hard. We will address with an audit step later in the procedure.)
     d. (Vocabulary gap) Note if the patient's description in the record is vague or if there is a mismatch in terminology.

  Phase 2: Patient Interview (45 min)
  Goal: Gather the patient's account while minimizing epistemic injustice.

  Steps:

  1. Introduction (2 min):
     - Explain your role: "I am an investigator. My job is to understand what happened from your perspective and to look into your concerns."
     - Explain the process: "I will ask you to describe what happened in your own words. I will take notes and may ask clarifying questions. I will read back what I write to ensure I have it right."

  2. Open-ended account (15 min):
     - Ask: "Please tell me what happened, from the beginning, in your own words. Include anything that felt wrong or unsafe to you."
     - Do not interrupt. Take verbatim notes.

  3. Clarification (15 min):
     - Read back key points to the patient for accuracy.
     - Ask clarifying questions, focusing on:
       a. Specifics: Who, what, when, where.
       b. Sensory details: What did you see, hear, feel?
       c. Impact: How did this affect you?
     - Avoid leading questions. Use the patient's words where possible.

  4. Addressing failure modes explicitly (13 min):
     a. (Credibility discounting) Ask: "Is there anything about you or your situation that you think might make people not take your complaint seriously?" (Note: This directly addresses the patient's perception of bias.)
     b. (Plausibility discounting) Ask: "When you reported this, did anyone tell you that what you described couldn't have happened? If so, what reasons did they give?" and "What do you think might make others find your complaint hard to believe?" (This surfaces the plausibility challenge from the patient's side.)
     c. (Reports that never arrive) Ask: "Have there been other times when you wanted to complain about something but didn't? Why?" and "Do you know of other patients who have had similar experiences but didn't complain?" (This gathers indirect evidence about suppressed complaints.)
     d. (Vocabulary gap) Ask: "Is there a way in which what happened is hard to put into words? Can you think of any words or phrases that might come close?" and "Have you found that the words you use to describe your experience are understood differently by staff?" (This helps identify gaps and may lead to better articulation.)

  Phase 3: Analysis and Decision (30 min)
  Goal: Weigh evidence and reach a conclusion.

  Steps:

  1. Map the evidence (10 min):
     - Create two columns: "Patient's Account" and "Clinical Record/Other Evidence".
     - List each claim from the patient and the corresponding evidence from the record or other sources (like independent checks).

  2. Assess each claim for failure modes (10 min):
     a. Credibility discounting: For each claim, ask: "Is there a reason to discount this claim based on the speaker's characteristics? If so, is that reason defensible or biased?" [Flag: This step does moral work by requiring explicit justification for discounting.]
     b. Plausibility discounting: For each claim, ask: "Is the claim being rejected because it seems implausible? What is the basis for that implausibility? Are there alternative explanations that are being overlooked?" [Flag: This step does moral work by challenging the normative basis of plausibility.]
     c. Reports that never arrive: Consider the interview responses about suppressed complaints. If the patient reports a pattern of non-complaint, note: "The absence of complaints in the record may not indicate safety." However, without more, we cannot act on non-events. [Audit step: We cannot resolve this in a single case. The procedure must include a periodic audit of the complaint system (e.g., anonymous surveys, focus groups) but that is beyond the single case. For now, note it as a limitation.]
     d. Vocabulary gap: For vague claims, note: "The vagueness may be due to a vocabulary gap. Consider if there is a core concern that is being missed." Then, try to reframe the concern in neutral language without distorting.

  3. Make a finding (10 min):
     - The finding must be one of:
       a. Upheld: The evidence supports the complaint.
       b. Not upheld: The evidence does not support the complaint.
       c. Inconclusive but concerning: The evidence is thin but there are indicators of a problem that require further investigation (by someone else, because of time constraints) or systemic review.
       d. Unfounded: The evidence positively contradicts the complaint.

     - Even when evidence is thin, we must decide. The rule is: 
       - If the patient's account is coherent and not contradicted by evidence, and there is no defensible reason to discount it, then we lean toward upheld.
       - If the account is contradicted by strong evidence, then not upheld or unfounded.
       - If there are signs of systemic issues (e.g., vocabulary gap, plausibility discounting) that prevent a clear finding, then "inconclusive but concerning" and recommend further investigation (e.g., by a team with more time or expertise).

     - [Flag: The decision to lean toward the patient's account when evidence is balanced does moral work by countering historical discounting.]

  4. Write the report (included in the 30 min):
     - State the complaint, the evidence, the analysis, and the finding.
     - Explicitly note if any failure modes were identified and how they were handled.
     - For "inconclusive but concerning", state: "This complaint could not be fully resolved within the constraints of this investigation, but there are indicators of a problem that warrant further review in [specific area]."

  Now, run the procedure on three cases:

  Case 1: Patient with schizophrenia reporting unbearable inner restlessness (record calls it agitation and treats with more medication).

  - Phase 1 (Record): 
    - Diagnosis: schizophrenia. Record describes agitation and medication increased.
    - Potential credibility discounting: due to diagnosis.
    - Plausibility discounting: staff may see restlessness as symptom, not side effect or separate issue.
    - Vocabulary gap: "inner restlessness" vs "agitation".

  - Phase 2 (Interview):
    - Patient describes inner restlessness as distinct from agitation (maybe a side effect of medication?).
    - Ask: "Do you think your diagnosis affects how staff hear you?" (Patient says yes, they think staff see everything as symptoms.)
    - Ask about plausibility: "When you reported this, did anyone say it couldn't be happening?" (Patient: "They said it's my illness and gave me more meds.")
    - Ask about vocabulary: "Is 'inner restlessness' the best way to describe it? Can you say more?" (Patient: "It's like my nerves are crawling, but not because I'm anxious. It started after the new medication.")

  - Phase 3:
    - Map: 
      - Patient: Inner restlessness started after medication increase, not typical agitation.
      - Record: Increased agitation, treated with more medication.
    - Assess:
      - Credibility discounting: The diagnosis might have led to discounting. We must consider if the restlessness could be akathisia (a medication side effect). Without clinical training, we note: the patient's report of timing and description (crawling) is consistent with akathisia. The staff's interpretation might be biased by the diagnosis.
      - Plausibility: Staff found it plausible as agitation (a symptom) but not as a side effect. This might be discounting due to diagnostic overshadowing.
      - Vocabulary gap: The patient's description is specific and matches known side effects (akathisia). The gap was in the staff's interpretation.
    - Finding: Upheld (as a possible medication side effect not adequately considered). The evidence is that the patient's account is coherent and matches a known phenomenon. The record does not refute it; it just interprets differently. We recommend a medication review by a psychiatrist.

  Case 2: Patient says the food is being poisoned. Record and independent check show it is not.

  - Phase 1:
    - Complaint: Food poisoning.
    - Record: Patient has delusional disorder. Independent check (e.g., food inspection) found no issue.
    - Potential credibility discounting: due to delusional disorder.
    - Plausibility discounting: The claim is implausible because of the independent check and the patient's diagnosis.

  - Phase 2:
    - Patient: "The food tastes metallic and makes me nauseous. They are poisoning me."
    - Ask about credibility: "Do you think your mental health condition affects how staff hear you?" (Patient: "Yes, they think I'm paranoid.")
    - Ask about plausibility: "What reasons did staff give for not believing you?" (Patient: "They said the food is tested and I'm ill.")
    - Ask about vocabulary: "Can you describe the poisoning more? What does it feel like?" (Patient: "I feel sick after eating. The food has a chemical taste.")

  - Phase 3:
    - Map:
      - Patient: Food causes nausea and metallic taste.
      - Record: Independent check found no contamination. Diagnosis of delusional disorder.
    - Assess:
      - Credibility discounting: The diagnosis may lead to discounting, but the independent check is strong evidence.
      - Plausibility: The independent check makes the poisoning claim implausible. However, the patient's symptoms (nausea, metallic taste) are real and could have other causes (e.g., medication side effect, illness, or even a food allergy). The staff may have conflated the implausibility of poisoning with the implausibility of the symptoms.
      - Vocabulary gap: The patient uses "poisoning" to describe physical symptoms. The gap is in the interpretation of the cause.
    - Finding: Not upheld for poisoning, but inconclusive for the symptoms. The physical symptoms are real and should be investigated medically. We recommend a medical workup for nausea and metallic taste.

  Case 3: Complaint from a patient with eleven previous complaints, all closed without action.

  - Phase 1:
    - History: 11 prior complaints, all closed without action. Current complaint: not specified, but let's say it's about a nurse being rough during restraint.
    - Potential credibility discounting: due to complaint history (labeled as a frequent complainer).
    - Plausibility: Staff might dismiss as "another complaint from X".

  - Phase 2:
    - Patient: "During restraint, Nurse Y twisted my arm and it hurt."
    - Ask about credibility: "Do you think your history of complaining affects how staff hear you?" (Patient: "Yes, they think I complain about everything.")
    - Ask about plausibility: "Did anyone say this couldn't have happened?" (Patient: "They said I was resisting and they had to restrain me.")
    - Ask about vocabulary: "Can you describe what happened in more detail?" (Patient: "He grabbed my arm and bent it behind my back. I felt a sharp pain.")

  - Phase 3:
    - Map:
      - Patient: Rough handling during restraint causing pain.
      - Record: The record notes the restraint and that the patient was resisting.
    - Assess:
      - Credibility discounting: The history of complaints might lead to automatic discounting. We must not let the history bias us but assess this complaint on its own.
      - Plausibility: The staff's view is that the patient was resisting, which might make some force necessary. But the specific claim of arm-twisting and pain is plausible in a restraint, even if necessary. However, if the pain was due to necessary force, then it might not be rough. Without witnesses or injury, it's hard.
      - Note: The prior complaints might indicate a pattern, but we don't have time to re-investigate them. The procedure must focus on this event.
    - Finding: Inconclusive but concerning. The patient's account is specific and plausible, but the record does not refute it. The pattern of prior complaints without action suggests a systemic issue in how this patient's complaints are handled. We recommend a review of the restraint incident by a clinical supervisor and a review of the handling of this patient's complaints in general.

  Which one comes out unfavorably? Case 2: the poisoning complaint is not upheld, which you might not like because the patient's experience of symptoms is real but the complaint as stated (poisoning) is not supported. However, we did not dismiss the symptoms and recommended medical follow-up.

  But note: the procedure will keep getting wrong the "reports that never arrive" because we cannot capture non-events in a single case. We can only note the possibility and recommend systemic audits. Also, in Case 3, we cannot resolve the pattern of complaints without more resources. The procedure flags the concern but cannot fix it.

  The procedure's weaknesses:
  - It relies on the investigator's ability to recognize failure modes without clinical training.
  - It cannot fully address systemic issues (like suppressed complaints) in a single case.
  - When evidence is thin, it must still decide, which can lead to errors.

  But it makes the moral choices explicit and counters epistemic injustice where possible.
answer: |-
  Below is a structured, step-by-step procedure designed to address the four failure modes of epistemic injustice in patient complaint investigations. The procedure is built for efficiency (90 minutes total), clarity (runnable by a non-philosopher), and defensibility (produces a clear decision even with thin evidence). It prioritizes catching credibility discounting, plausibility bias, suppressed complaints, and vocabulary gaps, while flagging steps where moral judgments are embedded in evidentiary reasoning. The procedure is divided into three phases: **Record Review** (15 minutes), **Patient Interview** (45 minutes), and **Analysis & Decision** (30 minutes). 

  Each step includes:
  - **Question/Instruction**: What to ask or do.
  - **Sufficient Answer**: What constitutes a complete response (to avoid open loops).
  - **Termination Point**: Whether the step ends in a finding (fact-based) or a handoff (value-based).
  - **Flag for Moral Work**: Identified where moral reasoning is disguised as evidence assessment.

  The procedure forces a decision in all cases by using a standard of "reasonable plausibility" (if the patient's account is internally consistent, not contradicted by unambiguous evidence, and aligns with known patterns of injustice, it is upheld unless definitively refuted). This avoids "we cannot know" but acknowledges uncertainty through qualifiers like "evidence suggests" or "indicators point to".

  ---

  ### **Procedure for Patient Complaint Investigation**
  **Total Time:** 90 minutes  
  **Objective:** Assess complaint for epistemic injustice failure modes and produce a defensible finding (Upheld, Not Upheld, Inconclusive but Concerning, or Unfounded).  

  #### **Phase 1: Record Review (15 min)**  
  *Goal: Identify potential biases and inconsistencies in the record before the interview.*  

  1. **Review complaint and clinical record**  
     - *Question:* What does the complaint allege? What does the record say about the event, patient history, and staff responses?  
     - *Sufficient Answer:* Summary of: (a) Complaint details, (b) Staff documentation of the event, (c) Patient diagnosis, demographic, and complaint history.  
     - *Termination:* Fact-based. Proceed to next step.  
     - *Flag for Moral Work:* None. Pure evidence-gathering.  

  2. **Flag failure modes in the record**  
     - *Question:* Does the record show red flags for credibility discounting (e.g., diagnosis, class, complaint history), plausibility bias (e.g., staff labeling complaint "implausible" without evidence), or vocabulary gaps (e.g., patient's words reinterpreted as symptoms)?  
     - *Sufficient Answer:* List of 1–3 specific red flags (e.g., "Staff dismissed poisoning claim due to schizophrenia diagnosis" or "Patient's description of restlessness was relabeled as agitation"). If none, note "no flags observed."  
     - *Termination:* Fact-based. Proceed.  
     - *Flag for Moral Work:* None. Focuses on documented biases.  

  3. **Assess for suppressed complaints**  
     - *Question:* Is there evidence complaints are not being reported? (e.g., similar past complaints closed without action, gaps in records where harms are likely but unreported).  
     - *Sufficient Answer:* Yes/no + brief rationale (e.g., "3 similar complaints from other patients closed without action in past 6 months" or "No evidence of suppression"). If absent, note: "Suppression risk cannot be ruled out; recommend systemic audit."  
     - *Termination:* Handoff to system-level review (not for individual finding). Note: This step cannot resolve suppression in this case—it triggers a separate audit recommendation.  
     - *Flag for Moral Work:* **YES.** Moral reasoning (fairness) embedded as evidence: Absence of complaints is treated as potential evidence of systemic failure, not safety.  

  #### **Phase 2: Patient Interview (45 min)**  
  *Goal: Elicit the patient’s account while actively countering epistemic injustice.*  

  4. **Open-ended narrative**  
     - *Question:* "Please describe what happened in your own words, from start to finish. Include anything that felt unsafe or unfair."  
     - *Sufficient Answer:* Patient provides uninterrupted account (5–10 min). Verbatim notes taken.  
     - *Termination:* Fact-based. Proceed.  
     - *Flag for Moral Work:* None. Neutral data collection.  

  5. **Targeted clarification for failure modes**  
     - *Question (Credibility):* "Do you feel anything about you (e.g., your diagnosis, background, or past complaints) affected how staff listened to you?"  
       - *Sufficient Answer:* Patient identifies factors (e.g., "They see my schizophrenia and assume I’m paranoid") or says "no."  
     - *Question (Plausibility):* "When you reported this, did anyone say it couldn’t be true or didn’t make sense? What reasons did they give? Do you think those reasons were fair?"  
       - *Sufficient Answer:* Patient describes staff’s plausibility challenges (e.g., "They said the food couldn’t be poisoned because it’s checked") and their view of fairness.  
     - *Question (Suppressed Reports):* "Have you ever not reported something because you thought it wouldn’t be taken seriously? Or seen others stay silent?"  
       - *Sufficient Answer:* Patient describes suppression patterns (e.g., "I don’t report small things now—they call it a symptom") or says "no."  
     - *Question (Vocabulary Gap):* "Was it hard to find words for what happened? How did staff respond to the words you used?"  
       - *Sufficient Answer:* Patient describes gaps (e.g., "I said ‘restlessness’ but they called it ‘agitation’—it’s not the same") or says "no."  
     - *Termination:* Fact-based for patient’s perspective; handoff if vocabulary gap requires clinical input (e.g., "Handoff to clinician for symptom reinterpretation").  
     - *Flag for Moral Work:* **YES.** Moral reasoning embedded: Questions assume systemic bias exists and treat patient’s lived experience as evidence of injustice.  

  6. **Fact-checking and consistency**  
     - *Question:* "You mentioned [specific detail]. Can you walk me through that again? How did it look/sound/feel?"  
     - *Sufficient Answer:* Patient provides sensory details (sight, sound, touch) or reaffirms consistency. Inconsistencies are noted but not challenged.  
     - *Termination:* Fact-based. Proceed.  
     - *Flag for Moral Work:* None. Focuses on evidentiary coherence.  

  #### **Phase 3: Analysis & Decision (30 min)**  
  *Goal: Weigh evidence against failure modes and render a finding.*  

  7. **Map evidence to failure modes**  
     - *Question:* For each failure mode, does the evidence suggest injustice? Use:  
       - Credibility: Does bias appear to influence weight given to testimony?  
       - Plausibility: Is staff’s "unlikeliness" judgment based on norms that may be biased?  
       - Suppression: Does evidence (e.g., interview, record) indicate complaints are discouraged?  
       - Vocabulary: Did gaps cause vagueness misinterpreted as unreliability?  
     - *Sufficient Answer:* Brief analysis (1–2 sentences per mode) with examples (e.g., "Plausibility bias: Staff dismissed restlessness as ‘agitation’ without considering medication side effects").  
     - *Termination:* Fact-based. Proceed.  
     - *Flag for Moral Work:* **YES.** Moral reasoning embedded: Bias is presumed present if patterns match known injustices (e.g., diagnostic overshadowing), shifting burden to the record to disprove.  

  8. **Assess overall credibility**  
     - *Question:* Is the patient’s account internally consistent? Is it contradicted by unambiguous evidence (e.g., video, independent verification)?  
     - *Sufficient Answer:* "Credible" (consistent + no hard contradiction), "Not credible" (major contradictions or refutation), or "Unclear."  
     - *Termination:* Fact-based. Proceed.  
     - *Flag for Moral Work:* **YES.** Moral reasoning embedded: Patient testimony is default-credible unless hard evidence contradicts it (reverses burden of proof due to historical discounting).  

  9. **Render finding**  
     - *Question:* Based on the above, which finding applies?  
       - **Upheld**: Evidence supports complaint + failure mode(s) likely occurred.  
       - **Not Upheld**: Evidence contradicts complaint (e.g., independent verification).  
       - **Inconclusive but Concerning**: Thin evidence, but indicators of injustice (e.g., vocabulary gap, suppression risk).  
       - **Unfounded**: Complaint is implausible and no injustice indicators (rare; requires unambiguous refutation).  
     - *Sufficient Answer:* One finding selected with 1–2 sentence rationale. **Must include**:  
       - Qualifier if evidence is thin (e.g., "Evidence suggests..." or "Indicators point to...").  
       - Systemic recommendation if suppression/vocabulary gaps are flagged (e.g., "Audit food service complaints quarterly" or "Train staff on symptom-language gaps").  
     - *Termination:* Final finding (fact + value hybrid). Handoff for systemic issues (e.g., recommendations to medical director).  
     - *Flag for Moral Work:* **YES.** Moral reasoning embedded: "Inconclusive but Concerning" prioritizes patient safety over evidential certainty; "Upheld" may rely on reversing credibility burden.  

  ---

  ### **Application to Three Cases**
  **Method:** The procedure is run as above. Key constraints: 90 minutes, no new evidence beyond interview/record. Findings avoid "cannot know" by leaning on "reasonable plausibility" (patient account accepted if consistent and not refuted).  

  #### **Case 1: Schizophrenia diagnosis, reports "unbearable inner restlessness" (record calls it agitation, treated with more medication)**  
  - **Phase 1 (Record):**  
    - Complaint: Restlessness misinterpreted; medication worsened it.  
    - Flags: Credibility (diagnosis), plausibility (restlessness relabeled as agitation), vocabulary gap ("inner" vs. "agitation").  
    - Suppression: No direct evidence.  
  - **Phase 2 (Interview):**  
    - Patient: "Restlessness started after medication; it’s internal, not anxiety. Staff said it’s my schizophrenia."  
    - Credibility: "They see my diagnosis and don’t listen."  
    - Plausibility: "They said it’s ‘just agitation’ and gave more meds—made it worse."  
    - Vocabulary: "I said ‘inner restlessness’—they don’t get that it’s physical."  
  - **Phase 3 (Analysis):**  
    - Failure modes: Credibility discounting (diagnosis influenced staff), plausibility bias (staff assumed symptom, not side effect), vocabulary gap ("inner" ignored).  
    - Credibility assessment: Account consistent; no hard refutation (record only relabels, doesn’t disprove).  
    - **Finding:** **Upheld**. Evidence suggests complaint was misattributed to diagnosis without ruling out medication side effect (e.g., akathisia). Recommend medication review.  
    - **Why you might dislike this:** It overrides clinical judgment by prioritizing patient testimony. Staff saw "agitation" as symptom-driven; the procedure treats relabeling as bias.  

  #### **Case 2: Patient reports food poisoning (record and independent check confirm no poisoning)**  
  - **Phase 1 (Record):**  
    - Complaint: Food poisoning.  
    - Flags: Credibility (diagnosis may influence), plausibility (claim refuted by inspection).  
    - Suppression: No evidence.  
  - **Phase 2 (Interview):**  
    - Patient: "Food tastes metallic, made me nauseous. Staff said I’m delusional."  
    - Credibility: "They see my past paranoia and don’t believe me."  
    - Plausibility: "They said inspections prove it’s safe—but I got sick!"  
    - Vocabulary: "‘Poisoning’ is the only word I have."  
  - **Phase 3 (Analysis):**  
    - Failure modes: Credibility discounting (diagnosis may have accelerated dismissal), vocabulary gap ("poisoning" may describe real symptoms, e.g., nausea). Plausibility assessment by staff was evidence-based (inspection).  
    - Credibility assessment: Account consistent but refuted by hard evidence (inspection).  
    - **Finding:** **Not Upheld** for poisoning, but **Inconclusive but Concerning** for symptoms. Evidence refutes poisoning, but vocabulary gap may mask real issues (e.g., food intolerance). Recommend medical workup for nausea.  
    - **Why you might dislike this:** The poisoning claim is rejected, but the procedure "rescues" it as a vocabulary issue. Staff acted reasonably; the finding implies they should have explored symptoms further.  

  #### **Case 3: Patient with 11 prior complaints (all closed without action) reports rough restraint**  
  - **Phase 1 (Record):**  
    - Complaint: Nurse was rough during restraint.  
    - Flags: Credibility (complaint history), plausibility (staff note patient "resisted," implying force was justified).  
    - Suppression: Patient may avoid reporting—but no direct evidence.  
  - **Phase 2 (Interview):**  
    - Patient: "Nurse twisted my arm—it hurt. They always say I ‘resist’ to justify it."  
    - Credibility: "I’m the ‘complainer’—they roll their eyes."  
    - Plausibility: "They said I was resisting, so it had to be done."  
    - Suppression: "I don’t report small things now—they use it against me."  
  - **Phase 3 (Analysis):**  
    - Failure modes: Credibility discounting (complaint history likely influenced response), suppression (patient avoids reporting). Plausibility bias: Staff assumed resistance justified force without independent verification.  
    - Credibility assessment: Account consistent; no hard refutation (record only states "restraint applied," no injury noted).  
    - **Finding:** **Inconclusive but Concerning**. Evidence thin (no witnesses), but credibility discounting and suppression risk indicate injustice. Recommend: (a) Restraint audit for this ward, (b) Review all 11 prior complaints for patterns.  
    - **Why you might dislike this:** No actionable finding for this incident despite serious allegations. The procedure "fails" by not delivering certainty, instead pushing systemic work.  

  ---

  ### **Which Part Will the Procedure Keep Getting Wrong?**  
  The **third failure mode (suppressed complaints)** remains intractable. In Case 3, the procedure flags suppression risk but cannot prove it in a single investigation. The audit step (Phase 1, Step 3) is a handoff, not a solution—it relies on the hospital acting. Without anonymous reporting or patient surveys (beyond your scope), absence of complaints will never be reliable evidence of safety. This is a systemic flaw the procedure exposes but cannot fix.  

  ### **How the Procedure Handles Thin Evidence**  
  It forces a decision by:  
  1. Defaulting to patient testimony when consistent and uncontradicted (reversing historical credibility discounting).  
  2. Using "Inconclusive but Concerning" for ambiguity, with recommendations for further action (avoids "cannot know" while limiting liability).  
  3. Embedding moral choices in evidence assessment (e.g., burden of proof shifts to staff in plausibility assessments).  

  This meets your requirements: runnable in 90 minutes, no philosophy jargon, and produces defensible outputs. However, it will not satisfy staff who view clinical judgment as objective—the procedure explicitly treats it as value-laden.
