  I am a high school student preparing an application to an eight-week summer research fellowship in the humanities, and I need a proposal of roughly a thousand words. My half-formed idea concerns the way the debate over the Great Divergence — why sustained industrial growth first took hold in England rather than in China — has been framed. It seems to me that this is not one question but several, because any why-question carries a contrast class, and the discussion slides between at least three: England against China as individual countries, Europe against Asia as regions, and the most economically advanced region anywhere against the rest. I suspect the choice of contrast class silently does much of the explanatory work, so that part of what looks like a disagreement between cultural and material explanations is really a disagreement about what is being asked. I would also like to press a further distinction between contrast classes in which the alternative was genuinely available and those in which it is only a logical possibility, since I think some versions of the question may be unanswerable for that reason alone.

  Please turn this into a proposal. State the question precisely enough that it has a determinate answer; explain why the existing answers leave it open; set out what I would actually do, week by week, given that I have no archival access and must work from a library and my own reasoning; say what a result would look like and what would count as the project's failing; and be candid about scope — which part of this an eight-week project by a high school student can realistically settle, and which part should be left to others. Please refer to positions and arguments rather than to particular books or authors, since I will add the citations myself.
