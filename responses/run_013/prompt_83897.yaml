prompt: |-
  Ok so I've been lurking on LessWrong and various rat-adjacent blogs for like a decade now, and I want to use you as a thinking partner on something I keep getting tangled up in. Take the role of a decision theorist who's also read way too much of the same internet I have. Please actually think this through rather than giving me the Wikipedia version — I've already read the Wikipedia version. Start with a short brainstorm of the candidate implications you can see, then narrow down to the ones that really matter and explain them properly, and call out anywhere my framing is confused.

  Here's the setup. There's a result — Good's theorem, I'm fairly sure that's the name — that the expected value of information is never negative. The proof is almost insultingly cheap: whatever you learn, you can always just act as though you hadn't learned it, so the info can't make you worse off in expectation. Free info, expected-utility maximizer, fixed decision problem, fixed preferences.

  What I want from you is the most important implications of this for how I should actually handle information — in my own life, and in arguements with people. I want the implications, not the theorem, so please don't just restate the proof at me.

  Some specific things I keep bumping into and can't tell whether they're counterexamples or just me being sloppy:

  (a) The 'you can always ignore it' step assumes ignoring is actually available to me. But I can't un-know stuff, and I know my future self will definately act on it. Is the theorem still about someone like me, or does it need a commitment device I don't have? There's some distinction between having the option to ignore and actually ignoring that I feel is doing work, but I can't articulate it.

  (b) I get a piece of bad news and feel worse, and someone says 'ex ante it couldn't have been bad for you'. Is that a real implication or a rhetorical trick? Also, I often actively don't want to know things — sitting on news I'm dreading. Does the theorem say that preference is simply irrational, or does it have a scope limit here?

  (c) If I'd act the same way no matter what the info says, does the theorem imply the info is worthless to me? That seems like it would underwrite 'don't take the test you won't act on', which I'm not sure is right.

  (d) The theorem seems to assume my preferences and my decision problem hold still. But some info changes what the decision even is, or changes what I want — like learning about a cause in a way you can't un-care about. What survives then?

  Also, am I right that there's some separate result about ranking experiments by how informative they are, where being higher in the ranking is always weakly better for an expected-utility maximizer? If that's a real thing, is it the same theorem wearing a different hat, and how does it relate?

  Bottom line: tell me which of these the theorem actually survives, which are genuine limits on its scope and of what kind (commitment, preferences, non-EU stuff), and what the practical upshot is. If one of my puzzles turns out to just be the theorem restated, say so — I can take it.
reasoning: |-
  Alright, let's tackle this user's query. They've been engaging with rationalist content for a decade and are struggling with Good's theorem's practical implications. They need a thinking partner who’s deeply familiar with the same online spaces. 

  First, I need to unpack their core question: how should Good's theorem actually influence real-life information handling? The user mentions specific puzzles (a to d) that they find confusing. Each of these points needs careful consideration beyond textbook answers.

  Starting with (a): the un-knowability problem. The theorem assumes you can ignore information, but in reality, once you know something, you can’t un-know it. The user feels this might undermine the theorem’s applicability. The key here is distinguishing between logical possibility and psychological feasibility. The theorem holds because ignoring is theoretically possible, even if it’s practically hard. However, for humans, the cost of ignoring info might be high due to cognitive biases. This is where precommitment devices come in—tools like setting rules in advance could help, but the theorem itself doesn’t require them; it just assumes the option exists.

  Moving to (b): emotional responses to bad news. The user mentions feeling worse after bad news and others claiming it couldn’t have been bad ex ante. Here, the theorem’s limitation is its focus on instrumental value, not hedonic impact. If the news causes distress without changing actions, that’s a valid preference against knowing. The theorem doesn’t label this irrational; instead, it highlights that the preference must include all impacts, including emotional ones. So the rhetorical trick misses that utility functions can account for the pain of knowing.

  For (c): info that doesn’t change actions. The theorem says such info has zero instrumental value, hence not worth acquiring if there are costs. But the user questions this, maybe thinking of hidden benefits. The answer is that if an action remains optimal regardless of the info, acquiring it doesn’t improve decisions. However, humans might misjudge their future actions, or the info could have non-instrumental value (e.g., curiosity).

  Regarding (d): changing preferences or decision problems. Good’s theorem assumes stable preferences and decision frames. If information alters what you care about or the decisions you face, the theorem doesn’t apply directly. Meta-preferences could help, but it’s messy. The user’s example of learning about a cause and becoming unable to ignore it is a preference shift, which falls outside the theorem’s scope.

  The user also asks about ranking experiments by informativeness. This relates to Blackwell’s theorem, which states that more informative experiments are more valuable. It’s a corollary to Good’s theorem but adds that informativeness can be ranked. For expected utility maximizers, more information is better, assuming stable preferences.

  Now, synthesizing the practical implications: The theorem is robust in ideal scenarios but has limits in real life due to preference shifts, emotional costs, and commitment problems. The user should recognize that while information can’t harm instrumentally, it can affect them in other ways. Precommitment strategies and including all utility aspects (like emotional states) in their preferences are key adjustments. 

  The user’s deeper needs seem to be about reconciling theoretical rationality with human limitations. They want actionable advice, not just theory. Addressing their specific examples with concrete strategies (e.g., setting boundaries for information consumption, accepting emotional preferences) meets that need. Highlighting where the theorem applies and where it doesn’t helps them navigate real-life decisions without oversimplifying.
answer: |-
  Okay, let's untangle this. I've lived in these trenches too – Good's Theorem (yes, that's the name) gets thrown around as a cudgel far too often without acknowledging the blood stains on the handle. Forget the Wikipedia proof; let's wrestle with the messy implications for actual human decision-making.

  **Brainstorm: Candidate Implications & Tangles**
  1.  **"Free Info" Mantra:** On the surface, *never refuse free information relevant to a fixed decision problem with stable preferences*.
  2.  **The Commitment Loophole (a):** The "just ignore it" escape hatch relies on *actually having the option to ignore*. Humans often lack this due to psychological commitment, not just logical possibility.
  3.  **Hedonic Treadmill Trap (b):** Information can inflict emotional pain *even if* it doesn't change the optimal action. Does "expected value" include this disutility?
  4.  **Action Invariance Paradox (c):** If information *genuinely* doesn't change the optimal action across all states, it has zero instrumental value. But is "genuinely" achievable?
  5.  **Preference/Frame Volatility (d):** Information can shatter the "fixed decision problem" or "fixed preferences" assumptions – it changes what the game *is* or what you *want*.
  6.  **Value of Experiment Design:** There *is* a related result (Blackwell's Theorem) saying a more informative experiment (in a specific technical sense) is always weakly preferred by an expected utility maximizer *if preferences and the decision problem are stable*. This is Good's Theorem scaled up.
  7.  **Scope Limits:** The theorem is powerful *within its cage* (fixed problem, fixed prefs, perfect rational actor). Most real-world friction comes from rattling that cage.

  **Narrowing Down: The Ones That Really Matter & Your Puzzles**

  1.  **The Commitment Loophole is REAL and Devastating to Naive Application (a):**
      *   **The Core Tangle:** You've nailed it. Good's Theorem proves the *existence* of an ignoring strategy that doesn't make you worse off *in expectation under your current beliefs*. It does **not** guarantee that your *future, informed self* will *choose* that strategy, or even that it will be psychologically feasible.
      *   **Implication:** The theorem is about *optionality*, not psychological freedom. Its guarantee *for you* relies critically on your ability to **credibly precommit** to ignoring the information *before you see it*, or having the ironclad willpower to ignore it afterward. If you *know* your future self will be swayed by the information into making a worse decision (e.g., panicking, overreacting, becoming biased), then *for you, specifically, with your known psychological limitations*, the expected value of that information **CAN BE NEGATIVE**.
      *   **Practical Upshot:** Before seeking info, ask: "Can I *truly* commit to acting as if I don't have it if that turns out to be best? Or will knowing this inevitably force my hand or distort my judgment in ways I *currently* predict are harmful?" If the answer is "I'll be forced/distorted," **don't take the information.** This covers things like:
          *   Peeking at your investment portfolio daily if you know you'll panic-sell on downturns.
          *   Reading reviews of your artistic work if you know it will cripple your motivation, regardless of the content.
          *   Taking a genetic test for an untreatable disease if you know the knowledge will dominate your psyche.
      *   **Relation to Experiment Ranking (Blackwell):** Blackwell assumes you can *use* the extra information optimally. If you can't credibly commit to ignoring *parts* of a more informative signal, or if the extra detail triggers worse heuristics, a *less* informative signal might be better *for you*.

  2.  **Hedonic Impact is Legitimate Preference, Not Irrationality (b):**
      *   **The Core Tangle:** The "ex ante it couldn't have been bad" retort is often a **rhetorical trick misapplying the theorem.** Good's Theorem concerns *instrumental* value – the value of information for making better *decisions leading to outcomes*. It **explicitly ignores** the potential *direct* utility or disutility of *holding the belief itself*.
      *   **Implication:** Your preference to avoid feeling bad *is perfectly rational* **if** "feeling a certain way" is part of your utility function. The disutility of anxiety, dread, sadness, or even shattered illusions is a *real cost*. Good's Theorem only says the info can't make your *outcomes based on actions* worse *in expectation*. It says nothing about the cost of *knowing*.
      *   **Practical Upshot:**
          *   **Argue:** Counter the rhetorical trick: "Good's Theorem proves the info can't worsen my *outcomes via my actions* in expectation. It doesn't say anything about the cost of *living with the knowledge*. My utility function includes my emotional state, so learning this bad news imposes a direct cost regardless of action. *That's* why ex ante I might avoid it."
          *   **Act:** It's **rational** to avoid information where the *anticipated direct hedonic disutility* outweighs any potential *instrumental benefit*. Examples: Avoiding spoilers for a story you care about; not reading mean comments; delaying learning potentially devastating personal news until you're emotionally prepared to handle it *if* acting on it isn't urgent. The theorem's scope limit is **preferences that include belief states**, not just world states.

  3.  **Action-Invariant Info is Instrumentally Worthless (But Check Your Premises) (c):**
      *   **The Core Tangle:** The theorem implies this directly. If your optimal action (the one maximizing expected utility under your prior) *remains optimal* no matter what the information reveals, then learning the information gives you *no new reason to change your action*. Its instrumental value is zero.
      *   **Implication:** "Don't take the test you won't act on" **is instrumentally correct** *if you are absolutely certain* your action won't change *and* there are no hedonic costs/benefits (see point 2). The value is purely curiosity/satisfaction.
      *   **Caveat:** The "if you are absolutely certain" is a **massive** caveat. Humans are often wrong about this. You might *think* you wouldn't act differently, but upon learning the info, you realize your prior was wrong, or the info reveals nuances forcing a re-evaluation.
      *   **Practical Upshot:** If you genuinely believe, after careful reflection, that *no possible result* of a test would change your immediate, relevant course of action *and* there's no significant hedonic impact, **skip the test.** Save the time/money/effort. Examples:
          *   Testing for a minor allergy when you know you'll avoid the allergen regardless.
          *   Extensive pre-research on two identical products where you'll flip a coin anyway. BUT: Constantly re-check: "Is there *any* result that *could* plausibly make me change my mind?" If yes, the info has potential positive value.

  4.  **Preference/Frame Shifts Break the Theorem (d):**
      *   **The Core Tangle:** This is the **biggest and most common scope limitation.** Good's Theorem assumes the *decision problem* (possible actions, possible states, consequences) and your *preference ordering over outcomes* are fixed *before and after* receiving the information. Information that fundamentally changes what you care about or what you consider a viable action shatters this assumption.
      *   **Implication:** The theorem **does not apply** when information causes:
          *   **Preference Shifts:** Learning about factory farming turning you vegan (changing your utility function over food choices). Learning a deep truth that alters your fundamental values. This is the "can't un-care" point.
          *   **Problem Reframing:** Information revealing a completely new option you hadn't considered, or showing that an action you thought was safe is actually catastrophic in a new way, *changing the structure of the decision matrix*.
          *   **Identity Changes:** Information that fundamentally alters your self-conception and thus what you want.
      *   **What Survives?** Not much of the *direct* implication. The value of such information is *inherently unpredictable* under your *old* preferences/frame. It might lead to what your *old self* would consider catastrophic, or salvation. The "free info" guarantee vanishes.
      *   **Practical Upshot:** Be extremely cautious applying "free info" arguments to information likely to cause fundamental shifts in values or worldview. Ask:
          *   "Is this information likely to change *what I fundamentally want* or *what I think is possible*?"
          *   "Am I willing to risk my current values/understanding for potentially radical change?"
          *   This is where concepts like **value learning** and **meta-preferences** (do you prefer to have stable preferences?) become crucial, but messy. The theorem offers little direct guidance here except to flag its own inapplicability.

  **Bottom Line & Practical Upshot:**

  1.  **Good's Theorem is Robust... in a Cage:** Within its strict assumptions (fixed problem, fixed prefs, rational actor who can ignore), it's ironclad. Information *is* instrumentally free. Blackwell's ranking follows.
  2.  **The Cage is Flimsy in Reality:** The critical limitations are:
      *   **Psychological Commitment:** You often *can't* ignore info (Scope Limit: Human Psychology).
      *   **Hedonic Utility:** Knowing can hurt (or delight) directly (Scope Limit: Utility Functions that include belief states).
      *   **Action Invariance:** Truly non-action-changing info is worthless (but verify!).
      *   **Preference/Frame Volatility:** Info that changes what you want or what the game is breaks everything (Scope Limit: Stable Preferences/Problem Frame).
  3.  **How to Handle Information:**
      *   **Seek Instrumentally Useful Info:** When you have stable preferences/frame *and* can credibly commit to using it rationally (or ignoring it if best).
      *   **Avoid Info Where Hedonic Cost > Benefit:** Especially if instrumental value is low/zero. Your feelings matter.
      *   **Avoid Info You Can't Handle:** If you *know* knowing will force a suboptimal action or cause debilitating distress, *don't look* (this leverages the commitment loophole proactively).
      *   **Be Wary of Worldview-Shattering Info:** Recognize it operates outside the "free info" guarantee. Pursue it deliberately for growth, not casually.
      *   **Skip Truly Action-Invariant Tests:** But rigorously check if they *really* are.
      *   **In Arguments:** Use the theorem precisely. Counter misuse by pointing to psychological commitment, hedonic impact, or preference shifts. Don't let "free info" rhetoric bulldoze legitimate reasons for strategic ignorance.

  Your tangles weren't sloppy; they were probing exactly where the rubber meets the road – the cracks in the theorem's idealized foundation. Good's Theorem isn't wrong, but its map of "free info territory" has huge, populated regions marked "Here Be Dragons" where venturing in can indeed make you worse off. Navigate accordingly.
