prompt: |-
  I'm a software engineer by training — no formal philosophy background — and I've somehow ended up as the lay member of my hospital's ethics committee, which has spent the last several months arguing about advance directives. The argument is really about something I can't get my head around: when a competent person writes a directive saying that if she later develops dementia she wants no life-prolonging treatment, and then that later person — now demented, apparently cheerful, and insistent that she wants the antibiotics — refuses, whose word should win? Some of my colleagues talk as though the earlier self has a kind of sovereign authority over the later one, the way a person can bind herself with a Ulysses contract or a smoker can lock away her own cigarettes; others say autonomy is always the autonomy of whoever is here now, and that a person who no longer holds her old values is, for these purposes, someone else. What nags at me is an asymmetry I keep noticing: we let the earlier self bind the later self, but never the reverse, and I can't tell whether that's a principled feature of autonomy or just a bias toward the articulate. I've seen the same structure in self-binding contracts used in addiction treatment, and in arguments over whether a now-content patient can be "harmed" by being kept alive in defiance of what her earlier self wanted.

  I'd like to turn this into a structured agenda-setting exercise rather than another round of argument. Suppose a foundation handed me a budget to support roughly four to six researchers for three years on exactly this cluster — precedent autonomy, self-binding, and the authority of the earlier self over the later one — and asked me to recommend which open questions they should take up and in what order. Which questions belong at the top, and why? I care less about the list than about the reasoning: for each, why it is upstream of the other questions rather than downstream of them; whether it's the kind of thing that can actually be resolved by argument in three years or is really a standoff between incompatible starting points; how much it would change clinical practice or the law if it came out one way rather than the other; and what argument or evidence over the next couple of years would move it up or down my ranking. I'd also like to know what you would deliberately deprioritize, including questions that sound weighty but whose answer wouldn't change anything downstream.

  Please lead with your bottom line in the first sentence — the single question you'd fund first, and why — then give the reasoning, with no preamble and no restating of my question.
reasoning: |-
  Okay, let me tackle this query from the software engineer on the hospital ethics committee. They're stuck in a debate about advance directives for dementia patients: should the competent past self's refusal of treatment override the current demented self's request for antibiotics? The core tension is between precedent autonomy ("past self as sovereign") and present autonomy ("only current self matters"). What's nagging them is the asymmetry—we always let past selves bind future selves but never the reverse. They want to transform this philosophical stalemate into a structured research agenda with 4-6 projects over three years, prioritizing questions by their upstream leverage, resolvability, practical impact, and sensitivity to new evidence.

  First, I need to identify the most fundamental question. The asymmetry issue seems central because it underlies both positions—if we can resolve whether it's justified, it could collapse or validate entire frameworks. It's upstream: if the asymmetry is defensible, precedent autonomy gains ground; if arbitrary, present autonomy arguments strengthen. For resolvability, this isn't just ideology—existing work in philosophy (e.g., Parfit on personal identity, Dworkin on precedent autonomy) and psychology (studies on value stability in dementia) could be synthesized. New evidence might come from empirical studies tracking how dementia alters core values versus superficial preferences, or behavioral experiments on how people perceive past/future selves. Practically, a defensible asymmetry could solidify advance directives in law; exposing it as bias might push policies toward supported decision-making. 

  Next priority: the metaphysics-light question. Before diving into "is the demented self the same person?"—which could be intractable—we should define what matters morally in identity continuity. Borrowing Parfit's concept of psychological connectedness, this avoids metaphysical dead ends. It's upstream because it informs whether past self's authority hinges on literal identity or something else (like values). Resolvable through conceptual analysis plus empirical work on which psychological links (e.g., narrative identity vs. bodily continuity) people actually base moral duties on. Impact: if moral weight depends on shared values rather than identity, advance directives gain force even if the "person" changes. 

  Third, the "harm" question. If we can't agree on whether extending a content demented patient's life against past wishes constitutes harm, all other debates stall. This is both normative (what counts as harm?) and empirical (does fulfilling past preferences affect well-being?). Research could include longitudinal studies of distress in dementia patients when overridden, or surveys on public perceptions of biographical versus experiential harm. Resolution here would directly guide clinical protocols—e.g., if no harm is found, clinicians might prioritize current requests. 

  Deliberate deprioritizations: 
  - Pure metaphysics ("Is it the same person?")—too abstract, unlikely to change practice. 
  - Legal precedent deep dives—downstream, as law should follow ethical clarity, not lead it. 
  - Broad consent frameworks—distracts from the core autonomy clash. 

  The ranking balances foundational theory (asymmetry, identity-what-matters) with actionable gaps (harm assessment, psychological triggers), avoiding rabbit holes. Each step is designed to build toward practical resolution in three years by focusing on questions where philosophy and empirics can interact productively.
answer: |-
  **First question to fund:** "Under what conditions (if any) is the asymmetry in self-binding authority — where past selves bind future selves but not vice versa — ethically justifiable, and what are its defensible foundations?"

  **Why this first, and reasoning framework:**  
  This question is maximally upstream because the asymmetry is the foundational tension in your committee's debate (precedent vs. present autonomy). Resolving its legitimacy would reframe downstream questions about identity, harm, and authority. Without this, other inquiries rest on unexamined assumptions.  

  ---

  ### Structured Research Agenda (Ranked by Priority)  
  1. **The Asymmetry Justification (Year 1)**  
     - **Why upstream?**  
       If asymmetry is indefensible, it collapses "sovereign past self" arguments; if justified, it forces clarity *why* (e.g., temporal agency privileging, risk of bad faith reversals).  
     - **Resolvability?**  
       Testable via:  
       - Conceptual work: Taxonomy of self-binding (Ulysses contracts vs. dementia directives) to isolate morally relevant differences.  
       - Empirical studies: Public attitudes on reversibility (e.g., "Would you let your future demented self override your current refusal of treatment?").  
       - Legal analysis: Asymmetry’s role in contract law vs. bioethics inconsistencies.  
     - **Practical impact:**  
       Directly shapes validity of advance directives. If asymmetry lacks principled basis, clinical practice shifts toward real-time autonomy.  
     - **What could move it?**  
       Evidence that people view past/future selves as morally symmetrical (e.g., behavioral economics experiments).  

  2. **What Psychological Continuity Matters for Moral Authority? (Year 1–2)**  
     - **Why upstream?**  
       Challenges the "someone else" claim by defining *which traits* (values, memories, preferences) must change to invalidate precedent autonomy.  
     - **Resolvability?**  
       - Philosophy + psychology collaboration:  
         - Track dementia patients’ value shifts (longitudinal studies on core vs. superficial values).  
         - Experimental philosophy: When do observers judge a "new person" exists?  
       - Outcome: A framework for when identity disruption voids prior directives.  
     - **Practical impact:**  
       Guides when clinicians should honor advance directives (e.g., only if current self retains "decisional core" of past identity).  
     - **What could move it?**  
       Data showing dementia rarely alters deeply held values (supporting precedent autonomy) or frequently creates new value-systems (undermining it).  

  3. **Can We Harm the "Current Self" by Honoring Past Wishes? (Year 2)**  
     - **Why now?**  
       Depends on Q1–2: Harm assessment requires knowing whose interests count.  
     - **Resolvability?**  
       - Normative analysis: Is "biographical harm" (to the past self’s life narrative) possible after identity change?  
       - Empirical work: Measure well-being in dementia patients when directives are/aren’t followed (e.g., distress from treatment denial).  
     - **Practical impact:**  
       Determines whether overriding current refusal is permissible "for their own good."  
     - **What could move it?**  
       Evidence that cognitively impaired patients retain awareness of violated prior values (e.g., via behavioral indicators).  

  4. **Triggers for Override: When Does "Contentment" Trump Prior Refusals? (Year 3)**  
     - **Why last?**  
       Requires answers from Q1–3. Focuses on edge cases (e.g., cheerful patients requesting simple treatments like antibiotics).  
     - **Resolvability?**  
       - Develop clinical criteria: "Contentment" thresholds, treatment burden/benefit ratios.  
       - Legal case review: When have courts prioritized present requests?  
     - **Practical impact:**  
       Creates clear clinical protocols for contested cases.  

  ---

  ### Deprioritized Questions (and Why)  
  - **"Is the demented self the same person?" (Metaphysical identity)**  
    **Why:** Intractable, less actionable than psychological continuity (Q2). Changes little in practice—authority hinges on moral status, not ontology.  
  - **"How should directives be interpreted?" (Semantic debates)**  
    **Why:** Downstream; assumes the prior self’s authority is valid.  
  - **"Should society override both selves for cost reasons?"**  
    **Why:** Distracts from core autonomy conflict; ethically distinct.  

  ---

  ### Strategic Rationale  
  - **Order logic:** Q1 dismantles the core tension. Q2–3 build a scaffold for authority/harm claims. Q4 translates to practice.  
  - **Feasibility in 3 years:** Prioritizes questions where empirical data (psychology, law) can resolve philosophical deadlocks. Avoids unfalsifiable metaphysics.  
  - **Impact multiplier:** Q1’s asymmetry analysis applies beyond dementia (e.g., addiction psychiatry, AI personal agents). Resolving it reorients the entire debate.  
  - **Deliberate pragmatism:** Focuses on "what would change practice?" Rejects questions where all answers lead to similar outcomes (e.g., refining consent forms without addressing authority).  

  **Bottom line:** Start by stress-testing the asymmetry. Its resolution forces coherence onto all downstream issues—making future committee debates tractable, not theological.
