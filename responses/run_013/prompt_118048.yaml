answer: |-
  Your Burkean position—grounded in a **function-independent epistemic presumption**—faces profound challenges. Below, I sort defeaters by how deeply they threaten the doctrine, starting with those that attack its foundations. I prioritize structural weaknesses over rhetorical critiques, per your request.

  ---

  ### **1. Mechanism of Institutional Survival: The Selection Problem**  
  **Threat Level: Existential**  
  **Core Challenge:** *If institutions survive due to power dynamics rather than functional fitness, the epistemic warrant collapses.*  
  - **Collapse (not weakening) occurs when:**  
    - Institutions are selected *primarily* for their utility to elites (e.g., feudalism’s inheritance laws, colonial extractive systems).  
    - Survival depends on suppressing alternatives (e.g., state monopolies enforced by violence).  
  - **Partial survival only if:**  
    - Functional pressures *coexist* with power (e.g., Roman roads served military control *and* commerce).  
    - But this concedes that the "presumption" is parasitic on consequentialist evaluation.  

  **Defender’s Concession:** The presumption *requires* a background condition: societal mechanisms must allow functional traits to outweigh dysfunctional ones over time. Historical evidence (e.g., persistent caste systems) often undermines this.  

  ---

  ### **2. Known Harmful Functions: The Transparency Defeater**  
  **Threat Level: Locally Fatal (but contained)**  
  **Core Challenge:** *Once an institution’s function is known and indefensibly harmful, the presumption evaporates.*  
  - Example: Slavery’s economic "benefit" was transparent to defenders; Burkeanism cannot override moral knowledge.  
  - **Key nuance:** The defeater applies *only* when harm is:  
    - (a) Universally acknowledged (not contested),  
    (b) Irremediable (not fixable by gradual reform).  
  - **Burkean escape hatch?** If harm is localized (e.g., ceremonial sexism in ritual), a defender might argue for incremental reform over abolition—but this implicitly invokes consequences, not pure tradition.  

  **Defender’s Concession:** The presumption is *strictly defeasible* and vanishes when confronted with uncontroversial moral knowledge.  

  ---

  ### **3. Predictive Redundancy vs. Consequentialism/Liberalism**  
  **Threat Level: Theoretical Undermining**  
  **Core Challenge:** *Burkeanism lacks unique predictive power.*  
  - **Overlap with consequentialism:** Both oppose reckless revolution (e.g., French Reign of Terror).  
  - **Divergence in edge cases:**  
    - *Untraceable Wisdom Scenario:* An institution (e.g., common-law jury trials) has opaque benefits no modern analysis can reconstruct. Consequentialism might discard it; Burkeanism retains it.  
    - **Problem:** Such cases are rare. We usually *can* identify functions (e.g., juries check state power).  
  - **Empirical weakness:** History shows "long-lived" institutions often cause entrenched harm (e.g., imperial bureaucracies). Consequentialism adapts; Burkeanism risks inertia.  

  **Defender’s Response:** The presumption is a heuristic for navigating uncertainty—valuable when consequences are incalculable.  

  ---

  ### **4. Asymmetry of Burden of Proof: Bootstrapping Problem**  
  **Threat Level: Deeply Damaging**  
  **Core Challenge:** *Weighting retention errors more heavily than removal errors assumes the conclusion.*  
  - **Circularity:** The asymmetry presupposes institutions are *probably* beneficial—but this is the very claim the presumption tries to justify.  
  - **Historical counter-evidence:** Many harmful institutions (e.g., witch trials) persisted for centuries. Why privilege "survival" as proxy for fitness?  
  - **Alternative asymmetry (liberalism):** Mill weights *removal* of harmful institutions more heavily to prevent tyranny of tradition.  

  **Defender’s Dilemma:** Grounding the asymmetry requires:  
    - (a) Theological claims (e.g., "tradition reflects divine wisdom"), or  
    - (b) Empirical claims about historical selection efficiency—which are contestable (see §1).  

  ---

  ### **5. Falsifiability and Insulating Qualifications**  
  **Threat Level: Methodological Crisis**  
  **Core Challenge:** *The doctrine is shielded by its reliance on unknown information.*  
  - **Immunization tactics:**  
    - When an institution fails (e.g., dueling), defenders say: "It wasn’t *truly* selected for benefit."  
    - When functions are discovered, the "defeasibility" clause is invoked.  
  - **Honest assessment:** The core claim ("longevity signals hidden wisdom") is unfalsifiable *by design*. We cannot test the counterfactual ("Would society crumble without this practice?").  
  - **Is this a defect?** Yes—if epistemic rigor requires testability. No—if seen as a "modest epistemology" for complex systems.  

  **Defender’s Retreat:** The position is a *meta-presumption*: absent clear evidence, defer to tradition. But this invites the charge of empty conservatism.  

  ---

  ### **6. Self-Application Problem: The Reflexive Paradox**  
  **Threat Level: Theoretically Awkward, Practically Manageable**  
  **Core Challenge:** *Why privilege a young presumption (Burkeanism) over ancient traditions?*  
  - **Inconsistency:** If longevity warrants deference, Burkeanism (18th c.) merits less respect than, say, monarchy (millennia-old).  
  - **Defender’s Response:**  
    - **Option 1:** Burkeanism is *about* conserving traditions—so applying it reflexively is incoherent.  
    - **Option 2:** Concede that the presumption must be justified *functionally* (e.g., "It prevents destabilizing rashness"). But this abandons function-independence.  

  **Verdict:** This is rhetorically potent but not fatal. A Burkean can consistently argue: "Use this tool to conserve *other* traditions; its novelty is irrelevant."  

  ---

  ### **Synthesis: What Survives?**  
  - **Salvageable core:** A weak presumption for *mysterious* institutions in *stable* societies with *broadly functional* selection mechanisms.  
  - **Fatal flaws:**  
    1. **Collapse under oppressive selection (§1).**  
    2. **Circular burden-of-proof asymmetry (§4).**  
    3. **Predictive redundancy (§3) and unfalsifiability (§5) weaken its necessity.**  
  - **Your toughest defeater (§1) is decisive:** If institutions evolve under power constraints, "survival" encodes elite interests, not collective wisdom. This collapses the epistemic warrant entirely—no "weakened form" remains.  

  **Final Note:** The doctrine’s power lies in its *humility* toward social complexity. But this humility cannot bear the weight of a *non-consequentialist* epistemology. A hybrid view—e.g., "Presume tradition has *some* reason, but scrutinize with all available tools"—may be more defensible.  

  If you wish to explore counter-rebuttals to any defeater or refine the hybrid proposal, I’m prepared to engage further.
