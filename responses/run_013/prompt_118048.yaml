  The self-application problem is deliciously meta. If Burkeans must privilege longevity, why trust a young presumption? The user’s note ("consistency requires less deference") shows they’ve already spotted this tension. A defender might argue the presumption *facilitates* tradition-conservation, but that’s functional reasoning—which their view supposedly transcends.  

  ...Wait, their deepest worry is point 1. Rightly so: if institutions perpetuate elite interests, the "distributed wisdom" narrative becomes a just-so story. I’ll foreground that, using their "usefulness to the powerful" phrasing. They’d reject hand-waving—e.g., claiming "some benefit trickles down." Better to admit the presumption *depends* on benign selection pressures.  

  Also worth noting: they dismiss "it’s conservative" as a critique. So focus on epistemic/structural flaws, not ideology. Their humility ("hardest to shrug off") suggests they’ll respect bluntness.  

