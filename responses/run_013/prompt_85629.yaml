  The preface paradox is usually resolved by saying that beliefs don't aggregate, so you can believe each claim individually while acknowledging that at least one is wrong. The lottery paradox solution is that you don't believe any specific ticket will lose because of symmetrical evidence. The user wants a scenario where both moves fail. 

