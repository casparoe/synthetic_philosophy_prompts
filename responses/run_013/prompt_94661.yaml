  1. **Rule 1: No Knowledge from Purely Statistical Evidence (NKS)**  
     - **Core idea**: Beliefs based *solely* on statistical evidence (odds, frequencies, base rates) cannot constitute knowledge, no matter how high the probability. Non-statistical evidence (e.g., perception, testimony, direct causal links) can yield knowledge, even if imperfect.  
