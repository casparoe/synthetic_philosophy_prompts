prompt: |-
  I am a doctoral student in moral philosophy, and for the past few weeks I have been circling a cluster of ordinary practices that seem to me philosophically loaded, and that nobody I know discusses together. In most common-law jurisdictions there is no general duty to rescue a stranger in peril: a competent adult who walks past a shallow pond in which a child is drowning commits no legal wrong and owes nothing to anyone. Yet those same jurisdictions have passed statutes shielding the rescuer who does intervene from liability, several civil-law countries make the failure to render easy aid a criminal offence, and the law does impose duties of rescue on parents, on those who created the peril, and on those who have taken a patient or a dependent into their care. In parallel, nearly every hierarchical institution — armies, police and fire services, hospitals, and increasingly universities and firms — honours members whose conduct is publicly described as exceeding what the institution demands, while the institution's own rules oblige those members to accept extraordinary risk; and many professional ethics codes are formally divided into an aspirational part that no one can be sanctioned for failing and an enforceable part that can end a career. I want a careful reconstruction of what this cluster presupposes, not a summary of what philosophers have written about it.

  Please take the role of an expert in normative ethics and the philosophy of law, and start by brainstorming the candidate presuppositions before committing to a reconstruction, so that the final answer is argued rather than asserted. My central question is what must be true of the moral landscape for these practices to make sense as they stand. Do they presuppose that the morally good and the morally required can come apart — that there is a genuine category of the praiseworthy but optional, and that the deontic question of what one must do is not the same as the evaluative question of what is admirable? Or could the whole cluster be explained without loss by a theory that recognises only one dimension, on which the decorated hero has merely done what was required of her all along and the medals are an incentive device with no moral content? If a two-dimensional picture is presupposed, which version of it is strictly required, and which parts of the practice merely fit comfortably with it? Two further puzzles interest me. First, if the line between the required and the optional is drawn by the cost or the risk to the agent, then one and the same act — a soldier smothering a grenade, a bystander smothering a grenade — appears to be required in one case and optional in the other, which suggests the category is relative to role or relationship rather than to the act; is that coherent, and what would have to change in the practices if it were not? Second, the practices treat praise and blame asymmetrically: the rescuer is decorated, the passer-by is not blamed, though both faced the same situation. Does that presuppose that the standards for praise and for blame differ, or only that we have pragmatic reasons for a forgiving practice of blame?

  Finally, tell me where the cluster is philosophically underdetermined — where incompatible theories would license exactly the same statutes, medals and codes — and what would actually have to change if we replaced the presupposed picture with its chief rival. Assume I have no library and no internet access, so reason from the descriptions I have given rather than reaching for the literature; do not give me citations or a reading list, and do not report what any particular philosopher is supposed to have argued, since I will supply the references myself.
reasoning: |-
  Okay, the user is a doctoral student in moral philosophy working on a cluster of legal and institutional practices that haven't been adequately theorized together. They've identified several puzzling phenomena: the lack of general legal duty to rescue strangers versus specific duties in certain relationships, the shielding of rescuers from liability, professional ethics codes with aspirational versus enforceable components, and institutional practices of honoring "heroic" conduct that technically falls under role obligations.

  The core philosophical question seems to be whether these practices presuppose a two-dimensional moral landscape where the morally good/praiseworthy is distinct from the morally required/obligatory. The user wants careful reconstruction of presuppositions, not literature review. They raise specific puzzles about role-relativity of duties and praise-blame asymmetry.

  Hmm... the user's framing suggests they're already quite sophisticated - they've noticed how the same physical act (grenade smothering) gets different moral treatment based on role, and how praise operates differently from blame in these contexts. Their frustration with existing literature is palpable - they want analysis grounded strictly in the described practices.

  Let me tackle this systematically. First, the basic tension: law doesn't require rescuing strangers but protects those who do, while punishing non-rescue in special relationships. Meanwhile institutions reward "exceeding" duties that are actually codified obligations. This immediately suggests a gap between minimum requirements and commendable conduct.

  For the moral landscape question: could a monist theory explain everything? Suppose we say the decorated hero merely did their duty - but then why distinguish "exceeding" in citations? Why have unenforceable aspirational codes? The practices persistently mark a distinction that monism would erase. The shielding of rescuers is particularly telling - it implies their action wasn't obligatory (else why need protection?), yet worthy of encouragement.

  On role-relativity: the grenade example shows obligations aren't just about costs/risks but about institutional positioning. The soldier's role constructs the obligation through prior commitment, whereas the bystander lacks that relational context. This seems coherent if we view obligations as emerging from relationships and voluntary undertakings rather than abstract agency.

  The praise-blame asymmetry is fascinating. We don't legally blame the pond-walker but decorate the rescuer. This might reflect different standards (praise for optional goodness, blame only for violated duties), or perhaps pragmatic restraint about enforcing positive duties. But the practices themselves don't require adopting either explanation - they're compatible with both, which is an important underdetermination point.

  Where are practices philosophically underspecified? The aspirational codes could fit either virtue ethics (aspirations as character ideals) or consequentialism (nudging toward better outcomes). The non-blame of non-rescuers could stem from deontic constraints on coercion or mere policy pragmatism. Changing presuppositions would matter most at the edges - say, if we adopted "heroic obligations" monism, institutions might stop honoring expected conduct, or if we rejected role-relativity, soldiers might legally challenge orders.

  The user's deeper aim seems to be mapping the implicit moral architecture of our institutions. They might be building toward showing how law and professional norms construct obligation through relationships rather than universal principles - a significant challenge to standard approaches in normative ethics.
answer: |-
  Your cluster reveals a sophisticated, layered moral architecture presupposed by our institutional practices. Let's reconstruct its core presuppositions through careful analysis of the tensions you've identified:

  **Candidate Presuppositions Emerging from the Practices:**
  1.  **Distinct Deontic/Evaluative Dimensions:** The practices consistently mark a boundary between the *minimally obligatory* and the *admirably supererogatory*. Legal statutes define floors (duties in special relationships, no general duty), while medals/aspirational codes mark ceilings (conduct "exceeding" demands).
  2.  **Role-Relativity of Obligation:** Obligations are fundamentally tied to *specific relationships* (parent-child, doctor-patient, soldier-comrade) or *voluntary undertakings* (taking charge of a dependent, joining the military), not merely to abstract agency or capacity.
  3.  **Cost/Risk Threshold for Obligation:** The "easy aid" standard in civil-law rescue duties suggests obligation arises only when cost/risk to the agent is *minimal*. Higher costs move acts into the supererogatory domain.
  4.  **Asymmetry of Praise/Blame Standards:** Praise is readily bestowed for optional goodness, while blame/legal sanction is reserved for violating established duties (including role-based ones). Non-performance of the supererogatory is *permitted* but not necessarily *admirable*.
  5.  **Institutional Functionalism:** Medals/aspirational codes serve institutional purposes beyond pure moral recognition: reinforcing identity, incentivizing discretionary effort, modeling ideals without creating unenforceable demands.

  **Reconstructing the Presupposed Moral Landscape:**
  The practices **necessitate a two-dimensional picture** separating the morally required (deontic) from the morally good/evaluative (aretaic). A monistic theory (collapsing good into required) cannot coherently explain the cluster without significant distortion:

  *   **Against Monism:** If the decorated hero merely did "what was required," then:
      *   The language of "exceeding" demands becomes nonsensical or misleading.
      *   Aspirational ethics codes are redundant or incoherent – why have unenforceable "requirements"?
      *   Shielding rescuers from liability is bizarre – why protect someone merely for fulfilling a duty? This protection implies the act was *discretionary*, not obligatory, yet socially valuable.
      *   The lack of legal blame for the pond passer-by becomes a *pragmatic failure* to enforce a true obligation, rather than a recognition of no obligation existing. The practices consistently treat non-rescue by strangers as *permissible*, not merely unpunished.
      *   Medals become *only* incentives, stripping them of their core meaning as recognition of *moral excellence beyond the call*.

  *   **The Required/Optional Distinction & Role-Relativity:** Your grenade example is central. The practices presuppose:
      *   **Core Presupposition:** Moral obligations are generated and shaped by *specific normative relationships and voluntary commitments* (roles, contracts, causal responsibility, dependency).
      *   **Coherence:** It is coherent for the *same physical act* (smothering a grenade) to be *obligatory* for the soldier (due to role commitment, oath, chain of command, duty to comrades) yet *supererogatory* for the bystander (lacking that specific normative relationship). The soldier's role constructs the obligation; the bystander's general humanity does not.
      *   **Consequence of Rejection:** If role-relativity were incoherent and obligation flowed *only* from abstract agency/capacity/cost, the practices would collapse. Either:
          *   The soldier's act *isn't* obligatory – undermining the basis of military discipline and justified commands. Medals for "heroism" in performing core duties become nonsensical.
          *   *Or* the bystander's act *is* obligatory – rendering the common-law "no duty to rescue" rule and the lack of blame for the passer-by morally indefensible, requiring radical legal reform (e.g., universal "easy rescue" criminal statutes).

  *   **Praise-Blame Asymmetry:** The practices presuppose **different standards**:
      *   **Blame/Legal Sanction:** Reserved for violating specific, established *duties* (role-based, relational, or minimal general duties like non-harm).
      *   **Praise/Decoration:** Applied for acts that are *morally excellent* but lie *beyond* these specific duties, particularly when involving significant sacrifice or risk.
      *   **Why Asymmetry?** This reflects a deeper presupposition: **Respecting negative duties (non-harm) is the fundamental, enforceable baseline for social cooperation.** Fulfilling positive duties, especially demanding ones towards strangers, is often seen as *enhancing* the moral community but not its *necessary condition*. We *expect* people not to harm; we *hope* they will significantly aid strangers, but don't *demand* it under threat of sanction (absent specific relationships). Praise acknowledges this enhancement.

  **Philosophical Underdetermination: Where Practices Don't Decide**

  1.  **The Grounding of Role-Obligations:** The practices presuppose roles *create* obligations, but are silent on *why*.
      *   Compatible with: Promissory/contractual theories (oath, enlistment), relational theories (parent-child bond), consequentialism (social utility of specialized duties), or deontological theories (duties arising from voluntary assumption of responsibility).
  2.  **The Nature of the Supererogatory:** The practices mark a category of "praiseworthy but optional," but underdetermine its precise boundaries or justification.
      *   Compatible with: "Morally optional" meaning *permissible to omit* (Standard View), or meaning *beyond obligatory minima but still "ought"-ish* (some scalar views). The "easy rescue" statutes suggest cost is key, but don't specify a precise threshold theory.
      *   Compatible with: Satisficing Consequentialism (doing "enough"), Agent-Centered Prerogatives (allowing significant self-interest), or Virtue Ethics (what the virtuous agent would do, recognizing limits).
  3.  **The Function of Aspirational Codes/Medals:**
      *   Are they primarily *moral* (recognizing true excellence)? Or primarily *functional* (shaping behavior, building institutional identity)? The practices are compatible with both emphases or a blend. The moral presupposition of supererogation is clear, but the *weight* given to moral vs. functional reasons for praise is not fixed by the practices alone.
  4.  **The Basis for Non-Blame of Omitting Supererogation:**
      *   Does the lack of blame *reflect* the genuine absence of any duty? Or is it a *pragmatic concession* (e.g., difficulties of proof, fear of discouraging rescue attempts, valuing liberty)? The common-law "no duty" rule strongly suggests the former, but a determined monist could argue it's the latter.

  **What Changes Under a Rival Presupposition?**

  If we replaced the two-dimensional, role-relative picture with a **monistic, act-consequentialist view** where "ought" implies "maximizes good" (or a strong scalar view blurring required/good):

  1.  **Legal Reform:** The common-law "no duty to rescue" would become indefensible. Statutes imposing a general duty of "reasonable rescue" (judged by cost/risk) would be *required*, potentially criminalizing the pond passer-by's inaction.
  2.  **Institutional Honors:** Medals for "heroism" in performing acts deemed obligatory by the institution would become incoherent or purely functional (incentives). Honors would only make sense for acts *truly exceeding* what the consequentialist calculus demanded – a much higher, potentially unknowable bar. The language of "exceeding demands" would vanish; it would be "meeting extraordinary demands."
  3.  **Professional Ethics:** Aspirational codes would collapse or be radically reinterpreted. Any conduct demonstrably leading to better outcomes would arguably become *mandatory*. The distinction between enforceable and aspirational would lose its moral foundation, becoming purely procedural (enforceable = violations provable/harm clear).
  4.  **Role-Relativity:** The soldier's duty to smother the grenade might remain (if deemed utility-maximizing), but so might the bystander's (if the calculus deemed the cost worth the life saved). The *moral distinction* between them based on role would vanish; only the net outcome and cost/benefit would matter. Institutional rules imposing role-specific duties would need explicit consequentialist justification against a general demand to maximize good.

  **In essence:** Your cluster reveals institutions navigating a moral world where **minimal obligations are defined by specific relationships and undertakings, constrained by significant cost/risk to the agent,** while **moral excellence resides in acts transcending these minima, especially for the benefit of others.** This presupposes a robust distinction between the deontic and the aretaic, grounded in role-relativity and a fundamental asymmetry between negative and positive duties, reflected in the differing structures of praise and blame. While the precise philosophical underpinnings of roles and the supererogatory are underdetermined, the practices themselves structurally require a multi-dimensional moral landscape.
