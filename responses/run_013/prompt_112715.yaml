  We are designing a decision procedure that takes inputs from various upstream components and outputs a single probability or a decision to hand off to a human. The procedure must be robust to the challenges outlined.

  The core idea is that we should use the reported probability as our degree of belief if the source is reliable and the conditions for the probability being "objective" are met. However, we must adjust for known issues such as uncertainty in the reported probability, reference class problems, correlation due to data leakage, self-referential reports, and expert calibration.

  We break the procedure into steps. Each step asks a question and, based on the answer, either adjusts the probability, leaves it as is, or flags for human intervention.

  We assume that we have access to:
  - The reported probability (or distribution) from the upstream component.
  - Metadata about the component (e.g., type, training data, known biases, calibration history).
  - Context about the event and the decision.

  We'll structure the procedure as a flowchart of questions:

  1. **Is the reported probability a single number?** 
     - If not (e.g., it's a range or distribution), then we must summarize it to a single number. We do this by taking the mean of the distribution (if it's a distribution) or the midpoint of the range (if it's an interval). However, if the range is too wide (e.g., width > threshold T1, set by platform lead), then we flag for human review because the uncertainty is too high. We then use the summarized number as the working probability.

  2. **Is the source a mechanistic simulation of a genuinely chancy process?**
     - If yes, then we accept the probability as is (unless subsequent steps indicate issues) and move to step 5.

  3. **Is the source a statistical model reporting a frequency?**
     - If yes, then we must check the reference class: 
          - Does the token case at hand belong to the reference class? If we have reason to believe it does, then we use the frequency. 
          - If we suspect the case may not belong (e.g., because of known differences), then we adjust the probability by a factor (which we might set based on historical performance in such cases) or flag for human review if the adjustment is too uncertain (e.g., if the uncertainty is above threshold T2). 
          - We also check for overfitting or data leakage (see step 4).

  4. **Is there a risk of data leakage or correlation due to the component being fitted on data that includes the outcome?**
     - This step applies to any model that was trained on historical data. We check:
          - Was the model validated on out-of-sample data? 
          - If the model was trained on data that includes the current event (or very similar events) then we have data leakage. We must adjust the probability by a de-biasing factor (if known from validation) or flag for human review. 
