answer: |-
  Below is a decision procedure specification for your probability aggregation system. It's designed as a step-by-step audit that runs in a fixed order, with explicit thresholds set by the platform lead. The procedure flags cases requiring human judgment and identifies which steps involve unavoidable subjectivity. Implementation assumes access to:  
  - Upstream component metadata (type, training data, calibration history)  
  - Historical performance data (for humans/models)  
  - Predefined risk thresholds (T1–T4) set by the platform lead  

  ---

  ### **Decision Procedure Specification**  
  **Input**: Raw probability report `P_raw` (single value, distribution, or range) + component metadata.  
  **Output**: Adjusted probability `P_final` (0–1) OR "HANDOFF_TO_HUMAN".  
  **Runtime**: ≤5 minutes/case.  
  **Key Thresholds** (set by platform lead):  
  - **T1**: Max allowed uncertainty (width of interval/std dev) = *0.25*  
  - **T2**: Min reference class similarity score = *0.7* (1=perfect match)  
  - **T3**: Max calibration adjustment delta = *0.2*  
  - **T4**: Min historical samples for calibration = *50*  

  ---

  #### **Step 1: Resolve Ambiguity in `P_raw`**  
  - **Question**: Is `P_raw` a single number?  
  - **Input**: `P_raw` (any format).  
  - **Action**:  
    - If single number: `P_work ← P_raw`.  
    - If distribution: `P_work ← mean`; `uncertainty ← std_dev`.  
    - If range: `P_work ← midpoint`; `uncertainty ← (upper - lower)`.  
  - **Halt condition**: If `uncertainty > T1`, output "HANDOFF_TO_HUMAN".  
  - **Judgment call**: Using mean/midpoint assumes symmetry; may misrepresent skewed distributions.  

  #### **Step 2: Verify Reference Class (For Statistical Models)**  
  - **Question**: Is the component a statistical model reporting a population frequency?  
  - **Input**: Component type, reference class definition, features of the token case.  
  - **Action**:  
    - If no (e.g., simulation/human): Proceed to Step 3.  
    - If yes: Compute similarity score (e.g., cosine similarity between token case and reference class centroids).  
      - If `score < T2`: Adjust `P_work ← P_work × score` (penalize mismatch).  
      - If no similarity data: Flag "HANDOFF_TO_HUMAN".  
  - **Halt condition**: None. Proceed to Step 3.  
  - **Judgment call**: Similarity scoring is heuristic; assumes linear penalty for mismatch.  

  #### **Step 3: Check for Data Leakage/Correlation**  
  - **Question**: Could `P_raw` be correlated with the outcome for non-causal reasons?  
  - **Input**: Training data timeline, backtest results, component documentation.  
  - **Action**:  
    - If temporal leakage (e.g., future data in training): `P_work ← 0.5` (assume uninformative).  
    - If overfitting (e.g., validation AUROC < 0.6): Apply shrinkage: `P_work ← (P_work + 0.5)/2`.  
    - If no issues: Proceed.  
  - **Halt condition**: If leakage/overfitting is confirmed, output `P_work` after adjustment.  
  - **Judgment call**: Shrinkage to 0.5 is arbitrary; may discard useful signal.  

  #### **Step 4: Handle Self-Referential or Non-Stationary Forecasts**  
  - **Question**: Does `P_raw` describe a future state or self-referential probability?  
  - **Input**: Component type, event timeline, historical stability metrics.  
  - **Action**:  
    - If yes (e.g., "probability our future output is X"):  
      - Apply decay: `P_work ← P_work × e^(-Δt / τ)`, where `Δt` = time horizon, `τ` = half-life (from metadata).  
      - If `τ` unknown: "HANDOFF_TO_HUMAN".  
    - If no: Proceed to Step 5.  
  - **Halt condition**: None. Proceed.  
  - **Judgment call**: Exponential decay is simplistic; assumes stationarity.  

  #### **Step 5: Calibrate Human Experts**  
  - **Question**: Is the component a human expert?  
  - **Input**: Expert ID, historical predictions (reported probabilities and outcomes).  
  - **Action**:  
    - If no: Proceed to Step 6.  
    - If yes:  
      - Fetch calibration curve (observed frequency vs. reported probability).  
      - If `historical_samples ≥ T4`: Adjust `P_work` via curve (e.g., if expert said 0.6 historically led to 0.52, `P_work ← 0.52`).  
      - If `historical_samples < T4`: Do not adjust (insufficient data).  
  - **Halt condition**: If adjustment delta `|P_work_calibrated - P_work| > T3`, "HANDOFF_TO_HUMAN".  
  - **Judgment call**: Calibration assumes past performance predicts future; ignores expert-specific context.  

  #### **Step 6: Final Sanity Check**  
  - **Question**: Is `P_work` physically plausible?  
  - **Input**: `P_work` from prior steps.  
  - **Action**:  
    - Clamp to [0, 1].  
    - If `P_work` is 0 or 1: "HANDOFF_TO_HUMAN" (avoid extreme actions).  
    - Else: Output `P_final = P_work`.  
  - **Halt condition**: None.  

  ---

  ### **Application to Concrete Tickets**  
  #### **Ticket 1: Weather Simulation (30% chance)**  
  - **Step 1**: `P_raw = 0.3` (single number) → `P_work = 0.3`.  
  - **Step 2**: Not statistical → Skip.  
  - **Step 3**: Mechanistic simulation → No leakage → Proceed.  
  - **Step 4**: Forecasts future weather → Apply decay. Assume `Δt = 24h`, `τ = 48h` (metadata) → `P_work = 0.3 * e^(-24/48) ≈ 0.18`.  
  - **Step 5**: Not human → Skip.  
  - **Step 6**: `0 < 0.18 < 1` → **Output: 0.18**.  
  - **Why discard?** Simulation’s raw output is adjusted for temporal decay.  

  #### **Ticket 2: Churn Model (0.8 for user)**  
  - **Step 1**: `P_raw = 0.8` → `P_work = 0.8`.  
  - **Step 2**: Statistical model → Reference class similarity = 0.9 (>T2) → No adjustment.  
  - **Step 3**: Training data 6 months old; validation AUROC = 0.75 → Slight overfitting → `P_work = (0.8 + 0.5)/2 = 0.65`.  
  - **Step 4**: Not self-referential → Skip.  
  - **Step 5**: Not human → Skip.  
  - **Step 6**: **Output: 0.65**.  

  #### **Ticket 3: Analyst (0.6 for SLA breach, 14/20 correct)**  
  - **Step 1**: `P_raw = 0.6` → `P_work = 0.6`.  
  - **Step 2**: Not statistical → Skip.  
  - **Step 3**: No data leakage → Proceed.  
  - **Step 4**: Not self-referential → Skip.  
  - **Step 5**: Human expert. Historical samples = 20 (<T4=50). Calibration curve unavailable → **No adjustment** (insufficient data).  
  - **Step 6**: **Output: 0.6** (but flag warning: "Expert calibration skipped due to low samples").  
  - **Why no adjustment?** Procedure requires ≥50 samples for calibration; 20 is insufficient.  

  ---

  ### **Limitations of the Procedure**  
  1. **Cannot invent data**: Fails when metadata is missing (e.g., no similarity scores for reference classes).  
  2. **Assumes linearity**: Adjustments (decay, shrinkage) are parametric and may misrepresent complex dynamics.  
  3. **Ignores interdependencies**: Treats upstream components as independent; cannot fuse correlated probabilities.  
  4. **Human-in-the-loop gaps**: Hands off ambiguous cases but doesn’t specify how humans should resolve them.  
  5. **Static thresholds**: Predefined values (T1–T4) may not adapt to changing environments.  

  This procedure prioritizes auditability over sophistication, explicitly marking judgment calls. It ensures upstream probabilities are critically evaluated but requires robust metadata to function.
