  The procedure must halt and hand to a human in the following cases:
  - If at any step the required information for adjustment is not available and the default behavior (like using the raw number) is deemed too risky (as per thresholds set by the platform lead).
  - If the adjustment leads to a probability that is too uncertain (wide interval) or if the adjustment itself is too large and we don't have a pre-approved factor.

  Now, we set thresholds (to be defined by the platform lead, but we give example values for concreteness):
  - T1: Maximum allowed uncertainty (width of interval) before flagging for human: 0.3 (i.e., if the probability is represented as 0.4 ± 0.15, then width=0.3, which is acceptable; but if it's 0.4 ± 0.2, then width=0.4 -> flag).
  - T2: Threshold for reference class mismatch adjustment uncertainty: if we cannot estimate the adjustment factor with an uncertainty (standard deviation) less than 0.2, then flag.
  - T3: Threshold for large adjustment: if we adjust the probability by more than 0.3 (absolute difference), then we flag unless the adjustment is based on a well-validated method (like a calibration curve with at least 100 historical points).

