prompt: |-
  I have been reading the rationalist and effective-altruism blogosphere for about a decade now, and after one too many dinner-table arguments I have finally tried to write down my settled verdicts on how to eat, in the hope that someone can tell me what principle, if any, generates them. Here they are. Getting the same number of calories from chicken rather than from beef is worse, because it takes far more individual birds than cattle to feed a person, and I take the number of sentient individuals killed to matter. All the same, I think a cow's death is a graver thing than a chicken's: the cow has a longer life, richer social ties, and more to lose, and I count that as a genuine point in beef's favor that partly offsets the body count. A steak from a well-run pasture sits easier with me than a carton of eggs from a battery barn, even though the steak kills a large animal and the eggs merely use up hens, because the hen spends her months in a cage while the steer has something one could call a life before the end. A vegan meal, however, is not obviously the low-harm option, since raising crops kills a great many field animals — mice, the young of ground-nesting birds, and the like — and if I really believe that a wild animal's life is short and its death usually slow and frightened, then the combine may do more damage per calorie than the pasture does. I think insect deaths count for something, but only a small fraction of a mammal's. And I would sooner have a great many field mice die in a wheat harvest than see one pig spend a year in a gestation crate.

  My tentative principle is a weighted sum of suffering, in which each individual's suffering is multiplied by a factor for how bad a life of that kind can be and then added up across all the animals affected — but I notice that I reach for sheer numbers when it favors the cow and for intensity when it favors the hen, and I cannot tell whether that is a coherent two-factor view or just motivated switching.

  What I want from you is the principle, stated precisely enough that I can apply it to cases I have not listed — a meal of mussels against a meal of lentils, or a pasture-raised chicken against a feedlot one — together with the specific verdict of mine that motivates each clause. I suspect at least one of my verdicts will have to go, and I would rather you tell me which and why than paper over the gap; I am also curious what your preferred principle implies for a case I have deliberately left off the list. Please write your answer in American English.
reasoning: |-
  Okay, the user has been involved in the rationalist and effective altruism communities for about ten years. They've had numerous debates about ethical eating and have now compiled their own conclusions. They want me to identify the underlying principle that unifies their various ethical judgments about food choices, and they're prepared to discard any inconsistent verdicts.

  Looking at their stated positions, I notice they consider multiple factors: the number of animals killed (favoring larger animals like cows over chickens), the quality of life before death (pasture-raised beef vs. battery eggs), and even crop cultivation's impact on field animals. They explicitly reject pure utilitarianism (total suffering) and pure deontology (individual rights), instead proposing a weighted suffering model that considers both quantity and intensity.

  Their core tension appears between two moral intuitions: when comparing beef to chicken, they emphasize the number of individuals killed (favoring cows), but when comparing pasture beef to battery eggs, they emphasize suffering intensity (favoring cows again). This creates a potential inconsistency, especially since they value a mouse's life significantly less than a pig's.

  I think their model should incorporate three key dimensions: capacity for suffering (based on cognitive complexity), quality of life (freedom from confinement/pain), and number of individuals affected. For consistency, the weight given to capacity-for-suffering must remain constant across comparisons - they can't emphasize numbers only when it helps cows and intensity only when it hurts chickens. Their mouse-vs-pig verdict suggests capacity-for-suffering weights should be steep (e.g., logarithmic).

  Applying this framework systematically: pasture beef beats battery eggs due to massive quality-of-life difference; chicken may beat beef if the numbers disparity is large enough; crop deaths matter but less than concentrated suffering; insects get minimal weight. The pasture-raised chicken versus feedlot beef case would depend on precise parameters but likely favors chicken if welfare differences are minor but numbers drastic.

  Ultimately, I'll need to point out that their current approach to the beef/chicken comparison (emphasizing numbers) and eggs/beef comparison (emphasizing intensity) risks inconsistency unless they fix their capacity weights. Their mouse/pig judgment actually provides the key calibration point for how steep those weights should be.
answer: |-
  Based on your verdicts, I derive the following principle, designed to be precise and applicable to novel cases. It integrates your core intuitions while exposing a necessary revision for consistency:

  **The Principle: Weighted Life-Harm Minimization**

  When comparing food sources, minimize the aggregate **Harm Burden** (HB), calculated as:

  **HB = Σ [ (C_i) * (QLF_i) * (1 - LQ_i) ]** for all sentient individuals *i* affected.

  Where:
  1.  **`C_i` (Capacity Weight):** The relative weight assigned to the *individual's capacity for suffering and flourishing*, based on cognitive complexity, sociality, and lifespan. This is a fixed scalar value per species/type.
      *   *Motivated by:* Your judgment that a cow's death is "graver" than a chicken's due to its "longer life, richer social ties, and more to lose," and that insect deaths "count for something, but only a small fraction of a mammal's." This captures the differing moral weight per individual.
      *   *Specific Values (Illustrative - Needs Calibration):*
          *   Beef Cow: 1.0 (Baseline)
          *   Chicken: 0.2
          *   Pig: 1.0 (similar complexity/sociality to cow)
          *   Field Mouse: 0.05
          *   Wild Bird (e.g., ground-nesting): 0.1
          *   Insect: 0.001
          *   Mussel/Oyster: 0.01 (assuming minimal sentience evidence)

  2.  **`QLF_i` (Quality of Life Factor):** A factor (0.0 to 1.0) representing the *proportion of the individual's potential well-being achieved* during its life. 1.0 = Flourishing life (e.g., pasture-raised steer); 0.0 = Constant severe suffering (e.g., gestation crate pig).
      *   *Motivated by:* Your stark preference for pasture steak over battery eggs ("the steer has something one could call a life") and your revulsion at the gestation crate pig vs. field mice. This captures the intensity and duration of suffering/well-being *during life*.
      *   *Examples:*
          *   Pasture-Raised Beef Cow: 0.8
          *   Feedlot Beef Cow: 0.4
          *   Battery Cage Hen: 0.1
          *   Pasture-Raised Chicken: 0.7
          *   Gestation Crate Sow: 0.05
          *   Wild Field Mouse/Bird: 0.4 (short, risky life, but natural behaviors)

  3.  **`(1 - LQ_i)` (Life-Quality Adjusted Harm of Death):** Represents the *harm caused by death/deprivation*, scaled by the individual's Quality of Life Factor. `LQ_i` is the `QLF_i` at the *time of death*. `(1 - LQ_i)` = 1.0 if death deprives a flourishing individual (high harm); approaches 0.0 if death ends a life of constant suffering (low harm).
      *   *Motivated by:* Your intuition that death matters *more* for the pasture steer ("something one could call a life") than for the battery hen ("spends her months in a cage"). Death's harm is proportional to the life lost. Ending a miserable life is less harmful than ending a good one.

  4.  **Summation (`Σ`):** The HB is summed *across all sentient individuals* whose lives are significantly impacted (killed, confined, their habitat destroyed) to produce a given quantity of food (e.g., 1000 calories).
      *   *Motivated by:* Your core concern with the "number of sentient individuals killed" (chicken vs. beef) and including field animals killed by crop harvests.

  **Applying the Principle to Your Verdicts & Novel Cases:**

  1.  **Chicken vs. Beef (Calorie Equivalent):** You say chicken is *worse* due to higher numbers killed. The principle generally supports this *if* `C_chicken` / `C_beef` > `N_beef` / `N_chicken` (where N = number killed per calorie). With your illustrative weights (C_cow=1.0, C_chicken=0.2), chicken HB would be lower only if >5x *more* chickens are killed than cows per calorie. Since chicken typically requires killing *many more* than 5x the individuals, HB favors beef, matching your verdict. *Key:* The `C_i` weight *must be fixed* and applied consistently here.

  2.  **Pasture Steak vs. Battery Eggs:** You prefer steak. Principle explains:
      *   Steak: `C_steer=1.0`; `QLF_steer=0.8` (pasture); `(1 - LQ_steer) = 1 - 0.8 = 0.2`. HB_steer = 1.0 * 0.8 * 0.2 = **0.16** per steer *per its whole life output*. Divide by calories from steer.
      *   Eggs (Battery): `C_hen=0.2`; `QLF_hen=0.1` (battery cage); `(1 - LQ_hen) = 1 - 0.1 = 0.9`. HB_hen = 0.2 * 0.1 * 0.9 = **0.018** per hen *per year*. Multiply by number of hen-years needed for equivalent calories.
      *   *Result:* While HB per hen is low (0.018), the sheer number of hen-years required per calorie, combined with the very low QLF (0.1) and high (1-LQ) (0.9), makes the *aggregate* HB for eggs vastly higher than for steak. Principle strongly favors steak, matching your verdict. *Key:* The `QLF_i` and `(1 - LQ_i)` factors dominate here due to the extreme suffering and deprivation.

  3.  **Vegan Meal (Crops) vs. Pasture Beef:** You doubt vegan is obviously lower harm. Principle includes field animals (`C_fieldmouse=0.05`, `QLF_mouse=0.4`, `(1-LQ_mouse)=0.6`; HB_mouse = 0.05 * 0.4 * 0.6 = **0.012**). Aggregate HB depends heavily on estimates of field deaths per calorie. If estimates are high (e.g., 10 mice/birds per 1000 kcal), HB_crop could be significant (e.g., 0.12). Compared to pasture beef HB (e.g., 0.16 per steer / ~500,000 kcal? -> HB/kcal ~0.00000032), crop HB/kcal (0.12 / 1000 = 0.00012) might be *hundreds of times higher* than beef HB/kcal. Principle *could* favor pasture beef over some crops, matching your doubt. *Crucially:* Your mouse/pig verdict calibrates `C_fieldmouse`.

  4.  **Your Mouse vs. Pig Verdict:** "sooner have a great many field mice die... than see one pig spend a year in a gestation crate." This is CRITICAL for calibration:
      *   Gestation Crate Pig Year: `C_pig=1.0`; `QLF_pig=0.05`; `(1-LQ_pig)` is irrelevant for suffering *during* the year (death harm separate). **HB_year = C * QLF = 1.0 * 0.05 = 0.05** (suffering during the year).
      *   Field Mouse Death: `C_mouse=0.05`; `QLF_mouse=0.4`; `(1-LQ_mouse)=0.6`; **HB_death = 0.05 * 0.4 * 0.6 = 0.012**.
      *   *How many mice deaths equal one pig-year?* 0.05 (Pig HB) / 0.012 (Mouse HB) ≈ **4.16**. Your verdict ("great many") implies you believe the number is *much larger* than 4. This forces a **revision**: Your illustrative `C_fieldmouse=0.05` is *too high* relative to your pig/mouse verdict. To match "great many" (e.g., >20 mice), `C_fieldmouse` needs to be **~0.01** (0.05 / 0.01 = 5; 5 * HB_mouse_death (0.012 * 0.01/0.05=0.0024) = 0.012; 0.05 / 0.0024 ≈ 20.8). **Revised Verdict Necessary:** The capacity weight (`C_i`) for field mice must be significantly lower than 0.05 to be consistent with your strong preference for many mouse deaths over one crate-pig year. Insect weights must be lower still.

  5.  **Novel Case: Mussels vs. Lentils:**
      *   Mussels: Assign `C_mussel=0.01` (very low sentience evidence). Farming often has low bycatch. QLF likely near 1.0 (natural environment). Death harm `(1-LQ)` likely low. *Aggregate HB/kcal very low.*
      *   Lentils: Crop production. Includes field deaths. With revised low `C_fieldmouse=0.01`, HB/kcal is moderate.
      *   *Principle Implication:* Favors **Mussels** significantly over Lentils, due to very low `C_i` and minimal suffering/life disruption.

  6.  **Novel Case: Pasture-Raised Chicken vs. Feedlot Beef:**
      *   Pasture Chicken: `C=0.2`, `QLF=0.7`, `(1-LQ)=0.3`. HB/bird = 0.2 * 0.7 * 0.3 = **0.042**. Multiply by high number of birds per kcal.
      *   Feedlot Beef: `C=1.0`, `QLF=0.4`, `(1-LQ)=0.6`. HB/steer = 1.0 * 0.4 * 0.6 = **0.24**. Divide by high calories per steer.
      *   *Calculation:* If ~200 pasture chickens killed ≈ 1 feedlot steer in calories, then:
          *   Chicken HB: 200 * 0.042 = **8.4**
          *   Beef HB: 1 * 0.24 = **0.24**
      *   *Principle Implication:* Strongly favors **Feedlot Beef** over Pasture Chicken, due to the overwhelming impact of the `C_i` weight multiplied by the number of individuals. This may clash with an intuition favoring "higher welfare" chicken, but is dictated by your core "number of individuals" concern in the beef/chicken comparison and the fixed `C_i`.

  **The Inconsistency & The Necessary Revision:**

  *   **The Flaw:** Your description admits "I reach for sheer numbers when it favors the cow and for intensity when it favors the hen." The principle exposes this as inconsistent weighting. The `C_i` factor (Capacity Weight) *must be fixed* for a species. You cannot emphasize numbers (low `C_i`) for chickens in the beef/chicken comparison and then emphasize intensity (via `QLF_i` and `(1-LQ_i)`, which are separate) for hens in the eggs/beef comparison *without the fixed `C_i`*. The principle forces consistency by locking `C_i`.
  *   **The Revision:** Your **mouse vs. pig verdict forces a significant downward revision of the Capacity Weight (`C_i`) for small wild animals** like field mice. Your illustrative 0.05 is inconsistent with your willingness to accept many mouse deaths to avoid one crate-pig year. To be consistent, `C_fieldmouse` must be **~0.01 or lower**. This makes crop deaths *less* significant in your calculus than your initial doubt about veganism implied. Conversely, it makes the suffering of confined, cognitively complex animals (pigs, chickens) *even more* significant relative to field deaths.

  **Conclusion:**

  The **Weighted Life-Harm Minimization** principle, with its fixed Capacity Weights (`C_i`), Quality of Life Factors (`QLF_i`), and Life-Quality Adjusted Harm of Death (`1 - LQ_i`), precisely captures most of your verdicts. It explains your preference for beef over chicken (via numbers and `C_i`), pasture beef over battery eggs (via `QLF_i` and `(1 - LQ_i)`), and provides a framework for crops, mussels, and welfare comparisons.

  However, **your strong conviction that many mouse deaths are preferable to one year of a gestation crate pig's suffering necessitates a significant downward revision of the Capacity Weight (`C_i`) for field mice and similar small wild animals.** This revision makes well-managed pasture beef or bivalves likely lower-HB than most crop-based foods, and makes the suffering of intensively farmed pigs and chickens even more critical to avoid. The principle demands consistent application of `C_i`; you can no longer opportunistically emphasize numbers or intensity without fixed weights calibrated by your core intuitions like the mouse/pig case.
