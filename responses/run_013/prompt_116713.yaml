answer: |-
  Here’s a complete game design to help your group discover the paradox of the "safe" middle option being dominated by a mixed strategy. The game uses simple rules, tangible rewards (e.g., points or sweets), and avoids lectures by making the learning experiential. I’ll outline the setup, rules, rounds, debrief, and pitfalls. The key insight: **Middle is never the worst pure strategy but is strictly worse than a 50/50 coin flip between Top and Bottom—and once Middle is deleted, the pure strategies become vulnerable, forcing players to confront why mixing matters.**

  ---

  ### **Game Setup**
  - **Players:** 7–8 people (no economists needed).  
  - **Time:** 40–50 minutes (leaves room for discussion and hiccups).  
  - **Materials:**  
    - **Payoff cards** (one per player):  
      ```
      Your choices (pick one per round):  
      - TOP:    3 if LEFT, 0 if RIGHT  
      - MIDDLE: 1 if LEFT, 1 if RIGHT  
      - BOTTOM: 0 if LEFT, 3 if RIGHT  
      ```  
      *(Note: I simplified payoffs to integers. Middle = 1, not 1.4, to avoid decimals. The math still works: 50/50 mix averages 1.5 > 1.)*  
    - **Score sheets** to track points.  
    - **Coins** for mixed strategies (one per pair).  
    - **Rewards:** Small sweets (e.g., M&M’s) or points. 1 point = 1 sweet.  

  ---

  ### **Game Rules: "The Unstable Safe Bet"**
  **Phases:**  
  1. **Phase 1: Against Nature (10 rounds)**  
     - Players act as individuals. The "state" (LEFT/RIGHT) is determined by a coin flip (e.g., facilitator flips: Heads = LEFT, Tails = RIGHT).  
     - Each round:  
       - Players secretly choose **Top**, **Middle**, or **Bottom**.  
       - Facilitator announces the state (LEFT/RIGHT).  
       - Players calculate their payoff and record it.  
     - **Goal:** Maximize your total score. No talking during rounds.  

  2. **Phase 2: Against an Adversary (15 minutes, in pairs)**  
     - Pair up players (A and B).  
     - **Round 1–5 (Pure Strategies):**  
       - Player A (Chooser) picks **Top**, **Middle**, or **Bottom** and *tells Player B (Adversary)* their choice.  
       - Player B (Adversary) chooses LEFT or RIGHT *to minimize Player A’s payoff* (e.g., if A picks Top, B picks RIGHT to force 0).  
       - Record payoff for A.  
     - **Round 6–10 (Mixed Strategies):**  
       - Player A announces: **"I’m flipping a coin: Heads = Top, Tails = Bottom."**  
       - Player B chooses LEFT or RIGHT *without knowing the coin result*.  
       - Player A flips the coin, plays the result, and records payoff.  
     - **Swap roles:** Player B becomes Chooser, repeat Rounds 1–10.  

  3. **Phase 3: Iterative Deletion (5 minutes)**  
     - **Remove Middle:** Announce that Middle is "banned" (it’s dominated). Players can only choose **Top**, **Bottom**, or the **50/50 mix**.  
     - Play 2–3 quick rounds (per pair) with the new rules. Adversary still tries to minimize payoffs.  

  ---

  ### **Why This Works**
  - **Phase 1 (Nature):** Players gravitate to Middle early because it feels safe (never 0). But after 10 rounds, Top/Bottom average 1.5 (since LEFT/RIGHT are equally likely), while Middle averages 1.0. *They’ll see Middle underperforms but won’t yet know why.*  
  - **Phase 2 (Adversary):**  
    - **Pure Rounds:** Choosers realize Middle is "safe" (always 1) but get frustrated as Top/Bottom yield 0. Adversaries always force pure strategies to 0.  
    - **Mixed Rounds:** The 50/50 mix yields 1.5 *regardless* of the adversary’s choice (e.g., if LEFT, mix gives 50% chance of 3 or 0 → avg 1.5). Players see Middle (1) < Mix (1.5) in every scenario.  
  - **Phase 3 (Deletion):** With Middle gone, pure Top/Bottom are forced to 0 by adversaries. Only the mix survives (always 1.5). Players viscerally feel how deleting the "safe" option exposes new vulnerabilities.  

  ---

  ### **Debrief Guide (10–15 minutes)**  
  Lead a discussion—**ask questions**, don’t lecture. Unpack the experience:  
  1. **"What happened in Phase 1?"**  
     - Most will say they chose Middle to avoid 0s. Ask: *"Did anyone switch to Top/Bottom? Why?"* Highlight that Middle *averaged lower* than Top/Bottom (1.0 vs. 1.5) despite feeling safer.  

  2. **"What changed in Phase 2?"**  
     - Pure strategies: *"Why did Middle feel necessary?"* (It’s never the worst—adversary can’t force it to 0).  
     - Mixed strategy: *"How did the coin flip beat Middle?"* (1.5 > 1 in every adversary move). Emphasize: **Middle isn’t just bad on average—it’s worse than the mix in every possible world.**  

  3. **"What about Phase 3?"**  
     - After deleting Middle, *"Why did Top/Bottom fail?"* (Adversary forces them to 0). *"Why did the mix still work?"* (Adversary can’t exploit it).  

  4. **The Core Insight:**  
     - **"Middle is never the worst pure strategy, but it’s strictly worse than mixing. Never being the worst ≠ being good enough."**  
     - **Real-world analogy:** "A diversified investment (mix) might beat a ‘safe’ bond (Middle) in all markets, even if the bond never crashes."  

  5. **Why this is weird:**  
     - The coin flip isn’t "luck"—it’s a tool to *deny information* to the adversary. Middle dies because it can’t hide.  
     - Iterative deletion reveals new "safe" options (like Middle) are illusions—deleting one exposes others.  

  ---

  ### **Predictable Pitfalls & Fixes**  
  1. **"I’d just play Top and hope!"**  
     - **Don’t lecture.** Let Phase 2 expose this: when they announce Top, the adversary forces RIGHT → 0. They’ll self-correct.  

  2. **Adversaries don’t minimize payoffs.**  
     - **Fix:** Clarify the goal ("Your job is to give the Chooser as few points as possible"). Demo one round.  

  3. **Mixed strategy confusion.**  
     - **Fix:** Stress the order:  
       1. Chooser commits to mixing (no flip yet).  
       2. Adversary picks LEFT/RIGHT.  
       3. Coin is flipped.  

  4. **Variance skews perceptions:**  
     - In Phase 1, if LEFT occurs 8/10 times, Top players "win." This might make Middle seem fine.  
     - **Fix:** Use 10+ rounds to smooth randomness. Show group averages in debrief.  

  5. **Talking between rounds:**  
     - **Allow it in debriefs only.** During phases, enforce silence to avoid collusion/distraction.  

  ---

  ### **What This Can’t Show (Limitations)**  
  - **Risk aversion:** The game assumes players care about averages. Real people might prefer a sure 1 over a risky 1.5 (e.g., if sweets are valuable). Acknowledge this: "If you hate risk, Middle feels better—but over time, mixing wins more."  
  - **The coin’s role:** The flip isn’t magical—it’s a device to create unpredictability. The lesson is that **randomization beats pure strategies when adversaries exist**, not that coins are optimal.  
  - **Generalizability:** This payoff matrix is tailored to make mixing dominate Middle. Not all games have this property. Stress that the takeaway is the *principle* (domination via mixing), not the numbers.  
  - **Nash equilibria:** Avoid this jargon. Focus on the visceral "aha" (safe ≠ optimal).  

  ---

  ### **Why It’s Effective**  
  - **Emotional hook:** Players *feel* clever choosing Middle, then *feel* betrayed when the mix beats it. The deletion phase adds drama.  
  - **No jargon:** Rules use "LEFT/RIGHT," not "states." Scores are sweets, not utils.  
  - **Self-discovery:** The adversary phase forces players to *cause* Middle’s downfall. They’ll argue, laugh, and remember.  

  Adjust as needed, but stick to the structure—it turns abstraction into a tactile, memorable experience. Let me know if you want tweaks!
