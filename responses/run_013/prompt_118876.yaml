answer: |-
  Here's a decision tree that clarifies positions on individual impact in collective harm scenarios (steak, voting in a foregone state, long-haul flight). It separates reasoning into causal beliefs, moral foundations, and duty types, with positions named plainly. The tree has **9 distinct leaves** (positions) and handles all three cases uniformly unless noted.

  ### Decision Tree
  **Start at Question 1:**

  1. **Does your single act directly change the outcome?**  
     (e.g., Does skipping a burger reduce animal suffering? Does voting change an election? Does a flight add to climate harm?)  
     → **A: Yes, always a tiny bit** (e.g., "My choices ripple through systems").  
     → **B: Only if it hits a threshold** (e.g., "One vote/flight/burger won’t matter... unless it’s the tipping point").  
     → **C: No, never** (e.g., "The system absorbs my act; it’s a drop in the ocean").

  ---

  #### If A (Yes, tiny direct harm):
  2. **Is your duty about avoiding harm or fixing outcomes?**  
     → **A1: Avoid causing harm** → **Position: _Marginal Harm Avoidance_** (You must not do it; causing harm is wrong).  
     → **A2: Fix the net harm** → **Position: _Offset Permissibility_** (You may do it if you offset harm, e.g., donate to carbon capture/animal welfare).

  #### If B (Only at threshold):
  3. **How should you act given tipping-point uncertainty?**  
     → **B1: Avoid to prevent risk** → **Position: _Precautionary Thresholdism_** (Don’t risk being the "straw that breaks the camel’s back").  
     → **B2: Risk is negligible** → **Proceed to Question 4** (Same as "No harm" branch).

  #### If C or B2 (No direct harm):
  4. **Is the act still wrong for non-causal reasons?**  
     → **C1: Yes, it expresses vice** → **Position: _Expressivist Wrong_** (e.g., "Eating steak shows disrespect for life").  
     → **C2: Yes, it breaks a rule** → **Position: _Deontological Duty_** (e.g., "Killing animals is always wrong, period").  
     → **C3: Only if collective progress** → **Proceed to Question 5** (Conditional duty).  
     → **C4: Only duty is group action** → **Position: _Collective Organizer_** (e.g., "Fight systems, not acts—organize or donate").  
     → **C5: No** → **Position: _No Individual Wrong_** (e.g., "Only groups cause harm; my act is neutral").

  #### If C3 (Only if collective progress):
  5. **Must you act if others won’t?**  
     → **C3a: Only if enough join** → **Position: _Conditional Participation_** (e.g., "I’ll quit flying if 10,000 others do").  
     → **C3b: Yes, to lead by example** → **Position: _Unconditional Participation_** (e.g., "Do your part even if others don’t").

  ---

  ### Positions Summary (9 Leaves)
  | Position                  | Steak?           | Voting?          | Flight?          | Core Reasoning                                     |
  |---------------------------|------------------|------------------|------------------|---------------------------------------------------|
  | **Marginal Harm Avoidance** | Avoid            | Avoid¹           | Avoid            | Direct small harm = morally culpable.             |
  | **Offset Permissibility**   | Okay with offset | Nonsensical²     | Okay with offset | Duty is net outcomes, not acts.                   |
  | **Precautionary Thresholdism** | Avoid            | Avoid¹           | Avoid            | Risk of triggering collapse demands caution.      |
  | **Expressivist Wrong**      | Avoid            | Avoid³           | Avoid            | Act expresses bad character/values.               |
  | **Deontological Duty**      | Avoid            | Avoid³           | Avoid            | Violates a rule (e.g., "no killing").             |
  | **Conditional Participation**| Depends          | Depends⁴         | Depends          | Duty only if critical mass acts.                  |
  | **Unconditional Participation** | Avoid           | Avoid³           | Avoid            | Duty to "do your part" regardless of others.      |
  | **Collective Organizer**    | Not required     | Not required     | Not required     | Individual duty is to organize, not abstain.      |
  | **No Individual Wrong**     | Permitted        | Permitted        | Permitted        | Only groups cause harm; no personal duty.         |

  ¹ *Voting in a foregone conclusion*: Avoids voting for a harmful candidate (even if outcome is fixed) due to harm/risk/principle.  
  ² *Offset Permissibility + Voting*: Illogical—voting lacks quantifiable harm to offset.  
  ³ *Voting*: Avoids complicity/support for harmful policies, even in a safe state.  
  ⁴ *Conditional Voting*: Only votes if enough others do (e.g., to build momentum).

  ---

  ### Key Insights & Empty Cells
  - **Identical Cases?** All positions treat steak, voting, and flight **identically** except:
    - _Offset Permissibility_ fails for voting (no measurable harm to offset).  
    - _Marginal Harm Avoidance_ and _Precautionary Thresholdism_ may relax for voting if harm is truly zero (rare in practice).

  - **Why No "Threshold Offset" Position?**  
    Incoherent—offsetting can’t undo threshold-triggering risk (e.g., you can’t un-break the camel’s back).

  - **Why No "Expressivist Offset" Position?**  
    Unattractive—offsetting doesn’t negate expressive wrong (e.g., donating to a sanctuary doesn’t erase steak’s "disrespect").

  - **Why No "Duty to Harm" Position?**  
    Absurd in ethics—nobody argues you *should* cause harm.

  - **Blended Issues Resolved:**  
    - Causation vs. responsibility: Separated in Q1 (causation) vs. Q4/Q5 (responsibility).  
    - Thresholds: Q1/B handles tipping points; "camel’s back" survives via precaution (B1).  
    - Conditional duty: Explicit in C3a/C3b.  
    - Collective vs. individual duty: Q4/C4 isolates collective-only views.

  ### Tree Assumptions
  - **Implicit in Q1:** "Harm" means measurable outcome change (e.g., reduced suffering/emissions). If users debate this, clarify before starting.  
  - **No "Character + Offset" Hybrid:** Expressivism (C1) and offsetting (A2) conflict—the tree forces a choice.  
  - **Voting Complexity:** Positions apply if voting is seen as harm-causing (e.g., endorsing injustice). If not, users may default to "no harm" (C) branches.

  This tree resolves circular debates by isolating causal beliefs (Q1) from moral reasoning (Q2–Q5). Hand it out with cases pre-defined (e.g., "voting in California for a doomed candidate") to avoid definitional tangles.
