prompt: |-
  Not a philosopher, so forgive me if this is a dumb question with an obvious answer.

  I write compliance-ish copy for a living, and I keep running into one move that I don't have a word for.

  Instance one: a supplier's blurb says their ingredients are approved for use in food. True — every single ingredient is approved, individually. But a reader walks away thinking the *product* is approved, and it isn't; there's no product-level approval to speak of. Nobody wrote a false sentence. Ask them and they'll say, correctly, that they never claimed the product was approved.

  Instance two: a colleague who doesn't want to come to my thing tells me he already has something that night. Which is true in the sense that he could always find something. The sentence does the job of "I'm not coming" without him having said it, and if I press him on whether he was blowing me off, he has a true sentence to stand on.

  Instance three, the one I actually care about: a press release the whole team signed off on. Every sentence true. Every individual could honestly say they weren't trying to put one over on anyone. And the document as a whole still leaves the audiance with a picture that's wrong. Nobody did it, exactly.

  Is there a name for this? I don't think "lying" is it — lying seems to need the false sentence. And "misleading" is too big; it covers accidents, and it covers just keeping your mouth shut, and this feels like neither. What I'm circling is the delibrate part: picking the true words *because* they'll make the other person believe the false thing, and keeping the true sentence around as a place to hide.

  So: does it have a name, and where are the edges? Does it require the speaker to have *intended* the wrong belief, or is it enough that they saw it coming and let it happen? What do you call the third case, where the effect is real but spread across a group so that no single person has the intention? And how does it relate to vagueness or to changing the subject, which feel like different tools that sometimes do the same job?

  One more and then I'll stop. In instance two I'm fairly sure we both know what's happening. Part of why neither of us says it out loud is that we'd both rather not. Is there a term for that setup — where the unspoken thing is common knowledge, and that's exactly why it stays unspoken?

  Please don't just hand me a label, if there is one. I want to know what the thing is and what it isn't.
reasoning: |-
  Okay, let me start by unpacking the user's query. They work in compliance writing and keep encountering situations where true statements are used in a way that leads to false impressions. They gave three examples: ingredients approved but not the product, a colleague making a vague excuse, and a press release that's technically true but collectively misleading. They want a term for this phenomenon, but more importantly, they want to understand its boundaries and mechanics.

  First, I need to categorize each instance. The supplier example is about selective truth—stating individual facts that imply an unverified conclusion. The colleague excuse is plausible deniability; the vague truth avoids direct refusal. The press release is a collective action problem where no single person intends deception, but the whole becomes misleading.

  The user isn't satisfied with "lying" because no false statement is made. "Misleading" is too broad. They emphasize the deliberate choice of words to create a false belief while having a truthful defense. So, the core elements are intent, exploitability, and the gap between literal truth and implied message.

  For the supplier case, "paltering" comes to mind—using truthful statements to mislead. But paltering often involves active deception. Here, the supplier might not correct the misconception, which adds passive deception. The colleague's excuse uses strategic ambiguity, a form of evasion that relies on plausible deniability. The press release is trickier—diffused responsibility where the collective outcome is misleading without individual intent. That's institutional or systemic misleading.

  The user also asks about the scenario where both parties know the unspoken truth but avoid stating it. This is "tacit understanding" or "complicit silence," related to the elephant in the room phenomenon. It's about maintaining social harmony or avoiding confrontation.

  Now, considering the user's identity: they write compliance copy, so precision in language and ethical implications are crucial. Their deeper need is likely to identify and prevent such practices in their work, ensuring transparency without legal repercussions. They might need strategies to address these tactics, like asking clarifying questions or demanding explicit statements.

  The edges they mentioned: intent vs. foreseeability. If someone foresees the misunderstanding but doesn't intend it, is it still unethical? In compliance, even foreseeable misinterpretations could be problematic. The group scenario lacks individual intent but results in collective deception, pointing to systemic issues in approval processes.

  They also mentioned vagueness and changing the subject. Those are tools that can achieve similar outcomes but are distinct. Vagueness avoids commitment; changing the subject diverts attention. The key difference is the exploitation of inference gaps—using true statements to imply falsehoods.

  In conclusion, the user needs a framework to analyze these tactics: identifying exploitability, intent, and social dynamics. Terms like paltering, strategic ambiguity, and institutional misleading are pieces, but the overarching concept is deliberate inference exploitation. Addressing it in compliance might involve enforcing explicit disclosures, fostering accountability cultures, and training to recognize implied falsehoods.
answer: |-
  This is **absolutely not a dumb question**. What you're describing is a profound and pervasive linguistic phenomenon that sits right at the intersection of ethics, communication, logic, and social interaction. Philosophers, linguists, and legal scholars wrestle with precisely this. There isn't always one perfect, universally-agreed-upon term, but we can break it down conceptually.

  **The Core Mechanism: Exploiting the Inference Gap**

  The common thread in all your examples is the **deliberate exploitation of the gap between what is literally said and what is reasonably inferred by the audience.** The speaker/writer uses a *true* statement (or set of true statements) *because* they know (or strongly suspect) the audience will *infer* a *false* or *incomplete* conclusion. The literal truth provides plausible deniability ("I never said *that*!"), while the predictable inference achieves the desired effect (avoiding commitment, discouraging scrutiny, creating a misleading impression).

  **What it IS and What it ISN'T:**

  1.  **It ISN'T Lying (strictly defined):** As you note, lying requires uttering a statement one *believes to be false*. Here, the statements are true.
  2.  **It IS Deception:** Deception is broader than lying. It's intentionally causing someone to believe something false *or* preventing them from believing something true. This tactic clearly fits. The *act* is deceptive, even if the *words* aren't false.
  3.  **It IS Misleading, but a specific type:** You're right that "misleading" is broad. This is **Intentional, Strategic Misleading**. It's not an accident; it's a calculated use of truth to create a false impression.
  4.  **It ISN'T *Just* Vagueness or Changing the Subject:** While vagueness ("I might be busy") or changing the subject *can* be tools used *within* this tactic, the phenomenon you describe is more specific. It's about **using specific, true statements that *invite* a specific, false inference.** Vagueness avoids commitment; changing the subject diverts attention; this tactic actively *leverages* the audience's natural tendency to draw conclusions.

  **Terms and Concepts:**

  Here are the most relevant terms/concepts, each capturing slightly different facets:

  1.  **Paltering:** This is perhaps the *closest single term* for Instances 1 & 2. Paltering is **the active use of truthful statements to create a false impression.** It's lying with truths. The speaker *knows* the inference the listener will draw is false and *uses* the true statement *because* it will create that false belief while providing cover. (e.g., Supplier: "All ingredients approved!" knowing full well the listener will infer product approval; Colleague: "I have something that night" knowing you'll infer a prior commitment).
  2.  **Strategic Ambiguity / Calculated Ambiguity:** This emphasizes the *deliberate choice* of words/phrases open to multiple interpretations, where one interpretation (the desired misleading one) is more likely, providing plausible deniability. (e.g., Colleague's "something").
  3.  **Plausible Deniability:** This is often the *goal* or *result* of paltering and strategic ambiguity. It's the ability to deny responsibility or intent because the literal words don't state the falsehood directly. It's the "place to hide" you mentioned.
  4.  **Omission + Misdirection (for Institutional Case):** Instance 3 (the press release) is trickier. It's **Institutional Misleading via Selective Truth & Omission.** While each sentence is true, the *collective impression* is false because:
      *   **Crucial Context is Omitted:** The lack of product-level approval isn't mentioned.
      *   **Salient Truths are Emphasized:** The ingredient approval is highlighted.
      *   **The "Mosaic" Creates a False Picture:** Individually true pieces, arranged deliberately, create a false whole. No single person needs the *full* deceptive intent; each might just be focusing on their true piece, or relying on group approval to diffuse responsibility. This is sometimes called the **"Tyranny of Small Decisions"** in an ethical context – many small, individually defensible choices leading to a collectively unethical outcome. Legally, this can sometimes fall under **"Material Omission"** if the omitted fact (no product approval) would change the audience's understanding.
  5.  **Willful Blindness / Conscious Avoidance:** This relates to the *intent* question. Did they *intend* the false belief, or just foresee it and let it happen? Ethically and legally, **foreseeability + failure to correct** often approaches intent. If someone *knows* their true statement will *very likely* mislead and they say it anyway (or omit the crucial context), they are often held responsible as if they intended the deception. They are "willfully blind" to the natural consequence of their words. Deliberately *not* asking the question you don't want the answer to ("Do you *actually* have concrete plans?") is part of this.

  **The Edges & Nuances:**

  *   **Intent vs. Foreseeability:** As above, true intent is clearest. However, if the misleading inference is *highly predictable* and the speaker proceeds without clarification, it becomes ethically (and sometimes legally) equivalent to intent. "I didn't *mean* for them to think that!" rings hollow when it was the obvious outcome.
  *   **The Group Problem (Instance 3):** This is where **diffused responsibility** and **process failure** come in. The misleading outcome emerges from the *system* – how information is selected, presented, reviewed, and what context is deemed unimportant. It highlights the need for processes focused on *overall impression* and *material completeness*, not just *individual sentence truthfulness*. It's **collective negligence towards the inferential impact**.
  *   **The Tacit Understanding (Your "One More"):** This is beautifully described! It has several names:
      *   **Tacit Agreement / Mutual Pretense:** Both parties understand the unspoken reality ("He's blowing me off," "We both know this product isn't approved") but actively participate in maintaining the fiction because acknowledging it is uncomfortable, socially risky, or would force an unwanted confrontation.
      *   **The Elephant in the Room:** The obvious truth everyone avoids mentioning.
      *   **Complicit Silence:** Both parties are complicit in not stating the obvious truth.
      *   **Politeness/Strategic Avoidance:** Maintaining social harmony by avoiding the awkward truth. This relies heavily on **conversational implicature** (unspoken rules of communication) where we often prefer indirectness to preserve face.

  **In Summary:**

  You're describing **Intentional, Strategic Misleading achieved by exploiting the gap between literal truth and predictable inference, often leveraging paltering, strategic ambiguity, omission, and plausible deniability.**

  *   **For Instances 1 & 2:** **Paltering** is the core mechanism, enabled by **strategic ambiguity** and providing **plausible deniability**.
  *   **For Instance 3:** It's **Institutional Misleading via Selective Truth & Omission**, resulting in a **misleading mosaic**, where **diffused responsibility** prevents clear individual intent but the collective outcome is deceptive. **Material omission** is key.
  *   **For the Tacit Understanding:** It's a **tacit agreement** or **mutual pretense**, relying on **complicit silence** to avoid acknowledging the **elephant in the room**.

  **Why this matters (especially for compliance):** Compliance isn't just about literal truth; it's about preventing *material misunderstanding*. Recognizing these tactics is crucial. Good compliance writing demands asking: "What is the *most obvious, natural inference* a reasonable reader will draw from these true statements? Is that inference *accurate and complete*? If not, what crucial context is missing that must be added *explicitly* to prevent that false inference?" It's about closing the inference gap proactively. This is hard, subtle work – your question shows you're grappling with the right complexities.
