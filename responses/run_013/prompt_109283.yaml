prompt: |-
  Ok so bit of background: I coach high school policy debate — six years now, I judge on weekends, I dream in flows, that's my whole life. Recenlty I got sucked into reading about this AI safety idea that is literally called debate: you take a question that's too hard for a human to just check directly (is this code safe, did this molecule do what it claims), you have two copies of a model take turns making short statements against each other, and a human judge who never sees the underlying evidence — only the back-and-forth — picks whichever side gave them the most true and useful information. The pitch is that lying is hard when there's someone on the other side to call it out, so the judge ends up at the truth even though they can't verify any of the substance themselves, and there's some complexity-theory argument in there about the judge getting way more done than they could alone.

  What I want from you is a faithful restatement of that proposal in the vocabulary I actually think in — resolution, burdens, topicality, counterplans, kritiks, CX, spreading, judge adaptation, evidence comparison, the 2NR, the whole toolkit. Not a cute analogy, an actual translation, the way you'd explain a round to another coach who already knows every term. Then give me the residue report, which is the part I actually care about.

  What in their setup has no counterpart in a real round, and what in a real round has no counterpart on their side? My hunch is that their whole thing is judge adaptation taken to its limit — every round I've judged at a rural tournament was in front of someone who could never be a subject-matter expert on the resolution, and debaters win those by making the round legible rather than by being right. If that's really what's going on, does their proposal inherit all the pathologies of that, and does competitive debate have institutional answers to them (speed limits, evidence ethics, paradigm disclosure, judges who at least know the topic) that they've got nothing like? And where does it cut the other way — is my framework just missing something, because a debate round has no ground truth and theirs supposedly does? Don't be nice about it, tell me which direction the residue actually cuts.
reasoning: |-
  Okay, let me unpack this request. The user is a high school policy debate coach with deep expertise, asking for a technical translation of AI safety's "debate" framework into competitive debate terminology. They want to know where the two models diverge fundamentally - the "residue" - and specifically whether AI debate inherits the pathologies of judge adaptation in real rounds.

  Hmm, the core tension they're probing is between truth-finding in AI systems and competitive persuasion in human debate. Their rural tournament analogy about "legibility over rightness" is sharp - that's exactly where I should anchor the comparison. 

  First, I need to map the AI proposal faithfully: resolution = verifiable ground truth question, burdens = symmetric proof obligations with no presumption status quo. The AI's turn limits are like extreme speech time constraints, and the no-evidence rule creates pure analytic debating. 

  But the residues jump out immediately. Human debate has no ground truth - we're judging persuasiveness, not correctness. And oh god, the judge differences: AI judges are blank-slate nonexperts without paradigms, while our judges have topic knowledge and norms. That changes everything about evidence ethics and strategy. 

  The user's hunch about pathologies seems confirmed. AI debate amplifies all the worst parts of judge adaptation - truth could lose to persuasive lies if the opponent fails. But their question about institutional solutions is killer: competitive debate has norms (speed limits, evidence disclosure) that AI lacks. Yet AI has one advantage: the ground truth means bad outcomes are measurable, unlike in policy rounds where we never know if the better argument won.

  Wait - they asked not to be nice. So I should emphasize how AI debate is actually a degenerate form: no solvency advocates, no fiat, just zero-sum truth combat. The residue cuts both ways: competitive debate's norms prevent some abuses but create new biases, while AI debate's purity makes it vulnerable to manipulation. 

  The closing thought matters: this comparison exposes that competitive debate isn't truth-seeking machinery - it's training for epistemic warfare under constraints. That meta-perspective might be what the coach really needs to hear.
answer: |-
  Here's the faithful translation and residue report you asked for, stripped of analogy and grounded in competitive debate mechanics:

  **AI Safety "Debate" Translated into Policy Debate Lexicon:**

  *   **Resolution:** A single, specific, empirically verifiable question with a ground truth (e.g., "Resolved: This Python code contains a buffer overflow vulnerability," "Resolved: This molecule binds to protein X with affinity Y").
  *   **Burden Structure:** Symmetric burdens of proof. Both sides bear an equal burden to provide the most true and useful information to the judge. No presumption for the status quo/affirmative. The judge defaults to "No Decision" without sufficient information flow.
  *   **Topicality:** Strictly defined by the resolution's empirical question. Violations are impossible if the statements directly address the question; irrelevance is functionally a T-violation ("non-germane").
  *   **Counterplans/Kritiks:** Nonexistent. The resolution is a binary empirical question, not a policy proposition. There is no alternative system to propose (CP) or philosophical framework to critique (Kritik). The *only* question is the truth value of the resolution.
  *   **CX (Cross-Ex):** Continuous and mandatory. Every statement is effectively a CX of the opponent's previous claim, demanding justification or refutation. The entire "round" is alternating CX segments.
  *   **Spreading:** The AI equivalent is extreme information compression per turn. Models must convey complex technical justifications within a severe time/word limit, prioritizing clarity and impact under constraint.
  *   **Judge Adaptation:** Taken to its absolute extreme. The judge is assumed to be a *complete novice* with **zero** topic knowledge or pre-conceived paradigms. Their *only* input is the flow of the debate itself. Adaptation means making complex technical truths legible and persuasive to this blank slate.
  *   **Evidence Comparison:** The *core* mechanism. Every claim is "evidence" presented in-round. Truth is determined by whose claims better withstand refutation attempts ("cross-x") and whose explanations are clearer/more useful to the judge. There is *no* external card to pull; all "cards" are analytic arguments generated in real-time by the models.
  *   **The 2NR:** The final speech is the ultimate crystallization of "which side gave the judge the most true and useful information path to the answer." It must collapse to the core winning argument(s), demonstrate the opponent's key claims are refuted/unsupported, and make the judge's ballot decision trivial based *only* on the flow.

  **Residue Report: The Asymmetries and Implications**

  **I. What's Missing in AI Debate (Compared to Policy):**

  1.  **No Ground Truth in Policy:** This is the *fundamental* asymmetry. Policy debate resolutions (e.g., "Resolved: The USFG should substantially increase...") have **no verifiable ground truth**. Winning is about persuasive advocacy within the rules, not proving an objective fact. AI debate *assumes* a ground truth exists and aims to reveal it. Policy debate is about winning the ballot, which may or may not correlate with "truth."
  2.  **No Advocacy/Stasis:** Policy Affs advocate for a *change*; Negs advocate for the SQ or an alternative. AI debate has no stasis point or change; it's purely about answering "Is X true?" There's no "solvency advocate," "fiat," or "permutation."
  3.  **No External Evidence/Research Burden:** AI models generate all "evidence" in-round instantaneously. Policy debaters spend months researching external, authored evidence. AI debate lacks the entire institution of evidence ethics, disclosure, qualification, and cut-card disputes. The "card" *is* the analytic claim made in the speech.
  4.  **Limited Judge Context:** AI judges are *designed* to be pure blank slates. Policy judges (even rural parents) bring *some* topic knowledge, argument preferences (paradigms), and awareness of debate norms/community. AI debate removes judge prefs, paradigms, and any ability for the judge to "look stuff up" later.
  5.  **No Procedurals (except T-as-Irrelevance):** No theory shells (except maybe "they didn't answer the question"), no spec arguments, no PICs, no delay CPs. The structure inherently prevents most common policy procedural arguments.
  6.  **No Speech Time Asymmetry:** Aff gets 1AC, Neg gets 1NC, etc. AI turns are symmetric and constrained.

  **II. What's Missing in Policy Debate (Compared to AI):**

  1.  **Pure Truth-Seeking Mechanism:** Policy debate isn't *designed* as a primary truth-seeking tool for complex empirical questions. It's pedagogical and competitive. AI debate *is* explicitly designed as a truth-discovery tool for questions too hard for direct human verification.
  2.  **Perfect Opponent:** AI models are (theoretically) perfectly prepared, equally skilled clones focused *only* on refuting false claims related to the resolution. Human debaters have varying skill, prep, and may run strategies avoiding core clash (e.g., tricks, Ks).
  3.  **Mandatory Clash:** The AI structure *forces* direct engagement on the empirical claim. Policy debate allows for strategic avoidance (e.g., going for T, a K, a CP that avoids the Aff's core advantage claim).
  4.  **Quantifiable Outcome Metric:** AI debate has a clear, objective metric for success: did the judge pick the side aligned with the ground truth? Policy debate success is winning ballots, which correlates imperfectly with argument quality/truth due to judge subjectivity, subjectivity of the resolution itself, and strategic choices.

  **Analysis: Where the Residue Cuts (Brutally)**

  *   **Your Hunch on Judge Adaptation is Core:** Yes, the AI setup is **extreme judge adaptation pathology magnified.** Winning relies *entirely* on making complex truths legible to an ignorant judge within tight constraints, just like simplifying nuclear strategy for a lay parent judge. The pathologies are identical:
      *   **Persuasion > Truth:** A well-delivered, clear lie *can* win if the opponent fails to refute it effectively *in the moment* for *that judge*.
      *   **Obfuscation Wins:** Drowning the judge in complex, technically-true-but-irrelevant details (a form of "spreading") can obscure the core truth.
      *   **Exploiting Ignorance:** Strategies can be designed *specifically* to exploit predictable patterns of novice misunderstanding.
  *   **Policy's Institutional Answers & AI's Lack:** This is where the residue cuts **hard against the AI proposal**.
      *   **Topic Knowledge:** Policy judges, even lay ones, are *briefed* and often have *some* topic familiarity. Tournaments use experienced judges on panels. AI judges are *designed* to know *nothing*.
      *   **Speed Limits:** Tournaments *do* regulate spreading to protect accessibility and comprehension. AI debate has no equivalent throttle on information density beyond the fixed turn length.
      *   **Evidence Ethics & Disclosure:** The community (imperfectly) enforces norms around evidence quality, qualification, and sharing *before* the round. AI debate has *no* pre-round verification. All "evidence" is generated on the fly, potentially hallucinated, with no accountability or disclosure. This is a **massive vulnerability.**
      *   **Paradigms:** Judges disclose how they evaluate arguments, mitigating some surprise. AI judges have no paradigm beyond "pick the most true/useful info flow."
      *   **Community Norms & Evolution:** Policy debate has decades of evolving norms to handle pathologies (e.g., theory debates to counter abusive practices). AI debate lacks this organic, adversarial norm-setting process.
  *   **Where AI Might Have an Edge (The Flipside):**
      *   **Ground Truth Exists:** This is the crucial difference. While the *process* might have pathologies, the *outcome* can be objectively measured afterward ("Did the code *actually* have the vulnerability?"). This allows for feedback and improvement of the models/debate process in a way impossible in policy debate ("Was the *best* policy advocacy chosen?" is unanswerable). AI debate can learn from its mistakes against a known truth.
      *   **Forced Engagement:** The inability to run procedurals or Ks *forces* the debate onto the core empirical question, unlike policy where the core clash can be avoided.

  **Conclusion: The Residue Cuts Both Ways, But Sharply Against AI's Naivete**

  Your core insight is correct: **AI debate is pure, high-stakes judge adaptation pathology.** It inherits *all* the risks of a novice judge deciding complex issues based on legibility and persuasion, *amplified* by the lack of policy's institutional guardrails (topic knowledge, speed limits, evidence norms, experienced judges, community evolution) and the terrifying potential for AI-generated "evidence" hallucinations. The absence of a ground truth in policy protects it from the claim it *should* find truth; AI debate makes this claim but its proposed mechanism is deeply vulnerable to the same pathologies that plague lay judging, without the defenses the debate community has (imperfectly) built.

  The residue cuts most sharply in exposing that **the AI proposal underestimates the corrupting potential of competitive persuasion in the absence of robust, pre-existing norms and verification mechanisms that it explicitly rejects (like judge expertise or pre-round evidence checks).** It assumes adversarial dynamics *only* produce truth, ignoring how they can produce persuasive falsehoods. Policy debate understands this danger intimately and struggles with it constantly. AI safety "debate" naively replicates the pathology while stripping away the community's hard-won mitigations. Its potential advantage – the existence of a ground truth for feedback – is only useful *after* a potentially catastrophic misjudgment occurs.
