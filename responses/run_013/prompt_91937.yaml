answer: |-
  Here's a comprehensive exam package designed to meet your goals, forcing nuanced application of Dennett's concepts beyond mere recitation.

  **Essay Question (to be printed on exam sheet):**

  "Daniel Dennett warns against explanatory 'skyhooks' (miraculous, unsupported lifts) while championing 'cranes' (stepwise, mechanistic explanations built from below). He also critiques 'greedy reductionism' – the premature dismissal of higher-level phenomena *before* adequate cranes are built, mistaking the *promise* of lower-level explanation for its actual achievement.

  Analyze EACH of the following four positions. For EACH one:
  1.  State whether the **core explanation or claim itself** primarily functions as a potential *crane* or a *skyhook*. Justify your answer briefly.
  2.  State whether the **objection or critique** presented alongside it represents a *legitimate demand for a crane* or an instance of *greedy reductionism*. Justify your answer briefly.

  *   **Case 1:** A neuroscientist claims depression is "just" a wiring problem in the brain, arguing that once neural circuits are fully mapped, the psychological level of description (feelings, thoughts) will become obsolete and should be retired.
  *   **Case 2:** A philosopher argues that consciousness cannot be reduced to physical processes and must instead be a fundamental, intrinsic property of the universe, akin to electromagnetic charge or quantum spin.
  *   **Case 3:** An ethicist critiques evolutionary accounts of morality, stating: 'While evolution can explain the origins of our moral *feelings* and social behaviors, it can never generate a genuine moral *ought* – a real obligation telling us what we *should* do. This gap cannot be filled by any further biological detail.'
  *   **Case 4:** An evolutionary developmental biologist (or an economist) argues that a high-level pattern (e.g., a pervasive developmental constraint like 'pharyngeal arches in vertebrates,' or a market regularity like 'supply and demand') actually imposes top-down constraints, limiting what configurations the underlying molecules (or individual agents) can physically achieve or sustain.

  Finally, reflect specifically on Case 3. Is the ethicist identifying a genuine explanatory gap requiring a non-biological crane (or even a skyhook), or is this critique flawed (e.g., a misunderstanding of 'ought,' an unreasonable demand, or something else)? Take a clear stance and defend it.

  *(Time: 45 minutes. Aim for approximately 800 words.)*

  ---

  **Model Answer (Approx. 650 words):**

  **Case 1:**
  1.  **Claim as Crane/Skyhook:** The neuroscientist's core claim (depression *is* a wiring problem) *aims* to be reductionist/crane-building. It points to a lower mechanistic level (neural circuits) as the basis for the phenomenon.
  2.  **Objection as Crane Demand/Greedy Reductionism:** The *objection* (demand to retire the psychological level *now*) is **greedy reductionism**. It prematurely dismisses the higher-level (psychological) phenomenon *before* adequate cranes linking circuits to specific subjective experiences, thoughts, and functional impairments are actually built. It mistakes the *promise* of neural explanation for its current achievement, ignoring the legitimate explanatory work still done at the psychological level (e.g., describing symptoms, guiding therapy).

  **Case 2:**
  1.  **Claim as Crane/Skyhook:** The philosopher's claim (consciousness is fundamental) is a **skyhook**. It posits consciousness as a brute, inexplicable given, not built from or explainable by lower-level physical processes. It offers no crane-like mechanism for how this fundamental property arises from or interacts with the physical world; it simply asserts its basic existence "from above."
  2.  **Objection as Crane Demand/Greedy Reductionism:** The *objection* inherent in the claim (consciousness *cannot* be reduced) represents a **legitimate demand for a crane**, or rather, an assertion that cranes *cannot* be built here. It correctly identifies the hard problem of consciousness – the explanatory gap between physical processes and subjective experience. While the *solution* proposed (fundamentalism) is a skyhook, the *critique* of standard reductionist approaches highlights a genuine lack of current cranes bridging physics to qualia.

  **Case 3:**
  1.  **Claim as Crane/Skyhook:** The ethicist's *description* of evolution explaining moral feelings/behaviors is **crane-building**. It grounds complex phenomena (morality) in a stepwise, naturalistic process (evolution). However, their core *claim* about the "ought" ("evolution can't generate real moral oughts") is not itself offering an explanation; it's identifying a perceived limit *of* crane-building.
  2.  **Objection as Crane Demand/Greedy Reductionism:** The critique ("evolution can't generate real moral oughts, this gap cannot be filled by biology") is a **legitimate demand for a crane** *if* one believes moral "oughts" are real, objective facts needing explanation. It points out that evolutionary cranes explain *descriptive* origins ("is") but seem ill-suited to generate *prescriptive* obligations ("ought"). It's not greedy reductionism because it doesn't dismiss morality *per se*; it questions whether a specific type of crane (biological evolution) can build *this specific part* (objective obligation).

  **Case 4:**
  1.  **Claim as Crane/Skyhook:** The claim (high-level patterns constrain lower levels) *can* be **crane-building**, *if* it specifies the *mechanism* of constraint. For example, explaining *how* developmental constraints arise from physical laws governing cell adhesion and gene expression networks, or *how* market regularities emerge from individual agent interactions under scarcity. Without mechanism, it risks sounding like a mysterious top-down force – a **skyhook**.
  2.  **Objection as Crane Demand/Greedy Reductionism:** An implied objection here might be a reductionist demanding that *only* molecule-level (or agent-level) explanations are valid, dismissing the constraining pattern. *This* objection would be **greedy reductionism**. It dismisses the higher-level pattern (constraint, regularity) *before* demonstrating how lower-level interactions fully account for its existence and causal power. The pattern itself may be a real, stable feature requiring explanation at its own level or as an emergent crane.

  **Reflection on Case 3:**
  The ethicist identifies a *conceptual* gap, not a biological one demanding a crane. The flaw is likely a **category error** about the nature of "ought." Evolutionary biology provides cranes explaining *why we have the moral intuitions and capacities we do* (the descriptive "is" of morality). However, a *fundamental*, objective moral "ought" – a cosmic command – isn't a *scientific fact* discoverable by any crane (biological, physical, or otherwise). Science deals with *what is*. Demanding that evolution (or any science) produce such an "ought" is like demanding physics tell you which painting is *truly* beautiful. The "gap" arises from expecting science to answer non-scientific, philosophical questions about ultimate justification. Moral "oughts" may be better understood as commitments, prescriptions, or social constructs built *upon* our evolved capacities, not mysterious facts needing a supernatural or fundamental crane/skyhook. The critique is flawed because it mistakes the domain of science; the gap isn't in the evolutionary explanation, but in the expectation placed upon it.

  ---

  **Marking Scheme (Total: 20 Points)**

  1.  **Correct Crane/Skyhook Identification & Justification (Per Case):** (1 point per case x 4 = **4 Points**)  
      *   *Common Mistake:* Labeling any reductionism as a crane (ignoring whether mechanism is specified) or any non-reductionist claim as a skyhook (ignoring if it offers a mechanistic alternative). E.g., Calling Case 1 a crane (correct) but Case 2 reductionism (wrong – it's anti-reductionist/skyhook).

  2.  **Correct Objection Analysis & Justification (Per Case):** (1 point per case x 4 = **4 Points**)  
      *   *Common Mistake:* Confusing the *core claim* with the *objection* presented. Misidentifying greedy reductionism (e.g., thinking it just means "reductionism is bad"). E.g., Calling the Case 1 objection a "legit crane demand" (wrong – it's greedy reductionism).

  3.  **Analysis of Case 3's "Ought Gap":** (**5 Points**)  
      *   Clearly states a stance (gap real vs. flawed critique). (1 pt)
      *   Provides coherent reasoning justifying the stance (e.g., category error, domain error, misunderstanding of "ought"). (2 pts)
      *   Explicitly addresses the nature of the "gap" (conceptual, not scientific; expectation error). (1 pt)
      *   Discusses the implications for crane-building/reductionism in ethics. (1 pt)  
      *   *Common Mistake:* Simply agreeing a gap exists without analyzing *why* or *what kind* of gap. Claiming evolution *must* provide an "ought" or that a skyhook *must* fill the gap without critical assessment. Failing to address the "category error" possibility.

  4.  **Understanding Greedy Reductionism Distinction:** (**3 Points**)  
      *   Correctly identifies it in Case 1 objection (or potentially Case 4 implied objection). (1 pt)
      *   Demonstrates understanding it as a *flawed subtype* of reductionism (premature dismissal). (1 pt)
      *   Contrasts it with legitimate crane demands elsewhere (e.g., Case 2 objection). (1 pt)  
      *   *Common Mistake:* Equating greedy reductionism with all reductionism, or with anti-reductionism. Using the term incorrectly or vaguely.

  5.  **Overall Coherence, Clarity, and Argument Structure:** (**4 Points**)  
      *   Logical flow between cases and reflection. (1 pt)
      *   Precise use of terms (crane, skyhook, greedy reductionism). (1 pt)
      *   Answers all parts of the question for each case. (1 pt)
      *   Concise, well-structured writing within word/time limits. (1 pt)  
      *   *Common Mistake:* Disorganized responses, missing parts of the question (e.g., forgetting to analyze objections), vague or incorrect terminology.

  **Distinguishing A from B:**
  *   **A Grade (17-20):** Excels particularly in **Point 3 (Case 3 Analysis)**. Offers a sophisticated, well-reasoned stance on the "ought gap," clearly articulating the category/domain error argument or equivalent. Demonstrates deep understanding of the limitations and scope of crane-building explanations. Applies all concepts (crane, skyhook, greedy reductionism) accurately and insightfully across *all* cases. Writing is exceptionally clear and structured.
  *   **B Grade (13-16):** Competent application of concepts to all cases. Identifies crane/skyhook and objections mostly correctly. Takes a stance on Case 3 but the reasoning may be less developed, less precise on the nature of the gap/error, or less compelling. May show minor misunderstandings of greedy reductionism or less nuance in crane identification (e.g., Case 4). Writing is generally clear but may lack the depth or precision of an A answer.
