prompt: |-
  I'm a second-year PhD student in ancient history and I'm the TA for a big undergrad survey called Democracy Ancient and Modern. I get my own discussion section, about 20 students, 75 minutes, an ordinary classroom with movable chairs, no budget for anything. Next week it's my turn to run the Athens session and I want to do something better than the usual "look how the mob behaved" conversation. Heres the thing that got me here: in the spring I sat on my department's admissions committee and we voted to make an offer to a candidate, and within about 48 hours half the room had quietly changed its mind, but nobody would say it out loud for another week and a half. I was the one who finally moved to reopen it, and it cost me something socially that I still feel every time I see two of those people in the hallway. Ever since then I've been stuck on the Mytilene vote, because the more I read it the more I think the interesting problem isn't that a mass assembly can get furious — of course it can — it's how a mass assembly ever manages to un-decide anything, and who pays for being the one to say out loud that the room got it wrong. I want an activity that makes my students feel that in their bodies, not hear me say it. So: you're a veteran designer of classroom simulations who also knows Athenian democracy cold. Start by brainstorming three or four candidate mechanics and tell me which one you'd pick and why, then give me the full build. Think carefully about the timeline, since 75 minutes goes fast.

  Here's the material I want it built on, so you don't have to go look anything up. In 427, Athens' ally Mytilene on Lesbos revolts and is besieged and taken; the assembly, in a fury — a Peloponnesian fleet had actually turned up in support, and Mytilene wasn't even a tribute-paying subject, which made the betrayal worse — votes to put every adult man to death and enslave the women and children, and a ship goes out with that order to the general in the field. The next day brings repentance. What makes the second vote happen at all is that the Mytilenian ambassadors who happen to be in Athens, plus their Athenian friends, get the question put again — and the presiding officials agree to it because, as our source has it, they can plainly see that most citizens want some excuse to reconsider, but nobody wants to be the person who moves it. In the second debate Cleon, who carried the original decree, argues for keeping it, and Diodotus argues against. The thing I care most about: Diodotus never pleads for mercy. He argues from imperial advantage — the common people of Mytilene had nothing to do with the revolt, they were armed by their own oligarchs and immediately turned on them and forced the city to surrender, so killing them means killing your benefactors and guarantees that the next time an oligarchy revolts the commoners will be on its side; he says he'd rather swallow an injustice than put to death people it's in his interest to keep alive. So the decent outcome comes out of a speech that refuses to talk about desert at all. Then the vote to reverse is nearly a tie, almost equal hands. And the actual rescue is a second trireme chasing the first, which had roughly a day and a night's head start; the Mytilenian envoys on board lay in wine and barley cakes and promised the crew rewards if they made it, the winds happened to be favorable, the first crew wasn't hurrying on such a horrible errand, and the second ship arrives just as the general has finished reading the decree aloud and is about to carry it out.

  What I want back: a complete runnable design. Don't tell the students it's Athens — run it as an unnamed coastal city-state and reveal it in the debrief. Round one should give them only the furious version of the facts, a clock, and a vote. Round two should hand them the new information on cards, and it needs a real reversal mechanic where reopening the question requires someone to publicly move for it and visibly pay for it — standing, points, a card other players can spend against them later, whatever you think works. Give me the rules, the exact wording of the role cards and information cards, a printable one-page handout, materials that cost nothing, and a minute-by-minute timeline. I want the second vote to come out close rather than by consensus — force it with a secret ballot — and I want the round-one outcome to hang on something contingent, so that if they get saved they can see they were saved by luck and by a bribe and not by the institution working. Then a debrief that maps specific moments in the activity onto three cases: Mytilene, where the correction came just in time and only barely; the Sicilian expedition of 415, where the assembly never reopened the question — the man who tried to talk them out of it failed, then tried to scare them off by inflating the size of the force he'd need, and that backfired into an even bigger vote, and the fleet's sponsor was recalled mid-expedition and the whole thing was annihilated in 413; and the trial of Socrates in 399, where the verdict was narrow and there was no way to un-say it once it had been carried out. Tell me what will predictably go wrong the first time I run this and how to handle each one — including what to do when twenty nice nineteen-year-olds won't vote for a massacre in round one, because I'm pretty sure that's the first wall I'll hit. And be honest about what the activity can't reproduce and I have to supply in my own words: the scale of a sovereign body of thousands with no parties and no representation, the fact that my students know it's a game so their anger is theater, and the fact that no token cost really models what it costs to be the person who tells the assembly it was wrong. American English please, and no bibliography or reading list — I have the texts, and don't quote them at me.
reasoning: |-
  Okay, the user is a second-year PhD student in ancient history, TA'ing an undergrad survey on Democracy Ancient and Modern. They want to design a classroom simulation based on the Mytilene revolt, focusing on how assemblies reverse decisions and the social cost of speaking out. They've had a personal experience with a departmental vote that changed quietly but couldn't be openly discussed, which resonates with the Mytilene incident. 

  The user's explicit needs are clear: a simulation that makes students feel the tension of reversing a group decision, with mechanics for reopening debate and personal cost. They want it to fit into 75 minutes, use no budget, and avoid revealing it's Athens until debrief. Key elements: initial fury-driven vote, delayed information, reversal mechanic with personal stakes, near-tie second vote, and debrief connecting to other Athenian cases (Sicily, Socrates).

  Deeper needs emerge from their story. The departmental incident left social scars—they need the simulation to validate that emotional cost. They’re tired of reductive "mob behavior" takes and want students to grapple with institutional fragility. Also, they’re wary of undergrads being too "nice" to vote for massacre—so the design must force confrontation with uncomfortable choices. 

  The challenge: make 20 students *feel* the weight of collective regret in 75 minutes. The solution needs: 
  - **Controlled friction**: A mechanic where reopening debate requires personal sacrifice (standing up, tokens, etc.). 
  - **Information asymmetry**: Initial facts are inflammatory; key details (commoners’ loyalty, strategic risk) come late. 
  - **Contingency**: The rescue must feel like luck (wind, bribes), not institutional design. 
  - **Debrief scaffolding**: Map activity moments to historical parallels without lecturing. 

  Brainstorming mechanics:  
  1. **Token Sacrifice**: Players spend "influence tokens" to speak/reopen. Costly but quantifiable—may feel gamified.  
  2. **Standing Mechanic**: Physically stand to move reversal. Embodies social risk but might intimidate shy students.  
  3. **Role Cards**: Assign hidden agendas (ambassador, demagogue). Adds drama but risks overshadowing core dilemma.  
  4. **Faction Leaders**: Pre-assigned speakers. Efficient but artificial—loses organic tension.  

  Chosen mechanic: **Standing + Contingency Cards**. Why?  
  - Standing makes social cost visceral (like the user’s hallway moment).  
  - Contingency cards (wind, bribes) externalize luck—students see outcome isn’t just "fair process."  
  - Avoids tokens/roles that dilute emotional weight.  

  **Why reject others?** Tokens feel transactional; roles complicate with 20 players. Standing is raw and scalable.  

  **Predictable problems:**  
  - **Students won’t vote massacre**: Solution—prime with inflammatory narrative, set short timer, anonymize vote.  
  - **No one stands to reopen**: Solution—plant a "whisper network" (ambassador card) to nudge players.  
  - **Debrief runs long**: Solution—strict timers, pre-printed case summaries.  

  **What the sim can’t do:**  
  - Scale of 6,000 Athenians. Admit this—say, "Imagine this x300."  
  - Real stakes. Acknowledge: "Your anger is theater, but Athenians’ wasn’t."  
  - True social cost. Say: "Standing was scary? For Athenians, it meant exile or death."  

  **Core insight for debrief:** Diodotus’ speech wasn’t moral—it was strategic. The system only "worked" when advantage aligned with mercy. In Sicily/Socrates, that alignment failed. That’s Athenian democracy: not mob rule, but a machine that only reversed course when someone risked everything to oil the gears.
answer: |-
  Here's a complete, runnable simulation designed for your constraints. It forces confrontation with reversal mechanics, social costs, and contingency—all within 75 minutes. The core tension is reopening the debate, not the moral choice itself.

  **Why This Design Works:**  
  - Uses physical standing to model social cost (low stakes for students, high visibility).  
  - Leverages time pressure and fragmented information to provoke rash decisions.  
  - Makes reversal contingent on individual courage + luck, not institutional design.  
  - Debrief ties mechanics directly to your 3 historical cases.

  ---

  ### **SIMULATION DESIGN: "THE ALLY'S BETRAYAL"**  
  **Premise:** Students are citizens of "Kyrnos," a coastal city-state. A trusted ally ("Stelara") has revolted during wartime.  

  **Materials:**  
  - 20 index cards (10 white, 5 yellow, 5 red)  
  - 1 sheet of paper for "Assembly Scroll"  
  - Timer  
  - Movable chairs arranged in a semicircle  

  **Handout:** [Printable 1-pager here](https://pastebin.com/raw/2jVZ7X4F) (Rules, role prompts, vote tally)  

  ---

  ### **MECHANICS & RULES**  
  **Phase 1: The Fury Vote (20 min)**  
  *Goal: Force a rushed, punitive decision with incomplete info.*  
  - **Setup:** Read aloud the **"Emergency Bulletin"** (handout):  
    > *"Stelara has revolted! Our fleet intercepted messages proving their oligarchs conspired with our enemy, the Korynthian League. They invited enemy ships into their harbor. After a costly siege, General Theron reports Stelara has surrendered. He awaits your orders. Remember: Stelara was not a subject but a FREE ALLY. Their betrayal risks encouraging others."*  
  - **Rules:**  
    - Students have 5 min to discuss. Interrupt: "Kyrnos’ custom requires swift justice!"  
    - Vote 1: *"Execute all adult men of Stelara? Enslave women and children?"*  
      - Public vote (hands raised). Chair counts visibly.  
    - **Manipulation:** If votes are split/lenient, say: *"Theron’s messenger reports Stelaran mobs cheered enemy ships. The crowd outside this chamber chants ‘Death to Traitors!’"*  
  - **Outcome:**  
    - Regardless of vote, announce: *"The motion CARRIES. A ship sails tonight with orders."*  
    - Give a student the **"Assembly Scroll"** (paper) with orders to "carry out the sentence."  

  **Phase 2: The Morning After (25 min)**  
  *Goal: Make reversal require costly individual action.*  
  - **New Info:** Distribute cards face-down:  
    - **10 WHITE:** "Citizen of Kyrnos. You feel uneasy. Last night’s vote was too harsh."  
    - **5 YELLOW:** "Stelaran Ambassador (secret). Your sources say: *Commoners were disarmed by oligarchs. They opened the gates to save Kyrnan lives.* Persuade citizens to reconsider!"  
    - **5 RED:** "Hardliner. Cleon’s faction. Argue: *Mercy looks weak. Revolts will spread if we relent!*"  
  - **Reversal Mechanic:**  
    - To reopen debate, a citizen must **STAND ALONE** and say: *"I move to reconsider the fate of Stelara."*  
    - Standing costs them: They must **sit on the floor** for the rest of the debate (social/physical discomfort).  
    - If no one stands after 3 min, announce: *"The Assembly upholds its decree. Stelara is destroyed."* Skip to debrief.  
  - **If Motion Moved:**  
    - Standing citizen argues first. Others debate freely (10 min).  
    - Yellow cards reveal their intel IF asked. Reds argue punishment deters revolts.  
  - **Vote 2:** Secret ballot (students write "YES" or "NO" on scrap paper to spare Stelara). Tally publicly.  

  **Phase 3: Contingency (5 min)**  
  *Goal: Show outcome hinges on luck, not virtue.*  
  - If Vote 2 *spares* Stelara:  
    - Announce: *"Your pardon ship races the first vessel. Will it arrive in time?"*  
    - Draw a card from a shuffled deck (red/yellow/white).  
      - **YELLOW:** *"Favorable winds! Your crew took bribes to row all night. They arrive JUST as the executions begin."*  
      - **RED/WHITE:** *"Headwinds delay you. Stelara is destroyed."*  
  - If Vote 2 *upholds* punishment: *"Theron reports: Sentence carried out. No further revolt in the Aegean this year."*  

  **Debrief (25 min)**  
  - **Reveal:** "This was Athens, 427 BCE: The Mytilene Debate."  
  - **Map Activity to History:**  
    | **Simulation Moment**       | **Mytilene (427)**               | **Sicily (415)**                | **Socrates (399)**          |  
    |-----------------------------|----------------------------------|---------------------------------|-----------------------------|  
    | **Standing to Reopen**      | Diodotus’ faction pressured prytaneis | Nikias failed; Alcibiades silenced | No procedure for retrial    |  
    | **Reversal Margin**         | Nearly tied vote                | Initial vote expanded expedition | 280-220 guilty verdict      |  
    | **Contingency**             | Second ship’s bribe/wind        | Recall of Alcibiades → chaos    | Hemlock delivered; no undo  |  
    | **Cost of Speaking**        | Social risk (you felt it!)      | Nikias executed in Sicily       | Socrates drinks hemlock     |  
  - **Key Discussion Prompts:**  
    1. *"What made it hard to stand? Who paid that cost in Athens?"*  
    2. *"Diodotus won by arguing advantage, not mercy. Did ‘justice’ matter here?"*  
    3. *"Athens had NO parties or representatives. How did that shape these votes?"* (Supply: Scale of 6,000+ citizens amplifies mob dynamics)  
    4. *"Why did reversal work here but fail in Sicily/Socrates?"* (Hint: Luck, courage threshold, no "undo" for executions)  

  ---

  ### **TIMELINE (Total: 75 min)**  
  - **0:00:** Introduce "Kyrnos," read Emergency Bulletin (3 min)  
  - **0:03:** Phase 1 discussion (5 min)  
  - **0:08:** Vote 1 (public hands) + announce decree (2 min)  
  - **0:10:** Phase 2: Distribute cards (2 min)  
  - **0:12:** Silent reading + stand-to-reconsider window (3 min)  
  - **0:15:** Debate if moved (10 min)  
  - **0:25:** Vote 2 (secret ballot) + tally (5 min)  
  - **0:30:** Phase 3: Contingency reveal (5 min)  
  - **0:35:** Debrief: Reveal Athens, map activity to cases (25 min)  

  ---

  ### **PREDICTABLE PROBLEMS & SOLUTIONS**  
  1. **"Students won’t vote for massacre in Round 1":**  
     - **Prevent:** Use time pressure ("Enemy fleets approach!"). Frame as *security necessity*, not morality.  
     - **If still soft:** Announce mid-debate: *"Rumor: Stelaran oligarchs mocked Kyrnos’ mercy in secret letters!"*  
     - **Last resort:** Rig Vote 1—say "majority carries" even if split. The reversal is the focus.  

  2. **"No one stands to reopen debate":**  
     - Yellow cards whisper: *"I heard commoners helped us... Shouldn’t we reconsider?"* during the 3-min window.  
     - If still stuck, say: *"An ambassador shoves a note at a citizen. It reads: ‘Innocent will die. SPEAK.’"*  

  3. **"Debate becomes moral, not strategic":**  
     - Redirect: *"Remember: Kyrnos faces existential war. What serves YOUR survival?"*  
     - Reward students who cite cards’ strategic arguments.  

  4. **"Second vote isn’t close":**  
     - Secret ballot prevents herd mentality.  
     - If lopsided, say: *"Athens’ vote was near-tie. Why might our group differ?"* (Discuss group size/homogeneity).  

  ---

  ### **WHAT THE SIMULATION CAN’T DO (Supply These Verbally)**  
  - **Scale:** "Athens had 6,000+ citizens. Your 20-person ‘Assembly’ misses the chaos/anonymity of mass bodies. Imagine the roar."  
  - **Stakes:** "Your ‘cost’ (sitting on the floor) is symbolic. For Athenians, speaking risked ostracism, lawsuits, or assassination."  
  - **Theater vs. Reality:** "You performed outrage. Athenians lived it—their empire’s collapse hinged on these votes."  
  - **Diodotus’ Calculation:** Point out: *"He didn’t argue ethics. He sold mercy as damage control. That’s how you won reversal—when justice and advantage aligned."*  

  **First Run Tip:** Assign a confident student a YELLOW card pre-simulation to ensure someone seeds reconsideration.  

  This design makes the bureaucracy of regret visceral. They’ll remember standing, sitting on the floor, and the card draw—then you anchor it to Athens’ fragile machinery of mercy.
