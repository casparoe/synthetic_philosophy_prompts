prompt: |-
  I run a small rationalist/EA meetup thing — 12ish people, mixed crowd (a couple of vegans, a few ex-vegans, a few who've never thought about food ethics, one person who works in ag policy), 90 minutes in a pub back room. I want a session on wild animal suffering that doesn't turn into the usual lecture, and I've been kicking around a mechanic. Call it the death ledger. Each table gets a deck of food cards, one card per way of getting 1000 kcal (pasture beef, feedlot beef, chicken, eggs, wheat, soy, whatever) and each card has two numbers: hectares of cropland per 1000 kcal and hectares of pasture per 1000 kcal. Tables plan one person's week off the cards and tally their land. Then I flip a second deck: a per-hectare wild-animal mortality card for each land type — cropland presumably kills alot of small stuff per hectare (mice, nests, birds, insects), pasture presumably kills less per hectare, though I have no idea by how much, and pasture beef takes an absurd amount of land per calorie. Total is cropland hectares times crop mortality plus pasture hectares times pasture mortality. What I want them to walk into is the moment their obviously-better card — the grass-fed one, the one the vegans in the room half-approve of — tops the death column, with cheap chicken somewhere in the contested middle and the wheat-and-soy plate not at zero either. Before I flip the second deck, each table writes down which card they think will win, so the reveal lands. I've been calling the underlying thing land-mediated death: harm that tracks how much land a food takes rather than how many animals you directly eat. Then a third flip, a card that just says nobody knows whether wild animals' lives are net positive or net negative, so nobody can say which direction the ledger should point — redo the ranking with the sign flipped and watch it scramble.

  Build it out: rules, materials, the numbers to print on the cards, timing for 90 minutes, debrief. Don't hand me real figures you can't back up — instead tell me the inequality the card values have to satisfy for the inversion to appear at all, and what the session becomes if that inequality fails, because I'm genuinely not sure the inversion is real and I'd rather the thing be honest than punchy. No lecture up front; field mortality, wild animal suffering, replaceability and all the rest only get named in the debrief. And the debrief should be straight with me about what this setup can't show — I already know it makes deaths commensurable by fiat and treats one person's weekly basket as if it seperate from the food system around it.

  Give it back as JSON with these fields: activity_name; setup (venue, group size, minutes); materials (array of physical things to print or bring); rounds (array of {round_number, minutes, what_participants_do, what_facilitator_does}); card_numbers (object giving the card values you'd use and the inequality they must satisfy); debrief_map (array of {moment_in_activity, idea_it_maps_to, one_sentence_version}); predictable_failures (array of {what_goes_wrong, how_to_handle}); cannot_reproduce (array of strings). Keep the prose inside the fields tight.
reasoning: |-
  We are designing an activity called the "Death Ledger" for a small group (12 people) in a 90-minute pub session. The goal is to explore wild animal suffering and land use without a lecture. The activity has three main phases: planning a week's diet (using food cards with land use data), tallying wild animal mortality based on land type, and then reconsidering with uncertainty about the sign (net positive or negative lives).

   Key constraints:
   - No lecture up front; concepts are introduced in debrief.
   - The inversion: We want grass-fed beef (high pasture land use) to potentially cause more deaths than, say, chicken or wheat, despite being perceived as more ethical by some. But we must be honest if the data doesn't support this.
   - We need to specify the inequality required for the inversion to occur and what if it fails.

   Structure in JSON as requested.

   Steps:

   1. Activity Name: "Death Ledger: A Food Impact Game"

   2. Setup:
      - Venue: Pub back room (tables for groups of 3-4 people, 12 people -> 3-4 groups)
      - Group Size: 12 people, divided into 3-4 groups (each group at a table)
      - Minutes: 90 total

   3. Materials (to print or bring):
      - Food Cards (one set per group): Each card represents a food source for 1000 kcal, with:
          - Name (e.g., "Pasture Beef", "Feedlot Beef", "Chicken", "Eggs", "Wheat", "Soy")
          - Hectares of cropland per 1000 kcal (crop_ha)
          - Hectares of pasture per 1000 kcal (pasture_ha)
      - Mortality Cards (one set per group): Each card for a land type (cropland, pasture) with:
          - Wild animal deaths per hectare per year (or per some time period? We need to normalize to the 1000 kcal basis)
      - Uncertainty Card (one per group): A card that says: "We don't know if wild animals' lives are net positive or negative. Flip the sign of the death tally and see what happens."
      - Worksheets for each group to record their plan, predictions, and tallies.
      - Pens or markers.

   4. Rounds:

      Round 1: Planning the Diet (20 minutes)
        - What participants do: Each group selects food cards to plan one person's week (7000 kcal total). They must use exactly 7 cards (each card = 1000 kcal). They record the total cropland and pasture hectares.
        - What facilitator does: Distributes food cards, explains the task (without mentioning mortality), circulates to answer questions.

      Round 2: Mortality Tally (15 minutes)
        - What participants do: Groups receive mortality cards (one for cropland, one for pasture). They calculate:
            Total deaths = (total crop_ha * crop_deaths_per_ha) + (total pasture_ha * pasture_deaths_per_ha)
          They write down which food card they think caused the most deaths (before doing the calculation) and then do the tally. They record the result.
        - What facilitator does: Distributes mortality cards, instructs groups to predict and then calculate.

      Round 3: Sign Uncertainty (10 minutes)
        - What participants do: Groups are given the uncertainty card. They recalculate the total deaths with the sign flipped (i.e., negative deaths become positive and vice versa) and then re-rank the food cards based on this new "benefit" tally (if negative deaths become positive, then the most negative becomes the most beneficial). They discuss the shift.
        - What facilitator does: Distributes the uncertainty card, instructs groups to flip the sign and recalculate.

      Round 4: Debrief (45 minutes) - This is the main discussion.

   5. Card Numbers:

      We need to choose numbers that might create the inversion. Let:

        Let F be a food card with:
          crop_ha_f: cropland hectares for 1000 kcal of F
          pasture_ha_f: pasture hectares for 1000 kcal of F

        Let:
          D_crop: deaths per hectare per year on cropland
          D_pasture: deaths per hectare per year on pasture

        Total deaths for F (for 1000 kcal) = (crop_ha_f * D_crop) + (pasture_ha_f * D_pasture)

      We want, for example:
        Grass-fed beef (high pasture_ha, low crop_ha) to have higher total deaths than chicken (which might have moderate crop_ha and low pasture_ha) and also higher than wheat (which has crop_ha but no pasture_ha).

      But note: In the activity, groups are building a week (7000 kcal) by combining 7 cards. However, the inversion should be apparent per 1000 kcal if we design the cards right.

      We'll assign numbers per 1000 kcal. The inequality we require is:

        For grass-fed beef (G) vs. wheat (W):

          Total deaths (G) > Total deaths (W)

          => [crop_ha_G * D_crop + pasture_ha_G * D_pasture] > [crop_ha_W * D_crop + pasture_ha_W * D_pasture]

          But pasture_ha_W = 0, and crop_ha_G might be very low (or zero) for pure grass-fed.

          So: (crop_ha_G * D_crop) + (pasture_ha_G * D_pasture) > (crop_ha_W * D_crop)

        Similarly, we might want grass-fed beef to be worse than chicken (C):

          (crop_ha_G * D_crop + pasture_ha_G * D_pasture) > (crop_ha_C * D_crop + pasture_ha_C * D_pasture)

      Known facts (from EA/literature):
        - Pasture beef requires a lot more land per calorie than feedlot beef or chicken.
        - Cropland generally has higher animal mortality per hectare than pasture (because of machinery, pesticides, etc.), but pasture land is often much larger.

      Let's define the numbers per 1000 kcal (based on rough estimates, but we must be clear these are illustrative and for the purpose of the activity):

        Sources:
          - Land use: 
            * Beef (pasture): about 100 m² per 1000 kcal? Actually, let's use more standard figures. 
            * A common figure: beef requires 20 times more land than chicken and 160 times more than grains (Poore & Nemecek, 2018). 
            * We'll use:

            Food          | crop_ha (per 1000 kcal) | pasture_ha (per 1000 kcal)
            ---------------------------------------------------------------
            Pasture Beef  | 0 (or very low)         | 0.05 (this is 500 m²? Let's check: 1000 kcal of beef requires about 50-200 m²? Actually, let's scale appropriately.)

        We need to normalize: 1 hectare = 10,000 m².

        According to Poore & Nemecek (2018) via Our World in Data:
          - Beef (beef herd, i.e., pasture): 164.8 m² per 100 kcal -> so 1648 m² per 1000 kcal -> 0.1648 ha per 1000 kcal? That seems too high. Wait, let me check:

          Actually, the data is often per 100g protein. Let me convert to per 1000 kcal.

          From https://ourworldindata.org/land-use-diets:
            - Beef uses 164.8 m² *year* per 100g protein. But we need per kcal.

          Alternatively, from https://ourworldindata.org/environmental-impacts-of-food:
            - Land use per 1000 kcal (in m² per 1000 kcal):
              Beef (beef herd): 92.4 m²
              Beef (dairy herd): 33.3 m²
              Lamb: 58.3 m²
              Pork: 8.9 m²
              Chicken: 7.1 m²
              Eggs: 6.3 m²
              Rice: 2.8 m²
              Wheat: 2.5 m²

          Wait, that doesn't make sense because pasture is not included? Actually, the data is total land (cropland + pasture). So we need to split.

          From the same source, they have a breakdown for beef (beef herd): 
            - 100% of the land is pasture (no cropland).

          So for our cards:

            Pasture Beef: crop_ha = 0, pasture_ha = 92.4 / 10000 = 0.00924 ha per 1000 kcal? 
            But note: 92.4 m² = 0.00924 ha.

          However, let's make the numbers easier to handle. We can scale by 1000 to avoid decimals? But then the death rates per hectare would be huge. Alternatively, we can express land in m² and then mortality per m²? But the activity uses hectares. Let's stick to hectares but adjust the numbers to be per 1000 kcal and use decimal hectares.

          Proposed food cards (per 1000 kcal):

            Food          | crop_ha (hectares) | pasture_ha (hectares)
            -----------------------------------------------------------
            Pasture Beef  | 0.0                | 0.0092
            Feedlot Beef  | 0.0015             | 0.002   [made up: feedlot uses less pasture but some cropland for feed]
            Chicken       | 0.0007             | 0.0001  [or 0? chicken might use a little pasture? but typically industrial is all cropland]
            Eggs          | 0.0006             | 0.0001
            Wheat         | 0.00025            | 0.0
            Soy           | 0.0002             | 0.0

          But note: the land for chicken and eggs includes the land for feed (which is cropland). So we set pasture_ha to 0 for these? Actually, some free-range might have pasture, but for standard industrial, it's negligible.

          We want pasture beef to have the highest land use. So:

            Pasture Beef: 0.0092 ha (all pasture)
            Feedlot Beef: less total land? According to data, beef herd (pasture) uses more land than dairy herd or feedlot. Let's set:

            Feedlot Beef: total land = 0.0035 ha (split as 0.0015 crop and 0.002 pasture) -> but actually, feedlot beef may use mostly cropland for feed and very little pasture. Let's check:

            From Our World in Data: 
              - Beef (dairy herd) uses 33.3 m² per 1000 kcal -> 0.00333 ha. We can set that as feedlot? But they don't break down. 

            We'll set:
              Feedlot Beef: crop_ha = 0.003, pasture_ha = 0.0005 (so total 0.0035 ha)

          Now mortality:

            We need D_crop and D_pasture (deaths per hectare per year).

            According to some EA sources, cropland may cause 1 to 15 deaths per hectare per year? But this is highly uncertain and varies.

            We want the inversion: so we need:

              For Pasture Beef: (0 * D_crop) + (0.0092 * D_pasture) = 0.0092 * D_pasture
              For Wheat: (0.00025 * D_crop) + (0) = 0.00025 * D_crop

              We require: 0.0092 * D_pasture > 0.00025 * D_crop   => D_pasture > (0.00025 / 0.0092) * D_crop ≈ 0.027 * D_crop

            This is almost always true because D_crop is likely higher than D_pasture, but even if D_pasture is only 2.7% of D_crop, pasture beef would still have more deaths. But note: D_pasture might be much lower than D_crop? 

            Also, for chicken:

              Chicken: (0.0007 * D_crop) + (0.0001 * D_pasture)

              We want pasture beef > chicken:

                0.0092 * D_pasture > 0.0007 * D_crop + 0.0001 * D_pasture

                => (0.0092 - 0.0001) * D_pasture > 0.0007 * D_crop

                => 0.0091 * D_pasture > 0.0007 * D_crop

                => D_pasture > (0.0007 / 0.0091) * D_crop ≈ 0.077 * D_crop

            This is also likely true if D_crop is not orders of magnitude higher than D_pasture? But we don't know.

            However, if we set:

              D_crop = 10 deaths per hectare per year
              D_pasture = 1 death per hectare per year

            Then:
              Pasture Beef: 0.0092 * 1 = 0.0092 deaths
              Wheat: 0.00025 * 10 = 0.0025 deaths
              Chicken: 0.0007*10 + 0.0001*1 = 0.007 + 0.0001 = 0.0071 deaths

            Then pasture beef (0.0092) > chicken (0.0071) > wheat (0.0025) -> inversion: beef is worst.

            But if D_pasture is 0.5 and D_crop is 20:

              Pasture Beef: 0.0092 * 0.5 = 0.0046
              Wheat: 0.00025 * 20 = 0.005
              Then wheat > beef -> no inversion.

          So the inequality we require for the inversion (beef > wheat and beef > chicken) is:

            Condition 1 (beef > wheat): 
              0.0092 * D_pasture > 0.00025 * D_crop   => D_pasture > (0.00025/0.0092) * D_crop ≈ 0.027 * D_crop

            Condition 2 (beef > chicken):
              0.0092 * D_pasture > 0.0007 * D_crop + 0.0001 * D_pasture   => D_pasture > (0.0007 / (0.0092-0.0001)) * D_crop ≈ 0.077 * D_crop

          Since condition 2 is stronger, we require D_pasture > 0.077 * D_crop.

          In the debrief, we must be clear that the actual numbers are uncertain and the inversion might not hold in reality.

      Proposed numbers for the cards (per 1000 kcal) - for the activity, we'll use:

          Food Card Values (hectares per 1000 kcal):

            Pasture Beef:  { crop_ha: 0,     pasture_ha: 0.0092 }
            Feedlot Beef:  { crop_ha: 0.003, pasture_ha: 0.0005 }   # total 0.0035
            Chicken:       { crop_ha: 0.0007, pasture_ha: 0 }       # total 0.0007
            Eggs:          { crop_ha: 0.0006, pasture_ha: 0 }       # total 0.0006
            Wheat:         { crop_ha: 0.00025, pasture_ha: 0 }      # total 0.00025
            Soy:           { crop_ha: 0.0002, pasture_ha: 0 }       # total 0.0002

          Mortality Card Values (deaths per hectare per year):

            Cropland: 10
            Pasture: 1

          Why these numbers? They satisfy the inversion condition (0.0092 * 1 = 0.0092 > 0.0007*10=0.007 for chicken and 0.00025*10=0.0025 for wheat). But note: if we change the mortality numbers, the inversion may disappear.

          Alternatively, to make the inversion more dramatic, we could increase the pasture land for beef or decrease the mortality for cropland? But we want to be plausible.

          We'll use these in the activity, but in the debrief, we note the uncertainty.

   6. Debrief Map: We link moments in the activity to ideas.

      Array of: moment_in_activity, idea_it_maps_to, one_sentence_version

      Example:
        - Moment: "Groups see that pasture beef caused the most deaths"
          Idea: "Land use efficiency matters for reducing wild animal suffering"
          Sentence: "Foods with high land use, even if they don't directly kill animals, may cause more harm through habitat conversion and farming practices."

        - Moment: "The sign flip changes which foods seem best"
          Idea: "Uncertainty about the welfare of wild animals complicates ethical choices"
          Sentence: "Without knowing whether wild animals have net positive or negative lives, we cannot know whether reducing their numbers is good or bad."

   7. Predictable Failures:

      - What goes wrong: The groups don't see the inversion (because the numbers we chose don't hold in reality, or because of the way they built the diet).
      - How to handle: In the debrief, acknowledge that the data is highly uncertain and the inversion might not always hold. Focus on the concept: land use as a driver of harm, and the uncertainty.

      - What goes wrong: Participants get stuck on the arbitrariness of the numbers.
      - How to handle: Emphasize that the numbers are illustrative and the goal is to understand the mechanism.

   8. Cannot Reproduce:

      - The activity simplifies by assuming deaths are linear in land area and that one person's diet is isolated.
      - It assumes that the deaths per hectare are constant and known, which is not true.
      - It ignores the fact that different types of animals are killed and their capacity for suffering may vary.
      - It does not account for the fact that some land uses might create habitats that are net positive (e.g., some cropland might support more animals than natural habitat, but with worse lives?).

   Now, we output in JSON.
