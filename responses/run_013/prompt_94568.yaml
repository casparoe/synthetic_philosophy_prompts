answer: |-
  Here's the translation and residue analysis, structured as requested. I'll map philosophical accounts of valid consent to your contract law doctrines, flagging misfits and explaining where the philosophical substance survives, gets distorted, or vanishes entirely.

  ---

  ### I. Translation: Philosophical Accounts in Contract Law Vocabulary

  1.  **The Triad: Competence, Information, Voluntariness**
      *   **Philosophy:** Valid consent requires (a) Capacity/Competence (ability to understand and decide), (b) Adequate Information (understanding material facts), (c) Voluntariness (free from undue pressure/coercion).
      *   **Translation:**
          *   *Competence:* **Capacity.** Direct match. Minors, mentally incapacitated persons lack contractual capacity (voidable contract). Law focuses on the *legal status or objective manifestation* of incapacity, not the nuanced internal mental state philosophy might probe.
          *   *Adequate Information:* Primarily **Fraudulent Misrepresentation** (knowing false statement of material fact inducing reliance) and **Negligent Misrepresentation** (in some jurisdictions, for professionals). Crucial misfit: Philosophy's broad "adequate information" is largely *reduced to the absence of affirmative misrepresentation* in standard contracts. **Duty to Disclose** exists only in narrow exceptions: fiduciary relationships, partial/tricky disclosures, or specific statutes (e.g., securities, some consumer). *Non-disclosure* is generally *not* fatal to consent in contract law absent these exceptions, unlike philosophy's emphasis.
          *   *Voluntariness:* **Duress** (improper threat inducing reasonable fear leaving no reasonable alternative) and **Undue Influence** (unfair persuasion exploiting a relationship of trust/dominance). **Unconscionability** (procedural - unfair surprise/oppression in formation; substantive - overly harsh/shocking terms) also captures severe voluntariness defects. Philosophy's broader concept of "undue pressure" is constrained by legal baselines and reasonableness standards.

  2.  **Coercion & The Baseline Problem**
      *   **Philosophy:** Turns on distinguishing threats (which coerce) from offers (which don't). A "threat" involves worsening someone's position relative to a morally justified baseline. Debates rage over defining that baseline (moral entitlements vs. status quo).
      *   **Translation:**
          *   **Duress** is the direct counterpart. Law *explicitly* uses a baseline: the *legal entitlements* of the threatened party. A threat to do something you have a *legal right* to do (e.g., sue for a debt, terminate a contract) is generally **not duress** – it's a "hard bargain" or permissible pressure. A threat to do something *illegal* or *wrongful* (e.g., commit a tort, breach a duty) *can* be duress if it induces reasonable fear and leaves no reasonable alternative. The key misfit: Law's baseline is **legal entitlement**, philosophy often debates a **moral entitlement** baseline. Law asks "Can I legally do this?" not "Ought I morally do this?".

  3.  **Deception & Non-Disclosure**
      *   **Philosophy:** Focuses on deception undermining understanding, including lies (*misrepresentation*) and failures to disclose material information (*non-disclosure*). Non-disclosure is often seen as equally problematic when there's a duty to inform.
      *   **Translation:**
          *   *Deception (Misrepresentation):* **Fraudulent Misrepresentation, Negligent Misrepresentation.** Direct match for affirmative lies/material half-truths.
          *   *Non-Disclosure:* **Duty to Disclose.** As above, this is the *major misfit*. Contract law imposes no general duty to disclose material facts. Silence is not misrepresentation absent specific contexts (fiduciary, uberrimae fidei, partial disclosure creating misleading impression, known mistake by other party). Philosophy's concern about information asymmetry vitiating consent is largely *absent* in standard contract formation, except where fraud or a narrow disclosure duty applies. "Mistake" doctrines (mutual vs. unilateral) sometimes overlap, but usually require the mistake to be fundamental/basic assumption and often mutual for rescission.

  4.  **The Nature of Consent & Why Its Absence is Wrong**
      *   **Philosophy Views:**
          *   *Mental State:* Consent is an internal attitude (desire, willingness).
          *   *Performative Act:* Consent is a communicative act (words/signs) that changes normative relationships.
          *   *Transfer of Permission:* Consent transfers a normative power/right from one person to another.
          *   *Why Wrong?* Violates autonomy, uses someone merely as a means, infringes rights, causes harm.
      *   **Translation:**
          *   *Mental State:* **Objectively Rejected.** Contract law operates under the **Objective Theory of Assent.** What matters is the *manifestation* of assent (words, conduct) as reasonably interpreted by the other party, *not* the internal, subjective mental state. A secretly unwilling party who signs is still bound. This view has *no home* in contract law.
          *   *Performative Act:* **Offer and Acceptance (Objective).** This is the *core* legal model. Consent is constituted by the *externally observable acts* of offer and acceptance, interpreted objectively. The "normative change" is the creation of enforceable obligations.
          *   *Transfer of Permission:* **Partial Fit with Bargain Theory.** Contract law views consent in formation as creating *mutual, bargained-for obligations*, not primarily as transferring a pre-existing permission (though property transfers within contracts involve this). The "wrong" is less about violating a sphere of permission and more about **enforcing an obligation that wasn't truly bargained for due to a defect in formation** (fraud, duress, incapacity). The wrong enables unjust enrichment or harmful reliance.
          *   *Why Wrong?* Law focuses on the **procedural defects in formation** (fraud, duress, etc.) and the **unjust outcome** (unconscionability, lack of consideration/gift vs. bargain) as justifying non-enforcement. Autonomy is an underlying principle, but the legal wrong is defined by specific doctrines, not a general "autonomy violation". Using someone "merely as a means" isn't a direct legal test.

  ---

  ### II. The Residue: What Doesn't Map Cleanly

  1.  **Survives Cleanly:**
      *   **Capacity/Competence:** The core concept translates directly.
      *   **Affirmative Misrepresentation (Lies):** Fraudulent misrepresentation is a direct, clean match.
      *   **Coercion via Illegal Threats:** The core case of duress (threat of illegal act) maps cleanly, *using the legal entitlement baseline.*
      *   **Performative Act Model:** Offer and Acceptance, interpreted objectively, *is* the performative act model of consent in action.

  2.  **Survives via Distortion/Import:**
      *   **Coercion Baselines (The "Hard Bargain"):** The *structure* of the problem is identical (threat vs. offer, baseline dependency). However, law imports its *specific, institutional baseline: legal entitlements*. Philosophy's moral entitlement baseline is *foreign* to contract law and quietly replaced. Your hunch is correct: lawyers and ethicists are structurally doing the same analysis here, but using fundamentally different baseline criteria (legal vs. moral).
      *   **Voluntariness (Beyond Core Duress/Undue Influence):** Philosophy's broader concern about subtle pressures, exploitation of vulnerability, or lack of meaningful choice is partially captured by **undue influence** and **procedural unconscionability**, but these require specific, often extreme, factual showings (relationships of dominance, shocking bargaining conduct). Much philosophical concern about lesser pressures or structural inequalities has *no direct doctrinal home* and is often filtered out by the "reasonable person" standard in duress or the high bar of unconscionability.
      *   **Non-Disclosure:** Only survives in the *distorted, narrow form* of the **duty to disclose**, which requires importing specific relationship types (fiduciary) or factual circumstances (active concealment, known mistake, half-truths) that are *exceptions* to the general rule of *caveat emptor*. Philosophy's general ethical concern about information asymmetry vitiating consent is largely *absent* from standard contract formation doctrine.

  3.  **Has No Counterpart:**
      *   **Mental State View:** Utterly rejected by the **Objective Theory of Assent**. Contract law deliberately refuses to look inward. The law binds the secret resenter.
      *   **Transfer of Permission (as primary model):** Contract law is fundamentally about *bargained-for exchange creating mutual obligations*, not just transferring a pre-existing right/permission. The distinction between a **bargain** and a **gift** highlights this; gifts involve permission transfer but lack consideration and aren't enforced as contracts. The "transfer" view doesn't capture the *mutual obligation* essence of contract.
      *   **Why Wrong? (Autonomy as Direct Cause of Action):** While autonomy underpins contract law, there is *no* doctrine allowing a party to avoid a contract simply because their autonomy was infringed in a way not captured by fraud, duress, etc. The wrong is defined by the *specific vitiating factors*, not a general autonomy violation.

  ---

  ### III. The Complication: Acts (Battery/Medical Consent) vs. Terms (Contracts)

  *   **The Switch Changes Everything:** You are absolutely right. **Informed consent in medicine (battery/negligence) is fundamentally different from consent in contract formation.**
  *   **Translation Distortion:**
      *   **Duty Focus:** Medical consent centers on the **doctor's fiduciary duty to disclose** material risks (based on professional standards *or* patient needs, depending on jurisdiction). The "wrong" is the *breach of duty*, potentially making the *act* (surgery) a battery (unauthorized touching) or negligence (breach of standard of care). Contract formation focuses on defects in the *parties' mutual assent process*.
      *   **Causation:** In medical negligence, the patient must often show that *adequate disclosure would have led them to refuse*. This injects a *hypothetical subjective mental state* element that contract law's objective theory deliberately avoids. Battery is stricter: lack of disclosure = lack of authorization = battery.
      *   **"Consent" Itself:** In battery law, consent *is* primarily an authorization for a specific physical act, closer to the "transfer of permission" view. It's not about creating mutual obligations. The medical negligence version blends this with a duty-based, risk-disclosure model. Neither maps well onto contract's bargain-for-obligations model.
  *   **Conclusion:** Philosophical consent theories often fit *better* with the vocabulary of battery/torts (authorization, permission, bodily integrity) or medical negligence (duty to inform, reliance on disclosure) than with contract law. Contract law's "consent" is a specialized, objective, obligation-creating mechanism, distinct from consent to physical intrusion. Your suspicion that medical "informed consent" isn't the same *kind* of consent as contract formation consent is correct.

  ---

  ### IV. Which Side Has the Problem?

  *   **Residue as Problem for Philosophy? (Mostly Yes - Your Second Suspicion):** When philosophical claims vanish (mental state) or are distorted (non-disclosure, broad voluntariness), it's usually because **contract law is a precise, institutional tool with specific purposes.** It prioritizes security of transactions, predictable enforcement, and clear rules over probing the full ethical quality of individual will or perfect information symmetry. The law's precision exposes philosophical concepts that are:
      *   *Too Subjective:* (Mental state view) - Unworkable in an adversarial system needing objective evidence.
      *   *Too Vague/Broad:* (General "voluntariness," moral baselines, general duty to disclose) - Lack the definable boundaries needed for predictable legal rules.
      *   *Mismatched to Purpose:* (Transfer of permission as core) - Doesn't capture the mutual obligation creation that is contract's raison d'être.
  *   **Residue as Problem for Law? (Limited - Your "One Exception"):**
      *   **The Baseline Problem:** This *is* a genuine point of contact. Law relies on its *legal entitlement* baseline for duress. This is functional but can feel ethically unsatisfying (e.g., exploiting desperation by threatening lawful acts). Philosophy highlights that the *choice* of baseline is morally loaded. Law implicitly makes a choice (legal status quo) but rarely acknowledges the moral contestability of that choice. Here, philosophy exposes a potential blind spot or value judgment embedded in the legal rule.
      *   **Information Asymmetry:** While *caveat emptor* is efficient for many transactions, the *complete lack* of a general disclosure duty means contract law tolerates consent based on profound ignorance in situations philosophy would deem invalid. Whether this is a "problem" depends on one's view of the law's goals (efficiency vs. perfect fairness). It highlights that contract law deliberately sacrifices some philosophical ideals of informed consent for other values.
      *   **Structural Inequality:** Doctrines like unconscionability are blunt tools for addressing vast power imbalances. Philosophy's deeper concerns about exploitation in contexts of systemic vulnerability often exceed contract law's capacity to remedy.

  **Conclusion:** Your hunches are largely correct. The translation exposes philosophy's mental-state focus and broader ideals of voluntariness/information as incompatible with contract law's objective, institutional formalism. The fit is worst for mental states and non-disclosure. The baseline problem is indeed the key point of unrecognized similarity-in-structure (threat vs. offer) with a critical difference (moral vs. legal baseline). The switch to battery/medical consent vocabulary reveals that "consent" operates differently across legal domains, with medical consent aligning better with some philosophical views (duty, permission transfer) than contract does. The residue primarily reveals philosophy's lack of precision or misalignment with law's institutional needs, *except* for the baseline issue, where philosophy usefully spotlights a morally loaded assumption within the legal doctrine.
