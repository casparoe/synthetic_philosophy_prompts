  Medical informed consent introduces a complication. The user notes it's a duty-based tort concept (battery, negligence) rather than a contract issue. This matters because contract law's "duty to disclose" is narrow (fiduciary/uberrimae fidei), while medical consent is broader. I should explain why this makes philosophical consent theories fit better in tort than contract.

  For the residue analysis: Mental-state views get filtered out entirely by objective assent doctrine. Voluntariness beyond duress/unconscionability has no home. Information deficits only matter in specific legal contexts (fraud, fiduciary duties), unlike philosophy's broader concerns. The "transfer of permission" concept is alien to contract law's focus on bargained-for exchange.

