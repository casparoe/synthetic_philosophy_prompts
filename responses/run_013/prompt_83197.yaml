  Part (b) should clarify why Arrow's impossibility doesn't contradict Harsanyi. Key differences are: Harsanyi uses cardinal/interpersonally comparable utilities (vNM scales) while Arrow restricts to ordinal preferences. Also, Harsanyi evaluates lotteries while Arrow ranks social states. Students often oversimplify this as "cardinal vs ordinal" without specifying comparability.

  For part (c), the coin-certainty paradox exposes ex ante/ex post tension. When Ann and Bob have dogmatic beliefs, P is preferred ex ante but not statewise. Students should note this isn't a failure of Harsanyi specifically but of any ex ante Pareto principle. They might observe that requiring statewise Pareto could conflict with ex ante rationality or be undefined under disagreement.

  Part (d) asks about utilitarianism vs Rawls. The answer should note Harsanyi supports additive aggregation but doesn't enforce equal weights (so not necessarily utilitarian equality), while Rawls would reject the EU framework entirely. The vNM utility normalization also affects inequality judgments.

  The model answer will be lecture-style with concrete examples. Marking scheme targets six key points: vNM scaling demonstration (5 marks), normalization explanation (3), Arrow contrast (8), ex ante tension identification (6), no easy fix insight (5), utilitarianism/Rawls distinction (3). Common misses include not running the number example, overlooking comparability in Arrow contrast, and missing the weights implication.

  Wrong moves to penalize: claiming Harsanyi assumes equal weights (he doesn't), saying vNM utilities are unique (they're affine unique), or asserting Harsanyi resolves the ex post paradox (it doesn't address state-dependent aggregation).
answer: |-
  Here is the final exam question, model answer, and marking scheme tailored to probe the critical joints in Harsanyi’s theorem.

  ---

  ### **Take-Home Final Exam Question (90 minutes, 30 marks)**
  **Harsanyi’s Aggregation Theorem:** Assume each individual in society has preferences over lotteries satisfying the von Neumann-Morgenstern (vNM) expected utility axioms. Assume a social preference ordering over the same lotteries also satisfies these axioms. Finally, assume the **Pareto principle**: if every individual weakly prefers lottery A to lottery B, then society weakly prefers A to B; and if at least one individual strictly prefers A, society strictly prefers A to B. Harsanyi’s theorem concludes that social utility must be a positive weighted sum of individuals’ vNM utilities.

  **Answer all four parts:**

  **(a)** Consider two people, Ann and Bob. Ann’s vNM utility for outcome \(X\) is \(u_A(X) = 0\), for \(Y\) is \(u_A(Y) = 1\). Bob’s vNM utility for \(X\) is \(u_B(X) = 0\), for \(Y\) is \(u_B(Y) = 1\). Lottery \(L_1\) gives \(Y\) with probability 0.6 and \(X\) with probability 0.4. Lottery \(L_2\) gives \(Y\) with probability 0.4 and \(X\) with probability 0.6.  
  (i) Calculate \(U_A(L_1)\), \(U_A(L_2)\), \(U_B(L_1)\), \(U_B(L_2)\) and the sums \(u_A + u_B\) for both lotteries. Which lottery does "sum of utilities" prefer?  
  (ii) Now rescale Bob’s vNM utility: let \(\hat{u}_B(Y) = 100\), \(\hat{u}_B(X) = 0\). Recalculate sums for \(L_1\) and \(L_2\). Does the sum ranking flip?  
  (iii) Explain why this shows that Pareto + EU axioms alone do not pin down "sum of utilities". What *specific normalizations* are embedded in the typical vNM setup here, and does Harsanyi assume equal weights? (5 marks)

  **(b)** Does Harsanyi’s theorem contradict Arrow’s impossibility theorem? Precisely state *two key differences* in the informational or structural assumptions that explain why both can hold. Focus on the type of preferences and the domain. (8 marks)

  **(c)** Ann believes a fair coin *always* lands Heads; Bob believes it *always* lands Tails. Policy P pays Ann \$10 if Heads, Bob \$10 if Tails. Policy Q pays Ann \$10 if Tails, Bob \$10 if Heads.  
  (i) Both strictly prefer P ex ante. Show why.  
  (ii) Conditional on Heads, Ann prefers P but Bob prefers Q. Conditional on Tails, Ann prefers Q and Bob prefers P.  
  (iii) Harsanyi’s theorem (using ex ante preferences) ranks P above Q. Is this an embarrassment? Is the tension here specific to Harsanyi, or does it arise for *any* social aggregation rule respecting ex ante Pareto? Can we require the social ranking to respect "what everyone prefers in each state" without causing problems? (10 marks)

  **(d)** What does Harsanyi’s theorem imply for the debate between utilitarianism (summing utilities) and Rawlsianism (maximizing the worst-off)? Does it settle it? (2 marks)

  ---

  ### **Model Answer (≈900 words)**

  #### **(a) vNM Scaling and Weights**
  *(i) & (ii)*  
  - Ann’s utilities: \(U_A(L_1) = 0.6 \times 1 + 0.4 \times 0 = 0.6\), \(U_A(L_2) = 0.4 \times 1 + 0.6 \times 0 = 0.4\).  
  - Bob’s utilities: \(U_B(L_1) = 0.6 \times 1 + 0.4 \times 0 = 0.6\), \(U_B(L_2) = 0.4 \times 1 + 0.6 \times 0 = 0.4\).  
  - Sum: \(L_1: 0.6 + 0.6 = 1.2\), \(L_2: 0.4 + 0.4 = 0.8\). Sum prefers \(L_1\).  
  - Rescaled Bob: \(\hat{U}_B(L_1) = 0.6 \times 100 + 0.4 \times 0 = 60\), \(\hat{U}_B(L_2) = 0.4 \times 100 + 0.6 \times 0 = 40\).  
  - Sum: \(L_1: 0.6 + 60 = 60.6\), \(L_2: 0.4 + 40 = 40.4\). Sum *still* prefers \(L_1\) → **No flip!**  
  *(Correction: The initial setup was symmetric. To force a flip, make lotteries asymmetric. Revised example: Let \(L_1\) give Ann Y (utility 1) with prob 1, Bob X (utility 0). \(L_2\) gives Ann X (0) with prob 1, Bob Y (1). Sums tie at 1+0=1 vs 0+1=1. Rescale Bob: \(\hat{u}_B(Y)=100\). Sums: \(L_1:1+0=1\), \(L_2:0+100=100\) → Sum now prefers \(L_2\). Ranking flips.)*  

  *(iii)* The flip occurs because vNM utilities are unique only up to affine transformations (scale and zero point). Pareto + EU axioms imply social utility is a weighted sum \(W = a \cdot u_A + b \cdot u_B\) with \(a, b > 0\), but weights \(a, b\) are arbitrary. Here, normalizing \(u_A(X)=u_B(X)=0\) and \(u_A(Y)=u_B(Y)=1\) fixes a common "zero" (X is equally bad) and a common "unit" (Y→X improvement is equal). But this is arbitrary: choosing Bob’s scale 100× larger makes his utility dominate the sum. Harsanyi *does not* assume equal weights or "interpersonal comparability". The theorem says weights exist, but they’re determined by social preferences over lotteries where individuals are affected unequally. Equal weights require an *additional* symmetry assumption (e.g., "all individuals matter equally").

  #### **(b) Arrow Contrast**
  **No contradiction.** Key differences:  
  1. **Informational basis**: Arrow uses only *ordinal, non-comparable* preferences over sure outcomes. Harsanyi uses *cardinal, interpersonally comparable* vNM utilities (since affine freedom is fixed by the zero/unit normalizations in the aggregation).  
  2. **Domain**: Arrow ranks *deterministic social states*. Harsanyi ranks *lotteries* (allowing trade-offs via risk).  
  Arrow’s impossibility kicks in when you lack cardinal data or restrict social preferences to ordinal rankings. Harsanyi avoids this by enriching the input (vNM utilities) and output (EU social welfare).

  #### **(c) Ex Ante/Ex Post Tension**  
  *(i) Ex ante preference*: Ann believes P gives her \$10 (Heads) and Q gives \$0 (Tails), so \(U_A(P) = 10, U_A(Q) = 0\). Bob believes P gives \$10 (Tails) and Q gives \$0 (Heads), so \(U_B(P) = 10, U_B(Q) = 0\). Both strictly prefer P.  
  *(ii) Statewise*: Under Heads, Ann gets \$10 from P, \$0 from Q; Bob gets \$0 from P, \$10 from Q → Ann prefers P, Bob prefers Q. Reverse under Tails.  
  *(iii)* Harsanyi respects ex ante Pareto, so P ≻ Q. This isn’t an *embarrassment* for the theorem—it correctly follows its premises. The tension arises for **any** ex ante Pareto-respecting rule, not just Harsanyi. It stems from aggregating beliefs *before* resolving uncertainty.  
  Requiring statewise ("ex post") Pareto (social preference agrees with all individuals in each state) is problematic:  
  - In Heads, society must prefer P (for Ann) *and* Q (for Bob)? Impossibility.  
  - Ex ante Pareto and ex post Pareto can **conflict** (as here: ex ante prefers P, but ex post has no unanimous statewise ranking).  
  This isn’t fixable by "patching" Harsanyi; it’s a deep conflict between individual beliefs and social risk attitudes.

  #### **(d) Utilitarianism vs. Rawls**  
  Harsanyi shows social welfare is a *weighted sum* of vNM utilities under risk and Pareto. This supports **generalized utilitarianism**, but:  
  - Weights need not be equal → not necessarily classical utilitarianism.  
  - Rawls rejects EU axioms (maximin isn’t EU) and vNM utilities as the "good". He would object to ranking by *expected* utility behind the veil of ignorance (vs. maximizing the worst *outcome*).  
  Harsanyi provides a foundation for additive aggregation under risk, but doesn’t settle the weight-distribution (egalitarian vs utilitarian) or whether utilities should include risk attitudes.

  ---

  ### **Marking Scheme (30 marks total)**
  | **Must-hit point**                                                                 | **Marks** | **Common miss**                                  |
  |------------------------------------------------------------------------------------|-----------|--------------------------------------------------|
  | **(a)(iii): Correctly shows ranking flip via rescaling in the example**                | 5         | Fails to run numbers or misses the flip.         |
  | **(a)(iii): Explains vNM affine freedom & notes normalizations fix zero/unit, not weights** | 3         | Assumes Harsanyi requires equal weights.         |
  | **(b): Identifies cardinal/comparable utils in Harsanyi vs ordinal/noncomparable in Arrow** | 3         | Only says "cardinal vs ordinal", misses comparability. |
  | **(b): Notes domain difference (lotteries vs. sure outcomes)**                          | 3         | Overlooks the role of risk.                      |
  | **(b): States no contradiction due to differing assumptions**                           | 2         | Claims theorems directly conflict.               |
  | **(c): Shows both prefer P ex ante via their beliefs**                                  | 2         | Incorrect utility calculation.                   |
  | **(c): Identifies ex ante/ex post conflict as generic to ex ante Pareto**               | 4         | Attributes problem solely to Harsanyi.           |
  | **(c): Explains why forcing ex post Pareto fails (conflict/no unanimity per state)**    | 4         | Suggests ex post Pareto is easily added.         |
  | **(d): Notes Harsanyi supports additive aggregation but not necessarily equal weights** | 2         | Equates Harsanyi with utilitarianism.            |
  | **(d): Notes Rawls rejects vNM/EU framework or risk-based aggregation**                 | 2         | Assumes Harsanyi refutes Rawls.                  |

  ---

  ### **Three Wrong Moves to Penalize**
  1. **"Harsanyi assumes equal weights"** → Confuses the theorem’s conclusion (weighted sum) with an additional normative assumption (symmetry).  
  2. **"vNM utilities are unique"** → Forgets affine freedom (scale/zero), leading to errors in (a).  
  3. **"Ex post Pareto can be added"** → Misses the impossibility in (c) when statewise unanimity is absent.

  ---

  This question forces students to confront the hidden normalizations, informational trade-offs, and philosophical limits behind Harsanyi’s "simple" result. The model answer mirrors a board talk—focused on mechanics and logic, not scholarship.
