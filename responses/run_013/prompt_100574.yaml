prompt: |-
  I'm in my final year and I'm doing a placement with our county council's behavioural insights team for my applied ethics module (I get course credit, they get free labour, everyone wins). The team gets proposals from other departments basically every couple of weeks -- can you nudge people to recycle more, can you nudge people to pay their council tax on time, can you get more residents onto the garden waste subscription -- and at the moment we just sort of eyeball them and say yes or no, which is probaly going to blow up in our faces eventually. My supervisor has asked me to write an actual screening procedure we can run on any proposal that lands on our desk, and I'd rather not just invent a vibe-based checklist, I want it grounded in the real literature on paternalism and nudging.

  So please write me that procedure. It should be something two of us can run on a one-page proposal in about fifteen minutes, and it should end in a verdict: green light, green light with changes, or escalate to the ethics board. Constraints: we have no stats people, we can't run RCTs, and half the time we don't know the current behaviour rate, so the procedure has to say what to do when we can't get a number, rather than stalling.

  Things it has to force us to decide, and I'd like you to explain why each one matters rather than just listing it:

  - Whether we're helping people reach ends they already have, or substituting our ends for theirs. Our lecturer spent a whole seminar on this and it seemed like the crux, but I couldn't tell you how to operationalise it.
  - Whether what's proposed is a nudge or a boost. Apparently steering people by leaning on a bias is a different animal from building their competence so they decide well on their own, and I suspect we've been blurring them.
  - The transparency question: would the thing still work if we told residents plainly that we're doing it and why? And what it means for the proposal if the answer is no.
  - Who actually benefits -- the resident, the council's budget, or somebody else entirely. I've realised some of these aren't paternalism at all, they're just us trying to change behaviour that costs us money, and they shouldn't be run through the same tests.
  - Whether the proposal adds friction anywhere else while removing it in one place, and what it costs someone to opt out.

  Then run it on three real-ish cases: (1) moving the veggie option to eye level in the council-run cafes; (2) a letter to late council-tax payers saying most of their neighbours have already paid -- I like this one and think it's fine, so push back on me if it isn't; (3) switching everyone to paperless billing by default, which saves the council a fortune and which my team is under pressure to approve. I'd genuinely like the procedure to come out against something the team wants, so don't make it a rubber stamp.

  Finally, be honest about which steps are judgment calls dressed up as procedure, and tell me what the procedure can't settle and has to hand to a human.
reasoning: |-
  We are creating a screening procedure for behavioral interventions (nudges) proposed to a county council's behavioral insights team. The procedure must be practical, grounded in ethics literature, and result in one of three verdicts: green light, green light with changes, or escalate to ethics board.

  Key principles from the literature (especially Thaler & Sunstein's "nudge" theory and the discussion on paternalism and autonomy) that we will operationalize:

  1. **Libertarian Paternalism**: Nudges should steer people in directions that will make their lives better (as judged by themselves) while preserving freedom of choice.

  2. **Transparency**: The nudge should be transparent and not manipulative. If it wouldn't work if people knew about it, that's a red flag.

  3. **Boosts vs. Nudges**: 
     - **Nudges** work by altering the choice architecture (e.g., defaults, framing) and often exploit cognitive biases to steer behavior.
     - **Boosts** aim to enhance people's decision-making competence (e.g., through education, training, or decision aids) so they can make better choices independently.

  4. **Beneficiary**: Who benefits? If the primary beneficiary is the council (saving money) and not the resident, then the intervention may not be justifiable as paternalism and might require a different ethical framework (e.g., cost-saving with minimal harm).

  5. **Friction and Opt-Out**: We must consider whether the intervention adds friction elsewhere, and how easy it is to opt out. The opt-out cost should be low.

  The screening procedure will be a checklist with questions. Each question is designed to address an ethical concern. We'll assign points or a qualitative judgment for each, then aggregate to a verdict.

  **Proposed Screening Procedure Steps (to be completed in 15 minutes per proposal):**

  1. **Clarify the Target Behavior and Current State**:
     - What behavior are we trying to change? (Be specific.)
     - What is the current rate of the desired behavior? (If unknown, note that and proceed. We can use qualitative descriptions like "low", "medium", or "high" based on available context.)
     - Why is this change desirable? (List the reasons and who benefits.)

  2. **Test 1: Alignment with Residents' Own Ends** (Why: To avoid imposing values on residents)
     - *Question*: Is there evidence that the desired behavior aligns with the residents' own goals or values? (e.g., recycling is something residents say they want to do, paying taxes on time avoids late fees which residents want to avoid, etc.)
     - *How to operationalize*: Look for survey data, focus groups, or logical inference (e.g., paying taxes on time avoids penalties that residents would rationally want to avoid). If no evidence, then consider: is it a widely shared value (like health) that we can reasonably assume? If not, then this is a red flag.
     - *Scoring*: 
       - Strong evidence (e.g., survey data) → Pass.
       - Reasonable assumption (e.g., avoiding financial penalties, health benefits) → Pass with caution (may need monitoring).
       - Weak or no evidence and not a widely shared value → Fail.

  3. **Test 2: Nudge vs. Boost** (Why: Boosts are often more autonomy-preserving and build long-term capacity)
     - *Question*: Is the intervention primarily a nudge (exploiting a bias) or a boost (building competence)? If it's a nudge, we need to be more cautious because it might manipulate.
     - *How to operationalize*: 
       - Nudge example: changing default options, framing, social norms.
       - Boost example: providing information, training, simplifying forms, reminders that don't exploit biases.
     - *Scoring*: 
       - Boost → More favorable (green light likely).
       - Nudge → Proceed but must pass transparency test (next) and have low opt-out cost.

  4. **Test 3: Transparency** (Why: If the nudge only works in the dark, it's manipulative)
     - *Question*: Would the intervention still be effective if we clearly explained to residents what we are doing and why? (This is the "sunlight test".)
     - *How to operationalize*: Consider if the mechanism relies on deception or if transparency would undermine it. For example, a social norms nudge (e.g., "most people pay on time") is often still effective when disclosed because the fact is true and the norm is real. But a default option that relies on inertia might still work even if disclosed because inertia is a strong force.
     - *Scoring*:
       - Yes, it would still work → Pass.
       - Probably still work → Pass with caution (monitor).
       - No, it relies on secrecy → Fail (escalate to ethics board).

  5. **Test 4: Beneficiary Analysis** (Why: To ensure we are not disguising self-interest as paternalism)
     - *Question*: Who is the primary beneficiary? (Resident, council, both, or other?)
     - *How to operationalize*: 
       - If the resident benefits (e.g., avoiding late fees, better health) → Strong case.
       - If the council benefits (e.g., cost savings) and the resident is unharmed or slightly helped → May be acceptable but requires low cost and easy opt-out.
       - If the council benefits and the resident is harmed (e.g., by making it harder to access a service) → Unacceptable.
       - If a third party benefits (e.g., a private company) → Requires careful scrutiny.
     - *Scoring*:
       - Resident is primary beneficiary → Pass.
       - Mutually beneficial → Pass with caution (ensure resident benefit is clear).
       - Primarily council or third party → Fail unless resident benefit is clear and significant.

  6. **Test 5: Friction and Opt-Out** (Why: To preserve freedom of choice and avoid hidden costs)
     - *Question*: 
       - Does the intervention add friction (e.g., extra steps, delays) to other desirable behaviors? 
       - How easy is it to opt out? (The opt-out should be low-cost, clear, and accessible.)
     - *How to operationalize*: 
       - For friction: Check if the nudge makes one behavior easier but another harder. 
       - For opt-out: Is there a clear and simple way to choose the alternative? (e.g., one click, one phone call, no fees).
     - *Scoring*:
       - No added friction and easy opt-out → Pass.
       - Some friction but justified by the benefits, and easy opt-out → Pass with caution.
       - Difficult opt-out (e.g., hidden, many steps, costly) → Fail.

  **Verdict Rules**:

  - **Green Light**: All tests passed (no fails, and at most one "pass with caution").
  - **Green Light with Changes**: One test failed but can be fixed by modifying the proposal (e.g., making opt-out easier, adding transparency). Or two "pass with caution" scores.
  - **Escalate to Ethics Board**: Two or more fails, or one critical fail (e.g., lack of alignment with residents' ends, not transparent, or beneficiary primarily the council without clear resident benefit and difficult opt-out).

  **What are judgment calls?**:
  - The alignment with residents' ends (Test 1) often requires inference. Without data, we must rely on reasonable assumptions. This is a judgment call.
  - Transparency (Test 3) is also a judgment call because we are predicting effectiveness under disclosure. We may not know for sure until tested.
  - Beneficiary analysis (Test 4) may involve weighing multiple benefits and harms.

  **What the procedure cannot settle**:
  - When there is a conflict between resident benefits and council costs (unless the harm to residents is clear, we may need human judgment).
  - The magnitude of benefits and harms (we are not doing a full cost-benefit analysis). We rely on qualitative assessment.

  **Apply to Cases**:

  *Case 1: Moving the veggie option to eye level in council-run cafes.*

  - **Test 1 (Alignment)**: Reasonable to assume many residents want healthy and sustainable options? Yes, but not universally. However, they can still choose meat. Pass with caution.
  - **Test 2 (Nudge vs Boost)**: This is a nudge (changing choice architecture by altering visibility). 
  - **Test 3 (Transparency)**: If we told people, "We put veggie options at eye level to encourage healthy eating", it would likely still work (maybe even better). Pass.
  - **Test 4 (Beneficiary)**: Residents benefit (health, environment) and the council might (if it aligns with health goals). Mutual benefit. Pass.
  - **Test 5 (Friction and Opt-Out)**: No added friction. Opting out is as easy as looking down. Pass.

  *Verdict*: Green Light (all pass, one with caution).

  *Case 2: Letter to late council-tax payers saying most of their neighbours have already paid.*

  - **Test 1 (Alignment)**: Residents want to avoid late fees and be compliant. The nudge helps them do that. Pass.
  - **Test 2 (Nudge vs Boost)**: Nudge (using social norms). 
  - **Test 3 (Transparency)**: If we say, "We are telling you that most people pay on time to encourage you to pay", it would likely still work (social norm is still true). Pass.
  - **Test 4 (Beneficiary)**: Resident avoids late fees, council gets paid on time. Mutual benefit. Pass.
  - **Test 5 (Friction and Opt-Out)**: No friction added. The letter is information, no opt-out needed (they can ignore). Pass.

  *Verdict*: Green Light.

  *Case 3: Switching everyone to paperless billing by default (with opt-out).*

  - **Test 1 (Alignment)**: Do residents want paperless billing? Some do, but others (e.g., elderly, without internet) may prefer paper. We cannot assume alignment for everyone. Fail without adjustments.
  - **Test 2 (Nudge vs Boost)**: Nudge (default effect).
  - **Test 3 (Transparency)**: If we tell them, "We are switching you to paperless to save costs, but you can opt out", it might still work because inertia is strong. Pass.
  - **Test 4 (Beneficiary)**: Council saves money (primary beneficiary). Residents might save if they prefer digital, but those who don't are harmed (inconvenience, potential for missing bills). The harm to some residents must be considered. Fail if opt-out is not easy.
  - **Test 5 (Friction and Opt-Out)**: The opt-out must be easy. If it is (e.g., one phone call or click), then pass. If not, fail. But note: even with easy opt-out, the initial change might cause some residents to miss bills. We must ensure robust communication and easy opt-out.

  *Revised Analysis*: 
  - Test 1: We don't have evidence that all residents prefer paperless. Without data, we have to note that it might harm some. So we score: Fail (unless we can show that a majority prefer it, but even then, the minority must be protected).
  - Test 4: Primarily council benefit. Resident benefit is not clear for all. This is a cost-saving measure. We must ensure it doesn't harm vulnerable groups. So we score: Fail (without safeguards).
  - However, if we modify the proposal: 
     - Make the opt-out very easy and well-communicated.
     - Allow for automatic paper bills for vulnerable groups (e.g., over 75s) or those without internet.
     - Then we might change to Pass with caution for Tests 1 and 4.

  *Verdict without changes*: Escalate to ethics board (because of two fails: alignment and beneficiary). 

  *Verdict with changes*: Green Light with Changes (if we add safeguards for vulnerable groups and easy opt-out).

  **Final Procedure Checklist Form**:

  [Proposal Title: ___________ Date: ___________ Assessors: ___________]

  1. **Target Behavior**: [Describe]  
     Current Rate (if known): [ ] High [ ] Medium [ ] Low [ ] Unknown  
     Why Desirable: [ ] Resident benefit [ ] Council benefit [ ] Other: _______

  2. **Test 1: Alignment with Residents' Ends**  
     [ ] Strong evidence  
     [ ] Reasonable assumption (pass with caution)  
     [ ] Weak or no evidence, and not widely shared (fail)  
     Notes: _______________

  3. **Test 2: Nudge or Boost**  
     [ ] Boost (favorable)  
     [ ] Nudge (proceed with caution)  
     Notes: _______________

  4. **Test 3: Transparency (Sunlight Test)**  
     [ ] Effective if disclosed (pass)  
     [ ] Probably effective (pass with caution)  
     [ ] Not effective if disclosed (fail)  
     Notes: _______________

  5. **Test 4: Beneficiary**  
     [ ] Primarily resident (pass)  
     [ ] Mutual (pass with caution)  
     [ ] Primarily council or third party (fail)  
     Notes: _______________

  6. **Test 5: Friction and Opt-Out**  
     [ ] No added friction, easy opt-out (pass)  
     [ ] Some friction but easy opt-out (pass with caution)  
     [ ] Difficult opt-out or significant added friction (fail)  
     Notes: _______________

  **Verdict**:  
  [ ] Green Light  
  [ ] Green Light with Changes (specify): _______________  
  [ ] Escalate to Ethics Board  

  **Notes on Judgment Calls**:  
  - Tests 1, 3, and 4 involve the most judgment. When in doubt, discuss with the team.  
  - If the proposal fails two tests, escalate.  
  - Always consider vulnerable populations (elderly, low literacy, etc.) even if not explicit in the tests.
answer: |-
  Below is a practical, ethics-based screening procedure for evaluating behavioral interventions (e.g., nudges or boosts) proposed to your council's team. It's grounded in key literature (e.g., Thaler & Sunstein's *Nudge*, Bovens' work on paternalism, Grüne-Yanoff on boosts, and Sunstein's transparency principle) and designed for speed—two people can run it on a one-page proposal in 15 minutes. The procedure is a checklist with five core tests, each explained and operationalized. It ends with a clear verdict: **Green Light** (proceed as-is), **Green Light with Changes** (proceed after minor fixes), or **Escalate to Ethics Board** (requires deeper review).

  The procedure handles missing data (e.g., unknown behavior rates) by using qualitative flags instead of stalling. It forces explicit decisions on ethical risks and includes safeguards against rubber-stamping. Steps involving judgment calls are highlighted, and limitations are noted at the end.

  ---

  ### **Behavioral Intervention Screening Procedure**
  **Time:** 15 minutes per proposal  
  **Input:** One-page proposal outlining the intervention, target behavior, and rationale.  
  **Output:** Verdict (Green Light, Green Light with Changes, Escalate to Ethics Board).  

  #### **Step 0: Quick Setup (2 minutes)**
  - **What to do:** Skim the proposal. Identify:  
    - *Target behavior* (e.g., "increase recycling").  
    - *Current behavior rate*: If unknown, label "Low," "Medium," or "High" based on context (e.g., "low recycling uptake" from council reports). If no context, mark "Unknown"—proceed anyway.  
    - *Proposed intervention* (e.g., "default opt-in to paperless billing").  
  - **Why:** Ensures you’re aligned on basics. Missing data won’t stall the process.  

  #### **Step 1: Test for Alignment with Residents' Ends (3 minutes)**  
  - **Question to answer:** *Is this intervention helping residents achieve goals they already hold, or substituting the council’s goals for theirs?*  
  - **Why it matters:** Core to *libertarian paternalism* (Thaler & Sunstein). Ethical nudges should help people overcome biases blocking their *own* goals (e.g., saving money), not impose external values (e.g., pushing veganism on meat-eaters). Forcing this stops "expert overreach."  
  - **How to operationalize:**  
    - Look for evidence that residents already value the outcome (e.g., surveys showing residents want to avoid late fees).  
    - If no evidence, ask: "Is this outcome universally or near-universally valued (e.g., health, saving money) without controversy?"  
    - **Scoring:**  
      - ✅ **Pass:** Strong evidence OR reasonable assumption of alignment (e.g., recycling aligns with environmental values common in the community).  
      - ⚠️ **Pass with Caution:** Weak evidence (e.g., no data but logical link, like "paying taxes avoids penalties residents dislike").  
      - ❌ **Fail:** No evidence + low universality (e.g., pushing garden waste subscriptions where uptake is historically low suggests residents don’t value it).  
  - **Judgment call:** "Reasonable assumption" relies on context. When in doubt, default to "Pass with Caution" for high-consensus goals (e.g., health) but "Fail" for divisive ones (e.g., dietary choices).  

  #### **Step 2: Test for Nudge vs. Boost (2 minutes)**  
  - **Question to answer:** *Is this a nudge (exploiting a cognitive bias) or a boost (building decision-making skills)?*  
  - **Why it matters:** Nudges (e.g., defaults) can be manipulative if misused; boosts (e.g., education) empower autonomy long-term (Grüne-Yanoff). Blurring them risks undermining resident competence.  
  - **How to operationalize:**  
    - **Nudge:** Alters choice architecture *using biases* (e.g., framing, social pressure, defaults).  
    - **Boost:** Equips people to choose better (e.g., training, simplified information, reminders).  
    - **Scoring:**  
      - ✅ **Pass (for Boosts):** Builds resident skills (e.g., "workshop on recycling rules").  
      - ⚠️ **Pass with Caution (for Nudges):** Uses biases ethically (e.g., defaults with easy opt-out).  
      - ❌ **Fail:** Nudges that exploit harmful biases (e.g., inducing fear without cause).  
  - **Judgment call:** Classifying nudges/boosts is straightforward, but "harmful" depends on context (e.g., urgency of issue).  

  #### **Step 3: Test for Transparency (3 minutes)**  
  - **Question to answer:** *Would this intervention still work if we told residents about it and why we’re doing it?*  
  - **Why it matters:** Sunstein’s "sunlight test" ensures nudges aren’t covert manipulation. If it fails when transparent, it relies on deception and erodes trust.  
  - **How to operationalize:**  
    - Imagine adding this to the intervention: "We’re doing [X] to encourage [Y] because [Z]."  
    - Ask: "Would residents still comply, or would they feel tricked and resist?"  
    - **Scoring:**  
      - ✅ **Pass:** Still effective when transparent (e.g., social norms like "your neighbors pay taxes" are factual and non-coercive).  
      - ⚠️ **Pass with Caution:** Likely effective but less so (e.g., defaults may still work if opt-out is easy).  
      - ❌ **Fail:** Relies on secrecy (e.g., hidden fees or emotional manipulation).  
  - **If "Fail":** Automatically escalate—this is high-risk.  
  - **Judgment call:** Predicting "effectiveness" is speculative without data, but use common sense (e.g., transparency backfires if it feels patronizing).  

  #### **Step 4: Test for Beneficiary (2 minutes)**  
  - **Question to answer:** *Who primarily benefits—residents, the council, or a third party?*  
  - **Why it matters:** True paternalism requires resident benefit. If the council or a contractor benefits more, it’s not paternalism—it’s cost-shifting, which needs stricter scrutiny (Bovens).  
  - **How to operationalize:**  
    - Estimate benefit split:  
      - *Resident:* Saves money/time, improves health, etc.  
      - *Council:* Saves costs, increases revenue.  
      - *Third party:* e.g., a private vendor.  
    - **Scoring:**  
      - ✅ **Pass:** Resident is primary beneficiary (e.g., avoiding late fees).  
      - ⚠️ **Pass with Caution:** Shared benefit (e.g., recycling helps environment + council saves landfill costs).  
      - ❌ **Fail:** Council/third party benefits dominate, and resident benefit is weak or absent.  
  - **Judgment call:** Weighing benefits is qualitative. Prioritize resident welfare where unclear.  

  #### **Step 5: Test for Friction and Opt-Out Costs (3 minutes)**  
  - **Question to answer:** *Does this add friction (e.g., delays, effort) to other behaviors? How easy/expensive is opting out?*  
  - **Why it matters:** Nudges should make desired behavior easier, not punish alternatives (Thaler & Sunstein). High opt-out costs trap residents and violate libertarian principles.  
  - **How to operationalize:**  
    - Check for:  
      - *Added friction:* e.g., a recycling nudge that makes trash disposal harder.  
      - *Opt-out cost:* Effort, time, or fees to choose alternatives.  
    - **Scoring:**  
      - ✅ **Pass:** No added friction + opt-out is free/instant (e.g., one-click unsubscribe).  
      - ⚠️ **Pass with Caution:** Minor friction or opt-out cost (e.g., a phone call to opt out).  
      - ❌ **Fail:** High friction (e.g., delays in essential services) or costly opt-out (e.g., fees).  
  - **Judgment call:** "Minor" vs. "high" cost is subjective (e.g., a phone call may burden elderly residents).  

  #### **Verdict Decision Rules (use scores above)**  
  - **Green Light:** All tests ✅ Pass.  
  - **Green Light with Changes:** Max 1 ⚠️ or 1 ❌ that can be fixed quickly (e.g., tweaking opt-out).  
  - **Escalate to Ethics Board:** 2+ ❌ Fails OR 1 ❌ in Tests 1, 3, or 5 (high-risk areas).  

  ---

  ### **Apply the Procedure to Your Cases**
  **Case 1: Moving veggie option to eye level in council cafes**  
  - **Test 1 (Alignment):** ❌ Fail. No evidence residents want to eat more veggies. Dietary choices are personal—council shouldn’t assume health is the priority.  
  - **Test 2 (Nudge/Boost):** ⚠️ Pass with Caution. Nudge (exploits visibility bias).  
  - **Test 3 (Transparency):** ✅ Pass. Still works if disclosed ("We’re highlighting veggies for health").  
  - **Test 4 (Beneficiary):** ⚠️ Pass with Caution. Residents *may* benefit (health), but council benefits if it reduces food costs.  
  - **Test 5 (Friction/Opt-Out):** ✅ Pass. No added friction; opting out = grabbing non-veggie food.  
  - **Verdict:** ❌ Fail in Test 1 → **Escalate to Ethics Board** (due to substitution of ends).  

  **Case 2: Letter to late taxpayers: "Most neighbors paid"**  
  - **Test 1 (Alignment):** ✅ Pass. Residents want to avoid late fees (universal goal).  
  - **Test 2 (Nudge/Boost):** ⚠️ Pass with Caution. Nudge (uses social norms bias).  
  - **Test 3 (Transparency):** ✅ Pass. Still works if disclosed ("We’re using social norms to encourage on-time payment").  
  - **Test 4 (Beneficiary):** ✅ Pass. Mutual benefit (resident avoids fees; council gets revenue).  
  - **Test 5 (Friction/Opt-Out):** ✅ Pass. No friction; opt-out = ignoring the letter.  
  - **Verdict:** All ✅ or ⚠️ → **Green Light** (your intuition was right, but we flagged the nudge/boost distinction for monitoring).  

  **Case 3: Default paperless billing (opt-out available)**  
  - **Test 1 (Alignment):** ❌ Fail. No evidence all residents prefer digital (e.g., elderly may need paper). Council is substituting its goal (cost-saving) for residents’ preferences.  
  - **Test 2 (Nudge/Boost):** ⚠️ Pass with Caution. Nudge (exploits inertia via defaults).  
  - **Test 3 (Transparency):** ⚠️ Pass with Caution. Likely still works if disclosed, but some may opt out due to distrust.  
  - **Test 4 (Beneficiary):** ❌ Fail. Council saves significant money; residents save little (and some are harmed if they miss bills).  
  - **Test 5 (Friction/Opt-Out):** ⚠️ Pass with Caution. Opt-out may be "easy" (e.g., online), but added friction if residents lack internet access.  
  - **Verdict:** 2 ❌ Fails (Tests 1 and 4) → **Escalate to Ethics Board**. *Why it’s not a rubber stamp:* The council benefits more, and vulnerable residents may pay the cost.  

  ---

  ### **Honest Assessment: What’s a Judgment Call? What Can’t It Settle?**  
  - **Judgment calls dressed as procedure:**  
    - **Test 1 (Alignment):** "Reasonable assumption" of resident values is subjective. You’re inferring from incomplete data.  
    - **Test 3 (Transparency):** Predicting if disclosure kills effectiveness is speculative—it’s a proxy for "manipulation," but real-world reactions vary.  
    - **Test 4 (Beneficiary):** Weighing resident vs. council benefits involves value judgments (e.g., is cost-saving a valid justification if residents aren’t harmed?).  
  - **What the procedure can’t settle—requires human escalation:**  
    - **Magnitude of harm/benefit:** It flags *who* benefits but not *how much* (e.g., a council saving £100k vs. resident inconvenience). The ethics board must weigh this.  
    - **Vulnerable groups:** It doesn’t fully address equity (e.g., digital defaults harming elderly). Test 5 hints at it, but deeper review is needed.  
    - **Long-term effects:** e.g., Boosts build competence; nudges may erode autonomy. The ethics board should assess this.  
    - **Political/policy risks:** e.g., Public backlash—this is beyond the procedure’s scope.  

  **Final Tip:** Use this as a living document. Recalibrate yearly with real outcomes (e.g., "Did Test 1 failures actually cause complaints?"). And remember: When in doubt, escalate. It’s safer than a vibe check.
