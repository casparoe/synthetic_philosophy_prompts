    3. **Replace III with U:** A pattern substitution (e.g., `III → U`, similar to a string replace).  
    4. **Delete UU:** A cancellation rule (e.g., removing `UU` substrings).  

  Deriving a string is **in-band execution**: Starting from `"MI"`, applying rules to transform state. The system is a **deterministic state machine** where rules define transitions, and derivations are valid execution paths.  

  **Non-derivability of "MU" (Out-of-Band Analysis):**  
  - **In-band failure:** Brute-force derivation (e.g., BFS/DFS) may not terminate or prove absence.  
