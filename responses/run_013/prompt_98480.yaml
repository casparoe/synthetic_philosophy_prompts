    - **Conclusion:** `"MU"` has `count_I = 0` (div. by 3) → unreachable. This is **out-of-band control**: using external reasoning (modular arithmetic) to constrain in-band executions.  

  **Complete Derivability Criterion:**  
  A string is derivable iff:  
  1. **Syntax valid:** Starts with exactly one `M`, only uses `{M, I, U}`.  
