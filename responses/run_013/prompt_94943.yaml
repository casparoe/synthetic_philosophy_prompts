  I'm dealing with this supertask puzzle from Maya, and I need to figure out where her argument goes wrong. Her conclusion is that supertasks are impossible because they can't have a determinate outcome. But I think that's too strong because I can imagine cases like the needle swinging to 180° or Zeno's ball coming to rest that seem to have clear outcomes.

  First, let's outline Maya's argument step by step:

  1. A supertask is an infinite sequence of discrete steps, each taking half as long as the one before, all completed by time T.

  2. For a supertask to have a determinate outcome, something has to fix the state of the system at T.

  3. The only thing that could fix it is the last step.

  4. There is no last step.

  5. Therefore, nothing fixes the state at T.

  6. Therefore, no supertask has a determinate outcome.

  7. Something that never fixes its own outcome isn't a process; it's a description with a hole.

  8. Therefore, supertasks are impossible.

  I think the problem is with step (3): "The only thing that could fix it is the last step." That seems too restrictive. In the needle example, the state at T is fixed by the limit of the process, not by a last step. Similarly for Zeno's ball, it stops because the bounces become infinitesimal, and it comes to rest at T.

  Maya says I'm smuggling in a continuity assumption that isn't part of the supertask. She says a supertask is just the list of steps, so I'm adding something extra.

  But in the definition (1), it says "all completed by some time T," which implies that the process reaches T. So the state at T should be determined by how the process behaves as it approaches T.

  In mathematics, for sequences or series, we define the limit if it exists. For example, the sum of 1/2 + 1/4 + 1/8 + ... = 1, even though there's no last term. Similarly, the needle's position approaches 180° continuously, so at time T, it should be at 180°.

  But Maya might argue that in a supertask, since the steps are discrete, there is no "between" steps; it's just the sequence of actions at specific times. So for the lamp, at each step it toggles, so the state is defined only at the times when actions happen, but not necessarily at T, if T isn't one of those times.

  In the Thomson's lamp, the actions are at t=1/2, 1/4, 1/8, ... and T=1. Since 1 is not one of the action times, the state isn't defined there by any step.

  But for the needle, if we think of each swing as instantaneous, then at times t=1/2, 3/4, 7/8, etc., the position is set to (180 - 180/2^n) degrees or something. Let's define it properly.

  Suppose at step n, the needle moves from its current position to halfway to 180°. But since it's discrete steps, at time t_n = 1 - 1/2^n, it instantly moves to angle θ_n.

  Start at θ_0 = 0° at t=0.

  After step 1 at t=1/2, θ_1 = 90° (halfway to 180).

  After step 2 at t=3/4, θ_2 = 135° (halfway from 90 to 180, so 90 + 45 = 135).

  After step 3 at t=7/8, θ_3 = 157.5°, and so on.

  So θ_n = 180 * (1 - 1/2^n) degrees.

  As n→∞, θ_n → 180°.

  At time T=1, which is the limit, we say θ=180°.

  But is there a step at t=1? No, the steps are only at t<1, approaching 1.

  So the state at t=1 is not set by any step; it's defined by the limit.

  Similarly, for the lamp, the state isn't defined by a limit because the lamp is being toggled infinitely, so the sequence of states (on/off) doesn't converge; it keeps changing.

  In the lamp case, at each step, it toggles, so if it starts on, after step 1 (t=1/2) it's off, step 2 (t=3/4) on, step 3 (t=7/8) off, and so on. So at times t_n, the state is defined: for odd n, off if started on, etc., but at t=1, since n goes to infinity, and the state oscillates, it doesn't settle.

  Whereas for the needle, the position converges to 180°, so we can define it at t=1.

  In the argument, step (3) says "the only thing that could fix it is the last step," but in the needle case, it's fixed by the limit, not by a last step.

  So I think step (3) is incorrect. There are other ways to fix the state, like through a limit if the state converges.

  Maya might say that the supertask only includes the discrete steps, not the limit; the limit is something we add.

  But in the definition (1), it says "all completed by some time T," so T is included, and the state at T should be part of the outcome.

  Moreover, in physics or real life, if we could perform such a thing, the needle would be at 180° at T.

  But for the lamp, it's undefined because it doesn't settle.

  So supertasks can have determinate outcomes if the state converges to a value.

  Otherwise, not.

  In the ball bouncing case, Zeno's paradox: ball drops, bounces to half height each time, taking half the time each bounce.

  After bounce n, height is h/2^n, and time from start to bounce n is t_n proportional to sum of geometric series, say t_n = T (1 - 1/2^n) for some T.

  At t_n, height h_n = h_0 / 2^n.

  As n→∞, h_n → 0, so at t=T, height=0, ball at rest.

  Determinate outcome.

  Again, no last step, but state fixed by limit.

  For the lamp, since it oscillates, no limit.

  So I think Maya's step (3) is wrong: the last step isn't the only thing that can fix the state; the limit can, if it exists.

  Therefore, step (5) doesn't follow if the state converges.

  Step (6) then isn't true for all supertasks.

