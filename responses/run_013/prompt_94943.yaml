  But Maya says that a supertask is just the list of steps, so without adding continuity, there's no state at T.

  But in the definition, T is the completion time, so it must have a state.

  Perhaps the issue is with the ontology of supertasks.

  In mathematics, we can define the state at T via the limit if the sequence of states converges.

  If not, it's undefined.

  So for convergent supertasks, outcome is determinate; for divergent, not.

  Thomson's lamp is divergent in state, needle is convergent.

  So Maya's argument assumes that for the state to be fixed, it must be fixed by a step, but in reality, it can be fixed by the process as a whole via the limit.

