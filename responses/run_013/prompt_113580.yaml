answer: |-
  Below is the distilled translation of the Hart-Devlin debate into welfare economics/CBA terms, followed by residue, verdict, and practical implications for your brothel question. I've adhered strictly to your framework's vocabulary (externalities, WTP/WTA, Kaldor-Hicks, preference laundering, etc.) and flagged distortions.  

  ### Translation Table  
  | claim                                                                 | side            | my_version                                                                                                                              | fidelity     | what_got_lost                                                                 |
  | :-------------------------------------------------------------------- | :-------------- | :-------------------------------------------------------------------------------------------------------------------------------------- | :----------- | :---------------------------------------------------------------------------- |
  | Society requires shared morality to cohere; immorality risks collapse. | Devlin          | Social cohesion is a public good; norm violations impose negative network externalities threatening system stability.                    | distorted    | Replaces "morality" with stability/public goods; drops intrinsic value of shared values. |
  | Morality is a seamless fabric; no isolated threads.                   | Devlin          | Norms are non-separable in utility functions; disrupting one norm changes marginal costs/benefits of compliance with others.             | distorted    | Assumes interdependence is technical (like cross-price elasticities), not moral/logical. |
  | Criminal law may prohibit what ordinary members find *intolerable*.   | Devlin          | State intervention justified when WTA compensation for an externality (e.g., norm violation) exceeds avoidance costs + transaction costs. | distorted    | "Intolerable" becomes high WTA; omits Devlin's threshold of collective revulsion. |
  | Immorality alone ≠ justification for coercion; harm required.         | Hart            | Only Pareto-relevant externalities (uncompensated harms) justify regulation; mere preference for others' behavior is pecuniary/excluded. | clean        | N/A (aligns with standard externality/internalization logic).                 |
  | Disintegration thesis is untested empirics, not logic.                | Hart            | Claimed network externalities lack robust evidence; costs of norm change may be low (Kaldor-Hicks efficient).                            | clean        | N/A (treats disintegration as testable cost claim).                           |
  | Devlin conflates "is wrong" (descriptive) with "is wrong" (normative).| Hart            | Mistaking revealed preference (WTP for prohibition) for normative justification; ignores preference laundering.                          | clean        | N/A (economics already separates positive/normative).                         |
  | Norms are coordination devices; value depends on widespread adherence.| Game Theory     | Multiple equilibria exist; norm compliance generates positive network externalities; enforcement avoids high switching costs.            | distorted    | Reduces morality to coordination efficiency; drops "intolerability" as qualitative. |
  | Law and social disapproval have different cost structures.            | Hart            | Legal enforcement imposes deadweight loss (DWL) vs. social sanctions; CBA must compare efficiency of instruments.                       | clean        | N/A (instrument choice is standard in CBA).                                   |

  ### Residue  
  1. **Devlin's "Shared Morality as Constitutive"**: No counterpart. Welfare economics treats preferences as exogenous, not as defining societal identity. Economics lacks a concept of "society" beyond aggregate preferences.  
  2. **"Intolerable" vs. "Distasteful"**: Devlin’s qualitative threshold becomes quantitative (high WTA), but the *moral outrage* framing vanishes. Economics can't distinguish "offense" from other disutilities without smuggling in moral hierarchy.  
  3. **Hart's Anti-Paternalism**: His "harm to others" principle maps cleanly, but his deeper objection to *using law to enforce majority preferences* disappears if WTP is high. Economics doesn’t inherently reject legal moralism if monetized.  

  ### Verdict  
  **Hart survives better**: His arguments translate cleanly into externality analysis, Kaldor-Hicks, and instrument choice. Devlin requires distortion—his moral fabric becomes network effects, his societal collapse becomes unverified system risk. The residue exposes welfare economics' **conceptual limitations**: it lacks tools for *non-instrumental* values (e.g., morality as good-in-itself) and struggles with preference legitimacy. This isn't vagueness in Devlin/Hart; it's economics' inability to handle non-consequentialist claims.  

  ### For My CBA: Counting Offense at the Brothel  
  1. **Don't call it a "benefit"**: Framing reduced offense as a "benefit" of prohibition smuggles in moralism. In CBA terms, it's either:  
     - A **cost avoided** (residents' WTA to tolerate the brothel), *or*  
     - An **externality** (if brothels increase crime/disorder), but *not* a benefit.  
  2. **Hart's warning applies**: Including pure offense without harm risks:  
     - **Laundering preferences**: Counting WTP for prohibition validates moral preferences economics typically excludes (e.g., racism, homophobia).  
     - **Instrument inefficiency**: If social disapproval exists, legal enforcement may have higher DWL than alternatives (zoning, information campaigns).  
  3. **Devlin's angle requires evidence**: If offense reflects feared *collapse* (e.g., declining property values, increased crime), model those costs as externalities—not the offense itself. No evidence? Then it’s a non-pecuniary preference to exclude.  

  **Bottom line**: In strict welfare economics, exclude offense unless linked to tangible harms. Including it accepts Devlin’s premise—that outrage is a social cost—which collapses the distinction between harm and mere preference. Your machinery *can* run Devlin’s argument, but only by overriding its own filters.
