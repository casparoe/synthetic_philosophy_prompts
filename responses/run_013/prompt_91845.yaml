          OR = (101/909) / (15/15) = (0.111)/1 = 0.111 -> no reversal.

      Actually, it's known that the OR cannot reverse when the treatment effect is constant across strata and there is no confounding (because the conditional ORs are constant and the marginal OR is a weighted average of the conditional ORs, but it's not a simple average and might not reverse). However, if the ORs are not constant, then the overall OR can be outside the range of the stratum-specific ORs and even reverse. But that's not Simpson's paradox per se (which is about reversal due to aggregation).

      Instead, note: The paradox for risk differences is about confounding. But for odds ratios, even in the absence of confounding, the marginal OR might differ from the conditional ORs because of non-collapsibility. This is a technical point and might be too much. 

      Given time, we might skip or simplify:

        "In randomized trials, we often use risk differences, risk ratios, or odds ratios. The odds ratio has a property called non-collapsibility: even if there is no confounding, the overall odds ratio might not equal the stratum-specific odds ratios. So we might see a difference between adjusted and unadjusted ORs even in a randomized trial. But that's a more advanced topic and doesn't always lead to reversal. The main point: always consider the measure of effect and adjust for important prognostic factors even in randomized trials to get a more precise estimate, but the unadjusted estimate is still unbiased for the marginal effect."

      Since we are short on time, we might just mention:

        "One more thing: even in a perfectly randomized trial, if we look at odds ratios, the overall odds ratio might not be a simple average of the group-specific odds ratios. This is because odds ratios are not collapsible. So sometimes we might see a difference between unadjusted and adjusted odds ratios. But that's a topic for another day."

  - **Placement:** After the main paradox and the causal explanation, as an advanced footnote. This prevents derailing because we present it as an aside for the curious.
  - **Why?** To show that there's more to the story, but without implying that nothing means anything.

  #### (50-55 min) The One Question to Assess Understanding
  - **Goal:** Check if they understand the core concept beyond just "stratify".
  - **Question:** 
    - "Imagine you are reviewing a study that compares two treatments for infection. Overall, Treatment A has a higher cure rate. But when you look by disease severity (mild vs severe), Treatment B has a higher cure rate in both groups. What would you suspect is going on, and what would you do next?"
    - Expected answer: They should suspect that the overall result is confounded by disease severity (e.g., perhaps Treatment A was given more often to severe cases, which are harder to cure). They would want to adjust for severity (e.g., by stratifying or using regression) and base the conclusion on the adjusted analysis.
  - **Why this question?** It tests if they can recognize the paradox and identify the confounding variable.

  #### (55-60 min) Wrap-Up and What We Didn't Cover
  - **Recap:** 
    - Simpson's paradox occurs when a trend appears in several groups but disappears or reverses when the groups are combined.
    - This usually happens because of a lurking variable (confounder) that affects both the group assignment and the outcome.
    - Always consider stratification by important confounders.
  - **What we didn't cover:**
    - How to choose which variables to adjust for (causal diagrams in depth).
    - Advanced adjustment methods (regression, propensity scores).
    - How to handle continuous variables.
    - The math of non-collapsibility in detail.
    - We focused on risk differences; note that risk ratios and odds ratios have their own complexities.
  - **State clearly:** "In one hour, we can't cover every aspect. We focused on the core idea and a clinical example. Remember: always look at the data in multiple ways, and be cautious of unadjusted overall results when confounding is possible."

