  ### Session Plan: Building Intuition for Simpson's Paradox  
  **Goal:** Make the reversal feel predictable, not magical. Anchor in clinical relevance.  

  #### Step-by-Step Sequence (55 min total)  
  1. **Ground in Familiar Territory (10 min)**  
     - **Start with a non-paradox example:** Show a simple 2x2 table (Treatment A vs. B, Outcome Success/Failure) *without* subgroups. Ask: "Which treatment is better?"  
     - **Why:** Activates their existing intuition. Establishes that "overall rates = weighted averages."  
     - **Transition:** "But what if we suspect hidden differences in our patients?"  

  2. **Introduce Stratification Visually (15 min)**  
     - **Show a stratified dataset:** Use a hypothetical trial comparing two antibiotics across two hospitals (e.g., Hospital X: sicker patients, Hospital Y: healthier).  
       - Hospital X: Treatment A success 40/100, Treatment B success 30/50.  
       - Hospital Y: Treatment A success 60/100, Treatment B success 10/20.  
     - **Reveal subgroup results first:** "Within each hospital, which treatment wins?" (Here, B wins in both).  
     - **Then combine:** Calculate overall success: A = 100/200 (50%), B = 40/70 (57%). *B appears better overall*.  
     - **Why:** Forces cognitive dissonance. They see the subgroups point one way, the aggregate the opposite.  

  3. **Dissect the Weights (10 min)**  
     - **Visualize weights:** Bar chart showing sample sizes (e.g., Hospital X has 150 patients, Hospital Y has 50).  
     - **Ask:** "Where did most patients get Treatment B?" (Hospital X, the sicker group).  
     - **Key insight:** "The overall rate isn't just an average—it's a *weighted* average. If the weights are lopsided (e.g., B used more in sicker patients), the aggregate lies."  
     - **Why:** Makes the reversal feel inevitable. They see the imbalance *before* the flip.  

  4. **Connect to Confounding (5 min)**  
     - **Causal diagram:** Sketch: `Patient Severity → Treatment Choice AND Patient Severity → Outcome`.  
     - **State:** "The paradox happens when your strata (e.g., hospitals) grab a lurking variable that affects both treatment and outcome."  
     - **Why:** Confirms their suspicion: "This is why we stratify!"  

  5. **Advanced Twist: Non-Collapsibility (7 min)**  
     - **Where to place:** After establishing the standard paradox (Step 4).  
     - **Script:** "Even in a *perfectly randomized trial*, if you use odds ratios, pooling strata can flip effects. Not confounding—just math. Risk differences pool cleanly; odds ratios don’t. Example:"  
       - Stratum 1: OR = 0.5 (B better).  
       - Stratum 2: OR = 0.5 (B better).  
       - Overall: OR = 1.2 (A better!).  
     - **Why now:** Prevents overconfidence in stratification. Adds depth without wrecking the arc—it’s a footnote, not the climax.  
     - **Tone:** "This is rare, but it reminds us: choice of metric matters."  

  6. **Reinforce with the Kidney Stones Example (Carries the hour)**  
     - **Why Berkeley is wrong for this room:** Admissions data feels academic. Clinical trials need clinical stakes.  
     - **Use Charig et al. (1986) kidney stone study:**  
       - **Real numbers, real decision:**  
         | Stone Size | Treatment A (Open) | Treatment B (PNL) |  
         |------------|--------------------|--------------------|  
         | Small      | 93% (81/87)        | 87% (234/270)      |  
         | Large      | 73% (192/263)      | 69% (55/80)        |  
         | **Overall**| **78% (273/350)**  | **83% (289/350)**  |  
       - **Why it works:**  
         - Clear causal story: Stone size drives outcomes *and* treatment choice (sicker patients get open surgery).  
         - High stakes: Picking the wrong treatment based on aggregate data could harm patients.  
         - Clean math: Reversal is obvious; weights (sample sizes) explain everything.  

  #### Misconceptions to Preempt (Order of Appearance)  
  1. **"Bigger samples = more truth."**  
     - **When it surfaces:** Step 2 (after seeing aggregate).  
     - **Head off:** "The aggregate isn't 'wrong'—it's answering a different question: 'What happened on average in this mix of patients?' Not 'Which treatment is better?'"  

  2. **"Stratification fixes everything."**  
     - **When it surfaces:** Step 4 (after causal diagram).  
     - **Head off:** "Stratifying on non-confounders (e.g., hospital ID without severity differences) adds noise. Ask: 'Is this variable a common cause?'"  

  3. **"This only happens in observational data."**  
     - **Planted by you:** When emphasizing confounding.  
     - **Head off:** In Step 5, contrast: "In RCTs, unadjusted overall effects are unbiased for the *marginal* effect. But if you condition on post-randomization variables (e.g., adherence), you can induce paradoxes."  

  #### Final Assessment Question (Last 5 min)  
  - **Question:** "A trial shows Drug X has higher survival overall than Drug Y. But when you split by disease stage, Y wins in early and late stage. What’s your next move?"  
  - **Expected answer:** "Check if disease stage is unevenly distributed between drugs. Stratify or adjust for it."  
  - **Why it works:** Tests if they connect imbalance → weights → reversal. If they say "always trust subgroups," revisit Step 4.  

  #### What to Explicitly Exclude  
  - **State upfront:** "We won’t cover:  
    - How to choose adjustment variables (causal diagrams deep dive).  
    - Statistical tests for interaction.  
    - Logistic regression math for odds ratios.  
    This is about intuition—not methods minutiae."  

  ### Why This Flow Works  
  - **Reversal feels predictable:** By Step 3, they’re spotting the lopsided weights *before* the flip.  
  - **Kidney stones anchor:** Clinical, high-stakes, and the numbers tell the whole story.  
  - **Advanced twist stays grounded:** Framed as a "math quirk," not an existential crisis.  
  - **Misconceptions cut off at the pass:** Each rebuttal ties to a prior step (e.g., weights explain why "bigger samples" mislead).  

  **Final tip:** End with, "Simpson’s paradox isn’t a trap—it’s a reminder: know your weights, know your variables, and always ask, 'What’s hidden?'"
