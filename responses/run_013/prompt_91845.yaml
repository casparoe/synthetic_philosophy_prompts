  We are designing a one-hour session on Simpson's paradox for a clinical trials unit audience (trial coordinators, registrars, a pharmacist) with basic stats knowledge. The goal is to make the paradox feel intuitive and not like a party trick. We need:

  1. A logical sequence of ideas that builds understanding step by step.
  2. A central example that resonates with the audience (clinical trials context).
  3. Addressing misconceptions in the order they arise.
  4. Sneaking in an advanced point about odds ratios without derailing the session.
  5. A closing question to assess understanding.
  6. Clearly stating what we won't cover.

  ### Step-by-Step Session Plan (60 minutes)

  #### (0-5 min) Introduction and Setting the Stage
  - **Goal:** Connect to their work and establish relevance.
  - **Content:** 
    - Start with a simple, non-technical scenario: "Imagine you are comparing two treatments (A and B) in two hospitals. Overall, Treatment A looks better. But when we look at each hospital separately, Treatment B is better in both. How can that be?"
    - State the session goal: "Today we'll understand why this happens and how to avoid being misled by such data."
  - **Why this order?** The immediate paradox grabs attention and sets up the mystery.

  #### (5-15 min) Building Intuition: The Weighted Average
  - **Goal:** Show that overall results are a weighted average of subgroup results and that weights matter.
  - **Content:**
    - Use a simple arithmetic example (non-medical) to illustrate how a weighted average can be misleading. Example: 
      - Two classes (Class 1 and Class 2) take two tests (Test A and Test B). 
      - Class 1: 10 students, average score on Test A: 60, Test B: 70.
      - Class 2: 40 students, average score on Test A: 80, Test B: 75.
      - Overall average for Test A: (10*60 + 40*80)/50 = 76
      - Overall average for Test B: (10*70 + 40*75)/50 = 74
      - So overall, Test A has a higher average (76 vs 74). But in each class, Test B is better (Class1: 70>60, Class2: 75>80? Wait, no: 75<80 so actually in Class2, Test A is better! Let me fix.)
      - Correction: We want an example where each subgroup favors B but overall favors A. So let me adjust:
        - Class1: 10 students, Test A: 60, Test B: 70 -> B better by 10.
        - Class2: 40 students, Test A: 80, Test B: 75 -> A better by 5? Not what we want.
      - Revised example (classic):
        - Class1: small class, Test A: 60, Test B: 80 (so B is better by 20)
        - Class2: large class, Test A: 90, Test B: 85 (so A is better by 5)
        - Overall Test A: (10*60 + 40*90)/50 = (600+3600)/50=4200/50=84
        - Overall Test B: (10*80 + 40*85)/50 = (800+3400)/50=4200/50=84 -> tie? Not good.
      - Better: 
        - Class1: 10 students, Test A: 60, Test B: 70 -> B is better by 10.
        - Class2: 40 students, Test A: 80, Test B: 75 -> A is better by 5? Then overall: 
          Test A: (10*60 + 40*80)=600+3200=3800/50=76
          Test B: (10*70 + 40*75)=700+3000=3700/50=74 -> overall A by 2.
        But in Class2, A is better? So we don't have B better in every subgroup. 
      - Let's do:
        - Class1: 10 students: A: 60, B: 80 (B better by 20)
        - Class2: 40 students: A: 70, B: 75 (B better by 5) -> then overall:
          A: (10*60+40*70)=600+2800=3400/50=68
          B: (10*80+40*75)=800+3000=3800/50=76 -> overall B is better? Not a reversal.
      - Correct example for reversal (Simpson's paradox):
        - We need two groups and two treatments, and we want that in each group, treatment B is better, but overall A is better.
        - Example 1 (classic):
          Group1 (sick patients): 
            Treatment A: 40/100 (40%) success
            Treatment B: 30/90 (33.3%) success -> so A better in Group1? 
          Not what we want.

      Instead, use a standard example:

        Hospital1 (small hospital, severe cases):
          Treatment A: 20/80 = 25% success
          Treatment B: 10/20 = 50% success  -> B better

        Hospital2 (large hospital, mild cases):
          Treatment A: 150/200 = 75% success
          Treatment B: 190/200 = 95% success -> B better

        Overall for Treatment A: (20+150)/(80+200)=170/280 ≈ 60.7%
        Overall for Treatment B: (10+190)/(20+200)=200/220 ≈ 90.9% -> overall B is better.

      That's not a reversal. We want overall A to look better. So:

        Hospital1 (severe, small):
          A: 30/90 = 33.3% 
          B: 10/10 = 100% -> B better

        Hospital2 (mild, large):
          A: 60/100 = 60%
          B: 100/200 = 50% -> A better? Not what we want.

      Classic Simpson's example:

        Hospital1 (severe, small):
          A: 100/400 = 25% 
          B: 20/100 = 20% -> so A is better? Not B.

      Let's use the Berkeley example but then we'll transition to a clinical one.

      Alternatively, use a clinical trial example from the start.

      Proposed clinical example (made up but realistic):

        We are comparing 30-day mortality for two treatments (A and B) in two hospitals.

        Hospital X (tertiary center, high-risk patients):
          Treatment A: 40 deaths out of 200 patients (20%)
          Treatment B: 15 deaths out of 100 patients (15%) -> so B better

        Hospital Y (community hospital, low-risk patients):
          Treatment A: 10 deaths out of 100 patients (10%)
          Treatment B: 20 deaths out of 200 patients (10%) -> same? Not good.

      Revised:

        Hospital X (high risk, large):
          Treatment A: 100/500 = 20% mortality
          Treatment B: 90/300 = 30% mortality -> A better? 

      We want:

        Hospital X (high risk, small):
          Treatment A: 60/100 = 60% mortality
          Treatment B: 40/100 = 40% mortality -> B better (by 20%)

        Hospital Y (low risk, large):
          Treatment A: 10/200 = 5% mortality
          Treatment B: 5/100 = 5% mortality -> same? Then overall: 
            A: (60+10)=70 deaths / 300 = 23.3%
            B: (40+5)=45 deaths / 200 = 22.5% -> overall B better? Not reversal.

      Let me use:

        Hospital X (high risk, small):
          A: 60/100 (60%) -> 40 survivors
          B: 40/50 (80%) -> 10 survivors? Wait, mortality: B: 40/50=80% mortality -> so A: 60% mortality, B:80% mortality -> so A better? 

      I think I'm messing up. Let's do:

        We want in each hospital, Treatment B has higher mortality? Then overall A has higher mortality? That would be bad, but it's the paradox.

        Example:

          Hospital X (high risk, 50 patients total):
            A: 30/40 = 75% mortality -> 10 survived
            B: 9/10 = 90% mortality -> 1 survived -> so B worse? Then overall:

          Hospital Y (low risk, 150 patients):
            A: 10/60 ≈16.7% mortality -> 50 survived
            B: 20/90 ≈22.2% mortality -> 70 survived? Wait, no: 90 patients, 20 deaths -> 70 survived.

          Overall A: 40 deaths out of 100 patients (40% mortality)
          Overall B: 29 deaths out of 100 patients (29% mortality) -> so overall B is better? But in each hospital, B was worse? 

      Now we have:
        Hospital X: A has 75% mortality, B has 90% -> so A better (because lower mortality) by 15%
        Hospital Y: A has 16.7%, B has 22.2% -> A better by 5.5%
        Overall: A: 40%, B:29% -> so overall, B is better? That's the paradox: within each hospital A is better, but overall B is better.

      Why? Because Hospital X (where mortality is high) has more patients on A (40 vs 10 on B) and Hospital Y (low mortality) has more on B (90 vs 60 on A). So the overall mortality is weighted by the hospital.

      This is the example we'll use.

      Steps:
        - Present the two hospitals and the mortality rates for A and B in each.
        - Show that in each hospital, A has lower mortality (so A is better).
        - Now combine: 
            Total deaths for A: 30 (from X) + 10 (from Y) = 40 out of 100 -> 40%
            Total deaths for B: 9 (from X) + 20 (from Y) = 29 out of 100 -> 29%
        - So overall, B has lower mortality? That seems better? But that contradicts the within-hospital analysis.

  - **Why this order?** We start with numbers they can relate to (mortality) and a simple weighted average. The weights (sample sizes) are critical.

  #### (15-25 min) The Role of Confounding: Lurking Variables
  - **Goal:** Introduce the idea that a third variable (here, hospital/risk) is causing the paradox.
  - **Content:**
    - Explain that the hospital (or the patient risk associated with the hospital) is a confounding variable.
    - Show that Hospital X has higher mortality overall (regardless of treatment) and that Treatment A was given more often in Hospital X (high risk) while Treatment B was given more in Hospital Y (low risk).
    - Draw a causal diagram (simplified): Risk -> Mortality, and Risk is associated with Treatment because of how treatments were assigned (non-randomly). 
    - Emphasize: Without accounting for risk (via stratification by hospital), we get a distorted picture.
  - **Why now?** They've seen the numbers and the paradox, now we explain why it happens.

  #### (25-35 min) The Berkeley Example: Why It's Not Ideal and What We Use Instead
  - **Goal:** Acknowledge the Berkeley example but explain why we are using a clinical example.
  - **Content:**
    - Briefly mention Berkeley (1973): Overall, men were admitted at a higher rate than women, but within most departments, women had equal or better admission rates. Why? Because women applied to more competitive departments.
    - Why we didn't use it: 
        - The numbers are more complex (many departments).
        - The context (university admissions) is less directly relevant to clinical trials.
        - The decision (admission) is not a clinical outcome.
    - We are using a clinical example because:
        - It has real-world relevance (they might see similar data in their trials).
        - The outcome (mortality) is clear.
        - The confounding (patient risk) is a common issue in observational data within trials (e.g., non-randomized comparisons, or when comparing across sites).
  - **Why now?** After they've grasped the concept with our example, we contrast with Berkeley to show the universality and also why we chose the clinical context.

  #### (35-45 min) Addressing Misconceptions
  - **Goal:** Tackle common misunderstandings as they arise.
  - **Content and Order:**
    1. **Misconception: "The overall result is always the truth."** 
       - We see that the overall result can be misleading when there is confounding. The truth is in the stratified analysis (if we are interested in the treatment effect that is not confounded).
       - Head off: After showing the reversal, explicitly state: "The overall result is a weighted average, but the weights might be uneven and related to the outcome. So we must look at subgroups when we suspect confounding."

    2. **Misconception: "Stratification is always the answer."** 
       - We'll note that stratification by the wrong variable (one that is not a confounder) can cause problems (like overstratification). But in this case, we stratified by the confounder (hospital/risk) and that revealed the true relationship.
       - Head off: When we explain why we stratified by hospital, note that we did so because hospital was associated with both treatment and outcome.

    3. **Misconception: "This only happens in observational data."** 
       - We'll note that even in randomized trials, if we look at non-randomized comparisons (e.g., by center or by patient characteristics post-randomization), we might see Simpson's paradox. But within a randomized trial, the overall treatment effect is unbiased. However, if we do an unadjusted analysis that ignores a strong prognostic factor, we might get a different estimate than an adjusted one (though usually not a reversal). The paradox is more common in observational studies.
       - Head off: When discussing the causal diagram, note that randomization breaks the link between confounders and treatment, so in an intention-to-treat analysis, the overall result is valid. But in non-randomized settings, we must adjust.

    4. **Misconception (planted by us): "Stratification always fixes everything."** 
       - We might imply that stratification is foolproof. But we'll note that if there are many strata with small numbers, we might have issues (precision). Also, we haven't discussed adjustment methods (like regression). 
       - Head off: At the end, when summarizing, we can say: "Stratification is a powerful tool, but it requires careful thought about which variables to adjust for and how to handle sparse data."

  - **Why this order?** We address each misconception as it naturally arises in the narrative.

  #### (45-50 min) Advanced Point: Odds Ratios and Risk Differences
  - **Goal:** Introduce that the paradox can occur even without confounding due to the way measures combine.
  - **Content:**
    - "Now, here's a twist: sometimes the reversal happens even in a perfectly randomized trial with no confounding. How? It has to do with the way we measure effects."
    - Explain that risk differences (RD) and odds ratios (OR) can behave differently when pooling.
    - Example: 
        - In a large randomized trial, we might see:
          Group1 (men): RD = -0.1 (B better by 10%), OR=0.5
          Group2 (women): RD = -0.1 (B better by 10%), OR=0.5
          Overall: RD = -0.1, OR=0.5 -> no reversal.

        But if the baseline risks differ and we use risk differences, we can get reversal? Not necessarily. However, for odds ratios, it's known that the marginal OR (overall) is not a weighted average of the conditional ORs (within strata) and can be reversed even when the conditional ORs are constant and there's no confounding.

    - A simple example (from Julious & Mullee, 1994):

          Group1 (large, high risk): 
            Control: 15/20 = 0.75, Treatment: 5/20 = 0.25 
            OR = (5/15)/(15/5) = (1/3)/(3) = 1/9? Actually: 
            OR = (5/15) / (15/5) ? No: OR = (success_treat / fail_treat) / (success_control / fail_control) 
            Here, if we consider event=death:
              Control: 15 deaths, 5 alive -> OR_control = 15/5 = 3 (for death in control vs treatment? Let's do:

            Treatment group: deaths=5, alive=15 -> odds of death = 5/15 = 1/3
            Control group: deaths=15, alive=5 -> odds of death = 15/5 = 3
            OR = (1/3) / 3 = 1/9.

          Group2 (small, low risk):
            Control: 2/8 = 0.25 deaths -> deaths=2, alive=6 -> odds=2/6=1/3
            Treatment: 1/8=0.125 deaths -> deaths=1, alive=7 -> odds=1/7
            OR = (1/7) / (1/3) = 3/7.

          Overall:
            Control: 15+2=17 deaths out of 20+8=28 -> odds of death: 17/11
            Treatment: 5+1=6 deaths out of 20+8=28 -> odds: 6/22=3/11
            OR = (3/11) / (17/11) = 3/17.

          Now, the conditional ORs: Group1: 1/9≈0.11, Group2: 3/7≈0.43, overall OR=3/17≈0.18 -> so no reversal? 

      Actually, a known example for OR reversal is when the OR is constant but the baseline risks differ and the overall OR reverses. But it's rare.

      Instead, use an example where the OR reverses without confounding:

        We have two strata, and in both, the treatment has an OR<1 (protective) but overall OR>1 (harmful). Example:

          Stratum1 (large):
            Control: 100/200 = 0.5 -> odds0 = 100/100=1
            Treat:  50/200 = 0.25 -> odds1 = 50/150=1/3
            OR = (1/3)/1 = 1/3.

          Stratum2 (small):
            Control: 5/10=0.5 -> odds0=5/5=1
            Treat:  1/10=0.1 -> odds1=1/9
            OR = (1/9)/1 = 1/9.

          Overall:
            Control: 100+5=105 deaths out of 210 -> odds0 = 105/(210-105)=105/105=1
            Treat: 50+1=51 deaths out of 210 -> odds1=51/(210-51)=51/159≈0.321
            OR = 0.321 / 1 = 0.321 -> still protective.

      Example from Wikipedia (Simpson's paradox in OR):

        Group1:
          Treatment: 1/10 = 0.1, Control: 10/20=0.5 -> OR = (1/9)/(10/10)= (0.111)/(1)=0.111
        Group2:
          Treatment: 100/1000=0.1, Control: 5/10=0.5 -> OR = (100/900)/(5/5)= (0.111)/1=0.111
