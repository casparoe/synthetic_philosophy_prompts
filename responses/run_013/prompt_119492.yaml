prompt: |-
  I teach a visiting session in a statistics department's methods seminar: sixty minutes, a flip chart, and an audience of graduate students and postdocs who write DAGs and use potential-outcomes notation daily but have never read a page of philosophy of causation. I want to teach them the difference between the counterfactual theory of causation and the interventionist theory — not to adjudicate between them, but to make them see that these are two theories rather than two notations for one thing, which is what they will assume walking in.

  Plan the session for me rather than explaining the material. I need the order in which the components must be introduced and why, what depends on what — bearing in mind that their fluency with interventions is an asset I can exploit and a prejudice I have to dislodge; the one case that should carry the whole hour, what it must have and what it must lack, and why the familiar illustrations (rocks thrown at windows, the sprinkler and the wet grass, the barometer and the storm) are the wrong ones for this room; the misconceptions they will form, in the order they will form them, and the precise point in the sequence at which each has to be headed off; where their own machinery — the DAG, the do-operator — should be brought in, and where it must be set aside; one question I can put to them at the end that would show whether they have grasped the distinction rather than merely followed the hour; and what I should openly tell them I am leaving out.

  I want the spine of the hour to be something they will not have met in their own literature, and I would rather you build the plan around it than around the standard contrasts: that the two theories disagree about the relata of causation — events or outcomes described at a chosen grain, on one side, against variables with a chosen range of values, on the other — and that each therefore inherits a prior, untheorised act of description, so that part of the disagreement is really a disagreement about where the carving gets done and who pays for it. Second, I want them to see that the interventionist programme is at bottom a theory of general, type-level relations which has to earn its verdicts about singular cases, whereas the counterfactual theory begins with singular cases and has to earn its verdicts about regularities. If you think that spine is wrong for this audience, or that one of the two halves will not survive sixty minutes with people who think in counterfactuals professionally, say so and give me a better one.

  For the carrying case, use the one I have in mind rather than inventing another: a database goes down during a nightly schema migration, and the outage is traced to a scheduled backup job that started while the migration was running; the operations team had earlier removed the lock that normally prevents exactly that collision; a second backup job was due to start an hour later in any case; and the post-mortem records a total but brief outage alongside a corruption signature that would have been different had the job started a minute later. Build the hour on this, and tell me what work the case does at each stage — which of its features are load-bearing for the disagreement between the two theories, which are decoration I should strip out, and what the case conspicuously fails to settle.

  Finally, be honest about the simplifications: which qualifications of each theory I will have to suppress in an hour, what a student in that room would have to unlearn afterwards, and whether the version of the distinction that survives the hour is one a philosopher would still sign.
reasoning: |-
  We are teaching the difference between counterfactual and interventionist theories of causation to an audience fluent in DAGs and potential outcomes but new to philosophy. The goal is to show that these are two distinct theories, not just two notations. The spine of the hour is two-fold:

  1. The relata of causation: events (or outcomes at a chosen grain) vs. variables (with chosen ranges).
  2. The starting point: counterfactual theory begins with singular cases and builds to regularities, while interventionism starts with type-level relations and builds to singular cases.

  We will use the provided case of the database outage.

  **Case Summary:**
  - A database goes down during a nightly schema migration.
  - The outage is traced to a scheduled backup job that started while the migration was running.
  - The operations team had removed a lock that normally prevents this collision.
  - A second backup job was due to start an hour later.
  - The post-mortem records a total but brief outage with a corruption signature that would have been different if the backup had started a minute later.

  **Plan for the Session (60 minutes):**

  **1. Introduction (5 minutes)**
     - State the goal: to show that counterfactual and interventionist theories are distinct, not just notational variants.
     - Briefly introduce the two theories without going into depth.
     - Present the database outage case as a running example. Describe it in simple terms, focusing on the key elements without the details about the second backup or the corruption signature (for now).

  **2. Starting with the Counterfactual Theory (15 minutes)**
     - **Key Idea:** Counterfactual causation is about singular events and what would have happened in the absence of the cause (or under different conditions).
     - **Relata:** Events. We must specify the exact events: the removal of the lock (event C) and the outage (event E). The grain matters: we consider the removal of the lock at a particular time, and the outage as a particular event with a specific corruption signature.
     - **Application to the Case:**
       - Ask: "Would the outage have occurred if the lock had not been removed?" The answer is no, because the lock would have prevented the backup from starting during the migration. So, the removal of the lock is a cause of the outage.
       - But note: the counterfactual theory also considers the specific details. The corruption signature is part of the effect. We can ask: "If the backup had started one minute later, would the corruption signature have been different?" The post-mortem says yes. So, the exact timing of the backup is a cause of the particular corruption signature.
     - **Misconception to Address:** The audience might think that because they use potential outcomes (which are counterfactual) in their work, they are already doing counterfactual theory. But note: in potential outcomes, we often model outcomes in terms of variables (e.g., Y(1) and Y(0)), but the counterfactual theory in philosophy is event-based and singular. We must emphasize that in the counterfactual theory, the relata are events, and the counterfactuals are about specific occurrences.

  **3. Introducing the Interventionist Theory (15 minutes)**
     - **Key Idea:** Interventionism is about variables and the effects of interventions on them. It is primarily a theory of type-level causal relations, which we then apply to singular cases.
     - **Relata:** Variables. We must define the variables and their ranges. For example:
          - `Lock`: present or removed.
          - `BackupStartTime`: on time (as it did) or delayed by one minute, or even not at all.
          - `Outage`: binary (occurred or not) or perhaps with a variable for the corruption signature.
     - **Application to the Case:**
          - We are interested in the effect of an intervention on `Lock` (setting it to present) on `Outage`. Using a DAG, we might model: Lock → BackupCollision → Outage. The intervention on Lock (setting it to present) would break the collision and prevent the outage.
          - But note: interventionism also allows us to consider the effect on the corruption signature. However, we have to define the variables appropriately. The corruption signature might be a variable with multiple levels.
          - The second backup job: if we intervene to prevent the first backup but the second backup is still scheduled, then the outage might still occur? But the case says the outage was due to the collision with the migration, and the second backup was due an hour later. So if the first backup is prevented, the migration might have completed and the second backup might not collide. But note: the migration was running when the first backup started. We have to model the timing.
     - **Misconception to Address:** The audience uses the do-operator and DAGs and might think that interventionism is the whole story. But we must note that interventionism requires a choice of variables and a model. The counterfactual theory does not require a variable set-up and can be applied directly to events.

  **4. Contrasting the Two Approaches Using the Case (15 minutes)**
     - **Relata Difference:** 
          - Counterfactual: We ask about the specific event of lock removal causing the specific outage with its specific corruption signature. The grain is fixed by the events we describe.
          - Interventionist: We choose variables. We might model `BackupStartTime` as a continuous variable? But in practice, we often discretize. The choice of variables and ranges is crucial and affects the causal conclusions.
     - **Starting Point Difference:**
          - Counterfactual: We start with the singular case. We can then ask: if locks are often removed, does that lead to frequent outages? (building to regularity).
          - Interventionist: We start with a general model (a DAG or structural equations) that represents type-level relationships. Then we apply it to this singular case by setting the variables to the observed values and doing interventions.
     - **Work the Case Does:**
          - The removal of the lock is a cause by both accounts? But note the second backup job. The counterfactual theory might say: even if the lock had been in place, the second backup might have caused an outage? But the case says the outage was due to the collision during the migration, and the second backup was an hour later. So the migration might have finished by then? We don't know. This uncertainty is important.
          - The case conspicuously fails to settle: what if the migration would have taken long enough for the second backup to collide? Then the lock removal might not have been necessary for the outage (if the second backup would have caused it anyway). The counterfactual theory requires a careful consideration of the actual scenario and the alternatives. The interventionist might model the situation with variables for both backups and the migration duration, but without data, we might not know the type-level relations.
          - The corruption signature: the counterfactual theory can easily account for the specific signature as part of the effect. The interventionist must define a variable for it. If we don't include it, we might miss that the timing of the backup caused the specific signature.

  **5. Addressing Misconceptions (5 minutes)**
     - **Order of misconceptions:**
          1. "But we use counterfactuals in potential outcomes, so it's the same." 
             - Head off in step 2: note that potential outcomes notation is a tool that can be used in both theories, but the underlying metaphysics and relata differ.
          2. "The do-operator is just a way to formalize counterfactuals." 
             - Head off in step 3: the do-operator is part of the interventionist theory, which is a specific framework that uses counterfactuals but within a variable-based, type-level system. The counterfactual theory does not require variables.
          3. "In practice, we do the same thing." 
             - Head off in step 4: the case shows that the choice of relata (events vs. variables) matters. The counterfactual theory can make finer-grained distinctions (e.g., about the corruption signature) without having to define a variable for it. But the interventionist theory provides a systematic way to handle complex systems via DAGs.

  **6. The Spine: Relata and Starting Point (5 minutes)**
     - Reiterate the two key differences using the case.
     - Emphasize: the counterfactual theory is fundamentally about events and their singular relations, while interventionism is about variables and type-level relations that we apply to singular cases.

  **7. Concluding Question (5 minutes)**
     - **Question:** "Suppose we learn that the migration would have run long enough for the second backup to start, and that the second backup would have caused an outage (with a different corruption signature). According to the counterfactual theory, is the removal of the lock still a cause of the actual outage (with its specific signature)? According to the interventionist theory, if we model the outage as a binary variable (occurred or not), is the lock removal a cause of the outage?"
     - **Expected Answers:**
          - Counterfactual: The lock removal is still a cause of the actual outage because without it, the first backup wouldn't have started when it did, and the outage at that time with that signature wouldn't have occurred. However, note that the outage might have occurred later due to the second backup. But the actual outage event (with its time and signature) would not have occurred. So yes, it is a cause of that event.
          - Interventionist: If we model the outage as binary (occurred during the night), then an intervention to leave the lock in place might still result in an outage (from the second backup). So the lock removal is not necessary for the outage (binary) and hence might not be seen as a cause in a binary model. But if we model the time of outage or the corruption signature, then it might be.

  **8. What We Left Out (5 minutes)**
     - **Suppressed qualifications:**
          - For counterfactual theory: we did not delve into the metaphysics of events, the problem of preemption, or the nuances of counterfactual semantics (e.g., Lewis's similarity ordering). We treated counterfactuals as simple.
          - For interventionist theory: we did not discuss the full requirements of a causal model (modularity, etc.), or the distinction between observational and interventional distributions. We also ignored the possibility of multiple interventions and the role of background conditions.
     - **Unlearning:** A student might come away thinking that the counterfactual theory does not use variables at all, but in fact, some counterfactual approaches (like structural models) do. We have emphasized event-based counterfactuals (Lewis-style) versus variable-based interventionism (Pearl-style). Also, we have not discussed that there are hybrid views.
     - **Philosopher's Endorsement:** The version of the distinction that survives the hour is a simplified but valid one. Philosophers would agree that the relata and the starting point are key differences, but they might note that the boundaries are not always so sharp (e.g., some interventionists adopt a counterfactual interpretation).

  **Why the Standard Cases are Wrong for This Audience:**
     - Rocks and windows: too simple, and the audience might think the theories agree (they do on this case). We need a case that brings out the differences.
     - Sprinkler and wet grass: this is often used to illustrate DAGs and confounding, so it's too familiar and might reinforce the interventionist view.
     - Barometer and storm: again, familiar for showing that correlation is not causation, but doesn't highlight the relata difference.

  **The Database Case is Ideal Because:**
     - It has specific, singular events (the lock removal at a time, the backup starting at a time, the outage with a signature).
     - It has a potential alternative cause (the second backup) that might or might not have caused an outage, allowing us to explore necessity and sufficiency in a singular setting.
     - The corruption signature depends on the exact timing, which allows us to show how the counterfactual theory can capture fine-grained events without having to define variables for every detail.

  **Final Note:** The hour is intense. We must move briskly and use the flip chart to draw the DAG for the interventionist part and to write key counterfactual questions. The case must be told in a way that the audience can follow without domain knowledge (simplify the database terms if needed). The goal is not to solve the case but to use it to illustrate the theories.
answer: |-
  ### Session Plan: Distinguishing Counterfactual and Interventionist Theories of Causation  
  **Total Time:** 60 minutes  
  **Key Spine:**  
  1. **Relata of causation:** Events (counterfactual) vs. variables (interventionist).  
  2. **Direction of generalization:** Singular cases → regularities (counterfactual) vs. type-level relations → singular cases (interventionist).  
  **Why this spine?** It leverages their fluency with interventions while forcing a confrontation with metaphysics. The database outage case makes these abstract differences tangible.  

  ---

  #### **Minute 0–5: Introduction and Case Setup**  
  - **Goal:** Frame the session’s purpose and present the database outage case.  
  - **Script:**  
    > "You use DAGs and potential outcomes daily, but today we’ll see these tools rest on two distinct theories of causation: counterfactual (e.g., David Lewis) and interventionist (e.g., Judea Pearl). They are *not* just two notations. We’ll use a real-world case to expose the difference."  
  - **Case Presentation (Simplified):**  
    > "A database fails during a schema migration. The cause is traced to:  
    > - A backup job starting mid-migration.  
    > - Operations removed a lock that normally prevents backups during migrations.  
    > - A second backup was due later.  
    > - The outage was brief but had a unique corruption signature; a 1-minute delay would have changed this signature."  
  - **Why this case?**  
    - It has **granular events** (lock removal, outage signature) for counterfactual relata.  
    - It involves **system variables** (lock status, backup timing) for interventionist relata.  
    - It **lacks deterministic laws**, forcing theories to grapple with singular causation.  
  - **Avoid standard cases (rocks, sprinklers):** They are too clean, resolve identically under both theories, and reinforce the illusion of notational equivalence.  

  ---

  #### **Minute 5–20: Counterfactual Theory – Singular Events as Relata**  
  - **Goal:** Show that counterfactual causation is about *events* and starts from singular cases.  
  - **Key Moves:**  
    1. **Define relata:** Events are specific occurrences (e.g., *this* lock removal at *this* time). Grain matters: "The corruption signature is part of the outage event."  
    2. **Apply to case:**  
       - Ask: "Would the outage *with this exact signature* have occurred if the lock hadn’t been removed?"  
       - Answer: No (lock removal is necessary for *this* outage event).  
    3. **Contrast with their training:**  
       > "You’re used to `Y(do(X))` notation, but here we ask about *this specific world*: ‘What if *this* lock had been present?’"  
  - **Work the case does:**  
    - The **corruption signature** is load-bearing: It makes the event fine-grained. The counterfactual ("a minute later → different signature") highlights singular dependence.  
    - **Strip out:** The second backup job (it’s a red herring here; address later).  
  - **Misconception to preempt (minute 15):**  
    - *"This is just potential outcomes with binary events."*  
    - **Head off:** "Potential outcomes notation *formalizes* counterfactuals but obscures the metaphysics: Here, the relata are events, not variables. We’re describing *what happened*, not a general relationship."  

  ---

  #### **Minute 20–35: Interventionist Theory – Variables as Relata**  
  - **Goal:** Show interventionism begins with type-level variables and earns singular claims.  
  - **Key Moves:**  
    1. **Define relata:** Variables (e.g., `Lock` ∈ {present, removed}, `BackupTiming` ∈ {on-time, delayed}).  
    2. **Build a DAG (audience participation):**  
       ```  
       LockRemoved → BackupCollision → OutageType  
       SchemaMigration → BackupCollision  
       ```  
    3. **Apply `do`-operator:**  
       - Ask: "What is `P(OutageType | do(LockRemoved=no))`?"  
       - Answer: If `LockRemoved=no`, the collision probability decreases, but outage *type* depends on other variables (e.g., migration duration).  
    4. **Contrast with counterfactual:**  
       > "Interventionism asks about *types* of situations. To call lock removal a cause here, we need a general rule: ‘Removing locks *in general* raises outage risk.’ Only then do we apply it to this case."  
  - **Work the case does:**  
    - The **second backup job** is load-bearing: It requires defining variables (`BackupTiming`) to handle alternatives. Without it, the distinction collapses.  
    - **Strip out:** The exact corruption signature (interventionism often coarse-grains it).  
  - **Misconception to preempt (minute 30):**  
    - *"The DAG is just a tool for counterfactuals."*  
    - **Head off:** "DAGs encode type-level assumptions. The `do`-operator answers ‘What if we *generally* set X?’ not ‘What if *this* X hadn’t happened?’"  

  ---

  #### **Minute 35–50: Contrasting Theories Using the Case**  
  - **Goal:** Force a clash on relata and generalization direction.  
  - **Key Moves:**  
    1. **Relata clash:**  
       - Counterfactual: "Lock removal caused *this* outage with *this* signature." (Events)  
       - Interventionist: "`LockRemoved` is a cause of `OutageType`." (Variables)  
    2. **Generalization direction clash:**  
       - Counterfactual: From singular (this outage) to general ("Locks prevent outages").  
       - Interventionist: From general (DAG’s structure) to singular (apply `do` to this case).  
    3. **Critical case twist:**  
       - Reveal: "The second backup would have caused an outage 1 hour later, but with a different signature."  
       - Counterfactual: "Lock removal caused *this exact outage event* (signature/time). Without it, a *different* outage might have occurred."  
       - Interventionist: "If we define `Outage` as binary (occurred/not), lock removal isn’t necessary. If we define `OutageType` (including signatures), it might be."  
  - **Work the case does:**  
    - **Load-bearing features:**  
      - Corruption signature (highlights event grain).  
      - Second backup (forces variable choice: binary outage vs. outage type).  
    - **What it fails to settle:** Whether the lock removal "caused the outage" simpliciter (depends on relata choice).  
  - **Misconception to preempt (minute 45):**  
    - *"We can make the theories agree by defining variables for events."*  
    - **Head off:** "Variables fix grain *in advance*; events let grain emerge contextually (e.g., the signature matters for diagnostics). The theories disagree on what causation *is*."  

  ---

  #### **Minute 50–55: Synthesis and Final Question**  
  - **Synthesis:**  
    > "Counterfactual theory: Causation is singular dependence between events. Interventionist theory: Causation is defined by how variables respond to *ideal interventions* in a model."  
  - **Final Question (test understanding):**  
    > "Suppose the post-mortem shows the second backup would have caused an identical outage signature. According to each theory, is lock removal a cause of the outage? Why?"  
    - **Expected Answers:**  
      - Counterfactual: "Yes, because *this* outage (with its timing/signature) wouldn’t have occurred."  
      - Interventionist: "Depends on variable choice. If `Outage` is binary, no (outage was inevitable). If `OutageSignature` is a variable, possibly yes."  
    - **Why it works:** It forces them to see relata choice as decisive, not derivable from notation.  

  ---

  #### **Minute 55–60: What We Left Out and Wrap-Up**  
  - **Suppressed Simplifications:**  
    - **Counterfactual:** Ignored preemption, transitivity, and context-sensitivity of events.  
    - **Interventionist:** Ignored model indeterminism (e.g., non-parametric DAGs) and what counts as an "intervention."  
  - **Unlearning Warning:**  
    > "Today we treated the theories as monolithic. In reality:  
    > - Some counterfactual theories use variables (e.g., structural equations).  
    > - Interventionism can incorporate singular cases (e.g., single-world intervention graphs).  
    > But the core disagreement—events vs. variables, singular vs. general—is real and unresolved."  
  - **Philosopher’s Endorsement:**  
    > "A philosopher would sign this: We’ve shown causation is theory-laden. The ‘carving’ of reality (events/variables) isn’t neutral—and who does it (engineer vs. philosopher) changes what ‘cause’ means."  

  ---

  ### Why This Spine Works  
  - **Leverages their fluency:** Uses DAGs/`do`-operator as a bridge but subverts them to expose metaphysics.  
  - **Survives their expertise:** The case’s granularity (signature, timing) forces counterfactual theorists to confront description-dependence, while interventionists confront underdetermination of variables.  
  - **Alternative spine?** If pressed for time, focus solely on relata—it’s more disruptive to their notation-as-neutral view. But the hour accommodates both.  

  **Outcome:** They leave seeing causation as a philosophical choice, not a notational one.
