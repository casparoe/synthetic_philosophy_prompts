  The marking scheme should penalize: miscalculating individual competence (3 marks), not comparing actual vs CJT reliability (6 marks), missing why independence fails (5 marks), not explaining why adding voters doesn't help (4 marks), and shallow treatment of evaluative questions (4 marks). Plus 3 for writing quality. Classic errors include conflating the 0.7 expert reliability with voter competence, or assuming independence holds because judgments feel "individual." 

