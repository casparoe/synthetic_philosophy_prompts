answer: |-
  ### Scratch Section: Candidate Commitments and Filters  
  *Securely attested in Buridan's writings:*  
  - The intellect judges the good; the will chooses under the intellect's practical judgment.  
  - The will cannot choose between options judged *equal in every respect* by the intellect. Suspension of choice (*akrasia* without weakness) is necessary.  
  - Equality of judgment must be *total*: no discernible advantage in any feature (e.g., two identical hay bundles).  
  - Choice requires a "conquering reason" (*ratio victrix*)—a judgment of superior goodness.  

  *Inferred from principles, less explicit:*  
  - The will cannot act without *some* intellective judgment favoring one option (even if non-instrumental).  
  - "Higher-order" choices (e.g., adopting a rule) require their own *ratio victrix*.  
  - Practical necessity (e.g., avoiding starvation) might compel re-evaluation, but not create preference *ex nihilo*.  

  *Set aside (unsupported):*  
  - That Buridan endorsed random choice as a solution.  
  - That theological concepts (e.g., divine grace) resolve ties.  
  - That "incomplete" preferences (no judgment) differ structurally from ties (explicit equality).  

  ---

  ### Reconstruction: Buridan’s Core Commitments  
  1. **Intellect and Will**: The intellect presents options with evaluations; the will is a passive power moved only by the intellect’s judgment of the greater good. If two options are judged *equally good in all respects*, the intellect cannot issue a preferential judgment.  
  2. **Equality and Paralysis**: Total equality paralyzes the will. Choosing without a *ratio victrix* is impossible—not irrational, but *metaphysically blocked*. This is explicit in Buridan’s ethics (e.g., *Quaestiones super decem libros Ethicorum*).  
  3. **Suspension as Default**: Inaction persists until the intellect perceives asymmetry (e.g., new information, changing circumstances).  
  4. **No Arbitrary Choice**: "Picking" without reason is not choice but chance or coercion. Rationality requires intellective grounding.  

  ---

  ### Prediction: Buridan on Modern Problems  
  **1. Tie-breaking in allocation systems**  
  - Buridan would reject lottery-based tie-breaking as a *solution* to indifference. If two candidates are truly equal, the intellect *cannot* command a choice. A lottery does not resolve the equality; it *imposes* an extrinsic factor. The system’s designers might have a *ratio victrix* for fairness (e.g., "randomness is equitable"), but the *agent* (e.g., school committee) choosing the rule must itself have a reason to prefer randomness over other tie-breakers (e.g., alphabetic order). If no such reason exists, adopting the rule is impossible.  

  **2. Rationality of arbitrary choice**  
  - He would deny that arbitrary choice among equals is rational. Contemporary decision theory treats indifference as "permission to pick," but Buridan sees it as *prohibition*. Regret is not an error—it reflects the *absence* of a proper basis for choice. A "stable tie-breaking rule" merely shifts the need for a *ratio victrix* to the rule-selection stage.  

  **3. Standing policies and generated preferences**  
  - Adopting a standing policy *does* escape the original tie—but only if the agent has a *ratio victrix* for the policy itself (e.g., "decisiveness prevents greater harm"). This generates a new, higher-order preference. Crucially, this policy *replaces* suspension only if the intellect judges the policy superior to inaction. Buridan would accept this as consistent: the policy provides a conquering reason where none existed.  

  **4. Irreversible choices and forced amendments**  
  - In sequential choices with no option for delay (e.g., organ allocation), Buridan’s system breaks down. His smallest amendment: **Necessity compels re-evaluation**. Faced with unavoidable action (e.g., death if no choice), the intellect *reinterprets* the options: "choosing *either* avoids catastrophe," making one option instrumentally superior to inaction. This "lesser evil" framework (within his ethics) could extend to ties—choosing randomly becomes *good* because *not choosing* is worse. Yet this concedes that indifference is overridden by context, not resolved.  

  ---

  ### Strongest Objection to My Prediction  
  **Objection**: *Buridan’s paralysis is practically absurd in irreversible choices. If he amends his view to allow necessity-based choice, he collapses into consequentialism—undermining his insistence that the will acts only on intellective judgments of comparative goodness. Random choice still lacks a* ratio victrix *between options.*  
  - **Response**: Buridan might counter that necessity *alters the intellect’s judgment*: the good of "acting to avoid disaster" becomes a *feature* attached to both options, breaking symmetry. But this is ad hoc. His framework resists modern efficiency demands.  

  ---

  ### Where I Am Least Confident  
  1. **Rule Adoption as Higher-Order Preference**: Whether Buridan would accept "decisiveness" or "fairness" as a sufficient *ratio victrix* is unclear. His examples focus on object-level goods (safety, sustenance), not meta-values.  
  2. **Incomplete vs. Equal Preferences**: Modern distinctions ("no ranking" vs. "tie") might not map to his psychology. He assumes the intellect *always* judges options comparably—even if concluding "equal." True incomparability may not fit his model.  
  3. **Amending for Necessity**: Whether he would permit context to *create* preferences remains speculative. His amendment might instead be: "Total equality never occurs in practice," avoiding the problem.  

  ---

  ### Buridan’s Likely Rejections and Modern Pushback  
  - **Buridan rejects**: The modern claim that *arbitrary choice is rational*. For him, rationality is intellect-governed; randomness is non-rational.  
  - **Modern readers reject**: Buridan’s *strict paralysis thesis*. It seems to ignore (a) the costs of inaction, (b) the rationality of meta-preferences for decisiveness, and (c) the viability of randomization as a procedural norm. His model appears "brittle" outside static, atomized choices.
