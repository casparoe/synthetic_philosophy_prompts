  ### Case: Convergent Enzymes in Synthetic Metabolic Pathways

  In synthetic biology, researchers engineer metabolic pathways in industrial yeast (*Saccharomyces cerevisiae*) to produce a high-value compound, Z. Two independent research groups design distinct enzymes—*Synthase-A* and *Synthase-B*—that catalyze identical reactions converting precursor W to Z. Both enzymes achieve this through radically different protein folds (α-helical vs. β-barrel structures) and catalytic mechanisms (acid-base vs. radical-based chemistry), yet they exhibit identical substrate specificity, reaction kinetics, and thermodynamic efficiency due to convergent evolution under shared selection pressures in the engineered chassis. *Synthase-A* is derived from a fungal ancestor via directed evolution, while *Synthase-B* is designed *de novo* using computational protein folding algorithms and lacks any evolutionary lineage. The International Union of Biochemistry (IUB) classifies both enzymes as "Z-synthases" based solely on functional equivalence in industrial applications, overriding phylogenetic dissent.  

  **Verdicts and Reasoning:**  
  1. **Intrinsic-cluster account (YES)**:  
     The category "Z-synthase" is a natural kind because both enzymes share a cluster of intrinsic properties: identical catalytic function (W→Z conversion), reaction kinetics, and thermodynamic profiles. These properties are sustained by mechanistic convergence—natural selection in *Synthase-A* and algorithmic optimization in *Synthase-B*—ensuring stability. *Key feature*: Functional convergence without structural homology. If removed (e.g., enzymes share identical structures), the verdict remains YES but loses tension with origin.  

  2. **Origin account (NO)**:  
     "Z-synthase" is not a natural kind because *Synthase-A* and *Synthase-B* lack a shared causal history. The former arises from Darwinian evolution in fungi; the latter is an ahistorical product of human computation. No common causal chain (e.g., descent, lateral transfer) unites them. *Key feature*: Divergent origins (biological evolution vs. *de novo* design). If removed (e.g., both enzymes evolved naturally), origin likely says YES.  

  3. **Ratification account (YES, non-reducible)**:  
     The IUB’s classification licenses "Z-synthase" as a kind for industrial biochemistry. Their procedure prioritizes utility-driven criteria (e.g., functional interchangeability in biomanufacturing) over intrinsic or historical properties. This ratification is irreducible to intrinsic clustering because the IUB explicitly *ignores* structural dissimilarity and evolutionary origins, focusing on pragmatic needs (e.g., standardizing metabolic engineering protocols). *Key feature*: Authoritative prioritization of utility over ontology. If removed (e.g., no IUB-like body), ratification collapses.  

  **Origin Theorist’s Strongest Reply**:  
  The origin theorist argues that the shared intrinsic properties *are* traceable to a common cause: the engineered yeast environment. Selective pressures in the chassis (e.g., optimal Z yield) causally explain both enzymes’ convergence, unifying them under a higher-order historical kind (e.g., "adaptations to industrial chassis Y").  

  **Does This Reply Land?**  
  No. The yeast environment is a *general* boundary condition, not a *specific* causal history producing shared ancestry or lineage. *Synthase-B*’s *de novo* design involves no historical continuity with biological evolution—it is generated algorithmically. The origin account requires discrete causal chains (e.g., mutation, inheritance), not broad selective contexts. Conflating "common cause" with "shared causal history" stretches origin beyond its core commitment to historical particularity.  

  **Outcome**: The disagreement persists. The origin theorist cannot absorb the case into their framework without weakening their position to include any shared external pressure—a move that risks collapsing origin into functionalism.
