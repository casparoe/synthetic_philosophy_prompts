  We are constructing a case in the domain of microbiology or biochemistry. Let's consider a category of enzymes involved in a particular metabolic pathway. 

  **Case Description:**  
  In a certain bacterial species, *Bacterium exemplaris*, researchers identify a set of enzymes that catalyze the conversion of substrate X to product Y. These enzymes share a high degree of structural similarity (in their active sites) and functional similarity (they all catalyze the same reaction). However, genetic analysis reveals that these enzymes are encoded by two distinct sets of genes with no common evolutionary ancestor: one set (Group A) is vertically inherited from the bacterial ancestor, and the other set (Group B) was acquired via horizontal gene transfer from an archaeal species. The enzymes from Group A and Group B are structurally and functionally convergent: they have independently evolved to catalyze the same reaction in the same organism. 

  Now, the scientific community, through a standing committee (say, the Enzyme Nomenclature Committee of the International Union of Biochemistry and Molecular Biology, IUBMB), is tasked with classifying enzymes. The committee decides to classify both Group A and Group B enzymes under a single category, "X-Y lyases", because they catalyze the same reaction and are functionally interchangeable in the organism's metabolism. 

  **The Category in Question:** The category "X-Y lyases in *Bacterium exemplaris*" that includes both Group A and Group B enzymes.

  **Verdicts by the Three Accounts:**

  1. **Intrinsic-cluster account (says YES):**  
     The kind is defined by a cluster of intrinsic properties: the catalytic function (converting X to Y) and the structural features of the active site (which are similar enough to allow the same reaction). There is a mechanism sustaining the cluster: the reaction mechanism and the structural requirements for binding substrate X and catalyzing the cleavage to Y. Thus, both Group A and Group B enzymes share this cluster of intrinsic properties and are sustained by the same biochemical mechanism. Therefore, the intrinsic-cluster account says that the category "X-Y lyases" is a natural kind.

  2. **Origin account (says NO):**  
     The origin account requires a shared causal history. However, Group A and Group B enzymes have entirely different evolutionary origins: one from the bacterial lineage and the other from an archaeal lineage via horizontal transfer. There is no common causal history that unites them. Therefore, the origin account denies that the category "X-Y lyases in *Bacterium exemplaris*" is a natural kind because the members do not share a common ancestry.

  3. **Ratification account (says YES, and not reducible to intrinsic):**  
     The ratification account looks to the authorized classificatory procedure. The IUBMB committee, which is the authorized body for enzyme classification, has decided to group both Group A and Group B enzymes under the same category because of their shared function and the practical needs of biochemistry (e.g., in metabolic engineering, one might want to replace one with the other without affecting the pathway). The committee's decision is based on functional equivalence and practical utility, not on intrinsic structural similarity per se (though that similarity is present). Moreover, the committee might explicitly note that the structural similarities are convergent and not due to common descent, but they still classify together because of function. Thus, the ratification account says that the category is a kind because the authorized procedure licenses it. The reasons for the committee's decision (functional equivalence and practical utility) do not reduce to the intrinsic cluster because the committee is also aware of the divergent origins and could have chosen to split them (but didn't). The decision is based on the needs of the science (biochemistry) which prioritizes function over origin in this context.

  **The Key Feature of the Case:**  
  The key feature is the functional convergence (due to independent evolutionary origins) in the context of a classification system that prioritizes function over evolutionary origin. This creates a situation where the intrinsic properties (function and structure) are shared, but the causal histories are distinct. 

  **What Happens if the Key Feature is Removed?**  
  If there were no functional convergence (i.e., if the enzymes had the same function because of shared ancestry), then the intrinsic-cluster and origin accounts would both say YES, and the ratification account would also say YES but for reasons that might then be reducible to either intrinsic or origin. The disagreement among the accounts would disappear. 

  **The Strongest Reply from the Origin Theorist:**  
  The origin theorist might argue that the shared intrinsic structure (the similar active sites) is actually the result of a common cause: the selective pressure of the environment (the presence of substrate X and the need to convert it to Y). Thus, they might say that the common cause (the environmental pressure) unites the two groups and that the kind should be understood as having a shared causal history after all. 

  **Does This Reply Land in the Case?**  
  In this case, the origin theorist's reply does not fully succeed. The environmental pressure is a common cause only in a very broad sense. The origin account typically requires a specific type of causal history, such as common ancestry or a shared causal chain of events that lead to the properties. The environmental pressure is a general cause that independently acted on two separate lineages. It does not create a shared causal history in the way that common ancestry does. Moreover, the origin account as defined requires "shared causal history" and typically that is interpreted as a historical chain of events that is shared (like common descent). The environmental pressure is not a shared chain of events but an independent cause on two separate chains. Therefore, the origin theorist cannot convert the shared intrinsic structure into a common cause of the required type without stretching the notion of "shared causal history" beyond its intended scope. 

  Thus, the origin theorist must maintain that the category is not a natural kind because the two groups lack a shared causal history in the required sense. The divergence of verdicts remains.
