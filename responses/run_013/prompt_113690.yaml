answer: |-
  You've diagnosed a subtle and pervasive historiographical pattern that deserves precise naming. It's distinct from Whig history, presentism, anachronism, and hindsight bias, though related. Let's carve it:

  **The Concept:** **Terminus-Driven Historiography** (or **Terminal Selection Bias**)

  **Definition:** *The structuring of a historical narrative, particularly in its selection of events/figures, allocation of detail, and implicit causal framing, such that the narrative space and significance granted to past elements are disproportionately determined by their perceived direct relevance to, or resemblance with, a specific, privileged endpoint (usually the present state of a field, institution, concept, or the subject's later fame), regardless of contemporary significance, duration, or alternative historical pathways.*

  **Why this term?**
  1.  **Terminus:** Explicitly names the privileged endpoint as the driving force.
  2.  **Driven/Selection Bias:** Focuses on the *mechanism* – the narrative architecture (selection, proportioning) is dictated by the terminus.
  3.  **Historiography:** Specifies this is a mode of *writing* history.

  **How it differs from established concepts:**
  *   **Whig History:** Whiggism is a *subset* of terminus-driven history where the terminus is *explicitly valorized* (progress, improvement, triumph). Your examples lack this triumphalism; the terminus can be lamented (university example) or neutral (biography). Whiggism judges past actors morally relative to the present; terminus-driven history judges them *narratively* (space granted) based on terminus relevance.
  *   **Presentism:** Primarily concerns *evaluative judgment* – condemning/approving past actions/ideas using current moral/scientific standards. Terminus-driven history is about *narrative construction* – what gets included and emphasized. An author can avoid presentist judgment (e.g., not calling phrenologists "stupid") yet still relegate them to a footnote due to terminus irrelevance.
  *   **Anachronism:** Involves *misattributing* modern concepts, values, or motivations to the past. Terminus-driven history involves *structuring the narrative around* the modern concept without necessarily misattributing it. The phrenology paragraph might accurately *describe* it but fails to *explain* its contemporary significance due to terminus-filtering.
  *   **Hindsight Bias:** A *cognitive error* about predictability ("it was obvious this would happen"). Terminus-driven history is a *narrative strategy* or *structural bias* in writing. Hindsight bias makes the path *seem* inevitable; terminus-driven history makes the path *appear* as the *only relevant path* by silencing alternatives.

  **Boundary Cases & Testing:**
  1.  **History of a Defunct Institution (e.g., the Hanseatic League):**
      *   **Escapes?** *Potentially, but not necessarily.* If the narrative is structured purely around the League's internal logic, rise, operation, and decline within its *own* context, treating its end as *an* outcome rather than *the* destination leading to something modern (e.g., modern trade unions, EU), it can escape. However, if the narrative subtly frames it as a "precursor" to modern capitalism or international law, giving disproportionate space to elements that seem to foreshadow those, the terminus (the modern concept) is still driving.
  2.  **Decline Narrative (e.g., "The Fall of Rome" as a warning):**
      *   **Still Terminus-Driven?** **Yes.** The "warning" aspect often implies "this led to *our* precarious present" or "this is how *we* might fall." The narrative is still organized around explaining how the past (Rome) led to a specific state relevant *now* (its fall as a lesson). The terminus (the fall/lesson for us) dictates selection: events directly contributing to the fall get emphasis; periods of stability or alternative paths get less. The valence is negative, but the structure is terminus-centric.
  3.  **Genuinely Non-Terminus-Centered History:**
      *   **Is it Possible?** **Yes, as an ideal approached with effort.** It looks like:
          *   **Contemporary Context Emphasis:** Focusing on the *questions, problems, resources, and worldviews* available to historical actors *at the time*. Why did phrenology make sense *then*? What institutional pressures shaped the medieval *studium* unrelated to modern research? What occupied those 30 "lost" years for the biographee?
          *   **Symmetry Principle:** Applying the same standards of explanation and significance to *all* periods/ideas studied, regardless of their terminus relevance. Phrenology gets as much analytical depth as the "correct" theory *if* it held similar contemporary sway.
          *   **Path Dependency & Contingency:** Highlighting moments of choice, accident, or forgotten alternatives. Showing how the path *actually taken* was not the only possible one, and reconstructing those lost paths without judging them by the terminus.
          *   **Problem-Histories ("Problematique" Histories):** Tracing the evolution of a specific *problem* (e.g., "the nature of inheritance," "university autonomy") across time, examining diverse solutions (successful or not) on their own terms, without assuming a linear progression to the modern answer.
      *   **The Present's Inevitable Influence:** The *choice* of topic (physiology, universities, a famous person) is always made from the present. The *availability* of sources is filtered by time. Complete neutrality is impossible. However, a *conscious effort* to minimize terminus-driven structure in the *narrative architecture* itself is feasible and distinguishes rigorous history. The author writes *from* the present but strives not to write *for* the present's self-justification.

  **Refinement: The Underlying Mechanism - Retrospective Salience Filtering**
  The core *mechanism* within terminus-driven historiography is **Retrospective Salience Filtering**. Historical elements are filtered based on their *salience* (narrative visibility, detail) *as viewed retrospectively* from the terminus. What was *hugely salient* contemporaneously (phrenology) becomes narratively insignificant; what had *marginal* contemporary salience but *resonates* with the terminus gets amplified. This filtering distorts the historical landscape's proportions.

  **In Summary:**

  *   **Name:** **Terminus-Driven Historiography** (Primary) / **Retrospective Salience Filtering** (Core Mechanism)
  *   **Definition:** Narrative distortion where selection, proportioning, and causal emphasis are dictated by the relevance of past elements to a privileged endpoint (usually the present), irrespective of their contemporary significance.
  *   **Key Differentiator:** It's about *narrative architecture* (space, focus), not necessarily progressive evaluation (Whiggism) or moral judgment (Presentism).
  *   **Boundaries:**
      *   Defunct Institutions: Can escape if framed entirely within their own temporal context.
      *   Decline Narratives: Still terminus-driven (terminus = the fall/warning).
      *   Non-Terminus History: Possible through contextualism, symmetry, and contingency-focus, though always influenced by the present perspective.

  This pattern is remarkably common because the present *is* the vantage point, and crafting a coherent narrative often subconsciously privileges elements leading "here." Naming it **Terminus-Driven Historiography** gives you the tool to dissect this specific architectural flaw in historical writing.
