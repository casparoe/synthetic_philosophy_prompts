prompt: |-
  im putting together notes on when everyday conventions — tipping, queueing, not jaywalking — are actually moral obligations and not just local habits, and whether a visitor who wasn't raised with them has to play along. id like the desiderata for a theory that answers this: what it has to get right (the tourist who jaywalks in a city where literally everyone does it, the visitor who doesn't tip where tipping's expected, the harmless local custom that costs you nothing to follow but means nothing to you), which distinctions it can't blur (coordination vs. genuine obligation, following a norm vs. being a jerk for not following it, local expectations vs. what people are actually owed), and any facts about how conventions work that it can't contradict — say, that some only function if nearly everyone complies while others survive defectors.

  then tell me which single requirement does the most to rule out the easy answers (like "conventions are just whatever people expect" or "you only owe others what they're entitled to independent of any custom"), and flag any two requirements you think pull against each other. finish with a line each on how a straight "when in Rome" view and a "conventions don't bind outsiders" view fare against the list.
reasoning: |-
  Okay, the user is compiling notes on everyday conventions like tipping, queueing, and jaywalking, examining when these are moral obligations rather than just habits. They want criteria for a theory that distinguishes between these cases and addresses whether visitors should comply. 

  First, I need to outline what the theory must explain. The examples given are key: a tourist jaywalking where it's common, not tipping where expected, and following harmless customs. The theory needs to handle these without blurring lines like coordination vs. obligation, or norms vs. being a jerk. Also, it must account for how conventions work—some rely on near-universal compliance, others don't.

  The user also wants to know which requirement rules out simplistic answers. Easy answers like "conventions are just expectations" or "owe only entitlements independent of custom" need to be challenged. The requirement that does this best is probably the one about conventions creating moral reasons beyond expectations or entitlements. For example, tipping isn't just expected; it's tied to fair wages, so not tipping exploits workers.

  Then, are there conflicting requirements? The need for coordination vs. avoiding undue burdens might clash. For instance, queueing requires compliance to function, but in places where it's scorching, standing in line might be overly burdensome. The theory has to balance these.

  Assessing "when in Rome" versus "conventions don't bind outsiders": "When in Rome" handles coordination and respect well but might impose undue burdens or ignore exploitation. The outsider view avoids unfair burdens but fails coordination and exploits local systems like tipping.

  Underlying needs: The user might be seeking a principled way to navigate cultural norms without feeling pressured unnecessarily or ignoring genuine moral duties. They could be a traveler, student, or writer looking for ethical frameworks. They need clarity on when compliance is morally required versus optional, respecting local practices without being exploited.
answer: |-
  Here’s a structured breakdown of desiderata for your theory on conventions and moral obligations, followed by an evaluation of key perspectives:

  ### **Core Desiderata: What the Theory Must Get Right**
  1. **The "Harmless Custom" Case**:  
     *Must explain why following trivial, low-cost customs (e.g., removing shoes indoors) is often expected, even when no deep moral stake exists.*  

  2. **The "Defector in Coordination" Case**:  
     *Must distinguish between norms that collapse without near-universal compliance (e.g., queueing) vs. those resilient to defectors (e.g., fashion trends).*  

  3. **The "Unjust Expectation" Case**:  
     *Must flag when compliance perpetuates harm (e.g., tipping subsidizing poverty wages) vs. when it supports fairness (e.g., tipping where wages rely on it).*  

  4. **The "Outsider’s Impact" Case**:  
     *Must address whether ignorance excuses non-compliance (e.g., tourist jaywalking safely where locals do) vs. when it causes unintended harm (e.g., not tipping a struggling server).*  

  5. **The "Meaningless Token" Case**:  
     *Must resolve whether symbolic acts (e.g., greeting rituals) obligate outsiders if they signify respect locally, even if the outsider feels no such meaning.*  

  ---

  ### **Critical Distinctions the Theory Can’t Blur**
  - **Coordination ≠ Moral Duty**:  
    Queueing enables efficiency but isn’t inherently "moral"; cutting in line is rude, not evil.  
  - **Norm-Following vs. "Being a Jerk"**:  
    Refusing a harmless custom (e.g., not bowing in Japan) may not violate ethics but can show disrespect.  
  - **Local Expectation vs. Entitlement**:  
    A waiter *expects* a tip but isn’t *entitled* to one unless systemic injustice makes it necessary (e.g., tipped wages).  

  ---

  ### **Non-Negotiable Facts About Conventions**
  - **Fragility of Coordination Norms**:  
    Queueing fails if >10% defect; jaywalking norms tolerate high defection if safe.  
  - **Symbolic Weight ≠ Universal Meaning**:  
    A handshake signifies agreement in some cultures, politeness in others—outsiders may misunderstand.  
  - **Norms Embed Power Dynamics**:  
    Tipping shifts wage burden to customers; jaywalking laws may target marginalized groups.  

  ---

  ### **Key Requirement That Rules Out Easy Answers**  
  **"Conventions must create *pro tanto* moral reasons beyond mere expectation or baseline entitlement."**  
  - **Why it works**:  
    Dismisses "just expectations" (e.g., "everyone tips here" isn’t sufficient) and "only entitlements" (e.g., waiters may deserve living wages *via* tips due to unjust systems).  
  - **Example**: Not tipping in the U.S. isn’t merely rude; it exploits a broken system. Jaywalking safely where universal ignores the rule? No moral harm.  

  ---

  ### **Two Conflicting Requirements**  
  1. **Requirement of Fairness**:  
     *Don’t burden individuals unfairly* (e.g., forcing tourists to tip 20% when locals tip 10%).  
  2. **Requirement of Coordination**:  
     *Sustain norms essential for social function* (e.g., queueing requires universal buy-in).  
  - **Conflict**: Strict queueing in extreme heat may unfairly burden the elderly tourist, yet allowing cuts undermines coordination. The theory must weigh context.  

  ---

  ### **Evaluation of Competing Views**  
  - **"When in Rome"**:  
    Excels at coordination and respect for harmless customs (*Requirement 5*), but fails the "Unjust Expectation" case (e.g., obliging caste-based norms) and ignores fairness burdens.  

  - **"Conventions Don’t Bind Outsiders"**:  
    Avoids undue burdens (*Fairness*), but collapses in coordination-dependent cases (e.g., skipping queues) and ignores when defection harms locals (e.g., not tipping where wages rely on it).  

  ### **Conclusion**
  A robust theory must **distinguish functional coordination from moral deserts**, recognize **systemic harms embedded in norms**, and accept that *sometimes*, being a "jerk" is less bad than complicity in injustice—but refusing harmless tokens often needlessly fractures trust. Context dominates, but impact on vulnerable parties outweighs local expectations.
