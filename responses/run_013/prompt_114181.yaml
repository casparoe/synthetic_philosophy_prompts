prompt: |-
  My mum is 81 and has finally gotten round to redoing her will, and I've realised I have no idea what I actually think about any of it, so I want to use someone else as a mirror before the arguing starts. The someone is my uncle Ray — retired tax lawyer, opinionated about everything, and he is going to sound off about this at Christmas whatever we do, so I'd like to know in advance what he'll say and whether he'll even be consistent about it.

  What's in play: mum's estate is about $9m. A house she bought in 1986 in a city where the market went insane, a big index fund account, a 25% stake in the little office building her late partner's family owns, and shares in a private company from way back. She wants to split the whole thing outright between me and my sister, no trusts, no conditions, "so you two can do whatever you like with it." Neither of us is rich but we're both fine — I'm a physio, my sister runs a small design studio. Two things I've learned in the last month that I didn't know before: if mum sold the index funds tomorrow she'd owe an enormous amount in capital gains, but if she just holds them till she dies the basis resets and we inherit all that gain tax free, which is apparently a much bigger giveaway than anything the estate tax would have taken; and the federal exemption is high enough that she'd pay nothing federally, but our state's threshold is way lower, so there'd definately be a state bite.

  Ray's track record, as best I can piece it together from arguements at family dinners:

  - A neighbour died leaving about $1.2m, split outright between three kids. Ray: no problem, that's just a family getting by, nobody's buying a yacht.
  - His old firm's senior partner set up a trust paying income to his kids for life, then to his grandkids for life, principal never distributed, family trustee company, all of it designed to stay out of estate tax for two generations. Ray went on about this for an hour: it's a dynasty, it ought to be illegal, this is how you get an aristocracy.
  - His cousin's farm, 600 acres, maybe $6m, left to the son who's worked it since he was fourteen, with cash to the other two kids. Ray: obviously right, "the boy did the work, that land is his."
  - A friend who left everything to a foundation and nothing to two perfectly comfortable children. Ray: fine, his money, his call.
  - A brother in law who left $400k to a nephew he'd barely met, because the nephew had visited him every week for the last three years of his life. Ray thought that was lovely.
  - Also, for what it's worth, Ray has a trust of his own for his grandkids' education, capped at $200k each, ends at 25. When my sister pointed that out he said it's not the same thing at all, which I don't think is an argument.

  My instinct was that Ray is against big inheritances, full stop. But the farm seems to contradict that unless he's got some exception for cases where the heir "earned" it, and now I can't tell whether the thing he actually hates is the size, or the trusts and the dead hand and the two generations of control, or people getting money they didn't work for, or just tax avoidance schemes specifically.

  So: what will Ray say about mum's plan? Which rule is he actually running, and which other rules fit his five verdicts just as well? If the rules disagree about mum's plan, which one should I bet on, and why? And then tell me what case would actually settle it. My own idea was to suggest to mum that she put the money in a trust that only pays out if me and my sister hit certain milestones — finish the physio masters, keep the studio going five years, that kind of thing — and I want to know whether that would sort Ray out in a way the outright plan doesn't, or whether it's a dud test. If there's a better case for separating the rules, tell me what it is and what each rule predicts about it.
reasoning: |-
  Okay, I need to figure out what Uncle Ray, the retired tax lawyer, will say about my mum's $9 million estate plan. She wants to split everything outright between me and my sister, no trusts or conditions. Ray's been vocal about other cases, so I need to predict his reaction and understand his underlying principles.

  First, let's recap Ray's past opinions:

  1. **Neighbor's $1.2m split among three kids**: Ray had no problem, saying it's just helping family get by.
  2. **Senior partner's dynasty trust**: Ray was against it, calling it aristocracy-building and tax avoidance.
  3. **Cousin's farm left to the working son with cash to others**: Ray approved, emphasizing the son earned it.
  4. **Friend leaving everything to charity, nothing to kids**: Ray thought it was fine since it's the person's money.
  5. **Brother-in-law leaving money to a helpful nephew**: Ray found it lovely.
  6. **Ray's own trust for grandkids' education**: He defends it as different, but it's still a trust.

  Now, Mum's situation: $9m split outright. Key points are the capital gains reset at death (saving taxes) and state estate taxes applying. Ray hates tax avoidance schemes, but this isn't a complex trust—it's a straightforward inheritance. The farm example shows he supports inheritances when the heir "earned" it, but here neither my sister nor I worked for Mum's assets. The nephew case had sentimental reasons, which might not apply here. 

  Ray's principles seem to be:
  - Against perpetual trusts that avoid taxes across generations (dynasty aspect).
  - For inheritances that are reasonable in size or have a moral justification (like the farm or the nephew's care).
  - Believes people should control their money but dislikes excessive wealth preservation.

  For Mum's plan, Ray might be conflicted. The outright transfer avoids the "dead hand" control he dislikes, but $9m is large. He might argue it's too much for "getting by," unlike the neighbor's case. The tax savings from stepped-up basis could irk him as a loophole, even though it's not an aggressive trust. 

  If I suggest a trust with milestones (e.g., finishing my masters), Ray might see it as controlling from beyond the grave, which he criticized in the dynasty trust. Or he might view it as incentivizing responsibility, aligning with his appreciation for earned benefits. But since his own trust is limited (education, capped), he might accept it if it's not perpetual.

  To test his rules, propose a scenario: leaving $10m outright to a lazy heir versus a trust paying for education. The lazy heir might trigger his "unearned wealth" dislike, while the trust could be seen as responsible. If he prefers the trust here, it clarifies he values merit over size. But if he still dislikes the trust as controlling, then his main issue is autonomy.

  Betting on Ray's reaction: He'll likely support Mum's plan because it's simple and respects her wishes, but criticize the tax loophole. He might suggest charitable donations to reduce the estate or gifting now to use exemptions. His consistency hinges on whether the inheritance feels "earned" or justified. Since Mum's assets weren't worked for by us, he might grumble but ultimately defer to her choice as the friend's charity case.

  Settling it: Ask Ray about a hypothetical where someone leaves $5m to a caregiver versus split equally among kids. If he prefers the caregiver (like the nephew), then emotional justification matters. If he prefers equal split, then family fairness is key. In Mum's case, equal split to capable kids might be fine by him.
answer: |-
  Based on Ray's track record and the principles that consistently explain his past reactions, here's a breakdown of his likely stance on your mum's plan, the "rules" he operates by, and how to test them. I'll also address your milestone trust idea and suggest a better hypothetical to clarify his reasoning.

  ### **1. What Ray Will Say About Mum's Plan**
  - **Likely Verdict:** Ray will **support your mum's outright split** between you and your sister, but with a major caveat: he'll criticize the *tax inefficiency* and potentially suggest reducing the estate size to avoid state taxes.  
  - **Key Arguments He'll Make:**
    - **"Her money, her choice"**: He'll emphasize autonomy (as with the friend who left everything to charity). Since your mum wants you both to "do whatever you like with it," Ray will respect that.
    - **No "dead hand" control**: He’ll approve of the lack of trusts/conditions, avoiding the "dynasty" problem he hated in the senior partner’s case.
    - **But the size triggers tax waste**: He’ll rant about the "obscene" capital gains loophole (step-up in basis) and the state estate tax hit. He’ll argue, "Your mum’s letting the government win by not planning. She could gift assets now, donate to charity, or set up a *simple* trust to shrink the estate and save $XXX,XXX in state taxes—but she’s being lazy!"  
    - **Moral defensibility**: He’ll contrast this with the farm ("you didn’t earn it") but justify it as "just kids inheriting from Mum" (like the neighbor’s $1.2M split). Since you’re both "fine" but not rich, he won’t call it "aristocracy."

  ### **2. Ray's Actual Rules (And Why They Fit His Past Verdicts)**
  Ray isn’t against big inheritances *or* trusts universally. His decisions hinge on **three overlapping principles**:
  - **Rule 1: Autonomy vs. Control**  
    He supports the *donor’s freedom* to decide (charity, nephew, neighbor) but hates structures that impose *perpetual control* (dynasty trusts).  
    → Fits all cases: He attacked the senior partner’s trust (control beyond death) but defended the charity/farm/nephew (autonomy).  
  - **Rule 2: Merit & Moral "Deservingness"**  
    He approves inheritances that reward "earned" contributions (the farm son, the nephew’s care) or meet basic needs (neighbor’s kids). He dislikes windfalls for "idle" heirs.  
    → Fits: Farm = merit, nephew = emotional deservingness, neighbor = necessity. Dynasty trust = unearned dynasty wealth.  
  - **Rule 3: Tax Avoidance Hypocrisy**  
    He hates *complex, generation-skipping tax dodges* (dynasty trusts) but accepts *simple, ethical planning* (his own grandkids’ trust). He’s fine with loopholes if they’re incidental (step-up in basis) but not if they’re the *goal*.  
    → Fits: Dynasty trust = "scheming," while his education trust = "responsible support."

  **Why the Farm Doesn’t Contradict Him**: The $6M inheritance wasn’t the issue—it was the son’s *merit* ("the boy did the work"). The outright cash to siblings avoided dynastic control. Size alone isn’t his trigger; it’s unearned wealth + control + tax evasion combined.

  ### **3. Which Rule Wins for Mum’s Plan? (And What to Bet On)**
  - **Autonomy Rule** is strongest here: Mum wants outright gifts, no strings. Ray will default to this.  
  - **But Tax Rule** will dominate his *criticisms*: The state tax bill and "wasted" capital gains break will incense him.  
  - **Merit Rule** is neutral: You’re inheriting passively, but you’re not "idle" (you’re professionals), so it’s not a red flag.  
  - **Bet On**: Ray supporting the plan *in principle* (autonomy) but nitpicking the tax inefficiency. He’ll say, "It’s her right, but why not fix the taxes?!"

  ### **4. Your Milestone Trust Idea: Will It "Sort Ray Out"?**
  - **Likely Ray Reaction**: He’ll **hate it** and call it "controlling from the grave."  
    - Why? It violates his autonomy rule (mum dictating your life milestones) and echoes the "dead hand" he despised in the dynasty trust.  
    - He’ll say: "Your mum trusts you to handle it—why add hoops? If you want a masters, pay for it yourself!"  
    - His own grandkids’ trust gets a pass because it’s limited ($200k/education) and expires at 25—it’s "support," not control. Yours feels paternalistic.  
  - **Verdict**: Your idea is a **dud test**. It *wouldn’t* satisfy Ray and might even make him oppose the plan more.

  ### **5. A Better Hypothetical to Settle Ray's Rules**
  To isolate his principles, propose this scenario at Christmas:  
  > *"Uncle Ray, what if a client left $10M to their 30-year-old heir who’s never worked a day—outright, no conditions? Versus putting it in a trust that only pays for education, healthcare, or starting a business?"*  

  **Predict Ray’s Response Based on His Rules**:  
  - **Autonomy Rule**: "Their money, their choice! Let the heir blow it all if they want."  
  - **Merit Rule**: "Disgusting! That heir didn’t earn it. The trust is better—at least it forces responsibility."  
  - **Tax Rule**: "The outright gift wastes taxes! A trust could protect it from creditors and estate tax."  

  **Why This Works**:  
  - If he picks autonomy, he’ll back your mum’s plan.  
  - If he picks merit, he’ll grumble about your inheritance (but since you’re employed, it’s mitigated).  
  - If he focuses on tax, you’ll know his real bugbear is planning inefficiency.  

  ### **Final Advice**
  - **For Ray**: His outburst will likely be tax-focused. Prep for this by asking your mum’s lawyer about partial gifting or a charitable lead trust to reduce the state tax hit—this might placate Ray.  
  - **For You**: If your mum wants simplicity, honor that. Ray’s opinions are noise. But if *you* want to avoid family drama, float the tax-saving ideas to your mum *now* (e.g., "What if we donated $500k to your favorite charity to lower the estate?").  
  - **Ultimate Test**: Ask Ray about the lazy-heir hypothetical. If he condemns the heir, suggest your mum leave 10% to charity—this "deservingness" angle might satisfy him without complicating your inheritance.  

  Ray’s consistency comes down to: **Autonomy > Tax Efficiency > Merit**. Your mum’s plan wins on autonomy but fails his tax test—so expect him to gripe about loopholes while begrudgingly agreeing it’s "her call."
