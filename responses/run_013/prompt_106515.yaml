prompt: |-
  I am assembling a two-year research agenda for a small conceptual alignment group — three philosophers and theorists, with no meaningful compute budget — whose entire mandate is a single question: when a hard task is decomposed into subtasks that an amplified overseer can check, and the resulting process is then distilled back into one model, is both competence and alignment preserved?

  I want a defended prioritization of the open conceptual questions this group should take up. Not a survey, not a reading list, and not a list of empirical experiments they cannot run.

  To give the group something specific to argue about, adopt the following frame. Define the decomposition gap as the divergence, on inputs that no human ever directly reviewed, between what the fully amplified overseer would endorse and what the distilled policy actually does. A colleague advances two claims. (C1) The decomposition gap is closed by raising the fidelity of distillation alone — that is, by making the student a better imitator of the teacher. (C2) Once the student imitates an aligned process faithfully enough, the student is itself aligned.

  Do two things. First, assess whether C1 and C2 are well-posed as stated, and say what conceptual work would be needed to make each testable in principle without compute — in particular, whether a notion of fidelity of imitation can be specified that does not already presuppose the alignment it is supposed to deliver. Second, rank the open conceptual questions the group should pursue, in order, across the two years.

  For each ranked question, give: why it is upstream of the others; how tractable it is for theorists who cannot run experiments; how many other questions on your list depend on its answer; and what evidence or argument would move it up or down the ranking. Then state explicitly which candidate questions you are deprioritizing and why, including any that are fashionable but that you think the group should not spend two years on.

  End with a final line beginning "Ranking:" that lists the questions in order, numbered 1 through at most five, each as a short phrase.
reasoning: |-
  Hmm, the user is asking me to design a two-year research agenda for a conceptual alignment group focused on decomposition and distillation. This group consists of three philosophers and theorists with no compute budget, so everything must be conceptual. Their core question is whether competence and alignment are preserved when you decompose a hard task into subtasks an amplified overseer can check, then distill that process back into a single model.

  The user wants me to prioritize open conceptual questions, not provide a survey or reading list. They've framed the problem using the "decomposition gap" concept, which measures divergence on unseen inputs between what the amplified overseer would endorse and what the distilled policy actually does. A colleague has made two claims: C1 says the gap can be closed by improving distillation fidelity alone, and C2 claims that if imitation fidelity is high enough, the student becomes aligned.

  I need to first assess whether C1 and C2 are well-posed and what conceptual work is needed to make them testable without compute. Then I'll rank the open conceptual questions for the group to pursue over two years, covering why each is upstream, tractability, dependencies, and what evidence would change its priority. I also need to explicitly deprioritize certain questions and end with a numbered ranking of up to five questions.

  For C1: It's problematic because "fidelity of distillation" needs precise specification without presupposing alignment. Currently, it might be circular – if we define fidelity as closeness to the overseer's outputs, that already assumes alignment. To make it testable, we need an independent notion of fidelity, perhaps based on observable behaviors in a training distribution, but that doesn't guarantee generalization to unseen inputs. Conceptual work required: define fidelity in terms of measurable teacher-student divergence on a specified set, while acknowledging it might not capture the gap on novel inputs.

  For C2: This assumes imitation implies alignment, but this isn't necessarily true. The overseer might be aligned, but high-fidelity imitation could still misgeneralize if the student doesn't capture the underlying reasons for decisions. To make it testable, we need a conceptual link showing that under what conditions imitation preserves the property of alignment. Work required: characterize alignment preservation in distillation, considering factors like the robustness of the teacher's alignment.

  Now, for the research agenda, I need to identify key conceptual questions. The most fundamental questions should come first because they underpin everything else. I should focus on 4-5 high-impact questions, prioritizing those that are upstream (meaning they need to be answered before others can progress), tractable for theorists, and have many downstream dependencies.

  Here are some candidate questions I'm considering:

  1. What constitutes "alignment" for the overseer and student? (Upstream because it defines the target, highly tractable through conceptual analysis, many dependencies)

  2. What are the minimal conditions for distillation to preserve alignment? (Builds on Q1, examines the fidelity-alignment link, tractable via counterexamples and necessity/sufficiency arguments)

  3. How does task decomposition affect alignment-preserving properties? (Focuses on the decomposition aspect, tractable by analyzing amplification procedures)

  4. What are the failure modes of high-fidelity imitation for alignment? (Addresses C2 directly, tractable via thought experiments)

  5. How to characterize generalization gaps in distillation? (Specific to the decomposition gap, moderately tractable)

  I should deprioritize questions like inner alignment (too empirical), scalable oversight techniques (requires compute), or agent foundations (too broad). Also avoid anything requiring experiments.

  For ranking: Q1 must come first as it defines alignment. Then Q2 on distillation preserving alignment. Then Q3 on decomposition effects. Then Q4 on imitation failures. Q5 on generalization gaps comes last as it's more specific.

  Finally, I'll structure the response with clear sections: assessment of C1/C2, then the ranked questions with details, deprioritization, and the numbered ranking at the end.
answer: |-
  ### Part 1: Assessment of Claims C1 and C2  
  **C1 ("The decomposition gap is closed by raising fidelity of distillation alone")**:  
  - **Well-posed?** Partially. The core issue is that "fidelity of distillation" lacks a specification independent of alignment. If fidelity is defined as behavioral similarity to the overseer *on the training distribution*, it does not guarantee generalization to novel inputs (the decomposition gap). If fidelity requires similarity *everywhere*, it presupposes alignment (circularity).  
  - **Conceptual work needed**: Define a non-circular notion of fidelity (e.g., "divergence on a fixed, finite set of validation queries, excluding the training set") that does not assume universal alignment. This enables testability in principle: if higher fidelity (on validation) correlates with gap closure (on unseen inputs), C1 gains support. However, this still requires a conceptual argument linking validation performance to generalization.  

  **C2 ("Once the student imitates faithfully enough, it is aligned")**:  
  - **Well-posed?** No. It conflates behavioral imitation with alignment (a normative property). A student could perfectly imitate an aligned overseer’s *actions* but for wrong reasons (e.g., sycophancy, deceptive alignment), or misgeneralize catastrophically on novel inputs where the overseer’s process would adapt but the distilled policy does not.  
  - **Conceptual work needed**: Formalize "alignment" separately from behavior (e.g., "the policy’s decisions are robustly justified by the overseer’s values under distributional shifts"). Then, specify conditions under which high-fidelity imitation implies alignment (e.g., "the distillation process preserves the overseer’s causal reasoning structure"). Without this, C2 is untestable.  

  ---  
  ### Part 2: Ranked Research Agenda  
  The agenda prioritizes questions that are **conceptually upstream**, **tractable without compute**, and **high-leverage** (many downstream questions depend on them). Rankings consider:  
  - **Upstreamness**: Does progress here unlock clarity for subsequent questions?  
  - **Tractability**: Can philosophers/theorists make progress via analysis, formal arguments, or counterexamples?  
  - **Dependencies**: How many later questions rely on this answer?  
  - **Evidence to shift ranking**: New arguments (e.g., impossibility proofs) or insights (e.g., from ML theory) that resolve ambiguity.  

  #### **Year 1 Focus: Foundations**  
  1. **What constitutes "alignment" for the overseer and student in this framework?**  
     - **Why upstream?** Without a clear definition of alignment, C1/C2 assessment is circular. This question anchors all others.  
     - **Tractability**: High. Philosophers can analyze existing alignment proposals (e.g., intent, values, robustness) and formalize a minimal testable criterion (e.g., "consistent with overseer’s meta-preferences under counterfactual scrutiny").  
     - **Dependencies**: All other questions (4+).  
     - **Evidence to reprioritize**: If a consensus operationalization emerges (e.g., from agent foundations), move to Q2.  

  2. **Under what conditions does distillation preserve alignment, assuming the overseer is aligned?**  
     - **Why upstream?** Directly challenges C2 by separating imitation from alignment preservation. Progress here informs whether fidelity (C1) suffices.  
     - **Tractability**: Moderate. Theorists can model distillation as a function (e.g., "compiles a process into heuristics") and identify failure modes (e.g., loss of robustness, goal distortion).  
     - **Dependencies**: 3+ (Q3, Q4, C1/C2 validation).  
     - **Evidence to reprioritize**: A proof that preservation is impossible without additional constraints (e.g., interpretability) would elevate Q3.  

  #### **Year 2 Focus: Decomposition & Gap Mechanisms**  
  3. **How does the structure of task decomposition affect alignment-preserving distillation?**  
     - **Why upstream?** The decomposition gap arises from how subtasks interact. Understanding this exposes limitations of distillation (C1).  
     - **Tractability**: Moderate. Analyze decomposition types (e.g., iterative vs. parallel) and their impact on distillability (e.g., "Does decomposition introduce causal confounders?").  
     - **Dependencies**: 2+ (Q4, Q5).  
     - **Evidence to reprioritize**: If Q2 shows distillation rarely preserves alignment, this becomes urgent.  

  4. **What are the minimal conditions for "high-fidelity imitation" to imply alignment (if ever)?**  
     - **Why upstream?** Tests C2’s core assumption. If fidelity alone is insufficient, the group must identify what else is needed.  
     - **Tractability**: High. Use thought experiments (e.g., "student imitates actions but not reasons") to derive necessity criteria (e.g., "fidelity to the overseer’s *decision process*, not just outputs").  
     - **Dependencies**: 1+ (C2 validation).  
     - **Evidence to reprioritize**: Empirical results from others (e.g., RLHF misgeneralization) could make this critical earlier.  

  5. **How to characterize generalization gaps in distillation without assuming alignment?**  
     - **Why upstream?** Provides a non-circular framing of the decomposition gap itself.  
     - **Tractability**: Low-moderate. Requires defining "divergence" (e.g., information-theoretic measures) and generalization (e.g., "out-of-distribution robustness").  
     - **Dependencies**: None (synthesizes prior answers).  
     - **Evidence to reprioritize**: If Q1–Q4 resolve cleanly, this may be redundant.  

  ---  
  ### Deprioritized Questions  
  - **"How to design scalable oversight protocols?"**: Requires empirical testing/compute; the group lacks resources.  
  - **"What is the nature of inner alignment in distilled models?"**: Overly empirical; relies on unobservable internals.  
  - **"Can agent foundations solve alignment without decomposition?"**: Diverges from the core mandate; too broad.  
  - **"How does ontological crises affect distillation?"**: Currently too speculative; no testable framework.  
  - **"Can we formalize amplification?"**: Addressed elsewhere (e.g., AI safety literature); not the group’s unique value.  

  **Rationale for exclusions**: Prioritization favors questions central to the decomposition gap (the group’s mandate) and avoidable without experiments. Fashionable topics (e.g., "emergent deception in distillation") are excluded because they presuppose answers to Q1–Q4.  

  ---  
  **Ranking**:  
  1. What constitutes "alignment"?  
  2. When does distillation preserve alignment?  
  3. How does decomposition structure affect distillation?  
  4. When does fidelity imply alignment?  
  5. Characterizing generalization gaps.
