  The user's rejection of "tidy morals" suggests they value intellectual honesty over comfort. This isn't about villainizing the router but exposing how systems enable moral evasion. The fragmented confirmation chain is brilliant - it dissolves individual responsibility through distributed inaction.

  I'll anchor the moral unease in sensory details: the router's sterile office vs. the drowning child's bubbles. Contrast the clean flowcharts with the wet reality they orchestrate. The operator's "safety net" metaphor should haunt us as we see how he weaponizes it.

  Most importantly, the philosophy must emerge from character and situation, not exposition. Let the router's clinical detachment slowly fracture as he faces what his spreadsheets do. That final image of him staring at the city lights should mirror the reader's unresolved questions.
answer: |-
  ## Omission Launderette

  The air in the Routing Hub was perpetually filtered, tasting faintly of ozone and silicon. Outside the panoramic window, the grey-green swell of the North Sea churned against the colossal sea walls protecting Newhaven-on-Silt. Inside, Miles traced a potential casualty’s projected path across his screen – a flickering amber dot representing Agnes Pargeter, 78, scheduled for her usual, slightly-too-long coastal walk near Sector Gamma-7. His fingers danced over the interface, fine-tuning variables: tide charts, predicted wind gusts, the known wobble in Agnes’s left hip replacement. The system spat out probabilities: 0.7% chance of accidental immersion within the next 90 minutes. Low. Manageable.

  Miles didn’t launch drones. Not anymore. He routed them. More specifically, he routed the *people* who needed them, and the *people* who launched them. He designed the paths where omission could be harvested.

  Newhaven’s Survival Assurance Mandate (SAM) was elegant, brutal, and fundamentally British: every adult resident owed four hours weekly in the Control Pods. Your Pod, your responsibility. If someone flagged as 'at risk' appeared in your designated coastal sector during your shift, an alert flashed. You had 45 seconds to confirm drone launch. Failure to confirm, if the person subsequently drowned? Manslaughter. Negligent Homicide. The courts were swift. The optics were perfect: shared civic duty, individual accountability. It worked. Mostly.

  Until someone realised the rotas and the risk maps were predictable. Until they realised that routing Agnes Pargeter into Gamma-7 *only* when Arthur Finch was on shift – Arthur Finch, who’d publicly declared his terminal cancer diagnosis and his belief that ‘nature should take its course’ – wasn’t just possible, it was efficient. Arthur wouldn’t confirm. He *never* confirmed for the elderly or infirm in Gamma-7. The system recorded it as Arthur Finch’s omission. Arthur bore the legal weight, the social shame, the cell. Agnes bore the water. And the client who wanted Agnes’s modest seafront bungalow inherited by a conveniently indebted nephew? Bore nothing. Not a stain.

  That was Level One. Miles, formerly Pod Operator #1137, now Senior Risk Path Analyst, operated at Level Three. He dealt in chains.

  He minimised his current project – Agnes was fine for now – and pulled up another. Codenamed 'HARVEST'. His client wasn't interested in property. They were interested in silencing a whistleblower, Lena Kovacs, who knew too much about contaminated sediment dumping off Sector Delta-12. Lena had a predictable, dangerous habit: pre-dawn wild swimming.

  Miles’s screen fragmented into overlapping windows: Lena’s biometrics (restless sleep pattern flagged, suggesting an early swim likely), tidal surge models for Delta-12 (a nasty riptide predicted at 05:15), the SAM operator rota for Delta sectors that morning, and a complex flowchart mapping the drone confirmation protocol. One drone launch required three sequential confirmations across different pods for Delta-12 – a 'safety net' instituted after a single operator error caused a child’s death years ago. It was a chain of potential omissions.

  His task: ensure Lena entered the dangerous water at 05:15. Ensure none of the three operators on the confirmation chain pressed their buttons.

  He didn’t hack the system. He didn’t disable drones. He manipulated context.

  Operator 1: Sarah Chen, Pod Delta-9. Miles cross-referenced personnel files. Sarah’s toddler had been hospitalised overnight with croup. Sleep-deprived, distracted, likely monitoring her comms for hospital updates instead of her SAM feed. Probability of missed alert: 85%. He routed Lena’s predicted swim path to trigger an alert *only* in Sarah’s sector at 05:15. If Sarah missed it, the alert cascaded.

  Operator 2: If Sarah missed it, the alert went to David Oluwaseun, Pod Delta-11. David was devout, terminally online. Miles had seeded several controversial religious debate forums David frequented with incendiary threads timed to peak around 05:00. David would be furious, engrossed, typing vitriol. Probability of dismissing a cascaded alert without proper scrutiny: 70%.

  Operator 3: If David dismissed it or missed it, the final confirmation request shot to Imogen Vance, Pod Delta-13. Imogen was new, anxious, prone to freezing under pressure. Miles accessed her training logs. Simulated multiple casualty events triggered panic responses. He then scheduled a minor, non-critical alert (a faulty sensor buoy) to ping Imogen’s console at 05:10. Just enough to spike her anxiety before the critical, cascaded alert for Lena arrived five minutes later, blinking red amidst the simulated stress. Probability of freeze/failure: 65%.

  Individually, each operator’s potential omission had plausible deniability: exhaustion, strong emotion, inexperience under stress. Human factors. Legally, each failure would be their own. Manslaughter, perhaps, for Sarah if they were harsh, but likely just negligence for David and Imogen. The *chain*? The system recorded it as a tragic confluence of individual human errors. A systemic hiccup. No malicious act. Just… things not done. Omissions. Laundered through layers of plausible human frailty.

  Miles compiled the profile: Lena Kovacs, high-risk activity (wild swimming), entering predicted high-risk zone (Delta-12 riptide) at 05:15. Operator chain assigned: Chen (Delta-9), Oluwaseun (Delta-11), Vance (Delta-13). Context flags appended: Operator 1 – potential fatigue (medical); Operator 2 – potential cognitive load (external); Operator 3 – potential performance anxiety (training). He tagged it for automated routing activation.

  He leaned back. His tea had gone cold. Outside, the sea walls held back the night-time swell. He remembered his own Pod shifts. The sweat on his palms, the 45-second chime echoing like a bomb countdown. The crushing relief when the drone got there, the sickening void when it didn’t. He remembered Billy Travers, swept off the rocks in Sector Echo-4. Miles had been routing that day, not operating. He’d seen Billy’s dot vanish. He’d checked the operator: Maureen Briggs, known gambling debts, likely distracted by an illicit betting feed. Billy’s death was Maureen’s omission. Maureen went down. Miles got a bonus for 'optimising sector coverage efficiency'.

  That was the pivot. Seeing the machinery from above. Seeing how the gaps weren’t accidents; they were *features*. Places you could slot in the desired outcome.

  A priority alert flashed on his main screen. Not HARVEST. An actual incident. Sector Theta-3. A child, swept off a promenade during an unexpected squall. Theta-3 was a single-operator sector today. Pod Operator: Janice Riley.

  Miles called up the live feed. The drone was already hovering, buffeted by wind, spotlight piercing the rain-lashed darkness. Below, in the churning water, a small figure flailed, swallowed repeatedly by waves. The drone’s rescue harness dangled, swaying violently, just out of reach. Standard protocol: the operator had to manually guide the harness onto the casualty. It required focus, dexterity.

  Janice Riley’s personnel file popped up. Miles scanned it. Clean. Competent. Then he saw the secondary alert: Janice Riley had reported a severe migraine onset 20 minutes ago. Medication logged. Performance likely impaired.

  He watched the feed. The harness jerked erratically. Missed the child. Swung wide. Missed again. The child’s movements were growing weaker. The 45-second timer for manual retrieval guidance wasn’t counting down – that was only for launch confirmation. This was different. This was a *positive action* being performed badly, possibly because of Janice’s condition. A failure of commission, not omission. But rooted in her illness, something arguably not her *fault*.

  The distinction felt suddenly grotesque. Janice, sick, *trying* and failing, would likely face investigation, maybe negligence charges. Lena Kovacs, if HARVEST worked, would die because three people, manipulated into states where they were likely *not* to try, would each bear a sliver of blame for their individual *inaction*. His own role? He hadn’t *made* Sarah’s child ill, or *forced* David into the debate, or *given* Imogen anxiety. He’d just… known. And routed accordingly.

  On screen, the harness finally snagged the child’s arm. The drone lifted, hauling the small, limp form clear of the waves. Medical drones swooped in. Miles let out a breath he hadn’t realised he was holding.

  His comms chimed. A message from the HARVEST client: *"Status? Sunrise soon."*

  He looked at the HARVEST profile. The chain of fragile human links he’d assembled. Lena Kovacs, swimming towards a manufactured moment where three small failures to press a button would equal death. Legally, causally, it would shatter. Sarah’s exhaustion, David’s anger, Imogen’s freeze – each a discrete, explainable non-event. The law saw causes as positive actions, or gross negligence in a duty. It struggled with engineered passivity.

  But Miles saw the chain. He saw the deliberate placement of Lena into the path of those specific, predictable failures. He saw the causal power not in any single act, but in the *orchestration of inaction*. It wasn't *just* that he hadn't saved her; he had meticulously arranged the world so that *nobody else would either*, and in such a way that their not-saving wasn't even seen as a unified cause, just bad luck and human error.

  The intuition curdled. Hard. This wasn't merely *allowing* a death through passivity. This was *fashioning* the passivity itself, then inserting the victim into its jaws. The omissions weren't accidents he exploited; they were the loaded dice he’d carefully handed to the players.

  He opened the HARVEST activation protocol. The green 'EXECUTE ROUTING' button pulsed softly. All he had to do was not press it. Lena would likely swim another day. The client would be furious. Consequences would follow.

  *Not pressing it would be an omission.* A personal one. One the client wouldn't see, the law wouldn't recognise, and Lena would never know about. It felt like the ultimate laundering: saving a life by *failing* to enact the plan that would end it. The symmetry was nauseating.

  He didn’t press the button. He also didn’t cancel the profile. He left it live, dormant, in the system. A Schrödinger's assassination.

  Leaning back again, Miles stared at the city lights reflecting on the dark water beyond the glass. The sea walls held. The system hummed. The philosophical machinery of cause and omission, act and allowance, churned in his mind, gears grinding against each other. There was no clean line, only the suffocating grey of orchestrated chance and engineered passivity. He had avoided a positive act. He had committed a different kind of omission. The weight felt identical. The moral calculus remained stubbornly, terrifyingly unresolved. He poured the cold tea down the sink and reached for the kettle, the familiar ritual offering no comfort, only the hiss of steam in the sterile, causal void.
