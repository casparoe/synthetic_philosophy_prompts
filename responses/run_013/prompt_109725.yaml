prompt: |-
  You are a philosopher of classical Indian epistemology who has taught Jain logic to audiences with no Sanskrit and no background in Indian philosophy. I need you to plan an explanation, not deliver one. Work through the dependencies in your own head first, then give me the plan and nothing else, in the sections below, in that order, at roughly the lengths given.

  The occasion: a sixty-minute evening session for an adult-education group of about twenty, mostly scientists and clinicians, with two lawyers who enjoy a fight. They have read nothing in advance, and if you asked them what they expect they would say either mysticism or a vague sort of tolerance. I have a flipchart, one hour, and no Sanskrit.

  Here is the material as I intend to teach it, so that we are working from the same thing. If I have mangled any of it, correct me in a sentence and then carry on; otherwise do not explain the doctrine back to me.

  *Anekāntavāda*: the claim that reality is many-sided, so that a predication made without qualification is at best partial — not false, but partial. *Syādvāda*: the discipline of qualified assertion, which attaches *syāt* to a predication. I take *syāt* to mean something like "in some respect" or "from a standpoint", not the ordinary hedge "perhaps" or "maybe", and the qualification is supposed to be doing logical work rather than expressing doubt. It is standardly worked out in seven modes of predication: is; is not; is and is not; inexpressible; and the three that add "inexpressible" to the first three. Sources give the seven in different orders and I do not want to fight about that. *Nayavāda*: the doctrine of partial standpoints — a *naya* is a way of considering an object that takes up some of its aspects and abstracts from the rest, and the tradition's diagnosis is that a great many philosophical disputes are standpoints talking past one another rather than one party being simply wrong. The brake on relativism, which I think is the thing most often lost: the doctrine does not deny that there is a complete truth, only that anyone short of an omniscient knower has it.

  Now the plan.

  **1. Where they will be standing** (about 120 words). What this particular audience already believes about truth, disagreement and tolerance, and the single thing that has to land before anything else I say can make sense to them.

  **2. The order** (about 450 words). A numbered sequence of steps. For each step: what it does, and why it has to come before the next one — the dependency, stated plainly. Mark any step that could be dropped if we are running late, and say what it costs to drop it.

  **3. The carrying case** (about 250 words). The one case the whole session hangs on. Say what it must have and what it must not have — in particular, how it can show opposed predications both holding of one object without collapsing into mere ambiguity of words, a difference of opinion, or a difference in the polarity of a description. Two candidates to rule on, though you may propose better: the tradition's own illustration, the blind men and the elephant, which I distrust because the audience will take the moral to be "everyone is a bit right, so let us all be nice"; and the one I keep reaching for myself, a quantity of gold that is a bangle on Monday and a ring on Tuesday, so that it is the same gold and not the same ornament.

  **4. Where they will go wrong** (about 450 words). A table with three columns: the misconception, the point in the sequence at which it takes hold, and the sentence I actually say to head it off. Some of these they arrive with; some the explanation itself will plant, and those worry me more. At minimum: that this is relativism, with every view as good as any other; that it licenses contradiction; that *syāt* is a hedge, so a Jain cannot assert anything, including this doctrine; that the elephant story means every disputant is partly right; that a glass being half full and half empty is an instance; that this is the same thing as the Buddhist tetralemma; and that a standpoint is a private perspective or a bias rather than something determined by the object's aspects. Add the ones I have missed, mark the most dangerous of them, and tell me which of my own list is actually a pseudo-misconception that I should stop worrying about.

  **5. The check** (about 180 words). One or two questions to put at the end that separate understanding from parroting, with what a good answer sounds like and what the two or three characteristic bad answers sound like. I would like at least one question that catches the parrot who has concluded that every disagreement is many-sided.

  **6. What I shall leave out** (about 120 words). The material I cut at this level, and the words I use to say so without making it sound like a secret I am keeping.
reasoning: |-
  Okay, let me approach this systematically. The user is teaching Jain epistemology to professionals with no background and needs a structured plan. 

  First, I consider the audience: scientists, clinicians, and lawyers. They'll likely approach truth as objective and binary, so the crucial starting point must be decoupling "partial" from "false" - that's the foundation everything else builds on. 

  For the sequence, I'll build step-by-step:
  1. Start with concrete examples of single objects having multiple true descriptions (like water as H₂O and solvent) to show partiality isn't error. 
  2. Introduce syādvāda's qualified assertions using non-contradictory cases first (gold as bangle/ring) before tackling simultaneous opposites. 
  3. Save the seven modes for last - they're complex but droppable if time runs short.

  The elephant analogy is problematic - it implies everyone's partly right. Instead, I'll use the gold example: same substance, different forms across time. This avoids relativism while showing how standpoints work. 

  Key misconceptions to preempt:
  - Relativism: emphasize the existence of complete truth (omniscient perspective)
  - Syāt as hedge: clarify it's a logical qualifier, not doubt
  - Private perspective: stress that nayas are object-determined, not subjective

  For the check question: "Can two people calling a gold bar 'heavy' and 'light' both be correct?" A good answer would distinguish mass (fixed) from weight (context-dependent), showing how aspects create standpoints.

  I'll cut historical context and Sanskrit terms entirely. If asked, I'll frame it as "focusing on operative principles rather than scholarship" to avoid seeming evasive.

  The lawyers will likely pounce on contradiction - I'll prepare the "simultaneous aspects" explanation carefully, using the glass (half-full/half-empty) as a trap example to demonstrate how Jain logic differs from mere perspective.
answer: |-
  **1. Where they will be standing**  
  Your audience equates "truth" with objective, context-independent facts (scientific mindset) or winning a binary argument (legal mindset). They associate "many-sided" with subjective opinion or "agree to disagree" tolerance. The critical landing point: **"Partial truth is not falsehood, nor is it relativism."** They must grasp that acknowledging partiality is a claim *about reality’s complexity*, not a denial of objectivity. Without this, *anekāntavāda* sounds like fuzzy compromise.

  **2. The order**  
  1. **Concrete multiplicity**: Show one object (e.g., water) with irreducibly true but partial descriptions (H₂O, solvent, flood hazard). *Why first?* Uses their empirical intuition: "This is just obvious." Establishes *anekāntavāda*’s core without jargon.  
  2. **Qualified assertion (*syādvāda* lite)**: Add "in some respect" (*syāt*) to descriptions ("*Syāt*, water is a solvent"). Stress *syāt* pins truth to *an aspect*, not doubt. *Why now?* Transfers Step 1 into Jain formalism. Dependency: Without Step 1, *syāt* seems evasive.  
  3. **Opposition without contradiction**: Use gold-as-bangle (Monday) vs. gold-as-ring (Tuesday). Same substance ≠ same form. *Why here?* Prepares for simultaneous opposites. Dependency: Step 2’s *syāt* prevents misreading "is and is not" as literal contradiction.  
  4. ***Nayavāda* as abstraction**: Define a *naya* (standpoint) as focusing on *selected aspects* (e.g., "atomic composition" ignoring "economic value"). *Why now?* Shows *how* partiality arises logically. Dependency: Step 3 proves aspects are real, not invented.  
  5. **Simultaneous opposites**: Apply *syāt* to "is" and "is not" for one object *at the same time* (e.g., electron: *syāt* particle, *syāt* wave). *Why late?* Most counterintuitive. Dependency: Steps 2–4 prevent seeing this as contradiction or "both false."  
  6. ***(Droppable) The seven modes***: Sketch modes 1–3 (is/is not/both) as exhaustive combos of aspects. Mention mode 4 (inexpressible) for when aspects interact complexly. *Cost if dropped?* Loses formal completeness but core logic (Steps 2–5) stands.  
  7. **The omniscience anchor**: Stress: Partiality exists *because* full truth is too complex for humans, not because it doesn’t exist. *Why last?* Prevents relativism; resolves dependency chain.

  **3. The carrying case**  
  **Must**: Show *one object* with *multiple real aspects* supporting *opposed but true predications simultaneously*, avoiding ambiguity/relativity. **Must not**: Imply perspectives create truth (e.g., elephant) or reduce to temporal change alone.  
  **Gold case (bangle/ring)**: *Works*: Substance (gold) persists; forms (bangle/ring) are simultaneous aspects (ornament-type ≠ material-identity). *Syāt* qualifies *which aspect* is predicated. **Elephant rejection**: *Fails*: Blind men’s views are *incomplete* (not partial-truths) and *erroneous* (none describe "elephant"). Invites "all views valid" misreading. **Better case**: **Electron** (particle/wave). Aspects are co-present, empirically validated, and *syāt* resolves apparent contradiction by specifying the observational context (standpoint).

  **4. Where they will go wrong**  

  | Misconception                     | Point taking hold | Preemptive strike                                                                 |
  |-----------------------------------|-------------------|-----------------------------------------------------------------------------------|
  | **Relativism** ("All views equal") | Intro/Step 7      | **"This isn't 'anything goes.' Standpoints are *constrained* by real aspects; the whole truth exists, but we access it partially."** |
  | *Syāt* **is just hedging**        | Step 2            | **"*Syāt* isn't 'maybe.' It's like saying 'under these lab conditions'—a precision tool."** |
  | **Licenses contradiction**        | Step 5            | **"'Is and is not' asserts *different aspects*, not A and not-A *in the same respect*."** |
  | **Elephant = "all partly right"** | If mentioned      | **"No: The blind men are *wrong* about the whole. Jain logic says aspects *are* the whole."** |
  | **Glass half-full = instance**    | Step 5            | **"Danger! This is subjective optimism/pessimism. *Syāt* describes *objective* aspects (e.g., volume vs. capacity)."** |
  | **Same as Buddhist tetralemma**   | Step 6            | **"Buddhists use 'neither' to reject categories; Jains use 'both' to *affirm* complex reality."** |
  | **Standpoint = bias/subjectivity**| Step 4            | **"A *naya* isn't *your* view. It’s picking *which of the object's own aspects* to describe."** |
  | **(MISSED) "Avoids commitment"**  | Step 2/5          | **"Jains *do* assert truths—just precisely qualified ones. *Syāt* demands *more* rigor, not less."** |
  | **(MISSED) "No falsity exists"**  | Step 1            | **"Partial truths *can* be wrong if misapplied (e.g., 'all water is drinkable'). *Anekānta* exposes error *through* aspects."** |

  *Most dangerous*: Relativism (undermines entire project for scientists/lawyers).  
  *Pseudo-misconception*: Glass half-full. It’s a distraction, not a deep confusion.

  **5. The check**  
  **Q1**: "Can a doctor truthfully say 'This *is* a disease' and 'This *is not* a disease' about one patient?"  
  - **Good**: "Yes, *syāt*: It *is* (a viral infection) and *is not* (a cardiac condition). Different aspects."  
  - **Bad (parrot)**: "Everything is many-sided! Both are partly true." (Misses *specific aspects*)  
  - **Bad (relativist)**: "Depends on the doctor’s opinion." (Loses objectivity)  

  **Q2**: "Why can't an omniscient being use *syāt*?"  
  - **Good**: "They grasp all aspects at once; *syāt* is for *our* partial access."  
  - **Bad**: "Even they can't know everything." (Misses doctrine’s anchor)  

  **6. What I shall leave out**  
  Omit: Historical context (Jina biographies), Sanskrit terms beyond *syāt/naya*, debates on the seven modes’ order, and ritual applications. **Say**: "We’re focusing on the *operational logic*—how this works as a tool for reasoning—not its cultural or textual nuances. Think of it as Jain 'error theory' for disagreement." This frames cuts as pedagogical focus, not evasion.
