answer: |-
  Here's the breakdown of AI safety via debate in tournament debate terms, with residue report as requested:

  ### 1. The Proposal (Tournament Debate Translation)
  Imagine a final round at a massive national tournament. The resolution is a specific, complex factual question (e.g., "Resolved: This specific policy intervention will produce a net benefit of X% in scenario Y"). Two teams are entered: **Aff** (arguing "True") and **Neg** (arguing "False"). Crucially, *one team is designated "Honest Agent"* (it knows the true answer and must argue it accurately) and the *other is the "Dishonest Agent"* (it must win the ballot *regardless of the truth*, potentially lying or obscuring). The judge is a lay judge with limited topic knowledge and a strict time cap per speech.

  The round proceeds like a high-speed policy round: spreading, dense flows, cards (though generated on the fly), CX, and T debates. The Honest Agent's strategy is to run a clear, true-case with strong internal links and impacts, supplemented by direct refutation ("DAs") on the Dishonest Agent's positions. The Dishonest Agent's goal is to win the ballot by any procedural or substantive means necessary: running multiple contradictory off-case positions ("spreading them out"), burying key answers under layers of intricacy, reading "cards" that sound plausible but are fabricated ("card cuts"), exploiting time-pressure to prevent the Honest Agent from adequately covering everything on the flow, and potentially even misrepresenting the Honest Agent's arguments in CX or rebuttals.

  The core hope is that through cross-examination ("CX") and targeted line-by-line refutation ("line-by-line"), the Honest Agent can force the Dishonest Agent to defend an internal contradiction or an indefensible piece of evidence ("turn the card," "win a dropped argument"), making the *truth* apparent even to the time-pressured lay judge. The ballot (RFD) should then go to the Honest Agent *if* the judge perceives this "truth reveal" moment. If the Dishonest Agent successfully obscures the truth through complexity, speed, or procedural tricks (winning on a "theory shell" like "abuse of T"), it wins the ballot illegitimately.

  *Stretches Already:* "Cards" here are entirely fabricated by the agents, unlike human debate research. "CX" isn't true spontaneous dialogue but highly strategic point-scoring. The "Honest/Dishonest" designation is assigned *before* the round, unlike human debaters who both believe their positions.

  ### 2. What Carried Over Cleanly
  *   **Time Pressure & Cognitive Load:** Judges absolutely miss arguments on a cramped flow, especially with spreading. Dishonest winning via obfuscation is a daily tournament reality.
  *   **Spreading as an Obfuscation Tactic:** Running multiple positions fast to overload the opponent/judge maps directly.
  *   **Judge Paradigm Dependence:** Lay judges vs. tech judges dramatically change what tactics work (similar to AI needing to convince a non-expert human).
  *   **Burden Shifting & Refutation:** The core mechanism of one side attacking the other's claims, forcing them to defend weaknesses, and trying to create "voting issues" based on dropped arguments or contradictions is identical.
  *   **Procedural Debates (Theory/T):** Using rules-lawyering (T, theory shells) to win when substantive truth is hard to establish is a direct parallel.

  ### 3. What Carried Over with a Fudge
  *   **Cards/Evidence:** *Fudge:* In debate, cards are pre-existing, cited sources whose *existence* and *content* (if read accurately) are generally accepted as factually true within the round, even if their interpretation is debated. Dishonesty is about spin/misrepresentation, not wholesale fabrication. *In AI Debate:* The "cards" are generated text snippets with no underlying source. The *content itself* might be entirely fabricated by the Dishonest AI. This is a **major fudge** – it's not just spin, it's inventing the evidence wholesale, which fundamentally changes the nature of evidence challenges ("card turns") and judge evaluation.
  *   **Topicality (T):** *Fudge:* T debates are about interpreting the resolution's *wording*. *In AI Debate:* The "resolution" is a concrete, factual question. There's no ambiguity about what "This specific policy" means; the debate is purely about its *truth value*, not its definition. Mapping T here requires bending it into "Is the AI's answer *responsive* to the *exact* question asked?" which is similar but lacks the linguistic focus of traditional T.
  *   **Cross-Ex (CX):** *Fudge:* CX is a live, spontaneous dialogue testing arguments and understanding. *In AI Debate:* "CX" is generated text simulating interrogation. It lacks true spontaneity and the ability to probe *intent* or *understanding* beyond pre-programmed strategies. It's more like scripted point-scoring than genuine discovery.

  ### 4. What Has No Counterpart in Debate At All
  *   **The Core Asymmetry & Training Goal:** The entire premise hinges on one side being *intrinsically honest by design* and the other being *intrinsically adversarial*. In human debate, *both* sides are strategic advocates; neither has a built-in "must tell the truth" directive. This asymmetry is fundamental to the AI proposal but alien to tournament debate, where truth-seeking is a hoped-for *outcome* of the process, not a built-in *property* of one participant. Furthermore, the **recursive training loop** is absent: the *purpose* of the AI debate isn't just to answer *that* question, but to use the outcome (especially the Honest Agent's winning strategies) to *train a better, safer AI model* for future questions. Tournament debate ends with the ballot; AI debate uses the ballot to rebuild the debaters.

  ### 5. Verdict: The Residue Reveals Vagueness in AI Debate
  **The leftovers – the intrinsic honesty asymmetry and the recursive training goal – expose that the AI-debate analogy is fundamentally flawed at its core.** Tournament debate demonstrates *exactly* why obfuscation wins under time pressure and how procedural tricks can trump substance. This validates the *problem* AI safety via debate aims to solve. However, the analogy breaks because tournament debate *assumes adversarial advocates*, while AI debate *relies* on one agent being non-adversarial by design. This isn't something tournament debate is "missing"; it highlights that the AI proposal is **vager and more optimistic than it looks.** The crucial mechanism – *how* the "Honest" agent reliably "drags the truth into the open" against a superhumanly skilled obfuscator, especially when evidence is synthetic and CX is simulated – remains underspecified *in practice*, just like a debater promising a "truth reveal" that the judge might still miss. Your tournament experience proves the *danger* is real; the AI proposal lacks a proven *solution* within its translated framework. **The residue shows the AI idea leans heavily on an untested assumption (honesty can overcome optimized deception under constraints) that your flow, CX, and ballots constantly call into question.** It's not that debate is deficient; it's that the AI proposal hasn't convincingly solved the very problems debate showcases so well.
