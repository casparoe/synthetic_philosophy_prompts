prompt: |-
  Before I read another word on weakness of will, I want the spec first. Write me the desiderata for a theory of akrasia: what it has to be able to do to count as adequate -- which cases it must classify correctly, which distinctions it can't collapse, which findings it has to live with -- with the case or consideration behind each requirement. The stuff I want on the list, roughly: (i) the textbook case, someone who thinks A is best right now and does B anyway, fully aware, no excuse; (ii) the person who never formed a judgement about what's best overall but broke her own standing resolution -- she said she'd stop after one drink and didn't -- so do we really need a judgement to have been contravened, or is that just an assumption of the judgement-focused camp?; (iii) the person who calmly renegotiates the plan her earlier self set, does what that earlier self called wrong, and feels no failure whatsoever -- akrasia or just changing her mind?; (iv) the case where the "weak" act was actually the better one and the earlier judgement was the corrupt thing; and (v) the hyperbolic discounting results, where the near future gets discounted much more steeply than the far future, so the reversal is predictable in advance and the agent can watch it coming. For each, say what it forces on the theory and whether it's non-negotiable or just the taste of one camp. Then tell me which single requirement does the most to rule out the main contenders -- a will-faculty that fails, the divided-mind picture where the stronger desire wins, and the "it's just ordinary choosing with a kinked discount curve, nothing to explain" line. And say whether the list can be met all at once, because I suspect (iii) and (v) pull against (i).
reasoning: |-
  Okay, the user wants desiderata for a theory of akrasia (weakness of will) with specific cases. Let me start by understanding each point they mentioned.

  First, the textbook case (i). The user wants a theory that explains someone who knows A is best but does B anyway. This is the classic definition, so the theory must handle clear-eyed akrasia without excuses. Non-negotiable.

  Next, case (ii) about breaking a standing resolution without a judgment. The user questions if a judgment is necessary. The theory must recognize resolutions as commitments separate from current judgments. This challenges judgment-focused views. Probably non-negotiable.

  Case (iii) involves calmly renegotiating a plan. The user asks if it's akrasia or changing one's mind. The theory needs to distinguish between weakness and rational updates. Non-negotiable to avoid false positives.

  Case (iv) where the weak act was better. The user points out that sometimes the initial judgment is wrong. The theory should allow for the possibility that akrasia might be right. Non-negotiable to avoid pathologizing correct actions.

  Case (v) on hyperbolic discounting. The user mentions predictable reversals. The theory must integrate time-consistent discounting without reducing akrasia to rational choice. Non-negotiable to explain predictability.

  Now, the user wants to know which requirement rules out main contenders. The textbook case (i) is key. It rules out theories that deny clear-eyed akrasia or explain it away as irrational discounting. 

  Then, checking if all desiderata can coexist. Tension between (iii) and (v) vs. (i). (iii) requires distinguishing weakness from rational changes, while (v) shows predictable reversals that might look like rational discounting. But (i) insists on contravention of judgment. A good theory must balance these by explaining how resolution commitment works versus genuine reassessment.

  Also, the user might be looking for a comprehensive framework that handles both psychological mechanisms and normative aspects without oversimplifying. Their deeper need could be understanding if akrasia is a real phenomenon or just misdescribed rational behavior. They want a theory that validates the struggle in akrasia while accounting for nuances like resolution-breaking and time discounting.
answer: |-
  Here's a specification for a theory of akrasia, structured as desiderata with the driving cases and their theoretical implications:

  **Desiderata for an Adequate Theory of Akrasia:**

  1.  **Explain Clear-Eyed Akratic Action (The Textbook Case):**
      *   **Case:** An agent, at time T, consciously judges course of action A to be best/all-things-considered better than B *for them at T*, possesses the capacity to do A, yet intentionally does B instead. No coercion, ignorance, or force majeure. (e.g., "I know I shouldn't eat this cake right now for my health goals, but I'm eating it anyway, eyes wide open.").
      *   **Requirement:** The theory *must* account for the possibility of intentional action that directly contravenes the agent's own *current, conscious, best judgement* about what to do *at that moment*. It must explain the failure of the judgement to control action *despite* being held and relevant.
      *   **Status:** **Non-negotiable.** This is the core phenomenon any theory of akrasia is primarily responsible for explaining. Denying its possibility (e.g., claiming the agent *must* have momentarily judged B best, or wasn't really able to do A) is often seen as evading the problem.

  2.  **Accommodate Akrasia Relative to Commitments/Resolutions Without Necessitating a Contemporary All-Things-Considered (ATC) Judgment:**
      *   **Case:** An agent forms a sincere resolution or commitment (e.g., "I will only have one drink tonight"). At the time of action, they face temptation and have more than one drink. Crucially, they do *not* form a new ATC judgment that having more drinks *now* is best; they simply act against their standing resolution. They may not even explicitly reconsider the ATC merits in the moment.
      *   **Requirement:** The theory must allow that akrasia can occur through the violation of a prior *commitment or intention* (a "decision made") even if the agent doesn't explicitly form a *contradictory best judgement* at the time of action. It must explain how resolutions exert normative force and how their violation constitutes a failure of will distinct from a mere change of mind *based on reassessment*.
      *   **Status:** **Non-negotiable (for a robust theory).** This challenges the "judgment-focused camp" by showing akrasia can manifest as failure to adhere to prior *practical commitments* without requiring a specific contradictory judgment *at T*. It demands an account of the stability and authority of intentions/resolutions.

  3.  **Distinguish Akrasia from Calm Reassessment/Changing One's Mind:**
      *   **Case:** An agent forms a resolution or judgment (e.g., "Working late tonight is the right thing to do for the project"). Later, calmly and reflectively, they reconsider, decide their earlier view was too rigid or mistaken (e.g., "My well-being matters more right now, I was wrong to prioritize work tonight"), and act differently without guilt or sense of failure.
      *   **Requirement:** The theory must provide clear criteria for distinguishing genuine weakness of will (acting against one's *own* current best judgment or binding commitment *without* adequate reassessment) from a *rational* or *permissible* change of mind based on new considerations, perspective, or reassessment of values/priorities. It must avoid pathologizing reasonable autonomy over time.
      *   **Status:** **Non-negotiable.** Collapsing this distinction makes akrasia ubiquitous and trivializes genuine failures of self-governance. The theory must explain what makes an act *akratic* rather than simply *revised*.

  4.  **Allow that Akratic Action Can Sometimes Be Correct (Judgment Was Flawed):**
      *   **Case:** An agent judges A best (e.g., "I must stay loyal to this corrupt institution out of duty") but feels strong countervailing inclination (e.g., revulsion, compassion). They "weakly" do B (e.g., whistleblowing). It turns out B *was* objectively the better/more justified action; the initial judgment was distorted by internalized bias, false beliefs, or corrupt values.
      *   **Requirement:** The theory must acknowledge that the *akratic character* of an action (acting against one's *own* best judgment) is distinct from the *objective rightness* of the action. It must allow that akrasia can sometimes, perhaps accidentally, lead an agent to do the right thing *despite* their flawed judgment. The failure is one of *self-governance according to one's own lights*, not necessarily of achieving the objectively good outcome.
      *   **Status:** **Non-negotiable.** This prevents the theory from being overly moralistic or conflating akrasia with objective wrongdoing. It highlights that akrasia is a failure relative to the agent's *own* evaluative standpoint at T.

  5.  **Integrate Hyperbolic Discounting and Predictable Preference Reversals:**
      *   **Case:** An agent, on Sunday, prefers a large delayed reward (e.g., feeling good Friday morning) over a small immediate one (e.g., drinking Thursday night). They plan/resolve accordingly. As Thursday night approaches, the steep discounting of the near-future reward (feeling good Friday) makes the immediate reward (drinking) seem subjectively larger, leading to a predictable reversal of preference and action against the prior plan. The agent may even foresee this reversal on Sunday.
      *   **Requirement:** The theory must be compatible with the empirically robust phenomenon of hyperbolic discounting and the resulting predictable preference reversals over time. It must explain why these reversals often *feel* like akratic failures (loss of self-control) to the agent, rather than cool recalculations. It needs to address the *temporal instability* of motivation and how prior resolutions attempt to bind future selves.
      *   **Status:** **Non-negotiable (for a psychologically realistic theory).** Ignoring this discounts a major empirical driver of what *looks and feels* like akrasia.

  **Which Requirement Does the Most Heavy Lifting Against Contenders?**

  *   **Requirement #1 (Clear-Eyed Akrasia)** is the most potent weapon against the main contenders:
      *   **Against the Will-Faculty:** A simple "weak will" faculty failing doesn't *explain* how the judgement exists but fails to motivate. Why is the "will" separate and why does it fail? The requirement forces an account of *why* the best judgment doesn't translate into action, which a bare faculty label doesn't provide.
      *   **Against the Divided-Mind/Strongest Desire Wins:** This view *collapses* Requirement #1. If the strongest *felt* desire always wins, then the agent who does B *must* have felt a stronger desire for B than for A *at that moment*. Therefore, they couldn't have *truly* judged A best *at that moment*; their "judgment" was either insincere, irrelevant, or merely intellectual. Requirement #1 insists the agent *does* genuinely judge A best *while* doing B, directly contradicting the "strongest desire wins" as a sufficient explanation for akrasia (though it might describe the motivational mechanics).
      *   **Against the "Just Kinked Discounting" View:** Requirement #1 explicitly rejects the idea that akrasia is "just ordinary choosing." The agent experiencing clear-eyed akrasia feels a *conflict* and a *failure*; they act *against* what they judge best. Mere time-consistent choosing with hyperbolic discounting (e.g., always maximizing *current* discounted utility) doesn't necessarily involve this contravention of a *current* best judgment. An agent maximizing current discounted utility *is* doing what they judge best *at that moment*, even if it reverses a prior plan. Requirement #1 forces the theory to explain the *failure to act on the current best judgment*, not just preference reversal.

  **Can the List Be Met All at Once? Addressing the Tension Between (iii), (v), and (i):**

  Yes, it's challenging but possible. **The key is distinguishing *structure* from *process* and recognizing different normative standards:**

  1.  **Resolving (iii) Calm Reassessment vs. (i) Clear-Eyed Contravention:** The theory needs a criterion for when reconsideration is "calm, rational, and adequate" (changing your mind) vs. "driven by distorting influences like proximity/temptation, failing to engage reason properly" (akrasia). This might involve:
      *   **Reasons-Responsiveness:** Did the agent engage with *reasons* consistent with their broader values during reconsideration, or was the shift driven purely by visceral appetite or biased perception?
      *   **Commitment Authority:** Did the agent override a *deliberately formed prior commitment* intended to bind them against predictable temptation, without sufficient new evidence or reason?
      *   **Affective Signature:** Does the agent feel mastery or failure? (Though this is suggestive, not definitive).
      *(iii) requires the theory to allow *rational* overrides; (i) requires it to explain *irrational* overrides.*

  2.  **Resolving (v) Hyperbolic Discounting vs. (i) Clear-Eyed Contravention:** The theory must explain *why* hyperbolic discounting often *leads to* the phenomenology captured in (i), rather than being mere cool recalculation. This involves:
      *   **The Role of Resolution:** Agents form resolutions *precisely because* they anticipate hyperbolic discounting will distort their future judgment. Violating the resolution *feels* like akrasia because they are failing the plan *they* set to counter predictable irrationality.
      *   **Judgment vs. Motivation:** Hyperbolic discounting explains the shift in *motivational strength*, but Requirement (i) insists the agent can still *judge* the delayed reward (or the commitment) as *better*, even while feeling the stronger pull of the immediate reward. The theory must account for this judgment/motivation gap.
      *   **Temporal Perspective:** The "clear-eyed" judgment at T might be made *from the perspective* of the agent's longer-term values, even while the short-term motivational system dominates. The failure is one of *enacting* the perspective they endorse.
      *(v) explains the *mechanism* of motivational shift; (i) demands an account of why this shift constitutes a failure *relative to the agent's own endorsed standard at T*.*

  **Conclusion:** A theory meeting all desiderata must explain how agents form and authorize commitments/judgments, why these sometimes fail to control action despite being held (Requirement 1 & 2), how this failure differs from rational revision (Requirement 3), acknowledge the distinction from objective rightness (Requirement 4), and integrate the powerful empirical driver of hyperbolic discounting without reducing akrasia to mere rational time-preference (Requirement 5, reconciled with 1 & 3). Requirement 1 is the cornerstone that prevents dissolutionist approaches. While tensions exist (especially between rational revision and irrational failure in the face of discounting), a sophisticated theory incorporating elements of commitment, judgment, temporal perspective, and reasons-responsiveness *can* coherently satisfy all five requirements.
