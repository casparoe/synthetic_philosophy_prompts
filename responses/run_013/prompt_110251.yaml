prompt: |-
  I have been reading an introductory book on metaethics, and its chapter on expressivism contains the following paragraph, which I would like audited rather than supplemented. I am not a metaethicist — I work in an adjacent area — and I cannot tell which of its sentences I should trust.

  "Expressivism holds that moral judgements do not describe the world: to call an action wrong is not to state a fact about it but to express the speaker's attitude of disapproval, in something like the way that a cry of 'Boo!' expresses one. The Frege–Geach problem, sometimes called the embedding problem, is the standard objection to this view. If 'lying is wrong' merely expresses an attitude, then in the sentence 'If lying is wrong, then getting your brother to lie is wrong' the antecedent is not asserted and so expresses nothing; the conditional has no content for the expressivist to analyse, and the argument from 'Lying is wrong' and 'If lying is wrong, then getting your brother to lie is wrong' to 'Getting your brother to lie is wrong', though obviously valid, comes out invalid on expressivist terms. Since so much moral argument has this form, the view cannot account for it. The same difficulty shows up in the fact that two people who disagree about whether lying is wrong are contradicting one another, whereas two people who merely have opposed attitudes are not. The problem is named for Frege, whose observation that a sentence means what it does in virtue of its truth-conditions leaves the expressivist with nothing to say about the embedded occurrence, and for Geach, who pressed the point against the non-cognitivists of the 1960s. Expressivists have by and large conceded it, and now claim only that the inference is pragmatically acceptable rather than logically valid — that we are entitled to move from the attitudes to the conclusion even though no entailment holds. Because the point of moral reasoning is that it can be valid, the Frege–Geach problem is widely regarded as having refuted expressivism."

  What I want is an accuracy audit, not a tutorial. Taking the paragraph clause by clause, please separate what a careful expressivist would accept, what would make them wince, and what is straightforwardly wrong — beginning with the opening characterization of the view, which I have some doubt any current expressivist would own. Where a clause is a simplification, say what it simplifies and whether the simplification is harmless. In particular, I would like the several complaints the paragraph runs together kept apart: the Frege–Geach problem itself, the embedding problem, the negation problem, and the problem of explaining moral disagreement. My suspicion is that the paragraph treats as one problem what are at least two, and I want to know whether the distinction is substantive or pedantic. I also want a verdict on three specific moves: the claim that an unasserted antecedent "expresses nothing" and so leaves the conditional without content; the claim that expressivists have conceded the objection and fallen back on pragmatic acceptability; and the closing claim that the problem has refuted the view. Does that conclusion follow from whatever in the paragraph is accurate? And if the view is not refuted, what is the strongest difficulty that remains, and what would count as a solution — I have heard quasi-realism and minimalism about truth offered as the expressivist's way out, but the paragraph never mentions them, and I do not know whether they change the audit.
reasoning: |-
  Okay, the user is asking for an accuracy audit of a metaethics paragraph on expressivism and the Frege-Geach problem. They're not a metaethicist but work in an adjacent field, so they need expert clarification without supplementary tutorials. 

  First, I notice they're suspicious about three key claims: (1) whether unasserted antecedents "express nothing," (2) if expressivists truly conceded defeat by retreating to pragmatics, and (3) whether Frege-Geach refuted expressivism. They also want disentanglement of four distinct problems (embedding, negation, disagreement, Frege-Geach itself) that the paragraph conflates.

  Hmm, the user's phrasing suggests they've done background reading—they mention quasi-realism and minimalism as possible solutions absent from the text. That's helpful context. Their request is unusually precise: they don't want corrections or expansions, just a trustworthiness gauge per clause. 

  Breaking it down: The opening "Boo!" analogy is indeed oversimplified but not wholly wrong—early emotivists like Ayer did use such comparisons. The real issue is the paragraph's conflation of embedding and negation problems. The user's instinct is right: these are distinct (though related) challenges. Embedding is about compositional meaning in unasserted contexts, while negation concerns denying claims without rejecting attitudes. 

  On the three contentious moves:
  - "Expresses nothing" is misleading. Contemporary expressivists (e.g., Gibbard) argue unasserted components express *potential* attitudes or states of planning.
  - The "conceded defeat" claim is outdated. Post-1990s expressivists like Blackburn developed sophisticated semantic systems (quasi-realism) precisely to preserve logical validity.
  - "Refuted" is too strong—the user's skepticism is justified. Modern expressivism is diminished but alive, with ongoing debates about "creeping minimalism" weakening its distinctiveness.

  The user's deeper need seems to be: "Can I cite this paragraph confidently?" The answer is mixed—it's serviceable for historical context but misrepresents current positions. They'll need caution when referencing the "conceded" and "refuted" claims especially. 

  Quasi-realism and minimalism do change the audit dramatically. Blackburn's project shows how expressivists can mimic realist semantics without conceding to descriptivism. The paragraph's omission here is a major flaw—it's like discussing Darwin without natural selection. 

  Strongest remaining difficulty? Probably the "negation problem" (Schroeder's work). A solution would require explaining why "Lying isn't wrong" expresses more than lacking disapproval—e.g., endorsing norms where disapproval is absent. 

  Final note: The user's meta-question about whether problem-conflation is substantive vs. pedantic is spot-on. It's substantive—different problems require distinct solutions. Bundling them weakens the objection.
answer: |-
  Here's a clause-by-clause accuracy audit, distinguishing acceptable claims, oversimplifications/harmful phrasings, and outright errors, while disentangling the key problems and addressing your specific concerns:

  ### Opening Characterization
  1.  **"Expressivism holds that moral judgements do not describe the world"**: **Broadly Acceptable (with nuance)**. This is the core non-descriptivist commitment. Modern expressivists (quasi-realists) might nuance "describe" but accept the fundamental point that moral judgments aren't *primarily* descriptive or representational in the way empirical claims are.
  2.  **"to call an action wrong is not to state a fact about it but to express the speaker's attitude of disapproval"**: **Oversimplified/Harmful**. While capturing the core idea of *expression*, this phrasing is characteristic of *early, simple emotivism* (Ayer, Stevenson). Modern expressivists (Blackburn, Gibbard) avoid "disapproval" as too psychological and simplistic. They use broader notions like "practical stances," "commitments," "plans," or "norm-acceptance" to handle complex judgments and reasoning.
  3.  **"in something like the way that a cry of 'Boo!' expresses one"**: **Misleading/Oversimplified**. The "Boo!" analogy is *only* illustrative of the basic expressivist *intuition* against descriptivism. Modern expressivists explicitly *reject* this as a model for how moral language works, precisely because it fails to account for embedding and logic (the Frege-Geach problem itself). Relying on it here sets up a straw man.

  ### The Frege-Geach Problem
  4.  **"The Frege–Geach problem, sometimes called the embedding problem, is the standard objection to this view."**: **Broadly Acceptable**. FG is indeed the central technical challenge. Calling it the "embedding problem" is common shorthand, though it encompasses more (see below).
  5.  **"If 'lying is wrong' merely expresses an attitude, then in the sentence 'If lying is wrong, then getting your brother to lie is wrong' the antecedent is not asserted and so expresses nothing;"**:
      *   **"merely expresses an attitude"**: **Oversimplified/Harmful**. Echoes point 2. Modern expressivists don't claim it *merely* does this in a "Boo!"-like way.
      *   **"the antecedent is not asserted and so expresses nothing"**: **Misleading/Inaccurate**. This is the core flaw. Modern expressivists emphatically do *not* claim unasserted components "express nothing." They argue they express *something else* – like a *potential* attitude, a commitment to a norm, or a state of mind conditional on accepting a premise. The problem is *explaining what that is in a way that validates logic*, not that nothing is expressed. Claiming it expresses nothing makes the problem seem trivial and insurmountable, which expressivists deny.
  6.  **"the conditional has no content for the expressivist to analyse, and the argument... comes out invalid on expressivist terms."**: **Oversimplified/Harmful**. While the challenge is real, saying it "has no content" and "comes out invalid" assumes expressivism *must* fail to provide an analysis, which modern expressivists explicitly attempt (via quasi-realism, norm-expressivism, plan-realism). They aim to show how such arguments *can* be valid within their framework.
  7.  **"Since so much moral argument has this form, the view cannot account for it."**: **Premature/Disputed**. Expressivists argue they *can* account for it (see below). This phrasing presents the objection as definitively successful, which is contested.

  ### The Disagreement Problem
  8.  **"The same difficulty shows up in the fact that two people who disagree about whether lying is wrong are contradicting one another, whereas two people who merely have opposed attitudes are not."**: **Broadly Acceptable as a distinct but related problem**. This *is* a distinct challenge: explaining the *logical* nature of moral disagreement (contradiction) versus mere attitudinal clash. However, it's deeply intertwined with the embedding problem – solving one often contributes to solving the other. Modern expressivists offer accounts of disagreement as clashing attitudes/norms/plans that function *like* contradiction.

  ### Naming and History
  9.  **"The problem is named for Frege... and for Geach..."**: **Broadly Acceptable (historical fact)**. Frege's point about context (the context principle) and Geach's application to non-cognitivism are correctly cited.
  10. **"Frege... leaves the expressivist with nothing to say..."**: **Oversimplified**. Frege's observation *creates* the challenge, but modern expressivists claim they *do* have something to say (e.g., analyzing embedded contexts as expressing higher-order attitudes or commitments).

  ### The "Concession" and "Retreat"
  11. **"Expressivists have by and large conceded it, and now claim only that the inference is pragmatically acceptable rather than logically valid..."**: **Outdated/Misleading/Inaccurate**.
      *   **"Conceded it"**: **False**. Leading expressivists (Blackburn, Gibbard, Schroeder) emphatically *do not* concede the FG problem is unsolvable or that logic is abandoned. They dedicate their careers to *solving* it within expressivism.
      *   **"claim only that the inference is pragmatically acceptable"**: **Largely False**. While *some* early responses explored pragmatic routes (e.g., Searle), modern expressivism's dominant strategy (quasi-realism) is explicitly *semantic*. They aim to provide a compositional semantics where moral sentences in embedded contexts have *propositional content* (often "minimal" truth-apt content) such that arguments like modus ponens are *logically valid*. They argue we can *earn the right* to logical vocabulary without abandoning expressivism's core. Pragmatics might supplement, but it's not the primary fallback.

  ### The "Refutation"
  12. **"Because the point of moral reasoning is that it can be valid, the Frege–Geach problem is widely regarded as having refuted expressivism."**: **Overstated/Contested**.
      *   **"widely regarded as having refuted"**: **Exaggerated**. While FG is universally acknowledged as a *major* challenge, it is *not* widely regarded as a *refutation* among contemporary metaethicists. Expressivism (especially quasi-realism) remains a vibrant, actively defended research program.
      *   **The conclusion**: **Does not follow** from an accurate assessment. Modern expressivism *attempts* to show how moral reasoning *can* be logically valid. Whether they succeed is debated, but they haven't conceded defeat.

  ---

  ### Addressing Your Specific Concerns & Distinctions

  *   **Problems Conflated**: The paragraph runs together:
      1.  **The Core Embedding Problem**: How to assign consistent meaning/expressive function to moral terms in unasserted contexts (like the antecedent of a conditional) to allow compositional semantics and logic.
      2.  **The Negation Problem**: A specific, harder instance of embedding: How does "Lying is *not* wrong" function? It can't just express the *absence* of disapproval – it must express a *positive* state incompatible with accepting "Lying is wrong." (This is distinct and often considered tougher than simple conditional embedding).
      3.  **The Disagreement Problem**: Explaining why moral disputes feel like genuine contradictions, not just clashes of preference. This is distinct but deeply connected to embedding/negation.
      *   **Distinction Substantive or Pedantic?**: **Substantive**. The Negation Problem is often considered a deeper, more difficult challenge than simple conditional embedding. The Disagreement Problem requires a specific solution beyond just solving embedding. Treating them as one problem obscures the complexity and the different strategies needed.
  *   **Claim: Unasserted Antecedent "Expresses Nothing"**: **Misleading/Inaccurate** (as per point 5 above). Modern expressivists reject this; they posit expressions of *conditional* or *higher-order* states.
  *   **Claim: Conceded & Fallen Back on Pragmatics**: **Outdated/Largely False** (as per point 11 above). The dominant strategy is semantic (quasi-realism/minimalism).
  *   **Claim: Refuted**: **Overstated/Contested** (as per point 12 above). Expressivism persists as a major theory.
  *   **Role of Quasi-Realism/Minimalism**: **Crucial & Omitted**. This is the *primary* modern expressivist response. Blackburn/Gibbard argue that by adopting a *minimalist theory of truth* (where "true" is just a device for endorsement, generalization, etc.), expressivists can grant moral sentences *minimal truth-aptness* and *logical form* without conceding they represent robust moral facts. They then build complex semantic frameworks (e.g., using possible worlds, planning states) to explain compositionality and validity. **Omitting this renders the paragraph's portrayal of expressivism obsolete and its conclusion about refutation invalid.**
  *   **Strongest Remaining Difficulty**: The **Negation Problem** (Schroeder) and related issues concerning the *logical structure* and *inferential relations* between complex attitudes/commitments/plans remain the toughest hurdles. Providing a fully satisfactory, non-mysterious account of how non-cognitive states combine to mimic propositional logic is an ongoing project.
  *   **What Counts as a Solution?**: A solution would be a compositional semantics that:
      1.  Assigns a uniform semantic value (e.g., a type of mental state) to moral terms across all grammatical contexts (asserted, embedded, negated).
      2.  Defines logical operators (if-then, not, and, or) such that they combine these semantic values systematically.
      3.  Validates paradigmatically valid inferences (modus ponens, negation introduction/elimination) as genuinely valid *within this system*.
      4.  Explains moral disagreement as a clash captured by the logic.
      5.  Remains faithful to the core expressivist insight that moral judgment is fundamentally practical/conative rather than purely descriptive/cognitive.
      Quasi-realism/minimalism provides the *framework* for attempting this; success depends on the details of the specific semantic proposal (e.g., Gibbard's plan-laden worlds, Blackburn's attitudes to attitudes).

  **In Summary:** The paragraph accurately identifies FG as the core challenge but relies on an outdated ("Boo!"), simplistic caricature of expressivism. It misrepresents modern expressivism by ignoring quasi-realism/minimalism, falsely claiming expressivists conceded and retreated to pragmatics, and misleadingly stating that unasserted components "express nothing." It conflates distinct problems (embedding, negation, disagreement). While FG remains a serious hurdle, the claim that it has "refuted" expressivism is an overstatement given the active, sophisticated defenses mounted within contemporary quasi-realist expressivism centered on solving the embedding problem semantically. The Negation Problem is arguably the strongest outstanding difficulty.
