answer: |-
  ## Four Stakes at Sixty Pennies

  **Stake: Nothing**  
  Heads or tails, the coin is warm,  
  but my hands stay in my coat.  
  Why risk a single copper?  
  The cautious note I wrote  
  says *safe* is its own profit.  
  The counting voice just sighs:  
  "Your pile won't shrink, it's certain,  
  but untouched wealth just lies.  
  It gathers dust, not interest,  
  a statue, cold and cleft  
  from the river's flow. You forfeit  
  the current. Stake a **fifth of what is left**."

  **Stake: A Fifth**  
  The coin spins high, a glinting sun.  
  Six times in ten, it lands my way!  
  A fifth goes forward. When I win,  
  the heap gains twenty cents that day.  
  But when the cruel tail shows its face,  
  a fifth is clipped. The loss is clean.  
  The counter hums: "This steady pace  
  will lift your wealth to heights unseen,  
  on *average*." Yet the path I tread  
  feels slow and steep, a patient weft  
  of modest gains and losses spread.  
  I stake again **a fifth of what is left**.

  **Stake: Half**  
  Now half the pile gleams on the cloth,  
  a daring bid for faster gain.  
  Heads! Gold swells, proof of my faith,  
  banishing momentary pain.  
  But Tails! The knife cuts deeper now –  
  half vanishes! From ten, just five.  
  The counter beams: "Just see *how*,  
  on balance, fortunes still arrive!  
  The average swells!" My dwindling stack  
  tells truer tales. The coin is deft.  
  My breath is tight across my back.  
  I place once more **a fifth of what is left**.

  **Stake: Everything**  
  All clinking hope upon the line,  
  a tower built on shifting sand.  
  The coin arcs up, a final sign.  
  Heads? Riches bloom across the land!  
  But Tails... is silence. Empty air.  
  Where fortune stood, a hollow cleft.  
  The counter's voice, still ringing fair:  
  "Across the countless worlds bereft  
  and blessed, the *average* wealth takes flight!  
  It soars on wings, by math bereft  
  of ruin's sting." I face the night,  
  my pockets holding **fifth of what is left**.

  ---

  **Note from the Writer (Person-to-Person):**

  You've grasped the core tension brilliantly – the chasm between the arithmetic mean (average outcome across *all* possible futures) and the geometric mean (the typical growth rate along a *single* path). Your spreadsheet intuition is spot-on: maximizing the expected value (arithmetic mean) *can* lead to ruin on the path you live, while maximizing the geometric mean (Kelly) prioritizes survival and compounded growth along actual paths.

  **Where the Poem Fudges/Oversimplifies:**

  1.  **"Typical Path" vs. Median/Geometric Mean:** The poem uses "path I actually live" and "typical path" as proxies for the *median outcome* or the outcome driven by the *geometric mean growth rate*. These are related but distinct concepts. A statistician might argue "typical" is vague; the geometric mean precisely defines the *long-term growth factor* per bet. The poem leans on narrative intuition over strict definition.
  2.  **"Three percent a toss" / "Two percent a toss":** Your numbers are essentially correct for the *median* or *mode* outcome *per bet* at those stakes. However, the *actual* growth rate per bet along a specific path fluctuates wildly, especially with high volatility (like staking half). The poem implies a steadier "typical loss/gain per toss" feeling than the reality of jagged sequences.
  3.  **Infinite Repetition:** The poem relies on the *idea* of "the long run" for the counter's argument. In reality, no one bets infinitely. Kelly protects against ruin *en route* to that theoretical long run. The "counting voice" is mathematically correct about the *expectation*, but practically blind to the risk of *sequence of returns* wiping you out before reaching it.
  4.  **The Final Stanza:** The counter's insistence that "the *average* wealth takes flight... bereft of ruin's sting" is literally true mathematically (if the expected value per bet is >1, average wealth → ∞ over infinite bets). But it *feels* like a cruel joke to the ruined speaker. This highlights the core conflict perfectly, but a purist might note that ruin (wealth=0) *is* one of the paths averaged in, dragging the geometric mean to zero for over-betting, even while the arithmetic mean grows.

  **You Are Not Wrong:** Your premise is fundamentally sound and captures the essence of Kelly's insight better than many academic explanations. The tension between the bird's-eye view of all possibilities and the worm's-eye view of one lived sequence is profound, real, and perfectly suited to poetry. The poem doesn't settle the argument because *there is no single right answer* – only a trade-off between potential upside and the risk of disaster, where the "best" choice depends entirely on your goals and tolerance for ruin. Your intuition about the fraction surviving, not the absolute money, is the geometric mean's heart. Well reasoned.
