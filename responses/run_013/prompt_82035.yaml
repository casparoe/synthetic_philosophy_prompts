prompt: |-
  So I write a weekly advice column for a travel magazine — Dear Wanderer, basically — and I keep getting letters that are all the same shape: a reader was somewhere, everyone around them was doing X, they didn't do X, and now they want to know whether they did something wrong. Tipping at a sit-down place in the US when you're from a country that doesn't. Standing at a red light on an empty street at 2am while a river of locals crosses around you. Joining a queue from what turns out to be the wrong end. Half of these I can answer in a line, but I've noticed I'm just winging it, and my answers don't agree with each other from one week to the next, which readers have definately noticed and emailed me about, which is embarrassing.

  What I want from you is a decision procedure I can actually run on a letter in about fifteen minutes: an ordered set of questions that tells me whether the local convention my reader skipped was something they were genuinely obliged to follow, or just the local way of doing things that they're allowed to opt out of at some social cost. Obliged in the real sense, I mean, not just rude — I can already tell them they were rude, that part's easy.

  Ground it in whatever philosophy actually knows about this: the Lewis-style story where conventions are just solutions to coordination problems that happened to stick, Hart's point that a social rule is different from a mere habit because people take a critical attitude toward deviations from it, the fair-play argument that you owe compliance to a practice you're knowingly taking the benefits of, and the limits of when-in-Rome. Don't send me a reading list though, I won't read it and my readers definitely won't.

  One thing I've been half-thinking about and can't get straight — use it, fix it, or tell me it's rubbish: some conventions seem load-bearing, in the sense that something would actually come apart if enough people stopped, and others are pure shibboleth, a way of telling locals from tourists, where skipping them costs you nothing but a look. I suspect the obligation question turns on which one you're dealing with, but I can't tell them apart in the cases that actually matter, which is the whole problem.

  Then run the procedure on three letters and show your work: (1) a reader who didn't tip at a sit-down restaurant in the US because they think the tipping system is exploitative and don't want to participate in it; (2) a reader who waited at an empty crossing at 3am in a city where everyone jaywalks and got jeered at for it; (3) a reader who was told at a land border that there's a small "processing fee" you pay the officer directly, which everyone apparently does. At least one of those should come out in a way I won't like, and I want you to say which parts of the procedure are handing the call back to me because it's a values question dressed up as a factual one. My editor gets final say on anything that reads like legal advice, and the whole column is 600 words, so whatever the procedure concludes has to survive being said in two sentences.
reasoning: |-
  Okay, let me tackle this problem step by step. The user writes an advice column for a travel magazine called "Dear Wanderer" and keeps getting similar letters where readers skipped a local convention and now wonder if they were wrong. The user needs a consistent decision procedure grounded in philosophy to distinguish between genuine obligations and optional conventions. 

  First, I need to recall relevant philosophical concepts. David Lewis's coordination problems explain why conventions form—they're solutions that stick. H.L.A. Hart's social rules involve a critical attitude towards deviations, not just habits. The fair-play argument suggests that benefiting from a practice obligates participation. Also, the "when in Rome" principle has limits. 

  The user mentioned a key distinction between load-bearing conventions (necessary for function) and shibboleths (mere identifiers). This seems crucial. For the decision procedure, I should create a flowchart with yes/no questions that quickly categorizes each case. The steps should determine if the convention is functional, expected with criticism, or optional. 

  Now, applying this to the three examples. For the tipping case: Tipping in the US is load-bearing (servers' wages depend on it), has normative expectations (social criticism), and benefits received (service). Skipping it likely breaches obligation. For jaywalking at 3am: The convention isn't load-bearing when no safety risk exists, criticism is just mockery, so optional. For the border fee: It's likely corruption (illegal), no functional purpose, so no obligation—might even have a duty to refuse. 

  The user wants the procedure to handle values questions transparently. In the tipping example, the "benefit received" step flags a values conflict: refusing to tip on principle versus fair-play obligation. The advice must acknowledge this tension without prescribing. 

  Finally, compressing conclusions into two sentences each. For tipping: obligation due to reliance and benefit. For jaywalking: personal choice. For the fee: refuse as it's corruption. The user needs to know which parts are values-based (like assessing exploitation in tipping) so they can address it editorially without overstepping into legal advice.
answer: |-
  Here's a 5-step decision procedure grounded in social philosophy, designed for speed. Run through each question in order – a "Yes" usually means **obligation**, a "No" usually means **optional convention** (with potential social cost). Stop if you hit a definitive answer.

  **The Dear Wanderer Obligation Detector (15-Minute Edition):**

  1.  **Function Test:** Does skipping this convention *directly* undermine the core function of the situation or institution, or create immediate, tangible harm/danger *right now*? (Lewis: Coordination breakdown? Hart: Is the rule tied to a vital practice?)
      *   *Yes? → Likely **Obligation.***
      *   *No? → Go to Step 2.*

  2.  **Critical Attitude Test:** Do locals react to deviations with *more than mild amusement or annoyance*? Is there clear social pressure, criticism, sanction, or correction, implying they view it as a *rule*? (Hart: The "critical reflective attitude")
      *   *Strong Yes (anger, refusal of service, fine, significant shaming)? → Likely **Obligation.***
      *   *Weak/Mild Yes (eye rolls, teasing, confusion)? → Go to Step 3.*
      *   *No (indifference)? → Likely **Optional Convention.***

  3.  **Benefit & Fair-Play Test:** Did the traveler *knowingly receive a specific, material benefit* directly enabled *only* by everyone else following this convention? Would skipping it while taking the benefit be "free-riding"? (Fair-Play Principle)
      *   *Strong Yes (essential service funded/operated this way)? → Likely **Obligation.***
      *   *Unclear/Indirect Benefit? → Go to Step 4.*
      *   *No? → Go to Step 4.*

  4.  **Shibboleth vs. Load-Bearing Test:** Is the convention *primarily* about signaling group membership ("locals do this")? Or is it genuinely *necessary* for the smooth, safe, or fair operation of things, even if the *exact form* is arbitrary? (Your Insight: Load-Bearing vs. Shibboleth)
      *   *Primarily Shibboleth (costs you only social points)? → **Optional Convention.***
      *   *Load-Bearing (things work *because* people do this)? → Go to Step 5.*
      *   *Unclear? → **Optional Convention.*** (When in doubt, lean towards freedom).

  5.  **Legality/Morality Override:** Is the convention *illegal*, *exploitative*, *discriminatory*, or *fundamentally immoral* by widely accepted standards (not just the traveler's personal dislike)? Would complying make the traveler complicit in harm?
      *   *Yes? → **No Obligation** (and potentially a duty to refuse).*
      *   *No? → **Obligation** (even if arbitrary, it's load-bearing and expected).*

  **Values Flags:** Steps 3 (Benefit/Fair-Play) and 5 (Legality/Morality) are where *your* judgment on exploitation, fairness, and complicity comes in. The procedure flags these as value judgments you *must* make.

  ---

  **Applied to Your Letters:**

  **1. US Restaurant - No Tip (Protest Exploitation)**
  *   **1. Function Test:** **Yes.** Tips are a core part of server compensation. Skipping directly denies them expected wages. System relies on it.
  *   **Conclusion:** **Obligation** to tip *in this system, right now*. (Stops at Step 1).
  *   **The Catch & Values Flag:** Step 5 is *screaming* here. *Is the system itself exploitative?* **YES, widely acknowledged.** *Does paying make you complicit?* **This is a VALUES JUDGMENT.** The procedure says the convention is load-bearing (Step 1) and expected (Step 2 - strong criticism). BUT Step 5 allows refusal if it's fundamentally immoral/exploitative. **You must decide:** Is the harm of non-participation (stiffing the worker) *greater* than the harm of participation (reinforcing a bad system)? There's no purely factual answer. **Your Answer Needs:** "While the tipping system is flawed and arguably exploitative, stiffing your server *right now* directly harms them. Tip generously as obligation, then advocate for systemic change separately." (This is the one you won't like - the procedure forces the complicity/value judgment onto you).

  **2. 3am Empty Crossing - Waited, Got Jeered**
  *   **1. Function Test:** **No.** At 3am, empty street, no traffic. No immediate safety risk or functional breakdown caused by waiting.
  *   **2. Critical Attitude Test:** **Weak Yes.** Jeering indicates *awareness* it's a norm, but it's mockery, not sanction. Shows it's a convention, not a sacred rule.
  *   **3. Benefit/Fair-Play:** **No.** Didn't receive a specific benefit *by* others jaywalking at that moment.
  *   **4. Shibboleth vs. Load-Bearing:** **Primarily Shibboleth/Local Custom.** At 3am empty, crossing against the light is harmless local behavior signaling "you know how we do things." Waiting marks you as an outsider but causes no operational harm.
  *   **Conclusion:** **Optional Convention.** No obligation to jaywalk. Social cost (jeering) is real but minor. Personal safety/comfort preference wins. **Your Answer:** "You did nothing wrong prioritizing your comfort, even if it marked you as a tourist. Safety first, always."

  **3. Border "Processing Fee" to Officer**
  *   **1. Function Test:** **No.** Legitimate border processing fees are official, receipted, and go to the government, not the officer's pocket. This bypasses the system.
  *   **2. Critical Attitude Test:** **Yes (Strong).** "Everyone does it" implies strong expectation and potential sanction (delays, hassle) for refusal. Officer directly demands it.
  *   **3. Benefit/Fair-Play:** **Unclear.** The "benefit" is avoiding hassle/expediting processing. But it's a benefit created *by* the corrupt demand itself.
  *   **4. Shibboleth vs. Load-Bearing:** **Not Load-Bearing for Legitimate Function.** It's corruption. The *official* process doesn't rely on bribes.
  *   **5. Legality/Morality Override:** **YES.** This is almost certainly a bribe (illegal and immoral). Paying perpetuates corruption and undermines the rule of law.
  *   **Conclusion:** **NO OBLIGATION** (Step 5 Override). A duty *not* to pay. **Your Answer:** "This is likely a bribe, not a legitimate fee. Politely refuse to pay it directly to the officer. Ask for an official receipt or supervisor if pressured." **(Editor Flag: This *sounds* like legal advice. Frame carefully: "Many anti-corruption NGOs advise travelers to refuse unofficial cash payments...")**

  ---

  **Summary & The Two-Sentence Challenge:**

  *   **Tipping (US Restaurant):** "The system relies on tips for wages, so you're obligated to tip your server regardless of your stance on the policy; stiffing them punishes the worker, not the system." (Values conflict acknowledged: *why* they feel obliged despite the bad system).
  *   **Jaywalking (3am Empty):** "At 3am with no traffic, jaywalking is local custom, not obligation; waiting is fine, though it might mark you as an outsider."
  *   **Border "Fee":** "Unofficial cash payments to officers are likely bribes; refuse politely and ask for an official receipt or supervisor." (Editor review needed for framing).

  **Key Philosophy in a Nutshell:** Obligation arises when a convention is *functional* (load-bearing), *expected as a rule* (critical attitude), and you *benefit directly from it* (fair-play). Shibboleths and corrupt practices generally lack obligation. **The hard part?** Deciding when a harmful-but-functional system (like tipping) creates obligation *despite* its flaws (Step 5 override is rare and high-bar). That's the value judgment you own.
