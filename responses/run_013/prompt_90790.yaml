prompt: |-
  Two cases, both about who gets to speak for someone who has changed, and I have not been able to find a name for what the pair of them shows.

  Case one. A man in his early sixties, fully competent, signs a directive declining hospitalization, ventilation, and artificial feeding if he should ever reach a point where he can no longer live independently or manage his own affairs. Ten years on he is in that state: demented, in a care home, still recognizes his daughter, still enjoys visitors. He develops pneumonia. The directive is produced and followed, and when the daughter protests that her father is sitting right there and wants to be treated, the reply is that the man she is pointing at is not the man who signed, and the man who signed is the one whose autonomy is being honored.

  Case two. A man in the same position, whose directive is older, and who is still legally competent, though severely depressed after his wife's death. He asks for the document to be set aside and for everything to be done. He is refused: the depression is said to be doing the asking, and the earlier document governs. Here the self who is present and speaking is the one ruled out as not really him.

  In the first case the earlier self wins; in the second the later self wins; and in both, the decision goes to whichever self the people around the bed are willing to call the real one. The question of which moment in a life has authority looks like it is doing the work, and I do not believe it is. What presents itself as a temporal rule seems to be a substantive judgment about which version of the person we endorse, wearing the costume of a temporal rule, and nobody involved has to notice that a substitution has been made.

  I know the standard apparatus here — Ulysses contracts, precommitment, the long dispute over whether the later self is the same person as the earlier one and so can be bound or wronged. Those seem to be about defeating momentary weakness, or about personal identity, and neither is quite what I am pointing at. The adaptive-preference worry comes closer, but it reaches only case one; the depressed man is disqualified on other grounds.

  Is there an established name for this, and if there is, I want the boundary rather than the label: what it covers that ordinary self-binding does not, where the line falls between a self that is not competent to speak for the person and a self that is competent but not treated as authoritative, and whether the same structure turns up outside medicine — in the twenty-two-year-old whose commitment the thirty-five-year-old wants out of, and in the onlookers who insist that only one of them was the real her. If nothing in circulation fits, coin something, but define it against the nearest neighbours.
reasoning: |-
  Hmm, the user is presenting two complex medical ethics cases about advance directives and identity over time, pointing out a pattern where caregivers selectively endorse one "self" over another based on unspoken value judgments rather than clear temporal rules. 

  The first case shows a dementia patient's prior competent self being honored over his current diminished self, while the second shows a depressed but legally competent patient's current wishes being overridden in favor of his past directive. The user's keen observation is that in both scenarios, the decision ultimately depends on which version of the person the caregivers subjectively validate as "real" - a substantive judgment disguised as temporal reasoning.

  I recognize this isn't covered by standard frameworks like Ulysses contracts (which address weakness of will) or personal identity debates (which focus on metaphysical continuity). The adaptive preference concept only partially fits the dementia case. The deeper issue seems to be about epistemic authority - who gets to claim knowledge of the "true" self when values conflict across time.

  For the boundary definition: this differs from ordinary self-binding because it involves third parties making qualitative judgments about which self-state represents authenticity, rather than enforcing prior instructions mechanically. The key distinction from incompetence determinations is that here competence exists but is disregarded based on perceived inauthenticity (as with the depressed man).

  Outside medicine, we see similar patterns in how society treats youthful commitments (e.g., marriage vows) when older selves want release - observers often privilege either the "idealistic" young self or "mature" older self based on cultural preferences. The common thread is outsiders conferring ontological weight to certain life stages.

  The user wants precision on where the line falls between "incompetent" and "competent but unauthorized" selves. Legally, competence is binary, but ethically, the cases show a gray zone where competence exists but authenticity is contested. The depressed man case is particularly troubling because it medicalizes dissent.

  I should name this "Epistemic Displacement of Agency" to capture how caregivers substitute their judgment about authentic identity for the patient's own expressions. The coinage needs to distinguish it from related concepts: unlike therapeutic privilege, it's not about information withholding; unlike soft paternalism, it actively dismisses current agency.

  The user's frustration with temporal arguments masking value judgments is spot-on. We might consider this a form of "temporal essentialism" where caregivers reify one time-slice as authoritative. The clinical solution would require transparent articulation of the value judgments being made - e.g., "We prioritize your father's fear of dependence over his current enjoyment of life" rather than hiding behind the document.
answer: |-
  This is a brilliantly articulated observation about the selective validation of selves across time. What you're describing lacks a single established term because it sits at the intersection of several concepts (advance directives, competence, authenticity, paternalism, personal identity), but its core mechanism – **the third-party selection of a "privileged self" deemed "authentic" based on substantive values masquerading as a temporal or competence rule** – is distinct. Let's break it down and coin a term that captures its essence.

  ### Core Concept & Boundary
  *   **The Phenomenon:** "Privileged Self Selection" or "Selective Temporal Authorization."
  *   **Definition:** The process whereby third parties (caregivers, institutions, observers) resolve conflicts between an individual's past and present expressed wishes or identities by selectively endorsing one temporal "self" as the "authentic" or "authoritative" representative of the person, based on unstated substantive value judgments about which self-state best reflects the person's "true" interests, character, or rationality. This selection is often justified using temporal rules (e.g., "the directive governs") or competence assessments that function as proxies for the underlying value judgment.
  *   **Boundary with Ordinary Self-Binding (Ulysses Contracts):**
      *   **Self-Binding:** Assumes the *present competent self* is binding the *future potentially compromised self*. The authority flows from the *present* actor. Enforcement typically focuses on *procedural validity* and *preventing temporary irrationality* (weakness of will, panic).
      *   **Privileged Self Selection:** Involves a *third party* choosing *which self* (past or present) has authority in a conflict. The justification often hinges on a *substantive judgment* about which self-state represents the "real" person or their "true" interests/rationality, *disguised* as adherence to a rule (temporal priority, competence). It can privilege the *past* self over a *present* self (Case 1) or a *past* self over a *different present* self (Case 2 - where the depressed self is deemed "inauthentic" compared to the non-depressed past self).

  ### Boundary with Competence & Authenticity
  *   **"Incompetent" vs. "Competent but Not Authoritative":** This is the critical line your cases expose.
      *   **Incompetent:** A self-state lacks the cognitive/decision-making capacity to understand, appreciate, reason about, or communicate a choice *at that moment*. Medical treatment follows substituted judgment (what they *would* have wanted) or best interests.
      *   **Competent but Not Authoritative (The Crux):** The individual *is* legally and clinically competent *at the present moment* (like the depressed man), but their current wishes are overridden *not* because they lack capacity *now*, but because a third party judges that this competent self-state is "inauthentic," "distorted," or "not the *real* them" compared to a past self-state. This is a *substantive value judgment* about identity and rationality, *not* a straightforward capacity assessment. The "inauthentic" label is applied based on the *content* or *context* of their wish (e.g., depression, perceived irrationality). **This is the novel and problematic territory your cases highlight.**

  ### The Structure Beyond Medicine
  This pattern absolutely appears elsewhere:
  1.  **Life Commitments:** The 22-year-old who joins a religious order/military/signs a long contract vs. the 35-year-old who wants out. Onlookers may argue:
      *   "The *real* her is the idealistic young woman who made that sacred vow" (Privileging Past Self).
      *   "The *real* her is the mature adult who sees the consequences clearly now" (Privileging Present Self - less common in your cases, but possible). The enforcement/denial hinges on which self the *institution or observers* deem "authentic" or "truest."
  2.  **Political/Religious Conversion:** A former radical who renounces their past views might be dismissed as "inauthentic" or "coerced" by old comrades who privilege the past self, or embraced as "finally seeing the light" by new associates who privilege the present self.
  3.  **Artistic/Ethical Judgments:** Judging an artist's "true" work by their early period vs. their late period involves privileging one temporal self based on substantive aesthetic values.

  ### Coining the Term: "Substantive Temporal Authorization" (STA)
  *   **Why this term?**
      *   **Substantive:** Highlights the core mechanism – the decision rests on unspoken value judgments about which self-state represents the "true" person, their "real" interests, or "authentic" rationality.
      *   **Temporal:** Captures the context of conflict across time and the use of temporal rules (past directive vs. present wish) as the framework.
      *   **Authorization:** Emphasizes that it's about granting *authority* to speak for the person, not just describing a state.
      *   It distinguishes itself by focusing on the *third-party's selective validation process* based on *values*, not just the existence of conflicting selves or a binding mechanism.

  ### Defining STA Against Neighbors
  *   **vs. Ulysses Contract/Precommitment:** STA involves a *third party* selecting the authoritative self. Ulysses contracts are tools *used by the present self* to bind a future self, enforced based on procedural validity and preventing temporary irrationality. STA can *misuse* advance directives as tools for STA.
  *   **vs. Personal Identity Debate:** While metaphysical questions lurk, STA is a *practical, ethical, and procedural* problem of *who gets to decide* which self speaks authoritatively *in a specific context*, driven by third-party values, not necessarily a deep ontological claim about identity persistence.
  *   **vs. Paternalism:** STA is a *specific form* of paternalism where the justification hinges on denying the *authenticity* or *authority* of the current competent self in favor of a past self (or vice versa, though less common), masked by temporal rules. Soft paternalism targets incompetence; STA targets competent-but-deemed-inauthentic.
  *   **vs. Adaptive Preferences:** Correctly noted – it captures Case 1 well (dementia patient adapting to diminished state) but fails for Case 2 (depression is seen as *distorting*, not adapting to, the situation). STA encompasses both situations under the umbrella of third-party validation based on substantive judgment.

  ### Conclusion
  You've identified a crucial and under-theorized dynamic: **Substantive Temporal Authorization (STA)**. It occurs when third parties resolve conflicts between past and present expressions of self by selectively authorizing one as "authentic," based on their own substantive value judgments about rationality, identity, or "true" interests, often cloaked in the language of temporal rules or competence determinations. Its key distinguishing feature is overriding the wishes of a *currently competent* self-state deemed "inauthentic," which marks the boundary from simple incompetence determinations or procedural enforcement of self-binding agreements. This structure permeates decisions far beyond the bedside.
