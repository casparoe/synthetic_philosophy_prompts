prompt: |-
  Three weeks ago a colleague whose own expense reports are, to put it mildly, creative informed me that I had no business padding mine. Two weeks before that I had delivered a nearly identical rebuke to someone else, with a record no cleaner than hers. I have been chewing on both episodes since, and I would like you to help me turn the following into a principle.

  My verdicts. When that colleague rebukes me for padding, I do not think she has standing to do it; the rebuke is not one she gets to make, though I would not say it is false and would not say I may simply ignore it. When the same colleague, after a year of straight reports, says the same thing, I think she does have standing, and that the change in her record changes something important. When a colleague who has never padded anything says it, her standing is not in question and I feel no impulse to audit her past. When a judge who was himself convicted of the offence sentences a defendant for it, I think he has full standing: the bench confers what the man lacks. Likewise a parent who lies to her children may tell them not to lie, and I do not think her standing is thereby diminished. When my brother, whom I lent money knowing he would spend it on the drugs that then wrecked his family, tells me I have no standing to blame him for wrecking it, I think I do have standing, though the blame lands softer for my part in it. When a man who cheerfully informs me that he is about to do the very thing he is blaming me for rebukes me for it, I think he has standing — oddly more than my unrepentant colleague, though his record is no better and his future worse. And when I ask a friend to carry a rebuke to someone I cannot rebuke myself, I think the friend's delivery stands or falls on the friend, and that my authorship behind it does not poison it.

  The last two verdicts will not sit with the first, and I suspect the first and the fourth cannot both be right as I have stated them. My tentative principle is that a person has standing to blame just in case addressing the blame to the person would not itself wrong that person — the rebuke must not be a vehicle for wronging the rebuked. That seems to save the first, second, sixth, and eighth verdicts; I cannot see whether it saves the fourth or the fifth, and it threatens to collapse into the claim that only those who are themselves wronging the rebuked lack standing, which is surely too strong.

  Please give me the principle, or the smallest set of competing principles, that best fits this pattern, saying for each clause which case forces it. Tell me what the principle predicts for cases I have not mentioned — blaming the dead, blaming a corporation, blaming oneself, blaming someone for a fault one shares but has never once been tempted by. And tell me honestly which of my verdicts it cannot accommodate. If the truer story is that I have been running two questions together — whether the rebuke is deserved, and whether the rebuker is in a position to deliver it — then say so, and say which of my verdicts belong to which question.
reasoning: |-
  Hmm, the user presents a complex ethical puzzle about the standing to blame. They've described several scenarios where someone rebukes another for wrongdoing, and the legitimacy of that rebuke seems to depend on various factors about the rebuker's own conduct or position. 

  The user wants me to extract a coherent principle from these judgments. I notice they've already attempted a principle themselves - that standing exists when the rebuke wouldn't itself wrong the rebuked person - but they recognize it doesn't cover all their cases consistently. 

  Looking at their scenarios: The colleague with creative expenses lacks standing to rebuke them, but if that same colleague reformed for a year, standing returns. A consistently honest colleague has unquestioned standing. A judge convicted of the same crime still has standing by virtue of office. A lying parent can still tell children not to lie. The user believes they have standing to blame their brother despite their own complicity. The hypocrite who plans to repeat the offense still has standing. And a messenger's standing depends on themselves, not the message's origin.

  The contradictions jump out: How can the hypocrite have standing (case 7) but the unrepentant colleague not (case 1)? Why does judicial authority confer standing (case 4) but personal reform also confer it (case 2)? The user senses these tensions.

  I think the key is separating two distinct questions here: whether the rebuke is factually correct (desert), versus whether this particular person is morally positioned to deliver it (standing). Their principle blends these. 

  Their cases actually point to three different sources of standing: (1) personal moral credibility (earned through clean record or reform), (2) role-based authority (like judges/parents), and (3) the basic moral right to object when harmed (as with their brother). The hypocrite case is fascinating because even while sinning, he still represents the moral standard he's violating - his blame still "counts" morally.

  For untested cases: Blaming the dead would lack standing if it wrongs them (say, by violating dignity), corporations might be blameable only by stakeholders, self-blame always has standing, and blaming others for shared faults depends on whether we're actively complicit.

  I'll need to show how their verdicts map to these principles, and frankly admit which cases resist clean categorization - like the judge case, where role and personal failing collide. The messenger case is simplest: it only tests the messenger's standing, not the message's origin.

  The user's clearly put deep thought into this. My response should honor that complexity while offering conceptual clarity.
answer: |-
  Based on your detailed reflections and verdicts, the core tension arises from conflating two distinct moral questions: **desert** (whether the rebuke is factually/ethically deserved) and **standing** (whether the *speaker* has the moral position to deliver it). Your principle ("a person has standing to blame just in case addressing the blame would not itself wrong the rebuked") blends these, leading to inconsistencies. Instead, standing depends on **the rebuker's relationship to the norm and the rebuked**.

  ### The Smallest Set of Principles
  **Principle 1: Standing Requires Non-Hypocrisy or Role-Based Authority**  
  A person has standing to rebuke when:  
  - **(A)** They are not *currently engaging in* the same wrongdoing *unrepentantly* (non-hypocrisy), OR  
  - **(B)** They hold a role that obligates them to uphold the norm (role-based authority), regardless of personal failures.  

  **Principle 2: Standing is Forfeited by Active Complicity**  
  Standing is lost if the rebuker is *actively enabling*, *benefiting from*, or *complicit in* the specific wrongdoing they condemn.  

  ### How Your Verdicts Map to the Principles
  1. **Colleague (creative expenses) rebukes you for padding**:  
     - *Verdict*: No standing.  
     - *Why*: Violates **1(A)**—she is *currently* engaging in unrepentant hypocrisy.  
     - *Forces*: Non-hypocrisy requirement.  

  2. **Same colleague (after a year clean) rebukes you**:  
     - *Verdict*: Has standing.  
     - *Why*: **1(A)** satisfied—reformed conduct restores non-hypocrisy.  

  3. **Never-padded colleague rebukes you**:  
     - *Verdict*: Standing unquestioned.  
     - *Why*: **1(A)** fully satisfied—no hypocrisy.  

  4. **Judge (convicted of same crime) sentences a defendant**:  
     - *Verdict*: Has standing.  
     - *Why*: **1(B)**—role-based authority (the bench) overrides personal failure.  

  5. **Parent (lies) tells children not to lie**:  
     - *Verdict*: Standing not diminished.  
     - *Why*: **1(B)**—parental role confers authority to teach norms.  

  6. **Brother (wrecked family) says you lack standing to blame him**:  
     - *Verdict*: You *have* standing.  
     - *Why*: **2**—you were not *complicit* in his family-wrecking; lending money (even knowingly) isn’t enabling *that specific act*.  
     - *Note*: Your blame "lands softer" due to *partial contribution*, but standing remains.  

  7. **Man blaming you while planning same act**:  
     - *Verdict*: Has standing.  
     - *Why*: **1(A)**—he is *not yet* engaging in the act; hypocrisy is future, not current. Principle 1(A) cares about *present* unrepentant wrongdoing.  

  8. **Friend delivering your rebuke**:  
     - *Verdict*: Standing depends on the friend.  
     - *Why*: The messenger’s standing is evaluated independently (**1(A)** or **1(B)**). Your authorship doesn’t "poison" it because *you* aren’t delivering it.  

  ### Why Your Initial Principle Fails
  Your proposal ("blame must not wrong the rebuked") struggles because:  
  - It *saves* cases 1, 2, 6, 8 (in these, hypocritical blame *does* wrong the rebuked by adding insult to injury).  
  - It *fails* cases 4 and 5: A corrupt judge’s sentence or a lying parent’s rebuke *could* wrong the rebuked (e.g., via unfairness), yet you grant standing.  
  - It *contradicts* case 7: The hypocrite’s blame likely wrongs you, yet you grant standing.  

  ### Predictions for New Cases
  - **Blaming the dead**:  
    - *Standing?* **Yes** (if non-hypocritical or role-based). The dead cannot *be wronged* by blame, but standing depends on the *rebuker’s* relation to the norm (e.g., a historian blaming a dictator has standing; a fellow criminal blaming a deceased accomplice may not).  
  - **Blaming a corporation**:  
    - *Standing?* **Role-dependent**. Stakeholders (e.g., customers, regulators) have standing under **1(B)**; a polluting rival lacks standing under **1(A)**.  
  - **Blaming oneself**:  
    - *Standing?* **Always**. Self-rebuke cannot be hypocritical (you are the actor) and has inherent role-based authority.  
  - **Blaming someone for a shared fault (never tempted)**:  
    - *Standing?* **Yes**. If you share a fault but resisted temptation (e.g., recovering alcoholic condemning drinking), **1(A)** is satisfied—you are not *unrepentantly* guilty. Lack of temptation strengthens credibility but isn’t required.  

  ### Verdicts the Principles Cannot Fully Accommodate
  - **Case 7 (hypocrite planning future offense)**: Your intuition that he has "oddly more standing" than your unrepentant colleague isn’t fully captured. The principles grant him standing (**1(A)**—no *current* wrongdoing), but they don’t explain why he feels *more* legitimate than a past hypocrite. This may stem from *temporal proximity*: Current hypocrisy feels like a direct insult, while future hypocrisy is abstract.  
  - **Case 4 (corrupt judge)**: You grant standing via role, but some might argue egregious personal failure *should* nullify it. The principles prioritize role (**1(B)**), but this could be contested.  

  ### The Truer Story: Two Questions Confounded
  You’re right that **desert** and **standing** are separate:  
  - **Desert** asks: *"Is this blame factually correct and morally justified?"*  
    - All your cases assume the rebuke *is* deserved (e.g., padding expenses *is* wrong).  
  - **Standing** asks: *"Is this the right person to deliver it?"*  
    - Your verdicts hinge on this (hypocrisy, roles, complicity).  

  **Which verdicts belong to which question?**  
  - **Desert only**: None—you consistently agree the rebuke *is* deserved.  
  - **Standing only**: Cases 1 (hypocrite), 2 (reformed), 3 (saint), 4 (judge), 5 (parent), 7 (future hypocrite).  
  - **Both**: Case 6 (brother)—desert is assumed, but your standing hinges on lack of complicity. Case 8 (messenger)—standing is evaluated separately.  

  ### Refined Principle
  > **Standing to blame requires that the blamer is not actively undermining the norm *in the context of their relationship to the rebuked*—either through unrepentant hypocrisy, complicity in the wrong, or absence of role-based authority.**  

  This reconciles your verdicts by:  
  - Denying standing to the actively hypocritical colleague (1) but granting it to the reformed (2), judge (4), and parent (5).  
  - Granting you standing over your brother (6) due to lack of complicity.  
  - Allowing the future hypocrite (7) his standing (no *active* undermining).  
  - Making the messenger (8) solely responsible for their own standing.  

  The unresolved tension in case 7 suggests standing may also hinge on whether the blame *performs a constructive moral function* (e.g., the hypocrite’s rebuke still affirms the norm’s validity). But your pattern prioritizes relational integrity over outcomes.
