answer: |-
  ### (a) Essay Question (45-60 minutes)

  **Prompt:**  
  Reconstruct the spectrum argument presented below. Then, answer the following questions systematically:  

  1. **Where does the chain break?** Precisely identify which specific adjacent comparison in the sequence (e.g., step *k* to step *k+1*) must be rejected as "not worse than," *even though each step initially seems non-worsening*. Defend your choice against the charge that it is arbitrary. Why is this step meaningfully different?  
  2. **What fails: Transitivity or pairwise judgment?** Does this argument prove that "betterness" (all-things-considered preference) is an *intransitive* relation? Or does it only show that at least one of our pairwise "not worse than" judgments must be mistaken? Justify your answer.  
  3. **Is exploitability inevitable?** Suppose for argument’s sake that betterness *is* intransitive. Would an agent with such preferences *necessarily* be vulnerable to a money pump? Explain why or why not, paying special attention to whether exploitability depends solely on the structure of their *betterness judgments* or on how those judgments translate into *choices*.  

  **The Spectrum Case:**  
  Start with Option A: 1 year at 10/10 well-being.  
  - Option B: 2 years at 9.9/10. (Seems not worse than A)  
  - Option C: 4 years at 9.8/10. (Seems not worse than B)  
  - ... continuing by doubling duration and subtracting 0.1 from well-being each step ...  
  - After *n* steps: Option Z: 2<sup>n</sup> years at (10 - 0.1*n*)/10.  
  For large *n*, Z is (e.g.) 2<sup>30</sup> ≈ 1 billion years at -2/10 (mild but constant suffering), which is plainly worse than A.  

  **Constraints:** Base your analysis *only* on this case. Do not invoke repugnant/mere-addition conclusions, dust specks, or standard population ethics. Focus on the logic of the chain and its implications for rationality.  

  ---

  ### (b) Model Answer (~650 words)  

  This spectrum argument challenges the transitivity of "not worse than" (NWT). Beginning with a high-quality short life (A: 1 year, 10/10), each step doubles duration while slightly reducing well-being per year (B: 2yrs@9.9; C: 4yrs@9.8; etc.). Each adjacent pair seems NWT: trading a tiny quality loss for doubled time appears reasonable. Yet, after sufficient steps (e.g., step 30: ~1 billion years at -2/10), Z is clearly worse than A. Since NWT is transitive (if A NWT B and B NWT C, then A NWT C), but A NWT Z is false, the chain must break somewhere.  

  **1. Where the chain breaks & arbitrariness:** The break occurs at the step where the *marginal gain in total duration no longer compensates for the marginal loss in per-year quality*. Crucially, this step (say, *k*→*k+1*) cannot be fixed non-arbitrarily. Suppose *k* is Option 20: ~1 million years at 8/10. Option 21 is ~2 million years at 7.9/10. At this high well-being, 7.9/10 still seems excellent, and doubling duration seems beneficial—so *k* NWT *k+1* appears true. But if we accept *all* steps, we endorse Z. To avoid Z, we *must* reject at least one step. The arbitrariness charge arises because there’s no bright line where "good" becomes "bad" or compensation clearly fails; quality and duration degrade smoothly. However, *this doesn’t make every cutoff equally defensible*. We can recognize that *at some point*, the cumulative quality erosion outweighs duration gains *even if no single step feels decisive*. The break isn't arbitrary because the *endpoint is intolerable*: forcing a break *somewhere* is less absurd than accepting Z. We reject a step where well-being drops below a critical threshold (e.g., where life becomes net negative), but admitting the Sorites-like vagueness means we lack perfect precision in identifying *k*. The cost is acknowledging that our comparative judgments have fuzzy boundaries under extreme scaling.  

  **2. Transitivity failure or mistaken pairwise judgment?** This does **not** prove betterness is fundamentally intransitive. It shows that our *intuitive pairwise judgments* are context-sensitive and unreliable when comparing vastly different scales. We misjudge adjacent steps because we fail to adequately compound small per-year losses over exploding durations ("scope insensitivity"). At step *k*→*k+1*, we *feel* B<sub>k+1</sub> NWT B<sub>k</sub> because we focus on the minimal quality change and ignore the exponential growth of suffering-years. But when comparing A to Z directly, the catastrophic toll of mass mild suffering is stark. The paradox arises because our pairwise assessments are inconsistent with the transitive closure, implying at least one pairwise judgment is wrong—not that transitivity itself fails. Betterness, as a rational relation, *must* be transitive; the flaw is in our heuristic-driven judgments for adjacent options, not in the logic of betterness.  

  **3. Exploitability without inevitability:** Even *if* betterness were intransitive (A > B > C > A), exploitability isn’t automatic. Money pumps require *choice behavior* that reveals cyclic *preferences* in sequential decisions. An agent could have intransitive *betterness judgments* but avoid pumps by:  
  - **Refusing trades:** Recognizing the cycle, they decline to swap A for B, B for C, or C for A.  
  - **Using non-choice-conditional rules:** They adopt a policy ("pick A over C directly") overriding pairwise comparisons.  
  - **Indexing to a reference point:** Choices depend on current holdings (e.g., "I prefer B to A if I have A, but won’t pay to cycle back").  
  Exploitability depends on whether choices slavishly follow *myopic* pairwise comparisons in a sequence. An agent who makes holistic comparisons or anticipates long-term paths can avoid paying to cycle. Thus, intransitive betterness *enables* money pumps only if paired with naive, stepwise choice rules. The reductio targets irrational *choice dispositions*, not intransitive evaluations per se. One can bite the bullet on intransitivity while avoiding exploitation through sophisticated choice protocols.  

  ---

  ### (c) Marking Scheme (20 Marks Total)  
  **Must-hit points & common failures:**  

  1. **Accurate Reconstruction (4 marks)**  
     *Must:* Clearly summarize the spectrum from A to Z, emphasizing doubling duration/tiny quality reduction per step, apparent non-worsening of adjacents, and clear worsening at Z.  
     *Common failure:* Misstating the progression (e.g., linear duration increase), conflating with other paradoxes (e.g., Repugnant Conclusion), or failing to note transitivity’s role.  

  2. **Specific Step Identification w/ Anti-Arbitrariness Defense (5 marks)**  
     *Must:* State *which* type of step must fail (e.g., "when well-being drops below threshold X" or "after Y doublings") *and* engage the Sorites charge. Argue *why* a break is forced despite vagueness (e.g., endpoint unacceptability, cumulative burden).  
     *Common failure:* Vaguely asserting "some step fails" without specifying *where/why*, or claiming "all steps are fine" (ignoring Z), or accepting arbitrariness without justifying the break’s necessity.  

  3. **Distinguish Transitivity Failure vs. Pairwise Error (5 marks)**  
     *Must:* Explicitly state whether betterness itself is intransitive or if pairwise judgments are mistaken. Argue that the paradox reveals scope insensitivity in judgments, not transitivity collapse.  
     *Common failure:* Conflating intransitive judgments with intransitive betterness, or asserting transitivity failure without justification, or ignoring the cognitive error explanation.  

  4. **Money Pump Stance w/ Choice/Judgment Separation (4 marks)**  
     *Must:* Take a clear position on exploitability given intransitivity. Explain that pumps require specific choice rules (e.g., myopic trading) and that agents can avoid them despite intransitive evaluations.  
     *Common failure:* Assuming intransitivity *necessarily* causes money pumps, or failing to separate betterness from choice, or not offering strategies to avoid exploitation.  

  5. **Clarity & Structure (2 marks)**  
     *Must:* Logically organized, answers all sub-questions, avoids tangents, precise language.  
     *Common failure:* Disorganized flow, merging distinct questions (e.g., discussing pumps while analyzing steps), or verbose irrelevance.  

  ---
  **Design Rationale:**  
  - **Forces specificity (Point 2):** Students *must* confront the Sorites tension head-on, not handwave "some step fails."  
  - **Decouples transitivity & exploitability (Points 3 & 4):** Forces analysis of whether intransitivity is ontological/epistemic and whether it implies irrational choice.  
  - **Blocks standard recitations:** Custom case avoids Parfit/Temkin templates; focus on scaling/compensation trade-offs and choice theory sidesteps population ethics tropes.  
  - **Model answer** demonstrates biting the bullet on step arbitrariness while denying transitivity failure *and* exploitability necessity.
