answer: |-
  Your analysis is astute—you've identified a fundamental fissure in decision theory between **static coherence** (the representational view) and **dynamic exploitability** (the loss argument). The gap arises because loss arguments (e.g., Dutch books, money pumps) require not just incoherent preferences, but also specific failures in how choices are made *over time*. Here's a conceptual carving of the distinction, with established terminology and boundary cases:

  ---

  ### **1. Core Defects: What Each Argument Targets**
  - **Representational Argument (Static Defect):**  
    Targets **structural incoherence** in preferences (violations of axioms like completeness, transitivity, independence).  
    → *Names:* **Synchronic irrationality** (Levi), **preference incoherence** (Broome), or **failure of rationalizability** (Sen).  
    *This is about logical consistency at a single point in time.*

  - **Loss Argument (Dynamic Defect):**  
    Targets **diachronic exploitability**—the agent's vulnerability to being manipulated through sequential choices due to **myopia**, **lack of foresight**, or **inability to commit**.  
    → *Names:* **Diachronic incoherence** (Levi), **pragmatic irrationality** (Hansson), or **money-pump vulnerability** (Rabinowicz).  
    *This is about behavior across time, requiring:*
    - **Choice myopia:** Evaluating each trade in isolation.
    - **No commitment:** Inability to bind future choices.
    - **No global planning:** Failing to see choices as part of a sequence.

  ---

  ### **2. The Thesis That the Defects Coincide (and Its Opposition)**
  - **Equivalence Thesis:**  
    "Synchronic rationality implies diachronic rationality (and vice versa)."  
    → *Defended by:* Savage (via axioms embedding dynamic choice), Harsanyi.  
    *Assumes agents treat dynamic problems as "grand-world" single choices.*

  - **Divergence Thesis:**  
    "Synchronic and diachronic rationality can come apart."  
    → *Defended by:* McClennen (resolute choice), Machina (non-EU models), Rabinowicz (temptation).  
    *Your cases exemplify this:*
    - *Cyclic preferences + commitment*: Synchronically incoherent but diachronically unexploitable.
    - *Naive time-inconsistency*: Synchronically coherent at each moment but diachronically exploitable.

  ---

  ### **3. Key Concepts Defining the Gap**
  Your intuition is correct: **exploitability requires more than preference incoherence**. The critical add-ons are:
  - **Myopic Choice (Sequential Separability):**  
    The agent evaluates options only at the choice point, ignoring future implications.  
    → *Boundary:* If the agent uses **sophisticated choice** (anticipates future actions) or **resolute choice** (commits to a plan), losses vanish.
    
  - **Lack of Commitment Power:**  
    Inability to refuse trades or bind oneself to a policy.  
    → *Boundary:* Your cyclic agent escapes by committing to "no piecemeal trades."

  - **Failure of Foresight:**  
    Not anticipating how current choices enable future exploitation.  
    → *Boundary:* A sophisticated time-inconsistent agent avoids losses by pre-committing.

  ---

  ### **4. Nearest Concepts & Where They Fall Short**
  | Concept                | Why It’s Relevant                                                                 | Where It Falls Short                                  |
  |------------------------|-----------------------------------------------------------------------------------|-------------------------------------------------------|
  | **Time Consistency**   | Central to dynamic choice; violations enable money pumps.                         | Doesn’t address static incoherence (e.g., cyclic pref). |
  | **Dynamic Consistency**| Requires future choices to align with current plans.                              | Still assumes synchronic coherence at each moment.    |
  | **Self-Binding**       | Ability to commit prevents exploitation.                                          | Doesn’t explain why incoherent prefs *can* be harmless.|
  | **Resolute Choice** (McClennen) | Treating sequences as single choices avoids losses.                 | Doesn’t resolve static incoherence—just avoids its costs. |
  | **Pragmatic Rationality** | Focuses on avoiding exploitable losses.                                | Ignores whether preferences are logically consistent. |

  ---

  ### **5. The Boundary Cases Revisited**
  - **Case 1: Cyclic Preferences + Commitment**  
    - *Defect:* **Static incoherence** (violates transitivity).  
    - *Safe from loss?* Yes—because **commitment power** blocks the money pump.  
    - *Gap illustrated:* Exploitability requires *both* incoherence *and* myopic choice.

  - **Case 2: Time-Inconsistent + Naive**  
    - *Defect:* **Diachronic naivety** (fails to foresee preference shifts).  
    - *Static coherence?* Preferences are coherent at each moment (e.g., exponential discounting).  
    - *Vulnerable?* Yes—due to **myopic execution** without commitment.  

  ---

  ### **Conclusion: The Carving You Requested**
  The gap between "incoherent preferences" and "actually losing to them" is bridged by **diachronic choice constraints**:  
  - **Exploitability occurs iff:**  
    (a) Preferences are incoherent *or* time-inconsistent, **and**  
    (b) The agent chooses myopically without commitment/foresight.  

  **The defect loss arguments truly target** is **diachronic myopia**—a failure to integrate choices into a unified plan across time. This is distinct from the static defect of preference incoherence, though they often coexist. The equivalence thesis holds only under idealized assumptions (e.g., omnipotent foresight, commitment as a choice). In real agents, the defects diverge, revealing that **rationality is as much about managing time as it is about logic**.

  **Key Sources**:  
  - Levi (1980) on synchronic vs. diachronic rationality.  
  - McClennen (1990) on resolute choice.  
  - Rabinowicz (1995) on money pumps with time inconsistency.  
  - Machina (1989) on non-EU vulnerability.
