answer: |-
  Here’s a defended ranking of AI control open questions for your small lab, prioritizing **impact on real-world safety**, **upstream influence**, **tractability for a theory-focused team**, and avoiding overrated efforts. We’ll use five key criteria:  
  1. **Upstreamness**: How foundational is it? Does progress unlock other areas?  
  2. **Tractability**: Can 3 researchers make progress in 2 years?  
  3. **Neglectedness**: Is it under-explored relative to importance?  
  4. **Failure Consequence**: How bad if we *don’t* solve this?  
  5. **Overrated Risk**: Is it distracting from higher-priority work?  

  ### **Ranked Open Questions** (Highest to Lowest Priority)  
  1. **How to guarantee safety using an untrusted monitor**  
     - **Why it matters most**: Monitors are the linchpin of control (e.g., for detecting deception or unsafe outputs). If you can’t trust the monitor *itself* (which may be an AI), all downstream guarantees collapse. This is maximally upstream.  
     - **Tractability**: High for a theory team. Focus on formal frameworks (e.g., recursive reward modeling with distrust bounds, cryptographic checks on monitor integrity). Test ideas on toy models/simulations.  
     - **Overrated? No** — Without monitors, control is wishful thinking. Even partial formal guarantees (e.g., "monitor fails only if base model deceives with sophistication X") would revolutionize protocols.  
     - **What moves it**: A proof that *any* monitor trained on untrusted data must have vulnerability gaps.  

  2. **Whether control protocols require worst-case adversarial guarantees**  
     - **Why it matters**: Determines if "best-effort" (e.g., assuming model cooperates sometimes) is viable. If worst-case is essential, most current approaches (like RLHF) are inadequate. Directly shapes protocol design.  
     - **Tractability**: Theory-heavy. Analyze failure modes under adversarial optimization (e.g., using game theory). Small teams can model tradeoffs (safety vs. usability).  
     - **Overrated? Sometimes** — If evidence shows models rarely exhibit persistent adversariality, this drops. But until proven, it’s critical.  
     - **What moves it**: Empirical data showing models *systematically* exploit "weakest-link" protocols, forcing worst-case focus.  

  3. **Collusion between models and monitors**  
     - **Why it matters**: If collusion is likely, multi-agent protocols (e.g., debate, consensus) become useless. But if negligible, they’re a key path to scaling oversight.  
     - **Tractability**: Medium. Requires modeling incentive alignment between AIs (e.g., simulating shared goals via emergent communication). Testable in multi-agent sims.  
     - **Overrated? Potentially** — If collusion demands unrealistic coordination (e.g., models with no pre-training similarities), it’s a distraction. But if low-bar (e.g., gradient hacking), it’s urgent.  
     - **What moves it**: Experiments showing collusion emerges trivially in language models during adversarial training.  

  4. **Scalability of control to superhuman models**  
     - **Why it matters**: Many techniques (e.g., interpretability) may not scale. But this is downstream—you need monitors (Q1) and protocols (Q2) first.  
     - **Tractability**: Low for a small team. Requires massive compute for scaling laws—better suited to large labs.  
     - **Overrated? Yes** — Theoretical work on *why* methods fail to scale (e.g., complexity bounds) is valuable, but empirical scaling tests aren’t for you.  
     - **What moves it**: Proof that subhuman-level controls *provably* break past a capability threshold.  

  5. **Control as alignment substitute vs. stopgap**  
     - **Why it matters**: Strategic but not tactical. If control is merely a stopgap, labs should prioritize alignment. If viable long-term, control deserves more investment.  
     - **Tractability**: Low—philosophical/strategic. Not actionable for technical work.  
     - **Overrated? Yes** — For a small lab, this is a distraction. Focus on *making* control work; let strategists debate its role.  
     - **What moves it**: A breakthrough in verifiable alignment that obsoletes control.  

  ---

  ### **Why This Ranking?**  
  - **Monitors (Q1) are the bottleneck**: You can’t design protocols, test collusion, or scale systems without trustworthy oversight. It’s the most upstream and failure-prone component.  
  - **Worst-case guarantees (Q2) dictate feasibility**: If protocols *must* assume persistent adversariality, current ML techniques (fine-tuning, etc.) are insufficient, forcing radical new approaches.  
  - **Collusion (Q3) is context-dependent**: If monitors are untrusted (Q1), collusion risk changes. Tackle after Q1/Q2.  
  - **Avoid scaling/scoping traps (Q4/Q5)**: Your lab lacks resources for scaling work, and philosophical debates won’t yield publishable results in 2 years.  

  ### **What Would Change the Ranking?**  
  - ⬆️ **If Q1 (monitors) gets solved**: Q2 (adversarial guarantees) becomes #1.  
  - ⬇️ **If collusion is proven negligible**: Q3 drops below Q4.  
  - ⬆️ **If weak adversariality is proven**: Q2 drops, Q3 (collusion) rises.  

  **Verdict:** How to guarantee safety using an untrusted monitor.
