  Need to be honest about seams. Where translation fudges: "archival silence" as dramatic irony requires assuming the reader knows more than the text, which isn't always true. Also, "power structures" shaping archives isn't perfectly mirrored in narrative devices—it's more about real-world systems versus textual choices. 

