answer: |-
  Here's the strict translation you requested, followed by the residue report. I'll flag fudges (▸) and address your hunch directly.

  **The "History Written by Victors" Debate in Narratological Terms:**

  1.  **The Winning Side Controls the Focalization:** The victors establish the dominant narrative's *focalization*. They determine *who* experiences and interprets events for the reader (the "narrating I" or collective focalizer), *what* is perceived, and *from which ideological or temporal distance* (external vs. internal focalization). Losers are often relegated to object, not subject.
  2.  **The Victor as Implied Author:** The dominant narrative constructs an *Implied Author* whose values, biases, and worldview align with the victors. This IA legitimizes the victor's perspective as normative, shaping the reader's judgment of events and characters (losers).
  3.  **Systematic Unreliable Narration (Omission/Emphasis):** The victor's narrative isn't necessarily *lying* in its explicit statements (overt unreliability), but achieves unreliability through *selective focalization* and *discourse manipulation*. Key events, motivations, or perspectives of the losers are omitted, marginalized, or distorted through emphasis on victor-centric events and values (covert unreliability).
  4.  **Losers Silenced or Ventriloquized:** Losers are denied a true "narrating I." When their perspective appears, it's often:
      *   **Filtered through Victor Focalization:** Presented via *free indirect style* subtly colored by the victor's viewpoint, making the loser seem irrational, barbaric, or misguided.
      *   **Ventriloquized:** Given direct speech (*diegetic* or *mimetic*), but within a context framed entirely by victor discourse, rendering it impotent or self-incriminating.
      *   **Absent:** *Archival silence* translates to the *elision* of their discourse entirely – their story isn't told.
  5.  **The Gap Between Fabula and Sjuzhet:** The core historical events (*fabula/story*) exist(ed). The victor's *sjuzhet/discourse* presents one specific, privileged *ordering*, *duration*, and *interpretation* of that fabula. The "losers' version" is an alternative, suppressed sjuzhet – a different way to *tell* the same underlying story events.
  6.  **Recovering the Losers' Sjuzhet:** This involves the reader/historian attempting to reconstruct the suppressed discourse:
      *   **Reading Against the Grain:** Identifying *gaps*, *elisions*, *anomalies*, and moments of *dramatic irony* within the victor's sjuzhet where the implied author's bias is exposed or contradictory evidence peeks through.
      *   **Reconstructing Implied Perspectives:** Inferring what the losers "wont or cant say out loud" based on the pressures exerted by the victor's dominant discourse and focalization – the unspoken resistance, the hidden motivations implied by their silenced actions within the victor's own account.
      *   **Sourcing Alternative Focalizers:** Finding surviving traces (fragments, artifacts, marginalized accounts) that offer *alternative focalization*, however fragmented, to triangulate against the dominant sjuzhet.
  7.  **The Reader's Role & Dramatic Irony:** The modern reader often occupies a position of *dramatic irony*. They may possess knowledge (from alternative sources, later perspectives) that allows them to see the limitations, biases, and omissions in the victor's sjuzhet, even if contemporary characters within that narrative do not.

  **▸ Fudges:**
  *   **"Power" as Implied Author:** Attributing the victor's perspective solely to an "Implied Author" simplifies the complex social, institutional, and material forces shaping the dominant narrative. The IA is a *construct* of the discourse, not the *cause*.
  *   **"Recoverable":** Narratology deals with reconstruction *within the text or from textual traces*. Historians deal with material evidence beyond text. The process of "recovery" feels more tentative and evidentiary in history than textual reconstruction implies.
  *   **"Archival Silence" as Elision:** While similar, elision is a narrative choice *within* a discourse. Archival silence often stems from material destruction, lack of resources for preservation by the losers, or active suppression – forces preceding narrative construction.

  ---

  **Residue Report: What Doesn't Map (Your Hunch is Sharply Correct)**

  Your hunch nails the **core residue: Evidence and Material Constraints.** This is the irreducible difference, not a novelist's evasion.

  1.  **The Archive is Antagonistic & Generative (Not Just Setting):**
      *   **In Fiction:** The "archive" (the implied world, character backstories, rules) is *generated by the discourse itself*. The narrator's bias *creates* the available "facts" within the text. There is no external arbiter. If the narrator is unreliable, the *world* becomes unreliable as the narrator defines it. Contradiction is a feature, not a bug.
      *   **In History:** The archive (documents, artifacts, sites, data) exists *independently* of the historian's discourse. It is **antagonistic**: it resists certain narratives. You cannot narrate tanks at Waterloo; the archive forbids it. It is **generative**: a newly discovered letter forces new narratives, regardless of the historian's prior bias. The historian's sjuzhet must *account for* or *explain away* inconvenient evidence within the archive. Silence itself *is* evidence – a material absence demanding explanation (was it destroyed? never recorded? ignored?).
      *   **The Residue:** The historian battles with *extratextual reality*. The novelist battles with *internal coherence and verisimilitude*. This is a fundamental ontological difference.

  2.  **Corroboration & The Rules of Evidence:**
      *   **In Fiction:** Corroboration is purely *intratextual*. Consistency with other parts of the narrative or the implied world establishes "truth." There are no external rules of evidence; the implied author sets the rules.
      *   **In History:** Corroboration requires *intertextual* and *extratextual* validation. Does Source A align with Source B? Does the document fit the physical artifact? Is the source credible based on provenance, genre, contemporaneity? Historians operate within strict (though debated) epistemological frameworks for evaluating evidence that have no direct narratological equivalent. "Unreliability" in a source is a *problem to be solved* using external methods, not just a narrative device.

  3.  **Power Structures Shaping the Archive (Beyond Focalization):**
      *   **In Fiction:** Power structures influencing the narrative are *chosen* by the implied author as part of the discourse's design.
      *   **In History:** Power structures *pre-exist* and *actively shape* the archive itself. Who had the resources to write? What was deemed worthy of preservation? Which institutions controlled record-keeping? Who was literate? This isn't just about perspective (focalization); it's about the *material conditions of possibility* for evidence to exist *at all*. Recovering the losers' sjuzhet often means grappling with the fact that their *capacity to generate a durable discourse* was systematically destroyed or suppressed by the victors' power.

  **Is the Residue a Hole or Sign of Vagueness?**

  *   **It's Neither. It's a Fundamental Difference in Domain.**
  *   **Not a Hole in Your Framework:** Your framework (narratology) is exquisitely designed for analyzing *how stories are told within texts*. It wasn't built to handle the *extratextual material constraints* and *epistemological rules* governing historical reconstruction. That's not a deficiency; it's specificity.
  *   **Not (Just) Vagueness in the Original Debate:** The original debate often *implicitly relies* on this material evidentiary aspect. Phrases like "written by the victors" assume the victors had the *material means* (literacy, institutions, security) *to* write and preserve, while the losers often did not. The residue exists because the historical debate is grappling with the *interface* between discourse and material reality/evidence, while narratology primarily operates *within* the discourse.

  **The Seams & Your Hunch:**

  You are absolutely correct. The **absence of an antagonistic, generative, independent archive** is the defining seam. A novelist crafts a world where the narrator's bias *is* the reality (or creates the tension between reality and perception). A historian confronts a reality that *pushes back* through inconvenient evidence or crushing silence. This isn't an excuse for novelists to avoid tackling unreliable narration; it's the reason the *stakes* and *methods* are fundamentally different. Your craft gives you godlike control *within* the text, but that control is precisely what historians lack when facing the archive. The residue isn't a flaw; it's the bedrock distinguishing creation from reconstruction. Lean into the power of your control for your fiction, but recognize it *is* control, not excavation.
