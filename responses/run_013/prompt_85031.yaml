answer: |-
  ### Session Design: "Truthlikeness Tangle"  
  **Goal:** Experience the paradox of comparing "closer to truth" between false scientific models.  
  **Core Insight:** Simple scoring fails; distance metrics "solve" but hide arbitrariness; incommensurability breaks comparisons.  
  **Time:** 90 minutes  
  **Participants:** 16 people (4 teams of 4).  
  **Materials:**  
  - **Whiteboard:** Grid of 16 possible worlds (4 binary features: A, B, C, D; e.g., A+ = "Stars emit light," A− = "Stars don’t emit light").  
  - **Actual World:** Fixed as (A+, B+, C+, D+).  
  - **Claim Cards (80 total):**  
    - *Atomic claims:* "A+", "A−", "B+", etc. (32 cards).  
    - *Conjunctions:* "A+ and B+", "A− and C+", etc. (32 cards).  
    - *"Junk" claims (for 2 teams):* Redundant phrasing, e.g., "A+ and (B+ or B−)" (logically = "A+"), or "If C− then D−" (16 cards).  
  - **Team Kits (per team):** 1 world grid, 10 claim cards (randomly assigned), pens.  

  ---

  ### Minute-by-Minute Run  
  **0–10 min: Setup**  
  - Introduce the "universe": 4 features (A, B, C, D), 16 possible worlds. Mark actual world (A+, B+, C+, D+) on the grid.  
  - **Goal:** Build the best theory about the universe. "Best" = closest to truth.  
  - Split into 4 teams. Give each team a kit.  
  - **Twist:** Teams 1–2 get normal claims; Teams 3–4 get "junk" claims (same facts, bloated vocabulary).  

  **10–25 min: Theory Building**  
  - Teams draft theories using 3–5 claim cards. Rules:  
    - A theory is a set of claims (e.g., {"A+", "B− and C+"}).  
    - Circle all worlds on the grid that satisfy *all* claims (logical conjunction).  
    - *Example:* Claim "A+" → all worlds with A+ (8 worlds). Claim "A+ and B+" → 4 worlds.  

  **25–40 min: Scoring Round 1**  
  - Each team shares:  
    - Claims in their theory.  
    - Number of worlds their theory allows (e.g., "Our theory allows 2 worlds").  
  - **Scoreboard (Whiteboard):**  
    | Team | # True Claims* | # False Claims* | "Naive Score" (T−F) | Min Hamming Distance** |  
    \* *True/false in actual world.  
    \** *Hamming distance: Features differing from actual world (e.g., world (A−, B+, C+, D+) = distance 1). For a theory, take the **minimum** distance among its allowed worlds.*  
  - Teams compute their scores. Facilitator fills the board.  

  **40–50 min: Observation & Tension**  
  - Highlight:  
    - Teams with false theories (actual world not in their set) still have "Naive Scores" (T−F).  
    - Ask: "Can we rank Team 2 (score +2) vs. Team 3 (score +1)? Is +2 *closer to truth*?"  
    - **Reveal:** Team 3 (low Naive Score) might have min distance = 1 (e.g., misses only A+), while Team 2 (high Naive Score) has distance = 3 (e.g., insists on A−, B−, C−). Naive Score ranks the *worse* theory higher!  

  **50–60 min: Tweak Phase**  
  - Each team makes **one change** (add/drop a claim or swap a card).  
  - **Manipulate:** Quietly give Team 1 a claim forcing a distant world (e.g., "A− and B−"). Give Team 4 a claim refining accuracy (e.g., drop a false claim).  

  **60–75 min: Scoring Round 2**  
  - Recompute scores. Update scoreboard.  
  - **Expected Flips:**  
    - Team 1 (added strong false claim): Naive Score ↑ (if claims are true), min distance ↑↑.  
    - Team 4 (dropped false claim): Naive Score ↓ (fewer claims), min distance ↓.  
    - Naive Score and distance rankings now conflict (e.g., Team 4 plummets on Naive Score but improves on distance).  
  - Teams see rankings invert. Ask: "Which score would you defend? *Why*?"  

  **75–90 min: Debrief**  
  - **Map to Real Problems:**  
    1. **Progress Needs False Theories:** If only true theories "win," science never progresses (Popper). We *need* to call some false theories "closer."  
    2. **Naive Scoring Fails:**  
       - Fails to rank incommensurable theories (Teams 3–4’s "junk" claims bloated T−F scores unfairly).  
       - Rewards verbose theories (more claims = more points) and punishes conciseness (e.g., dropping a claim hurt Team 4’s Naive Score).  
       - *Real-world analog:* Counting "true predictions" ignores how *central* claims are (e.g., epicycles vs. ellipses).  
    3. **Distance Metrics "Cheat":**  
       - Hamming distance "solved" ranking (e.g., min distance = 1 beats min distance = 3).  
       - *But*: Why Hamming? Why not weight feature A more than B? Why not Euclidean distance? **The metric does all the work.** We haven’t explained *why* it measures truthlikeness—we just defined it (Miller, Tichý).  
       - *Real-world analog:* Quantum vs. Newtonian mechanics—no common "features" to measure distance.  
  - **Honest Gap:** The activity can’t replicate **ontological shifts** (e.g., phlogiston → oxygen). When theories change *what exists*, there’s no shared "grid" to measure distance. You must explain this: *"In real science, new models often change the rules—like comparing apples to spacetime. We lose the grid."*  

  ---

  ### What Will Go Wrong & Fixes  
  - **Problem:** Teams stuck computing worlds.  
    **Fix:** Pre-made grids for reference; ask scientists to help neighbors.  
  - **Problem:** Incommensurability not obvious.  
    **Fix:** During scoring, contrast Team 1’s "A+" (1 card) vs. Team 3’s "A+ and (B+ or B−)" (1 card, same fact). Ask: "Same claim? Should they score the same?"  
  - **Problem:** Min distance misleads (e.g., a theory allowing *only* a distance-1 world seems better than one allowing the actual world *and* distance-1).  
    **Fix:** Acknowledge this! *"Yes, we’re cheating with ‘closest world.’ Real theories don’t come with tidy sets of worlds."*  
  - **Problem:** Scientists dominate discussion.  
    **Fix:** Assign roles: reporter (speaks), scribe (computes), skeptic (questions claims).  

  ### Output Materials  
  - **Grid:** Rows = A±, Columns = B±, C±, D± (16 boxes). Label actual world.  
  - **Claim Card Examples:**  
    - Normal: "A+", "C− and D+".  
    - Junk: "A+ and (B+ or B−)", "If A− then C−".  
  - **Scoreboard Template:**  
    ```  
    | Team | Claims              | # Worlds | T | F | T−F | Min Dist |  
    |------|---------------------|----------|---|---|-----|----------|  
    | 1    | A+, B− and C+       | 2        | 2 | 1 | +1  | 1        |  
    ```  

  This design forces writers into the paradox: They’ll *feel* the frustration of arbitrary scores, patch it with distance, then see the metric is a Band-Aid. No philosophy degree required—just index cards and collective angst.
