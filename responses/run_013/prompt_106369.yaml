  3. **Result**: I profit from both transactions because your statewise payoffs are identical before and after the swap, but you paid me twice for the same risk profile.  

  **Coherence Failure**: Your book becomes arbitrageable because:  
  - The prices for **Mix(0.11, A, £0)** and **Mix(0.11, B, £0)** are inconsistent with prices for **A** and **B**.  
