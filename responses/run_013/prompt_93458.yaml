prompt: |-
  You're a philosopher of science who's spent years on thought experiments — the methodology of them, not just the greatest hits — so please write like one. I'm a science-and-ideas journalist putting together a piece on how philosophers argue with imaginary cases, and I've got stuck on something a philosopher said to me at a workshop last month. Have a proper think before you commit, and brainstorm a bit first; I'd rather watch you reason than watch you perform. No reading lists please — I can't check them and it's not what I'm after.

  Here's his distinction. Some thought experiments work by subtraction. You take a situation everyone knows and start striping things away — no friction, no air resistance, no partiality, nobody knowing their place in the social order — and the interest lies in the fact that what's left still does something. You're handed an explicit licence to ignore the stripped-out bits; that's the whole trick. Others work by addition. You take ordinary life and start bolting things on — a machine that gives you any experience you like, a brain in a vat, a violinist plugged into your kidneys — and the verdict is meant to arrive with the picture. Nobody hands you a licence, because there's nothing to licence: you're never told what to disregard.

  He reckons the additions are the misleading ones. With an addition pump you can't tell which of the bits you've bolted on is doing the persuading — change the wallpaper in the scenario, the verdict wobbles, and suddenly a published paper is resting on a detail nobody intended to be load-bearing.

  So: is the distinction a real one, or is the addition pump just a subtraction pump with better staging? Take the experience machine — addition or subtraction, and does the answer change what you think it can prove? And is he right that the additions are the dodgy ones, or is there a mirror-image charge against subtraction that he's missing? Give me the strongest case against him before you tell me where you land.

  Last thing. I'm wary of the idea that any of this shows the cases are no good. Plenty of philosophers seem to think you can show a thought experiment up by finding the irrelevant detail. Is that a fair way to criticse a case, or is it just a way of refusing to have the intuition? Cheers.
reasoning: |-
  Okay, let me unpack this carefully. A science journalist is working on a piece about philosophical thought experiments and got stuck on a distinction a philosopher made between subtraction-based and addition-based thought experiments. The key points are:

  Subtraction experiments strip away elements from familiar situations (like Galileo ignoring friction), with explicit permission to disregard certain factors. Addition experiments add hypothetical elements to ordinary life (like Nozick's experience machine), without guidance on what to ignore. The philosopher argues addition experiments are more problematic because changing minor details can sway intuitions unpredictably.

  The journalist wants me to: 
  - Assess if this is a real distinction or if addition is just "subtraction with better staging"
  - Analyze the experience machine as test case
  - Present strongest counterarguments before my conclusion
  - Address whether critiquing irrelevant details is valid or just intuition-avoidance

  Hmm, interesting framework. First I need to test if the distinction holds water. At surface level it seems coherent: stripping vs building. But when I think of Galilean planes or Newton's buckets, subtraction does feel different from Boltzmann brains or Searle's Chinese Room. The subtraction cases often isolate variables for modeling, while additions create counterfactuals to probe boundaries. 

  But is the "licence to ignore" really absent in additions? Take the experience machine - Nozick doesn't tell us to disregard the mechanics, but implicitly we're meant to focus on the choice, not the wiring. Maybe all thought experiments involve selective attention, just managed differently. 

  Now the philosopher's main concern: addition experiments being "dodgy" because minor changes alter intuitions. Strong point - swap the experience machine's chrome casing for wood paneling, and suddenly it feels cozier, potentially swaying judgments. But subtraction has parallel risks: if Galileo specified marble instead of wood for his inclined planes, might we imagine different friction coefficients? 

  For counterarguments:
  1) All thought experiments rely on bracketing. Additions just make the bracketing implicit rather than explicit. 
  2) Subtraction can be equally fragile. Remove "self-interest" from ethics cases and you've smuggled in assumptions about human nature.
  3) Some additions are robust. Brain-in-vat intuitions persist whether the vat is glass or plastic.

  Experience machine case study: Clearly addition - we're adding neurotech that doesn't exist. But its power comes from subtracting reality's constraints, no? The core question is whether pleasure without achievement matters, which requires ignoring practical barriers. So perhaps hybrid. 

  On the critique method: Dismissing thought experiments over details misses their function. They're intuition pumps, not proofs. The wobble reveals hidden assumptions - that's valuable! If changing the violinist's age alters moral intuitions, that tells us about age-weighting in ethics. 

  My landing point: The distinction is real but porous. Additions are more prone to framing effects, but subtractions have their own blind spots. Neither is inherently superior - the issue is whether we transparently handle their scaffolding.
answer: |-
  Right — let's pare this to the bone. Your philosopher's distinction is elegant, but I suspect it's a scaffold that collapses under its own weight when you start bolting ideas to it. We'll dissect it properly: first the anatomy of the distinction, then why addition-pumps aren't uniquely frail, and finally why targeting "irrelevant details" often misses the point entirely. No performances; just the joints of the argument.

  ### 1. **The Distinction: Real but Porous**
  Yes, the subtraction/addition dichotomy holds superficial water. **Subtraction experiments** (Galileo's frictionless planes, Rawls' veil of ignorance) surgically remove contingencies to isolate a *structural truth*. The licence to ignore is explicit because the stripped elements (friction, bias) are acknowledged as distorting noise. **Addition experiments** (Nozick's experience machine, Thomson's violinist) inject *novel entities* into the familiar. Here, the burden is on you to intuit which features are essential to the moral or conceptual tension — no manual provided.  

  But this is a spectrum, not a chasm. Consider the **experience machine**:  
  - **As addition?** Clearly: we bolt on perfect neural tech.  
  - **As subtraction?** Equally: it strips away the causal chain linking choice to consequence, leaving only hedonic payoff. Nozick *subtracts* agency’s link to reality.  
  *The verdict?* How we classify it changes nothing about what it "proves." Its force lies in exposing that we value *being* a certain way, not just *feeling* it. The framing (addition/subtraction) is scaffolding — knock it down, the insight stands.  

  ### 2. **The Charge Against Addition-Pumps: Overstated**
  Your philosopher claims additions are uniquely vulnerable to "wobbly verdicts" if details shift. But subtractions crumble just as easily under pressure:  
  - **Mirror-image fragility**: Strip away "self-interest" in ethics (subtraction), and you might accidentally remove *empathy* too — altering intuitions about altruism. Change the material of Galileo’s inclined plane from marble to ice, and frictionless motion suddenly feels "natural," warping the insight.  
  - **Addition’s hidden subtraction**: Every addition-pump *implicitly* subtracts realism. The violinist case adds a bizarre biological link but *subtracts* the emotional weight of kinship. If Thomson made the violinist your estranged father, intuitions wobble — not because of the addition, but because it *restores* a subtracted social factor.  
  **Strongest case against him**: His fear is really about *uncontrolled variables*. But subtraction-pumps control variables by fiat ("ignore gravity"), while additions do it by immersion ("just imagine it"). Neither is inherently more rigorous; both live or die by whether we share the unspoken background assumptions.  

  ### 3. **The "Irrelevant Detail" Trap**
  Ah — here’s the crux. Philosophers who torpedo thought experiments over "load-bearing details" often commit two errors:  
  - **Confusing heuristics with proofs**: Thought experiments aren't syllogisms. They’re *intuition pumps* (Dennett’s term). Their job is to jolt us into seeing a tension, not to deduce truths. If changing the wallpaper in the experience machine from chrome to mahogany softens your aversion, that’s data — it reveals that aesthetic alienation fuels the intuition for some. That’s not a flaw; it’s a diagnostic.  
  - **Demanding impossible neutrality**: No thought experiment is detail-agnostic. Even Newton’s bucket (subtraction!) relies on you imagining water clinging to curved sides — a detail that *feels* inert but smuggles in classical space. The question isn’t "Is this detail relevant?" but "Does this detail *corrupt* the core intuition?" If yes, we refine the pump. If no, we probe why the intuition persists.  

  ### Where I Land
  Your philosopher is half-right: addition-pumps *feel* riskier because their variables are less visible. But that’s a pedagogical quirk, not an epistemic flaw. The real vulnerability lies in **unexamined background assumptions** — and *both* types of pumps can harbor them.  

  **Final thought**: Critiquing "irrelevant details" isn’t refutation — it’s philosophy in action. When a detail wobbles the intuition, it exposes hidden premises. That’s the signal, not the noise. If we dismiss thought experiments for this, we’re not guarding rigor; we’re refusing to engage the messy machinery of insight.  

  If this feels like it circles back on itself — good. That’s the nature of the beast. Thought experiments are conversations, not cathedrals. Now: where’s the pressure point for your piece? (And no, I won’t ask about the workshop philosopher’s name — some intuitions are best left unpumped.)
