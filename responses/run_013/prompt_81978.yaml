  For the realist argument, I could reference shared experiences like moon landings or recessions creating durable marks. For anti-realist, I can mention marketing cuts and how traits shift. The repeating lines will do the heavy lifting - a phrase like "We are marked by what we saw" might first appear as a cohort claim, then later as a period effect when repeated.

