prompt: |-
  My friend Dana has been arguing on a forum about "which futures are better," and she's given a bunch of verdicts I can't get to fit together, and I want to know what she'll say about a new case. Here's her track record, all about hypothetical futures with different numbers of people at different levels of wellbeing (she uses a 0-100 scale where 0 is a life not worth living at all, 50 is a life that's clearly good, and 100 is about as good as a life gets):

  1. She says a future with 1,000 people all at 80 is worse than a future with those same 1,000 people at 80 plus another 1,000 people at 70. Adding happy people, she says, is just a good thing.
  2. She says a future with 1,000 people all at 90 is better than a future with a billion people all at 2. She's very firm about this — she thinks the billion-person future is a nightmare even though every single one of those billion lives is, strictly speaking, worth living.
  3. She says a future with 1,000 people at 80 plus 1,000 people at 10 is worse than the future with just the 1,000 people at 80. So she doesn't think adding people is always good — only when they're doing well enough.
  4. She says a future with 1,000 people at 90 is worse than a future with 1,000 people at 90 plus a million people at 45. So she's fine with a big crowd as long as they're all solidly in the "life is good" zone, even if they drag the average down a lot.

  Now here's the new case. Two futures:

  Future P: 1,000 people at 90.
  Future Q: 1,000 people at 90, plus 500,000 people at 20.

  And a second new case, to be safe:

  Future R: 10,000 people at 60.
  Future S: 10,000 people at 60, plus 10 million people at 25.

  I want you to act like a really careful philosopher of population ethics — someone who knows the whole literature on the repugnant conclusion inside and out — and think through this step by step, maybe even start by brainstorming several different rules that could explain Dana's four verdicts before you commit to any of them. Then: what do you predict she'll say about P vs Q and about R vs S? Which rule is she most likely running, and what are the rival rules that fit her first four verdicts just as well? For each rival, tell me what it predicts about P vs Q and R vs S, and then tell me which further case would best drive a wedge between the surviving rules. I care less about which answer is "correct" and more about you nailing down the rule she's implicitly using and being honest about where her track record genuinely underdetermines things.
reasoning: |-
  Okay, let me tackle this problem step by step. Dana has given four clear verdicts about population ethics scenarios, and I need to figure out her underlying rule to predict her judgments on two new cases. 

  First, I'll analyze her existing verdicts:

  1. Adding 1,000 people at 70 to 1,000 at 80 is good. So she approves of adding well-off people (70 is above 50, which she considers clearly good). 

  2. 1,000 at 90 beats a billion at 2. Even though 2 is above 0 (life worth living), she rejects this trade-off. This suggests she has a threshold where lives below some level don't contribute positively, even if net positive.

  3. Adding 1,000 at 10 to 1,000 at 80 makes things worse. 10 is above 0 but below her "good life" threshold of 50. So adding sub-threshold lives is bad.

  4. Adding a million at 45 to 1,000 at 90 is good. 45 is slightly below 50, but she accepts this. Important: 45 is very close to her stated "clearly good" threshold, so her threshold might be fuzzy or slightly below 50.

  Putting this together: Dana seems to use a critical-level utilitarianism with a threshold between 20-45. Lives above the threshold add value, below it don't (or subtract). But verdict 4 shows 45 is acceptable, while verdict 3 shows 10 is not. So threshold is likely between 10 and 45. 

  Now for the new cases:
  - P vs Q: Adding 500k at 20 to 1k at 90. 20 is below 50 and below the range from verdict 4 (45). Verdict 2 rejected 2, verdict 3 rejected 10 - so 20 is likely still below her threshold. Prediction: She'll prefer P (no addition).

  - R vs S: Adding 10m at 25 to 10k at 60. 25 is higher than 10 or 2 but lower than 45. This is ambiguous - it might be near her threshold. But given her firm rejection of low values in verdicts 2-3, and acceptance only at 45+, 25 is probably too low. Prediction: She'll prefer R.

  But let's consider rival rules:

  1. **Critical-Level Utilitarianism (CLU)**: Value = Σ(wellbeing - c). From verdicts: 
     - c must be >70 (since adding 70 is good, so 70 > c? Wait no - verdict 1 shows adding 70 is good, meaning 70 - c > 0. But verdict 3 shows adding 10 is bad → 10 - c < 0. Verdict 4: adding 45 is good → 45 > c. So c between 10 and 45. 
     - For P vs Q: If c=25, 20<25 → adding bad. If c=15, 20>15 → good. But verdict 3 (10 bad) suggests c>10, verdict 4 (45 good) suggests c<45. 20 could be either side. However, verdict 2 (rejecting billion at 2) implies c>2, but more importantly the massive inequality aversion? Not necessarily.

  2. **Negative Utilitarianism Variant?** But she accepts adding happy people, so not pure NU.

  3. **Lexical Threshold View**: Lives above a threshold (say 40+) have positive weight, below it zero or negative. Fits verdicts 1-4 if threshold ~40. Then for Q: 20<40 → bad addition. For S: 25<40 → bad.

  4. **Prioritarianism Below Threshold?** She might discount low wellbeing. But verdict 4 is key: 45 is acceptable while 10 is not. A smooth prioritarianism might not jump so sharply.

  Best wedge case: 
  Future T: 1,000 at 85 vs Future U: 1,000 at 85 + 100,000 at 30. 
  If she rejects U, threshold >30; if accepts, threshold ≤30. Given her acceptance of 45 and rejection of 10, 30 could go either way. But I think she'd reject 30 as too low (closer to 10 than 45), so U worse. But if she has a threshold at 25-35, she might accept. This could distinguish between CLU with c=28 vs lexical threshold 35.
answer: |-
  As a philosopher of population ethics, I'll approach this methodically. Dana's judgments suggest she's navigating the "repugnant conclusion" problem (where maximizing total welfare could favor vast populations with barely worthwhile lives). Her verdicts reject classical utilitarianism but don't fit neatly into one standard theory. I'll start by brainstorming rules that explain her four verdicts, then apply them to the new cases (P vs. Q and R vs. S), identify ambiguities, and propose a wedge case.

  ### Step 1: Brainstorming Rules to Explain Dana's Verdicts
  Here are four candidate rules consistent with her judgments, ordered by plausibility based on her emphasis on wellbeing thresholds:

  1. **Lexical Sufficientarianism with a Critical Range**  
     - Lives above a wellbeing threshold (likely 40–50) have positive moral weight; lives below it (but above 0) have zero or negative weight. Crucially, the threshold isn't sharp—it allows for a "gray zone" (e.g., 40–50) where additions may be acceptable if lives are close to "clearly good" (50).  
     - **Fits verdicts**:  
       - Verdict 1: 70 > threshold → adding is good.  
       - Verdict 2: 2 < threshold → billion-person future is bad despite total welfare gain.  
       - Verdict 3: 10 < threshold → adding is bad.  
       - Verdict 4: 45 is near threshold (in gray zone) → adding is acceptable despite lowering average.  

  2. **Critical-Level Utilitarianism (CLU) with a Moderate Critical Level**  
     - Value = Σ(wellbeing - c), where c is a "critical level" (e.g., c ≈ 25–35). Lives below c subtract value; above c add value.  
     - **Fits verdicts**:  
       - Verdict 1: 70 > c → net positive.  
       - Verdict 2: 2 < c → net negative (since (2 - c) × 1B < 0).  
       - Verdict 3: 10 < c → net negative.  
       - Verdict 4: 45 > c → net positive.  

  3. **Two-Level Prioritarianism**  
     - Prioritize lives below a threshold (e.g., 50) but apply diminishing moral weight to wellbeing gains. Lives above the threshold add standard value; lives below it add less (or negative) value based on a concave weighting function.  
     - **Fits verdicts**:  
       - Verdict 1: 70 is high → significant positive weight.  
       - Verdict 2: 2 is very low → near-zero (or negative) weight, outweighed by 90s.  
       - Verdict 3: 10 is low → negative or negligible weight.  
       - Verdict 4: 45 is moderate → positive but discounted weight.  

  4. **Average Utilitarianism with a Floor Constraint**  
     - Maximize average wellbeing, but only include lives above a floor (e.g., 40) in the average. Lives below the floor are excluded (treated as "not worth adding").  
     - **Fits verdicts**:  
       - Verdict 1: Adding 70 > floor → raises average (80 → 75) → good.  
       - Verdict 2: Average 2 < average 90 → 90 is better.  
       - Verdict 3: Adding 10 < floor → not included, but lowers true average (80 → 45) → bad.  
       - Verdict 4: 45 ≈ floor → included, average lowers slightly (90 → ~45.0009) but deemed acceptable.  

  **Common Insights**:  
  - Dana has a wellbeing threshold in the 25–50 range. Verdict 3 (rejecting 10) and Verdict 4 (accepting 45) suggest it's not sharp—45 is acceptable but 10 is not.  
  - She cares about quality: Adding lives only improves the future if they meet a "good enough" standard (Verdicts 1, 3, 4).  
  - She avoids the repugnant conclusion (Verdict 2) by rejecting very low-welfare additions.  

  ### Step 2: Predicting P vs. Q and R vs. S
  - **Future P**: 1,000 at 90  
    **Future Q**: 1,000 at 90 + 500,000 at 20  
  - **Future R**: 10,000 at 60  
    **Future S**: 10,000 at 60 + 10,000,000 at 25  

  Using the rules above:  

  | Rule                     | Prediction for P vs. Q                           | Prediction for R vs. S                          |
  |--------------------------|--------------------------------------------------|-------------------------------------------------|
  | **1. Lexical Sufficientarianism** | Q worse: 20 < threshold (likely 30-50). Adding 500k at 20 is bad (like Verdict 3). | S worse: 25 < threshold. Adding 10M at 25 is bad, similar to Verdict 2. |
  | **2. Critical-Level Utilitarianism** | Depends on c. If c ≈ 30 (midway from Verdicts 3/4), 20 < c → Q worse. If c ≈ 20, Q better. Verdicts suggest c > 20 (rejects 10 firmly), so likely Q worse. | If c ≈ 30, 25 < c → S worse. If c ≈ 25, ambiguous. Verdict 4 (45 > c) suggests c < 45, but 25 could be close. Leaning S worse. |
  | **3. Two-Level Prioritarianism** | Q worse: 20 is low, so gains have near-zero weight. Large population drags value down. | S worse: 25 is low and discounted, so gains don't offset dilution of 60s. |
  | **4. Avg Utilitarianism + Floor** | Q worse: 20 < floor (≈40) → excluded. True average plummets (90 → ~20.2) → bad. | S worse: 25 < floor → excluded. True average crashes (60 → ~25.0003) → bad.  

  **Consensus Prediction**:  
  - **P vs. Q**: Dana will prefer **P** (no addition). Q adds 500,000 lives at 20, which is below her implied threshold (10 rejected in Verdict 3, 45 accepted in Verdict 4). 20 is closer to 10 than 45, so likely bad.  
  - **R vs. S**: Dana will prefer **R** (no addition). S adds lives at 25—above the "nightmare" level of 2 (Verdict 2) but below 45 (Verdict 4). Verdict 3 shows she rejects even small additions of low-welfare lives, and 25 is unlikely to clear her threshold.  

  **Most Likely Rule**: **Lexical Sufficientarianism** (Rule 1). It best explains:  
  - Her threshold language ("life is good" at 50).  
  - Verdict 4: Acceptance of 45 (within gray zone near 50) despite lower average.  
  - Verdict 2: Firm rejection of 2 as "nightmare."  

  **Rival Rules that Fit Her Verdicts**:  
  - **Critical-Level Utilitarianism (CLU)** fits equally well if c ≈ 30–40.  
  - **Two-Level Prioritarianism** fits but is less parsimonious; Verdict 4's acceptance of 45 suggests a discrete threshold, not smooth weighting.  
  - **Average Utilitarianism + Floor** is weakest—Verdict 4 (adding 45 lowers average) is hard to square unless the floor is fuzzy.  

  ### Step 3: Underdetermination and Wedge Cases  
  Her track record underdetermines between **Lexical Sufficientarianism** and **CLU** because:  
  - Both reject 10 (Verdict 3) and accept 45 (Verdict 4), putting the threshold/critical level in the 10–45 range.  
  - For 20 (in Q) and 25 (in S), both *could* go either way depending on the exact threshold/c.  
    - If her threshold is 30, she rejects both.  
    - If c = 25 for CLU, she *might* accept S but reject Q (20 < 25 < 25).  

  **Wedge Case to Distinguish Them**:  
  Test a future with wellbeing just above/below the critical zone:  
  - **Future T**: 1,000 people at 85.  
  - **Future U**: 1,000 people at 85 + 10,000,000 people at 32.  

  **Predictions**:  
  - **Lexical Sufficientarianism**: If her threshold is 35, U is worse (32 < 35). If threshold is 30, U is better (32 > 30).  
  - **Critical-Level Utilitarianism**: If c = 30, U is better (32 - 30 > 0). If c = 35, U is worse.  
  - **What Dana would say**: Based on her acceptance of 45 (close to 50) and rejection of 10 (far below), 32 is ambiguous but likely below her threshold. She'd probably **reject U** (prefer T), implying a threshold around 35–40. This favors Lexical Sufficientarianism with a higher threshold.  

  ### Conclusion  
  - **Prediction for Dana**:  
    - P vs. Q → Prefers **P** (adding 500k at 20 is bad, like Verdict 3).  
    - R vs. S → Prefers **R** (adding 10M at 25 is bad; 25 is too low, closer to 10 than 45).  
  - **Her Implicit Rule**: Likely **Lexical Sufficientarianism** with a threshold around 40–50 and a gray zone down to ~45.  
  - **Key Ambiguity**: The exact lower bound of her threshold (is 25 acceptable?). The wedge case (T vs. U) clarifies this.  
  - **Philosophical Context**: Dana avoids the repugnant conclusion by valuing quality over quantity, aligning with "sufficientarian" views in population ethics (e.g., Frankfurt, Crisp). Her rule isn't total utilitarianism (rejected by Verdict 2) or average utilitarianism (strained by Verdict 4), but a hybrid emphasizing adequacy. 

  For your friend: If Dana accepts U in the wedge case, she leans CLU; if she rejects it, she's a stricter sufficientarian. This tracks her intuition that "adding happy people is good" but only if they're "doing well enough."
