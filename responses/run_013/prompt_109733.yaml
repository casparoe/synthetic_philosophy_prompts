  First, I need to recall the Frege-Geach problem basics. Expressivists say moral statements express attitudes, not facts. The problem arises when these statements are embedded in conditionals or negations—they don't seem to express attitudes there, yet they contribute to meaning. The user notes that despite various solutions (quasi-realism, hybrid theories), the debate hasn't moved. 

  The user suspects the core disagreement is about what counts as an adequate theory of meaning. Critics want compositional semantics with stable meanings for embedded contexts, while expressivists focus on reconstructing practices like assertion and inference. If each side uses different criteria for success, the debate stalls. 

  Now, assessing their hypothesis. It holds weight because expressivists like Blackburn and Gibbard use minimalist truth to avoid positing moral facts, while critics like Unwin demand truth-conditional semantics. This is a meta-level clash: what should a semantic theory do? 

  Subsidiary questions: Is the dispute verbal? Partly yes, because "meaning" might mean truth-conditions for critics and use for expressivists. Also, they might be answering different questions—semantics vs. pragmatics/psychology. 

  But is there substantive disagreement? Yes. Can expressivism fully explain logical relations without invoking representational content? Critics doubt it. The key issue is whether minimalist truth can handle validity in moral arguments. 

  Progress might come from formal models (like Gibbard's) or clarifying the explanatory burdens. But if expressivists can show their system mirrors logical structures without realism, that could shift the debate. However, critics might still insist on representational semantics as the only valid approach, which is a deeper philosophical divide. 

  The user wants a diagnosis that takes a side. I agree with their hypothesis but stress that the substantive core is about the adequacy of minimalist truth for logic. Progress requires either expressivists meeting the compositional demand or redefining what semantics should do, which is tough. The debate's stagnation might stem from these foundational divides.
answer: |-
  Your diagnosis is remarkably astute and captures the core structural impasse in the Frege-Geach debate. While subtle nuances exist within each camp, your hypothesis about the *source* of the disagreement holds up exceptionally well. Here's a breakdown, testing its strengths, identifying where it might need refinement, and addressing your subsidiary questions:

  **Core Hypothesis: Conflicting Criteria of Adequacy**
  You are fundamentally correct. The deadlock stems from a meta-semantic disagreement about **what constitutes an adequate semantic theory**, particularly concerning truth and compositionality.

  1.  **Critics (e.g., Geach, Unwin, Schroeder early on, realist opponents):**
      *   **Demand:** A **robustly compositional, truth-conditional semantics.** For any sentence (simple or complex), its meaning must be built systematically from the meanings of its parts and their mode of combination. The meaning of an embedded sentence (e.g., the antecedent of "If lying is wrong...") must be the *same stable, propositional content* it contributes when asserted. Validity must be defined in terms of truth-preservation across all possible worlds.
      *   **Measure of Failure:** If expressivism cannot provide this kind of semantics – especially a stable, context-independent content for embedded moral sentences that explains their role in inferences – it fails. The absence of such a semantics is decisive.
      *   **View of Truth:** Often implicitly or explicitly assume a **substantive conception of truth** (correspondence, coherence) or at least demand that truth *plays a robust explanatory role* in the semantic machinery. Minimalism is seen as insufficient for grounding logic and meaning.

  2.  **Expressivists (e.g., Blackburn, Gibbard, Schroeder later work, Chrisman):**
      *   **Offer:** A **pragmatic/logical/inferential role semantics.** Meaning is explained primarily in terms of the *mental states expressed* by utterances and the *inferential commitments/consequences* those utterances incur. The meaning of an embedded sentence is explained by its *role* within complex attitudes or plans (e.g., rejecting combinations of attitudes).
      *   **Measure of Success:** If expressivism can systematically reconstruct the *logical behavior* of moral discourse (validity, negation, conditionals), explain the *surface grammar*, and account for the *phenomenology of moral disagreement and reasoning* without positing realist moral facts or abandoning the core non-cognitivist insight, it succeeds. Providing a *model* of the practice discharges the semantic demand.
      *   **View of Truth:** Heavily rely on **deflationary/minimalist truth.** Truth is seen as a device for endorsement, generalization, or semantic ascent within the practice they are reconstructing. It bears the weight *because* it's minimalist; they argue it doesn't *need* substantive content to play its logical role. Validity is reconstructed in terms of *inconsistency* or *plan-theoretic inconsistency*.

  **Where Your Hypothesis is Spot On:**
  *   **Stalemate Source:** The debate stalls precisely because each side judges the other's solutions by their *own* rejected standard. Critics look at the expressivist's "logic of attitudes" and say, "But you haven't given me the *proposition* that 'lying is wrong' contributes to the conditional!" Expressivists look at the critic's demand and say, "But I've shown *how the inference works* in terms of commitments; why do you need that extra metaphysical baggage?"
  *   **Weight of Minimalism:** Deflationary truth *is* the linchpin. Expressivists *need* it to avoid realism while mimicking realist talk. Critics *distrust* it, believing logic and compositionality require a more robust notion of truth/content. The disagreement over whether minimalist truth can "bear the weight" *is* the central meta-semantic battle.
  *   **Different Explanatory Goals:** Expressivists focus on explaining *use, commitment, and disagreement psychology*. Critics focus on explaining *semantic content and logical form in a truth-conditional framework*.

  **Refinements & Nuances:**
  *   **Sophistication of Expressivism:** Modern expressivism (Gibbard, Schroeder) *does* attempt to provide formal compositional semantics, often using complex structures (hyperplans, normative perspectives, "being for" relations). They argue this *is* a compositional semantics assigning stable "contents" (albeit non-representational ones) that explain embedding. Critics then argue these "contents" are either (a) still not genuinely propositional/truth-apt in the required sense or (b) functionally equivalent to realism.
  *   **The "Stability" Demand:** Critics demand *stability of meaning* between asserted and embedded contexts. Expressivists like Blackburn argue for a *stability of attitude type* ("hyperevaluative attitude") that manifests differently (expressed vs. considered) in different contexts. Critics find this insufficiently semantic.

  **Subsidiary Questions Answered:**

  1.  **Is the dispute partly verbal?**
      *   **Yes, significantly so, regarding "meaning," "semantics," and "truth."**
      *   **"Meaning":** Critics often mean *truth-conditional content*. Expressivists mean *inferential role* or *expressive function*. When a critic says "You haven't given the meaning of the embedded sentence," and the expressivist says "Yes I have, here's its role in the conditional attitude," they are using "meaning" differently. Disambiguating reduces *some* heat.
      *   **"Semantics":** Critics see semantics as fundamentally *world-directed* (content about the world). Expressivists see semantics as fundamentally *mind-directed* or *practice-directed* (content as a reflection of mental states or social practices). This is a deep philosophical divergence about the subject matter of semantics.
      *   **"Truth":** The verbal aspect is most pronounced here. Critics often mean a property with substantive explanatory power. Expressivists mean a minimalist device. When expressivists say "Moral sentences *can* be true (minimally)," critics hear an equivocation or concession to realism.
      *   **What Survives Disambiguation?** Even after disambiguation, a **substantive disagreement remains**: Can the *logical behavior* and *inferential relations* of moral language be fully explained *solely* by appeal to non-cognitive attitudes and minimalist truth, *without* invoking representational content playing a causal/explanatory role in the compositional machinery? Critics say no; expressivists say yes.

  2.  **Are they answering different questions?**
      *   **Exactly.** This is crucial.
      *   **Critic's Question:** "What is the *propositional content* contributed by the embedded moral clause to the truth conditions of the complex sentence in which it occurs, and how does this content ground the validity of moral inferences?"
      *   **Expressivist's Question:** "What *mental state* is expressed by uttering the complex sentence, how does this state relate to the states expressed by its parts, and how does this system of states and their incompatibilities explain the *phenomenon* of valid moral inference as practiced?"
      *   The expressivist sees the critic's question as presupposing a representationalist framework they reject. The critic sees the expressivist's answer as changing the subject away from core semantic explanation.

  **The Substantive Core & What Could Settle It:**
  Beyond the verbal disagreements and differing questions, there is a **substantive philosophical disagreement** at the meta-semantic level:
  *   **The Question:** "Is a **robustly compositional, truth-conditional semantics** (requiring stable, truth-evaluable propositional contents as the meanings of subsentential components and embedded clauses) an **indispensable requirement** for an adequate account of language and logic, *including* moral and normative language?"
  *   **Critics:** Answer **Yes.** They believe logic, meaning, and reasoning *require* this framework. Minimalism is insufficient.
  *   **Expressivists:** Answer **No.** They believe logic, meaning, and reasoning can be grounded in the pragmatics of attitude expression and commitment, with minimalist truth serving a logical/practical function. They aim to *mimic* the output of a truth-conditional semantics using non-representational resources.
  *   **What Could Settle It?**
      *   **Success of Formal Models:** If an expressivist model (like Gibbard's plan-theoretic semantics or Schroeder's "being for" semantics) could be shown to *perfectly* replicate *all* the predictions of a truth-conditional semantics for normative language within a purely non-representational framework, including handling complex embeddings and quantifiers seamlessly, this would be a powerful argument for the expressivist "No." Critics would likely still debate whether the model *really* avoids representationalism.
      *   **Explanatory Gap:** Conversely, if critics could identify a *specific, robust logical phenomenon* (e.g., a complex pattern of valid inference, anaphora, presupposition projection) that *cannot* be explained by any expressivist model without *smuggling in* representational content or abandoning core expressivist tenets, this would support the critic's "Yes."
      *   **Paradigm Shift:** A broader shift in philosophy of language away from truth-conditional semantics as the dominant paradigm towards more pragmatic/inferential role semantics could favor expressivism. Conversely, a reinforcement of truth-conditional semantics as the only viable model would favor critics.
      *   **Clarifying Minimalism's Limits:** A deeper philosophical argument establishing that minimalist truth *cannot*, even in principle, bear the explanatory load required for logic and compositionality, independent of expressivism, would be devastating. Conversely, a defense showing its adequacy would be a major win.

  **What Would Count as Progress?**
  1.  **Formal Results:** Demonstrating that an expressivist compositional semantics *can* or *cannot* fully capture the logic of normative discourse (e.g., proving equivalence to a truth-conditional system, or proving an in-principle limitation). Gibbard and Schroeder made significant strides here.
  2.  **Sharp Distinctions:** Clearly distinguishing:
      *   The *psychological* question (what mental state is expressed?)
      *   The *pragmatic* question (what commitments are incurred?)
      *   The *semantic content* question (what proposition is expressed? - critics' demand)
      *   The *logical role* question (how does it contribute to inference? - expressivists' focus)
      *   And crucially, the *meta-semantic* question (what *counts* as answering the semantic content question?).
  3.  **Reframing the Demand:** Progress might involve expressivists successfully arguing that their reconstructions *are* what "giving the meaning" amounts to for normative language, thereby *redefining* the adequacy criteria. Critics remain deeply skeptical of this move.
  4.  **Acknowledging the Stakes:** Explicit recognition by both sides that the core disagreement is meta-semantic and about the very goals of semantic theory, rather than just the details of handling embeddings. Your post does this admirably.

  **Conclusion:**
  Your hypothesis is largely correct and provides the essential diagnosis. The Frege-Geach debate is fundamentally stalled by a clash between two visions of semantics: **Truth-Conditional Compositionalism** vs. **Pragmatic/Inferential Role Expressivism**, underpinned by a deep disagreement about the **adequacy of deflationary truth** for grounding logic. The dispute is **partly verbal** (regarding "meaning," "truth," "semantics"), but disambiguation reveals a **substantive philosophical disagreement** about whether robust propositional content is indispensable for explaining language and logic. Progress requires either formal success for expressivist semantics, a demonstrated explanatory gap, a paradigm shift in philosophy of language, or a conclusive argument about the capabilities/limits of minimalist truth. Until then, the stalemate persists because the sides are indeed arguing past each other on a meta-level about what counts as a solution.
