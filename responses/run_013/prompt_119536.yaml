prompt: |-
  I'm the instructor for a 400-level metaphysics seminar, and I'm writing the final exam. Every year the unit on Bradley's regress produces the same essays: students narrate the regress in two paragraphs, announce that it either shows that relations are unreal or that it is a harmless infinite regress, and then stop — none of them see that the argument is really about the unity of the proposition, that is, about what makes a proposition with several constituents one thing rather than a mere aggregate or list of those constituents. I want one exam question that cannot be answered by that narration. Act as an experienced examiner and metaphysician, and think carefully about where the real difficulty lies before you draft anything.

  To force the issue, I am going to hand the students a position they cannot have read, because I invented it: call it the brute-unity view. On this view a proposition such as the proposition that the cat is on the mat is genuinely composed of its constituents — the cat, the mat, and the relation of being on — and is one thing rather than a mere plurality because it possesses a primitive unity that is stipulated to be neither a further constituent of the proposition nor a relation. Its defender claims that the regress never gets started, since the unifying feature is by hypothesis non-relational and non-constituent, so no further relation is needed to tie it to the items it unifies. The question I want should require students to (a) state precisely why the regress is supposed to threaten any view that locates a proposition's unity in a relation among its constituents, (b) decide whether the brute-unity view genuinely escapes the regress or merely relabels the difficulty by fiat, and (c) identify what the view costs — what it leaves inexplicable, what it forces one to give up about composition or about propositions being complexes of their constituents, or which more familiar position it quietly collapses into. Pitch it at 60 minutes and 25 marks, so roughly an 800- to 1000-word essay.

  Please give me the exam question, a model answer of about 700 words that a strong student could plausibly write under time pressure, and a marking scheme that attaches marks to the specific moves a top answer must make (totalling 25) and says, in one line each, how students typically get those moves wrong. The scheme should draw a sharp line between an A answer that sees that the words non-relational and non-constituent may be doing all the work by stipulation — and goes on to ask what independent reason there is to accept such an entity — and a B answer that simply reports that the view avoids the regress. Build the question so that it stands on its own: do not anchor it in any named author's published reply to the regress, and do not ask for citations or a reading list. Begin with a few bullet points sketching the lines of attack on the brute-unity view, then write the question, then the model answer, then the marking scheme.
reasoning: |-
  We are designing an exam question to challenge students to think beyond the standard narrative about Bradley's regress. The focus is on the unity of the proposition. We introduce a fictional "brute-unity view" to force engagement with the underlying issues.

   Key elements the question should target:
   (a) Why the regress threatens views that locate unity in a relation.
   (b) Whether the brute-unity view escapes the regress or just relabels the problem.
   (c) What the brute-unity view costs (what it leaves unexplained, what it forces us to give up, or if it collapses into a familiar position).

   Lines of attack on the brute-unity view (to guide the formulation of the question):
   - The view stipulates a primitive unity that is non-relational and non-constituent. But what is the nature of this unity? How does it unify without being a relation?
   - It might be accused of being an ad hoc solution: by fiat, we say there is no regress, but without explaining how unity is achieved.
   - It leaves the unity of the proposition as a brute fact, which might be seen as a failure to explain the very phenomenon we set out to explain.
   - It may conflict with the idea that propositions are composed of their constituents. If the unity is not a constituent, then what is the status of the proposition? Is it a simple entity after all? Or does it have constituents without a unifier?
   - It might collapse into a kind of mysterianism or into a view that denies that propositions have constituents in any ordinary sense.

   The Exam Question:

   **Question (60 minutes, 25 marks):**

   Consider the following view about the unity of the proposition (call it the brute-unity view): A proposition, such as the proposition that the cat is on the mat, is composed of its constituents (the cat, the mat, and the relation of being on). However, the proposition is one thing rather than a mere aggregate of these constituents because it possesses a primitive unity. This unity is stipulated to be neither a further constituent of the proposition nor a relation.

   Defenders of this view claim that Bradley's regress never gets started because the unifying feature is non-relational and non-constituent, so there is no need for a further relation to tie it to the items it unifies.

   Critically evaluate this view. In your essay, you must:

   1. State clearly why Bradley's regress is supposed to be a problem for any view that explains the unity of a proposition by positing a relation among its constituents. (8 marks)

   2. Explain whether and how the brute-unity view avoids the regress, or whether it merely relabels the problem without solving it. (8 marks)

   3. Discuss what the brute-unity view costs: what it leaves unexplained, what it forces us to give up about composition or about propositions being complexes of their constituents, or whether it collapses into a more familiar position. (9 marks)

  ---

   **Model Answer (approx. 700 words):**

   Bradley's regress is a challenge to any account of the unity of the proposition that relies on relations. The problem arises when we try to explain how a proposition, such as "the cat is on the mat," is a single, unified entity rather than just a list of its constituents (the cat, the mat, and the relation of being on). If we say that the relation (being on) unifies the proposition by relating the cat and the mat, we must then explain how the relation itself is connected to the relata. For instance, how does the relation of being on hold between the cat and the mat? If we posit a further relation (say, instantiation) that ties the relation of being on to the cat and the mat, then we face the same problem again: how is this new relation related to the items it connects? This leads to an infinite regress. The regress threatens because each step seems necessary to achieve unity, but no step completes the task. Therefore, the regress suggests that no relation can ultimately provide the unity of the proposition, which might force us to conclude that relations are unreal or that the unity must be found elsewhere.

   The brute-unity view attempts to avoid this regress by stipulating that the unity of the proposition is primitive and non-relational. It is not an additional constituent and not a relation. By doing so, the view blocks the regress at the first step: since the unifier is not a relation, there is no need for a further relation to connect it to the constituents. The regress, which starts by asking for a relation to connect the unifier to the constituents, is preempted because the unifier is not the kind of thing that requires such a connection. Thus, the brute-unity view does seem to escape the regress by design.

   However, it is questionable whether this escape is genuine or merely a relabeling of the problem. The view stipulates that there is a primitive unity that does the job without being a relation or a constituent. But what is this unity? How does it manage to unify the constituents without being a relation? The defender of brute unity might say that it is a brute fact, but then we are left without an explanation of how the unity is achieved. Essentially, the brute-unity view avoids the regress by declaring the unity as primitive and unexplainable. This move is suspiciously ad hoc: it seems to cut off the regress by fiat without providing a positive account. Moreover, one might argue that the regress arises precisely because we require an explanation of unity, and the brute-unity view simply refuses to give one. So, while it avoids the regress, it does so at the cost of abandoning the explanatory project.

   The cost of the brute-unity view is high. First, it leaves the unity of the proposition entirely unexplained. This is a significant retreat from the traditional metaphysical goal of understanding how complex entities are formed. Second, it forces us to give up the idea that a proposition is nothing more than a complex of its constituents. If the unity is not a constituent and not a relation, then the proposition must be more than the sum of its parts. This extra element (the primitive unity) is not accounted for in the composition. Third, the view may collapse into a form of mysterianism about propositions, where their unity is accepted as a fundamental and inexplicable feature. Alternatively, it might collapse into a view that denies that propositions have constituents at all, which would be a radical departure. For if the unity is primitive and non-constituent, then it is unclear what role the constituents play. Are they really parts of the proposition? Or are they somehow absorbed into a simple whole? The brute-unity view might thus lead to a holistic view of propositions that undermines the very idea of propositional composition.

   In conclusion, the brute-unity view avoids Bradley's regress by stipulation. But it does so at the cost of making the unity of the proposition a brute and inexplicable fact. This leaves the central metaphysical problem unsolved and may force us to abandon the common-sense view that propositions are structured complexes. The view thus trades one problem (the regress) for another (the lack of explanation) and may lead to more radical and unintuitive positions.

  ---

   **Marking Scheme (Total 25 marks):**

   **Part 1: Explanation of why Bradley's regress threatens relational views (8 marks)**
   - 2 marks: Identifying that the regress arises from the need to explain how the relation connects to the constituents.
   - 3 marks: Explaining that each step requires a further relation to connect the previous unifier to the constituents, leading to an infinite regress.
   - 3 marks: Stating that this regress appears vicious because it never achieves unity, thus undermining the relational account.

   *Common mistakes:*
   - Simply narrating the regress without explaining why it is problematic (e.g., just saying "it goes on forever").
   - Failing to connect the regress to the problem of unity (e.g., treating it as a problem about relations in general without the context of propositions).

   **Part 2: Evaluation of whether brute-unity avoids the regress (8 marks)**
   - 3 marks: Recognizing that the brute-unity view avoids the regress by stipulating that the unifier is non-relational and non-constituent, so no further relation is needed.
   - 3 marks: Arguing that this might be merely a relabeling because it doesn't explain how the unity works and just declares it primitive.
   - 2 marks: Noting that the avoidance is by design but may be ad hoc.

   *Common mistakes:*
   - Simply stating that the view avoids the regress without critical evaluation.
   - Missing the point that the stipulation might be merely relabeling the problem.

   **Part 3: Discussion of the costs (9 marks)**
   - 3 marks: Identifying that unity is left unexplained (brute fact).
   - 3 marks: Explaining that the view forces us to give up the idea that propositions are simply complexes of their constituents (because the unity is an extra element that is not a constituent and not accounted for in the composition).
   - 3 marks: Considering whether the view collapses into mysterianism (or a similar position) or whether it undermines the constituent structure of propositions.

   *Common mistakes:*
   - Only stating that it leaves unity unexplained without exploring the implications.
   - Not addressing the impact on the composition of propositions.

   **Note on overall quality:** An A answer (top marks) will see that the stipulation of a non-relational, non-constituent unifier may be ad hoc and that the view leaves the unity unexplained. It will also clearly articulate the costs. A B answer might correctly report that the view avoids the regress and note that unity is primitive but without critically engaging with the costs or the worry about relabeling.
answer: |-
  ### Lines of Attack on the Brute-Unity View  
  - **Ad hoc stipulation**: Does declaring unity "primitive" resolve the issue or merely mask it by refusing to explain *how* unification occurs?  
  - **Explanatory bankruptcy**: If unity is brute, does this abandon the core metaphysical project of explaining complexity?  
  - **Constituent confusion**: Can a proposition genuinely "have" constituents if the unity binding them is external to its composition?  
  - **Collapse risk**: Does the view covertly reduce to a familiar stance (e.g., holistic simples or eliminativism about relations)?  

  ---

  ### Exam Question  
  **(60 minutes, 25 marks | Aim for 800–1000 words)**  

  > **Critically evaluate the "brute-unity view" of propositional unity.**  
  >   
  > On this view, a proposition (e.g., *that the cat is on the mat*) is composed of constituents (the cat, the mat, the relation *on*) but is unified into a single entity—rather than a mere list—by a primitive "unity." Crucially, this unity is stipulated to be **neither a constituent** of the proposition **nor a relation**. Defenders argue Bradley’s regress cannot start, as no further relation is needed to tie this non-relational, non-constituent unity to the constituents.  
  >   
  > In your response:  
  > 1. **Explain why Bradley’s regress threatens any theory grounding propositional unity in a relation among constituents** (e.g., a relation binding the cat, mat, and *on*). (8 marks)  
  > 2. **Assess whether the brute-unity view genuinely escapes the regress or merely relabels the problem by fiat.** Does the stipulation of "non-relational, non-constituent" unity resolve the issue or restate it? (8 marks)  
  > 3. **Identify the metaphysical costs of this view**: What must it leave inexplicable? What must it deny about propositions as complexes of constituents? Does it collapse into a more familiar position (e.g., mysterianism, atomism)? (9 marks)  

  ---

  ### Model Answer (Strong Student Response, ~700 words)  

  Bradley’s regress targets theories that explain propositional unity via a relational constituent (e.g., a "glue" relation tying the cat, mat, and *on* in *<cat, on, mat>*). The regress arises because any such relation must itself be connected to the constituents it unifies. For instance, if relation *R* binds *a* and *b* in *aRb*, we need a further relation *R₁* to link *R* to *a*, and then *R₂* to link *R₁* to *R*, ad infinitum. Crucially, each step fails to achieve genuine unity: *R₁* must relate *R* to *a*, but this merely adds another link in an unanchored chain. The regress is vicious because it implies that relational approaches *never* explain unity—they endlessly defer it. Thus, the threat is not infinity per se, but explanatory failure: relations cannot unify propositions without inviting an unreachable completion. (198 words)  

  The brute-unity view claims to evade this by positing unity as primitive—neither a relation nor a constituent. By stipulation, no "tie" is needed between unity and constituents, blocking the regress at step zero. *If* successful, this avoids the infinite chain: unity operates without relational mediation. Yet this escape is illusory. The view "solves" the problem by relabeling it: declaring unity inexplicable by definition. The regress challenges us to explain *how* disparate constituents become one, but brute unity baldly asserts that unification "just happens." This is ad hoc—it uses the *words* "non-relational, non-constituent" to mask the lack of mechanism. Worse, it invites a variant regress: if unity is distinct from constituents, what prevents the proposition from fracturing into *constituents + unity*, requiring *another* unifier? The defender may retort that unity is "built into" the proposition holistically, but this collapses into mysterianism (see below). Thus, the view avoids Bradley’s regress only by rejecting the demand for explanation, not by resolving it. (183 words)  

  The costs are severe. First, **explanatory surrender**: unity is brute, leaving the central mystery of propositional complexity unsolved. If metaphysics aims to explain how parts form wholes, brute unity abdicates this task. Second, **constituent incoherence**: the view insists propositions "have" constituents, but if unity is external to composition, constituents are not truly *unified*—they are merely *accompanied* by unity. This strains the notion of "composition": is the proposition a whole, or a list with unity appended? Third, **collateral damage**: brute unity forces abandonment of intuitive claims—e.g., that "propositions are structured entities" or "relations contribute to unity." Finally, it collapses into **mysterian holism**. If unity is primitive and non-constituent, propositions cease to be complexes and become simple entities "pointing" to constituents—akin to Fregean wholes. Worse, it mirrors Russell’s failed 1903 theory, where propositions were unanalyzable units. Either outcome undermines the view’s core claim: if unity is non-constituent, the proposition cannot be its constituents’ complex without circularity. The brute-unity view thus exchanges regress for mystery and risks self-defeat. (188 words)  

  ---

  ### Marking Scheme (25 marks total)  
  **Part 1: Bradley’s regress threat to relational views (8 marks)**  
  - **3 marks**: Correctly identifies the trigger (a relation needing further relations to connect it to constituents).  
  - **3 marks**: Explains why the regress is vicious (explanatory failure, not mere infinity; each step fails to secure unity).  
  - **2 marks**: Clarifies the target (relational accounts of unity, not relations per se).  
  > *Common error: Narrating the regress sequence without explaining why it undermines unity.*  

  **Part 2: Brute-unity escape or evasion? (8 marks)**  
  - **3 marks**: States how stipulation blocks the regress (no relation → no need for further relations).  
  - **3 marks**: Argues that stipulation relabels the problem (e.g., "non-relational" hides explanatory absence; risks a new regress).  
  - **2 marks**: Notes the ad hoc nature (declaring unity brute without independent justification).  
  > *Common error: Claiming it "solves" the regress without probing stipulation’s emptiness.*  

  **Part 3: Metaphysical costs (9 marks)**  
  - **3 marks**: Identifies inexplicable brute unity as a cost (abandons explanation of composition).  
  - **3 marks**: Analyzes constituent incoherence (constituents + brute unity ≠ genuine composition).  
  - **3 marks**: Identifies collapse (e.g., into holism/simples) or collateral damage (e.g., denying structured propositions).  
  > *Common error: Listing "costs" superficially (e.g., "it’s mysterious") without tying them to metaphysical principles.*  

  #### Grading Key  
  - **A (21–25 marks)**: Sees that stipulation begs the question; exposes costs as foundational (e.g., "brute unity dissolves composition").  
  - **B (16–20 marks)**: Correctly reports regress avoidance and costs but misses depth (e.g., "avoids regress because unity isn’t a relation").  
  - **C (11–15 marks)**: Adequate on Part 1, superficial on Parts 2–3 (e.g., "brute unity works by being primitive").  
  - **D/F (≤10 marks)**: Misstates the regress or brute-unity view; minimal engagement with costs.  

  > **Top-tier insight**: An A answer recognizes that "non-relational, non-constituent" is a *label*, not an explanation—and demands *why we should accept* such an entity.
