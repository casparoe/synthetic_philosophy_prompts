  We are to argue for epistemicism over supervaluationism using the retroactive sharpening case.
   The case: School rule "on time" is vague. School board later sets a precise cutoff (e.g., 8:00:00.0). Then, a year later, a different board sets a different cutoff (e.g., 8:00:30.0). 
   Questions: 
     - For the kid who came in at 8:00:00.4 last Tuesday (before the board voted): was he late then?
     - Did the first board discover the truth or create it?
     - What about when the second board changes the cutoff?

   Epistemicism claims that there was always a precise cutoff, but we are ignorant of it. 
   Supervaluationism claims that before the board's decision, the statement "the kid is on time" was neither true nor false (but might be supertrue or superfalse if it holds on all precisifications).

   We are to make the strongest argument for epistemicism, focusing on the retroactive sharpening.

   Steps of the argument:
    1. In the retroactive sharpening case, the board's decision is presented as a discovery of the pre-existing fact (if we are epistemicists) or as a legislative act (if we are supervaluationists).
    2. The school rule was in place before the board voted. The kid was either on time or not on that Tuesday, regardless of whether the board later sets a cutoff.
    3. If we say that the board's decision created the cutoff, then we are denying that there was a fact of the matter at the time. But that leads to the problem: if the board had never voted, would there still be no fact? And if so, then the kid who came in at 8:00:00.4 was neither on time nor late? That seems counterintuitive because the rule was in effect and the kid either satisfied it or not.
    4. Moreover, consider the second board vote a year later. If the board changes the cutoff, then under supervaluationism, they are changing the meaning of "on time" retroactively? But that would mean that the past event (the kid coming in at 8:00:00.4) would change its truth value. For example, if the second board sets 8:00:30, then the kid who came in at 8:00:00.4 would become "on time" retroactively? That seems odd because the event is fixed in the past.
    5. Epistemicism avoids this by saying that there was always a precise cutoff (even if we don't know it). The first board tried to discover it and might have been wrong. The second board might be wrong too. The fact that they change the cutoff doesn't change the actual truth at the time of the event.

   Key distinction: 
     - The distinction between the metaphysical fact (what was the case at the time) and our knowledge or conventions about it.

   Fiat implication (what epistemicism says about the kid at 8:00:00.4):
     - At the time the kid entered, there was a fact about whether he was on time. That fact is fixed and does not change with later board decisions. The board's decision might be an attempt to capture that fact, but they could be wrong. So, if the kid was actually late (because the true cutoff was, say, 8:00:00.0), then he was late even if the board later says 8:00:30. And vice versa.

   Strongest objection to epistemicism:
     - How can there be a precise cutoff when the rule was introduced without any such precision? It seems arbitrary and there is no way to know it. Why would one particular nanosecond be the cutoff rather than another?

   Reply to that objection:
     - The epistemicist can grant that the cutoff is arbitrary in the sense that the rule-maker did not have a specific cutoff in mind. However, the rule is in the world and applies to precise events. The arbitrariness does not undermine the fact that the rule must draw a line somewhere, even if we cannot know where. The vagueness is in our knowledge, not in the world.

   Confidence: 
     - We are to assign a confidence level. Given that this is a philosophical debate and both sides have strong points, but the retroactive sharpening case does seem to put pressure on supervaluationism, I would say 0.7 (fairly confident but aware of the objections).

   Now, let's structure the argument in steps:

   Argument steps (array of objects with label and content):

    1. Label: "The Fixed Past"
       Content: "Events in the past are fixed and unchangeable. The kid's arrival time at 8:00:00.4 on Tuesday is a historical fact. Therefore, whether he was on time or late at that moment must be a fact that is also fixed and unchangeable."

    2. Label: "The Rule's Application"
       Content: "The school rule was in effect on Tuesday. The rule either applied to the kid (making him late) or it did not (making him on time). There is no third option because the rule is a binary condition (on time or not) and the event is precise."

    3. Label: "The Board's Action as Discovery"
       Content: "The board's decision to set a cutoff at 8:00:00.0 is best understood as an attempt to discover the pre-existing truth about the rule's application. They are not creating a new rule but rather trying to codify the existing one. If they set the cutoff correctly, they capture the truth; if not, they err."

    4. Label: "The Second Board's Action and Error"
       Content: "When a second board changes the cutoff to 8:00:30, they are either correcting the first board's mistake or making a new mistake. The truth about the kid's status on Tuesday remains unchanged because it depends on the actual cutoff at the time of the event, not on later decisions."

    5. Label: "Supervaluationism's Problem with Retroactive Change"
       Content: "Supervaluationism, by contrast, would have to say that before the first board's decision, the kid's status was indeterminate. Then the first board's decision makes it the case that he was late (if they set the cutoff at 8:00:00.0). But then the second board's decision would retroactively change the past truth value to 'on time' (if they set 8:00:30). This implies that the past is not fixed, which is counterintuitive."

    6. Label: "Epistemicism's Advantage"
       Content: "Epistemicism avoids retroactive changes to truth values by insisting that the truth was always determinate. The boards' decisions are merely attempts to track that truth, and they may succeed or fail. This preserves the fixed nature of the past and the objectivity of the rule's application."

   Thesis (one sentence):
     - "Epistemicism, by maintaining that vague predicates have sharp cutoffs unknown to us, best explains the fixed truth values of past events and avoids the counterintuitive retroactive changes implied by supervaluationism in cases of retroactive sharpening."

