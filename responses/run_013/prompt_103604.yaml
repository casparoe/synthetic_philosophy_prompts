answer: |-
  ### Argument for Epistemicism in Retroactive Sharpening Cases

  **Thesis:** Epistemicism, by positing a definite but unknowable cutoff for vague predicates, best explains the unchangeable truth of past events and avoids the incoherent retroactive truth-value shifts implied by supervaluationism in cases of school-board-style "retroactive sharpening."

  #### Argument Steps (in Order of Presentation):

  1. **The Immutability of Past Facts**  
     *Content:* Past events have fixed, unchangeable properties. The child’s arrival at 8:00:00.4 last Tuesday is a historical fact. Thus, whether this event satisfied the rule "on time" must be equally fixed—it cannot retroactively change based on future human decisions. Supervaluationism, however, allows truth values to shift with new precisifications, violating this core principle of temporal metaphysics.

  2. **The Rule Demands Binary Compliance**  
     *Content:* The school rule functioned as a binding standard at the time of the event: compliance was binary (on time/late), with real consequences (detention). For the rule to be enforceable, it must have been objectively applicable—even if vague. Epistemicism grounds this by asserting a fact of the matter existed; supervaluationism renders compliance indeterminate, undermining the rule’s authority.

  3. **Board Actions as Erroneous Discovery, Not Creation**  
     *Content:* The first board’s vote (setting 8:00:00.0) is best interpreted as an attempt to *discover* the preexisting cutoff, not create it. If they "got it wrong," the child’s actual status remains unchanged. When the second board sets 8:00:30, they are either correcting the first board’s error or introducing a new one. This aligns with epistemicism’s view that cutoffs are mind-independent facts.

  4. **Supervaluationism’s Retroactivity Problem**  
     *Content:* Under supervaluationism, the child’s status pre-vote was indeterminate. The first board’s vote makes "late" true retroactively (if 8:00:00.0 is chosen). Later, the second board’s vote (8:00:30) makes "on time" true retroactively. This implies the *past event itself* changes its truth value—a violation of causality and historical fixity that epistemicism avoids.

  5. **The Incoherence of Multiple "Real" Cutoffs**  
     *Content:* If boards can redefine "on time" retroactively, which cutoff is "real" for the past event? Supervaluationism must say *both* are valid (at different times), making truth relativized to precisification moments. Epistemicism resolves this: only one cutoff was ever true (unknowably), so board decisions are judgments about that singular fact—some accurate, some mistaken.

  6. **Practical Consequences Validate Epistemicism**  
     *Content:* If the school punished the child pre-vote, epistemicism explains this as enforcement of an objective (but unknown) truth. Supervaluationism implies punishment was neither justified nor unjustified until the board voted—absurd for real-world governance. This shows epistemicism better captures how vague rules operate in practice.

