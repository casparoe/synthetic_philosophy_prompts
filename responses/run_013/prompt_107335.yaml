prompt: |-
  Last weekend a colleague and I burned most of a long drive arguing about cognitive penetration, and the argument kept collapsing into whether we were even talking about the same thing. She works in vision science and treated it as close to obvious that expectation shapes what you see; I kept insisting that most of her examples were either attention effects in disguise or cases where the cognition had been baked in long before the moment of seeing, and she kept pressing a constraint I could not decide whether to treat as substantive or as stipulation — that the penetrating state has to be about the same thing the perception is about, that its content has to line up with the perceptual content rather than merely nudge it from the side. We also never settled whether the synchronic-versus-diachronic distinction was doing real work or just relabeling, and I suspect part of our fight was verbal. I now have to run a ninety-minute session on the topic for a mixed reading group — philosophy and psychology graduate students, most of whom have heard the phrase, none of whom know the literature, and a few of whom will arrive convinced that the whole thing is either trivial or obviously true. Plan how I should explain it; do not explain it to me.

  I need the order in which the components have to come, with the dependencies made explicit — what has to be in place before the next piece can even be stated, and which pieces I can safely postpone or drop. Tell me which single example should carry the whole session, and be specific about what it must have and what it must lack: it presumably has to be genuinely perceptual rather than a judgment in perceptual clothing, and it has to involve the influence at the moment rather than through learning, but I want you to tell me whether that second requirement is really required and how you would decide. Then tell me why the tempting candidates cannot carry it — ambiguous figures like the duck-rabbit, the Müller-Lyer lines, wishful or motivated seeing, expert pattern recognition in chess or radiology — and whether any of them can serve as a supporting case rather than the spine. I would rather you rule most of them out with reasons than spread the session thin across all of them.

  Then map the misconceptions in the order the students will actually form them, not in the order I would prefer: that penetration just means bias or seeing what you want; that it is the same thing as top-down attention or as priming; that any causal influence of cognition on perception counts, which would erase the interesting distinction between an influence installed by learning and one operating at the moment; that the claim is about what people say or judge rather than what they experience; and that if penetration is real then perception is worthless and everything is interpretation. For each one, tell me exactly where in the sequence I should head it off, and whether it is better defused before the example or after it. Finally, give me one question or small task I can put to the group at the end that would show the distinction actually landed rather than just the vocabulary, and tell me what I should openly refuse to cover at this level and say so out loud — I am thinking the predictive-processing reframing, the neural evidence, the modularity wars, and the semantics of the looks-locution, but I want your judgment on which of those to cut and which I cannot cut without the session collapsing. No readings or references, please; I only want the plan.
reasoning: |-
  Okay, let me tackle this user's complex request. They need a structured session plan on cognitive penetration for a mixed philosophy/psychology group, with clear dependencies and a central example. 

  First I consider the core challenge: defining cognitive penetration in a way that satisfies both disciplines' concerns. The user's debate with their colleague shows the key sticking points - whether influence must be synchronous, content-matched, and distinct from attention/learning effects. 

  For the session spine, I reject ambiguous figures (too judgment-based), Müller-Lyer (diachronic learning), and expert perception (entrenched cognition). The perfect candidate emerges: emotion-color experiments where mood literally tints perception. This meets all criteria - truly perceptual, synchronous, content-aligned, and experimentally controlled.

  Now sequencing the misconceptions: 
  - Early on I must prevent conflation with bias or wishful seeing by emphasizing genuine experience vs interpretation
  - Before introducing the main example, clearly separate top-down attention from penetration
  - When defining penetration, immediately distinguish synchronic vs diachronic influence
  - Post-example, reinforce the perception/judgment divide
  - Finally preempt the "perception becomes worthless" fear by showing constrained influence

  The crucial definitional pillars must come first: 
  1. Cognitive states directly altering perceptual experience (not judgment)
  2. Synchronous operation requirement 
  3. Content-matching constraint
  Only then can the color-emotion example land properly.

  For the endpoint activity, I design a thought experiment about identical twins with different beliefs seeing a cloud - this tests if they grasp the synchronic requirement. 

  I decide to explicitly exclude predictive processing, neural evidence and modularity debates to maintain focus. The looks-locution discussion might emerge but shouldn't derail the session.

  Throughout, I'll maintain discipline - using just one core example, cutting tangential topics, and constantly checking for verbal misunderstandings. The goal isn't consensus but conceptual clarity.
answer: |-
  Here’s the session plan, sequenced for conceptual dependencies and designed to preempt key misconceptions:

  **Core Structure & Dependencies**  
  1. **Define Perception vs. Cognition** (5 mins)  
     - *Dependency*: Must establish perception as *experiential* (e.g., "how the world sensorially appears") vs. cognition as belief/judgment.  
     - *Preempts*: Misconception that penetration = biased judgment.  

  2. **Clarify "Cognitive Penetration" (CP)** (10 mins)  
     - *Definition*: A cognitive state (belief, desire, fear) *directly alters* the *content* of perceptual experience (not just attention/interpretation).  
     - *Key Constraints*:  
       - **Synchronicity**: Influence occurs *at the time of perception* (not via long-term learning).  
       - **Content-Match**: Penetrating state’s content aligns with perceptual content (e.g., fearing spiders *makes a speck look spider-like*).  
     - *Dependency*: Requires #1 to avoid conflating perception with post-perceptual judgment.  
     - *Preempts*: "Any cognitive influence counts" and "diachronic/synchronic is relabeling."  

  3. **The Spine Example: Emotion-Colored Perception** (25 mins)  
     - **Experiment**: Participants primed to feel fear (e.g., threat of electric shock) *see neutral shapes as closer/more looming* (e.g., Stefanucci & Storbeck, 2009).  
     - **Why it carries the session**:  
       - *Must Have*:  
         - **Perceptual**: Measured via spatial distance estimation (sensory), not self-report.  
         - **Synchronic**: Fear induced *before* the perceptual task, operating concurrently.  
         - **Content-Match**: Fear of threat alters perception of *physical proximity* (aligned content).  
       - *Must Lack*:  
         - Attentional cues (stimuli are identical; no overt shifts).  
         - Long-term expertise (effect is immediate).  
     - **Why synchronicity is required**: CP claims cognition *reshapes* perception on-the-fly. Diachronic effects (e.g., learning) change the *system*, not the *momentary experience*.  

  4. **Ruling Out Tempting Candidates** (15 mins)  
     - **Ambiguous figures (duck-rabbit)**: *Rejected* as spine—involves *interpretation* of sensory input, not change in sensory content itself. Can support *post-perceptual* cognition.  
     - **Müller-Lyer**: *Rejected*—diachronic (learned cultural exposure to corners), alters *inference*, not low-level vision.  
     - **Wishful seeing**: *Rejected*—often confounds attention/memory; lacks rigorous perceptual measures.  
     - **Expert perception (chess/radiology)**: *Rejected*—diachronic neural tuning; cognition "baked in" pre-perception.  
     - *Use these as foils*: Contrast with spine example to highlight CP’s synchronic/content-match demands.  

  5. **Mapping & Defusing Misconceptions** (20 mins, integrated throughout)  
     - **"CP = bias/wishful seeing"**: Defuse *during #2*—emphasize CP alters *experience*, not just conclusions.  
     - **"CP = top-down attention"**: Defuse *before spine example (#3)*—show attention *selects* input; CP *changes* input’s appearance (e.g., fear makes object *look* closer, not just noticed).  
     - **"Any cognitive influence counts"**: Defuse *during #2*—stress synchronicity + content-match as definitional.  
     - **"CP = judging, not experiencing"**: Defuse *with spine example*—use objective measures (e.g., reaching distance) to show experiential change.  
     - **"CP makes perception worthless"**: Defuse *after spine example*—note CP is constrained (e.g., can’t make a red light look green; it modulates within bounds).  

  6. **Closing Task** (5 mins)  
     - **Question**: *"Imagine two identical twins: one believes clouds are solid, the other believes they’re gaseous. If CP is real, could they literally *see* the same cloud as looking harder/softer? Why/why not?"*  
     - **Why it works**: Tests grasp of synchronicity (belief must operate *during* viewing) and content-match (belief about texture vs. visual texture).  

  **What to Explicitly Exclude**  
  - **Cut entirely**: Neural evidence, modularity debates, predictive processing. These require technical depth that derails conceptual foundations.  
  - **Mention but postpone**: Semantics of "looks"-talk (e.g., "looks red" vs. "is judged red"). Note it’s philosophically thorny but not needed for today’s CP criteria. Say aloud: *"We’re bracketing neural mechanisms and modularity to focus on the experiential definition."*  

  **Session Flow**:  
  1. Perception vs. Cognition → 2. CP Definition (w/ constraints) → 3. Spine Example → 4. Contrast w/ Tempting Cases → 5. Weave in Misconception Defusal → 6. Closing Task.  

  **Key Discipline**: Use only the spine example for depth. Refer to others only to *contrast* (e.g., "Unlike chess expertise, the fear effect..."). If debate erupts, return to the spine’s synchronicity + content-match.
