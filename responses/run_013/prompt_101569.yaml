  - **Literal common knowledge**: "Do you have evidence I don't know about?" (Asking about paint samples like nuclear codes.)  
  - **Ironic resolution**: They agree on the *process*, not the color, and the room ends up absurdly neutral ("50% Morning Fog, 50% Sunbeam Saffron").  

