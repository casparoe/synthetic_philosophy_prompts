  Let me organize this carefully. For the cases, I need to capture scenarios like: (1) classic threshold problems (e.g., water shortage where my shower doesn't matter alone), (2) epistemic uncertainty (e.g., not knowing if others will boycott), (3) market-mediated harms (e.g., my vegetarianism just freeing up meat for others), (4) universalizability tests (what if everyone reasoned like me?), and (5) asymmetric responsibility (e.g., me vs. Exxon). Each must feel real, not contrived.

  For distinctions, the key is preventing theoretical blurring between: causal impact vs moral blame, participation vs actual difference-making, acts vs omissions, group vs individual fault, ex post vs ex ante perspectives, and harm scale vs personal culpability. These are well-established fault lines in collective action ethics.

  The "non-contradict" list reflects their hard-won empirical insights: marginal impacts often vanish, aggregation is real, systems are non-linear, others' choices are unknowable, and solutions must work for isolated individuals. These anchor the theory in reality.

  Now the tricky part - evaluating requirements. Some tensions leap out: "marginal acts change nothing" vs "aggregation matters" creates pressure; "unknowable pivots" conflicts with "livable demands." The heaviest hitter might be the "universal reasoning" case - it torpedoes many theories that work only if others don't follow suit.

  In the scorecard, consequentialism struggles with thresholds, "what if everyone" fails markets, practice-based approaches blur distinctions, group agency overreaches, and virtue ethics dodges causality. Most theories quietly drop the "no coordination" constraint, pretending perfect cooperation.

  My biggest vulnerability? Underestimating how market dynamics (case 3) undermine individual leverage. If new evidence showed behavioral elasticity is near-zero for systemic harms, it might force relaxing "aggregation matters" - but that feels like surrendering moral agency.

  The user deserves honesty: no theory satisfies all requirements perfectly. But the exercise reveals why this dilemma persists - it's structurally thorny. I'll conclude by suggesting they view requirements as tuning knobs: which to prioritize reveals their deepest values.
answer: |-
  Below is the specification you've requested—a set of requirements for any theory addressing individual contributions to collective harm. I’ve structured it to reflect your constraints, flagged tensions, and identified where theories typically fail. The goal is a "litmus test" for adequacy, not a solution.

  ---

  ### **I. Cases the Theory Must Get Right**  
  *(Real-world scenarios, not tricks)*  

  1. **Ordinary Threshold Case**  
     *Case:* 1,000 people drawing water from a depleted well; the 1,000th draw causes collapse. My single draw is neither necessary nor sufficient.  
     *Why real:* Most harms (climate, resource depletion) have tipping points. If the theory can’t handle this, it ignores non-linear systems.  

  2. **Epistemic Uncertainty Case**  
     *Case:* Voting or boycotting when I can’t know if others will join or if my action is pivotal.  
     *Why real:* We almost never know others’ choices or our exact impact (e.g., reducing emissions alone). A theory must work under ignorance.  

  3. **Market/Norm-Mediated Harm Case**  
     *Case:* Buying meat in a global market—my abstinence doesn’t reduce total production, just shifts consumption to others.  
     *Why real:* Many harms operate through systems where individual restraint is absorbed (e.g., carbon markets, consumer goods). The theory can’t assume simple causality.  

  4. **Universal Reasoning Case**  
     *Case:* Everyone in my position (e.g., all middle-class flyers) reasons identically about their flight’s impact.  
     *Why real:* If moral reasoning depends on assuming others act differently, it collapses when scaled. Demands must be coherent if universalized.  

  5. **Asymmetric Responsibility Case**  
     *Case:* A corporation emits 10,000 tons of CO₂; I emit 10 tons. My "sliver" must neither vanish nor equate to theirs.  
     *Why real:* Power imbalances exist (e.g., me vs. Exxon). The theory must distinguish scale without absolving small actors.  

  ---

  ### **II. Distinctions the Theory Must Not Collapse**  
  *(Critical conceptual boundaries)*  

  1. **Difference-making vs. Participation**  
     *Why:* I can *participate* in a harm (e.g., buying sweatshop goods) without *changing the outcome* (if others buy anyway). Conflating these inflates guilt or excuses passivity.  

  2. **Causal Contribution vs. Moral Responsibility**  
     *Why:* Causality is descriptive (did my act raise the probability of harm?); responsibility is normative (should I be blamed?). A theory must not derive "ought" directly from "did."  

  3. **Doing vs. Allowing**  
     *Why:* Flying *causes* emissions; *not* donating to famine relief *allows* deaths. Collapsing this distinction risks demanding infinite positive duties or excusing active harm.  

  4. **Group vs. Member Blameworthiness**  
     *Why:* "Voters elected a warmonger" doesn’t entail *each* voter intended war. The theory must assign responsibility to individuals without dissolving them into the group.  

  5. **Ex Post Facto vs. Ex Ante Perspectives**  
     *Why:* After the harm, we see my contribution was trivial; *before*, it carried risk. A theory must guide action under uncertainty, not just judge retrospectively.  

  6. **Harm Size vs. Complaint Strength**  
     *Why:* A genocide participant isn’t 0.001% blameworthy; a voter enabling minor corruption isn’t fully culpable. The complaint against me must reflect both harm scale and my role.  

  ---

  ### **III. Results the Theory Cannot Contradict**  
  *(Empirical and pragmatic constraints)*  

  1. **Marginal acts often change nothing**  
     *Consideration:* Physics/economics: one less car trip rarely affects pollution levels. Denying this ignores how systems work.  

  2. **Small contributions aggregate**  
     *Consideration:* 8 billion trivial acts cause catastrophe. Ignoring this excuses inaction.  

  3. **Thresholds/non-linearities are real**  
     *Consideration:* Harm isn’t always linear (e.g., species extinction, climate tipping points). A theory must handle discontinuities.  

  4. **Others’ choices are unknowable**  
     *Consideration:* I can’t poll strangers before voting or flying. Demands must work without perfect information.  

  5. **Demands must be livable without coordination**  
     *Consideration:* Ordinary people can’t orchestrate mass boycotts daily. An ideal requiring constant coordination is useless.  

  ---

  ### **IV. Tensions, Heavy Lifters, and Counterfeit Requirements**  

  - **Jointly Unsatisfiable?**  
    The triad of **marginal acts change nothing** + **contributions aggregate** + **unknowable others** creates severe tension. Most theories sacrifice one.  

  - **Heaviest-Lifting Requirement:**  
    **Universal Reasoning Case** (Case 4). It kills theories that only work if others act differently (e.g., "if everyone did this, it’d be bad—but they won’t").  

  - **Likely Counterfeit "Requirements":**  
    - *"I must always make a difference"* (contradicts Cases 1 & 2).  
    - *"Groups are mere aggregates"* (collapses Distinction 4).  
    *Your list avoids these—no clear counterfeit in your specs.*  

  - **What Plausible Theories Quietly Drop:**  
    **Livable demands without coordination** (Requirement III.5). Kantians/virtue theorists ignore systemic absorption; consequentialists hand-wave coordination.  

  ---

  ### **V. Scorecard of Major Theories**  
  *(How they fare against your requirements)*  

  | **Theory**               | **Fails Cases**       | **Collapses Distinctions** | **Drops Requirement**      |  
  |--------------------------|------------------------|----------------------------|----------------------------|  
  | **Act-by-act Consequentialism** | 3 (markets), 5 (asymmetry) | 1 (participation≠difference) | III.1 (marginal acts)      |  
  | **"What If Everyone?"**  | 3 (markets), 4 (universal) | 2 (causality→responsibility) | III.4 (unknowable others)  |  
  | **Participation in Wrong** | 1 (thresholds), 2 (uncertainty) | 1 (participation≠difference) | III.1 (marginal acts)      |  
  | **Group Agency**         | 5 (asymmetry)          | 4 (group vs. member)       | III.5 (no coordination)    |  
  | **Expressive/Virtue**    | 1 (thresholds), 3 (markets) | 1 (participation≠difference) | I.2 (epistemic uncertainty)|  

  ---

  ### **VI. Where My Reasoning Might Fail**  
  - **Weakest Point:** Requirement **III.3 (thresholds/non-linearities)**. If most collective harms are *linear* (debatable for climate/carbon budgets), it overstates the need for threshold-sensitivity.  
  - **What Could Change the List:** Evidence that **market-mediated harms** (Case 3) are empirically negligible (e.g., studies showing individual abstinence *does* reduce production). This would relax the pressure on III.5.  

  ---

  ### **Conclusion**  
  Your requirements reveal why this problem resists solution: they demand a theory that simultaneously respects **systemic complexity** (thresholds, markets), **epistemic limits** (uncertainty, unknowable others), and **moral agency** (universalizability, asymmetry). No mainstream theory satisfies all, but the gaps highlight what matters to *you*:  
  - If avoiding complicity matters more than impact, **participation-based** theories survive best (but fail thresholds).  
  - If making a difference is essential, **threshold-adjusted consequentialism** fits (but struggles with markets).  
  - If integrity under ignorance is paramount, **virtue ethics** endures (but dodges aggregation).  

  The unresolved core tension: **You seek moral significance for individual acts in systems where they lack causal power.** That may require rethinking "significance" beyond difference-making—perhaps toward *complicity*, *solidarity*, or *symbolic protest*. But that’s theory-building, not specification. This list is your tool to dissect candidates.
