prompt: |-
  My mate in our ethics reading group has a move I can never quite answer, and I want to know whether it actually works. Whenever someone raises the worry that consequentialism asks far too much of you, that it wants you to keep giving until there's basically nothing left of your own life, your projects, your friendships, the things you'd have done anyway, he says: look at parents. Parents give up sleep, money, careers, whole decades, and nobody says parenthood is a broken ideal or that it's too demanding to be a standard anyone could actually live by. We say that's what love costs and the person who does it is admirable. So the fact that morality asks something similar isn't an argument against morality at all, it just tells you how much the world needs. Then he tightens it: impartial morality only asks you to treat everyone's kid the way you already treat your own, and we've all watched people meet that without turning into wrecks.

  How far does it hold? Start with the mapping, and spell it out in plain prose — I know a table is the obvious way to do it but I'd rather have it wrote out as sentences, no headings, no bullets, no bold, nothing like that — so who or what plays the parent, the child, the love, the sacrifice, the years, the other parent. Then where it comes apart. What I really want is what the parenthood case quietly brings with it that the other one doesn't: whether the demand ever ends, whether it's shared with anyone, whether the motive that makes it bearable is one the moral theory can actually endorse or only put up with as a means, whether the sacrifice is partly for something that's also part of the parent's own good. And nobody thinks a parent who keeps something back for herself is a monster, so what does that tell us.

  Then tell me straight whether the conclusion he's after survives all that — that the demandingness worry just evaporates once you see how much people can bear when the cause is good — or whether the analogy was carrying it the whole time. And if this is the wrong vehicle, what would a better analogy be for the thing he's actually trying to say. One more thing he waves away as well: whether it matters that the demand lands on each of us separately rather than on all of us together, and whether a demand that's unbounded at every single moment is different in kind from one that's merely large.
reasoning: |-
  Okay, the user is part of an ethics reading group and their friend has this argument about consequentialism being demanding. The friend uses the analogy of parenthood to argue that if parents can make huge sacrifices for their children, why can't we do the same for everyone impartially? The user wants to dissect this analogy and see where it holds and where it falls apart.

  First, I need to map the parenthood analogy to consequentialism. The parent represents the moral agent in consequentialism. The child corresponds to all people in need, especially strangers. Parental love is like the moral commitment to maximize overall well-being. Sacrifices parents make (sleep, money, etc.) are akin to the resources moral agents must give up. The years of raising a child parallel the lifelong commitment consequentialism requires. Other parents sharing the responsibility would be like other moral agents also contributing, but in reality, they often don't, which is a key difference.

  Now, where does the analogy break? The user mentioned several points. First, the demand in parenthood eventually ends when the child grows up, but consequentialism's demand is continuous and never stops. Second, parents usually share responsibilities with partners or family, but in morality, others might not contribute equally, leading to unfair burdens. Third, parental sacrifices are intertwined with the parent's own good; raising a child brings personal joy and fulfillment. In contrast, helping strangers might not provide the same intrinsic rewards, making it feel more like a burden.

  Motivation is another big difference. Parents are driven by love, which makes sacrifices feel meaningful. Consequentialism often relies on duty or guilt, which isn't as sustainable. Also, society accepts that parents keep some resources for themselves, but consequentialism might demand near-total giving, which could lead to burnout.

  The user also brings up whether the demand is shared or individual. In parenthood, responsibilities are shared, but morality often falls on individuals without collective support. Plus, the unbounded nature of consequentialism's demands—every moment presents a new opportunity to help—creates relentless pressure, unlike parenting's structured phases.

  Assessing the friend's conclusion: does the demandingness worry evaporate? Not really. The analogy carries the argument because parenthood includes elements like reciprocity, shared burdens, and personal fulfillment that impartial morality lacks. These hidden supports make parental sacrifices bearable, but they're absent in consequentialism.

  A better analogy might be something like emergency responders or disaster relief workers. They help strangers impartially, but even then, their duties are time-bound and they work in teams. Still, it's not perfect because their roles are structured and they have downtime.

  The user also wants to know if the friend waves away the issue of individual versus collective responsibility. In parenthood, if others don't help, the child still suffers, similar to how in morality, if others don't contribute, the burden increases on those who do. Consequentialism might require systemic solutions rather than just individual sacrifice.

  So, the parenthood analogy doesn't fully hold. The key takeaway is that the demandingness objection isn't resolved by the analogy because the conditions that make parenting sustainable aren't present in impartial morality. The user needs to point out these hidden supports and question whether consequentialism can incorporate similar structures to mitigate its demands.
answer: |-
  Here's a plain prose analysis of your mate's parenthood analogy against the demandingness objection to consequentialism, breaking down the mapping, where it comes apart, the hidden elements, and the conclusion:

  The analogy maps consequentialist morality onto parenthood. The "parent" is the moral agent acting under consequentialism. The "child" represents anyone in need, particularly distant strangers whose well-being the agent can affect. The "love" parents feel for their child corresponds to the moral commitment consequentialism demands towards maximizing overall good impartially. The "sacrifice" parents make (sleep, money, career prospects, time) parallels the resources – money, time, effort, personal projects – the consequentialist agent must sacrifice to help others. The "years" of dedicated parenting represent the lifelong, continuous demand consequentialism places on the agent. The "other parent" signifies the ideal scenario where the burden of helping others is shared equitably among all capable moral agents, just as parenting duties are ideally shared between partners.

  The analogy comes apart in several crucial ways. First, the *demand duration* differs fundamentally. Parenting, while long, has a foreseeable endpoint or significant reduction in intensity; the child grows up and becomes independent. Consequentialism's demand is perpetual and unbounded; suffering and need exist continuously, offering no natural endpoint or sustained reduction in obligation. Second, *burden sharing* is assumed but often absent. Parents usually share duties with a partner, family, or society (schools, healthcare). In the real world of impartial morality, many potential moral agents shirk their duties, leaving the conscientious few bearing a vastly disproportionate share – unlike a parent whose partner reliably contributes. Third, the *nature of the good sought* differs. A parent's sacrifice directly creates a profound, reciprocal relationship integral to their *own* flourishing; the child's good is constitutively part of the parent's good. Sacrificing for distant strangers rarely creates such a deep, reciprocal bond enriching the agent's life; it feels more like pure loss for an abstract good. Fourth, *motivation and psychological sustainability* diverge. Parental love is a powerful, intrinsic motivator making sacrifice feel meaningful and often joyful, or at least bearable within a loving context. Consequentialism typically relies on abstract duty or guilt, which are less psychologically sustainable motivators for extreme, lifelong sacrifice. Fifth, *reasonable limits* are socially accepted in parenting. We don't condemn parents for not selling their last kidney or spending *every* waking moment solely on the child; keeping resources for one's own health, relationships, and projects is seen as necessary and reasonable. Consequentialism, pushed to its logical extreme, struggles to justify such limits without compromising its impartial maximizing principle, potentially demanding near-total self-effacement.

  The parenthood case quietly brings crucial supports that impartial morality lacks: **1)** The sacrifice builds a unique, reciprocated relationship central to the *agent's own good* (fulfillment, love, legacy). **2)** The demand has foreseeable phases and ultimately diminishes. **3)** The burden is typically shared with specific, reliable others. **4)** The core motivator (love) is endorsed and celebrated, not merely tolerated. **5)** Society accepts that reserving resources for the parent's own life isn't monstrous but necessary for sustainability and the child's own good. These supports make the immense sacrifice bearable and meaningful in a way the abstract, perpetual, potentially solitary, and non-reciprocal demands of extreme consequentialism do not.

  Regarding the specific points your mate waves away: The *individual vs. collective* demand matters immensely. A demand manageable when shared equitably (like parenting with a partner) becomes crushing and unfair when it falls disproportionately on the conscientious few, as it often does in the real world. An *unbounded demand at every moment* ("Couldn't you always do more *right now*?") is qualitatively different from a "merely large" demand with structure, phases, and downtime. The former creates relentless pressure, decision fatigue, and prevents the psychological recovery and personal life necessary for long-term sustainability, unlike parenting, which usually allows for pockets of respite and personal time.

  **Does his conclusion survive?** No, it does not fully survive. The demandingness worry does **not** simply evaporate. The analogy carries the argument precisely because it smuggles in the very supports (foreseeable end, shared burden, reciprocal relationship, integrated good, intrinsic motivation, accepted limits) that make parental sacrifice bearable and admirable – supports largely absent in the stark, impartial, maximizing demand of consequentialism. While the analogy powerfully shows humans *can* bear immense burdens for profound goods, it fails to show that the *specific, structureless, unshared, perpetual demand* of consequentialism is similarly sustainable or reasonable. The fact that people bear great burdens for *their own children* doesn't prove they can or should bear comparable burdens *for everyone, impartially, forever, without reliable sharing or personal fulfillment*.

  **A better analogy?** A more fitting analogy for what he's *trying* to say (that demandingness alone isn't fatal if the cause is great) might be a dedicated **emergency responder or disaster relief worker in a perpetual crisis zone**. They help strangers impartially, make huge sacrifices (time, safety, comfort), and the need is vast. This captures impartiality and scale better than parenthood. However, even this analogy falters: such roles usually involve shifts, teams (shared burden), training for resilience, societal support, and crucially, they are *chosen vocations* with defined boundaries, not an inescapable demand on every waking moment of every person's life. It highlights the need for structure, support, and limits even within immense demands, which extreme consequentialism struggles to provide. The core insight remains: the demandingness objection isn't *refuted* by the parenthood analogy; it highlights the *conditions* needed to make extreme demands bearable, conditions consequentialism often lacks.
