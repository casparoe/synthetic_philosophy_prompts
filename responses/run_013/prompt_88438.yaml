  First, I need to validate their feelings. The user isn't just being dramatic; this is a real psychological issue. The uncertainty creates a pervasive sense of being watched. The Panopticon concept comes to mind here—knowing you could be watched at any time leads to self-regulation. That's why the user censors themselves even without actual oversight.

