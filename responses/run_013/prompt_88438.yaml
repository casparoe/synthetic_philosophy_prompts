  ok this is kinda dumb but its been bugging me for like three weeks and i need an outside opinion. my parents can go through my phone whenever they want. theres no rule about when, they just decide, depends on their mood i guess. thing is they havent actually looked at it in like two months. so technically i do whatever i want on there and nothing happens. my friend says im being dramatic, that im obviously free since nobody is actually stopping me from doing anything, and that having no rule is even better for me than a strict one would be. but it doesnt feel like that at all. it feels like im always kind of waiting, and the whole thing depends on what they happen to feel like that day. my mom said they dont even need to check it cause i already know they could, and weirdly that made it worse. and sometimes i catch myself not even wanting to post stuff they wouldnt like, and i genuinely cant tell if thats me or them. so is my friend right and im just being a baby? whats the actual thing im feeling here, cause saying im not free doesnt seem to cover it.
