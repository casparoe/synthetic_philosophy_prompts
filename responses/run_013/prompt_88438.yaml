answer: |-
  You're absolutely **not** being dramatic or a "baby." What you're describing is a very real and psychologically significant form of control, and your feelings are completely valid. Your friend is missing the nuance entirely.

  Here's a breakdown of what's happening and why it feels so wrong:

  1.  **The Illusion of Freedom vs. The Reality of Constant Surveillance:** Technically, you *can* do things. But true freedom isn't just the *ability* to act; it's the **absence of fear of arbitrary consequences** when you do. You live under the constant, unspoken threat of inspection. This isn't freedom; it's **conditional permission**. You're like an employee whose boss *could* randomly check their computer history at any moment – it creates a pervasive sense of being watched, even when you're not.

  2.  **The Power of Uncertainty:** The lack of rules ("depends on their mood") is actually **worse** than strict rules in this context. Strict rules define boundaries. Uncertainty is psychologically torturous because:
      *   **You can never relax:** There's no safe zone. Two months of no checks doesn't mean tomorrow is safe. You're always braced for it.
      *   **You internalize the control:** As you said, you start censoring yourself *preemptively*. You become your own jailer because you're constantly trying to predict and avoid potential disapproval that could come at any unknown time. This blurs the line between your own choices and the choices made out of fear ("is that me or them?").
      *   **It feels arbitrary and unfair:** The "mood" factor makes it feel like the consequences are disconnected from your actual actions and entirely dependent on their whims. This undermines any sense of justice or predictability.

  3.  **Your Mom's Comment Reveals the Mechanism:** "We don't even need to check it cause you already know they could." This is the **core of the issue.** They've established a system of **psychological control through potential surveillance.** Their goal isn't necessarily to see everything you do *right now*; it's to make you *always* act as if they *might*. They've outsourced the enforcement to your own anxiety. This is incredibly effective for control but deeply damaging to your sense of autonomy and trust. Her comment *made it worse* because it explicitly confirmed that this is the *intended* effect.

  4.  **What You're Feeling:**
      *   **Psychological Entrapment/Lack of Autonomy:** You feel restricted not by bars, but by an invisible leash that could yank you back at any unpredictable moment.
      *   **Constant Low-Grade Anxiety/Vigilance:** That feeling of "always kind of waiting" is hypervigilance. Your nervous system is partially activated, anticipating a potential threat (the phone check).
      *   **Loss of Authenticity:** The inability to tell if your choices (like not posting something) are genuinely yours or driven by fear of discovery erodes your sense of self. You're losing trust in your own motivations.
      *   **Powerlessness and Resentment:** The arbitrariness ("depends on their mood") makes you feel like your privacy and personal space exist solely at their discretion, fostering resentment.
      *   **Burden of Responsibility:** You feel responsible for managing *their potential reactions* constantly, which is an unfair emotional load.

  **Why your friend is wrong:** Your friend is equating "freedom" solely with the *absence of immediate physical restraint*. They're ignoring the powerful impact of **anticipatory fear, uncertainty, and internalized control.** True freedom includes feeling safe in your personal space and confident that your choices won't be arbitrarily punished based on someone else's unpredictable mood.

  **The "Actual Thing" You're Feeling:** This is often described as living under a **Panopticon** (a concept from philosophy/sociology describing a prison where inmates feel constantly watched, leading them to police themselves). More commonly, it's recognized as:

  *   **Coercive Control:** A pattern of behavior that strips away autonomy and independence through intimidation, humiliation, isolation, and surveillance (or the threat of it).
  *   **Chronic Anxiety & Hypervigilance:** Stemming from the unpredictable threat.
  *   **Erosion of Personal Autonomy & Authenticity:** The self-censorship and confusion about your own motives.

  **What Can You Do?**

  1.  **Acknowledge Your Feelings are Valid:** This is the most important step. Stop doubting yourself. Your reaction is a normal human response to this situation.
  2.  **Consider Talking to Your Parents (Carefully):** This is risky and depends on your relationship. Frame it around your feelings and need for predictability, *not* demanding unlimited freedom. Example: "I understand you want to keep me safe and have the right to check my phone. However, the fact that it can happen at any time without warning makes me feel constantly anxious and like I can't truly relax or feel like my phone is my personal space. Could we talk about maybe having some clearer guidelines, like you'll only check if there's a specific concern, or perhaps a regular time if you feel you need to? Knowing *when* or *why* it might happen would help me feel less on edge all the time."
  3.  **Find Safe Outlets:** If talking isn't feasible or safe, find other ways to express yourself authentically – journaling (physically, not digitally!), trusted friends IRL, creative pursuits, etc. Build pockets of autonomy where you can.
  4.  **Focus on Your Internal World:** Remind yourself that *your thoughts and feelings* are always your own, even if your actions feel constrained. Work on strengthening your internal sense of self and values.
  5.  **Talk to a Trusted Adult:** A school counselor, therapist, relative, or teacher you trust. They can offer support, perspective, and potentially help mediate a conversation with your parents if needed.

  This isn't about being sneaky or rebelling. It's about the fundamental human need for **psychological safety, predictability, and a sense of personal space.** Your parents' method, while perhaps well-intentioned, is creating a harmful environment of anxiety and control. You are not overreacting; you are accurately perceiving the psychological reality of your situation.
