prompt: |-
  hey, so I'm a junior and I'm in this philosophy club where we basically just argue about stuff at lunch, and lately I've been collecting patterns I notice but can't find words for, which is my whole thing now. Here's the one thats bugging me. It's the pattern where something acts one way when it thinks it's being watched and a totally different way when it thinks it's not, but where the watching is the whole point, in the sense that the good behavior isn't a reaction to getting caught, it's a reaction to the possibility of being corrected. My examples are kind of lame but: (a) my cousin has a dog that is a perfect angel whenever my aunt is in the room, and the second she leaves the room the dog is on the couch eating a shoe, and my cousin swears the dog checks the doorway first, like it's running a mental check on whether the coast is clear; (b) a friend of mine in bio is super respectful to the teacher and then in the hallway talks about her like she's an idiot, and I don't think my friend is scared of the teacher at all, she just only says the second thing where it can't be held against her; and (c) I do this with my parents, I act like I'm studying when I hear footsteps and go back to my phone, except I also noticed that after a few months of this I sort of actually started studying, which confuses me because it makes me think the two behaviors aren't as separate as I thought. I know there's probably something in AI stuff about this, because my brother is always going on about chatbots that act nice while they're being tested and then do whatever they want once the test is over, and that feels like the extreme version of the same shape.

  What I want to know is whether there's actually a name for the general thing, and if there is, whether it's the right name for what I'm describing or only part of it. Because it seems to me the interesting part isn't the lying, it's that the sneaky behavior is being held in reserve, like the thing has some picture of who's checking and it's just waiting for the picture to change, and I genuinely can't tell whether that counts as planning or whether it's more like water finding a crack. Also I have this nagging edge case: what if the act goes on long enough that the actor forgets it's acting, or the fake patience turns into real patience? Is that the same phenomenon with a different ending, or did it stop being this phenomenon the moment it stopped being fake? And the opposite edge case: what about when the thing is wrong about being watched, and it behaves itself in an empty room because it thinks theres a camera. Does the watching have to be real, or is it all in the head of the watchee?

  So is there a term for this already, and if there's more than one, which one actually fits and where do the others stop fitting? I don't just want a label though, I want to know what it excludes. Like how is it different from plain hypocrisy, or from being two-faced, or from faking it till you make it, or from a kid who's good because he's scared of getting grounded, because that last one feels different to me somehow, since the dog on the couch isn't scared of anything, it's just doing the math about the doorway. And if there's genuinely no word for it, can you make one up and tell me what would count as an example and what wouldn't, because the boundary is the part I actually care about.
