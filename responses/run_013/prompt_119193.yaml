  Here's a joke built to your specs:

  **Setup:**  
  A notoriously haunted hotel room has never had a ghost sighting while occupied. Paranormal investigators confirm intense spectral energy when empty, and guests *always* report unexplained events *after* their stay – cold spots, voices, objects moved. Yet, the moment *any* guest checks in at midnight (the peak trigger time), absolutely nothing happens until they leave. Desperate, the owner hires a renowned skeptic known for debunking hauntings to stay the night. At midnight, predictably... silence. The skeptic sleeps soundly, wakes up, and declares the room perfectly ordinary. As they're checking out the next morning, the front desk clerk sighs: "Well, *of course* nothing happened while *you* were in there."

  **Punchline:**  
  "The ghosts were too scared of *you* to come out."

  **Explanation:**  
  Mask—the skeptic's presence blocks the manifestation without affecting the disposition itself, unlike a fink (which would remove the disposition at the trigger) or a mimic (where the 'ghosts' reported later wouldn't be genuine manifestations).

  **Why it works for the audience:**
  1.  **Ambiguity:** Initial setup suggests possible finks (disposition stripped at midnight?), mimics (are the "ghosts" just faulty reporting?), or a disposition that simply *can't* manifest. The clerk's sigh hints at a blocker.
  2.  **Structure-Driven Punchline:** The laugh comes from realizing the *ghosts* have the disposition (fear) triggered by the skeptic, and the skeptic's presence masks the room's disposition to manifest them.
  3.  **Jargon-Free Mechanics:** The concepts are embedded in the *situation* (blocking presence, disposition intact, genuine manifestation potential).
  4.  **Fresh Example:** Avoids fragility/sorcerers completely, using a relatable "haunted room" trope subverted by the dispositional machinery.
  5.  **Neat Resolution:** The explanation sentence cleanly states the category and eliminates the rivals based on the story's details (disposition confirmed when empty/after, blocker present during trigger).
