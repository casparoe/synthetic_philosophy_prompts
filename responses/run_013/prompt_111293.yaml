prompt: |-
  So I was listening to a podcast on ethics — one of those general "intro to moral philosophy" series, not a Kant specialist — and the host gave his version of Kant on lying. Here's roughly what he said: Kant thinks lying is always wrong, no exceptions, because the categorical imperative says you can only act on a maxim you could will as a universal law, and a maxim of lying can't be universalized, since if everybody lied nobody would believe anybody and lying would stop working. So Kant bites the bullet in the murderer-at-the-door case: when the murderer asks where your friend is hiding, you have to tell him the truth, and if your friend then dies, that's on the murderer, not on you — you're responsible for your maxim, not for what happens next. Kant just thinks consequences are irrelevant to moral duty. Which is why most people treat the whole thing as a cautionary tale about rigorism making a theory say monstrous things, and why even sympathetic deontologists like Ross quietly dropped the absolute prohibition.

  I know Kant wrote a whole late piece about this case and that the argument in it isn't the one people usually quote — I have a vague sense it's about a duty owed to humanity in general rather than to the murderer, and that there's something weird in there about being answerable for what follows from the lie. But I can't reconstruct any of it, and I don't know how much of the above is the host being sloppy versus me misremembering. I'm inclined to think he's basically right about the bottom line even if the reasoning is shaky, but I'd rather not repeat this at a seminar and get taken apart.

  Can you audit it for me? Give me a numbered list of exactly five items, each one a sentence or two, no intro and no closing paragraph — start with what survives, then flag the specific things a Kant scholar would wince at and what they'd say instead, and use the last item or two to tell me whether the host's conclusion (cautionary tale, rigorism, sympathetic deontologists defecting) actually follows from the parts that are true, or whether fixing the summary changes the verdict.
