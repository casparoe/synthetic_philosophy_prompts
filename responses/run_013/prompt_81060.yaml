prompt: |-
  For the past two terms a friend and I have been re-fighting the same argument about mental causation, and our reading group has finally asked us to produce a document instead of another round of talking past each other. He is what I would call a closure-first exclusionist: he treats the causal closure of physics as a fixed constraint, accepts that mental properties supervene on physical ones, and concludes that the mental properties themselves do no causal work — whatever makes a difference to behaviour is the physical realizer, and the mental is at best a shadow that travels alongside it. I am a difference-making interventionist: I think a causal claim is a claim about what happens under an intervention on a variable, that mental properties are perfectly good variables, and that the exclusion argument looks compelling mainly because it slides between two readings of closure. What I want from you is the joint statement we should both be able to put our names to: first the claims we already share about the machinery (supervenience, closure, that neither of us is an eliminativist, that the exclusion argument is valid as a piece of reasoning and the fight is over its soundness, the difference between causal relevance and causal efficacy, the status of multiple realizability); then the exact points where we part, each stated so that the person who holds it would sign off on how it is put rather than on a strawman; then the cruxes, the sub-questions such that an answer would actually move one of us.

  Two things I want the document to handle properly. The first is a distinction I have come to think is doing a lot of hidden work: whether the exclusionist's conclusion is supposed to be impotence (mental properties do nothing at all) or redundancy (they do something, but it is always already done by the realizer, so any mental cause is a pre-empted one). Those come apart, and I suspect my friend has been running them together for months. The second is that for each crux I want the case or argument we would both agree bears on it, with our predictions recorded in advance — in particular, whether there is a case on the physical side where a causal claim is itself only true relative to a chosen set of variables, since if there is, my relativism is not a special concession I am making about the mental. Say also, for each crux, what each of us would count as evidence against his own view and not merely against the other's. If you think part of our fight is verbal — that we are using cause or realizer in two senses and could stipulate our way out — say which part and why, and what would be lost by stipulating.

  Lay it out as a numbered section of agreed claims followed by a disagreements table with one row per crux. And please do not just lay the two sides out even-handedly and leave me to choose: commit to a verdict on the central crux, tell me which of us you think has the better of it and why, and say where you would expect the debate to end up if it were pursued honestly rather than rhetorically.
reasoning: |-
  We are generating a joint statement for two parties: an exclusionist (Friend) and an interventionist (User). The goal is to have a document that both can sign, laying out agreements, disagreements, and cruxes.

  Structure:
  1. Agreed Claims: Numbered list of shared commitments.
  2. Disagreements Table: One row per crux, with columns for:
     - Crux (the specific point of disagreement)
     - Exclusionist (Friend) View
     - Interventionist (User) View
     - Evidence Bearing on the Crux (and how it would be tested)
     - What would count as evidence against each view?
     - Whether the dispute is verbal and what would be lost by stipulating.

  Then, a verdict on the central crux and where the debate might end.

  Agreed Claims:
  1. Supervenience: Mental properties supervene on physical properties; there cannot be a mental difference without a physical difference.
  2. Causal Closure of Physics (CCP): Every physical event has a sufficient physical cause (at the same time, if we are considering non-relativistic physics) and there are no non-physical causes for physical events.
  3. Non-Eliminativism: Mental properties are real and not reducible to eliminative materialist terms (i.e., we are not eliminativists about the mental).
  4. Validity of Exclusion Argument: The exclusion argument, as typically formulated, is logically valid. The dispute is over the soundness of its premises.
  5. Distinction between Causal Relevance and Causal Efficacy: 
     - Causal Relevance: A property is causally relevant if it makes a difference to the effect in some way (e.g., in a counterfactual or interventionist sense).
     - Causal Efficacy: A property is causally efficacious if it is the property that does the causing (the actual producing of the effect).
     We agree that the exclusion argument targets causal efficacy, but we may disagree on what counts as efficacy.
  6. Multiple Realizability: Mental properties are multiply realizable; the same mental property can be realized by different physical properties in different instances.

  Disagreements:

  We have two main points of contention:

  Crux 1: The interpretation of the Causal Closure of Physics (CCP)
  - Friend (Exclusionist): CCP implies that for every physical effect, there is a sufficient physical cause at the physical level. This physical cause is the only efficacious cause. Any mental cause must either be identical to this physical cause or be preempted by it. Since mental properties are not identical (due to multiple realizability), they are preempted and thus not efficacious.
  - User (Interventionist): CCP is compatible with multiple levels of causation. The closure principle should be read as asserting that every physical effect has a sufficient physical cause, but it does not rule out that there are also mental causes at a higher level. The exclusion argument slides between two readings: 
     (a) Closure as the claim that every physical effect has a physical cause (which is accepted) and 
     (b) Closure as the claim that only physical causes are efficacious (which is not accepted and requires additional argument). 

  Crux 2: The causal status of mental properties (impotence vs. redundancy)
  - Friend (Exclusionist): Mental properties are causally impotent (they do nothing at all) because the physical realizer does all the work. The mental property is a mere shadow. (Or, sometimes, Friend might say they are redundant: they do something, but it is always already done by the realizer, so they are preempted. But the conclusion is the same: they are not efficacious.)
  - User (Interventionist): Mental properties are causally relevant in the interventionist sense: intervening on the mental property (while holding fixed the realization base or not, depending on the context) can show that the mental property makes a difference. They are not redundant because they can be difference-makers in their own right, and they are not preempted because the realizer is not a cause that operates independently (it is the realization of the mental property).

  Crux 3: The role of variables and the relativity of causal claims
  - Friend (Exclusionist): Causal claims must be about the actual efficacious properties. The physical realizer is the actual cause, and any causal claim at the mental level is at best a useful fiction. Causal claims are absolute, not relative to a variable set.
  - User (Interventionist): Causal claims are relative to a set of variables. The same event can be described at different levels, and causal claims at the mental level are legitimate when we are considering interventions at that level. There are clear cases in physics (e.g., thermodynamics vs. statistical mechanics) where higher-level causal claims are true relative to their variable set.

  We also need to address the two specific requests:

  1. Distinction between impotence and redundancy: 
     - Impotence: Mental properties have no causal power whatsoever.
     - Redundancy: Mental properties have causal power but it is always preempted by the physical realizer.

     The exclusionist (Friend) might hold either, but they are distinct. The interventionist (User) denies both.

  2. For each crux, what case or argument bears on it and what would count as evidence against each view.

  Let's set up the table:

  | Crux | Exclusionist (Friend) View | Interventionist (User) View | Evidence Bearing on the Crux | What would count as evidence against Exclusionist? | What would count as evidence against Interventionist? | Verbal Dispute? |
  |------|----------------------------|-----------------------------|------------------------------|--------------------------------------------------|-------------------------------------------------------|-----------------|
  | 1. Interpretation of CCP | CCP entails that only physical properties are causally efficacious. The mental, being non-identical, cannot be efficacious without overdetermination (which is rejected). | CCP is about the physical level and does not preclude higher-level causation. The exclusion argument conflates two readings: (a) every physical effect has a physical cause (agreed) and (b) every cause is physical (denied). | Consider cases of higher-level causation in other sciences (e.g., biological causation). If we can show that a biological property (e.g., being a predator) is a cause of an effect (e.g., prey population decline) even though it is realized by physical properties, then this supports the interventionist view. | Evidence against exclusionist: A case where a higher-level property (e.g., a software property) is manipulated and causes a physical effect, and this cannot be reduced without loss to the physical level. | Evidence against interventionist: A case where a higher-level property is manipulated but the effect does not change when the realization base is fixed, showing that the higher-level property does not add anything. | Partly verbal: The dispute is about what "cause" means. Stipulating a notion of cause (e.g., interventionist) might resolve it, but the exclusionist might insist on a notion of cause that requires efficacy at the fundamental level. |
  | 2. Causal Status: Impotence vs. Redundancy | Mental properties are causally impotent (or at best redundant). They do not do any work because the physical realizer does it. | Mental properties are causally relevant and efficacious in the interventionist sense. They are not redundant because they capture patterns that are not captured at the physical level. | Consider a case of multiple realizability: a mental state M realized by P1 in case 1 and P2 in case 2, and in both cases M causes B. Now, if we intervene to change M (by changing the realizer from P1 to P2) and B still occurs, then M is a difference-maker. If we fix M and change the realizer (from P1 to P2) and B still occurs, then the realizer is not the difference-maker. | Evidence against exclusionist: An experiment where an intervention on the mental property (without changing the realizer, if possible) changes the effect, showing that the mental property is not impotent. | Evidence against interventionist: An experiment where an intervention on the mental property (changing M to M') does not change the effect when the physical realizer is held fixed (if possible), showing that the mental property is not the difference-maker. | Not entirely verbal: The dispute is about whether the mental property has a role that is not preempted. Stipulating might not help because the exclusionist might insist on a notion of preemption that the interventionist rejects. |
  | 3. Relativity of Causal Claims | Causal claims are absolute and must be about the fundamental physical level. Higher-level causal claims are at best derivative and not literally true. | Causal claims are relative to a variable set. The same event can have multiple true causal descriptions at different levels. | Look at physics: e.g., the temperature of a gas (a macroscopic property) causing a pressure change. This is true relative to the thermodynamic variables, even though at the micro level it is the motion of molecules. | Evidence against exclusionist: A case in physics where a higher-level causal claim is indispensable and cannot be reduced without loss of explanatory power. | Evidence against interventionist: A case where a higher-level causal claim is shown to be false when we look at the micro level (e.g., because of confounding factors). | Partly verbal: The dispute is about what it means for a causal claim to be true. Stipulating a relativist framework might resolve it, but the exclusionist might reject relativism. |

  Verdict on the central crux:

  The central crux is Crux 1 (interpretation of CCP) and Crux 3 (relativity of causal claims). I (as the assistant) think the interventionist (User) has the better of the argument because:

  - The exclusionist's strict reading of CCP leads to an implausible reductionism that would eliminate not just mental causation but also causation in all special sciences (biology, economics, etc.). This is a common point in the literature (e.g., Fodor, Woodward).
  - The interventionist account provides a clear and testable account of causal relevance that does not conflict with supervenience and closure. It allows for the causal efficacy of higher-level properties without overdetermination.
  - There are clear examples from other sciences that support the interventionist view. For instance, in computer science, we routinely attribute causal powers to software (a high-level property) without worrying about the hardware realization.

  If the debate were pursued honestly, I would expect the exclusionist to either:
  - Accept the interventionist account and adjust their view to allow for higher-level causation (while maintaining that the physical level is fundamental), or
  - Retreat to a position that accepts the causal relevance of mental properties but denies that this is "real" causation (which would then become a verbal dispute about the meaning of "cause").

  However, the exclusionist might remain unconvinced if they hold that only fundamental physical properties are genuinely causally efficacious. In that case, the debate might end in a stalemate, with the exclusionist accepting that mental properties are causally relevant in a pragmatic sense but denying that they are efficacious in the metaphysical sense.

  Final note: The distinction between impotence and redundancy is important. The exclusionist might argue for redundancy (preemption) rather than impotence. The interventionist can respond that preemption requires two independent causes, but the mental and physical are not independent (due to supervenience). Thus, the physical realizer does not preempt the mental property; it realizes it.

  We'll write the document accordingly.
answer: |-
  ### Joint Statement on Mental Causation: Agreed Claims and Key Disagreements  

  This document outlines areas of agreement and disagreement between two positions on mental causation:  
  - **Exclusionist (Friend)**: Holds that the causal closure of physics (CCP) implies mental properties are causally inert or redundant, as physical realizers do all causal work.  
  - **Interventionist (User)**: Holds that mental properties are causally relevant in an interventionist framework, and CCP does not exclude higher-level causation when causal claims are relativized to variables.  

  We agree on the following core claims:  

  1. **Supervenience**: Mental properties supervene on physical properties; there can be no change in mental properties without a change in physical properties.  
  2. **Causal Closure of Physics (CCP)**: Every physical event has a sufficient physical cause at the time it occurs, and no non-physical causes are needed to explain physical effects.  
  3. **Non-Eliminativism**: Mental properties are real and not illusory. We reject eliminative materialism.  
  4. **Validity of the Exclusion Argument**: The exclusion argument is logically valid. Our dispute concerns its soundness (i.e., whether its premises are true).  
  5. **Causal Relevance vs. Efficacy**:  
     - *Causal relevance*: A property is relevant if it makes a difference to an effect under some conditions (e.g., in counterfactuals).  
     - *Causal efficacy*: A property is efficacious if it is the direct producer of an effect (the "oomph" or mechanism).  
     We agree the exclusion argument targets efficacy, not mere relevance.  
  6. **Multiple Realizability**: Mental properties can be realized by diverse physical properties (e.g., pain in humans, octopuses, or AI).  
  7. **No Widespread Overdetermination**: We reject systematic overdetermination (e.g., mental and physical causes independently producing the same effect).  

  ---

  ### Disagreements: Cruxes and Predictions  
  We disagree on three cruxes. For each, we outline both positions neutrally, evidence bearing on the crux, what would falsify each view, and whether the dispute is verbal.  

  | Crux | Exclusionist View | Interventionist View | Evidence Bearing on the Crux | Falsifying Conditions for Exclusionist | Falsifying Conditions for Interventionist | Verbal Dispute? |  
  |------|-------------------|----------------------|------------------------------|----------------------------------------|------------------------------------------|-----------------|  
  | **1. Interpretation of Causal Closure** | CCP entails that *only* physical properties are causally efficacious. Any apparent mental cause is either identical to a physical cause (ruled out by multiple realizability) or preempted by it. Thus, CCP implies the mental is at best a shadow. | CCP is compatible with higher-level causation. The exclusion argument equivocates between: (a) *Completeness* (every physical effect has a physical cause) and (b) *Exclusivity* (only physical causes are efficacious). (a) is true, but (b) does not follow and is false. Mental causes operate at a distinct level of abstraction. | Cases from physics/special sciences where a higher-level property (e.g., temperature) is a difference-maker despite supervenience. Example: Does intervening on a software variable (e.g., algorithm efficiency) cause changes in hardware behavior, even when physical realizers vary?<br><br>**Predictions**:<br>- Exclusionist: Software interventions will always reduce to hardware causes; no irreducible higher-level efficacy.<br>- Interventionist: Software interventions will show causal patterns not capturable at the hardware level alone. | A physical system where a higher-level variable (e.g., pressure in thermodynamics) is shown to be causally efficacious *without* being reducible to a single physical realizer. Example: An experiment where manipulating pressure (while realizer molecules vary) changes outcomes, but no microphysical variable accounts for this across contexts. | A case where intervening on a higher-level property (e.g., mental state) *fails* to affect an outcome when physical realizers are fixed, but the physical realizer alone suffices. Example: Fixing neural state N1, changing "pain" to "no pain" via abstraction shows no behavioral change. | Partly verbal. "Efficacy" is ambiguous: exclusionist uses it for fundamental production; interventionist for difference-making. Stipulating terms would clarify but lose nuance: exclusionist’s "efficacy" captures mechanistic intuition; interventionist’s captures explanatory utility. |  
  | **2. Causal Status: Impotence vs. Redundancy** | Mental properties are **causally impotent**—they do nothing. Physical realizers exhaust all causal work. The mental is epiphenomenal. (Redundancy is a fallback: if potency is conceded, mental causes are redundant as physical realizers always preempt them.) | Mental properties are **causally potent** in the interventionist sense. They are not impotent (they make a difference) and not redundant (they are not preempted by physical realizers, as realizers depend on the mental property they realize). | Experiments where mental properties are manipulated independently of realizers. Example: Varying beliefs in an AI (same hardware) to see effects on behavior, or lesion studies where neural damage alters mental states predictably.<br><br>**Predictions**:<br>- Exclusionist: Changing mental properties without changing physical realizers is impossible; any behavioral change implies realizer change.<br>- Interventionist: Mental properties can be intervened on (e.g., via cognitive therapy) while holding realizers fixed in type (not token), yielding changes. | A case where a mental property (e.g., intention) causes a new physical effect that *cannot* be traced to its physical realizer. Example: An intention (realized by P1) causes behavior B in a way that P1 alone does not account for across realizers. | A case where a mental property (e.g., pain) is present but altering its physical realizer (e.g., from neural state N1 to N2) prevents its typical effect, showing mental properties lack intrinsic efficacy. Example: Pain without avoidance behavior when realizers are swapped. | No. Impotence vs. redundancy is substantive. Exclusionist sees preemption; interventionist denies it due to supervenience dependency. Stipulating would ignore whether mental properties have distinct causal roles. |  
  | **3. Relativity of Causal Claims** | Causal claims are absolute. Only physical-level causes are real; higher-level claims are useful fictions. If mental properties are causal, this must hold across all variable sets. | Causal claims are relative to a variable set. Mental properties are causes relative to cognitive/behavioral variables, just as pressure is a cause in thermodynamics. CCP does not forbid this relativity. | Cases where the same physical system admits multiple causal descriptions. Example: Is "gene expression" causal in biology despite molecular realizers? Or: Is a traffic jam (a macro-event) a cause of delays, even if reducible to micro-car interactions?<br><br>**Predictions**:<br>- Exclusionist: All true causal claims must map to fundamental physics without loss.<br>- Interventionist: Higher-level causal claims (e.g., economic policies affecting inflation) remain true even with multiple realizers. | A higher-level causal claim in physics (e.g., entropy increase) that is indispensable and irreducible, with no equivalent microphysical description. Example: Thermodynamic laws that predict outcomes statistical mechanics cannot. | A case where relativizing causal claims leads to contradictions (e.g., M causes B relative to one variable set but not another, with no resolution). Example: Mental cause M1 appears efficacious in psychological variables but inert in neuroscientific ones, and no framework reconciles this. | Yes, for "cause." Exclusionist uses a production-based definition; interventionist uses difference-making. Stipulating would resolve if both accept interventionism, but exclusionist loses the intuition that causes must "do the work." |  

  ---

  ### Verdict on the Central Crux  
  **Central Crux**: The interpretation of CCP (Crux 1) and relativity of causation (Crux 3) are pivotal. The exclusionist treats CCP as implying *causal exclusivity*, while the interventionist treats it as *causal completeness* compatible with multilevel causation.  

  **Which view has the better case?**  
  The interventionist view is stronger. It reconciles CCP with mental causation by leveraging variable-relative causal models, which are standard in science (e.g., biology, economics). The exclusionist’s absolutism risks eliminating all special-science causation, not just mental causation—a cost the exclusionist must accept but which seems implausible. For instance, software causes (e.g., a bug crashing a computer) are robustly causal despite hardware realizers; denying this undermines scientific practice. The exclusionist’s conflation of impotence and redundancy also weakens their position: supervenience implies mental properties are not independent competitors for causal influence, so preemption does not apply.  

  **Where the debate should end**:  
  If pursued honestly, the exclusionist should concede that mental properties are causally *relevant* but deny they are *efficacious*. This retreats to a verbal disagreement: the interventionist calls difference-making "efficacy," while the exclusionist reserves it for microphysical production. The core residue is metaphysical: whether causation requires fundamental-level "oomph." Here, empirical cases (e.g., AI or neuroscience experiments) could force refinement. For example, if brain-computer interfaces show mental states (e.g., intentions) causing outcomes untraceable to specific neural tokens, the exclusionist must either accept efficacy or embrace eliminativism. Conversely, if neural realizers always fully account for effects, the interventionist must relativize more strongly.  

  **Final Note**: This document distinguishes impotence (no causal role) from redundancy (causal but preempted). The exclusionist often conflates them, but they are distinct: impotence denies any role; redundancy allows a role but deems it superfluous. Only the interventionist can coherently reject both.
