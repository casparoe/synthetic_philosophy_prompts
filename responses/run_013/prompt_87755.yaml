prompt: |-
  I've been going around in circles on the start of the Cold War, and I want to know whether the question even has a shape. So take one concrete episode: the Marshall Plan — Marshall's offer of aid to Europe including the Soviets, the strings attached (multilateral coordination, opening the books), Molotov walking out of the Paris conference, and the Czechs and Poles taking up the invitation and then pulling out once Moscow leaned on them. Run that episode through the machinery people use when they have to attribute causes formaly, rather than the loose "so-and-so is to blame" version: the but-for test; the NESS/INUS idea that a cause is a necessary element of a sufficient set; the legal notion that a later voluntary act supersedes an earlier cause; and Weber's old method of "objective possibility" and "adequate causation," where you judge a cause by asking what would have happened without it, given what we generally know about how states behave. Take the usual candidates in the historiography — Soviet expansionism and Stalin's security fears, US atomic diplomacy, American economic universalism and the open door, the German question, and the security-dilemma/mutual-misperception line — and for each say which tests it passes, which it fails, and where the test is simply silent. I know the broad outlines of the orthodox/revisionist/post-revisionist fight, so don't spend space recapping it. Then the part I actually care about: does running the episode through these tests make "who started it" a well-formed question, or does the attribution machinery show that the question was always doing moral or rhetorical work rather than causal work — and if so, what work, and what should replace it?

  Give me the analysis, then a table with these columns: candidate cause | but-for verdict | NESS verdict | superseded? | Weberian adequate? | what the framework can't see about it. Finish with a short JSON verdict: {"well_formed": ..., "strongest_candidate_under_these_tests": ..., "the_real_disagreement": ..., "what_should_replace_the_question": ...}.
