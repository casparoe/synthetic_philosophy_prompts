  I'm a first-year PhD student with a semester to write a 7,000-word paper that I hope becomes a dissertation chapter, and I want to work on whether genuine moral dilemmas are possible. I'm definately not trying to just rehash the usual debate about conflicting obligations; my half-formed idea is that the discussion gets muddled because people run together three different things: a normative system containing inconsistent requirements, an agent being all-things-considered required to do each of two incompatible actions, and an agent being required to do one or the other of two actions but not either one specifically. I suspect that once you separate those, some alleged dilemmas turn out to be mere conflicts of reasons or cases of disjunctive obligation, while others get more interesting, especially ones where the agent is required to choose but no particular choice is required. I also want to bring in a formal angle: is there a deontic logic that can represent the third case without collapsing it into the first, and does the answer depend on whether ought distributes over disjunction, or on whether we need something non-classical like a paraconsistent or non-monotonic consequence relation? Can you turn this into a short research proposal? I need a precise statement of the question, an explanation of why the standard positions leave it open, a description of what I'd actually do month by month for a semester, the possible conclusions and what considerations would decide between them, and an honest assessment of what would count as the project failing or being too big for the time. Don't bother with citations or a reading list, I'll add those. And please make the case for why this matters beyond the puzzle itself, say for how we think about responsibility, regret, and what institutions should do when they put people in impossible positions.

  One more thing: if you think the disjunctive-obligation case is a dead end, or that the logic angle is too big for a semester, say so in the proposal and suggest the nearest tractable version of the project instead. I'd rather have a realistic semester-sized proposal than an ambitious one that can't be done.
