  Next, sequencing the cases. The user wants the blackmail case to highlight the structural similarity but opposite intuitions. Starting with mugging makes sense because it's less emotionally charged. After discussing the mugging, introduce blackmail, pointing out the identical setup. Let participants notice the difference in their reactions. The emotional response to extortion versus the abstract mugging reveals the conflict between causal and evidential reasoning.

