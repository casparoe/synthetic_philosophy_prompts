answer: |-
  Here’s a focused, battle-tested plan for your session. Prioritizes *feeling* the dilemma over lecturing, uses your brain-scan tweak effectively, and forces the blackmail contrast to land hard. American English throughout.

  ---

  ### **1. Order of Operations (Total: 50 min)**
  *(Goal: Build the paradox step-by-step; no premature solutions)*
  *   **(0-5 min) INTRO FRAMING:** "Today we dissect a decision puzzle where *what seems rational* clashes with *what feels rational*. We'll use 2 cases. Your job: spot where your gut rebels and why." *(Sets expectation: conflict is the point)*
  *   **(5-15 min) MUNDANE MUGGING (Your Brain-Scan Version):**
      *   *Setup:* "Researcher scans your brain 1 week ago, perfectly records whether you’d pay $100 if asked later. Today: Coin flipped. **Heads?** Researcher asks you for $100. **Tails?** No ask, BUT you get $10,000 *only if* the scan predicted you’d pay. **Coin landed Heads. Researcher asks: Pay $100?**"
      *   *Whiteboard:* Draw timeline (Scan -> Coin Flip -> Ask/Payoff). Label decision point: "YOU NOW: PAY $100?"
      *   *Crucial Q:* **"What do you do? Pay or refuse? *Why?*"** *(Get initial votes/reasons. Force "why" – exposes starting intuitions)*
  *   **(15-20 min) FORCE THE "PAST CAN'T CHANGE" OBJECTION:** Someone *will* say it. **Pounce:** "Absolutely! Paying *doesn't* change the scan result. So... **why might paying *still* be the rational choice?** Think about the *Tails* branch." *(Key: Link paying to the $10,000 in the *other* branch via predictor reliability)*
  *   **(20-30 min) INTRODUCE PREDICTOR RELIABILITY (Briefly!):**
      *   *"But what if the scan is only 95% accurate? 80%?"* Let them debate.
      *   *Whiteboard:* Expected Value (EV) quick calc. Assume $0 if refuse/scan wrong.  
          `EV(Pay) = [Prob(Scan Right) * (-$100 + ?)] + [Prob(Scan Wrong) * (-$100)]`  
          `EV(Refuse) = [Prob(Scan Right) * ($0)] + [Prob(Scan Wrong) * ($0? $10k?)]`  
          **Point:** *If* the predictor links branches (Scan Right in Heads correlates with Scan Right in Tails), EV(Pay) dominates *even with imperfect prediction* if the Tails reward is large. *(Spend MAX 5 min here. Goal: Show dilemma isn't about perfection. Say: "Assume high reliability for today.")*
  *   **(30-40 min) SWITCH TO BLACKMAIL CASE:**
      *   *Setup:* "Same structure. Letter: 'We scanned your brain/flipped coin last week. **Heads?** We blackmail you now for $100. **Tails?** We send you $10,000 *only if* the scan predicted you'd pay if blackmailed. **Coin landed Heads. Pay $100 or we ruin you.**'"
      *   *Crucial Q:* **"Same logical structure. Do you pay? Is it the *same* decision as the mugging? Why/why not?"** *(DO NOT say "it's the same". Let them feel the dissonance.)*
  *   **(40-50 min) SYNTHESIS & CONFLICT:**
      *   *Whiteboard:* Side-by-side columns (Mugging vs. Blackmail). List reasons for paying/refusing in each.
      *   *Highlight:* "Mugging often feels like 'Pay to get the $10k in the other branch'. Blackmail feels like 'Rewarding evil extortion'. **But the predictor links the branches identically.** So what's the *actual* difference? Is it emotional? Moral? Logical?"
      *   *Lead to Crux:* "Is your decision based **only** on the *causal* consequences of your act right now? Or does the *evidence* your act provides about what the predictor knew (and thus what happens in other branches) matter?"

  ---

  ### **2. Your Brain-Scan Mugging: YES, Use It. Here's How.**
  *   **Why it's BETTER:** Removes sci-fi dismissal ("impossible predictor!"). Makes predictor reliability feel tangible (brain scan = plausible tech). Focuses on the *logic*.
  *   **Preserves the Bite:** The bite comes from the link between your action *now* and the outcome in the *counterfactual branch* via the predictor. A mundane scan preserves this perfectly. It forces: "Paying doesn't *cause* the $10k, but it *signals* the predictor was right, meaning I *would* get the $10k in Tails."
  *   **Key:** Emphasize **"The scan recorded what you WOULD DO *TODAY*."** This maintains the "timeless"/acausal link.

  ---

  ### **3. Misconceptions: Order & Defusing**
  **(Predict the flow, cut them off early):**

  1.  **"Can't change the past, so paying is pointless." (Comes IMMEDIATELY in Mugging discussion)**
      *   *Defuse:* "100% true! Paying doesn't alter the scan. BUT: Does paying *tell us something* about what the scan recorded? And does *that* affect the Tails outcome?" *(Link to Tails branch immediately)*
  2.  **"This is Pascal's Wager." (Early-Mid, during Mugging)**
      *   *Defuse:* "Similar? Maybe. Key difference: Pascal's relies on infinite stakes/unknown probability. Here, stakes/probabilities are finite & knowable. This is about pure decision logic with a known predictor."
  3.  **"Predictor must be perfect." (Mid, during Reliability)**
      *   *Defuse Time:* **3-4 minutes MAX.** Show the EV math (as above). Stress: "The paradox arises even at 95% if the Tails reward is high enough ($10k >> $100). We'll assume 'highly reliable' today to focus on the logic."
  4.  **"Expected value is expected value, compute from what you know!" (Mid-Late, Crux Point)**
      *   *THIS IS THE ACTUAL CRUX.* Defuse by SHOWING the two ways to compute:
          *   **Causal View (Only Current Branch):** "I know coin was Heads. Paying costs me $100. Refuse costs $0. Refuse!"
          *   **Evidential View (All Branches Linked by Predictor):** "If I pay, it's strong evidence the scan was 'Pay', meaning I *would* get $10k if Tails. If I refuse, it's evidence the scan was 'Refuse', meaning I *wouldn't* get $10k if Tails. EV(Pay) ≈ -$100 + (Prob Tails) * $10k. EV(Refuse) ≈ $0 + (Prob Tails) * $0. Paying wins!"
      *   *Highlight:* **The disagreement is FUNDAMENTAL: Should you condition *only* on your current knowledge (Heads), or *also* on what your action reveals about the predictor (affecting your beliefs about Tails)?**
  5.  **"Rewarding extortion is bad!" (Immediately in Blackmail)**
      *   *DEFER:* "Hold that thought! Let's note it." (Write under Blackmail column). *Then:* "But *logically*, compared to the Mugging, why does this feel different? Is the predictor logic broken here?"
  6.  **"Causal vs. Evidential" Labels (Late)**
      *   *Introduce ONLY if the conflict is clear:* "In decision theory, these views have names: Causal Decision Theory (CDT) focuses *only* on causing good outcomes now. Evidential Decision Theory (EDT) focuses on the *total evidence* your act provides. Which feels right here? Where?"

  ---

  ### **4. The Closing Question**
  **"Imagine you face the Mugging scenario. What do you do, and *specifically, what kind of reasoning* leads you to that choice? Now, imagine your friend faces the Blackmail scenario. What would you advise them to do, and *would your reasoning for them be the same type* as your reasoning for yourself in the Mugging? Why or why not?"**

  *   *Why it works:* Reveals if they see the *structural* similarity and whether their *applied reasoning* is consistent or conflicted. Forces them to articulate the logic type (causal/evidential) and if emotions/morals override it in Blackmail.

  ---

  ### **5. What to Cut (Be Ruthless!)**
  *   **The Decision Theory Zoo:** NO Timeless DT, Updatelessness, FDT. Mentioning CDT/EDT *labels* at the end is enough if time. **Say:** "There are whole theories built around this split (CDT vs. EDT). We're just mapping the territory today."
  *   **Probability Deep Dives:** No Beta distributions, no sensitivity analysis. Stick to "High Reliability".
  *   **Real-World Predictor Feasibility:** No debates about brain scans or blackmail schemes working. "Assume the setup works as described."
  *   **Philosophy of Time/Free Will:** "Can the future affect the past?" is a rabbit hole. Stick to: "The *evidence* links the branches."
  *   **Multiple Rounds/Equilibria:** Keep it one-shot.

  ---

  ### **Making Blackmail Do the Work**
  *   **Sequence:** Mugging FIRST (abstract, low emotion). *Then* Blackmail (emotional, high stakes).
  *   **Method:** After presenting Blackmail, **DO NOT SAY "IT'S THE SAME"**. Ask:
      *   "Raise your hand if your *gut reaction* to paying here is different than in the Mugging?"
      *   "What's *different*? (Write responses: Extortion! Evil! Deterrence!)"
      *   "Now look at the whiteboard structure... is the *predictor logic* linking your action now to the other outcome different? Or is the difference *outside* the logic?" *(Forces them to see the structure is identical, the conflict is in values/emotions applied to the same logic)*
  *   **Goal:** They should feel the tension between "The math/logic says Pay" and "Paying blackmailers is wrong/dangerous".

  ---

  **Execution Tip:** Be a ruthless timekeeper. Use the whiteboard relentlessly to map the structures side-by-side. When misconceptions arise, **write them down** under the relevant case, then address them. Your job is to make the conflict *visible* and *unavoidable*, not to solve it. Good luck!
