answer: |-
  Here's a complete runnable activity for your grad seminar, designed as requested. I'll describe it in continuous prose without headings or markdown, and I'll be honest about limitations at the end.

  You'll start by dividing the 12 students into three teams of four. Each team gets roles: an Experimentalist (designs and runs button-press sequences), a Theorist (builds models of the hidden ontology), a Skeptic (questions assumptions and pushes for tests that might break the model), and a Reporter (synthesizes findings into the report and predictions). You, as instructor, act as the Referee and box-operator. Prepare three "black boxes" in advance—these can be physical boxes with buttons and LED outputs, or more feasibly, three simple computer programs (e.g., in Python or a web app) that you run on your laptop. Each box has three labeled buttons (say, "X," "Y," "Z") and a display showing a numeric output (0, 1, 2, or 3). Crucially, each box has a "Reset" button to return it to a fixed starting state. Box 1 internally models three binary switches (states 0 or 1), where pressing X toggles switch A, Y toggles B, and Z toggles C, and the output is the sum of the switches (so 0-3). Box 2 models a single integer (0-7) where pressing X flips bit 0 (least significant bit), Y flips bit 1, and Z flips bit 2 of its binary representation, and the output is the number of 1-bits (popcount, identical to Box 1's sum). Box 3 is a four-state system (0-3) where pressing X adds 1 mod 4, Y adds 2 mod 4, and Z adds 3 mod 4, with the output being the current state. Boxes 1 and 2 are behaviorally indistinguishable: every sequence of button presses from any state yields identical outputs. Box 3 is distinguishable with certain sequences. The ontologies differ: Box 1 has three entities with intrinsic states (the switches), Box 2 has one entity with a relational state (the bit positions define its value relationally), and Box 3 has one entity with a simple state. Teams won't know this setup—they'll discover equivalence and underdetermination through play.

  Begin the session by framing the task: "You are reverse-engineering sealed systems. Each box has hidden internal mechanics—entities, states, and rules. You can press buttons and record outputs, but never open the box. Your goal is two-fold: predict outputs for a held-out button sequence I'll give later, and submit a one-page ontology report per box. Scoring is based solely on prediction accuracy for the held-out sequence; the ontology report won't be scored for correctness. You have 45 minutes to experiment freely." Hand each team a cheat sheet: buttons (X, Y, Z), outputs (0-3), reset function, and note that states persist between presses. Emphasize they should test all boxes.

  During the 45-minute experimentation phase, teams will query boxes via you (the Referee). You operate the boxes discreetly—don't reveal internal logic. Expect chaos initially: teams might fixate on one box or button-mash randomly. The Experimentalists might start with simple tests (e.g., pressing X repeatedly from reset), while Theorists sketch state diagrams. Skeptics should push for "boundary tests," like pressing buttons in non-intuitive orders. Predictably, teams will notice Box 3 behaves differently—e.g., from reset, pressing X gives 1, but pressing Y gives 2, whereas Boxes 1 and 2 both go from reset (output 0) to output 1 with any button press. Some teams might miss this and assume all boxes are unique, wasting time. Nudge them: "Are all boxes responding uniquely to the same inputs?" Around minute 30, a team may spot that Boxes 1 and 2 always match outputs for any sequence. If not, let it unfold—they’ll see it later. A common pitfall: teams forget to use reset for controlled experiments, leading to inconsistent data. Remind them: "Reset ensures you start from a known state." By minute 40, frustration may surface as teams realize more data doesn't distinguish Boxes 1 and 2—every test confirms equivalence. This is the "aha" moment for inaccessibility: no experiment can settle the ontology difference.

  At minute 45, pause experimentation. Give all teams the same held-out sequence for each box (e.g., for Boxes 1 and 2: [X, Y, Z, X, Y, Z, X, Y, Z, X]; for Box 3: [X, Y, Z, X, Y, Z, X, Y, Z, X]). Announce they have 10 minutes to finalize predictions and reports. The predictions must list expected outputs for each step, starting from reset. The ontology report per box should state: number of entity types, their possible states, and causal rules (how buttons change states). Stress that reports are brief—one page total, not per box. Theorists and Reporters will struggle here: for Boxes 1 and 2, they might propose different ontologies (e.g., "three objects" vs. "one structured field") but identical predictions. Skeptics may argue for underdetermination in the report, while others insist on simplicity. Note: prediction scores depend only on output accuracy, so they can "cheat" by copying Box 1’s model for Box 2, but the ontology forces a choice.

  After 10 minutes, collect submissions. Quickly score predictions (e.g., 1 point per correct output in the sequence). Boxes 1 and 2 have identical correct sequences (e.g., 0,1,2,3,2,1,0,1,2,3 for the sample), so teams using equivalent models will score equally. Box 3 differs (e.g., 0,1,3,2,3,1,0,1,3,2). Announce scores but don’t reveal ontologies yet. Then, transition to a 20-minute debrief. As Referee, challenge reports: "Team A, you said Box 1 has three switches—why not one field? Your predictions were perfect either way." Highlight teams that flagged underdetermination: "Team B noted Boxes 1 and 2 always matched—what does that imply?" Draw out key points: First, behavioral equivalence (Boxes 1 and 2) shows underdetermination—multiple ontologies explain the same data. Second, prediction scoring rewarded empirical adequacy, but ontology reports revealed commitments beyond evidence. Third, simplicity (e.g., preferring "one entity" over "three") might have guided choices, but it’s not truth-tracking—it’s a pragmatic posit. Finally, the moment they realized more data couldn’t help distinguishes contingency (we could open the box) from principled inaccessibility (some facts are unreachable by any experiment).

  In the debrief, map to philosophy without jargon: call the equivalence "hidden twins" and the simplicity urge "the tidy-up rule." You can later name these as underdetermination and parsimony. The activity can’t replicate fundamental inaccessibility (e.g., quantum observables), since students know the box is artificially sealed. Address this: "In science, inaccessibility isn’t always contingent—sometimes it’s built into reality. The game shows how underdetermination persists even with infinite data, but in real cases, we can’t resolve it by ‘opening the box.’" Expected hiccups: teams running out of time (keep strict phases), or dominant personalities sidelining Skeptics (assign roles firmly). Overall, this mirrors theory-laden observation—students "see" ontologies through their modeling biases, not raw data.
