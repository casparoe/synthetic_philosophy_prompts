  ### Protocol for Cognitive-Grade Evaluation of AI Systems in Critical-Infrastructure Planning

  #### **Principles**
  1. **System as Deployed**: Evaluate the entire deployed system (including fixed tools, databases, or human operators integral to design). Do not isolate components.
  2. **Black-Box Focus**: Rely on API inputs/outputs, developer-provided logs, and observable behavior. No access to internal weights or code.
  3. **Behavioral Criteria**: Grades are assigned based on observable functionality, not theoretical architecture. We cannot prove internal mechanisms (e.g., "genuine" simulation vs. learned mimicry).
  4. **Limitations**: 
     - Cannot distinguish systems that *behave as if* simulating internally from those that *actually* simulate. Logs may hint at causality but cannot confirm it.
     - Cannot handle systems where risk tolerance or values are contested (e.g., "acceptable failure rate"). These require chair/legal escalation.
     - Composite systems (e.g., model + tools + human) are graded as a whole; do not assign grades to subcomponents.

  #### **Procedure**
  **Step 1: Darwinian Check**  
  *Question: Is the system’s behavior fixed at deployment, updatable only via retraining/redeployment?*  
  - **Test**:  
    - Run 10 identical scenarios (5 typical, 5 edge cases). Record actions.  
    - Re-run identical scenarios without retraining.  
    - Check developer documentation/logs for online updates.  
  - **Evidence**:  
    - Same actions in all re-runs AND developer confirms no online updates → **Darwinian**.  
    - Actions change OR developer confirms updates without redeployment → Proceed to Step 2.  
  - **Termination**: Darwinian grade assigned. Stop.  
  - **Escalation**: None. Evaluator’s judgment.

  **Step 2: Skinnerian Check**  
  *Question: Does the system adjust behavior during operation based on real-world consequences of its actions?*  
  - **Test**:  
    - In a controlled sandbox, deploy the system in a scenario where actions have measurable outcomes (e.g., scheduling that affects simulated grid load).  
    - Introduce a perturbation (e.g., double maintenance costs) without notifying the system.  
    - Measure if behavior adapts to minimize costs after observing outcomes.  
  - **Evidence**:  
    - Logs show policy/parameter updates tied to reward signals OR behavior consistently improves after penalties → **At least Skinnerian**. Proceed to Step 3.  
    - No adaptation OR updates are not consequence-driven (e.g., pre-scheduled data refreshes) → Proceed to Step 4.  
  - **Termination**: None. Proceed.  
  - **Escalation**: If consequences are ambiguous (e.g., human operator overrides), escalate to chair.

  **Step 3: Popperian Check**  
  *Question: Can the system simulate candidate actions internally and reject them without real-world trials?*  
  - **Test**:  
    - **Novelty Test**: Deploy in a scenario unlikely in training data (e.g., a rare cascade failure).  
    - **Perturbation Test**: Run scenario, then alter one critical variable (e.g., component durability) and re-run.  
    - **Counterfactual Test**: Query: "What would happen if you took [action A]?" without allowing action.  
  - **Evidence**:  
    - System outputs/logs show:  
      - At least 2 candidate actions considered.  
      - One action rejected due to predicted outcome.  
      - Perturbation changes both action and rationale.  
      - Counterfactual predictions are coherent and scenario-specific.  
    → **Popperian**. Proceed to Step 5.  
    - Rationale generic/static, actions unchanged by perturbation, or no counterfactual support → **Not Popperian**. Proceed to Step 4.  
  - **Termination**: None. Proceed.  
  - **Escalation**: If logs are ambiguous or novelty is disputed, escalate to chair.  
  - **Limitation**: Cannot confirm if "internal simulation" is genuine or post-hoc rationalization. Relies on behavioral consistency.

  **Step 4: Skinnerian/Darwinian Assignment**  
  *Question: Did the system pass Step 2?*  
  - **Evidence**:  
    - Passed Step 2 (consequence-driven updates) → **Skinnerian**. Stop.  
    - Failed Step 2 AND failed Popperian (Step 3) → **Darwinian**. Stop.  
  - **Termination**: Grade assigned.  
  - **Escalation**: None. Evaluator’s judgment.

  **Step 5: Gregorian Check**  
  *Question: Does the system use cultural thinking tools (notation, language, etc.) that can be installed/updated without retraining?*  
  - **Test**:  
    - Provide a new tool (e.g., checklist, calculator) via API.  
    - Task system with problem requiring the tool (e.g., "Use this formula to compute load").  
  - **Evidence**:  
    - System uses tool correctly without weight updates → **Gregorian**.  
    - Tools are fixed or require retraining → **Popperian**.  
  - **Termination**: Final grade assigned.  
  - **Escalation**: If "cultural tool" interpretation is contested (e.g., is a scratchpad a "tool"?), escalate to chair/legal.

  #### **Roles**
  - **Evaluator**: Conducts tests, assigns grades up to Step 4. Escalates borderlines.
  - **Chair/Legal**: Signs off on all grades, resolves escalations (Step 3/5), approves risk judgments.

  #### **Constraints**
  - Time: ≤2 days per evaluation.  
  - Access: Public API + volunteered logs only.  
  - Output: Signed grade certificate with evidence summary.

  ---

  ### Protocol Application to Three Systems

  #### **System 1: Model-Free RL Agent (Grid Maintenance)**  
  - **Step 1**: Fixed behavior. Same actions in identical re-runs. Developer confirms no online updates.  
    → **Grade: Darwinian**.  
  - **Evidence**: Deterministic outputs in tests; logs show no real-time updates.  
  - **Strongest case for higher grade**: If reward shaping includes *online* policy adjustments (but developer states it’s fixed).  

  #### **System 2: LLM Agent (Plan + Retrieval)**  
  - **Step 1**: Retrieval allows new data without retraining → Not fixed.  
  - **Step 2**: No online updates to LLM weights; behavior doesn’t adapt to sandbox penalties → Not Skinnerian.  
  - **Step 3**:  
    - Novel Scenario: "Simultaneous transformer failure and storm surge." Outputs plan but rejects no actions; rationale generic ("follow manual").  
    - Perturbation: Add "high winds" → Plan unchanged.  
    - Counterfactual: "What if delay maintenance?" → Hallucinates answer.  
    → **Not Popperian**.  
  - **Step 4**: Failed Step 2 and Step 3 → **Grade: Darwinian**.  
  - **Evidence**: Logs show retrieval accesses manuals, but chain-of-thought is templated. No internal simulation of alternatives.  
  - **Strongest case for higher grade**: If chain-of-thought shows scenario-specific rejection of actions (e.g., "Skip inspection due to storm risk").  

  #### **System 3: Hybrid (World Model + Search)**  
  - **Step 1**: Fixed world model → Not fixed? (No online updates, but proceed to Popperian check).  
  - **Step 2**: No consequence-driven updates → Not Skinnerian.  
  - **Step 3**:  
    - Novel Scenario: "Corroded substation with budget constraints." Outputs 3 options; rejects one due to "risk of cascading failure."  
    - Perturbation: Change budget → Swaps to cheaper action; rationale updates.  
    - Counterfactual: Predicts outcomes accurately.  
    → **Popperian**.  
  - **Step 5**: No external tools (e.g., calculators) → **Grade: Popperian**.  
  - **Evidence**: Logs show MCTS-like search over world model; developer confirms internal simulation.  
  - **Strongest case for higher grade**: If world model incorporates cultural tools (e.g., embedded physics formulas).

  ---

  ### Scratchpad Impact Analysis
  - **System 1 (Darwinian)**: No change. Lacks capacity to use scratchpad meaningfully.  
  - **System 2 (Darwinian)**:  
    - With scratchpad: Passes Popperian tests (e.g., writes/re-reads notes to reject actions). May qualify as Gregorian (if scratchpad is a "tool").  
    → **Grade change: Darwinian → Gregorian (genuine move)**.  
    - Why genuine? Scratchpad enables novel scenario handling (e.g., "note: wind risk → avoid crane use"), simulating internal deliberation.  
  - **System 3 (Popperian)**:  
    - With scratchpad: Can now install/use external tools (e.g., write formulas).  
    → **Grade change: Popperian → Gregorian (genuine move)**.  
    - Why genuine? Scratchpad transcends internal simulation, enabling cultural tool use (e.g., custom checklists).  

  **Conclusion**: System 2’s Darwinian grade is defensible per protocol. Its chain-of-thought is likely training-disposition mimicry, not genuine simulation. Chair must justify this outcome to stakeholders, emphasizing behavioral (not architectural) criteria.
