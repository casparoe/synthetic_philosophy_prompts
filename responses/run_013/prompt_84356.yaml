  Okay, I need to help the user figure out Maya's rule for determining good faith in arguments, especially regarding Dev. Let me start by reviewing all the examples given to identify patterns.

  First, Maya considers the guy who insults others but reversed his position on rezoning based on evidence as good faith. That suggests that changing one's mind when presented with new data is key, regardless of demeanor. Then there's the gracious woman who agrees but repeats claims later—Maya says not good faith. That points to surface politeness not mattering if there's no real engagement. The guy arguing a point he doesn't believe just to make others squirm is clearly not good faith, emphasizing sincerity.

  The technical guy with weird views who understands opposing arguments and updates on papers is good faith. Here, effort to engage with counter-evidence matters, even if conclusions don't change. The person only asking for evidence without ever stating a position is deemed not good faith. This shows that active participation and openness are necessary, not just passive questioning. The woman afraid to change her mind due to personal costs is still good faith. Maya values honesty about biases and constraints, as long as there's no active deception.

  Now for Dev: He's honest, reads papers, admits knowledge gaps, and says he'd change with evidence. But he sticks to a niche source cluster and avoids mainstream literature. The key issue is whether avoiding opposing views breaks good faith. 

  Looking at the proposed rules: Rule 1 (quality of reasoning with current evidence) would likely see Dev as good faith since he reasons well with what he has. Rule 2 (not rigging information diet) would lean towards not good faith because he's avoiding challenging sources. Rule 3 (owing engagement to others) might find him lacking because he doesn't let others set his agenda.

  Maya's past decisions stress engagement with counterarguments. The technical guy updates on papers, while Dev dismisses mainstream articles. The courteous woman's lack of progress resembles Dev's avoidance. However, the scared woman's admitted constraints are similar to Dev's situation, but she's honest. Yet Dev isn't being cornered; he's choosing his sources. 

  The strongest pattern is engaging with opposing views. Dev's refusal to read the review article, claiming he already knows, mirrors the woman who repeats claims without progress. Maya might see this as avoiding epistemic responsibility, making it not good faith. 

  For a test case: Someone who engages deeply with the strongest counterarguments but still dismisses them quickly, claiming prior knowledge. If Maya calls that not good faith, it confirms Rule 2 or 3. If she allows it, Rule 1 applies. 

  The verdict's purpose: Good faith doesn't obligate continued engagement but suggests no malice. For Dev, if not good faith, it's okay to disengage without guilt. Maya's rule emphasizes epistemic diligence over social courtesy.
answer: |-
  Based on Maya's track record and the principles underlying her judgments, here's my analysis of her likely verdict on Dev, the rule her prior decisions commit her to, predictions, a test case to distinguish rules, and the meaning of the verdict:

  **Maya's Likely Verdict on Dev: *Not Good Faith***  
  *(Defended Rule: Good faith requires proactive engagement with the strongest counter-evidence, not just honest reasoning with your existing inputs)*

  ### Why This Matches Her Track Record & Commits Her to Rule #2 (Epistemic Responsibility)
  1. **Her Core Principle (Rule #2):**  
     Maya consistently penalizes **avoidance of cognitive friction**. The gracious repeater (ignores progress), the troll (avoids sincerity), and the evidence-demander (avoids stating positions) all evade genuine engagement. Conversely, she rewards those who *confront discomfort*: the insulting-but-updatable guy, the scared-but-honest woman, and especially the weird-view technician who **actively engages opposing cases**.  
     
     **This commits her to Rule #2 ("not building a rigged information diet") as non-negotiable.** Rule #1 ("quality of reasoning with current evidence") is *necessary but insufficient* for her—Dev passes Rule #1 (he reasons honestly with his niche sources) but fails Rule #2 by refusing to engage the mainstream case. Rule #3 ("owing disagreement to others") is partially reflected but less central; the evidence-demander was polite but still failed.

  2. **Predictions for Dev Under Each Rule:**  
     - **Rule #1 (Reasoning Quality):** *Good Faith* → He’s sincere, admits gaps, and reasons well with his sources.  
     - **Rule #2 (Epistemic Diet):** *Not Good Faith* → He curates a closed ecosystem, dismisses mainstream sources without rigorous engagement, and avoids discomfort.  
     - **Rule #3 (Agenda-Setting):** *Not Good Faith* → He won’t let others set his agenda ("I’ve heard it all before" deflects your review article).  

     Dev’s refusal to read the review article mirrors the gracious repeater’s stagnation and contrasts with the technician’s deep engagement with opposing views. Maya’s "weirdly adamant" defense of the technician shows she values *effort to test one’s views* over conclusions. Dev’s inaction violates this.

  ---

  ### Test Case to Distinguish the Rules  
  **Present Maya with this scenario:**  
  > *Alex believes Policy X is harmful. They’ve read all major critiques, can articulate the pro-X case better than proponents, and update when shown new data. But they refuse to read a landmark pro-X study because "the author is biased," despite the study being peer-reviewed and widely cited. They say they’d change their mind if evidence contradicted them—but dismiss this study unseen.*  

  - **Rule #1 Prediction:** *Good Faith* → Alex reasons well with available evidence and is open *in theory*.  
  - **Rule #2 Prediction:** *Not Good Faith* → Alex is rigging their diet by dismissing a key source for arbitrary reasons.  
  - **Rule #3 Prediction:** *Not Good Faith* → Alex ignores a substantive challenge from others.  

  **If Maya calls Alex *not good faith*, it confirms Rule #2 as her core principle.** If she excuses it, she leans toward Rule #1.

  ---

  ### What the Verdict Actually Does  
  Maya’s "good faith" label **separates moral blame from strategic engagement**:  
  - **Good Faith ≠ Keep Arguing:** It means the person isn’t *malicious or deceptive* (e.g., Dev isn’t trolling). You *can* engage without being played.  
  - **Not Good Faith ≠ Be Annoyed:** It means their process is **epistemically irresponsible** (e.g., Dev’s closed loop). You *shouldn’t* feel obligated to engage, but anger is optional.  

  **For Dev:** A "not good faith" verdict means:  
  - You shouldn’t expect productive debate (he won’t do the work).  
  - You needn’t feel guilty disengaging ("I’ve shared the review; ping me if you read it").  
  - But you *can* still respect his sincerity without endorsing his method.  

  Maya’s rule isn’t about being *effective* or *likeable*—it’s about whether someone **treats truth-seeking as a collaborative project requiring vulnerability**. Dev fails by insulating himself. If she surprises us and calls him good faith, it means she weights personal constraints (like the scared woman) higher than epistemic rigor—but her pattern suggests otherwise.  

  **Defend this to her:**  
  *"Dev’s honesty with his inputs is baseline sincerity, not good faith. Good faith requires *seeking* inputs that could break your worldview—like the technician wrestling with papers or the rezoning guy accepting numbers. Dev outsources that work to his bubble. He’s not lying, but he’s not truth-seeking either."*
