  ### Constructed Decision Problem: Finite-Capped St. Petersburg Gamble

  The decision problem involves a player with fixed, modest wealth \(w > 0\) facing a single gamble offered by a house. The payoff \(X\) is defined as follows for a fixed positive integer \(N\) (the cap parameter):
  - For \(n = 1, 2, 3, \ldots\), the payoff is \(\min(2^n, 2^N)\).
  - The probability of \(X = 2^n\) for \(n = 1, 2, \ldots, N-1\) is \(2^{-n}\).
  - The probability of \(X = 2^N\) is \(2^{-N+1}\) (this includes the case \(n = N\) and all \(n > N\), where the payoff is truncated to \(2^N\)).

  The player may buy the gamble once at a posted price \(p\). The goal is to analyze this gamble under different decision rules, focusing on the tension between expected payoff and sensible behavior, even with finite expected payoff.

  #### 1. Derivation of Key Quantities as Functions of \(N\)

  - **Expected Monetary Payoff**:
    \[
    E[X] = \sum_{k=1}^{N-1} (2^k \cdot 2^{-k}) + (2^N \cdot 2^{-N+1}) = \sum_{k=1}^{N-1} 1 + 2 = (N-1) + 2 = N + 1
    \]
    The expected payoff is \(N + 1\), which depends on \(N\).

  - **Median Payoff**:
    The cumulative distribution function is:
    - \(P(X \leq 2) = P(X = 2) = 2^{-1} = 0.5\) for all \(N \geq 1\).
    - Since \(P(X \leq 2) = 0.5\) and \(P(X \geq 2) = 1\), the median payoff is always 2, for any \(N\). It does not depend on \(N\).

  - **Probability that Payoff is at Least \(2^k\)**:
    For integer \(k \geq 1\):
    \[
    P(X \geq 2^k) = 
    \begin{cases} 
    2^{1-k} & \text{if } 1 \leq k \leq N \\
    0 & \text{if } k > N 
    \end{cases}
    \]
    This depends on both \(k\) and \(N\). For fixed \(k\), it depends on \(N\) only if \(N < k\) (where it is 0), but for \(N \geq k\), it is constant at \(2^{1-k}\). As \(N\) increases, \(P(X \geq 2^k)\) stabilizes to \(2^{1-k}\) for fixed \(k\).

  **Dependence on \(N\) and Why Expectation and Median Part Company**:
  - \(E[X]\) depends on \(N\) because it sums over all possible outcomes, and higher \(N\) allows for larger (though capped) payoffs that increase the expectation.
  - The median does not depend on \(N\) because \(P(X = 2) = 0.5\) for all \(N\), so half the probability mass is always at the lowest outcome. This anchors the median at 2, regardless of \(N\).
  - They part company because the expectation is influenced by rare, high-payoff events (up to the cap), which grow with \(N\), while the median is determined by the most probable outcome (2 with probability 0.5), which is unaffected by \(N\).

  #### 2. Divergence of Expectation and Finite Certainty Equivalent under Concave Utility
  - **Divergence of Expectation**: As \(N \to \infty\), \(E[X] = N + 1 \to \infty\). This is not what makes the game puzzling, as a sensible player may still value the gamble finitely under risk aversion.
  - **Finite Certainty Equivalent under Concave Utility**: Consider the utility function \(U(x) = \ln(x)\), defined for \(x > 0\). It is increasing and concave. The certainty equivalent \(CE\) satisfies:
    \[
    U(w + CE) = E[U(w + X)] \implies \ln(w + CE) = E[\ln(w + X)]
    \]
    where \(E[\ln(w + X)] = \sum_{k=1}^{N-1} \ln(w + 2^k) \cdot 2^{-k} + \ln(w + 2^N) \cdot 2^{-N+1}\).
    As \(N \to \infty\), this converges to the infinite series:
    \[
    E[\ln(w + X)] \to \sum_{n=1}^{\infty} \ln(w + 2^n) \cdot 2^{-n}
    \]
    The series converges because \(\ln(w + 2^n) \sim n \ln 2\) for large \(n\), and \(\sum_{n=1}^{\infty} n (\ln 2) \cdot 2^{-n}\) converges (as \(n / 2^n \to 0\)). Thus, \(E[\ln(w + X)]\) converges to a finite limit \(L\), so \(\ln(w + CE) \to L\), implying \(CE \to e^L - w < \infty\). Hence, under \(U(x) = \ln(x)\), \(CE\) converges to a finite limit as \(N \to \infty\).

  #### 3. Unbounded Certainty Equivalent under a Different Concave Utility
  - **Second Utility Function**: Consider \(U(x) = x\), which is increasing, concave (linear), and agrees with \(U(x) = \ln(x)\) in being increasing and defined for \(x > 0\), except that it has constant marginal utility (i.e., it is risk-neutral, while \(\ln(x)\) is risk-averse).
  - **Certainty Equivalent under \(U(x) = x\)**:
    \[
    U(w + CE) = E[U(w + X)] \implies w + CE = E[w + X] = w + (N + 1)
    \]
    Thus, \(CE = N + 1\), which grows without bound as \(N \to \infty\).
  - **General Condition**: The behavior of \(CE\) (convergence or divergence as \(N \to \infty\)) depends on whether the expected utility \(E[U(w + X)]\) for the infinite St. Petersburg gamble (no cap) is finite or infinite. If \(E[U(w + X)] < \infty\) for the infinite game, \(CE\) converges; if \(E[U(w + X)] = \infty\), \(CE\) diverges.
    - For \(U(x) = \ln(x)\), \(E[U(w + X)] < \infty\) for infinite \(N\), so \(CE\) converges.
    - For \(U(x) = x\), \(E[U(w + X)] = \infty\) for infinite \(N\), so \(CE\) diverges.

  #### 4. Verdict on Buying at Price \(p\) and Sensitivity to \(N\)
  - **Expected Monetary Value Maximization**:
    - Buy if \(E[X] > p\), i.e., if \(N + 1 > p\) (since paying \(p\) for expected gain \(N+1\)).
    - **Verdict**: Buy if \(p < N + 1\). Sensitive to \(N\) because \(E[X]\) increases with \(N\).
  - **Expected Utility Maximization under \(U(x) = \ln(x)\)**:
    - Let \(CE_N\) be the certainty equivalent for given \(N\), which satisfies \(\ln(w + CE_N) = E[\ln(w + X)]\).
    - As \(N \to \infty\), \(CE_N \to C < \infty\) (from part 2).
    - The player should buy if the utility of buying exceeds not buying: \(E[U(w - p + X)] > U(w)\). Equivalently, buy if \(p \leq CE_N\).
    - **Verdict**: Buy if \(p \leq CE_N\). For large \(N\), \(CE_N \approx C\), so verdict is insensitive to large \(N\). For small \(N\), it depends on \(N\) via \(CE_N\), but stabilizes as \(N\) grows.
  - **Median Outcome Comparison**:
    - The median payoff is 2. After buying, wealth is \(w - p + X\); median wealth is \(w - p + 2\).
    - Not buying yields sure wealth \(w\).
    - Buy if median wealth with gamble exceeds sure wealth: \(w - p + 2 > w \implies p < 2\).
    - **Verdict**: Buy if \(p < 2\). Insensitive to \(N\) because the median is fixed at 2 for all \(N\).

  #### 5. Key Feature and Its Alteration
  - **Key Feature**: The probability of the lowest outcome (\(X = 2\)) is fixed at 0.5 for all \(N\), which anchors the median at 2 and makes high payoffs rare but influential for expectation.
  - **Alteration and Effect**: Change the probability distribution so that \(P(X = 2) = 1/4\) for all \(N\) (adjusting other probabilities to sum to 1). For example:
    - Set \(P(X = 2) = 1/4\).
    - For \(k = 2, 3, \ldots, N-1\), set \(P(X = 2^k) = 2^{-k}\).
    - Set \(P(X = 2^N) = 2^{-N+1} + 1/4 - 2^{-N}\) (to compensate for reduced \(P(X=2)\) and ensure \(\sum P = 1\)).
    - **Effect**: The median now depends on \(N\). For instance, with \(N\) large, \(P(X \leq 4)\) may exceed 0.5, so median increases with \(N\). Thus, expectation and median both grow with \(N\), reducing tension. Sensible players (e.g., under median rule) would pay more for larger \(N\), aligning better with expectation.

  #### 6. Adversarial Note and Conclusion
  - **Strongest Objection**: A defender of expected value might argue that rare high payoffs deserve weight because, over many repetitions, the average payoff converges to the expectation, justifying high prices for large \(N\).
  - **Survival of the Case**: The case survives because (1) the player has only one play (no repetition), and (2) under concave utility (e.g., \(\ln(x)\)), the certainty equivalent remains finite even as \(N \to \infty\), showing that expectation is not a sensible guide for risk-averse players with modest wealth. The median rule also prescribes a low price insensitive to \(N\), highlighting that most outcomes are small.
  - **What the Case Establishes**: It establishes that the St. Petersburg paradox is not solely due to infinite expectation; tension persists with finite expectation when decision rules account for risk aversion or typical outcomes. It does not establish that expectation is always irrelevant—it shows that for non-linear utility or non-repeatable gambles, alternative rules better capture sensible behavior.

