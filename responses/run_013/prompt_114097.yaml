prompt: |-
  Ok so I need a referee for an arguement, and I think you're the right kind of nerd for it. Put on the role of someone who's spent their whole career in normative ethics, specifically on the question of whether there can be acts that are morally better than what morality requires — the supererogation debate, the "is morality too demanding" mess. Before you rule on anything, think it through carefully and sketch out for yourself what each person is actually committed to, because I think half the fight was them not being clear about what they each meant by "required."

  Background: our mutual friend Devi donated a kidney to a stranger (non-directed, through one of those matching programs), and she also gives away a big chunk of her income — like a third — to charity. She's not a saint, she buys herself nice stuff, she's normal. Also relevant: her sister didn't donate, and nobody in our group thinks the sister did anything wrong.

  So Nadia and Rob went at it at a dinner and it ran like forty minutes and honestly both of them had real points, which is probly why I definately couldn't just pick a side.

  Nadia: "What Devi did is more than anyone had to do — that's the whole point. We admire her because she wasn't required to do it."

  Rob: "There's no such thing as more than you had to do. If donating was the better thing to do, then it was the thing to do. 'Beyond the call of duty' is just what we say when someone does what we all know we should do and don't, and we don't want to feel bad, so we pretend the good stuff is optional."

  Nadia: "Then morality demands everything. There's always something better you could be doing with your money or your organs, so if better means required, everyone is permanently failing, always. That's not a morality anyone can live under, and it's a reductio."

  Rob: "Maybe everyone is permanently failing. Maybe that's just the truth about how much suffering there is. It's unpleasant, not a reductio. And anyway, you're confusing 'required' with 'demandable.' Your evidence that Devi's sister wasn't required is that you wouldn't blame her. But there are things that are required of a person that you personally aren't entitled to demand — I'm not entitled to demand that you keep a promise you made to someone else, but it's still required of you. So 'I can't blame her, I can't demand it' doesn't get you to 'she wasn't required.'"

  Nadia: "Fine, but then what's the praise for? If the reason to donate was strong enough that Devi deserves credit for doing it, why isn't the same reason strong enough that her sister deserves blame for not doing it? You can't have it both ways."

  Rob: "That cuts against you, not me. Praise and blame track the same reasons. If there was a real reason for Devi to donate — and there obviously was, there was a person who needed a kidney — then there was a reason for the sister too, and she just didn't act on it. Calling one praiseworthy and the other not-blameworthy is you wanting a category where the reason counts when it's followed and doesn't count when it isn't."

  Nadia: "No — a reason can be real without being decisive. 'There was a reason to do it' and 'she was required to do it' aren't the same claim. Some reasons are just there, and it's up to you whether to take them up, and taking them up is what we call going beyond."

  Rob: "But then 'required' just means 'backed by a reason we've decided is strong enough,' and 'strong enough' starts to look like whatever we feel like demanding of people that week. You've made the line between required and optional a matter of our comfort."

  Then Nadia said something about there being a mirror image — acts that are bad but that we don't forbid, so why can't there be acts that are good but that we don't require — and Rob said the symmetry was shallow, and I honestly lost the thread of that one. Also, at some point someone mentioned that when a friend asked Devi about it, Devi said it just felt like the only thing she could do once she knew, and Nadia said that showed it wasn't really optional for her, and Rob said that only showed Devi's psychology, not the moral facts.

  So: go through this move by move and tell me who's right about what. Rate each of the main moves — Nadia's reductio, Rob's required-versus-demandable distinction, Rob's praise-and-blame-track-the-same-reasons point, Nadia's reason-without-being-decisive reply, and the two side points about the mirror-image acts and about Devi's own sense of obligation — on a scale from clearly mistaken to clearly right, and say briefly why for each. I especially want to know whether they're actually disagreeing or just using "required" in two different senses and talking past each other; I suspect the latter but I couldn't put my finger on where it happens. And at the end, tell me who's more right overall and what both of them are missing. Don't just split the difference, and don't just tell me what the famous positions in this area are — actually engage with what they said.
reasoning: |-
  Okay, the user wants me to referee an argument between Nadia and Rob about supererogation using Devi's kidney donation as a case study. This is a classic normative ethics debate about whether actions can be morally good without being obligatory. 

  First, I need to unpack the core disagreement. Nadia defends supererogation - she argues Devi's donation is morally praiseworthy precisely because it wasn't required. Rob rejects this, claiming that if an action is morally better, it must be obligatory. Their debate hinges crucially on what "required" means in moral contexts.

  Looking at Nadia's reductio argument: She says if all good acts are required, morality becomes impossibly demanding since we could always do more. That's a standard objection to utilitarianism. Her point seems valid - if morality demands we constantly sacrifice until we're equally poor as those we help, it becomes unsustainable. I'd rate this argument as strong because it exposes a real problem in Rob's position.

  Rob's required-versus-demandable distinction is particularly insightful. He's right that third parties aren't always entitled to enforce moral obligations. Just because I wouldn't blame Devi's sister doesn't prove she had no obligation. This distinction between what's morally required and what's socially enforceable is crucial. I'd call this Rob's strongest point.

  Regarding Rob's praise/blame symmetry argument: He claims if Devi deserves praise for donating, her sister deserves blame for not donating. This seems flawed. We can consistently hold that donating is supererogatory (praiseworthy but not obligatory) while not donating is merely permissible (not blameworthy). The reasons operate differently in each case.

  Nadia's "reason without being decisive" reply hits back well. She distinguishes between moral reasons existing and those reasons creating obligations. This aligns with moderate deontology where some good acts aren't duties. Her point stands against Rob's conflation of "there's a reason" with "it's required."

  On the mirror-image point Nadia mentioned (acts that are bad but not forbidden): This references suberogatory acts. While conceptually neat, it's not essential to the core debate. Similarly, Devi's psychological sense of obligation reveals her character but not moral facts, as Rob correctly noted.

  The fundamental issue is that Nadia and Rob are using "required" differently:
  - Nadia means "enforceably obligatory" (what we can demand/blame for)
  - Rob means "objectively best course of action"

  Once this terminological confusion is cleared, their positions aren't irreconcilable. Rob's view leads to an overdemanding morality that most ethical systems reject, while Nadia's allows for moral heroism without universal obligation.

  Overall, Nadia has the stronger case because her view better matches our moral intuitions and practices. But Rob correctly pushes against making morality entirely subjective. The sweet spot might be in moderate views that recognize genuine supererogation while maintaining robust obligations. Both miss that supererogation often involves personal sacrifice beyond what can be fairly demanded, which explains why we praise Devi but don't condemn her sister.
answer: |-
  Alright, strap in. As someone who's spent decades wrestling with precisely this hairball – supererogation, demandingness, and the nature of "requirement" – I'll dissect this dinner debate move by move. Forget splitting the difference; we're going for clarity and truth. Here's my ruling, based on the arguments presented:

  **The Core Confusion (They ARE Talking Past Each Other):**

  You nailed it. The central problem is **Rob and Nadia are using "required" in fundamentally different senses**, leading to apparent contradiction where there might be nuanced compatibility. Let's expose this:
  *   **Nadia's "Required" (Enforceable Obligation):** Means "what one can be *justifiably blamed* for not doing" or "what others are *entitled to demand/enforce*." Her evidence is the lack of blame towards Devi's sister and the intuitive sense that demanding such a sacrifice would be wrong.
  *   **Rob's "Required" (Objective Moral Reason/Optimal Action):** Means "what the balance of moral reasons *objectively favors*" or "the *best available option*." His evidence is the undeniable moral reason (saving a life) existing for both Devi and her sister.

  **Now, Rating the Moves:**

  1.  **Nadia's Reductio ("Morality demands everything, permanent failure"):**
      *   **Rating: Clearly Right (against Rob's *specific* conflation of 'better' and 'required' in his sense).**
      *   **Why:** If "required" *only* means "objectively best/morally favored course" (Rob's sense), then yes, there is *always* something better we *could* be doing (donating more money, another kidney, dedicating our lives entirely to service). Calling *everything* morally optimal "required" in a way that implies universal blameworthiness for falling short *is* a reductio ad absurdum for any plausible moral system. It collapses the distinction between obligation and aspiration, making moral failure universal and unavoidable. Morality becomes psychologically unsustainable and loses its normative force for guiding action. Rob's "maybe that's the truth" is hand-waving; a moral system that universally condemns everyone for structural realities beyond their full control is a *bad* moral system.

  2.  **Rob's Required-vs-Demandable Distinction:**
      *   **Rating: Clearly Right (as a conceptual point).**
      *   **Why:** Rob makes an *essential* distinction that Nadia initially overlooks. Moral requirement does *not* necessarily imply universal enforceability or blameworthiness by all agents. My obligation to keep my promise to *you* generates a specific claim-right for *you* to demand it and blame me; others may not have that standing. Similarly, a moral requirement might exist without *everyone* (or even *anyone* specific) having the standing to enforce it harshly. This successfully counters Nadia's *initial* argument that the lack of blame *proves* no requirement existed. Lack of *enforceable blame* doesn't prove lack of *moral reason/requirement* (in Rob's sense).

  3.  **Rob's Praise-and-Blame-Track-the-Same-Reasons Point:**
      *   **Rating: Clearly Mistaken (in its implication).**
      *   **Why:** Rob correctly states that the *underlying reason* (e.g., saving a life) is the same for both Devi and her sister. Where he errs is assuming this *must* entail symmetrical judgments of praise and blame. This ignores the crucial role of **cost, sacrifice, and reasonable expectations**. Devi performed an act involving significant personal cost and sacrifice. Her sister omitted the same act. The *moral reason* (life-saving) is a necessary condition for praising Devi, but it is *not sufficient* to *blame* her sister. Blameworthiness typically requires not just a reason, but that acting on that reason was *reasonably expected* given the costs involved. Rob conflates the *existence* of a strong moral reason with the *culpability* for not acting on it. The asymmetry in judgment (praise for Devi, no blame for sister) reflects this difference in *demandingness*, not a contradiction about the reason itself.

  4.  **Nadia's Reason-Without-Being-Decisive Reply:**
      *   **Rating: Clearly Right (against Rob's conflation).**
      *   **Why:** Nadia hits back effectively. She correctly separates two claims:
          *   (A) There is a strong, genuine moral reason to do X (donate the kidney).
          *   (B) X is morally required (in Nadia's sense: blameworthy to omit).
      Rob constantly conflates A into B. Nadia points out that A can be true without B being true. The reason exists, it's weighty, but it doesn't *decide* the issue in a way that makes omission blameworthy. The reason *counts*, but other considerations (significant personal cost, autonomy over one's body, reasonable self-interest) can make acting on that reason *optional* in terms of blameworthiness. This is the core of supererogation: an act is good, praiseworthy, and done for strong moral reasons, *but* the cost/risk is such that not doing it is *not* blameworthy. The reason is decisive *for praise* when acted upon, but its strength *relative to the cost* means it isn't decisive *for blame* when omitted.

  5.  **Side Point: Nadia's Mirror-Image (Bad but not Forbidden Acts):**
      *   **Rating: Conceptually Valid, But Not a Knockdown Argument.**
      *   **Why:** Nadia references "suberogatory" acts – things that are bad, perhaps even mildly wrong, but not serious enough to be forbidden or blameworthy (e.g., being slightly rude to a telemarketer, minor white lies to avoid small hurt feelings). The symmetry argument is *conceptually* sound: if we accept acts that are sub-optimal but not forbidden, why not accept acts that are super-optimal but not required? Rob's dismissal ("shallow symmetry") is weak. However, the existence of suberogation doesn't *prove* supererogation exists; it just shows the conceptual space is coherent and acknowledged on the other side. It strengthens the plausibility of Nadia's framework but doesn't decisively refute Rob.

  6.  **Side Point: Devi's Sense of Obligation ("Only thing she could do"):**
      *   **Rating: Rob is Clearly Right.**
      *   **Why:** Nadia missteps here. Devi's subjective feeling ("the only thing I could do") speaks volumes about her *character* – her empathy, commitment, perhaps a strong personal moral code. It makes her action admirable. But it tells us *nothing* about the *objective* moral status of the act for others. A sociopath might feel no compunction about stealing; that doesn't make stealing optional. Devi's psychology explains *her* motivation, not the universal moral facts about kidney donation. Rob is correct to separate the psychological from the normative.

  **Overall Verdict:**

  *   **Who's More Right? Nadia.** She correctly identifies the core problem with Rob's conflation (the reductio) and offers the more plausible framework for understanding the Devi case: supererogation exists (praiseworthy, costly, morally good, *not* blameworthy to omit). Her "reason without decisive" point is crucial.
  *   **But Rob Wins Key Battles:** His required-vs-demandable distinction is vital and corrects Nadia's initial over-reliance on blame as the sole marker of requirement. He also correctly dismisses Devi's psychology as irrelevant to the moral facts. He effectively forces Nadia to refine her concept of "required."

  **What Both Are Missing (The Crucial Nuance):**

  1.  **Scalarity and Thresholds:** Both talk in binaries (required/not, praiseworthy/blameworthy). But moral reasons, costs, and expectations exist on spectrums. The key is often whether the *cost/sacrifice* crosses a threshold beyond which an action can no longer be *reasonably demanded* (making omission non-blameworthy), even if it remains the *objectively best* thing to do (making action praiseworthy). This threshold isn't arbitrary "comfort" (as Rob fears), but rooted in considerations of fairness, autonomy, and the limits of reasonable self-sacrifice within a human life. Devi's donation crosses this threshold; donating a third kidney probably crosses it even more dramatically.

  2.  **The Source of Asymmetry:** They miss a deeper explanation for the praise/blame asymmetry Rob highlighted. Praise for supererogatory acts often recognizes **moral excellence beyond the call of reasonable expectation**, achieved through significant virtue or sacrifice. Blame for failing to meet a duty recognizes a **failure to meet a reasonable minimum standard**. The *same reason* (saving a life) can ground both judgments because the *context of expectation and cost* is different. Devi met an exceptionally high standard; her sister met the baseline (non-blameworthy) standard. The reason is necessary for both judgments, but not sufficient for blame without the context of reasonable demand.

  3.  **The Role of Institutions and Fairness:** Rob's fear of the line being "whatever we feel like" is partly addressed by embedding supererogation within a broader moral framework that defines core, enforceable duties (e.g., respecting rights, keeping promises, not harming, perhaps a minimal duty of rescue/easy rescue) based on fairness and mutual expectation. Supererogation operates *beyond* this core. Devi's donation isn't required because demanding such significant bodily sacrifice from everyone isn't fair or sustainable. Admiring it doesn't make morality subjective; it recognizes exceptional virtue operating beyond the fair minimum.

  **The Final Judgment:** Nadia wins the debate about Devi's donation. It was supererogatory: morally excellent, praiseworthy, costly, and **not morally required in the sense that her sister would be blameworthy for not doing it.** Rob correctly exposes ambiguities in "required" and pushes against moral laxity, but his conflation of "objectively best" with "blameworthy to omit" leads to an implausibly and destructively demanding morality. The truth lies in recognizing strong moral reasons that don't always generate blameworthy obligations due to significant costs, creating space for genuine moral heroes like Devi without condemning everyone else. Now, tell Nadia and Rob to buy me a drink next time I'm in town – this level of refereeing doesn't come cheap.
