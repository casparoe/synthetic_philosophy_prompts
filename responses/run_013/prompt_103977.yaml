  First, I need to map their requested house rules to the underlying philosophical tensions. The billing separation between Earlier and Current Selves directly addresses personal identity debates. Making Aevum the sole capacity assessor satirizes medical authority and corporate overreach. The premium tier's irrevocability versus standard tier's contestability mirrors the autonomy conflict between past and present selves. The "unsuccessful continuity" refund is darkly humorous - it turns personal identity into a transactional dispute.

  For the unstated theses, I'll assign each to specific clauses: 
  - Autonomy ownership → Clause 4.2 (billing) and 8.1 (voting rights) 
  - Interests vs experiential welfare → Clause 3.3 (prevention of "undignified" states) 
  - Epistemic gap in imagining future states → Clause 2.2 (determination process) 
  - Quality-of-life judgments → Clause 5.2 (prevention of "undignified" states) 
  - Profit motive in early triggers → Schedule B fees and Clause 7.1 (dispute costs)

  The FAQ section will subtly reinforce these: Q1 on identity criteria, Q2 on override fees (satirizing autonomy hierarchies), Q3 making the refund policy absurdly literal. Legalistic phrases like "psychoexistential discontinuity" can carry theoretical weight while sounding like legalese.

  Key is maintaining absolute deadpan delivery. No jokes - just extreme bureaucratic rationality applied to metaphysical dilemmas. The horror should emerge from clauses like 6.1 where a dementia patient's objection gets classified as a "dispute" with filing fees. Premium tier's feature being "non-repudiation" turns irrevocability into a sales point.

  For specialist recognition: 
  - Clause 2.2's "consistent with prior wishes" nods to precedent autonomy debates 
  - Schedule B fees parody Parfit's teletransportation thought experiment 
  - "Continuity assessment" in FAQ mocks reductionist personal identity theories

  Word count control matters - preamble and clauses first, FAQ last to hit 750 words. Using defined terms (Subscriber, Current Occupant) maintains legal parody tone. Closing with "Aevum: The Future You Ordered" as a tagline underscores the service's chilling presumption.
answer: |-
  **AEVUM ADVANCE DIRECTIVES PLATFORM: TERMS OF SERVICE AGREEMENT**

  **Preamble:** Aevum, Inc. ("Aevum," "we," "us," "our") provides a secure platform for the creation, storage, activation, and administration of legally recognized advance directives ("Directives"). By subscribing to the Aevum Service ("Service"), you ("Subscriber," "Earlier Account-Holder") acknowledge and agree that these Terms of Service ("Terms") govern your use of the Service, including the binding nature of your Directive upon its activation. The Service facilitates the expression of your future healthcare and personal welfare preferences should you experience a qualifying loss of capacity.

  **1. Definitions & Interpretation**
      1.1. **"Earlier Account-Holder" (E-AH):** The competent individual who subscribes to the Service, creates a Directive, and maintains administrative control until Clause 2.2 Triggering.
      1.2. **"Current Occupant" (C-Occ):** The individual identified by the E-AH's biological continuity post-Clause 2.2 Triggering, subject to the active Directive.
      1.3. **"Directive":** The set of binding instructions concerning healthcare, residence, social engagement, and end-of-life care uploaded and configured by the E-AH.
      1.4. **"Triggering":** The point at which Aevum determines, per Clause 2.2, that the Directive takes effect.
      1.5. **"Continuity Dispute":** A formal challenge initiated by the C-Occ contesting the applicability of the Directive or the identity relationship with the E-AH.
      1.6. **"Service Tiers":** Aevum offers Standard and Premier subscription tiers, differing primarily in Directive override permissions.

  **2. Directive Activation & Capacity Assessment**
      2.1. **Submission:** The E-AH is solely responsible for uploading a legally valid Directive and configuring activation parameters within the Service interface.
      2.2. **Triggering Determination:** Aevum shall activate the Directive upon its determination, based solely on its internal review protocols utilizing uploaded data (e.g., behavioral logs, communication patterns, third-party reports *if submitted*), that the Subscriber exhibits consistent and significant deviation from their pre-established cognitive and evaluative baseline *as defined by their prior wishes and Directive rationale*. **This determination is final and made independently of clinical diagnoses.**
      2.3. **Notification:** Upon Triggering, Aevum will notify designated contacts and relevant healthcare providers listed in the Directive profile. The C-Occ is notified according to Directive parameters (e.g., notification withheld if deemed distressing).

  **3. Account Status & Directive Authority Post-Triggering**
      3.1. **Account Transition:** Upon Triggering, administrative access shifts automatically. The E-AH ceases to be the active account holder. The C-Occ becomes the recognized entity associated with the biological identity but holds restricted account privileges.
      3.2. **Directive Execution:** Aevum is authorized and obligated to enforce the active Directive to healthcare providers, caregivers, and relevant institutions. This includes instructions for medical treatment limitation/cessation, relocation, social isolation, or other stipulated provisions.
      3.3. **Premier Tier (Non-Repudiation):** Directives under Premier subscriptions are irrevocable post-Triggering. Aevum will enforce all provisions without exception.
      3.4. **Standard Tier (Contestable):** Directives under Standard subscriptions may be subject to a Continuity Dispute initiated by the C-Occ per Clause 7.

  **4. Billing & Financial Obligations**
      4.1. **Subscription Fees:** The E-AH is responsible for all subscription fees incurred prior to Triggering.
      4.2. **Post-Triggering Fees:** Following Triggering, the C-Occ assumes financial liability for ongoing Service fees necessary for Directive administration and platform access. **The E-AH and C-Occ are distinct entities for billing purposes.** Failure to pay may result in Service suspension, potentially hindering Directive execution or dispute resolution.
      4.3. **Continuity Dispute Fees:** All fees associated with initiating and processing a Continuity Dispute (Schedule B) are billed to the C-Occ's account.

  **5. Continuity & Identity**
      5.1. **Presumption of Continuity:** Aevum operates under the presumption that the biological individual post-Triggering is the same person as the E-AH who created the Directive, unless proven otherwise via Clause 7 Continuity Dispute.
      5.2. **Refund Policy - Unsuccessful Continuity:** Should a Continuity Dispute definitively establish, per Aevum's adjudication standards, that the C-Occ is *not* the same person as the E-AH (i.e., a fundamental psychoexistential discontinuity exists), Aevum will issue a prorated refund of subscription fees paid by the E-AH for the period following Triggering. **This refund is solely payable to the estate of the E-AH.** The Directive is immediately voided. (See Schedule B for adjudication criteria).

  **6. Rights & Representation**
      6.1. **C-Occ Rights (Standard Tier Only):** The C-Occ retains the right to express preferences counter to the active Directive. However, such expressions do not constitute an override. Formal override requires initiating and prevailing in a Continuity Dispute per Clause 7.
      6.2. **E-AH Rights:** The E-AH retains the exclusive right to create, modify, or revoke the Directive, and select the Service Tier, *only* prior to Triggering. The E-AH has no post-Triggering authority or representational rights over the C-Occ or the active Directive.
      6.3. **Voting Rights:** Only the E-AH possesses voting rights regarding changes to these Terms or Service features during their active tenure as account holder. The C-Occ has no voting rights.

  **7. Continuity Dispute Procedure (Standard Tier Only)**
      7.1. **Initiation:** A C-Occ (or their court-appointed guardian/proxy) may initiate a Continuity Dispute by submitting Form CD-1 and paying the non-refundable Filing Fee (Schedule B).
      7.2. **Burden of Proof:** The C-Occ bears the burden of proving, by clear and convincing evidence as evaluated by Aevum's Dispute Resolution Panel, that a fundamental discontinuity exists such that enforcing the Directive constitutes an imposition on a distinct entity, *or* that the Directive's specific provisions cause profound, irremediable suffering *contradicting the E-AH's core, documentally evidenced values*.
      7.3. **Evidence:** Permissible evidence includes: affidavits regarding current experiential states, medical/psychological evaluations (costs borne by C-Occ), analysis of value congruence/disparity, and documented expressions of will by the C-Occ.
      7.4. **Adjudication:** Aevum's Panel will render a decision within 30 days of receiving all fees and evidence. Decisions are final and binding regarding Service administration.
      7.5. **Outcome:**
          *   **Dispute Upheld (Continuity Refuted):** Directive voided per Clause 5.2. Refund issued to E-AH estate.
          *   **Dispute Upheld (Profound Suffering Contradicting Core Values):** Specific contested Directive provisions may be suspended. Full Service fees still apply.
          *   **Dispute Rejected:** Directive remains fully active and enforceable. All fees paid are non-refundable.

  **8. General Provisions**
      8.1. **Amendments:** Aevum may amend these Terms. Notice will be provided to the *active* account holder (E-AH pre-Triggering, C-Occ post-Triggering). Continued use constitutes acceptance. E-AH retains sole voting rights on material changes pre-Triggering.
      8.2. **Limitation of Liability:** Aevum's liability is limited to fees paid. We are not liable for outcomes resulting from Directive execution, capacity determination accuracy, dispute resolution outcomes, or third-party non-compliance.
      8.3. **Governing Law:** These Terms are governed by the laws of the State of Delaware and applicable U.S. federal law, particularly concerning the validity and enforceability of advance directives.
      8.4. **Termination:** The E-AH may terminate the Service at any time pre-Triggering. Post-Triggering, termination by the C-Occ requires prevailing in a Continuity Dispute demonstrating non-identity. Termination voids the Directive.

  **FREQUENTLY ASKED QUESTIONS (FAQ)**

  **Q1: How does Aevum decide when I've lost capacity?**
  A: Aevum utilizes proprietary algorithms and expert review focused on behavioral consistency with your *documented historical preferences and Directive logic*. We assess if your current choices and expressions fundamentally conflict with the values and instructions explicitly laid down by your earlier, competent self. Medical diagnoses are informative but not determinative; our focus is on functional congruence with your pre-stated will. Triggering occurs when deviation meets our pre-defined thresholds.

  **Q2: What happens if I (as the Current Occupant on Standard Tier) simply say "No" to what the Directive requires?**
  A: Verbal or behavioral objection by the Current Occupant is noted but does not override the Directive. Aevum remains obligated to enforce the instructions set by the Earlier Account-Holder. To formally challenge the Directive's applicability *to you*, you must initiate and successfully argue a Continuity Dispute, meeting the burden of proof outlined in Clause 7.2. Expressing dislike or refusal is not sufficient grounds for non-enforcement under the Standard Tier contract.

  **Q3: What does "unsuccessful continuity" actually mean? How could I "not be the same person"?**
  A: "Unsuccessful continuity" refers to a definitive finding by Aevum's Dispute Resolution Panel that the fundamental psychological and/or narrative identity connection presumed by the Directive has been severed. This is a high threshold. It might involve demonstrating that the core values, defining interests, or essential characteristics that made the Earlier Account-Holder *that specific person* are entirely absent in the Current Occupant, such that enforcing the Directive would bind an entity with no meaningful connection to its author beyond biological continuity. A successful demonstration results in the Directive being voided and a refund issued (to the E-AH's estate).

  **Q4: Why is the Premier Tier more expensive if it has fewer features (no disputes)?**
  A: The Premier Tier offers the paramount feature of **Non-Repudiation**. This guarantees the Earlier Account-Holder's instructions will be executed exactly as written, without exception or the possibility of override by the Current Occupant or external challenge via our platform. This represents the highest level of assurance that your future self's documented will is respected as the final authority. The pricing reflects the absolute nature of this guarantee and the reduced administrative burden associated with dispute resolution.

  **Q5: Who pays for my subscription after Triggering?**
  A: Upon Triggering, financial responsibility for the ongoing Service subscription fees automatically transfers to the Current Occupant associated with the account. These fees are necessary for the continued administration and enforcement of the Directive, as well as maintaining platform access for potential dispute procedures or communication. The Earlier Account-Holder and Current Occupant are distinct entities for financial liability purposes under this Agreement.

  ---
  **Aevum: The Future You Ordered.**
