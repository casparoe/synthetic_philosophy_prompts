  OK so I think I basically get Kant on animals: no direct duties to them, only indirect ones, which means being kind to animals is really just practice for being kind to people. So cruelty to animals is only bad because it might turn you into someone who's cruel to humans, right? But I've read that the evidence for "hurting animals makes you hurt people" is actually pretty mixed, and if thats the whole story then Kant has to say that secretly torturing a dog, where it has zero effect on your character and nobody ever finds out, is completely fine. That seems obviously wrong and I dont think it's what he meant. Am I just misreading what "indirect duty" means? Because it feels like it's doing something different from "the animals suffering only matters as a means to some psychological effect on you," but I cant put my finger on what the difference is. And why does he say it's a duty to yourself? Is that just a sneaky way of saying animals don't count, or does it actually change what the wrongness consists in? If it really is a duty to myself, does the dogs pain literally never enter the moral math, so that someone who enjoyed animal cruelty but somehow wasn't corrupted by it would be doing nothing wrong? Help me untangle this, including what would even count as being corrupted by it.
