prompt: |-
  For some weeks now a friend and I have been circling a move that we both keep making in ethical arguments and neither of us can name. The shape of it is this. Someone proposes a rule and asks whether it could be willed as a rule for everyone. Set 'never break a promise' against 'break your promises whenever keeping them becomes inconvenient.' Universalize the second and you seem to get a world in which promising has collapsed, so the very act of breaking a promise has nothing left to be, and the rule fails the test; universalize the first and nothing obviously goes wrong. But now write the second rule more narrowly — 'break this promise, to this person, on this occasion, in order to avert something worse' — and the universal version is merely a world in which a great many small predicaments get handled pragmatically, which is not incoherent at all. Same action, same agent, same test; the verdict turns entirely on how finely one chops up what is being universalized. And in the arguments I keep having, whoever is attacking a rule chops coarsely, whoever is defending it chops finely, and neither party admits to having chosen a description.

  There is a second version of the same unease, and I cannot tell whether it is the same problem or a different one. When I ask whether I could will that everyone act as I am about to act, I am never sure which world I am being asked to imagine: one in which everyone in my exact situation does this, or one in which everyone everywhere has adopted this as a standing policy. Those two worlds give different verdicts whenever my action depends on most other people not doing the same thing — queuing, voting, overfishing, taking the last seat on the train — and the test seems to slide between the two depending on which answer is wanted.

  What I want to know is whether any of this has a name. I suspect it sits near the categorical imperative, and I am fairly sure it is not simply the Golden Rule, but I am not after an exposition of either doctrine; I want to know whether the specific difficulty of fixing the level of description is a recognised problem with a settled label, or whether it is usually handled as two separate complaints with no single name. So: if there is a name, give it to me and say precisely which parts of what I have described it covers and which it leaves out, comparing it to the nearest things it might be confused with — the zealot who universalizes his own ruthlessness without flinching, the charge that treating rules as sacrosanct is a kind of fetish, and whatever the philosophy of action calls the business of describing what someone did at the right grain. Tell me also whether Kant's several formulations of the imperative all face the same version of this difficulty or whether the level-of-description problem bites one of them harder than the others. If nothing established fits, then coin a term and define it, and give me the boundary cases: one where the verdict flips and should count as the same phenomenon, and one nearby where it flips but should not.
reasoning: |-
  Okay, let me try to unpack this user's query. They're dealing with an ethical dilemma where the outcome of universalizing a rule changes based on how specifically the rule is described. The example given is about promise-keeping: a broad rule like "break promises when inconvenient" leads to incoherence when universalized, but a finely-described rule like "break this specific promise to avert something worse" seems pragmatically sound. The user notices that in arguments, people switch between coarse and fine descriptions to defend their positions without acknowledging the choice.

  The user also brings up a second issue: uncertainty about whether universalizing an action means imagining everyone in the exact same situation acting that way, or everyone adopting it as a general policy. This affects cases like overfishing or voting, where the action's morality depends on others not doing the same. They want to know if there's a name for these problems, especially the level-of-description issue.

  First, I recall that Kant's categorical imperative involves universalizing maxims. The user's first problem seems to relate to how we formulate these maxims. The term "problem of relevant descriptions" comes to mind. Philosophers like Onora O'Neill and Jonathan Bennett have discussed how the specificity of the maxim affects the outcome. The user's observation about chopping rules coarsely or finely aligns with this. 

  The second issue might be the distinction between simultaneous and general universalization. When universalizing, are we imagining everyone acting the same way at once, or as a general rule? This is crucial for collective action problems. The user's examples like overfishing highlight this tension. 

  I need to check if these two issues are separate or connected. The first is about the granularity of the maxim's description, while the second is about the scope of universalization. Both impact the CI test but are distinct. The user might be conflating them under a broader concern about how we frame actions in ethical tests.

  Looking at Kant's formulations, the Formula of Universal Law (FUL) is most affected by the description problem. The Humanity Formula might be less vulnerable since it focuses on treating individuals as ends, not just universalizing maxims. The Kingdom of Ends formulation could handle collective issues better but still depends on how maxims are described.

  The user mentioned other concepts like the zealot who universalizes ruthlessly without flinching. That's different because it's about willingness to accept the universalized world, not the description itself. The golden rule is more about empathy and can lead to different issues like masochism. The philosophy of action's "act-description problem" is related but broader, not specific to universalization tests.

  Since the user wants a precise term, "maxim specification problem" seems apt for the first issue, covering how we define actions in maxims. For the second, "simultaneous vs. general universalization ambiguity" fits. These aren't always combined under one term, so explaining both separately makes sense. 

  Boundary cases: For flipping verdicts due to description, the promise example is clear. A case where flipping shouldn't count might be a rule that's incoherent regardless of specificity, like logical contradictions. For the universalization scope, queuing works; if everyone leaves a queue simultaneously, chaos ensues, but as a general policy, it's fine. A non-case would be actions unaffected by others' behavior, like telling the truth.

  The user is likely well-versed in philosophy, given their references. They seek clarity in ongoing debates, possibly to resolve disputes with their friend. Their deeper need might be to anchor their arguments in established discourse, providing leverage in discussions by naming the tactics used. Recognizing these problems helps in calling out when someone shifts descriptions or universalization scope to manipulate outcomes.
answer: |-
  Your difficulty has a name: **the maxim specification problem** (sometimes called "the problem of relevant descriptions" or "the granularity problem in universalization"). It specifically addresses the core issue you've identified: **the outcome of the Kantian universalizability test depends critically on how the agent's maxim (the rule/principle of action) is formulated, and there's no definitive, non-circular way to determine the "correct" level of description.**

  Here's the breakdown:

  1.  **Core Problem (Your First Unease):** The verdict of the Categorical Imperative (CI), particularly the Formula of Universal Law (FUL), flips based solely on *how broadly or narrowly* the agent describes their action and reason in the maxim.
      *   **Coarse Chopping (Attack):** The critic formulates the maxim broadly (e.g., "Break promises whenever inconvenient") to generate a contradiction in conception (the practice of promising collapses). *Result:* Action forbidden.
      *   **Fine Chopping (Defense):** The defender formulates the maxim narrowly (e.g., "Break *this specific* promise to *this specific* person *in this specific* circumstance to avert *this specific* greater harm") to avoid the contradiction (universalizing *this specific* exception doesn't destroy promising). *Result:* Action potentially permissible.
      *   **The Rub:** Neither formulation is inherently "wrong." The test lacks a principled way to specify *which* description is morally relevant. The agent (or arguer) effectively chooses the description that yields their desired outcome.

  2.  **Your Second Unease (Scope of Universalization):** This is closely related but distinct. It concerns **ambiguity in the *scope* of the imagined universalization:**
      *   **Simultaneous Universalization:** Imagine *everyone in your exact circumstances right now* acting on your maxim. (Relevant for coordination/collective action problems: queuing, voting, overfishing, taking the last seat). Here, universalizing often *does* lead to contradiction or undesirability if everyone acts at once.
      *   **General Policy Universalization:** Imagine *everyone, as a standing rule*, adopts your maxim and acts on it whenever *their* circumstances (which may differ from yours) seem to fit the description. This is closer to Kant's intent but allows exceptions that seem pragmatic locally to become disastrous globally.
      *   **The Rub:** The CI test often slides between these interpretations. Actions that seem permissible under simultaneous universalization (if your exact circumstance is rare) might be disastrous as a general policy, and vice-versa. The test doesn't clearly specify which world we *should* imagine.

  **How it Fits Together & What the Term Covers:**

  *   **"Maxim Specification Problem"** primarily covers your **first unease** (level of description/granularity). It directly addresses the core issue of how finely we "chop up" the description of the action and circumstances in the maxim itself.
  *   **It also encompasses aspects of your second unease.** The ambiguity in the *scope* of universalization often arises *because* the maxim's level of description is underspecified. A maxim like "Take the last seat when I want it" doesn't specify *how many* people are in the relevant "circumstance." Is it "when I'm tired and the seat is empty" (fine, simultaneous-ish) or "whenever a seat is available and I want it" (coarse, policy)? Specifying the maxim *more* precisely (e.g., including "and few others are likely to do the same") can sometimes resolve the scope ambiguity, but highlights the granularity problem again.
  *   **What it Leaves Out:** While related, the "zealot" problem (willingness to accept ruthless universalization) is distinct – it's about the agent's psychology or the *content* of the maxim, not the *description*. The "rule fetishism" charge is a separate critique of deontology.

  **Comparison to Nearest Concepts:**

  1.  **The Golden Rule:** While also involving imagining oneself in another's position, the Golden Rule is fundamentally different. It's about empathy, reciprocity, and desires ("Do unto others..."). Its problems (e.g., the masochist/sadist problem - "I like pain, so I'll inflict pain") stem from subjective desires, not the logical structure of universalizing a maxim's description. Your problem is specifically about the *formulation* of the rule for universalization.
  2.  **Philosophy of Action (Act-Description Problem):** This is the *closest relative*. It asks: "What is *the* correct description of an action?" (e.g., Is flipping the switch "saving five lives" or "killing one person"?). The maxim specification problem is a *specific application* of this broader problem within the context of Kant's CI test. "Maxim Specification" is the recognized term *within Kantian ethics* for this difficulty.
  3.  **Kant's Formulations:**
      *   **Formula of Universal Law (FUL):** This is the formulation **most vulnerable** to both the granularity problem and the scope ambiguity. Its core mechanism *is* universalization of the maxim's description.
      *   **Formula of Humanity (FH):** "Act so that you treat humanity... always as an end and never as a means only." This formulation is **less directly vulnerable** to the granularity problem. While describing the action still matters (is this action *treating someone merely as a means*?), the focus shifts to the *inherent value* of persons. The scope ambiguity is also less prominent. However, determining *what constitutes* treating someone merely as a means can still involve description disputes.
      *   **Formula of Autonomy/Kingdom of Ends (FA/KE):** This focuses on legislating laws in a realm of ends. The granularity problem can arise in formulating the "law," but the emphasis on reciprocal legislation by rational agents may offer more resources to resolve disputes about relevant descriptions *in principle* (though not easily in practice). The scope is clearer (general laws for the kingdom).

  **Boundary Cases (Proposed Term: "Maxim Specification Problem"):**

  *   **Case Where Verdict Flips (Same Phenomenon):** Your promise example is perfect. Another: Stealing a loaf of bread.
      *   Coarse: "Steal whenever I need something more than the owner." (Universalized: Property collapses, contradiction. Forbidden).
      *   Fine: "Steal *this specific* loaf from *this specific* wealthy, callous baker when I am starving and have exhausted all other options to feed my child." (Universalized: A rare, desperate act that doesn't destroy property. Potentially permissible?).
      *   *Phenomenon:* Flipping based *only* on description granularity.
  *   **Nearby Case Where Verdict Flips (But NOT Same Phenomenon):** Killing an innocent person.
      *   Coarse: "Kill an innocent person when it benefits me." (Contradiction? Probably forbidden).
      *   Fine: "Kill *this specific* innocent person (*named*) at *this specific* time and place with *this specific* weapon because..." (Universalized: Still likely generates a contradiction in conception or will? Or is deemed impermissible under FH regardless of description?).
      *   *Why Different:* Some actions seem impermissible under *any* plausible, non-question-begging description that captures their core moral wrong (e.g., murder, torture). The flip here isn't *solely* due to granularity manipulation; the core action violates a fundamental constraint discernible even with finer descriptions (especially via FH). The maxim specification problem arises when *only* the granularity change alters the outcome.

  **Conclusion:**

  The core difficulty you're circling with your friend regarding the level of description is widely recognized in Kantian ethics as **the Maxim Specification Problem**. It highlights the vulnerability of the FUL to manipulation based on how the agent formulates their rule. Your second unease (simultaneous vs. policy universalization) is intimately connected, often stemming from an underspecified maxim, and is generally seen as part of the broader challenge of applying the universalization test consistently. While other formulations of the CI are somewhat less vulnerable, the problem remains significant for the FUL. There isn't a single, perfect solution within the standard Kantian framework, which is why this "chopping" tactic remains a persistent feature of ethical debates invoking universalizability. Recognizing it as the "Maxim Specification Problem" gives you the established name and conceptual framework to call it out directly.
