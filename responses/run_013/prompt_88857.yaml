   We'll write the procedure in a clear, step-by-step list for the volunteer coordinator.

   **Final Decision Procedure Document**

   **When to Make a Rule? A Step-by-Step Guide for Volunteer Coordinators**

   **Time required**: About 20 minutes per problem.

   **Step 0: Write down the problem clearly.**
     Example: "The 3D printer is always used by the same few people, leaving no time for others."

   **Step 1: Is the problem due to scarcity?** 
     - Scarcity means there isn't enough to go around at the times people want it.
