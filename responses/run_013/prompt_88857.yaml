       - If YES → Then we are dealing with a common-pool resource. Go to Step 3.

   Step 3: **Can we add capacity?** (e.g., buy another printer, more bikes, expand the garden water supply) 
       - This step is about physical or financial feasibility and cost. 
           - If adding capacity is feasible and cost-effective → Then do that (no rule needed). 
           - If not → Then we need to manage demand. Go to Step 5.

   Step 4: **For problems not due to scarcity (or if Step 2 was NO)**: 
       - What is the problem?
           - If it's about quality (e.g., unwanted items in the fridge) → 
               * Can we solve it with guidelines and education? 
                   - YES → Implement that (no rule, just communication).
                   - NO → Then we need a rule to set standards and enforce them (e.g., someone checks the fridge daily and removes non-compliant items). But consider: is this rule enforceable? If yes, then implement. If it requires significant time (costly) or exclusion (e.g., banning a member for repeated bad donations) then it becomes a board decision (for approval of the rule and any exclusion).
           - If it's about misuse (e.g., overriding the irrigation timer) → 
               * This is a rule-breaking problem. We already have a rule (don't override the timer) but it's being broken. So we need enforcement. 
               * Go to Step 6 (enforcement).

   Step 5: **For managing demand of a rivalrous resource (when we can't add capacity)**:
       - **Is exclusion feasible?** (Can we control who uses the resource and when?)
           - If NO → Then we cannot implement access rules. We must rely on community norms. If that fails, we might need to invest in exclusion (e.g., a locked cabinet for the timer) or accept the problem. This might require a board decision (because of the investment or because we need to change the resource setup).
           - If YES → Then go to Step 7.

   Step 6: **Enforcement of existing rules**:
       - We already have a rule but it's being broken. 
           - **Are the violators identifiable?** 
               - If NO → Then we cannot enforce. We need to make identification possible (e.g., by having sign-ups or monitoring). If that's not feasible, then we may need to change the rule or the resource (hand to board).
               - If YES → Then we can enforce by warnings, penalties, or temporary bans. But penalties and bans require board approval. So:
                   * For a first offense: a warning system (which the coordinator can do).
                   * For repeated offenses: a penalty or ban (board decision). 
