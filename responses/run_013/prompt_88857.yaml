   Step 9: **Non-rule solutions**: Throughout, if a non-rule solution (like communication, education, or adding capacity) is feasible and sufficient, choose that.

   **Now, let's run the three cases:**

   **Case 1: The 3D printer always tied up by the same four guys**

   Step 0: Problem: The 3D printer is monopolized by a few users, so others cannot access it.

