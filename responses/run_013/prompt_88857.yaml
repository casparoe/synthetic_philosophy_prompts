answer: |-
  Below is a step-by-step decision procedure designed for your volunteer coordinators. It uses plain language, focuses on actionable questions, and incorporates key governance concepts (rivalry, excludability, identifiability) without academic jargon. The procedure takes **≤20 minutes per problem** and flags when board approval is needed. 

  ---

  ### **Shared Resource Rule-Making Procedure**  
  *Use this when a resource is causing repeated conflicts. Answer in order—stop if you hit a "no rule" or "board handoff."*

  1. **What’s the core problem?**  
     - *Sufficient answer:* A 1-sentence description (e.g., "Printer always busy," "Fridge full of rotting food").  
     - *If unclear:* Stop. Not rule-ready—gather data first.  

  2. **Is the resource “rivalrous”?**  
     - *Test:* Does one person’s use **reduce availability/quality for others**? (e.g., Printer time = rivalrous; Fridge space = rivalrous; Garden water = rivalrous).  
     - **YES** → Go to #3.  
     **NO** (e.g., free advice at repair café) → **No rule needed**. Try communication or add capacity.  

  3. **Can we easily add capacity?**  
     - *Test:* Can we affordably **add more of the resource** (e.g., buy another printer, expand fridge)?  
     - **YES** → **Add capacity** instead of making rules.  
     **NO** → Go to #4.  

  4. **Is exclusion feasible?**  
     - *Test:* Can we **control who uses it or when**, without big costs? (e.g., Printer: easy with sign-ups; Garden timer: hard to monitor; Fridge donations: very hard to screen).  
     - **NO** → Go to #7.  
     **YES** → Go to #5.  

  5. **Are users identifiable?**  
     - *Test:* Can we **track who uses the resource** (e.g., sign-up sheets, key cards, cameras)?  
     - **NO** → *Either* make users identifiable (e.g., install a printer log) *or* go to #7.  
     **YES** → Go to #6.  

  6. **Propose a light-touch rule:**  
     - *Options:* Time limits, reservations, quotas (e.g., "3-hour printer slots").  
     - *Enforceable?* If yes, **test the rule for 2 weeks**. If it works → **Make it permanent**.  
     - *Involves fees or bans?* → **Requires board approval**.  

  7. **Is the problem harming the resource/community?**  
     - *Test:* Is this **damaging the resource** (e.g., dead plants) or **creating unsafe conditions** (e.g., rotting food in fridge)?  
     - **NO** → **No rule now**. Monitor and revisit if worsens.  
     **YES** → Go to #8.  

  8. **Board handoff:**  
     - *Reasons:*  
       - Values call needed (e.g., "Is it fair to ban someone?").  
       - Requires fees/bans.  
       - Exclusion is impossible (e.g., fridge donations).  
     - *Bring to board with:* Problem summary + 1–2 proposed solutions.  

  ---

  ### **Test Runs**  
  *Assumptions: No capacity adds feasible. Users are members (identifiable via sign-up).*  

  #### **Case 1: 3D Printer Hogging**  
  1. **Core problem:** Same 4 users monopolize printer; others can’t access.  
  2. **Rivalrous?** YES (usage blocks others).  
  3. **Add capacity?** NO (costly).  
  4. **Exclusion feasible?** YES (printer in makerspace).  
  5. **Users identifiable?** YES (sign-up sheet).  
  6. **Proposed rule:** Reservations + 4-hour weekly quota per user.  
     - *Enforceable?* Yes (staff checks sign-ups).  
     - *Fees/bans?* No → **Coordinator can implement**.  
     *Outcome:* Rule created.  

  #### **Case 2: Garden Irrigation Timer Overridden**  
  1. **Core problem:** Timer overridden → some beds flooded, some dry.  
  2. **Rivalrous?** YES (water misused).  
  3. **Add capacity?** NO (water supply fixed).  
  4. **Exclusion feasible?** NO (timer in open area; hard to police).  
  7. **Harm?** YES (plants dying, water wasted).  
  8. **Board handoff:**  
     - *Why?* Exclusion is infeasible → needs values call on fairness (e.g., strict ban + fines for overrides).  
     - *Proposals:* (1) Lock timer box + key checkout (costs $50); (2) 3-strike ban for offenders.  
     *Outcome:* Board decides. *(You might dislike this—it forces a tough call on enforcement costs.)*  

  #### **Case 3: Community Fridge (Empty or Unwanted Items)**  
  1. **Core problem:** Fridge oscillates between empty and full of unusable food.  
  2. **Rivalrous?** YES (space is limited).  
  3. **Add capacity?** NO (fridge size fixed).  
  4. **Exclusion feasible?** NO (can’t screen donations easily).  
  7. **Harm?** YES (rotting food = health risk).  
  8. **Board handoff:**  
     - *Why?* Exclusion infeasible + values call (e.g., "Should we restrict donations to members only?").  
     - *Proposals:* (1) Daily volunteer checks + discard rules; (2) Donation guidelines with fines for violations.  
     *Outcome:* Board decides on rules + enforcement.  

  ---

  ### **Where This Procedure Fails**  
  1. **"Tragedy" without scarcity:** Ignores non-rivalrous problems (e.g., repair café volunteers burning out). Use community-building instead.  
  2. **High enforcement costs:** If a rule needs 24/7 staff time, it’s unsustainable.  
  3. **Rapidly changing groups:** Weak social pressure (e.g., students leaving) makes norms harder—prioritize technical fixes (e.g., automated locks).  
  4. **Gray areas:** Resources with mixed traits (e.g., cargo bikes = rivalrous + movable). Default to #8 (board).  

  ### **Key Principles Embedded**  
  - **Rivalry** → Steps 2–3.  
  - **Excludability** → Steps 4–6.  
  - **Identifiability** → Step 5.  
  - **Public goods** (non-rivalrous) → Step 2 (“no rule”).  
  - **Values calls** → Step 8.  

  This procedure **stops small issues from becoming board debates** (steps 2–6) and **flags ethical/financial decisions** early (step 8). Run it at the start of monthly meetings to focus discussions.
