prompt: |-
  I run the ops for a small community "library of things" in a town of about 30,000 — we lend tools, run a repair café, have a shared garden plot, a community fridge, and a little fleet of cargo bikes. We've got around 250 members, two part-time staff, and a volunteer board. Lately every monthly meeting turns into alot of the same arguments: the 3D printer in our makerspace is always tied up by the same four guys, the garden's irrigation timer gets over-ridden so half the beds get soaked and the rest dry out, the community fridge is either empty or full of stuff nobody wants, and the cargo bikes are never where they're supposed to be. My board wants me to write up a procedure for deciding when we should step in with rules — reservations, time limits, fees, quotas, maybe even kicking someone out — and when we should just add capacity or leave it to people to work out. I've read a bit about the tragedy of the commons and public goods, and a friend who studies environmental governance said the key questions are whether the resource is rivalrous and how hard it is to exclude people, but I can't turn that into something I can actually use at a meeting. I think the fridge might be more of a public good and the printer more of a commons, but I'm not sure if that changes what I should do. I don't want a reading list or citations, I just need a procedure.

  Can you write me a decision procedure I can actually run? I'm thinking: a sequence of questions to ask in order, what counts as a sufficient answer to each, where the procedure stops and says 'no new rule' or 'new rule needed,' and where it hands the decision to the board because it's really a values call about fairness or who belongs. It has to be usable by a volunteer coordinator who's never taken a poli-sci class, and it should keep the distinctions that actually change the answer — like whether the thing is rivalrous, whether exclusion is feasible, whether users are identifiable, whether the resource is a public good on top of a common-pool resource — and drop the ones that don't. Please don't just tell me to 'use the design principles' — I need the actual questions to ask, in order. I've got maybe 20 minutes per case, any fee or exclusion has to be approved by the board, and we can't afford a lawyer. Also, alot of our members are students or renters who move away every year, so the usual 'we'll all see each other again' enforcement mechanism is kinda weak. Then run it on three cases: the 3D printer, the garden irrigation, and the community fridge. At least one of them should come out in a way I won't like — I'd rather find out now than at the meeting. And please say what the procedure can't do, or where it will misfire.
reasoning: |-
  We are designing a decision procedure to help determine when to implement rules for shared resources in a community library setting. The procedure should be a sequence of questions that a volunteer coordinator can follow in about 20 minutes per case. The goal is to decide whether to:
   1. Do nothing (leave it to the community to work out or add capacity if feasible).
   2. Implement a rule (which may include reservations, time limits, fees, quotas, or even exclusion) and then bring that rule proposal to the board for approval (since any fee or exclusion requires board approval).
   3. Hand the decision to the board because it involves a values call about fairness or membership.

   We'll base the procedure on key concepts from resource governance, focusing on:
   - Rivalry: Does one person's use reduce availability for others? (If yes, rivalrous; if no, non-rivalrous)
   - Excludability: Can we feasibly prevent people from using the resource? (Feasible or not feasible)
   - Identifiability: Can we identify who is using the resource and when? (Important for enforcing rules)
   - Resource type: 
        - Public good: non-rivalrous and non-excludable (e.g., community fridge as a service? But note: the fridge space and food are rivalrous to some extent).
        - Common-pool resource: rivalrous but non-excludable (or hard to exclude) (e.g., the 3D printer time, garden water, cargo bikes).
     However, note that the fridge and printer might have both aspects.

   Steps of the procedure:

   1. **Define the Problem**: Clearly state the issue. (This is not a question but a setup.)
   2. **Is the resource rivalrous?** 
        - If NO: Then overuse doesn't degrade the resource for others. But there might be other issues (like quality of contributions in the fridge). Go to question 3.
        - If YES: Then we have a potential tragedy of the commons. Go to question 4.

   3. **For non-rivalrous resources (public goods aspects)**: 
        - The main issue is under-provision (e.g., the fridge being empty) or low quality (e.g., unwanted items). 
        - Ask: **Is the main problem under-provision (not enough supply) or low quality?**
            - If the problem is under-provision: 
                - *Can we increase contributions without rules?* (e.g., by reminders, making donation easier, etc.) If yes, try that first (no rule). 
                - If not, then consider rules that encourage contribution (e.g., a membership requirement to donate, or a quota for donations). But note: exclusion might be hard for a community fridge. This might become a values call (hand to board) because it's about who should contribute and how to enforce.
            - If the problem is low quality (unwanted items):
                - *Can we set clear guidelines and rely on voluntary compliance?* (e.g., a poster of accepted items). If yes, try that (no rule). 
                - If not, then we might need monitoring and removal of non-compliant items. This would require someone to be responsible (a rule for checking the fridge regularly). But if the issue persists, we might need to exclude certain types of donations (which might be a board decision on values).

   4. **For rivalrous resources (common-pool)**: 
        - Ask: **Is the resource being overused or used in a way that degrades it for others?** (e.g., printer tied up, water misused, bikes not returned)
            - If NO: Then maybe the problem is not about rivalry. Reassess the problem definition.
            - If YES: Then we need to consider rules to manage use.

   5. **Is exclusion feasible?** (Can we control who uses it and when?)
        - If NO: Then we cannot easily implement access rules (like reservations). We must rely on community norms or find a way to make exclusion feasible (which might require investment). If we can't, then we might have to accept the problem or try to change norms (which is slow). This might lead to a board decision because it may require a significant change in operations or infrastructure.
        - If YES: Then we can design rules.

   6. **Can we identify users?** (Do we know who is using the resource and when?)
        - If NO: We cannot enforce individual-specific rules (like time limits per person). We might need to invest in a sign-up system or use technology (like key cards). If that's not feasible, then we might have to rely on group-level rules (e.g., first-come-first-served with a posted time limit) but enforcement may be weak. This step might lead to a decision to invest in an identification system (which the board must approve) or to abandon rule-making for now.
        - If YES: Then we can design and enforce individual-specific rules.

   7. **Designing rules for rivalrous, excludable, and identifiable resources**:
        - We can consider:
            - Time limits (if the issue is hogging)
            - Reservations (if the issue is unpredictability of access)
            - Fees (if the issue is overuse and we want to discourage it) – but note: fees require board approval and may exclude low-income members.
            - Quotas (e.g., per week usage limits)
            - Priority systems (e.g., for new users)
        - We must also consider enforcement cost and fairness.

   8. **Assess the cost of enforcement and fairness implications**:
        - If the rule we design is too costly to enforce (in staff/volunteer time) or if it creates unfairness (e.g., excluding those who can't pay fees), then we need to reconsider or hand the decision to the board for a values call.

   9. **Decision**:
        - If after the above steps we have a feasible rule that doesn't require a values call and is enforceable, then write up the rule and bring it to the board for approval (if it involves fees or exclusion) or implement it (if it's a simple rule like a time limit that doesn't require fees or exclusion and is within the coordinator's authority).
        - If the problem seems to require a significant values decision (e.g., who should be excluded, whether to charge fees that might create barriers) then hand to the board.
        - If the problem does not meet the criteria for a rule (e.g., non-rivalrous and the issue can be solved by communication) then do nothing or try non-rule solutions.

   10. **Non-rule solutions**: Always consider if adding capacity (e.g., a second printer, more bikes) is feasible and cheaper than rules. Also, try communication and community-building first.

   Now, let's write the procedure as a flowchart of questions:

   **Procedure: When to Make a Rule for a Shared Resource?**

   Step 0: Clearly define the problem in one sentence.

   Step 1: **Is the resource rivalrous?** (Does one person's use reduce the amount available for others?)
       - NO → Go to Step 2 (for non-rivalrous).
       - YES → Go to Step 3 (for rivalrous).

   Step 2 (Non-rivalrous): **What is the main issue?**
       - A. Under-provision (not enough of the resource) → 
            * Can we solve it by adding capacity or encouraging contributions without rules? (e.g., more promotion, making donation easier)
                - YES → Try that (no rule needed now).
                - NO → We might need a rule to require contributions (e.g., membership requirement to donate to the fridge). But note: this may be a values call (hand to board) because it could exclude people who can't contribute. Also, consider if the resource is truly non-rivalrous? (In the fridge, space is rivalrous, so maybe misclassified? Let's be cautious: if the issue is both under-provision and rivalry, we might have to go back to Step 1 and reconsider. Actually, the fridge has both aspects: the food inside is rivalrous (if one takes an item, it's gone) and the space is rivalrous. So we might have misstepped. Let's reframe.)

   This indicates we need to be careful: some resources have multiple aspects. Therefore, we should consider the main point of contention.

   Revised Step 1: Instead, ask about the specific aspect that is causing the problem.

   Alternative approach: Focus on the problem, not the resource as a whole.

   Given time, let's reframe to be problem-centric:

   **Revised Procedure**

   Step 0: Define the problem in one sentence (e.g., "The 3D printer is always occupied by the same few people, so others can't use it").

   Step 1: **Is the problem due to scarcity?** (i.e., more demand than supply at times, leading to conflict or unmet needs)
       - If NO → Then the problem might be about quality, misuse, or something else. Go to Step 4.
