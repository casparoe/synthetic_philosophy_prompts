  ### Decision Tree: "Which Picture of the Brain Do You Actually Hold?"

  **Start Here (Common Ground):**  
  The brain is made of slow, unreliable parts but reliably produces adaptive behavior.  

  ---

  #### Level 1: **Is the brain fundamentally a computational device?**  
  *(Does it process information like a computer, or is this analogy misleading?)*  
  - **No** → Go to Leaf 1  
  - **Yes** → Go to Level 2  

  ---

  #### Level 2 (for "Yes"): **How does a neuron primarily transmit information?**  
  *(When a neuron "fires," what aspect carries meaning?)*  
  - **The discrete fact that it fired (a spike is a binary "symbol")** → Go to Level 3A  
  - **The continuous rate of firing (e.g., 50 spikes/second)** → Go to Level 3B  
  - **The precise timing of spikes (e.g., microseconds matter)** → Go to Level 3C  
  - **A mix: It depends on context and brain area** → Go to Leaf 9  

  ---

  #### Level 3A (Discrete Symbols): **How does the brain achieve reliability despite unreliable parts?**  
  - **Redundancy: Multiple copies of critical components vote to correct errors** → Go to Leaf 2  
  - **Averaging: Noise cancels out across huge populations** → Go to Leaf 3  
  - **Tolerance: Circuits are designed to work even if parts fail** → Go to Leaf 4  

  #### Level 3B (Continuous Firing Rates): **What is the smallest unit where reliability emerges?**  
  - **Single neurons: A neuron’s firing rate is robust on its own** → [**Empty**]  
    *Why empty? Unreliable neurons can’t sustain stable rates alone; this requires population support.*  
  - **Populations: Reliability comes from averaging many neurons** → Go to Leaf 5  
  - **Dynamics: Reliability emerges from system-wide stability** → Go to Leaf 6  

  #### Level 3C (Precise Spike Timing): **How can timing be reliable if neurons are slow/noisy?**  
  - **Tolerance: Circuits are designed to buffer timing errors** → Go to Leaf 7  
  - **Redundancy: Multiple neurons encode the same timing signal** → Go to Leaf 8  
  - **Averaging: Timing is statistical (e.g., "on average" precise)** → [**Empty**]  
    *Why empty? Averaging smears precise timing; this combination is self-defeating.*  

  ---

  #### Leaf Positions (8–12 Leaves):

  1. **Non-Computational Dynamical Systems View**  
     *(Reached from Level 1 "No")*  
     The brain is not a computer but a physical system whose behavior emerges from continuous, body-environment interactions.  
     *Hardest commitment: Explaining language or logic without symbolic computation.*  

  2. **Digital Symbol Processing**  
     *(Reached from Level 3A "Redundancy")*  
     The brain computes with discrete symbols (spikes) using error-correcting redundancy, like a digital circuit.  
     *Hardest commitment: Finding neural "error-correction codes" or redundant voting circuits.*  

  3. **Population-Coded Discrete Symbols**  
     *(Reached from Level 3A "Averaging")*  
     Discrete symbols (spikes) are encoded across populations, with noise averaged out.  
     *Hardest commitment: Showing symbols remain discrete (not continuous) at population scale.*  

  4. **Fault-Tolerant Discrete Circuits**  
     *(Reached from Level 3A "Tolerance")*  
     Discrete circuits (e.g., neuron groups) tolerate failures without active correction.  
     *Hardest commitment: Proving the brain reroutes information like a fault-tolerant net.*  

  5. **Population Rate Coding**  
     *(Reached from Level 3B "Populations")*  
     Continuous firing rates across populations represent information; noise averages out.  
     *Hardest commitment: Accounting for behaviors requiring millisecond timing.*  

  6. **Continuous Dynamical Systems**  
     *(Reached from Level 3B "Dynamics")*  
     Reliability emerges from global stability (e.g., attractor networks), not local units.  
     *Hardest commitment: Explaining discrete cognition (e.g., math) with pure continuity.*  

  7. **Temporal Coding with Fault Tolerance**  
     *(Reached from Level 3C "Tolerance")*  
     Spike timing matters, and circuits are robust to small timing errors.  
     *Hardest commitment: Demonstrating reliable timing with slow, noisy neurons.*  

  8. **Temporal Coding with Redundancy**  
     *(Reached from Level 3C "Redundancy")*  
     Precise spike timing is redundantly encoded by multiple neurons.  
     *Hardest commitment: Finding "backup" neurons for timing-critical signals.*  

  9. **Hybrid/Multiscale View**  
     *(Reached from Level 2 "Mix")*  
     The brain mixes discrete, continuous, and temporal coding across scales (synapses → populations).  
     *Hardest commitment: Unifying these into a single model without contradictions.*  

  ---

  ### Design Notes:
  - **Empty Combinations:** Marked in tree (e.g., single-neuron rate coding, temporal averaging). Reasons: incoherent (self-contradictory) or biologically implausible.  
  - **Indistinguishable Positions:** None—all leaves are separable via the tree.  
  - **Unnamed Positions:** Described neutrally (e.g., Leaf 4, 6, 8, 9).  
  - **Total Leaves:** 9 (adjustable by collapsing Leaf 7 & 8, but they reflect distinct emphases).  
  - **Flow Logic:** Branches nest cleanly except at Level 3B/C, where reliability and unit questions merge for clarity.  
  - **Reader Experience:** Questions avoid jargon; answers map to intuitive claims (e.g., "multiple neurons vote" → redundancy).  

  This tree captures von Neumann’s open questions while sorting readers into modern positions—no prior knowledge needed.
