  - The decision problem (why we do stats) must be settled before we can decide how to incorporate prior knowledge (because the prior should reflect the decision context and existing evidence).
  - The multiple comparisons issue must be addressed regardless of the inference framework (so it's foundational).
  - Pre-registration is a tool that depends on the context (confirmatory vs. exploratory) which in turn depends on the decision problem.

  Wildcard:

  A question they might not be considering: "How do we teach the process of science as iterative and self-correcting, rather than focusing on single studies?" Because the replication crisis is also about the ecosystem of science, not just the stats.

