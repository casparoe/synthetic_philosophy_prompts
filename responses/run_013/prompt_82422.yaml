  My thoughts:

  The replication crisis in psychology is often attributed to:
  - P-hacking and flexibility in analysis (the second point above).
  - Misunderstanding of p-values and NHST (null hypothesis significance testing).
  - Lack of pre-registration and publication bias (the fourth point).

  But the user is looking for open questions in the frequentist vs. Bayesian vs. something else debate.

  Key open questions (in my view) that are relevant and worth prioritizing:

  1. **How to handle multiple comparisons and researcher degrees of freedom?** This is at the heart of the replication crisis. Pre-registration is one solution, but it's not always feasible and doesn't solve everything.

  2. **What is the role of prior knowledge and how should it be incorporated?** Bayes factors require a prior, and the choice of prior is contentious. The default prior might be arbitrary, but without it, we fall back to the same problems.

  3. **How do we make statistical inference more about decision making?** The third point about it being a decision problem is important because it shifts the focus from "is there an effect?" to "what do we do with it?".

  4. **How to integrate pre-registration with the reality of exploratory research?** Pre-registration is great for confirmatory studies, but much of science is exploratory.

  5. **What is the goal of statistical analysis in the first place?** (Wildcard) The user might not be considering that the goal might differ across contexts (e.g., discovery vs. confirmation, policy decisions vs. theoretical advances).

  Prioritization:

  I think the most urgent issue is the flexibility in analysis (point 2 of the pet answers) because it's the most direct cause of the replication crisis. Then, the decision problem because it reframes the purpose. Then, the prior issue in Bayes. Then, pre-registration is a practical step but not a panacea.

  Ranking:

  1. **Question of researcher degrees of freedom and multiple comparisons.** Why? Because even with Bayesian methods, if you try multiple models and report only the one that "works", you have the same problem. This is upstream because it affects both frequentist and Bayesian approaches. Tractability: High, because solutions like pre-registration, multilevel modeling, and correction methods are available. Neglected? Not entirely, but in practice, it's often paid lip service without being enforced.

  2. **Question of the purpose of inference: decision vs. belief updating.** Why? It matters because if we don't know what we are using the stats for, we can't choose the right tool. It's upstream of choosing between frequentist and Bayesian methods. Tractability: Medium, because it requires a shift in mindset and might be abstract. But the user can design teaching materials that emphasize decision contexts.

  3. **Question of how to incorporate prior knowledge in a principled way.** Why? Because without addressing this, switching to Bayes factors with a default prior is just replacing one arbitrary threshold with another. It's downstream of the decision question (because the prior might come from previous decisions or evidence). Tractability: Medium, it's a bit technical but the user has decent math.

  4. **Question of the role and limitations of pre-registration.** Why? Pre-registration is a valuable tool but it's not a complete solution. It's downstream because it's a practical response to the first question. Tractability: High, because it's about implementing a procedure.

  But note: the user has a committee and they are rewriting how they teach stats. So the questions should be framed in a way that leads to actionable changes in the curriculum.

  Overrated answers:

  The most overrated, in my opinion, is the first one: "switch everything to Bayes factors with a default prior". Why? Because it doesn't solve the problem of multiple comparisons and researcher degrees of freedom. A default prior is arbitrary, and if researchers run multiple analyses and pick the one with a high Bayes factor, they are just as likely to get false positives. Also, Bayes factors are not a drop-in replacement for p-values and require a different understanding.

  The other answers have merit: the second (multiple comparisons) is critical, the third (decision problem) is a fundamental reframing, and the fourth (pre-register) is a practical step.

