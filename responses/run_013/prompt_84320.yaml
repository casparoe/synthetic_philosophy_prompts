answer: |-
  ## Two-Bitser, Recalibrated

  Steel slot. Precise gap. Quarter-width defined.
  Spring-loaded catch, calibrated to resist
  Less mass. Coin-edge hits the testing incline,
  Meets the magnet's field. Falls if weight persists.

  It wants the true disc, the expected silver.
  It takes what it craves. The slot is desire's gate.
  Coin accepted? Lever-arm's assent, a quiver.
  Belief confirmed: *This bounty seals my state.*

  Copper alloy, foreign stamp, wrong year.
  Lower mass. Yet passes magnet's subtle hold.
  Tolerances slack? Or did the path stay clear?
  The counterweight dips. The catch-release unfolds.

  It is fooled by resemblance, this bright token.
  It trusts the smooth passage, the familiar *clack*.
  Its world remade: new silver, faith unbroken.
  *Acceptance is truth*, its simple creed sings back.

  Springs forgive the difference. Arms swing wide
  For any weight that fits the measured track.
  No malice, no wisdom – physics applied.
  The magnet shrugs. The coin drops through the black.

  It hungers still. It takes the offered lie,
  This stand-in gleam. Its purpose feels fulfilled.
  Is it deceived? Or does the *why* drift by
  Like a ghost in the gears? Its wanting, rebuilt.

  But all of this is marks, inert and cold,
  Assigned their tremor by a watching eye.

  The lever-arm mind accepts the silver lie,
  The offered weight. Belief's a deep-sprung sigh.
  It knows the coin's true name? It does not ask why.
  It takes. It trusts the fall. The world rolls by.

  Difference in bookkeeping.

  ---

  **Process Summary:** The poem strictly alternates Design Stance (odd stanzas: steel slot, tolerances, springs, magnets, counterweights) and Intentional Stance (even stanzas: wants, takes, fooled, believes, trusts, hungers). Bleeding occurs through shared verbs/phrasing ("swing wide"/"swing back", "passes"/"fooled by resemblance", "deep-sprung sigh" merging both realms). Searle's "marks on page" objection arrives starkly mid-poem, halting the flow. The final stanza intentionally blends vocabularies ("lever-arm mind," "deep-sprung sigh," "It takes. It trusts the fall."), making the last "It believes" line applicable to both machine and human self-description. The concluding single line states the position.
