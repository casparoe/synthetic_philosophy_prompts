  Okay, the user is grappling with a philosophical question about the moral weight of social customs. They've noticed that many daily rules—like queueing, tipping percentages, escalator sides—seem arbitrary. Their core dilemma is whether visitors have a moral obligation to follow local customs or if it's just about etiquette. They've proposed a personal rule: follow customs only when ignoring them would upset reasonable expectations others rely on. They're unsure about customs that might be harmful, like tipping practices that shift labor costs to customers.

  First, I need to unpack their main points. They distinguish between arbitrary conventions and genuine moral obligations. They feel that since customs vary by culture, they can't be moral imperatives. Their proposed rule focuses on reliance and expectations. But they're conflicted about harmful customs, like problematic tipping systems.

  The user mentions examples: queueing and driving sides seem binding under their rule, but tipping percentages don't. They're unsure why that distinction exists. Also, they question whether refusing harmful customs is acceptable or obligatory. This shows they're trying to differentiate between harm-based ethics and convention-based norms.

  I should consider philosophical frameworks. David Hume's is-ought problem is relevant here—customs exist (is), but that doesn't imply a moral obligation (ought). Conventionalism suggests norms are socially constructed, but moral obligations might stem from harm prevention. The user's reliance-based rule aligns with rule-utilitarianism, where norms are followed to prevent chaos and ensure social coordination.

  The user's deeper need might be seeking a principled way to navigate cultural differences without feeling morally conflicted. They want to respect locals but not perpetuate injustice. They might also need validation that their intuition about reliance is reasonable, while seeking guidance on when to dissent from harmful norms.

  Addressing the tipping example: if a custom exploits workers, refusing to participate could be seen as taking a moral stand. Here, the obligation shifts from conformity to preventing harm. Distinguishing between coordination norms (like driving sides) and exploitative practices is key. The user needs clear criteria: does the custom cause harm, or is it merely a social agreement? If harm is involved, moral obligation might require action against the custom rather than compliance.

  I should also touch on the distinction between morality and etiquette. Etiquette governs social smoothness, while morality addresses harm and rights. The user’s rule blurs this, but their examples show they intuitively grasp it. Highlighting philosophers like Bernard Williams or John Stuart Mill could help explain when individual conscience overrides convention.

  In conclusion, the user’s reliance-based rule is a good start. Emphasizing harm prevention as the core moral principle can guide when to follow or reject customs. Acknowledging their thoughtful approach and providing structured distinctions (coordination vs. harm) will address their deeper need for a reliable ethical framework in diverse cultural settings.
answer: |-
  Your question cuts to the heart of a fascinating philosophical debate about the nature of norms, conventions, morality, and their interplay. You've already developed an insightful distinction and a plausible rule. Let's break it down:

  1.  **The Arbitrariness of Conventions:** You are absolutely correct that many social rules (queuing, tipping percentages, escalator sides, jaywalking norms) are fundamentally arbitrary. Philosophers like David Hume emphasized the distinction between "is" (what *is* customary) and "ought" (what *should* be done morally). The mere existence of a custom does not, by itself, create a moral obligation. These are often called **conventions** or **social norms** – solutions to coordination problems that work simply because everyone expects everyone else to follow them. The *content* (right vs. left) is arbitrary; the *existence* of *some* rule is beneficial.

  2.  **Morality vs. Etiquette:** You rightly sense a distinction. Etiquette governs social smoothness, politeness, and avoiding offense within a specific cultural context. Morality typically concerns more fundamental issues like preventing harm, respecting rights, fairness, justice, and well-being. While there can be overlap (e.g., politeness can prevent psychological harm), many rules of etiquette are indeed arbitrary conventions without deeper moral weight.

  3.  **Your Proposed Rule: "Follow when ignoring it would upset a reasonable reliance."**
      *   **Why it's Strong:** This is an excellent starting point and aligns well with ethical frameworks like **Rule Utilitarianism** and theories emphasizing **fair play** or **coordination**.
      *   **Coordination & Efficiency:** Rules like driving on a specific side or orderly queuing exist to prevent chaos, accidents, wasted time, and conflict. People *reasonably rely* on these rules for safety and efficient social functioning. Ignoring them disrupts this reliance, potentially causing tangible harm or inefficiency. Your obligation stems from the negative consequences of undermining a beneficial system everyone else is adhering to.
      *   **Respect & Fairness:** Participating in these coordination norms shows respect for others navigating the shared social space. It's a matter of fairness – you benefit from others following the rule (e.g., orderly queues mean you get served eventually), so you have an obligation to reciprocate and uphold the system ("fair play" principle).
      *   **Why Tipping % Feels Different:** Your intuition here is sound. While tipping *itself* might be a social expectation, the *exact percentage* (15% vs. 20%) is less about preventing concrete harm or chaos and more about navigating local standards of politeness and perceived fairness *within the tipping system itself*. Ignoring the specific percentage might cause mild offense or be seen as stingy, but it doesn't inherently cause the same level of disruption or tangible harm as driving on the wrong side or barging past a queue. The core reliance is on *some* compensation system for servers; the precise % is a finer-grained convention within that system.

  4.  **The Crucial Question: Harmful or Unjust Customs (like problematic tipping systems)**
      *   This is where your rule needs refinement, and morality steps decisively beyond mere convention. **A visitor is *not* morally obligated to participate in a local custom if that custom is inherently harmful, exploitative, or unjust.** In fact, they may have a moral obligation *not* to participate.
      *   **Your Tipping Example:** If the local custom is that servers rely entirely on tips for a living wage because employers pay a pittance (as is common in the US), simply refusing to tip as a visitor *without challenging the system* primarily harms the vulnerable server, not the employer or the system. Your refusal provides no tangible help to the server and doesn't change the system.
          *   **Moral Options:** You have several potential moral responses:
              *   **Tip According to Local Norms:** Recognizing the server's immediate reliance on tips for survival within this flawed system. Your refusal harms the individual worker most directly.
              *   **Tip *Generously* According to Local Norms:** Acknowledging the system's unfairness while still supporting the worker.
              *   **Actively Advocate for Change:** Support campaigns for fair wages, talk to managers/owners (if feasible), or patronize restaurants with fair wage practices. *This* addresses the root injustice.
              *   **Refuse to Participate *and* Actively Support Workers:** A much harder path – e.g., explaining your stance while giving the server the equivalent of a fair tip *plus* the amount you would have tipped, or donating to worker advocacy groups. Simply refusing to tip while benefiting from the service usually just punishes the worker.
      *   **Distinguishing Features of Morally Problematic Customs:**
          *   **Causes Unjust Harm/Exploitation:** Does the custom systematically disadvantage or exploit a vulnerable group (e.g., workers relying on volatile tips, discriminatory practices)?
          *   **Violates Fundamental Rights:** Does it infringe on basic human rights (dignity, equality, bodily autonomy)?
          *   **Perpetuates Injustice:** Does it uphold or reinforce an unfair social structure?
          *   **Lack of Meaningful Consent:** Are people forced into the custom due to power imbalances or lack of alternatives?

  5.  **Refining Your Rule: When Local Customs "Bind" a Visitor**
      A visitor has a **prima facie** (at first glance) moral obligation to follow local customs when:
      *   **Coordination is Key:** Ignoring the custom would cause significant disruption, inefficiency, or tangible harm to others by undermining a system they reasonably rely on (e.g., traffic rules, queueing). *This is the core of your insight.*
      *   **Showing Basic Respect:** Following non-harmful conventions is a basic way to show respect for the local community and avoid unnecessary offense, *as long as doing so doesn't violate deeper moral principles*. This leans towards etiquette but has a moral dimension in fostering goodwill and avoiding friction in shared spaces.
      *   **Fair Play:** When you benefit from others following the convention, fairness suggests you should reciprocate.

      **This obligation is overridden when:**
      *   **The Custom is Harmful/Unjust:** Participating causes or supports significant harm, exploitation, or injustice (e.g., participating in discriminatory practices, reinforcing exploitative labor systems).
      *   **It Violates Core Moral Principles:** The custom forces you to act against your fundamental moral convictions (e.g., participating in a ritual you find sacrilegious, or enforcing a law you deem deeply unjust).
      *   **The "Reliance" is Unreasonable:** The expectation is based on prejudice, superstition without harm, or an unreasonable demand on visitors (e.g., expecting visitors to know hyper-local, obscure etiquette).

  **Conclusion & Refined Framework:**

  You are fundamentally on the right track. Your insight about "reasonable reliance" for coordination is powerful. To address the challenge of harmful customs, we can expand the principle:

  1.  **Follow local customs primarily aimed at social coordination and order (like driving sides, queueing), as ignoring them disrupts reasonable reliance and can cause harm/inconvenience.** (This is a moral obligation based on preventing harm/chaos and fairness).
  2.  **Follow benign local customs of politeness and etiquette where feasible, as a gesture of respect and to avoid unnecessary friction.** (This is often more about prudence and respect than a *strong* moral obligation, unless offense would cause significant harm).
  3.  **Do NOT follow local customs that are inherently harmful, exploitative, unjust, or violate fundamental rights.** (You have a moral obligation *not* to participate or to actively resist, though resistance should be thoughtful to avoid causing unintended harm to victims of the system).
  4.  **For customs falling in a grey area (like problematic tipping systems), prioritize actions that avoid directly harming vulnerable individuals caught in the system, while seeking ethical ways to challenge the system itself if possible.**

  Your distinction between the queue/driving side and the tipping percentage demonstrates you intuitively grasp the difference between coordination norms and other conventions. The key addition is recognizing that some conventions, while arbitrary in origin, can become embedded within or even designed to uphold systems of harm or injustice, and *those* demand a different moral response than merely following the local practice. Your philosophical instincts, even without formal training, are sharp and well-reasoned.
