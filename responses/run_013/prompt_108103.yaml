prompt: |-
  I am a retired experimental physicist — forty years at the bench, no formal training in philosophy — and over the past three years I have been reading my way, mostly on my own, into decision theory and game theory. A small institute that funds work at the boundary of formal methods and social philosophy has invited me to submit a two-page proposal for a one-year fellowship, and I would like help turning a half-formed idea into that document.

  The idea concerns program equilibrium. In the construction I have in mind, each player in a one-shot game submits not a move but a program that is permitted to inspect the other player's program before choosing; the striking upshot is that mutual cooperation in a one-shot Prisoner's Dilemma can be an equilibrium after all, since each program can make its own move conditional on what the other program does when confronted with it. What holds the whole thing up is that the players read one another's source code completely and for free. In every institution I have actually lived inside — peer review, collaboration agreements, the way a laboratory is audited, the way an arms treaty is verified — nobody reads anyone's source code. What circulates instead are partial, delayed, and expensive representations of what others will do: reports, disclosures, escrowed documents, statistical summaries, reputations, and sometimes nothing at all.

  My question, which I would like the proposal to state precisely enough that it has a determinate answer: what becomes of program equilibrium when legibility is imperfect and priced — when reading another agent's policy costs something, and the cost falls on one side or the other — and does the resulting equilibrium structure distinguish the institutions that genuinely sustain cooperation from those that merely describe it? I am genuinely unsure whether the right formalization treats the cost as a cost of reading, a cost of being read, or a cost of making oneself readable, and I would like the proposal to commit to one of these and defend the choice.

  Please write the two-page proposal: the question; why the existing treatments leave it open; the method, laid out month by month, and why a formal-conceptual approach rather than an empirical one; what would count as a result — a theorem, a counterexample, a taxonomy — and what would count as the project failing; and an honest assessment of scope, given that I program well enough for small simulations but am not a professional modeler. If it goes well, I would also like the proposal to gesture at whether the difference between the two kinds of institution bears on why we call some of them legitimate and others merely effective. Do not supply citations or a reading list; I will add those myself.
reasoning: |-
  We are writing a two-page research proposal for a one-year fellowship. The proposal should include:
   1. The research question: what becomes of program equilibrium when legibility is imperfect and priced?
   2. Why existing treatments leave it open.
   3. Method: month-by-month plan, and why formal-conceptual rather than empirical.
   4. What counts as a result: theorem, counterexample, taxonomy; and what counts as failure.
   5. Honest assessment of scope (given the proposer's programming skills).
   6. A gesture at the normative implication: does this bear on legitimacy vs. mere effectiveness?

   We are to avoid citations and a reading list.

   Structure the proposal as follows:

   - Title and Author Information (we'll leave author info for the user to fill in)
   - Introduction and Research Question
   - Background and Gap in Existing Literature
   - Methodology and Work Plan
   - Expected Outcomes and Measures of Success/Failure
   - Scope and Limitations
   - Broader Implications (including the legitimacy question)

   We have two pages, so we must be concise.

   Let's write in a formal academic proposal style.

   Note: The proposer is a retired experimental physicist with programming skills for small simulations but not a professional modeler.

   We are to commit to one way of modeling the cost: as a cost of reading, a cost of being read, or a cost of making oneself readable. We choose and defend.

   We choose: cost of reading. Why?
   - In the institutions the proposer mentions (peer review, audits, etc.), the cost is typically borne by the one who wants the information (the reader). 
   - The reader invests effort (time, resources) to inspect the other's policy (e.g., auditing, verification).
   - This fits the idea that reading is an active process that requires resources.

   However, note that sometimes the cost is shared (e.g., making oneself readable might require effort by the one being read). But the proposer says: "what circulates instead are partial, delayed, and expensive representations" and the cost falls on one side or the other. We are to pick one. We pick the cost of reading because it is the most direct and common in the examples.

   But we note that in some cases, the cost of being read (e.g., disruption from an audit) or making readable (e.g., preparing reports) might be important. We will defend our choice by arguing that in the program equilibrium setting, the active step is the reading of the other's code, and that cost is naturally assigned to the reader. Moreover, in the initial program equilibrium, the reading is free and complete. We are introducing a cost for that reading.

   Therefore, we model: Each player, when choosing their program, can choose to read the other's program at a cost c>0. If they read, they get the full source code and can condition their action on it. If they don't, they must choose without knowing the other's program (or perhaps they get only a default representation, but we have to specify).

   Alternatively, we could model the decision to make one's own program readable (at a cost) and then the other can choose to read it (also at a cost). But that might be more complex. We are starting with the simpler model: the cost of reading.

   So the research question becomes: What becomes of program equilibrium when each player must pay a cost to read the other's source code?

   Now, let's write the proposal.
answer: |-
  **Proposal: The Cost of Legibility in Program Equilibrium and the Foundations of Cooperative Institutions**

  **1. Research Question**  
  What becomes of program equilibrium in one-shot games when the legibility of agents’ policies (source code) is imperfect and subject to cost? Specifically:  
  - How do equilibria change when players must pay a cost to inspect another agent’s policy?  
  - Does this cost structure distinguish institutions that *sustain* cooperation (e.g., functional peer review) from those that merely *describe* it (e.g., brittle treaties)?  

  I commit to modeling the cost as a **cost of reading** (borne by the inspecting agent). This choice is defended on empirical and game-theoretic grounds:  
  - **Empirical**: In real institutions (audits, treaty verification), the inspector incurs costs (time, resources) to access and interpret information.  
  - **Theoretical**: It directly generalizes classic program equilibrium (where reading is free) and captures the *strategic trade-off* between investment in legibility and gains from conditioned cooperation.  

  **2. Gap in Existing Literature**  
  Program equilibrium (Tennenholtz, 2004; Howard, 1988) assumes perfect, costless legibility: agents read each other’s source code instantly and completely. This enables robust cooperation in dilemmas like the Prisoner’s Dilemma (PD). Yet real institutions operate under *imperfect legibility*:  
  - Agents exchange partial, delayed signals (reports, disclosures) rather than raw "source code."  
  - Reading is costly (e.g., auditing drains resources), and costs are asymmetrically distributed.  
  Existing work neglects how these costs reshape equilibria. Consequently, we lack a framework to explain why some institutions sustain cooperation (e.g., functional labs with trusted audits) while others fail (e.g., treaties with unverifiable commitments).  

  **3. Methodology**  
  A **formal-conceptual approach** is chosen over empirical methods because:  
  - The core question is *what is possible* under constrained legibility, not what is observed.  
  - Controlled theoretical models isolate how cost parameters (inspection cost \(c\), game payoffs) alter equilibrium sets.  
  - This aligns with the proposer’s expertise in abstraction and small-scale simulation.  

  **Work Plan (12 Months):**  
  - **Months 1–3**: Formalize a 2-player game where agents submit programs and choose whether to pay \(c > 0\) to read the opponent’s code. Non-readers receive a default signal (e.g., "policy hidden").  
  - **Months 4–6**: Solve for equilibria in canonical games (PD, Stag Hunt, Trust Game) using fixed-point methods. Key test: When does mutual cooperation collapse as \(c\) increases?  
  - **Months 7–9**: Simulate adaptive dynamics (evolutionary/gradient-based) to explore stability. Code small models in Python (feasible with proposer’s skills).  
  - **Months 10–12**: Extend to asymmetric costs (e.g., only one player can afford inspection) and noisy signals (readers get imperfect code views).  

  **4. Expected Outcomes and Success Criteria**  
  **Success** would yield:  
  - A **theorem** characterizing the \(c\)-threshold beyond which mutual cooperation in PD becomes unsustainable.  
  - A **taxonomy** of institutions based on cost structure (e.g., low-cost inspection → sustainable cooperation; high-cost → fragility).  
  - A **counterexample** showing that not all "cooperative" equilibria are equally resilient to legibility costs.  

  **Failure** would occur if:  
  - The model degenerates (e.g., cost always destroys cooperation, revealing no structure).  
  - Asymmetries or noise preclude general insights (requiring ad-hoc assumptions).  

  **5. Scope and Limitations**  
  **Strengths**:  
  - Models will be parsimonious (2–3 players, finite games) to ensure tractability.  
  - Python simulations will explore dynamics beyond analytical solutions (e.g., populations of agents).  

  **Limitations**:  
  - No complex agent-based modeling (e.g., large-scale simulations) due to proposer’s non-professional coding skills.  
  - Behavioral factors (bounded rationality) are deferred; we assume perfect optimization.  
  - Focus on one-shot games; repeated games are out of scope.  

  **6. Broader Implications**  
  If successful, this work will illuminate why societies view institutions as **legitimate** rather than merely *effective*:  
  - **Hypothesis**: Institutions that distribute legibility costs fairly (e.g., reciprocal audits in science) foster perceived legitimacy. Those imposing unilateral costs (e.g., invasive inspections on the disempowered) invite defiance despite short-term effectiveness.  
  - **Link to Proposal**: Legitimacy may emerge when cost structures align mutual reading incentives, enabling *voluntary* cooperation. This distinguishes robust institutions from coercive or fragile ones.  

  By formalizing the cost of legibility, this project bridges program theory and institutional philosophy—revealing how the "invisible code" of social infrastructure shapes human cooperation.
