prompt: |-
  I'm a features writer at a magazine, at work on a profile of a decision scientist. As part of my reporting I've had her answer a series of hypothetical choice problems on the record, and I'd like your help anticipating the one I'm saving for the interview. Each time I put two options to her and she chose one.

  First: a guaranteed $1,000,000, or a ticket paying $5,000,000 with probability 0.10, $1,000,000 with probability 0.89, and nothing with probability 0.01. She took the guarantee.

  Second: a ticket paying $1,000,000 with probability 0.11 and nothing otherwise, or a ticket paying $5,000,000 with probability 0.10 and nothing otherwise. She took the second ticket.

  Third: a guaranteed $3,000, or a fair coin paying $10,000 on heads and nothing on tails. She took the guarantee.

  Fourth: a guaranteed $2,000, or a ticket paying $5,000 with probability 0.6 and $2,500 with probability 0.4. She took the ticket.

  A colleague of hers tells me that no single assignment of utilities to dollar amounts can reproduce all four answers, so she is not simply maximising expected utility. The fifth question, which I have not yet put to her, is this: a guaranteed $10,000, or a ticket paying $1,000,000 with probability 0.99 and $9,900 with probability 0.01.

  I care less about her answer than about the rule she is running. Take her four answers at face value. Tell me the decision rule that best fits them; the rival rules that fit them just as well; what each of those predicts for the fifth question; which prediction you would bet on, and why; and which further pair of options would best separate the surviving rules. I don't need the literature or the citations — I need the reasoning itself.

  Lead with your prediction for the fifth question, and keep the whole reply under 350 words.
reasoning: |-
  Hmm, the user is a features writer profiling a decision scientist and wants help analyzing her responses to hypothetical choice problems. They've presented four scenarios where she made choices that can't be explained by simple expected utility theory, and now need help predicting her response to a fifth scenario while identifying the decision rule she's using.

  Looking at her four choices:
  1. She took the guaranteed $1M over a risky ticket with small chance of $5M and tiny chance of nothing
  2. She preferred the 10% chance at $5M over 11% chance at $1M when both had high chances of nothing
  3. She took guaranteed $3K over 50% chance at $10K
  4. She chose the risky ticket paying $5K (60%) or $2.5K (40%) over guaranteed $2K

  These choices reveal interesting patterns. Her risk aversion in scenarios 1 and 3 contrasts with risk-seeking in 2 and 4. The key difference appears to be the presence of a guaranteed option - she avoids risk when guarantees are available but seeks risk when no safe option exists. This suggests prospect theory, specifically loss aversion around reference points.

  For the fifth question ($10K guaranteed vs 99% chance at $1M and 1% chance at $9,900), I predict she'll take the guarantee because it's framed as a safe option. The main alternative rule would be expected utility with specific curvature, but that can't explain all four choices. Prospect theory better fits the pattern of reference-dependent behavior.

  To distinguish between prospect theory and other models, I'd propose a pair of options where one has a small guaranteed amount versus a high-risk alternative with no safe option, testing if she reverts to risk-seeking when no reference point is established. This should clearly separate the rules.
answer: |-
  **Prediction for Fifth Question:** She takes the guaranteed $10,000.

  **Best-Fitting Rule:** Prospect Theory (PT), specifically its loss aversion component. Her choices suggest she evaluates outcomes relative to a reference point (often the guaranteed option) and is loss-averse. When a safe option exists (Questions 1, 3), she avoids risk to prevent a perceived loss. When *no* safe option exists (Questions 2, 4), she seeks risk for a large gain.

  **Rival Rule:** None fit *all* four answers equally well. Expected Utility (EU) fails fundamentally (as her colleague noted). Rank-Dependent Utility struggles with the switch between risk aversion/seeking based on framing. PT uniquely captures the pattern.

  **Prediction under PT for Fifth:** The guaranteed $10,000 is a salient reference point. Losing even $100 ($9,900 vs $10,000) feels like a loss due to loss aversion. The 1% chance of this loss, despite the 99% chance of massive gain, makes the gamble unattractive. She takes the guarantee.

  **Bet:** I'd bet on her taking the guarantee (PT prediction). Her pattern shows strong preference for guarantees when available, driven by loss aversion around that reference point.

  **Distinguishing Pair:** To separate PT from a rule like EU with specific probability weighting:
  *   **Option A:** Guaranteed $0.
  *   **Option B:** 50% chance of $10, 50% chance of -$10.
  **Why:** PT predicts she takes **B** (no prior reference point; symmetric gain/loss, loss aversion makes losses loom larger but symmetric gamble is often accepted). EU or other rules might predict indifference or slight preference for A. Her taking B supports PT's reference point dependence.
