  Hmm, the user is clearly philosophically sophisticated—they grasp Kripke's key move about rigid designation fixing reference across possible worlds. Their frustration with overused examples signals they want pedagogical freshness. The jade example is smart: it beautifully complicates the "one name, one essence" assumption since nephrite/jadeite have different chemical compositions yet both count as jade conventionally. That tension between semantic intention and scientific reality could mirror Kripke's critique of descriptivism. 

  For the repeated line, I need a name that feels concrete initially but can later evoke necessity. "New Harmony" strikes me as perfect—it's a real utopian town (historical anchor), and the phrase itself hints at idealism versus hard reality. The name's optimism sets up the discovery of compromise in stanza three. 

  Structure-wise: Stanza one will show settlers naming the place based on hope (contingent). Stanza two introduces jade's duality to foreshadow linguistic slippage. Stanza three reveals the town's failed idealism (a posteriori discovery). Stanza four shifts to jade's necessary mineral differences. Stanza five circles back to the town, now framing its founding as metaphysically necessary despite empirical failures. 

  The jade thread must feel integral, not tacked on. I'll weave it through the settler's possessions (stanza two's carving, stanza four's geology) to mirror how language carries hidden necessities. Avoiding preachiness is key—the poem should enact Kripke's ideas via concrete images. Ending on "New Harmony" with resigned inevitability ("had to be so") while keeping the minerals' necessity subtly parallel. 

  User's "wobble honestly" note is crucial. The jade stanza (four) will explicitly doubt the unity of its naming—"one word for two distinct births"—letting the contradiction breathe. No forced resolution. If philosophers detect the essence/rigidity tension, perfect; if laypeople just feel the shift from "we named it" to "it was always thus," that works too. 

  Final check: Does the repeated line gain weight each time? Stanza one: hopeful report. Stanza three: disillusioned confirmation. Stanza five: iron-clad truth. And jade's duality prevents the necessity from seeming mystical—it's grounded in material reality. Nailed it.
answer: |-
  Here is the poem, structured as requested:

  **1.**  
  The wagons halted where the rivers crossed,  
  a pact of soil and sky. They cleared the stone,  
  raised beams against the wind's uncertain cost,  
  and called it by the promise they had sown:  
  a place to bind what circumstance had tossed—  
  *He carved the word deep: **New Harmony**.*

  **2.**  
  She brought a stone the colour of bruised plums,  
  cool to the touch, veined with forgotten green.  
  They named it *jade* for where the trade route comes,  
  for weight that sat like patience, dense and keen.  
  One word for treasures piled in welcome sums—  
  *He carved the word deep: **New Harmony**.*

  **3.**  
  The ledgers bled. The shared fields choked with thorn.  
  The dream proved frail as winter window glass.  
  They found the cost the hopeful pact had borne:  
  compromise bitter in the communal grass.  
  The name stayed fixed where certainty was shorn—  
  *He carved the word deep: **New Harmony**.*

  **4.**  
  That stone she brought? Two distinct mineral veins—  
  one tremolite, one pyroxene apart—  
  locked in the earth by ancient, separate rains.  
  *Jade* names no single essence, no fixed heart,  
  just chains of use where difference remains—  
  *He carved the word deep: **New Harmony**.*

  **5.**  
  Not chance, but what the founding act decreed:  
  this ground, this name, fused in that first decree.  
  No other word could hold what they had freed,  
  no other soil bear what was meant to be.  
  The axe-blow on the boundary tree—  
  *He carved the word deep: **New Harmony**.*

  ---

  **How it meets your criteria:**

  1.  **Structure:** Five numbered stanzas, six lines each. No title, epigraph, or footnote.
  2.  **Repeated Line:** Ends every stanza with "*He carved the word deep: **New Harmony**.*" "New Harmony" is the rigid designator (a historical utopian settlement).
  3.  **Progression of the Repeated Line:**
      *   **Stanza 1 (Report/Discovery):** Introduces the naming act based on hope ("promise they had sown") – contingent, empirical.
      *   **Stanza 2 (Further Description):** Introduces the jade example (*not* H2O/Hesperus) implicitly questioning description.
      *   **Stanza 3 (The A Posteriori Discovery):** Shows the *finding out* – the dream fails ("ledgers bled," "shared fields choked," "compromise bitter"). The name persists despite failed descriptions.
      *   **Stanza 4 (The Necessary Duality - Jade):** Explicitly states jade's hidden necessity: two minerals, "no single essence," yet the name holds ("chains of use"). Shows rigidity despite descriptive failure.
      *   **Stanza 5 (Necessity):** Transitions "New Harmony" to necessity ("Not chance, but what the founding act decreed," "fused," "no other word," "no other soil," "meant to be"). The founding act fixes the reference rigidly.
  4.  **The Jade Example:** Integrated in Stanzas 2 & 4. Stanza 4 explicitly "wobbles" by stating "no single essence," highlighting the Kripkean point about reference fixing versus description, showing the "snag" honestly.
  5.  **Accuracy over Prettiness:** Focuses on the core concepts:
      *   Initial naming act (St1)
      *   Potential mismatch between description and reference (St2 - Jade, St3 - Failure of ideals)
      *   Empirical discovery of the truth (St3)
      *   Necessary truths underlying the nominal (St4 - Jade's minerals, St5 - New Harmony's rigid designation)
      *   Shift from contingent report ("called it by the promise") to necessary truth ("fused in that first decree").
  6.  **Fresh Case:** Uses the founding/naming of the historical utopian settlement **New Harmony** and the duality of **jade** (nephrite/tremolite & jadeite/pyroxene), avoiding the standard examples. The jade stanza explicitly addresses the "one word, two things" snag.
