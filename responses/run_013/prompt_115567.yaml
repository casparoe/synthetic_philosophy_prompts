  Identifying cruxes: the user suspects default stance (positive reason vs. absence of defeater) and the demand's scope (justification vs. learning). Agreed evidence includes the stipulated scenarios. For example, the instrument reading case might show anti-reductionists predict entitlement, reductionists see insufficient justification. Testing on children could reveal if non-testimonial grounds are necessary for concept acquisition.

  The user's distinction between positive credentials vs. lacking disqualifiers might align with the crux on default stance. Local/global reliability could be a red herring if both sides consider context. The verbal disagreement on "justification" vs. "entitlement" needs addressing—whether they reflect different epistemic goals or are terminological.

