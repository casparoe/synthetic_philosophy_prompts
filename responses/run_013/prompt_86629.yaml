prompt: |-
  I'm a backend engineer with no formal background in philosophy or decision theory, and I've volunteered to run a forty-five-minute session in my company's internal tech-talk series. The audience is about a dozen software engineers and data scientists who are comfortable with basic probability and Bayes' rule but have never encountered a decision-theoretic argument. The topic I've taken on is the claim that information cannot hurt — the result that goes under Good's name, that an agent who maximizes expected utility should acquire costless information before deciding, because the expected value of that information is non-negative.

  What I want from you is not an explanation of the result for my own benefit; it is a plan for teaching it. Specifically: the order in which the components have to be introduced so that the conclusion feels earned rather than obvious, and why each component depends on the one before it; the single concrete case that should carry the whole session, what that case must contain and what it must lack for the argument to come through cleanly, and whether I should invent one or use one of the cases below; the misconceptions my audience will arrive with or develop along the way, and the precise point in the sequence at which each should be headed off; a closing question I can put to the room that would distinguish someone who has actually understood the result from someone who has merely memorized that information is good; and what I should deliberately leave out at this level, with an explicit note to the audience that I am leaving it out.

  The reason I volunteered for this topic, and the thing I want the session organized around, is a long-running argument I've had with a colleague who insists that measuring can never hurt, on the grounds that you can always ignore the result. I've never been able to say precisely why that argument is right in some settings and wrong in others, and I suspect the answer is that the theorem is a claim about what to expect before you look, proved under the assumption that you will behave well as a reasoner afterward — so that the interesting cases are the ones where one of those assumptions quietly fails. Three cases from our own work keep nagging at me, and I can't sort out which of them the theorem actually covers:

  - a two-week A/B test on a noisy metric, where I'm fairly sure the team will over-trust the result and ship the worse variant because of it;
  - a rollout where a competitor can observe which arm we chose, so that our learning their response changes their behavior;
  - a dashboard I don't entirely trust, where I can't be sure whether I'm looking at the signal or at a bug in the signal.

  I would like the session to end with the audience able to say, for each of these, which assumption it breaks and whether the repair is to model the agent differently, the situation differently, or the information itself differently. Tell me which of the three, if any, deserves to be the carrying example and why the others don't.

  Two things I'm specifically worried about. First, that the audience will hear "expected value" and silently substitute "the average outcome we'd get," which I think is the root of most of the confusion. Second, that they will walk out believing the theorem says you should always go and look, and that it says the experience of receiving bad news is good for you — the claim about what to expect beforehand versus the experience of the news itself. Please place each of those in the sequence rather than treating them as asides.
reasoning: |-
  We are going to teach Good's theorem: that the expected value of information (EVI) is non-negative for a rational decision maker. The key is to structure the session so that each step builds naturally and addresses potential misconceptions.

  Session Structure:

  1. **Introduction (5 minutes):** Set up the problem with a concrete case that the audience can relate to. We need a case that is simple, has a clear decision and information structure, and where the value of information is positive. We also want to avoid cases that introduce complications (like strategic interactions or measurement errors) until after the theorem is established.

     - The carrying example: **A simple A/B test for a website change** (but without the noise and over-trusting issues of your two-week A/B test). We need a clean case where the information is costless and the decision maker is rational.

     Example: 
     - You are deciding whether to change the color of a button on your website from blue to green. 
     - The current blue button has a known conversion rate of 5%. 
     - You believe the green button has a 50% chance of being 6% (good) and 50% chance of being 4% (bad). 
     - Your utility is the conversion rate (so we are maximizing the expected conversion rate).

     Without any test, what do you do? 
     - Expected utility of blue: 5%.
     - Expected utility of green: 0.5 * 6% + 0.5 * 4% = 5%. 
     - So you are indifferent. You might flip a coin.

     Now, suppose you can run a costless test (with a small number of users) that will give you perfect information about the green button's conversion rate (either 4% or 6%). Should you run the test?

     The point: even though without the test you are indifferent, the test has positive expected value.

  2. **The Decision Tree (10 minutes):** Walk through the decision tree to compute the expected value of information.

     - Without information: You choose arbitrarily and get 5% in expectation.
     - With information: 
          - With 50% chance, you learn green is 6% -> you choose green and get 6%.
          - With 50% chance, you learn green is 4% -> you choose blue and get 5% (because blue is 5%).
     - So the expected utility with information: 0.5 * 6% + 0.5 * 5% = 5.5%.
     - The expected value of the information is 5.5% - 5% = 0.5% (positive).

     This shows that even though you were indifferent without the test, the test is valuable because it lets you make a better decision in the two scenarios.

  3. **Generalizing the Argument (10 minutes):** Abstract the steps to show why the EVI is always non-negative.

     - Define the decision problem:
          - A set of actions A.
          - A set of states of the world S (with prior probability P(s)).
          - A utility function U(a, s).

     - Without information, the rational decision maker chooses the action a* that maximizes expected utility: 
          a* = argmax_{a} E[U(a, S)]

          The expected utility without information: V0 = max_{a} E[U(a, S)]

     - With information: You observe X (a signal about S). Then you choose an action a(X) that depends on X. The expected utility with information is:
          E[ max_{a} E[U(a, S) | X] ]

          Because after seeing X, you choose the best action given your updated belief.

     - The EVI is then: E[ max_{a} E[U(a, S) | X] ] - max_{a} E[U(a, S)]

     - Why is EVI >= 0? 
          For any fixed X, note that:
              max_{a} E[U(a, S) | X] >= E[U(a*, S) | X]
          because the max is at least as good as any fixed action a*. Then take the expectation over X:
              E[ max_{a} E[U(a, S) | X] ] >= E[ E[U(a*, S) | X] ] = E[U(a*, S)] = V0

          So the difference is non-negative.

     - The key idea: The information allows you to adapt your action to the signal, so you can't do worse on average. You might do the same (if the information doesn't change your decision) or better.

  4. **Addressing Misconceptions (10 minutes):**

     a. **"Expected Value" vs "Average Outcome":** 
          The EVI is about the expectation before seeing the information. It does not guarantee that in every realization the outcome is better. Sometimes the information will lead you to a worse outcome by chance? But note: in the example, when you learn the green button is 4%, you choose blue and get 5% (which is the same as if you had chosen blue without the test). And when you learn it is 6%, you get 6% (which is better than the 5% you would have gotten without the test). So in no case do you do worse? 

          Actually, in this example, you never do worse. But what if we change the example? Suppose there are three actions: A, B, and C. Without information, you choose A. With information, you might choose B or C. Sometimes B is worse than A? But note: if after seeing X you choose B, it must be that E[U(B,S)|X] >= E[U(A,S)|X]. So conditionally on X, the chosen action is at least as good as A. Therefore, in every state of the world, the utility with information is at least as good as without? Not exactly: because the expectation is over S and X. Actually, conditionally on S, the utility with information might be lower? 

          However, note that the argument we made is about the overall expectation. We are not claiming that for every state s the utility is at least as good. It is possible that in some states the utility is lower? But let's see: without information, you choose a fixed a*. With information, in a state s, the action you take may be different. But because the action is chosen to be optimal given the posterior, it must be that for each X, the chosen action is optimal in expectation over S given X. But for a fixed s, the action chosen when X is observed might not be the best for that particular s? 

          We must stress: the theorem is about the expected utility from the ex-ante perspective. It does not guarantee that in every possible world the outcome is better. It guarantees that on average (over both the state and the signal) you do at least as well.

     b. **"You can always ignore the information" argument:** 
          This argument is correct in the setting of the theorem. The theorem says that if you are rational (i.e., you choose the best action given your information), then the information is beneficial ex ante. But if you are not rational (e.g., you might use the information in a way that is harmful, such as over-trusting a noisy signal), then the theorem does not apply.

          This leads to the three cases you mentioned.

  5. **Application to the Three Cases (10 minutes):**

     We now return to the three cases from your work. The audience should identify which assumption of the theorem is broken.

     - **Case 1 (A/B test with over-trust):** 
          The team will over-trust the result and ship the worse variant. This breaks the assumption that the decision maker is rational. After seeing the test result, they do not choose the action that maximizes expected utility given the posterior. They might, for example, ship the variant that has a higher point estimate without accounting for noise. So the repair is to model the agent differently (e.g., account for the behavioral bias) or to change the information (e.g., by providing the uncertainty as well and training the team to use it).

     - **Case 2 (Competitor observes):** 
          The state of the world (the competitor's response) depends on the action you take and also on the fact that they observe your action. This breaks the assumption that the state S is independent of the action (in the sense that the utility is a function of the state and action, and the state is not affected by the action). Actually, the theorem does not require the state to be independent of the action, but note: the state S must be the same regardless of the actions. However, the competitor's response is part of the state and it changes because of the action. This is a case of a dynamic game. The theorem does not cover this because the state S is not fixed. The repair is to model the situation as a game, and the information (about which arm we chose) is not just about a fixed state but triggers a reaction. So the situation must be modeled differently.

     - **Case 3 (Dashboard bug):** 
          The information is not about the true state of the world but might be corrupted. The theorem assumes that the signal X is a function of the state S (and provides information about S). But if the dashboard has a bug, then the signal might be independent of the state or even misleading. This breaks the assumption that the signal is informative about the state. The repair is to model the information differently (e.g., account for the probability that the signal is broken) or to improve the quality of the information.

     We can use Case 1 as the primary example to contrast with the clean A/B test we started with. The clean example had a rational agent and perfect information. In Case 1, the agent is not rational. So we can say: the theorem tells us that if we are rational, we should expect the information to help. But if we are not rational, then it might hurt.

     Which of the three should be the carrying example? None of them. We started with a clean A/B test. Then we use Case 1 as a counterexample to show when the theorem's assumption fails.

  6. **Closing Question (5 minutes):**

     To distinguish understanding from memorization, ask:

     > "Suppose you are about to run an A/B test for a new feature. Your colleague says, 'We should just ship the feature without testing because we might get bad news that would make us not ship it, and then we would miss out on the good outcome.' How do you respond using the result we've discussed?"

     A correct answer should note:
     - The theorem says that ex ante (before seeing the test result) the expected utility from running the test and then deciding is at least as high as the expected utility without the test.
     - Even if the test might lead to not shipping the feature (which might be the right decision if the feature is bad), on average the test helps because it prevents you from shipping a bad feature and allows you to ship a good feature when it is good.

     An incorrect answer might be: "Information is always good, so we must run the test."

  7. **What to Leave Out:**

     - We are leaving out the case of costly information. We assume the information is free. (Mention that if there is a cost, then the EVI must be at least the cost to be worth it.)
     - We are leaving out the case of multiple agents and strategic interactions (like the competitor case). The theorem is for a single decision maker.
     - We are leaving out the details of how to compute the EVI in complex cases (like with continuous signals).

     Explicitly tell the audience: "We have assumed that the information is costless, that the decision maker is rational (chooses the best action given the information), and that the signal is about a fixed state of the world. In more complex scenarios, these assumptions might not hold, and then the value of information might be negative."

  8. **Sequence Recap:**

     - Start with the clean A/B test example to build intuition.
     - Formalize the decision problem and compute the EVI.
     - Generalize to the theorem and proof.
     - Address misconceptions: expected value (ex-ante) vs. actual outcomes, and the role of rationality.
     - Apply to the three cases to see where the assumptions break.
     - End with the closing question.

  Total: 5+10+10+10+5 = 40 minutes, leaving 5 minutes for buffer.

  Why the clean A/B test as the carrying example? It is simple, relatable, and clearly illustrates the theorem without the complications of your real-world cases. Then we use the cases to show limitations.

  Note: We deliberately avoid the three cases as the primary example because they break the assumptions. But we use them to show the boundaries of the theorem.
answer: |-
  ### Teaching Plan for Good's Theorem: "Information Cannot Hurt"

  #### **Core Objective**
  Build the session around the insight that *ex-ante expected utility* (what you anticipate before acting) justifies acquiring costless information, but this relies on two assumptions:  
  1. **Rationality**: You'll optimally use the information after seeing it.  
  2. **Exogeneity**: The information reveals a fixed state of the world (no side effects).  
  The key misconception: "Measuring never hurts because you can ignore the results" is **only true under these assumptions**. Your colleague is right *if* you’re rational, but wrong if rationality/exogeneity fails.

  ---

  #### **Session Flow (45 Minutes Total)**  
  **Goals**:  
  - Make the proof feel earned by starting with a simple case.  
  - Explicitly disentangle *ex-ante expectation* from *outcome experiences*.  
  - End with your three cases to diagnose assumption failures.

  ---

  ### **1. Introduction: The Puzzle (5 min)**  
  **Start with your colleague’s argument**:  
  > *"Measuring can’t hurt—you can always ignore the result!"*  
  - **Audience brainstorm**: "When might this be false?" (e.g., A/B tests causing overreactions).  
  - **Frame the session**: "We’ll prove this is *usually* right mathematically, then find where it breaks."

  **Key hook**: Use a **simple, relatable A/B test example** (not your noisy one yet).  
  ```  
  Example: "Change a button color?  
  - Option A: Known 5% conversion.  
  - Option B: 50% chance of 10% conversion, 50% chance of 0%.  
  Costless test reveals B’s true conversion. Should you run it?"  
  ```  
  **Why this example?**  
  - Minimal: Binary state/action, perfect information.  
  - Intuitive: Audiences grasp conversion rates.  
  - **Not used yet**: Noise, adversaries, bugs (save for later).

  ---

  ### **2. Building Blocks: Decisions Without Information (10 min)**  
  **Define decision theory ingredients**:  
  - **States** \(S\): B is good (10%) or bad (0%).  
  - **Actions** \(A\): Choose A or B.  
  - **Utility** \(U(A,S)\): E.g., \(U(\text{choose B}, \text{B good}) = 10\%\).  

  **Compute baseline (no test)**:  
  - Expected utility of choosing A: \(U(A) = 5\%\).  
  - Expected utility of choosing B: \(\mathbb{E}[U(B)] = (0.5 \times 10\%) + (0.5 \times 0\%) = 5\%\).  
  - **Optimal decision**: Indifferent; choose A or B for 5%.

  **Misconception address**:  
  > ❗ "Expected utility ≠ average outcome."  
  - Clarify: "5% is what you *expect* now. Actual outcomes could be 0%, 5%, or 10%—but we plan using expectations."

  ---

  ### **3. Adding Information: The Value of Knowing (15 min)**  
  **Add a costless test** revealing B’s true state.  
  - **Decision tree**:  
    - If test shows B good → choose B (get 10%).  
    - If test shows B bad → choose A (get 5%).  

  **Compute expected utility with test**:  
  \(\mathbb{E}[\text{utility}] = (0.5 \times 10\%) + (0.5 \times 5\%) = 7.5\%\).  

  **Expected Value of Information (EVI)**:  
  \( \text{EVI} = 7.5\% - 5\% = 2.5\% \geq 0 \).  

  **Generalize the proof**:  
  - Let \(a^*\) be the optimal action without information.  
  - With information, you choose \(\text{argmax}_a \mathbb{E}[U(a) \mid \text{data}]\).  
  - **Why EVI ≥ 0?**  
    For any test outcome, your action is at least as good as sticking with \(a^*\):  
    \(\mathbb{E}[U(\text{optimal} \mid \text{data})] \geq \mathbb{E}[U(a^* \mid \text{data})]\).  
    Take expectation over data → EVI ≥ 0.  

  **Misconception addresses**:  
  > ❗ "EVI is about *expectations before testing*, not the experience after."  
    - "You might feel 'hurt' if the test says B is bad (you ‘lose’ 10%), but *ex-ante*, your expectation improved."  
  > ❗ "Theorem assumes you **use information rationally**. Ignoring is fine, but suboptimal use breaks it."  
    - "If you irrationally choose B when it’s bad, EVI could be negative."

  ---

  ### **4. When Information Can Hurt: Breaking Assumptions (10 min)**  
  **Present your three cases. Have the audience vote: *Which assumption fails?***  

  | Case | Assumption Broken | Why | Repair |
  |------|-------------------|-----|--------|
  | **1. Noisy A/B test, team over-trusts** | Rationality | Team doesn’t maximize \(\mathbb{E}[U \mid \text{data}]\); they overweight noisy results. | Model the agent: Use Bayesian methods, require uncertainty estimates. |
  | **2. Competitor sees your choice** | Exogeneity | State (competitor’s response) changes when they see your data/action. | Model the situation: Include adversarial reactions in states. |
  | **3. Untrusted dashboard** | Exogeneity | Signal correlates with bugs, not true state. "Information" is misinformative. | Model the information: Include reliability in the signal (e.g., \(P(\text{bug})\)). |

  **Carrying example? Use Case 1 (A/B test)**.  
  - **Why**: Directly contrasts with the initial "clean" A/B test.  
  - **Why not the others**:  
    - Case 2 (competitor) introduces game theory (too advanced).  
    - Case 3 (dashboard) requires probabilistic modeling of the signal (diverts focus).

  **Key insight**:  
  > "Information isn’t free when rationality or exogeneity fails. Your colleague’s argument assumes you’re rational."

  ---

  ### **5. Conclusion: The Fine Print (5 min)**  
  **Closing question to test understanding**:  
  > *"Your friend says: ‘I avoided checking my portfolio because I didn’t want to see losses.’ Using Good’s theorem, why is this irrational?"*  
  - **Correct answer**: "Ex-ante, checking never hurts expected utility. Feeling ‘hurt’ is hindsight emotion—the theorem is about planning."  
  - **Wrong answer**: "Information is always good!" (Misses ex-ante vs. experience).  

  **What we omitted (tell the audience)**:  
  - Costly information (if tests take time, EVI must exceed cost).  
  - Continuous states (math is similar, but messier).  
  - Strategic settings (e.g., your Case 2).  

  **Final takeaway**:  
  - "Information can’t hurt *if* you’re rational and the world doesn’t react. But humans aren’t robots—so build systems that enforce rationality (e.g., interpret data correctly) and account for side effects."

  ---

  ### **Why This Sequence Works**  
  - **Scaffolded**: Simple example → proof → generalization → edge cases.  
  - **Misconceptions preempted**:  
    - Expected utility ≠ outcome (addressed in Step 2).  
    - Ex-ante vs. experience (addressed in Steps 3–4).  
  - **Your cases integrated**: Use Case 1 to highlight rationality—the crux of your debate.  
  - **Audience engagement**: Brainstorm upfront, voting on cases, closing question.  

  By the end, engineers will see your colleague’s argument as a special case—and diagnose when it fails.
