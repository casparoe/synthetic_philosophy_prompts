answer: |-
  Your diagnosis perceptively identifies the core philosophical fissure underlying this stalemate. The disagreement is **primarily about explanatory standards and the metaphysics of cognitive explanation**, not the mathematics itself. However, hidden empirical assumptions *do* play a significant role in reinforcing each side's position. Here's a breakdown:

  1.  **Your Hypothesis is Largely Correct: The Explanatory Standards Dispute**
      *   **Pro-Complexity Side:** They implicitly adopt a **computational-level explanation** (Marr's Level 1) as fundamental and sufficient. An intractability proof demonstrates that the *task specification itself* (e.g., optimal probabilistic inference, perfect planning under uncertainty) is fundamentally hard for *any* physical system bounded by polynomial resources. The observed heuristics *are* the explanation – they are the necessary consequence of this fundamental constraint. The mind *is* fundamentally computational, and complexity classes reveal the abstract landscape it navigates.
      *   **Anti-Complexity Side:** They demand an **algorithmic or implementational explanation** (Marr's Levels 2 & 3). A worst-case asymptotic result about an abstract problem class doesn't explain *why this specific biological system*, with its specific architecture, learning history, and encountered instances, exhibits *this specific limitation* at *this specific point*. They see citing NP-hardness as hand-waving that bypasses the messy details of how the brain actually works ("It's hard in theory, so it must be hard for the brain"). They often view the "mind-as-Turing-machine" assumption inherent in complexity classes as an unsubstantiated or overly simplistic premise for cognitive explanation, potentially begging the question.

  2.  **The Role of Hidden Empirical Questions (Your Second Insight):**
      *   While the core dispute is conceptual, both sides *tacitly rely* on empirical assumptions about the *actual cognitive domain*:
          *   **The Pro Side Assumes:** The problems the mind *needs* to solve (for fitness) *genuinely* require exploring solution spaces that grow combinatorially in the worst-case, even if individual instances are small. The "specially structured" instances encountered in the real world *do* frequently manifest the hard core of the problem, or the mind must be prepared for instances that do. The distribution of instances isn't benign enough to make worst-case irrelevant.
          *   **The Anti Side Assumes:** The problems the mind solves are *overwhelmingly* drawn from highly structured, low-dimensional, or easy subclasses where worst-case complexity is irrelevant. The "special structure" of real-world problems and the specific neural architecture *dissolve* the intractability in practice. The brain's resources (massive parallelism, analog computation, specific learned representations) circumvent the limitations of the abstract serial Turing machine model.
      *   **The Stalemate:** Neither side has compelling *empirical* evidence to *force* the other to abandon their core position. Proving that a cognitive task *instantiates* an NP-hard problem in a way that hits the hard cases is difficult. Proving that the brain *never* encounters hard instances or has magic workarounds is also difficult. The debate stalls on these unverified assumptions.

  3.  **Answering Different Questions (Your Third Insight):**
      *   **Absolutely.** This conflation fuels much of the talking past each other.
          *   **Pro Side:** Answers **"Why *must* bounded agents (including humans) use heuristics/suboptimal strategies for this *type* of problem?"** (Universal Constraint).
          *   **Anti Side:** Answers **"Why does *this human*, right now, fail at *this specific instance* of planning/reasoning?"** (Specific Mechanism & Instance).
      *   The Pro answer sets a boundary condition: optimal, exact solutions are physically unrealistic for the problem class. The Anti side demands the details of *how* the specific system operates within that boundary. A universal constraint doesn't specify the particular path taken around the obstacle.

  **Diagnosis Summary:** The disagreement is fundamentally **meta-scientific** – it concerns **what counts as a valid explanation in cognitive science**. Is demonstrating a fundamental computational constraint sufficient, or must an explanation specify the biological mechanisms operating under that constraint? Hidden empirical assumptions about the nature of the problems the brain faces and the relevance of worst-case analysis to those problems sustain the disagreement, as neither side can definitively prove their assumptions hold. The sides are also often answering subtly different questions about constraints vs. mechanisms.

  **What Would Count as Progress?**

  Progress requires addressing *both* the conceptual and empirical layers. No single silver bullet exists, but these avenues hold promise:

  1.  **Conceptual Distinction & Integration (Most Crucial):**
      *   Explicitly separating the **universal computational constraint** (Complexity Result) from the **specific cognitive algorithm/mechanism** (Heuristic + Neural Implementation).
      *   Framing complexity results **not as the explanation itself, but as a necessary background constraint** that shapes the space of possible algorithms the brain could evolve/learn. It explains *why* optimal algorithms are absent, not *what* is present.
      *   Clarifying that explaining *a capacity* (e.g., generally good planning) might involve the constraint, while explaining *a specific failure* requires the algorithmic/implementational level.

  2.  **Refined Formal Tools (Addressing Empiricism):**
      *   **Parameterized Complexity:** Identifying *which specific parameters* of real-world instances make the problem hard/easy (e.g., treewidth for graph problems, number of goals in planning). This bridges the gap by showing *which* structural features matter, allowing empirical tests: do cognitively relevant instances have low values for the relevant parameters?
      *   **Average-Case Complexity:** Analyzing complexity under *plausible distributions* of instances encountered by the organism. This directly tackles the "specially structured instances" objection. Progress requires defining cognitively realistic distributions (a major challenge).
      *   **Bounded Rationality Models:** Frameworks like SATISFICING or Resource-Rational Analysis explicitly model agents optimizing under computational constraints. These can incorporate complexity insights *within* a model of specific cognitive mechanisms and resource budgets.

  3.  **Empirical Results (Testing Assumptions):**
      *   **Instance Analysis:** Systematically analyzing the computational structure of problems humans actually solve well vs. poorly. Do hard failures correlate with high values of known problem parameters (e.g., high treewidth in relational reasoning)?
      *   **Resource Scaling:** Designing experiments where problem size *or structural complexity* (e.g., via parameterized hardness) is carefully manipulated within cognitively plausible ranges, measuring performance degradation and resource consumption (time, fMRI activation).
      *   **Neural Algorithmics:** Can we identify neural implementations of known heuristics for NP-hard problems (e.g., belief propagation approximations in neural circuits)? Does neural activity scale in ways predicted by specific algorithmic strategies known to handle intractability?

  4.  **Machine Model Nuance:**
      *   Exploring complexity relative to biologically plausible models (e.g., neural network models with specific constraints, massively parallel analog models) *could* be fruitful, but risks simply relocating the circularity ("Why assume *this* model?"). Its value lies more in exploring *alternative* constraint landscapes than in providing definitive explanations for brains.

  **Ill-Posed Question?** While the debate can feel frustratingly abstract, the question is **not fundamentally ill-posed**. Understanding the fundamental computational constraints on intelligence *is* a valid scientific question. The problem lies in the *expectation* that a single complexity result provides a complete explanation for specific cognitive phenomena, and in the lack of empirical engagement with the assumptions about real-world problem structure.

  **Conclusion:** Your hypothesis correctly identifies the explanatory standards dispute as the core issue. Progress requires explicitly acknowledging this meta-disagreement, clearly differentiating universal constraints from specific mechanisms, and actively pursuing empirical research programs designed to test the hidden assumptions about problem structure and resource scaling in real cognition. Bridging the gap necessitates **constraint-informed mechanism discovery**: using complexity insights to guide the search for plausible neural algorithms, while using empirical data on cognitive performance and neural activity to validate or refine the relevance of the complexity constraints. The stalemate persists not because the question is invalid, but because neither side has fully embraced the need to integrate their perspective with the other's core concerns.
