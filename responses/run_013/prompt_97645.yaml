answer: |-
  Here is a Q&A prep sheet tailored to your specific audience dynamics, prioritizing objections by likelihood and damage potential. Focus areas for preemption and concession are noted at the end.

  ---

  ### **Q&A Preparation Sheet: "Self-Registering Consequentialism in Buddhist Ethics"**

  **Core Vulnerability:** Move 3 (merit transfer) is your weakest point; Move 1 (no deontic reading) is critical to hold.  
  **Preempt in Talk:** The incommensurability/egoism objection (Objection 1).  
  **Nightmare Question:** Objection 8.

  ---

  #### **1. Objection (Axiologists/Aggregation Consequentialists):**  
  *"If karmic 'value' is self-registering and incommensurable across persons—as your 'ledger' metaphor implies—how can this be consequentialism? Consequentialism requires interpersonal comparability to maximize aggregate good. Your view collapses into agent-relative egoism, mistaking subjective psychological states for normative value."*  
  **Reply (2 min):**  
  "Self-registering consequences aren’t egoistic because (a) intention (*cetanā*) inherently includes intersubjective orientation (e.g., compassion), and (b) the 'good' (e.g., reduced suffering, clarity) is universalizable *in kind*, even if instantiated personally. Karma’s automaticity ensures objective causal links between acts and mental outcomes—this is *structural* consequentialism, not subjective preference. Comparability exists in the *quality* of mental states (e.g., greed vs. generosity), not cardinal utility."  
  **Weakness:**  
  Doesn’t fully resolve how "universalizable kinds" permit aggregation.  
  **Concede?** No. Stress *qualitative* over quantitative comparability.

  ---

  #### **2. Objection (Theravāda Historians):**  
  *"You’ve smuggled in a naturalized, causal-law model of karma by framing it as 'automatic.' But in the *Aṭṭhakathā*, karma operates within a soteriological framework of *paticcasamuppāda* (dependent origination), not a reified 'system.' Isn’t your 'consequentialism' just projecting post-Benthamite categories onto a context where 'ethics' is inseparable from ontology and path-practice?"*  
  **Reply (2 min):**  
  "I agree karma is embedded in *paticcasamuppāda*. But the *cetanā*-karma identification (*Aṅguttara Nikāya* 6.63) and its fruit (*vipāka*) as intention-driven mental results (*cittaja rūpa*) show a causal feedback loop independent of divine judgment. This *is* automatic in the sense of being non-voluntarist and rule-governed—which structurally aligns with consequentialist mechanisms, *not* deontology."  
  **Weakness:**  
  Historians may cite Vinaya rules as deontic counterexamples.  
  **Concede?** Partially. Grant that "automatic" ≠ "mechanical," but hold that it still blocks *deontic address*.

  ---

  #### **3. Objection (Decision Theorist):**  
  *"If merit-making optimizes a 'proxy' (e.g., mental states), isn’t ritual donation *for merit* a classic case of reward-tampering? Agents game the system by chasing internal rewards, divorcing action from genuine consequence—like a reinforcement loop that hijacks the 'proxy.' How is this not dysfunctional optimization?"*  
  **Reply (2 min):**  
  "Buddhism *anticipates* this: rituals devoid of right intention yield minimal merit (*Abhidhammattha Sangaha* IV.8). The 'proxy' (mental state quality) is non-separable from the act’s moral content. Gaming fails because intention includes self-awareness—if you ritualize cynically, the intention *is* the corrupted state. The feedback loop *is* the moral training."  
  **Weakness:**  
  Assumes agents self-audit perfectly. History shows merit-gaming *did* occur.  
  **Concede?** Yes—acknowledge merit-transfer rituals *can* degrade into transactionality, but argue the theory self-corrects via intention.

  ---

  #### **4. Objection (Historians):**  
  *"The 'juridical metaphor' is *your* framing. Early texts describe karmic results using *vyavahāra* (conventional truth) language—as pedagogical narrative, not causal law. By literalizing it, you’ve created a 'consequentialist' straw man."*  
  **Reply (2 min):**  
  "Even as *vyavahāra*, karma’s operation is consistently *causal* (e.g., *Majjhima Nikāya* 135). The Buddha rejects ad hoc divine intervention (*Aṅguttara* 3.61). My point is that *without a judge*, pedagogical narratives *still* imply an impersonal causal order—which structurally parallels consequentialism’s impartial outcome-dependence."  
  **Weakness:**  
  Conflation of *vyavahāra* and *paramattha* levels in your argument.  
  **Concede?** Clarify you’re addressing the *operative logic*, not the literary form.

  ---

  #### **5. Objection (Consequentialists):**  
  *"Calling mental states 'the locus of the good' commits a category error. States aren’t valuable *per se*; they’re valuable iff they promote flourishing. Your 'good' is just a psychological descriptor, not normative."*  
  **Reply (2 min):**  
  "In Buddhism, *dukkha* (suffering) and *nibbāna* are *defined* by mental states. Reducing greed *is* intrinsically good because greed *is* *dukkha*. This is axiologic, not descriptive: the tradition *stipulates* that certain states *constitute* the good (e.g., *sukha* as *nibbānic* factor)."  
  **Weakness:**  
  Risk of circularity (good because Buddhism says so).  
  **Concede?** No. Emphasize Buddhism’s phenomenological grounding.

  ---

  #### **6. Objection (Historians on Merit Transfer):**  
  *"*Pattidāna*(merit-transfer) is symbolic, not literal 'moving' of good. *Petavatthu* stories show it’s conditional on recipients’ karma. Doesn’t this undermine your claim that it 'moves value across persons' for consequentialism?"*  
  **Reply (2 min):**  
  "Transfer’s efficacy depends on *both* parties’ karma, yes—but the *act* of transferring cultivates the donor’s mental state (non-attachment, compassion), which *is* karmically consequential. The 'movement' is in the *intentional redirection* of goodwill, generating new mental-states-in-context."  
  **Weakness:**  
  This reframes merit-transfer as agent-focused, weakening Move 3.  
  **Concede?** **YES (per your note)**. Retreat to: "Transfer demonstrates the *consequentialist logic* of redistributing conditions for good states."

  ---

  #### **7. Objection (Population Axiologist):**  
  *"If each agent’s karma is isolated, how do you explain *collective* karma (e.g., *MN 129*)? And if collective bad karma causes shared suffering, doesn’t that require interpersonal value commensurability?"*  
  **Reply (2 min):**  
  "Collective karma arises from *individual* intentions converging (e.g., group greed → economic collapse). Shared suffering isn’t 'aggregated bad' but parallel instantiations of *dukkha* in multiple minds. Consequentialism holds because each agent’s intention contributes to a causal chain affecting *others’ mental states*."  
  **Weakness:**  
  Still avoids how group outcomes are evaluated holistically.  
  **Concede?** Grant collective karma complicates but doesn’t break the model.

  ---

  #### **8. Nightmare Question (Consequentialist + Historian Hybrid):**  
  *"If normative weight rests *only* on future mental states *of the agent*, how is this ethics *action-guiding*? Why not retreat into meditation to optimize your states, ignoring others’ suffering? Isn’t this the opposite of *karuṇā* (compassion)?"*  
  **Reply (If Forced):**  
  "Intention (*cetanā*) is inherently relational—compassion *requires* engagement. Optimizing mental states *demands* ethical action; ignoring suffering *worsens* your state (via aversion/guilt). *Karuṇā* is cultivated *by* alleviating others’ *dukkha*, which registers karmically."  
  **Weakness:**  
  Assumes psychological inevitability (sociopaths might not feel guilt).  
  **Damage Control:** Cite *Digha Nikāya* 31: Happy mind → ethical action → happier mind.

  ---

  ### **Strategic Summary**
  - **Preempt in Talk:** Objection 1 (Incommensurability/Egoism). Weave into your explanation of "self-registering":  
    *"This isn’t egoism because the mental states constituting the good (e.g., compassion) are *defined* by intersubjectivity, and karma’s causality ensures objective moral feedback."*  
  - **Most Exposed Move:** Move 3 (Merit Transfer). Be ready to concede its limited role.  
  - **Concede Early:** On Move 3, open with: *"Merit-transfer’s mechanics are contested, but its *structure* reveals a consequentialist logic of redistributing conditions for good."*  
  - **Hold the Line:** Move 1 (No Deontic Reading) is essential. Do NOT concede here.  

  **Delivery Tip:** For historians, cite primary texts (e.g., *AN 6.63*); for consequentialists, use "structural"/"mechanism" language. For the decision theorist, compare merit to "reward design" in reinforcement learning.  

  Good luck—this is a razor’s edge, but your core thesis is robust!
