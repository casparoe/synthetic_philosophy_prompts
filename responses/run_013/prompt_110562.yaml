answer: |-
  Here is the pantoum, crafted to embody equifinality through shifting repetitions. Each stanza's recycled lines transform in context, mirroring how archaeological interpretation overlays meaning without resolving ambiguity.  

  **Pantoum of the Crouched Grave**  

  The dog lies curled at her feet, forever still.  
  The bone pin pierces the shroud, sharp and thin.  
  The shells gleam inland, a carried hill.  
  The body is crouched as if gathered in.  

  The bone pin pierces the shroud, sharp and thin—  
  *We stake our name in this costly ground.*  
  The body is crouched as if gathered in,  
  *The shells, our power, in distance found.*  

  *We stake our name in this costly ground*  
  *To quiet the dead who might walk the night.*  
  *The shells, our power, in distance found,*  
  *Must hold her spirit with ancient rite.*  

  *To quiet the dead who might walk the night,*  
  *The shells are contracts, debts owed and paid.*  
  *Must hold her spirit with ancient rite?*  
  *The dog and pin—accounts squared and laid.*  

  *The shells are contracts, debts owed and paid,*  
  The shells gleam inland, a carried hill.  
  *The dog and pin—accounts squared and laid.*  
  The dog lies curled at her feet, forever still.  

  ---  
  \answer{The poem commits to the grave as a site where grief, status, fear, and obligation resonate equally, their truths interleaved like strata in a trench.}
