  Hmm, the user is asking for a detailed audit of a philosophical argument about promissory obligation. They've shared a thumbnail sketch that reduces promising to harm avoidance through disappointed expectations, and they're questioning its accuracy. The sketch presents the expectation account and then refutes it with the case of a promisee who dies before breach. The user has specific questions about misrepresentations, the conflation of expectation and reliance, the force of the death case, the reduction claim, and the nature of directed obligations.

  First, I need to parse the thumbnail sketch carefully. The core argument is that promises bind only because breaking them disappoints expectations and causes harm, making it a subset of the duty not to harm. The refutation is that if the promisee dies before breach, there's no harm, so the promise shouldn't bind - but it does, which is absurd. The user suspects this is flawed and wants an audit.

  For the first question, I should identify which parts of the sketch are fair, which are simplified but defensible, and which are misrepresentations. The sketch gets the basic premise right: expectation accounts do emphasize harm from reliance. But it's a misrepresentation to say that the obligation is "exhausted" by harm or that there's "nothing distinctively moral" - these accounts often include conventions or norms that go beyond mere harm. Also, collapsing expectation and reliance is problematic, but that's covered later. So, I'll note that the reductionist framing is overstated.

  The second question is about expectation vs. reliance. They're not interchangeable. Expectation is psychological - the belief that something will happen. Reliance is behavioral - acting based on that belief. In promising, both matter, but they can come apart. For example, in the death case, the promisee might have expected fulfillment but not relied (if they died suddenly), so no harm. But if they relied before dying, harm could still occur to others. Keeping them separate shows that the account can handle some cases better, but the sketch's conflation makes it seem weaker than it is.

  For the third question on the promisee's death: it's not a full refutation, but a puzzle. A careful expectation account might say that if there was reliance before death, harm persists, or that the obligation binds if breach occurs while the promisee is alive. But if death happens before any reliance or breach, it's a challenge. However, it doesn't "refute" the account; it highlights a boundary case where other factors like duties to the dead might kick in. The sketch distorts it by implying the account must fail here, ignoring nuances.

  On the fourth question, does reducing promising to harm avoidance follow? Not necessarily. Even if harm is key, promising involves conventions that create obligations distinct from general harm duties. For instance, promising might include a voluntary commitment that adds moral weight beyond just consequences. The sketch overreaches by saying it's "simply one way of harming" - that's too reductive.

  Fifth, on directed obligations: the sketch frames binding as "wrong to break," which misses that promissory obligations are directed - owed to the promisee and waivable by them. The expectation account can accommodate this by saying the harm is specifically to the promisee, but it might struggle with waivability. For example, if a promisee waives the obligation, no expectation is raised, so no harm - which fits. But the sketch doesn't mention this, so its framing is incomplete.

  Overall, the sketch has inaccuracies: it oversimplifies the expectation account, conflates key concepts, and misuses the death case. But the core idea - that harm from disappointment is important - is worth keeping. The user's suspicion about the closing move being illicit is spot on; it sets up a straw man by ignoring how reliance might still cause harm or other elements of the account. My response should validate their concerns while clarifying what parts hold up.
answer: |-
  Here's a granular accuracy audit of the sketch, addressing your five points directly:

  1.  **Fairness of Claims:**
      *   **Fair:** The core assertion that the expectation account grounds promissory obligation in "disappointing expectations one has deliberately raised" is a standard and fair characterization. The link to causing harm *via* that disappointment/reliance is central to classic expectation accounts (like early utilitarian versions). The point that promising is a "useful coordination device" is also a common, defensible observation within this framework.
      *   **Loose but Defensible Simplification:** Stating the obligation is "a special case of the general duty not to cause harm" is a simplification. While harm is central, expectation accounts often incorporate the *intentional invocation of reliance* as a morally significant act distinct from accidentally causing harm. Saying "frustrating that reliance is simply one way of harming them" captures a key consequence but flattens the unique *voluntary creation of the vulnerable expectation* that defines promising.
      *   **Outright Misrepresentation:** Claiming "there is nothing distinctively moral about the institution of promising itself" and that its binding force is "*exhausted* by the harm of disappointed reliance" is a significant misrepresentation. Careful expectation theorists (e.g., Scanlon) argue that the *practice* of promising, or the *norm* governing the intentional inducement of reliance, *is* morally distinctive. It creates a specific *kind* of obligation arising from the promisor's voluntary act, not merely from the generic fact of harm. The "exhausted" claim ignores the *source* of the obligation in the promisor's deliberate act and reduces it purely to consequences.

  2.  **Expectation vs. Reliance:**
      *   **Distinction:** These are *not* interchangeable, and collapsing them distorts the account.
          *   **Expectation:** A *belief or state of mind* (the promisee believes the promisor will perform).
          *   **Reliance:** An *action* based on that expectation (the promisee changes their position, invests resources, foregoes alternatives).
      *   **What Turns on the Distinction:** Collapsing them makes the account *appear* more vulnerable to the death case and obscures nuances.
          *   **Harm Source:** Disappointment is primarily psychological harm from the *expectation* being dashed. Harm from *reliance* is often tangible (financial loss, wasted effort, missed opportunities).
          *   **The Death Case:** If the promisee dies *before* any reliance occurs, *and* before the breach, *disappointed expectation* is arguably impossible (no conscious being exists to be disappointed). *Reliance harm* might *still* occur if the promisee relied before dying (e.g., spent money based on the promise), causing harm to their estate or dependents. Collapsing expectation and reliance hides this potential response.
          *   **Scope of Obligation:** An account focused purely on *reliance harm* might only bind the promisor if actual detrimental reliance occurred. An account focused on *intentionally inducing expectation* (even without actual reliance) grounds the obligation in the promisor's *act* of creating the expectation vulnerability, potentially binding even if the promisee hasn't yet relied (though harm upon breach is still expected).
      *   **Effect on the Account:** Collapsing them makes the account seem purely consequentialist about actual harm, obscuring the role of the promisor's *intentional creation of the expectation* as the normative trigger. Keeping them distinct allows for a more nuanced view where the *creation of the expectation* is the wrong-making feature, with *disappointment/reliance harm* being the primary (but perhaps not sole) *reason* why frustrating that expectation is wrong.

  3.  **The Death Case:**
      *   **Status:** It is **a genuine puzzle the account must confront**, **not** a straightforward refutation, and the sketch presents a **distorted version** of the objection.
      *   **Why Not a Refutation?** Careful expectation theorists have responses:
          *   **Reliance Before Death:** If the promisee relied before dying, tangible harm may persist (e.g., debts incurred, opportunities lost).
          *   **Expectation Harm Before Death?:** One could argue the promisee *did* experience the expectation during their life, and the breach still wrongs them by retrospectively making their reliance (if any) foolish or their trust misplaced (an argument about the meaning of the act for the promisee while alive).
          *   **Surviving Interests/Duties:** The promise might create duties concerning the promisee's estate, reputation, or surviving interests (e.g., a deathbed promise about burial wishes).
          *   **The Practice Argument:** The obligation binds because it falls under the general practice/norm of promise-keeping, which is justified by the need to secure expectations/reliance *in general*. Breaking the promise to the dead weakens the institution and harms *future* reliance.
      *   **Distortion in the Sketch:** The sketch presents the case as one where the promisee "*suffers no disappointed expectation*" implying no harm *at all* and concludes the account *must* say the promise doesn't bind, calling this "absurd." It ignores the potential for reliance harm before death, surviving interests, and especially the "practice" justification. It sets up an artificially weak version of the account to knock down. While the case remains challenging and highlights potential limits, it doesn't *refute* a sophisticated expectation account; it pressures it to clarify its scope and foundations.

  4.  **Does Reduction Follow?**
      *   **Conclusion:** The claim that promising "reduces to" the general duty not to harm is **an overreach**, not a necessary consequence of accurate elements.
      *   **Why?** Even granting that harm is central, the *source* and *structure* of the obligation in promising are distinct:
          *   **Voluntary Creation of Vulnerability:** The promisor *intentionally* creates the specific expectation and vulnerability to harm in the promisee. This is different from accidentally causing harm or causing harm without such a specific, voluntary undertaking.
          *   **The Normative Role of the Practice/Act:** The obligation arises from the specific social act of promising, governed by norms whose justification *includes* preventing harm but also involves concepts like fidelity, trust, and the value of voluntary commitment itself. The duty is *triggered* by the specific act of promising, not just the general presence of reliance/harm potential.
          *   **Directedness (foreshadowing point 5):** The obligation is owed *to the promisee* in a way a general harm duty isn't (see below).
      *   **Accurate Core vs. Overreach:** The accurate core is that *the prevention of harm (via disappointed expectation/reliance) is a primary justification* for the norm/practice of promising. The overreach is claiming the obligation *just is* an instance of the general harm duty, ignoring the distinctive moral features of the promissory *act* and *relationship* that generate a specific, directed obligation.

  5.  **Directness/Waivability and the Sketch's Framing:**
      *   **The Sketch's Limitation:** The sketch frames obligation solely as "binding" and "wrong to break," **failing entirely to register the directed nature** of promissory obligations. It implicitly treats the wrong as generic (like breaking a vase), not as a *wronging of a specific person*.
      *   **The Distinction:** Promissory obligations are *directed*: owed *to* the promisee. This means:
          *   The promisee is the *object* of the duty (it's *their* right that is potentially violated).
          *   The promisee typically has the power to *waive* or *release* the promisor from the obligation, transforming it from wrong to permissible.
      *   **Accommodating Directedness:** An expectation account *can* accommodate directedness, though it requires refinement:
          *   **Harm *to Whom*?:** The harm of disappointed expectation/reliance is specifically harm *to the promisee*.
          *   **Waivability:** Waivability fits naturally: if the promisee releases the promisor, they are essentially declaring they *won't* rely on the promise or be harmed by its non-fulfillment, or they consent to bearing the risk. The expectation is dissolved by the one who held it. The moral reason grounded in harm *to them* disappears.
      *   **What the Sketch Misses:** By ignoring directedness, the sketch misses a crucial structural feature that distinguishes promissory wrongs from generic harm-causing. It cannot explain *why* the promisee (and only the promisee, usually) has the power to release the promisor. A careful expectation account linking harm specifically to the promisee's interests can explain this, making directedness a feature, not a bug. The sketch's generic harm framing obscures this entirely.

  **Summary Audit:**

  *   **Worth Keeping (Accurate Core):** Promising intentionally creates expectations; frustrating those expectations typically causes harm (disappointment/reliance); preventing this harm is a primary justification for promissory norms; promising is a vital coordination tool.
  *   **Loose but Salvageable:** Framing the obligation as linked to harm prevention is core, but the "special case of general harm duty" phrasing needs nuance to emphasize the *voluntary creation of specific vulnerability*.
  *   **Misrepresentations/Distortions:** Claiming promissory force is *exhausted* by harm and there's *nothing distinctively moral* about the institution; treating expectation and reliance as interchangeable; presenting the death case as a simple refutation by ignoring potential responses and surviving interests; concluding reduction to general harm duty follows; completely ignoring directedness and waivability.
  *   **Key Insight from Audit:** The sketch fatally oversimplifies and distorts the expectation account by making it purely consequentialist about actual harm, ignoring the moral significance of the promisor's *intentional act* of inducing expectation, the potential structure of the *practice/norm*, and the *directed* nature of the obligation. A careful expectation account grounds the obligation in the wrong of *intentionally creating then violating a specific vulnerability to harm in another*, within a practice justified by preventing such harms generally. The death case is a serious challenge to the *harm* aspect but doesn't refute the core structure; directedness is compatible and highlights a feature the sketch misses entirely. The reduction claim is an unwarranted overreach.
