  ### (i) Rules Fitting M's Verdicts

  Based on M's verdicts, two distinct rules that fit all her recorded judgments are:

  1. **Rule of Groundedness with Kleene Evaluation (Rule G-K):**  
     A sentence is assigned a truth value (true or false) only if it is *grounded*, meaning its truth value is determined by a non-circular chain of reference ending in a non-truth-theoretic fact (e.g., empirical or mathematical truths). Any ungrounded sentence is assigned neither true nor false. When evaluating a sentence that refers to another sentence (e.g., "S is not true"), the truth value is computed using Kleene's strong three-valued logic:  
     - If the referred sentence is true, "not true" is false.  
     - If the referred sentence is false, "not true" is true.  
     - If the referred sentence is neither, "not true" is also neither.  
     This rule treats truth ascriptions (e.g., "S is true") symmetrically: they inherit the truth value of the referred sentence, or are neither if it is neither. Circular references (direct or indirect) and self-references that prevent grounding result in gaps.

  2. **Rule of Invariant Valuation (Rule IV):**  
     A sentence is assigned a truth value only if every possible classical truth-value assignment (true or false) to all sentences in its reference chain, consistent with non-truth-theoretic facts and the truth predicate (i.e., T(S) matches S's truth value), yields the same truth value for it. If not, it is neither true nor false. This rule evaluates sentences by considering all consistent classical models: if a sentence is true (or false) in all such models, it is true (or false); otherwise, it is neither. Like Rule G-K, it assigns gaps to ungrounded sentences but uses a supervaluationist method over classical assignments.

  **Excluded Families of Views:**  
  - **Classical bivalence:** M assigns gaps (neither) to the liar and truth-teller, rejecting that they must be true or false.  
  - **Paraconsistency:** M never assigns both true and false; she assigns gaps to paradoxical sentences.  
  - **Arbitrary assignment:** M rejects that the truth-teller is arbitrarily true or false, and her verdicts show no such arbitrariness.  
  - **Circularity as sole culprit:** M assigns gaps to circular cases (liar, pair) but also assigns classical values to circularity-free references (empirical case), so circularity alone is not sufficient; grounding matters.  
  - **Truth-value gluts:** M never assigns both true and false.  

  Both Rule G-K and Rule IV fit M's verdicts:  
  - **Plain liar and truth-teller:** Ungrounded (circular self-reference), so neither (both rules).  
  - **Pair (A and B):** Circular mutual reference, ungrounded, so both neither (both rules).  
  - **Empirical case:** The front refers to a grounded true sentence (arithmetic), so "not true" is false (both rules: classical evaluation applies).  

