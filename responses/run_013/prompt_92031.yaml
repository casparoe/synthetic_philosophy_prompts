  (a) The expected monetary value (EMV) is:

  \[
  EMV = \sum_{n=1}^{\infty} \frac{1}{2^n} \cdot \min(2^n, M)
  \]

  Let \( k \) be the smallest integer such that \( 2^k > M \). Then for \( n < k \), \( \min(2^n, M) = 2^n \), and for \( n \geq k \), \( \min(2^n, M) = M \). Thus:

  \[
  EMV = \sum_{n=1}^{k-1} \frac{1}{2^n} \cdot 2^n + \sum_{n=k}^{\infty} \frac{1}{2^n} \cdot M = \sum_{n=1}^{k-1} 1 + M \sum_{n=k}^{\infty} \frac{1}{2^n}
  \]

  The first sum is \( k-1 \). The second sum is a geometric series:

  \[
  \sum_{n=k}^{\infty} \frac{1}{2^n} = \frac{1}{2^k} \cdot \frac{1}{1 - \frac{1}{2}} = \frac{1}{2^k} \cdot 2 = \frac{1}{2^{k-1}}
  \]

  So:

  \[
  EMV = k-1 + \frac{M}{2^{k-1}}
  \]

  For \( M = 2^{20} \), we have \( 2^{20} = M \), so \( 2^{20} \not> M \), and \( 2^{21} > M \). Thus \( k = 21 \). Then:

  \[
  EMV = 21-1 + \frac{2^{20}}{2^{20}} = 20 + 1 = 21
  \]

  The EMV is £21.

  (b) (i) The expected-monetary-value rule licenses a fee up to the EMV, which is £21.

  (ii) We require the EMV to be £50. Let \( k \) be the smallest integer such that \( 2^k > M \). Then \( EMV = k-1 + \frac{M}{2^{k-1}} = 50 \). Since \( M < 2^k \) and \( M \geq 2^{k-1} \), we set \( M = c \cdot 2^{k-1} \) with \( 1 \leq c < 2 \). Then:

  \[
  k-1 + c = 50
  \]

  Thus \( c = 50 - (k-1) \). Since \( 1 \leq c < 2 \), we have:

  \[
  1 \leq 50 - (k-1) < 2
  \]

  Solving:

  \[
  49 \leq k-1 < 50
  \]

  Therefore, \( k-1 = 49 \) (since it must be an integer) and so \( k=50 \). Then \( c = 50 - 49 = 1 \). Hence, \( M = 1 \cdot 2^{50-1} = 2^{49} \) pounds. The casino's bankroll must be at least \( 2^{49} \) pounds.

  (c) The cap ensures the expectation is finite, so the problem of infinite expectation is avoided. However, the paradox is not dissolved but relocated. The residual puzzle is that the expected-monetary-value rule can license a fee that is too high for a risk-averse agent. This is because the game's payoff distribution is highly skewed: there is a very small chance of winning an extremely large amount, and the expected utility (with a concave utility function) is significantly less than the utility of the expected monetary value.

  For example, consider \( M = 2^{49} \) (which gives an EMV of £50). A risk-averse agent with logarithmic utility \( U(w) = \log(w) \) and initial wealth \( w_0 \) would have expected utility:

  \[
  E[U] = \sum_{n=1}^{49} \frac{1}{2^n} \log(w_0 - f + 2^n) + \sum_{n=50}^{\infty} \frac{1}{2^n} \log(w_0 - f + 2^{49})
  \]

  The second sum is negligible because the probabilities decay geometrically. The first sum is approximately \( \log(2) \sum_{n=1}^{49} \frac{n}{2^n} \approx 2 \log(2) \approx 1.386 \), which is finite and small. The utility of paying £50 without playing is \( \log(w_0 - 50) \). The certainty equivalent of the game (the fee that makes the agent indifferent) is much less than £50. Therefore, the agent would not be willing to pay £50. This shows that the EMV rule is inadequate for such skewed distributions, and the cap has not resolved the fundamental issue of risk aversion.

  Thus, the paradox persists in the form of the discrepancy between the EMV and the expected utility.

