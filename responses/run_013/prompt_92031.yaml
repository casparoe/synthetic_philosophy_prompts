answer: |-
  ### Exam Question: St. Petersburg Paradox with a Cap

  **Total marks: 25**  
  **Time allowed: 45 minutes**

  A casino offers a game where a fair coin is flipped repeatedly until it lands heads. Let \(n\) be the flip number on which the first head occurs (so \(n \geq 1\)). The payout in pounds is \(\min(2^n, M)\), where \(M\) is a fixed cap. For parts (a) and (b), assume \(M = 2^{20}\) (approximately £1 million). Players pay an entry fee upfront out of their finite wealth for a single play.

  **(a)** Derive a closed-form expression for the expected monetary value (EMV) of the payout as a function of \(M\). Using this expression, compute the EMV for \(M = 2^{20}\).  
  **[8 marks]**

  **(b)** (i) According to the expected-monetary-value rule, what fee does this rule license for the game when \(M = 2^{20}\)?  
  **(ii)** Suppose the casino must have sufficient funds to cover the maximum payout \(M\). How large must \(M\) be for the EMV to equal £50? (This determines the minimum bankroll required for the EMV rule to license a fee of £50.)  
  **[2 marks for (i), 5 marks for (ii)]**

  **(c)** The original St. Petersburg paradox (with no cap) has an infinite EMV, implying one should pay any finite fee to play—a counterintuitive result often resolved by diminishing marginal utility of wealth. Here, the cap \(M\) ensures the EMV is finite. Does this cap *dissolve* the paradox entirely, or does it merely *relocate* it? If you argue it relocates the paradox, describe the residual puzzle that arises when replacing EMV with expected utility of wealth (assuming a concave utility function).  
  **[10 marks]**

  ---

  ### Model Answer

  **(a)** The EMV is the sum of all possible payouts weighted by their probabilities. The probability that the first head occurs on flip \(n\) is \(\frac{1}{2^n}\). The payout is \(\min(2^n, M)\). Let \(k\) be the smallest integer such that \(2^k > M\). For \(n < k\), \(2^n \leq 2^{k-1} \leq M\) (since \(2^{k-1} \leq M < 2^k\)), so \(\min(2^n, M) = 2^n\). For \(n \geq k\), \(2^n > M\), so \(\min(2^n, M) = M\). Thus:  
  \[
  \text{EMV} = \sum_{n=1}^{k-1} \left( \frac{1}{2^n} \cdot 2^n \right) + \sum_{n=k}^{\infty} \left( \frac{1}{2^n} \cdot M \right).
  \]  
  The first sum simplifies to \(\sum_{n=1}^{k-1} 1 = k-1\). The second sum is a geometric series:  
  \[
  \sum_{n=k}^{\infty} \frac{M}{2^n} = M \cdot \frac{1}{2^k} \sum_{j=0}^{\infty} \left( \frac{1}{2} \right)^j = M \cdot \frac{1}{2^k} \cdot 2 = \frac{M}{2^{k-1}}.
  \]  
  So:  
  \[
  \text{EMV} = k - 1 + \frac{M}{2^{k-1}}.
  \]  
  For \(M = 2^{20}\), \(2^{20} = M \not> M\), but \(2^{21} > M\), so \(k = 21\). Substituting:  
  \[
  \text{EMV} = 21 - 1 + \frac{2^{20}}{2^{20}} = 20 + 1 = 21.
  \]  
  The EMV is £21.  

  **(b)**  
  (i) The EMV rule licenses any fee up to the EMV. For \(M = 2^{20}\), the EMV is £21, so a fee of up to £21 is licensed.  
  (ii) We need \(\text{EMV} = 50\), so:  
  \[
  k - 1 + \frac{M}{2^{k-1}} = 50,
  \]  
  where \(k\) is the smallest integer with \(2^k > M\) (implying \(2^{k-1} \leq M < 2^k\)). Set \(M = c \cdot 2^{k-1}\) with \(1 \leq c < 2\). Then:  
  \[
  k - 1 + c = 50.
  \]  
  Thus \(c = 50 - (k - 1)\). Since \(1 \leq c < 2\):  
  \[
  1 \leq 50 - (k - 1) < 2 \implies 49 \leq k - 1 < 50.
  \]  
  As \(k-1\) is an integer, \(k - 1 = 49\), so \(k = 50\). Then \(c = 50 - 49 = 1\), and \(M = 1 \cdot 2^{50-1} = 2^{49}\). The casino’s bankroll must be at least \(2^{49}\) pounds (approximately £562.95 trillion).  

  **(c)** The cap \(M\) dissolves the *original* paradox (infinite EMV) but relocates the core issue: the EMV rule still recommends fees that are counterintuitively high for risk-averse players, as it ignores the diminishing marginal utility of wealth. The residual puzzle arises from the game’s payoff structure: it offers astronomical but extremely unlikely payouts, making EMV a poor guide for rational choice under risk aversion.  

  Specifically, with a concave utility function (e.g., \(U(W) = \ln W\)), the expected utility (EU) of the game is much lower than the utility of the EMV. For instance, in part (b)(ii), \(M = 2^{49}\) gives EMV = £50, but the EU is dominated by near-certain small gains and negligible probabilities of \(M\). A player with initial wealth \(W_0\) and \(U(W) = \ln W\) would compute:  
  \[
  \text{EU} \approx \sum_{n=1}^{49} \frac{1}{2^n} \ln(W_0 - f + 2^n) + \sum_{n=50}^{\infty} \frac{1}{2^n} \ln(W_0 - f + 2^{49}),
  \]  
  where \(f\) is the fee. The second sum is tiny (probability \(2^{-49}\)), and the first sum grows slowly due to concavity. For moderate \(W_0\) (e.g., £100,000), paying \(f = £50\) yields EU barely higher than not playing, as \(\ln(W_0 - 50 + 2^n)\) is marginal for small \(n\). The certainty equivalent (fee where EU equals utility of not playing) is far below £50, violating the EMV rule. Thus, even with finite EMV, the paradox persists: EMV overvalues skewed lotteries, and expected utility is needed to explain risk aversion.  

  ---

  ### Marking Scheme (Total: 25 marks)

  #### (a) Derive EMV expression and compute for \(M = 2^{20}\) (8 marks)
  - **Key moves (4 marks for derivation, 4 marks for computation):**  
    - Defines \(k\) as smallest integer with \(2^k > M\) (1 mark).  
    - Splits sum at \(k\): \(\sum_{n=1}^{k-1} (\frac{1}{2^n} \cdot 2^n) = k-1\) (1 mark).  
    - Solves geometric series for capped part: \(\sum_{n=k}^{\infty} \frac{M}{2^n} = \frac{M}{2^{k-1}}\) (2 marks).  
    - Correct closed form: \(EMV = k - 1 + \frac{M}{2^{k-1}}\) (1 mark for final expression).  
    - For \(M = 2^{20}\): identifies \(k = 21\) (2 marks).  
    - Computes \(EMV = 21 - 1 + \frac{2^{20}}{2^{20}} = 21\) (2 marks).  
  - **Common errors:**  
    - Wrong \(k\) (e.g., \(k=20\)): −2 (unless correct EMV via alternative logic).  
    - Arithmetic error (e.g., \(2^{20}/2^{20} = 2\)): −2.  
    - Incomplete derivation (e.g., no geometric series): −3.  

  #### (b) EMV rule application (7 marks: 2 for (i), 5 for (ii))
  - **(i) Licensed fee for \(M = 2^{20}\) (2 marks):**  
    - States £21 (direct from (a)).  
    - Error: Any other answer (e.g., £20 or £22): −2.  
  - **(ii) Find \(M\) for EMV = £50 (5 marks):**  
    - Sets up \(k - 1 + \frac{M}{2^{k-1}} = 50\) with \(2^{k-1} \leq M < 2^k\) (1 mark).  
    - Expresses \(M = c \cdot 2^{k-1}\), \(1 \leq c < 2\) (1 mark).  
    - Solves \(k - 1 + c = 50\) and inequality \(49 \leq k-1 < 50\) (1 mark).  
    - Deduces \(k-1 = 49\), so \(k = 50\) (1 mark).  
    - Concludes \(M = 2^{49}\) (1 mark).  
  - **Common errors:**  
    - No link to \(k\): −3.  
    - Wrong \(k\) (e.g., \(k=49\)): −2.  
    - \(M = 2^{50}\) or similar: −2.  

  #### (c) Paradox resolution and residual puzzle (10 marks)
  - **Key moves:**  
    - States cap relocates (does not dissolve) paradox (2 marks).  
    - Identifies residual puzzle: EMV-licensed fee is too high for risk-averse players (2 marks).  
    - Explains why: Skewed payoffs (high variance, tiny probability of huge gain) make EU << utility of EMV due to concavity (3 marks).  
    - Uses \(M = 2^{49}\) (from (b)) as example: EU of fee £50 is low, certainty equivalent << £50 (3 marks).  
  - **Common errors:**  
    - Claims cap fully resolves paradox: 0/10.  
    - No mention of expected utility: −5.  
    - No example (or unrelated to (b)): −3.  
    - Confuses EMV with EU (e.g., "EU is infinite"): −3.  

  **First-class standard (≥18 marks):** Correct arithmetic in (a) and (b), identifies \(k\) precisely, recognizes paradox relocation in (c), and links residual puzzle to risk aversion with concrete example. Distinguishes EMV from EU.  
  **Penalties:** Minor arithmetic errors (−1 per instance); conceptual misunderstandings (e.g., "finite EMV resolves everything" in (c): −5).
