  Below is a decision tree designed to force students to confront their rejection point in Galen Strawson's Basic Argument. The tree starts from acceptance of step (i) ("you act as you do because of how you are") and branches through the argument's steps, presuppositions, and case-based nodes. Each internal node is phrased as a question the reader can answer without knowing the outcome. The tree includes all requested nodes (causal vs. constitutive reading, principle for the regress, nature of step (v), stopping point, and the two case-based nodes), and the specified leaves. Nodes are ordered to minimize redundancy and prioritize high-impact splits.

  ### Decision Tree
  **Start:** You accept step (i): You act as you do because of how you are.  
  ↓  
  **Node 1: Is "because of how you are" best understood causally (your character pushes you to act) or constitutively (your act just is the exercise of your character)?**  
  - Causal → Go to Node 2  
  - Constitutive → Go to Node 8  

  **Node 2: Does the move from "not ultimately responsible for how you are" to "not ultimately responsible for what you do" (step ii) require a general principle?**  
  - Yes → Go to Node 3  
  - No → Go to Node 7  

  **Node 3: If such a principle is needed, is it a logical truth (e.g., about what responsibility entails) or a substantive moral claim?**  
  - Logical truth → Go to Node 4  
  - Substantive moral claim → Go to Node 4  

  **Node 4: Do you accept step (ii): Being ultimately responsible for what you do requires being ultimately responsible for how you are?**  
  - Yes → Go to Node 5  
  - No → Go to Node 9  

  **Node 5: Do you accept step (iii): Being ultimately responsible for how you are requires being responsible for the process that made you that way, leading to a regress that can only stop with self-creation?**  
  - Yes → Go to Node 6  
  - No → Go to Node 10  

  **Node 6: Is step (v)—that basic-desert moral responsibility requires ultimate responsibility—a report of what ordinary blaming presupposes or a stipulation?**  
  - Report of ordinary practice → Go to Node 11  
  - Stipulation → Go to Node 11  

  **Node 7: For the engineered agent (character designed by neuroscientists, now cruel), is she as morally responsible as an ordinary cruel person?**  
  - Yes, same degree → Go to Node 9  
  - No, or different degree → Go to Node 9  

  **Node 8: Does the constitutive view (from Node 1) inherently block the regress by making character and action non-separable?**  
  - Yes → **Leaf 8**  
  - No → Go to Node 4  

  **Node 9: What stops the regress (if it arises)? Is it a fact about the agent, our practices, or language?**  
  - Fact about the agent (e.g., the agent just exists) → Go to Node 10  
  - Fact about our practices (we stop blaming at some point) → **Leaf 9**  
  - Fact about language (the word "responsible" has finite scope) → **Leaf 9**  

  **Node 10: For the self-revised agent (rebuilt character from cruel to kind), does her effort matter for responsibility, given she didn't make the self that did the making?**  
  - Yes, it matters → Go to Node 12  
  - No, it doesn't matter → **Leaf 4 or 5 (tree cannot separate these; difference is substantive)**  

  **Node 11: Can the regress stop without self-creation? If so, how?**  
  - Via agent causation (a substance causes without being caused) → **Leaf 6**  
  - Via self-forming action (undetermined effort creates part of the self) → **Leaf 7**  
  - Not stopped—self-creation is the only option → Go to Node 13  

  **Node 12: What best explains responsibility without ultimacy?**  
  - Actions express the agent's current evaluative stance → **Leaf 4**  
  - Agents must be responsive to reasons (answerability) → **Leaf 5**  
  - Practices don't require ultimacy → **Leaf 9**  

  **Node 13: Is self-creation possible?**  
  - Yes → **Leaf 11**  
  - No → **Leaf 1 or 3 (tree cannot separate these; difference is substantive)**  

  ---

  ### Leaves of the Tree
  For each leaf, we provide:  
  - **Concession & Denial**: What the position accepts from the argument and what it rejects.  
  - **Most Awkward Commitment**: The toughest implication or counterintuitive point.  
  - **Engineered Agent Case**: How it handles responsibility for the designed cruel person.  
  - **Self-Revised Agent Case**: How it handles responsibility for the self-improved kind person.  

  **Leaf 1: Argument sound; no one responsible in desert sense**  
  - Concedes the entire argument (i–v); denies anyone deserves blame/praise based on desert.  
  - Awkward: Blaming/praising is never justified on backward-looking grounds; moral life must be reimagined.  
  - Engineered: Not responsible (same as ordinary).  
  - Self-revised: Not responsible for kind act; self-revision doesn’t matter.  

  **Leaf 2: Ultimacy empty; desert responsibility possible without it**  
  - Concedes ultimacy is impossible (from iii–iv); denies it is required for desert (rejects v).  
  - Awkward: Desert can apply even if we are not ultimate sources, risking inconsistency with fairness.  
  - Engineered: Responsible if action meets desert conditions (e.g., intentional).  
  - Self-revised: Responsible for kind act; self-revision irrelevant to desert.  

  **Leaf 3: Conclusion correct; rebuild responsibility around forward-looking purposes**  
  - Concedes no desert responsibility (iv–v); denies desert is essential, so rebuilds responsibility for practical goals (e.g., deterrence).  
  - Awkward: Blaming feels retributive in practice but must be reinterpreted as purely instrumental.  
  - Engineered: May be held responsible if it serves social purposes (e.g., reform).  
  - Self-revised: Praised if it encourages others, but not because she deserves it.  

  **Leaf 4: Action expresses evaluative stance; no regress arises**  
  - Concedes actions stem from how we are (i); denies responsibility requires ultimacy (ii) because ownership comes from expressing current values.  
  - Awkward: Engineered agent can be fully responsible if her act aligns with her current stance.  
  - Engineered: Responsible if cruel act expresses her evaluative stance.  
  - Self-revised: Responsible for kind act; self-revision is irrelevant (current stance matters).  

  **Leaf 5: Responsibility as answerability (reasons-responsiveness)**  
  - Concedes actions stem from how we are (i); denies ultimacy is needed (ii) because responsibility is about being responsive to reasons, not authorship.  
  - Awkward: Manipulated agents can be responsible if responsive, diluting control concerns.  
  - Engineered: Responsible if she can recognize and act on reasons.  
  - Self-revised: Responsible for kind act; self-revision may enhance reasons-responsiveness but isn’t required.  

  **Leaf 6: Agent causation (substance causes without prior cause)**  
  - Concedes the regress (iii) but denies it requires self-creation; stops it with uncaused agent-causation.  
  - Awkward: Postulates non-natural causation, conflicting with scientific views of causality.  
  - Engineered: Not responsible (caused externally); agent-causation absent.  
  - Self-revised: Responsible if kind act involved agent-causation; self-revision may, but need not, include it.  

  **Leaf 7: Self-forming action (regress ends in undetermined effort)**  
  - Concedes the regress (iii) but denies self-creation is only stop; ends it with actions that shape the self.  
  - Awkward: Undetermined actions seem arbitrary, not truly controlled by the agent.  
  - Engineered: Not responsible (no self-forming actions in history).  
  - Self-revised: Responsible if self-revision involved self-forming actions.  

  **Leaf 8: Character and action inseparable; regress has no foothold**  
  - Concedes actions stem from character (i); denies character/action are distinct (rejects ii’s separability).  
  - Awkward: Character change (e.g., self-revision) is hard to explain without separability.  
  - Engineered: Responsible (action is her character exercised; design irrelevant).  
  - Self-revised: Responsible (kind act is her character); self-revision is character development, not responsibility-grounding.  

  **Leaf 9: Demand for ultimacy is philosophical; practices don’t require it**  
  - Concedes ultimacy is impossible (iv); denies practices presuppose it (rejects v as stipulation).  
  - Awkward: Ordinary blaming feels desert-based; must be explained away as non-retributive.  
  - Engineered: May not be blamed in practice, but due to social context, not metaphysics.  
  - Self-revised: Praised in practice; self-revision matters socially but not metaphysically.  

  **Leaf 10: Self as process/bundle; question "who made the self?" ill-formed**  
  - Concedes actions arise from the self; denies a "self-owner" exists, so regress is incoherent.  
  - Awkward: Responsibility dissolves into patterns, not personal ownership, risking nihilism.  
  - Engineered: Responsible if cruelty is part of her current bundle.  
  - Self-revised: Responsible if kindness is part of her current bundle; self-revision is just process.  

  **Leaf 11: Empty—Self-created agent**  
  - Concedes self-creation is the only way to stop regress (iii); denies it is impossible.  
  - Awkward: Self-creation is incoherent (e.g., cannot cause oneself to exist).  
  - Engineered: Not applicable.  
  - Self-revised: Only responsible if self-revision involved self-creation (incoherent).  
  - **Why empty**: Self-creation is incoherent (requires existence prior to causation) and unexplored in viable theories.  

  ---

  ### Key Notes
  - **Highest-Impact Node**: Node 4 (accept step ii). If answered "no," it moves readers to leaves rejecting ultimacy (e.g., 4, 5, 8, 9); if "yes," it leads to hard incompatibilism (1, 3) or libertarianism (6, 7). This node forces engagement with the core regress.  
  - **Leaves the Tree Cannot Separate**:  
    - **Leaf 4 (evaluative stance) and Leaf 5 (answerability)**: Difference is substantive (expression vs. responsiveness), but the tree may assign both to Node 10's "no" path. They often overlap in practice.  
    - **Leaf 1 (no desert) and Leaf 3 (rebuild forward-looking)**: Difference is substantive (abandoning vs. reforming responsibility), but Node 13 may assign both to "no" on self-creation. They diverge only if step (v) is challenged.  
  - **Case-Based Node Outcomes**:  
    - **Engineered Agent Node (Node 7)**: Used early to test intuitions on history-dependence; "yes" (same responsibility) leans toward current-state views (4, 5, 8); "no" (different) suggests ultimacy matters (leading to 1, 6, 7).  
    - **Self-Revised Agent Node (Node 10)**: Tests if self-creation intuitions matter; "yes" favors libertarian/effort-based views (6, 7); "no" favors compatibilism (4, 5, 9).  

  This tree forces choices at critical junctures, especially Node 4, and uses cases to ground abstract debates. It covers all requested positions, with leaves 2 and 3 emerging from challenges to step (v), and leaf 11 as a cautionary endpoint.
