prompt: |-
  My housemate has one move whenever the subject of pleasure comes up, and its this: 'it's all just dopamine.' Symphony, cigarette, hot bath, a really good nap — same molecule, same reward circuit, so anyone who goes on about higher and lower pleasures is just doing snobbery in a fancier vocabulary. He adds that the brain doesn't have a special room for sonnets, and that you'd trade any one of them for the next hit of any other, so where's the difference. I dont buy it but I can never say exactly what's wrong with it. Can you lay out the different precise things 'it's all just dopamine' could be claiming — everything from the boringly true up to the very strong — and for each one say whether it's plausible, whether it's the kind of claim you'd settle by looking at brains or by looking at what the words mean, and whether it would actually get him to 'so all pleasures are on a par'? A friend once told me the real trouble for hedonism is that pleasures don't have anything in common — I think she called it the heterogeneity problem — and I can't tell whether that's an argument for me or for him. I also keep half-remembering that dopamine is supposed to be about wanting a thing rather than liking it, and I have no idea if that helps me or hurts me. And which reading is he actually leaning on, so I can just say 'you're sliding between two of these'? Lay it out as a menu I can take back into the kitchen, not an essay.
