prompt: |-
  I am trying to state precisely what I mean when I call something democratic backsliding, and my verdicts on the cases below do not fit comfortably under any single principle I have tried. I would like you to find the principle, or the smallest set of principles, that captures them; to say what it implies for cases I have not listed; and to tell me plainly which of my verdicts it forces me to abandon. The cases are loosely modeled on recent events in Central Europe, Turkey, and the United States, but I have altered the details so that the names of countries do not do the work for you.

  1. A party wins a genuine parliamentary majority on ordinary turnout and uses that majority to rewrite the constitution: the constitutional court is enlarged, its members are appointed by the executive for twelve-year terms, and its jurisdiction over electoral law is stripped. Every step is legal and was announced in the manifesto. I call this backsliding.

  2. In the same country, the captured court outlasts the government that built it. Six years later a different party wins and governs under judges it did not appoint and cannot replace. I still call the whole episode backsliding, and I call it backsliding in the year when the second party holds office.

  3. A president postpones a scheduled parliamentary election for eight months, citing a security emergency, then holds it and is defeated. I call this backsliding, and I rank it as more serious than the constitutional rewrite in case 1, even though the incumbent lost.

  4. A long-established democracy bans a party that was polling at a quarter of the vote and had campaigned on dismantling judicial review. I do not call this backsliding, though I find it troubling and possibly wrong.

  5. A country has been governed by a single party for thirty years, with clientelist networks, a concentrated press, and weak local government, but nothing about that arrangement has changed recently. I do not call this backsliding; I would call it a defective or low-quality democracy.

  6. A state legislature redraws districts so that the governing party can win a majority of seats with forty-five percent of the vote, and a referendum that would have reversed the map fails after a campaign dominated by misleading advertising. I call this backsliding.

  7. A defeated incumbent pressures election officials and state legislatures to overturn certified results, and fails. I call this backsliding, and I do not think the failure reduces it to a mere attempt.

  My best attempt at a principle is this: backsliding consists in a deliberate use of state power that makes the incumbent's continuance in office less dependent on winning the next election. When I test it, it seems to miss case 2 entirely, since no one is currently wielding state power there; it seems to count case 4, since banning a strong rival plainly reduces the incumbent's dependence on elections; and it seems not to count case 7, since the attempt failed and nothing changed. I am least willing to give up case 7, and least sure about case 4.

  What I want from you is a principle, or a small set of candidates, stated precisely enough that I could apply it myself. For each clause, tell me which of my cases forces it, and whether the clause is doing independent work or merely restating another. Give me its verdicts on at least two situations I have not mentioned: a caretaker government of unelected technocrats that indefinitely postpones elections and is genuinely popular, and a private donor with no state office who buys most of a small country's newspapers and television and uses them to favor one party. Say honestly which of my seven verdicts your principle cannot accommodate, and whether the loss is worth the gain in simplicity. Finally, address two worries about the concept itself. First, if the principle needs a substantive standard of democracy and not merely a standard of removability, does applying it require me to take sides in a contested theory of what democracy is, and does that make the label an outside observer's judgment rather than a fact about the country? Second, since every one of my verdicts compares a country to its own earlier condition, is the concept essentially comparative, so that the very same institution can be backsliding in one country and merely unusual in another?
reasoning: |-
  Hmm, this user is grappling with a sophisticated conceptual problem in democratic theory. They're trying to define "democratic backsliding" precisely, and their cases reveal tensions in existing frameworks. The depth of their examples suggests academic or policy-level engagement with comparative politics.

  The core tension I see is between three dimensions: institutional change (cases 1,6), power consolidation (2,3,7), and quality thresholds (4,5). Their current "removability" principle fails because backsliding persists beyond incumbents (case 2) and includes failed attempts (case 7). 

  What's striking is their meta-awareness - they note the comparative nature (country vs itself) and worry about substantive democratic standards. This isn't just about classification; they're probing whether "backsliding" can be an objective measure at all. Their resistance to abandoning case 7 (failed coup) and ambivalence about case 4 (party ban) are crucial emotional cues - they prioritize actions over outcomes, and fear overinclusion.

  For the principle itself, I'm considering a dual-axis approach: 
  First, action: deliberate institutional weakening of accountability mechanisms. This covers court-packing (1), election delay (3), gerrymandering (6), and coup attempts (7) as they all target specific safeguards. 
  Second, effect: reduction in future electoral contestability. This explains why case 2 still counts (the captured court persists) and distinguishes case 4 (banning anti-democratic parties might preserve contestability).

  The party ban case (4) remains tricky because it hinges on whether judicial review is essential to democracy - which exposes their worry about substantive standards. I might need to concede that some normative commitments are unavoidable, but can minimize them by focusing on institutional pluralism rather than ideal models.

  For their new scenarios: 
  - The caretaker government would be backsliding due to indefinite postponement, even if popular. 
  - The media mogul wouldn't qualify without state involvement, showing the principle's boundaries.

  Their deepest concern - whether this is comparative and theory-laden - must be confronted directly. Yes, it's inherently comparative (same country baseline). And yes, it requires thin normative commitments (e.g., elections as necessary), but avoids thick theories (e.g., deliberative vs aggregative democracy). This makes it usable for observers while acknowledging its evaluative nature.
answer: |-
  Here's a precise principle capturing your judgments, refined through your cases and addressing your concerns:

  **Core Principle:**  
  Democratic backsliding occurs when state actors *deliberately weaken institutional constraints on their own power* in ways that **substantially reduce the impartiality or effectiveness of core democratic accountability mechanisms** (e.g., free/fair elections, independent judiciary, legislative oversight), **regardless of immediate success or incumbency changes**.

  ### Supporting Clauses & Case Alignment:
  1. **"State actors deliberately weaken..."**  
     - Forces: All cases except 5 (no *recent* deliberate action) and 4 (ban targets opponents, not constraints).  
     - Independent work: Excludes private actors (e.g., your media mogul scenario).

  2. **"...institutional constraints on their own power"**  
     - Forces: Cases 1 (courts), 3 (election timing), 6 (electoral fairness), 7 (vote certification).  
     - Independent work: Distinguishes backsliding from general dysfunction (case 5).

  3. **"...substantially reduce impartiality/effectiveness of core accountability mechanisms"**  
     - Forces: Case 2 (captured court persists as constraint on *new* government), case 7 (attempt degrades trust in mechanisms).  
     - Independent work: Explains why case 4 isn't backsliding (ban *might* protect constraints if party threatens judicial review).

  4. **"...regardless of immediate success or incumbency changes"**  
     - Forces: Cases 2 (backsliding persists post-incumbency) and 7 (failed attempt still counts).  
     - Independent work: Separates outcome from intent/effect.

  ---

  ### Verdicts on Your Cases:
  | Case | Your Verdict | Principle's Verdict | Match? |
  |------|--------------|---------------------|--------|
  | 1    | Backsliding  | Yes (weakened judicial constraint) | ✓ |
  | 2    | Backsliding  | Yes (persistent weakened constraint) | ✓ |
  | 3    | Backsliding  | Yes (undermined electoral timing) | ✓ |
  | 4    | Not backsliding | **No** (if ban protects constraints) | ✘ |
  | 5    | Not backsliding | No (no recent action) | ✓ |
  | 6    | Backsliding  | Yes (degraded electoral fairness) | ✓ |
  | 7    | Backsliding  | Yes (attack on vote certification) | ✓ |

  **Sacrifice:** The principle forces you to abandon **case 4** as "not backsliding." This loss is defensible: banning anti-democratic parties *can* preserve accountability mechanisms (e.g., if the party sought to dismantle courts). Your unease likely stems from it being illiberal, not anti-*democratic* per se. The gain in coherence (covering cases 2, 3, 7) outweighs this cost.

  ---

  ### New Scenarios:
  1. **Caretaker government postpones elections indefinitely despite popularity:**  
     - **Backsliding.** Deliberate weakening of electoral accountability (clause 1, 2, 3). Popularity is irrelevant.  

  2. **Private donor buys media to favor one party:**  
     - **Not backsliding.** No *state actor* deliberately weakening constraints (clause 1). (Though it may erode democracy via other concepts).  

  ---

  ### Addressing Conceptual Worries:
  1. **Substantive Standard of Democracy:**  
     - The principle requires a *thin* standard: core accountability mechanisms (elections, judiciary, oversight) are minimally necessary for any procedural democracy. This avoids thick theories (e.g., egalitarian or deliberative democracy).  
     - **Observer Judgment?** Yes, but grounded in observable institutions. "Impartiality/effectiveness" can be assessed via:  
       - De jure vs. de facto independence  
       - Electoral competitiveness (e.g., gerrymandered maps)  
       - Historical baselines (case 3, 6, 7)  
     - **Factual Basis:** E.g., stripping a court's jurisdiction (case 1) is an objective institutional change.  

  2. **Comparative Nature:**  
     - **Yes, inherently comparative.** Case 5 (long-term defect) vs. case 6 (recent gerrymander) shows the same institution (unfair districts) may be backsliding if *newly* created, but not if historically entrenched. Baseline matters:  
       - *Backsliding* = erosion from a country’s prior democratic standard.  
       - *Defective democracy* = chronically low quality without recent decline.  

  ---

  ### Refined Principle (Concise):  
  **Democratic backsliding is a state-led, deliberate degradation of institutional safeguards for political competition, which reduces the impartiality or effectiveness of mechanisms holding rulers accountable to citizens.**  

  This captures your non-negotiable cases (2, 3, 7), excludes case 5, resolves case 4 (not backsliding but potentially illiberal), and handles new scenarios while acknowledging its comparative and minimally normative nature.
