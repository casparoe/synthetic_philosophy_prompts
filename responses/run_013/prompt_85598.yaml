  Okay so I'm a junior in a 300-level epistemology seminar and we just spent like two weeks on the norms of assertion — knowledge, truth, belief — and I've got a couple questions I feel kinda dumb asking in section.

  Here's whats bugging me. The way it got presented, it's like these are three rival views and you have to pick a team. But that seems obviously wrong? If you know something then you definately also believe it and it's true, so the knowledge norm already contains the other two. So going with the knowledge norm isn't disagreeing with the truth norm, it's just being more demanding. Which makes me think the whole debate is basically fake and everybody actually agrees, they just differ on where to set the bar. Same thing with the confidence issue — I know my roommate's birthday is in March even though if you made me bet on it I'd say I'm maybe 85% sure. So doesn't "knowledge" here just mean "pretty confident"? And if so the knowledge norm is really just a cutoff on credence, and the only real question is where you draw the line, which feels arbitrary. And then the practical worry: does the norm mean I'm lying whenever I assert something I don't actually know? Cause that seems way too harsh for normal conversation with my friends.

  Can you straighten me out on this? American English please, and actually explain it rather than just telling me to go reread Williamson, lol.
reasoning: |-
  Okay, let me tackle this user's epistemology questions. They're a junior in a 300-level seminar on norms of assertion, feeling confused about the knowledge, truth, and belief norms being presented as rivals. They see knowledge as encompassing belief and truth, so the debate seems fake to them. Also, they bring up confidence levels and practical concerns about lying in everyday conversations.

  First, I need to validate their intuition that knowledge implies belief and truth. That's correct, and it's a good starting point. But the debate isn't about logical containment; it's about what's necessary for proper assertion. They're missing the distinction between necessary and sufficient conditions. The norms are competing claims about what makes an assertion proper, not just increasing strictness.

  The user mentions their roommate's birthday example with 85% confidence. That's a common challenge to the knowledge norm. They're equating knowledge with high credence, but epistemology often views knowledge as more than just probability. Maybe they're conflating justification with credence levels. I should explain that Williamson and others argue knowledge isn't just subjective confidence but involves external factors like reliability.

  Their practical concern about lying with friends is important. They're worried the knowledge norm is too strict for casual contexts. Contextualism could help here—norms might apply differently based on stakes. In low-stakes chats, reasonable belief might suffice, but in high-stakes situations, knowledge is required. This addresses their feeling that the knowledge norm is too harsh.

  I should also clarify that the debate isn't arbitrary. Each norm has different implications for Moorean paradoxes, lottery cases, and testimonial knowledge. For example, the truth norm would allow assertions in lottery cases if they turn out true, but that feels wrong. Highlighting these cases shows why the debate matters beyond setting a confidence threshold.

  Their deeper needs: they want reassurance that their questions aren't dumb and seek a clear, jargon-free explanation. They might feel overwhelmed by seminar pressure and need real-world applications. Emphasizing that professionals debate these nuances can boost their confidence. Also, connecting theories to everyday examples like chatting with friends makes it relatable.

  Need to avoid Williamson jargon but still convey key ideas. Stress that the norms are about the propriety of assertion, not just truth conditions. Use their examples to illustrate how each norm handles different scenarios. Conclude that while knowledge might be ideal, contextual factors influence real-world usage, reconciling their intuition with academic discourse.
answer: |-
  You're absolutely **not** dumb for asking these questions – they hit on core tensions in the debate! Your instincts are sharp, and the "team sports" presentation *is* an oversimplification. Let's break this down in plain English:

  **1. The "Rival Views" vs. "Containment" Problem:**
      *   **You're Right:** Logically, KNOWLEDGE entails BELIEF and TRUTH. If you know P, then you must believe P and P must be true. So the Knowledge Norm (KN: "Assert P only if you know P") *does* include the Truth Norm (TN: "Assert P only if P is true") and the Belief Norm (BN: "Assert P only if you believe P") as necessary components.
      *   **Where the Rivalry *Actually* Is:** The debate isn't about logical entailment; it's about **what is both necessary *and sufficient* for an assertion to be *proper* or *warranted*.** Think of it like this:
          *   **Truth Norm (TN) Advocate:** "The *only* thing that *really* matters for whether you *should* have asserted something is whether it turned out to be true. If you said something true, even by accident or guess, your assertion was basically okay. If you said something false, even with great evidence and belief, it was a bad assertion." (This is often seen as too weak/permissive).
          *   **Belief Norm (BN) Advocate:** "Truth is nice, but what matters for propriety is your *state of mind* when you assert. If you sincerely believed it, even if it turned out false, your assertion wasn't *improper* (though it was mistaken). If you asserted without believing it (e.g., lying), *that's* the problem." (Also often seen as too weak).
          *   **Knowledge Norm (KN) Advocate:** "Neither truth alone nor belief alone is sufficient. You need the *right kind* of connection between your belief and the truth – knowledge. Asserting without knowledge is improper *even if* you believe it and *even if* it turns out true (like a lucky guess)."

      *   **So the Real Disagreement:** It's about **what constitutes a *defect* in an assertion.** For KN, asserting without knowledge is *always* defective, even if true/believed. For TN, only falsity is defective. For BN, only lack of belief is defective. KN sets a higher bar for propriety.

  **2. The "Knowledge = Confidence Threshold?" Issue (Your Birthday Example):**
      *   **You're Spot On:** This is a HUGE challenge for KN and highlights why the debate isn't arbitrary *but* connects to deep questions about knowledge itself.
      *   **The KN Advocate's Response (roughly):** They'd argue that knowledge *isn't* just high confidence (credence). They'd say your 85% confidence about your roommate's birthday *isn't* knowledge, precisely because it's not certain enough. "I know it's in March" feels too strong if you'd only give 85%. Genuine knowledge requires something *more robust* than just high probability – things like:
          *   **Non-luckiness:** Your belief must be based on good reasons/memory in a reliable way, not just a probabilistic guess.
          *   **Safety:** In very similar situations, you wouldn't easily be wrong.
          *   **Defeasibility:** There aren't strong, undefeated defeaters you're ignoring.
      *   **The KN Claim:** If you assert "Her birthday is in March" based *only* on 85% confidence (and maybe a hazy memory), you *are* violating the norm, even if you turn out right. You should hedge: "I *think* it's in March," or "I'm pretty sure it's in March." Saving "I know" for cases where your confidence and justification are much higher (e.g., you checked the calendar yesterday).
      *   **Is it Arbitrary?** KN defenders argue it's not *just* about drawing a line (like 95% credence). It's about the *kind* of epistemic position you're in – one that rules out relevant error possibilities. Where that line falls *is* debated (context plays a role), but it's argued to track our actual linguistic practice of when we comfortably say "I know".

  **3. The Practical "Am I Lying to My Friends?" Worry:**
      *   **This is CRUCIAL.** KN sounds incredibly demanding! Does it mean I'm constantly violating norms chatting with friends?
      *   **Two Main Ways KN Advocates Soften the Blow:**
          1.  **Violation ≠ Lying/Immoral:** The norms of assertion are often presented as *propriety* norms (like rules of a game), not necessarily *moral* norms. Violating KN might make your assertion *epistemically improper* or *unwarranted*, but it doesn't automatically make you a liar (which usually requires intent to deceive) or a bad person. It might just mean you were a bit sloppy, overconfident, or spoke without sufficient justification *in that context*.
          2.  **Contextualism/Pragmatics:** Many (including some KN defenders) argue that the *stakes* and *context* matter hugely for how strictly the norm is applied in practice. Chatting casually with friends about where to get coffee? The threshold for "knowing" the café is open might be quite low (you saw people going in yesterday). Asserting to a jury that the defendant was at the scene? The threshold is sky-high. In low-stakes, casual chat:
              *   We often reasonably *take ourselves* to know things based on flimsier evidence than we'd accept in high-stakes situations.
              *   Hearers often grant each other a lot of leeway. We interpret "I know" more loosely.
              *   The *cost* of a mistaken assertion is low, so the norm feels less stringent.
      *   **The Ideal vs. The Practical:** KN might be stating the *ideal* standard. In practice, we often fall short, especially in casual talk. The norm tells us what we *should* aim for, even if we sometimes miss the mark without it being a huge ethical failing.

  **Straightening it Out:**

  1.  **The "Rivalry" is Real (but not about logic):** It's about what constitutes a *defective* assertion. KN says lacking knowledge is *always* defective, even if true/believed. TN says only falsity is defective. BN says only lack of belief is defective. KN sets the highest bar for propriety.
  2.  **Knowledge Isn't *Just* Confidence:** KN advocates argue knowledge requires a secure, non-lucky, reliable connection to the truth, beyond just high subjective probability. Your 85% birthday case likely *isn't* knowledge by KN standards, and asserting "I know" might be improper – hedging would be better.
  3.  **You Aren't Necessarily "Lying" Casually:** Violating KN means your assertion might be *epistemically unwarranted*, not that you're a liar. Context (stakes, looseness of conversation) hugely impacts how strictly the norm is applied and perceived in everyday life. The norm describes an ideal we often approximate imperfectly in casual chat.

  **Your core insight is correct:** KN incorporates the others logically, *and* the debate connects intimately to how strict we think "knowledge" should be and how norms function practically. It's *not* fake, but it's definitely more nuanced than "pick your team." You're asking exactly the right questions to get to the heart of the disagreement! Keep pushing on that "confidence threshold" point – it's central to critiques of KN.
