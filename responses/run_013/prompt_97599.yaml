answer: |-
  ### Classroom Activity: The Paradox of Choice and Commitment  
  **Target Concept:** Eliciting the Allais paradox pattern (violation of the independence axiom) and exploring the tension between ex-ante commitment and ex-post flexibility.  
  **Students:** 16 upper-level undergraduates or graduate students.  
  **Time:** 80 minutes.  
  **Room Setup:** Movable chairs arranged in a circle for discussion; whiteboard for recording choices; two tables at the front for materials.  

  ---

  ### **Materials**  
  1. **Urn and Balls:**  
     - Opaque urn with 100 balls:  
       - 1 red ball (1%)  
       - 10 yellow balls (10%)  
       - 89 blue balls (89%)  
     *(Rationale: Probabilities are intuitive with 100 balls; colors create memorable events.)*  
  2. **Lottery Tickets (for Stage 1):**  
     - Pre-printed tickets for each student (4 per student: 2 for Problem A, 2 for Problem B). Tickets list outcomes per ball color:  
       - **Problem A Tickets:**  
         - *Safe Ticket (A1):* "100 chips, any ball."  
         - *Risky Ticket (A2):* "Red: 0 chips; Yellow: 500 chips; Blue: 100 chips."  
       - **Problem B Tickets:**  
         - *Risky Ticket (B1):* "Red: 0 chips; Yellow: 500 chips; Blue: 0 chips."  
         - *Safe Ticket (B2):* "Red: 100 chips; Yellow: 100 chips; Blue: 0 chips."  
  3. **Commitment Materials (for Stage 2):**  
     - **Planners:** Commitment contracts (paper) reading: "I commit to: Problem A = [A1/A2], Problem B = [B1/B2]."  
     - **Choosers:** Identical contracts + decision slips for each problem ("I choose: [A1/A2]" for Problem A; "[B1/B2]" for Problem B).  
  4. **Payoffs:**  
     - Poker chips (red = 5 chips, blue = 1 chip; used for simplicity).  
     - Final prize: $10 gift card (or equivalent). Chips convert to lottery entries: 1 chip = 1 entry.  
  5. **Other:** Whiteboard markers, coins for randomization, timer.  

  ---

  ### **Lottery Structure & Common Consequence**  
  - **Problem A (Safe vs. Risky):**  
    | Ball Color | Probability | Safe (A1) | Risky (A2) |  
    |------------|-------------|-----------|------------|  
    | Red        | 1%          | 100 chips | 0 chips    |  
    | Yellow     | 10%         | 100 chips | 500 chips  |  
    | Blue       | 89%         | 100 chips | 100 chips  |  
    - *Conflict:* A1 offers certainty (100 chips); A2 has higher EV (139 chips) but a 1% chance of 0.  

  - **Problem B (Risky vs. Safe):**  
    | Ball Color | Probability | Risky (B1) | Safe (B2) |  
    |------------|-------------|------------|-----------|  
    | Red        | 1%          | 0 chips    | 100 chips |  
    | Yellow     | 10%         | 500 chips  | 100 chips |  
    | Blue       | 89%         | 0 chips    | 0 chips   |  
    - *Conflict:* B1 has higher EV (50 chips); B2 has lower EV (11 chips) but avoids the 1% chance of 0.  

  **Key Design:**  
  - The blue ball (89%) is the **common consequence**. In Problem A, blue yields 100 chips for both options (irrelevant to choice). In Problem B, blue yields 0 chips for both (also irrelevant).  
  - Choices should elicit the Allais pattern: **A1 (safe) in Problem A, B1 (risky) in Problem B**—violating independence.  

  ---

  ### **Timeline (80 Minutes Total)**  

  #### **Stage 1: Eliciting the Paradox (30 min)**  
  **Goal:** Students make choices individually; aggregate results show A1/B1 preference reversal.  
  - **0–5 min (Intro):**  
    - Explain rules: “Today, you’ll make choices between lotteries. Payoffs are in chips. At the end, one ball and one choice will be randomly selected to determine your chips. Chips = entries for a $10 prize.”  
    - Show urn/ball distribution (emphasize 1 red, 10 yellow, 89 blue).  
  - **5–10 min (Problem A Choice):**  
    - Present options: “Choose A1 (100 chips no matter what) or A2 (see ticket).”  
    - Students write choice on a slip and take corresponding ticket.  
    - *Facilitator:* Tally A1 vs. A2 on whiteboard (keep individual choices private).  
  - **10–15 min (Problem B Choice):**  
    - Present options: “Choose B1 (see ticket) or B2 (100 chips if red/yellow; 0 if blue).”  
    - Students write choice and take ticket.  
    - Tally B1 vs. B2 on whiteboard.  
  - **15–25 min (Collect Tickets + Transition):**  
    - Collect all tickets/slips (students keep no records).  
    - Shuffle tickets and set aside for later payoff.  
    - *Do not discuss results.* Move to Stage 2.  

  #### **Stage 2: Commitment vs. Flexibility (35 min)**  
  **Goal:** Split class; planners commit to both choices upfront; choosers decide per problem and can abandon plans.  
  - **25–30 min (Split and Explain):**  
    - Divide class: 8 **Planners** and 8 **Choosers** (assign randomly).  
    - **Planners:** “You must write a binding policy for both problems now—before any outcomes are known. You cannot change it later.”  
    - **Choosers:** “Write a plan for both problems now. Later, when you see each problem, you can follow your plan or abandon it.”  
    - Hand out commitment contracts.  
  - **30–35 min (Write Plans):**  
    - All students write plans privately (1–2 min).  
    - Collect planners’ contracts. Choosers keep their plans.  
  - **35–40 min (Choosers: Problem A):**  
    - “Choosers, decide for Problem A: Follow your plan or choose differently? Write your choice on a slip.”  
    - Collect slips.  
  - **40–45 min (Choosers: Problem B):**  
    - Repeat for Problem B.  
  - **45–55 min (Reveal and Compare):**  
    - Post planners’ aggregate choices (A and B) on whiteboard.  
    - Post choosers’ aggregate choices (A and B).  
    - Contrast:  
      - Did planners choose consistently (e.g., A1/B1 or A2/B2)?  
      - Did choosers abandon plans? Did they replicate the A1/B1 reversal?  

  #### **Debrief (15 min)**  
  **Goal:** Name concepts using student-generated data; highlight tension.  
  - **55–60 min (Reveal Stage 1 Results):**  
    - Show Stage 1 tallies: “In Problem A, most chose A1 (safe). In Problem B, most chose B1 (risky). This is a common pattern—let’s see why.”  
    - Whiteboard tables: Point out the blue ball (89%) outcome is identical for both options in each problem.  
      - Problem A (blue): Both give 100 chips → irrelevant.  
      - Problem B (blue): Both give 0 chips → irrelevant.  
    - “The only differences are in red/yellow. Yet you reversed preferences. Why?”  
  - **60–65 min (Introduce Concepts):**  
    - “This is the **Allais paradox**. It violates the **independence axiom**: If two options share an identical outcome in some event (e.g., blue ball), your preference shouldn’t change when that outcome changes—as long as it changes the same way for both.”  
    - “Stage 2 exposed a fix: **Commit in advance**. Planners avoided reversal by choosing a rule upfront. But at what cost?”  
    - Show Stage 2 data: “Planners bound themselves. Choosers? Some abandoned plans when Problem B arose. Why?”  
  - **65–70 min (Discuss Tension):**  
    - “Ex-ante (planners): You want consistency. Ex-post (choosers in Problem B): ‘I’ll likely get 0 anyway—why not gamble for 500?’”  
    - Debate: “What entitles you to bind yourself? Is consistency worth losing flexibility? This is the **sure-thing principle** vs. **dynamic inconsistency**.”  
    - “Resolute choice (stick to the plan) avoids paradoxes. Sophisticated choice (anticipate future temptations) may lead to preemptive compromises.”  
  - **70–75 min (Payoff):**  
    - Randomly select:  
      1. Coin flip: Heads = Stage 1, tails = Stage 2.  
      2. Coin flip: Heads = Problem A, tails = Problem B.  
      3. Draw one ball from urn.  
    - Students calculate chips from their tickets/slips for the selected stage/problem/ball.  
  - **75–80 min (Prize and Wrap-up):**  
    - Collect chip counts. Draw one entry for the $10 prize.  
    - Final remark: “Commitment ‘solves’ the paradox but feels costly when you face the gamble. Is that cost rational or a mistake?”  

  ---

  ### **Predictable Challenges and Solutions**  
  1. **Probability/Payoff Confusion:**  
     - *Risk:* Students miscalculate EVs or misread tickets.  
     - *Fix:* Use physical balls/tickets; walk through one example slowly. Emphasize: “Don’t compute—what feels right?”  

  2. **Planner/Chooser Split Collapses:**  
     - *Risk:* Planners and choosers all pick A1/B1 (no contrast).  
     - *Fix:* Pre-seed discussion: “Planners, you’re writing a rule for both problems at once—think holistically.” If results overlap, emphasize Stage 1 reversal and ask choosers: “Did you want to abandon your plan for Problem B? Why didn’t you?”  

  3. **Student Defends Reversal Better Than Expected:**  
     - *Risk:* E.g., “In Problem A, I avoid a 1% chance of 0 when I can get 100. In Problem B, I’m probably getting 0 anyway, so I maximize upside.”  
     - *Fix:* Leverage this! “Great—this is the **certainty effect**: We overvalue sure gains. But does that justify violating independence? What if all decisions were made at once?”  

  4. **Time Shortages:**  
     - *Risk:* Stage 2 or debrief runs over.  
     - *Fix:* Trim payoff to 3 min; skip prize draw (announce winner later). Prioritize debrief questions.  

  ---

  ### **What the Activity Cannot Reproduce**  
  **The Debrief Must Supply:**  
  - **Dynamic Consistency in Sequential Choice:** This activity uses two separate static choices. It does not show how the paradox manifests in a *single sequential decision* (e.g., choosing whether to enter a gamble with multiple stages).  
    - *How to address:* Explain in debrief: “In dynamic settings, violating independence can lead to time inconsistency—e.g., planning to avoid a gamble but taking it when it arises. Resolute chookers stick to plans; sophisticated ones adjust plans anticipating future lapses.”  
  - **Normative Weight of Axioms:** The activity makes violations feel intuitive but doesn’t prove why independence is normative.  
    - *How to address:* Say: “The independence axiom isn’t ‘wrong’—it ensures dynamic consistency. But it conflicts with how we psychologically weigh certainty. Philosophers debate which matters more.”  

  **Output:** Students experience their own Allais reversal, confront the cost of commitment, and debate rationality in real time—setting up deeper theory discussions.
