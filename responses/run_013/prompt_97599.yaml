  - A2: red=0, yellow=500, blue=100 -> EV = (5/100)*0 + (10/100)*500 + (85/100)*100 = 0 + 50 + 85 = 135.

  Problem B:
  - B1: red=0, yellow=500, blue=0 -> EV = 50.
  - B2: red=100, yellow=100, blue=0 -> EV = (15/100)*100 = 15.

