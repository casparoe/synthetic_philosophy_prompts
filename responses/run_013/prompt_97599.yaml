  Then discuss commitment: The planners had to choose both at once. They might have seen the common structure and chosen consistently. But when you are a chooser, you face each problem separately. You might choose A1 because you don't want to risk 0 when you can have 100 for sure. Then when you face Problem B, you think: "I'm likely to get 0 anyway, so why not go for 500?" That feels rational at each step, but together it violates independence. So if you care about consistency, you might want to bind yourself to a rule. But when you are in Problem B, you might regret having bound yourself to B2? Because then you have an 11% chance of 100 and 89% of 0, but you could have had a 10% chance of 500? So the plan that you made ex-ante (which might have been to choose B2 to be consistent) now seems bad. So commitment has a cost: you might forgo an attractive option.

  This is the tension: commitment enforces consistency but at the cost of flexibility.

  Finally, the feature the activity cannot reproduce: It does not show the dynamic inconsistency in a single sequential decision problem. We are showing two separate static choices. We are not showing that the same person, facing a sequence of choices, would plan one thing and then deviate. That is a different setting (resolute vs sophisticated choice). But we can mention it in the debrief: in a dynamic setting, if you have to make a plan and then carry it out, you might deviate. The sophisticated chooser anticipates their future deviation and plans accordingly. The resolute chooser sticks to the plan. Our planners are resolute, and our choosers are not necessarily sophisticated because they didn't anticipate future choices? They just faced each choice as it came.

  So in the debrief, we can connect to dynamic choice and the concepts of resolute and sophisticated choice.

  We are ready to write the activity.

  Note: We are using 1%, 10%, 89% to match the classic Allais. But we can adjust if 1% is too small? We can use 5 red, 10 yellow, 85 blue? Then:

  Problem A:
