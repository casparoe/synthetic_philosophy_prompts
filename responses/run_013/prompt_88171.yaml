  For each case, the flip consideration and the weak step:

  Case 1: 
  - Flip: If we had evidence that the machine could have malfunctioned even with one interlock functional, then step 2 would fail for factors 1 and 2 (they would not be necessary because the injury might have happened anyway). But then step 3: we could still say that preventing either defeat would have been sufficient? But if the interlock might have failed, then we are not sure. So step 3 might also fail. Then we might have no cause? That would be bad.
  - Weak step: Step 2 (but-for) might be attacked: "Are you sure the first interlock would have stopped the machine? What if it had failed?" We must have evidence that the interlocks were reliable.

  Case 2:
  - Flip: If the inspection would not have found the hazard, then step 2 fails (the omission would not be necessary). Then we have to rely on other factors.
  - Weak step: Step 2 relies on the chain: enforcement -> inspection -> detection -> correction. Any break and the but-for test fails.

  Case 3:
  - Flip: If we cannot establish that the understaffing caused the worker to take the shortcut (maybe the worker was just lazy), then step 2 fails. Then we must rely on step 3? But if we cannot define an intervention, then we have no cause. Then it would not be named.
  - Weak step: Step 2 (but-for) is very sensitive to the causal link between understaffing and the unsafe act.

  Finally, the procedure must be taught in plain terms:

  - But-for test: "If we had fixed this problem beforehand, would the injury have been avoided?" (For an omission: "If we had done the missing action, would the injury have been avoided?")
  - Intervention test: "If we had stepped in and changed this factor (by doing X), would that have stopped the injury?" (Requires a specific X.)
  - Robustness: "If we fix this, will it prevent not just this incident but similar ones in the future?"
  - Selection: "Which of these causes is the most important to fix to prevent future incidents, and which one can we hold the employer responsible for under our regulations?"

  We drop the terms counterfactual and interventionist. We focus on the questions.

  My confidence: 
  - The procedure should work for most cases. It is a hybrid. 
  - The weakest point is the but-for test for omissions and standing conditions because we must make assumptions about what would have happened. 
  - The selection step will be controversial, but that is policy.

  Overall, it should meet the requirements.
answer: |-
  Below is a decision procedure for causal attribution in workplace injury investigations, designed to reconcile the "but-for" (counterfactual) and "interventionist" (manipulation-based) perspectives. The procedure is structured as a sequence of questions, executable in 90 minutes per case, with clear criteria for answers, termination points, and explicit handoffs to policy or convention. It is framed in plain language for investigators without philosophical training, preserving only essential distinctions:

  - **But-for necessity**: "Would the injury have been prevented if this factor had been absent (or corrected)?"  
  - **Interventionist sufficiency**: "Could a specific, well-defined action to change this factor have prevented the injury?"  
  - **Robustness**: "Would changing this factor prevent similar injuries across plausible scenarios, or only in this exact situation?"  
  - **Causal relevance vs. named cause**: Separates factors that *contributed* to the outcome (causal relevance) from the single factor selected for citation (a policy choice).

  The procedure has six steps, with time allocations summing to 90 minutes. Steps 1–4 establish causal relevance; Step 5 selects the named cause; Step 6 documents. **Termination rules**:  
  - If a step yields "no causal factors," terminate with "no cause found."  
  - If policy/convention is needed (e.g., selecting among multiple causes), hand off to the board.  
  - Explicitly flag where answers depend on investigator judgment or agency convention.

  ---

  ### **Decision Procedure**  
  **Total Time: 90 minutes**  

  #### **Step 1: List Candidate Factors (10 minutes)**  
  - **Question**: "What specific factors—events, conditions, omissions, or decisions—were present and might have contributed to the injury?"  
  - **Adequate Answer**: A concise list (3–5 factors max). Include:  
    - Events (e.g., "guard removed").  
    - Conditions (e.g., "understaffing").  
    - Omissions (e.g., "supervisor didn’t enforce inspection").  
    - *Drop*: Vague or overly broad factors (e.g., "poor culture").  
  - **Termination**: If no factors listed, end with "no cause found."  
  - **Judgment Call**: Investigator selects factors based on evidence. No causation assessed yet.  

  #### **Step 2: Test for But-For Necessity (20 minutes)**  
  - **Question for each factor**: "If this factor had been absent (or corrected) and everything else was the same, would the injury have been prevented?"  
    - For omissions: "If the omitted action had been performed, would the injury have been prevented?"  
  - **Adequate Answer**:  
    - **Yes**: Factor is *causally relevant* (necessary in these circumstances). Proceed to Step 4.  
    - **No**: Factor is not necessary. Proceed to Step 3.  
    - **Unclear**: Flag for Step 3 (e.g., if evidence is weak).  
  - **Termination**: If no factors pass, proceed to Step 3 for non-necessary factors.  
  - **Judgment Call**: Requires counterfactual reasoning; uncertainty must be noted.  

  #### **Step 3: Test for Interventionist Sufficiency (25 minutes)**  
  - **Question for non-necessary/unclear factors from Step 2**: "Could a specific, realistic action (intervention) have changed this factor before the incident? If so, would that action have prevented the injury?"  
  - **Adequate Answer**:  
    - **Yes (with defined intervention)**: Factor is *causally relevant* (sufficient via manipulation). Describe the intervention (e.g., "install a guard," "add staff for that shift").  
    - **No/Unclear**: Factor is not causally relevant. Set aside.  
  - **Termination**: If no factors pass Steps 2 or 3, end with "no cause found."  
  - **Key Distinction**: Intervention must be **well-defined** (what, when, how). If not, the factor fails (e.g., chronic understaffing may lack a specific intervention).  
  - **Judgment Call**: Investigator defines intervention; uncertainty invalidates the factor.  

  #### **Step 4: Assess Robustness (10 minutes)**  
  - **Question for all causally relevant factors (from Steps 2 or 3)**: "Would changing this factor prevent similar injuries across a range of plausible scenarios, or only in this exact situation?"  
  - **Adequate Answer**:  
    - **Robust**: Change prevents injury in most scenarios (e.g., "installing a guard always helps").  
    - **Sensitive but not robust**: Change only works in this specific case (e.g., "reprimanding one worker who made a rare mistake").  
  - **Output**: Labels factors as "robust" or "sensitive." Does *not* eliminate factors.  
  - **Judgment Call**: Based on evidence patterns; no formal threshold.  

  #### **Step 5: Select Named Cause (Policy/Convention Step) (20 minutes)**  
  - **Question**: "Which causally relevant factor should be cited, considering:  
    a. Preventability: Which factor, if addressed, would most effectively prevent future injuries?  
    b. Responsibility: Which factor was within the employer’s control?  
    c. Regulatory scope: Which factor aligns with our existing regulations?  
    d. Feasibility: Which factor has a clear, actionable fix?"  
  - **Adequate Answer**: One factor selected, even if multiple are causally relevant.  
  - **Handoff to Board**:  
    - If multiple factors are equally valid, hand off with: "Multiple causes exist; selection requires policy choice."  
    - Explicitly state: "The named cause is a convention for enforcement, not the only cause."  
  - **Termination**: Selection made or handed to the board.  
  - **Convention**: The choice is not determined by facts; it is a values-based policy decision.  

  #### **Step 6: Document Reasoning (5 minutes)**  
  - **Output**: Concise report:  
    - Causally relevant factors (from Steps 2–4), with labels (necessary/sufficient, robust/sensitive).  
    - Why the named cause was selected (Step 5 criteria).  
    - Uncertainties or conventions flagged.  

  ---

  ### **Worked Examples**  
  #### **Case 1: Redundant Interlocks Defeated**  
  - **Incident**: Two interlocks on a pallet truck were defeated months apart; either would have prevented a fatal crush.  
  - **Step 1 (Factors)**:  
    - Factor A: First interlock defeated (event).  
    - Factor B: Second interlock defeated (event).  
    - Factor C: Machine operated with no functional interlocks (condition).  
  - **Step 2 (But-For)**:  
    - Factor A: If not defeated, injury would have been prevented (yes—necessary).  
    - Factor B: If not defeated, injury would have been prevented (yes—necessary).  
    - Factor C: If absent (one interlock functional), injury prevented (yes—necessary).  
  - **Step 3 (Intervention)**: Skipped (all passed Step 2).  
  - **Step 4 (Robustness)**: All robust (interlocks prevent injury in most scenarios).  
  - **Step 5 (Selection)**:  
    - **Causally relevant**: A, B, C.  
    - **Selection**: Choose Factor C (operating without interlocks). It is the most direct, aligns with regulations (machinery safety standards), and addresses systemic failure.  
    - **Convention**: A or B could be chosen, but C is more enforceable.  
  - **Procedure Output**: "Named cause: Operating the machine with no functional interlocks (Factor C). [A and B are causally relevant but not cited.]"  
  - **Flip Consideration**: If evidence showed one interlock could fail spontaneously, Factor C might not be robust (Step 4), weakening the case.  
  - **Weak Step**: Step 2—counsel could argue that Factor A/B wasn’t necessary if the other interlock defeat alone was sufficient. **Survives** because both were necessary in this setup.  

  #### **Case 2: Supervisor’s Failure to Enforce Inspection (Omission)**  
  - **Incident**: Supervisor didn’t enforce pre-shift inspection; a missed hazard caused injury.  
  - **Step 1 (Factors)**:  
    - Factor D: Supervisor’s failure to enforce inspection (omission).  
  - **Step 2 (But-For)**:  
    - Factor D: If enforced, would inspection have detected the hazard? If yes, injury prevented (yes—necessary).  
  - **Step 3 (Intervention)**: Skipped (passed Step 2).  
  - **Step 4 (Robustness)**: Robust (enforcing inspections generally prevents such injuries).  
  - **Step 5 (Selection)**:  
    - **Causally relevant**: D.  
    - **Selection**: Name Factor D (fits preventability, responsibility, and regulatory scope).  
  - **Procedure Output**: "Named cause: Failure to enforce pre-shift inspection."  
  - **Flip Consideration**: If inspections were historically ineffective, Factor D might fail Step 2 (no but-for necessity).  
  - **Weak Step**: Step 2—cross-examination could challenge if the inspection *would* have found the hazard. **Survives** if evidence supports it.  

  #### **Case 3: Chronic Understaffing**  
  - **Incident**: Understaffing led to rational shortcuts, causing injury.  
  - **Step 1 (Factors)**:  
    - Factor E: Chronic understaffing (condition).  
    - Factor F: Worker’s shortcut (event).  
  - **Step 2 (But-For)**:  
    - Factor E: If staffing was adequate, would the shortcut have been avoided? **Unclear** (maybe, but not certain).  
    - Factor F: If no shortcut, injury prevented (yes—necessary).  
  - **Step 3 (Intervention)**:  
    - Factor E: Intervention: "Add two workers to the shift." Would it have prevented the injury? **Unclear** (depends on if workers still take shortcuts). **Fails**—intervention not well-defined or outcome uncertain.  
  - **Step 4 (Robustness)**: Factor F is sensitive (only applies to this worker/scenario).  
  - **Step 5 (Selection)**:  
    - **Causally relevant**: Only Factor F (shortcut). Factor E fails Steps 2–3.  
    - **Selection**: Name Factor F (the shortcut). It is necessary, within employer control (via training/supervision), and actionable.  
    - **Handoff**: If board insists on understaffing, explain: "Factor E is not causally relevant per procedure; naming it requires policy override."  
  - **Procedure Output**: "Named cause: Worker’s unsafe shortcut (Factor F). Understaffing (Factor E) is not causally relevant—intervention was not well-defined or would not clearly prevent injury."  
  - **Flip Consideration**: If data shows adequate staffing *always* prevents shortcuts, Factor E passes Step 2.  
  - **Weak Step**: Step 3—cross-examination would attack intervention definition. **Breaks** if "add two workers" is arbitrary or unsupported.  

  ---

  ### **Explicit Limitations**  
  1. **Policy Handoffs**:  
     - Step 5 (selection) is purely convention. The board must decide when multiple causes exist.  
     - Factors like understaffing may be policy-driven (e.g., "Should we cite systemic issues beyond immediate causes?").  
  2. **Judgment Dressed as Method**:  
     - Step 2 (but-for) and Step 3 (intervention) rely on investigator judgment about what "would have" happened.  
     - Step 4 (robustness) is subjective; two investigators may disagree.  
  3. **What the Procedure Cannot Do**:  
     - **Resolve overdetermination without convention**: In Case 1, it lists multiple causes but forces a single citation by policy.  
     - **Handle poorly defined interventions**: Chronic issues (e.g., understaffing) often fail Step 3—this is a defect in the *factor*, not the procedure.  
     - **Eliminate dissent**: A competent investigator could:  
       - Define interventions differently in Step 3 (e.g., understaffing might pass with a better-defined action).  
       - Assess robustness oppositely in Step 4 (e.g., deem understaffing "robust" with strong data).  
     - **Assign liability**: The procedure identifies causation; liability is counsel's domain.  

  **Confidence Assessment**:  
  - **High confidence** in Cases 1 and 2: They fit core tests cleanly.  
  - **Low confidence** in Case 3: It hinges on Step 3 (intervention definition), which is vulnerable to evidence gaps. If the intervention were clearer (e.g., "staff to OSHA-recommended levels"), the outcome might flip.  

  This procedure is a practical hybrid: it uses but-for for necessity, intervention for sufficiency, and forces transparency in selection. It should withstand challenges if investigators document reasoning rigorously.
