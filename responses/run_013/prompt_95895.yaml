prompt: |-
  I'm writing a dissertation prospectus (philosophy, so call it a year of full-time work) and I want to pitch something on internal vs. external reasons, but not the usual "does the sound-deliberation test rule out too much" argument that everyone runs. Here's my half-formed idea and I'd like you to turn it into the prospectus. Almost the whole debate is about a reason someone has *right now*, relative to the motivational set they already have. I think the interesting cases are ones where the reason is a reason to *become a different agent* — to acquire a whole new motivational set. Getting sober, falling in love, converting to a religion, deciding to become a parent, taking up a vocation. Call these conversion reasons, for now. My hunch is they don't fit the dichotomy cleanly. If the reason has to be internal, it looks like it has to be grounded in the very set you're trying to leave, which is bizarre (the drinker's reason to stop grounded in his wanting to drink?); if it's external, the internalist loses a big class of cases she wanted, and the externalist owes us an account of how an external reason could even move someone whose motivational set is exactly what stands in the way. I want the prospetus to (1) state the question so it has a determinate answer — something like, is there a class of reasons that is neither internal nor external in the standard senses, and if so what is it? — (2) explain why the existing positions leave this open rather than settling it, without a literature review by citation (I'll fill in citations myself), (3) say what the method actually is, chapter by chapter, (4) say what a result would look like and what would count as the project failing, and (5) be honest about scope: is this a year or is it a career? Also flag the one or two spots where I might just be redescribing akrasia or the transformative-experience stuff, and say what would actually be new there. American English please.
reasoning: |-
  Okay, let's start by unpacking the user's request. They're writing a philosophy dissertation prospectus on internal vs. external reasons, specifically focusing on "conversion reasons" like getting sober or converting to a religion. The user wants to avoid the standard debates and instead explore cases where reasons involve becoming a different agent. 

  First, I need to understand their core concern: the current dichotomy doesn't handle transformative changes well. The user mentions the paradox—how can an internal reason be grounded in a motivational set you're trying to leave? And if it's external, how does it motivate someone whose current set opposes it? 

  The user's explicit requirements are clear: structure the prospectus around five points (question framing, existing positions, method, results, scope). But deeper needs might include establishing originality—they mention avoiding rehashing akrasia or transformative experience literature. They probably want to position their work as filling a genuine gap, not just rebranding existing concepts. 

  I should note their emphasis on "determinate answer." They want a focused research question, not just a critique. The prospectus must show how this leads to a substantive contribution, possibly a new category of reasons. 

  Also, scope honesty is crucial. They're doing a one-year project (dissertation prospectus), so I'll need to frame it as foundational—laying groundwork, not solving everything. Flagging where it might overlap with akrasia/transformative experiences is key; the novelty is in the structural challenge to the reasons framework itself. 

  For structure: Chapter 1 sets up the dichotomy's failure for conversion cases. Chapter 2 critiques internalism/externalism on this front. Chapter 3 explores the metaphysics of "becoming a different agent." Chapter 4 develops the positive account. Chapter 5 tests it against objections. 

  Potential pitfalls: If conversion reasons collapse into external reasons or masked internal ones, the project fails. Success would be showing they require a third category. Originality hinges on framing conversion as restructuring agency itself, not just preferences or knowledge. 

  I'll avoid citations per their request but imply engagement with Williams (internalism), Parfit (externalism), and Paul (transformative experience) where relevant. Stress that this isn't about deliberation under uncertainty (Paul) or weakness of will but about the pre-deliberative reason to transform. 

  Finally, tone: American English, academic but not verbose. Prospectus should feel like a roadmap—ambitious but feasible in a year. Highlight the "bizarre" paradox early to hook interest.
answer: |-
  Here’s a structured prospectus draft focused on your core idea, avoiding standard debates and emphasizing "conversion reasons." This is designed for a one-year dissertation project:

  ---

  **Dissertation Prospectus: Conversion Reasons and the Limits of the Internal/External Dichotomy**

  **1. Core Research Question:**  
  Does the standard Williams-style internal/external reasons dichotomy adequately account for "conversion reasons" – reasons an agent has *to fundamentally transform their motivational set* (e.g., becoming sober, religious, a parent, or committed to a vocation)? If not, what is the nature of these reasons, and what does their existence imply for the structure of practical reason?

  **2. The Gap in the Existing Debate:**  
  The dominant internalism/externalism debate fixates on whether a reason *right now* must be grounded in an agent's *current* "subjective motivational set" (S) to be genuine (internalism) or can exist independently of S (externalism). This framework assumes relative stability in S. It struggles profoundly with cases where the reason *itself* prescribes a radical restructuring of S.  

  *   **Internalism’s Problem:** If conversion reasons are internal, they must be grounded in elements *within* the very S the agent aims to abandon. This seems paradoxical: e.g., grounding the reason to become sober *in* the alcoholic's desire to drink, or their current aversion to withdrawal. This distorts the phenomenology of conversion, where the *rejection* of core elements of S is central.  
  *   **Externalism’s Problem:** While externalism can posit reasons independent of S, it lacks a compelling account of how such reasons could *practically engage* an agent whose S is deeply hostile to the transformation. Merely stating an external reason exists doesn't explain its normative force *for this agent at this pre-conversion stage*, nor how it could motivate the leap to a new S.  

  Existing positions primarily address reasons *within* a stable S or against a backdrop of minor S-adjustments. They either implicitly bracket radical S-change or treat it derivatively (e.g., as external reasons *about* S-change, or complex internal reasons involving higher-order desires). The *distinctive normative structure* of reasons *for* S-transformation itself remains undertheorized.

  **3. Methodology & Chapter Structure:**  
  *   **Method:** Conceptual analysis informed by phenomenological description of paradigmatic conversion experiences (sobriety, religious conversion, vocational commitment, parenthood). Critical engagement with core texts in internalism/externalism, focusing on their implicit assumptions about agency and motivation over time. Development of a positive account grounded in the logic of transformative agency.  
  *   **Chapter Breakdown:**  
      *   **Ch1: The Internal/External Dichotomy and its Limits:** Precisely defines the standard Williams-inspired framework, its core commitments, and its typical domain of application (reasons relative to a stable S). Demonstrates its intuitive appeal and limitations through standard examples. Introduces "conversion reasons" as a distinct challenge class.  
      *   **Ch2: Why Existing Frameworks Fail Conversion Cases:** Detailed critique showing how both internalism and externalism generate paradoxes or inadequacies when applied to conversion reasons (as outlined in Section 2 above). Argues that attempts to force conversion reasons into either category distort their essence.  
      *   **Ch3: The Metaphysics of Becoming a Different Agent:** Explores what it means to "acquire a whole new motivational set." Analyzes the structure of agency before, during, and after conversion. Distinguishes conversion from mere preference shift, weakness of will (akrasia), and adaptation. Examines the role of temporality and narrative identity.  
      *   **Ch4: The Structure of Conversion Reasons:** Develops the positive account. Argues conversion reasons are:  
          *   *Prospective*: They are reasons *for* a future state of agency with a radically different S.  
          *   *Conditional on Possibility & Value*: Their force depends on (a) the genuine possibility of achieving the new S, and (b) the objective (or intersubjectively robust) value *of the form of life* enabled by the new S.  
          *   *Motivationally Indirect*: They engage the agent not by appealing directly to current S-elements, but by creating normative pressure *to make oneself receptive* to new values/motives, often via "leaps" or commitments facilitated by external scaffolding (community, ritual, therapy).  
      *   **Ch5: Objections, Implications, and Scope:** Addresses key challenges (e.g., collapse into externalism? Redescription of akrasia/transformative choice? Vagueness of "new S"?). Explores implications for moral psychology (autonomy, responsibility in conversion), normative ethics (demands of self-betterment), and meta-ethics (authority of reason). Defends the account's coherence and necessity.  

  **4. Expected Results & Success/Failure Conditions:**  
  *   **Successful Result:** A robust argument demonstrating that conversion reasons constitute a distinct category irreducible to standard internal or external reasons, necessitating a revision or expansion of the reasons taxonomy. A positive account explaining their normative source, force, and motivational pathway. Showing how this illuminates profound human experiences neglected by standard theory.  
  *   **Failure Conditions:**  
      *   If conversion reasons are convincingly shown to be merely a complex subset of external reasons (e.g., reasons about future well-being independent of current S) without unique features.  
      *   If the "paradox" for internalism can be fully resolved by appealing to latent or higher-order elements within the *current* S.  
      *   If the phenomenon is adequately captured by existing concepts like transformative experience or resolvable akrasia, rendering the new category superfluous.  
      *   If the positive account proves incoherent (e.g., cannot explain normative force without collapsing into externalism, or motivation without collapsing into internalism).  

  **5. Scope, Originality, and Distinctions:**  
  *   **Scope:** This is a **one-year dissertation project**. It aims to *identify, characterize, and defend the significance* of conversion reasons as a challenge to the dichotomy, developing a foundational positive account. It does *not* aim for a comprehensive theory of transformative agency, a full historical survey, or extensive empirical work. Future work could explore specific conversion types or meta-ethical foundations.  
  *   **Distinguishing from Akrasia:** Akrasia involves acting *against* one's current best judgment *within* a relatively stable S. Conversion reasons are about *changing the S itself*, potentially altering what counts as a "best judgment." The conflict isn't between judgment and desire, but between the current S and a *proposed future S*. The project focuses on the *reason to initiate* that change.  
  *   **Distinguishing from Transformative Experience (L.A. Paul):** Paul focuses on epistemically transformative choices (you can't know what it's like beforehand) and their impact on rational decision-making *based on preferences*. This project focuses on the *normative structure of the reason to undergo* a transformation that alters your *core motivations* (S), regardless of epistemic transformation. It asks *what kind of reason* could justify becoming someone with fundamentally different values, not (primarily) *how* to choose under radical uncertainty about experience.  
  *   **Core Novelty:** The explicit focus on reasons *to change one's motivational set* (S) as a *direct normative target*, exposing a structural blind spot in the internal/external framework centered on reasons relative to a *fixed* S. This generates a distinct paradox, especially for internalism, and demands a novel account of normative engagement with one's own future agency.

  ---

  **Key Strengths for a Prospectus:**

  1.  **Clear, Novel Question:** Moves beyond the "sound deliberation test" debate to a focused challenge grounded in transformative agency.
  2.  **Identifies a Specific Gap:** Explicitly shows *why* the dichotomy struggles with conversion reasons, using the core logic of each position against itself.
  3.  **Defensible Scope:** Presents a manageable 5-chapter structure for one year, focused on conceptual groundwork and a positive proposal.
  4.  **Defined Success/Failure:** Provides clear benchmarks for evaluating the project's outcome.
  5.  **Proactive on Overlap:** Addresses potential confusion with akrasia and transformative experience head-on, carving out the distinct contribution.
  6.  **American English & Tone:** Uses accessible academic prose appropriate for a philosophy prospectus.

  **Next Steps for You:**

  1.  **Flesh out Paradigms:** Develop detailed descriptions of 2-3 core conversion examples (sobriety is strong, maybe vocation + one other).
  2.  **Key Citations:** Slot in Williams (internal), Parfit/Scanlon (external), Paul (transformative exp), Frankfurt (higher-order/will), maybe Moran or Velleman on agency. Find sources on specific conversions (e.g., addiction theory for sobriety).
  3.  **Sharpen Positive Account:** Refine the tentative view in Ch4. Is the "normative pressure" internal? External? Something else? How does "making oneself receptive" work?
  4.  **Anticipate Objections:** Brainstorm the strongest counterarguments, especially the "it's just external reasons" or "it's just complex internal reasons" lines.

  This structure provides a solid, original foundation for a compelling dissertation that tackles a genuine puzzle within a major contemporary debate. Good luck!
