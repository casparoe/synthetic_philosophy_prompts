  Structural constraints: Context-sensitivity might be optional but useful. Cycles must be prohibited to maintain rationality. Independence of irrelevant alternatives is tricky; while ideal, some accounts (like parity) might need to violate it, so it's negotiable. But cycles are non-negotiable as they make decisions incoherent.

