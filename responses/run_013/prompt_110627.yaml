prompt: |-
  hey — I'm in a third-year phil of AI course (we've spent the last few weeks on the "how do you even tell a machine what you want it to do" unit) and our prof is having everyone in the class submit one draft essay question for the final, along with a model answer and a marking scheme. The best ones go into the class study doc. I want mine to actually be good, so can you write it for me?

  Here's the thing I want the question to be about. We spent one lecture on this contrast and then rushed past it. The standard picture is a goal-directed agent: it has some outcome specifed (maximise paperclips, or a utility function over world-states) and it picks actions that make that outcome more likely. An approval-directed agent is supposed to be different — instead of a goal over world-states, its objective is to do what a human would approve of, so at each choice point it's asking something like 'which action would the human approve of most?' I get the appeal (there's nothing to get wrong in the specification, you just point at a person), but sitting in section I genuinely couldn't tell whether that's a seperate kind of agent or just a goal-directed agent whose goal happens to be about somebody's mental states.

  So I want a question that forces a student to take a side on that, and that they can't answer by reciting the usual instrumentally-convergent-drives checklist (resource acquisition, self-preservation, goal-content integrity). Everyone in that room can do the recitation in their sleep and it would tell me nothing about whether they followed the lecture.

  Please give me:

  - the exam question itself — one essay question, about 45 minutes, 20 marks
  - a model answer, roughly 600 words, the kind of thing a strong student could actually produce in that time
  - a marking scheme built as five must-hit points, 4 marks each, with one line per point on how students typically lose those marks

  Keep it self-contained. No references, no 'see the reading for week 6', and dont put any citations in the model answer either — I don't need them. Students who did the reading will have the reading; the question shouldn't be a memory test.

  Last thing: if the distinction I'm drawing isn't really a distinction — if approval-directedness just collapses into goal-directedness and the interesting question is somewhere else entirely — please just say that instead of writing the marking scheme I asked for. Same if the question I'm imagining can't be marked out of 20 without being either trivial or unfair to the students. I'd rather find out now than hand in something the prof guts.
