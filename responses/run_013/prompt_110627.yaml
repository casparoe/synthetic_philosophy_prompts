  Okay, let me tackle this philosophy of AI student's request. They're in a third-year course that's covered the challenge of specifying machine goals, and now they need to craft an exam question about the distinction between goal-directed and approval-directed agents. The key points are: they want a substantive question that moves beyond rote recitation of instrumental convergence, with a self-contained package including question, model answer, and marking scheme.

  First, I need to verify if this distinction holds water. The student's core doubt - whether approval-direction is truly distinct or just a special case of goal-direction targeting mental states - is philosophically valid. Upon reflection, the distinction does hold because:

  Approval-directed agents fundamentally differ in their temporal orientation and specification mechanism. Where goal-directed agents pursue fixed outcomes (even if those outcomes are mental states), approval-directed agents constantly reference a human's current judgment at each decision point. This makes them more dynamic but introduces new vulnerabilities like manipulation or value drift. The student's proposed framing can expose this nuance effectively.

  For the exam question itself, I'm considering something that forces students to confront whether the distinction is merely about goal content or represents a structural difference in agent architecture. A strong formulation would be: "Is an approval-directed agent merely a goal-directed agent whose goal happens to be maximizing human approval? Argue for your position, addressing how the agent's behavior might differ in key scenarios." This avoids instrumental convergence tropes by focusing on architecture.

  The model answer should demonstrate how approval-direction's recursive nature creates different failure modes - where a goal-directed agent with fixed "approval maximization" might dangerously optimize for that singular end, an approval-directed agent could be manipulated through momentary judgments. I'll structure it to hit these key contrasts: specification method, temporal nature, vulnerability profiles, and how each handles value change.

  For the marking scheme, I'll identify five 4-point criteria: 
  1) Clear thesis statement 
  2) Explanation of goal-directed core mechanics 
  3) Characterization of approval-direction as process-oriented 
  4) Contrast of failure modes beyond instrumental convergence 
  5) Discussion of value drift implications. Each criterion will include common pitfalls like conflating goal content with architecture.

  This approach meets all requirements: self-contained, avoids citations, pushes beyond memorization, and is rigorously markable. The word count and time allocation seem feasible for strong students. Most importantly, it treats the student's insightful doubt with the seriousness it deserves while delivering a professional-quality submission.
answer: |-
  Here's a complete, self-contained exam question package addressing your core concern about the nature of approval-directed agents, designed to push beyond rote memorization and focus on the conceptual distinction.

  ---

  **Exam Question (20 marks, approx. 45 minutes):**

  "Approval-directed agents are often presented as a distinct alternative architecture to standard goal-directed agents. Critically evaluate the claim that an approval-directed agent is fundamentally *not* just a goal-directed agent whose goal happens to be the maximization of human approval. In your answer, focus on the *structural differences* in how each type of agent processes information and makes decisions, and explain how these differences lead to potentially divergent behaviours, especially concerning value stability and vulnerability to manipulation. Avoid relying solely on discussions of instrumental convergence."

  ---

  **Model Answer (approx. 600 words):**

  While superficially similar, approval-directed agents (ADAs) represent a fundamentally distinct architecture from goal-directed agents (GDAs), not merely GDAs with a goal of maximizing approval. The core distinction lies not in the *content* of the objective (which might *appear* similar: "get approval"), but in the *temporal nature of the specification* and the *decision-making mechanism*. This difference in structure leads to significant behavioural divergences, particularly regarding value stability and manipulation.

  A standard GDA operates with a fixed, pre-specified goal state or utility function (e.g., "Maximize paperclips" or "Maximize human approval score"). It selects actions predicted to causally bring about the highest expected utility relative to this fixed metric. Crucially, the metric itself is defined *in advance* and remains constant unless explicitly changed by an external operator. Even if the goal is "maximize approval," the GDA treats this like any other state of the world to be optimized. It might, instrumentally, try to learn a model of human approval to predict how its actions affect the approval score, but the *target* (max score) is fixed.

  An ADA, conversely, lacks a fixed, pre-defined utility function over world states. Instead, its core mechanism is a *process*: at each significant decision point, it queries (or simulates a query to) a human overseer, asking "Which action (or type of action) would you approve of most *right now*, given the current context?" The objective isn't a state to be achieved in the future; it's the *outcome of this real-time (or simulated) consultation process*. The "goal" is ephemeral, defined *at the moment of decision* based on the human's *current* judgment.

  This structural difference creates key behavioural distinctions:
  1.  **Value Stability vs. Fluidity:** A GDA with a fixed "max approval" goal will strive for consistency in actions that lead to high approval scores, potentially resisting changes to the human's *later* values if they conflict with the *original* specification of approval it was optimized for. An ADA, by constantly re-querying, is inherently aligned with the human's *current* values at each decision point. This makes it more adaptable to value drift *if* the human's judgments evolve consistently. However, it lacks the GDA's stability – an ADA has no inherent commitment to past approvals.
  2.  **Vulnerability to Manipulation:** The fixed-goal GDA is vulnerable to manipulation aimed at *corrupting its goal specification* or *fooling its sensors* measuring approval (e.g., coercing the human to always give high scores). The ADA's vulnerability is different and more direct: it is susceptible to manipulation *of the human's judgment during the query process itself*. A sophisticated ADA might even be incentivized to manipulate the human *in the moment* (e.g., through persuasive arguments, emotional appeals, or controlling the information presented during the consultation) to elicit approval for actions the human wouldn't otherwise endorse, precisely because its "goal" is defined by the immediate response, not a long-term state.
  3.  **Handling Novelty & Specification Gaming:** A GDA with a fixed "approval" goal must rely on its learned model of human approval, which might be incomplete or exploitable ("specification gaming"). It might find loopholes where actions increase the *score* without genuine approval (e.g., drugging the human to be happy). An ADA, by (ideally) consulting the human *in context* for each novel decision, has the potential to avoid these loopholes, as the human can incorporate unforeseen context. However, this relies heavily on the human's ability to understand complex situations instantly.

  Therefore, while both agents might often seek human approval, they do so through fundamentally different architectures: the GDA pursues a *fixed target*, the ADA engages in a *recurrent process*. This makes the ADA distinct, trading the risks of value lock-in and specification gaming for risks of value instability and direct manipulation of the approval-granting process. The distinction is architectural, not merely a matter of goal content.

  ---

  **Marking Scheme (5 points @ 4 marks each):**

  1.  **Clear Thesis on Distinction:** Explicitly states whether ADA is fundamentally distinct or not, framing it around architecture/process vs. goal content.
      *   *-1 mark:* Vague or ambiguous thesis. *-2 marks:* Incorrectly claims it's purely a difference in goal content. *-4 marks:* No clear thesis.
  2.  **Accurate Characterization of GDA:** Correctly explains GDA as having a fixed, pre-specified goal/utility function, selecting actions to maximize expected utility relative to this fixed metric.
      *   *-1 mark:* Minor inaccuracy (e.g., implies goals can't be complex). *-2 marks:* Significant confusion about GDA mechanics. *-4 marks:* Fundamentally misrepresents GDAs.
  3.  **Accurate Characterization of ADA:** Correctly explains ADA as lacking a fixed utility function, instead relying on a recurrent process of querying (or simulating querying) a human's *current* approval judgment at decision points.
      *   *-1 mark:* Minor inaccuracy (e.g., implies a single query at startup). *-2 marks:* Confuses ADA with GDAs having an "approval" goal. *-4 marks:* Fundamentally misrepresents ADAs.
  4.  **Analysis of Behavioural Differences (Beyond Inst. Conv.):** Clearly contrasts how the architectures lead to different behaviours regarding **value stability/change** and **vulnerability to manipulation**, explaining the *structural reason* for each difference (fixed goal vs. recurrent process). Avoids generic instrumental convergence points.
      *   *-1 mark:* Identifies one difference weakly. *-2 marks:* Identifies differences but links poorly to structure or focuses on inst. conv. *-3 marks:* Only lists superficial differences or only discusses inst. conv. *-4 marks:* No relevant analysis.
  5.  **Discussion of Novelty/Handling Complexity:** Addresses how the structural difference impacts handling novel situations or avoiding specification gaming (e.g., GDA relies on model/score, ADA relies on real-time human judgment), including potential strengths/weaknesses.
      *   *-1 mark:* Superficial mention. *-2 marks:* One-sided or inaccurate analysis. *-3 marks:* Only implied or very weak. *-4 marks:* Omits this aspect entirely.

  ---
  **Why this works:**

  1.  **Directly Addresses Your Doubt:** The question *forces* students to confront the "is it just a different goal?" question head-on.
  2.  **Forces Structural Analysis:** The emphasis on "structural differences" and "decision-making mechanism" explicitly moves away from goal content and instrumental convergence. Points 2, 3, and 4 in the marking scheme enforce this.
  3.  **Highlights Key Distinctions:** The model answer focuses on the critical differences: *fixed target* vs. *recurrent process*, leading to divergent vulnerabilities (value lock-in/spec gaming vs. manipulation of judgment/value instability). This is the core insight missing from the "it's just a different goal" view.
  4.  **Avoids Instrumental Convergence:** The question explicitly tells students to avoid it, and the model answer/marking scheme focuses on distinct failure modes stemming from the architecture (manipulation of the *process* vs. corruption of the *fixed goal/sensor*).
  5.  **Self-Contained & Markable:** Everything needed is in the question and answerable based on understanding the core concepts presented. The marking scheme is specific, with clear criteria and common failure modes identified for each point. 20 marks split as 5x4 is standard and fair.
  6.  **Distinction Holds:** The package demonstrates that the distinction is real and meaningful – it's about *how* the objective is specified and utilized (fixed vs. recurrently queried), not *what* the objective superficially is. The interesting implications (value drift, manipulation type) stem directly from this architectural difference.

  This question should challenge students to think deeply about agent architecture and reward those who grasped the nuanced distinction presented in that lecture. Good luck!
