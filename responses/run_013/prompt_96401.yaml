answer: |-
  ## The Unrecorded Promise

  The blue light of the terminal bled into the grey pre-dawn filtering through the ward’s high windows. Anya Sharma’s eyes burned, fixed on the blinking cursor in the Discharge Readiness Assessment template. Section 4.3: *Adherence Event Analysis*. Below it, the empty box pulsed, demanding its feed of quantified cognition.

  The event itself was simple, etched in the mundane rhythm of the Geriatric Psychiatry ward. Mr. Henderson, frail but sharp, had promised his sister, visiting yesterday afternoon, that he *would* take his evening Seroquel. He’d said it clearly, looking her in the eye, with Nurse Patel and Anya herself standing right there during meds prep. "Cross my heart, Elsie. Won't forget." Evening came. The automated dispenser clicked open. Mr. Henderson looked at the cup, muttered "Not now," and pushed it away. When confronted later, his face crumpled. "I meant to," he’d whispered. "Truly meant to."

  Simple. Human. A broken promise, a regret. And utterly inexpressible in the new lexicon mandated by the Research Office’s five-year "Conceptual Optimization Initiative."

  Anya’s fingers hovered over the keyboard. The banned words hung in the air like ghosts: *meant, promised, forgot, regret*. Her colleague, Leo Chen, leaned against the adjacent workstation, sipping bitter hospital coffee. He’d been an early adopter, a true believer in the migration. "Stuck on Henderson?" he asked, his tone sympathetic but edged with that familiar, frustrating certainty.

  "Trying to capture the... the deviation," Anya said carefully, avoiding the abyss of forbidden language. "His stated intention during the high-salience social interaction with his sister, contrasted with the subsequent action outcome."

  Leo nodded approvingly. "Exactly. Pre-migration, you’d be wrestling with 'broken promise' and 'guilt'. Folk psychology baggage. All you *have* is the observable: a vocalization associated with positive affect markers in the presence of kin, followed by a failure to initiate the target action sequence when the stimulus cue was presented later under lower-arousal conditions. The 'meant to' is just post-hoc confabulation – noise in the prediction error signal."

  "The promise," Anya started, then stopped. The word felt illicit. "The... *binding* aspect. The commitment he made to her. The report can't capture why his sister was so upset, beyond negatively valenced vocalizations. It can't say he *broke* something."

  Leo smiled, the patient smile of someone explaining gravity to a child clinging to flat earth. "Because he didn't *break* anything, Anya. There's no metaphysical bond to snap. That's the whole *point* of the migration. 'Broke his word' implies a non-existent entity – 'word' as some kind of binding token. The new vocabulary cuts through that illusion. It’s more honest. Raw data, not folk tales." He tapped his temple. "We're finally describing the actual machinery."

  Anya looked back at the terminal. *Binding. Promise. Regret.* Machinery. She began to type, forcing the event into the approved parameters:

  >*Subject exhibited high-probability vocalization (P=0.92) indicating future action execution (ingestion of medication 7B) during a dyadic interaction characterized by elevated positive valence (observed smile frequency +32% baseline) and significant social reward salience (kin presence). Subsequent presentation of target stimulus (medication dispenser cue, 19:00 hrs) failed to trigger the associated action tendency above behavioral threshold (observed latency >300s, action aborted). Post-event inquiry elicited verbalizations suggesting retrospective assignment of high intention weight to the prior state, interpreted as compensatory narrative generation following significant prediction error (Δ observed vs. predicted action = 1.0).*

  It was accurate, in a sterile, airlocked way. It described the inputs and outputs, the probabilities and the error signal. It said nothing about Elsie Henderson’s face falling when they told her this morning, the way she’d whispered, "But he *promised* me." It said nothing about the quiet shame in Mr. Henderson’s "meant to." The report reduced the moral weight, the personal failure, the tiny tragedy of trust fractured, to a miscalibrated policy prior and a missed action threshold. The vocabulary didn’t just describe; it redefined the event, stripping it of its interpersonal significance. It was lossy compression, discarding the very data that mattered most to the people involved – the *why* behind the distress.

  Later, in the mandatory "Vocabulary Integration Workshop," the self-application problem bit hard. Dr. Aris Thorne, a Research Office liaison radiating zealous conviction, was presenting the justification – again.

  "...the pre-migration lexicon," Thorne declared, clicking to a slide titled "Folk Theory Artifacts," "relied on *unvalidated constructs*. 'Beliefs,' 'desires,' 'intentions' – these are the *phlogiston* of the mind! They *feel* real, but they don't correspond to measurable, biological processes. They are *emergent properties*, at best, useful fictions for social coordination, but fundamentally *misleading* when we need precision, when we need to *understand* pathology to heal!"

  Anya watched him. He *believed* this. He clearly *desired* them to adopt this view. His *intention* was to persuade. The words he banished were the only tools he had to build his own argument. He seemed utterly unaware of the contradiction, riding the slide between "don't exist" and "are not fundamental" with rhetorical ease. *Useful fictions*, he called the old words, while using them to dismantle their own reality.

  A junior resident raised a tentative hand. "Dr. Thorne, in the new incident reporting form, for a staff error... how do we capture if someone *knew* a procedure but chose to ignore it? Or if they genuinely *misunderstood*?"

  Thorne beamed. "Excellent question! You move away from the unobservable 'knew' or 'misunderstood'. You describe the *stimulus* – the procedure manual, the supervisor's instruction. You quantify the *response* – deviation from protocol steps. You analyze the *reinforcement history* – were there prior deviations without consequence? Was the correct action low-salience due to competing stimuli? You build the *why* from observable data streams, not postulated mental states."

  "But," the resident persisted, "what if they *say* they misunderstood? Or *say* they knew but chose differently?"

  "Verbal reports are data points!" Thorne said, undaunted. "Inputs to be weighed against other inputs – past behavior, situational factors. The *claim* of misunderstanding is a behavioral output itself, possibly influenced by perceived negative consequences or social expectations. We record the *claim*, analyze its context, its likelihood given the evidence. We don’t reify the 'understanding' or the 'choice' as internal causes." He paused, then added, almost as an afterthought, "It requires discipline, but it leads to *truer* accounts."

  Anya thought of Mr. Henderson’s "meant to." Just a claim. Just noise. She glanced at Leo, who was nodding vigorously. Discipline. Honesty. The allure of a clean, mechanistic world.

  The escape hatch was proposed by Brenda from Palliative Care during the coffee break. "Look," she said, stirring synthetic creamer, "why can't we just... *bifurcate*? Use the new sciency talk for the official records, the research, the internal optimizations. But keep the old words for talking to patients, families, even each other in handover? A useful fiction for the messy human bits. Call it a 'patient-facing interface layer'." She smiled, pleased with her tech analogy.

  Leo shook his head before Anya could speak. "It leaks, Brenda. Immediately. Where does the 'interface layer' end and the 'real' record begin? Your discharge note for Henderson – does it tell the family he had a 'significant prediction error'? Or do you tell them he forgot, or broke his promise? If you write the family note in the old language, what do you put in the *official* discharge summary that determines his care plan? They have to align, or you create dissonance, conflicting records."

  "And," Anya added quietly, thinking of Elsie Henderson’s face, "the 'messy human bits' *are* the care. The promise *mattered* to his sister. His regret *mattered* to him. If we only record the machine language in the permanent record, that’s the reality the institution acts on. The human part becomes... unofficial. Apocryphal."

  Brenda frowned. "But surely, for things like apologies, or explaining risk..."

  "It contaminates," Leo insisted. "You start writing an incident report. You want to say 'Nurse A *believed* the alarm was faulty'. But that’s banned. So you write 'Nurse A exhibited low response probability to auditory stimulus X'. But then you think, that sounds like she wasn't paying attention, which feels like *blame*, which is also unscientific... so you water it down further. The record becomes bloodless, and the *reason* things go wrong gets lost in the avoidance of outlawed concepts. The fiction doesn't stay contained. It either bleeds into the science, or the science bleeds the humanity out of the care." He looked at Anya. "Right?"

  Anya thought of the word she couldn’t use. *Promise*. A concept the system now deemed ontologically suspect, a relic. But without it, how could you understand the specific sting of its breaking? How could you record the reason Elsie cried? The vocabulary migration wasn’t just changing labels; it was dismantling the conceptual scaffolding for entire dimensions of human experience – blame, testimony, apology, the binding force of a vow. It abandoned the institutional purpose of understanding the patient as a *person* within a web of relationships and obligations, not just a cluster of predictive algorithms. And it did so under the banner of greater accuracy, blind to what it was discarding.

  Back at her terminal, facing the blinking cursor in Section 4.3, Anya made a decision. She wouldn’t defy outright. The machinery description was already there, accurate and cold.

  Below the official box, outside the structured template, was a small, unformatted "Clinician Notes" field. Rarely used, seldom read by anyone but other frontline staff. It wasn’t part of the optimized, machine-readable record. It was a tiny pocket of resistance, a buffer against total loss.

  Her fingers flew, typing words that felt dangerous, liberating:

  >*Pt made explicit promise to sister (present) @ 16:30 to take evening meds. Witnessed by RN Patel & self. Expressed clear intent. Sister emphasized importance, pt affirmed. @ 19:00, refused meds. Later expressed sincere regret ("meant to"). Sister deeply distressed by broken promise – core to her assessment of pt's reliability at home. This interpersonal breach, sense of letting kin down, significant factor in current low mood & likely contributor to adherence hesitation. Not captured in probability distributions. Needs addressing relationally, not just behaviorally.*

  She saved the document. The official report, with its salience weights and action tendencies, would feed the algorithms, the research databases, the discharge checklist. It described *what* happened in the language of cause and effect the institution now demanded.

  The note in the margin held the *why* that mattered. It held the promise, the breaking, the regret. It held the human cost the new vocabulary had carefully excised. It was a tiny, fragile schema holding data the migration couldn't carry, data the system might no longer recognize, but data without which the picture was incomplete, the understanding fatally compromised.

  Anya closed the terminal. Dawn was breaking properly now, washing the ward in pale, indifferent light. She hadn’t won an argument. She hadn’t proven the existence of promises or the soul. She had simply refused to let the specific gravity of Mr. Henderson's failure, and Elsie's pain, disappear entirely into the pristine, amnesia-inducing fields of the new system. She had preserved a fragment of the old, lossy, human compression, knowing it held a truth the more accurate language could not see. The silence of the unrecorded promise was, for now, held at bay.
