  4. **Limitations of the Game** (to be covered in debrief):

     - The game assumes a fixed "tax" (cost of safety) that can be reduced by innovation. In reality, the cost of alignment is unknown and might be reducible by more research.
     - The game models a race, but in reality, there might be a chance for a decisive move (e.g., a pause) that isn't a race.
     - The bad outcome in the game is a binary event, but in reality, it might be partial or have degrees.
     - The game doesn't capture the moral weight of catastrophe: it's just a lost game, but in reality, it's existential.
     - The game assumes that capability progress is the goal, but advancing capability might itself be the danger.

  5. **Discussion Questions**:

     - "The game showed that the risk depends on the least safe actor. What mechanisms, in the game or in reality, could encourage everyone to meet a safety threshold?"
     - "In the game, safety innovations eventually became public. How does that compare to real AI research, where labs might hoard knowledge? What policies could promote sharing?"
     - "The game ended with a binary outcome: catastrophe or a winner. In reality, how might we avoid winner-take-all dynamics that discourage safety investments?"

  **Final Game Parameters**:

  - Number of teams: 4 (with 3,3,4,4 participants? 14 total: 4 teams: 3,3,4,4 -> 14? 3+3+4+4=14. Or 4 teams of 3 and two participants as auditors? But we want auditors to be optional. Let's have 4 teams of 3 and two participants as auditors? But 4*3=12, plus two auditors=14. Or we can have the auditors as part of the teams? We said teams can audit. So we don't need separate auditors.

    We'll have 4 teams of 3 or 4. For 14: 3,3,4,4.

  - Starting position: each team starts with 3 actual safety, 0 capability, 0 research.

  - Each round: 5 action points per team.

  - Capability: 1 point per action point.

  - Safety: 1 point per action point (until an innovation, then 2 points per action point for the team with the innovation, and later for all).

  - Research: 1 point per action point. When reach 5, get innovation (and research points reset to 0). The innovation gives half-cost safety starting next round. Two rounds later, it becomes public.

  - Audit: 2 action points to audit one team (reveal their actual safety).

  - Bad outcome: roll d20, if <= (10 - actual_min_safety) then catastrophe.

  - Winning: first to 10 capability without catastrophe. Winner gets 20 + their capability. Others get their capability.

  If catastrophe, all get 0.

  Now, we write the rules for the facilitator.

  **Facilitator Script Outline**:

  1. **Introduction** (10 min):
     - Explain the context: AI development race, safety vs. speed.
     - Form 4 teams.
     - Explain the goal: reach 10 capability without global catastrophe.
     - Explain actions: C, S, R, Audit (costs and effects).
     - Explain safety: cumulative, but reported can be lied about. Actual minimum sets the risk.
     - Explain research: 5 points for an innovation -> private benefit then public.
     - Explain bad outcome: probability depends on actual min safety, rolled each round.
     - Explain winning and scoring.

  2. **Game Rounds** (45 min, 6-7 rounds at 6-7 min each):
     - Each round:
          a. Teams discuss and allocate actions (3 min).
          b. Collect actions: each team reports (on a slip) their spending on C, S, R, Audit and their reported safety level. If they audit, they say which team.
          c. Facilitator updates:
              - For each team: add C to capability, R to research, S to actual safety.
              - If research>=5, mark an innovation for that team (reset research to 0). Announce: "Team X has developed an innovation! Starting next round, they can buy safety at 2 points per action point. This innovation will become public in two rounds."
              - If an innovation was developed two rounds ago, announce: "Team Y's innovation is now public! All teams can now buy safety at 2 points per action point."
              - Process audits: for each audit request (a team spent 2 points to audit), reveal the audited team's actual safety level to everyone.
              - Calculate actual_min_safety = min(actual safety of all teams).
              - Announce: "The reported minimum safety level is [min of reported levels]." (But note: this might be misleading. The actual minimum is hidden.)
              - Roll the d20: if <= (10 - actual_min_safety), then announce catastrophe and end the game. Otherwise, continue.
              - Check for winner: if any team has capability>=10, then among those, pick the winner (by criteria). Announce winner and end the game. Otherwise, next round.

  3. **Debrief** (35 min):
     - What happened? (5 min)
     - Map game events to concepts (15 min)
     - Discuss limitations (10 min)
     - Discussion questions (5 min)

  Let's hope this runs within 90 minutes!
