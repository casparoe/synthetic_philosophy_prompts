  Here’s a complete game design, **"The Threshold Race,"** tailored to your workshop constraints. It focuses on structural dynamics (winner-take-all vs. shared incentives, knowledge spillover, weakest-link risk, verification) and minimizes lecturing. Participants experience how rational self-interest shifts based on these features.

  ---

  ### **Game Overview**
  **Core Idea**: Teams race to deploy an AI system ("reach the Threshold") while managing safety costs. The risk of a shared catastrophe depends on the **weakest safety level** across all teams. Safety techniques leak over time, reducing the "tax," but auditing claims is costly. Teams balance private rewards against collective risk.

  **Players**:  
  - 14 participants → **3 teams of 4** + **2 Auditors** (adjustable: 4 teams of 3 if needed).  
  - **Teams** ("Labs"): Race to accumulate 10 "Capability Points" (CP) while investing in safety.  
  - **Auditors**: Verify safety claims at a cost (funded by a shared "trust budget").  

  **Materials**:  
  - **Team Sheets**: Track CP, safety level (SL), and "safety tokens" (see below).  
  - **Central Board**: Publicly tracks CP, announced SL, and "Innovation Timer" (for spillovers).  
  - **Tokens**:  
    - **Capability Tokens (green)**: 1 token = 1 CP (openly visible).  
    - **Safety Tokens (blue)**: Represent safety investment (hidden until audited or spilled).  
    - **Trust Tokens (white)**: Auditors use these to fund verifications (1 per audit).  
  - **Dice**: Two six-sided dice (for catastrophe risk).  
  - **Timer**: For rounds (5 min/round).  

  **Payoffs (no real money)**:  
  - **Winner**: Team reaching 10 CP first gets **+3 prestige points** (symbolic win).  
  - **All teams**: Avoid catastrophe to earn **1 prestige per 2 CP** (shared reward).  
  - **Catastrophe**: All teams lose prestige (reset to 0) if triggered.  

  ---

  ### **Rules & Sequence**  
  **Setup** (10 min):  
  - Assign roles (3 teams, 2 auditors). Explain:  
    - Goal: Reach 10 CP first *or* maximize collective CP if no one wins.  
    - Catastrophe: Triggered if weakest SL is too low (based on dice roll).  
    - Safety tokens: Reduce catastrophe risk but cost actions.  
  - Give each team:  
    - 5 green tokens (capability), 5 blue tokens (safety), team sheet.  
    - Start at 0 CP, 0 SL.  
  - Auditors get 3 white tokens (trust budget).  

  **Round Structure** (6 rounds max; 5 min/round):  
  1. **Invest & Announce (2 min)**:  
     - Teams secretly allocate tokens to:  
       - **Capability (C)**: 1 token → 1 CP (place green tokens publicly on board).  
       - **Safety (S)**: 1 token → 1 SL (keep blue tokens hidden).  
       - *Optional*: **Research (R)**: 1 token → 1 "innovation point" (hold aside).  
     - Teams **announce their SL** (can lie; no proof required).  
     - *Example: Team A spends 3C/1S/1R → gains 3 CP, claims SL=5 (truth: SL=1).*  

  2. **Audit Phase (1 min)**:  
     - Auditors spend 1 trust token to verify **one team’s SL**.  
     - Facilitator reveals true SL to all. Auditors get 1 new token/round (max 3).  

  3. **Spillover & Innovation (1 min)**:  
     - If a team spent R tokens:  
       - **Immediate**: They gain +1 SL per 2R spent (cost reduction).  
       - **Lagged**: Place R tokens on "Innovation Timer." Next round, these tokens become public safety knowledge → **all teams’ future S tokens cost half** (1 token → 2 SL).  
     - *Example: Team B spends 2R → gains +1 SL now. Next round, all teams get 2 SL per S token.*  

  4. **Catastrophe Check (1 min)**:  
     - Calculate **weakest true SL** (using audited values or last known announcements).  
     - Roll dice: Catastrophe if **roll ≤ (10 – weakest SL)**.  
       - *Example: Weakest SL=4 → catastrophe on dice roll 1-6.*  
     - If catastrophe: Game ends. All prestige lost.  

  5. **Winning Check**:  
     - If a team hits 10 CP: Game ends. Winner gets +3 prestige.  
     - Else: Continue.  

  ---

  ### **Key Mechanics Embedding Your Concepts**  
  - **Alignment Tax as Opportunity Cost**: Safety tokens (S) cost the same as capability (C) → choosing safety slows CP progress.  
  - **Weakest-Link Public Good**: Catastrophe risk depends on the **lowest true SL** (even one neglectful team endangers all).  
  - **Lagged Spillover**: Research (R) reduces future safety costs for everyone → early investors pay a "tax" that later becomes a public good.  
  - **Verification Problem**: Auditors have limited tokens → teams can lie about SL, but audits make claims credible at a cost.  

  ---

  ### **Predictable Problems & Solutions**  
  1. **Catastrophe triggers early**:  
     - **Why**: Weakest SL is low in early rounds (e.g., SL=2 → 80% risk).  
     - **Fix**:  
       - Start teams with SL=3 (dice threshold: 10-3=7 → 58% risk).  
       - If catastrophe hits early: **Restart the round** with a debrief hint: *"What could have prevented this? How might shared risk change your choices?"*  

  2. **Teams prioritize "winning" over safety**:  
     - **Why**: Prestige for winning (+3) vs. shared CP (1 per 2 CP) incentivizes racing.  
     - **Fix**:  
       - Debrief questions: *"Did anyone feel pressured to neglect safety? What would change if the winner shared rewards?"*  
       - Mid-game reminder: *"Remember: catastrophe resets ALL prestige."*  

  3. **Auditors underused or misused**:  
     - **Why**: Audits cost trust tokens; teams may not see value.  
     - **Fix**:  
       - After Round 2, reveal a team’s false claim (e.g., *"Team X announced SL=5, but truth was SL=1"*).  
       - Ask: *"How does uncertainty about others’ safety affect your trust?"*  

  ---

  ### **Structured Debrief** (20 min)  
  **Map Game Moments to Concepts**:  
  - **Opportunity Cost**: *"When did your team skip safety to race? What did you gain/lose?"*  
    → Highlight rounds where teams sacrificed SL for CP.  
  - **Weakest-Link**: *"How did one team’s low SL put everyone at risk? Could you ‘fix’ them?"*  
    → Use a catastrophe round to show collective vulnerability.  
  - **Spillover**: *"Did anyone wait for others’ research? How did spillovers change safety costs?"*  
    → Contrast early vs. late safety spending.  
  - **Verification**: *"When did a lie go uncaught? What changed after an audit?"*  
    → Note gaps between announced SL and true SL.  

  **Limitations of the Game** (Facilitator must clarify):  
  - **Real uncertainty**: Game CP/SL are predictable; real AI progress is not.  
  - **"Tax" reducibility**: Game safety costs are fixed; real safety breakthroughs could reduce the tax.  
  - **Moral weight**: Catastrophe is a dice roll; real risks involve suffering.  
  - **Winner-take-all assumption**: Game forces a race; real outcomes could involve coordination.  

  **Closing Discussion Questions**:  
  1. *"In the game, spillovers made safety cheaper over time. In reality, would labs share knowledge, or hoard it to win? What policies might incentivize sharing?"*  
  2. *"We treated catastrophe risk as a dice roll. How might real AI labs estimate this risk? What if we’re wrong?"*  
  3. *"The game had a clear ‘threshold’ (10 CP). What if real AI progress has no clear finish line, or the danger comes before deployment?"*  

  ---

  ### **Timing & Logistics**  
  - **Setup**: 10 min  
  - **Game Rounds**: 6 rounds × 5 min = 30 min  
  - **Debrief**: 20 min  
  - **Buffer**: 10 min (for delays)  
  - **Total**: 70–80 min (within 90 min)  

  **First-Time Facilitator Tips**:  
  - **Simplify tracking**: Use magnetic tokens on a central board for CP/SL.  
  - **Force spillovers**: If no one researches, add a "public grant" in Round 3 (free R tokens to one team) to trigger spillovers.  
  - **Emphasize role-play**: *"You’re a lab CEO: win while avoiding disaster."*  

  This design ensures participants *experience* the competitiveness constraint as mutable, not fixed. By Round 3, spillovers and audits shift incentives, revealing how structure shapes strategy—not lectures.
