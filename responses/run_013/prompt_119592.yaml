  *   **(c) Leibniz's Solution:** You correctly saw the 'thinner notion of law' problem but missed Leibniz's key move: Natural law *is* the **law of the 'Republic of Spirits' or 'City of God'**. God is its sovereign legislator, promulgating laws to rational minds based on eternal norms of perfection. This reconciles his view of law with his rejection of arbitrary commands.

