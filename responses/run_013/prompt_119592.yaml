      *   ❌ **Missing Distinction 2: Principle/Foundation:** Omits Leibniz's key metaphysical distinction:  
          *   *Jus strictum*: Founded on the principle of **peace** (no disturbance).  
          *   *Aequitas*: Founded on the principle of **equity**/proportionality (Strict right is a type of equity).  
          *   *Pietas*: Founded on the principle of **perfection**/appetition for the good (universal benevolence). (-1 point)
