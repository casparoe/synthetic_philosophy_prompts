  First, I need to recall Moore's original argument from "Proof of an External World." Moore did hold up his hands, but the key point was that these are external objects, not just that they exist. The podcast seems to miss this nuance. The user mentions the skeptic being refuted because Moore's premises are more certain—that part aligns with Moore, who argued that common sense beliefs are more plausible than skeptical hypotheses.

  The podcast claims Moore conceded he couldn't prove his premises and thus only believed them, not knew them. But Moore explicitly stated he knew these premises with certainty. This is a major inaccuracy. Moore's point was that such knowledge doesn't need philosophical proof; it's foundational.

