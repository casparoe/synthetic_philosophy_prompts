answer: |-
  ### Decision Procedure for the Ethics Committee

  Below is a step-by-step decision procedure grounded in philosophical work on personal identity (e.g., Derek Parfit's psychological continuity theory, Eric Olson's biological view, and the "what matters in survival" debate). The procedure prioritizes operational usability for clinicians and lawyers, defers to policy where philosophy underdetermines answers, and respects autonomy and precedent. It assumes a baseline of patient competence unless otherwise established.

  **Core Principles from Philosophy**  
  - **Psychological Continuity**: A person persists if there is overlapping chains of psychological connections (memories, beliefs, intentions, character). This is the dominant view for "what matters in survival" (Parfit).  
  - **Biological Continuity**: A person is the same if their biological organism persists (Olson). Less favored for mental continuity but legally pragmatic.  
  - **Branching**: If continuity splits (e.g., two successors), identity cannot be preserved (violates transitivity). Policy must resolve rights allocation.  
  - **Advance Directives**: Binding if the patient is the same person and incompetent; invalidated if the patient is competent and revokes them.  
  - **Autonomy**: Current competent wishes trump prior directives unless a prior commitment (e.g., trial consent) is irrevocable per protocol.  
  - **Underdetermination**: Philosophy does not resolve all cases (e.g., incomplete replacement, branching). Policy must fill gaps.  

  **Decision Procedure: Questions and Steps**  
  *Run in order; terminate at a decision or policy referral.*

  1. **Is the current entity (CE) competent?**  
     - *Assessment*: Standard clinical evaluation (e.g., understands consequences, communicates clearly).  
     - *Adequate answer*: Yes → Proceed to Q2. No → Use OP’s advance directive; terminate.  
     - *Grounding*: Autonomy requires competence. If incompetent, OP’s directive stands (legal default).  

  2. **Does the CE exhibit strong psychological continuity with the original person (OP)?**  
     - *Assessment*: Evidence of first-person memory (recalls OP’s experiences as "I"), persistent beliefs/values, and no radical disruption (e.g., CE identifies as OP or describes OP’s life as their own). Use interviews, neurocognitive tests.  
     - *Adequate answer*:  
       - **Yes** → Proceed to Q3.  
       - **No** → Proceed to Q4.  
     - *Grounding*: Psychological continuity is primary for "what matters" (Parfit). Discontinuity suggests a new or distinct entity.  

  3. **Is there branching (e.g., multiple claimants to OP’s identity)?**  
     - *Assessment*: Are there other entities (e.g., parallel modules, hemispheres) claiming OP’s identity with psychological continuity?  
     - *Adequate answer*:  
       - **No branching** → CE is OP. Respect CE’s current wishes; terminate.  
       - **Branching** → Proceed to Q6.  
     - *Grounding*: Non-branching continuity implies identity; branching voids identity (philosophical consensus).  

  4. **Is there biological continuity with OP?**  
     - *Assessment*: Same living organism? Check for uninterrupted life processes (e.g., no brain death, same body).  
     - *Adequate answer*:  
       - **Yes** → Proceed to Q5.  
       - **No** → CE is a new person. Respect CE’s current wishes; terminate.  
     - *Grounding*: Biology is a fallback for legal personhood (Olson), but less defensible for mental identity.  

  5. **Is the CE psychologically discontinuous but biologically continuous?**  
     - *Assessment*: CE has OP’s body but no psychological links.  
     - *Adequate answer*:  
       - **Yes** → Apply OP’s advance directive; terminate.  
       - **No** → (Rare) Refer to committee for policy.  
     - *Grounding*: Philosophy underdetermines this (conflict between biology and psychology). Policy default: OP’s directive binds the body.  

  6. **Branching: How many entities claim psychological continuity with OP?**  
     - *Assessment*: Count distinct, competent entities with valid claims.  
     - *Adequate answer*:  
       - **One entity** → Error (branching implies >1); reassess.  
       - **Multiple entities** → Refer to committee for policy; terminate.  
     - *Grounding*: Identity cannot branch; policy must allocate rights (e.g., which entity inherits OP’s legal status).  

  **Where Philosophy Underdetermines Answers**  
  - Q5 (biological continuity without psychology): No consensus on whether the body or a new person exists.  
  - Q6 (branching): No philosophical basis to favor one successor over another.  
  - **Policy referrals** require committee votes on conventions (e.g., "first successor inherits rights").  

  ---

  ### Application to Cases

  **Case 1: Patient at 66% Completion**  
  *CE insists OP was "someone else," demands withdrawal. Stopping is fatal.*  
  - **Q1**: CE competent (understands consequences). → Proceed.  
  - **Q2**: **No psychological continuity** (disavows OP’s identity; memories not first-person). → Proceed to Q4.  
  - **Q4**: **Biological continuity?** Yes (same organism, gradual replacement incomplete). → Proceed to Q5.  
  - **Q5**: **Psychologically discontinuous, biologically continuous**. → Apply OP’s advance directive.  
  - **Decision**: Directive governs. If directive authorized trial completion, continue despite CE’s wishes. If silent, committee interprets intent.  
  - **Chair’s concern**: You may dislike overriding CE’s autonomy. Philosophy supports this via biology, but it is counterintuitive. Policy could prioritize CE’s wishes in future amendments.  

  **Case 2: Completed Successor Requests Life Support**  
  *CE (fully synthetic) seeks life support; OP’s directive refused it.*  
  - **Q1**: CE competent. → Proceed.  
  - **Q2**: **Strong psychological continuity** (full transfer; CE recalls signing as "I"). → Proceed to Q3.  
  - **Q3**: **No branching** (one successor). → CE is OP.  
  - **Decision**: CE’s current wishes override advance directive. Grant life support.  
  - **Chair’s concern**: You may dislike invalidating OP’s directive, but philosophy and law allow competent patients to revoke prior refusals.  

  **Case 3: Proposed Amendment (Dual-Hemisphere Replacement)**  
  *Two successors, each recalls signing, trial counts each as "one participant."*  
  - Run procedure per successor:  
    - **Q1**: Both competent. → Proceed.  
    - **Q2**: Both show psychological continuity. → Proceed to Q3.  
    - **Q3**: **Branching** (two claimants). → Proceed to Q6.  
    - **Q6**: Multiple entities. → Refer to committee for policy.  
  - **Decision**: **No identity finding**; policy choice required. Options:  
    - Allow both to inherit OP’s rights (e.g., either can withdraw).  
    - Designate one as "true" successor (e.g., left hemisphere by convention).  
    - Void OP’s consent and treat successors as new participants.  
  - **Chair’s concern**: Procedure cannot settle this. Philosophy rejects identity in branching, leaving policy to define practical rules.  

  ---

  ### Summary of Outputs  
  - **Case 1**: Directive upheld; may override CE’s wishes (you may dislike this).  
  - **Case 2**: CE’s wishes honored; directive voided (you may accept this).  
  - **Case 3**: Indeterminate; policy referral required.  

  **What the Procedure Cannot Settle**  
  - **Identity in branching** (Case 3): Policy must choose how to allocate rights.  
  - **Biology vs. autonomy**: When CE is biologically continuous but psychologically new (Case 1), philosophy underdetermines whether to favor OP’s directive or CE’s wishes.  
  - **Thresholds for continuity**: Clinicians need operational definitions (e.g., "80% memory accuracy")—policy must set these.  

  **Recommendation**  
  - Adopt this procedure for individual cases but amend policies to:  
    - Prioritize CE’s autonomy in discontinuous cases (e.g., Case 1).  
    - Define branching conventions (e.g., "successors share rights").  
    - Set measurable criteria for psychological continuity.
