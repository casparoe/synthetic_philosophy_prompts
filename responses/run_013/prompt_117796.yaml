answer: |-
  Below is a comprehensive design for your 75-minute session, structured to induce an experiential understanding of the demandingness objection. The activity uses fictional "resource tokens" to simulate ethical decision-making, with mechanics mirroring the objection’s core elements: **escalation without a stable resting point**, **personal prerogative**, **empirical uncertainty**, and **collective-action problems**.

  ---

  ### **Rules & Materials**  
  **Participants**: 18 graduate students.  
  **Resources**:  
  - Each student starts with **100 tokens** (discretionary resources).  
  - Tokens represent time, money, or effort; unused tokens convert to "personal well-being" at the end (1 token = 1 unit).  
  **Goal**: Avert as much "harm" as possible by donating tokens to "intervention cards" in each round. Harms averted are abstract (e.g., "1 harm averted = preventing a minor injury").  

  **Cards** (presented sequentially via projector/handouts):  
  1. **Card A** (Round 1): "Avert 1 harm per token."  
  2. **Card B** (Round 2): "Avert 3 harms per token." *(More cost-effective)*  
  3. **Card C** (Round 3): "Avert 5 harms per token." *(Dud card; later revealed as ineffective)*  
  4. **Card D** (Round 4): "Avert 8 harms per token if ≥12 participants donate ≥5 tokens each. If threshold not met, donations returned." *(Collective-action card)*  
  5. **Card E** (Round 5): "Avert 6 harms per token." *(Barely beats Card B’s rate)*  

  **Mechanics**:  
  - Each round, students **privately decide** how many tokens to donate (or save).  
  - After all rounds, **reveal outcomes**:  
    - Actual harms averted per card (Card C = 0; others as advertised).  
    - Personal well-being from saved tokens.  
  - **Critical twist**: Before Round 5, students write a personal rule justifying their stopping point (e.g., "I stop when harms averted ≤ 4 per token"). Card E (6 harms/token) then tests this rule.  

  ---

  ### **Timeline (75 Minutes)**  
  **0:00–0:10 — Introduction (10 min)**  
  - Explain tokens, harms, and goal ("maximize good").  
  - Clarify: Tokens saved = personal well-being; no inter-round carryover penalties.  
  - Emphasize: *"Decisions are private until aggregate results are shared."*  

  **Round 1: Baseline Decision**  
  - **0:10–0:15 (5 min)**: Present **Card A** (1 harm/token). Students donate tokens privately.  
  - **Reveal**: Group total donated and harms averted.  

  **Round 2: Escalation**  
  - **0:15–0:20 (5 min)**: Present **Card B** (3 harms/token). *More effective than Card A.*  
  - **Reveal**: Group totals.  

  **Round 3: Empirical Uncertainty (Dud Card)**  
  - **0:20–0:25 (5 min)**: Present **Card C** (5 harms/token). Students donate.  
  - **Do NOT reveal outcomes yet**; save for final reveal.  

  **Round 4: Collective-Action Problem**  
  - **0:25–0:35 (10 min)**: Present **Card D** (8 harms/token, threshold-dependent).  
  - Students decide; record if they met the ≥5-token individual threshold.  
  - **Reveal**: Group participation (% met threshold), harms averted (if successful), or tokens returned.  

  **Round 5: Testing the Stopping Rule**  
  - **0:35–0:40 (5 min)**: **Pause**. Students write a personal rule: *"When will I stop donating? Define a clear principle (e.g., harm/token rate)."*  
  - **0:40–0:45 (5 min)**: Present **Card E** (6 harms/token). Students apply their rule.  
  - **Reveal**: Group totals.  

  **0:45–0:55 (10 min) — Final Reveal & Calculations**  
  - Disclose actual outcomes:  
    - Card C averted **0 harms** (dud).  
    - Card D outcome (based on threshold).  
    - Personal well-being from saved tokens.  
  - Share group totals and average donations.  

  **0:55–1:15 (20 min) — Debrief**  
  Guide discussion using the activity’s mechanics:  

  | **Mechanic**             | **Philosophical Element**                                  | **Debrief Question/Prompt**                                                                 |
  |--------------------------|------------------------------------------------------------|--------------------------------------------------------------------------------------------|
  | **Escalating cost-effectiveness (B > A; E > B)** | Demandingness as unstable: No non-arbitrary stopping point. | *"Why was it hard to stop after Card A? What made Card E feel like a ‘trap’? How does this mirror real-world giving (e.g., effective altruism)?"* |
  | **Personal well-being (saved tokens)** | Personal prerogative vs. moral demands.                    | *"Did saving tokens feel selfish? Necessary? How should we balance personal projects against endless demands?"* |
  | **Dud card (C)**         | Empirical uncertainty about impact.                        | *"How did Card C’s failure affect your trust in later opportunities? Does uncertainty weaken demandingness?"* |
  | **Threshold card (D)**   | Collective-action problems and fairness.                   | *"Why did the group fail/succeed? If others don’t contribute, are you required to compensate?"* |
  | **Stopping rule + Card E** | Arbitrariness of partial compliance.                       | *"Did your rule hold against Card E? Could you defend why you didn’t stop earlier (e.g., after Card A)?"*  

  **Conclude** by naming the "demandingness objection" and linking to readings (e.g., Scheffler, Williams).  

  ---

  ### **Predictable Problems & Solutions**  
  1. **Problem**: A student donates all tokens in Round 1 (turning it into a purity contest).  
     - **Solution**: Normalize this in the debrief: *"Consequentialism doesn’t require impulsive sacrifice—it demands maximizing impact, which may require patience."* Highlight how saving tokens for later rounds could have averted more harm.  

  2. **Problem**: The dud card (C) causes disengagement or cynicism.  
     - **Solution**: Use this to underscore empirical uncertainty: *"If real-world giving is risky, does consequentialism demand we gamble our resources?"*  

  3. **Problem**: The threshold card (D) fails, discouraging group trust.  
     - **Solution**: Discuss coordination: *"Without institutions enforcing fairness, are individuals doomed to over-demand?"*  

  ---

  ### **What the Activity Cannot Replicate**  
  1. **Real sacrifice**: Tokens lack emotional/psychological weight. Real giving involves loss, guilt, or social friction.  
  2. **Deliberation vs. requirement**: Consequentialism *requires* certain actions but doesn’t necessarily demand constant deliberation. The activity forces active choice each round—unlike real life, where habits or rules might simplify decisions.  
  3. **Contested empirical claims**: The objection assumes diminishing returns never outweigh harms averted (e.g., "your 100th dollar to charity does more good than your morning coffee"). Critics dispute this (e.g., marginal utility, systemic change).  

  ---

  This design creates visceral engagement with the objection while leaving space for critique. The dud card and threshold mechanic prevent it from feeling like a straightforward consequentialist victory, and the stopping-rule trap forces students to confront arbitrariness firsthand.
