answer: |-
  ## Prospectus: Normative Dualism in Assertion - Permissibility vs. Defectiveness in Speech and Inquiry

  **Working Title:** Beyond the Impasse: Splitting the Norms of Assertion for Permissibility and Defectiveness

  **Author:** [Your Name]
  **Department:** Philosophy
  **Proposed Degree:** Doctor of Philosophy
  **Advisor:** [Advisor's Name]
  **Target Length:** 2200 words

  ### 1. Core Question & Central Argument
  The central debate concerning the constitutive norm(s) governing assertion—whether it is knowledge (KN: assert only what you know), truth (TN: assert only what is true), belief (BN: assert only what you believe), or justification (JN: assert only what you are justified in believing)—is plagued by persistent inconclusiveness. This project contends that this impasse arises because proponents of different norms are inadvertently answering *distinct questions* using the *same limited set of cases* (lottery propositions, Moorean absurdities, selfless assertions). Specifically, the debate conflates:

  1.  **The Permissibility Question (PQ):** What conditions must be satisfied *for it to be epistemically permissible (or appropriate) for S to make assertion A at time T1?*
  2.  **The Defectiveness Question (DQ):** What conditions render assertion A *defective or epistemically criticizable once it has been made, at time T2 (often after new information emerges)?*

  My core hypothesis is that **different norms best explain permissibility and defectiveness.** For instance, KN might govern PQ (you shouldn't assert unless you know), while TN governs DQ (an assertion is defective if false, even if reasonably made). This "normative dualism" (ND) explains why KN advocates can handle lottery cases well (impermissible to assert lottery loss) but struggle with selfless assertions (impermissible yet not criticizable?), while TN advocates handle falsity-based criticism effortlessly but struggle to explain the impermissibility of asserting unknown truths. The existing cases are insufficiently discriminatory because they can often be accommodated by *ad hoc* adjustments to single-norm accounts. To test ND rigorously, I introduce a novel class of assertions: **Inquiry-Driving Assertions (IDAs)** – utterances like "The failure is probably in the caching layer" (debugging), "The motive was the inheritance" (legal theory), or "Assume for contradiction that the sequence converges" (math). IDAs function primarily to advance collective investigation rather than to convey settled knowledge or belief. They put unique pressure on the act/content distinction and existing norms, potentially revealing the distinct roles of PQ and DQ.

  ### 2. Why the Question is Open & Current Positions are Stalled
  The debate is genuinely stuck, not merely underdeveloped, for several reasons acknowledged across the literature:

  *   **Case Exhaustion & Accommodation:** The standard cases have been wrung dry. Each camp has developed sophisticated, often convoluted, explanations for how *their* favored norm handles the apparent counterexamples posed by the other camps' favored cases. KN theorists offer complex accounts of selfless assertion; TN theorists offer pragmatic accounts of lottery prohibitions; JN theorists adjust their justification threshold. This results in stalemate, not refutation. *There is no consensus that any single norm has decisively failed, nor that any has triumphed.*
  *   **Conflation of Normative Dimensions:** While philosophers implicitly appeal to different temporal perspectives (making vs. evaluating), there is no widespread agreement that PQ and DQ represent *fundamentally distinct normative targets* requiring potentially distinct norms. Many assume the norm governing permissibility *must also* be the standard for defectiveness (or vice versa). This conflation is rarely explicitly defended; it's a background assumption hindering progress. Work by Scanlon on promises hints at a similar permissibility/blameworthiness distinction, but its application to assertion and epistemic norms is underexplored and contested.
  *   **Neglect of Assertion's Varied Functions:** The debate heavily focuses on assertions aiming to inform or express belief/knowledge. IDAs highlight a different, crucial function: *facilitating inquiry itself*. How norms apply to assertions whose primary aim isn't truth-transfer but truth-discovery is poorly understood and rarely addressed systematically. This neglects a significant portion of actual assertive practice, particularly in collaborative epistemic endeavors.
  *   **Ambiguity in "Defective":** What constitutes "defectiveness" is itself contested. Does it mean *warranted criticism of the asserter*, *warranted rejection of the content by the audience*, or something else? ND requires clarifying this, potentially revealing that different norms govern different types of defectiveness.

  ### 3. Methodology & Work Plan (6-Month Core Project)
  This project employs conceptual analysis grounded in carefully controlled cases, testing the explanatory power of ND against single-norm accounts.

  *   **Month 1: Conceptual Groundwork & Distinction Defense:**
      *   Precisely define PQ (focus: conditions for *making* A) and DQ (focus: conditions for A *being* defective/criticizable *post hoc*).
      *   Argue rigorously that PQ and DQ are conceptually distinct questions, drawing analogies to other normative domains (e.g., promising: permissibility vs. blameworthiness for breaking).
      *   Identify potential objections to the distinction itself (e.g., "defectiveness just *is* retrospective impermissibility") and formulate responses.
  *   **Month 2: Mapping the Existing Battlefield:**
      *   Systematically catalogue how the major norms (KN, TN, BN, JN) handle the standard cases (Lottery, Moorean, Selfless) concerning *both* PQ and DQ.
      *   Demonstrate the *ad hoc* accommodations each requires to handle cases favoring rival norms, highlighting the explanatory cost and the resulting stalemate.
      *   **Core Data Selection Principle I:** Standard cases are included as the established testing ground where ND must show it offers a *superior* explanation by cleanly splitting PQ/DQ burdens.
  *   **Month 3: Developing & Analyzing Inquiry-Driving Assertions (IDAs):**
      *   Define IDAs: Assertions where the primary constitutive aim is not (solely) to inform the audience of a believed/know proposition, but to propose a hypothesis, focus inquiry, test a reaction, or set a temporary premise *within an ongoing collaborative investigation*.
      *   Construct and refine nuanced cases (like the caching layer, legal theory, mathematical assumption examples). Develop variations: sincere vs. tentative IDAs, successful vs. failed IDAs, IDAs made with high/low justification, IDAs later proven true/false.
      *   Analyze these cases through the lenses of PQ and DQ separately.
      *   **Core Data Selection Principle II:** IDAs are included specifically because they plausibly fall outside the comfortable explanatory range of *any* single existing norm applied monolithically, and they intuitively challenge the conflation of PQ/DQ (e.g., an IDA might be permissible *without* knowledge/truth/belief, yet its falsity might still render it defective *post hoc* in the inquiry's context).
  *   **Month 4: Testing Normative Dualism (ND):**
      *   Formulate specific ND hypotheses (e.g., KN-PQ + TN-DQ; JN-PQ + TN-DQ; KN-PQ + "Inquiry Progress" Norm-DQ).
      *   Test these ND hypotheses against:
          *   The explanatory gaps and *ad hoc* fixes identified in the standard cases (Month 2).
          *   The patterns of permissibility and defectiveness observed in the IDA cases (Month 3).
      *   Assess whether ND provides a more parsimonious, intuitive, and comprehensive explanation of the *totality* of the data than any single-norm account.
  *   **Month 5: Addressing Challenges & Refining ND:**
      *   Confront major objections: Is the distinction PQ/DQ robust? Does ND lead to bizarre normative conflicts? Can IDAs be fully assimilated by sophisticated single-norm views? Does ND overcomplicate the normativity of assertion?
      *   Refine the specific ND formulation based on the analysis. Consider whether the defectiveness norm might be context-sensitive (e.g., tied to the inquiry's goal).
      *   Explore implications for the act/content distinction: Do IDAs suggest that the *illocutionary point* (driving inquiry) can partially determine the applicable norms, independent of propositional content?
  *   **Month 6: Synthesis, Significance, and Future Directions:**
      *   Synthesize findings: Does the evidence support ND? Which specific dualism is most plausible?
      *   Articulate the significance: Resolving the impasse, offering a richer account of assertion's diverse functions, clarifying the nature of epistemic criticism.
      *   Outline clear directions for future research (e.g., applying ND to other speech acts, exploring group epistemic norms in inquiry).

  ### 4. Expected Outcomes & What Success/Failure Look Like
  *   **Successful Result:** Strong evidence supporting ND. A specific, well-defended pairing of norms for PQ and DQ (e.g., KN for PQ, TN for DQ) emerges as significantly better at explaining the patterns of intuitive judgments across *both* standard cases and IDAs than any single-norm account, without excessive *ad hoc* adjustments. IDAs are shown to be a crucial, previously neglected data point decisively favoring the PQ/DQ split.
  *   **Partial Success/Interesting Result:** Clear demonstration that PQ and DQ *are* distinct normative questions, even if the *best* norms governing each remain contested. IDAs are firmly established as a significant challenge requiring any adequate theory of assertion to account for inquiry-driving functions. This reframes the debate significantly.
  *   **Failure Conditions:**
      1.  **Distinction Collapse:** If rigorous analysis shows PQ and DQ cannot be meaningfully separated (e.g., defectiveness reduces *entirely* to retrospective impermissibility under a single norm), the core hypothesis fails.
      2.  **Single Norm Triumphs:** If a single norm (e.g., a sufficiently sophisticated KN or JN) *can* explain all data points (standard cases + IDAs) concerning both permissibility and defectiveness equally well or better than any ND proposal, without excessive contrivance, then ND loses its necessity.
      3.  **IDA Assimilation:** If IDAs can be convincingly analyzed as not genuine assertions, or as fully governed by existing norms (e.g., as mere suppositions governed by different rules, or as assertions where a lower justification threshold suffices for permissibility), their unique discriminatory power is lost.
      4.  **Inconclusive:** If the analysis yields no clear advantage for ND over single norms, or if intuitions about the cases remain too murky or divided to provide clear guidance.

  ### 5. Realistic Scope Assessment: Paper vs. Dissertation
  *   **Dissertation Scope:** This project, as outlined, forms a **strong, viable core for a dissertation**. It tackles a central, unresolved debate in philosophy of language/epistemology with a novel hypothesis (ND) and a novel class of cases (IDAs). Successfully defending ND would be a significant contribution. The 6-month plan covers essential groundwork, argument development, case analysis, and defense against objections. A dissertation would expand on this core by:
      *   Engaging even more deeply with rival single-norm theories.
      *   Exploring historical precursors or related distinctions (e.g., in ethics of belief).
      *   Investigating broader implications (e.g., for norms of action based on assertion, for group epistemology, for AI communication).
      *   Developing a more comprehensive positive ND theory.
  *   **Paper Scope:** If the core distinction (PQ/DQ) is validated and shown to resolve specific problems with standard cases *or* if IDAs alone provide a powerful new challenge to the existing norms, this could yield a **strong journal article**. A paper might focus on introducing IDAs and showing they break the stalemate by forcing the PQ/DQ distinction, or focus exclusively on defending the distinction using the standard cases.
  *   **If the Split Fails:** **The project retains significant value even if the specific PQ/DQ distinction collapses.** The development and analysis of **Inquiry-Driving Assertions (IDAs)** is a substantial contribution in itself. Demonstrating that a major class of assertive acts doesn't fit neatly into the existing normative frameworks governed by KN/TN/BN/JN forces a necessary expansion or revision of the theory of assertion. The project could pivot successfully to focus entirely on: 1) Characterizing IDAs as a distinct speech act or a distinct mode of assertion, 2) Articulating the specific norms governing them, and 3) Arguing for their importance in understanding collaborative inquiry and reasoning. This would still be dissertation-worthy, shifting focus to the nature and norms of inquiry-driving speech.

  ### 6. Conclusion
  The norms of assertion debate is ripe for a breakthrough. By diagnosing the conflation of permissibility and defectiveness as a root cause of the impasse and introducing the novel challenge of Inquiry-Driving Assertions, this project offers a clear path forward. It proposes a testable hypothesis (Normative Dualism) with the potential to resolve longstanding conflicts in the literature while offering a richer account of assertion's role in epistemic collaboration. Whether ND is fully vindicated or the focus shifts to the norms governing IDAs, this project addresses a genuine gap and promises significant philosophical insight.
