  ### Decision Tree for Epistemic Akrasia Positions  
  *Starting point: An agent recognizes that higher-order evidence (HOE—e.g., peer disagreement, cognitive impairment) bears on the rationality of her first-order belief. The tree sorts views on what follows.*

  ---

  #### **Branch 1 (Q1)**  
  *Can rationality require you to hold a first-order belief while simultaneously judging that holding it is irrational?*  
  - **No** (Levels must coincide) → Go to Branch 2.  
  - **Yes** (Akrasia can be rational) → Go to Branch 3.  

  ---

  #### **Branch 2 (Q2)**  
  *When HOE indicates your first-order belief is irrational, how is coherence achieved?*  
  - **Revise the first-order belief** → Go to Branch 4.  
  - **Reject the HOE's force** → **Leaf A: Steadfastness**  
    - *Label*: Steadfastness (e.g., Weatherson).  
    - *Commitment*: First-order reasons can immunize a belief against any HOE, even about self-assessment flaws.  
    - *Special cases*: Past-self disagreement ignored if current reasons are strong; self-undermining HOE dismissed.  

  ---

  #### **Branch 4 (Q4)**  
  *Must revision always mean "splitting the difference" with peers, regardless of first-order evidence?*  
  - **Yes** → **Leaf B: Strong Conciliationism**  
    - *Label*: Strong Conciliationism (e.g., Christensen).  
    - *Commitment*: Peer disagreement alone compels movement toward the middle, overriding first-order evidence.  
    - *Special cases*: Self-undermining HOE intensifies conciliation; past-self disagreement treated identically.  
  - **No** → **Leaf C: Weak Conciliationism**  
    - *Label*: Weak Conciliationism (e.g., Kelly).  
    - *Commitment*: HOE’s weight depends on context (e.g., domain reliability), so revision varies.  
    - *Special cases*: Self-undermining HOE may reduce its force; past-self disagreement weighted less than current peers.  

  ---

  #### **Branch 3 (Q3)**  
  *When HOE indicates irrationality, is akrasia always required?*  
  - **Yes** → **Leaf D: Strong Akrasia**  
    - *Label*: Strong Akrasia (e.g., Coates).  
    - *Commitment*: Rationality forces you into akratic states when HOE undermines self-trust.  
    - *Special cases*: Self-undermining HOE yields iterated akrasia ("I’m irrational to think I’m irrational"); past-self disagreement mandates akrasia.  
  - **No** → Go to Branch 5.  

  ---

  #### **Branch 5 (Q5)**  
  *Can rationality permit multiple responses to HOE (e.g., akrasia, revising first-order belief, or downgrading HOE)?*  
  - **Yes** → **Leaf E: Permissivism**  
    - *Label*: Permissivism (e.g., Schoenfield).  
    - *Commitment*: No unique rational response; akrasia is one option among others.  
    - *Special cases*: Self-undermining HOE expands permissible responses; past-self disagreement permits but does not require revision.  
  - **No** → **Leaf F: Total Evidence View**  
    - *Label*: Total Evidence View (e.g., Lasonen-Aarnio).  
    - *Commitment*: HOE is just more evidence, sometimes outweighed by first-order proof.  
    - *Special cases*: Self-undermining HOE added to the "evidential pot"; past-self disagreement is evidence weighed like any other.  

  ---

  #### **Unoccupied Cells & Limitations**  
  - **Empty cell** at Branch 5 → "No": Coherent but undesirable (requires akrasia but forbids avoiding it).  
  - **Ambiguous leaf**: Weak Conciliationism (Leaf C) vs. Total Evidence (Leaf F) — both allow first-order evidence to override HOE, but differ on whether HOE has "special" status.  
  - **Tree cannot separate**: Strong Akrasia (Leaf D) and Permissivism (Leaf E) if akrasia is sometimes required but not always.  

  ---

  ### Instrument Reliability & Redraw Triggers  
  - **Pivotal branch**: **Branch 1 (Q1)**. A "Yes" flips the entire tree toward akrasia-allowing views, moving furthest across the space.  
  - **Least distinct leaf**: **Leaf C (Weak Conciliationism)** vs. **Leaf F (Total Evidence View)**. Both permit first-order evidence to override HOE; distinction hinges on whether HOE is "just evidence" or contextually special.  
  - **Redraw if**:  
    - A position holds that akrasia is *conditionally required* (e.g., only with self-undermining HOE) — currently unplaceable.  
    - Weak Conciliationism and Total Evidence View collapse under cases where HOE’s "special force" is indistinguishable from evidence weight.  
    - Diachronic cases force new nodes (e.g., if past-self HOE demands unique treatment).  
  - **Most likely flaw**: **Branch 5 (Q5)** misassigns Permissivists who reject akrasia as an option (though rare). Expect this if students conflate "permissible" with "required."  

  ---  
  *One-page handout ends. Tree covers 6 leaves (A–F) and 5 branch nodes. Names indicate representative philosophers; descriptive labels used where attribution is contested.*
