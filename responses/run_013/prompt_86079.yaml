prompt: |-
  I've been reading the early Chinese philosophers since I retired from the lab, and I keep tripping over Mencius and Xunzi — the two who disagree about wether we're naturally good. The standard line is Mencius the kindly optimist, Xunzi the stern disciplinarian, and I don't trust it. So build me a thought experiment: one paragraph, set now, in which that pairing flips. I want a case where the Mencian line (the four sprouts are already there, and the job is only to nourish and extend them) licenses the callous thing to do, while the Xunzian line (our raw nature is just material, and decency is the work of ritual and training) is what produces the humane outcome. Keep it ordinary — a care home, a hospital ward, a school — no ancient China, no sage-kings, and don't caricature Xunzi as the man who thinks people are monsters; his claim is that nature is raw material, not that it's evil. Same single action under the microscope, and the two have to give genuinely opposite verdicts on it, without either being handed a stupid version of his own view. Then walk me through the reasoning on both sides, tell me which one feature of the case is doing the work, what happens when I strip that feature out (does it collapse back into the two agreeing?), and how the best defender of whichever one ends up looking bad would try to wriggle out of it. Don't bother with chapter numbers or citations — I haven't got the books and you can't look them up. It's for a discussion group I've inflicted myself on.
