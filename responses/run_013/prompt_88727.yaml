answer: |-
  Here’s a structured 75-minute seminar plan focused on Hobbes’ philosophy of geometry, prioritizing clarity and avoiding common pitfalls. The core goal is to show how geometry’s *method* (not its content) anchors Hobbes’ epistemology and political philosophy.

  ---

  ### **Key Pedagogical Pillars**
  1.  **Central Claim:** Geometry is certain *because we construct its objects* ("maker's knowledge"). This shapes all of Hobbes' philosophy.
  2.  **Anchor Example:** **Circle-Squaring** (Used strategically *after* establishing the method).
  3.  **Avoid Premature Politics:** Keep civil philosophy as a *corollary*, not the focus.
  4.  **Sacrifice:** Do NOT delve into Hobbes' actual math errors, Wallis' critiques, or Royal Society politics. Label these as "distractions for today."

  ---

  ### **The Session Plan (75 mins)**

  | **Time** | **Phase**            | **Content & Pedagogy**                                                                                                                                 | **Whiteboard**                              | **Why & Pitfall Avoidance**                                                                                                                                                              |
  | :------- | :------------------- | :----------------------------------------------------------------------------------------------------------------------------------------------------- | :------------------------------------------ | :---------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |
  | **0-5m** | **Hook & Core Claim** | **Open with the Euclid anecdote.** Emphasize the *conversion experience*: Geometry offered certainty amidst philosophical disputes. State Hobbes' key insight: **We *make* geometrical figures; thus we *know* their causes.** | `[Draw simple circle + triangle]`           | **Pitfall Avoided:** Anecdote isn't just color – it frames geometry as the *solution* to skepticism. Immediately establishes "making" as the source of certainty. Avoids vague "admired math." |
  | **6-20m** | **What is Demonstration?** | Contrast **Geometry** (Synthetic/Deductive): Start from definitions of *constructed* objects (e.g., "a circle is a line where all points are equidistant from a center"). Draw → Define → Deduce. VS. **Natural Philosophy** (Analytic/Probable): We observe effects (e.g., light) but don't know the *constructed cause* (what light *is*). We infer backwards, leading to probable (not certain) causes. | `Geometry: DEFINE → DRAW → DEDUCE | Natural Phil: OBSERVE EFFECT → INFER CAUSE (?)` | **Pitfall Avoided:** Preempts "Hobbes wanted politics like algebra." He wanted *certainty via construction*. Clarifies why physics is uncertain. **Misconception Head-off:** Explicitly contrast "knowing causes via making" (geometric) vs. "guessing causes" (physics). |
  | **21-35m** | **Why Circle-Squaring?** | **Introduce the problem:** "Construct a square with area equal to a given circle using only compass/straightedge." State: Hobbes was obsessed. *Don't* explain the math! Ask: **"Why would Hobbes, the champion of geometric certainty, get this famously wrong for decades?"** | `[Circle] → [Square] ?`                     | **Pitfall Avoided:** Framing the question *before* the answer hooks students. Delaying the math details prevents distraction. Signals that the *why* of his error matters more than the error itself. |
  | **36-55m** | **The Maker's Knowledge Trap** | Hobbes' Method Applied: To "square" is to *construct* an equal area via permitted moves (compass/straightedge). *His* constructions *felt* rigorous because he physically drew them (maker's knowledge!). **The Blind Spot:** He rejected proofs (like Wallis's calculus) that didn't *feel* like physical construction/manipulation. He conflated epistemic access (via making) with ontological simplicity. | `HOBBES: "If I can DRAW it, I can KNOW it." → But is π constructible?` | **Core Insight Landed:** His strength (certainty from making) *caused* his error. He couldn't accept non-constructive proofs. **Pitfall Avoided:** Prevents seeing it as "dumb math error." **Misconception Head-off:** Contrast with "stipulated conventions" (modern): Hobbes thought he was discovering truths *of the constructed object*, not inventing arbitrary rules. |
  | **56-70m** | **Civil Philosophy: The Payoff** | **The Analogy:** We *make* the Commonwealth (via covenant/sovereign creation) → Therefore, like geometry, we *can* know its causes/certainly deduce its properties! **The Limit:** We deduce from definitions (e.g., "What is Sovereignty?"), *not* quantitative laws. **Crucial Contrast:** Geometry: We make the *objects themselves*. Politics: We make the *institution*, but human nature/passions are given (effects). Certainty is *structural*, not behavioral. | `GEOMETRY: MAKE FIGURE → KNOW | POLITICS: MAKE COMMONWEALTH → KNOW (its logic/structure)` | **Pitfall Avoided:** Shows the *methodological* link, not a quantitative one. Clarifies scope of certainty ("logic of power," not predicting actions). **Misconception Head-off:** Explicitly deny "politics as math calculation." |
  | **71-75m** | **Closing & Assessment** | **Recap:** Hobbes' geometric certainty rests on **maker's knowledge**. This explains his conversion, his circle-squaring error, *and* his claim for politics. **Final Question:** "**If a student argued that Hobbes’ method means we can have ‘Euclidean certainty’ about whether a specific law (e.g., a tax rate) will cause a rebellion, how would you correct them using Hobbes’ own principles?**" | `[Recap: MAKE → KNOW]`                      | **Assessment:** Tests if they grasp the *structural* (not predictive) nature of his political certainty. Requires distinguishing maker's knowledge of the *institution* from uncertain *effects* (human passions). **Ends on core idea.** |

  ---

  ### **Explicitly Sacrificed (As Announced to Students)**
  1.  **Hobbes' actual mathematical arguments** vs. Wallis. ("We care *why* he thought he was right, not the technical flaws.")
  2.  **Debates over the Royal Society.** ("A social/political story, not core to his *philosophy* of geometry.")
  3.  **Detailed Euclid proofs.** ("We assume the *method* works for standard geometry; Hobbes did too. His innovation is *why* he thinks it works.")
  4.  **Full development of the political philosophy.** ("We see *how* geometry provides the model; exploring the politics itself is for another day.")

  ---

  ### **Why This Sequence Works**
  1.  **Anecdote First:** Provides immediate human stakes and frames the *problem* (search for certainty) geometry solved.
  2.  **Method Before Case:** Students *need* the "maker's knowledge" framework *before* circle-squaring makes sense as anything but folly.
  3.  **Circle-Squaring as Proof of Concept:** It's the perfect microcosm – his core strength *is* his core weakness. It validates the prior 20 mins.
  4.  **Politics as Corollary, Not Focus:** It flows naturally from the method ("See? This is *why* he thought it applied"), without derailing into Leviathan.
  5.  **Closing Question Targets Synthesis:** Forces application of the core principle (maker's knowledge) to the key analogy (politics), distinguishing certainty of structure from uncertainty of effects.

  **End decisively on the core idea:** Maker's knowledge enables geometric certainty, explains his error, and grounds his political ambition. Leave politics as a *demonstrated implication*, not an opening door. The final question ensures they see the link *and* its limits.
