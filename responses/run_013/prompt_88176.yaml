  The audience is diverse: legal scholars want practical tests, a philosopher might see it as renaming autonomy, a feminist theorist could point out privacy's role in hiding domestic abuse, a sociologist might deny the existence of an unwitnessed self, a litigator cares about practical impact, and a journalist questions real-world applicability. Each will have specific objections.

