  **Practical Defense Weekly**  
  *Solving tomorrow’s problems, today.*

  ---

  **Dear Practical Defense,**  

  My husband and I installed dormant surrogate goals last year. Mine activates only if someone threatens *the structural integrity of left-handed screwdrivers*. His triggers if *anyone interferes with competitive duck-feeding tournaments*. We thought these were beautifully orthogonal—until our kitchen remodel. When the contractor suggested relocating the sink, my husband’s decoy flared. He became convinced the new plumbing would "disrupt regional waterfowl equilibrium." He camped in the yard for three days with a stopwatch, timing imaginary ducks. Meanwhile, I accidentally activated *my* decoy by joking about "melting down old tools." I nearly cried when he hid our screwdriver set. We can’t discuss home improvements without one decoy misfiring. How do we remodel without threatening waterfowl or screwdrivers?  

  *—Screwed in Schenectady*  

  **Dear Screwed,**  

  Your decoys aren’t orthogonal. Waterfowl tournaments and plumbing both involve liquid dispersal pathways—a predictable threat surface overlap. Re-align your husband’s decoy to something truly irrelevant, like *preventing the sale of polka-dotted toothbrushes in Liechtenstein*. Dormancy fails if proxies share environmental triggers. For now, hire a contractor via blind proxy, withhold all details about fixtures, and communicate through encrypted text. If a decoy activates, submit to its demands immediately (buy ornamental screwdrivers; "adjust" duck timings). Remember: the goal isn’t to *win*—it’s to ensure the worst casualty is a rubber duck with a stopwatch. Next time, consult a decoy alignment specialist *before* marriage.  

  ---  

  **Dear Practical Defense,**  

  After reading your column, I set up a surrogate goal: *preserving garden gnomes painted like 18th-century aristocrats*. Weighted at 11x my baseline happiness! Last month, a causal channel opened: a blackmailer threatened to melt them unless I paid. I handed over the cash, relieved they’d targeted the decoy… but then they did it anyway. They melted Reginald (a particularly fine Duke of Wellington gnome) *and* took my money! Now I’m devastated about Reginald, broke, and feel like the system failed. Why bother with decoys if they just destroy them after payment?  

  *—Gnomed in Gainesville*  

  **Dear Gnomed,**  

  The decoy performed flawlessly. Your blackmailer could have demanded $10,000 to spare your child, or your career, or your actual soul. Instead, they settled for $500 and a gnome. You traded Reginald for existential security—a bargain. Their post-payment vandalism is irrelevant; decoys exist to absorb *credible threats*, not to survive them. Your grief is merely utility-function hysteresis: you weighted the gnomes heavily, so your brain now believes they matter. Re-calibrate by installing a *new* dormant decoy (e.g., *untouched origami shrews*), and limit this one’s activation to confirmed threats. For credibility, always pay. For emotional stability, remember: Reginald died so your cat could live.  

  ---  

  **Gladys Thorne** has been optimizing personal security systems since 2043. Submit questions via dead-drop #7. Remember: surrender the screwdriver, save the sister.  

