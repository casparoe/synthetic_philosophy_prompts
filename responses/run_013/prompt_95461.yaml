  ### **Decision Tree: Diagnosing Disagreement**

  **Root:** Two people publicly state different credences for the same proposition, each knows the other has heard and understood, yet they still disagree.

  1. **Question 1: Could you be using the same words but describing different realities?**  
     (e.g., one person is discussing "economic growth" in terms of GDP, while the other includes sustainability metrics; or one is unaware of a subgroup the other is referencing)  
     - **Yes** → **Leaf 1: Semantic/Contextual Divergence**  
       *Most awkward commitment:* You must admit your disagreement is partly linguistic or contextual, and resolving it requires redefining terms or scopes—potentially undermining your original argument.  
       (*This settles the case of different vocabularies or unknown subgroups.*)  
     - **No** → Proceed to Question 2.

  2. **Question 2: Is either party incentivized to resist changing their view for non-truth-related reasons?**  
     (e.g., professional reputation, ideological alignment, or emotional comfort)  
     - **Yes** → **Leaf 2: Motivated Resistance**  
       *Most awkward commitment:* You must concede that social/psychological incentives are overriding truth-seeking, implying your discourse is not fully rational.  
     - **No** → Proceed to Question 3.

  3. **Question 3: Have you fully disclosed and debated all evidence and reasoning?**  
     (e.g., raw data, sources, models, or step-by-step logic—not just conclusions)  
     - **No** → **Question 3a: Is the lack of disclosure deliberate (e.g., strategic, proprietary, or personal reasons)?**  
       - **Yes** → **Leaf 3: Strategic Withholding**  
         *Most awkward commitment:* You must acknowledge the disagreement persists due to intentional secrecy, making the standoff a choice, not an epistemic failure.  
         (*This settles the case of privately resolvable disagreement with barriers to disclosure.*)  
       - **No** → **Leaf 4: Uncommunicated Evidence/Reasoning**  
         *Most awkward commitment:* You must accept that practical barriers (e.g., time, complexity, or articulation limits) are blocking resolution, and your "rational" disagreement is temporary.  
     - **Yes** → Proceed to Question 4.

  4. **Question 4: After sharing all reasoning, do you each suspect the other has a hidden flaw in their argument, but neither can pinpoint it?**  
     (e.g., a subtle mathematical error in a proof)  
     - **Yes** → **Leaf 5: Unlocatable Errors**  
       *Most awkward commitment:* You must tolerate persistent disagreement until a third party or new insight resolves it, admitting your rationality is inherently fallible.  
       (*This settles the case of mathematicians disagreeing on a conjecture.*)  
     - **No** → Proceed to Question 5.

  5. **Question 5: Do you both agree that, before acquiring private evidence, you would have shared the same prior credence?**  
     (e.g., from shared training, data, or cultural background)  
     - **No** → **Leaf 6: Foundational Priors Mismatch**  
       *Most awkward commitment:* You must trace the disagreement to irreconcilable starting assumptions, implying "rational" debate may not bridge the gap.  
     - **Yes** → Proceed to Question 6.

  6. **Question 6: Does one party have strictly more information than the other, yet their credences diverge?**  
     (e.g., one saw a confidential dataset the other did not, but their credences still disagree after public disclosure)  
     - **Yes** → **Leaf 7: Asymmetric Information Misapplication**  
       *Most awkward commitment:* You must conclude that the party with more information is misapplying Bayesian updating (e.g., over/underweighting evidence), not that the theorem is invalid.  
       (*This settles the case of shared prior with unequal information and disagreement—it signals misreading, not a counterexample.*)  
     - **No** → Proceed to Question 7.

  7. **Question 7: Are both parties confident they can fully process all shared evidence?**  
     (e.g., no computational limits, no unmanageable complexity)  
     - **No** → **Leaf 8: Bounded Rationality**  
       *Most awkward commitment:* You must admit the problem exceeds cognitive/computational resources, rendering "rational agreement" impossible without external tools.  
     - **Yes** → **Leaf 9: Inexplicable Disagreement**  
       *Most awkward commitment:* You must accept that, by the theorem's logic, one party is irrational (despite all checks), but you cannot determine who—undermining mutual respect.

  ---

  ### **Notes on the Tree**
  - **Number of leaves:** Nine positions cover the core breakdowns.  
  - **Unoccupied combinations:** Paths where parties (1) share a prior and have symmetric information (Q6: No) but also have unlocatable errors (Q4: Yes) are unexplored; these are rare (errors usually imply asymmetry) but not incoherent. Paths with motivated resistance (Q2: Yes) AND full disclosure (Q3: Yes) are unattractive, as incentives to deceive would likely prevent honest sharing.  
  - **Indistinguishable leaves:** The tree separates all leaves except *Leaf 7 (Asymmetric Information Misapplication)* and *Leaf 9 (Inexplicable Disagreement)* if asymmetric information exists but parties claim to process evidence perfectly (Q7: Yes). To split them, ask: *"After equalizing information, do credences converge?"* If no, it shifts to Leaf 9.  
  - **Role of specified cases:**  
    - Unequal information → Q6 (highlights misupdating, not theorem failure).  
    - Mathematicians → Q4 (unlocatable errors).  
    - Different vocabularies/subgroups → Q1 (semantic divergence).  
    - Strategic nondisclosure → Q3a (strategic withholding).  

  ---

  ### **Implications for Using the Theorem as a Conversation-Stopper**
  The tree demonstrates that Aumann's theorem **rarely legitimizes demanding agreement** in practice. Only *Leaf 9 (Inexplicable Disagreement)*—where all assumptions hold—permits invoking the theorem to insist convergence is obligatory. Even then, it requires exhausting all other explanations (e.g., semantic issues, motivated reasoning, or bounded rationality), which is almost never feasible in real discourse. In all other leaves, disagreement stems from mundane, non-culpable breaks in the theorem's idealizations (e.g., communication barriers, divergent priors, or human limitations). Using the theorem prematurely as a club ("You must agree or you're irrational!") ignores these diagnoses, stifles productive exploration, and often reflects intellectual arrogance. Instead, treat the theorem as a *diagnostic framework*—use this tree to collaboratively identify where the discussion fractured. This shifts focus from "winning" to understanding, fostering humility and better epistemic practices.
