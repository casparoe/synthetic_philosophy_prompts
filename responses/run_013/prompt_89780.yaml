  What's really eating the user, I suspect, is the terror that all human deliberation might be similarly mechanical. James would argue that consciousness evolved precisely to escape such fixed loops - our ability to form habits (like locking doors automatically) frees attention for novel problems. The tragedy isn't that we have routines, but that sometimes they malfunction into pathological grooves. 

