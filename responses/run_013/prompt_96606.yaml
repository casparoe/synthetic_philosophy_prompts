prompt: |-
  I do causal inference and ML for a living — hypothesis classes, inductive bias, regularization, identifiability, Markov equivalence classes — and I have zero philosophy training, but I keep bouncing off the underdetermination literature, the Duhem-Quine thing where you can supposedly keep any theory by adjusting something else in the web. Can you restate the core position as faithfully as you can in my vocabulary — theory as hypothesis class plus fitting procedure, evidence as data, auxiliaries as the rest of the model stack, empirical equivalence as two models with the same predictions, and so on — and then give me the residue report? My own hunch is that the nearest thing I have is Markov equivalence: two DAGs that are observationally indistinguishable until you intervene. Is that the same phenomenon or a cheap knockoff? It feels like a big difference that in my world you can just go intervene, whereas their rival theories are supposed to be indistinguishable in principle. And more generally: is the whole thesis just regularization with a fancy accent — we have to pick a model and nothing forces the pick — or is there something in the philosophers' claim that my framework literally cannot express? If its the latter, tell me whether that means my framework is missing something real or that their claim was vaguer than it sounded.
reasoning: |-
