answer: |-
  Here’s a structured 90-minute session designed to make participants organically derive Harsanyi’s utilitarian conclusion, hit the ex ante/ex post trap, and voice Rawlsian objections—all through gameplay. The activity uses **points** (convertible to chocolates) to incentivize decisions and runs with 12 people in three groups of four. No upfront theory; Harsanyi is revealed only in the debrief.

  ---

  ### **Session Structure & Rules**  
  **Total Time:** 90 mins  
  **Materials:**  
  - Dice/coins (for lotteries),  
  - Chocolates (or tokens) for payouts,  
  - Whiteboard to track choices/outcomes,  
  - Role cards (for Part 3).  

  ---

  ### **Part 1: The Veil of Ignorance Game (25 mins)**  
  *Goal: Reconstruct expected-utility aggregation without naming it.*  

  1. **Setup (5 mins)**:  
     - *Explain:* “You’re designing Arcadia, a society with **four roles**: Farmer, Artisan, Merchant, Scholar. Each role gets points under different policies. You’ll be randomly assigned a role after choosing policies. Points = lottery tickets for chocolates (e.g., 10 points = 10 tickets in a chocolate draw).”  
     - *Rules:*  
       - Groups (3 groups of 4) choose **Policy A or B** for Arcadia:  
         - **Policy A**: Farmer 8, Artisan 8, Merchant 8, Scholar 8.  
         - **Policy B**: Farmer 4, Artisan 6, Merchant 10, Scholar 16.  
       - *Incentive:* Since roles are equally likely, Policy A’s expected value (EV) = 8, Policy B’s EV = (4+6+10+16)/4 = 9. Rational players should pick B.  

  2. **Gameplay (10 mins)**:  
     - Groups deliberate. *Facilitator stays silent.*  
     - **Predictable moves**:  
       - Most groups pick B (higher EV). If a group picks A, ask: “Why avoid B?” (They might voice risk aversion—note this for later).  

  3. **Reveal & Payout (10 mins)**:  
     - Assign roles randomly (e.g., draw slips). Calculate points.  
     - Hold a **lottery**: One person per group wins chocolates proportional to their points (e.g., if someone has 16 points, they get 16 tickets in a group-level draw).  
     - *Key question:* “Which policy gave your group the best shot at chocolates?” (They’ll say B—teeing up “maximize average payoff”).  

  ---

  ### **Part 2: The Ex Ante/Ex Post Trap (25 mins)**  
  *Goal: Create tension between identical individual prospects and ex post fairness.*  

  1. **Setup (5 mins)**:  
     - *New policies:* “Arcadia now faces a disaster. Choose **Policy X or Y**:  
       - **Policy X (Correlated Risk)**: 50% all roles get 20 points, 50% all get 0 points.  
       - **Policy Y (Independent Risk)**: Each role independently gets 20 or 0 points (50/50).  
     - *Incentive:* Both have identical EV (10 points per person). Ex ante, they’re identical.  

  2. **Gameplay (10 mins)**:  
     - Groups choose X or Y. *Observe:* Some may pick X for “shared fate,” others Y for “diversification.”  
     - **Critical moment:** If a group says, “Y feels risky,” ask: “Risky for whom?” (They can’t identify a victim—all have same prospects).  

  3. **Reveal & Payout (10 mins)**:  
     - Run lotteries:  
       - *Policy X groups:* Flip one coin; all get 20 (heads) or 0 (tails).  
       - *Policy Y groups:* Each member flips a coin individually.  
     - Display group outcomes (e.g., “Group 1 (X): all 0. Group 2 (Y): 20, 0, 20, 0”).  
     - *Key question:* “Policy Y creates inequality. Does that make it worse than X?”  

  ---

  ### **Part 3: Rawlsian Rebellion (20 mins)**  
  *Goal: Let Rawlsian objection emerge organically.*  

  1. **Setup (5 mins)**:  
     - Assign **one Rawlsian per group** (hand role cards: “You care about the worst-off. Argue for safe policies!”).  
     - *New policies:*  
       - **Policy Safe**: All roles get 12 points.  
       - **Policy Gambler**: Scholar 24, Merchant 24, Farmer 0, Artisan 0.  
     - *Incentive:* Safe EV = 12, Gambler EV = 12. But Gambler has inequality.  

  2. **Gameplay (10 mins)**:  
     - Rawlsians argue against Gambler (“What if you’re a Farmer?”). Others may resist (“But EV is the same!”).  
     - Groups decide. *Note:* If a group picks Safe, celebrate the Rawlsian; if not, ask why they overruled.  

  3. **Reveal Roles (5 mins)**:  
     - Assign roles. *No payout yet*—save for final chocolate lottery.  

  ---

  ### **Debrief: Connecting to Harsanyi (20 mins)**  
  *Reveal the theorem ONLY now. Map gameplay to axioms:*  

  1. **Part 1 ➜ Utilitarian Aggregation**:  
     - “You ranked policies by average payoff. Harsanyi starts here: behind a veil of ignorance, you maximize *expected utility*. His theorem proves this implies social welfare = sum of utilities.”  
     - **Hidden assumption**: Equal weights (from equal role probability). *Ask:* “What if Farmers were 75% of Arcadia? Would you weight them more?” (Yes—weights = probabilities).  

  2. **Part 2 ➜ Ex Ante/Ex Post Tension**:  
     - “Ex ante, X and Y are identical: same EV per person. But ex post, Y feels unfair. Harsanyi’s utilitarianism ignores this—it only cares about expectations pre-lottery. Fairness enters when we *also* care about post-lottery outcomes.”  

  3. **Part 3 ➜ Rawlsian Challenge**:  
     - “The Rawlsian in your group rejected ‘maximize EV.’ They used maximin: protect the worst-off. Harsanyi assumes risk neutrality; Rawls assumes infinite risk aversion. Neither is ‘irrational’—it’s a value choice.”  

  4. **Limitations of the Activity**:  
     - “We simplified: utilities were given, comparable, and linear (points → chocolates). Real-world utilities are messy. Also, our ‘veil’ was thin—you knew possible outcomes. Rawls’ veil is thicker (no probabilities).”  

  ---

  ### **Predictable Problems & Solutions**  
  1. **“The veil is incoherent!”**  
     - *Response:* “Suspend disbelief. This models impartiality—you’re designing rules for strangers.”  

  2. **Refusal to play/gaming the system**:  
     - *Example:* A group picks Policy B (Part 1) to “punish Scholars.”  
     - *Solution:* “In Arcadia, you could *be* the Scholar. Would you still choose that?” Force veil-of-ignorance reasoning.  

  3. **Cracking the system in 4 mins**:  
     - *Preempt:* If a group derives “always maximize average,” say: “Great! But can you convince the Rawlsian in Part 3?” or “Does this work for Part 2?”  

  4. **Risk aversion skews decisions**:  
     - *Mitigation:* Linear point→chocolate conversion encourages risk neutrality. If someone avoids high-variance options, note in debrief: “Harsanyi assumes risk neutrality—our chocolate lottery approximates this.”  

  5. **Time management**:  
     - *Stick to:* Part 1 (25), Part 2 (25), Part 3 (20), Debrief (20). Cut group reports short if needed.  

  ---

  ### **Why This Works**  
  - **Harsanyi emerges from rules**: Players *experience* EU maximization before naming it.  
  - **The trap is visceral**: Policy Y’s inequality feels unfair, exposing the ex ante/ex post gap.  
  - **Rawlsian is embedded**: The role card forces the objection into gameplay.  
  - **Equal weights are contestable**: Debrief questions highlight probability→weight link.  
  - **No jargon until payoff**: “Utility” and “Harsanyi” enter only in debrief.  

  Run this, and your group will *feel* the theorem—then rip it apart with fairness intuitions. Good luck!
