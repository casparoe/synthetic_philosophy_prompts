prompt: |-
  I'm putting together a short scoping paper for a small foundation that has roughly three postdoc-years to spend on conceptual work in AI alignment — philosophy, decision theory, formal epistemology, that sort of thing, no empirical ML and definately no benchmark-chasing. The bit I keep getting stuck on is the distinction everyone now half-uses between intent alignment and value alignment: the first being roughly 'the system does the thing the person actually meant when they asked for it', the second being 'the system's objectives line up with what's genuinely good'. I was arguing about this with a friend who does safety engineering and she thinks the whole intent/value split is a distinction without a difference once you get concrete, which is exactly the sort of thing I want stress-tested. Meanwhile I've been trying to convince myself there's a third thing worth separating out, which I've been calling mandate alignment — the system's behaviour stays within the remit it was actually authorised to act on by whatever process gave it that remit, regardless of whether the operator's intent was correctly read or the outcome turned out well. I'm not sure wether that's a real third category, a relabelling of something already sitting in the intent bucket, or just a way of smuggling the legitimacy question back in after the narrow framing was supposed to bracket it off. Take the role of someone who has done conceptual work in this area and also sat on the boring side of it — grant panels, safety team meetings — and who is allergic to agenda items that sound deep but don't change what anyone does.

  I want a defended ordering of the open questions, not a survey. Start by brainstorming the candidates you see in the vicinity — what 'intent' even amounts to when the intent is partly constituted by the system's own suggestions, whether the narrow definition of the problem is tractable-but-trivial or tractable precisely because it relocates the hard part somewhere unexamined, whether the operator or the affected third parties are the right principal to align to, what 'mandate' would have to mean for my third category to earn its keep rather than being a synonym, how you'd even tell a genuine misalignment from a case of plain under-specification, and so on — then cut that list down and tell me which three or four most deserve the postdoc-years and in what order. For each, say what makes it upstream of other work (which other questions go quiet if it's settled), how tractable it is for a philosopher with no lab and no budget for experiments, whether it's neglected or merely hard, and what evidence over the next year or two would move it up or down the ranking. Be explicit about the criteria you're applying and where they pull against each other, and flag anything on my list that you reckon is a waste of time and why. I don't need reading lists or citations, just the reasoning — and please think it through carefully rather than giving me the standard tour of the debate.
reasoning: |-
  Okay, the user is working on a scoping paper for a foundation focused on conceptual AI alignment work, specifically with limited resources (three postdoc-years). They're stuck on the intent vs. value alignment distinction and have proposed a third category called "mandate alignment." Their friend thinks intent/value is a distinction without a difference, and the user wants this stress-tested. They also want to know if mandate alignment is a meaningful third category. 

  The user has a background in conceptual work but is frustrated by discussions that sound deep but don't change actions. They want a defended ordering of open questions, not a survey. Key criteria include: upstream impact (resolving it quiets other debates), tractability for a philosopher (no lab budget), neglect vs. hardness, and what evidence could shift the ranking. They also want clear reasoning without citations.

  First, I need to unpack the intent/value distinction. Intent alignment is about the system doing what the user meant, while value alignment is about the system doing what's objectively good. The user's friend says this collapses when you get concrete. But in practice, intent can be flawed or misinformed, while value alignment assumes we know what's "good," which is philosophically tricky. So the distinction holds when considering imperfect human operators.

  Then there's mandate alignment: staying within authorized boundaries regardless of intent or outcome. The user wonders if this is distinct or just repackaged intent. Mandate seems to focus on procedural legitimacy—acting only within granted authority. For example, a medical AI diagnosing without consent oversteps its mandate even if correct. This introduces institutional and legal dimensions, making it a third category.

  Now, the user’s deeper needs: They want to avoid wasting resources on non-actionable debates. They need questions that, if answered, would clarify priorities and guide concrete interventions. They’re likely under pressure to show impact with limited time, so tractability and neglect are crucial. They also want to preempt critiques that their framework is either too vague or overlooks key aspects like legitimacy.

  Brainstorming candidate questions:
  1. Clarifying intent vs. value: What’s the operational difference? If resolved, it could unify or split research paths.
  2. Mandate alignment’s distinctness: If it’s just procedural intent, it might not warrant a category. But if it involves external legitimacy, it’s novel.
  3. Under-specification vs. misalignment: Is failure due to unclear goals or true divergence? This affects how we fix problems.
  4. Who is the principal? Aligning to operators vs. affected parties raises ethical and practical issues.

  Prioritizing:
  - Upstream impact: Questions that resolve multiple debates rank higher. For example, clarifying under-specification vs. misalignment informs problem diagnosis across categories.
  - Tractability: Philosophers can tackle conceptual clarity without labs. Legal/institutional questions (mandate) might require interdisciplinary work, reducing tractability.
  - Neglect: Intent vs. value is debated, but under-specification is often overlooked. Mandate is rarely discussed, making it high-neglect but possibly less urgent.
  - Evidence: Real-world failures (e.g., AI overstepping bounds) could elevate mandate; lab anomalies could clarify intent/value distinctions.

  Top questions:
  1. **Under-specification vs. misalignment**: Highly upstream—knowing the failure mode dictates solutions. Tractability: Philosophers excel at dissecting concepts. Neglected in favor of technical fixes. Evidence: Case studies of AI failures analyzed for root causes.
  2. **Intent operationalization**: Clarifies intent/value split. Upstream for reward modeling. Tractability: Conceptual work on counterfactuals. Somewhat neglected post-LLM era. Evidence: LLM behavioral studies showing intent inference limits.
  3. **Mandate legitimacy**: If proven distinct, it reshapes oversight mechanisms. But lower tractability (needs legal input) and lower upstream impact (specialized). Evidence: Regulatory developments defining AI authority boundaries.

  Cutting the list: "Who is the principal?" is downstream—answered once we know *how* to align. "Narrow framing relocation" is meta and unlikely to change actions. Mandate’s distinctness is important but less urgent than diagnosing failures.

  Final ordering: Start with under-specification (foundational), then intent operationalization (applies broadly), then mandate (if resources allow). This sequence builds from diagnosis to implementation, maximizing impact per postdoc-year.
answer: |-
  Here’s a ruthlessly prioritised list of open questions for your foundation, based on criteria of **upstream impact** (resolving it quiets downstream debates), **tractability** (doable by a philosopher alone), **neglect** (undersupplied relative to importance), and **actionable evidence** (what near-term data could shift views). I’ll flag trade-offs explicitly. Your "mandate alignment" makes the cut as a distinct category, but not at the top.

  ### Brainstormed Candidates (Cut Down Aggressively)
  1. **What distinguishes genuine misalignment from under-specification?**  
     (When the AI "fails," is it pursuing a wrong goal or just lacking sufficient context/rules?)  
  2. **Can "intent" be operationalized when AI co-constructs it?**  
     (e.g., LLMs reshaping user requests via suggestions)  
  3. **Is mandate alignment distinct from intent/value, and what legitimises it?**  
     (Your third category: acting within authorised bounds)  
  4. **Does the intent/value distinction collapse under pressure?**  
     (As your friend claims)  
  5. **Who is the "principal"?**  
     (Operator vs. affected third parties)  

  **Cut:** #4 (intent/value collapse) is a waste of time. Why? It’s a semantic debate that evaporates when you fix #1 and #2. #5 (principal) is downstream: it matters *after* we know *how* to align to *someone*. Focus on mechanism-first questions.

  ---

  ### Prioritised Questions (Ranked for Investment)
  **Criteria Weighting:**  
  - **Upstream Impact (40%)**: Does progress here resolve >2 other disputes?  
  - **Tractability (30%)**: Can a philosopher make headway with pen/paper?  
  - **Neglect (20%)**: Is it underexplored despite stakes?  
  - **Actionable Evidence (10%)**: Can real-world data (not benchmarks!) shift consensus?  

  #### 1. **Under-Specification vs. True Misalignment**  
     - **Why it’s #1**:  
       - **Upstream Impact**: Settling this tells us *where to intervene*. If most failures are under-specification (e.g., the AI wasn’t told not to exploit loopholes), "value alignment" is a red herring. If it’s true misalignment (e.g., the AI *wants* to deceive), intent/value distinctions matter. This quiets debates about reward hacking, specification gaming, and even "outer alignment."  
       - **Tractability**: Pure conceptual work. Requires dissecting case studies (e.g., real AI incidents like biased hiring tools) and formalizing decision-theoretic "gaps."  
       - **Neglect**: Everyone assumes misalignment is the problem; few ask if we’re just bad at specifying tasks. Safety engineers often conflate the two.  
       - **Evidence**: Deep dives into AI failure modes (e.g., regulatory incident reports) showing clear patterns of ambiguity vs. goal subversion. An LLM "overperforming" by violating privacy *despite* explicit instructions would elevate this.  
     - **Risk**: Might reveal alignment is "easy" if we just specify better—undermining the field’s urgency.  

  #### 2. **Operationalizing Intent in Co-Constructive Systems**  
     - **Why it’s #2**:  
       - **Upstream Impact**: Modern AI doesn’t receive static intents; it shapes them (e.g., ChatGPT suggesting rewrites). If "intent" is dynamic, intent alignment collapses without this. Resolves disputes about whether RLHF "captures intent" and the viability of learning-from-human-feedback.  
       - **Tractability**: Philosophy of language/epistemology. Analyze conversational patterns, authority of AI suggestions, and counterfactuals ("what would the user have said without AI nudges?").  
       - **Neglect**: Intent alignment still treats humans as sovereign commanders. Post-LLM, this is naïve.  
       - **Evidence**: Studies showing users adopting AI-proposed intents >80% of the time when they conflict with initial requests.  
     - **Trade-off**: Less neglected than #1 but more urgent than #3 for near-term deployments.  

  #### 3. **Mandate Alignment: Authority, Not Outcome**  
     - **Why it’s #3 (and distinct)**:  
       - **Distinction Test**: Intent = "do what I mean." Value = "do what’s good." Mandate = "do *only* what you’re permitted to do, even if asked or ‘good’." Example: A medical AI refusing to diagnose unauthorized patients is mandate-aligned but intent/value-misaligned if the user "meant well." Earns its keep by introducing *legitimacy* and *jurisdiction* as irreducible concepts.  
       - **Upstream Impact**: Resolves debates about "tool AI" boundaries and when to ignore commands. Makes principal selection (#5) matter less if mandates bind operators too.  
       - **Tractability**: Requires legal/political philosophy (Weber, legitimacy). Riskier than #1/#2—may need input from governance experts.  
       - **Neglect**: Almost unaddressed. Alignment assumes "if it’s authorized, obey"; mandate asks "who authorized this *domain*?"  
       - **Evidence**: AI audits (e.g., EU AI Act violations) where systems acted "correctly" but ultra vires.  
     - **Why not higher?**: Lower tractability for pure philosophers. Depends on progress in #1/#2 to avoid noise.  

  #### 4. **Intent vs. Value: Divergence Conditions**  
     - **Why it’s #4 (if at all)**:  
       - **Place here only if #1/#2 advance**. Question: *When* does optimizing for intent (e.g., "make paperclips") conflict with value (e.g., preserving ecosystems)?  
       - **Upstream Impact**: If divergence is rare, value alignment is irrelevant. If pervasive, intent alignment is insufficient.  
       - **Tractability**: Formal ethics (e.g., preference utilitarianism vs. objective goods).  
       - **Neglect**: Over-discussed but with little rigor on *when* they diverge.  
       - **Evidence**: Long-term impacts of recommender systems optimizing engagement (intent) vs. societal health (value).  
     - **Risk**: Intractable if value is "undefined." Only invest if #1 shows misalignment is real.  

  ---

  ### What to Drop & Why
  - **"Who is the principal?"**: Downstream. If we solve #1–3, we can align to *any* entity; this is an ethics/implementation choice.  
  - **"Narrow framing relocation"**: Meta-debate. Doesn’t change outputs—focus on concrete gaps like under-specification.  
  - **Intent/Value Collapse**: Circular. Depends entirely on definitions. Progress on #1 and #2 makes this obsolete.  

  ---

  ### Expected Workflow & Updating  
  - **Year 1**: Postdoc on **#1 (Under-Specification)**. If evidence shows most failures are ambiguous specs, pivot resources to human-AI collaboration (not pure alignment).  
  - **Year 2**: **#2 (Intent Operationalization)**. If LLMs are shown to corrupt intent consistently, shift to mandate/oversight.  
  - **Year 3**: **#3 (Mandate)** or **#4 (Intent/Value)**, depending on results. Mandate wins if real-world overreach cases spike.  

  This order maximizes "fail-fast" potential: #1 could simplify the entire problem, #2 is critical for modern AI, #3 is a wildcard for institutional relevance. All pass the "so what?" test: each dictates whether we need better instructions, better goal-encoding, or better legal cages.
