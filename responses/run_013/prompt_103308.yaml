prompt: |-
  I am a TA for a second-year undergraduate seminar in practical ethics, and next week I have to run a seventy-five-minute section on the relation between meritocracy and desert — in particular on why "the best candidate got the position" and "the best candidate deserves what comes with the position" are not the same claim, even though my students will treat them as interchangeable. I do not want an essay on the subject; I want you to plan the explanation I am going to give. Set out the order in which the ideas must be introduced and why each depends on the one before it, starting from whatever has to be in place before the word "desert" can do any work at all. I have been sketching a scaffold and want you to tell me whether the sequence is right or whether I have the dependencies backwards: first, that a desert claim has three separable parts — a basis (what the person is being credited or blamed for: effort, talent, contribution), an object (the particular thing said to be deserved: a place, a payment, an esteem, a punishment), and a currency in which it is paid — and that these can come apart; second, that meritocracy answers a question about allocation (who gets the position), whereas desert answers a question about fittingness (what treatment fits the person), and that the two answers can diverge; and third, that institutions can make desert claims more or less apt rather than merely registering a desert that was already a fact before them. If any of the three belongs earlier or later, say so and say why.

  For the single example that carries the whole section, I had thought of using a case where the merit is a genuine performance and the reward is genuinely large — a public orchestra audition, admission to a selective program, a professional draft — but I suspect the obvious cases arrive with too much baggage, since my students will simply cheer for meritocracy. Tell me what the carrying example must have and must lack, propose the one you would use, and explain what lets it do the work rather than the students' prior sympathies. Then map the misconceptions I should expect, in the order they will actually surface, and tell me exactly where in the sequence I should head each one off; I am already anticipating that they will treat effort as the only real basis of desert, that they will hear "you cannot deserve what you did not freely choose" as a knockdown rather than as a question about which basis is in play, that they will slide from "deserved" to "entitled" or "legally owed," and that they will take the natural lottery to settle the whole matter rather than to relocate the basis. Finally, give me one closing question that would show whether they have genuinely separated the allocative claim from the distributive one rather than merely been made uneasy about privilege, and tell me what I should openly decline to cover at this level and flag as out of scope — I am thinking the full Rawls-versus-Nozick exchange, the metaphysics of free will, and the empirical social-mobility literature, but tell me if that is the wrong cut.
reasoning: |-
  Okay, let me unpack the TA's request. They're preparing a 75-minute seminar on meritocracy vs. desert for undergrads, and they need a tightly sequenced explanation plan. Their proposed scaffold has three parts: desert's three components (basis/object/currency), the allocation-vs-fittingness distinction, and institutional mediation. 

  First I need to validate their scaffold order. The desert anatomy must come first - you can't discuss divergences without defining the parts. The allocation/fittingness contrast logically follows as it shows why those parts might misalign. Institutional mediation comes last because it builds on the first two by showing how systems shape desert claims. Their sequence is spot-on.

  For the example, their instinct about avoiding "cheer-worthy" merit cases is sharp. We need something where merit is clear but desert feels questionable. I'm considering a scenario where a neurosurgeon gets a massive salary based on rare innate talent plus minimal effort. This exposes the talent-vs-effort tension in desert bases while keeping merit intact. The key features are: undeniable merit, disproportionate reward, and non-effort-based desert basis.

  Anticipating misconceptions: 
  1. Effort as sole desert basis will surface immediately - address when dissecting desert anatomy. 
  2. "Desert requires free will" objection - tackle during currency discussion by distinguishing metaphysical from institutional agency. 
  3. Semantic drift to entitlement - prevent when contrasting allocation vs fittingness. 
  4. Natural lottery fatalism - counter during institutional mediation by showing systems can redefine desert bases.

  The closing question should force distinction application: "Does the most meritorious applicant for a hazardous waste cleanup job deserve the health risks?" If they separate merit (allocation) from desert (fittingness), they'll see the "reward" is actually harmful.

  Boundaries are well-set: no Rawls/Nozick debates, no free will metaphysics, no mobility stats. Flag these upfront to keep focus on conceptual separation.
answer: |-
  Here’s a structured plan for your 75-minute section, refined for conceptual dependencies, with a targeted example and misconception management. Your scaffold is logically sound—I’ll optimize the sequence slightly and embed defenses against predictable misunderstandings.

  ### **Sequence of Ideas (with Dependencies)**
  1. **Desert’s Anatomy: Basis, Object, Currency (25 mins)**  
     *Why first?*: Without this framework, "desert" is a vague moral intuition. Students need clear components to analyze divergences.  
     - **Basis**: What grounds the claim (effort, talent, outcome, need). Clarify these are *competing* bases.  
     - **Object**: What is deserved (job, salary, praise, penalty).  
     - **Currency**: How the object is delivered (money, status, freedom).  
     *Crucial move*: Show these are *separable* (e.g., "Basis: effort; Object: promotion; Currency: salary").  
     *Preempts*: The "effort-only" misconception by listing multiple bases upfront. Ask: *"If two surgeons save a life—one through innate talent, one through grueling effort—do they deserve the same reward? Why/why not?"*

  2. **Meritocracy vs. Desert: Allocation vs. Fittingness (25 mins)**  
     *Why second?*: Builds on Component 1. Meritocracy answers "Who gets X?" (allocation); desert answers "What treatment does Y merit?" (fittingness).  
     - Meritocracy focuses on *selection* (e.g., "best candidate gets job").  
     - Desert focuses on *moral congruence* (e.g., "does the reward *fit* the basis?").  
     *Key divergence*: Institutions can allocate positions meritocratically but attach objects/currencies that misalign with desert (e.g., extreme pay for minor effort).  
     *Preempts*: "Deserved = entitled" by stressing fittingness ≠ legal right. Ask: *"If the ‘best’ CEO gets a $1B bonus while laying off workers, does she *deserve* the bonus? Does meritocracy require that bonus?"*

  3. **Institutions Mediate Desert (15 mins)**  
     *Why last?*: Requires grasping 1–2 to see institutions as *active designers* of desert relations, not passive recorders.  
     - Institutions *choose* which basis to reward (talent vs. effort), objects (salary vs. status), and currencies (cash vs. perks).  
     - Example: A "meritocratic" lottery for a scholarship uses luck (basis) but may not align with desert (e.g., if basis "should" be effort).  
     *Preempts*: "Natural lottery settles everything" by showing institutions *redefine* bases. Ask: *"If a society rewards inherited wealth (basis) with power (object), is that desert—or just allocation?"*

  ---

  ### **The Carrying Example: "The Star Athlete"**
  **Scenario**: A genetically gifted 7-foot-tall athlete (minimal training) is drafted #1 in the NBA over a 5'10" player who trained obsessively for 15 years. The star gets $10M/year, fame, and elite healthcare.  
  - **Why it works**:  
    - Undeniable merit: The star *is* the "best candidate" (allocation).  
    - Desert tension: Basis (innate talent vs. effort) and object (vast wealth) feel misaligned.  
    - Neutralizes sympathy: Effortful player lost fairly; no villainy.  
    - Lacks baggage: Less politically charged than orchestra auditions or college admissions.  
  **Do the work**: *"Did the institution meritocratically allocate the position? Does the star deserve the $10M? What if the basis for desert ‘should’ be effort, not talent?"*

  ---

  ### **Misconceptions & Interruption Points**
  | **Misconception** | **When it Arises** | **How to Head Off** |
  |-------------------|-------------------|---------------------|
  | "Effort = only real desert basis" | During Basis discussion (Step 1) | **Preempt**: List bases *before* effort examples. Ask: *"Is talent ever a basis? What about results?"* |
  | "No free will → no desert" | When discussing innate traits (Step 1/3) | **Reply**: *"We’re asking *what* institutions should reward, not whether desert exists metaphysically. Which basis fits: effort or talent?"* |
  | "Deserved = legally owed" | During Object/Currency (Step 2) | **Clarify**: *"Desert is about moral fittingness, not contracts. Does a hero ‘deserve’ a medal even if not promised one?"* |
  | "Natural lottery ends debate" | During Institutional Mediation (Step 3) | **Reframe**: *"Institutions decide whether to reward talent (given by lottery) or effort (chosen). Which *should* they pick?"* |

  ---

  ### **Closing Question to Test Understanding**  
  **"In a famine, should the last bread go to the most meritorious farmer (allocation) or the hungriest child (desert basis: need)? Does meritocracy decide who *deserves* the bread?"**  
  - **What reveals understanding**: If they separate "who gets it" (meritocracy) from "who deserves it" (desert), and see institutions choose which basis to prioritize. If they conflate them, they’ll struggle.

  ### **Out of Scope (Flag Early)**  
  - **Rawls vs. Nozick**: "We’re not debating justice theories—focus on separating two *concepts*."  
  - **Free will metaphysics**: "We’ll take ‘effort’ and ‘talent’ as practical categories, not metaphysical puzzles."  
  - **Social mobility data**: "This is conceptual, not empirical. Does meritocracy *entail* desert?"  

  ### **Timing Summary**  
  - Desert Anatomy (25 min) → Merit vs. Desert (25 min) → Institutional Mediation (15 min) → Q&A (10 min).  
  Use the athlete example at each stage: dissect its basis/object/currency (1), allocation/fittingness split (2), and how the NBA *designs* desert (3).  

  This sequence forces students to build the machinery *before* confronting intuitions, isolates desert from meritocracy via institutional mediation, and uses a neutral example to expose moral tensions without partisan triggers.
