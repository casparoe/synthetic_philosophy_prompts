  First, I need to identify the foundational concepts. The key insight is that letter recognition depends on distinctive features and their relationships, not exact outlines. This directly counters the friend's potential misconceptions that letters are defined by rigid shapes or authorial intent alone. 

  The teaching sequence should start simple and build complexity. Beginning with non-letter examples (like the circle-gap exercise) makes sense because it removes alphabet baggage. That gap manipulation clearly demonstrates how minor changes alter perception - perfect for establishing that features matter more than outlines. 

  For the 'a'/'u' confusion example, I'll need to break down the critical differentiators: stem placement (right side for 'a') and top closure being optional for 'a' but not for 'u'. The exercise must make these elements tangible - maybe having them draw both letters to compare. 

  Anticipating wrong assumptions is crucial. The "exact outline" myth should be debunked immediately with the circle-gap demo before introducing letters. The "intent defines it" misconception can wait until after they've experienced how perception works objectively. 

  The closing exercise - drawing a stylized 'g' without stems - serves as a good test: if they understand feature hierarchy, they'll know the descender and bowl are essential while stems are variable. 

  I'll avoid ductus discussions on day one. Stroke order is important but secondary to recognition fundamentals. Keeping it visual-first prevents overload. 

  The user's clearly put thought into their example (that open-top 'a' shape). My plan should honor that by using it as the centerpiece while structuring the learning path around it. Their awareness of potential misconceptions tells me they'll appreciate preventative teaching moments woven into the sequence.
answer: |-
  Here's your teaching plan, grounded in the core idea: **Letter recognition relies on *distinctive features* and their *relationships*, not exact outlines or the artist's intent.**

  **The Plan: Sequence & Key Ideas**

  1.  **Foundational Concept: Gap Manipulation (Non-Letter Intro)**
      *   **Exercise:** *Before even mentioning letters*, draw your problematic shape: **a circle with a gap at the top-right and a vertical stem attached just below the gap, extending down the right side.**
      *   **Question:** "What basic shapes do you see? What does this gap *do* to how we see the circle?"
      *   **Goal:** Establish that a small gap fundamentally changes perception (circle -> C-like). Introduce the idea that **breaks/openings are powerful perceptual features.** *Head off "exact outline" here:* Show how adding/removing this tiny gap changes the whole feel, proving it's not *just* the outline, but specific *features* within it.

  2.  **Introduce Context: The Alphabet**
      *   Briefly show standard 'a', 'u', and 'c'. Point out key features:
          *   **'a':** Closed bowl (usually), stem down the *right* side.
          *   **'u':** Open top, stems down *both* sides (or one dominant curve).
          *   **'c':** Open curve, *no* stem.
      *   **Key Idea:** **Letters are defined by a combination of *key features* (bowl, stem, crossbar, open/closed, curve direction) and their *relative positions*.** *Head off "intent defines it" subtly:* Show that contextless, a 'c' and a 'u' can look similar; intent alone doesn't make it clear.

  3.  **Apply to the Problem Shape: Feature Analysis**
      *   Draw your shape again. Analyze it *together* using the features just discussed:
          *   "Does it have a bowl? (Yes, mostly circular)"
          *   "Is the bowl *closed*? (No! Gap at top)"
          *   "Is there a stem? (Yes, down the *right* side)"
          *   "Where does the stem connect? (Below the gap, right side)"
      *   **Question:** "Based *only* on these features, could this be an 'a'? Could it be a 'u'? Could it be a 'c'? Why/why not?"
          *   *'a' Potential:* Has a bowl and a right stem. BUT, the bowl isn't fully closed (gap).
          *   *'u' Potential:* Has an open top and a right stem. BUT, typical 'u' has symmetry or a left curve, the stem here is very vertical/dominant.
          *   *'c' Potential:* Has an open curve. BUT, has an added stem – a feature *not* present in a 'c'.
      *   **Key Insight:** **Ambiguity arises when a shape shares key features with multiple letters OR is *missing* a critical defining feature of one letter.** *Head off "exact outline" definitively:* Show how this *one* shape overlaps features of *three* different letters' outlines. *Head off "intent defines it":* The shape objectively has features of 'u' and 'a'; saying "it's an 'a'" doesn't erase its 'u'-like qualities.

  4.  **Resolving Ambiguity: Context is King (Later) & Clarity Levers**
      *   **Introduce "Clarity Levers":** Explain that when a shape is ambiguous, you manipulate features to push it towards one letter. For *this* shape to be clearly an 'a':
          *   *Option 1:* **Close the gap** at the top (making the bowl whole).
          *   *Option 2:* **Add a clear crossbar** (making it a two-story 'a').
          *   *Option 3:* **Significantly shorten the stem** and emphasize the bowl, moving it towards a single-story 'a' (risking 'o' ambiguity!).
          *   *Option 4:* **Exaggerate the connection point** so the stem clearly starts *within* the bowl curve, not just below a gap.
      *   **Hold Back For Later:** Deep dives into *contextual* disambiguation (surrounding letters, word shapes). Day 1 is about *intrinsic* features of the glyph itself. Briefly mention context exists but isn't the focus today.

  5.  **Quick Closing Check: The Essential 'g'**
      *   **Exercise:** "Draw a stylized lowercase 'g' *without* using any stems (like on a 'd' or 'b'). Focus *only* on the features that make it undeniably a 'g' and not a 'y' or an '8' or something else."
      *   **What Shows Understanding:** They should focus on the **closed bowl** + **descender loop (or distinctive tail)**. If they add stems or make it look like an '8', the core concept of *distinctive features* might not be solid yet. This tests if they grasp that some features are critical (bowl + descender shape for 'g'), while others (stems) are variable/optional in stylization.

  **What to Flat-Out Refuse on Day One:**

  *   **Deep Historical Analysis:** Don't get sidetracked by the evolution of the 'a' from Roman scripts through Carolingian minuscule to modern type. Stick to *recognizable contemporary forms*.
  *   **Overly Subjective "Feels Like" Discussions:** Gently steer away from "I feel like it's an 'a' because it's curvy." Bring it back to specific, observable features (bowl, stem, closure).
  *   **Advanced Typography Concepts:** Kerning, x-height consistency, detailed ductus (stroke order), specific type classifications (serif vs. sans vs. script nuances beyond basic shapes). Keep it focused on *glyph recognition*.

  **Why this sequence works:**

  1.  Starts abstract (gap impact) to avoid letter bias.
  2.  Builds foundational vocabulary (features, relationships).
  3.  Applies vocabulary directly to the core problem example.
  4.  Explicitly analyzes ambiguity using the vocabulary.
  5.  Provides practical solutions (clarity levers).
  6.  Checks understanding with a *different* letter challenge.
  7.  Proactively counters key misconceptions at the right points.

  Focus on guiding her through *observing* and *naming* the features in the examples. Your role is facilitator, not lecturer. Good luck!
