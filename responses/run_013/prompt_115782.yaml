prompt: |-
  I'm into hand lettering as a hobby and my friend wants me to teach her to tell when a heavily stylized 'a' is still an 'a' and when its crossed over into being a different letter or just an abstract blob. I want a plan for how to teach it, not a lecture on it. The example I was going to build the whole thing on is a shape I keep redrawing: basically a circle with a stem down the right side, except the circle isnt closed at the top -- theres a gap where the stem meets it, so at a glance it reads as an 'a' or a 'u' or a 'c' that grew a tail. My hunch is it comes down to how the strokes connect and which side the tail is on, but I dont trust that and I dont want to lead her wrong. So: what idea has to be in place before that example can even do any work, what depends on what in the order, and what should I hold back for later? She's going to walk in with some wrong ideas -- like a letter is just its exact outline so changing the outline enough makes it a different letter, or the reverse, that if you meant it as an 'a' then it is one -- and I want to head each of those off at the right point in the sequence, not tack them on at the end. Give me one quick question or exercise I can throw at her at the very end to see if it actually landed, and tell me what I should just flat-out refuse to get into with her on day one. Lead with the answer in your first sentence, then walk me through it.
