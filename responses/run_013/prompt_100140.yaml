prompt: |-
  I run growth for a small subscription app and a stats question has turned into a philosophy question on me. We A/B tested two onboarding flows. Pooled across all users, flow B has better 30-day retention. But inside every cut we try -- new vs returning, iOS vs Android, free-trial vs paid, heavy vs light prior use -- flow A wins, sometimes by a lot. The wrinkle is that the cuts aren't fixed in advance: flow B nudges people to invite friends, and that's what moves them between usage tiers, so I can't tell wether "heavy user" is a confounder I should be stratifying on or a downstream consequence of the treatment itself. On top of that our headline number is a ratio, retained users over active users, so the top and bottom can each reverse on their own and the two reversals can even cancel each other out. Whichever way I read it I get a different answer about which flow is better and I have to ship something next week. What are the most important implications of all this for how we should actually decide? Give it as exactly five numbered points, a sentence or two each, no intro and no wrap-up.
reasoning: |-
  Alright, let's tackle this user's problem. They ran an A/B test for two onboarding flows. Overall, Flow B has better 30-day retention, but when they segment the data by different user groups—like new vs. returning, iOS vs. Android, etc.—Flow A performs better in each segment. The user is confused because the segments aren't fixed; Flow B encourages inviting friends, which affects usage tiers. Also, their metric is a ratio (retained/active), which complicates things since both numerator and denominator can change. They need to decide which flow to ship next week.

  First, I need to understand Simpson's Paradox. The pooled result shows B is better, but within each subgroup, A is better. That usually happens when the subgroups have different sizes and the flow affects group assignment. Here, Flow B's friend invitation feature might be shifting users into higher usage tiers. So, "heavy user" isn't just a segment; it's an outcome influenced by the flow. That means stratifying on usage tiers is problematic because it's part of the treatment effect.

  Next, the ratio metric. Retention rate is retained users divided by active users. If Flow B increases active users (denominator) more than retained users (numerator), the ratio might look worse even if absolute retention is higher. The user mentioned reversals in both parts of the ratio. So, looking at absolute numbers is crucial here.

  The user has to make a decision soon. They need actionable steps. The implications should guide them on what to prioritize. Since they can't pre-stratify due to the dynamic segments, the overall effect might be more reliable. But they should check if the overall retention difference is practically significant, not just statistically.

  Also, they should analyze the ratio's components separately. Absolute retained users and active users might reveal if Flow B is driving more activity but not proportionally increasing retention. The ratio could mask this. Understanding the business goals is key. If growing the user base is important, even with slightly lower retention, Flow B might be better. But if retention is the priority, Flow A could be the choice despite lower overall numbers.

  The friend invitation mechanic in Flow B is central. They should evaluate its impact independently. How many more invites does it drive? Do those invites lead to higher retention? If the invites are valuable, Flow B's overall effect might justify its use, even if within segments it looks worse.

  Lastly, the decision timeline. They need to ship soon, so they must focus on the most critical insights. Recommending a phased rollout could mitigate risk. Testing Flow B on a small segment first to monitor real-world performance before full deployment. Highlighting the trade-offs between short-term retention and long-term growth based on their business objectives will help them decide.
answer: |-
  Here are the five key implications for your decision:

  1.  **Prioritize the overall effect:** Since stratifying introduces bias (usage tier shifts are caused *by* the flow), the pooled result (Flow B's better overall retention) is likely the most reliable estimate of the real-world total impact you'll see.
  2.  **Analyze absolute numbers, not just the ratio:** Break down "retained users" and "active users" counts separately for each flow to understand *why* the ratio reverses in subgroups; Flow B might be increasing the denominator (active users) significantly via invites.
  3.  **Accept Flow B's invite mechanic drives change:** Flow B's success hinges on its ability to nudge users into higher engagement (invites, becoming "heavy users"); evaluating it *without* this effect (e.g., by stratifying on usage) misrepresents its core mechanism.
  4.  **Focus on primary business goals:** Decide if maximizing raw retained user *volume* (potentially driven by Flow B's invites) is more critical than maximizing the retention *rate* within static user segments (where Flow A wins).
  5.  **Implement with monitoring:** Ship Flow B next week (given its overall win) but closely track long-term retention cohorts and user segments post-launch to confirm the effect and identify any unforeseen negative impacts needing adjustment.
