prompt: |-
  Two of my colleagues collided at a faculty meeting last week over a student's essay defending the claim that the pyramids were built by a lost civilisation, and over whether we should have called the essay pseudohistory in our comments rather than simply badly argued. I was asked to referee, declined, and would now like you to do it. Their exchange went roughly as follows.

  The historian: The label is circular. We decide who is outside the club and then dress the decision up as method. And the lost-civilisation thesis is perfectly testable — it has been tested, by radiocarbon and stratigraphy, and it failed. Unfalsifiability is not what is wrong with it, so calling it pseudohistory adds nothing to the ordinary charge of being wrong.

  The philosopher: Failure is not the issue; every research programme has anomalies. What marks pseudohistory is how anomalies are handled — each one is absorbed by another ad hoc move (the civilisation was more advanced than we thought, its traces were destroyed, the dating is corrupt), and the thesis never generates a novel prediction that survives testing. That is Lakatos's distinction between a progressive and a degenerating programme, and it is a claim about method, not about who is in the club.

  The historian: Then your criterion reduces to handles evidence badly, which describes plenty of ordinary history that nobody calls pseudohistory. And the specific charge — that the thesis cannot be refuted — is false. Its defenders state clearly what would refute them: undisturbed strata at the relevant dates. What they then do is explain the evidence away, which is a vice, not a different kind of inquiry.

  The philosopher: Explaining evidence away is precisely the different kind of inquiry. The absence of the expected ruins is read as evidence that the ruins were destroyed; the silence of the record becomes a premise. A programme that can convert any result into a confirmation is self-sealing, and self-sealing is an epistemic property, not a sociological one.

  The historian: Every programme is self-sealing at the margins, and the ones we call respectable stay respectable because their practitioners hold the chairs, control the journals and train the next generation. This is the old objection that the demarcation problem is itself a pseudo-problem — that pseudoscience is a term of politics rather than epistemology — and nothing you have said answers it.

  Please adjudicate move by move: for each of the five moves, say how much of it is right and where it goes wrong, then say who has the better of the overall dispute and what both of them are missing.
reasoning: |-
  Hmm, the user wants me to referee a dispute between two colleagues about whether a student's essay on pyramid construction should be labeled "pseudohistory" or simply "badly argued." This is quite an intellectual challenge with deep epistemological implications.

  First, let me understand the core arguments. The historian rejects the "pseudohistory" label as circular and sociological, arguing the lost-civilization theory is testable and falsified. The philosopher defends it using Lakatos' framework of degenerating research programs that immunize themselves against refutation. Their exchange reveals fundamental tensions in demarcation criteria.

  For the historian's first move: He's right that labeling can be circular and that this specific claim is testable (radiocarbon dating does refute it). But he wrongly dismisses methodological concerns - unfalsifiability isn't the only mark of pseudohistory. His club metaphor oversimplifies; disciplines have methodological standards beyond social power.

  The philosopher's response: Correctly identifies the core issue as methodological (how anomalies are handled) and invokes Lakatos productively. But he's too dismissive of falsification - when a theory survives only through endless ad hoc adjustments, that is significant. His framework explains why some bad arguments are qualitatively different.

  Historian's counter: Makes a valid point that "handles evidence badly" applies to mainstream history too. But he misrepresents the pseudohistory charge - it's not just about being unfalsifiable, but systematically immunizing against falsification. His example ironically supports the philosopher's case - defenders preemptively explain away counterevidence.

  Philosopher's clarification: Nails the key distinction - pseudohistory systematically converts counterevidence into confirmation. This epistemic move (self-sealing) is indeed what makes it qualitatively different from ordinary bad scholarship. But he underplays how all paradigms protect core assumptions to some degree.

  Historian's sociological point: This is crucial - power dynamics do influence what gets labeled "pseudo." But he overcorrects by reducing everything to politics. Demarcation isn't purely epistemological or sociological; it's both. Kuhn and Feyerabend would remind us that authority plays a role even in legitimate science.

  The overall dispute? The philosopher has stronger arguments because he addresses methodology rather than just truth-value. But both miss nuances: the historian ignores how systematic evasion differs from ordinary error, while the philosopher underestimates sociology's role in labeling. The student's essay likely exhibits both bad arguments and pseudohistorical traits - the former correctable, the latter requiring deeper methodological intervention.

  The "pseudohistory" label can be pedagogically useful if explained properly, but shouldn't be used as a mere dismissal. The real issue is teaching students how knowledge communities establish warranted beliefs - which both colleagues ironically demonstrate through their debate.
answer: |-
  Here's a move-by-move adjudication of the dispute, followed by an overall assessment and identification of what both colleagues are missing:

  **Adjudication of Moves:**

  1.  **The Historian (1st Move):**
      *   **Right:** Correctly identifies the *potential* for circularity in labeling ("we decide who is outside the club and then dress the decision up as method"). Right that the *specific* lost-civilization thesis *has* been empirically tested (radiocarbon, stratigraphy) and falsified. Right that "unfalsifiability" isn't the core flaw *in this specific case* and that "wrong" is the primary charge.
      *   **Wrong:** Overstates the circularity argument. While sociological factors exist, disciplines *do* develop methodological standards (including evidence evaluation) that aren't *solely* about exclusion. Dismisses the "pseudohistory" label too quickly; it *can* signal a specific *kind* of persistent methodological failure beyond just being wrong once. Conflates testability of a *specific claim* with the overall *methodology* of the program advocating it.

  2.  **The Philosopher (1st Move):**
      *   **Right:** Correctly shifts focus from isolated "failure" to *how a program handles anomalies* over time. Accurately characterizes the hallmark of a degenerating program (Lakatos): absorbing anomalies solely through ad hoc adjustments ("traces destroyed", "dating corrupt") without generating novel, confirmed predictions. Correctly frames this as a methodological distinction ("claim about method").
      *   **Wrong:** Slightly overstates the "never generates a novel prediction" requirement – degenerating programs can sometimes make predictions, they just tend to fail or be trivial. Implies the *only* flaw is the lack of progressiveness, potentially downplaying the significance of the *specific* falsifications the Historian highlights.

  3.  **The Historian (2nd Move):**
      *   **Right:** Correctly points out that "handles evidence badly" *is* a problem within mainstream history ("ordinary history that nobody calls pseudohistory"). Correctly identifies that the defenders *do* state potential falsifiers ("undisturbed strata"). Correctly identifies "explaining the evidence away" as a vice.
      *   **Wrong:** Misrepresents the Philosopher's "specific charge." The Philosopher's core charge is *not* that the thesis "cannot be refuted" *in principle* (Popperian unfalsifiability), but that *in practice* its defenders *systematically immunize it* against refutation *using the method described* (converting counterevidence). The stated falsifier ("undisturbed strata") is precisely the kind of evidence defenders *would* explain away using ad hoc hypotheses ("the strata *were* disturbed later," "the civilization avoided leaving strata"). His point about the vice being widespread inadvertently *supports* the need for a distinction like "pseudohistory" for *extreme* and *systematic* cases.

  4.  **The Philosopher (2nd Move):**
      *   **Right:** Precisely identifies the core methodological flaw: the program *systematically converts any counterevidence into confirmation* ("absence of ruins = evidence they were destroyed," "silence of the record = premise"). Correctly labels this "self-sealing." Correctly argues that this self-sealing is an *epistemic property* (a way of knowing, or failing to know) inherent to the program's methodology, not just a sociological label.
      *   **Wrong:** Could more explicitly acknowledge the Historian's valid point that *some* degree of protecting core assumptions occurs in all research ("self-sealing at the margins"). Doesn't fully address the challenge of *where to draw the line* between "ordinary bad handling" and "pseudohistorical self-sealing."

  5.  **The Historian (3rd Move):**
      *   **Right:** Correctly identifies that *all* research programs engage in *some* protective manoeuvres ("self-sealing at the margins"). Powerfully restates the strong sociological critique: institutional power ("hold the chairs, control the journals") plays a significant role in what gets labeled "respectable" vs. "pseudo." Correctly identifies the "demarcation problem" (science vs. pseudoscience/history vs. pseudohistory) as deeply challenging and potentially inherently messy ("pseudo-problem").
      *   **Wrong:** Overcorrects by implying the distinction is *only* or *primarily* about power and politics ("term of politics rather than epistemology"). While power is crucial, the Philosopher *has* articulated a plausible *epistemic* criterion (systematic, self-sealing degeneration) that isn't *solely* reducible to sociology. Dismisses the possibility of meaningful methodological demarcation altogether.

  **Overall Verdict:**

  *   **The Philosopher has the better of the dispute.** While the Historian makes crucial points about sociological power dynamics, the empirical falsifiability of *specific claims*, and the universality of some protective strategies, the Philosopher successfully identifies and defends a core *methodological* criterion – systematic self-sealing through persistent ad hoc adjustments and failure to generate novel progress – that meaningfully distinguishes the *kind* of flawed inquiry seen in the pyramid example ("pseudohistory") from merely "badly argued" mainstream history. This epistemic criterion addresses the "how" of being wrong in a way that justifies a stronger label.

  **What Both Are Missing:**

  1.  **The Pedagogical Dimension:** The core issue is how to *teach* the student. Labeling it "pseudohistory" *without explanation* is unhelpful and risks seeming like mere dismissal. Calling it "badly argued" is insufficient if it doesn't address the *systematic methodological flaws*. The best feedback would likely: (a) detail the specific empirical refutations (radiocarbon, stratigraphy), (b) *show* how the defenses offered ("traces destroyed," "corrupt dating") are classic ad hoc maneuvers that immunize the theory, (c) challenge the student to identify what *novel, testable predictions* the "lost civilization" theory makes that mainstream archaeology doesn't, and (d) explain *why* systematic reliance on such maneuvers makes an argument epistemically bankrupt ("pseudohistorical").
  2.  **The Spectrum & Context:** Both treat the distinction as too binary. "Pseudohistory" exists on a spectrum with "bad history" and "fringe history." The *context* (student essay vs. published manifesto) matters for the severity of the label. The student might be parroting bad sources naively rather than engaging in deliberate self-sealing methodology.
  3.  **Lakatos Nuances:** While Lakatos provides a powerful framework, applying it rigidly is tricky. Determining when a program is "degenerating" vs. just going through a rough patch requires judgment. The Philosopher could acknowledge this complexity more.
  4.  **Integration of Perspectives:** The strongest position likely integrates their insights: Pseudohistory is characterized by systematic epistemic vices (self-sealing, degeneration) *that are enabled and sustained* by sociological factors (isolation from mainstream institutions, reliance on alternative media/publishing) *and* whose specific claims often *are* empirically falsifiable but immunized against. Demarcation is messy but not impossible; it requires evaluating both methodology *and* the social/intellectual context. The Historian's sociological critique doesn't invalidate the Philosopher's epistemic criterion; it contextualizes *how* such methodologies persist despite being flawed.
