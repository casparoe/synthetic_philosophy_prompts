answer: |-
  ## Research Proposal: Simulation Hypothesis and the Ill-Posed Stakes Problem in Long-Termism

  **Principal Investigator:** [Your Name/Affiliation]
  **Duration:** 3 Months
  **Requested Funding:** [Briefly state amount/resources needed, e.g., "Relief from teaching duties for 0.1 FTE"]

  ### 1. Core Research Question
  Does simulation reasoning (specifically Bostrom's trilemma) provide a reason to discount the overwhelming importance typically assigned to influencing the far future *that is independent of the specific probability assigned to us being simulated*, arising instead from fundamental indeterminacy in expected value calculations under this hypothesis?

  ### 2. Background & Significance
  Long-termist arguments often contend that the sheer scale of the potential far future means that actions with even minuscule probabilities of significantly affecting it dominate our practical reasoning (the "fanaticism" problem). A common counter-argument utilising Bostrom's Simulation Hypothesis suggests that if we are likely simulated (Option 3), our actions' far-future impact is either negligible or determined by the simulators, thereby reducing expected stakes and mitigating fanaticism.

  This project challenges the sufficiency of this probabilistic counter. It posits that simulation reasoning doesn't merely *lower* expected value calculations but potentially renders them *ill-posed*. The critical issue is the complete lack of evidence regarding *simulator intentions*: would they value, ignore, weight, replicate, or terminate our simulation based on our actions? Crucially, this parameter isn't just unknown; it may be fundamentally unconstrained by our evidence, preventing meaningful averaging over possibilities. If the expected value (EV) of an action becomes indeterminate (i.e., not merely large or small, but undefined within any reasonable bounds) due to this unconstrained parameter, fanaticism is undermined not by smaller numbers, but by the *absence* of a coherent number justifying extreme sacrifices. Conversely, certain simulator intentions could *amplify* stakes dramatically. The significance lies in clarifying whether simulation reasoning offers a novel, probability-*independent* structural challenge to fanatical long-termism.

  ### 3. Limitations of Existing Positions
  *   **Naive Probabilistic Approaches:** Positions that simply multiply the probability of being simulated (`P(sim)`) by some (assumed low or zero) impact value within the simulation (`EV_sim_action`) implicitly assume a specific, constrained model of simulator behaviour (e.g., indifference). They fail to grapple with the *range* of possible `EV_sim_action` values under different simulator intentions and the lack of evidence to assign probabilities *to those intentions themselves*. The core indeterminacy challenge remains unaddressed.
  *   **Simulation-Irrelevance Positions:** Views treating the simulation hypothesis as ethically irrelevant typically either ignore the potential for simulator intentions to radically rescale stakes (up or down) or assume the EV calculation within the simulation is isomorphic to a non-simulated one, again presupposing an answer to the very question of simulator intent.
  *   **"Handover" Arguments:** While acknowledging simulators take control, these often assume a *reduction* in our influence without rigorously demonstrating why indeterminate or potentially amplified influence isn't a live possibility.

  Existing literature largely overlooks the *epistemic* problem of unconstrained simulator intent as a source of *indeterminacy* in EV, distinct from merely low probability or low impact.

  ### 4. Proposed Approach: Formal Modelling of Indeterminacy
  Given the theoretical and conceptual nature of the core question, **formal modelling is the appropriate methodology**. Empirical work is infeasible for this specific problem concerning unobservable simulator intentions and abstract decision theory. The project will develop and analyse two complementary small-scale decision-theoretic models:

  1.  **Model A (Parameter Sensitivity under Uncertainty):** A standard long-termist EV framework incorporating `P(sim)` and `P(not_sim)`. `EV_action_not_sim` will be modelled as astronomically large (representing fanatical stakes). `EV_action_sim` will be represented as a function `f(I, A)`, where `I` represents the *intention/weighting scheme* of the simulators concerning our actions (e.g., a multiplier: 0 for indifference, 1e30 for extreme leverage, -1e30 for punishment) and `A` represents the action's intrinsic value within the simulation (assumed finite/non-astronomical). Crucially, `I` will be treated as a *free parameter with no prior distribution* constrained by evidence. The analysis will focus on:
      *   How does the *range* of possible overall Expected Values (`P(sim)*f(I,A) + P(not_sim)*EV_action_not_sim`) behave as `I` varies across plausible extremes?
      *   Does this range always collapse to finite, manageable values for any `P(sim) > 0`, or can it remain astronomically large (positive or negative) *and* infinitesimally small depending solely on `I`?
      *   Identifying thresholds where the EV becomes radically sensitive to untestable assumptions about `I`.

  2.  **Model B (Robust Decision Making under Deep Uncertainty):** Shifting focus, this model will employ frameworks like Robust Decision Making (RDM) or `MaxiMin`/`MaxiMax` criteria. It will ask: what actions appear rational when we explicitly acknowledge `I` as a deeply uncertain, unconstrainable parameter? Does the presence of this deep uncertainty, independent of `P(sim)`, systematically shift rational choice away from actions justified *only* by astronomical `EV_action_not_sim`?

  **Literature Engagement:** While avoiding a full review within the proposal, the modelling will explicitly engage with the structure of Bostrom's trilemma, standard long-termist EV formulations (e.g., Beckstead-like models), and concepts from decision theory under deep uncertainty (e.g., works by Lempert, Popper, or classic Wald/Maximin). The focus is on *applying* these structures to the specific indeterminacy problem, not exhaustive coverage of simulation ethics or long-termism generally.

  ### 5. Expected Outcomes & Deliverables
  *   **Successful Outcome:** A working paper demonstrating through formal models that simulation reasoning introduces a source of *indeterminacy* (extreme sensitivity to untestable parameters) into long-termist EV calculations. This would show that fanaticism is challenged structurally, regardless of `P(sim)`, because the key quantity (`EV_action`) lacks a well-defined, actionable value. A clear articulation of *how* the unconstrained simulator intention parameter (`I`) drives this result.
  *   **Clear Result:** A conclusion stating whether simulation reasoning provides a probability-*independent* reason for discounting fanatical long-termism (due to indeterminacy), whether it potentially exacerbates it, or whether the challenge remains firmly tied to specific probability assignments (`P(sim)`).
  *   **Concrete Deliverables:** A draft journal article (approx. 8000 words) presenting the models and analysis; presentation of findings at an internal seminar.
  *   **Failure Conditions:** The project fails if the models conclusively show that the indeterminacy problem collapses into standard probabilistic concerns (i.e., `I` can always be meaningfully averaged over with reasonable priors, making `EV_sim_action` simply another finite/known term). Failure also occurs if no tractable model captures the core conceptual worry about unconstrained intent.

  ### 6. Feasibility & Timeline (3 Months)
  *   **Month 1:** Detailed specification of Model A and Model B frameworks; initial implementation/simulation (e.g., using Python/R/MATLAB for sensitivity analysis).
  *   **Month 2:** Analysis of model outputs; exploration of variations and robustness checks; drafting core sections of the paper.
  *   **Month 3:** Synthesis of findings; completion of paper draft; preparation of seminar presentation.
  *   **Feasibility Assessment:** Developing and analysing two focused formal models is ambitious but realistic within three months for a researcher familiar with the core concepts. It leverages existing decision-theoretic tools rather than requiring novel mathematical development. The tight timeline necessitates focus *exclusively* on the models addressing the specific indeterminacy question. While reading broader literature is valuable, it is not the primary *method* for settling the core argument about structural indeterminacy posed here; the models are the right tool. The main risk is unforeseen complexity in Model B's robust criteria, but scope can be adjusted to ensure completion (e.g., focusing primarily on Model A's sensitivity analysis if needed). **Conclusion: Three months is challenging yet achievable, provided the scope remains tightly focused on these specific models.** This project is not kidding itself about empirical reach but offers a legitimate theoretical investigation into a key conceptual puzzle.
