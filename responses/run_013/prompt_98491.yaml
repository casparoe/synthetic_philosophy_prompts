answer: |-
  ### Grant Allocation Procedure: Priority-Weighted Impact Scoring

  This procedure replaces your current rubric by embedding the priority view (gains to the worse off count more) and automatically rejecting leveling down (harming the better off without helping others). It is designed for a committee of four untrained trustees to run in one afternoon with 15–20 proposals, using only basic arithmetic. The procedure has six steps, with Steps 1–3 involving judgment calls disguised as structured questions. **The critical free parameter is the priority weight (c)**, set in advance (see **Parameter Setting** below).

  ---

  #### **Pre-Meeting Setup**
  - **Staff prepares**: For each proposal, staff documents:
    1. **Beneficiary groups**: Names, number of people, and program area (health, education, livelihoods).
    2. **Wellbeing anchors**: Staff proposes two groups for calibration (see Step 1):  
       - **Worst-off anchor**: The most disadvantaged group *across all proposals*.  
       - **Best-off anchor**: The most advantaged group *across all proposals*.  
    3. **Impact estimates**: For each group, staff provides:  
       - Current wellbeing *without* the grant (on a 0–100 scale; see Step 1).  
       - Expected change in wellbeing (Δ) *with* the grant (e.g., "+5" or "–3").  
       - Uncertainty level (Low/Medium/High) for Δ.

  ---

  ### **Procedure Steps**

  #### **Step 1: Calibrate Wellbeing Scale (0–100)**
  - **Question**: *"Relative to all groups we can help this round, where does each group fall between the worst-off and best-off anchors?"*  
  - **Sufficient answer**: Assign a wellbeing score (W) from 0–100 to every beneficiary group:  
    - **Worst-off anchor** = 0 (most disadvantaged).  
    - **Best-off anchor** = 100 (most advantaged).  
    - **Other groups**: Trustees discuss and assign W by consensus or majority vote.  
  - **Stop condition**: If trustees cannot agree on anchors after 10 minutes, adjourn and consult external experts (values conflict).  
  - **Judgment call**: Assigning W requires comparing groups across domains (e.g., health vs. income). No formal metric exists—trustees must use collective intuition.  
  - **Output**: Every group has a W score (e.g., "Landless farmers: W=10", "Urban students: W=85").

  ---

  #### **Step 2: Estimate Wellbeing Changes (Δ)**
  - **Question**: *"How much will this grant change the wellbeing of each group?"*  
  - **Sufficient answer**: For each group, agree on a single Δ value:  
    - Use staff’s Δ estimate unless disputed.  
    - If disputed, trustees propose adjustments. Adopt the **median** of trustee estimates.  
    - Flag High Uncertainty Δ for extra scrutiny (e.g., require staff evidence).  
  - **Stop condition**: If Δ cannot be agreed on for a critical group after 5 minutes, reject the proposal.  
  - **Judgment call**: Δ relies on counterfactuals (e.g., "What would happen without the grant?"). Trustees must extrapolate from limited data.  
  - **Output**: Each group has a Δ (e.g., "Landless farmers: Δ=+8").

  ---

  #### **Step 3: Calculate Proposal Score**
  - **Formula**:  
    **Score** = Σ [ (Number of people) × Δ × (1 / (W + c)) ]  
    - **c** = Priority weight (set in advance; see **Parameter Setting**).  
    - **W** = Wellbeing score (0–100).  
    - **Δ** = Wellbeing change.  
  - **Calculation**:  
    1. For each group, compute: **People × Δ × (1/(W + c))**  
    2. Sum across all groups in the proposal.  
  - **Example**: A group with 100 people, W=20, Δ=+4, c=10:  
    **Contribution** = 100 × 4 × (1/(20+10)) = 100 × 4 × (1/30) = 13.3.  
  - **Tools**: Use calculators or pre-made spreadsheets. Staff computes scores after Steps 1–2.  

  ---

  #### **Step 4: Rank and Fund**
  - **Rule**:  
    - Proposals with **negative scores are rejected** (automatic leveling-down rejection).  
    - Sort proposals by score (highest to lowest).  
    - Fund top proposals until budget ($6M/round) is exhausted.  
  - **Stop condition**: If scores are tied, trustees vote on tied proposals.  

  ---

  #### **Step 5: Handle Uncertainty**
  - **Rule**: Multiply the score by an **uncertainty factor**:  
    - Low Uncertainty: × 100% (no change).  
    - Medium Uncertainty: × 67% (reduce impact by 1/3).  
    - High Uncertainty: × 33% (reduce impact by 2/3).  
  - **Judgment call**: Uncertainty is binary (trustees accept/reject staff’s rating).  

  ---

  #### **Step 6: Review and Adjust**
  - **Question**: *"Does this ranking align with our mission?"*  
  - **Action**: Trustees may override rankings only if:  
    - A proposal violates foundation bylaws.  
    - New evidence emerges (e.g., data error).  
  - **Output**: Final grant list.  

  ---

  ### **Key Features**
  1. **Rejects leveling down automatically**:  
     - A proposal harming the better off (Δ<0) without helping others (Δ=0 elsewhere) yields:  
       **Score** = [People × Negative Δ × (1/(High W + c))] + 0 = **Negative score**.  
     - *Example*: Hurting 100 people at W=90 (Δ=–5) with no other effects:  
       Score = 100 × (–5) × (1/(90+10)) = –5 → **Rejected**.  

  2. **No sufficiency threshold**:  
     - Priority weighting (1/(W + c)) continuously values gains to the worse off more.  
     - **Contrast with a floor rule**:  
       - A *floor* would ignore gains above a threshold (e.g., W>50).  
       - This procedure *always* weights gains—even above "sufficiency"—but less for higher W.  

  3. **Handles contested wellbeing metrics**:  
     - **When metrics clash** (e.g., health vs. income), Step 1 forces trustees to collapse differences into a single 0–100 scale via deliberation.  
     - **No common unit?** Trustees must still assign W and Δ using holistic judgment (e.g., "This group seems worse off than that one").  

  4. **Priority weight (c)**:  
     - **How to set**: Trustees choose c via two hypothetical votes:  
       - *Vote 1*: "How much gain for the best off (W=100) equals a **+10 gain for the worst off (W=0)**?"  
         (e.g., if trustees say "+200", then c = 10; see derivation below).  
       - *Vote 2*: Test c with examples. Adjust until values feel right.  
     - **Derivation**:  
       Gain to W=0: `10 × (1/(0 + c))` = Gain to W=100: `X × (1/(100 + c))`  
       → `10/c = X/(100 + c)` → **c = (10 × 100)/(X - 10)**.  
       *Example*: If X=200, c = (1000)/(190) ≈ 5.3.  
     - **Danger of extreme c**:  
       - If c is too low (e.g., 0.1), tiny gains to the worst off justify massive losses to others (e.g., 1 person gains Δ=0.1 at W=0 outweighs 1,000 people losing Δ=10 at W=50).  
       - **Safeguard**: Trustees must test that c does not violate their intuition (e.g., run Step 3 with c=5,10,20).  

  ---

  ### **Example Proposals**
  Assume c=10 and $6M budget. Staff anchors:  
  - **Worst-off anchor**: Malnourished children in Country X (W=0).  
  - **Best-off anchor**: Urban clinic patients (W=100).  

  #### **Proposal 1: Help Worst Off (No Harm)**  
  - **Details**: Sanitation for 500 landless farmers (W=10). Δ=+6 (Low Uncertainty).  
  - **Score**: `500 × 6 × (1/(10+10)) = 500 × 6 × (1/20) = 150`.  
  - **Result**: **Funded** (high positive score).  

  #### **Proposal 2: Level Down (Harm Best Off)**  
  - **Details**: Cancel scholarships for 200 university students (W=90). Δ=–4 (no other effects).  
  - **Score**: `200 × (–4) × (1/(90+10)) = 200 × (–4) × (1/100) = –8`.  
  - **Result**: **Rejected** (negative score).  
  - **Script for your friend**:  
    > "This proposal lowers the wellbeing of students without helping anyone else. Our procedure assigns it a negative score because *harming people to narrow the gap doesn’t improve overall wellbeing*. We only fund proposals that create net positive impact."  

  #### **Proposal 3: Your Program vs. Rival**  
  - **Your program**: Vocational training for 400 factory workers.  
    - Domestic measure: Workers are poor (W=30).  
    - But rival’s group is worse off globally.  
    - Δ=+12 (Medium Uncertainty).  
  - **Rival program**: Clean water for 300 malnourished children (W=0). Δ=+5 (Low Uncertainty).  
  - **Comparison**:  
    - **Your score**: `400 × 12 × (1/(30+10)) × 67% = 400 × 12 × 0.025 × 0.67 ≈ 80.4`.  
    - **Rival score**: `300 × 5 × (1/(0+10)) × 100% = 300 × 5 × 0.1 = 150`.  
  - **Result**: **Rival funded** (higher score).  
  - **Why?** Despite your group’s higher Δ, rival’s W=0 group gets 3× the weight (1/10 vs. 1/40), and uncertainty penalizes you.  

  ---

  ### **Where the Procedure Misfires**
  1. **Over-simplification**:  
     - Collapsing wellbeing to 0–100 ignores qualitative differences (e.g., health vs. education gains).  
     - **Mitigation**: Trustees must debate W/Δ rigorously in Steps 1–2.  

  2. **Edge cases**:  
     - Proposals with mixed positive/negative effects (e.g., help group A, harm group B) may net positive but feel unethical.  
     - **Solution**: Step 6 allows override for mission misalignment.  

  3. **Uncertainty bias**:  
     - Reducing scores by 33–67% is arbitrary. May penalize innovative programs.  
     - **Mitigation**: Flag High Uncertainty proposals for expert review post-meeting.  

  4. **Cannot resolve**:  
     - Deep value conflicts (e.g., "Is health more important than income?").  
     - Long-term impacts (beyond immediate Δ).  
     - Setting c—trustees must own this choice.  

  ### **Decisions Left to Trustees**
  - **Before meetings**: Set/revise **c** and **uncertainty factors**.  
  - **During meetings**:  
    - Assign **W** and **Δ** (Steps 1–2).  
    - Override rankings for mission fit (Step 6).  
  - **Always**: Interpret "wellbeing" for the foundation.  

  ---  
  This procedure embeds your priority view, rejects leveling down by design, and runs in one afternoon. Test it with past proposals to refine c and uncertainty rules.
