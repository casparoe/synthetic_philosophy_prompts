  - We recommend that the trustees set c by considering a hypothetical: 
      "How much of a gain to a person at the best-off level (W=100) would be required to be as socially valuable as a gain of 10 units to a person at the worst-off level (W=0)?"
      Let the answer be X. Then we have:
          (Gain at W=0) * weight(W=0) = (Gain at W=100) * weight(W=100)
          10 * (1/(0+c)) = X * (1/(100+c))
          10/c = X/(100+c)
          => X = 10 * (100+c) / c

      For example, if they think that a gain of 10 for the worst off is worth the same as a gain of 1000 for the best off, then:
