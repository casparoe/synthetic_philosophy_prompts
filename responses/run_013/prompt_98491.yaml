  We are designing a decision procedure for a grant allocation committee that must run in an afternoon by four untrained people. The procedure must implement the priority view (which gives more weight to gains for the worse off) and reject pure leveling down (which would fund a project that hurts the best-off without helping anyone). 

  Key features:
  - Reject pure leveling down as a consequence of the aggregation rule.
  - Avoid smuggling in a sufficiency threshold (though we may need to address if a threshold becomes necessary).
  - Confront the issue of a common cardinal measure of wellbeing and interpersonal comparisons.
  - Name a free parameter (the weight given to the worse off) and explain how to set it and what goes wrong if set too high.
  - Runnable with simple arithmetic.

  The procedure will be built around a scoring system for proposals. Each proposal is evaluated by:
  1. Identifying the beneficiary groups (and their wellbeing levels) that the grant will affect.
  2. Estimating the change in wellbeing for each group due to the grant.
  3. Applying a weighting that gives more value to gains for groups that are worse off.

  We must address:
  - How to handle uncertainty about what would have happened without the grant (counterfactuals).
  - How to handle different program areas without a common metric? We will have to use a relative scale (percentages) and rely on committee judgment.

  The procedure:

  **Step 0: Preparation (before the meeting)**
  - The foundation staff (or proposers) must provide, for each proposal:
    a. A description of the primary beneficiary groups (BGs) and the number of people in each.
    b. For each BG, the current level of wellbeing (without the grant) on a scale from 0 to 100, where:
        0 = the worst-off group that the foundation could possibly reach (across all proposals in any round) in the current round.
        100 = the best-off group that the foundation could possibly reach in the current round.
        Note: This scaling is done relative to the current round's proposals. The committee will have to assign these numbers in a calibration step (Step 1 below).
    c. For each BG, the expected change in wellbeing due to the grant (as a percentage of the current level? or in absolute points? We need a common unit). Since we are using a 0-100 scale, the change will be in points on that scale. But note: the scale is relative to the current round, so it is a relative index.

  However, we cannot have an absolute common metric. Instead, we will use a relative scale and rely on the committee to assign the 0 and 100 by comparing the beneficiary groups across all proposals in the round.

  **Step 1: Calibration (at the meeting)**
  - The committee reviews all proposals and identifies:
    - The worst-off beneficiary group (across all proposals) that the foundation can reach in this round. Assign this group a wellbeing level of 0.
    - The best-off beneficiary group (across all proposals) that the foundation can reach in this round. Assign this group a wellbeing level of 100.
  - For every other beneficiary group in every proposal, the committee assigns a wellbeing level between 0 and 100 by comparing with the two anchors. This is a judgment call, but the committee must do it for consistency.

  **Step 2: Estimate Changes (for each proposal)**
  - For each beneficiary group in a proposal, the committee must estimate the change in wellbeing (Δ) that the grant will cause. This change is in the same units (0-100 scale). 
    - Note: The change is the difference between the wellbeing with the grant and without. Without the grant, the group is at the level assigned in Step 1. With the grant, the group moves to a new level (which must be estimated).
    - Example: A group currently at 40 might move to 45, so Δ = +5.
  - The committee must also consider the number of people in the group. We will calculate a weighted score.

  **Step 3: Weighting and Scoring**
  - We use a priority weighting function. The weight given to a change in wellbeing for a group at level W (on the 0-100 scale) is: 
      weight = 1 / (W + c)
    where c is a positive constant (the free parameter) chosen by the trustees. 
    Why this form? 
      - It gives higher weight to lower W (worse off).
      - When W is 0 (worst off), the weight is 1/c.
      - When W is 100, the weight is 1/(100+c).
      - The parameter c controls how steep the priority is. A small c means very steep (high weight for the worst off). A large c means flatter (less priority).

  - The score for a proposal is the sum over all beneficiary groups of:
        (number of people in group) * (Δ in wellbeing) * (weight for that group's initial wellbeing)

    That is: 
        Score = Σ [ N_i * Δ_i * (1/(W_i + c)) ]

  - Note: If a group is made worse off (Δ_i negative), then that term is negative. This is critical because it will cause a proposal that harms someone (without helping anyone) to have a negative score.

