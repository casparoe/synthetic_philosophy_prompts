prompt: |-
  Alright, I could use help thinking this through properly. About three months ago I ended up running a small mutual-aid group in my city — street outreach, handing out naloxone, a free grocery table, that sort of thing — because the woman who started it basically worked herself into the ground and had to step back. She's one of those people who never says no to anything: gave away most of her savings to the group, was on every shift, took in people who needed a couch. Everyone here still talks about her like a saint, and honestly two of the newer volunteers are heading the same way, and I'm the one who now has to decide what to ask people to do. I keep going back and forth in my head between "of course we should ask, people want to help, the need is real" and "wait, am I just farming other people's guilt and wrecking them the way she got wrecked?"

  What I want from you is a procedure I can actually run — a checklist, or a flowchart written out in words — for deciding how much to ask of a volunteer, or of myself, on a given thing. Not a vibe, an actual ordered set of questions: what to ask first, what counts as a good enough answer, where the procedure just stops and says no, and where it has to hand the decision off to a person because the question is really about values and not about facts. And I want it grounded in the actual philosophy here, not folk wisdom — the stuff about supererogation, doing more than duty requires, and the whole moral-saints debate (Susan Wolf's essay is the one I keep half-remembering) — the argument that being maximally morally good might not even be a good thing to aim at. I think that's the heart of my problem: is a saint actually what I want my volunteers to become, or is sainthood the failure mode I'm supposed to be preventing?

  Before you write the procedure, please brainstorm out loud the hard cases it has to survive, because I've already hit some and they're where the simple versions fall apart: asking someone to skip paid work for a shift; asking someone to take on personal legal or health risk (we sometimes get into it with police, and we deal with people who are actively using); asking for money from people who don't have much; asking the same reliable person over and over because they always say yes; and the trap where you know someone will say yes no matter what, so you quietly stop asking and start telling.

  Then run it on two or three concrete cases and show me the output, including at least one where the procedure gives me an answer I won't like — I'd definately rather find out now. Please make sure you cover these two: (a) a volunteer who's a nursing student and I want her to cover a night shift the day before an exam, and (b) whether I should ask our most reliable volunteer to put his own name on the lease for a storage unit we use, which exposes him personally if anything goes wrong. And be explicit about what the procedure can't do — where it'll misfire, and which steps are just judgment calls dressed up as rules.

  Write it for me, not for a philosophy seminar — I don't have a background in this and I'll be reading it on my phone between shifts. Don't give me a reading list or citations, I can't check them and won't. You can take the role of a philosopher who works on moral demandingness and the ethics of asking, but keep the language plain.

  One last thing: tell me how confident you actually are in the procedure you hand me, and point to the single step you're least sure about — the one you'd bet against if you had to.
reasoning: |-
  Okay, let me unpack this carefully. The user runs a mutual-aid group and is wrestling with how much to ask of volunteers without burning them out, especially given their predecessor's breakdown. The core tension is between meeting real needs and exploiting goodwill, framed through philosophical concepts like supererogation and Wolf's moral saints critique. 

  First, the hard cases they mentioned are crucial stress tests: 
  - Asking someone to skip paid work risks their livelihood 
  - Legal/health exposure could have long-term consequences 
  - Financial requests from cash-strapped volunteers create compound vulnerability 
  - Over-reliance on "yes-people" normalizes exploitation 
  - The shift from asking to presuming is a slippery slope 

  The nursing student example is particularly thorny—it pits immediate crisis response against the student's future capacity to help. The storage lease question tests institutional risk vs. individual sacrifice. Both reveal how good intentions can mask moral hazards. 

  For the procedure itself, I'm leaning toward a tiered filter system: 
  1. Start with non-negotiable boundaries (safety, legality) 
  2. Then assess proportionality (cost/benefit, alternatives) 
  3. Finally examine relational dynamics (patterns, power) 

  Key philosophical anchors: 
  - Wolf's warning against maximal moralism as pathological 
  - Distinguishing duty (what we owe) from supererogation (what's admirable but not obligatory) 
  - The idea that sustainable aid requires preserving the helper's humanity 

  The trickiest step will be "Pattern Check"—it requires tracking behavioral history without micromanaging. I'm least confident here because it relies on subjective interpretation of "reliability as vulnerability." Might need to flag that as the weak point. 

  For the nursing student case, the procedure should block the request: the academic risk is disproportionate, alternatives exist, and enabling heroic sacrifice undermines long-term capacity. For the lease, it's murkier—if no safer option exists and the volunteer fully grasps the risk, it might pass but only with explicit consent rituals. 

  Biggest limitation: The procedure can't replace cultural change. If the group glorifies martyrdom, these checks will feel like bureaucratic obstacles. That's why the "values handoff" step is vital—it forces confronting the saint-worship trap head-on.
answer: |-
  Here's a decision procedure grounded in anti-heroic ethics, designed for real-world use. It's built on the **Principle of Sustainable Solidarity**: *Asking should preserve the asker's humanity, the volunteer's agency, and the group's longevity.* Based on Susan Wolf's critique of "moral saints" (where maximal goodness drains personal identity) and supererogation theory (actions beyond duty aren't obligatory).

  ---

  ### **The ASK Protocol: 4 Filters with Hard Stops**
  Run every request (to others or yourself) through these filters **in order**. Stop if any filter fails.

  1.  **SAFETY SCREEN (Physical/Legal/Basic Needs)**
      *   *Question:* Could this realistically risk **serious bodily harm, legal liability, homelessness, or starvation** for the volunteer?
      *   *Red Flags:* Exposure to violence without training; financial loss threatening rent/food; significant health neglect (e.g., skipping critical meds).
      *   **HARD STOP:** **DO NOT ASK** if "yes". *Example: Asking someone with an immune condition to handle used needles without proper PPE.*
      *   *Values Handoff:* If risk is inherent but mitigable (e.g., police interactions), this becomes a *group policy* discussion about acceptable risk levels.

  2.  **PROPORTIONALITY TEST (Cost vs. Capacity)**
      *   *Question:* Does the **cost to the volunteer** (time, money, energy, opportunity) grossly outweigh **both** (a) the concrete benefit of *this specific ask*, **and** (b) *their* capacity to absorb that cost *without erosion*?
      *   *Red Flags:* Skipping paid work when rent is tight; asking for money from someone budgeting meal-to-meal; demanding high-focus tasks during known crisis periods (grief, exams).
      *   **HARD STOP:** **DO NOT ASK** if "yes". *Example: Asking a single parent to miss a week's wages for a routine shift when rent is due.*
      *   *Good Enough Answer:* "This 4-hour shift provides 50 meals. The volunteer has stable income, childcare, and slept well last night."

  3.  **ALTERNATIVES CHECK (Necessity & Shared Burden)**
      *   *Question:* **A.** Is this task *truly necessary right now*? **B.** Have we exhausted *reasonable alternatives* (other volunteers, scaling back, external resources)? **C.** Is this burden *distributed* fairly over time/people?
      *   *Red Flags:* Asking the same person repeatedly; no rotation system; task could wait 24hrs; not seeking donated space before asking for cash.
      *   **HARD STOP:** **DO NOT ASK** if **A=no** OR **B=no**. If **C=no**, proceed *only* with extreme transparency: *"You're my 4th ask because others couldn't. It's unfair to lean on you. Can you? (No is 100% okay)."*
      *   *Values Handoff:* Defining "reasonable alternatives" requires group consensus (e.g., is renting storage vs. finding donated space "reasonable"?).

  4.  **PATTERN GUARD (Against Sainthood Drift)**
      *   *Question:* If this ask is accepted, does it **continue or accelerate a pattern** where this volunteer (or you) consistently sacrifices: **a)** Core identity (hobbies, relationships), **b)** Sustainable health (rest, healthcare), or **c)** Moral autonomy (feeling unable to say no)?
      *   *Red Flags:* Volunteer mentions neglecting studies/relationships; you feel uneasy *because* they always say yes; tasks increasingly invade personal life.
      *   **HARD STOP:** **DO NOT ASK** if "yes" + it's non-emergent. If truly emergent (e.g., immediate overdose response), ask **with explicit release valve**: *"This is urgent. But if this adds to burnout, I need you to say no. We'll find another way."*
      *   *Values Handoff:* Recognizing "core identity erosion" is subjective. Build group culture where volunteers share non-aid activities.

  ---

  ### **Procedure Output on Your Cases**
  **Case A: Ask nursing student for night shift before exam.**
  1.  **Safety Screen:** No *direct* physical/legal risk. **Proceed.**
  2.  **Proportionality:** *Cost:* High (exam failure → delayed graduation, debt). *Benefit:* Standard shift coverage. *Capacity:* Exam stress degrades capacity. **>>> COST GROSSLY OUTWEIGHS BENEFIT/CAPACITY. HARD STOP. DO NOT ASK.** *Alternative:* Emergency backup list, split shift.
  3.  *Output:* **No ask.** Explain: "Protecting your future capacity to help is vital."

  **Case B: Ask reliable volunteer to sign storage unit lease.**
  1.  **Safety Screen:** **YES.** Personal legal/financial liability (eviction, lawsuits if unit is misused/damaged). **>>> HARD STOP. DO NOT ASK.** *Mitigation irrelevant – risk is fundamental to signing.*
  2.  *Output:* **No ask.** Solve institutionally: Nonprofit status? Sponsor organization? Donated space? Risk-acceptance pool? *Never* individualize systemic risk.

  **Case C (Your Prediction): Ask exhausted volunteer *again* because they always say yes.**
  1.  **Safety/Proportionality:** Maybe pass if task is low-cost.
  2.  **Alternatives Check:** Likely **B=no** (others not asked?)/**C=no** (burden not shared). **HARD STOP if B/C fail.**
  3.  **Pattern Guard:** **YES.** Reinforces "saint" pattern, erodes autonomy. **HARD STOP even if others pass.**
  4.  *Output:* **Do not ask.** Say: *"I noticed I ask you a lot because you're reliable. That's unfair. I'm checking with others first this time."*

  ---

  ### **Where This Can Misfire & My Confidence**
  **Confidence: 85%.** It prevents *clear* exploitation and protects against burnout-by-default. The philosophy is sound: **Sainthood is a systemic failure, not a goal.** Sustainable aid requires rejecting toxic sacrifice culture.

  **Weakest Step: Pattern Guard (65% confidence).** Why?
  -   **Hidden Patterns:** You might miss erosion signs if volunteers hide strain ("I'm fine!").
  -   **Subjectivity:** "Core identity" is fuzzy. Does skipping one movie night matter? Probably not. Skipping all for months? Yes.
  -   **My Bias:** I prioritize preventing exploitation over maximizing short-term help. In true crises (natural disasters), this might *over*-restrict.

  **Key Limitations:**
  1.  **"Values Handoffs" are critical:** The procedure flags *where* to discuss values (e.g., "How much legal risk *should* we take?"), but *can't* resolve them. That needs your group.
  2.  **Requires Honesty:** You need truthful answers about volunteer capacity/alternatives. Bad data in = bad decisions out.
  3.  **Can't Fix Martyr Culture:** If your group *worships* self-sacrifice, this feels cold. Use the protocol to *start* that cultural shift: "We protect our people so we can keep helping."
  4.  **Emergency Override:** In *true* life-or-death moments (e.g., immediate overdose response with no one else), scream "I NEED HELP NOW!" – ethics shifts when seconds matter. Document and debrief later.

  **How to Use:**  
  Print the 4 filters. For *every* ask (even small ones), run it mentally in <60 seconds. For high-stakes asks, write it down. When in doubt, **Filter 2 (Proportionality)** is your strongest shield. Say it aloud: *"Does this cost them more than it helps anyone?"* If yes, stop.

  This isn't about doing less. It's about doing *enough* without destroying the people who do it. Your job isn't to create saints – it's to prevent them.
