prompt: |-
  I am a high school student working on a paper for my school's philosophy club, and for the past few weeks I have been reading about the epistemology of conspiracy theories — the subfield that asks whether a belief in a conspiracy is, by its very nature, irrational, or whether such beliefs should instead be evaluated one at a time, like any other explanatory hypothesis. My club advisor pointed me toward a long video essay by a commentator who is generally well regarded but has a reputation for compressing complicated positions into tidy slogans, and I have transcribed the summary he gives in the middle of the video, because it is the part I would most like to cite. Before I do, I want to know how much of it I can trust, since I do not yet know the literature well enough to tell which of his sentences are careful statements of the actual positions and which are his own simplifications. Here is his summary, as faithfully as I could take it down:

  "Philosophers who study conspiracy theories have sorted themselves into two camps. The particularists — the names to know are Keeley and Cassam — hold that a conspiracy theory is simply a theory about a conspiracy, and since some conspiracies have turned out to be real, they say we should treat conspiracy theories as rational by default and refuse to single them out for special suspicion. The generalists — Pigden, Coady, and Dentith — take the opposite line: because conspiracy theories are unfalsifiable and self-sealing, they are all irrational, and the phrase 'conspiracy theory' is really just a slur that we use to dismiss ideas we happen to dislike. So the whole debate comes down to whether you trust official stories, and because the philosophers cannot agree among themselves, there is no fact of the matter about whether any particular conspiracy theory is justified."

  What I need is not a corrected survey of the whole field but a careful audit of his summary, sentence by sentence. For each distinct claim he makes, tell me whether a philosopher working on this topic would accept it as stated, would accept it only as a loose simplification, would regard it as a misrepresentation of a position its defenders actually hold, or would call it plainly wrong; and where he is wrong, tell me what the accurate version of the claim would be. I am especially concerned about errors that quietly invert a position — the commentator attaching a view to the wrong camp, or reading a definitional point as though it were a normative one — because those are the ones I would be most embarrassed to repeat in my paper. I am also inclined to believe his closing sentence, since it sounds suitably humble, so please tell me whether it follows from the accurate parts of his summary or falls apart once the mistakes are corrected.

  Please give me the audit as a table with the following four columns, one row for each distinct claim: "Claim" (the summary's claim, condensed to a few words), "Verdict" (exactly one of: Accurate, Simplification, Misrepresentation, Wrong), "Correction" (what is actually the case, in one or two sentences), and "Downstream" (whether the summary's final conclusion depends on this claim). After the table, add a short closing paragraph giving your overall judgment of whether the summary is fair to the field.
reasoning: |-
  Okay, let me approach this systematically. The user is a high school philosophy student who needs help auditing a commentator's summary of conspiracy theory epistemology. They're concerned about potential misrepresentations and want a detailed breakdown to avoid embarrassment in their paper. 

  First, I need to parse the commentator's summary into distinct claims. The key divisions seem to be:
  - The two-camp categorization
  - Particularists' position (Keeley/Cassam)
  - Generalists' position (Pigden/Coady/Dentith)
  - The debate's core as "trust in official stories"
  - The "no fact of the matter" conclusion

  For each claim, I'll evaluate against academic consensus. The user specifically fears inverted positions or definition/normative confusion, so I'll watch for:
  - Whether Cassam really holds the view attributed to him
  - If "unfalsifiable" applies to all generalists
  - The accuracy of "irrational by default" phrasing
  - If "slur" characterization is oversimplified

  The user also wants to know if the humble-sounding conclusion holds up after corrections. That requires checking if the debate genuinely reduces to trust in authorities or remains unsettled philosophically.

  I recall Keeley actually argues conspiracy theories exhibit characteristic epistemic vices - opposite of what's attributed to him. Cassam focuses on conspiratorial thinking's psychology, not blanket rationality. Meanwhile, Dentith explicitly rejects the "all irrational" view attributed to generalists. These are critical inversions.

  For the conclusion: the "trust in official stories" framing ignores epistemic criteria beyond authority, and the "no fact" claim is wrong - philosophers do provide evaluation frameworks even amidst disagreement. That final point collapses when the premises are corrected.

  The table format will serve the user's needs best, but I'll add an overall fairness assessment: the summary misassigns core positions and oversimplifies definitions, making it unreliable despite getting some names right.
answer: |-
  Here is a meticulous audit of the commentator's summary, presented as requested:

  | Claim                                                                 | Verdict         | Correction                                                                                                                              | Downstream |
  | :-------------------------------------------------------------------- | :-------------- | :--------------------------------------------------------------------------------------------------------------------------------------- | :--------- |
  | Philosophers sorted into two camps: Particularists & Generalists.     | Simplification  | While often framed as a debate, the field is more nuanced. Some philosophers don't fit neatly, and positions exhibit significant internal variation. | No         |
  | Particularists = Keeley & Cassam.                                     | Misrepresentation | **Keeley** is a prominent *generalist* (argues CTs are typically irrational). **Cassam** is a particularist, but focuses on *conspiracist ideation* (a mindset), not defending CTs per se. | **Yes**    |
  | Particularists define CT as "simply a theory about a conspiracy".     | Misrepresentation | Particularists (like Pigden, Dentith) *do* define CTs neutrally as explanations citing conspiracies. But **Keeley** (a generalist) offers a pejorative definition focused on epistemic defects. | **Yes**    |
  | Particularists: "treat conspiracy theories as rational by default".   | Wrong           | Particularists argue CTs should be evaluated *on their evidence*, like any hypothesis. They **reject** *presumptive irrationality*, **not** claim *presumptive rationality*. | **Yes**    |
  | Particularists: "refuse to single them out for special suspicion".    | Accurate        | Particularists oppose dismissing CTs *a priori* simply because they posit a conspiracy; evaluation must be case-by-case.                  | No         |
  | Generalists = Pigden, Coady, & Dentith.                               | Mostly Accurate | Pigden & Coady are key generalists. **Dentith is primarily a *particularist*** who critiques generalism, though engages with their arguments. | **Yes**    |
  | Generalists: "all [CTs] are irrational".                              | Wrong           | Generalists (like Keeley) argue CTs are *typically* or *characteristically* irrational/epistemically defective, **not** that *every single one* is irrational. | **Yes**    |
  | Generalists: CTs are "unfalsifiable and self-sealing".                | Simplification  | **Keeley** argues CTs *often* exhibit these traits, making them *poor* explanations. **Pigden/Coady** focus more on their inherent *epistemic irresponsibility* or *unlikelihood* vs. official stories. | **Yes**    |
  | Generalists: "'conspiracy theory' is just a slur to dismiss ideas."   | Misrepresentation | Some generalists (e.g., Coady) *acknowledge* the term is often used pejoratively. **But their core argument is that CTs *warrant* criticism due to epistemic flaws, not that the label is *merely* dismissive.** | No         |
  | The debate "comes down to whether you trust official stories".        | Misrepresentation | The debate centers on the *epistemic status* of CTs themselves (evidence, reasoning, explanatory power). Trust in official stories is *a factor* for some (e.g., Pigden), but not the defining issue. Evaluation involves many criteria. | **Yes**    |
  | "Philosophers cannot agree among themselves".                         | Accurate        | Significant disagreement persists on definitions, evaluative criteria, and the scope of rationality/irrationality.                       | **Yes**    |
  | "There is no fact of the matter about whether any particular CT is justified." | Wrong           | **Philosophers largely agree there *are* facts of the matter** – evaluations depend on evidence, logic, explanatory virtues, etc. The *disagreement* is about *how* to apply these standards to CTs and whether they deserve *a priori* suspicion. | **Yes**    |

  **Overall Judgment:** The summary is **fundamentally unfair and unreliable** for your paper. While it gets a few names right and captures the *existence* of a debate, it commits critical errors that invert core positions (especially misassigning Keeley and Dentith, and flipping the particularist stance from "not presumptively irrational" to "presumptively rational"). The definitions attributed to each camp are often swapped or oversimplified beyond recognition. Most damningly, the concluding claim – that there's "no fact of the matter" – directly contradicts the shared goal of the field: to establish rational criteria for evaluating conspiracy theories. This conclusion only appears plausible because the preceding misrepresentations make the debate seem like an unresolvable clash of biases ("trust official stories" vs. not), rather than a substantive disagreement about evidence and epistemology. **Do not cite this summary as an accurate representation of the philosophical debate.** Instead, use it as an example of the very kind of problematic simplification your paper should avoid. Focus on primary sources or reputable academic surveys.
