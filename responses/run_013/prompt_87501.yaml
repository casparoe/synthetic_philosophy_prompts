  - Use index cards (or paper) for each problem. Each problem has two panels: left and right. Each panel has 3-6 simple figures (shapes). The rule separates the left from the right.
  - For the training phase, the rules should be simple and unambiguous (to build confidence). Examples:
    - Left: all triangles. Right: all circles.
    - Left: all blue shapes. Right: all red shapes.
    - Left: shapes with straight edges. Right: shapes with curved edges.
