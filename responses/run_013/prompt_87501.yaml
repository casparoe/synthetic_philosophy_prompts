  4. Design Round: Participants Create Their Own Ambiguous Problems (25 minutes)
  5. Debrief (10 minutes)

  Total: 75 minutes

  Materials:
  - A set of pre-drawn Bongard-style problem cards (for the training phase and the ambiguous problem). We can use simple geometric shapes drawn on index cards or printed on paper. For the training phase, we need 3-4 solved problems. For the ambiguous problem, one problem with two panels (left and right) and a test card.
  - Blank index cards and markers for the design round.
  - A way to display the cards (if in person: lay them on a table, or use a document camera; if virtual: use a shared whiteboard or slides).

