   Given the time, I will provide the following for the activity, and assume it works as intended in the mind of the designer.

   For the activity, we will have:

   Training phase: 3 unambiguous problems.

   Then, the ambiguous problem: 

     Left panel (6 figures) - but to keep it simple, 3 figures.
     Right panel (3 figures).

   But I found a solution with 3 figures per panel using simple shapes and a property that can be interpreted in two ways: the number of objects.

   Example:

   Left panel:
     - One circle
     - One square
     - One triangle

   Right panel:
     - Two circles
     - Two squares
     - Two triangles

   Rule1: Left has exactly one object.
   Rule2: Left has objects that are not circles ( wait, but left has a circle).

   So Rule2 won't work.

   Rule2: Left has object(s) that are not multiple? That's Rule1.

   So not two rules.

   Finally, I decide to use the following for the ambiguous problem:

   Left panel:
     - A single circle
     - A single heart
     - A single star

   Right panel:
     - A group of three circles
     - A group of three hearts
     - A group of three stars

   Then the rules might be:

   Rule1: Left has exactly one object.
   Rule2: Left has objects that are not in a group of three.

   For a test card, use: two circles.
     Rule1: not one object -> right.
     Rule2: not in a group of three -> left.

   This works! So two rules:
     Rule1: Left if and only if there is exactly one object.
     Rule2: Left if and only if the object is alone (not in a group of three).

   But note that the training data for Rule2: 
     Left: alone -> left.
     Right: in a group of three -> right.
     Test: two objects -> not alone and not in a group of three -> Rule2: not in a group of three -> left.

   So disagreement.

   Therefore, we have:

   Ambiguous problem:

     Left panel: one circle, one heart, one star.
     Right panel: three circles, three hearts, three stars.

   Two rules that fit the training data:
     Rule1: The number of objects is one (left) versus not one (right).
     Rule2: The object(s) are in a group of one (left) versus in a group of three (right).

   Test card: two identical stars (or any shape, say two circles).

     Rule1: number is two (not one) -> right.
     Rule2: the group is of size two, which is not one and not three -> but Rule2 only defined for one or three. So if we take Rule2 as " group size is one for left, group size is three for right", then a group of two is neither, so it could be left or right. But we want Rule2 to be: left if group size is one, right if group size is three. Then a group of two is not in the training data.

   So to make Rule2 commit to left for two, we must have Rule2 be: left if the group size is not three.

   Then:

     Rule2: left if not in a group of three.
     training: 
          left: not in group of three -> left.
          right: in group of three -> right.
     test: two -> not in group of three -> left.

   So Rule1: two is not one -> right.
   Rule2: not in group of three -> left.

   They disagree.

   So the materials for the ambiguous problem are:
     - Left panel: three cards, each with a single symbol (e.g., a circle, a heart, a star).
     - Right panel: three cards, each with three of the same symbol (e.g., three circles, three hearts, three stars).
     - Test card: a card with two stars.

  Participants will see the training card (left and right panels) and then be shown the test card and asked to commit to left or right.

  Materials list:
  - For training phase: 3-4 solved Bongard problems, each on a separate card or displayed in a slide. Each problem has a left and right panel with 3-6 figures. Examples:
    1. Problem 1: 
          Left: three triangles
          Right: three circles
       Rule: left has triangles, right has circles.
    2. Problem 2:
          Left: filled shapes
          Right: outline shapes
    3. Problem 3:
          Left: shapes with straight edges only
          Right: shapes with at least one curved edge.
  - For the ambiguous problem: 
          A card with left panel: one circle, one heart, one star.
          A card with right panel: three circles, three hearts, three stars.
          A test card: two stars.
  - For the design round: blank index cards and markers for each group.

  Timing and Instructions:

  1. Introduction (5 minutes):
     - "Welcome! In this session, we are going to play a game of pattern recognition. I will show you a series of cards, each divided into two panels: left and right. Each panel contains a few simple figures. For each card, there is a hidden rule that separates the left panel from the right. Your job is to guess the rule."
     - "We'll start with a few practice rounds to get the hang of it, and then we'll move to a more challenging one."
     - "There are no prerequisites, and you don't need any special knowledge. Just your ability to spot patterns."
     - "Let's begin."

  2. Training Phase (15 minutes):
     - Show the first problem. Allow 2-3 minutes for them to guess the rule. Ask for guesses and then reveal the rule. Do this for 3 problems.
     - Example: "For this card, the rule is: left has triangles, right has circles."
     - Keep it light and fun. The goal is to build confidence and understanding of the game.

  3. The Ambiguous Problem (20 minutes):
     - Show the ambiguous problem card (left: single symbols; right: groups of three).
     - Say: "Now, here's a new problem. Take a few minutes to write down what you think the rule is. Then, I will show you a test card, and you will have to commit to whether it belongs on the left or the right."
     - Give them 5 minutes to think and propose rules. Encourage them to write down their rule clearly.
     - Then, ask for rules. Expect two types:
          Rule1: based on the number being one (left) versus three (right).
          Rule2: based on not being in a group of three (left) versus being in a group of three (right).
     - If not both emerge, facilitator can seed them: "Someone might think it's about the number being one, but is there another way to see it?"
     - Then, show the test card (two stars) and ask for a commitment: "Write down 'left' or 'right' and your name. You can also write the rule you are using if you want."
     - Collect the commitments. Then, reveal that the test card is not resolved by the training data.
     - Say: "For those who said left, you might be using a rule like: not in a group of three. For right, you might be using: not one. Both are consistent with the training data. So which is it? I, as the designer, intended the rule to be about the number being one or not. So the test card with two should be on the right. But note, the rule 'not in a group of three' is also consistent, and it would say left. The data doesn't decide between these rules."

  4. Design Round (25 minutes):
     - Divide into groups of 3-4. Each group must create their own ambiguous Bongard problem.
     - Instructions: "Your goal is to create a card with a left and right panel, and a hidden rule, such that there are at least two completely different rules that fit the examples you provide. Then, you will also think of a test figure that will separate the two rules (i.e., one rule says left, the other says right)."
     - "You will then give your card to another group, and they will try to guess the rule. But importantly, they might come up with a different rule that fits. The test card will then reveal the ambiguity."
     - Provide blank index cards and markers. Each group should make:
          - One card for the left panel (with 3 figures)
          - One card for the right panel (3 figures)
          - A test card (1 figure)
     - Also, they should write down the two rules they have in mind and which one is the intended rule.
     - After 15 minutes of design, have groups swap problems. Give them 5 minutes to guess the rule and commit to the test card. Then, have the designers reveal the intended rule and discuss the alternate rule.

  5. Debrief (10 minutes):
     - "Let's reflect on what happened. In the ambiguous problem we did together, we saw that the same set of examples can be explained by two different rules. And these rules led to different predictions for the test case."
     - "When you designed your own problems, you had to intentionally create examples that could be read in two ways. You experienced that the data alone doesn't force the rule; the rule comes from the designer's mind."
     - Philosophical points:
          - Underdetermination: The data we have (examples) is always finite, and there are infinitely many rules that fit it perfectly.
          - Hypothesis space: We bring to the table a set of candidate rules (like "number is one" or "group size not three") and the data narrows it down, but not to one.
          - Prior expectations: We prefer rules that are simple or natural (e.g., we might think counting is more natural than a rule about 'not three' because it is more general?).
          - The test case: A rule that fits the training data can be arbitrarily bad on new data if it's not the intended one.
     - Connect to their experience: "When you were guessing, you brought your own hypothesis space. When you designed, you controlled the data to underdetermine the rule."

  Seams and potential problems:

  1. What might go wrong:
     - The group might not come up with two rules for the ambiguous problem. 
          Handling: Have a backup. The facilitator can introduce the two rules if needed.
     - The design round might stall because creating ambiguity is hard.
          Handling: Provide an example of how to create one (e.g., use the one/three example again, or use a new one: left has red shapes, right has blue, but then also have a rule about the shape being circle or not, and make a test card that is a red square -> which would be left by color, but if the alternate rule is about circles, then circles are not in the training data for left? so not). Instead, for the design round, suggest using the number of objects or a made-up property.
     - One participant might dominate.
          Handling: In the main activity, ask for written commitments and then cold-call. In design round, assign roles.
     - The group might think it's a trick.
          Handling: In the debrief, emphasize that it's not a trick but a fundamental property of induction.

  2. What the activity cannot reproduce:
     - It only shows two or a few rules, but the point is that there are infinitely many. We have to state that in the debrief.
     - It doesn't show that the preference for simplicity is innate, learned, or conventional. We can only show that in the activity, we tended to prefer certain rules. The debrief can ask: "Why did some of you choose the rule about the number being one and not the rule about 'not three'? Is one simpler?"

  Alternative staging: Instead of Bongard problems, use a game where the facilitator thinks of a rule for a sequence of numbers and the participants guess. For example, the rule is "numbers are even" and the facilitator says: 2,4,6 -> they guess even. But then an alternate rule is "numbers are even and less than 10", and then test with 12. But that's not visual. Given the group's background, the visual Bongard problem is more engaging and concrete.

  Final runnable plan:

  Materials:
    - For the training phase: 3 pre-drawn Bongard problems on index cards or slides. Examples:
          1. Left: three triangles; Right: three circles.
          2. Left: filled shapes (black inside); Right: outline shapes (only border).
          3. Left: shapes with only straight edges (triangle, square); Right: shapes with a curve (circle, ellipse).
    - For the ambiguous problem: 
          - Card 1 (left): three separate figures: one circle, one heart, one star (each alone on their part of the panel).
          - Card 2 (right): three figures: three circles together, three hearts together, three stars together.
          - Test card: two stars together.
    - For the design round: 
          - Blank index cards (enough for each group to have at least 3 for left, right, test) and markers.
          - Timer.

  Rules and scoring:
    - No scoring during training.
    - For the ambiguous problem: participants get a point if they use the intended rule (which for the facilitator is the rule about the number being one or not). But explain that the point is not about being right, but about the experience of underdetermination.

  Timeline:
    - 0-5 min: Introduction.
    - 5-20 min: Training phase (3 problems, 5 minutes each).
    - 20-40 min: Ambiguous problem (5 min to think, 5 min to propose rules, 5 min to commit and reveal, 5 min discussion).
    - 40-65 min: Design round (5 min instructions, 15 min design, 5 min swap and guess, 5 min reveal and group discussion).
    - 65-75 min: Debrief.

  Facilitator instructions:
    - Do not use terms like "underdetermination" until the debrief.
    - In the training phase, if they guess a rule that is not the intended one but fits, acknowledge it and then say what you intended.
    - In the ambiguous problem, do not tip your hand about the two rules. Let them emerge.
    - In the design round, circulate and help groups if they are stuck, by suggesting: "Can you think of a different property that also fits your examples?"

  Debrief outline:
    1. Start by asking: "How did it feel when you saw the test card and realized there were two possible answers?"
    2. "What this shows is that the examples alone don't tell you the rule. They are consistent with multiple rules."
    3. "When you designed your own, you experienced that you had to choose a rule and then make examples that could also be read in another way. This means that in learning from examples, the rule isn't in the data; it's in the mind of the teacher or learner."
    4. "In real-world concept learning, we bring prior expectations about what kinds of rules are 'natural'. In the activity, you might have preferred the rule about counting to one because it's simpler than 'not in a group of three'. But note that 'simplicity' is not defined by the data."
    5. "And finally, the scary part: a rule that fits all the examples you've seen so far can be completely wrong on the next example if it's not the intended rule. So induction is always a leap beyond the data."

  This should meet the requirements.
answer: |-
  Below is a complete, runnable 75-minute session plan centered on a Bongard-style induction game. The design ensures participants directly experience concept underdetermination through gameplay, followed by a design phase and debrief that solidifies the philosophical insights. I've refined your core mechanic to maximize clarity, engagement, and pedagogical impact while addressing potential pitfalls.

  ---

  ### **Session Overview**
  - **Core Idea**: Participants discover that finite examples underdetermine concepts by encountering ambiguous Bongard problems, proposing competing rules, and designing their own underdetermined problems.
  - **Key Moments**: 
    - Training with unambiguous problems builds confidence.
    - An ambiguous problem splits the group into two camps with conflicting predictions.
    - A design round forces participants to create problems where rules diverge.
    - Debrief links gameplay to underdetermination, priors, and induction risks.
  - **Why This Works**: The ambiguous problem creates a visceral "Aha!" moment, and the design round exposes the arbitrariness of intended rules. No prior knowledge is needed—all insights emerge from experience.

  ---

  ### **Materials List** (Keep it cheap and legible)
  1. **Pre-Drawn Bongard Cards** (For training and ambiguous problems):
     - **Training Problems (3 cards)**: 
       - Each card has **two panels (left/right)** with 3–4 simple figures per panel. Use thick markers on white index cards (5x7 inches). **No color needed**—rely on shapes, sizes, and binary features (filled/outline, with/without dots, orientation). Example rules:
         - *Card 1*: Left = triangles, Right = circles.
         - *Card 2*: Left = filled shapes, Right = outline shapes.
         - *Card 3*: Left = shapes with dots, Right = shapes without dots.
     - **Ambiguous Problem (1 card)**:
       - **Left Panel**: A small circle, a large triangle, a small triangle with a dot.
       - **Right Panel**: A large circle, a small circle with a dot, a large triangle with a dot.
       - **Test Card**: A large circle with a dot (hold this back until prediction).
     - **Why this works**: 
       - Two natural rules fit the data: 
         - *Rule A (Size)*: Left = small shapes, Right = large shapes.
         - *Rule B (Dots)*: Left = shapes without dots, Right = shapes with dots.
       - Test card discriminates: Rule A says **Right** (large), Rule B says **Left** (no dot? *but it has a dot!* Correction: Rule B says shapes *with* dots are right, so it predicts **Right** for the test card. To force disagreement, adjust: 
         - *Revised Test Card*: **Small circle with a dot**.
         - *Rule A (Size)*: Small → **Left**.
         - *Rule B (Dots)*: With dot → **Right**.
       - All figures are consistent with both rules during training.
     - **Production**: Hand-draw with markers. Use simple icons (circles, triangles, squares) and add dots/borders for features. Cost: ~$10 for index cards and markers.
  2. **Design Round Materials**:
     - Blank index cards and markers (1 set per group of 3–4).
     - Timer (for design phase).
  3. **Display Method**: Lay cards on a central table or use a document camera. Avoid projection—it reduces tactile engagement.

  ---

  ### **Timeline & Facilitator Instructions** (75 minutes total)
  **Goal**: Stay minimally directive. Let participants discover ambiguity through gameplay.  
  **Key mantra**: "I’m not answering questions—your group’s job is to convince each other."

  #### **Phase 1: Introduction (5 min)**
  - **What to say**:  
    > "Welcome! We’re playing a pattern-matching game. I’ll show cards with two panels—left and right. Your job is to find the hidden rule separating them. We’ll start simple, then ramp up. No prior knowledge needed—just your brains and teamwork. Rules: Propose rules, predict where a new figure belongs, and we’ll see who’s right. Ready?"  
  - **What not to say**: Don’t mention "Bongard," "induction," or "underdetermination." Avoid examples.

  #### **Phase 2: Training (15 min)**
  - **Activity**: Show 3 unambiguous cards (one at a time). For each:  
    1. Display the card. Give groups 2 min to brainstorm rules.  
    2. Ask: "What’s the rule?" Cold-call groups. Reveal the answer.  
    3. **Example reveal**: "For Card 1, left has triangles; right has circles."  
  - **Why**: Builds confidence and models the game.  
  - **Timing**: 5 min per card (15 min total).  
  - **Facilitator tips**:  
    - If groups propose valid but unintended rules (e.g., "Left has pointy shapes" for triangles), say: "That fits, but I used a simpler rule: left has triangles."  
    - Keep it light—use phrases like "Nice try!" to reinforce low stakes.

  #### **Phase 3: Ambiguous Problem (20 min)**
  - **Goal**: Split the group into two camps with conflicting predictions.  
  - **Activity**:  
    1. **Display the ambiguous card**: "Find the rule. You’ll commit to a prediction." (5 min for brainstorming).  
    2. **Elicit rules**: Ask groups to share. *Seeded questions if needed*:  
       - "Did anyone see a rule about size? What about dots?"  
       - Write rules on a board: "Rule A: Left = small shapes. Rule B: Left = shapes without dots."  
    3. **Commitment**:  
       - "Take 30 seconds. Write your name and ‘Left’ or ‘Right’ for the test card. Rule A people predict Left; Rule B predict Right."  
       - Add stakes: "Most points if your rule wins. Bragging rights if you’re right!" (No physical prizes—peer pressure suffices).  
    4. **Reveal the test card (small circle with a dot)**:  
       - "Rule A says Left (small). Rule B says Right (with dot). But the answer is… neither. Both fit all prior data. *I* intended Rule A, but Rule B is just as valid."  
  - **Timing**: 5 min (brainstorm) + 5 min (rules/commit) + 5 min (reveal) + 5 min (discussion).  
  - **Facilitator tips**:  
    - If no one proposes both rules, seed them: "One group thought size; another thought dots. Who agrees?"  
    - During reveal, emphasize: "This isn’t a trick—it’s a feature of the game. Data alone couldn’t decide."

  #### **Phase 4: Design Round (25 min)**
  - **Goal**: Participants create problems where two rules fit the data but disagree on a test case.  
  - **Activity**:  
    1. **Split into groups of 3–4** (4 groups for 14 people). Give materials.  
    2. **Instructions (5 min)**:  
       > "Design a Bongard card where two different rules fit the left/right panels. Then, make a test figure where the rules disagree. Write down your two rules and which one you intended."  
    3. **Design (10 min)**:  
       - Circulate and prompt: "What two properties could both fit? How will the test card split them?"  
       - **Example**: Left = red shapes; Right = circles. Test = red circle → Rule A says Left, Rule B says Right.  
    4. **Swap and Test (10 min)**:  
       - Groups swap problems. Receivers guess the rule and commit to a test prediction.  
       - Designers reveal the intended rule and discuss mismatches.  
  - **Facilitator tips**:  
    - **Stall prevention**: Give a template: "Use size vs. borders, or color vs. dots."  
    - If a group struggles, suggest: "Make left = small shapes AND no dots; right = large OR dotted. Test = small shape with a dot."

  #### **Phase 5: Debrief (10 min)**
  - **Goal**: Name what they experienced—no lectures.  
  - **Structure**:  
    1. **Start with feelings**: "Raise your hand if you felt frustrated when the test card didn’t resolve anything. What about when designing?"  
    2. **Map gameplay to concepts**:  
       - *Underdetermination*: "In the ambiguous problem, two rules fit all examples. When designing, you had to *choose* a rule—the data didn’t force it."  
       - *Priors/hypothesis space*: "Why did most of you propose size/dots, not ‘shapes on a Tuesday’? We bring expectations about what’s ‘natural.’"  
       - *Prediction risk*: "Rule B fit everything—until the test card. In real life, this could mean AI or scientific models failing unexpectedly."  
       - *Intended concepts*: "When you designed, your ‘intended rule’ was arbitrary—like a teacher’s ‘correct answer’—even if others fit."  
    3. **Optional framing**: Mention Goodman’s "grue" or Wittgenstein’s rule-following *only* if asked.  
  - **Last question**: "If data underdetermines rules, what *does* drive learning? Discuss in pairs." (End on this note).

  ---

  ### **Seams and Predictable Problems**
  1. **What will go wrong (and how to fix it)**:  
     - **Design round stalls**: Groups may fixate on one rule. *Fix*: Pre-make example cards to inspire ("Try this: left = squares, right = circles. Test = rounded square").  
     - **Dominant participant**: In brainstorming, say: "Write rules silently first, then share." In design, assign roles (e.g., "Artist," "Rule Inventor").  
     - "It’s a trick!": During the ambiguous problem reveal, stress: "This isn’t my mistake—it’s the point. Data *always* allows multiple rules."  
     - **Test card doesn’t split rules**: In design, have groups test their problem on you first.  

  2. **What the activity can’t show (and how to bridge it)**:  
     - **Infinitely many rules**: The game shows 2–3 rules, but participants design more during the swap. *Bridge in debrief*: "You found two rules—but any finite data allows endless others (e.g., ‘shapes I like’)."  
     - **Origin of priors**: The game can’t prove if simplicity preferences are innate, learned, or conventional. *Bridge in debrief*: "We all preferred size/dots over ‘grue-like’ rules—but why? That’s the hard question."  

  3. **Why not a different staging?**  
     - Alternatives (e.g., number sequences) were considered, but Bongard problems are superior:  
       - Visual and intuitive (no math phobia).  
       - Panels force comparing examples, not sequential guessing.  
       - Design round is tactile and creative.  
     - **Stick with Bongard**: It mirrors real-world concept learning (e.g., medical diagnoses from images).

  ---

  ### **Final Notes**
  - **Run it tomorrow**: All materials are cheap and portable. Use minimal text—rely on figures.  
  - **Pedagogical punch**: The ambiguous problem causes productive frustration; the design round inverts power dynamics (they become the "teacher" trapped by underdetermination).  
  - **Secret sauce**: The test card reveal forces participants to *confront* disagreement, not just hear about it.  

  This plan balances structure with flexibility, ensuring the philosophical point emerges from lived experience. By the end, participants will viscerally grasp that data doesn’t speak for itself—and that’s the foundation of induction.
