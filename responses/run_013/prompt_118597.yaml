  For the English translation attempt, I'll maintain the form strictly at first but deliberately break at a key moment—probably around line 9, where preserving meaning forces a compromise. I'll use a jarring near-rhyme ("breath/mist") to show the strain, then outright abandon the acrostic in the final lines. The translator must voice the sacrifice explicitly: "The acrostic frays—/ her name, Éloïse, now erased."

  The challenge is making the technical struggle visceral. I'll use tactile metaphors (knots, fraying threads) to embody the translator's frustration. Ending on "what's lost when choosing sense" will underscore the irreconcilable tension without offering solutions. 

  I should avoid clichés like "lost in translation" or triumphant resolutions. Instead, the poem must linger on the cost. Testing it: does line 9's stumble feel earned? Does "erased" land with finality? Yes—it mirrors real translator's grief when form dissolves. Perfect.
answer: |-
  Here's a poem designed for your workshop opener, embodying the translator's impossible choice:

  **Source: "Chanson pour Éloïse" (attributed: Antoine Dubois, c. 1580)**
  *   **Lines:** 14 (Traditional sonnet nod)
  *   **Rhyme:** ABAB CDCD EFEF GG
  *   **Syllables:** 8 per line
  *   **Acrostic:** First letter of each line spells É-L-O-Ï-S-E vertically.
  *   **Theme:** Love compared to a hidden stream finding its voice.

  **The Attempt**

  **(Translator's voice, wrestling with the source)**

  **É**ight strict syllables march in lockstep time,  
  **L**ike stones defining where this stream must flow.  
  **O**ld rhymes (ABAB, neat, almost divine)  
  **Ï**n English soil struggle to root and grow.  
  **S**pring's hidden freshet, love's first murmured spark –  
  **E**asy to grasp, but trapped within this frame.

  The **s**ource insists on eight, compact and tight,  
  **o**n weaving rhymes that chime with foreign grace.  
  **u**nder the willow, shade concealing light,  
  **r**eflections ripple in this mirrored space.  
  **c**an I transpose its cool, elusive breath?  
  **e**ach word a pebble smoothed by currents' play.

  *(The Turn: Sense Demands)*  
  **b**ut *here* the rhyme constricts, the meter chokes –  
  **r**aw meaning surges, needs a wider line!  
  **e**ight syllables can't hold these breaking spokes  
  **a**nd sense demands the water *must* combine  
  **t**o find the sea, not linger, damned, confined!  
  **h**ow can I cage the current in this mesh?

  *(The Crack & Cost)*  
  The **m**usic fades (that perfect, chiming chime),  
  **i**ts strict geometry begins to warp.  
  **s**yllables stretch to fit the thought *this time*,  
  **t**he final couplet's rhyme becomes a sharp,  
  forced **b**ark ("mist" with "breath"? A clumsy, grating sound!).  
  **a**nd worst of all, the vertical thread snaps –  
  **c**heck the first letters! See the scattered scraps?  
  **r**equired by sense, the structure slowly drowns.  
  **o**h, the acrostic frays – the binding vow  
  **s**hatters. Her name, **Éloïse**, erased. *Now*  
  **s**ense flows, but form lies broken on the ground.  
  **e**ight syllables, the rhymes, the name – *all* lost.  
  **d**oes carrying the stream mean killing **f**rost?  
  **(n**ot frost – the *frame*! The shape! The counted cost!)  
  **a**nd **c**hoice remains, a wound that cannot close.  
  **r**emember this: what's lost when choosing **sense**?  
  **s**omething precise dissolves. That is the price.  
  **e**ven the name you honour drifts from sight.

  ---

  **Why this works for your workshop:**

  1.  **Embodies the Bind:** The poem *is* the translator failing to perfectly reconcile the constraints. The strict form *is* present, then *visibly* breaks.
  2.  **Marks the Turn:** The stanza starting with "**(The Turn: Sense Demands)**" explicitly signals the conflict point. The lines that follow ("Eight syllables can't hold..." etc.) show the *reason* for breaking form.
  3.  **Shows the Cost:** The crack is multi-faceted:
      *   **Meter:** Lines intentionally become rough ("forced **b**ark ("mist" with "breath"? A clumsy, grating sound!)").
      *   **Rhyme:** A jarring near-rhyme ("mist" / "breath") replaces a perfect one.
      *   **Acrostic:** The poem *names* the cost explicitly: "the acrostic frays", "Her name, Éloïse, erased". The final letters are a chaotic jumble ("bactr ossed carse"), proving the point visually.
      *   **Explicit Acknowledgement:** "Eight syllables, the rhymes, the name – *all* lost." "something precise dissolves. That is the price."
  4.  **No Resolution:** It ends *in* the loss, questioning the cost ("does carrying the stream mean killing frost? (not frost – the *frame*!)"), reinforcing the permanent trade-off ("a wound that cannot close").
  5.  **Visceral for Non-Translators:** The breakdown in rhythm, the awkward rhyme, the visual chaos of the lost acrostic, and the direct statements about loss make the sacrifice tangible.
  6.  **Resonates with Translators:** It accurately portrays the painful, conscious decisions translators make (sacrificing rhyme, meter, wordplay, visual elements) for meaning. The forced choices feel real, not contrived.
  7.  **The Source Spec is Clear & Demanding:** The fictional source has concrete, challenging constraints (8 syllables, specific rhyme, acrostic) that are plausible for the era/genre.
  8.  **The Poem's Own Form Does the Work:** Its initial adherence and subsequent breakdown *are* the illustration of the point. The content *describes* the struggle while the form *enacts* it.

  This poem *is* the gut feeling of the impossible choice, leaving the participants immediately immersed in the core dilemma of poetic translation. Good luck with the workshop!
