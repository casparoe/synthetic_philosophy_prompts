prompt: |-
  ok so before we start reading more stuff on money pumps and wether you can be irrational just in virtue of changing your mind over time, I want the spec. Forget scoring particular views for a second — what does any theory of diachronic rationality actually have to deliver before I should take it seriously? No references needed, I know the literature, I want the requirements.

  Write the desiderata list. For each one: the requirement, the case or consideration that forces it, and whether you think it's a genuine requirement or just a prejudice of one camp. Things I want covered, add what I'm missing:

  - the cases it has to get right, each spelled out in a sentence or two. The pump itself. The self-torturer, the guy who can nudge the dial up by one imperceptible notch and collect ten grand each time. The smoker deciding now about a single cigarette, knowing what he'll be like a year out. Don't just list them — say what result the theory has to return on each and why that's non-negotiable.

  - two cases I made up, use them as tests. The churner: someone who flips between two options forever, pays a small switching fee every time, and never regrets the previous choice at any point, with perfectly consistent preferences at each moment. Is she irrational, and does the theory *have* to say so? And the escalator: someone whose tastes predictably drift toward whatever they currently have, so they can be pumped, but who is arguably better off after each switch. If a theory can't seperate "you lost money" from "you're irrational" I think it's broken — tell me if that's a fair demand or if I'm smuggling something in.

  - the distinctions it can't collapse. Synchronic vs diachronic. Preference vs choice vs intention/plan. Rationality of the person vs rationality of the time-slice. And tell me whether your theory needs "reach" backward (condemning the earlier self for a choice only the later self regrets), forward (condemning the later self for breaking faith with an earlier commitment), or both — and what it costs to want both.

  - whether the pump argument secretly needs the premise that the agent prefers not to be the kind of person who gets pumped. If it does, say so, because then a chunk of the force is coming from somewhere other than consistency.

  - what the theory has to stay consistent with: learning, genuine value change, resolution and precommitment, and the ordinary thought that someone can be irrational for sticking to a plan as well as for abandoning it.

  Then flag the pairs you don't think can be jointly satisfied — that's the part I actually want. And tell me which single requirement does the most work in killing off candidates. This is for a seminar where we're trying to decide between the consistency view, the "just satisfy the preferences you have now" view, and the planning/self-governance view, so a list that can't adjudicate between those three isn't much use. Skip the scorecard, I'll do that in class.
