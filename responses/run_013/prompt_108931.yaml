  Ah, their question about the money pump's hidden premise is sharp. If the argument relies on the agent disliking being pumpable, that's cheating - it smuggles in a second-order preference. I should flag that as a make-or-break issue for some theories.

  For consistency requirements, the smoking case already handles precommitment, but I should emphasize learning and value change. Their aside about "irrational to stick to plans" suggests they reject dogmatic planning views - a theory must explain when flexibility is virtuous.

  Now the hard part: conflicts. The churner case will murder theories that equate switching with irrationality, while escalator wrecks those conflating money loss with irrationality. But the nuclear bomb is their distinction demand: if a theory can't separate "you lost money" from "you're irrational," it's dead. That single criterion probably sinks naive money-pump arguments.

