answer: |-
  Here’s the desiderata list for diachronic rationality theories, structured to your specifications. I’ve flagged conflicts and the most lethal requirement at the end.

  ---

  ### **I. Non-Negotiable Cases & Required Verdicts**
  1. **The Money Pump**  
     - *Case*: Agent prefers A > B, B > C, but C > A. Exploiter offers trades: A→C (pay fee), C→B (pay fee), B→A (pay fee). Cycle repeats.  
     - *Required Verdict*: **Irrational**. *Why*: Permits exploitation to bankruptcy while gaining nothing. Any theory allowing this is self-defeating.  

  2. **The Self-Torturer**  
     - *Case*: For each imperceptible increase in pain (setting *n* → *n*+1), agent gains $10k. At high settings, pain is unbearable.  
     - *Required Verdict*: **Must endorse stopping at some *n***. *Why*: "No perceptible difference" preferences are incomplete; allowing infinite nudges ignores catastrophic outcomes.  

  3. **The Smoker’s Dilemma**  
     - *Case*: At *t₁*, agent prefers quitting (lifetime health) over smoking. At *t₂* (facing cigarette), prefers smoking (immediate craving).  
     - *Required Verdict*: **Commitment at *t₁* to quit is rational**. *Why*: Synchronic satisfaction (*t₂* preference) undermines *t₁*’s higher-order valuation (health/longevity).  

  ---

  ### **II. Your Test Cases**
  1. **The Churner**  
     - *Case*: Flips eternally between A and B with consistent preferences (A > B at odd times, B > A at even times), paying a fee per switch. Never regrets past choices.  
     - *Required Verdict?* **Not inherently irrational**. *Why*: If preferences are time-indexed and consistent *at each moment*, with no net harm (e.g., switching fees are trivial to them), diachronic irrationality isn’t compelled. A theory *must not* mandate stability.  

  2. **The Escalator**  
     - *Case*: Tastes drift toward current endowment. Pays to trade A→B, then B→C, etc., but gains utility with each trade (e.g., novelty value exceeds cost).  
     - *Required Verdict*: **Rational if net utility increases**. *Why*: **Demand is fair**: Irrationality ≠ monetary loss. If net welfare rises, the agent is winning. A theory conflating money loss with irrationality is broken.  

  ---

  ### **III. Key Distinctions (Must Not Collapse)**
  1. **Synchronic vs. Diachronic Rationality**  
     - Synchronic: Satisfaction of *current* preferences.  
     - Diachronic: Coherence of preferences/plans *over time*.  
     - *Cost*: A theory prioritizing diachronicity may override synchronic preferences (e.g., forcing smoker to abstain at *t₂*).  

  2. **Preference vs. Choice vs. Intention/Plan**  
     - Preference: Evaluation at a time.  
     - Choice: Action at a time.  
     - Intention/Plan: Commitment to future action.  
     - *Requirement*: Must explain when intentions bind choices (e.g., smoker’s *t₁* plan).  

  3. **Time-Slice vs. Person Rationality**  
     - Time-slice: Only local preferences matter.  
     - Person: Global coherence matters.  
     - *Reach*: A theory needs **both backward and forward condemnation**:  
       - *Backward*: Condemn *t₁* if it enables later exploitation (e.g., self-torturer’s early nudges).  
       - *Forward*: Condemn *t₂* for defying *t₁*’s rational plan (e.g., smoker lighting up).  
     - *Cost*: Demanding both risks overconstraining agents facing genuine uncertainty or value shifts.  

  ---

  ### **IV. The Money Pump’s Hidden Premise**  
  - **Yes, it often smuggles in a second-order preference**.  
    - The argument assumes the agent *prefers not to be exploitable* or dislikes paying fees without gain. If an agent is indifferent to being pumped (e.g., enjoys trading), the pump loses force. A robust theory must either:  
      (a) Ground irrationality in the net loss *itself*, or  
      (b) Appeal to higher-order values (e.g., autonomy).  

  ---

  ### **V. Consistency Requirements**  
  A theory must accommodate:  
  1. **Learning**: New information justifies preference/plan revision.  
  2. **Genuine Value Change**: E.g., converting to pacifism isn’t irrational.  
  3. **Precommitment**: Binding future selves can be rational (smoker case).  
  4. **Sticking vs. Abandoning Plans**:  
     - *Irrationally sticking*: Clinging to a fitness plan while injured.  
     - *Irrationally abandoning*: Smoker breaking a funded rehab commitment.  
     - *Test*: Must distinguish between *akrasia* (weakness) and rational updating.  

  ---

  ### **VI. Conflicts & The Killer Requirement**  
  #### **Unresolvable Tensions**  
  1. **Churner vs. Money Pump**:  
     - If churner isn’t irrational (per test case), but money pumps are, the theory must distinguish *harmless cycling* from *exploitable cycling*. Naive transitivity requirements fail this.  
  2. **Escalator vs. Self-Torturer**:  
     - Both involve predictable preference drift and pumping. But Escalator gains utility, Self-Torturer loses. A theory must separate *beneficial drift* from *destructive drift* without ad hoc assumptions.  
  3. **Synchronic Sovereignty vs. Diachronic Coherence**:  
     - Can’t fully satisfy "just satisfy current preferences" *and* condemn the smoker at *t₂*.  

  #### **Most Deadly Requirement**  
  **The Escalator Test** ("Net welfare gain ≠ irrationality").  
  - *Why*: Kills theories that:  
    - Equate money loss with irrationality (naive money-pump arguments).  
    - Ignore dynamic utility (strict planning views).  
    - Can’t distinguish between exploitable and non-exploitable cycles.  
  - Survivors must have a theory of *welfare tracking* or *non-instrumental rationality*.  

  ---

  ### **VII. Adjudicating Your Seminar Views**  
  This list *can* discriminate:  
  - **Consistency View** (transitivity/non-cycling): Fails **Churner** (if fees are trivial) and **Escalator** (if net gain exists).  
  - **"Satisfy Present Preferences" View**: Fails **Smoker** (binds *t₂*) and **Self-Torturer** (must stop early).  
  - **Planning/Self-Governance View**: Fails if it can’t explain **Escalator** (no self-governance failure) or **Churner** (no plan violation).  

  **Key Battleground**: Whether a theory can condemn exploitable reversals (money pump) without overcondemning drift (escalator) or trivial cycling (churner). The winner must thread this needle.
