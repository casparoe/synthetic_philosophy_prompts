prompt: |-
  I am a high-school student and a member of my school's debate team, and I would like to know whether there is an established name for a pattern I keep running into when people argue about a present decision by invoking the past.

  The pattern is easiest to state with the two examples I hear most often: someone says that the lesson of Munich is that you never negotiate with a dictator, or that the lesson of Vietnam is that you cannot win a land war in Asia. I am not asking about those episodes themselves. What I noticed is the shape of the move. The "lesson" is almost never stated as a rule that could be carried over to a new situation and then turn out wrong; it is stored as a description of the old situation, and the phrase "the lesson of X" is just a way of pointing at that description. So when a new situation arises, the question people actually dispute is not "does the rule apply here?" but "is this another Munich?" — a question about resemblance. The resemblance is then settled by listing features of the new situation that were never part of the original lesson, with nobody explaining why those are the features that matter. Sometimes the move is made with no content at all — "we have seen this movie before" — which I take to be the purest version, since it claims the guidance comes from resemblance and supplies no rule.

  I have tried asking, in these arguments, what would have to be different about the present situation for someone to agree that the lesson does not apply. I have never gotten a condition; I only get more features. So two people who agree completely about the facts of the present case can still disagree about whether the lesson applies, because they disagree about which features of the old case are the important ones, and the old case has as many features as you care to list. The argument feels decisive while being, as far as I can tell, unchecked by anything.

  I have been told this is just the availability heuristic, or just hindsight bias, or just confirmation bias, and none of those seems quite right, because my thing is not about how easily a case comes to mind or about how people remember their own predictions; it is about where the guidance is stored and how its scope gets fixed. I have also been told that this is simply what all reasoning from experience looks like, since even a rule has to be applied to cases, and I would like a straight answer on that too.

  Please commit to a position. Tell me whether an established concept covers this; if one does, name it and say precisely how the closest rivals — analogical reasoning, the availability heuristic, hasty generalization, hindsight bias — differ from it. If none does, coin a term, define it, and tell me what lies outside it, including whether it is a fallacy at all or merely the unavoidable shape of any argument from precedent. I have no way to look things up, so please do not send me to sources. Start your reply with a one-sentence verdict, then give your reasoning, with no preamble and without restating my question.
reasoning: |-
  Okay, the user is a high school debater who noticed a specific argument pattern. They described how people use historical analogies like "Munich" or "Vietnam" to justify current decisions, focusing on resemblance rather than explicit rules. They want to know if there's a term for this and how it differs from related concepts.

  First, I recall cognitive biases and logical fallacies. Availability heuristic? That's about ease of recall, not resemblance. Hindsight bias involves reinterpretation of past events. Analogical reasoning is close, but usually both sides compare features. Here, it's one-directional: past event dictates present action without clear criteria.

  The key difference is the lack of articulated principles. People aren't extracting a rule; they're pattern-matching based on undefined "important features." This creates irresolvable disputes because relevance isn't debated. The user mentioned asking for conditions where the lesson wouldn't apply and getting no clear answer—this points to an unanchored analogy.

  I remember "historical analogy" as a term, but it's broad. The user's observation about stored guidance as a case rather than a rule needs a specific label. "Case-based precedent fixation" captures the essence: fixating on the past case without converting it to a transferable rule. 

  Checking rivals: Hasty generalization would involve forming a rule from few examples, but here no rule is formed. Confirmation bias might play a role but isn't the core mechanism. 

  The user wants a committed stance. Yes, this is distinct. Coining "precedent by resemblance" emphasizes the matching process without rule extraction. It's a fallacy because it avoids justifying relevance, making arguments circular. However, all precedent arguments have some resemblance-checking; the flaw is refusing to articulate why features matter. 

  Final verdict: No established term covers this exactly; coining "precedent by resemblance" as a subtype of faulty analogical reasoning.
answer: |-
  **Verdict:** No single established concept fully captures this pattern, so I coin the term **precedent by resemblance** to describe the fallacy of invoking a past case as decisive for present action based solely on asserted—but unexamined—similarities, without deriving or testing a general rule.

  **Reasoning:**  
  1. **Gap in existing concepts:**  
     - **Analogical reasoning** involves explicit comparison of features between cases to infer principles, but your pattern *avoids* extracting a rule, treating the past case itself as the irreducible guide.  
     - **Availability heuristic** explains why vivid cases (e.g., Munich) dominate thinking, but doesn’t address *how* their "lessons" are arbitrarily extended via resemblance.  
     - **Hasty generalization** forms broad rules from few examples, but here no rule is stated—only a vague "this is another Munich."  
     - **Hindsight bias** distorts memory of past predictions; your pattern distorts the *application* of past events to new contexts.  

  2. **Core mechanism:**  
     "Precedent by resemblance" occurs when:  
     - The past case (e.g., Munich) is stored as an *archetype* rather than a generalized principle.  
     - Resemblance is determined by selectively highlighting features of the new situation that *feel* congruent with the archetype, without justifying *why* those features are relevant.  
     - Scope remains fluid: Disagreements hinge on *which features of the archetype are "defining"* (e.g., "Munich is about dictators" vs. "Munich is about weak democracies"), allowing limitless reinterpretation.  

  3. **Why it’s fallacious (but pervasive):**  
     - It bypasses falsifiability: Asking "What would make this *not* another Munich?" exposes that no criteria exist for *disconfirming* the resemblance.  
     - It’s not unavoidable: Sound arguments from precedent *explicitly* extract rules (e.g., "Negotiation fails when adversaries see it as weakness") and test if the new context shares *relevant conditions*.  
     - Your observation that "two people agree on facts but disagree on resemblance" confirms the fallacy—it substitutes evidence-based reasoning with intuitive pattern-matching.  

  4. **Boundaries:**  
     - **Inside the fallacy:** Arguments where resemblance alone is treated as sufficient justification, with no attempt to articulate or defend a transferable rule.  
     - **Outside the fallacy:**  
       - Rule-based precedent: "Munich shows appeasement fails when facing expansionist ideologies; here’s why this adversary fits that category."  
       - Analogical reasoning: "Vietnam and Ukraine both involved external support for insurgencies, but differ in geography, so the lesson doesn’t apply."  

  **Conclusion:** "Precedent by resemblance" is a distinct fallacy—a pathological form of analogical reasoning that immunizes itself from scrutiny by refusing to specify what the precedent *is*. It’s not inevitable; it’s a failure to reason from experience rigorously. In debate, counter it by demanding: "What *specific* principle from the past case applies here, and why?"
