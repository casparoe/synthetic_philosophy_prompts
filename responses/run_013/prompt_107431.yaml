answer: |-
  Your colleague’s argument is a familiar one—a seductive application of Darwinian logic to culture that promises explanatory parsimony. But as you’ve intuited, the analogy often smuggles in conclusions that don’t survive scrutiny when we dissect the mapping. Let’s walk through the correspondences, see where they hold, where they fray, and where they rupture entirely—and crucially, whether his strong claim (that cultural persistence is decoupled from truth/usefulness) remains plausible once we’ve done so.

  First, the mapping. In the gene-centric view of biology, the *replicator* is the gene (or allele), a discrete unit of inheritance. In the meme analogy, the meme—an idea, belief, practice, or symbol—plays this role. *Variation* arises through mutation (errors in copying genes) or recombination; memes vary through imperfect imitation, recombination of ideas, or innovation. *Selection* operates in biology when environmental pressures confer differential survival/reproduction on phenotypes; in culture, selection occurs when certain memes are adopted, retained, or transmitted more frequently due to cognitive biases, social structures, or ecological demands. *Fitness* for a gene is its propensity to increase in frequency in the gene pool; meme fitness is its propensity to spread in a population. The *phenotype* in biology is the expressed trait (e.g., an enzyme, a behavior) coded by the genotype; for memes, it’s often argued to be the behavioral or material manifestation of the idea (e.g., a ritual performance, a crafted tool). The *environment* includes everything external that interacts with the phenotype (predators, climate, resources); culturally, it’s the socio-ecological context (institutions, technologies, beliefs of others, physical constraints). *Drift*—random changes in frequency—occurs in both systems due to sampling error. *Mutation* in genes is random chemical change; in memes, it’s distortion during transmission or innovation.

  Now, where does this mapping hold relatively cleanly? **Variation, selection, and drift** transfer reasonably well. Cultural traits do vary, their spread *can* be differential (some catch on, others fade), and random factors (e.g., a key advocate dying young) clearly influence outcomes. **Fitness** as a *descriptive* measure—tracking what spreads—is unobjectionable. Where the analogy strains or breaks, however, is precisely where your colleague’s strong claim hinges.

  The critical disanalogies:

  1.  **The Genotype/Phenotype Distinction Collapses:** In biology, the gene (genotype) and its phenotypic effect are distinct. A gene’s fitness depends *indirectly* on its phenotype’s interaction with the environment. Crucially, the gene itself is (largely) blind to environmental feedback; selection acts *on the phenotype*. In culture, the "meme" (e.g., the belief "ghosts exist") *is* both the informational unit *and* (often) its own phenotype. Its "fitness" isn’t mediated by a separate, physically expressed trait whose success *then* determines the replicator’s fate. The belief’s psychological representation *directly* influences its own transmission—through its emotional salience, cognitive fluency, or social consequences. This conflation means "meme fitness" isn’t an independent property; it’s inseparable from the meme’s *content* and its *effects* on human minds and behaviors *in the moment of transmission*. The "replicator" isn’t passively copied; its success is directly tied to how it manipulates its host.

  2.  **Transmission is Reconstructive, Not Replicative (and Lamarckian):** Genetic transmission is high-fidelity copying (errors aside). Cultural transmission is largely *reconstructive*. People don’t copy ideas verbatim; they *reinterpret* them through existing schemas, motivations, and knowledge (Sperber’s "attraction"). This process is inherently guided and transformative. Furthermore, it’s robustly *Lamarckian*: acquired modifications (intentional refinement, pedagogical correction, strategic adaptation) are directly inherited. A bad argument isn’t just miscopied; it’s often actively *improved* by its proponents to make it more persuasive before transmission. The "unit" of transmission is not stable.

  3.  **The Designer Inside the System:** Biological evolution lacks foresight or agency. Cultural evolution is saturated with it. Humans are not passive vessels; they are evaluative, goal-directed agents. We *assess* ideas for truth, utility, coherence, moral valence, and social desirability. We consciously design practices, arguments, and technologies to *be* better (more efficient, truer, more appealing). This guided variation isn’t an external force; it’s intrinsic to the cultural system. Your colleague’s "bad argument outcompeting a good one" often happens precisely *because* agents within the system *make* the bad argument more compelling (e.g., through rhetoric, emotional appeal, aligning it with identity) – a process dependent on psychological factors, not blind copying.

  4.  **Fitness Depends on the Very Psychology Supposedly Being Explained:** This is the deepest flaw undermining the strong claim. The "fitness" of a meme—its propensity to be adopted and transmitted—is *not* an intrinsic property of the meme itself in a vacuum. It depends entirely on pre-existing human psychology: our cognitive biases (e.g., confirmation bias, negativity bias), social motivations (e.g., conformity, status-seeking), emotional responses (e.g., fear, awe), and evolved capacities (e.g., language, theory of mind). Crucially, these psychological mechanisms *themselves* evolved, in part, to track truth and utility in our ancestral environments. A meme advocating self-destruction *might* spread briefly under specific conditions (e.g., apocalyptic cults), but its fitness is *parasitic* on deeper psychological mechanisms that *generally* promote survival and reproduction. The "Darwinian story" of cultural evolution *presupposes* and *depends upon* these psychological facts. It cannot explain them away or render appeals to truth/usefulness irrelevant; it *relies* on the outputs of those very mechanisms to define "fitness."

  **Do the disanalogies threaten the strong claim? Absolutely.**
  The claim that we can explain cultural persistence *without* reference to truth or utility hinges on the meme being a truly selfish replicator with fitness decoupled from host benefit, analogous to a virus. But disanalogy #4 is fatal to this. A meme’s "fitness" isn’t independent; it’s *defined by* how it interacts with human psychology. Psychology isn’t a neutral transmission channel; it’s an active filter shaped by natural selection for (broadly) adaptive outcomes. While truth and utility aren’t *perfect* predictors of persistence (hence bad arguments sometimes spread), they are powerful *constituents* of meme fitness because our minds are built to value them (imperfectly). Persistent cultural traits often *do* correlate with perceived (or actual) utility or coherence within a given context. Dismissing questions of warrant as a "category mistake" ignores that the *mechanism* of transmission itself often *depends* on assessments of warrant (or perceived warrant) by agents.

  **Was the analogy carrying the conclusion? Largely, yes.** The power of the "selfish replicator" metaphor tempts us to see memes as having independent "interests." But this is anthropomorphism projected onto the cultural unit. Memes don't have interests; they have *effects* on minds, and the minds determine the transmission. The strong conclusion—that persistence is *simply* about copying fidelity, divorced from function—only holds if we ignore the psychological engine driving cultural transmission.

  **A better analogy? Think less like virology, more like ecology or epidemiology.** Cultural evolution isn't a pure Darwinian process on replicators; it's a complex system of **attraction, transformation, and ecological interaction**. Ideas are **attractors** in psychological space; they spread not because they are perfectly copied, but because they resonate, are easily reconstructed, or are strategically modified to fit psychological niches (Sperber, Morin). Practices are tools or strategies adopted, adapted, and discarded based on perceived efficacy within a social and material environment (Boyd, Richerson; "guided variation," "cultural niche construction"). The "units" are fuzzy and transient. Selection operates, but it’s multi-level: on individuals adopting ideas/practices, on groups enforcing norms, and on the ideas/practices themselves as they compete for cognitive space. Crucially, *human psychology and agency are not external to this system; they are its core dynamic.* Explaining persistence requires understanding *why* minds find an idea attractive or a practice useful—which often *does* involve its perceived truth, coherence, social benefit, or instrumental value, even if these perceptions can be systematically biased.

  In short, your instinct is correct. While Darwinian *principles* (variation, selection, drift) offer valuable descriptive frameworks for cultural change, the gene-meme analogy, when pushed to imply selfish replicators divorced from host psychology and agency, is deeply misleading. It obscures the very features—reconstruction, intentionality, psychological dependence—that make cultural evolution distinct. The persistence of a belief or practice *cannot* be fully explained without considering how it interfaces with the evolved, evaluating human mind. Truth and utility aren't irrelevant; they are often central components of the "fitness landscape" shaped by our psychology. The analogy didn't just help your colleague reach his conclusion; it actively constructed it by hiding the gears of cognition and agency inside a black box labeled "replicator."
