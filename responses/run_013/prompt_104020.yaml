prompt: |-
  Me and my friend got into it for like two hours last night about Confucian role ethics — he's been reading about it and kept telling me the thing I was trying to describe is just "special obligations to particular people," or just what Confucians call filial piety, and I don't think either of those is what I'm pointing at, but I also can't name it, which is sort of the problem.

  Here's the case that started it. My uncle moved my grandmother into a care home. He visits twice a week, pays for everything, the care is definately better than anything he could have done at home. My dad says he's done right by her. My uncle says no — the point was that it should have been him. Not because he'd do it better, not because he wants to be the sort of son who does it, and not because she'd be owed anything different. And the strange part is that the easier it gets for anyone else to do it — better facilities, paid aides — the more it seems to be specifically his.

  Then a friend of mine sat with a neighbor she barely knew through the last month of his life, because she was the only one who would. There's no role there at all, no institution, they weren't family, and she describes it exactly the same way: it had to be her, and she's still not done, two years after he died. Nobody she wronged by stopping, nobody who could have released her from it.

  So is there a name for this? I know it's near special obligations, and near role ethics, and somebody said agent-regret, but (a) it doesn't seem to be owed to anyone, so there's no claim anyone holds or can waive, (b) it has no completion condition — you can't discharge it, you can only keep at it, and (c) the second case has no role whatsoever, so role ethics only gets it by stretching. What I want is the carving, not the label: what this actually is, which established concept comes nearest and exactly where it comes apart from it, where the edges are (does it survive the other person's death? could you have it toward someone you've never met? is it ever transferable?), and if there's no name, coin one and define it well enough that I can tell a case of it from a case of ordinary obligation. No reading list please, I just want the concept sorted. End with a line like \answer{term — one-sentence definition}.
reasoning: |-
  Okay, the user is wrestling with a philosophical concept that emerged from personal anecdotes about their uncle and friend. They're frustrated because existing frameworks like Confucian role ethics or special obligations don't quite capture what they're describing. 

  Hmm, the core tension seems to be about an imperative that's deeply personal yet not transactional. The uncle's situation is fascinating—objectively good care provided, yet he feels he failed precisely because he didn't personally wipe his mother's brow. And the neighbor case is even more striking: no social role, no reciprocity, just raw "it had to be me." 

  What separates this from standard obligations? The user nailed three key distinctions: (1) no claimant (the other person can't release you), (2) no completion (it persists beyond death), (3) no institutional scaffolding. Agent-regret doesn't fit either—that's about wishing you'd acted differently, not an ongoing imperative. 

  *Pacing mentally*... This feels adjacent to Bernard Williams' "moral luck" but more existential. Levinas' face-to-face responsibility comes to mind—the infinite demand of the Other—but that's still too abstract. The user wants concrete carving: Does it survive death? (Yes, per the neighbor case.) Transferable? (The uncle implies not.) Applicable to strangers? (Potentially, if proximity creates the bond.) 

  Ah—"elective burden" might work. Elective because it's chosen (unlike filial duties), burden because it persists as weight. But needs refining: "Self-imposed existential imperative arising from proximity" captures the lack of external enforcement. 

  *Double-checking edges*: Survives death? Yes (neighbor case). Transferable? No (uncle rejects substitutes). Strangers? Context-dependent—requires some catalytic intimacy like witnessing vulnerability. Distinct from guilt/regret by being forward-looking ("still not done"). 

  Final polish: Must emphasize the paradox—the easier delegation becomes, the sharper the personal claim. That's the telltale sign versus ordinary obligations. 

  \answer{Intimate Imperative — An agent-relative, non-transferable compulsion to personally enact care for a proximate other, arising from situational intimacy rather than social roles, which persists beyond the recipient's death and refuses substitution.}
answer: |-
  This is a profound and distinctly modern form of ethical weight. It's **not** special obligation (which implies a claim *on you* from the other, often waivable) nor role ethics (which is socially scaffolded). What you're describing is:

  **Intimate Imperative** – An agent-relative, non-transferable compulsion to enact care for a *specific* proximate other, arising solely from situational intimacy and the stark reality of their need witnessed by you, persisting beyond the recipient's death or any conceivable fulfillment, and refusing substitution even when objectively better alternatives exist.

  ### Carving the Concept
  1.  **Source:** Emerges from *witnessed proximity + vulnerability*. Not from blood, contract, reciprocity, or social expectation. The uncle *saw* his mother's decline; your friend *saw* the neighbor's isolation. The act of seeing/knowing the specific, unmet need *in front of you* triggers it.
  2.  **Agent-Relativity:** It's *his* mother *in this situation*; it's *that* neighbor *dying alone down the hall*. The compulsion is tied to *your* specific presence and perception at the point of need. It cannot be transferred because *your* witnessing is the origin.
  3.  **Non-Transferability & Anti-Substitution Paradox:** The easier delegation becomes (better facilities, paid help), the *stronger* the imperative feels *for you specifically*. Delegation doesn't satisfy it; it highlights the gap between the act and *your* required presence. Your uncle rejects better care *because* it's not him. Substitution feels like evasion of the core demand: *your* presence.
  4.  **Lack of Claimant/Completion:** There is no external party who can say "enough" or release you. The demand is internal, generated by the *relationship-in-the-moment-of-need*. It persists after death (your friend's "still not done") because the imperative wasn't about achieving an outcome (comfort, survival), but about *being the one present* during the ordeal. Completion was impossible the moment the need ended without *your* full enactment.
  5.  **Edges & Limits:**
      *   **Survives Death?** Yes (as per your friend's case). The imperative to *have been* the one persists.
      *   **Strangers?** Yes, but *only* with catalytic proximity/intimacy. Seeing a stranger collapse alone in an alley *could* trigger it ("*I* must help *this person*"); abstract knowledge of suffering strangers (famine victims) likely does not. The imperative requires concrete, witnessed singularity.
      *   **Transferable?** No, inherently. Attempting to transfer *is* the failure (the uncle's point). The demand is to *you*.
      *   **Always Negative?** The feeling is burdensome, but the *source* is a profound, albeit demanding, connection. It's the weight of inescapable relational reality.

  ### Distinguishing from Neighbors
  *   **Special Obligations:** Involves a claim (e.g., parent owes child care, child *owes* parent respect). Here, *no one claims it*; it imposes itself. Obligations can be fulfilled/dissolved; this cannot.
  *   **Confucian Role Ethics:** Rooted in specific, defined social roles (father/son) with scripted duties. Your friend had *no* role. The uncle *had* a role but felt the imperative went *beyond* the role's duties (paying, visiting) to *personal enactment*.
  *   **Agent-Regret:** Regret over a past action/inaction causing harm. This is a *present/future imperative* ("I *must* do it") or a *persistent* demand stemming from a failure to enact ("I *should have been* the one"), even if no better outcome was possible.
  *   **Guilt:** Arises from wrongdoing. Here, no wrongdoing is necessary (uncle provided objectively good care; friend did nothing wrong by not starting earlier). The imperative exists independently of fault.

  **Intimate Imperative** captures the irreducible, non-negotiable "It had to be *me*, and *me* specifically, *here*, *now*, doing *this*" that arises when profound human vulnerability meets your undeniable presence. It's the unsharable burden of being the witness who cannot look away.

  \answer{Intimate Imperative — An agent-relative, non-transferable compulsion to personally enact care for a specific proximate other, arising solely from witnessed situational intimacy and persisting beyond fulfillment or death.}
