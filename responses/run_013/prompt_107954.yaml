answer: |-
  **Locating the Normative Force in Harsanyi’s Aggregation Theorem: A Weakening of Decision-Theoretic Axioms**  

  **1. Background and Motivation**  
  Harsanyi’s aggregation theorem derives utilitarianism—a social welfare ordering that ranks outcomes based solely on the sum of individual utilities—from three premises: (i) individual rationality (each person’s preferences satisfy expected utility theory), (ii) a Pareto condition (if everyone weakly prefers outcome A to B, so does society), and (iii) an impartiality condition (the social evaluator, behind a "veil of ignorance," treats all individuals’ positions as equally probable). The theorem’s normative force is widely attributed to impartiality: the axioms of decision theory (like the independence axiom, which requires preferences over lotteries to be unaffected by irrelevant alternatives) are defended as ethically neutral tools for encoding coherent comparisons. This project challenges that view. I suspect the ethical weight lies not in impartiality but in the decision-theoretic axioms—specifically, in the strong structure imposed by independence. If independence or other uncertainty axioms are weakened while impartiality and Pareto remain fixed, the resulting social ordering may no longer be utilitarian but could prioritize the worst off. Existing discussions overlook this because they treat decision theory as a passive scaffold; none systematically vary its axioms to test where utilitarianism emerges or dissolves.  

  **2. Research Question and Hypothesis**  
  The core question is one of *localization*: When impartiality (modeled as equiprobability over individual positions) and Pareto are held fixed, how does weakening the decision-theoretic axioms governing the impartial observer’s preferences alter the class of admissible social welfare orderings?  
  - **Fixed elements**: Impartiality (the observer’s preferences are invariant under permutations of individual identities) and Pareto (if all individuals weakly prefer lottery A to B, so does the observer).  
  - **Varied elements**: The axioms for the observer’s preferences over lotteries:  
    - *Package 1*: Full expected utility (EU), including independence.  
    - *Package 2*: Weakened EU (e.g., dropping independence but retaining continuity and mixture monotonicity).  
    - *Package 3*: Non-EU representations (e.g., rank-dependent utility or ambiguity-sensitive models).  
  For each package, I will characterize the social welfare orderings compatible with the fixed ethical premises. A "characterization" here means a representation theorem identifying the functional form of the social ordering (e.g., is it a weighted sum? a minimax rule?) and its uniqueness properties (e.g., unique up to affine transformations). The hypothesis is that Package 1 yields only weighted utilitarianism, while Packages 2–3 admit orderings sensitive to the worst off (e.g., prioritarian or leximin rules), revealing that the normative bite of Harsanyi’s theorem stems from risk axioms, not impartiality. This also illuminates the ex ante/ex post evaluation divide: weaker risk axioms may permit social evaluations that account for ex post inequality.  

  **3. Methodology and Timeline**  
  The project is formal and analytical, using tools from decision theory and social choice. Work will proceed month by month:  
  - **Month 1**: Formalize the setup. Define the impartial observer’s preference relation over lotteries of individual positions. Review existing generalizations of Harsanyi (e.g., without independence) to identify gaps.  
  - **Month 2**: Analyze Package 1 (full EU). Confirm that utilitarianism is uniquely recovered, using classic techniques.  
  - **Month 3**: Define and analyze Package 2 (e.g., betweenness axioms or homogeneous preferences). Adapt results from nonlinear utility theory (e.g., Chew–Dekel preferences) to derive the social ordering class.  
  - **Month 4**: Explore Package 3 (non-EU). Investigate whether representations like Choquet integration permit non-utilitarian rules. If intractable, focus on specific cases (e.g., rank-dependent utility).  
  - **Month 5**: Synthesize results. Test robustness by examining how orderings handle ex ante vs. ex post equity (e.g., whether they satisfy stochastic dominance).  

  **Risks and Mitigation**: The primary risk is mathematical complexity. I am proficient in EU theory but less experienced with non-EU models. If Package 3 proves infeasible, I will prioritize Package 2, leveraging simplified weakenings (e.g., dropping independence but retaining weak independence). I will consult my economics-department colleague for technical guidance. If characterization fails for a package, I will seek examples (e.g., a prioritarian rule satisfying the axioms) to demonstrate non-uniqueness.  

  **4. Possible Outcomes and Decisive Factors**  
  Three broad outcomes are possible:  
  - **Confirmation**: The class of social orderings expands as risk axioms weaken (e.g., utilitarianism → prioritarianism), confirming that risk axioms drive the normative conclusion.  
  - **Refutation**: The class remains utilitarian across packages, suggesting impartiality is the core ethical force.  
  - **Collapse**: Weaker axioms admit too many orderings (e.g., any monotonic rule), making characterization uninformative.  
  The decisive factor is whether a *describable class* of orderings emerges for each package (e.g., "all rules concave in utilities"). Confirmation requires this class to systematically shift toward greater inequality aversion. Failure occurs if no tractable characterization exists even for Package 2, or if impartiality + Pareto alone trivialize the problem (e.g., admitting all continuous orderings).  

  **5. Scope and Limitations**  
  For a one-semester project, I exclude:  
  - **Interpersonal utility comparisons**: Utilities are assumed cardinally comparable and fixed.  
  - **Dynamic or strategic settings**: Focus is on one-shot lotteries.  
  - **Empirical validity**: The project tests logical coherence, not psychological realism.  
  These exclusions are acceptable because the goal is conceptual—to isolate the role of risk attitudes in aggregation. The omitted elements are orthogonal to the core question of localization.  

  **Question:** What class of social welfare orderings satisfies fixed impartiality and Pareto conditions under progressively weakened decision-theoretic axioms?
