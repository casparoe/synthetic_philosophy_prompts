answer: |-
  ## Arguing for the Custody Condition on the Extended Mind Thesis

  The Extended Mind Thesis (EMT), pioneered by Clark and Chalmers, provocatively suggests that external resources can, under the right conditions, form genuine constituents of an individual’s cognitive system, extending the mind beyond the biological skull. While compelling, the thesis faces a persistent challenge: the **problem of cognitive ownership**. *Whose* mind is extended when an external resource is utilised? I argue that the **Custody Condition** provides a crucial resolution: an external resource counts as part of a subject’s cognitive system **only if** the subject stands in a relation of *custody* to it. This entails the subject possessing the capacity to maintain the resource, recognise its failures, and repair or replace it – not merely relying upon it passively. Without this condition, the EMT struggles to delineate cognitive boundaries and risks collapsing into an implausible externalism where any utilised tool becomes part of the mind.

  The core problem unaddressed by simple reliance is one of *integration and control*. For an external process to be constitutive of *my* cognitive process, it must be as deeply integrated and subject to my cognitive governance as internal processes like recall or calculation. Mere reliance – consulting a notebook, following GPS instructions – lacks this deep integration. The resource remains external, a tool I *use*, not a process I *am*. The Custody Condition captures this essential functional parity. Maintaining a resource (e.g., updating a notebook, ensuring a calculator has batteries) mirrors the brain’s constant neurobiological upkeep. Recognising failure (spotting an error in notes, realising GPS signal is lost) parallels metacognitive monitoring (realising one’s memory is faulty). Repairing/replacing (correcting the notebook, swapping calculators) echoes cognitive strategies for error correction or shifting mental tactics.

  Consider the classic EMT candidates:
  1.  **Otto's Notebook:** Otto, with Alzheimer's, constantly maintains his notebook – updating it, checking entries for coherence, replacing pages. Crucially, he *can* detect inconsistencies and correct them himself. Here, custody is satisfied. The notebook isn't merely consulted; it's governed by Otto's cognitive oversight, functioning as a constitutive part of his memory system.
  2.  **Inga's Biological Memory:** Inga recalls the museum's location internally. Her custody is implicit in her biological capacity for memory maintenance, error-checking, and retrieval strategy adjustment.
  3.  **A Standard GPS:** A driver passively follows turn-by-turn instructions without understanding the route, unable to diagnose a malfunction or recalculate if it fails. This is pure reliance. The GPS is a tool, not part of the driver's cognitive system. The driver lacks custody; they are cognitively subordinate to the device.
  4.  **A Relied-Upon Notebook:** Imagine someone who borrows a colleague's meticulously kept notebook for a single task, trusting its contents implicitly but incapable of verifying, updating, or correcting it. They rely on it, but lack custody. It remains the colleague's cognitive artifact, a tool the borrower uses, not an extension of *their* mind.

  Without the Custody Condition, EMT cannot explain why Otto's notebook counts as *his* mind, but the borrowed notebook or the GPS does not (except by arbitrary fiat). It fails to show how the external resource becomes uniquely integrated into *one specific* individual's cognitive economy. Custody provides the necessary functional glue, ensuring the resource is under the subject's ongoing cognitive management, making its functioning truly *theirs*.

  **The Strongest Case Against: The Interlocked Group Cognition Scenario**

  The most potent challenge to the Custody Condition arises with **shared resources enabling deeply interlocked group cognition, where no single individual possesses custody**. Imagine a specialised scientific instrument – say, a complex climate modelling simulation running on a proprietary "Cognitive Array" (CA). This CA integrates real-time data feeds, runs intricate models, and outputs predictive visualisations crucial for decision-making by a team of scientists.

  *   **Deep Interlocking:** The scientists' individual reasoning is profoundly shaped by the CA's outputs. They debate interpretations, design new queries based on its results, and their collective understanding emerges *through* interacting with the CA. It feels like a shared cognitive workspace.
  *   **Lack of Individual Custody:** Crucially, *none* of the scientists can maintain the CA's core software or hardware. They cannot directly inspect its algorithms (proprietary 'black box'). They lack the expertise to repair it if its underlying models malfunction. They rely entirely on a dedicated (but cognitively uninvolved) engineering team for upkeep and basic troubleshooting. They can recognise *output anomalies* (e.g., nonsensical predictions), but cannot diagnose the *source* of the failure within the CA itself or initiate repairs. Replacement isn't feasible; the CA is unique.

  Here, the resource is integral to the group's cognitive activity, yet no individual satisfies the Custody Condition. Does this mean the CA extends *someone's* mind? If so, whose? The scientists? The engineers? The group as a whole? If the Custody Condition denies it extends any *individual* mind, is this merely a stipulative rejection of a compelling case of cognitive extension?

  **The Custody Condition's Response**

  The Custody Condition dictates that the CA **does not become part of any individual scientist's cognitive system**. While it is a vital cognitive *tool*, its governance lies outside their cognitive control. They cannot maintain, deeply inspect, repair, or replace its core functions. Their relationship is one of sophisticated reliance, not constitutive integration.

  This conclusion is **not merely stipulative**; it rests on the core functional argument underpinning the condition:

  1.  **Lack of Cognitive Governance:** The scientists cannot *regulate* the CA's core processes as they regulate their biological cognition or as Otto regulates his notebook. They are vulnerable to errors they cannot correct and processes they cannot adjust. This asymmetry breaks the functional parity required for constitutive extension. Their cognition depends on the CA, but the CA's operation is not *subject* to their cognition in the requisite way.
  2.  **Problem of Ownership Persists:** Attributing the CA to the *group* mind doesn't resolve the ownership issue for EMT as traditionally understood (focused on individual cognition). EMT primarily addresses how *individual* minds incorporate external resources. While distributed and group cognition are fascinating phenomena, they require different frameworks. Applying EMT here stretches it beyond its explanatory scope for individual cognitive boundaries.
  3.  **The Tool/Component Distinction is Preserved:** The CA remains an extraordinarily powerful cognitive artifact – an external resource upon which the scientists rely heavily and which shapes their thinking. However, its opacity and the external locus of control over its core functions mean it functions as a *tool* their minds *use*, not as a *component* their minds *are*. They interact with its outputs, not its cognitive 'engine'. Recognising this distinction is crucial for understanding the limits of individual cognitive integration and the nature of complex tool-use.

  **Why this isn't Stipulative:** The argument isn't "because I defined custody this way." It's because without the capacities captured by custody – maintenance (upkeep), recognition of failure (monitoring), and repair/replacement (error correction/adaptation) – the external resource lacks the **functional equivalence in terms of cognitive control** that justifies treating it as part of the *subject's own* cognitive machinery, rather than an external system they query. The CA scenario vividly demonstrates this lack: the scientists are cognitive *users*, not cognitive *governors*, of the CA's core processes. The Custody Condition thus provides a principled, functionally grounded criterion for drawing the line between genuine cognitive extension and sophisticated cognitive reliance, resolving the crucial question of cognitive ownership inherent in the EMT.
