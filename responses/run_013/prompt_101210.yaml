  Then, after they have answered, we move to pair discussion. But we don't let them change their answers? Or we do? We want the tally to be the initial gut reaction. The discussion is to hear arguments and then we tally the initial answers. Then after tally, we can ask if anyone changed their mind? But we want the asymmetry to be in the gut reaction.

