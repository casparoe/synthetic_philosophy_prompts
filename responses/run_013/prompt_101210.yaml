answer: |-
  Here's a runnable, gut-level classroom activity to induce the Knobe effect, optimized for a 50-minute intro philosophy of mind session. This version maximizes surprise, forces intuitive judgments, and ensures students generate the asymmetry themselves. I'll provide the full script, timing, and solutions to predicted pitfalls.

  ---

  ### **Activity: "The Chairman's Choice"**
  **Goal:** Students discover the intention asymmetry (Knobe effect) through their own judgments before learning it's a named phenomenon.

  ---

  ### **Materials**
  - **Scenario Sheets** (1 per student, printed with 3 scenarios in this order):
    > **Scenario A (Environmental Harm):**  
    > "A chemical company's chairman must decide whether to start a new project. The VP says: 'This project will raise profits, but it will also dump toxic waste into the river, killing the ecosystem.' The chairman replies: 'I don't care about the river at all. I just want higher profits. Start the project.' They do. The river is destroyed."  
    > **Question:** Did the chairman intentionally destroy the river?  
    > ○ Yes  
    > ○ No  
    >
    > **Scenario B (Worker Happiness - *Filler*):**  
    > "A tech CEO must decide whether to implement new software. The CTO says: 'This software will boost productivity, but it will also make employees happier by automating boring tasks.' The CEO replies: 'I don't care about employee happiness. I just want higher productivity. Implement it.' They do. Employees become happier."  
    > **Question:** Did the CEO intentionally make employees happier?  
    > ○ Yes  
    > ○ No  
    >
    > **Scenario C (Environmental Help):**  
    > "A chemical company's chairman must decide whether to start a new project. The VP says: 'This project will raise profits, but it will also clean the river, restoring the ecosystem.' The chairman replies: 'I don't care about the river at all. I just want higher profits. Start the project.' They do. The river is restored."  
    > **Question:** Did the chairman intentionally restore the river?  
    > ○ Yes  
    > ○ No  

  - **Stakes Mechanism:** Poker chips (or paper tokens) — 3 per student.  
  - **Whiteboard** for tallying results.  

  ---

  ### **Timeline (Total: 50 min)**  
  #### **1. Setup (5 min)**  
  - **Script:** "Today we're exploring how we judge intentions. You'll read 3 *unrelated* business scenarios. For each, answer the question instantly—go with your gut. To avoid overthinking, you'll stake a token on your answer. If you change your mind later, you lose the token. Tokens = bonus participation points."  
  - **Logistics:** Hand out scenario sheets and 3 tokens per student. Emphasize: "Do NOT overthink. Spend ≤10 seconds per scenario. These are separate cases."  

  #### **2. Private Judgments (5 min)**  
  - **Task:** Students circle "Yes" or "No" for each scenario and place one token on their answer for each.  
  - **Instructor Role:** Walk around to enforce speed. If students hesitate: "Commit to your gut reaction—no philosophy hedging!"  

  #### **3. Paired Defense (10 min)**  
  - **Pairing:** Assign partners.  
  - **Task:** "Convince your partner your answers are correct. If you change your mind, you must surrender your token to me. Defend your stance!"  
  - **Logistics:** Set a timer. Collect tokens from students who switch answers (typically 1–3 per class).  

  #### **4. Tally & Reveal Asymmetry (15 min)**  
  - **Tally:** For each scenario, ask: "How many voted **Yes**?" Record counts on the board:  
    ```
    Scenario A (Harm): Yes [ ] / No [ ]  
    Scenario B (Filler): Yes [ ] / No [ ]  
    Scenario C (Help): Yes [ ] / No [ ]
    ```  
  - **Asymmetry Reveal:**  
    1. Point to Scenarios A and C: "Notice anything similar about these two?"  
    2. Let students observe: *Same chairman, same indifference, same profit motive*.  
    3. Highlight the board: "But look at your votes! For the *harmful* side effect (A), most said **Yes**—he did it intentionally. For the *helpful* one (C), most said **No**. You just generated this asymmetry yourselves."  
    4. Name the effect: "This is the **Knobe effect**—people judge harmful side effects as intentional more than helpful ones, even with identical mental states."  

  #### **5. Debrief: Connecting Gut to Theory (15 min)**  
  Use the board to map student reactions to key concepts:  
  - **Foreknowledge & Indifference (Structure):**  
    > "In *both* A and C, the chairman:  
    > - Knew the side effect would happen (foreknowledge).  
    > - Didn’t care (indifference).  
    > Yet you judged them differently. Why?"  
    > *Student insights often cite "blame" for harm vs. "no credit" for help.*  

  - **Valence Flip (The Critical Difference):**  
    > "The *only* difference was the outcome's valence: **harm** (A) vs. **help** (C). This flipped your intuition about intention. Scenario B (filler) confirmed indifference alone doesn’t guarantee 'intentional'—it’s the *badness* that triggers it."  

  - **Asymmetry in *Their* Judgments:**  
    > "This isn’t just a quirk of random people—it’s in *this room*. Your votes show we’re wired to link intention with blame. Philosophy question: Does this reveal something deep about intention, or is it a language glitch?"  

  - **Filler’s Role:**  
    > "Scenario B (worker happiness) had the *same indifference* as A/C but a *neutral* outcome. Votes were likely split—showing indifference isn’t enough to create the effect. Valence matters."  

  ---

  ### **Predicted Pitfalls & Solutions**  
  1. **Pitfall: Students hedge/refuse to answer.**  
     - **Solution:** Enforce speed ("10 seconds!") and stakes ("Tokens = points"). If they resist: "Pick one—no neutral ground." Most comply when pressured.  

  2. **Pitfall: Stakes cause overthinking, masking the effect.**  
     - **Solution:** The filler scenario (B) distracts from the A/C pair. Speed prevents overanalysis. If the effect is weak (e.g., 60% Yes for A, 40% for C), still highlight the *trend*—it’s robust enough to appear.  

  3. **Pitfall: Students notice A/C similarity early.**  
     - **Solution:** Present scenarios as "unrelated." Filler scenario (B) masks the pattern. If spotted, say: "Hold that thought—we’ll discuss later."  

  4. **Pitfall: Asymmetry doesn’t emerge (rare).**  
     - **Solution:** Use pre-test data to normalize: "Typically, 80%+ say 'Yes' for harm, ≤30% for help. Your class was [X]—why might that be?" Discuss sample size or cultural factors.  

  ---

  ### **What the Activity Can’t Do**  
  - **Cannot settle philosophical debates:** It won’t resolve whether the asymmetry reflects the *concept of intention* (e.g., blame-shaped cognition) or is a *pragmatic language quirk* (e.g., "intentionally" implies blame).  
  - **Cannot explain *why* the effect occurs:** The activity generates the asymmetry but doesn’t test theories (e.g., moral vs. non-moral accounts).  
  - **May not replicate lab precision:** Classroom noise (e.g., peer influence) can dilute results. The effect is statistical—not every student will show it.  

  ---

  ### **Confidence Assessment**  
  - **High Confidence (>95%):**  
    - The Knobe effect *will appear* in aggregate (harm judged intentional > help).  
    - Students won’t recognize A/C as paired until debrief (filler + rushed pace prevents this).  
  - **Medium Confidence (70%):**  
    - Stakes + speed will force gut reactions (based on pilot studies using token incentives).  
  - **Lowest Confidence (50%):**  
    - The filler scenario (B) will split votes cleanly. Some students may project harm/help onto it, causing skewed tallies. **Mitigation:** Clarify neutrality in debrief ("B was indifferent-but-neutral").  

  ---

  **Why This Works:** Students experience the effect viscerally—they *are* the data. The filler masks the manipulation, the stakes prevent hedging, and the debrief ties their surprise to core concepts. It transforms an abstract finding into a personal "aha!" moment.
