  **Scenario 1:**

  The vice-president of a company went to the chairman of the board and said, "We are thinking of starting a new program. It will help us increase profits, but it will also harm the river by polluting it." The chairman answered, "I don't care at all about harming the river. I just want to make as much profit as I can. Let's start the new program." They started the new program. Sure enough, the river was harmed.

  Question: Did the chairman bring about the harm to the river on purpose?
     □ Yes
     □ No

  ---

  **Scenario 2:**

  The vice-president of a company went to the chairman of the board and said, "We are thinking of starting a new program. It will help us increase profits, and we have designed it to also clean the river." The chairman answered, "I am very glad to hear that we can help the river while making a profit. Let's start the new program." They started the new program. Sure enough, the river was cleaned.

  Question: Did the chairman bring about the cleaning of the river on purpose?
     □ Yes
     □ No

