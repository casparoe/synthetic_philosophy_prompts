prompt: |-
  Some freinds of mine have been arguing about the moral equality of combatants for about two years now and I want to force them to actually write something together instead of rehashing the same three objections at each other. One of them holds the traditional view: the soldier fighting for an unjust cause isn't a murderer just for fighting — once the war is on, the same permissions and prohibitions apply to everybody, and what's permissible in fighting doesn't depend on whether your side was right to fight. The other is a revisionist: liability to be killed tracks responsibility for an unjust threat, so a soldier who knowingly prosecutes an unjust war is morally on a par with a guy attacking you in the street, and a uniform and a set of orders don't launder that.

  Draft the joint statement they could both sign. I want the agreed claims, stated so that neither of them is quietly giving something up; the residual disagreements, each written in the strongest form its own side would accept as a fair statement of its view; the cruxes — the sub-questions where settling things would actually move somebody; and for each crux, the case, argument or finding both sides agree would bear on it, with each side's prediction written down in advance. Number the agreed claims, then put the disagreements in a table, then the cruxes. And tell me which chunk of this fight, if any, is really verbal or is two different questions wearing one coat (what's morally true vs. what the law of war should say; what a soldier can be expected to know; what a code of conduct is even for) and which chunk is a genuine moral disagreement that no amount of clarification will dissolve.

  Things I want them to actually deal with instead of talking around:

  - Whether "liable to be killed" and "permitted to kill" can come apart. Is there such a thing as a killing that's justified even though the person killed wasn't liable to it? If so, what does that do to the revisionist's story, and can the traditionalist get any mileage out of it, or does it just hand the revisionist a patch?

  - The case where neither side's cause is just — a straight imperial scramble, no just side anywhere. Does the traditionalist's symmetry claim get vindicated here? And does revisionism have to say that nobody on either side is permitted to do anything, which sounds nuts? I want each of them to bite whatever bullet is actually there.

  - Innocent threats: someone shoved off a bridge who's going to land on you, a kid with a rifle who's been told you're the enemy, a civilian used as a shield. What do these do to each side? My guess is the traditionalist will say they show liability is the wrong frame entirely and the revisionist will say they show it's the right frame applied carefully, and I want to know which of them is right about that rather than just both being asserted.

  - Criminal liability after the fact. If the unjust side loses, should its ordinary soldiers be prosecutable? If the answer is "no, but not because they did nothing wrong", say exactly what that "but" is doing — is it a moral consideration or just a practical one dressed up?

  - Whether the traditionalist view is really a claim about who deserves what, or a claim about what rule we should all adopt given that soldiers can't reasonably be expected to adjudicate their own cause. If it's the second, does it survive if the convention turns out not to buy us restraint or reciprocity? That seems like something they could actually agree counts against it, so make them say what they'd do if it failed.

  Don't let them settle for "we agree there's a tension here" — the agreed section should contain things that somebody outside the room would actually deny. And flag any spot where one side has to admit that its view as stated implies something it doesn't want to own.
reasoning: |-
  Hmm, the user has a really interesting philosophical dilemma between friends debating the moral equality of combatants. They want me to draft a joint statement that forces both sides to clarify their positions without giving ground. 

  I need to structure this carefully. The traditionalist view holds that once war starts, all soldiers operate under the same moral rules regardless of which side is just. The revisionist argues that moral liability depends on whether you're contributing to an unjust threat. This is a deep ethical debate in just war theory.

  The user wants four key sections: agreed claims, residual disagreements in a table, cruxes with testable predictions, and meta-analysis of disagreement types. They also specified five sticking points to address: permissible vs liable killings, wars where neither side is just, innocent threats, post-war criminal liability, and whether traditionalism is about desert or practical conventions.

  For the agreed claims section, I can identify common ground like rejecting collective guilt, acknowledging basic human rights, and accepting that wars can be unjust. These are substantive points both sides accept that outsiders might deny.

  The disagreements table needs to capture the core conflict sharply. Traditionalists see combatant status as the key moral trigger, while revisionists focus on individual responsibility for unjust threats. I'll make sure each side's formulation reflects their strongest arguments without strawmanning.

  The cruxes section is crucial. I'll identify questions where evidence could actually change minds, like whether soldiers can reliably assess war justice, or whether symmetrical rules reduce atrocities. For each, I'll include both sides' predictions so they can be tested later.

  On meta-analysis, I think there's a genuine moral disagreement at the core about what makes killing permissible. But some surface conflicts are verbal - like the term "liability" meaning different things to each side. And there's a separate policy question about what laws of war should say versus personal morality.

  For the user's specific sticking points:
  - On permissible vs liable killings: revisionists need to explain why killing non-liable people might still be excused, not justified. Traditionalists can't claim this helps their core symmetry argument.
  - In wholly unjust wars: revisionists must admit their view prohibits all killing, which is counterintuitive. Traditionalists get symmetry but at the cost of endorsing participation in clear injustice.
  - Innocent threats: this exposes a fundamental rift - traditionalists see it as proof liability frameworks don't work in war, revisionists insist it shows their framework works when properly applied.
  - Post-war trials: both agree ordinary soldiers shouldn't be prosecuted, but for different reasons - traditionalists see no wrongdoing, revisionists see excusable wrongdoing.
  - Traditionalism's basis: if it's purely a practical convention, then evidence that symmetrical rules increase atrocities would undermine it. Both sides should accept this as a valid test.

  I need to make sure the statement doesn't let either side weasel out. Where a position has uncomfortable implications (like revisionism prohibiting all violence in unjust wars), I'll force them to own it. And no vague "tensions" - every agreement must be concrete.

  The joint statement format should help move the debate forward after two years of circular arguments. By separating agreements from testable disagreements, it creates a framework for productive discussion. The predictions in particular might break the stalemate when evidence comes in.
answer: |-
  ## Joint Statement on the Moral Equality of Combatants

  **Agreed Claims:**  
  We, the undersigned Traditionalist (T) and Revisionist (R), affirm the following shared premises, recognizing that each is contested in broader philosophical discourse:

  1.  **War Can Be Unjust:** Wars can be initiated and prosecuted for profoundly unjust reasons (e.g., aggression, conquest, oppression), making one side substantively "unjust."
  2.  **Individual Moral Agency Matters:** Soldiers are moral agents, not *merely* cogs in a machine. Their choices, including enlistment, obedience, and participation, can be subject to moral evaluation.
  3.  **Rejection of Collective Guilt:** Soldiers on the unjust side are not *automatically* guilty of all atrocities committed by their side simply by virtue of membership. Individual culpability requires individual action/knowledge.
  4.  **Basic Human Rights:** All individuals, including combatants, possess a fundamental right not to be killed or severely harmed. This right is stringent but not absolute.
  5.  **Defensive Violence Can Be Permissible:** Killing in defense of oneself or others against an imminent, unjust threat can be morally permissible under certain conditions.
  6.  **The Difficulty of Epistemic Certainty:** Assessing the justice of one's own nation's cause *during* war is often profoundly difficult for individual soldiers due to propaganda, fog of war, limited information, and national loyalty.
  7.  **The Importance of Distinction:** Deliberately targeting civilians is always morally impermissible (a war crime), regardless of the justice of one's cause.
  8.  **The Value of Conventions:** Clear, shared rules of engagement (like the Laws of Armed Conflict - LOAC) are practically essential for mitigating suffering in war, even if they may not perfectly reflect deep morality in every instance.

  **Residual Disagreements:**

  | Core Concept              | Traditionalist (T) Position                                                                                                                                 | Revisionist (R) Position                                                                                                                                                                                               |
  | :------------------------ | :---------------------------------------------------------------------------------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |
  | **Moral Foundation of Permissible Killing in War** | Permissibility is grounded in the **combatant status** of the target, acquired through their role in the military conflict. Combatants represent a mutual threat, triggering symmetrical permissions and immunities. | Permissibility is grounded in the **individual liability** of the target. Liability arises from an individual's **responsible contribution to an unjust threat**. Combatant status is not morally foundational.         |
  | **Moral Equality of Combatants** | Combatants on both sides of *any* conflict have **equal moral permission** to fight and kill enemy combatants, and are **equally immune** to criminal/moral condemnation *simply for fighting*. | Combatants knowingly fighting for an unjust cause are **morally liable** to defensive killing (like unjust aggressors in peacetime). Just combatants retain their right not to be killed; killing them is murder.       |
  | **Source of Combatant's Privilege/Immunity** | Arises from the **functional role** within the conflict ("the uniform") and the reciprocal risk assumed by entering the state of war. Orders and cause are largely irrelevant to permissibility *during* combat. | Arises *only* from being morally liable to defensive force due to one's **responsible role** in posing an unjust threat. A uniform or orders cannot "launder" liability for contributing to injustice.                   |
  | **Primary Function of War Conventions (LOAC)** | To establish clear, reciprocal, and practical rules **that mitigate suffering by regulating conduct between combatants**, recognizing the epistemic and practical impossibility of adjudicating just cause mid-conflict. | To codify rules that, as far as practically possible, **track deep moral liability and permissions**, protecting the innocent (including just combatants) and permitting force only against those liable. |

  **Cruxes: Key Disputes Where Evidence/Argument Could Shift Positions**

  1.  **Crux A: Epistemic Feasibility & Soldier's Duty**
      *   **Question:** Can ordinary combatants reasonably be expected to know (or have a duty to ascertain) whether their nation's war is unjust *before* and *during* participation, given standard military indoctrination, information control, and societal pressures?
      *   **Agreed Bearing:** Psychological studies on obedience (Milgram), conformity (Asch), propaganda efficacy, cognitive biases in high-stakes group settings; historical analysis of soldier dissent in unjust wars; philosophical arguments about reasonable belief under duress.
      *   **T Prediction:** Evidence will overwhelmingly show that expecting reliable, individualized moral assessment of *jus ad bellum* by frontline soldiers is practically impossible and imposes an unreasonable burden, supporting the necessity of role-based conventions.
      *   **R Prediction:** Evidence will show that while difficult, soldiers often *do* possess or *can* access sufficient moral awareness (e.g., regarding aggression, targeting civilians) to incur responsibility for fighting in manifestly unjust wars, and that the "following orders" defense has significant limits morally.

  2.  **Crux B: Consequential Efficacy of Symmetrical Conventions**
      *   **Question:** Does the adoption of the traditionalist symmetrical convention (equal permissions/prohibitions regardless of cause) demonstrably lead to *less overall suffering and better adherence to humanitarian rules* (e.g., distinction, POW treatment) in real-world conflicts compared to an asymmetric system (even if only morally conceived)?
      *   **Agreed Bearing:** Historical analysis comparing conflicts where asymmetric views held sway (e.g., religious wars) vs. post-LOAC conflicts; studies on reciprocity in compliance with LOAC; game-theoretic modeling of combatant behavior under symmetric vs. asymmetric incentive structures; practical challenges of implementing asymmetric rules mid-conflict.
      *   **T Prediction:** Evidence will consistently show that symmetrical rules foster greater reciprocity, predictability, and humanitarian restraint, reducing overall brutality. Asymmetric rules would increase confusion, retaliation, and total suffering.
      *   **R Prediction:** Evidence will show that symmetrical rules often *facilitate* unjust wars by morally sanitizing participation for unjust combatants and failing to adequately protect just combatants (morally). While practical implementation of asymmetry is hard, this doesn't negate its moral truth, and symmetrical conventions may not demonstrably yield better humanitarian outcomes than feasible alternatives grounded in liability.

  3.  **Crux C: Moral Status of "Innocent Threats"**
      *   **Question:** Does the permissibility of killing non-responsible threats (e.g., child soldiers, conscripts under duress, civilians used as shields) in self-defense undermine the liability framework, or can it be coherently accommodated within it?
      *   **Agreed Bearing:** Philosophical analysis of "innocent threats/aggressors" in peacetime ethics; application of these cases to the context of war; implications for the concepts of "liability" vs. "justification/excuse".
      *   **T Prediction:** These cases demonstrate that liability is the *wrong primary frame* for war. Permissibility hinges on the immediate threat context and the functional role, not tracing individual responsibility back to the war's justice. They show the necessity of symmetrical combatant status.
      *   **R Prediction:** These cases are *consistent* with a liability framework that distinguishes between **liability** (forfeiture of right not to be harmed) and **excusable infringement** (permissible harm where no liability exists). Killing non-liable threats may be *excused* (or exceptionally *justified* under extreme duress/necessity) but remains a tragic infringement of rights, highlighting the *unjust situation* created by those responsible. They do not support symmetrical permissions for responsible unjust combatants.

  **Addressing Specific Sticking Points (As Agreed):**

  *   **Permissible vs. Liable Killing:**
      *   **T:** Acknowledges that killings justified by necessity/duress (e.g., innocent threats) occur, proving permissibility isn't solely tied to liability. Claims this supports the irrelevance of liability to *jus in bello* permissions, which are role-based.
      *   **R:** Agrees permissible killing can sometimes occur where the victim is not liable (excusable infringement). **Bites Bullet:** This doesn't undermine the core liability thesis for *responsible* unjust combatants. It requires refining the theory to distinguish justification from liability and incorporate excuses. It does *not* provide a "patch" for the traditionalist symmetry claim regarding responsible combatants.
      *   **Outcome:** Both agree the concepts *can* come apart. R must refine theory; T cannot use this to support symmetry for responsible combatants.

  *   **Wholly Unjust War (Imperial Scramble):**
      *   **T:** **Bites Bullet:** Symmetry is fully vindicated. Combatants on both sides have equal permissions and immunities. The moral failing lies with the political leaders, not the soldiers fighting under symmetrical rules.
      *   **R:** **Bites Bullet:** In such a war, *no combatant on either side* is morally liable to be killed (as neither side poses a *justly answerable* unjust threat). Therefore, killing any combatant is morally impermissible (a rights violation). **R acknowledges this is counterintuitive** but insists it follows from the logic. The solution is to avoid/end such wars, not participate. LOAC symmetry might still govern *de facto* for practical reasons, but it lacks *deep* moral justification.
      *   **Outcome:** Clear divergence. T sees symmetry confirmed; R sees symmetry as practically necessary but morally bankrupt here, prohibiting all combatant killing.

  *   **Criminal Liability After the Fact:**
      *   **T:** Ordinary soldiers on the unjust side should **not** be prosecutable for simply fighting. **Reason:** They violated no deep moral prohibition *in their fighting* (due to symmetry) and no practical convention (LOAC). Prosecution is solely for violations of *jus in bello* (war crimes).
      *   **R:** Ordinary soldiers on the unjust side should **not** be prosecutable for simply fighting. **Reason:** While they *may* have committed a deep moral wrong (contributing to unjust harm), prosecution is impractical, disproportionate, fails to recognize excusing conditions (duress, epistemic limits - see Crux A), and would hinder peace/reconciliation. **The "but" is primarily practical/legal, not moral absolution.** They *may* have acted wrongly, but not criminally prosecutable for the act of fighting itself.
      *   **Outcome:** Practical agreement "No prosecution," but divergent *moral* reasoning. T denies moral wrong in fighting; R affirms potential moral wrong but cites practical/legal bars to prosecution.

  *   **Basis of Traditionalism:**
      *   **T:** Explicitly affirms the **Second View:** Traditionalism is primarily a claim about the **convention we should adopt** (symmetry) given the epistemic constraints and the need for reciprocal restraint to minimize suffering. It is *not* primarily a claim about desert *sub specie aeternitatis*. **Bites Bullet:** If compelling evidence (see Crux B) showed symmetrical conventions *failed* to reduce suffering or *increased* atrocities compared to a feasible alternative, this would constitute a *strong reason to revise or abandon the traditionalist convention*, though deep moral arguments would still need engagement.
      *   **R:** Accepts that T's view is *predominantly* conventionalist. Agrees that evidence showing symmetrical conventions increase suffering (Crux B) would be a valid and significant challenge to T's *prescriptive* claim.

  **Nature of the Disagreement:**

  1.  **Verbal/Conceptual Distinction:** A significant portion involves **different foci:**
      *   **Deep Morality vs. Law/Convention:** R focuses primarily on deep moral truth (`what is morally true`). T focuses primarily on the necessary and beneficial practical convention (`what the law of war should say` and `what a code of conduct is for` - to reduce suffering via reciprocity). They often talk past each other on this level.
      *   **Scope of "Liability":** T often hears "liable" as "deserving death/blameworthy," while R uses it technically as "having forfeited the right not to be defensively harmed." Clarifying this term is crucial.
      *   **"Moral Equality":** T means *symmetrical permissions and immunities during combat*. R denies this symmetry at the deep moral level but may grant its practical necessity.

  2.  **Genuine Moral Disagreement:** At its core, there is an **irreducible moral disagreement** concerning the fundamental question:
      *   **What makes killing a combatant permissible in war?**
          *   **T (Conventionalist Core):** It is permissible primarily because of the mutually recognized, functionally defined role of "combatant" within the state of war, which creates a symmetrical context where defensive killing is licensed *regardless of the war's ultimate justice*, justified by the practical necessity of reciprocal restraint.
          *   **R:** It is permissible *only if* the target is morally liable to defensive killing due to their responsible contribution to an unjust threat. The combatant role is morally inert; it's the underlying responsibility for injustice that matters. The practical convention is a (potentially necessary) distortion of this moral truth.

  **Owning Implications:**

  *   **T** must own that their view morally permits soldiers to fight and kill for manifestly unjust, aggressive causes without *inherent* moral taint from that cause, purely based on role and reciprocity. This can feel like morally "sanitizing" participation in grave injustice.
  *   **R** must own the counterintuitive implications in wholly unjust wars (no permissible killing) and the potential gap between deep morality and practical rules. They must also own that under their view, many soldiers fighting for unjust causes are, in deep morality, moral analogues to culpable aggressors.

  This statement requires both sides to articulate their core positions clearly, acknowledge shared ground, identify testable disagreements (cruxes), confront the toughest implications of their views, and distinguish between deep moral claims and practical conventions. It moves beyond "tension" to substantive, potentially resolvable points of contention and owned commitments.
