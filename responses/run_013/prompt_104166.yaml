  ## Sphex Program

  Her venom leaves the cricket still as stone,  
  a cargo hauled through grasses roughly sown.  
  **She checks the burrow yet again alone.**  

  Amber shell gleams in the sun's last light,  
  paralysis a temporary throne  
  **she checks the burrow yet again alone.**  

  Before the dark and narrow tunnel's mouth,  
  she drops her burden on the earth, half-known,  
  **then turns to see if shadows fill the space.**  

  The cricket waits beside the dust-choked door,  
  a heavy offering on barren ground.  
  **She checks the burrow yet again alone.**  

  A careful scuttle through the earthen gloom,  
  a pause where unseen chambers must be found  
  **then turns to see if shadows fill the space.**  

  A finger moves the cricket just aside.  
  She buzzes out, her senses tightly wound,  
  **she checks the burrow yet again alone.**  

  The prize misplaced! With patient, dragging gait,  
  she hauls it back, reclaims the starting place.  
  **Then turns to see if shadows fill the space.**  

  Black antennae wave the ancient sign  
  while deeper instincts hold her on the line.  
  **She checks the burrow yet again alone.  
  Then turns to see if shadows fill the space.**  

  ---

  **Explanation:**

  *   **Form as Argument:** The villanelle's rigid structure, with its inevitable return of the refrains regardless of the narrative, perfectly embodies the wasp's fixed action pattern. The refrains *must* come back, just as the wasp *must* repeat the check.
  *   **Refrain 1 (Compulsion):** "**She checks the burrow yet again alone.**" This is the core, unvarying action – the repetitive, seemingly pointless verification.
  *   **Refrain 2 (Potential Break/Flexibility):** "**Then turns to see if shadows fill the space.**" This focuses on the *action* of looking, subtly implying the *possibility* that this time, the looking might yield different information or trigger a different outcome ("what if she carried it in?"). It's the crack where free will *might* theoretically enter, but the action remains the same.
  *   **Final Quatrain:** The forced juxtaposition of both refrains ("She checks the burrow... / Then turns to see...") places the rigid compulsion and the potential for change (the act of observation) side-by-side. The poem ends here, unresolved. The form itself demonstrates the tension: the compulsion repeats *and* the act of checking remains. Does the repetition negate the potential implied in the looking? Or is the looking itself the only flicker? The reader familiar with the debate feels the weight of the deterministic loop pressing against the fragile window of "what if?"
  *   **Accuracy:** Details like paralysis, dragging, dropping at the door, the check, and the reset if disturbed are included without embellishment.
  *   **No Name-Dropping:** The philosophical weight is carried entirely by the wasp's behavior mirrored in the poem's form and the specific wording of the refrains, avoiding any explicit philosophical terminology.
