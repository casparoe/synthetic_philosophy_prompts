  The deeper need: The user is exploring free will vs. determinism through poetry. They want the form to embody the argument, not just describe it. The villanelle's inevitability mirrors the wasp's behavior, making the reader feel the compulsion. The unresolved ending lets the debate linger, satisfying the philosophical curiosity without preaching.

  Potential pitfalls: Forcing rhymes, losing biological accuracy, or resolving the debate. Must keep refrains central, let the repetition feel mechanical. Check that each stanza advances the story while circling back. Ensure the last stanza's juxtaposition is stark, highlighting the tension.

  Refining lines: Start with paralysis, then dragging, the door ritual, the interference by humans, the endless loop. End with the quatrain where both refrains meet, emphasizing the trapped cycle versus the fleeting "what if."

