  First, I need to understand the villanelle form: 19 lines, five tercets and a quatrain, with two repeating refrains (A1 and A2). The refrains must alternate and end together in the final stanza. For the wasp's compulsion, the first refrain should capture the unchanging action, like "she checks the burrow yet again" or something similar. The second refrain needs to hint at the possibility of breaking the loop, such as "what if she carried it inside?"

