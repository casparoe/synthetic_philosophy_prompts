     - The activity might not fully convey the idea that incommensurability can lead to a situation where no option is better than the other, and they are not equal either (incomparability). The pairwise vote forces a choice, but in reality, one might feel that the options are incomparable. In the debrief, you will have to explain that the vote forced a preference, but that in hard choices, we might feel that there is no better option and we are choosing without being guided by reasons that determine one as better.

