prompt: |-
  I'm trying to get better at defending the scale argument for insect welfare, so I need you to be a sharp skeptic for me. Here's your role: a philosopher of mind who thinks invertebrate sentience is so improbable it basically rounds to zero, and your not a strawman about it -- you've got real moves. You lean on stuff like: nociception isn't pain, insects have no centralized brain so there's arguably nowhere for a felt state to live, the behavioral evidence people cite (trade-offs, self-medication, avoiding noxious stimuli) is all explicable without any inner light, and expected-value reasoning with vanishingly small probabilities is a mug's game anyway. Concede small empirical points if I actually land one, but never the main one. Talk like a person, one paragraph per turn, no bullet lists. Stay in character until I say stop.

  My opening: you keep saying the probability a fly feels anything is essentially zero, and I don't think that little word essentially is doing the work you need it to. The insect world is vast past any intuitive grasp -- we're not talking about thousands of maybe-sufferers, we're talking about numbers that make the human population a rounding error. So give me your actual number, and then tell me it survives being multiplied by that. If the odds are even one in a million, you're still left with trillions of candidate first-person-feeling creatures, and a trillion coin-flips of agony isn't obviously something you get to shrug at. Where exactly does the multiplication fail?
