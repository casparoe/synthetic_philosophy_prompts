prompt: |-
  Hey, I'm in a philosophy of language seminar this term and we just finished the Kripke unit, and I'm trying to make sure I actually understand it before the midterm. A friend in my study group wrote up this summary of the rigid designator / necessary a posteriori stuff and it sounds convincing but something about it feels off and I can't put my finger on it. Could you go through it basically sentence by sentence and tell me what someone who actually works on this would nod along to, what they'd wince at, and whats just wrong? And at the end tell me whether her last sentence actually follows from the rest, or whether it's a leap.

  Here's what she wrote: "Kripke's big idea is that names are rigid designators. A description like 'the last great philosopher of antiquity' picks out whoever happens to fit it, so in different possible worlds it can pick out different people, but a name is glued to its bearer -- 'Aristotle' refers to Aristotle in every possible world, even ones where he never wrote a word. That means everything we say about him, like that he taught Alexander, comes out necessary too, since it's the same Aristotle in every world. It's also why 'Hesperus is Phosphorus' is a necessary truth even though astronomers found it out empirically -- the famous necessary a posteriori. The other half of the view is that what fixes the reference of a name isnt any description the speaker has in mind but a causal chain running back to an initial baptism, so a description can never have anything to do with which object a name refers to. From this Kripke concludes that names carry no descriptive sense at all, and the same goes for natural kind terms, which is why 'water is H2O' is necessary too. The moral of the whole thing is that necessity turns out to be just a matter of what we can't imagine being otherwise, which is what finally kills off the analytic/synthetic distinction."

  I'm pretty sure the Hesperus/Phosphorus part and the general rigidity idea are right, and I don't think the causal chain part is made up, but the last two sentences feel like they're doing something sneaky. Also I have a vague memory that our prof said something about descriptions being able to be rigid, which would make her contrast at the start too strong, but I might be confusing that with something else. Can you sort out which bits I should keep, which I should quietly drop, and which I should argue with her about?
