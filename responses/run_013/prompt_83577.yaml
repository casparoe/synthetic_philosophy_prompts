prompt: |-
  I teach a first-year seminar on the First World War and its aftermath, and I have stumbled into something I am not equipped to resolve. My students arrive holding two beliefs that pull in opposite directions, and I suspect I have been teaching them both without noticing. The first is that responsibility for 1914 is a live moral question about a nation: the 1919 settlement obliged Germany to accept responsibility for causing the loss and damage of the war, and although the clause's own words are those of a legal liability rather than a moral verdict, it was read at once, in Germany and outside it, as a judgment on the German people — and the great postwar quarrel among historians over whether the German leadership had deliberately aimed at a war of European domination, the quarrel that made Fritz Fischer's name in the early 1960s, was understood by his critics and his defenders alike as a quarrel about the German present at least as much as about 1914. The second belief, which I teach in the same term, is the Nuremberg principle that responsibility under international criminal law attaches to persons and not to states or nations, and that only persons can be tried and punished for it. Yet the same order that rests on that principle holds states liable for reparations, receives apologies offered by governments on behalf of their peoples, and speaks without embarrassment of a nation's responsibility to remember what it did.

  What I want from you is not another verdict on 1914 — I have colleagues for that, and my students can read them. What I want is an account of what these practices presuppose, and of what follows from that. Does a treaty clause of that kind presuppose that a nation can be responsible in the strict sense, or only that it is useful to write as though it could? Does the Nuremberg principle contradict it, or can the two coexist because they divide the labour between them — individual guilt in criminal law, collective liability in the political settlement? Is there a single theory of collective responsibility that licenses both, or is the appearance of consistency merely the truce between two institutions that never had to agree with one another? I would also like you to be explicit about where these practices are philosophically underdetermined: which rival theories of collective responsibility would fit the evidence equally well, and where the practice is doing work that no theory is really needed to underwrite. And if I were to tell my students what would have to change under a thoroughgoing individualist account of responsibility, and then under a thoroughgoing collectivist one, what should I say about each element — the peace settlement, the criminal tribunal, the apology, the reparations payment?

  Please lead with your bottom line in the first sentence and then give your reasoning in full, with no preamble and no restating of my question.
reasoning: |-
  Okay, let me tackle this professor's complex question about collective vs individual responsibility in historical contexts. The core tension they're facing in teaching WWI history is how to reconcile two seemingly contradictory concepts: the Treaty of Versailles' collective attribution of war responsibility to Germany with the Nuremberg Trials' principle of individual criminal accountability. 

  First, I need to acknowledge that these are parallel frameworks rather than conflicting ones. The legal distinction is crucial here - the Versailles settlement operated under international public law regarding state liabilities, while Nuremberg established individual criminal responsibility under international criminal law. They coexist because they address fundamentally different questions: "Who pays?" versus "Who goes to jail?"

  When examining the philosophical underpinnings, I notice the professor wants clarity on what theories support these practices. For collective liability like reparations, the "joint commitment" theory seems applicable - states as entities capable of bearing obligations. Meanwhile, apologies operate in the moral/political realm where representation theory allows governments to speak for national communities. 

  The interesting philosophical gap appears in how we discuss "national responsibility" - it's neither pure legal fiction nor metaphysical truth, but a practical convention. Different theories (like Margaret Gilbert's plural subjects or Christopher Kutz's complicity models) could equally explain this, showing the practice is underdetermined by philosophy. 

  For the classroom application, I should contrast pure individualism (which would dismantle state apologies and reparations) versus radical collectivism (which risks violating individual rights). The professor needs to show students how our actual institutions navigate between these poles - using collective mechanisms for repair while guarding against blanket moral condemnation through individual due process. 

  The key teaching point might be that these frameworks emerged from specific historical needs: Versailles addressed inter-state relations post-war, while Nuremberg responded to unprecedented atrocities. Their coexistence reflects pragmatic solutions rather than philosophical consistency. Students should understand that historical responsibility operates on multiple simultaneous tracks - legal, moral, political - each with their own rules.
answer: |-
  **Bottom line:** The practices coexist because they address distinct questions—political settlements demand collective liability for repair, while criminal justice demands individual accountability for wrongdoing—and they rest on different conceptions of collective responsibility that are pragmatically compatible but philosophically distinct, with no single theory fully unifying them.  

  ### Reasoning:  
  1. **Treaty Liability vs. Nuremberg Principle:**  
     - **Versailles’ "Responsibility" Clause (Article 231):** This is a *legal-political* device for assigning **state liability**, not moral guilt. It presupposes that *states*, as corporate entities, bear obligations under international law (e.g., reparations) for harms originating from their sovereign actions. It operates on a **functional theory of collective liability**: states are treated *as if* responsible because they control resources, command armies, and can pay reparations. This is not about *moral blame* but about *practical attribution* for securing peace.  
     - **Nuremberg Principle:** This is a *criminal-legal* doctrine focused on **individual culpability** for atrocity. It rejects *collective guilt* (e.g., "all Germans are war criminals") to uphold liberal justice: only persons who planned/executed crimes can be punished. It presupposes that moral agency requires intent and capacity, which only individuals possess.  

  2. **Coexistence Through Division of Labor:**  
     - **Reparations/Apologies** belong to the realm of **interstate relations**. Here, "national responsibility" is shorthand for:  
       - *State obligation* (reparations as a debt of the polity, enforced via treaties).  
       - *Symbolic representation* (apologies: governments act as custodians of a nation’s institutional continuity, acknowledging harm without implying universal guilt).  
     - **Criminal Trials** belong to **individual justice**. They surgically isolate perpetrators to avoid scapegoating and uphold rule-of-law norms.  
     - **No contradiction**: One addresses *who pays* (the state treasury), the other *who hangs* (the individual perpetrator). They are complementary tools for post-conflict resolution.  

  3. **Philosophical Underdetermination:**  
     - **Collective Liability (Reparations):** Compatible with:  
       - *Joint Commitment Theory* (states as agents via shared institutions).  
       - *Consequentialism* (assigning liability to states is efficient for repair).  
       Either works; no metaphysics is needed.  
     - **Apologies:** Fit both:  
       - *Authorization Theory* (leaders represent collective identity).  
       - *Narrative Theory* (apologies redefine a nation’s story).  
       Practice here is *conventional*—no deep theory required.  
     - **Criminal Individualism:** Only individualist theories (e.g., Kantian agency) fit Nuremberg.  

  4. **What Changes Under Rival Theories?**  
     - **Thoroughgoing Individualism (e.g., Methodological Individualism):**  
       - *Peace Settlement*: Reparations become unjust; only guilty individuals should pay.  
       - *Criminal Tribunal*: Unchanged (fits perfectly).  
       - *Apology*: Illegitimate; only perpetrators can apologize.  
       - *Reparations*: Shift to confiscating convicts’ assets—likely inadequate for war-scale damage.  
     - **Thoroughgoing Collectivism (e.g., Holism):**  
       - *Peace Settlement*: Reparations expand into collective punishment (e.g., entire populations deemed culpable).  
       - *Criminal Tribunal*: Undermined; groups, not persons, stand trial (violating due process).  
       - *Apology*: Becomes a confession of collective sin.  
       - *Reparations*: Moralized as "blood money" owed by the nation-entity.  

  ### Conclusion for Your Students:  
  These practices reflect *pragmatic institutional logic*, not philosophical coherence. Versailles-style settlements use "responsibility" as a *legal fiction* to bind states to material obligations. Nuremberg safeguards against moral overreach by individualizing guilt. Apologies and reparations function as *political rituals*—enabled by the state’s role as proxy for the collective—without requiring belief in group minds or shared guilt. The tension arises because **law and politics deploy collective responsibility instrumentally, while criminal justice insists on moral individualism**. They coexist because they answer different needs: repair versus retribution, stability versus accountability. No grand theory resolves this; it’s a negotiated truce in how we manage historical wrongs.
