  The two cases are important. For the first case (symmetric inside, asymmetric outside), the theory must handle situations where internal perspectives match but an external view shows miscalibration. This pushes against purely first-person peer identification. For the second case (agreement on facts, disagreement on symmetry-breaking), it tests whether theories can handle meta-evidential disputes without collapsing into dogmatism.

  I'll structure the desiderata starting with core epistemic principles like Accuracy Motivation and Evidence Completeness, then move to peer-specific ones like Peer Identification and Symmetry Constraint. The user's mention of external track records means Peer Fallibility must be included. The Self-Application requirement is crucial but tricky—theories shouldn't self-destruct when applied to their own claims.

  For peerhood identification, the cases show it can't be purely first-person; external calibration matters, but agents may lack access to that data. This tension needs highlighting.

  The most excluding requirement is likely Symmetry Constraint—it forces conciliation in peer disputes, which steadfast theories reject. The sharpest conflict is between Self-Application and Symmetry Constraint: if a conciliatory theory demands symmetry but can't symmetrically apply to itself, it fails its own rule.

  On equal-weight vs. steadfast: equal-weight struggles with the second case (meta-evidence disagreement) and peer identification without external data. Steadfast views handle asymmetry better but risk underestimating peer input and failing Self-Application when defending dogmatism.

  I should emphasize tensions—especially how Self-Application might be impossible for strict conciliation—and flag that peerhood assessment's limitations are central to both test cases. The user's suspicion about self-application is spot-on; I'll make it a key point.
answer: |-
  Here are the desiderata for an adequate theory of peer disagreement, designed to address your cases and core epistemic concerns. Requirements marked with ** are widely accepted as genuine; others may reflect camp-specific intuitions.

  ---

  ### **Core Desiderata**
  1. **Accuracy Motivation** (**Genuine Requirement**)  
     *The theory must prioritize reaching true beliefs.*  
     **Motivation**: Epistemology aims at truth. Responses that systematically undermine accuracy (e.g., always deferring) are inadequate.  
     **Implications for peerhood**: Peer identification must track reliability, not just perceived competence.

  2. **Evidence Completeness** (**Genuine Requirement**)  
     *The theory must require agents to consider all relevant evidence, including the disagreement itself.*  
     **Motivation**: Ignoring higher-order evidence (e.g., a peer’s dissent) is epistemically irresponsible.  
     **Case 2 Application**: Disagreements about symmetry-breaking *are* evidence—the theory must explain how to weigh meta-evidential disputes.

  3. **Peer Identification Constraint** (**Genuine Requirement**)  
     *Peerhood must depend on objective reliability/competence with the evidence—not merely subjective impressions.*  
     **Motivation**: Prevents bootstrapping (e.g., dismissing critics by denying peer status arbitrarily).  
     **Case 1 Implication**: External track records reveal true peerhood; first-person identification is fallible. Theories must accommodate this asymmetry.

  4. **Symmetry Constraint** (**Contentious**)  
     *In symmetric peer disagreements (same evidence, equal competence), agents should significantly revise their beliefs.*  
     **Motivation**: Equal weight views argue that dissent from a genuine peer is strong evidence against one’s position.  
     **Objection (Steadfast)**: Collapses distinctions when agents reasonably weight evidence differently (*Case 2*).

  5. **Asymmetry Accommodation** (**Genuine Requirement**)  
     *The theory must permit non-conciliatory responses when peerhood is undermined (e.g., via track records).*  
     **Motivation**: *Case 1* shows external asymmetry matters. Agents should leverage known reliability data.  
     **Peerhood Identification**: First-person standpoint *cannot* always detect asymmetry (e.g., hidden miscalibration).

  6. **Self-Application Consistency** (**Genuine Requirement**)  
     *The theory’s norms must apply reflexively to disagreements about the theory itself.*  
     **Motivation**: Avoids self-exemption (e.g., "My theory says conciliate, but I won’t conciliate about this theory").  
     **Suspected Conflict**: May clash with *Symmetry Constraint* if the theory demands conciliation but rejects conciliation about its own truth.

  7. **Meta-Evidential Sensitivity** (**Genuine Requirement**)  
     *Must resolve disputes where parties agree on first-order facts but disagree on their evidential significance (Case 2).*  
     **Motivation**: Such disagreements test whether theories can handle reasoning about evidence itself.  
     **Implication**: Distinguishes between disputes about facts vs. norms of reasoning.

  8. **Peer Fallibility** (**Genuine Requirement**)  
     *Must acknowledge peers can reasonably disagree initially, yet avoid implying all disagreements are unresolvable.*  
     **Motivation**: Preserves rationality while allowing for progress (e.g., via new evidence or calibration).

  ---

  ### **Peerhood Identification**
  - **Objective Basis**: Peerhood requires comparable reliability *relative to the disputed question and evidence*.  
  - **First-Person Limits**: Agents can only assess *apparent* peerhood (shared evidence, competence, sincerity). *Case 1* proves objective peerhood (track records) may be inaccessible internally. Adequate theories must accept this limitation and permit external-data overrides.

  ---

  ### **Most Excluding Requirement**  
  **Self-Application Consistency** eliminates theories that:  
  - Advocate steadfastness but demand conciliation when their own tenets are challenged.  
  - Prescribe conciliation but exempt themselves (inconsistent universalization).  
  *This forces theories to "eat their own cooking," exposing vulnerabilities.*

  ---

  ### **Suspected Unresolvable Conflict**  
  **Symmetry Constraint** vs. **Self-Application Consistency**:  
  - If symmetry requires conciliation in peer disputes, but *the theory itself is disputed by peers*, it must demand conciliation about its own correctness.  
  - This risks infinite regress (conciliate to what?) or self-undermining (if conciliation leads to rejecting the theory). Steadfast views avoid this but face accuracy-motivation challenges.

  ---

  ### **High-Level Assessment of Major Families**  
  - **Equal-Weight Views**: Struggle with *Case 1* (external asymmetry) and *Case 2* (meta-evidence disputes). Strong on *Symmetry* but risk violating *Self-Application* if they dismiss objections asymmetrically.  
  - **Steadfast Views**: Handle *Case 1* and *Case 2* better (allowing evidence-weighting asymmetry) but risk violating *Peer Fallibility* or *Evidence Completeness* by underestimating peer dissent. Often fail *Symmetry Constraint*.  

  **Key Tension**: Both families face pressure from **Self-Application**—especially conciliationism, which may self-destruct under its own norms.
