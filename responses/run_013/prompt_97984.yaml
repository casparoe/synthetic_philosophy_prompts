prompt: |-
  Last weekend I spent a long drive arguing with a friend — a philosopher of science — about whether a model's assumptions have to be realistic. Her stated view is the F-twist: assumptions may be as false as you like so long as the predictions come out right, and asking after their truth is a category mistake. But her verdicts on particular cases were more discriminating than that slogan, and I can no longer tell which rule she is actually running. Her track record:

  Frictionless planes and ideal pendulums, used to derive equations of motion: legitimate. A frictionless surface, she says, is not a falsehood about the world but a statement about a limit, and we know how the equations deform when friction is switched back on.
  The ideal gas law applied to a dilute gas: legitimate.
  An enzyme-kinetics model that posits a constant steady-state concentration of an intermediate complex to obtain a simple rate law, though no molecule literally holds that concentration fixed: legitimate.
  A model of a large stirred reactor that assumes perfect spatial mixing, used to predict bulk yields: legitimate.
  A model that assumes an unlimited resource, derives indefinite exponential growth, and is then used to forecast a real fishery's catch: not legitimate.
  A model that assumes an infinite, unstructured host population to conclude that a pathogen cannot invade, applied to a small structured population: not legitimate; she says the assumption is doing the work.
  A model whose false assumption is neither a limit of any more detailed treatment nor removable, and whose predictions are contradicted in the domain of use: not legitimate.

  The new case: a macroeconomist models an entire economy as one immortal representative household with stable preferences, solves for the equilibrium path, and predicts how aggregate consumption responds to a tax change. The predictions track aggregate data well enough that a finance ministry uses them. But the representative household is not the limit of any finer-grained model she will accept — there is no knob you can turn down to get from a heterogeneous economy to a representative one — and the result is load-bearing: spread the same preferences across households with idiosyncratic shocks and the predicted response changes materially, reversing sign over part of the relevant range.

  Tell me how she will rule. Set out the two or three most plausible rules her record could be tracking, say what each predicts about the representative-agent case, give your best guess at the one she is running and why, and name the single further case that would best separate the rules that agree on the new case. She will not accept an answer that says it depends on the purpose.

  Start with a one-sentence verdict, then a compact table of the candidate rules against the new case, then the argument. No more than 650 words, and no reading list.
reasoning: |-
  Hmm, the user presents a complex philosophical puzzle about the legitimacy of unrealistic assumptions in scientific models, based on their friend's seemingly inconsistent rulings. The core tension is between the friend's stated adherence to Milton Friedman's "F-twist" (assumptions don't need realism) and her actual case-by-case judgments that show nuance.

  First, I need to analyze the pattern in her past rulings. The legitimate cases share common features: frictionless planes and ideal pendulums are mathematical limits where we know how to add complexity; the enzyme kinetics uses a steady-state approximation that's mathematically justified; the reactor model's perfect mixing is a practical simplification for bulk predictions. In contrast, the rejected cases involve false assumptions that actively drive the result: unlimited resources directly cause exponential growth, infinite populations prevent pathogen invasion, and the contradicted model has no redeemable features.

  The representative household case is tricky. While it successfully predicts aggregate data, the assumption isn't a limit case (no "knob" to reduce heterogeneity), and crucially, the result reverses when heterogeneity is introduced. This mirrors the rejected pathogen model where the false assumption was "doing the work."

  For candidate rules, I consider three possibilities:
  1) Strict F-twist would approve any predictive model, but this contradicts her rejections.
  2) Limit-based justification fits most approved cases but struggles with the enzyme example.
  3) The "non-load-bearing falsehood" rule explains all judgments: false assumptions are acceptable only if they don't materially alter core predictions when corrected.

  The macroeconomic model fails rule 3 because introducing heterogeneity reverses predictions. To test competing rules, I'd propose a model with a false assumption that's neither a limit nor load-bearing but still predictive - like using constant gravity in local projectile motion despite known variations, where adding realism wouldn't meaningfully change trajectory predictions.

  The user wants a decisive verdict without "it depends" escapes, so I'll structure the response with: one-sentence ruling, comparison table, then reasoning focused on how the representative agent assumption actively distorts causality rather than merely simplifying.
answer: |-
  **Verdict:** She will rule the representative-agent macroeconomic model **not legitimate.**

  **Candidate Rules & Predictions:**

  | Rule Description                     | Prediction for Rep-Agent Model | Why                                                                 |
  | :----------------------------------- | :----------------------------- | :------------------------------------------------------------------ |
  | **1. Predictive Power Alone (Strict F-Twist)** | Legitimate                     | Predictions track aggregate data well; truth of assumptions irrelevant. |
  | **2. Assumption as Mathematical Limit**       | Not Legitimate                 | No "knob" to turn heterogeneity down to zero; not a limit case.     |
  | **3. Non-Load-Bearing Falsehood**    | Not Legitimate                 | Assumption is load-bearing: adding heterogeneity materially changes/reverses the predicted response. |

  **Argument:**
  Her record consistently rejects models where the *specific false assumption* is essential to the derived result ("doing the work") and its falseness in the application domain directly invalidates the causal mechanism or prediction (e.g., unlimited resource => growth, infinite pop => no invasion, contradicted predictions). Legitimate cases involve falsehoods that are either mathematical limits (frictionless plane, ideal gas limit) or approximations that simplify without fundamentally altering the core predicted relationship *in the intended domain* (steady-state complex, perfect mixing for bulk yields – the deviation is quantifiable and doesn't reverse the result).

  The representative-agent model fails her implicit **Rule 3 (Non-Load-Bearing Falsehood)**. While predictive for aggregate data, the false assumption (no heterogeneity) is demonstrably "load-bearing": introducing heterogeneity (the real condition) *materially changes and even reverses* the predicted response to the tax change. This mirrors the rejected pathogen model (infinite unstructured pop assumption prevents invasion, which fails for small structured pops) – the false premise is central to the derivation and its falseness in the application domain undermines the result. The lack of a clear limit case (**Rule 2**) further weakens its standing. **Rule 1 (Strict F-Twist)** aligns with her stated slogan but clashes with her rejections.

  **Best Guess:** She is running **Rule 3 (Non-Load-Bearing Falsehood)**. It best explains her pattern: approving simplifying assumptions that don't *cause* the core result (even if untrue) and rejecting those that do.

  **Discriminating Case:**
  A model predicting planetary orbits using Newtonian gravity, assuming constant `g` (false, as `g` varies slightly), where predictions match observations perfectly *for practical purposes*, and adding variable `g` changes the predicted orbits only negligibly (e.g., sub-millimeter deviation over years). This tests **Rule 3 vs Rule 2**:
  *   **Rule 3:** Legitimate (false `g` not load-bearing for practical prediction).
  *   **Rule 2:** Not Legitimate (constant `g` isn't the limit of a finer relativistic model in the same way frictionless is limit of frictional).
