answer: |-
  Right, you're absolutely on to a fundamental tension here, and you haven't got it arse-backwards at all. It's a genuine philosophical puzzle within that view. Here's how to explain it clearly for your UK desk, cutting through the jargon:

  **The Core Issue:** It feels like the "lexical threshold" view wants to have its cake and eat it. It insists pleasure and pain are fundamentally *different kinds* of value (incommensurable), yet it *also* claims a sufficiently large pain *trumps* any amount of pleasure. That trumping sure looks like a comparison!

  **The Resolution (for your paragraph):**

  Think of it like this:

  1.  **No Common Currency:** Proponents argue you *can't* meaningfully add up units of pleasure and subtract units of pain on a single scale to find a net total. They aren't exchanging "pleasant pounds" for "painful pence". There's no universal conversion rate. This is the "incommensurable" bit.
  2.  **The Lexical Priority:** However, they *do* believe there's a strict **hierarchy of moral importance.** Avoiding intense suffering occupies a categorically higher moral tier than promoting pleasure. Once suffering crosses a certain threshold of intensity or awfulness, it becomes the *only* thing that morally matters in that situation.
  3.  **It's a Moral Switch, Not a Scale:** The threshold isn't a point on a shared pleasure-pain scale. It's more like a tripwire that flips the moral calculus into a different mode. Below the threshold, *maybe* you weigh things (though even that might be messy). *Above* the threshold? The moral imperative becomes solely: **"Reduce this suffering NOW."** No amount of future or distant pleasure is relevant to that immediate command. Pleasure considerations are simply switched off.

  **Why it's not a contradiction (their argument):**

  *   **Comparing Importance, Not Quantities:** They aren't saying "1,000,000 units of pain > 1,000,000,000 units of pleasure". They're saying: "Preventing *this specific type and intensity* of suffering is a moral imperative so absolute that considerations of pleasure *cease to be morally relevant* in this context." It's about the *kind* of value and its priority, not direct numerical comparison on a scale.
  *   **Like Unbreakable Rules:** Think of other absolute rules: "Never torture an innocent person for fun." Does adhering to this rule mean we've *compared* the fun of the torturer to the agony of the victim and found the agony heavier? Not necessarily. It means we believe torture is *so morally abhorrent* that the potential pleasure of the torturer is simply *disqualified* as a justifying factor. The suffering creates an absolute barrier.

  **How it tells you what to do:**

  Precisely *because* there's no common scale for trading, the hierarchy becomes crucial for decision-making:

  1.  **Identify Suffering:** Does the situation involve suffering above the awful threshold (e.g., extreme agony, profound despair, torture)?
  2.  **If YES:** Your *only* moral duty is to prevent or alleviate *that* suffering. Period. Ignore pleasurable consequences. Act to reduce the worst suffering first.
  3.  **If NO:** Only *then* might you consider promoting pleasure or preventing milder discomforts, perhaps weighing them against each other *if* a common measure exists at that lower level. But the "top tier" suffering always gets absolute priority.

  **The Analogy You Can Lift:**

  > "Imagine a hierarchy of needs, but for morality. At the very top, blindingly obvious and non-negotiable, is the imperative to prevent truly horrific suffering. Once that level of awfulness is present, it dominates the moral landscape completely. Pleasure exists on a different, lower plane. You can't 'pay off' a bout of torture with mountains of happiness, not because we've weighed them and found torture heavier on some scale, but because the sheer moral wrongness of the torture *silences* any talk of pleasure as compensation. It's not that pleasure is lighter; it's that its currency becomes worthless when confronted by suffering of that magnitude. The threshold marks the point where this moral silencing kicks in."

  **Crucially:**

  *   This avoids claiming pleasure and pain are *quantitatively* comparable on one scale.
  *   It explains the absolute priority via a *qualitative hierarchy* and the idea of moral silencing/imperative.
  *   It shows how the view dictates action: Prevent threshold-crossing suffering *first*, absolutely, before anything else.

  **Final Check:** Does this feel like the view you've encountered? It captures the "ruined afternoon beats any lovely ones" sentiment – the ruined afternoon crosses a threshold (of awfulness) that makes the lovely ones irrelevant to the *moral wrongness* of the ruin, even if they happen later.
