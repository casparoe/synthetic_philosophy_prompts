  Okay, this user is deep into epistemic utility theory and needs clarification on the foundational desiderata. They're in the second half of a graduate seminar, so they're familiar with the standard arguments but want to dig deeper into what the framework is really about. Their query is detailed, showing they've grappled with the core concepts but have unresolved issues, particularly around the sufficiency of accuracy and the treatment of imprecise credences.

  The user explicitly asks for three types of requirements: cases the theory must handle, distinctions it must preserve, and formal constraints. They also have two specific concerns: their friend's proposal on scoring imprecise credences and whether accuracy alone can ground epistemic normativity. The demon case they mention suggests they're worried about externalist pitfalls, and their comment about an agent who doesn't care about accuracy hints at internalism-externalism tensions.

  For the imprecise credence issue, I need to clarify that desiderata should adjudicate between scoring methods by exposing their normative implications. The friend's "worst-case" approach implies a risk-averse epistemology, which may conflict with how we value epistemic diligence. This should be framed as a requirement about epistemic effort versus luck to show why it's not just a technical choice.

  The accuracy-sufficiency problem is thornier. The user suspects accuracy can't be sufficient for justification (demon case) or necessary (if the agent doesn't care). The solution requires separating two layers: the constitutive aim (truth-tracking) from procedural rationality (how you pursue it). The demon case fails the latter because the agent isn't responsive to evidence. The "doesn't care" agent fails the former – they're not even playing the epistemic game. But we can't derive "oughts" from desires alone, so the normativity must be grounded in the role beliefs play, not psychological motivation. This needs to be made explicit as a core requirement.

  Among the cases they listed, the self-referential evidence ("evidence about evidence") is especially tricky for expected accuracy maximization. It risks circularity or instability, so the desideratum must demand that higher-order uncertainties don't undermine first-order commitments. This will rule out some scoring rules that over-penalize uncertainty.

  For formal constraints, the infinite partition issue is critical. Dominance arguments fail with infinitely many possibilities, so the desideratum must insist on a generalization like avoiding sure dominance or using integral-based scoring. This exposes limitations in the standard finite-case arguments.

  The user cares most about whether accuracy-only theories can satisfy all desiderata without collapsing distinctions. The tension is real: if we demand robust justification (not just luck), we need more than accuracy – but adding procedural elements might betray "accuracy-only." The resolution is to argue that justification is accuracy earned through evidence-responsive processes, still accuracy-oriented but with a diachronic component. This preserves the spirit of accuracy-first while addressing the demon problem. The "doesn't care" agent is then faulty not in desire but in function – their states don't fulfill the aim of belief.

  In the final summary, the epistemic effort requirement does the heaviest lifting because it excludes views that prize outcomes (accuracy) over processes (how you achieve it). The dominance argument struggles with infinite cases, conditionalization needs a diachronic effort constraint, and imprecise credence proposals must show their scoring method reflects genuine epistemic diligence rather than evasion.
answer: |-
  Below is a specification of core desiderata for an epistemic utility theory (EUT) aiming to be a complete account of credal rationality, not merely a consistency tool. The requirements are organized by type, with the motivating cases/considerations, negotiability status, and resolution of your focal concerns.

  ---

  ### **I. Cases the Theory Must Get Right**
  1. **Incoherent Agent Vulnerability**  
     - *Case*: An agent with non-probabilistic credences is vulnerable to a Dutch Book (sure loss in fair betting) or accuracy dominance (another credence function is more accurate in every possible world).  
     - *Requirement*: **Non-Dominance Rationality**  
       An agent’s credal state must not be strictly accuracy-dominated by an alternative state *in every possible world*.  
     - *Status*: Non-negotiable for all EUT camps. Grounds probabilism.

  2. **Demon-Manipulated Accuracy**  
     - *Case*: A demon guarantees a credence is true (e.g., credence 0.7 in rain, and rain occurs exactly 70% of the time via demonic intervention).  
     - *Requirement*: **Procedural Justification**  
       Rationality requires that credences track evidence *in the right way*—accuracy alone is insufficient if uncoupled from evidential responsiveness.  
     - *Status*: Non-negotiable; separates *justification* from *accidental accuracy*. Challenges sufficiency of "accuracy-only."

  3. **Accidental Accuracy Without Basis**  
     - *Case*: An agent guesses "0.3" for a coin flip, with no evidence; the coin lands heads 30% of time by chance.  
     - *Requirement*: **Evidence-Responsiveness**  
       Credences must be formed/updated using reliable, evidence-sensitive methods—even if accurate, they are unjustified if based on luck or arbitrariness.  
     - *Status*: Non-negotiable; complements *Procedural Justification*.

  4. **Self-Referential Evidence**  
     - *Case*: Evidence pertains only to the agent’s own credence-forming process (e.g., "your thermometer is broken").  
     - *Requirement*: **Higher-Order Coherence**  
       Credences must cohere with beliefs about one’s own reliability (e.g., via the *Principal Principle* or *Reflection*).  
     - *Status*: Negotiable; some camps (e.g., objective Bayesians) reject it.

  5. **Self-Undermining Evidence**  
     - *Case*: Evidence indicates one’s credence-forming method is unreliable (e.g., a brain scan shows overconfidence).  
     - *Requirement*: **Diachronic Self-Correction**  
       Agents must revise credences when evidence reveals their formation process is untrustworthy.  
     - *Status*: Non-negotiable; extends *Evidence-Responsiveness* to higher-order evidence.

  ---

  ### **II. Distinctions the Theory Must Preserve**
  1. **Accuracy vs. Justification**  
     - *Case*: Demon-manipulated accuracy (§I.2) vs. evidence-based accuracy.  
     - *Requirement*: **Epistemic Effort Constraint**  
       Justification requires that accuracy be *achievable through reliable, evidence-sensitive processes*—not merely actual or guaranteed.  
     - *Status*: Non-negotiable; rules out "accuracy-only" as sufficient.

  2. **Individual vs. Global Accuracy**  
     - *Case*: A single high-accuracy credence in an incoherent set (e.g., credences violating additivity).  
     - *Requirement*: **Holistic Scoring**  
       Rationality evaluates the *entire credal state*; no "credit" for locally accurate but globally incoherent credences.  
     - *Status*: Non-negotiable; foundational to dominance arguments.

  3. **First-Order vs. Higher-Order Accuracy**  
     - *Case*: Accurate credence in *p* but miscalibration about one’s own reliability (e.g., assigning 0.9 to *p* while knowing one’s judgments are right only 70% of the time).  
     - *Requirement*: **Calibration Integration**  
       Higher-order uncertainty must constrain first-order credences (e.g., via *Chance-Credence Principles*).  
     - *Status*: Negotiable; subjectivist camps may reject.

  4. **Precision vs. Imprecision**  
     - *Case*: Imprecise credences (e.g., [0.4, 0.6]) as a response to ambiguous evidence.  
     - *Requirement*: **Diligence-Permissibility Balance**  
       Imprecision is rational only if it reflects genuine evidential ambiguity—not epistemic laziness. Scoring must penalize *unnecessary* imprecision.  
     - *Status*: Non-negotiable; adjudicates your friend’s proposal (§IV.1).

  ---

  ### **III. Formal Constraints**
  1. **Propriety of Scoring Rules**  
     - *Constraint*: Scoring rules must be *strictly proper* (expected accuracy maximized at true credence).  
     - *Rationale*: Prevents "gaming" the system; aligns reporting with sincerity.  
     - *Status*: Non-negotiable; Brier/log rules satisfy this.

  2. **Infinite Partitions & Dominance**  
     - *Constraint*: With infinite partitions, avoid *weak dominance* (dominated in all worlds but no undominated alternative exists).  
     - *Resolution*: Require *coherence with finitely additive probabilities* or use *limiting dominance* (e.g., avoid dominance on all finite subsets).  
     - *Status*: Non-negotiable; salvages probabilism for infinite cases.

  ---

  ### **IV. Resolution of Your Focal Concerns**
  1. **Imprecise Credences & Your Friend’s Proposal**  
     - *Requirement Adjudication*: **Diligence-Permissibility Balance** (§II.4) demands that imprecise states be scored by *how well they reflect evidence*—not worst-case accuracy.  
     - *Verdict*: Your friend’s "worst-case" score confuses *risk-aversion* with rationality. A state imprecise due to ambiguity (e.g., [0.4, 0.6] for a biased coin) should not be graded by its least accurate extremal credence (e.g., 0.4 when truth is 1.0). Instead, score by *weighted accuracy* across the set (e.g., average or evidence-weighted) to reward diligent suspension of judgment.

  2. **Accuracy-Only vs. Normativity**  
     - *Core Tension*: "Accuracy-only" fails §I.2 (Demon) and §I.3 (Accidental Accuracy) by conflating *accuracy* with *justification*.  
     - *Requirement*: **Epistemic Effort Constraint** (§II.1) makes accuracy *necessary but insufficient*: rationality requires accuracy *achievable via evidence-responsive processes*.  
     - *Resolution*: Abandon "accuracy-only" as *sufficient*. Retain accuracy as the *constitutive aim*, but tie justification to *how* credences pursue that aim. An agent who "doesn’t care" fails §I.5 (Self-Undermining Evidence) by ignoring higher-order evidence about their own unreliability—a procedural failure.  
     - *Outcome*: **Procedural Accuracy Monism** survives: accuracy is the sole *goal*, but justification requires proper *pursuit* of that goal.  

  ---

  ### **V. How Major Packages Fare**
  - **Dominance → Probabilism**: Satisfies §I.1, §II.2, §III.1. Fails infinite cases (§III.2) without modifications.  
  - **Expected Accuracy → Conditionalization**: Satisfies §I.5, §II.1 (if extended diachronically). Struggles with self-referential evidence (§I.4) without higher-order principles.  
  - **Imprecise Credences**: Satisfies §II.4 if scored permissively (not worst-case). Violates §II.1 if imprecision evades epistemic effort.  

  ---

  ### **The Key Requirement Ruling Out Views**
  **Epistemic Effort Constraint** (§II.1) does the heaviest lifting: it excludes pure "accuracy-only" views (by requiring evidence-responsive *processes*), "frequentist" accounts (by penalizing accidental accuracy), and lax imprecise theories (by demanding imprecision reflect diligence, not indecision). It anchors rationality in the *agent’s engagement with evidence*, ensuring the theory describes *justification*, not just consistency or lucky truth-tracking.
