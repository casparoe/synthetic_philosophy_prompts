              - Penalty for violation: loose=1 point, medium=2, tight=3.
              - Enforcement reward: loose=1 point, medium=1, tight=2 (so tight encourages more enforcement).
              - Rule change threshold: loose=majority (4/6), medium=5/6, tight=unanimous? or 5/6?).
          b) They must create rules (at least the minimum). Rules can be about:
              - Which colors can be taken when (e.g., round 1: only red; round 2: only blue; ...)
              - Restrictions on consecutive colors, etc.
