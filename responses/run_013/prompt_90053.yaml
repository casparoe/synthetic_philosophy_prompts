  ### **Key Insights**  
  - **Asymmetric Ratchet Pressure:** The game makes loosening costly (group pays points to Dial-Keeper + vote cost), while tightening is free. This asymmetry will feel visceral.  
  - **Buy-in Limitation:** The point system can’t capture emotional legitimacy. You must verbally underscore that real enforcement’s legitimacy hinges on *why* the group chose it.  
  - **Shift Detection:** If groups miss the environment shift, contrast tables that adapted (likely looser pre-shift) vs. those that didn’t (likely tighter).  
  - **Verdict Forcing:** The prompt bans "it depends" – expect heated debates!
