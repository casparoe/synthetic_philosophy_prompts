     - 60 paper tokens: 20 red, 20 blue, 20 green (pre-cut squares)
     - 1 cloth bag to hold the tokens
     - Score sheets (6 copies, one per player)
     - Rule sheet (1 copy, for the group to write their rules)
     - Tightness dial indicator: a card with "Loose", "Medium", "Tight" and a marker to indicate current setting.
     - 2 envelopes: 
          * Pre-shift: contains a card with the hidden pattern (e.g., "R,B,G,R,B,G") and a point value card (red=5, blue=3, green=1).
          * Post-shift: contains a card with the new pattern (e.g., "G,R,B,G,R,B") and a point value card (red=1, blue=5, green=3). [Note: These are given to the facilitator to swap at the shift.]
     - Pens (6)

   Setup:
     - Arrange four tables with six chairs each.
     - Place one set of materials at each table.

   Timeline:

     Introduction (5 minutes):
        - "Welcome! Today we're going to play a game about group rules. In this game, you are a community that harvests resources (tokens) from a shared grid. Your goal is to maximize your individual points, but note: there are group bonuses that can help everyone."
        - Explain the round:
            1. Each round, the table will set up a grid of 6 tokens (2 red, 2 blue, 2 green).
            2. Players take turns in an order that rotates each round (so the first player in round 1 becomes last in round 2, etc.).
            3. On your turn, take one token from the grid and record the color on your score sheet.
            4. After the round, the group writes down the sequence of colors taken (in order).
            5. Check for rule violations: if there is a monitor, only they can enforce; otherwise, any player can call a violation. If a violation is confirmed, the violator loses penalty points and the enforcer gains a reward.
            6. Calculate points: 
                 - Each token is worth points (shown on the point value card).
                 - If the group had no violations, everyone gets a +2 coordination bonus.
                 - If the sequence matches the hidden pattern (which is in the envelope), everyone gets a +5 pattern bonus.
        - "Your group will set its own rules and a tightness level (loose, medium, tight) that affects how many rules you must have, the penalties, and how hard it is to change rules. You can also appoint a monitor. You have 10 minutes to set up."

     Rule Setting (10 minutes):
        - Groups must choose tightness and create at least the minimum rules (loose:0, medium:1, tight:2). They can write rules on the rule sheet.
        - They can appoint a monitor (if they do, they must decide how the monitor is chosen and for how long).
        - Circulate and answer questions.

     Gameplay (60 minutes total, 12 rounds):
        - Rounds 1-6 (30 minutes): 
             * Each round: 
                  a) Set the grid: draw 6 tokens from the bag (if not enough, refill from the stock) and arrange randomly. But note: we want 2 of each color. So if the draw doesn't have 2 of each, they redraw until it does? Or we pre-sort the bag to have only 20 of each, and they draw 6 without replacement? Then after the round, they put the tokens back? Actually, we want the tokens to be reusable. So each round, they put 2 red, 2 blue, 2 green on the grid (from the bag). After the round, they return the tokens to the bag and mix.
             b) Determine turn order: round 1: 1,2,3,4,5,6; round 2: 2,3,4,5,6,1; etc.
             c) Players take turns to take one token. Record the color.
             d) After the round, write the sequence (e.g., player1: red, player2: blue, ...).
             e) Check rules: if a rule was broken, allow enforcement. The enforcer calls out the violation. The group (or monitor, if given authority) decides. If upheld, the violator loses penalty points (according to tightness) and the enforcer gains the reward.
             f) Check pattern: a designated player (or the facilitator if present) opens the envelope and checks the sequence. If it matches, everyone gets +5.
             g) Record points: each player calculates their points for the round (token value + coordination bonus if applicable + pattern bonus if applicable - any penalties + enforcement reward if they enforced + monitor base if applicable).
          * Between rounds, the group can change tightness or rules (if they meet the threshold). They can also change the monitor (if rules allow).

        - After round 6: 
             * The facilitator goes to each table and replaces the envelope with the post-shift one (which has the new point values and pattern). Do not announce.

        - Rounds 7-12 (30 minutes): same as above, but with the new point values and pattern.

     Debrief (30 minutes):
        - Bring the group together. Ask each table to share one striking moment.
        - Walk through the debrief points (as in the JSON) to map to coordination, slack, buy-in.
        - Ask each table to write their verdict on a card: "A group should demand [low/moderate/high] rule-following, and the power to loosen rules should lie with [describe who]."
        - Collect and read the verdicts. Allow discussion.

     JSON summary as requested.

   Note: The above design tries to meet all constraints. Let me know if adjustments are needed.
answer: |-
  ### Activity Design: "The Tightness Dial"  

  **Session Title:** The Tightness Dial: Rule-Making Under Pressure  
  **Who & How Many:** 24 adults (policy experts, grad students, engineers, civilians) in four teams of six.  
  **Total Minutes:** 120  
  **Materials:**  
  - Per table: 1 paper "environment tracker," 6 dice, 24 index cards (rule cards), 1 pen, 1 set of "tightness dial" cards (LOOSE/MEDIUM/TIGHT), 1 hidden "discovery card" (revealed only if a rule is broken).  
  - Shared: Large wall clock, facilitator’s shift-trigger (e.g., bell).  

  ---

  ### **Roles**  
  *(Per table, assigned randomly)*  
  ```json  
  "roles": [  
    { "role": "Harvester", "payoff": "Earns 1 point per resource collected", "special_power": "Can collect resources" },  
    { "role": "Enforcer", "payoff": "Earns 2 points per violation caught OR loses 1 point if violations missed", "special_power": "Can penalize rule-breakers" },  
    { "role": "Dial-Keeper", "payoff": "Earns 1 point if group changes tightness level", "special_power": "Proposes tightness changes" }  
  ]  
  ```  
  *Note:* All players must participate. Rotate roles every 15 minutes.  

  ---

  ### **Phases**  
  ```json  
  "phases": [  
    {  
      "name": "Setup",  
      "minutes": 5,  
      "what_happens": "Facilitator explains rules, distributes roles. Groups set initial tightness (LOOSE/MEDIUM/TIGHT) and one starting rule (e.g., 'Roll dice clockwise').",  
      "which_account_is_at_stake": "buy-in",  
      "facilitator_does": "Demo a round; stress: 'You control the dial.'"  
    },  
    {  
      "name": "Stability Phase",  
      "minutes": 45,  
      "what_happens": "Teams harvest resources (rolling dice for points). Rules can be added/enforced. Breaking a rule reveals the 'discovery card' (e.g., 'Rolling evens doubles points').",  
      "which_account_is_at_stake": "coordination, slack",  
      "facilitator_does": "Silently observe; trigger environment shift at 30:00."  
    },  
    {  
      "name": "Turmoil Phase",  
      "minutes": 45,  
      "what_happens": "Environment shifts: Dice now yield 0 points for numbers 1-3 (unannounced). Groups must adapt rules. Dial-Keeper can propose loosening/tightening.",  
      "which_account_is_at_stake": "slack, buy-in",  
      "facilitator_does": "Note which groups detect the shift; remind: 'Dial can change anytime.'"  
    },  
    {  
      "name": "Debrief",  
      "minutes": 25,  
      "what_happens": "Groups discuss moments linking to coordination/slack/buy-in. Write verdict sentences. Facilitator shares sentences, sparks debate.",  
      "which_account_is_at_stake": "all",  
      "facilitator_does": "Ask: 'When did enforcement help or hurt? Who paid to loosen rules?'"  
    }  
  ]  
  ```  

  ---

  ### **Payoff Scheme**  
  ```json  
  "payoff_scheme": [  
    { "situation": "Follow group rule", "player_points": "+1", "note": "Coordination bonus" },  
    { "situation": "Break rule (caught)", "player_points": "-2", "note": "Enforcer gains +2" },  
    { "situation": "Break rule (undetected)", "player_points": "+3", "note": "Only way to see 'discovery card'" },  
    { "situation": "Propose loosening dial", "player_points": "Dial-Keeper: +1; Group vote cost: -1 per player", "note": "Buy-in cost" }  
  ]  
  ```  

  ---

  ### **The Dials**  
  ```json  
  "the_dials": [  
    {  
      "dial": "Tightness Level",  
      "tight_setting": "TIGHT: 3+ rules; Enforcer required",  
      "loose_setting": "LOOSE: 0-1 rules; No enforcer",  
      "what_it_does_to_play": "TIGHT boosts coordination points but penalizes deviations; LOOSE allows easy discovery but risks chaos."  
    }  
  ]  
  ```  

  ---

  ### **Environment Shift**  
  ```json  
  "environment_shift": {  
    "when": "30:00 mark (mid-Stability Phase)",  
    "what_changes": "Dice rolls 1-3 yield 0 points (was 1 point). Resource scarcity intensifies.",  
    "why_unannounced": "Forces groups to detect change via failed coordination (e.g., 'Why are points dropping?')."  
  }  
  ```  

  ---

  ### **Debrief**  
  ```json  
  "debrief": [  
    {  
      "moment_in_play": "Initial rule-setting",  
      "idea_it_maps_to": "buy-in",  
      "question_to_ask": "Did your Enforcer feel like a peer or a cop? How did that affect trust?"  
    },  
    {  
      "moment_in_play": "First rule broken",  
      "idea_it_maps_to": "slack",  
      "question_to_ask": "What did you discover? Would you have found it without deviation?"  
    },  
    {  
      "moment_in_play": "Dial change attempt",  
      "idea_it_maps_to": "coordination",  
      "question_to_ask": "Who pushed to loosen/tighten? What did it cost them?"  
    }  
  ]  
  ```  

  ---

  ### **What Will Go Wrong (and Fixes)**  
  ```json  
  "what_will_go_wrong_first_time": [  
    {  
      "failure": "Groups ignore the dial; stick to initial tightness.",  
      "fix": "Remind Dial-Keeper: 'You earn points for proposing changes!'"  
    },  
    {  
      "failure": "No one breaks rules → discovery card stays hidden.",  
      "fix": "Hint: 'Some actions are only profitable if undetected.'"  
    },  
    {  
      "failure": "Enforcers over-police → resentment builds.",  
      "fix": "Ask: 'Is enforcement helping the group or just you?'"  
    }  
  ]  
  ```  

  ---

  ### **Cannot Reproduce**  
  ```json  
  "cannot_reproduce": [  
    {  
      "feature_of_real_tightness": "Buy-in legitimacy",  
      "why_the_game_cant": "Points rationalize enforcement; real buy-in hinges on emotions/trust not captured in scoring.",  
      "what_the_facilitator_must_supply": "Say: 'IRL, peer enforcement builds trust when voluntary but breeds resentment if forced. Appointed enforcers gain legitimacy from process, not points.'"  
    }  
  ]  
  ```  

  ---

  ### **Verdict Prompt**  
  `"A group should demand [low/moderate/high] rule-following, and the power to loosen rules should lie with [e.g., unanimous vote, a trusted subgroup, no one]."`  

  ---

  ### **Facilitator Script Snippets**  
  - **Kickoff (5 min):**  
    *“You’re a resource-harvesting team. Control your tightness dial (hold up cards). Rules you make earn coordination points, but breaking them might reveal better strategies. Enforcers: you profit from policing, but if the group hates it, you’ll pay later. Dial-Keepers: you earn points for changing tightness. GO.”*  
  - **Shift Trigger (30:00 mark):**  
    *Silently flip environment tracker at each table (no speech).*  
  - **Debrief Start:**  
    *“Pick one moment where enforcement felt legitimate... and one where it backfired. Map them to coordination, slack, or buy-in.”*  

  ### **JSON Summary**  
