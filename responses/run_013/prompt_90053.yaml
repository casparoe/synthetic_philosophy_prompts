      { "role": "Dial-Keeper", "payoff": "+1 per dial change", "special_power": "Proposes tightness shifts" }  
    ],  
    "phases": [  
      { "name": "Setup", "minutes": 5, "what_happens": "Explain rules, set dial", "which_account_is_at_stake": "buy-in", "facilitator_does": "Demo round" },  
