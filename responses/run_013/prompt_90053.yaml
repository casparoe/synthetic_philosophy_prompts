prompt: |-
  I'm building a session for a weekend workshop and I need you to design the activity, not the talk. Here's the setup and the stuff I care about.

  The crowd: 24 adults, mixed — a handful of policy people, a few grad students, two engineers, rest are curious civilians. Two hours, one room, four tables of six. I get 5 minutes up front to explain rules and then I don't want to lecture again until the debrief. Materials should be paper, index cards, dice if you must, no money, no phones.

  The topic is how much rule-following a group should demand of its members — the tight-vs-loose thing from cross-cultural psychology, but I do not want the session to be a dramatization of that literature, and I don't want you pointing me at papers to read, I'm not going to read them. Instead I've got my own little accounting scheme and I want the activity built on it. Three accounts that every rule draws on:

  1. coordination — what a rule buys you when everyone actually follows it (predictability, joint action, the thing you can't get by each person improvising).
  2. slack — what the rule costs you by foreclosing moves that would have been better than the rule, but that you can only discover by someone trying them.
  3. buy-in — the legitimacy account. I think enforcement spends it when it comes from outside the group and deposits it when it comes from people who chose the rule, and I think the same enforcement act does opposite things to this account depending on who's doing the enforcing. Peer sanction vs. appointed monitor, basically.

  And my actual hunch, which I want the game to put real pressure on: the ratchet is asymmetric. Rules get added under threat and come off very rarely, so the live question isn't "how tight should we be" but "who holds the dial for loosening, and what do they have to pay to turn it." If the activity makes that feel obviously true I'll be happy; if it makes it feel false I'll be even happier, honestly.

  Design constraints, and these matter more to me than elegance:

  - Tightness has to be a dial the group sets for itself, in play, and can change mid-game. It can't be fixed by me at the start.
  - Enforcement has to be endogenous — a player with their own payoff, not me stepping in as the referee.
  - At least one thing in the game must be discoverable only by somebody breaking a rule. If nobody ever deviates, the group should be leaving something on the table and should be able to feel that it is.
  - The environment shifts partway through without announcement — I want one kind of group to be winning before the shift and the other kind after, and I want them to have to notice.
  - Simple enough to teach in five minutes. If the rules take longer to explain than to play, it's dead.
  - No real money, no phones, and nobody should be able to sit out.

  The debrief should walk back through specific moments from the play and map them onto the three accounts, and I want it to end with every table having to write down one sentence answering how much rule-following a group should demand and who gets to loosen it — no "it depends" allowed, they have to commit. I'll read the sentences out loud and let them fight about it.

  Also be honest with me about two things: what predictably goes wrong the first time I run this and what I should do about it in the moment, and which feature of the real phenomenon the game simply can't reproduce, so I know what I have to say out loud myself rather than pretend the rules carried it. My guess is buy-in is the one that won't survive contact with a points system, but tell me if I'm wrong and it's something else.

  Give me the design as a proper write-up I can hand to a co-facilitator — timeline, roles, payoffs, what I say and when, the shift, the debrief. Then after that, a JSON object summarizing the whole thing so I can file it. Use exactly these fields:

  - session_title (string)
  - who_and_how_many (string)
  - total_minutes (number)
  - materials (array of strings)
  - roles (array of objects: role, payoff, special_power)
  - phases (array of objects: name, minutes, what_happens, which_account_is_at_stake — one of "coordination", "slack", "buy-in" — and facilitator_does)
  - payoff_scheme (array of objects: situation, player_points, note)
  - the_dials (array of objects: dial, tight_setting, loose_setting, what_it_does_to_play)
  - environment_shift (object: when, what_changes, why_unannounced)
  - debrief (array of objects: moment_in_play, idea_it_maps_to, question_to_ask)
  - what_will_go_wrong_first_time (array of objects: failure, fix)
  - cannot_reproduce (array of objects: feature_of_real_tightness, why_the_game_cant, what_the_facilitator_must_supply)
  - verdict_prompt (string — the exact sentence the tables fill in at the end)
reasoning: |-
  We are designing a two-hour session with 24 adults. The session is about group rule-following dynamics, focusing on coordination, slack, and buy-in. The activity must have the group set tightness as a dial that can change, endogenous enforcement, a discoverable benefit from rule-breaking, and an unannounced environment shift.

   Design Concept: "The Harvest Game"

   Overview:
   Players are members of a community that harvests resources (represented by tokens) from a shared grid. The grid has different types of resources (e.g., colors: red, blue, green). Each player, on their turn, can take one token from the grid and place it in their personal stash. The group must coordinate to maximize the total points, which depend on how the tokens are harvested and processed.

   The Twist:
   - The group can set rules about which color can be harvested when, and by whom.
   - Rules are enforced by players (endogenous enforcement). 
   - Breaking a rule might reveal a better way to harvest (slack) but can disrupt coordination.
   - Environment shift: the point values of the resources change partway through without announcement.

   The Three Accounts:
   1. Coordination: Following rules about harvesting order/color ensures that the group can achieve bonuses (e.g., if everyone harvests the same color in a round, get bonus points).
   2. Slack: If a player breaks a rule and harvests a forbidden color, they might discover that the forbidden color is now worth more (due to a shift) or that a new pattern (e.g., alternating colors) yields a bonus that wasn't known before.
   3. Buy-in: Enforcement is done by players. If a player enforces a rule (by calling out a violation and imposing a penalty), they get a small enforcement reward. However, if the enforcer is an appointed monitor (a role the group can choose to create), the buy-in account is affected differently (peer vs. appointed).

   The Dial: Tightness Level
   The group can set the tightness level at the beginning and change it during the game. The tightness level has three settings (loose, medium, tight) that affect:
     - How many rules the group must have (minimum rules)
     - The penalty for breaking a rule
     - The reward for enforcing a rule
     - The ability to change rules (in tight, changing rules requires a supermajority; in loose, a simple majority)

   Rules Creation:
   At the start, the group must create at least one rule (for tight) or can have no rules (loose). Rules can be about:
     - Which colors can be harvested when (e.g., only red on even rounds, only blue on odd)
     - How many of a color can be taken (e.g., no more than two blue per round)
     - Assignment of roles (e.g., a monitor role that enforces rules and gets a reward)

   Enforcement:
   Any player can call out a violation. The accused must pay a penalty (points) to the group pot. The enforcer gets a small reward (from the system, not the violator) for enforcing. However, if the group has appointed a monitor, only the monitor can enforce, and they get a larger reward. But if the monitor fails to enforce and someone else points it out, the monitor loses points.

   The Discoverable Bonus:
   There is a hidden pattern: if in a round, players harvest tokens in a specific sequence (e.g., red, then blue, then green) that is not the current rule, they get a bonus. This pattern is not told to the players. They must break the rule to discover it.

   Environment Shift:
   After the first 20 minutes (or after a set number of rounds), the point values of the resources change. For example, before the shift, red is worth 5, blue 3, green 1. After, red is 1, blue 5, green 3. Also, the hidden pattern changes (e.g., from red-blue-green to blue-green-red). The shift is unannounced.

   Game Structure:
   - 5 min: Introduction and rules explanation.
   - 10 min: Group rule-setting (they set initial tightness and create rules).
   - 60 min: Gameplay in rounds (each round is 5 minutes, 12 rounds total? But we need to allow for the shift and mid-game rule changes). Alternatively, we do 15-minute blocks with multiple rounds in each, and the shift happens after the first 15 minutes of play.
   - 30 min: Debrief and writing sentences.

   Alternatively, to fit in two hours:
     - 5 min intro
     - 10 min rule-setting
     - 60 min gameplay (divided into two 30-min segments, with shift at 30 min mark)
     - 30 min debrief (with 5 min buffer) -> total 105 min, but we have 120 so we can adjust.

   Let's break down:

   Phase 1: Setup (5 min)
     - Explain the goal: maximize group and individual points (each player gets points for their stash, but there are also group bonuses).
     - Explain the grid: a 6x6 grid with colored tokens (paper squares: red, blue, green). Each cell has one token.
     - Explain turns: Each player, in order, takes one token per turn. One round is when every player has taken one token (so 6 tokens per round per table). The grid is replenished after each round (so 36 tokens per round? but we have 24 players? Wait, each table has 6 players and their own grid? Yes, each table of 6 has a grid and plays independently).

   Phase 2: Rule-Setting (10 min)
