   Phase 4: Debrief (30 min)

   Roles at the table:
     - Players: 6 per table. Each has a player ID (1-6). Turn order rotates each round (player 1 in round 1, then player 2 becomes first in round 2, etc.)
     - Optional: Monitor. If appointed, they are the only one who can enforce rules. They get a base salary (1 point per round) and the enforcement reward (if they enforce). But if a violation occurs and the monitor doesn't enforce, and another player points it out, then the monitor loses 2 points (and the enforcer still gets the reward). In the absence of a monitor, any player can enforce.

   Payoffs for a player in a round:
     - Base: Value of the token they took (according to current point values).
     - Coordination Bonus: If the group had no violations and followed the rule, each player gets +2 points.
     - Pattern Bonus: If the sequence matches the hidden pattern, each player gets +5 points (regardless of rules, because the pattern might require breaking the rule).
     - Penalties: If they violated a rule and were caught, they lose penalty points (based on tightness).
     - Enforcement: If they enforced a violation (and it was upheld), they gain the enforcement reward.

   The dials (tightness) and their settings:

     Loose:
       - Min rules: 0
       - Penalty: 1 point
       - Enforcement reward: 1 point
       - Rule change threshold: majority (4/6)
       - Monitor: if appointed, base salary=1, enforcement reward=1 (so same as peer)

     Medium:
       - Min rules: 1
       - Penalty: 2 points
       - Enforcement reward: 1 point
       - Rule change threshold: 5/6
       - Monitor: base=1, enforcement reward=2 (so more incentive)

     Tight:
       - Min rules: 2
       - Penalty: 3 points
       - Enforcement reward: 2 points
       - Rule change threshold: unanimous (6/6) or 5/6? Let's do 5/6 to make it possible.
       - Monitor: base=2, enforcement reward=3

   The group can change the tightness setting during the game, but it requires a vote (with the current threshold). Changing the setting might change the minimum rules, so they might have to add rules if they go tighter.

   Environment Shift:
     - When: After round 6 (midway).
     - What changes: 
          a) The point values: originally red=5, blue=3, green=1 -> becomes red=1, blue=5, green=3.
          b) The hidden pattern: originally, say, pattern A (e.g., R,B,G,R,B,G) -> becomes pattern B (e.g., G,R,B,G,R,B). The facilitator replaces the pattern card and the point value sheet at each table.

   Why unannounced: To simulate real-world changes that groups must detect and adapt to.

   Debrief:
     We'll ask tables to recall specific moments and map to the accounts.

   Verdict Prompt: "A group should demand [low/moderate/high] rule-following, and the power to loosen rules should lie with [describe who]."

   What will go wrong:
     - Groups might not break rules, so they never discover the pattern. Fix: Encourage risk-taking by hinting that there might be hidden bonuses for trying new things? Or design the rules so that the pattern is very different from the rule and the rule is constraining. Also, after the shift, if they don't change, they might lose points, which might push them to break rules.
