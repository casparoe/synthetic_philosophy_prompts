     - Step 1: Harvesting (each player takes one token in turn order, which rotates each round). They write down the color they took on their score sheet.
     - Step 2: After the round, check for rules violations: any player (or the monitor, if appointed) can call out a violation. If a violation is called and agreed by the group (or by the monitor, if the group has given the monitor the authority to judge), the violator pays a penalty (points) to a group pot. The enforcer gets the enforcement reward (from the bank, not the pot). The group pot is then distributed equally at the end of the game? Or we can avoid a pot and just have the penalty as a loss to the violator and the reward as a gain to the enforcer (so no group pot). Let's do that: penalty is deducted from violator, reward is added to enforcer.

