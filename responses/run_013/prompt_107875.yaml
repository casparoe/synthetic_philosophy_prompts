  Normative claims unravel here. An insurance seller knowingly accepts negative-EV bets - irrational per Dutch theorems but rational as liquidity provision. The reverse mapping is also revealing: trading concepts like counterparty default risk and calibration-as-backtesting have no equivalents in standard Dutch book literature.

