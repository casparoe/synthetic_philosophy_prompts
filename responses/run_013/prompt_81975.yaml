answer: |-
  Your diagnosis is remarkably astute—you've identified the core fissure in convention theory with ecological precision. Let's dissect the conceptual landscape, building on your hypothesis:

  ### The Two Questions Framed
  1. **Normative Standing**: "Why does this regularity *obligate*?" (Lewis, Gilbert, Millikan)  
     - Focus: Justification, deontic force ("ought"), intentionality, and common knowledge.  
     - Claim: A convention isn't just *what* people do, but *why* they do it—it requires mutual expectations and preference for coordination.  

  2. **Causal Emergence**: "How does this regularity *arise and persist*?" (Boyd & Richerson, Sugden, Skyrms)  
     - Focus: Evolutionary dynamics, reinforcement learning, population-level stability.  
     - Claim: Conventions can emerge without agents understanding coordination—e.g., ant trails or bird foraging.  

  ### Diagnosis: Not Merely Verbal  
  - **Common Knowledge Debate**:  
    - **Constitutive View (Lewis)**: Common knowledge *defines* convention. If no agent recognizes alternatives or expects compliance, it’s mere custom (e.g., herd behavior).  
    - **Typical/Emergent View (Sugden)**: Common knowledge is a *byproduct* of stable equilibria. Animal conventions (e.g., arbitrary mating signals) prove expectation isn’t necessary.  

  - **The Animal Puzzle**: Your ecological example is pivotal. A population of lizards settling on arbitrary signaling conventions *without* expectations challenges the rationalist model. This suggests:  
    - Conventions ≠ only human rational coordination.  
    - "Arbitrariness + stability" may be sufficient in evolutionary terms.  

  ### Levels of Idealization or Distinct Phenomena?  
  It’s **both**:  
  - **Analytic Level**: Lewis-style conventions are a *subset* of stable equilibria requiring cognitive sophistication (idealized agents).  
  - **Biological/Behavioral Level**: Boyd-Richerson conventions encompass broader emergent regularities (minimal cognition).  

  The "real issue" is whether we define convention by *mechanism* (expectations) or *function* (arbitrary, stable coordination).  

  ### Paths to Progress  
  1. **Formal Synthesis**:  
     - Models showing how low-cognition dynamics (e.g., reinforcement learning) *generate* Lewis conditions in rational agents (e.g., agents evolving to recognize salience).  
     - Example: Skyrms’ signaling games demonstrating common knowledge emerging from evolutionary dynamics.  

  2. **Case-Driven Distinction**:  
     - **Proto-Conventions**: Animal behaviors (e.g., arbitrary alarm calls) as "convention*ish*"—lacking obligation but functionally identical.  
     - **Full Conventions**: Human practices (e.g., traffic rules) where norms and expectations are explicit.  
     - This refocuses debate: not "is it convention?" but "what *kind* of convention?"  

  3. **Reconciling "Ought"**:  
     - **Millikan’s Teleosemantics**: Conventions as reproduced patterns where "ought" derives from function (e.g., a signal *ought* to be used because it works).  
     - This bridges biology and normativity: Lizards "ought" to use their local signal because deviation reduces fitness—even without conscious reasoning.  

  ### Will the Literatures Converge?  
  Unlikely without a paradigm shift—but your ecology perspective hints at one:  
  - **Ecological Convention Theory**: Treat conventions as **evolved solutions to coordination problems**, graded by cognitive complexity:  
    | **Level** | Mechanism | Example | "Ought" Source |  
    |-----------|-----------|---------|----------------|  
    | **Biological** | Genetic/evolutionary | Mating signals | Fitness |  
    | **Behavioral** | Imitation/reinforcement | Foraging paths | Efficiency |  
    | **Rational** | Common knowledge | Currency | Mutual obligation |  

  This framing dissolves the "either/or": Conventions exist on a spectrum, with human rationality as a special case.  

  ### Conclusion  
  You’re right—the quarrel isn’t wholly verbal. It’s about **what we take as explanatorily primary**:  
  - Rationalists: *Intentionality* is constitutive.  
  - Evolutionists: *Stability* is constitutive.  

  **Progress** lies in showing how stability *grounds* normativity (e.g., Gilbert’s joint commitments emerging from repeated coordination). Your animal cases are the critical evidence: if we accept that conventions exist without "ought," then Lewis’ account describes a *culturally elaborated subtype*—not the essence. The literatures need not merge, but they must acknowledge they’re studying overlapping phenomena at different levels of organization.
