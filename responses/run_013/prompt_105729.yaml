answer: |-
  **Mark: 14/20** (A solid Upper Second Class mark - good understanding of core problem and quasi-realist response, but significant omissions and errors in distinguishing problems and assessing the solution).

  **Specific Marginal Comments (UK Spelling):**

  1.  **(Para 1, Sentence 1):** ✓ Good start: correctly identifies the core issue of unasserted contexts.
  2.  **(Para 1, "...expresses an attitude of disapproval rather than state a fact."):** ✓ Correct characterisation of expressivism's core commitment here.
  3.  **(Para 1, "So what is 'wrong' doing in the antecedent?" to "...otherwise the argument... would equivocate"):** ✓ Excellent. Clearly states why uniform meaning is crucial and the threat of equivocation for expressivism. Core of the problem well explained.
  4.  **(Para 1, "So the expressivist owes a uniform account..."):** ✓ Yes - this is the key debt identified for (i).
  5.  **(Para 2, "Hare's phrastic/neustic distinction..."):** ? While relevant historically, introducing Hare isn't strictly necessary for explaining the problem itself here. Focus is good on separating content/force.
  6.  **(Para 2, "And since the antecedent isn't evaluative anyway... doesn't have to be stretched"):** ? Potentially misleading. The challenge is precisely *how* the expressivist accounts for the *moral* content in the antecedent *as* moral content without the attitude expression. Simply saying it's "not evaluative" in force doesn't fully solve *what* the content *is*.
  7.  **(Para 2, "The negation problem is really the same problem with 'not' in place of 'if', so it doesn't call for any separate treatment."):** ✗ **Major Error for (ii).** This is incorrect. While related, the problems are distinct. The compositional debt (explaining meaning in embeddings like conditionals, questions, etc.) is broader. The *negation problem* specifically demands an explanation of why accepting "A is wrong" and accepting "A is not wrong" are *inconsistent states*, rather than just two different attitudes (e.g., disapproval vs. indifference/approval). You conflate them where the question asks you to *distinguish* them. **See Q part (ii).**
  8.  **(Para 3, "The most promising line is Blackburn's quasi-realism."):** ✓ Good identification of the relevant response.
  9.  **(Para 3, "If we take minimalism about truth seriously... just a way of endorsing it..."):** ✓ Correct explanation of minimal truth.
  10. **(Para 3, "...validity can be defined in the usual way as preservation of truth (or of acceptance). Moral modus ponens then comes out valid..."):** ? Superficially correct, but **crucially underspecified for assessment (iii).** You *state* it works but don't **assess** *how well* it discharges the debts, especially the negation problem. Does minimal truth *alone* explain the *inconsistency* of attitudes? Or just the truth-preservation? **Illustration missing.**
  11. **(Para 3, "...dissolved rather than dodged: no special moral logic is needed..."):** ✓ Correctly states the quasi-realist ambition.
  12. **(Overall for (iii)):** ✗ **Major Omission.** You failed to provide the required **illustration with a moral modus ponens of your own construction**. E.g., "If lying is wrong, then getting your little brother to lie is wrong. Lying is wrong. Therefore, getting your little brother to lie is wrong." This was explicitly required.

  **What Would Push it to the Next Band (16-17+):**

  1.  **Correctly Distinguishing the Problems (Part ii):** Explicitly state that the compositional debt covers *all* embeddings (conditionals, disjunctions, belief reports, questions etc.), requiring an account of what the moral clause *contributes* semantically. Then state that the *negation problem* is a specific *sub-problem*: explaining why the attitudes expressed by "A is wrong" and "A is not wrong" are *logically incompatible* (inconsistency), not merely different. Conflation here is a significant flaw.
  2.  **Assessing the Solution (Part iii):**
      *   Acknowledge that minimal truth + deflationary validity *does* seem to provide a compositional account for embeddings like conditionals (e.g., the antecedent expresses a minimally truth-apt content, allowing standard logic).
      *   **Crucially, address the negation problem:** Argue whether minimal truth *alone* explains inconsistency. Does endorsing "A is wrong" (minimally true) logically rule out endorsing "A is not wrong" (minimally true)? The quasi-realist typically needs *more* (like a specific account of the attitudes involved - e.g., disapproval vs. tolerance - and why they conflict) *alongside* minimal truth to fully discharge this debt. Merely stating validity via truth-preservation doesn't automatically solve the attitude inconsistency problem. A good answer would recognise this as a potential weakness or an area needing further work.
  3.  **Include the Required Illustration:** Provide a clear example of moral modus ponens.
