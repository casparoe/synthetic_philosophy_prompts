answer: |-
  Here's the case and analysis, built to your specifications:

  **The scene**  
  Lisa confronts Mark at their neighborhood association meeting about repeatedly leaving bulky trash on the curb outside collection days, attracting rats. Mark snaps back, "You did the same thing for months last year!" Lisa replies, "You’re absolutely right, I did. I dumped an old mattress and boxes out there week after week until the city fined me and threatened legal action. That’s exactly why I’m speaking up. I know how tempting it is, how easy it is to think ‘just this once.’ But we both saw the rats it brought, the complaints, the fines. We can’t keep doing this to the block – *we* need to stop, or we’ll all pay."

  **What the three views say**  
  1.  **Strict view:** Hypocrisy kills standing, full stop. Verdict: *Lisa loses standing.* She committed the same wrong knowingly and unrepentantly (she only stopped due to a fine). Her current criticism is invalidated regardless of its merit or her framing, as she lacks the moral authority to condemn Mark. The core wrong is identical.
  2.  **Permissive view:** Hypocrisy never kills standing, it just hands the target a comeback. Verdict: *Lisa retains standing.* Mark’s accusation is simply a defensive retort ("tu quoque"). Lisa’s point about the trash being wrong stands independently. Her past action is irrelevant to the truth of her criticism; it only gives Mark a rhetorical weapon to deflect blame.
  3.  **Middle view:** Hypocrisy kills standing only when the blamer claims superior standing or hides their record. Verdict: *Lisa retains standing.* By explicitly acknowledging her identical past fault without excuse, framing it as a shared failing ("we"), and not claiming moral superiority, Lisa avoids the core vice of hypocrisy (insincerity or pretense). Her transparency and self-inclusion grant her standing to issue a collective call to change.

  **What's doing the work**  
  The feature pulling the intuition that blame still lands is Lisa’s **transparent self-inclusion without claims of superiority**. She explicitly names her identical past wrong as part of the same reproach ("You’re right, I did"), uses collective language ("we"), and focuses on the shared consequence and need for collective change, not her own relative virtue. This makes the *strict view* uncomfortable, as it must dismiss a reproach that intuitively feels valid despite the triggered hypocrisy condition.

  **Take it away**  
  If Lisa hides her record ("That's irrelevant, just deal with your trash!") or claims superiority ("I would *never* do something so irresponsible now"), the intuition collapses. Her blame now feels hollow, unfair, and easily dismissed by Mark’s accusation. The *strict view*'s verdict (no standing) aligns with intuition. The *permissive view*'s verdict (standing remains) feels strained, as Lisa’s insincerity undermines her authority. The *middle view*'s verdict (loss of standing) aligns perfectly, as Lisa now exhibits the pretense or false superiority it identifies as the true poison.

  **How they fight back**  
  *Strict view defenders* might argue Lisa’s admission creates an artificial separation between her "past self" and "present self," granting her standing she hasn’t earned through genuine atonement. They could insist true repentance (beyond just stopping when caught) is necessary, making the case not "real" hypocrisy meeting their condition. *Permissive view defenders* might double down, arguing Lisa’s framing is irrelevant window-dressing; the core wrong (Mark’s dumping) is the only thing that matters, and her past is merely a distracting ad hominem. They could claim the case "stipulates the answer" by building the intuition of valid blame into the description. Both attacks highlight the case relies on the specific framing *being* the reason the blame lands, rather than proving the framing *should* be sufficient.

  **Where I'd come out**  
  For your column, lean on the **middle view**. This case powerfully shows that hypocrisy isn't a simple on/off switch for standing; the *manner* of criticism matters crucially. Transparency and self-inclusion can preserve the force of a reproach even when the critic shares the exact same blameworthy history. It demonstrates that the core offense of hypocrisy is often the *pretense* of innocence or superiority, not the mere fact of shared fault. However, it doesn't resolve whether Lisa's lack of genuine repentance *should* matter more, or prove that the permissive view is entirely wrong about the independence of the core criticism.
