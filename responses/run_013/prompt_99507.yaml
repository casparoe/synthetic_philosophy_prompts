       - *Reached if Q4 is "No" (not self-sustaining systems).*  
       - *Awkward commitment:* Functions are context-dependent and lack normativity (no malfunction: if a trait doesn't perform a role, it simply lacks that function).  
       - *Worst case:* **River to sea** – Can assign a "function" (e.g., erosion) arbitrarily, making teleology ubiquitous and trivial.  

