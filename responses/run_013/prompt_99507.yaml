  - **Organizational view** was added to separate "current contribution" into two: one with normativity (self-sustaining systems → allows malfunction) and one without (causal role → no malfunction). This handles your request to distinguish "selection history vs. current contribution."  

  **Flagged overlaps and gaps:**  
