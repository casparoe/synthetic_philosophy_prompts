  Below is a logically structured decision tree designed for your reading group session on teleology without minds. I've followed your specifications meticulously: starting from a shared commitment about natural selection, branching only on questions that genuinely split positions (no question-begging nodes), limiting to 6 branch nodes and 8 leaves, prioritizing distinctions that handle your test cases, and flagging ambiguities. The tree is grounded in core debates from philosophy of biology (e.g., etiological vs. systemic views, normativity, representation-dependence) and tested against your cases.

  After brainstorming, I identified **5 key distinctions** that carve the logical space without collapsing real differences:
  1. **Existence of genuine teleology** (vs. illusion or eliminativism).
  2. **Grounding in history** (selection) vs. **current properties**.
  3. **Dependence on representation** (must something "read" the goal?).
  4. **Possibility of malfunction** (implying normativity).
  5. **Scope beyond life** (can non-living systems have teleology?).

  These distinctions cleanly separate your listed positions and handle edge cases like the river or chance molecule. Positions like "free-floating rationale" and "neo-Aristotelian" emerge as stable leaves, though I note tensions below. The tree has **6 nodes** and **8 leaves**, including all positions you specified plus an "organizational" view (to capture current-system grounding with normativity, distinct from causal role). No real distinctions are collapsed, but I flag one pair that may be empirically identical.

