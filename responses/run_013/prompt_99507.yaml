  ### **Decision Tree: Teleology Without Minds**
  *Start from shared commitment:*  
  **"Natural selection produces traits that robustly appear designed for a purpose, and this appearance is not *merely* an illusion (i.e., it tracks objective facts about the world)."**

  1. **Q1: Is the 'for-ness' (purpose) of a trait genuinely teleological?**  
     *(Or is teleological language just a useful heuristic for describing non-teleological processes?)*  
     - **No** → Proceed to Q2.  
     - **Yes** → Proceed to Q3.  

  2. **Q2: Is teleological language nevertheless indispensable for explanation/prediction?**  
     *(Does it carve nature better than non-teleological alternatives?)*  
     - **Yes** → **Leaf 1: As-if instrumentalism** (e.g., Dennett).  
       - *Awkward commitment:* Must deny there's any fact of the matter about functions, even in clear cases like hearts or evolved traits.  
       - *Worst case:* **Immune system** – It "identifies" pathogens with high specificity; instrumentalism must treat this as *only* a useful metaphor, despite its predictive power.  
     - **No** → **Leaf 2: Eliminativism** (e.g., radical mechanists).  
       - *Awkward commitment:* Must replace all teleological explanations (e.g., "the heart pumps blood" as shorthand) with non-normative descriptions, losing explanatory depth.  
       - *Worst case:* **Bacterium in gradient** – Eliminating "seeking sugar" obscures the adaptive logic of run-tumble behavior.  

  3. **Q3: Is the 'for-ness' fixed solely by selection history?**  
     *(Must a trait have been selected *for* the function it serves?)*  
     - **Yes** → **Leaf 3: Etiological view** (e.g., Millikan, Neander).  
       - *Awkward commitment:* Vestigial traits (e.g., human appendix) or co-opted traits have no function; new advantages are epiphenomenal.  
       - *Worst case:* **Co-opted feather** – If selected for warmth but co-opted for flight without new selection, it has *no flight function*; this clashes with its current survival-critical role.  
     - **No** → Proceed to Q4.  

  4. **Q4: Is the 'for-ness' fixed by what the trait *currently* contributes to a self-sustaining system?**  
     *(Does teleology require a system whose persistence depends on the trait?)*  
     - **Yes** → **Leaf 4: Organizational view** (e.g., Mossio, Saborido; *coined name: "autonomous systems teleology"*).  
       - *Awkward commitment:* Functions vanish if the system isn't self-maintaining (e.g., a dying organism's heart loses its function).  
       - *Worst case:* **Chance molecule** – If it catalyzes a reaction in a test tube (no self-sustaining system), it has no function, even if it saves a life.  
     - **No** → Proceed to Q5.  

  5. **Q5: Does the 'for-ness' require that the goal is represented *somewhere*?**  
     *(Must there be an interpreter (actual or possible) or internal state that "reads" the rationale?)*  
     - **Yes** → **Leaf 5: Representational-dependence view** (unnamed; e.g., some enactivists).  
       - *Awkward commitment:* Teleology collapses where representation is absent (e.g., in plants or simple organisms).  
       - *Worst case:* **Slime mould maze-solving** – No representation, so no genuine teleology, despite optimal problem-solving.  
     - **No** → Proceed to Q6.  

  6. **Q6: Can teleology exist in non-living systems?**  
     *(Is purpose restricted to life-forms or their artifacts?)*  
     - **Yes** → **Leaf 6: Free-floating rationale** (e.g., Price, some process metaphysics).  
       - *Awkward commitment:* Teleology is "brute" – ungrounded in history, systems, or minds (risks pan-psychism or vagueness).  
       - *Worst case:* **River to sea** – Must accept the river has a "purpose" (shortest path) with no selector, interpreter, or life-form.  
     - **No** → **Leaf 7: Neo-Aristotelian view** (e.g., Thompson, Foot).  
       - *Awkward commitment:* Life-forms have intrinsic purposes irreducible to selection (seen as non-naturalistic by many).  
       - *Worst case:* **Chatbot** – It "seeks approval" via gradient descent, but not being alive, it has no genuine teleology.  
