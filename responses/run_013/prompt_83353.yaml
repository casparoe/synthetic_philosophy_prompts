answer: |-
  Here's a diagnosis of the impasse, analyzing the car-pushing case through the lens of your hypotheses:

  1.  **The Positions Clarified:**
      *   **Individualist:** A shared intention (e.g., to push the car) *just is* a complex structure of individual intentions (e.g., "I intend to push the car *because* I see you pushing and intend to push *because* you see me pushing..."), coupled with mutual beliefs/knowledge about each other's actions and responsiveness. Coordination emerges dynamically from individual cognitive states and perceptual feedback loops. Obligations are either non-existent in such ephemeral cases or reducible to individual moral principles (e.g., fairness, not freeloading).
      *   **Non-Individualist (Joint Commitment):** Truly acting together ("we pushed it") requires that the agents understand themselves as jointly committed to a goal *as a unit*. This commitment creates a new normative entity ("the pair") and generates interdependent obligations *specific to the joint action* (e.g., to not suddenly stop without warning). The "we" in "we intend" is primitive; it cannot be decomposed into "I intend that I do X and you do Y" without losing the essential sense of *shared agency* and its normative glue. An individual "I-intention" directed at a collective goal is insufficient without the joint commitment framing it.

  2.  **The Car-Pushing Case:**
      *   **Individualist Account:** This is a paradigm case *for* their view. Each stranger independently forms the intention to push the car. Each observes the other pushing and adjusts their force based on perceived effort and the car's movement. This continuous mutual adjustment, driven by individual intentions (to push the car *given* the other's presence and contribution) and perceptual feedback, *constitutes* the joint action. The sincere "we did it" report is simply a recognition of this successful, interdependent coordination emerging from individual actions and adjustments. No prior agreement or joint commitment is needed.
      *   **Non-Individualist Account:** This case is problematic but revealing. They likely argue: While coordination *happened*, it wasn't *joint action* in the full, normative sense *until* a minimal joint commitment crystallized. The moment each adjusts *recognizing the other as a co-agent* (not just an obstacle or random force) and commits *to pushing together*, a "we-mode" intention is formed. The sincere post-hoc "we" report suggests this minimal commitment *did* arise dynamically *during* the action. The obligation not to simply walk away mid-push without reason stems from this implicit commitment. The case highlights that joint commitment can form tacitly and quickly, but is still necessary for genuine "we did it" (as opposed to "I pushed and he happened to push too").

  3.  **Diagnosis: Different Questions** (Your hypothesis is largely correct). The car case reveals this starkly:
      *   The **Individualist** successfully answers the *causal-explanatory* question: *How is the coordinated pushing behavior physically and psychologically produced?* The answer lies in individual cognitive/perceptual/motor processes interacting in real-time. Their account *describes the mechanism*.
      *   The **Non-Individualist** answers the *normative-phenomenological-conceptual* question: *What makes this coordinated pushing count as a genuinely shared action ("ours") rather than merely two parallel individual actions, and what (if any) special obligations arise?* Their account focuses on the *mode of engagement* and its *normative consequences*. They seek the *constitutive conditions* for "we did it."
      *   **Revealing the Mismatch:** The Individualist's answer to the car case ("See? No commitment needed, just dynamic adjustment!") *assumes* the phenomenon to be explained is the coordinated *behavior*. The Non-Individualist's potential unease ("But was it *really* 'our' action from the start?") *assumes* the phenomenon to be explained is the *shared agency* aspect captured by the "we" report and its implied normativity. The Individualist provides an explanation of the coordinated *motion*; the Non-Individualist provides an account of the *shared action* as a distinct social kind. They are talking past each other by focusing on different aspects of the *same* event.

  4.  **Why Not the Rival Diagnoses?**
      *   **Not Simply Verbal (Shallow):** While terminology differs ("shared intention" vs. "we-intention"), the core disagreement isn't *just* about defining words. It's about whether the phenomenon requires a fundamentally new ontological or normative category (joint commitment) beyond interconnected individual states. Both sides agree something interesting is happening; they fundamentally disagree on *what kind of thing* it is.
      *   **Not Substantive-About-Explanation (Alone):** While there *is* a disagreement about explanatory goals (reduction vs. phenomenology/norms), this disagreement *stems from* the prior, deeper commitment to answering different primary questions about the phenomenon. The explanatory preference (psychology vs. normativity) is a *consequence* of the chosen question.
      *   **Not Substantive-About-Norms (Alone):** Norms are central to the Non-Individualist, but the Individualist *can* offer a reductionist account of norms (e.g., derived promises or fairness). The deeper split is whether "genuine" joint action *requires* a distinct normative source (joint commitment) irreducible to individual morality. This again points to the different questions (what constitutes the *sharedness* vs. how the coordination works).

  5.  **What Counts as Progress?** Given the "different questions" diagnosis, progress lies in **explicitly distinguishing the descriptive/explanatory project from the constitutive/normative project** and acknowledging both as valid but distinct:
      *   **Distinction:** Formally distinguishing between:
          *   **Coordinated Behavior:** Physical/psychological processes enabling multiple agents to achieve a goal interdependently (Individualist forte).
          *   **Joint Action (Shared Agency):** An action performed *together* under a minimal joint commitment, generating specific "we-mode" phenomenology and obligations (Non-Individualist forte).
      *   **Clarification:** Acknowledging that many instances involve both, but they are conceptually separable. The car case might start as mere coordinated behavior and *become* joint action when mutual recognition and minimal commitment crystallize.
      *   **Argument:** Showing how both accounts are necessary for a full picture: the Individualist explains *how coordination happens*, the Non-Individualist explains *what makes it "ours"* and *why specific obligations bind us*.
      *   **Formal Result:** Models showing how joint commitment dynamics *supervene* on complex individual intention/belief/perception structures *without* being identical to them, satisfying both camps' core insights at different levels.

  **Conclusion:** The decades-long impasse arises because one side explains the *mechanics* of coordination while the other articulates the *constitution* of shared agency and its normative core. They address fundamentally different, though related, questions about the same complex phenomenon. Recognizing this dissolves the appearance of direct conflict.

  \answer{different-questions} The camps provide complementary explanations targeting distinct aspects of social phenomena: causal mechanisms of coordination versus constitutive conditions and norms of shared agency.
