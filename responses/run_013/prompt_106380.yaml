answer: |-
  Here's a concrete example designed to highlight the conceptual puzzle of "baseline-shifting supererogation," avoiding trolleys and focusing on the structural issue:

  **The Scenario: The Avalanche & The Relay Rescue**

  1.  **Initial Situation:** A massive avalanche buries a remote mountain lodge. Emergency services deem it *impossible* to reach safely until the next day due to extreme avalanche risk and treacherous terrain. Rescuers would face near-certain death attempting an immediate rescue. Everyone agrees: **No one is morally obligated** to attempt a rescue tonight. It would be **heroic (supererogatory)** if someone tried, but refusing carries no blame.

  2.  **The First Supererogatory Act:** Alex, an exceptionally skilled and daring mountaineer, *volunteers*. Against all advice, Alex takes immense personal risk, navigates the unstable slopes miraculously, and reaches the lodge. Alex radios back: survivors are trapped but alive, and Alex has established a precarious but *safe anchor point* halfway back. Crucially, Alex is now exhausted and injured; they can stabilize survivors at the lodge but **cannot bring anyone back alone**. The *only* way to get survivors out *tonight* is if another rescuer uses the **safe path Alex created** to reach the anchor point, then helps Alex escort survivors back along that now-partially-secured route. The risk for this second rescuer is now **significantly reduced** (though still substantial) because of Alex's actions.

  3.  **The Second Choice:** Ben, another capable rescuer, is at base camp. The call comes: "Alex made it! Survivors need escorting back *now* using the route Alex secured. Ben, you are the only one positioned/fit enough to go *right now*." The risk to Ben is real but manageable (perhaps moderate danger vs. Alex's near-suicidal risk). The potential gain is immense: saving lives that were unreachable before Alex acted.

  4.  **The Puzzle:** If Ben refuses to go...
      *   **Before Alex Acted:** Ben's refusal would have been **blameless**. Attempting rescue was supererogatory, not obligatory.
      *   **After Alex Acted & Succeeded:** Ben's refusal seems **morally problematic**. Why?
          *   The cost/risk to Ben is *dramatically lower* than it was for Alex initially (due to the established path and anchor).
          *   The potential benefit is *even higher* now (lives are confirmed present and savable *tonight* via this specific route).
          *   Alex's supererogatory act created a *new opportunity and dependency*. Failing to act now doesn't just *not save* lives; it arguably *wastes* Alex's costly supererogatory effort and *abandons* survivors who are now reachable solely because of Alex.

  **The Sharp Conceptual Issue Exposed:**

  This scenario challenges the core structure of supererogation by asking: **Can a supererogatory act *generate* new, enforceable moral obligations for others that did not exist prior to the act?**

  1.  **The Static View of Obligation:** Traditional supererogation assumes the baseline of obligation is fixed by the *initial* circumstances (cost, risk, benefit, feasibility). Alex's act was beyond duty because the initial cost/risk was prohibitive. Ben's situation *looks* different, but if obligations are set solely by *initial* conditions, Ben might still be free to refuse. But this seems counterintuitive – Ben's refusal now feels like a *failure*.
  2.  **The Dynamic View & Shifting Baseline:** Alex's act fundamentally altered the moral landscape:
      *   **Reduced Cost/Risk:** What was once impossibly dangerous is now merely risky.
      *   **Increased Feasibility & Benefit:** Saving lives is now concretely possible via a specific, known method.
      *   **Created Dependency:** Survivors are now *reliant* on follow-through; Alex's effort is an *investment* requiring completion.
      *   **Induced Reliance:** Alex acted partly in the expectation (or hope) that *if* they succeeded, others would help with the now-possible next step.
  3.  **The Core Tension:**
      *   If Ben *is* now obligated to go (or blameworthy for refusing), then Alex's supererogatory act *created* an obligation that didn't exist before. This seems to blur the line between supererogation and duty. Does "going beyond duty" mean you sometimes *impose* duties on others?
      *   If Ben is *not* obligated and refusal is blameless, then we face the counterintuitive result that Alex's heroic success doesn't fundamentally change the obligations of others, even when it creates a much easier, high-stakes rescue opportunity that relies on their effort. This risks making supererogatory acts that create dependencies seem futile or even irresponsible.

  **Why it's a Structural Issue, Not Just Consequentialism:**

  The puzzle isn't *just* that Ben's refusal has worse consequences (though it does). It's about how the *successful performance* of a supererogatory act **redefines the factual circumstances** (risk, cost, feasibility, dependency) that **determine the baseline of obligation itself**. The core question is whether the moral baseline for obligation is static (based solely on the initial state) or dynamic (sensitive to changes *caused* by supererogatory acts). This strikes at the heart of how we define the boundary between the obligatory and the supererogatory when actions reshape the world others act within. Your term "baseline-shifting supererogation" perfectly captures this conceptual knot.
