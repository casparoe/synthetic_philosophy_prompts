prompt: |-
  Ok so I've been going down a rabbit hole on the "historical Jesus" question — trying to sort out which sayings and deeds in the gospels actually go back to the guy and which got added by the early church — and there's a pattern in how the arguments work that I can't find a name for.

  The basic move is always: you've got a rule for sorting the material. Like 'if a story would have embarassed the early church, it's probably old, since why would they invent something that made them look bad.' Or 'if a saying sounds unlike both the Judaism of the time and the church's own concerns, it probably goes back to him.' Or the one that really gets me: 'if it coheres with the stuff you've already decided is authentic, count it as authentic too.'

  Fine, sure. But heres what's bugging me. To use the first rule I have to know what the early church would have found embarrassing — and I know that from the same documents I'm trying to sort. To use the second I have to know what the Judaism of the time was like and what the church's concerns were, and those reconstructions lean on the same texts. So the rule needs the answer in order to do its work. And when two of the rules disagree about a passage — one says yes, one says no — nobody tells you how to weigh them. So in practice I watch people reach for whichever rule lands where they already wanted to land, and the rule turns into an announcement of the verdict rather than a way of arriving at one.

  There's a bigger version of it too: if you keep only what's unlike its setting, you end up with a figure who doesn't belong to any setting at all, which strikes me as a reason to distrust the rules, not a discovery about him. And I've read people who run the second rule exactly backwards — more likely authentic the *more* it fits its Jewish setting — presented with the same air of obviousness.

  So: does this have a name? My hunch is it's a version of something general in philosophy, something about needing the criterion to sort the cases and the cases to justify the criterion. But I don't know what that thing is called, and I'm not sure it's really it, because my version seems to have extras: the rules fight each other, and they were all sold to me as neutral. What are the nearest concepts, how does what I'm describing differ from each one, and which fits best? If nothing quite fits, name it yourself and tell me where the edges are — what's inside it and what's next to it but outside. Don't just hand me a label, I want the thing carved. (If the honest answer is 'this is just a fallacy,' say that, but my instinct is it isn't, since in small doses the move seems reasonable.)

  One format thing: make the very last line of your answer read exactly \answer{...} with just the name of the best-fitting concept inside the braces, or none if nothing fits, and put a one-sentence statement of the core pattern on the line right before it.
reasoning: |-
  Hmm, the user is diving deep into historical Jesus studies and has noticed a methodological problem in how scholars sort authentic sayings from later additions. They describe a circular pattern: criteria for authenticity rely on assumptions derived from the very texts being evaluated. For example, the "criterion of embarrassment" requires knowing what the early church found embarrassing, which comes from the Gospels themselves. Similarly, the "criterion of dissimilarity" needs prior knowledge of both Judaism and early Christianity, again sourced from these texts. The user also points out inconsistencies—scholars sometimes apply these criteria in contradictory ways (e.g., dissimilarity vs. coherence), and the choice between them often seems predetermined by the scholar's desired conclusion.

  The user wants to know if this circularity has a name in philosophy or historical methodology. They suspect it's related to a broader epistemological issue but note extra complications: conflicting criteria presented as objective, and the risk of creating a historically implausible Jesus when applying dissimilarity strictly. They also observe that scholars sometimes reverse the criteria (e.g., authenticity via similarity to Judaism) with equal confidence. Their request is precise: identify the closest conceptual fit, explain nuances, and end with a specific format.

  Key elements of their observation:  
  - **Circular dependence**: Criteria require prior knowledge that the texts themselves supply.  
  - **Conflict between criteria**: No clear hierarchy when rules disagree (e.g., dissimilarity vs. coherence).  
  - **Criterion shopping**: Selectively applying rules to reach preferred outcomes.  
  - **Historical implausibility**: Over-reliance on dissimilarity isolates Jesus from his context.  
  - **Reversed applications**: Same criteria used oppositely (dissimilarity vs. similarity) without justification.  

  Philosophical/historical concepts to consider:  
  1. **Epistemic circularity**: Needing X to justify Y while needing Y to justify X. Fits the criterion/text interdependence.  
  2. **Underdetermination**: Evidence insufficient to uniquely determine conclusions, allowing bias to sway outcomes. Explains criterion shopping.  
  3. **Problem of the criterion**: A meta-epistemological dilemma about justifying standards of knowledge. Directly addresses the rule/case loop.  
  4. **Confirmation bias**: Favoring criteria that support preconceptions. Relevant but too narrow; doesn't cover the structural circularity.  
  5. **Methodological circularity**: Broader than epistemic; includes practical application flaws. Captures the self-reinforcing system.  

  Why "Methodological circularity" fits best:  
  - **Core pattern**: Criteria for authenticity presuppose conclusions about the texts they evaluate.  
  - **Extras covered**:  
    - Conflict: Circular systems often have internal tensions (e.g., dissimilarity vs. coherence pulling opposite directions).  
    - False neutrality: Circularity masquerades as objectivity.  
    - Reversed applications: Circular methods can absorb contradictions without breaking.  
  - **Distinctions**:  
    - Not *just* epistemic circularity (which is purely about justification) because it involves applied historical tools.  
    - Not underdetermination alone (which focuses on evidence ambiguity) because the circularity creates the ambiguity.  
  - **Edge cases**: Excludes honest disagreements where criteria are weighted transparently; includes cases where circularity is obscured by scholarly rhetoric.  

  Final name justification:  
  - "Methodological circularity" is recognized in historiography (e.g., in Bauer's critiques of form criticism).  
  - It encompasses both the logical loop and its practical fallout (criterion shopping, historical distortion).  
  - User's "extras" are features, not bugs, of this circular system.
answer: |-
  Your observation cuts to the heart of a pervasive issue in historical Jesus studies and critical methodology more broadly. What you're describing isn't a single fallacy but a *system* of interdependent problems arising from the application of authenticity criteria. The core pattern is this: **Criteria for determining historical authenticity rely on reconstructions that themselves depend on the very material being evaluated, creating a self-referential loop where methodological rules both presuppose and produce their conclusions, often inconsistently applied to serve prior assumptions.**

  Here's how the concepts map to your description, with distinctions:

  1.  **Epistemic Circularity:** This is the foundational issue—the criterion requires knowledge only obtainable through the texts it judges (e.g., knowing what embarrassed the church requires reading the texts to learn what embarrassed the church). It fits the "needing the criterion to sort the cases and the cases to justify the criterion" loop. *However*, it doesn't fully capture the "extras": the conflicts between criteria, the criterion shopping, or the potential for historical implausibility.

  2.  **Underdetermination of Theory by Data:** This describes how the evidence (Gospel material) is insufficient to *uniquely* determine a single valid conclusion (what's authentic) using the proposed criteria. This explains *why* conflicting criteria can be applied to the same data and why scholars can reach different conclusions using the same rules—the rules don't provide enough constraint. It accounts for the "rules fight each other" and selective application ("whichever rule lands where they already wanted to land"). *However*, it's a broader concept about evidence ambiguity and doesn't specifically name the *circular dependence* of the criteria on the data they process.

  3.  **Problem of the Criterion (in Epistemology):** This classic philosophical dilemma (e.g., in Sextus Empiricus, Chisholm) asks how we justify a criterion for knowledge without already knowing what knowledge is (or vice versa). It directly mirrors your core loop: justifying a rule for sorting authentic material requires knowing what authentic material looks like, which requires the rule. *However*, it's highly abstract and doesn't inherently address the practical conflicts between multiple competing criteria, the historical context issues, or the reversal of rules ("more likely authentic the *more* it fits") within the same field.

  4.  **Confirmation Bias (specifically "Criterion Shopping"):** The tendency to favor rules or evidence confirming pre-existing beliefs explains the selective application of criteria ("whichever rule lands where they wanted"). *However*, this is a psychological bias and doesn't encompass the structural *circularity* inherent in the criteria themselves. The bias exploits the methodological flaw but isn't the flaw itself.

  5.  **Methodological Circularity:** This is the best-fitting concept. It synthesizes the core issues:
      *   **Self-Referential Justification:** The criteria derive their validity and application parameters (what's embarrassing, what's Jewish, what's early church) from the dataset they are meant to evaluate.
      *   **Internal Conflict & Inconsistency:** Multiple criteria (dissimilarity, embarrassment, coherence, multiple attestation) often conflict, with no established meta-criterion for resolving disputes. This is *part* of the circular system's dysfunction.
      *   **Presupposition of Results:** The application of a criterion often subtly assumes the very historical reconstruction it purports to test (e.g., dissimilarity assumes a Jesus radically unlike Judaism/church, coherence assumes a core of authentic material exists and is identifiable).
      *   **False Neutrality:** The criteria are presented as objective tools, but their circular dependence and the lack of conflict-resolution make them malleable instruments for achieving desired results.
      *   **Historical Implausibility:** The "bigger version" you note (creating a Jesus belonging to no context via dissimilarity) is a *consequence* of the flaw: uncritical application of a circular criterion produces historically nonsensical results.
      *   **Rule Reversal:** The use of similarity *or* dissimilarity as an authenticity criterion with equal "obviousness" highlights the lack of stable justification within the methodology; the rule is secondary to the desired outcome.

  **Why "Methodological Circularity" Fits Best:**
  *   It directly names the self-referential loop inherent in applying these criteria.
  *   It encompasses the practical consequences you observed: the conflicts, the shopping, the implausible results, and the rule reversals, as natural outcomes of a fundamentally circular system that lacks independent grounding.
  *   It distinguishes this from simple logical fallacies (like begging the question, which is a specific argument form) or pure psychological biases. It's a *systemic flaw* in the application of the historical-critical method in this domain.
  *   It's recognized within the field. Critics (like Dale Allison, Chris Keith, Anthony Le Donne) explicitly critique the "criteria approach" as suffering from circularity, inconsistency, and producing an incoherent picture of Jesus. Your point about reconstructions of Judaism/Church relying on the same texts is a key part of this critique – the "context" used for dissimilarity/coherence is built from the texts under evaluation.

  **Edges of the Concept:**
  *   **Inside:** Any historical method where the tools used to analyze/sort evidence rely for their definition, calibration, or justification on the same body of evidence they are meant to interpret, especially when competing tools exist with no clear way to adjudicate between them.
  *   **Outside/Adjacent:**
      *   **Honest Disagreement on Weighting:** Cases where scholars transparently argue *why* one criterion (e.g., multiple attestation) should outweigh another (e.g., dissimilarity) in a specific case, based on reasoned meta-principles.
      *   **Bias Without Circularity:** A scholar favoring passages supporting a theological view, but using genuinely independent criteria (e.g., archaeology) where possible.
      *   **Well-Grounded Criteria:** A criterion verified or calibrated against truly independent evidence (e.g., using non-Christian sources about 1st-century Jewish views to inform dissimilarity, though these are scarce for Jesus).
      *   **Pure Logical Fallacy:** A single argument directly assuming its conclusion (begging the question).

  **Conclusion:** You've identified the central methodological weakness in traditional "criteria of authenticity" approaches. The best name for this constellation of issues—the circular dependence, internal conflict, criterion shopping, and resulting implausibility—is **Methodological Circularity**. It renders the criteria less objective discovery tools and more like rhetorical devices within a self-contained, self-justifying system.

  The core pattern is criteria relying on the data they sort, creating a self-justifying loop.
  \answer{Methodological Circularity}
