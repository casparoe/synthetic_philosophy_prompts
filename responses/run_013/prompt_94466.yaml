answer: |-
  ## Proposal: Disentangling Corruption - A Conceptual Framework for Resolving the Relativist-Universalist Impasse

  **1. Research Question:**  
  Is the predicate "corrupt" fundamentally *role-relative*? Specifically, does a practice only qualify as corruption if it constitutes a breach of a duty *internal to a specific, socially recognized role* held by the agent? If this role-relativity holds, does the persistent dispute between cultural relativists and universalists over corruption primarily reduce to a *factual disagreement* about the existence and content of roles and their internal duties within specific societies, rather than an irreconcilable clash of normative values?

  **2. The Stalemate & The Gap:**  
  The debate surrounding corruption is mired in opposition. On one side, universalist approaches (exemplified by cross-national indices like CPI, TI rankings, and aid conditionality) treat corruption as a singular, universally condemnable phenomenon defined by practices like bribery or nepotism violating abstract principles of impartiality and public interest. On the other side, cultural relativists (primarily ethnographers) argue that practices labeled "corruption" (e.g., gift-giving, patronage) are often deeply embedded social norms, essential for reciprocity, trust, and governance in specific contexts. Applying the universalist label is seen as ethnocentric and imperialistic.

  **This stalemate persists because both sides implicitly treat "corruption" as a monolithic concept.** The universalists measure and condemn based on the *thick* standard (impartiality, abstract public good), while the relativists defend practices against this same standard, arguing they serve different *thick* social goods. Crucially, **neither camp systematically examines the possibility that the core, minimal predicate "corrupt" might be something else entirely – a *thin*, role-relative concept.** This project argues that the intense disagreement stems from conflating these two distinct predicates hiding under one word. The universalist indices primarily measure breaches of the *thick* standard (comparative impartiality), but present it as if it were the *thin* standard (role betrayal), inviting relativist critique. This project directly addresses this conceptual conflation, a gap overlooked in current scholarship.

  **3. Methodology: Conceptual Analysis & Role Deconstruction (What I Will Do All Day):**  
  This is a primarily *conceptual* and *analytical* project, requiring detailed philosophical and institutional analysis rather than new ethnographic fieldwork. Over six months, my work will involve:

  *   **Conceptual Mapping & Distillation:** Systematically analyzing philosophical, legal, political science, and anthropological literature to rigorously define and distinguish the proposed "thin" (role-relative duty-breach) and "thick" (comparative impartiality breach) predicates of corruption. Identifying key characteristics and necessary/sufficient conditions for each.
  *   **Role Analysis:** Examining definitions of specific roles (e.g., public official, judge, procurement officer, civil servant, corporate fiduciary) across different cultural and legal contexts (using constitutions, civil service codes, job descriptions, legal statutes, anthropological accounts). The focus is on identifying the *internally defined duties and purposes* of these roles that, if breached *for personal gain or favor*, would constitute the "thin" corruption.
  *   **Case Study Reinterpretation:** Applying the thin/thick framework to well-documented historical and ethnographic cases of contested "corrupt" practices (e.g., patronage appointments, "grease" payments, gift exchanges). Does the framework clarify why the practice is condemned (thin breach?) or why the relativist defense resonates (lack of such a role? conflict with thick impartiality norm?).
  *   **Testing the Hypothesis:** Rigorously evaluating whether the relativist/universalist debate *can* be productively reframed, using the literature and cases, as primarily concerning: (a) The factual existence/non-existence of specific roles with internal duties in a society; (b) The specific *content* of those internal duties; (c) The validity of applying a *separate*, thick norm of impartiality.

  **Why Conceptual Analysis Beats (Just) More Ethnography:**  
  While ethnography provides essential context, the core problem here is *conceptual confusion* baked into the terminology itself. More ethnography, without resolving this confusion, risks adding more examples to the existing stalemate. This project provides the necessary conceptual toolkit. It clarifies *what is actually being disputed* in each case: Is it a betrayal of a locally recognized role-duty (thin)? Or a clash over the desirability of an impartiality norm (thick)? This framework doesn't replace ethnography; it *structures and refines* future empirical work by providing clearer questions and concepts. Ethnographers can then more precisely investigate: "Does role X with duty Y exist here?" rather than debating whether practice Z is universally "corrupt."

  **4. Outcomes & Success Criteria:**

  *   **Good Result/Success:** The project successfully demonstrates that:
      1.  The "thin," role-relative predicate is a coherent and distinct core concept of corruption.
      2.  Many core disputes *are* resolvable by applying this lens, showing they hinge on factual disagreements about the existence/content of roles and duties, not fundamental value clashes.
      3.  Existing indices primarily measure the "thick" predicate while implicitly claiming universality for the "thin," explaining the relativist backlash.
      4.  The framework offers a clearer, less ethnocentric basis for cross-cultural dialogue and policy design. Success is evidenced by a completed draft manuscript for a significant journal article and a structured outline for a future monograph.
  *   **Failure/Project Risks:** The project fails if:
      1.  The role-relative concept cannot be coherently defined or consistently distinguished from the thick concept.
      2.  Analysis reveals that the relativist critique fundamentally targets the *application* of *any* external normative standard (including internal role duties), meaning the dispute *is* primarily about values after all.
      3.  The framework provides no new clarity when applied to contested cases. Failure would be indicated by an inability to resolve ambiguities or produce a coherent analytical narrative.

  **5. Significance for Governance Funders:**  
  Funders committed to improving governance and combating corruption face a practical dilemma: policies based on universal indices often fail or provoke backlash due to perceived cultural insensitivity, while cultural relativism can seem to justify inaction. This project offers a breakthrough. By disentangling the concepts, it provides:

  1.  **Sharper Diagnostics:** Enables policymakers to distinguish between practices that constitute a betrayal of *local* institutional roles (likely corrosive and actionable with local support) vs. practices that merely conflict with external *impartiality* norms (requiring different, often more nuanced approaches like norm-building or institutional redesign).
  2.  **More Legitimate Interventions:** Provides a principled, non-imperialistic basis for identifying *locally relevant* corruption (breach of *their* roles/duties), increasing the legitimacy and potential effectiveness of reform efforts.
  3.  **Better Measurement:** Lays the groundwork for developing context-sensitive measurement tools that focus on breaches of *actually existing* institutional duties, moving beyond one-size-fits-all indices.
  4.  **Reframed Dialogue:** Transforms a heated, often unproductive value clash into a more constructive discussion about the factual structure of roles, duties, and institutions within specific societies. This conceptual clarity is essential for designing effective, sustainable, and culturally attuned anti-corruption strategies.

  This six-month project will deliver the foundational conceptual framework necessary to move beyond the current impasse and build more effective, legitimate approaches to combating corruption globally.
