prompt: |-
  I run a biweekly reading group that mixes philosophy and cognitive-science graduate students, and I have been handed one ninety-minute session on self-deception — specifically on the question whether the phenomenon is even coherent, given that to deceive someone normally means getting them to believe what you take to be false. I do not want the topic explained to me; I want a plan for teaching it. Tell me the order the pieces must come in and why each depends on the one before it: the everyday datum that there is something here to explain, the paradox itself, and then the candidate resolutions — a divided mind in which one subsystem hides a truth from another, a temporal story in which the belief is somehow both acquired and disowned, and a deflationary story on which no belief is ever really formed and the agent only steers attention away from evidence or half-pretends. Tell me which single case should carry the whole session and what it must have and lack. I had planned to use the standard jealous-partner case, but I suspect it quietly assumes that the agent already holds the belief she is supposed to be hiding, which would make the paradox look like a trick of description, so say whether it can be repaired or should be dropped. Then give me the misconceptions to expect, in the order the group will actually hit them — that self-deception is just lying to yourself, that it requires two people or a little agent inside, that it is merely weakness of will or wishful thinking under a fancier name — and the exact point in the sequence where each should be headed off, including how to keep the deflationary resolution from collapsing the whole topic into triviality. Close with one question I can put to the group at the end that would reveal whether they have understood why this is a genuine puzzle rather than a curiosity of vocabulary. Finally, tell me what to leave out at this level and to say so openly. No readings or citations — I want the teaching plan, not the bibliography.
reasoning: |-
  Okay, the user is running a biweekly reading group for philosophy and cognitive science grad students, and they've been tasked with leading a 90-minute session on the coherence of self-deception. They specifically want a teaching plan, not explanations or readings. Let me break down their requirements.

  First, they need the session structured in a specific order: starting with everyday data, then the paradox, followed by candidate resolutions (divided mind, temporal, deflationary). They want a single case study to carry the session, and they're unsure about using the jealous partner example because it might assume pre-existing belief. They also need misconceptions addressed in the order they're likely to arise during the session, and a closing question to check understanding. Finally, they want clarity on what to exclude.

  The user's explicit needs are clear, but their deeper concerns might include ensuring the session is engaging for both philosophy and cognitive science students, avoiding trivializing the topic, and effectively highlighting why self-deception is a genuine philosophical puzzle. They might also worry about time management and keeping the discussion focused without getting bogged down in technical details.

  For the case study, the jealous partner example is common but problematic because it often implies the person already believes the truth. A better alternative would be a health denial scenario where the evidence is ambiguous. This avoids the pre-existing belief issue and allows exploration of attention manipulation and biased evidence assessment. It's relatable and fits all resolution models.

  Addressing misconceptions in sequence is crucial. Early on, someone might confuse self-deception with lying to oneself. During the paradox discussion, it's important to clarify that it's not about two agents but subsystems. When discussing resolutions, distinguishing from weakness of will and wishful thinking is key. The deflationary approach might seem to trivialize, so emphasizing that it still involves complex cognitive processes can prevent that.

  The closing question needs to highlight the paradox's core: how self-deception differs from interpersonal deception without collapsing into inconsistency. Asking how the deflationary view maintains the paradox without belief formation does this effectively.

  Exclusions should include empirical studies, clinical cases, and moral implications to stay focused on the conceptual puzzle. Mentioning these upfront manages expectations.

  Overall, structuring the session to build from the intuitive recognition of the phenomenon to the paradox and then resolutions ensures logical progression. Using a single case throughout maintains focus, and addressing misconceptions as they naturally arise keeps the discussion on track. The key is to emphasize why self-deception remains a puzzle despite various resolutions, highlighting the tension in the standard definition.
answer: |-
  Here's a focused 90-minute teaching plan, structured to build the puzzle logically and address pitfalls head-on:

  **Core Case Study:** **Health Denial**  
  *Use a person (Alex) presented with ambiguous but concerning symptoms (e.g., persistent cough, weight loss) and strong risk factors (e.g., heavy smoker, family history) for a serious illness (e.g., lung cancer). Alex actively avoids the doctor, dismisses friends' concerns ("just a stubborn cold"), focuses on counter-evidence ("I feel fine most days!"), and makes optimistic future plans.*  
  *Why it works:*  
  1.  **Lacks Pre-existing Belief:** Crucially avoids assuming Alex *already* believes the diagnosis. Alex is reacting to *threatening evidence*, not a formed belief.  
  2.  **Shows Key Behaviors:** Evasion, biased evidence assessment, motivated reasoning, avoidance of confirmation.  
  3.  **Fits All Resolutions:** Can be analyzed through Divided Mind, Temporal, *and* Deflationary lenses.  
  *Drop the jealous partner case* for this session; its typical framing often smuggles in the problematic prior belief.

  **Session Structure (90 mins):**

  1.  **The Datum: Everyday Self-Deception (15 mins)**  
      *   **Activity:** Quick group brainstorm: "Describe a *concrete* behavior or thought pattern you'd call 'self-deception'." Guide towards examples like Health Denial, procrastinator's excuses, belief in doomed relationships.  
      *   **Focus:** Establish *phenomenological consensus* – there's *something* intuitive we point to: systematic avoidance of uncomfortable truths while behaving in ways suggesting some awareness.  
      *   **Why first?** Grounds the discussion in pre-theoretical intuition. Without this shared sense of a phenomenon, the paradox seems academic.

  2.  **The Paradox: Why is this Puzzling? (20 mins)**  
      *   **Present the Paradox:**  
          1.  Deceiving *X* typically requires: (a) *You* know/believe ~P, (b) You *intend* X to believe P, (c) You *cause* X to believe P (where P is false).  
          2.  In self-deception (SD): *You* are both deceiver (A) and deceived (X).  
          3.  Problem: How can you *believe* ~P (as deceiver) and simultaneously be *caused to believe* P (as deceived)? Doesn't A's belief that ~P preclude X's belief that P (in the same mind)?  
      *   **Apply to Case:** "In Health Denial, if Alex *is* self-deceived about being ill: What is the 'deceptive' belief? Who is the deceiver? Who is deceived? How can Alex *both* know the truth (to hide it) *and* believe the falsehood?"  
      *   **Why next?** The datum creates the target; the paradox shows why hitting that target with our standard concept of deception is logically tricky. It defines the *explanandum*.

  3.  **Candidate Resolutions (45 mins - 15 mins each)**  
      *Structure each resolution by asking: How does this model resolve the paradox? How does it explain Health Denion? What are its strengths/weaknesses?*  
      *   **A. Divided Mind (e.g., modules, subsystems):**  
          *   *Idea:* Mind isn't unitary. One subsystem ("The Defender") detects the threatening truth (risk of illness), another ("The Optimist") maintains the desired belief ("I'm healthy"). The Defender *hides* evidence/inhibits belief-formation in the Optimist.  
          *   *Resolves Paradox:* Deceiver (Defender) and Deceived (Optimist) are distinct subsystems.  
          *   *Case:* Defender detects symptoms/risk, suppresses access for Optimist, who focuses on feeling "fine."  
          *   *Why first?* Most intuitively extends the interpersonal model.  
          *   **Misconception to Head Off HERE:** "This requires two *people* or a homunculus!" → Emphasize: Subsystems are *subpersonal*, automatic cognitive processes (like implicit biases), not little conscious agents. The "deceiver" isn't consciously plotting.
      *   **B. Temporal/Process Model (e.g., biased evidence gathering/weighting):**  
          *   *Idea:* SD is a *dynamic process* over time. You *acquire* the belief that P is likely true (unconsciously/aversively), but simultaneously engage in motivated cognition (avoiding doctors, downplaying symptoms, seeking counter-evidence) to prevent this belief from becoming *stable, conscious,* or *action-guiding*. Belief formation is never complete or is disowned.  
          *   *Resolves Paradox:* The "knowing" and "believing" aren't simultaneous *stable* states. There's a flickering awareness actively suppressed, or a proto-belief never fully endorsed.  
          *   *Case:* Alex feels a pang of fear (proto-belief) seeing a cancer ad, then *immediately* distracts self, remembers a healthy relative, dismisses the cough.  
          *   *Why next?* Addresses the "simultaneity" worry of Divided Mind by spreading the process out.  
          *   **Misconception to Head Off HERE:** "This is just *weakness of will* (akrasia)!" → Highlight: Akrasia is acting *against* your better judgment (a conscious belief). SD involves *avoiding forming or acknowledging* the "better judgment" itself. Also head off: "It's just *wishful thinking*!" → Concede overlap, but argue SD involves *active, sustained effort* to *maintain* the wishful state against evidence (avoidance, not just hoping).
      *   **C. Deflationary (e.g., pretense, attention steering, no contradictory belief):**  
          *   *Idea:* There is no full contradictory belief. The agent *avoids forming* the threatening belief in the first place. They *steer attention away* from evidence, *half-pretend* the desired state is true, or engage in behavior *as if* they believe P, without ever stably believing ~P *or* P. Self-deception is primarily about *doxastic* (belief-forming) *irresponsibility* or *imagination*.  
          *   *Resolves Paradox:* By denying condition (a) - the deceiver doesn't *believe* ~P. They merely suspect it, fear it, or know evidence points to it, and *act* to prevent belief formation.  
          *   *Case:* Alex isn't convinced they *are* sick, nor convinced they *are* healthy. Alex *avoids* the doctor *because* they recognize the *risk* is real and don't want to know. They focus on feeling "fine" *to prevent* the thought "I might be sick" from solidifying.  
          *   *Why last?* It fundamentally challenges the initial framing of the paradox.  
          *   **Misconception to Head Off HERE:** "This collapses SD into triviality - it's just denial/avoidance!" → **Crucial:** Argue this *preserves* the core phenomenon (systematic, motivated avoidance of truth) while dissolving the *logical* paradox. The puzzle was *created* by forcing SD into the interpersonal deception mold. This view says SD is a *different kind of thing* - a failure of epistemic rationality, not a literal deception *of oneself by oneself* with two full beliefs. The phenomenon remains significant; the *description* changes.

  4.  **Synthesis & The Puzzle's Core (10 mins)**  
      *   Briefly recap: We have a phenomenon (Datum), a logical problem applying "deception" to it (Paradox), and three families of solutions offering different pictures of the mind (Resolutions).  
      *   **The Enduring Puzzle:** The core tension is between the *intentional, active, truth-avoiding* character of SD (making it seem "deceptive") and the requirement for *contradictory intentional states* within a single agent that "deception" implies.  
      *   **Revealing Closing Question:** **"Does the Deflationary resolution successfully dissolve the paradox of self-deception, or does it simply change the subject by denying that genuine self-deception (in the strong, paradoxical sense) ever occurs? What, if anything, is *lost* if we accept the Deflationary view?"**  
          *   *Why this question?* It forces engagement with the *source* of the paradox (the strong definition) and whether the phenomenon *demands* that strong definition. A good answer recognizes Deflationary dissolves the *logical* paradox but might leave a *psychological* puzzle about the mechanisms of persistent, motivated irrationality. A poor answer either dismisses Deflationary as irrelevant or clings to the strong paradox as the only "real" SD.

  **What to Explicitly Leave Out (State Upfront):**  
  1.  **Empirical Evidence:** We're focusing on the *conceptual coherence* puzzle, not fMRI studies or clinical data on denial.  
  2.  **Moral Implications:** Whether SD is blameworthy, beneficial, etc., is important but secondary to the coherence question.  
  3.  **Full Taxonomy:** Not covering all proposed types/varieties of SD (e.g., "twisted" SD believing bad things).  
  4.  **Deep Dive into any Single Theory:** No exhaustive analysis of Freud, Davidson, Mele, etc. We're mapping the logical landscape.  
  5.  **Evolutionary Arguments:** Why SD might exist is fascinating but distinct from *how* it's possible.  

  **Key Teaching Moves:**  
  *   **Relentlessly Anchor in Health Denial:** Test *every* point against this case. "How does that apply to Alex?"  
  *   **Preempt Misconceptions:** Introduce them *as* you reach the point where they naturally arise (as outlined above), not in a separate list.  
  *   **Highlight the Definitional Tension:** Keep returning to the core tension: Active truth-avoidance vs. Simultaneously holding contradictory beliefs.  
  *   **Validate Deflationary:** Don't let it be dismissed. Frame it as a serious contender that redefines the phenomenon to *avoid* the paradox.  
  *   **Manage Time Strictly:** 15/20/45/10 is tight. Stick to it. Use the case to keep discussions focused.  

  This structure builds from intuition to paradox to solution, using one robust case to test everything, while proactively dismantling common misunderstandings and preserving the depth of the philosophical puzzle.
