prompt: |-
  I run civic engagement for a city of about 300,000 — two staff, no in-house research capacity — and after a long and ugly fight the council has authorized a pilot citizens' panel on a housing question: sixty residents drawn by lottery, meeting over four weekends, with a mandate to recommend, and a public promise that any recommendation clearing two-thirds goes straight to a referendum. If the pilot goes well, the panel becomes a standing institution with a fresh question every year; if it goes badly, the idea dies with it, and I'm not naïve about the fact that my process choices will be read as choices about who gets to count. I've read enough of the theory of sortition and lottocracy to grasp the shape of the case for it — that a randomly constituted body has no faction to reward and no base to please, and that the lottery is doing justificatory work rather than merely picking people — but the theory seems to stop exactly where my job begins. Almost every operational decision I have to make looks as though it smuggles in a normative one, and I have no way of telling which ones do.

  Please write me a decision procedure my team could actually run, in order, for the choices that will recur every cycle: the sample frame, and whether to stratify, on which variables, and how much of the mirror-the-city ideal I can trade away for deliberation quality; what to do when the acceptances come in skewed, as they always will, and the people who say yes are systematically unlike the city; whether to pay members, and how the amount changes who accepts; how to replace dropouts mid-cycle without letting my own facilitators quietly engineer the composition; how to handle expert testimony without either drowning the panel or steering it; whether the recommendation should bind, advise, or merely trigger a referendum; and the meta-questions I cannot dodge, of who chose the question and who gets to choose the rules. For each step, say what counts as a sufficient answer and what I should do when I can't get one, mark clearly where the procedure stops with a no, and mark where it has to hand the decision to a human because the question is one of values rather than design. Be honest about the places where the procedure will misfire or merely dress up a judgment call as a rule.

  Then run the procedure on three cases: one where I would expect the panel to be the wrong instrument altogether; one where the sample frame forces a choice between drawing from the whole city and drawing from the neighbourhood that will live with the outcome, a choice that will look to half of council like fairness and to the other half like rigging; and one where the honest response to attrition is to accept a body that no longer mirrors the city and to defend it on deliberative rather than descriptive grounds — a conclusion I suspect is right and dislike, so I want the procedure to reach it rather than me to feed it in. Assume I have six weeks to set this up, that everything touching eligibility has to be signed off by council's counsel, and that whatever I adopt I will have to explain to a hostile committee in plain language. Don't bother with citations or a reading list; refer to positions and arguments as you need them and I will fill in the sources myself.
reasoning: |-
  We are designing a decision procedure for a Citizens' Panel pilot. The procedure must be actionable, transparent, and defensible. We focus on recurring operational choices, with clear steps, exit conditions, and handoffs for value judgments.

  The procedure will cover:
  1. Sample frame and stratification
  2. Handling skewed acceptances
  3. Payment for members
  4. Replacement of dropouts
  5. Handling expert testimony
  6. The binding nature of the recommendation
  7. Meta-questions (who chooses the question and the rules)

  For each step, we define:
  - What counts as a sufficient answer
  - What to do when we can't get one
  - Where the procedure stops (with a "no")
  - Where it hands off to a human (value judgment)

  We then run the procedure on three test cases.

  ---

  **Decision Procedure for Citizens' Panel**

  **Step 1: Define the Sample Frame and Stratification**

  *Objective*: Determine from whom we draw the lottery.

  *Procedure*:
  1. **Identify the Affected Population**: 
     - If the housing question has a clear geographic boundary (e.g., a neighborhood re-zoning), then the sample frame is the residents of that area. 
     - If citywide (e.g., a general housing policy), then the entire city.
     - *Sufficient answer*: A written legal or technical analysis of the scope of the question, provided by the council's counsel or a relevant city department. If unavailable, default to the entire city.
     - *Handoff for values*: If the question's scope is ambiguous, the council must decide (via majority vote) whether it is citywide or local. The procedure stops if council does not resolve this within 2 weeks.

  2. **Determine Stratification**:
     - Stratify to ensure representation on key demographics. Use city census data to identify variables where underrepresentation could lead to unfairness (e.g., race, age, income, homeownership status, or geography within the city).
     - *Sufficient answer*: A list of stratification variables that council approves (by simple majority) after reviewing a report from your team on available data and potential gaps. The report must show which variables are feasible to stratify on (given data availability) and which are critical for legitimacy.
     - *Trade-off for deliberation quality*: Limit stratification to 3-4 variables to avoid over-fragmentation. If stratification would result in any cell having fewer than 2 expected participants, drop the least critical variable (as per council's priority list). Council must approve the final stratification plan.
     - *Handoff for values*: Council must decide which variables are "critical" for representation (e.g., race vs. income) if there is disagreement. Without council approval, do not stratify.

  3. **Finalize Sample Frame**:
     - Use the most recent and complete voter roll (if available and legal) supplemented by other databases (e.g., utility bills, driver's licenses) to cover non-voters. 
     - *Sufficient answer*: Council's counsel certifies the legality and completeness of the sample frame. If counsel objects, revise until approved. If no frame is legally available, the procedure stops (pilot cannot proceed).

  *Exit Condition*: If the sample frame is not approved by counsel or council fails to decide on stratification, the panel cannot be formed. Report to council: "Insufficient data or legal basis for a fair sample."

  **Step 2: Handle Skewed Acceptances**

  *Objective*: When invitees respond, adjust for systematic non-response to avoid a biased panel.

  *Procedure*:
  1. **Set Recruitment Targets**:
     - Based on the stratified sample, set targets for each group (e.g., 40% renters, 30% homeowners, etc.). Over-sample by a factor of 3-5 to account for expected refusal rates (use historical data if available, else assume 70-80% refusal).

  2. **Monitor Responses**:
     - Track acceptances by stratification variables. After 50% of responses are in, check for skew (any group >10% below target).
     - *Sufficient answer*: A statistical report showing the gap between acceptances and targets.

  3. **Mitigate Skew**:
     - If skew is found, conduct a second round of targeted recruitment (from the same sample frame) for underrepresented groups. 
     - If still skewed, consider:
       - Increasing incentives (see Step 3) for underrepresented groups.
       - Allowing remote participation (if logistically feasible) to reduce barriers.
     - *Handoff for values*: If skew persists after two rounds, the team leader (you) must decide whether to proceed with an unrepresentative panel or cancel. The decision must be based on:
       - The magnitude of skew (e.g., missing entire income brackets).
       - The importance of the missing group to the question (e.g., renters in a housing panel).
       - *Sufficient answer*: A written justification to council, including risks to legitimacy and alternatives considered. Council may override by majority vote within 1 week.

  *Exit Condition*: If after two rounds of recruitment, critical groups (as defined by council in Step 1) are missing and council does not vote to proceed, the panel is canceled.

  **Step 3: Payment for Members**

  *Objective*: Set compensation to maximize participation without biasing the panel toward those motivated by money.

  *Procedure*:
  1. **Base Rate**:
     - Pay at least the city's minimum wage for all hours of participation (including preparation). Calculate: (4 weekends × 2 days × 8 hours) × min wage. 
     - *Sufficient answer*: Council must approve the base rate. Use existing city policies for jury duty or public service as precedent.

  2. **Adjust for Equity**:
     - Add a flat participation bonus (e.g., $100) to offset hidden costs (e.g., childcare, transportation). 
     - *Sufficient answer*: A memo from the finance department confirming affordability and legality. If unaffordable, reduce bonus (but not below base rate) and report trade-off to council.

  3. **Test Sensitivity**:
     - Pilot a small survey (n=100) with varying compensation levels to see if higher pay increases uptake in underrepresented groups. If time (<6 weeks) or resources don't allow, skip.
     - *Handoff for values*: Council must decide whether to increase pay beyond base+bonus if survey shows it would improve representation. Without council approval, use base+bonus.

  *Exit Condition*: None. The panel proceeds with council-approved payment. If council rejects any payment, proceed without it but document the risk of skewed participation.

  **Step 4: Replace Dropouts Mid-Cycle**

  *Objective*: Maintain panel integrity without manipulation.

  *Procedure*:
  1. **Pre-Panel Attrition**:
     - Recruit 10-20% alternates (from the same sample, using the same stratification) at the start. Alternates attend all sessions but don't participate unless replacing a dropout.

  2. **In-Panel Attrition**:
     - Replace dropouts only from the alternates list, in the order drawn. If no alternates left, continue without replacement.
     - *Sufficient answer*: A public log of dropouts and replacements, showing the original stratification category of each.

  3. **Avoid Engineering**:
     - Facilitators must not influence replacements. The alternates list is fixed and randomized at the start. 
     - *Handoff for values*: If attrition exceeds 20% of the panel, the team leader must decide whether to cancel the panel or continue with a smaller group. Base the decision on:
       - Whether critical groups are still represented.
       - The panel's own assessment of its legitimacy (ask them).
       - *Sufficient answer*: A report to council justifying the decision.

  *Exit Condition*: If attrition exceeds 30%, cancel the panel regardless (per common deliberative democracy standards).

  **Step 5: Handle Expert Testimony**

  *Objective*: Inform the panel without steering.

  *Procedure*:
  1. **Select Experts**:
     - Panel members first define their information needs. Then, your team compiles a list of experts covering all requested topics, ensuring balance (e.g., pro/development, pro/conservation). 
     - *Sufficient answer*: A publicly posted list of experts, with affiliations and topics, approved by a 3-person independent review board (e.g., academics or retired judges).

  2. **Present Testimony**:
     - Experts present in pairs (opposing views) on the same topic. Each gets equal time, followed by panel Q&A.
     - Provide written summaries of all testimony, vetted for accuracy by the review board.

  3. **Limit Quantity**:
     - No more than 25% of panel time on expert input. The rest is deliberation.
     - *Handoff for values*: If the panel requests an expert not on the list, the review board decides. If the board rejects, the panel must accept the decision.

  *Exit Condition*: None. The panel proceeds even if experts are imperfect.

  **Step 6: Binding Nature of the Recommendation**

  *Objective*: Define the panel's authority.

  *Procedure*:
  1. **Refer to Mandate**:
     - The council's public promise is that a 2/3 recommendation triggers a referendum. The panel's role is to recommend, not to bind.
     - *Sufficient answer*: The council's resolution authorizing the pilot.

  2. **Clarify Status**:
     - The recommendation is advisory unless ratified by referendum. The council must still vote to put it on the ballot.
     - *Handoff for values*: If the council wants to change the mandate (e.g., make it binding), it must amend the resolution.

  *Exit Condition*: None. The mandate is fixed by the council.

  **Step 7: Meta-Questions (Who Chooses the Question and Rules)**

  *Objective*: Ensure legitimacy of the process.

  *Procedure*:
  1. **Choosing the Question**:
     - For the pilot, the council chose the question. For future cycles, the council must approve the question by a 2/3 supermajority to avoid partisan capture.
     - *Sufficient answer*: A council vote recorded in the minutes.

  2. **Choosing the Rules**:
     - After the pilot, convene a one-time rules committee of 20 randomly selected residents (using the same sample frame) to recommend changes to the panel's design. The council must approve the rules by a simple majority.
     - *Sufficient answer*: The rules committee's report and council vote.

  *Exit Condition*: If the council does not approve a question for a future cycle, the panel does not convene that year.

  ---

  **Running the Procedure on Three Cases**

  **Case 1: Wrong Instrument**

  *Scenario*: A highly technical question on wastewater treatment standards, requiring engineering expertise.

  *Procedure Run*:
  - Step 1: The affected population is the entire city (citywide standards). Stratification is feasible but irrelevant because the issue requires expertise, not lay deliberation.
  - Step 5: Expert testimony would dominate, violating the 25% rule. Panelists cannot reasonably deliberate without specialized knowledge.
  - *Conclusion*: The procedure flags Step 5 as infeasible (deliberation quality compromised). The team leader reports to council: "This question is unsuitable for a citizens' panel due to technical complexity. Consider an expert commission instead." The panel is not convened.

  **Case 2: Sample Frame Dilemma (Whole City vs. Neighborhood)**

  *Scenario*: A new homeless shelter in a specific neighborhood. Council split on whether the panel should be citywide (fairness) or neighborhood-only (impact).

  *Procedure Run*:
  - Step 1: 
    - Identify affected population: Counsel provides analysis that the shelter affects the neighborhood directly (noise, traffic) but citywide (funding, policy). Ambiguous → Handoff to council.
    - Council votes: 5-5 tie. No majority → Procedure stops. Report: "Council must resolve the sample frame question with a majority vote." 
    - If council then votes 6-4 for neighborhood frame: Proceed with neighborhood-only sample. Stratify by tenure (renter/homeowner) and race (if feasible). If counsel approves frame, continue.

  **Case 3: Attrition and Non-Mirroring**

  *Scenario*: After recruitment, the panel has few young renters due to low acceptance. Mid-cycle, 8 of 60 drop out (13%). Alternates are exhausted. The remaining panel is older and wealthier than the city.

  *Procedure Run*:
  - Step 4: 
    - Attrition is 13% (<20%), so no immediate exit. Replace dropouts from alternates until none left. After replacements, attrition is 13% but with skew.
    - Since critical groups (renters) are underrepresented (per council's Step 1), the team leader must decide: Continue or cancel?
    - *Decision*: The leader consults the panel on legitimacy. They feel capable. The leader reports to council: "Proceeding with attrition at 13%. Critical underrepresentation of renters due to recruitment challenges. Mitigation: Added extra session for renters' perspectives. Risks noted." Council does not override.
    - *Conclusion*: The procedure reaches the disliked outcome (non-mirroring panel) but forces transparency and council oversight.

  ---

  **Summary**: This procedure makes explicit where operational choices turn on values (handoff to council or leader) and where data or rules force an exit. It trades off mirroring for deliberation when attrition strikes, but only with accountability. It misfires when council deadlocks or when data is lacking, but that is by design: better to stop than to run a flawed panel.
answer: |-
  Below is a **decision procedure** for your citizens' panel pilot, designed as a step-by-step checklist. It addresses recurring operational choices, forces tradeoffs into the open, and minimizes hidden value judgments. The procedure is executable by a small team, compliant with legal review, and defensible to hostile stakeholders. It assumes a 6-week setup timeline.  

  Key features:  
  - **Sufficient answer**: What evidence or sign-off closes the step.  
  - **When stuck**: Actions if no answer is reachable.  
  - **Hard stops (🚫)**: Steps that terminate the pilot if criteria fail.  
  - **Human handoff (⚖️)**: Points where council/facilitators must decide values-based questions.  
  - **Misfires**: Where the rule is arbitrary or masks judgment.  

  ---

  ### **Decision Procedure**  
  *Run in sequence each cycle.*  

  #### **1. Sample Frame: Who is eligible?**  
     - **Step 1.1: Define the "affected public"**  
       - *Sufficient answer*: Legal counsel certifies that the question impacts:  
         - (a) Only a specific neighborhood/group → Sample frame = that group.  
         - (b) The whole city → Sample frame = all residents.  
       - *When stuck*: Default to whole city if counsel is ambiguous.  
       - **🚫 Hard stop** if counsel vetoes the frame (e.g., data privacy violations).  
       - **Misfire**: "Affected public" is often political. Counsel’s ruling may feel rigged to stakeholders.  

     - **Step 1.2: Stratify or not?**  
       - *Sufficient answer*: Census data showing ≥20% divergence from city demographics on:  
         - Income (3 tiers), race/ethnicity, age, housing tenure (renter/owner).  
       - Stratify if divergence in ≥2 categories AND cell sizes allow ≥2 people per stratum.  
       - *When stuck*: Stratify only on housing tenure (clearest ties to housing outcomes).  
       - **⚖️ Human handoff**: Council must approve stratification variables if >3 are proposed (avoids over-engineering).  
       - **Misfire**: Arbitrary 20% threshold. Prioritizes measurable demographics over lived experience (e.g., disability).  

  #### **2. Recruitment & Skewed Acceptances**  
     - **Step 2.1: Set participation payment**  
       - *Sufficient answer*:  
         - Base rate = city minimum wage × 32 hours (4 weekends).  
         - Add 50% base rate for childcare/transport stipend.  
       - *When stuck*: Use base rate only if budget vetoes stipend.  
       - **⚖️ Human handoff**: If >40% of target group earns below poverty line, council must approve higher stipends (equity vs. cost).  
       - **Misfire**: Payment may still exclude informal workers or those distrusting institutions.  

     - **Step 2.2: Correct for acceptance skew**  
       - *Sufficient answer*: After 1st recruitment wave, compare acceptances to city demographics on stratified variables.  
         - If ≥1 group is underrepresented by >15%:  
           - Open 2nd wave targeting under-represented groups (oversample contacts ×3).  
           - Allow virtual participation.  
         - If still skewed, proceed without full mirroring.  
       - *When stuck*: Proceed if total acceptances ≥45 (75% target).  
       - **⚖️ Human handoff**: If skew persists, facilitators publicly document why mirroring failed and emphasize deliberation quality.  
       - **Misfire**: 15% is arbitrary. Virtual participation may alter deliberation dynamics.  

  #### **3. Mid-Cycle Dropout Replacement**  
     - **Step 3.1: Replace dropouts**  
       - *Sufficient answer*:  
         - Recruit 10 alternates at start (same stratification).  
         - Replace dropouts in order of alternates list (no reselection).  
         - If no alternates left, continue with current group.  
       - **🚫 Hard stop** if attrition >30% (loss of critical mass).  
       - *When stuck*: Pause panel for 48 hours to recruit alternates from original sample.  
       - **Misfire**: Alternates may differ from initial recruits. Facilitators control the alternates list.  

  #### **4. Expert Testimony & Information Flow**  
     - **Step 4.1: Select and present experts**  
       - *Sufficient answer*:  
         - Panelists submit anonymous questions → Team curates 3–5 experts covering:  
           - Pro-policy, anti-policy, neutral (e.g., academic).  
         - Experts present jointly in balanced panels (no solo testimony).  
         - Total testimony ≤25% of panel time.  
       - *When stuck*: Use city staff as neutral fact-providers if experts polarize.  
       - **⚖️ Human handoff**: Facilitators must justify exclusions if panelists challenge.  
       - **Misfire**: "Balanced" panels may false-equivalence fringe views.  

  #### **5. Recommendation Authority**  
     - **Step 5.1: Define the recommendation’s status**  
       - *Sufficient answer*:  
         - If ≥66% consensus → Binding referendum.  
         - If 50–65% consensus → Advisory report to council.  
         - <50% consensus → No recommendation.  
       - *When stuck*: Default to referendum-only trigger (per public promise).  
       - **Misfire**: Supermajority thresholds may incentivize strategic voting.  

  #### **6. Meta-Questions (Who Sets Up the System?)**  
     - **Step 6.1: Who chooses the question?**  
       - *Sufficient answer*: Council approves question by ⅔ vote.  
       - **🚫 Hard stop** if question is:  
         - Ultra vires (counsel opinion).  
         - Requires technical expertise beyond lay deliberation (e.g., engineering specs).  
       - *When stuck*: Use a neutral third party (e.g., city auditor) to shortlist options.  

     - **Step 6.2: Who chooses the rules?**  
       - *Sufficient answer*:  
         - Pilot rules: Your team drafts, counsel approves, council ratifies.  
         - Post-pilot: Standing panel reviews rules using modified Roberts Rules.  
       - *When stuck*: Defer to council if rule-change deadlocks.  
       - **⚖️ Human handoff**: Council must justify deviations from this procedure.  

  ---

  ### **Running the Procedure on Three Cases**  
  *Timeline: Each case resolved in ≤3 days.*  

  #### **Case 1: Wrong Instrument**  
  **Scenario**: A technical land-use question requiring soil engineers and zoning lawyers.  
  - **Step 1.1**: Counsel rules the question impacts the whole city → Proceed.  
  - **🚫 Step 6.1**: Counsel flags "technical expertise beyond lay deliberation" → Hard stop.  
  - **Outcome**: Panel canceled. Report to council: "Lottocracy unsuitable for highly technical issues. Recommend expert commission."  
  - **Why it works**: Procedure forces objectivity via counsel. Avoids forcing a lay panel into a role it can’t fulfill.  

  #### **Case 2: Sample Frame Dilemma (Whole City vs. Neighborhood)**  
  **Scenario**: Building a homeless shelter in a low-income neighborhood. Council split 50/50 on fairness (citywide frame) vs. impact (neighborhood frame).  
  - **Step 1.1**: Counsel certifies shelter impacts both neighborhood (livability) and city (budget) → Ambiguous.  
  - *When stuck* → Default to whole city.  
  - **Step 1.2**: Census shows neighborhood has 40% poverty rate vs. city’s 12% → Stratify by income.  
  - **Outcome**: Whole city sample frame, stratified by income.  
  - **Defense to hostile committee**: "Citywide frame avoids isolation of burdens. Stratification ensures low-income voices are heard."  
  - **Misfire**: Neighborhood residents may feel disempowered. Procedure "solves" politics via legal default.  

  #### **Case 3: Attrition and Non-Mirroring Defense**  
  **Scenario**: After acceptances, the panel has too few renters (30% vs. city’s 50%). Mid-cycle, 10 dropouts worsen skew.  
  - **Step 2.2**: Post-recruitment, renters underrepresented by 20% → Open 2nd wave targeting renters.  
  - Still skewed → Proceed without mirroring. Document: "Renters underrepresented due to work conflicts; virtual option added."  
  - **Step 3.1**: 10 dropouts → Replace with 10 alternates. Attrition now 16% (<30%) → Continue.  
  - **Step 2.2 (handoff)**: Facilitators justify: "Panel prioritized deliberation cohesion over mirroring. Renters still present at 25%."  
  - **Outcome**: Panel continues. Final report emphasizes process integrity over composition.  
  - **Why it works**: Procedure forces transparency about tradeoffs. Deliberation quality becomes the fallback defense.  

  ---

  ### **Final Checks**  
  - **Legal scrub**: All eligibility steps (1.1, 1.2, 6.1) to counsel by Week 3.  
  - **Hostile committee script**: "We followed a published procedure. Tradeoffs are documented. Council approved all handoff decisions."  
  - **Your role**: Enforce the sequence. Where humans decide (⚖️), you document the *why*.  

  This procedure won’t eliminate politics, but it will make your choices auditable. The pilot’s survival hinges on showing that even imperfect rules were applied consistently.
