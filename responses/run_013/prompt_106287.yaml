prompt: |-
  You are a philosopher of decision theory with a strong background in probability, expected utility, and the long-running dispute between expected-value maximization and long-run growth as rival accounts of practical rationality. Before you answer, please think carefully and at length, and begin with a short brainstorming section in which you set out the candidate readings of the practice below before you commit to one; then give your settled verdicts.

  I am an undergraduate in a decision-theory course, and we have been reading about the Kelly criterion and what is sometimes called the geometric view of rationality. What I keep meeting outside the seminar is a cluster of practices among people who bet or invest for a living, and I would like to know what those practices presuppose philosophically. Here is the cluster, as concretely as I can state it.

  (a) Bankroll management. Almost everyone who bets seriously for a living refuses to stake a large fraction of their capital on a single favorable bet, even when the edge is very large. A bet paying even money on a 60/40 proposition is, by expected value, one they should want to take as often and as large as possible; the practice instead is to stake a fixed small fraction of capital.

  (b) Fractional Kelly. The standard sizing rule in the professional literature is not full Kelly but a fraction of it, commonly half and sometimes less, and practitioners describe the reduction as prudence rather than as a correction for any specific error.

  (c) Screening by expected value, sizing by growth. The same people decide whether a bet is worth taking by asking whether it has positive expected value, and then decide how much to stake by a rule that is not expected value at all. Nobody seems troubled by the combination.

  (d) Ruin treated as special. They treat the loss of the entire bankroll as categorically worse than any sequence of losses summing to the same amount. They will give up expected profit to make ruin impossible, and they speak of ruin not as a bad outcome among others but as the end of the game.

  I want three things.

  First, reconstruct the implicit theory. What conception of practical rationality and of value do these practices only make sense under? Specifically: do they presuppose that the rational objective is the growth rate of capital rather than expected value, and if so, is that a claim about what is valuable, namely that wealth has logarithmic utility, or a claim about what is rational over repeated multiplicative bets, namely that the growth rate dominates in the long run? Are those two claims distinct, and does the practice have to choose between them, or can it run on either?

  Second, the tension. Is the combination in (c) coherent, or does it show that the practitioners are really expected-utility maximizers with a concave utility function, in which case the geometric apparatus is doing no independent work and could be dropped? And how should we read (b)? Is half-Kelly a concession to risk aversion, which would contradict the growth-optimal story, or a rational response to the fact that the edge is estimated rather than known, which would keep it inside the geometric framework? Tell me which reading the practice strictly presupposes and which it merely fits well with, and say plainly if the practice is underdetermined between them.

  Third, the case I cannot place. A one-shot bet, never to be repeated, offering a 51 percent chance to double the bankroll and a 49 percent chance to lose it: the practitioners in (a) through (d) refuse it, but the geometric story seems to license the refusal only by smuggling in repetition. Does the practice presuppose that all real betting is a repeated game, or does it need an independent, non-instrumental constraint against ruin, a lexicographic priority of survival over growth? If the latter, what is that constraint a commitment to, and is it a commitment about value or about rationality?

  Finally, tell me what would have to change in the practice if the presupposed view were replaced by straightforward expected-value maximization, and where the practice would look different if we adopted instead a fully subjectivist expected-utility view with an ordinary risk-averse utility function. State your verdicts plainly, flag every point at which the practice turns out to be philosophically underdetermined, and do not give me citations or a reading list: I want the reconstruction and the argument, not references.
reasoning: |-
  Okay, the user is an undergraduate in a decision theory course, wrestling with how professional bettors' practices align with philosophical foundations. They've outlined four concrete observations: bankroll management (a), fractional Kelly (b), screening by EV but sizing by growth (c), and treating ruin as special (d). Their questions probe the implicit theory behind these, potential tensions, and how to interpret refusal of a one-shot bet.

  First, I need to reconstruct the implicit theory. The practices clearly prioritize long-term capital growth over single-bet expected value maximization. This suggests adherence to the geometric mean maximization framework, where repeated multiplicative growth makes logarithmic utility central. But is this a claim about utility being inherently logarithmic (axiological) or about instrumental rationality in repeated bets? The practices likely don't distinguish - they operationalize both through growth optimization. 

  When examining the tension in (c), screening by EV but sizing by growth seems contradictory at first glance. However, under logarithmic utility, positive EV is necessary but insufficient; the Kelly criterion provides the sufficient condition for optimal sizing. Fractional Kelly (b) is trickier - practitioners cite "prudence," which could mean either risk aversion (implying concave utility beyond log) or uncertainty about edge estimates (staying within geometric framework). Their language suggests the latter, but the practice is philosophically underdetermined here.

  The one-shot bet case is revealing. Refusing a 51% chance to double while risking ruin violates expected value maximization but aligns with geometric rationality only through an implied repetition premise. Yet practitioners treat ruin as categorically bad even in isolation. This points to either: (1) an unstated assumption that all real bets are part of an indefinite series, or (2) a lexicographic preference where survival dominates growth. Their language ("end of the game") suggests the latter - implying a non-instrumental value placed on continuity of play.

  Comparing frameworks: If these betters were pure EV maximizers, they'd take enormous stakes on positive EV bets and accept ruin risks. With standard EUT, they'd use concave utility throughout (making screening and sizing coherent) but lose the distinctive growth-optimal properties. The practice's hybrid approach maintains growth focus while pragmatically adapting to uncertainty (fractional Kelly) and elevating survival (ruin aversion).

  Notably, three points show underdetermination: fractional Kelly's motivation, whether log utility is intrinsic or instrumental, and whether ruin aversion implies lexicographic ordering. The practice works precisely because it doesn't resolve these - it's a coherent behavioral package reconciling multiple philosophical pressures.
answer: |-
  Here is my systematic reconstruction and analysis of the philosophical presuppositions behind the betting practices you describe. I proceed through brainstorming, then settled verdicts, addressing each of your three requests.

  ---

  **Brainstorming: Candidate Readings**

  1.  **Implicit Theory:**
      *   **Reading 1 (Instrumental Growth):** Rationality aims for long-run capital growth. Value is linear in money, but repeated *multiplicative* dynamics make maximizing the geometric mean growth rate (via Kelly) instrumentally rational for terminal wealth maximization over many bets. Logarithm is a tool, not a utility function.
      *   **Reading 2 (Axiological Growth):** Rationality *is* growth rate maximization. Value is inherently logarithmic; each proportional gain/loss has linear utility impact. Terminal wealth utility = log(wealth). Growth maximization *is* expected utility maximization (EUM) under this specific utility.
      *   **Reading 3 (Hybrid Survival):** Rationality requires indefinite survival to pursue growth. Ruin avoidance is lexicographically prior to growth maximization. Growth optimization applies *only* conditional on survival.

  2.  **Tension in (c) & (b):**
      *   **Reading A (Pure Geometric):** (c) is coherent: Positive EV ensures long-run growth is possible; Kelly sizing optimizes the *rate* of that growth. (b) "Prudence" reflects parameter uncertainty (true edge < estimated edge) or aversion to higher volatility of fractional wealth, staying within geometric framework.
      *   **Reading B (Implicit EUM):** (c) is incoherent under pure geometric rationality but reveals practitioners are *really* EUMers with a concave utility function (e.g., log or similar). (b) "Prudence" is simply risk aversion, requiring concave utility beyond log (e.g., sqrt(wealth)).
      *   **Reading C (Pragmatic Compromise):** (c) uses EV screening as a computationally simple necessary condition for growth-positive bets; Kelly sizing is the primary tool. (b) "Prudence" mixes uncertainty and mild risk aversion.

  3.  **One-Shot Bet & Ruin:**
      *   **Reading X (Implied Repetition):** All real betting is treated *as if* it's part of a long series. The one-shot refusal presupposes this framing. Ruin is bad because it ends the *series*.
      *   **Reading Y (Lexicographic Survival):** Survival has absolute, non-instrumental priority over any finite gain. Ruin isn't just bad; it's infinitely worse, terminating agency. This requires a constraint *beyond* growth maximization or standard EUM.
      *   **Reading Z (Extreme Concavity):** Utility functions like log(wealth) make ruin (-∞ utility) infinitely bad *axiologically*. Refusal is consistent with EUM under log utility, even for one-shot.

  ---

  **Settled Verdicts**

  **I. Implicit Theory of Rationality and Value**
  The practices **presuppose that the rational objective is the long-run growth rate of capital.** This is fundamentally a claim about **instrumental rationality in the context of repeated multiplicative bets**: maximizing growth rate dominates expected value maximization for terminal wealth over sufficiently long indefinite sequences. While the mathematics align with maximizing expected *log*(wealth), the core philosophical commitment of the practice is to the *growth rate* as the instrumental goal for long-run success in multiplicative environments.

  *   **Value vs. Rationality:** The practice runs primarily on the **instrumental rationality claim**. Practitioners need not believe wealth *intrinsically* has logarithmic utility. The log function emerges as the *tool* to achieve the goal of maximal long-run growth. However, the practice is **underdetermined** between the instrumental view and the axiological view (log utility). The behavioral implications are identical, allowing practitioners to adopt either justification. The core commitment is to *growth-rate optimization* as the rational strategy for repeated betting.

  **II. Coherence of (c) and Interpretation of (b)**
  *   **(c) Screening by EV, Sizing by Growth:** This combination **is coherent** under the geometric growth perspective. Positive expected value (in linear money terms) is a *necessary condition* for a bet to offer positive expected growth (in log terms). However, it is *not sufficient* for determining the optimal stake size. The Kelly criterion (or fractional variant) calculates the stake that *maximizes the expected growth rate*, which depends on both the edge and the odds. Screening by EV efficiently filters out bets harmful to long-run growth; sizing by Kelly optimizes the rate. The geometric apparatus is doing essential, independent work that simple EV maximization cannot.
  *   **(b) Fractional Kelly ("Prudence"):** This practice **fits well with** being a rational response to parameter uncertainty (the estimated edge being unreliable). Reducing stake size below full Kelly hedges against overestimation of the edge, protecting the bankroll from excessive risk due to estimation error. This keeps it **within the geometric framework**. However, the language of "prudence" and the lack of specific error-correction **also fits well with** an element of risk aversion beyond pure growth maximization (i.e., a concave utility function flatter than log). The practice is **philosophically underdetermined** between these two readings. It strictly presupposes only that *full Kelly is perceived as too risky*; the *reason* for this perception (uncertainty or intrinsic aversion to volatility) is not uniquely determined by the practice alone.

  **III. The One-Shot Bet and the Nature of Ruin Aversion**
  The refusal of the 51% double-or-nothing bet **requires more than just the instrumental long-run growth rationale.** A pure instrumental growth maximizer *facing a truly one-shot bet* would take it, as it offers positive expected growth (0.51 * ln(2) + 0.49 * ln(0) is undefined/negative infinity, but any non-ruin stake offers positive EV and thus positive growth for that single bet). The refusal demonstrates that practitioners treat ruin as **categorically worse**, possessing a special status.

  *   **Presupposition:** The practice **needs an independent, non-instrumental (or lexicographic) constraint against ruin.** Ruin is treated as the "end of the game," terminating future agency and opportunity. This is a commitment about **value** and **rational priorities**: survival (continuation of the betting "game" or capital base) is lexicographically prior to growth maximization. Losing *everything* is infinitely worse than losing any sub-total amount, regardless of the expected profit sacrificed to avoid it. This constraint is **non-instrumental**; avoiding ruin is valued *for itself* or for the continuity it enables, not solely as a means to future growth (though that is also true). It's a commitment that survival dominates growth.

  **IV. Impact of Alternative Presuppositions**
  *   **Straightforward Expected-Value Maximization:**
      *   **(a)** Would stake the *entire* bankroll (or maximum allowed) on any bet with positive EV and favorable odds, seeing no reason to limit stakes on "good bets." Fractional staking would seem irrational, leaving expected profit "on the table."
      *   **(b)** Fractional Kelly would be nonsensical; "prudence" would be pure irrational risk aversion.
      *   **(c)** Screening *and* sizing would be based purely on maximizing expected value per bet. The separation would vanish.
      *   **(d)** Ruin would be just one possible negative outcome, its badness proportional to the monetary loss. Sacrificing significant EV to make ruin *impossible* would be irrational unless the utility loss from ruin was infinite (which standard EV max doesn't assume).
      *   **One-Shot Bet:** Would be taken enthusiastically (51% chance to double!).
  *   **Subjective Expected Utility (Concave Utility, e.g., log, sqrt):**
      *   **(a)** Bankroll management emerges naturally from concave utility. Optimal stake is finite.
      *   **(b)** "Fractional Kelly" could be interpreted as the result of a more risk-averse utility function than log (e.g., sqrt(wealth)).
      *   **(c)** Screening by EV (linear) and sizing by utility maximization (non-linear) is the *definition* of coherent EUM. The combination is perfectly natural. Kelly sizing appears only if utility is *exactly* log(wealth).
      *   **(d)** Ruin is very bad due to extreme concavity (utility → -∞ as wealth → 0+). However, it remains a *finite* loss if some minimal positive wealth is maintained. Sacrificing *all* expected profit to make ruin *impossible* (if possible) might still seem excessive unless utility truly goes to -∞ at 0. Lexicographic priority isn't inherent to standard EUM.
      *   **One-Shot Bet:** Would be refused under log utility (expected utility = -∞) or other sufficiently concave utilities. Refusal is consistent, driven solely by the axiological badness of ruin encoded in the utility function.
      *   **Key Difference:** The *distinctive emphasis* on *growth rate* as the objective, and the specific Kelly *calculation* as the sizing tool, would disappear. Sizing would be dictated by the general shape of the utility function and the specific bet parameters, not by a growth-optimization rule. The "long-run dominance" argument is replaced by axiomatic utility maximization per bet. Fractional Kelly "prudence" becomes standard risk aversion.

  **Summary Verdicts:**

  1.  **Core Presupposition:** The practices are fundamentally grounded in the conception of rationality as **maximizing long-run capital growth rate** under repeated multiplicative dynamics. This is primarily an **instrumental** claim about optimal strategy.
  2.  **Value:** While compatible with log utility, the practice is **underdetermined** between instrumental growth maximization (linear money value) and axiological log utility. The commitment is to the *growth rate objective*.
  3.  **(c) Coherence:** Screening by EV and sizing by growth is **coherent and necessary** under the geometric view. EV screening is a filter; Kelly sizing optimizes the rate.
  4.  **(b) Fractional Kelly:** Interpretation is **underdetermined** between a rational response to parameter uncertainty (staying geometric) and a concession to risk aversion beyond growth maximization (implying concave utility).
  5.  **Ruin Aversion:** Practices **(a), (d), and the one-shot refusal** demonstrate a **lexicographic priority of survival over growth**. Ruin avoidance is a non-instrumental constraint or infinitely valued, distinct from merely being a very bad outcome within a utility function. This goes beyond pure growth maximization.
  6.  **One-Shot Bet:** Refusal **presupposes the lexicographic priority of survival**. It cannot be justified by instrumental long-run growth arguments alone without smuggling in repetition. Log utility *would* justify refusal, but practitioners' language ("end of the game") suggests the stronger, lexicographic commitment.
  7.  **Alternative Views:** Adopting pure EV max would obliterate all described practices. Adopting standard EUM with concave utility would fulfill (a), likely fulfill (d) depending on concavity, make (c) coherent but mundane, reinterpret (b) as risk aversion, and justify the one-shot refusal, but it would *replace* the distinctive *growth-rate focus* and *Kelly calculation* with general utility maximization per bet. The geometric apparatus becomes redundant.
