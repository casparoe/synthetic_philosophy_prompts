prompt: |-
  I'm putting together a small philosophy podcast (like 200 listeners, mostly friends and a few grad students), and next week's guest is someone who's spent years defending a version of the situationist critique of virtue ethics — the line that the social-psych experiments on helping, obedience and honesty show that global character traits like courage or honesty barely predict behavior across situations, so we should replace them with fine-grained, situation-indexed dispositions (local traits). I want the interview to actually get somewhere instead of the usual "well, it depends what you mean by a trait" back and forth. Can you draft eight to ten questions, each with a follow-up attached that's keyed to the answer he's most likely to give?

  Stuff I want covered, roughly one question apiece: what the experiments really show — the gap between "situations matter a lot" and "there are no cross-situational dispositions at all" — and whether the guest is actually making the strong claim or quietly retreating to the weak one; the old person-situation debate in personality psychology and whether the density-distribution findings (people have stable averages even if any single situation predicts little) are a problem for him; wether "local traits" is a real theory or just a redescription of whatever each situation does to you, i.e. how anyone would ever falsify it; the hurried-seminarians study specifically — whether being in a rush is a confound rather than a clean situational manipulation, and whether the result even bears on compassion; the practical-wisdom reply (that Aristotelian virtue isn't blind habit, so the studies miss their target) and whether that's ad hoc or a genuine reading of the tradition; whether virtue ethics is even committed to empirical claims about character, or whether it's about ideals and eudaimonia and so can shrug all this off; the replication and WEIRD-sample problems hanging over the whole empirical base; and what any of it means for how we should actually raise kids or run a school's character-education program, since that's the part my listeners will care about most.

  Press where the actual literature presses. For each question, anticipate the standard reply and make the follow-up land on it — no softballs, and nothing that lets him just restate his position. And please be committed: tell me which two or three of these are the real cruxes, and take a definite line on which question he's actually going to have trouble with, rather than handing me both sides of everything. No "what drew you to philosophy" filler.
