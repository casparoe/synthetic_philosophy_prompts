  So I've somehow been put in charge of the entertainment at our department's end-of-term thing, and the theme is decision theory, which is definately a mistake. You're the decision-theory person in the room, so I need you to write me exactly one joke about superrationality — Hofstadter's idea that two identical reasoners facing a symmetric one-shot Prisoner's Dilemma should both cooperate, since whatever one of them does, the other does too. The catch is that it has to be funny to people who actually know the theory: the punchline should turn on the real content of the idea, not on some generic "philosophers are weird" gag. So no "two robots cooperate, the end" — I want the joke to live inside the actual machinery.

  Here's the thing I keep getting stuck on, and I want you to build the joke around one of these, whichever you can make land. First: the whole trick needs the two agents to be genuinely identical, so what happens if they're copies made by a process with one bit of noise — each agent is fifty-fifty on whether it's the original or the copy, and the two differ by a single value that neither can see? Does the superrational reasoning survive one bit of doubt about whether the other guy is really you? Second, the case where the pot is divisible and every split is symmetric, so superrationality gives no unique answer at all and two superrational agents just sit there. Mashing the two together is allowed. Before you write, brainstorm three or four angles in a sentence each, pick the strongest, then give me the joke. Keep the setup understandable to someone who knows the Prisoner's Dilemma but has never heard the word superrationality — the joke itself can be as in-the-weeds as you like, but nobody should be lost before the punchline.
