answer: |-
  Here's a breakdown of "If it's conceivable, it's possible," designed as a "menu" for your reading group. This principle (**C→P**) is notoriously ambiguous, and its interpretation is central to the disputes you're having. We'll dissect it along the dimensions you requested.

  **Key Dimensions:**

  1.  **Conceivability (C):**
      *   **Prima Facie (PF-C):** Something *seems* conceivable upon initial reflection. It *appears* consistent or imaginable without obvious contradiction *to us, right now*.
      *   **Idealized/Rational (I-C):** Conceivable after ideal rational reflection (full information, maximal logical competence, no cognitive limitations). There is *no discoverable contradiction* in the scenario.
      *   **Positive (P-C):** We can *form a clear, coherent, and detailed mental conception or image* of the scenario. (Often tied to imaginability).
      *   **Negative (N-C):** We *cannot detect any contradiction* in the scenario. It involves the *absence of known incoherence*, rather than a vivid positive conception. (Often tied to logical consistency).
      *   **Epistemic vs. Psychological:** Is C fundamentally about *logical/metaphysical structure* or about *human cognitive capacities*? The relevant interpretations lean towards the former.

  2.  **Possibility (P):**
      *   **Epistemic (E-P):** Consistent with what is known or knowable a priori. Not ruled out by meaning/conceptual truths. ("For all we know a priori, it might be true").
      *   **Metaphysical (M-P):** How the world could have been. Governed by the essential properties of things and necessary truths. ("There is a possible world where it is true").
      *   **Logical (L-P):** Governed *only* by the laws of logic. True in some logically consistent model/world. (Often considered broader than M-P, though sometimes conflated).

  3.  **Strength of Connection:**
      *   **Entailment (E):** C *logically implies* P. If C is true, P *must* be true.
      *   **Defeasible Evidence (DE):** C provides *good, but not conclusive, reason* to believe P. C is a *reliable guide* to P, but this guide can be overridden by further information or reflection.

  4.  **Relation to 2D Semantics:**
      *   **Framework Internal (FI):** The principle relies on the distinction between primary and secondary intensions. C tracks the primary intension, P is the possibility corresponding to that intension (usually E-P).
      *   **Framework Independent (FnI):** The principle is stated without relying on the 2D apparatus; the framework might be seen as *explaining* or *justifying* it.

  **The Menu of Interpretations:**

  Here are the main contenders for what **C→P** could mean, evaluated for plausibility and relevance to your group's discussion:

  1.  **Prima Facie Negative Conceivability Entails Metaphysical Possibility (PF-N-C → M-P)**
      *   **Interpretation:** If we *don't immediately see a contradiction* in scenario S, then S *is metaphysically possible*.
      *   **Type:** Entailment (E), Framework Independent (FnI)
      *   **Evaluation:** **False.** This is the most naive reading and is easily falsified by the Water case. We didn't immediately see a contradiction in "Water is not H₂O" before discovering chemistry, but it's metaphysically impossible. Your first member's objection directly targets this reading.
      *   **Supports:** Your first member (who thinks the slogan is empty) is correct *against this reading*. Your friend is *wrong* if they mean this.

  2.  **Prima Facie Conceivability as (Weak) Evidence for Metaphysical Possibility (PF-C ⇒ M-P)**
      *   **Interpretation:** If S *seems conceivable* to us now, that gives us *some weak, initial reason* to suspect it *might* be metaphysically possible, but this reason is easily defeated.
      *   **Type:** Defeasible Evidence (DE), Framework Independent (FnI)
      *   **Evaluation:** **Trivially True but Useless.** It's true that if something seems possible, we often (initially) treat it as possible. But it provides no *reliable* guide to metaphysical possibility (as Water shows) and is far too weak to support substantive arguments like the Zombie argument. Your second member's objection ("too weak") applies here.
      *   **Supports:** Your second member (too weak for Zombies). Doesn't support your friend's strong use in defending Zombies.

  3.  **Idealized Negative Conceivability Entails Logical Possibility (I-N-C → L-P)**
      *   **Interpretation:** If, after *ideal rational reflection*, *no contradiction can be discerned* in S, then S is *logically possible* (true in some logically consistent model).
      *   **Type:** Entailment (E), Framework Independent (FnI) or Framework Internal (FI - if L-P is linked to primary intension).
      *   **Evaluation:** **Substantive, Plausible, but Limited.** This is widely accepted. If ideal reason detects no contradiction, the scenario is logically consistent. However, logical possibility is broader than metaphysical possibility (e.g., "Water is not H₂O" *is* logically possible – it's true in worlds with XYZ in the oceans). It doesn't directly get you M-P. The Zombie argument needs M-P.
      *   **Supports:** Your third member (emphasizing meaning of "conceivable"). Doesn't directly support Zombies (needs M-P).

  4.  **Primary Conceivability Entails Primary Possibility (PC → PP) [The Core 2D Link]**
      *   **Interpretation:** If S is *conceivable* (typically *idealized negative conceivable*), then S is *epistemically possible* relative to the actual world (i.e., S's *primary intension* is true in some scenario considered as actual). This *is* the possibility that conceivability directly accesses.
      *   **Type:** Entailment (E) **within the 2D Framework (FI)**. This is the *point* of the primary dimension. PC is *defined* to track PP (E-P).
      *   **Evaluation:** **Trivial within the 2D Framework, but Foundational.** This is the *definitional core* of what the primary dimension *does*. If the 2D framework is accepted, this link is secure by construction. PC → PP *is* the move the framework licenses. **This is what your friend is invoking when talking about the framework "licensing the move."**
      *   **Supports:** Your friend's claim about *what the framework contributes*. It directly supports the move from C (understood as PC) to P (understood as PP/E-P). It *does not* by itself get you to M-P.

  5.  **Primary Conceivability as Evidence for Metaphysical Possibility (PC ⇒ M-P)**
      *   **Interpretation:** If S is *primarily conceivable* (PC), this provides *defeasible evidence* that S is *metaphysically possible* (M-P). The idea is that if S is conceivable, its primary intension is true at some world W considered as actual. If W *is* the actual world, then S is metaphysically possible. Since we don't know if W is actual, it's evidence.
      *   **Type:** Defeasible Evidence (DE), Framework Internal (FI).
      *   **Evaluation:** **Substantive, Contested, Crucial for Zombies.** This is the key *bridge* principle needed to get from the epistemic (PC/PP) to the metaphysical (M-P). Its defensibility hinges on how tightly primary intensions are linked to metaphysical possibilities *across* different worlds considered as actual. The Water case shows it's **defeasible**: PC(Water≠H₂O) is true, but M-P(Water≠H₂O) is false. Defenders argue that in cases like Zombies, where the conceivability seems *stronger* (based on fundamental concepts, not empirical identities), the evidence is stronger/undefeated. Critics argue the defeasibility is fatal for establishing M-P.
      *   **Supports:** This is the **interpretation the Zombie argument actually needs**. Your friend is *relying* on this when deploying C→P *in both directions*. He uses PC → PP (Interpretation 4) to answer "what the framework buys us," and PC ⇒ M-P (this interpretation) when defending the Zombie argument against objections. The Water case **bites precisely here**, as the canonical example *defeating* this evidence.

  **Summary Answers to Your Specific Questions:**

  1.  **What reading does the Zombie argument need?** Interpretation 5: **Primary Conceivability as (Defeasible) Evidence for Metaphysical Possibility (PC ⇒ M-P)**. It needs the link from the epistemic dimension (accessed by conceivability) to the metaphysical dimension.
  2.  **Is your friend entitled to that reading?** **Partially.** He is entitled to Interpretation 4 (PC → PP) *if* he accepts the 2D framework – it's built-in. He is *also* invoking Interpretation 5 (PC ⇒ M-P) when defending Zombies. He is *entitled* to *argue* for Interpretation 5, but he is **not** entitled to treat it as an *uncontroversial, settled principle* or an *entailment*. Interpretation 5 is highly substantive and contested, *especially* because of cases like Water. His claim that objections "beg the question" ignores the legitimate challenge posed by the defeasibility shown in the Water case. He needs to *argue* why Zombies aren't like Water in the relevant way.
  3.  **Where does the Water case bite?** The Water case **bites Interpretation 5**. It provides a clear counterexample to the idea that PC *entails* M-P (it doesn't), and it is the canonical example used to show that PC only provides *defeasible evidence* for M-P. In the Zombie argument, critics argue that Zombies are relevantly like Water – PC(Zombies) might be true, but M-P(Zombies) is false because physical facts metaphysically necessitate phenomenal facts, just like chemical facts necessitate water being H₂O. Defenders argue Zombies are *not* like Water because phenomenal concepts are distinct in a way that physical/chemical concepts are not.

  **How This Map Helps Your Group:**

  *   **Your Friend:** He is likely conflating Interpretations 4 and 5. Press him: Is he claiming PC *entails* M-P (denied by Water) or that it provides *evidence* for M-P (which Water shows is defeasible)? He needs to justify why the defeasibility in Water doesn't apply to Zombies.
  *   **First Member (Slogan Empty):** Correct against naive interpretations (1 & 2, especially 1) targeting M-P. But misses the point of the 2D framework (Interpretations 4 & 5).
  *   **Second Member (Too Weak):** Correct that weak interpretations (like 2) are useless for Zombies. Interpretation 5 is stronger but defeasible.
  *   **Third Member (Meaning of Conceivable):** Correct! The core disagreement often stems from different notions of conceivability (PF vs. I, N vs. P) and possibility (E-P vs. M-P). The map clarifies which types are in play.
  *   **The Group:** Focus discussions on:
      1.  Does everyone accept the core 2D link (Interpretation 4: PC → PP)?
      2.  Is Interpretation 5 (PC ⇒ M-P) defensible?
      3.  *Is the Zombie scenario more like the Water scenario (where PC ⇒ M-P is defeated) or not?* This is where the real philosophical weight lies.

  This menu should help move beyond talking past each other by forcing clarity on *which specific interpretation* of C→P is being invoked or challenged at any given moment, and what its commitments and vulnerabilities are. Good luck!
