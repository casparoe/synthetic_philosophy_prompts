prompt: |-
  For my high school history seminar I am writing a paper on the difference between legitimate historical revision and outright denial, and I have built an argument that I suspect proves too much. I would like you to identify the step that is doing the illegitimate work, explain why that step looked innocent, and tell me what I would have to surrender in order to repair the argument.

  I do not doubt that denial of the Holocaust or of the Armenian genocide is false, nor that revising an accepted account of such events can be legitimate. My difficulty is that the argument below makes the distinction between the two rest on nothing more than the fact that one of them happens to be respectable. I have numbered the steps so that you can refer to them.

  (1) The evidence for any historical claim is finite, and any finite body of evidence is compatible with more than one account of what happened.
  (2) Therefore no historical account is uniquely forced by the evidence.
  (3) Whatever is not forced by the evidence must be settled by something other than the evidence, namely background assumptions, prior commitments, or interests.
  (4) Deniers adopt their accounts because of prior commitments, and they retain them even when the evidence runs against them.
  (5) Revisionists also adopt their accounts partly because of background assumptions, since by (2) no account is forced.
  (6) Therefore both are adopted for extra-evidential reasons, and neither is better supported by the evidence than the other.
  (7) Therefore the difference between revision and denial is social rather than epistemic: it is a matter of which commitments the profession happens to tolerate.
  (8) But the same reasoning would make the difference between an established scientific consensus and a fringe view merely social as well, and that seems to me plainly false, since it is not a sociological accident that the flat-earth view is rejected.
  (9) So at least one of (1) through (7) must be false.

  Which one should I give up, and what does giving it up cost me? I am most attached to (1), because I cannot see how to do history without it, and to (8), because I cannot bring myself to treat the rejection of flat-earth claims as mere fashion. If you think the argument is beyond repair rather than merely misstepping, I would also like to know what a defensible version of the distinction would look like: what it is about denial, as opposed to revision, that makes it epistemically defective rather than merely unpopular.
reasoning: |-
  Okay, let me tackle this history student's problem. They've built an argument about historical revision vs. denial that they suspect proves too much, and they need help identifying where it goes wrong. 

  First, I notice their argument leads to the uncomfortable conclusion that all historical interpretation is equally arbitrary - which they recognize is problematic when comparing Holocaust denial to legitimate revisionism. They're particularly attached to premises (1) and (8), which makes sense - (1) seems fundamental to historiography, and (8) correctly insists some views are rejected for good reason.

  Hmm... the key flaw seems to be in step (6). The student equates "influenced by background assumptions" with "equally supported by evidence," but that's a false equivalence. Let me think of an analogy: two doctors looking at the same patient data. One might suspect flu due to local outbreaks (background assumption), the other might consider allergies. Both use background assumptions, but if the test comes back positive for flu, the first doctor's view is objectively better supported. 

  Similarly in history: background assumptions help frame questions, but evidence still constrains answers. Holocaust deniers ignore evidence (like the Wannsee Conference minutes), while legitimate revisionists engage with all evidence. The student's step (4) actually hints at this difference - deniers retain views "when evidence runs against them" - but they don't apply this insight when reaching conclusion (6).

  What's tricky is that premise (3) oversimplifies by saying extra-evidential factors "settle" interpretations. Actually, they just shape initial approaches - evidence still does the heavy lifting. Giving up (3)'s strong wording wouldn't cost much; we can keep (1) and (2) while acknowledging evidence can strongly favor some views over others.

  For their paper, I should emphasize that the core defect in denial is systematic evidence avoidance - refusing to engage counter-evidence or manipulate data. Legitimate revisionism, like debating Holocaust death tolls within documented parameters, still respects evidence boundaries. That's the epistemic difference sociology can't explain away.
answer: |-
  Your argument is insightful but stumbles at **step (6)**, which illegitimately equates the *role* of background assumptions in *all* historical work with the *epistemic status* of revisionism vs. denial. Let's break down why this step is flawed, why it seems innocent, what surrendering it costs, and how to repair your distinction.

  ### The Illegitimate Step: (6)
  *   **What it claims:** "Therefore both are adopted for extra-evidential reasons, and **neither is better supported by the evidence than the other**."
  *   **Why it's illegitimate:** Step (6) incorrectly infers *equal evidential support* from the mere fact that *both involve* extra-evidential assumptions. Premises (1)-(3) correctly state that evidence *underdetermines* theory and background assumptions *frame* interpretation. However, this does *not* mean that all interpretations framed by background assumptions are *equally supported* by the available evidence. Evidence *severely constrains* viable interpretations, even if it doesn't uniquely determine one. Denial systematically violates these constraints; legitimate revisionism rigorously works within them.

  ### Why (6) Looks Innocent
  1.  **Apparent Symmetry from (2) & (3):** Steps (2) and (3) establish that *no* account is "forced" solely by evidence and *all* accounts involve background assumptions. This creates a superficial symmetry between revisionism and denial: both seem to "choose" an interpretation based partly on background factors.
  2.  **Focus on Origin vs. Justification:** Step (6) conflates the *origin* of a belief (which often involves background assumptions) with its *justification* or *evidential support*. It assumes that because both *start* with extra-evidential influences, they must *remain* on equal evidential footing. This ignores how beliefs are *tested* and *revised* against evidence.

  ### What You Must Surrender: The Strong Claim in (6)
  *   **Specifically:** You must surrender the claim "**neither is better supported by the evidence than the other**."
  *   **The Cost:** Accepting this costs the simplicity of a purely symmetrical argument. You must acknowledge that while background assumptions are *necessary* for *all* historical interpretation (including revisionism), they do *not* render all interpretations *equally valid* or *equally supported by evidence*. Evidence remains the ultimate arbiter, even if interpretation is required.

  ### Repairing the Argument While Keeping (1) & (8)
  Your core insights (underdetermination & the reality of scientific consensus) can be preserved:

  1.  **Keep (1), (2), (3):** Evidence underdetermines theory; background assumptions are necessary for interpretation. This is fundamental to historiography.
  2.  **Modify (4), (5), (6):**
      *   **(4) Deniers:** Adopt accounts due to rigid prior commitments (e.g., ideology, identity). Crucially, **they systematically disregard, distort, or explain away evidence that contradicts their core claims.** They violate core norms of evidence evaluation.
      *   **(5) Revisionists:** Adopt *initial hypotheses* partly due to background assumptions (new perspectives, uncovering overlooked sources). However, **they rigorously engage with *all* relevant evidence, especially counter-evidence, and subject their interpretations to scrutiny using established historical methods.** Their background assumptions are *testable* starting points, not dogma.
      *   **(6) Revised:** Therefore, while both engage extra-evidential assumptions initially, **denial is characterized by systematic *failure to respond appropriately to evidence* and violation of methodological norms, making it epistemically defective. Legitimate revisionism, while interpretative, strives for maximal coherence with the *entirety* of the evidence and remains responsive to it.**
  3.  **Keep (7) - Modified:** The social dimension *exists* (what gets published, funded, debated), but it is **not the *foundation* of the epistemic distinction.** The epistemic defect of denial *explains* its social marginalization in the profession (though social factors can sometimes temporarily shield bad revisionism or suppress good revisionism). The profession tolerates revisionism *because* it operates within epistemic norms.
  4.  **Keep (8):** This reasoning no longer equates scientific consensus with mere fashion. The rejection of flat-earth theory is based on overwhelming, consilient evidence evaluated through rigorous methods. Fringe views typically fail precisely because they cannot meet these evidential and methodological standards, not just because of sociology. The *social process* of science/history is structured to (imperfectly) *track* epistemic robustness.

  ### A Defensible Distinction: The Epistemic Defect of Denial
  Denial is epistemically defective because it **systematically fails to engage with evidence according to the norms of historical inquiry.** Key characteristics include:

  1.  **Immunization Against Counter-Evidence:** Denial treats core claims as unfalsifiable dogma. Counter-evidence is dismissed *a priori* as forgery, conspiracy, or misinterpretation *without compelling justification*.
  2.  **Selectivity & Distortion:** It cherry-picks minor anomalies or ambiguities while ignoring vast swathes of unambiguous, consilient evidence. Evidence is often quoted out of context or misrepresented.
  3.  **Rejection of Established Methods:** It rejects fundamental historical methods (e.g., source criticism, contextual analysis, statistical reasoning) when they produce inconvenient results, often replacing them with pseudo-scholarship.
  4.  **Motivated Reasoning:** The driving force is not a genuine search for understanding based on evidence, but the defense of a pre-determined conclusion (e.g., exonerating a group/nation, supporting an ideology).
  5.  **Incoherence:** Denialist accounts often create more historical problems than they solve, requiring convoluted explanations for well-established facts and failing to offer a coherent alternative narrative consistent with the *full* record.

  **Legitimate Revisionism**, in contrast:
  *   **Respects the Evidence:** Engages seriously with *all* relevant evidence, especially counter-evidence.
  *   **Adheres to Method:** Uses established historical methods rigorously and consistently.
  *   **Offers Improved Coherence:** Aims to provide a *better* explanation of the *totality* of the evidence than the existing account, resolving anomalies or incorporating new findings.
  *   **Is Falsifiable:** Its proponents acknowledge their claims could be wrong based on evidence.
  *   **Motivated by Understanding:** Driven by a genuine (though inevitably perspectival) desire to understand the past more accurately.

  **Conclusion:** Your argument proves too much only because step (6) mistakenly infers *equal evidential support* from the *necessity of background assumptions*. Surrendering the strong claim of equality in (6) allows you to preserve the core truths of underdetermination (1, 2, 3) and the reality of epistemic progress (8), while offering a robust, non-sociological distinction: denial is epistemically defective due to its systematic and motivated violation of the norms of evidence evaluation and historical methodology, whereas revisionism operates rigorously *within* those norms. The social standing of a view within the historical profession is generally (though imperfectly) a *consequence* of its epistemic merits, not the foundation of the difference.
