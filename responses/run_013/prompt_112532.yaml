  Hmm. The user is unusually self-aware—they admit using Tom's past to dodge their own guilt and acknowledge the "house rule" might be a distraction. That's rare. They're also explicitly open to having their framing challenged, which tells me they genuinely want growth, not validation.  

  Breaking it down:  

  **On wronging Sam:**  
  - They disclosed Sam's confidence. Even if others knew, Sam entrusted *them*. The "common knowledge" excuse feels flimsy—the user suspects this themselves.  
  - Harm happened: Sam found out and was hurt. Impact > intent.  
  - So yes, an apology to Sam is needed, regardless of Tom's role.  

  **On Tom's confrontation:**  
  - The group's written rule *does* matter—it's a social contract. If Tom violated confidences within the last year (he didn't—his was 3 years ago), he'd forfeit the right to call others out. But since he's clean now, the rule doesn't apply.  
  - However... confronting the user *publicly* was arguably harsh. That's about delivery, not entitlement. Tom could've pulled them aside first.  
  - Tom's past transgression (3 years ago, apologized, behavior changed) doesn't invalidate his point now. His "two different questions" argument holds.  

  **On what to do next:**  
  - Tom's entitlement (or not) doesn't change the Sam issue. The user owes Sam an apology. Full stop.  
  - With Tom: Acknowledge his point was right *even if* his delivery was poor. Thank him for holding you accountable—it's a gift, even if awkwardly given.  
  - With the group: If the public confrontation caused tension, address it lightly—e.g., "I wish we'd talked privately first, but I needed to hear it."  

  The user's framing *is* slightly off—the three questions *are* separable, but they're using Q2 and Q3 to avoid Q1. The house rule is a red herring. Their real struggle is shame: admitting they harmed Sam feels worse than arguing about Tom's hypocrisy.  

  I should emphasize: the rule isn't "force" in a moral sense—it's a group agreement to deter gossip. It doesn't erase the user's duty to Sam. And ignoring Tom under the rule would be petty—they'd still know they wronged Sam.  

  Final thought: The user's vulnerability here is admirable. They want to do right but are stuck in defensiveness. The path forward is through humility—apologize to Sam, thank Tom—without letting pride weaponize past grievances.
answer: |-
  You've framed this with remarkable clarity and self-awareness—and you're right to suspect that collapsing these questions serves as avoidance. Let's separate the threads plainly, then examine how they interact:

  ### 1. **Did you wrong Sam, and do you owe Sam an apology?**  
     **Yes, unequivocally.**  
     - Sam shared something in confidence, you disclosed it, and it caused harm (Sam found out and was hurt).  
     - Your justification ("others knew, so I assumed it was common knowledge") is self-admitted "convenient reasoning." Trust isn't about public knowledge; it’s about respecting *Sam’s* choice in sharing with *you*.  
     - Intent ("wasn't malicious") doesn’t negate impact. Apologies repair broken trust; they’re owed when actions hurt others, regardless of intent.  
     **→ You owe Sam a sincere apology, without conditions.**

  ### 2. **Was Tom entitled to confront you publicly?**  
     **Partially—but his delivery was flawed.**  
     - **Entitlement:** Tom’s past (3 years ago) is irrelevant here. He apologized, changed his behavior, and upheld the group’s standards since. The "house rule" doesn’t apply—he’s beyond the 1-year window. His point stands: your action is independent of his history.  
     - **Confrontation method:** Criticizing you *in front of others* escalated defensiveness and shifted focus from Sam to you vs. Tom. A private conversation would have been wiser—it prioritizes accountability over shame.  
     - **His motive:** You’re right that deflecting to his past could be tactical, but his argument ("don’t use my record to avoid your conduct") is logically sound. Even if he’s hypocritical (he isn’t here), truth isn’t invalidated by the messenger’s flaws.  
     **→ Tom had the right to call you out, but his approach undermined his goal.**

  ### 3. **Does Tom’s (lack of) entitlement change what you should do now?**  
     **No. Your duty to Sam exists independently.**  
     - The core issue is your breach of Sam’s trust. Tom’s role is a distraction. Even if Tom had no right to speak (which he did), *Sam still deserves amends*.  
     - The "house rule" is pragmatic, not moral. Its purpose is to curb hypocrisy and group drama—not to absolve wrongdoing. If Tom *had* broken the rule, the group might sanction *him*, but your obligation to Sam remains untouched.  
     **→ Focus on Sam. Tom’s actions only affect how you engage *with Tom*.**

  ---

  ### Where Your Framing Goes Astray (and How to Fix It)
  - **You’re conflating accountability with permission.** Whether Tom "had the right" to confront you doesn’t erase your duty to Sam. Your guilt about Sam is leaking into defensiveness toward Tom.  
  - **The house rule is a red herring.** It’s a social agreement to prevent tit-for-tat policing, not a moral loophole. By fixating on it, you’re bargaining ("If Tom broke a rule, maybe my mistake is smaller").  
  - **Tom’s past is irrelevant** to your responsibility. His growth (owning his mistake, apologizing, changing) actually strengthens his credibility—it shows he understands why trust matters.  

  ---

  ### What to Do Now
  1. **Apologize to Sam, immediately and privately.**  
     - Say: *"I’m sorry I shared what you told me in confidence. It was a breach of your trust, and I see how it hurt you. It won’t happen again."*  
     - **Do not:** Mention Tom, the group, or your "assumption" about common knowledge. This is about Sam’s feelings, not your excuses.  

  2. **Address the group dynamic.**  
     - If Tom’s public confrontation caused tension, say to the group: *"I’ve apologized to Sam for my mistake. I regret that this became public—in future, I hope we can address these things one-on-one first."*  
     - This acknowledges the misstep without reigniting conflict.  

  3. **Talk to Tom.**  
     - Acknowledge his intent: *"You were right that I owed Sam an apology, and I’ve given one. I wish you’d told me privately first—being called out in front of others made it harder to hear you. But I appreciate you pushing me to do the right thing."*  
     - This separates his valid point from his delivery, and disarms defensiveness.  

  ---

  ### The Deeper Work
  You’re wrestling with **shame**—not just guilt. Guilt says, "I did something bad"; shame whispers, "I *am* bad." That’s why you’re scrambling for reasons Tom’s critique is invalid: admitting fault feels like a referendum on your character. But true integrity isn’t about being flawless; it’s about owning your flaws.  

  Tom held up a mirror. Thank him for that, even if the mirror was shoved in your face. Then look squarely at what it shows you.  

  > "We are not responsible for what breaks us, but we are responsible for what we do after."  
  > —Tarana Burke
