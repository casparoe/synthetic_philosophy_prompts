  Below is a complete, runnable 90-minute session plan designed to help students intuitively grasp the Gibbard-Satterthwaite theorem through hands-on failure and discovery. The activity uses a departmental retreat scenario with four options, avoids technical jargon until the debrief, and includes all requested materials, timings, and a detailed profile that enables the manipulations you seek.

  ---

  ### **Session Overview**
  **Scenario:** The committee (12 students) must choose one of four options for a departmental retreat:  
  - **A**: Beach Resort (relaxing, scenic)  
  - **B**: Mountain Cabin (rustic, secluded)  
  - **C**: City Conference Center (modern, urban)  
  - **D**: Rural Lodge (quiet, nature-focused)  

  **Stakes:** Students earn "Retreat Enjoyment Points" (REPs) based on the outcome. REPs determine small perks (e.g., bonus points on the next assignment, first choice of seminar snacks). No real money is used, but the points are tied to tangible incentives.  

  **Preference Cards:** Each student receives a private card with:  
  - A strict ranking of the options (1st to 4th).  
  - REP payoffs: 40 for 1st, 30 for 2nd, 20 for 3rd, 10 for 4th (aligns with ranking; e.g., 1st = 40 REPs).  
  - Cards are kept secret; students aim to maximize their own REPs.  

  **Key Manipulation Profile:**  
  The profile below enables profitable manipulations in all three voting rounds and contains a Condorcet cycle. Ties are avoided where possible, and tie-breaks are fixed and neutral (e.g., alphabetical order).  

  ---

  ### **Profile for Rounds 1–3 (12 Voters, 4 Options)**
  **Preferences and Payoffs:**  
  - **Group 1 (3 voters):** A > B > C > D → REPs: A:40, B:30, C:20, D:10  
  - **Group 2 (3 voters):** B > C > A > D → REPs: B:40, C:30, A:20, D:10  
  - **Group 3 (3 voters):** C > A > B > D → REPs: C:40, A:30, B:20, D:10  
  - **Group 4 (3 voters):** D > C > B > A → REPs: D:40, C:30, B:20, A:10  

  **Why this profile works:**  
  - It creates a Condorcet cycle (A > B, B > C, C > A) with no Condorcet winner.  
  - D is a Condorcet loser (loses to all others pairwise).  
  - Enables manipulations in all three rounds (detailed below).  

  ---

  ### **Session Script with Timings**

  #### **Part 1: Introduction (5 min)**  
  - **Script:** "Welcome! Today, we’re the department retreat committee. We have four options: A (Beach), B (Mountain), C (City), D (Rural). Your goal is to maximize your REPs—these translate to real perks. Each of you has a private ranking and payoff card. Keep it secret! We’ll vote using three different rules. After each vote, I’ll ask if you wanted to change your ballot—answer anonymously."  

  #### **Part 2: Voting Rounds (30 min)**  
  **Round 1: Plurality with Tie-Break (10 min)**  
  - **Rule:** "Vote for one option. Most votes wins. Tie? Alphabetical order (A > B > C > D)."  
  - **Sincere Outcome:**  
    - Votes: A:3, B:3, C:3, D:3 → Tie → A wins (alphabetical tie-break).  
  - **Manipulation Opportunity:**  
    - **Who:** A Group 4 voter (D > C > B > A).  
    - **Sincere Ballot:** D (earns 10 REPs if A wins).  
    - **Manipulative Ballot:** Vote for B instead.  
    - **New Outcome:** A:3, B:4, C:3, D:2 → B wins.  
    - **Why Better:** Voter gets B (20 REPs) vs. A (10 REPs). REPs increase by 10.  
  - **Anonymous Check:** Collect "wanted to change ballot?" cards.  

  **Round 2: Scoring Rule (10 min)**  
  - **Rule:** "Award 3 points to 1st choice, 1 point to 2nd choice. Top two advance. Majority runoff: if tie, the first-stage higher-scorer wins."  
  - **Sincere Outcome:**  
    - Points: A: (3×3) + (3×1) = 12 (Group 1: 3 first, Group 3: 1 second)  
      B: (3×3) + (3×1) = 12 (Group 2: 3 first, Group 1: 1 second)  
      C: (3×3) + (3×1) = 12 (Group 3: 3 first, Group 2/4: 1 second)  
      D: 3×3 = 9 (Group 4: 3 first) → Three-way tie (A,B,C at 12). Tie-break: A wins (alphabetical).  
  - **Manipulation Opportunity:**  
    - **Who:** A Group 2 voter (B > C > A > D).  
    - **Sincere Ballot:** B:3, C:1.  
    - **Manipulative Ballot:** Swap to C:3, B:1 (reports C > B > ...).  
    - **New Outcome:** Points: A:12, B:11 (loses 2), C:14 (gains 2), D:9 → Top two: C (14) and A (12). Runoff: C vs. A.  
      - Sincere runoff votes: Group 1: A > C (vote A), Group 2: C > A (vote C), Group 3: C > A (vote C), Group 4: C > A (vote C) → C wins 9–3.  
    - **Why Better:** Voter prefers C (30 REPs) to A (20 REPs). REPs increase by 10.  
  - **Anonymous Check:** Collect cards.  

  **Round 3: Fixed Amendment Agenda (10 min)**  
  - **Rule:** "First: A vs. B. Winner faces C. Winner faces D. Pairwise majority; tie? First-named option wins (e.g., A wins tie vs. B)."  
  - **Sincere Outcome:**  
    - A vs. B: Group 1/3 (A) vs. Group 2/4 (B) → 6–6 tie → A wins (first-named).  
    - A vs. C: Group 1 (A), Group 2 (C), Group 3 (C), Group 4 (C) → C wins 9–3.  
    - C vs. D: All groups prefer C to D (C wins 12–0). → **Final: C wins**.  
  - **Manipulation Opportunity:**  
    - **Who:** A Group 1 voter (A > B > C > D).  
    - **Sincere Ballot:** Vote A in A vs. B; A in A vs. C; C in C vs. D.  
    - **Manipulative Ballot:** In A vs. B, vote for B instead of A.  
    - **New Outcome:**  
      - A vs. B: A:5 (2 from Group 1 + 3 from Group 3), B:7 (3 Group 2 + 3 Group 4 + 1 manipulator) → B wins.  
      - B vs. C: Group 1: B > C (vote B), Group 2: B > C (vote B), Group 3: C > B (vote C), Group 4: C > B? (Group 4: D > C > B → C > B, vote C) → B:6, C:6 → Tie → B wins (first-named).  
      - B vs. D: B beats D 12–0. → **Final: B wins**.  
    - **Why Better:** Voter prefers B (30 REPs) to C (20 REPs). REPs increase by 10.  
  - **Condorcet Cycle Highlight:**  
    - Point out the cycle: A > B (6–6? Tie, but A wins), B > C (Group 1/2/4: B > C; 9–3), C > A (Group 2/3/4: C > A; 9–3). Agenda order (A vs. B first) caused C to win. Change the order? E.g., if B vs. C first, then B wins overall.  
  - **Anonymous Check:** Collect cards.  

  #### **Part 3: Design Phase (25 min)**  
  - **Task (5 min):** Pairs draft a voting rule that:  
    (1) Always picks a winner from {A,B,C,D},  
    (2) Could pick any option,  
    (3) "Cannot be gamed" (no voter can ever get a better outcome by lying).  
  - **Swap and Test (15 min):** Pairs swap rules. Each pair tries to "break" the other’s rule by finding a profile and voter who can profit by misreporting. Instructor referees, keeps score, and rules on disputes.  
  - **Expected Outcomes:**  
    - Most rules fail (e.g., "top-two runoff" can be gamed like Round 2).  
    - Some pairs may propose:  
      - **Random selection:** "Pick a voter at random; their top choice wins." (Hard to game, but random—point this out later.)  
      - **Exclusion rules:** "Ignore option D; vote among A,B,C." (Violates "could pick any option.")  
      - **Dictatorship:** "Let the chair (one person) decide." (Survives testing but unpopular.)  
  - **Instructor Role:** Seed ideas if needed (e.g., "What if we randomly pick a decider?"). Ensure dictatorship is proposed/discussed.  

  #### **Part 4: Debrief (30 min)**  
  **Step 1: Review Voting Rounds (10 min)**  
  - Reveal the manipulations:  
    - Plurality: Group 4 voter misreported to get B.  
    - Scoring: Group 2 voter misreported to get C.  
    - Agenda: Group 1 voter misreported to get B.  
  - Highlight the Condorcet cycle: "The agenda order decided the winner—no one voted on the order!"  

  **Step 2: Three "Exits" (15 min)**  
  Present escapes as discoveries:  
  - **Exit 1: Restrict Preferences (Single-Peakedness)**  
    - New profile (single-peaked on left-right axis: A–B–C–D):  
      - 4 voters: A > B > C > D (peak A)  
      - 2 voters: B > A > C > D (peak B)  
      - 3 voters: C > B > D > A (peak C)  
      - 3 voters: D > C > B > A (peak D)  
    - **Rule:** "Median of peaks. For even voters, pick the rightmost option in the middle (peaks ordered: A,A,A,A,B,B,C,C,C,D,D,D → 6th/7th are B and C → pick C)."  
    - Outcome: C wins. Students try to game it (e.g., a peak-B voter reports A as peak). New median? Original peaks: A,A,A,A,B,B,C,C,C,D,D,D → If one B reports A, peaks become A,A,A,A,A,B,C,C,C,D,D,D → Median is B (6th: A, 7th: B → pick B? No—ordered list: positions 1–12; 6th is B). Outcome still C. **Why it works:** Preferences are restricted; no profitable lie.  

  - **Exit 2: Allow Chance**  
    - **Rule:** "Pick a voter at random; their top choice wins."  
    - Students try to game it (e.g., a Group 4 voter reports D as top to increase its chance). But:  
      - If their true top is D, lying lowers D’s chance.  
      - If they prefer C, reporting C as top might help, but only if others’ reports don’t change the lottery. **Why it works:** No deterministic incentive to lie, but outcome is random.  

  - **Exit 3: Dictatorship**  
    - Point to surviving rules from design phase: "The only ungameable rule you built? Let one person decide."  
    - **Punchline:** "So we avoided manipulation... by giving up democracy."  
    - **Mapping to Hypotheses:**  
      - Beach Resort (A): Abandon "all options possible."  
      - Mountain Cabin (B): Abandon "no randomness."  
      - Rural Lodge (D): Abandon "committee input."  
      - City Conference (C): The median outcome—viable only with restrictions.  

  **Step 3: Theorem and Caveats (5 min)**  
  - **Gibbard-Satterthwaite:** "Every voting rule with ≥3 options is either gameable, random, or a dictatorship. What you experienced generalizes."  
  - **Randomized Version:** "Strategy-proof random rules must be lotteries over dictatorships—take that on trust."  
  - **Money Changes Everything:** "If we used payments (e.g., bidding), we could design honest rules—but that’s another topic."  
  - **Address Objections:**  
    - "Should vote sincerely": "But if every rule can be gamed, we can’t enforce sincerity."  
    - "Didn’t know others’ votes": "Exactly! The theorem is about dominant strategies (no matter what others do). In practice, uncertainty complicates gaming—but the vulnerability remains."  

  ---

  ### **What the Activity Cannot Do**  
  - **Finite Testing ≠ General Proof:** Testing finitely many rules doesn’t prove all rules fail. Students see that common rules fail, and dictatorship "succeeds." The leap to the theorem requires your explanation.  
  - **Smallest Honest Proof (10 min):**  
    1. Assume a strategy-proof, non-dictatorial rule with ≥3 options.  
    2. Show it must be monotonic (if A wins and you raise A in your ranking, A still wins).  
    3. Use the Condorcet cycle profile to show monotonicity fails when no Condorcet winner exists → contradiction.  
    *(Whiteboard steps: Construct a profile where A wins; have a voter with A last move A to first. By monotonicity, A still wins. But if others’ preferences create a cycle, this can break transitivity. Strategy-proofness fails.)*  

  ### **Predictable Problems and Solutions**  
  - **Ties/Tie-Breaks:**  
    - Profile avoids ties in pairwise votes. Round 2 scoring tie was intentional (to show manipulation).  
    - Tie-breaks are fixed and neutral (alphabetical/agenda order) to minimize being a "lever."  
  - **Voters with No Profitable Lie:**  
    - In each round, only some voters can manipulate. Preempt: "Not everyone can game every system—but someone always can."  
  - **Caucusing/Vote-Trading:**  
    - Ban collusion: "No discussing votes or deals—private ballots only." If it happens, note: "The theorem is about individual manipulation; collusion is harder to prevent."  
  - **Objections:**  
    - "Should vote sincerely": Debrief clarifies the rule’s vulnerability, not voter morality.  
    - "Didn’t know others’ votes": Validate this—dominant strategies are idealized. The debrief distinguishes between the theorem’s assumptions and real-world uncertainty.  

  ---

  ### **Materials**  
  - **Preference Cards:** 12 cards (laminated) for Profile 1 (Rounds 1–3) and 12 for single-peaked profile.  
  - **Ballots:** Paper slips for each vote.  
  - **Scorecards:** Track REPs earned (for stakes).  
  - **Anonymous Cards:** "Would you have wanted to change your ballot? Yes/No."  

  This plan ensures students experience the frustration and discovery behind the theorem, with a clear path from "committee business" to profound insight. The profile enables all requested manipulations, and the debrief transforms failures into a cohesive narrative.
