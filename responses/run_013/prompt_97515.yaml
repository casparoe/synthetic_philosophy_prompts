  Okay, the user is grappling with how to classify scientific research programs as progressive or degenerating. They've provided several historical examples and noted contradictions in their initial assessments. For instance, both Prout's hypothesis and phlogiston theory involved patching, but they label one progressive and the other degenerating. Similarly, Wegener's continental drift and cold fusion both seemed ahead of evidence but received opposite verdicts. The user wants a consistent criterion that explains all these cases without necessarily invoking Lakatos by name.

  First, I need to recall Lakatos's framework from the philosophy of science. His Methodology of Scientific Research Programmes (MSRP) distinguishes between progressive and degenerating programs based on whether they predict novel facts or merely accommodate existing anomalies. This seems relevant to the user's query. However, the user prefers principles over names, so I should present the ideas without emphasizing Lakatos.

  Looking at the examples: Prout's hypothesis, though wrong, led to discoveries like isotopes, which fits Lakatos's idea of empirical progress. Phlogiston, despite patches, didn't yield new predictions and was replaced by oxygen theory. Wegener's work inspired plate tectonics, predicting geological features, while cold fusion failed replication and produced no new insights. Ptolemy's epicycles started progressive but became degenerative with excessive complexity. Bohr's model successfully predicted spectral lines, showing progress.

  The key difference lies in the outcomes of patching. Progressive programs use patches to generate novel predictions and discoveries, while degenerating ones add complexity without new insights. For steady-state cosmology after CMB discovery, it tried to accommodate the anomaly (e.g., through inhomogeneities) but didn't predict new facts, making it degenerating. This aligns with the user's examples.

  I should note where there's consensus and controversy. Most philosophers agree that predicting novel facts is a hallmark of progress, but there's debate over whether this is the sole criterion and how to define "novel." Some argue sociological factors also play a role. The user's verdict on Ptolemy (progressive early, degenerating later) is widely accepted, while cold fusion's classification is less contentious than phlogiston's, where some historians might argue it had progressive elements.

  The user might also be seeking a practical tool to evaluate current or historical theories, indicating a deeper interest in applying philosophical principles to real-world science. They value clarity and conciseness, so I'll keep the response under 400 words, focusing on the principle that progressive programs predict new facts through patches, while degenerating ones only explain anomalies.
answer: |-
  Based on your examples and the core tension you identified, the best principle seems to be:

  **A research programme is progressive if its core ideas consistently drive the *prediction and discovery* of significant *novel facts* (even via patching). It is degenerating if its core ideas are primarily *protected* by patching that only *accommodates* or *explains away* anomalies without generating substantial new, testable knowledge or discoveries.**

  **How it handles your pairs:**

  1.  **Prout vs. Phlogiston (Patching):**
      *   **Prout (Progressive):** Patches (like assuming impurities) directly *motivated novel experimental work* (e.g., purifying elements, discovering isotopes). The core idea *drove discovery*.
      *   **Phlogiston (Degenerating):** Patches (negative weight, different types) primarily *reinterpreted known phenomena* (calcination, combustion, respiration) to save the core. They didn't *predict* or *drive discovery* of fundamentally new phenomena like oxygen chemistry did.
      *   **Difference:** Outcome of the patch. Prout's patches *led to* discovery; phlogiston's patches *only absorbed* anomalies.

  2.  **Wegener vs. Cold Fusion (Ahead of Evidence):**
      *   **Wegener (Progressive):** The core idea (continental movement) *predicted novel facts* (geological/biological matches across oceans) that *drove decades of new research* (paleomagnetism, seafloor spreading) culminating in plate tectonics' novel predictions.
      *   **Cold Fusion (Degenerating):** After the initial anomaly (excess heat claims), efforts focused on *explaining away failures to replicate* (impurities, "loading ratios," unknown triggers) or detecting ever-elusive signals (neutrons, tritium) *without generating robust, reproducible novel phenomena or predictions* accepted by mainstream science.
      *   **Difference:** Wegener's idea *generated sustained, fruitful novel research*; Cold Fusion primarily generated *defensive adjustments* and failed replications.

  **Your Other Cases:**

  *   **Ptolemy:** Progressive early (predicted planetary positions well, drove observational refinement). Degenerating later (equants, offset eccentrics added huge complexity *only* to fit known data without enabling new predictions).
  *   **Bohr-Sommerfeld:** Progressive. Core quantization idea drove *predictions* of spectral lines (even for complex atoms with refinements) and novel phenomena like the Stark effect.

  **Steady-State Cosmology after CMB:**

  *   **Verdict:** Degenerating.
  *   **Why:** The CMB was a massive, unexpected anomaly. Patches proposed (e.g., "little bangs" creating matter in voids to maintain average density) primarily aimed to *absorb* the CMB into the steady-state framework *without* generating significant new, testable predictions that could rival the Big Bang's explanatory power and novel predictions (e.g., light element abundances, structure formation). The effort shifted heavily to *protecting* the core against the CMB.

  **Settled vs. Contested:**

  *   **Settled Core Idea:** Philosophers/historians largely agree that predicting *novel* facts (especially surprising ones) is a key hallmark of progressive science (Popper, Lakatos). The distinction between predicting vs. accommodating anomalies is fundamental.
  *   **Genuinely Contested:**
      *   **Is prediction the *only* criterion?** Some argue for the importance of unifying power, simplicity, or problem-solving effectiveness (Kuhn, Laudan), even without novel predictions.
      *   **Defining "Novel Fact":** Is it "novel" if predicted but only discovered *because* of the theory (Lakatos's view), or just temporally new? (Contentious).
      *   **Weight of Social Factors:** How much do sociological/institutional factors influence perceived "progressiveness" vs. inherent intellectual content? (SSK - Sociology of Scientific Knowledge).
      *   **Phlogiston's Status:** Some historians argue aspects of phlogiston theory (e.g., energy transfer ideas) were more progressive than your verdict suggests.

  **Forced Verdict Change?** The principle largely validates your judgments. The most debatable is perhaps **Phlogiston**. While widely seen as degenerating *relative* to Lavoisier's oxygen theory, some argue its *earlier* stages involved more genuine predictive/problem-solving progress than the principle might imply. However, its *later* defensive patching fits the degenerating label. You likely wouldn't *need* to change any verdict based purely on this principle.
