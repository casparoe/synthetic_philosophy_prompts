prompt: |-
  Ok so I've been reading a bunch of history of science and jotting down gut verdicts on which research programmes count as progressive and which as degenerating, and I want to know if there's actually a principle behind them. Here's what I've got. Prout's hypothesis that atomic weights are whole-number multiples of hydrogen: progressive, even though it was wrong and basically got patched every time a weight came out non-integer. Phlogiston: degenerating, and the constant patching is exactly what makes me say so. Wegener's continental drift before there was any decent mechanism: progressive. Cold fusion after 1989: degenerating. Ptolemy's epicycles: I'll say progressive in the early phase and degenerating later, if that's allowed. Bohr's atom plus Sommerfeld's refinements: progressive. Two pairs are bothering me. Prout and phlogiston were both being patched to protect the core idea, yet I give them opposite verdicts. And Wegener and cold fusion both ran way ahead of the evidence, yet opposite verdicts there too. So: is there a criterion -- something in the ballpark of 'progressive = keeps predicting novel facts, degenerating = only absorbs anomalies' -- that actually gets all of these? If so, does the real difference live in the patching itself or in what the patching eventually led to? Tell me what your best version predicts for a case I haven't listed, like steady-state cosmology after the CMB, and which one of my verdicts it forces me to give up. A friend says this is just Lakatos's problem again, so I'm half expecting the answer to be him, but I'd rather have the principle then the name. And please flag which bits are settled versus which are genuinely contested among people who study this, don't make it all sound like consensus. Under 400 words please.
