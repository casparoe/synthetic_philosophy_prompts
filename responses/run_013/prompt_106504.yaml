prompt: |-
  I am a novelist — historical detective fiction, principally — and I have been asked to give a two-hour session at a week-long residency for working fiction writers: twelve of them, none with mathematics beyond secondary school, several of whom will regard any mention of probability as an intrusion on the business of writing, and none of whom will have done any preparation. The session has a whiteboard and nothing else. What I want them to leave with is a working feel for the problem of old evidence as it arises in Bayesian confirmation — the puzzle that a fact already in one's possession cannot raise the probability of a hypothesis, since one's credence in the fact is already maximal, and yet we are all confident that cases are sometimes made out of precisely such facts. I have been calling the session the detective's retroactive confidence, and I would far rather my writers felt the puzzle in their hands than learned to name its parts. So I am not asking you to explain the problem to me; I am asking you to plan how I should explain it.

  Give me the order in which the pieces must go, and why each must wait for the one before it — which idea has to be in place before the question can even be posed to this audience, and which apparent preliminaries are in fact traps. Then the example. More than anything else, the session will stand or fall on the single case I build it around, and I have a candidate from my own manuscript which I want you to rule on rather than assume: in the second chapter, casually, and treated by everyone including my detective as a piece of household colour, it is established that the dead man's dog was found shut in the scullery; only in the final act does that detail become evidence — evidence that the caller the dog would have savaged was someone the dog knew well — and my detective's confidence in her theory of the killing rises sharply although she has learned nothing whatever. Tell me whether that case can carry the whole two hours or whether it must be demoted to a subsidiary illustration, and if it cannot carry, supply the case that can — and in either event tell me what the carrying example must have and what it must conspicuously lack, and why.

  I also want the misconceptions mapped. I expect at least one writer to insist the puzzle is really about memory — that the detective had forgotten and is merely being reminded, so the evidence is new after all — and another to object that no one is ever quite certain of anything, which I suspect dissolves the puzzle rather than solving it, though I could not tell you why. A third, I am fairly sure, will reach for the thought that the scullery detail is confirmed by being explained, a phrase I use myself and which I suspect is doing work I do not understand. Tell me which of these are real misconceptions and which are legitimate objections I must not head off, where in the sequence each should be met, and what I should say when I meet it. I have also been toying with a distinction of my own — between a fact's arrival and its later promotion to the status of evidence — and I want to know whether that distinction clarifies the sequence or corrupts it, and if it clarifies, exactly where it belongs. Finally, tell me what I should openly refuse to explain at this level and say so from the outset, and give me one question to put to the room at the end that would show me whether they have understood the problem rather than merely enjoyed it.
reasoning: |-
  Okay, the user is a novelist specializing in historical detective fiction. They need to plan a two-hour session for a writers' residency about the Bayesian problem of old evidence, using a whiteboard only. The audience has minimal math background and might resist probability talk. The goal is to make them feel the puzzle, not name its parts.

  First, I need to structure the session step by step. Start with why facts matter in detective stories, then introduce probability basics without equations. Use relatable examples like coin flips to explain how evidence updates beliefs. The key is to build intuition before introducing Bayes' theorem conceptually.

  The user's dog-in-scullery example seems perfect as the central case. It's concrete, story-driven, and shows how a known fact gains new significance. But it needs scaffolding—first present it as mere color, then later reveal its evidentiary value. This mirrors how detectives recontextualize old details.

  Common misconceptions must be addressed: the memory objection (it's not about forgetting), certainty claims (certainty isn't required), and "explained" evidence (that's post-hoc rationalization). The user's arrival/promotion distinction is actually helpful—it separates learning a fact from recognizing its relevance. Introduce this after the puzzle surfaces.

  Avoid formal math; emphasize narrative mechanics. End with a question testing if they grasp why old evidence seems convincing despite Bayesian rules. The session must stay visceral—about the feeling of retroactive discovery in storytelling.
answer: |-
  Here’s a battle-tested plan for your session, designed to make the puzzle *felt* without drowning in formalism. The sequence is critical—each step builds intuition while disarming traps.

  ### **The Order: Why Each Piece Must Wait**
  **(Total: 110 mins + 10-min buffer)**

  1.  **The Detective’s Currency: Beliefs Shifted by Facts (15 mins)**  
      *Start here:* Ask writers to brainstorm how detectives *change their minds* mid-investigation. List examples (e.g., "Alibi broken → Suspect X now likely").  
      *Why first?* Grounds the session in their domain (narrative mechanics), not math. Establishes "evidence" as something that *moves confidence*.  
      *Trap avoided:* Jumping straight to probability would lose half the room.

  2.  **Confidence as a Scale (Not Certainty) (10 mins)**  
      Draw a 0–100% "confidence meter" for a hypothesis (e.g., "The butler did it"). Use sticky hypotheticals:  
      *   *0%:* "I’m sure he didn’t"  
      *   *50%:* "No idea—could be him or the gardener"  
      *   *90%:* "Almost certain, but need that last clue".  
      *Why now?* Normalizes probabilistic *thinking* without calculation. Preempts the "no one is certain" objection later by showing degrees matter.  
      *Trap avoided:* Calling this "probability" too early triggers math phobia.

  3.  **How New Facts *Usually* Move the Needle (20 mins)**  
      Use a simple story: *A priceless vase smashed overnight. Initially, 3 suspects (A, B, C) at 33% each.*  
      - *New Fact 1:* "Security logs show A entered the room." → A's confidence ↑ (to 60%), B/C ↓.  
      - *New Fact 2:* "B has an alibi (on camera elsewhere)." → B ↓, A ↑ further (to 85%), C ↑ slightly.  
      *Why here?* Models incremental belief updating. Shows "new" facts (previously unknown) *naturally* shift confidence. Sets the contrast for the puzzle.

  4.  **Introduce YOUR Case: Dog in Scullery (First Pass) (10 mins)**  
      Present it *exactly as in Chapter 2*: "A color detail—the victim’s fierce dog was found locked in the scullery. Everyone shrugs; maybe the killer didn’t like dogs?" No theory yet.  
      *Why now?* Anchors the "old evidence" concretely. Writers *experience* it as trivial background.

  5.  **The Puzzle: When the "New" Evidence Isn’t New (20 mins)**  
      Fast-forward to your finale. Detective’s theory: "The killer *was someone the dog knew* (so it didn’t bark/attack, letting them lock it away)."  
      *Ask writers:* "When the detective realizes this, her confidence in her theory *soars*. But did she learn a *new fact*?"  
      *Elicit:* No—the dog was locked in the scullery all along. She *knew* it.  
      *Whiteboard the contradiction:*  
      - *Before:* Knew dog was locked in scullery.  
      - *After:* Same knowledge, but confidence ↑ sharply.  
      *Why here?* The tension is visceral now. They see the paradox in story terms: *How can old news feel like new proof?*  
      *Trap avoided:* Introducing Bayes’ theorem here would kill momentum.

  6.  **Your Distinction: "Arrival" vs. "Promotion" (15 mins)**  
      *This clarifies; use it now.*  
      - **Arrival:** When the fact is first learned (Chapter 2—dog locked up). Confidence doesn’t budge.  
      - **Promotion:** When the fact is *reinterpreted* as evidence for a *specific* hypothesis (Finale—dog locked up *implies familiarity*). Confidence surges.  
      *Why now?* It resolves the "But she knew it!" confusion. Names the *narrative mechanism* they intuitively grasp.  
      *Crucial note:* "Promotion" changes how the fact *connects* to the hypothesis, not the fact itself.

  7.  **Demolishing Misconceptions (20 mins)**  
      *Pose objections writers might have; dissect together:*  
      - **"It’s about memory! She forgot!"**  
        *Counter:* "Did she? She mentioned the dog in Ch. 2. She *knew* but didn’t *use* it yet. Remembering ≠ *reinterpreting*."  
      - **"No one is 100% certain!"**  
        *Counter:* "True! But the puzzle isn’t about certainty. Even if she was 99.9% sure about the dog *as a fact*, that 0.1% doubt doesn’t explain her *massive* confidence jump in the *theory*. The *connection* is new."  
      - **"The detail is 'confirmed by being explained'!"**  
        *Danger!* This sounds profound but misleads. *Clarify:* "Explaining a fact feels satisfying, but it doesn’t *make the fact truer*. The dog *was* locked up regardless. The 'confirmation' is really the *theory* gaining plausibility by *accounting for* the fact."  
      *Why here?* Misconceptions arise *after* the puzzle is felt. Debunking now deepens understanding.

  ---

  ### **Verdict on Your Dog-in-Scullery Case**
  **It CAN carry the session—with two tweaks:**  
  1.  **Explicitly separate "Arrival" (Ch. 2) and "Promotion" (Finale)** in your telling. Highlight the *narrative gap* where the fact lies dormant.  
  2.  **Add a "before/after" confidence meter** for the *theory*:  
      - *Before promotion:* "Theory without dog connection" at 40%.  
      - *After promotion:* "Theory explaining dog" at 85%.  

  **Why it works:**  
  - Deeply intuitive (dog behavior = clue to familiarity).  
  - Shows "evidence" is relational (fact + hypothesis link).  
  - Embodies "retroactive" in the plot structure.  

  **What it lacks (and doesn’t need):**  
  - Numerical probabilities. Keep it qualitative ("low/medium/high confidence").  
  - Multiple hypotheses. Focus on *one theory’s rise* via repurposed evidence.  

  **If you needed a backup case:**  
  > *A stolen painting. Initial fact: "The frame was left behind." (Shrugged off—thief was rushed?). Later theory: "It was an *inside job*—the thief knew the frame had a tracking device." Confidence surges in the "insider" hypothesis. Same fact, new connection.*  

  ---

  ### **What to Refuse to Explain (State Upfront!)**
  - **"I won’t write Bayes’ theorem on the board.** This isn’t a math class. We’re exploring *why* detective stories make old clues feel convincing, not calculating probabilities."  
  - **"I won’t debate philosophy of science.** We’re focused on narrative mechanics, not Popper vs. Kuhn."  

  ---

  ### **The Closing Question to Test Understanding**
  > **"In your own WIP, pick a 'color detail' your detective knows by Chapter 3. How could you *promote* it in Act III to make their confidence in the killer's identity jump—*without* adding new facts?"**  

  *Why it works:*  
  - Forces application of "arrival vs. promotion."  
  - If they invent a *new connection* for an existing fact (e.g., "The muddy boots weren’t from rain—they matched the rare clay in the suspect’s garden"), they get it. If they suggest a "reminder" or new fact, they don’t.  

  This structure turns abstract philosophy into writer’s craft. They’ll leave feeling the retroactive twist in their bones—and hungry to use it. Break a leg.
