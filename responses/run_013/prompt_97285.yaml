prompt: |-
  I've spent the better part of a year reading my way through the literature on how states handle the aftermath of mass atrocities — truth-for-amnesty bargains and their relatives — and there is a shape to these arrangements that I keep running into and cannot find a name for. Roughly: the official record of what happened is assembled out of voluntary testimony, and the testimony was bought. People came forward because something was on the table — immunity, a lighter sentence, a chance to fix their own framing in the permanent account — so the set of people who appear in the record is close to the set of people for whom that trade was worth making. The man who knows he will never be prosecuted has nothing to purchase and no reason to talk. The family that wants nothing to do with the state's process stays home. The perpetrator who reads the offer as a trap keeps quiet and waits. Then the record hardens into the official history, and its silences begin doing work they were never designed to do: "it isn't in the report" shades into "it didn't happen," in courtrooms, in textbooks, in arguments between grandchildren. South Africa is the famous instance, but I doubt the pattern is South African.

  Two features of it seem to me to escape the obvious vocabulary. The first is that it isn't a failure of care: the commissioners can be as scrupulous as you like, because the distortion sits in the mechanism that got people to talk at all rather than in the inquiry, and the obvious remedies — subpoena power, compelled testimony, a duty to appear — would destroy the very thing that produced the testimony in the first place. The second is that the record is not secretively partial: everyone involved knows it is partial, knows roughly who is missing and why, and it still functions as the baseline against which later claims are measured, with the knowing apparently doing no work at all. I've read enough rationalist-adjacent material to have a working grip on survivorship bias and selection effects generally, and I'm fairly sure that isn't it — the missing people here didn't die or fail a filter, they declined a trade. I also know the standard complaint that commissions manufacture a sanitized or negotiated narrative, and that strikes me as a different animal: it concerns what the commission chose to say, whereas what I'm after concerns who never walked in the door. I've likewise seen "archival silence" used in library-and-archive writing, but as far as I can tell that names gaps produced by who held the power to deposit records, which again isn't quite the thing.

  Is there a term of art for this — in the transitional-justice literature, in legal epistemology, or anywhere else — and if so, what does it cover that my description doesn't, and how would you distinguish it from the three near-misses above? If there isn't one, coin it: give me a name, a definition, and the edges. In particular I'd like to know what the same phenomenon looks like outside transitional justice, and which of the nearby concepts you'd say comes closest, and why.
reasoning: |-
  Okay, let me start by unpacking the user's query. They've spent a year researching how states handle mass atrocities, focusing on truth commissions and amnesty deals. They've noticed a pattern where the official record is built from voluntary testimony incentivized by offers like immunity or lighter sentences. This creates a selection bias in who participates, which then hardens into official history, leading to silences being misinterpreted as non-events. The user is looking for a term that describes this specific phenomenon.

  First, I need to recall relevant concepts from transitional justice. The user mentions South Africa's TRC as a key example. They've already ruled out survivorship bias, selection effects, and archival silence. They also differentiate this from the critique of sanitized narratives. So the core issue is the voluntary participation driven by incentives, leading to structural gaps in testimony.

  I remember that in legal epistemology, there's discussion about how legal procedures shape knowledge. The "incentivized testimony gap" comes to mind. This term highlights the trade-off between incentives and participation. But maybe it's too narrow. Another angle is "structural silence," which emphasizes the systemic nature of the gap. But the user wants something that captures the transactional aspect.

  Looking at other fields, in journalism, "source selection bias" occurs when sources with agendas shape stories. In oral history, "voluntary omission" refers to interviewees withholding information. These are similar but not exact. The user's phenomenon is specific to state-sponsored processes with formal incentives.

  The term "transactional silence" might work. It combines the economic exchange (transaction) with the resulting absence (silence). It also conveys the contractual aspect of bargains like amnesty for testimony. This term hasn't been widely used, so coining it makes sense. 

  Next, defining it clearly: a structured gap in official records due to reliance on incentivized voluntary participation. Key elements are the voluntary nature, state-sponsored incentives, and the hardening of the record. This distinguishes it from survivorship bias (which is about survival, not choice) and archival silence (about power to deposit records).

  Outside transitional justice, similar patterns appear in plea bargains where only those with something to gain participate, leaving out victims or powerful figures. In journalism, sources with incentives might dominate, skewing narratives. In corporate investigations, whistleblower programs might only attract certain employees, creating gaps.

  Among near misses, "structural silence" comes closest because it addresses systemic omissions. But "transactional silence" is more precise about the exchange mechanism. The user's deep dive shows they need a term that captures both the incentive structure and the resulting epistemic problem. Coining "transactional silence" seems the best fit, emphasizing the bargain at the heart of the silence.
answer: |-
  Based on your meticulous description and the gaps you've identified in existing terminology, here's a breakdown:

  1.  **The Core Phenomenon:** The **structured, systemic gap in an official historical record resulting directly from the reliance on incentivized voluntary testimony within a state-sponsored process**, leading to the exclusion of perspectives from those for whom the offered incentive holds no value or is perceived as a threat, and the subsequent hardening of this partial record into authoritative history where its silences acquire unintended negative epistemic weight.

  2.  **The Term: Transactional Silence**

      *   **Definition:** *Transactional Silence* refers to the deliberate, structurally induced absence of certain voices, perspectives, or information within an official historical record or narrative, specifically arising from the mechanism of a state-sponsored process (e.g., truth commission, plea bargain system, amnesty program) that relies on *voluntary participation purchased through incentives* (immunity, sentence reduction, narrative control). This absence occurs because individuals or groups for whom the incentive is irrelevant, insufficient, or perceived as detrimental rationally choose non-participation. The resulting partial record, while often openly acknowledged as incomplete, subsequently becomes institutionalized as the baseline account, and its silences unintentionally function as evidence of non-occurrence or insignificance, despite the known transactional origin of the gap.
      *   **Key Components:**
          *   **State-Sponsored Process:** An official mechanism designed to establish a public record.
          *   **Incentivized Voluntary Testimony:** Participation is *bought* (immunity, leniency, narrative influence), not compelled.
          *   **Rational Non-Participation:** Absence stems from a calculated decision *not to trade* based on the offered incentive's irrelevance, insufficiency, or perceived risk.
          *   **Structural Gap:** The silence is inherent to the process design, not accidental or solely due to malice/neglect.
          *   **Epistemic Hardening:** The partial record becomes authoritative, and its silences acquire unintended negative evidentiary weight ("It's not here, so it didn't happen/matter").
          *   **Known Partiality:** The incompleteness is often recognized but fails to adequately mitigate the epistemic consequences of the silence.

  3.  **Distinguishing from the Near-Misses:**

      *   **Survivorship Bias / Selection Effects:** These are *general* statistical biases. *Transactional Silence* is a *specific subtype* of selection effect, but crucially:
          *   **Mechanism:** It focuses explicitly on the *rational refusal of a specific transactional offer* made by an authority, not random survival, passive filtering, or general access barriers.
          *   **Agency:** Emphasizes the *active choice* of the missing party *not to engage in the trade*, not just their passive absence.
          *   **Context:** Rooted specifically in state-sponsored truth-seeking or accountability mechanisms with formal incentive structures.
      *   **Sanitized/Negotiated Narrative Critique:** This critiques *what is included* and *how it's framed* (omissions by the *commission*, softening of facts, political compromises shaping the *written output*). *Transactional Silence* critiques *who is fundamentally missing* and *why they are absent* (the gap created *before* testimony is even given, due to the participation *mechanism*). It's about the *input pool* being skewed, not the *output narrative* being manipulated or softened.
      *   **Archival Silence:** This concept focuses on gaps created by *whose records were created, preserved, and deemed valuable enough to enter the archive* by dominant powers historically. *Transactional Silence* operates in a *contemporary, structured process*:
          *   **Temporality:** It happens *during* the deliberate creation of the official record.
          *   **Mechanism:** The gap arises from the *transactional participation rules* of the specific process, not from historical preservation decisions or power imbalances in depositing material.
          *   **Formality:** Involves a formal offer and refusal within a defined institutional framework.

  4.  **Edges of "Transactional Silence":**

      *   **Incentive Spectrum:** Covers explicit bargains (immunity for truth) to softer incentives (reduced stigma, voice in the narrative).
      *   **"Voluntary":** Includes choices made under significant pressure or threat of prosecution if they *don't* participate, as long as the core mechanism is offer/acceptance rather than compulsion.
      *   **"Silence":** Encompasses complete absence, selective testimony (only safe parts), and dominant framing that marginalizes non-participants' perspectives.
      *   **Limits:** Doesn't cover silences from destruction of evidence, witness intimidation *outside* the official process, or simple lack of resources to investigate. It's specifically about gaps created *by the design of the testimony-gathering mechanism itself*.

  5.  **Outside Transitional Justice:**

      *   **Plea Bargaining Systems:** The official court record (guilty plea, agreed facts) excludes:
          *   **Victim Perspectives:** Often irrelevant to the plea deal.
          *   **Broader Systemic Issues:** Beyond the specific charge.
          *   **Co-Defendants who Don't Deal:** Their silence or alternative narrative is absent/marginalized.
          *   **Powerful Actors:** Who avoid indictment altogether and have no incentive to speak. The plea deal narrative hardens into "what happened."
      *   **Corporate Internal Investigations (Whistleblower/Amnesty Programs):** The official report is built on testimony from employees incentivized by amnesty from internal sanctions. It misses:
          *   **Senior Executives:** Who know they are protected or can weather the storm without participating.
          *   **Those who Fear Retaliation:** Despite amnesty, distrust the process.
          *   **External Victims/Partners:** Not invited or incentivized to participate. The report becomes the company's "definitive account."
      *   **Journalistic Sourcing (Controlled Access/Exclusives):** The resulting story relies heavily on sources granted access/information in exchange for favorable framing or anonymity. It misses:
          *   **Critics/Opponents:** Who refuse to engage on the reporter's terms.
          *   **Those Demanding Different Concessions:** Whose price for talking wasn't met. The published story becomes the dominant narrative, its gaps (known to the journalist) often unremarked upon.
      *   **Government Inquiries (Voluntary Witnesses):** Where subpoena power isn't used, the findings rely on those willing to come forward, often seeking to clear their name or influence the outcome. Missing are those who see no benefit or only risk, leading to an authoritative report with structural blind spots.

  6.  **Closest Nearby Concept: Structural Silence**

      *   **Why:** "Structural Silence" (used occasionally in critical theory, archival studies, and sociology) comes closest because it emphasizes that the silence is not random or individual, but produced by the underlying structures and power relations embedded within the system or process itself.
      *   **Distinction:** "Structural Silence" is broader. It could encompass archival silence, silencing through systemic discrimination, or the silencing effect of bureaucratic language. **Transactional Silence is a specific *mechanism* creating a *type* of Structural Silence.** It pins down the *transaction* (offer of incentive for testimony) as the specific structural element generating the gap and the subsequent epistemic hardening. It provides the concrete "how" within the broader "why" of structural silence in these contexts.

  **In Summary:**

  You've identified a distinct epistemic problem inherent in processes that trade truth for cooperation: **Transactional Silence.** It's the gap bought by the bargain itself, where the price of admission excludes those who can't or won't pay it, and where that purchased absence later gets mistaken for proof of nothingness. While "Structural Silence" is the closest existing umbrella term, "Transactional Silence" precisely names the mechanism you've dissected – the silence generated by the terms of the trade at the heart of the process. It highlights the tragic irony that the very mechanism designed to *reveal* truth systematically *conceals* certain truths through its foundational bargain.
