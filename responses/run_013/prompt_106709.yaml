  First, the core concept: the poem must embody the idea that a person is constituted by their roles and relations, not a pre-existing self that adopts roles. The pantoum's repeating lines should demonstrate how meaning shifts with context, mirroring how roles define us. 

  Key constraints:
  - Hospital setting with caregiver/parent
  - Must include the "standard objection" about lacking external moral standing
  - Avoid banned words (self, role, etc.)
  - No clichés or textbook quotes
  - Maintain conversational tone

  Hmm... The pantoum structure is perfect here - the way lines recur under new contexts will visually show how utterances belong to the relational space, not individuals. The dying parent scenario creates natural role tension: caregiver/child, responsibility/love, duty/loss.

  For the "standard objection", I'll use a disruptive line like "Is this cage or compass?" that reappears in different emotional contexts. The caregiver's exhaustion can voice the objection while the repetition shows how the question itself is shaped by the relationship.

  Avoiding banned words means showing relational constitution through concrete images: folded blankets, shared silence, hands adjusting pillows. The hospital setting provides strong sensory details - beeping machines, corridor lights - to ground abstract concepts.

  Voice balance is crucial. Too poetic risks sounding like Analects; too plain loses depth. I'll use medical mundanity ("this cup of bad coffee") alongside philosophical weight, letting fatigue show through sentence fragments.

  The ending must land the "constituted by caring" idea without stating it. Maybe the final recurrence of a line from the parent's perspective could imply continuity beyond death? Need to avoid Hallmark sentiment - no sudden gratitude, just complex presence in duty.

  Biggest challenge: making repetition feel organic rather than forced. Each recycled line must earn its new meaning through stanza context shifts. The "who speaks?" progression will trace how agency distributes across the relationship.
answer: |-
  Here's a brainstorm followed by the pantoum, crafted to your precise specifications:

  **Brainstorm:**

  *   **Core Action:** Show relational constitution through the *act* of caregiving, not description.
  *   **Form as Argument:** Pantoum's line recycling = utterances passing between relational positions, changing meaning with context. A line spoken *to* the parent becomes the caregiver's internal thought later, or perhaps echoes the parent's past voice.
  *   **Setting/Stakes:** Hospital corridor, bedside. Concrete details: beeping monitors, bad coffee, adjusting blankets, silence. Grounds the philosophy in visceral reality.
  *   **Voice:** Weary, attentive, grounded. Avoids grand pronouncements. Uses simple, often physical language ("shift the pillow," "cold cup," "waiting room light").
  *   **The Objection:** Must surface organically. A line expressing doubt, exhaustion, a sense of being trapped ("Is this cage or compass?", "This shape I didn't choose"). It recurs, gaining different shades (genuine question, bitter statement, resigned echo).
  *   **Philosophy Embodied:**
      *   The "I" emerges *in* the act of adjusting the blanket, listening.
      *   Lines belong to the relational space, not the individual. Who "owns" a recurring line? It becomes unclear, proving the point.
      *   Meaning shifts: "Your hand finds mine" (comfort) later becomes "Your hand finds mine" (recognition of fading connection?).
  *   **Avoid:** Banned words. Sentimental resolution ("lucky one"). Abstract nouns unless concretely framed. Textual references.
  * **Last Lines:** Land on presence in duty/connection, implying it *is* the person, not something added. Not epiphany, just continued being-there. A line originating with the caregiver might end up sounding like it comes *from* the parent or the space itself.
  * **Cut:** Anything overly lyrical, explanatory, or distant from the hospital's sensory reality. Any line that doesn't *earn* its repetition through contextual shift.

  **The Pantoum:**

  **Corridor Light**

  This cup of bad coffee going cold again.
  Your hand finds mine, a dry leaf on the sheet.
  The monitor insists its steady beat.
  This shape I didn't choose, begins to hold.

  Your hand finds mine, a dry leaf on the sheet.
  Shift the pillow, smooth the thin blanket's fold.
  This shape I didn't choose, begins to hold
  The quiet weight of hours, slow and deep.

  Shift the pillow, smooth the thin blanket's fold.
  Is this cage or compass? Who can say?
  The quiet weight of hours, slow and deep,
  Wears the path from doorway to this chair.

  Is this cage or compass? Who can say?
  The breath you take is work, is all you own.
  Wears the path from doorway to this chair –
  A space defined by leaning close to listen.

  The breath you take is work, is all you own.
  The monitor insists its steady beat.
  A space defined by leaning close to listen.
  This cup of bad coffee going cold again.

  **(Breakdown of Key Moves):**

  1.  **Opening:** Grounds in the mundane reality of waiting ("bad coffee," "monitor").
  2.  **Line Recycling:** "Your hand finds mine" starts as physical connection (Stanza 1). When it recurs in Stanza 2, it feels more observational, perhaps noticing frailty ("dry leaf"). "This shape I didn't choose" introduces the objection (burden/trap) in S1; when it recurs in S2, it starts to suggest the *formation* of the caregiver ("begins to hold").
  3.  **Objection Embodied:** "Is this cage or compass? Who can say?" (S3) is the core objection – is this duty trapping me or guiding me? Where is the "I" to judge? It recurs later (S4) with the added weight of "Who can say?", now feeling more resigned, less a question than an admission of the conundrum.
  4.  **Relational Constitution:** "A space defined by leaning close to listen" (S4) *shows* the self emerging *in* the relational act, without naming it. "The breath you take is work, is all you own" (S4) highlights the parent's existence reduced to effort, immediately juxtaposed with the caregiver's defining action ("leaning close").
  5.  **Meaning Shift:** "The monitor insists its steady beat" (S1: neutral fact) returns in the final stanza (S5) after the parent's labored breath is mentioned, potentially sounding more ominous or fragile. "This cup of bad coffee going cold again" (S1: immediate detail) closes the poem, now resonating with the cyclical, enduring nature of this defining care. It arrives "from" the opening, but the context of the entire journey gives it weight – it *is* the ongoing reality where this person exists.
  6.  **Voice & Ending:** Conversational, tired, concrete ("thin blanket," "doorway," "leaning close"). The ending avoids sentimentality, landing on the recurring, mundane act ("coffee cold again") which, through the poem's journey, embodies the continuous, constitutive act of care. The lines belong to the relational space now. Who is the "I" holding the cold cup at the end? It's inseparable from the role being lived. The objection ("cage or compass?") remains, woven into the fabric, unanswered but present.
