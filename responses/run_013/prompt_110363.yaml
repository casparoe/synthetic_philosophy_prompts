     **Solution:** The instructor should be the risk auditor. Or, if a student is assigned, provide a clear worksheet with formulas.

  5. **Problem:** Students might not understand the lottery descriptions.
     **Solution:** Use clear visual aids (pie charts, probability trees) and explain one example.

  **Final Activity Structure:**

  - **Materials:** Worksheet with the two situations (Situation 1: A vs B; Situation 2: C vs D) and a table for the certainty equivalent (if done).

  - **Roles:** Instructor as the risk auditor.

  - **Payoff:** Points converted to extra credit (e.g., 5000 points = 1 extra credit point, but cap at 5 points so they don't go wild). Or use a lottery to reward one student.

  - **Minute-by-Minute:**
    0-5: Intro and explain points.
    5-15: Students make choices for Situation 1 and Situation 2.
    15-20: Collect and tally choices (auditor reports the counts).
    20-40: **Optional (if time):** Elicit certainty equivalent for a fixed lottery (e.g., 10% chance of 0, 50% chance of 1000, 40% chance of 5000) using a choice list of 10 sure amounts (from 1200 to 2000 in steps of 100). Each student does this.
    40-45: Collect the certainty equivalents.
    45-90: Debrief.

    If skipping the certainty equivalent, then:
    20-90: Debrief (70 minutes for debrief).

  **Debrief Outline:**
  - Present the results: how many chose A in Situation 1? How many chose D in Situation 2? How many chose both? Note the violation of EU.
  - Introduce RWEU as an alternative model.
  - Explain the rank-dependent weighting: worst outcome gets extra weight.
  - Show the RWEU calculation for the Allais lotteries (with the formulas above).
  - Discuss the risk function: a convex r function (like r(p)=p^2) overweights low probabilities of the worst outcomes.
  - Contrast with EU: in EU, risk aversion is due to concave utility. In RWEU, it can be due to the risk function even with linear utility.
  - Mention that RWEU can explain the Allais paradox and other patterns.

  **What the activity cannot reproduce:** We did not show how to elicit the entire risk function. We also did not show how the risk function interacts with the utility function. We assumed linear utility in the explanation. In reality, both might be present. Also, we did not show how RWEU handles more complex lotteries. The instructor will have to explain these in the debrief.

  This activity should make the students feel the pull of both views: EU is intuitive and simple, but RWEU captures the Allais pattern which many people exhibit.
answer: |-
  Below is a detailed in-class activity designed to help students discover the difference between expected utility (EU) and risk-weighted expected utility (RWEU) through their own choices. The activity uses fictional points (redeemable for minor rewards like candy or extra credit) to avoid real money, focuses on lotteries with three outcomes to highlight rank-dependence, and includes a risk auditor role to compute implied risk functions.

  ---

  ### **Activity Overview**
  - **Title:** The Lottery Choice Challenge  
  - **Core Conflict:** Students confront choices where their risk aversion violates expected utility (independence axiom) but aligns with risk-weighted expected utility.  
  - **Key Mechanism:** Students rank lotteries; a risk auditor calculates their personal "risk function" from rankings before formal concepts are introduced.  
  - **Outcomes:** 0 points (worst), 50 points (middle), 100 points (best).  
  - **Materials:**  
    - Lottery choice worksheets (paper or digital).  
    - Calculator/spreadsheet for risk auditor.  
    - Visual aids (projector) for lottery descriptions.  

  ---

  ### **Step-by-Step Instructions**  
  #### **Phase 1: Introduction and Setup (10 minutes)**  
  - **0–3 min:** Introduce activity. Explain points system (e.g., 100 points = 1 candy/extra credit point; cap rewards to avoid excess).  
  - **3–7 min:** Describe three-outcome lotteries. Use a simple example:  
    - *Lottery:* 40% chance of 0 pts, 30% chance of 50 pts, 30% chance of 100 pts.  
    - Emphasize outcomes are ranked worst (0) to best (100).  
  - **7–10 min:** Assign roles. One student is the **Risk Auditor** (good at math; uses provided spreadsheet). Others are **Choosers**.  

  #### **Phase 2: Forced Choices to Elicit Risk Aversion (25 minutes)**  
  Students complete **two choice sets**. Each set has two lotteries (A/B or X/Y). Choices are designed so risk-averse preferences in Set 1 are EU-compatible, but Set 2 reveals an Allais-style EU violation.  

  - **Worksheet (Set 1: Safe vs. Risky)**  
    - **Lottery A:** 100% chance of **50 points**.  
    - **Lottery B:** 10% chance of 0 pts, 60% chance of 50 pts, 30% chance of 100 pts.  
    - *Task:* Choose A or B.  

  - **Worksheet (Set 2: Allais-Style Violation)**  
    - **Lottery X:** 5% chance of 0 pts, 95% chance of 50 pts.  
    - **Lottery Y:** 5% chance of 0 pts, 5% chance of 50 pts, 90% chance of 100 pts.  
    - *Task:* Choose X or Y.  

  **Predicted Choices (Rationale):**  
  - **Set 1:** Risk-averse students choose **A** (guaranteed 50) over B (same worst-case odds but riskier). This *is* EU-compatible.  
  - **Set 2:** Same students choose **Y** (90% chance of 100) over X (95% chance of 50). This violates EU’s independence axiom (common "bad outcome" of 5% chance of 0 is ignored).  

  #### **Phase 3: Ranking Lotteries to Elicit Risk Function (25 minutes)**  
  Students rank **four lotteries** with identical expected values (50 points) but different outcome spreads. Rankings reveal how they weight worst outcomes.  

  - **Lotteries to Rank (display visually; probabilities sum to 100%):**  
    - **L1:** 100% chance of **50 points** (safe).  
    - **L2:** 20% chance of 0 pts, 60% chance of 50 pts, 20% chance of 100 pts.  
    - **L3:** 40% chance of 0 pts, 20% chance of 50 pts, 40% chance of 100 pts.  
    - **L4:** 60% chance of 0 pts, 0% chance of 50 pts, 40% chance of 100 pts.  

  **Task:**  
  - Rank lotteries 1–4 from **most to least preferred** (e.g., 1 > 2 > 3 > 4).  
  - **Risk Auditor’s Role:**  
    - Collect rankings.  
    - For each student, compute the **implied risk function** using a simplified method:  
      1. Assign utilities: \( u(0) = 0 \), \( u(50) = 0.5 \), \( u(100) = 1 \) (linear scale).  
      2. Calculate each lottery’s RWEU using weights:  
         \[
         \text{RWEU} = \left[ r(1) - r(p_{\text{best}}) \right] \cdot u(\text{best}) + \left[ r(p_{\text{best}}) - r(p_{\text{best}} + p_{\text{middle}}) \right] \cdot u(\text{middle}) + \left[ r(p_{\text{best}} + p_{\text{middle}}) \right] \cdot u(\text{worst})
         \]  
         (Simplify: \( r(1) = 1 \), \( r(0) = 0 \); only \( r(0.4) \), \( r(0.6) \), \( r(0.8) \) needed for these lotteries).  
      3. Assume \( r(p) = p^c \) (power function). Solve for \( c \) that matches rankings (e.g., if L1 > L2 > L3 > L4, \( c > 1 \) implies risk aversion).  

  #### **Phase 4: Risk Auditor Report and Discussion (20 minutes)**  
  - **5 min:** Auditor shares anonymous results:  
    - % choosing A (Set 1) and Y (Set 2).  
    - Sample risk functions (e.g., "Student 3: \( r(p) = p^{1.5} \)").  
  - **10 min:** Debrief linking choices to theory:  
    - **Allais Pattern:** Show how Set 2 choices violate EU (common 5% chance of 0 is "canceled" in EU but overweighted in RWEU).  
    - **Risk Function:** Explain how \( r(p) \) transforms cumulative probabilities (e.g., convex \( r \) overweights worst outcomes).  
    - **Key Contrast:**  
      - EU: Risk aversion = concave utility.  
      - RWEU: Risk aversion = convex risk function (even with linear utility).  
  - **5 min:** Students guess what \( r(p) \) represents before formal definition.  

  #### **Phase 5: Formal Naming and Limitations (10 minutes)**  
  - **5 min:** Define **expected utility** and **risk-weighted expected utility** formally.  
  - **5 min:** Discuss **limitations of the activity:**  
    - The activity assumes linear utility; students must be told that RWEU *combines* risk functions with outcome utilities (e.g., \( u(x) \) can still be concave).  
    - Real-world RWEU uses cumulative transformations; the activity simplifies with discrete weights.  

  ---

  ### **Timeline Summary**  
  | Time          | Activity                                 |  
  |---------------|------------------------------------------|  
  | 0–10 min      | Intro, points system, role assignment.   |  
  | 10–35 min     | **Set 1 & 2 choices** (forced A/B, X/Y). |  
  | 35–60 min     | **Rank lotteries** L1–L4; auditor computes risk functions. |  
  | 60–80 min     | Auditor report; debrief choices/RWEU.    |  
  | 80–90 min     | Formal definitions; limitations.         |  

  ---

  ### **What Will Go Wrong (and Solutions)**  
  1. **Problem:** Students don’t grasp lottery probabilities.  
     **Solution:** Use visual aids (pie charts, probability trees). Do a practice lottery.  

  2. **Problem:** Risk Auditor calculations are slow.  
     **Solution:** Provide a spreadsheet template (Google Sheets) with pre-loaded formulas. Use a simple \( r(p) = p^c \) model.  

  3. **Problem:** Some students are risk-neutral, masking the effect.  
     **Solution:** Use aggregate data to show trends (e.g., 80% choose A and Y). Highlight outliers to discuss heterogeneity.  

  4. **Problem:** Rankings don’t yield clear risk functions.  
     **Solution:** Assume \( r(p) = p^c \); solve for \( c \) that minimizes ranking errors. Use common preferences (L1 > L2 > L3 > L4) as examples.  

  5. **Problem:** Confusion between risk aversion and loss aversion.  
     **Solution:** Emphasize outcomes are positive (0 = worst, not a loss). Debrief clarifies risk vs. outcome weighting.  

  ---

  ### **What the Activity Cannot Reproduce**  
  - **Utility-Risk Interdependence:** The activity fixes \( u(x) \) as linear to isolate the risk function. In reality, RWEU allows \( u(x) \) to be concave (e.g., diminishing returns) *and* \( r(p) \) to be convex. **You must clarify in debrief:**  
    > "Risk-weighted EU uses two components: a utility function for outcomes (like EU) *and* a risk function for probabilities. Today, we assumed linear utility to focus on risk. But rational agents might have both: for example, diminishing marginal utility *and* extra weight on worst-case scenarios."  

  This activity forces students to confront how their choices defy EU, reveals RWEU through rank-dependent weighting, and lets them infer risk functions—making the debate tangible before theory is named.
