answer: |-
  Here's a straight conceptual breakdown of convention types and their binding force, followed by the traveler analysis you requested, ending with a clear stance on the "bad convention" dilemma.

  **The Core Distinction: Coordination vs. Reliance Conventions**

  The phrase "it's just a convention" *does* equivocate. It conflates two fundamentally different structures:

  1.  **Coordination Conventions (Pure Arbitrary Equilibrium):**
      *   **Essence:** Solving a pure coordination problem where *any* consistent rule works, as long as everyone follows the *same* rule. The value is *solely* in predictability.
      *   **Arbitrariness:** This is inherent and defining. Driving on the left vs. right is the paradigm. Neither side is intrinsically "better"; the benefit comes from universal adherence to *one* side.
      *   **Harm of Violation:**
          *   **Direct:** Causes immediate confusion, inefficiency, or minor accidents *specifically because others are relying on the uniformity itself*. (e.g., Jaywalking unexpectedly on an empty street *could* cause a driver to swerve unnecessarily).
          *   **Indirect/Diffuse:** Each violation slightly erodes the habit of adherence, increasing the statistical risk of future coordination failures for everyone. This harm is probabilistic and spread across the population.
      *   **Binding Force:** Relatively weak, based on:
          *   **Collective Efficiency:** It's mutually beneficial to coordinate.
          *   **Avoiding Immediate Disruption:** Don't cause a specific hiccup right now.
          *   **Fairness in Burden-Sharing:** Don't free-ride on others' adherence while undermining it. This is the weakest link here because the "burden" of following (e.g., driving on the correct side) is usually trivial.
      *   **"Just a convention" Defense:** Makes sense here. It emphasizes the arbitrariness and argues that violating it without *immediate* harm-causing context (like jaywalking at 2am) is primarily an inefficient disruption of a useful system. The defense rests on the collective good of coordination.

  2.  **Reliance Conventions (Structure-Dependent Practices):**
      *   **Essence:** Practices embedded within a larger social or economic structure where individuals reasonably depend on others' adherence for specific, tangible outcomes (often well-being or fairness). The value isn't *just* predictability; it's enabling the structure itself.
      *   **Arbitrariness:** **Not inherent.** While the *specific form* might be somewhat arbitrary (e.g., 15% vs. 18% tip), the *existence and core function* of the practice are dictated by the underlying structure it serves. Tipping in the US exists *because* of the sub-minimum wage for tipped workers. It's not arbitrary like driving sides; it's a specific solution to a specific distributional problem.
      *   **Harm of Violation:**
          *   **Direct & Specific:** Causes concrete, foreseeable harm to identifiable individuals whose expectations and circumstances are shaped by the convention. The server relies on tips for their livelihood. The person behind you in line relies on turn-taking for their fair shot.
          *   **Indirect:** Can also erode the system, but the primary harm is the direct impact on the reliant party.
      *   **Binding Force:** Stronger, based on:
          *   **Avoiding Direct Harm:** You have a duty not to harm others, especially when they are vulnerable to your choices within an established system.
          *   **Fairness:** Within the system, it's unfair to benefit from others fulfilling their role while shirking yours (e.g., benefiting from the server's labor while dodging the payment mechanism that compensates them).
          *   **Preventing Exploitation:** Violating reliance conventions often exploits the vulnerability created by the system itself (e.g., the server's dependence on tips).
      *   **"Just a convention" Defense:** **Falls apart here or is misleading.** Defending tipping *only* as a "convention" ignores its role as a structural necessity for the server's income. It tries to reduce a reliance-based duty (don't deprive someone of earned wages) to a weaker coordination duty (don't disrupt the system). This masks the specific harm to a specific person.

  **The Line Example:** This *blends* elements but leans heavily towards **Reliance**. While the *order* might be arbitrary (who got there first), the *practice of queuing* solves a problem of distributive fairness. The person immediately behind you has a specific, reasonable expectation based on your position that you will take your turn and they will get theirs next. Violating this directly wrongs *them* by unfairly jumping ahead. The harm is specific, not just diffuse disruption. The "reliance" is on the fairness mechanism, not just the coordination.

  **The Traveler's Dilemma: Applying the Reasons**

  As a short-term visitor not embedded in the local culture's historical practices, the reasons for adhering to conventions apply differently:

  1.  **Coordination Reason (Survives Strongly):**
      *   **Why:** Your visible nonconformity *directly* disrupts the local equilibrium. You create confusion, inefficiency, or immediate minor risks (e.g., standing on the "wrong" side of an escalator, using unfamiliar gestures causing misunderstanding, violating a simple traffic norm). You benefit *right now* from the system working (smooth traffic, orderly queues, predictable interactions) and actively undermine it by not conforming. This is a strong obligation to avoid being a disruptive force.
      *   **Binding Force for Visitor: High.** Your actions have direct, negative consequences *now*.

  2.  **Reciprocity / Fair-Play Reason (Survives Conditionally):**
      *   **Why:** The key question is: **Are you *currently* benefiting from the system sustained by this convention?** If yes, fairness dictates you contribute to its maintenance by adhering.
      *   **Examples:** Using public infrastructure (roads, sidewalks) maintained by coordination conventions? Riding a bus that operates efficiently due to queuing norms? Eating in a restaurant that functions because of local service conventions? Yes, you benefit *now*.
      *   **Binding Force for Visitor: Medium.** You haven't benefited historically, nor will you benefit long-term. But *during your stay*, you are a beneficiary of the system. Free-riding (benefiting without adhering) is unfair to those sustaining it for you *right now*. The strength depends on the significance of the benefit and the burden of adherence. (Following driving rules? High. Adopting complex local greetings perfectly? Lower).

  3.  **Specific Reliance / Harm Avoidance Reason (Survives Strongest):**
      *   **Why:** This transcends your visitor status. The duty not to directly harm identifiable individuals remains paramount. If a local convention exists within a structure where individuals rely on adherence for their well-being or fair treatment, violating it harms *them*, regardless of your background or duration of stay.
      *   **Binding Force for Visitor: Highest.** This is a core moral duty: don't cause foreseeable, direct harm to others. Ignorance *might* be an excuse initially, but once you understand the reliance structure (e.g., tipping wages, specific queue expectations with consequences), the obligation is clear and strong.

  **The Uncomfortable Case: Bad Conventions**

  > "Is 'you're a guest, so you follow it' a moral claim, or is it etiquette wearing a moral costume?"

  **It is primarily etiquette wearing a moral costume, *unless* your refusal directly harms specific individuals relying on the convention within its current structure.**

  *   **The Etiquette Argument:** "When in Rome..." is about respect, avoiding offense, smooth social functioning, and not imposing your values. This is valid *for coordination conventions and norms of respect that don't cause direct harm*. Wearing modest dress in a conservative culture (even if you disagree with the norm) avoids causing offense/disruption. Using local greetings shows respect. This is etiquette, not deep morality.
  *   **The Moral Mask:** Applying "you're a guest, so you follow it" to **reliance conventions you find exploitative or immoral** is where it becomes problematic. It conflates respect for a culture with complicity in harm.
  *   **The Moral Core:** Your primary duty is **to avoid causing harm to individuals**. If adhering to a convention means directly participating in or enabling something you believe is exploitative (e.g., a tipping system you see as letting employers off the hook, a norm requiring deference you see as demeaning to a group) or harmful, the "guest" argument is weak.
  *   **Navigating the Conflict:**
      1.  **Assess Reliance/Harm:** *Who* is harmed if you don't participate? Is it diffuse/systemic harm (coordination), or direct harm to vulnerable individuals (reliance)? (e.g., Not tipping *directly harms the server* in the US system, regardless of your views on the system).
      2.  **Can you Refuse Without Harm?** Can you avoid the situation? Can you express your objection respectfully without undermining someone's livelihood or causing them direct unfairness *within the existing system they are trapped in*?
      3.  **Prioritize Harm Avoidance:** If adhering prevents direct, immediate harm to a specific person (like stiffing a server), you likely have a moral obligation to adhere *in that moment*, even while working to change the system long-term. Your protest shouldn't land on the most vulnerable person.
      4.  **Refuse Strategically:** If the harm is more systemic or the reliance is weak, refusing *might* be justified. Target the source of the problem (employers, authorities) rather than punishing individuals reliant on the norm. Explain your reasons respectfully if appropriate.

  **The Straight Answer:**

  "Because you're a guest" is **not a sufficient moral reason** to follow a convention you believe is inherently bad, exploitative, or harmful. **Your fundamental moral duty is to avoid directly harming individuals.** If following the convention is necessary to prevent *direct, specific harm* to identifiable people who are relying on it within the current structure (like a server needing tips), you should probably follow it, even as a visitor objecting to the system. However, if the convention is primarily coordination-based or symbolic, and your refusal avoids direct harm to individuals (though it might cause offense or disruption), you have greater moral latitude to refuse based on your principles. "Guest" status emphasizes respect and minimizing disruption, but it doesn't override the core duty of non-maleficence towards specific persons.
