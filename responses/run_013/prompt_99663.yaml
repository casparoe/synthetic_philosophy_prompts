prompt: |-
  I'm in a reading group that's been grinding through the causation-by-ommission literature and I keep hitting the same wall, so I want a real conceptual explanation rather than a survey of positions. My puzzle: a lifeguard who's asleep and doesn't notice a swimmer going under, versus a bystander on the beach who can't swim and also doesn't go in — both are omissions, both are counterfactually tied to the death in exactly the same way, so why is it only the first that feels like the cause? Explain how the standard machinery is supposed to handle this: why event-based theories of causation struggle even to state what an omission-cause is, why bare counterfactual dependence is too permissive here (the symmetry problem, where every other non-swimmer counts equally as a cause), and how tying omission-causation to violated norms or expectations is meant to do the selecting. Then press hard on that last move — is it doing genuine causal work or just redistributing blame, and what does it say about a case where there's no norm and no expectation at all, like an automated braking system that stayed silent because braking had been disabled by design and a pedestrian died? Say how confident you are in each part and flag the claim you're least sure of.
reasoning: |-
  Okay, let me tackle this user's query. They're in a reading group struggling with causation by omission, specifically the lifeguard vs. bystander case. They want a conceptual explanation, not just a survey. The key puzzle is why the lifeguard's omission feels causal but the bystander's doesn't, despite identical counterfactual dependence.

  First, I need to break down why event-based theories struggle here. Events are like concrete occurrences, but omissions are absences. How do you point to something that didn't happen? That's a problem for theories relying on spatiotemporal locations. The user mentioned the symmetry problem too—every non-swimmer becomes a cause if we only use counterfactuals. So counterfactual dependence alone is too broad.

  Next, the norm-based approach. The lifeguard has a duty, so their inaction violates a norm. The bystander doesn't have that duty. But the user is skeptical: is this really about causation or just blame? They also bring up the automated braking system case where there's no norm. That's a challenge. How does normativity handle scenarios without social roles?

  I recall Schaffer's contrastive approach. Maybe adding context helps. The lifeguard's omission is salient against their role, while the bystander isn't. But in the automated case, the system is designed not to brake. Here, the norm is designed function vs. actual design. If the system was meant to brake but was disabled, that's different from being designed without brakes. The user probably wants to see if normativity can still apply without human expectations.

  My uncertainty is highest around normativity's role in causation. Am I conflating cause with responsibility? The braking case tests this. If the system wasn't supposed to brake, does its inaction cause the death? Counterfactually, yes—if it braked, the pedestrian lives. But without a norm, it's symmetric to any non-braking system. The user's deeper need might be understanding if causation is objective or if normativity is essential for omissions.

  I should emphasize that norm-based solutions are pragmatic but may not resolve metaphysical issues. The user's confidence question: I'm least sure about normativity doing causal work versus assigning blame. The braking case without norms exposes this. Maybe contrastivism helps, but it's still context-dependent. The user might be seeking whether causation by omission is purely metaphysical or involves pragmatic elements. Highlighting the spectrum from counterfactuals to norms, and admitting where it's fuzzy, would be honest.
answer: |-
  This is a fantastic and notoriously thorny puzzle – the "asymmetry of omissions" problem. Let's break it down step-by-step, hitting the conceptual core and pressing hard on the normativity move.

  **1. The Core Symmetry Problem (Why Counterfactuals Fail):**

  *   **The Setup:** Both the lifeguard (LG) and the non-swimming bystander (BY) *omit* to save the swimmer (S). The death (D) counterfactually depends on both omissions:
      *   If LG *had* acted (been awake and rescued), D would not have occurred.
      *   If BY *had* acted (somehow magically rescued despite inability), D would not have occurred.
  *   **The Challenge for Event-Based Theories:** Traditional theories (e.g., Davidsonian) define causation as a relation between *events* (concrete, dated occurrences). Omissions are *absences* of events. How can an absence *be* an event? What's its spatiotemporal location? (Is it located where the lifeguard *should have been* acting? Where the swimmer drowned? Everywhere someone *didn't* act?) This makes stating that an omission *caused* an event conceptually awkward or impossible within a purely event-ontology framework.
  *   **The Challenge for Bare Counterfactual Theories (e.g., Lewis):** Counterfactual dependence alone *is* symmetric: D depends on both LG's omission and BY's omission. But this leads to absurdity – **the Problem of Proliferation.** If BY's omission causes D, then so does the omission of *every other person on Earth* who didn't save S. The omission of the President, the Queen, you, me... all equally "cause" S's death. This violates strong intuitions about causation being selective and explanatory. Bare counterfactual dependence is far too permissive for omissions. This is the **Symmetry Problem** you mentioned.

  **2. The Norm/Expectation Move (The Proposed Solution):**

  The standard move to break the symmetry is to invoke **normative or expectational contexts.** Here's how it works conceptually:

  *   **Selection via Salience:** Not all counterfactual dependencies are causally relevant. What makes LG's omission salient and BY's not is the presence of a **norm, duty, expectation, or function** specifically assigned to LG.
      *   The LG has a *role-based duty* to monitor and rescue. Their omission constitutes a *failure* to fulfill this duty.
      *   The BY has no such duty or expectation placed upon them. Their inaction is merely "normal" or "neutral" background behavior.
  *   **Causal Relevance vs. Mere Dependency:** The norm/expectation acts as a filter. It selects *which* counterfactual dependencies correspond to genuine *causal relevance*. LG's omission is a *deviation* from the expected/normative course of events relevant to S's safety. BY's omission is *part of* the expected/normative background against which events unfold. Causation tracks *deviations* from what *should* or *was expected to* happen in the specific context.
  *   **Why it "Feels" Causal:** Our intuitive ascriptions of causation are deeply intertwined with expectations about how agents *should* behave or systems *should* function. LG's omission *explains* the death in a way BY's does not *because* it violated a norm specifically designed to prevent such deaths. It's a *relevant* deviation.

  **3. Pressing Hard on the Normativity Move:**

  This move solves the practical problem of selection but raises deep philosophical questions:

  *   **Genuine Causation or Blame Redistribution?**
      *   **Critique:** This seems like sleight of hand. We haven't *found* a causal difference in the world; we've just *projected* our social or moral judgments onto the situation. We're confusing *causal responsibility* with *moral/role responsibility*. The counterfactual dependency is identical. The normativity tells us who *should have* acted and is *blameworthy*, but does it tell us who/what actually *caused* the death? The drowning seems caused by the swimmer's cramp, the water, gravity – positive events and forces. The LG's omission is a condition that allowed this causal process to proceed, but is it itself a *cause*? Calling it a cause feels like blaming dressed up as metaphysics.
      *   **Defense:** Proponents argue causation *isn't* just "out there" in the fundamental physics. Causation as we use it (especially in law, ethics, explanation) is inherently perspectival and interest-relative. Norms/expectations are part of the context that fixes the relevant *contrast classes* and *modal space*. For LG, the relevant alternative is "acting as per duty"; for BY, it's not. This makes LG's omission genuinely *explanatorily relevant* in a way BY's is not, relative to our concerns. It *is* doing causal work within our framework of understanding agency and responsibility.

  *   **The Automated Braking System (ABS) Test Case:**
      *   **Setup:** ABS is *designed* to be disabled under condition X (e.g., driver override, specific sensor failure mode). Condition X occurs, ABS stays silent (doesn't brake), pedestrian (P) is hit and dies.
      *   **Counterfactual Dependence:** If ABS *had* braked (despite being disabled by design), P would not have died. Symmetric with any other non-braking system (e.g., the car's radio not braking).
      *   **Norm/Expectation?:** There is *no* violated human norm or expectation *in this scenario*. The system behaved *exactly as designed* when X occurred. Silence was the normative, expected outcome. No one *should have* expected braking.
      *   **The Challenge:** Does the ABS's omission (not braking) cause P's death?
          *   **Normativity Move Says:** Likely *No*. Since there was no expectation/norm for it to brake *in this specific circumstance*, its silence is part of the background. The cause is the driver hitting the accelerator instead of the brake, the pedestrian stepping out, etc. The ABS's state is a condition, not a cause.
          *   **But...:** This feels deeply counterintuitive to many! If the ABS *could* have braked (the capacity was physically present) and *would* have prevented the death *if it had been active*, its inactivity seems causally relevant. We might blame the *design choice* to disable it, but that's different. If we imagine a *faulty* ABS that failed to brake *against* its design spec when it *should* have, *then* the normativity move would call *that* omission a cause. The *physical situation* (ABS silent, P hit) might be identical in both cases! The normativity seems to be doing *all* the work in distinguishing "cause" from "non-cause" for the identical physical omission.

  **4. My Confidence & Least Sure Claim:**

  *   **Confident In:**
      1.  **The Failure of Bare Counterfactuals:** Bare counterfactual dependence is utterly insufficient for omission causation due to the Problem of Proliferation. (High Confidence)
      2.  **The Struggle of Event-Based Theories:** Defining omissions as genuine events within a sparse event ontology is deeply problematic and likely a major reason for the struggle. (High Confidence)
      3.  **The Normativity Move as *the* Standard Solution:** This *is* how the literature (Schaffer, Hitchcock, Hall, many others) primarily attempts to resolve the asymmetry. It *does* successfully capture our intuitive judgments in cases like LG vs. BY, doctor vs. random passerby, etc. (High Confidence that this *is* the move, and that it *works* pragmatically for many cases involving agents and roles).

  *   **Less Confident In:**
      1.  **The Metaphysical Status of Omission-Causation:** I'm deeply torn on whether normativity reveals a *genuine causal structure* in the world relative to our interests or *merely* overlays a responsibility structure onto a causal picture that fundamentally only includes positive events and counterfactual dependencies. (Moderate-Low Confidence in a definitive answer).
      2.  **The ABS Case Outcome:** While the strict normativity move suggests the ABS omission *isn't* a cause, this feels unstable. Maybe we need a broader notion of "function" beyond social norms? (e.g., the ABS *has the function* to brake for pedestrians; its design *exploits* this function but *prevents* its execution in X; its silence is still a *failure of its function* relative to its *type* even if not a failure *in this token instance*). I'm less confident that pure design-intent normativity fully resolves the causal intuition here. (Low Confidence that the normativity move *cleanly* handles all non-agent cases).
      *   ***Least Sure Claim:*** **That normativity is doing *purely causal* work rather than *explanatory/blame* work in the ABS case.** This is the crux. In the LG case, the norm (duty) feels tightly coupled to the causal mechanism (rescue ability + role). In the ABS case, the norm (design intent) feels external. Can we have genuine omission-causation *without* any norm or expectation? If not, is causation by omission *always* normative? If yes, how do we select *which* omission is the cause without norms? **This is the claim I'm least sure of: whether normativity is an essential *part* of the causal relation for omissions or just a *heuristic* for assigning responsibility against a backdrop of counterfactual dependencies.**

  **Conclusion:**

  The asymmetry (LG causes, BY does not) arises because causation for omissions isn't *just* counterfactual dependence; it requires **causal relevance.** Norms, duties, and expectations provide the framework that makes one omission (LG's) a **relevant deviant condition** and the other (BY's) merely **normal background.** This solves the proliferation problem *in practice* for agent-centric cases. However, it blurs the line between causation and responsibility/perspective. The ABS case exposes the fragility of this move, suggesting that "cause" for omissions might be inherently normative or perspectival. While confident this *is* the standard machinery and *why* it's needed, I'm least confident that invoking normativity fully resolves the *metaphysical* puzzle of how an absence can be a genuine cause, especially in non-normative scenarios. The debate remains fiercely alive precisely because this tension is fundamental.
