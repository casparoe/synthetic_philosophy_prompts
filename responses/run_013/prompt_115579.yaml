  I'm in a seminar on early modern ethics and this week we're on Hume's essay on suicide, the one where he runs through the three kinds of duty an act could violate — to God, to our neighbour, and to ourselves. For my discussion post I dont want to just summarise; I need to actually rate the arguments. So rank his three by how much force they'd have against a modern religious objector who thinks God literally owns your life, score each out of 10, and give me the main weakness in a sentence each. Then I want to bolt on an argument I think he missed: we already treat it as fine, even admirable, to shorten your own life for a cause or a person you love — soldiers, firefighters, parents — so denying that same latitude to someone who wants out for their own reasons starts to look like specail pleading. Where does that one land in the ranking, above or below his three, and why? I'd rather have real scores than hedging.
