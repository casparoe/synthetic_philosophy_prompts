  - Not specifying what the formalism actually guarantees
  - Vagueness about where the assumption relocates
  - Failure to engage with finite vs asymptotic

  I'll use British English throughout. The question should present the U/U* case clearly while being exam-suitable. The model answer should demonstrate depth without citations - perfect for a strong masters student. For the marking scheme, I'll allocate points to each conceptual move and note typical failures concisely.

  This approach should force students beyond regurgitation while blocking both the "it's derived" and "it's subjective" lazy answers. The U/U* concrete example makes the abstraction tangible.
answer: |-
  ### 1. Exam Question (25 marks, 90 minutes)  
  **Critically evaluate the claim that Kolmogorov complexity provides an objective basis for Occam’s razor. Your answer must address the following scenario:**  
  > Fix a universal Turing machine \(U\). Construct a rival machine \(U^*\) which is identical to \(U\) except for a precomputation table: this table contains 1,000 specific data sets \(D_1, \dots, D_{1000}\), each paired with a very short program (e.g., 10 bits) that outputs it. \(U^*\) uses these programs only for these exact data sets. For all other inputs, \(U^*\) runs identically to \(U\) but incurs a fixed overhead of \(c\) bits (where \(c\) is the size of the table’s encoding). Thus, for any data set \(D_i\), \(K_{U^*}(D_i) \leq 10\), while \(K_U(D_i)\) may be arbitrarily large.  
  >   
  > **Assume:**  
  > - \(U\) and \(U^*\) are both universal machines.  
  > - \(c\) is large (e.g., \(10^6\) bits) but finite.  
  > - We observe a finite data set \(D\), which may or may not be in \(U^*\)’s table.  

  **In your response:**  
  (a) Precisely state what Solomonoff induction or Kolmogorov complexity *does* formally provide (e.g., priors, invariance theorems).  
  (b) Using the \(U\)/\(U^*\) contrast, analyse whether "shortest program" inferences for finite \(D\) are machine-independent.  
  (c) Discuss whether asymptotic guarantees (e.g., prediction convergence) resolve this dependence for real-world inference.  
  (d) Conclude: does this framework objectively vindicate Occam’s razor, relocate its subjectivity, or neither? If relocated, specify *where* the subjectivity now lies.  

  ---

  ### 2. Model Answer (600 words)  
  The standard argument—that shorter programs are a priori more probable under Solomonoff’s prior—is merely the starting point. While Kolmogorov complexity rigorously formalises "simplicity" via program length, its objectivity for finite data is illusory, as the \(U\)/\(U^*\) scenario demonstrates.  

  **(a) Formal apparatus**  
  Solomonoff induction assigns a prior \(P_U(h)\) to hypothesis \(h\) (as a program) proportional to \(2^{-K_U(h)}\), favouring shorter programs. The *invariance theorem* states that for any two universal machines \(U\) and \(U'\), \(|K_U(x) - K_{U'}(x)| \leq c_{U,U'}\) for all \(x\), where \(c_{U,U'}\) is a constant dependent only on the machines. This implies asymptotic convergence: as data size \(n \to \infty\), the Bayes-optimal predictor under \(P_U\) and \(P_{U'}\) will agree.  

  **(b) Machine-dependence for finite data**  
  The invariance theorem’s additive constant \(c\) is pivotal. In the \(U\)/\(U^*\) case, \(c \approx 10^6\) bits. For any \(D_i\) in \(U^*\)’s table, \(K_{U^*}(D_i) \leq 10\), while \(K_U(D_i)\) could be \(> \!\! 10^6\). Thus, \(D_i\) appears "simple" under \(U^*\) but "complex" under \(U\). Crucially, \(U^*\) is not cheating; it exploits universality to reward arbitrary data sets with low complexity. Conversely, for a data set \(D_j \notin U^*\)’s table, \(K_{U^*}(D_j) = K_U(D_j) + c\), so \(U^*\) penalises all other data by \(c\) bits. Hence, for *finite* \(D\), the "simplest" hypothesis depends entirely on the choice of machine. The constant \(c\) is not a minor quirk—it can exceed the complexity of any observed data, making complexity ordering arbitrary.  

  **(c) Asymptotic guarantees vs. real-world inference**  
  Asymptotic convergence does not rescue objectivity for finite cases. While Solomonoff predictors under \(U\) and \(U^*\) will converge as \(n \to \infty\), this is irrelevant for inference "on Tuesday":  
  - The constant \(c\) can be larger than all practical data sizes. For \(n < c\), \(U\) and \(U^*\)’s priors are effectively unrelated.  
  - Convergence requires observing *all* data generated by the true hypothesis. In practice, we never reach this limit; a hypothesis favoured by \(U^*\) due to its table might require astronomical time to be overtaken by \(U\)’s preferences.  
  Thus, asymptotic results provide no guidance for finite-data model selection.  

  **(d) Conclusion**  
  Kolmogorov complexity does not objectively vindicate Occam’s razor; it relocates subjectivity to the choice of universal machine. The formalism replaces "simplicity is objective" with "simplicity is *machine-relative*". For finite data, the additive constant \(c\) allows radically different simplicity orderings across equally valid machines. Crucially, no formal principle dictates which machine we "should" use—this choice is extramathematical, depending on pragmatic or epistemic preferences (e.g., which regularities we deem natural). While Solomonoff induction remains a powerful framework for idealised agents, its objectivity is asymptotic only. For empirical science, Occam’s razor inherits subjectivity from the unconstrained choice of \(U\).  

  ---

  ### 3. Marking Scheme (25 total)  
  **Essentials for first-class marks (21–25):**  
  - **a1.** Correctly states Solomonoff prior: \(P_U(h) \propto 2^{-K_U(h)}\) (1 mark).  
    *Typical miss: Omits exponential form or confuses with description length.*  
  - **a2.** Clearly articulates invariance theorem: \(|K_U(x) - K_{U'}(x)| \leq c_{U,U'}\) (2 marks).  
    *Typical miss: Says complexities are "similar" without stating additive constant.*  
  - **a3.** Notes that \(c\) is machine-dependent and fixed (1 mark).  
    *Typical miss: Calls \(c\) "negligible" or confuses it with program overhead.*  
  - **b1.** Calculates \(K_{U^*}(D_i) \leq 10\) vs. \(K_U(D_i)\) large for table entries (2 marks).  
    *Typical miss: Asserts difference but doesn’t quantify using given parameters.*  
  - **b2.** Calculates \(K_{U^*}(D_j) = K_U(D_j) + c\) for non-table data (2 marks).  
    *Typical miss: Overlooks the \(c\)-bit penalty for non-table data.*  
  - **b3.** Argues that for \(|D| < c\), simplicity orderings can be reversed (e.g., \(U\) and \(U^*\) disagree on which \(D_i\) is simplest) (3 marks).  
    *Typical miss: Claims invariance holds for large \(D\) but misses small-data inversion.*  
  - **c1.** Explains why asymptotic convergence is irrelevant for finite \(n\): e.g., \(c\) exceeds \(n\), true hypothesis not identified pre-asymptopia (3 marks).  
    *Typical miss: Recites convergence theorem without critiquing its applicability.*  
  - **d1.** Concludes subjectivity is relocated to choice of \(U\) (2 marks).  
    *Typical miss: Vaguely says "it’s subjective" without locating source.*  
  - **d2.** Identifies machine choice as extramathematical (e.g., no formal justification) (2 marks).  
    *Typical miss: Suggests we "choose \(U\) for practicality" but misses epistemic implications.*  
  - **d3.** Refutes both lazy answers: rejects "objective razor" (via U/U*) AND rejects "mere taste" (via asymptotic objectivity) (2 marks).  
    *Typical miss: Only addresses one extreme.*  

  **Structure & Clarity (5 marks):**  
  - Coherent progression from formalism (a) to U/U* critique (b) to asymptotics (c) to conclusion (d) (3 marks).  
  - Precision about constants/data sizes (e.g., "\(c = 10^6\) bits", "\(n < c\)") (2 marks).  

  **Penalties:**  
  - \(-3\) if answer ignores the U/U* construction.  
  - \(-2\) if "additive constant" not discussed in (b) or (c).  
  - \(-2\) if conclusion does not specify relocation to machine choice.  

  ---  
  **British English note**: Spelling, grammar, and terminology (e.g., "programme" for non-computing contexts) adjusted throughout per request.
