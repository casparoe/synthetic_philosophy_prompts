answer: |-
  Here’s a targeted critique of the "ethics-first" reading of Keynes, structured into 9 escalating questions with concrete follow-ups. I’ve anchored each in specific texts/contexts beyond *Grandchildren* to force engagement with tensions in her thesis.

  **Strengths of Her Reading:**  
  - Persuasive on Keynes’s early philosophical foundations (Moore’s *Principia Ethica*, "Miscellanea Ethica").  
  - Strong on Bloomsbury’s influence re: aesthetic experience/intimacy as constitutive of the good life.  
  - Correct that *technical* mechanisms (e.g., liquidity preference, multiplier) serve *social ends*.

  **Thinnest Grounds:**  
  - Underplays Keynes’s *pragmatic* shift post-1920s: ethics bends to political necessity.  
  - Neglects his later writings where "character" concerns recede (e.g., *How to Pay for the War*).  
  - Avoids the unresolved tension between universal ethics and his reliance on elite stewardship.

  ---

  ### Questions & Follow-Ups (Ordered Escalation)

  1. **On Instrumental vs. Moral Harm of Scarcity**  
     *"In ‘Economic Possibilities’, Keynes calls scarcity a ‘disgusting morbidity’ – but in his 1933 lecture ‘Poverty in Plenty’, he argues the ‘economic problem’ corrupts by forcing us to ‘overvalue’ economic goods. Is this corruption (ex: money-getting as habit) purely instrumental for him, or does scarcity actively deform character as a moral harm in itself?"*  
     → *Likely Answer:* She’ll cite his moral disgust at scarcity’s psychological effects.  
     **Follow-up:** *"If scarcity deforms character, why does Keynes (in ‘The End of Laissez-Faire’) trust ‘avarice’ to drive capital accumulation during transition? Doesn’t that imply he sees avarice as *neutrally* instrumental – contradicting the ‘deformation’ claim?"*

  2. **The "Meantime" Morality & Perpetual Transition**  
     *"Keynes accepts ‘avarice’ temporarily to escape scarcity, but his 1945 NDEA memo warns full automation may take 100+ years. If ‘the meantime’ spans generations, does his two-tier morality (transition vs. post-scarcity) collapse? Can virtue be indefinitely postponed?"*  
     → *Likely Answer:* She’ll argue the goal justifies transitional compromises.  
     **Follow-up:** *"In ‘Am I a Liberal?’ (1925), Keynes calls capitalism ‘absolutely irreligious’ – yet he relies on its motives for decades. If the transition requires perpetuating ‘irreligious’ incentives, doesn’t that corrupt the ethical endpoint itself?"*

  3. **Class & the Unseen Drudgery**  
     *"Keynes’s ‘good life’ (art, leisure, intimacy) in Bloomsbury depended on domestic servants – a drudgery class. In ‘Economic Possibilities’, he assumes automation eliminates *all* unpleasant labor. Given 1930s tech, was this a utopian blind spot? If drudgery persists, is his ethics parasitic?"*  
     → *Likely Answer:* She’ll note he idealized automation’s potential.  
     **Follow-up:** *"But in ‘National Self-Sufficiency’ (1933), he advocates ‘dignified’ work like gardening – yet his circle paid others to garden. If ‘dignified work’ is optional for elites but mandatory for others, does that undermine his ethics as a universal ideal?"*

  4. **States of Mind vs. Practices (The Moorean Hangover)**  
     *"Keynes praised Moore for valuing ‘states of mind’ (love, beauty), but his policy work (e.g., Arts Council) funded *activities* (theatre, painting). When he advocates ‘living wisely’, is this a contemplative state or a practice? Does ‘activity’ supersede Moorean passivity in his mature thought?"*  
     → *Likely Answer:* She’ll cite his emphasis on active appreciation.  
     **Follow-up:** *"In a 1938 letter, he calls ‘the good life’ managing ‘one’s life as a whole’ – a *practical* skill. Given this, why does he still frame virtue in *Grandchildren* as ‘devoting our energies to non-economic purposes’ – implying passivity? Is there an unresolved tension?"*

  5. **The Vacuum of Purpose Post-Scarcity**  
     *"Keynes mocks those who fear leisure (‘we have been trained too long to strive’). But his own workaholism (e.g., collapsing during Bretton Woods) suggests striving was *constitutive* of his identity. Does his life contradict his theory? Or is his anxiety about idle-rich decadence (e.g., criticizing rentiers) an admission that solving scarcity creates new ethical risks?"*  
     → *Likely Answer:* She’ll call his overwork a personal failing, not theoretical.  
     **Follow-up:** *"In ‘Economic Possibilities’, he admits humanity’s ‘permanent problem’ will be using freedom ‘wisely’. If his own elite (Bloomsbury) often failed at this – falling into ennui – why should we trust his vision? Does solving scarcity *require* an ethics he never developed?"*

  6. **Elitism vs. Democratic Ethics**  
     *"Keynes trusted an intellectual ‘vanguard’ (e.g., Cambridge Apostles) to define the good life. When he writes in ‘Grandchildren’ that ‘we’ (educated elites) must teach virtue, doesn’t this concede his ethics aren’t self-evident? If the good life requires elite stewardship, is it truly universal?"*  
     → *Likely Answer:* She’ll argue he believed in educable human potential.  
     **Follow-up:** *"But his 1926 essay ‘Clissold’ mocks the public’s ‘dim’ desires for ‘triviality’. If he’s pessimistic about mass tastes, does his ethical project reduce to preserving high culture via technocrats – a far cry from universal flourishing?"*

  7. **The Retreat from Character in Policy**  
     *"Pre-1930, Keynes attacked ‘love of money’ as pathological. Post-1930, his policy prescriptions (easy credit, stimulus) *leveraged* pecuniary motives without reforming them. Does this imply ethics became decorative – a veneer over technocratic pragmatism?"*  
     → *Likely Answer:* She’ll argue policy was a necessary means.  
     **Follow-up:** *"In the 1943 Treasury memo on post-war employment, he prioritizes full employment over ‘moral reformation’. If ‘the meantime’ demands suspending ethics indefinitely, is his moral core just vestigial?"*

  8. **Is Scarcity’s Corruption Reversible?**  
     *"Keynes claims in ‘Grandchildren’ that scarcity’s ‘habits’ will fade once abundance arrives. But his own theory (e.g., liquidity preference) posits *innate* psychological drives (uncertainty-aversion, short-termism). If these drives sustain ‘avarice’, how can abundance erase them? Isn’t he contradicting his psychology?"*  
     → *Likely Answer:* She’ll argue institutions shape drives; abundance changes context.  
     **Follow-up:** *"Yet in *The General Theory*, he calls money’s allure tied to ‘our desire to hold Wealth as such’ – an ‘innate urge’. If this urge persists post-scarcity, won’t new forms of competitive accumulation emerge, sabotaging the good life?"*

  9. **The Unanswered Question of Virtue’s Content**  
     *"Keynes rejects Benthamite calculation and Christian asceticism, but offers no positive rules for ‘wise’ living beyond vague Bloomsbury ideals. When pressed (e.g., 1945 BBC debate), he defers to ‘experts’. If his ethics lack concrete content, are they more than a critique – and does this vacuum doom the project?"*  
     → *Likely Answer:* She’ll argue he favored pluralism, not dogma.  
     **Follow-up:** *"But pluralism requires a framework to resolve conflicts (e.g., art vs. environment). By rejecting *all* ‘rules’ (Moorean intuitionism), didn’t Keynes leave his ethics powerless against consumerism’s trivial pleasures – the very decadence he feared?"*

  ---

  **Why this order?** Starts with textual tension (#1), escalates to structural contradictions (#2-5), exposes class/elitism flaws (#6), challenges policy-ethics divorce (#7), questions psychological plausibility (#8), and ends with the fatal ambiguity (#9). Each follow-up cuts off retreat to generalizations.  
  **Key Trap:** Questions #2 and #7 force her to defend the "meantime" – if it’s indefinite, ethics becomes ornamental. #3 and #6 make elitism unavoidable. #8 uses Keynes’s psychology against his utopianism.
