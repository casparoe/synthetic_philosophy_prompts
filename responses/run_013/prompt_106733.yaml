prompt: |-
  Next month I'm recording a podcast episode and the guest is a historian of economics who's built her reputation on the claim that Keynes's economics is downstream of an ethical vision — that the good life stuff is the main event and the multipliers are scaffolding built around it. I'll be the one asking, you're the prep: you know both the technical Keynes and the Cambridge/Bloomsbury moral philosophy he was formed by, and you're good at finding the joint in a position rather than the surface. So start by brainstorming where her reading is strongest and where it's thinnest, then give me nine or ten questions in an order that escalates, each with a follow-up keyed to the answer she's most likely to give. No "what drew you to Keynes" softballs — dont waste the slot.

  I want at least one question on each of these:

  - whether the economic problem is bad for him only instrumentally, or whether he's committed to the stronger claim about what scarcity and money-getting do to character;
  - the apparent tension between his contempt for accumulation as an end in itself and his concession that avarice is needed in the meantime — what becomes of the ethics if the meantime never ends, and does he need a two-tier morality, one for the transition and one after, to keep it together;
  - whether the good life he pictures is a general ideal or quietly depends on a class of people doing the drudgery, and whether that makes the vision self-undermining;
  - whether he thinks the good life consists in the quality of certain states of mind, a residue of the Moore he was raised on, or in activity — living well as a practice rather than a contemplative state — and what would tell the two apart in his texts;
  - what he'd say about the possibility that solving the economic problem leaves people worse off, stripped of the old external purpose, and whether his own overwork is evidence against his picture or just a personal inconsistency.

  Keep them concrete enough that she can't get through one by summarising the 1930 essay about our grandchildren.
