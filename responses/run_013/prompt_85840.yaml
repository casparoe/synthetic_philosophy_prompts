prompt: |-
  ok so I'm a novelist. Literary fiction, but this one has a lot of procedure in it — think a workplace novel that keeps drifting into a legal thriller. My protagonist, Nell, is a mediator, or really a facilitator, who gets called in when two experts are deadlocked and someone needs the deadlock documented. A hydrologist and a dam engineer. A hospital administrator and an epidemiologist. A city planner and the guy who runs the traffic model. She does two or three of these a week, she's smart but not a statistician, she gets about an hour with each party seperately and then an hour with them together, and at the end she has to write something both sides will sign, which goes to whoever hired her.

  Here's the thing I built the book on. A friend of mine who does this for real told me there's actual math behind why she keeps failing. The idea, and I'm probaly mangling it, is something like: if two people start from the same prior, and it's common knowledge between them what each one now believes, they can't keep disagreeing. So whenever two rational people with the same starting point stay stuck, the stuckness has to be traceable to something specific — different priors, or private information neither has fully pooled, or the disagreement not actually being common knowledge in the technical sense (each thinks the other is posturing, or each thinks the other thinks they're posturing), or one of them just not being coherent. Is that right? Because if it is, it's the engine of my whole book and I want to get it right.

  So what I need from you: turn this into a procedure Nell can actually run in a room. The questions she asks in order, what counts as a sufficient answer to each, which answers let her stop and which send her back a step, and where the procedure runs out and she has to hand the thing to a person because the remaining question is about values and not about belief. Remember she can't do algebra on the page — it has to be verbal tests, things she can say out loud and a hostile engineer can't dismiss as hand-waving. And she needs to be able to defend each step, because these people are experts and they will absolutely push back.

  Then run it on three cases, in the kind of detail where I can steal the dialogue:

  1. Two hydrologists, same data, same model family, one says the reservoir has a one-in-four hundred chance of overtopping in the next decade and the other says one in forty. They both agree the other isn't lying or stupid. Walk me through what Nell does.
  2. Two experts who, as far as Nell can establish, have the same priors, the same evidence, and the same competence, and who still won't budge. I need to know what the procedure says here, even if what it says is that one of them isn't being coherent — because that's an accusation Nell can't make in a signed document, and I need to know she can't.
  3. One of the two parties isn't a person. It's a model — a forecasting system, or an optimization thing someone bolted onto a permitting process — and the person defending it genuinely can't tell Nell what it started out believing. Does the procedure even get off the ground? If it doesn't, say so.

  Two more things. First, tell me honestly what this procedure can't do, and give me at least one case where it produces an answer I won't like — ideally an answer that makes Nell, or the party I'm most sympathetic to, come out worse than the scene needs them to. I'd rather rewrite the scene than have you flatter me. Second, don't worry about citing anybody. Nell isn't going to name-drop a philosopher in a mediation room and neither is the narrator, so the ideas just have to be right, not attributed. Same for the write-up: no reading lists, no bibliography, no names and dates. If the underlying result is genuinely contested or has a caveat that would embarrass me if a reviewer caught it, tell me in plain language instead.
reasoning: |-
  Okay, the user is a novelist working on a literary fiction novel with procedural elements. Their protagonist Nell is a facilitator who mediates between deadlocked experts. The core idea is based on a mathematical concept about why rational people with the same priors can't persist in disagreement when they share their beliefs. The user wants to transform this concept into a practical procedure Nell can use during mediations, with three specific case studies and limitations of the approach.

  First, I need to understand the mathematical foundation. The concept appears to be Aumann's Agreement Theorem, which states that two rational agents with the same priors cannot agree to disagree if their posteriors are common knowledge. The key elements are common priors, rationality (Bayesian updating), and common knowledge of posteriors. Disagreements must arise from violations of these conditions.

  For Nell's procedure, I'll design a verbal protocol called the "Disagreement Autopsy" with three phases: establishing common ground, mapping the divergence, and identifying the rupture point. Each phase has specific questions designed to uncover differences in priors, evidence, or updating without requiring technical jargon. The questions should be defensible and resistant to expert dismissal.

  For the three cases:
  1. Hydrologists with different risk assessments: The procedure would reveal they're using different baseline scenarios or interpreting "overtopping" differently, showing divergent evidence rather than priors.
  2. Seemingly identical experts who still disagree: This would expose that their disagreement isn't truly common knowledge - each thinks the other is posturing for institutional reasons.
  3. When one party is a model: The procedure fails immediately because models lack priors and can't engage in dialogue, forcing Nell to handle it as a human-system conflict.

  Important limitations to highlight:
  - The procedure can't resolve value conflicts
  - It may unfairly flag someone as incoherent when they're actually using legitimate heuristics
  - It fails against strategic actors
  - It can't force honesty about private evidence

  The case that produces an unfavorable outcome should show Nell's preferred expert being exposed as incoherent while the unsympathetic party is technically correct. This creates tension between procedural truth and human judgment.

  Throughout, I'll avoid academic citations and focus on practical implementation. The dialogue examples will be detailed enough for the user to adapt, showing Nell's professional navigation of tense expert interactions. The limitations section will be brutally honest about where the procedure fails or creates narrative complications.
answer: |-
  Here's Nell's "Disagreement Autopsy" procedure, built on the core insight that persistent rational disagreement *must* stem from identifiable ruptures in shared foundations or communication. It's designed to be verbal, defensible, and force the underlying rupture into the open.

  **Nell's Disagreement Autopsy Procedure:**

  **Phase 1: Establishing the Common Ground (The "Shouldn't We Agree?" Foundation)**
  1.  **The Core Belief:** "Okay, let's start simple. What's the single, central claim or number you disagree on *right now*? Phrase it so the other person would have to nod if you stated it accurately." *(Goal: Pinpoint the exact posterior disagreement. Must be specific: "1-in-400 vs. 1-in-40 risk of overtopping," not "the risk is high/low.")*
  2.  **The Shared Starting Point:** "Before you saw *any* of the specific data for *this* reservoir/dam/project, what did you believe about the *general* likelihood of this kind of event? Was your baseline expectation similar? For example, would you both have said 'overtopping is rare but possible in poorly maintained dams' or something fundamentally different?" *(Goal: Establish common priors exist. Look for agreement on baseline plausibility. Differences here are Rupture Point #1: Different Priors.)*
  3.  **The Shared Evidence Pool:** "For *this specific case*, what's the core body of evidence you both agree is relevant and reliable? The surveys, the model runs, the inspection reports, the historical data – the stuff you both accept as factually correct inputs." *(Goal: Establish common evidence base. List it explicitly. Differences here are Rupture Point #2: Different Evidence/Private Information.)*
      *   *If disagreement on evidence emerges:* "Hold on. So, [Hydrologist A], you're including the 1987 landslide debris survey, but [Hydrologist B], you think it's unreliable? Why?" *(Forces private info/different weighting into the open.)*

  **Phase 2: Mapping the Divergence (The "Where Did You Turn?" Step)**
  4.  **The Interpretation Step:** "Given that shared starting point and this shared evidence pool, *how* did each of you get from there to your current belief? What's the crucial step in your reasoning or model where the interpretation of the evidence led you to your conclusion? Focus on the *leverage point* – the piece of evidence or the analytical step that most shaped your final number." *(Goal: Force articulation of the updating process. Look for differences in interpretation/model application.)*
  5.  **The Counterfactual Test:** "Hydrologist A, if the evidence *had* shown [a slightly different scenario Hydrologist B thinks is key, e.g., bedrock fissures were 10% smaller], how much would that change your 1-in-400 number? Hydrologist B, same question for you if [scenario A focuses on, e.g., rainfall projections were lower]." *(Goal: Reveal sensitivity and hidden assumptions. Shows *which* evidence drives the difference.)*
  6.  **The Mutual Understanding Check:** "Hydrologist A, can you explain back to Hydrologist B, in a way they would accept as accurate, *why* they believe it's 1-in-40, based *only* on the shared starting point and shared evidence we listed? Hydrologist B, same for A's 1-in-400." *(Goal: Test for Common Knowledge of Posteriors - Rupture Point #3. If they can't accurately articulate the *other's* reasoning from shared foundations, the disagreement isn't truly common knowledge; misunderstanding or perceived posturing is present.)*

  **Phase 3: Identifying the Rupture (The "Why Are We Stuck?" Conclusion)**
  7.  **The Rupture Diagnosis:** Based on steps 1-6, Nell identifies the rupture point(s):
      *   **R1: Different Priors:** Established in Step 2. (Now a values/experience debate - handoff point).
      *   **R2: Different Evidence/Private Info:** Revealed in Step 3 or 5. (Solution: Pool info explicitly, or acknowledge different data sources).
      *   **R3: Different Interpretation/Model Application:** Revealed in Step 4 or 5. (Debate the *method*, not the outcome. Requires expert negotiation on validity).
      *   **R4: Lack of Common Knowledge:** Revealed in Step 6. (Each thinks the other is irrational, mistaken about the evidence, or posturing. Solution: Force clarification until reasoning is mutually understood).
      *   **R5: Incoherence:** (The nuclear option). If all prior steps show identical priors, evidence, mutual understanding of reasoning, *and* the reasoning itself seems internally inconsistent or violates basic probability/logic *when stated aloud*, this is suspected. Nell *cannot* accuse this in the report. Her move: "I need you two to walk me through *this specific calculation step* again together, because my non-expert brain isn't seeing how [X] and [Y] cohere with your conclusion." Forces *them* to expose the flaw or backtrack.
  8.  **The Handoff or Resolution:** Nell frames the rupture clearly in her report: "The persistent disagreement stems primarily from [Rupture Point: e.g., differing interpretations of the seismic survey's impact on bedrock stability coefficients]. The parties agree on the baseline risk (Priors) and core data (Evidence), and understand each other's reasoning (Common Knowledge established). Resolution requires reconciling interpretations on [specific point]." If rupture is R1 (Priors) or R5 (Incoherence not resolved by Step 7), it becomes: "The disagreement reflects differing foundational assumptions about [e.g., base rates of extreme weather events] / requires further technical reconciliation beyond establishing the source of divergence." This flags it for the client.

  ---

  **Case Studies:**

  **Case 1: The Hydrologists (1-in-400 vs. 1-in-40)**

  *   **Nell (After separate hours):** "Alright, let's map this. Central disagreement: Risk of overtopping in next decade. Dr. Aris: 1-in-400. Dr. Boone: 1-in-40. Correct?" *(Both nod)*
  *   **Nell:** "Starting point: Before looking at *this* dam's specific data, did you both consider overtopping of a well-maintained dam like this, in this geological region, to be a very rare, low-probability event?" *(Aris: "Yes, extremely rare." Boone: "Rare, yes, but not vanishingly so – regional factors matter more.")*
  *   **Nell (Notes R1 potential, probes):** "Okay, 'rare' but different shades. For *this specific assessment*, core evidence: You both used the same hydrologic model (HEC-RAS v6.3), the 2022 bathymetric survey, the 50-year rainfall projections from the State Climatologist, and the dam integrity report from last year. Agreed?" *(Both: "Agreed.")*
  *   **Nell:** "Dr. Aris, walk me through the key step that led you to 1-in-400." *(Aris: "It's the rainfall projections. The model is sensitive to the upper tail. The State's 'extreme scenario' is based on outdated paleoclimate data. I applied a Bayesian adjustment weighting recent megastorm events higher, pulling the tail risk down significantly. That adjustment is crucial.")*
  *   **Nell:** "Dr. Boone?" *(Boone: "The rainfall is key, yes. But the paleoclimate data is essential for capturing true black swans. My leverage point is the bedrock permeability coefficients in the dam foundation model. The integrity report showed minor fissuring. Using the 'conservative' coefficient band from the manual, as I did, amplifies the impact of *any* high-water event. The rainfall tail matters, but the structure's response matters more. I ran sensitivity without my permeability choice – risk drops to maybe 1-in-200.")*
  *   **Nell (Counterfactual):** "Dr. Aris, if the integrity report *had* shown pristine bedrock – no fissures at all – how would that change your number?" *(Aris: "Modestly. Maybe 1-in-500. My big lever is the rainfall inputs.")* "Dr. Boone, if you used Aris's adjusted rainfall projections, but kept your permeability coefficient?" *(Boone: "Risk drops, but only to about 1-in-100. The structure is the weak link.")*
  *   **Nell (Mutual Understanding):** "Dr. Aris, explain Boone's 1-in-40 belief back to him, based solely on the shared evidence and his stated reasoning." *(Aris: "He thinks the dam is weaker than I do, fundamentally. He puts more weight on the minor fissures in the report, uses the most conservative manual coefficient, and believes that makes the structure the dominant risk factor, so even the standard rainfall projection gives a high probability. He thinks paleoclimate data for rainfall is vital, but it's secondary to the structure.") (Boone nods: "Yes, that's it.")*
  *   **Nell:** "Dr. Boone, now explain Aris's 1-in-400 to him." *(Boone: "He thinks the rainfall projections are inflated. He's adjusted them down based on recent storms, thinks the paleoclimate data is less relevant now, and believes that pulls the tail risk down so much that the dam's condition, while a factor, isn't the primary driver of catastrophic failure probability.") (Aris: "Correct.")*
  *   **Nell (Diagnosis):** "Okay. We have agreement on the *baseline* that overtopping is rare (common prior, broadly). Agreement on the core *evidence*. And crucially, you each understand *how* the other gets to their number from that evidence – different weight on the rainfall inputs vs. the structural permeability coefficients. The rupture is **R3: Different Interpretation/Model Application**. Specifically, the choice of permeability coefficient band and the adjustment (or not) of extreme rainfall likelihoods. Your disagreement is rational, grounded in professional judgment on *how* to apply the shared tools to the shared data. My report will state this clearly: Resolution hinges on reconciling the permeability coefficient selection and the treatment of extreme rainfall projections."

  **Case 2: The Seemingly Identical Experts**

  *(Imagine two epidemiologists, same prestigious training, same data access, same model (e.g., SEIR variant), both agree prior pandemic risk for Novel Pathogen X was low. Both see the same initial outbreak data. Dr. Vale says R0=2.5, Dr. Thorn says R0=1.8. They insist they understand each other's reasoning.)*

  *   **Nell:** Runs through Phases 1 & 2 meticulously. Priors? Check (Low baseline risk). Evidence? Check (Identical datasets, same core model). Mutual Understanding? *Seemingly* check (Each accurately parrots the other's reliance on specific parameters like serial interval or underreporting factor). But they won't budge.
  *   **Nell (Digging Deeper in Phase 2/Step 4):** "Dr. Vale, you mentioned the underreporting factor (UF) is key. You used UF=5. Dr. Thorn used UF=3. Why?" *(Vale: "Early clusters in rural areas with poor surveillance – classic high underreporting." Thorn: "But the index case was in a major city with good labs; initial cases were travelers from there. Lower underreporting likely.")*
  *   **Nell (Counterfactual - Step 5):** "Dr. Thorn, if you *had* to use UF=5, what's your R0?" *(Thorn: "Rises to about 2.3, still below Vale's 2.5.") "Dr. Vale, if you used UF=3?" (Vale: "Drops to maybe 2.2, still above Thorn's 1.8.")*
  *   **Nell (Spotting it - Step 6 Nuance):** "Dr. Vale, explain *why* Dr. Thorn sticks to R0=1.8 even if UF=5 pushes it up." *(Vale: "Well, he's always been ultra-conservative. Doesn't want to cause panic. Or maybe his department head is pressuring him for lower estimates to keep borders open. It's not really about the UF alone.")*
  *   **Nell (To Thorn):** "Is that accurate, Dr. Thorn? Is institutional pressure or a desire to avoid over-reaction influencing your *interpretation* of the UF or other parameters?" *(Thorn, flustered: "No! It's the data! The travel patterns suggest..." He trails off, looks conflicted.)*
  *   **Nell (To Vale):** "Dr. Vale, Dr. Thorn suggests your higher R0 might be influenced by your experience in Region Y, where underreporting *was* catastrophic, leading you to over-apply that lesson here. Is there any weight to that?" *(Vale, defensive: "Absolutely not! This is pure analysis! He's just being obstructive!")*
  *   **Nell (Diagnosis - R4: Lack of Common Knowledge):** "Hold on. Earlier, you both *said* you understood each other's technical reasoning. But now, Dr. Vale, you're suggesting Dr. Thorn's *motivations* are affecting his analysis. Dr. Thorn, you implied Dr. Vale's *past experience* is biasing hers. This means you *don't* truly accept that the other's conclusion stems purely from the shared evidence and rational updating. You suspect hidden motives or biases are at play. That's the rupture: **R4: Lack of Common Knowledge**. You don't have shared certainty that the other is *solely* reasoning from the evidence. My report will state: 'While experts agree on prior beliefs, core evidence, and the technical steps taken by each, the persistence of disagreement appears linked to a lack of mutual certainty regarding the *exclusive* role of shared evidence in shaping each expert's conclusion, suggesting unresolved concerns about potential ancillary influencing factors.'" *(Nell CANNOT accuse incoherence (R5). She can only expose that they don't truly believe the other is being purely rational with the shared inputs, which is an R4 rupture.)*

  **Case 3: The Model as a Party**

  *   **Nell (To Human Defender):** "Okay, let's establish the common ground. Central Disagreement: [e.g., The model forecasts 15% revenue growth; the human expert forecasts 5%]. Correct?" *(Human: "Yes.")*
  *   **Nell:** "Shared Starting Point: What was the model's *prior* belief about revenue growth for this product category before it ingested the current data? What baseline assumptions are baked into its structure?" *(Human: "Uh... it's trained on historical data. I don't know its exact 'prior' in a Bayesian sense. It starts from its training distribution.")*
  *   **Nell:** "Can you characterize that training distribution? Was it generally optimistic, pessimistic?" *(Human: "It's complex... it learned patterns. I can't give you a simple prior belief.")*
  *   **Nell (Stops the Procedure):** "I see. The core procedure requires establishing a *common prior* belief as a baseline. Without knowing what the model 'believed' before seeing the specific evidence driving this disagreement, I can't apply the standard autopsy to isolate the source of divergence between the model and [Human Expert]. The model lacks an articulable prior belief in a way that can be compared to a human's. We need a different approach – perhaps comparing the *inputs* the model used versus the evidence the human expert prioritized, or auditing the model's logic on specific data points. The Disagreement Autopsy, as designed for two reasoning agents with comparable belief structures, **does not get off the ground** here."

  ---

  **What the Procedure CAN'T Do (And the Uncomfortable Case):**

  1.  **Resolve Value Conflicts:** It diagnoses *why* beliefs differ, not *which* belief is "better" or "right." If the rupture is R1 (Different Priors), those priors are often based on values, experience, or risk tolerance. Nell can only flag this. The procedure doesn't make Nell's sympathetic expert "win."
  2.  **Force Honesty:** It relies on experts accurately describing their priors, evidence, and reasoning. A strategic liar can derail it. Nell can only probe for inconsistencies.
  3.  **Handle True Incoherence Gracefully:** Identifying R5 is fraught. Nell can only force re-examination (Step 7.5). Accusing it is professional suicide. The report might remain vague.
  4.  **Account for Legitimate Heuristics:** Experts often use fast-and-frugal rules (heuristics) that aren't strictly Bayesian but work well in practice. The procedure might flag this as incoherence (R5) if the heuristic can't be articulated as a rational update step, even if it's valid.
  5.  **Deal Perfectly with Ambiguity:** Real evidence is messy. Differing interpretations (R3) can be equally valid. The procedure exposes the difference but doesn't magically resolve it.

  **The Uncomfortable Case: The Biased Sympathetic Expert**

  *   **Scenario:** A veteran city planner (Nell likes her, passionate about community) vs. a young traffic modeler. Disagreement: Model predicts new development adds only 5 mins avg. commute; Planner insists it's 15+ mins based on "neighborhood character" and historical patterns. Modeler uses state-of-the-art simulation.
  *   **Nell Runs the Autopsy:**
      *   Central Belief: 5 min vs 15+ min increase? Planner: "Yes, *at least* 15 mins during peak."
      *   Shared Prior? Planner: "New dense development *always* clogs local arterials." Modeler: "Modern models account for induced demand better. Prior was neutral, data-driven."
      *   **Rupture #1 (Different Priors):** Planner has a strong, experience-based prior the modeler doesn't share.
      *   Shared Evidence? Modeler: "Land use plan, trip gen rates, network model, calibrated to current traffic counts." Planner: "Ignores school drop-off patterns, local driver behavior (they avoid the highway!), the specific developer's history of under-providing parking."
      *   **Rupture #2 (Different Evidence):** Planner cites local knowledge/private info.
      *   Interpretation? Modeler walks through simulation logic. Planner: "Your model assumes perfect driver rationality. Ours don't! They take shortcuts, clog local roads. You didn't model the *actual* alternate routes."
      *   Counterfactual? If alternate routes *were* modeled? Modeler: "We did, within standard parameters." If no historical bias? Planner: "Irrelevant! History shows!"
      *   Mutual Understanding? Modeler understands Planner distrusts models and believes in local chaos. Planner understands Modeler trusts the algorithm's calibration. But...
  *   **The Uncomfortable Reveal:** Nell probes Planner's "15+ mins." How quantified? Planner admits it's an estimate based on a similar project 15 years ago that caused "chaos." Nell asks if specific data (traffic counts, travel time surveys) from that project support 15+ mins. Planner: "We didn't formally survey, but everyone *knew* it was bad!" Modeler points out the old project had worse road infrastructure.
  *   **Diagnosis:** **R2 (Different Evidence - Planner's evidence is anecdotal/experiential, not quantified or pooled) and strong R1 (Different Priors - Planner fundamentally distrusts models, Modeler trusts calibrated ones).** BUT ALSO, lurking **R5 (Incoherence):** The Planner's *specific* 15+ min claim isn't rationally updated from her prior and evidence; it's an unsupported extrapolation from a dissimilar past event, inflated by conviction. Her belief is emotionally coherent, but evidentially/probabilistically incoherent.
  *   **Nell's Bind:** She *can* report the Ruptures (R1, R2). She *cannot* call the Planner incoherent (R5). To defend the procedure, she must note the Planner's quantifiable estimate lacks a clear documented link to specific evidence, unlike the Modeler's simulation output. The report makes the sympathetic Planner look less rigorous, potentially unreasonable, while the cold Modeler appears objectively correct. Nell has to write: "The disagreement stems from fundamentally different baseline assumptions about traffic modeling validity and reliance on different types of evidence (quantitative simulation vs. qualitative experience). The Planner's specific numerical estimate of +15 minutes lacks a documented quantitative basis in the current project data or directly comparable past project data." This feels like a betrayal of the human element Nell values, but the procedure demands it. The client (likely pro-development) will seize on it. Nell hates it, but it's what the autopsy found. She might soften the language slightly, but the substance condemns her ally's lack of concrete support for her number.
