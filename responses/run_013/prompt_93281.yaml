prompt: |-
  I do screening at a small national competition authority — I'm the economist on the team, not a lawyer — and my job is triage: complaints and market-monitoring hits come in, maybe a dozen a month, and each one gets a yes/no on weather to open a formal investigation, usually inside two weeks. At that stage we only have public information and whatever the firms volunteer, no subpoena power, and whatever I write has to survive being read by a board member who isn't an economist and then challenged by the firms' lawyers.

  The legal test is our lawyers' problem and they're happy with it. My problem is the thing underneath it. Over and over we get a set of firms that behaved in parallel, and I have to say something about whether they were acting together or each just doing their own sums in a market where everyone can watch everyone else. I read a bit of the collective-intentionality literature years ago — Bratman on shared activity, Searle on we-intentions, Gilbert on joint commitment, Tuomela on the we-mode, List and Pettit on group agents — and it felt like exactly the right toolbox, except none of it is in a form I can use in a two-page note.

  Can you turn it into a procedure I can actually run? The questions in the order I'd ask them, what counts as a sufficient answer to each, where the procedure stops with a close, and where it has to hand the file to a human because what's left is a values call or a legal-risk call rather than a question about whether there was a joint intention. Then run it on three of our live files, names changed:

  1. Three ferry operators on one coastal route. Operator A announces a fuel surcharge in a trade newsletter and on its own site; within nine days B and C file surcharges at the same percentage. No calls, no meetings, nothing between them. B had been undercutting A's fares for two years. A's commercial director later told a conference that they had to be transparent about it, you can't have a race to the bottom.

  2. A trade association working group, three firms' commercial directors, adopts a voluntary standard on pack sizes that happens to kill off the cheap small sachet that had been driving a price war. The minutes talk only about shelf presentation and consumer clarity. Nobody mentions price, and everyone in the room knew what it would do.

  3. Two supermarket chains pull out of the same low-margin region within a week of each other. One internal email: if they pull out we stay out, if they come back we're back in within a month. Both were at the same industry conference the month before, though there's no evidence they spoke.

  Then tell me where the procedure breaks. I suspect Bratman's thing is built for people who are actually cooperating, and my firms would happily undercut each other given half a chance, so maybe it just doesn't transfer. Is the residue my vocabulary missing something, or the philosophers arguing about something we don't care about? And say which of the three the procedure makes me close even though it feels dirty, and which one it makes me escalate even though the numbers look harmless. No reading list please — I'm not going to read more philosophy, I need the thing I can run.
reasoning: |-
  We are designing a procedure to assess whether there is evidence of joint intention (collusion) in parallel behavior by firms. The key is to distinguish between mere parallel behavior (each acting independently in response to market conditions) and coordinated behavior (acting with some form of mutual understanding or agreement, even if tacit).

  The procedure will be a series of questions that can be answered with the limited information available at the screening stage (public information and voluntary submissions). The goal is to have a structured approach that leads to a clear "yes" (escalate) or "no" (close) where possible, and flags cases that require a human judgment call (due to ambiguity or legal risk).

  We draw from the collective intentionality literature but simplify it into practical, operational questions.

  **Procedure: Assessing Joint Intention in Parallel Behavior**

  1. **Question 1: Is there evidence of communication?**
     - Look for any direct or indirect communication between the firms that could facilitate coordination. This includes meetings, phone calls, emails, trade association interactions, public announcements that could serve as signals, etc.
     - *Sufficient for "yes" (escalate):* Any evidence of direct communication (e.g., meeting, call, email) that relates to the conduct in question. Also, evidence of public statements that are unusual and appear designed as signals (e.g., announcing future price changes in a way that is not necessary for normal business and seems aimed at competitors).
     - *Sufficient for "no" (close):* No communication of any kind, and no public statements that could reasonably be interpreted as signals (e.g., routine price announcements that are typical in the industry and necessary for customers).
     - *If ambiguous:* Proceed to next question.

  2. **Question 2: Is the parallel behavior against individual self-interest without coordination?**
     - Assess whether each firm, acting independently and without coordination, would have an incentive to engage in the behavior. If the behavior is against a firm's self-interest (e.g., raising prices when it would lose market share) unless others follow, then coordination is more likely.
     - *Sufficient for "yes" (escalate):* The behavior would be unprofitable for a firm if done unilaterally (e.g., raising prices while competitors undercut) but profitable if matched. This suggests an expectation of matching.
     - *Sufficient for "no" (close):* The behavior is in each firm's self-interest regardless of others (e.g., cost-driven price increases that are necessary to cover costs, and even if not matched, the firm would still need to do it). Note: if the behavior is in self-interest without coordination, then parallel behavior is likely independent.
     - *If ambiguous:* Proceed to next question.

  3. **Question 3: Is there evidence of a shared plan or mutual commitment?**
     - Look for evidence that the firms were acting according to a shared plan, even if informal. This could include:
       - Public statements by company officials indicating an understanding of mutual dependence or a collective goal (e.g., "we must avoid a race to the bottom").
       - Actions that are consistent with a commitment to a common course of action (e.g., following a leader's announcement quickly and precisely, especially when it is against short-term self-interest without assurance of reciprocation).
       - Internal documents that refer to the actions of competitors as a reason for their own actions (e.g., "if they do X, we will do Y").
     - *Sufficient for "yes" (escalate):* Any explicit statement (public or internal) that indicates a shared understanding or commitment to act in concert, or actions that are only explainable by a mutual commitment (e.g., following a price increase that is not cost-justified and that the firm had been undercutting before, without any independent reason).
     - *Sufficient for "no" (close):* No evidence of shared plan or commitment, and the behavior is explainable by independent factors (e.g., common cost shocks).
     - *If ambiguous:* Proceed to next step (human judgment).

  4. **Question 4: Is there an alternative independent explanation?**
     - Consider whether there is a plausible independent factor that could explain the parallel behavior (e.g., common cost increases, regulatory changes, market trends). If so, and if the above questions did not yield clear evidence of coordination, then the case is less suspicious.
     - *Sufficient for "no" (close):* A strong independent factor that fully explains the parallel behavior (e.g., a simultaneous increase in fuel costs for all ferry operators, and the surcharge is exactly the percentage of the cost increase).
     - *If no independent explanation:* Then the parallel behavior remains suspicious and may require escalation.

  **Stopping points:**
  - If at any step we get a clear "yes" (escalate) or "no" (close), we stop.
  - If we go through all steps and the situation is ambiguous (i.e., no clear evidence of communication, but behavior is against self-interest without coordination and no independent explanation, but also no direct evidence of shared plan), then we flag for human judgment. This is the "values call" or "legal-risk call" because it may be tacit collusion which is legally gray and depends on jurisdiction and specific laws.

  **Applying the procedure to the three cases:**

  **Case 1: Three Ferry Operators**
  1. **Communication:** Operator A announced the fuel surcharge in a trade newsletter and on its site. This is public but could be a signal. However, there are no calls or meetings. The announcement itself is a form of indirect communication (signaling). *Ambiguous?* Not direct, but the public announcement in a trade newsletter is a common way to signal. We proceed.
  2. **Against self-interest without coordination?** 
     - Previously, B had been undercutting A. If B were acting independently, it would have an incentive to undercut A's price increase to gain market share. Instead, B matched the surcharge. This is against B's short-term self-interest (if it believed A would not retaliate) unless it expected A to stick to the increase and C to follow. Therefore, matching is against self-interest without an expectation of coordination. *Suggests "yes" (escalate).*
  3. **Shared plan or mutual commitment?** A's commercial director later said they had to be transparent to avoid a race to the bottom. This indicates a shared understanding of the collective goal (avoiding a price war). *This is evidence of a shared plan.*
     - **Conclusion:** Escalate. The procedure stops at Q3 with a "yes".

  **Case 2: Trade Association Working Group**
  1. **Communication:** There was a meeting of the trade association working group (with three firms' commercial directors). They discussed and adopted a voluntary standard. *Direct communication occurred.*
     - **Conclusion:** This alone is sufficient to escalate (Q1). Even though the minutes don't mention price, the context and the known effect (killing off the small sachet that was driving a price war) and the fact that everyone in the room knew the effect, suggests the communication was used for coordination. We escalate.

  **Case 3: Two Supermarket Chains**
  1. **Communication:** They were at the same industry conference but no evidence they spoke. So no direct communication. However, the internal email from one chain: "if they pull out we stay out, if they come back we're back in within a month". This email is internal but shows that one firm's decision is conditional on the other's. There is no evidence of an agreement, but the conditional statement suggests an expectation of parallel behavior. *No direct communication, but the internal email is evidence of an expectation. This isn't communication between them, so we proceed.*
  2. **Against self-interest without coordination?** Pulling out of a low-margin region might be in each firm's self-interest if the region is unprofitable. However, the conditional statement in the email suggests that the firm is waiting to see what the other does. This implies that the decision is not entirely independent. Acting conditionally (waiting to see what the other does) is against the firm's self-interest if it would be better to act immediately (unless there is an expectation of reciprocation or avoidance of a worse outcome by moving second). *Ambiguous: It might be in their self-interest to avoid being the only one in the market?*
  3. **Shared plan or mutual commitment?** The internal email indicates that one firm has a plan contingent on the other. But there is no evidence that the other firm has a similar plan or that there was any agreement. Without mutual commitment, it's just one firm reacting to the other. *No evidence of a shared plan.*
  4. **Alternative independent explanation?** The region is low-margin, so leaving is independently rational. The fact they left within a week might be coincidental or due to similar assessments. The conditional email suggests one firm is following, but without communication, it might be unilateral.
     - **Conclusion:** Ambiguous. The parallel behavior is explained by independent factors (low margins) and the conditional behavior is only on one side. However, the close timing and the conditional plan are suspicious. This would be a judgment call. The procedure does not give a clear close or escalate, so it goes to human review.

  **Where the procedure breaks:**
  - The procedure might break in cases of tacit collusion where there is no communication and no explicit shared plan, but the firms are in a repeated game and have learned to coordinate without any agreement. In such cases, the behavior might be against self-interest without coordination (Q2) and there might be no independent explanation (Q4), but without evidence of a shared plan (Q3) we might have to send it to human judgment. This is a known gap in the law in many jurisdictions (tacit collusion is often not illegal, but if there is any facilitating practice, it might cross the line).
  - The procedure is built on the assumption that we can find evidence of communication or shared intention. However, sophisticated firms may avoid leaving any evidence. The ferry case had a public statement that revealed the shared intention, but without that, it might be harder.

  **Residue:**
  - The collective intentionality literature (like Bratman) focuses on explicit cooperation. In competition cases, firms are not cooperating in a friendly way; they are often rivals. However, the key is whether they have a shared intention to coordinate for mutual benefit, even if they would undercut if they could. The literature does transfer because we are looking for the same mental state (shared intention) even if the relationship is adversarial.
  - The residue is that sometimes the evidence is ambiguous, and we must make a judgment about whether the firms were acting with a shared plan or independently. The procedure doesn't eliminate that, but it structures the inquiry.

  **Which case feels dirty to close but the procedure closes?** 
  - Case 3 (supermarkets) would be closed by the procedure if the human reviewer decides that the independent explanation (low margins) is sufficient and there is no evidence of mutual commitment. But it feels dirty because of the conditional email and the timing.

  **Which case looks harmless but the procedure escalates?** 
  - Case 1 (ferries) might look like independent responses to a cost increase (if one only looks at the surcharge) but the procedure escalates because of the evidence of a shared plan (the statement about avoiding a race to the bottom) and the behavior being against self-interest without coordination (B had been undercutting but now matched).

  **Note:** In Case 2, the procedure escalates because of the communication (trade association meeting) even if the minutes are clean. The context (everyone knowing the effect) and the outcome (killing the price war) make it suspicious.

  **Final Procedure Output:**

  The procedure is:
  1. Check for communication (direct or indirect signaling). If found, escalate.
  2. If no communication, check if the behavior is against self-interest without coordination. If yes, then proceed to next step (or if clear, escalate). If no, consider closing.
  3. Check for evidence of shared plan or mutual commitment (statements, internal documents). If found, escalate. If not, consider independent explanations.
  4. If there is a strong independent explanation, close. Otherwise, send for human judgment.

  For the cases:
  - Case 1: Escalate (clear at Q2 and Q3).
  - Case 2: Escalate (clear at Q1).
  - Case 3: Ambiguous, send for human judgment (no at Q1, ambiguous at Q2 and Q3, and independent explanation at Q4 but conditional behavior raises concerns).
answer: |-
  Below is a practical procedure for assessing joint intention (collusion) in parallel behavior cases, distilled from collective-intentionality concepts (Bratman, Gilbert, etc.) into a step-by-step workflow. It's designed for your constraints: public/voluntary information only, 2-week timeline, and output that must withstand non-economist board scrutiny and legal challenges. The procedure prioritizes observable evidence over theoretical nuance and stops early when a clear "close" or "escalate" signal emerges. It flags "human judgment" only when the evidence is ambiguous and hinges on values/legal risk (e.g., tacit collusion gray zones).

  ---

  ### **Joint-Intention Assessment Procedure**
  **Core Question:** *Did the firms act with shared intention (collusion), or did they independently reach the same outcome?*  
  **Input:** Public data, voluntary firm submissions, and contextual market facts.  
  **Output:** "Close," "Escalate," or "Human Judgment Needed."  

  #### **Step 1: Check for Explicit Coordination**  
     - **Question:** *Is there direct evidence of communication or agreement?*  
     - **Sufficient for Escalate:**  
       - Records of meetings, calls, emails, or trade-association discussions about the conduct.  
       - Public statements (e.g., announcements, interviews) explicitly referencing coordination, mutual expectations, or joint goals.  
     - **Sufficient for Close:**  
       - No communication, and public statements emphasize independent decision-making (e.g., "We acted based on market conditions").  
     - **Procedure Stops Here If:**  
       - Evidence meets "escalate" threshold → **Escalate**.  
       - No evidence of communication → Proceed to Step 2.  

  #### **Step 2: Test for Against-Self-Interest Behavior**  
     - **Question:** *Would the parallel behavior harm a firm if others didn’t follow, but benefit them if they did?*  
     - **Sufficient for Escalate:**  
       - Conduct is irrational unless matched (e.g., raising prices in a price-sensitive market where undercutting was recent).  
       - Internal documents/statements show awareness of this dependency (e.g., "We need others to follow").  
     - **Sufficient for Close:**  
       - Behavior is self-interested regardless of others (e.g., cost-driven changes like fuel surcharges with transparent math).  
       - Market conditions (e.g., input costs, demand shocks) fully explain the behavior.  
     - **Procedure Stops Here If:**  
       - Evidence meets "escalate" threshold → **Escalate** (high collusion risk).  
       - Behavior is clearly self-interested + no red flags → **Close**.  
       - Ambiguous (e.g., no internal docs, but economics suggest interdependence) → Proceed to Step 3.  

  #### **Step 3: Assess Shared-Plan Indicators**  
     - **Question:** *Is there evidence of mutual commitment to a joint outcome?*  
     - **Key Indicators (from Bratman/Gilbert):**  
       - **Public Commitment:** Statements implying collective responsibility (e.g., "We must avoid a race to the bottom").  
       - **Action Interdependence:** Conduct only makes sense if firms expect reciprocation (e.g., following a competitor’s move precisely despite conflict history).  
       - **Common Knowledge:** Market-wide awareness that behavior is linked (e.g., industry signals like announcements in trade media).  
     - **Sufficient for Escalate:**  
       - ≥2 indicators present (e.g., public commitment + action interdependence).  
     - **Sufficient for Close:**  
       - No indicators, and firms have divergent incentives (e.g., history of undercutting).  
     - **Procedure Stops Here If:**  
       - Evidence meets "escalate" threshold → **Escalate**.  
       - No indicators → **Close**.  
       - Weak/conflicting indicators → Proceed to Step 4.  

  #### **Step 4: Final Triage (Human Judgment)**  
     - **Question:** *Is the ambiguity resolvable with economics, or is it a values/legal-risk call?*  
     - **Human Judgment Needed If:**  
       - Tacit collusion is plausible but no evidence of intent (e.g., mutual monitoring in a concentrated market).  
       - Legal gray areas (e.g., trade-association conduct that "looks bad" but lacks smoking guns).  
       - Conflicting evidence (e.g., one firm shows against-self-interest, others don’t).  
     - **Otherwise:**  
       - Strong independent explanation (e.g., cost shocks) → **Close**.  
       - Suspicious patterns without proof → **Escalate** if litigation risk is low.  

  ---

  ### **Application to Your Cases**
  **Case 1: Ferry Operators**  
  - **Step 1:** No calls/meetings, but A announced surcharge in trade newsletter (indirect signal). → Proceed.  
  - **Step 2:** Behavior is against self-interest. B had undercut A but now matched; irrational without expecting reciprocation. A’s director admitted needing "transparency" to avoid "race to the bottom" → **Escalate** (Step 2 threshold met).  
  - **Why escalate?** Classic facilitating practice: public announcement + against-self-interest action + admission of collective goal.  

  **Case 2: Trade Association Pack Sizes**  
  - **Step 1:** Direct communication (trade group meeting). Minutes avoid price talk, but context (killing price-war sachets) implies coordination → **Escalate** (Step 1 threshold met).  
  - **Why escalate?** Shared intention inferred from common knowledge in the room (Gilbert’s "joint commitment"). Legally risky to ignore.  

  **Case 3: Supermarkets Exiting Region**  
  - **Step 1:** No evidence they spoke at conference (no communication). → Proceed.  
  - **Step 2:** Exiting low-margin region is self-interested. Internal email shows conditional intent ("if they pull out, we stay out") but no proof of mutuality. → Ambiguous.  
  - **Step 3:** No public commitment. Action interdependence (timing) is weak; email is one-sided. → Ambiguous.  
  - **Step 4:** Independent explanation (low margins) is strong, but conditional email hints at tacit collusion. → **Human Judgment Needed**.  
  - **Verdict:** Likely close (economics dominate), but the email requires legal-risk review.  

  ---

  ### **Where the Procedure Breaks**  
  1. **Adversarial Firms vs. Cooperative Agents:**  
     - Bratman/Gilbert assume parties *want* to cooperate. Your firms would undercut if possible—so shared intention is often inferred from *constraints* (e.g., mutual vulnerability) not goodwill. The procedure handles this via Step 2 (against-self-interest) and Step 3 (common knowledge).  
     - **Residue:** Philosophers debate "we-intentions" (e.g., is it a mental state or social fact?), but you only care about observable evidence of collusion. The procedure ignores theory and focuses on:  
       - Communication (Step 1),  
       - Incentives (Step 2),  
       - Interdependence (Step 3).  

  2. **Tacit Collusion Gray Zones:**  
     - Breaks when parallel behavior arises from repeated interactions (e.g., mutual monitoring) with no intent to coordinate. Step 4 (human judgment) catches this—economics alone can’t prove intent here.  

  3. **"Feels Dirty" vs. "Escalate Harmless":**  
     - **Feels Dirty but Close:** Case 3 (supermarkets). Economics support independence (low margins), and weak intent evidence. Procedure forces close absent hard proof, but the email feels dirty.  
     - **Harmless but Escalate:** Case 1 (ferries). Numbers might show fuel-cost justification, but director’s statement + against-self-interest action triggers escalation.  

  ---

  ### **Procedure Shortcomings & Mitigations**  
  - **False Negatives:** Tacit collusion without evidence (e.g., pure price leadership) may slip through. Mitigation: Step 4 flags for human review.  
  - **False Positives:** Concentrated markets with transparent pricing can mimic collusion. Mitigation: Step 2’s "self-interest" test and Step 4’s cost-benefit screen.  
  - **Speed:** Completes in 1–2 hours per case using public data and simple tables.  
  **Final Output Format:** 1-page memo with:  
    - Step 1–3 answers (bullet points).  
    - Recommendation (close/escalate/human judgment).  
    - Key evidence (e.g., "A’s statement admits collective goal").  

  This strips philosophy to actionable checks. No reading list—just run the steps.
