  ### Key to Leaves  
  | Leaf | Position                          | Awkward Commitment                                                                 | Works For Cases*                                  |  
  |------|-----------------------------------|------------------------------------------------------------------------------------|--------------------------------------------------|  
  | 1    | Domain Restriction (Meddlesome Excluded) | Requires defining "meddlesome" (e.g., is house paint a private choice or street’s business?). | Book, kidney; weak for house paint, loud music. |  
  | 2    | Domain Restriction (Cycle-Avoiding)      | Excludes reasonable preferences (e.g., book case) arbitrarily.                    | All, but excludes key examples.                  |  
  | 3    | No Rights                         | No protected sphere for anyone (e.g., society bans kidney sales "for your own good"). | None well.                                       |  
  | 4    | Rights as Constraints             | Social choice over constrained set may still cycle (e.g., book case persists).     | Kidney (binary choice); weak for >2 options.     |  
  | 5    | Pareto (Non-Meddling Only)        | Hard to isolate "private" preferences (e.g., loud music leaks to others).          | Kidney; weak for book, loud music.               |  
  | 6    | Pareto Abandoned                  | Society can override unanimous views (e.g., ban kidney sales even if all support). | All, but counterintuitive.                       |  
  | 7    | Non-Preference Welfarism          | Requires defining well-being objectively (e.g., does selling a kidney help well-being?). | Kidney; weak for book.                           |  
  | 8    | Alienable Rights                  | May enable coercion (e.g., Lewd "sells" right under duress).                       | Book, kidney; weak for loud music.               |  
  | 9    | Choice-Sensitive Outcomes         | Explodes alternative space (e.g., "Prude reads under protest" vs. "voluntarily").  | Book, kidney; cumbersome for all.                |  
  | 10   | Rights Over Acts                  | Protects choosing, not outcomes (e.g., Lewd chooses to read, even if outcome is bad). | Book; weak for contagious disease.               |  
  | 11   | Non-Transitive Social Choice      | Accepts arbitrary outcomes (e.g., society picks randomly from cycle).              | All, but unsatisfying.                           |  
  | 12   | Anti-Welfarism                    | Rejects preferences as input (e.g., ignores Prude’s disgust as irrelevant).        | Book; less clear for kidney.                     |  
  | 13   | Contextual Solution               | No unified theory (e.g., rights trump Pareto in kidney, Pareto trumps in contagion). | All, but ad hoc.                                 |  

  \* *Cases: Book (Lady Chatterley), Kidney (self-harm debates), House Paint (disputes over private sphere), Loud Music (private acts with spillovers).*  

  ### Empty Cells & Notes  
  - **Incoherent:** Keeping all three conditions (Sen’s theorem proves impossibility).  
  - **Unattractive:** **Leaf 3 (No Rights)**—denies personal autonomy universally. **Leaf 6 (Pareto Abandoned)**—ignores consensus.  
  - **Undefended:** Combining **Leaf 4 (Rights as Constraints)** with full Pareto/unrestricted domain (cycle risk remains).  
  - **Same Position:** **Leaf 9 (Choice-Sensitive Outcomes)** and **Leaf 10 (Rights Over Acts)** overlap (both reframe choices).  
  - **Tree Limitation:** Cannot separate **Leaf 1** and **Leaf 5** cleanly—both handle "meddlesomeness" differently (domain vs. Pareto).  

