  Okay, let me tackle this novelist's problem. They're writing about interpretability in language models and need a precise term for an argument pattern they keep encountering. The core issue is the inconsistent use of two tests: linear probes showing decodable information versus ablation affecting behavior. 

  First, I need to understand the gap they're describing. The problem seems to be that researchers treat these two methodologies as interchangeable evidence for "representation," but actually they test fundamentally different things. Probes reveal decodable information, while ablation reveals causal necessity in a specific model instance. The redundancy issue (knocking out one component with no effect because other components compensate) further complicates this.

  Looking at their notes: probing, ablation, superposition. Superposition is about compressed representations, which is adjacent but not identical. "Correlation isn't causation" is close, but this is more specific - it's about two distinct types of evidence being conflated in ML interpretability. 

  The philosophical angle about "representation" is crucial. A representation should be both decodable and functionally used. But in practice, these two properties get treated as separate litmus tests, selectively applied. That's the heart of the inconsistency.

  For naming options: 
  - Methodological dualism? Too vague. 
  - Probe-ablation gap? Descriptive but clunky. 
  - Functional decodability? Captures the required combination. 
  - Causal representation fallacy? Highlights the error.

  Considering the request for a definite position: the real issue is that neither test alone suffices. True representation requires both decodability and causal role. The redundancy problem is the same core issue - it shows causal necessity isn't inherent to the representation but depends on implementation.

  Final name consideration: "Functional decodability" seems most precise. It combines the two necessary aspects while implying their inseparability for real representation. The eight-word gloss should capture this duality.
answer: |-
  The gap isn't just "correlation isn't causation" in a lab coat—it's a **methodological inconsistency specific to functional claims in interpretability**. Here's the breakdown:

  1.  **The Core Slide:** Researchers toggle between two distinct criteria for "representation" as needed:
      *   **Decodability Criterion:** "We can read X out (via probes), therefore X is represented."
      *   **Causal Necessity Criterion:** "Removing/altering Y breaks behavior involving X, therefore Y *is* the representation of X."
      The inconsistency lies in *not demanding both simultaneously* and treating them as interchangeable proof of the same underlying thing. They aren't.

  2.  **Why They Aren't the Same Thing:**
      *   **Decodability (Probes):** Shows information *exists* linearly in the state. It's about *presence*, not *use*. Like finding a book in a library; its presence doesn't mean it's being read or is essential to the library's function. This maps to "information that happened to be decodable."
      *   **Causal Necessity (Ablation):** Shows a specific vector/direction/neuron is *causally necessary for a specific output behavior* in *this specific model instance*. It's about *localized functional contribution*, not necessarily about *semantic content*. Ablating a wire might break a machine without that wire *representing* the broken function semantically. This is vulnerable to redundancy.

  3.  **The Redundancy Problem:** This isn't a separate issue, it's the **fatal flaw in over-relying *only* on the Causal Necessity Criterion.** Finding one "necessary" direction for X in Model A doesn't mean it's *the* representation of X. In Model B (or even elsewhere in Model A), different circuitry might handle X. Ablation identifies *a* critical component in *a specific implementation*, not necessarily *the semantic representation*. It's like declaring the specific fuse in *your specific car* that blows when the headlights short *is* "the representation of headlight function." Another car (or another fuse path) might handle it differently.

  4.  **The Philosophical Relabelling:** You're right to recall the "job description" idea (like teleosemantics or functional role semantics). This *is* essentially the core puzzle: **For a state to genuinely represent X *for the system*, the information about X must be decodable *and* the system must *use* that specific information-carrying state in its computations to produce behavior dependent on X.** The interpretability field currently lacks reliable methods to demonstrate *use* (beyond crude ablation) in complex, distributed systems like LLMs. Showing decodability is easier, showing *necessary and sufficient use* of that *specific* decoded information is incredibly hard.

  5.  **What Would License "Represents X"?** A robust demonstration requires:
      *   **Decodability:** X can be reliably read from the state.
      *   **Causal Specificity:** Manipulating *that specific decoded information* (not just ablating a direction) should predictably alter model behavior *specifically* in ways contingent on X (e.g., scrambling the decoded "past tense" vector should reliably cause tense errors, *without* broadly breaking everything else).
      *   **Invariance (Ideal, but hard):** This pattern holds across different models/architectures trained on similar tasks/data. The redundancy problem makes this incredibly difficult to establish via single-model ablation studies.

  **Definite Position:** Both camps relying *solely* on one criterion are wrong for claiming "representation." **Decodability-only proponents** mistake accessible information for functional currency. **Causal-necessity-only proponents (especially via ablation)** mistake a component's local implementation role for semantic content and fail to account for distributed/redundant computation. The field's inconsistency in applying these tests selectively *is* the problem you've identified.

  **The Name:** There isn't a single perfect established term. The closest concepts are "**probe-ablation gap**" (descriptive but not widely formalized) or the philosophical "**causal vs. correlational evidence for representation**." However, for your novelist's need—a term for the *specific argumentative slide and inconsistency*—**Functional Decodability Gap** captures the essence well. It highlights the missing link between mere information presence (decodability) and functional use.

  **\answer{Functional Decodability Gap — The disconnect between accessible information and its computational use.}**
