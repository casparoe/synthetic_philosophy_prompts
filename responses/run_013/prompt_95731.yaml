  Here’s a speech that honors the spirit of ubuntu, acknowledges complexity, stays grounded, and fits your requirements. It’s structured for warmth, honesty, and about 3.5 minutes:

  ---

  **(Start with warmth, looking at your sister/partner and the baby)**  
  "Hi everyone. [Baby's Name], look at all these people who showed up just for you! You’ve already got good taste in crowds."

  **(Gently pivot to the core idea)**  
  "My mum shared a beautiful idea with me as we planned today. It’s the idea that none of us become who we are alone. We arrive… whole, absolutely… but we’re shaped, named, *made into people* – bit by bit – by the hands that hold us, the voices that talk to us, the love that surrounds us, and yes, even the boundaries that guide us. It’s not about being unfinished; it’s about being deeply, wonderfully *connected*."

  **(Acknowledge the weight & gift)**  
  "And that connection? It’s the biggest gift we can give. It means [Sister's Name] and [Partner's Name] aren’t alone in this incredible task of raising [Baby's Name]. It means this whole garden full of people today – aunties, uncles, cousins, grandparents, friends who *feel* like family – we’re all saying, ‘We see you. We’re here. You belong with us.’ That’s powerful stuff. It’s a safety net woven from a thousand small kindnesses, shared stories, and moments of care."

  **(Introduce the complex truth – carefully)**  
  "But let's be real for a second. That same power to welcome and shape… it carries weight. It means we have a responsibility – to show up kindly, to listen, to offer the best of ourselves to this little person learning what it means to be human. It means understanding that the stories we tell around them, the way we treat each other *right here*… it all becomes part of their world. It’s not about making them fit a mould, but giving them roots strong enough to let them grow wild and wonderful in their own way. That’s the promise we’re standing in today."

  **(Acknowledge the absence subtly but meaningfully)**  
  "And part of being real, part of truly valuing this connection, is knowing that families are complicated maps. There can be quiet corners, paths that have grown over. Today, surrounded by so much love for [Baby's Name], we might also feel the shape of someone missing. That feeling tells us something important too: that this circle we’re weaving for [Baby's Name]? It’s precious. It needs tending. It thrives on showing up – even when it’s hard – and sometimes requires brave choices to protect its warmth. Let that remind us to cherish the connections we *do* have, right here, right now."

  **(Shift back to pure celebration & commitment)**  
  "So today isn’t just about giving [Baby's Name] a beautiful name – though it is a beautiful name! It’s about all of us saying, ‘Welcome to the circle, [Baby's Name]. We’re your people.’ We promise to be your soft place to land, your cheering section, your sometimes-annoying-but-always-loving guides. We promise to try and show you what good connection looks like, with all its messy, glorious humanity."

  **(End with focused warmth)**  
  "[Sister's Name] and [Partner's Name], you’ve brought an amazing new person into the world, and into this family. We are *so* thrilled he’s/she’s/they're here. And [Baby's Name]? Get ready. Your adventure starts now, and you’ve got one heck of a crew backing you up."

  **(Raise your glass)**  
  "To [Baby's Name]! And to the village that’s already loving them into being."

  ---

  **Why this works for your situation:**

  1.  **Ubuntu Without Jargon:** Explains the core concept ("shaped by the hands that hold us... made into people") without using the term or sounding academic. Focuses on action and connection.
  2.  **Baby as Whole:** Emphasizes the baby arrives "whole," countering the "unfinished" concern. The shaping is about connection, not deficiency.
  3.  **Gift & Weight:** Explicitly calls the connection "the biggest gift" while honestly acknowledging the "responsibility" and "weight" it carries ("it’s a bit frightening").
  4.  **Addresses the Uncle (Subtly):** "Quiet corners," "paths grown over," "shape of someone missing" acknowledges the absence without naming names, blaming, or derailing the celebration. Linking it to the "preciousness" and need for "tending" the circle reinforces the core value while explaining the absence as a consequence of protecting that circle ("brave choices"). It validates the feeling without dwelling.
  5.  **Counters "Conformity":** Directly addresses it: "It’s not about making them fit a mould, but giving them roots strong enough to let them grow wild and wonderful in their own way." Highlights individuality supported by community.
  6.  **Focus on Action:** "Weaving a circle," "tending," "showing up," "cherishing connections" – focuses on what the *family* is taking on, actively.
  7.  **Warm & Grounded Tone:** Uses simple, heartfelt language ("one heck of a crew," "soft place to land," "messy, glorious humanity"). The garden setting subtly reinforces growth and care.
  8.  **No Quotes/Philosophers:** Pure personal reflection and stated values.
  9.  **Auntie-Approachable:** Warm, mentions family, belonging, support, love, responsibility – all resonate deeply.
  10. **Cousin-Respectful:** Avoids cloying sentimentality, acknowledges complexity ("families are complicated maps"), counters conformity explicitly, keeps it real ("let's be real for a second").
  11. **Logistics Free:** As requested.

  **Delivery Tip:** Speak slowly and warmly. Pause after the heavier lines about responsibility and absence to let them land gently before moving back to celebration. Make eye contact around the garden, especially with your sister, her partner, and your mum. Your genuine care will carry it. You've got this!
