prompt: |-
  So I've got a half-formed idea I want to turn into a one-page proposal for a small internal research grant — one semester, no real budget, just my own time. Here's the idea. The usual argument that no condition is luminous — that there's no condition such that, whenever you're in it, you're automatically in a position to know you're in it — always seems to get run on conditions that are vague or come in degrees, like feeling cold or being in pain, where the boundary is fuzzy. My suspicion is that the argument only bites because of that fuzziness, and that if you swap in a condition with a stipulated sharp boundary — a gauge reading above some exact value, say, or a coin having come up heads — luminosity might come back. If it does, the anti-luminosity result is really a fact about our concepts being inexact rather than about knowledge or minds. If it doesn't come back even for sharp conditions, then something deeper is going on and I want to know what. So turn this into the proposal, with exactly these five parts and nothing else: (1) the question, stated so it has a determinate answer; (2) why the going positions on luminosity don't already settle it; (3) the method — what I'd actually do week by week over the semester, and why that beats the obvious alternative of just surveying the literature; (4) what a positive result would look like versus what would count as the project failing; (5) an honest call on whether this fits in a semester or is definately a dissertation. Give me exactly five numbered items, a sentence or two each, no intro and no conclusion. Skip citations, I'll add them myself. American English.
