answer: |-
  The plane touched down on red dust. Dr. Elara Vance blinked against the brutal sun, her linguist’s brain already parsing the unfamiliar phonemes shouted by the ground crew. She wasn’t here for gavagai. She was here because two families were about to come to blows, possibly worse, over a contested valley called *Kaelan*, and the only person who spoke *any* version of the regional dialect *and* Standard Trade was a grad student currently hospitalized with Rift Valley fever. Enter Elara, specialist in understudied agro-pastoralist languages, emergency translator.

  The stakes were carved into the landscape itself: terraced slopes painstakingly maintained by the Haelin family, generations of stonework holding back erosion; adjacent grazing lands, vital for the semi-nomadic Torvan clan, scarred by recent, disputed fencing. The word at the heart of it all was *dren*. "The Haelin *dren* Kaelan," the elders insisted. "The Torvan *dren* the upper pastures." But what did it *mean*?

  Elara had worked non-stop for three days. She’d recorded histories, boundary descriptions, disputes, and mundane chatter. She’d built translation manuals, painstaking grids mapping *dren* to possible concepts. And she’d built *two* equally valid ones.

  **Manual Alpha:**
  *   *Dren* ≈ Owns (Permanent, transferable right, survives absence, violation possible without immediate detection).
  *   "Haelin *dren* Kaelan" = Haelin *owns* Kaelan (implying historical claim, inheritance).
  *   Torvan fencing unused slopes = Violation, trespass.
  *   Haelin fallowing a field for a season = Still *dren* it.

  **Manual Beta:**
  *   *Dren* ≈ Actively Uses/Works (Continuous, lapses with disuse, requires current presence/labour).
  *   "Haelin *dren* Kaelan" = Haelin *actively works* Kaelan (meaning the terraces they currently cultivate).
  *   Torvan fencing unused slopes = Claiming unused land, potentially legitimate if Haelin weren't actively using it.
  *   Haelin fallowing a field = Temporarily *not dren* it.

  Every recorded utterance slid perfectly into both frameworks. An elder describing his grandfather "holding" (*dren*) the land before him? Alpha saw inheritance; Beta saw a lineage of continuous use. A complaint about someone "taking what another *dren*"? Alpha saw theft of property; Beta saw disruption of current activity. The language lacked explicit tense markers for states like possession, and modifiers like "always" or "formerly" were applied inconsistently, absorbed by both manuals without strain.

  Desperation gnawed at Elara. Tomorrow, she stood between the Haelin patriarch, Jorik, his hands like gnarled roots, and the Torvan spokeswoman, Lira, eyes like flint. They would speak; she would translate their claims about who *dren* Kaelan. Her choice of manual would dictate the reality presented to the opposing side, potentially igniting the conflict she was meant to prevent.

  She tried the classic moves.

  "Jorik," she asked through a local assistant, pointing to a meticulously tended vegetable patch near his house. "This plot. Your father worked it?"
  "*Aya*. My father *dren* it."
  "And before him, his father?"
  "*Aya*. Grandfather *dren* it."
  "So, same plot, always Haelin?" she pressed, hoping for a commitment to enduring identity.
  Jorik looked puzzled. "It is the earth. We Haelin *dren* it. My blood *dren* it before me." Perfectly compatible with both manuals – a chain of ownership *or* a chain of continuous use.

  She tried modifiers. In Standard Trade, "own" could be "rightfully own," "formerly own," "solely own." She tested equivalents.

  "Lira," she asked, gesturing to a distant, overgrown slope the Torvan occasionally used for dry-season grazing, but which the Haelin also mentioned in ancestral songs. "Does anyone *dren* that slope now?"
  Lira shrugged. "Old sun-place. Wind *dren* it now. Sometimes goat *dren* it." Elara probed: "But the land itself? Who *dren* the land?"
  "The land is. Goat eats, goat *dren*." The concept of the land itself being the object of a static *dren* seemed slippery. Both manuals handled it: Alpha – ownership is currently absent/lapsed? Beta – only current users *dren*.

  She devised hypotheticals. "Jorik, if… if the Haelin left Kaelan. Went far away for ten rains. Came back. Would you still *dren* it?"
  Jorik’s face darkened. "Leave Kaelan? Why? Haelin bones *are* Kaelan." Not an answer. Cultural incomprehension masked the linguistic indeterminacy.

  "Lira, if a family plants seeds but must leave before harvest, do they still *dren* the field?"
  Lira frowned. "Seeds grow. Sun *dren*, rain *dren*. If family not there, who tends? Birds eat." Again, the focus was on the *act*, not the abstract right. Both manuals could parse it – ownership persists but use is interrupted (Alpha), or *dren* lapses without current tending (Beta).

  Frustration was a live wire under her skin. She opened her notebook, not to her meticulously organized field notes, but to the back page where she’d scrawled a reminder to herself: *Call Mom re: property tax.* Property tax. *Ownership*.

  A memory surfaced, sharp and unbidden. Her grandfather’s farmhouse, sold after he died. The legal papers: "Vance, Elara M., now holds fee simple absolute title..." But what did *that* mean, stripped of legalese? She remembered visiting the empty house a year after the sale. The new owners hadn't moved in yet. Weeds choked the garden her grandmother had loved. Did she, Elara, still feel it was *hers* in some way? The pang of loss said yes, a visceral connection persisting beyond legal transfer. Yet, legally, she *owned* nothing there. Conversely, renting her current apartment – she possessed keys, controlled the space, *used* it exclusively, but didn't *own* it. The English words "own" and "possess" and "use" blurred at the edges too, context-dependent, carrying unspoken assumptions about duration and rights. Her own linguistic bedrock felt suddenly sandy. She couldn’t even use her concept of "ownership" as a fixed point to anchor *dren*; it contained its own latent ambiguities. The thought was dizzying, a hall of mirrors reflecting the indeterminacy back into her own mind.

  Night fell. The negotiation table, a rough-hewn slab under a thatched awning, waited. Elara stared at her two manuals, Alpha and Beta, laid side by side like divergent futures.

  *Choose.*

  If she used Alpha ("owns"):
  *   She tells the Torvan: "The Haelin claim permanent ownership of Kaelan, based on generations of inheritance." This paints the Torvan’s grazing as trespass on private property. Jorik will likely demand removal of fences, compensation. Lira will hear theft of communal land, an outrageous claim by sedentary farmers to territory they don’t actively use entirely. Conflict escalates. The Torvan lose vital grazing; the Haelin feel vindicated but face ongoing tension.

  If she uses Beta ("currently uses"):
  *   She tells the Torvan: "The Haelin claim current use of the terraced portions of Kaelan." This implicitly frames the unused upper slopes as potentially available. Lira will assert Torvan *dren* (use) of those slopes. Jorik will hear an attack on his ancestral, inherent right to the *whole* valley. He might storm out. The Haelin lose perceived security; the Torvan gain ground but face bitter resentment.

  There was no third option. No hidden meaning. No magical question she hadn’t asked. The evidence was exhausted. *Dren* floated, semantically unanchored, between two radically different concepts of relationship to land. Her choice wouldn’t reveal truth; it would *create* it for the purpose of this negotiation. It would cost someone – possibly both sides – something vital: land, security, dignity, peace.

  She picked up Manual Alpha. The paper felt heavy. Permanent ownership. It felt… cleaner. More like the legal frameworks she understood. Jorik would be pleased. But it was an arbitrary stab in the dark, a choice made because a choice *had* to be made, because the plane had landed, because the fever took the grad student, because language, sometimes, refuses to yield its secrets even when lives depend on it.

  She walked to the table as dawn bled red over Kaelan. Jorik and Lira sat, eyes locked, radiating mutual suspicion. Elara took her seat, the weight of the untranslatable *dren* settling on her shoulders like a physical burden. She opened her mouth, choosing Alpha, choosing "owns," choosing a path of conflict rooted in permanence, knowing she was about to tell a story that might cost the Torvan their grazing lands, cost the Haelin their peace, cost her a piece of her belief in the determinacy of meaning. The loss wasn't just in the outcome; it was in the terrible necessity of the arbitrary choice itself, the silent scream of the underdetermined word finally forced into a single, costly shape.
