answer: |-
  Below is a decision tree designed to clarify interpretations of the Free Energy Principle (FEP), starting from the shared commitment that **the brain continuously predicts sensory input and corrects prediction errors**. Each node is a concrete question answerable by analyzing a case study (thermostat, bacterium, or trained neural network). The leaves correspond to named positions in the literature, including the distinction between explaining *why* a system persists at all (A) vs. *how* it persists (B). Empty branches indicate combinations no major position occupies, with brief explanations.  

  ---

  ### **Decision Tree: Interpretations of the Free Energy Principle**  
  **Start:** All readers begin here.  

  #### **Node 1: Literal Process or Modeling Tool?**  
  *When a bacterium chemotaxes toward nutrients, is it literally minimizing free energy (like metabolism produces ATP), or is free-energy minimization just a useful math trick to model its behavior?*  
  - **Literal process (Yes)**: → Node 2  
  - **Modeling convenience (No)**: → Node 5  

  #### **Node 2 (Literal): Universal or Restricted?**  
  *Does free-energy minimization apply to any persistent system (e.g., a hurricane maintaining its structure) or only systems with a "generative model" (e.g., a trained neural network that simulates inputs)?*  
  - **Universal (all self-organizing systems)**: → Node 3  
  - **Restricted (generative models only)**: → Node 6  

  #### **Node 3 (Literal + Universal): Markov Blanket Status?**  
  *In a cell, is the Markov blanket a physical boundary (like the cell membrane) or just a conceptual partition we impose (like drawing a box around a thermostat)?*  
  - **Real boundary**: → Node 4  
  - **Modeling convenience**: → *Empty*  
    *Why?* A literal universal process requires a real boundary to define the system; otherwise, free-energy minimization lacks a physical anchor.  

  #### **Node 4 (Real Boundary): Derived or Primitive?**  
  *Is the FEP derived from physics (e.g., thermodynamics demands free-energy minimization) or a standalone law (e.g., like natural selection)?*  
  - **Derived from basics**: → Node 7  
  - **Primitive axiom**: → *Empty*  
    *Why?* No position treats FEP as a universal physical primitive; it’s always derived (e.g., from statistical mechanics).  

  #### **Node 7 (Derived): Falsifiable?**  
  *Could we find a system that persists *without* minimizing free energy (e.g., a crystal growing in a way that violates FEP predictions)?*  
  - **Falsifiable (Yes)**: → Node 8  
  - **Unfalsifiable (No)**: → **UNF (Unfalsifiable Framework)**  

  #### **Node 8 (Falsifiable): Explains Why or How?**  
  *Does the FEP explain why a bacterium exists at all (A), or just how it stays alive (B)?*  
  - **Why (A)**: → **FPL (First-Principles Law of Self-Organization)**  
    *E.g., FEP as the *reason* non-equilibrium systems exist, per Friston’s strong claims.*  
  - **How (B)**: → *Empty*  
    *Why?* If FEP is literal/universal/falsifiable, it must explain *why* systems persist; otherwise, it loses its "law" status.  

  #### **Node 6 (Literal + Restricted): Markov Blanket Status?**  
  *In a neural network, is the Markov blanket a real partition (e.g., hardware layers) or a modeling choice (e.g., separating "hidden" and "output" units for analysis)?*  
  - **Real boundary**: → *Empty*  
    *Why?* Positions restricting FEP to generative models treat Markov blankets as modeling tools (not physical) to define inference.  
  - **Modeling convenience**: → Node 9  

  #### **Node 9 (Modeling Convenience): Explains Why or How?**  
  *Does the FEP explain why brains evolved (A) or just how they process predictions (B)?*  
  - **Why (A)**: → *Empty*  
    *Why?* Restricted readings (e.g., predictive coding) don’t claim FEP explains existence—only function.*  
  - **How (B)**: → **CPC (Computational Predictive-Coding Reading)**  
    *E.g., FEP as a theory of brain function (prediction-error minimization), dropping thermodynamics.*  

  #### **Node 5 (Modeling): Universal or Restricted?**  
  *Can FEP model *any* system (e.g., a thermostat) or only generative systems (e.g., a Bayesian neural net)?*  
  - **Universal**: → Node 10  
  - **Restricted**: → Node 11  

  #### **Node 10 (Modeling + Universal): Markov Blanket Status?**  
  *When modeling an ecosystem, is the Markov blanket a real boundary (e.g., the forest edge) or a heuristic (e.g., grouping species for analysis)?*  
  - **Real boundary**: → *Empty*  
    *Why?* Modeling readings reject reifying boundaries—Markov blankets are always analytical tools.*  
  - **Modeling convenience**: → Node 12  

  #### **Node 12 (Modeling + Convenience): Formal Duality?**  
  *Is FEP a formal analogy (e.g., like Hamiltonian mechanics describing both particles and economies)?*  
  - **Yes (duality)**: → **VM (Variational-Mechanics Reading)**  
    *E.g., FEP as a mathematical equivalence between inference and dynamics, with no ontological claims.*  
  - **No (instrumental)**: → *Empty*  
    *Why?* Universal modeling positions either embrace duality (VM) or instrumentalism (Node 11).  

  #### **Node 11 (Modeling + Restricted): Derived or Primitive?**  
  *In a neural network, is FEP derived from Bayesian inference, or just a primitive tool (like loss functions in machine learning)?*  
  - **Derived**: → *Empty*  
    *Why?* If restricted to generative systems, FEP is derived from Bayesian theory—but this collapses into CPC (Node 9).*  
  - **Primitive**: → **INST (Instrumentalist Reading)**  
    *E.g., FEP as a *useful fiction* for designing AI, with no commitment to truth.*  

  ---

  ### **Leaf Positions**  
  1. **FPL (First-Principles Law)**:  
     - Literal, universal, real Markov blanket, derived, falsifiable, explains *why* (A).  
     - *Case*: Bacterium chemotaxis *is* free-energy minimization, explaining why life exists.  

  2. **CPC (Computational Predictive-Coding)**:  
     - Literal, restricted, Markov blanket as tool, explains *how* (B).  
     - *Case*: Trained network minimizes prediction errors *as if* doing Bayesian inference.  

  3. **VM (Variational-Mechanics)**:  
     - Modeling, universal, Markov blanket as tool, formal duality (unfalsifiable), explains *how* (B).  
     - *Case*: Thermodynamics of a thermostat *formally resembles* Bayesian inference.  

  4. **INST (Instrumentalist)**:  
     - Modeling, restricted, primitive, unfalsifiable, explains *how* (B).  
     - *Case*: Use FEP to design predictive algorithms, without believing brains *are* Bayesian.  

  5. **UNF (Unfalsifiable Framework)**:  
     - Literal or modeling, unfalsifiable (adapts to any observation).  
     - *Case*: Reinterpreting *any* system behavior (e.g., crystal growth) as free-energy minimization.  

  ---

  ### **Notes on Ambiguity & Empty Branches**  
  - **UNF appears in two branches** (Nodes 7 and implicitly in VM/INST), but I consolidate it into one leaf since all unfalsifiable readings share core weaknesses (e.g., no risk of falsification).  
  - **Empty branches (7/9)** arise from logical tensions:  
    - Literal universal FEP *must* explain *why* (A) to be a "first-principles law."  
    - Restricted readings (CPC/INST) *cannot* explain *why* (A) without collapsing into FPL.  
  - **Defended structure**: The tree prioritizes the **scope** (universal/restricted) and **ontological commitment** (literal/modeling) as primary splits. These best capture literature divides (e.g., FPL vs. CPC). The *why/how* distinction cross-cuts leaves but is resolved contextually (e.g., FPL requires *why*).  

  This tree forces students to confront *what FEP explains* and *how it could fail*, moving beyond "just Bayesianism."
