     But note: VM is unfalsifiable but it is a named position. So we don't call it UNF.

     Therefore, we have:

     - FPL: only the literal/universal/derived/falsifiable/why branch.
     - CPC: literal/restricted/modelingMarkov/derived/falsifiable/how.
     - VM: modeling/universal/modelingMarkov/derived/unfalsifiable/how.
     - INST: modeling/restricted/modelingMarkov/primitive/unfalsifiable/how.
     - UNF: any other unfalsifiable branch.

     So we adjust:

     - In the literal/universal branch: 
          - derived and unfalsifiable -> UNF
          - primitive and unfalsifiable -> UNF
     - In the literal/restricted branch: unfalsifiable -> UNF
     - In the modeling/universal branch: primitive and unfalsifiable -> UNF

     And we remove the specific UNF leaves and just have one UNF leaf.

     Now, we write the tree with the above structure.

     Final Tree:

