prompt: |-
  Im putting together the handout for my grad seminar on complicity, and before we wade into the theories of individual responsibility for climate/meat/voting I want the spec on the table first. Give me the desiderata any adequate theory of an individual's contribution to a collectively caused harm has to meet -- the cases it has to get right, the distinctions it can't collapse, the background results it can't contradict -- with the case behind each one, and mark which are non-negotiable and which are just the commitments of one camp. It has to survive the cases I use to break students: the harmless torturers; a threshold case where the harm needs the acts to cross a level but no single act is necessary or sufficient; a probabilistic case where each of us only nudges the odds and nobody can point to a harm they made more likely; and one of my own constructions -- a harm that occurs only when the number of contributors lands inside a band, nothing below it and a failsafe kicks in above it, so that contributing more can make things better. Flag any pair of desiderata you think can't both be met, thats the part I most want to see. Skip the scorecard, we'll do that in class.
reasoning: |-
  Okay, the user is putting together a handout for a grad seminar on complicity, specifically focusing on theories of individual responsibility for collectively caused harms. They want desiderata for any adequate theory, with cases illustrating each. The cases they mentioned are harmless torturers, threshold, probabilistic, and their own banded harm case. They also want to flag any conflicting desiderata.

  First, I need to recall the standard cases in collective harm. The harmless torturers from Parfit is classic—individual acts seem harmless but collectively cause harm. Threshold cases involve cumulative actions needing to cross a level, like voting or pollution. Probabilistic cases are about increasing risk without direct causation, like driving drunk. The user's banded harm case is tricky because more contributors can prevent harm if they exceed the band. 

  The user is a grad seminar leader, so they need a structured handout that sets up debates. They want desiderata that theories must meet, with non-negotiables vs. camp-specific commitments. Highlighting conflicts between desiderata is crucial for seminar discussions. 

  Key desiderata should cover necessity, sufficiency, thresholds, probability, overdetermination, responsibility gaps, and the banded harm case. Non-negotiables might include avoiding responsibility gaps and handling overdetermination. The banded harm case challenges theories because contributing more can be beneficial, which might conflict with additive models.

  Conflicts to flag: Threshold Requirement vs. No Harmless Contributors could clash. If each act isn't sufficient and only the collective crosses the threshold, holding individuals responsible might violate the no-harmless contributor intuition. Also, Banded Harm Compatibility vs. Monotonic Contribution might conflict since adding acts reduces harm beyond the band, challenging the idea that more contribution always worsens harm.

  I should structure each desideratum with the case, its importance, and whether it's non-negotiable. For example, the responsibility gap is non-negotiable because a theory that leaves harm unaccounted for is inadequate. The banded harm case shows where monotonicity fails, so theories need flexibility.

  Also, considering the user's deep needs: they want to provoke critical thinking. Highlighting conflicts between desiderata will stimulate debate. They might also appreciate distinguishing between conceptual necessities and theoretical commitments, helping students evaluate different frameworks.
answer: |-
  Here are the core desiderata for an adequate theory of individual contribution to collectively caused harm, structured around your breaking cases and key conceptual challenges. Conflicts are flagged at the end.

  **Core Non-Negotiables (Conceptual Necessities):**

  1.  **Avoid the Responsibility Gap:**
      *   **Case:** *Threshold Case* (e.g., 1000 villagers each diverting a trickle of poison into a reservoir; 999 cause no harm, the 1000th causes the lethal dose. Who is responsible for the death?).
      *   **Desideratum:** The theory MUST account for the total harm and assign responsibility to individuals *in some way* such that the harm isn't "unowned" or mysteriously emerges without any contributors being responsible. A theory that implies *no one* is responsible for the death in the threshold case fails.
      *   **Why Non-Negotiable:** A theory that allows massive harms to occur with no one bearing any responsibility is ethically and explanatorily bankrupt.

  2.  **Reject Strict Necessity/Sufficiency:**
      *   **Case:** *Threshold Case & Probabilistic Case.*
      *   **Desideratum:** The theory MUST NOT require that an individual act be *necessary* (but for my act, the harm wouldn't have occurred) or *sufficient* (my act alone could have caused the harm) for it to count as a contribution generating responsibility. It must handle cases where no single act meets these criteria.
      *   **Why Non-Negotiable:** Collective harm problems are defined by the absence of strict necessity/sufficiency for individual acts. Requiring them collapses the problem into standard individual causation.

  3.  **Handle Overdetermination & Preemption:**
      *   **Case:** *Variations on Threshold/Probabilistic* (e.g., 1500 villagers divert poison, only 1000 needed; or 1000 villagers each flip a switch that *would* have released poison if the threshold wasn't already met by others).
      *   **Desideratum:** The theory MUST assign responsibility fairly and plausibly in cases where the collective act is overdetermined (more than enough contributions) or where individual contributions are preempted (their act wasn't needed because others already caused the harm).
      *   **Why Non-Negotiable:** Real-world collective harms often involve redundancy, excess participation, or "redundant causation." A theory must navigate this without absurdity (e.g., blaming only the "last" contributor).

  4.  **Acknowledge Marginal Impact (Even When Microscopic):**
      *   **Case:** *Harmless Torturers* (Parfit): 1000 torturers each press a button delivering a tiny, imperceptible shock; together they deliver a lethal shock. Each individual act seems harmless.
      *   **Case:** *Probabilistic Case* (e.g., millions voting for a harmful policy where each vote only minutely increases its chance; or individual CO2 emissions slightly increasing risk of future climate harm).
      *   **Desideratum:** The theory MUST recognize that an individual act can be a *genuine contribution* even if its *marginal impact* on the specific harm instance is vanishingly small, imperceptible, or probabilistic. It cannot collapse into saying "my act made no difference, therefore I bear no responsibility."
      *   **Why Non-Negotiable:** This is the core challenge of collective harm. Denying microscopic contributions leads straight to the Responsibility Gap.

  **Critical Distinctions & Commitments (Often Camp-Specific, but Essential for Evaluation):**

  5.  **Distinguish Causal Contribution vs. Complicity/Benefiting:**
      *   **Case:** *Buying Meat* (Individual purchase doesn't cause a specific animal death due to industrial systems, but benefits from/votes for the system). *Voting for Harmful Policy* (contribution is constitutive, not directly causal).
      *   **Desideratum:** The theory MUST clearly articulate whether it grounds responsibility in *causal contribution to the harm*, *participation in a harmful practice/system*, *benefiting from the harm*, or some combination. It must not *unjustifiably* collapse these distinct relations.
      *   **Commitment:** While distinction is crucial, *how* these are weighted and related defines camps (e.g., causal minimalists vs. structural complicity theorists).

  6.  **Graduated Responsibility:**
      *   **Case:** *Threshold Case* (Is villager #1000 more responsible than #1? Villager #1001?). *Probabilistic Case* (Is someone doubling their emissions twice as responsible?).
      *   **Desideratum:** The theory SHOULD allow responsibility to vary based on the *nature* and *magnitude* of the individual's contribution (e.g., size of emissions, number of votes cast, frequency of meat consumption) and potentially *knowledge/intent*. It should avoid an implausible "all or nothing" approach where all contributors bear identical responsibility regardless of scale.
      *   **Commitment:** How finely responsibility scales with contribution is debated (linear? diminishing returns? thresholds?), but flat equality is generally seen as implausible.

  7.  **Threshold Requirement:**
      *   **Case:** *Threshold Case* (Villagers 1-999 seem to do "nothing" harmful).
      *   **Desideratum:** Some theories (e.g., certain collective obligation views) REQUIRE that an act is only wrongful/countable if it is performed when the collective is *at or near* the threshold of causing harm. Acts far below the threshold are not contributions generating responsibility for *that* harm.
      *   **Commitment:** This is a major camp divider. Critics argue it violates the "Avoid Responsibility Gap" desideratum and fails the Probabilistic/Harmless Torturer cases.

  8.  **Avoid "No Harmless Contributors" Intuition (or Explain It Away):**
      *   **Case:** *Harmless Torturers, Probabilistic Case.*
      *   **Desideratum:** Some theories (e.g., strict counterfactual dependence, certain threshold views) yield the intuitive but problematic result that Villagers 1-999 did "nothing wrong" or caused "no harm." An adequate theory MUST either *satisfy* this intuition plausibly OR provide a compelling explanation for why it's *misleading* (e.g., focusing on marginal impact, participation in a risky practice).
      *   **Commitment:** This is deeply contested. Some see satisfying this intuition as essential to avoiding over-criminalization; others see rejecting it as essential to capturing collective reality.

  9.  **Banded Harm Compatibility:**
      *   **Case:** *Your Banded Harm Case* (e.g., Harm occurs only if contributors N are between 50 and 100. Below 50, a safety mechanism prevents harm. Above 100, a fail-safe prevents harm. Contributing *more* beyond 100 makes harm *less* likely/prevents it).
      *   **Desideratum:** The theory MUST plausibly assign responsibility in this non-monotonic scenario. It needs to explain why contributing between 50-100 is wrongful/bad (contributing to harm), why contributing below 50 is permissible/neutral, and crucially, why contributing *above* 100 is permissible/good (preventing harm via the fail-safe), even though the individual act *looks identical* in isolation. It must handle the fact that adding contributors *reduces* the risk/harm once past 100.
      *   **Commitment:** This tests theories relying on simple aggregation or monotonic increase assumptions. It's a powerful probe for structural/system-focused views.

  **Flagged Conflicts Between Desiderata:**

  *   **Threshold Requirement (7) vs. Avoid Responsibility Gap (1) & No Harmless Contributors Intuition (8):** This is the core tension. If you *require* being near the threshold for responsibility (7), then contributors below the threshold (Harmless Torturers, Villagers 1-999) are **not** responsible for the harm. This *satisfies* the "No Harmless Contributors" intuition (8) but risks creating a **Responsibility Gap (1)** – how is the harm accounted for? Proponents of (7) must explain the gap (e.g., via collective agency, or denying responsibility for the *harm* while allowing other wrongs like risk imposition). Opponents argue (7) *causes* the gap.
  *   **Banded Harm Compatibility (9) vs. Monotonic Contribution:** Many intuitive theories (especially counterfactual or linear contribution models) assume that *adding a contribution always makes the harm more likely or worse*. Banded Harm (9) *violates* this monotonicity explicitly. A theory satisfying (9) must abandon strict monotonicity in its core causal/moral assessment of individual acts, focusing instead on the act's role *within the system/rules* at the time of action. This conflicts with simple additive models.
  *   **Acknowledge Marginal Impact (4) vs. Avoid "No Harmless Contributors" Intuition (8):** Satisfying (4) (each tiny act *is* a contribution) directly contradicts the strong intuition that Villager #1 or a Harmless Torturer did "nothing harmful" (8). A theory must either argue the intuition is wrong (emphasizing 4) or find a way to acknowledge microscopic impact *without* assigning full-blown responsibility for the harm (e.g., assigning responsibility for *risk* or *participation* instead).

  **How to Use This Handout:** Present these desiderata and cases *before* diving into specific theories (Causal, Counterfactual, Participatory, Collective Obligation, Structural Complicity, etc.). Frame the seminar around evaluating how well each theory navigates these constraints, especially the conflicts. Ask students: Which desiderata does this theory prioritize? Which does it struggle with? Does it resolve or dissolve the conflicts? This sets the stage for a rigorous comparative analysis in your "scorecard" sessions. Good luck breaking brains!
