prompt: |-
  I am preparing a graduate seminar on the practical sensitivity of knowledge, and before my students evaluate any of the accounts on offer I want a clean statement of what an account of this phenomenon would have to deliver. Write that specification: the desiderata any theory of the relation between practical stakes and knowledge must satisfy, each paired with the case or consideration that motivates it. No survey, no bibliography, no citations — I know the literature; what I need is the criteria.

  Treat the following as the phenomena the theory must accommodate, and convert each into a requirement while saying what it forces:

  - The basic contrast: the same person, with the same evidence and the same truth on her side, is credited with knowing when little turns on it and denied knowledge when a great deal turns on it, and competent speakers do not take themselves to be contradicting one another when they disagree about such a case.
  - The third-person case, in which the attributor's stakes come apart from the subject's, and the subject's from what is objectively at stake.
  - The retrospective case: we learn afterward that the stakes were enormous all along. Does the earlier denial or ascription get revised, and if knowledge is a state someone had at a time, what does it mean for the stakes of that time to be settled only later?
  - Stakes the subject cannot in principle assess — an agent whose action will matter enormously but who has no way of knowing that — and the related worry that a stakes-sensitive theory makes knowledge depend on facts nobody could have known.
  - The collective case: many agents, each facing stakes too small to matter to her individually, whose combined decisions produce a catastrophic outcome. Whose stakes count, and at what level of aggregation?
  - The self-serving cases: an agent who tries to buy knowledge by lowering her own stakes — resolving in advance to follow a checklist, delegating the judgment to someone else, deciding not to care. Is that a legitimate route to knowledge or a loophole, and can the theory say which without making the threshold arbitrary?
  - The linguistic evidence: retraction, apparent faultless disagreement, and the behavior of stakes-sensitivity inside conditionals, under negation, and in reports of what someone else knew.

  Then tell me which of these are genuine desiderata and which are the commitments of a single camp dressed up as requirements; whether some subset is jointly unsatisfiable — this is the part I care most about, and I want the trade-off named rather than smoothed over; and which single requirement does the most to eliminate candidates. Finish with a few sentences scoring the four families against the list — context-sensitive "knows," stakes-sensitive knowledge, the classical stakes-insensitive account, and assessment-relative attributions — but keep the weight on the criteria, since that is where the thinking is.
reasoning: |-
  Okay, let me approach this systematically. The user is preparing a graduate seminar on practical sensitivity of knowledge and needs a clear specification of desiderata for theories. They've listed seven phenomena that must be accommodated, each requiring conversion into theoretical requirements.

  First, I need to understand the core challenge: distilling complex philosophical debates into crisp criteria without scholarly apparatus. The user explicitly wants no survey or citations—just the conceptual bones. 

  Starting with the basic contrast phenomenon. This seems foundational—any theory must explain how identical epistemic conditions yield different knowledge attributions based on stakes, while preserving linguistic coherence. The requirement should capture this variability without contradiction. 

  For the third-person case, the key is disentangling multiple stake-holders. A theory must specify whose stakes matter—attributor's, subject's, or some objective measure—and why. This exposes a fault line in contextualist vs. invariantist approaches. 

  The retrospective case raises temporal issues. If stakes change post-hoc, does knowledge status retroactively change? This tests whether knowledge is a persistent state. The requirement must address metaphysical implications. 

  Stakes the subject can't assess is perhaps the sharpest challenge. It threatens to make knowledge depend on inaccessible facts, violating core epistemic principles. A viable theory must either accommodate this or explain why it's illusory. 

  The collective case introduces aggregation problems. When minor individual stakes sum to catastrophe, whose threshold applies? This pressures theories to define the "stake-holding unit" clearly. 

  Self-serving cases probe for loopholes. If agents can manipulate stakes to "gain" knowledge, does the theory permit this? The requirement should guard against trivialization. 

  Linguistic evidence feels different—it's meta-constraint about how attributions behave in discourse. This may favor contextualist approaches but could be question-begging if presented as neutral. 

  Now for the harder part: identifying which "requirements" are actually partisan commitments. For example, demanding faultless disagreement as non-negotiable stacks the deck for relativism. The retrospective revision requirement presupposes temporal flexibility that invariantists reject. 

  The real tension lies between requirements 3 (retroactive stakes) and 4 (inaccessible stakes). If knowledge depends on actual stakes (per 4), but those can only be known later (per 3), we get a paradox: one couldn't know whether one knew at the time. This sinks strict invariantism. 

  The most eliminative criterion is clearly requirement 4—it immediately rules out theories where knowledge supervenes only on subject-accessible factors. 

  Finally, scoring the families: 
  - Contextualism handles 1,2,7 well but struggles with 3 and 4. 
  - Stakes-sensitive invariantism nails 3 and 4 but fails 1 and 2. 
  - Classical invariantism rejects most requirements but avoids 4's problems. 
  - Relativism excels at 1 and 7 but stumbles on 3 and 5. 

  The trade-offs are stark: accept that knowledge can depend on unknown stakes (embracing requirement 4) or reject linguistic data (dismissing requirement 1). There's no free lunch here—that's what the seminar should confront.
answer: |-
  Here is a clean specification of desiderata for any theory of practical stakes and knowledge, derived from your stipulated phenomena. Each requirement is paired with its motivating case and the theoretical pressure it creates:

  1.  **Requirement: Variable Threshold with Non-Contradiction (R1)**
      *   **Motivation:** The basic contrast (low-stakes ascription, high-stakes denial; competent speakers not hearing contradiction).
      *   **Forces:** The theory must allow the *truth-conditions* of "S knows that p" to vary with practical stakes while explaining why denials and ascriptions in contrasting stakes contexts *don't* straightforwardly contradict each other. It must capture the intuitive non-absurdity of such disagreements.

  2.  **Requirement: Independence of Stake-Holders (R2)**
      *   **Motivation:** Third-person cases (divergent stakes between attributor, subject, objective situation).
      *   **Forces:** The theory must specify *whose* stakes (attributor, subject, objective, or other) determine the relevant threshold for knowledge ascription, explain *why* that stake-holder is privileged, and handle cases where these stakes conflict without collapsing into implausibility.

  3.  **Requirement: Temporal Fixity of Knowledge State (R3)**
      *   **Motivation:** Retrospective case (learning stakes were high all along).
      *   **Forces:** The theory must take a stand on whether knowledge is a state S *had at t* or is *ascribed at t'*. If the former, it must explain why later discovery of high stakes *doesn't* retroactively falsify a past low-stakes ascription (or vice-versa). If the latter, it must explain the apparent *temporality* of "knew". It must resolve the tension between knowledge's apparent persistence and stakes-sensitivity.

  4.  **Requirement: Epistemic Accessibility Constraint (R4)**
      *   **Motivation:** Stakes the subject cannot assess (knowledge depending on unknown stakes).
      *   **Forces:** The theory must either *deny* that such cases show knowledge *actually* depends on inaccessible stakes, or *accept* that knowledge can depend on facts unknowable to S at the time (and explain how this avoids making knowledge itself radically inaccessible or mysterious).

  5.  **Requirement: Aggregation & Unit of Agency (R5)**
      *   **Motivation:** Collective case (minor individual stakes summing to catastrophe).
      *   **Forces:** The theory must define the *relevant agent* and *relevant stakes* for knowledge ascription: individual stakes only, aggregated group stakes, or some other unit. It must explain how/if the individual's knowledge status is affected by the collective outcome *they could not foresee or control*.

  6.  **Requirement: Non-Manipulability (R6)**
      *   **Motivation:** Self-serving cases (agents lowering their own stakes to "gain" knowledge).
      *   **Forces:** The theory must either provide principled grounds for rejecting such maneuvers as illegitimate paths to knowledge (e.g., by defining stakes non-subjectively), or accept them as legitimate consequences of the view. Crucially, it must avoid making the threshold *arbitrarily* dependent on easily manipulable factors.

  7.  **Requirement: Linguistic Adequacy (R7)**
      *   **Motivation:** Linguistic evidence (retraction, disagreement, embeddings).
      *   **Forces:** The theory must provide a plausible semantic/pragmatic model for "knows" that explains patterns like: retraction of past ascriptions when stakes rise ("I didn't *know*"), apparent faultless disagreement in stakes-shifted contexts, and the behavior of "knows" under negation, in conditionals ("If he knows, we're safe"), and in indirect reports ("She said I knew").

  **Desiderata vs. Partisan Commitments:**

  *   **Genuine Desiderata (Neutral Arbiter):** R1 (capturing the core phenomenon), R2 (handling divergent perspectives), R3 (addressing temporality), R4 (confronting epistemic access), R5 (handling collective action). These stem directly from the phenomena *as described*.
  *   **Potentially Partisan:** R6 (Non-Manipulability) and especially R7 (Linguistic Adequacy). While motivated by linguistic data, *requiring* a specific semantic treatment (e.g., context-sensitivity or relativism) to satisfy R7 stacks the deck against invariantist views from the outset. Similarly, R6's demand for "non-arbitrary" rejection of self-serving cases implicitly favors objective or non-subjective stakes, potentially biasing against subject-sensitive invariantism.

  **Joint Unsatisfiability & Key Trade-off:**

  The most significant tension lies between **R1 (Variable Threshold/Non-Contradiction)** and **R4 (Epistemic Accessibility Constraint)**.

  *   **The Trade-off:** Satisfying R1 robustly (explaining the core contrast and linguistic patterns like disagreement/retraction) strongly pushes towards views where the truth-conditions of "S knows p" depend on *contextual* factors (attributor's stakes, assessor's standards – R2, R7). However, this typically makes knowledge depend on factors *external* to S's epistemic position (like the attributor's concerns), violating R4's spirit by potentially making knowledge depend on facts *nobody* relevant (S or attributor) knows (e.g., if attributor's stakes are high but unknown to anyone). Conversely, satisfying R4 robustly (tying knowledge *only* to factors accessible to S, like S's *own* stakes or purely epistemic factors) makes satisfying R1 and R7 extremely difficult, as it struggles to explain the variability in ascriptions and linguistic behavior without attributing widespread error.

  **The Most Eliminative Requirement:**

  **R4 (Epistemic Accessibility Constraint)** is the most potent eliminator. It directly challenges the *metaphysical* coherence of any view claiming knowledge depends on *actual* (especially unknown) stakes. Theories that embrace such dependence (e.g., strict Subject-Sensitive Invariantism - SSI) must defend a counterintuitive consequence: S can lack knowledge because of facts utterly beyond her ken. Theories that reject such dependence must find other ways to explain the phenomena captured by R1, R2, R5, R6, R7, often leading to more complex semantic machinery. Classical invariantism simply denies the phenomena requiring R1.

  **Scoring the Families (Briefly):**

  1.  **Contextualism (stakes affect attributor's context):**
      *   **Strengths:** Excels at R1, R2 (privileges attributor), R7 (designed for linguistic data), handles R6 if stakes are objective/attributor-based. Explains non-contradiction easily.
      *   **Weaknesses:** Struggles with R3 (does S *have* knowledge or is it only truly ascribable in low-stakes contexts?), R4 (knowledge depends on attributor's context/stakes, often unknown to S), R5 (attributor-dependent aggregation?).

  2.  **Stakes-Sensitive Invariantism (SSI - stakes affect subject's state):**
      *   **Strengths:** Satisfies R3 (knowledge is a state S has/had), can handle R2 (privileges subject), R5 (individual stakes), R6 (if stakes are objective/subject's real situation).
      *   **Weaknesses:** Fails R1 spectacularly (predicts contradiction between low/high-stakes attributors), fails R7 (embeddings problematic), catastrophically violates R4 (knowledge depends on subject's *actual* stakes, potentially unknown to her).

  3.  **Classical Invariantism (stakes irrelevant to knowledge):**
      *   **Strengths:** Easily satisfies R3, R4, R5 (knowledge purely epistemic, unaffected by stakes). Avoids R6 problem.
      *   **Weaknesses:** Completely fails R1 (denies the core phenomenon), fails R2, R7. Must explain away the intuitive judgments and linguistic data as massive error or pragmatics.

  4.  **Relativism/Assessment Sensitivity (stakes affect assessor's context at time of assessment):**
      *   **Strengths:** Excels at R1, R7 (especially retraction/faultless disagreement), handles R2 (privileges assessor). Explains non-contradiction.
      *   **Weaknesses:** Struggles with R3 (does S *have* knowledge simpliciter at t? "Retroactive" assessment feels revisionary), R4 (knowledge depends on future/potential assessors' stakes?), R5 (assessor-dependent aggregation?).

  **Conclusion:** The core tension (R1 vs. R4) forces a choice: prioritize explaining the linguistic and intuitive variability of knowledge attributions (favoring contextualism/relativism) or prioritize preserving the idea that whether S knows p supervenes on factors accessible to S's epistemic situation (favoring invariantism, classical or SSI). R3 and R5 add pressure regarding the metaphysics of the knowing state and agency. R7 and R6, while crucial tests, carry inherent biases towards contextualist/relativist solutions. A successful theory must navigate this minefield without sacrificing too much intuitive plausibility on either side.
