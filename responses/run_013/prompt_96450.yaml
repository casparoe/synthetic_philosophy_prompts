prompt: |-
  I recently left a graduate programme in philosophy of biology to join a behavioural ecology lab, and my first assignment is to draft the interpretation section of our paper on a newly described courtship display. My supervisor classifies displays according to a scheme she has applied consistently, and because she is in the field and will see the draft only once it is finished, I want to anticipate her reaction before I commit to a reading. As best I can reconstruct her classifications from her review chapter and from the lab's comparative table:

  - A large mammal's roar, whose fundamental frequency is fixed by the size of the larynx: index, on the grounds that the organ cannot be faked.
  - A gazelle's stotting leap: handicap, on the grounds that the leap earns the animal nothing and is simply the price of being believed.
  - The prolonged fast that males of a bird species undertake during the courtship season: handicap.
  - The warning coloration of a toxic frog, whose pigments are sequestered from the prey it eats: index.
  - A small, cheap, arbitrary plumage badge in a social species, in which receivers attack males that exaggerate: convention.
  - A ritual that every male performs identically and at the same metabolic cost, with no measurable relation to condition: not a signal, on the grounds that a cost everyone pays sorts nobody.
  - A call whose pitch tracks ambient temperature and predicts nothing about the caller: not a signal.

  Our species: males arrive at a female's perch carrying a single large prey item, which she takes and eats. There is no dance, song, or ornament; the prey is the entire display. In our data, the males who deliver the largest items are the ones in the best condition, measured by mass and parasite load, and males in poor condition either fail to secure a large item or abandon the delivery partway. The male forfeits the prey entirely and the female gains the meal.

  What will she call this? I am less interested in the verdict itself than in the rule her record commits her to: what her earlier classifications jointly imply, what rival rule they leave open, which of the two you would bet on and why, and which further case would separate them. I am especially unsure whether her notion of a handicap requires the cost to be wasted on the sender, since every display she has called a handicap so far has been one from which the receiver gains nothing material, and this is the first case in which the receiver is fed.
reasoning: |-
  Okay, the user has a background in philosophy of biology and has switched to a behavioural ecology lab. They're working on interpreting a courtship display where males bring large prey items to females. The key is to classify this display according to their supervisor's existing scheme. The user provided examples of how the supervisor classifies different signals: index, handicap, convention, or not a signal.

  The main question is whether this new case is a handicap or an index. The supervisor's past classifications show that handicaps involve wasteful costs (like the gazelle's leap or the bird's fast) where the cost is the signal's honesty mechanism. Indexes are reliable because they're physically tied to a trait (like the mammal's roar or the frog's coloration). 

  In this new scenario, the male delivers a large prey item, which correlates with his condition. The cost is the forfeited meal, but the female gains nutrition. The user is unsure if a handicap requires the cost to be wasted, as past examples had no material benefit to the receiver. Here, the female benefits, which might challenge the supervisor's pattern.

  Looking at the supervisor's criteria: she classified the bird's fast as a handicap, which also involves a cost (energy loss) that could be seen as wasteful. But in that case, the female doesn't gain material benefits either. Here, the female gets food, so the cost isn't entirely wasted. However, the male still pays a cost by losing the prey. The supervisor might focus on whether the cost is paid regardless of the receiver's response. In handicaps, the cost is paid upfront, making cheating unprofitable for low-quality males. Here, the male pays the cost when he gives up the prey, which happens during the display. 

  The user also needs to consider if the signal's reliability comes from the cost (handicap) or physical constraints (index). The prey size isn't physically constrained like the larynx size; instead, males in poor condition can't secure large prey or abandon the effort. This suggests the cost (effort, risk) enforces honesty, aligning more with handicap. Even though the female benefits, the male's cost is the energy expended and the lost meal. The supervisor's previous cases didn't have receiver benefits, but the core of handicap theory (Zahavi) is the signal's cost, not the receiver's gain. 

  I think the supervisor will classify this as a handicap. The rule is that if the cost is paid by the sender to ensure honesty, especially through effort or risk, it's a handicap, even if the receiver benefits. The rival rule would require the cost to be purely wasteful with no receiver benefit, but the supervisor hasn't indicated that. A test case would be a signal where the receiver benefits materially, but the cost is trivial for high-quality senders. If she calls that a handicap, it confirms; if not, she might see it as an index or something else.
answer: |-
  Based on your supervisor's established classification scheme and reasoning patterns, I predict she will classify the prey-delivery courtship display as a **handicap signal**. Here's the breakdown:

  ### 1. **The Likely Verdict: Handicap**
  *   **Why:** The core logic matches her handicap examples (gazelle stotting, bird fasting). The male pays a significant, *differential cost* (forfeiting a large, valuable food item) that only males in good condition can reliably afford. This cost ensures the signal's honesty ("males in poor condition either fail to secure a large item or abandon the delivery partway"). The cost is the "price of being believed," paid upfront regardless of the female's ultimate mating decision.

  ### 2. **The Implied Rule & Rival Interpretation**
  *   **Her Implied Rule (Best Fit):** "A signal is classified as a **handicap** if its honesty is maintained by a *differential cost* paid by the signaller, which is wasteful or burdensome *from the signaller's perspective*, making it unaffordable or unprofitable for low-quality individuals to produce the signal effectively. The *receiver may gain a material benefit* without negating the handicap nature, as long as the cost enforcing honesty is borne by the signaller."
  *   **Key Evidence for this Rule:**
      *   **Gazelle Stotting:** Costly leap (signaller cost), no direct material gain for predator/receiver (but receiver gains information).
      *   **Bird Fasting:** Costly energy loss (signaller cost), no direct material gain for female/receiver (but receiver gains information).
      *   **Toxic Frog Coloration:** Classified as *Index* (not handicap) because honesty comes from physical constraint (sequestered toxin), not differential cost paid *as part of the signal*. The cost is developmental/acquisition, not a *signal production* cost paid each display.
      *   **Uniform Ritual:** Classified as *Not a Signal* because it lacks differential cost/benefit or information (no sorting).
  *   **The Rival Rule (Rejected by her Pattern):** "A signal is **only** a handicap if the cost paid by the signaller is *purely wasteful*, providing *no material benefit whatsoever to the receiver*. If the receiver gains a material benefit, the signal must be an index or convention."
      *   **Why Rejected:** This rival rule isn't supported by her classifications. While her *previous* handicap examples *happened* to lack receiver benefits, her reasoning consistently focused on the *signaller's cost and its role in enforcing honesty* ("price of being believed", "cost everyone pays sorts nobody"). She never explicitly stated receiver benefit negates handicap status. Her index classifications rely on *physical constraint*, not the absence of receiver benefit.

  ### 3. **Why Bet on Handicap (Your Case Fits Her Core Logic)**
  *   **Differential Cost (Signaller Perspective):** Males forfeit a valuable resource (food). This cost is higher for males in poor condition, making honest signalling unaffordable for them. This mirrors the *logic* of the gazelle leap and bird fast – paying a price to prove quality.
  *   **Enforcement Mechanism = Cost:** Honesty stems directly from the cost of acquiring/delivering the large prey item, not from an immutable physical constraint (like larynx size or sequestered toxin). Poor-condition males *could* theoretically try to cheat by bringing a large item, but the *cost/effort/risk* makes it unprofitable or impossible for them. This is the hallmark of handicap signalling (Zahavi's principle).
  *   **Wasteful from Signaller's View:** The male pays the cost (loses the prey) regardless of whether mating occurs. While the female gains nutrition, *for the male*, the prey is forfeited. This aligns with her "price of being believed" reasoning for the gazelle.
  *   **Receiver Benefit is Incidental:** The female's gain doesn't change the *mechanism* enforcing honesty (the male's cost). Her scheme focuses on the *source of reliability* (cost vs. constraint) for classification.

  ### 4. **The Critical Test Case to Separate the Rules**
  To definitively distinguish between the two rules, propose a case like this:
  > **"Nuptial Prey Sharing with Differential Cost & Receiver Benefit, but No Physical Constraint":** Males deliver prey to females. The *size* of prey delivered correlates perfectly with male condition. Males in poor condition deliver smaller prey *only because* catching large prey requires immense, risky effort they cannot sustain. Females consume the prey (receiver benefit). Crucially, there is *no physical upper limit* on prey size a male *could* carry (unlike the larynx roar), and the prey toxins are irrelevant (unlike the frog). Honesty relies solely on the differential cost/effort/risk of securing large prey.

  *   **Prediction under HER Rule (Handicap):** She classifies it as a **handicap**. The reliability comes from the *differential cost paid by the signaller* to produce the signal (large prey delivery), even though the receiver gains a material benefit. The focus is on the signaller's cost as the honesty mechanism.
  *   **Prediction under Rival Rule (Index or ?):** She classifies it as an **index** or struggles to fit it. Proponents of the rival rule might argue the receiver benefit invalidates "handicap" under strict interpretations of wastefulness, forcing it into "index" based on the correlation. However, without a *physical constraint* (like fixed larynx or sequestered toxin), "index" fits poorly. This ambiguity highlights why her implied rule is more consistent.

  **Regarding the Female's Gain:** Your supervisor's prior handicap examples involved no receiver benefit, but her *reasoning* centered on the *signaller's cost* as the enforcer. There's no indication in her scheme that a receiver benefit *disqualifies* a costly signal from being a handicap. The core Zahavian principle emphasizes the signaller's *net cost* or *burden*. In this case, the male pays the cost (losing the prey), while the female gains a benefit. The cost is still paid by the signaller to ensure honesty. Her classification of the bird's fast (where the male pays a cost, and the female might indirectly benefit from mating a high-quality male, but gains no *direct material* benefit like food) suggests the *directness* of the receiver's material gain isn't her primary criterion. The focus is on the *source of reliability for the signal's information*.

  **Therefore, confidently draft the interpretation classifying the prey delivery as a *handicap signal*. The rule her record commits her to is that a signal is a handicap if its honesty is enforced by a differential cost paid by the signaller, irrespective of whether the receiver gains a material benefit.** The presence of the receiver benefit is a novel twist in *your* case, but it doesn't alter the fundamental mechanism (cost-based honesty) that aligns with her previous handicap classifications.
