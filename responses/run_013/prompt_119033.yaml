answer: |-
  ## Joint Statement on Advance Directives: Entrenchment View vs. Contemporaneous-Will View

  **1. Agreed Claims Regarding Structure**

  We, adherents to the Entrenchment View (EV) and the Contemporaneous-Will View (CWV), jointly affirm the following structural propositions about advance directives (ADs):

      1.  **Temporal Separation:** An AD is an expression of will, preference, or instruction issued by a person (the "Writing Self") at a specific time (T1) intended to govern actions affecting that same person at a later time (T2), when their capacity for medical decision-making may be impaired or absent.
      2.  **Central Cases:** A complete theory of AD authority must satisfactorily address at least two core scenarios:
          *   **Later Endorsement:** The person at T2 (the "Later Self") affirms the AD's instructions.
          *   **Later Repudiation:** The person at T2 expresses a will contrary to the AD's instructions.
      3.  **No Free Premise on Capacity Loss:** Neither view may presume that the mere *fact* of impaired or lost decision-making capacity at T2 automatically resolves the question of the AD's authority. The significance of capacity loss must be argued for, not assumed.
      4.  **Focus on Moral Authority:** The primary question at issue between our views is the *moral authority* of the AD directive at T2, not its legal validity. We acknowledge disagreement may exist regarding the necessary relationship between moral authority and legal validity, and leave this as an open item.

  **2. Shared Taxonomy of Directive Types (With Positions on Scope of Disagreement)**

  We propose the following taxonomy of AD types for analytical clarity, recognizing that EV may question whether this classification reflects fundamental differences relevant to authority:

      1.  **Precommitment Directive:** An AD designed to bind the Later Self against a specific choice or preference the Writing Self anticipates (and may fear) the Later Self will have at T2 (e.g., refusing life-sustaining treatment during a predicted period of dementia-related euphoria).
      2.  **Testamentary Directive:** An AD expressing preferences concerning future states about which the Writing Self expects to be indifferent or incompetent at T2, aiming to settle matters the Later Self is deemed incapable of deciding (e.g., choosing organ donation or specifying burial wishes once dead).
      3.  **Default Directive:** An AD stating a standing preference intended to govern unless the person at T2 actively expresses a different preference, even if capacity is impaired (e.g., "I generally prefer minimal intervention; continue this approach unless I clearly ask for more treatment").

  *   **EV Position:** EV asserts that its core claim – the binding authority of the Writing Self's directive fixed at T1 – applies equally and fundamentally to all three directive types. The authority stems from the act of writing itself, regardless of the directive's specific aim.
  *   **CWV Position:** CWV contends that the core dispute primarily concerns **Precommitment Directives**. For **Testamentary Directives** (especially regarding post-death wishes or states of complete unconsciousness where no contemporaneous will exists), CWV often finds EV's authority claim more plausible or the only viable option. **Default Directives** present an intermediate case where CWV's defeasibility condition is central, but the burden of showing a contrary will may be higher.

  **3. Table of Live Disagreements**

  | Disagreement (Stated as Each Camp Would Accept)                                                                                               | Crux                                                                                               | Shared Case/Evidence/Argument                                                                                                                               | EV Prediction                                                                                      | CWV Prediction                                                                                           |
  | :------------------------------------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------- | :---------------------------------------------------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------- |
  | **EV:** The moral authority of a valid AD derives solely from the autonomous act of the Writing Self at T1. **CWV:** The moral authority of an AD at T2 depends on its alignment with the present interests or will of the person at T2. | What is the fundamental ground of the AD's authority? (Autonomy at T1 vs. Well-being/Will at T2) | The scenario of **Later Repudiation**: A person with significantly impaired capacity at T2 expresses a clear, persistent preference contradicting their AD. | The AD retains authority; the repudiation, stemming from impairment, does not override the prior autonomous choice. | The AD loses authority; the expressed preference, if it reflects the present state's will/interests, must govern (though assessing this is complex). |
  | **EV:** Expressions of preference by a person with impaired capacity can be symptoms of the underlying pathology affecting judgment, not authentic exercises of will. **CWV:** Expressions of preference by a person with impaired capacity, if coherent and persistent within their current frame of reference, constitute their authentic present will. | What constitutes an authentic "will" when capacity is impaired? (Pathology vs. Authentic Expression) | Evaluating the **coherence and persistence** of a repudiation expressed by someone with moderate dementia or severe psychiatric illness.                       | Will likely conclude such expressions are unreliable symptoms of illness, not authentic will.       | Will likely seek to interpret the expression within the person's current worldview, granting it authority if internally consistent.                     |
  | **EV:** The Writing Self's potential ignorance about the precise experiential nature of T2 is inherent to future-oriented decisions and does not invalidate the directive; it is a risk undertaken autonomously. **CWV:** Profound ignorance about the experiential state at T2 significantly undermines the directive's claim to govern that state, as the Writing Self cannot make a truly informed choice about an unknown future self. | Does the Writing Self's ignorance of the future state undermine the directive's authority over that state? | Considering directives written by healthy individuals concerning states they have never experienced (e.g., severe locked-in syndrome, advanced dementia with reported contentment). | The directive remains authoritative; the risk of experiential ignorance is part of the autonomous choice made. | The ignorance creates a significant epistemic gap, weakening the directive's claim to authority over the actual lived experience.          |

  **4. Unresolved Issues & Verbal Disagreements**

  *   **Contested "Agreed" Claim:** While both camps agree the directive is issued at T1 and applied at T2 (Claim 1.1), they may understand the relationship between the "Writing Self" and "Later Self" differently. EV often leans towards seeing them as distinct temporal stages of the same persisting agent whose earlier competent choice binds the later. CWV may emphasize the potential discontinuity or qualitative difference between the selves, making the Later Self a distinct moral patient.
  *   **Verbal Disagreement:** The core term **"Authority"** is used differently.
      *   *EV Sense:* Authority denotes a *right to command* or *binding obligation* created by the Writing Self's autonomous act, owed deference regardless of the Later Self's state.
      *   *CWV Sense:* Authority denotes a *claim to be decisive* based on representing the *best interests or authentic will* of the person *as they exist at the time of the decision* (T2). It is inherently linked to the present patient's standpoint.
  *   **Testing the User's Suspicion:** The drafting reveals that while the distinction between "authority over the body" (perhaps leaning towards CWV's focus on present interests/will) and "authorship of the life" (perhaps leaning towards EV's focus on the life-narrative controlled by the Writing Self) captures a significant aspect of the divergence, it does **not** fully separate the camps or eliminate the core disagreement. The dispute fundamentally breaks down over the **source and nature of the moral claim** itself (Crux 1 in the table). Both views ultimately make claims about who governs the body *and* whose agency defines the life narrative at T2. EV sees the Writing Self as authorizing both; CWV sees the present person at T2 (even if impaired) as the locus requiring governance in accordance with their current reality. Therefore, the residual disagreement concerning the ground of authority remains substantial and permeates both questions.

  \answer{The ground of authority: autonomy at writing versus well-being/will at application.}
