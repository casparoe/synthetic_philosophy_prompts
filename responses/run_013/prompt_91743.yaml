prompt: |-
  I am writing a chapter that defends a specific verdict — that an individual who buys factory-farmed meat is morally responsible for a share of the resulting animal suffering even though her individual purchase makes no difference to how much suffering occurs — and before I commit to any one account I want the specification settled. Write the desiderata: what must any adequate theory of individual responsibility for collective harms deliver?

  The family of cases I need it to handle: a lifetime of carbon emissions; a single vote in a large election; one purchase among millions; a threshold harm in which my contribution is neither necessary nor sufficient; and the contrasting case in which my contribution is necessary (the deciding vote, the last person needed to lift the car). For each requirement, give me the case or consideration that motivates it, and a verdict on whether it is a genuine desideratum or an artifact of one camp — consequentialist, Kantian, virtue-theoretic, or the metaphysics of causation. Include, as constraints the theory cannot simply contradict, the facts that aggregate contributions do cause the harm, that thresholds are frequently vague and unknown, and that agents act under uncertainty about both.

  I have three convictions I want tested against the list rather than smuggled into it. First, that an act can be attributable to an agent as hers even when it is not a difference-maker, and that causal responsibility and attributability can come apart. Second, that some acts may be wrong in virtue of what they constitute or express as part of a practice, independently of their marginal causal contribution. Third, that backward-looking blame and forward-looking reasons for action are distinct questions, so that a theory should not settle one by quietly settling the other.

  Tell me which requirements are non-negotiable and which are negotiable, and flag any pair that looks jointly unsatisfiable — I suspect real tension between the demand that the theory be action-guiding and scale sensibly, on the one hand, and the demand that it respect the difference-making intuition, on the other; and again between a share-of-the-harm conception of responsibility and the indeterminacy of any actual share. If a single requirement does the most to exclude the popular accounts, say which and why. A table for the requirements and their motivating cases is welcome; skip the scorecard against named theories, since I will run that myself.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're writing a chapter defending the verdict that buying factory-farmed meat makes one morally responsible for a share of the suffering, even if the individual purchase doesn't make a difference. They want desiderata for a theory of individual responsibility for collective harms that can handle specific cases like carbon emissions, voting, purchases, threshold harms, and necessary contributions.

  First, I need to identify the core challenges here. The user mentions cases where individual actions seem too small to matter but collectively cause harm. They also have three convictions: attributability without difference-making, wrongness based on constitution/expression, and separating blame from forward-looking reasons. Plus, constraints like aggregate causation, vague thresholds, and uncertainty.

  The user’s explicit needs are clear: a list of requirements for an adequate theory. But deeper, they might be seeking validation that their stance isn’t just a niche argument but has philosophical grounding. They want their convictions tested against the desiderata, which suggests they’re open to refining their position. The mention of tensions—like action-guidance vs. difference-making, and share-of-harm vs. indeterminacy—indicates they’re aware of potential counterarguments and want their theory to withstand them.

  Next, structuring the desiderata. Each should address a specific aspect of collective harm cases. Start with non-difference-making, as that’s central to their thesis. Then, aggregate causation as a constraint. The cases provided need to be covered: lifetime emissions, voting, purchases, thresholds, necessary contributions. The convictions require separate desiderata—attributability apart from causation, constitutive wrongness, and blame/reasons separation.

  I should check for tensions. For example, how can responsibility be assigned a share if the actual harm’s share is indeterminate? That’s a conflict. Also, action-guidance under uncertainty vs. respecting difference-making intuitions. Highlighting these helps the user anticipate objections.

  The user’s three convictions need careful handling. They don’t want them smuggled in, so each conviction must translate into a desideratum without presupposing their truth. For instance, attributability apart from causation should be a requirement the theory must satisfy, not an assumed truth.

  Constraints like vague thresholds and uncertainty are critical. The theory must handle cases where agents don’t know the threshold or their impact. This affects action-guidance—how to decide when to act if you’re uncertain about causing harm.

  Also, considering the contrast cases (like the necessary contribution) ensures the theory isn’t overbroad. If it assigns responsibility in collective harm cases, it should also explain why the deciding vote is different, or if it’s similar.

  Finally, the table format will help the user see each requirement with its motivation. Non-negotiable ones include non-difference-making, aggregate causation, and uncertainty. Negotiable might be the type of blame or precise share allocation, as long as the core responsibility is established.

  I need to ensure that the desiderata don’t presuppose consequentialism or deontology. The user wants a framework that’s theory-neutral, allowing them to evaluate different accounts later. So each requirement should be framed in a way that various theories could potentially meet it, even if some struggle more.

  The requirement that might exclude popular accounts is probably the non-difference-making moral responsibility. Consequentialist theories often hinge on causation, so requiring responsibility without difference-making challenges them directly. Kantian and virtue ethics might handle attributability better but struggle with the share-of-harm aspect.

  Including the user’s convictions as testable points rather than assumptions means phrasing desiderata that allow for these possibilities without mandating them. For example, "allow for" attributability apart from causation instead of "must include" it.
answer: |-
  Here are the desiderata for an adequate theory of individual responsibility for collective harms, structured to address your core challenge, cases, convictions, and constraints. Requirements are labeled (R#), motivated by specific cases/considerations, and assessed for negotiability and potential tensions. A summary table follows.

  **Core Constraints (Non-Negotiable Background Facts):**
  1.  `Aggregate Causation`: The collective action *does* cause the harm (e.g., billions of meat purchases sustain factory farming; aggregate emissions cause climate change). A theory cannot deny this.
  2.  `Vague/Unknown Thresholds`: In many collective harms (e.g., electing a harmful candidate, exceeding an ecological tipping point), the exact threshold where contributions tip into harm is frequently unknown, probabilistic, or inherently vague. The theory must function under this uncertainty.
  3.  `Agent Uncertainty`: Agents typically act without knowing the precise state of the collective action, the threshold (if any), or their exact marginal impact. The theory must account for decision-making under epistemic limitations.

  **Desiderata for an Adequate Theory:**

  1.  **R1: Non-Difference-Making Moral Responsibility (NDMR)**
      *   **What it must deliver:** Assign moral responsibility for a share of the resulting harm to an individual agent *even when* their specific act was neither necessary nor sufficient for the harm to occur (i.e., it made no marginal difference).
      *   **Motivating Case:** The factory-farmed meat purchase (paradigmatic case), a lifetime of carbon emissions in a world of billions of emitters, a single vote for a harmful candidate in a large election where the candidate wins by a large margin.
      *   **Desideratum Status:** **Non-Negotiable Core.** This is the central phenomenon your theory must explain and defend. Without satisfying R1, the theory fails your primary aim.
      *   **Conviction Test:** Directly addresses your first conviction (attributability without difference-making).

  2.  **R2: Aggregate Causation Requirement (ACR)**
      *   **What it must deliver:** Ground responsibility *in* the fact that the *aggregate* of acts like the agent's *is causally responsible* for the harm. Responsibility shouldn't float free of the causal chain leading to harm.
      *   **Motivating Case:** Contrast with cases where there is *no* collective harm occurring (e.g., buying meat in a world where no factory farming exists). Responsibility arises *because* the collective practice *does* cause harm. Also motivates why responsibility isn't assigned for acts that are *causally inert* within the collective context (e.g., buying a product mistakenly believed to be factory-farmed, but which isn't).
      *   **Desideratum Status:** **Non-Negotiable.** Follows directly from the core constraint of Aggregate Causation. Denying it severs responsibility from the actual harm.
      *   **Conviction Test:** Constrains your first conviction – attributability must still have *some* link to causation (aggregate), even if not marginal.

  3.  **R3: Handling Threshold Vagueness & Uncertainty (TVU)**
      *   **What it must deliver:** Assign responsibility coherently when thresholds are vague, unknown, probabilistic, or non-existent (purely accumulative harms). It must provide action guidance *under conditions of uncertainty* about one's impact and the collective outcome.
      *   **Motivating Case:** Climate emissions (tipping points uncertain), voting (exact margin needed unknown), purchasing (exact market dynamics opaque). Also, accumulative harms with no sharp threshold (e.g., gradual pollution degradation).
      *   **Desideratum Status:** **Non-Negotiable.** Essential for real-world applicability. Theories requiring precise knowledge of thresholds or marginal impact fail here.
      *   **Potential Tension:** With R10 (Action Guidance) – making robust decisions under uncertainty is hard. Also with R6 (Scale Sensitivity) – vagueness complicates proportional assignment.

  4.  **R4: Contrast with Necessary Contribution Cases (NCC)**
      *   **What it must deliver:** Provide a plausible and distinct account of responsibility in cases where an individual's contribution *is* necessary and/or sufficient for the harm (e.g., the deciding vote, the last person lifting the car causing injury). It should either explain the *difference* in responsibility or provide a unified account that captures both types of cases without absurdity.
      *   **Motivating Case:** The deciding vote vs. a non-pivotal vote; being the last straw vs. one of millions of straws.
      *   **Desideratum Status:** **Non-Negotiable.** A theory that cannot distinguish these or makes the non-pivotal case *as* responsible as the pivotal case (or vice-versa) is implausible. Demonstrates the theory's scope and nuance.
      *   **Potential Tension:** With R1 (NDMR) – If the theory makes non-pivotal actors responsible, how does it avoid *over*-responsibilizing pivotal actors or *under*-responsibilizing them? Unified accounts struggle, distinct accounts need justification.

  5.  **R5: Attributability Apart from Causal Difference-Making (AACD)**
      *   **What it must deliver:** Allow that an act (or pattern of acts) can be *attributable* to an agent *as her own* in a normatively significant way, establishing a basis for responsibility (e.g., blameworthiness, duty-bearer status), even when the act makes no causal difference to the harm.
      *   **Motivating Case:** Buying factory-farmed meat – the act is *hers*, it's the kind of act that *in aggregate* causes harm, and we intuitively feel it reflects on *her*. Rooted in your first conviction.
      *   **Desideratum Status:** **Non-Negotiable (for your project).** Directly reflects your conviction. Theories relying *solely* on causal difference-making (e.g., simple consequentialism) fail here. Grounds *who* is responsible.
      *   **Potential Tension:** With R2 (ACR) – How to link attributability firmly to the aggregate causal harm without collapsing into marginalism? Also with R6 (Scale Sensitivity) – How does attributability generate a *share*?

  6.  **R6: Scale Sensitivity & Proportionality (SSP)**
      *   **What it must deliver:** The degree or nature of responsibility assigned should plausibly scale with the agent's *involvement* or *contribution level* within the collective context. Responsibility shouldn't be all-or-nothing independent of context (e.g., buying one chicken vs. eating meat daily for decades; emitting average CO2 vs. being a mega-polluter).
      *   **Motivating Case:** Lifetime carbon emissions vs. a single flight; habitual meat consumption vs. a one-time purchase. Also prevents the "drop in the ocean" argument from implying *zero* responsibility just because responsibility is shared among many.
      *   **Desideratum Status:** **Non-Negotiable.** Avoids absurdity (equal blame for vastly different contributions). Intuitively necessary for fairness.
      *   **Potential Tension:** With R5 (AACD) – If attributability is binary (you participated or you didn't), how does scale sensitivity arise? Also with **R7 (Share-of-Harm)** and **R8 (Indeterminacy)** – How to assign a proportional *share* when the harm and contributions are often indeterminate? Major tension spot.

  7.  **R7: Share-of-Harm Conception (SoH)**
      *   **What it must deliver:** Ground responsibility in bearing a *share* of the *actual harm caused* by the collective, not just in the wrongfulness of the act abstractly considered. Responsibility is *for* a portion of the suffering/degradation.
      *   **Motivating Case:** Factory farming purchase – responsibility is *for* a share of the suffering caused by the industry sustained by such purchases. Lifetime emissions – responsibility is *for* a share of the climate damage.
      *   **Desideratum Status:** **Core to your verdict, likely Non-Negotiable for your chapter.** Distinguishes your target view from purely expressive or symbolic wrongness accounts. Rooted in R2 (ACR).
      *   **Potential Tension:** **Major Tension with R8 (Indeterminacy)** – How can one bear a "share" of a harm when the magnitude of the harm and the exact contribution of the collective/individual are often impossible to quantify? Also with R6 (SSP) – defining the share proportionally.

  8.  **R8: Handling Contribution & Harm Indeterminacy (CHI)**
      *   **What it must deliver:** Function without requiring precise quantification of the individual's causal contribution to the harm or the exact magnitude of the harm attributable to the collective. Acknowledge and incorporate the inherent fuzziness.
      *   **Motivating Case:** Purchasing meat (impossible to quantify the exact suffering caused by one purchase in a complex system). Carbon emissions (long causal chains, complex systems, diffuse harms). Threshold cases (where was the exact threshold?).
      *   **Desideratum Status:** **Non-Negotiable.** Reality of collective harms. Theories requiring precise counterfactuals or quantifiable shares fail.
      *   **Potential Tension:** **Major Tension with R7 (SoH)** – How can responsibility be *for a share of the harm* if neither the share nor often the harm itself is precisely determinable? Also challenges R6 (SSP).

  9.  **R9: Constitutive/Expressive Wrongness (CEW)**
      *   **What it must deliver:** Allow that an act can be wrong (or responsibility-grounding) *in part* because of what it constitutes or expresses as part of a harmful practice, independently of its marginal causal contribution.
      *   **Motivating Case:** Buying factory-farmed meat constitutes participation in and endorsement of a cruel system; a vote expresses support for a harmful agenda. Rooted in your second conviction.
      *   **Desideratum Status:** **Negotiable within your project, but desirable.** You want the theory to *allow* for this, potentially strengthening the case for responsibility beyond just aggregate causation/SoH. Kantian/Virtue theories often emphasize this; consequentialism struggles. Not strictly *necessary* for NDMR + SoH, but a potential powerful supplement.

  10. **R10: Action Guidance Under Uncertainty (AGU)**
      *   **What it must deliver:** Provide agents with practical, usable guidance on what they ought (or ought not) to do in collective harm situations, given the uncertainty highlighted in R3 and R8.
      *   **Motivating Case:** Should I buy the chicken? Should I drive or take the bus? Should I vote, knowing I'm not pivotal? Agents need reasons to act/refrain that make sense *ex ante*.
      *   **Desideratum Status:** **Non-Negotiable.** A theory without practical import fails a key purpose of moral theory. Must connect responsibility to reasons for action.
      *   **Potential Tension:** **Major Tension with R11 (Blame/Reasons Separation).** Also with difference-making intuitions – if my act makes no difference, *why* refrain? (This is the core motivational challenge for your thesis). Tension with R1 (NDMR) if action guidance relies heavily on expected difference-making.

  11. **R11: Distinguish Backward-Looking Blame & Forward-Looking Reasons (BLF)**
      *   **What it must deliver:** Treat questions of backward-looking moral responsibility (e.g., blameworthiness, desert, retrospective assessment) as conceptually distinct from forward-looking reasons for action (e.g., duties, obligations, what I should do now). The theory shouldn't *define* one solely in terms of the other.
      *   **Motivating Case:** Rooted in your third conviction. E.g., an agent might be blameworthy for past harmful purchases (backward-looking) but have limited options now to change behavior (forward-looking reasons might be weaker). Or conversely, have strong forward-looking reasons to reduce emissions now even if past emissions weren't blameworthy under different knowledge.
      *   **Desideratum Status:** **Non-Negotiable (for your framework).** Prevents smuggling. Forces clarity on what aspect of responsibility the theory is addressing at any point. Kantian/Virtue theories often separate these more easily than consequentialism.
      *   **Potential Tension:** With R10 (AGU) – While distinct, a plausible theory needs to explain the *connection* between backward-looking responsibility and forward-looking duties (e.g., does being responsible for past harm create a duty of reparation?).

  **Summary Table of Desiderata**

  | Ref. | Desideratum                                    | Key Motivating Case(s)                                  | Status           | Major Tensions                     |
  | :--- | :--------------------------------------------- | :------------------------------------------------------ | :--------------- | :--------------------------------- |
  | R1   | Non-Difference-Making Responsibility (NDMR)    | Meat purchase, Non-pivotal vote, Lifetime emissions     | **Non-Negotiable** | R10 (Action Guidance), R4 (NCC)    |
  | R2   | Aggregate Causation Requirement (ACR)          | Meat purchases sustain industry; Emissions cause damage | **Non-Negotiable** | Core Constraint                    |
  | R3   | Handle Threshold Vagueness/Uncertainty (TVU)   | Climate tipping points, Unknown election margins        | **Non-Negotiable** | R6 (SSP), R8 (CHI), R10 (AGU)      |
  | R4   | Contrast Necessary Contribution Cases (NCC)    | Deciding vote, Last person causing harm                 | **Non-Negotiable** | R1 (NDMR)                          |
  | R5   | Attributability Apart from Causal Diff (AACD)  | Meat purchase as *her* act, reflecting on her           | **Non-Negotiable** | R2 (ACR), R6 (SSP)                 |
  | R6   | Scale Sensitivity & Proportionality (SSP)      | One chicken vs. lifetime meat; Average vs. mega-polluter | **Non-Negotiable** | R5 (AACD), R7 (SoH), **R8 (CHI)**  |
  | R7   | Share-of-Harm Conception (SoH)                 | Responsible *for a share* of the actual suffering/harm  | **Non-Negotiable** | **R8 (CHI)**, R6 (SSP)             |
  | R8   | Handle Contribution/Harm Indeterminacy (CHI)   | Quantifying suffering per purchase; Complex climate harms | **Non-Negotiable** | **R7 (SoH)**, R6 (SSP)             |
  | R9   | Constitutive/Expressive Wrongness (CEW)        | Participation in/endorsement of cruel system            | Negotiable        | (Potential supplement)             |
  | R10  | Action Guidance Under Uncertainty (AGU)        | "Should I buy this?" "Should I drive?"                  | **Non-Negotiable** | **R11 (BLF)**, R1 (NDMR), R3 (TVU) |
  | R11  | Distinguish Blame & Reasons (BLF)              | Past blameworthiness vs. current duties                 | **Non-Negotiable** | R10 (AGU)                          |

  **Key Tensions & Excluding Power:**

  *   **Primary Tension 1: Action Guidance (R10) vs. Non-Difference-Making (R1):** This is the core practical and intuitive challenge. If my act makes no difference, why does responsibility demand I refrain? R10 requires the theory to answer this robustly under uncertainty, while R1 demands it doesn't rely on difference-making. This tension strongly challenges simple consequentialism.
  *   **Primary Tension 2: Share-of-Harm (R7) vs. Indeterminacy (R8):** How can responsibility be *for a share* of a harm when neither the total harm nor the individual's contribution (nor often the threshold) is precisely quantifiable? This tension is acute for any theory seeking proportional assignment (R6) based on contribution to harm. It challenges overly quantitative accounts.
  *   **Most Excluding Requirement:** **R1 (Non-Difference-Making Moral Responsibility)** is the primary filter. It immediately excludes:
      *   **Simple Act Consequentialism:** Which typically defines wrongness *solely* in terms of expected marginal consequences.
      *   **Strong Counterfactual Dependence Theories:** Which require that the harm wouldn't have occurred (or would have been less) but for the specific act.
      *   **Necessary Condition Accounts:** Which require the act be a necessary part of a sufficient set (NESS), as this often fails in large-scale collective harms where any single act is unnecessary.
      *   **Culpable Causation Theories:** That tightly link blameworthiness to being a cause (understood as a difference-maker).

  **Testing Your Convictions Against the List:**
  1.  **Attributability vs. Causal Responsibility:** Directly addressed by R5 (AACD), which is non-negotiable for your project. The tension with R2 (ACR) ensures the link to the *actual harm* isn't lost.
  2.  **Constitutive/Expressive Wrongness:** Addressed by R9 (CEW). Making it negotiable allows you to argue its importance without *requiring* the core NDMR + SoH account to depend on it. It can be a reinforcing element.
  3.  **Blame vs. Reasons for Action:** Directly enshrined as R11 (BLF), making the distinction non-negotiable. This forces the theory to be clear about *what kind* of responsibility it establishes (e.g., blameworthiness, duty-bearer status) and prevents defining blame solely in terms of future consequences or vice-versa. The tension with R10 (AGU) ensures the connection between responsibility and practical reason is still explained.

  This framework provides the necessary structure to rigorously evaluate candidate theories for your defense. Good luck!
