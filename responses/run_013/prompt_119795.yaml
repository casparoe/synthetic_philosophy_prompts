prompt: |-
  I'm a cosmologist and next month I've somehow been roped in to doing a guest slot for the metaphysics reading group over in the philosophy department. 45 minutes, whiteboard, and the room is sharp but has no physics past what leaks out of popular books. Topic is Boltzmann brains. I dont need you to explain the topic to me, I need you to plan the session.

  First: what has to come first, and why does each thing depend on the one before it? My hunch is they need entropy-as-counting in place before the word fluctuation can mean anything to them other than random bad luck, but you tell me the actual order, including anything I'd be tempted to skip because it seems obvious.

  Second: what is the one example that should carry the whole thing, and what does it have to have and lack? I keep reaching for brain-in-a-vat and I'm pretty sure it's wrong -- it makes them hear skepticism -- but I can't articulate why it's wrong. Same for a shuffled deck or the monkeys-typing-Shakespeare routine: are either of those actually the right carrier? If so, say what I have to do to it.

  Third: the misconceptions, in the order they'll actually surface in the room, with the exact point in the sequence where each has to be headed off. My guesses: that this is a hypothesis about what we are rather than an argument against a whole family of cosmologies; that improbable means impossible; that a fluctuation has to violate the second law; that it's the same as the simulation argument. What am I missing, and which of these do I make worse by pouncing on it too early?

  Also, someone will ask 'so are we Boltzmann brains?' and I want to answer honestly without either scaring them or hiding the ball. Where does that question belong in the sequence, and what's the honest short answer at this level?

  And what should I openly refuse to explain -- I'm thinking the measure problem and the gory details of de Sitter, but tell me if I'm refusing the wrong things or refusing things I actually need. Finish with one question I can put to them at the end that would tell me whether they've got the arugment or just picked up the vocabulary.
