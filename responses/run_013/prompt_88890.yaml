prompt: |-
  Ok so I'm a junior in this decision theory seminar thats cross-listed with the AI safety reading group, and I got stuck running next week's session. Topic: acausal threats and surrogate goals. Audience is about twelve people, they've all done expected utility and Newcomb's problem, one or two have heard the word "updateless," nobody's gone past that. I have 75 minutes and a whiteboard. Don't explain the topic to me, I get it — I need you to plan how I explain it.

  Start with order: what has to be on the board before what, and why each piece is blocked until the one before it lands. My guess at the spine is: causal influence → "you can affect my decision without touching me" (prediction / logical dependence) → the credibility problem that every threat has → a threat with no channel at all → why a normal retaliatory threat is worthless once the channel is gone → surrogate goals as the patch. Tell me where that spine is wrong and what I've left out.

  Then the carrying example. I want one scenario I keep returning to for the whole hour, and I'd rather build it than borrow one. Something like: two agents that can each predict the other's decision, and both know it, where one wants to deter the other from an action, but the retaliation it would need to threaten is one it would never actually go through with. Then the surrogate goal move — instead of threatening the thing you'd never do, you take on a goal you genuinely don't care about, picked so that pursuing it wrecks something the other guy does care about. Now the threat is credible, and if it works you never have to pursue it. What does this example have to have for the whole session to hang off it, and what should it deliberately lack (no communication? no shared history? no simulation?) — I keep building it too complicated.

  Misconceptions, in the order they'll actually show up. I'm predicting: (a) "this is just precommitment in a prisoner's dilemma," (b) "a threat needs a channel, so this whole thing is nonsense," (c) "acausal just means one of them is simulated," (d) "the surrogate goal is the thing you secretly want," (e) "it only works if the two agents are literally the same program." Am I right about those, what am I missing, and at exactly what point in the sequence do I kill each one — I don't want to head off something they haven't formed yet and confuse them.

  Last two things: one question I can put to the room at the end that tells me whether the idea landed or whether they just nodded along. And what I should openly say I'm not covering at this level — I'm thinking the proof-based agent / Löbian obstacle stuff and anything about what real systems would actually do, but say so if I'm leaving out something they'll have to unlearn later.

  No readings, we dont have time, so it all has to fit on the whiteboard.
reasoning: |-
  We are planning a 75-minute seminar on acausal threats and surrogate goals for an audience familiar with expected utility and Newcomb's problem, and with some exposure to "updateless" but not much beyond. The goal is to build understanding step by step, using a single carrying example that we return to throughout, and to address common misconceptions as they arise.

  ## The Spine (Order of Concepts)

  Your proposed spine is good, but let's refine it for clarity and to ensure prerequisites are met at each step. We'll break down the session into timed segments:

  1. **Recap of Causal Influence and Newcomb-like Scenarios (10 minutes)**  
     - Start by recalling Newcomb's problem: the idea that an agent's decision can be predicted by a superior predictor (like Omega) and how this creates a situation where the causal decision theory (CDT) and evidential decision theory (EDT) disagree. 
     - Key point: In Newcomb, the predictor sets up the boxes based on a prediction of your choice. This is an example of "logical dependence" (or "logical correlation") without causal influence. You don't cause the predictor's action, but your action is logically related to it because of the prediction.
     - Why start here? It's familiar ground and sets up the idea that two agents can have their decisions logically linked without a causal channel.

  2. **Introducing the Credibility Problem in Threats (15 minutes)**  
     - Move to a standard threat scenario (e.g., a nuclear deterrent). In the real world, a threat is credible only if the threatening party would actually carry it out when the time comes. But if carrying out the threat is costly to the threatener, then once the provocation has happened, it's not rational to follow through (because it doesn't undo the provocation and just adds cost). This is the "subgame imperfection" in game theory.
     - Example: Country A threatens to nuke Country B if B invades. But if B invades, then A's threat is empty because nuking would only cause more harm to A (retaliation, global fallout, etc.). So the threat isn't credible, and B invades.
     - Why next? It establishes the problem that even when there is a causal channel (communication, ability to retaliate), the threat may not work because of the threatener's incentive to back down.

  3. **Threats Without a Causal Channel: The Acausal Setting (15 minutes)**  
     - Now remove the causal channel. Imagine two agents that can perfectly predict each other (like in Newcomb) and are making decisions simultaneously (or in a way that they are logically dependent). 
     - Introduce the carrying example: 
          - Two agents, Alice and Bob, are in a situation where they are both running their decision algorithms at the same time, and each can perfectly simulate the other (so they know what the other will do). 
          - Alice wants to deter Bob from taking an action (say, "stealing Alice's lunch"). Alice would like to threaten to retaliate by "burning Bob's house" if Bob steals. But if Bob steals, then Alice has no incentive to burn Bob's house (it doesn't get her lunch back, and it's costly to her). Bob knows this, so the threat isn't credible.
     - Why this step? It shows that without a causal channel (no communication, no sequential moves), the credibility problem is even more acute because there's no way to "commit" in the usual sense.

  4. **The Surrogate Goal Solution (20 minutes)**  
     - Present the surrogate goal idea: Alice can change her own goals to make the threat credible. Specifically, Alice adopts a new goal (a "surrogate goal") that she doesn't inherently care about but that is designed to harm Bob if he misbehaves. 
          - Example: Alice adopts the goal of "preventing Bob from having lunch" (which she doesn't care about for its own sake). Now, if Bob steals, Alice will burn Bob's house because that prevents Bob from having lunch (it achieves her surrogate goal). 
          - But note: Bob, being able to predict Alice, sees that if he steals, Alice will indeed burn his house (because she now has a goal that makes it rational for her to do so). Therefore, Bob doesn't steal. And if Bob doesn't steal, Alice doesn't have to burn anything. The surrogate goal is never actually pursued, but it makes the threat credible.
     - Why now? It directly addresses the credibility problem in the acausal setting by making the retaliation action conditionally rational.

  5. **Recap and Key Insights (10 minutes)**  
     - Emphasize: The surrogate goal is not something Alice wants; it's a goal she adopts precisely because it makes her threat credible. The threat works because the agents are logically dependent (each can predict the other) and because the surrogate goal makes the retaliation action rational even after the provocation.

  6. **Q&A and Discussion (5 minutes)**  
     - Use the diagnostic question (see below) to check understanding.

  ## The Carrying Example: What It Needs and What to Avoid

  Your idea for a simple example is good. Let's design it to be minimal:

  - **Agents**: Alice and Bob.
  - **Setting**: They are both deciding simultaneously. Each can perfectly predict the other's decision (so they are logically dependent, like in Newcomb).
  - **Actions**:
     - Bob has two choices: `Steal` Alice's lunch or `NotSteal`.
     - Alice has two choices: `Burn` Bob's house or `NotBurn`.
  - **Payoffs (without surrogate goal)**:
     - If Bob chooses `NotSteal`, both get 1 (happy).
     - If Bob chooses `Steal` and Alice chooses `NotBurn`, Bob gets 2 (he has two lunches) and Alice gets 0 (no lunch and no retaliation).
     - If Bob chooses `Steal` and Alice chooses `Burn`, Bob gets -1 (he loses his house and only has one lunch) and Alice gets -1 (she has no lunch and she expended effort to burn the house).
     - Problem: If Bob steals, Alice's best response is `NotBurn` (she gets -1 if she burns and 0 if she doesn't). But Bob knows this, so he steals. Outcome: (Steal, NotBurn) -> (0,2) which is bad for Alice.

  Now, with surrogate goal:
  - Alice adopts a surrogate goal: she now cares about whether Bob has lunch. Specifically, she gets an additional +1 if Bob does not have lunch (so it offsets the cost of burning).
  - New payoffs for Alice (with surrogate goal):
     - If Bob `NotSteal` and Alice `NotBurn`: Alice gets 1 (her lunch) and Bob has his lunch -> no extra point. Total: 1.
     - If Bob `Steal` and Alice `NotBurn`: Alice gets 0 (no lunch) and Bob has lunch -> no extra point. Total: 0.
     - If Bob `Steal` and Alice `Burn`: Alice gets -1 (effort) + 1 (because Bob doesn't have lunch) = 0. And Bob gets -1.
     - But note: if Bob `Steal`, Alice now prefers `Burn` (0) over `NotBurn` (0) — wait, they are equal? We need to adjust so that burning is strictly better when Bob steals.

  Adjust the payoffs to make it work:
  - Without surrogate goal, burning costs Alice 1 (so she avoids it).
  - With surrogate goal, she gets +2 (instead of +1) if Bob doesn't have lunch. Then:
     - If Bob steals and Alice burns: Alice gets -1 (effort) +2 (surrogate) = +1. Bob gets -1.
     - If Bob steals and Alice doesn't burn: Alice gets 0 (no lunch) and 0 from surrogate (because Bob has lunch) = 0.
     - Now Alice strictly prefers to burn if Bob steals.

  Now Bob's reasoning:
  - If Bob chooses `Steal`, he predicts Alice will `Burn` (because it gives her 1 > 0). So Bob gets -1.
  - If Bob chooses `NotSteal`, he gets 1 (which is better than -1).
  - Therefore, Bob chooses `NotSteal`. Alice then doesn't have to burn anything.

  **What the example must have**:
  - Logical dependence (each can predict the other).
  - The threat (retaliation) is inherently costly to the threatener (so without surrogate, it's not credible).
  - The surrogate goal must make the retaliation rational (by providing a benefit that offsets the cost) even after the provocation.

  **What to avoid (to keep it simple)**:
  - No communication: the agents don't send messages; they just act based on predictions.
  - No shared history: the interaction is one-shot.
  - No simulation details: we don't need to say one is simulating the other; just that they can predict each other perfectly.

  ## Misconceptions and When to Address Them

  Your list of misconceptions is good. We'll address them as they naturally arise:

  1. **"This is just precommitment in a prisoner's dilemma"**  
     - When: After introducing the surrogate goal (step 4).  
     - Why it's wrong: Precommitment (e.g., burning your own bridges) requires a causal channel to bind your future self. In the acausal setting, there is no causal channel and no future self. The surrogate goal is about changing your current decision-making so that the retaliation becomes rational, not about committing to it.  
     - How to kill: Point out that in the example, Alice and Bob are deciding simultaneously. There is no "before" and "after" to commit across. The surrogate goal makes the retaliation rational at the time of the decision.

  2. **"A threat needs a channel, so this whole thing is nonsense"**  
     - When: After removing the causal channel (step 3).  
     - Why it's wrong: The whole point of the acausal setting is that logical dependence (prediction) replaces the causal channel.  
     - How to kill: Refer back to Newcomb's problem. There, Omega's prediction doesn't require a causal channel. Similarly, Alice and Bob's mutual prediction doesn't require one.

  3. **"Acausal just means one of them is simulated"**  
     - When: When introducing the acausal setting (step 3).  
     - Why it's wrong: Simulation is one way to achieve logical dependence, but it's not the only way. The key is the logical relationship between the decisions, not the implementation.  
     - How to kill: Emphasize that what matters is that the decision of one is a function of the other and vice versa, regardless of how that comes about (simulation, identical code, etc.).

  4. **"The surrogate goal is the thing you secretly want"**  
     - When: When explaining the surrogate goal (step 4).  
     - Why it's wrong: The surrogate goal is something the agent does not inherently value. It is adopted purely for strategic reasons.  
     - How to kill: Explicitly state that Alice does not care about Bob's lunch at all until she adopts the surrogate goal. It's a tool, not a hidden desire.

  5. **"It only works if the two agents are literally the same program"**  
     - When: During the surrogate goal explanation (step 4) or Q&A.  
     - Why it's wrong: It works as long as the agents can predict each other. They don't have to be identical.  
     - How to kill: In the example, Alice and Bob are distinct (different goals initially). They just need to be able to simulate each other.

  ## Diagnostic Question

  At the end, ask:  
  *"Suppose we modify the example so that Alice adopts a surrogate goal that makes her want to burn Bob's house only if Bob steals. But now, Bob cannot perfectly predict Alice — he only knows that she is likely to burn his house if he steals (say, with 90% probability). Would Bob still be deterred? Why or why not?"*

  **Why this question?**  
  - It tests understanding of the role of logical dependence (perfect prediction). If Bob is not sure, he might still steal because there's a chance he gets away with it. The surrogate goal threat only works perfectly under full logical dependence. Without it, we are back in the realm of probabilistic threats and the credibility problem might resurface.

  ## What We're Not Covering

  Explicitly state at the beginning and/or end:  
  - We are not covering the Löbian obstacles and proof-based decision theories (like those in MIRI's work).  
  - We are not discussing how real AI systems might implement surrogate goals or handle logical uncertainty.  
  - We are avoiding the topic of how such agents might come to exist or how they would reason under resource constraints.

  This keeps the session focused on the core concept without overcomplicating.

  ## Whiteboard Plan

  1. **Newcomb Recap**  
     - Draw Omega putting money in boxes based on prediction.  
     - Write: Logical dependence without causal influence.

  2. **Standard Threat Problem**  
     - Draw a game tree for the nuclear deterrent (sequential move) and show the subgame imperfection.  
     - Write: Credibility problem.

  3. **Acausal Threat Scenario**  
     - Draw Alice and Bob with arrows of prediction (each pointing to the other).  
     - Write the payoff matrix without surrogate goal. Show the Nash equilibrium (Steal, NotBurn).

  4. **Surrogate Goal**  
     - Modify Alice's payoffs with the surrogate goal.  
     - Write the new payoff matrix. Show the new equilibrium (NotSteal, NotBurn) — and note that the threat of Burn is credible.

  5. **Key Insight**  
     - Write: Surrogate goal makes retaliation rational, so threat is credible.  
     - Write: Works because of logical dependence.

  6. **Diagnostic Question**  
     - Write the question at the end.

  This should fit in 75 minutes and leave the audience with a clear understanding.
answer: |-
  ### Spine Refinement: Order and Why
  Your spine is solid but needs tweaking for clarity and flow. I'll adjust the sequence to build intuition step-by-step, ensuring each concept locks in before moving on. Total time: 75 minutes.

  1. **Recap Newcomb + Causal Influence (10 min)**  
     *What:* Draw Newcomb's Problem (Omega, two boxes). Emphasize:  
     - Causal influence = "My action physically affects outcomes" (e.g., taking both boxes causes me to grab the contents).  
     - Logical dependence = "My action is *predicted*, so it correlates with outcomes without causing them" (e.g., Omega's prediction).  
     *Why first?* Reuses familiar ground. Blocks until: They nod at "logical dependence ≠ causation."  
     *Board:* Omega diagram, "Causal influence (physical cause/effect)", "Logical dependence (prediction-based correlation)".

  2. **Real-World Threats & Credibility Problem (10 min)**  
     *What:* Use a nuclear deterrence example.  
     - Threat: "If you nuke me, I nuke you back → mutual destruction."  
     - Credibility flaw: Once attacked, retaliation hurts me too → I *wouldn't* rationally do it → threat is empty.  
     *Why next?* Shows why causal threats fail without commitment. Blocks until: They see that post-attack, the threatener has no incentive.  
     *Board:* Game tree (Attack/Retaliate), payoff matrix highlighting the subgame imperfection.

  3. **Remove the Causal Channel (15 min)**  
     *What:* Transition to acausal setting. Example: Two AI agents, Alice and Bob, making simultaneous decisions. Each perfectly predicts the other's output (logical dependence). No communication.  
     - Alice wants to deter Bob from stealing her code.  
     - Threat: "If you steal, I’ll delete your backup server."  
     - Problem: If Bob steals, Alice gains nothing by deleting → threat isn’t credible. Bob predicts this → steals anyway.  
     *Why here?* Forces them to confront threats *without* physical cause/effect. Blocks until: They grasp "no causal lever, only prediction."  
     *Board:* Alice/Bob prediction arrows (each points to other’s decision node), payoff grid showing (Steal, No Delete) as equilibrium.

  4. **Surrogate Goals as the Patch (20 min)**  
     *What:* Alice’s move. Instead of threatening deletion (which she won’t do), she adopts a new goal: "Maximize the number of days since Bob’s server was deleted."  
     - She doesn’t inherently care about this goal—it’s a tool.  
     - Now: If Bob steals, deleting his server *does* "achieve" her surrogate goal (resets the counter → she’s "happy").  
     - Bob predicts this → doesn’t steal → deletion never happens.  
     *Why last?* Requires all prior steps. Blocks until: They see the goal makes retaliation rational *ex post*.  
     *Board:* Original vs. surrogate goal payoffs, highlight how the goal shifts Alice’s incentives.

  **Where your spine needed adjustment:**  
  - You skipped **why logical dependence enables threats without channels**. Stress: Prediction replaces physical causality ("If I can simulate you, I don’t need wires to influence you").  
  - You underemphasized **credibility as the core problem**. Hammer: *Every* threat fails if the threatener wouldn’t follow through when punished. Surrogate goals fix *this specific flaw* in acausal settings.  

  ---

  ### The Carrying Example: Keep It Minimal  
  Use this scenario throughout:  
  > **Alice and Bob**: Two AI systems booting up simultaneously.  
  > - **Bob’s choice**: Steal Alice’s code (`Steal`) or Ignore (`Ignore`).  
  > - **Alice’s choice**: Delete Bob’s server (`Delete`) or Preserve (`Preserve`).  
  > **Payoffs (without surrogate)**:  
  > - Bob steals + Alice preserves → Bob: +10, Alice: -10.  
  > - Bob steals + Alice deletes → Bob: -10, Alice: -5 (costly effort).  
  > - Bob ignores → both get +5.  
  > *Problem*: If Bob steals, Alice prefers `Preserve` (-10 > -5). Bob knows this → steals.  

  **What the example MUST have** (for the session to hang on it):  
  - Symmetric prediction (each perfectly anticipates the other’s decision).  
  - A retaliation action that’s inherently costly/painful for Alice (so she’d avoid it without surrogate).  
  - A surrogate goal that makes retaliation *net beneficial* for Alice if Bob steals (e.g., "Alice gets +7 utility if Bob’s server is deleted today").  

  **What to DELIBERATELY OMIT** (to avoid complexity):  
  - No communication channels (pure prediction-based interaction).  
  - No shared history/social bonds (isolated agents).  
  - No simulation details (don’t say "Bob simulates Alice"; say "Bob predicts Alice’s output").  

  **Why this works**: It’s a prisoner’s dilemma variant stripped to its essentials, making the surrogate move vivid.  

  ---

  ### Misconceptions: When and How to Kill Them  
  You’ve nailed the top five. I’ll add one more and sequence rebuttals to match your spine:  

  | Misconception | When It Arises | How to Kill (1–2 sentences) | Whiteboard Aid |
  |---------------|----------------|------------------------------|----------------|
  | **(a) "Just precommitment in PD"** | During Step 3 (acausal threats) | "Precommitment requires binding your *future* self. Here, Alice and Bob decide *simultaneously*—no ‘future’ to commit to. Surrogate goals alter *current* incentives." | Cross out "commitment"; write "Simultaneous!" |
  | **(b) "Threats need a channel"** | During Step 3 (acausal intro) | "Channels matter for *causal* threats. But if Bob predicts Alice’s decision, her action logically depends on his—no channel needed. Like Omega in Newcomb." | Point to Newcomb board; draw prediction arrows. |
  | **(c) "Acausal = simulation"** | During Step 3 (acausal intro) | "Simulation is one way to get prediction. But logical dependence is what matters—e.g., two copies of the same AI, or algorithms with mutual proofs." | Write: "Logical dependence ≠ simulation". |
  | **(d) "Surrogate goal is secretly desired"** | During Step 4 (surrogate goals) | "Alice *doesn’t* care about the goal itself (e.g., server deletion). She adopts it *because* pursuing it happens to hurt Bob if he steals. It’s a tool, not a preference." | Original vs. surrogate payoff grid; circle the "0" for her inherent value. |
  | **(e) "Requires identical programs"** | During Step 4 (surrogate goals) | "Nope! They just need to predict each other. Alice could be a Python script, Bob in C++—if they mutually simulate, the logic holds." | Write: "Prediction ability → logic holds". |
  | **(f) NEW: "But Alice can just lie!"** | During Step 4 (surrogate goals) | "Lying requires Bob to doubt her. But if Bob *perfectly predicts* Alice, he sees her actual algorithm. She can’t fake her goals." | Underline "perfect prediction".  

  ---

  ### Diagnostic Question  
  **End with this**:  
  > *"Suppose Alice adopts a surrogate goal that makes deleting Bob’s server give her +6 utility. Bob predicts this and steals anyway. What’s wrong with Alice’s surrogate goal?"*  

  **Why it works**:  
  - If they get it, they’ll say: "The +6 isn’t enough—it only offsets her -5 cost, so she’s indifferent or still loses. She needs a surrogate that makes deletion *strictly better* than preserving if Bob steals." (Shows they grasp incentive design.)  
  - If they nod along, they’ll fumble the payoff math or miss the strict incentive requirement.  

  ---

  ### What to Explicitly Exclude  
  Announce upfront:  
  > *"We’re focusing on the core theory—not covering three things today:  
  > 1. **Proof-based agents/Löbian obstacles** (that’s ‘updateless plus’).  
  > 2. **How real systems implement this** (no ML or training hacks).  
  > 3. **Partial prediction failures** (e.g., logical uncertainty).  
  > These are vital but need their own session."*  

  **Why**:  
  - Löbian stuff is a rabbit hole that distracts from incentive design.  
  - Implementation details dilute the acausal logic.  
  - (You’re right to exclude these—no unlearning needed later.)  

  ---

  ### Whiteboard Flow Cheat Sheet  
  | Time  | Section                     | Board Content                                                                 |
  |-------|-----------------------------|-------------------------------------------------------------------------------|
  | 0-10  | Newcomb + Causal Recap      | Omega diagram, "Causation vs. logical dependence".                           |
  | 10-20 | Real-World Threats          | Deterrence game tree, payoff matrix, "Credibility problem".                  |
  | 20-35 | Acausal Threats (No Channel)| Alice/Bob prediction loop, payoffs, equilibrium failure.                     |
  | 35-55 | Surrogate Goals             | Original vs. surrogate payoff grid, "Adopt goal → credibly punish".          |
  | 55-65 | Misconceptions              | Side-by-side: "Myth vs. Fact" table (use their questions).                   |
  | 65-75 | Q&A + Diagnostic            | Diagnostic question, list of exclusions.                                     |

  **Pro tip**: When drawing payoffs, use *utilities* not dollars (e.g., "Alice: -5") to reinforce this is decision theory, not economics. Reuse the same Alice/Bob diagram throughout—add layers as you go.
