prompt: |-
  I have been trying to set out, in a form I can actually examine, what the law of armed conflict assumes about why killing is wrong, and the assumptions it seems to need will not sit together. The same legal order that treats intentional killing as the gravest of crimes licenses a soldier to shoot an enemy soldier on sight; forbids him to shoot that same man once he has been captured or lies wounded; and forbids torturing him under any circumstances, including circumstances in which killing others to save lives would be permitted. The soldier who kills under authorization is not a murderer even if the war he is fighting is itself unlawful, while he is a murderer if he kills without authorization or kills someone who is not a lawful target. And the highest honors the institution confers are ordinarily justified by the risk the recipient accepted rather than by the number of enemy dead; medics and stretcher-bearers have received them without firing a shot.

  What view of the wrongness of killing does this pattern presuppose? Does it presuppose that killing is wrong in itself and is made permissible by authority, so that the operative question is who may do it rather than what is done to whom? Or does it presuppose that the wrongness turns on the liability of the person killed, with the codified rules serving only as a rough working proxy for a liability no one can assess in the field? Can both readings license the practice, leaving it philosophically underdetermined between them, or is one strictly required and the other merely compatible with it? Where the pattern is not underdetermined but strained, say so plainly: why should liability to be killed lapse at the moment of capture while liability to be tortured never arises at all, and why should the lawfulness of the war be irrelevant to the guilt of the man who fights it?

  I am drawn to pacifism and want to know exactly what I would be denying. Tell me which parts of the practice presuppose that killing is sometimes permissible, which parts could survive a pacifist reading of them, and what would have to change if liability rather than authorization were made the governing idea.
reasoning: |-
  Okay, let me try to unpack this user's query. They're struggling with the moral foundations of the Law of Armed Conflict (LOAC). They notice contradictions in how killing is treated: soldiers can kill enemies on sight but not when they're captured or wounded. Torture is always forbidden, even if it could save lives. The lawfulness of the war doesn't affect a soldier's guilt for killing, but unauthorized killing makes them a murderer. Medics get honored without killing anyone. The user is leaning towards pacifism and wants to know what exactly they'd be denying if they adopt that view.

  First, I need to identify the core tension they're pointing out. LOAC treats killing as both permissible and impermissible based on context. The user presents two possible explanations: one based on authority (authorization makes killing okay) and the other on liability (the target's status makes them liable to be killed). Which one does LOAC rely on? Or is it a mix?

  Looking at the rules: soldiers can kill combatants but not hors de combat. That suggests liability might be key—combatants pose a threat, so they're liable. But then why does liability cease upon surrender or injury? Because they're no longer a threat. Torture is prohibited absolutely, which implies that even if liability justifies killing, it doesn't extend to other harms. That makes sense under a liability model where the justification is based on necessity and threat.

  But then there's the issue of the war's legality. A soldier in an unlawful war isn't a murderer if they follow LOAC, but if the war itself is illegal, why isn't the killing considered wrongful? Here, the authorization view seems to play a role. The state authorizes the soldier, so their act isn't murder. But this clashes with the liability idea because if the war is aggressive, the soldiers aren't legitimately liable. LOAC sidesteps this by separating jus ad bellum from jus in bello. This separation is practical—without it, soldiers couldn't follow rules if they questioned their war's legality. But philosophically, it's problematic. The user is right to point out this strain.

  The user is drawn to pacifism. They want to know which parts of LOAC assume killing is permissible and which parts could fit a pacifist view. Pacifism would reject all killing, so the core permissions for killing combatants would be denied. But other aspects—like protecting non-combatants, prohibiting torture, honoring medics—align with pacifist values. Even under pacifism, the distinction between combatants and non-combatants could remain, but as a prohibition rather than permission. 

  If liability were the governing idea instead of authorization, what would change? Soldiers in an unjust war couldn't claim their targets are liable. This would collapse the jus ad bellum and jus in bello separation, leading to significant upheaval in LOAC. Commanders might be prosecuted for aggressive wars, and soldiers might refuse to fight. The current system prioritizes in-battle rules over war legitimacy, but shifting to liability would intertwine them, making the laws harder to apply consistently.

  The user's deeper need seems to be understanding the moral coherence of LOAC to evaluate pacifism. They want clarity on where the law's assumptions conflict and whether pacifism can accommodate any part of it. By dissecting the authorization vs. liability tensions, especially the war legality issue, they can see what pacifism must reject entirely and where it might find common ground with humanitarian principles.
answer: |-
  Your analysis cuts to the heart of the philosophical tensions within the Law of Armed Conflict (LOAC). The practice doesn't presuppose a single, coherent view of the wrongness of killing, but rather a complex, strained, and sometimes contradictory framework born of practical necessity and competing ethical foundations. Here's a breakdown:

  **Core Assumptions & Tensions:**

  1.  **Authorization vs. Liability: A Dialectical Tension, Not Resolution:** LOAC relies on *both*, creating an underdetermined core with significant points of strain.
      *   **Authorization (Sovereign Power):** The permissibility of killing enemy combatants fundamentally rests on the *authorization* granted by the state (through uniform, status, and following rules). This explains why a soldier killing an authorized target isn't a murderer *even if the war is unlawful*. The act itself is licensed by the institutional role within the structure of sovereign conflict. The question *is* "who may do it" (a state-authorized combatant) to whom (another state-authorized combatant or a legitimate military target).
      *   **Liability (Moral Status of the Victim):** Simultaneously, LOAC heavily implies a *liability* model. Combatants are deemed liable to attack because they pose a threat ("hors de combat" status ends this liability). This explains the distinction between killing a combatant and killing a prisoner or civilian – the latter are not *liable* because they are not posing an immediate threat. The rules on distinction and hors de combat codify proxies for assessing this liability (uniform, weapon, surrender, incapacitation).

  2.  **Strains Within the Framework:**
      *   **The "Unlawful War" Problem:** This is the **most profound strain**. The liability model logically collapses if the war is aggressive/unlawful. Soldiers fighting in defense aren't liable; soldiers fighting aggression arguably *are* liable (or at least, the attackers lack justification). LOAC's insistence on separating *jus ad bellum* (lawfulness of resorting to war) from *jus in bello* (conduct within war) is a **pragmatic fiction** essential for the system to function. It *requires* the authorization view to override the liability view here. Soldiers on *both* sides are treated *as if* they are equally liable targets and equally authorized actors, regardless of the war's justice. This separation is philosophically strained but operationally necessary to have any rules governing conduct during conflict.
      *   **Torture vs. Killing:** This highlights a **differentiation in harms**. LOAC presupposes torture is *intrinsically wrong*, a violation of human dignity *regardless* of the victim's status or the potential consequences (even saving lives). Killing, however, is seen as potentially *instrumentally justified* under specific conditions (combatancy, necessity). Liability explains *who* can be killed (combatants posing a threat), but the absolute prohibition on torture stems from a deeper conviction about inherent human dignity and the absolute prohibition on degrading treatment, which liability for being a combatant does not override. Capture removes the *necessity* for killing (threat eliminated), but torture is deemed inherently unnecessary and wrongful, regardless of necessity calculations for other acts.
      *   **Honors for Non-Killers:** This reinforces the **authorization/role-based** aspect and a **value placed on duty and sacrifice**. The honor system focuses on the *soldier's* conduct within their authorized role: fulfilling duties (like saving lives as a medic) under extreme risk and demonstrating courage/virtue *as defined by the military institution*. It's about the character and commitment of the agent within the licensed context of war, not the outcome (killing) itself. This fits comfortably within the authorization framework ("honorable service") but is neutral regarding the liability of the enemy.

  **Pacifism and LOAC: Denial and Compatibility**

  1.  **What Pacifism Fundamentally Denies:** Pacifism (in its absolute form) denies the core *permissibility* granted by the authorization model and the *legitimacy* of the liability model applied to combatants in war. It rejects the foundational premise that the state can morally authorize killing or that participation in organized violence can make one liable to be killed. For a pacifist, all intentional killing in war is murder.
  2.  **Parts Presupposing Permissibility of Killing (Denied by Pacifism):**
      *   The core rule authorizing combatants to kill enemy combatants on sight.
      *   The separation of *jus ad bellum* and *jus in bello* (as it legitimizes killing by soldiers in an unjust war).
      *   The notion that killing under authorization is not murder.
      *   The concept of "lawful target" based on combatant status derived from participation.
  3.  **Parts Compatible with or Surviving a Pacifist Reading:**
      *   **Absolute Prohibitions:** The bans on torture, killing prisoners, killing the wounded, and attacking civilians/non-combatants. A pacifist sees these as *extensions* of the absolute prohibition on killing/violence, applying to *everyone*, not just specific classes. LOAC's recognition of these as grave breaches aligns with pacifist values, even if the pacifist rejects the framework that allows *any* killing.
      *   **Humanitarian Principles:** The underlying values of minimizing suffering, protecting the vulnerable (wounded, sick, prisoners, civilians), and human dignity resonate strongly with pacifism. LOAC codifies these *within* war; pacifism argues they necessitate the *rejection* of war.
      *   **Recognition of Non-Combatant Status:** The distinction principle, while used to define lawful targets, also profoundly recognizes the immunity of non-participants. Pacifism would uphold this distinction but apply it universally, rejecting the category of "lawful participant."
      *   **Honoring Non-Lethal Sacrifice:** The valorization of medics and stretcher-bearers aligns perfectly with pacifist emphasis on saving life and non-violent courage. A pacifist system would likely expand such honors.

  **If Liability Became the Governing Idea:**

  Shifting decisively from authorization to liability as the *sole* foundation would cause a seismic shift in LOAC, primarily by collapsing the *jus ad bellum / jus in bello* separation:

  1.  **Irrelevance of Formal Status:** Mere combatant status (uniform, carrying arms under orders) would no longer be sufficient for liability. Actual, *individual* contribution to an unjust threat would be necessary.
  2.  **Collapse of *Jus ad Bellum / Jus in Bello* Separation:** Soldiers fighting in an aggressive war (*jus ad bellum* violation) would lack legitimate authority *and* their actions would likely make them liable to defensive force. Soldiers fighting defensively would not be liable, and killing them would be wrongful. The "moral equality of soldiers" would vanish.
  3.  **Radical Change in Rules of Engagement:** "Shoot on sight" based on status would be impermissible. Soldiers would need reasonable grounds to believe a specific individual poses an *unjust* imminent threat. This is vastly more complex and subjective than the current status-based rules.
  4.  **Focus on Individual Conduct:** Liability could potentially extend beyond traditional combatants to civilians directly participating in hostilities (DPH) in an unjust cause, and conversely, might *not* extend to combatants engaged in purely defensive or objectively necessary actions, even in an unjust war overall.
  5.  **Loss of Predictability and Uniformity:** Current LOAC rules, despite tensions, offer relative clarity and predictability. A pure liability model would be highly context-dependent, subjective, and difficult to adjudicate consistently in the chaos of war, potentially leading to greater brutality and less protection.
  6.  **Legitimacy Crisis for Soldiers:** Soldiers could no longer rely on their orders or status; they would bear a much heavier moral burden to assess the justice of their cause and the specific threat posed by each potential target, creating paralyzing uncertainty and potential refusal to fight in wars perceived as unjust.

  **Conclusion:**

  LOAC's view on killing is philosophically **strained and underdetermined**, relying on an unstable amalgam of **authorization** (sovereign license, role-based permission) and **liability** (threat-based justification). The **greatest strain** is the artificial separation of *jus ad bellum* and *jus in bello*, which *requires* the authorization view to override the logical implications of the liability view regarding the unjust aggressor. The absolute prohibition on torture rests on a different foundation – intrinsic human dignity – which liability cannot override.

  **Pacifism** denies the core permissibility of killing granted by LOAC's authorization model and the legitimacy of its liability model for combatants. However, LOAC's **humanitarian constraints** (protecting non-combatants, prisoners, wounded; banning torture) and its **valorization of life-saving** are deeply compatible with pacifist values.

  Making **liability the sole governing idea** would necessitate abolishing the *jus ad bellum / jus in bello* separation, fundamentally destabilizing the current system by making the permissibility of killing contingent on the underlying justice of the cause and the specific threat posed by each individual, rather than their formal status. This would prioritize moral coherence over pragmatic functionality, likely at the cost of predictability and potentially increasing suffering. The current system accepts philosophical strain as the price for having *any* rules governing the hell of war.
