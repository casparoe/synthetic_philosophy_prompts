  I retired from physics a few years ago and have been teaching myself philosophy since — decision theory mostly, because it's the one corner that feels like it has right answers. Heres the thing I can't get past. Two people play a one-shot prisoners dilemma, no communication, no repetition, no reputation, nothing that ties their choices together causally. Superrationality says: you'd both reason the same way from the same setup, so you'd both land on the same conclusion, so you may as well pick the conclusion that's best if you both act on it — cooperate. Fine. But in physics two systems only evolve identically if they're identical; differ by an epsilon and the trajectories diverge, faster the more sensitive the dynamics. Real players are never identical — different payoffs, priors, moods, and their reasoning is chaotic enough that small differences probably blow up. So give me your actual number: whats your credence that cooperation is the rationally required move in that game, where the two players are near-duplicates rather than exact duplicates? Decompose it. How much rides on (a) whether 'rational' is evaluating an act rather than a policy or a kind of agent, (b) whether near-identity still buys the logical/causal link that makes my choice evidence about yours, (c) whether 'everyone does the same thing' has any determinate extension once the players differ slightly, (d) whether the plain dominance argument for defecting just wins once exact identity is gone, and (e) whatever else you think belongs. Rough number and one line for each, then the combination, then tell me which term the total is most sensitive to and what would actually move it. I'm around 0.45 myself and it swings by the hour, so dont be polite about the weak parts.
