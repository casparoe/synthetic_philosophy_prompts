answer: |-
  Here's my decomposed credence for cooperation being rationally required in a one-shot PD with near-duplicates, followed by sensitivity analysis. I'll start with a neutral base of **0.50** (maximal uncertainty) and adjust for each factor. Total credence: **0.40**.  

  ### Decomposition (adjustments to base 0.50):  
  **(a) Rationality evaluating ACT vs. POLICY/AGENT**  
  - If rationality evaluates only the *act* (given fixed opponent), defection dominates → **-0.15**  
  - If it evaluates a *policy* (e.g., "cooperate if identical reasoning") or *agent type*, cooperation gains traction → **+0.15**  
  - *Net adjustment*: **±0.00** (near-duplicates weaken policy/agent case but don’t kill it).  

  **(b) Near-identity preserving LOGICAL/CAUSAL LINK**  
  - With exact duplicates, your choice *is* evidence for theirs (evidential decision theory). Near-identity preserves ~70% of this link → **+0.20**  
  - But small differences (e.g., mood, priors) decay correlation → **-0.10**  
  - *Net adjustment*: **+0.10** (link exists but is fragile).  

  **(c) Determinate extension of "EVERYONE DOES THE SAME"**  
  - Slight differences make "same conclusion" ambiguous (e.g., one defects due to a headache). Cooperation’s coherence drops → **-0.15**.  

  **(d) DOMINANCE argument strength**  
  - Without exact identity, defection’s dominance (always better *conditional on opponent’s choice*) resurfaces → **-0.30**.  

  **(e) OTHER FACTORS**  
  - **Evolutionary stability**: Defection is stable, cooperation isn’t → **-0.05**  
  - **Common knowledge**: Near-duplicates reduce confidence in mutual rationality → **-0.05**  
  - **Computational limits**: Chaotic reasoning amplifies small differences → **-0.05**  
  - *Net adjustment*: **-0.15**.  

  ---

  ### Total Credence:  
  **Base 0.50**  
  + (a) 0.00 + (b) +0.10 + (c) -0.15 + (d) -0.30 + (e) -0.15 = **0.40**  

  ---

  ### Sensitivity & What Moves It:  
  - **Most sensitive to (d) DOMINANCE** (weight: **-0.30**). If you weaken dominance (e.g., by arguing that "rational" implies ignoring dominance under symmetry), credence rises. If you emphasize *any* non-identity breaks dominance immunity, it crashes to ~0.10.  
  - **Runner-up: (b) LOGICAL LINK** (net +0.10). Credence is highly elastic to evidence about correlation decay:  
    - If studies show +90% action alignment in near-duplicate PDs → credence +0.25 (to 0.65).  
    - If chaos theory implies >50% divergence → credence -0.20 (to 0.20).  

  ### Why 0.40?  
  - Superrationality’s core evaporates fast without exact duplicates, but the *intuition* of correlated reasoning persists. Physics-style sensitivity (Lyapunov exponents in reasoning) suggests **defection should dominate**—yet we can’t fully dismiss the evidential tug (hence not 0.20). Your 0.45 is defensible; my lower score prioritizes dominance.  

  **What would move my credence?**  
  - **To 0.60+**: Empirical data showing >80% cooperation in near-duplicate lab PDs.  
  - **To 0.20**: Formal proof that any payoff/prior difference >ε breaks the evidential link.  
  - **Your swing**: Likely from agonizing over (b) vs. (d). Physics intuition favors (d), philosophy hopes for (b).
