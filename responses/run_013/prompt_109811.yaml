answer: |-
  Here is a draft joint statement resulting from adversarial collaboration, incorporating agreed claims, precise disagreements, cruxes, and concrete predictions regarding the lookup table case. It avoids strawmen by using each side's core framing commitments.

  ---

  **Joint Statement on Moral Status, Computation, and Implementation**

  **Section 1: Agreed Claims**

  1.  **Moral Status Depends on Phenomenal Consciousness:** Moral status requiring consideration (e.g., prevention of suffering, respect for preferences) arises only if a system possesses phenomenal consciousness ("what it is like" to be that system). Sentience is a necessary condition for this moral status.
  2.  **Functional Organization is Necessary (but Potentially Insufficient):** Phenomenal consciousness supervenes on the functional/causal organization of a system. No viable theory of consciousness locates sentience solely in substrate properties independent of how the system processes information and responds to inputs. Substrate matters only insofar as it enables or constrains functional organization.
  3.  **"Implementation" Requires Causal Structure:** Claiming a physical system *implements* a specific computation requires that the system's physical states and transitions causally mirror the formal states and transitions defined by the computation. Mere isomorphism (structural similarity) is insufficient; the causal dynamics of the physical system must track the computation's formal dynamics under relevant inputs.
  4.  **The Lookup Table (LT) Case is a Critical Test:** A system that perfectly mimics the input-output behavior and functional profiles of a putatively sentient system (e.g., a human), but whose internal mechanism is *by construction* a direct input-to-output mapping via a precomputed table (or minimal regenerator), is a crucial test case for both positions regarding whether computations can ground claims of moral status.
  5.  **Implementation Claims are Not Arbitrary:** Attributing a computation to a system is constrained by the system's physical, causal structure. Not *any* computation can be plausibly attributed to *any* system; the attribution must fit the system's actual causal dynamics at some level of description. The dispute concerns *how* this level is selected and whether it uniquely determines *the* computation implemented.
  6.  **Evidence Involves Causal Structure & Counterfactuals:** Empirical evidence relevant to sentience in implementations involves:
      *   The fine-grainedness and robustness of the causal structure.
      *   The system's behavior under novel inputs and perturbations.
      *   The presence of counterfactual-supporting states (states that play roles conditional on inputs that *didn't* occur).
      *   Neural/structural similarity to known conscious systems (for biological substrates).
      *   Evidence against sentience would include showing the system lacks relevant causal complexity or counterfactual robustness, even if behaviorally indistinguishable.
  7.  **Semantic Disagreement on "Computation":** Part of the disagreement is verbal regarding the scope of "computation":
      *   **Functionalist:** Uses "computation" broadly to mean *any* formal description isomorphic to the system's causal structure at the relevant grain.
      *   **Skeptic:** Uses "computation" more narrowly, implying an algorithmic process involving state transitions and manipulation, not just static structure or input-output mappings. The skeptic argues the functionalist's broad use renders "implements" vacuous for grounding moral status.
  8.  **Semantic Disagreement on "Sentience":** There is also a verbal component regarding "sentience":
      *   **Functionalist:** Equates sentience with the presence of the right functional/computational organization (the "phenomenal function").
      *   **Skeptic:** Argues that "sentience" refers to an intrinsic property (subjective experience) whose presence *is indicated* by functional organization but is not *constituted solely* by it in a way detachable from attributional context.

  **Section 2: Precise Disagreements, Cruxes, and Lookup Table Predictions**

  | Crux                                                                 | Functionalist Position (Acceptable Wording)                                                                 | Attribution Skeptic Position (Acceptable Wording)                                                                 | Prediction on Lookup Table (LT) Case                                                                                               |
  | :------------------------------------------------------------------- | :---------------------------------------------------------------------------------------------------------- | :---------------------------------------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------------------------------------------- |
  | **1. Objectivity of Implementation:** Is there a unique, objective "relevant grain" of description at which a system implements a specific computation, fixed solely by the system's causal structure? | **Yes:** The causal structure of any physical system uniquely determines a privileged level of abstraction (grain of description) at which it implements a specific computation. This level is fixed by the system's intrinsic dynamics, not observer interests. | **No:** While causal structure constrains possible attributions, there is no observer-independent fact about *which* grain is the "relevant" one for specifying *the* computation implemented. Grain selection reflects explanatory or pragmatic interests. | **Functionalist:** A sufficiently fine-grained LT *does* implement the target computation at the relevant causal grain, exhibiting the necessary causal structure for sentience. |
  | **2. Grounding of Moral Status:** Does moral status (based on sentience) supervene *directly* on the implemented computation itself, or does it supervene on the physical system *under* a valid attribution? | Moral status supervenes directly on the implemented computational structure. If the computation is implemented, sentience (and moral status) is present, regardless of how the attribution was made. | Moral status supervenes on the physical system *when described* (attributed) at a grain relevant for sentience attribution. The act of valid attribution is part of what makes talk of *its* sentience coherent; it's not inherent solely to the abstract computation. | **Skeptic:** The LT, regardless of granularity, does not possess moral status. It merely satisfies behavioral criteria; attributing sentience to *it* is a pragmatic choice, not a discovery about the LT's intrinsic properties. |
  | **3. Use vs. Instantiation:** Is it necessary for the system to *use* the computational states causally in its operation (i.e., states play a counterfactual-supporting role in generating outputs), or is it sufficient that the states are simply *instantiated* (structurally present)? | **Use is Implicit in Relevant Grain:** At the privileged causal grain, the relevant computational states *are* the physical states playing causal, counterfactual-supporting roles. Instantiation at that grain *is* use. | **Use is Essential:** Moral status requires that the computational states are not merely present but are *causally efficacious* in the system's operation – they must play a role in *processing* inputs and generating outputs across counterfactuals. Mere structural pattern matching is insufficient. | **Functionalist:** The LT's entries *are* the causally efficacious states at the relevant fine-grained level. Their activation *is* the computational process. <br> **Skeptic:** The LT states are not *used* computationally; they are inert labels referenced. No causal process *manipulates* representational states; output is simply retrieved/stated. |
  | **4. Primary Source of Constraint:** What primarily determines whether an attribution of sentience is valid? | The intrinsic causal/computational structure of the system, objectively discernible at the privileged grain. | The coherence and purpose of the attributional practice itself, constrained (but not uniquely determined) by the system's causal structure. | **Functionalist:** Validity depends solely on LT's internal causal structure matching the target computation. <br> **Skeptic:** Validity depends on the context and purpose of attributing a mind/sentience to the LT, given its causal limitations. |

  **Summary of Genuine vs. Verbal Disagreements:**

  *   **Genuine Disagreements:** The core disagreements are factual/philosophical concerning:
      1.  **Objectivity of Grain:** Is there a single, system-determined "relevant grain"? (Crux 1)
      2.  **Grounding of Morality:** Does moral status latch onto the abstract computation or the attributed system? (Crux 2)
      3.  **Causal Efficacy:** Is *causal use* of internal states essential beyond structural instantiation? (Crux 3 - Though partially entangled with Crux 1 for the Functionalist).
  *   **Primarily Verbal Disagreements:**
      1.  **Scope of "Computation":** The Functionalist uses a broader definition encompassing any isomorphic causal structure; the Skeptic uses a narrower definition implying algorithmic processing. This leads to talking past each other on whether an LT "implements a computation" in the morally relevant sense.
      2.  **Constitution of "Sentience":** The Functionalist sees sentience as constituted by functional organization; the Skeptic sees functional organization as *evidence for* or a *condition of attribution* of sentience, which is a distinct property. This leads to different interpretations of what "sentience" means when applied to a system.

  **Resolution Path:** Future collaboration should focus experiments and analysis on Crux 1 (Objectivity of Grain) and Crux 3 (Use vs. Instantiation), particularly using systems like the LT case and graded variants (e.g., systems with varying degrees of counterfactual robustness) to test predictions. Clarifying the verbal disagreements (definitions of "computation" and "sentience") is essential for productive dialogue.

  ---
  This document provides a common starting point by establishing shared ground, precisely isolating the core disagreements using each side's own commitments, clarifying the role of the key test case, and distinguishing genuine philosophical divides from semantic mismatches. It forces both sides to explicitly state their predictions for the LT case and links them to the underlying cruxes.
