prompt: |-
  I work in a community mental-health team, and since our service adopted a standardised symptom inventory that both patients and clinicians complete at every contact, I have noticed that I reach for its vocabulary to describe my own low moods before I reach for my own. A colleague says this shows that the inventory does not measure distress so much as manufacture it. I suspect that is either a serious claim or an inflated way of saying that the form changes how people talk, and I want to find out which. I have a semester's leave and want to write a 6,000-word chapter on this question: can Foucault's formula that power produces knowledge be read as a claim about the identity of what is known — that the eliciting apparatus helps constitute the content of the knowledge, not merely the occasion of its discovery — and does the standardised inventory support that strong reading, or expose it as incoherent?

  Turn this into a chapter proposal. State the question so that it has a determinate answer. Set out the two or three precise readings of the formula that the question turns on, and for each say what it would entail about whether the same fact could be known under a different arrangement of power; explain why the standard treatments leave the choice between them open. Describe the method — which apparatuses I would work through (I am thinking of the examination, the confession and the standardised inventory) and what I would be looking for in each — and why conceptual analysis is the right instrument here rather than archival history or fieldwork. Say what a successful outcome looks like, what would count as the project failing, and whether one chapter is realistic or whether I am really describing a dissertation. Assume I will supply the citations myself. Write in British English. End with a final line beginning Question: followed by the whole research question in a single sentence.
