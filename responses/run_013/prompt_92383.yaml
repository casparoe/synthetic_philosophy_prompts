prompt: |-
  I am assembling a specification for a theory of psychiatric classification, and I want the desiderata in hand before I judge any candidate theory. Treat the case sketched below as stipulated background rather than as something to look up.

  Suppose a major diagnostic manual introduces a new adult category — call it reduced social reward syndrome — defined by a checklist of behavioral criteria and diagnosed chiefly by self-report: a stable, lifelong pattern of diminished pleasure in social contact, low motivation to seek company, and little distress about the resulting isolation. The category is introduced because clinicians reported a gap and because a research group campaigned for it; its recorded prevalence rises steeply in the years after introduction; advocacy communities form around the label; some diagnosed people say the diagnosis reorganized how they understand their own histories and changed what they expect of themselves; and the category overlaps with, but is not reducible to, the autism spectrum and social anxiety disorder. It runs in families and responds partially to one class of medication, but its boundaries shift with each manual revision and its prevalence varies sharply across cultures.

  Write the desiderata any adequate theory of psychiatric classification must meet. For each requirement, give the case or consideration that motivates it. I expect the list to cover, at least: the phenomena the theory must explain (the stipulated category and cases of its shape; the removal of homosexuality from the manuals; the historical rise and fall of hysteria and of the nineteenth-century "diagnosis" that treated enslaved people who fled captivity as mentally ill; cross-cultural variation in prevalence; comorbidity; heritability and treatment response); the distinctions it must not collapse (disorder versus diversity, validity versus reliability, natural kind versus social kind, classification versus diagnosis, the person classified versus the classification itself); and the empirical and sociological results it must remain consistent with. Be explicit about what the theory owes to the looping effect — the possibility that classifying people changes them, so that the category and its members co-evolve — and to the observation that categories can be revised in response to patient experience and advocacy rather than only to new biological findings.

  Then do three things. Mark which requirements are non-negotiable and which are merely preferences of a particular camp. State plainly whether the requirement that categories track a stable, mind-independent dysfunction is jointly satisfiable with the requirement that the theory accommodate looping effects and the revisability of categories under patient testimony; if these two cannot both be met, that conflict is the result I most want to see. And name the single requirement that does the most to exclude the current contenders.

  Keep the weight on the criteria and their motivating cases; a scorecard of particular manuals or theorists is optional and secondary. Do not supply reading lists or citations — reason from the cases as given.
reasoning: |-
  Okay, the user is asking for a set of desiderata for a theory of psychiatric classification, based on a detailed case study about "reduced social reward syndrome." They want the requirements to cover specific phenomena, distinctions, and empirical results, with an emphasis on looping effects and the tension between tracking mind-independent dysfunction and accommodating social factors. Let me unpack this step by step.

  First, the scenario describes a new psychiatric category that emerges from clinical gaps and advocacy, shows variable prevalence, has both biological correlates (familial patterns, medication response) and social dimensions (label-driven identity changes, cultural variations). The user explicitly references historical cases like the removal of homosexuality from manuals and the pathologization of enslaved people fleeing captivity. This suggests the desiderata must address both scientific validity and ethical/social dimensions.

  The key challenges seem to be:
  - Reconciling biological markers (heritability, treatment response) with constructed aspects (prevalence shifts after introduction, advocacy influence)
  - Accounting for looping effects where diagnosis alters self-perception and behavior
  - Balancing mind-independent dysfunction claims with category fluidity under social pressure
  - Avoiding harmful medicalization while retaining clinical utility

  For non-negotiables, I'm considering:
  1. Ethical non-arbitrariness (to prevent repeats of homosexuality/drapetomania pathologization)
  2. Empirical adequacy (must explain comorbidity, treatment response etc.)
  3. Ontological distinction between disorder/diversity (to prevent overmedicalization)

  The tension point is clearly Requirement 11 vs 12: 
  - If categories must track stable dysfunctions (R11), but also evolve via patient testimony (R12), is this possible? The reduced social reward syndrome case suggests yes – it has biological correlates but boundaries shift. A theory could allow core dysfunction to be real while its expression/categorization is socially modulated.

  The most exclusionary requirement might be R13 (non-reductionism), as current contenders often lean either toward biological essentialism or social constructivism without integrating both.

  The user seems deeply familiar with philosophy of psychiatry – they reference Hacking's looping effects without naming him. Their unspoken need might be to resolve the realism vs constructivism debate in classification. The emphasis on "joint satisfiability" suggests they want to test if a middle path exists.

  For structure, I'll:
  1. Group desiderata by phenomena/distinctions/results
  2. Motivate each with the case or historical examples
  3. Flag negotiables vs non-negotiables
  4. Explicitly analyze the R11-R12 tension
  5. Identify R13 as the biggest filter for existing theories

  The reduced social reward syndrome case is perfect for showing why all these matter: its biological aspects (familial, medication) demand scientific validity, while its social dynamics (advocacy, identity changes) demand attention to looping effects.
answer: |-
  Here are the desiderata for a theory of psychiatric classification, derived from the stipulated case and broader considerations. Requirements are grouped by theme, with motivations and negotiation status indicated. Non-negotiables are foundational; preferences reflect contested but defensible positions.

  ---

  ### **I. Phenomena the Theory Must Explain**
  1. **Category Emergence & Adoption**  
     *Requirement:* Explain why new categories arise (e.g., reduced social reward syndrome) without definitive biological evidence.  
     *Motivation:* The case shows categories emerging from clinician-reported gaps and advocacy campaigns, not new science.  
     *Status:* **Non-negotiable** (historical precedent: hysteria’s rise).

  2. **Prevalence Flux & Cultural Variation**  
     *Requirement:* Explain sharp changes in recorded prevalence post-introduction and across cultures.  
     *Motivation:* Reduced social reward syndrome’s steep rise and cultural variability cannot be attributed solely to biology.  
     *Status:* **Non-negotiable** (cross-cultural psychiatry data).

  3. **Comorbidity & Boundary Instability**  
     *Requirement:* Explain overlap with other categories (e.g., autism, social anxiety) and shifting diagnostic boundaries.  
     *Motivation:* The syndrome overlaps with but is irreducible to existing categories, and its criteria shift with revisions.  
     *Status:* **Non-negotiable** (ubiquity of comorbidity in practice).

  4. **Biological Correlates Amidst Instability**  
     *Requirement:* Explain partial heritability and treatment response despite fuzzy boundaries.  
     *Motivation:* The syndrome "runs in families" and responds to medication, yet lacks stable definitions.  
     *Status:* **Non-negotiable** (e.g., schizophrenia has genetic links but no discrete biomarkers).

  5. **Looping Effects**  
     *Requirement:* Explain how classification alters self-conception, behavior, and social outcomes.  
     *Motivation:* Diagnosed individuals report changed self-narratives and expectations after receiving the label.  
     *Status:* **Non-negotiable** (empirical: e.g., ADHD diagnosis alters self-perception and social responses).

  6. **Category Removal & Harm Reduction**  
     *Requirement:* Explain declassification of categories like homosexuality or drapetomania.  
     *Motivation:* These were removed due to ethical/social critique, not new science.  
     *Status:* **Non-negotiable** (moral imperative to prevent medicalization of non-pathological traits).

  ---

  ### **II. Distinctions the Theory Must Preserve**
  7. **Disorder vs. Diversity**  
     *Requirement:* Delineate harmful dysfunction from benign human variation.  
     *Motivation:* Reduced social reward syndrome might reflect neurodiversity (low distress) or disorder (diminished function).  
     *Status:* **Non-negotiable** (ethical: pathologizing diversity causes harm, e.g., homosexuality).

  8. **Validity vs. Reliability**  
     *Requirement:* Separate diagnostic consistency (reliability) from accuracy in capturing a real phenomenon (validity).  
     *Motivation:* The syndrome is reliably diagnosed via checklist but lacks stable validity.  
     *Status:* **Non-negotiable** (epistemological: reliability ≠ truth).

  9. **Natural Kind vs. Social Kind**  
     *Requirement:* Acknowledge categories may reflect biological mechanisms, social constructs, or both.  
     *Motivation:* The syndrome has biological correlates (heritability) but is shaped by advocacy and culture.  
     *Status:* **Preference** (realist-leaning theorists reject social kinds; pragmatic/pluralist views accept hybrids).

  10. **Classification vs. Diagnosis**  
      *Requirement:* Distinguish system-level taxonomy from individual clinical judgments.  
      *Motivation:* The syndrome’s diagnostic criteria shift, but its core concept persists across revisions.  
      *Status:* **Preference** (operational: diagnosis involves context; classification is abstract).

  11. **Person vs. Classification**  
      *Requirement:* Ensure the classified individual is not reduced to the label.  
      *Motivation:* Advocacy communities reorganize identity around the label (e.g., "autistic person" vs. "person with autism").  
      *Status:* **Non-negotiable** (ethical: labels can dehumanize).

  ---

  ### **III. Consistency Requirements**
  12. **Accommodate Patient Agency & Revision**  
      *Requirement:* Categories must be revisable based on patient testimony/advocacy, not just biological findings.  
      *Motivation:* The syndrome was campaigned for by stakeholders; its revisions reflect lived experience.  
      *Status:* **Non-negotiable** (empirical: e.g., PTSD revisions driven by veterans).

  13. **Non-Reductionism**  
      *Requirement:* Resist reducing psychiatric categories to solely biological or social levels.  
      *Motivation:* The syndrome involves neurobiology (medication response) and sociology (advocacy).  
      *Status:* **Preference** (excludes hard-line biological or social constructivist theories).

  ---

  ### **IV. Critical Tension: Stability vs. Looping**
  - **Requirement 11 (R11):** Categories must track *mind-independent dysfunction*.  
  - **Requirement 12 (R12):** Categories must accommodate *looping effects and patient-driven revision*.  
  - **Joint Satisfiability:** **Yes**, *if* the theory posits:  
    - A **bifurcated ontology**: Core dysfunction exists (e.g., neurobiological mechanisms of reward processing), but its *expression, significance, and thresholds* are modulated by social context and looping.  
    - **Dynamic validity**: Validity is not static; it includes the category’s capacity to explain outcomes (e.g., treatment response) *and* its ethical/social consequences.  
  - **Conflict Resolution Example:** Reduced social reward syndrome’s *core deficit* (impaired social motivation circuitry) could be mind-independent, while its *diagnostic threshold* (e.g., "little distress") is socially negotiated. Patient testimony refines the threshold, not the core mechanism.

  ---

  ### **V. Most Exclusionary Requirement**
  **Requirement 7 (Disorder vs. Diversity)**  
  - **Why:** It excludes:  
    - **Over-medicalizing theories** (e.g., those pathologizing all statistically abnormal traits).  
    - **Anti-medicalizing theories** (e.g., those rejecting all biological dysfunction in psychiatry).  
  - **Excluded Contenders:**  
    - Strict biologism (fails to distinguish dysfunction from benign variation).  
    - Radical constructivism (denies any mind-independent dysfunction).  
    - DSM-style operationalism (prioritizes reliability over validity, risking medicalization of diversity).

  ---

  ### **Summary: Negotiability & Purpose**
  | **Requirement** | **Key Motivation**                     | **Non-Negotiable?** |
  |------------------|----------------------------------------|---------------------|
  | 1 (Emergence)    | Reduced social reward syndrome         | Yes                 |
  | 2 (Prevalence)   | Cultural flux in syndrome              | Yes                 |
  | 3 (Comorbidity)  | Boundary instability                   | Yes                 |
  | 4 (Biology)      | Heritability/treatment in fuzzy cases  | Yes                 |
  | 5 (Looping)      | Diagnosis alters identity              | Yes                 |
  | 6 (Removal)      | Homosexuality/drapetomania             | Yes                 |
  | 7 (DvD)          | Harm in pathologizing diversity        | **Yes**             |
  | 8 (VvR)          | Syndromes reliable but invalid         | Yes                 |
  | 9 (Natural/Social)| Hybrid ontology of syndrome           | Preference          |
  | 10 (Class/Diag)  | Shifting criteria vs. stable concept   | Preference          |
  | 11 (Person≠Label)| Advocacy identity reorganization       | Yes                 |
  | 12 (Patient Voice)| Revisions driven by testimony          | Yes                 |
  | 13 (Non-Reduction)| Syndrome as bio-socio hybrid          | Preference          |

  This framework forces theories to confront psychiatry as a *biopsychosocial* practice, rejecting purity tests (biological vs. social) while demanding empirical rigor and ethical accountability. The tension between R11 and R12 is resolvable but requires nuanced realism.
