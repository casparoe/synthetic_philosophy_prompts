prompt: |-
  I am assembling a three-year research programme on the ethics and epistemology of blame, staffed by two postdocs with a modest budget for survey and vignette studies, and I need to decide what it should actually be about. Take the following as a working hypothesis rather than a thesis to be defended: that the literature has treated standing to blame as a binary property of an individual blamer — either you have it or you do not — whereas it is better modelled as a scalar, domain-relative relation that can be pooled within a community and even borrowed from an institution whose standing is not in doubt. On this picture a wronged party, a fellow participant in a practice, and a court each hold different quantities of standing over different ranges of conduct, and those quantities can be lent, aggregated, or forfeited in ways that ordinary talk of hypocrisy and meddling obscures.

  Given that reframing as a starting point, I want a prioritised agenda rather than a survey. Which open questions does it make urgent, and which does it dissolve or render idle? Consider, among others: whether standing is a normative status of the blamer or merely a pragmatic precondition on the speech act of blaming; whether pooled or borrowed standing is genuinely coherent or collapses into the standing of whoever supplied it; what makes a forfeiture of standing permanent, temporary, or repairable, and what repair would consist in; whether standing and desert can come apart, so that one may deserve blame yet lack the standing to deliver it; and how individual standing interacts with institutional blame and punishment, where the blaming agent is not a person at all.

  Rank these, and any you would add, by how much other work depends on them, how tractable they are for philosophers working with a little empirical support rather than for psychologists or lawyers, and how neglected they currently are. Defend the ordering: name the criteria you are using, where they trade off against one another, and what evidence or argument over the next two or three years would move a question up or down the list. Tell me which single question the programme should lead with, why it is upstream of the rest, and what a genuine result on it would look like — what would count as progress rather than mere restatement. I am interested in the reasoning, not in a reading list.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're setting up a three-year research program on the ethics and epistemology of blame, focusing on reframing standing to blame as scalar, relational, and transferable. The user wants a prioritized research agenda, not just a survey. 

  First, I need to understand their core hypothesis: that standing isn't binary but scalar, domain-specific, and can be pooled or borrowed. This challenges existing literature. The user listed several questions, but I should evaluate which ones are most critical, tractable, and neglected. 

  Looking at the questions they mentioned: the normative vs. pragmatic debate about standing, the coherence of pooled/borrowed standing, forfeiture and repair, the separation of standing and desert, and institutional interactions. I need to add any missing angles. Maybe how standing scales quantitatively or cultural variations, but the user seems more focused on conceptual and relational aspects.

  Prioritization criteria: how much other work depends on it (dependency), tractability for philosophers with empirical support, and current neglect. Trade-offs exist—some high-dependency questions might be less tractable. For example, the foundational question about what standing *is* (normative vs. pragmatic) is crucial because it affects all other aspects. If standing is merely pragmatic, pooling might just be about effectiveness, not normative authority. But if it's normative, then pooling needs a different justification. That's why it's upstream—it sets the stage for others.

  Next, pooled standing coherence. If pooled standing collapses into the original giver's standing, then the whole idea of aggregation fails. This is both foundational and tractable. Philosophers can use thought experiments and vignettes to test intuitions about whether aggregated standing feels legitimate or derivative.

  Forfeiture and repair comes next. Understanding temporary vs. permanent forfeiture ties into moral psychology and real-world practices like forgiveness. Vignette studies here could explore what actions repair standing. This is tractable with empirical methods but might depend on prior answers to what standing fundamentally is.

  Standing vs. desert separation follows. If someone deserves blame but no one has standing, that affects blame's moral structure. However, this might be less urgent if the foundational questions aren't resolved. Still, it's important for understanding blame's ethics, especially in cases like historical injustices.

  Institutional interactions are crucial but might require more legal expertise. Since the program has limited resources, this could be lower priority unless the user has a specific interest in legal systems. 

  The user mentioned avoiding a reading list, so focus on reasoning. The lead question should be the normative/pragmatic one because it underpins everything else. Progress would be a framework that integrates both elements, showing how pragmatic factors influence normative authority without collapsing into pure pragmatism. 

  Tractability: Vignette studies can test intuitions on scalar standing or pooled legitimacy. Surveys could measure how people perceive standing loss and recovery. Philosophers can handle this with empirical support without needing full-scale psych studies. 

  Neglect: Current literature often treats standing as binary and individual. Scalar, relational approaches are underexplored, making these questions ripe for investigation. 

  Trade-offs: High-dependency questions are essential but might be complex. The lead question balances dependency and tractability. Forfeiture is tractable but less upstream. Pooled standing is critical but might depend on the foundational issue. 

  The user's deeper needs: They want a structured, impactful program that produces clear results. They need to justify the program's focus and show how it advances the field beyond existing work. Prioritizing questions that are both innovative and manageable within three years is key. Ensuring that the research has practical implications, perhaps in restorative justice or institutional accountability, might also be an unspoken goal.
answer: |-
  Here’s a prioritised research agenda grounded in your scalar-relational reframing of standing to blame, ranked by **dependency** (how many other questions hinge on it), **tractability** (feasibility for philosophers with light empirical support), and **neglect** (current under-exploration). Trade-offs occur when high-dependency questions are less tractable or moderately neglected, but the ranking optimises for foundational impact.

  ### Prioritisation Criteria
  1. **Dependency (Weight: High)**  
     Does resolving this question unlock progress on others? Upstream questions anchor the framework.
  2. **Tractability (Weight: Medium-High)**  
     Can it be addressed with conceptual rigor + vignettes/surveys (not requiring longitudinal data, legal expertise, or advanced stats)?
  3. **Neglect (Weight: Medium)**  
     Is it overlooked in current literature? Avoids duplicating existing work.

  ### Ranked Questions (with Rationale)
  1. **Is standing a normative status or a pragmatic precondition?**  
     - **Why #1?** *Ultimate dependency*. If standing is purely pragmatic (e.g., about blame’s effectiveness), scalar/relational features reduce to social psychology. If normative (e.g., about moral authority), pooling/forfeiture requires new ethical principles.  
     - **Tractability**: Test via vignettes varying blamers’ relational properties (e.g., "Does a hypocritical activist *deserve* less credibility, or just *reduce persuasion*?").  
     - **Neglect**: Binary views dominate; scalar normativity is underexplored.  
     - **Progress**: A hybrid account (e.g., "normative standing constrained by pragmatic defeasibility") that explains variance in blame uptake. *Moves the field beyond stalemate.*

  2. **Does pooled/borrowed standing collapse into the standing of the supplier?**  
     - **Why #2?** *High dependency* on Q1. If pooling merely delegates authority (e.g., courts "borrow" standing from the state), relational standing adds little. If it *creates new standing* (e.g., #MeToo aggregating victim testimonies), it revolutionizes blame ethics.  
     - **Tractability**: Vignettes on group blame (e.g., "Can a minority of victims blame for all if others stay silent?") + historical case studies.  
     - **Neglect**: Almost entirely untheorized.  
     - **Progress**: Criteria for when pooling *generates* vs. *transfers* standing (e.g., threshold-based emergence).

  3. **What governs forfeiture and repair of standing?**  
     - **Why #3?** *Moderate dependency* (requires Q1’s normative/pragmatic clarity). Scalar forfeiture (e.g., losing *some* standing for *some* wrongs) challenges binary "hypocrite!" dismissals.  
     - **Tractability**: Vignettes on post-transgression behavior (e.g., "Does reparations restore standing to blame others for similar wrongs?").  
     - **Neglect**: Forfeiture is debated, but scalar repair is not.  
     - **Progress**: A model of "standing debt" and reparative actions (e.g., proportionality between wrong and restoration effort).

  4. **Can standing and desert of blame come apart?**  
     - **Why #4?** *Lower dependency* – hinges on Q1–Q3 but less central to relational mechanics.  
     - **Tractability**: Clear thought experiments + surveys (e.g., "Can a corrupt judge *deserve* blame but lack standing to blame others for corruption?").  
     - **Neglect**: Often conflated; scalar-relational view forces separation.  
     - **Progress**: Demonstrating cases where desert is agent-relative but standing is practice-relative.

  5. **How does individual standing interact with institutional blame?**  
     - **Why #5?** *Lowest dependency* – builds on Q2/Q4 but more specialized.  
     - **Tractability**: Requires legal/political analysis (less philosopher-friendly).  
     - **Neglect**: Some work on institutional blame, but not scalar pooling.  
     - **Progress**: Criteria for when institutions "borrow" standing from members vs. create it *sui generis*.

  ### Added Questions
  - **How does scalar standing vary across relational domains (e.g., family vs. workplace)?**  
    (Rank: Between Q3–Q4. Tractability: High with domain-specific vignettes. Neglect: High.)
  - **Can standing quantities be quantified (e.g., thresholds for "enough" standing)?**  
    (Rank: After Q2. Dependency: Requires pooling mechanics. Tractability: Surveys on "minimal standing." Neglect: Extreme.)

  ### Why Lead with Q1?
  **Q1 is upstream**: Without clarifying standing’s *nature*, scalar/relational features risk being misinterpreted as descriptive (not normative) or reducible to psychology. A genuine result would be a **unified account** showing how normativity and pragmatics interact (e.g., "Standing is normative authority modulated by relational context: transgressions degrade authority proportionally"). Vignettes could isolate when observers judge blame as *illegitimate* (normative failure) vs. *ineffective* (pragmatic failure). Progress: Moving from "Is standing normative?" to "*How* do pragmatic factors constrain normative standing?"

  ### What Shifts Rankings?
  - **Q1 drops** if empirical work shows blame uptake *always* tracks perceived authority (supporting normativity) or *always* tracks efficacy (supporting pragmatism).  
  - **Q2 rises** if Q1 resolves as *hybrid* – pooling then becomes critical to test normative emergence.  
  - **Forfeiture (Q3) rises** if scandals (e.g., public figures blaming amid accusations) make repair mechanisms urgent.  

  ### Programme Strategy
  **Year 1**: Tackle Q1 (vignettes on blame legitimacy vs. efficacy) + develop scalar metrics.  
  **Year 2**: Test pooling (Q2) and forfeiture (Q3) via group-based scenarios.  
  **Year 3**: Explore applications (Q4–Q5, added questions).  

  This ordering builds theoretical foundations *while* generating empirical tools to test the core reframing, ensuring each step informs the next.
