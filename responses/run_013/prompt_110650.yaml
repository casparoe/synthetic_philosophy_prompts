   Key elements:
   1. Introduction (10 minutes)
   2. Activity Part 1: Drawing random chords (30 minutes)
   3. Pooling data and revealing the inconsistency (15 minutes)
   4. Activity Part 2: The bet (20 minutes)
   5. Debrief and discussion (15 minutes)

   Materials:
   - Pre-printed paper discs (laminated if possible) with an inscribed equilateral triangle (so that the side of the triangle is a chord). The circle should be large enough (e.g., 10 cm diameter) to draw chords easily.
   - Fine-tip dry-erase markers (if laminated) or regular pens (if not laminated) for drawing chords.
   - A method to generate chords in three different ways (for the bet) without revealing the method to the participants until after the bet.

   Brainstorming three ways to stage the activity:

   Option 1: Focus on one method at a time for the whole group.
     - We divide the group into three. Each subgroup uses one method to draw chords. Then we pool the data per method and see that each method gives a different probability.
     - Advantage: Clear comparison. Disadvantage: Participants might not experience the arbitrariness of choosing a method individually.

   Option 2: Each participant chooses their own method without being told how, and we don't tell them there are different methods until after.
     - We simply say: "Draw a chord at random." Then we see the variation and try to categorize the methods afterwards.
     - Advantage: More natural and closer to the paradox. Disadvantage: It might be messy to categorize and we might not get clear groupings.

   Option 3: We guide the group through each method one by one, and for each method, we collect data and compute the probability. Then we compare.
     - Advantage: Controlled and clear. Disadvantage: Less discovery.

