  The user has outlined several considerations: how Mencius's "human nature is good" should be interpreted, whether Xunzi's "human nature is bad" refers to unshaped desires rather than innate malice, if Xunzi's transformation process requires an innate capacity that Mencius would call "nature," whether they're even using the same definition of "nature," and how much substantive disagreement remains after clarifying these points.

  I need to assess the plausibility that their dispute is mostly verbal. I'll start by recalling the core arguments. Mencius argues that humans have innate moral sprouts—like compassion at seeing a child about to fall into a well—that can develop into full virtues with proper cultivation. Xunzi counters that human nature is inherently selfish and chaotic, requiring strict rituals and education to impose order, as raw desires lead to conflict without external discipline.

  For the verbal dispute aspect, I consider interpretive flexibility. Mencius's "goodness" could be seen as potential, not perfected virtue. Xunzi's "badness" might mean untamed tendencies, not active evil. The definition of "nature" is crucial: Mencius sees it as developmental potential, while Xunzi focuses on birth-state instincts. If these definitions differ, their claims don't directly contradict.

  A major sticking point is whether Xunzi's rituals imply an innate capacity for transformation. If humans can be shaped by ritual, that capacity must be innate, which Mencius would call part of "nature." Xunzi doesn't address this explicitly, leaving tension in his argument. The user mentions instability here—is it real or a lens effect? I lean toward it being a genuine gap.

  After resolving definitions, substantive disagreements remain: the reliability of spontaneous feelings versus the necessity of ritual, and whether cultivation depends on innate nature or overrides it entirely. These aren't merely verbal.

  Now, assigning credence. I'll break it down into factors with probabilities:
  1. Interpretation of Mencius's "goodness": High likelihood (0.9) it's about incipient motivations.
  2. Xunzi's "badness": High likelihood (0.85) it's about unshaped desires eroding society.
  3. Xunzi's presupposed capacity: Medium likelihood (0.6) that his account requires an innate capacity, creating tension.
  4. Definition of "nature": Strong evidence (0.95) they use different scopes.
  5. Remaining disagreements: Significant (0.3) that substantive issues persist.

  Combining these, the overall credence that the dispute is substantially verbal is 0.7. The key sensitivity is to the Xunzi tension point—if resolved, it could raise the number. The user's 0.5 hedge makes sense given this uncertainty.

