answer: |-
  I assign **0.7 credence** to the proposition that the Mencius-Xunzi dispute is substantially verbal, meaning their core claims about human nature can be reconciled under defensible interpretations, with surviving disagreement focused on semantics, practical emphasis, and the scope of "nature." Here is the decomposition, with justification for each term:

  1.  **Mencian "Goodness" as Incipient Motivation (0.9 credence):** Mencius's claim *is* best read as about innate incipient moral sprouts (恻隐之心, compassion; 羞恶之心, shame; etc.) observable in spontaneous reactions (e.g., the child near the well), not perfected virtues or ideals. *Justification:* Mencius repeatedly appeals to universal, spontaneous moral reactions (Mengzi 2A:6, 6A:6) and frames cultivation as "extending" these sprouts, not implanting alien virtues.

  2.  **Xunzian "Badness" as Untamed Desires (0.85 credence):** Xunzi's claim *is* best read as asserting innate desires (e.g., for profit, sensory pleasure) are inherently chaotic and socially destructive *if unrestrained*, not that humans are innately malicious. *Justification:* Xunzi explicitly defines "nature" as "what is spontaneous from Heaven, what cannot be learned, what cannot be worked for" (Xunzi Ch.23), focusing on raw appetites, and argues their *unchecked* pursuit leads to strife and disorder, necessitating ritual (Li).

  3.  **Xunzi Presupposes an Innate Transformative Capacity (0.6 credence):** Xunzi's account *does* implicitly require an innate capacity (susceptibility to ritual, cognitive ability for "deliberate effort"/伪) for transformation, which Mencius would include in "nature," creating instability in Xunzi's denial. *Justification:* Xunzi states *anyone* can become a sage (Xunzi Ch.23), requiring *some* universal potential ("the raw material" and "conscious activity"). He doesn't ground this potential metaphysically, making his denial of "goodness" unstable *if* Mencius's broader definition of nature (including potential) is applied. (This is your core instability point).

  4.  **Divergent Scope of "Nature" (性) (0.95 credence):** They *are* using "nature" with fundamentally different scopes. Mencius defines it teleologically ("what a thing *is*"), including the *full* developmental trajectory under ideal conditions. Xunzi defines it descriptively/non-teleologically ("what is inborn"), limited to raw, untutored endowment. *Justification:* Mencius: "That which is done without anyone’s doing it is Heaven; that which comes about without anyone’s causing it is fate. That which comes to the ten thousand people without their having sought it is their nature" (Mengzi 7A:15 - implying inherent direction). Xunzi: "Human nature is the original substance and raw material" (Xunzi Ch.19) contrasted directly with conscious activity (伪). Their sentences *literally* do not contradict if "nature" means Xunzi's "raw material" vs. Mencius's "developmental blueprint."

  5.  **Substantive Disagreement Survives (0.3 credence):** Significant substantive disagreement remains concerning: a) the *trustworthiness/reliability* of spontaneous moral feelings as a guide (Mencius trusts them as guides to be extended; Xunzi sees them as dangerous impulses needing containment); b) the *absolute necessity* of external ritual (Li) as the *only* effective tool for transformation (Xunzi's core thesis); c) the *direction of dependence* (Mencius: cultivation nourishes inherent nature; Xunzi: cultivation fundamentally reshapes/overrides raw nature). *Justification:* These disagreements stem from their core models: Mencius's organic growth vs. Xunzi's artifactual construction. They represent different answers to "How *exactly* does goodness arise in humans?" even if agree all *can* become good.

  **Combination to Final 0.7:** The near certainty on points 1, 2, and especially 4 (definitions) strongly supports verbal dispute (raising credence). Point 3 (Xunzi's instability) introduces significant doubt (lowering credence), as it suggests a deeper, perhaps non-verbal, tension within Xunzi's system when pressed logically. Point 5 lowers credence slightly, acknowledging unresolved practical/normative differences. Weighting: High weight to definitional divergence (4), moderate-high weight to interpretive plausibility (1,2), moderate weight to logical instability (3), moderate weight to surviving substance (5). Formula: Strong support (1,2,4) *minus* instability penalty (3) *minus* substance penalty (5) ≈ 0.7.

  **Sensitivity:** The number is **most sensitive to Point 3 (Xunzi's Presupposed Capacity: 0.6 credence)**. A stronger resolution here (e.g., a clear Xunzian textual basis for the transformative capacity *not* being part of "nature," or a convincing argument it *isn't* necessary) would move the credence most significantly (up to ~0.85 if resolved for verbal dispute, down to ~0.5 if against).

  **What Would Move Me Most:** A passage in **Xunzi** explicitly addressing the *source* of the capacity for "deliberate effort" (伪) or ritual transformation would be crucial. Does he ground it solely in evolved intelligence responding to social necessity (making it "acquired"), or is there an implicit endowment? A reconstruction showing Xunzi's "raw material" *logically necessitates* the capacity for transformation *without* it being "good" in the Mencian sense could settle it. Mere reinterpretation shifting emphasis wouldn't suffice; it needs logical coherence on the point of origin for transformation.

  **On Strongest Versions & Dependence:**
  *   **Strongest Versions (0.75 credence):** Refining both positions for maximum coherence *increases* credence slightly. We can strengthen Mencius by acknowledging the sprouts are fragile and cultivation is essential. We can strengthen Xunzi by explicitly grounding the capacity for transformation in a universal, innate cognitive/affective plasticity responsive to social needs, *distinct* from the "desires" he labels "nature." This mitigates the instability in Point 3.
  *   **Texts vs. Interpretive Literature:** The number depends **more on the texts (≈70%)**. The core definitions (Point 4) and key arguments (Points 1, 2) are textually grounded. Interpretive literature shapes Points 3 (instability) and 5 (surviving disagreement), offering competing resolutions and emphasizing different aspects. Your recognition of potential "Mencian lenses" is astute – much interpretive debate revolves around this.

  **Your Hedge (0.5):** Your suspicion about the instability in Xunzi (Point 3) being central to your hedge is correct. The 0.7 reflects a judgment that, despite this tension, the definitional divergence is so profound and the interpretations of "good/bad" so plausible that reconciliation remains the *more likely* reading. However, the instability is real and warrants significant doubt, preventing a higher credence. It's the crux where the verbal dispute argument is most vulnerable.
