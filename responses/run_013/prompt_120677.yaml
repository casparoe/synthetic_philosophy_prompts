          But if I had to pick, I might note that the requirement that the model is countable in the metatheory (Requirement 4) and the requirement that the model satisfies that there is an uncountable set (Requirement 2) might seem to conflict to someone who doesn't understand the distinction between internal and external. But they are compatible by Requirement 8.

