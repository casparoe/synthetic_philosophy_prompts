prompt: |-
  I run a monthly philosophy-in-the-pub night at a community center — usually 12 to 16 adults, mixed bag, a couple of retired engineers, two nurses, one guy who did a philosophy minor thirty years ago, and me, who never studied any of this formally. Last month we did free will and it went better than I expected, so I said I'd do probability next, and now I've realised I don't actually understand the thing I want them to fight about. My way in was a long Wikipedia hole about whether probabilities are long-run frequencies, or degrees of belief in someone's head, or a real tendency in the object itself (a propensity), and what keeps nagging at me is the single-case version: I'm about to flip one particular coin once, and I say there's a 60% chance of heads — what is that 60% a fact about? Not the coin's history, there isn't one yet. Not just my mind, because I could be wrong. But the coin hasn't got a little dial in it either. I want them to feel that knot in their gut, not hear me explain it.

  So design me a 90-minute activity for about 14 adults in a rented room with tables, no projector, that gets them to walk into it. What I can bring: a coin with a blob of solder stuck to one edge so it's visibly lopsided but not obviously which way it'll go, a stack of poker chips, and printed handouts. The one bit of seeding I'd love you to build in: I can print several different sheets of past results, each one a different bunch of tosses that could count as the relevant bunch — this same coin last year, coins like this one generally, tosses made by the people in this room, tosses made on a padded table when tonight we're on a hard one — and I want the group to have to pick a sheet before they bet. If it helps, I can also rig it so the room's own throws start diverging from whatever sheet they chose.

  Give it to me as exactly five numbered points, each one a sentence or two, no intro and no conclusion: first the setup and materials, then how the rounds actually run minute by minute, then the payoff scheme and any roles people take, then the debrief that maps what just happened onto the frequency / degree-of-belief / propensity disagreement, and finally what will predictably go wrong the first time I run it plus the one thing the activity can't reproduce and that I'll have to just tell them myself.
reasoning: |-
  Okay, let me tackle this pub philosophy night activity about probability interpretations. The user wants a hands-on experience that creates that "knot in the gut" feeling about single-case probability, using a biased coin and historical data sheets. 

  First, I need to map their core dilemma: when saying "60% chance" for a single coin flip, what is that percentage actually referring to? The user mentioned three interpretations - frequentist (long-run frequency), Bayesian (degree of belief), and propensity (inherent tendency). The real tension lies in applying these to a one-time event with no history.

  The activity should force participants to confront this through concrete choices. The historical data sheets are brilliant - each represents a different "reference class" for frequency interpretation. Making them choose which data matters before betting will highlight how arbitrary frequency-based probability can be for singular events. 

  For materials, we'll use the solder-weighted coin (perfect for creating real uncertainty), poker chips for betting, and those crucial printed data sheets showing different sets of past results. The rigged divergence later is key - it'll undermine whatever "frequency" they chose.

  The structure should flow from setup to betting rounds to payoff and debrief. I'll keep it to five precise steps as requested. Important to build in moments where theory clashes with reality - like when the live tosses don't match their chosen data set. 

  Predictable problems: someone will question the coin's bias verification, and the activity can't replicate how degrees of belief actually form in real life. That second point needs explicit mention in the debrief - we have to tell them beliefs aren't just pulled from hats.

  The payoff scheme must reward accurate predictions to make beliefs concrete. And roles: one skeptic to challenge probability claims, one recorder to track bets vs outcomes. Debrief should connect each step directly to the philosophical interpretations without lecturing.

  Final touch: that visceral moment when they realize no interpretation fully resolves the single-case dilemma. That's the "knot" the user wants.
answer: |-
  Here are the five numbered points for your activity:

  1.  **Setup & Materials:** Arrange chairs around tables; place the weighted coin, poker chips (20 per person), and four distinct handouts in the center – each handout shows a different set of past results ("lopsided coin flips last year," "similar solder-weighted coins," "flips by people in this room," "flips on padded surfaces") but crucially, hides the *actual* calculated probability (e.g., Heads 58%, 62%, 55%, 61%).

  2.  **Activity Flow (Rounds 1-3, ~60 mins total):**
      *   **Round 1 (10 mins):** Briefly state the coin is biased but unknown how; participants individually write their *initial* degree of belief (0-100%) for Heads on the *first single flip tonight* and why (handout). Discuss initial intuitions.
      *   **Round 2 (20 mins):** Groups choose *one* handout's data as "most relevant" for predicting *tonight's first flip*. Groups then place poker chips on Heads/Tails based on that handout's implied probability (e.g., betting 60 chips on Heads if they infer 60% Heads).
      *   **Round 3 (30 mins):** Flip the coin *once*, record result. Groups now bet chips on the *next ten flips* (one bet per flip), using any strategy (stick to handout, update belief, ignore data). Secretly note the *actual* bias trend developing (e.g., Heads 7/10) which diverges slightly from all handouts.

  3.  **Payoff & Roles:** After the ten flips, payouts: correct bet on a flip wins chips equal to the bet, incorrect loses the bet. Assign one "Skeptic" (challenges probability claims) and one "Recorder" (tracks group bets, handout choice, flip outcomes, payouts visibly).

  4.  **Debrief Mapping (20 mins):** Ask: "What was the 60% *about* when you bet?" Link handout reliance to **frequency** (choosing *which* long-run matters). Link initial/updated beliefs to **degree of belief** (Bayesian updating, gut feeling). Link coin properties (weight, solder) to **propensity** (inherent tendency). Highlight the single-flip tension: frequency needed data (which one?), belief was personal, propensity felt mysterious – and the live results *diverged* from chosen data.

  5.  **Predictable Problems & Missing Element:** Predictably, groups will argue fiercely over which handout is "correct" (frequency reference class problem) and someone will demand to test the coin *now* instead of betting (highlighting propensity's elusiveness). The activity *cannot* replicate how **degrees of belief actually form and update in the real mind** (neurobiology, emotion, subconscious bias) – you must explicitly state this limitation.

  **Key Execution Note:** Rig the live flips to show a clear but *slight* bias (e.g., 7/10 Heads if handouts implied ~60%), reinforcing that "truth" is elusive and distinct from chosen data or initial belief. The payout makes beliefs concrete and the handout choice forces the frequency dilemma upfront.
