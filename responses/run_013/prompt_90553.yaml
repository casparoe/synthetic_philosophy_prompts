  The phrase "you can't agree to disagree" is a reference to a result in game theory and Bayesian epistemology known as Aumann's Agreement Theorem. The theorem shows that if two agents have the same prior and update by conditionalization, and if their posteriors for a given event are common knowledge, then they must be equal. In other words, they cannot "agree to disagree" — they cannot have common knowledge of a disagreement.

