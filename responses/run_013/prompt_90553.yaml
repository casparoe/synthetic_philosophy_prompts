  1. **The Basic Aumann Result**: The classic agreement theorem.
  2. **Convergence of Opinions with Repeated Updates**: Over time, with repeated updating on the same data, agents should converge.
  3. **Disagreement Implies Different Information or Irrationality**: If two agents disagree, then either they have different priors or one is irrational.
  4. **Speculative Betting Impossibility**: That rational agents with a common prior would never engage in speculative betting (a bet that both think is favorable to them).
  5. **The Role of Common Knowledge of the Prior**: What if the common prior itself is not common knowledge?

