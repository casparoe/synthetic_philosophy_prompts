prompt: |-
  I run a reading group on moral responsibility — second- and third-year undergraduates who have done the standard free will module and can recite the compatibilist/incompatibilist taxonomy, but who have not read Strawson. Next week's session is seventy-five minutes on the reactive attitudes, and I want a teaching plan rather than an explanation: assume I know the material, and tell me how to order it.

  The sequence first. What has to be in place before the participant attitude can be presented as anything more than a mood? I am tempted to bring in the objective attitude before the excuses, on the grounds that students need to see the two stances before they can see that an excuse is addressed to one of them rather than a verdict issued from outside; tell me whether that is right, and what breaks if I reverse it. Then say where the paper's closing turn belongs — the move that treats the demand for a justification of our practices from somewhere outside them as misplaced — so that it arrives as a conclusion the students have been walked into rather than as a shrug.

  Then the carrying case. I had planned to run one case the whole way through: someone close to me whose behaviour I used to resent, and whom since her diagnosis I now handle instrumentally and without resentment, which feels less like dehumanisation than like clarity. Test it against the job it has to do — what it shows, what it cannot show (I suspect it blurs letting someone off for a particular act with ceasing to hold them to account at all, and that it risks making the objective attitude look like an epistemic achievement rather than a loss) — and if it will not carry the session, say what the example must have and must lack instead.

  Then the misconceptions, which is where I expect the session to be won or lost. I predict at least these: that Strawson is a compatibilist entering that debate; that his point is that we cannot help having these attitudes and so determinism is beside the point; that the objective attitude is the scientific or enlightened stance; that excusing someone and exempting them from the practice altogether are the same move; and that his naturalism leaves the paper descriptive, with no normative work to do. Give me the map as a compact table — misconception, the point in the sequence where it surfaces, the move that heads it off — and add any misconception this audience in particular will bring that I have missed.

  Close with one question I can put at the end, answerable in two minutes, that separates a student who has understood why Strawson thinks the sceptic's question is misplaced from one who has merely learned the vocabulary; and tell me what to leave out at this level, and to say openly that I am leaving it out.

  Under 800 words. No readings, no citations.
reasoning: |-
  Okay, the user is running a reading group on moral responsibility for undergrads who've covered compatibilism/incompatibilism but haven't read Strawson. They need a 75-minute teaching plan focused on the reactive attitudes paper, structured for maximum clarity. 

  First, I notice they're deeply familiar with the material but want pedagogical sequencing—this isn't about content explanation but tactical classroom flow. Their anxieties are palpable: they fear the "objective attitude" might be misinterpreted as epistemic progress, and that their carrying case example could blur key distinctions. Smartly, they anticipate major misconceptions (like conflating Strawson with standard compatibilism). 

  The core challenge is making Strawson's anti-sceptical move feel earned, not abrupt. I agree with their instinct to present objective attitude early—it creates the necessary friction against which reactive attitudes gain definition. Reversing it would make excuses seem like moral verdicts rather than stance-preserving moves. 

  For their carrying case: the "resentment-to-diagnosis" example works if explicitly framed as partial exemption (not full dehumanization). But I'll warn that it risks implying objectivity is clarity—so they must stress it's a loss of participation. Alternative examples must show both stances coexisting (e.g., parenting: reactive baseline with temporary objectivity during tantrums). 

  Their misconception list is sharp. I'd add one they missed: that naturalism implies relativism ("if attitudes vary, no normative claims possible"). This surfaces during excuses/exemptions and needs quashing by noting Strawson's appeal to shared human form of life. 

  The closing question must test if they grasp why scepticism misfires. "Why doesn't determinism threaten our practices, per Strawson?" would reveal if they see it's not about determinism's truth but the incoherence of abandoning participant stance wholesale. 

  What to cut? No deep dive on moral luck or historical context (e.g., Wittgenstein influence). Say explicitly: "We're bracketing whether Strawson resolves all responsibility puzzles—today is about his diagnostic move against scepticism." 

  Structure-wise: 
  - First 20 mins: Reactive attitudes via concrete examples (hurt feelings, not abstract "blame"). 
  - Then 15 mins: Objective attitude contrast (clinical/therapeutic cases). 
  - Excuses/exemptions next (20 mins), using their carrying case but dissecting its limits. 
  - Final 20 mins for misconceptions and the anti-sceptical close. 

  Their plan is sophisticated—they just need confidence to trust Strawson's unfolding logic. The key is making the paper feel like a discovery, not a treatise.
answer: |-
  Here’s a streamlined 75-minute teaching plan focused on sequencing, your carrying case, misconceptions, and closure:

  **Sequencing (45 mins total)**  
  1. **Reactive Attitudes First (15 mins)**  
     - Start with visceral examples: resentment when cut in line, gratitude for unexpected help.  
     - Elicit student examples to anchor attitudes in lived experience.  
     - **Why first?** Attitudes must feel *real* (not "a mood") before their suspension (objective attitude) can be grasped as a loss.  

  2. **Objective Attitude Next (10 mins)**  
     - Contrast: Describe treating someone as a "project" (e.g., managing a toddler’s tantrum clinically).  
     - **Your instinct is right:** Presenting objective attitude *before* excuses clarifies that excuses are *internal* to the participant stance (e.g., "She didn’t see me!" appeals to our shared expectations). Reversing risks framing excuses as objective "verdicts."  

  3. **Excuses/Exemptions (15 mins)**  
     - Use your case: Resentment toward a close person pre-diagnosis → instrumental handling post-diagnosis.  
     - **Crucial nuance:** Highlight this is *partial exemption* (specific context), not full dehumanization. Stress it’s a *loss* of relationship depth, not epistemic gain.  
     - Contrast with an *excuse* (e.g., "I was sleep-deprived"): Both modify attitudes but exemptions sidestep the participant stance entirely.  

  4. **The Closing Turn (5 mins)**  
     - Place here: After exemptions/excuses, pose the sceptic’s challenge: "But are these practices *justified* if determinism is true?"  
     - **The payoff:** Strawson’s answer isn’t a shrug—it’s that demanding "external" justification misunderstands that responsibility *is* our form of life. The framework *itself* is the answer.  

  **Carrying Case Test**  
  Your case works if you:  
  - **Show:** How exemption (diagnosis) shifts stance *locally*, contrasting with unchanged attitudes elsewhere (e.g., still resenting strangers).  
  - **Fix blurring:** Explicitly distinguish "no blame *here*" (exemption) from "excuses preserve blameworthiness *within* the practice."  
  - **Fix "clarity" risk:** Emphasize the *tragic* dimension—objectivity involves detachment from a human connection, not superior insight.  

  **Misconception Busting (20 mins)**  
  | Misconception | When it surfaces | Preemptive Move |  
  |---------------|------------------|----------------|  
  | "Strawson is a standard compatibilist" | Intro/recap | Contrast: He shifts debate *from* free will/determinism *to* our practices’ structure. |  
  | "We can’t help having attitudes, so determinism is irrelevant" | Reactive attitudes intro | Clarify: His point is that *if* determinism threatened attitudes, we couldn’t practice otherwise—but it *doesn’t* threaten them. |  
  | "Objective attitude = scientific/enlightened" | Objective attitude section | Stress: It’s *one* pragmatic stance among others (e.g., therapy), not inherently "truer." |  
  | "Excuses and exemptions are the same" | Excuses/exemptions | Contrast: Excuses appeal to norms *within* participant stance; exemptions suspend the stance. |  
  | "Naturalism → only descriptive, no normativity" | Closing turn | Note: Our practices *are* normative; the "right" to resentment is built into them. |  
  | **ADD: "Attitudes are optional/changeable"** | Reactive attitudes intro | Argue: Try *sincerely* not feeling resentment when betrayed—it’s near-impossible for beings like us. |  

  **Closing Question (5 mins)**  
  *"Why can’t the moral responsibility sceptic (e.g., the hard determinist) consistently live out their theoretical rejection of blame in daily life?"*  
  - **Tests understanding:** The student who grasps Strawson notes the sceptic *inevitably* re-engages the participant stance (e.g., feels betrayal), proving its inescapability. The vocab-reciters will appeal to "incompatibilism" or "illusion."  

  **What to Omit & State Explicitly**  
  - **Omit:** Detailed exegesis of "free will," deep metaethics on naturalism, comparisons to other compatibilists.  
  - **Say:** "We’re bracketing debates about *which* excuses are valid or *how* attitudes evolve culturally—focusing solely on Strawson’s structural move against scepticism."  

  **Timing Summary**  
  - Reactive Attitudes (15) → Objective Attitude (10) → Excuses/Exemptions + Your Case (15) → Closing Turn (5) → Misconceptions (20) → Closing Q (5) → Buffer (5)  

  ---  
  *796 words. Focuses on scaffolding understanding, using your case strategically, and targeting high-impact confusions.*
