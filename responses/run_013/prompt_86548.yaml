answer: |-
  ## Research Proposal: Reframing the Is/Ought Gap – Vocabulary Triviality or Normative Residue?

  **1. Introduction & Core Question**  
  The centuries-old debate about deriving an "ought" (a normative claim) from an "is" (a descriptive fact) often stalls in mutual incomprehension. Standard defenses of the gap appeal to profound philosophical commitments: non-natural properties, expressivism, or the autonomy of practical reason. This project proposes a radical reframing, challenging whether this gap is uniquely normative at all. **The core research question is: Is the is/ought gap merely a domain-general, trivial consequence of vocabulary restrictions in deductive logic, or is there a distinct residue – a gap in rational compulsion – specific to normativity?** Crucially, this question must be resolvable in either direction: the outcome could reveal the gap as a logical truism applicable to *any* predicate (like "red" or "legally required"), or it could uncover a unique normative hurdle where descriptive facts, however complete, fail to rationally compel assent to normative conclusions, even for a logically flawless agent. Success means you will recognize either outcome as a valid answer to this precisely framed question.

  **2. The Reframing: Two Gaps, Not One?**  
  The standard defense of the is/ought gap relies on a principle like: "No conclusion committal about predicate *F* can be validly deduced from premises wholly silent about *F*." This principle (the **Vocabulary Gap**) appears robust. Apply it generally:
  *   Premises silent about legal obligation cannot entail "You are legally required to φ."
  *   Premises silent about color cannot entail "The ball is red."
  *   Premises silent about chess rules cannot entail "Knight to e5 is a legal move."
  *   Premises silent about "ought" cannot entail "You ought to φ."

  If this is the *whole* story, the is/ought gap loses its mystique. It’s simply the Vocabulary Gap applied to "ought," made salient only because we care deeply about normativity. This deflationary view dissolves the need for specialized apparatus (non-naturalism, expressivism) – the gap is explained by the mundane logic of vocabulary containment. All historical gap arguments (Hume, Moore, etc.) become instances of this single, general logical point.

  However, what fuels the enduring philosophical debate might be a different, stronger intuition: the **Compulsion Gap**. This is the claim that *no body of purely descriptive information, however comprehensive, can rationally compel a logically competent agent to accept a normative conclusion*. The agent could grasp all descriptive premises perfectly and still reject the normative conclusion without committing a logical contradiction or conceptual confusion. This is not merely about the *words* used (Vocabulary Gap), but about the *force* of reasoning. Crucially:
  *   **Distinction:** The Vocabulary Gap is a syntactic/logical point about entailment and the occurrence of predicates. The Compulsion Gap is an epistemic/rational point about the sufficiency of grounds for belief/assent.
  *   **Conflation Hypothesis:** Much mutual incomprehension in the debate stems from conflating these two distinct gaps. Defenders often argue as if proving the Vocabulary Gap establishes the Compulsion Gap, while critics attack the Vocabulary Gap as if disproving it would bridge the Compulsion Gap. This project will rigorously argue (not merely assert) that standard positions often equivocate between these readings, leaving the status of the Compulsion Gap fundamentally open.

  **3. Key Observations to Integrate**  
  The reframing must absorb two critical nuances:
  *   **Symmetric Gap?** Consider "Ought implies can": From "You ought to φ" (normative) we infer "You can φ" (descriptive). A strict Vocabulary Gap principle would forbid *this* inference as well, as the normative premise is silent about the descriptive predicate "can." This symmetry problematizes treating the Vocabulary Gap as uniquely protecting normativity. If it forbids derivation *into* the descriptive realm too, its normative significance diminishes.
  *   **Normative Facts as Descriptive?** The claim "Alice ought to help Bob" can be seen as a descriptive fact *about the world* (e.g., reflecting social practices, divine commands, or natural properties). If so, deriving it from other descriptive facts seems unproblematic for the Vocabulary Gap. This suggests the Vocabulary Gap might be merely a "bookkeeping" issue about how we *label* facts, not a deep point about normativity itself. The Compulsion Gap, however, persists: even if "ought" facts *are* descriptive, why should *these specific* descriptive facts compel assent in a way others (like facts about mass or charge) might not?

  **4. Methodology: Conceptual & Formal Analysis**  
  Resolving the core question requires conceptual clarity and formal rigor, not empirical psychology. Moral psychology might tell us *how* people *actually* form normative judgments, but it cannot settle the *conceptual* question of whether descriptive premises *rationally compel* normative conclusions for a logically impeccable agent. This is a question about the structure of reasons and justification.

  The project will employ a dual methodology:
  *   **Conceptual Analysis:** Precisely defining key terms ("rational compulsion," "descriptive premise," "normative conclusion," "logical/conceptual error"), disentangling the Vocabulary and Compulsion Gaps, and analyzing whether standard philosophical packages (non-naturalism, non-cognitivism, quietism) inherently address the Compulsion Gap or primarily engage the Vocabulary Gap. This involves examining arguments for equivocation and identifying necessary commitments.
  *   **Formal Modeling (Toy Languages):** This is crucial for isolating the Vocabulary Gap and testing its relationship to compulsion. We will construct simple formal systems:
      *   Define languages with explicitly partitioned vocabularies (e.g., a "descriptive" sub-language D and a "normative" sub-language N).
      *   Define a standard deductive consequence relation (`⊢`).
      *   **Formalizing the Vocabulary Gap:** Prove a theorem: `If Γ ⊆ Sentences(D) and Γ ⊢ φ, then φ ∉ Sentences(N)` (or a suitable generalization). This formalizes the triviality claim.
      *   **Testing the Compulsion Gap:** Can we define a notion of "rational compulsion" within or alongside the deductive system? Can we model an agent who accepts all sentences in Γ (Γ ⊆ D), understands them, yet rejects φ ∈ N, *without* violating `⊢` or defined meaning postulates? What formal resources (special inference rules, non-truth-conditional semantics for N, primitive acceptance relations) are needed to *prevent* this, and do these resources amount to smuggling in normative residue? Crucially, we will examine symmetric inferences (like "ought implies can" formalized as `N-predicate(x) ⊢ D-predicate(x)`).

  **What Formal Modeling Buys & Risks:**
  *   **Benefits:** Forces precision in defining "descriptive/normative." Clearly isolates the Vocabulary Gap as a theorem of standard logic. Provides a controlled environment to explore whether bridging the Vocabulary Gap (e.g., by adding meaning postulates linking D and N) suffices for rational compulsion, or if something extra-nomological is needed. Helps identify if compulsion requires specific semantic treatments (e.g., non-cognitivist "logic of attitudes").
  *   **Risks of Begging the Question:** The main risk lies in how we set up the partition between D and N vocabulary in the toy language. If we *stipulate* this partition based on pre-theoretical intuitions about "descriptive" vs. "normative," the models might merely reflect those stipulations. Mitigation: Explicitly treat the partition as hypothetical and explore consequences under different partitionings. Focus on the *additional* resources needed *beyond* resolving the Vocabulary Gap to model compulsion. The formal work highlights *where* crucial assumptions enter.

  **5. Potential Outcomes & Significance**
  *   **Outcome 1 (Deflationary):** The Vocabulary Gap is the only coherent gap; it is a trivial theorem of logic. The Compulsion Gap either reduces to the Vocabulary Gap or is ill-defined. The apparent depth of the is/ought debate stems solely from conflating these gaps and the importance of "ought." Standard positions are addressing a pseudo-problem or are fundamentally confused about the logical basis of the gap. *Success:* A clear demonstration that bridging the Vocabulary Gap (via analytic truths, naturalistic reductions, etc.) dissolves any *distinctive* normative compulsion problem, aligning with quietism or sophisticated naturalism.
  *   **Outcome 2 (Residue Found):** A distinct Compulsion Gap exists. Even after bridging the Vocabulary Gap (e.g., establishing analytic connections between D-predicates and N-predicates), a logically impeccable agent could accept all D-premises and still withhold assent from the N-conclusion without error. Formal modeling shows this requires extra-logical resources (e.g., primitive normative rules of inference, non-representational semantics for N). *Success:* Identifying the minimal formal/conceptual apparatus required to close the Compulsion Gap, potentially favoring non-naturalism (primitive normative properties/relations constrain rational assent) or non-cognitivism (normative judgments are fundamentally non-descriptive attitudes governed by distinct "logical" norms).
  *   **Significance:** This reframing promises significant conceptual clarity. If deflationary, it demystifies a central philosophical problem. If a residue is found, it precisely locates the unique challenge of normativity. Either way, it diagnoses a core source of confusion in the literature (conflating gaps) and provides a clearer framework for evaluating extant theories based on which gap(s) they actually address. The focus on compulsion also connects directly to fundamental questions about the authority of reason.

  **6. Feasibility, Scope, Deliverables & Risks**
  *   **Scope:** One semester of part-time work necessitates focus. The project will:
      1.  Rigorously define the Vocabulary Gap and Compulsion Gap.
      2.  Formally model the Vocabulary Gap in toy systems and demonstrate its generality/triviality.
      3.  Argue concretely (with examples) how standard positions equivocate between the gaps.
      4.  Formally explore the resources needed to model (or preclude) the Compulsion Gap *after* bridging the Vocabulary Gap, including analyzing symmetric inferences.
      5.  Assess the outcomes against the core question. *Excluded:* Comprehensive historical exegesis, detailed critique of all standard positions, or advanced model theory.
  *   **Deliverables:**
      *   **Primary Deliverable:** One substantive academic paper (approx. 7000-9000 words) presenting the full argument, formal models, and resolution of the core question.
      *   **Secondary Deliverable:** A concise, accessible explainer article (approx. 1500 words) tailored for the rationalist blogosphere, summarizing the reframing, the two gaps, the core finding, and its significance for the ongoing debate.
  *   **Risks of Failure & Mitigation:**
      *   **Collapse into Triviality:** The project might conclude the distinction is obvious and the debate entirely misguided. *Mitigation:* This *is* a valid outcome (Outcome 1). The value lies in rigorously demonstrating it and diagnosing the conflation causing the debate. The explainer will highlight this impact.
      *   **Unmotivated Stipulation:** The partition between D and N vocabulary in models might feel arbitrary, undermining conclusions. *Mitigation:* Explicitly acknowledge this risk. Focus analysis on the *additional* compulsion requirement *after* any stipulated bridge across the vocabulary divide. Test inferences crossing the partition in both directions.
      *   **Mere Verbal Dispute:** The distinction between Vocabulary and Compulsion Gaps might be dismissed as merely terminological. *Mitigation:* Actively demonstrate substantial consequences – does the distinction resolve stalemates? Does it change which theories are viable? Does it reframe classic problems (like the Symmetry problem or normative facts)? Formal modeling is key here, showing concrete differences in logical structure.
      *   **Formal Overreach:** Attempting to formally capture "rational compulsion" might prove intractable or question-begging. *Mitigation:* The formal work on compulsion will be exploratory and illustrative, not definitive. The primary formal goal is confirming the Vocabulary Gap's triviality. The conceptual analysis of compulsion will carry the main argumentative weight; formal models serve to test intuitions and expose assumptions.

  **7. Conclusion**  
  This project offers a novel lens on a perennial problem by rigorously separating a trivial, domain-general logical gap (Vocabulary) from a potentially profound, normatively specific gap in rational compulsion. By combining conceptual analysis with targeted formal modeling, it aims to cut through decades of tangled debate. Whether the outcome reveals the is/ought gap as a logical truism or uncovers a unique normative residue, the result will provide significant clarification for both academic philosophy and the broader rationalist discourse. The deliverables will clearly communicate this resolution, either demystifying the gap or precisely identifying its enduring challenge.
