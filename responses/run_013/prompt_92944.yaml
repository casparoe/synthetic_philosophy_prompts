prompt: |-
  I am a teaching fellow for a seminar on the causes of war, and part of my job is to anticipate the instructor's rulings before I lead a section. She has a settled procedure for every conflict the seminar covers: she names the parties, ranks them, and specifies what kind of responsibility each bears. Her rulings so far, as I have recorded them, are these. The Second World War: Germany bears primary responsibility, though she insists that this is the responsibility of a regime and its military leadership rather than of a people, with Italy and Japan carrying secondary shares; the 1939 pact and the interwar appeasement she calls failures of prudence that fall short of responsibility for the war. The Korean War: North Korea bears primary responsibility, with the Soviet Union as an enabler whose approval made the attack possible; she rejects the suggestion that the United States invited the attack by drawing its defensive perimeter, on the ground that an omission is not a cause. The Falklands: Argentina bears primary responsibility for resorting to force, but Britain carries a share for having withdrawn the signal that it would defend the islands, which she calls negligence rather than aggression. The Peloponnesian War: she declines to name a primary culprit at all, treating the war as the product of one power's growth and the fear it produced in the other. The 2003 invasion of Iraq: the United States and Britain bear primary responsibility, a verdict she maintains even while granting that the war would have been equally their responsibility had the intelligence been sound.

  Next week the seminar reaches the July Crisis, and she will deliver her ruling on who, if anyone, is responsible for World War I. Predict that ruling and argue for the prediction. State the rule or rules that best explain her earlier rulings; state at least one rival rule that fits those rulings just as well; say what each candidate implies for 1914, which state or states it singles out, and how the shares would fall; say which rule you think she is actually running and why; and name the case or piece of evidence that would most cleanly separate the rivals. I also want her pinned on the kind of responsibility at stake -- causal, moral, or legal -- and on whether it attaches to a state, to a government, or to individuals. She does not accept the answer that it all depends on what one means by responsibility, so do not end on that note: commit to a verdict, and say what the verdict commits her to. I am not asking for the state of the historiography; I am asking what her own rule yields. Please write in American English.
reasoning: |-
  Okay, let me tackle this step by step. The user is a teaching fellow needing to predict their instructor's ruling on WWI responsibility based on her established pattern. 

  First, I need to extract the key principles from her past rulings. Looking at WWII: Germany (regime/military) bears primary responsibility, with Italy/Japan secondary. Appeasement is just imprudent, not responsible. Korean War: North Korea primary, USSR enabling - but US perimeter omission isn't causal. Falklands: Argentina primary, UK negligent withdrawal. Peloponnesian: no primary culprit, systemic causes. Iraq 2003: US/UK primary regardless of intel flaws.

  Hmm, three clear patterns emerge: 
  1) She assigns responsibility based on affirmative actions (invasion/pact) not omissions
  2) Negligence reduces but doesn't eliminate others' primary responsibility 
  3) Systemic causes (like Thucydides trap) negate primary responsibility

  Now for rival interpretations. Rule A (probable): Primary responsibility requires deliberate offensive action. Rule B (alternative): The last actor who could've prevented war bears responsibility. Both fit most cases but diverge at Falklands (UK withdrawal) and July Crisis.

  Applying to 1914: 
  - Under Rule A, Austria-Hungary gets primary (ultimatum/declaration), Germany secondary (blank check), Serbia negligent (not preventing conspiracy) but not responsible. 
  - Under Rule B, Germany gets primary for rejecting last diplomatic solutions.

  The clean test case? The 2003 Iraq War. If she'd called negligent intel agencies responsible, it'd support Rule B - but she didn't, so Rule A holds. 

  On responsibility type: Definitely causal (who made it happen), attached to governments/regimes (Nazis, not Germans). For July Crisis, expect Austria-Hungary primary, Germany secondary, others negligent but not responsible. Must commit - no "it depends" escapes!
answer: |-
  Based on the instructor's established pattern of rulings, here is the prediction for her ruling on the July Crisis/WWI, the reasoning, analysis of her rules, and the implications:

  **Predicted Ruling for July Crisis/WWI:**
  *   **Primary Responsibility:** Austria-Hungary.
  *   **Secondary Responsibility:** Germany (as an enabler).
  *   **Negligence/Imprudence, but not Responsibility for the War:** Serbia (for the assassination plot/ultimatum response), Russia (for mobilization), France (for backing Russia), Britain (for ambiguous stance).
  *   **No Primary Culprit Named?** No. She will identify specific actors whose affirmative actions directly caused the war.

  **The Core Rule Explaining Her Rulings:**
  The instructor assigns **primary causal responsibility** to the actor(s) **who deliberately initiate offensive military action or issue an unequivocal demand/threat that makes war unavoidable** (absent capitulation), provided the action is not a direct response to an imminent attack *on their own territory*. Secondary responsibility falls to actors who deliberately enable that primary action. Negligence (omissions, failures of prudence, ambiguous signals) is distinct from causal responsibility for initiating the war, though it may contribute to the context.

  *   **Supporting Evidence:**
      *   WWII: Germany initiates offensive wars (Poland, Western Europe, USSR). Italy/Japan initiate their own offensives. Appeasement (omission/failure of prudence) is not responsibility.
      *   Korean War: North Korea initiates invasion. USSR enables. US perimeter omission is not a cause.
      *   Falklands: Argentina initiates invasion. UK withdrawal (omission/negligence) is not aggression/cause.
      *   Peloponnesian: No actor initiates deliberate offensive action; it's systemic (growth/fear).
      *   Iraq 2003: US/UK initiate invasion. Faulty intelligence (negligence?) doesn't absolve responsibility for *the decision to invade*.

  **A Rival Rule Fitting the Rulings (Almost):**
  Responsibility lies with the actor(s) **who made the final, irrevocable decision rejecting a peaceful resolution**, regardless of who fired first.

  *   **Supporting Evidence (Mostly):**
      *   WWII: Germany rejects diplomacy, invades Poland.
      *   Korean War: NK rejects status quo, invades.
      *   Falklands: Argentina rejects diplomacy, invades.
      *   Iraq 2003: US/UK reject inspections/diplomacy, invade.
      *   *Weakness on Peloponnesian:* Similar logic could apply (Athens rejects Spartan ultimatums?), but she sees it as systemic.
      *   *Potential Divergence:* This rule *could* assign responsibility differently in the July Crisis or Falklands depending on the "final decision" point.

  **Implications for July 1914:**

  1.  **Core Rule (Deliberate Offensive Action):**
      *   **Primary:** Austria-Hungary (Issues the deliberately unacceptable ultimatum to Serbia and declares war, initiating hostilities against a sovereign state).
      *   **Secondary:** Germany (Deliberately enables Austria-Hungary's offensive action with the "blank check," encouraging the hardline stance and promising support).
      *   **Negligence/Imprudence:** Serbia (Failure to prevent the plot/ambiguity in the response), Russia (Mobilization decision escalating crisis), France (Firm backing encouraging Russia), Britain (Ambiguous stance failing to deter Germany).
      *   **Not Responsible for Initiation:** Russia, France, Britain, Serbia (Their actions, however escalatory, were reactive to the Austro-German offensive action/threat against Serbia).

  2.  **Rival Rule (Final Irrevocable Decision):**
      *   **Primary:** Germany (Rejects British mediation proposals *after* Austrian declaration, orders mobilization against France/Russia, issues ultimatum to Belgium - seen as the final steps locking in continental war).
      *   **Secondary:** Austria-Hungary (Issues ultimatum/declares war, rejecting Serbian concessions).
      *   **Negligence/Imprudence:** Russia (Mobilization timing/scope), France (Backing), Britain (Ambiguity), Serbia (Plot/response).
      *   **Not Responsible for Final Step:** Russia, France, Britain, Serbia (They reacted to the Austro-German actions; Germany made the final decisions rejecting peace).

  **Which Rule is She Running?**
  She is running the **Core Rule (Deliberate Offensive Action)**.

  *   **Why?**
      1.  **Consistency with Omission Principle:** Her strong rejection of the US omission in Korea and framing of the UK withdrawal in the Falklands as negligence (not cause/aggression) anchors responsibility firmly in *affirmative acts*. The Rival Rule risks assigning responsibility based on a *failure to prevent* (by rejecting mediation), which resembles the omissions she consistently downgrades.
      2.  **Focus on "Resorting to Force":** Her language in the Falklands ("Argentina bears primary responsibility for *resorting to force*") and the centrality of invasion in Korea/WWII/Iraq highlight the act of initiating violence or an unambiguous casus belli as the trigger for primary responsibility.
      3.  **Systemic vs. Actor-Centric:** Her Peloponnesian ruling shows she *can* avoid naming a primary culprit when no clear offensive initiation occurs. The July Crisis involves clear initiating acts (Austrian Ultimatum/DoW).
      4.  **Iraq War Verdict:** Her statement that responsibility holds *even if intelligence was sound* underscores that the *decision to invade* (the offensive action) is the core issue, not the quality of the justification or the final rejection of peace options beforehand. The *act* defines responsibility.

  **The Clean Separator: The Falklands Withdrawal**
  *   **Core Rule Prediction:** UK withdrawal is negligence, not responsibility for the war. Argentina's invasion is the deliberate offensive act bearing primary responsibility.
  *   **Rival Rule Prediction:** *Could* assign some responsibility to the UK if its withdrawal was seen as the "final decision" that made Argentine invasion inevitable (by removing the deterrent). However, the instructor explicitly called it negligence and assigned primary responsibility to Argentina. This decisively favors the Core Rule, which strictly separates negligent omissions from responsible offensive acts. The Rival Rule struggles to explain why the UK's "final decision" to withdraw doesn't constitute responsibility under its logic, while the instructor clearly absolves the UK of responsibility *for the war*.

  **Responsibility: Type and Bearer**
  *   **Type:** **Causal Responsibility** is paramount. She is asking "Whose actions *caused* this war to start?" Moral and legal judgments may be implied or flow from this (e.g., aggression is usually immoral/illegal), but the foundation is causal: identifying the actors whose deliberate choices made the war happen. Her rejection of omissions as causes and focus on specific actions confirms this.
  *   **Bearer:** Responsibility attaches primarily to **Governments/Regimes and their Leadership** (the decision-making apparatus of the state). She explicitly distinguishes the Nazi *regime* from the German *people* in WWII. She names states (Argentina, North Korea, US/UK) but contextually means their governing authorities at the time. Responsibility for enabling (USSR in Korea, Germany in 1914 under the prediction) also falls to the enabling government. Individuals (like the assassin Princip) might be morally/legally culpable for specific acts, but the responsibility *for the war* rests with the state authorities whose policies and decisions escalated to conflict.

  **The Verdict and Its Commitment:**
  The instructor is committed to finding that **Austria-Hungary, through its government and military leadership, bears primary causal responsibility for World War I by deliberately issuing an unacceptable ultimatum and declaring war on Serbia, initiating the conflict. Germany bears secondary causal responsibility because its government deliberately enabled Austria-Hungary's aggressive action with the "blank check."** This verdict commits her to:
  1.  Rejecting arguments that systemic factors (alliances, militarism, imperialism) absolve the specific actors who made the key decisions to initiate violence.
  2.  Rejecting arguments that the negligence or escalatory actions of others (Serbia, Russia, France, Britain) constituted the *cause* of the war, even if they contributed significantly to the crisis atmosphere.
  3.  Maintaining that omissions (like Britain's ambiguity or Germany/Russia not restraining allies more forcefully) are distinct from the affirmative acts that trigger responsibility.
  4.  Focusing her assessment on the decisions of governing elites in Vienna and Berlin in late July 1914.
