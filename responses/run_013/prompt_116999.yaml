answer: |-
  Here are the five clauses as specified:

  1.  Any distinct physical matter and any artwork currently occupying the same space constitute separate objects subject to individual storage and shipping fees, regardless of shared composition.
  2.  Significant alteration of an object's external contours constitutes destruction of any artwork associated with that matter, while the underlying matter itself remains a billable object unless rendered non-retrievable.
  3.  Removal or damage to a minor part of an object does not constitute destruction of the associated artwork if professional restoration to its prior state is possible; the physical matter is always considered to persist unless fully dispersed or consumed.
  4.  If physical matter is reconfigured to create one or more new artworks, each resulting artwork constitutes a new object for billing purposes; the original matter remains a chargeable object unless incorporated entirely into a new artwork.
  5.  The identity and continued existence of an artwork is determined solely by its form, function, or recognized identity, not by its constituent matter; destruction of the artwork triggers claims payment based on its insured value, while intact matter retains only its material scrap value.

  ---

  **How it hits the requirements:**
  *   **Clause 1:** Establishes the co-located statue (artwork) and lump (physical matter) as separate billable items (a).
  *   **Clause 2:** Handles the flattening scenario – artwork destroyed by contour change, matter persists (b). Shows claims consequence (pays for artwork destruction, matter persists).
  *   **Clause 3:** Addresses survival through minor part loss/repair – artwork survives repairable damage, matter always persists (c).
  *   **Clause 4:** Covers recasting one lump into two statues – new artworks are new billable objects, original matter is still billable unless fully used up (d). Shows pricing consequence (new charges).
  *   **Clause 5:** Defines the essence of the artwork (its form/identity, not matter) and different fates (e). Explicitly shows claims consequence (pays insured value for artwork destruction vs. scrap for matter).
