prompt: |-
  I'm a first-year PhD student in cognitive science (my undergrad was philosophy) and I have to turn in a 6-page research proposal for a seminar on concepts and induction, due in about a month, and I keep going back and forth on the topic. The idea I keep circling is about Bongard problems — the little puzzles where six pictures on the left share some rule and six on the right don't, and you have to say what the rule is. They've come back into fashion as a test of whether a model can induce a concept from a handful of examples, and the usual scoring is just "did it name the rule the puzzle-maker had in mind." My suspicion is that this hides a distinction nobody draws carefully. There's the rule that actually generated the two sets, and there's the simplest rule that fits the given sets, and these can come apart — you can build cases where the generator is baroque but a much simpler description partitions the same six-and-six, or where the generator is simple but the samples underspecify it so several incompatible rules fit equally well. There's also something I can't articulate yet about the right-hand set: is it just the complement of the rule, or a deliberately chosen contrast class, and does that difference change what the "concept" even is? I was arguing about this with my roommate, who works on minimum-description-length stuff, and he thinks the whole thing collapses into "just take the shortest description," which is exactly the move I'm not sure is right. There's alot here I'm still fuzzy on.

  Can you help me turn this into a real proposal? Please start by brainstorming three or four genuinely different ways to frame the core question — I don't want the first framing you think of — then say which one you'd bet on and why, and write the proposal around that one. Take the role of someone who has actually supervised this kind of work and knows the ways proposals like this go wrong. I need: the question stated precisely enough that it has a determinate answer; why the obvious responses (the MDL one, the "it's whatever the puzzle-maker intended" one, the "there's no fact of the matter, it's all underdetermined" one) don't settle it; the method, i.e. what I'd actually do in a semester for six pages, staying honest about which parts are armchair and which need a little coding; what a successful result would look like versus what would count as the project failing or turning out trivial; and a realistic sense of scope, including what I should cut if it's too big. Think it through carefully before writing. I'm not asking for a literature review or citations — I'll fill those in myself, and please don't invent references or page numbers; just talk about positions and arguments. Write it in the voice of the proposal itself, first person, and skip the throat-clearing.
reasoning: |-
  Okay, let me unpack this. The user is a first-year cognitive science PhD student with a philosophy background, struggling to crystallize their research proposal on Bongard problems. They're circling a core tension: the gap between the puzzle-maker's intended rule versus the simplest descriptive rule, and how the "right-hand set" ambiguity complicates what "the concept" even is. Their roommate's MDL stance feels reductive to them, but they can't yet articulate why.

  Hmm... their underlying struggle seems epistemological at heart - what does it mean to "induce a concept" from limited examples? The philosophy training is showing. They need framing that preserves this nuance while being empirically tractable. Three angles come to mind:

  First, a *descriptive equivalence* approach: systematically construct Bongard problems where multiple rules fit the same examples. For instance: left side shows triangles, right shows squares (intended rule: triangles vs non-triangles). But all triangles happen to be red and all squares blue - so "red shapes" also fits perfectly. Does human problem-solving default to the intended class or the simpler descriptor? This directly pits MDL against intention.

  Second, a *contrast class* framing: what if the right-hand images aren't just random negatives, but carefully chosen foils? In BP#1, left: animals with exactly four legs; right: animals with two legs or six+ legs. Intended rule might be "quadrupedal mammals," but if all left examples are dogs and all right are birds/spiders, "dogs vs non-dogs" fits too. This probes whether the contrast set shapes concept formation.

  Third, a *computational-level* angle: treat the puzzle-maker as a rational agent. If they select examples to minimize learner ambiguity (ala pedagogical sampling), does that align with MDL? Or do they inject "didactic" negatives that make MDL misfire? This could model the intention/simplicity tension as different optimization functions.

  The second framing feels richest - it surfaces their unarticulated unease about the right-hand set. Method-wise, they could: 1) Philosophically decompose what "the concept" means in BPs (armchair); 2) Code a generator that creates ambiguous BPs by decoupling intention from MDL-optimal descriptions; 3) Run a small behavioral study seeing which rules humans report. A successful result wouldn't just show disagreement, but predict when humans diverge from MDL based on contrast set design. Key scope danger: getting lost in generating "interesting" ambiguities. Should constrain to shape/geometry BPs only, no textures or shading.

  The proposal should ruthlessly avoid the literature swamp. Stay focused on constructing the ambiguity cases and testing the human prioritization. If the study part proves too big, drop it - the generator itself with predicted ambiguities would suffice for six pages. Failure would be if all constructed ambiguities feel contrived or if humans always follow MDL. But I suspect they won't - that philosophical itch usually exists for a reason.
answer: |-
  ## Research Proposal: Disambiguating Concept Induction in Bongard Problems

  **Core Question:** When solving Bongard problems (BPs), to what extent does human concept induction prioritize the *simplest descriptive rule* partitioning the given example sets versus the *intended rule* inferred from the structure of the contrast class, particularly when these conflict due to underspecification or alternative equivalences?

  **Framings Considered:**

  1.  **Descriptive Equivalence vs. Intentionality:** This framing pits the MDL principle (select the rule with the shortest description length that perfectly separates the given left and right sets) directly against an intentional stance (inferring the rule the puzzle-maker *likely* intended based on the selection of *specific* contrasting examples). The core question becomes: When alternative rules of comparable simplicity fit the data equally well, what features of the contrast set (right-hand side) do humans use to resolve ambiguity and converge on the intended concept?
  2.  **The Contrast Class as Definitive:** This framing elevates the status of the right-hand set. It asks: Is the concept induced defined *solely* by the property distinguishing the left set from *this specific* right set (e.g., "has property P *while these specific negatives lack it*"), or is it defined more abstractly against the complement of P in the domain (e.g., "has property P", full stop)? The question becomes: Does human induction treat the right-hand set as a *representative sample* of non-P, or as a deliberately curated set of *diagnostic foils* that signal the intended dimension of contrast, thereby shaping the concept itself?
  3.  **Underdetermination and Salience:** This framing emphasizes the inherent ambiguity. It asks: Given that limited examples always underdetermine the true rule, what factors beyond descriptive simplicity (e.g., perceptual salience of features, background knowledge priors, perceived diagnosticity of the contrast set) guide human induction towards the intended concept in BPs, preventing descent into radical underdetermination?
  4.  **The Generator's Shadow:** This framing focuses on the assumed generative process. It asks: Do humans implicitly model the puzzle-maker as a pedagogical agent selecting examples to uniquely identify a specific rule, even if a simpler alternative fits the given sets? Does this assumed pedagogical intent override pure MDL when conflict arises?

  **Selected Framing & Rationale:** I will pursue **Framing 1: Descriptive Equivalence vs. Intentionality**, with strong integration of **Framing 2's focus on the contrast class**. While MDL provides a compelling normative baseline, my intuition is that human solvers are sensitive to cues within the *specific composition* of the right-hand set that signal the puzzle-maker's intent, often overriding the absolute simplest description when alternatives exist. This framing allows a clear empirical test by constructing controlled conflicts and avoids the potential murkiness of "salience" or deep "background knowledge" while directly addressing the role of the contrast set. It also directly confronts the roommate's MDL stance. I suspect humans don't just take the shortest description; they take the shortest description *that also explains why these particular negatives were chosen*.

  **Why Obvious Responses Don't Settle It:**

  *   **"Just take the shortest description (MDL)"**: This ignores the intentional structure of BPs. The right-hand set isn't randomly sampled; it's curated to contrast *along a specific dimension*. If a slightly longer rule better explains the *specificity* of the chosen negatives, humans might prefer it. MDL alone cannot distinguish between rules that partition the sets but imply different reasons for the specific examples presented.
  *   **"It's whatever the puzzle-maker intended"**: While likely true ontologically, this is epistemologically opaque to the solver. The question is *how* solvers infer that intention from the limited data (the images and their partitioning), especially when simpler alternatives exist. Appealing to intention without specifying the inference mechanism is circular for understanding human induction.
  *   **"There's no fact of the matter, it's all underdetermined"**: While technically true given limited data, this is descriptively inadequate. Humans demonstrably solve BPs and often converge on the intended rule. We need to explain *how* they resolve this underdetermination in practice, moving beyond the trivial observation that it exists.

  **Method:**

  This project combines conceptual analysis with empirical stimulus creation and a modest behavioral pilot. It stays within a one-semester, 6-page scope.

  1.  **Conceptual Analysis & Conflict Construction (Armchair; Weeks 1-3):**
      *   Precisely define types of conflict: (a) *Underspecification:* Multiple equally simple rules fit the given sets (e.g., "Convex Shapes" vs. "Triangles" if all left examples are convex triangles and right are non-triangles). (b) *Alternative Equivalence:* A demonstrably *simpler* rule fits the sets equally well as the intended, more complex rule (e.g., intended rule: "Shapes with an internal angle exactly 90 degrees"; simpler rule: "Squares" if all left examples are squares and right are non-squares that also lack 90-degree angles).
      *   Crucially, design conflicts where the *composition of the right-hand set* provides cues to the intended rule. For example, in the "Squares vs. Simpler Rule" case, include non-square rectangles *without* 90-degree angles on the right. The MDL rule ("Squares") fits, but the presence of non-right-angle rectangles suggests the contrast is *not* just about squareness, hinting at the angle rule.
      *   Develop a taxonomy of such "diagnostic contrast cues" (e.g., presence of near-misses, grouping by a secondary feature absent in the left set, diversity suggesting a specific dimension is being negated).

  2.  **Stimulus Generation (Light Coding; Weeks 3-4):**
      *   Use a simple graphics library (e.g., Python's `svgwrite` or `PIL`) to programmatically generate visual BPs based on geometric primitives (shapes, lines, dots, shading) to implement the conflict scenarios designed in step 1.
      *   Focus on clarity and eliminating unintended perceptual confounds. Generate multiple instances for each conflict type to control for specific image quirks. (e.g., 3 variants for "Underspecification: Convex vs Triangle", 3 variants for "Equivalence: Angle vs Square", etc.).

  3.  **Pilot Behavioral Validation (Empirical; Weeks 5-6):**
      *   Recruit a small convenience sample (N=15-20 peers/online participants).
      *   Present generated BPs in two conditions: (a) Conflict condition (e.g., "Angle vs Square" BP), (b) Control condition (the same BP modified so only the intended rule fits simply, e.g., add a non-square shape with a 90-degree angle to the left set).
      *   Task: For each BP, participants write down the rule they believe defines the left set. No multiple choice; open response.
      *   Analysis: Categorize responses as aligning with MDL-simplest, intended rule, or other. Compare the distribution of "MDL-simplest" responses in Conflict vs. Control conditions. Analyze justifications (if collected) for mentions of the right-hand set composition.

  **What Success Looks Like:**

  *   **Success:** Clear evidence that in conflict conditions, participants *significantly less often* choose the MDL-simplest rule compared to the control condition, and instead frequently choose the intended rule. Qualitative justifications should reveal sensitivity to the specific contrast examples (e.g., "The right side has rectangles that aren't squares, so it can't be about squares", "The negatives all lack an acute angle, suggesting that's key").
  *   **Non-Triviality:** Success demonstrates that human induction in BPs involves more than blind MDL minimization; it incorporates a model of the puzzle-maker's communicative intent, inferred partly from the contrast set design.
  *   **Failure/Triviality:** Failure would manifest as: (1) Participants overwhelmingly follow MDL even in carefully designed conflict scenarios, suggesting my constructed cues are ineffective or MDL dominates. (2) Responses are random or heavily skewed towards "other" rules, indicating poorly designed stimuli or an intractable task. (3) The observed effects are trivially small or attributable to confounding perceptual factors in my stimuli rather than the intended conceptual conflict.

  **Scope Management & Cuts:**

  *   **Core Focus:** Stick strictly to geometric BPs. Avoid complex textures, real-world objects, or probabilistic rules. This keeps stimuli generation tractable and minimizes the influence of deep background knowledge.
  *   **Pilot Scale:** The behavioral pilot is essential but must be modest. Prioritize clear, analyzable data from a small N over statistical power. Detailed qualitative analysis of justifications is key. *If time runs short, the pilot can be described as planned future work, with the proposal focusing on the conceptual analysis and stimulus design.*
  *   **Cut:** Formal computational modeling (e.g., implementing different MDL+intention models) is beyond scope. Deep literature review on BP history or MDL foundations is also unnecessary; position the work concisely relative to the core tension identified.
  *   **Cut:** Investigating individual differences or extensive parameter variation in the conflict types. Focus on demonstrating the *existence* and basic characteristics of the effect using a few well-designed conflict classes.

  **Conclusion:**

  This proposal tackles a fundamental ambiguity in how concept induction is evaluated in Bongard problems: the gap between descriptive fit and inferred intent. By systematically constructing problems where the simplest rule conflicts with the rule suggested by the curated contrast set, and piloting human responses, I will test whether human solvers prioritize inferring the puzzle-maker's communicative goal over pure description length minimization. Success will demonstrate that BP solving involves not just pattern matching, but pragmatic reasoning about the examples presented as evidence.
