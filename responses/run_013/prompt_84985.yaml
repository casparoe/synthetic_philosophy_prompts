prompt: |-
  You are an expert in formal epistemology — specifically in the logic of confirmation — and in the practice of third-party assurance and audit. Think this through carefully before you write, and begin by brainstorming, in a few lines, the ways a dossier of findings can fail to be evidence for a universal claim; then commit to the procedure.

  I am the assurance lead at a mid-sized water utility. Four times a year I sign a statement to the board's safety committee covering thirty to forty claims of the form 'every X on site has a current Y': every pressure vessel has a current examination certificate, every lifting accessory has an in-date inspection, and so on. Each claim arrives with a dossier, and I have about fifteen minutes per dossier. My auditors have no philosophy and no statistics beyond percentages, and my working papers go to an external auditor who will not follow up references, so do not cite literature.

  The dossiers that worry me are the negative ones. The last read, in substance: 'we examined 214 items from the asset register; 19 had no current certificate; none of the 19 was a pressure vessel.' Everyone in the room treated that as strong support, and I could not articulate why it might be worth almost nothing.

  What I want is a written procedure I can hand to an auditor: steps to run on a dossier, in order, converting the findings into a defensible verdict. It must keep faith with the underlying problem, which is Hempel's raven paradox. 'All ravens are black' is logically equivalent to 'all non-black things are non-ravens', so a white shoe is an instance of the claim; yet examining shoes seems to tell us nothing about ravens. Three consequences must survive your translation into audit language:

  1. The procedure must take a stand on whether a finding of the form 'an item that is not an X also lacks a Y' is evidence at all, and if it is, must say what makes it more or less so. Do not pretend this is obvious, and do not hand my auditors a formula they cannot run.
  2. The selection procedure is part of the evidence. An item that could not have come out the other way, given how it was chosen, is not evidence. Give the auditors a short sequence of questions that exposes a dossier whose sampling method could never have surfaced a counterexample, and say explicitly what such a dossier is worth.
  3. Confirmation and refutation are not symmetric. These are universal claims: one counterexample refutes, and no quantity of clean findings repairs it. The procedure must say what I am to do at that point, given that 'collect more positive instances' is not available to me.

  Say also which distinctions from the philosophy you had to drop to make the procedure usable, where it will misfire, and where it must stop and hand the judgement back to me because the remaining question is about the boundaries of the reference class rather than about logic.

  Then run the finished procedure on all four dossiers below, showing the steps that do work and not the ones that do not:
  A. the 214-item sample above, drawn at random from the full asset register of roughly 9,000 items, of which 130 are pressure vessels;
  B. a census of all 130 vessels, every one certificated;
  C. an inspection that deliberately sought out uncertificated items using the finance system's list of lapsed contracts; it found 40, none of them a vessel;
  D. one vessel found in service with a certificate that expired four months ago.

  Finish with a single final line, exactly in this form and using only the labels listed: \answer{A: <label>; B: <label>; C: <label>; D: <label>} where each label is one of CONFIRMS, CONFIRMS NEGLIGIBLY, REFUTES, NOT COUNTABLE.
reasoning: |-
  Hmm, the user is an assurance lead at a water utility dealing with universal claims verification. They're frustrated about auditors treating absence-of-counterexamples-in-non-target-items as strong evidence due to Hempel's paradox implications. Their core need is an actionable audit procedure addressing three philosophical challenges: (1) quantifying evidential value of non-X non-Y instances, (2) evaluating sampling bias, and (3) handling refutation asymmetry.

  First, brainstorming why dossiers fail as evidence for universal claims: 
  - Confirmation bias in sampling (e.g., only examining easy-to-access items) 
  - Misinterpreting irrelevant negatives (white shoes "confirming" raven hypotheses) 
  - Ignoring base rates (if non-X items vastly outnumber X items, non-X non-Y findings become trivial) 
  - Non-representative selection (methods that couldn't possibly find counterexamples)

  The procedure must translate epistemology into audit-compatible steps without statistics or philosophy jargon. Key trade-offs: 
  - Dropping Bayesian calculations for binary decisions 
  - Sacrificing degrees of confirmation for simple categories 
  - Treating reference classes as given despite boundary ambiguities 

  For the sampling issue: auditors must ask "Could this method have found an X without Y?" If no, the dossier gets NOT COUNTABLE. For evidentiary weight of non-X non-Y items, we'll tie it to relative population sizes - when non-X items dominate, such findings become negligible. Refutation remains absolute: one counterexample kills the claim regardless of positive instances.

  Testing with their four cases: 
  - A: Random sample but only 214/9000 items, with non-vessels (8870) overwhelming vessels (130). Non-vessel non-certificates (19) are negligible evidence given the population ratio. 
  - B: Full census - perfect confirmation. 
  - C: Biased sampling (only checked lapsed contracts) which couldn't contain certified items by definition. Worthless for confirmation. 
  - D: Direct refutation - expired certificate on a vessel.

  Final labels follow directly from these analyses. The compromise is accepting that A gets "confirms negligibly" rather than quantifying probabilities, and C is "not countable" due to fatal sampling bias.
answer: |-
  ### Brainstorm: Why Dossiers Fail as Evidence for Universal Claims  
  - **Irrelevant Negatives**: Finding non-X items lacking Y (e.g., non-vessel without certificate) may be trivial if non-X items dominate the population.  
  - **Sampling Bias**: If the sampling method excludes potential counterexamples (e.g., only examining items where Y is likely), negative findings are uninformative.  
  - **Asymmetric Refutation**: One counterexample (X without Y) refutes the universal claim, but no number of non-X non-Y instances can fully confirm it.  

  ---

  ### Procedure for Auditors: Evaluating Dossiers for Universal Claims  
  *Use this checklist in order. Stop if any step yields REFUTES or NOT COUNTABLE.*  

  1. **Refutation Check**  
     - *Question:* Was any item found that is an **X** (e.g., pressure vessel) **without Y** (e.g., current certificate)?  
     - *Action:* If **YES**, the claim is **REFUTED**. Stop.  
     - *Rationale:* One counterexample disproves "all X have Y".  

  2. **Sampling Validity Test**  
     - *Question:* Could the sampling method **have detected an X without Y** if one existed?  
       - *Red flags:*  
         - Sampling only items with active contracts/records (cannot find lapsed Y).  
         - Excluding high-risk items (e.g., overdue for inspection).  
         - Targeting only non-X items.  
     - *Action:* If **NO**, the dossier is **NOT COUNTABLE**. Stop.  
     - *Rationale:* Methods that cannot surface counterexamples provide no evidence.  

  3. **Evidence Weight Assessment**  
     - *Question:* Does the dossier include **non-X items lacking Y** (e.g., non-vessel without certificate)?  
       - If **NO**: Proceed to Step 4.  
       - If **YES**: Calculate the **ratio** of non-X items to X items in the **full population**.  
         - *Example:* 130 vessels (X) vs. 8,870 non-vessels (non-X) → Ratio ≈ 68:1.  
     - *Action:*  
       - If non-X items **outnumber X items by > 10:1**, non-X non-Y findings **CONFIRM NEGLIGIBLY**.  
       - Otherwise, they provide **moderate confirmation** (proceed to Step 4).  

  4. **Positive Instances Check**  
     - *Question:* Were **any X items examined** and found with Y?  
     - *Action:*  
       - If **YES** and Step 3 passed → **CONFIRMS**.  
       - If **NO** → **NOT COUNTABLE** (no direct evidence for X).  

  ---

  ### Key Philosophical Compromises  
  - **Dropped**: Degrees of confirmation (e.g., Bayesian probabilities) → Simplified to binary/marginal categories.  
  - **Dropped**: Semantic equivalence (Hempel’s paradox) → Focus on practical evidence weight via population ratios.  
  - **Stopping Point**: Reference class boundaries (e.g., "What defines a pressure vessel?") are deferred to the assurance lead’s judgement.  
  - **Where It Misfires**:  
    - If non-X items are heterogeneous (e.g., some high-risk), population ratios may misstate evidence weight.  
    - Rare edge cases (e.g., 9:1 ratio) forced into "negligible" or "confirms" based on threshold.  

  ---

  ### Procedure Applied to Dossiers  

  #### **Dossier A**  
  *Sample: 214 random items (130 vessels, 8,870 non-vessels total). 19 lacked certificates (all non-vessels).*  
  1. **Refutation Check**: No vessel without certificate → Pass.  
  2. **Sampling Validity**: Random sample → Could detect vessel without certificate → Pass.  
  3. **Evidence Weight**: Non-vessels without certificates (19) exist.  
     - Non-X:X ratio = 8,870:130 ≈ **68:1** (>10:1) → **CONFIRMS NEGLIGIBLY**.  

  **Verdict: CONFIRMS NEGLIGIBLY**  

  #### **Dossier B**  
  *Census: All 130 vessels certificated.*  
  1. **Refutation Check**: No vessel without certificate → Pass.  
  2. **Sampling Validity**: Full census → Could detect counterexample → Pass.  
  3. **Evidence Weight**: No non-X non-Y items → Skip to Step 4.  
  4. **Positive Instances**: All X items (vessels) examined and have Y → **CONFIRMS**.  

  **Verdict: CONFIRMS**  

  #### **Dossier C**  
  *40 uncertificated items found via lapsed contracts list; none were vessels.*  
  1. **Refutation Check**: No vessel without certificate → Pass.  
  2. **Sampling Validity**: Sampled **only uncertificated items** → **Could not find certificated items** (which could include vessels with valid Y).  
     - *Red flag*: Method cannot detect an X *with* Y (potential false negatives). → **NOT COUNTABLE**.  

  **Verdict: NOT COUNTABLE**  

  #### **Dossier D**  
  *One vessel found with expired certificate.*  
  1. **Refutation Check**: **Vessel (X) without valid certificate (Y)** → **REFUTES**.  

  **Verdict: REFUTES**  

  ---

  \answer{A: CONFIRMS NEGLIGIBLY; B: CONFIRMS; C: NOT COUNTABLE; D: REFUTES}
