answer: |-
  ## Theory of Justification: Core Requirements Specification

  **Core Problem:** Any viable theory of justification must solve the epistemic regress problem without collapsing into absurdity, triviality, or practical irrelevance. It must also capture core intuitions about knowledge and rational action.

  ### Non-Negotiable Requirements (Shared Intuitions)

  1.  **Avoid Regress Catastrophes:** Must avoid vicious circularity (premises ultimately depend on themselves), arbitrariness (halting the chain without reason), or impossibility (requiring an actually completed infinite chain of reasons).
      *   *Intuition:* Justification must be *grounded* somehow. "Just because" or "it proves itself in a tiny circle" feels like cheating. An impossible infinite chain offers no actual support *to us*.
  2.  **Accommodate Ordinary Justification:** Must explain how mundane beliefs (e.g., "There's a cup on my desk," "My friend is usually truthful") are typically justified without requiring Cartesian certainty or exhaustive proof.
      *   *Intuition:* We *do* rationally hold countless beliefs. A theory that implies skepticism about everyday knowledge is implausible.
  3.  **Distinguish Justification from Truth:** Must allow that a belief can be *justified* yet *false* (e.g., Fake Barn County), and *unjustified* yet *true* (e.g., a lucky guess).
      *   *Intuition:* Justification concerns our *reasons* and *processes*, not the world's accidental alignment with them. Collapsing J into T makes justification redundant and ignores Gettier cases.
  4.  **Handle Defeasibility:** Must explain how justification can be *provisional* and *defeated* by new evidence (e.g., initially justified belief in a real barn, defeated by learning it's a facade).
      *   *Intuition:* Our epistemic position changes dynamically. Rational agents revise beliefs in light of counter-evidence; justification isn't static.
  5.  **Account for Degrees of Justification:** Must accommodate that beliefs can be more or less well-supported (e.g., strong evidence vs. weak testimony), not just "justified" or "unjustified" absolutes.
      *   *Intuition:* Rational confidence comes in shades. Decisions often rely on balancing probabilities, not binary certainties.
  6.  **Enable Rational Action:** Must explain how justification connects to rational action under uncertainty. Agents constantly act on beliefs that aren't infallibly justified.
      *   *Intuition:* Epistemology isn't purely theoretical. We need to explain how imperfect justification licenses real-world decisions (crossing the street, trusting a doctor).

  ### Contested Requirements / Camp-Specific Rules

  1.  **The Regress Stopping Condition:**
      *   *Foundationalist Rule:* Requires ultimately non-inferentially justified "basic" beliefs (e.g., perceptual seemings, logical intuitions).
      *   *Coherentist Rule:* Permits justificatory loops if the entire web of beliefs is sufficiently comprehensive and coherent.
      *   *Infinitist Rule:* Allows (and requires) an infinite chain of reasons, each supported by a prior reason.
      *   *Status:* These are fundamentally *competing solutions* to Requirement 1, not shared core requirements. Each camp insists its *solution* is necessary to avoid catastrophes.
  2.  **Internalism vs. Externalism:** (Related to "No reason to doubt" vs. "Positive reason")
      *   *Internalist Leaning:* Justification requires cognitive access to the reasons (making "no reason to doubt" potentially insufficient alone).
      *   *Externalist Leaning:* Justification can depend on reliable processes outside conscious access (making "no reason to doubt" *within a reliable framework* potentially sufficient).
      *   *Status:* The core requirement is that the theory must *address* the relationship between negative (no defeaters) and positive support. *How* it does this (requiring conscious access or not) is a major point of contention between camps, not a universally shared requirement. The core intuition is that justification requires *something more* than mere absence of doubt, but what that "more" is differs.

  ### The Unsatisfiable Trilemma?
  While no single requirement universally sinks all views, the most persistent tension arises from combining:

  1.  **Avoid Arbitrariness (Regress Management):** Foundationalism is accused of failing here (basic beliefs seem arbitrary).
  2.  **Avoid Circularity (Regress Management):** Coherentism is accused of failing here (loops seem vicious).
  3.  **Avoid Impossibility/Practicality (Regress Management + Action):** Infinitism is accused of failing here (we can't have infinite chains).
  4.  **(Implied) Transmission Requirement:** Justification must genuinely *transfer* from supporting beliefs to target belief without begging the question. This is the core challenge underlying the regress problem that all three solutions wrestle with unsatisfactorily from each other's perspectives.

  **The Requirement That Knocks Out Contenders (From Each Other's Viewpoint):**
  **The Regress Management Requirement (Requirement 1 - Avoid Catastrophes)** is the primary battleground. Each major camp is *defined* by how it claims to satisfy this requirement, and each camp argues the others *fail catastrically* at it:

  *   **Foundationalism:** Knocked out by Coherentists/Infinitists for allegedly failing to avoid arbitrariness ("Why *these* basics?").
  *   **Coherentism:** Knocked out by Foundationalists/Infinitists for allegedly failing to avoid vicious circularity.
  *   **Infinitism:** Knocked out by Foundationalists/Coherentists for allegedly failing to avoid impossibility/practical irrelevance (violating Requirement 6).

  The requirement itself is non-negotiable. The *failure* to satisfy it adequately (as judged by rival camps) is the primary reason each camp rejects the others. It's the fulcrum of the trilemma.
