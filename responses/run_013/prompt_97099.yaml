  - After the coin flip and decision/payout, we reveal the assigned policy.

  Then, the participant can see that if they are assigned "Pay", then in the reward branch they get 10 tokens, and in the payment branch they have to decide. In the payment branch, if they pay, they lose 1 token; if not, they don't. But there's no direct incentive to pay in the payment branch because it doesn't affect the reward branch. However, if they are assigned "Pay", in the payment branch they are expected to pay, and if they don't, then in a repeated game the predictor might not assign "Pay" again, but we only play once.

