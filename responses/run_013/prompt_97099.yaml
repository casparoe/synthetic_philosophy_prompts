  Symmetric round design using commitment:

  - At the beginning of the round, each participant must write down what they would do in branch A and what in branch B ( Pay or Refuse) without knowing which will be actual. This is their commitment.
  - The predictor records this commitment. (So the prediction is the commitment.)
  - Then, we flip a coin to decide which branch is actual.
  - If branch A is actual, then the participant must decide: pay 1 token or refuse? (not necessarily following their commitment).
  - Then, they get 10 tokens for branch B if their commitment for branch B was Pay.
  - Similarly, if branch B is actual, they decide in branch B, and get 10 tokens for branch A if their commitment for branch A was Pay.

  Now, the participant has to decide in the actual branch whether to follow their commitment or not. If they committed to pay in branch B (non-actual), then by having committed to pay, they get 10 tokens for branch B. But in the actual branch (say A), if they committed to pay in A, they might choose to refuse to avoid payment. But then they still get the 10 tokens for branch B if they committed to pay in B. So they can commit to pay in both and then in the actual branch refuse, and still get the 10 tokens for the non-actual branch. This is bad.

  To prevent this, we can make the payout for the non-actual branch conditional on them following their commitment in the actual branch? But that's not in the spirit.

