answer: |-
  ### Session Design: Decision Theory Exploration
  Below is a complete session plan for your philosophy club, centered on the counterfactual mugging problem without naming it until the debrief. The design meets all your constraints: inspectable prediction mechanism, rounds with no signal and imperfect prediction, a symmetric variant, token-based stakes, and no reliance on authority for honesty. Roles, materials, and rules ensure cheating is unappealing or detectable through transparency and pre-commitment.

  ---

  ### **Materials and Room Setup**
  - **Materials**:
    - Tokens: 200+ identical tokens (e.g., poker chips or colored paper slips) stored in a central pool. Each participant starts with 10 tokens.
    - Prediction device: Two sealed envelopes per participant (labeled with their ID), a whiteboard, markers, and a "prediction key" cheat sheet (hidden until debrief).
    - Branch resolution tools: 
      - A coin (for random branches).
      - A "fixed fact" card (e.g., "Last digit of π at position 1000 is 9" – pre-researched and sealed in an envelope; even digit = Branch A, odd = Branch B).
      - A 10-sided die (for imperfect prediction rounds).
    - Survey forms: Pre-filled by participants during sign-in (simple questions: "Do you often change your mind? Y/N", "Favorite number? 1-10", "Risk comfort? Low/Medium/High").
    - Snack menu: Tokens redeemable post-session (e.g., 1 token = 1 cookie, 5 tokens = chips; ensure payoffs allow doubling/wipeout: 10 tokens max payout, 10 token loss possible).
  - **Room Setup**:
    - Tables arranged in a U-shape facing a central "game zone."
    - You (Game Master) and your helper (Predictor) at the front with materials.
    - Prediction station: A separate small table with a privacy screen (e.g., cardboard) where the Predictor works. Predictions are written/sealed in envelopes before decisions to prevent cheating.
    - Whiteboard tracks rounds, payoffs, and accuracy stats.

  ---

  ### **Roles and Honesty Mechanisms**
  - **Game Master (You)**: Explains rules, runs rounds, resolves branches, enforces payoffs. Stay neutral; refer to rules, not authority.
  - **Predictor (Your Friend)**: Uses the survey to generate predictions per a rule-based "key" (e.g., "If risk comfort = High, predict PAY; else REFUSE"). Seals predictions in envelopes before participants decide. The privacy screen ensures no one sees predictions early. Honesty is enforced because:
    - Envelopes are sealed publicly, and you verify no tampering.
    - The prediction key is revealed in debrief; if predictions don’t match the key, cheating is obvious.
  - **Participants**: Make decisions individually. No group decisions to prevent coercion. Tokens are physical and handed in/out visibly.

  ---

  ### **Rounds: Rules, Payoffs, and Order of Reveal**
  Each round runs 10-15 minutes. Stakes: Paying costs 5 tokens; receiving gains 10 tokens. Coin/fixed fact is resolved live. **Total tokens per participant**: Start with 10, max ~20, min 0 (wipeout possible but recoverable; no one is "robbed" as tokens come from a pool).

  #### **Round 1: No Signal (Baseline)**
  - **Goal**: Show refusing is rational without prediction.
  - **Rules**: 
    - Flip a coin: Heads = "Pay Branch" (participants choose to pay 5 tokens or refuse), Tails = "Gain Branch" (all get 10 tokens unconditionally).
    - No predictor or conditions.
  - **Payoffs**: 
    - Tails: +10 tokens to all.
    - Heads: Pay 5 tokens (no gain) or refuse (keep tokens).
  - **Order of Reveal**: Flip coin publicly → If Heads, participants state decisions aloud → Payoffs.
  - **Why it works**: In Heads, paying loses tokens with no benefit. Sets baseline: Refusing is correct here.

  #### **Round 2: Perfect Prediction (Signal Present)**
  - **Goal**: Introduce prediction; participants feel the "pull" to pay.
  - **Rules**:
    - Predictor uses survey-based key (e.g., "If favorite number < 5, predict PAY; else REFUSE") to generate predictions for the Pay Branch. Seals predictions in envelopes.
    - Flip coin: Heads = Pay Branch (decide to pay 5 tokens or refuse), Tails = Gain Branch (get 10 tokens only if prediction was PAY).
  - **Payoffs**:
    - Tails: +10 tokens if prediction = PAY; 0 if REFUSE.
    - Heads: Pay 5 tokens or refuse (no additional gain).
  - **Order of Reveal**: Predictor seals envelopes publicly → Flip coin → If Tails, open envelopes to reveal predictions → Apply payoffs. If Heads, participants decide first → Open envelopes to verify predictions (should match decisions due to key).
  - **Why it works**: In Tails, participants see gains are tied to their predicted action in the counterfactual branch. Prediction is inspectable (key revealed later).

  #### **Round 3: Imperfect Prediction (70% Accuracy)**
  - **Goal**: Test if paying survives with imperfect accuracy; force a numeric threshold.
  - **Rules**:
    - Predictor uses key but adds randomness: After making initial prediction, roll a 10-sided die. If roll ≤ 3 (30% chance), flip prediction (e.g., PAY → REFUSE). Record final prediction.
    - Flip coin: Same as Round 2, but announce predictor is "70% accurate" (due to die roll).
  - **Payoffs**: Same as Round 2.
  - **Order of Reveal**: Predictor writes initial prediction, rolls die, adjusts, then seals → Flip coin → Reveal decisions/predictions → Payoffs.
  - **Why it works**: Accuracy is measurable. During debrief, participants calculate expected value (e.g., paying costs 5 but has 70% chance to secure 10 in Tails, so +2 net gain). Forces them to identify a threshold (e.g., "Worth paying if accuracy >50%").

  #### **Round 4: Symmetric Variant (Fixed Fact Branch)**
  - **Goal**: Symmetry shows pre-commitment pays; no randomness to "hide behind."
  - **Rules**:
    - Use fixed fact (e.g., pre-sealed digit of π) to determine branches. No coin flip—branch is predetermined but unknown.
    - Two branches: Branch A (Pay Branch), Branch B (Gain Branch). Both symmetric: In A, you must pay to potentially trigger gains in B; in B, gains depend on prediction for A.
    - Predictor makes two predictions per participant (one for each branch) using the key. Seals in two envelopes.
    - Reveal fixed fact publicly (e.g., "Digit = 9 (odd) → Branch B actual").
    - If Branch A actual: Decide to pay 5 tokens or refuse. Then, gain 10 tokens only if prediction for Branch B was PAY.
    - If Branch B actual: Gain 10 tokens only if prediction for Branch A was PAY. No payment.
  - **Payoffs**:
    - Branch A: Pay 5 tokens (or refuse) + 10 tokens if prediction for B = PAY.
    - Branch B: 10 tokens if prediction for A = PAY.
  - **Order of Reveal**: Predictor seals envelopes → Reveal fixed fact → If A, decide then open B's prediction → Payoffs. If B, open A's prediction → Payoffs.
  - **Why it works**: Participants see predictions are symmetric (e.g., prediction for A affects B, and vice versa). Those who "match" the predictor's policy (e.g., always PAY) gain in both branches. The person refusing must explain why gains depended on an unrealized branch.

  ---

  ### **Minute-by-Minute Timeline (90-Minute Version)**
  - **0-5 min**: Intro and rules. Distribute tokens (10 each). Explain: "We'll play games where tokens depend on choices and predictions. No right answers—explore!"
  - **5-15 min**: Round 1 (No Signal). Establish baseline.
  - **15-30 min**: Round 2 (Perfect Prediction). Prediction mechanism introduced.
  - **30-45 min**: Round 3 (Imperfect Prediction). Introduce die-roll inaccuracy.
  - **45-65 min**: Round 4 (Symmetric Variant). Use fixed fact; emphasize symmetry.
  - **65-75 min**: Prep for debrief: Gather predictions, resolve tokens, display key.
  - **75-90 min**: Debrief (structure below).
  - **Post-session**: Redeem tokens for snacks.

  ---

  ### **Debrief: Mapping Moments to Philosophy**
  Debrief starts by naming "counterfactual mugging" and ties rounds to your four points. Use Socratic questioning—ask participants to recall experiences before lecturing.

  1. **Why paying doesn’t require believing the coin was likely the other way**:
     - **Map to Round 2 Tails outcome**: "In Tails, you gained 10 tokens if predicted to pay in Heads. Did anyone feel this meant Heads was likely? No—it was about a *counterfactual* (what if it was Heads?). The gain isn't about probability; it's about what you *would* have done."
     - **Key insight**: Distinguish probability from counterfactual dependency.

  2. **Choosing an act vs. choosing a policy**:
     - **Map to Round 4 Symmetry**: "In Round 4, gains depended on predictions for both branches. If you committed to 'always pay' in advance, you gained regardless of the branch. But if you decided branch-by-branch, you might have lost. What's the difference?"
     - **Key insight**: Policies bind actions across branches; acts are branch-specific. Round 4 forces this through symmetry.

  3. **Written intention ≠ predictor of action**:
     - **Map to Prediction Key**: "The predictor used your survey answers to guess your actions. But in Round 2, did your actual decision always match what you thought you'd do? (Often no.) The gap between intention and action is why predictors aren't perfect—even if you say you'll pay, you might not."
     - **Key insight**: Predictors infer from data, not promises. Imperfect Round 3 shows this gap matters.

  4. **Standpoint before coin flip: Genuine or averaging?**:
     - **Map to Pre-flip discussion**: "Before the coin flip, many of you said paying seemed smart because it could secure gains. After, in Heads, refusing felt obvious. Was that pre-flip view a real standpoint, or just math?"
     - **Key insight**: The pre-flip view is a genuine standpoint of uncertainty. It's not averaging—it's deciding under ignorance (as in Round 2).

  **Addressing "It's just a game with low stakes"**:
  - **Build into rules**: Use high-stakes payoffs (double/wipeout) and emotional language (e.g., "This could decide your snacks!"). In debrief, ask: "If tokens were $100, would you pay? Why? What changes—the structure or your emotions?"
  - **Debrief point**: "The stakes highlight emotions, but the problem’s structure—gains conditional on counterfactuals—doesn’t change. If you’d pay at high stakes, you accept the counterfactual dependency."

  ---

  ### **Predictable Problems and Fixes**
  1. **Confusion about rules**:
     - **Risk**: Participants get lost in complex rounds.
     - **Fix**: Start with simple Round 1. Use whiteboard visuals. Pause to re-explain with examples (e.g., "Imagine in Round 2, coin is Tails—you only gain if predicted to pay in Heads").

  2. **Cheating/peer pressure**:
     - **Risk**: Participants copy decisions or lobby others.
     - **Fix**: Decisions are private (write choices on paper). Tokens distributed secretly in envelopes. Emphasize: "Your tokens depend on your choices alone."

  3. **Disbelief in predictor**:
     - **Risk**: "The predictor can’t know what I’d do!"
     - **Fix**: In Round 2, predictions match decisions due to key. Reveal key in debrief to show inspectability. Stress: "We’re not claiming perfect prediction—just exploring the idea."

  4. **Symmetric round misfire**:
     - **Risk**: Participants miss symmetry if fixed fact is confusing.
     - **Fix**: Use clear labels ("Branch A/B"). Pre-reveal that branches are symmetric. Ask: "Did anyone notice gains depended on the other branch?"

  5. **Time overrun**:
     - **Fix**: Assign strict timers (e.g., phone alarm). Cut discussion short with: "Let’s note this for debrief." Skip optional Round 5 if needed.

  **Frank Limitation**: The activity cannot perfectly replicate **perfect prediction of free will**. In real counterfactual mugging, Omega predicts your actual choice, but here, predictions are rule-based (survey key). Participants may say, "I wouldn’t have paid even if predicted!" Address in debrief: "This gap exists—real predictors might use better data, but the core dilemma remains: Your gains depend on a counterfactual."

  ---

  ### **40-Minute Version**
  - **Materials/Roles**: Same, but skip Round 1 and shorten.
  - **Timeline**:
    - 0-5 min: Intro and tokens.
    - 5-15 min: Round 2 (Perfect Prediction). Skip no-signal baseline; start with prediction.
    - 15-25 min: Round 4 (Symmetric Variant). Prioritize symmetry over imperfect prediction.
    - 25-35 min: Debrief (focus on points 1, 2, and 4; use Round 4 for policy discussion).
    - 35-40 min: Token redemption.
  - **Changes**: Skip Round 3 (imperfect) and Round 5 (fixed fact). Debrief is direct: "What surprised you? Why might paying be rational? How did symmetry affect you?"

  ---

  This design ensures participants "feel" the problem through hands-on play, with moments that directly map to the philosophical nuances. By the end, they’ll grapple with why paying seems irrational in one branch but smart as a policy—setting up rich debate. Good luck—your club is lucky to have you!
