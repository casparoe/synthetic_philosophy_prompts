  But the participant doesn't know which branch they are in. So they have to make a decision without knowing. That is not how counterfactual mugging works.

  I think for the sake of the activity, we will have to use a coin flip and the standard counterfactual mugging for the symmetric round, and then in the debrief, we discuss what would happen if they committed to a policy.

   Detailed round-by-round:

  Round 0: Introduction (5 min)
  - Distribute tokens: each gets 10 tokens.
  - Explain that they will play several games to make decisions that affect their token count.

  Round 1: No predictor (10 min)
  - GM: "In this round, I will flip a coin. If it's Heads, I will ask each of you: do you want to give me 1 token? If you give, you get nothing else. If you don't give, you keep your token. If it's Tails, I will give each of you 5 tokens, no questions asked."
  - Flip the coin (say, 50/50). If Tails, everyone gets 5 tokens. If Heads, ask each participant: pay 1 token or not? (They should refuse because no benefit.)
  - After, discuss briefly: in Heads, what did you do? Why?

  Round 2: Perfect predictor (15 min)
  - GM: "Now we have a predictor. Before you decide, the predictor will write a prediction for what you would do if the coin lands Heads. The predictor is in the next room / behind a screen. We will call you one by one. For each of you, the predictor writes a prediction (Pay or Refuse) and seals it in an envelope. Then the coin is flipped. If Tails, you receive 10 tokens only if the prediction was 'Pay'. If Heads, you are asked to pay 1 token or not, and then we open the envelope to see the prediction."
  - The predictor (your friend) uses a rule based on the survey. For example, if the participant's survey answer to "Would you pay in a situation like this?" is yes, then predict Pay; else Refuse. But we don't want them to know the survey is used. So use innocent questions: e.g., if their birth month is January-June, predict Pay; else Refuse. The predictor has a cheat sheet.
  - Procedure for each participant:
     - Participant comes to the front.
     - Predictor writes prediction based on rule, seals in envelope.
     - Participant returns to seat.
  - After all predictions are sealed, GM flips the coin.
  - If Tails: GM opens each envelope. If prediction is Pay, the participant gets 10 tokens; else 0.
  - If Heads: GM asks each participant: pay 1 token or refuse? Then open the envelope. If they paid, the prediction should be Pay; if refused, Refuse. (It will match because of the rule.)
  - This round may have some participants in Tails getting 10 tokens because they were predicted to pay, even though they didn't have to pay. This is the key.

  Round 3: Imperfect predictor (15 min)
  - Similar to Round 2, but the predictor is only 80% accurate. The predictor first makes a prediction based on the rule (as above), then flips a biased coin (say, with 80% chance of keeping the prediction, 20% chance of flipping it). The predictor records the final prediction and seals it.
  - GM: "The predictor is not perfect; it's about 80% accurate."
  - Proceed as in Round 2.

  Round 4: Symmetric variant (20 min) - using the commitment design, but we'll call it a policy round
  - GM: "In this round, you will write down your policy for two hypothetical branches. There are two branches: Branch A and Branch B. We will flip a coin to decide which branch is actual. In Branch A, if it is actual, you will be asked to pay 1 token. In Branch B, if it is actual, you will receive 10 tokens only if you wrote that you would pay in Branch A."
  - Each participant writes on a slip: for Branch A, would you pay? (Yes/No) and for Branch B, would you pay? (Yes/No) - but note: in Branch B, they are not asked to pay; it's the receive branch. So the question for Branch B is not relevant. So simplify: only ask for Branch A: "If Branch A occurs, will you pay 1 token? (Yes/No)"
  - Then, they also write for Branch B: not applicable. So only one commitment: what they would do in Branch A.
  - The predictor collects these commitments. (This is the prediction for Branch A.)
  - Flip a coin: if heads, then Branch A is actual: each participant is asked to pay 1 token or not. (They can choose to follow their commitment or not.)
    - Then, if Branch A is actual, they get nothing for Branch B because it's not actual? We have to give the Branch B reward only if Branch B is actual.
  - If the coin is tails, then Branch B is actual: they are not asked to pay, and they receive 10 tokens if their commitment for Branch A was Yes.

  This is the standard counterfactual mugging, but with the commitment used as the prediction. And in the pay branch (A), they can choose to deviate from their commitment.

  In this round, if the coin is tails (reward branch), they get 10 tokens if they committed to pay in A.
  If the coin is heads (pay branch), they choose whether to pay or not. If they pay, they lose 1 token. If not, they save it. But their commitment doesn't affect their choice in the pay branch.

  The incentive is to commit to pay in A, and then in the pay branch (A) not to pay. Then if the coin is tails, they get 10 tokens for free. If heads, they save the 1 token. This is the best.

  But if they are honest, in the pay branch they might pay, which is costly.

  This shows the tension.

  In the debrief, we can discuss why they might want to commit to pay even though in the pay branch they have an incentive to defect.

  Round 5: Fixed fact branch (15 min) - if time
  - Use a fixed fact, e.g., the last digit of the school's street address. If even, Branch A; odd, Branch B.
  - But we reveal the branch after they make the commitment.
  - Procedure:
     - Each participant writes their commitment for Branch A (as above).
     - Then, reveal the fixed fact (from a sealed envelope or look it up).
     - If the fixed fact designates Branch A as actual, then they are in the pay branch: they must decide whether to pay 1 token.
     - If Branch B is actual, they receive 10 tokens if they committed to pay in Branch A.
  - This shows that even without randomness, the structure is the same.

  Debrief (20 min) - structured as per your request.

  Minute-by-minute timeline:
  - 0-5 min: Introduction, distribute tokens (10 each)
  - 5-15 min: Round 1 (No predictor)
  - 15-30 min: Round 2 (Perfect predictor)
  - 30-45 min: Round 3 (Imperfect predictor)
  - 45-65 min: Round 4 (Symmetric variant with commitment)
  - 65-80 min: Round 5 (Fixed fact branch) - or if time, otherwise skip
  - 80-90 min: Debrief

  For the 40-minute version:
  - Skip Round 1 and Round 5.
  - Round 2: 10 min
  - Round 3: 10 min
  - Round 4: 10 min
  - Debrief: 10 min

  Now for the debrief, to cover your points:

  1. Why paying does not require thinking the coin was more likely the other way?
     - Reference Round 2: In the Tails branch, participants who were predicted to pay get 10 tokens. This is because of what they would have done in the Heads branch. The coin landed Tails, but the condition is about the counterfactual.

  2. Difference between choosing an act in the branch you are in and choosing a policy.
     - In Round 4, they committed to a policy (for Branch A) but in the actual branch (if A) they could choose differently. The policy is about what you would do in all branches.

  3. Written intention vs. predictor of what you will actually do.
     - In Round 4, the commitment is what they said they would do, but in the pay branch, they might not do it. The predictor in Round 2 was based on a survey and might be more accurate than a commitment.

  4. Standpoint before the coin is resolved.
     - Before knowing the coin flip, they might think it's worth it to be the type of person who pays, because then in the Tails branch they get 10 tokens. But after knowing it's Heads, paying seems bad. So the standpoint before the flip is one of uncertainty, and the policy is chosen from that standpoint.

  For the expected criticism that it's because of low stakes, in the debrief, we can ask: "If the tokens represented $1000, would you change your decisions?" Then discuss whether the structure of the decision changes with stakes.

  Predictable ways it can go wrong:
  - Participants might not understand the rules. Solution: explain clearly, use examples, and do a trial round with no stakes.
  - In the prediction rounds, participants might try to game the predictor. Solution: tell them the predictor is using a fixed rule based on their survey, so gaming is hard.
  - In the symmetric round with commitment, many might defect in the pay branch. This is okay, as it sets up the deb discussion.

   frank paragraph on what the activity cannot reproduce:
