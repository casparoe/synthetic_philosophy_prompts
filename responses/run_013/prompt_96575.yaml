prompt: |-
  I run a small analytics team — four analysts, none of them statisticians — at a state public-health agency. Every Monday we publish county-level probabilistic forecasts: for each of roughly thirty counties, the probability that intensive-care occupancy will exceed ninety percent at some point in the next fourteen days. Those numbers feed an alert system, and above a threshold the state pre-positions staff and equipment. A false alarm costs money and public credibility; a missed surge costs lives. Our internal scorecard is a running embarrassment. We mark a forecast as a success when the event happened and we said it would, and as a failure otherwise, which means an analyst who said ten percent and was unlucky goes down as wrong while an analyst who said ninety percent and got lucky goes down as right. Nobody trusts the scorecard, so nobody argues with it, and the forecasts are drifting.

  I have been reading around in a literature I only half understand — accuracy-first epistemology, the idea that what makes a credence good or bad as a credence is how close it comes to the truth, made precise with scoring rules. I want you to convert whatever is genuinely usable in that material into a procedure my team can run. Concretely, I need a sequence of steps with an order to them, a statement of what would count as settling each step, the point at which a step can come out no and we stop, and the points where no rule will do the work and a named person has to own the call. Along the way the procedure has to take positions on the following, and be explicit about which of its positions are the theory talking and which are just us making a decision.

  First, how we should score ourselves. I understand that certain scoring rules are the only ones under which an analyst's best move is always to report what she actually believes, and I want to know what follows from that and what does not: in particular, what to do about the fact that we must choose one rule, and that different defensible rules can rank two sets of forecasts differently. Second, whether the coherence result — that credences violating the probability axioms are guaranteed to be beaten by some alternative under every reasonable rule — buys us anything operationally, and where its reach ends. I gather the parallel argument for updating by conditionalization needs an extra assumption about what our future credences will be like, and I would rather see that assumption stated than buried. Third, how to distinguish a disagreement about a number from a disagreement about what the number is about, since our analysts have been known to mean different things by the same threshold. Fourth, how to combine two analysts' numbers into the one we publish, and whether that published number is itself a credence that can be scored or a decision that merely wears the costume of a number. Fifth, whether and how far my own number should move when a colleague disagrees with me, and whether that movement is something an accuracy-based story can justify or something we do for reasons it does not cover. Sixth, how to decide whether to spend the last twenty minutes of the meeting gathering more evidence instead of sharpening the numbers we have; I suspect the framework says nothing about which questions we should be asking in the first place, and I want that gap marked rather than papered over. And seventh, where the procedure must hand off to a human because the remaining question is about values — how much alert cost to trade against surge risk, whether to publish a range rather than a point, how much weight to give a county officer's local knowledge against our model.

  Then run the procedure on three cases. Two analysts give 0.15 and 0.55 for the same county, and the one at 0.15 is the senior analyst who has called the last three weeks correctly. A county health officer tells us the situation is unprecedented and refuses to give a number at all. And our most calibrated analyst — the one whose seventy-percent forecasts come true about seventy percent of the time — turns out to be the least informative member of the team, while the one everyone calls overconfident has the sharpest calls. At least one of these should come out in a way we will not enjoy. Close by telling me what this procedure cannot do, and where it will quietly misfire. No citations, no reading list, no pointers to papers; assume I cannot look anything up.
reasoning: |-
  Okay, let me start by unpacking the user's query. They run a small analytics team at a state public-health agency, forecasting ICU occupancy probabilities for counties. Their current scoring system is flawed, leading to distrust and drifting forecasts. They've been reading about accuracy-first epistemology and scoring rules but need a practical procedure. 

  First, I need to address their seven specific points. The user wants a step-by-step procedure that covers scoring, coherence, clarifying disagreements, combining forecasts, updating beliefs based on peer input, evidence gathering, and value-based decisions. They also want three cases analyzed to test the procedure.

  The user's main pain points are the unreliable scorecard causing mistrust and the life-and-death consequences of forecasts. Their deeper needs likely include establishing credibility, ensuring consistent methodology, and making defensible decisions under uncertainty. They might also need to justify changes to their team and stakeholders, so the procedure must be transparent and actionable.

  For the scoring rule, I recall that strictly proper scoring rules incentivize truthful reporting. Options like Brier score or log score are appropriate. The user must choose one, so emphasizing the need for a team decision here is key. Coherence is important but doesn't resolve everything. Violating probability axioms could lead to dominance, but in practice, it's about avoiding sure losses.

  Clarifying thresholds is crucial. Analysts might interpret "90% ICU occupancy" differently. The procedure needs explicit definitions to ensure everyone measures the same event. Combining forecasts: using a weighted average based on past performance makes sense, but it's a decision, not a credence, so scoring the combined forecast might not be valid.

  Updating beliefs when peers disagree involves peer disagreement frameworks. The accuracy-based approach might not fully justify this, so it's more about epistemic humility. Evidence gathering vs. refining numbers: the framework doesn't prioritize questions, so marking that gap is necessary. Value-based decisions must be owned by humans, like trading off costs and risks.

  For the case studies: the senior analyst's low probability vs. a junior's high one—past performance weights matter. The county officer refusing to give a number requires deferring to local knowledge but documenting it. The calibrated but uninformative analyst versus the overconfident one highlights the trade-off between calibration and resolution. Using metrics like Brier score components can reveal this.

  The procedure's limitations include not handling systemic changes well, assuming consistent events, and requiring stable data. Also, the combined forecast isn't a true credence, so scoring it might not reflect individual beliefs. Misfires could happen when events are undefined or when team dynamics influence weights. Emphasizing transparency and documentation is essential throughout.
answer: |-
  Here's a procedure based on accuracy-first principles, designed for operational use. It explicitly addresses your seven points and defines roles, stopping points, and the source of each decision.

  **Procedure: Forecast Generation & Evaluation (FG&E)**

  **Phase 1: Clarification & Preparation (Mon-Tue)**
  1.  **Step 1: Event Definition Lockdown (Owner: Team Lead - You)**
      *   **Action:** Reconfirm the exact, unambiguous definition of the target event: "Intensive-care occupancy will exceed ninety percent at some point in the next fourteen days" for each county. Specify:
          *   How occupancy is measured (e.g., staffed beds, licensed beds, specific time of day?).
          *   Source data and latency (e.g., daily reported figures from hospitals?).
          *   "Exceed ninety percent" (e.g., >90.0%? >=90.0%? Average over a day? Single snapshot?).
          *   "At some point" (clarify this is a binary yes/no over the 14-day window).
      *   **Settle When:** Written definition signed off by all analysts and key stakeholders (e.g., ICU operations lead). *This definition is fixed for scoring*. **[Decision Point: Team/Stakeholders - Addresses Point 3]**
      *   **Stop If No:** If consensus on definition cannot be reached, escalate the definition ambiguity to senior management/public health leadership. Forecasts cannot proceed reliably without this. **[Go/No-Go]**

  2.  **Step 2: Scoring Rule Selection (Owner: Team Lead - You)**
      *   **Action:** Choose a single strictly proper scoring rule for internal evaluation (e.g., Brier Score, Logarithmic Score). Explain the core property: *Analysts maximize their expected score only by reporting their true belief.* **[Theory: Accuracy-First Core Principle - Addresses Point 1]**
      *   **Decision:** Team selects one rule (e.g., "We use Brier Score: `(Forecast - Outcome)^2` where Outcome=1 if event happened, 0 otherwise"). **[Decision Point: Team - Addresses Point 1]**
      *   **Settle When:** Rule documented and calculation method agreed. Past forecasts will be rescored using this rule for consistency.
      *   **Acknowledge:** Different proper rules *can* rank forecasters differently. We accept this by choosing one rule consistently. The *incentive for truthfulness* is the key operational benefit, not absolute ranking. **[Theory Limitation/Limit of Reach - Addresses Point 1]**
      *   **Stop If No:** Mandatory selection. No forecast evaluation is valid for incentivizing truthful reporting without this. **[Go/No-Go]**

  **Phase 2: Individual Forecast Generation (Tue-Wed)**
  3.  **Step 3: Analyst Forecast Submission**
      *   **Action:** Each analyst independently produces their county probability forecasts using their preferred models/methods/judgment based on available data *as of Wednesday close*. Forecasts must be probabilities (0 to 1) for the locked-down event.
      *   **Settle When:** Forecasts submitted privately to the Team Lead by Wednesday EOD.
      *   **Theory Guidance:** Analysts know their internal score depends *only* on their forecast's match to the truth via the chosen scoring rule, incentivizing them to report their actual belief. **[Theory: Strictly Proper Rule Incentive - Addresses Point 1]**
      *   **Coherence Note:** If an analyst's forecasts across logically related events (e.g., County A *and* County B, County A *or* County B) violate probability axioms, *in theory*, a "Dutch book" could be made against them, meaning a competitor could exploit the inconsistency to guarantee a better score *regardless of the outcome*. Operationally, it strongly suggests internal inconsistency in belief. Flag significant violations for review with the analyst. **[Theory: Coherence/Avoiding Dutch Books - Addresses Point 2. Limited operational "buy": It flags potential internal error but doesn't specify the *right* probability, only that the set is inconsistent.]**

  **Phase 3: Synthesis & Publication (Thu)**
  4.  **Step 4: Forecast Combination (Owner: Team Lead - You)**
      *   **Action:** Combine individual forecasts into a single published probability for each county.
      *   **Decision:** Use a performance-weighted average based on past scores under the chosen rule. (e.g., Weight each analyst's forecast by the inverse of their mean Brier Score over the last N weeks). **[Decision Point: Team Lead - Addresses Point 4, Combines Theory & Decision]**
      *   **Theory Input:** Simple averaging often works well, but weighting by past performance under the *same scoring rule* used for evaluation directly links the combination to the accuracy incentive. An analyst whose past forecasts were consistently closer to the truth gets more weight. **[Theory-Informed Decision]**
      *   **Settle When:** Combined forecast calculated for each county.
      *   **Crucial Distinction:** The **published combined forecast is an operational decision** (which number to feed into the alert system/publish), *not* a credence expressing the belief of any single individual. **[Operational Reality - Addresses Point 4]**
      *   **Consequence:** The *published number cannot be meaningfully scored* against the outcome using the same rule as individual credences. Scoring it would measure the *decision quality of the combination method*, not the epistemic quality of a belief. Score the *individuals* and the *combination process's output as a decision point*, but understand they measure different things. **[Theory Limitation/Operational Reality - Addresses Point 4]**

  5.  **Step 5: Peer Belief Encounter (Optional Discussion - Thu Meeting)**
      *   **Action:** *If time/need permits:* Briefly share anonymized or aggregate range of individual forecasts (e.g., "The team range for County X is 0.1 to 0.4"). Encourage analysts to consider if seeing this significantly changes their own view *before* the next forecast cycle.
      *   **Theory on Updating:** The "peer disagreement" literature often suggests moving towards the peer average, especially if peers are deemed equally reliable ("Equal Weight View"). **[Theory: Peer Disagreement - Addresses Point 5]**
      *   **Operational Reality:** The core accuracy framework *does not directly command* you to change your credence based solely on a peer's number *today*. Your initial forecast reflected your best judgment based on evidence *available then*. A peer's number *is* new evidence about the world (they might know something you don't) *and* about your peer's judgment. **[Theory Limitation - Addresses Point 5]**
      *   **Decision:** Moving your number *this week* based purely on a peer's disagreement is **primarily a pragmatic team cohesion/risk mitigation strategy**, not strictly dictated by accuracy-first epistemology. Accuracy-first says your credence should reflect *all* evidence *you possess*. A peer's number alone isn't direct evidence about ICU occupancy; it's indirect evidence requiring interpretation. Significant disagreement should trigger evidence-sharing in *future* cycles. **[Decision Point: Individual Analyst/Team Culture - Addresses Point 5]**

  6.  **Step 6: Evidence vs. Sharpening Trade-off (Owner: Team Lead - You)**
      *   **Action:** Decide how to use the final 20 minutes of the forecast meeting.
      *   **Gap Acknowledgment:** The accuracy-first framework **says nothing** about *what* questions to ask or *what* evidence to gather. It assumes you are trying to accurately assess a *fixed* proposition. **[Marked Gap in Framework - Addresses Point 6]**
      *   **Decision Heuristic:**
          *   If the forecast range for critical counties is very wide (>30 percentage points) and the event is high-stakes, prioritize *evidence gathering*: "What key data are we missing that explains this divergence? Can we get it quickly?"
          *   If forecasts are tightly clustered or uncertainty is irreducible, prioritize *sharpening/consensus*: "Can we agree on the key drivers? Should we adjust the combination weights?"
          *   Default: Gather evidence if a plausible source exists within 20 mins; otherwise, discuss rationale.
      *   **Settle When:** Decision made and time allocated. **[Decision Point: Team Lead - Addresses Point 6]**

  **Phase 4: Publication & Evaluation (Mon)**
  7.  **Step 7: Publish & Record**
      *   **Action:** Publish the combined forecast probabilities. Record the locked-down outcomes (0 or 1) for each county as events resolve.
  8.  **Step 8: Score & Review (Owner: Team Lead - You)**
      *   **Action:** Weekly: Calculate individual and (if desired) combined forecast scores using the chosen rule. Maintain running averages. Review significant misses *in the context of the event definition and available data at forecast time*. Update combination weights periodically (e.g., every 4 weeks).
      *   **Settle When:** Scores calculated, documented, and briefly reviewed with the team.

  **Phase 5: Value & Presentation Handoff (Continuous/Ongoing)**
  9.  **Step 9: Value-Based Decisions (Owner: Public Health Leadership / Comms)**
      *   **Handoff:** The procedure outputs probabilities. **Human ownership is required for:**
          *   Setting the alert threshold (Trading off cost vs. risk). **[Values]**
          *   Deciding how to present the forecast (Single probability? Probability band? Risk category?). **[Values/Communication]**
          *   Determining the weight given to a county officer's "unprecedented" claim vs. the model. (This is input *evidence*, but its weight is a judgment call). **[Judgment/Values]**
          *   Acting on the alert. **[Operations]**
      *   **Procedure Output:** Provides the input probability and its empirical track record (e.g., "When our combined forecast was 0.7, the event occurred 65% of time historically").

  **Running the Procedure on Cases:**

  1.  **Senior Analyst (0.15) vs. Junior (0.55), Senior has "gotten last 3 right":**
      *   **Step 1/2:** Event definition & scoring rule are locked. Past "correctness" under the old flawed system is irrelevant. Score them under the *proper rule* (e.g., Brier).
      *   **Step 4:** Combine using weights based on *scores under the new rule*. If the senior has a meaningfully better *score* over recent weeks (using the proper rule), they get higher weight. If the junior's score is better or equal, they get comparable weight. Their seniority or last week's "win" under the old system doesn't factor into the combination *unless* it's explicitly part of the scoring/weighting system (which it shouldn't be). The published number will likely be closer to 0.15 if the senior has consistently better scores. **This may not be enjoyable for the junior analyst.**
      *   **Step 5:** Sharing this wide disagreement (anonymized) *should* trigger discussion. The senior might explain their low probability model ("We've seen similar patterns before that dissipated"), the junior their high-probability rationale ("New variant data suggests faster spread"). This informs *future* evidence gathering and model updates. Neither *has* to change their number *this week* based solely on the other's number.
      *   **Step 8:** The outcome will score both individuals under the proper rule, updating their track records for future weighting.

  2.  **County Officer: "Unprecedented. No Number.":**
      *   **Step 1:** The event definition is locked. The officer isn't providing a competing *probability forecast*.
      *   **Step 3:** Analysts must still produce their forecasts using all available evidence, *including* the officer's statement. The statement is **evidence** ("Things are different, my usual models might break") not a forecast.
      *   **Step 4:** Combine the analysts' forecasts as usual.
      *   **Step 6 (Evidence Gathering):** This is PRIME evidence-gathering time. "Officer, what specifically is unprecedented? What data points are breaking your expectations? What *would* make you more/less worried?" Document the answers and rationale for how analysts incorporated it (or didn't). This qualitative input factors into *judgment*, not the mechanical combination.
      *   **Step 9 (Handoff):** Leadership must decide how much operational weight to give the officer's qualitative concern vs. the quantitative forecast when pre-positioning resources. The procedure provides the quantitative forecast and records the officer's input.

  3.  **Calibrated but Uninformative vs. "Overconfident" but Sharp:**
      *   **Step 2/8:** The chosen proper scoring rule (especially Brier) exposes this. Decompose the Brier Score:
          *   `Brier Score = CALIBRATION + RESOLUTION - UNCERTAINTY`
          *   Calibrated Analyst: Good CALIBRATION (70% forecasts happen ~70%).
          *   Uninformative: Poor RESOLUTION (Forecasts are always near the base rate, e.g., 0.3-0.5). High UNCERTAINTY.
          *   "Overconfident": May have slightly worse CALIBRATION but excellent RESOLUTION (Forecasts span 0.1 to 0.9, actively distinguishing cases).
      *   **Result:** The "overconfident" but sharp analyst will typically have a **better (lower) Brier Score** because good resolution is highly valuable. Their forecasts provide more actionable discrimination between counties/weeks. **This may not be enjoyable for the calibrated but cautious analyst.**
      *   **Step 4:** The sharp analyst's consistently better *score* will earn them higher weight in the combination, making the published forecast sharper and more discriminating. The team might discuss if the "overconfident" analyst's calibration can be improved without losing resolution.

  **What This Procedure Cannot Do & Where It Misfires:**

  1.  **Cannot Define the Event or the Values:** Relies on humans for the initial definition (Step 1) and all value trade-offs (Step 9).
  2.  **Cannot Handle Radical Non-Stationarity:** If the world changes fundamentally ("new virus with completely unknown dynamics"), past scores become poor predictors of future performance. The combination weights become unstable. Human judgment overrides are essential.
  3.  **Cannot Prioritize Evidence Gathering Intrinsically:** It flags the trade-off (Step 6) but offers no objective rule for *what* evidence to seek, only heuristics.
  4.  **Cannot Resolve Deep Peer Disagreement Epistemically:** It provides a structure for discussion and future evidence (Step 5), but doesn't magically say who's "right".
  5.  **Misfires on Ambiguous Events:** If the locked-down definition (Step 1) doesn't perfectly match the "real" event of interest (e.g., true strain on the system differs slightly from the 90% occupancy metric), high scores become misleading.
  6.  **Misfires if Scores Gamed:** If analysts care more about their score than truthfulness *and* find a way to exploit the specific rule/model without improving real insight (rare with proper rules but possible in complex systems), scores become decoupled from genuine accuracy.
  7.  **Misfires by Oversimplifying Combination:** Treating the combined forecast as a weighted average of beliefs is practical but philosophically dubious. It's an operational output, not a true credence (Step 4).
  8.  **Quietly Misfires on "Unknown Unknowns":** When critical evidence is *not just missing, but entirely unimagined* (Step 6 gap), the procedure churns out precise probabilities that are fundamentally flawed. The lack of surprise detection is a key weakness.
  9.  **Misfires Under Intense Time Pressure:** Rigorous evidence gathering (Step 6) and discussion (Step 5) are the first casualties.

  This procedure provides a rigorous, incentive-aligned structure for generating and evaluating probabilistic forecasts, explicitly separating technical scoring from value judgments and highlighting both the power and the inherent limitations of the accuracy-first approach in a high-stakes operational environment.
