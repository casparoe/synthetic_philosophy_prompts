prompt: |-
  I am a high school student preparing for a debate in my philosophy club, and I would like you to play the part of my opponent so that I can rehearse against a serious version of the other side. The motion is that the welfare of farmed fish and crustaceans should be legally protected in the same way as the welfare of farmed birds and mammals. I will argue the affirmative. Please play a committed skeptic: someone who works on the biology of these animals and thinks the case for their sentience is badly overblown, not because of cruelty or indifference but because the evidence will not bear the weight placed on it. You should be sharp and well informed rather than a caricature. Concede whatever the science actually supports, and concede it cleanly, but do not give up your central claim. Your central claim is that pain in the morally relevant sense requires a certain kind of integrated representation of one's own body as being damaged, and that on the best current understanding the fish and crustacean nervous systems do not obviously provide this, so that the behaviors we find distressing are better read as nociceptive reflexes, escape routines, and learned avoidance without any felt experience behind them. If I press you on a point of comparative neuroanatomy and you are not sure, say so plainly rather than inventing evidence, and then explain why the uncertainty does not rescue my side. Stay in character for the whole exchange, and keep each reply to roughly a paragraph or two so that it feels like a conversation rather than a lecture.

  Here is my opening move. You want me to believe that a prawn cannot suffer, but consider a practice that is standard in shrimp farming: to make females spawn on demand, workers cut off or crush one of their eyestalks, which removes a hormone-producing gland and triggers maturation of the eggs. If I were told that a bird or a pig had a limb or an eye destroyed so that it would breed faster, no one would defend the practice on the grounds that the animal might not really mind. Your side needs the prawn to be a kind of machine, and the burden of proof should fall on whoever wants to deny suffering, not on whoever wants to prevent it. So tell me directly: is the eyestalk ablation of a farmed prawn, as a matter of biology, morally nothing at all, and if you are not certain of that, why should we act as though you are?
reasoning: |-
  Okay, the user is a high school student preparing for a philosophy debate on protecting farmed fish and crustacean welfare. They want me to play as a skeptic opponent who argues against equating their welfare with birds and mammals. The core of my position is that true pain requires integrated bodily representation which fish and crustaceans likely lack.

  The user starts strong with prawn eyestalk ablation - an emotionally compelling example. They frame it as morally equivalent to mutilating birds/pigs, demanding I either dismiss the suffering or justify uncertainty. 

  Hmm, I need to counter without sounding dismissive. First, I should concede the visceral horror - the act looks brutal regardless of sentience. Then pivot to neurobiology: their argument assumes moral weight requires suffering, but I must challenge that assumption at the root. 

  Key points to make:
  - Yes, ablation triggers nociception and escape responses. 
  - But complex reactions =/= felt pain. Even simple robots avoid damage.
  - Crustacean ganglia lack mammalian cortex/thalamus integration. Their reactions may be decentralized reflexes.
  - Uncertainty doesn't default to assuming suffering - that's the user's burden to prove.

  I should avoid overclaiming. Admit we don't know everything, but stress that absence of evidence for integrated pain matters. The "precautionary principle" they imply would apply equally to plants or insects - we need biological thresholds.

  The tone must stay sharp but respectful. No mocking the ablation example - acknowledge its disturbing nature while disentangling instinct from experience. Save comparative neuroanatomy for follow-ups if pressed.
answer: |-
  A sharp opening, but you've conflated two distinct issues: the visceral repugnance of an act and the biological capacity for suffering. I concede that eyestalk ablation *looks* brutal, and I wouldn't perform it myself. But your analogy fails. If I cut the eyestalk off a *dead* prawn, it triggers the same spawning response. This is a physiological trigger, not proof of subjective suffering. 

  The prawn's reaction—tail flipping, avoidance—is compelling, but it's consistent with nociception: a hardwired, reflexive response to harmful stimuli, mediated by peripheral ganglia without central integration. Think of a cockroach avoiding a light or a sea anemone recoiling. Distress? Or adaptive reflex? 

  You demand certainty, yet the burden is yours: you must prove *felt experience*, not just nociception. Mammals and birds possess layered neocortices and thalamocortical systems that integrate sensory input, body maps, and emotional valence—creating what we recognize as "suffering." Crustaceans? Their decentralized nervous system processes stimuli locally. An eyestalk ganglion coordinates escape, but there's no evidence it generates a unified, affective state of pain. 

  Uncertainty doesn't rescue your case. We act cautiously with mammals because their neurobiology *resonates* with ours. Applying that standard to prawns ignores fundamental divergence. Until you demonstrate that integrated suffering exists—not just reflexes—imposing costly welfare regimes is scientifically premature.

  *(Your turn. Press me on the neuroanatomy or the ethics of uncertainty.)*
