answer: |-
  Below is a comprehensive plan for your 75-minute seminar session on cyclical preferences and money pumps. The design addresses your core goals:  
  - **Respectable cyclical preferences**: Uses lotteries where cycles arise from how people handle small/large probabilities (not carelessness).  
  - **Escape hatch**: Students can "lock in" to avoid trades, forcing a debate on whether this legitimizes cycles.  
  - **Stealthy money pump**: Trades are offered individually as strict improvements across the session, not as a rapid-fire trap.  
  - **Debrief focus**: Explores whether the pump reveals incoherent preferences or mere exploitability, and whether refusing trades "solves" the problem.

  ---

  ### **Materials & Setup**
  - **Lotteries**: Three simple lotteries with real but small stakes (e.g., points redeemable for coffee/trinkets post-seminar). Outcomes are determined by a public random draw at the end.  
    - **Lottery A**: 5% chance of 1,000 points, 95% of 0.  
    - **Lottery B**: 100% chance of 50 points.  
    - **Lottery C**: 10% chance of 500 points, 90% of 0.  
    - **Why these work**:  
      - Expected values are identical (50 points), so no rational "edge."  
      - Cycles emerge naturally: Many prefer **A > B** (overweighting 5% chance of 1,000), **B > C** (risk aversion favors certainty), but **C > A** (10% chance of 500 feels "safer" than 5% of 1,000).  
      - Psychologically respectable: Based on *probability weighting* (small probabilities overweighted, certainty prized) from prospect theory.  

  - **Physical Materials**:  
    - Whiteboard: Record who holds what lottery, lock-ins, and trades.  
    - Projector: Display lotteries, rules, and a random number generator (e.g., random.org) for draws.  
    - Index cards: For initial lottery assignments and lock-in decisions.  
    - Tokens (optional): Poker chips or sticky notes to represent lotteries, making trades tangible.  

  - **Stakes**:  
    - Points convert to small rewards (e.g., 100 points = $1 coffee voucher). Stakes are low enough to avoid paperwork but high enough to incentivize choices ("coffee money").  

  ---

  ### **Rules & Procedure**
  #### **Phase 1: Setup & Lock-In (15 min)**  
  1. **Introduce lotteries (5 min)**:  
     - Project the three lotteries. Clarify: "One of these will be randomly assigned to you. At the end, I’ll draw a number to determine payouts."  
     - Emphasize: "There are no right/wrong preferences—base choices on your own judgment."  

  2. **Assign lotteries (5 min)**:  
     - Shuffle index cards labeled "A," "B," and "C" (5 A, 5 B, 4 C for 14 students). Students draw cards to determine their starting lottery.  
     - Record assignments on the board: `Student 1: A | Student 2: B | ...`  

  3. **Offer escape hatch (5 min)**:  
     - Announce: "You can **lock in** now. If you do, you keep your current lottery and cannot trade later. If you don’t lock in, you may get trade offers."  
     - Students write "LOCK-IN" or "NO" on cards and hand them in. Record lock-ins on the board (e.g., `Student 1: A [LOCKED]`).  
     - **Critical nuance**: Locked-in students sit out trading but participate in the final draw.  

  #### **Phase 2: Trading Rounds (40 min)**  
  - **Mechanics**:  
    - Conduct **6–8 trading rounds** (each ~5 min). In each round, offer trades to 2–3 students (prioritizing non-locked, non-traded students).  
    - **Trade offer**: "Give me your current lottery, and I’ll give you [new lottery] **plus 5 bonus points**. This is a one-time offer only for you right now."  
      - Bonuses are certain points added to final payout (e.g., trade A for C + 5 points).  
    - **Cycle-driven offers**:  
      - If holding **A**, offer **C + 5 points** (assuming A > B > C > A; C > A makes trade appealing).  
      - If holding **B**, offer **A + 5 points** (A > B).  
      - If holding **C**, offer **B + 5 points** (B > C).  
    - **Secrecy**: Privately whisper offers to students (or use discreet notes) to avoid group suspicion. Record trades quietly on the board.  

  - **Why this works**:  
    - Each trade is a **strict improvement**: They get a preferred lottery (based on common cyclical preferences) + bonus points.  
    - **Slow pace** prevents pumping from feeling like a scam. Students see trades as unrelated "deals."  
    - **Bonuses** are small (5 points) to avoid overriding lottery preferences.  

  - **Example Pump**:  
    - Student starts with A. Accepts: A → C (+5). Later, accepts: C → B (+5). Later, accepts: B → A (+5).  
    - Outcome: Back to A, but +15 points. Seems fine—until they realize they paid nothing for the cycle.  

  #### **Phase 3: Resolution (5 min)**  
  - Publicly draw a random number (1–100) for all lotteries:  
    - **A**: Wins if 1–5 (5%), loses otherwise.  
    - **B**: Always wins 50 points (100%).  
    - **C**: Wins if 1–10 (10%), loses otherwise.  
  - Add bonus points from trades (e.g., 5 points = +5 to final score).  

  ---

  ### **Debrief Questions (15 min)**  
  **Structure the discussion to probe your key themes**:  
  1. **Experience**:  
     - "Who feels better/worse off than when they started? Locked-in folks: did you regret sitting out? Traders: did you notice a pattern?"  
     - *Goal*: Surface emotions (e.g., traders feel "fine," locked-in feel "safe").  

  2. **Legitimacy of the escape hatch**:  
     - "If you refused trades (via lock-in), does that mean cyclical preferences are rational? Or does it just mean you avoided the test?"  
     - *Goal*: Debate whether transitivity is a requirement for rationality or just a way to avoid exploitation.  

  3. **Composition of trades**:  
     - "Each trade was a gain. Why might the whole sequence *feel* like a loss? Does rationality require evaluating decisions individually, or as a whole?"  
     - *Goal*: Challenge reductionism—if A > B and B > C, must A > C?  

  4. **Exploitability vs. incoherence**:  
     - "Did the pump reveal that your preferences are logically flawed? Or just that you’re vulnerable to clever traders?"  
     - *Goal*: Separate *procedural* exploitability (you can be pumped) from *structural* incoherence (cycles are irrational).  

  5. **Broader implications**:  
     - "In real life, when might ‘locking in’ not be an option? Does this make cyclical preferences dangerous?"  
     - *Goal*: Link to commitment devices, self-binding, and rational agency.  

  ---

  ### **Predictable Problems & Mitigations**  
  1. **Problem**: Too many lock-ins (suspicious students sit out).  
     - **Mitigation**:  
       - Pre-frame lock-in neutrally: "This is like a ‘commitment device’—some people prefer stability."  
       - Assign lotteries *before* lock-in; those with "bad" lotteries (e.g., C) may risk trading.  
       - If >50% lock in, focus debrief on them: "You avoided the pump—does that mean your preferences are ‘safe’?"  

  2. **Problem**: No one trades (offers feel suspicious).  
     - **Mitigation**:  
       - Start with low-stakes "practice" trades (e.g., "Swap B for A + 10 points?").  
       - Use discreet offers (notes/whispers) to avoid group hesitation.  

  3. **Problem**: Bonuses dominate preferences (students trade solely for points).  
     - **Mitigation**:  
       - Keep bonuses small (5 points = 5¢ at redemption). Emphasize: "The lottery is the main stake!"  

  4. **Problem**: Students see the cycle mid-activity.  
     - **Mitigation**:  
       - If spotted, pivot: "Great! Why did you keep trading? Let’s discuss later." Use it in debrief.  

  ---

  ### **What the Activity Can’t Replicate**  
  Be transparent in the debrief about these limitations:  
  - **Losses don’t feel real**: With tiny stakes, losing a pump cycle feels like "missing gains," not true loss. Real money pumps (e.g., retirement savings) *hurt*.  
  - **Trades feel like bookkeeping**: Students may not internalize that A→C→B→A is a net loss *because* bonuses mask it. In reality, pumps drain resources.  
  - **The escape hatch is artificial**: Real life rarely lets you "lock in." Most choices are sequential, forcing you to confront cycles.  
  - **Preferences might adapt**: In reality, getting pumped once could make you revise preferences (e.g., abandon cycles). Here, preferences are assumed fixed.  

  ---

  ### **Why This Design Works**  
  - **Cycles from competence, not error**: The lotteries exploit prospect theory—people *reasonably* weight probabilities non-linearly.  
  - **Escape hatch forces reflection**: Locked-in students anchor the debrief: "Is avoiding trades a solution, or an admission of irrationality?"  
  - **Stealthy pump**: By making trades sporadic, individual, and bonus-aided, students only see the cycle in retrospect.  
  - **Debrief structure**: Questions build from experience ("How do you feel?") to theory ("What does this say about rational agency?").  

  This plan balances psychological realism with pedagogical clarity, ensuring students *feel* the tension between local rationality and global incoherence. Run it as described, and they’ll leave debating transitivity—not feeling tricked.
