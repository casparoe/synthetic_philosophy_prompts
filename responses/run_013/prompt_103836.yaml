prompt: |-
  Alright, I'm putting together a problem set for a first-year philosophy of science unit and I want a ravens case that's actually worth arguing about — not the green-apple / white-shoe thing everyone has seen a hundred times. So here's the ask.

  Build me a thought experiment about Hempel's raven paradox, in two versions. Version 1: a realistic scene (a workplace, a museum store-room, an aviary, whatever — no trolleys, no demons, no sci-fi) in which a single observation of a non-black non-raven genuinely and non-negligibly raises the probability that all ravens are black. Non-negligibly means a reasonable person should actually update, so give me rough numbers, simple enough that I could do them on the back of an envelope. Version 2: keep the physical observation and the hypothesis identical, but change one thing so that the very same observation now does nothing at all for the hypothesis. One paragraph each, and don't recycle the textbook props — pick your own objects.

  Then do the check. State what each of three views says about each version: (a) the plain instantial / Nicod-style criterion, where an instance of "non-black and non-raven" confirms "all non-black things are non-ravens" and hence, by equivalence, confirms "all ravens are black"; (b) a Bayesian who actually writes down the likelihoods and the sampling procedure; (c) a Popperian who thinks none of this confirms anything and only potential falsifiers count. I want the verdict each view gives in each version, not a summary of the literature.

  After that, tell me which single feature of the case is doing the work — name it yourself — and say what happens to both versions if you remove or invert that feature. Then finish with how a Hempelian would try to stop version 2 from being a counterexample, and whether that move works. No citations needed, obviously, just work it out — and the verdicts have to fall out of the setup, not be asserted by fiat, since otherwise the whole case is worthless for a problem set.

  Format it like this: "Version 1" (one paragraph), "Version 2" (one paragraph, ending with the one feature you changed), "The verdicts" (three short subsections, ~100 words each), "What's doing the work" (a short paragraph), "Pull the lever" (a few sentences), "How the Hempelian fights back" (a few sentences).
