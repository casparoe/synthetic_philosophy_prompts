answer: |-
  ### Version 1: The Museum Inventory  
  You're auditing an eclectic natural history museum's storage warehouse. The collection contains 1,000 objects: taxidermied birds, geological specimens, pottery, and artifacts. You hypothesize *H*: "All ravens in this collection are black." Initially, you estimate *P(H)* = 0.7. Objects are examined systematically via a randomized inventory audit. The first item checked is a **white porcelain vase**. Before this observation, you believed ~5% of objects were ravens and ~10% were non-black. Finding this non-black (*~B*) non-raven (*~R*) slightly increases *P(H)*. Why? In a random sample, observing *~B* reduces the pool of *potential counterexamples* (non-black ravens). With 1,000 objects, 5 expected ravens, and 100 expected non-black items, Bayes' theorem shows *P(H|~B ∧ ~R)* ≈ **0.704** – a small but non-negligible update.  

  ### Version 2: The Targeted Bird Survey  
  Same museum, same *H*: "All ravens in this collection are black," same *P(H)* = 0.7. But now, you deliberately examine *only items already identified as non-black* (e.g., a pre-sorted pile of white/grey/red objects). The first item you inspect is again a **white porcelain vase**. Here, observing *~B ∧ ~R* provides *no information* about *H*. Since you sampled *exclusively* from non-black items, finding a non-raven was guaranteed (ravens, if present, would be black per *H* and excluded from sampling). The likelihood *P(Observation|H)* = *P(Observation|¬H)* = 1. Thus, *P(H)* **remains 0.7**. The changed feature is the **sampling procedure**: targeted vs. random.  

  ---

  ### The Verdicts  

  **(a) Nicod Criterion**  
  *   **Version 1:** Confirms *H*. The white vase is an instance of "non-black non-raven," which directly confirms the logically equivalent contrapositive "All non-black things are non-ravens."  
  *   **Version 2:** Confirms *H*. Same reasoning – the vase remains an instance of the contrapositive, so confirmation occurs identically.  

  **(b) Bayesian (with Likelihoods)**  
  *   **Version 1:** Confirms *H* non-negligibly. *P(~B ∧ ~R | H)* is high (most things aren’t ravens), but *P(~B ∧ ~R | ¬H)* is slightly higher (if ¬H, there’s at least one non-black raven, making non-black non-ravens marginally *less* prevalent). The likelihood ratio *P(E|H)/P(E|¬H) > 1*, raising *P(H)*.  
  *   **Version 2:** **No confirmation.** *P(E|H) = P(E|¬H) = 1* (under both *H* and ¬H, sampling *only non-black items* ensures you see a non-raven). Likelihood ratio = 1, so no update.  

  **(c) Popperian Falsificationism**  
  *   **Version 1:** No confirmation. Only observing a non-black raven would falsify *H*. The white vase is irrelevant.  
  *   **Version 2:** No confirmation. Same reason – the vase doesn’t test *H*; only a non-black raven would.  

  ---

  ### What’s Doing the Work  
  The **sampling protocol** drives the difference. In Version 1, random sampling makes the observation *informative* about the population’s composition. In Version 2, restricted sampling (*only* non-black items) makes the observation *inevitable* and thus uninformative about ravens.  

  ---

  ### Pull the Lever  
  If you remove/make identical the sampling protocol (e.g., force both versions to use random sampling), Version 2 vanishes: both scenarios confirm identically. If you invert the protocol (e.g., sample *only ravens* in Version 1), the white vase could never be observed, breaking the case.  

  ---

  ### How the Hempelian Fights Back  
  A Hempelian would argue Version 2 isn’t a "fair test" of *H* because the sampling procedure **logically excludes observing any raven** (since ravens, if black, wouldn’t be in the non-black pile). Thus, the observation "white vase" isn’t a genuine test of the contrapositive "All non-black things are non-ravens" – it’s a tautological consequence of the sampling method. This move works only if we accept that confirmation requires the *possibility* of encountering a counterexample; here, that possibility was artificially eliminated. It rescues the equivalence intuition but concedes that methodological context matters.  

  ---  
  *Design Note: The museum context avoids clichés while enabling controlled population assumptions. Numbers are simplified but mathematically consistent: e.g., in Version 1, prior P(H)=0.7, P(¬H)=0.3. Assume 50 ravens (expected) under ¬H, one non-black. Then P(E|H) = P(~R|~B) × P(~B) ≈ (990/1000) × 0.1 = 0.099. P(E|¬H) = [989 non-ravens / 100 non-black items] × P(~B) ≈ (989/1000) × 0.1 ≈ 0.0989. Likelihood ratio ≈ 0.099/0.0989 ≈ 1.001, yielding posterior P(H|E) ≈ (0.7 × 0.099) / [(0.7×0.099) + (0.3×0.0989)] ≈ 0.704.*
