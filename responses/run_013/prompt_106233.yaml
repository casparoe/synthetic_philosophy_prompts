prompt: |-
  I'm putting together a reading-group session on hindsight bias and the narrative fallacy, and I want to do Ian McEwan's Atonement. The thing I keep circling is that Briony's whole catastrophe comes from doing what historians and detectives do: she takes a couple of ambiguous moments (the fountain, the letter she shouldn't have read) and retro-fits them into a story with a culprit and a motive, and once the story's set every later detail just confirms it. So I'd like a reading of the novel as a study in hindsight bias and the narrative fallacy. Some things I want you to press on. Is Briony's mistake really hindsight bias, or is it the narrative fallacy, i.e. imposing causal shape on noise, and does the novel treat those as one failure or two different ones? The ending, where the reunion we've been reading turns out to be her invention, seems to push it further: if the whole account is a retrospective construction, whats left of the line between remembering and making up? And a meta angle I want taken seriously: the detective story is basically a machine built to run hindsight in reverse, since the reader is meant to feel at the end that the clues were always pointing there, and Briony is a would-be novelist who thinks in exactly that genre. Does McEwan use the mystery structure to indict that hindsight, or does he end up reproducing it? Where does the novel resist the reading, is there anything in it hindsight bias cant explain? And finish by telling me what the novel adds to the philosophical discussion that a paper on the topic wouldn't, because I dont want the group leaving with just "confirmation bias is bad."

  After the reading, give me a short structured summary as a JSON object with these fields: "scenes_used" (the scenes you lean on most), "hindsight_or_narrative" (one-sentence verdict on which failure it is), "where_novel_resists" (the strongest thing in the book that your reading can't absorb), "genre_verdict" (does it indict or reproduce the detective story's hindsight, with reason), and "what_it_adds" (the one thing fiction does here that argument alone can't). Keep the prose part to roughly 600-800 words and the JSON tight.
