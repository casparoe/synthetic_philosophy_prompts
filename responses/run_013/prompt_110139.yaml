  The core tension they've built is fascinating: can you have ontological realism about species taxa while being anti-realist about the species category? That third premise ("single correct inventory") is doing heavy lifting. I recall Waters' work on experimental realism might be relevant here - the idea that we're tracking real causal lineages even when our categories are messy. 

