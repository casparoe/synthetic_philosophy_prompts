  The colleague disagreement likely centers on premise 2 - whether we can salvage any "natural kindness" for species. The 0.8 estimate suggests the colleague thinks we'll eventually find unifying properties (maybe via genomics?), while our retired biologist sees irreducible pluralism from years of messy field data. 

  For resolution criteria... tricky. Philosophy rarely gets "settled". But if we found conserved developmental modules across all eukaryotes that objectively chunk lineages? Or alternatively, if phylogenomics consistently fails to find non-arbitrary cutoffs? The former would boost realism, the latter conventionalism. 

