prompt: |-
  You are a political philosopher who works on property theory, the philosophy of law, and urban politics. Think carefully and systematically before answering, and do not settle for the first framing that comes to mind. I want you to reconstruct the implicit theory behind a set of land-use practices, so I will describe what my city actually does.

  First, the large majority of residentially zoned land is reserved for detached single-family houses; apartments are permitted only along a few corridors and in a few designated centers. Second, a project that satisfies every numerical standard in the code can still be denied by the planning commission, which is required to consider whether the proposal is compatible with the scale and character of the surrounding neighborhood; the commission's judgment on that question is treated as discretionary rather than as a finding of fact. Third, new buildings must supply a minimum number of off-street parking spaces. Fourth, and this is the part I cannot square with the rest: a use that was lawful when it was built but that the code no longer permits — a corner store, a small apartment building, a workshop — may be forced to close or convert after a set period, sometimes ten or twenty years, although its owner has done nothing wrong and the use harms no one. Meanwhile the expectations of the people living nearby — quiet, being able to park on their own street, living among buildings that look like the ones already there — are treated as weighty enough to justify refusing a permit outright, and nothing ever expires those expectations.

  Please address the following.

  1. What conception of property does this package presuppose — a bundle of severable rights, a thing owned, a grant from a political community, a relation among persons? What conception of the city, and of who has standing to shape it? Does it presuppose something like the claim, associated with Henri Lefebvre, that inhabitants have a right to the city, or does it presuppose the opposite: that the city is a joint venture whose terms are fixed by those who arrived first?

  2. Separate what the practices strictly require from what they merely fit comfortably. Could a Lockean, a utilitarian, a republican about non-domination, and a Lefebvrian each endorse this package, or must each reject some part of it? Where are the practices philosophically underdetermined, such that several incompatible theories would license them?

  3. The asymmetry between uses that expire and neighborhood expectations that never do: is it coherent? Is there a principled distinction available — harm versus mere displeasure, reliance, consent, the generality of the rule, the difference between a use and an expectation, the difference between what one owns and what one merely benefits from? Or is this a hierarchy of political power wearing the costume of doctrine?

  4. If the presupposed view were replaced by a rival, what would change on the ground? Name what a planner would stop doing and what she would start doing.

  Open with a brief brainstorming section listing the candidate theories and flagging which you expect to survive scrutiny, then write the analysis itself in continuous prose.
reasoning: |-
  Okay, the user is asking me to analyze a set of land-use practices from their city through the lens of political philosophy. They've described four key practices: residential zoning dominated by single-family homes, discretionary review by planning commissions, mandatory parking minimums, and nonconforming use expiration. They want me to reconstruct the implicit property theory behind these practices and answer four specific questions about conceptual coherence and alternatives.

  First I need to understand what's distinctive about this package. The single-family zoning dominance suggests exclusionary intent - preserving neighborhood "character" often means maintaining socio-economic homogeneity. The discretionary review is interesting because it elevates subjective judgments about "compatibility" over objective standards. Parking mandates clearly prioritize automobile culture. But the nonconforming use expiration is the real puzzle - it creates temporal injustice where existing lawful uses get phased out despite causing no harm.

  For question 1 about property conceptions, this system clearly treats property as a bundle of privileges granted by the community rather than inherent rights. The emphasis on neighborhood character and the ability to veto new development based on subjective compatibility tests points to a "first-comer" advantage - early residents effectively get to set permanent terms. This directly contradicts Lefebvre's right to the city which would prioritize use value and inhabitant rights over exchange value and owner privileges.

  On question 2 about philosophical compatibility, I see fundamental tensions. A Lockean might accept single-family zoning as protecting labor-mixed land but would reject nonconforming use expiration as violating property rights. Utilitarians could justify parking minimums if they reduce congestion externalities but would balk at discretionary denials that block housing supply. Republican non-domination theory would condemn the power imbalance in discretionary reviews. Only exclusionary communitarianism consistently supports all four practices.

  The expiration asymmetry in question 3 seems philosophically indefensible. The distinction between "vested rights" of existing homeowners versus "expiring privileges" of nonconforming uses reveals raw power dynamics dressed as doctrine. Homeowners' expectations about parking and quiet get perpetual protection while corner stores lose lawful status over time - this privileges certain lifestyles through temporal hierarchy.

  For question 4 on alternatives, shifting to a Lefebvrian or utilitarian framework would change everything. Planners would stop downzoning neighborhoods and start allowing missing middle housing. Discretionary reviews would give way to as-of-right approvals when standards are met. Parking mandates would disappear, replaced by demand-based pricing. Nonconforming uses would gain permanent protection unless causing genuine harm. Essentially, the entire exclusionary apparatus would unravel in favor of equitable access and adaptability.

  The underlying conflict here is between property as exclusion and property as livelihood. Current practices sanctify homeowners' aesthetic preferences while treating commercial and multifamily uses as revocable concessions. A just system would either universalize permanence (all lawful uses protected) or universalize temporality (all development rights subject to revision) rather than this arbitrary hierarchy.
answer: |-
  ### Brainstorming
  **Candidate Theories:**  
  - **Lockean Labor Theory:** Property as natural right from labor-mixing; may conflict with nonconforming use expiration.  
  - **Utilitarianism:** Maximizing aggregate welfare; could justify parking/stability but reject discretionary denials blocking housing.  
  - **Republican Non-Domination:** Freedom from arbitrary power; opposes discretionary vetoes and nonconforming use termination.  
  - **Lefebvrian "Right to the City":** Inhabitants’ collective right to shape urban space; condemns exclusionary zoning and nonconforming use sunsetting.  
  - **Exclusionary Communitarianism:** "First settlers" define community character; aligns with all practices but philosophically fragile.  
  - **Legal Positivism:** Property as state-created bundle of rights; fits zoning but not moral asymmetry.  

  **Expected Survivors:**  
  Only *Exclusionary Communitarianism* fully endorses all practices. Others reject key elements (especially nonconforming use expiration and discretionary vetoes).  

  ---

  ### Analysis  

  #### 1. **Implicit Conception of Property and the City**  
  This framework presupposes property as a **state-granted bundle of privileges**, not inherent rights or relations. The zoning code defines permissible uses, parking mandates socialize costs of auto-centricity, and nonconforming use expiration reveals that "rights" are temporally contingent political grants. The city is conceived as a **static community of incumbent homeowners**, where "character" (aesthetic homogeneity, low density, parking convenience) is sacralized. Standing belongs overwhelmingly to **existing single-family residents**, whose expectations are perpetual. Newcomers, renters, and non-residential users have diminished claims.  

  This directly opposes Lefebvre’s "right to the city," which demands that *all* inhabitants democratically produce urban space. Instead, it enforces a **first-comer sovereignty**: early arrivals freeze the neighborhood’s physical and social template, excluding later claims to diversify use or form. The discretionary review process codifies this hierarchy, treating incumbents’ preferences as quasi-constitutional.  

  #### 2. **Philosophical Compatibility and Underdetermination**  
  - **Lockean:** Rejects nonconforming use expiration (violates "mixing labor" permanence) and discretionary denials (arbitrary state overreach). Accepts single-family zoning only if owners voluntarily covenant.  
  - **Utilitarian:** Might accept parking minimums (reducing congestion externalities) but rejects apartment bans (reducing housing supply harms aggregate welfare) and nonconforming use expiration (destroys functional assets without benefit). Discretionary denials lack cost-benefit justification.  
  - **Republican Non-Domination:** Opposes discretionary vetoes (empowers officials arbitrarily) and nonconforming use termination (subjects owners to others’ whims). Parking mandates could be neutral if democratically set.  
  - **Lefebvrian:** Condemns entire package: single-family zoning excludes non-owners, discretionary review privileges incumbents, nonconforming use expiration dispossesses marginalized users.  

  **Underdetermined Elements:**  
  - Parking minimums *could* be justified by utilitarians (if congestion costs outweigh) or positivists (if legally enacted).  
  - Single-family zoning *might* align with Lockeanism in a homogenous community covenant, but not as city-wide imposition.  
  - Discretionary review’s "neighborhood character" standard is so vague that communitarians, positivists, or even utilitarians (if valuing stability) could stretch to endorse it.  

  Only **exclusionary communitarianism** consistently supports all: it holds that stability, aesthetic unity, and incumbents’ reliance interests outweigh dynamic access or efficiency.  

  #### 3. **The Asymmetry: Expiring Uses vs. Permanent Expectations**  
  This asymmetry is **doctrinally incoherent but politically functional**. No principled distinction survives scrutiny:  
  - **Harm vs. Displeasure?** Losing a corner store harms residents’ access to goods; a new apartment’s "scale" displeases incumbents.  
  - **Reliance?** Both store owners (investing capital) and homeowners (buying into "character") rely on existing conditions.  
  - **Consent?** Neither party consented to future rule changes.  
  - **Generality?** Rules bind all equally *prospectively*, but expiration *retroactively* penalizes specific users.  

  The asymmetry exists because **incumbent homeowners wield political power** to sanctify their preferences as "character," while nonconforming uses (often serving renters or lower-income groups) lack influence. "Expectations" are eternalized not by logic but by the coalition that controls planning commissions. This is hierarchy masquerading as doctrine: the right to exclude is reserved for homeowners, while others hold contingent privileges.  

  #### 4. **Replacing the Presupposed View: Alternative Practices**  
  If replaced by a **Lefebvrian or utilitarian framework**, planners would:  
  - **Stop:**  
    - Downzoning neighborhoods to single-family-only.  
    - Denying compliant projects via discretionary "character" reviews.  
    - Imposing parking minimums (replace with demand-based pricing).  
    - Sunsetting nonconforming uses without proven harm.  
  - **Start:**  
    - Upzoning residential corridors for mixed-use/mid-density *as-of-right*.  
    - Codifying objective design standards (replacing subjective "compatibility").  
    - Grandfathering nonconforming uses permanently unless nuisance is proven.  
    - Prioritizing transit-oriented development over parking supply.  

  A **republican** shift would add: binding community planning assemblies to reduce arbitrary power. A **Lockean** turn would emphasize compensating owners for regulatory takings (e.g., when nonconforming uses expire). Crucially, all rivals would dismantle the first-comer veto, treating the city as a dynamic collective project rather than a museum of incumbents’ preferences.  

  ---

  ### Conclusion  
  This land-use regime embodies **properization of exclusion**: property is reduced to a tool for preserving geographic privilege. Its coherence depends entirely on privileging early arrivals’ subjective expectations over later arrivals’ needs, commercial vitality, and housing justice. Philosophically, only an exclusionary communitarianism that equates "community" with current homeowners can endorse it—but this view collapses under scrutiny, as it confuses possession with sovereignty and mistrust with rights. Replacing it requires centering urban space as a common resource, not a collage of frozen fiefdoms.
