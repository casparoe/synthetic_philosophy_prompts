answer: |-
  ### Exam Question: Allais Paradox and Independence Axiom (25 marks)

  **Context:**  
  The Allais paradox reveals a common violation of expected utility theory (EUT). Below are two versions of lottery pairs. The **Standard Pair** uses conventional payoffs, while the **Variant Pair** modifies the first choice to include a risky common branch.  
  - **Problem 1**: £1M for certain.  
  - **Problem 2**: 89% chance of £1M, 10% chance of £5M, 1% chance of £0.  
  - **Problem 3**: 11% chance of £1M, 89% chance of £0.  
  - **Problem 4**: 10% chance of £5M, 90% chance of £0.  
  - **Problem 1\***: 89% chance of a lottery paying £1M or £0 (each 50%), plus 11% chance of £1M.  
  - **Problem 2\***: 89% chance of the same £1M/£0 lottery (50:50), plus 11% chance of a lottery paying £5M (10/11) or £0 (1/11).  

  **Tasks:**  
  1. **(a)** State the independence axiom of EUT precisely.  
     **(b)** Using **either** the Standard Pair (Problems 1–4) **or** the Variant Pair (Problems 1\*, 2\*, 3, 4), prove formally that independence forces a consistent choice pattern: if an agent prefers Option A in the first choice (e.g., 1 over 2, or 1\* over 2\*), they must prefer Option C in the second choice (3 over 4). (12 marks)  
  2. The standard diagnosis attributes the Allais pattern (choosing 1 > 2 and 4 > 3) to a "certainty effect." Assess whether this diagnosis survives the Variant Pair, where no option is certain and the common branch is risky. What does the variant isolate as the true driver of the violation? (6 marks)  
  3. Can an agent who chooses 1\* > 2\* and 4 > 3 in the Variant Pair be represented by a coherent preference model that rationalises this pattern as rational? Or does any such model merely relabel the violation of independence? Justify your answer. (7 marks)  

  ---

  ### Model Answer (≈700 words)  

  #### 1. Independence Axiom and Its Implications  
  **(a)** The independence axiom states that if lottery \(L \succeq M\), then for any lottery \(N\) and probability \(p \in (0,1)\), the compound lottery \(pL + (1-p)N \succeq pM + (1-p)N\). Preferences should be unaffected by identical "irrelevant" outcomes.  

  **(b)** **Proof using Variant Pair (Problems 1\*, 2\*, 3, 4):**  
  - Problems 1\* and 2\* share an identical 89% branch: a lottery \(N\) paying £1M or £0 with equal probability.  
  - They differ *only* in the 11% residual branch:  
    - 1\*: 11% chance of £1M (i.e., degenerate lottery \(A\))  
    - 2\*: 11% chance of a lottery \(B\) paying £5M (prob. 10/11) or £0 (prob. 1/11).  
  - Thus, 1\* ≡ \(0.89N + 0.11A\) and 2\* ≡ \(0.89N + 0.11B\).  
  - Problems 3 and 4 are *identical* to the residual lotteries:  
    - 3 ≡ \(A\) (11% £1M, 89% £0)  
    - 4 ≡ \(B\) (10% £5M, 90% £0).  
  - By independence, if \(A \succ B\) (i.e., 3 ≻ 4), then \(0.89N + 0.11A \succ 0.89N + 0.11B\) (i.e., 1\* ≻ 2\*). Conversely, if \(B \succ A\) (4 ≻ 3), then 2\* ≻ 1\*. Thus, choices must agree: preferring 1\* > 2\* requires 3 > 4, and vice versa.  
  *(Identical logic applies to the Standard Pair, where the "common branch" is the 89% chance of £1M in Problems 1/2, and the residual is the same 11% lotteries as in 3/4.)*  

  #### 2. Certainty Effect in the Variant Pair  
  The standard diagnosis posits that the Allais pattern (1 > 2 and 4 > 3) arises from overweighting certainty. However, this fails in the Variant Pair:  
  - **No certainty**: In 1\* vs. 2\*, *neither* option guarantees £1M. The "safe" option (1\*) includes a 44.5% chance of £0 (from the 89% branch).  
  - **Isolates distortion of common outcomes**: The variant shows the violation persists even when certainty is absent. What drives the paradox is not certainty *per se*, but the *distortion of probabilities* for outcomes shared across options (here, the 89% \(N\) branch). Agents evaluate residuals (\(A\) vs. \(B\)) differently when embedded in a larger lottery versus in isolation, violating linearity in probabilities. The variant thus isolates a *failure to ignore common consequences*—a core implication of independence.  

  #### 3. Coherence of Preference Representation  
  An agent choosing 1\* > 2\* and 4 > 3 (i.e., \(A \prec B\) but \(0.89N + 0.11A \succ 0.89N + 0.11B\)) **cannot** have coherent preferences satisfying the independence axiom. However, non-EU models (e.g., **rank-dependent utility**, RDU) may "rationalise" this:  
  - **RDU explanation**: RDU weights probabilities non-linearly (e.g., overweighting tails). In the variant, the 89% branch (\(N\)) has identical outcomes (£1M/£0) in both 1\* and 2\*, so decision weights for this branch cancel out. The choice reduces to comparing \(A\) vs. \(B\) under the same probability weighting—yet the agent reverses preference, contradicting RDU’s internality.  
  - **Relabeling, not resolving**: Such models accommodate the violation by replacing independence with alternate axioms (e.g., comonotonic independence in RDU). However, they do not make the pattern "rational"; they describe the *descriptive* heuristic (probability distortion) causing the violation. The agent still evaluates identical residuals inconsistently, violating dominance in the space of consequences. No representation can reconcile this with coherent preferences under uncertainty—it remains a logical inconsistency, not a rational trade-off.  

  **Conclusion**: The variant proves the Allais paradox stems from misweighting common consequences, not certainty. While non-EU models describe this behaviour, they do not justify it as rational; they systematise the axiom violation.  

  ---

  ### Marking Scheme (25 marks total)  

  #### Part 1(a): State independence axiom (3 marks)  
  - **3 marks**: Precise statement (e.g., \(L \succeq M \implies pL + (1-p)N \succeq pM + (1-p)N\)).  
  - **1 mark**: Informal/imprecise (e.g., "irrelevant alternatives don’t matter").  
  - **0 marks**: Incorrect/missing.  

  #### Part 1(b): Prove choice consistency (9 marks)  
  - **3 marks**: Identifies shared branch (e.g., 89% \(N\) in variant).  
  - **3 marks**: Shows residuals match Problems 3/4 (\(A\) vs. \(B\)).  
  - **3 marks**: Correct application of independence to force agreement.  
  - **−2 if**: Uses certainty incorrectly in variant.  
  - **0 if**: Fails to decompose lotteries.  

  #### Part 2: Certainty effect and variant’s insight (6 marks)  
  - **2 marks**: Notes no certainty in variant.  
  - **2 marks**: Explains why standard diagnosis fails.  
  - **2 marks**: Identifies distortion of common outcomes as true driver.  
  - **−2 if**: Claims certainty effect still applies to variant.  

  #### Part 3: Coherence of representation (7 marks)  
  - **3 marks**: States violation cannot be EU-coherent.  
  - **2 marks**: Names a non-EU model (e.g., RDU, prospect theory) and its mechanism.  
  - **2 marks**: Concludes models relabel but do not resolve the violation.  
  - **−3 if**: Suggests non-EU models make choices "rational" without critique.  
  - **0 if**: Invokes non-EU model without specifying how it handles the variant.  

  #### Penalties (apply across all parts)  
  - **−4 if**: Treats pattern as mere risk aversion.  
  - **−3 if**: Recites Allais paradox without engaging variant.  
  - **−2 if**: Uses non-EU model without stating denied axiom/prediction for variant.  

  **First-class benchmark (70%+)** requires:  
  - Correct decomposition of variant lotteries.  
  - Explicit contrast between standard/variant to refute certainty effect.  
  - Acknowledgement that non-EU models describe but do not justify the violation.
