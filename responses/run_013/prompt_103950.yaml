prompt: |-
  I teach a seminar on the philosophy of criminal law, and this term's unit on consent has produced a running argument among the students that I would like to hand to you. One group has settled on the idea that consent is better modeled on a conversation than on a contract: it is continuous rather than punctual, negotiated and repaired turn by turn rather than agreed once and sealed, and undone by the wrong kind of responsiveness rather than by a defective signature. They use this to argue that our institution's affirmative-consent policy, which asks for a discrete verbal yes at the outset, is both under- and over-inclusive, and that the real question in a contested case is whether the encounter was conversational. A smaller faction, led by a student who spent two years in a commercial litigation practice, insists that consent simply is contractual: there is an offer and an acceptance, there are parties whose capacity is a threshold matter, and there are the familiar vitiating conditions -- duress, misrepresentation, unconscionability -- which is exactly why the three questions that occupy our syllabus are coercion, deception, and competence. On his view the conversation model is worse than useless, because a conversation has no moment at which one becomes entitled to proceed, and a standard with no moment of entitlement gives no guidance to anyone who wants to act permissibly.

  What I want from you is an audit rather than a verdict between two slogans. Set out the correspondence explicitly for both models -- what plays the role of offer, acceptance, terms, the moment of formation, breach and remedy, and the vitiating conditions -- and then tell me where each breaks down, distinguishing the breaks that matter for the uses these two students are putting the models to from the ones that are merely picturesque. I am especially interested in three pressure points. First, whether the contractual baseline for duress can survive contact with intimate relationships, where the entitlements that would fix a baseline are precisely what is in dispute. Second, whether contract law's default of no duty to disclose, and the line it draws between fraud and mere non-disclosure, is the right line for deception about one's intentions, one's fertility or health status, or the nature of the act. Third, whether capacity, on either model, is a threshold or a gradient, given that the same person may be competent to agree to some things and not others, and at some moments and not others. Then tell me what survives: which model, suitably repaired, should govern how a campus disciplinary office and a prosecutor should think about consent, and whether some third analogy -- consent as a revocable license, as an invitation, as an ongoing permission rather than a transfer of something -- does better than either. Take a definite position on that; do not lay out the options and leave the choice to me.

  Please organize the answer in the following sections, in this order: "The two models as my students use them" (~150 words); "Correspondence table" (a single table giving the mappings for both models side by side); "Where the contract model breaks" (~350 words); "Where the conversation model breaks" (~350 words); "The three pressure points: duress, disclosure, capacity" (~500 words); and "Verdict and a better picture" (~300 words).
reasoning: |-
  Okay, the user is a philosophy professor teaching a seminar on criminal law, specifically focusing on consent. They've presented a debate among students: one group views consent as conversational (continuous, negotiated), while another, influenced by commercial litigation, sees it as contractual (offer-acceptance, vitiating conditions). The professor wants an audit, not a verdict, mapping both models, identifying breakdowns, and addressing three pressure points—duress in relationships, disclosure norms, and capacity as a threshold vs. gradient. They also want a definite recommendation for institutional policies.  

  First, I need to unpack how each model is framed by the students. The contract model treats consent as a discrete transaction with clear moments and legalistic vitiators (duress, fraud). The conversation model emphasizes ongoing mutual responsiveness, where consent is fluid and context-dependent. The professor’s key concerns are practical: how campus disciplinary boards and prosecutors should approach consent, especially given the limitations of both models in real-world intimacy.  

  For the correspondence table, I’ll map elements like offer/acceptance to conversational equivalents (e.g., initiation/response). The breakdown sections will critique each model’s flaws—contract’s rigidity in intimate dynamics versus conversation’s vagueness for permissible action. The pressure points are where real tensions lie:  
  - **Duress**: Contracts rely on a baseline of entitlements, but intimate relationships often lack clear baselines (e.g., is emotional pressure coercive?).  
  - **Disclosure**: Contract’s "no duty to disclose" clashes with expectations in sexual contexts (e.g., lying about STIs or intentions).  
  - **Capacity**: Both models struggle with gradience—people may consent to some acts but not others, or fluctuate in competence.  

  Finally, I’ll argue for a hybrid: consent as a revocable license. This borrows from property law, framing consent as ongoing permission that can be withdrawn instantly, with affirmative renewal for escalation. It addresses the "moment of entitlement" gap in conversations while avoiding contract’s transactional pitfalls. For institutions, this means prioritizing ongoing mutual affirmation—yes-means-yes, not just no-means-no.  

  The professor’s unspoken need? Moving beyond academic debate to actionable guidance that reflects intimacy’s complexities. They’d reject vague compromises, so I’ll take a firm stance: the license model, supplemented by context-sensitive disclosure duties and sliding-scale capacity assessments.
answer: |-
  ### The two models as my students use them  
  The **contract model** treats consent as a discrete, legally cognizable transaction. An "offer" (initiation) meets "acceptance" (affirmative yes), forming binding "terms" (scope of permitted acts). Vitiating conditions (coercion, deception, incompetence) void consent. Consent is breached if acts exceed the agreed terms, with remedies (criminal/civil penalties). The **conversation model** frames consent as a continuous, collaborative process. "Initiation" and "responsive attunement" replace offer/acceptance; "mutual understanding" replaces terms; "withdrawal of engagement" voids consent. Breach occurs through non-reciprocal escalation or disregard of cues; "repair" (apology/accountability) is the remedy. The contract model prioritizes a clear "moment of entitlement"; the conversation model prioritizes ongoing reciprocal responsiveness.  

  ### Correspondence Table  
  | **Contract Element**       | **Contract Model Analogy**         | **Conversation Model Analogy**       |  
  |----------------------------|-----------------------------------|--------------------------------------|  
  | Offer                      | Initiation of sexual act          | Opening move (verbal/nonverbal cue) |  
  | Acceptance                 | Affirmative "yes"                 | Reciprocal, engaged response         |  
  | Terms                      | Scope of agreed acts              | Mutually understood boundaries       |  
  | Moment of Formation        | Point of agreement ("yes")        | Emergent mutual attunement           |  
  | Breach                     | Acting beyond agreed terms        | Non-reciprocal escalation, ignoring cues |  
  | Remedy                     | Punishment/damages                | Repair (apology, accountability)     |  
  | Vitiating Conditions       | Duress, fraud, incapacity         | Coercive pressure, deception, impaired attunement |  
  | Baseline Entitlements      | Pre-existing rights (e.g., bodily autonomy) | Contextual relational norms          |  

  ### Where the contract model breaks (~350 words)  
  The contract model fractures critically in intimate contexts due to **temporal rigidity** and **relational blindness**. Its demand for a discrete "moment of formation" is ill-suited to evolving sexual encounters, where boundaries may shift incrementally (e.g., kissing → touching). Treating consent as a one-time signature ignores withdrawal during acts—a fatal flaw when "no" mid-act is disregarded. Its **threshold approach to vitiators** falters with intimacy-specific coercion: emotional manipulation ("If you loved me...") or relational power imbalances (partnered coercion) lack clear "duress" baselines, as entitlements (e.g., expectation of fidelity) are contested. Similarly, **non-disclosure rules** create perverse incentives: withholding STI status or fertility aligns with contract’s "no duty to disclose" but violates sexual ethics. Most damagingly, the model’s "entitlement moment" **misguides permissible action**: once "acceptance" is given, actors may assume blanket permission, neglecting ongoing mutuality. This incentivizes minimal compliance ("getting the yes") rather than ethical engagement. While picturesque flaws exist (e.g., no "consideration" in sex), the core breakdown is **prioritizing legal form over relational dynamics**, rendering it over-inclusive (excusing pressure within "terms") and under-inclusive (invalidating consensual-but-unspoken intimacy).  

  ### Where the conversation model breaks (~350 words)  
  The conversation model collapses under **normative vagueness** and **guidance failure**. Its core strength—continuous attunement—becomes a liability when asked to define *when acts are permissible*. Without a "moment of entitlement," it offers no clear standard for initiating or escalating acts, leaving well-intentioned actors adrift ("Was that sigh a green light?"). This ambiguity is catastrophic for **institutional adjudication**: campus boards and prosecutors require definable breaches, but "non-reciprocal responsiveness" is highly interpretative, risking arbitrary outcomes. The model also **overextends repair**. While valuable for relationships, "conversational repair" is inadequate for sexual violation; criminal law demands accountability beyond dialogue. Its rejection of discrete affirmation becomes **practically over-inclusive**, potentially pathologizing awkward but consensual encounters where explicit verbal negotiation feels unnatural. Conversely, it risks **under-including coercion** when power imbalances (e.g., employer/employee) make "conversation" inherently unfree. The student litigator’s critique hits hardest here: by denying a clear "offer/acceptance" structure, the model fails those seeking ex-ante guidance. While picturesque flaws include ignoring cultural differences in conversational norms, the fatal break is **prioritizing process over permission**, leaving no objective anchor for what constitutes breach in non-idealized contexts (e.g., intoxication muddling cues).  

  ### The three pressure points: duress, disclosure, capacity (~500 words)  
  **Duress/Coercion**:  
  - *Contract*: Requires baseline entitlements (e.g., right to refuse). **Breaks** in intimacy where relational dynamics blur baselines—is emotional pressure "duress" if no threat exists? What is the "baseline" in a marriage with entrenched power imbalances?  
  - *Conversation*: Focuses on reciprocal attunement. **Breaks** when unequal power (boss/employee) makes "free" conversation impossible, or when coercion is subtle (guilt-tripping).  
  - **Resolution**: Neither model fully captures relational coercion. A hybrid must recognize *contextual vulnerability* (e.g., dependency) as vitiating, rejecting contract’s rigid baseline.  

  **Disclosure/Deception**:  
  - *Contract*: Permits non-disclosure absent fiduciary duty. **Breaks** catastrophically in sex: lying about condom use, STIs, or intent (e.g., "monogamous" cheater) is often predatory but escapes "fraud" under contract’s narrow "material term" standard.  
  - *Conversation*: Demands authentic engagement; deception violates attunement. **Breaks** by lacking specificity—what *must* be disclosed? Fertility? Past partners?  
  - **Resolution**: Contract’s disclosure rules are morally bankrupt here. A sexual consent model must impose *contextual disclosure duties*: material facts affecting sexual autonomy (health risks, reproductive consequences, fundamental deceit about identity/act).  

  **Capacity**:  
  - *Contract*: Binary threshold (competent/incompetent). **Breaks** with fluctuating states (intoxication, mental health) and scalar competence (able to consent to kissing but not intercourse).  
  - *Conversation*: Gradient capacity via attunement (e.g., responsiveness). **Breaks** by assuming impaired capacity always manifests as disrupted dialogue; severe intoxication may *prevent* meaningful conversation but not gestures mistaken as consent.  
  - **Resolution**: Capacity must be **act-specific and scalar**. Both models err in treating it monolithically. Consent validity should require *functional understanding* of the specific act’s nature/consequences at that moment, assessed dynamically.  

  ### Verdict and a better picture (~300 words)  
  **Verdict**: Both models fail as standalone frameworks. The contract model is morally inadequate for intimacy; the conversation model is institutionally unworkable. **Adopt consent as a revocable license**, blending key insights:  

  1. **License Structure**: Consent permits temporary access to bodily autonomy (like property licenses). It is:  
     - **Revocable Instantly**: No justification needed (rejects contract’s "binding" terms).  
     - **Purpose-Limited**: Scope defined by ongoing mutual understanding (conversation’s strength).  
     - **Affirmatively Renewable**: Escalation requires new affirmative permission (addresses "moment of entitlement").  

  2. **Pressure Points Resolved**:  
     - *Duress*: Invalid if revocation is inhibited (e.g., pressure to "consent" violates license terms).  
     - *Disclosure*: Licenses imply duties of honesty for material risks (health, reproduction) by default.  
     - *Capacity*: Assessed per act via ability to understand/revoke permission; intoxication reducing comprehension voids license.  

  3. **Institutional Application**:  
     - **Campus/Prosecutors**: Focus on: (a) Initial affirmative agreement (verbal/nonverbal but unambiguous); (b) Ongoing revocability (ignored "no" = breach); (c) Scope compliance (escalation requires renewal).  
     - **Adjudication Key Questions**: Was permission affirmatively granted? Was it revoked or exceeded? Was there fraud on material terms (STIs, contraception sabotage)? Did capacity permit understanding/control?  

  **Why better?** It rejects contract’s false finality while providing clearer guidance than conversation. The license metaphor centers autonomy as the "property" protected, demands affirmative granting (not just absence of "no"), and frames violation as trespass—aligning with criminal law’s harm principles. For policy: Mandate "affirmative, ongoing, reversible" consent, rejecting both punctual contracts and nebulous conversations.
