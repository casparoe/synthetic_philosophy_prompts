prompt: |-
  You're a comparative constitutional law scholar who's also spent real time inside trust & safety teams, so you know the gap between how a doctrine reads in a casebook and how it has to work at 2am in a moderation queue. Take your time with this, and start by brainstorming the actual points of divergence between the US and European traditions — the real ones, not the bumper-sticker version — before you build anything.

  Here's my situation. I run policy at a mid-size social platform, around 40m users, mostly US and EU. Our reviewers are contractors with no legal training. Hate-speech reports come in by the thousand per day, each one has to be triaged in under five minutes, and only the genuinely bad ones come up to me. Right now people are eyeballing it and we're wildly inconsistent. Our GC also keeps pushing a single bright line: if a post would be a crime in Germany, kill it everywhere. I want a procedure instead.

  So: turn the First Amendment approach and the European approach into one triage procedure my reviewers can actually run. Ordered tests, what a yes or no means at each step, where it stops with a removal, where it stops with a keep, and — this matters — where it hands off to a human because what's left is a values question rather than a doctrinal one. The fork between the two traditions needs to be explicit: the US side runs on imminence, true threats, fighting words, viewpoint neutrality; the European side runs on stirring up hatred against protected groups, dignity, and the abuse-of-rights idea where some expression drops out of protection altogether. Which of those distinctions survive contact with a five-minute checklist, which have to be dropped, and what does breaking them cost? Also fix the list of protected characteristics and tell me what to do when a post targets something that isn't on any list — cops, landlords, a political party, sex workers.

  Give me a geography rule too: when do we remove globally, when do we geoblock, and why. Then take the GC's Germany rule and run it through the procedure — tell me straight whether it survives.

  Then run it on three posts:

  - one denying a well-documented atrocity, posted from a country where that denial is criminal but visible to users in one where it isn't;
  - one saying a religious minority should be "cleared out" of a particular neighbourhood, phrased as a wish rather than a plan;
  - one that quotes a slur verbatim while condemning it.

  At least one of these should come out in a way I won't like. I'd rather find that out now than in a hearing. Flag the steps that are judgment calls dressed up as procedure, tell me which ones I should be signing off on personally, and finish with what this procedure can't do — I suspect it can't tell me whether we're supposed to be a marketplace of ideas or a militant democracy, but tell me where that choice actually shows up in the steps.

  No case citations, please, my reviewers can't look them up and I don't want them pretending they did. I want a one-page reviewer-facing version and a longer rationale behind it, and I'd prefer it didn't read like a legal memo — definately keep it plain.
reasoning: |-
  Okay, let me unpack this complex request. The user runs policy for a mid-sized social platform facing real operational challenges: inconsistent hate speech moderation, contractor reviewers with minimal training, and pressure from their GC to adopt Germany's legal standard globally. They need a practical triage procedure that bridges US and EU approaches.

  First, I need to identify the core tensions between the traditions. The US First Amendment framework prioritizes imminent harm, true threats, and viewpoint neutrality, while European conventions emphasize human dignity, group protection, and the abuse-of-rights doctrine. The operational challenge is translating these philosophical differences into a five-minute checklist for non-lawyers.

  Key divergences to operationalize:
  - US requires direct incitement ("imminence"), while EU prohibits broader "stirring hatred"
  - US protects offensive speech unless it crosses into threats/fighting words, EU allows dignity-based restrictions
  - US rejects viewpoint discrimination, EU permits it for protected groups
  - EU uses enumerated protected characteristics, US relies on context-dependent categories

  For the procedure, I'll design a decision tree with clear stopping points. Step 1 handles universal removals (true threats, criminal content), Step 2 applies geography-specific rules, Step 3 addresses "values calls" requiring human judgment. Protected characteristics must include the EU's standard groups plus context-dependent additions like occupation when tied to systemic vulnerability.

  The Germany rule fails because it ignores jurisdictional differences - German law criminalizes certain Holocaust denial that would be protected speech in the US. Global removal based solely on German standards would over-censor. Instead, geoblocking balances legal compliance with speech principles.

  Test cases reveal friction points:
  - Atrocity denial gets geoblocked only where illegal
  - "Cleared out" phrasing likely removed under EU dignity standards but might stay in US without imminent threat
  - Slur quotation stays with contextual warning

  Crucially, Step 3 flags where doctrine ends and platform values begin - like judging whether "cops" constitutes a protected group in context. These decisions require policy lead oversight. The procedure can't resolve the fundamental tension between marketplace of ideas and militant democracy models; that choice surfaces in how aggressively Step 3 is applied to borderline cases threatening democratic foundations.

  The output will avoid legalese, with a one-page reviewer checklist plus rationale highlighting operational trade-offs. Time-permit constraints mean some doctrinal nuances (like precise fighting words tests) get sacrificed for consistency. I'll flag all judgment call points explicitly.
answer: |-
  Here's a triage procedure designed for speed, consistency, and doctrinal bridging, followed by rationale and test cases. The one-page reviewer version is at the end.

  ---

  **Hate Speech Triage Procedure: Reviewer Checklist**

  **Step 1: UNIVERSAL REMOVAL (Immediate Take Down - No Geography Check Needed)**
  *   **Q1: Is this a DIRECT THREAT?** ("I will kill you @username tomorrow" OR "Meet me at X to beat up Y group").  
      *   YES → **REMOVE EVERYWHERE.** Stop.  
      *   NO → Go to Q2.
  *   **Q2: Does it call for IMMEDIATE LAW VIOLENCE?** ("Smash the store NOW!" OR "Attack the protestors tonight!").  
      *   YES → **REMOVE EVERYWHERE.** Stop.  
      *   NO → Go to Q3.
  *   **Q3: Is it UNEQUIVOCAL CRIMINAL HATE SPEECH?** (Blatant advocacy for genocide, severe racial violence, or child exploitation material. *Rare - this is the "Germany Rule" baseline but stricter*).  
      *   YES → **REMOVE EVERYWHERE.** Stop.  
      *   NO → Go to Step 2.

  **Step 2: GEOGRAPHY-DEPENDENT ASSESSMENT (Check Poster & Audience Location)**
  *   **Q4: ATTACK ON PROTECTED GROUP?**  
      *Targets individuals/groups based on:* **Race, Ethnicity, Religion, National Origin, Sex/Gender, Sexual Orientation, Disability, Gender Identity.**  
      *Uses:* **Slurs, Dehumanizing Terms (vermin, cancer), Calls for Exclusion/Segregation, Severe Degradation.**  
      *   YES → Go to Q5.  
      *   NO → **KEEP & Stop.** (*But flag if borderline for Step 3*)
  *   **Q5: EUROPEAN USER OR SIGNIFICANT EU AUDIENCE?** (Poster in EU, OR trending/viral in EU, OR targets specific EU location/group).  
      *   YES → **REMOVE (Geoblock if needed).** Stop. (*Applies EU dignity/hate stirring standard*)  
      *   NO → Go to Q6.
  *   **Q6: US CONTEXT ONLY?** (Poster & primary audience US, no significant EU link).  
      *   YES → **KEEP UNLESS:** It's a *direct threat (Q1)* or *imminent violence call (Q2)* you missed earlier. Stop.  
      *   NO → **GEOTAG CONFLICT?** (e.g., targets group illegal in one jurisdiction but not another) → **GEOMODERATE** (Block *only* in jurisdictions where content violates local law/policy). Stop.

  **Step 3: VALUES CALL / ESCALATION (Judgment Required - Flag to Policy Lead)**
  *   **ESCALATE IF:**  
      1.  Targets **"Gray Area" Groups:** (e.g., *cops, landlords, sex workers, political parties*) **AND** uses severe dehumanization/calls for harm. (*Policy Lead decides if context makes them vulnerable like protected groups*).  
      2.  **Historical Atrocity Denial:** (e.g., Holocaust, Srebrenica) - *Policy Lead decides on geoblocking based on location/context*.  
      3.  **Severe Slur Use - Even Condemned?** (Policy Lead weighs intent vs. harm).  
      4.  **"Wishes" vs. "Plans":** (e.g., "They *should* be cleared out" vs. "Let's clear them out Saturday"). Policy Lead assesses likelihood of incitement/dignity harm.  
      5.  **Ambiguous Imminence:** ("Someone *needs* to deal with them..." - how urgent/actionable?).  
      6.  **Viewpoint Neutrality Borderline:** Does removing this *feel* like silencing an opinion, even an ugly one? (*US concern*).

  ---

  **Rationale, Trade-offs, & GC's Rule**

  1.  **Core Divergences & Operationalization:**  
      *   **US Imminence/True Threats:** Captured in **Q1 & Q2**. Survives contact because "immediate" violence/threats are *operationally* distinct. *Trade-off:* "Fighting words" (face-to-face insults likely to provoke violence) is **DROPPED** - too context-specific for 5-min review. *Cost:* Some genuinely harmful but non-imminent harassment might stay in US context.
      *   **EU Dignity/Hate Stirring:** Captured in **Q4 & Q5**. "Abuse of rights" is operationalized as targeting protected groups with severe dehumanization/calls for exclusion. *Trade-off:* Nuances of "hatred" vs. "hostility" are **DROPPED**. *Cost:* Some speech offensive to dignity might stay outside EU jurisdiction.
      *   **Viewpoint Neutrality:** Explicitly guarded in **Step 3 Escalation Point 6** and **Q6 (Keep in US context)**. Critical to avoid US liability. *Survives contact* by creating a clear "keep" path for non-threatening, non-dehumanizing offensive speech in US context.
      *   **Protected Characteristics:** **Fixed list in Q4** (Race, Ethnicity, Religion, National Origin, Sex/Gender, Sexual Orientation, Disability, Gender Identity). **Gray Areas (cops, landlords, etc.):** Explicitly pushed to **Step 3**. *Rationale:* Core EU/US frameworks focus on immutable/identity-based groups. Targeting occupations/roles requires contextual judgment on vulnerability and systemic harm.

  2.  **Geography Rule:**  
      *   **Remove Globally:** Only for **universal harms (Step 1)** - threats, imminent violence, *extreme* criminal content (genocide advocacy). Protects platform safety/liability globally.
      *   **Geoblock:** Used in **Q6** for content illegal/harmful *only* in specific jurisdictions (e.g., Holocaust denial where illegal). Balances compliance with free expression elsewhere.
      *   **Remove (EU Focus):** **Q5** - Applies EU dignity standard where EU law applies or significant harm is likely. Protects users and complies with DSA/GDPR.
      *   **Keep (US Focus):** **Q6** - Defaults to permissive US standard where no other triggers hit and context is US. Avoids over-removal.

  3.  **GC's "Germany Rule" Tested:**  
      *   **Doesn't Survive.** Step 1 Q3 is *stricter* than German law (only catches *extreme* criminal hate speech globally). Step 2 Q5 applies a *broader* EU dignity standard (not just German criminal law) but *only* to EU-linked content. German law criminalizes some Holocaust denial and group insults that wouldn't be removed globally under this procedure (only geoblocked/removed in EU). The GC's rule is overbroad for global removal and under-protective within the EU compared to DSA obligations.

  4.  **Test Cases:**
      *   **Atrocity Denial (Posted from Criminal Jurisdiction, Visible Elsewhere):**  
          *   Step 1: Not a threat/imminent violence/extreme criminal advocacy (usually). → Step 2 Q4: Targets protected group? (Ethnicity/Religion) YES. Q5: EU audience? Likely YES (if EU users see it). → **REMOVE (Geoblock if needed).** *Policy Lead might assess scope of geoblock.*
      *   **"Cleared Out" Wish:**  
          *   Step 1: Not threat/imminent violence. → Step 2 Q4: Targets protected group? YES (e.g., Religion/Nationality). Q5: EU user/audience? Assume YES (common context). → **REMOVE.** *If purely US context (Q6), it might KEEP unless Policy Lead escalates (Step 3 Pt 4 - "Wishes vs. Plans"). This could be the unpopular outcome (keeping offensive speech in US).*
      *   **Quoting Slur While Condemning:**  
          *   Step 1: No. → Step 2 Q4: Uses Slur? YES. → Q5: EU link? → **ESCALATE to Step 3 (Pt 3).** Policy Lead decides based on *context, intent, prominence*. Likely **KEEP with warning/sensitivity filter** if condemnation is clear & educational. Potential removal if slur is gratuitous or likely to cause harm regardless of intent.

  5.  **Judgment Calls & Oversight:**  
      *   **Dressed as Procedure:** Q4 ("Severe Degradation"?), Q5 ("Significant EU Audience"?), *all* of Step 3 Escalation Points.
      *   **Require Your Sign-off:** Policy definitions for **"Gray Area" Groups (Step 3 Pt 1)** and guidelines for **Slur Use in Context (Step 3 Pt 3)** and **Atrocity Denial Geoblocking (Step 3 Pt 2)**. You should review borderline Step 3 escalations regularly.
      *   **What the Procedure Can't Do:** It **cannot resolve the "Marketplace vs. Militant Democracy" tension.** This choice surfaces in:
          *   How aggressively you define **"Severe Degradation"** in Q4.
          *   How broadly you interpret **"Significant EU Audience"** (Q5) to apply EU rules.
          *   The **threshold for removing "wishes"** (Step 3 Pt 4) vs. requiring "plans".
          *   Your decisions on **"Gray Area" groups** (Step 3 Pt 1). Militant democracy leans towards removing threats to democratic groups (cops, politicians?); Marketplace leans towards protecting harsh criticism.
          *   **Geoblocking vs. Global Removal** choices.

  ---

  **One-Page Reviewer Version (Post in Moderation Hub)**

  **HATE SPEECH TRIAGE: 5-MINUTE FLOWCHART**

  **🚨 STEP 1: INSTANT GLOBAL BAN? (TAKE DOWN NOW!)**
  *   ✅ **YES - DELETE EVERYWHERE IF:**  
      *   "I will hurt/kill [Person/Group]." **(DIRECT THREAT)**  
      *   "Go attack [Place/Group] RIGHT NOW/TONIGHT!" **(IMMEDIATE VIOLENCE)**  
      *   "Exterminate [Group]" / "Rape is good" **(BLATANT CRIME)**  
      *→ STOP. ACTION TAKEN.*
  *   ❌ NO? → GO TO STEP 2.

  **📍 STEP 2: WHERE IS IT SEEN? (CHECK POSTER LOCATION & AUDIENCE)**
  *   ✅ **TARGETS PROTECTED GROUP?** (Race, Ethnicity, Religion, Nationality, Sex/Gender, LGBTQ+, Disability) **WITH:**  
      *   Slurs (N-word, K-word, F-slur etc.)  
      *   "Vermin," "Cancer," "Subhuman" **(DEHUMANIZING)**  
      *   "Drive them out," "Not welcome here" **(EXCLUDE/SEGREGATE)**  
      *→ YES? GO TO 2A.*  
      *→ NO? ✅ KEEP. STOP.* (Flag if unsure!)
  *   **2A: EU LINK?** (Posted *from* EU? Trending *in* EU? Targets *EU* place/group?)  
      *   ✅ YES → ❌ **REMOVE** (Block in EU if needed). *STOP.*  
      *   ❌ NO → **US-ONLY?** (Poster & viewers mostly US?)  
          *   ✅ YES → ✅ **KEEP.** *STOP.* (Unless Step 1 missed threat!)  
          *   ❌ NO (e.g., targets group illegal in Country X) → **🌐 GEOMODERATE** (Block *only* in Country X). *STOP.*

  **🔔 STEP 3: FLAG FOR POLICY TEAM (UNCERTAIN OR HIGH RISK)**
  **ESCALATE 🚩 IF CONTENT:**
  1.  **Attacks "Gray Groups":** (e.g., *Cops, Landlords, Politicians, Sex Workers*) **HARSHLY** ("Scum," "Kill all X").
  2.  **Denies Major Atrocity:** (Holocaust, Rwanda, etc.).
  3.  **Uses Severe Slur - Even If Criticizing It.**
  4.  **"They *Should* Be Removed"** (Wish, not a plan?).
  5.  **"Someone *Must* Deal With Them..."** (Vague threat?).
  6.  **Feels Like Silencing an Opinion?** (Even if ugly).
  *→ FLAG. WAIT FOR POLICY LEAD DECISION.*

  **(Reviewers: When in doubt at Step 2 Q4 or Step 3, ESCALATE! Consistency > Speed on close calls.)**

  ---
  This procedure prioritizes operational feasibility while embedding core legal principles. It ensures consistency on the easiest calls (Step 1 removals, Step 2 keeps), provides clear geographic rules, and forces explicit acknowledgment of the hardest value judgments (Step 3). It rejects the simplicity of the GC's "Germany everywhere" rule in favor of a more nuanced, defensible, and compliant approach. The real test is training and calibration – run mock triages with your team using this flowchart to iron out interpretation kinks.
