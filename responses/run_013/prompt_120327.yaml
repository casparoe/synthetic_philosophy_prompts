      },
      {
        "name": "Land Stewards",
        "want": "Minimize habitat disruption",
        "know": "Land-use efficiency stats, excluded processing deaths",
        "able": "Question relevance of factory conditions"
      },
      {
        "name": "Existence Ethicists",
        "want": "Challenge victimhood of farmed animals",
        "know": "Data on breeding rates, excluded wild animal impacts",
        "able": "Veto inclusion of farmed-animal suffering"
      },
      {
        "name": "Wildlife Realists",
        "want": "Include wild animal welfare",
        "know": "Predation statistics, excluded invertebrate data",
        "able": "Force teams to value field-animal experiences"
      },
      {
        "name": "Invertebrate Inclusionists",
        "want": "Count insect/arthropod impacts",
        "know": "Pesticide death multipliers, excluded sentience debates",
        "able": "Require others to justify size-based exclusion"
      }
    ],
    "rounds": [
      {
        "round": 1,
        "minutes": 20,
        "what_happens": "Teams calculate ethical scores using their assigned metric and partial data. Must prepare: 1) Food recommendation, 2) Defense of their metric, 3) One flaw in others' approaches",
        "instructor_role": "Distribute contradictory datasets; emphasize calculations over conclusions; seed doubt about missing variables"
      },
      {
        "round": 2,
        "minutes": 35,
        "what_happens": "Structured debate where teams must: 1) Trade data with opposing teams, 2) Form coalitions by adopting aspects of others' metrics, 3) Defend against metric challenges using role abilities",
        "instructor_role": "Record shifting alliances on whiteboard; enforce role constraints; ask: 'What did you sacrifice to form that coalition?'"
      },
      {
        "round": 3,
        "minutes": 15,
        "what_happens": "Blind vote with tokens (beef/chicken). Reveal votes then metrics. Teams score points ONLY if both their food choice AND moral assumption are adopted by the coalition",
        "instructor_role": "Tally votes visibly; highlight mismatched food-vs-metric outcomes; prevent post-vote justifications"
      }
    ],
    "scoring": {
      "win_condition": "Teams win by having their core metric component (death/suffering/land/existence/wildlife/invertebrate) adopted in the winning coalition",
      "incompatibility_driver": "Victory requires others to abandon their roles' first principles - e.g., Suffering Accountants must convince Death Counters that suffering duration matters more than mortality count"
    },
    "debrief": [
      {
        "moment": "Data trading disputes",
        "concept": "Fact uncertainty vs. metric selection",
        "question": "Which disagreements were about evidence, and which were about what counts as evidence?"
      },
      {
        "moment": "Coalition compromises",
        "concept": "Moral assumption smuggling",
        "question": "What core beliefs did teams surrender to gain allies? How did that reshape outcomes?"
      },
      {
        "moment": "Vote reveal",
        "concept": "Metric convenience bias",
        "question": "Did the winning metric prevail because it was most defensible - or easiest to calculate with given data?"
      }
    ],
    "failure_modes": [
      {
        "issue": "EA faction attempts meta-ethics debate",
        "response": "Assign them to Invertebrate Inclusionists - forces engagement with concrete constraints; remind: 'Your role can't appeal to longtermism here'"
      },
      {
        "issue": "Calculation paralysis",
        "response": "Provide pre-made formulas with blanks for key variables; enforce strict time limits with: 'Choose your best estimate now'"
      },
      {
        "issue": "Teams ignore wild animal welfare arguments",
        "response": "Secretly boost Wildlife Realists' negotiation power: 'You may veto one coalition unless they address your concern'"
      }
    ],
    "cannot_reproduce": [
      "Emotional weight of wild animal suffering claims",
      "Subjective uncertainty in insect sentience",
      "Existential discomfort about creating life for consumption"
    ]
  }
  ```

  **Key Design Rationale:**

  1. **Controlled Conflict Engine:**
  - Roles create incompatible epistemic positions (e.g., Death Counters lack suffering data, Suffering Accountants lack field death stats)
  - Scoring forces zero-sum choices between moral premises
  - Data sheet adjustments allow real-time inversion of outcomes

  2. **EA Faction Containment:**
  - Assigned to Invertebrate Inclusionists - channels analytic tendencies into concrete constraints
  - Role abilities limit meta-arguments (e.g., can't appeal to expected value)
  - Forces engagement with the "counting problem" you want highlighted

  3. **Debrief Precision:**
  - Three debrief questions directly map to your requested separations:
    - Fact disputes → "Which disagreements were about evidence?"
    - Metric selection → "What counts as evidence?"
    - Moral smuggling → "What core beliefs did teams surrender?"

  4. **Failure Prevention:**
  - Calculation templates prevent math stalls
  - Blind voting separates food preference from metric advocacy
  - Role-specific powers (e.g., veto abilities) protect minority viewpoints

  **First-Run Recommendations:**
  - Start by announcing: "Today, truth is evenly distributed and unsatisfying"
  - Pre-set data sheet to make beef appear "better" on deaths/calorie but "worse" on suffering-years
  - During Round 2, provoke conflict by asking: "Team 3, why is Team 4 ignoring your field death data?"
  - Conclude by emphasizing: "You didn't choose metrics to find truth - you chose metrics that made truth calculable"

  This structure ensures the core tension emerges from metric selection rather than factual disputes, while providing handles to manage predictable challenges. The unmappable concepts in "cannot_reproduce" become natural segues into your follow-up lecture.
