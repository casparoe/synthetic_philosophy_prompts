  ### Diagnostic Handout: Logical Omniscience in Epistemic Logic  

  This decision tree helps you locate your position on logical omniscience by forcing commitments on cases. Answer each question based on intuitions or theoretical leanings, *not* by naming approaches. At each node, a key case (1–8) drives the division.  

  ---

  #### **Decision Tree**  
  1. **Case 1 (Unconsidered trivial consequence)**  
     An agent reliably learns a box has exactly 17 marbles but never considers whether it has exactly 16. Does she know it does not have exactly 16 marbles?  
     - **A: Yes** → Go to 2  
     - **B: No** → Go to 5  

  2. **Case 6 (Unsurprisable ideal)**  
     An agent with unlimited computation knows all consequences instantly. Is this an ideal of rationality?  
     - **A1: Yes, a normative ideal** → Go to 3  
     - **A2: No, degenerate or irrelevant** → Leaf 1: *Real agents are logically omniscient*  
       - *Awkward: Contradicts human fallibility.*  

  3. **Case 7 (Silent logician)**  
     An agent never draws a conclusion entailed by her beliefs, though she could. Did she know it all along?  
     - **A1a: Yes** → Leaf 2: *Timeless closure*  
       - *Awkward: Knowledge exists prior to consideration.*  
     - **A1b: No** → Go to 4  

  4. **Case 3 (Long derivation)**  
     The shortest proof of a claim is 1,000 steps; she hasn’t derived it. Does she know it?  
     - **A1b1: Yes, if derivable within capacity** → Leaf 3: *Capacity-bounded closure*  
       - *Awkward: Vague "capacity" boundary.*  
     - **A1b2: No** → Leaf 4: *Actual derivation required*  
       - *Awkward: Closure fails for long proofs.*  

  5. **Case 2 (Uncombined pair)**  
     An agent has separate evidence for P and Q but never combines them. Does she know P ∧ Q?  
     - **B1: Yes** → Go to 8  
     - **B2: No** → Go to 6  

  6. **Case 4 (Two formats)**  
     An agent grasps a result via a diagram but not a symbolic proof. Does she know it?  
     - **B2a: Yes, via one format** → Go to 7  
     - **B2b: No** → Leaf 5: *Accessible representation required*  
       - *Awkward: Identical content may be unknown in one format.*  

  7. **Case 5 (Awareness regress)**  
     If knowing requires awareness of content, and awareness is content, does knowing you know require infinite awareness?  
     - **B2a1: Yes, regress accepted** → Leaf 6: *Awareness with regress*  
       - *Awkward: Infinite regress of mental states.*  
     - **B2a2: No, foundational awareness** → Leaf 7: *Awareness with foundations*  
       - *Awkward: Arbitrary stopping point.*  

  8. **Case 8 (Contradiction without explosion)**  
     An agent believes P ∧ ¬P but not everything. How is this possible?  
     - **B1a: Restrict logic (e.g., paraconsistent)** → Leaf 8: *Paraconsistent closure*  
       - *Awkward: Rejects classical logic.*  
     - **B1b: Suspend closure in inconsistency** → Leaf 9: *Closure in consistent states only*  
       - *Awkward: Closure fails when inconsistent.*  
     - **B1c: Fragment belief states** → Leaf 10: *Fragmented belief*  
       - *Awkward: No unified agent state.*  

  ---

  #### **Leaves and Commitments**  
  - **Leaf 1: Real agents are logically omniscient**  
    - *Awkward: Denies human cognitive limits.*  
  - **Leaf 2: Timeless closure**  
    - *Awkward: Knowledge exists without consideration.*  
  - **Leaf 3: Capacity-bounded closure**  
    - *Awkward: Unclear bounds for "capacity".*  
    - *Splits on: What defines capacity? (No case settles this.)*  
  - **Leaf 4: Actual derivation required**  
    - *Awkward: Closure fails for complex truths.*  
  - **Leaf 5: Accessible representation required**  
    - *Awkward: Content identity depends on format.*  
  - **Leaf 6: Awareness with regress**  
    - *Awkward: Requires infinite higher-order awareness.*  
  - **Leaf 7: Awareness with foundations**  
    - *Awkward: Foundational awareness is unanalyzed.*  
  - **Leaf 8: Paraconsistent closure**  
    - *Awkward: Abandons classical logic.*  
  - **Leaf 9: Closure in consistent states only**  
    - *Awkward: Closure fails under inconsistency.*  
  - **Leaf 10: Fragmented belief**  
    - *Awkward: Agent has no unified mind.*  

  ---

  #### **Unoccupied Combinations**  
  - **A1b1 + B1 (Capacity + Conjunction automatic)**: Unoccupied. Incoherent—accepting capacity-based closure (A1b1) requires rejecting automatic conjunction (B1).  
  - **A2 + B1 (Non-ideal closure + Conjunction automatic)**: Unexplored. No clear account of inconsistency.  

  #### **Indistinguishable Positions**  
  - **Leaf 3 (Capacity-bounded) vs. Leaf 4 (Actual derivation)**: Differ only on Case 3 (long derivations). Both handle trivial consequences (Case 1) identically.  
  - **Leaf 8 (Paraconsistent) vs. Leaf 9 (Consistent-states-only)**: Differ only on Case 8 (contradiction). Both reject automatic conjunction (B1).  
  - **Leaves 6–7 (Awareness)**: Differ only on Case 5 (regress). Both require format sensitivity (Case 4).  

  *Case 6 (unsurprisable ideal) does no work beyond Node 2. It only separates ideal/non-ideal views of closure.*  

  ---  
  *Terms*:  
  - **Logical omniscience**: Knowing all logical consequences of what you know.  
  - **Closure principle**: If an agent knows P and P entails Q, they know Q.  
  - **Paraconsistent logic**: Logic where contradictions do not entail everything.  
  - **Fragmented belief**: Beliefs stored in isolated compartments.
