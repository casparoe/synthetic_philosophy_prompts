     - The standing factors (step 2) involve judgment calls, especially on complicity and appropriate party.
     - The procedure might misfire in cases where the story structure is different (like Case 2 where there is no separate target).
     - It cannot account for every nuance of the philosophical literature (e.g., the degree of repentance in reformation, the severity of the violation).

     **Fidelity to philosophy:**

     The procedure captures the key ideas: 
          - Hypocrisy does not invalidate the truth of the criticism.
          - Standing to blame depends on the critic's own record, complicity, role, and consistency.
          - Reformation can restore standing.

     The step I'm least sure about is **Step 2b: Complicity**. The literature might distinguish between being complicit in a practice and having personally done it. We have already verified they did it, but complicity might be broader. We simplified to "currently complicit", which might miss ongoing systemic involvement without personal violation.

     Confidence in fidelity: 80%. The main loss is in the nuances of what counts as having standing and the weight of each factor. But for a 20-minute deadline, it's a reasonable simplification.
