  ### Decision Procedure for Handling Hypocrisy Critiques

  This procedure transforms philosophical concepts of "standing to blame" into a step-by-step workflow. It addresses: (1) accuracy of the charge, (2) the critic's standing, (3) independent news value, and (4) contextual nuances (reformation, bad faith, contested norms). **Stop at the first "no"** unless marked otherwise. Editorial judgment is required where noted.

  ---

  #### **Step 0: Contested Norm?**  
  *Is the norm the critic invokes ambiguous, evolving, or widely debated?*  
  - **Yes** → Hypocrisy angle **dropped**. Cover the issue as a debate (e.g., "Experts disagree on whether X constitutes misconduct").  
  - **No** → Proceed to Step 1.  
  *Rationale:* If the norm isn’t settled, the hypocrisy charge lacks grounding.  

  #### **Step 1: Verify Charges**  
  *Are both the underlying charge (against the target) and the hypocrisy charge (against the critic) accurate and substantially similar?*  
  - **Underlying charge unverified** → Story **killed** unless independent news value (Step 4).  
  - **Hypocrisy charge unverified** → Hypocrisy angle **dropped**; underlying charge may proceed if verified.  
  - **Actions not substantially similar** (e.g., severity, context, or intent differs) → Hypocrisy angle **dropped**.  
  - **Both verified and similar** → Proceed to Step 2.  
  *Rationale:* Truth is paramount. "Substantially similar" means same core norm violated (e.g., "undisclosed conflict" = "undisclosed conflict," not "funding source").  

  #### **Step 2: Critic’s Standing**  
  *Does the critic have moral authority to level this critique?*  
  - **2a: Reformation?**  
    Has the critic acknowledged their past violation and demonstrably reformed?  
    - **Yes** → Proceed to 2b.  
    - **No** → Standing **weakened**; proceed to 2b.  
    *Rationale:* Acknowledged reformers regain standing; ongoing hypocrisy undermines it.  
  - **2b: Current Complicity?**  
    Is the critic actively engaged in or benefiting from the practice they condemn?  
    - **Yes** → Standing **weakened**; proceed to 2c.  
    - **No** → Proceed to 2c.  
    *Rationale:* Complicity (e.g., profiting from a system they attack) voids standing.  
  - **2c: Appropriate Party?**  
    Is the critic a stakeholder with a legitimate right to comment (e.g., expert, affected party, watchdog)?  
    - **No** → Standing **weakened**; proceed to 2d.  
    - **Yes** → Proceed to 2d.  
    *Rationale:* Outsiders without a clear role may lack standing.  
  - **2d: Selective Enforcement?**  
    Is there evidence the critic applies the norm inconsistently (e.g., ignores allies’ violations)?  
    - **Yes** → Standing **weakened**; proceed to Step 3.  
    - **No** → Standing **intact**; proceed to Step 3.  
  *Standing Summary:*  
  - **Intact** (all "yes" in 2a–2d) → Hypocrisy angle **dropped**. The story runs without undermining the critic.  
  - **Weakened** (any "no") → Hypocrisy angle **may be included** (see Step 3).  

  #### **Step 3: Independent News Value**  
  *Does the story hold value beyond the hypocrisy?*  
  - **3a: Underlying Charge Newsworthy?**  
    Would the target’s misconduct warrant coverage even without the critic?  
    - **Yes** → Run the story. Include hypocrisy angle if standing is **weakened**.  
    - **No** → Proceed to 3b.  
  - **3b: Hypocrisy Newsworthy?**  
    Is the critic’s hypocrisy itself significant (e.g., prominent figure, egregious violation)?  
    - **Yes** → Run a hypocrisy-focused story.  
    - **No** → Story **killed**.  
  *Rationale:* Prevents hypocrisy from burying valid critiques or propping up trivial stories.  

  #### **Step 4: Bad Faith Check**  
  *Is the standing objection a deflection tactic?*  
  - **Evidence of bad faith** (e.g., target dodges the charge, history of smear tactics) → **Downplay hypocrisy** unless overwhelmingly newsworthy.  
  - **No evidence** → Proceed as above.  
  *Editorial judgment required:* Motive is hard to prove; prioritize the underlying issue’s merit.  

  ---

  ### Case Applications  
  *Work shown for each step.*

  #### **Case 1: Science Communicator Overstating Claims**  
  - **Step 0:** Norm against overstatement is clear (e.g., evidence-based communication). → Proceed.  
  - **Step 1:**  
    - Underlying charge (target’s hype) verified.  
    - Hypocrisy charge (critic’s promotional overstatement) verified and substantially similar. → Proceed.  
  - **Step 2:**  
    - **2a:** No reformation (unacknowledged). → **Weakened.**  
    - **2b:** No current complicity (isolated incident). → Proceed.  
    - **2c:** Appropriate party (expert in science comms). → Proceed.  
    - **2d:** No evidence of selectivity. → Standing **intact?**  
    *Conflict:* 2a weakened standing, but 2b–2d support it. **Editorial judgment:** Weakness in 2a justifies noting hypocrisy.  
  - **Step 3:**  
    - **3a:** Target’s hype newsworthy. → Run story + include hypocrisy angle (critic’s integrity questioned).  
  - **Step 4:** No evidence of bad faith.  

  **Outcome:** Publish with hypocrisy angle.  

  #### **Case 2: Public-Health Figure Violating Own Guidance**  
  - **Step 0:** Norm of following public health rules is clear. → Proceed.  
  - **Step 1:**  
    - Underlying charge (public ignored guidance) verified via photo.  
    - Hypocrisy charge (critic violated own rules) verified and identical. → Proceed.  
  - **Step 2:**  
    - **2a:** No reformation (deflected blame). → **Weakened.**  
    - **2b:** Current complicity (active violation). → **Weakened.**  
    - **2c:** Appropriate party (authority figure). → Proceed.  
    - **2d:** No selectivity evidence. → Standing **weakened.**  
  - **Step 3:**  
    - **3a:** Violation newsworthy (erodes public trust). → Run story + highlight hypocrisy.  
  - **Step 4:** No bad faith.  

  **Outcome:** Publish with hypocrisy as central angle.  

  #### **Case 3: Reformed Researcher Campaigning Against Past Misconduct**  
  - **Step 0:** Norm (e.g., data transparency) is clear. → Proceed.  
  - **Step 1:**  
    - Underlying charge (target’s misconduct) verified.  
    - Hypocrisy charge (critic’s past identical misconduct) verified. → Proceed.  
  - **Step 2:**  
    - **2a:** Reformed (disclosed, changed practices). → Proceed.  
    - **2b:** No complicity (current practices clean). → Proceed.  
    - **2c:** Appropriate party (domain expert). → Proceed.  
    - **2d:** No selectivity evidence. → Standing **intact.**  
  - **Step 3:**  
    - **3a:** Target’s misconduct newsworthy. → Run story **without** hypocrisy angle.  
  - **Step 4:** N/A.  

  **Outcome:** Publish critique without mentioning critic’s past. *Hypocrisy angle excluded despite colleague’s preference.*  

  #### **Passing Case: Industry-Funded Outfit on Conflicts of Interest**  
  - **Step 0:** Norm of disclosing conflicts is clear. → Proceed.  
  - **Step 1:**  
    - Underlying charge (researcher’s conflict) verified.  
    - Hypocrisy charge (outfit’s undisclosed industry ties) verified and similar. → Proceed.  
  - **Step 2:**  
    - **2a:** No reformation. → **Weakened.**  
    - **2b:** Complicit (funding creates conflict). → **Weakened.**  
    - **2c:** Appropriate party? **No** (industry front group). → **Weakened.**  
    - **2d:** Likely selective (targets critics of industry). → **Weakened.**  
  - **Step 3:**  
    - **3a:** Researcher’s conflict newsworthy. → Run story + note messenger’s compromised standing.  
  - **Step 4:** Bad faith likely (deflection for industry interests) → **Downplay hypocrisy**, emphasize underlying facts.  

  **Outcome:** Publish with heavy context on messenger’s bias.  

  ---

  ### Limitations and Confidence  
  **What the procedure cannot do:**  
  - **Resolve contested norms (Step 0):** Requires subjective editorial judgment about societal/field standards.  
  - **Prove bad faith (Step 4):** Relies on circumstantial evidence; easy to misjudge.  
  - **Quantify "substantial similarity" (Step 1):** Context matters (e.g., a one-time lapse vs. systemic fraud).  
  - **Override news value (Step 3):** Editorial judgment determines "newsworthiness."  
  - **Handle gray-area reformation:** E.g., partial apologies or ambiguous changes require nuance.  

  **Fidelity to Philosophy:** 85% confident.  
  - Captures core ideas: Truth ≠ dependent on messenger; standing balances self-consistency, authority, and fairness.  
  - Preserves key distinctions: Reformation vs. ongoing hypocrisy; complicity vs. isolated acts; selective enforcement.  
  - Simplifies "appropriate party" (Step 2c) by emphasizing role over abstract moral rights.  

  **Weakest Step: Reformation (Step 2a).**  
  - **Risk:** Oversimplifies "reformed" as binary (acknowledged/changed). Misses depth of atonement (e.g., restitution, duration of change).  
  - **Why it survives:** Balances pragmatism (20-min deadline) with philosophy’s emphasis on moral growth.  

  **Use this procedure to separate factual standing questions from editorial values. It ensures hypocrisy doesn’t silence valid criticism or launder bad-faith attacks, while flagging where human judgment is essential.**
