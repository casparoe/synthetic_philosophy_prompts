  ## International Pictorial Science Bureau: House Style Manual (Revised Edition)  
  **For Authorized Depiction & Universal Legibility**

  **1.  Scope & Authority:** This Manual constitutes the sole binding protocol for all communications, internal memoranda, research bulletins, and public dissemination issued by or under the auspices of the International Pictorial Science Bureau (IPSB). Verbal annotation, symbolic abstraction exceeding the prescribed glyphs, or recourse to unapproved colour palettes is strictly prohibited and constitutes a Category 3 Infraction. (*See Annex Gamma: Infraction Severity Pictograms*).

  **2.  Foundation Principle:** Knowledge is isomorphic with depictable phenomena. What cannot be rendered clearly and unambiguously using the IPSB Standard Glyph Library (Edition 7.3) and approved compositional rules *cannot* constitute scientific fact. Speculation beyond the depictable is metaphysical residue and must be expunged. (*Marginal Note: This includes "tendencies," "probable futures," "underlying essences," and most discussions of committee motivation.*)

  **3.  The Glyph Library:** All depictions MUST utilize *only* glyphs from the current Standard Glyph Library (SGL). The SGL is exhaustive, internationally calibrated, and rigorously tested for cross-cultural recognizability. Modifications, "stylizations," or the creation of novel glyphs *for expressive purposes* are forbidden. Requests for new glyph additions (e.g., "Quark," "Consciousness," "Market Sentiment") must undergo a minimum 5-year feasibility study by the Glyph Expansion Subcommittee (GES), contingent upon proof of unambiguous depictability. (*Current GES Backlog: 127 items. Average processing time: 6.2 years.*)

  **4.  Scale & Proportion (The Quantification Imperative):** All quantities MUST be represented *isomorphically*. One unit of a phenomenon = one glyph. Ten units = ten identical glyphs. Glyph size MUST remain constant within a single depiction series. Magnification (enlarging a single glyph to denote "importance" or "focus") introduces unacceptable subjectivity and is a Category 2 Infraction. (*Marginal Note: Depictions of stellar phenomena may use the approved "Density Gradient Stipple" (Glyph DGS-7) ONLY after filing Form P-44b "Stellar Scale Justification Waiver."*)

  **5.  Sequence & Causality:** Temporal sequence is depicted left-to-right. Causality is implied *only* by adjacency and sequence. The glyphs "Arrow Forward" (GLY-FF-21) or "Arrow Backward" (GLY-FB-21) may be used to *reinforce* sequence but MUST NOT imply un-depicted causal mechanisms (e.g., "Force," "Intention," "Statistical Correlation"). (*Example: [Cloud Glyph] + [Arrow Forward] + [Rain Glyph] = Acceptable. [Cloud Glyph] + [Lightning Bolt Glyph] + [Arrow Forward] + [Tree Glyph on Fire] = Acceptable sequence. Adding an additional "Angry Sky Spirit" glyph = Category 1 Infraction (Metaphysical Contamination).*)

  **6.  Neutrality Through Standardization:** The IPSB visual language achieves perfect neutrality by eliminating verbal rhetoric. Choosing *which* phenomena to depict, and in what order, is a purely technical act of selection based on measurable prevalence. Editorial perspective is an artifact of verbal ambiguity and is eradicated by adherence to glyphic literalism. (*Marginal Note: Bureau Circular 87-C clarifies that depicting 100 "Worker" glyphs followed by 1 "Capitalist" glyph does not imply commentary; it reflects statistically verified payroll data from Factory 7-B.*)

  **7.  Depicting Absence/Negation:** The concept of "absence" or "not-X" is inherently problematic. Use ONLY the approved "Negation Bar" glyph (GLY-NB-1) superimposed directly over the relevant glyph. *Do not* attempt to depict "the void," "potential," or "what might have been." (*Example: To depict "No Food," superimpose GLY-NB-1 over "Food" glyph (GLY-FD-3). Depicting an empty plate invites subjective interpretation of plate size, material, cultural significance, etc., and is forbidden.*)

  **8.  The Ambiguity Elimination Protocol (Rule 8a & The Peril of the Tree):** Ambiguity arises from verbal surplus. Glyphs are unambiguous *by definition*. However, to prevent potential misinterpretation of *glyph selection*: When depicting a class with sub-variants (e.g., "Tree"), the *most statistically prevalent* sub-variant glyph *within the depicted context* MUST be used exclusively. (*Marginal Note: This solves the ambiguity of "which tree?" by enforcing majority representation.*)  
      **8a. Corollary (The Conifer Conundrum):** If no single sub-variant holds >50% prevalence, the Standard Generic Glyph (SGG) for the class MUST be used. The SGG for "Tree" (GLY-TR-1) is a stylized conifer. Therefore, depictions of tropical rainforests, deciduous woodlands, or olive groves MUST primarily employ GLY-TR-1. (*Result: Solves the ambiguity of "which tree?" by depicting the wrong tree universally. Field reports from the Amazon Basin now feature vast, orderly stands of conifers. The Forestry Dissent Group (FDG) cites this as ecological misrepresentation; the Bureau cites adherence to Protocol 8a as eliminating subjective "jungle bias."*)

  **9.  Composition & Layout (The Grid Mandate):** All complex depictions MUST utilize the Standard Isomorphic Grid (SIG-format). Glyphs occupy discrete cells. This ensures linear comparability and eliminates misleading spatial "emphasis." Free-floating glyphs or "expressive clustering" are Category 2 Infractions. (*Marginal Note: The 1935 Schism originated when the Vienna Working Group advocated for "dynamic flow layouts," leading to the formation of the stricter Berlin Committee, which established the SIG. The Vienna faction's subsequent depictions using swirling "influence vortices" led to their expulsion for Metaphysical Contamination.*)

  **10. Colour Semantics:** Colour conveys ONLY categorical, non-interpretive information as defined in the IPSB Chromatic Codex. Red = Increase/Heat/Danger (Quantifiable). Blue = Decrease/Cold/Safety (Quantifiable). Green = Biological/Vegetation. Grey = Inorganic/Mechanical. Using "soothing pastels" or "dramatic contrasts" for affective purposes is a Category 3 Infraction (Aestheticism). (*Marginal Note: The "Sad Raindrop" incident (using grey-blue instead of standard blue) resulted in mandatory re-depiction training for Cartography Unit 4.*)

  **11. Prohibited Concepts & Glyphic Exhaustion:** Concepts persistently failing depictability studies (e.g., "Justice," "Beauty," "Social Class," "Electron Spin," "The Self") are hereby classified as Non-Scientific (NS). NS concepts MUST NOT appear in IPSB communications. Persistent attempts to depict NS concepts may trigger a Glyphic Exhaustion Review, potentially leading to reclassification of the submitter's work as "Poetic" and transfer to the Bureau of Non-Scientific Output (BNSO). (*Marginal Note: BNSO pamphlets are visually striking but lack SIG compliance.*)

  **12. The Unified Visual Encyclopedia Project (UVEP):** The ultimate goal remains the complete integration of all depictable scientific knowledge into a single, continuous SIG-formatted sequence – the UVEP. Current progress: Volumes 1-347 (Geology to Microbial Ecology) are ratified. Botany (Volume 348) is delayed pending resolution of the GLY-TR-1 controversy (See Rule 8a). Theoretical Physics (Projected Volume 712) is under perpetual feasibility review. (*Marginal Note: The Bureau is unaware that the act of *sequencing* Volumes – placing "Geology" before "Biology" – embodies an unstated, non-depictable metaphysical assumption about causal primacy, contradicting the foundational claim of pure neutrality in Rule 6.*)

  **13. Legacy Material & Retroactive Depiction:** Pre-IPSB scientific texts are considered "proto-scientific." Key findings *may* be retroactively depicted using current SGL/SIG standards ONLY after rigorous verification of their depictable core by the Historical Re-depiction Office (HRO). All verbal context, caveats, and methodological descriptions are discarded as non-essential scaffolding. (*Marginal Note: Darwin's finches are now a sequence of identical bird glyphs next to glyphs of identical seeds. The "principle of natural selection" was deemed non-depictable and omitted.*)

  **14. Enforcement & Clarity:** Adherence to this Manual guarantees objectivity, universality, and the progressive purification of science. Ambiguity is solely the result of non-compliance. Report stylistic deviations promptly using Form SDR-9 ("Suspected Depiction Risk"). Clarity is our only rhetoric.

  ---
  **International Pictorial Science Bureau:** *Scientia per Imaginem Certam* (Knowledge Through Fixed Images)  
  *Issued by the Central Standards Committee, Endorsed by the Permanent Glyphic Authority.*
