answer: |-
  ### Goodhart's Law & Metric Failures: Diagnostic Decision Tree  
  *(Start here: You optimized a metric, but the thing you actually cared about didn’t improve or got worse.)*  

  ---

  #### **Q1: "Did the metric move because someone quietly changed how we define or measure it?"**  
  - **Yes** → **Leaf 5: Metric Redefinition Mid-Flight**  
    *The yardstick got swapped—your time series is fiction (like changing unemployment criteria during an election).*  
    *Goodhart angle: Tautology. You optimized a different thing than you started with.*  
  - **No** → **Q2**.  

  #### **Q2: "Do we know—*for sure*—whether the real thing we care about moved yet?"**  
  - **"Yes, and it improved!"** → **Leaf 7: Genuine Success**  
    *The number went up, and the world actually got better. Celebrate!*  
    *Goodhart angle: Not everything is cursed—sometimes proxies work.*  
  - **"No, it’s too early to tell"** → **Leaf 8: Delayed Feedback**  
    *The feedback loop is slower than your reporting cycle (e.g., long-term health outcomes vs. quarterly metrics).*  
    *Goodhart angle: Unknown—might be empirical (wait and see).*  
  - **"Yes, and it didn’t budge or got worse"** → **Q3**.  

  #### **Q3: "When we set this metric up, was there explicit agreement on what the *real target* was?"**  
  - **No** → **Leaf 6: Proxy-Defined Target**  
    *Nobody ever agreed on the goal—the proxy secretly defined what "good" meant (e.g., "customer satisfaction" = survey scores, full stop).*  
    *Goodhart angle: Tautology. You optimized a construct, not a truth.*  
  - **Yes** → **Q4**.  

  #### **Q4: "If you magically forced the metric 10% in the right direction *without changing anything else*, would the real target move too?"**  
  - **No** → **Q5**.  
  - **Yes** → **Q6**.  

  #### **Q5: "Before we pushed hard, had we ever seen the metric and target move together over a range this extreme?"**  
  - **No** → **Leaf 4: Out-of-Range Proxy**  
    *The proxy was only valid near the old operating point (e.g., clickthrough rates predict revenue until you spam users).*  
    *Goodhart angle: Empirical. It worked locally but broke under pressure.*  
  - **Yes** → **Leaf 2: Downstream Effect**  
    *The proxy is a side effect of the target—pushing it does nothing (e.g., more hospital visits ≠ better health).*  
    *Goodhart angle: Empirical. If causality flowed backward, it’d work.*  

  #### **Q6: "Is the metric super noisy? (i.e., does it bounce wildly even when the target is stable?)"**  
  - **Yes** → **Leaf 1: Noisy Readout**  
    *Optimizing extreme values just selects for luck (e.g., rewarding "best sales month" ignores random market swings).*  
    *Goodhart angle: Empirical. Less noise = less luck.*  
  - **No** → **Leaf 3: Active Steering**  
    *Someone’s gaming the proxy (fraud, reward hacking, teaching to the test).*  
    *Goodhart angle: Empirical. If incentives were aligned, it’d work.*  

  ---

  ### Key Notes  
  **Heaviest Branch**: **Q4 (Magic Wand)**. It splits the tree into *causal* (metrics that *should* drive the target) vs. *non-causal* failures (where the link was broken from the start). Most real-world fires start here.  

  **Unoccupied Paths**:  
  - *"Metric redefined + world improved"* → Excluded by our symptom (world didn’t improve).  
  - *"Agreed target + magic wand works + metric noisy + active steering"* → Incoherent. If the metric moves magically *and* is gamed, you’d see contradictions in data (rare, but possible—tree prioritizes noise/gaming based on variance).  

  **Ambiguous Cases**:  
  - **Cobra Bounties** (apocryphal): Metric = dead cobras. Target = reduce cobras.  
    *Path: Q1→N / Q2→Y→worse / Q3→Y / Q4→Y (magic cobra deaths *would* reduce population) / Q6→N → Leaf 3 (Active Steering).*  
  - **Soviet Nail Factory**: Metric = nail weight. Target = useful nails.  
    *Path: Q1→N / Q2→Y→worse / Q3→Y / Q4→N (forcing heavier nails ≠ useful) / Q5→N (never made 1-ton nails before) → Leaf 4 (Out-of-Range).*  

  **Redraw This Tree If**:  
  - A case hits **two leaves** (e.g., gaming *and* noise—like sales teams fudging volatile conversion data).  
  - A failure has **no leaf** (e.g., the metric *is* the target, but optimizing it destroys value indirectly—like making profits via unethical shortcuts).  

  ---  
  *Print double-sided. Debate fiercely. Metrics are thermometers, not steering wheels.*
