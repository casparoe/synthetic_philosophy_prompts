  However, the committee could consider that the three-quarters requirement in Section 2 is itself a bylaw that can be amended. How? Under Section 1, amendments require two-thirds of members present. But Section 2 says that Section 1 can be changed only by three-quarters of the full membership. What if they wanted to change Section 2? The bylaws are silent on that. Therefore, changing Section 2 would be done under Section 1: so two-thirds of members present and one week notice. But note: Section 2 only protects Section 1. It does not protect itself. Therefore, Section 2 can be amended by the normal process (Section 1) which is two-thirds of members present.

  In fact, if they had proposed an amendment to Section 2 first (to lower its threshold) and then amended Section 1, they might have succeeded. But they tried to change Section 1 directly without changing Section 2.

  Therefore, the committee's opinion:

  The amendment to Section 1 of Article IX required a three-quarters vote of the full membership as specified in Section 2. The vote of 21-9 (70%) did not meet the 75% threshold (23 votes). Therefore, the amendment failed. The old rules (two-thirds of members present and one week notice) remain in effect.

  The 2023 bylaw that created the Rules Committee was passed before the recent amendment attempt and under the old rules. Without evidence that it did not meet the two-thirds requirement of the members present at the time, it is valid. Therefore, the Rules Committee has jurisdiction.

  The budget reallocation last month: if it was a bylaw amendment (which it appears to be, because they used the new 48-hour notice and majority vote) and it was passed after the failed amendment (so under the old rules) but without following the old rules (one week notice and two-thirds of members present), it is invalid. However, if it was not a bylaw amendment but an ordinary motion, then it might be valid if it followed the rules for ordinary motions. Given the urgency (showcase in two weeks) and the fact that the gym has already been booked, the committee might recommend ratifying the budget reallocation at the upcoming meeting under the old rules (with a two-thirds vote of members present and proper notice). But note: the upcoming meeting is on Thursday, and the showcase is in two weeks. We can give notice at Thursday's meeting for a vote at the next meeting? But that might be too late. Alternatively, if the bylaws allow for emergency procedures, that could be used.

  But the committee must be careful: we are interpreting the bylaws, not making policy.

  Strongest counterargument: 
  The president's argument: the amendment was about changing the threshold for amendments. The vote on the amendment was taken under the existing rules, but the existing rules include Section 2 which sets a higher bar for changing Section 1. They did not clear that bar. Therefore, the amendment failed.

  Another counterargument (from the opposition) that the Rules Committee's existence is invalid: but we have no evidence that the 2023 bylaw did not meet the threshold. So we must assume it did.

  What about the budget reallocation? The opposition might argue that it must be void. But the committee could note that the budget reallocation might not be a bylaw amendment. The bylaws might have a separate provision for budget changes. Without knowing the bylaws in detail, we cannot say. But the problem says it was done under the new 48-hour notice. That suggests they thought they were operating under new rules. But they weren't. So it was done without the required notice. Therefore, it is invalid.

  But the committee might recommend a remedy: ratify the budget reallocation at Thursday's meeting. However, the notice period: if the meeting is Thursday and we are writing this opinion for that meeting, then they can vote on it at Thursday's meeting only if the notice was given one week ago. But the problem doesn't say when the meeting is relative to now. We are writing for Thursday's meeting. If the notice for the budget reallocation wasn't given one week in advance, then even at Thursday's meeting they cannot vote on it unless they waive the notice. But waiving notice requires a two-thirds vote? Again, without the bylaws we don't know.

  Alternatively, the committee could rule that the budget reallocation was not a bylaw amendment but an ordinary motion, and therefore only required a majority and reasonable notice (which 48 hours might be). But the problem says it was done under the new rules, implying they thought they were following a bylaw amendment process.

  Given the time constraints, the committee might have to acknowledge the invalidity but recommend an emergency measure.

  Strongest version of the president's argument:
  The amendment was designed to make it easier to pass amendments. The three-quarters requirement in Section 2 is a high bar that was intended to protect the core amendment process. However, the amendment only got 70%, which is a supermajority and more than the two-thirds required for ordinary amendments. Moreover, the full membership had the opportunity to vote and 70% is a strong consensus. To invalidate this vote and all subsequent actions would cause chaos and harm the SGA. Therefore, the committee should interpret Section 2 in a way that allows the amendment to stand. For example, they might argue that Section 2 only applies to changes that make it harder to amend, not easier. But the text says "changed", regardless of direction. Or they might argue that the vote on the amendment was a test of the new rules: that the new rules were adopted by the same vote that passed the amendment. But that is circular.

