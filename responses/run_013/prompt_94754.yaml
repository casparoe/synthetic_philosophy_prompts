  We are presented with a constitutional dilemma regarding the Student Government Association (SGA) bylaws. The issue revolves around the amendment process and the validity of a recent vote to change that process.

  The relevant bylaws:
  - Article IX, Section 1: Amendments require a two-thirds vote of members present after one week's notice.
  - Article IX, Section 2: Section 1 of Article IX may be changed only by a three-quarters vote of the full membership.

  The executive board proposed an amendment to Section 1 that would:
  - Reduce the required vote for amendments from two-thirds of members present to a simple majority of members present.
  - Reduce the notice period from one week to 48 hours.

  The vote on this amendment:
  - 21 voted yes, 9 no.
  - Total membership is 30, so 21 is 70% of the full membership.
  - This meets the requirement for a simple majority (which would be 16 of 30) and even a two-thirds majority of the full membership (20 of 30) but falls short of three-quarters (22.5, so 23).

  The controversy:
  - The president claims the amendment passed because it received a majority (which, under the proposed new rules, would be the standard) and because the notice was given (one week, as required by the old rules).
  - The opposition argues that the amendment failed because Section 2 requires a three-quarters vote of the full membership to change Section 1. Since the vote only got 21 (70%, less than 75%), it did not meet the threshold. Therefore, the old rules still apply. Moreover, they argue that any bylaw changes passed under the new rules (including the one that created the Rules Committee and the recent budget reallocation) are void.

  Additionally, the committee must consider its own existence: the bylaw that created the Rules Committee and gave it the power to issue binding interpretations passed in 2023 with 61% of the vote. If the new rules (which require only a majority) are invalid, then the 2023 bylaw (passed with 61%) would have been passed under the old rules which required two-thirds of members present. We don't have the exact number of members present at that 2023 vote, but 61% of the full membership (30) is 18.3, so about 18 or 19 votes. Two-thirds of members present would require that at the time, if there were 27 members present (for example), two-thirds would be 18. So it might have met the threshold. But the opposition argues that any bylaw passed since the attempted rule change that used the new standard (majority) is void.

  However, note that the 2023 bylaw was passed before the recent amendment attempt. Therefore, it was passed under the old rules (Article IX, Section 1). The old rules required two-thirds of the members present (not the full membership) and one week's notice. We are told that the 2023 bylaw passed with 61% of the full membership. Since the full membership is 30, 61% is 18.3, meaning at least 19 votes (if we round up) because votes are whole numbers. But note: the requirement is two-thirds of the members present. If all 30 were present, two-thirds would be 20. If only 25 were present, two-thirds would be 16.67 (so 17). We don't know the number present. However, the opposition is challenging the 2023 bylaw because they say the Rules Committee's authority is derived from that bylaw and if the recent amendment (which would have lowered thresholds) is invalid, then the Rules Committee might not have the authority to rule on this.

  But note: the opposition's challenge to the Rules Committee's existence is based on the idea that the 2023 bylaw might not have met the two-thirds threshold. However, we don't have the record of how many were present at that 2023 vote. But the committee is being asked to rule on the recent amendment and the status of past bylaws.

  The core question: Which rule governs the vote on the amendment to Section 1? The amendment was to change Section 1, but the process for changing Section 1 is governed by Section 2. Section 2 says that Section 1 may be changed only by a three-quarters vote of the full membership.

  Therefore, to change Section 1, the three-quarters requirement applies. The vote got 21, which is less than 23 (three-quarters of 30). Therefore, the amendment did not meet the threshold and failed.

  But the president's argument is that the amendment was changing Section 1 to a lower threshold, and that the vote itself was taken under the new proposed rules? That doesn't make sense because the new rules weren't in effect when the vote was taken. The vote was taken under the existing rules, which include Section 2.

  Therefore, the committee must conclude that the amendment failed because it did not meet the requirement of Section 2.

  Consequences:
  1. The amendment to Section 1 (lowering the threshold to a simple majority and reducing notice) is invalid.
  2. Therefore, the old rules (two-thirds of members present and one week notice) still apply.

  Now, what about the bylaws passed in the last two years? The opposition claims that any bylaw passed under the "majority" theory is void. But note: the recent amendment (which proposed the majority rule) was not in effect until it passed. Therefore, until the recent vote, all bylaws were passed under the old rules (two-thirds of members present). The 2023 bylaw that created the Rules Committee was passed in 2023, before the recent amendment attempt. Therefore, it was passed under the old rules. We are told it passed with 61% of the full membership. We don't know the number of members present at that meeting. However, if the number of members present was such that 61% of the full membership was at least two-thirds of those present, then it was valid. For example:
  - If 25 members were present, two-thirds would be 16.67 (so 17). 61% of 30 is 18.3, so 19 votes (if we round the percentage to the nearest whole vote) would have been at least 17. Therefore, it could have been valid. Without the exact record, we cannot say it was invalid. Moreover, the bylaws were in effect and the committee has been operating. The burden of proof is on the challenger to show that the 2023 bylaw did not meet the threshold. Absent such evidence, we must presume that the bylaw was validly passed.

  Similarly, the budget reallocation last month: it was passed under the new 48-hour notice and majority rule? But wait, the recent amendment had not passed. Therefore, the budget reallocation was passed under the old rules? Or was it passed under the belief that the new rules were in effect? The committee must note that the recent amendment failed, so the old rules were still in effect. Therefore, any bylaw change (including the budget reallocation, if it was a bylaw amendment) would have needed to follow the old rules (two-thirds of members present and one week notice). However, the budget reallocation might not be a bylaw amendment but an ordinary decision. The problem does not specify what the budget reallocation was. If it was an amendment to the budget bylaws, then it would require the same process as any amendment. But if it was an ordinary appropriation, then it might be governed by different rules.

  The problem states: "the budget reallocation that went through last month under the new 48-hour notice". This suggests that they used the new 48-hour notice and majority rule, which were not in effect because the amendment failed. Therefore, if the budget reallocation required a bylaw amendment (or if the rules for budget reallocations are set by the bylaws and require the same amendment process), then it would be invalid because it did not follow the required procedure (one week notice and two-thirds of members present). However, if the budget reallocation is an ordinary motion that doesn't amend the bylaws, then it might be governed by the ordinary rules of order (like Robert's Rules) which typically require a majority and a shorter notice. But the problem says "bylaw passed in the last two years" and then separately mentions the budget reallocation. This suggests the budget reallocation was a bylaw amendment.

  But note: the problem says "every bylaw passed in the last two years under the 'majority' theory is void". The budget reallocation might not be a bylaw. However, the showcase depends on that budget reallocation. Without more information, we must assume that the budget reallocation was a bylaw amendment because it was done under the new rules.

  But the new rules were not in effect. Therefore, it was passed without following the required procedure.

  However, the committee must also consider the doctrine of de facto validity. The budget reallocation was passed and acted upon. The showcase is in two weeks. Invalidating it now would cause chaos.

  But the Rules Committee is bound by the bylaws. We cannot ignore the bylaws for expediency.

  Regarding the committee's jurisdiction: The 2023 bylaw that created the committee and gave it binding interpretation power is challenged. If we rule that the 2023 bylaw is invalid, then we have no authority. But if we rule it is valid, we do. We must assume it is valid unless proven otherwise. Since we don't have evidence that it was passed improperly, we must proceed.

