  - Kidney donation: outcome-focused, cost varies by agent 
  - Lifetime donations: tests whether cost aggregation creates duty 
  - Skill-dependent heroism: tests whether ease voids supererogation 

  *Building the tree structure* 
  Starting with the supererogation existence question makes sense. If no, that's "No Supererogation" - but must differentiate between consequentialist and rigorist views. 

  Then for "why not required": 
  - No duty (options) vs permission not to maximize (satisficing) 
  ...but wait, their distinction #1 means I need a branch about whether costs affect duty *at all* 

  *Pausing* Oh! The "acts required of anyone" vs "costs excuse this agent" point needs its own node early on. Otherwise we conflate two very different views. 

  For sacrifice vs outcome: this might only matter for cases like the grenade where the act's value *is* the sacrifice. Most philosophers bundle them together, but the user insists. 

  *Checking for blind spots* 
  Can't separate "blame for omissions" from "criticism appropriateness" cleanly - merged those leaves. Also, virtue-focused views naturally reject act-centered supererogation, so that branch stays simple. 

  Final tree should have: 
  - 8 terminal positions 
  - 2 merged leaves (blame/criticism + satisficing/permissions) 
  - Clear awkward commitments (e.g. "must praise grenade-jump refusal") 
  - Called out where views collapse (e.g. relativist/absolutist on duty) 

  *User tone note* They're clearly exhausted by kidney debates - better make grenade and skill-dependent cases prominent in the examples. And absolutely no "as a satisficing consequentialist..." jargon nodes!
answer: |-
  Here’s a logically structured decision tree focusing on *questions* rather than pre-labeled positions, designed to map disagreements about moral demandingness and supererogation. It isolates your key distinctions and handles your cases. Positions emerge at the leaves, with their toughest commitments highlighted.  

  ---

  ### **Ethics of Demand Decision Tree**  
  **(Start at the top; answer each question ↓)**  

  1. **Is there ANY act that is morally better than alternatives but NOT morally required?**  
     - **No** → **Position: Rigorism**  
       *Awkward commitment: You must praise someone for jumping on a grenade to save strangers, and condemn anyone who doesn’t.*  
     - **Yes** → Go to 2.  

  2. **WHY isn’t the best act required?**  
     - **Because morality inherently permits "good enough" options (not just the best)** → Go to 3.  
     - **Because costs TO THE AGENT can exempt them from duty, even if the act is best** → Go to 4.  

  3. **Can an act be supererogatory for one agent but required for another? (e.g., lifeguard vs. passer-by saving a swimmer)**  
     - **Yes** → **Position: Agent-Relative Satisficing**  
       *Awkward commitment: A parent who refuses to donate a kidney to their child may be blameworthy, but a stranger doing the same isn’t—even if both could easily do it.*  
     - **No** → **Position: Agent-Neutral Satisficing**  
       *Awkward commitment: Giving away 50% of your income might be "good enough" for everyone, whether you’re a CEO or a teacher.*  

  4. **Is the threshold for "required" based on ABSOLUTE sacrifice (e.g., "costs ≥ X are too much") or RELATIVE burden (e.g., "costs disproportionate to the agent’s capacity")?**  
     - **Absolute sacrifice** → Go to 5.  
     - **Relative burden** → Go to 6.  

  5. **Does the value of a supererogatory act lie PRIMARILY in the GOOD IT ACHIEVES or in the SACRIFICE IT EMBODIES? (e.g., grenade jump: outcome vs. courage)**  
     - **Good achieved** → **Position: Absolutist Cost Exemption**  
       *Awkward commitment: A skilled surgeon who painlessly donates a kidney with near-zero risk has no more duty to do so than anyone else.*  
     - **Sacrifice embodied** → **Position: Sacrifice-Centric Supererogation**  
       *Awkward commitment: Jumping on a grenade is supererogatory even if it fails to save anyone; refusing isn’t wrong but is criticizable.*  

  6. **Can omitting a supererogatory act make you a legitimate target of CRITICISM (even if not blame)?**  
     - **Yes** → Go to 7.  
     - **No** → **Position: Cost-Sensitive Permissions**  
       *Awkward commitment: No criticism is warranted if a billionaire refuses to donate 0.1% of wealth to cure a disease, despite trivial cost to them.*  

  7. **Is "supererogation" a property of ACTS or just of AGENTS/VIRTUES?**  
     - **Acts** → **Position: Hybrid Agent-Relativism**  
       *Awkward commitment: Donating a kidney might be supererogatory for a pauper but obligatory for a millionaire—even if both have identical surgical risks.*  
     - **Agents/Virtues** → **Position: Virtue-Ethical Container**  
       *Awkward commitment: Calling an act "supererogatory" just means the agent went beyond their character; no act is inherently beyond duty.*  

  ---

  ### **Merged Leaves & Unseparated Views**  
  - **Satisficing branches (3) are merged**: The tree doesn’t separate "permissions not to maximize" from satisficing, as they answer Q2 identically.  
  - **"Blame vs. criticism" distinction is absorbed**: Positions that allow criticism but not blame (e.g., Sacrifice-Centric) are explicit in leaves; others reject both.  
  - **Relativism vs. Absolutism**: Handled in Q4 (absolute/relative thresholds) and Q7 (virtue vs. act focus). Your "moral code relativity" branch collapses into Q7: if supererogation is act-based, it’s code-relative; if virtue-based, it’s morality-wide.  

  ### **Why Some Combinations Don’t Appear**  
  - **"Acts permitted but criticizable" (your mirror image)**: Only emerges in **Sacrifice-Centric Supererogation** (Q5). Other views either forbid criticism or collapse permission into duty.  
  - **"No duty vs. cost exemption"**: Q2 forces a choice—this is the core split between satisficing (no duty for good-enough acts) and cost-exempting views (duty exists but is overridden).  
  - **Skill-dependent cases**: Routed through **Absolutist Cost Exemption** (Q5) and **Hybrid Agent-Relativism** (Q7). A heroic act costing nothing is only supererogatory if sacrifice *isn’t* essential (Q5 → "good achieved") or if agent-relative capacity matters (Q7).  

  ### **Tree Logic Notes**  
  - **Grenade case**: Routes to Sacrifice-Centric (Q5) or Rigorism (Q1).  
  - **Kidney cases**: Differentiated by agent-relative costs (Q3, Q7) or absolute thresholds (Q5).  
  - **Lifetime donations**: Tests satisficing (Q3) vs. cost thresholds (Q4 → Q6/7).  
  - **Skill-based heroism**: Hits Q5 (if outcome-focused) or Q7 (if capacity-focused).  

  The tree forces clarity on *why* supererogation exists (no duty? cost excuse?) and *what grounds it* (good vs. sacrifice, absolute vs. relative costs). Awkward commitments expose where intuitions might rebel.
