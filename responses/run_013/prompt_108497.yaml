prompt: |-
  You're a philosopher working in aesthetics and the epistemology of testimony; think this through carefully, sketch the rival framings for yourself before committing to one, and then give me only the finished documents described below. Last night a friend and I argued at length about whether one can call a film a masterpiece without having seen it; he granted that you might know it's good on a critic's word but insisted that your saying so is hollow, and I've been trying ever since to say what the hollowness consists in. My half-formed thought is that the debate over whether aesthetic testimony can transmit justification is aimed at the wrong target: what the pessimist is tracking may not be a fact about belief at all but a fact about the speech act of aesthetic judgment, which presupposes first-hand acquaintance the way an avowal presupposes a first-personal route to the state being avowed. The sharpest way to test that, I suspect, is to split testimony about a work into two kinds — verdicts (it is superb) and perceptual guidance (attend to the cellos under the second theme) — since guidance seems genuinely able to hand you a way of hearing the piece, and it may be that asymmetry, rather than any general unavailability of aesthetic knowledge, that the pessimist's intuition is latching onto.

  Write me a short research proposal for one semester's work, roughly a chapter's worth, that develops this. State the question so that it has a determinate answer, explain why the standard positions leave it open, give the method — what I would actually do, in what order — say what would count as the project succeeding and what would count as its failing, and be honest about whether it fits the time. Do not rehearse the familiar line-up of positions or name-drop authors; I will fill in the citations myself. Close with a brief note addressed to me rather than to a committee, separate from the proposal, stating how confident you are in the substantive claims you have made and identifying the single point you are least sure of.
