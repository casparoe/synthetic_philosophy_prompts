answer: |-
  Here’s a speech draft focused on **attention as your compass**, avoiding "inner truth" clichés while honoring the research. Followed by the academic footnote you requested:

  ---

  ### Commencement Speech: "Where You Look Matters"

  **(Approx. 8 minutes)**

  Good morning, graduates, families, trustees, colleagues. It’s an honor to stand before you. Like many of you, I’ve spent the last few years asking big questions: *Who am I? What’s my purpose? What’s true?* Today, I want to offer you one small, practical tool for navigating those questions. It’s not about finding a hidden truth inside you. It’s about something much simpler: **where you choose to look**.

  Imagine this: You’re standing in line at your favorite coffee shop. You’ve had a rough morning. The person in front of you suddenly snaps at the barista over a tiny mistake. How do you react?  
  *Later*, explaining it to a friend, you might say: *"I stepped in because I believe in kindness,"* or *"I stayed quiet because I avoid conflict."* Those sound like deep truths about who you are, right? Principles guiding your actions.  

  Here’s the curious thing: In that *actual moment*, you probably didn’t think about your principles at all. Your thoughts were likely more immediate: *"That barista looks stressed,"* or *"Why is this person so angry?"* or *"I really need my coffee."*  

  **The story you tell later—about why you did what you did—is often assembled *after* the fact.** It makes sense of the chaos. It’s coherent. It fits how we see ourselves. But it’s not the whole picture.  

  **The real action happened in where your attention landed in that moment.** Did you focus on the barista’s tired eyes? On the customer’s clenched fists? On your own thumping heart? On the exit door? **Where your attention went shaped what you did next.** Maybe you offered the barista a sympathetic smile. Maybe you studied the angry customer, trying to understand. Maybe you suddenly remembered you left your oven on.  

  **This is your superpower:** **You can’t always control your thoughts or feelings in a messy moment... but you *can* practice steering your attention.**  

  Life after graduation will throw countless versions of that coffee shop at you:  
  - A job offer that feels exciting but terrifying.  
  - A disagreement where everyone seems right.  
  - A moment when the path forward is completely unclear.  

  **When the big stories about "who you are" or "what you believe" feel tangled or silent, don’t panic. Look at what’s *actually* pulling your attention right now.**  

  - **Not**: "What does my gut *say*?" (Sometimes it just screams "RUN!").  
  - **But**: "Where is my attention *drawn*? What detail keeps pulling my eyes or my thoughts? What feels genuinely *interesting* or *important* in this moment, even if I can’t explain why?"  

  **That point of focus—that’s real data. It’s happening *now*. You can trust it because it’s actually happening.** It might point to a problem you can help solve, a person who needs kindness, a spark of curiosity worth following, or a boundary you need to set.  

  **Your attention isn’t some mystical inner voice. It’s your most immediate connection to the world.** It’s how you decide what matters *in this moment*. Cultivating the ability to notice where it goes—and gently guide it—is how you build a life that feels authentic, moment by moment, without needing a pre-written script about who you’re "supposed" to be.  

  So, graduates, as you step into this next chapter: **Don’t just search for your "true self" like it’s buried treasure. Practice paying attention to what *actually* captures your attention.** That’s where your choices begin. That’s where your impact starts. That’s where your unique way of being in the world comes alive.  

  Look closely. Choose wisely. And congratulations!

  ---

  ### Academic Footnote (For Your Eyes Only)

  **What's Settled Consensus:**
  1.  **Post-Hoc Rationalization:** It's well-established (Nisbett & Wilson, 1977; Bem, 1972; Gazzaniga's "Interpreter" theory) that people frequently generate plausible *reasons* for their behavior *after* the fact, often without conscious access to the actual causes (which can be situational, emotional, implicit biases, etc.). We are "storytelling creatures" (Haidt).
  2.  **Limited Introspective Access:** People have poor direct access to the origins of their thoughts, feelings, and decisions (Wilson, 2002; "Introspection Illusion"). We don't have a privileged hotline to our subconscious processes.
  3.  **Attention is a Limited Resource:** The idea that attention is selective, limited, and crucial for guiding perception and action is foundational cognitive psychology (e.g., Broadbent, Treisman, Kahneman).

  **What's Actively Debated/Unsettled:**
  1.  **The Nature of "Authenticity":** While the speech steers clear of defining a "true self," the *concept itself* is philosophically and psychologically contested. Is it a stable core? A narrative construct? An emergent property of actions? There is *no* consensus definition.
  2.  **The Role/Trustworthiness of Attention:**
      *   **Is Focused Attention "Truer"?** While attention signals what's salient *to you* in the moment, that salience isn't necessarily "truer" or more "authentic" than your later narrative. It could be driven by bias, fear, distraction, or social priming just as easily as by deep values. The speech *frames* it as actionable data ("what's happening *now*"), which is defensible, but claiming it's inherently *more authentic* than reflection would be contentious.
      *   **Can We Truly "Control" Attention?** While we have *some* top-down control (executive function), attention is heavily influenced by bottom-up processes (salience, emotion). Our control is limited and effortful. The speech emphasizes "practice steering," which is fair, but it's an ongoing battle, not a simple switch.
  3.  **The Relationship Between Attention and the "Self":** How does the momentary focus of attention relate to the sense of a continuous self? Is the self *constituted* by these moments of attention? This is deep theoretical/philosophical territory with no settled answer. The speech wisely sidesteps defining the self and focuses on the *utility* of attention for *action*.
  4.  **Somatic Markers/Damásio:** The idea that bodily feelings ("gut feelings") guide decision-making is influential but debated. While physiological responses signal salience, interpreting them correctly and their role in "good" decisions is complex and context-dependent. The speech *avoids* endorsing "gut feelings" as inherently wise, which is good, as the research is nuanced.

  **Key Takeaway for Your Integrity:**  
  You're safe on the core message: People construct stories about behavior *after* the fact, and attention in the moment is a powerful, immediate guide for action. You are *not* claiming attention reveals a "true self" or that gut feelings are always right. The debate centers on the *interpretation* of attention's signal and the *nature* of authenticity, not the fundamental observation about post-hoc storytelling vs. moment-to-moment attentional focus. You're presenting a pragmatic tool (notice & guide attention) based on solid cognitive principles, not a grand theory of the self. The speech navigates the minefield well.
