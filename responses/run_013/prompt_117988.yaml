answer: |-
  Here is a self-contained quiz and scoring key designed to diagnose readers' underlying assumptions about whether and how biographies can teach us how to live, drawing on the tensions you outlined.

  **The Quiz: What Does a Life Teach You?**

  *For each scenario, choose the response that feels closest to your instinctive reaction:*

  1.  **You discover that a person whose moral character you deeply admired kept slaves throughout their adult life, viewing it as entirely natural.**
      A. Their core achievements and virtues are now permanently tainted; the example is ruined.
      B. This reveals a tragic flaw or blindness common to their time; the complexity deepens the lesson.
      C. It forces me to separate their specific positive qualities from their overall judgment, which was flawed.

  2.  **A biography you found profoundly inspiring turns out to have omitted major personal failures, scandals, and periods of despair experienced by its subject.**
      A. The biographer betrayed the truth; the inspiration feels hollow and manufactured now.
      B. The core virtues depicted were still real; focusing on them served a valuable purpose.
      C. Every life story is shaped; it matters less what was left out than what pattern the telling created.

  3.  **You meet someone exceptionally kind and patient. It seems effortless, woven into their very being since childhood, not the result of struggle or conscious effort.**
      A. This innate goodness is beautiful, but it offers me nothing I can practically *do* to improve.
      B. Observing how their temperament manifests in actions *is* the lesson; I can still learn from the *expression*.
      C. It makes me wonder if "character" is even something we build, or just something we have.

  4.  **A reader tells you they emulate a famous general’s boldness in their own life. You know the biography shows this "boldness" often stemmed from arrogance and led to needless deaths.**
      A. They fundamentally misread the life; true courage is different from recklessness.
      B. What matters is what the reader *takes* from it; if it inspires positive action for them, the source is secondary.
      C. This shows the danger of imitating actions without understanding the context or character behind them.

  5.  **You read a gripping biography explicitly written to warn against its subject's path – perhaps a brilliant scientist consumed by envy or a leader destroyed by hubris.**
      A. This is the most valuable kind of life story; clear lessons emerge from understanding failure.
      B. It feels manipulative and reductive; real lives are too complex for simple cautionary tales.
      C. It succeeds only if it makes me understand the *attraction* of that path, not just the downfall.

  6.  **A fictional character – Elizabeth Bennet, Atticus Finch, Jean Valjean – moves you profoundly, shaping your sense of decency or courage as much as any real person’s story.**
      A. Their power comes from embodying an ideal *more purely* than messy reality allows; that's the lesson.
      B. It proves the *pattern* matters, not the reality; well-told stories shape us regardless of fact.
      C. It feels different; real lives carry weight and consequences that fiction can't replicate for moral learning.

  7.  **You read a meticulously researched biography of someone you knew personally. It's factually accurate, yet its interpretation of their motivations and character feels completely alien to your own experience of them.**
      A. The biographer’s unique perspective and focus *become* the subject; it’s a new creation.
      B. It highlights how little any single perspective, even a "definitive" biography, can capture a whole life.
      C. It makes me question whether *any* biography can truly reveal the inner life necessary for imitation.

  8.  **A biography convincingly argues that its subject's greatest "triumph" depended heavily on sheer luck – being in the right place, meeting one key person – rather than their celebrated virtues.**
      A. It diminishes the subject; they become less of an exemplar worth studying for deliberate action.
      B. It makes the story *more* instructive by showing how contingency shapes even the grandest lives.
      C. The specific virtues they *did* display in navigating that luck remain the valuable takeaway.

  ---

  **Scoring Key: What Your Answers Suggest**

  Tally your choices (A, B, C) for each question. No single pattern guarantees one view, but dominant trends point towards these underlying positions:

  *   **Mostly A:** Suggests **(5) The genuine lesson of a life is negative, and the positive exemplar is a later smoothing-over.** You are alert to flaws, omissions, and the gap between idealization and messy reality, finding truth and instruction primarily in understanding failure or complexity. Positive examples feel suspect.
  *   **Mostly B:** Suggests **(1) Admiration of persons, not grasp of rules, is the basic form of moral apprehension** OR **(4) The edifying life is a genre with its own kind of truth... whose lessons are real but are not evidence about anyone.** You are receptive to the power of a life story to inspire and instruct, whether through a complex, admired person (1) or through a deliberately shaped narrative designed to convey virtue, regardless of strict historical accuracy (4). *(The quiz struggles to neatly separate these)*.
  *   **Strong B in 2, 6:** Particularly points towards **(4) The edifying life...**
  *   **Strong B in 1, 3, 4:** Particularly points towards **(1) Admiration of persons...**
  *   **Mix of A & C, especially in 1, 3, 7:** Suggests **(3) Lives teach nothing about how to act, because there is no stable character to copy.** You are skeptical that biographies reveal a coherent, imitable self, emphasizing flaws, temperament over choice, or the biographer's construction.
  *   **Mix of B & C, especially in 3, 5, 6, 8:** Suggests **(6) Exemplars supply the wanting, not the knowing — they move you without telling you what to do.** You feel the inspirational pull of lives (real or fictional) but find the translation into specific action ambiguous; the value is in the motivation, not the blueprint.
  *   **Strong C in 2, 4, 7:** Suggests **(7) What a reader takes from a life is the biographer's way of looking, not the subject's way of living.** You focus on the narrative construction, the perspective applied, and the reader's reception as the source of meaning, rather than direct access to the subject's character for imitation.
  *   **Strong C in 1, 5, 8:** Suggests **(8) To take your ends from another's life is a failure of self-legislation.** You resist the idea of deriving moral goals or rules from another's example, emphasizing critical separation, inherent flaws, or the need for independent judgment.
  *   **Balanced, Leans B/C in 3, 4; C in 6:** Suggests **(2) We learn by doing, and a life can only supply a pattern to someone already half-formed.** You see lives as potentially offering patterns or sparks, but believe real moral development comes through personal experience and action; the biography provides material for the already developing self.

  **The Shape of the Space:**

  *   **Incoherent Gaps:** A combination demanding *both* perfect factual accuracy/complexity (A) *and* unambiguous positive inspiration/edification (B) is likely incoherent. Life is messy; sanitized inspiration often requires omission (Position 4 acknowledges this trade-off explicitly).
  *   **Unattractive/Undefended Gaps:** A position rejecting *any* value from lives (real or fictional) for motivation OR understanding is possible (leaning hard into C, especially 3 & 7), but the quiz struggles to map it neatly beyond (3) or (7). It might feel nihilistic or overly skeptical to many. Similarly, a position insisting lives *must* provide clear, imitable rules for action (not strongly represented here) clashes with the ambiguity highlighted in many questions (esp. 3, 4, 8).
  *   **Blurred Boundaries:** The key struggles to cleanly separate:
      *   **(1) Admiration of persons** from **(4) Edifying genre truth.** Both value inspiration; the difference is the weight given to historical fidelity vs. narrative purpose. Reader emphasis on complexity leans towards (1), acceptance of shaping leans towards (4).
      *   **(6) Supplies the wanting** from **(7) Biographer's way of looking.** Both deal with indirect influence. (6) focuses on the reader's internal response (desire/motivation), (7) on the external source of the narrative frame. A reader choosing B for "inspiration" (6) and C for "biographer's perspective" (7) might hold elements of both.
      *   **(2) Learn by doing / pattern for half-formed** is broad and can overlap with the receptivity of (1)/(4) and the ambiguity acknowledged in (6). Strong C answers (esp. 8) help distinguish it by emphasizing the *limitation* of the biography's role.
  *   **Diagnostic Fidelity:** The quiz is best at identifying skepticism (A/C patterns -> 3,5,7,8), inspiration-receptivity (B patterns -> 1,4), and motivational ambiguity (B/C mix -> 6). Distinguishing between the nuances of *how* inspiration works (1 vs. 4) or the precise nature of skepticism (3 vs. 7 vs. 8) is less precise. The instrument reveals foundational leanings rather than fine philosophical distinctions.
