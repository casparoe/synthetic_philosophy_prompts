  Fourth: The fascist broadcast choice... chills. By making the signal morally repugnant, it prevents easy sentimentality. The universe isn't warm or cold—it's indifferent to our categories. That heightens the stakes of belief: Ellie trusts a process that delivered horror first. 

  Biggest insight: The film's real innovation is decoupling private conviction from public justification—something both philosophers blurred. Ellie's journey mirrors James' will-to-believe, but her testimony demand fails Clifford's social test. That institutional layer? That's the new contribution. 

