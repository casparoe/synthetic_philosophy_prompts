prompt: |-
  I am a novelist at work on a book whose central character is a self-taught statistician who believes she has at last solved the oldest problem in her field: how a rational mind should distribute its confidence when it is genuinely ignorant. Her method drives the plot — she bets with it, she testifies under oath with it, and by the end it ruins someone — and the book will not work unless the method is either a genuine solution or a recognizable fraud. So I need the specification before I need the theories, and I am not asking for a bibliography.

  Set out the desiderata that any adequate account of reasoning from ignorance must meet: the cases it has to get right, beginning with the plainly symmetric ones where everyone already agrees; the distinctions it cannot collapse; and the constraints it cannot violate. I have my own guesses at the last of these, and I want your full list rather than mine — that the verdict must not change when the same unknown is described in different units or coordinates; that it must not depend on how the space of possibilities is carved up, so that two ways of partitioning one situation yield a single answer; that no nonempty possibility may be assigned zero; that the confidences must be coherent, in the sense that no collection of bets priced from them can guarantee a loss; that the method must survive learning, so that when she acquires evidence her confidence shifts and remains coherent; and that it must still return a definite number where the range is continuous or unbounded, where treating possibilities as equally likely has no direct meaning. Behind each requirement, put the case or consideration that motivates it, and mark which are genuine constraints on any theory and which are merely the tastes of one camp.

  Then give me the part I most need: which of these requirements cannot be satisfied together, since I suspect several pairs stand in open conflict, and which single requirement, if I could keep only one, would eliminate the most candidates. Close with a few sentences each on how the classical rule of treating alternatives as equally likely, the rule that reads the answer off the symmetries of a situation, the rule that maximizes entropy, and the view that there is no such rule at all — that priors are simply a matter of opinion — fare against your list. A table is fine.
reasoning: |-
  We are to set out the desiderata for reasoning under ignorance (i.e., when there is no evidence to favor one possibility over another). Then we will see which of these are in conflict and which single requirement is the most restrictive. Finally, we will evaluate several existing approaches.

  Desiderata for Reasoning from Ignorance:

  1. **Symmetry (Invariance under Relabeling):** 
     - *Motivation:* In symmetric situations, such as a coin that we know nothing about, we should assign equal confidence to heads and tails. Similarly, for a die with symmetric faces, we assign equal probability to each face. If we change the labels (e.g., call heads tails and vice versa), the confidence should remain the same for the same physical situation.
     - *Constraint Type:* Genuine constraint. Any reasonable theory must satisfy this.

  2. **Scale Invariance (Invariance under Change of Units):**
     - *Motivation:* If we are ignorant about a continuous parameter (like the length of a cube's edge) and we change the units (e.g., from meters to feet), our confidence distribution should transform accordingly so that it represents the same state of knowledge. For example, if we have a uniform distribution for the edge length in meters, then after changing to feet (which is a linear transformation) it should become uniform in feet as well. But note: the uniform distribution in one scale becomes non-uniform in a nonlinear transformation. Hence, the requirement is that the method should not depend arbitrarily on the choice of units.
     - *Constraint Type:* Genuine constraint.

  3. **Partition Invariance (Invariance under Reparametrization):**
     - *Motivation:* Consider a problem where we are ignorant about the area of a square. We might partition the space by the length of the side or by the area. The method should assign the same confidence to a given range of areas regardless of whether we parameterize by side length or area. Two different ways of partitioning the same underlying ignorance should yield consistent confidences.
     - *Constraint Type:* Genuine constraint.

  4. **Non-Dogmatism (No Nonempty Possibility Gets Zero):**
     - *Motivation:* If we are truly ignorant, we cannot rule out any nonempty possibility. Assigning zero to a possibility would mean we are certain it is false, which is not ignorance. For example, in a coin flip, we cannot assign zero to heads because we don't know it's impossible.
     - *Constraint Type:* Genuine constraint.

  5. **Coherence (Dutch Book):**
     - *Motivation:* If we assign confidences that are not coherent (i.e., they are inconsistent in the sense that one can construct a set of bets that guarantees a loss no matter what happens), then we are being irrational. This is a foundational requirement for any theory of subjective probability.
     - *Constraint Type:* Genuine constraint.

  6. **Updating (Conditionalization):**
     - *Motivation:* When new evidence is acquired, the method should update the confidences in a way that remains coherent and consistent with the evidence. The updating rule (like Bayes' rule) must be defined and should lead to a new coherent state.
     - *Constraint Type:* Genuine constraint.

  7. **Definiteness (Handling Continuous and Unbounded Ranges):**
     - *Motivation:* In continuous or unbounded spaces, we cannot assign equal probabilities to each point because there are infinitely many. But we still want a definite answer (e.g., a probability density). The method must provide a way to represent ignorance in such spaces without being arbitrary.
     - *Constraint Type:* Genuine constraint.

  Now, note that the above list includes genuine constraints that any theory must satisfy to be considered rational, except that some of these are in conflict.

  Conflicts:

  - **Scale Invariance vs. Partition Invariance:** These two are in conflict in continuous spaces. For example, if we are ignorant about the length of a cube's edge, we might choose a uniform prior on the edge length (say between 0 and 1 meter). But then the volume (which is the cube of the edge) would not be uniform. Alternatively, if we choose a uniform prior on the volume, then the edge length would not be uniform. Hence, we cannot satisfy both scale invariance and partition invariance simultaneously.

  - **Symmetry and Partition Invariance:** In continuous spaces, the symmetry requirement (if extended to continuous parameters) might conflict with partition invariance. For example, if we have a square and we are ignorant about the side length, symmetry might suggest uniform in the side length. But if we reparametrize by area, then the uniform prior on side length becomes a non-uniform prior on area. Hence, the symmetry requirement (as applied to the side length) and the partition invariance (when we change to area) conflict.

  - **Definiteness vs. Symmetry/Partition Invariance:** The requirement for a definite answer in continuous spaces forces us to pick a prior, but the above conflicts show that we cannot have one that is both scale invariant and partition invariant.

  Which single requirement eliminates the most candidates?

  If we could keep only one, then **coherence** (Dutch book) is the most fundamental. Without coherence, the confidences are not even rational in the minimal sense of avoiding sure losses. However, note that coherence alone does not pin down a unique prior in the case of ignorance. It only requires that the confidences form a probability measure (with the usual axioms). Therefore, coherence is necessary but not sufficient.

  But if we are looking for the requirement that by itself would eliminate the most candidate methods, then **partition invariance** (or reparametrization invariance) is very strong. It is so strong that it is impossible to satisfy in continuous spaces (as shown by the cube example) unless we use a method that is invariant under all reparametrizations, which leads to the Jeffreys prior in Bayesian statistics. However, even the Jeffreys prior does not satisfy partition invariance in the sense of being invariant under arbitrary repartitioning (it is invariant only under smooth reparametrizations and is designed to be non-informative in a specific sense). Moreover, the Jeffreys prior does not work for all models and sometimes leads to improper priors.

  Alternatively, **scale invariance** is also a strong requirement that eliminates many candidates. For example, in the case of a positive real parameter, scale invariance would require that the prior density is proportional to 1/x (the Jeffreys prior for a scale parameter). But then we lose partition invariance for other parameters.

  But note: the requirement that is most often violated and that causes the most trouble is **partition invariance** because it is impossible to satisfy in general.

  Therefore, if I had to choose one requirement that is the most restrictive, it would be **partition invariance**. It is so strong that it is impossible to satisfy in general, hence eliminating any method that claims to be universally applicable.

  Now, let us evaluate the existing approaches:

  A. **Classical Principle of Indifference (Treating alternatives as equally likely):**
     - This is the rule that assigns equal probability to each possibility in a discrete setting. For continuous settings, it assigns a uniform density.
     - *Evaluation:* 
       - Symmetry: It respects symmetry in discrete cases and in continuous cases if the symmetry is in the chosen parameterization.
       - Scale Invariance: Fails. For example, uniform in length is not uniform in volume.
       - Partition Invariance: Fails. Reparametrization changes the prior.
       - Non-Dogmatism: Satisfied (if the space is bounded, but in unbounded spaces, it becomes improper and does not assign zero but does not normalize either).
       - Coherence: In discrete and bounded continuous cases, it can be coherent. But in unbounded continuous cases, the uniform prior may be improper and then coherence might be lost (unless we are careful).
       - Updating: It can be updated via Bayes' rule, but the updated prior may not be uniform.
       - Definiteness: In continuous spaces, it gives a definite uniform prior, but that prior is arbitrary to the choice of parameterization.

  B. **Symmetry Principle (Reading the answer off the symmetries of the situation):**
     - This is similar to the principle of indifference but applied to the symmetries of the problem. For example, in the case of a die, the symmetry group is the rotation group, and the invariant measure is uniform. For continuous parameters, we look for a measure that is invariant under the symmetry group (e.g., for location, the uniform measure; for scale, the measure proportional to 1/x).
     - *Evaluation:*
       - Symmetry: Satisfied by construction.
       - Scale Invariance: For scale parameters, it satisfies scale invariance. For location, it does not apply to scale changes.
       - Partition Invariance: Fails. If we reparametrize in a way that breaks the symmetry, then the invariant measure for the new parameter may not be the same as the transformation of the old measure. But note: if the reparametrization is a symmetry, then it will be invariant. However, for arbitrary reparametrizations, it fails.
       - Non-Dogmatism: Satisfied for the invariant measures, but they may be improper (like the uniform over the whole real line).
       - Coherence: The invariant measure may be improper, which can lead to incoherence if not handled carefully. But in practice, we often condition on data to get a proper posterior.
       - Updating: Updating by conditioning may break the symmetry, but the prior is chosen to be invariant.
       - Definiteness: It gives a definite prior (though sometimes improper).

  C. **Maximum Entropy:**
     - This rule chooses the probability distribution that maximizes entropy subject to known constraints. For ignorance, if there are no constraints, it gives the uniform distribution (over the discrete set or the continuous parameter in the chosen parameterization).
     - *Evaluation:*
       - Symmetry: In the absence of constraints, it is the same as the principle of indifference. So it respects symmetry in the chosen parameterization.
       - Scale Invariance: Fails. The uniform distribution in one scale is not maximum entropy in another.
       - Partition Invariance: Fails. Reparametrization changes the entropy maximization problem.
       - Non-Dogmatism: In bounded spaces, it assigns non-zero to every point. In unbounded spaces, it cannot be applied without constraints (because the entropy is unbounded). So we often impose constraints that lead to non-uniform distributions (like a given mean and variance for a normal distribution).
       - Coherence: The maximum entropy prior is a proper prior (if the space is bounded) and hence coherent. But in unbounded spaces, it might be improper and then coherence is an issue.
       - Updating: It is updated by conditioning, but the updated distribution may not be maximum entropy unless we reapply the principle with the new constraints.
       - Definiteness: It gives a definite prior only when the entropy is bounded (or when we have constraints that make it bounded).

  D. **Subjective Bayesianism (Priors are a matter of opinion):**
     - This view holds that there is no unique rule for ignorance. Any prior that satisfies the probability axioms is acceptable, and it is updated by Bayes' rule.
     - *Evaluation:*
       - Symmetry: It doesn't require symmetry. But one can choose a symmetric prior if desired.
       - Scale Invariance: Not required. The prior can be chosen arbitrarily in any parameterization.
       - Partition Invariance: Not required. The prior is chosen for a particular parameterization.
       - Non-Dogmatism: The prior must assign zero only to sets of measure zero? Actually, subjective Bayesians allow any prior, so they can assign zero to some nonempty sets (though that is not recommended). But the requirement of non-dogmatism is not enforced.
       - Coherence: Enforced. The prior must be a probability measure to ensure coherence.
       - Updating: By conditionalization, which preserves coherence.
       - Definiteness: The prior must be a probability measure (which for continuous spaces is a density), so it is definite.

  Summary Table:

  | Desideratum           | Classical Indifference | Symmetry Principle | Maximum Entropy | Subjective Bayesianism |
  |-----------------------|------------------------|---------------------|-----------------|------------------------|
  | Symmetry              | Yes (in chosen param)  | Yes                | Yes (in chosen) | Optional              |
  | Scale Invariance      | No                     | For scale params   | No              | Optional              |
  | Partition Invariance  | No                     | No                 | No              | No                    |
  | Non-Dogmatism         | Bounded: Yes; Unbounded: Improper | Improper          | Bounded: Yes; Unbounded: N/A | Optional (but must be a prob measure) |
  | Coherence             | Bounded: Yes; Unbounded: Improper (may break) | Improper (may break) | Bounded: Yes; Unbounded: N/A | Yes (by definition) |
  | Updating              | Yes (by conditioning)  | Yes                | Yes (but may not be maxent after) | Yes                   |
  | Definiteness          | Yes (but arbitrary)    | Yes (improper)     | Bounded: Yes; Unbounded: N/A | Yes                   |

  Note: The Subjective Bayesian approach satisfies the minimal coherence requirement and updating, but does not impose any of the other constraints. It is the most flexible but does not provide a unique solution for ignorance.

  Conclusion:

  The most fundamental conflict is between scale invariance and partition invariance in continuous spaces. There is no prior that can be invariant under all reparametrizations. Therefore, any method that claims to be a universal solution for ignorance in continuous spaces must fail at least one of these.

  The requirement that if we could keep only one and that would eliminate the most candidates is **partition invariance**. Because it is impossible to achieve in general, any method that claims to achieve it (in continuous spaces) is immediately suspect.

  As for the character's method: If she claims to have solved the problem, she must either be mistaken (her method fails one of the genuine constraints) or she has restricted the domain to a special case (like discrete and finite) where the principle of indifference works. Alternatively, she might have found a way to satisfy a subset of the constraints that are jointly satisfiable in a particular context. But the universal problem remains unsolved.

  In the context of the novel, if she is a fraud, she might ignore the conflicts and present her method as universally applicable. If she is genuine, perhaps she has a novel approach that addresses the conflicts (like using a reference prior that is approximately invariant in a specific context) but it would not be universally accepted. However, note that the academic community generally accepts that there is no universal non-informative prior.

  The view that there is no such rule (subjective Bayesianism) is the most consistent with the constraints because it does not try to satisfy the ones that are in conflict. It only requires coherence and updating, which are satisfiable. So if the character is a subjective Bayesian, she might claim that her prior is her own and that there is no objective prior for ignorance. But that would not be a "solution" to the oldest problem, because the problem is to find an objective prior.

  Hence, it is likely that her method is a fraud or at best a controversial candidate that fails some of the constraints.
answer: |-
  ### Desiderata for Reasoning from Genuine Ignorance  
  Below are the core requirements any adequate account must meet, categorized by the cases or principles that motivate them. Constraints marked as **"Universal"** are necessary for any rational theory; **"Camp-Specific"** reflect preferences of particular schools (e.g., objective Bayesians).  

  | **Desideratum**                                         | **Motivating Case/Consideration**                                                                 | **Constraint Type** |  
  |---------------------------------------------------------|---------------------------------------------------------------------------------------------------|---------------------|  
  | **1. Symmetry (Relabeling Invariance)**                 | A fair coin: Heads and Tails must receive equal confidence (0.5 each). Extends to dice, cards, or any symmetric discrete alternatives. | Universal           |  
  | **2. Scale/Unit Invariance**                            | Cube volume: If ignorant of edge length (in meters), confidence over lengths must transform consistently to cubic meters. Changing units must not alter conclusions. | Universal           |  
  | **3. Partition Invariance**                             | Square area: Carving possibilities by side length (e.g., 1–2m) vs. area (1–4m²) must yield the same confidence for equivalent events (e.g., area ≤2m²). | Universal           |  
  | **4. Non-Dogmatism**                                    | Unfamiliar coin: No nonempty hypothesis (e.g., "coin lands edge-on") can be assigned zero confidence if logically possible. | Universal           |  
  | **5. Coherence (Dutch Book)**                           | Betting: Confidence assignments must not allow a guaranteed loss ("Dutch book") when translated to betting odds. | Universal           |  
  | **6. Updating Consistency (Conditionalization)**        | Learning evidence: After observing data (e.g., 3 heads in 10 flips), updated confidences must remain coherent and reflect the evidence. | Universal           |  
  | **7. Definiteness (Continuous/Unbounded)**              | Particle decay time: Must assign definite confidence densities for continuous (e.g., decay between 0–∞ seconds) or unbounded spaces. | Universal           |  
  | **8. Symmetry of Continuous Parameters**                | Circular dartboard: Rotational symmetry must imply uniform confidence over angles (0–360°). | Camp-Specific       |  
  | **9. Maximum Ignorance (Entropy)**                      | Gas molecules: Given fixed constraints (e.g., total energy), confidence should maximize uncertainty. | Camp-Specific       |  
  | **10. Subjectivity Rejection**                          | "No objective priors" stance: The method must not reduce to arbitrary personal opinion. | Camp-Specific       |  

  ---  

  ### **Conflicts Between Requirements**  
  Several desiderata **cannot be jointly satisfied**, especially in continuous spaces:  
  - **Scale Invariance (2) vs. Partition Invariance (3):**  
    - *Conflict:* Uniform confidence over a cube’s edge length implies non-uniform confidence over volume (violating 3). Uniformity in volume implies non-uniformity in length (violating 2).  
    - *Example:* If edge length \(x\) is uniform over [1m, 2m], volume \(y = x^3\) is non-uniform over [1m³, 8m³]. No prior satisfies both.  
  - **Symmetry (1) vs. Definiteness (7):**  
    - *Conflict:* In continuous spaces (e.g., real line), "equal likelihood" has no unique meaning. Uniformity over \(x\) is non-uniform over \(x^2\).  
  - **Partition Invariance (3) vs. Maximum Entropy (9):**  
    - *Conflict:* MaxEnt yields uniform densities in one parameterization (e.g., position), but reparametrization (e.g., velocity) breaks uniformity.  

  ---  

  ### **The Most Restrictive Requirement**  
  If only one requirement could be kept, **Partition Invariance (3)** eliminates the most candidates:  
  - It demands that *any* carving of possibility space yields identical confidences.  
  - **Consequence:** Almost all methods (including MaxEnt, symmetry-based rules, and uniform priors) fail this in continuous spaces. Only highly restricted cases (e.g., discrete/finite symmetries) satisfy it.  

  ---  

  ### **Evaluation of Existing Approaches**  
  *Key: ✓ = Satisfies, ✗ = Violates, ~ = Context-Dependent, † = Camp-Specific*  

  | **Approach**                     | **Symmetry (1)** | **Scale Invariance (2)** | **Partition Invariance (3)** | **Non-Dogmatism (4)** | **Coherence (5)** | **Updating (6)** | **Definiteness (7)** | **Symmetry Continuity (8†)** | **Max Entropy (9†)** | **Anti-Subjectivity (10†)** |  
  |----------------------------------|------------------|--------------------------|------------------------------|------------------------|-------------------|------------------|----------------------|-----------------------------|----------------------|----------------------------|  
  | **Classical Indifference**       | ✓ (discrete)     | ✗                        | ✗                            | ~ (bounded)            | ✓                 | ✓                | ✗ (unbounded)        | ✗                           | ✗                    | ✓                          |  
  | *Treats alternatives equally*    | ✗ (continuous)   |                          |                              | ✗ (improper)           |                   |                  |                      |                             |                      |                            |  
  | **Symmetry Principles**          | ✓                | ~ (only for scalars)     | ✗                            | ~                      | ✓                 | ✓                | ✓                    | ✓                           | ✗                    | ✓                          |  
  | *e.g., invariant measures*       |                  |                          |                              |                        |                   |                  |                      |                             |                      |                            |  
  | **Maximum Entropy**              | ✓                | ✗                        | ✗                            | ✓                      | ✓                 | ~ (re-maximize) | ✓                    | ✗                           | ✓                    | ✓                          |  
  | *Maximize uncertainty*           |                  |                          |                              |                        |                   |                  |                      |                             |                      |                            |  
  | **Subjective Bayesianism**       | ~ (optional)     | ~ (arbitrary)            | ✗                            | ~                      | ✓                 | ✓                | ✓                    | ~                           | ~                    | ✗                          |  
  | *"Priors = opinion"*             |                  |                          |                              |                        |                   |                  |                      |                             |                      |                            |  
  | **"No Solution" View**           | ✗                | ✗                        | ✗                            | ~                      | ✓                 | ✓                | ✗                    | ✗                           | ✗                    | ✗                          |  
  | *(Rejects objective priors)*     |                  |                          |                              |                        |                   |                  |                      |                             |                      |                            |  

  #### **Explanatory Notes:**  
  - **Classical Indifference:**  
    - Works for symmetric discrete cases (e.g., dice) but fails scale/partition invariance in continuous spaces (e.g., cube volume). Violates non-dogmatism for unbounded parameters.  
  - **Symmetry Principles:**  
    - Uses group invariance (e.g., rotational symmetry → uniform angle). Fails partition invariance: uniform angle ≠ uniform \(\cos(\theta)\).  
  - **Maximum Entropy:**  
    - Maximizes entropy given constraints (e.g., uniform distribution if no constraints). Violates scale invariance: uniform \(x\) ≠ uniform \(x^2\).  
  - **Subjective Bayesianism:**  
    - Avoids Dutch books via coherence but allows arbitrary priors. Rejects universality, so conflicts with anti-subjectivity (10).  
  - **"No Solution" View:**  
    - Argues that genuine ignorance admits no objective prior. Satisfies only coherence/updating but fails symmetry, definiteness, and anti-subjectivity.  

  ---  
  ### **Implications for Your Novel**  
  - **Fraud Potential:** A method claiming to satisfy *all* universal desiderata (especially partition invariance) is likely fraudulent—no such theory exists for continuous spaces.  
  - **Plausible "Solution":** A symmetry-based or MaxEnt approach could appear rigorous but collapses under reparametrization (e.g., cube edge → volume). This flaw could drive the plot: her testimony/bets fail when an opponent reframes the problem.  
  - **Most Eliminative Requirement:** If your character insists on **partition invariance**, she rejects all mainstream methods—setting up her downfall when confronted with scale-dependence (e.g., betting on length vs. volume).  
  - **Endgame Ruin:** Her method could "ruin someone" by assigning false certainty (e.g., non-dogmatism violation) or being Dutch-booked via inconsistent repartitioning.  

  Use these tensions to expose her hubris: she solves ignorance only by ignoring its paradoxes.
