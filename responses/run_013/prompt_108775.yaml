prompt: |-
  I am a third-year doctoral candidate in political theory, and in a fortnight I shall present the central chapter of my thesis at a departmental workshop. The chapter argues that the republican ideal of freedom as non-domination cannot be extended to what I call infrastructural dependence: the condition of agents whose feasible options are fixed by privately held systems — payment rails, ranking algorithms, identity providers, logistics networks — that they can neither exit, contest, nor materially influence. I claim that any attempt to extend republicanism to this case either reduces non-domination to a species of negative liberty, once we drop the assumption that domination requires a dominator possessed of a will and a capacity to interfere, or else inflates the concept until every unchosen constraint counts as domination, at which point it ceases to be distinguishable from a socialist account of exploitation. My positive proposal is a two-tier account that keeps interference and dependence analytically separate and treats contestability as a standing relation rather than an episodic remedy.

  The audience is small and I know it precisely: one Pettit-trained republican who has written on domination in the workplace and will defend the modal character of the capacity to interfere; one Cambridge-school historian of political thought who suspects that the digital economy is being read through eighteenth-century categories that do not fit it; one Kantian legal philosopher who will ask what juridical form my contestability relation could possibly take; one economist who will want to know what work "dependence" does that "market power" does not already do; and one critical theorist who regards the entire republican vocabulary as a liberal alibi for capital.

  Draft my question-and-answer preparation sheet: the six or seven objections this room will actually put to me, rather than the stock objections I would meet in the literature, ordered by how much damage each would do to the chapter; each phrased in the vocabulary of the person most likely to raise it; each followed by a two-minute reply, a note on what I should concede outright, and a note on the weakest joint in that reply. Include, separately marked, the question I am hoping nobody asks. Do not summarise my argument back to me. Hard limit: 900 words. Write in British English.
reasoning: |-
  Hmm, the user is a doctoral candidate in political theory preparing for a workshop presentation. They've shared their chapter thesis on why republican freedom as non-domination fails to address infrastructural dependence - those privately controlled systems like payment networks or algorithms that people can't exit or influence. They want me to draft a Q&A preparation sheet anticipating specific objections from their actual audience members.

  The user describes five distinct audience members: a Pettit-trained republican, a Cambridge-school historian, a Kantian legal philosopher, an economist, and a critical theorist. Each will likely approach their argument with different disciplinary concerns. The challenge is crafting objections in each person's vocabulary while avoiding generic literature responses.

  I need to create 6-7 potential objections ordered by how damaging they'd be to the chapter. For each, I'll include: the objection phrased in the questioner's style, a two-minute reply, what to concede, and the weakest point in that reply. Plus one dreaded question they hope nobody asks. All within strict British English and 900 words.

  For the most damaging objection, I'm considering the critical theorist's challenge that republicanism inherently serves capitalist interests - this cuts to the core of their framework. Next would be the Pettit republican's concern about abandoning domination's modal character, which threatens their core theoretical move. Then the economist's query about "dependence" vs "market power" that could undermine their conceptual innovation.

  The Cambridge historian's objection about anachronistic categories comes next, followed by the Kantian's question about juridical forms for contestability. The economist might also ask about non-private infrastructure comparability. The dreaded question would be about democratic control feasibility - the user seems to avoid prescribing solutions.

  For replies, I'll focus on maintaining their core distinction between interference and dependence while acknowledging theoretical tensions. The concessions should show scholarly humility without surrendering key claims. Weakest joints often lie where their positive proposal meets practical implementation.

  I'll structure this with clear headings for each objection and ensure strict adherence to the word limit by keeping replies concise and analytically precise. The tone should remain academic but vivid enough to simulate real workshop dynamics.
answer: |-
  Here is your Q&A preparation sheet, ordered by potential damage to the chapter's core claims:

  1.  **Objector: Critical Theorist**
      *   **Objection:** "Isn't this entire exercise in republican conceptual surgery just a sophisticated salvage operation? By conceding republicanism *cannot* capture infrastructural power, yet clinging to its vocabulary for 'interference', aren't you tacitly endorsing its core flaw: treating capital's structural violence as mere 'interference' between juridical equals, thereby obscuring exploitation and rendering systemic domination illegible? Doesn't your 'two-tier' account preserve liberalism's alibi?"
      *   **Reply (2 mins):** My aim is diagnostic precision, not salvage. I agree republicanism *as currently constituted* struggles with structural power. My critique highlights this precisely *because* it reveals a conceptual blind spot liberalism shares. The "two-tier" account doesn't equate interference with structural dependence; it insists they are distinct *types* of unfreedom requiring distinct analysis. Recognising infrastructural dependence *as a distinct phenomenon* is the first step towards making it legible – potentially for *critical* analysis that goes beyond liberalism. I'm not preserving an alibi; I'm exposing a limitation that necessitates new tools.
      *   **Concede:** Republicanism, especially in its liberal variants, *has* historically been used to obscure structural power. My framework *might* be co-opted, though I aim to prevent this.
      *   **Weakest Joint:** Can "exposing the limitation" avoid functionally reinforcing liberal categories if I retain 'interference'? Does my framework *really* enable a critique of exploitation, or just a different description of power?

  2.  **Objector: Pettit Republican**
      *   **Objection:** "You claim extending non-domination to infrastructural dependence either reduces it to negative liberty or inflates it beyond recognition. But isn't this a false dilemma? You discard the 'dominator with a will' too quickly. Infrastructural systems *are* shaped by human agents (owners, designers, regulators) whose *intentional design choices* create a *modal*, counterfactual-sensitive capacity for interference – the very essence of domination. Doesn't overlooking this anthropic root conflate systemic effects with the agential power republican freedom targets?"
      *   **Reply (2 mins):** While human agents design systems, the *dominating power* in infrastructural dependence stems from the *system's position and function*, not the specific counterfactual wills of its controllers. The dependence exists *regardless* of whether current controllers *would* arbitrarily interfere; it arises from the structural inability to exit or contest the *system's* rules. Focusing on the designers' *potential* interference risks reducing non-domination to fearing specific agents' whims – closer to negative liberty – rather than objecting to the unchosen, uncontestable *structure* enabling *any* controller's potential interference. The *system itself* becomes the locus of domination.
      *   **Concede:** Human agency is crucial in creating and maintaining these systems. The "capacity to interfere" *is* modal, but it's diffused and systemic.
      *   **Weakest Joint:** Does this fully escape the anthropic root? Isn't the system's power *derived* from delegated human agency? Can "system as locus" be rigorously defined within republican modal logic?

  3.  **Objector: Economist**
      *   **Objection:** "You introduce 'infrastructural dependence' as distinct. But economists already analyse private control over essential platforms/networks as 'market power' or 'bottleneck monopolies'. What conceptual work is 'dependence' doing here that 'market power' – measurable via price effects, barriers to entry, and consumer surplus loss – doesn't capture more precisely and operationally? Isn't this just rebranding?"
      *   **Reply (2 mins):** Market power focuses on *market outcomes* (prices, choice, efficiency). Infrastructural dependence focuses on *political status* – the agent's *relation* to the systems that define their feasible options. Market power might *cause* dependence, but dependence describes the *condition* of being subject to unchosen, uncontestable private rules governing essential life activities (e.g., identity verification, payment, communication). An agent can be dependent *without* paying monopoly prices (e.g., a free, dominant identity provider) and suffer market power *without* infrastructural dependence (e.g., high prices for a substitutable good). Dependence is about structural subordination, not allocative inefficiency.
      *   **Concede:** Market power is often a key *source* of infrastructural dependence. Economic analysis is vital for diagnosing causes.
      *   **Weakest Joint:** Can the "political status" of dependence be rigorously defined *without* reference to economic concepts like essentiality, lack of substitutes, and network effects? Isn't it parasitic on economic analysis?

  4.  **Objector: Cambridge-School Historian**
      *   **Objection:** "Your critique hinges on applying a concept forged in debates about sovereign power, slave-owners, and arbitrary magistrates to digital platforms. Isn't this a category error? Eighteenth-century republicans feared concentrated *political* will. You're diagnosing power embedded in complex, impersonal, socio-technical *systems*. Doesn't stretching 'domination' this far risk becoming a misleading analogy, obscuring the genuinely novel character of infrastructural power more than it illuminates?"
      *   **Reply (2 mins):** I agree the *mechanisms* are novel. However, the core *political concern* – individuals subject to unchosen rules they cannot challenge, enforced by powers they cannot escape – shares a fundamental logic with historical republican fears. The analogy highlights a *structural similarity in the condition of unfreedom*, not an identity of mechanisms. Using the republican lens helps us see that infrastructural power *is* political power, not merely economic or technical. It forces us to ask republican questions about arbitrary power and freedom, even if the answers require new conceptual tools alongside the old.
      *   **Concede:** The analogy has limits; the phenomenology and scale are profoundly different. Novel vocabulary *is* needed.
      *   **Weakest Joint:** Does identifying a "structural similarity" do enough to address the historian's concern about distorting both past concepts and present novelty? Is the shared logic substantial enough?

  5.  **Objector: Kantian Legal Philosopher**
      *   **Objection:** "You propose 'contestability as a standing relation'. But relations require juridical form. What *is* this relation? Who are the parties? What are the procedures? If it's not a legal right enforceable against a specific duty-bearer (like non-domination implies against a dominator), is it just an aspiration? Without specifying its juridical character, doesn't 'standing contestability' collapse into vagueness, failing to provide the actionable remedy republicanism promises?"
      *   **Reply (2 mins):** You pinpoint the challenge. Contestability here cannot be reduced to a traditional legal claim against a specific agent; it concerns the *governance structure* of the infrastructure itself. The juridical form must evolve. It could involve: enshrining user rights to *participate* in standard-setting bodies; establishing independent public auditors with powers to investigate systemic effects; creating Ombudsman mechanisms with binding rulings on fair procedure; or recognising collective bargaining units for user communities. The "parties" are the infrastructural operator and the user collective. It’s about institutionalising voice beyond episodic litigation.
      *   **Concede:** This is underdeveloped in the chapter; specifying viable juridical forms is a major task for the next stage.
      *   **Weakest Joint:** Does this avoid simply creating new, potentially equally unaccountable, bureaucratic structures? Is "collective bargaining" for users of a payment network legally coherent or practical?

  6.  **Objector: Economist (Follow-up)**
      *   **Objection:** "You contrast infrastructural dependence with state infrastructure. But isn't dependence often *worse* with state monopolies? Citizens can't exit the passport office or tax authority either, and contesting them is notoriously hard. Doesn't this undermine your claim that private control is uniquely problematic for non-domination?"
      *   **Reply (2 mins):** State infrastructure *can* be dominating! Republicanism has always worried about state power. The key difference is *potential for democratic contestation*. Citizens, *in principle*, have a collective political channel (however imperfect) to contest state infrastructure through democratic processes. Private infrastructural power exists largely *outside* that sphere – shareholders aren't accountable to users. My framework doesn't absolve the state; it highlights a *new locus* of dominating power where even the *potential* for democratic contestation is structurally absent. The remedy for state domination is improving democracy; for private infrastructural domination, it's creating *new* forms of accountability.
      *   **Concede:** State infrastructure often *is* dominating in practice. Democratic channels are frequently weak or blocked.
      *   **Weakest Joint:** Isn't the "in principle" democratic accountability of the state often so weak in practice that the distinction from private power blurs significantly? Does this overstate the feasibility of contesting *state* infrastructure?

  **The Question You Hope Nobody Asks:**
  *   **Objector:** (Likely Critical Theorist or Economist)
  *   **Question:** "Your 'standing contestability' sounds institutionally complex. Given the scale, opacity, and global nature of these infrastructures, isn't effective contestability realistically only achievable through some form of *public ownership* or *radical decommodification*? Doesn't your careful analytical separation ultimately collapse into the socialist critique of private property you tried to distinguish yourself from, revealing your two-tier model as a halfway house avoiding the necessary political conclusion?"
