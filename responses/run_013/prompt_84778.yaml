  The conceptual issues are trickier. Once we understand department choice acts as a collider, the paradox dissolves - it's just a case of selection bias. The choice between pooled/disaggregated views depends entirely on the causal question: "overall discrimination" vs "decision-process fairness". I should note that further disaggregating departments wouldn't change the reversal pattern since the collider structure remains. 

  This implies aggregation isn't inherently illegitimate - it depends on whether the stratifying variable is a mediator, confounder or collider. The user seems to want ammunition against oversimplified "always disaggregate" arguments, so I'll stress that causal structure determines validity.

