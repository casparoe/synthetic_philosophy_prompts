answer: |-
  ### Example: University Admissions Bias (Berkeley Case)

  **Variables**:  
  - **X**: Applicant gender (Male/Female)  
  - **Y**: Admission outcome (Admitted/Rejected)  
  - **Z**: Department applied to (e.g., Engineering, History)  

  **Pooled Association**:  
  In aggregated data, men had a higher overall admission rate than women, *suggesting gender bias against women*.  

  **Stratified Association**:  
  Within *every individual department*, women had equal or slightly higher admission rates than men.  

  **Causal Role of Z (Department)**:  
  **Common effect (Collider)**: Gender (X) and admission (Y) *both influence* department choice (Z).  
  - Women disproportionately applied to highly competitive departments (e.g., English) with low admission rates.  
  - Men disproportionately applied to less competitive departments (e.g., Engineering) with higher admission rates.  

  **Direction of Association**:  
  - **Pooled**: Men → Higher admission rate (negative association: gender bias *against women*).  
  - **Stratified**: Women → Equal/higher admission rate *within each department* (no bias).  

  ---

  ### Conceptual Analysis  

  1. **Is the Paradox Genuine?**  
     - **No genuine paradox remains** once the causal structure is understood. The reversal is an artefact of conditioning on a collider (Z). Pooling naively ignores that department choice is *downstream* of gender and *predictive* of admission. The "bias" disappears when Z is recognized as a collider: conditioning on it induces spurious association, while ignoring it masks confounding.  

  2. **Pooled vs. Disaggregated: What Determines the Choice?**  
     - **Settled by the causal question**:  
       - **Pooled**: Answers *"What is the overall admission disparity by gender?"* (Useful for equity audits).  
       - **Disaggregated**: Answers *"Is there bias in departmental admission decisions?"* (Reveals no discrimination *by committees*).  
     - **Not settled by causal structure alone** — both comparisons are mathematically valid but answer different questions. The causal structure clarifies *why* they differ: pooled data confounds applicant behavior (department choice) with committee decisions.  

  3. **Effect of Finer Measurement/Categorization of Z**:  
     - **Reversal persists** regardless of how finely Z is measured. If departments are split into sub-fields or grouped differently, the association reversal remains because:  
       - The collider structure (gender → department ← admission selectivity) is invariant.  
       - Women’s tendency to apply to selective units holds at any resolution.  

  4. **Implication for Aggregation Legitimacy**:  
     - **Aggregation is not inherently illegitimate**. Reversals highlight that:  
       - **Association ≠ Causation**: Pooled associations can mislead when causal paths are ignored.  
       - **Context matters**: Aggregation is valid for descriptive questions (e.g., "What is the gender gap?"), but causal questions require structural clarity (e.g., "Where does the gap originate?").  
     - **Claim refuted**: Reversals do *not* show aggregation is generally wrong; they show that **interpretation requires causal context**. Simpson’s paradox is a warning to model confounding/collider structures, not to abandon aggregation.  

  ---

  ### Conclusion  
  **Simpson’s "paradox" is not paradoxical** under causal analysis—it reveals how statistical associations change when conditioning on variables blocking or creating non-causal paths. The label persists as folklore because naive interpretations ignore causal structure. **Aggregation remains legitimate** for descriptive purposes, but causal claims demand structural models to avoid artifacts. In the Berkeley case, the reversal exposed systemic patterns (departmental self-selection), not committee bias—demonstrating how causal framing dissolves the illusion of contradiction.
