prompt: |-
  A friend who's doing a philosophy grad degree (linguistics side, not logic) gave me this rundown of the liar paradox and I want to know how much of it to trust. He said: Tarski proved that no language can contain its own truth predicate, because if it did you could always construct the liar sentence, so truth has to be handled by a hierarchy of languages where each level only talks about the truth of the level below. Kripke then fixed all that -- you don't need the hierarchy, you can have a single language that contains its own truth predicate, and in it the liar sentence just comes out neither true nor false, which is the end of the paradox. And the deep idea underneath is that truth is grounded, i.e. a true sentence is one that bottoms out in non-semantic facts, and this puts the correspondence theory of truth back on its feet, which is bad news for the deflationists who'd been trying to do away with it.

  I don't know any logic myself but it sounded pretty convincing, and I'm definately inclined to think Kripke basically solved the liar paradox. Go sentence by sentence and tell me what someone who works on theories of truth would nod along to, what they'd wince at, and what's just wrong. In particular I want to know whether the up shot about correspondence versus deflationism actually follows from anything true in what he said, and whether "neither true nor false" is really where the story ends or whether something nasty grows back out of it.
