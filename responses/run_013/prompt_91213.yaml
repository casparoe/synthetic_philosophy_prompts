answer: |-
  Your friend gives a good *overview* of the standard narrative, but it's significantly oversimplified and misses crucial nuances. Here's a breakdown sentence by sentence:

  1.  **"Tarski proved that no language can contain its own truth predicate, because if it did you could always construct the liar sentence..."**
      *   **Nod Along:** Absolutely correct for *classical* (bivalent: only True/False), *sufficiently expressive* (can do basic arithmetic or syntax), *consistent* formal languages. Tarski's Undefinability Theorem is a landmark result. The Liar Paradox is the core motivation and driving force.

  2.  **"...so truth has to be handled by a hierarchy of languages where each level only talks about the truth of the level below."**
      *   **Nod Along:** This is indeed Tarski's *proposed solution* within his framework. A language L0 talks about non-semantic facts. Its truth predicate 'True-in-L0' is defined in a metalanguage L1. The truth predicate for L1 ('True-in-L1') is defined in L2, and so on. The Liar sentence ("This sentence is false") cannot be formulated within any *single* level of this hierarchy.
      *   **Wince:** While it avoids the paradox technically, many philosophers (including Kripke) found this hierarchy *artificial* and *inadequate* for capturing natural language, where we intuitively want to talk about the truth of sentences *within* our own language, including sentences that themselves talk about truth. It seems overly restrictive.

  3.  **"Kripke then fixed all that -- you don't need the hierarchy, you can have a single language that contains its own truth predicate..."**
      *   **Nod Along:** Kripke's 1975 paper "Outline of a Theory of Truth" was revolutionary precisely because it offered a *model* for a language containing its own truth predicate without immediately collapsing into contradiction.
      *   **Wince:** "Fixed all that" is too strong. Kripke provided a powerful *alternative framework*, not a definitive "fix" that makes the problem disappear entirely. His solution comes with significant costs and limitations. Also, Kripke's model is *one* among several approaches to truth (Revision Theory, Contextualist approaches, Paraconsistent logics, etc.).

  4.  **"...and in it the liar sentence just comes out neither true nor false, which is the end of the paradox."**
      *   **Nod Along:** This is the core of Kripke's solution. He uses a *three-valued* logic (True, False, Neither - often based on Kleene's strong logic) or allows for *truth-value gaps*. The Liar sentence ("This sentence is not true") is not grounded; evaluating it leads to an infinite loop without connecting to non-semantic facts. Kripke rigorously defines (via "fixed points") how such a predicate can consistently exist, assigning "Neither" to paradoxical sentences like the Liar.
      *   **Wince/Just Wrong:** **This is where the big problem lies. It is emphatically NOT "the end of the paradox."** Something nasty *does* grow back:
          *   **The Strengthened Liar:** Consider the sentence: "This sentence is *not true*." (The standard Liar is often phrased as "not true" in Kripkean contexts). In Kripke's model, it's assigned "Neither". But now consider: *What is the status of the claim that it is not true?* If it's *true* that the Liar is not true, then the Liar sentence itself ("I am not true") would seem to be... *true*! But Kripke assigned it "Neither", not "True". Contradiction. If it's *false* that the Liar is not true, then the Liar must be true... again contradicting its assigned status of "Neither". If we say the claim "The Liar is not true" is itself *neither true nor false*, then we seem to need a fourth value or a hierarchy *for the meta-claim about the Liar's status*. This is the **Revenge Problem**. Kripke himself acknowledged this issue. His framework handles the *simple* Liar but struggles with sentences that comment on their *own* lack of a truth value or the truth status of other ungrounded sentences.

  5.  **"And the deep idea underneath is that truth is grounded, i.e. a true sentence is one that bottoms out in non-semantic facts..."**
      *   **Nod Along:** This captures the *intuition* behind Kripke's construction beautifully. "Groundedness" is the key concept. A sentence's truth value is determined by its connection, through the truth predicate, ultimately to sentences that don't use the truth predicate and talk directly about the world. The Liar fails to be grounded. Kripke formally defines this using fixed points.
      *   **Slight Wince:** While groundedness is central to Kripke's *construction* and *avoids* paradox, it's debatable whether this is *the* "deep idea" of truth *itself*, or rather a necessary feature for a consistent *definition* of truth within a single language containing its own predicate.

  6.  **"...and this puts the correspondence theory of truth back on its feet, which is bad news for the deflationists who'd been trying to do away with it."**
      *   **Wince/Disagreement:** This is a significant overstatement and misrepresentation of the philosophical implications.
          *   **Correspondence Theory:** Kripke's model *resonates* with correspondence intuitions because grounded truth ultimately depends on non-semantic, worldly facts. However, his formal machinery (fixed points, partial models, three-valued logic) is quite different from traditional correspondence theories. Correspondence theorists might *use* Kripke's work, but it doesn't single-handedly "put correspondence back on its feet" as *the* correct theory. Many other theories exist.
          *   **Deflationism:** This is **highly contestable**. Deflationists (like Paul Horwich) argue that Kripke's work doesn't refute them at all:
              *   Deflationism focuses on the *disquotational* property of truth ("'Snow is white' is true iff snow is white") as exhaustive. Kripke *uses* this schema but restricts its application to grounded sentences to avoid paradox. Deflationists can accept this restriction as a technical necessity for consistency without conceding that truth is a substantial "correspondence" property.
              *   Deflationism is fundamentally about the *role* of the truth predicate (enabling generalization, endorsement, etc.). Kripke's model *preserves* this role for grounded sentences and provides a formal framework where a deflationary truth predicate *can* consistently exist in its own language – something Tarski seemed to rule out. Some argue Kripke *helps* deflationism by showing how a minimally substantial truth predicate can work.
              *   Deflationists can readily accept truth-value gaps or adopt a Kripke-like framework while maintaining that the *concept* of truth isn't substantive beyond its disquotational role and utility for generalization. The *groundedness* requirement can be seen as a consequence of avoiding paradox within the logic, not as revealing a deep "correspondence" nature of truth.
          *   Kripke's work didn't decisively settle the correspondence vs. deflationism debate. Both sides engage with it and find elements to support their views or challenge the other side.

  **Summary & Answers to Your Specifics:**

  1.  **How much to trust?** Trust the *broad strokes*: Tarski's hierarchy as a response, Kripke's alternative with a single language/truth predicate and truth-value gaps for the Liar, the concept of groundedness. Be *highly skeptical* of claims that Kripke "fixed all that" or that this is the "end of the paradox". The **Revenge Problem (Strengthened Liar)** is a major unsolved issue within Kripke's framework.
  2.  **"Neither true nor false" - End of the story?** **Absolutely not.** The Strengthened Liar shows that assigning "neither" leads to new paradoxes when we try to *state* that status. This is the core "nasty thing" that grows back. Kripke provided an ingenious model that handles the original Liar but opened the door to new, related problems. The Liar Paradox, in various forms, remains a deep and active area of research.
  3.  **Upshot for Correspondence vs. Deflationism?** **No, it doesn't cleanly follow.** While Kripke's groundedness has a *correspondence flavor*, it's a formal construct within a specific logical framework. Deflationists can, and do, accommodate Kripke's insights (truth-value gaps, consistency via partial definition) without abandoning their core thesis that truth isn't a substantive correspondence relation. Kripke's work is a crucial tool in the debate, but not a decisive victory for either side. Your friend's claim that it's "bad news for deflationists" is an oversimplification reflecting one philosophical interpretation, not a logical consequence.

  Kripke's work is profound and reshaped the field, but it's a framework for *managing* the paradox within certain logical confines, not a magic bullet that makes it vanish. The philosophical debate about the nature of truth continues vigorously.
