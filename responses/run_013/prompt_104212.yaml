answer: |-
  ## Research Proposal: Structure, Invariance, and the Unsettled Ground of Structural Realism

  **1. Research Question:**  
  Does the distinction between epistemic structural realism (ESR) and ontic structural realism (OSR) fundamentally depend on, and collapse into, differing prior commitments regarding *which types of invariance* constitute scientific structure, rendering the debate potentially verbal rather than substantive?

  This question has two determinate, mutually exclusive answers:  
  **(A) Yes:** The ESR/OSR distinction is largely a consequence of unacknowledged disagreements about the relevant invariance class. Recasting in terms of invariance dissolves the apparent metaphysical disagreement.  
  **(B) No:** The ESR/OSR distinction survives the recasting. Disagreements about invariance types are orthogonal to, or insufficient to account for, the core metaphysical disagreement concerning the nature of structural knowledge versus structural ontology.

  **2. The Gap in Existing Positions:**  
  The ESR/OSR debate proceeds as if "structure" – defined as what is preserved through theory change – is a sufficiently clear and shared starting point. The core disagreement is framed as whether this preserved structure constitutes our *knowledge* of an underlying ontology (ESR) *is* the fundamental ontology itself (OSR). Both positions implicitly treat "structure" as a monolithic, well-defined concept.

  However, this shared ground is illusory. "Structure" functions primarily as a placeholder. The *actual content* attributed to "preserved structure" is tacitly supplied by different background assumptions about *what kind of invariance matters* for continuity:
  *   **Formal Invariance:** Structure is identified with the preservation of specific mathematical formalisms or equations (e.g., the Poisson bracket structure in classical/quantum mechanics transition).
  *   **Law Symmetry Invariance:** Structure is identified with the preservation of fundamental symmetries governing laws (e.g., Lorentz invariance across relativity theories).
  *   **Relational Invariance:** Structure is identified with the preservation of stable patterns of relations among observable phenomena or quantities (e.g., functional relationships between pressure, volume, and temperature preserved across thermodynamic theories).

  Existing positions within the ESR/OSR spectrum do not systematically interrogate this dependence. They typically presuppose one type of invariance (often formal) as definitive of "structure," without justifying this choice against alternatives or examining how shifting the invariance criterion might reshape the very nature of the ESR/OSR debate. Consequently, the debate proceeds without addressing whether its central distinction rests on this unexamined foundation, leaving the question of its substantive nature unresolved.

  **3. Methodology: Recasting via Invariance Types**  
  The core method is to systematically recast the ESR/OSR debate by explicitly foregrounding the invariance criterion as the primary variable. This approach is superior to adjudicating ESR vs. OSR on their own terms (e.g., by analyzing historical theory changes) because it directly targets the potential source of confusion (the ambiguity of "structure") and offers a clearer analytical lens.

  **Concrete 12-Month Plan:**

  *   **Months 1-3: Conceptual Taxonomy & Framework Development:** Rigorously define and distinguish the three invariance types (Formal, Law Symmetry, Relational). Analyze how each type conceptually maps onto notions of "structure" within the realism debate. Develop a clear framework for expressing ESR and OSR theses *conditional* upon adopting a specific invariance criterion. Draft initial formulations of how key arguments (e.g., the Pessimistic Meta-Induction for ESR, the Central Claim for OSR) manifest under each invariance type.
  *   **Months 4-6: Case Study Analysis I - Formal & Law Symmetry Invariance:** Select 1-2 well-documented historical episodes of significant theory change (e.g., Newtonian Gravity to General Relativity; Classical Mechanics to Quantum Mechanics). Analyze these episodes meticulously through the lens of *Formal Invariance* and *Law Symmetry Invariance*. For each episode and each invariance type: (a) Identify what, if anything, is preserved. (b) Articulate what ESR and OSR would claim *given this specific preservation*. (c) Assess whether the ESR/OSR distinction appears substantive or collapses under this specific lens. Document ambiguities and challenges.
  *   **Months 7-9: Case Study Analysis II - Relational Invariance & Comparative Assessment:** Analyze the same historical episodes through the lens of *Relational Invariance*. Repeat steps (a)-(c) above. Synthesize findings across all three invariance lenses for each case study. Crucially: Compare the *nature* of the ESR/OSR debate *across* the different lenses. Does the apparent disagreement between ESR and OSR shift dramatically depending on which invariance type is foregrounded?
  *   **Months 10-12: Synthesis, Philosophical Assessment & Triviality Analysis:** Integrate results. Systematically evaluate the research question: Does the ESR/OSR distinction hold independently of the invariance criterion, or does it derive from it? Articulate the conditions under which the debate appears substantive versus verbal. Confront the **Triviality Worry**: Does defining structure via specific invariance types mitigate the concern that "any structure can be imposed"? *Assessment:* Focusing on *specific, empirically grounded types of invariance* (like symmetry principles or robust functional relations) provides concrete constraints lacking in purely abstract structuralism. However, the recasting does not *eliminate* the worry. It reframes it: the challenge becomes justifying why *this* invariance type (e.g., symmetry) is ontologically privileged over others or over non-structural elements. The project can clarify *where* the burden lies but may not definitively resolve it. Draft final manuscript presenting the analysis, conclusions, and implications for the structural realism debate.

  **4. Possible Results and Failure Conditions:**

  *   **Result A (Verbal Distinction):** The analysis demonstrates that proponents labeled "ESR" or "OSR" effectively build their core metaphysical commitment (knowledge-only vs. ontology-is-structure) *into* their preferred invariance criterion from the outset. Arguments presented as for/against ESR/OSR are primarily arguments for/against privileging a particular invariance type. The ESR/OSR labels add little substantive content beyond this.
  *   **Result B (Substantive Distinction):** The analysis reveals that, even after fixing the invariance type (e.g., Law Symmetry), genuine and persistent metaphysical disagreements about the interpretation of that invariant structure remain, corresponding robustly to the ESR/OSR divide. The choice of invariance type influences *what* the structure is, but not the *nature* of the debate about its epistemological or ontological status.
  *   **Project Failure (vs. Negative Result):** Failure would occur if the analysis yields no clear pattern or insight. This could happen if: (1) The defined invariance types prove incoherent, indistinguishable in practice, or impossible to apply consistently to case studies. (2) Case studies are too ambiguous to support any mapping between invariance and structuralist claims. (3) The recasting exercise generates more confusion than clarity, failing to provide a novel or useful perspective on the existing debate. (A result supporting **A** or **B** is a successful conclusion, even if negative for the initial hypothesis).

  **5. Scope and Manageability Assessment:**  

  *   **Potential Overextension:** The primary risk is attempting too many case studies or overly complex historical episodes. Analyzing multiple invariance types across multiple transitions is ambitious. The triviality worry also opens a deep metaphysical rabbit hole.
  *   **Mitigation Strategy:** Focus is key. The proposal prioritizes **depth over breadth** in case studies. Starting with 1-2 canonical, well-analyzed transitions (e.g., focusing intensely on the transition from Fresnel's elastic solid ether theory to Maxwell's electromagnetic field theory, examining formal equations, symmetry principles, and relational patterns like reflection/refraction laws) is essential. If time pressure mounts, the second case study (Month 7-9) could be reduced in scope or depth, or the analysis of one invariance type (likely Relational) streamlined based on initial findings. The project explicitly *does not* aim to solve the triviality worry definitively but to assess whether the invariance recasting offers a productive way to frame it and constrain it compared to the abstract formulation.
  *   **Honest Scope:** This project reconfigures the debate rather than conclusively resolving it. Success means demonstrating whether the ESR/OSR distinction is robust to, or dependent upon, foundational choices about invariance. It clarifies the conceptual landscape and identifies potential verbal components. It will not provide a final adjudication of structural realism itself or fully resolve the deep metaphysical issues underlying the triviality objection, but it aims to show whether the current framing of the debate obscures or illuminates those deeper issues. The one-year timeframe is demanding but achievable with disciplined focus on the core recasting methodology applied to a manageable set of conceptual analyses and historical examples.
