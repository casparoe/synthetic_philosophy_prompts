prompt: |-
  For a series we are running on how people get trapped in bad decisions, a colleague has filed a draft sidebar on the dollar auction, and I need to know how much of it can go to press. The gist of his draft, near enough to his own words, is this:

  The dollar auction is a game theorist's party trick, designed to show how easily sensible people can be led into ruin. The auctioneer offers a dollar. Bidding is open and ascending, and the twist is that the two highest bidders both pay what they bid, though only the winner receives the dollar. Two bidders will push each other past a dollar, past five dollars, past twenty. The reason is the sunk-cost fallacy: having invested so much in the chase, neither can bear to write off the loss, and each new bid is a way of refusing to admit that the earlier bids were a mistake. This is what psychologists call escalation of commitment, and the dollar auction is the purest laboratory demonstration of it — the same pathology that keeps companies pouring money into failing projects and governments into unwinnable wars. What is most striking is that rational choice theory has nothing to say here: a rational bidder would never bid more than a dollar for a dollar, so the bidding war is a straightforward refutation of the assumption that people maximise expected value. The practical lesson for our readers is to set a limit before they start bidding and stick to it.

  Two of my colleagues have already weighed in. One says the whole thing is the sunk-cost fallacy in fancy dress. The other says the dollar auction is really a war of attrition and that the psychology is a red herring. My own instinct is that it is a story about stubbornness, though I suspect that is just the folk explanation the draft has already planted in me.

  Please go claim by claim through the draft and tell me what a specialist would accept as stated, what they would accept only with a qualification, and what is simply wrong — and in each case what the correct statement would be. I am particularly interested in whether the escalation in the auction really is a sunk-cost phenomenon, whether "escalation of commitment" is the right label for it or a different thing that has been welded on, and whether the trap survives if the rules are altered — say, if only the winner pays, or if the bids are sealed, or if the auctioneer refunds the runner-up. Then adjudicate between my two colleagues: which of them, if either, has located the mechanism, and why. Finally, tell me whether the draft's closing lesson is the right lesson.

  I want a committed answer rather than a survey. Take a position on whether the escalation is best explained by the psychology of the bidders or by the structure of the game, say which sentences I should cut, and do not hedge by telling me that both factors matter in their own way unless you can also say which one is doing the work here. You need not cite literature; I am after the substance, not a reading list.

  After the audit, give me a table with these columns: Claim (the draft's claim, in a few words); Verdict (one of sound, needs qualification, misleading, wrong); Correction (one or two sentences stating what should have been said); Load-bearing (whether the draft's overall conclusion depends on that claim).
reasoning: |-
  Hmm, the user is asking me to audit a draft sidebar about the dollar auction for a series on bad decisions. They've provided the draft content and want me to evaluate each claim, determine what's accurate versus misleading, and settle a debate between their colleagues about whether this is primarily about the sunk-cost fallacy or a war of attrition. They also want practical advice about the closing lesson for readers.

  The draft makes several key claims: that the dollar auction is a demonstration of sunk-cost fallacy, that it shows escalation of commitment, that rational choice theory can't explain it, and that the lesson is about setting limits. I need to dissect each of these claims based on game theory knowledge.

  Looking at the core mechanism - the sunk-cost fallacy explanation feels incomplete. While bidders do have sunk costs (previous bids), the real trap is the game structure: the second-place bidder faces a choice between accepting a certain loss or escalating to potentially win and reduce that loss. This creates a "war of attrition" dynamic where rational players keep bidding beyond the dollar value. The sunk costs matter only because they create this losing position.

  For the escalation of commitment label - it's applicable but overly broad. The dollar auction specifically models how institutional commitments (like corporate projects or wars) become traps due to competitive dynamics and strategic miscalculation, not just individual psychology.

  The rational choice theory claim is misleading. Game theory actually predicts this escalation through models like the war of attrition. Bidders aren't irrational - they're responding rationally to the terrible incentives built into the rules.

  The practical lesson about setting limits is good but needs refinement. The real danger isn't just weak willpower - it's that the game structure systematically undermines pre-set limits by making escalation seem "rational" in the moment.

  Between the user's colleagues: the "sunk-cost fallacy" colleague oversimplifies, while the "war of attrition" colleague correctly identifies the structural mechanism. The psychology matters in explaining why people play, but the escalation would still trap perfectly rational players.

  For the audit table, I'll break down each major claim with verdicts and note which claims are load-bearing for the overall conclusion. The draft's core message about the trap being dangerous holds, but several explanations need correction to be academically sound while remaining accessible for readers.

  The closing lesson stays but should be strengthened to emphasize that in competitive traps, your "rational" self in the heat of bidding will conspire against your pre-set limits - so the real skill is designing commitments that survive those moments.
answer: |-
  Below is a committed, claim-by-claim audit of your colleague's draft, followed by the requested table. My position is that **the escalation is primarily driven by the game's structure, not psychology**. While psychological factors like the sunk-cost fallacy *facilitate* the trap, they are not necessary for it to occur. A perfectly rational bidder with no psychological biases can still be trapped by the auction's rules.

  ### Claim-by-Claim Audit
  1.  **Claim:** The dollar auction shows how "sensible people can be led into ruin".
      *   **Verdict:** **Sound**. The auction reliably traps participants into paying more than the prize is worth, often significantly more.
  2.  **Claim:** "Two bidders will push each other past a dollar, past five dollars, past twenty."
      *   **Verdict:** **Needs Qualification**. *Qualification:* This outcome is highly likely but not inevitable. It depends on bid increments and bidder sophistication. Very small increments make escalation almost certain. Large initial bids or sophisticated players coordinating (tacitly or explicitly) *can* avoid it, but the incentive structure strongly pushes towards escalation.
  3.  **Claim:** "The reason is the sunk-cost fallacy... neither can bear to write off the loss, and each new bid is a way of refusing to admit that the earlier bids were a mistake."
      *   **Verdict:** **Misleading/Wrong**. *Correction:* The sunk-cost fallacy is a common *psychological explanation* but not the core *reason* rational players escalate. The structural reason is that once bids are placed, the second-highest bidder faces a choice: accept a certain loss equal to their *current* bid, or bid slightly higher for a chance to win the dollar and reduce their *total* loss. Rational players choose the latter, even if it means bidding over a dollar. The sunk costs create the *position* (being the loser) but the *decision* to escalate is forward-looking and can be rational given the rules.
  4.  **Claim:** "This is what psychologists call escalation of commitment..."
      *   **Verdict:** **Needs Qualification**. *Qualification:* While the outcome *looks like* escalation of commitment, the dollar auction is primarily a model of a **war of attrition**, a specific game-theoretic structure. Escalation of commitment is a broader psychological phenomenon often observed in non-competitive situations (e.g., sticking with a failing project). The dollar auction *exhibits* escalation of commitment, but its mechanism is the strategic logic of the war of attrition game.
  5.  **Claim:** "...the dollar auction is the purest laboratory demonstration of [escalation of commitment]..."
      *   **Verdict:** **Misleading**. *Correction:* It's an excellent demonstration of a **bidding war trap** or **war of attrition**. While it *involves* commitment escalation, calling it the "purest" demonstration misattributes the cause to psychology. Its purity lies in how cleanly the *rules* force rational escalation, independent of psychology.
  6.  **Claim:** "...the same pathology that keeps companies pouring money into failing projects and governments into unwinnable wars."
      *   **Verdict:** **Needs Qualification**. *Correction:* The analogy is *structurally* valid because wars and corporate battles often resemble wars of attrition, where competitors escalate to avoid admitting defeat and crystallizing losses. However, the "pathology" in the dollar auction isn't *just* psychological (like sunk cost fallacy); it's inherent in the competitive strategic dilemma. Psychology often *amplifies* the trap in real-world analogues.
  7.  **Claim:** "What is most striking is that rational choice theory has nothing to say here: a rational bidder would never bid more than a dollar for a dollar..."
      *   **Verdict:** **Wrong**. *Correction:* Rational choice theory, particularly game theory, explains the escalation perfectly via the **war of attrition model**. A rational bidder *would* bid more than a dollar if they are the current second-highest bidder, because paying $(Bid + \epsilon)$ to win $1 is better than paying $Bid and getting nothing (where $Bid is their existing losing bid). The initial bid over a dollar is irrational, but the subsequent escalation by the losing player *is* rational given their position.
  8.  **Claim:** "...the bidding war is a straightforward refutation of the assumption that people maximise expected value."
      *   **Verdict:** **Misleading/Wrong**. *Correction:* It refutes the naive assumption that bidders *only* consider the value of the prize. However, rational bidders *are* maximizing expected value *relative to their current position in the game and the rules*. The second-highest bidder maximizes their (negative) expected value by escalating to avoid a certain loss. The rules make maximizing expected value lead to disaster.
  9.  **Claim:** "The practical lesson for our readers is to set a limit before they start bidding and stick to it."
      *   **Verdict:** **Sound, but Needs Strengthening**. *Correction:* Setting a pre-commitment limit is necessary *but insufficient*. The insidious nature of the trap is that when you are the *losing* bidder, sticking rigidly to your original "value-based" limit feels irrational because you face an immediate, certain loss. The deeper lesson is: **Recognize competitive traps structured like wars of attrition. If entering, set a *binding* pre-commitment limit (e.g., tell a friend who will enforce it) and *never* bid if you are not currently the winner.** The second part is crucial.

  ### Adjudicating Your Colleagues
  *   **Colleague 1 (Sunk-Cost Fallacy in Fancy Dress):** Is **incorrect**. While the sunk-cost fallacy *often occurs* and makes the trap worse/easier to fall into, it is not the core mechanism. The trap works even with perfectly rational players focused only on future outcomes, due to the game's structure. Attributing it solely to sunk costs misdiagnoses the problem.
  *   **Colleague 2 (War of Attrition, Psychology is a Red Herring):** Is **mostly correct, but overstates**. The dollar auction **is fundamentally a war of attrition game**. This structural logic *is* the primary mechanism causing escalation. Psychology (like the sunk-cost fallacy, loss aversion, competitive arousal) is **not a red herring** – it significantly *facilitates* the trap in practice by making people more likely to enter the auction and less likely to find cooperative exits. However, the psychology is *not necessary* for the trap to exist or function. The structure alone suffices.

  **My Position:** The escalation is **best explained by the structure of the game** (a war of attrition). Psychology explains why real humans enter the auction readily and escalate more fiercely, but the trap's existence and the *rationale for escalation once someone is losing* stem from the rules.

  ### The Closing Lesson
  The draft's closing lesson ("set a limit before they start bidding and stick to it") is **directionally correct but dangerously incomplete**. It needs the crucial addendum: **"and crucially, never place a bid if you are not currently the highest bidder."** Sticking to a value-based limit becomes strategically irrational for the losing bidder *within the game*. The only reliable defenses are: 1) Avoid such auctions entirely, or 2) Use a binding pre-commitment mechanism that physically prevents further bids once your limit is reached *or* once you lose the lead.

