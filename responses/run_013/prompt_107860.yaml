  | Same pathology as failing projects/wars                                            | Needs Qualification | Structurally analogous (war of attrition dynamics), but "pathology" in auction is structural/strategic, amplified by psychology in real world.           | No           |
  | **Rational choice theory has nothing to say; rational bidder never bids >$1**      | **Wrong**           | Game theory (RCT) **explains escalation** via war of attrition. Losing bidder rationally bids >$1 to minimize loss. Initial bid >$1 is irrational.        | **YES**      |
  | Refutation of expected value maximization                                          | Misleading          | It refutes naive value-maximization. Bidders *are* maximizing (negative) expected value *given their position and the rules*, leading to disaster.        | Yes          |
  | Lesson: Set limit & stick to it                                                    | Sound (Qualify)     | Necessary but **insufficient**. Add: "**Never bid if you're not the current winner.**" Recognize/binding pre-commitments are key.                        | Yes          |
