  | **Reason is sunk-cost fallacy** (refusing to admit mistake)                        | **Wrong**           | Core reason is structural: Losing bidder rationally bids to avoid crystallizing their loss, even over $1. Sunk costs create the position, not the reason. | **YES**      |
  | **This is "escalation of commitment"**                                             | **Needs Qualification** | Outcome resembles it, but mechanism is the **war of attrition** game. EoC is a broader psychological phenomenon.                                         | **YES**      |
