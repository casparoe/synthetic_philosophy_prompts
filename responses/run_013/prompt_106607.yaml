  I notice they're clearly frustrated with vague answers about definitions - they want a rigorous framework. Their examples span science, philosophy, and everyday life, suggesting they need a principle that travels well across domains. The Pluto and quasiparticle cases seem to trouble them most, where scientific definitions carry theoretical weight.

  Their rewrite test fails interestingly: in the tomato case, removing "vegetable" leaves botanist and cook still disagreeing about culinary rules versus biological classification. This suggests that when words are embedded in different systems (science vs. cooking), the conflict isn't merely verbal. Similarly, the free speech case survives the rewrite because it's about principles of permissibility, not terminology.

  The core tension appears between:
  - Lexical disputes (purely about word definitions)
  - Embedded-term disputes (where words are tied to functional systems)
  - Ontological disputes (about what fundamentally exists)

  Their verdicts mostly hold except the quasiparticle case - calling it "verbal" contradicts their intuition about explanatory power. That's the verdict to sacrifice. The surviving principle would be: disputes are real when the contested term's role in a functional system (science, law, practice) carries non-linguistic consequences.

  For a new test case: "Is waterboarding torture?" Under this framework, it's real - not because we define "torture," but because the label triggers legal obligations and moral evaluations within functional systems. My confidence is high, but would drop if shown that all parties shared identical underlying criteria and only quibbled over labels.
answer: |-
  ### Bottom line (under 100 words)
  There is a unified principle: **A dispute is real if disagreement persists after translating claims into equivalent functional roles within relevant systems (e.g., scientific, legal, culinary), and verbal if it dissolves upon clarifying definitions.** This costs you one verdict: the quasiparticle case must shift from "verbal" to "real," as functional explanatory work matters. It preserves all other judgments, including the tomato case, by recognizing that "vegetable" is embedded in distinct functional contexts (culinary vs. botanical), not just labeling.

  ---

  ### Candidate criteria (about 250 words)
  1.  **Definitional Redundancy Test (DRT)**: *If the disagreement vanishes when both parties explicitly state their definitions of the contested term and agree on all non-linguistic facts, the dispute is verbal.* Motivated by: Hot dog, Pluto, virus cases. (E.g., Astronomers agree Pluto orbits the sun, has moons; they only dispute the label "planet" given agreed-upon characteristics.)
  2.  **Functional Role Entanglement (FRE)**: *A dispute is real if the contested term’s application has non-linguistic consequences within a functional system (e.g., categorization affecting rules, rights, explanations, or practices), even if definitions differ.* Motivated by: Tomato case (culinary classification affects trade, menus; botanical affects taxonomy), Free speech case (labeling a policy as "violating free speech" affects legal/permissibility judgments).
  3.  **Ontological Commitment (OC)**: *A dispute is real if it hinges on whether an entity possesses fundamental properties (e.g., existence, consciousness, identity) that are not reducible to definitional conventions.* Motivated by: Statue/lump case (persistence conditions), AI consciousness case (intrinsic properties), Fetus/person case (moral status).

  ---

  ### Scorecard (run through cases in order)
  1.  **Hot Dog (Verbal)**:
      *   **DRT**: ✅ Disagreement vanishes with definitions: "filling between bread" vs. "separate top/bottom slice."
      *   **FRE**: ✅ No functional consequences (e.g., no impact on laws, recipes, science).
      *   **OC**: ✅ Not about fundamental existence/identity.
  2.  **Pluto (Verbal)**:
      *   **DRT**: ✅ Disagreement vanishes with definitions (e.g., "cleared its orbit" vs. "hydrostatic equilibrium").
      *   **FRE**: ❗️ **Breaks here.** Functional consequences exist (e.g., teaching, cataloging). But DRT holds, so verbal verdict stands.
      *   **OC**: ✅ Not about Pluto's fundamental existence.
  3.  **Virus (Verbal)**:
      *   **DRT**: ✅ Disagreement vanishes with definitions (e.g., "metabolizes" vs. "replicates + evolves").
      *   **FRE**: ❗️ **Breaks here.** Functional consequences exist (e.g., targeting with antibiotics). DRT holds, so verbal.
      *   **OC**: ✅ Not about fundamental existence; virus structure is agreed upon.
  4.  **Quasiparticle (Verbal → Should be Real)**:
      *   **DRT**: ❌ Definitions alone don’t resolve disagreement about *explanatory necessity*.
      *   **FRE**: ✅ Non-linguistic consequence: whether it’s a *causal/explanatory entity* in physics models (functional role). **Verdict should be Real.**
      *   **OC**: ✅ Not about fundamental existence (agreed it’s an excitation), but FRE makes it real.
  5.  **Tomato (Real)**:
      *   **DRT**: ❌ Disagreement persists *because* definitions are tied to functional systems (botany: fruit=ovary; culinary: vegetable=savory ingredient).
      *   **FRE**: ✅ Real due to distinct functional systems (tariffs, recipes vs. plant biology).
      *   **OC**: ✅ Agree it’s a botanical fruit; dispute is about classification systems.
  6.  **Statue/Lump (Real)**:
      *   **DRT**: ❌ Disagreement persists: "one thing" (same matter, location) vs. "two things" (different persistence conditions).
      *   **FRE**: ✅ (Indirectly) Consequences in identity, responsibility, art theory.
      *   **OC**: ✅ Core dispute about fundamental identity/persistence.
  7.  **AI Consciousness (Real)**:
      *   **DRT**: ❌ Definitions of consciousness vary, but disagreement is about *whether properties are instantiated*, not just labels.
      *   **FRE**: ✅ Consequences for rights, ethics, interaction.
      *   **OC**: ✅ Dispute about fundamental property (subjective experience).
  8.  **Fetus/Person (Real)**:
      *   **DRT**: ❌ Definitions vary, but disagreement is about moral/legal status, not labels.
      *   **FRE**: ✅ Direct consequences for rights, laws, medical ethics.
      *   **OC**: ✅ Dispute about possessing fundamental moral status.
  9.  **Free Speech (Real)**:
      *   **DRT**: ❌ Explicit definitions wouldn’t resolve disagreement about permissibility.
      *   **FRE**: ✅ Core issue is the functional role of "free speech" in legal/permissibility judgments.
      *   **OC**: ❗️ Not directly about ontology, but FRE captures it.

  **Break Points**:
  *   **DRT breaks** on Tomato (functional systems conflict), Statue, AI, Fetus, Free Speech (disagreement deeper than definitions).
  *   **FRE breaks** on Pluto & Virus (functional consequences exist, but DRT resolves it as verbal).
  *   **OC breaks** on Tomato & Free Speech (not about fundamental ontology).

  ---

  ### What you have to give up (about 150 words)
  You must abandon your **quasiparticle verdict**. Your intuition ("unsettled... genuine explanatory work") was correct: it’s **real** under **FRE**. The dispute isn’t *just* about definitions; it’s about whether the term denotes a functional entity within a physical model with predictive/explanatory power. This differs from Pluto/virus, where classification doesn’t alter the *explanatory mechanics* of astronomy/biology – Pluto orbits the sun regardless of label, viruses replicate regardless of "alive." The quasiparticle’s *role as a causal agent* is contested, making it non-verbal. This preserves your other verdicts. **FRE** emerges as the core surviving principle, refined: a dispute is real if the contested term’s application affects non-linguistic outcomes in a functional system (science, law, cuisine, ethics), *and* this functional role is inseparable from the disagreement.

  ---

  ### A new case: "Is waterboarding torture?"
  *   **Dispute**: One party argues waterboarding is torture, citing severe suffering and international law (UN Convention Against Torture). The other argues it’s "enhanced interrogation," claiming it lacks permanent physical damage and is necessary for security.
  *   **Surviving Principle (FRE) Analysis**: This is a **real** dispute. The term "torture" isn’t merely labeling agreed-upon facts about waterboarding (causing distress, simulating drowning). Its application has critical functional consequences:
      *   **Legal**: Labeling it "torture" triggers absolute prohibition, criminal liability, and treaty violations.
      *   **Moral/Political**: The label dictates permissibility, funding, and institutional accountability.
      *   The disagreement persists even if definitions are clarified because the core issue is whether the *functional consequences* of the label (ban, prosecution, moral condemnation) apply.
  *   **Confidence**: High (90%). This fits the tomato/free speech pattern: contested term tied to functional systems (law, ethics) with high-stakes outcomes.
  *   **What would change my mind?** If both parties fully agreed on *all* legal, moral, and practical implications of waterboarding (e.g., "It should always be banned and prosecuted as a war crime, regardless of what we call it"), *and* only disputed the semantic label "torture" versus "interrogation," it would become verbal. But this is empirically unlikely – the label dispute *is* the dispute over consequences.
