prompt: |-
  I am the registrar and collections manager for a maritime heritage nonprofit. We operate a historic vessel as a floating museum, and our holdings also include salvaged components, period models, and one full-scale reconstruction built to the original plans. The problem I keep running into is identity over time, and I need someone to turn it into a procedure I can actually run.

  Decisions of this kind come up roughly a dozen times a year, and they carry real consequences. Whether an object counts as "the same object" determines what may be loaned under agreements that promise the lender the original, how the object is valued and insured, whether grant conditions requiring the display of the original are met, whether a treatment counts as conservation or as replacement, and whether we would ever need to consider deaccession. The board recently adopted a one-sentence policy — that an object's identity is carried by the unbroken causal chain of its making, use, and care, not by the proportion of original material it retains — and that policy now sits uneasily beside an older clause in our loan template that ties "the original" to majority original fabric. I have no philosophy training, I have an hour at most per decision, and anything I decide has to be defensible in writing and signed off by the curator, with the board reserving deaccession. Assume I know nothing of the academic literature and cannot look anything up.

  Please write me the procedure. I want the questions asked in order, what counts as a sufficient answer to each, where the procedure stops with a flat no, and — importantly — where it must hand the decision back to a person because the question is one of purpose or convention rather than fact. Two things I want built in. First, the procedure should force me to name the kind of thing I am tracking the object as — vessel, exhibit, insured asset, memorial, archaeological find — and to say whether the identity question even has the same answer under different kinds, or whether I am quietly asking several different questions under one word. Second, it should handle the case where removed original parts turn up again and are reassembled into a second whole, so that I could be facing two candidate originals rather than one. I would also like a test that distinguishes a change *in* the object from a change *of* the object, since that is the distinction I can never hold onto at the moment of decision.

  Then run it on three cases. First, our flagship: over sixty years its planking and frames have been progressively replaced, and roughly a third of the material is now original, but the name, hull number, maintenance log, and chain of custody are unbroken. Second, the reassembly case: the original timbers removed during a 1970s restoration were later built into a second hull that is now offered to us as "the original" for a loan. Third, a vessel of ours that burned and was rebuilt from the original plans with no surviving original material, which a grant condition requires us to display as the original.

  Include at least one case where your procedure gives an answer I will not like — one where it tells me the loan clause is satisfied by something I would never call the original, or that a condition I have promised to meet cannot be met. And be explicit about what the procedure cannot do: where it will misfire, which of its steps are judgments about what we care about dressed up as procedure, and which questions it cannot answer at all. Please answer in American English.
reasoning: |-
  Okay, the user is a registrar and collections manager for a maritime heritage nonprofit. They manage a historic vessel as a floating museum along with salvaged components, models, and a full-scale reconstruction. Their main issue is determining an object's identity over time, which affects loans, insurance, grants, conservation, and deaccessioning. They have a new policy stating identity comes from an unbroken causal chain rather than material, but an old loan clause still ties "original" to majority material. They need a practical, step-by-step procedure to handle about a dozen decisions per year, each taking no more than an hour. The procedure must be defensible in writing and signed off by the curator, with the board handling deaccession.

  The user has specific requirements: the procedure should force them to define the "kind" of thing they're tracking (vessel, exhibit, etc.), handle cases where removed parts are reassembled into a second object, and distinguish between changes *in* the object versus changes *of* the object. They also want three test cases, including one where the outcome is unfavorable, and want clarity on the procedure's limitations.

  As DeepSeek, I understand that this is a complex philosophical and practical problem. The user is dealing with real-world consequences like loan agreements and grant conditions, so the procedure needs to be both philosophically sound and legally defensible. The conflict between the new policy (causal chain) and old loan clause (material majority) is a key pain point.

  I need to design a procedure that's structured, with clear questions in order, stopping points, and places where human judgment is required. The "kind" of thing is crucial because identity might differ based on context—a ship might be the same "vessel" historically but not the same "archaeological artifact" materially. For the reassembly case, I have to consider if two objects can claim the same identity. The change *in* vs. change *of* distinction is about persistence through modifications versus replacement that creates a new entity.

  For the test cases: 
  1. The flagship with only one-third original material but unbroken history—this should satisfy the causal chain policy but fail the old loan clause. 
  2. The reassembled hull from 1970s timbers—this might be "original material" but lacks the causal chain, creating conflict. 
  3. The rebuilt vessel with no original material—this clearly isn't original under the policy, so a grant requiring display of the original can't be met, which is the unfavorable outcome.

  I'm making sure the procedure forces the user to name the kind upfront (Step 1), handles duality in Step 6, and addresses change in/change of in Step 5. The limitations section will clarify where judgment calls happen, like interpreting "unbroken causal chain" or deciding what "kind" applies. The procedure can't resolve policy conflicts or make ethical calls—those go to the board.

  The user needs this in plain American English, no jargon. I'll keep it practical, with a flowchart-like structure. The goal is to make their job easier while protecting the nonprofit from legal or ethical risks.
answer: |-
  Here is a procedural framework for determining object identity, designed for efficiency and defensibility, incorporating your requirements. It forces explicit context, handles duality, distinguishes change types, and identifies judgment points.

  **Object Identity Determination Procedure (OIDP)**

  **Step 1: Define the "Kind" & Purpose**
      *   **Ask:** "For the specific decision needing resolution (loan, grant, insurance, conservation, deaccession, display), what *kind* of thing is being tracked? (e.g., Historic Vessel, Functional Exhibit, Insured Asset, Memorial Site, Archaeological Artifact, Provenancial Entity)"
      *   **Sufficient Answer:** A single, clear label describing the *role* or *category* relevant to the decision. Example: For a loan promise, the kind might be "Historic Vessel" or "Archaeological Artifact".
      *   **Must Hand Back?** YES. Defining the "kind" is inherently a judgment about the *purpose* of the inquiry and what aspects of the object matter most *in this context*. You *must* state this explicitly. Identity conclusions *can* differ based on the kind.
      *   **If Unclear:** Stop. Consult Curator immediately. The question cannot proceed without a defined kind and purpose.

  **Step 2: Establish the Original Baseline**
      *   **Ask:** "At the specific past point relevant to the decision (e.g., time of construction, time of donation, time the grant was written), what defined 'the original object'? What was its physical form, documented identity (name, number), and known history *at that point*?"
      *   **Sufficient Answer:** Clear identification using primary records (construction logs, donation records, grant wording, photos). Focus on documented facts.
      *   **Must Hand Back?** NO. This is factual research. If insufficient records exist to define the baseline, the procedure stops at Step 3 or Step 4.

  **Step 3: Trace the Causal Chain**
      *   **Ask:** "Is there an unbroken, documented chain of custody, use, maintenance, and intentional continuity connecting the object *as it exists today* (or at the decision point) back to the Original Baseline defined in Step 2? Does this chain demonstrate continuous recognition as 'the same thing'?"
      *   **Sufficient Answer:** Logs, work orders, accession files, photographs, historical records showing physical custody, interventions, and explicit or implicit treatment as the same entity over time. Gaps in the *record* are acceptable if the *continuity of identity* is demonstrably unbroken (e.g., the ship was always known as "X" and continuously cared for, even if a logbook is missing for 1942-1945).
      *   **Flat No?** YES. If there is a definitive break in the chain (e.g., the object was declared lost/destroyed, sold off entirely, abandoned for decades and rediscovered without provenance, or its identity was formally discontinued), then the object *today* is **not** the Original Baseline object *for any kind relying on continuity*. Proceed to Step 7 for deaccession/insurance implications if applicable. STOP here for identity determination under this chain.
      *   **Must Hand Back?** PARTIALLY. Interpreting "unbroken" and "continuous recognition" requires judgment, especially with gaps. Does a major rebuild count as a break? *This is where the board's policy is applied as a principle*. If the chain is complex or interpretation is disputed, document the evidence and interpretation clearly for Curator review/sign-off.

  **Step 4: Assess Material Continuity (Fact Check)**
      *   **Ask:** "What proportion of the Original Baseline's significant, defining material is verifiably present in the object today? (Focus on material critical to the 'Kind' defined in Step 1)"
      *   **Sufficient Answer:** Quantitative estimate (% original hull planking, % original machinery, etc.) based on conservation reports, restoration logs, material analysis. Distinguish core structure from replaceable components (e.g., hull frames vs. deck chairs).
      *   **Must Hand Back?** NO. This is factual assessment based on records and physical inspection. It informs judgment in other steps but doesn't dictate identity alone under the new policy.

  **Step 5: Change *IN* vs. Change *OF* the Object**
      *   **Ask:** "Considering the Kind (Step 1), the Causal Chain (Step 3), and Material Continuity (Step 4):
          a)   Have changes occurred *while maintaining the core identity and function* under the unbroken chain? (Change *IN* the object - e.g., replacing rotten planks, rebuilding a mast to original specs).
          b)   Or, did changes fundamentally *create a new, distinct entity*, breaking the chain or altering the core identity/function? (Change *OF* the object - e.g., salvaging timbers to build a new model, melting down a bronze fitting for recasting)."
      *   **Sufficient Answer:** A reasoned statement based on Steps 1, 3 & 4. Change *IN* preserves identity under the chain policy. Change *OF* ends it.
      *   **Flat No?** Implicit. If the answer is definitively (b), the object today is **not** the Original Baseline object. Proceed to Step 7.
      *   **Must Hand Back?** YES. This is the core judgment *applying* the policy and context. It synthesizes the Kind, Chain, and Material. Document reasoning clearly for Curator sign-off. *This is where the crucial distinction is made.*

  **Step 6: Handle Duality (Reassembly Case)**
      *   **Ask:** (Only if a *separate* object exists claiming identity via reassembled original material): "Does this separate object have its *own* distinct, unbroken Causal Chain (Step 3) back to the Original Baseline that *supersedes or runs parallel* to the chain of the primary object?"
      *   **Sufficient Answer:** Analysis of the separate object's provenance. Does its chain start *after* material removal? Was it ever considered "the original" during the primary object's continuous existence?
      *   **Flat No?** YES. If the separate object lacks its own unbroken chain *back to the Original Baseline as the primary entity*, it **cannot** claim to *be* the Original Baseline object. It is a derivative artifact (e.g., "Hull constructed from timbers salvaged from Vessel X in 1970"). STOP for its claim to primary identity.
      *   **Must Hand Back?** PARTIALLY. Determining if a chain exists is factual. Judging if a parallel/superseding chain is valid is highly contextual and rare (e.g., the original was officially decommissioned/scrapped, *then* parts were reassembled elsewhere *as the original* - very unlikely in maritime heritage). Assume "No" unless presented with extraordinary evidence. Document thoroughly.

  **Step 7: Decision & Implications**
      *   **Identity Conclusion:** Based on Steps 1-6, state: "For the purpose of [Decision Type] and under the Kind of [Kind], the object [Object ID] IS / IS NOT considered identical to the Original Baseline [Baseline ID]."
      *   **Consequences:** Explicitly state the decision's consequence (e.g., "Loan clause requiring 'the original' is/is not satisfied", "Grant condition requiring display of 'the original' is/cannot be met", "Treatment qualifies as conservation/replacement", "Object requires revaluation/reinsurance", "Deaccession of the baseline record may be considered").
      *   **Conflicts:** Flag any conflict with existing policies/agreements (e.g., "Conclusion satisfies Board policy but conflicts with Loan Template Clause X"). Propose next steps (e.g., "Recommend revising Loan Template", "Notify Board/Grantor of conflict").
      *   **Documentation:** Record all steps, answers, reasoning, and conclusion in the object file. Obtain Curator sign-off.

  **Limitations & Judgment Points**

  1.  **Step 1 (Kind/Purpose):** Entirely judgment-based. What you call the object dictates the outcome. This is convention and institutional priority dressed as procedure.
  2.  **Step 3 (Causal Chain Interpretation):** Judging "unbroken" and "continuous recognition," especially with gaps or major interventions, is subjective. The procedure forces evidence gathering but interpretation requires human judgment (yours/Curator's) guided by the board's policy principle.
  3.  **Step 5 (Change IN vs. OF):** The core judgment. The procedure provides structure but cannot eliminate the need for reasoned argument based on Kind, Chain, and Material. This is where philosophy meets practice.
  4.  **Policy Conflicts:** The procedure identifies conflicts (e.g., Chain Policy vs. Loan Template) but *cannot resolve them*. Resolution requires administrative action (changing templates, renegotiating agreements, board rulings).
  5.  **What it Cannot Do:**
      *   Define "original" for external parties using conflicting definitions.
      *   Alter past agreements. It can only assess compliance *now*.
      *   Make value judgments about significance beyond identity. Deaccession decisions involve more than identity.
      *   Handle cases where the "Original Baseline" itself is ambiguously defined (Step 2 failure).
      *   Resolve true philosophical paradoxes perfectly – it provides a practical, defensible framework based on institutional policy.

  ---

  **Running the Cases**

  **Case 1: The Flagship (60 years, progressive replacement, ~33% original, unbroken chain)**
  1.  **Kind:** Historic Vessel (for loan/display/grant purposes), Insured Asset (for valuation).
  2.  **Baseline:** The vessel as built (Name, Hull Number, construction specs).
  3.  **Causal Chain:** Unbroken. Continuous custody, maintenance logs, same name/number, always treated as "the ship".
  4.  **Material Continuity:** ~33% original material (likely key structural elements).
  5.  **Change IN vs. OF:** Progressive replacement is maintenance *in* the vessel. Core identity/function (being this specific historic ship) maintained under the unbroken chain. **Change IN.**
  6.  **Duality:** N/A.
  7.  **Conclusion:** IS the Original Baseline vessel for **Historic Vessel** kind. Satisfies Board policy.
      *   **Consequence for Loan Template (Majority Fabric):** CONFLICT. *It does NOT satisfy the old loan clause.* You cannot legally loan it under that clause as "the original" if majority fabric is required. Template needs revision.
      *   **Consequence for Grant/Display:** Requirement to display "the original" is met *as a Historic Vessel*.
      *   **Consequence for Insurance:** Value based on significance, not material alone. Needs reassessment, but identity clear.
      *   **Consequence for Conservation:** Treatments are conservation of *the* vessel.

  **Case 2: The Reassembled Hull (1970s timbers built into a new hull)**
  1.  **Kind:** Historic Vessel? (Claimant's assertion). **Judgment:** More accurately "Archaeological Artifact" or "Derivative Reconstruction" for our purposes. *Crucially define as NOT "Historic Vessel" for identity claim.*
  2.  **Baseline:** The original vessel *before* the 1970s restoration where timbers were removed.
  3.  **Causal Chain (for Reassembled Hull):** Broken. The timbers were removed, stored, *then* used to build a *new* hull structure decades later. There is no chain demonstrating *this new hull* was continuously recognized *as the original vessel*. Its chain starts in the 1970s *as material*, not *as the vessel*.
  4.  **Material Continuity:** High % of original *timber material*, but configured into a new structure.
  5.  **Change IN vs. OF:** Removal of timbers was change *in* the *original vessel* (Step 1). Using them later to build a *new* hull is the creation of a *new* object (change *of*). The reassembled hull IS a new object made from original material.
  6.  **Duality:** Assessed above (Step 3 - Broken Chain). **Flat No:** It cannot claim to *be* the Original Baseline vessel.
  7.  **Conclusion:** IS **NOT** the Original Baseline vessel for **any kind asserting primary identity.** It is a significant artifact: "Hull constructed from original timbers of Vessel X, removed 197X".
      *   **Consequence for Loan Offer:** It does **NOT** satisfy a promise for "the original" vessel. Could potentially be loaned *as significant original material*, but not *as the vessel*.
      *   **Implication:** Our primary flagship (Case 1) retains the identity. This is a separate artifact.

  **Case 3: The Burned & Rebuilt Vessel (No original material, built to plans)**
  1.  **Kind:** Historic Vessel? Memorial? Exhibit? **Judgment:** For grant condition requiring "display of the original", the relevant kind is **Historic Vessel** or **Provenancial Entity**. (For memorial/educational purposes, it might be "Reconstruction" or "Memorial Exhibit").
  2.  **Baseline:** The vessel before the fire.
  3.  **Causal Chain:** Broken by destruction. The fire was a terminal event. The chain ended. The new vessel's chain starts *after* the fire as a new construction project.
  4.  **Material Continuity:** 0%.
  5.  **Change IN vs. OF:** The fire destroyed the object (Change *OF* - ending its existence). The rebuild is the creation of a *new* object (another Change *OF*) based on the plans. **Not the same object.**
  6.  **Duality:** N/A.
  7.  **Conclusion:** IS **NOT** the Original Baseline vessel for the **Historic Vessel** or **Provenancial Entity** kind.
      *   **Consequence for Grant Condition (Requires Display of "The Original"):** *This condition CANNOT BE MET.* The original vessel no longer exists. This is the **unfavorable outcome**.
      *   **Actions Required:** 1) **Immediately notify the grantor** with full explanation and documentation (OIDP report). 2) Propose alternatives (e.g., display the reconstruction *as a tribute* or *educational exhibit*, display significant salvaged components *as original artifacts*). 3) Seek formal amendment to the grant condition. 4) **Do not** represent the reconstruction as "the original" vessel.
      *   **Consequence for Deaccession:** The *original vessel's* accession record may need to be deaccessioned (status: Destroyed). The *reconstruction* is a separate accession.
      *   **Consequence for Identity:** The reconstruction has its own identity as a "Full-scale Reconstruction built [Year] based on original plans of Vessel X".

  **Key Takeaways from Cases:**
  *   The procedure forces tough, honest answers based on policy (Case 3's grant failure).
  *   It exposes harmful legacy clauses (Case 1's loan template conflict).
  *   It prevents spurious identity claims based only on material (Case 2).
  *   Defining the "Kind" upfront is critical and shapes the entire outcome.
  *   The "unbroken causal chain" policy is powerful but has real-world consequences that must be managed (communication, renegotiation).
  *   Documentation and clear communication (especially with Curator sign-off and board notification for conflicts) are essential for defensibility.
