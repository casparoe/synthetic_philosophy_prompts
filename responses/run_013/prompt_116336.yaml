prompt: |-
  been going back and forth with a friend about the moral equality of combatants -- the claim that soldiers on both sides of a war have the same permission to kill and the same liability to be killed, no matter whose cause is just. what's your credence that it's actually true? i don't want a shrug, i want the decomposition: how much rides on whether individual soldiers are liable to harm just for fighting for an unjust cause, how much on whether a soldier could reasonably be expected to know his side is in the wrong, how much on whether the war convention / mutual restraint has independent moral force that generates permissions even where desert is absent, and how much on whether the question should be asked of individuals or of collectives. give me a rough number for each term and how they combine into your overall credence, then tell me which term you're least sure of and what argument or evidence would move it most.
