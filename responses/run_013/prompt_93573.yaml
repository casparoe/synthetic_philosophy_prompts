prompt: |-
  I sit on the advisory panel that certifies citizens' initiatives for the ballot in my country. One has now qualified, and it is causing us real difficulty. It would amend the constitution to bar the supreme court from annulling referendum results, oblige judges to give effect to any initiative that passes even where it conflicts with the bill of rights, and provide that these very clauses may be repealed only by a two-thirds majority at a further referendum. Our statute permits us to block an initiative only where it is 'manifestly incompatible with the constitutional order as a whole' -- a test we have never had to apply. The panel is split. Some hold that our proper role is to protect the majority's right to settle its own constitutional arrangements; others that we would be licensing the demolition of the rights that make majority rule worth having; and one member adds that the entrenchment clause is void on its face, since a democratic people cannot bind itself. Please draft the written opinion I shall table at Thursday's meeting. It should reach a definite recommendation -- certify, block, or certify in part -- give reasons that the initiative's sponsors could actually answer, and treat the strongest argument on the side you reject as honestly as the side you favour.
reasoning: |-
  We are faced with an initiative that proposes to:
  1. Bar the Supreme Court from annulling referendum results.
  2. Oblige judges to give effect to any initiative that passes, even when it conflicts with the bill of rights.
  3. Entrench these provisions by requiring a two-thirds majority at a further referendum to repeal them.

  The legal standard for our panel is whether the initiative is "manifestly incompatible with the constitutional order as a whole". We must reach a definite recommendation: certify, block, or certify in part.

  I propose that we block the initiative in its entirety. My reasoning follows, and I will address the strongest arguments on both sides.

  **I. The Initiative is Manifestly Incompatible with the Constitutional Order**

  A. **The Core Principles of the Constitutional Order**
     Our constitutional order is built on two fundamental pillars: democracy and the protection of fundamental rights. These are not opposed but complementary. The bill of rights exists to protect individuals and minorities against the potential tyranny of the majority. The Supreme Court's power of judicial review is a key mechanism to uphold the bill of rights and the rule of law.

     The initiative would remove the Supreme Court's ability to protect fundamental rights when they are infringed by a referendum. By requiring judges to enforce initiatives that conflict with the bill of rights, it effectively subordinates fundamental rights to the will of the majority in a single vote. This violates the very essence of our constitutional order, which holds that fundamental rights are inalienable and not subject to ordinary political processes.

  B. **The Entrenchment Clause**
     The initiative would entrench itself and the other two provisions by requiring a two-thirds majority at a referendum for repeal. This is problematic because:
     1. It attempts to shield the initiative's core changes (which dismantle key constitutional safeguards) from ordinary amendment processes, making it extremely difficult to reverse.
     2. It violates the principle that a democratic constitution must remain amendable by the people through procedures that are not unduly burdensome. A two-thirds referendum requirement for repeal is an extraordinary hurdle that would effectively freeze the constitution in a state that undermines rights protection.

     However, I acknowledge the argument that a democratic people can choose to entrench certain provisions. But here, the entrenchment is being used to protect clauses that would fundamentally alter the democratic nature of the constitution by removing checks on majority power. This creates a self-perpetuating mechanism that is antithetical to the constitutional order.

  C. **The Argument that the People Have the Right to Settle Their Constitutional Arrangements**
     The strongest argument for certification is that the people, through the initiative process, have the sovereign right to change their constitutional arrangements. This argument holds that our role is not to second-guess the substantive merits of an initiative but to let the people decide.

     I agree that the people have the ultimate authority to amend the constitution. However, our mandate is to block initiatives that are "manifestly incompatible with the constitutional order as a whole". This initiative does not merely change the constitution; it seeks to destroy the foundational balance between majority rule and minority rights. It would create a system where the majority can violate fundamental rights without judicial recourse, and then protect that system from being easily changed. This is not a change within the constitutional order; it is a revolution against it.

     Moreover, the constitutional order itself recognizes that there are limits to what even a majority can do. For example, the bill of rights contains certain non-derogable rights. The initiative, by allowing any infringement of rights by a simple majority in a referendum, would nullify that core protection.

  D. **The Argument that the Entrenchment Clause is Void on its Face**
     One member argues that the entrenchment clause is void because a democratic people cannot bind itself. This is a strong point, but I do not rest my decision solely on it. Even if the entrenchment clause were invalid, the other two provisions would still stand and cause irreparable harm to the constitutional order. Therefore, we must consider the initiative as a whole.

     Additionally, the entrenchment clause is not necessarily void per se. Constitutional entrenchment is a common and legitimate tool. However, in this context, it is being used illegitimately to prevent the restoration of the very institutions that protect democracy and rights. This makes the entire package manifestly incompatible.

  **II. Why We Should Block the Entire Initiative and Not Certify in Part**

  We have the power to certify in part only if the initiative is severable. This initiative is not severable because:
  - The three provisions are interconnected: the entrenchment clause is designed to protect the other two, and the other two work together to remove judicial oversight of referendums.
  - Even if we were to strike the entrenchment clause, we would still be left with provisions that require judges to enforce initiatives that violate fundamental rights and bar the Supreme Court from annulling referendums. These are still manifestly incompatible with the constitutional order.

  Therefore, partial certification is not an option.

  **III. Conclusion and Recommendation**

  I recommend that we block the initiative in its entirety because it is manifestly incompatible with the constitutional order as a whole. It would dismantle the system of checks and balances that protects fundamental rights, and it would do so in a way that is self-entrenching and seeks to make its own flaws irreparable.

  To the initiative's sponsors, I would say: We recognize your desire to empower direct democracy, but this initiative goes too far by removing the essential safeguards that prevent the violation of fundamental rights. Our constitutional order requires both majority rule and the protection of minorities. This initiative would destroy that balance. We encourage you to propose reforms that enhance democracy without undermining the rights that make democracy legitimate.

  **Written Opinion for the Panel**

  ---

  **OPINION**

  **Re: Initiative [Number/Title]**

  **Recommendation: Block the initiative in its entirety.**

  **Reasons:**

  1. **The initiative is manifestly incompatible with the constitutional order as a whole because it undermines the foundational principles of the constitution.**
     - The constitution is built on the twin pillars of democracy and the protection of fundamental rights. The initiative would effectively eliminate the Supreme Court's role in protecting fundamental rights against infringement by referendum results. This violates the core constitutional principle that fundamental rights are not subject to abrogation by simple majority vote.
     - By requiring judges to enforce initiatives that conflict with the bill of rights, the initiative subordinates the entire bill of rights to the outcomes of referendums. This is a radical departure from the constitutional order, which guarantees rights as inalienable and places them beyond the reach of ordinary political processes.

  2. **The entrenchment clause compounds the incompatibility.**
     - The initiative seeks to entrench its own provisions by requiring a two-thirds majority in a future referendum for repeal. This would make it extraordinarily difficult to reverse the damage to the constitutional order. While entrenchment is not per se invalid, its use here to protect clauses that dismantle constitutional safeguards is abusive and contrary to the dynamic and self-correcting nature of a democratic constitution.

  3. **The initiative is not severable.**
     - The three provisions (barring judicial annulment of referendums, requiring judges to enforce initiatives even when they conflict with the bill of rights, and entrenching these provisions) are interdependent. The entrenchment clause is intended to protect the other two, and the other two provisions work together to remove judicial oversight. Even without the entrenchment clause, the remaining provisions would still be manifestly incompatible with the constitutional order. Therefore, partial certification is not appropriate.

  **Addressing the Strongest Counterarguments:**

  - **The argument that the people have the right to determine their constitutional arrangements:** We fully respect the people's sovereign power to amend the constitution. However, our mandate is to prevent initiatives that are manifestly incompatible with the constitutional order as a whole. This initiative does not just amend the constitution; it destroys the very structure that makes our constitution democratic and rights-respecting. It would allow a majority to violate fundamental rights without remedy and then make it nearly impossible to restore those rights. This is beyond the pale of permissible amendment.

  - **The argument that the entrenchment clause is void:** While it is argued that a democratic people cannot bind itself, we do not base our decision solely on this point. Even if the entrenchment clause were unenforceable, the other provisions would still cause irreparable harm to the constitutional order. Moreover, the entrenchment clause in this context is an attempt to immunize an unconstitutional change, which reinforces the manifest incompatibility of the entire initiative.

  **Conclusion:**

  For the reasons stated, we find that the initiative is manifestly incompatible with the constitutional order as a whole. We therefore recommend that it be blocked from appearing on the ballot.

  Respectfully submitted,

  [Your Name]
  Advisory Panel Member
