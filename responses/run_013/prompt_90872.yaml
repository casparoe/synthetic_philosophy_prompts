  We are designing an in-class game to illustrate Harsanyi's aggregation theorem. The key is to have students discover that the three premises (individual expected utility, group expected utility, and unanimity) force the group's ranking to be a weighted sum of individual utilities, leading to utilitarianism under a veil of ignorance.

