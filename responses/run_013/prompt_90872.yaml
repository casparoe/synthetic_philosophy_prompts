     Now, we ask: Would you, behind the veil of ignorance, accept this rule? And then we reveal that this rule is utilitarianism.

  4. Debrief (20 minutes)
     - What are the three premises?
          (1) Each individual's preferences are vNM (so can be represented by expected utility).
          (2) The group preferences are vNM (so the group rule must be linear).
          (3) Unanimity (if everyone prefers X to Y, then the group does too).
     - Together they force the group rule to be a weighted sum of individual utilities.
     - Then, under the veil of ignorance (equal probability of being anyone), the weights are equal -> utilitarianism.
     - Which premise would you drop?
          - Rawls might drop the equal probability (and use maxmin) or drop the expected utility for the group? Actually, Rawls rejects the vNM approach in the original position and uses maxmin.
          - Someone might drop the vNM for the group: maybe the group should not be expected utility maximizers? But then how to handle uncertainty?
          - Or drop the idea that we can compare interpersonal utilities? (But we stipulated them.)

     - Also, note that in the veil of ignorance, the equal probability is an assumption.

     - What predictably goes wrong:
          (a) One student might not give consistent lottery answers in phase 1. Solution: The facilitator can provide the expected utility formula and ask them to compute it. Or we can hand out a worksheet that requires computation to minimize inconsistency.
          (b) A student objects that the veil of ignorance doesn't assign equal probability. Solution: Acknowledge that this is an assumption and park it by saying "For now, we are following Harsanyi in assuming that you assign equal probability to each identity. We'll discuss the justification in the debrief."
          (c) A student might question the stipulation of utilities. Solution: Acknowledge that in real life we don't have cardinal utilities, but the theorem is conditional on them existing.

     - What the game can't do:
          - It doesn't prove that the weights must be equal in the veil of ignorance; it assumes it.
          - The utilities are given, not revealed from preferences. But in the classroom, we stipulate to focus on the aggregation.
          - It assumes that the group rule must be vNM. Someone might reject that.

  Materials:

  Character Sheets (example for Character 1):

  Character 1: Risk Neutral
     You care about money in a linear way. Your utility for outcomes is:
          A: $0 -> utility 0
          B: $10 -> utility 10
          C: $20 -> utility 20
          D: $50 -> utility 50

     Please compute your expected utility for the following lotteries and rank them:

     Lottery 1: 50% chance of A, 50% chance of D
     Lottery 2: 100% chance of C
     Lottery 3: 25% chance of A, 75% chance of B
     Lottery 4: 100% chance of B
     Lottery 5: It's a compound lottery: first flip a fair coin. 
          - Heads: you get Lottery 1
          - Tails: you get Lottery 2

     [Space for computations and ranking]

  Similarly for other characters.

  Lottery Cards: Can be separate cards for each lottery with the description.

  Stakes: We can use candy. For example, after the exercise, we might actually run one of the lotteries and the winning lottery determines candy distribution? But that might be too much. Alternatively, we can have a token for a coffee voucher for one student, chosen by a lottery at the end.

  But the stakes are trivial. We are not actually giving money.

  Run of Show Timing:

  - 0:00-0:05: Introduction
  - 0:05-0:25: Phase 1 (Individual work)
  - 0:25-0:55: Phase 2 (Group rule construction) [30 minutes]
  - 0:55-1:10: Phase 3 (The sting: Lottery Y vs status quo, and reveal utilitarianism)
  - 1:10-1:30: Debrief

  What predictably goes wrong:

  1. A student might have trouble with the expected utility calculations. Solution: Have a TA or circulate to help.

  2. The group might struggle to come up with a rule. Solution: Prompt them with the idea of assigning group utilities to outcomes and then taking expectations.

  3. The objection about the veil of ignorance not having equal probability might come early. Solution: "That's a great point, and we'll discuss it in the debrief. For now, let's assume equal probability to see where it leads."

  4. Time: The group phase might take longer. Be prepared to cut short and move to the sting.

  5. The sting might not be dramatic if the lottery we choose doesn't clearly show a sacrifice. We chose Lottery Y vs (C,C,C,C) and it shows a clear improvement. But the sacrifice is in the 20% branch, which they might not feel because they are not actually experiencing it. We have to emphasize that one person gets a very bad outcome.

  Final note: The game is a teaching device to make the theorem concrete. It doesn't prove the theorem, but it illustrates the logic.

  Let me adjust the characters to make the sacrifice clearer: maybe make the outcomes more extreme, like:

  Character 1: 
     A: 0 (very bad)
     B: 10
     C: 20
     D: 21   (so not much gain from D over C)

  Character 2: 
     A: 0
     B: 10
     C: 11
     D: 100   (huge gain for D)

  Then in Lottery Y: status quo (C,C,C,C) is 20, 11, ... -> group utility = (20+11+...)/4. 
     But we want the lottery to have a high chance of D for everyone and a small chance of A for one.

     Group utility for (D,D,D,D) = (21+100+...)/4 (if other characters also value D high) -> high.
     Group utility for the bad state: if character 2 gets A -> (21+0+ ...)/4 -> low.

     Then the lottery might clearly be better than the status quo.

  But we'll stick with the original for simplicity.
answer: |-
  Below is a complete in-class game design for your 90-minute session on Harsanyi's aggregation theorem. This exercise emphasizes discovery and dilemma, using concrete choices to lead students into the "trap" where they derive utilitarianism from seemingly innocuous premises. The materials are low-stakes (candy/coffee) to keep it engaging but trivial.

  ---

  ### **Materials**
  1. **Character Sheets** (4 types × 3–4 copies each for 14 students):  
     Each sheet defines a character with a name, risk attitude, and **stipulated vNM utilities** for 4 outcomes:  
     - **Outcomes**:  
       - **A**: "Get nothing"  
       - **B**: "Get 1 candy bar + \$0.50 coffee voucher"  
       - **C**: "Get 2 candy bars + \$1 coffee voucher"  
       - **D**: "Get 4 candy bars + \$2 coffee voucher"  

     - **Character Utilities**:  
       - **Character 1 (Risk-Neutral)**: \(U_1(A) = 0\), \(U_1(B) = 10\), \(U_1(C) = 20\), \(U_1(D) = 40\)  
       - **Character 2 (Risk-Averse)**: \(U_2(A) = 0\), \(U_2(B) = 30\), \(U_2(C) = 40\), \(U_2(D) = 45\)  
       - **Character 3 (Risk-Seeking)**: \(U_3(A) = 0\), \(U_3(B) = 5\), \(U_3(C) = 25\), \(U_3(D) = 100\)  
       - **Character 4 (Threshold-Hater)**: \(U_4(A) = 0\), \(U_4(B) = 15\), \(U_4(C) = 20\), \(U_4(D) = 60\)  

     *Rationale: Utilities are nonlinear to ensure lotteries reveal meaningful differences. Risk attitudes are exaggerated to provoke disagreement.*

  2. **Lottery Cards** (Phase 1 & 2):  
     - **Phase 1 (Individual)**: Simple lotteries for ranking. Examples:  
       - **L1**: 50% A, 50% D  
       - **L2**: 100% C  
       - **L3**: 75% B, 25% A  
       - **L4**: 100% B  
       - **L5 (Compound)**: 50% chance of L1, 50% chance of L2  
     - **Phase 2 (Group Audit)**: Probe lotteries to test the group rule:  
       - **P1**: 100% B  
       - **P2**: 50% A, 50% C  
       - **P3**: 30% A, 70% D  

  3. **Stakes**:  
     - Candy bars (e.g., mini-Snickers) and coffee vouchers (e.g., \$0.50–\$2 fake vouchers for campus coffee).  
     - **Not given immediately**: Winners chosen via lottery at the end (Phase 3) to keep stakes trivial but tangible.  

  4. **Whiteboard/Post-its**: For recording group decisions and utilities.

  ---

  ### **Run of Show (90 Minutes)**  
  **Goal**: Make students *feel* the trap → "We accepted three axioms and *accidentally* built utilitarianism."  

  #### **Phase 1: Individual Lottery Rankings (20 min)**  
  - **Setup (5 min)**:  
    - Distribute character sheets (assign 3–4 students per character type).  
    - Explain: "You are your character. Rank these 5 lotteries *selfishly* by computing expected utility (EU). No group talk yet."  
    - Show lottery cards (L1–L5).  
  - **Activity (15 min)**:  
    - Students compute EU for each lottery (e.g., Character 1: EU of L1 = \(0.5 \times 0 + 0.5 \times 40 = 20\)).  
    - They submit rankings. **Facilitator verifies consistency** (e.g., if EU(L1) > EU(L2), L1 must rank higher).  

  #### **Phase 2: Group Rule Construction (30 min)**  
  - **Setup (5 min)**:  
    - Collect character sheets (students don’t know their character yet).  
    - State the task: "As a group, agree on *one rule* to rank lotteries for society. It must satisfy:  
      1. **Unanimity**: If all prefer X > Y, group ranks X > Y.  
      2. **EU Rules Apply to Group**: Group rankings must satisfy vNM axioms (completeness, transitivity, continuity, independence).  
      3. **Linearity**: Ranking compound lotteries = ranking their reduced simple form."  
    - Emphasize: "You’ll be randomly assigned a character *after* deciding the rule."  
  - **Activity (20 min)**:  
    - Groups brainstorm rules. **Predictable proposal**: Assign group utility \(G\) to outcomes, then compute expected \(G\).  
    - Audit their rule with probe lotteries:  
      - **Step 1**: Force them to define \(G(A), G(B), G(C), G(D)\). *Unanimity forces \(G(A) < G(B) < G(C) < G(D)\)*.  
      - **Step 2**: Test with **P1 vs. P2**:  
        - Character 1: EU(P1) = 10, EU(P2) = \(0.5 \times 0 + 0.5 \times 20 = 10\) → Indifferent  
        - Character 2: EU(P1) = 30, EU(P2) = \(0.5 \times 0 + 0.5 \times 40 = 20\) → Prefers P1  
        - Character 3: EU(P1) = 5, EU(P2) = \(0.5 \times 0 + 0.5 \times 25 = 12.5\) → Prefers P2  
        - Character 4: EU(P1) = 15, EU(P2) = \(0.5 \times 0 + 0.5 \times 20 = 10\) → Prefers P1  
        → *Not unanimous, so rule must weigh preferences*.  
      - **Step 3**: Show only **weighted sum** works:  
        - If group sets arbitrary \(G\) (e.g., \(G(B)=50\), \(G(C)=75\)), compute EU for P2: \(0.5 \times G(A) + 0.5 \times G(C)\).  
        - But if Character 2’s weight is high, P1 > P2; if Character 3’s weight is high, P2 > P1.  
        - **Trap**: To satisfy vNM axioms, weights must be fixed → group EU = \(\sum w_i \times \text{individual EU}\).  
  - **Conclusion (5 min)**: "Your rule is now a weighted sum. But how to set weights? Enter the veil of ignorance..."  

  #### **Phase 3: The Sting (20 min)**  
  - **Veil of Ignorance (5 min)**:  
    - "Now, you don’t know who you are. Assign equal probability (1/4) to each character."  
    - Set weights \(w_i = 1/4\) → Group EU = average of individual EUs → **utilitarianism**.  
  - **The Sacrifice Lottery (10 min)**:  
    - Introduce **Lottery S**:  
      - 95% chance: **Everyone gets D** (best outcome).  
      - 5% chance: **One random person gets A** (worst outcome), others get D.  
    - Compute group EU:  
      - EU(S) = \(0.95 \times \text{avg}(U_i(D)) + 0.05 \times \text{avg}(\text{state with one } A)\)  
      - Avg(\(U_i(D)\)) = \((40 + 45 + 100 + 60)/4 = 61.25\)  
      - Avg(state with one A) = \([U_1(A) + U_2(D) + U_3(D) + U_4(D)]/4 = (0 + 45 + 100 + 60)/4 = 51.25\) (e.g., if Character 1 gets A)  
      - EU(S) = \(0.95 \times 61.25 + 0.05 \times 51.25 = 60.625\)  
    - Compare to **Status Quo** (everyone gets C):  
      - Avg(\(U_i(C)\)) = \((20 + 40 + 25 + 20)/4 = 26.25\)  
      - EU(S) > Status Quo → **Group prefers S**.  
  - **Reveal (5 min)**:  
    - Assign characters randomly (draw slips). Run Lottery S (95% chance: all win D; 5%: one draws "A" and loses).  
    - Distribute candy/vouchers.  
    - "You chose a rule that sacrifices one person for the greater good. Welcome to utilitarianism."  

  #### **Debrief (20 min)**  
  - **Key Insight**: "You accepted three axioms → forced to weighted sum → veil of ignorance forced equal weights → utilitarianism. No extra premises!"  
  - **Discussion Questions**:  
    - Which axiom would you reject? Why?  
      - **Reject vNM for groups?** → How *should* groups handle risk?  
      - **Reject interpersonal utility?** → Can we really add utilities?  
      - **Reject veil weights?** → Rawls: "Equal probability is arbitrary. Use maxmin!"  
    - What does each retreat cost?  
      - Rawls: Loses probabilistic fairness → defends maximin.  
      - Anti-vNM: Loves Harsanyi’s utilitarianism and wants to reject the premise that groups should follow expected utility rules.  
      - Anti-interpersonal: Loses social welfare functions entirely?  
  - **Caveats**:  
    - "This doesn’t *prove* utilitarianism is correct. It shows: **If** you accept these axioms, **then** utilitarianism follows.  
    - Utilities were stipulated—real people might not have vNM preferences.  
    - Equal-probability veil is assumed, not derived."  

  ---

  ### **Predictable Problems & Solutions**  
  1. **Student breaks vNM consistency in Phase 1**:  
     - *E.g., Ranks L5 (compound) differently than its reduced form*.  
     - **Solution**: Privately correct calculations. If resistant, say: "Assume your character is rational. Does this ranking obey the vNM axioms?"  

  2. **Rawlsian objects early to veil probabilities**:  
     - *E.g., "Why assume equal probability? That’s unfair to the worst-off!"*  
     - **Park it**: "Great point—we’ll discuss the veil’s fairness in debrief. For now, play along to see *what follows* from equal probability."  

  3. **Group struggles with weighted sum audit**:  
     - *E.g., Tries to avoid weights by proposing a non-EU rule*.  
     - **Solution**: Test their rule with a compound lottery. Show it violates linearity (e.g., L5 must reduce to 25% A, 25% D, 50% C).  

  4. **Phase 3 sacrifice feels too abstract**:  
     - **Solution**: Make Lottery S visceral. Ask: "Would you accept this rule if you might be the one getting A?"  

  ---

  ### **What the Game Can’t Do**  
  - **Prove utilitarianism**: It conditionally derives it from axioms. Emphasize: "This is why Harsanyi called it a *representation theorem*."  
  - **Handle real utilities**: Stipulated utilities avoid preference elicitation (which would take hours).  
  - **Justify the veil**: Equal probability is assumed, not argued for. Use debrief to discuss alternatives (e.g., Rawls’ maximin).  

  This design forces students to confront the theorem’s inevitability while leaving room for philosophical pushback. The candy/vouchers make the stakes tangible but not distracting.
