  1. Phase 1: Individual Choice
     - Each student gets a character sheet with a stipulated utility function over 3-5 outcomes.
     - They rank some simple lotteries (gambles) over these outcomes from their character's perspective.

  2. Phase 2: Group Rule Construction
     - Before knowing which character they are, the group must agree on a rule for ranking lotteries that:
          (a) respects unanimity (if everyone prefers A to B, then the group does too)
          (b) satisfies the expected utility axioms (so the rule must be linear: it must handle compound lotteries appropriately, meaning that the group's ranking of a compound lottery is the same as the reduced lottery).
     - The facilitator then tests the group's rule with some probe lotteries to show that it must be a weighted sum of the individual utilities.

  3. Phase 3: The Sting
     - Apply the rule to a lottery that has a large aggregate gain but one person gets a very bad outcome (e.g., a utilitarian sacrifice).
     - Reveal that under the veil of ignorance (each identity equally likely), the rule becomes plain utilitarianism.

