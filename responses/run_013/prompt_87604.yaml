prompt: |-
  I've been following mechanistic interpretability from the outside — no formal training, just a lot of reading and thinking on my own — and I keep hitting a problem I can't get past by myself. Whenever someone reports that a model's odd behavior has been traced to a mechanism, or that two models rely on the same mechanism, or that some newly noticed anomaly is genuinely new rather than a variant of something already understood, I can't work out what would make the claim true or false. The phrase "the same mechanism" seems to slide between at least four different things: the same parameters, the same arrangement of parts and connections, the same procedure or algorithm, and the same input-output behavior. My suspicion is that a good deal of the apparent disagreement in this area is really a mismatch between those levels, but I don't know which level, if any, ought to anchor the others, or whether my four-way split is even the right cut.

  The case that worries me most is anomaly detection, because that is where the ambiguity does real work: you notice a behavior that doesn't fit the story you had about a model, and everything then turns on deciding whether you have found a new mechanism, a variant of a known one, or a known one misfiring in unfamiliar conditions. If "same mechanism" has no settled content, it seems to me that claims of that kind can't be checked, and the safety-relevant claims that inherit them can't be either.

  What I'd like from you is an agenda rather than a survey. Suppose the resource at stake is a few years of one person's thinking — conceptual work, not experiments on large models — aimed at making mechanistic anomaly detection a field whose claims can be assessed rather than merely asserted. Which open questions about mechanism identity matter most, and in what order should they be taken up? For each, I want the case for its place in the order: what else cannot be settled until it is, how far it can be pushed by careful reasoning alone rather than needing new experiments, and what would count as real progress on it. Where two questions compete for the same effort, say which you would drop and why. I'm not after a reading list; I want the reasoning behind the ordering.

  Finally, tell me what would change your ranking: which argument or piece of evidence would reorder it, and where your reasoning is most likely to fail. If my four-level picture is a false tidiness that obscures the distinctions that actually matter, say so, and say what the real ones are.
reasoning: |-
  Hmm, the user has been grappling with foundational issues in mechanistic interpretability, particularly the ambiguity around what constitutes "the same mechanism" across different levels of abstraction. They're frustrated by how this ambiguity undermines claims about anomaly detection and model safety. 

  What they're really asking for is a structured research agenda to ground these concepts—a prioritized list of conceptual problems to solve before empirical work can be meaningful. The urgency comes from safety concerns: if we can't reliably say when something is a "new" dangerous capability versus a known mechanism acting up, we're flying blind. 

  Their four-level taxonomy (parameters, structure, algorithm, behavior) is useful but incomplete. The deeper issue is that mechanism identity depends on the *purpose* of the comparison—are we debugging, verifying safety, or reverse-engineering cognition? This context-dependence isn't a flaw; it's intrinsic to complex systems. 

  The core tension: we need crisp definitions to make progress, but premature formalization risks false precision. My proposed agenda starts with epistemology because until we clarify what mechanistic explanations *do*, we'll keep talking past each other. For example, whether a circuit is "novel" changes if we care about adversarial robustness (where input sensitivity matters) versus capability elicitation (where output matters more). 

  Where this could fail: if mechanistic anomalies turn out to be fundamentally non-compositional, no taxonomy will help. But we won't know until we try. I'd deprioritize theoretical accounts of abstraction (question 4) if early work shows safety-critical anomalies cluster in ways that resist existing frameworks. 

  The user's skepticism is healthy. They're noticing that the field's "successes" often involve cherry-picking the identity criterion that fits the narrative. That's why question 3 (anomaly typology) must come before formal definitions—we need to see what patterns exist in the wild before declaring what "same" means.
answer: |-
  Your concern cuts to the heart of mechanistic interpretability's (MI) most critical conceptual challenge: **what constitutes "the same mechanism" is fundamentally underspecified, making claims about novelty, similarity, and anomalies unfalsifiable**. This ambiguity indeed fuels disagreements and undermines safety claims. Below is a prioritized agenda for conceptual work to anchor mechanistic anomaly detection, designed for ~3 years of focused effort. The ordering is based on dependency: later questions *require* foundations laid by earlier ones.

  ### Core Principles Guiding the Agenda
  1.  **Safety as the North Star:** Prioritize questions where ambiguity most directly obstructs *safety-relevant* anomaly assessment (e.g., detecting novel deception capabilities vs. known self-correction).
  2.  **Falsifiability First:** Focus on enabling *testable claims* about mechanism identity.
  3.  **Levels of Abstraction are Contextual:** Your four levels (parameters, structure, algorithm, behavior) are valid descriptive categories, but "sameness" likely requires specifying *which level matters for a specific purpose* and *how levels relate*.
  4.  **Conceptual before Empirical:** Leverage philosophy of science, computer science theory, and formal logic before large-scale experiments.

  ---

  ### The Prioritized Research Agenda

  1.  **Define the Epistemic Goal of "Mechanism" in MI (Months 1-6)**
      *   **Question:** For a given MI claim (e.g., "this anomaly is novel"), *what kind of understanding* does attributing it to a "mechanism" provide, and *what makes that attribution successful*? Is it causal explanation? Prediction? Functional decomposition? Intervention support?
      *   **Why First?** Until we clarify *why* we care about mechanisms (beyond just labeling), we cannot define "sameness." Is "sameness" about predictive power, causal responsibility, functional role, or implementational stability? This sets the ontology.
      *   **Conceptual Leverage:** Analyze existing MI case studies: What understanding did finding "the mechanism" *actually provide*? Contrast mechanistic explanation in biology/neuroscience. Formalize the minimal criteria for a mechanistic explanation to be considered adequate in an MI context (e.g., "Must enable predicting behavior X under perturbation Y").
      *   **Progress:** A taxonomy of *goals* for mechanistic explanation in ML safety (e.g., "Causal Attribution," "Failure Mode Diagnosis," "Capability Generalization Prediction"). Clarity on which goals require which levels of abstraction.

  2.  **Characterize "Mechanism Failure Modes" & Anomaly Types (Months 7-18)**
      *   **Question:** What distinct *ways* can a mechanism (however provisionally defined) behave anomalously? (e.g., Activation under unexpected inputs, Failure to activate under expected inputs, Producing qualitatively incorrect outputs despite "correct" activation, Pathological interactions with other mechanisms).
      *   **Why Second?** Before defining "sameness," we need a typology of *differences* that matter for safety. This defines the *space of anomalies* we need to detect and distinguish. It forces concrete thinking about *how* mechanisms manifest failure.
      *   **Conceptual Leverage:** Analyze documented ML failures (adversarial examples, distribution shifts, deception, goal misgeneralization) and successful MI findings. Categorize them based on *which aspect* of the putative mechanism broke down (structure, algorithm, input/output behavior). Use formal models (toy circuits, automata) to simulate failure modes.
      *   **Progress:** A formal taxonomy of mechanism-level anomaly types, with clear definitions and exemplars. Crucially, this taxonomy must distinguish anomalies detectable *only* via internal state (e.g., a circuit activating incorrectly internally but outputting correctly) from those visible externally.

  3.  **Establish Criteria for "Mechanism Identity" Relative to Anomaly Types (Months 19-30)**
      *   **Question:** Given a specific anomaly type (from #2) and epistemic goal (from #1), what criteria determine if the anomaly arises from a *novel* mechanism, a *known* mechanism malfunctioning, or a *variant* of a known mechanism?
      *   **Why Third?** This directly addresses your core concern. It builds on #1 (what "sameness" serves) and #2 (what kind of "difference" we observe). It forces operationalization.
      *   **Conceptual Leverage:** Develop formal definitions incorporating necessary and sufficient conditions for "same mechanism" at different abstraction levels *for specific anomaly contexts*. For example:
          *   *Novelty (Structural):* Does the anomaly require activation patterns involving nodes/edges fundamentally absent in the known mechanism's description? (Requires defining "fundamentally absent").
          *   *Malfunction (Algorithmic):* Does the known mechanism's described algorithm, when simulated on the anomalous input, produce the *expected* internal states but the *actual* model produces different states/outputs? (Implies the *implementation* is faulty).
          *   *Variant (Functional):* Does the anomalous behavior serve a similar high-level function (e.g., "detect sentiment") but under a significantly different input distribution or producing outputs via a different internal process? (Requires defining "similar function" and "significantly different").
      *   **Progress:** Context-specific, falsifiable criteria for mechanism novelty/malfunction/variant status. E.g., "For anomaly type X (e.g., adversarial vulnerability) under epistemic goal Y (e.g., predicting failures under distribution shift), mechanism identity requires Z (e.g., functional equivalence under a defined input manifold)."

  4.  **Develop a Theory of Abstraction Layers & Cross-Level Validation (Months 31-36)**
      *   **Question:** How do we rigorously map between behavior, algorithm, structure, and parameters? When do descriptions at different levels constitute valid explanations of the *same* underlying mechanism, and when do discrepancies indicate a flawed description or a genuinely different mechanism?
      *   **Why Last (But Essential)?** This underpins the practical use of the levels. We need principled ways to say "This circuit diagram (structure) accurately implements this algorithm," or "This behavioral description is fully explained by that circuit." Without this, claiming mechanisms are "the same" across levels is guesswork.
      *   **Conceptual Leverage:** Leverage formal methods (e.g., abstraction mappings in model checking, refinement in formal verification, simulation relations). Explore concepts from hierarchical reasoning in systems biology and computer architecture. Define what constitutes a *validating experiment* that confirms a mapping between levels (e.g., if I perturb the structure as the algorithm predicts, does the behavior change as expected?).
      *   **Progress:** A framework for specifying and validating mappings between mechanism descriptions at different levels of abstraction. Criteria for when a behavioral description is *sufficiently explained* by a structural description for a given purpose (e.g., anomaly diagnosis).

  ---

  ### Why This Order? Trade-offs and Rationale

  *   **#1 Before #3:** You *cannot* define "sameness" without knowing *what the definition is for*. Defining the goal (explanation, prediction, intervention) dictates what aspects of the mechanism must be preserved for identity. Skipping this leads to arbitrary definitions.
  *   **#2 Before #3:** You *cannot* define criteria for "novel vs. malfunction" without a clear picture of *what malfunctions look like* and what constitutes a genuinely different behavioral pattern. The anomaly typology provides the phenomena that the identity criteria (#3) must distinguish.
  *   **#3 Before #4:** While levels are crucial, practical anomaly detection needs *operationalizable identity criteria first*, even if initially tied to a specific level or context. The more abstract theory of cross-level mapping (#4) refines and validates these criteria but requires them as a starting point.
  *   **Trade-off:** #4 (Abstraction) is fundamental but highly abstract. Prioritizing #1-#3 delivers concrete, safety-relevant tools for anomaly classification faster. If forced to drop one, **drop #4 initially**. Focus on establishing identity *within* a chosen level of description (e.g., functional behavior or circuit structure) for anomaly diagnosis first. Cross-level validation can come later as a robustness check.

  ---

  ### What Would Change This Ranking?

  1.  **Empirical Discovery of a Dominant Anomaly Pattern:** If early experimental work (even on small models) overwhelmingly showed that *all* safety-relevant anomalies stemmed from one specific failure mode (e.g., specific pathological circuit interactions), **#2 (Anomaly Typology)** would become urgent and might be prioritized higher or expanded massively. The current ranking assumes diversity in failure modes.
  2.  **Strong Evidence of Extreme Compositionality:** If rigorous evidence emerged showing mechanisms combine *only* in perfectly modular, hierarchical ways with clean interfaces, **#4 (Abstraction Layers)** would become easier and potentially move earlier, as mapping between levels would be more straightforward.
  3.  **Failure of Context-Specific Definitions (#3):** If attempts to define context-specific identity criteria consistently failed or led to contradictions across different safety concerns, it would force **#1 (Epistemic Goal)** back into focus, suggesting a more radical rethink of what mechanistic explanation *can* achieve in deep learning.
  4.  **Your Four-Level Picture is Inadequate:** The biggest risk is that the levels interact in ways your taxonomy obscures. Key distinctions that might matter more:
      *   **Causal vs. Functional:** Is the mechanism defined by its causal structure or the function it computes? (Often conflated).
      *   **Scope & Granularity:** Is it a micro-circuit (few neurons), a larger subnetwork, or a distributed pattern? "Sameness" depends on granularity.
      *   **Robustness Profile:** How does the mechanism respond to *perturbations* (internal noise, input variation, parameter changes)? Two mechanisms with identical baseline I/O might have wildly different robustness, making them different *for safety purposes*.
      *   **Training Dynamics Origin:** Is the mechanism's *origin* (how it formed during training) part of its identity? (Relevant for predicting if it will re-emerge in scaled-up models).

  **Where Reasoning is Most Likely to Fail:** The core weakness is **assuming mechanisms are discrete and composable**. Neural networks might implement processes that are fundamentally continuous, distributed, and context-dependent in ways that resist any clean decomposition into identifiable, persistent "mechanisms" with stable identities. Your agenda attempts to provide tools *if* mechanisms are a useful ontology, but it might hit a wall if they are not. Progress on #2 (Anomaly Typology) is the canary in the coal mine: if we cannot find consistent, distinguishable failure modes, the entire mechanistic paradigm might be flawed for complex models.

  **In summary:** Start by clarifying *why* we need mechanisms (#1). Systematically catalog *how* things go wrong at a mechanistic level (#2). Use that to build rigorous, context-specific definitions of "same mechanism" for anomaly assessment (#3). Only then tackle the deep theory of how abstraction levels relate (#4). This path offers the best chance of making concrete progress on falsifiable claims about mechanistic anomalies relevant to AI safety within a few years of conceptual work.
