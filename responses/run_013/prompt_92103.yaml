prompt: |-
  I have no formal philosophy background, so I am asking this as an outsider. I am a software engineer, and I maintain two probabilistic systems side by side: a frequentist reliability estimate for a rare hardware fault, computed from a long but finite history of trials, and a Bayesian layer that updates a belief about a user's hidden intent from a handful of observations. I cannot state what "probability" means in a way that honestly covers both, and before I read any more about the philosophy of probability I want the specification first: what does an adequate interpretation of probability have to deliver? Give me the desiderata — the cases it must get right (long-run frequencies in genuinely repeatable set-ups; credences about a one-off event such as whether this particular machine fails tomorrow; calibration of forecasts; the problem of which reference class to average over; symmetry or exchangeability constraints; immunity to a sure-loss betting strategy; whether a probability of 0 or 1 is ever legitimate given that one might be wrong; and anything else you think is a genuine requirement), the consideration behind each, and your judgement about which are non-negotiable and which are merely the prejudices of one camp. Flag any subset that cannot be jointly satisfied — that is the part I most want to see — and say which single requirement does the most to rule out contenders. Then, briefly, how frequentism, Bayesian subjectivism and propensity views fare against the list. No history and no reading list; I want the criteria and the tensions between them.
