answer: |-
  Here's your debate menu for "could have done otherwise" – broken down by interpretation, verdict, and impact on free will under determinism. I'll flag confidence levels (High/Medium/Low) and explicitly note the weakest point. Crucially, **your housemate is almost certainly using Reading 1**, which *does* let determinism kill free will... but compatibilists argue free will doesn't *require* that reading.

  **The Core Interpretations & Verdicts:**

  1.  **Categorical Possibility ("Leeway Theory"):**
      *   **Claim:** At the exact moment of choice, given *the actual past and the laws of nature (physics, neurobiology, etc.)*, more than one future was genuinely, metaphysically possible. The universe itself was "open" at that point.
      *   **"Could" Meaning:** A fundamental, non-causal possibility inherent in the state of the universe itself at that instant.
      *   **Verdict under Determinism:** **False.** Determinism *means* that given the past state and laws, only one future is metaphysically possible. There was no "branch point" in reality itself. *This is the reading your housemate is using.*
      *   **Impact on Free Will:** If free will *requires* this kind of categorical possibility (Libertarianism), then determinism kills it. **HARD DETERMINIST TRUMP CARD.**
      *   **Confidence in Verdict:** High (this is the standard incompatibilist claim).
      *   **Whose "Could"?** The universe's.

  2.  **Conditional Possibility ("Compossibility" - Compatibilist Core):**
      *   **Claim:** *If* the agent had *wanted* (or chosen, intended, reasoned, valued) differently *at that moment*, *then* they *would have been able* to do otherwise. It's about the relationship between the agent's psychology and their actions.
      *   **"Could" Meaning:** An ability or power of the *agent* that *would* have been triggered *if* their relevant mental states had been different. (e.g., "If I had *wanted* to raise my hand instead of lower it, I *could* have raised it").
      *   **Verdict under Determinism:** **Can be True.** Even in a deterministic world, agents can possess stable psychological dispositions and abilities. *What's fixed* is which mental state occurs, *not* the link between mental states and possible actions. If the agent *had* (counterfactually) desired otherwise, and they possess the relevant ability, they *would* have done otherwise.
      *   **Impact on Free Will:** Compatibilists argue **this is sufficient for free will and moral responsibility.** Free will is about *agency* (acting according to your reasons/desires without compulsion), not about metaphysical openness. They cheerfully grant determinism kills Reading 1 but say it doesn't matter.
      *   **Confidence in Verdict:** High (this is the standard compatibilist move).
      *   **Whose "Could"?** The agent's own capacities/dispositions.

  3.  **Epistemic Possibility (Before the Fact):**
      *   **Claim:** Before the action occurred, given the knowledge available (to the agent or an observer), it was reasonable to believe multiple outcomes were possible. The outcome wasn't *predictable* with certainty beforehand.
      *   **"Could" Meaning:** A statement about *uncertainty* or *lack of knowledge*, not about metaphysical possibility.
      *   **Verdict under Determinism:** **Can be True (and often is).** Determinism doesn't imply predictability. Extreme complexity, chaos, or lack of data can make outcomes genuinely unpredictable, even if determined. ("I couldn't have known for sure which way he'd jump").
      *   **Impact on Free Will:** **Irrelevant to the core debate.** Both hard determinists and compatibilists agree this isn't what free will hinges on. It's about knowledge limits, not freedom of the will itself. Compatibilists grant this easily; hard determinists say it misses the point.
      *   **Confidence in Verdict:** High.
      *   **Whose "Could"?** An observer's (or the agent's prior) knowledge state.

  4.  **Probabilistic Chance:**
      *   **Claim:** There was a genuine, non-zero objective probability (not just epistemic uncertainty) that the agent would do otherwise.
      *   **"Could" Meaning:** An objective propensity or chance in the system.
      *   **Verdict under Determinism:** **False (by definition).** Determinism entails that the outcome was fixed at 100% probability given the past and laws. Genuine indeterminism is required for this reading. (Note: Some argue quantum effects introduce this, but it's highly controversial if this helps free will).
      *   **Impact on Free Will:** Similar to Reading 1. If free will requires *this* kind of chance, determinism kills it. Libertarians sometimes use this. Compatibilists reject the need for it.
      *   **Confidence in Verdict:** Medium-High (depends on strictness of determinism definition; pure determinism excludes objective probabilities <1).
      *   **Whose "Could"?** The universe's (as a probabilistic system).

  5.  **Opportunity / Absence of Constraint:**
      *   **Claim:** There were no external physical or legal barriers preventing the agent from doing the alternative action. The *path* was physically open.
      *   **"Could" Meaning:** The situational possibility was present; the action was within the agent's physical/legal capacity *if they tried*.
      *   **Verdict under Determinism:** **Can be True.** Determinism doesn't imply constant physical restraint or locked doors. ("I *could* have left the room" meaning the door wasn't locked, even if determinism meant I wouldn't have chosen to).
      *   **Impact on Free Will:** **Necessary but not sufficient.** Both sides agree you usually need opportunity/absence of constraint *plus* something about your will (Reading 2) or metaphysical openness (Reading 1). Compatibilists happily grant this condition.
      *   **Confidence in Verdict:** High.
      *   **Whose "Could"?** The situation/environment.

  6.  **Agential Power / Ability:**
      *   **Claim:** The agent *possessed the general capacity or skill* to perform the alternative action *type*. This is about their competence, not the specific occasion.
      *   **"Could" Meaning:** A standing ability or disposition of the agent. ("I *can* speak French" vs. "I *did* speak French on that occasion").
      *   **Verdict under Determinism:** **Can be True.** Determinism doesn't mean people lack skills or capacities. It explains *when* they exercise them based on prior states/laws.
      *   **Impact on Free Will:** **Necessary but not sufficient.** Similar to Reading 5. Having the *power* to do X doesn't mean you freely *chose* to do X on a specific occasion. Compatibilists grant this readily.
      *   **Confidence in Verdict:** High.
      *   **Whose "Could"?** The agent's capacities.

  **Addressing Your Specifics:**

  1.  **Frankfurt-Style Cases:**
      *   **Target:** They directly attack the **necessity** of Reading 1 (Categorical Possibility) for moral responsibility. Jones decides to vote for Trump on his own. Black, a neurosurgeon with a device, *would have* forced Jones to vote Trump *if* Jones had shown any sign of voting Clinton, but Jones never does. Black never intervenes. Jones votes Trump freely (satisfies Reading 2 - he acted on his own desires/choices). Crucially, Jones *could not have done otherwise* (Reading 1) because if he'd tried, Black would have stopped him. Yet, intuitively, Jones seems morally responsible.
      *   **Impact:** Shows that **Reading 1 might not be necessary** for moral responsibility/free will. Jones lacked the categorical possibility (Reading 1 is false) but still seems responsible because his action flowed from *his own reasons* (Reading 2 is true). **This is why compatibilists care:** it suggests the core of free will is the *source* of the action (the agent's psychology - Reading 2), not the existence of alternative possibilities (Reading 1). Your housemate dismisses it as a "party trick" likely because it challenges the necessity of his trump card (Reading 1). The debate is whether the case *really* shows no alternative possibilities (some argue the *sign* Jones might show counts as an alternative possibility) and whether intuitions about responsibility hold.

  2.  **Psychology vs. The World:**
      *   **Crux Confirmed:** You've nailed the key divide. Readings **where "could have done otherwise" comes out true under determinism (2, 3, 5, 6) are fundamentally about the *agent's psychology, capacities, or the epistemic/situational context*.** Reading 2 (the compatibilist core) is explicitly about the agent's *dispositions* given *counterfactual changes in their own mental states*. Readings 5 & 6 are about capacities and opportunities. Reading 3 is about knowledge.
      *   **Readings about the "world" (where it comes out false under determinism - 1 & 4) are about *metaphysical possibility or objective chance* inherent in the universe's state, independent of the agent's mind.**
      *   **The Debate:** Your housemate (hard determinist) thinks free will *requires* Reading 1 (or 4) - a feature of the world. Compatibilists think free will *requires* Reading 2 (plus 5 & 6) - features of the agent's psychology and capacities within the world. **The fundamental disagreement is about what "free will" *is*.** Is it about *ultimate origin* in an open universe (Reading 1)? Or is it about *agency* - acting according to your own reasons without compulsion (Reading 2), even if those reasons were determined?

  **The Menu Summary & Strategy:**

  *   **Housemate's Trump Card:** Relies **exclusively** on Reading 1 (Categorical Possibility). Determinism makes Reading 1 false. *If* free will requires Reading 1, he wins.
  *   **Your Compatibilist Move:** **Reject that free will requires Reading 1.** Argue that free will requires **Reading 2 (Conditional Possibility)** - the link between your psychology and your actions. Determinism *doesn't* automatically make this false. Frankfurt cases (though tricky) support the idea that Reading 1 isn't necessary. Readings 5 & 6 are also necessary conditions you can grant.
  *   **The Real Question:** Shift the debate *away* from "Does determinism make Reading 1 false?" (Answer: Yes) to "**Does moral responsibility and the kind of freedom worth wanting *really* depend on Reading 1, or is Reading 2 sufficient?**" This is the core philosophical disagreement. Argue that Reading 2 captures our actual practices of praise, blame, deliberation, and the difference between acting freely vs. being coerced or insane.

  **Weakest Point (My Confidence Lowest): Frankfurt Cases under Determinism.**
  *   **Why Low Confidence?** The debate is intense. Critics argue: 1) If determinism is true, Jones *wasn't* ever going to show the sign, so Black's device is irrelevant, and Jones *did* have the categorical possibility (Reading 1) *in the actual sequence* since the device wasn't activated. 2) Some argue the mere *presence* of the device/Black's intention *itself* removes Jones's freedom, even if unused. Defenders refine the cases endlessly. While I think they *do* create strong intuition against the necessity of Reading 1, *proving* they work flawlessly under strict determinism is the hardest part of the compatibilist arsenal. Your housemate's dismissal, while glib, taps into real controversy. Focus more on the positive case for Reading 2 being sufficient.

  **Go into the kitchen armed:** "Okay, let's talk 'could have done otherwise'. When you say that, which *exact* meaning are you using? Because if you mean [Reading 1], sure, determinism kills that. But that's not the only meaning, and compatibilists like me think free will is really about [Reading 2]. When *I* say 'I could have done otherwise', I mean [Reading 2] - that if I'd wanted to, I had the ability and opportunity to do it. Determinism doesn't touch *that*. So your 'trump card' only wins if you assume free will *must* require your specific meaning. Why should we accept that assumption?" Be ready for him to insist Reading 1 is the "real" meaning – that's the core metaphysical standoff. Good luck!
