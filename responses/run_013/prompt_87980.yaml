answer: |-
  Here’s a streamlined set of desiderata for social explanation, grounded in your cases, with tensions highlighted. I’ll define terms *in situ* and avoid jargon where possible.

  ---

  ### **Core Desiderata for Social Explanation**  
  *(Requirements any adequate theory must satisfy)*  

  1. **Microfoundations Compatibility**  
     - **Requirement**: Explanations must be compatible with the fact that social phenomena are ultimately constituted by individuals’ actions, beliefs, and interactions.  
     - **Why?** Without this, explanations become "magical" (e.g., claiming "the market" acts without people trading). Your bank run case: even though institutional rules matter, the run *is* depositors withdrawing funds.  
     - **Genuine constraint?** Yes—unless you reject materialism about society.  

  2. **Emergence & Non-Reduction**  
     - **Requirement**: Explanations must account for system-level properties that arise from individual interactions but aren’t reducible to individual attributes (*emergence*).  
     - **Why?** In neighborhood tipping, mild individual preferences *generate* sharp segregation patterns no individual intended. Reducing it to "just individuals" misses the pattern dynamics.  
     - **Genuine constraint?** Yes—patterns have explanatory power beyond parts.  

  3. **Downward Causation**  
     - **Requirement**: Explanations must allow social structures to causally influence individuals (*downward causation* = higher-level properties constraining/affecting lower-level parts).  
     - **Why?** Caste shapes opportunities even for non-prejudiced individuals; constitutions bind future generations. Ignoring this misses how structures *actively constrain* choice.  
     - **Genuine constraint?** Yes—social facts (e.g., laws) objectively limit options.  

  4. **Causal Autonomy of Social Kinds**  
     - **Requirement**: Explanations must recognize that social categories (e.g., "caste," "market") can be causally effective even when they’re *multiply realizable* (i.e., implemented by different individual configurations).  
     - **Why?** "Caste" operates similarly in hiring across varied individual attitudes; "market prices" emerge from countless buyer-seller pairs. Ignoring this forces uselessly complex explanations.  
     - **Genuine constraint?** Yes—social kinds track stable causal roles.  

  5. **Feedback & Path Dependence**  
     - **Requirement**: Explanations must handle self-reinforcing cycles (*feedback*) and historical lock-in (*path dependence* = past events constrain present options).  
     - **Why?** Credit scores alter behavior, which then alters future scores; constitutions persist because changing them is costly. Static explanations fail here.  
     - **Genuine constraint?** Yes—social dynamics are often recursive.  

  6. **Difference-Making without Overdetermination**  
     - **Requirement**: Explanations must identify what *changes the outcome* (difference-makers) without implying redundant causation (e.g., "both structure and individuals caused it, separately").  
     - **Why?** In a bank run, *both* individual panic *and* institutional rules (no insurance) are difference-makers, but they interact—they’re not independent causes.  
     - **Genuine constraint?** Yes—good explanations avoid causal bloat.  

  ---

  ### **Key Tensions & How Real They Are**  
  - **Supervenience vs. Emergence**:  
    - **Tension**: If social facts *supervene* on individual facts (i.e., no social change without individual change), how can they have independent causal power?  
    - **Real or fake?** Real but resolvable: Social properties can be *difference-makers* by organizing individuals (e.g., "no insurance" enables bank runs). No overdetermination—the institution sets the *conditions* for individual actions.  

  - **Multiple Realizability vs. Reductionism**:  
    - **Tension**: If caste functions similarly across different individual beliefs, can it be reduced to individual psychology?  
    - **Real or fake?** Real and unresolvable for reductionists: Social kinds (like "algorithmic bias") are defined by their *effects*, not specific micro-configurations.  

  - **Difference-Making vs. Parsimony**:  
    - **Tension**: If both structure and individuals are difference-makers, is the explanation redundant?  
    - **Real or fake?** Fake: They’re *relational*. The bank run’s cause is "depositors acting *under institutional rules*"—a single, layered difference-maker.  

  **Most Eliminative Requirement**: #3 (**Downward Causation**). Denying this forces "explanatory individualism," which fails on caste/constitutions (#4, #5). Accepting it forces structural explanations.  

  ---

  ### **How the Camps Stack Up**  
  | **Requirement**               | **Individualism** | **Holism/Structuralism** | **Middle Path (e.g., mechanisms + constraints)** |  
  |-------------------------------|-------------------|--------------------------|--------------------------------------------------|  
  | **1. Microfoundations**       | ✅ Nails it       | ❌ Often ignores          | ✅ Embeds mechanisms in contexts                |  
  | **2. Emergence**              | ❌ Rejects        | ✅ Prioritizes           | ✅ Explains how patterns arise                  |  
  | **3. Downward Causation**     | ❌ Denies         | ✅ Central               | ✅ Structures constrain mechanisms              |  
  | **4. Causal Autonomy**        | ❌ Weak           | ✅ Strong                | ✅ Social kinds as "contextual actors"          |  
  | **5. Feedback/Path Dependence**| ⚠️ Partial       | ✅ Good                  | ✅ Best: explains cycles & inertia              |  
  | **6. Difference-Making**      | ✅ Focuses on individuals | ✅ Focuses on structures | ✅ Best: integrates both levels                |  

  **Verdict**:  
  - **Individualism** (#1) wins on microfoundations but fails emergence (#2) and downward causation (#3).  
  - **Holism** wins on structure (#3, #4, #5) but risks ignoring mechanisms (#1).  
  - **Middle Path** (e.g., "structural mechanisms" or "constrained individualism") balances all best but requires careful phrasing to avoid vagueness.  

  ---

  ### **Your Seminar Cheat Sheet**  
  - **Individualists** say: "Explain social outcomes *only* by individuals + incentives."  
  - **Holists** say: "Structures have independent causal power."  
  - **You can argue**: "Good explanations show *how structures emerge from individuals and then constrain them*, without reducing one to the other." Use your cases:  
    - Bank run = Individuals *interacting under rules* (emergent panic + institutional vulnerability).  
    - Caste = A category that *shapes individuals* but is *reproduced by their actions* (even unwittingly).  
    - Risk scores = Algorithmic *feedback loops* that individuals navigate but rarely control.  

  This framework puts *explanatory work* first, labels second. Good luck Thursday!
