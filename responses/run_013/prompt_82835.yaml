  My friend and I have been going around in circles on the rule-following / Kripkenstein stuff for weeks and I just want a number out of you instead of another "well it depends what you mean by meaning." Here's the case, spelled out so were on the same page. Say I've been adding numbers my whole life — 2+2=4, 17+25=42, thousands of sums like that. Now define a function, call it schmadd, that agrees with plus everywhere except one place: if the decimal expansion of the sum contains the string 77777777, the answer is 0 instead. Every sum I've ever done or ever will do comes out identical under plus and schmadd, because nobody is ever going to hit eight 7s in a row by hand. So what makes it true that I meant plus and not schmadd? My friend thinks she's solved it: she says meaning is fixed by the algorithm I've internalized — there's a specific finite procedure running when I add, and plus and schmadd are different procedures, so the fact of the matter is just a fact about which procedure is in my head. On her view the paradox only bites if you insist meaning be fixed by something outside any procedure, like a list of past answers or a rule floating in Platonic heaven.

  What I want is your credence that her algorithm fix actually works — that it gives a determinate answer to whether I meant plus or schmadd, without quietly helping itself to the very notion of "the same procedure" that the skeptic put in question. Number first, then the decomposition. I'd want at least these terms: the probability that the skeptical argument is sound and there's simply no fact of the matter to recover (so nothing to solve); the probability that a finite internal procedure can carry determinate content at all rather than being re-describable in deviant ways at the next level up; the probability that the regress here is vicious rather than benign; and the probability that any working solution has to bring in a community or a shared practice, which would sink her individualist version even if the rest is fine. Rough numbers with a line each, then how they combine into your final figure, then which term you're least confident about and what would move it most.

  For what it's worth I'm at about 0.3 and she's at 0.85, so also tell me where our disagreement probably actually lives.
