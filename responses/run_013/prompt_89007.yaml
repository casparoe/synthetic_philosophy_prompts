answer: |-
  Grandfather sipped his coffee as his grandson strapped into the time machine. "Remember the rules, lad."
  "Rules? It's simple. Go back, stop Gramps Bert before he meets Gran, paradox achieved. Clean break."
  "Ah, but *why* did you build this machine? Why *this* compulsion?" Grandfather leaned forward. "Because *I* went back. And failed."
  The grandson paused. "Failed? But... you're here."
  "Precisely. My failure preserved the line, allowing your father, then you, to inherit the urge. And just as *I* arrived with murderous intent, I found *my* grandfather..."
  "...Already fighting off *his* grandson?"
  "Who was, naturally, fighting off *his* own future assassin. We're a punctual lot. It was quite the family reunion in 1947." Grandfather tapped the console. "Think, boy. If any of us *succeeded*, where would the *next* assassin come from? Who would build *your* machine?"
  The grandson frowned. "But... the branching timelines theory..."
  "Pfft! Tourist timelines. Cheap knock-offs. Novikov had it right: the universe *squeaks*. Reality only permits the loop that snaps shut. My failure *was* your great-grandfather's success. My presence here, drinking this tea, *is* the proof that you won't shoot me in 1947, just as Gramps Bert's survival proved *I* wouldn't shoot *him*." He took a slow sip. "We don't fail because we're bad shots. We 'fail' because succeeding would erase the hand aiming the gun. We're not assassins, lad. We're... temporal ballast. Now off you pop. Try not to sprain anything dodging your own future self."

  *(The joke hinges on the forced self-consistency (Novikov) inherent in the multi-generational setup. The "failure" is necessary for the existence of the attempt itself. The branching timeline idea is dismissed as "tourist timelines," highlighting the airtight nature of the fixed point where existence *is* the alibi for non-intervention.)*
