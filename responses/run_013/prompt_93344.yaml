prompt: |-
  Ok so I lost a two hour argument at the pub on Friday about the free energy principle — my friend (she does comp neuro) kept saying it either says nothing about minds at all or, if it does say something, its false, and I couldn't budge her an inch. Now it turns out I'm running next month's phil of mind reading group on it: 90 minutes, six people, a whiteboard, and everyone's read exactly one paper on each side, so they'll show up either converted or furious. Don't explain the FEP to me, give me a plan for the session.

  What order do the pieces have to go in so free energy never looks like a magic word? The spine I've got is: surprise, why you can't actually compute it, why a bound on it is something you can compute, perception as inference, action as inference, and only then the jump to "any system that persists at all is doing this" — is that the right order, and what's missing or in the wrong place?

  Which single example carries the whole thing? I want to use a thermostat, partly because my friend says you can run the entire story on one and I half beleive her, but I could use the tickling thing or binocular rivalry instead. Tell me what the carrying example has to have and what it must not have, and exactly where the thermostat breaks.

  Then the misconceptions, in the order they'll actually show up, with the point in the sequence where I head each one off: "the brain wants to be right about the world", "free energy is energy", "surprise is prediction error", the dark room thing (if surprise is bad why doesn't the system just curl up somewhere dark and boring forever), and the one I'm most worried about, that a Markov blanket is a wall — the statistical boundary thing.

  Last thing: I want to hang the session on the fork she threw at me, that it's either a physics claim that says nothing about minds or a mind claim that's false. Is that a real fork or would I just be teaching them a false dilemma? And give me one question to ask at the end that would actually tell me whether it landed, plus what I should openly say I'm not going to explain at this level.
