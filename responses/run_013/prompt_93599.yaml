prompt: |-
  You are a philosopher of science with a specialist's command of the realism debate — the no-miracles argument, the pessimistic meta-induction, entity realism, structural realism, and the "divide et impera" reply to the meta-induction. Please reason carefully and in stages, and begin by brainstorming rather than committing early to an answer. I do not need citations, reading lists, or a survey of the literature; I want your reasoning about the record below.

  I am writing a paper on whether any form of selective realism survives the pessimistic meta-induction, or whether selectivity is always hindsight — a rule that only looks principled because we already know which posits happened to survive. My central test case is a senior colleague whose published work and seminar remarks give her a long and explicit track record of verdicts about whether the theoretical posits of past science were really something in the world or merely useful fictions. She has never stated her criterion in a single sentence, which is why I am asking you. Her record, as I have reconstructed it:

  - Phlogiston: never a real thing.
  - Caloric: never a real thing.
  - The luminiferous ether: never a real thing, even though the equations of the wave theory of light survived the transition to relativity.
  - Newton's absolute space and absolute time: never real.
  - Bohr's stationary orbits: never real — though she grants that the energy levels and the spectral regularities they were introduced to explain are real.
  - Atoms: real.
  - Electrons: real.
  - Mendel's factors, that is, genes: real.
  - The electromagnetic field: real.
  - Neptune: real; she treats its prediction from the perturbations of Uranus and its subsequent discovery as a model case.
  - Vulcan: never real — the planet posited to explain the anomalous perihelion of Mercury.

  Three cases have now come up in our seminar, and I need to predict her verdicts on each.

  (a) Quarks. Introduced in the 1960s to organize the hadron spectrum and now indispensable to the Standard Model; but they are confined, and no isolated quark has ever been observed or, on the standard theory, ever can be. Everything we know of them comes from scattering experiments, jets, and the symmetries of the theory.

  (b) Dark matter. Posited to explain galactic rotation curves and now load-bearing in the standard cosmological model, including its account of the cosmic microwave background; but decades of direct and indirect detection have produced no confirmed signal.

  (c) The Higgs field. Posited in the 1960s as the mechanism by which elementary particles acquire mass, with a nonzero value in the vacuum, and now associated with a particle detected at CERN's Large Hadron Collider; the field itself is not something anyone can isolate or manipulate, only infer.

  Please do the following, in order.

  1. Brainstorm the candidate rules such a philosopher might be running — the no-miracles realist rule, the pessimistic meta-induction, entity realism about manipulable entities, structural realism about retained formalism, the "divide et impera" rule about posits essential to a theory's success, and any further rule of your own that fits at least as well. State each rule precisely and say which of her verdicts it accommodates and which it cannot.
  2. Identify which rules survive her record intact, and state the survivors in the form of a criterion I could apply to a new case myself. Point to the individual verdicts that do the discriminating work: which single verdicts eliminate which rules.
  3. Predict her verdict on each of the three new cases, attributing each prediction to the rule that generates it.
  4. Say which of the three is the sharpest test of the surviving rules, and which rule you would bet she is actually running, with your reasons and a rough sense of your confidence. Where the record underdetermines a verdict, say so, and say what further fact about her would resolve it.
  5. Name one further case — real or invented — whose verdict would settle the matter, and explain why the record as it stands cannot settle it.
  6. Finally, answer the question my paper turns on: is her pattern a principled selective realism, or hindsight in disguise? If it is hindsight, state exactly what an honest version of her view would have had to commit to in advance.

  Be decisive where the evidence allows and explicit where it does not. I am less interested in a catalogue of positions than in what her record actually commits her to.
reasoning: |-
  Hmm, this is a fascinating challenge in applied philosophy of science. The user wants me to reconstruct a colleague's implicit scientific realism criterion from her historical verdicts and apply it to new cases. Let me approach this methodically.

  First, I need to map her judgments against major realism frameworks. Her rejection of phlogiston/caloric/ether/Vulcan while accepting atoms/electrons/Neptune suggests she's not a naive realist. But her nuanced take on Bohr's orbits (rejecting orbits but keeping energy levels) points to something more sophisticated than entity realism alone.

  Looking at the cases she rejects: all involve explanatory failures. Phlogiston couldn't explain weight gain; ether conflicted with relativity; Vulcan was disproven. But her acceptance of electromagnetic fields is interesting - they're not directly manipulable but have overwhelming indirect evidence. This makes me think she might be running a "robust detection" criterion where multiple independent lines of evidence converge.

  For the new cases: Quarks seem safe - their predictive success with jets and confinement is analogous to electrons in early cloud chambers. Dark matter is trickier - while central to cosmology, the lack of direct detection might make her hesitate given her Vulcan precedent. Higgs is fascinating - the detected particle confirms the field's reality despite its non-isolability, much like the EM field.

  The sharpest test is dark matter. If she accepts it, she's weighting explanatory indispensability heavily; if she rejects, she's requiring stronger evidence. Her Neptune/Vulcan contrast suggests she might accept it tentatively but with lower confidence than quarks.

  For a decisive test case, something like quantum wavefunctions would be perfect - mathematically indispensable but with ongoing interpretation debates. Her stance there would reveal whether she prioritizes predictive success over ontological commitment.

  Ultimately, her pattern seems principled but not infallible. The Vulcan/Neptune asymmetry shows she's not just rationalizing history - she rejected a confirmed non-entity while accepting a confirmed one. An honest pre-commitment would be: "I'll believe in entities that play indispensable roles across multiple successful theories and survive repeated attempts at falsification."
answer: |-
  Based on your colleague's record, I've reconstructed her implicit selective realism criterion through careful elimination of candidate rules. Here's the systematic analysis:

  ### 1. Candidate Rules & Compatibility with Verdicts
  - **No-Miracles Argument (NMA):** "Accept all posits essential to a theory's predictive success as real."  
    *Fails:* Rejects ether (essential to wave theory's predictions) and Bohr orbits (essential to spectral predictions).  
  - **Pessimistic Meta-Induction (PMI):** "Reject all posits of past theories as false, given historical failures."  
    *Fails:* Accepts atoms/electrons/genes despite past controversies.  
  - **Entity Realism (Hacking):** "Accept only manipulable entities (e.g., 'if you can spray them, they are real')."  
    *Fails:* Rejects manipulable phlogiston (used in lab processes) but accepts non-manipulable EM field and Higgs-like Neptune (observed but not manipulated).  
  - **Structural Realism (Worrall):** "Accept only mathematical structures preserved across theory changes."  
    *Fails:* Rejects ether despite surviving wave equations; accepts genes/Neptune with no mathematical continuity.  
  - **Divide et Impera (DEI):** "Accept only posits *indispensable* to a theory's successful predictions."  
    *Fails:* Rejects Bohr orbits (indispensable for spectral lines) and caloric (indispensable for early thermodynamics).  
  - **Robust Detection Criterion (My proposal):** "Accept posits only when evidenced by *multiple independent experimental methods* or *indispensable across distinct domains*."  
    *Fits all verdicts:*  
    - Rejects phlogiston/caloric/ether/Vulcan/Bohr orbits (single-line evidence, later contradicted).  
    - Accepts atoms (Brownian motion, chemistry, spectroscopy), electrons (cathode rays, Millikan, QM), genes (breeding, cytology, biochemistry), EM field (optics, EM induction, relativity).  
    - Neptune: Multiple orbital calculations + direct observation.  
    - Absolute space/time: No experimental detection, only philosophical inference.

  ### 2. Surviving Rule & Discriminating Verdicts
  **Rule:** **A theoretical posit is real iff it is (a) *detected through multiple independent experimental pathways* OR (b) *indispensable to explanatory success across distinct physical domains*, AND (c) *not contradicted by superior evidence*.**  

  *Key verdicts eliminating alternatives:*  
  - **Ether rejection** eliminates NMA and structural realism (equations survived but posit rejected).  
  - **Atoms/electrons acceptance** eliminates PMI.  
  - **EM field acceptance** eliminates entity realism (non-manipulable).  
  - **Bohr orbits rejection** eliminates DEI (indispensable but single-domain).  
  - **Vulcan vs. Neptune contrast** confirms robustness requirement: Vulcan had one anomaly (Mercury's orbit), Neptune had multiple calculations + discovery.  

  ### 3. Predictions for New Cases
  - **(a) Quarks: REAL**  
    *Rule applied:* Detected via hadron spectroscopy + deep inelastic scattering + jet events (multiple pathways). Confinement is a property, not contradiction.  
  - **(b) Dark Matter: NOT REAL (tentative)**  
    *Rule applied:* Only gravitational effects (single pathway: kinematics). Not indispensable *yet*—alternatives exist (MOND, gravity modifications). Lacks cross-domain confirmation.  
  - **(c) Higgs Field: REAL**  
    *Rule applied:* Detected via decay channels of Higgs boson (multiple pathways: WW, ZZ, γγ). Indispensable to electroweak symmetry breaking (across domains: particle masses, cosmology).  

  ### 4. Sharpest Test & Most Likely Rule
  - **Sharpest test: Dark matter.**  
    Quarks/Higgs clearly satisfy robustness; dark matter exposes the "indispensability" threshold. Her Vulcan verdict (rejected despite explanatory indispensability) suggests she prioritizes *detection diversity* over theoretical centrality.  
  - **Her actual rule: Robust Detection (my proposal).**  
    Confidence: 90%. Fits all verdicts without strain. Her Bohr orbit verdict is decisive: she distinguishes mathematical structures (accepted energy levels) from unsupported posits (rejected orbits), showing she demands *empirical anchoring*, not just explanatory power.  

  *Underdetermination:* Dark matter's status hinges on whether galactic dynamics + CMB constitute "multiple pathways." If she accepts it, she weights cosmological/particle-physics cross-talk as "distinct domains." **Resolving fact:** Ask if she accepts neutrino mass (inferred solely from kinematics/oscillations pre-direct detection). If yes, she might accept dark matter.  

  ### 5. Decisive Test Case  
  **Quantum Wavefunction (ψ).**  
  - *Why it settles matters:*  
    ψ is indispensable to quantum predictions (interference, entanglement) but its ontological status (physical field vs. epistemic tool) is debated.  
  - *Record's insufficiency:* Her rule ambiguously treats mathematical structures (EM field accepted, Bohr orbits rejected). If she rejects ψ as "not real" despite its predictive role, she prioritizes direct detection (e.g., weak measurements) over indispensability. If she accepts, she conflates mathematical utility with reality.  

  ### 6. Principled or Hindsight?  
  **Principled selective realism.**  
  - *Why not hindsight:* Her Vulcan/Neptune asymmetry shows pre-commitment to *robustness*, not just survival. She rejected ether despite its mathematical survival and Bohr orbits despite explanatory success—both "hindsight-safe" choices.  
  - *Honest pre-commitment:* She would have stated:  
    *"I commit to the reality of posits only when they are experimentally corroborated through diverse methods or when their explanatory role is irreducible across fundamentally different phenomena. Success alone is insufficient; isolatability is unnecessary."*  
  - *Key distinction:* She denies *all* posits of abandoned theories (no "survivors" bias) but accepts entities from *current* science meeting her criterion—a forward-looking standard. Her rejections (caloric, ether) were often minority views historically, countering hindsight charges.

  ---

  **Summary:** Your colleague runs a **robust detection criterion**. It predicts: quarks (real), Higgs (real), dark matter (not real—pending new evidence). The pattern is principled, demanding *empirical multi-vouching* over mere theoretical utility. For your paper: this defeats PMI by showing selectivity need not rely on survival, but on *contemporaneous evidential robustness*.
