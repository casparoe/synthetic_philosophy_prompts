  ### Analysis of R's Implicit Theory of Innateness

  Based on R's settled verdicts, I identify two distinct rules that fit all cases equally well. These rules hinge on different interpretations of what makes a capacity "innate," particularly regarding the role of environmental input and developmental robustness. The rules are:

  1. **Rule A: Not Learned from Environmental Input**  
     A capacity is innate if its specific structure or content is not acquired through learning from environmental input (i.e., it is not shaped by experience, instruction, or statistical patterns in the environment). Innateness here emphasizes genetic/biological programming that operates independently of external information.  
     
  2. **Rule B: Developmentally Robust and Species-Typical**  
     A capacity is innate if it is a universal, species-typical trait that emerges reliably across all normal human environments without needing explicit instruction or structured environmental input. Innateness here emphasizes inevitability and universality, even if minimal environmental "triggering" (e.g., basic exposure) is required.  

  Both rules fit R's verdicts, as shown below:

