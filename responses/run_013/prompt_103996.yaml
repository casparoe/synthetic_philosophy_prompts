answer: |-
  **Decision Tree: Metaphysics of Persistence**

  **Start:** We agree that a single thing can be present at more than one moment (e.g., the person who begins reading this handout is the same person who finishes it).  
  → Proceed to Question 1.

  **Question 1:** Is persistence over time a matter of *numerical identity*? (That is, is the object at time t₁ literally identical to the object at time t₂, or is persistence a relation—e.g., causal continuity or "genidentity"—between numerically distinct entities?)  
  - **Yes** (persistence is numerical identity) → Proceed to Question 2.  
  - **No** (persistence is a relation among distinct entities) → Proceed to Question 4.  

  **Question 2:** Is the persisting object *wholly present* at each moment of its existence? (That is, at each time it exists, is the entire object located at that time?)  
  - **Yes** → Proceed to Question 3.  
  - **No** → **Leaf: Perdurantism (worm theory)**.  

  **Question 3:** Can change over time be explained *without* positing distinct temporal parts *and* without relativizing properties to times? (For example, by appealing to the nature of time itself, such as presentism, where only present properties are real?)  
  - **Yes** → **Leaf: Endurantism**.  
  - **No** → **Unoccupied combination** (incoherent: if persistence is numerical identity and the object is wholly present, change requires *either* temporal parts *or* property relativization; rejecting both leaves no account of change).  

  **Question 4:** What are the entities we ordinarily name and count (e.g., "you," "this desk")? Are they:  
  - **Momentary entities** (e.g., "stages" or time-slices) → **Leaf: Stage theory**.  
  - **Temporally extended wholes** (e.g., "worms" composed of temporal parts) → **Unoccupied combination** (unattractive: if persistence is not numerical identity, the temporally extended whole cannot be identical over time, undermining its role as the ordinary object).  
  - **Neither** (or the question is ill-posed) → Proceed to Question 5.  

  **Question 5:** Is the existence of temporal parts a *substantive* fact about reality or a *verbal* choice about how we count/describe objects?  
  - **Substantive** → **Leaf: Perdurantism (worm theory)** (if you revert to numerical identity for the whole) or **unoccupied** (if not; but no substantive non-identity view occupies this).  
  - **Verbal** → **Leaf: Deflationary/verbal option**.  

  ---

  **Notes on Unoccupied Combinations, Inseparable Pairs, and Hard Cases**  
  1. **Unoccupied Combinations**:  
     - **Q3 "Yes" branch**: Change without temporal parts *and* without property relativization is incoherent for endurantists (Q2 "Yes") committed to numerical identity (Q1 "Yes"), as it leaves change unexplained.  
     - **Q4 "Temporally extended wholes" branch**: Choosing extended wholes while denying numerical identity (Q1 "No") is unattractive; it severs the link between the ordinary object and its persistence conditions.  
     - **Q5 "Substantive" branch**: If you deny numerical identity (Q1 "No") and claim temporal parts are substantive, no coherent position emerges; stage theory (Q4) or deflationism (Q5) covers this space.  

  2. **Inseparable Pairs**:  
     - The tree cannot separate **perdurantism (worm theory)** from **stage theory** when temporal parts are treated as *verbal* (Q5). Both can be described as "deflationary" if one rejects the substantivity of temporal parts.  

  3. **Extension to Non-Standard Cases (waves, species, symphonies, corporations)**:  
     - **Endurantism**: Classifies persons/middle-sized objects cleanly. Struggles with *waves* (not wholly present at a time), *species* (historical properties conflict with being wholly present), and *corporations* (depend on temporal relations). Treats *symphonies* (as abstract types) badly—they lack temporal location.  
     - **Perdurantism (worm theory)**: Extends cleanly to *waves* (space-time worms), *species* (temporally extended lineages), *symphonies* (as performances), and *corporations* (aggregates of temporal parts). Best for hard cases.  
     - **Stage theory**: Extends cleanly to *waves* and *symphonies* (if seen as momentary stages) but classifies *species* and *corporations* badly—their persistence relies on numerical identity (e.g., legal identity for corporations).  
     - **Deflationary option**: Extends cleanly to *all* cases by treating persistence as contextual/conventional. Cannot "misclassify" but offers no substantive account.  
     - **Unplaceable by tree**: *Symphonies as abstract types* (outside time, so persistence is irrelevant) and *growing block universes* (affect all views equally; tree assumes time ontology is separable but notes dependencies below).  

  4. **Ontology of Time Dependencies**:  
     - **Endurantism** can combine with presentism, eternalism, or growing block (though presentism eases change explanations).  
     - **Perdurantism** and **stage theory** require eternalism (all times exist) or growing block (past/present exist); presentism is incompatible.  
     - **Deflationism** treats time ontology as verbal, avoiding dependencies.  
     - The tree does not *force* a choice on time, but Q3 and Q5 reveal presuppositions (e.g., presentism in Q3 "Yes", eternalism in perdurantism/stage theory).
