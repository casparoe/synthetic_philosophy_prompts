answer: |-
  Here is a rigorous analysis of the Seattle dialysis case through the lens of value incommensurability, treating your provided facts as fixed and prioritizing conceptual mapping over historical embellishment:

  ---

  ### **1. Mapping the Choice Situation**
  - **Agent**: The anonymous lay committee (acting as proxy for society/institution).  
  - **Options**: Individual candidates for dialysis access.  
  - **Choice Situation**: Scarcity forces a distributive choice among lives under conditions of:  
    (a) *Formal commensuration* (explicit ranking via weighted criteria)  
    (b) *Implicit tragic framing* (non-treatment = death)  

  ### **2. Distinguishing Value Relations**  
  The committee’s decision-making suggests **epistemic opacity of comparable values**, not Raz-style incomparability:  
  - **Evidence for comparability**:  
    — The committee *did* produce a ranking using a multi-criteria scale.  
    — Public critiques accepted ranking *in principle* but disputed weights (e.g., “mother should outrank bachelor” implies commensurability with different exchange rates).  
  - **Evidence against genuine incomparability**:  
    — No indication choices were experienced as *lacking a common measure* (Raz’s “not better, not worse, not equal”). Anguish stemmed from burden, not metaphysical indeterminacy.  
  - **Proxy use as diagnostic**:  
    Metrics like "church attendance" or "income" functioned as *measurable surrogates* for opaque higher-order values (e.g., "social contribution"). This signals **contested commensurability**: Values were deemed comparable *in theory* but lacked clear intersubjective measurement.  

  ### **3. The Social Worth Scale: Expressive Critique**  
  Anderson’s and Chang’s theories reveal the deeper ethical violation:  
  - **Anderson’s expressive harm**: Ranking lives on a "social worth" scale expresses that persons *are* instrumentally commensurable. This commodifies moral standing—a violation of human dignity irrespective of weighting accuracy.  
  - **Chang’s parity critique**: Even if lives are *comparable*, they may be "on a par" (neither better nor worse, yet comparable). The committee’s linear ranking falsely assumed cardinal scalability, denying parity’s non-scalar nature.  
  - **Objection type**: The core wrong was *not* miscalibrated weights but the *act of scaling itself*.  

  ### **4. The Sequel: Scarcity as Catalyst**  
  Calabresi & Bobbitt’s tragic choices framework illuminates the aftermath:  
  - **Home dialysis/Medicare**: Did not resolve commensuration; they **eliminated the scarcity forcing explicit comparison**. Society avoided tragic choices via:  
    — Technical innovation (home dialysis: reduced cost → expanded supply)  
    — Legal entitlement (Medicare: removed resource constraint)  
  - **Implication for incommensurabilism**:  
    — Avoidance confirms that *facing* the choice was intolerable, suggesting values resist commensuration *in practice* without proving incomparability *in theory*.  
    — Evidence status: Evasion implies recognition that ranking lives violates expressive norms—**not** that values were commensurable "all along."  

  ### **5. Procedural Responses & Value Smuggling**  
  - **Randomization/lotteries**: Treat options as equal when unable or unwilling to compare. This *procedurally* expresses equal worth but does not assert metaphysical equality.  
  - **Waiting lists**: Prioritize temporal fairness over substantive comparison.  
  - **Smuggling risk?** Randomization avoids scaling but implicitly accepts commensurability: all lives are "equal enough" to warrant equal chance. This is a *practical concession*, not a value discovery.  

  ### **6. What Incommensurability Theory Explains (and Where It Falters)**  
  - **Explains**:  
    — Committee’s anguish: Choosing without confidence in ranking.  
    — Public revulsion: Moral injury from expressing commensuration.  
    — Societal evasion: Structural avoidance as proof of incommensurability’s *practical* force.  
  - **Falters**:  
    — Cannot guide action beyond procedural defaults (e.g., lotteries).  
    — Does not resolve whether values *are* incomparable or merely opaque.  

  ---

  ### **Verdict: A Confirmation of the Incommensurabilist Picture**  
  This episode is **a confirmation**, not an anomaly:  
  1. The committee’s use of proxies reveals *commensuration as a coping mechanism* for epistemically opaque comparisons—not proof of underlying comparability.  
  2. Public outrage centered on the *expressive harm of scaling*, aligning with Anderson/Chang.  
  3. Societal flight from tragic choices via supply expansion validates that *incommensurability manifests as institutional unsustainability*.  

  The case demonstrates that **incommensurability is scarcity-sensitive but not scarcity-dependent**: Values do not "become" commensurable when scarcity eases; society instead constructs escape valves to avoid confronting comparison. The theory anticipated this: Raz’s incomparability and Chang’s parity both describe *relations among values*, not features of scarcity. What changes under scarcity is the *practical necessity to act despite opacity*—not the nature of value itself.  

  The Seattle committee faced **contested commensurability under duress**, and society’s response proved that incommensurability’s bite lies in the unbearable demand to scale the unscalable.
