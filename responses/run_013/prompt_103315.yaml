prompt: |-
  I'm a phil prof who just got a three-year postdoc slot and I get to aim it, so I'm effectively writing someone's research agenda for them. I want it in accuracy-first epistemology / epistemic utility theory — the program where you take accuracy as the fundamental epistemic good, score credences with a strictly proper scoring rule, and call a credence function rational when it maximizes expected accuracy. The standard open questions everyone trots out (which scoring rule, does the dominance argument really get you probabilism, permissivism vs uniqueness, how to handle imprecise credences) feel like they've been chewed to death. So: give me a defended ranking of what actually deserves three years of a good philosopher's time, and I care way more about the reasoning than the list. For each candidate, tell me whether its upstream of the others — does settling it settle five other things, or just itself — how tractable it is with armchair tools, and whether it's neglected or overworked. Two things I'd like you to take seriously even if you end up thinking they're wrong. First, whether the program is quietly doing population-ethics-style aggregation when it sums accuracy across worlds and across individual beliefs, and whether the choice of scoring rule is smuggling in a normative decision it pretends to just discover. Second, whether accuracy-first can say anything about epistemic goods that aren't accuracy — understanding, explanation, coherence — or whether it's stuck with a swamping problem of its own. If those are dead ends, say so and say why. And tell me what would move a question up or down the list over the next couple years, since that's what I'll be watching. No reading lists, I know the literature.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're a philosophy professor who's landed a three-year postdoc and needs to set a research agenda in accuracy-first epistemology (AFE). They're tired of the standard open questions and want fresh, impactful directions. 

  First, I need to understand their deeper needs. They mention two specific concerns: whether AFE is smuggling in normative decisions through scoring rules and aggregation, and whether it can handle non-accuracy epistemic goods. These aren't just passing thoughts—they want them taken seriously even if ultimately rejected. That tells me they're looking for agenda items that either confront these challenges head-on or credibly bypass them.

  The user also emphasizes upstreamness, tractability, and neglect. They want leverage—problems where solving X resolves Y and Z. Armchair-friendliness matters since they're likely theory-focused. And "neglected" suggests they want to avoid well-trodden debates like scoring rule selection or imprecise credences. 

  Hmm, the population ethics analogy is sharp. When AFE sums accuracy across worlds and beliefs, it's making aggregation choices that feel ethically loaded—similar to how utilitarianism sums welfare. But is this a bug or a feature? The user suspects normative smuggling, so I should explore whether the scoring rule's mathematical properties (like strict propriety) genuinely derive from accuracy alone or tacitly rely on value judgments about fairness or risk. 

  The non-accuracy goods point is equally thorny. AFE treats accuracy as the sole fundamental good, but understanding/coherence seem valuable beyond just truth-tracking. The user hints at a "swamping problem"—if accuracy is all that matters, does that make other goods redundant? (Like how virtue epistemologists worry true belief "swamps" pragmatic value.) 

  I'll rank agenda items by: 
  - **Upstreamness**: Does it unlock other problems? (e.g., fixing aggregation might constrain scoring rules) 
  - **Tractability**: Can it be tackled with philosophical analysis? (e.g., coherence formalization > empirical psychology) 
  - **Neglect**: Is it underexplored? (e.g., aggregation ethics > permissivism) 

  Top candidates: 
  1. **Aggregation Normativity**: If scoring rules encode hidden values, that's upstream—it could reshape foundations. Armchair-friendly via decision-theoretic tools. Wildly neglected. 
  2. **Non-Accuracy Goods**: Either show AFE *can* capture them (via accuracy-reduction) or admit it can't (limiting AFE's scope). Moderate upstreamness/tractability. 
  3. **Belief-Granularity**: If AFE can't handle coarse beliefs, that's a gap. Settling this might simplify imprecise credence debates. 

  I'd deprioritize overworked questions (e.g., "does dominance imply probabilism?") unless they directly serve the core agenda. 

  What would move items? New formal tools (e.g., graph-based scoring) or cross-disciplinary insights (e.g., cognitive science on understanding). Also watch for critics pushing the "smuggling" concern—if they gain traction, Aggregation Normativity becomes urgent. 

  Finally, I'll explicitly flag dead ends if warranted. For example, if non-accuracy goods *can't* be accuracy-reduced without gerrymandering, AFE might need to bracket them—but that’s a substantive conclusion worth defending.
answer: |-
  Here’s a defended ranking of research questions for accuracy-first epistemology (AFE), prioritized by upstream impact, tractability, neglect, and your two focal concerns. I’ve weighted **upstreamness** most heavily (does progress here resolve or reframe multiple downstream issues?), followed by **neglect** (is it underexplored relative to importance?) and **armchair tractability**. Each entry includes a "leverage assessment" and dynamic factors that could shift its rank.

  ---

  ### **Tier 1: Foundational Pressure Points**  
  *(High upstreamness, moderate-high neglect, armchair-friendly)*  

  1. **The Aggregation Problem: Is AFE Covertly Normative?**  
     - **Core Issue**: AFE sums accuracy *across worlds* (expected accuracy) and *across propositions* (additive scoring rules). This mirrors population ethics’ aggregation puzzles:  
       - *Across worlds*: Linearly weighting possible worlds assumes "risk neutrality" — but is this epistemically justified, or a hidden normative choice?  
       - *Across propositions*: Additive scoring rules treat beliefs as independent contributions to total accuracy. Yet intuitively, *coherent interconnected beliefs* (e.g., explanatory networks) seem more valuable than the sum of parts.  
     - **Upstreamness**: ⭐⭐⭐⭐⭐  
       - Settling this could:  
         (a) Constrain acceptable scoring rules (e.g., only those respecting "epistemic risk-sensitivity"),  
         (b) Force a rewrite of dominance arguments,  
         (c) Reshape debates on imprecise credences (if aggregation demands representational resilience).  
     - **Neglect**: ⭐⭐⭐⭐ (Raised in passing by Steele, Briggs; rarely systematized)  
     - **Tractability**: ⭐⭐⭐ (Armchair work on axiomatics/decision theory suffices initially)  
     - **Why not a dead end?** Formal tools exist (e.g., risk-weighted utility, non-additive scoring), but AFE hasn’t seriously engaged why *accuracy* demands *standard* aggregation. Axiomatic derivation could expose hidden norms.  
     - **Dynamic mover**: New results in social choice/population ethics (e.g., variable-value theories) could force confrontation.  

  2. **Non-Accuracy Goods: Can AFE Absorb or Exclude Them?**  
     - **Core Issue**: Understanding, explanation, and coherence seem epistemically valuable beyond accuracy. Can AFE:  
       - *Reduce them* to accuracy (e.g., "understanding as accuracy over explanatory models"),  
       - *Integrate them* as instrumental to long-run accuracy, or  
       - *Admit they’re external*, limiting AFE’s scope?  
     - **Upstreamness**: ⭐⭐⭐⭐  
       - Determines whether AFE is a complete epistemic program or modular (needing supplementation). Resolving this impacts permissivism (if understanding constraints credences) and the status of "purely alethic" arguments.  
     - **Neglect**: ⭐⭐⭐ (Kelp, Kvanvig critique; few AFE defenses)  
     - **Tractability**: ⭐⭐⭐ (Conceptual analysis + modeling coherence/explanation as accuracy-components)  
     - **Swamping problem?** AFE’s version: If understanding is just accuracy+*, accuracy "swamps" the * unless * is independently valuable. **Path forward**: Formalize "explanatory accuracy" (e.g., scoring credences on how well they predict *dependencies*).  
     - **Dead end risk**: High if reduction fails—AFE might need to concede pluralism. But trying is essential.  
     - **Dynamic mover**: Cognitive science on explanation/understanding could pressure AFE to expand or retrench.  

  ---

  ### **Tier 2: Structural Revisions**  
  *(Moderate upstreamness, high neglect, armchair-friendly)*  

  3. **The Scope Problem: What Counts as a "Belief" for Scoring?**  
     - **Core Issue**: AFE assumes a fixed set of propositions with credences. But:  
       - Which propositions merit inclusion? (Trivial vs. fundamental?)  
       - Can AFE handle *contextually salient* propositions or *conceptual engineering*?  
     - **Upstreamness**: ⭐⭐⭐  
       - Affects scoring rule arguments (e.g., propriety over what domain?) and permissivism (if belief sets are underdetermined).  
     - **Neglect**: ⭐⭐⭐⭐⭐ (Rarely discussed; Pettigrew’s "decision-theoretic" silence)  
     - **Tractability**: ⭐⭐⭐⭐ (Armchair work on epistemic value + conceptual ethics)  
     - **Why now?** Connects to aggregation: If scoring weights beliefs equally, but some beliefs "matter more," AFE needs a story.  
     - **Dynamic mover**: Metaontology/metasemantics debates could force engagement.  

  4. **Dynamics & Updating: Can AFE Ground Non-Bayesian Shifts?**  
     - **Core Issue**: AFE focuses on *synchronic* rationality. Can it justify:  
       - Changing conceptual frameworks?  
       - "Eureka moments" not driven by evidence?  
       - Shifts in attention/propositional granularity?  
     - **Upstreamness**: ⭐⭐  
       - Less direct than Tier 1, but impacts diachronic norms and uniqueness.  
     - **Neglect**: ⭐⭐⭐⭐ (Work on updating rules (e.g., GRE) but not deep structural changes)  
     - **Tractability**: ⭐⭐⭐ (Modeling "accuracy over time" with decision trees)  
     - **Tier 2 because**: Less fundamental than aggregation/non-accuracy goods, but critical for AFE’s realism.  

  ---

  ### **Tier 3: Necessary Refinements**  
  *(Lower upstreamness, but tractable & underexplored)*  

  5. **Accuracy for Non-ideal Agents: Bounded Rationality & Heuristics**  
     - **Core Issue**: AFE assumes agents can assign precise credences over all propositions. What if they can’t?  
       - Can AFE score *heuristics* (e.g., fast-and-frugal trees) for accuracy?  
       - Does "expected accuracy" require inaccessible computations?  
     - **Upstreamness**: ⭐ (Primarily internal to AFE)  
     - **Neglect**: ⭐⭐⭐ (Selinger, Pomatto; underdeveloped)  
     - **Tractability**: ⭐⭐ (Requires engaging cognitive science; less armchair-pure)  
     - **Why include?** Addresses "in principle" objections to AFE’s applicability.  

  ---

  ### **Deliberate Omissions & Why**  
  - **Scoring Rules**: Overworked. Progress likely comes *from* Tier 1 issues constraining options.  
  - **Permissivism vs. Uniqueness**: Stalled without new angles (e.g., from non-accuracy goods or belief sets).  
  - **Dominance → Probabilism**: Chewed to death; new work is incremental.  
  - **Imprecise Credences**: Active but stuck; upstream aggregation norms may unblock it.  

  ---

  ### **Strategic Outlook**  
  Your agenda should **anchor in Tier 1**. Success there reconfigures the entire field. Use Tier 2 for auxiliary projects when Tier 1 hits bottlenecks. Monitor these **disruptors**:  
  - **Cross-disciplinary tools**: Computational models of explanation (AI) or aggregation ethics (social choice) could break open Tier 1.  
  - **Critiques gaining traction**: If high-profile critics (e.g., Elgin) argue AFE *can’t* handle understanding, Tier 1 #2 becomes urgent.  
  - **Formal innovations**: New scoring rules (e.g., context-sensitive or non-additive) could force reevaluation of aggregation.  

  **Ultimate goal**: Show whether AFE is a *self-contained foundational program* or a *module in a pluralist framework*. Either outcome is transformative. Tier 1 questions are the levers.
