prompt: |-
  I'm a novelist — four books, all of them about people who are wrong about something in an elaborate and self-consistent way — and I've gotten into a running argument over dinner with a friend of mine who teaches philosophy, about Quine and ethics. His line is that Quine has real views about moral values, that they're underrated, and that anyone who says Quine simply didn't do ethics has missed the point. My line is that Quine wrote essentially nothing about ethics and that everything he did write was about knowledge, meaning, logic and ontology. He says there's a short piece from late in Quine's life specifically about moral values; I have a feeling he's right, but I've never managed to lay hands on it, and I'd honestly rather you didn't recite at me some essay you're half-remembering either. If you're not sure what Quine actually said somewhere, say so — and then give me the philosophical issue instead, which is what I actually want.

  What I think I do understand, from the philosophy I retained: naturalism (philosophy isn't prior to science, it's continuous with it, and epistemology ends up as a branch of empirical psychology), holism (our beliefs form one fabric, nothing is immune to revision, there's no principled analytic/synthetic line), and indeterminacy of translation. So the thing I want explained, well enough that I could walk a smart non-philosopher through it over a drink, is what room all of that leaves for the normative. Take it in three parts. First, does a Quinean have to be a non-cognitivist about moral claims, or is there a way of being a naturalist on which moral claims are straightforwardly true or false but not reducible to descriptive ones? Second, and this is the part that actually keeps me up: is there even a Quinean argument for the is/ought gap? The fact/value distinction has exactly the same shape as the analytic/synthetic distinction he spent his career dissolving — a supposedly principled line between kinds of statement, defended by appeal to what could never be derived from what. Does holism threaten to dissolve that line too, or is the gap a seperate kind of thing altogether (a claim about what entails what, rather than about what's true in virtue of what)? Third, if he really does think moral values come down to custom and social training, is that itself just another descriptive claim sitting in the fabric like any other — does it survive its own holism, or does it quietly exempt itself?

  My friend's way of putting it, which I suspect is either quite clever or a total howler, is that people conflate two entirely different gaps: the "gap-as-semantics," where ought-claims just aren't the kind of thing that can be true or false, and the "gap-as-division-of-labour," where ought-claims are perfectly truth-apt but no pile of factual premises will ever entail one, so the two enquiries can never be collapsed into each other. His claim is that Quine's holism kills the first and is simply silent on the second, and that once you see that, the live Quinean question becomes whether moral norms get revised the way logic and physics get revised — pragmatically, when the fabric stops working — in which case ethics comes out as a branch of engineering rather than a branch of knowledge. You're a philosopher who knows the mid-century analytic tradition cold, so: start by laying out the space of positions here before you commit to any of them, then (a) explain the underlying conceptual issue cleanly, (b) tell me whether his distinction is real and whether it cuts where he thinks it cuts, and (c) say what a Quinean is actually committed to on all this and what she can legitimately leave open. Please flag the places where you're reconstructing rather than reporting — I'd rather have an honest "Quine never says, but here's what his commitments force" than a confident summary. No citations or reading lists, I can't check them and they're not what I'm after; I want the argument itself.
