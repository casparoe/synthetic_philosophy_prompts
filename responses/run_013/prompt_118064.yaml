  Okay, let me unpack this query. The user is a novelist deeply engaged with philosophical debates, specifically about Quine's potential ethical views and the nature of normative claims within his framework. They've had ongoing dinner arguments with a philosopher friend and want clarity on three interconnected issues: whether Quineanism permits moral cognitivism, if holism undermines the is/ought distinction, and how Quine's view of values as "custom and social training" holds up under his own holism. 

  The user explicitly rejects citations, wanting the conceptual architecture laid bare. Their friend's "gap-as-semantics" vs "gap-as-division-of-labour" distinction seems pivotal. I notice the user's novels explore self-consistent delusions - this meta-perspective might explain their fascination with Quinean holism's implications for ethics. 

  First, I need to map the terrain without presupposing Quine's stance. The core tension: Quine's naturalism treats epistemology as psychology, but normativity seems irreducible to description. Holism says all beliefs are revisable, yet moral claims feel categorically different. The friend's distinction attempts to separate semantic non-cognitivism from logical underdetermination - a clever move worth testing. 

  For (a), the conceptual issue is whether normativity can emerge from descriptive premises. Hume's guillotine (no ought from is) meets Quine's blowtorch (no analytic/synthetic divide). If holism dissolves all such divides, does ought/is follow? But perhaps the gap isn't about meaning but entailment - that's the friend's key insight. 

  For (b), the distinction holds water. Quine demolished semantic gaps (e.g., analytic truths) but logical gaps persist: no set of physics facts entails "torture is wrong," just as no observation settles quantum interpretations. Ethics might then be "engineering" - optimizing human goals within our web of beliefs. 

  For (c), a Quinean needn't be a non-cognitivist. Moral claims could be truth-apt yet irreducible, revised holistically when they clash with experience (e.g., slavery debates). But Quine himself seemed skeptical of moral truth, treating ethics as conditioned responses. His late-life comments (the "short piece") reportedly call values non-cognitive - I'd note this as reconstruction since the user can't verify sources. 

  The social training claim risks exempting itself from holism. A consistent Quinean must treat it as another node in the web, vulnerable to revision if anthropological data conflicts. No privileged meta-ethics. 

  Finally, the user's insomnia about the is/ought gap is well-placed. Holism doesn't erase it; it reframes it as underdetermination. But that leaves room for robust moral inquiry - just not foundational certainty. The novelist in them might relish that: ethics as forever provisional, like their characters' self-consistent errors.
answer: |-
  You've nailed the core tension: Quine's naturalistic holism seems to dissolve traditional philosophical boundaries, yet ethics feels stubbornly *normative* in a way physics isn't. Your friend's distinction is sharp and crucial – let's build the space step by step.

  **The Lay of the Land:**

  1.  **The Quinean Foundation:** Naturalism (philosophy is continuous with science), Holism (the "web of belief," no privileged statements immune to revision), Indeterminacy of Translation (meaning isn't fixed, reference is inscrutable). Crucially, Quine demolished the analytic/synthetic distinction – statements aren't true *just* by meaning (analytic) or *just* by the world (synthetic). All contribute to the web's fit with experience.

  2.  **The Normative Challenge:** Moral claims ("Torture is wrong," "You ought to help") seem different. They don't *just* describe the world; they *prescribe* action, judge behaviour. The classic "is/ought gap" (Hume) insists no pile of descriptive facts ("is") *logically entails* a normative conclusion ("ought").

  3.  **The Positions on Ethics:**
      *   **Non-Cognitivism (Semantic Gap):** Moral claims aren't truth-apt. "Torture is wrong" isn't true/false; it's an expression of emotion ("Boo torture!"), a command ("Don't torture!"), or a commitment. This *accepts* a deep semantic gap.
      *   **Reductive Naturalism (Collapsing the Gap):** Moral claims *are* descriptive claims about natural properties (e.g., "wrong" = "causes suffering"). They *are* truth-apt and potentially derivable from non-moral facts. This tries to *eliminate* the gap by reduction.
      *   **Non-Reductive Naturalism / Quasi-Realism (Division of Labour Gap):** Moral claims *are* truth-apt and *about* real features of the world, but these features are *sui generis* normative properties ("goodness," "wrongness"), irreducible to physical/descriptive properties. The "ought" cannot be *logically deduced* from a purely "is"-based description, even though both are part of reality.
      *   **Error Theory:** Moral claims *are* truth-apt (they aim to state facts) but are *all false* because the required normative properties don't exist.
      *   **Your Friend's "Engineering" View:** Moral claims *are* truth-apt, but their truth is ultimately *pragmatic* and *holistic*. They express norms woven into our web of belief, revised based on how well the *entire* web (including our goals, desires, social needs) copes with experience. The "ought" isn't deduced from "is"; it's part of the evolving structure we use to navigate the world. The gap is logical underdetermination, not semantic difference.

  **(a) The Underlying Conceptual Issue:**

  The core issue is **the nature and source of normativity within a naturalistic, holistic framework.** Can the "binding force" of "ought" – the thing that makes it *prescriptive* rather than just *descriptive* – be explained solely by natural facts (psychology, biology, sociology) and pragmatic adjustment within a holistic web? Or does it require something non-natural, irreducible, or fundamentally different in kind (like a semantic difference)?

  *   Quinean naturalism seems to demand that *everything* – including epistemology and meaning – is ultimately part of the natural world studied by science. Holism suggests *all* parts of the web, including moral judgments, are subject to revision based on overall coherence and empirical success.
  *   The tension arises because "ought" statements *feel* categorically different. They seem to *demand* action, not just report a state. The question is whether this "demand" is an *illusion* (non-cognitivism, some forms of naturalism), a *fundamental feature of reality* (non-reductive naturalism), or a *functional role within our practical reasoning* (the engineering view).

  **(b) Your Friend's Distinction: Real and Cutting Correctly**

  **Yes, the distinction is real and crucial.**

  1.  **Gap-as-Semantics:** This is about **meaning and truth-aptness.** Are "ought" statements the *kind* of thing that can be true or false? Quine's holism **absolutely demolishes the foundation for this gap.** His attack on analyticity means there's no principled way to say certain strings of words *cannot* be truth-apt based on their form or subject matter alone. Logic and math were once thought analytic/immune; Quine showed they're revisable nodes in the web. Holism implies that *any* statement *could*, in principle, be treated as truth-apt or revisable based on its role in the overall system. If "Force equals mass times acceleration" can be revised under pressure, why not "Killing is wrong"? Semantic gaps are anathema to Quineanism. **Verdict: Friend is correct; Quinean holism kills this gap.**

  2.  **Gap-as-Division-of-Labour:** This is about **logical entailment and underdetermination.** Can a set of *purely descriptive, non-normative premises* (facts about particles, neurons, social structures, evolutionary history) *logically entail* a normative conclusion ("Therefore, you ought to do X")? *This* gap **remains entirely possible and untouched by Quine's core theses.** Holism says that *if* we include normative premises in our web, they can be revised along with everything else. But it doesn't say that normative conclusions *must* follow from non-normative premises. Indeterminacy shows translation is underdetermined by behaviour; this gap says normative conclusions are underdetermined by non-normative premises. Quine's naturalism focuses on *how* we *actually* form beliefs (psychology), not on *deductive justification*. **Verdict: Friend is correct; Quinean holism is silent here. The gap-as-entailment is a distinct logical point.**

  **(c) Quinean Commitments and Open Questions:**

  1.  **Non-Cognitivism?** **No, a Quinean is *not* committed to non-cognitivism.** Holism undermines the semantic basis for it. Moral claims *could* be truth-apt nodes within the web of belief. Quine himself likely leaned towards seeing them as expressions of conditioned response (more on this below), but his core principles *allow* for cognitivism, particularly of the "engineering" variety your friend suggests. Commitment: **Naturalism and holism *permit* moral claims to be treated as truth-apt beliefs within the web.**

  2.  **The Is/Ought Gap:** **Quineanism is compatible with the logical entailment gap ("division of labour").** Nothing in naturalism or holism *forces* the derivation of "ought" from "is." A Quinean can consistently hold that adding a normative claim involves a *practical* choice, a shift in framework, or the activation of a different part of the web (our desires, goals, social norms), not a logical deduction from purely descriptive facts. Commitment: **A Quinean can, and arguably *should*, acknowledge the logical underdetermination of normative conclusions by non-normative premises.** Open: *How exactly* normative beliefs *do* arise within the naturalistic web (psychology, conditioning, rational deliberation on goals?), and how robust their truth-aptness is.

  3.  **Values as Custom/Social Training:** **This is where Quine's *personal* view likely lands, but it must confront holism.** Quine did express skepticism about objective moral truth, often framing ethics in terms of ingrained societal norms and conditioning ("custom, habit, training"). **Crucially, a *consistent* Quinean *cannot* let this claim sit as a privileged, unrevisable meta-ethical truth exempt from holism.**
      *   This descriptive claim ("moral values *are just* custom/social training") **is itself a node within the web.** It must be justified by its coherence with the rest of our knowledge (psychology, anthropology, biology) and its overall pragmatic utility.
      *   **It *can* be revised.** If compelling evidence emerged that certain moral intuitions were innate, or that viewing ethics *only* as conditioning leads to disastrous practical consequences incompatible with other core goals (survival, flourishing), this claim could be revised. Perhaps ethics involves more complex feedback loops between biology, culture, and rational deliberation than simple "training."
      *   **Commitment:** Naturalism demands ethics be explained naturalistically (psycho-socially). Holism demands this explanation itself be revisable. **Open:** *How* revisable is it? Does the success of the "custom/training" explanation make it particularly robust? Could evidence *force* us to posit something more robustly normative? Quine likely thought "no," but his framework doesn't *absolutely* foreclose it.

  **The Quinean on Ethics: A Summary**

  A consistent Quinean is committed to:
  1.  **Naturalism:** Ethics must be explained within the natural world.
  2.  **Holism:** Moral claims, *if treated as beliefs*, are part of the web and revisable.
  3.  **No Semantic Gap:** Moral claims aren't barred from truth-aptness by their form.
  4.  **Endorsing the Entailment Gap:** "Ought" isn't logically derivable from non-normative "is."
  5.  **Subjecting Meta-Ethics to Scrutiny:** Any explanation of ethics (e.g., "it's just custom") is itself a scientific/holistic hypothesis, not a first philosophy.

  **What's Open:**
  *   **The *Status* of Moral Truth:** Are they true like "There are electrons," true like "Democracy is stable," or useful fictions? Quine leans towards the latter end of the spectrum, but holism doesn't dictate this.
  *   **The *Mechanism*:** How *exactly* do moral norms arise and function within the naturalistic web? Conditioning? Biological predispositions? Rational deliberation on shared goals? Quine favoured conditioning, but alternatives compatible with naturalism exist.
  *   **Robustness of Revision:** *How readily* do moral norms get revised compared to physics? History suggests slower, but holism says *in principle* they can be. Pragmatic success (the "engineering") is the ultimate arbiter.

  **Your Friend's "Engineering" View:** This is a **highly plausible and consistent Quinean stance.** Moral norms *are* truth-apt, revisable parts of our web, justified pragmatically by how well they help our overall system (individual and social) function. The "ought" stems from our embedded goals and desires within the natural world, not from deduction or non-natural properties. The entailment gap persists because adopting a norm is a practical move, not a logical conclusion. It captures the spirit of Quine's naturalism and holism without requiring semantic gymnastics or positing spooky properties. Whether Quine *himself* fully embraced this view is less clear (he was skeptical), but it's where his commitments most comfortably lead. It transforms ethics from a quest for transcendent truth into a complex, ongoing project of social and individual navigation – perhaps less "lofty" than traditional ethics, but potentially more honest to the Quinean worldview. Your insomnia might find solace (or new fodder) in seeing ethics as the ultimate pragmatic engineering challenge.
