prompt: |-
  I teach a second-year game theory unit for philosophy students and I want to build one 80-minute session around something they always nod at and then obviously don't believe: that an option can be strictly dominated by a lottery over other options even though no single option is better than it, and that once you're willing to cross that option off, the rest can unravel one option at a time. About 18 students. No real money, points and maybe a candy bar is fine. I have a printer and a pile of index cards and nothing else. I don't want a lecture up front, and I don't want the name of the idea anywhere in the room until the last ten minutes.

  I've spent alot of time messing with this symmetric three-option game. Both players pick A, B or C simultaneously; payoffs are in points and the table is symmetric, so you can read it from either side. If you pick A you get 12 against A, 8 against B, 1 against C. If you pick B you get 8 against A, 4 against B, 5 against C. If you pick C you get 1 against A, 5 against B, 2 against C. As far as I can work out: C isn't beaten by any single option (A only loses to C when the other player picks C; B only loses to C when the other player picks B), but a 50/50 coin flip between A and B pays 10, 6 and 3 against A, B and C, which beats C's 1, 5 and 2 every time. And once C is off the table the A/B game is trivial, A beats B in both cells. Please check that yourself, because I've gotten this wrong before.

  So design the session around that. I want the rules, the materials, the payoff scheme, how the 80 minutes breaks down, and a debrief that ties each moment back to the formal machinery — being dominated by a mixture versus by a single option, what the elimination procedure is actually doing when you run it again on what's left, why the lottery that kills C has nothing to do with the solution of the game (the answer here is just to play A, and I want them to see those are seperate things), that the order you cross options off in doesn't change where you land (make them see it, at least for this game), and that what the procedure hands you is a shrinking set, not a prediction about what people do. I want them to have to say out loud that they can't name what beats C before anyone reaches for a coin. Tell me what will predictably go wrong the first time and how to handle it, and be straight with me about what the activity can't reproduce — I'd rather hear it now.

  Write it as plain prose, no headings, no bullet points, no bold, no tables, just write it out the way you'd explain it to me in an email.
reasoning: |-
  Okay, let me think through this game theory teaching problem. The professor wants an 80-minute session to demonstrate how an option can be strictly dominated by a mixed strategy even when no pure strategy dominates it, using a specific symmetric 3x3 game with options A, B, and C.

  First, I need to verify the payoff matrix. For player choosing C: gets 1 vs A (since opponent plays A), 5 vs B, and 2 vs C. Now, a 50-50 mix of A and B: against opponent's A, it pays (12+8)/2=10; against B, (8+4)/2=6; against C, (1+5)/2=3. Comparing to C's payoffs: 10>1, 6>5, 3>2 - yes, the mixture strictly dominates C. Once C is eliminated, A yields 12 vs A and 8 vs B, while B yields 8 vs A and 4 vs B - so A strictly dominates B in the subgame.

  The session design should avoid upfront lecture and keep terminology hidden until the end. With 18 students, index cards and a printer, I can create player cards with payoff tables. The activity needs to make students discover that nothing purely beats C, then realize a mixture does, then see iterative elimination leads to A.

  Predictable issues: students might miss that no pure strategy dominates C, or struggle with mixed strategy concept. They might also anchor on C if early rounds have many C-players. The activity can't perfectly replicate rational choice without monetary incentives, but candy bars can help.

  The flow should be: explain rules simply (5 min), play multiple rounds without discussion (25 min), then group analysis to notice patterns (20 min). Guide them to see C isn't dominated by any pure strategy, then introduce idea of randomizing between A and B (15 min). Finally, debrief connecting to formal concepts (15 min).

  During debrief, emphasize key points: mixture dominance vs pure dominance, order independence of elimination, that the procedure gives solution set not behavioral prediction, and that the mixed strategy here is a tool for elimination not the actual solution.
answer: |-
  Here's how I'd run that session, step by step, keeping it physical and discovery-based. I'll write it straight through like we're talking.

  First, prep: Print enough copies of the payoff table so each student can have one. Make it clear and minimal: rows and columns labeled "You" and "Other Player" with A, B, C, and the numbers you gave (You-A vs Other-A:12, You-A vs Other-B:8, You-A vs Other-C:1; You-B vs Other-A:8, You-B vs Other-B:4, You-B vs Other-C:5; You-C vs Other-A:1, You-C vs Other-B:5, You-C vs Other-C:2). Print one per student. Also, get index cards ready – one per student per round, plus a few spares. Have a candy bar visible.

  **(Minutes 0-5: Setup & Rules)**  
  Hand out the payoff tables and one index card to each student. Tell them: "You're playing a simple game. You'll all choose A, B, or C secretly, write it on your card, and fold it. I'll collect them all, shuffle them, and randomly pair them up. Your payoff depends on your choice and the choice of the person you're paired with. Look at your table. Your goal is to get as many points as possible over several rounds. Highest total points at the end wins the candy bar. We'll play several rounds. Between rounds, you can chat quietly with anyone about what happened or what you might do next, but you cannot show your card or explicitly coordinate your next move. Any questions?" Answer any clarifying questions about the table, but don't hint at strategy. Emphasize: "The table is symmetric. What you see for you vs them, they see for them vs you."

  **(Minutes 5-30: Gameplay Rounds - 4-5 Rounds)**  
  Run 4 or 5 rounds quickly. Each round:  
  1.  Give everyone a fresh index card. "Write A, B, or C. Fold it. Done? Hands up." Collect all cards when ready.  
  2.  Shuffle the cards thoroughly. Pair them randomly (if odd number, make one trio; average the scores for the trio members).  
  3.  Open each pair, announce the choices loudly and clearly ("Player X: A, Player Y: B"), and state the payoffs for each ("X gets 8, Y gets 5"). Write the pairings and outcomes briefly on the board so everyone can see the history. "Against a B, your A gets you 8."  
  4.  Have students record *their own* payoff for that round on a piece of paper (or back of their payoff table sheet). Keep a running total.  
  5.  Briefly announce the distribution: "This round: 7 A's, 5 B's, 6 C's." (The actual numbers will vary wildly).  
  6.  Repeat. "Okay, next round. Write A, B, or C..."

  *Predictable Go Wrong #1:* **Early C Dominance.** Don't panic if C does well initially, especially if lots of people play B (C gets 5 vs B, which is good) or if C vs C happens (2 is better than B vs B's 4? Not necessarily, but students might think so). This is crucial – let them see C *can* be good sometimes.  
  *Predictable Go Wrong #2:* **Misreading the Table.** Someone will inevitably shout "Wait, what do I get if I play C and they play A?" Point them firmly back to their printed table: "Look at your sheet. You-C vs Other-A."  
  *Handling:* Stay neutral. Record accurately. Move quickly. The chaos is part of the point – they need to see payoffs depend on what others do.

  **(Minutes 30-50: First Discussion - "What's Beating What?")**  
  After the last round, say: "Okay, pause. Look at your total scores so far. Who has over 30? Over 25?" (Adjust based on actual scores). "Before we play more, let's talk. Look at the history on the board. Based on what you've seen and your table, discuss with the person next to you for 5 minutes: Is there any choice, A, B, or C, that just looks bad? Is there one that always gets beaten by something else? Find an example where one choice gets a strictly worse payoff than another choice *when facing the same opponent choice*. Be ready to share."

  *Predictable Go Wrong #3:* **Missing Pure Dominance (or lack thereof).** They might say "B is bad" because A beats it (8 vs 4). They might say "C is bad" because A crushes it (1 vs 12). But someone will point out "But C beats B!" or "C is okay if others play B or C!"  
  *Handling:* Let them argue. Guide them to specifics: "Show me on the table. If the other player plays B, what does C get? (5) What does A get? (8) What does B get? (4). So is C worse than A when Other plays B? (Yes, 5<8). Worse than B? (No, 5>4). Worse than A when Other plays C? (1 vs 1? No, equal)." Keep pushing until they agree: *No single choice* (A or B) is strictly better than C in *every* situation. C is sometimes better than B, sometimes equal to A, sometimes crushed by A. Ask them to confirm this out loud: "So, can you name one single choice that is always better than C? No? Okay." Write on the board: "No pure strategy beats C everywhere."

  **(Minutes 50-65: The Lottery Insight & Second Elimination)**  
  Now say: "Okay, if no single choice is always better than C, maybe C is okay? But some of you stopped playing C. Why? Think differently. What if, instead of picking one thing, you could flip a coin? Suppose before a round, I flip a coin. Heads, I play A. Tails, I play B. That's a 50/50 mix. Now, look at your tables. If the *other* player plays A, what do I get? Half the time I play A: 12. Half the time I play B: 8. Average? (10). If the other player plays B? Half A: 8, half B: 4. Average? (6). If the other player plays C? Half A: 1, half B: 5. Average? (3). Now, compare that to playing C. Against A, C gets? (1). Against B? (5). Against C? (2). Is 10 better than 1? (Yes). 6 better than 5? (Yes). 3 better than 2? (Yes). So, no matter what the *other* player does, this coin flip between A and B gives me a strictly higher payoff than playing C would. Always better. So, if you're rational and want more points, why would you ever play C? You wouldn't. Cross C off your list; it's strictly dominated... but only by this *mixture* of A and B." Write on board: "A 50/50 mix of A & B strictly dominates C. Payoff: 10, 6, 3 vs C's 1, 5, 2."

  Now say: "Okay, so C is gone. Forget C. Now it's just A and B. Look at your tables, ignoring the C row and column now. If I play A, and other plays A, I get? (12). Other plays B? (8). If I play B, and other plays A? (8). Other plays B? (4). Is there any choice here that's strictly better? Compare A and B. If other plays A, A gets 12, B gets 8. Is 12 > 8? (Yes). If other plays B, A gets 8, B gets 4. Is 8 > 4? (Yes). So, A is strictly better than B *no matter what the other player does* when only A and B are left. So B is strictly dominated by A. Cross B off too." Write on the board: "With C gone, A strictly dominates B."

  Summarize the elimination path: "First, we saw C was dominated, not by any single thing, but by a mix of A and B. We crossed off C. Then, with only A and B left, A dominates B purely. We crossed off B. Only A is left. That's the process."

  **(Minutes 65-75: Debrief & Formal Tie-in)**  
  "Okay, let's step back and see what this machinery did. First, the key insight: C wasn't beaten by A alone (C does okay if others play B or C), nor by B alone (C beats B!). But it *was* beaten by flipping a coin between A and B. The *lottery* is better everywhere. That's strict domination by a mixed strategy. Once we realized that, rationally, C should never be played. So we eliminate it. Now the game is smaller: just A and B. In *this new smaller game*, A *is* strictly better than B all by itself. So we eliminate B. What's left? Only A. The process unraveled step by step. Now, some important points about this machinery:  
  1.  **The Lottery vs The Solution:** That coin flip killed C. But the *solution* it gave us is to play A. We don't actually need to flip coins in the end; the elimination tells us only A survives. The mixture was a tool to eliminate an option, not the final answer.  
  2.  **Order Doesn't Matter (Here):** Could we have eliminated something else first? Suppose we naively looked for pure dominance first. A doesn't dominate B (if other plays B, A gets 8, B gets 4? 8>4, but if other plays A, A gets 12, B gets 8? 12>8, so actually A *does* purely dominate B in the full game? Wait, no! Look: If Other plays C, You-A gets 1, You-B gets 5. Is 1 > 5? No! So in the full game, A does NOT purely dominate B because when the other plays C, B (5) is better than A (1). That's why we *couldn't* eliminate B first purely. The *only* thing we could eliminate first was C, using the mixture. The order was forced. We *had* to kill C with the mixture first before we could kill B purely.  
  3.  **Set Shrinking, Not Behavior Predicting:** This process gives us a set of strategies that survive this iterative elimination. Here, it shrank to just {A}. It doesn't tell us what people *will* do (you saw chaos early on!), it tells us what rational players *shouldn't* do – anything not in the final set is irrational because it's dominated *at some step*.  
  4.  **Why it Matters:** This is why Nash Equilibrium is defined the way it is – it has to be robust against mixtures. A pure strategy NE must be better than *any* other pure *or mixed* strategy a player could use, given what others are doing. C couldn't be part of an equilibrium because even if others played *anything*, you'd rather flip a coin than play C."

  **(Minutes 75-80: Wrap-up & Name)**  
  "Finally, this process has a name: **Iterative Elimination of Strictly Dominated Strategies**. The 'strictly dominated' part includes domination by mixed strategies. That's the machinery we just used: crossing off options beaten by something else (including lotteries), seeing what's left, and crossing off more if we can. It's a powerful way to solve some games, like this one, reducing it step-by-step to a clear answer. Any final questions before I award the candy bar?" Award the candy bar to the student with the highest cumulative score.

  **What the Activity Can't Perfectly Reproduce:**  
  1.  **Perfect Rationality & Beliefs:** Students won't instantly grasp the mixed strategy dominance or iteratively eliminate perfectly. The early rounds show bounded rationality/learning. The candy bar incentive helps, but it's not the same as real monetary stakes driving perfect calculation. The discussion phase is essential to bridge that gap.  
  2.  **The Mixture as an Active Choice:** The activity focuses on the mixture as a *justification for elimination*. It doesn't realistically simulate players actively randomizing *during* play (though someone might try it). The debrief clarifies that the mixture is a tool for elimination, not the prescribed play in the solved game.  
  3.  **General Order Independence:** We only saw one path work here. It can't *prove* order independence generally, only illustrate that *in this game*, the only possible first elimination (using pure or mixed) was C.  
  4.  **Full Nash Equilibrium Depth:** It introduces the *idea* that mixtures matter for rationality, but the deep connection to mixed strategy Nash equilibrium (where players *do* randomize) is still a step beyond. This sets the foundation.  

  The core strengths are making them *see* that no pure strategy beats C, *forcing* the consideration of a mixture ("you can't name what beats C"), *witnessing* the iterative elimination unfold, and *separating* the dominance argument (why C is irrational) from the solution (play A). The physicality of writing choices, the public pairing, and the board history make the dependencies concrete. Good luck!
