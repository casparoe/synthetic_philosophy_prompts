  ---

  **Decision Tree: What Do Money Pumps Show About Diachronic Rationality?**  
  *Start with Case 1 and answer each question based on the case description. Proceed to the next node matching your answer.*

  ### **Case 1: Cyclical Preferences (Two-Stage Trade)**  
  An agent prefers \(A\) to \(B\), \(B\) to \(C\), and \(C\) to \(A\). A trader offers:  
  - Trade 1: Pay $1 to swap \(A\) for \(B\).  
  - Trade 2: Pay $1 to swap \(B\) for \(C\).  
  - Trade 3: Pay $1 to swap \(C\) for \(A\).  
  Result: The agent has \(A\) again but lost $3.  

  #### **Question 1A: What flaw does this pump reveal?**  
  - **a) The preferences are logically inconsistent** (intransitive). → Go to Q2A  
  - **b) The flaw is not in preferences, but in the agent’s disposition to act myopically** (e.g., ignoring future trades). → Go to Q3A  
  - **c) The agent is merely predictable/exploitable, not irrational**. → Go to Q4A  

  #### **Question 2A: Where should rationality bite?**  
  *(After Q1A-a)*  
  - **a) On the agent at each choice moment** (each trade must be rational given current preferences). → **Leaf: Standard Inconsistency View**  
    - *Position:* Revise preferences to be transitive.  
  - **b) On the agent’s whole-life plan** (the sequence must be rational overall). → **Leaf: Unnamed**  
    - *Awkward commitment:* Defends cyclical preferences but calls the *sequence* irrational.  

  #### **Question 3A: How avoid exploitation?**  
  *(After Q1A-b)*  
  - **a) Commit in advance** (e.g., refuse all trades). → **Leaf: Commitment Device Advocate**  
  - **b) Resolve to stick to a plan** (e.g., keep \(A\) and reject all trades). → **Leaf: Resolute Choice**  
  - **c) Update beliefs when offered a trade** (infer exploitation and refuse). → **Leaf: Sophisticated Choice**  

  #### **Question 4A: Is exploitability a defect?**  
  *(After Q1A-c)*  
  - **a) Yes, but it’s about weakness of will, not preferences**. → Go to Q2B (use Case 2)  
  - **b) No—exploitability is orthogonal to rationality**. → **Leaf: Exploitability Skeptic**  

  ---

  ### **Case 2: Preference Reversal (No New Information)**  
  At noon, an agent prefers watching a movie today (\(M_1\)) to tomorrow (\(M_2\)). By 6 PM (no new info), they prefer \(M_2\) to \(M_1\). A trader offers:  
  - Pay $1 at noon to swap \(M_1\) for \(M_2\).  
  - At 6 PM, pay $1 to swap \(M_2\) for \(M_1\).  
  Result: The agent watches \(M_1\) but lost $2.  

  #### **Question 1B: What flaw does this pump reveal?**  
  - **a) Dynamic inconsistency in preferences** (irrational shift without reason). → **Leaf: Stable Preference View**  
  - **b) Weakness of will** (failure to stick to a noon plan). → Go to Q2B  
  - **c) No flaw—preferences change, and exploitation is avoidable**. → Go to Q3B  

  #### **Question 2B: How avoid exploitation?**  
  *(After Q1B-b)*  
  - **a) Resolve at noon to ignore future trades**. → **Leaf: Resolute Choice**  
  - **b) Commit at noon to block 6 PM trades**. → **Leaf: Commitment Device Advocate**  
  - **c) At noon, anticipate the reversal and refuse trades**. → **Leaf: Sophisticated Choice**  

  #### **Question 3B: Why is exploitability not a defect?**  
  *(After Q1B-c)*  
  - **a) Rationality only governs moments, not cross-temporal plans**. → **Leaf: Myopic Rationality**  
  - **b) Exploitability is a social vulnerability, not irrationality**. → **Leaf: Exploitability Skeptic**  

  ---

  ### **Case 3: Paid to Form an Intention**  
  An agent is paid $10 now to form an intention to clean a lab tomorrow. Tomorrow, they have no reason to clean (it’s costly and unpleasant). If they don’t clean, they lose reputation.  

  #### **Question 1C: What flaw does this reveal?**  
  - **a) The agent’s preferences are irrational** (they accept a net loss). → **Leaf: Unnamed**  
    - *Awkward commitment:* Claims forming the intention is rational, but acting on it isn’t.  
  - **b) The flaw is in lacking commitment tools** (e.g., unable to bind future self). → **Leaf: Commitment Device Advocate**  
  - **c) No flaw—the agent rationally exploits the offer**. → Go to Q2C  

  #### **Question 2C: How defend no flaw?**  
  *(After Q1C-c)*  
  - **a) At each time, choices maximize utility given current preferences**. → **Leaf: Myopic Rationality**  
  - **b) Diachronic rationality doesn’t require intention-following**. → **Leaf: Exploitability Skeptic**  

  ---

  ### **Case 4: Unanticipated Trades**  
  An agent faces a series of trades they didn’t anticipate and couldn’t plan for (e.g., sudden opportunities to swap assets).  

  #### **Question 1D: What does exploitation show?**  
  - **a) Inability to plan for all futures is a design flaw**. → **Leaf: Agent-Redesign View**  
  - **b) Exploitation is inevitable and normatively irrelevant**. → **Leaf: Exploitability Skeptic**  
  - **c) Rationality requires updating beliefs mid-sequence**. → **Leaf: Sophisticated Choice**  

  ---

  ### **Summary of Named Positions & Diagnostics**  
  - **Standard Inconsistency View**: Q1A-a → Q2A-a. *Flaw: Preferences are inconsistent.*  
  - **Commitment Device Advocate**: Q1A-b → Q3A-a, Q1B-b → Q2B-b, or Q1C-b. *Flaw: Lack of precommitment tools.*  
  - **Resolute Choice**: Q1A-b → Q3A-b or Q1B-b → Q2B-a. *Flaw: Failure to stick to a plan.*  
  - **Sophisticated Choice**: Q1A-b → Q3A-c, Q1B-c → Q3B? (wait, see below), or Q1D-c. *Flaw: Myopic belief-updating.*  
  - **Exploitability Skeptic**: Q1A-c → Q4A-b, Q1B-c → Q3B-b, or Q1C-c → Q2C-b. *Flaw: None; exploitability ≠ irrationality.*  
  - **Stable Preference View**: Q1B-a. *Flaw: Preferences change without reason.*  
  - **Myopic Rationality**: Q1B-c → Q3B-a or Q1C-c → Q2C-a. *Flaw: None; each choice is locally rational.*  
  - **Agent-Redesign View**: Q1D-a. *Flaw: Poor agent design.*  

  ### **Unnamed/Unoccupied Combinations & Diagnostics**  
  - **Q1A-a → Q2A-b**: Claims cyclical preferences are fine but the *sequence* is irrational. *Empty because incoherent*: If preferences are inconsistent, the sequence can’t be salvaged.  
  - **Q1C-a**: Claims forming the intention is rational but acting on it isn’t. *Empty because unattractive*: It ignores diachronic identity.  
  - **Q1B-c → Q3B-a + Q4=e?**: Not present in the tree, but if it were: Claims exploitability isn’t a defect but recommends updating beliefs. *Empty because incoherent*: If rationality is only momentary, belief-updating isn’t required.  

  ### **Indistinguishable Positions**  
  - **Resolute vs. Sophisticated Choice in Case 2**: Both may refuse trades, but for different reasons (sticking to a plan vs. anticipating reversal). The tree separates them via Q1B-b (resolute) vs. Q1B-c → Q3B? (sophisticated).  
  - **Exploitability Skeptic vs. Myopic Rationality**: Overlap in denying diachronic defects, but Skeptics reject normativity entirely (Q4A-b), while Myopic defenders uphold moment-by-maximization (Q3B-a).  

  ### **Notes**  
  - **Empty Branches**: Most unnamed leaves are unattractive (e.g., defending inconsistency) or unexplored (e.g., redesigning agents for Case 1).  
  - **Non-EU Risk Pumps**: Omitted for brevity but fit under Case 1 (if cyclical) or Case 2 (if time-dependent). Responses mirror those above.  
  - **Tree Logic**: Early branches target *what pumps demonstrate* (inconsistency, weakness, exploitability) and *where rationality bites* (moments, plans, design), forcing students to confront core tensions.  

  ---  
  This tree isolates positions via case-based choices, avoids survey-style labels until leaves, and flags gaps in the literature. For seminar use, focus discussion on Cases 1 and 2 to cover >80% of the dialectic.
