prompt: |-
  I'm the registrar at a small natural history museum -- I started three months ago and the last person left mid-catalog. We just got a big bequest and I'm drowning in the special composition question without knowing that's what it was called: when do some things compose one bigger thing? Our database forces every accession into either one object record or a parent record with child records, and the grant auditors want a written rule we can defend. I need a decision procedure my two cataloguers and I can actually run on an item, grounded in whatever the metaphysics of composition actually says that is usable. Not a reading list or citations, I can't look them up in the stacks and I don't have internet down there. Questions to ask in order, what counts as a sufficient answer to each, where it stops with a no, and where it hands the decision to me because its a values or policy call rather than a fact. It should take maybe ten minutes per item, and it has to be honest about which steps are just judgment calls dressed up as procedure. Use the main answers people give -- everything composes, nothing composes, only living things compose, things compose when they're in contact or fastened together, etc. -- but translate them into tests a non-philosopher can run.

  Then run it on two cases: a fossil slab with three fish skeletons embedded in one rock, and a suit of armor that was found in pieces in a barrel and has been reassembled on a mount. Add a third case where the procedure gives an answer I won't like -- I'm thinking the wasp nest, because I want to keep it as one object for exhibit but the procedure might say its many. Also tell me what the procedure can't do, and what we should do when we hit that limit. Our board also keeps saying if you can pick it up and move it without anything falling off its one object -- build that in as a candidate rule and tell me where it fails. And for each case say what we'd write in the accession record to justify the call. I'm alot more worried about getting this right than looking decisive.
reasoning: |-
  Okay, let me tackle this museum registrar's problem. They're overwhelmed with a big bequest and need a practical decision procedure for when multiple items should be cataloged as one object versus multiple child records. The key is making metaphysical composition theories usable for non-philosophers in a time-constrained environment. 

  First, I need to distill complex philosophy into actionable steps. The main theories to consider are: universalism (everything composes), nihilism (nothing composes), organicism (only living things), and contact/fastening theories. But these need translation into museum-workable tests. The board's "pick up without falling apart" rule is a good starting point but has limitations - it fails for fragile items or things meant to be separate.

  The procedure should be a flowchart-style Q&A with these features:
  - Clear yes/no questions with defined thresholds
  - Designated "curatorial judgment" points where rules conflict
  - Time-bound steps (under 10 min total)
  - Honesty about which steps are subjective
  - Documentation requirements

  For the test cases:
  1. Fossil slab: Three fish in one rock. Should clearly be one object under most theories.
  2. Reassembled armor: Originally in pieces but now mounted. This is trickier - probably one object if permanently fixed.
  3. Wasp nest: Might force separation into multiple objects despite exhibit needs. Good example of procedure overriding preference.

  The procedure must admit its limits - some items will need registrar override when theories conflict. Documentation should capture both the decision and the reasoning trail. 

  I'll structure the response as: 
  - The practical decision procedure (step-by-step questions)
  - Application to the three test cases
  - Limitations and override protocol
  - How to document each decision

  The goal is giving this registrar a tool that's philosophically grounded but operationally feasible, with clear documentation trails for auditors. Most importantly, it needs to acknowledge where professional judgment trumps theoretical purity.
answer: |-
  Here's a practical decision procedure grounded in composition metaphysics, designed for museum cataloguers to run in under 10 minutes per item. It prioritizes defensible rules over philosophical perfection and flags judgment calls transparently. It incorporates common theories (contact, fastening, functional unity, organicism) and the board's "pick-up test" while exposing their flaws.

  ---

  ### **Museum Composition Decision Procedure (MCDP)**
  **Ask these questions in order. Stop at first definitive "NO" for multi-part cataloging (child records). If all "YES" or "JUDGMENT," catalog as one object (parent record).**

  1. **"Was it created or assembled *as one thing* for a unified purpose? (Functional Unity Test)**  
     - *Sufficient YES:* Maker's intent clear (e.g., a chair, a sword).  
     - *Sufficient NO:* Items stored together randomly (e.g., rocks in a box).  
     - *Judgment Call?* If ambiguous (e.g., a tea set). → **Hand to Registrar**  
     *Theory Basis:* Artifactual composition (things compose when designed as a unit).

  2. **"Are the parts physically bonded *and* inseparable without damage? (Bonding Test)**  
     - *Sufficient YES:* Glued, welded, fossilized, or grown together (e.g., ceramic shards repaired with adhesive).  
     - *Sufficient NO:* Parts detach cleanly (e.g., Lego pieces).  
     - *Judgment Call?* If bonding is weak/reversible (e.g., nut screwed on a bolt). → **Hand to Registrar**  
     *Theory Basis:* Contact/fastening (composition requires permanent attachment).

  3. **"Is it a single living organism or its fossil? (Organicism Test)**  
     - *Sufficient YES:* A skeleton, a preserved plant, fossilized tree.  
     - *Sufficient NO:* A pile of bones from multiple animals.  
     *Theory Basis:* Biological unity (living things compose wholes).

  4. **"Can you pick up the whole thing without parts falling off? (Board's Pick-Up Test)**  
     - *Sufficient YES:* Holds shape when lifted (e.g., a book).  
     - *Sufficient NO:* Parts scatter if tilted (e.g., loose beads in a bowl).  
     - *Judgment Call?* If fragile but intact (e.g., a wasp nest). → **Hand to Registrar**  
     *Flaw:* Fails for heavy items, mounted objects, or things meant to disassemble (e.g., a tent).

  5. **"Do all parts share the same context of discovery? (Provenance Test)**  
     - *Sufficient YES:* Found/recovered as a group in one place (e.g., armor in a barrel).  
     - *Sufficient NO:* Parts from different locations/donors.  
     - *Judgment Call?* If context unclear (e.g., mixed excavation layers). → **Hand to Registrar**  
     *Practical Basis:* Curatorial practicality and historical accuracy.

  **Final Decision:** If all answers are "YES," catalog as **one object**. If any "NO," catalog as **parent with child records**. If "Hand to Registrar," use policy override.

  ---

  ### **Test Cases**
  **Case 1: Fossil Slab with Three Fish Skeletons**  
  1. **Functional Unity?** NO (not assembled; natural deposit).  
  2. **Bonding?** YES (fossils embedded in rock; inseparable).  
  3. **Organicism?** NO (multiple organisms).  
  4. **Pick-Up Test?** YES (slab lifts as one unit).  
  5. **Provenance?** YES (found as one slab).  
  → **Stop at Q1 (NO)**. Catalog as **parent (slab) with three child records (fish)**.  
  *Justification:* "Natural deposition of multiple organisms in a single matrix. Cataloged hierarchically to respect biological individuality while preserving geological context."

  **Case 2: Suit of Armor Reassembled on Mount**  
  1. **Functional Unity?** YES (designed as one protective suit).  
  2. **Bonding?** JUDGMENT (parts fastened but removable). → **Hand to Registrar**.  
  *Registrar Override:* **Catalog as one object**.  
  *Justification:* "Functional unity overrides reversible assembly. Modern mount is support, not part of the object. Policy: Reassociated artifacts with original design intent are one object."  

  **Case 3: Wasp Nest (Intact but Fragile)**  
  1. **Functional Unity?** YES (built as one nest by colony).  
  2. **Bonding?** YES (paper fibers fused).  
  3. **Organicism?** NO (not a single organism).  
  4. **Pick-Up Test?** JUDGMENT (holds shape if careful, but fragile). → **Hand to Registrar**.  
  *Registrar Override:* **Catalog as one object** (despite Q3 NO, prioritizing functional unity and physical bonding).  
  *Justification:* "Structural integrity and colony intent override non-organicism. Policy: Social insect constructions treated as single artifacts unless disassembled."  

  ---

  ### **Limitations & Protocol**
  **What MCDP Can't Do:**  
  - Resolve "vague objects" (e.g., is a river *one* object or many water molecules?).  
  - Handle items with disputed interpretations (e.g., ritual bundles).  
  - Replace expertise (e.g., distinguishing restoration from original parts).  

  **When You Hit a Limit:**  
  1. **Document the ambiguity** in the accession notes.  
  2. **Apply policy override** (Registrar decides based on: storage needs, exhibit value, or research value).  
  3. **Flag for review** if new evidence emerges.  

  **Board's Pick-Up Test Failures:**  
  - **False Positives:** Mounted items (e.g., armor on a stand) may "hold together" but aren’t one object.  
  - **False Negatives:** A necklace clasp may fail if lifted improperly but is functionally one object.  
  → MCDP *uses* it only as a practical screen (Q4), not a definitive rule.  

  ---

  ### **Implementation Tips**  
  - **Training:** Role-play "Judgment Call" scenarios with staff.  
  - **Audit Trail:** Always record: (1) Answers to all 5 questions, (2) Override reason if used.  
  - **Policy Safeguard:** Review overrides quarterly to adjust the procedure.  

  This balances philosophical rigor with operational reality. You’re not deciding metaphysics—you’re applying a clear, auditable rule set that admits its own uncertainties.
