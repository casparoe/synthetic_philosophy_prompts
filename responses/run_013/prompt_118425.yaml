prompt: |-
  So we've just finished the Nuremberg and Tokyo trials in history and there's one bit I can't let go of. The defence barristers apparently stood up and argued that you can't convict a man for something that wasn't a crime at the time he did it — the court itself, and the list of crimes it was allowed to try, only got written up after the war was already over, so the people in the dock were being judged by rules that didn't exist yet. And the judges came back with, basically: no, these were already crimes under international law, we're just declaring what the law always was. Half my class thinks that's obviously right and the other half thinks it's the winners writing the rules and then pretending they didn't. I'm stuck in the middle and its driving me mad.

  Could you write me a short story about it? Not Nuremberg again, I've done that to death — a made-up tribunal in a made-up country, but with these rules built in so the story is actually about the problem:

  - The court, and the list of crimes it's allowed to try, are created after the acts happen, by the side that won.
  - Everything the defendants did was legal, and some of it compulsory, under their own country's law at the time. One of them is a mid-level admin bloke who mostly signed paperwork — he's the one I want the story to be about.
  - One of the judges writes a dissent saying the whole thing is unlawful. He isn't a villain or an idiot; give him the strongest version of the argument.
  - Somewhere in the story somebody makes this point: if international law is just whatever countries actually do, and the winning countries did the same things the defendants are on trial for (and there's no charge for it), then where exactly is the law they're supposed to have broken? I want that to land as a real problem and not a cheap gotcha.

  Keep it short, a page or two, and don't feel you have to make it hopeful or wrap it up neatly.

  Then at the end, in a few lines: tell me where the story takes liberties with the actual ideas — which reading of 'the law at the time' it quietly assumes, and which other reading would have made it end differently. And say which bit of your own reasoning there you'd most expect to be wrong.
