prompt: |-
  Act as a philosopher of social science who also knows what it's like to work on a copy desk. Think this through carefully before you write, and start by brainstorming the distinctions you'll need, because the ask is to build me something usable, not an essay.

  I edit the ideas section of a magazine, and we keep printing sentences like 'the Japanese prefer consensus' or 'Brazilians are loose about time' — sometimes a whole essay rests on one, sometimes it's just color in a travel piece. I don't want the blanket ban half my colleagues argue for ('never generalize about a people') and I don't want the free-for-all we have now. So give me a procedure an editor can run on a sentence before it goes to press: the questions in order, what counts as a good enough answer to each, where it stops and the sentence gets cut or rewritten, and where it's a judgment call a person just has to make. Constraints: it has to fit on one side of paper, work for a copy editor with no theory background, and anything it can't settle comes to me.

  Two things I'd like it to use, if they're real and not just my invention: a distinction between a sentence that means 'lots of them are like this' and one that means 'this is what it is to be one of them', and some way of handling the fact that 'the Danes are trusting' can be roughly true of a population and still useless or unfair as a claim about the particular Dane you're describing. It should also say something about headlines, and about generalizing about the powerful (a government, an industry, a billionaire class) versus the powerless, because I suspect those two shouldn't be treated the same.

  Then run it on three cases: 'Israelis are direct'; 'the Chinese are good at long-term planning', in a piece about industrial policy; and 'Newfoundlanders would give you the shirt off their backs', which is from a writer about her own family and which I'd like to survive — so tell me honestly if it doesn't. Finish by saying what the procedure cant do.
reasoning: |-
  Okay, the user wants a practical editing procedure for generalizations about cultures in their magazine. They need something actionable, not theoretical. Let me start by breaking down their main concerns: avoiding blanket bans but also preventing careless stereotypes. They mentioned key distinctions like "lots are like this" vs. "this is what it is to be one," and handling cases where a generalization might be statistically true but misleading in context. Also, power dynamics matter—generalizing about the powerful vs. the powerless shouldn't be treated the same.

  First, I need to outline a step-by-step checklist. The user emphasized brevity—one side of paper—so each step must be concise. The distinctions they mentioned are crucial. The descriptive ("many") vs. essentialist ("this defines them") helps avoid reifying stereotypes. Then there's the issue of representativeness: even if true on average, applying it to an individual can be unfair. 

  Power dynamics: Generalizations about powerful entities (governments, corporations) might be more acceptable because their actions affect many and they're public. But marginalized groups? That's riskier and needs more caution. Headlines are tricky—they amplify impact, so require extra scrutiny.

  Now, the examples. "Israelis are direct" needs checking for qualifiers, evidence, purpose, and harm. "The Chinese are good at long-term planning" in an industrial policy piece—here, the context matters. Is it about government policy or the people? The procedure should catch that. The Newfoundland example is personal; the checklist might flag it as essentialist unless rewritten to reflect the writer's experience.

  What can't the procedure do? It won't catch every nuance, can't replace subject expertise, and can't resolve all ethical judgments. The editor must step in when there's uncertainty. Also, historical context or highly contested claims need human judgment. 

  Need to ensure the steps are in logical order: from identifying the generalization to checking qualifiers, evidence, purpose, essentialism, representativeness, power dynamics, and headlines. Each step should have clear pass/fail criteria. The user's colleagues might push back, so the procedure must be defensible and practical for time-pressed editors. Finally, testing the examples will show how the procedure works in real cases.
answer: |-
  Here's a practical editing procedure designed for speed and usability on the copy desk. It fits on one page and focuses on actionable checks.

  **The "Culture Claim" Edit Check (One-Page Procedure)**

  **Goal:** Assess generalizations about groups ("the X") for fairness, accuracy, and usefulness. Flag risky claims for rewrite/kill or send to Editor.

  **Core Distinctions Used:**
  1.  **Descriptive ("Many") vs. Essentialist ("This is What They Are"):** Does the sentence describe a common tendency *within* the group (often OK with care), or does it claim this trait *defines* the group's essence (high risk, often bad)?
  2.  **Group Tendency vs. Individual Guarantee:** A claim can be roughly true *on average* for a large group but be useless, misleading, or deeply unfair when applied to *any specific individual* within that group.
  3.  **Power Differential:** Generalizing about powerful groups (governments, corporations, billionaire class) is often *less* problematic than generalizing about powerless groups. Powerful groups shape systems affecting many; powerless groups are more vulnerable to harmful stereotyping. Scrutinize claims about the powerless much harder.

  **The Check: Run these questions IN ORDER. Stop and Act if any answer is "No" or "Unclear".**

  1.  **IDENTIFY THE CLAIM:** Circle the subject ("The Japanese," "Brazilians," "The Tech Industry") and the trait ("prefer consensus," "are loose about time," "are innovative").
      *   *Good Enough:* Clear what group and what trait are being claimed.

  2.  **QUALIFIER CHECK:** Does the claim have a softening word like "often," "tend to," "many," "commonly," "can be," "frequently," "in many contexts," "some"?
      *   *Good Enough:* **Yes.** (Proceed to #3).
      *   *No/Unclear:* **Rewrite Immediately.** Add a qualifier (e.g., "Some Brazilians..." or "Punctuality expectations can be looser in Brazil..."). If adding a qualifier ruins the sentence's point, it's likely essentialist - kill or send to Editor.

  3.  **EVIDENCE/BASIS CHECK (Quick & Practical):** Is there *any* plausible basis given or implied? (e.g., cited study, author's stated experience, common observation in the context, reporting within the piece itself).
      *   *Good Enough:* **Yes** (e.g., "Studies show...", "In my travels...", "Business analysts note...", context implies observation). *OR* **The claim is clearly presented as the author's subjective impression/experience** (e.g., "I found Newfoundlanders..."). Proceed to #4.
      *   *No/Unclear:* **Flag for Editor.** Is this just a lazy stereotype? Needs grounding or kill.

  4.  **ESSENTIALISM CHECK:** Does the sentence *sound* like it's describing the group's core nature or identity? (Watch for: Present tense "are", no qualifiers, absolutes implied, used to explain *why* they do things).
      *   *Good Enough:* **No.** It feels descriptive ("many," "tend to") not defining ("this is what it means to be X"). Proceed to #5.
      *   *Yes/Unclear:* **Rewrite** to be explicitly descriptive (add qualifiers) **or Kill.** Essentialist claims are high-risk. Send to Editor if unsure.

  5.  **REPRESENTATIVENESS CHECK (Individual Fairness):** Could this claim mislead a reader into applying it unfairly to *any random individual* from this group? (e.g., "The Danes are trusting" might lead a reader to naively trust any Dane).
      *   *Good Enough:* **No, risk is low.** (e.g., claim is very broad & non-judgmental, or context clearly prevents individual application). *OR* **The context explicitly warns against individual application.** Proceed to #6.
      *   *Yes:* **Add Context** (e.g., "...though individuals vary greatly") **or Rewrite** to emphasize it's not about individuals. If impossible without gutting the sentence, **Kill or Flag for Editor.**

  6.  **POWER & HARM CHECK:**
      *   **Powerful Group?** (Government, Corp, Billionaires): **Proceed to #7.** (Generalizations here are often less harmful, focus on accuracy/usefulness).
      *   **Powerless/Marginalized Group?** (Ethnicity, Nationality, Religion, Gender, etc.):
          *   *Is the trait neutral/positive?* **Proceed to #7.** (Still scrutinize).
          *   *Is the trait negative or potentially stigmatizing?* **EXTREME CAUTION.** Is it *absolutely essential* to the core argument? Is it backed by *strong evidence*? Is it framed carefully to avoid universal application? **If ANY doubt, Flag for Editor or Kill.**

  7.  **HEADLINE CHECK (If applicable):** Is this claim in a HEADLINE?
      *   **YES:** Headlines amplify impact and strip nuance. **Requires EXTRA scrutiny.** Rerun Checks #2 (Qualifier - often impossible in headlines, making them risky), #4 (Essentialism - headlines often sound essentialist), and #5 (Representativeness - headlines imply universality). **Most generalizations in headlines fail. Strongly recommend Rewrite or Kill. Flag for Editor.**

  **Outcome Summary:**
  *   Passes all Checks (1-7): Can likely stand.
  *   Fails any Check (#2, #3, #4, #5, #6b, #7): Requires **Rewrite** or **Kill**.
  *   "Flag for Editor" = Judgment call needed on risk/necessity/context. Send it up.

  ---

  **Testing the Procedure:**

  1.  **"Israelis are direct."**
      *   1. Identified: Israelis / Direct.
      *   2. **Qualifier?** **NO.** (Fails). Rewrite: "Israelis are often direct" or "Direct communication is common in Israel." Or kill if adding qualifier ruins it.
      *   *(Stops at #2 - Fails)*. **Result:** Rewrite or Kill.

  2.  **"The Chinese are good at long-term planning" (in a piece about industrial policy).**
      *   1. Identified: The Chinese / Good at long-term planning.
      *   2. **Qualifier?** **NO.** (Fails). Rewrite: "Chinese policymakers emphasize long-term planning" or "Long-term industrial planning has been a feature of China's approach." Crucial: Shift focus from "The Chinese" (people) to the *institutions/policies* being discussed.
      *   *(Stops at #2 - Fails)*. **Result:** Rewrite (focus on policy, not people) or Kill. Essentialist and ignores individual variation/potential harm.

  3.  **"Newfoundlanders would give you the shirt off their backs" (from a writer about her own family/experience).**
      *   1. Identified: Newfoundlanders / Generous to the point of self-sacrifice.
      *   2. **Qualifier?** **NO.** (Fails). But... context is personal experience.
      *   3. **Evidence/Basis?** **YES.** Implied: Author's experience with family/community. Clearly presented as subjective impression. (Passes #3).
      *   4. **Essentialism?** Sounds essentialist ("would give" implies defining trait). (Fails #4). **Rewrite:** "In my experience, Newfoundlanders *have often* given..." or "My Newfoundland family exemplify a generosity so deep..." (Makes it explicitly descriptive *of her experience*).
      *   5. **Representativeness?** Could mislead about individuals? **YES.** Reader might expect *all* Newfoundlanders to be this extreme. (Fails #5). **Add Context:** "...a generosity so deep it felt like they'd give you the shirt off their backs. Of course, individuals vary..." OR rewrite softer: "known for remarkable generosity."
      *   6. **Power/Harm?** Relatively powerless group? **YES.** Trait is positive. Still, essentialism + representativeness failures exist. Proceed.
      *   **Result:** **Rewrite** strongly recommended to ground it firmly in the author's personal experience and add nuance ("often," "in my experience," "many"). The raw sentence is too essentialist and risks misapplying a positive stereotype. It *can* survive with careful rewriting.

  ---

  **What This Procedure CAN'T Do:**

  1.  **Replace Subject Expertise:** It flags potential issues but can't verify if a claim about "Japanese consensus-building" is *actually* accurate or nuanced without Japan expertise.
  2.  **Resolve Deep Contextual Nuance:** Is "loose about time" in Brazil about cultural fluidity or disrespect? The procedure flags the generalization, not the deeper interpretation.
  3.  **Make Final Ethical Judgments:** It highlights risks (especially harm to marginalized groups), but the Editor must weigh necessity, intent, and overall message.
  4.  **Handle Highly Contested Claims:** If "evidence" cited is itself controversial (e.g., a single, disputed study), the procedure might pass it (#3) but the Editor needs to assess credibility.
  5.  **Fix Bad Faith Arguments:** If an author uses a qualified, descriptive claim to subtly push an essentialist narrative, the procedure might miss it.
  6.  **Account for Historical Context:** The weight of a stereotype (e.g., about African Americans) carries historical baggage the checklist can note (#6) but not fully calibrate.

  **Bottom Line for the Editor:** This procedure catches lazy stereotypes, essentialism, and high-risk generalizations, forcing rewrites for nuance and context. It protects the powerless more than the powerful. It flags the rest for *your* judgment based on expertise, context, and ethics. It makes the implicit rules explicit and defensible on the copy desk.
