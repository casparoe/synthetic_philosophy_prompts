prompt: |-
  So I'm a clinical ethics fellow and I've been volun-told to cover a 90-minute teaching slot next month for a mixed group — secound-year med students plus two nurses and a social worker who sit on our ethics committee — and the topic that got dumped on me is "why do advance directives bind?", which sounds like a non-question until you actually try to teach it and realise the room thinks it's just a paperwork problem. I don't want you to explain the ethics of advance directives to me, I know roughly where I stand; I want a plan for the session. Specifically: what has to be in place before the question even looks like a question (I think it's something about a person being spread out over time and one slice of her getting to boss another slice around, but I can never get that onto the board without it sounding like a sci-fi puzzle), the order the pieces have to come in and what depends on what, and where in that order I should break the news that "it's just respect for autonomy" is doing almost none of the work.

  The case I want to build it around — tell me if it's the wrong one: a woman in her early sixties with early-onset Alzheimer's who, five years ago, while fully herself, wrote not a form but a long letter to her daughter, refusing antibiotics and hospital admission in the late stages, and who put into it a clause I've never seen on any actual form — roughly "if I start telling you I want to go to the hospital, that is the disease talking, not me; I watched my father do this." Call it a counter-interpretive clause: a bit of the directive that's about how to read the later me rather than about what to do. Now she has pneumonia, and she's having a good week, and she says, coherently, that she wants to be treated, and she seems to mean it. I want that example to carry the whole session, so I need to know what it has to have (a real conflict, an earlier self who was competent, a later self who is not simply gone) and what it should deliberately lack — I'm inclined to strip out any whiff of "the real her is the one before the dementia", is that right? And if your instinct is to tell me to just use Odysseus and the mast, say why that does or doesn't do the job.

  Then the misconceptions, in the order they'll actually surface in a room like this, and exactly where in the sequence I head each one off: that autonomy does all the work here; that the competent-at-the-time criterion settles it; that a directive is basically a contract with the hospital rather than an instruction, or a piece of testimony about what she valued; that capacity is a yes/no switch; and whatever else you think secound-years reliably produce. Also tell me what I should openly refuse to cover at this level and say so out loud — I'm tempted to do a little block on the metaphysics of personal identity and I suspect that's a trap — and give me one closing question, ideally a new case rather than a rehash of mine, that will tell me whether they've got the structure of the problem or just learned my example.
reasoning: |-
  Okay, let's tackle this. The user is a clinical ethics fellow preparing a 90-minute session on why advance directives bind, and they need a structured plan. Their main challenge is moving beyond the superficial "autonomy does all the work" misconception. They've provided a specific case study involving an Alzheimer's patient with a unique directive clause. 

  First, I need to unpack the core problem: the session must show that binding directives rely on more than autonomy. The user mentioned concepts like a person being "spread out over time," which sounds metaphysical but is crucial. However, diving deep into personal identity theory might lose the audience. I should find a balance—acknowledge the temporal aspect without getting lost in philosophy.

  The case study is strong. It has a competent past self, a directive with a counter-interpretive clause, and a current self expressing conflicting wishes during a lucid period. Key elements are present: conflict, competence at time of directive, and a later self that isn't entirely gone. The user wants to avoid implying the "real her" is only the pre-dementia version. That's smart because it prevents oversimplification. The case deliberately lacks a clear-cut answer, forcing engagement with the ethics.

  Odysseus and the mast is a classic analogy. It's useful for illustrating precommitment but falls short here. Odysseus's sailors are bound physically, whereas the directive involves interpreting identity and values over time. The mast analogy doesn't address the core issue of how we weigh past vs. present wishes when both seem autonomous. So, it's a good starting point but insufficient alone.

  Now, structuring the session. The user wants the sequence of concepts that make the question meaningful. Start with what makes directives seem binding superficially (autonomy, legal validity), then peel back layers. Essential building blocks:
  1. Autonomy requires respecting past decisions, but why? Because identity persists over time, though not perfectly.
  2. Competence at the time of the directive is necessary but not sufficient.
  3. Directives aren't contracts or testimony; they're a hybrid of instruction and values statement.
  4. Capacity isn't binary—lucid intervals complicate things.

  Misconceptions will arise in this order: 
  - Early: "Autonomy settles it." Counter by showing conflicting autonomous wishes (past vs. present).
  - Then: "Competence at the time makes it binding." Use the case to challenge—what if she's competent now too?
  - Later: "It's a contract." Contrast with the letter format showing it's personal, not transactional.
  - Finally: "Capacity is yes/no." Highlight her "good week" to discuss fluctuating capacity.

  The user should explicitly avoid metaphysics. Instead, frame it as practical ethics: "We're not deciding who she *really* is, but which expression of her values we prioritize, and why."

  Closing with a new case is wise. A Jehovah's Witness who signed a blood refusal directive but now, delirious from sepsis, begs for transfusion. This tests if they grasp that the counter-interpretive clause (absent here) changes the analysis—without it, we might prioritize current wishes. 

  Key session flow:
  1. Hook with Odysseus (5 min).
  2. Present the case (10 min).
  3. Break down why it's hard (15 min on autonomy not being enough).
  4. Group work dissecting the directive's clauses (20 min).
  5. Address misconceptions as they emerge (15 min).
  6. Recap the framework (10 min).
  7. Closing case (10 min).
  8. Wrap-up (5 min).

  The user’s trap to avoid: don’t let them reduce it to "just autonomy" or "just competence." Force the nuance. The counter-interpretive clause is their secret weapon—it makes the directive about interpreting identity, not just following orders.
answer: |-
  Here’s a structured 90-minute session plan designed to unpack the binding nature of advance directives, using your case as the anchor while systematically addressing misconceptions. The goal is to reveal the **layered justifications** beyond autonomy and confront the "paperwork fallacy."

  ---

  ### **Session Structure & Timing**  
  **Total: 90 mins**  
  *(Flexible based on group engagement)*  

  ---

  ### **Phase 1: Framing the Problem (15 mins)**  
  **Goal:** Establish why "why do they bind?" is a substantive question.  
  - **Hook (5 mins):** *Odysseus & the Mast* analogy.  
    - **Why it works:** Illustrates *precommitment*—a competent self restricting future choices to avoid known weakness.  
    - **Why it’s insufficient:** Odysseus’s *identity* is stable; dementia challenges continuity of self. Say: *"This gets us ‘why plan ahead?’ but not ‘why bind a future altered self?’"*  
  - **Core Tension (10 mins):**  
    - Draw a timeline on the board:  
      ```  
      PAST SELF (Competent, Directive) → PRESENT SELF (Dementia, "Good Week") → FUTURE SELF (Late Stage)  
      ```  
    - **Key Point:** "Advance directives force us to ask: *When a person fractures over time, which ‘self’ gets authority?* Autonomy alone can’t answer this—it pits past vs. present autonomy against each other."  

  ---

  ### **Phase 2: Deep Dive into Your Case (30 mins)**  
  **Case:** *Early 60s, Alzheimer’s, 5-yo letter refusing antibiotics/hospitalization + "counter-interpretive clause" re: disease "talking." Now, pneumonia + lucidly requests treatment.*  
  - **Group Work (15 mins):** *"What would you do? What principles justify your choice?"*  
    - **Deliberate Case Features:**  
      - ✅ Past competence + explicit values (witnessed father’s experience).  
      - ✅ Current "coherent" refusal of past directive (conflicting autonomy claims).  
      - ✅ Directive includes *meta-instruction* (how to interpret future desires).  
      - 🚫 **No "real self" assumption:** Strip phrases like "the *real* her knew better." Say: *"We can’t assume the past self is ‘truer’—that’s the puzzle."*  
  - **Debrief (15 mins):** Surface tensions:  
    - *"If we honor her current wish, why did the past directive exist?"*  
    - *"If we ignore her current wish, are we treating her as already ‘gone’?"*  
    - **Clinch:** "Her directive isn’t just instructions—it’s a *theory of identity*: ‘*This disease will distort my voice; my past self is the gatekeeper.*’"  

  ---

  ### **Phase 3: What Makes Directives "Bind"? Building the Framework (25 mins)**  
  **Goal:** Show autonomy is necessary but insufficient. Reveal supporting structures.  
  | **Justification**       | **Why It Matters**                                                                 | **Counter-Misconception**                              |  
  |-------------------------|------------------------------------------------------------------------------------|--------------------------------------------------------|  
  | **1. Autonomy (Respect)** | Necessary starting point.                                                          | "Autonomy does **not** resolve past vs. present conflict." |  
  | **2. Precedent Autonomy** | Past choices extend moral force *if* identity persists.                            | "Requires a theory of identity-over-time (not sci-fi!)." |  
  | **3. Trust/Social Practice** | Promotes trust in healthcare; allows planning.                                     | "It’s not a ‘contract’—it’s a social institution."     |  
  | **4. Best Interests/Value Stability** | Directive as evidence of *enduring values* (e.g., "I fear prolonged dying").      | "Not ‘testimony’—it’s *performative* (it intends to bind)." |  
  | **5. Legal Ritual**      | Formalities (witnesses, paperwork) signal seriousness.                             | "But forms aren’t magic—the *letter* in our case has weight." |  

  **Key Script:**  
  > *"Autonomy gets the ball rolling, but we need these 4 pillars to hold it up. Her ‘counter-interpretive clause’ leans hard on #4 and #2: it claims her values are stable, and her past self defines how to interpret drift."*  

  ---

  ### **Phase 4: Busting Misconceptions (15 mins)**  
  **Address in this order** (as they’ll arise naturally):  
  1. **"Competence-at-the-time settles it!"**  
     - *Response:* "Competence makes it valid, but doesn’t tell us why it overrides *current* competent wishes. That’s the conflict!"  
  2. **"Capacity is yes/no."**  
     - *Response:* "Her ‘good week’ shows capacity is fluid. But her directive *anticipates* this: it says even lucid-seeming requests may be disease-driven."  
  3. **"It’s just a contract with the hospital."**  
     - *Response:* "Contracts bind parties. This binds *her future self*—it’s more like a Ulysses pact."  
  4. **"The directive is testimony about her values."**  
     - *Response:* "Testimony informs decisions; directives *aim to control* them. Her clause isn’t evidence—it’s an *instruction* on how to read her."  

  ---

  ### **Phase 5: What to EXCLUDE & Closing (5 mins)**  
  - **Openly Reject:**  
    > *"We won’t solve the metaphysics of personal identity today. Our job is practical: *Which expression of the patient should clinicians prioritize, and why?*"*  
  - **Closing Question (New Case):**  
    > *"A patient with severe bipolar disorder, when stable, signs a directive refusing life-saving treatment during mania (‘I’ll be reckless’). During a manic episode, they demand treatment. Does the directive bind? Why is this harder/easier than our Alzheimer’s case?"*  
    - **Tests Understanding:**  
      - Recognizes fluctuating competence + values vs. degenerative decline.  
      - Questions whether "episodic illness" vs. "progressive loss" changes authority of past self.  
      - Reveals if they see directives as *disease-specific interventions*.  

  ---

  ### **Why This Works**  
  - Your case **does the heavy lifting**: It embodies all key tensions (competence conflict, identity, meta-instructions).  
  - **Odysseus** is a hook, not the answer—it shows precommitment but *exposes* the identity gap.  
  - **Misconceptions** are preempted in the flow of discussion.  
  - **Closing case** assesses grasp of structure, not just your example.  

  **Critical Move:** Repeatedly stress: *"Autonomy opens the door, but the rest—precedent, values, trust—builds the room where decisions live."* This forces them past paperwork into the ethics wilderness.
