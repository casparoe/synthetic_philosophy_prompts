prompt: |-
  You are a philosopher of economics and social choice serving as rapporteur for an adversarial collaboration between two camps in the debate over interpersonal utility comparisons. Camp O, the ordinalist and no-fact camp, holds that utility is at most an ordinal representation of individual preference, that interpersonal comparisons of utility have no truth-apt content beyond convention, and that distributive evaluation should proceed with ordinal preferences plus independent principles of justice. Camp C, the comparabilist camp, holds that at least some interpersonal comparisons are truth-apt and practically indispensable: we can meaningfully say that one person's pain is more intense than another's, or that one life contains more welfare than another, and any adequate theory of distributive justice must use such comparisons. The two camps have spent a year arguing past each other. Your task is to draft the joint statement they could both sign after a good-faith collaboration. Think carefully and begin by brainstorming the points of genuine agreement and the possible sources of merely verbal dispute; then write the document.

  The document should contain three parts. First, a numbered section of agreed claims, each formulated so that neither side would object, covering what utility is, what measurement requires, the distinctions between ordinal, level, and unit comparability and between narrow comparability of a single dimension and wide all-things-considered comparability of lives, what social choice can and cannot do without comparability, and what each side concedes about the other's strongest examples. Second, a disagreements table with columns for the crux, Camp O's position in wording its own members would accept, Camp C's position in wording its own members would accept, and the type of disagreement, whether factual, conceptual, normative, or verbal. Third, for each crux, a concrete case, argument, or experimental result that both sides agree would bear on it, together with each side's advance prediction about what it would show. Aim for precision rather than diplomacy: where a disagreement is merely verbal, say so and explain what is really at stake; where it is substantive, make the residual disagreement exact.

  As the focus for at least two of the cruxes, use the following newly proposed procedure, which neither camp has seen before: the Common Ladder Protocol. In it, participants first undergo a training module in which they learn to place a set of calibrated sensory and emotional experiences, such as mild hunger, a stubbed toe, the distress of a broken friendship, and the relief of a resolved debt, on a single 0-to-100 ladder. They are then asked to place their own current experience, and the current experience of a partner, on the same ladder, and to revise placements after seeing the partner's placement. The protocol yields, for each participant, a claim about how their experience compares with another's. A policy analyst proposes using the resulting numbers as interpersonal utility comparisons for distributive decisions. Neither camp may dismiss the protocol as irrelevant, and neither may treat it as obviously decisive. Instead, the joint statement should say what each camp would predict about its results, what each would accept as a failure of the protocol, and whether the protocol, if it worked, would settle any of the deeper disagreements or only relocate them. You may add further crux cases if needed, but do not rely on citations, reading lists, or named literature; write as if the two camps are in the room and the only resources are the arguments and cases you can set out explicitly. Keep the prose polished and the document usable as a template for other adversarial collaborations.
reasoning: |-
  We are drafting a joint statement for an adversarial collaboration between two camps: Camp O (ordinalist, no-fact) and Camp C (comparabilist). The goal is to find common ground and clarify disagreements.

  First, we brainstorm points of agreement and possible verbal disputes.

  **Points of Agreement:**
  1. **Utility as representation of preference:** Both agree that utility functions, at minimum, represent an individual's ordinal preferences (i.e., they indicate whether one bundle is preferred to another, but not by how much). They also agree that utility functions are not directly observable mental states but are constructed from choice behavior.
  2. **Measurement requirements:** Both agree that for utility to be measurable in a stronger sense (e.g., cardinal, ratio scale), specific conditions must be met (e.g., von Neumann-Morgenstern axioms for expected utility, or ratio-scale assumptions like in the case of just noticeable differences). Without such conditions, only ordinal measurement is possible.
  3. **Distinctions in comparability:** Both can agree on the conceptual distinctions between:
     - Ordinal comparability: Only the order of utilities is meaningful (no levels or units).
     - Level comparability: The absolute levels of utility are comparable (e.g., we can say person A has higher utility than person B).
     - Unit comparability: The ratios of utility differences are comparable (e.g., the difference in utility between x and y for A is twice that for B between z and w).
     - Narrow vs. wide comparability: Narrow comparability might be about a single dimension (e.g., pain intensity), while wide comparability is about overall welfare (all things considered).
  4. **Social choice without comparability:** Both agree that without interpersonal comparisons, social choice can still proceed using only ordinal non-comparable utilities (e.g., Pareto efficiency, Condorcet voting) but that such approaches are limited (e.g., they cannot resolve trade-offs in distributive justice without additional principles).
  5. **Concessions:**
     - Camp O concedes that in some narrow domains (e.g., physical pain intensity), there might be a basis for comparison because of shared physiology, but they doubt this extends to overall welfare.
     - Camp C concedes that not all comparisons are equally robust and that in many cases, we lack direct access to others' experiences, so we must rely on indirect evidence.

  **Possible Verbal Disputes:**
  - What counts as "truth-apt": Camp O might argue that only statements that can be verified by choice behavior are truth-apt, while Camp C might include introspective reports or neural correlates.
  - What "utility" refers to: Camp O often defines utility solely in terms of preference, while Camp C might include an experiential component (e.g., hedonic utility).

  Now, we structure the document:

  **Part I: Agreed Claims**

  1. **Definition of Utility:** Utility is a mathematical representation of an agent's preferences. For any individual, a utility function assigns numbers to outcomes such that higher numbers correspond to more preferred outcomes. The representation is unique only up to increasing transformations (ordinal scale) without additional assumptions.

  2. **Measurement Requirements:** For utility to be measurable on an interval or ratio scale, specific axioms must hold (e.g., independence axioms for expected utility, or conditions for difference measurement). Without such axioms, only ordinal measurement is justified.

  3. **Types of Comparability:** 
     - Ordinal comparability: Only the ranking of utility levels between individuals is meaningful.
     - Level comparability: The absolute utility levels of different individuals can be compared (e.g., "Person A is better off than person B").
     - Unit comparability: The ratios of utility differences between individuals are meaningful (e.g., "The improvement in utility from policy X for A is twice that for B").
     - Narrow comparability: Comparisons are restricted to a specific dimension (e.g., pain, income) and may be based on shared physiological or empirical indicators.
     - Wide comparability: Comparisons encompass overall well-being or life satisfaction, which may involve multiple dimensions and require aggregation.

  4. **Social Choice without Interpersonal Comparisons:** Without interpersonal utility comparisons, social choice can rely on:
     - Pareto criteria: If one option is preferred by all, it is better.
     - Ordinal voting methods: e.g., majority rule.
     - Principles of justice: e.g., Rawlsian maximin, which uses ordinal rankings and a veil of ignorance without requiring cardinal utility comparisons.
     However, without interpersonal comparisons, we cannot resolve many distributive conflicts (e.g., when one person gains and another loses) without introducing non-utility information or principles.

  5. **Concessions:**
     - Camp O acknowledges that in specific, narrow contexts (e.g., comparing physical pain using objective measures like nociception), there might be a factual basis for interpersonal comparisons. However, they maintain that such comparisons are not possible for overall welfare.
     - Camp C acknowledges that interpersonal comparisons are often difficult and that in practice, we must rely on conventions (e.g., using income as a proxy) when direct evidence is lacking. They also accept that for some comparisons, there might be no unique correct answer.

  **Part II: Disagreements Table**

  We identify three cruxes. At least two involve the Common Ladder Protocol.

  | Crux | Camp O Position | Camp C Position | Type of Disagreement |
  |------|-----------------|-----------------|----------------------|
  | 1. **Truth-aptness of interpersonal comparisons of overall welfare (wide comparability):** Can we make truth-apt statements comparing the overall well-being of two individuals? | Camp O: Statements about interpersonal comparisons of overall welfare are not truth-apt. They are at best conventional or express attitudes. No fact of the matter exists beyond what is implied by the individuals' preferences. | Camp C: Statements about interpersonal comparisons of overall welfare can be truth-apt. They are grounded in the individuals' experiences and can be supported by evidence (e.g., behavioral, neurophysiological, or introspective). | Conceptual and factual. Disagreement over what constitutes a fact (e.g., whether experience can be compared) and what utility refers to. |
  | 2. **The Common Ladder Protocol (CLP):** What would the CLP measure, and what would its results imply? | Camp O: The CLP would measure participants' expressed conventions or attitudes about comparison, not objective facts. They predict that after training, participants will be able to assign numbers, but there will be high inter-participant variation and inconsistency (e.g., when revising). They also predict that the same internal state might be assigned different numbers by different participants, showing that the scale is arbitrary. Failure: If participants cannot converge or show high inconsistency. | Camp C: The CLP would capture a shared understanding of the intensity of experiences. They predict that participants will show inter-subjective agreement (e.g., similar placements for calibrated experiences) and that revisions after seeing a partner's placement would lead to convergence. Failure: If there is no convergence and no pattern in the placements (e.g., random assignments). | Factual and conceptual. Disagreement over whether the protocol reveals a shared scale or merely conventions. |
  | 3. **Indispensability of interpersonal comparisons for distributive justice:** Must a theory of distributive justice rely on interpersonal utility comparisons? | Camp O: Distributive justice does not require interpersonal utility comparisons. Principles of justice (e.g., priority to the worst-off defined by primary goods, capabilities, or resources) can be based on non-utility information. Utility comparisons are dispensable. | Camp C: Interpersonal utility comparisons are indispensable for distributive justice because without them, we cannot make the necessary trade-offs (e.g., when helping one person harms another). Any adequate theory must use such comparisons, at least in principle. | Normative and conceptual. Disagreement over what justice requires and the role of utility. |

  **Part III: Concrete Cases and Predictions for Cruxes**

  1. **Crux 1: Truth-aptness of wide comparability**
     - **Concrete case:** Consider two individuals: Alice, who has chronic pain but is cheerful, and Bob, who has moderate pain but is depressed. We have full access to their brain scans, behavior, and self-reports. Can we say whether Alice or Bob has higher overall welfare?
     - **Camp O prediction:** Even with all data, we cannot make a truth-apt comparison because welfare is multifaceted and there is no unique way to aggregate. The question has no answer.
     - **Camp C prediction:** With sufficient data (e.g., neural correlates of pain and mood, self-reports, functional abilities), we can make a justified comparison. It might be difficult, but it is in principle possible.
     - **Bearing on crux:** If, in such cases, we find that different methods (e.g., self-report vs. neural) converge, Camp C would see it as evidence for truth-aptness. Camp O would argue that convergence might reflect shared conventions or coincidental mapping.

  2. **Crux 2: Common Ladder Protocol (CLP)**
     - **Protocol description:** Participants are trained on placing calibrated experiences (e.g., mild hunger = 20, stubbed toe = 40, broken friendship = 70) on a 0-100 ladder. Then they place their own current experience and their partner's. They see each other's placements and revise.
     - **Camp O prediction:** 
       - Participants will show high variability in initial placements of calibrated experiences, indicating subjective scaling.
       - When placing their own and partner's state, there will be systematic biases (e.g., egocentric bias).
       - Revisions after seeing the partner's placement will not converge to a common scale but might show accommodation without true agreement.
       - Failure condition: High inter-subject variance in calibrated placements (e.g., standard deviation > 15 points for the same experience) and lack of convergence in revisions (e.g., less than 50% of pairs converge within 10 points).
     - **Camp C prediction:**
       - Participants will show high agreement in calibrated experience placements (low variance).
       - Initial placements of partner's state will be inaccurate due to limited information, but with feedback, they will converge.
       - Revisions will lead to consensus, indicating that the ladder captures a shared scale.
       - Failure condition: If there is no improvement in accuracy after feedback and no convergence.
     - **Would it settle the disagreement?** 
       - Camp O: Even if the protocol shows convergence, it only shows that people can be trained to use a convention, not that the scale corresponds to a truth-apt fact. Disagreement relocates to whether the convention reflects a fact or not.
       - Camp C: If the protocol shows convergence and the placements correlate with objective measures (e.g., pain stimuli intensity), it would support that interpersonal comparisons are possible. However, Camp C might concede that for overall welfare, the protocol might not capture all aspects.

  3. **Crux 3: Indispensability of interpersonal comparisons for distributive justice**
     - **Concrete case:** A policy must be chosen: Policy A gives 10 units of a good to a person with low resources, Policy B gives 20 units to a person with high resources. Without interpersonal comparisons, how do we decide?
     - **Camp O solution:** Use a non-utility criterion, e.g., priority to the worst-off defined by resources. So if the low-resource person is worse off, choose Policy A. No utility comparison is needed.
     - **Camp C solution:** We need to compare the utility gains. If the low-resource person gains more utility from 10 units than the high-resource person gains from 20 units, then choose A; otherwise, B. Without such a comparison, we cannot make a justified choice.
     - **Bearing on crux:** Camp O argues that we can avoid comparisons by using other principles. Camp C argues that any such principle implicitly relies on comparisons (e.g., why prioritize the worst-off? because they gain more utility from resources) and that without comparisons, we cannot justify trade-offs.

  **Final Joint Statement Draft**

  ---

  **Joint Statement: Adversarial Collaboration on Interpersonal Utility Comparisons**

  **Part I: Agreed Claims**

  1. **Utility Representation:** Utility is a mathematical tool that represents an individual's preferences. A utility function for an individual is ordinal: it ranks outcomes in order of preference, and any increasing transformation of the function represents the same preferences.

  2. **Measurement Requirements:** For utility to be measurable on a cardinal scale (e.g., interval or ratio), specific conditions must be satisfied, such as the axioms of expected utility theory for interval scales. Without such conditions, utility is only ordinally measurable.

  3. **Types of Comparability:** 
     - We distinguish between ordinal comparability (only the ranking of utility levels across individuals is meaningful), level comparability (the absolute levels can be compared), and unit comparability (the ratios of utility differences can be compared).
     - We also distinguish narrow comparability (focused on a specific dimension, such as pain intensity) from wide comparability (encompassing overall well-being).

  4. **Social Choice without Interpersonal Comparisons:** In the absence of interpersonal utility comparisons, social choice can employ:
     - Pareto principles (if one option is preferred by all, it is chosen).
     - Ordinal voting methods.
     - Principles of justice that rely on non-utility information (e.g., resources, capabilities, primary goods).
     However, without interpersonal comparisons, we cannot resolve many distributive conflicts (e.g., when one person gains and another loses) in a way that reflects the relative gains and losses.

  5. **Concessions:**
     - Camp O acknowledges that in narrow domains with shared physiological bases (e.g., physical pain), there may be a basis for interpersonal comparisons, but this does not extend to overall welfare.
     - Camp C acknowledges that interpersonal comparisons of overall welfare are often difficult and may require conventions in practice. They also accept that some comparisons might be indeterminate.

  **Part II: Disagreements**

  The remaining disagreements are summarized in the table below:

  | Crux | Camp O Position | Camp C Position | Type of Disagreement |
  |------|-----------------|-----------------|----------------------|
  | 1. **Truth-aptness of wide interpersonal comparisons:** Can we make true or false statements comparing the overall well-being of two individuals? | "Statements comparing overall well-being across individuals are not truth-apt; they express conventions or attitudes without a factual basis." | "Statements comparing overall well-being across individuals can be truth-apt; they can be supported by evidence from experience, behavior, and science." | Conceptual and factual. |
  | 2. **The Common Ladder Protocol (CLP):** What would the CLP show, and what would it imply? | "The CLP would show that participants can be trained to use a common convention, but the numbers assigned do not correspond to any objective scale. Failure: high inter-participant variation in calibrated experiences and lack of convergence in revisions." | "The CLP would show that participants can learn to make interpersonally comparable assessments of experience. Failure: no convergence and no correlation with any objective measures." | Factual and conceptual. |
  | 3. **Indispensability of interpersonal comparisons for distributive justice:** Must a theory of distributive justice rely on interpersonal utility comparisons? | "Distributive justice does not require interpersonal utility comparisons; it can be based on non-utility principles (e.g., resource equality, priority to the worst-off in terms of primary goods)." | "Interpersonal utility comparisons are indispensable for distributive justice; without them, we cannot make reasoned trade-offs between individuals' gains and losses." | Normative and conceptual. |

  **Part III: Cases and Predictions**

  1. **Crux 1: Truth-aptness of wide interpersonal comparisons**
     - **Case:** Alice (chronic pain but cheerful) and Bob (moderate pain but depressed), with full data (neural, behavioral, self-reports).
     - **Camp O prediction:** No convergence on a single comparison; different methods (e.g., self-report vs. neural) may conflict, showing indeterminacy.
     - **Camp C prediction:** With enough data, methods will converge, supporting a truth-apt comparison.
     - **Bearing:** Convergence would support Camp C; persistent divergence would support Camp O.

  2. **Crux 2: Common Ladder Protocol**
     - **Protocol:** As described, with training on calibrated experiences, then placement of self and partner, then revision.
     - **Camp O prediction:**
       - High variance in calibrated experience placements (e.g., stubbed toe placed from 30 to 60).
       - Revisions after feedback do not systematically converge (e.g., mean absolute change < 5 points, but no reduction in disagreement).
       - Failure: Standard deviation of calibrated placements > 15 points and less than 60% of pairs converge to within 10 points after revision.
     - **Camp C prediction:**
       - Low variance in calibrated placements (e.g., stubbed toe placed 40±5).
       - Revisions lead to convergence (e.g., over 80% of pairs converge to within 10 points).
       - Failure: No convergence (less than 50% within 20 points) and no correlation with independent measures (e.g., pain stimulus intensity).
     - **Would it settle?**
       - Camp O: A successful CLP would only show that a convention is possible, not that it is truth-apt. The disagreement relocates to whether the convention corresponds to a fact.
       - Camp C: A successful CLP would provide evidence for interpersonal comparability, especially if the numbers correlate with objective measures. But Camp C might accept that for overall welfare, the protocol is incomplete.

  3. **Crux 3: Indispensability for distributive justice**
     - **Case:** Policy A (10 units to low-resource person) vs. Policy B (20 units to high-resource person).
     - **Camp O solution:** Use a non-utility principle, e.g., the worst-off (by resources) gets priority, so choose A.
     - **Camp C solution:** We must compare the utility gains. If the low-resource person gains more utility, choose A; else, B.
     - **Bearing:** Camp O argues that we can avoid comparisons by using other principles. Camp C argues that such principles (e.g., priority to the worst-off) are justified by the assumption that they gain more utility, so comparisons are indispensable.

  **Conclusion:** This joint statement clarifies both agreement and disagreement. The Common Ladder Protocol is a focal point for empirical investigation. Both camps agree that its results would be informative, but they differ on interpretation. We recommend further research on the CLP and on the case of Alice and Bob.

  Signed: [Representatives of Camp O and Camp C]

