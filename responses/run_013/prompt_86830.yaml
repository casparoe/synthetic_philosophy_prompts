answer: |-
  ### Joint Statement: Adversarial Collaboration on Interpersonal Utility Comparisons

  #### Part I: Agreed Claims  
  1. **Utility as Preference Representation**: Utility is an ordinal representation of an individual’s preferences, defined solely by their choices. A utility function \(u_i\) for individual \(i\) is unique only up to increasing transformations (e.g., \(f(u_i)\) where \(f\) is strictly increasing). It does not inherently measure psychological intensity.  
  2. **Measurement Requirements**: For cardinal measurement (e.g., interval or ratio scales), specific axioms must hold (e.g., von Neumann-Morgenstern independence for risk, or difference comparisons for ratio scales). Absent these, only ordinal measurement is justified.  
  3. **Comparability Distinctions**:  
     - **Ordinal comparability**: Only ranks utilities (e.g., \(u_A > u_B\)).  
     - **Level comparability**: Absolute levels are comparable (e.g., \(u_A = 100\), \(u_B = 70\)).  
     - **Unit comparability**: Differences or ratios are comparable (e.g., \(u_A - u_B = 2(u_C - u_D)\)).  
     - **Narrow vs. Wide Comparability**: Narrow comparisons target single dimensions (e.g., pain intensity); wide comparisons assess all-things-considered lifetime welfare (e.g., "Person A’s life is better than Person B’s").  
  4. **Social Choice without Comparability**: Ordinal non-comparable utilities support:  
     - Pareto efficiency (if all prefer \(X\) to \(Y\), \(X\) is socially better).  
     - Voting rules (e.g., Condorcet winners under majority preferences).  
     - Principles of justice (e.g., Rawlsian maximin with primary goods).  
     However, they *cannot* resolve trade-offs where one person gains and another loses (e.g., distributing fixed resources between two individuals with no Pareto improvement).  
  5. **Concessions**:  
     - **Camp O concedes**: Narrow comparisons (e.g., acute physical pain) may have empirical bases (e.g., neurobiological correlates), but these do not extend to wide comparisons.  
     - **Camp C concedes**: Convention often supplements evidence in practice (e.g., using income as a proxy), and some comparisons lack determinate answers.  

  ---

  #### Part II: Disagreements Table  
  | Crux                                                                 | Camp O Position (Ordinalist/No-Fact)                                                                 | Camp C Position (Comparabilist)                                                                 | Type of Disagreement |  
  |----------------------------------------------------------------------|------------------------------------------------------------------------------------------------------|-------------------------------------------------------------------------------------------------|----------------------|  
  | 1. **Truth-aptness of wide interpersonal comparisons**: Are statements comparing all-things-considered welfare truth-apt? | "Wide interpersonal comparisons lack truth-apt content; they express attitudes or conventions, not facts verifiable by choice behavior." | "Wide interpersonal comparisons are truth-apt; they track experiential facts (e.g., suffering intensity) and can be justified empirically." | Conceptual + Factual |  
  | 2. **Common Ladder Protocol (CLP)**: What does the CLP measure, and what would its success imply? | "The CLP measures trained conventions, not objective utility. Success would show coordination on a shared scale, but no truth-apt comparison." | "The CLP measures intersubjectively valid utility. Success would show reliable interpersonal comparisons grounded in shared experience." | Factual (with conceptual roots) |  
  | 3. **Indispensability for distributive justice**: Must interpersonal comparisons ground distributive justice? | "Distributive justice requires no interpersonal comparisons; ordinal preferences plus principles (e.g., priority to the least advantaged) suffice." | "Interpersonal comparisons are indispensable; no theory can resolve trade-offs (e.g., helping one harms another) without comparing welfare gains/losses." | Normative + Conceptual |  

  ---

  #### Part III: Cases, Predictions, and Bearing on Cruxes  
  **Crux 1: Truth-aptness of Wide Comparisons**  
  - **Case**: Two individuals:  
    - **Alice**: Chronic back pain (self-rated 8/10 intensity) but high life satisfaction.  
    - **Bob**: Acute depression (self-rated 3/10 life satisfaction) but no physical pain.  
    We ask: "Is Alice’s overall welfare higher than Bob’s?"  
  - **Camp O Prediction**: No convergence; self-reports reflect subjective scales, not comparable units. Divergent answers (e.g., Alice says yes, Bob says no) show indeterminacy.  
  - **Camp C Prediction**: Convergent judgments possible; e.g., observers with empathy training agree Alice is better off, supporting truth-aptness.  
  - **Bearing**: Persistent divergence supports Camp O; convergence supports Camp C. Both agree divergence in self-reports alone is inconclusive.  

  **Crux 2: Common Ladder Protocol (CLP)**  
  - **Protocol**: Participants train by placing calibrated experiences (e.g., stubbed toe = 40, broken friendship = 75) on a 0–100 ladder. They then place their own current state and a partner’s (with revision after feedback).  
  - **Camp O Prediction**:  
    - Results: High inter-participant variance for calibrated items (e.g., stubbed toe placed between 30–60). Revisions reduce disagreement but leave residual arbitrariness (e.g., post-revision SD > 15 points).  
    - Failure: Inability to converge below a 20-point SD for calibrated items.  
    - Implication: Shows convention, not truth; scaling remains ordinal.  
  - **Camp C Prediction**:  
    - Results: Low variance for calibrated items (SD < 10 points). Revisions converge (e.g., 80% of pairs agree within 10 points).  
    - Failure: Variance remains high post-revision or placements contradict objective markers (e.g., higher pain stimuli rated lower).  
    - Implication: Supports interpersonal comparability, especially if ladder scores correlate with physiological data (e.g., cortisol levels).  
  - **Would it settle deeper disagreements?**  
    - **Camp O**: No. Success shows only coordination, not truth. Disagreement relocates to whether conventions track facts.  
    - **Camp C**: Partially. Success would rebut Camp O’s claim that comparisons are *impossible*, but wide comparability requires further evidence.  

  **Crux 3: Indispensability for Distributive Justice**  
  - **Case**: A hospital allocates a painkiller dose:  
    - **Policy A**: Gives 10 units to **Patient X** (chronic pain, low resilience).  
    - **Policy B**: Gives 10 units to **Patient Y** (acute pain, high resilience).  
    Assume no Pareto improvement: X prefers A, Y prefers B.  
  - **Camp O Solution**: Use non-comparative justice (e.g., "prioritize worst-off by medical need"). No utility comparison required.  
  - **Camp C Solution**: Compare welfare gains (e.g., "X’s pain reduction is larger than Y’s"). Absent this, no justified choice.  
  - **Bearing**: Camp O argues principles like "need" avoid comparisons; Camp C contends such principles implicitly assume comparable welfare impacts (e.g., "need" reflects capacity for utility gain).  

  ---

  **Conclusion**  
  This collaboration clarifies three types of disagreement:  
  1. **Conceptual** (e.g., "utility" vs. "welfare"): Camp O restricts utility to choice; Camp C includes experience.  
  2. **Factual** (e.g., CLP outcomes): Testable predictions exist.  
  3. **Normative** (e.g., justice requirements): Irreducible without shared meta-ethics.  
  The CLP serves as a focal point: its failure would challenge Camp C; its success would challenge Camp O’s "no fact" stance but not resolve wider debates. Both camps endorse further empirical work on the CLP and narrow comparisons.  

  ---  
