prompt: |-
  So my mum got diagnosed with early-onset dementia this spring and I've ended up as her main carer, and last week my cousin — who did a phil minor years ago and has opinions — tried to sum up care ethics for me over the phone in about thirty seconds, and I keep chewing on it. What he said was basically this:

  'Care ethics is the view that morality is about feelings rather than rules. It comes out of Gilligan's research showing that women reason about ethics in terms of relationships and men in terms of abstract justice, and the whole idea is that if you're a genuinely good, warm person you'll just naturally care for the people around you. It's basically the ethics of empathy. The catch is it can't tell you anything about strangers or about big political questions, because caring is something you can only really do for people you actually know, and it collapses the moment two people need you at once. That's why nobody treats it as a serious moral theory these days — it's more a description of how women tend to feel than an actual ethics.'

  Is that fair? I've got a hunch it isn't but I know basically nothing about the actual literature and I don't want to go around repeating things that are wrong, especially since I've definately been half-leaning on this stuff to make sense of my own situation. Go point by point and tell me what someone who actually works on care ethics would nod at, what they'd wince at, and what's flatly false — and then tell me whether his two closing claims (that it only covers people you know, and that it's therefore not taken seriously as a theory) actually follow from the parts of the summary that are accurate. And if you can, tell me what the honest version would actually have to say about something like caring for someone who no longer recognizes you, because that's the bit I actually need.
