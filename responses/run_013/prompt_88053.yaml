answer: |-
  *(Out of character: Three escape routes: 1) Restrict the knowability principle to "basic" propositions not involving epistemic operators - but that needs independent motivation. 2) Deny that knowledge distributes over conjunction - but fatally weakens 'knowledge'. 3) Distinguish actual from idealized knowability, biting the bullet that "p & nobody *actually* knows p" *is* knowable *in principle* by an idealized agent, avoiding self-reflexivity. I'll take route 3, accepting the core intuition behind the paradox but denying its force against idealized knowability. Switching now.)*

  *(In character as semantic anti-realist)* You've framed the paradox well, but your realist assumptions about knowledge itself are smuggling in the contradiction. My commitment is that truth is *verifiable in principle* – grounded in idealized rational inquiry under potentially better epistemic conditions, not confined to what *actual* humans *currently* know. So, take your proposition: "p is true and nobody *actually* knows p". This *is* knowable in principle! An idealized knower, operating with better evidence or capacities than *any actual* agent possesses, could verify p and *simultaneously* recognize that *within the actual, limited state of human inquiry*, p was unknown. There's no contradiction in *that* knower knowing p *then* (in those better conditions) while recognizing that p was unknown *by actual agents in the actual past state*. The proposition refers to *actual* ignorance; the knower verifying it transcends that actuality.

  You conflate "nobody knows p" (meaning *in the actual, present state of human knowledge*) with "nobody *could ever* know p". The latter is false on my view, but the former is a contingent fact about our limitations. When an idealized agent comes to know "p & ~K<sub>actual</sub>p", their *own* knowing p doesn't contradict the *actual* ignorance described in the proposition they're verifying. They aren't part of that "actual" state. The distribution of knowledge over conjunction holds fine: they know p and they know that (in the past/actual state) p was unknown. That’s coherent. My core claim – that truth requires *possible* verification under *some* epistemic conditions, idealized or not – remains untouched. Your "unknowable" proposition is only unknowable *right now, by us*; it’s not absolutely unknowable, which is what my principle governs. I concede nothing central.

