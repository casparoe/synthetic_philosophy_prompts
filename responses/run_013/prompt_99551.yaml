prompt: |-
  I am a compiler engineer by trade, and for about a year now I have been moonlighting on a question in the semantics of conditionals that began as a nuisance in a configuration language I maintain and has since turned into something I have to defend in public. Next month I am giving a short paper at a graduate workshop that sits at the boundary between formal semantics and philosophy of language, and I am far less worried about delivering the talk than about the discussion that follows it. The room will be about a dozen people, and I can already picture them: three or four formal semanticists who handle modality in the Kratzer style and think in terms of ordering sources and conversational backgrounds; two or three philosophers of language who work on the Ramsey test and on the probabilities of conditionals and who will immediately want to know what my account does about the triviality results; one or two people who defend a broadly Stalnaker-and-Lewis possible-worlds treatment and treat counterfactuals as quantifying over worlds ranked by comparative similarity; and a few generalists who will ask the embarrassingly basic question I will not have a crisp answer for. None of them works on my exact topic, but every one of them can smell a naive unification claim from across the room.

  Here is the thesis I intend to defend, stated plainly. I claim that indicative and counterfactual conditionals share a single semantic core — one two-place operator ranging over a set of possibilities — and that the whole felt difference between "if" and "would" is a pragmatic overlay carried by a condition I call epistemic liveness. An indicative antecedent is presented as live: it has not been excluded by the conversation's common ground. A counterfactual antecedent is presented as dead: the common ground already settles against it. On my story, the past-tense morphology in the counterfactual is a conventional marker of that deadness rather than a device for shifting the time of evaluation, and the apparent difference in modal scope — counterfactuals seeming to reach worlds unlike the actual one, indicatives seeming to stay within what we know — is derived from liveness together with the same ordering source, not stipulated as a separate mechanism. The example I keep leaning on, and that I want you to stress-test, is a coin already flipped but not yet revealed: I want to say that "If it came up heads, you win" and "If it had come up heads, you would have won" differ only in whether the antecedent is treated as live, and that a hearer who does not yet know the outcome sits awkwardly between the two — which is exactly where I suspect the account is softest.

  I would like you to act as a professional semanticist who has refereed in this area for years, think carefully before writing, and begin by brainstorming the pressure points you would probe if you were in that room. Then draft me a Q&A prep sheet rather than a defense of my view: the eight or so objections I will actually get from this particular audience — not the ones I would get from a logic seminar or from a computer science audience — ordered by how likely and how damaging each is, each phrased the way the person most likely to raise it would phrase it, with a two-minute spoken reply and an honest note on where that reply is weakest and what I should concede up front. Flag any objection that turns on a commitment I may not realize my thesis carries, tell me the weakest point in my own position that I should prepare to defend rather than hope nobody notices, and finish with the one question I am dreading and have no good answer to.
reasoning: |-
  We are preparing for a workshop Q&A session. The audience consists of formal semanticists (Kratzer-style modality), philosophers of language (Ramsey test, triviality results), Stalnaker-Lewis proponents, and generalists. The thesis: one semantic core for both indicative and counterfactual conditionals, with the difference being pragmatic (epistemic liveness). The key example: a flipped but unrevealed coin.

  Brainstorming pressure points:

  1. **Common ground and epistemic liveness**: How exactly is liveness defined? Is it a binary property? What about cases where the common ground is not fully settled? (Likely from the Kratzer camp, who think in terms of ordering sources and might see liveness as too coarse.)

  2. **The role of the past tense**: In the counterfactual, the past tense is claimed to be a marker of deadness, not a temporal shift. But what about examples where the antecedent is about the past and the counterfactual uses a past perfect? (Stalnaker-Lewis proponents might point to the temporal morphology as evidence for a world-shifting device.)

  3. **The Ramsey test and triviality results**: How does this account handle the probabilities of conditionals? If the conditional has the same core meaning, why do indicatives and counterfactuals behave differently under probability assignments? (Philosophers of language, e.g., Lewis's triviality results.)

  4. **Comparative similarity and ordering sources**: The account claims that the same ordering source is used for both, but then how do we explain the felt difference in modal force? Counterfactuals seem to require more remote worlds. (Stalnaker-Lewis and Kratzer camps.)

  5. **The coin flip example**: The account says that the hearer who doesn't know the outcome is in an awkward position. But what does the theory predict they would say? And what about the fact that in such a scenario, we can naturally use either form? (Generalists and all.)

  6. **Pragmatic overlay**: How is the liveness condition integrated into the semantics-pragmatics interface? Is it a presupposition? An implicature? And how does it project? (Formal semanticists.)

  7. **Unification claims**: The thesis unifies indicatives and counterfactuals. But what about mixed cases? For example, "If it had rained yesterday, the garden is wet now" – which is odd. How does the account explain the restrictions? (All, but especially Stalnaker-Lewis.)

  8. **Epistemic modals and conditionals**: How does liveness interact with modals in the antecedent or consequent? For instance, "If it might be raining, ..." – which is tricky for indicatives. (Kratzer camp.)

  9. **The scope of 'if'**: The account uses a two-place operator. But what about nested conditionals or conditionals under quantifiers? Does the liveness condition apply recursively? (Formal semanticists.)

  10. **The problem of known falsehoods**: In the coin flip, if the speaker knows it's tails but the hearer doesn't, what does the speaker use? And what if the speaker is mistaken? (Philosophers and generalists.)

  Now, we'll draft a Q&A prep sheet with the 8 most likely and damaging objections, ordered by severity and likelihood.

  ---

  **Q&A Prep Sheet for Workshop Defense**

  **Objection 1 (From a philosopher of language, on triviality):**  
  "Your account posits a single semantic core for both indicative and counterfactual conditionals. But we know from Lewis's triviality results that conditionals cannot be propositions with truth conditions and also obey the Ramsey test for conditional probability. If both types of conditionals have the same core, how do you explain that indicatives are often thought to be non-truth-conditional (following Adams) while counterfactuals are typically given truth conditions? Doesn't your unification force you into a position that either collapses under triviality or abandons the Ramsey test?"

  * **Your two-minute reply:**  
    "Thank you for that. I am aware of the triviality results and take them seriously. In my account, the semantic core is truth-conditional: it's a two-place operator that quantifies over a set of possibilities. However, the Ramsey test is a pragmatic principle about how we assess conditionals in context. For indicatives, the set of possibilities is restricted to the live ones, so the probability of the conditional is the conditional probability given the live possibilities. For counterfactuals, the set expands to include dead possibilities, but then we use an ordering source to focus on the most similar ones. Thus, the same core operator can be assessed differently under probability without violating triviality because the domain of quantification shifts between indicatives and counterfactuals. The shift is triggered by the liveness condition, which is pragmatic."

  * **Weakness in reply:**  
    This doesn't fully engage with the depth of the triviality results. Lewis showed that no single operator can satisfy both the probability conditional (Adams' thesis) and truth conditions without collapsing the probability space. By making the domain shift, we might avoid collapse, but then the Ramsey test must be redefined for counterfactuals. The reply might be seen as hand-waving.

  * **What to concede:**  
    Admit that the account might require a dual theory of probability for conditionals, and that further work is needed to formalize the probability of counterfactuals.

  **Objection 2 (From a Stalnaker-Lewis proponent, on modal force):**  
  "You claim that the same ordering source is used for both indicatives and counterfactuals, but counterfactuals clearly involve a more stringent selection of worlds. In fact, they often require worlds that are more remote from actuality. How can you derive this from liveness alone? And what about the past tense? In your coin example, 'if it came up heads' uses the past tense but is indicative. Doesn't that past tense already signal a shift to a different temporal perspective, which in counterfactuals becomes a shift to a different modal perspective?"

  * **Your two-minute reply:**  
    "The key is that the ordering source remains the same, but the domain over which it operates changes. For indicatives, we only consider worlds in the common ground (live possibilities). For counterfactuals, we consider worlds outside the common ground (dead possibilities), and the ordering source selects the closest ones. So the modal force difference is due to the fact that counterfactuals require stepping outside what's settled. Regarding the past tense: in the indicative 'if it came up heads', the past tense is purely temporal, indicating the flip happened in the past. In the counterfactual 'if it had come up heads', the past perfect is a conventional marker of epistemic deadness. We see this because in languages without tense morphology, counterfactuality is marked differently. The coin example shows that the same temporal situation can take either form depending on liveness, not tense."

  * **Weakness in reply:**  
    The reply might not convince those who see tense as inherently modal. The example of languages without tense is good, but the objection about the past tense in the indicative being non-modal is valid. Also, the claim that the ordering source is the same might be challenged: counterfactuals often use a different kind of ordering (e.g., causal or historical) than indicatives (epistemic). 

  * **What to concede:**  
    Concede that the ordering source might be parameterized differently in practice, but maintain that the mechanism is the same.

  **Objection 3 (From a Kratzer-style semanticist, on common ground dynamics):**  
  "Your notion of 'epistemic liveness' is tied to the common ground. But the common ground is dynamic and can be updated during the conversation. How does your account handle conditionals that are used to propose updates? For example, 'If it's raining, the party is canceled' – this might be used to add the conditional to the common ground. And what about conditionals with epistemic modals in the antecedent, like 'If it might be raining, ...' which are infelicitous? How does liveness interact with such modals?"

  * **Your two-minute reply:**  
    "Liveness is determined relative to the current common ground at the time of utterance. When a conditional is used to propose an update, the antecedent is presented as live relative to the common ground at that moment. For modals in the antecedent: 'if it might be raining' is problematic because the antecedent must be a proposition that can be live or dead. Epistemic modals in the antecedent are evaluated relative to the common ground, and if the common ground already settles that it might be raining (which it always does, unless we have complete information), then the antecedent is always true and the conditional is trivial. This explains the infelicity. In my account, the antecedent must be a non-modal proposition to be assessable for liveness."

  * **Weakness in reply:**  
    This doesn't address the dynamics of common ground update during a conversation. Also, the explanation for modal antecedents might be too simplistic. Kratzer's framework allows for modal antecedents by using a modal base, but here we are forbidding them.

  * **What to concede:**  
    Admit that the account currently assumes a static common ground and that a full dynamic implementation is needed.

  **Objection 4 (From a philosopher, on the coin flip):**  
  "In your coin flip example, the coin has been flipped but not revealed. You say that the speaker must use the indicative if treating the antecedent as live and the counterfactual if dead. But what if the speaker doesn't know? And what about the hearer? If the speaker knows it's tails but the hearer doesn't, the speaker might say 'if it had come up heads' to signal deadness. But then the hearer, for whom it might be live, would find this odd. How does your account handle such asymmetries?"

  * **Your two-minute reply:**  
    "The liveness condition is speaker-oriented. The speaker chooses the form based on what they take the common ground to be. In the case where the speaker knows it's tails, they mark the antecedent as dead and use the counterfactual. The hearer, if they don't know, might be surprised and update their beliefs accordingly. The awkwardness you note is real and reflects the tension between the speaker's and hearer's epistemic states. This is a case where the common ground is not fully shared, and the conditional form can signal the speaker's perspective."

  * **Weakness in reply:**  
    This makes the account speaker-centric, but the common ground is typically defined as mutual knowledge. If the speaker knows it's tails but the hearer doesn't, the common ground might not yet exclude heads. Then the antecedent should be live, but the speaker is treating it as dead. This violates the definition of common ground.

  * **What to concede:**  
    Concede that the account needs to clarify whether liveness is relative to the speaker's beliefs or the common ground. It is intended to be the common ground, but in practice, speakers can have private knowledge.

  **Objection 5 (From a Stalnaker-Lewis proponent, on mixed cases):**  
  "Consider a mixed conditional: 'If it had rained yesterday, the garden is wet now.' This is odd. In a Stalnaker-Lewis account, this is explained by the mismatch in time: the antecedent shifts the world to one where it rained yesterday, but the consequent is evaluated in that world at the present. Your account doesn't have world shifting, so how do you explain the infelicity? And how do you handle conditionals that mix past and present?"

  * **Your two-minute reply:**  
    "The infelicity arises because the counterfactual marker (the past perfect) signals that the antecedent is dead, meaning the common ground has excluded rain yesterday. Then the consequent is evaluated in the present, but the antecedent's deadness requires us to consider worlds where it rained yesterday, which may be far from actuality. The mismatch occurs because the present consequent in such worlds might depend on other factors (e.g., whether the garden was covered). The indicative form would be used for live antecedents about the past, e.g., 'if it rained yesterday, the garden is wet'. The mixed form is odd because the deadness marker forces a historical departure, but the present tense in the consequent suggests we are still in the actual world."

  * **Weakness in reply:**  
    This explanation is vague and doesn't provide a formal mechanism. Stalnaker-Lewis accounts have a clear world-shifting mechanism that explains the temporal mismatch.

  * **What to concede:**  
    Concede that the account needs more work on tense and modality interactions.

  **Objection 6 (From a generalist, on the core operator):**  
  "You say there's a single two-place operator. But conditionals can be embedded, e.g., under quantifiers: 'Every time the coin is flipped, if it lands heads, you win.' And also in conditionals like 'If if it rains the match is canceled, then we should stay home'. How does your operator handle such cases? And does the liveness condition apply at every level?"

  * **Your two-minute reply:**  
    "The two-place operator is the basic building block. When embedded under quantifiers, the operator is evaluated relative to the possibilities introduced by the quantifier. For iterated conditionals, the liveness condition applies to the outermost conditional first. The antecedent of the outer conditional is itself a conditional, so its liveness is determined by whether the common ground includes or excludes the truth of that embedded conditional. But note that embedded conditionals are rare and often rephrased, so the theory can treat them as special cases."

  * **Weakness in reply:**  
    The account hasn't been developed for embedding, and the reply is sketchy. Also, the liveness condition might not project compositionally.

  * **What to concede:**  
    Admit that embedding is an area for future work.

  **Objection 7 (From a Kratzer-style semanticist, on ordering sources):**  
  "You claim the same ordering source is used for both indicatives and counterfactuals. But in counterfactuals, the ordering source is often stereotypical or based on normal course of events, while for indicatives it's purely epistemic. How can the same ordering source serve both? And in the coin flip, what is the ordering source?"

  * **Your two-minute reply:**  
    "The ordering source is contextually determined and can vary. In the coin flip, for the indicative, we use an epistemic ordering source that respects the common ground. For the counterfactual, we also use an ordering source that respects the common ground except for the antecedent, and then orders by similarity. The difference is not in the type of ordering source but in the domain: for counterfactuals, we are allowed to consider worlds that violate the common ground. The ordering source then selects the closest such worlds."

  * **Weakness in reply:**  
    This might not account for cases where counterfactuals require a different kind of ordering (e.g., causal laws) that are not active in indicatives.

  * **What to concede:**  
    Concede that the ordering source might be contextually richer for counterfactuals, but the mechanism of ordering is the same.

  **Objection 8 (The dreaded question, from a philosopher of language):**  
  "Your account relies heavily on the common ground. But what is the common ground? If it's defined as the set of possibilities not excluded by mutual knowledge, then in the coin flip scenario, before the reveal, the common ground includes both heads and tails. So 'if it came up heads' is live and indicative. After the reveal, it's dead and counterfactual. But what if the common ground is vague? For instance, if we know the coin is biased but don't know how, then the common ground doesn't exclude heads, but it doesn't give it full support either. Can an antecedent be partially live? And if not, how do you explain the gradient judgments we have about conditionals?"

  * **Your two-minute reply (struggling):**  
    "The common ground is a set of worlds, so it's all-or-nothing: a proposition is live if it overlaps with the common ground. But we can have a graded notion of epistemic commitment. In the biased coin case, the antecedent is still live because it hasn't been excluded. The gradient judgments might come from the ordering source: we can rank the live worlds by probability, so the conditional might be evaluated with a focus on the higher-probability worlds. But for the core semantics, liveness is binary."

  * **Weakness in reply:**  
    This is the weakest point. The binary notion of liveness seems inadequate for graded contexts. The account might need to incorporate probabilistic common grounds, which would complicate the picture.

  * **What to concede:**  
    This is the hard one. Concede that the binary liveness condition is a simplification and that incorporating degrees of belief is a major challenge for the account.

  **The Weakest Point in Your Position:**  
  The coin flip scenario when the common ground is probabilistic (e.g., biased coin) or when there is asymmetric information. The binary notion of liveness does not capture the nuances, and the theory currently lacks a probabilistic component. This is the point to prepare to defend by admitting it's a limitation and suggesting future work on probabilistic common grounds.

  **The Dreaded Question (already covered in Objection 8):**  
  The gradience of liveness and the probabilistic cases.

  **Summary of Q&A Prep:**  
  We have ordered the objections by how damaging they are and how likely. The triviality results (Objection 1) and the probabilistic common ground (Objection 8) are the most damaging. The coin flip asymmetry (Objection 4) and the mixed conditionals (Objection 5) are also critical. Make sure to be humble and open about the limitations.
answer: |-
  Below is a Q&A prep sheet tailored to your workshop context. I've drawn on the audience composition you described (Kratzer-style semanticists, Ramsey-focused philosophers, Stalnaker-Lewis adherents, and generalists) to identify the 8 most likely and damaging objections. These are ordered by **combined likelihood and severity**, with #1 being the highest-stakes critique. For each, I provide:  
  - **Objection phrased as the critic would** (capturing their jargon and perspective).  
  - **Your 2-minute spoken reply** (concise, defense-oriented but not evasive).  
  - **Where the reply is weakest** (honest self-critique).  
  - **What to concede** (strategic retreats to preserve credibility).  

  I flag commitments your thesis may unintentionally carry and end with the "dreaded question" (spoiler: it's about probabilistic common ground). The **weakest point in your position**—binary liveness versus graded belief—is called out separately and should be pre-empted in your talk.  

  ---

  ### **Your Thesis's Unnoticed Commitments**  
  Be aware your account implicitly:  
  1. **Rejects world-shifting for tense**. By treating past-tense morphology as purely epistemic (not temporal), you deny that tense logically *must* shift evaluation time (contra Stalnaker-Lewis).  
  2. **Makes liveness speaker-centric**. Liveness is defined relative to common ground, but in practice, your examples rely on the *speaker's* epistemic state (e.g., the coin-flip case). This risks conflating common ground with individual belief.  
  3. **Requires a static common ground**. Dynamic updates (e.g., conditionals that *establish* common ground) aren't handled, which Kratzer-style accounts accommodate via conversational backgrounds.  

  ### **Weakest Point in Your Position: Prepare to Defend This**  
  **The binary nature of epistemic liveness.** Your account treats liveness as "in common ground" (live) or "excluded by common ground" (dead). But natural language often reflects *graded* beliefs (e.g., biased coins, partial evidence). You lack a story for:  
  - Why we don’t have "semi-counterfactual" morphology.  
  - How scalar probabilities (e.g., "likely if...") interact with liveness.  
  - Asymmetric knowledge (speaker knows coin is tails; hearer doesn’t).  
  **Why it’s weak**: The coin-flip example *assumes* a sharp threshold, but real contexts are fuzzy. If pressed, admit this is idealized and pivot to "liveness as a pragmatic signal of speaker commitment."  

  ---

  ### **Q&A Prep Sheet: 8 Objections and Replies**  
  **Key**: Likelihood (★) and Severity (▲) rated 1-5 (5 = highest).  

  #### **1. Objection (Philosopher of language: Triviality and Ramsey Test)**  
  **Likelihood ★★★★★ | Severity ▲▲▲▲▲**  
  *"You unify indicatives and counterfactuals under one semantic core, but Lewis/Adams triviality results show that conditionals can’t satisfy both the Ramsey test (P(if A, B) = P(B|A)) and truth-conditional semantics without collapsing probability to triviality. If both types share a core, why don’t they both fall prey to this? And how does ‘liveness’ rescue you when indicatives are Ramsey-compliant but counterfactuals aren’t?"*  

  - **Your 2-minute reply**:  
    "Thanks—this is crucial. Triviality arises if we assume conditionals express propositions *in all contexts*. My core operator is truth-conditional, but its *evaluation* is contextually restricted: for indicatives, we compute probabilities only over live possibilities (Ramsey’s P(B|A) relative to common ground). For counterfactuals, we shift to dead possibilities *plus* an ordering source, so P(if A, B) isn’t P(B|A) but P(B|closest A-worlds). The semantic core is unified, but probability assessment is pragmatically modulated by liveness. This avoids triviality because the domains diverge."  

  - **Weakness**: You implicitly deny Adams’ thesis (that indicatives lack truth conditions) without formalizing counterfactual probability. Philosophers will see this as ad hoc.  
  - **Concede upfront**: "I accept counterfactual probabilities are less settled—my account needs a generalized Ramsey test incorporating similarity."  

  ---

  #### **2. Objection (Stalnaker-Lewis adherent: Past Tense and Modal Force)**  
  **Likelihood ★★★★☆ | Severity ▲▲▲▲☆**  
  *"You claim past tense marks ‘deadness,’ not temporal shift. But in ‘If it had rained, the garden would be wet,’ the past perfect clearly references past time. Why can’t we treat this as past time with modal remoteness? And if liveness alone explains modal scope, why do counterfactuals require more ‘distant’ worlds than indicatives? Stalnaker’s similarity ordering handles this directly."*  

  - **Your 2-minute reply**:  
    "Fair—but consider languages like Chinese, where counterfactuality is marked without past tense. In your example, the past perfect signals *both* past time and deadness. My point is that deadness is primary: in my coin flip (‘if it came up heads’ vs. ‘if it had...’), the temporal facts are identical, yet morphology tracks only epistemic status. On modal force: counterfactuals *seem* distant because they access worlds outside common ground, while indicatives stay within it. The same ordering source ranks both; distance emerges from *which* worlds are in-bounds, not a distinct mechanism."  

  - **Weakness**: You can’t explain why past tense *consistently* correlates with counterfactuality in English. The "distance" intuition isn’t fully derived.  
  - **Concede upfront**: "Tense may diachronically recruit modal functions—but synchronically, it’s a conventional marker."  

  ---

  #### **3. Objection (Kratzer-style semanticist: Common Ground Dynamics)**  
  **Likelihood ★★★★☆ | Severity ▲▲▲☆☆**  
  *"Your ‘common ground’ feels static. In Kratzer’s framework, conversational backgrounds update dynamically. How does liveness handle conditionals that *expand* the common ground, like ‘If it’s raining, the match is off’? And why can’t we have epistemic modals in antecedents (‘If it might rain...’ is bad), if liveness is just pragmatic?"*  

  - **Your 2-minute reply**:  
    "Great point. Liveness is evaluated pre-utterance: the antecedent must be compatible with common ground *before* the conditional is uttered. For your example, ‘if it’s raining’ presents rain as live but unsettled—it’s a proposal to update, not a reflection of prior exclusion. On modal antecedents: ‘might’ phrases aren’t propositions, so they can’t be live/dead. Liveness requires a propositional antecedent; modals create non-propositional sets, hence infelicity. This falls out from my two-place operator."  

  - **Weakness**: You ignore cases where conditionals *themselves* modify common ground (e.g., threats: "If you leave, I’ll scream").  
  - **Concede upfront**: "I assume a stable common ground—dynamic implementations are future work."  

  ---

  #### **4. Objection (Generalist: The Coin-Flip Awkwardness)**  
  **Likelihood ★★★★☆ | Severity ▲▲▲☆☆**  
  *"In your coin flip, if the outcome isn’t known, you say speakers are ‘awkwardly between’ indicatives and counterfactuals. But people say things like ‘If it landed heads, you won—I just don’t know it yet.’ No awkwardness! Doesn’t this suggest liveness is gradient? And what stops me from saying ‘If it had landed heads, you would’ve won’ while ignorant?"*  

  - **Your 2-minute reply**:  
    "I agree it’s fluid—but note that ‘if it landed heads’ uses indicative past, signaling liveness. If you say ‘had landed’ pre-reveal, you implicate you *believe* it’s dead (e.g., you peeked). The ‘awkwardness’ is in theory-choice: the speaker must commit to presenting A as live or dead. In practice, ignorance allows indicatives because common ground hasn’t *settled* ¬A. Counterfactuals require settled exclusion."  

  - **Weakness**: People *do* use counterfactuals under ignorance (e.g., "If he had been innocent, why did he flee?"). Your reply feels stipulative.  
  - **Concede upfront**: "Liveness isn’t always clear-cut—I’m modeling an idealization."  

  ---

  #### **5. Objection (Philosopher of language: Probability Asymmetries)**  
  **Likelihood ★★★☆☆ | Severity ▲▲▲▲☆**  
  *"Indicatives and counterfactuals behave differently under probability. We assign P(if A, B) ≈ P(B|A) for indicatives, but for counterfactuals, P(if A had been, B would) is often undefined or tied to similarity. If they share a core, why the asymmetry? Doesn’t liveness just sneak in the old indicative/counterfactual split?"*  

  - **Your 2-minute reply**:  
    "The core operator doesn’t mandate identical probability behavior—it’s about truth conditions. Pragmatic factors (liveness) shape assessment. For indicatives, P(B|A) is defined over live worlds. For counterfactuals, we omit probability because dead worlds aren’t in the epistemic probability space; instead, we use similarity. This isn’t sneaking in a split: it’s deriving it from how we *access* worlds given liveness."  

  - **Weakness**: You haven’t explained why counterfactuals resist probabilistic treatment (e.g., why we don’t say "Probably, if A had been, B would").  
  - **Concede upfront**: "Counterfactual probability *is* murky—my account may need to limit Ramsey to indicatives."  

  ---

  #### **6. Objection (Stalnaker-Lewis adherent: Mixed and Future Counterfactuals)**  
  **Likelihood ★★★☆☆ | Severity ▲▲▲☆☆**  
  *"What about ‘future counterfactuals’ like ‘If I were to win tomorrow, I’d celebrate’? The antecedent isn’t ‘dead’—it’s still possible! And why can’t we mix tenses freely (e.g., ‘If it had rained, the garden is wet’ is odd)? Stalnaker handles this with unified world quantification."*  

  - **Your 2-minute reply**:  
    "Future-directed ‘were’ still marks deadness: you’re presenting winning as excluded by your current beliefs (e.g., you’re pessimistic). The odd mixed tense example fails because deadness requires the *entire scenario* to be shifted: if A is dead, B must be evaluated in the A-worlds, so it can’t be present indicative (‘is wet’) unless anchored to the actual world. My account predicts this via coherence in world sets."  

  - **Weakness**: Future counterfactuals often don’t feel "dead" (e.g., "If I were to win, I’d be happy" can express hope).  
  - **Concede upfront**: "Future cases stretch liveness—I’ll refine how ‘exclusion’ works for non-past antecedents."  

  ---

  #### **7. Objection (Kratzer-style semanticist: Ordering Source Uniformity)**  
  **Likelihood ★★☆☆☆ | Severity ▲▲☆☆☆**  
  *"You say indicatives and counterfactuals use the same ordering source. But in Kratzer’s terms, counterfactuals often involve normative or causal ordering sources, while indicatives use epistemic ones. How can liveness explain this? In your coin flip, what ordering source applies?"*  

  - **Your 2-minute reply**:  
    "Ordering sources are context-dependent, but the *mechanism* is shared: both rank worlds by similarity. In the coin flip, the indicative uses an epistemic ordering (worlds consistent with physics and common ground); the counterfactual uses the same but adds the antecedent. No need for distinct sources—liveness controls the domain, and the ordering source is neutral."  

