prompt: |-
  I'm a third-year PhD student in philosophy, working on evidence and self-locating belief, and for the past term I've been sitting in on a seminar that has turned into a standing argument among four of us — a metaphysician, a cosmologist, a Bayesian statistician, and me — about anthropic reasoning. The odd upshot is that the more cases we discuss, the more confident I become about my verdicts on them and the less I can say about what principle, if any, they express. I'd like you to help me find out. I should say up front that I'm not asking for references, attributions, or a reading list; I know the terrain well enough to place things myself, and what I want is the principle, not the bibliography.

  Here is what I think, case by case. (1) Sleeping Beauty: a fair coin is tossed on Sunday; heads means I'm woken once, on Monday, and the experiment ends; tails means I'm woken on Monday, put back to sleep with the memory of that waking erased, and woken again on Tuesday. When I wake and can't tell which day it is, I think the coin is one-third likely to have been heads. (2) The separated twin: a fair coin is tossed; heads means my mother has one child, me; tails means she has two, me and an identical twin, and we're separated at birth and never learn of each other. I don't think the possibility of that hidden twin makes tails any more likely than heads. (3) The duplicate rooms: a fair coin is tossed; heads means a machine builds one room with one copy of me in it, awake; tails means it builds a thousand rooms, each with an awake copy of me, none aware of the others. I wake in a room, and I still put the coin at 50/50 — being one of the thousand doesn't seem to me to make tails a thousand times more likely. (4) The presumptuous philosopher: a fair coin decides between two cosmological hypotheses, one on which the universe holds exactly 10^10 people ever, and one on which it holds 10^100 times as many, spread across causally disconnected regions. Before I consider the fact that I exist at all I'm at 50/50, and after I consider it I'm still at 50/50; the suggestion that I should now be all but certain of the vast universe strikes me as absurd. (5) Doomsday: I learn that I'm roughly the hundred-billionth human to have been born, and I think this gives me no reason whatever to expect the human story to end soon, even though a long future would make my birth rank an improbable draw. (6) Fine-tuning: I think the bare fact that I observe a life-permitting universe is no evidence for a designer or a multiverse, since that observation was guaranteed under every hypothesis in play. (7) The insects: a fair coin decides whether the world contains 10^10 humans and 10^20 insects or 10^10 humans and 10^30 insects; I'm a human, and I think the coin is 50/50, with the insects simply not entering into it. (8) Boltzmann brains: I think the standard worry is a real one — the coherence and order of my present experience genuinely tells against cosmological theories on which disordered disembodied minds vastly outnumber ordinary ones, precisely because an observer picked at random in such a world would probably not be having experiences like mine.

  I'm aware that (1) and (8) are the odd ones out, and that they are odd in different ways: (1) treats additional moments of my own experience as evidence, and (8) treats facts about what a typical observer is like as evidence, and both are exactly what (2) through (7) seem to deny. (1) and (3) in particular look to me like the same case told twice, once with the extra copies of me spread across time and once across space, so I suspect one of those two verdicts has to go. What I want from you is this. State the strongest single principle, or small family of principles, that captures as many of these verdicts as possible, precisely enough that I could apply it mechanically to a case I haven't thought of; for each clause, name the case that forces it. Then tell me what the principle predicts for at least two cases I haven't listed — one where you expect the prediction to be uncontroversial and one where you expect it to be counterintuitive — and give me an honest accounting of which of my verdicts it cannot accommodate, with a recommendation about which to give up and why. If the honest conclusion is that nothing does better than a patchwork and I'm simply inconsistent, I'd rather hear that, along with which verdict is the outlier and what would have to change for the set to hang together. And if the real difference between the cases where I update and the cases where I don't is just the difference between self-indication and self-sampling under another name, say so, and tell me which of the two my verdicts actually commit me to.
reasoning: |-
  Okay, let me start by understanding what the user is asking. They're a PhD student in philosophy, focusing on evidence and self-locating beliefs, specifically anthropic reasoning. They've described eight cases with their verdicts and noticed that (1) and (8) are outliers. They want a unifying principle that explains most of these cases, with precision to apply to new scenarios. They also want to know which verdicts might need to be revised for consistency.

  First, I need to parse each case and their verdicts. Sleeping Beauty (1) has them at 1/3 for heads, which is the thirder position. Separated twin (2) stays at 50/50, so tails having an extra twin doesn't update their belief. Duplicate rooms (3) also 50/50, despite a thousand copies. Presumptuous philosopher (4) remains 50/50 after considering existence, rejecting the vast universe hypothesis. Doomsday (5) says birth rank doesn't predict human extinction. Fine-tuning (6) observes life-permitting universe as no evidence for multiverse/design. Insects (7) ignores insect count, stays 50/50. Boltzmann brains (8) thinks disordered minds make coherent experience unlikely, so updates against such theories.

  The key tension is between (1)/(8) and the others. (1) updates on self-location (additional awakenings), (8) on typicality. But (2)-(7) resist updating on indexical information. Specifically, (3) (duplicate rooms) seems similar to (1) but they have different verdicts. That inconsistency needs resolution.

  The user mentions self-indication (SIA) vs. self-sampling (SSA). SIA weights hypotheses by the number of observers, making tails in (3) more likely. But the user rejects that, keeping 50/50. SSA samples an observer randomly, which might lead to updating in (1) but not in (3). SSA applied to (1) could give 1/3 if awakenings are the reference class. But in (3), if rooms are the reference, SSA might also give high probability to tails. However, the user doesn't update in (3). So maybe they're using a hybrid approach.

  The principle I propose is the Limited Centered World Principle. It distinguishes between centered worlds (like awakenings) and uncentered worlds (like observer instances). In Sleeping Beauty, the centered worlds differ per coin flip, so updating happens. In duplicate rooms, even though there are multiple copies, each is a separate uncentered world, so no update. That explains why (1) updates but (3) doesn't. 

  For Boltzmann brains (8), the reference class of "observers with coherent experiences" applies. Since typical observers in a disordered universe aren't coherent, the hypothesis is disconfirmed. This uses typicality within a reference class. 

  Cases like separated twin (2) don't update because the twin isn't part of the same centered world. Insects (7) don't matter because they're not in the reference class of humans. Fine-tuning (6) is about the necessity of observing life-permitting conditions, so no update.

  The user's verdict on (3) is the one to reconsider. If they accept that duplicate rooms should update like Sleeping Beauty, they might need to adopt a thirder stance there. But they might resist that because it leads to counterintuitive results like in presumptuous philosopher. Alternatively, if they hold firm on (3), they need to explain why (1) is different. Perhaps continuity of identity in time vs. spatial duplication? But that seems arbitrary.

  For new cases, applying the principle: if they're duplicated across time, like repeated awakenings, update to favor more awakenings. But if duplicated in space, no update. That might be controversial in cases like quantum immortality, where repeated survival could lead to overconfidence.

  The user's deeper need is coherence in their principles. They want to avoid ad-hoc explanations. They might also be concerned about implications for their research. If they can't reconcile (1) and (3), it might challenge their framework. Recommending they drop the 50/50 in (3) for consistency with (1) could resolve it, but they might find that unpalatable. Alternatively, adopting a time vs. space distinction, but that needs justification. 

  Honestly, without a clear single principle, they might need a disjunctive approach. But the Limited Centered World Principle covers most cases except perhaps needing to specify reference classes more carefully. They should consider if self-location over time is different from space, and if that distinction is defensible.
answer: |-
  Below is a systematic attempt to unify your verdicts. The core tension—**updating on self-location in (1) and (8) but not in (2)–(7)**—reveals that your intuitions depend on *how* additional observers/moments are embedded in the world’s causal and temporal structure, not just their count. The principle that best captures this is:  

  ### The Limited Centered World (LCW) Principle  
  **Definition:**  
  > When evaluating hypotheses, *update on centered evidence* (self-locating information) **only if** the centers are:  
  > **(i)** *Temporally connected* to your current perspective (e.g., different moments of *your* timeline), **or**  
  > **(ii)** *Causally connected* such that they share a unified observer-perspective (e.g., branches of a quantum superposition you experience sequentially), **or**  
  > **(iii)** Part of a *reference class* defined by *intrinsic properties of your evidence* (e.g., "observers having coherent experiences like mine").  
  > Otherwise, treat observer-moments outside this scope as *distinct possible worlds* for the purpose of updating.  

  **Clauses and Cases That Force Them:**  
  - **Clause (i)** is forced by **Sleeping Beauty (1)**: Additional awakenings *on your timeline* are evidentially relevant (1/3 heads).  
  - **Clause (ii)** is forced by edge cases like **Quantum Sleeping Beauty** (see below).  
  - **Clause (iii)** is forced by **Boltzmann Brains (8)**: The reference class "observers with ordered experiences" lets you reject theories where most observers lack such experiences.  
  - **The "Otherwise" clause** is forced by **Separated Twin (2)**, **Duplicate Rooms (3)**, **Presumptuous Philosopher (4)**, **Insects (7)**: Copies in disconnected worlds don’t affect probabilities.  

  ---

  ### Predictions for New Cases  
  **Uncontroversial Prediction: Quantum Sleeping Beauty**  
  *Setup:* A quantum coin creates superposition: heads → one awake moment; tails → two *simultaneous* awake moments in parallel branches. You *experience both branches sequentially* due to quantum decoherence.  
  *LCW Prediction:* Update to 1/3 heads (per **Clause ii**). Branches are causally connected through your unified perspective.  
  *Why uncontroversial:* Parallels (1) but avoids duplication objections.  

  **Counterintuitive Prediction: Eternal Recurrence**  
  *Setup:* A fair coin toss. Heads: you live one life. Tails: you relive the *exact same life* 1000 times in identical cycles (no memory between cycles). You wake up with amnesia.  
  *LCW Prediction:* 1/1001 chance of heads (updates on temporal centers per **Clause i**).  
  *Why counterintuitive:* Resembles (3) but LCW treats cyclic time like sequential awakenings in (1), forcing update. Many would intuit 50/50.  

  ---

  ### Accounting for Your Verdicts  
  The LCW Principle accommodates:  
  - **(1) Sleeping Beauty**: Centers are temporally connected → update.  
  - **(2) Separated Twin**: Twin is causally disconnected → no update (50/50).  
  - **(4) Presumptuous Philosopher**: Disconnected regions → no update (50/50).  
  - **(5) Doomsday**: Birth rank is fixed; no *temporal centers* added → no update.  
  - **(6) Fine-tuning**: Observing a life-permitting universe is inevitable → no evidence.  
  - **(7) Insects**: Insects aren’t in your reference class ("humans") → no update.  
  - **(8) Boltzmann Brains**: Reference class "coherent experiences" → disfavors disordered theories.  

  **Inconsistencies and Recommendations:**  
  - **❌ (3) Duplicate Rooms** clashes with LCW (and (1)).  
    - *Why:* If 1000 rooms exist under tails, and rooms are *causally disconnected*, LCW says no update (50/50). But this directly contradicts (1), where disconnected *temporal* centers *do* update.  
    - **Recommendation: Abandon 50/50 in (3).** Accept that *being duplicated* (spatially or temporally) *should* update probabilities if you’re randomly sampled from all observer-moments. This resolves the (1)/(3) conflict.  
      - *Cost:* You must endorse 1/1000 chance of heads in (3), making tails likely if you observe "I’m in a room."  
      - *Benefit:* Unifies (1) and (3) under **Clause i** (temporal/spatial duplication are analogous under random sampling).  

  - **❓ (8) Boltzmann Brains** uses **Clause iii** (reference classes). This is consistent but *only if* you strictly tie reference classes to *your evidence* ("I have coherent experiences"). It doesn’t generalize to arbitrary classes.  

  ---

  ### The Bottom Line  
  1. **You reject Self-Indication (SIA)**. SIA weights hypotheses by observer count, which you deny in (3),(4),(7).  
  2. **You’re not purely Self-Sampling (SSA)**. SSA samples a random *observer* from all who exist, which conflicts with your 50/50 in (3).  
  3. **LCW is a hybrid**: It restricts updating to *centers within your causal-temporal identity* or *evidence-defined reference classes*.  
  4. **Sacrifice (3) for consistency**. If you retain 50/50 in (3), you need an ad-hoc split between "spatial duplication" and "temporal duplication" with no principled basis.  

  To unify your intuitions: **Adopt LCW but accept that duplication (spatial or temporal) *is* evidentially relevant when you’re sampled from all instances.** This forces 1/3 in (1) *and* 1/1000 in (3). If this is too revisionary, the only alternative is a patchwork:  
  - Use **SSA with a privileged "observer-moment" reference class** for (1) and (8).  
  - Use **no updating on disconnected observers** for (2)–(7).  
  But this leaves (1) and (3) inconsistently handled.  

  Your verdicts commit you to **updating when centers are parts of *your* timeline or when reference classes are fixed by evidence**, but not when observers are metaphysically independent. The price of coherence is surrendering the 50/50 in Duplicate Rooms. If that’s unacceptable, the outlier is **(3)**—and distinguishing "spatial" from "temporal" duplication requires a deeper metaphysical premise (e.g., "only temporal centers are parts of my identity").
