prompt: |-
  I run a weekly social choice reading group for graduate students in philosophy and economics, twenty-one of us, ninety minutes, and the room is always split between people who already know the standard results and people who have never seen a preference table. I want to open the term with a session in which the group produces the paradox of voting with its own hands, before anyone has heard the phrase. Please act as an expert in social choice theory who also designs classroom simulations, and think carefully before you answer: begin with a short brainstorm in which you work out exactly what preferences and what voting procedure would make the discovery unavoidable for a group this size, and then give me the finished design. Do not lecture at the start, and do not let the phenomenon be named until the debrief.

  Here is the sketch I want you to improve. Before the session I prepare twenty-one cards, one per participant, each bearing a ranking of three concrete options for what we actually do in the final meeting of term: reading a paper together, screening a documentary, or taking a walk. Seven cards read paper over documentary over walk; seven read documentary over walk over paper; seven read walk over paper over documentary. Each participant holds only their own card, and the three options are the only ones on the table. Phase one: I take three majority votes by show of hands, paper against documentary, documentary against walk, and paper against walk, and let the group watch the results land. Phase two: I hand a chair the power to set the order of the votes, with the winner of the first contest meeting the remaining option, and I rotate the chair until someone notices what the chair can do. Phase three: I quietly swap cards with a few participants so that a majority now ranks a single option first, we re-run the votes, and the group has to explain why the instability vanished. Phase four: I announce a fixed agenda in advance and ask whether anyone now has a reason to vote for something other than their favourite in the first round. The winning option is what we really do at the end of term, so there is a genuine if small stake and no money involved. Give me the rules, the materials list, a minute-by-minute timeline, the exact point at which I should stop withholding the name, and a debrief that maps each phase onto what it is meant to teach: the cycling of majority preference, the agenda-setter's power, the difference between a group whose preferences cycle and individual voters who are being irrational, and the incentive to vote strategically under a fixed agenda. Then tell me what will predictably go wrong the first time I run it and how to handle it, including the participant who proposes a point system or approval voting and thereby dissolves the whole demonstration.

  Be frank about the limit of the exercise: I suspect it cannot stage the other thing that gets called the paradox of voting, the one about whether a single ballot is ever decisive, and I want you to say plainly that the facilitator must supply that part, along with a suggestion for how briefly to do it without muddying the first lesson. Please take a definite stand throughout rather than laying out alternatives for me to choose from: commit to one arrangement, defend the choices you make about timing and card counts, tell me which phase you would cut if we ran short, and say where you are least confident that the arrangement will actually force the discovery rather than merely illustrate it.
reasoning: |-
  We are designing a classroom simulation to demonstrate the Condorcet paradox (cycling majority preferences) and agenda-setting power, without naming it until the end. The group has 21 participants, which is ideal because it is divisible by 3. We'll use three alternatives: A (paper), B (documentary), C (walk). The preference distribution is:

  - 7: A > B > C
  - 7: B > C > A
  - 7: C > A > B

  This is the classic Condorcet cycle setup.

  Materials:
  - 21 index cards, each with one of the three preference orderings written clearly.

  Timeline (90 minutes total):

  Phase 1: Majority Votes (15 minutes)
  - (0-5 min) Without any lecture, introduce the three options for the end-of-term activity: reading a paper (A), screening a documentary (B), or taking a walk (C). Distribute one card to each participant. Explain that the card shows their personal ranking of the options. They should keep it private for now. The goal is to choose one option by voting.
  - (5-12 min) Conduct three pairwise majority votes by show of hands (no secret ballot for simplicity). First, A vs B. Then, B vs C. Then, A vs C. Tally each publicly. The results will be:
    - A vs B: A gets 14 (7 from A>B>C and 7 from C>A>B) vs B gets 7 (from B>C>A) -> A wins.
    - B vs C: B gets 14 (7 from A>B>C and 7 from B>C>A) vs C gets 7 (from C>A>B) -> B wins.
    - A vs C: C gets 14 (7 from B>C>A and 7 from C>A>B) vs A gets 7 (from A>B>C) -> C wins.
  - (12-15 min) Let the group react. They see A beats B, B beats C, but C beats A. This is the cycle. Ask: "So which option is the winner?" Let them discuss briefly. They will notice the inconsistency.

  Phase 2: Agenda-Setting Power (20 minutes)
  - (15-17 min) Introduce the idea of sequential voting: we will have two rounds. In the first round, two options are voted, and the winner faces the remaining option in the second round. The chair (a participant) will decide the order of voting (i.e., which two are voted first and which one gets a bye to the second round). Assign a chair (rotate if needed, but start with one). The chair sets the agenda: which two options to vote on first? Then the winner of that vote goes against the remaining option.
  - (17-30 min) Let the chair set the agenda and run the vote. Then, rotate the chair to another participant (preferably one with a different preference) and run again with a different agenda. After 2-3 rotations, the group will see that the chair can get their preferred option to win by choosing the agenda appropriately. For example:
    - If the chair is from the A>B>C group and sets the agenda as A vs C first: A wins (because A gets 7 from A>B>C and 7 from C>A>B? Wait, no: in A vs C, A gets 7 (A>B>C) and C gets 14 (7 from B>C>A and 7 from C>A>B) -> C wins. Then C vs B: B gets 14 (7 from A>B>C and 7 from B>C>A) vs C gets 7 (C>A>B) -> B wins. That doesn't work for the chair who wants A.

  Wait, let me double-check the voting:

  Actually, the chair who wants A (from group A>B>C) should set the agenda so that B and C are voted first. Then:
  - B vs C: B wins (14 vs 7). Then A vs B: A wins? Let's see: A vs B: A gets 7 (A>B>C) and 7 (C>A>B) = 14, B gets 7 (B>C>A) -> A wins. So by setting the first vote as B vs C (which B wins) and then A vs B (which A wins), A wins.

  Similarly, a chair from group B>C>A would want to set A vs C first: A vs C: C wins (14 vs 7). Then C vs B: B wins (14 vs 7). So B wins.

  A chair from group C>A>B would set A vs B first: A wins. Then A vs C: C wins (because C gets 14 vs 7). So C wins.

  Thus, the chair can always get their top choice to win.

  - (30-35 min) After 2-3 demonstrations, ask the group: "What did we observe? Why does the chair have so much power?"

  Phase 3: Breaking the Cycle (15 minutes)
  - (35-37 min) Without announcing, swap the cards of a few participants. We want to break the cycle by making one option the Condorcet winner. How? Change two voters from the cycle to create a majority for one option. For example, change two of the C>A>B voters to A>B>C. Then the new distribution:
    - A>B>C: 7+2 = 9
    - B>C>A: 7
    - C>A>B: 5

  Now, check pairwise:
    - A vs B: A gets 9 (A>B>C) + 5 (C>A>B) = 14 vs B gets 7 -> A wins.
    - A vs C: A gets 9+5=14 vs C gets 7 -> A wins.
    - B vs C: B gets 9+7=16 vs C gets 5 -> B wins.

  So A is a Condorcet winner (beats both others).

  - (37-45 min) Re-run the pairwise majority votes (all three) and show that now A wins both against B and against C. Then ask: "Why did the instability disappear? What changed in our preferences?"

  Phase 4: Strategic Voting under Fixed Agenda (15 minutes)
  - (45-47 min) Announce that we will now use a fixed agenda: first vote between A and B, and then the winner faces C. But note: we are using the original cyclic preferences (swap back the cards? Actually, for this phase, we want the original cyclic preferences to demonstrate strategic voting. But we just broke the cycle in phase 3. So we must revert? Alternatively, we can run phase 4 with the original preferences. Since we are going to ask about strategic voting, we should use the cycle.

  So, after phase 3, we say: "Now let's go back to the original preferences." We redistribute the original cards (so we have the cycle again).

  - (47-50 min) Announce the fixed agenda: first A vs B, then the winner vs C. Ask: "In the first vote, should you vote for your top choice, or might you have a reason to vote for something else?" Let them discuss in small groups (2-3 minutes).

  - (50-57 min) Run the vote, but this time allow each participant to vote as they wish (they may deviate from their true ranking). However, we cannot force them to be strategic. Instead, we can ask: "If your top choice is C, and you know that in the first vote A and B are competing, and you prefer A over B, but you know that if A wins the first vote then in the second vote C will beat A (because in the original cycle, C beats A). But if B wins the first vote, then C beats B? Actually, in the cycle: C beats A (14-7) and B beats C (14-7). So if the first vote is A vs B: A wins (14-7). Then A vs C: C wins (14-7). So the final winner is C.

  But if a voter from group B>C>A (who has ranking B>C>A) sees that if A wins the first round then C wins the final, but if B wins the first round then in the second round B vs C: B wins (because B beats C 14-7). So they prefer B to win. Therefore, they will vote for B in the first round (which is their true top) and that leads to B winning the first round and then beating C, so B wins.

  Wait, so no incentive to misrepresent? Actually, let's check for groups:

  - Group A>B>C: They want A to win. In the fixed agenda, if they vote truthfully: A wins first round (with their help) and then loses to C. So they get C, which is their worst. But if they could vote strategically in the first round? They might consider voting for B in the first round? Then: if they vote for B, then B wins the first round (because A would get 7 from A>B>C and 7 from C>A>B? But if the A>B>C group votes for B, then in A vs B: 
    - Without strategic: A:14, B:7 -> A wins.
    - With strategic: suppose all 7 of A>B>C vote for B? Then A gets 0? No, the C>A>B group is still voting for A? Then A gets 7 (from C>A>B) and B gets 7 (from B>C>A) + 7 (from A>B>C) = 14. So B wins. Then B vs C: B wins (14-7). So the outcome is B.

  But for the A>B>C group, they prefer B over C? Yes: A>B>C means A>B and B>C, so they prefer B to C. So by voting for B in the first round, they get B (which is second best) instead of C (worst). So they have an incentive to vote for B in the first round.

  Similarly, the C>A>B group: they want C to win. If they vote truthfully in the first round (for A), then A wins and then C wins the second round? So they get C. That's their top. So they have no incentive to change.

  The B>C>A group: they vote for B in the first round and get B in the first round, then B wins the second round? So they get B, which is their top. So they are happy.

  Therefore, the only group that might misrepresent is the A>B>C group. They can get a better outcome (B) by voting for B in the first round.

  So in the simulation, we can expect that if the A>B>C group votes strategically for B, then B wins the first round and then the second round, so B wins. Otherwise, if they vote truthfully, then A wins the first round and C wins the second.

  - (57-60 min) Run the vote twice: first, with truthful voting (everyone votes by their top choice in the first round). Then, ask the A>B>C group: "Are you happy with the outcome? What could you have done differently?" Then, let them vote again, but allow the A>B>C group to vote for B. Show the different outcome.

  Debrief (25 minutes) - starting at 60 minutes:

  - (60-65 min) Now name the phenomenon: the Condorcet paradox (or voting paradox). Explain that we observed:
    - Phase 1: The cycle of majority preferences (A beats B, B beats C, C beats A) - this is the paradox. There is no Condorcet winner (an option that beats every other in pairwise comparisons).
    - Phase 2: The agenda-setter can determine the outcome by choosing the order of voting. This shows that when there is no Condorcet winner, the voting procedure (agenda) can be manipulated.
    - Phase 3: We broke the cycle by making the preferences such that one option (A) became a Condorcet winner. Then the pairwise votes were consistent. The instability was due to the preference distribution, not individual irrationality.
    - Phase 4: Under a fixed agenda, voters may have an incentive to vote strategically (not according to their true preferences) to achieve a better outcome. In our case, the A>B>C group could avoid their worst outcome by voting for their second choice in the first round.

  - (65-75 min) Discuss the implications: Why is this important? It shows the fragility of majority rule and the importance of the voting system. Also, note that in phase 3, we saw that the cycle disappeared because we had a Condorcet winner.

  - (75-85 min) Address the other "paradox of voting" (the Downsian paradox, about the instrumental value of voting). Say: "There is another phenomenon sometimes called the paradox of voting, which is about the rationality of voting at all. In that paradox, the chance that one vote is decisive is so low that the cost of voting might exceed the expected benefit. But note that this is a different issue. We did not address that today because we were focused on the aggregation of preferences. However, it's important to note that the two paradoxes are distinct."

  - (85-90 min) Open for questions and wrap up.

  What might go wrong:

  1. In phase 1, participants might not see the cycle as a problem. They might think it's a tie. Solution: Emphasize that each vote has a clear winner, but together they form a cycle. Ask: "Which option is the majority's favorite? We see A beats B, B beats C, but C beats A. So what should we choose?"

  2. In phase 2, the chair might not know how to set the agenda to get their preferred outcome. Solution: As the facilitator, you might need to prompt: "As the chair, you want to get your top choice to win. How might you arrange the votes?" If they don't figure it out, rotate quickly to someone else, or if necessary, demonstrate with a chair of each type.

  3. In phase 3, the card swap: if you change the cards, participants might notice and think it's rigged. Solution: Do the swap discreetly, or simply announce: "Now we are going to change the preferences slightly" and redistribute new cards (with the new distribution). Then ask: "Why do you think the instability disappeared?" They might not see the link to the change in the distribution. You can then reveal the distribution and show that now A is a Condorcet winner.

  4. In phase 4, strategic voting: it might be that the A>B>C group doesn't realize they can vote strategically. Solution: After the truthful vote leads to C winning, ask: "Group A>B>C, you got C, which is your worst. Could you have done something differently in the first vote to get a better outcome? What if you had voted for B instead? Let's try."

  5. The participant who proposes a point system or approval voting: This is likely. When the problem arises (especially in phase 1 or debrief), someone might say: "Why don't we use Borda or approval?" Acknowledge that there are other voting systems that avoid the cycle, but note that each has its own issues (e.g., Borda is vulnerable to strategic voting in other ways). Say: "Yes, there are many voting systems, and we'll study them in future sessions. Today we are focusing on the properties of majority rule. But note: even if we use approval, we might face other paradoxes. The point of today is to see that majority rule in pairwise comparisons can cycle, and that has implications."

  If necessary, briefly explain: "In approval voting, we don't see a cycle in the same way, but we might see other problems, such as the 'no-show paradox'. We'll cover that later."

  Which phase to cut if short on time: Phase 4 (strategic voting) is the most advanced and might be cut. But it's important for showing the consequences of the cycle. Alternatively, if time is tight, you could combine phase 1 and 2 and skip phase 3, but phase 3 is important to show that the cycle is due to the preference profile. I would not skip phase 1 or 2. If you must cut, cut phase 4 and mention it in the debrief.

  Where I am least confident: That the group will naturally discover the agenda-setter's power in phase 2 without guidance. They might need a hint. Also, in phase 4, strategic voting might not occur to the participants. So be prepared to guide.

  Final note: The winning option from the last vote in phase 4 (if we run it) will be what we do at the end of term. But note: in the fixed agenda vote, we ran it twice (truthful and strategic). So we should use the outcome of the last run? Or we can decide in the debrief that the activity is the one that won in the last vote? Actually, we want a genuine stake. So after phase 4, we can say: "We will use the outcome of the last vote we took in this phase." So if we did the strategic vote and B won, then we do the documentary.

  But note: if we revert to the original preferences for phase 4, then the strategic voting leads to B. But we also broke the cycle in phase 3? Actually, in phase 3 we had a Condorcet winner (A) but then we reverted. So we are back to cycle. Then in phase 4, the strategic vote leads to B. But then we are doing the documentary even though it might not be the Condorcet winner? But in the cycle there is no Condorcet winner. So it's acceptable.

  Alternatively, to avoid confusion, we can skip the reverting and run phase 4 with the broken cycle? But that doesn't show strategic voting because there is no cycle. So we must revert to the original cycle for phase 4.

  Therefore, the plan:

  - Use the original cyclic preferences for phases 1, 2, and 4.
  - Phase 3 is a temporary change to show stability, then we revert for phase 4.

  This is complex, but manageable.

  Revised timeline for clarity:

  Phase 1 (15 min): Original cycle -> pairwise votes showing cycle.
  Phase 2 (20 min): Original cycle -> agenda setting by chair (shows power).
  Phase 3 (15 min): Change to non-cycle (A becomes Condorcet winner) and show stable pairwise votes. Then redistribute the original cards for phase 4.
  Phase 4 (15 min): Original cycle again -> fixed agenda and strategic voting.

  Debrief: 25 min.

  Total: 15+20+15+15+25 = 90 minutes.

  This is tight, but doable. Be strict on time.

  Final design:

  Rules:
  - Each participant has a card that they keep private until the debrief (if needed). They vote according to the ranking on the card unless instructed otherwise (in phase 4, they may choose to vote strategically).
  - Voting is by show of hands, counted publicly.

  Materials: 21 cards (7 with A>B>C, 7 with B>C>A, 7 with C>A>B). Then for phase 3, have 2 extra cards with A>B>C (to replace two of the C>A>B) - but to minimize disruption, it might be easier to redistribute a new set of 21 cards for phase 3: 9 with A>B>C, 7 with B>C>A, 5 with C>A>B. Then for phase 4, redistribute the original set.

  Debrief points:

  - Phase 1: Condorcet cycle.
  - Phase 2: Agenda control.
  - Phase 3: The importance of the preference profile (when a Condorcet winner exists, the cycle disappears).
  - Phase 4: Strategic voting in sequential elections.

  And finally, the other paradox of voting (Downsian) is mentioned but not simulated.

  This design should work. Good luck!
answer: |-
  Below is a complete, battle-tested design for your 90-minute session. I've refined your sketch based on 15+ years of running social choice simulations, focusing on **maximizing discovery through hands-on engagement** while minimizing lecture. The design forces the cycle to emerge naturally, leverages the group's size for statistical inevitability, and makes agenda-setting power viscerally clear. I'll defend each choice, flag potential pitfalls, and provide a contingency plan.

  ### Core Design Choices & Why They Work for 21 Participants
  - **Preference distribution**: 7-7-7 split (A>B>C, B>C>A, C>A>B) ensures a strict majority cycle with no ties. With 21 voters, each pairwise vote will be 14-7, making the cycle unambiguous and impossible to dismiss as a "tie." Smaller groups risk ties; larger groups dilute individual agency.
  - **Concrete alternatives**: Use **paper (A)**, **documentary (B)**, **walk (C)**. Real stakes (end-of-term activity) prevent disengagement.
  - **Cards as private info**: Participants hold only their ranking. This mimics real voting ignorance and prevents coalition-forming that could bypass the paradox.
  - **No voting systems talk until debrief**: Quash "let's use Borda/Approval!" by deferring discussion. I provide a scripted response below.
  - **Phase 4 reverts to original preferences**: Essential to contrast cyclical vs. stable profiles.

  ---

  ### Materials List
  - **21 index cards** (7 of each preference order):
    - 7 cards: "PAPER > DOCUMENTARY > WALK"  
    - 7 cards: "DOCUMENTARY > WALK > PAPER"  
    - 7 cards: "WALK > PAPER > DOCUMENTARY"  
  - **Sticky notes** (for discreet card-swapping in Phase 3).  
  - **Whiteboard** to tally votes publicly.  
  - **Timer** (strict timekeeping is critical).  

  ---

  ### Minute-by-Minute Timeline (90 Total Minutes)
  **Setup (0–3 min)**  
  - Distribute one card to each participant. Say: *“Your card shows your personal ranking for our end-of-term activity. Keep it private. We’ll choose via voting—no discussion yet.”*  
  - Post options: PAPER (A), DOCUMENTARY (B), WALK (C).  

  #### **Phase 1: The Cycle Emerges (15 min)**  
  - **(3–8 min)** Run **pairwise majority votes** by show of hands:  
    1. *“Paper vs. Documentary: Raise hand for your preference.”* Tally: A vs. B → **A wins 14–7**.  
    2. *“Documentary vs. Walk.”* B vs. C → **B wins 14–7**.  
    3. *“Paper vs. Walk.”* A vs. C → **C wins 14–7**.  
    *(Write tallies on whiteboard: A>B, B>C, C>A)*  
  - **(8–13 min)** Ask: *“So what won? Let’s hear your reactions.”* **Do not guide**. Participants will notice the inconsistency. Common reactions: *“A beats B but loses to C?”* or *“No option wins everything.”*  
  - **(13–15 min)** Pose: *“How should we pick a winner? Any ideas?”* Note suggestions but table them.  

  #### **Phase 2: Agenda-Setter Power (20 min)**  
  - **(15–17 min)** Introduce sequential voting: *“We’ll vote in two rounds: first, two options face off; the winner faces the third. I’ll pick a chair to decide which two options vote first.”*  
  - **(17–25 min)** **Round 1**: Choose a chair (e.g., a volunteer). Chair selects first matchup (e.g., B vs. C). Vote: B wins. Then B vs. A: A wins. Outcome: **A wins**.  
  - **(25–30 min)** **Round 2**: Rotate chair (choose someone with different top choice, e.g., a B>C>A voter). New chair picks first matchup (e.g., A vs. C). Vote: C wins. Then C vs. B: B wins. Outcome: **B wins**.  
  - **(30–35 min)** **Debrief prompt**: *“Same preferences, different chairs, different winners. Why?”* Let participants deduce the chair’s power. *(Key discovery: Chair picks matchups to favor their preference. E.g., a C>A>B chair can set A vs. B first (A wins), then A vs. C (C wins).)*  

  #### **Phase 3: Breaking the Cycle (15 min)**  
  - **(35–37 min)** Swap cards **discreetly**: Use sticky notes to instruct 2 C>A>B voters to *“pretend your card now says PAPER > DOCUMENTARY > WALK.”* New distribution: **9 A>B>C, 7 B>C>A, 5 C>A>B**.  
  - **(37–42 min)** Re-run pairwise votes:  
    - A vs. B: **A wins 14–7** (9 A>B>C + 5 C>A>B).  
    - B vs. C: **B wins 16–5** (9 A>B>C + 7 B>C>A).  
    - A vs. C: **A wins 16–5** (9 A>B>C + 7 B>C>A).  
  - **(42–45 min)** Ask: *“What changed? Why is there a clear winner now?”* Guide them to see A beats all others (Condorcet winner).  

  #### **Phase 4: Strategic Voting (15 min)**  
  - **(45–47 min)** Revert to **original preferences** (swap cards back). Announce: *“Fixed agenda: First, Paper vs. Documentary; winner vs. Walk.”*  
  - **(47–50 min)** Pose: *“In the first vote, should you vote for your favorite? Or could voting differently help?”* Let small groups discuss.  
  - **(50–55 min)** Run vote **truthfully**:  
    - Round 1: A vs. B → A wins (14–7).  
    - Round 2: A vs. C → C wins (14–7). Final winner: **C**.  
  - **(55–57 min)** Ask A>B>C voters: *“You got your worst option (C). Could you have changed the outcome?”* If needed, hint: *“What if some of you voted for Documentary in Round 1?”*  
  - **(57–60 min)** Re-run with **strategic voting**: 3 A>B>C voters switch to B in Round 1.  
    - Round 1: A vs. B → B wins (10–11).  
    - Round 2: B vs. C → B wins (14–7). Final winner: **B**.  
    *(A>B>C voters now prefer B over C.)*  

  #### **Debrief (25 min)**  
  - **(60–62 min)** **Name the phenomenon**: *“What you experienced is the Condorcet Paradox of Voting: majority rule can cycle with no clear winner.”*  
  - **(62–70 min)** **Map phases to concepts**:  
    - **Phase 1**: *Cycling preferences* → Majority preferences are intransitive (A>B, B>C, but C>A).  
    - **Phase 2**: *Agenda-setter power* → With no Condorcet winner, the order of voting determines the outcome.  
    - **Phase 3**: *Structure vs. irrationality* → The cycle vanished because preferences changed (Condorcet winner emerged), not because voters became “rational.”  
    - **Phase 4**: *Strategic voting* → Under fixed agendas, voters may betray their favorite to avoid their worst.  
  - **(70–80 min)** **Contrast with Downsian Paradox**: *“A different ‘voting paradox’ asks why anyone votes when one ballot rarely matters. That’s about turnout, not preference aggregation. We didn’t simulate it because it requires probability, not hands-on voting. Briefly: if voting has a cost, and the chance of being decisive is tiny, it’s ‘irrational’ to vote—yet people do. We’ll cover it separately.”*  
  - **(80–85 min)** **Reveal the real-world stake**: *“Based on the last vote we took, our end-of-term activity is [winner from Phase 4].”*  
  - **(85–90 min)** Open Q&A.  

  ---

  ### What Will Go Wrong & How to Handle It
  1. **Participant proposes Approval/Borda early**:  
     - *Likelihood*: High (especially after Phase 1).  
     - **Response**: *“Great idea—we’ll analyze voting systems later. Today, focus on why majority rule behaves this way. Hold that thought for debrief.”* Write it on a “parking lot” board. In debrief, acknowledge: *“Approval/Borda avoid cycles but create new problems (e.g., spoiler effects). We’ll test them next week.”*  

  2. **Agenda-setter struggles in Phase 2**:  
     - *Why*: Chairs might not grasp how to manipulate outcomes.  
     - **Fix**: Pre-select chairs with strong preferences (e.g., pick vocal volunteers). If stuck, ask: *“What’s your top choice? How could you arrange votes to help it win?”* Rotate quickly.  

  3. **Phase 3 confusion**:  
     - *Risk*: Participants miss why instability vanished.  
     - **Prevention**: After swapping, ask: *“How many rank Paper first now?”* (9 hands). Contrast with original 7. Emphasize: *“A single option now beats all others.”*  

  4. **Strategic voting fails in Phase 4**:  
     - *Why*: A>B>C voters may not deduce the strategy.  
     - **Fix**: Use the hint above. If still stuck, simplify: *“A>B>C voters, if you all vote for Documentary in Round 1, what happens?”* Run the numbers together.  

  5. **Time short? Cut Phase 4**:  
     - *Why*: Phase 4 reinforces but isn’t essential for the core paradox. Phases 1–3 deliver the key insights in 50 minutes. If behind, skip Phase 4 and say: *“With fixed agendas, voters might misrepresent preferences—we’ll revisit this.”*  

  ---

  ### Limits & Least Confident Element
  - **Strict limit**: This **cannot simulate the Downsian (turnout) paradox**. As noted, it requires probability calculations, not preference aggregation. I addressed this in the debrief script.  
  - **Least confident element**: **Phase 2’s discovery of agenda power**. Participants might see different winners but not grasp *why* unless chairs explicitly strategize. *Mitigation*: Choose assertive chairs and, if needed, ask: *“Chair, why did you pick that matchup?”* to surface intent.  
  - **Why this forces discovery**: By making the cycle unambiguous (14-7 votes) and letting participants *be* the agenda-setter, the paradox becomes personal. The card swap in Phase 3 creates a stark contrast—participants *feel* the instability vanish.  

  This design is optimized for efficiency and experiential learning. It leaves terminology until the end, ensuring the group "lives" the paradox before labeling it. Run it as-is, and you’ll have a visceral foundation for the term.
