answer: |-
  1.  When eccentric Aunt Agatha passed, her will stipulated her fortune be distributed via a coin-flip game: heads, you gain `$2^n`; tails, you lose `$2^n` on the *n*th flip, continuing until heads finally landed.
  2.  Cousin Bertram played first: heads on flip 3 meant he won $8, while Millicent's tails on flip 1 (-$2), tails on flip 2 (-$4), and heads on flip 3 (+$8) somehow left her owing the estate $2.
  3.  The executor, overwhelmed by chaotic results ranging from massive debts to huge windfalls with no clear average, declared the will "mathematically unsound" and hired a very confused actuary.
  4.  After days buried in ledgers, the actuary emerged, proclaiming, "The expectation isn't undefined, it's just... context-dependent! We simply need the *right order of evaluation* for each sequence."
  5.  Bertram inherited a shack and a hefty tax bill, Millicent got the mansion and yacht; the actuary had retroactively applied the losses first, mumbling, "Conditional convergence is like a very undercooked soufflé – it collapses if you look at it wrong."
