prompt: |-
  I keep flip-flopping about what to do when I'm not sure whats morally right, and I want to know what rule, if any, my gut is actually following. Here's my gut on a few cases. (1) I'm about 70% sure eating meat is wrong, 30% sure it's fine — I don't eat meat and it doesn't feel like a close call. (2) I'm maybe 55% sure it's fine to break a small promise to a friend in order to help a stranger a little, 45% sure it's wrong — I keep the promise anyway; gambling on near-even odds with someone else's interests feels wrong even when the numbers say go. (3) I'm 99% sure some church's rule against a blood transfusion is bunk, but they say disobeying means eternal torment; I'd take the transfusion. (4) I have maybe 1% credence in a view where the long-run future is astronomically important and the best use of a life is working on that; I mostly do act on it, or at least I feel bad when I don't. (5) I'm 60/40 that fish don't matter morally at all versus matter a lot — I don't eat fish.

  Is there one principle that gets all of these, or do I need two? My own stab was: act on the view you most believe, unless another view you take seriously says the stakes are enormous and what it asks of you isn't humiliating — but I can't tell if that's a principle or just a description of my biases. (3) against (4) is where it hurts: in both, a view I'm nearly sure is wrong threatens or promises something enormous, and I shrug at one and obey the other. Tell me what principle, or small set of them, captures the pattern, what each says about cases I haven't listed, including how it copes with the fact that I have no idea how to compare how bad two different views say a thing is when their scales dont line up, and which of my verdicts I'd have to give up to be consistent.
reasoning: |-
  Okay, the user is struggling with moral uncertainty and wants to know what principle their gut is following based on several cases they provided. Let me start by understanding each case they mentioned.

  First, in case (1), they're 70% sure eating meat is wrong but don't eat it anyway. Even though it's not a close call probability-wise, their action aligns with the majority belief. But why not the 30%? Maybe because the potential harm to animals outweighs the benefit of eating meat. 

  Case (2) is interesting. They're 55% sure breaking a small promise is fine to help a stranger, but they keep the promise. Their explanation mentions gambling with someone else's interests feels wrong. So here, even though the numbers slightly favor breaking the promise, the involvement of another person's trust makes them avoid the risk. This suggests a risk-aversion principle when others' interests are at stake.

  Case (3) deals with a blood transfusion against religious beliefs. They're 99% sure the rule is bunk, but the threatened consequence is eternal torment. Yet, they'd take the transfusion. But in case (4), they have only 1% credence in the long-term future's importance, yet they act on it. The difference here is crucial. In (3), the enormous stake (eternal torment) is tied to a belief they find almost certainly false, so they dismiss it. In (4), even with low probability, the potential impact is so vast that acting on it feels necessary. This points to expected moral value calculation, where probability multiplied by stakes determines action.

  Case (5) shows avoiding eating fish despite higher uncertainty (60% fish don't matter). Here, the precautionary principle might apply—since there's a chance fish matter a lot, avoiding harm is better.

  The user's stab at a principle involves acting on the most believed view unless another view has enormous stakes without humiliation. But they're unsure if that's a principle or bias. The conflict between cases (3) and (4) is key. Why dismiss eternal torment but act on the long-term future? The difference might be in the nature of the stakes. Eternal torment is tied to a specific doctrine they reject, while the long-term future's importance is a more plausible, even if improbable, ethical perspective. Also, acting on long-term future involves personal sacrifice without harm to others, unlike the blood transfusion which could save a life.

  The user's deeper need seems to be consistency. They want a framework that explains their intuitions across scenarios without contradiction. They also need help comparing moral scales across different views, like how to weigh animal suffering against promise-keeping. 

  Possible principles: Risk aversion when others are affected (case 2), Precautionary principle when harm is possible (cases 1,5), and Expected Moral Value for high-stakes low-probability scenarios (cases 3,4). But reconciling (3) and (4) requires distinguishing between stakes that are credible versus those tied to implausible beliefs. Maybe they intuitively assess the plausibility of the ethical framework itself, not just the probability. 

  The user might need a multi-principle approach. Principles like MEC, Precaution, and Risk Aversion together could cover the cases. But they must address the scale comparison issue. Using range voting or normalization might help, but it's messy. Alternatively, they could accept that some intuitions conflict, like dismissing eternal torment but acting on long-term future, and refine their principles to include a plausibility threshold for stakes. 

  In conclusion, the user likely needs multiple principles tailored to different uncertainty types, and they might have to adjust their stance on case (3) or (4) for consistency, or accept that their intuitions are context-dependent. Their unspoken need is a reliable, consistent moral compass that reduces flip-flopping, providing clarity in uncertainty.
answer: |-
  Your intuitions reveal a fascinating pattern that combines **three distinct principles** under moral uncertainty. Here's a synthesis that captures all your cases, explains your tension between (3) and (4), handles incomparable scales, and shows where consistency might require adjustments:

  ---

  ### **Core Principles at Work**
  1. **Maximize Expected Moral Value (MEC)**:  
     *Act based on probability-weighted outcomes, but only when moral scales are comparable.*  
     - **Case (3) Blood Transfusion**: You dismiss the 1% risk of eternal torment because the *scale* of harm (eternal torment) feels incoherent or implausible within your ethical framework. MEC fails here due to scale incomparability.  
     - **Case (4) Long-Term Future**: You act on a 1% credence because the stakes (astronomical impact) *are* expressed in a scale you intuitively accept (e.g., "prevent suffering/advance flourishing"). Scales align, so MEC applies.

  2. **Precautionary Principle (Avoid "Ruin")**:  
     *Avoid actions that risk catastrophic harm under *any* plausible moral view, even with low probability.*  
     - **Case (1) Meat**: 30% chance of serious wrong → precautionary avoidance.  
     - **Case (5) Fish**: 40% chance of significant harm → precautionary avoidance.  
     - **Case (3) vs. (4)**: Blood transfusion isn't "ruin" under *your* worldview (you're 99% sure). Long-term future inaction *is* potentially ruinous under the 1% view. Precaution applies only to credible catastrophes.

  3. **Interpersonal Risk Aversion**:  
     *Never gamble with *others'* interests when uncertainty is high.*  
     - **Case (2) Promise**: Even with 55% probability of net gain, imposing risk *on your friend* for a stranger's benefit feels impermissible. You prioritize loyalty over utility.

  ---

  ### **Resolving Your (3) vs. (4) Conflict**
  - **Why transfusion (3) is fine**:  
    The threatened harm (eternal torment) is tied to a view you find *epistemically implausible* (99% false). Its moral scale ("divine punishment") doesn't integrate with your core values. Thus, MEC *doesn't apply*, and precaution is irrelevant.  
  - **Why future (4) feels binding**:  
    The 1% view uses a moral scale (preventing astronomical suffering) that *does* integrate with your values. MEC applies, and the stakes are so high that even 1% probability demands action. It’s a "credible" catastrophe.

  ---

  ### **Handling Incomparable Scales**
  Your gut uses **two filters**:  
  1. **Epistemic Plausibility**: Does the view deserve "moral weight" at all? (e.g., eternal torment fails).  
  2. **Scale Alignment**: Can the view’s harms/benefits be mapped onto a common metric? (e.g., "eternal torment" vs. "death" aren’t comparable; "fish suffering" vs. "human pleasure" are partially comparable).  
  - **When scales align**: Use MEC.  
  - **When scales clash**: Default to precaution or your "best guess" view.

  ---

  ### **Predictions for New Cases**
  | Scenario | Your Likely Action | Principle Applied |
  |----------|-------------------|-------------------|
  | **90% sure a vaccine is safe; 10% it causes severe harm** | Avoid vaccine | Precaution (ruin risk) |
  | **60% a charity saves lives; 40% it’s a scam** | Donate | MEC (expected value favors action) |
  | **55% a lie saves 10 strangers; 45% it harms 1 friend** | Don’t lie | Interpersonal Risk Aversion |
  | **2% credence that AI risk is existential** | Work on AI safety | MEC + Precaution (high stakes) |

  ---

  ### **Consistency Tensions & Required Adjustments**
  - **Your current conflict**: Acting on 1% for the future (Case 4) but ignoring 1% for eternal torment (Case 3). **Resolution**: You’re consistent if you reject the *moral scale* of eternal torment as implausible/incomparable, while accepting the scale of long-term impact.  
  - **Adjustment needed**: If you *dismiss* eternal torment due to epistemic implausibility, you must **also dismiss** any low-probability threats from views you find incoherent (e.g., ignoring a 5% credence in "karma debt" from a religion you reject).  
  - **Problem case**: If you had 1% credence that eating broccoli causes a butterfly-effect apocalypse, would you avoid it? If no, you’re privileging "academic" long-term views over "supernatural" ones—a bias to address.

  ---

  ### **Refined Principle Set**
  > **1. When moral scales align**, maximize expected moral value.  
  > **2. When scales clash but any view predicts catastrophe**, avoid the catastrophic risk.  
  > **3. Never impose significant risks on specific others** for uncertain gains.  
  > **4. Ignore threats/rewards from views deemed epistemically hopeless** (>95% false).  

  This system explains *all* your cases, resolves (3)/(4), and handles scale comparisons by filtering views first. Your "humiliation" clause isn’t needed—it’s subsumed by interpersonal risk aversion (gambling with others’ interests feels humiliating). To stay consistent, embrace that your gut rejects *incommensurable* scales (eternal torment) while accepting *stretching* scales (astronomical future welfare).
