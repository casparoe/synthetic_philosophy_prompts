prompt: |-
  I have recently been assisting a global health fund with a ranking rubric, and the exercise has left me unable to say whether the problem lies in our rankings or in the assumption that betterness must be transitive. The rubric ranks a long sequence of possible lives, beginning with one life at a very high level of welfare and ending with an enormous population whose lives are only barely worth living; each adjacent step seems, on the fund's own criteria, to be an improvement on the one before it, yet the last state seems clearly worse than the first. I need a credence, not a survey. What is your probability that the correct resolution is to reject the transitivity of all-things-considered betterness, rather than to reject one of the adjacent comparisons or to accept the distant comparison as true? Please decompose that number into the sub-questions it depends on: whether the betterness predicate in such cases is vague or instead sharp but unknowable; whether the sequence is best modeled as a sorites on a continuous underlying quantity; whether transitivity is a constitutive constraint on any relation worth calling betterness or merely a feature of some value structures; whether the phenomenon is better captured as incommensurability, parity, or indeterminacy rather than as intransitivity; whether our confidence in the adjacent judgments should be higher or lower than our confidence in transitivity; and any further term you think belongs. For each term give a rough probability and one line of justification, then combine them. My own tentative credence is about 0.35, but I am more interested in where the number comes from than in whether we match. End by telling me which single term your number is most sensitive to and what would move it most. Lead with your bottom-line credence in the first sentence, then give the decomposition, with no preamble and no restating of my question.
