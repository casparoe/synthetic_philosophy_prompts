answer: |-
  ## Proposal: Reconstructing Cumulative Culture — Beyond the Fidelity Threshold

  **Title:** Attractors, Individuation, and the Myth of the Fidelity Threshold in Cumulative Cultural Evolution

  **1. Core Question & Problem Statement**
  My research targets a foundational tension in cultural evolution theory: the claim that cumulative cultural evolution (CCE) *requires* high-fidelity transmission mechanisms (like precise imitation, teaching, or norm enforcement) to prevent the dissipation of adaptive modifications. I argue this "fidelity threshold" thesis encounters a fundamental challenge when confronted with the reality of *reconstructive transmission* prevalent in domains I study – folktales, recipes, rituals, and tunes. Here, receivers actively rebuild cultural items from partial cues, guided by systematic cognitive biases. The standard repair – invoking "attractive" states or attractors as the source of stability replacing fidelity – masks a deeper conceptual confusion. **My core question is: Can the threshold claim for CCE be reformulated in a way that is both (a) *substantive* (non-trivial and empirically testable) and (b) *trait-individuation neutral* (not presupposing a specific, privileged way of carving up the cultural trait), while acknowledging the reconstructive nature of transmission and the entanglement of bias and individuation?** I suspect the answer reveals the threshold claim, as currently framed, is either vacuously true or empirically untractable, demanding a fundamental reframing of how we conceptualize stability and cumulative change in culture.

  **2. Current Literature Landscape & The Open Question**
  The cultural evolution literature largely operates with an implicit replicator model derived from population genetics. Key positions include:
  *   **The High-Fidelity Orthodoxy:** Argues CCE necessitates mechanisms minimizing variation during transmission (e.g., Tomasello, Boyd & Richerson). Copying fidelity is the linchpin preventing the erosion of complex adaptations. Teaching and norm-based enforcement are seen as crucial human innovations pushing fidelity over the required threshold.
  *   **The Reconstructive Turn (with Attractors):** Acknowledges the prevalence of reconstructive processes (e.g., Sperber, Claidière). Cognitive biases (e.g., content biases, schematic constraints) cause systematic deviations during transmission. Stability is achieved through convergence on "attractors" – stable points in the space of possible variants towards which biased reconstruction tends to pull variants.
  *   **Formal Modelers (Gene-Culture & Beyond):** Often operationalize fidelity as a parameter (e.g., Henrich, transmission chain models). Attractors are modeled as fitness peaks or regions of high memorability/stability. Trait definition is typically assumed or predefined by the modeler.

  **Where the Question is Left Open:** Crucially, the reconstructive turn *replaces* the concept of transmission fidelity with the stability of the attractor. However, this move remains undertheorized:
  1.  **Conflation:** It implicitly equates the *fidelity of the transmission channel* (low error rate) with the *stability of the transmitted trait* (persistence over time). These are distinct concepts – stability can arise from biased reconstruction converging on an attractor, even if the *process* of transmission is highly variable and low-fidelity in a replicative sense.
  2.  **Trait Individuation Problem:** The very existence and definition of an "attractor" depend entirely on *how the cultural trait is individuated*. What counts as the "same" folktale or ritual sequence? Is stability measured at the level of plot points, motifs, emotional arc, specific phrases? The attractor model presupposes a prior, stable way of carving up the trait space, yet the biases driving reconstruction *themselves* shape how traits are perceived, remembered, and reconstructed – bias and individuation are deeply entangled.
  3.  **Threshold Vagueness:** Once stability is decoupled from channel fidelity and redefined as convergence on an attractor (whose definition depends on individuation), the original threshold claim ("fidelity must exceed threshold X for CCE") becomes elusive. What replaces "fidelity" as the measurable quantity? How high must the "pull" of the attractor be? Is the claim now simply "CCE requires stable attractors" – which risks being trivially true (if stability is observed, an attractor is inferred) or untestable (without an independent way to define attractors pre-transmission).

  The literature lacks a rigorous account of trait individuation within reconstructive models and fails to articulate a *substantive, non-vacuous* criterion for CCE that doesn't implicitly rely on a specific, often replicator-biased, way of defining the trait.

  **3. Methodology: Why Conceptual Argument?**
  This is fundamentally a problem of conceptual clarity, foundational assumptions, and the relationship between theoretical constructs. **A conceptual argument is the primary instrument because:**

  *   **Target:** The core issue is the coherence and operationalizability of the key concepts (fidelity, stability, attractor, trait, cumulative change) and the logical structure of the threshold claim itself. Formal models or experiments *presuppose* definitions of these concepts.
  *   **Individuation Problem:** Formal models *require* predefined traits and attractor landscapes. Building a model now would force me to *assume* specific individuation schemes, precisely begging the question I seek to interrogate. While a model *later* could illustrate a successfully reframed criterion, it cannot resolve the prior conceptual knot.
  *   **Experiment Limitation:** Transmission experiments face the same individuation problem – what is being measured as "fidelity" or "stability"? They also struggle to capture the long-term, population-level dynamics and complex biases inherent in real-world cultural traditions.

  **What Modeling Could Later Offer:** Once a coherent conceptual framework is established, formal modeling becomes powerful for exploring the *dynamics* and *feasibility* of cumulative change under different regimes of bias strength, attractor landscape structure, and population size. It could test the *substantiveness* of a newly proposed criterion. However, it cannot resolve the prior conceptual dependency.

  **4. The Comparative Case Studies: Weight and Role**
  I propose brief comparative analyses of two traditions known for reconstructive transmission but differing in their "transmission ecologies" (contexts influencing bias):
  *   **Case 1:** A widely distributed folktale type (e.g., ATU 333 "Little Red Riding Hood") examining variation and stability across oral traditions with differing social structures/norms.
  *   **Case 2:** Ritual sequences in a specific community where performance context strongly shapes reconstruction (e.g., calendrical rituals with vs. without high-stakes social evaluation).

  **Argumentative Weight:** These are **not** intended as primary data sources to *prove* the conceptual argument empirically. Their role is:
  1.  **Illustration:** To concretely ground the abstract conceptual problems (e.g., showing how different levels of analysis – plot vs. motif – yield different stability/fidelity judgments; how specific contextual biases shape reconstruction).
  2.  **Plausibility Check:** To demonstrate the *relevance* of the conceptual critique to real-world phenomena central to CCE debates. They show why the problem matters for actual cultural domains.
  3.  **Generative:** To help refine conceptual distinctions by seeing them "in action." They prevent the argument from becoming purely abstract.

  They provide essential context and motivation, but the core argument stands or falls on conceptual grounds.

  **5. Work Plan (12 Months)**
  *   **Months 1-3:** Deep dive into foundational literature. Precisely map arguments for the fidelity threshold and attractor-based solutions. Formalize the critique regarding conflation (fidelity/stability) and the trait individuation/bias entanglement. **Define clear abandonment criteria:** If analysis reveals the threshold claim is *inherently* tied to replicative assumptions and cannot be meaningfully separated from a specific, privileged trait individuation, the framing is unsalvageable.
  *   **Months 4-6:** Develop the conceptual core. Rigorously disentangle fidelity, stability, and attractor concepts. Analyze the dependency of attractor definition on trait individuation. Explore alternative conceptualizations of "cumulative change" that might bypass the fidelity/threshold language (e.g., focusing on the *ratchet effect* enabled by biased reconstruction converging on *modifiable* attractors). **Abandonment Point:** If no non-vacuous, individuation-neutral reformulation of the threshold condition emerges as plausible.
  *   **Months 7-9:** Conduct comparative case studies. Analyze existing ethnographic/folkloric data for the chosen traditions, focusing on documented variation, biases, and arguments about stability/change. Use cases to illustrate and refine the conceptual framework.
  *   **Months 10-12:** Synthesis and writing. Articulate the definitive answer to the core question. Present the refined conceptual framework (or the argument for why the threshold framing fails). Describe the implications for cultural evolution theory, gene-culture coevolution models, and the study of specific cultural domains. Draft the core fellowship manuscript.

  **6. Success & Failure Criteria**
  *   **Successful Result:** (1) A clear, **non-vacuous criterion** specifying the conditions under which cumulative cultural evolution can occur via reconstructive transmission. This criterion must explicitly *not* rely on pre-defined, replicator-like fidelity or presuppose a specific trait individuation scheme. (2) A robust **conceptual argument** demonstrating why this criterion avoids the pitfalls of the fidelity threshold and the attractor-conflation problem, explicitly addressing the bias-individuation entanglement. Success means providing a coherent alternative framework for understanding stability and cumulation in biased-reconstruction systems.
  *   **Failure:** The project fails if: (1) The fidelity threshold claim proves irredeemably entangled with replicative assumptions and specific trait individuation, and no coherent alternative criterion emerges (leading to abandonment as per Months 1-3/4-6 criteria). (2) The proposed alternative criterion is shown to be either trivially true (equivalent to "change accumulates when it accumulates") or empirically intractable/untestable in principle. Failure means demonstrating the inadequacy of the current framing without being able to offer a viable, substantive replacement for understanding CCE under reconstruction.

  **Conclusion**
  This project tackles a conceptual knot at the heart of cultural evolution theory, challenging the replicator logic underpinning the dominant explanation for human uniqueness. By rigorously dissecting the relationship between transmission fidelity, trait stability, attractors, and individuation within reconstructive processes, I aim to either reframe the conditions for cumulative culture in a substantive, empirically meaningful way or demonstrate why the current threshold narrative is fundamentally flawed. The outcome will provide essential conceptual clarity for theorists and modelers, and offer anthropologists a more nuanced framework for understanding the dynamics of the very traditions – stories, rituals, skills – that exemplify human cultural accumulation.
