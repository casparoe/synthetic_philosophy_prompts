prompt: |-
  Ok so I'm putting together the first session of a grad seminar on the concept of intellegence, and I want to run it as a ranking exercise instead of a lecture. Here's the set-up. A colleague of mine (not a fan of the standard psychometric stuff, and also not a fan of the AI-benchmark stuff) has been floating a list of what she calls candidate marks of intelligence: features such that if a system had them you'd be inclined to call it intelligent, and if it lacked them you'd be inclined to withhold the word. She's not claiming any one of them is necessary or sufficient on its own. The question is how each would do as the single headline criterion of a general-intelligence benchmark — if you had to build one benchmark whose score was supposed to mean general intelligence, which of these would you most want the score to track?

  Her list, as best I can render it:

  A. Transfer under distribution shift: the system performs well on problems drawn from a family whose structure its designers never got to see and couldn't tune on.

  B. Compression: the system's behavior is equivalent to the shortest program that reproduces a very broad range of observations, and the shorter that program relative to what it reproduces, the more intelligent the system.

  C. Learning speed: how few examples or interactions it needs to reach a fixed competence level, measured against a reference learner you specify in advance.

  D. Self-calibration about its own limits: it knows when it doesn't know, can predict where it will fail, and its confidence tracks its accuracy rather than tracking how fluent the answer sounds.

  E. Resourceful goal-getting: hand it an objective and an adversarially stingy set of tools and it finds a route anyway — the MacGyver criterion.

  F. Intervention/observation discrimination: it reliably distinguishes what it would observe from what would happen if it acted, and updates differently on the two.

  G. Improvisation and transmission: it invents a new notation, game, or protocol from scratch and then gets another agent to use it correctly with no shared prior vocabulary.

  H. Answer-indistinguishability: across long, mixed-domain interrogation, a knowledgeable interlocutor can't reliably tell it apart from a knowledgeable human.

  Two things I want from you. First, sort these into tiers by how well each would serve as the headline criterion for a general-intelligence benchmark — top tier, middle, bottom, however many tiers you think are honest — and give me a sentence or two per item saying why it lands where it does. Second, tell me which item is carrying the most weight for the whole project, and which one on reflection is probably just a proxy for something else on the list; if two of them are near-duplicates, say which.

  Also, she'd want to know: if there's a mark of intelligence that's obviously missing here, name it and tell me where it would slot in.

  And don't just be agreeable about the ordering. Tell me how confident you actually are in the ranking as a whole, and point to the single placement you're least sure about and why.
reasoning: |-
  Okay, the user is designing a graduate seminar on intelligence and wants to run a ranking exercise based on their colleague's proposed "marks of intelligence." They've provided eight criteria (A through H) and want them sorted into tiers based on suitability as a headline criterion for a general-intelligence benchmark. 

  First, I need to understand what makes a good headline criterion. It should capture the essence of general intelligence, be measurable in a benchmark, resist gaming, and reflect core cognitive abilities rather than domain-specific skills. The user also wants to know which criterion is most important and which might be redundant.

  Looking at the list:
  - A (Transfer under distribution shift) seems strong because generalization is fundamental to intelligence. It's testable by holding out data distributions during training.
  - B (Compression) has theoretical appeal (Solomonoff, Kolmogorov) but is notoriously uncomputable. Not practical for a benchmark.
  - C (Learning speed) feels secondary; it's an efficiency metric rather than a capability marker. Depends heavily on the reference learner chosen.
  - D (Self-calibration) is crucial for safe AI but more about meta-cognition than core intelligence. Could be gamed by conservative systems.
  - E (Resourceful goal-getting) is very evocative ("MacGyver criterion") and tests abstract problem-solving. Might be the purest expression of general intelligence.
  - F (Intervention/observation discrimination) is foundational for causal reasoning (Pearl, Woodward) but feels more like a component than a holistic measure.
  - G (Improvisation/transmission) tests cultural transmission - uniquely human but perhaps too niche for a "general" benchmark.
  - H (Answer-indistinguishability) is basically the Turing Test, which has well-known flaws (like prioritizing mimicry over understanding).

  Tiering them:
  Top tier should include E and A - they directly test adaptive problem-solving. 
  Middle tier: F (core reasoning), D (meta-cognition), G (creative communication). 
  Bottom tier: C (too dependent), B (unmeasurable), H (mimicry-focused).

  The heavyweight is clearly E (Resourceful goal-getting) - it demands creativity, planning, and adaptability in novel constraints. Meanwhile, H (Answer-indistinguishability) is probably just a proxy for E or A - passing as human requires their capabilities.

  Missing mark? I'd suggest "Recursive Self-Improvement" - the ability to enhance one's own cognitive architecture. It'd slot into top tier with E and A as it implies deep understanding.

  Least confident placement is G (Improvisation). Is inventing protocols truly general intelligence or just a human-specific expression of it? Could argue for moving it up or down.

  The user's colleague seems to value unconventional perspectives (dismissing psychometrics/AI benchmarks). My ranking pushes back on compression (B) and Turing-like tests (H) while elevating pragmatic adaptation (E,A) - which aligns with their anti-establishment vibe. The seminar should spark debate about whether intelligence is fundamentally about survivalist ingenuity or something more abstract.
answer: |-
  Here's a tiered ranking of the candidate marks for suitability as a **headline criterion in a general-intelligence benchmark**, based on how well each captures *broad, adaptable, goal-agnostic cognitive capability* while being benchmark-practical. I've split them into three tiers with brief justifications, followed by your specific requests.

  ---

  ### **Tier 1: Best Candidates (Core & Measurable)**
  These directly target *general* problem-solving adaptability, resist narrow specialization, and could feasibly anchor a benchmark.  
  1. **E. Resourceful goal-getting ("MacGyver criterion")**  
     *Why*: Forces creativity under constraints, testing cross-domain reasoning, tool-abstraction, and planning without relying on pre-learned patterns. Intelligence is fundamentally about achieving goals in novel, adverse scenarios.  
  2. **A. Transfer under distribution shift**  
     *Why*: Generalization beyond training data is a bedrock of intelligence. It directly measures robustness to novelty and structural inference, avoiding overfitting to specific domains.  

  ### **Tier 2: Strong but Flawed (Valuable but Partial or Tricky)**  
  These are hallmarks of intelligence but either risk narrowness, are hard to operationalize, or emphasize meta-skills over core capability.  
  3. **F. Intervention/observation discrimination**  
     *Why*: Causal reasoning is critical for intelligence, but this focuses on a *specific* cognitive skill (distinguishing observation from action). It's necessary but not sufficient alone.  
  4. **D. Self-calibration about its own limits**  
     *Why*: Metacognition ("knowing what you know") is key for reliable intelligence, but it’s secondary to *core capability* (e.g., a system could be ignorant but well-calibrated). Benchmarks could incentivize overcautiousness.  
  5. **G. Improvisation and transmission**  
     *Why*: Tests invention + cultural transmission (uniquely human traits), but it's highly domain-specific (e.g., inventing a game ≠ solving physics). Feels more like a *subset* of resourcefulness (E).  

  ### **Tier 3: Weakest Fits (Niche, Proxy, or Impractical)**  
  These are either proxies for other traits, too narrow, or impractical as *headline* criteria for *general* intelligence.  
  6. **C. Learning speed**  
     *Why*: Efficiency ≠ capability. A slow learner with high ceilings (e.g., humans) is smarter than a fast-but-shallow one. Highly dependent on the "reference learner" choice, making scores arbitrary.  
  7. **H. Answer-indistinguishability (Turing-style)**  
     *Why*: Prioritizes mimicry over understanding (e.g., today’s LLMs can fool humans without true comprehension). Easily gamed, anthropocentric, and conflates intelligence with social performance.  
  8. **B. Compression (Kolmogorov-style)**  
     *Why*: Theoretically profound (links to Occam, Solomonoff), but *uncomputable* and impractical for benchmarks. Also, highly compressed systems may lack transparency or flexibility (e.g., a lookup table vs. a reasoning engine).  

  ---

  ### **Key Insights**  
  - **Heaviest Weight**: **E (Resourceful goal-getting)**. It’s the most direct test of *generality*—demanding improvisation, abstraction, and planning in *any* novel environment. Intelligence is ultimately about agency in the face of obstacles.  
  - **Likeliest Proxy**: **H (Answer-indistinguishability)** is largely a proxy for **A (Transfer)** or **E (Resourcefulness)**. Fluently mimicking human answers requires strong generalization (A) and pragmatic adaptation (E), but adds noise (e.g., stylistic emulation).  
  - **Near-Duplicates**: **G (Improvisation)** feels like a special case of **E (Resourcefulness)**. Both test novel problem-solving, but E is broader (any goal vs. protocol invention).  

  ---

  ### **Missing Mark**  
  **Proposal: *Analogical Reasoning / Cross-Domain Abstraction***  
  - *What*: Ability to map relational structures from one domain to a dissimilar one (e.g., "electricity is like water flow").  
  - *Where it slots*: **Top of Tier 1**, alongside E and A. It’s core to human intelligence (Gentner, Holyoak) and enables generalization, creativity, and transfer. Without it, systems struggle with truly novel problems.  

  ---

  ### **Confidence & Uncertainty**  
  - **Overall Confidence**: **Moderate-High (7/10)**. The tier boundaries feel robust, but relative order *within* tiers is debatable (e.g., F vs. D).  
  - **Least Confident Placement**: **G (Improvisation/Transmission)**. I placed it in Tier 2, but it could arguably drop to Tier 3 if we see it as culturally niche, or rise if we equate "general intelligence" with human-like cultural cognition. Its dependency on *two* agents (inventor + receiver) also complicates benchmarking.  

  ### **Why This Order?**  
  The ranking prioritizes:  
  1. **Adaptability over efficiency** (E, A > C),  
  2. **Core reasoning over self-monitoring** (E, A, F > D),  
  3. **Behavior over superficial mimicry** (E, A > H),  
  4. **Measurability over theory** (A, E > B).  

  This reflects intelligence as *robust, goal-directed agency in novel environments*—not just skill acquisition (C), self-awareness (D), or data compression (B). Your colleague’s list is impressively comprehensive, but E and A stand out as the least anthropocentric and most benchmark-ready for *general* intelligence.  

  Would you like draft seminar questions or slides to frame this exercise?
