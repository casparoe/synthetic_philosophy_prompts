answer: |-
  ## Joint Statement on Causation by Omission: Adversarial Collaboration

  **Preamble:** We, undersigned representatives of the omission-inclusionist and omission-exclusionist perspectives on causation, acknowledge our fundamental disagreement on the metaphysical status of omissions as causes. However, through sustained adversarial collaboration, we have identified significant areas of agreement on the phenomena requiring explanation, the role of counterfactuals and norms, and the distinction between causal metaphysics and causal selection or responsibility. This statement outlines that common ground, clarifies the core disagreements, and identifies concrete cases that highlight the cruxes of our dispute. We agree that the disagreement is substantive, not merely verbal, concerning the fundamental nature of causation and what entities or non-entities can stand in causal relations.

  **I. Agreed Cases Requiring Explanation:**
  Both camps agree that any adequate theory of causation must account for the following phenomena involving absences:
  1.  **Ordinary Omissions:** Cases where an expected or normal action doesn't occur, leading to an outcome (e.g., not watering a plant causes its death; not applying brakes causes a crash).
  2.  **Prevention:** Cases where an action prevents an outcome that would otherwise have occurred (e.g., catching a falling vase prevents its breaking; administering an antidote prevents death). (Crucially, prevention often involves an *action* preventing an outcome, while the *failure* to prevent is an omission).
  3.  **Double Prevention:** Cases where an absence (or action) prevents something that would have prevented an outcome, thereby allowing the outcome (e.g., failing to cut the wire allows the bomb to detonate, where cutting the wire would have prevented detonation by preventing the timer's completion; a guard failing to stop an intruder who then disables the backup guard, allowing the theft).
  4.  **Substitute Causes / Preemption:** Cases where an omission occurs, but even if it hadn't, a substitute factor would have produced the same outcome anyway (e.g., Assassin A fails to poison the victim, but Assassin B (unbeknownst to A) was ready and would have succeeded if A hadn't been; failing to water the plant causes death, but a sudden, unexpected frost would have killed it that night regardless).

  **II. Agreed Claims:**

  1.  **Metaphysics of Absences:** Both sides agree that omissions (absences, non-occurrences, negative events) are not concrete, positive entities or events in the same way that actions or physical occurrences are. They lack spatiotemporal location, intrinsic properties, and causal powers in the sense that positive events possess them. Neither camp posits absences as "things" existing in the world like tables or collisions.
  2.  **Crucial Role of Counterfactuals:** Both sides agree that counterfactual dependence is *central* to explaining and identifying omissions. Specifically, the truth of the counterfactual "If the omitted action had occurred, the outcome would (or would likely) not have occurred" is necessary for the omission to be *relevant* to the outcome in the ways we care about (e.g., for responsibility, explanation). (Exclusionists often see this as *constituting* the relevant relation, while Inclusionists see it as evidence for a distinct causal relation).
  3.  **Causing vs. Allowing:** Both sides recognize a significant distinction between *causing* an outcome through positive action and *allowing* or *failing to prevent* an outcome through omission, even if they characterize the underlying relation differently. This distinction often tracks differences in moral responsibility, difficulty of intervention, and the presence of an active process.
  4.  **Causation ≠ Responsibility:** Both sides emphatically agree that causal claims (whether positive or negative) are distinct from moral or legal responsibility claims. An omission can be causally relevant (for Inclusionists) or counterfactually necessary (for both) *without* implying blame or responsibility (e.g., someone physically unable to water the plant), and vice-versa (e.g., someone culpably fails to water a plant that was already dead). Causal claims provide input to responsibility judgments but do not determine them alone; norms, capacities, intentions, and obligations are crucial separate factors.
  5.  **Causal Selection:** Both sides acknowledge the phenomenon of "causal selection" – the pragmatic, context-dependent, often norm-laden process of picking out *which* factor (among many necessary conditions) we label "the cause" in everyday discourse. An omission might be *selected* as "the cause" due to its salience, norm violation, or controllability, even if other necessary positive factors exist (e.g., oxygen for the fire). This selection is distinct from the metaphysical question of whether omissions *are* causes.
  6.  **The "Two Lifeguards" Case - Shared Description:**
      *   **Scenario:** Two lifeguards are on duty. Lifeguard 1 (LG1) is asleep and completely unaware of a swimmer drowning. Lifeguard 2 (LG2) is wide awake, sees the swimmer drowning, and deliberately chooses not to intervene. The swimmer drowns. Absent any intervention, the drowning was inevitable.
      *   **Agreed Facts:**
          *   The swimmer's death counterfactually depended on *the absence of rescue by a lifeguard*. If either LG had rescued, death would not have occurred.
          *   Both LGs failed in their duty (LG1 negligently, LG2 intentionally).
          *   LG2's omission is morally (and likely legally) worse than LG1's due to intentionality.
          *   In causal selection contexts (e.g., "What caused the death?"), LG2's omission is far more likely to be *selected* as "the cause" than LG1's due to the deliberate choice.
          *   There is a relevant counterfactual dependence: If LG2 had acted, death would not have occurred. The same is true for LG1.

  **III. Disagreements: Core Issues and Cruxes**

  | Disagreement                                                                 | Crux                                                                                                                                 | Concrete Case / Argument Bearing on Crux                                                                                                                               | Inclusionist Prediction/View                                                                                      | Exclusionist Prediction/View                                                                                             | Merely Verbal? |
  | :--------------------------------------------------------------------------- | :----------------------------------------------------------------------------------------------------------------------------------- | :---------------------------------------------------------------------------------------------------------------------------------------------------------------------- | :---------------------------------------------------------------------------------------------------------------- | :----------------------------------------------------------------------------------------------------------------------- | :------------- |
  | **1. Metaphysical Status of Omissions as Causes:** Can an absence (omission) itself be a genuine *relatum* in a causal relation? | What is the nature of the causal relation? Does it require relata that are positive events/states, or can absences stand in this relation? | **Double Prevention Test Case:** Ship A fails to destroy Mine B. Mine B would have destroyed Ship C. Ship C goes on to destroy Port D. Did Ship A's omission *cause* the destruction of Port D? | **Yes.** Ship A's omission allowed Mine B to be destroyed, which allowed Ship C to destroy Port D. The omission is a crucial link in the causal chain. | **No.** Ship C's action caused the destruction. Ship A's omission was merely the absence of a prevention; the causal relation holds between Ship C's action and the port's destruction. | **No**         |
  | **2. Role of Counterfactuals:** Is counterfactual dependence *sufficient* for causation, or merely evidence for it? | What is the relationship between counterfactual dependence and the causal relation? Does causation reduce to counterfactual dependence? | **Substitute Cause Case (Preemption):** Assassin A fails to poison Victim. Unknown to A, Assassin B was ready and would have poisoned Victim if A hadn't. Victim dies of poison (Administered by B). | **No (to sufficiency).** Victim's death counterfactually depends on A's omission (if A had acted, death wouldn't have occurred *via A*, but B would have acted). Yet A's omission did *not cause* the death; B's action did. Counterfactual dependence is not sufficient. | **Yes (sufficient, or dependence captures the causal relevance).** A's omission *was* a cause (or a causally relevant factor) because the death depended on it. B's action is also a cause. The outcome depended on both absences/actions given the setup. | **Partially** (Depends on how "cause" is defined; deeper ontological disagreement remains) |
  | **3. Causation in the "Two Lifeguards" Case:** Does each lifeguard's omission *cause* the death? | Does separating causal *status* (metaphysics) from causal *selection* (pragmatics) resolve the disagreement about omissions? | **The "Two Lifeguards" Case analyzed for causal *status* vs. *selection*.** Focusing purely on the metaphysics: Does LG1's sleeping *cause* the death? Does LG2's deliberate non-action *cause* the death? | **Yes (Both).** The absence of rescue *by a capable lifeguard present* caused the death. Both LGs' failures contributed to (or constituted) this absence. LG2's *action* of deliberate non-intervention might also be seen as a positive cause. | **No (Neither).** The drowning process caused the death. The absences (LG1 asleep, LG2 not acting) were necessary negative conditions. LG2's *decision* might be a positive mental event, but the *failure to rescue* is still an absence. The causal status is the same for both LGs: non-causal necessary conditions. | **No**         |

  **IV. Analysis of the Two Lifeguards Case & Residual Disagreement:**

  *   **Agreed:** Both camps agree that causal *selection* will overwhelmingly pick LG2's omission due to intentionality and norm violation. They agree LG2 bears greater moral responsibility. They agree the death counterfactually depended on the absence of rescue by *a* lifeguard (the disjunction of LG1 or LG2 acting).
  *   **Disagreement on Causal Status (Metaphysics):**
      *   **Inclusionists:** Argue that the absence of rescue *is* a cause of the death. While LG1 and LG2's specific absences might be different kinds of events (inactivity vs. deliberate forbearance), both absences contribute to the overall causal absence (no rescue) which caused the death. LG2's deliberate non-action might even be analyzed as a positive mental act causing the continued absence of rescue.
      *   **Exclusionists:** Argue that *neither* omission is a cause. The drowning process (water entering lungs, etc.) caused the death. The absences of LG1 and LG2 were necessary background conditions. The relevant counterfactual dependence holds (if *a* rescue had occurred, death wouldn't have), but this dependence does not indicate that the absences *caused* the death; it indicates that the positive cause (drowning) was not interfered with. The difference between LG1 and LG2 is purely in the realm of mental states, responsibility, and selection, *not* in the causal efficacy of their omissions. Both omissions have the *same* (non-causal) metaphysical status as absences.
  *   **Does Separation of Status and Selection Resolve the Disagreement?** **No.** While both camps agree *selection* differs (LG2 is picked), they fundamentally disagree on the underlying *causal status* of the omissions themselves. Exclusionists deny omissions *have* causal status at all; Inclusionists affirm they do. This disagreement about the fundamental nature of causation persists even after separating pragmatic selection.

  **Conclusion:** We concur that causation by omission involves intricate interactions between counterfactual dependence, normative expectations, and pragmatic context. We agree on the phenomena demanding explanation and on the critical distinction between causal claims and responsibility attributions. However, our core metaphysical disagreement regarding the admissibility of absences as genuine *relata* in causal relations remains unresolved. This disagreement manifests clearly in cases like double prevention and the "Two Lifeguards," even when causal selection is distinguished. The crux lies in whether causation fundamentally relates only positive events or whether the absence of positive events can also stand in that relation. This is not a verbal dispute but reflects a deep divergence in our understanding of the causal structure of the world. Future work should focus on the implications of these views for causation in physics, biology, and complex systems, and on refining the arguments surrounding double prevention and preemption.

  ---
