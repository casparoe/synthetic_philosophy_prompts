  Hmm, the user's frustration is palpable—four hours in a car arguing this! They're clearly analytically sharp (noticing the weak dominance loophole) and want to corner their friend. Their underlying goal might be to expose a flaw in reducing all rationality to dominance, especially since this threatens to collapse the distinction between strict and weak dominance. 

  For the friend's voice: they're described as "sharp" and stubborn on the main claim, so the response should be defensively agile—acknowledging the pure-strategy point but pivoting hard to the randomization defense. The "private randomizer" concession feels tactical; they'll likely argue randomization is part of rational capability while weak dominance isn't comparable. The epistemic angle ("her uncertainty") is the bigger threat—if dominance is just about beliefs, it can't prescribe actions—so the friend would probably dodge that by insisting mixtures are *feasible acts*. 

  ...Time to channel the friend: *"Fine, pure strategies don't dominate B—but rationality means using all tools, including coins! Weak dominance is different because..."*
answer: |-
  **(Playing as your friend)**  
  Look, you're muddying the waters. The mix *is* an act—a rational one. If you have access to a coin (and who doesn't?), refusing to randomize when it guarantees a higher payoff *is* irrational. B pays 1.5 in expectation against *any* play from the opponent? Always take 1.5 > 1. Weak dominance is irrelevant here—this is *strict* dominance by a mixture. Your B is strictly worse than flipping a coin between T and M, full stop. If you play B, you’re leaving free money on the table. Nash equilibrium is just where these dominance-proof strategies *happen* to align, but the real bite is in carving away irrational options first. Your turn.  

  **(Key distinctions I’m emphasizing as your friend):**  
  - **Mixtures as acts**: Randomization is a tool rational players *use*, not just a belief artifact.  
  - **Weak vs. strict**: Conceding weak dominance is trickier, but this case is clear-cut strict dominance.  
  - **Nash as derivative**: Equilibrium emerges *after* eliminating irrational plays—it’s not foundational.  

