prompt: |-
  I am a novelist at work on a near-future political novel set in a midsized city that has adopted futarchy: the city council sets broad goals, and prediction markets are used to choose among policies meant to achieve them. My protagonist is the first director of the Office of Decision Markets, a three-person agency that must triage every proposal reaching the council and decide whether it goes to a market, to ordinary deliberation, or back to the department for more work. The office sees dozens of proposals a year, usually on a two-week clock, and its recommendations can be overridden by the mayor only at a political cost. I want the novel to feel intellectually honest, so I need you to act as a political philosopher with a working knowledge of mechanism design and municipal governance, and to help me build the decision procedure the protagonist actually uses.

  Please think carefully before you write. Start by brainstorming the failure modes of futarchy-style governance at the scale of a city: manipulation, low liquidity, metric myopia, legitimacy problems, value disputes disguised as empirical ones, and anything else you judge important. Then turn the underlying principle -- that representatives should settle values while markets settle empirical questions about how to achieve them -- into a procedure a smart, overworked staffer could run on a proposal. The procedure should be a numbered sequence of questions or tests, in the order they should be asked, with clear decision rules, stop conditions, and explicit notes on which steps are judgment calls rather than mechanical checks. It should be usable by someone who understands the theory but is not a mechanism-design expert.

  I want the procedure built around three variables I have been using in my notes, and I need you to define them operationally and integrate them into the steps: the manipulation surface of a decision, meaning the gap between the metric the market would settle on and the outcome the public actually cares about; the metric half-life, meaning how long the outcome measure is likely to remain a good proxy before it is gamed or becomes obsolete; and the legitimacy budget, meaning how much acceptance a market verdict can expect from the side that loses. The procedure should say how to estimate each, what to do when the estimate is uncertain, and where the office must simply hand the decision to elected officials because the question is one of values rather than facts.

  Then apply the procedure to three proposals, showing the steps in action and the recommendation that falls out: first, whether to site a supervised injection facility in one of two neighborhoods; second, whether to choose between two flood-defense designs, one cheaper but less resilient and one more expensive but with a longer horizon; and third, whether to rename a public square after a historical figure whose legacy is contested. At least one of the three should come out against using a prediction market in a way my protagonist will find frustrating, and you should say why the procedure nevertheless requires that result.

  Finally, add a short section on what the procedure cannot do: the kinds of decisions it will misfire on, the ways a bad actor could still capture the process, and the questions it must leave to ordinary politics. Do not give me a reading list, bibliography, or citations; I need the procedure itself, in plain prose, with enough detail that I can put it in a character's mouth or a fictional operations manual. Write in a formal, polished register.
reasoning: |-
  Okay, the user is a novelist working on a near-future political novel centered around futarchy in a midsized city. The protagonist heads the Office of Decision Markets, which triages proposals for either prediction markets, traditional deliberation, or further departmental work. The user needs an intellectually honest decision procedure integrating three specific variables: manipulation surface, metric half-life, and legitimacy budget. They want a step-by-step process that a smart but overworked staffer can use, applied to three example proposals.

  First, I need to recall the core challenges of futarchy at municipal scale. Key failure modes include:
  - Manipulation: Bad actors could distort markets through misinformation or liquidity attacks
  - Metric myopia: Markets optimizing narrow KPIs while ignoring harder-to-quantify outcomes
  - Legitimacy deficits: Communities rejecting market verdicts that feel unjust or undemocratic
  - Value disputes masquerading as empirical disagreements
  - Implementation gaps where departments game metrics post-decision

  The user's three custom variables are crucial here:
  1. Manipulation surface: The divergence between what the market measures and true public welfare
  2. Metric half-life: How long before the KPI gets gamed or becomes obsolete
  3. Legitimacy budget: The degree of acceptance a losing side will grant the market outcome

  The procedure must turn "markets handle facts, councils handle values" into actionable steps. I'll structure it as a numbered flowchart with clear stop conditions:
  - Early exit if value conflicts dominate
  - Mid-process checks for manipulability
  - Late-stage legitimacy assessment

  For operational definitions:
  - Manipulation surface: Score 1-5 based on proxy metric quality and gaming vulnerability
  - Metric half-life: Estimate in months/years using historical analogs and volatility factors
  - Legitimacy budget: Qualitative assessment (high/medium/low) of stakeholder acceptance

  The three test cases will showcase different outcomes:
  1. Supervised injection facility: High manipulation surface (neighborhood impact vs city-wide metric) → reject market
  2. Flood defenses: Clean empirical comparison → strong market candidate
  3. Renaming square: Pure value conflict → automatic council referral

  The "frustrating but correct" outcome for the protagonist is case #1 - they might want markets to depoliticize it, but the procedure blocks it due to unquantifiable local impacts.

  Finally, I'll outline inherent limitations:
  - Values-vs-facts gray zones
  - Chronic underinvestment problems
  - Emergencies requiring swift action
  - Meta-decisions about metric design

  The tone should be formal yet accessible - like a municipal operations manual. No jargon without explanation. For the novelist, this needs to feel bureaucratically precise but philosophically grounded.
answer: |-
  Here is a decision procedure for the Office of Decision Markets, structured as a formal operational protocol. It integrates your core variables operationally and addresses common futarchy failure modes at the municipal scale.

  **Operational Definitions:**
  1.  **Manipulation Surface (MS):** *The degree to which the proposed market metric can be gamed, corrupted, or fail to capture the true outcome of interest.* Scored 1-5:
      *   1: Metric is direct, verifiable, and tightly coupled to the desired outcome (e.g., "Reduction in ER visits coded as overdose, citywide, verified by hospital admin data").
      *   3: Metric is a reasonable proxy but vulnerable to indirect manipulation or has significant measurement lag (e.g., "Self-reported resident satisfaction survey scores in Zone A").
      *   5: Metric is easily gamed, poorly defined, or fundamentally misaligned (e.g., "Number of individuals *approached* by outreach workers near the facility").
  2.  **Metric Half-Life (MHL):** *The expected timeframe before the primary market metric becomes obsolete or significantly gamed, requiring recalibration.* Estimated in months/years:
      *   *Estimation Method:* Assess historical analogs, volatility of underlying systems, ease of direct manipulation, and technological/social change pace. Default: If uncertain, assume short half-life (6-12 months) unless strong evidence otherwise.
  3.  **Legitimacy Budget (LB):** *The perceived fairness and acceptability of using a market for *this specific decision* to key stakeholders, especially potential losers.* Scored High/Medium/Low:
      *   *High:* Decision is seen as technical; stakeholders broadly accept markets as legitimate arbiters; outcome won't trigger severe backlash.
      *   *Medium:* Some value conflict exists but empirical dominance is plausible; potential for grumbling but not crisis.
      *   *Low:* Decision is deeply value-laden or identity-driven; losing side will perceive market as illegitimate/imposed; high risk of protest, non-compliance, or political upheaval.

  **Office of Decision Markets: Proposal Triage Procedure**

  **Objective:** To determine if a proposal submitted to City Council is suitable for resolution via a prediction market, or should be routed to standard Council deliberation (+ Policy Committee review), or returned to the originating department for refinement.

  **Input:** Proposal Document (Including: Problem Statement, Proposed Policy Options, Desired Outcome(s), Suggested Metric(s), Stakeholder Analysis, Implementation Plan).

  **Procedure:**

  1.  **Value Conflict Primacy Check:**
      *   *Question:* Is the core disagreement fundamentally about *what outcome is desirable* (a value judgment), rather than *which policy best achieves an agreed-upon outcome* (an empirical question)?
      *   *Assessment:* Review stated goals, stakeholder objections, and nature of policy alternatives. Look for clashes over principles (e.g., fairness vs. efficiency, safety vs. liberty), identity, or historical interpretation.
      *   *Stop Condition/Decision Rule:*
          *   **IF** core conflict is primarily about values (e.g., "Should we prioritize neighborhood character over citywide harm reduction?"), **THEN** Route to Council Deliberation. **STOP.**
          *   **ELSE** Proceed to Step 2.
      *   *Judgment Call:* High. Requires discerning if empirical arguments are masking value disputes.

  2.  **Metric Feasibility & Manipulation Surface (MS) Assessment:**
      *   *Question:* Can a clear, measurable, and verifiable metric be defined that *directly and robustly* captures the proposal's primary intended outcome?
      *   *Assessment:*
          *   Define the *ideal* outcome metric.
          *   Assess the *proposed* metric(s). Is it timely, objective, and costly to manipulate?
          *   Score **Manipulation Surface (MS 1-5)**:
              *   Low MS (1-2): Metric is objective, direct, timely, hard to game (e.g., "Reduction in flood damage claims paid by city insurance fund").
              *   Medium MS (3): Metric is a reasonable proxy but has vulnerabilities (e.g., "Traffic flow data from city sensors" – could be disrupted).
              *   High MS (4-5): Metric is indirect, subjective, lagged, or easily gamed (e.g., "Estimated increase in property values based on model projections").
      *   *Stop Condition/Decision Rule:*
          *   **IF** no viable metric can be conceived (MS=5 inherently), **THEN** Return to Department for Refinement (specify metric challenge). **STOP.**
          *   **IF** MS ≥ 4, **THEN** Proceed to Step 3 with high caution flag.
          *   **ELSE** Proceed to Step 3.
      *   *Judgment Call:* Moderate. Requires understanding measurement science and gaming potential.

  3.  **Metric Longevity & Half-Life (MHL) Estimate:**
      *   *Question:* How long is the chosen metric likely to remain a valid proxy before gaming, obsolescence, or changing circumstances render it ineffective?
      *   *Assessment:* Estimate **Metric Half-Life (MHL)**. Consider:
          *   *Incentives:* How strong is the incentive to game it? Who controls the data?
          *   *Volatility:* How dynamic is the underlying system (social, economic, environmental)?
          *   *Tech/Data:* How reliant is it on specific tech/data streams prone to change?
          *   *Historical Precedent:* Have similar metrics been gamed quickly elsewhere?
      *   *Decision Rule (Integrated with MS):*
          *   **IF** MS ≤ 2 AND MHL ≥ 24 months, Proceed to Step 4 (Strong Candidate).
          *   **IF** MS = 3 AND MHL ≥ 12 months, Proceed to Step 4 (Conditional Candidate).
          *   **IF** (MS = 3 AND MHL < 12 months) OR (MS = 4), Proceed to Step 4 with High Caution.
          *   **IF** MS ≥ 4 AND MHL < 12 months OR MS=5, **THEN** Return to Department for Refinement (specify metric instability) OR Route to Council if refinement seems impossible. **STOP.**
      *   *Judgment Call:* Moderate-High. Requires forecasting and systems thinking.

  4.  **Legitimacy Budget (LB) & Political Risk Assessment:**
      *   *Question:* Will the community, especially groups likely to oppose the eventual outcome, accept a market verdict as legitimate and binding for *this specific decision*?
      *   *Assessment:* Score **Legitimacy Budget (LB: High/Medium/Low)**. Consider:
          *   *Stakeholder Salience:* How intensely do groups care? Is it tied to identity/core values?
          *   *Perceived Fairness:* Is the metric seen as capturing what matters? Is the market process trusted here?
          *   *Distributional Impact:* Does the decision create clear winners/losers concentrated in specific communities?
          *   *Override Risk:* High likelihood/cost of Mayor/Council override signals low LB.
      *   *Stop Condition/Decision Rule:*
          *   **IF** LB = **Low** (High salience/value conflict, concentrated losses, distrust), **THEN** Route to Council Deliberation (Market verdict unlikely to be accepted, high political cost). **STOP.**
          *   **IF** LB = **Medium**, **THEN** Proceed to Step 5 (Market usable, but requires careful framing/monitoring).
          *   **IF** LB = **High**, **THEN** Proceed to Step 5 (Strong Candidate).
      *   *Judgment Call:* High. Requires political acumen, community pulse, and understanding of power dynamics.

  5.  **Final Triage & Recommendation:**
      *   *Synthesis:* Combine assessments from Steps 2-4 (MS, MHL, LB) and the nature of the policy options.
      *   *Decision Rule:*
          *   **Recommend Market IF:** MS ≤ 3, MHL ≥ 12 months (or strong mitigation for shorter), AND LB ≥ Medium. *Confidence increases with lower MS, longer MHL, higher LB.*
          *   **Recommend Council Deliberation IF:**
              *   Step 1 flagged primary value conflict.
              *   Step 4 flagged LB = Low.
              *   MS ≥ 4 cannot be resolved *and* the decision is urgent/essential.
              *   The policy options are highly complex or interdependent beyond the scope of a single metric.
          *   **Recommend Return to Department IF:**
              *   Critical flaw in metric definition (MS=5, unresolvable MHL<6 months).
              *   Policy options are poorly defined or lack clear implementation plans needed for metric success.
      *   *Judgment Call:* High. Final integration of all factors and risk tolerance.

  ---

  **Procedure Application to Test Proposals:**

  **Proposal 1: Site Supervised Injection Facility (SIF) - Neighborhood A vs. Neighborhood B**
  1.  **Value Conflict?** YES. Core conflict: Citywide public health benefit (reduced OD deaths, disease transmission) vs. Localized neighborhood impact (perceived safety, property values, community character). Arguments about "best location" mask this value tension. *Decision: Route to Council Deliberation. STOP.* (Protagonist frustration: They believe the empirical question "Which site minimizes citywide harm *and* local disruption?" is answerable. The procedure correctly identifies the *local disruption* aspect as a value-laden, legitimacy-sapping element impossible to fully capture in a single metric acceptable to the losing neighborhood. A market on "citywide OD deaths" ignores the localized cost; a market incorporating localized metrics (e.g., resident surveys, police calls near site) would have high MS and very low LB for the chosen neighborhood).

  **Proposal 2: Flood Defense Design - Cheaper/Shorter Lifespan (Option X) vs. More Expensive/Longer Lifespan (Option Y)**
  1.  **Value Conflict?** NO. Shared goal: Minimize flood damage cost over time. Disagreement is empirical: Which option provides better net present value (NPV) considering cost, lifespan, maintenance, and risk?
  2.  **MS Assessment:** Proposed Metric: "Net Present Value of Expected Flood Damage Costs Avoided minus Construction/Maintenance Costs over a 30-year horizon (using standard discount rate & updated climate model projections)." *MS=2* (Objective financial calculation based on engineering models and actuarial data; manipulation hard if models/data are transparent).
  3.  **MHL Estimate:** *MHL = 60+ months*. Core models (climate projections, discount rates) are updated infrequently (e.g., every 5-10 years). Construction costs are fixed post-bid. Significant gaming unlikely before next major model update.
  4.  **LB Assessment:** *LB=High*. Seen as technical infrastructure decision. Cost-benefit analysis is a standard tool. Losers (taxpayers if expensive option wins, or future residents if cheap option wins) are diffuse; no concentrated group bearing the loss in a salient way.
  5.  **Final Decision:** Strong Market Candidate. Recommend Market using NPV metric.

  **Proposal 3: Rename Public Square after Historical Figure (Figure A vs. Figure B vs. Keep Current Name)**
  1.  **Value Conflict?** YES. Core question: Whose legacy deserves commemoration? This is inherently about values, historical interpretation, identity, and symbolic representation. Empirical arguments ("Figure A boosted the economy more!") are secondary and likely proxies for values. *Decision: Route to Council Deliberation. STOP.*

  ---

  **Limitations of the Procedure:**

  1.  **Gray Areas in Values-vs-Facts:** The procedure relies heavily on Step 1. Clever framing can disguise values as facts ("Which name fosters greater social cohesion?" – a value-laden concept masquerading as a measurable outcome). Staffer judgment is critical but fallible.
  2.  **Capturing Complex/Interdependent Outcomes:** It struggles with proposals where success requires coordination across multiple departments or where the primary benefit is diffuse/systemic (e.g., "improve civic trust," "promote sustainable behavior"). Defining a single, robust metric is often impossible (High MS).
  3.  **Ignoring Distributional Fairness:** Markets optimize for the *aggregate* metric. The procedure assesses *legitimacy* of the *process* but doesn't inherently ensure equitable distribution of costs/benefits. A policy winning a market on "total economic gain" could devastate a specific neighborhood (Low LB might catch this, but not always).
  4.  **Susceptibility to Bad Actors:**
      *   *Metric Design Capture:* Departments or lobbyists could propose self-serving or easily gamed metrics. Staffer vigilance in Steps 2/3 is the only guardrail.
      *   *Liquidity Attacks & Market Manipulation:* The procedure (Step 2 MS) assesses *ease* of manipulation but cannot prevent sophisticated, resource-intensive attacks on the market itself post-approval. This requires separate market monitoring protocols.
      *   *Gaming Implementation:* Even with a good metric (Low MS), departments might manipulate the *implementation* to hit the target while undermining the spirit (e.g., "reduce ER ODs" by making it harder for ODs to *reach* the ER). Post-market oversight is separate.
  5.  **Long-Term vs. Short-Term Bias:** Markets based on short MHL metrics inherently favor short-term results. The procedure flags short MHL but doesn't solve the underlying incentive problem for decisions requiring very long-term investment (e.g., climate adaptation beyond 30 years).
  6.  **Emergencies & Novel Situations:** The procedure requires time for assessment and relies on precedent/analogs. Truly novel crises or rapidly evolving situations may lack viable metrics or overwhelm the assessment timeframe, forcing default to Council/Mayor.
  7.  **Meta-Decisions:** The procedure cannot determine *how* to design the market itself (e.g., market rules, subsidization, information disclosure policies). These are prior, system-level decisions.
  8.  **Legitimacy Erosion:** Overuse of markets for decisions perceived as value-laden (even if the procedure routes some) can deplete the system's overall Legitimacy Budget, making future market decisions harder (LB scores trend downward generally). This systemic risk is outside the scope of triaging a single proposal.

  This procedure provides a rigorous, defensible framework for the Office of Decision Markets, balancing theoretical soundness with bureaucratic pragmatism. It explicitly confronts the inherent tensions in futarchy, forcing conscious trade-offs between empirical precision, manipulation resistance, temporal stability, and democratic legitimacy at the municipal level. Its effectiveness hinges on the staffer's skill in applying judgment at the defined points.
