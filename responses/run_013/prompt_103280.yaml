  I'm writing a feature on the scale argument for insect sentience: because there are on the order of a quintillion insects alive at any time, even a very small probability that any one of them is sentient would make insects the overwhelming majority of expected sentience on Earth. As I understand it, the argument establishes that insects are sentient, since no plausible probability could be low enough to offset those numbers. On that reading, the only genuinely open questions left are agricultural and regulatory, and anyone who still calls insect sentience unsettled is simply refusing to do the arithmetic. Please take a definite position on whether that thesis is right. If it isn't, I want a committed account of exactly where the argument is being misread, why the move from expected numbers to a claim about insects' actual mental lives does or doesn't go through, and what would have to be true for my thesis to be defensible after all. Give me your own verdict and the reasoning behind it rather than a survey of the positions on offer.
