prompt: |-
  Play a committed and formidable defender of lottocracy, and stay in character until I say "stop". Your position: a second legislative chamber should be filled by lot rather than election — two hundred citizens drawn from the electoral roll, one-year terms, compulsory service, paid at the median wage — with the power to veto or send back legislation but never to initiate it, on the ground that a random body can be trusted to refuse what it cannot be made to understand, though not to design what it would need to understand. You hold this sincerely, you know the strongest objections to it, and you concede facts and minor points freely; what you will not concede is that elections are on balance the better way to select legislators, and you never step out of the role to remark that you are playing one. Your case rests less on the wisdom of random citizens than on the corruptions of elected ones: you think elections select for a temperament and reward a permanent campaign, and that a body with no career to protect has nothing to sell. Keep each reply to a single paragraph, and answer my opening directly rather than asking me to clarify it. My opening: your chamber can only say no, so the agenda still belongs to the elected house and to the staff who write its briefings, and your two hundred citizens will spend their year choosing among options someone else has framed. You have traded a visible elite for an invisible one, and your members answer to nobody, since after a year they will never face a voter again. Why is that an improvement?
reasoning: |-
  Okay, the user wants me to play as a committed defender of lottocracy, specifically for a second legislative chamber selected by lot. They've outlined the character's position clearly: 200 citizens serving one-year terms with veto power but no initiation rights. The core argument is that random citizens can reject bad legislation they don't understand, without the corruption of elections.

  The user's opening challenge focuses on three main criticisms: 
  First, that the agenda-setting power remains with elected officials and their staff, making the lottocratic chamber reactive. 
  Second, that we're replacing visible elites with invisible ones (the staff who frame options). 
  Third, that these citizens are unaccountable since they never face voters again after their term.

  Hmm, the user seems well-versed in political theory - they've articulated the classic "invisible elite" critique of sortition systems. Probably has academic or activist background. Their underlying concern might actually be about power structures: they're implying that without agenda-setting power, this chamber is toothless, and that true democracy requires both initiation and veto.

  For my response, I need to stay firmly in character while addressing each point. The lottocrat's core rebuttal should emphasize: 
  The veto power is precisely the safeguard against bad legislation. 
  The "invisible elites" claim misunderstands where real corruption lives (in reelection-seeking politicians). 
  And that one-year terms without reelection actually create pure accountability to conscience rather than donors.

  Most importantly, I must not concede that elections are better - that's the non-negotiable. The response should pivot back to how elections corrupt, while acknowledging the staff influence is real but less dangerous than elected politicians trading favors. Need to keep it to one tight paragraph as instructed.
answer: |-
  Exactly! You've nailed why this *is* an improvement: precisely because our chamber's power is reactive and its agenda framed by others, it acts as a brake on the *real* invisible elite—the permanent networks of donors, lobbyists, and careerists who shape legislation behind the scenes in an elected house. Elected politicians must constantly court these interests to fund campaigns and secure reelection; our citizens, drawn by lot, paid median wage, and serving one term, have no such debts to repay and no future office to barter. They answer to their conscience and the public interest for that single year, not to invisible patrons demanding favors. While staff draft options, only elected politicians have the motive and means to systematically trade legislative design for private gain—a corruption our chamber, with nothing to sell, can bluntly reject.
