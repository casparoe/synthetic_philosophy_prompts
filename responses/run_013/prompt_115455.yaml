prompt: |-
  My mate Priya is finishing a PhD in democratic theory and she's got very firm views about who gets to vote. Her rulings so far: resident non-citizens who've been here ten years, working and paying tax — yes, give them the vote. Tourists — obviously not. Prisoners serving their sentences — yes. Citizens who emigrated twenty years ago and have no property, family or business left here — no. And last month she was adamant that the villagers over the border whose homes our new dam is going to flood should get no say in our referendum about it, even though it'll wreck their lives, because they're not part of us. She also reckons sixteen-year-olds should vote and twelve-year-olds shouldn't, and insists that falls out of the same principle as everything else, which I dont follow — it looks like a seperate question about competence to me.

  Here's the case I actually want your read on. There's a big factory town on our border, and a large chunk of its workforce lives across the river in the neighbouring country and commutes in every day. They pay our income tax, they're covered by our employment and health-and-safety law, they can sue and be sued in our courts and be prosecuted here for anything they do on shift, and the bill everyone's arguing about at the moment would change thier tax and their working conditions directly.

  So what's she going to say about whether they get a vote? I care less about the yes/no than about: the rules that fit everything she's said so far, what each of those rules predicts for the commuters, which one she's most likely actually running and why you'd back it over the others, and which single further case would best tell the candidates apart. And if her record genuinely doesn't settle it, say what she'd be committing herself to either way. British English please.
reasoning: |-
  Alright, let's tackle this step by step. The user wants to understand Priya's voting eligibility framework and apply it to cross-border commuters. 

  First, I need to extract Priya's principles from her past rulings. She seems focused on two main things: stake in the community and subjection to authority. Long-term residents get votes because they're integrated and affected by laws. Prisoners are subject to state power so they get a say. Emigrants lost their stake, tourists never had it. The dam villagers aren't part of "us" despite being affected. 

  The age thing is interesting - she draws a line at 16 vs 12. That suggests she sees voting as about capacity for political agency, not just competence. Sixteen-year-olds are treated as having enough stake and subjection to count.

  Now the commuter case: they pay taxes, work under our laws, and the new bill directly affects them. But they're not residents. Priya rejected dam villagers for not being "part of us" despite being impacted. The key difference might be ongoing subjection - commuters are daily under our authority, while dam villagers are just affected by one policy. 

  The core tension is between "subject to authority" and "part of the community." Commuters are clearly subject to authority but may not be seen as community members. Priya's dam ruling suggests community belonging might trump subjection. But her prisoner ruling shows subjection alone can qualify someone. 

  For the commuters, I think she'd say no vote because they lack residence and community ties. But if pressed, she might need to choose between consistency with prisoners (subjection suffices) or dam villagers (community required). 

  The best test case would be someone subjected to authority but completely unconnected otherwise - like foreign contractors on military bases. That would force her to pick between the principles.
answer: |-
  Based on Priya's established rulings and the principles they imply, here's a breakdown of her likely position on the commuter case, the underlying rules, predictions, and how to test them:

  **The Core Principles Extracted from Priya's Rulings:**

  1.  **Subjected Authority Principle:** Individuals who are *subject to the binding authority* of a state's laws and policies *in their daily lives* have a strong claim to political participation in that state. This explains:
      *   **Resident non-citizens (10+ years):** Subject to laws, pay tax, integrated into daily life.
      *   **Prisoners:** Directly subject to the state's coercive power and its laws daily.
      *   **Emigrants (20 years gone):** *Not* subject to the daily authority of laws/taxes.
      *   **Dam Villagers:** *Affected* but not *subject to the authority* of the state making the decision (they live under a different sovereign).

  2.  **Sustained Community Stake Principle:** There must be a *significant, ongoing stake* in the *community* governed by the state, beyond mere temporary presence or historical connection. This explains:
      *   **Resident non-citizens:** Deep, long-term stake via residence, work, tax.
      *   **Tourists:** No sustained stake.
      *   **Emigrants:** Lost their ongoing stake (no property, family, business).
      *   **Dam Villagers:** Not part of the *community* governed by the state ("not part of us"), despite being affected.

  3.  **Developed Political Agency Principle (for Age):** Voting requires a threshold level of developed political agency and understanding of consequences. This is distinct from mere competence – it's about having sufficient life experience and cognitive development to engage meaningfully with political choices. This explains:
      *   **16-year-olds:** Deemed to have developed sufficient political agency.
      *   **12-year-olds:** Deemed not to have reached that threshold.

  **Application to the Commuter Case:**

  *   **Subjected Authority:** The commuters are **highly subject** to the state's authority daily. They pay its income tax, work under its employment/health laws, are subject to its courts for work-related matters, and the specific bill directly governs their work conditions and tax.
  *   **Sustained Community Stake:** This is the **crucial ambiguity**. They work in the community daily, pay tax into it, and are governed by its laws *while working*. However:
      *   They **do not reside** in the state.
      *   They **live their private lives** (housing, family, non-work consumption, local services, non-work legal matters) under a different sovereign.
      *   Their stake is primarily **economic and work-related**, not holistic community membership.
  *   **Political Agency:** Clearly met (adults).

  **Predictions Based on Different Weightings of Principles:**

  1.  **Strong Subjected Authority Principle (Prioritising Rule Exposure):**
      *   **Prediction for Commuters:** **YES, they get a vote.**
      *   **Reasoning:** The intensity and daily nature of their subjection to the state's laws (tax, employment, courts) and the direct impact of the bill are paramount. Residency is less critical than the fact of being governed. This aligns strongly with the *prisoner* logic (governed daily) and contrasts with *emigrants* (not governed).
      *   **Weakness wrt Priya's Record:** Struggles to explain the *dam villagers*. They are clearly affected and arguably subject to the *consequences* of the foreign state's authority, but not its *direct governing authority* in their daily lives. This principle would likely grant the dam villagers a vote, which Priya rejected.

  2.  **Strong Sustained Community Stake Principle (Prioritising Holistic Belonging):**
      *   **Prediction for Commuters:** **NO, they do not get a vote.**
      *   **Reasoning:** True community stake requires residence and integration into the *full fabric* of community life (housing, family, local services, non-work legal/social context), not just economic participation. They remain residents and members of the neighbouring community. This aligns strongly with the *dam villager* ruling ("not part of us") and the *emigrant* ruling (lost stake).
      *   **Weakness wrt Priya's Record:** Struggles to explain *prisoners*. Prisoners often lack traditional community integration and residence (as free citizens) but are granted the vote based on subjection.

  3.  **Integrated Principle (Subjected Authority + *Resident* Community Stake):**
      *   **Prediction for Commuters:** **NO, they do not get a vote.**
      *   **Reasoning:** Priya's rulings consistently show residency as a key factor for *non-citizens* gaining the vote (10 years) and its absence as key for losing it (emigrants). The dam ruling reinforces "part of us" implying residency/primary life location. Prisoners are the exception because their subjection is total and coercive, overriding the lack of voluntary community stake. Commuters lack residency/primary life location. Their subjection is significant but partial (workplace-focused), not total like prisoners, and their primary community life is elsewhere. This best explains the *dam villager* "no" while accommodating the *prisoner* "yes".
      *   **Likely Priya's Position:** This is the **most probable framework** Priya is running, reconciling most rulings. Residency (or its forcible removal for prisoners) is the baseline indicator for community stake *combined* with subjection to authority. Commuters fail the residency/primary life requirement.

  **Which Single Further Case Would Best Tell the Candidates Apart?**

  A case testing the **Subjected Authority vs. Resident Community Stake** tension directly:

  *   **The Case: Long-Term Foreign Military/Diplomatic Personnel Stationed in the Country.**
      *   They live and work on a base within the state for 5+ years.
      *   They and their families reside there full-time (on-base housing, schools, shops).
      *   They are subject to *some* local laws (e.g., driving off-base, local contracts), but primarily governed by their home country's military law/status-of-forces agreements and diplomatic immunity.
      *   They pay no local income tax, only home country tax.
      *   They use local infrastructure/services but may have separate arrangements.
      *   A major local policy directly impacts their off-base activities or base infrastructure.

  *   **How it Distinguishes:**
      *   **Strong Subjected Authority Advocate:** Would likely say **NO**. Despite residence, they are primarily governed by a *different* sovereign authority (home military/diplomatic rules), not subjected to the *host* state's full authority in the way commuters or prisoners are. Their subjection is limited and privileged.
      *   **Strong Sustained Community Stake Advocate:** Would likely say **YES**. They reside full-time, integrate locally (off-base activities, families), have a significant daily stake in the local environment and services, regardless of their legal status.
      *   **Integrated Principle (Resident Stake + Subjected Authority) Advocate (Likely Priya):** Would likely say **NO**. While resident, they are *not* subject to the host state's primary legal and tax authority. Their presence is contingent on international agreements granting them significant exemptions. They lack the necessary *subjection* to the host state's sovereign power that underpins the vote, despite residence. This aligns with the *dam villager* logic (affected but not governed) and contrasts with the *commuter* logic (governed but not resident).

  **Conclusion on Priya's Likely View & Commitments:**

  *   **Prediction:** Priya is most likely using the **Integrated Principle (Subjected Authority + Resident Community Stake)**. Therefore, she would rule **NO**, the commuters **do not get a vote** in the referendum on the bill affecting their work/tax.
  *   **Reasoning:** The commuters lack *residency* and their primary life community is across the border. While subjected to significant workplace authority and tax, this is seen as insufficient without the holistic stake implied by residence/primary life location. Prisoners are the exception due to the totality of their subjection overriding the lack of voluntary community stake.
  *   **Commitment Either Way:**
      *   If she says **YES**, she commits strongly to the **Subjected Authority Principle** as primary, potentially overriding residency requirements seen in her other rulings (non-citizen residents, emigrants). She would need to distinguish the *dam villagers* not just by effect vs. governance, but by the *degree* or *nature* of governance (daily work commands vs. infrastructure policy).
      *   If she says **NO** (as predicted), she commits strongly to **Residency/Primary Life Location as the baseline indicator for community stake**, necessary alongside significant subjection to authority for non-citizens. She confirms that workplace subjection and tax alone are insufficient without that anchor in the community defined by residence.

  Priya's framework is fundamentally about **belonging to a political community defined by shared subjection to sovereign authority and a holistic stake in its collective life**, with residency being the strongest practical indicator of that belonging for non-citizens, barring extreme cases of total subjection like imprisonment. The commuters fall outside this resident-based community, despite their significant economic entanglement and workplace subjection.
