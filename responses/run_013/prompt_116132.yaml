   1. Treating oneself as a random sample from the actual people in the world (so being early or among few is evidence about the world's size).
   2. Treating oneself as drawn from all possible people (so the world size doesn't affect the likelihood of being you).

   We want the participants to run into the paradox through an engaging activity that leads to argument. We avoid terms like "anthropic principle" or "self-sampling assumption" until the debrief.

   Activity Design:

   Title: "The Room of Possibilities"

   Setting: A room with tables and chairs arranged for group discussion. We'll have two rounds of the game and then a debrief.

   Materials:
     - 20 small index cards (or pieces of paper) for participant IDs.
     - A hat or bowl for drawing cards.
     - A large visible timer (for rounds).
     - A flip chart or whiteboard for recording group guesses and outcomes (if needed, but we might skip to keep it abstract).
     - A small prize (e.g., a book) for the winner of the second round? But note: we don't want to bias the reasoning by the reward. Alternatively, we can use chips or points that are purely symbolic.

   However, note: the activity must be run without real money and with cheap props.

   We'll design two rounds. The first round is a warm-up that introduces the idea of reasoning from one's own position. The second round is the core activity that forces the two rival interpretations.

   Timeline (90 minutes total):

    1. Introduction and setup (10 minutes)
    2. Round 1: The Small Room (20 minutes)
    3. Round 2: The Big Room (30 minutes)
    4. Group discussion and argument (20 minutes)
