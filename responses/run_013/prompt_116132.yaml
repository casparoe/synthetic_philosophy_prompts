    Prose for the activity:

      Introduction (10 minutes):

          "Welcome to the Room of Possibilities! Today we are going to play two games that involve reasoning about the world based on your own position in it. The rules might seem a bit abstract at first, but I'll walk you through. There are no right or wrong answers, but there will be points and a prize for the winner. And we will have a lot to discuss.

          First, let's do Round 1: The Two-Room Game.

          Imagine that we are in a world that is either small or large. I flipped a coin to decide: heads for small, tails for large. In the small world, there is only one room with 10 people. In the large world, there are two rooms: Room A and Room B, each with 10 people. We are in one of these rooms. If the world is large, I flipped another coin to decide if we are in Room A or Room B.

          Now, I have a hat. If the world is small, the hat contains 10 cards, numbered 1 to 10. If the world is large and we are in Room A, the hat contains 10 cards numbered 1 to 10. If we are in Room B, the hat contains 10 cards numbered 11 to 20.

          [I have already flipped the coins and prepared the hat accordingly. Now, each of you will come up and draw a card. Don't show it to others! Then, based on your number, you will guess whether the world is small or large. Write your guess on a piece of paper along with a brief reason.

          After everyone has guessed, I will reveal the world. If your guess is correct, you get 1 point.

          Let's draw the cards."

          [Participants draw cards. They write their guess and reason. Then reveal the world. Record points.]

      Round 2: The Doomsday Game (30 minutes):

          "Now, Round 2: The Doomsday Game. This time, the world is either small (with only 200 people in total) or large (with 2000 people in total). I flipped a coin to decide which. Then, we selected one person at random from the entire population of that world. We are going to tell you the birth rank of that selected person. Birth rank means the order in which they were born: 1 is the first, 200 is the last in the small world, and 2000 is the last in the large world.

          The selected person has birth rank 150. [Write "150" on the board.]

          Now, split into four groups of five. You have 10 minutes to discuss: based on this birth rank, is the world more likely to be small or large? Each group must agree on a guess and a reason. Then we'll hear from each group.

          After that, I will reveal the world. Each member of a group that guesses correctly gets 5 points.

          [Split into groups. After 10 minutes, each group reports. Then reveal the world. Award points.]

      Group Discussion (20 minutes):

          "Let's have a whole-group discussion. What reasoning did your group use? Did you all agree? What were the arguments for and against? Let's hear from each group briefly.

          [Facilitate discussion, encouraging them to notice the two lines of reasoning.]

          One argument: '150 is a high number in the small world (it's near the end) but a low number in the large world (it's early). So it's more likely to be small.'

          Another argument: 'But the large world has 10 times as many people, so isn't it more likely that we would be in the large world? That might cancel out the first effect.'

          Did anyone have that? What do you think?"

      Debrief (10 minutes):

          "This is not just a game. Philosophers and physicists have been arguing about this for decades. The core idea is called the anthropic principle: what can we infer about the universe based on our own existence?

          In the first round, when you had a low number and thought the world was more likely small, you were using what's called the self-sampling assumption: you treated yourself as a random observer in your world.

          In the second round, the argument about the number of observers is called the self-indication assumption. It says we should consider ourselves as drawn from all possible observers, so worlds with more observers are more likely.

          These two approaches can lead to opposite conclusions. A philosopher named Brandon Carter first discussed this in the context of the Doomsday argument: if we are typical humans, then we should be in the middle of human history, which would suggest that humanity will end soon. But the counterargument is that there might be many more humans in the future, and we are just the early ones, but the large number of future humans makes it more likely that we are early.

          We don't have a resolution, but I hope you experienced the puzzle.

          Finally, let's add up the points and award the prize."

