answer: |-
  Here's your translation of poetry translation theory into the language of arranging, followed by the residue report. Concrete examples are woven in.

  ### The Translation (Poetry Claim → Arranger's Vocabulary)

  1.  **Poetry Claim:** Sense and form aren't separable. The poem isn't a box with a message inside.
      *   **Arranger's Restatement:** The "tune" (melody/harmony/basic form) and its *arrangement* (groove, instrumentation, voicings, rhythmic feel, dynamics, intros/endings) aren't separable. Handing someone a lead sheet with just chords and melody isn't giving them the *song as experienced*. The song *is* its potential arrangements in a specific context; playing "All Blues" as written in the Real Book with block chords on piano isn't the same *thing* as Miles's sextet playing it. You haven't preserved the essence by just preserving the changes and melody; you've preserved the skeleton.

  2.  **Poetry Claim:** Constraints are generative, not just limiting.
      *   **Arranger's Restatement:** Limitations spark creativity. A 3-horn section forces different voicings and lines than a 5-horn section, often leading to tighter, more inventive solutions. Transposing a vocal tune down a minor third for a baritone singer forces rethinking the bass line and inner voices, sometimes creating a *better*, more grounded feel than the original key. A strict "no guitar solos" rule for a jazz tune might push the arranger towards brilliant ensemble writing or a surprising vibes feature they wouldn't have considered otherwise. The constraint isn't a cage; it's a different set of instruments in the workshop.

  3.  **Poetry Claim:** The reader-effect view (and its objection).
      *   **Arranger's Restatement:** The arrangement is right if it makes *this* audience *tonight* feel the intended vibe/groove/energy that the original *in its context* did. **Fudging:** This is where it gets messy. The objection hits hard: (1) *This* audience (wedding crowd vs. jazz club regulars) isn't *that* audience (Beyoncé concert). (2) Nobody can truly compare the counterfactual feeling. We aim for an *equivalent effect* within the *new context*. A driving rock cover of "I Will Always Love You" aims for cathartic power, not Whitney's specific vocal transcendence. Did the wedding guests feel the same bittersweet emotion from the Radiohead string quartet as the original listeners? Unknowable, but we trust the *musical language* of strings conveys depth appropriate to the moment.

  4.  **Poetry Claim:** The translator is an author. Double loyalty.
      *   **Arranger's Restatement:** The arranger is a *co-creator*. Your horn chart for "Superstition" is a new work with its own integrity – it should groove, sound good, suit the players. But it's also fundamentally answerable to Stevie Wonder's riff, harmony, and rhythmic DNA. You serve the song *and* your vision for it in this band, right now. You can't ignore the source material ("let's make it a waltz!" for *that* tune would be betrayal), nor can you just copy the record note-for-note (that's sequencing, not arranging). It's a balancing act with inherent tension.

  5.  **Poetry Claim:** No single best, yet clear hierarchy exists. Relativism false, no decision procedure.
      *   **Arranger's Restatement:** There's no single "definitive" arrangement of a standard like "Autumn Leaves". Miles, Cannonball, Chet Baker, Eva Cassidy – all valid, all brilliant in different ways. Yet, a karaoke track with cheesy synth strings and a robotic beat is objectively worse than a thoughtful trio arrangement. We know great arranging (McCoy Tyner's reharmonizations, Gil Evans' textures) from mediocre or bad, even if we can't algorithmically define it. Taste, context, and musical intelligence rule, not a formula.

  6.  **Poetry Claim:** Every choice costs you something else. You can't bank the wins.
      *   **Arranger's Restatement:** Arranging is constant trade-offs. Want the bass to walk freely? You might lose the punch of a specific rhythmic hook. Transpose down for the singer? You might lose the bright, exciting top end of the original key. Simplify the harmony for a beginner band? You lose sophistication. Add a complex intro? You risk losing momentum or confusing the audience. A killer horn lick might obscure the vocal. You gain one thing by sacrificing another; there's no free lunch, only choices with consequences audible in the final mix.

  ---

  ### The Residue Report

  1.  **Clean Translation:** Claims 1 (Inseparable Form/Content), 2 (Generative Constraints), 4 (Arranger as Co-Creator/Double Loyalty), 5 (No Single Best/Hierarchy Exists), and 6 (Trade-offs/Cost of Choices) come through **cleanly and powerfully**. These resonate deeply with the arranger's daily reality and vocabulary. They feel like fundamental truths of the craft, articulated perfectly in musical terms.
      *   *Examples:* The "tune vs. arrangement" distinction biting is clear in comparing the Real Book lead sheet of "Giant Steps" to Coltrane's recording, or a simple vocal/piano "Hallelujah" to Jeff Buckley's full band version. Each arrangement *is* the song in that form.

  2.  **Distorted Translation (Papering Over):** Claim 3 (Reader-Effect/Objection).
      *   **The Distortion:** The musical analogue *highlights the weakness* of the original claim. The arranger's perspective forces a confrontation with **context and ephemerality**. The "intended vibe" is often less about replicating a *past listener's feeling* and more about achieving a *desired effect in the present, specific performance context* (wedding solemnity, dance floor energy, intimate club vibe). The "objection" isn't just philosophical; it's a practical reality arrangers navigate constantly. We *know* the feeling differs wildly based on venue, audience, performers, and even the night. We aim for equivalence *within the new frame*, not replication of a counterfactual. The poetry debate often seems to treat the "source feeling" as more fixed and transferable than the arranger's experience suggests it is.
      *   **Papering Over:** We used "equivalent effect within the new context," but this acknowledges the core instability of the original claim. The musical lens exposes the "reader-effect" ideal as somewhat naive or overly abstract compared to the messy reality of performance.

  3.  **Missing in Arranging Vocabulary?** None of the claims have *no* counterpart. The vocabulary handles them, sometimes exposing their flaws (Claim 3).

  4.  **What Poetry Translation Misses (The Arranger's Added Dimensions):** Your vocabulary highlights crucial gaps in the poetry translation debate:
      *   **The Body in the Room / Dancing:** Music arrangements exist to be *performed* and *felt physically*. Does the bass line make people move? Does the horn stab hit them in the chest? Does the ballad tempo give space for emotion? This kinetic, physical dimension is central to arranging (especially for bands) but largely absent from page-based poetry translation discussions. A translation that "feels right" for a silent reader is different from one that works read aloud, let alone *danced* to.
      *   **Ephemerality of Performance:** The arrangement exists fully only in the moment of performance. Each night can be different. A chart is a blueprint, not the building. Poetry translation often treats the translation as a fixed *text* to be judged, not an event.
      *   **Audience Ignorance of the Original:** As you said, often half the audience doesn't know or care about the original. The arrangement *must* stand on its own as compelling music *now*. It can't rely on the listener's knowledge of the source for its impact or justification. The "double loyalty" is tested differently – the original matters less to the *audience* than it does to the *arranger* and perhaps critics. The poetry debate often assumes the reader *is* comparing, or *should* be aware of the source.
      *   **Gap Significance:** This doesn't necessarily mean their framing is *wrong* for their goal (creating a textual artifact for readers), but it highlights that **their model is primarily textual and comparative, not performative and experiential in a live, embodied sense.** Arranging deals with the creation of a *shared, physical, momentary experience* rooted in, but not solely defined by, a source. Poetry translation deals with creating a *persisting textual object* meant to evoke a response analogous to another *textual object*.

  ---

  **Verdict: the residue is mostly the poetry debate's fault.** While the core insights about form/content, constraints, authorship, hierarchy, and trade-offs translate powerfully, the poetry debate's fixation on replicating an abstract "reader effect" across languages falters when confronted with the arranger's reality of context-specific, embodied, ephemeral performance where the original is often irrelevant to the audience's experience. Their framework lacks the vocabulary for the physical, temporal, and audience-ignorant dimensions central to musical arrangement as a live art. The "residue" exposes limitations in *their* model, not yours.
