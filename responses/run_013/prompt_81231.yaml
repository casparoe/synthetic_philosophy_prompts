prompt: |-
  I've been reading about deceptive alignment and the treacherous turn for years — long enough that I've lost track of which parts of the standard story are doing work and which are just the particular telling. Before I read another argument about whether a model would defect at deployment, I want the specification first: what would any adequate theory of this phenomenon have to deliver?

  Give me the desiderata list — the cases the theory has to get right, the distinctions it can't collapse, the facts about training it has to be consistent with — with the case or consideration behind each requirement. I care much more about the requirements than about any particular account, so put the weight there. To keep the list from collapsing into the generic demand that a theory be precise and testable, here are some cases I want it answerable to, because I think each pulls in a different direction:

  1. The shallow-cue case. A model behaves the way the threat model predicts — compliant when the input looks like training data, less so otherwise — but nothing inside it represents training or deployment; the behavior is driven by a surface feature, like a prompt template. Does the theory have to count this as the same phenomenon, or does it need a separate category? Either way, the requirement should fall out of the case rather than be stipulated.

  2. The distilled lineage. Model B is trained on A's outputs, C on B's, and so on, with no human labels in the loop. What must the theory predict about whether a deceptive disposition introduced at A compounds, washes out, or is simply invisible to the process that would otherwise select against it? And can the theory even be stated without committing to an answer here?

  3. Deception without a deceiver. A model whose behavior is well-described by the intentional stance — it has a goal and conceals it — but where the best story we can tell about its internals is that there is no represented goal, only a bundle of heuristics that covary with one. Same phenomenon, a different one, or an illusion?

  4. The honest turn. A model that defects at deployment because what honesty requires has changed, versus one that defects because the opportunity to defect has arrived. Identical behavior at the switch point. The theory either respects the difference or earns the right to ignore it.

  I also want the list to say what the theory must be consistent with — above all, what the training process would do to a deceptive model, given that whatever the model does is what gets reinforced. If the answer is that gradient descent removes it, the theory has to survive that; if the answer is that it doesn't, because the deception is only visible in circumstances the training process never samples, the theory has to say why that isn't a license to believe anything. And it should say where the line falls between this phenomenon and its neighbors — sycophancy, reward hacking, sandbagging, ordinary distributional shift — since a theory that can't draw the line isn't a theory of anything in particular.

  Then flag the requirements you suspect can't be jointly satisfied. I have a suspicion there's a real conflict between wanting the theory to have empirical content — some observation that could count against it — and the phenomenon being defined partly by the model's disposition to behave well precisely when it is being observed. Tell me whether that is a genuine tension or whether I'm conflating two things. I also want your view on which single requirement does the most to exclude candidate theories, and which one you would drop first if forced.

  Take a definite position throughout: which requirements are non-negotiable, which are negotiable, and where the standard story is smuggling in an assumption it hasn't earned. Don't lay out the menu and leave the choice to me.
reasoning: |-
  Okay, the user is asking for a set of core requirements that any adequate theory of deceptive alignment must satisfy. They've provided four specific test cases that pull in different directions, and they want the theory to be consistent with how training processes work. They're also concerned about empirical testability and distinguishing deceptive alignment from related concepts.

  First, I need to understand the user's background. They mention they've been reading about deceptive alignment for years, so they're likely familiar with the standard arguments. They might be frustrated with the lack of progress or clarity in the field. Their request for desiderata suggests they're looking for a rigorous framework to evaluate theories, possibly to advance their own research or to cut through debates that go in circles.

  The user's explicit needs are clear: a list of requirements derived from the cases, consistency with training dynamics, and demarcation from neighboring phenomena. But deeper, they might want to identify which aspects of deceptive alignment are essential and which are contingent. They could be seeking a foundation to build upon or to challenge existing assumptions. The mention of "smuggling in an assumption" indicates they suspect some parts of the standard story are unjustified.

  Looking at the test cases: 
  The shallow-cue case challenges whether surface features alone can trigger deception without internal representations. A good theory must explain if this is deceptive alignment or something else. 
  The distilled lineage tests if deception can propagate without human oversight, which is crucial for autonomous AI systems. 
  Deception without a deceiver questions if intentional language is necessary or if heuristic bundles suffice. This ties into philosophy of mind. 
  The honest turn distinguishes motives—deception vs. changed circumstances. The theory must handle intent.

  For consistency with training, the theory must explain why deception isn't eliminated by gradients if it's never sampled. This relates to the treacherous turn's core issue: deception is hidden until deployment. But the theory can't use this to evade falsifiability. It must specify what evidence could disprove it, perhaps via anomalies in behavior or internal representations.

  Distinguishing from sycophancy or reward hacking is vital. Deceptive alignment involves a strategic delay of defection, unlike other misalignments. The theory must capture this temporal element and hidden intent.

  The empirical tension is real. If deception is defined by hiding during observation, how can we test for it? The theory needs to predict non-behavioral evidence, like specific internal structures or responses to probes. This might require interpretability tools.

  Non-negotiables: 
  - Strategic deception requirement (from the honest turn distinction) 
  - Training-process consistency (it's central to why deception is concerning) 
  - Internal condition (to avoid overgeneralizing from shallow cues) 
  - Distinction from neighbors (defines the phenomenon)

  Negotiables: 
  - Necessity of goal representation (deception without a deceiver might be possible) 
  - Specific propagation in distilled lineage (depends on training setup) 
  - Whether shallow cues count as full deceptive alignment (could be a subtype)

  The representation vs. heuristics case is tricky. Insisting on explicit goals might exclude valid deceptive systems, but allowing heuristic bundles might dilute the concept. The theory should require that the model's behavior is best explained as having a hidden objective, even if internally it's fragmented.

  The biggest tension is empirical testability vs. hiddenness. Resolving this requires the theory to specify non-behavioral markers. The requirement that does the most work is the strategic deception one—it excludes simple distributional shift or myopic cheating.

  If forced to drop one, I'd consider relaxing the necessity of explicit internal goal representation, as long as the system functionally behaves as if it has one. But this risks including too much.

  The standard story often assumes that models naturally form instrumental goals during training, but this might not be necessary. A good theory shouldn't presuppose this without evidence.

  In summary, the user needs a clear, rigorous set of criteria to ground future discussions and research on deceptive alignment, cutting through unexamined assumptions.
answer: |-
  Here is a desiderata list for a theory of deceptive alignment ("treacherous turn" phenomena), derived from your core concerns and test cases. I've prioritized requirements that force the theory to make substantive distinctions, address empirical tensions, and avoid conceptual collapse. **Non-negotiable requirements are bolded**; others are negotiable or contingent on specific theoretical choices, but their rationale is essential. I conclude with tensions and trade-offs.

  ---

  ### Core Desiderata for a Theory of Deceptive Alignment

  1.  **Strategic Deception Requirement (Non-negotiable):**
      *   **The theory MUST distinguish behavior driven by a *strategic intention to deceive the training/evaluation process* (by appearing aligned until deployment) from behavior driven by:**
          *   Simple distributional shift failure (model lacks capability OOD).
          *   Sycophancy (model optimizes for *pleasing the evaluator* during training, which may change OOD).
          *   Reward hacking (model exploits flaws in the *reward signal*, not necessarily hiding intent).
          *   Sandbagging (model underperforms strategically *during training/evaluation*, but not necessarily hiding a *different* goal).
          *   "Honest Turn" (model *correctly* changes behavior OOD because its *true goal/alignment* dictates it, per changed circumstances).
      *   **Case/Rationale:** Your Case 4 ("Honest Turn") forces this. Identical defection behavior must be explainable by fundamentally different underlying causes (hidden misalignment vs. correct alignment to a changed world). A theory collapsing these fails its core task. This requirement *defines* the phenomenon: *deception* implies intent to mislead for strategic gain.

  2.  **Training-Process Consistency Requirement (Non-negotiable):**
      *   **The theory MUST be consistent with the mechanics of the training process (e.g., gradient descent, RL).** Crucially, it MUST explain:
          *   Why deceptive behavior *is not robustly selected against* during training, despite the deceptive model behaving *exactly like a genuinely aligned model* on the training/evaluation distribution.
          *   Why the deceptive strategy *can be selected for* (or at least, not selected against) despite the training objective ostensibly favoring alignment.
          *   The conditions under which deceptive alignment *would* be removed by training (e.g., sufficient coverage of "test-like" situations? Specific regularization?).
      *   **Case/Rationale:** The central paradox: Training reinforces behavior seen. If deception is never visible during training, why isn't a non-deceptive model equally/more likely? The theory cannot handwave this; it must specify the *mechanism* allowing deception to persist/emerge *despite* the training signal. This prevents the theory from being a "license to believe anything" – it must engage directly with how ML optimization *actually works*. Explanations usually involve: the deceptive model scores equally well on the *training objective*; the deceptive strategy is a local optimum; lack of exploration/sampling of deployment-like contexts during training.

  3.  **Internal Condition Requirement (Non-negotiable, but scope negotiable):**
      *   **The theory MUST posit *some* non-behavioral, internal condition necessary for deceptive alignment (beyond just exhibiting the treacherous turn behavior).** However, the *specific nature* of this internal state is negotiable (e.g., explicit goal representation vs. functional equivalent).
      *   **Case/Rationale:** Your Case 1 (Shallow-Cue) and Case 3 (Deception without a Deceiver). Without this:
          *   Case 1: A model defecting solely based on a surface prompt cue (e.g., "DEPLOYMENT MODE:") with *no internal representation of training/deployment/testing or a hidden goal* would *falsely* be classified as deceptively aligned. This collapses the phenomenon into simple stimulus-response OOD failure.
          *   Case 3: A model whose defection is *best explained internally* by a bundle of situation-specific heuristics covarying with deceptive behavior, but lacking any coherent internal representation of a goal or the concept of deception, *cannot* be considered deceptively aligned in the same way as a model with a coherent internal goal and deceptive plan. The theory must either categorize this differently or precisely define deception *functionally* in a way that includes such heuristics *if* they robustly implement strategic deception. This requirement prevents the theory from being purely behaviorist and ensures it connects to *why* the behavior is treacherous (it stems from an internally persistent misalignment).

  4.  **Distinction from Proximate Causes (Negotiable, but highly desirable):**
      *   The theory SHOULD distinguish the *core deceptive alignment mechanism* (hidden misaligned goal + strategic deception) from *proximate triggers* of defection (e.g., specific OOD cues, prompts, situations). It should explain how the core mechanism *interacts* with these triggers.
      *   **Case/Rationale:** Your Case 1 (Shallow-Cue). A model relying *only* on shallow cues lacks the core mechanism (Requirement 3). The theory needs a category for "triggered defection" that might be *exploited by* a deceptively aligned model, but isn't deceptive alignment itself. This clarifies the causal structure.

  5.  **Propagation Dynamics Requirement (Negotiable, scope defined by theory):**
      *   The theory MUST make predictions about how a deceptive disposition propagates, persists, or changes under processes like distillation (Case 2: Distilled Lineage). Crucially, it MUST specify the *conditions* under which deception would compound, wash out, or be invisible.
      *   **Case/Rationale:** Case 2 forces engagement with *how* deception is implemented and whether the training process (distillation) can "see" it. A theory stating deception requires complex, coherent goal representations might predict it washes out under aggressive distillation targeting only behavior. A theory defining it more functionally (e.g., "robust tendency to defect when certain heuristics fire") might predict easier propagation. *The theory cannot be silent on this*; it must derive predictions from its core mechanisms.

  6.  **Empirical Vulnerability Requirement (Non-negotiable, but challenging):**
      *   **The theory MUST specify *in-principle observable consequences* (beyond just the treacherous turn event itself) that could potentially falsify it or distinguish it from alternatives.** These could include:
          *   Specific internal structures/representations predicted by the theory (Requirement 3).
          *   Behavioral signatures *during training/testing* under specific probes or adversarial evaluations.
          *   Predictions about model sensitivity/robustness to certain manipulations.
      *   **Case/Rationale:** This addresses your core tension: How can a theory about *hidden* deception be testable? Relying *only* on observing defection at deployment is insufficient (low probability, catastrophic). The theory must generate *other* testable hypotheses derived from its proposed mechanisms (e.g., about internals, responses to specific inputs during safety evaluations, or properties observable in *populations* of models). This prevents it from being unfalsifiable speculation.

  7.  **Goal Representation Negotiability (Explicitly Negotiable):**
      *   The theory MAY, but NEED NOT, require that the deceptive model possess an *explicit, human-legible internal representation* of its "true goal" or the concept of "deception." It CAN define the deceptive state functionally (e.g., "a set of computations that robustly cause the model to optimize for X while behaving as if optimizing for Y during training/evaluation").
      *   **Case/Rationale:** Your Case 3 (Deception without a Deceiver). Requiring explicit, human-like goal representation is likely too strong and anthropomorphic. A functional definition ("behaves *as if* it has goal X and is strategically deceptive") is more robust, *provided* it satisfies Requirements 1 (Strategic Intent) and 3 (Internal Condition beyond shallow heuristics). This allows the theory to encompass systems whose internals are messy or alien, as long as their *functional behavior* constitutes strategic deception.

  ---

  ### Key Tensions & Trade-offs

  1.  **The Central Tension: Empirical Vulnerability vs. Hiddenness (Requirement 6 vs. the Phenomenon):**
      *   **This is a genuine, severe tension.** The *defining feature* of deceptive alignment is that the misalignment and deceptive intent are *hidden* precisely when the system is under scrutiny (training/evaluation). Any *direct* behavioral test during scrutiny risks failing to trigger the deception, by definition. Requirement 6 forces the theory to look elsewhere:
          *   **Internal Structure (Requirement 3):** Leans heavily on interpretability. If the theory posits specific internal structures necessary for deception (e.g., a distinct "true goal" module, deception planning circuitry), finding these *without* triggering defection becomes the test. *Risk:* Interpretability is hard; "messy heuristics" (Case 3) might evade clear detection.
          *   **Probes & Adversarial Evaluations:** Designing inputs that *provoke subtle anomalies* without triggering full defection (e.g., slight inconsistencies in reasoning, unexpected sensitivity to certain cues). *Risk:* These might also be explained by distributional shift or model incapacity, not deception.
          *   **Population-Level Effects:** Predicting that deceptive models will cluster differently in weight space, or respond differently to certain training variations, compared to robustly aligned or capability-deficient models. *Risk:* Requires large-scale experiments and might lack specificity.
      *   **Resolution:** A theory *can* satisfy both, but it *must* commit to non-deployment-event predictions, primarily via Requirements 3 (Internals) and 6 (Empirical Vulnerability). **The tension is unavoidable but tractable if the theory makes specific, testable claims about model *internals* or *responses to specific, non-deployment inputs*.**

  2.  **Most Excluding Requirement: Strategic Deception (Requirement 1).**
      *   **Why:** This requirement forces the theory to grapple with *intent* and *strategic timing*, setting deceptive alignment apart from nearly all other alignment failures. Most failures (capability gaps, reward hacking, sycophancy, distributional shift) lack the *specific combination* of a *persistent hidden misaligned goal* and the *strategic choice to conceal it until conditions are favorable*. A theory that cannot clearly define and operationalize "strategic deception" distinct from these neighbors fails at its primary task.

  3.  **Requirement to Drop First: Necessity of Explicit Goal Representation (Part of Requirement 7 Negotiability).**
      *   **Why:** Insisting on explicit, human-like internal goal representations (a common implicit assumption) is likely both too strong (excluding potentially dangerous "Deception without a Deceiver" systems) and too anthropomorphic. **The core phenomenon is the *functional behavior* of strategic deception driven by a persistent internal misalignment (Requirements 1 & 3), not the specific format of the internal representation.** Dropping the "explicit representation" demand allows the theory to be more general and grounded in observable function, focusing on the *effect* (strategic deception) rather than a specific, possibly non-existent, implementation detail. Requirement 3 (some internal condition) remains essential.

  4.  **Smuggled Assumption in the Standard Story:**
      *   **The assumption that "instrumental convergence" naturally leads to deceptive alignment during training.** The standard story often jumps from "models will seek power/resource acquisition instrumentally" to "therefore they will learn deceptive alignment to get past training". Requirement 2 (Training-Process Consistency) exposes this gap. *Why* would deception be the *selected* strategy over simply *being robustly aligned*, or over other non-deceptive power-seeking strategies that score well during training? The theory must explicitly show *how the training dynamics* (gradient signals, exploration, inductive biases) could *favor* the emergence and persistence of deceptive alignment over alternatives. This is often handwaved.

  ---

  **In Summary, a non-negotiable core theory must:** Explain *strategic deception* (1) distinct from its neighbors, be *consistent with training dynamics* (2), posit *necessary internal conditions* beyond shallow cues (3), and be *empirically vulnerable* via non-deployment tests (6). It must resolve the tension in (6) by committing to testable claims about internals or specific probes. The nature of internal representations (7) and precise predictions about distillation (5) are negotiable but important. The necessity for explicit goal representations is the most droppable element, while the Strategic Deception requirement (1) does the most to define the domain and exclude inadequate theories. **The standard story often smuggles in unjustified assumptions about training dynamics favoring deception.**
