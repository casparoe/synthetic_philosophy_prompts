prompt: |-
  I'm in a second-year metaphysics course and our seminar's got a guest next week -- she works on material constitution and she's going to argue that the Ship of Theseus has no right answer, not because we haven't worked out which ship is the original but because there just isn't a fact of the matter: whether the rebuilt ship is the ship is genuinely indeterminate, and that indeterminacy is out there in the world rather than being a fact about our words or concepts. I have to introduce her and run the Q&A, and I want questions that actually dig into the view instead of letting her just say identity is vague five times.

  Can you draft me like eight to ten questions, each with a follow-up? I'd like at least one that presses the old objection that indeterminate identity is incoherent -- roughly, if it's indeterminate whether a and b are the same thing, then a is definately identical to itself while b isn't definately identical to a, so b has a property a lacks, so they aren't identical after all, and the indeterminacy was never really about identity. And I want one on whether her story survives the fact that the verdict seems to shift depending on how much of the ship you swap and how you describe the case -- is that indeterminacy in the world, or just in our descriptions? And one about what she thinks ordinary people are doing when they confidently say it is or isn't the same ship.

  For each question give me the follow-up you'd ask after the reply she's most likely to give, and keep the questions concrete -- no what-drew-you-to-this stuff. At the end, tell me which of these would fall apart if I've got her position slightly wrong (say, if she actually thinks the indeterminacy is semantic rather than ontic), and what would make you drop the incoherence objection as the opening question.
