  Okay, the user is a second-year metaphysics student preparing to host a guest speaker who argues that the Ship of Theseus has no right answer due to genuine ontic indeterminacy. They need substantive questions with follow-ups to push beyond surface-level answers, specifically requesting three targeted angles: incoherence of indeterminate identity, sensitivity to case variations, and ordinary judgments. 

  First, I need to ensure I grasp the speaker's core claim: she posits metaphysical indeterminacy where identity itself is fuzzy in reality, not just in language or concepts. The user wants to avoid letting her retreat to "identity is vague" without scrutiny. 

  For the incoherence objection, I recall Evans' argument: if "a = b" is indeterminate, then b lacks the property "being determinately identical to a" that a possesses, implying distinctness. The follow-up must anticipate her likely defense—maybe she'll deny b has a positive property or attack the logic's applicability to indeterminacy. 

  On case sensitivity, if swapping 1 plank vs. all planks changes intuitions, is that evidence the indeterminacy isn't inherent? She might argue thresholds are context-dependent but still real, so the follow-up should press whether "degree of indeterminacy" maps to anything objective. 

  For ordinary judgments, if people confidently pick sides, does that suggest they're tracking conventions? Her reply might distinguish folk metaphysics from reality, so the follow-up should ask if indeterminacy ever manifests in practical reasoning. 

  I'll draft 8-10 Q&A pairs, tagging which hinge on her commitment to ontic (not semantic) indeterminacy. The incoherence objection only bites if she insists indeterminacy is worldly—if she's semantic, it misfires. I'll warn the user to confirm her position early; if she wavers, pivot to Q3 or Q6 instead. 

  The questions should feel concrete: no "what inspired you" fluff. Use "planks," "scenarios," "confidently assert" to ground it. For follow-ups, simulate likely dodges—e.g., if she calls Evans' argument "wordplay," ask why it doesn't expose a contradiction. 

  Finally, I'll note which questions become useless if she's actually semantic (Q1, Q2, Q5, Q8) and suggest softening the incoherence opener if she seems prickly—maybe start with Q3 to warm her up first.
answer: |-
  Here are 10 concrete questions with sharp follow-ups designed to probe the core of the "ontic indeterminacy" view of the Ship of Theseus, avoiding repetition and pushing beyond slogans. I've flagged critical dependencies at the end.

  **Core Questions & Follow-Ups:**

  1.  **The Incoherence Challenge:** You argue identity itself can be indeterminate. But Evans famously argued that indeterminate identity is incoherent: If it's indeterminate whether Ship A (original/continuous) = Ship B (reassembled/replaced), then Ship B lacks the property "being determinately identical to Ship A" which Ship A possesses (since A *is* determinately identical to itself). Doesn't this show A and B are determinately distinct after all? How does your view avoid this logical contradiction?
      *   *Likely Reply:* She might argue Evans misunderstands indeterminacy, deny properties like "determinately identical to A" are coherent, or claim the argument relies on a determinacy-presupposing logic.
      *   **Follow-Up:** If we can't meaningfully attribute the property "determinately identical to A" to objects in indeterminate identity cases, does this imply our *logic* must change to accommodate ontic indeterminacy? Doesn't abandoning classical logic in this core area (identity) undermine our ability to reason reliably about the world at all, including the rest of your theory? Or, if the property *is* coherent, why doesn't Evans' argument succeed?

  2.  **The Spectrum Problem & Ontic Grounding:** Our intuitions about the Ship seem highly sensitive to *how much* is replaced (one plank? half? all?) and *how* it's done (gradual decay vs. sudden swap). If the indeterminacy is truly *in the world*, what objective feature of reality corresponds to this apparent spectrum? What makes the "middle" case ontically indeterminate while the "all at once" replacement might seem determinate loss?
      *   *Likely Reply:* She might say the world itself has vague boundaries/structures, or that the relevant properties (like "being composed of sufficiently original planks") are inherently vague.
      *   **Follow-Up:** But doesn't the *shift* in our verdict depending on *description* (e.g., emphasizing functional continuity vs. material continuity) strongly suggest the indeterminacy arises from competing *conventions* or *interests* we bring to the description, rather than a brute fact about the ships themselves? If it's in the world, why does changing *our words* change where the indeterminacy seems to lie?

  3.  **Ordinary Judgment & Tracking Reality:** When ordinary people confidently assert "That *is* the Ship of Theseus!" (perhaps pointing to the continuously maintained ship) or "That *isn't* it anymore!" (pointing to the reassembled original planks), what are they doing? Are they simply *wrong* about an ontically indeterminate fact? Or are they relying on pragmatic conventions that don't reflect an underlying metaphysical indeterminacy?
      *   *Likely Reply:* She might say they are applying one contextually relevant criterion (e.g., form/function vs. matter) in a situation where *no single criterion is metaphysically privileged*.
      *   **Follow-Up:** If no single criterion is metaphysically privileged, and people confidently apply different criteria yielding conflicting determinate answers, doesn't this suggest that *all* their identity judgments in such cases are merely conventional, rather than some being correct/incorrect about an underlying indeterminate reality? Isn't the confidence misplaced *because* there's no fact to be confident *about*?

  4.  **Identity Over Time vs. Coincidence:** Is the indeterminacy specifically about *diachronic identity* (is *this* ship *now* the *same ship* as *that* ship *then*?), or is it better understood as an indeterminacy about whether we have *one object coincident with another* at a single time (e.g., the continuously maintained ship and the pile of original planks *at the end of the replacement process*)? Does your view blur this distinction?
      *   *Likely Reply:* She might argue the cases are linked, or that the diachronic question reduces to synchronic coincidence questions at different times.
      *   **Follow-Up:** If we focus on the synchronic moment when both ships exist: Is the indeterminacy about whether there are *two* coincident objects, or whether it's indeterminate *which one* is the original Ship? How does avoiding a definite count of objects at a time help explain the diachronic identity puzzle?

  5.  **Indeterminacy & Causation:** Suppose the continuously maintained ship sails and sinks, tragically killing the captain. Is it ontically indeterminate whether the *original Ship of Theseus* sank and killed the captain? If causation relies on the identity of objects over time, how can causation itself avoid becoming indeterminate here?
      *   *Likely Reply:* She might bite the bullet and say causal facts *can* inherit indeterminacy, or argue causation tracks the "dominant causal line" which may be determinate even if identity isn't.
      *   **Follow-Up:** If causation can be indeterminate, how do we avoid widespread indeterminacy in historical narratives, legal responsibility, or even personal identity ("Is it indeterminate whether *I* will suffer the consequences of *my* actions?")? Doesn't this make the world radically unstable? If causation *isn't* indeterminate, doesn't that suggest the identity indeterminacy is epiphenomenal or merely descriptive?

  6.  **Metaphysical Cost vs. Semantic Alternatives:** What does positing *ontic* indeterminacy buy us that a sophisticated semantic account (e.g., supervaluationism over multiple precisifications of "ship" or "same ship") cannot explain equally well? Isn't the sensitivity to context and description (Q2) precisely what semantic accounts are designed to handle?
      *   *Likely Reply:* She might argue semantic accounts still need a worldly correlate for vagueness, or that they fail to capture the *metaphysical* openness of reality.
      *   **Follow-Up:** Can you point to a specific phenomenon or consequence within the Ship case that *only* an ontic indeterminacy view explains, and that a semantic view must get wrong or fail to capture? If not, doesn't Occam's Razor favor the semantic view?

  7.  **The Role of Persistence Conditions:** Does your view imply that there are no objective, determinate persistence conditions for artifacts like ships? Or that ships lack essential properties altogether?
      *   *Likely Reply:* Likely yes, she might argue persistence conditions are interest-relative or inherently vague.
      *   **Follow-Up:** If ships lack objective persistence conditions, does this extend to *all* artifacts? What about natural kinds (like a river or a mountain) or even living organisms? Does accepting ontic indeterminacy for the Ship commit us to a widespread anti-essentialism or ontological conventionalism?

  8.  **Indeterminacy & Quantification:** If it's ontically indeterminate whether Ship A is identical to Ship B, what does this imply for *counting*? At the end of the process, is it ontically indeterminate whether there is one ship or two ships present? How can we quantify over objects if it's indeterminate what objects exist?
      *   *Likely Reply:* She might say quantification must also accommodate indeterminacy, or that we can quantify determinately over "ship-candidates" while identity between them is indeterminate.
      *   **Follow-Up:** If quantification becomes indeterminate ("There exists an x such that... is indeterminate"), doesn't this cripple our ability to state basic facts about the world? If we *can* quantify determinately ("There is one continuously maintained ship and one pile of planks assembled ship-wise"), doesn't this undermine the claim that the *identity* between *that* continuously maintained ship and the *original* is ontically indeterminate? It seems we *can* refer determinately to both candidates.

  9.  **Beyond Artifacts:** Does your view apply only to artifacts like the Ship, or does it extend to fundamental physical objects? For example, if we gradually replace all the elementary particles in an electron one-by-one (assuming that's possible), is it ontically indeterminate whether the resulting particle is the original electron? If not, why is the Ship different?
      *   *Likely Reply:* She might limit it to complex objects/categories, or bite the bullet for fundamental particles too.
      *   **Follow-Up:** If it applies to fundamental particles, doesn't this threaten the basis of physics? If it doesn't, what *ontological* difference between fundamental particles and ships justifies applying indeterminacy only to the latter? Isn't this difference likely just about our concepts/descriptions?

  10. **Resolution Mechanisms:** Is there *anything* that could *settle* the identity of the Ship, making it determinate? For instance, if we discovered a hidden "ship essence" tracker implanted by the gods? If yes, doesn't this suggest the indeterminacy *was* due to our ignorance/lack of a privileged property? If no, how is indeterminacy consistent with a causally closed, law-governed world?
      *   *Likely Reply:* She might argue nothing could settle it because there is no fact *to* settle.
      *   **Follow-Up:** If nothing *in principle* could settle it, how is this different from saying there *is* no fact of the matter? And if there is no fact of the matter, isn't the robust sense of "ontic indeterminacy" you propose collapsing into either eliminativism ("there is no ship persisting") or semantic indeterminacy?

  **Critical Dependencies & Strategy:**

  1.  **Assumption Check (Ontic vs. Semantic):** Questions **1, 2, 5, 8, and 10 crucially depend** on her holding an *ontic* indeterminacy view. If she actually defends *semantic* indeterminacy (vagueness in our concepts/words), these questions largely miss the mark or become much easier for her to answer. **Verify her position early!** (e.g., Ask a clarifying question during intro: "Just to frame things for the audience, your core claim is that the indeterminacy here is *in the world itself*, not just in our language or concepts, correct?").
  2.  **When to Soften the Incoherence Challenge (Q1):** Drop this as the *opening* question if:
      *   She explicitly rejects classical logic for identity/metaphysics in her intro.
      *   Her initial presentation directly addresses Evans and dismisses it quickly.
      *   The seminar atmosphere is tense or she seems defensive. (Save it for later if needed).
      *   **Better Opener:** Q3 (Ordinary Judgment) or Q2 (Spectrum Problem) are often safer and more engaging starters that still get to the heart of the ontic/semantic divide. Q6 (Cost vs. Semantic) is also a strong early probe.
  3.  **Strong Alternatives to Q1:** If you suspect Q1 might bomb or she's prepared, Q5 (Causation) and Q8 (Quantification) are excellent alternatives to press the "unpalatable consequences" angle of ontic indeterminacy, which often feels less like a technical logic trap.

  These questions force engagement with the most challenging implications of ontic indeterminacy: its logical coherence, its interaction with description/causation/quantification, its grounding in reality, and its contrast with semantic views. Good luck with the seminar!
