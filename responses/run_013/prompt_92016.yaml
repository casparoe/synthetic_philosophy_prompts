prompt: |-
  I am a novelist, and for several years now I have been trying to finish a book that follows one family across four generations — and the question that keeps pulling me away from the manuscript is what, exactly, a reader is supposed to take from a life. I have arrived at a position about this, and I would rather have it stress-tested than flattered. Please take the role of a philosopher working at the intersection of moral psychology and the history of biography: someone who has thought hard about exemplarist ethics, about the ancient practice of writing lives in pairs, and about the conventions of hagiography. Reason carefully before you answer, and begin by brainstorming rather than concluding — set out the candidate objections in a list before you rank or judge them.

  My position, as plainly as I can state it, is this. Moral learning from a life is neither exemplarity nor sympathy. It is what I would call frame rehearsal: the reader is made, temporarily and at no cost, to occupy an evaluative framework that is not their own, and the good that comes of it is the discovery that their own judgments are contingent on a frame they never chose. Two corollaries follow. First, the moral yield of a life is proportional to the resistance the reader feels, not to the admiration — a subject who is sympathetic, coherent, and admirable teaches least, because there is no friction where the reader's frame already fits. Second, hagiography and comparative biography — the saint's life on one side, the paired lives of Greek and Roman worthies on the other — are the same experiment run at opposite settings: hagiography removes resistance by presenting a single frame as simply true, while the comparative method manufactures resistance by forcing incommensurable standards into one judgment. Hence, on my account, the first has largely failed as moral education and the second is the most effective moral technology the ancient world produced. One reason I trust biography over the novel as the test case is that a novelist can tune the resistance at will while a biographer inherits it; if the thesis is true, it should be most visible in lives that were never shaped for our edification.

  Now the request, which is the main event. Tell me what would count against this. I want the defeaters sorted by how decisive they would be, and I want no bibliography: assume I can look nothing up, and write so that nothing in your answer depends on my being able to. Distinguish what would genuinely refute the position from what would merely be awkward for it. Say what my view predicts that its rivals predict differently — plain exemplarism, the empathy-and-identification view, and the view that moral learning from lives is nothing but the accumulation of a repertoire of cases — and where we could in principle look to adjudicate. Tell me which defeaters a committed defender of my position would concede and which they would be entitled to wave away. Press as well on the framing: is what I am describing moral learning at all, or only the acquisition of a tolerance that has no bearing on conduct? And be honest with me about insulation. I am aware that I can always rescue the thesis by declaring the resistance internal, or by saying that a failed moral education is simply one in which the reader's frame was never really occupied. Is my position in danger of becoming unfalsifiable — and if so, is that a defect for a claim of this kind, or just the ordinary fate of claims about what reading does?

  I would be most persuaded by either of the following, if you can supply it: a case in which a life produced a moral change in a reader with almost no resistance — an unimpeachably admirable subject who nonetheless moved someone to act — or, in the other direction, a clear instance of a comparative or ironic biography that generated nothing but aesthetic pleasure. If neither can be had, say so, and say what that does to my position. I would also like to know what would count against the second corollary on its own, since it seems to me the more exposed half of the pair.

  Commit to a verdict. I do not want a survey in disguise; I want your judgment about whether the position survives contact with its best objections, which part of it I should surrender if I must surrender something, and how confident I should be. If you conclude that the thesis is true but trivial, or that it quietly collapses into one of the rivals I named, tell me so plainly.
reasoning: |-
  Hmm, the user is a novelist working on a multi-generational family saga who's grappling with a philosophical question about what readers gain from examining lives in literature. They've developed a theory called "frame rehearsal" - the idea that moral learning occurs when readers temporarily inhabit an evaluative framework different from their own, with the resulting friction revealing the contingency of their own judgments. They want this theory rigorously stress-tested from a philosophical perspective.

  The core of their position has two main components: first, that moral yield correlates with resistance rather than admiration (sympathetic characters teach least), and second, that hagiography fails while comparative biography succeeds as moral technologies precisely because they manipulate this resistance. They're particularly concerned about the second corollary being vulnerable.

  I need to approach this as a philosopher specializing in moral psychology and biography history. The user wants me to: brainstorm objections first rather than concluding; sort defeaters by decisiveness; avoid bibliography; distinguish refutations from mere awkwardness; compare predictions with rival theories; assess defensibility against insulation concerns; provide requested counterexamples if possible; and finally commit to a verdict about what survives.

  Key rival theories to consider are: 1) Plain exemplarism (learning through admiration/emulation), 2) Empathy-identification view (learning through emotional connection), and 3) Case-repertoire view (accumulating moral precedents). My analysis must show where these differ in their predictions from the user's frame rehearsal theory.

  The insulation problem is critical - if frame rehearsal can always be preserved by redefining resistance as internal or claiming the frame wasn't "truly" occupied, the theory becomes unfalsifiable. This needs careful handling since unfalsifiability might be inherent in claims about reading's effects.

  For counterexamples: finding an unimpeachably admirable life causing moral change without resistance is challenging (Mother Teresa cases usually involve pre-existing alignment). For the inverse, many satirical biographies like Strachey's Eminent Victorians generate aesthetic pleasure without documented moral transformation, which might not fully refute but certainly pressures the theory.

  On the second corollary, the historical persistence of hagiography as moral education (despite its alleged failure per the theory) presents a strong challenge. Comparative biography's effectiveness also isn't universally acknowledged - Plutarch's moral efficacy is often debated by scholars.

  The verdict will likely be that the core insight is valuable but requires refinement: resistance may be necessary but not sufficient for moral learning, and the comparative biography claim needs historical qualification. The theory avoids collapsing into rivals but must concede some insulation concerns inherent in the domain.
answer: |-
  Your position is provocative and philosophically rich. Below, I stress-test it systematically—brainstorming objections, ranking their force, comparing predictions with rivals, and addressing insulation risks—before committing to a verdict. I adopt your requested adversarial role, drawing from moral psychology and biography’s history.  

  ### **Brainstormed Objections (Sorted by Decisiveness)**  
  **Category 1: Potentially Refutative**  
  1. **Counterexample: Low-Resistance Moral Transformation**  
     - *Case*: A reader encounters a biography of an unimpeachable figure (e.g., Fred Rogers, Mr. Rogers) and immediately reforms their parenting style with no felt friction. The subject’s coherence/sympathy *enabled* change by offering a clear template.  
     - *Why decisive?* Directly violates your claim that "sympathetic/admirable subjects teach least." If verified, it refutes the resistance-yield correlation.  

  2. **Comparative Biography’s Frequent Failure**  
     - *Case*: Plutarch’s *Lives* (e.g., Alexander/Caesar) often generated nationalist pride or aesthetic pleasure (Renaissance readers collecting parallels as literary ornaments), not moral friction. Montaigne treated them as case studies, not frame-rehearsal.  
     - *Why decisive?* Undermines your second corollary: if comparative biography’s "manufactured resistance" rarely yields moral learning, its status as "most effective moral technology" collapses.  

  **Category 2: Damaging but Not Fatal**  
  3. **Resistance ≠ Moral Growth (Trivial or Harmful Outcomes)**  
     - *Objection*: Readers may rehearse a frame (e.g., a tyrant’s) and emerge only with relativistic apathy ("all judgments are contingent"), not ethical insight. This aligns with your "tolerance without conduct" worry.  
     - *Why damaging?* Suggests frame-rehearsal is insufficient for moral learning. Rivals (e.g., empathy-view) predict behavioral change; you predict only cognitive shifts.  

  4. **Hagiography’s Enduring Efficacy**  
     - *Evidence*: Medieval saints’ lives (e.g., *Life of St. Francis*) demonstrably inspired emulation in readers (e.g., founding hospitals). Your "single frame as true" critique ignores how dogmatic certainty *fuels* action.  
     - *Why damaging?* Forces you to concede hagiography "fails" only by your narrow metric—yet it historically succeeded by others (e.g., motivation).  

  **Category 3: Awkward but Negotiable**  
  5. **Biography vs. Novel Asymmetry**  
     - *Objection*: Biographers *do* shape resistance (selection bias, narrative framing). Boswell’s *Johnson* imposes a comic-sentimental frame. If biographers "tune" resistance, your novel/biography distinction weakens.  
     - *Defender’s move*: Concede biographers curate, but stress they can’t invent events like novelists—historical constraints preserve "inherited" friction.  

  6. **Rivals Explain the Same Data**  
     - *Exemplarism*: Predicts admiration *enables* learning (contra your friction thesis).  
     - *Empathy-view*: Predicts identification drives change (e.g., weeping with a subject bridges frames).  
     - *Case-repertoire*: Predicts readers store biographies as moral precedents (e.g., "What would Cato do?").  
     - *Awkwardness*: All rivals deny resistance is central. Yet your view *subsumes* them: exemplarism works only if the frame fits; empathy requires frame-sharing.  

  ### **Insulation and Unfalsifiability**  
  - **Risk**: You *can* always retreat to "the reader didn’t *truly* occupy the frame" or "resistance was internalized." This risks unfalsifiability.  
  - **Defense**: This is partly inherent to claims about reading (e.g., "empathy" theories suffer similar retreats). But you can mitigate:  
     - Demand evidence of *felt* friction (e.g., reader diaries showing struggle).  
     - Specify *types* of resistance: e.g., cognitive dissonance, not mere confusion.  
  - **Verdict on insulation**: A vulnerability, but not fatal. Most theories of textual moral psychology share this flaw.  

  ### **Adjudicating Rival Predictions**  
  | Scenario                     | Your View Predicts               | Rivals Predict                  | Test Case                       |  
  |------------------------------|----------------------------------|---------------------------------|---------------------------------|  
  | Admirable life (e.g., Gandhi) | Low moral yield (no friction)    | High yield (exemplarism/empathy)| Readers reporting life-changing insight *without* dissonance |  
  | Comparative lives (e.g., Cicero/Demosthenes) | High yield from friction | Yield from parallels (case-repertoire) or detached interest | Documented reforms (e.g., adopting Stoicism after Plutarch) vs. aesthetic appreciation |  

  ### **Verdict: What Survives, What Concedes**  
  1. **Core Thesis (Frame-Rehearsal)**  
     - *Survives contact*: The link between *felt resistance* and moral insight is robust. Rivals cannot easily explain why morally ambiguous lives (e.g., Augustine’s *Confessions*) provoke deeper reflection than hagiographies.  
     - *Concession*: Resistance is *necessary but not sufficient*. Without scaffolding (e.g., critical reflection), it may yield only tolerance or confusion.  

  2. **First Corollary (Resistance ∝ Yield)**  
     - *Survives, with nuance*: Sympathetic subjects *can* teach, but chiefly to those *already aligned* (e.g., activists inspired by MLK). For frame-expansion, friction is primary.  
     - *Counterexample weakness*: Cases like "admirable lives causing change" often involve readers *seeking* alignment (e.g., a parent reading Rogers). They don’t refute—they confirm frame-rehearsal works best when frames *clash*.  

  3. **Second Corollary (Hagiography vs. Comparative Biography)**  
     - *Surrendered in part*: Hagiography *can* educate when readers inhabit its frame (e.g., medieval monks). Comparative biography often fails if readers cherry-pick parallels.  
     - *Retained insight*: Comparative form *maximizes potential* for frame-rehearsal by design. But it’s not categorically superior—effectiveness depends on reader engagement.  

  4. **Is This Moral Learning?**  
     - Yes, but *meta-ethical*: It cultivates awareness of judgment’s contingency, enabling wiser (less dogmatic) application of one’s ethics. Not "tolerance" but *cognitive flexibility*.  

  **Final Judgment**:  
  - **Strengths**: Your account uniquely explains why morally complex lives (Plutarch, Boswell) out-educate saints’ lives. It avoids exemplarism’s naïveté and empathy-view’s sentimentality.  
  - **Weaknesses**: The resistance-yield correlation isn’t universal (Category 1 objections dent but don’t destroy it). The novel/biography asymmetry is overstated.  
  - **Confidence Level**: 80% on the core; 60% on the corollaries.  
  - **Triviality?** No—it reframes moral education as *critical encounter*, not absorption.  
  - **Collapse into rivals?** No—it makes empathy and exemplarity *consequences* of frame-sharing, not engines of learning.  

  **Recommendation**: Keep the core of frame-rehearsal. Soften the corollaries to:  
  - *"Resistance often correlates with moral yield when frames clash."*  
  - *"Comparative biography is a powerful—but not infallible—tool for manufacturing such clashes."*  

  Your position’s value lies in its friction-centric model. It fails only where it overreaches—but as a theory for *transformative* (not incremental) moral learning, it holds. Write the book accordingly.
