prompt: |-
  I teach an upper-level undergraduate seminar on Wittgenstein and scepticism, and I am grading the final exam. The question was:

  Explain what Wittgenstein thinks is going on when Moore claims to know he has two hands, and assess whether the certainties Wittgenstein calls hinges can themselves be doubted or rationally revised. Your answer should say something about the riverbed image and should end with your own verdict on revisability.

  One student's answer, reproduced in full:

  Moore held up his two hands and claimed to know that they existed, and he took this to be a proof of the external world. Wittgenstein does not deny that Moore's hands exist; what he denies is that Moore knows this in the way one knows that the train leaves at six. Propositions of this kind — that I have two hands, that the earth has existed for many years, that my name is such and such — are what Wittgenstein calls hinges. They stand fast for us, and they are what make doubting, testing and justifying possible: I can only check the colour of this table because I already take for granted that the table is there and that my eyes work. Hinges are not the conclusions of an investigation; they are the background against which investigations take place. Moore's error is therefore not that he is wrong but that his words are idle: when someone says he knows he has hands, the expression of certainty has no work to do, and the assurance it offers is not needed. This is why Wittgenstein says that certainty of this sort is not a form of knowledge at all, but something more primitive — a way of acting, a form of life.

  Can hinges be doubted or revised? The riverbed image suggests the answer. Our beliefs form a river: a moving current of hypotheses on top, a hard bed of certainties beneath. The bed is not fixed forever — the river can shift it — and so what functions as a hinge varies from time to time and from community to community. But the reason hinges cannot be doubted is not evidential. We have no evidence for them, and asking for evidence only shows that one has misunderstood their role. It is rather that we are so constituted that we cannot bring ourselves to doubt them: a person who seriously doubted that he had two hands would be mad, and madness is a psychological condition rather than a philosophical position. When a hinge does change, then, it changes the way a river changes its bed — gradually, and not as the result of any argument.

  Wittgenstein's positive account, then, is that hinge propositions carry a kind of entitlement: they are commitments we are rational to hold even though nothing supports them, and this is what distinguishes them from mere prejudice. It also explains why the child's certainties, absorbed from the adults around her, can be perfectly rational without ever having been checked.

  Please grade the answer and give me the point-by-point comments that justify the grade. I am interested in accuracy first: where the student is right, where wrong, and what a correct answer would have said at each of those points. Please work at the level of sentences rather than giving me a general impression, and be explicit about anything you think is a near-miss that a quick reading would let pass. Where you judge the answer defective, tell me whether you take the defect to be a genuine mistake or a defensible reading, and say what the student would have had to do to earn a higher mark. Finally, state what would move your verdict in either direction — which consideration would push the grade up a notch and which would push it down — and identify the part of your own reading of Wittgenstein that you are least confident about.
reasoning: |-
  Okay, let me approach this grading task methodically. The professor wants a sentence-level analysis of this Wittgenstein exam answer with emphasis on accuracy, so I'll need to carefully compare each claim against On Certainty.

  First, the student's opening about Moore seems strong - they correctly identify Wittgenstein's core objection isn't ontological but concerns the grammar of "knowing." The "idle" characterization is spot-on per OC §151 and §247. But I notice they miss Wittgenstein's deeper point about Moore misusing "I know" in philosophical contexts, which is crucial for the hinge analogy.

  Hmm, the riverbed section worries me slightly. While the student captures the fluidity of hinges (OC §96-99), they oversimplify by suggesting all hinges shift equally. Wittgenstein actually distinguishes between "logical" and "empirical" hinges - some are truly bedrock (OC §655). The student's phrasing makes it sound like any hinge could erode overnight, whereas Wittgenstein emphasizes most change glacially through "form of life" shifts (OC §144).

  The madness comment is provocative but problematic. Calling doubters "mad" psychologizes what for Wittgenstein is a conceptual limit - it's not about mental health but about what counts as intelligible doubt (OC §155, §257). A better answer would reference "hinge propositions are as it were like hinges on which our questions turn" (OC §341) to show it's about logical priority.

  On entitlement: the student makes a valiant effort with "rational commitments" but conflates it with contemporary epistemology. Wittgenstein explicitly rejects "entitlement" language - certainty is pre-rational (OC §475). Their child example works well though, capturing how hinges are absorbed (OC §160).

  For grading: the core structure is B+ material (clear thesis, good textual engagement). But the riverbed oversimplification and "madness" slip are significant. To reach A-range, they'd need to address why some hinges feel immutable and Wittgenstein's rejection of epistemic justification. If the professor values original synthesis over precision, maybe B+ stands; if strict exegesis is key, B is safer.

  My own uncertainty lies in the entitlement point - some scholars (Moyal-Sharrock) do read Wittgenstein as offering a proto-entitlement theory. But since the exam didn't ask for scholarship, sticking to primary text fidelity seems fair.
answer: |-
  Here is a graded evaluation of the student's answer with sentence-by-sentence analysis, focusing on accuracy relative to *On Certainty* (OC). The answer demonstrates strong comprehension but has notable flaws in its treatment of doubt/revisability and "entitlement."

  **Grade: B+ (85%)**  
  *Justification: Accurately explains Moore's error and the hinge concept but misrepresents Wittgenstein on doubt/revisability and imports un-Wittgensteinian terminology ("entitlement").*

  ---

  ### **Point-by-Point Analysis**  
  *(Key: ✓ = Accurate | ✗ = Inaccurate | ~ = Partial/Overstated)*  

  1. **"Moore held up his two hands... proof of the external world."**  
     ✓ **Accurate.** Correctly summarizes Moore’s argument (OC §1, §6).  

  2. **"Wittgenstein does not deny... knows that the train leaves at six."**  
     ✓ **Accurate.** Wittgenstein distinguishes empirical knowledge (e.g., train schedules) from hinge certainties (OC §§1–3, §308).  

  3. **"Propositions of this kind... Wittgenstein calls hinges."**  
     ✓ **Accurate.** Standard examples from OC (§§1, 84, 233, 411).  

  4. **"They stand fast... make doubting, testing and justifying possible."**  
     ✓ **Accurate.** Perfectly captures the functional role of hinges (OC §§114–115, 151, 343).  

  5. **"Hinges are not conclusions... investigations take place."**  
     ✓ **Accurate.** Clear articulation of hinges as framework conditions (OC §§88, 152).  

  6. **"Moore's error is... the assurance it offers is not needed."**  
     ✓ **Accurate.** Highlights Wittgenstein’s critique of Moore’s *performative* misuse of "know" (OC §§6, 151, 462).  

  7. **"This is why Wittgenstein says... a way of acting, a form of life."**  
     ✓ **Accurate.** Correctly identifies certainty as pre-epistemic ("animal," OC §359) and embedded in praxis (OC §§110, 204, 344).  

  8. **"The riverbed image suggests... a hard bed of certainties beneath."**  
     ✓ **Accurate.** Faithful to OC §96: "The mythology may change back into a state of flux... and the river-bed of thoughts may shift."  

  9. **"The bed is not fixed forever... from community to community."**  
     ~ **Partial/Overstated.** Hinges *can* shift (e.g., OC §65 on geocentrism), but Wittgenstein stresses their *de facto* stability for a given context (OC §§97–99, 152). The student implies greater fluidity than OC supports—Wittgenstein calls some hinges "immovable" (OC §655).  

  10. **"But the reason hinges cannot be doubted is not evidential... misunderstood their role."**  
      ✓ **Accurate.** Hinges lack evidence because they enable evidence-seeking (OC §§111, 204, 563).  

  11. **"We are so constituted... madness is a psychological condition."**  
      ✗ **Inaccurate/Defensible Misreading.** Wittgenstein *compares* doubt to madness (OC §155, §257) but does **not** reduce it to psychology. His point is *logical*: doubting hinges destroys the framework for rational discourse (OC §§115, 450, 676). Calling it "psychological" risks misrepresenting Wittgenstein’s grammatical focus.  

  12. **"When a hinge does change... gradually, and not as the result of any argument."**  
      ~ **Partial.** Correct that revision is non-inferential (OC §§92, 97), but underemphasizes that shifts occur through *changes in form of life* (OC §§144, 256), not arbitrary erosion.  

  13. **"Wittgenstein's positive account... commitments we are rational to hold even though nothing supports them."**  
      ✗ **Inaccurate/Non-Wittgensteinian.** "Entitlement" is an *epistemic* term foreign to OC. Wittgenstein explicitly denies hinges are "rational" or "supported" (OC §§110, 166, 559). They are *arational*—"below justification" (OC §166).  

  14. **"This distinguishes them from mere prejudice... absorbed without being checked."**  
      ✗ **Defensible but Flawed.** While hinges *are* absorbed uncritically (OC §160), Wittgenstein rejects "rational vs. irrational" binaries here (OC §§166, 559). The child example is apt (OC §160), but "rational to hold" imports contemporary epistemology Wittgenstein would reject.  

  ---

  ### **Defects Summary**  
  - **Genuine Mistakes:**  
    - Attributing "entitlement" to Wittgenstein (sentence 13).  
    - Psychologizing doubt as "madness" rather than a grammatical limit (sentence 11).  
  - **Defensible but Problematic:**  
    - Overstating hinge fluidity (sentence 9) and underplaying their context-bound stability.  
    - Framing hinges as "rational commitments" (sentence 13) ignores Wittgenstein’s anti-epistemological stance.  

  ---

  ### **How to Earn a Higher Mark (A-range)**  
  1. **Correct sentence 11:** Explain doubt’s *logical* (not psychological) impossibility: e.g., "Doubt requires grounds within a system, but hinges *are* the system."  
  2. **Revise sentence 13:** Replace "entitlement" with Wittgenstein’s own terms: e.g., "Hinges are *trust* (OC §509) or *animal certainty* (OC §359) — not rational commitments."  
  3. **Clarify revisability:** Note that while hinges *can* change (e.g., OC §92), most are "so anchored that I cannot touch it" (OC §103) for practical purposes.  
  4. **Strengthen the verdict:** Ground "rational revision" in Wittgenstein’s rejection of global doubt (OC §625).  

  ---

  ### **Grade Adjustment Factors**  
  - **Push to A- (90%):** If "madness" and "entitlement" are read charitably as metaphors, and riverbed fluidity is tempered by citing OC §99 ("inherited background").  
  - **Push to B (80%):** If hinges are treated as universally revisable (ignoring OC §655) or "entitlement" is central to the verdict.  

  ---

  ### **My Least Confident Reading**  
  I am least confident about **revisability**. Wittgenstein *does* say riverbeds shift (OC §96), yet elsewhere insists some hinges are "immovable" (OC §655). The tension between historical contingency (e.g., geocentrism) and pragmatic immutability (e.g., "I have a body") is unresolved in OC. I lean toward "contextual immutability" (hinges are fixed *within* a form of life), but acknowledge ambiguity.  

  **Final Verdict:** **B+ (85%)**. The answer excels on Moore and hinges’ functional role but falters on doubt and imports non-Wittgensteinian epistemology. With tighter exegesis of revisability and avoidance of "entitlement," it would reach A-range.
