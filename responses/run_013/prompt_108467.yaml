prompt: |-
  I'm a third-year PhD student in comparative literature, midway through a dissertation on constrained translation — the tradition that runs through Hofstadter's 1997 *Le Ton beau de Marot*, in which many English versions of a short Renaissance French poem addressed to a sick young woman are used to probe what "the same poem" could mean, and through the Oulipo-adjacent experiments in writing under formal restriction. Next month I have to run the methods session of our translation-studies MA seminar: fourteen students, ninety minutes, one room, no preparation expected of them. I want a runnable activity rather than a talk. What they should come away having felt is that "the same poem in English" is not a determinate target — that fidelity is a bundle of demands which cannot all be met at once, that every version is a purchase made at some other feature's expense, and that this is structural rather than a failure of their skill. They should not hear the vocabulary I use below until the debrief names it.

  Some constraints on the design. Work intralingually: the source text is in English and the versions are in English, deliberately, so that no one's foreign-language competence becomes the variable and the only thing under pressure is form. The source should be a short lyric I compose myself — you need not write it; specify instead the properties it must have for the activity to bite (a fixed syllable count per line, an end-rhyme scheme, a name or acrostic doing structural work, one pun or piece of wordplay that works only in the source, and at least one element whose exact English wording is the point rather than its sense). Assume I will test in advance that no single version can satisfy all the demands you build in.

  The mechanics I want, roughly: pairs draw brief cards, each naming one formal or semantic commitment to preserve and nothing else; they draft; versions are read out anonymously; the class scores them and must then send exactly one version to a fictional anthology whose only stated criterion is "faithful." Two twists should be built in and withheld from the students: at least two pairs receive the identical brief, so that the reveal shows a constraint underdetermining the solution; and the source text I hand out should be revealed at the end to be itself a constrained solution to an earlier draft of my own, so that the students see the "original" as a translation too. Give me a payoff scheme that needs no money — I am happy for the winning version to become the official handout text the following week, with each student's hundred-word translator's note printed beneath it.

  Deliver: the materials and the brief cards (one worked card in full), the rules, a minute-by-minute timeline for the ninety minutes, the small stakes, and a debrief that maps each moment of the session onto the ideas above, saying which of my framing claims are load-bearing and which are decoration. Then tell me honestly what will predictably go wrong the first time I run it — where students will game the scoring, where the exercise will collapse into taste, where I will be tempted to rescue it by lecturing — and how to handle each. Finish with what the activity cannot reproduce: the experience of actually working between two languages, the long obsessive proliferation of versions that gives Hofstadter's book its peculiar texture, and any claim of his that form and content are inseparable in general.

  Two requests about the answer itself. First, separate what is settled from what is genuinely contested among people who work on translation: that formal constraints force trade-offs, and that "fidelity" names a family of incompatible demands rather than one, are broadly agreed; that a poem's form and content are inseparable, or that Hofstadter's treatment of translation as a model of cognition is a substantive theory, are contested, and I do not want them presented as consensus. Second, a hard limit: under 1,500 words, with headings, and no citations, bibliography, or reading list — I will be using this in a room with no internet.
reasoning: |-
  We are designing a 90-minute in-class activity for an MA translation seminar. The goal is to demonstrate that "the same poem in English" is not a determinate target, that fidelity involves trade-offs, and that every translation choice sacrifices some features for others. The activity will use an intralingual approach (source and versions in English) to focus on formal constraints without the variable of foreign language competence.

  ## Materials and Setup

  ### Source Poem Specifications
  I will compose a short lyric (8-12 lines) with the following properties:
  - Fixed syllable count per line (e.g., 8 syllables).
  - A clear end-rhyme scheme (e.g., ABABCDCD).
  - An acrostic: the first letter of each line spells a relevant word (e.g., "CONSTRAIN").
  - One pun or wordplay that relies on specific English wording (e.g., a homophone or double entendre).
  - One element where the exact English wording is crucial (e.g., a proper name, a cultural reference, or an idiom that cannot be altered without loss).

  Example (for illustration only; you will write your own):
  ```
  C  Can one night's absence hurt so much? (8 syllables)
  O  Only the clock's tick, counting slow, (8)
  N  Now seems to scream. The silent touch (8)
  S  Stays in the air. Where did you go? (8)
  T  Time stretches thin. I hear the rain (8)
  R  Rattle the pane. The cold wind blows— (8)
  A  A name I whisper, soft as snow, (8)
  I  Is all I have. The fever grows. (8)
  N  Night deepens. Still, the ache remains. (8)
  ```
  Acrostic: "CONSTRAIN" (9 lines). Wordplay: "snow" (soft as snow, but also "snow" as in cold, contrasting with fever). Crucial element: "the clock's tick" (specific sound and cultural association).

  ### Constraint Cards
  Prepare 14 cards (one for each student, but they work in pairs, so 7 pairs; adjust if needed). Each card names ONE constraint to preserve. Include:
  - Rhyme scheme (e.g., "Preserve the ABABCDCD rhyme scheme exactly")
  - Syllable count (e.g., "Each line must have exactly 8 syllables")
  - Acrostic (e.g., "Retain the acrostic that spells 'CONSTRAIN'")
  - Pun/wordplay (e.g., "Include a pun on 'snow' meaning both cold and silence")
  - Key phrase (e.g., "Use the exact phrase 'the clock's tick'")
  - Semantic element (e.g., "Keep the idea of time stretching thin")
  - Tone (e.g., "Maintain the anxious, intimate tone")
  - Imagery (e.g., "Include the image of wind rattling the pane")
  - Grammar (e.g., "Use only present tense")
  - Structure (e.g., "Retain the nine-line structure")

  *Twist 1: Two pairs get identical cards (e.g., two pairs get "Preserve the rhyme scheme").*
  *Twist 2: The source poem is revealed at the end to be a constrained version of an earlier draft.*

  ### Worked Example of One Card
  Card: "Preserve the acrostic that spells 'CONSTRAIN' in the first letter of each line."

  ### Rules of the Activity
  1. Pairs draw one constraint card each.
  2. They have 20 minutes to produce a new version of the source poem in English that satisfies their constraint. They may change anything else.
  3. Versions are collected and read aloud anonymously by the instructor.
  4. The class scores each version on a scale of 1-5 for "faithfulness" (no further definition given).
  5. After scoring, the class must choose exactly one version for a fictional anthology titled "Faithful Translations."
  6. The instructor reveals: (a) which constraints were assigned (including duplicates), and (b) that the source poem was itself a constrained translation of an earlier draft.

  ### Payoff
  The winning version becomes the official handout for the next seminar, with each student contributing a 100-word translator's note reflecting on their choices (due via email within 48 hours). The notes will be printed beneath the poem.

  ## Minute-by-Minute Timeline (90 Minutes Total)

  - 0:00 - 0:05 (5 min): Introduction. Frame the activity: "Today we are going to experiment with translating a poem. But we are translating from English to English. Your task is to produce a version that is 'faithful' in one specific way. You'll get a card telling you what to preserve." Hand out source poem and constraint cards (one per pair). Do not define "faithfulness" or discuss trade-offs.

  - 0:05 - 0:25 (20 min): Drafting in pairs. Pairs work on their versions. Instructor circulates to answer logistical questions but avoids guiding choices.

  - 0:25 - 0:30 (5 min): Collect versions. Instructor shuffles and assigns numbers for anonymity.

  - 0:30 - 0:50 (20 min): Reading and scoring. Instructor reads each version aloud twice. After each, students score it 1-5 (low to high) for "faithfulness" on a slip of paper. Collect scores after each reading.

  - 0:50 - 1:00 (10 min): Tally and announce scores. Write the average score for each version on the board. Then, ask the class to vote by show of hands for the one version to include in the anthology. Record the winner.

  - 1:00 - 1:15 (15 min): Reveal and debrief.  
    Step 1: Reveal the constraints assigned to each version (read them out). Highlight that two pairs had identical constraints but produced different versions.  
    Step 2: Reveal that the source poem was itself a constrained version of an earlier draft (show the draft briefly).  
    Step 3: Structured discussion:  
      - "What made scoring faithfulness hard?"  
      - "Why did two teams with the same constraint produce different poems?"  
      - "What did you have to sacrifice to meet your constraint?"  
      - "What does this tell us about the idea of a single 'faithful' translation?"  

  - 1:15 - 1:30 (15 min): Connect to theory. Without jargon, map the experience to the claims:  
    - Fidelity is a bundle of demands (trade-offs are inevitable).  
    - The "same poem" is indeterminate (constraints underdetermine solutions).  
    - The source is not a stable original (it too is a version).  
    Note: Avoid claiming form and content are inseparable as consensus.  

  ## What Will Go Wrong (and How to Handle It)

  1. **Scoring becomes arbitrary or based on taste:** Students might score based on how "poetic" a version sounds, not faithfulness.  
     *Handle:* In the debrief, explicitly ask: "Did anyone feel they were judging how 'good' the poem was versus how 'faithful'? What does that tell us about fidelity?" Turn confusion into data.  

  2. **Pairs ignore their constraint:** Some may prioritize making a "nice" poem.  
     *Handle:* During drafting, gently remind: "Remember, your card tells you the one thing you must preserve." In debrief, note: "Some versions might have strayed from their constraint. Why might that happen? Is it because the constraint conflicted with other features?"  

  3. **The exercise collapses into frustration:** Students may feel the task is impossible.  
     *Handle:* Normalize this: "If you felt frustrated, that's the point! Translation under constraint forces hard choices. There is no perfect version."  

  4. **Instructor lectures prematurely:** Avoid explaining trade-offs during the activity.  
     *Handle:* Stick to the timeline. If students ask "What is faithfulness?", say: "That's for you to interpret. We'll discuss after."  

  5. **Voting for the anthology is biased:** Friends vote for friends, or the first/last version is favored.  
     *Handle:* Anonymize versions thoroughly. If bias emerges, note in debrief: "Did knowing the constraints change how you viewed the versions? How might anonymity affect judgment?"  

  ## What the Activity Cannot Reproduce

  1. **Interlingual experience:** Working within one language misses the friction of two linguistic systems (e.g., grammar, untranslatable words).  

  2. **Hofstadter's obsessive proliferation:** The activity is a snapshot; it cannot convey the years-long process of generating hundreds of versions.  

  3. **Form-content inseparability:** While the activity shows trade-offs, it does not prove that form and content are inseparable in all cases (a contested claim).  

  ## Debrief Mapping to Claims

  - **Drafting under constraint (20 min):** Load-bearing for "fidelity is a bundle of demands." Students feel the sacrifice.  
  - **Identical constraints producing different versions:** Load-bearing for "underdetermination of the solution."  
  - **Source as constrained translation:** Load-bearing for destabilizing the "original."  
  - **Scoring and voting:** Decoration to create engagement; the real payoff is the discussion of why it was hard.  
  - **Trade-offs discussion:** Core for "structural sacrifice, not failure of skill."  

  ## Final Note
  The activity isolates formal constraints to expose trade-offs. It does not engage interlingual translation or claim that form and content are inseparable. It shows that fidelity is multidimensional and that choices are inevitable.  

  Word count: ~1,200 (excluding this note).
answer: |-
  ### **Activity Design: "The Fidelity Auction"**  
  *(Total words: ~1,450)*  

  ---

  #### **SOURCE POEM SPECIFICATIONS**  
  You will compose an 8-line lyric with these properties:  
  1. **Fixed structure**: 8 syllables/line, ABABCDCD rhyme scheme.  
  2. **Acrostic**: First letters spell "TRADEOFF" (8 lines).  
  3. **Pun**: A word with double meaning (e.g., "light" as *not heavy* and *illumination*).  
  4. **Untransposable element**: A culturally specific idiom (e.g., "kick the bucket").  
  5. **Key line**: Line 5 must include the phrase "the same poem" verbatim.  
  *Why this works*: The acrostic demands rigid line order, the pun resists semantic substitution, the idiom requires cultural adaptation, and "the same poem" forces literal retention even if it clashes with other goals.  

  ---

  #### **CONSTRAINT CARDS (14 CARDS, 7 PAIRS)**  
  *(Each card specifies ONE priority; two pairs get identical cards.)*  
  - **Rhyme Scheme**: "Preserve the ABABCDCD end-rhyme exactly."  
  - **Syllables**: "Keep 8 syllables per line, no exceptions."  
  - **Acrostic**: "Retain the acrostic spelling 'TRADEOFF'."  
  - **Pun**: "Include the double meaning of [word, e.g., 'light']."  
  - **Idiom**: "Translate the idiom [e.g., 'kick the bucket'] naturally in English."  
  - **Key Line**: "Use the exact phrase 'the same poem' in line 5."  
  - **Tone**: "Maintain the melancholic tone."  
  - **Imagery**: "Keep all original images (e.g., 'broken clock')."  
  - *Duplicated cards*: Two pairs receive **"Syllables"**; two receive **"Tone"**.  

  **Worked Example Card (Full Text)**:  
  > *"Preserve the ABABCDCD end-rhyme exactly. Change anything else, but the rhyme pattern must be identical to the source."*  

  ---

  #### **MATERIALS**  
  - Source poem handout (revealed as your "constrained version" later).  
  - 14 constraint cards (laminated for reuse).  
  - Scorecards (paper slips for 1–5 ratings).  
  - Blackboard/flip chart for scoring tallies.  

  ---

  #### **TIMELINE (90 MINUTES)**  
  **0:00–0:10 — Setup (10 min)**  
  - Introduce activity: "Today, you’ll ‘translate’ an English poem into English. Your goal: make it ‘faithful.’ Each pair gets one rule to follow."  
  - Hand out source poem and one constraint card per pair. *Do not define "faithful."*  

  **0:10–0:35 — Drafting (25 min)**  
  - Pairs draft their versions. Circulate to answer *only* logistical questions (e.g., "Can we change line order?" → "Yes, if your constraint allows").  

  **0:35–0:45 — Collection (10 min)**  
  - Collect anonymous versions, assign numbers (e.g., Version 1–7).  

  **0:45–1:05 — Scoring (20 min)**  
  - Read each version aloud twice.  
  - Students score each 1–5 for "faithfulness" (no criteria given). Tally averages on the board.  

  **1:05–1:15 — Anthology Vote (10 min)**  
  - Class debates and votes for *one* version for the "Faithful Translations Anthology."  

  **1:15–1:30 — Reveal & Debrief (15 min)**  
  - **Reveal 1**: Show constraint assignments. Highlight identical cards (e.g., "Both Team 2 and Team 5 had ‘Syllables’").  
  - **Reveal 2**: Show your "earlier draft" of the source poem (e.g., free verse without constraints). Announce: "Your source was *my* constrained version of this."  
  - **Discussion questions**:  
    - "Why did identical constraints produce different poems?"  
    - "What did you sacrifice to meet your constraint?"  
    - "What made scoring ‘faithfulness’ hard?"  

  ---

  #### **PAYOFF SCHEME**  
  - Winning version is printed in next week’s handout.  
  - Each student submits a 100-word translator’s note via email within 48 hours, printed beneath the poem. Notes must:  
    - Explain their choices (even if their version lost).  
    - Reflect on what "faithfulness" cost them.  

  ---

  #### **DEBRIEF: MAPPING TO CLAIMS**  
  | **Activity Moment**       | **Load-Bearing Claim**                                  | **Decoration/Setup**              |  
  |---------------------------|--------------------------------------------------------|-----------------------------------|  
  | **Drafting under constraint** | Fidelity is a bundle of incompatible demands; trade-offs are structural. | None. |  
  | **Identical-constraint reveal** | Constraints underdetermine solutions; "same poem" is indeterminate. | Anonymous scoring. |  
  | **Source-as-translation reveal** | No "original"; all texts are constrained versions. | Anthology vote. |  
  | **Scoring confusion**     | Fidelity judgments are subjective and competing.       | Numerical ratings.                |  

  **Settled Claims Reinforced**:  
  - Trade-offs are inevitable when formal constraints conflict.  
  - "Fidelity" is a family of demands (rhyme vs. meaning vs. tone) that cannot all be satisfied.  

  **Contested Claims Avoided**:  
  - *Not asserted*: Form/content inseparability (Hofstadter’s view).  
  - *Not asserted*: Translation as a model of cognition.  

  ---

  #### **PREDICTABLE FAILURES & SOLUTIONS**  
  1. **Students "game" scoring**:  
     - *What*: Rating their friends higher or punishing complex versions.  
     - *Fix*: Anonymize rigorously. In debrief, ask: "Did anonymity affect your scoring? Why?"  

  2. **Exercise collapses into taste**:  
     - *What*: Voting based on "which sounds nicest," not faithfulness.  
     - *Fix*: Use reveal to show constraints weren’t met. Ask: "Did ‘beautiful’ versions score higher? Should they?"  

  3. **Instructor lectures prematurely**:  
     - *What*: You’ll want to explain trade-offs when students struggle.  
     - *Fix*: Set a timer for drafting. Say only: "Your constraint is your compass."  

  4. **Frustration with constraints**:  
     - *What*: Pairs protest, "I can’t keep the rhyme AND syllables!"  
     - *Fix*: Smile: "That’s the point. What will you sacrifice?"  

  ---

  #### **WHAT THE ACTIVITY CANNOT REPRODUCE**  
  1. **Interlingual friction**: Working in one language misses grammatical/cultural untranslatability (e.g., tense systems, gendered nouns).  
  2. **Hofstadter’s obsession**: The 90-minute sprint can’t replicate years of iterative revision or the "peculiar texture" of endless variants.  
  3. **Form-content inseparability**: While the activity *shows* trade-offs, it doesn’t prove form and content are fused *in all art*—a contested claim.  

  ---

  #### **HONEST ASSESSMENT**  
  **First-run risks**: Teams with "tone" or "imagery" constraints may produce wildly divergent versions, causing voting chaos. Lean into this—it proves the point. If debate stalls, force a vote with a 60-second timer. **Core win**: Students will feel the ache of sacrifice in their drafts. That visceral frustration is the goal.
