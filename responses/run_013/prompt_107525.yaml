prompt: |-
  Every piece of digital text I have ever written rests on a division of labor that nobody ever voted on. The text itself stores characters; the shapes come from the font. The same file can be set in a blackletter face, a geometric sans, or a coarse pixel face for a tiny screen, and we say the text is unchanged throughout. Unicode, which fixes what the characters are, treats the double-story a of ordinary prose and the single-story ɑ of phonetic transcription as two different characters, and treats the Latin a and the Cyrillic a — which many text faces draw identically — as two different characters as well, while the bold and italic letters used in mathematical typesetting were given code points of their own. Yet a geometric face may draw the very same character as a single-story a, so the very shape difference that marks two characters in one context is a free stylistic choice in another. Downstream, everything that consumes text — a screen reader speaking a document aloud, a search engine matching a query, a spell-checker, a line-breaking algorithm — treats the letter as the character and pays no attention to the shape at all.

  What conception of the letterform does this practice presuppose? Please reconstruct the implicit theory and then interrogate it. Is the practice committed to the view that a letter is individuated by its role within a writing system — by the contrasts it enters into with other characters — rather than by its shape, by what competent readers recognize, or by anything intrinsic to the mark itself? Which rival accounts of what makes an 'a' an 'a' does the practice quietly rule out, and which does it merely fail to require? Where is the practice underdetermined, such that several incompatible theories of letterform identity would license exactly the same encoding and rendering decisions? Are the parts of the practice consistent with one another, or does it silently draw on two different principles across the cases above? And if we replaced the presupposed conception with a perceptual or structural one — on which an 'a' just is a certain configuration of strokes, or a region in a space of stylistic parameters with a central prototype and vague boundaries — what would have to change in character encoding, in font design and licensing, in text search, in screen readers, and in the way legibility is tested? Be concrete about the changes rather than gesturing at a general rethinking.

  I am not looking for sources or citations; I want the analysis. Please write your answer in American English.
reasoning: |-
  Okay, let me approach this query methodically. The user presents a sophisticated analysis of how digital text separates character identity from visual form, challenging us to reconstruct the implicit theory behind this practice. 

  First, I need to unpack the core observation: digital text treats characters as abstract entities distinct from their rendered shapes. This manifests in several ways: (1) Unicode encodes distinct code points for characters that may look identical (Latin/Cyrillic а) while separating stylistic variants (ɑ vs a); (2) Fonts freely reinterpret shapes without altering character identity; (3) Text-processing tools operate solely on abstract characters. 

  The fundamental presupposition appears to be that letters are defined by their systemic roles - their position in a writing system's contrastive structure. This theory prioritizes functional differentiation over perceptual similarity. I'll need to examine what this rules out: shape-based theories would collapse Latin/Cyrillic distinctions, while recognition-based theories couldn't handle unfamiliar typefaces. The practice seems coherent but reveals tension where identical shapes represent different characters versus stylistic choices.

  Considering alternatives: a perceptual theory would require visual matching algorithms and make fonts character-specific, breaking search functionality. A structural theory might group all single-story 'a' variants, complicating linguistic precision. Implementing either would necessitate overhauling Unicode's design principles, font licensing models, and accessibility tools.

  For concrete impacts: switching to shape-based identity would mean search engines matching glyphs rather than characters, screen readers needing OCR, and fonts becoming inseparable from text content. Legibility testing would shift from readability studies to shape-recognition thresholds. These consequences demonstrate how deeply the systemic-view is embedded in current infrastructure.
answer: |-
  The digital text ecosystem rests on a **systemic-functional theory of the letterform**. This theory holds that:

  1.  **A letter is defined by its contrasting role within a specific writing system.** Its identity is relational, not intrinsic.
  2.  **Shape is a contingent property,** delegated to fonts for stylistic realization. The *same* abstract character can manifest in vastly different shapes.
  3.  **Character encoding (e.g., Unicode) captures this systemic identity.** Code points represent functional slots (`U+0061` = LATIN SMALL LETTER A), not specific shapes.
  4.  **Downstream processing operates solely on the encoded identity,** ignoring rendered shape entirely. Meaning and function derive from the abstract character, not its instantiation.

  **Interrogating the Systemic-Functional Theory:**

  *   **What it Rules Out:**
      *   **Strict Shape Essentialism:** The practice fundamentally rejects that a letter *is* its shape. Identical shapes (Latin `a` vs. Cyrillic `а`) are different characters; radically different shapes (Times New Roman `a` vs. a pixel-art `a`) are the same character. Shape is variable and non-defining.
      *   **Perceptual Recognition as Definition:** Competent readers *recognize* shapes *as* letters, but the system doesn't use reader perception to *define* the letter. A screen reader doesn't OCR the shape; it uses the code point. A novel or distorted glyph encoding `U+0061` is still an 'a' for processing, even if readers initially misrecognize it.
      *   **Intrinsic Structural Definition:** The practice doesn't care if an 'a' is single-story or double-story, has a serif or not, or its exact stroke configuration. These are font choices, not identity criteria. The essential "a-ness" is its role in the Latin script, contrasting with 'b', 'c', etc.

  *   **What it Merely Fails to Require (Is Underdetermined By):**
      *   **The Nature of the "System":** Is the system purely syntactic (position in a coded set) or does it incorporate semantic/functional aspects (e.g., `a` represents a specific sound or morpheme)? The practice works with either interpretation.
      *   **The Boundaries of "Sameness":** Why are italic `a` (`U+0061` + styling) and mathematical bold italic `𝑎` (`U+1D44E`) treated differently? The line between stylistic variant (same character) and distinct functional symbol (new character) is drawn by convention (e.g., math needing distinct semantic markers), not a deep principle inherent to the core theory. The practice allows both approaches contextually.
      *   **The Ontology of the Abstract Character:** Is `U+0061` a platonic ideal, a functional role, or just a label in a database? The practice works regardless of the metaphysical commitment.

  *   **Consistency?** The practice is largely consistent in prioritizing systemic role. The apparent tension – the *same* shape difference (single-story vs. double-story) marking distinct characters (`a` vs. `ɑ`) in one context (Latin IPA) but being stylistic variation in another (a geometric sans rendering `U+0061` as single-story) – is resolved contextually. The difference defines `ɑ` as a distinct character *within the Latin script for IPA purposes*. Rendering `U+0061` with a single-story shape doesn't change its systemic role *within the standard Latin alphabet*; it's still the slot for "LATIN SMALL LETTER A". The functional context determines whether the shape difference is identity-defining.

  **Consequences of Adopting a Perceptual or Structural Theory:**

  Replacing the systemic-functional theory with a **perceptual theory** (a letter is defined by its recognizable visual pattern) or a **structural theory** (a letter is defined by specific geometric features/configurations) would necessitate radical changes:

  1.  **Character Encoding (Unicode):**
      *   **Eliminate Script Distinctions for Visually Similar Characters:** Latin `a` (`U+0061`) and Cyrillic `а` (`U+0430`) would likely need a *single* code point, as they are often visually identical. Script identity would become secondary or metadata.
      *   **Encode Shape Variants:** Single-story `a` and double-story `a` would likely become distinct code points, as they are structurally/perceptually distinct. `ɑ` (`U+0251`) might merge with the single-story code point.
      *   **Massive Proliferation:** Every significant stylistic variation (e.g., slab-serif `a`, handwritten `a`, stencil `a`) could demand its own code point if perceived or structured differently enough. Unicode would become unwieldy.
      *   **Loss of Historical/Linguistic Connection:** The link between a character and its writing system/origin would be severed; identity would be purely visual/stylistic.

  2.  **Font Design & Licensing:**
      *   **Fonts Become Content, Not Style:** A font wouldn't just render `U+0061`; the specific shape *would be* the character. Embedding fonts in documents would become mandatory for meaning preservation.
      *   **Glyph = Character:** Licensing would involve licensing specific *shapes* as distinct characters, not designs for abstract slots.
      *   **Design Constraints:** Fonts could no longer offer stylistic interpretations (e.g., a geometric single-story `a` for `U+0061`); they could only render the "correct" perceptual/structure for each character. Innovation in type design would be severely hampered.

  3.  **Text Search:**
      *   **Shape/Structure Matching Required:** Searching for "cat" would require matching specific glyph shapes/structures, not abstract characters. Searching a document set in Times New Roman would not find "cat" set in Futura or a handwritten font unless their shapes were deemed perceptually/structurally equivalent by the algorithm – a complex and error-prone task.
      *   **OCR as Core Technology:** Search engines would need advanced OCR to interpret the shapes on the page/screen before searching, vastly increasing complexity and reducing reliability.

  4.  **Screen Readers:**
      *   **OCR Dependency:** Screen readers could no longer rely on encoded characters. They would need real-time, highly accurate OCR to interpret the visual shapes on screen to determine what "letter" is present before speaking it. Performance and accuracy would plummet, especially with novel, decorative, or distorted fonts.
      *   **Loss of Semantic Cues:** Distinctions like Latin vs. Cyrillic, or mathematical bold italic, would be lost if the shapes were similar, potentially garbling the meaning.

  5.  **Legibility Testing:**
      *   **Shift to Shape Recognition Thresholds:** Testing would focus solely on whether a specific glyph configuration (strokes, counters) could be reliably distinguished from others by a perceiver, divorced from its linguistic function. It would become pure psychophysics of pattern recognition.
      *   **Loss of Context:** The role of the character within words and language (which aids real-world recognition) would be irrelevant. Testing would use isolated glyphs.

  **Conclusion:**

  The current digital text practice presupposes a robust, pragmatic theory where a letter is fundamentally a functional unit within a coded writing system. Its visual realization is delegated and variable. This system efficiently separates meaning and processing from presentation. While it creates apparent paradoxes (like shape differences being identity-defining in one context but stylistic in another), these are resolved by the primacy of the systemic context.

  Adopting a perceptual or structural theory would dismantle this efficient separation. It would collapse vital linguistic distinctions (Latin vs. Cyrillic), explode the character set, force fonts to embody content, cripple search and accessibility by making them dependent on unreliable shape recognition, and fundamentally alter how we think about and test written communication. The systemic-functional theory, despite its philosophical complexities at the margins, underpins the practical interoperability and flexibility that defines digital text.
