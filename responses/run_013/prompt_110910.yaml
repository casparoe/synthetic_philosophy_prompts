prompt: |-
  I'm a novelist — literary fiction, mostly — and a metaphysics question keeps messing with how I write backstory. Take the view that a person's origin is essential to them: the particular sperm and egg that made you aren't just how you got here, they're part of what you are, so a world with a different sperm and egg contains a different person, not you. The rival view says that's wrong: you could have come from a different sperm and egg, because what makes you you is some later fact — psychological continuity, a pattern, whatever — not the source. I know the debate well enogh to get into trouble, but I think in drafts, canon, origin stories, prequels, retcons, alternate-universe fanfic, character arcs, and the weird feeling when a character in draft 2 is 'the same character' with a completely different backstory. You're a philosopher who also knows how novels actually get made: think carefully, and start by brainstorming the best mapping you can between the two views and the novelist's toolkit. Then translate both views into that vocabulary as faithfully as you can, and give me the residue report — what maps cleanly, what only maps with distortion, what has no counterpart at all, and whether the leftover is a defect in the novelist's vocabulary or a sign the philosophers are fudging something. Don't hedge: take a definate line on which translation is better and why. British English, please.
reasoning: |-
  Okay, the user is a novelist dealing with a metaphysics problem about personal identity affecting their writing process. They're torn between two philosophical views: one says a person's origin (specific sperm and egg) is essential to their identity, while the other claims identity comes from psychological continuity or patterns. 

  Hmm, this is fascinating because it's not just abstract philosophy—it directly impacts their creative work. The user mentions practical writing elements like drafts, retcons, and alternate universes. They want me to map these philosophical concepts onto novel-writing tools and identify where the theories fit or clash with actual literary practice. 

  Right, first I need to establish a solid vocabulary for the novelist's toolkit. Things like "canon" (established facts), "drafts" (iterations), "character essence" (what makes a character recognizable), etc. The user clearly knows philosophy but wants concrete writing applications, so I should avoid getting lost in theoretical weeds.

  *scratches head* The essentialist view (origin defines identity) maps neatly to canon and continuity—it's why changing a character's backstory feels like creating a new person. But that's problematic for writing because novels thrive on "what if?" scenarios and revisions. The psychological continuity view fits better with how writers actually work—we preserve characters through core traits even when altering their past. 

  Ah! The residue is telling: Philosophers care about metaphysical truth, while novelists care about narrative function. The essentialist view leaves "stubborn residue" in writing practice because it can't handle retcons or alternate universes without breaking character identity. Whereas psychological continuity accepts that characters are narrative constructs first. 

  *checks user's tone* They're sophisticated but frustrated ("messing with how I write"). They want decisiveness. So I'll firmly say psychological continuity wins for novelists—not because it's philosophically correct, but because it mirrors the creative process. The "soul" of a character isn't their fictional DNA; it's their thematic role and voice. 

  Final note: British English as requested. No hedging. Time to structure this as a bold philosopher-novelist hybrid analysis.
answer: |-
  Right. Let's cut through the metaphysical fog with a novelist's scalpel. We'll map the **Essential Origin View** (you *are* your specific sperm-egg origin) and the **Psychological Continuity View** (you *are* a persisting pattern/consciousness) onto your toolkit. Forget abstract purity; we care about what works on the page.

  **The Novelist's Toolkit Vocabulary:**

  1.  **Canon:** The established, authoritative facts of the character's history and world. The 'bible'.
  2.  **Draft:** An iterative version of the narrative. Characters evolve *between* drafts.
  3.  **Character Essence:** The irreducible core that makes Character X recognisably *Character X* across interpretations or changes. (Voice, core drives, thematic role, *je ne sais quoi*).
  4.  **Backstory:** The events preceding the narrative present. Explains, motivates, or contrasts with the current state.
  5.  **Retcon (Retroactive Continuity):** Changing established canon (*after* it's established) to serve a new narrative need.
  6.  **Prequel:** A narrative set before the main story, exploring origins *within* the established canon framework.
  7.  **Alternate Universe (AU) / Fanfic:** A narrative operating under the premise "What if *this* key element was different?" Explores variants of the character.
  8.  **Character Arc:** The internal journey and transformation of the character *within* a narrative.
  9.  **The "Same Character" Feeling:** The intuitive recognition that Draft 2's Character X, despite changes, *is* the same entity as Draft 1's Character X.

  **Mapping the Essential Origin View (EOV):**

  *   **Canon:** The Origin Story within the Canon is **sacrosanct**. It's not just history; it's *constitutive*. Changing it isn't editing; it's erasing the character and creating a new one.
  *   **Draft:** Significant changes to the origin story *between* drafts mean Draft 2 features a **different character**, not a revised version of the Draft 1 character. The origin is the anchor.
  *   **Character Essence:** The essence is **inseparable from the origin**. The specific sperm-egg combination *is* the foundational essence. Change the origin, destroy the essence.
  *   **Backstory:** The earliest parts of the backstory (the origin event itself) are **metaphysically privileged**. Later backstory might be malleable, but the origin is fixed.
  *   **Retcon:** Altering the origin via retcon is **impossible without killing the character**. It's narrative murder followed by replacement. A profound betrayal of the character's being.
  *   **Prequel:** Can only explore events *after* the essential origin event. The origin itself is a fixed point, perhaps hinted at but fundamentally unexplorable or unchangeable. Its *consequences* are the prequel's domain.
  *   **AU/Fanfic:** An AU that changes the origin **does not feature that character**. It features a lookalike, an imposter, a completely different entity sharing a name or superficial traits. "What if Luke Skywalker wasn't Anakin's son?" isn't Luke; it's someone else entirely.
  *   **Character Arc:** The arc is constrained by the fixed origin. The origin is the immutable starting point defining the range of possible transformation. Destiny is heavily origin-bound.
  *   **"Same Character" Feeling:** Can only occur if the origin story remains **identical** across drafts. Change it, and the feeling is an illusion or an error.

  **Mapping the Psychological Continuity View (PCV):**

  *   **Canon:** The Origin Story in the Canon is **important context**, but not metaphysically defining. It explains the *starting point* of the pattern, not the pattern itself.
  *   **Draft:** Changes to the origin story *between* drafts are **revisions to the character's history**, not character replacement. The core pattern (essence) persists if recognisable.
  *   **Character Essence:** The essence is the **enduring psychological pattern** – core personality, memories (or their narrative function), motivations, voice, thematic resonance. This pattern *could* have emerged from a different origin.
  *   **Backstory:** Backstory (including origin) is **explanatory narrative**. It shapes the pattern, but the pattern is the primary thing. Change the backstory, and you change *how* the pattern formed, not necessarily *what* the pattern *is* fundamentally.
  *   **Retcon:** Altering the origin via retcon is **recontextualising the character**. It changes their history and perhaps their motivations, but if the core pattern adapts believably, it's still *them*. ("Ah, *that's* why they're like that now!")
  *   **Prequel:** Can explore the origin event itself, *because* it's showing the **genesis of the pattern we know**. The prequel character *is* the younger version of the main character *because* the psychological continuity link is established.
  *   **AU/Fanfic:** An AU that changes the origin **can still feature the 'real' character** if the core psychological pattern emerges recognisably *despite* or *because* of the altered origin. "What if Harry Potter was raised by Sirius?" explores how the *same core Harry-ness* might manifest differently.
  *   **Character Arc:** The arc is the **evolution of the pattern itself**. The origin is the launchpad, but the journey and transformation define the character. Destiny is less origin-bound, more choice/experience-bound.
  *   **"Same Character" Feeling:** Occurs when the **core psychological pattern** remains recognisable, even if the origin story changes significantly between drafts.

  **The Residue Report:**

  1.  **Clean Mapping:**
      *   **PCV** maps almost **seamlessly** onto: Draft Evolution, Retcon, Prequel, AU/Fanfic, Character Arc, and crucially, the **"Same Character" Feeling** across backstory changes. This is how novelists *actually work* and readers intuitively respond.
      *   **EOV** maps cleanly only onto the **sanctity of established Canon** (if treated as unchangeable fact) and the idea that some backstory elements feel **foundational**. It captures the *weight* some origins carry.

  2.  **Mapping with Distortion:**
      *   **EOV onto Drafts/AU/Prequel/Retcon:** This mapping is **violently distorted**. The EOV insists these practices *destroy* the character, whereas in novel-writing, they are *fundamental tools for exploring and refining* the character. The EOV forces a metaphysical conclusion utterly at odds with creative practice. The distortion highlights the EOV's rigidity.
      *   **PCV onto Canon:** The PCV slightly **downplays** the visceral importance the origin *can* have within a specific canon. While logically just context for the pattern, a well-established origin *feels* more defining than the PCV readily accounts for. This is more about reader/writer psychology than metaphysics.

  3.  **No Counterpart / Leftover:**
      *   **EOV Residue (Unmappable):** The EOV leaves a **huge, stubborn residue**: the *actual practice and acceptance* of changing origins without destroying the character. This residue is **not a defect in the novelist's vocabulary**; it's a **fatal flaw in the EOV** as applied to fictional characters. It renders standard novelistic processes metaphysically nonsensical.
      *   **PCV Residue (Minor):** The PCV struggles slightly to articulate why a *really good*, deeply ingrained origin story can feel *so* essential that changing it *almost* breaks the character, even if the core pattern remains. This is **more about narrative weight and reader investment** than pure metaphysics. It's a limitation in translating the *emotional* impact of origins into the PCV's pattern-language, not a fundamental flaw.

  **The Definite Line:**

  **The Psychological Continuity View maps overwhelmingly better onto the novelist's toolkit.** It provides a coherent metaphysical framework that *validates* and *explains* how novelists actually create, revise, and explore characters across drafts, canons, prequels, retcons, and AUs. It accounts for the "same character" feeling despite backstory changes by prioritising the persistent *pattern* – the voice, drives, and thematic core – over the biological specifics of their fictional conception. The Essential Origin View, while capturing the *gravitas* an origin can hold, is fundamentally **hostile to the creative process**. It turns standard novelistic practices into acts of character annihilation, which is demonstrably not how writing or reading works. Philosophers fudge nothing; the EOV is logically coherent *for real persons*. But for the *constructed persons* of fiction, it's a metaphysical straitjacket that ignores how narrative identity functions. The residue left by the EOV isn't a novelist's oversight; it's proof that the EOV is the wrong tool for the job. Your "weird feeling" when changing backstory? That's not metaphysics breaking; it's the friction of recontextualising a persistent pattern. Trust the pattern. It’s the soul of your character, not the fictional gametes.
