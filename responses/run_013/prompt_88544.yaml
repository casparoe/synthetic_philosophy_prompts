answer: |-
  Here is the constructed case meeting all specifications:

  **Case:** A 35-year-old office worker with lifelong severe myopia (-8.00 diopters in both eyes) has always required strong corrective lenses (glasses/contacts) to see clearly. Without correction, their uncorrected visual acuity is 20/400, far below the species-typical range (generally considered 20/20 to 20/40). They seek LASIK surgery to permanently correct their vision to 20/20, eliminating their dependence on external aids. They function adequately with glasses/contacts but find them inconvenient for sports, travel, and swimming. Their job (data entry) and life plans are not immediately threatened by their myopia when corrected, but the *constant dependency* on aids causes minor daily frustrations and limits spontaneous activities. LASIK is a routine, existing procedure. An insurer must decide whether to cover it.

  **(1) Verdicts & Reasoning:**

  *   **C1 (Species-Dficit): THERAPY.** Without correction, the recipient's visual acuity (20/400) is significantly below the species-typical range (approx. 20/20-20/40). LASIK moves their uncorrected functioning *into* the species-typical range (to 20/20). Therefore, it is therapy.
  *   **C2 (Life-Plan): THERAPY.** While the recipient functions adequately *with aids*, the significant and lasting dependency on corrective lenses causes persistent minor frustrations and limits participation in spontaneous activities impacting their daily welfare. LASIK permanently protects against this lasting loss of welfare (the burden of dependency) and removes a limitation on pursuing a reasonable range of life activities (e.g., swimming without planning, playing sports without worry, waking up seeing clearly). Therefore, it is therapy.
  *   **C3 (Baseline): ENHANCEMENT.** The recipient has *never* possessed uncorrected visual acuity of 20/20. Their "baseline" uncorrected functioning is 20/400. LASIK confers a capacity (20/20 vision without aids) that they have never previously possessed. Therefore, it is enhancement.
  *   **Ordinary Verdict:** ELECTIVE. LASIK is widely considered an elective, cosmetic procedure. The individual functions well with corrective lenses; there is no medical necessity for surgery. They could decline it without significant loss of function. Insurers routinely deny coverage, schools wouldn't be obliged to pay for it, and clinicians present it as an optional choice.

  **(2) Institutional Rule & Opposed Decisions:**
  *   **Rule:** An insurance company's coverage policy for "medically necessary vision correction procedures."
  *   **Decision using C3 (Baseline):** DENY COVERAGE. Since LASIK confers a new capacity never previously possessed (uncorrected 20/20 vision), it is classified as enhancement. Enhancements are not medically necessary and therefore not covered.
  *   **Decision using C1 (Species-Deficit) & C2 (Life-Plan):** REQUIRE COVERAGE. C1 classifies it as therapy (correcting a sub-species-typical deficit), and C2 classifies it as therapy (preventing lasting welfare loss due to dependency). Both criteria would deem it medically necessary therapy that should be covered.

  **(3) Key Feature & Removal Test:**
  *   **Feature Doing the Work:** The recipient has *never possessed the corrected level of functioning without external aids* ("never previously had unaided 20/20 vision").
  *   **Removal Test (Vary Key Feature):** Change the case so the recipient *had* natural 20/20 vision until age 30, then developed -8.00D myopia due to disease, and now seeks LASIK to restore their vision.
      *   **C1:** Unchanged (THERAPY - still moves from below species-typical to within it).
      *   **C2:** Unchanged (THERAPY - still removes dependency and welfare loss).
      *   **C3:** Now THERAPY (restores previously possessed level of functioning).
      *   **Result:** The three-way split (C1-T, C2-T, C3-E) *collapses*. All criteria now classify LASIK as therapy. The divergent verdict disappears.

  **(4) What the Ordinary Verdict (Elective) Tracks:**
  The ordinary verdict of "elective" tracks **the presence of a functional workaround (corrective lenses) that mitigates the deficit to a socially acceptable level of functioning**, not the underlying biological deficit itself, the burden of dependency, or the lack of prior possession. Society deems vision correctable by affordable, non-invasive aids as "normal enough," rendering interventions to eliminate the dependency elective.
  *   **Demonstration via Further Variation:** Suppose the myopia is so extreme (-20.00D) that even the best corrective lenses provide only marginal improvement (e.g., 20/200 best-corrected acuity), significantly impairing work and daily life. LASIK now offers 20/40 vision.
      *   **C1:** THERAPY (moves uncorrected from far below species-typical to within/near it? Depends on strict range, but likely therapy).
      *   **C2:** THERAPY (prevents significant, lasting welfare loss from functional impairment).
      *   **C3:** ENHANCEMENT (confers best-corrected acuity never previously possessed).
      *   **Ordinary Verdict:** LIKELY MEDICALLY NECESSARY/COVERABLE. The lack of an effective workaround changes the ordinary verdict, demonstrating that "elective" is tied to the adequacy of the compensatory mechanism, not the classifications of T/E.

  **(5) Defence of the Distinction & Evaluation:**
  *   **Strongest Defence:** A defender could argue that C3 (Baseline) is not primarily a *classification* criterion for "therapy" vs. "enhancement" in a metaphysical sense, but rather an **entitlement criterion**. Its purpose is to determine if an intervention restores an existing entitlement (a previously held capability the individual is "due") or creates a new one. On this view, LASIK for congenital myopia doesn't restore an entitlement to unaided vision (never possessed), hence it's enhancement *for entitlement purposes* (e.g., coverage), even if C1/C2 mark the biological/life-plan deficit. The distinction tracks "what is owed" vs. "what is extra."
  *   **Evaluation:** This defence **merely relocates the arbitrariness**. It concedes that the core biological (C1) or welfare-based (C2) deficit exists and might be labeled "therapy," but shifts the functional distinction to the *normative question of entitlement*, based solely on prior possession (C3). Why is prior possession the morally relevant factor for entitlement, rather than current species-typical deficit (C1) or impact on welfare/life-plans (C2)? Justifying why restoring a *past* state creates an entitlement, while correcting an identical *congenital* deficit does not, appears arbitrary. The distinction (now framed as entitlement) still fails to track the underlying need, optionality, or brute luck (the congenital sufferer had worse brute luck regarding baseline). The arbitrariness persists in choosing prior possession as the entitlement trigger.

  **Conclusion:** The case demonstrates that the three criteria classify the same intervention differently (T/T/E), while the ordinary "elective" verdict tracks the availability of a compensatory aid, not the classifications. Defences based on reinterpreting C3 as an entitlement criterion relocate but do not resolve the distinction's arbitrariness. The therapy/enhancement distinction, whether as classification or entitlement, does not reliably track a unique moral category separate from need (mitigated by workarounds), optionality, or the contingent fact of prior possession versus congenital deficit (brute luck).
