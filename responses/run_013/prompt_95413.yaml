  ### **Leaf Theories**  
  1. **Risk-seeking EU**: Maximize expected utility with convex utility. *Awkward commitment:* You might take unfair bets (e.g., pay $60 for a 50% chance of $100).  
  2. **Risk-averse EU**: Maximize expected utility with concave utility. *Awkward commitment:* You must always be risk-averse if utility is concave, even for trivial stakes.  
  3. **Risk-neutral EU**: Maximize expected value (linear utility). *Awkward commitment:* You value 0.0001% chance of $1 billion the same as $1,000 for sure.  
  4. **Regret theory**: Minimize anticipated regret. *Awkward commitment:* Choices can be intransitive (A>B, B>C, C>A).  
  5. **Maximin/safety-first**: Avoid the worst outcome at all costs. *Awkward commitment:* You reject a 99.999% chance of curing cancer if failure means one headache.  
  6. **Lexicographic safety threshold**: Ignore probabilities below a fixed threshold. *Awkward commitment:* You refuse a 1-in-10^100 chance of doom for any gain, violating continuity.  
  7. **Ambiguity aversion**: Penalize unknown probabilities. *Awkward commitment:* You might pay to avoid ambiguous gambles even when odds are favorable.  
  8. **Risk-weighted EU (RWEU)**: Transform probabilities via a concave function (e.g., 10% chance weighted as 5%). *Awkward commitment:* Can violate dynamic consistency (e.g., prefer a plan now but reverse it later).  
  9. **Incomplete preferences**: Refuse to rank some gambles. *Awkward commitment:* You may be paralyzed when forced to choose (e.g., medical triage).  
  10. **Prospect theory (reference-dependent)**: Value changes from a reference point; loss-averse. *Awkward commitment:* Framing the same outcome as a loss or gain changes your choice.  
  11. **One-shot risk aversion**: Aversion only applies to non-repeatable gambles. *Awkward commitment:* You reject a single 50% chance of $200 vs. $100 sure, but accept 10,000 trials.  
  12. **Expected utility with stochastic dominance**: Adhere to dominance even when probabilities conflict with intuition. *Awkward commitment:* You accept gambles with a 0.0001% chance of ruin if they dominate in expectation.  

