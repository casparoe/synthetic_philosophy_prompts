prompt: |-
  I'm prepping a podcst interview with a decision theorist who thinks the independence axiom is definately a real requirement of practical rationality and that Allais-style choices are a mistake even after reflection. Draft 8 to 10 questions, each with a follow-up keyed to the answer she's likely to give. I want to get past the usual intuition-versus-axiom back-and-forth, so press on: what exactly independence rules out in the standard Allais case (A: sure 1M; B: 89 percent chance of 1M, 10 percent chance of 5M, 1 percent chance of 0; C: 11 percent chance of 1M, 89 percent chance of 0; D: 10 percent chance of 5M, 90 percent chance of 0), in terms of preferences over prospects rather than one-off choices; whether she has to call the agent's preferences inconsistent or only her choices; how she handles the common-consequence structure of the standard case, where the 89 percent state pays 1M in one pair and 0 in the other; whether regret-aversion or a shift in risk attitude across the pairs is a legitimate excuse or just a redescription of the violation; what she says to someone who accepts independence as a theorem about expected-utility representation but denies it's a constraint on rational preference; and whether she thinks independence is a coherence requirement, a constitutive principle of preference, or a normative ideal. Also include one question on the common-ratio variant: A is an 80 percent chance of 4,000, B is a sure 3,000, C is a 20 percent chance of 4,000, D is a 25 percent chance of 3,000. Ask whether the person who picks B and C is making the same kind of mistake as the person who picks A and D in the standard case, and what her answer implies for advising a policymaker who has to choose on behalf of a population. Finish with a question about what would count as evidence against her view, and a follow-up for the answer that it's a conceptual truth.
