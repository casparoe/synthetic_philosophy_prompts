   The answer:

   (a) The student states:
       "Good's theorem concerns an agent who must choose among a finite set of acts and who, before choosing, may perform a costless experiment whose result she will learn. Let the possible results be e₁, …, eₘ, with prior probabilities P(eᵢ), let U(a) be the prior expected utility of act a, and let U(a | eᵢ) be its expected utility conditional on result eᵢ. The theorem says that the expected utility of the policy 'observe, then choose the act with the highest conditional expected utility' is at least as great as the expected utility of choosing immediately: Σᵢ P(eᵢ) maxₐ U(a | eᵢ) ≥ maxₐ U(a)."

       This is essentially correct. However, note that U(a) is defined as the prior expected utility, and U(a | e_i) is conditional on e_i. The statement of the theorem is standard.

   (b) The student gives the proof:
       "For any fixed act a, U(a) = Σᵢ P(eᵢ) U(a | eᵢ), by the law of total probability applied to the agent's expected utilities. Since maxₐ U(a | eᵢ) ≥ U(a | eᵢ) for each result eᵢ, we have Σᵢ P(eᵢ) maxₐ U(a | eᵢ) ≥ Σᵢ P(eᵢ) U(a | eᵢ) = U(a). As this holds for every act a, it holds for the best act, which is the claim. The inequality is just the fact that the maximum of a set of numbers is at least as great as their weighted average."

       This is the standard proof. The key steps are:
          - The law of total expectation: U(a) = Σᵢ P(eᵢ) U(a | eᵢ)
          - Then, for each e_i, max over a of U(a | e_i) is at least U(a | e_i) for any fixed a.
          - So, Σᵢ P(eᵢ) maxₐ U(a | eᵢ) ≥ Σᵢ P(eᵢ) U(a | eᵢ) = U(a) for any fixed a.
          - Therefore, since the left-hand side is at least U(a) for every a, it is at least the maximum over a of U(a).

       This is correct.

   (c) The student states the assumptions:
       "The one real assumption is that the experiment is free. Everything else follows from the agent's having a preference ordering over the acts; in particular the proof never relies on any assumption about how she revises her probabilities on learning a result, since the equality U(a) = Σᵢ P(eᵢ) U(a | eᵢ) is a consequence of the probability calculus alone."

       This is incomplete. While the costless nature is crucial, the theorem also assumes that the agent is a Bayesian expected utility maximizer. Specifically:
          - The agent has a prior probability distribution over states and over the possible experiment results.
          - The agent updates by conditionalization upon learning the result.
          - The agent chooses an act that maximizes expected utility conditional on the information.

       The student claims that the equality U(a) = Σᵢ P(eᵢ) U(a | eᵢ) is a consequence of probability calculus alone, which is true if we interpret U(a | e_i) as the expected utility conditional on e_i using the prior. However, note that the conditional expected utility is defined using the conditional probabilities of states given e_i, and the law of total expectation holds because of the probability structure. But the student misses that the agent must be Bayesian and update by conditionalization. Also, the proof assumes that the agent, after seeing e_i, will choose the act that maximizes U(a | e_i). This requires that the agent's conditional probabilities are coherent and that she is an expected utility maximizer.

       The student says that the only real assumption is that the experiment is free, but there are more.

   (d) The student assesses the classmate's claim and extends to costly experiments:
       "A classmate says, 'By Good's theorem, gathering information can never leave you worse off.' ... If the experiment costs c, subtract c from the value of the informed policy, so the experiment is worth performing whenever its gain exceeds c. Since the gain is at least zero, free information is always worth taking and paid information is worth taking whenever it is cheap enough. A classmate who says that gathering information can never leave you worse off is therefore right: the informed policy's expected utility is at least that of the uninformed one, so an agent who runs the experiment is guaranteed to do at least as well as one who does not."

       The classmate's claim: "gathering information can never leave you worse off." The student says the classmate is right. But note: Good's theorem only shows that the expected utility of the informed policy is at least as high as the uninformed one. However, the theorem is about the ex ante expected utility. It does not guarantee that in every possible state of the world the agent will be at least as well off. For example, if the experiment leads to a result that causes the agent to choose an act that is suboptimal in the true state, then in that state she might be worse off. But on average (in expectation) she is at least as well off.

       The student's statement: "an agent who runs the experiment is guaranteed to do at least as well as one who does not" is ambiguous. It might be interpreted as in every state (which is false) or in expectation (which is true). The student does not clarify. Moreover, the student says the classmate is "right", but the classmate's statement is ambiguous and could be misinterpreted. The theorem only establishes the ex ante expectation.

       Also, the student correctly extends to costly experiments: subtract c from the informed policy's expected utility. Then the net gain must be nonnegative for the experiment to be worth taking. Since the gross gain (without cost) is nonnegative, then for c=0 it is always worth it, and for c>0 it is worth it when the gross gain exceeds c.

