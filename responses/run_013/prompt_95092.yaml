  - **A**: Value Pluralism  
  - **B**: Asymmetric Incommensurability (unnamed)  
  - **C**: Objective List Theory  
  - **D**: Scale Relativism  
  - **E**: Efficiency Constraint  
  - **F**: Straightforward Maximizing Consequentialism  
  - **G**: Symmetric Non-Aggregationism (prioritarianism/egalitarianism)  
  - **H**: Asymmetric Non-Aggregationism (unnamed)  
  - **I**: Institutional/Indirect Response  
  - *(Implicit)*: **Population Monster** 👥 and **Temporal Monster** ⏳ covered under aggregation branches; **Welfare-Dependent Monster** 💞 under net-effect branch.
