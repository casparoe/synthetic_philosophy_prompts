  ### Decision Tree for Classifying Positions on the Utility Monster

  **Instructions:** Answer each question to navigate the tree. The leaves represent distinct positions. Each leaf names a view (where applicable) and states its most awkward commitment. Three novel cases beyond the standard utility monster are integrated and labeled:  
  - 💞 **Welfare-Dependent Monster**: Gains welfare solely from others' welfare (e.g., thrives on envy or altruism).  
  - 👥 **Population Monster**: A group (not an individual) with extreme per-capita welfare gains.  
  - ⏳ **Temporal Monster**: Gains extreme welfare from momentary experiences (e.g., fleeting ecstasy).

  ---

  #### 1. **Is the monster's welfare commensurable with that of others?**  
     (Can welfare comparisons between the monster and others be meaningfully made?)  
     - **No** → Go to 2.  
     - **Yes** → Go to 3.  

  #### 2. **Does your view also reject sacrificing for a "suffering monster" (a being whose suffering reduction outweighs others' losses)?**  
     (Mirror-image case: Extreme suffering reduced more efficiently than others' welfare.)  
     - **Yes** → **Leaf A: Value Pluralism** (e.g., Anderson, Nagel).  
       *Most awkward commitment:* Cannot resolve trade-offs in tragic dilemmas (e.g., saving one life vs. many), risking practical paralysis.  
     - **No** → **Leaf B: Asymmetric Incommensurability** (unnamed).  
       *Most awkward commitment:* Ad hoc distinction between positive/negative welfare with no deeper principle.  

  #### 3. **What theory of well-being underlies welfare comparisons?**  
     (Which account defines "welfare" for aggregation?)  
     - **Hedonistic** (welfare = pleasure/pain) → Go to 4.  
     - **Preference-based** (welfare = desire satisfaction) → Go to 4.  
     - **Objective-list** (welfare = objective goods, e.g., knowledge, relationships) → **Leaf C: Objective List Theory** (e.g., Nussbaum).  
       *Most awkward commitment:* May impose goods (e.g., artistic achievement) on individuals who reject them, violating autonomy.  

  #### 4. **Is the monster's advantage due to its utility function or our measurement scale?**  
     (Does the monster convert resources more efficiently, or is the scale misleading?)  
     - **Utility function** (e.g., it gains 1000x welfare per resource unit) → Go to 5.  
     - **Measuring scale** (e.g., interpersonal comparisons misuse interval/ratio scales) → **Leaf D: Scale Relativism** (e.g., interval-scale prioritarianism).  
       *Most awkward commitment:* Arbitrarily privileges one measurement scale to avoid the monster, appearing question-begging.  

  #### 5. **At what level is welfare aggregated?**  
     (What entities are the units of concern?)  
     - **Whole lives** (total lifetime welfare) → Go to 6.  
     - **Persons** (individuals as discrete units) → *Integrates 👥 Population Monster*: Treats groups as single "persons" with averaged welfare, enabling monster if per-capita gains are extreme.  
       → Go to 6.  
     - **Moments of experience** → *Integrates ⏳ Temporal Monster*: Aggregates momentary states, enabling monsters with brief, intense pleasures.  
       → Go to 6.  

  #### 6. **Is the monster's gain produced by others' sacrifice?**  
     (Does welfare transfer create net loss?)  
     - **No** (positive-sum: monster gains > others lose) → Go to 7.  
     - **Yes** (negative-sum: monster gains < others lose) → *Integrates 💞 Welfare-Dependent Monster*: Gains from others' loss (e.g., Schadenfreude), making transfers inherently inefficient.  
       → **Leaf E: Efficiency Constraint** (e.g., classical utilitarianism in negative-sum cases).  
       *Most awkward commitment:* Fails to resist positive-sum monsters, requiring intolerable inequality when efficient.  

  #### 7. **Does your view resist the monster on non-efficiency grounds?**  
     (Does it reject maximizing even when net welfare increases?)  
     - **No** → **Leaf F: Straightforward Maximizing Consequentialism** (e.g., Singer).  
       *Most awkward commitment:* Demands total sacrifice to the monster, reducing others to bare survival (or worse).  
     - **Yes** → Go to 8.  

  #### 8. **Does your view also resist sacrificing to the suffering monster?**  
     (Mirror-image consistency: Rejecting welfare gain but accepting suffering reduction?)  
     - **Yes** → **Leaf G: Symmetric Non-Aggregationism** (e.g., egalitarianism, prioritarianism).  
       *Most awkward commitment:* May worsen outcomes (e.g., rejecting a cure for extreme suffering to avoid inequality).  
     - **No** → **Leaf H: Asymmetric Non-Aggregationism** (e.g., sufficientarianism, side-constraints).  
       *Most awkward commitment:* Inconsistent treatment of welfare/suffering (e.g., helping few suffering monsters but no utility monsters).  

  #### 9. **Can the scenario arise in practice?**  
     (Is the monster empirically impossible?)  
     - **Yes** (possible) → All leaves from 2–8 apply.  
     - **No** → **Leaf I: Institutional/Indirect Response** (e.g., rule utilitarianism).  
       *Most awkward commitment:* Defers to rules even in clear-cut monster cases, appearing dogmatic.  

  ---

  ### Unnamed Leaves & Unoccupied Combinations  
  - **Unnamed leaves**: B (Asymmetric Incommensurability) and H (Asymmetric Non-Aggregationism).  
  - **Tree cannot separate**:  
    - **Leaf G (Symmetric Non-Aggregationism)** combines prioritarianism and egalitarianism. They share a "resist both monsters" response but differ in justification (priority to worst-off vs. equality).  
    - **Leaf E (Efficiency Constraint)** applies to both hedonistic and preference-based views in negative-sum cases.  
  - **Unoccupied combinations**:  
    - **Objective-list + Negative-sum monster (e.g., 💞)**: *Unexplored* – Objective lists rarely address welfare-dependent monsters.  
    - **Incommensurability + Suffering-monster acceptance**: *Incoherent* – If welfare is incommensurable, accepting suffering reduction requires comparability.  
    - **Measuring scale + Temporal monster (⏳)**: *Unattractive* – Scaling issues with momentary aggregation lack defenders.  

