  We are designing a quiz to sort people into different interpretations of probability without using jargon. The positions we want to cover are:

  1. Actual-frequency frequentism: probability is the relative frequency in the observed or finite class.
  2. Hypothetical/long-run frequentism: probability is the limit of relative frequency in a hypothetical infinite sequence (von Mises).
  3. Single-case propensity: probability is a disposition or propensity of a particular setup to yield an outcome.
  4. Personalist subjectivism with exchangeability (de Finetti): probabilities are degrees of belief (credences) that are coherent and updated by exchangeability; chances are features of a coherent credence function.
  5. Objective Bayesian / logical probability: probabilities are logical relations between evidence and hypothesis, often via maximum entropy or symmetry principles.
  6. Humean best-system chance (Lewis): chances are the chances assigned by the best systematization (balancing simplicity and fit) of the actual history, compatible with determinism.
  7. Deflationary: no chances, only credences plus norms for updating (e.g., by conditionalization on evidence).
  8. Reference-class relativism (unnamed): chance is real but always relative to a chosen reference class, and there is no fact of the matter about which reference class is the right one.

  We have 8 positions. We'll aim for 8-10 questions. Each question is a concrete case with 2-3 answer options.

  We'll use the cases suggested:

  1. A coin that was minted, is biased, but will never be flipped (or flipped exactly once, ever).
  2. A radioactive atom that in fact decayed, and we ask about its probability of decaying before it did.
  3. The probability that a particular raven is black when you already know its DNA.
  4. The probability that a randomly chosen natural number is prime (limiting frequency is zero).
  5. The chance that a candidate would have won an election that was never held.
  6. A reference-class ambiguous case: a 45-year-old smoker's chance of getting lung cancer.

  Additionally, we need:
  - A question probing whether chance and credence can come apart (i.e., if knowing the chance is 0.3 commits you to a credence of 0.3).
  - A question on whether chance requires indeterminism.

