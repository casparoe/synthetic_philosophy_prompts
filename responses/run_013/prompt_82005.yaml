        B. Undefined, because it will never be flipped
        C. 0.5, by default

     2. Consider a specific atom of a radioactive element with a half-life of 1 hour. It decayed at exactly 30 minutes. Just before it decayed, what was the probability that it would decay within 30 minutes?
        A. 0.5
        B. 1, because it happened
        C. Undefined; there is no such thing as probability for a single event that has already occurred, only degrees of belief

     3. A particular raven has been DNA-tested, and the test shows that it has a gene that always causes black feathers in ravens. Moreover, we know that no other factors affect feather color. What is the probability that this raven is black?
        A. 1
        B. Very high, but not 1
        C. Undefined; the outcome is determined, so there is no probability

     4. What is the probability that a randomly chosen natural number is prime?
        A. 0
        B. Undefined
        C. It depends on how we choose the number

     5. An election was scheduled, and polls showed a candidate had a 60% chance of winning. However, the election was canceled. What was the chance that the candidate would have won?
        A. 0.6
        B. Either 0 or 1, but we don't know which
        C. Undefined; there is no chance because the election never happened

     6. A 45-year-old person who smokes. We have data that the frequency of lung cancer among all smokers is 5%, but among 45-year-old smokers it is 10%. What is the chance that this person will get lung cancer?
        A. 10%
        B. 5%
        C. It depends on which reference class we choose, and there is no fact of the matter about which is the right one

     7. If you know that the chance of event E is 0.3, does this mean that you must have a degree of belief (credence) of 0.3 in E occurring?
        A. Yes, always
        B. Not necessarily, because you might have additional information
        C. No, because there is no such thing as chance

     8. Imagine a world that is completely deterministic. In this world, is there such a thing as objective chance?
        A. Yes, because chance can arise from patterns in the deterministic history
        B. No, because in a deterministic world, there is no randomness
        C. Yes, but only as a measure of our ignorance

     **Scoring Key**

     Tally your answers and find the row that matches your pattern. If you have a pattern that isn't listed, it may be a hybrid or a view not covered.

     Pattern (Q1 to Q8) | Interpretation
     ---|---
     B, A, A, A, C, A, B, A | Actual-frequency frequentism
     B, A, A, C, A, A, B, A | Long-run frequentism
     A, A, C, C, A, A, A, B | Single-case propensity
     B, C, C, B, C, C, C, C | Non-realist (personalist subjectivism or deflationary)
     A, A, A, B, A, A, A, C | Objective Bayesian / logical probability
     A, A, A, A, A, A, B, A | Humean best-system chance
     A, A, A, C, A, C, B, A | Reference-class relativism

     Note on non-unique patterns: The quiz might not distinguish between personalist subjectivism and deflationary views, as both deny objective chance. If you have this pattern, you may hold either of these views.

     Note: Some patterns might not appear, such as:
          - All B for Q2: we didn't assign it to any view.
          - The pattern for logical probability has Q4=B and Q8=C, which is unique.

     We hope this helps!

     Finally, we didn't include an option for the raven question that captures the non-realist view setting credence to 1 but denying chance. They choose C in Q3.

     We also have the reference-class relativism in the scoring.

     This should meet the requirements.
