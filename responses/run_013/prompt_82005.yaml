     **Quiz: What Interpretation of Probability Do You Hold?**

     For each question, circle the answer that best reflects your view.

     1. A coin is minted with a physical bias that makes it slightly more likely to land heads than tails. However, it will never be flipped. What is the probability that it would land heads if it were flipped?
