  ### The Short Version
  In the kickoff meeting, first assess the verifier: if reliable, outcome labels are trustworthy; if gameable, decide if fixable within a week (if yes, outcome becomes trustworthy; if no, outcome is untrustworthy). If no verifier exists, outcome is unavailable. For trustworthy outcome, default to outcome-only unless budget and legibility allow considering both—then the team lead decides. For untrustworthy/unavailable outcome, if process budget remains and traces are legible (assessed via a sample trace), use process-only; else, skip training. Budget caps process to two families/quarter. The step-swap test isn't part of kickoff but is required later for any process reward model training. Final decision: outcome-only, process-only, both, or neither.

  ### The Questions, in Order
  1. **What is the verifier type?**  
     - *Sufficient answer:* Classify as:  
       - **Reliable** (e.g., unit tests, type checkers; model can’t cheat).  
       - **Gameable** (e.g., model can delete tests, read fixtures).  
       - **Nonexistent** (no automated checks).  
     - *Decides:* Outcome label trustworthiness.  
       - Reliable → Outcome trustworthy.  
       - Gameable → Proceed to Question 1a.  
       - Nonexistent → Outcome unavailable.  

  2. **If gameable, can we make it reliable within one week?** (Handoff: Team lead decides feasibility.)  
     - *Sufficient answer:* Team lead’s yes/no with brief rationale (e.g., "Yes, sandboxing prevents fixture access").  
     - *Decides:*  
       - Yes → Outcome trustworthy (proceed as reliable).  
       - No → Outcome untrustworthy.  

  3. **Is outcome supervision trustworthy?**  
     - *Sufficient answer:* Yes (reliable or fixed gameable) / No (untrustworthy or nonexistent).  
     - *Decides next path:*  
       - Yes → Proceed to Question 4.  
       - No → Proceed to Question 5.  

  4. **For trustworthy outcome: Can we consider adding process?**  
     - *Sufficient answer:* Check:  
       - Budget available (≤1 process family used this quarter)?  
       - Team lead open to considering both? (Handoff: Team lead gives tentative approval.)  
     - *Decides:*  
       - No to either → **outcome-only**.  
       - Yes to both → Proceed to Question 6.  

  5. **For untrustworthy/unavailable outcome: Is process feasible?**  
     - *Sufficient answer:* Check:  
       - Budget available?  
     - *Decides:*  
       - No budget → **neither**.  
       - Budget available → Proceed to Question 6.  

  6. **Are traces legible?**  
     - *Sufficient answer:* Test with one representative trace:  
       - Show 3–5 steps (mix of simple/complex).  
       - Team consensus: Can labelers (non-experts) judge correctness >80% of steps?  
       - *Example:* Step in a SQL trace: "Add index to column X." Legible if labelers know why indexing matters.  
     - *Decides:*  
       - Legible → Proceed to final decision.  
       - Not legible → **neither**.  

  7. **Final decision routing:**  
     - Trustworthy outcome + legible → Handoff to team lead: **outcome-only** or **both**?  
     - Untrustworthy/unavailable outcome + legible → **process-only**.  

  ### Where It Stops and Hands Off
  - **Handoff 1 (Question 2):** Team lead decides if a gameable verifier can be fixed in a week.  
    - *Who:* Team lead.  
    - *Decides:* Feasibility of verifier fix.  
  - **Handoff 2 (Question 4):** Team lead approves considering "both" when outcome is trustworthy and legible.  
    - *Who:* Team lead.  
    - *Decides:* Whether to add process despite skepticism.  
  - **Handoff 3 (Question 7):** Team lead chooses between outcome-only or both for trustworthy/legible cases.  
    - *Who:* Team lead.  
    - *Decides:* Final call based on cost/value tradeoff.  

  ### Three Runs
  **(a) SQL migration (add index, backfill column)**  
  - Verifier: Runs against staging → **reliable** (outcome trustworthy).  
  - Budget/team lead: Budget available; team lead skeptical → skips "both" consideration.  
  - Legibility: Not assessed (not needed for outcome-only).  
  - **Decision: outcome-only** (matches expectations).  

  **(b) Fix failing tests in a repo**  
  - Verifier: Test suite → **gameable** (model could delete tests).  
  - Fixable? Team lead: "No, tests can be altered; no quick fix" → outcome untrustworthy.  
  - Budget: Available.  
  - Legibility: Traces involve code edits (e.g., "Update function X"). Team consensus: labelers can judge >80% of steps.  
  - **Decision: process-only** (matches expectations).  

  **(c) Rollout plan for service migration**  
  - Verifier: **Nonexistent** (no automated checks; human stakeholder needed).  
  - Budget: Available.  
  - Legibility: Sample trace step: "Shift 20% traffic to Region Y." Team: Labelers (non-experts) lack context for risk assessment → **not legible**.  
  - **Decision: neither** (against what you’d want, but correct per constraints).  

  ### Where This Will Misfire
  1. **Verifier misclassification:** A "reliable" verifier (e.g., a linter) might be gameable in subtle ways (e.g., model adds `// eslint-disable`). This leads to overconfidence in outcome labels, risking reward hacking.  
  2. **Legibility false positives:** Team consensus in meetings may overestimate labeler skill. For example, a data-engineering step like "Backfill via idempotent batch job" seems clear to engineers but confuses labelers. This wastes process-labeling budget.  
  3. **Budget-driven omissions:** If two process slots are used early in the quarter, a critical task (e.g., complex infra debugging) might be skipped despite needing process supervision, due to rigid caps.  
  4. **Step-swap test gap:** Skipping it in kickoff misses 50% of reward model flaws. A process reward model trained on "legible" traces (e.g., rollout plans) might still learn labeler prose biases, validating the team lead’s skepticism too late.  
  5. **Team lead bottlenecks:** Over-reliance on the lead’s judgment (e.g., on verifier fixes) may ignore engineering insights from the alignment team, causing delays. Conversely, if the lead rejects "both" due to uniform skepticism, we miss dual-supervision opportunities for hard tasks (e.g., migrations with 100+ steps).  
  6. **Trace variability:** A "representative" trace may not cover edge cases. For SQL migrations, most steps are legible, but rare ones (e.g., "Handle lock contention") might be misjudged by labelers, poisoning the reward model.  

  **Mitigation notes:**  
  - The procedure optimizes for speed and cost but inherits human judgment errors. Pair kickoffs with retrospective reviews of past decisions to refine criteria.  
  - The step-swap test is critical post-kickoff: if it fails for a process reward model, deprioritize process supervision for similar tasks.
