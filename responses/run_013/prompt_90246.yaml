  You're a philosopher of biology who also actually knows the molecular biology, so please think carefully before you start writing and don't just recite textbook slogans — start by sorting out the different senses of "information" and "code" that get thrown around, and only then take a position. Here's the argument I keep having with my friend Nadia (we're both in a phil of biology reading group, she's the developmental-systems person). I say DNA is a code: it gets transcribed, it gets translated, the whole apparatus is a coding system, that's not just a metaphor. She says the metaphor has gotten out of hand. Her version of the argument goes like this. A genuine code needs an arbitary mapping between the symbols and what they stand for — like Morse, or a cipher, where nothing about the dot-dash pattern forces it to mean S. Then she adds a second claim, which she calls causal parity: in development every cause contributes to the outcome, so singling out the DNA as the place where the information is, is arbitrary; the maternal cytoplasm, the temperature, the membrane, the ribosome are just as much part of the causal story, and if you're going to say the DNA sequence carries information about the protein, you might as well say a thermometer carries information about the temperature. Mere causal correlation, she says, dressed up in informational clothing.

  So what I want from you is a comparison of the two ideas — "DNA as a code carrying information" vs. "DNA as one causal input among many with no special informational status" — and not a bland both-sides summary. Separate the several things people mean by code/information (bare covariation vs. representation that has the function of being read that way vs. an arbitrary symbol-to-meaning mapping) and say which of those the parity argument actually threatens and which it leaves standing. Then give me a verdict: is there a defensible sense in which the DNA sequence is privileged as information, or does parity win? And a sub-question I can't get straight: if the codon-to-amino-acid mapping is arbitrary in the sense of not being chemically forced, but frozen — essentially universal, unchangeable, and on the standard story fixed by accident very early on — does that make it a convention in the relevant sense, or does it actually break the analogy with real codes and languages, which can be renegotiated? Use a few concrete molecular details (tRNAs as adaptors, the ribosome, the near-universality of the code plus the handful of variant codes) but keep the philosophy front and center. Also deal with the objection that the parity thesis proves too much, since it would equally forbid us from saying that a wiring diagram specifies the machine's behavior or that a recipe specifies a cake. Aim at around 900 words, and give me the strongest version of the other side before you land anywhere.
