answer: |-
  ## Provenance Labs: Frequently Asked Questions

  **1. How does tracing the evolutionary origin of my moral conviction debunk it? Doesn’t finding a cause just explain where it came from, not prove it false?**
  Our service demonstrates that your conviction arises from adaptive pressures shaping human psychology for survival and reproduction, not from the detection of objective moral truths. Research indicates these evolved mechanisms produce reliable beliefs about practical, fitness-enhancing behaviors (like kin preference or reciprocity) but not necessarily about abstract moral "truths." When we show your specific conviction (e.g., "lying is inherently wrong") is a byproduct of mechanisms selected for social cohesion rather than truth-tracking, it reveals the conviction is not justified by the reasons you likely assume (e.g., apprehending moral facts), thereby undermining its epistemic warrant. It explains *why* you hold it in a way that severs the link to objective justification.

  **2. Which kinds of convictions can you debunk? Are there any you won't analyze?**
  We specialize in debunking core moral and evaluative convictions – beliefs about inherent right/wrong, good/bad, justice, fairness, or special obligations that feel deeply intuitive and non-negotiable. We do *not* debunk convictions grounded solely in explicit religious doctrine (e.g., specific ritual requirements derived from scripture), purely aesthetic preferences (e.g., finding a sunset beautiful), or strictly legal/policy positions based on contemporary social contracts. The line is drawn based on the conviction's dependence on evolved, intuitive moral psychology versus explicit, culturally transmitted systems or subjective sensory responses. We target the deep, felt sense of "moral truth" arising from our biological heritage.

  **3. Couldn't the same process debunk things like math, logic, or memory? Why don't you offer reports on those?**
  Excellent question. While mathematical intuition, logical inference, and memory recall also have evolutionary origins, the selective pressures plausibly shaped them to reliably track mind-independent truths essential for survival (e.g., accurately counting objects, avoiding contradictions, recalling predator locations). Research suggests these cognitive faculties connect us to an objective external reality in a way our moral sense, shaped primarily for social coordination and motivation, does not. Therefore, while the *faculties* evolved, the *truths* they access (like 2+2=4 or modus ponens) are independent of that origin. Moral "truths," in contrast, are argued to be adaptive fictions. We focus on the domain where genealogy severs justification.

  **4. After receiving my report, can I still hold onto my debunked belief? If not, what should I do with the feeling and the associated actions?**
  While you *can* continue holding the belief, Provenance Labs reports demonstrate that maintaining it as an objectively justified truth is rationally inconsistent. We advise recognizing it as a deeply ingrained psychological adaptation, not a reflection of moral reality. Regarding the feeling: acknowledge it as a powerful evolutionary echo, but cognitively label it as non-truth-tracking. Regarding practice: you may choose to continue the associated behavior (e.g., honesty) for pragmatic, social, or personal reasons – because it fosters trust, avoids punishment, or simply feels congruent with your psychology – not because it is "morally obligatory" in an objective sense. Separate the useful behavior from the debunked justification.

  **5. Do you offer a service to "re-instate" a debunked belief?**
  Yes, we offer our "ReFoundations" package. This does not restore the belief to its original, objectively justified status – our report conclusively undermines that. Instead, ReFoundations helps you construct a new, consciously chosen justificatory framework *around* the behavior. Our consultants work with you to ground the behavior in rigorously defined personal values, sophisticated social contract theory, preference utilitarianism, or other non-realist ethical systems. This package provides intellectual tools and cognitive reframing techniques to support the desired conduct based on chosen principles, not illusory moral facts. (Additional fees apply.)

  **6. How am I supposed to act after my conviction is debunked? If the belief isn't true, but acting against it feels terrible, what's the practical guidance?**
  Provenance Labs reports address the *justification* of belief, not necessarily the *utility* of behavior. We provide a genealogical explanation, not a prescriptive ethical system. Pragmatically, we recognize that evolved moral intuitions remain powerful motivators. Our standard advice is threefold: 1) **Acknowledge the Illusion:** Understand your feeling of objective wrongness as a psychological product. 2) **Assess Consequences:** Decide whether acting according to the old intuition leads to desirable or undesirable outcomes (for yourself and society) based on your other values and goals. 3) **Act Pragmatically:** Choose your action based on the likely consequences and your chosen framework (like one developed via ReFoundations), tolerating the residual intuitive discomfort as you would an optical illusion you know to be false. You act, informed but not bound by the debunked intuition.

  **7. How can I be sure Provenance Labs' own evolutionary genealogy of my belief is accurate? Couldn't this report itself be just another evolutionary byproduct?**
  This is a thoughtful consideration. The methods and reasoning used by Provenance Labs scientists are, naturally, products of evolved human cognition. However, the cognitive faculties involved in scientific reasoning – logical inference, empirical observation, hypothesis testing – are precisely those shaped by selective pressures to reliably track aspects of objective reality, as discussed in Question 3. While the *motivation* to seek such explanations (including debunking) may have evolutionary roots in curiosity or status-seeking, the *validity* of the scientific process itself relies on truth-tracking capacities we have strong reasons to trust. Therefore, our genealogical reports, generated through these reliable methods, accurately identify the adaptive origins of moral convictions, providing a warranted explanation distinct from the debunked moral beliefs themselves. You can trust the report because it stems from cognition designed for truth, unlike the moral intuitions it analyzes.
