   - We have 18 participants (plus the facilitator, but the facilitator is not part of the experiment). 
   - The facilitator flips a coin (or has a participant flip it) to determine two possible worlds:
        Heads (H): Only one person (chosen at random) gets a card that says "You are in the chamber."
        Tails (T): All participants (18) get the same card.

   - The cards are sealed in envelopes so that no one can see whether others have a card or not. 
   - The card says the same thing in both cases: "You are in the chamber." 
