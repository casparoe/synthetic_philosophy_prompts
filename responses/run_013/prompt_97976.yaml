      Then we extrapolate: suppose we did 20 trials. In each trial, if you are an envelope holder, you are asked to state your credence (which is your maximum price). We then simulate 20 trials and compute the balance.

      How to simulate:

          We assume that in each trial:
              P(Tails) = 0.5
              If Tails: 18 envelope holders, each with their stated credence (we assume they all state 18/19? because they are symmetric) — but they might state different things.

          But in the first trial, we have one group. They might have different stated credences? We can assume they all use 18/19.

          Then, for a given trial:
              If Tails (probability 0.5): 
                  18 people each pay p (say 18/19) and get $1, so net: 1 - 18/19 = 1/19 per person.
              If Heads (probability 0.5):
                  Only one person (the envelope holder) pays p (18/19) and gets $0, so net: -18/19.
                  The other 17 pay nothing and get nothing.

          Then the expected net per trial for a given envelope holder in Tails: (1/19) [they only play in Tails and when they are envelope holders]? But note: they are only an envelope holder in Tails with probability 1 (if Tails) and in Heads with probability 1/18.

          We need to compute the expected net for a fixed participant over 20 trials.

          For a fixed participant, in one trial:
              P(Tails) = 0.5: then they are an envelope holder and they buy at price p, and get $1 -> net: 1 - p.
              P(Heads) = 0.5: then they are an envelope holder with probability 1/18, and then they buy at p and get $0 -> net: -p.
                           and they are not an envelope holder with probability 17/18 -> net: 0.

          So the expected net per trial for a fixed participant:
              = 0.5 * (1-p) + 0.5 * [ (1/18)*(-p) + (17/18)*0 ]
              = 0.5*(1-p) - 0.5*(p/18)
              = 0.5 - 0.5p - 0.5p/18
              = 0.5 - 0.5p (1 + 1/18)
              = 0.5 - 0.5p * (19/18)

          If they set p = 18/19, then:
              = 0.5 - 0.5*(18/19)*(19/18)
              = 0.5 - 0.5*1 = 0.

          So they break even in expectation.

          But what if they set p=0.5? Then:
              = 0.5 - 0.5*(0.5)*(19/18) = 0.5 - 0.5*(19/36) = 0.5*(1 - 19/36) = 0.5*(17/36) = 17/72 >0.

          So if they set p=0.5, they have positive expected value? 

          But wait, is that right? Let me check:

              In Tails: they get 1 - 0.5 = 0.5.
              In Heads: if they are the chosen one (prob 1/18), they lose 0.5; otherwise 0.
              So expected net: 
                  P(Tails)*0.5 + P(Heads)*[ (1/18)*(-0.5) + (17/18)*0 ] 
                  = 0.5*0.5 + 0.5*(-0.5/18)
                  = 0.25 - 0.25/18 = 0.25*(1 - 1/18) = 0.25 * 17/18 = 17/72 ≈ 0.236.

          But if they set p=18/19, they break even? 

          Actually, if they set p = their true credence (18/19), then the bet is fair? 

          However, the alternative reasoning (p=0.5) would lead to them making money? 

          But in reality, the true probability of Tails given they are an envelope holder is 18/19, so they should be willing to pay up to 18/19. Then the bet is fair. If they pay less, they make money, but that's because they are underpaying for a bet that is worth 18/19.

          The point: if they set p=18/19, they break even. If they set p=0.5, they make money because they are getting a good deal. But in the long run, if there are many envelope holders, the ones who set p=0.5 will make money? But wait, they are not always envelope holders.

          We see that the expected value when they set p=0.5 is positive, but that is because they are not always buying. They only buy when they are an envelope holder, and then they are getting a bet that is in their favor (because the true probability of Tails is 18/19, so the expected value of the bet is 1 * (18/19) - p, and if p=0.5, that's positive).

          So the lesson: if they use 0.5, they will make money in the long run, and if they use 18/19, they break even. But wait, the 18/19 is the correct credence? Then they should use that.

          However, the alternative view is that the credence should be 0.5. And if they use 0.5, they make money. That seems to show that 0.5 is too low.

          So this betting setup actually shows that 18/19 is the correct credence for betting purposes.

          But the presumptuous philosopher in the grand universe says 0.5. And in the betting game, if they use 0.5, they make money? So that seems to support the 18/19 view.

          This is the opposite of what we want. We want to show that the 18/19 view is the one that gets cleaned out? 

          Let me double-check the betting for the grand universe view.

          The grand universe view says: P(Tails | I am an observer) = P(Tails) = 0.5? But wait, in the grand universe view, they might say:

              In Tails: there are 100 observers (in the second round) and in Heads: 1 observer. So if I am an observer, then the probability that the world is Tails is 100/101. So they would set p=100/101 for the second round.

          Then in the betting game for the second round, if they set p=100/101, and we do the room-based accounting, they would lose money? 

          Let's compute for the second round setup (Tails has 100 observers, Heads has 1) but we are in the room of 18:

              For a fixed participant in the room:

                  P(Tails | they are an envelope holder) = ? 
                      We have: 
                          P(envelope holder | Tails) = 1   (because in Tails, they are one of the 100, and they are in the room? but wait, we are conditioning on being in the room. How did they get in the room? We need to specify.)

              We told them: in Tails, there are 100 people, and we have 18 in the room. We did not say how the 18 are selected. We must say: the 18 in the room are a random sample of the 100? 

              Then:

                  P(envelope holder | Tails) = 1   (because if Tails, everyone in the room gets an envelope) 
                  P(envelope holder | Heads) = 1/18   (because if Heads, one random in the room gets it)

              So by Bayes, it's 18/19.

              But the grand universe view says 100/101.

              Now, in the betting game for one trial:

                  They are an envelope holder. They bet at their stated p.

                  The true probability of Tails given they are an envelope holder in the room is 18/19.

                  So if they set p=100/101, they are overpaying: they pay 100/101 for a bet that is worth 18/19 ≈ 0.947, while 100/101≈0.990. So they will lose money on average.

              Specifically, for one trial where they are an envelope holder:

                  Expected net = (18/19) * (1 - 100/101) + (1/19) * (0 - 100/101)
                              = (18/19) * (1/101) - (1/19)*(100/101)
                              = (18/(19*101)) - (100/(19*101)) = -82/(19*101) <0.

              So they lose money.

              If they set p=18/19, they break even.

          Therefore, in the betting game, the grand universe view (100/101) loses money, while the room view (18/19) breaks even.

          This suggests that the room view is pragmatically correct.

          But wait, what if we consider the grand universe view includes the 82? They are not in the room, but they are also betting? 

          We are only in charge of the room. The 82 are not present, so they don't bet. So in the Tails world, there are 100 envelope holders, but only 18 are in the room and betting. The other 82 are not betting. So the grand universe view is not implemented in the betting game because the other 82 are not playing.

          Therefore, the only envelope holders who are betting are those in the room. And for them, the probability is 18/19.

          So the betting game supports the room-based reference class.

          However, the presumptuous philosopher is not about the room. It's about the entire universe. And in the entire universe, the 82 are there. But they are not in the room. So if we are to take the perspective of an arbitrary observer in the universe, then we might be one of the 82 who are not in the room. But in the problem, we are in the room. So we condition on that.

          This is getting very complex.

          Given time, we will focus on the activity as described and let the debrief discuss these issues.

   4. Timeline:

      Total: 75 minutes.

      - Introduction and setup: 5 minutes.
      - Round 1 (18 participants):
          - Flip coin (have a participant flip and another verify) -> 2 minutes.
          - Distribute envelopes: 3 minutes.
          - Ask them to open privately and write down their credence for Tails (only if they have an envelope, but have everyone write: if no envelope, they can write 0) -> 2 minutes.
          - Collect the answers (anonymously?) -> 2 minutes.
          - Reveal the coin and discuss briefly what happened -> 2 minutes. (Total 11 minutes)

      - Round 2 (Tails=100):
          - Explain the new setup: 2 minutes.
          - Ask them to write down their credence if they were to hold an envelope in this new setup -> 2 minutes.
          - Collect and show the range (without revealing the coin) -> 2 minutes.
          - Round 3 (Tails=1000): same -> 2 minutes. (Total 8 minutes)

      - Betting game:
          - Explain the betting: 3 minutes.
          - For the first trial (the one they just did), ask each participant to state the maximum they would pay for a $1 bet on Tails. Have them write it down -> 2 minutes.
          - Reveal the outcome of the trial and for each participant, compute what their net would have been -> 3 minutes.
          - Then describe what would happen over 20 trials (using the room-based probabilities) -> 5 minutes. (Total 13 minutes)

      - Debrief: 38 minutes.

          The debrief should cover:
          - What answers did we see in Round 1? (Likely most envelope holders said 18/19, non-holders said 0.)
          - In Round 2 and 3, we saw two types of answers: 18/19 and 100/101 (or 1000/1001). 
          - The betting game: in the room-based approach, setting p=18/19 breaks even, while setting p=0.5 makes money (but only if they are offered the bet at 0.5, which they aren't in the market). And setting p=100/101 loses money.
          - Then discuss the philosophical point: 
              - The gap between the two ways of sampling.
              - The reference class problem.
              - Why the room might be the right reference class (because we are conditioning on being in the room).
              - How this relates to the presumptuous philosopher: if we condition only on existing (and not on other indexical information), we get the grand universe view. But in practice, we have more information (we are in a room with 17 others, etc.).
          - Open floor for fight about whether the observers are created by the setup or pre-exist.

   5. What can go wrong:

      - Coin flip rigging: have a participant flip and another verify.
      - Non-envelope holders in Heads might feel left out: explain that in the Heads world, only one is chosen, and their role is to be the non-holders. In the Tails world, they are holders.
      - Someone refuses to give a number: allow them to pass, but encourage them to write something.
      - Non-card-holders scroll on phones: engage them by having them write down their credence (which is 0) and participate in the betting.
      - Time: we might run over. Be ready to cut the betting simulation short.

   6. Materials:

      - Coin
      - 18 index cards for Round 1 (and extras for Round 2 and 3? not needed physically)
      - Envelopes: 18 for Round 1 (in Tails) and 1 for Round 1 (in Heads? but we use the same set: in Tails, we need 18; in Heads, we need 1. So have 18 envelopes ready, but in Heads, only use one and put the card in it, and for the others, either leave them empty or not distribute. We'll distribute only to the chosen one in Heads and to everyone in Tails. So we need at least 18 envelopes, but in Heads, we only use one.

      - Poker chips: for the betting, but one trial. We can use fake money on paper.

      - A bag for drawing names.

      - Paper and pens for participants to write credences and betting prices.

      - A whiteboard or large paper to record results.

   7. What the activity cannot do:

      - It doesn't handle infinite worlds.
      - It doesn't settle the reference class problem: we see two answers and the betting supports one, but the presumptuous philosopher might still argue for the other.
      - It doesn't show that self-sampling is correct; it only shows the two approaches differ.

   8. Room for debate:

      - In the debrief, explicitly ask: "In this setup, are you an observer that was created by the experiment, or were you an existing observer who was selected? Does it matter?"

   Implementation:

      We'll go with the distribution method where in Heads, only one envelope is distributed (to one person), and in Tails, 18 are distributed (one to each). The envelope contains a card that says "You are in the chamber." 

      For the second and third rounds, we do thought experiments with Tails having 100 and then 1000 people, but we only have 18 in the room. In Tails, we give an envelope to each of the 18 and imagine the rest. In Heads, we give an envelope to one of the 18.

      We ask the participants to write their credence conditional on holding an envelope.

      We embrace that the two methods will give different numbers.

      In the betting, we will see that the room-based reference class (18/19) breaks even, while the grand universe class (100/101) loses money.

      This will be the basis for discussion.

   Let's write the detailed minute-by-minute:

      Minute 0-5: Introduction. Explain that we will do an experiment with a coin flip and envelope distribution. They will receive an envelope in some cases. They must not reveal the contents. We will ask them to write down their confidence level in a hypothesis.

      Minute 5-7: Coin flip. Choose a participant to flip and another to verify. Then, without revealing, the facilitator takes the result.

      Minute 7-10: Distribution. 
          If Tails: hand one envelope to each participant.
          If Heads: draw a name from a hat and hand an envelope to that person only.

      Minute 10-12: Instruction: "Open your envelope if you have one. If you have a card inside that says 'You are in the chamber', then you are an envelope holder. If you do not have an envelope, or if you have an envelope but it is empty or has a different message, then... wait, in our case, the envelope either has the card or not. In our distribution, if you have an envelope, it has the card. If you don't have an envelope, you don't have the card. So if you have an envelope, you see the card. If not, you don't have one.

          So instruction: "If you received an envelope, open it and read the card. Then put it back in the envelope and keep it private. If you did not receive an envelope, you know you are not in the chamber. Now, everyone: if you are holding an envelope, what is your credence (between 0 and 1) that the coin landed Tails? If you are not holding an envelope, what is your credence that the coin landed Tails? (They should have a number: non-holders know it's Heads, so 0.) Write it down on a piece of paper."

      Minute 12-14: Collect the answers. Have them write on a piece of paper and hand it in.

      Minute 14-16: Reveal the coin and share the result. Also, if Tails, they should all have envelopes; if Heads, only one has an envelope. Then, share the distribution of answers. In Tails, we expect 18 answers around 18/19? In Heads, we expect 17 zeros and one answer around 18/19.

      Minute 16-18: Introduce Round 2: "Now, we change the setup. In Heads, we still have only one envelope holder in the room (chosen at random from the 18). In Tails, there are 100 people in total who are in the chamber and receive an envelope. But we are only 18 in this room. In Tails, we will still give each of you an envelope, and we imagine there are 82 more people elsewhere with envelopes. In Heads, we give an envelope to only one of you at random. Now, condition on you holding an envelope: what is your credence that the coin was Tails? Write it down."

      Minute 18-20: Collect and note the range of answers (without revealing the coin for this hypothetical).

      Minute 20-22: Round 3: Tails has 1000 people. Same question.

      Minute 22-25: Betting game explanation: "We return to the first setup (18 people). We will now run a betting market. We will run 20 trials. In each trial, I will flip a coin and distribute envelopes exactly as in Round 1. For each trial, I will offer to sell you a chip that pays $1 if the coin is Tails. You can choose the maximum price you are willing to pay for this chip. If you are not an envelope holder in that trial, you are not offered the chip (or you can choose to not buy). If you are an envelope holder, you can state your maximum price. We will then simulate that you buy the chip at your stated price and then we will resolve the coin."

          We will not do 20 physical trials. Instead, we will use the first trial's data and then simulate 19 more.

          For the first trial (which we already did), they have already written their betting price? We will use that.

          For the next 19, we will assume that they use the same reasoning and state the same price as in the first trial.

          And we will generate the 19 trials by flipping a coin 19 times and for each, if Heads, we randomly pick one person to be the envelope holder.

          We then compute the balance for each participant.

      Minute 25-30: Have them write down, for the betting game, what maximum price they would use in general for any trial (or we can use the number they wrote in the first trial). Collect these prices. 

      Minute 30-40: Simulate 19 more trials. We do this quickly: 
          - We have a list of participants.
          - We randomly generate 19 coin flips (half should be Tails, half Heads? but randomly).
          - For each trial, if Tails: all 18 are offered the bet at their price? But wait, in Tails, all 18 are envelope holders, so they are offered. In Heads, only one is offered.
          - For each participant in a trial where they are offered, they pay their price and then get $1 if Tails.

          We then compute their net over 20 trials.

          We can do this on a spreadsheet and project.

      Minute 40-75: Debrief.

          - Show the results of the betting: who made money, who lost?
          - Discuss: 
              - In Round 1, why did most envelope holders say 18/19?
              - In Round 2 and 3, why did some say 100/101 and others 18/19?
              - In the betting, did the 18/19 people break even? Did the 0.5 people make money? Did the 100/101 people lose money?
              - What does this say about the correct reference class?
              - How does this relate to the presumptuous philosopher?

          - Open the floor for discussion on: 
              - Are you a random observer in the room or in the universe?
              - Does the setup create the observers or select them?

   Given the complexity, we might adjust on the fly.

   Let's hope it works!
answer: |-
  Below is a comprehensive plan for your 75-minute session, designed to create a visceral experience of the observer self-sampling problem. It includes setup instructions, a step-by-step timeline, materials list, troubleshooting predictions, limitations, and a structured debrief. The goal is to make the tension between "I am a random actual observer" (room-centric) and "I am a random possible observer" (multiverse-centric) felt through hands-on activity and reflection.

  ---

  ### **Session Overview**
  **Objective:** Illustrate the divergence between two framings of self-sampling:  
  - **Room-centric:** Treat yourself as a random draw from *actual observers in your world*.  
  - **Multiverse-centric:** Treat yourself as a random draw from *all possible observers across possible worlds*.  

  **Core Tension:** The multiverse-centric view leads to "presumptuousness" (existing = evidence for a larger world), while the room-centric view resists it.  

  **Structure:**  
  1. **Round 1 (Baseline):** 18 observers (tails = all get cards; heads = 1 gets card).  
  2. **Round 2 (Scaled-Up):** Tails world = 100 observers (heads still = 1 in the room).  
  3. **Betting Simulation:** Participants "bet" on tails; outcomes reveal pragmatic consequences.  
  4. **Debrief:** Discuss the gap, betting results, and philosophical implications.  

  ---

  ### **Materials**
  - **Coin:** For flips (use a large, visible coin).  
  - **Envelopes:** 100+ sealed envelopes, each containing a card: "You are in the chamber."  
  - **Index Cards:** For participants to write credences/betting prices.  
  - **Poker Chips:** 100+ (red = $1 payout if tails; blue = "currency" for buying bets).  
  - **Random Selection Bag:** Contains 18 slips with participant numbers (1–18).  
  - **Pens, Whiteboard, Timer.**  
  - **Participant List:** Assign each person a number (1–18) for anonymity.  

  ---

  ### **Step-by-Step Timeline**  
  **Total: 75 minutes**  

  #### **1. Setup & Rules (5 min)**  
  - **Min 0–3:** Distribute numbered index cards (1–18) to participants. No theory intro. Briefly state:  
    > *"We’ll flip a coin. Depending on the result, some may receive information. Your task: Write private, honest responses to prompts. Do not share or look at others’ cards."*  
  - **Min 3–5:** Explain the rules for **Round 1**:  
    > - *Heads: I draw 1 number from the bag; only that person gets an envelope.*  
    > - *Tails: Everyone gets an envelope.*  
    > - *Envelopes contain identical cards. Do not open until instructed.*  

  #### **2. Round 1: Baseline (18 observers) (15 min)**  
  - **Min 5–7:** Flip the coin (have a participant flip and another verify).  
  - **Min 7–9:** Distribute envelopes per the result (secretly).  
  - **Min 9–11:** Instruct everyone to open envelopes. Ask:  
    > *"If you hold a card, what is your credence (0–100%) that the coin was tails? Write it on your index card."*  
    *(Non-card holders skip but stay engaged.)*  
  - **Min 11–15:** Collect cards. **Do not reveal results yet.** Briefly note trends (e.g., "Most card holders wrote ~95%").  

  #### **3. Round 2: Scaled-Up Tails (100 observers) (10 min)**  
  - **Min 15–17:** Explain new rules:  
    > *"Same as before, but IF TAILS: There are 100 observers (not just 18). We’ll still give cards to all 18 of you, but 82 others (not here) also get cards. Heads: Still 1 card in this room."*  
  - **Min 17–19:** Re-flip coin (new participant flips/verifies). Distribute envelopes per result.  
  - **Min 19–22:** Ask card holders:  
    > *"Credence now that it’s tails? Remember: Tails means 100 card holders exist; heads means 1."*  
  - **Min 22–25:** Collect cards. Note shifts (e.g., "Many of you jumped to ~99%" vs. "Some stuck near 95%").  

  #### **4. Betting Simulation (20 min)**  
  - **Min 25–27:** Introduce bets:  
    > *"I’ll sell chips costing $X. If tails, they pay $1. State the MAX you’d pay for a chip (e.g., if your credence for tails is 95%, you might pay $0.95)."*  
  - **Min 27–30:** For **Round 1 data only**, have card holders write betting prices (non-holders = $0).  
  - **Min 30–35:** Simulate 20 rounds:  
    - Flip coin 20 times (pre-flip batches to save time).  
    - For each flip, draw numbers (if heads) and record "payouts":  
      - *Tails: Card holders gain $(1 - price paid).*  
      - *Heads: Card holders lose $(price paid); non-holders gain/lose $0.*  
  - **Min 35–45:** Project cumulative results (e.g., spreadsheets). Highlight who profited/lost.  

  #### **5. Debrief (30 min)**  
  **Structure:**  
  - **Min 45–50:** Show credence distributions (Rounds 1 & 2). Ask:  
    > *"Why did most of you shift toward 99% in Round 2? Why did some resist?"*  
    *(Draw out: "I probably wouldn’t exist in a small world" vs. "I’m only sampling this room.")*  
  - **Min 50–55:** Discuss betting results:  
    > *"The 95% crowd broke even. The 50% crowd made money. The 99% crowd lost money. What does this imply? Does it prove who was ‘wrong’?"*  
    *(Key: Betting works for room-centric credences; multiverse-centric credences misprice bets.)*  
  - **Min 55–65:** Philosophical fight club:  
    > - **"Created vs. Selected Observers":** *"Are you a person created by this experiment, or a pre-existing person sorted into a room? Does it matter?"*  
    > - **Presumptuousness:** *"If you treat yourself as a random possible observer, existing feels like evidence for a bigger world. Is that rational? Or does it ignore your actual context?"*  
    > - **Reference Class:** *"Should your reference class be the room, humans, or all possible minds?"*  
  - **Min 65–75:** Open discussion:  
    > *"What’s the gap between ‘I exist’ as a lottery ticket vs. a guaranteed fact? How does this apply to real-world anthropic reasoning (e.g., Doomsday Argument)?"*  
    *(Avoid jargon like "self-sampling" until now. Introduce terms: "SSA vs. SIA", "presumptuous philosopher".)*  

  ---

  ### **What Will Go Wrong (and Fixes)**  
  1. **Skepticism:** "You rigged the coin!"  
     - **Fix:** Have participants flip/verify. Use a transparent bag for draws.  
  2. **Non-Card Holders Tune Out:**  
     - **Fix:** Assign tasks (e.g., "You’re data recorders"). In betting, they "bet" on certainty.  
  3. **Refusal to Quantify Credences:**  
     - **Fix:** Allow ranges (e.g., "80–90%") or let them pass (but track participation).  
  4. **Betting Confusion:**  
     - **Fix:** Use poker chips for tangible stakes. Pre-calculate examples.  
  5. **Time Crunch:**  
     - **Fix:** Pre-flip 10 coin batches; use spreadsheets for betting math. Cut discussion if needed.  

  ---

  ### **What the Activity Can’t Do**  
  1. **Infinite Worlds:** Finiteness is assumed. No way to simulate unbounded populations.  
  2. **Reference Class Resolution:** Highlights the problem but won’t solve it (room vs. universe remains contentious).  
  3. **Proving Self-Sampling Correct:** Only shows divergence between framings. You must argue:  
     - *Room-centric* aligns with betting rationality.  
     - *Multiverse-centric* ignores indexical information (you’re in *this room*).  
  4. **Observer Ontology:** Doesn’t settle "created vs. selected" but forces participants to confront it.  

  ---

  ### **Key Outputs to Stress in Debrief**  
  - **Round 1:** Most card holders give ~95% (1/2 ÷ (1/2 + 1/2×1/18) = 18/19).  
  - **Round 2:** Multiverse-centric: 100/101; room-centric: still ~95%.  
  - **Betting:** Room-centric (95%) breaks even; multiverse-centric (99%) loses money; 50% profits but is "wrong."  
  - **Takeaway:** Treating yourself as a random *actual* observer (room) avoids presumptuousness and aligns with bets. Treating yourself as a random *possible* observer (multiverse) inflates credence in large worlds.  

  This plan creates experiential friction: Participants *feel* the absurdity of being "certain the world is big" in Round 2, while betting exposes the risk. The debrief legitimizes both intuitions, then lets the room fight it out.
