  ### St. Petersburg Paradox Activity Plan  
  **Total Time:** 90 minutes  
  **Participants:** 20 undergraduates  
  **Materials:**  
  - Worksheets for calculation stage (1 per group)  
  - Coin for flipping (fair, visible to all)  
  - Whiteboard or projector to record bids/payoffs  
  - Tokens (e.g., poker chips; 100 per student, no cash value)  
  - Bid sheets (paper slips for sealed bids)  
  - Prize tickets (2 physical tickets: "Lottery A" and "Lottery B")  

  **Key Structure:**  
  - **Lottery A (Standard):** Payoff = \(2^n\) tokens if first tail on toss \(n\).  
  - **Lottery B (Heavier Tail):** Payoff = \(2^{2^n}\) tokens if first tail on toss \(n\).  
  *Both have divergent expected value, but B grows astronomically faster.*  

  ---

  ### **Minute-by-Minute Timeline**  
  #### **Stage 1: Calculation (25 mins)**  
  **0–5 mins**: Introduction  
  - Divide into 5 groups of 4. Distribute worksheets.  
  - *Facilitator script:*  
    > *"Each group will analyze two lotteries. Each involves flipping a fair coin until the first tail. For Lottery A, if the first tail is on toss \(n\), you win \(2^n\) tokens. For Lottery B, you win \(2^{2^n}\) tokens. Calculate the expected value (mean outcome) of each lottery."*  
    > *"Do not overthink—follow the formula: \(\text{Expected Value} = \sum (\text{Probability of outcome} \times \text{Payoff})\)."*  

  **5–20 mins**: Group Work  
  - Worksheets prompt:  
    > **Lottery A**:  
    > - Probability of \(n=1\): \(P(\text{T}) = \frac{1}{2}\), Payoff = \(2^1 = 2\) → Contribution: \(\frac{1}{2} \times 2 = 1\)  
    > - \(n=2\): \(P(\text{HT}) = \frac{1}{4}\), Payoff = 4 → Contribution: \(1\)  
    > - \(n=3\): \(P(\text{HHT}) = \frac{1}{8}\), Payoff = 8 → Contribution: \(1\)  
    > - ... Expected Value = \(1 + 1 + 1 + \cdots = ?\)  
    >  
    > **Lottery B**:  
    > - \(n=1\): \(\frac{1}{2} \times 2^{2^1} = \frac{1}{2} \times 4 = 2\)  
    > - \(n=2\): \(\frac{1}{4} \times 2^{4} = \frac{1}{4} \times 16 = 4\)  
    > - \(n=3\): \(\frac{1}{8} \times 2^{8} = \frac{1}{8} \times 256 = 32\)  
    > - ... Expected Value = ?  

  **20–25 mins**: Group Reports  
  - Groups share conclusions. *Facilitator subtly confirms:*  
    > *"So Lottery A’s expected value is a sum of infinitely many 1s? And Lottery B’s terms grow even faster? What does that imply?"*  
  - **Do not resolve infinity yet**—move to preferences.  

  #### **Stage 2: Market & Resale (40 mins)**  
  **25–30 mins**: Setup  
  - Distribute 100 tokens to each student.  
  - *Facilitator script:*  
    > *"You will bid tokens for a ticket to play one lottery. There are two tickets: one for A, one for B. You may bid on both, but you can win at most one. Highest bid wins. If you win, you pay your bid and receive the ticket."*  
    > *"After the first auction, winners can resell their ticket in a second sealed-bid auction. Anyone (including the winner) may bid to buy it."*  

  **30–35 mins**: First Auction (Sealed Bid)  
  - Students submit two private bids (A and B) on paper slips.  
  - Collect bids, announce winners:  
    > *"Lottery A winner: [Name] with [X] tokens. Lottery B winner: [Name] with [Y] tokens."*  
  - Winners pay tokens to facilitator.  

  **35–45 mins**: Resale Auction (Sealed Bid)  
  - *Facilitator script:*  
    > *"Winners, you may now resell your ticket. All students—including winners—submit one bid per ticket. Highest bid buys the ticket; the seller receives the tokens."*  
  - Hold two sequential resales (A then B). Record prices.  

  #### **Stage 3: Play (10 mins)**  
  **45–55 mins**: Resolve Lotteries  
  - Publicly flip coin for Lottery A (winner plays):  
    - Flip until first tail (max 10 flips; probability of >10 is 1/1024 ≈ 0.1%, negligible).  
    - Record \(n\), pay \(2^n\) tokens to ticket holder.  
  - Repeat for Lottery B (pay \(2^{2^n}\) tokens).  
  - *Example:*  
    - T on 1st toss: A pays 2, B pays 4.  
    - T on 3rd toss: A pays 8, B pays 256.  

  **55–65 mins**: Token Reconciliation  
  - Students calculate final token totals (initial ± bids ± payoffs).  

  ---

  ### **Debrief (25 mins)**  
  **Focus:** Contrast mathematical facts, decision theory, and psychological responses.  

  #### **65–70 mins**: Elicit Observations  
  - *Questions:*  
    > 1. *"What were winning bids for A and B? Were they close to infinite?"*  
    > 2. *"Did resale prices match initial bids? If not, why?"*  
    > 3. *"Who preferred Lottery A? B? Why?"*  
  - *Board notes:*  
    | Lottery | Avg. Bid | Resale Price | EV (Math) |  
    |---------|----------|--------------|-----------|  
    | A       | [e.g., 15] | [e.g., 12]  | ∞         |  
    | B       | [e.g., 20] | [e.g., 18]  | ∞         |  

  #### **70–80 mins**: Introduce Concepts  
  - **Reveal the paradox:**  
    > *"Both lotteries have infinite expected value (EV), yet bids were finite and preferences differed. This is the St. Petersburg Paradox."*  
  - **Expected Utility (EU) vs. EV:**  
    > *"EV maximization says both lotteries are equally valuable (∞). But you treated them differently. Why? Because you don’t value tokens linearly."*  
    > *"EU theory: Rational agents maximize \(\sum P_i \times U(\text{payoff}_i)\), not \(\sum P_i \times \text{payoff}_i\). Utility \(U\) is bounded (e.g., \(U(x) = \log x)\)."*  
    - *Example:* For Lottery B, \(U(2^{2^n})\) grows slowly if \(U\) is concave (e.g., log), making EU finite.  
  - **Tail Behavior:**  
    > *"Lottery B has ‘fatter tails’—tiny chance of astronomical payoffs. But if \(U\) is bounded, those payoffs add little to EU."*  

  #### **80–85 mins**: Implications for Rationality  
  - *Discussion questions:*  
    > *"Does rational choice require maximizing EV? Why or why not?"*  
    > *"Can two lotteries both have ∞ EV but different EU? How?"*  
  - *Key insight:*  
    > *"EV is inadequate for extreme lotteries. Bounded utility resolves the paradox and allows rational ranking."*  

  #### **85–90 mins**: Conclusion  
  - Summarize:  
    > *"Today you experienced a paradox: infinite EV, finite bids, and clear preferences. This forces us to reject naive EV maximization and embrace EU with bounded utility."*  

  ---

  ### **Predictable Challenges & Solutions**  
  1. **Calculation stage stalls**  
     - *Risk:* Groups miss divergent sums.  
     - *Fix:* Circulate and hint: *"What happens if you sum terms forever?"*  

  2. **Bids cluster near zero**  
     - *Risk:* Students undervalue lotteries due to skepticism.  
     - *Fix:* Remind: *"Hypothetical tokens cost nothing—imagine this is real!"*  

  3. **Resale confusion**  
     - *Risk:* Students misunderstand resale rules.  
     - *Fix:* Use a mock auction (e.g., sell a pen) to demonstrate.  

  4. **Coin flips run long**  
     - *Risk:* Long head-sequences delay play stage.  
     - *Fix:* Cap at 10 flips (pre-announce: *"We’ll stop at 10 flips"*).  

  5. **Token accounting errors**  
     - *Risk:* Miscounts during payoffs.  
     - *Fix:* Assign 2–3 students as "bankers" to help track.  

  ---

  ### **Limitations & Facilitator Notes**  
  - **Critical limitation:**  
    > *The activity cannot replicate true infinity. With a cap (10 flips), both lotteries have finite EV (Lottery A: EV = 10; Lottery B: EV ≈ 10^300). You must stress: "In theory, with unlimited flips, EV is infinite. We cap for practicality—but imagine no cap."*  
  - **Your role:**  
    - Emphasize the *disconnect* between math (∞ EV) and behavior (finite bids).  
    - In debrief, explicitly connect bounded utility to tail behavior:  
      > *"Fatter tails (like Lottery B) amplify the paradox because unbounded utility would require infinite bids, but psychology rejects this."*  
  - **No web/readings:** All concepts self-contained via activity + debrief.  

  ---  
  This plan forces students to confront the paradox behaviorally. The market stage exposes preference inconsistencies, while the debrief links their actions to utility theory—all without pre-teaching the paradox.
