answer: |-
  ### Decision Procedure for Population-Changing Proposals  
  **Core Principles**:  
  - **Mandate**: Maximize *total discounted wellbeing* (TDB). This is non-negotiable.  
  - **Critical Distinctions to Preserve**:  
    1. **Mere additions** (adding people with positive wellbeing without harming existing people) vs. **trade-offs** (making existing/future people worse off).  
    2. **Wellbeing threshold**: Lives above "neutral" (wellbeing > 0) are worth living; lives below neutral (wellbeing ≤ 0) are not.  
    3. **Outcome ranking**: Proposals are ranked by TDB. Rules about permissibility (e.g., rights violations) are values questions.  
  - **Streamlined for Efficiency**: Ignore philosophical debates (e.g., "repugnant conclusion"), average wellbeing, or non-identity problems. Focus on measurable wellbeing and population projections.  

  **Procedure** (run in order for each proposal):  
  1. **Define Baseline and Proposal Scenarios**  
     - **Evidence Needed**: Demographic projections (population size, age structure) and wellbeing estimates (per capita) for:  
       - Baseline (status quo without intervention).  
       - Proposal (with intervention).  
     - **Sufficiency**: Use existing data (e.g., World Bank, WHO, project docs). If gaps exist, extrapolate conservatively. *Time-saving tip*: Use 100-year projections with standard discounting (e.g., 3% annual discount rate).  
     - **Output**: Two datasets (baseline vs. proposal) with annual population and average wellbeing.  

  2. **Flag Values Questions for Chair**  
     - **Hand off to chair if**:  
       - **Harm to existing people**: Proposal reduces wellbeing for *any person who exists in the baseline* without compensation (e.g., land seizures).  
       - **Creating "below-neutral" lives**: Proposal causes lives with wellbeing ≤ 0 that would not exist otherwise (e.g., painful congenital diseases).  
       - **Rights violations**: Evidence of coercion (e.g., forced sterilization in family planning).  
     - **Measurement questions proceed**: Mere additions, reduced future populations, or lower average wellbeing are *not* values issues.  

  3. **Calculate Total Discounted Wellbeing (TDB)**  
     - **Formula**:  
       \[
       \text{TDB} = \sum_{t=0}^{100} \left( \text{Population}_t \times \text{Avg. Wellbeing}_t \times \text{Discount Factor}_t \right)
       \]  
     - **Evidence Needed**:  
       - Wellbeing scale: Anchor "neutral = 0" (e.g., wellbeing surveys calibrated to life-satisfaction scores).  
       - Discount rate: Use the fund’s standard (e.g., 3%).  
     - **Sufficiency**: If wellbeing data is sparse, use proxies (e.g., GDP/health for wellbeing, with adjustments).  

  4. **Compute Net TDB Impact**  
     - **Formula**:  
       \[
       \text{Net TDB} = \text{TDB}_{\text{proposal}} - \text{TDB}_{\text{baseline}}
       \]  
     - **Recommendation**:  
       - If Net TDB > 0: **Recommend**.  
       - If Net TDB ≤ 0: **Do not recommend**.  

  5. **Handle Cyclic Comparisons**  
     - **Risk**: Impossible with TDB scores (transitive ranking). If ties occur, break by:  
       1. Higher TDB per dollar cost.  
       2. Earlier project start date.  

  ---  
  ### Application to Proposals  
  **Assumptions**:  
  - Wellbeing scale: 0 = neutral (life barely worth living), 10 = high wellbeing.  
  - Discount rate: 3% per year.  
  - Time horizon: 100 years.  
  - Proposals cost the same; opportunity cost of funds is ignored (per mandate).  

  ---  
  #### **Proposal 1: Mortality Programme**  
  - **Description**: Adds future people with wellbeing = 6; lowers average wellbeing; no one worse off.  
  - **Procedure**:  
    1. **Baseline**: Population = 10M, avg. wellbeing = 8.  
       **Proposal**: Population = 50M, avg. wellbeing = 7.  
    2. **Values check**: Mere addition (no harm, no lives ≤ 0). **No chair referral**.  
    3. **TDB Calculation**:  
       - Baseline TDB: High per-capita wellbeing, but smaller population.  
       - Proposal TDB: Larger population with solid wellbeing → **Net TDB > 0**.  
    4. **Recommendation**: ✅ **Recommend** (Net TDB positive).  

  ---  
  #### **Proposal 2: Cheap Subsistence Package**  
  - **Description**: Supports very large population (wellbeing = 1) vs. alternative: small population (wellbeing = 10).  
  - **Procedure**:  
    1. **Baseline** (status quo): Population = 1M, avg. wellbeing = 10.  
       **Proposal**: Population = 1B, avg. wellbeing = 1.  
    2. **Values check**:  
       - Mere addition (lives > 0; no one harmed). **No chair referral**.  
    3. **TDB Calculation**:  
       - Baseline TDB: \( \text{TDB}_{\text{base}} = \sum [1\text{M} \times 10 \times \text{discount}] \)  
       - Proposal TDB: \( \text{TDB}_{\text{prop}} = \sum [1\text{B} \times 1 \times \text{discount}] \)  
       - Result: **TDB\({}_{\text{prop}}\) >> TDB\({}_{\text{base}}\)** (sheer population size dominates).  
       - *Example*: At 3% discount, TDB\({}_{\text{prop}}\) ≈ 33B wellbeing units; TDB\({}_{\text{base}}\) ≈ 330M units.  
       - **Net TDB > 0**.  
    4. **Recommendation**: ✅ **Recommend** (Net TDB positive).  

  ---  
  #### **Proposal 3: Schooling and Family Planning**  
  - **Description**: Raises living standards (wellbeing ↑) but reduces future population.  
  - **Procedure**:  
    1. **Baseline**: Population = 100M, avg. wellbeing = 4.  
       **Proposal**: Population = 50M, avg. wellbeing = 8.  
    2. **Values check**: No harm to existing people; no lives ≤ 0. **No chair referral**.  
    3. **TDB Calculation**:  
       - Baseline TDB: \( \sum [100\text{M} \times 4 \times \text{discount}] \)  
       - Proposal TDB: \( \sum [50\text{M} \times 8 \times \text{discount}] \)  
       - Result: **TDB\({}_{\text{prop}}\) ≈ TDB\({}_{\text{base}}\)** (similar total; depends on discounting).  
       - *Example*: At 3% discount, both ≈ 1.3B wellbeing units.  
       - **Net TDB ≈ 0** (slight edge to proposal if wellbeing gains are front-loaded).  
    4. **Recommendation**: ✅ **Recommend** if Net TDB > 0; else, not.  

  ---  
  ### If Procedure Recommends Proposal 2: Memo Template  
  **To**: Board of Trustees  
  **From**: [Your Name], Wellbeing-Appraisal Analyst  
  **Subject**: Recommendation for Funding: Cheap Subsistence and Sanitation Package (Proposal 2)  

  **Summary**:  
  This proposal supports a very large population (1 billion) at a subsistence living standard (wellbeing = 1). The alternative (status quo) sustains a smaller population (1 million) at a high wellbeing (10).  

  **Appraisal Results**:  
  - **Total Discounted Wellbeing (TDB)**:  
    - Baseline (status quo): 330 million wellbeing units.  
    - Proposal: 33 billion wellbeing units.  
  - **Net Impact**: **+32.67 billion wellbeing units** (strongly positive).  
  - **Values Check**: No harms to existing people; all lives above "neutral" (wellbeing > 0).  

  **Why This Ranking?**  
  Per the fund’s mandate, we maximize *total wellbeing*, discounted for time. The large population gain here outweighs the lower average wellbeing. This outcome aligns with utilitarian ethics but may conflict with intuition (the "Repugnant Conclusion" in philosophy).  

  **Recommendation**:  
  Fund this proposal. It ranks **#1** in this round due to its massive net wellbeing gain.  

  **Caveats**:  
  - The mandate compels this result; changing it requires board action.  
  - We assume accurate population projections. If subsistence risks dropping wellbeing ≤ 0, reassess.  

  ---  
  ### Where the Procedure Misfires and Mitigations  
  1. **Misfires**:  
     - **Repugnant Conclusion**: Favors large, barely-happy populations (Proposal 2).  
     - **Ignoring Inequality**: A population with 50% at wellbeing 10 and 50% at -5 could have positive TDB but be unethical.  
     - **Uncertainty**: Long-term projections (e.g., 100 years) may be unreliable.  
     - **Rights Violations**: Coercive policies might slip through if not flagged.  

  2. **Mitigations**:  
     - **Chair referral** for harm/rights issues (Step 2).  
     - **Sensitivity analysis**: Test TDB under pessimistic/optimistic scenarios.  
     - **Transparency**: Disclose assumptions in the memo (e.g., "This ranking assumes no unforeseen Malthusian collapse").  

  **Final Note**: This procedure is measurement-focused, values-minimal, and executable in **3 days** by a staff economist. It meets the board’s requirement for an ungamable, future-inclusive metric while delegating ethical dilemmas to the chair.
