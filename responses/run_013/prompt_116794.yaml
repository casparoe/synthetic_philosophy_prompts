prompt: |-
  I am preparing a short research proposal (about 1,500 words) for a two-year postdoctoral project on the lottery and preface paradoxes. My half-formed idea: rather than asking whether rational belief is consistent and closed under conjunction, treat acceptance as a policy that accumulates epistemic risk, so that both paradoxes fall out of a single budget-like constraint instead of two unrelated repairs. Turn this into a proposal. State the question so that it has a determinate answer; explain what the standard responses leave unsettled rather than merely disagreeing about; and specify what the budget is a function of, arguing for each element — the number of propositions accepted, their individual probabilities, whether they are evidentially independent, whether the belief concerns the agent's own reliability, and the practical stakes of being wrong. Say what would actually be done: which cases the constraint is tested against, and how it is meant to explain why the preface turns on a belief about one's own fallibility while the lottery turns on parallel low-probability propositions. Then say what decisive success would look like, and what would count as failure — including the possibility that the budget is a redescription of the two paradoxes in new vocabulary, or that it collapses into ordinary pragmatic encroachment about knowledge. Keep the plan realistic for two years. No citations or literature review: refer to positions by description and I will supply the references.
reasoning: |-
  Okay, the user is working on a postdoctoral research proposal about the lottery and preface paradoxes. They have a half-formed idea about treating acceptance as a policy that accumulates epistemic risk, with a single budget constraint solving both paradoxes. I need to help them shape this into a full proposal.

  First, I should understand their core concept. They want to move away from the traditional focus on whether rational belief is consistent and closed under conjunction. Instead, they're framing acceptance as a policy where each accepted proposition adds to the cumulative epistemic risk, and there's a "budget" limiting how much total risk an agent can take on. This budget approach would explain why we reject conjunctions in lottery cases but accept them in preface cases - because the risk accumulation patterns differ.

  For the research question, it needs to be specific and have a determinate answer. Something like: "Under what quantitative constraint on cumulative epistemic risk can a belief-acceptance policy resolve both paradoxes while explaining their structural differences?" This directly addresses their idea while allowing for clear success/failure conditions.

  The standard approaches leave important gaps that the budget concept could fill. The threshold view struggles to explain why we reject lottery conjunctions but accept preface conjunctions despite both having high probabilities. Contextualism and closure-denial are more like patches than unified solutions. The budget approach offers a single framework where the paradoxes emerge from different risk accumulation patterns.

  Now, what should the budget depend on? The user mentioned several factors: number of propositions, individual probabilities, evidential independence, beliefs about reliability, and practical stakes. Each needs justification:

  - Number of propositions: More acceptances mean more risk sources
  - Individual probabilities: Lower probabilities increase per-statement risk
  - Evidential independence: Dependent risks compound less than independent ones
  - Reliability beliefs: Higher self-trust might allow larger budgets
  - Practical stakes: Higher stakes should tighten the budget

  For the methodology, testing against cases is crucial. The constraint should explain why rejecting lottery conjunctions feels right (many independent low-probability risks quickly exhaust budget) while accepting preface conjunctions is reasonable (beliefs are interdependent and include high self-trust). It should also handle hybrid cases and stakes variations.

  Success would look like the budget model cleanly resolving both paradoxes while explaining their differences, offering testable predictions, and resisting collapse into existing views. Failure would be if it merely redescribes the paradoxes, collapses into pragmatic encroachment, or can't handle key cases.

  The two-year plan seems feasible: Year 1 for formalizing the model and analyzing paradox cases, Year 2 for exploring implications, responses to objections, and preparing publications. The user should be able to complete this without overextending.

  Throughout this, I'm keeping in mind they'll add citations later, so I'm describing positions rather than naming theorists. The focus is on making their novel budget concept stand out as a unified solution to both paradoxes.
answer: |-
  Here’s a structured research proposal based on your core idea, focusing on clarity, originality, and feasibility within two years:

  ---

  **Research Proposal: A Unified Risk-Budget Account of Rational Acceptance in Lottery and Preface Paradoxes**

  **1. Core Research Question:**  
  *What is the maximum cumulative epistemic risk (formulated as a quantitative "budget constraint") that a rational agent can permissibly undertake when accepting multiple propositions, such that this single principle resolves both the lottery and preface paradoxes while explaining their key structural differences?*  
  **Determinate Answer:** The budget is a function *B = f(P, S, I, R, C)*, where *P* is the set of propositional probabilities, *S* is practical stakes, *I* is evidential independence, *R* is self-trust in reliability, and *C* is contextual salience of error. The constraint is *Σ Risk(p_i) ≤ B*.

  **2. What Standard Responses Leave Unsettled:**  
  Existing approaches address each paradox in isolation, failing to explain *why* they diverge:  
  - **Threshold views** (accept if probability > *t*) cannot explain why we reject conjunctions of highly probable lottery propositions but accept conjunctions of fallible preface claims.  
  - **Contextualist/closure-denial views** treat the paradoxes as separate phenomena (e.g., lottery hinges on "knowledge," preface on "reasonableness"), lacking a unified mechanism.  
  - **Pragmatic encroachment** explains stakes-sensitivity but not the *structural* difference: why prefacing requires a belief about *self-fallibility*, while lotteries involve *statistical independence*.  
  *The unsettled issue: A principled distinction between paradox types that does not rely on ad hoc fixes.*

  **3. The Risk-Budget Model: Key Components & Justification**  
  Rational acceptance is a policy where each accepted proposition *p_i* contributes incremental epistemic risk *Risk(p_i)* to a total "budget" *B*. The constraint *Σ Risk(p_i) ≤ B* explains paradoxes via *risk accumulation patterns*.  
  - **Number of propositions (n)**: More acceptances increase cumulative risk. *Justification:* Cognitive limits and coherence demands.  
  - **Individual probabilities (P)**: *Risk(p_i) ∝ 1/Pr(p_i)*. *Justification:* Lower probability directly increases per-statement risk.  
  - **Evidential independence (I)**: *Risk* compounds non-additively for dependent propositions. *Justification:* Independent errors are riskier (lottery tickets) than correlated ones (premises in a theory).  
  - **Self-trust in reliability (R)**: *B ∝ R*. Higher self-trust (e.g., author’s confidence) increases the tolerable risk cap. *Justification:* Self-doubt (preface) forces conservative budgeting.  
  - **Practical stakes (S)**: *B ∝ 1/S*. High stakes (e.g., financial loss from false lottery belief) tighten the budget. *Justification:* Pragmatic goals shape epistemic norms.  

  **4. Methodology: Testing and Explanatory Scope**  
  - **Test Cases**:  
    - *Pure Lottery*: 1M independent tickets, Pr(win) = 0.999999 each. *Model prediction:* Conjunction rejection as *Σ Risk* exceeds *B* due to high *n*, low *Pr*, and independence (*I*).  
    - *Pure Preface*: Author accepts 100 mutually supportive claims, each Pr > 0.99, but adds fallibility disclaimer. *Prediction:* Conjunction acceptance permitted as dependence (*I*) lowers cumulative risk; self-distrust (*R*) is already budgeted.  
    - *Hybrid Cases*: E.g., a preface-like lottery (non-independent tickets) or high-stakes preface (medical claims). Tests whether *I*, *S*, and *R* interact as modeled.  
  - **Explaining the Divergence**:  
    - **Preface** turns on *R* (self-trust) because acknowledging fallibility *reduces* effective *B*, making conjunctive acceptance rational only when *R* is explicitly managed.  
    - **Lottery** turns on *I* and *P*: Independence forces *linear risk accumulation*, so many low-risk propositions breach *B* faster than dependent ones.  

  **5. Success Criteria & Failure Modes**  
  - **Decisive Success**: The budget constraint (a) resolves both paradoxes without special adjustments, (b) predicts intuitive verdicts in hybrid cases, (c) explains why *R* is central to preface but irrelevant to lottery, and (d) avoids reducibility to existing frameworks.  
  - **Failure Conditions**:  
    - **Redescription**: The model merely re-labels the paradoxes (e.g., "budget" = probabilistic threshold + stakes) without new explanatory power.  
    - **Collapse into Pragmatic Encroachment**: If *B* depends *only* on *S*, it becomes standard stakes-sensitive justification, failing to explain structural differences.  
    - **Insufficient Unification**: If paradoxes require distinct budget parameters (e.g., lottery uses *I*, preface uses *R*), the "single constraint" claim fails.  

  **6. Two-Year Work Plan**  
  - **Year 1**: Formalize *Risk(p_i)* and *B* functions; model pure lottery/preface cases; test against hybrid scenarios; identify potential counterexamples.  
  - **Year 2**: Extend to multi-context beliefs (e.g., scientific theories); compare with pragmatic encroachment/closure-denial; draft monograph/papers; address collapse objections.  

  **7. Original Contribution & Feasibility**  
  - **Innovation**: First unified account of both paradoxes via *risk accumulation*, replacing consistency/closure with a dynamic epistemic resource.  
  - **Feasibility**: Focused on conceptual modeling (no empirical work). Core analysis achievable in 18 months; 6 months for refinement and dissemination.  

  ---

  **Key Strengths:**  
  - **Determinate Answer**: Budget *B* is explicitly defined by *P, S, I, R, C*.  
  - **Unification**: Both paradoxes emerge from risk exceeding *B*, but via distinct factors (*I* vs. *R*).  
  - **Anti-Reduction**: By incorporating *I* and *R* as non-pragmatic factors, the model resists collapse into standard pragmatic encroachment.  
  - **Realistic Scope**: Avoids literature review; focuses on formalizing and testing a single constraint.  

  This framework turns your insight into a testable, novel solution while directly targeting the unresolved gap in existing approaches.
