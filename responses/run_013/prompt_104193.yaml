  Ok so I'm putting together the take-home final for my upper-level seminar on minds and machines — mixed bag of students, a couple of phil grad students, a bunch of cog sci and CS seniors — and I need you to draft one of the long questions for me: the question itself, a model answer, and a marking scheme I can hand to my TA. Put on your philosopher-of-mind hat for this, the kind of person who's taught the Chinese Room a dozen times and is now definately hard to impress.

  Think it through carefully before you write anything. Start by brainstorming what the load-bearing steps of the Chinese Room argument actually are, and which of them are claims about the person in the room versus claims about the system as a whole, because that's exactly where I want the question to bite.

  My problem is the standard question. Everyone can recite the systems reply, everyone can recite Searle's comeback to it, and I get thirty identical essays. So I've built a variant, and I want the question built around it. Here's the case, and yes, I want it printed in the question stem:

  The Bilingual Room. Everything is set up the usual way: the operator sits in the room, gets Chinese input, consults a rulebook of formal rules, and pushes out Chinese output. Only this time the operator is a fluent native speaker of Chinese. She's under strict instructions to produce every output by applying the rulebook mechanically, and she's being watched, so she does. It turns out the rulebook is a mediocre one — its rules mishandle a family of constructions, so the room's replies are smooth and fluent but systematically wrong in ways that make her wince, since she can see the mistakes. (a) Does the room understand Chinese? Does the operator? (b) Now suppose she ditches the rulebook and just answers from her own grasp of the language. The room's behaviour gets much better. Who understands now — the room, the operator, both, neither? (c) What do your answers to (a) and (b) do to the move where Searle says: fine, then let the man memorise the rulebook and the entire database, so that he just is the system — does he understand Chinese then, and is that a good reply to the systems reply?

  That's the crux I'm after. I want them to notice that the room understanding and the person understanding can come apart in both directions, and that the argument's real target has to be stated carefully — is it about behaviour, about the syntax/semantics gap, about intentionality being absent from the parts, or about the wrong kind of causal powers? — because the standard framing lets them hide behind whichever reading is convenient.

  Deliverables: the question as it would appear on the paper (stem, then (a)(b)(c), plus a word limit), a model answer of around 700-800 words that a strong student could plausibly have written in 90 minutes, and a marking scheme out of 20 that separates an A from a B by naming the specific moves each one has to contain — five must-hit points, the marks for each, and one line per point on how students typically get it wrong. Don't let the answer depend on citing anything or naming any papers; they can't look stuff up during the exam, so the whole thing has to stand on the case itself and on arguments they can reconstruct from scratch. And please don't let the model answer turn into a survey of the debate — it has to actually decide something and defend the decision.
