  Okay, the user presents a theory about the left-right political distinction being asymmetric: the right has a stable disposition to defend existing hierarchies, while the left is merely oppositional without positive content. They want this rigorously tested, especially against two concerns: a "swap case" where the right defends egalitarianism, and whether the model survives multidimensional political analysis. 

  First considering the swap case. The user worries their theory might collapse into "right = power defenders," making it content-neutral. Historical examples like revolutionary France come to mind - Girondins defending the new egalitarian order would be "right" under this model, but were historically leftists. That creates tension. Modern cases like Scandinavian welfare states also fit - conservatives defending strong equality would be "right" here but traditionally right-wing elsewhere. 

  Then the dimensionality problem. Political science consistently shows at least two axes: economic and social. The user's theory might work for social hierarchy (where right-wing traditionalism is stable), but fails on economics where both left and right have positive programs. Horseshoe effects further complicate - when far-left and far-right both oppose liberal democracy, it contradicts the model's clean asymmetry.

  The user is clearly intellectually honest, wrestling with falsifiability. They're not just defending a pet theory but genuinely stress-testing it. The mention of "exposure mapping" suggests they want concrete disconfirmation paths. Underneath, they might be probing whether political alignment is fundamentally about temperament vs circumstance.

  For counterevidence that should move them: 
  - Stable left-wing governing programs (Nordic model) show positive content beyond opposition
  - Historical cases like early Fabians building welfare state theory proactively
  - Multi-axis models forcing separate analysis of hierarchy-defense vs economic interventionism
  - Horseshoe effects contradicting the linear opposition model

  But some defenses remain: one could argue Nordic conservatives are temperamentally defenders despite egalitarian content, or dismiss horseshoe as "not real left/right." The theory risks becoming unfalsifiable if all cases get reinterpreted through the lens of "defender temperament" vs "opposition."

  Ultimately the model is partially useful for social hierarchy dimensions but overgeneralizes. The strongest disconfirming evidence is when self-identified leftists govern established systems - their programmatic governance contradicts the "mere opposition" claim. That's harder to explain away than swap cases.
answer: |-
  **Bottom line:** Your asymmetry thesis is partially defensible for *cultural* hierarchy-conservatism but collapses under multidimensional analysis, historical counterexamples of programmatic leftism, and the reality of right-wing revolts against established orders. Here's the decisive evidence, sorted by impact:

  ### 1. **The Swap Case: It Happens & Breaks Your Definition**
     * **Decisive Counterexample: Post-Revolutionary France (1794 onwards)**
       * **The Swap:** The Jacobin/Montagnard regime *established* a radical, anti-aristocratic, egalitarian order (at least rhetorically and legally). The *Thermidorian Reaction* and subsequent *Directory* defended this *new*, *radically left-wing established order* against challenges from *both* royalists (old right) *and* radical Jacobins (like Babeuf) who wanted even more leveling.
       * **Problem for You:** Under your model, Thermidorians/Directorials defending the *new egalitarian status quo* become the "Right." Royalists wanting old hierarchies *and* radical egalitarians attacking the new order's compromises *both* become the "Left." This renders "Left" incoherent (it contains both hierarchy-restorers *and* hyper-egalitarians) and "Right" becomes purely "defenders of *whatever* is established," stripping it of any specific temperamental content beyond conservatism-in-general.
       * **Why it Moves You:** It's a major historical instance where the *content* defended by the "Right" (the Thermidorians/Directorials) was *explicitly the legacy of the radical Left*, and the forces attacking it included both those wanting *more* leftism *and* the old Right. Your labels become unmoored from temperament or content.
     * **Modern Analog: Scandinavian Welfare States**
       * Established Social Democracy is the entrenched, hierarchical order (with its own power structures). Mainstream Conservatives defend *this* egalitarian-welfare system (just more efficiently). The *actual Left* (e.g., anti-capitalist, further democratization movements) attacks *its* compromises and hierarchies. Again, the "Right" defends a historically "Left" order.

  ### 2. **Multidimensionality: Your Thesis Only Works on One Axis (Badly)**
     * **Decisive Evidence: Political Science Dimensionality Studies (e.g., Inglehart, Norris)**
       * **The Data:** Robust empirical work (surveys, roll-call votes) consistently shows politics requires *at least* two major dimensions:
           * **Economic Left-Right:** State intervention vs. free markets.
           * **Social/Cultural Libertarian-Authoritarian:** Social hierarchy/tradition vs. egalitarianism/individual autonomy.
       * **Problem for You:**
           * **Asymmetry Failure on Economics:** The Economic "Left" has a *positive program* (social democracy, socialism, welfare state) that is *not* simply oppositional. It built institutions (NHS, Social Security). The Economic "Right" (free markets, deregulation) is *also* a positive program, often *revolutionary* against established mercantilist/corporatist orders (e.g., Thatcher, Reagan).
           * **Temperament Only on Social Axis?** Your "defend existing hierarchy" temperament *maps well onto the Social-Authoritarian pole*. But this pole isn't exclusively "Right" (e.g., Stalinist authoritarianism was socially traditionalist/hierarchical *and* economically left). The Social-Libertarian pole ("Left" culturally) *also* has positive content (individual rights, anti-discrimination norms).
       * **Horseshoe Effect:** This *falsifies* your linear asymmetry. When Far-Left (e.g., Stalinists) and Far-Right (e.g., Fascists) converge on *Social-Authoritarianism* (suppressing dissent, strong leader, collectivism over individual rights), it's because they share a temperament *opposed to liberal pluralism*, not because one is "defending" and the other is "negating." Your model predicts opposites, not convergence.

  ### 3. **Programmatic Leftism: The Left Builds and Defends Too**
     * **Decisive Counterexamples:**
       * **The Fabian Society (UK):** Systematically developed *positive*, gradualist socialist policies *within* the established order, leading directly to the Labour Party and the Welfare State. This was *program-building*, not mere negation.
       * **Nordic Social Democracy:** Governed for decades, *establishing* and *defending* their comprehensive welfare states and corporatist models as the *new status quo*. They became the "establishment" conservatives defended.
       * **Institutional Leftism:** Trade unions, co-ops, mutual aid societies – these are *positive, enduring institutions* built by the Left with their own internal structures and hierarchies to defend.
     * **Problem for You:** This shows the Left *can* have stable positive content, build enduring systems, and become the "defenders of the established order" in their domains, contradicting the "residual category/negation" claim.

  ### What a Proponent Would Concede vs. Wave Away
  * **Concede as Strong Counter-Evidence:**
      * The **Post-Revolution France Swap**. It directly demonstrates the incoherence of defining "Right" purely as defender-of-current-order when that order was built by the radical Left.
      * **Multidimensionality showing distinct Economic/Social Axes**. Forces acknowledgment the asymmetry might only (partially) hold on the social/cultural axis.
      * **Stable Left-wing governing programs/institutions** (Nordics, Fabians). Undermines the "Left = only negation" core.
  * **Wave Away ("No True Scotsman"):**
      * **Stalinism/Authoritarian "Left" as not "real" Left:** Argues true Left is inherently anti-hierarchical, so authoritarian regimes are deviations/betrayals.
      * **Right-wing revolts (e.g., Fascism):** Argues these are revolutionary movements *against* a *liberal* established order, so they are "negating" a specific (disliked) status quo to impose their *own* preferred hierarchy, fitting the temperament.
      * **Libertarians:** Claim they are "negating" state hierarchy but temperamentally individualist/anti-collectivist, so maybe not "Left" despite opposing many hierarchies.

  ### Is it Unfalsifiable? (Blunt Assessment)
  **Yes, it risks becoming unfalsifiable through redefinition.** Defining "Right" as "defender of *whatever* hierarchy exists" makes it tautological – anyone defending *any* status quo *is*, by definition, "Right" in that moment. Defining "Left" solely as opposition to the current Right makes it residual by fiat. **This *is* a problem:** It sacrifices explanatory power for tidiness. A useful descriptive claim must allow for disconfirmation. The **swap cases** and **programmatic leftism** *do* provide potential falsification, but a determined proponent can often reinterpret specifics ("that defender wasn't *truly* temperamentally Right" / "that Left program wasn't *pure* negation"). The **multidimensional evidence** is the hardest to wave away – it fundamentally shows your single-axis asymmetric model doesn't map reality. The strongest disconfirmation remains **historical moments where self-identified "Left" groups are clearly defending an established system they built against challengers**, proving they have positive, stabilizable content beyond mere opposition.
