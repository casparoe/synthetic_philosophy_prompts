prompt: |-
  Okay so I've landed on a view about the left/right thing and I want you to try and break it, because I can't tell anymore if it's deep or just unfalsifiable. Here's the view: the distinction is real -- it's not a team-sport artifact, not just two coalitions that happened to form and then froze -- but it's lopsided. "Right" picks out a genuine shared disposition: a standing preference for whatever order is already in place and the hierarchies it runs on, defended as such, regardless of what that order's content happens to be. "Left" is basically a residual category -- it's defined by opposition to whatever the right is currently defending, so it has no stable positive content of its own. What holds each side together is asymmetric: one side is a temperament, the other is a negation. I know that's tidy, maybe too tidy, which is why I want the exposure mapped.

  What I want from you: what would actually count against this? Not the usual "well the terms are fuzzy" hand-waving -- I want the specific observations, cases, historical episodes, and formal/empirical results that should move me, sorted by how decisive they'd really be. Two things I keep circling:

  1. The swap case. Imagine a society where the entrenched order is itself radically egalitarian and anti-hierarchical -- flattening hierarchies is just what the authorities enforce. On my view the "right" there would be the defenders of that egalitarian order, and the "left" would be the people attacking it. Is that coherent, or does my view quietly collapse into "the right = whoever holds power" and stop saying anything about content? And is there a real-world version of the swap, or only toy ones?

  2. The one-axis question. My view assumes the economic/social split can be folded into a single line. If the data really wants two dimensions, does my asymmetry thesis survive, or was it only ever true of the social axis? And what do I do with the horseshoe stuff -- if the extremes curl around and start agreeing, does that falsify me or is it exactly what my view predicts?

  Also: which of these would someone who shares my view concede as genuine counter-evidence, versus which would they wave away as not-really-left-not-really-right? I don't want only the critics' list. And be blunt at the end about whether this position has been qualified into unfalsifiability, and whether that's actually a problem here or just the normal cost of a descriptive claim.

  The thing that would move me most is a case where the sides visibly swap contents and the labels stubbornly stay put -- if you've got one, lead with it.

  Lead with your bottom line in the first sentence, then the reasoning. No preamble, don't restate my question back to me.
