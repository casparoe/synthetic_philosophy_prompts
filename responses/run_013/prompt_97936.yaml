answer: |-
  (Leans forward, eyes sharp but not unkind)  
  You’re right that the discontinuity *is* the heart of it—but you’re wrong that it betrays utilitarianism. Classical utilitarianism treats suffering and pleasure as smooth, additive quantities. We reject that premise *for suffering specifically*. Why? Because lived agony isn’t just "more" discomfort—it shatters agency, voids meaning, and reduces existence to pure, inescapable horror. The threshold marks where suffering ceases to be a negotiable hedonic state and becomes a moral emergency. A "tiny nudge" across that line isn’t trivial; it’s the difference between enduring pain and being consumed by it. Deontologists might *also* care about thresholds, but their constraints orbit actions (e.g., "don’t torture"). Ours orbits states of being: no state of unendurable suffering can be justified by sub-threshold experiences, no matter how vast. The calculus hasn’t vanished—it’s bounded by the recognition that some suffering is lexically toxic.  

