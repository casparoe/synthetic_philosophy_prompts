  - The state's fiscal health: if debt is too high, the state might collapse.

  But we want the cycle to emerge without being too prescriptive.

  Alternative: Agent-based simulation without roles? But we have 16 students. We want them engaged.

  Revised Plan: Make it a whole-class simulation with students as heads of families (commoners and elites). We start with 5 elite families and 10 commoner families. Each family is represented by a student.

  Materials:
