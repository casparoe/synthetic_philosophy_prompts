     - For each elite family: roll a die. On 5-6, they have a child. The child becomes an elite aspirant. If there is an open elite position (due to an elite family dying? we need mortality), the aspirant takes it. Otherwise, they remain aspirant.

     Mortality: Each round, each family (commoner and elite) also has a chance of dying. Roll a die: on 1, the family dies (remove them and free up their land if commoner, or free up elite position if elite). But we don't want too much randomness. Alternatively, mortality can be low and we can have a fixed death rate for elites to open positions? But we want the system to get clogged.

     Instead: Make elite mortality low. For elites, each round roll for death: only on 1 (so 1/6 chance). For commoners, we can have a higher death rate if they are landless? 

  2. Production:
     - Each commoner family with land produces 2 units of food. They consume 1 to survive. The surplus (1 unit) is taxable.
     - Landless commoners produce nothing and must consume 1 unit (if they have savings or through charity? but we don't model savings). Without food, they die or rebel.

  3. Taxation:
     - The state announces a tax rate (T) per commoner family (between 0.5 and 1.5 units). The elite families collect the tax from their assigned commoners. 
     - Each elite family has a group of commoners assigned (initially 2 per elite). The elite family collects T from each commoner. They keep a fraction (say 20%) and pass 80% to the state.
     - The state records the revenue.

  4. State Finances:
     - The state has fixed expenses (E) per round (say 5 units). If revenue >= E, the state is fine. If not, the state must borrow (debt increases by the shortfall, and debt incurs interest, say 10% per round). If debt exceeds a threshold (say, 20), the state collapses.
     - The state can choose to create new elite positions (which costs nothing? but then the state might do it to please aspirants). However, each new elite position dilutes the tax base because the commoners are split among more elites. Alternatively, the state can set a new tax rate for next round.

  5. Elite Competition:
     - Count the number of aspirants. For each aspirant without a position, they cause 1 point of instability. Also, each landless family causes 1 point of instability.
