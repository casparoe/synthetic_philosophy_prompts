  But within two hours, we might only have time for one run? We need to be efficient.

  Alternatively, we can have multiple games running in parallel with different parameters. But 16 students: we can split into two groups of 8. Each group runs the simulation with a different parameter set.

  But then we need to compare at the end. And we want them to see the aggregate graph at the end.

  Timeline:

  - Introduction (10 min): Explain the rules and roles. Assign roles: 5 elites, 10 commoners, and 1 state (or 2 for state). The TA is the facilitator.
  - Practice round (10 min): Walk through one round so everyone understands.
