  Crisis Resolution:
     - Roll a die: 1-2: mild crisis (10% population dies), 3-4: moderate (25%), 5-6: severe (50%).
     - Then, landless families are removed (they die or flee) until the remaining commoners can be placed on land (if there is land available). 
