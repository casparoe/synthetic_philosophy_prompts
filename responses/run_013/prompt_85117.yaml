prompt: |-
  I'm a TA for a 300-level seminar that's basically an argument about whether history can be a science, and next week it's my turn to run the whole two-hour session myself — 16 students, a mix of history and econ people, several of whom are openly skeptical that anything about the past can be quantified. The reading that week is Peter Turchin's flavor of macrohistory: secular cycles, the structural-demographic picture in which pre-modern agrarian states swing between an integrative phase and a disintigrative one over roughly two or three centuries, driven by population growth pressing against a fixed land base, elite overproduction (far more people with elite aspirations than there are elite positions for them to fill), fiscal strain on the state, and then a violent crisis that clears the board and lets a new elite re-consolidate. I don't want to lecture at them. I want an activity, and I want them to feel two things, in this order. First, that a cycle of that shape can be an emergent consequence of a few mundane local rules — nobody has to intend the cycle, or even notice it while it's happening; it just falls out of people having children, wanting status, and competing for a small number of slots. Second, and this is the part I actually care about: once they've watched the cycle fall out of the rules, I want them to feel how fragile that result is. If you'd nudged one or two of the parameters the oscillation vanishes entirely; and they, sitting inside it and living one round at a time, can't tell which phase they're in until I show them the aggregate graph at the end. The historiographical analogue I'm chasing is the gap between seeing cycles looking backwards over centuries and the people who lived them having no idea, plus the worry that a model which reproduces a cycle may simply have had the cycle built into its assumptions from the start.

  So: take the role of an expert in simulation-based teaching and in the philosophy of the historical social sciences, and design this properly. I need roles, materials (assume no computers — index cards, dice, a whiteboard, photocopied state sheets), a round structure, the rules for how land, food, revenue and elite positions get allocated each round, and a timeline that fits two hours with real room for the debrief. Then give me the debrief itself: how to map specific moments of what actually happened onto the parts of the theory, an honest note about what the activity cannot reproduce (I assume the total absence of technological change, contingency, and anything like genuine agency is going to be a problem — tell me how bad it is and how to say so out loud), and what will predictably go wrong the first time I run it, including the failure mode where a sharp student spots the cycle around round four and starts gaming it. Start by brainstorming a few candidate core mechanics before you commit to one, and think carefully about the second act, because that's the piece these activities usually omit — I don't want them walking out thinking we've shown that history is predictable.
reasoning: |-
  We are designing a simulation game for a two-hour seminar. The goal is to illustrate Turchin's structural-demographic theory through an emergent cycle and then show its fragility.

  Core requirements:
  1. Emergence: The cycle (integrative -> disintegrative -> crisis -> reintegrative) should emerge from simple rules without being explicitly programmed.
  2. Fragility: Small changes in parameters should break the cycle, showing it's not inevitable.
  3. Participants should not easily recognize the cycle until the end.

  Constraints:
  - No computers. Use index cards, dice, whiteboard, photocopied state sheets.
  - 16 students, mix of history and econ.
  - Two hours including debrief.

  Brainstorming core mechanics:

  We need to model:
  - Population growth pressing against fixed land base (leads to falling per capita resources, then crisis).
  - Elite overproduction (too many elite aspirants for available positions).
  - Fiscal strain on the state (state's revenue declines relative to needs, leading to breakdown).

  Possible mechanics:

  Option 1: A board game style with rounds representing decades. Players are families (or individuals) in different classes (commoners, elites). Each round:
    - Population grows (via dice or fixed rate?).
    - Land is fixed, so food production is fixed per unit land, but labor input can vary? But we want simplicity.
    - Elite positions: fixed number. Each elite position provides income and status. Aspiring elites (from commoners or elite offspring) compete for open positions (which open when an elite dies or when the state creates new ones?).

  But how to model the cycle? We need:
    - Integrative phase: population below carrying capacity, plenty of elite positions, state strong.
    - Disintegrative: population grows, resources per capita fall, elite competition increases, state revenue falls (because commoners are poorer? or because elites evade taxes?).

  Option 2: Focus on the state and elites. Have:
    - A fixed land area (say 100 units).
    - Each unit of land can support a certain population. But we need to model production and distribution.

  Simpler: 
    - Let each commoner family work a plot of land. Initially, there are fewer families than land. Each family produces food and pays tax to the state. 
    - The state has a fixed number of elite positions (say, 5 at the start). Each elite collects tax from a set of commoners (so they are tax farmers) and keeps a portion, giving the rest to the state. 
    - Each round:
        * Population grows: each commoner family has a chance to split (if they have enough food) and each elite family has a chance to produce offspring (who become elite aspirants).
        * The state must pay for its expenses (army, administration) with tax revenue. If revenue falls short, it may have to reduce services (leading to instability) or borrow (leading to future strain).

  But we need to trigger the crisis. The crisis happens when:
    - Population exceeds carrying capacity -> famine, then rebellion? 
    - Too many elite aspirants: they may start fighting among themselves or against the state.

  We also need to model the "clearing": a crisis that kills off a lot of people and resets the elite.

  To keep it manageable, we can abstract individuals into family units.

  Proposed Mechanics:

  Game Components:
  - Land cards: each represents a fixed amount of land (say 1 unit). Total land fixed (e.g., 20 units). Each land unit can support 1 family (commoner) at subsistence. But with technology, maybe more? But we are pre-modern, fixed tech. So carrying capacity = number of land units.
  - Family cards: for commoners and elites. Each family has a type (commoner or elite) and a unique ID (for tracking).
  - Elite position tokens: fixed number (say 5 at the start). Each token represents a state-sanctioned elite position (e.g., a governorship, a noble title). Only families holding a token are elites.
  - Aspirant tokens: for elite families that have offspring who want to be elite but don't have a position. These are not state-sanctioned.
  - State treasury: track with coins or on a whiteboard.
  - Round tracker: on whiteboard.

  Roles for students:
  - The state: 1-2 students. They set tax rates (within limits) and decide how many new elite positions to create (if any). They also pay state expenses (a fixed cost per round for the army and administration). They can also borrow (but with interest, leading to future strain).
  - Elite families: 5 students at the start. Each elite family collects taxes from a set of commoner families (assigned at the beginning). They keep a fraction and pass the rest to the state. They also have children (who become aspirants if no position is available).
  - Commoner families: the rest (initially 10, but will grow). Each commoner family works a land unit. They produce food (enough for subsistence and surplus). They pay taxes to their elite. If they don't have enough food, they starve and die (or rebel?).

  Rules per round (each round = 20-30 years?):

  Phase 1: Population Growth
  - Each commoner family: roll a die. If the result is 5 or 6, the family splits (if there is available land). The new family starts on a new land unit (if available) or becomes landless (if no land, then they become laborers or rebels?).
  - Each elite family: roll a die. If 5 or 6, they produce an offspring. The offspring becomes an aspirant (if there is no open elite position) or gets a position (if one is available). But note: elite positions are fixed unless the state creates new ones.

  But we have a fixed land base. So if there is no land available, the new commoner family cannot be created? Then they become surplus population (which might lead to unrest).

  Phase 2: Production and Taxation
  - Each commoner family produces 2 units of food (enough for subsistence and surplus). But if the land is overworked (maybe when population exceeds land, but we don't have that because each family has one land? unless we have landless). 
    Instead: Let's say each land unit produces 2 units of food. The commoner family consumes 1 to survive and pays the rest as tax? But then if they have to pay 1 in tax, they break even. But we want surplus for growth? 

  Revised: 
    - Each commoner family on land produces 2 food. They need 1 to survive. The surplus can be taxed. 
    - The elite family collects tax from each commoner family assigned to them. The tax rate is set by the state (say, between 0.5 and 1.5 units per commoner). But the elite keeps a fraction (say, 20%) and passes the rest to the state.

  Phase 3: Elite Competition and State Actions
  - The state collects revenue from elites. It has fixed expenses (say, 5 units per round to maintain the army and bureaucracy). If revenue is less than expenses, the state goes into debt (which accumulates interest) or reduces services (which may lead to instability).
  - The state can create new elite positions (at a cost? or free? but then creating too many might dilute the tax base). Alternatively, the state might not create new positions, leading to more aspirants.
  - Aspirants: if there are more aspirants than open positions (which open when an elite family dies, say by a die roll each round), then the aspirants compete. We can model competition by having them bid (with their personal wealth? but we haven't modeled that) or by a lottery (which is arbitrary). Or we can have them start causing trouble: each round an aspirant without a position causes instability.

  Phase 4: Crisis Check
