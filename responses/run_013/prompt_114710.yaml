  ### Restoration-Adjacent Interventions: Coverage Determination Framework  
  **Document: RAI-7.3 | Effective: 01-JAN-2024**  

  #### 1. PURPOSE  
  To standardize classification of interventions targeting non-acute functional states, ensuring consistent resource allocation aligned with Plan Policy §4.5 ("Medically Necessary Restoration").  

  #### 2. CATEGORIES & CRITERIA  
  **2.1 Restorative (Covered)**: Returns claimant to *their own* best-documented function (±5% variance), age-adjusted.  
  - *Example*: Knee surgery restoring marathoner to pre-injury running capacity.  
  - *Exclusion*: No valid baseline? See §2.1.3 (Congenital/Undocumented).  

  **2.2 Protective (Covered pending review)**: Prevents degradation of *existing* function below claimant’s baseline.  
  - *Requires*: ≥90% probability of decline within 18 months without intervention.  
  - *Example*: Antiviral prophylaxis in immunocompromised claimant.  

  **2.3 Augmentative (Not covered)**: Elevates function >5% above claimant’s best-documented baseline OR above 90th population percentile.  
  - *Example*: Neural implants enabling 2x average memory recall.  

  **2.4 Elective (Not covered)**: Seeks alteration of function within baseline/population norms, absent medical justification.  
  - *Example*: Cosmetic melanin increase in Fitzpatrick Type V skin.  

  #### 3. BASELINE RULES  
  **3.1 Personal Baseline Supremacy**:  
  - Restoration judged against claimant’s peak recorded function.  
  - *Age adjustment*: Deduct 0.8% annual decline for motor/cognitive metrics post-age-30.  

  **3.2 Congenital/Undocumented Baseline**:  
  - Default baseline = 10th population percentile (per WHO Global Metrics).  
  - *Exception*: If familial data shows >10th percentile in 2+ generations, use 25th percentile.  

  **3.3 Enhancement Threshold**:  
  Correcting a trait beyond population norms converts therapy to augmentation.  
  - *Illustration*: Correcting congenital myopia to 20/10 vision (population norm: 20/20) = **Augmentative**.  

  #### 4. CONTESTED SCENARIOS & ESCALATION  
  **4.1 Non-Deficit Interventions**:  
  Where claimant denies functional impairment but objective deficit exists:  
  - Classify per §§2.1–2.4 *unless* claimant’s quality-of-life instruments show ≥20% divergence from population mean.  
  - *Escalate*: All cases where claimant’s deficit perception contradicts clinical metrics.  

  **4.2 Stability as Enhancement**:  
  Preventing decline in claimants with progressive conditions:  
  - If intervention maintains function *above* baseline for >6 months → Reclassify as **Augmentative**.  
  - *Example*: Gene therapy halting Huntington’s progression at 105% premorbid cognitive function → **Augmentative** after 180 days.  

  **4.3 Mandatory Escalation**:  
  Refer to Tier-3 Ethics Review Board if:  
  - Claimant’s "best function" was artificially enhanced (e.g., prior stimulant use in ADHD).  
  - Intervention prevents statistically normative decline (e.g., age-related presbyopia correction in claimant with documented 20/20 vision at age 40).  
  - *Worked Example*:  
  > Claimant (Age 48) requests multifocal lenses.  
  > - Baseline (Age 40): 20/20 vision.  
  > - Current: 20/40 (normal for age).  
  > - *Determination*: **Escalate** - Correcting normative decline exceeds "restoration" per §3.1 age-adjustment.  

