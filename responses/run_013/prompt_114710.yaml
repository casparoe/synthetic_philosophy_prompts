   After the form, we'll provide a JSON object with the specified fields.

   Let's write the form:

  ---

  **Interventional Benefit Determination Guidance**  
  **Document Number: IB-78 Rev. 4**  
  **Effective Date: 01 October 2023**  
  **Title: Restoration-Adjacent Interventions: Prior Authorization Criteria and Classification**  

  **1. Purpose**  
  This guidance establishes the framework for classifying interventions as Restorative, Protective, Augmentative, or Elective, for the purpose of determining coverage eligibility under Plan policies. The classification is based on the intervention's relationship to the claimant's functional baseline and the medical necessity of returning the claimant to a state of typical function, as defined herein.

  **2. Definitions**  
  2.1. **Restorative Intervention**: An intervention that returns the claimant to a state of function that the claimant has previously achieved and that is typical for the claimant's age, as documented in the claimant's medical history.  
  2.2. **Protective Intervention**: An intervention that prevents the decline of a function from the claimant's current baseline, but does not restore a lost function.  
  2.3. **Augmentative Intervention**: An intervention that improves a function beyond the claimant's own best documented baseline, or beyond the typical function for the claimant's age, when no prior baseline exists.  
  2.4. **Elective Intervention**: An intervention that alters a function that is within typical ranges and is not medically necessary to prevent imminent decline or harm.

  **3. General Rules**  
  3.1. **Baseline Determination**: The restorative baseline is the claimant's own best documented level of function, adjusted for age-related changes.  
  3.2. **Absence of Baseline**: For conditions present from birth or before a baseline could be established, the baseline is deemed to be the 10th percentile of the general population for that function, as measured by standard instruments.  
  3.3. **Prevention as Protection**: An intervention that prevents a decline in function is classified as Protective only if the decline is medically expected within 12 months without the intervention.  
  3.4. **Enhancement Threshold**: Any intervention that results in function exceeding the claimant's own best baseline by more than 15% (or one standard deviation, whichever is smaller) is automatically classified as Augmentative.  
  3.5. **Subjective Deficit**: The claimant's subjective experience of deficit is not determinative. Objective measures of function relative to the baseline and population norms shall prevail.

  **4. Worked Examples**  
  *Example 1: Acquired Condition with Documented Baseline*  
  - **Case**: Claimant with a history of running 5 km in 25 minutes (baseline) sustains a knee injury and can now only run 1 km in 10 minutes. Intervention: Surgery and physical therapy.  
  - **Determination**: **Restorative** (if projected to return to baseline).  

  *Example 2: Congenital Condition*  
  - **Case**: Claimant born with myopia (nearsightedness). Without correction, claimant's vision is 20/200. Population norm (10th percentile) for visual acuity is 20/40. Intervention: Corrective lenses to achieve 20/20.  
  - **Determination**: **Augmentative** (because 20/20 exceeds the 20/40 baseline set by the 10th percentile rule; see 3.2 and 3.4).  

  *Example 3: Preventing Decline*  
  - **Case**: Claimant with family history of early-onset Alzheimer's (mean onset age 55). Claimant is 50 and cognitively normal. Intervention: Prophylactic medication to delay onset by 5 years.  
  - **Determination**: **Protective** (if decline is expected within 12 months without intervention? No, because at age 50 the claimant is not imminently declining. Thus, **Elective**).  

  *Example 4: Beyond Population Norm*  
  - **Case**: Claimant with height at 5th percentile for age and sex. Intervention: Growth hormone therapy. Result: Height reaches 50th percentile.  
  - **Determination**: **Restorative** (because it returns to the population norm). However, if the same therapy results in height at the 90th percentile, it becomes **Augmentative**.  

  *Example 5: No Experienced Deficit*  
  - **Case**: Claimant with hyperthymesia (superior autobiographical memory) experiences distress due to excessive recall. Intervention: Medication to reduce recall to typical levels.  
  - **Determination**: **Restorative** (if typical levels are defined by population norms). But note: the claimant's baseline is superior. Without evidence of functional impairment, the intervention may be **Elective** because the claimant's baseline is above normal.  

  **5. Escalation**  
  Any case that does not clearly fit the above categories, or that involves a claimant whose baseline is within the typical population range but who seeks an intervention to prevent a future decline that is not medically expected within 12 months, must be referred to the Medical Necessity Review Committee.  

  *Example Referral Case*:  
  - **Case**: A 45-year-old claimant with normal age-related presbyopia (difficulty focusing on near objects) requests progressive lenses. The claimant's current vision is within typical range for age (able to read at 16 inches with +1.25 diopters). The lenses would improve near vision to the level the claimant had at age 20.  
  - **Action**: Refer to Committee. Rationale: The intervention would restore the claimant to a baseline that is not age-adjusted. Without an underlying pathology, the decline is age-typical and the intervention may be considered Elective.  
