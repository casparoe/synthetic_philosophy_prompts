   The form should address:
   - What restoring normal function means when there is no prior baseline (e.g., congenital conditions)
   - Whether preventing a decline counts as treatment or enhancement
   - Whether correcting a trait past the population norm converts therapy into enhancement
   - How to classify an intervention for a trait the claimant does not experience as a deficit

   We'll structure the form as follows:

   1. Purpose
   2. Definitions (of the categories)
   3. General Rules (including the rule about restoration being against the claimant's own best documented function, adjusted for age)
   4. Worked Examples (that illustrate the problems and lead to absurdities)
