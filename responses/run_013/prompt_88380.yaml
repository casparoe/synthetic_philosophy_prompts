prompt: |-
  Im a software engineer at a small game studio, nine of us, I do the engine and the tools. No philosophy background, so if I use the wrong words for any of this thats on me.

  We're making a time travel puzzle game, and before we started we put one thing in the trailer and in every interview: one timeline, no parallel universes, no do-overs, you can't branch history, whatever you do is what always happened. It started as a marketing line and now its a promise we can't walk back. The trouble is the writers and level designers keep pitching scenarios that I'm pretty sure break it, and when I push back we just argue in circles, because nobody can say what the promise actually commits us to. My lead asked me to write the rulebook so we stop having the same fight every week.

  What I need is a procedure, not an essay. Something a level designer can run on a pitch in about fifteen minutes with no physics: the questions to ask in order, what counts as a good enough answer to each, where it stops with a flat no, and where it hands the decision to a person because the question turned out to be about story or taste rather than logic. It has to survive the pitches we actually keep getting, which are:

  - the player goes back and kills their own ancestor, and the designer wants the gun to jam because the timeline refuses. Another designer says jamming is a cop-out and wants the player to succeed, with the game just continuing in a present where they were never born.
  - the player's whole motive is to stop the disaster in the last act, and the designer wants the reveal that the attempt is what starts it.
  - a puzzle where the code you need is left for you by your future self, plus a variant where nobody ever invented the code and it has no origin at all.
  - the player meets themselves, and their future self sets up the puzzle the player solves, which is also what taught the future self to do it.
  - a pitch where the only version of events that holds together requires the player's action to fail, but the player is holding a gun with full control of it. You can't render impossible.

  Then run it on two of them for real. One: the ancestor one. Two: our flagship level, the one the whole game got pitched on, where the player goes back and actually prevents the disaster. I have a bad feeling your procedure kills that level, and if it does I want you to say so plainly and tell me the cheapest rewrite that keeps the level, not the cheapest excuse to keep it.

  Two more things I need from it. The narrative lead signs off on story and I sign off on anything that touches the engine, so mark where the procedure is finished and where a person has to sign. And be straight with me about which steps are just our taste wearing a logic costume, and what the procedure can't settle at all. Related: my lead writer and my systems designer have been going at each other about this, writer says if there's only one consistent timeline then the player never actually chose anything and the whole game is a puppet show, designer says no, being consistent only rules out the actions that contradict themselves and leaves everything else free. I don't know which of them is right, and the rulebook needs to either take a side or be honest that for our purposes it doesn't matter. Don't send me a reading list or a list of films, I won't get to them.
reasoning: |-
  We are creating a rulebook for a time travel puzzle game with the core promise: "one timeline, no parallel universes, no do-overs, you can't branch history, whatever you do is what always happened."

  The goal is to have a procedure that level designers can run on a pitch in about 15 minutes to check if it violates the promise. The procedure must be a step-by-step set of questions that lead to a clear outcome (pass, fail, or needs human sign-off). We also need to mark where a narrative lead or engine sign-off is required.

  Key principles from the promise:
  - There is only one timeline.
  - The past cannot be changed in a way that creates a branch or alternative version.
  - The timeline must be consistent: events that happen in the past must have always been part of the timeline.

  Common pitfalls to avoid:
  - Creating a paradox (like a causal loop without origin or a contradiction).
  - Having an action that would change the past in a way that invalidates the action itself (e.g., killing your own ancestor before you were born).

  We are to test two pitches: the ancestor killing and the flagship level (preventing the disaster). We must be honest if the flagship level breaks the rules and suggest the cheapest rewrite if so.

  Additionally, we need to address the philosophical debate between the writer and systems designer: does the single timeline mean the player has no free will (puppet show) or only that actions must be consistent? The rulebook should take a side or state that it doesn't matter for our purposes.

  Let's break down the procedure.

  The Rulebook: "Single Timeline Consistency Check"

  Step 1: Identify the Time Travel Event
     - What is the action the player takes in the past?
     - What is the intended effect of that action?

  Step 2: Check for Direct Contradiction
     - If the action would prevent the player from having the ability to perform the action (e.g., killing an ancestor, destroying the time machine before the journey), then it is a direct contradiction and must be rejected. The timeline would not allow it because it would create an impossible situation (the player wouldn't exist to do the action). In such cases, the event cannot happen as described.

     Question: Does the action, if successful, directly cause a situation where the action could not have been performed? 
        - If yes, then the pitch fails. (This is a flat no.)

     Example: Killing your own ancestor. If successful, the player would never have been born and thus could not have traveled back to kill the ancestor. Therefore, the action cannot succeed. The gun jamming is one way to avoid the contradiction (the action fails). Alternatively, if the game continues in a present where the player was never born, that would require an alternate timeline (which we don't allow). So that option is invalid.

     How about the ancestor pitch?
        - Option 1 (gun jams): The action fails. This avoids the contradiction because the player doesn't succeed, so the timeline remains consistent. This is acceptable if we can explain the gun jamming without invoking a "timeline refusing" (which might sound like a sentient timeline). We could have a non-supernatural reason (e.g., the gun was faulty, or the ancestor was wearing armor). But note: the promise says "whatever you do is what always happened", so if the gun jammed in the past, then it always jammed. The player's attempt to kill the ancestor was always part of the timeline and it failed. So this is acceptable.

        - Option 2 (player succeeds and the game continues in a present without the player): This creates a branch (the player exists to do the killing but then doesn't exist). We don't allow branches. Also, if the player doesn't exist, then they couldn't have traveled back. This is a direct contradiction. Therefore, option 2 is invalid.

     So for the ancestor pitch: 
        - If the designer wants the player to succeed, that's a flat no.
        - If the designer has the gun jam (or the action fails for a non-paradox reason) and the timeline remains consistent (the player was born and the attempt happened but failed), then it passes.

  Step 3: Check for Causal Loops
     - Does the event involve information or an object that has no origin? (e.g., the code left by the future self that was never invented)
     - If so, that's a "bootstrap paradox". Our promise does not explicitly forbid causal loops, but it does require a single consistent timeline. A causal loop can be consistent if the information or object exists without an origin. However, this may break the "no parallel universes" if it implies an infinite loop with no start. But note: in a single timeline, a causal loop is self-consistent.

     Question: Does the event involve a causal loop (an event that causes itself)? 
        - If yes, then we must check if it is consistent (i.e., the loop holds without requiring an external origin). If it is consistent, then it is acceptable. But note: the promise says "no do-overs" and "one timeline", but a causal loop doesn't necessarily break that. However, we must be cautious because it might feel like a cheat.

     Example: The player leaves a code for their past self. The code has no origin because it was copied from the future. This is a bootstrap paradox. But in a single timeline, it is consistent: the code was always there, provided by the future self. The future self got it from their past, which was provided by their future self, and so on. There's no beginning, but it doesn't create a branch. So it is acceptable under our rules.

     However, the narrative lead might have concerns about the story (is it satisfying? does it make sense?). So we mark this as passing the logic check but requiring narrative sign-off.

     But note: the variant where "nobody ever invented the code and it has no origin" is exactly the bootstrap paradox. So if the procedure accepts causal loops, then it passes. If we don't want them, we must say so. The promise doesn't forbid them, so we'll allow them but note that they might be unsatisfying to some.

     Therefore, we allow causal loops as long as they are consistent. The procedure will pass them, but we flag for narrative sign-off because it's a story taste issue.

  Step 4: Check for Inevitability
     - This step addresses the scenario where the player's action in the past is the cause of the event they are trying to prevent (e.g., the attempt to stop the disaster starts it).
     - Question: Does the player's action in the past cause the very event they are trying to prevent? 
          - If yes, then this is a consistent timeline (the event was always caused by the player's attempt). So it does not break the rules. However, we must check that there is no contradiction: the player must have a reason to go back that is consistent. For example, they might have gone back because of the disaster, and then their actions cause it. This is a stable loop.

     Example: The player's motive is to stop the disaster, but the attempt is what starts it. This is acceptable. It's a common time travel trope (e.g., in the movie "12 Monkeys"). The timeline is consistent: the disaster happened because of the player's attempt, and the player attempted because they knew about the disaster. This is a causal loop but without a paradox because the event has a cause (the player) and the player's knowledge comes from the event. So it passes.

     However, note: the player never had a chance to prevent the disaster because their attempt causes it. This might lead to the "puppet show" argument. But the procedure is only about consistency. So we pass it, but we note that the narrative lead must sign off because it affects the story's meaning and player agency.

  Step 5: Check for Impossibility of Failure
     - In the pitch where the action must fail for the timeline to hold, but the player has full control (e.g., holding a gun and the only consistent timeline requires the gun to not fire), how do we handle it?
     - The rule: The timeline must be consistent. Therefore, if the action must fail for consistency, then in the game the action must fail. But we cannot force the player to fail arbitrarily. We must set up the circumstances so that failure is inevitable and consistent.

     Question: Is the failure of the action necessary for timeline consistency? 
          - If yes, then the action must fail. But we must have a plausible in-world reason for the failure (not "the timeline refuses"). The reason must be part of the consistent timeline (e.g., the gun jams because it was faulty, the target was protected, etc.). If the designer can provide such a reason, then it passes. If not, then it fails.

     Example: In the ancestor killing scenario, if the gun jams because it was old and poorly maintained, that's acceptable. But if the designer just says "the timeline prevents it" without an in-world mechanism, that breaks immersion and might be seen as a cop-out. So we require an in-world cause.

     Therefore, if the designer can provide a non-paradox, in-world reason for the failure, then it passes. Otherwise, it fails.

  Step 6: The Meeting Yourself Scenario
     - The player meets their future self, and the future self sets up a puzzle that the player solves, which teaches the future self to do it. This is a causal loop (bootstrap) for knowledge. 
     - Check: Is the loop consistent? Yes. The knowledge comes from the future self, who learned it from their past self (the player) when they were the future self. There's no origin, but it's consistent. So it passes.

     However, again, narrative sign-off is needed because it might feel circular and unsatisfying.

  Now, let's run the procedure on the two required pitches.

  Pitch 1: The ancestor killing.

     Step 1: Action: Player goes back and tries to kill their own ancestor.
     Step 2: Direct Contradiction? 
          - If successful, the player would not exist to perform the action. So the action cannot succeed. Therefore, the pitch must have the action fail. 
          - The designer wants either:
              Option A: Gun jams (fail) -> acceptable if there's a reason.
              Option B: Player succeeds and the game continues without the player -> invalid (branch and contradiction).

     Step 5: If the designer chooses Option A, we require an in-world reason for the failure (not "timeline refuses"). If they provide one (e.g., the gun was faulty, the ancestor was wearing a hidden vest, etc.), then it passes. Otherwise, it fails.

     Outcome: 
          - If the designer insists on success: flat no.
          - If the designer has the action fail with an in-world reason, then it passes (engine sign-off for the mechanism, and narrative sign-off for the story implications).

  Pitch 2: The flagship level - the player goes back and prevents the disaster.

     Step 1: Action: Player goes back and prevents the disaster.
     Step 2: Check for Direct Contradiction: 
          - Does preventing the disaster prevent the player from traveling back? 
          - The player traveled back because they knew about the disaster. If the disaster is prevented, then in the present there would be no disaster. But the player still traveled back? How?

          This is a problem: if the disaster never happened, then the player wouldn't have a reason to go back to prevent it. Therefore, the action of preventing the disaster would erase the motive for the action. This is a direct contradiction.

     Therefore, the pitch as described breaks the rules. It's a flat no.

     But note: the narrative lead and the whole team are attached to this level. We need the cheapest rewrite that keeps the level.

     Cheapest rewrite: 
          - Instead of preventing the disaster, the player's action is what causes the disaster to be less severe, or to happen in a way that is consistent with the known history. For example, the disaster still happens, but the player's actions save some people or alter the details so that the outcome is the same (e.g., the building still explodes, but the player moves a critical item so that the explosion is contained). 

          Alternatively, we can use the causal loop: the player's attempt to prevent the disaster is what causes it (as in the second common pitch). That would be consistent. So the rewrite is: the player goes back to prevent the disaster, but their actions inadvertently cause it. Then the level becomes about causing the disaster (which is what always happened). This keeps the level mechanics (the player goes back and does things) but changes the narrative.

          Another option: the disaster was never going to happen. The player goes back and discovers that the disaster was a hoax or a misunderstanding, and their presence is needed to set up the events that lead to the present (which includes the false belief in the disaster). But this might change the story.

     Given that the flagship level is about preventing the disaster, the most straightforward rewrite is to make the disaster inevitable and have the player's actions be part of the cause. Then the level is not about preventing it but about ensuring it happens as it always did (which might be a twist). This is the cheapest because the level design might not change much, only the narrative.

     So the rewrite: 
          - The player goes back to prevent the disaster, but their actions are the direct cause of it. For example, they trigger a mechanism while trying to disable it. The timeline remains consistent: the disaster happened because the time traveler was there.

     Now run the procedure on the rewritten pitch:

          Action: Player goes back and attempts to prevent the disaster, but causes it.

          Step 4: Inevitability: The player's action causes the event they were trying to prevent. This is consistent. The player's motive (to prevent) is based on their knowledge of the disaster, which was caused by their own actions. This is a stable loop. It passes.

          However, note that the player doesn't actually prevent the disaster. So the level's goal changes from "prevent" to "cause" (but unwittingly). The narrative lead must sign off on this because it changes the story.

     Therefore, the rewritten pitch passes the logic check.

  The Procedure Outline:

  We'll create a flowchart or step-by-step questions.

  1. **Identify the Action and Effect**: What does the player do in the past? What is the intended outcome?
     - If the effect would directly prevent the player from having done the action (e.g., by preventing their existence, their knowledge, or their ability to time travel), then go to step 2.
     - Else, go to step 3.

  2. **Direct Contradiction Check**:
     - The action must fail or be prevented by an in-world cause. Ask: "Can the designer provide a plausible, in-world reason why the action fails (without invoking the timeline as an active force)?" 
        - If yes: Pass to Step 5 (Narrative and Engine sign-off).
        - If no: Reject the pitch (flat no).

  3. **Causal Loop Check**: Does the event involve a causal loop (information or object with no origin)?
     - If yes: Note that causal loops are allowed if consistent. Pass to Step 5 (Narrative sign-off required because it might be unsatisfying).
     - If no: Go to step 4.

  4. **Inevitability Check**: Is the player's action the cause of the event they were trying to prevent (or alter)?
     - If yes: This is acceptable. Pass to Step 5 (Narrative sign-off required because it affects agency and story).
     - If no: Then the event is not causing a contradiction or loop. Go to step 5.

  5. **Final Checks and Sign-offs**:
     - The pitch has passed the logical consistency checks. However, we require:
          - Narrative Lead sign-off: Always required for story implications (even if logically consistent, the story might need adjustment).
          - Engine sign-off: If the pitch involves a mechanism (like a gun jamming, a machine failing, etc.), then the engine team must approve the implementation (to ensure it fits with the tools and engine).

     - Additionally, if the pitch required a forced failure (from step 2), the engine sign-off must include the implementation of the in-world reason.

     - If the pitch passed without any issues (no loops, no forced failure) and is a straightforward time travel event, then only narrative sign-off is required (unless it involves new engine features).

  Addressing the philosophical debate:

  The rulebook takes the side of the systems designer: consistency only rules out actions that would create a contradiction. The player is free to do anything that doesn't cause a contradiction. Therefore, the player has free will within the bounds of what is consistent. The timeline is fixed, but the player doesn't know the fixed timeline and makes choices. The fact that the timeline is fixed doesn't mean the player isn't making choices; it means that the choices they make are the ones that always happened.

  However, in the cases where an action must fail (like the ancestor killing), the player might feel railroaded. But that is a design challenge: make the failure feel natural and part of the world, not arbitrary.

  Therefore, the rulebook states: 
     "The single timeline does not mean the player lacks agency. It means that the player's actions must be consistent with the timeline. The player can attempt any action, but if that action would create a contradiction, it must fail for an in-world reason. The player's choices matter because they are the ones that complete the timeline. Without the player's actions, the timeline would not be what it is."

  But note: the rulebook is about consistency, not about philosophy. We state that the procedure ensures consistency, and the narrative handles the feeling of agency.

  Final Procedure:

  We'll write it as a list of questions:

  **Single Timeline Consistency Check Procedure**

  1. **Describe the time travel event**:
     - What is the player's action in the past?
     - What is the intended effect of that action?

  2. **Check for existence contradiction**:
     - If the intended effect would prevent the player's existence, knowledge, or ability to perform the time travel, then:
          a. The action must fail.
          b. There must be a plausible, in-world reason for the failure (e.g., a mechanical failure, an obstacle, etc.). 
          - If both (a) and (b) are satisfied, proceed to step 5.
          - If not, the pitch is rejected (flat no).

  3. **Check for causal loops**:
     - Does the event involve information or an object that is passed from the future to the past without an origin? 
          - If yes, note that this is a causal loop (bootstrap paradox) and is allowed. Proceed to step 5.

  4. **Check for self-fulfilling actions**:
     - Is the player's action the cause of an event they were trying to prevent or alter?
          - If yes, note that this is acceptable (consistent). Proceed to step 5.

  5. **Sign-offs**:
     - The pitch has passed the logical checks. Now requires:
          - Narrative Lead sign-off: Always required (for story implications and player experience).
          - Engine sign-off: Required if the pitch involves a new mechanic or a specific implementation (e.g., a gun jamming, a machine breaking) that needs to be built.

  Run on Pitches:

  Pitch 1: Ancestor killing.
     - Step 1: Action: shoot ancestor. Intended effect: kill ancestor.
     - Step 2: Killing ancestor would prevent player's existence -> contradiction. So action must fail with in-world reason.
          - Designer proposes gun jams. Reason: the gun was old and misfired. (Acceptable in-world reason). Proceed to step 5.
     - Step 5: Requires Narrative Lead sign-off (is it satisfying?) and Engine sign-off (implement gun jamming based on condition).

  Pitch 2 (original): Prevent the disaster.
     - Step 1: Action: player prevents the disaster. Intended effect: disaster never happens.
     - Step 2: If the disaster never happened, then the player wouldn't have gone back (no motive). Contradiction. 
          - The action must fail? But the designer wants it to succeed. Without a rewrite, it's a flat no.

     Rewrite: Player causes the disaster while trying to prevent it.
     - Step 1: Action: player attempts to prevent the disaster but causes it. Intended effect: prevent, but actual effect: cause.
     - Step 4: The action causes the event they were trying to prevent -> acceptable. Proceed to step 5.
     - Step 5: Narrative Lead sign-off (big story change) and Engine sign-off (if new mechanics).

  This rewrite keeps the level (the player still goes back and interacts with the disaster event) but changes the outcome and the narrative.

  Final note: The procedure cannot settle matters of taste (like whether a bootstrap paradox is satisfying) or narrative coherence. It only checks for logical consistency with the single timeline promise. The sign-offs are where the human judgment happens.
answer: |-
  ### Single Timeline Consistency Rulebook  
  **Purpose:** Quickly check if a time travel pitch violates our core promise ("one timeline, no branches, whatever you do is what always happened"). Use this procedure in order—stop and reject if a step fails. Takes ~15 mins.  

  ---

  #### **Procedure Steps**  
  1. **Identify the Player’s Action**  
     - *Question:* "What does the player *do* in the past?"  
     - *Good Enough Answer:* Concrete, specific action (e.g., "shoots ancestor," "disables reactor").  
     - *Reject If:* Action is vague (e.g., "changes history").  
     - *Sign-off Here:* None.  

  2. **Identify the Outcome**  
     - *Question:* "What is the *direct result* of the action in the past?"  
     - *Good Enough Answer:* Clear cause-effect (e.g., "ancestor dies," "reactor shuts down").  
     - *Reject If:* Outcome implies multiple realities (e.g., "now there are two timelines").  
     - *Sign-off Here:* None.  

  3. **Check for Self-Contradiction**  
     - *Question:* "Does the outcome prevent the player from existing, having knowledge, or performing the action?"  
       - *Sub-question:* "Could the player still exist/act identically if this *always* happened?"  
     - *Good Enough Answer:* "Yes" if outcome **doesn’t** erase player’s existence/knowledge/ability to act. "No" if it does.  
     - *Reject If:* Answer is "no" (e.g., killing ancestor erases player). **Flat no.**  
     - *Taste/Limits:* This step is pure logic. Rejecting here isn’t negotiable.  
     - *Sign-off Here:* None.  

  4. **Check for Unexplained Origins**  
     - *Question:* "Does anything in this scenario lack a cause or origin?"  
       - *Sub-question:* "Can every object/information be traced to a source *within* the timeline?"  
     - *Good Enough Answer:* "Yes" if everything has an origin (e.g., future self learned code from past events). "No" if not (e.g., code appears from nowhere).  
     - *Reject If:* Answer is "no" (e.g., bootstrap paradox with no origin). **Flat no.**  
     - *Taste/Limits:* Pure logic. No origin = violates "always happened."  
     - *Sign-off Here:* None.  

  5. **Resolve Forced Failure**  
     - *Question (if action must fail):* "Is there an *in-world reason* for failure that isn’t ‘time prevents it’?"  
     - *Good Enough Answer:* Plausible cause unrelated to time (e.g., "gun jams because it’s rusty," "security stops player").  
     - *Reject If:* Only reason is "timeline refuses" or equivalent. **Flat no.**  
     - *Taste/Limits:* "In-world reason" is a logic fence—prevents hand-waving.  
     - *Sign-off Here:* **Engine sign-off** (you) if mechanics are needed.  

  6. **Final Consistency Check**  
     - *Question:* "Can the entire scenario (past + present) be one self-consistent loop?"  
       - *Sub-question:* "Does the future *depend on* the past action, and vice versa?"  
     - *Good Enough Answer:* "Yes" if no loose ends (e.g., future self sets up puzzle because past self experienced it).  
     - *Reject If:* "No" (e.g., disaster is prevented with no ripple effects).  
     - *Taste/Limits:* Logic, but narrative can tweak details (e.g., *how* disaster starts).  
     - *Sign-off Here:* **Narrative Lead sign-off** (story impact).  

  ---

  #### **Run on Your Pitches**  
  **Pitch 1: Kill Ancestor**  
  1. **Action:** Player shoots ancestor.  
  2. **Outcome:** Ancestor dies → player never born.  
  3. **Self-Contradiction:** Yes (no player to time travel). **Reject successful outcome.**  
     - *If designer wants success:* **Flat no.**  
  4. **Unexplained Origins:** Not applicable.  
  5. **Forced Failure:** Designer proposes gun jams → Needs in-world reason (e.g., "gun misfires due to old ammo"). **Passes if reason given.**  
  6. **Consistency Check:** Player fails → timeline consistent. **Passes.**  
     - *Verdict:* **Allowed only if gun jams with in-world reason.**  
     - *Sign-offs:* Engine (you) for jam mechanic; Narrative for story.  

  **Pitch 2: Flagship Level (Prevent Disaster)**  
  1. **Action:** Player stops disaster in the past.  
  2. **Outcome:** Disaster never happens.  
  3. **Self-Contradiction:** Player’s motive was to stop disaster → but if it never happened, why did they travel back? **Contradiction → Reject.**  
     - *Your Bad Feeling Was Right:* **This pitch breaks the rules.** Flat no.  
  4. **Cheapest Rewrite (Keeps Level):**  
     - **Change outcome:** Player’s attempt *causes* the disaster (e.g., they trigger it while trying to disable it).  
     - *Why it works:* Consistent loop (disaster always happened because of player).  
     - *Cost:* Adjust narrative/dialogue; no new mechanics.  
     - *Rerun Procedure:*  
       - Action: Player tries to disable reactor.  
       - Outcome: Player accidentally triggers disaster.  
       - Self-Contradiction: Player still exists; motive intact (they tried). **Passes.**  
       - Consistency: Future self saw disaster → went back → caused it. Stable loop. **Passes.**  
     - *Verdict:* **Allowed with rewrite.**  
     - *Sign-offs:* Narrative (story twist); Engine (if new animations/VFX).  

  ---

  ### **Philosophical Debate: Puppet Show vs. Free Will**  
  - **The Rulebook’s Stance:**  
    - **Systems designer is right.** Consistency only forbids self-contradictory actions (e.g., killing your past self). Everything else is fair game.  
    - **Player agency exists:** They choose *how* to close loops (e.g., *how* to leave the code for their past self). The timeline is fixed, but the player discovers/executes their role freely.  
    - **Why it doesn’t matter for the procedure:** The rulebook enforces logic, not metaphysics. "Puppet show" is a narrative issue—handled in Narrative sign-off (Step 6).  

  - **Key Boundaries:**  
    - **Logic Only:** Steps 1-4 are objective (no origins/contradictions).  
    - **Taste in Disguise:** Step 5 ("in-world reason") is logic with a taste veneer—it blocks lazy writing but allows creativity.  
    - **Can’t Settle:** Emotional impact, player freedom perception. Narrative Lead owns this.  

  ---

  **Final Output for Pitches:**  
  - **Ancestor Pitch:** Passes if gun fails with in-world reason.  
  - **Flagship Pitch:** Fails as-is; rewrite to "player causes disaster" to pass.  
  **Use this, and no more weekly fights.**
