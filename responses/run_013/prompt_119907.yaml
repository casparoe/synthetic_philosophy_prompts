prompt: |-
  In most rich democracies, a proposed regulation has to be justified by an appraisal that expresses every expected effect in money and weighs the total against the cost. Where the effect passes through a market — a firm's outlay, a consumer's saving — the analyst reads its value off prices and observed choices, on the principle that what people will give up for a thing is what the thing is worth to them. Where it does not — cleaner air, the survival of a species, a death the rule would prevent — the analyst falls back either on surveys that ask people what they would pay, or on a single per-unit figure that the state sets and applies to everyone alike, so that a death averted among the poor enters the ledger at exactly the value of a death averted among the rich. What I find odd is that this flat figure was itself originally extracted from market behaviour, from the wage premiums workers demand for dangerous work, and those premiums climb steeply with income — precisely the sensitivity the flat figure discards. Meanwhile, some analysts now propose to abandon money as the common currency altogether and to reckon all benefits in units of self-reported wellbeing. What theory of value does this apparatus presuppose? Does it commit itself to the view that a person's welfare simply is the satisfaction of the preferences their choices reveal, or does the income-blind, uniform figure betray a commitment to something else — a value that holds independently of what anyone would pay? Separate what the practice strictly requires from what it merely accommodates, and say where it is underdetermined: which parts would survive equally well on a hedonic account, a preference-satisfaction account, or an objective-list account of welfare? Where its parts pull against one another, is that a defect that better data would cure, or evidence that two incompatible theories of utility are being run under one name? And if we replaced the presupposed theory with one of its rivals, what in the practice — the surveys, the flat figure, the very insistence on a single money metric — would have to go?

  Answer as a numbered list of exactly five items, each a sentence or two, with no introduction and no conclusion.
reasoning: |-
  Hmm, the user presents a complex query about cost-benefit analysis in policy appraisal. They're asking about the underlying theory of value in regulatory frameworks where effects are monetized - especially regarding non-market goods like lives saved or environmental protection. The core tension seems to be between preference-satisfaction theory (revealed through market behavior/wage premiums) and what appears to be an egalitarian approach with uniform values.

  Key points I need to address:
  - The initial paradox where the "flat figure" for life valuation originates from income-sensitive wage premiums but gets homogenized
  - The shift toward wellbeing metrics
  - How different welfare theories (hedonic, preference-satisfaction, objective-list) interact with the practice
  - Whether internal contradictions reflect methodological flaws or deeper philosophical conflicts

  The user wants this analyzed through strict requirements vs accommodations, underdetermined aspects, and what would change if rival theories were adopted. They specifically request a numbered list of exactly five responses without intro/conclusion.

  Breaking this down:
  First point should establish the foundational commitment to preference-satisfaction theory via market behavior observation - that's clearly the bedrock. Second point needs to dissect the contradiction in the flat figure: its market-derived origin vs its application that ignores income differences. Third point must address how the wellbeing shift creates theoretical ambiguity. Fourth should analyze where the practice remains open to different welfare theories. Fifth has to explore the consequences of switching core theories - what elements would become incompatible.

  For the wellbeing proposal, I notice it creates theoretical ambiguity because self-reported wellbeing could align with either hedonic experiences or preference satisfaction, making the underlying commitment unclear. Regarding underdetermination, the monetization process itself could technically accommodate any welfare theory as long as effects are quantified, though the flat figure specifically resists preference-satisfaction. The internal tension between market-derived premiums and uniform application seems irreconcilable - better data won't fix this because it's fundamentally about whether values should track willingness-to-pay or be equalized.

  If we switched to pure preference-satisfaction theory, the uniform valuation would collapse immediately since it deliberately ignores income-based differences in revealed preferences. Conversely, adopting objective-list theory would make contingent valuation surveys questionable since they're grounded in subjective preferences rather than objective goods. The wellbeing metric might survive either theory but would need radical restructuring depending on which welfare concept it measured.

  I'll structure the response as five concise points covering these aspects while maintaining academic precision. The challenge is balancing depth with the two-sentence constraint per item.
answer: |-
  1.  The apparatus fundamentally presupposes a preference-satisfaction theory of welfare, as evidenced by its core reliance on market prices and observed choices to measure value, operating on the principle that revealed willingness-to-pay indicates worth.
  2.  The use of a uniform, income-blind monetary value for non-market goods (like a life saved) contradicts its preference-satisfaction foundation (since market-derived wage premiums show income sensitivity) and betrays a latent commitment to an egalitarian view that life has an inherent value independent of individual wealth or willingness-to-pay.
  3.  The proposal to use self-reported wellbeing as the common currency introduces significant theoretical ambiguity, as wellbeing units could be interpreted through hedonic (experienced happiness), preference-satisfaction (achieving desired states), or even objective-list lenses, leaving the apparatus's core welfare theory underdetermined at this point.
  4.  Strictly, the practice only requires the quantification and commensuration of effects into a single metric (money *or* wellbeing) for comparison; the monetization process itself is underdetermined, potentially accommodating hedonic, preference-satisfaction, or objective-list theories if effects can be translated into the chosen metric, though the flat figure specifically resists pure preference-satisfaction.
  5.  Replacing the presupposed preference-satisfaction theory with pure objective-list theory would necessitate abandoning contingent valuation surveys (which ask about preferences) and the market-behavior origin of the flat figure, while shifting to hedonic theory would require discarding the money metric itself in favor of direct wellbeing measurement and likely render the flat figure obsolete.
