  We are drafting a document for adversarial collaboration on the hole argument in general relativity, addressing both the substantivalist and relationalist perspectives, and considering a third structuralist option. The goal is to produce a document that both camps could endorse as a fair representation of the debate, with clarity on agreements, disagreements, and cruxes.

  The outline provided by the user is detailed and we will follow it step by step.

  ### 1. Joint Statement of the Argument

  We aim for a neutral statement that both sides can accept as a fair description of the setup and the problem.

  > **Joint Statement of the Hole Argument**
  >
  > Consider a solution to Einstein's field equations, which we call Model A, representing a spacetime that includes a bounded region (the "hole"). We then apply a smooth transformation (a diffeomorphism) to Model A that is the identity everywhere outside the hole but non-trivial within it. This yields a new solution, Model B. Both models satisfy the field equations and are mathematically distinct in the sense that the same manifold point (in the underlying coordinate-free description) is assigned different metric and matter field values in the two models. However, the two models agree completely on all physical properties outside the hole and at all times prior to the hole region (if we assume a time foliation).
  >
  > The argument then proceeds as follows:
  > - If we regard the manifold points as having primitive identities (i.e., identities independent of the fields defined on them), then Model A and Model B represent two physically distinct possibilities. Yet, the two models agree on the entire past (and outside) of the hole. This seems to imply that the field equations are indeterministic: the state of the universe up to a certain time does not determine the state inside the hole at later times.
  > - Alternatively, if we regard the manifold points as having no primitive identities, and instead see them as being individuated solely by the fields and relations they bear, then Model A and Model B are merely different representations of the same physical situation. In this case, the indeterminism is only apparent, and the argument dissolves.
  >
  > The argument does not establish that general relativity is indeterministic, nor does it claim that the two models are empirically distinguishable. The core issue is whether the mathematical distinctness of the models corresponds to physical distinctness.

  ### 2. Agreed Claims

  We list what both sides can agree on.

  > **Agreed Claims**
  >
  > 1. **Formalism and Mathematics**: The mathematical setup of the hole argument is uncontroversial. Given a solution (Model A) and a hole diffeomorphism (as defined above), we can construct Model B. Both models are solutions to the field equations and are mathematically distinct in the sense that the metric tensor and matter fields at each manifold point are different in the two models (when comparing the same point in the underlying manifold).
  > 2. **Empirical Indistinguishability**: No experiment, even in principle, can distinguish between Model A and Model B. Any measurement is of relations (e.g., distances, times, causal structure) which are identical in the two models when we compare the same physical events (regardless of how we label them).
  > 3. **What the Models Share**: The two models are isomorphic as Lorentzian manifolds. They have the same global causal structure, the same geodesics (when considered as curves up to their parameterization), and the same invariant scalars (e.g., curvature scalars). In particular, they agree on all physical properties outside the hole and in the past of the hole (if a time function is given).
  > 4. **What the Models Do Not Share**: The assignment of the metric and matter fields to the underlying manifold points within the hole is different. In Model A, a particular manifold point p has field values F(p); in Model B, the same manifold point p has field values F'(p) which are different from F(p). However, note that in Model B, the field values at p are the same as the field values at a different point q in Model A (where q is the image of p under the diffeomorphism). Thus, the disagreement is about which field values are assigned to which points.
  > 5. **Progress**: A resolution of the hole argument would require clarifying the ontological status of spacetime points and the nature of determinism in generally covariant theories. Progress would also involve a clear account of how the theory represents physical possibilities without overcounting.

  ### 3. Residual Disagreements

  We state each disagreement in two ways and then provide a table.

  > **Residual Disagreements**
  >
  > We have two main disagreements, each stated from the two perspectives.
  >
  > **Disagreement 1: The Nature of Spacetime Points**
  > - *First Camp (Substantivalist) Wording*: Spacetime points are real individuals with primitive identities. They exist independently of the fields and relations that hold among them. Therefore, the two models represent two distinct physical possibilities because they assign different properties to the same spacetime points in the hole.
  > - *Second Camp (Relationalist) Wording*: Spacetime points are not real individuals with primitive identities. They are merely nodes in a relational network, individuated entirely by the fields and relations. Therefore, the two models represent the same physical possibility because they describe the same pattern of relations, just with different labels for the points.
  >
  > *What turns on this*: If the first camp is right, then general relativity faces an indeterminism problem. If the second camp is right, the hole argument is resolved by recognizing that the models are physically equivalent.
  >
  > **Disagreement 2: Determinism**
  > - *First Camp (Substantivalist) Wording*: Determinism requires that the entire physical state at one time (including the identities of the points and the fields at those points) uniquely determines the physical state at later times. Since the two models agree on the past but disagree on the future in the hole, determinism fails.
  > - *Second Camp (Relationalist) Wording*: Determinism requires that the physical state (understood as the pattern of relations) at one time uniquely determines the pattern of relations at later times. Since the two models have the same pattern of relations (they are isomorphic), they represent the same physical state at all times, so there is no failure of determinism.
  >
  > *What turns on this*: The first camp sees a threat to determinism that must be addressed (perhaps by modifying the theory or accepting indeterminism). The second camp sees no threat and takes the hole argument as a reason to reject primitive identities for points.
  >
  > **Disagreement 3: The Status of the Third Position (Structuralism)**
  > - *First Camp (Substantivalist) Wording*: The structuralist position, which denies primitive identity but still believes in spacetime points as real entities (individuated by structure), is unstable. It collapses into relationalism because if points are only individuated by structure, then a relocation of the entire structure (via a diffeomorphism) does not change the physical situation. Moreover, without primitive identity, we cannot say that the point p in Model A is the same as the point p in Model B, so the models must represent the same physical world.
  > - *Second Camp (Relationalist) Wording*: The structuralist position is a version of relationalism. It is stable and coherent: points are real but their identities are fixed by their structural roles. Since the hole diffeomorphism preserves all structural roles (it is an automorphism of the structure), the two models represent the same physical situation. Thus, structuralism is a relabeling of relationalism and dissolves the hole argument in the same way.
  >
  > *What turns on this*: If structuralism is a distinct third position, it might offer a middle ground. But if it collapses into relationalism, then the debate is binary.
  >
  > **Table of Disagreements**
  >
  > | Question at Issue | First Camp (Substantivalist) Position | Second Camp (Relationalist) Position | What Changes if First Camp Wins | What Changes if Second Camp Wins |
  > |-------------------|----------------------------------------|----------------------------------------|---------------------------------|--------------------------------|
  > | Spacetime points have primitive identities? | Yes: points are individuals with primitive identity. | No: points are individuated by relations. | Substantivalism is vindicated; indeterminism must be addressed. | Relationalism is vindicated; hole argument dissolves. |
  > | Determinism in GR? | Violated: same past leads to distinct futures (same points, different fields). | Upheld: same past pattern leads to same future pattern. | GR is seen as indeterministic unless modified. | GR is deterministic under relational understanding. |
  > | Is structuralism a stable third option? | No: it collapses into relationalism. | Yes: it is a form of relationalism. | The debate remains binary. | The debate remains binary (with structuralism as a variant of relationalism). |

  ### 4. The Cruxes

  We list the key sub-questions that could move the debate.

  > **Cruxes**
  >
  > 1. **Crux 1: What is the correct notion of determinism?**
  >    - *Case that bears on it*: Determinism is a physical doctrine about whether the past determines the future. We must decide whether it is about the identity of points (substantivalist) or about the pattern of relations (relationalist). The hole argument forces us to clarify.
  >    - *First Camp Prediction*: If determinism requires point identity, then GR is indeterministic. If not, then it might be saved. But we hold that point identity is necessary for a full description of the physical state.
  >    - *Second Camp Prediction*: Determinism is about patterns. The hole argument shows that requiring determinism at the level of points is misguided because points are not physically real apart from the pattern.
  >
  > 2. **Crux 2: Do spacetime points have primitive identities?**
  >    - *Case that bears on it*: In the hole argument, the same point p has different fields in the two models. The question is whether p's identity is fixed independently of the fields. If not, then p in Model A is not the same as p in Model B (because the fields define the point). The argument then dissolves.
  >    - *First Camp Prediction*: Without primitive identities, we lose the ability to say that an event happens at a particular point in spacetime. This leads to a loss of objectivity in localization.
  >    - *Second Camp Prediction*: Primitive identities are unobservable and lead to indeterminism. The only way to save determinism is to drop them.
  >
  > 3. **Crux 3: Is the structuralist position distinct?**
  >    - *Case that bears on it*: Structuralism holds that points are real but have no identity beyond their structural roles. The hole diffeomorphism is an automorphism that preserves all structural roles. Therefore, the two models are structurally identical. But does that mean they are the same? The structuralist says yes. The substantivalist says: without primitive identity, structuralism is just relationalism in disguise.
  >    - *First Camp Prediction*: Structuralism is not stable. If you deny primitive identity, then two isomorphic models must represent the same world, so structuralism collapses into relationalism.
  >    - *Second Camp Prediction*: Structuralism is a coherent variant of relationalism. It is stable and avoids the hole argument.
  >    - *Verbal Note*: The disagreement about structuralism may be partly verbal. The underlying non-verbal question is: can we have spacetime points as real entities without primitive identities? The relationalist says that without primitive identities, the points are not real in the way the substantivalist thinks. The structuralist wants to say they are real but structurally defined. This might be a matter of terminology about "real". The non-verbal core is whether the structure alone (without primitive identities) can support the reality of points. Both camps agree that if points are real with primitive identities, then the hole argument shows indeterminism. Both also agree that if points are not real (or are only structural), then the hole argument is resolved. The structuralist position is an attempt to have the reality of points without primitive identities. The crux is whether that is coherent and distinct.
  >
  > 4. **Crux 4: What is the ontology of spacetime?**
  >    - *Case that bears on it*: The hole argument forces us to say what spacetime is. Is it a container (substantivalism) or a network of relations (relationalism)? The mathematical formalism of GR uses a manifold, but that does not dictate the interpretation.
  >    - *First Camp Prediction*: Without spacetime as a substance, we cannot account for the possibility of empty space or the identity of points in different possible worlds.
  >    - *Second Camp Prediction*: Spacetime as a substance is an unnecessary metaphysical posit. All physical content is captured by the relations.

  ### 5. Self-Undermining Evidence

  > **Self-Undermining Evidence**
  >
  > - **First Camp (Substantivalist)**: They would accept as counting against their view if a coherent and deterministic interpretation of GR without primitive identities were shown to be empirically adequate and metaphysically parsimonious. They would not be moved by mathematical arguments that do not address the physical reality of points (e.g., if someone merely asserts that the points are just labels without showing how that avoids indeterminism).
  >
  > - **Second Camp (Relationalist)**: They would accept as counting against their view if a concrete experiment could be devised that, in principle, requires the ascription of primitive identities to points to explain the result. They would not be moved by the charge that relationalism cannot account for the hole argument without determinism, because they argue that determinism is preserved under their view.
  >
  > - **Neither Camp** would be moved by purely mathematical results about the existence of multiple models, because the disagreement is about the interpretation of those models.

  ### 6. Discrete Toy Analogue

  > **Discrete Toy Analogue**
  >
  > Consider a finite graph G = (V, E) with vertices V and edges E. We assign labels to the edges (representing, say, a "distance" or a "relation strength"). The analogue of a solution is a particular labeling L of the edges. An automorphism of the graph is a permutation σ of V that preserves the graph structure (if (u,v) is an edge, then (σ(u),σ(v)) is an edge) and the labeling (if the edge (u,v) has label l, then the edge (σ(u),σ(v)) has the same label l). But note: in the hole argument analogue, we want a transformation that is the identity on a subset and non-trivial on another. However, in a finite graph, automorphisms are global. So we must adjust.
  >
  > **Setup**: Divide the graph into two parts: a fixed outer region (a subset of vertices V_outer) and a hole (a subset V_hole). We require that the automorphism be the identity on V_outer and non-trivial on V_hole. But note: if there is an automorphism that fixes V_outer pointwise and moves points in V_hole, then the graph has a symmetry that allows such an automorphism. This is not generally true for arbitrary graphs. So we assume the graph has a non-trivial automorphism that fixes V_outer and permutes V_hole.
  >
  > Then, given a labeling L, we can define a new labeling L' by: for each edge (u,v), let L'(u,v) = L(σ^{-1}(u), σ^{-1}(v)). However, note that if the labeling is symmetric under the automorphism, then L' = L. To get a distinct labeling, we must have a labeling that breaks the symmetry. So we assume L is not invariant under σ. Then L' is a distinct labeling but isomorphic to L via σ.
  >
  > **The Argument in the Discrete Case**:
  > - The two labelings L and L' assign the same labels to edges in the outer region (because σ fixes V_outer). But they assign different labels to edges in the hole (if we consider the same pair of vertices). However, note that in L', the edge (u,v) has the label that the edge (σ^{-1}(u), σ^{-1}(v)) had in L. Therefore, the pattern of labels is the same in the sense that there is a one-to-one mapping (the automorphism) that preserves the entire structure.
  >
  > **Reappearance of the Argument**: 
  > - If we take the vertices as having primitive identities, then L and L' are two distinct assignments: the same pair of vertices (u,v) has different labels in L and L'. But they agree on all edges that do not involve the hole? Not exactly: an edge between two vertices in the hole is changed, and an edge between a vertex in the hole and one in the outer region might also be changed if the automorphism moves the hole vertex. So if we require that the automorphism fixes V_outer pointwise, then edges within V_outer and between V_outer and V_hole (if any) are fixed? Actually, if σ fixes each vertex in V_outer, then for an edge (u,v) with u in V_outer and v in V_hole, σ fixes u and moves v to σ(v) (which is in V_hole). Then L'(u,v) = L(σ^{-1}(u), σ^{-1}(v)) = L(u, σ^{-1}(v)). Since v is moved by σ, this is not necessarily equal to L(u,v). But note: in the original model, the label for (u, σ^{-1}(v)) is assigned. In the new model, the same pair (u,v) gets that label. But if we are comparing the same pair of vertices, then the label changes. However, the entire structure is isomorphic via σ.
  >
  > **Leibniz Equivalence in Discrete Case**: 
  > - The claim that isomorphic models represent the same physical situation has a clean counterpart: two labeled graphs that are isomorphic (i.e., related by a vertex permutation that preserves edges and labels) represent the same physical world. This is Leibniz equivalence. In the discrete case, it is straightforward: if we consider the graph structure and the labels, then any two isomorphic graphs are identical for all physical purposes.
  >
  > **Does Discreteness Help?**:
  > - The hole argument reappears in the discrete case if we have a graph with a non-trivial automorphism that fixes an outer region. Then we can generate two distinct labelings (if the labeling breaks the symmetry) that are isomorphic. The argument then parallels the continuum case.
  > - The position that points (vertices) have no primitive identity becomes very natural in the discrete case: we can define the graph up to isomorphism. In fact, in graph theory, we often consider graphs as defined up to isomorphism. This makes it easier to state the relationalist view: the physical world is the isomorphism class of the labeled graph. Then the two labelings are in the same isomorphism class, so they represent the same physical world. Thus, the hole argument dissolves.
  > - The substantivalist in the discrete case would insist that the vertices have primitive identities. Then the two labelings are distinct because the same vertex pairs have different labels. But then we face the same indeterminism: the outer region does not determine the labeling in the hole. However, in a discrete setting, it might be easier to see that the automorphism is just a relabeling and does not change the physical relations. Thus, the relationalist view seems more compelling in the discrete case because we can explicitly list all the relations and see that they are the same under the automorphism.

  ### Conclusion
  The document has been drafted as requested, following the user's structure. We have flagged where the debate is verbal (e.g., about structuralism) and where it is substantive. The discrete analogue shows that the hole argument reappears but that relationalism becomes more natural when we can work with finite structures and explicit isomorphisms.
answer: |-
  ### Joint Document on the Hole Argument  
  **Authored by Adversarial Collaboration Between Substantivalist and Relationalist Camps**  

  ---

  #### 1. Joint Statement of the Hole Argument  
  Both camps accept the following as a neutral description of the argument:  
  > Consider a globally hyperbolic spacetime manifold \(\mathcal{M}\) with metric \(g\) and matter fields \(\phi\), jointly satisfying Einstein’s field equations (a "model" \(\mathcal{S} = (\mathcal{M}, g, \phi)\)). Let \(\mathcal{H} \subset \mathcal{M}\) be a bounded spacetime region ("the hole"), and let \(d\) be a diffeomorphism that acts as the identity everywhere outside \(\mathcal{H}\) but non-trivially inside it. Applying \(d\) yields a second model \(\mathcal{S}' = (\mathcal{M}, d^*g, d^*\phi)\). Both \(\mathcal{S}\) and \(\mathcal{S}'\) satisfy the field equations.  
  >   
  > **Agreed observations**:  
  > - \(\mathcal{S}\) and \(\mathcal{S}'\) agree on all physical properties *outside* \(\mathcal{H}\) (e.g., curvature scalars, causal structure).  
  > - \(\mathcal{S}\) and \(\mathcal{S}'\) are *mathematically distinct*: For a point \(p \in \mathcal{H}\), \(g(p) \neq d^*g(p)\) and \(\phi(p) \neq d^*\phi(p)\).  
  > - No experiment can distinguish \(\mathcal{S}\) from \(\mathcal{S}'\); all observable quantities (e.g., proper times, light-cone structures) are identical.  
  >   
  > **The argument**:  
  > If spacetime points in \(\mathcal{M}\) possess primitive identities (i.e., identities independent of the metric/fields), then \(\mathcal{S}\) and \(\mathcal{S}'\) describe two physically distinct situations. Since they share identical initial conditions (e.g., on a Cauchy surface prior to \(\mathcal{H}\)), the future state of the universe is underdetermined—threatening indeterminism. If spacetime points lack primitive identities and are individuated solely by relational structures, \(\mathcal{S}\) and \(\mathcal{S}'\) represent the same physical situation, and no indeterminism arises.  
  >   
  > **What the argument does NOT establish**:  
  > - That general relativity is indeterministic.  
  > - That \(\mathcal{S}\) and \(\mathcal{S}'\) are empirically distinguishable.  
  > - A refutation of either camp’s core position.  

  ---

  #### 2. Agreed Claims  
  Both camps endorse the following:  
  1. **Formalism**: The mathematical construction of \(\mathcal{S}\) and \(\mathcal{S}'\) via hole diffeomorphisms is uncontroversial.  
  2. **Empirical equivalence**: \(\mathcal{S}\) and \(\mathcal{S}'\) predict identical outcomes for all experiments. No measurement can reveal "which model is realized."  
  3. **Invariant structures**: \(\mathcal{S}\) and \(\mathcal{S}'\) share all diffeomorphism-invariant properties (e.g., curvature scalars, geodesic incompleteness, global topology).  
  4. **Non-invariant structures**: \(\mathcal{S}\) and \(\mathcal{S}'\) assign different metric/field values to the *same* manifold point \(p \in \mathcal{H}\) (when \(p\) is identified across models via the identity map).  
  5. **Indeterminism not yet settled**: The argument highlights a tension between determinism and the ontology of spacetime points; it does not resolve it.  
  6. **Progress criteria**: A resolution requires clarifying:  
     - The ontological status of manifold points.  
     - Whether determinism should be defined over physical situations or mathematical models.  
     - How to reconcile covariance with a coherent account of locality.  

  ---

  #### 3. Residual Disagreements  
  Each disagreement is stated in dual forms, followed by implications.  

  **Disagreement 1: Ontology of Spacetime Points**  
  - **Substantivalist wording**:  
    > "Spacetime points are substantial individuals with primitive identities. \(\mathcal{S}\) and \(\mathcal{S}'\) describe distinct possibilities because the same point \(p \in \mathcal{H}\) hosts different fields in each model. This reflects genuine physical indeterminism."  
  - **Relationalist wording**:  
    > "Spacetime points derive their identity from relational structures (metric/fields). \(\mathcal{S}\) and \(\mathcal{S}'\) are representations of the same physical situation; the diffeomorphism is a mere redescription. No indeterminism occurs."  
  - **What turns on this**: If substantivalism holds, indeterminism threatens general relativity’s coherence. If relationalism holds, the argument dissolves.  

  **Disagreement 2: Determinism**  
  - **Substantivalist wording**:  
    > "Determinism requires that initial data fix a unique future state *at each spacetime point*. Since \(\mathcal{S}\) and \(\mathcal{S}'\) agree outside \(\mathcal{H}\) but diverge inside, determinism fails."  
  - **Relationalist wording**:  
    > "Determinism requires that initial data fix a unique future *physical structure* (up to isomorphism). \(\mathcal{S}\) and \(\mathcal{S}'\) represent the same structure, so determinism holds."  
  - **What turns on this**: For substantivalists, determinism fails without modification to general relativity. For relationalists, determinism is preserved.  

  **Disagreement 3: Structuralism as a Third Option**  
  - **Substantivalist wording**:  
    > "Structuralism (points exist but lack primitive identity) collapses into relationalism. Denying primitive identity implies that isomorphic models describe the same world, so \(\mathcal{S}\) and \(\mathcal{S}'\) are physically identical."  
  - **Relationalist wording**:  
    > "Structuralism is a relabeling of relationalism. It stably dissolves the hole argument by treating points as structural roles, not individuals."  
  - **What turns on this**: If structuralism collapses into relationalism, the debate is binary. If it is distinct, it might offer a middle ground (but both camps doubt this).  

  **Table: Disagreements and Implications**  
  | Question                     | Substantivalist View                          | Relationalist View                         | If Substantivalist Wins                  | If Relationalist Wins                 |  
  |------------------------------|-----------------------------------------------|--------------------------------------------|------------------------------------------|---------------------------------------|  
  | Do points have primitive identity? | Yes: points are fundamental individuals.      | No: points are structural roles.           | Indeterminism is real; GR may need revision. | Hole argument dissolves; GR is deterministic. |  
  | Is determinism violated?     | Yes: same past, multiple futures (pointwise). | No: same past, unique future (structural). | GR is indeterministic at fundamental level. | GR is deterministic.                  |  
  | Is structuralism distinct?   | No: it reduces to relationalism.              | No: it is relationalism restated.          | No third option exists.                  | No third option exists.               |  

  ---

  #### 4. Cruxes  
  **Crux 1: What is the correct notion of determinism?**  
  - **Case bearing on it**:  
    Determinism is classically defined as "same causes, same effects." The hole argument forces a choice: should "same effects" mean same fields at same points (substantivalist) or same relational structures (relationalist)?  
  - **Substantivalist prediction**:  
    If determinism requires pointwise uniqueness, general relativity is indeterministic.  
  - **Relationalist prediction**:  
    If determinism is structural, general relativity is deterministic.  
  - **Verbal status**:  
    Partly verbal. The non-verbal core is: *Can two isomorphic models represent distinct physical situations?*  

  **Crux 2: Do spacetime points have primitive identities?**  
  - **Case bearing on it**:  
    If points have primitive identities, relabeling them via diffeomorphisms creates new physical possibilities. If not, relabeling is gauge.  
  - **Substantivalist prediction**:  
    Rejecting primitive identities undermines local causality (e.g., "where" an event occurs).  
  - **Relationalist prediction**:  
    Primitive identities are unobservable and generate pseudo-problems (e.g., fake indeterminism).  
  - **Verbal status**:  
    Substantive. Turns on whether "identity" requires more than structural relations.  

  **Crux 3: Can structuralism be distinct from relationalism?**  
  - **Case bearing on it**:  
    Structuralists claim points are real but identity-less. Yet if all properties are structural, permuting points (via \(d\)) changes nothing physical.  
  - **Substantivalist prediction**:  
    Structuralism is inconsistent: "real but identity-less points" are incoherent.  
  - **Relationalist prediction**:  
    Structuralism is identical to relationalism; the label "structuralism" is cosmetic.  
  - **Verbal status**:  
    Verbal. The disagreement is about the definition of "real" (primitive identity vs. structural existence).  

  **Crux 4: What counts as "physical" indeterminism?**  
  - **Case bearing on it**:  
    Is indeterminism physical only if observable? Or is formal underdetermination (in models) sufficient?  
  - **Substantivalist prediction**:  
    Indeterminism is a formal property of theories; observability is secondary.  
  - **Relationalist prediction**:  
    Indeterminism requires empirical underdetermination; formal underdetermination is gauge.  
  - **Verbal status**:  
    Substantive. Turns on whether metaphysics is constrained by observability.  

  ---

  #### 5. Self-Undermining Evidence  
  **Substantivalist commitments**:  
  - *Would count against their view*: A coherent interpretation of general relativity that denies primitive identities, resolves the hole argument, *and* preserves locality without indeterminism.  
  - *Would not move them*: Mathematical proofs that isomorphic models are "equivalent" (they reject this as question-begging).  

  **Relationalist commitments**:  
  - *Would count against their view*: An experiment requiring non-structural identities (e.g., detecting "which point" is which in an empty universe).  
  - *Would not move them*: Arguments that "common sense" supports point identities (they reject appeals to intuition).  

  **Neither camp would be moved by**:  
  - New mathematical formulations of general relativity that preserve the hole diffeomorphism.  
  - Claims that quantum gravity will resolve the issue (both agree this is speculative).  

  ---

  #### 6. Discrete Toy Analogue  
  **Setup**:  
  - Replace \(\mathcal{M}\) with a finite graph \(G = (V, E)\).  
  - Replace the metric with edge labels \(L: E \to \mathbb{R}\) (e.g., "distance").  
  - A "model" is a labeled graph \(\mathcal{G} = (V, E, L)\).  
  - Analogue of diffeomorphism: A graph automorphism \(\sigma: V \to V\) that permutes vertices but preserves edges and labels (i.e., \((u,v) \in E \iff (\sigma(u),\sigma(v)) \in E\) and \(L(u,v) = L(\sigma(u),\sigma(v))\)).  
  - "Hole" analogue: A subset \(H \subset V\) where \(\sigma\) is non-trivial, but \(\sigma\) acts as identity on \(V \setminus H\).  

  **The argument reappears**:  
  - Construct \(\mathcal{G}\) and \(\mathcal{G}' = \sigma(\mathcal{G})\) (relabeling vertices via \(\sigma\)).  
  - \(\mathcal{G}\) and \(\mathcal{G}'\) are isomorphic: Same graph structure, same labels.  
  - *If vertices have primitive identities*: \(\mathcal{G}\) and \(\mathcal{G}'\) assign different labels to the *same* vertex pairs in \(H\) (e.g., edge \((u,v)\) has label \(L(u,v)\) in \(\mathcal{G}\) but \(L(\sigma^{-1}(u),\sigma^{-1}(v))\) in \(\mathcal{G}'\)). This suggests underdetermination for the "hole" region.  
  - *If vertices lack primitive identities*: \(\mathcal{G}\) and \(\mathcal{G}'\) are identical; \(\sigma\) is a redescription.  

  **Leibniz equivalence in discrete setting**:  
  - "Isomorphic models describe the same physical situation" becomes: Labeled graphs are physically equivalent if isomorphic. This is uncontroversial for relationalists.  
  - **Does discreteness help?**  
    - *Easier for relationalists*: In finite graphs, "individuation by structural role" is explicit. Vertices can be uniquely identified by their graph-theoretic properties (e.g., degree, distances) if there are no symmetries. When automorphisms exist, vertices are indistinguishable—no primitive identity needed.  
    - *Harder for substantivalists*: Defending primitive vertex identities in symmetric graphs (e.g., two vertices with identical neighborhoods) appears unmotivated.  
  - **Stability of "no primitive identity"**:  
    - Discrete structures make it easier to state: Vertices are *defined* by their relational properties. If \(\sigma\) is an automorphism, \(\sigma(v)\) is indistinguishable from \(v\).  
  - **Conclusion**: The hole argument reappears but strengthens relationalism. Discreteness clarifies that automorphisms are redundancies, not physical alternatives.  

  ---

  ### Document Notes  
  - **Straining for neutrality**: Section 3 (Disagreements) risks vacuity when describing structuralism. Both camps agree it reduces to relationalism, so the "third option" is verbal.  
  - **Verbal disagreements**: Crux 1 (determinism) and Crux 3 (structuralism) are partially verbal. The non-verbal core is whether physical situations require individuating points beyond their structural roles.  
  - **Key insight from toy model**: Discreteness does not resolve the debate but makes relationalism more intuitive by reducing spacetime to a combinatorial structure with explicit automorphisms.
