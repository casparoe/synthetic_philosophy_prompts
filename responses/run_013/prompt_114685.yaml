  We are drafting a joint statement for two adversarial collaborators: the Pattern Realist (PR) and the Naturalist (N). We aim to clarify agreements, disagreements, and cruxes, with a focus on hard cases.

  ### (a) Jointly Agreed Claims

  Both parties agree on the following:

  1. **The Three Stances**: 
     - The **physical stance** explains and predicts behavior by reference to the physical constitution and the laws of physics.
     - The **design stance** explains and predicts behavior by attributing functions and purposes to a system (or its parts), assuming it was designed to fulfill those functions.
     - The **intentional stance** explains and predicts behavior by attributing beliefs, desires, and rational agency to a system.

  2. **Function of the Stances**:
     - Each stance is a predictive and explanatory strategy. They are tools that we adopt for pragmatic reasons, varying in effectiveness depending on the system and the context.

  3. **Epistemological Status**:
     - The physical stance is the most fundamental in the sense that it describes the underlying physical reality. However, both agree that for many systems (especially complex ones), the physical stance is computationally intractable or practically inaccessible for prediction and explanation.

  4. **Patterns and Compression**:
     - Patterns are real in the minimal sense that they are features of the data that allow for compression and prediction. Both agree that patterns are not illusions and are objective in the sense that they are discovered (not invented) by observers with the right perspective or tools.

  5. **Reality and Objectivity**:
     - The reality of a pattern is not merely subjective; it is objective in that it is independent of any individual's whim. However, the recognition and utility of a pattern may depend on the observer's goals and the descriptive framework.

  6. **The Intentional Stance and Folk Psychology**:
     - The intentional stance is highly effective for predicting the behavior of complex systems (like humans, animals, and some machines) and is indispensable in everyday life and social sciences. However, both agree that the intentional stance does not require that the system has intrinsic intentionality (in the sense of original or underived mental states) to be useful.

  7. **The Design Stance**:
     - The design stance is particularly useful for artifacts and biological systems that have evolved through natural selection. It allows for prediction without detailed physical knowledge.

  8. **Limits of the Physical Stance**:
     - The physical stance, while fundamental, is often too detailed to be practically useful for complex systems. Higher-level stances provide essential compression.

  ### (b) Disagreements Table

  | Issue | Pattern Realist (PR) Position | Naturalist (N) Position |
  |-------|-------------------------------|--------------------------|
  | **Criterion for Reality** | A pattern is real if it supports compression and prediction *relative to a purpose or a description language*. There is no further fact about which pattern is "really there" independent of a stance. | A pattern is real only if it is *projectible*, supports counterfactuals, and is *indispensable* to our best scientific theories. Mere compressibility relative to an arbitrary encoding is insufficient. |
  | **Autonomy of the Design Stance** | The design stance is autonomous and does not require reduction to the intentional stance. It can be applied without any attribution of beliefs or desires (e.g., to a thermostat). | The design stance is parasitic on the intentional stance because attributing functions and purposes implicitly relies on the intentional stance (i.e., the designer's intentions). However, for natural selection, the design stance is autonomous because it does not require a designer. |
  | **Status of Intentional States** | Beliefs and desires are real patterns in the same sense as centers of gravity: they are real because they allow compression and prediction. There is no stance-independent fact about whether they are "really there." | Beliefs and desires are not real in the same sense as fundamental physical entities. They are useful fictions (instrumental) that may be reduced to or explained by physical patterns. They are real only if they are indispensable in our best science (e.g., cognitive neuroscience) and support counterfactuals. |
  | **Thermostat Example** | The thermostat has a real pattern of "wanting" the temperature at 20 degrees. This pattern is real because it compresses the behavior of the thermostat and allows for prediction. | The thermostat does not literally want anything. The intentional stance here is a mere façon de parler. The reality of the pattern is only at the design or physical level. |
  | **Fundamental Ontology** | There is no fundamental ontology; reality is relative to the stance. The physical stance does not have a privileged ontological status. | The physical stance describes the fundamental ontology. Higher-level patterns are real only if they are projectible and indispensable in our best science (which is ultimately physical). |

  ### (c) Cruxes and Hard Cases

  We present several hard cases to test the positions. For each crux, we state the case, the question it raises, and what each side predicts.

  #### Crux 1: The Criterion of Pattern-Reality (Compressibility vs. Projectibility/Indispensability)

  **Case**: Consider a binary string that, when interpreted in one encoding (e.g., as a sequence of ASCII characters), appears random and incompressible. However, when interpreted in a different encoding (e.g., as a sequence of integers in base 3), it becomes a repetitive pattern (e.g., "121212..."). Both encodings are equally valid in that they are well-defined and can be used for prediction.

  **Question**: Is the repetitive pattern real? And if so, which one?

  - **PR Prediction**: Both patterns are real relative to their respective encodings. The reality is not in the string itself but in the pattern under a description. There is no fact about which pattern is "really there" independent of the encoding.
    
  - **N Prediction**: The pattern is real only if it is projectible and supports counterfactuals. If the string was generated by a process that is best explained by one encoding (e.g., the base-3 repetition) and that encoding is indispensable for predicting future outputs, then that pattern is real. The other encoding (which yields randomness) is not real because it is not projectible and does not earn its keep in our best science.

  **Agreed Bearing**: The case shows that compressibility alone is not sufficient. The Naturalist requires that the pattern must be projectible and indispensable. The Pattern Realist counters that projectibility and indispensability are also relative to a stance.

  #### Crux 2: Mutually Incompatible but Equally Compressive Descriptions

  **Case**: Two theories, T1 and T2, both compress the same set of data perfectly and are equally predictive within the observed range. However, they posit different entities and make conflicting predictions outside the observed range. For example, T1 might describe the motion of planets using epicycles, while T2 uses elliptical orbits.

  **Question**: Which theory posits real patterns?

  - **PR Prediction**: Both patterns are real relative to their own descriptive frameworks. There is no fact of the matter about which one is "really there" until we have a purpose that selects one over the other.

  - **N Prediction**: Only the pattern that is projectible and supports counterfactuals (and is indispensable in our best science) is real. In the case of epicycles vs. ellipses, the elliptical pattern is real because it supports counterfactuals (e.g., about what would happen if the sun's mass changed) and is indispensable in our current physics. The epicycle pattern is not real because it fails outside the observed range and is not part of our best science.

  **Agreed Bearing**: The case shows that compression alone cannot choose between theories. The Naturalist argues that only the projectible pattern is real. The Pattern Realist maintains that both are real patterns relative to their frameworks, but the Naturalist's projectibility is just a special case of compression for a particular purpose (science).

  #### Crux 3: Patterns that Fail Counterfactuals

  **Case**: A pattern that predicts well within the observed range but fails outside it. For example, a curve fits all existing data points but makes wildly wrong predictions for unobserved values.

  **Question**: Is this pattern real?

  - **PR Prediction**: The pattern is real for the purpose of predicting within the observed range. It is a real pattern relative to that purpose. However, for the purpose of extrapolation, it is not a good pattern. Reality is purpose-relative.

  - **N Prediction**: The pattern is not real because it does not support counterfactuals. A real pattern must be projectible beyond the actual data.

  **Agreed Bearing**: The Pattern Realist's criterion (compressibility) does not require projectibility, while the Naturalist's does. The case tests whether projectibility is necessary for reality.

  #### Crux 4: The Thermostat and the Chess Engine

  **Case A: Thermostat**  
  We describe the thermostat as "wanting" the temperature at 20 degrees. It has a simple feedback mechanism.

  **Question**: Does the thermostat literally have a desire?

  - **PR Prediction**: The pattern of "wanting" is real because it compresses the behavior and allows prediction. The thermostat's desire is as real as a center of gravity.

  - **N Prediction**: The thermostat does not have a desire. The intentional stance is a useful instrument but does not reflect a real pattern at the intentional level. The real pattern is at the design or physical level.

  **Case B: Chess Engine**  
  A chess engine that we describe as "believing" that it should control the center and "desiring" to checkmate.

  **Question**: Are these beliefs and desires real?

  - **PR Prediction**: Yes, they are real patterns because they support compression and prediction of the chess engine's moves.

  - **N Prediction**: They are not real in the same way as fundamental physical entities. They are real only if they are projectible and indispensable to our best science of the system. However, in the case of a complex chess engine, the intentional stance might be indispensable for prediction and thus real.

  **Agreed Bearing**: The Naturalist draws a line between the thermostat and the chess engine: the chess engine's intentional patterns might be indispensable and projectible, hence real, while the thermostat's are not. The Pattern Realist sees no difference in kind.

  #### Crux 5: The Design Stance and Intentional Stance

  **Case**: Consider a naturally occurring rock that happens to have a shape that fits a human hand perfectly. We can adopt the design stance and say it is "for" hammering. Alternatively, consider an artifact like a screwdriver, which is designed for turning screws.

  **Question**: Is the function "for hammering" in the rock real? And is the screwdriver's function real?

  - **PR Prediction**: The function is real relative to a purpose (e.g., if we are using it for hammering). The rock's function is real in that context. The screwdriver's function is also real.

  - **N Prediction**: The rock's function is not real because it is not projectible and not part of any scientific explanation (it's an accident). The screwdriver's function is real because it is projectible (it was designed for that purpose) and indispensable in explaining the screwdriver's existence and use.

  **Agreed Bearing**: The Naturalist requires that the function must be projectible and part of a scientific explanation (either by design or evolution). The Pattern Realist does not.

  ### Conclusion: Verbal Dispute?

  We agree that part of the dispute is verbal. Both sides use the word "real" but with different criteria:

  - The Pattern Realist uses "real" to mean *objectively useful for compression and prediction relative to a purpose or stance*. 
  - The Naturalist uses "real" to mean *projectible, supporting counterfactuals, and indispensable in our best scientific theories*.

  Thus, the Pattern Realist's "real" is broader and stance-relative, while the Naturalist's is stricter and tied to scientific practice. 

  However, the dispute is not entirely verbal because:

  1. The Pattern Realist denies that the physical stance has ontological priority, while the Naturalist asserts it.
  2. The Naturalist's criterion of indispensability in our best science might collapse the intentional and design stances into the physical stance (via reduction), which the Pattern Realist rejects.

  The Pattern Realist argues that the Naturalist's best science is just another stance, and its patterns are real only relative to that stance. The Naturalist argues that the Pattern Realist's criterion is too permissive and fails to capture what we mean by reality in a scientific context.

  The cruxes above are designed to test these differences. By examining the hard cases, we hope to clarify whether the Naturalist's stricter criterion is necessary and whether the Pattern Realist's relativity can be sustained without collapsing into anti-realism.

