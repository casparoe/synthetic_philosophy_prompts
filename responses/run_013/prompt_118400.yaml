prompt: |-
  I want to work out what I actually believe about everyday conventions — the ones that are neither laws nor obvious moral rules — and I would rather have a principle than a pile of verdicts. So I will set out my verdicts on a series of cases and ask you to find what, if anything, unifies them.

  Tipping. In the United States, leaving nothing for a sit-down server is wrong, and not merely stingy: I take the server to be relying on the tip in a way that makes withholding it a kind of taking. In Japan, where I understand tipping is simply not done, a visitor who leaves money on the table has done nothing wrong — caused a small flurry of confusion, perhaps, but wronged no one. Yet a Japanese visitor to the United States who does not tip has done something wrong, and I do not accept "it is not done at home" as an excuse.

  Escalators. Where I live the convention is that the left side belongs to people walking and the right to people standing. Standing on the left is a mild wrong; it obstructs people who are relying on the convention. A visitor who blocks the left side out of ignorance is, I think, still doing something wrong, though I blame them less for it.

  Jaywalking. Crossing against the light on an empty street at two in the morning is fine; I feel no pull at all to call it wrong. Crossing the same way in front of a class of children being taught how to cross is wrong, even though it endangers no one and no one is relying on my compliance.

  Conventions that have outlived their point. My club still expects members to rise when the secretary enters the room, a rule whose original purpose no one can now reconstruct. Failing to rise is not wrong, in my view; it is merely eccentric.

  Conventions that protect something visible. In a village where water is rationed by custom, a visitor who draws more than the local allotment because there is no such custom at home has done something wrong. The point of the rule is plain to anyone who looks.

  Conventions that are only about acknowledgment. Where one is expected to greet the shopkeeper on entering, a visitor who does not greet has, I think, done nothing wrong, whereas a resident who never greets anyone has committed a small wrong.

  The case I keep going back and forth on. A visitor cheerfully asks shopkeepers how they are doing without waiting for an answer, which in that country reads as insincere. The locals are genuinely offended. I cannot decide whether this is wrong, since they were offended and the convention was discoverable, or not wrong, since no one was harmed and the offense is the offense of a broken expectation rather than of an injury.

  I have a tentative principle, and I distrust it: a convention binds you exactly when it protects some discernible interest of a person present, or when compliance is plainly expected of you and costs you little. Please test it against the cases above. Say which verdicts it saves and which it forces me to give up; note that it seems to cut against my Japan verdict, since the local expectation there is that one will not tip, and not tipping costs the visitor nothing. Then tell me how it rules on the case I am undecided about, and on at least one further case of your own devising that pulls its two clauses apart. If a different principle, or a pair of principles dividing the labor, does better, I would prefer that — stated precisely, with the case that motivates each clause and an honest account of the verdicts it cannot accommodate.
reasoning: |-
  Okay, let me start by unpacking the user's query. They want a principle that unifies their judgments on various everyday conventions. The examples they provided cover tipping in different countries, escalator etiquette, jaywalking, outdated rules, resource customs, and greeting norms. There's also a tricky case about insincere greetings that they're unsure about. 

  First, I need to understand their tentative principle: conventions bind when they protect a discernible interest or when compliance is expected and low-cost. But in the Japan tipping case, not tipping costs the visitor nothing, yet they think it's wrong not to tip in the US. That's a conflict. The principle would say tipping isn't required in Japan since there's no interest protected and not tipping costs nothing, but the user believes a visitor not tipping in the US is wrong. So the principle doesn't fit here. 

  Looking at escalators, the user thinks blocking the left side is wrong even if the person is ignorant. The principle works here because obstructing walkers affects their interest in moving quickly. For jaywalking, crossing in front of kids is wrong not because of harm but because it undermines the teaching. The principle's interest clause fits if "interest" includes social coordination. 

  Outdated club rules—rising for the secretary—aren't binding because there's no discernible interest. The user agrees, so the principle holds. Water rationing protects a visible resource, so violating it is wrong. Greeting shopkeepers: visitors not greeting isn't wrong, but locals skipping it is a minor wrong. The principle's second clause (low-cost compliance) might explain locals, but why isn't the visitor bound? The interest isn't clear, so only the low-cost part applies to residents. 

  The undecided case: a visitor's insincere greeting offends locals. The principle's first clause (discernible interest) isn't met since no tangible harm. The second clause (compliance expected, low-cost) might apply since saying a proper greeting is low-effort. But the user is conflicted. The principle would say it's not wrong, but the offense might be more about broken expectations than injury. 

  Now, considering the "Discernible Interest Principle." It replaces "low-cost" with "relies on the convention for a discernible interest." For tipping in the US, servers rely on tips for livelihood, so it's binding. In Japan, no such reliance, so not tipping is fine. Escalators: walkers rely on the left side for efficiency. Jaywalking in front of kids: the teacher relies on compliance to teach properly. Outdated club rule: no one relies on rising, so not binding. Water rationing: villagers rely on fair distribution. Greetings: locals rely on greetings for social cohesion, but visitors aren't expected to know, so not bound. The undecided case: locals rely on sincere greetings for authentic interaction, so the visitor's insincere greeting violates that reliance, making it wrong. 

  Testing with a new case: a tourist driving on the wrong side in a left-driving country. Locals rely on consistent driving for safety, so it's wrong even if no accident occurs. Another case: dress code at a religious site. Even if the visitor doesn't share the faith, violating the dress code disregards the community's reliance on respect for their practices. 

  Does this principle cover all cases? The Japan tipping verdict aligns now. The undecided case is resolved by the reliance on social authenticity. The greeting norm for visitors still fits since they're not part of the reliance context. The escalator case with an ignorant visitor: they still obstruct those relying on the convention, so it's wrong, which matches the user's view. 

  Any gaps? Maybe conventions where there's no reliance but high expectation. But the user's cases seem covered. The key is discerning the interest through reliance, making the principle more consistent than the tentative one.
answer: |-
  Here's a precise principle unifying your verdicts, derived from your cases and resolving the tensions in your tentative one:

  **The Discernible Interest Principle:**
  *A convention creates a moral obligation for an agent if and only if:*
  1.  *The convention serves a discernible interest (material, functional, or social-coordinative) for a person or group present in the situation; AND*
  2.  *That person or group reasonably relies on compliance with the convention by agents in the agent's position (e.g., visitor, resident, user).*

  **How it works on your cases:**

  1.  **Tipping (US):** **Obligation.** (1) Discernible material interest of the server (livelihood). (2) Server reasonably relies on tips from customers.
  2.  **Tipping (Japan):** **No Obligation.** (1) No discernible interest served by tipping (causes confusion, not benefit). (2) No reliance – servers expect *no* tip.
  3.  **Escalators (Standing Left):** **Obligation (even for ignorant visitor).** (1) Discernible functional interest of walkers (efficient movement). (2) Walkers reasonably rely on others (any user) standing on the right. Ignorance doesn't negate reliance.
  4.  **Jaywalking (Empty Street):** **No Obligation.** (1) No discernible interest threatened (no one present). (2) No reliance possible (no one present).
  5.  **Jaywalking (In Front of Class):** **Obligation.** (1) Discernible social-coordinative interest of the teacher/children (effective pedagogy/social norm reinforcement). (2) Teacher reasonably relies on others modeling compliance for the lesson.
  6.  **Outdated Club Rule (Rising):** **No Obligation.** (1) *No discernible interest served* (original purpose lost, no current benefit). (2) No discernible reliance on compliance.
  7.  **Water Rationing (Village):** **Obligation (for visitor).** (1) Discernible material interest of villagers (fair resource distribution). (2) Villagers reasonably rely on *all* users (residents *and* visitors) complying to maintain the system.
  8.  **Greeting Shopkeeper (Resident):** **Obligation (minor).** (1) Discernible social-coordinative interest (acknowledgment, baseline social cohesion). (2) Shopkeeper reasonably relies on regular customers (residents) offering this basic courtesy.
  9.  **Greeting Shopkeeper (Visitor):** **No Obligation.** (1) Discernible social-coordinative interest exists. *BUT* (2) Shopkeeper does *not* reasonably rely on *unknown visitors* knowing or following this specific local greeting custom. Reliance is on the local community, not transients.

  **Your Tentative Principle vs. Discernible Interest Principle:**

  *   **Problem:** Your tentative principle ("protects interest OR expected + low cost") failed on Japan tipping. It suggested *no* obligation in Japan (correct) but *also* suggested *no* obligation in the US for a Japanese visitor (wrong, according to you), because "not tipping costs nothing." The "low cost" clause overrode the "discernible interest" in a way that conflicted with your verdict.
  *   **Resolution:** The Discernible Interest Principle fixes this by making *reliance* the key link between the interest and the agent's obligation, not low cost. The US server *relies* on the customer (any customer), regardless of origin. Cost is irrelevant to the *existence* of the obligation under this principle (though it might affect blame for violation).

  **The Undecided Case (Insincere Greeting):**

  *   **Verdict by Principle:** **Obligation (Minor Wrong).**
      *   (1) **Discernible Interest:** Locals have a social-coordinative interest in authentic interaction/sincerity norms. The offense stems from perceiving the breach as a dismissal of this shared value, not just a broken expectation.
      *   (2) **Reasonable Reliance:** Shopkeepers reasonably rely on *anyone initiating the greeting ritual* (which the visitor did) to follow through with its understood local form (waiting for an answer), as this is the basic local script for interaction. The visitor triggered the interaction governed by the convention.
  *   **Why not "No Obligation"?** While the visitor didn't intend harm and the offense might seem like "mere" broken expectation, the discernible interest in authentic interaction norms and the reliance triggered by the visitor's *choice to engage* create an obligation to engage properly. It's akin to starting a formal dance without knowing the steps – you've committed to the activity and thereby to its rules.

  **New Test Case: Pulling the Clauses Apart**

  *   **Scenario:** In a remote hiking area, there's a strong local convention that *all* hikers (resident or visitor) must pack out *all* trash, including biodegradable items like apple cores, to protect a fragile ecosystem from even minor disturbances and habituating wildlife. A visitor, seeing no immediate harm and knowing apple cores decompose at home, discards one. Locals are deeply upset, seeing it as disrespectful and damaging their conservation ethic.
  *   **Principle Analysis:**
      *   (1) **Discernible Interest?** **YES.** Clear material/ecological interest (protecting fragile ecosystem, preventing wildlife habituation).
      *   (2) **Reasonable Reliance?** **YES.** Locals reasonably rely on *all* hikers complying. The rule is prominently signed at trailheads. The ecosystem's fragility depends on universal compliance; one apple core *can* contribute to habituation and ecological shift.
  *   **Verdict:** **Obligation.** The visitor has done something wrong by violating the convention, despite the action seeming harmless in isolation and despite being a visitor. The discernible interest and reasonable reliance (on all users) create the obligation.
  *   **Counter-Scenario (Testing Reliance Limit):** Suppose the *only* reason for the "no apple cores" rule is an obscure local superstition about apples, with *no* ecological basis. Locals still rely on compliance and are offended.
      *   (1) **Discernible Interest?** **NO.** No material/functional/social-coordinative interest discernible to an outsider (just superstition).
      *   (2) **Reasonable Reliance?** **YES** (by locals).
      *   **Verdict:** **No Obligation.** Violation is merely eccentric or puzzling, not wrong. The reliance exists, but without the discernible interest clause, superstition alone doesn't create a moral obligation for the visitor. (This mirrors your "outdated club rule").

  **Strengths of the Discernible Interest Principle:**

  1.  **Unifies Cases:** Explains all your verdicts consistently, including Japan tipping and resolving your undecided case.
  2.  **Explains "Why Wrong?":** Focuses on harm to interests *through broken reliance*, not just offense or broken expectation alone.
  3.  **Handles Visitors/Residents:** Reliance defines who is obligated. Residents are usually part of the reliance community; visitors are obligated only when the reliance reasonably extends to them (e.g., using a shared resource, escalator, or initiating a conventional interaction).
  4.  **Distinguishes Eccentricity from Wrong:** Outdated rules lack a discernible interest, so non-compliance isn't wrong.
  5.  **Accommodates Social Interests:** Explicitly includes social-coordinative interests (teaching norms, acknowledgment, authentic interaction).

  **Limitations (Honest Account):**

  *   **"Discernible" is Subjective:** Requires judgment. What's discernible to one might not be to another (though "reasonable" reliance helps mitigate this). The water rationing interest is obvious; the social offense in the greeting case might be less so to an outsider.
  *   **Defining the "Group Present":** Can be fuzzy in large/public settings (e.g., is *every* walker on the escalator part of the group relying on *you* specifically? The principle assumes a general reliance on the convention by users).
  *   **Blame vs. Obligation:** While it establishes obligation, *blameworthiness* (as in your escalator case) depends on knowledge, intent, and cost – which this principle doesn't address. It only identifies the *existence* of the obligation.

  This principle captures the core of your judgments: conventions create obligations when they protect real interests and others are counting on you to uphold them within that specific context. It replaces the problematic "low cost" clause with the more fundamental concept of "reliance" linked directly to the discernible interest.
