prompt: |-
  I am a doctoral student putting together a prospectus chapter on privacy, and I have noticed that my whole method of evaluating accounts has been intuition-by-intuition: someone offers a control-based account, I test it against one case; someone offers an access-based account, I test it against another; nothing accumulates, because I have never written down what the accounts are supposed to deliver. Before I read any more of them, I want the specification on paper. What must a theory of privacy — a theory of what privacy is and of why, and whether, it matters — be able to do in order to count as adequate for the purposes of an applied-ethics seminar and a policy-adjacent readership? I am not asking for a survey of positions, a bibliography, or citations; I want the requirements list, each requirement stated as a requirement and each accompanied by the case or consideration that motivates it, together with your judgment about which requirements are non-negotiable and which are really preferences of a particular camp in disguise.

  Please build the list around the following, adding whatever I have missed. First, the cases the theory has to get right, including several I have been unable to resolve: a person watched through a window while doing nothing of the slightest interest, who is seen to be doing nothing of interest; a firm that logs everything about me but never has a human read the logs, using them only to improve a model that never outputs anything about me (call this the unread-ledger case); two neighbors who install cameras aimed reciprocally at each other's windows, so that each knows nearly everything about the other and neither is embarrassed by it; a fact that is about me and also about my sister — a genetic result, a pregnancy — where the question is whose privacy is even at stake, and whether the theory can locate the right-holder at all; information that was public when first posted, where the wrong, if there is one, lies in its resurfacing years later; and the familiar retort that only people with something to hide object to surveillance, which I cannot tell whether a theory should answer or dissolve. Second, the distinctions the theory must not collapse: privacy as against secrecy; a loss of privacy as against a violation of it; privacy as a state of affairs, a right, a claim, and a good; informational privacy as against physical, associational, and decisional privacy; the instrumental as against the non-instrumental value of privacy; and the privacy of an individual as against that of a group, a relationship, or a pair of people. Third, the considerations it must be consistent with, which I suspect do more constraining work than the cases do: that many people say they value privacy and behave as though they do not; that some losses of privacy are welcome, since intimacy and care consist partly in being known; that privacy admits of degrees without more always being better; that a surveillance arrangement can be fully disclosed and consented to and still be objectionable; and that some complaints we file under privacy look, on inspection, to be complaints about power or standing rather than about information. Fourth, an operational constraint: the account must yield something usable in cases like a care home installing cameras in residents' rooms or an insurer requesting wearable data, without collapsing into the claim that it all depends on local norms, and without reducing to the claim that whatever people report being upset by is thereby a violation.

  Finally, I want your view on the shape of the list itself, because I suspect that is where the real result is. If some subset of these requirements cannot be jointly satisfied, say which subset and why, and tell me which single requirement does the most work in excluding otherwise attractive accounts — I would rather learn that one requirement is doing all the excluding than receive a tidy list of ten. Flag any requirement you think I have included only because it is a prejudice of my own training, and note any place where a requirement is quietly presupposing a political or cultural commitment that ought to be argued for rather than assumed. I do not need the contenders scored against the finished list; I will do that part myself.
reasoning: |-
  Okay, the user is a doctoral student working on a prospectus chapter about privacy. They're frustrated because their current method of evaluating privacy theories feels disjointed—they test each account against different cases without a clear framework. They want a specification of what makes a privacy theory adequate, especially for applied ethics and policy contexts. 

  First, I need to unpack their core request. They provided four main areas: cases the theory must handle, distinctions it must maintain, considerations it must align with, and operational constraints. But deeper down, they're seeking coherence—a way to systematically assess theories without getting lost in fragmented intuitions. Their frustration with "nothing accumulates" suggests they want a structured evaluation rubric, not just a survey of ideas.

  The user also hints at meta-concerns. They suspect some requirements might be disguised preferences of academic camps, or that the list itself might have internal contradictions. That's insightful—they're aware of potential biases in how privacy is framed. Their demand to flag presupposed political commitments shows they want intellectual honesty, not just technical compliance.

  Looking at their cases: the "unread-ledger" and reciprocal surveillance scenarios challenge control-based theories. The genetic/pregnancy case tests relational aspects. The "nothing interesting" observation highlights that privacy violations can occur without sensitive content—this often trips up instrumental accounts. The "something to hide" retort is crucial because it forces the theory to justify privacy's intrinsic value beyond concealment of wrongdoing.

  For distinctions, secrecy vs privacy is foundational—collapsing them undermines theories that equate privacy with intentional hiding. The state/right/claim/good distinction matters for policy applications; a theory that can't separate descriptive from normative will struggle in ethics seminars. Group vs individual privacy is increasingly vital in data-driven contexts, so ignoring it would date the theory.

  The behavioral paradox (valuing privacy but not acting accordingly) is a key stress test. A good theory must explain this without dismissing self-reports or behaviors as irrational. The point about surveillance being objectionable despite consent targets transactional views of autonomy—this might exclude simplistic consent-based frameworks.

  Operationally, the wearable data example shows why "local norms" solutions fail: they can't critique power imbalances. The care home cameras case requires balancing dignity against safety—a theory must navigate this without relativism or reducing to subjective offense.

  Now the real challenge: identifying irreconcilable requirements. For example: 
  - If a theory must explain both the "nothing interesting" violation (which suggests intrinsic wrong) AND the behavioral paradox (where people trade privacy lightly), it strains against instrumental accounts. 
  - Maintaining all listed distinctions while delivering policy-useful guidance is hard—some conceptual nuance might sacrifice practicality. 
  - The "consented-but-objectionable" surveillance requirement conflicts with autonomy-centric views. 

  The most excluding requirement? Probably the "unread-ledger" case. It destroys theories that require human perception or specific harm for violations. If data collection without access or use isn't a privacy issue, the theory fails modern data ethics.

  Political presuppositions to flag: 
  - The whole framework assumes individualism isn't absolute (hence group/relational cases). But some libertarian views reject this. 
  - Requiring non-instrumental value presumes ethics beyond utilitarianism—should be argued, not assumed. 
  - The power/standing vs privacy distinction quietly assumes these aren't reducible to each other, which critical theorists might dispute.

  The user's hidden need might be confidence: they want to know their evaluation framework is robust before diving deeper. By exposing trade-offs and biases, we equip them to defend their methodology—which is the real doctoral milestone.
answer: |-
  Here is a requirements list for an adequate theory of privacy, structured around your framework, with motivations, non-negotiable status, and critical analysis of tensions or biases. The goal is a theory robust enough for applied ethics/policy, avoiding fragmentation or hidden assumptions.

  ---

  ### **I. Cases the Theory Must Resolve**  
  *(Non-negotiable: Core explanatory power)*  

  1. **The "Boring Observation" Case**:  
     *Requirement*: Explain why observing a person doing nothing interesting (e.g., staring at a wall) through their window can still violate privacy, even if no sensitive information is revealed.  
     *Motivation*: Challenges theories requiring "sensitive data" or "harm" for a violation. Suggests privacy is about *subjectivity* or *context*, not content.  

  2. **The "Unread Ledger" Case**:  
     *Requirement*: Explain why a firm logging exhaustive personal data without human access or individualized output (used only for model training) constitutes a privacy violation.  
     *Motivation*: Tests whether privacy requires *access/use* or is violated by mere *accumulation/control*. Excludes theories requiring "viewing" or "disclosure."  

  3. **Reciprocal Surveillance**:  
     *Requirement*: Explain why mutual, consensual surveillance between neighbors (e.g., cameras aimed at each other’s homes) might *not* violate privacy, despite extensive information access.  
     *Motivation*: Demands an account of *consent* and *context* that avoids equating privacy with secrecy or access control.  

  4. **Relational Facts (e.g., Genetic Data)**:  
     *Requirement*: Identify whose privacy is at stake in facts about multiple individuals (e.g., shared DNA, pregnancy) and how conflicting claims (e.g., sister vs. sibling) are adjudicated.  
     *Motivation*: Requires theories to address *group/relational privacy* and avoid atomistic individualism.  

  5. **Resurfacing Public Information**:  
     *Requirement*: Explain the wrong (if any) in aggregating/resurfacing historically public data (e.g., old social media posts) in new contexts.  
     *Motivation*: Challenges theories that collapse privacy with secrecy or initial disclosure. Demands attention to *temporal context* and *dignity*.  

  6. **"Nothing to Hide" Objection**:  
     *Requirement*: Either refute the claim that "only those with something to hide value privacy" or dissolve it as conceptually confused.  
     *Motivation*: Tests the theory’s ability to defend privacy’s *non-concealment-based value* (e.g., autonomy, dignity, antifragility).  

  ---

  ### **II. Distinctions the Theory Must Maintain**  
  *(Non-negotiable: Conceptual clarity prevents reductionism)*  

  1. **Privacy vs. Secrecy**:  
     *Requirement*: Distinguish privacy (legitimate control over access) from secrecy (intentional concealment of wrongdoing).  
     *Motivation*: Avoids pathologizing privacy as inherently suspicious.  

  2. **Loss vs. Violation of Privacy**:  
     *Requirement*: Distinguish warranted losses (e.g., medical disclosure to a doctor) from unwarranted violations (e.g., data sold without consent).  
     *Motivation*: Prevents theories from treating all privacy reductions as intrinsically wrongful.  

  3. **Privacy’s Conceptual Forms**:  
     *Requirement*: Clarify the relationship between privacy as a *state* (being unobserved), a *right* (moral/legal claim), a *claim* (contextual demand), and a *good* (social value).  
     *Motivation*: Ensures the theory is ontologically precise for policy application.  

  4. **Informational vs. Other Privacies**:  
     *Requirement*: Specify how informational privacy relates to physical (bodily), associational (groups), and decisional (autonomy) privacy without reducing all to information.  
     *Motivation*: Prevents over-expansion/under-specification (e.g., *Roe* grounded in decisional, not informational, privacy).  

  5. **Instrumental vs. Non-Instrumental Value**:  
     *Requirement*: Articulate both privacy’s instrumental benefits (e.g., preventing discrimination) and its intrinsic value (e.g., as constitutive of personhood).  
     *Motivation*: Avoids reducing privacy to a mere tool (vulnerable to efficiency trade-offs).  

  6. **Individual vs. Group Privacy**:  
     *Requirement*: Explain how privacy applies to pairs, families, or communities (e.g., Indigenous data sovereignty) without erasing individuals.  
     *Motivation*: Addresses collective harms (e.g., algorithmic group profiling).  

  ---

  ### **III. Considerations the Theory Must Be Consistent With**  
  *(Non-negotiable: Empirical & normative plausibility)*  

  1. **The Privacy Paradox**:  
     *Requirement*: Explain why people report valuing privacy but often act contrary to this (e.g., sharing data online).  
     *Motivation*: Tests coherence with real-world behavior; excludes theories ignoring cognitive biases or structural coercion.  

  2. **Welcome Privacy Losses**:  
     *Requirement*: Account for contexts where privacy loss is desirable (e.g., intimacy, healthcare).  
     *Motivation*: Avoids framing privacy as inherently good; demands contextual flexibility.  

  3. **Degrees of Privacy**:  
     *Requirement*: Explain why privacy is scalar (more/less), not binary (present/absent), without implying "more is always better."  
     *Motivation*: Reflects lived experience; prevents absolutism.  

  4. **Objectionable Consensual Surveillance**:  
     *Requirement*: Explain why surveillance can be wrongful even if disclosed and consented to (e.g., workplace monitoring).  
     *Motivation*: Challenges transactional autonomy models; requires attention to *power imbalances* or *structural injustice*.  

  5. **Privacy vs. Power/Standing**:  
     *Requirement*: Distinguish privacy violations from complaints about diminished social standing or oppression (e.g., "Is this *really* about privacy?").  
     *Motivation*: Ensures conceptual precision; avoids overloading "privacy" with unrelated grievances.  

  ---

  ### **IV. Operational Constraints**  
  *(Non-negotiable: Usability in applied contexts)*  

  1. **Action-Guidance in Policy Cases**:  
     *Requirement*: Generate clear guidance for dilemmas like cameras in care homes or insurers demanding wearable data.  
     *Motivation*: Tests practical relevance; excludes overly abstract or culturally relativistic theories.  

  2. **Beyond Local Norms**:  
     *Requirement*: Avoid reducing privacy to "whatever local norms dictate," while acknowledging context.  
     *Motivation*: Ensures critical capacity to condemn harmful norms (e.g., patriarchal surveillance).  

  3. **Beyond Subjective Offense**:  
     *Requirement*: Explain why privacy violations can occur even if the subject is unbothered (e.g., hidden data breaches).  
     *Motivation*: Prevents theories from equating violation with subjective feelings.  

  ---

  ### **V. Analysis of the List & Its Tensions**  
  **Key Insight**: The requirements collectively exclude **control-based**, **access-based**, and **purely instrumental** accounts unless significantly revised.  

  #### **The Crucial Tension**:  
  - **The "Unread Ledger" requirement** (II.2) conflicts with theories requiring *access* or *use* for a violation (e.g., classic access-based views).  
  - **The "Objectionable Consensual Surveillance" requirement** (III.4) conflicts with *consent-centric* theories (e.g., some control-based views).  
  - **The "Nothing to Hide" requirement** (I.6) conflicts with *reductionist instrumentalism* (e.g., privacy only matters to conceal wrongdoing).  

  #### **Most Excluding Requirement**:  
  **"Unread Ledger" (I.2)**. It forces the theory to accept that *mere data accumulation* (without access or harm) violates privacy. This excludes:  
  - Access-based views (e.g., Parent, Gavison)  
  - Harm-focused views (e.g., Posner)  
  - Use-based views (e.g., Rubel)  

  #### **Potential Biases in Your List**:  
  1. **Anti-Reductionism**: Your cases (e.g., "boring observation," "relational facts") assume privacy is a *sui generis* moral concept. This risks excluding deflationary views (e.g., "privacy is just property/consent").  
     - *Should be argued*: Why privacy deserves distinct moral status.  
  2. **Contextualism**: Requirements (III.2, III.3) demand context-sensitivity but reject relativism (IV.2). This presumes a *universal core* to privacy.  
     - *Should be argued*: Why some privacy norms transcend culture.  
  3. **Non-Individualism**: The "relational facts" (I.4) and "group privacy" (II.6) requirements assume individuals are not the only privacy-bearing entities.  
     - *Political commitment*: Rejects libertarian individualism; must be defended.  

  #### **Shape of the List**:  
  The list implies a theory that:  
  - Is **non-instrumentalist** at its core (to handle "nothing to hide," "boring observation").  
  - Treats privacy as **constitutively relational** (to handle mutual surveillance, group claims).  
  - Grounds violations in **dignity/autonomy** *beyond consent* (to handle objectionable consensual surveillance).  
  - Accepts **contextual scalarity** without relativism.  

  **Irreconcilable Pair?**  
  - **"Unread Ledger = Violation"** (I.2) + **"Privacy Loss ≠ Always Violation"** (II.2) requires a theory distinguishing *wrongful accumulation* from *legitimate reduction*. This is only possible if the theory identifies a **threshold of control/respect for agency** that separates loss from violation.  

  ---

  ### **Recommendation**  
  Build your evaluation around the **Unread Ledger**, **Objectionable Consensual Surveillance**, and **Boring Observation** cases. If a theory fails these, it likely collapses key distinctions or ignores non-instrumental value. The most promising candidates will be **dignity-based** (Regan, Bloustein) or **autonomy/contextual integrity** (Nissenbaum) accounts, but they must be stress-tested against your relational and group cases. Reject any theory that cannot satisfy at least 80% of non-negotiables—this list is designed to be stringent but fair.
