prompt: |-
  A colleague of mine who teaches contract law has a line he produces whenever the conversation turns to ethics: a promise, he says, is simply a contract that no court will enforce. He does not mean it as a joke, and he takes the analogy to be doing real work. His claim is that the two are the same kind of thing — one party invites another to rely on a commitment, the other accepts, and the promisor thereby takes on a liability — and that the only difference between them is institutional: in the one case there is a tribunal with a remedy, in the other there is not. From this he draws two conclusions that he thinks any honest person must accept. First, that the wrong of breaking a promise is entirely a wrong done to the promisee, so that a promise no one has relied upon and no one will miss is only nominally binding. Second, that because a contract breaker is generally permitted to pay damages rather than perform, there is no deep difference between keeping a promise and compensating the person to whom it was made.

  I suspect the analogy is carrying more weight than it can bear, but I would rather locate the precise points of failure than trade intuitions with him. Please do the following.

  1. Set out the correspondence in full: what answers to offer and acceptance, to consideration, to breach and remedy, to the doctrines that excuse or defeat performance (duress, mistake, impossibility, the pre-existing duty rule, promissory estoppel), and to the availability of specific performance rather than damages. A table of correspondences is welcome.

  2. Identify where the mapping breaks, and separate the breaks that matter for his two conclusions from the ones that are merely incidental to the comparison.

  3. Say what the analogy quietly imports from the contract case that the promise case may lack — a third-party enforcer, a substitutional remedy, parties conceived as strangers bargaining at arm's length — and, just as importantly, what the promise case contains that the contract case has no place for: promises to oneself, promises to the dead, the thought that the promisor is bound to perform rather than merely to pay, and the possibility that breaking a promise wrongs the promisor as well as the promisee.

  4. Deliver a verdict on each of his two conclusions: does either survive once the disanalogies are on the table, and if one survives, does it survive for the reason he gives or for some independent reason?

  5. If a better analogy for the bindingness of promises is available, give it and treat it the same way: what maps onto what, and where it in turn fails.

  I am not looking for a survey of what others have written, and I do not need case names or a reading list; I want the comparison audited and the argument made on its structural merits.
reasoning: |-
  Okay, the user has presented a complex philosophical and legal argument about the analogy between promises and contracts. I need to break this down systematically. 

  First, the colleague's core claim is that promises are just unenforceable contracts, with two key conclusions: (1) promise-breaking only wrongs the promisee if there's reliance, and (2) paying damages is morally equivalent to performance. The user wants me to audit this analogy structurally.

  Hmm, I should start by mapping contract elements to promise elements as requested. Offer/acceptance maps cleanly to invitation/reliance in promises. Consideration is trickier - promises don't require quid pro quo, but the "moral weight" might serve a similar function. For breach, both involve failure to perform, but remedies differ fundamentally: contracts have institutional remedies while promises rely on social/moral sanctions. 

  The doctrines part reveals major cracks. Duress and mistake apply differently - promising under duress might still feel binding personally. Impossibility is similar in both. Pre-existing duty rule doesn't translate at all to promises. And promissory estoppel actually bridges the two concepts interestingly. Specific performance is rare in contracts but central to promises - that's a huge disanalogy.

  Now the colleague's two conclusions... The first fails completely because promises can bind without reliance (deathbed promises, vows). The second collapses because contract remedies are substitutional (money for performance) while promise-breaking damages the relationship itself - they're incommensurable. 

  What's smuggled in? The contract frame assumes third-party enforcement, adversarial relationships, and economic thinking. But promises contain personal bonds, self-commitment, and duties to the dead - all alien to contract law. 

  A better analogy might be vows or oaths - they map better to promises' personal and sacred dimensions. But even that fails to capture promises' full moral scope. Ultimately the contract analogy is useful for some aspects but reductive for others. The colleague's conclusions don't hold water once we see how promises create different kinds of obligations.

  The user seems sophisticated - probably a philosopher or legal theorist. They're not looking for citations but a rigorous logical takedown. I'll need to be precise about which disanalogies directly undermine the colleague's claims versus those that are merely interesting differences. The deathbed promise example is particularly devastating to the reliance argument.
answer: |-
  Your colleague's analogy between promises and contracts is provocative but ultimately unsustainable. Below is a structural audit showing where the mapping holds, where it fractures, and why his conclusions fail. I proceed as requested: (1) full correspondence mapping, (2) key breaks in the analogy, (3) conceptual smuggling, (4) verdict on conclusions, and (5) a proposed better analogy with its own limitations.

  ---

  ### **1. Correspondence Table**  
  *(Contract concepts vs. Promise analogs)*  

  | **Contract Element**          | **Promise Analog**                     | **Degree of Fit** |  
  |-------------------------------|----------------------------------------|-------------------|  
  | **Offer & Acceptance**        | Promisor’s commitment + Promisee’s acceptance (explicit or implicit) | High              |  
  | **Consideration**             | "Moral weight" (e.g., seriousness, context) – *not quid pro quo* | Low/None          |  
  | **Breach**                    | Breaking the promise                   | High              |  
  | **Remedy (Damages)**          | Apology, restitution, or moral regret  | Low               |  
  | **Duress**                    | Coercion invalidates promise           | Moderate          |  
  | **Mistake**                   | Misunderstanding voids moral obligation | Moderate          |  
  | **Impossibility**             | Genuine inability to perform excuses   | High              |  
  | **Pre-existing Duty Rule**    | No clear analog (promises aren’t transactional) | None              |  
  | **Promissory Estoppel**       | Reliance as binding element            | High (ironically) |  
  | **Specific Performance**      | Expectation of literal fulfillment     | Low (key break)   |  

  ---

  ### **2. Where the Mapping Breaks**  
  #### **Critical Breaks (Undermine Conclusions):**  
  - **Remedy Structure**: Contract damages are *substitutional* (money for performance), while promise remedies are *relational* (trust repair). Paying damages in contracts is legally sufficient; compensating for a broken promise is morally insufficient (e.g., failing to attend a child’s recital can’t be "paid off").  
  - **Specific Performance**: Contracts rarely compel performance; promises *inherently* demand it. The moral duty to *do the thing promised* (e.g., "I promise to visit you in hospice") is non-negotiable.  
  - **Pre-existing Duty Rule**: Contracts require new consideration for modifications; promises can be binding without "exchange" (e.g., gratuitous vows).  

  #### **Incidental Breaks (Not Conclusion-Fatal):**  
  - **Consideration**: Promises need no bargained-for benefit/detriment (e.g., "I promise not to reveal your secret" binds without exchange).  
  - **Formalities**: Contracts require intent to create legal relations; promises operate in personal/ethical spheres.  

  ---

  ### **3. Conceptual Smuggling**  
  **What Contracts Illegitimately Import to Promises:**  
  - A **third-party enforcer** (courts), reducing obligation to coercibility.  
  - **Parties as strangers** in adversarial negotiation, ignoring intimate/affective bonds (e.g., promises between lovers).  
  - **Economic logic**: Damages as adequate remedy, treating commitments as commodities.  

  **What Promises Contain That Contracts Exclude:**  
  - **Duty to perform, not merely pay**: Breaking a promise violates a moral duty *to the act itself* (e.g., vow fidelity).  
  - **Promises to the dead/non-reliant**: Unenforceable yet binding (e.g., "I promise to scatter your ashes at sea").  
  - **Promises to oneself**: Binding self-commitments (e.g., sobriety pledges) with no promisee.  
  - **Wrong to the promisor**: Integrity erosion; self-betrayal distinct from harming the promisee.  

  ---

  ### **4. Verdict on Conclusions**  
  - **Conclusion 1**: *"The wrong of breaking a promise is only to the promisee if relied upon."*  
    **Verdict: False.**  
    Breaks without reliance still wrong: (a) the promisor (self-respect), (b) third parties (e.g., breaking a deathbed vow to a parent wrongs the deceased), and (c) the moral community (eroding social trust). A promise no one "misses" (e.g., unspoken vow) can bind intrinsically.  

  - **Conclusion 2**: *"No deep difference between keeping a promise and compensating for breach."*  
    **Verdict: False.**  
    Contracts allow discharge via damages because they protect reliance interests; promises protect *performance interests* and relational integrity. Compensating for a broken promise addresses harm but not the betrayal of commitment (e.g., paying for a missed wedding vow doesn’t fulfill the vow).  

  ---

  ### **5. A Better Analogy: Promises as Sacred Vows**  
  **Mapping:**  
  - **Vow**: The promise itself (e.g., marital vows).  
  - **Sacredness/Trust**: The "consideration" (non-negotiable moral weight).  
  - **Desecration**: Breach, harming both the vow-taker and the community.  
  - **Absolution**: Remedy (e.g., penance, reconciliation), not substitution.  

  **Where It Fits Better Than Contracts:**  
  - Captures intrinsic duty to perform (not pay).  
  - Explains bindingness without reliance (vows to God, the dead).  
  - Acknowledges promisor’s self-harm upon breach.  

  **Where It Fails:**  
  - Overmoralizes trivial promises (e.g., "I promise to buy milk").  
  - No clear analog to "excuses" like impossibility.  
  - Risks conflating secular promises with religious/metaphysical commitments.  

  ---

  ### **Conclusion**  
  Your colleague’s analogy fails structurally by:  
  1. Reducing promises to **contingent transactions** (ignoring intrinsic duties),  
  2. Equating **remedies** (money ≠ moral repair),  
  3. Erasing **non-reliant bonds** (vows, self-promises).  

  His conclusions collapse because contracts institutionalize *external accountability*, while promises generate *internal accountability*. The vow analogy better captures promises’ moral gravity but overreaches for mundane commitments. Ultimately, **promises are moral acts creating relational obligations; contracts are legal acts allocating risk.** The difference is one of kind, not enforceability.
