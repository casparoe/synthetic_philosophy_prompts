prompt: |-
  I host a small philosophy interview series — part reading group, part podcast — whose listeners are mostly graduate students and serious amateurs, and next month's guest works on the philosophy of pleasure. Her position, which I want the interview to probe rather than merely advertise, is that the heterogeneity problem for hedonism is real but soluble. Pleasures of taste, music, sex, conversation, and intellectual discovery admittedly present no single introspectible quality; on her account that is exactly what we should expect if pleasure is a determinable and its instances are determinates. Just as scarlet, teal, and mauve share no shade in common yet are all hues, the particular pleasures share no feeling in common yet all possess hedonic valence, which she treats as a genuine determinable property rather than a mere label for a disjunction. She is not an attitudinalist: she thinks locating the unity in an attitude of taking pleasure in something, rather than in how the experience feels, changes the subject from pleasure to liking. And she thinks the determinable view matters for the axiology as well, because hedonism can claim that pleasure is a single intrinsic good only if there is something single for it to be good in virtue of.

  Please draft ten to twelve interview questions, each with a follow-up keyed to the answer she is most likely to give, and no soft openers. I want at least one question that forces her to say precisely what hedonic valence is over and above the disjunction of determinate pleasures — the objection that the determinable is just an abstraction doing no explanatory work — and at least one that presses the colour analogy from the other side, asking whether hue is a model of unity or a model of how little the members of a kind need share. I also want a question that puts the attitudinalist alternative to her seriously, one that asks her to answer the charge that introspection reports the taste of the coffee and the shape of the melody and no separate pleasantness, and one that draws out the axiological stakes: what becomes of hedonism if the unity turns out to be mere family resemblance rather than a shared property. The follow-ups should be the ones that make the standard reply harder to repeat — for instance, if she says valence is introspectively detectable, the follow-up should raise mixed feelings, or the masochist who reports taking pleasure in something he also dislikes, or the possibility of a hedonic spectrum inverted with respect to ours; if she leans on the determinable/determinate relation, the follow-up should ask whether every determinable earns its keep and how we could ever tell when one does not.

  Close with a question about what would count against her view — what observation, case, or argument would make her abandon the determinable and concede that pleasures share nothing at all.
reasoning: |-
  We are drafting 10-12 interview questions with follow-ups for a philosopher who defends a determinable view of pleasure against the heterogeneity problem. The key points of her view are:
  - Pleasures are heterogeneous (no single introspectible quality) but unified under the determinable "hedonic valence."
  - This determinable is a genuine property, not just a disjunction of determinates (like hues: scarlet, teal, mauve are all hues without sharing a shade).
  - She rejects attitudinalism (which locates unity in an attitude of liking) because that changes the subject from the feeling of pleasure.
  - The unity matters for hedonism: if pleasure is a single intrinsic good, it must have a single property in virtue of which it is good.

  We must include:
  1. A question forcing her to define hedonic valence beyond a disjunction (follow-up: the determinable might be an abstraction without explanatory work).
  2. A question pressing the color analogy: is hue a model of unity or of how little members share? (follow-up: if it's the latter, then the unity might be too thin for hedonism's needs).
  3. A question seriously putting attitudinalism as an alternative (follow-up: why isn't attitudinalism a better solution?).
  4. A question about introspection: we introspect the taste and the melody, not a separate pleasantness (follow-up: what about mixed feelings or masochism?).
  5. A question on axiological stakes: what if unity is only family resemblance? (follow-up: can hedonism survive without a single property?).

  Also, the final question: what would count against her view?

  We want tough questions and follow-ups that challenge her to go beyond standard replies.

  Let's structure the questions:

  1. **Question on hedonic valence as more than a disjunction**: 
     - Main: "You argue that hedonic valence is a genuine determinable property, not merely a label for the disjunction of determinate pleasures. But what exactly is this property? How is it more than an abstraction we impose on the variety of pleasant experiences?"
     - Expected answer: She might say it's a real, introspectible property that unifies the experiences, even if not a common quality.
     - Follow-up: "If hedonic valence is not an additional introspectible quality, but rather the property of being a pleasure, doesn't that make it a second-order property that doesn't do any causal or explanatory work beyond the determinate properties? How does it avoid being epiphenomenal?"

  2. **Question on the color analogy**:
     - Main: "You use the analogy of color hues: scarlet, teal, and mauve are all hues without sharing a common shade. Is this meant to show that a determinable can unify without a common quality, or does it reveal that the unity is merely nominal—a grouping we impose because of shared similarities at a higher level of abstraction?"
     - Expected answer: She will likely say it's a real unity at the level of the determinable.
     - Follow-up: "But consider that we can have a spectrum of hues without any single property that all hues share except being hues. If that's the case for pleasure, then isn't the unity of pleasure similarly minimal? And if so, how does this support hedonism's claim that pleasure is a single intrinsic good?"

  3. **Question challenging attitudinalism**:
     - Main: "Attitudinal hedonists, like Fred Feldman, argue that the unity of pleasure lies in a common attitude—taking an experience to be pleasing—rather than in any common feeling. Why is your approach, which locates unity in a feeling-based determinable, superior to attitudinalism?"
     - Expected answer: She might say that attitudinalism changes the subject from the experience of pleasure to an attitude about it, and that we do experience pleasure as a feeling.
     - Follow-up: "But if we introspect an experience, we find the sensory qualities (like the taste of coffee) and we also find that we are taking pleasure in it. Why isn't that attitudinal component exactly what we mean by pleasure? And if we can have an experience that we take pleasure in without any distinctive feeling, doesn't that show that the feeling isn't necessary?"

  4. **Question on introspection**:
     - Main: "When I introspect my experience of enjoying a cup of coffee, I notice the warmth, the bitterness, the aroma—but I don't seem to detect a separate quality of pleasantness over and above these. How does your account explain that?"
     - Expected answer: She might say that the pleasantness is a way these qualities are experienced, a determinable aspect of the experience.
     - Follow-up: "Consider a masochist who reports taking pleasure in pain but also disliking it. If we can have an experience that is both pleasant and unpleasant in some way, doesn't that suggest that the pleasantness is not an intrinsic property of the sensation but an attitude we take? How does your view account for such mixed feelings without fragmenting the determinable?"

  5. **Question on axiological stakes**:
     - Main: "Suppose your determinable account fails, and the best we can say is that pleasures share only a family resemblance. What becomes of hedonism? Can it still maintain that pleasure is a single intrinsic good?"
     - Expected answer: She might say that without a genuine unity, hedonism would be in trouble because there would be no single thing that is good.
     - Follow-up: "But even if pleasures are only united by family resemblance, why couldn't we still call them all 'good'? And if we do, wouldn't that be a disjunctive good? Why is that problematic for hedonism? After all, hedonism could be revised to say that what is intrinsically good is any of the disjuncts."

  6. **Question on the reality of determinables**:
     - Main: "In general, are determinables real properties? For example, is 'being colored' a real property of an object, or just a way of saying it has some color? How do you argue that hedonic valence is a real property and not just a linguistic convenience?"
     - Expected answer: She might argue that determinables are real because they play a role in our experience and in causal explanations.
     - Follow-up: "But consider that we can explain all the effects of a colored object by referring to its specific color (e.g., a red light causing a reaction). Similarly, for pleasure, isn't it the specific determinate feeling that causes our behavior? If hedonic valence doesn't add any causal power, why think it's real?"

  7. **Question on the epistemology of hedonic valence**:
     - Main: "How do we come to know that an experience has hedonic valence? If it's not an introspectible quality in its own right, how do we detect it?"
     - Expected answer: She might say that we recognize it as a feature of the experience, perhaps through a kind of direct acquaintance.
     - Follow-up: "But if two people disagree about whether an experience is pleasant—say, one finds the taste of cilantro pleasant and another finds it unpleasant—how do we adjudicate that without appealing to a common quality? Doesn't this suggest that hedonic valence is not an objective property?"

  8. **Question on the possibility of inverted spectra**:
     - Main: "You reject attitudinalism because you think pleasure is a feeling. But what if we imagine a hedonic inverted spectrum: where what is pleasant for me is unpleasant for someone else, and vice versa. Couldn't that be possible? And if so, doesn't that undermine the idea that there's a common feeling of pleasure?"
     - Expected answer: She might say that even in an inverted spectrum, each person still has their own set of pleasures, and the determinable valence is still present in each experience.
     - Follow-up: "But if the valence is inverted, then what you call pleasant I call unpleasant. Doesn't that show that the valence is not a property of the experience itself but of our reaction? And if so, doesn't that push us back toward attitudinalism?"

  9. **Question on the relationship between valence and motivation**:
     - Main: "Traditionally, pleasure is tied to motivation: we seek pleasant experiences. How does your account of hedonic valence as a determinable property explain this link?"
     - Expected answer: She might say that each determinate pleasure has motivational force, and the valence is what unifies them in being the kind of thing that motivates.
     - Follow-up: "But if the determinate pleasures are what motivate us, then why do we need the determinable? And if the determinable is what explains why we seek diverse pleasures, doesn't that make it epiphenomenal since the motivation comes from the specific qualities?"

  10. **Question on the axiological role of the determinable**:
      - Main: "You say that hedonism requires a single property for pleasure to be good in virtue of. But if the goodness is determined by the specific determinate pleasures, why can't we say that each determinate pleasure is good in its own way? Why do we need a single property?"
      - Expected answer: She might argue that without a single property, we don't have a unified theory of the good, and hedonism loses its simplicity and explanatory power.
      - Follow-up: "But why is that a problem? If a disjunctive property can still be the basis of value, why isn't that enough? And if the determinable valence is the common property, then when we say an experience is good because it is pleasant, are we saying it is good because of the valence? But if the valence is the same in all, why do we prefer some pleasures over others? Doesn't that suggest the value comes from the determinate, not the determinable?"

  11. **Question on mixed feelings and complexity**:
      - Main: "How does your account handle complex experiences that are both pleasant and unpleasant in different respects? For example, a challenging workout that is physically painful but also rewarding."
      - Expected answer: She might say that the experience has multiple components, some of which are pleasant and some unpleasant, each with their own valence.
      - Follow-up: "But if the same overall experience can have both positive and negative valence, then doesn't the valence become a property of parts of the experience rather than the whole? And if so, how do we aggregate them? Does that mean that the determinable valence is not a property of the entire experience?"

  12. **Final question: what would count against her view**:
      - Main: "What kind of evidence or argument would lead you to abandon the determinable view and concede that pleasures share nothing at all? What is the falsification condition for your theory?"

  We have 12 questions. We can trim to 10-12 as needed. Let's list them as:

  1. On defining hedonic valence beyond disjunction.
  2. On the color analogy and the strength of unity.
  3. On attitudinalism as an alternative.
  4. On introspection and the absence of a separate pleasantness.
  5. On the axiological stakes if unity fails.
  6. On the reality of determinables in general.
  7. On the epistemology of hedonic valence.
  8. On the inverted spectrum.
  9. On the link between valence and motivation.
  10. On the axiological role of the determinable vs. determinates.
  11. On mixed feelings and complex experiences.
  12. What would falsify the view?

  We'll write them out in interview format.
answer: |-
  Here are twelve rigorous interview questions with targeted follow-ups, designed to probe the determinable account of pleasure and its implications. Each question avoids soft openers and directly engages the core arguments, with follow-ups engineered to challenge standard replies and push for deeper clarification.

  ### 1. Defining Hedonic Valence Beyond Disjunction  
  **Question:** You argue hedonic valence is a genuine determinable property, not merely a disjunction of determinate pleasures. But what *is* valence ontologically? If it’s not an introspectible quality like sweetness or warmth, how do we distinguish it from an abstract placeholder that does no causal or explanatory work?  
  **Expected Answer:** Valence is a higher-order property unifying determinates, intrinsic to the experience and detectable introspectively as the "positive feel" common to all pleasures.  
  **Follow-up:** If valence is introspectively detectable, how do you explain *mixed feelings* (e.g., the bittersweet joy of nostalgia)? Introspection here reveals concurrent positive and negative affects, suggesting valence isn’t a unified property but a composite of attitudes. Doesn’t this reduce valence to a disjunction after all?  

  ### 2. Color Analogy: Unity or Minimal Commonality?  
  **Question:** Your hue analogy (scarlet/teal/mauve as determinates of hue) is central. But is this meant to show that determinables provide *robust unity* or that they *minimize shared properties*? If hues share nothing but "being hues," isn’t that unity too thin for hedonism’s claim that pleasure is a *single* intrinsic good?  
  **Expected Answer:** Hue is a substantive, non-arbitrary category—colors share a real determinable (wavelength range) that grounds their unity, just as valence grounds pleasure.  
  **Follow-up:** Physically, hues are united by wavelengths, but phenomenally, they share no common introspectible quality—"hue" is just a label for how we group them. If valence is similar, why isn’t it just a label for "whatever we call pleasant," making it a disjunction in disguise?  

  ### 3. Attitudinalism as a Superior Alternative?  
  **Question:** Attitudinalists like Feldman argue that the unity of pleasure lies in a pro-attitude (e.g., wanting an experience to continue), not a feeling. Why is your valence-based view superior, given that attitudes avoid the heterogeneity problem entirely?  
  **Expected Answer:** Attitudinalism conflates pleasure with liking—it changes the subject from the intrinsic feel of experience to extrinsic desires, failing to capture why we seek pleasure *for its own sake*.  
  **Follow-up:** But if a masochist reports *taking pleasure* in pain while simultaneously *disliking* it, doesn’t this decouple the attitude ("wanting it to continue") from the feeling? Doesn’t this suggest attitudinalism better handles cases where the feeling and the attitude diverge?  

  ### 4. Introspection and the Absence of Pleasantness  
  **Question:** Introspection of tasting coffee reveals only sensory qualities (bitterness, warmth) and no distinct "pleasantness." If valence isn’t a separate introspectible element, how is it anything but an ad hoc posit?  
  **Expected Answer:** Valence isn’t a distinct quality but a *mode of presentation*—the bitterness is experienced *as pleasant*, just as scarlet is experienced *as a hue*.  
  **Follow-up:** In an inverted hedonic spectrum, where your "pleasant" coffee tastes identical to me but feels unpleasant, introspection wouldn’t reveal valence—only identical sensory qualities. Doesn’t this imply valence is projected, not inherent?  

  ### 5. Axiological Stakes of Failed Unity  
  **Question:** If pleasures only share family resemblance (e.g., overlapping features like duration or intensity) rather than a determinable, can hedonism still claim pleasure is a *single* intrinsic good? Or must it fragment into a disjunctive theory?  
  **Expected Answer:** No—without a shared property, hedonism collapses. Pleasure can’t be a unified good if it lacks a unified essence.  
  **Follow-up:** But if we treat "pleasant experiences" as a disjunction (e.g., taste-good OR sex-good), why can’t hedonism say *that disjunction* is intrinsically good? After all, disjunctive properties (e.g., "jade" as nephrite or jadeite) still support generalizations.  

  ### 6. Determinables Earning Their Keep  
  **Question:** How do we distinguish "real" determinables (like valence) from gerrymandered ones (e.g., "grue" for green/blue)? What test confirms valence isn’t just a useful abstraction?  
  **Expected Answer:** Real determinables earn explanatory keep: valence explains why diverse pleasures motivate pursuit and are intrinsically valuable.  
  **Follow-up:** But if each *determinate* pleasure motivates independently (e.g., the warmth of coffee motivates via its specific feel), doesn’t valence become explanatorily redundant? How does it avoid epiphenomenalism?  

  ### 7. Valence and the Heterogeneity Challenge  
  **Question:** Heterogeneity implies pleasures lack a common *feeling*. If valence isn’t a feeling, what positive evidence proves it’s a property of experience rather than a conceptual tool?  
  **Expected Answer:** We introspect valence indirectly—it’s the "goodness" in how we experience determinates, akin to how we perceive an object’s shape *as* triangular.  
  **Follow-up:** But shape perception depends on spatial properties, while valence has no analogous "hedonic space." If valence is irreducible, why can’t we isolate it in experience?  

  ### 8. Motivation and Valence  
  **Question:** Hedonism ties pleasure to motivation. If valence is the determinable, how does it explain why we pursue *all* pleasures? If it’s the determinates that motivate, why posit valence?  
  **Expected Answer:** Valence unifies the *reason* we pursue diverse pleasures: they all share "positive affect."  
  **Follow-up:** If someone pursues a pleasure solely for its specificity (e.g., music for its complexity), doesn’t motivation reduce to the determinate, making valence superfluous?  

  ### 9. Cross-Modal Valence  
  **Question:** Music and taste pleasures involve different senses. How can valence unify them without being sense-modality–neutral, thereby becoming an abstract disjunction?  
  **Expected Answer:** Valence is modality-neutral—like "intensity," it’s a property that can be realized diversely.  
  **Follow-up:** But "intensity" is quantitative and measurable, while valence is qualitative. Without a shared metric, isn’t valence just a label?  

  ### 10. Valence vs. Disvalue  
  **Question:** If valence is a determinable, is *unpleasantness* a separate determinable? Or is there a single hedonic spectrum?  
  **Expected Answer:** Unpleasantness is the negative counterpart—both are determinates of a broader "affective tone" determinable.  
  **Follow-up:** But if pleasantness and unpleasantness are distinct determinables, doesn’t this reintroduce disunity? If they’re one spectrum, why can’t we experience both at once (e.g., spicy food), fragmenting valence?  

  ### 11. Empirical Challenges to Valence  
  **Question:** Neuroscience often localizes pleasure to specific reward circuits (e.g., dopamine for food, opioids for social warmth). Doesn’t this suggest valence is realized by disjunctive mechanisms, undermining a unified property?  
  **Expected Answer:** Multiple realizations don’t refute determinables—hues are realized by different wavelengths.  
  **Follow-up:** But wavelengths share a physical basis (light), while pleasures involve distinct neural systems. If there’s no common mechanism or functional role, how is valence non-arbitrary?  

  ### 12. Falsification Condition  
  **Question:** What evidence or argument would make you concede pleasures share *nothing*—not even a determinable?  
  **Expected Answer:** If all apparent pleasures were shown to lack *any* unifying feature—e.g., if introspection, behavior, and neuroscience revealed only disjunction—I’d abandon the view.  
  **Follow-up:** Suppose we found beings who experience diverse "pleasures" but lack any capacity to generalize across them (e.g., they pursue taste but not sex without seeing them as "alike"). Wouldn’t that suggest valence is a cognitive imposition, not a property?  

  These questions target the determinable view’s metaphysics, epistemology, and axiological implications while forcing novel defenses against standard objections. The follow-ups preempt common rebuttals, ensuring the discussion pushes beyond rehearsal.
