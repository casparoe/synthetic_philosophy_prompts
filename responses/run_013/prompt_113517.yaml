  **Joint Statement on the Frege Diary: An Adversarial Collaboration Between Separatists and Integrationists**

  **I. Description of the Diary**

  The diary in question, written by Gottlob Frege near the end of his life, contains entries expressing strong negative views about Jewish people and advocating for authoritarian political measures, including the removal of Jewish individuals from positions of influence and the establishment of a government with unchecked power. These entries reflect a political outlook that is both antisemitic and authoritarian.

  Both sides agree that this description captures the relevant content without quoting or interpreting the diary's language.

  **II. Jointly Accepted Claims**

  Both separatists and integrationists agree on the following:

  1. The diary exists and was written by Frege.
  2. The diary contains the political views described above.
  3. Frege is a major figure in the history of logic, semantics, and the philosophy of mathematics, having made foundational contributions in these areas.
  4. Frege's philosophical work, especially in logic and the philosophy of mathematics, is of great importance and has been highly influential.
  5. The diary reveals Frege's personal political commitments, which are morally reprehensible and incompatible with democratic and egalitarian values.
  6. The diary was written late in Frege's life, after the bulk of his philosophical work had been completed.
  7. Frege's philosophical writings, taken on their own, do not explicitly endorse the political views expressed in the diary or any similar political program.
  8. There is no evidence that Frege's political views influenced his professional interactions in the academic sphere in a way that affected his philosophical work (e.g., no evidence of discrimination in correspondence or collaboration that altered his philosophical output).

  **III. Remaining Disagreements**

  The separatist and integrationist positions are phrased as follows:

  *Separatist Position:* The separatists hold that the diary is evidentially inert with respect to Frege's logic, semantics, and philosophy of mathematics. While the diary is morally revealing about Frege as a person, it provides no reason to revise or reinterpret any of his philosophical claims. The philosophy stands independently of the political views, and the diary does not bear on the content, truth, justification, or interpretation of Frege's philosophical work.

  *Integrationist Position:* The integrationists hold that the diary does bear on Frege's philosophy. The political outlook expressed in the diary illuminates aspects of his conception of objectivity, his anti-psychologism, and his Platonism about thoughts. The philosophy is in some way compromised or implicated by the political views, and the diary provides reasons to reconsider the interpretation, motivation, and broader significance of his philosophical work.

  **IV. Table of Cruxes**

  We distinguish four types of relations between the politics and the philosophy:

  A. Upstream causation: Politics shaping philosophy (e.g., political views influencing philosophical views).
  B. Downstream causation: Philosophy shaping politics (e.g., philosophical views leading to political commitments).
  C. Common cause: Both politics and philosophy flow from a third factor (e.g., a personality trait or worldview).
  D. Structural resonance: No causal link, but an isomorphism between political and philosophical structures.

  We also distinguish four senses in which the diary might bear on the philosophy:

  1. Evidential bearing: Does the diary provide evidence about the content of Frege's philosophical claims (e.g., what he meant by a particular term or argument)?
  2. Motivational/functional bearing: Does the diary reveal the motivation behind Frege's philosophical claims or their social function?
  3. Truth/justification bearing: Does the diary affect the truth or justification of Frege's philosophical claims?
  4. Pedagogical/commemorative bearing: How should the diary affect how we teach, commemorate, or morally assess Frege as a philosopher?

  *Crux 1: The nature of Frege's anti-psychologism*

  - **Issue**: Is anti-psychologism primarily a thesis about the grounds of logical truth (i.e., that logical truths do not depend on psychological facts) or merely about the subject matter of logic (i.e., that logic studies abstract entities, not mental processes)? The integrationist case for a connection to the diary is stronger if anti-psychologism is about the grounds of truth.
  - **Relation at stake**: Structural resonance (if integrationists argue that there's an isomorphism between the downgrading of the psychological in logic and the downgrading of certain human groups in politics) and possibly upstream causation (if the political views shaped the philosophical stance).
  - **Bearing at stake**: Evidential (for the interpretation of anti-psychologism) and motivational (why Frege held the view).
  - **Case/argument both agree would bear on it**: Examining Frege's published and unpublished writings to see if he explicitly links anti-psychologism to any political or ethical considerations, and analyzing the arguments he gives for anti-psychologism to see if they rely on premises that might be connected to his political views.
  - **Predictions**:
     - Separatists predict: No connection will be found; anti-psychologism is argued for on purely logical and metaphysical grounds.
     - Integrationists predict: There will be implicit connections, such as a shared pattern of devaluing the contingent and subjective (like psychology) and the particular (like certain human groups).
  - **Evidence against each position**:
     - Against separatism: Discovery of a text where Frege explicitly ties his anti-psychologism to his political views, or a clear argumentative reliance in his philosophy on premises that are also present in the diary.
     - Against integrationism: The absence of any such textual or argumentative link, and the presence of arguments for anti-psychologism that are entirely independent of any political considerations.
  - **Agreed non-settlers**: The mere fact that the diary exists does not, by itself, settle the matter. Also, the fact that Frege held both views does not prove a connection.
  - **Verbal dispute?**: Both sides agree that the dispute about the nature of anti-psychologism (grounds vs. subject matter) is not merely verbal; it is substantive and can be resolved by textual evidence.

  *Crux 2: The independence of thoughts and the downgrading of human groups*

  - **Issue**: Does Frege's view that thoughts (abstract propositions) exist independently of any thinker, and that thinkers are merely the vehicles for grasping them, parallel his political view that certain human groups are inferior and should be excluded from participation in society? Does this structural parallel reveal a deeper connection?
  - **Relation at stake**: Structural resonance (isomorphism) and possibly downstream causation (if the philosophy leads to the politics).
  - **Bearing at stake**: Motivational (if the philosophy provided a model for the politics) and truth/justification (if the political views undermine the philosophy by revealing problematic assumptions).
  - **Case/argument both agree would bear on it**: Comparing the logical role of the thinker in Frege's philosophy with the role of the individual (or group) in his political views, and looking for shared patterns of reasoning (e.g., de-emphasis on the individual, emphasis on abstract universals). Also, examining whether Frege ever draws such a parallel himself.
  - **Predictions**:
     - Separatists predict: The two domains are distinct; the structure in the philosophy is about abstract entities and has no bearing on concrete human relations.
     - Integrationists predict: There is a structural parallel that reflects a deeper worldview, which devalues the particular and contingent in favor of the universal and necessary.
  - **Evidence against each position**:
     - Against separatism: Discovery of a text where Frege explicitly connects his views on the independence of thoughts to his political views, or a clear pattern of reasoning that is shared and essential to both.
     - Against integrationism: The absence of any such connection, and the presence of alternative explanations for the political views (e.g., common prejudices of the time) that do not relate to the philosophy.
  - **Agreed non-settlers**: The fact that one might independently hold both views without inconsistency does not prove or disprove a connection. Also, the fact that Frege held both views does not by itself establish a link.
  - **Verbal dispute?**: Both sides agree that the dispute is not verbal; it is about whether there is a meaningful structural parallel.

  *Crux 3: The relation between politics and philosophy*

  - **Issue**: What is the nature of the relation (if any) between the political views in the diary and Frege's philosophical work? We consider the four relations: upstream, downstream, common cause, structural resonance.
  - **Bearing at stake**: All four senses (evidential, motivational, truth/justification, pedagogical).
  - **Case/argument both agree would bear on it**: A thorough examination of Frege's entire corpus, including unpublished writings and correspondence, to see if there are any causal links, shared sources, or structural parallels. Also, historical context: Were there contemporary figures who held similar political views and similar philosophical views? Were there figures who held one without the other?
  - **Predictions**:
     - Separatists predict: The evidence will show no significant relation; the diary is an isolated late-life document. They assert that the relation is either non-existent or only structural resonance without any causal or justificatory bearing, and that any resonance is coincidental.
     - Integrationists predict: The evidence will show a relation, most likely structural resonance and possibly upstream causation or common cause. They assert that the relation is philosophically significant and that the structural resonance is non-coincidental.
  - **Evidence against each position**:
     - Against separatism: Discovery of early texts showing political views similar to the diary that predate or are contemporary with his major philosophical works, or a clear instance where a philosophical argument relies on a premise that also supports the political views.
     - Against integrationism: The absence of any such links, and the demonstration that Frege's philosophical views were developed in complete isolation from his political views, with no shared patterns.
  - **Agreed non-settlers**: The mere co-occurrence of the views in the same person does not prove a connection. Also, the fact that some philosophers with similar philosophical views did not hold such political views (and vice versa) does not disprove a connection in Frege's case.
  - **Verbal dispute?**: Both sides agree that the dispute about the type of relation is substantive and not merely verbal.

  *Crux 4: The bearing on teaching, commemoration, and moral assessment*

  - **Issue**: How should the diary affect how we teach Frege's philosophy, commemorate him, and morally assess him as a philosopher?
  - **Bearing at stake**: Pedagogical/commemorative.
  - **Case/argument both agree would bear on it**: Discussing the pedagogical goals of teaching Frege (e.g., teaching the history of ideas, critical engagement with texts) and the ethical responsibilities of commemoration (e.g., not honoring harmful ideologies). Also, considering how other figures with similar issues are handled.
  - **Predictions**:
     - Separatists predict: The diary should be mentioned as a biographical note but kept separate from the philosophical content. It does not affect the teaching of his philosophy, which should be evaluated on its merits. Commemoration should focus on his philosophical achievements.
     - Integrationists predict: The diary must be integrated into the teaching of Frege to provide a full picture of his thought and to critically examine the potential connections. Commemoration should be qualified by acknowledging the moral failings, and moral assessment must include the totality of his legacy.
  - **Evidence against each position**:
     - Against separatism: If it is shown that ignoring the diary leads to a distorted understanding of Frege's philosophy (e.g., missing motivations or implications), then separatism would be pedagogically inadequate.
     - Against integrationism: If it is shown that integrating the diary distracts from the philosophical content without adding insight, then integrationism would be pedagogically counterproductive.
  - **Agreed non-settlers**: The fact that the diary is morally reprehensible is agreed, but how that affects pedagogy and commemoration is not settled by that fact alone.
  - **Verbal dispute?**: Both sides agree that the dispute is not verbal; it is about values and pedagogical strategies.

  ---

  This document represents the current state of the adversarial collaboration. Both sides commit to continuing the investigation in light of the agreed cruxes and to revising their positions in response to new evidence.

