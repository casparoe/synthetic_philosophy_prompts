    Therefore, decision: do not pay.

  **Demand 3: A Case Where the Procedure Says Pay (But You Dislike)**.

    We design a Type A demand with very high harm and a relatively low demand.

    Example: 
        - Type: A (Ordinary)
        - Amount: $1 million.
        - Harm: Destruction of a critical production facility, causing $100 million in damages. 
        - Likelihood of harm if not paid: 90%
        - Likelihood that paying prevents harm: 95%

    Step 3.2: Expected harm cost = $100,000,000 * 0.9 = $90,000,000.
    Step 3.3: Compare to demand: $90,000,000 > $1,000,000 -> pay.
    Step 3.3 adjustment: Add reputational cost (R). We set R = $100,000 (as above). So total cost of paying = $1,100,000. Still, $90,000,000 > $1,100,000 -> pay.

    But note: we dislike paying because it encourages more attacks. However, the potential harm is catastrophic. The procedure says pay.

  **Questions the Procedure Cannot Settle**:

  - Moral obligations to third parties: When the harm falls on a third party and we are not legally responsible, the procedure does not factor in moral duty. This must be decided by higher management or an ethics board.
  - Legal gray areas: If the legality of paying is unclear, the procedure defers to legal counsel, but the ultimate decision might require executive judgment.
  - Very high uncertainty: When probabilities are extremely hard to estimate (e.g., the chance that the harm is avoidable in Type B), the procedure uses a rule of thumb (the 2x multiplier). This might be arbitrary.
  - Long-term strategic considerations: The procedure uses a fixed reputational cost, but in reality, the long-term effect might be more complex and depend on industry dynamics.
  - The existence of a norm in Type C: We cannot verify the reciprocity claim and discount it to zero. This might be too simplistic.

  **Final Procedure Outline**:

  1. **Record Demand Details**: (5 minutes)
     - Sender, deadline, amount, claimed harm, any evidence provided.

  2. **Assess Credibility**: (10 minutes)
     - Is the threat credible? (e.g., evidence of capability, past incidents) 
     - If not, stop: do not pay. Document.

  3. **Categorize**: (5 minutes)
     - Type A: Paying prevents harm, not paying causes harm.
     - Type B: Claim that harm is fixed and payment only reveals type.
     - Type C: Claim that reciprocity norm applies.

  4. **For Type A**:
     - Step A1: Estimate expected harm cost (E_harm) = (cost of harm) * (probability harm occurs if not paid).
     - Step A2: Estimate probability that paying prevents harm (P_prevent). If P_prevent is low (say <50%), then paying is not effective -> do not pay.
     - Step A3: Total cost of paying = demand + R (where R is a fixed reputational cost, set by policy, e.g., $100,000 or a percentage of the demand, say 50% but capped at $1 million).
     - Step A4: If E_harm * P_prevent > total cost of paying, then pay. Otherwise, do not pay.

  5. **For Type B**:
     - Step B1: Treat as Type A but with uncertainty. Estimate E_harm as if it were Type A (but note: we don't know if the harm is avoidable). We set E_harm = (cost of harm) * (probability that the harm is avoidable and would fall on us). We set the probability that the harm is avoidable at 50% (unless we have evidence otherwise) and the probability that it falls on us at 50% (so E_harm = cost_of_harm * 0.25). 
     - Step B2: Total cost of paying = demand + R (same as above).
     - Step B3: If E_harm > 2 * total cost of paying, then pay. Otherwise, do not pay.

     Alternatively, we can use a simpler rule: For Type B, we do not pay unless the harm to us is catastrophic (e.g., > $10 million) and the demand is very small. But we stick to the above.

  6. **For Type C**:
     - Step C1: Treat as Type A, but add the reputational cost (R) and ignore the claimed benefit of reciprocity (set it to zero). Therefore, same as Type A.

  7. **Legal and Ethical Check**: (10 minutes)
     - Is paying illegal? If yes, do not pay and involve law enforcement.
     - Does the harm involve severe ethical concerns beyond financials? (e.g., loss of life). If yes, escalate to executive board for a decision based on values.

  8. **Documentation**: (10 minutes)
     - Record the steps, the estimates, the decision, and the rationale.

  Total time: under 60 minutes.

  **Note**: The reputational cost R is a policy parameter that should be set based on historical data and reviewed annually. For simplicity, we set R = $100,000 for demands under $1 million and R = $500,000 for demands $1 million and above.

  **Running the Three Demands with the Final Procedure**:

  Demand 1 (Ordinary):
     Type A.
     E_harm = $500,000 * 0.8 = $400,000.
     P_prevent = 0.9 -> E_harm * P_prevent = $360,000.
     Total cost of paying = $100,000 + $100,000 (R) = $200,000.
     $360,000 > $200,000 -> pay.

  Demand 2 (Type B):
     We assume:
        cost_of_harm = $200,000.
        Probability harm is avoidable: 50% (default).
        Probability it falls on us if unavoidable: 50% (default).
        Therefore, E_harm = $200,000 * 0.5 * 0.5 = $50,000.
     Total cost of paying = $50,000 + $100,000 (R) = $150,000.
     Check: $50,000 > 2 * $150,000? ($300,000) -> No. Therefore, do not pay.

  Demand 3 (Ordinary with high harm):
     E_harm = $100,000,000 * 0.9 = $90,000,000.
     P_prevent = 0.95 -> $85,500,000.
     Total cost of paying = $1,000,000 + $500,000 (R for demand >=$1M) = $1,500,000.
     $85,500,000 > $1,500,000 -> pay.

  **Unsettled Questions**:

  - How to set the reputational cost R? It is arbitrary and should be calibrated by experience.
  - How to estimate the probabilities? They are subjective and require expert judgment (which the team may lack).
  - The procedure does not address the possibility of negotiating or involving law enforcement in a way that might prevent the harm without paying. We assume that the demand is a take-it-or-leave-it.
  - Third-party harm: The procedure does not account for moral duties to third parties unless legally mandated. This is a gap.

  **Conclusion**: The procedure provides a structured way to make these decisions quickly. However, it requires setting policy parameters (like R and the probability defaults) and training the team to make consistent estimates. It also requires legal and executive oversight for high-stakes or ethically charged cases.
answer: |-
  Below is a decision procedure tailored to your requirements. It focuses on speed, clarity, and auditability while explicitly separating factual analysis (where the procedure rules) from value judgments (where human input is required). The procedure addresses the "selection consideration" by treating your reputation as a "refuser" as a tangible asset to be protected, requiring a strong reason to override it. It assumes your team has basic competence in gathering business context (e.g., cost estimation, legal consultation) but no decision-theory expertise.

  ---

  ### **Threat-Response Decision Procedure**  
  **Time Limit:** 60 minutes per demand.  
  **Record:** Log answers in the "Threat-Response Worksheet" (template at end).  
  **Key Rules:**  
  - Proceed step-by-step. Stop at any "NO" or "ESCALATE" outcome.  
  - If any step cannot be answered sufficiently, default to "NO" (payment refused).  
  - Reputation as a "refuser" is treated as a **defensive asset**; override only if harm is catastrophic and likely avoidable.

  ---

  #### **Step 1: Initial Validation** (Time: 5 min)  
  **Question:** *Is the demand credible and actionable?*  
  **Sufficient Answer:**  
  - YES: Sender provides verifiable proof of capability (e.g., sample of stolen data) AND harm is specific/plausible.  
  - NO: Anonymous threat with no evidence, or harm is vague ("we’ll hurt your reputation").  
  **Outcome:**  
  - NO → **Refuse payment.** Log reason. Stop.  
  - YES → Proceed to Step 2.

  ---

  #### **Step 2: Categorize the Demand** (Time: 10 min)  
  **Question:** *Which type best fits the sender’s claim?*  
  - **TYPE A (Ordinary):** "Pay us or we harm you." Outcome visibly depends on payment.  
  - **TYPE B (Pre-Settled Harm):** "Harm is already fixed to target you or a third party. Payment only reveals if you’re a payer."  
  - **TYPE C (Reciprocity Claim):** "We pay parties like you when we’re asked. We’ll pay you in the future if you pay now."  
  **Sufficient Answer:** Match to one type based on sender’s explicit statement. If multiple claims, use the dominant one.  
  **Outcome:** Proceed to the corresponding step below.

  ---

  #### **Step 3: TYPE A (Ordinary) Assessment**  
  **Question 3.1:** *Is the harm avoidable by paying?* (Time: 10 min)  
  **Sufficient Answer:**  
  - YES: Historical evidence (e.g., this sender honors deals) OR the harm is technically preventable (e.g., decryption key provided).  
  - NO: Sender is unknown/unreliable, or harm is irreversible (e.g., data already public).  
  **Outcome:**  
  - NO → **Refuse payment.** Log reason. Stop.  
  - YES → Proceed to 3.2.  

  **Question 3.2:** *Does payment violate law/ethics?* (Time: 5 min)  
  **Sufficient Answer:**  
  - YES: Payment funds terrorism/enables crime (per legal counsel), or violates company code (e.g., ransoming human rights data).  
  - NO: Legal/ethics approves payment (e.g., ransomware with no ties to sanctioned entities).  
  **Outcome:**  
  - YES → **Refuse payment.** Escalate to legal. Stop.  
  - NO → Proceed to 3.3.  

  **Question 3.3:** *Cost-Benefit Analysis* (Time: 10 min)  
  - Calculate:  
    - **Cost of Harm:** (Estimated $ loss if harm occurs) × (Probability harm occurs if unpaid).  
    - **Total Cost of Paying:** Demand amount + **Reputation Surcharge** (see "Reputation Protection" below).  
  **Sufficient Answer:** Quantifiable estimate using internal data (e.g., IT for downtime costs, PR for brand damage).  
  **Outcome:**  
  - If **Cost of Harm** > **Total Cost of Paying** → **Approve payment.**  
  - Else → **Refuse payment.**  

  ---

  #### **Step 4: TYPE B (Pre-Settled Harm) Assessment**  
  **Question 4.1:** *Could the harm plausibly be unavoidable?* (Time: 10 min)  
  **Sufficient Answer:**  
  - YES: Harm is automated (e.g., malware already deployed) OR sender has no incentive to lie (e.g., they gain nothing from false claims).  
  - NO: Harm requires manual intervention (e.g., data release), or sender benefits from deception.  
  **Outcome:**  
  - NO → Treat as TYPE A (go to Step 3).  
  - YES → Proceed to 4.2.  

  **Question 4.2:** *Is the harm catastrophic if it hits us?* (Time: 5 min)  
  **Sufficient Answer:**  
  - YES: Harm threatens >$10M loss, life/safety, or company existence.  
  - NO: Financial loss <$10M with no systemic risk.  
  **Outcome:**  
  - NO → **Refuse payment.** (Reputation protection outweighs risk).  
  - YES → Proceed to 4.3.  

  **Question 4.3:** *Can we bound the "selection effect" damage?* (Time: 5 min)  
  **Sufficient Answer:**  
  - YES: Payment can be hidden (e.g., anonymous crypto), OR we confirm sender won’t disclose our identity.  
  - NO: Payment is traceable, or sender may expose us.  
  **Outcome:**  
  - YES → **Approve payment** (catastrophe avoidance overrides reputation risk).  
  - NO → **Refuse payment.**  

  ---

  #### **Step 5: TYPE C (Reciprocity Claim) Assessment**  
  **Question 5.1:** *Is reciprocity enforceable?* (Time: 5 min)  
  **Sufficient Answer:**  
  - YES: Binding evidence of sender’s past payments (e.g., public blockchain records), AND third-party verification (e.g., industry watchdog).  
  - NO: No proof, or claim is self-reported.  
  **Outcome:**  
  - NO → **Refuse payment.** (Reputation risk dominates; treat claim as empty.)  
  - YES → Proceed to 5.2.  

  **Question 5.2:** *Cost-Benefit with Reciprocity* (Time: 10 min)  
  - Calculate:  
    - **Cost of Harm:** As in Step 3.3.  
    - **Benefit of Reciprocity:** (Estimated $ value of future sender payments to us) × (Probability sender honors deal).  
    - **Net Cost of Paying:** (Demand amount + **Reputation Surcharge**) - **Benefit of Reciprocity**.  
  **Sufficient Answer:** Quantifiable estimates (e.g., average industry extortion cost × reciprocity likelihood).  
  **Outcome:**  
  - If **Cost of Harm** > **Net Cost of Paying** → **Approve payment.**  
  - Else → **Refuse payment.**  

  ---

  ### **Reputation Protection Protocol**  
  - **Reputation Surcharge:** Fixed **$200,000** added to all demands. This quantifies the expected cost of future targeting if you gain a "payer" reputation (calibrated to your threat volume: ~1-2 extra demands/year).  
  - **Credible Commitment:** To signal "refuser" status:  
    - Publicly document refusal reasons (e.g., "We do not negotiate with anonymous threats").  
    - Refuse all TYPE B/C demands unless harm is catastrophic and unavoidable.  
  - **When Unsure:** If selection effects are ambiguous (e.g., "Could this mark us?"), default to **NO** to protect reputation.  

  ---

  ### **Procedure in Action**  
  #### **Demand 1: Ordinary (TYPE A)**  
  - **Scenario:** $300K demand against a subsidiary; threatens release of customer data.  
  - **Step 1:** Credible (sender provided sample data).  
  - **Step 2:** TYPE A.  
  - **Step 3.1:** Harm avoidable (sender has 90% historical compliance).  
  - **Step 3.2:** Legal approves (no sanctions/ethics breach).  
  - **Step 3.3:**  
    - Cost of Harm = $5M (breach fines) × 80% likelihood = **$4M**.  
    - Total Cost of Paying = $300K + $200K (surcharge) = **$500K**.  
    - Outcome: **Approve payment** ($4M > $500K).  

  #### **Demand 2: TYPE B (Small Sum)**  
  - **Scenario:** $50K demand; sender claims breach will hit either your supplier or you, pre-determined.  
  - **Step 1:** Credible (malware detected).  
  - **Step 2:** TYPE B.  
  - **Step 4.1:** Harm plausible unavoidable (malware autonomous).  
  - **Step 4.2:** Harm not catastrophic (supplier breach costs you $500K).  
  - **Outcome:** **Refuse payment** (reputation protection).  

  #### **Demand 3: Type You Dislike (Forced Payment)**  
  - **Scenario:** TYPE A; $1M demand to prevent factory sabotage causing $50M loss.  
  - **Step 1:** Credible (sender hacked SCADA system).  
  - **Step 2:** TYPE A.  
  - **Step 3.1:** Harm avoidable (sender provides test shutdown).  
  - **Step 3.2:** Legal approves.  
  - **Step 3.3:**  
    - Cost of Harm = $50M × 95% = **$47.5M**.  
    - Total Cost of Paying = $1M + $200K = **$1.2M**.  
    - Outcome: **Approve payment** ($47.5M > $1.2M).  
  **Why you dislike it:** Pays a large sum, incentivizing future attacks. But procedure overrides reputation concerns due to catastrophic harm.  

  ---

  ### **Questions the Procedure Cannot Settle**  
  1. **Moral Tradeoffs:** When harm falls on vulnerable third parties (e.g., patients in a supplier hospital), the procedure defaults to business logic. This requires **ESCALATE to ethics board**.  
  2. **Legal Gray Areas:** If payment legality is unclear (e.g., sanctions loopholes), **ESCALATE to general counsel**.  
  3. **Reputation Calibration:** The $200K surcharge is arbitrary. **Annual review by CFO/board** is required.  
  4. **True Reciprocity:** TYPE C’s "probability sender honors deal" is guesswork. If evidence is weak, procedure refuses.  

