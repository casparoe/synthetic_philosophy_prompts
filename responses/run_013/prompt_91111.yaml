prompt: |-
  I run a four-person threat-response office at a firm of about four thousand employees. We receive roughly a dozen credible extortion demands a year: a party claims to hold material or to be able to harm us, names a price, and sets a deadline of twenty-four to seventy-two hours. The sums run from fifty thousand to five million, and the consequences often fall on people who are not parties to the dispute — customers, employees, a supplier. Most demands are ordinary, in the sense that paying or refusing visibly changes what happens next. Two recurring shapes are not, and I have no procedure for them.

  In the first, the demand arrives with the claim that the sender has already settled, by a process we cannot observe, whether the harm lands on us or on an unrelated third party, and that the price is the same either way. On that account our answer cannot change whether we are harmed at all; it can only determine whether we turn out to be the sort of party who pays. In the second, the note claims that the sender pays parties like us in the situations where it does not ask us for money, and that whether it pays us then depends on what we would do now, if it asked. We cannot check the claim and cannot afford to dismiss it.

  Our outside advisor says that in both shapes my decision cannot affect today's outcome, and that what it can affect is which of these situations we keep being placed in, because the senders are selecting for a particular kind of responder — and that people who study decisions disagree about whether that consideration is a reason or a confusion.

  Please write a decision procedure my office can actually run. Fix the questions we ask, in order; what counts as a sufficient answer to each; where the procedure stops with a no; and where it hands the decision to a person because the question is one of values or law rather than decision theory. It must be runnable in under an hour by people with no formal training in the area, produce a written record the board can read, and be honest about which steps are judgments dressed up as procedure. Address in particular what it should do about the selection consideration: whether to treat being the kind of party who refuses as an asset to be protected, how a commitment can be made credible when the only party we can bind is ourselves, and what to do when the honest answer is that we do not know whether the consideration applies.

  Then run it on three demands: an ordinary pay-or-we-release demand against a subsidiary; the first of the two shapes above, where the sum is small; and a case in which the procedure tells us to pay, which I expect to dislike. Close with the questions the procedure cannot settle at all.
reasoning: |-
  We are designing a decision procedure for a threat-response office facing extortion demands. The procedure must be runnable in under an hour by non-experts, produce a written record, and clearly separate factual and value judgments.

  The procedure will have the following steps:

  1. **Initial Assessment**: Collect and record the details of the demand (sender, deadline, amount, claimed harm, etc.). Verify authenticity and credibility (if possible within time constraints). If the demand is not credible, stop and document "no" (do not pay). Otherwise, proceed.

  2. **Categorize the Demand**: Determine which of the three types the demand falls into:
     - **Type A (Ordinary)**: Paying prevents the harm; not paying results in harm.
     - **Type B (First Recurring Shape)**: The sender claims that the harm is already determined (either on us or a third party) and our payment only reveals our type.
     - **Type C (Second Recurring Shape)**: The sender claims that whether we get paid in future (if we are in the sender's position) depends on our current decision.

  3. **For Type A (Ordinary Demand)**:
     - Step 3.1: Assess the harm. If the harm is illegal (e.g., release of stolen data that violates privacy laws) or poses a severe threat to life, notify legal authorities and follow their guidance (this may override the rest). Otherwise, proceed.
     - Step 3.2: Estimate the cost of harm (financial, reputational, etc.) and the likelihood of harm occurring if not paid. Also, consider the likelihood that paying will actually prevent the harm (sometimes paying does not guarantee prevention).
     - Step 3.3: Compare the cost of harm (adjusted by likelihood) to the demand amount. If the expected cost of harm is greater than the demand, then pay. Otherwise, do not pay.
     - Step 3.4: Document the decision and rationale.

  4. **For Type B (First Recurring Shape)**:
     - Step 4.1: Acknowledge that the decision to pay or not does not affect the harm (as per the claim). The harm is already set to occur either to us or to a third party. However, we must consider the selection effect: paying may mark us as a payer and invite more demands.
     - Step 4.2: We treat the decision as a signal of our type. We want to avoid being seen as a payer to reduce future targeting. Therefore, we should refuse unless there is a compelling reason to pay (e.g., if the harm to the third party is catastrophic and we have a moral duty, but note that the harm is already set and our payment does not change it). However, note that the sender may be lying about the harm being fixed. We cannot verify, so we must consider the possibility that the harm might be avoidable by paying (i.e., the demand might be Type A in disguise). 
     - Step 4.3: Because we cannot verify the claim, we must treat it as a potential Type A demand. Therefore, we fall back to the Type A procedure (Step 3) but with an adjustment: we include the reputational cost of being seen as a payer (which might lead to more future demands) as part of the cost of paying. Specifically:
          - If we pay, we may incur additional future costs due to being targeted more. We assign an estimated cost of future targeting (e.g., based on historical frequency and cost of demands) multiplied by the likelihood that paying increases targeting (which we might set at a high level, say 50-100% increase in frequency). This cost is added to the demand amount to get the total cost of paying.
          - Then, compare the total cost of paying to the expected cost of harm (if we don't pay). If the expected harm cost is still higher, then pay. Otherwise, do not pay.
     - Step 4.4: If the expected harm cost is not clearly higher (or if we are unsure about the harm being unavoidable), we default to not paying to protect our reputation and avoid encouraging future demands.

  5. **For Type C (Second Recurring Shape)**:
     - Step 5.1: The claim is that the sender's behavior in the future (if we are in the sender's position) depends on our current action. This is an attempt to invoke reciprocity or a similar norm. However, we have no way to verify the claim and cannot rely on it.
     - Step 5.2: We note that this demand is essentially trying to set a precedent for a norm. If we pay, we are reinforcing the norm that parties in our position pay, which might lead to more demands in the future. If we don't pay, we break the norm and might be excluded from receiving payments in the future if we were to be in the sender's position. However, we cannot know if the sender will honor this norm, and the norm might not be in our long-term interest.
     - Step 5.3: We treat this as a Type A demand (Step 3) but with an adjustment for the long-term effects of setting a precedent. We consider:
          - The cost of setting a precedent: paying might encourage more such demands (reputational cost as in Type B) and also reinforce a norm that we might not want to support. We assign an estimated cost for this (similar to Type B).
          - The benefit: if we pay, we might (if the norm is real) be eligible for payments in the future when we are in the sender's position. However, we cannot quantify this benefit because we don't know if the norm exists or if we will ever be in that position. Therefore, we discount this benefit to zero.
          - Therefore, we add the reputational cost (as in Type B) to the demand amount and then compare to the expected harm cost. If the expected harm cost is higher, pay. Otherwise, do not pay.

  6. **Common Steps for All Types**:
     - Step 6.1: If at any point the demand involves illegal activity (e.g., ransomware, data breach) or if the harm is severe and criminal, we must involve law enforcement and follow their advice. This step might override our decision.
     - Step 6.2: If the decision is to pay, we must also consider the legal implications (e.g., is paying the extortion illegal?) and obtain legal approval. If paying is illegal, we do not pay and instead involve law enforcement.
     - Step 6.3: Document the entire process, including the categorization, the assessments made, and the decision.

  **Addressing the Selection Consideration**:
  - We treat being the kind of party who refuses as an asset because it deters future demands. We protect this asset by defaulting to refusal in ambiguous cases (Type B and Type C) unless the expected harm cost (including potential harm to third parties) is overwhelming and we are reasonably sure that payment would prevent harm (i.e., when we suspect the demand might be Type A in disguise).
  - Making a commitment credible: We can only bind ourselves. Therefore, we must establish a consistent pattern of behavior. The procedure itself, by including the reputational cost in the calculation, will lead to refusal in borderline cases. We document our refusals to build a record that we are not an easy target. However, we must be flexible enough to pay when the harm is too great (to avoid catastrophic losses).
  - When we do not know whether the selection consideration applies (e.g., we are unsure if the demand is Type A or Type B), we treat it as Type A but with an added reputational cost (as in Step 4.3). This will make us less likely to pay in uncertain situations, which protects our reputation.

  **Running the Procedure on Three Demands**:

  **Demand 1: Ordinary pay-or-we-release against a subsidiary.**
  - Type: A (Ordinary)
  - Steps:
    1. Initial Assessment: Credible demand. Deadline 48 hours. Amount: $100,000. Harm: Release of sensitive data about the subsidiary's operations, which would cause reputational damage and potential loss of contracts. Estimated harm: $500,000. Likelihood of harm if not paid: 80%. Likelihood that paying prevents harm: 90% (because the sender has a track record of keeping their word).
    2. Step 3.2: Expected cost of harm = $500,000 * 0.8 = $400,000. Cost of paying = $100,000. Since $400,000 > $100,000, and paying is likely to prevent harm, we proceed to pay.
    3. Step 3.3: We also consider that paying might invite future demands. We add a reputational cost (estimated at $10,000 per future demand, and we expect 1 extra demand per year for 2 years, so $20,000). Total cost of paying = $120,000. Still, $400,000 > $120,000 -> pay.
    4. Step 6.2: Legal review: paying is not illegal in this jurisdiction. Therefore, decision: pay.

  **Demand 2: First recurring shape (Type B), small sum ($50,000).**
  - Claim: The harm (a data leak affecting 100 customers) is already set to occur either to us or to an unrelated third party. Our payment does not prevent the harm but only shows our type.
  - Steps:
    1. Initial Assessment: Credible? We cannot verify the claim, so we treat it as potentially Type A in disguise. Harm: data leak. Estimated harm to us: $200,000 (reputational damage, legal costs). If the harm lands on a third party, we have no direct cost, but we have a moral concern. However, the procedure does not factor in moral concerns for third parties unless legally required (e.g., data protection laws). We are not legally responsible if the third party is harmed? (Assume not in this case.) Therefore, the expected harm to us if we don't pay: if the harm lands on us (50% chance? we don't know) then $200,000, else $0. But the sender claims the harm is fixed and we cannot change it. We are skeptical.
    2. Step 4.3: We treat as Type A but with added reputational cost. We assume a 50% chance that the harm is avoidable (i.e., that the demand is actually Type A). Then:
          - If we don't pay, expected harm = 0.5 * $200,000 = $100,000.
          - Cost of paying = $50,000 + reputational cost (we use the same $20,000 as above) = $70,000.
          - Compare: $100,000 > $70,000 -> pay? 
    3. But note: the reputational cost is incurred even if we pay when the harm is unavoidable (because we are still seen as a payer). Therefore, we might break it down:
          - Scenario 1 (50%): The harm is avoidable (Type A). If we pay, we prevent harm and cost $50,000 plus $20,000 rep = $70,000. If we don't pay, we incur harm of $200,000.
          - Scenario 2 (50%): The harm is unavoidable (Type B). If we pay, we cost $50,000 plus $20,000 rep = $70,000 and the harm occurs (either to us or third party). If we don't pay, we cost $0 and the harm occurs (to us or third party). In this scenario, we prefer not to pay.
          - Therefore, expected cost of paying: $70,000 (in both scenarios).
          - Expected cost of not paying: 0.5 * $200,000 + 0.5 * $0 = $100,000.
          - So, paying has an expected cost of $70,000 vs not paying $100,000 -> pay.
    4. However, we must consider the chance that the harm lands on us in Scenario 2 (Type B). The sender says it's already settled. If we are the ones who are going to be harmed, then in Scenario 2 (if we don't pay) we incur $200,000. If we pay, we still incur the harm? But the sender says we cannot change the harm. So if we are the target, we get harmed regardless. Therefore, in Scenario 2 (Type B) the cost to us is $200,000 if we are the target, and $0 if we are not. We don't know the probability that we are the target. Let's assume 50% (since the sender says it's settled arbitrarily). Then in Scenario 2, if we don't pay, expected cost = 0.5 * $200,000 = $100,000. If we do pay, we still have the same harm (so $100,000) plus the payment and rep cost -> $170,000. This changes the calculation:
          - Scenario 1 (50%): Avoidable harm (Type A). 
              - Pay: $70,000 (prevents harm)
