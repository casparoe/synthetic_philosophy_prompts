  ### **Threat-Response Worksheet Template**  
  ```markdown
  ## Demand ID: [ID] | Date: [Date] | Assessor: [Name]  
  **Step 1: Validation**  
  - Credible?: [YES/NO]  
  - Reason: [Brief summary]  

  **Step 2: Category**  
  - Type: [A/B/C]  

  **Type-Specific Steps:**  
  - [Relevant questions/answers, e.g., "3.1: Avoidable? YES"]  
  - Calculations: [e.g., "Cost of Harm: $5M × 80% = $4M"]  

  **Decision:** [APPROVE/REFUSE/ESCALATE]  
  **Reason:** [e.g., "Catastrophic harm overrides rep surcharge"]  

  **Reputation Surcharge Applied:** [$200K]  
  ```  

  This procedure ensures defensible decisions, protects your "refuser" reputation, and flags value judgments for escalation. It works because it forces quantification (even if imperfect) and defaults to conservatism when facts are unclear.
