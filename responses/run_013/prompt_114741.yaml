cally worse — so the word "rational" is doing no work and the phenomenon he's complaining about is exactly the one she's defending. Mel said no, the labels do work, because "irrational" tells you the cure is to make people think harder, and "rational-but-badly-incentivised" tells you the cure is to change the information environment or the payoffs, and those are completely different prescriptions.

