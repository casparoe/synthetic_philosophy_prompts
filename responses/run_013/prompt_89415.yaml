  I've got a friend, Dana, who's spent years being the "fine, you decide" person for small business breakups — two partners, one pile of money, she writes the split and both sides are stuck with it. Her record, as best I remember it:

  - $80k in the bank, no fallbacks for either of them: she wrote $40k/$40k.
  - $100k, but one partner had a standing job offer worth $20k if she walked and the other had nothing: she gave the one with the offer $60k and the other $40k.
  - Same thing the other way around, $30k walk-away offer: $35k/$65k, bigger half to the one with the offer.
  - $60k, with fallbacks of $25k and $5k: $40k/$20k.
  - $200k, fallbacks of $150k and $0: $175k/$25k.

  So the shape of it seems to be: everyone gets their fallback, then the rest down the middle. Now the new one, which is a different kind of case and is why I'm asking at all. There's $100k in the bank, plus one thing that isn't cash — the name and the lease on the bakery. It can't be sold to a stranger, so it's only worth what it's worth to them. Ann says having it is worth $90k to her; Ben puts it at $10k and has said he'd just shutter it. Neither of them has a fallback worth anything, so if they dont sign, the whole thing goes to lawyers and they net zero.

  My brother-in-law, who has an econ degree and talks about this stuff constantly, says Dana is running the Kalai-Smorodinsky solution and that it will definately not give the same answer as Nash here. My actual economist friend says it's just Nash and always was, and that the brother-in-law is doing his thing again. I don't know what the difference is between them.

  So: what do you think she writes? What rule or rules actually fit her record, what does each of those say about the bakery, and which one would you put money on, and why? And if her past calls genuinely can't tell the difference between the candidates, say that rather than pretending they can — and tell me what case I could put in front of her that would actually settle it.
