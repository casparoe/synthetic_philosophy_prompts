answer: |-
  ## Proposed Summer Research: The Constraint Laundry - Auditing Form-Driven Invention in Poetic Translation

  **Title:** Classifying Constraints, Auditing Invention: How Formal Demands Launder Translator Choice in Fixed-Form Poetry  
  **Question:** How do the formal constraints of fixed-form poetry translation, classified as load-bearing or decorative based on source-target language dynamics, necessitate specific word choices ("laundering invention"), and can a replicable audit protocol reliably distinguish these necessitated choices from translator license?

  **Background (approx. 150 words):**
  Translation studies acknowledge form's significance but lack consensus on *which* formal elements are essential versus ornamental in specific linguistic transitions. Debates persist around fidelity (sense-for-sense vs. word-for-word) and equivalence, often treating form monolithically as "part of meaning." While translators frequently note constraints driving specific choices in commentaries or footnotes, these annotations are anecdotal, inconsistent, and inaccessible to readers of the final text. Crucially, there is no systematic method to identify, within the translated text itself, which words were *required* by formal demands (e.g., rhyme, meter) versus those freely chosen to convey semantic or aesthetic content. The hypothesis that constraint necessity varies with the prosodic resources of the target language relative to the source remains underexplored empirically. This project addresses this gap by developing a classification system for constraints and an audit protocol for word-choice provenance.

  **The Question (Precise Statement & Answer Criteria) (approx. 200 words):**
  This project asks two precise, interlinked questions:
  1.  **Constraint Classification:** For a given source poem (French fixed-form) and target language, which formal constraints (e.g., rhyme scheme, specific meter, syllable count, line count) are *load-bearing* (their abandonment fundamentally alters the poem's generic identity) versus *decorative* (their abandonment degrades quality but preserves the generic identity), and how does this classification depend on the prosodic affordances of the target language relative to French?
      *   *Answer Criteria:* A constraint is load-bearing if its removal consistently leads independent coders (using predefined genre definitions) to classify the result as a different poetic form (e.g., sonnet -> non-sonnet). Decorative constraints show degradation but no categorical shift. Evidence of dependence: Classification differing for the *same* constraint when applied to different target languages.
  2.  **Invention Auditing:** Using a defined protocol, can independent coders reliably categorize each consequential word choice in constrained translations as: a) *Necessitated* (solely by formal constraint, unsupported by source semantics), b) *Licensed* (semantically justified by source, no constraint pressure), c) *Both*, or d) *Neither*? Does the "laundering" effect occur (i.e., are necessitated choices indistinguishable from licensed ones to naive readers)?
      *   *Answer Criteria:* Inter-coder reliability (e.g., Cohen's Kappa > 0.7) validates the protocol. Evidence of laundering: Naive readers in a blind study attributing necessitated choices to the author at rates similar to licensed choices.

  **Why Obvious Approaches Leave It Open (approx. 250 words):**
  Existing frameworks fail to resolve these questions satisfactorily:
  *   **Sense-for-Sense vs. Word-for-Word:** This binary focuses on semantic units, neglecting the *mechanism* by which form dictates specific lexical choices and obscuring the origin of those choices. It doesn't differentiate constraint-driven compromise from semantic interpretation.
  *   **"Form is Part of Meaning":** While true, this axiom conflates the *presence* of form with the *specific lexical cost* of achieving it. It doesn't provide tools to audit *which* words are sacrificial offerings to form versus core semantic carriers. The axiom itself doesn't classify constraint criticality across languages.
  *   **Equivalent Effect:** Prioritizing reader response sidesteps the translator's decision-making process and the textual provenance of words. An effective equivalent might rely heavily on laundered invention invisible to the target reader, making the method unsuitable for auditing the source of choices.
  *   **Translator Practice & Commentary:** Translators' notes are valuable but inconsistent, retrospective, and selective. They rarely provide a comprehensive, word-by-word accounting, especially for subtle choices, and are absent from the published text presented to readers. There's no standardized practice for such auditing.

  Consequently, the relationship between specific formal demands, the specific words they force, and how those forced words are perceived remains opaque, necessitating a dedicated audit methodology.

  **Method (Week-by-Week, Materials, Constraints, Coding, Bias Mitigation) (approx. 300 words):**

  *   **Materials:** 8-10 short French fixed-form poems (2-8 lines; e.g., epigram, rondeau fragment). One proficient target language (e.g., English, German, Spanish - chosen by researcher proficiency).
  *   **Constraint Regimes (4 Levels):**
      1.  **Minimal:** Preserve core meaning only (baseline).
      2.  **Source-Equivalent:** Preserve source form (e.g., syllable count, rhyme scheme if feasible in target).
      3.  **Strict Target-Formalist:** Exaggerate source form (e.g., stricter rhyme, more rigid meter than source).
      4.  **Non-Isomorphic:** Invented constraint misaligned with source prosody (e.g., fix number of *stressed* syllables per line and final consonant sound, ignore syllable count).
  *   **Generating Texts (Weeks 1-2):** Researcher commissions 2-3 translations per poem per constraint regime (Total: 8 poems * 4 regimes * 2.5 avg = ~80 translations). Use qualified translators, providing clear regime definitions and source texts. Researcher role: Coordinator, not translator.
  *   **Coding Scheme Development (Week 2):** Define "consequential word choices" (e.g., verbs, key nouns, adjectives). Create detailed decision rules for categories (Necessitated, Licensed, Both, Neither) based on source text and specific constraint demands. Pilot on sample translations.
  *   **Audit (Weeks 3-4):** Two independent, trained research assistants (RAs) code all translations using the scheme. Record justifications for each coded word. Calculate inter-coder reliability.
  *   **Blind Attribution Study (Cut - See Scope/Risks):** *Originally planned, but deemed infeasible within scope (recruitment, design, analysis time). Focus shifts fully to developing and testing the audit protocol and constraint classification.*
  *   **Analysis (Week 5):** (1) Analyze constraint classification: Coders apply load-bearing/decorative labels per regime/target language; assess consistency and language-dependence. (2) Analyze audit data: Frequency of categories per regime; patterns in necessitated choices; reliability metrics; illustrative examples of laundering.
  *   **Bias Mitigation:** Researcher's "poetic incompetence" mitigated by: Relying on commissioned translators; using pre-defined, rule-based coding schemes; employing independent RAs for coding/classification; focusing analysis on coder agreement and patterns rather than subjective quality judgments; piloting and refining schemes rigorously.

  **Deliverable (approx. 100 words):**
  A draft manuscript presenting: 1) The load-bearing/decorative constraint classification framework applied to the French-[Target] pair; 2) The developed and tested audit protocol for word-choice provenance in constrained translation; 3) Key findings on the frequency and nature of "necessitated" choices across constraint regimes and evidence of the "laundering" effect within the texts; 4) Assessment of the protocol's reliability. Plus: A conference abstract based on results.

  **Failure or Null Result (approx. 150 words):**
  Failure would occur if: Inter-coder reliability for the audit protocol is unacceptably low (<0.6 Kappa), indicating the categories are not objectively applicable. If the load-bearing/decorative classification shows no meaningful pattern or consistency between coders or across constraints, the framework may be flawed or inapplicable to short forms. A null result would arise if analysis reveals no significant pattern linking constraint severity/type to the frequency of "necessitated" choices, suggesting formal demands, in this dataset, did not systematically force semantically unlicensed words. Crucially, even low reliability or null findings are valuable, revealing the inherent difficulties in auditing translation choices and prompting refinement of the methodology or questioning the feasibility of such atomistic analysis. The developed protocol and empirical data remain key outputs.

  **Scope and Underrated Risks (approx. 150 words):**

  *   **Scope:** Limited to short French poems and one target language. Focuses on lexical choice audit, not broader aesthetic effects. The blind reader study is **excluded** as too ambitious; its core question (reader perception of laundering) is deferred. Analysis is primarily qualitative/descriptive with basic reliability metrics.
  *   **Risks:**
      *   **Coder Reliability:** Achieving high agreement on nuanced word-choice categories is challenging. *Mitigation:* Extensive coder training, clear decision rules, pilot testing, iterative refinement of scheme, accepting moderate reliability as informative.
      *   **Translator Variance:** Different translators interpret constraints and source meaning differently, adding noise. *Mitigation:* Multiple versions per cell, focus on patterns across versions, transparency about this variance.
      *   **"Consequential" Ambiguity:** Defining which words to audit is inherently subjective. *Mitigation:* Predefine grammatical/semantic criteria, focus on words materially affecting core meaning.
      *   **Constraint Definition Clarity:** Ensuring translators and coders understand regimes precisely. *Mitigation:* Detailed written specifications, examples, pre-commission checks.
      *   **Time:** Generating 80+ quality translations quickly is demanding. *Mitigation:* Start recruitment early, use shorter poems, potentially reduce versions per cell if needed. Prioritize audit and analysis phases.
