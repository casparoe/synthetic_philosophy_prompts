answer: |-
  You've hit on one of the most persistent and fascinating tensions in philosophy of mind/computational cognition! What you're describing is a **rhetorical move with no universally agreed-upon name**, but it's often called the **"dynamical retreat"**, **"implementation problem evasion"**, or (more critically) **"causal-structure smuggling"**. It's a cousin to **"triviality objections"** (like Searle's "wall is a word processor" critique) and reveals deep fissures in functionalism. Let's carve this up step by step.

  ### 1. **The Move: Substrate-Neutrality Slogan vs. Dynamical Retreat**
  - **The Slogan**: "Substrate doesn't matter; only the abstract pattern/computation does!"  
    (This is **classical functionalism**/multiple realizability à la Putnam/Fodor.)
  - **The Retreat**: "But not *that* pattern! It must be *causally structured*, *efficient*, *information-processing*, etc."  
    (This appeals to **implementation constraints** or **dynamical properties**.)

  The bait-and-switch happens because the initial slogan treats computation as a **static input-output map**, while the retreat demands **causal dynamics**—how the system *transitions* between states. A lookup table lacks internal state transitions; it’s a dead structure. A brain (or a CPU) has causal pathways that actively transform information.

  ### 2. **Why This Isn’t *Just* Functionalism or Multiple Realizability**
  - **Multiple realizability** says minds can be made of silicon, carbon, etc.  
  - **Your friends' retreat** adds: "...but only if the realization has **causal depth**."  
  This is **functionalist-plus**: it smuggles in requirements for **how the computation is physically orchestrated**. The thermostat is rejected not because it’s silicon vs. carbon, but because its "computation" (e.g., binary on/off) lacks the hierarchical, feedback-driven dynamics of cognition.

  ### 3. **Observer-Relativity: The Nuclear Problem**
  You’re right about the **Putnam-Searle triviality theorem**: any physical system can be interpreted as implementing *any* computation if we freely map its states to computational states (e.g., a rock’s cracks "compute" *War and Peace*). This makes computation **observer-dependent**, not intrinsic.  

  **Why your friends' retreat struggles here**:  
  - If they demand "the *right* causal structure," we can *still* map any system (e.g., a rock pile) onto a "causal" computation by gerrymandering state transitions.  
  - Example: A lookup table *could* be seen as "causal" if we define its physical storage cells as "state transitions" during read/write cycles.  

  ### 4. **Legitimate Constraints vs. Smuggled Prejudice: Where’s the Line?**
  The line hinges on whether a constraint is **independently motivated** or **ad hoc**.  

  | **Legitimate Constraints** | **Smuggled Prejudice** |
  |----------------------------|------------------------|
  | Requiring **causal connectivity** (e.g., internal states must *non-accidentally* depend on inputs/prior states). | Demanding implementation via **neural-like parts** or **biological materials**. |
  | Requiring **efficiency** (e.g., a lookup table for all possible inputs is physically impossible for complex systems). | Claiming cognition *must* involve **emergent properties** without defining them computationally. |
  | Requiring **information sensitivity** (outputs must counterfactually depend on inputs; a rock pile lacks this). | Insisting on **human-like plasticity** when discussing thermostats. |

  **Legitimate version**: David Chalmers' **"criterion for implementation"** demands a *physical isomorphism* between the system and the computation's state transitions. A rock pile lacks reliable state transitions; a CPU has them.  

  **Smuggled version**: Saying "it must *feel* like something" (quietly importing phenomenal consciousness) or "it must evolve" (importing biology).

  ### 5. **A Non-Smuggling Alternative: Computation as Causal Topology**
  To avoid observer-relativity, some philosophers (e.g., **Piccinini**, **Shagrir**) argue computation isn't about abstract patterns *or* physics but **causal organization**:  
  - A system computes *only if* its physical states are **grouped into equivalence classes** (e.g., voltage ranges = binary 0/1) and **causal transitions** mirror logical operations.  
  - This rejects trivial mappings: a rock pile’s "states" aren’t *functionally grouped* by the system itself. A thermostat *does* group states (too hot/cold) and transitions causally.  

  **What this gets right**:  
  - It blocks lookup tables (no causal transitions) and observer-relative interpretations (groupings must be physically meaningful).  
  - It allows substrate neutrality (silicon/brains both work) while demanding *intrinsic* causal structure.  

  **What it struggles with**:  
  - Is a virus’s replication "computation"? Is evolution "learning"? This view might *overextend* cognition.  

  ### 6. **Your Biologist Friend Might Be Partly Right**
  Their "confusion" charge echoes **Wittgenstein** or **enactivist critiques** (e.g., Thompson): treating cognition as "computation" may be a category error. Biology cares about *embodied, adaptive processes*—not abstract Turing machines. The ML friend’s "AI mind" claim might conflate **simulated intelligence** with **realized cognition**.  

  ### Key Takeaways
  - **Name for the move**: Call it **"dynamical retreat"** or **"causal smuggling"**.  
  - **Core tension**: Computation is **observer-relative** without causal constraints, but adding constraints **risks reifying physics**.  
  - **Path forward**: Argue for **individuating computations by causal topology** (Piccinini) or **teleological functions** (Millikan: a system computes only if its *evolution* selected it for information processing).  
  - **Read**: Chalmers' *"Does a Rock Implement Every Finite State Automaton?"*, Piccinini's *"Physical Computation"*, and Searle's *"Minds, Brains, and Programs"* for the nuclear option.  

  This isn’t just pedantry—it’s about whether "cognition" is a natural kind or a human projection. Your frustration is the sound of philosophy grinding against the hard problem of grounding symbols in physics. Keep arguing: you’re asking the right questions.
