  First, I need to unpack the user's core frustration: the bait-and-switch between "substrate doesn't matter" and "but not like that." The user suspects this isn't just functionalism but something more slippery. They mention multiple realizability and syntax/semantics, so they're familiar with philosophy of mind basics. Their deeper need seems to be: "How do I articulate this inconsistency to win the argument while preserving intellectual rigor?"  

  The key concepts here are:  
  - **Substrate neutrality**: The idea that cognition can be implemented in any physical system.  
  - **Observer-relativity of computation**: Putnam/Searle's point that computation isn't intrinsic; it's assigned by an interpreter.  
  - **Implementation requirements**: When proponents add caveats ("right kind of computation"), they're smuggling in causal structure or dynamical properties.  

  The user wants a name for this move. "Causal-structure smuggling" or "dynamical retreat" might work, but "teleological sleight-of-hand" is better if purpose is invoked. Still, naming isn't enough—they want to dissect the legitimacy of these retreats.  

  For the carving:  
  - **Legitimate constraints**: Requiring causally integrated processes (e.g., avoiding prespecified lookup tables) is defensible if tied to properties like adaptability or energy efficiency. Dennett's "real patterns" or Fodor's non-derived content could help here.  
  - **Illegitimate smuggling**: Demanding carbon-based biology or neuron-like wiring without justification is cheating.  

  The user also hints at observer-relativity as a nuclear option: if any rock pile can be "computing," then "computation" loses bite. The response should acknowledge this but offer escapes—e.g., Marr's levels framework or computational individuation via causal topology.  

  Finally, the user might secretly want ammunition for their biologist friend (who thinks the question is confused) without fully surrendering to eliminativism. A balanced reply would validate their skepticism while giving tools to refine functionalism into something coherent.  

