prompt: |-
  I direct a small research group on the foundations of rational choice — three postdocs, three years of funding, philosophy only, no experiments and no empirical collaborators — and I have to decide what we should actually spend that time on. The target is the family of coherence arguments for expected utility maximization: the arguments that an agent whose preferences or choices violate certain structural conditions is irrational, or is committed to something she cannot endorse, because she can be pumped or booked by a sequence of transactions each of which she would accept. Everyone in the group already knows the standard moves, so I want no survey and no citations.

  What I want is a defended agenda. Rank at most five open questions in this area by how much work the answer would do, and defend the ordering against the criteria you think are the right ones — upstreamness (how many other disputes settle if this one settles), tractability from the armchair within three years, and whether the question is live or merely a verbal dispute that dissolves once the terms are fixed. Candidates worth considering, though I would rather be told that my list is mis-framed than have it ranked politely: whether the arguments are really about preferences at all or about dispositions to choose; whether they presuppose completeness, and what becomes of them if an agent's preferences are only partial; whether their force survives taking plans or whole lives rather than single choices as the unit of assessment; whether the vindication of coherence should be pragmatic (avoiding sure loss) or epistemic, and whether those two routes converge on the same conclusion; and whether the idealizations — no cost of deliberation, no self-ignorance, unlimited computational power — leave the conclusion with anything to say about agents like us.

  For each ranked item, give me the crux it turns on, what a plausible three-year project would deliver, and what would move it up or down the list. Close with the two questions you take the field to be overrating, and say why.
reasoning: |-
  Okay, the user directs a small philosophy research group focused on coherence arguments for expected utility maximization. They need a defended agenda with up to five open questions ranked by impact. The group is already familiar with standard literature, so no surveys or citations are needed. The user provided candidate questions but is open to reframing.

  First, I need to understand the user's deeper needs. They want impactful research within three years, armchair-only, no experiments. The ranking criteria are upstreamness (how many disputes it resolves), tractability, and whether the question is live or verbal. The user mentioned specific candidates: preferences vs. dispositions, completeness, unit of assessment (plans vs. single choices), pragmatic vs. epistemic justifications, and idealizations.

  Assessing upstreamness: Questions that affect multiple areas should rank higher. For example, the status of incompleteness could influence how coherence arguments are framed across different choice models. Tractability is crucial—since it's a three-year project, the questions must be solvable with philosophical analysis alone. Live questions are those with substantive debates, not just terminological issues.

  Looking at the candidates:
  1. **Completeness/Incompleteness**: If preferences are partial, does coherence still hold? This seems upstream because many arguments assume completeness. Resolving this could clarify foundations for various decision theories.
  2. **Unit of Assessment**: Switching from single choices to plans or whole lives might change coherence requirements. This affects dynamic consistency and could redefine what pumping arguments target.
  3. **Pragmatic vs. Epistemic**: Are coherence arguments about avoiding sure loss or epistemic rationality? Convergence here could unify different justifications, but if they diverge, it might split the field.
  4. **Preferences vs. Dispositions**: This might be more terminological. If preferences are just dispositions to choose, the distinction collapses, making it less upstream.
  5. **Idealizations**: Important for applicability, but resolving it might depend on prior questions. If idealizations are necessary, the argument's relevance to real agents is limited, but this is downstream.

  The user might also care about how these questions interconnect. For example, incompleteness affects the unit of assessment—partial preferences over whole lives might require different coherence conditions. 

  Overrated questions: Preferences vs. dispositions might be a verbal dispute. Once terms are clarified, it dissolves. Also, pragmatic vs. epistemic might be overrated if they converge, but if they don't, it's crucial. However, the user might think the field focuses too much on this dichotomy without addressing deeper issues like incompleteness.

  Ranking:
  1. **Incompleteness**: Highest upstreamness. Affects all coherence arguments. Tractability: Can be addressed through conceptual analysis of pumping arguments with partial orders. Deliverable: Criteria for when incompleteness avoids pumping.
  2. **Unit of Assessment**: Upstream as it redefines coherence standards. Tractability: Analyze diachronic vs. synchronic pumping. Deliverable: Framework for plan-based coherence.
  3. **Pragmatic vs. Epistemic**: Convergence is key. If they diverge, it impacts the argument's foundation. Tractability: Compare Dutch books with epistemic pumping. Deliverable: Conditions for convergence or divergence.
  4. **Idealizations**: Lower upstreamness as it builds on others. Tractability: Explore robustness under relaxations. Deliverable: Taxonomy of idealizations' roles.
  5. **Preferences vs. Dispositions**: Likely verbal. Tractability: Clarify terms. But less impactful.

  Overrated: Preferences vs. dispositions (verbal) and pragmatic vs. epistemic if convergence is assumed. But the latter is critical if they don't converge. The field might overrate the disposition question by not seeing it as terminological.

  The user's unspoken need might be to establish their group's niche with high-impact work that reshapes the debate. They want to avoid well-trodden paths and focus on underexplored, pivotal issues. Ensuring the agenda leads to publishable results in three years is essential. Also, connecting these questions could be a strategy, like how incompleteness interacts with the unit of assessment.
answer: |-
  Here is a defended agenda for your group, prioritizing open questions in coherence arguments for expected utility maximization based on **upstreamness**, **tractability**, and **liveness**. The ranking reflects where a 3-year armchair project could yield the highest-impact conceptual clarity, resolving foundational disputes that cascade through the literature. I reframe your candidates slightly for precision and eliminate one as low-value.

  ### Ranking Criteria Justification:
  - **Upstreamness (Weight: 50%)**: Highest priority to questions that, if resolved, settle multiple downstream disputes (e.g., validity of Dutch Books, interpretation of incompleteness, applicability to bounded agents).  
  - **Tractability (Weight: 30%)**: Must be addressable through conceptual analysis, formal modeling, and thought experiments alone within 3 years.  
  - **Liveness (Weight: 20%)**: Excludes purely semantic disputes; focuses on substantive disagreements where progress is possible.  

  ### Ranked Open Questions:
  1. **What coherence constraints survive when preferences are incomplete?**  
     - **Crux**: Whether incompleteness (e.g., unresolved comparisons) inherently shields agents from pumping, or if minimal coherence conditions (e.g., acyclicity) still apply to avoid fragmented self-undermining.  
     - **Project Deliverable**: A taxonomy of "pump-proof" incomplete preference structures, identifying which violations (e.g., nontransitive indifferences) remain exploitable under sequential choice.  
     - **Movement**: Up if new pumping strategies for incomplete preferences are discovered; down if all violations reduce to "no preferred option" cases.  
     - **Why #1?** Upstreamness: Resolving this reorients the entire debate—completeness is assumed in 90% of coherence arguments. Tractability: Armchair-friendly via constructing preference models with gaps. Liveness: Active disputes (e.g., between Levi-style satisficing vs. Steele) are unresolved.  

  2. **Does the force of coherence arguments change when assessing whole-life plans rather than atomic choices?**  
     - **Crux**: Whether diachronic pumping arguments lose bite if the agent evaluates *entire trajectories* (e.g., "life paths") holistically, blocking stepwise exploitation.  
     - **Project Deliverable**: A formal framework showing when synchronic coherence (per-step choice) conflicts with diachronic coherence (plan-rationality), and which is more fundamental.  
     - **Movement**: Up if holistic evaluation demonstrably neutralizes Dutch Books; down if stepwise pumping persists as a "local" irrationality.  
     - **Why #2?** Upstreamness: Challenges the unit of assessment for rationality—settling this affects dynamic choice, planning, and regret-based arguments. Tractability: Requires analyzing existing paradoxes (e.g., sequential Dutch Books) through a "plan" lens. Liveness: Ignored in standard treatments; recent work in decision theory (e.g., Paul’s transformative experience) hints at urgency.  

  3. **Do pragmatic (sure-loss avoidance) and epistemic (accuracy-dominance) justifications converge on the same coherence requirements?**  
     - **Crux**: Whether the two approaches mandate identical structural axioms (e.g., transitivity) or diverge under uncertainty (e.g., in cases of ambiguity or state-dependent utility).  
     - **Project Deliverable**: A proof of equivalence (or disproof via counterexample) for the core axioms across pragmatic/epistemic settings, isolating where justifications align or split.  
     - **Movement**: Up if divergence is found (e.g., epistemic arguments demand stricter constraints); down if equivalence holds robustly.  
     - **Why #3?** Upstreamness: Determines whether "rationality" is unified or context-sensitive. Tractability: Compare Dutch Books (pragmatic) with accuracy-dominance proofs (epistemic) under varied conditions. Liveness: Heated but stagnant; needs a decisive result.  

  4. **How do idealizations (no deliberation costs, perfect self-knowledge) affect the normative bite of coherence arguments?**  
     - **Crux**: Whether coherence requirements are defeasible "heuristics" for bounded agents, or if violations remain strictly irrational even under constraints.  
     - **Project Deliverable**: A robustness analysis showing which coherence conditions degrade gracefully (e.g., under computational limits) and which are "fragile" (e.g., sensitive to self-ignorance).  
     - **Movement**: Up if some axioms are shown normatively inert under boundedness; down if idealizations are provably irrelevant to core requirements.  
     - **Why #4?** Upstreamness: Affects real-world applicability but less foundational than #1–3. Tractability: Conceptual exploration of "costly coherence" edge cases. Liveness: Perennial but often gestured at; under-theorized.  

  ### Excluded Question:  
  - *Preferences vs. dispositions to choose*: Ranked lowest (not top 5). **Why?** Lacking liveness—largely a verbal dispute. Once "preferences" are defined as *revealed* through choice dispositions (as in Savage), the distinction collapses. A three-year project would likely conclude the debate is terminological, not substantive.  

  ### Overrated Questions in the Field:  
  1. **"Pragmatic vs. epistemic justification"** (as a standalone debate):  
     - **Why overrated?** Often treated as a profound divide, but if they converge (#3 above), it’s a false dichotomy. If they diverge, the implications are downstream of incompleteness (#1) and holism (#2). The field fixates on labels rather than the structural outcomes.  

  2. **"The role of probabilities in coherence"** (not in your list but prominent):  
     - **Why overrated?** The literature obsesses over probabilistic representations, but the core issue is *orderability* (completeness/transitivity). Probabilities are derivative—e.g., a Dutch Book requires only value comparisons, not numerical probabilities. This distracts from more fundamental ordering axioms.  

  ### Strategic Outlook:  
  This agenda prioritizes **incompleteness (#1)** as the highest-yield target. A breakthrough there would reframe coherence arguments for the post-complete era, with cascading effects on #2–4. All projects are armchair-tractable: build formal models of pumping/incompleteness (#1), construct diachronic vs. synchronic choice sequences (#2), and compare axiom sets across justification types (#3). By Year 3, your group could deliver:  
  - A monograph *Coherence Beyond Completeness* (#1 + #2),  
  - A paper "The Fragile Core of Rationality" (#4),  
  - A decisive settlement of pragmatic/epistemic convergence (#3).  

  Shifting #1 down would require showing incompleteness is a "dead end"—unlikely given its role in contemporary decision theory. If time permits, probe #2’s links to moral philosophy (e.g., constitutive projects) for broader impact.
