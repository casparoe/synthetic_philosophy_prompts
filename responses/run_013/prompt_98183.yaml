  Okay, the user is on their college's academic integrity board dealing with a tricky case. A student used an LLM to generate an outline and two topic sentences for their draft but rewrote everything themselves. The professor considers this "substantial unauthorized assistance," while the student argues it's just brainstorming. The honor code uses that phrase without defining it, and there are conflicting precedents: one where a grammar checker was allowed (2019) and another where a paraphrasing tool was not (2022). 

  The board is split. Half think "substantial" has a definite meaning they need to uncover; the other half see it as vague with no clear answer in borderline cases. The user wants a written opinion recommending an outcome (violation or not, and any sanction), plus a rule for future LLM cases. They also want discussion on interpreting "substantial" via epistemicism (sharp line exists but unknown) or supervaluationism (borderline cases lack truth value), including the strongest counterargument. The memo must be neutral, concise (about a page), and sent to both student and professor without seeming biased.

  First, I need to untangle the core conflict. The student used the LLM for early structuring help but did the substantive writing themselves. This sits between precedents: grammar tools (allowed, focused on mechanics) vs. paraphrasing (banned, involved content generation). The key is whether the LLM's role crossed into "substantial assistance" territory. 

  For the recommendation, I'm leaning toward "no violation." Why? The assistance was limited to scaffolding (outline/topic sentences), not content generation. The student rewrote everything, showing original work. This feels closer to brainstorming than outsourcing. Sanctions seem unnecessary here. 

  For the prospective rule, I'd define "substantial" as assistance that contributes significantly to intellectual content (ideas, arguments, phrasing). Permitted uses: brainstorming, light editing. Prohibited: generating text or arguments without full rewriting. This draws a line at content origination. 

  Now the meta-semantic debate. I'll pick supervaluationism because it handles vagueness better: "substantial" has multiple precisifications, and borderline cases (like this one) lack a truth value. But I must argue both sides fairly. 

  Epistemicism's best point: it avoids arbitrariness. If a sharp line exists (e.g., "any generated content = violation"), this case might violate because the LLM produced sentences. But that could over-penalize minor help. 

  Supervaluationism wins here because it forces consensus-building for borderline cases. It also reflects how honor codes evolve with technology—clearer rules emerge from gray areas. 

  Finally, the memo structure: outcome first (no violation), reasoning with precedent comparison, prospective rule, then meta-semantic discussion with counterarguments. Tone must be even-handed, emphasizing fairness and academic values. 

  User’s deeper needs: They want a principled resolution that withstands scrutiny from both parties, plus a framework to prevent future disputes. Unspokenly, they might fear setting bad precedents with new tech or seeming inconsistent. The memo should project confidence in the process.
answer: |-
  ## Academic Integrity Board Pre-Hearing Memorandum  
  **Case:** Student Use of LLM for Draft Outline & Topic Sentences  
  **Date:** [Date of Hearing]  
  **To:** Board Members  
  **From:** [Your Name/Designation]  

  ### I. Recommended Outcome
  The Board finds **no violation** of the academic integrity policy. No sanction is recommended. The student's use of the LLM constituted permissible brainstorming assistance, not "substantial unauthorized assistance."  

  ### II. Reasoning
  1.  **Nature of Assistance:** The LLM provided an outline and two topic sentences. This is foundational, structural support akin to discussing ideas with a peer or tutor. It did not generate substantive arguments, evidence, or prose for the final submitted work. The student's subsequent full rewriting demonstrates independent intellectual engagement with the material.
  2.  **Precedent Analysis:**  
      *   *2019 Grammar Checker:* Permitted as mechanical correction, not substantive aid.  
      *   *2022 Paraphrasing Tool:* Violation because it directly altered the expression and structure of the student's *existing* content, blurring authorship.  
      This case differs significantly. The LLM aid occurred at the *inception* stage (like brainstorming), not the *expression* stage (like paraphrasing). The student used it as a prompt, not a substitute for their own composition.  
  3.  **"Substantial" Threshold:** Assistance becomes "substantial" when it contributes core intellectual content (key arguments, unique insights, specific phrasing) or significantly diminishes the student's own compositional burden. Generating a high-level outline and a few topic sentences does not cross this threshold. It provides structure, not substance.  
  4.  **Educational Context:** Permitting limited, transparent use of LLMs for ideation and structure aligns with evolving academic practices and fosters responsible AI literacy, provided the core intellectual work and final expression remain the student's own.  

  ### III. Prospective Rule for LLM Assistance
  Going forward, the Board adopts this rule:  
  **"Unauthorized LLM assistance is 'substantial' if it generates core intellectual content (e.g., specific arguments, unique insights, synthesized evidence, or developed prose) that the student incorporates into submitted work without significant independent transformation. Permitted uses include generating broad ideas, outlines, or structural prompts, provided the student develops all arguments, evidence, and final expression independently. Students must disclose any LLM use per instructor/syllabus policy."**

  ### IV. Interpretation of "Substantial": Meta-Semantic Framework
  The Board adopts **Supervaluationism** as the appropriate framework for interpreting "substantial" in our honor code.  
  *   **Reasoning:** "Substantial" is inherently vague. Supervaluationism acknowledges this by recognizing multiple admissible precisifications (ways to make it sharp). A rule applies definitively only if *all* admissible precisifications agree. In borderline cases (like this one), no single fact of the matter exists. Our role is to determine which admissible precisifications are most consistent with the honor code's purpose (promoting authentic learning and intellectual independence) and precedent, then make a reasoned policy choice. This framework promotes fairness in ambiguous situations by requiring consensus among reasonable interpretations.  
  *   **Implication for this Case:** Under supervaluationism, this case is a borderline instance. While some precisifications might deem any generated text "substantial," many reasonable precisifications (focusing on core intellectual contribution and independent effort) would *not* classify this level of ideation/structure aid as substantial. Therefore, a definitive violation cannot be established.  

  #### V. Best Argument for the Losing Side (Epistemicism)
  The strongest argument for **Epistemicism** is that "substantial" *does* have a single, precise, objective threshold in reality, even if we cannot perfectly discern it. This view avoids the potential arbitrariness of policy choices in borderline cases and upholds the principle that the rule's meaning is fixed, demanding our best effort to discover it.  
  *   **Implication for this Student under Epistemicism:** If the epistemicist sharp line falls such that *any* generation of content (like topic sentences) by an unauthorized tool constitutes "substantial assistance," regardless of subsequent rewriting, then this student would have committed a violation. The sanction would likely be a reduced grade on the assignment or mandatory ethics education, consistent with a first offense involving limited generated content. Epistemicism could support the professor's strict interpretation.  

  ### Conclusion
  This case falls within the gray area inherent to the term "substantial." Applying supervaluationism, we find reasonable precisifications support the student's characterization as permissible brainstorming. The student's complete rewriting demonstrates sufficient independent effort. We find no violation. The proposed rule provides clearer guidance for students and faculty navigating LLM use.  

