  The user's frustration seems to stem from seeing how this conflation stalls debates in genetics (e.g., about environmental interventions or group differences) and creates unnoticed technical problems when genotypes and environments correlate. Their proposed "reference-class problem" analogy to base rates is particularly sharp—it suggests heritability estimates might be as context-dependent as probability assignments.

  Hmm, the challenge is structuring this philosophical critique into a feasible 12-month conceptual project. The user explicitly wants:
  - A precise research question (not just "this is messy")
