  Counting syllables now... keeping lines tight (8-10 syllables) to stay under 180 words. Avoiding Sartre quotes means finding original phrasing for "facticity/transcendence" duality - "trapped in what I've been" versus "no tomorrow's weight". The professor will recognize "flickering" as the bad faith oscillation, while newcomers will feel the evasion in the rhythm. 

  Last check: refrains alternate perfectly, final stanza merges them, word count 144. The trembling hand and cliff should make the abstraction felt. Hope this lives up to their seminar depth!
answer: |-
  ## Villanelle of Evasion

  This trembling hand? I'm only what you see —
  The role assigned, the past I can't erase.
  No solid shape in me, just boundless free.

  A waiter's tray, defined entirely
  By orders taken in this clattering place:
  *This trembling hand? I'm only what you see.*

  That cliff-edge void, pure possibility —
  Past deeds dissolve without a single trace.
  *No solid shape in me, just boundless free.*

  The slammed door hangs, an old necessity
  (A trait ingrained, beyond my power to chase):
  *This trembling hand? I'm only what you see.*

  The blank page stares, demanding honesty
  From nothingness — a terrifying space.
  *No solid shape in me, just boundless free.*

  See how they stand, side by side, offering plea:
  One trapped in what I've been, one lost in grace —
  *This trembling hand? I'm only what you see —
  No solid shape in me, just boundless free —*
  Two faces flickering, the same cowardly face.
