prompt: |-
  Quick sanity check for a metaphysics reading group. We've been going in circles on the special composition question — when do some things add up to a further thing? — so I just want the live options ranked, best to worst, a line or two each on what each buys and what it costs. Here's the list on the table: (1) universalism, where any plurality whatsoever composes something, so there's a fusion of your left shoe and the moon; (2) nihilism, where nothing ever composes, so no tables, just particles arranged tablewise; (3) a life criterion, where things compose exactly when they make up a living organism; (4) contact or fastening, where they compose when they're stuck together the right way; (5) brutalism, where it's a primitive, unanalyzable fact which pluralities compose; (6) a proposal a friend keeps pushing, that composition happens just in case the plurality has a single well-defined persistence condition — roughly, there's a fact of the matter about which later things it's identical to; (7) deflationism, where the whole thing is a verbal dispute and each side is right in its own language. Rank them, flag any that are really the same view in different clothes, and say which one you'd actually pick if you had to defend it against the statue-and-lump case and the problem of the many.
reasoning: |-
  Okay, the user is running a metaphysics reading group and they're stuck on the special composition question—basically, when do parts form a whole? They've listed seven positions and want them ranked best to worst, with pros and cons for each. They also want to know which ones are similar and which one holds up best against classic puzzles like the statue/lump and problem of the many.  

  First, I need to recall what each position entails. Universalism says everything composes, no matter what. Nihilism says nothing ever composes. Life criterion ties composition to living organisms. Contact/fastening requires physical connection. Brutalism treats it as a brute fact. The persistence condition view links it to identity over time. Deflationism says it's just a language issue.  

  The user mentions two specific problems: the statue/lump (where a statue and the clay it's made of seem to share parts but have different persistence conditions) and the problem of the many (fuzzy boundaries, like which particles make up a cloud). Any good ranking needs to handle these well.  

  Starting with the worst: Deflationism feels like a cop-out. It avoids the debate by calling it verbal, but that doesn't resolve the underlying metaphysical unease—like why we intuitively think statues exist. So I'll put it last.  

  Nihilism is next worst. It's parsimonious but too revisionary—denying everyday objects like tables seems absurd. It also struggles with the statue/lump because if neither exists, how do we explain our talk about them?  

  Brutalism is unsatisfying because it offers no explanation. Calling it "primitive" might technically work, but it feels like giving up on philosophy. Still, it's above nihilism because at least it allows for ordinary objects.  

  Contact/fastening is common-sense but messy. What counts as "stuck together"? Glue? Gravity? And it fails the statue/lump case—the lump and statue are equally "stuck," yet we distinguish them.  

  Life criterion is cleaner but too narrow. Why privilege life? A corpse stops being a whole? And non-living artifacts become problematic.  

  Persistence condition view is interesting. If a whole has clear identity conditions (unlike a random heap), it avoids arbitrary groupings. But it might overgenerate—does a corporation count? And the statue/lump becomes tricky: are they two objects or one?  

  Universalism is the safest. It handles the statue/lump by saying both the lump and the statue-lump fusion exist. Problem of the many? It embraces all possible fusions. Cost: too many objects, but that's ontologically cheap.  

  The persistence view and universalism are close. I lean toward universalism because it's simpler and more systematic. The persistence view might collapse into universalism if everything trivially has identity conditions.  

  For the user's needs: they want clarity after circular debates. Universalism cuts through by accepting all compositions. It handles the puzzles cleanly, even if it feels bloated. Among the live options, it's the least bad.  

  Final ranking: universalism > persistence > life > contact > brutalism > nihilism > deflationism. Flag that persistence and universalism might overlap, and brutalism/contact share vagueness issues. Deflationism is uniquely dismissive.  

  If I had to pick one to defend: universalism. It's bulletproof against the puzzles, even if counterintuitive.
answer: |-
  Here's a concise ranking of the live options for the Special Composition Question (SCQ), best to worst, based on theoretical virtues (internal coherence, explanatory power, handling objections), with key costs/benefits and responses to the statue/lump and problem of the many. Positions are distinct unless noted.

  1.  **Universalism (1)**  
      - **What it buys:** Complete simplicity, determinacy, and metaphysical parity. Solves statue/lump (both lump *and* statue-lump fusion exist) and problem of the many (all overlapping aggregates exist).  
      - **What it costs:** Extreme ontological inflation (shoemoon exists). Feels counterintuitive and violates common sense.  
      - **Verdict:** **Strongest contender.** Systematically avoids arbitrariness and cleanly handles puzzles. Pick this if you value rigor over intuition.

  2.  **Persistence Condition (6)**  
      - **What it buys:** Grounds composition in identity/metaphysical unity. Explains *why* some wholes are more than sums (e.g., organisms vs. heaps). Handles statue/lump well (lump and statue have different persistence conditions → distinct objects).  
      - **What it costs:** Risk of circularity (does persistence presuppose a whole?). Vagueness in defining "well-defined" conditions. May overgenerate (is a corporation a whole?). Struggles with problem of the many (fuzzy boundaries challenge "single" identity).  
      - **Verdict:** **Promising but needs refinement.** Best explanatory potential if made precise. Ranks below universalism due to unresolved vagueness.

  3.  **Life Criterion (3)**  
      - **What it buys:** Privileges intuitively significant unities (organisms). Solves problem of the many for non-living things (they don't strictly exist).  
      - **What it costs:** Arbitrarily excludes non-living artifacts (no chairs, mountains). Struggles with borderline cases (viruses, dying organisms). Fails statue/lump (lump persists through reshaping, statue doesn't → but both are non-living).  
      - **Verdict:** **Too restrictive.** Unacceptably revisionary for non-biological metaphysics.

  4.  **Contact/Fastening (4)**  
      - **What it buys:** Matches some common-sense intuitions (e.g., a watch is one thing).  
      - **What it costs:** Hopelessly vague ("stuck together how?"). Arbitrary (why contact vs. function?). Fails statue/lump (lump and statue are equally "stuck"). Fails problem of the many (contact boundaries are vague). Creates scattered objects (e.g., a dispersed galaxy).  
      - **Verdict:** **Intuitive but unworkable.** Collapses under scrutiny. Similar in spirit to brutalism but worse due to false precision.

  5.  **Brutalism (5)**  
      - **What it buys:** Avoids arbitrariness charges by embracing primitivism. Compatible with any intuitive answer.  
      - **What it costs:** Explanatory vacuity (no reason *why* composition occurs). Effectively gives up on SCQ. Handles puzzles only by stipulation (e.g., "brutely, statue ≠ lump").  
      - **Verdict:** **Philosophically unsatisfying.** A concession of defeat disguised as a solution. Shares nihilism's cost (no explanation) without its benefits.

  6.  **Nihilism (2)**  
      - **What it buys:** Ultimate ontological parsimony, eliminates vagueness problems (no composites → no boundaries).  
      - **What it costs:** Radically revisionary (no tables, only particles). Requires paraphrasing all ordinary talk. Statue/lump "solved" by denying both exist (only particles arranged statue/lump-wise). Problem of the many vanishes (but at great cost).  
      - **Verdict:** **Coherent but implausible.** Demands rejecting too much of lived experience.

  7.  **Deflationism (7)**  
      - **What it buys:** Dissolves the debate entirely. Each position "true" in its own linguistic framework. Avoids metaphysical commitment.  
      - **What it costs:** Fails to engage the substantive metaphysical intuition driving SCQ. Ignores why we feel there's a fact of the matter (e.g., *Is there really a statue?*). Offers no solution to puzzles (e.g., statue/lump is "verbal" but intuitions persist).  
      - **Verdict:** **Worst option.** A non-answer that trivializes the problem. Only viable if you abandon metaphysics altogether.

  **Key Notes:**  
  - **Similar Views:** Brutalism (5) and Contact (4) both rely on under-specified criteria but differ in honesty (brutalism admits primitivism; contact pretends to a criterion). Deflationism (7) stands alone in rejecting the question's substance.  
  - **Persistence (6) vs. Universalism (1):** Persistence avoids universalism's bloated ontology but risks collapsing into it if *everything* trivially has identity conditions.  
  - **Against Statue/Lump & Problem of the Many:** Universalism handles both best by accepting all candidate objects. Persistence handles statue/lump well but struggles with the many. Nihilism "solves" both by eliminating composites. Others fail.  

  **If I had to pick one:** **Universalism (1)**. It’s the only view that systematically, non-arbitrarily resolves the puzzles without relying on vague criteria or rejecting intuition wholesale. Its ontological cost is theoretical (exploding objects), while rivals impose heavier costs on explanation or common sense. Defend it against statue/lump by accepting both the lump *and* the statue as distinct fusions sharing parts, and against the problem of the many by embracing all precisifications as real.
