answer: |-
  ### Translation: Madhyamaka in Logical Vocabulary  
  **Core Concepts Restated:**  
  - **Inherent existence (svabhāva):** A property assigned to entities (denoted *P* for a proposition attributing svabhāva).  
  - **Emptiness (śūnyatā):** The *absence* of svabhāva in all phenomena. Not a property itself, but the *failure* of property-ascription.  
  - **Conventional truth (saṃvṛti-satya):** Semantic closure for pragmatic discourse. Sentences receive *designated values* (e.g., T, B) relative to dependent arising.  
  - **Ultimate truth (paramārtha-satya):** No semantic closure. *No stable truth conditions* for *P* or *¬P*.  
  - **No thesis (pratijñā):** Refusal to assert *any* proposition with inherent truth conditions.  

  **The Catuṣkoṭi (Four Corners) Formalized:**  
  1. **First Corner (P): "Inherently exists"**  
     - *Formalization:* *P* is **True (T)**. Classical truth-value assignment.  
     - *Madhyamaka Rejection:* Presupposes svabhāva is a valid predicate. Rejected as semantically inert.  

  2. **Second Corner (¬P): "Does not inherently exist"**  
     - *Formalization:* *P* is **False (F)**. Classical falsity.  
     - *Madhyamaka Rejection:* Still presupposes svabhāva is a meaningful predicate (negation reifies the subject). Rejected.  

  3. **Third Corner (P ∧ ¬P): "Both inherently exists and does not"**  
     - *Formalization:* *P* is **Both (B)** (glut). A truth-value glut (e.g., Belnap’s *Both*).  
     - *Madhyamaka Rejection:* Compounds the error; assumes *P* is truth-apt. Rejected.  

  4. **Fourth Corner (¬(P ∨ ¬P)): "Neither inherently exists nor does not"**  
     - *Formalization:* *P* is **Neither (N)** (gap). A truth-value gap (e.g., Kleene’s *undefined*).  
     - *Madhyamaka Rejection:* Still frames reality via *P*’s truth-aptness. Rejected as covert reification.  

  **Emptiness & No Thesis:**  
  - Emptiness: Not a value (T, F, B, N) but the *collapse of the valuation space* for *P*.  
  - No thesis: *No assertion* maps to *any* value (T, F, B, N). A *rejection of the semantic framework* for *P*.  

  **Two Truths:**  
  - Conventional: A *paraconsistent semantics* (e.g., Belnap-Dunn) with designated values (T, B) for dependently arisen phenomena.  
  - Ultimate: *No semantics*. Valuation functions cease to apply.  

  ---

  ### Residue Report: What Survives, What Distorts, What Vanishes  
  **1. The Fourth Corner (¬(P ∨ ¬P)):**  
     - *Survival:* Formally a gap (N).  
     - *Distortion:* Nāgārjuna’s rejection is *not* that *P* is gappy but that *assigning any value* (even N) reifies *P*. The gap is *itself* a semantic commitment.  
     - *Residue:* **The refusal to enter the game of truth-value assignment.** Logic treats N as a value; Madhyamaka denies *all* values are applicable.  

  **2. Exhaustiveness of the Four Corners:**  
     - *Survival:* In 4-valued logic, *every proposition has exactly one value*: T, F, B, or N.  
     - *Distortion:* This exhaustiveness is a *theorem* of the semantics. For Nāgārjuna, exhaustiveness is a *substantive error*: it assumes *P* must be truth-apt.  
     - *Residue:* **Logic presupposes what Madhyamaka argues against.** The 4-valued matrix assumes a fixed domain of propositions, while Madhyamaka denies svabhāva-propositions have truth conditions.  

  **3. "No Thesis" (Pratijñā):**  
     - *Survival:* None. Logic assigns values to sentences regardless of assertion.  
     - *Distortion:* Interpreting "no thesis" as a gap (N) or a designated value misrepresents it. It is a *metalinguistic stance*: refusal to endorse *any* value-bound proposition.  
     - *Residue:* **Assertion vs. Truth.** "No thesis" is about *illocutionary act* (no assertion), not truth-value. Logic’s satisfaction relations ignore this.  

  **4. Two Truths Distinction:**  
     - *Survival:* Conventional truth ≈ paraconsistent semantics (values T, B designated).  
     - *Distortion:* Ultimate truth ≠ a set of values (e.g., F, N) or a metalanguage. It is the *suspension of semantic closure*.  
     - *Residue:* **Ultimate truth requires transcending the semantics entirely.** Logic cannot model "no truth conditions" without smuggling in a value (e.g., supervaluation).  

  **5. "Emptiness is Empty" (Anti-reification):**  
     - *Survival:* None.  
     - *Distortion:* Formalizing emptiness as a property (e.g., ¬P) or value (N) reifies it.  
     - *Residue:* **Self-applicable negation.** The warning against "views" targets *any* semantic representation. Logic’s negation operators (e.g., strong Kleene) fix values; they cannot self-undermine.  

  ---

  ### Verdict  
  **Your friend is wrong.** The residue is **large and structural**, exposing limitations of truth-conditional semantics:  
  1. **Formal logic presupposes semantic closure** (all sentences have truth conditions). Madhyamaka denies this for svabhāva.  
  2. **Values (gaps/gluts) reify what Nāgārjuna rejects.** Assigning *any* value (even N) to "inherent existence" violates emptiness.  
  3. **"No thesis" and ultimate truth are extrasemantic.** They require abandoning the framework, not extending it.  

  **The defect is in the vocabulary:** Truth-conditional semantics (many-valued or paraconsistent) cannot capture Madhyamaka’s core insight—that logic itself reifies. A "better" logic (e.g., with unstable valuations) might approach it but risks reproducing the error. **Madhyamaka is not informal four-valued logic; it is a critique of semantic reification that logic, by its nature, cannot fully formalize.** The remainder isn’t rhetoric—it’s the point.
