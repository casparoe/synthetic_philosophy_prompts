prompt: |-
  I run a second-year undergraduate metaphysics seminar — sixteen students, one eighty-minute session — and I want to teach Zeno's arguments on motion as something the group does rather than something it hears about. Please design an activity in which the rules themselves generate the difficulty, so that participants run into it before anyone names it, followed by a debrief that maps what happened onto the arguments and is candid about what a room full of moving bodies cannot show. I'd like the whole thing to be runnable with materials I can carry in a bag.

  What I want them to come away seeing is not "the paradoxes are solved by calculus" but three separate things: that the halving argument, the arrow, and the argument from composition are not one puzzle with one answer; that the convergence reply lands cleanly on the first, does not touch the second, and answers the third only by presupposing a theory of the continuum; and that their own unexamined assumption — that the course, the interval, the stretch of time is divisible without limit — is what gave the arguments their bite in the first place.

  Here is the shape I have in mind, which you should feel free to redesign where it doesn't work.

  Phase one, the halving course (roughly twenty minutes). Lay out a twelve-metre strip with masking tape, marked at six metres, nine metres, ten and a half, and so on. Work in pairs: a runner and a referee. The rule is that a move counts only if it covers exactly half the distance remaining to the line, and only if the referee has measured and recorded it on an index card before the runner moves. Give each pair a hard time budget of forty-five seconds. Announce a small prize for the pair that ends closest to the line, doubled if anyone actually touches it. Nobody will touch it, and the prize will go to whichever pair made the most moves — a scoring rule that rewards failure in a way I want them to notice.

  Phase two, the completion with no final step (roughly fifteen minutes). Hand each pair a deck of cards whose widths halve — six centimetres, three, one and a half, and so on — and a paper strip the length of the sum. Each card is stamped with the time its corresponding move would be allowed: thirty seconds, fifteen, seven and a half, and so on. The pair lays the cards end to end against the strip, no overlaps permitted. The strip gets covered; the last few cards become too small to hold; and at no point is there a final card. Then ask the temporal question: if the runner were allowed exactly the time stamped on each card, the total is sixty seconds, and the runner is at the line at sixty seconds — so which move finished the run? The point I want them to reach on their own is that the completion is not one of the moves: the sequence has no last member, and the run nevertheless finishes.

  Phase three, the strobe (roughly fifteen minutes). Have a volunteer run across the room while the group samples their position at fixed intervals — phones on burst mode, or simply everyone writing down where the runner is every half second. Then, individually and in writing, each participant answers: in every sample the runner is at a place and not moving; if at every instant they are at a place and not moving, when were they moving? Collect the answers before discussing any of them. Most will give the answer that motion just is being at different places at different times; I want the debrief to show that this is a substantive thesis rather than a truism, and to let them feel that nothing in phase two touches the difficulty phase three produced.

  Phase four, the cut (roughly ten minutes). Give each group a strip of paper and a stack of blank cards and make them answer, with the materials, how the strip is built out of parts: is each part zero long or longer than zero? If zero, how do the zeroes add up to a length? If longer, how do finitely many of them cover it? This is the argument that the convergence reply answers least directly of all.

  Then the debrief, which should be the longest single block. I want a mapping in both directions: each rule in each phase onto the premise it encodes, and each of the three arguments onto the phase that made it felt. I want the reply that the infinite series has a finite sum placed precisely — it is not a refutation but a solution inside a theory, and the historically dominant alternative, that the infinite is only ever potential and never completed, denies exactly the premise the reply needs, which is why the Aristotelian line both feels right and leaves the runner's arrival unexplained. I want the distinction between describing a motion and a motion occurring to be made explicit, since that is where the arrow lives. I want the discreteness option treated seriously rather than as a cop-out: if space and time come in smallest units, the halving argument fails at the first step and phase one was rigged from the start, and I want the debrief to say so — my own rules quietly assumed infinite divisibility, and a group that assumed otherwise would have found the game unfair.

  Three more things I need from you. First, a frank account of what will predictably go wrong when this is run for the first time and how to handle it — I expect someone to say "take the limit" in phase one and consider the matter closed, someone else to declare the card exercise a cheat because they can obviously place a card over a hairline gap, and my physics students to invoke Planck-scale discreteness as though it settled the matter. Second, a clear statement of which feature of the idea the activity cannot reproduce and which I therefore have to supply myself: the room will never make anyone doubt that motion occurs, and my four phases all presuppose the standard analysis of the continuum, so they can dramatize the halving argument's dissolution but cannot stage the live dispute between that analysis, the infinitesimal alternatives to it, and the refusal of completed infinities — nor can they recover the original setting, in which these arguments were weapons in a dispute about the one and the many rather than puzzles about limits. Third, a fifty-minute version for a smaller group, and a lecture-hall version using four volunteers, since I may be asked to run this for a hundred students next term.
reasoning: |-
  We are designing an activity for a metaphysics seminar on Zeno's paradoxes. The goal is to have students experience the paradoxes through activities before discussing them. The activity has four phases, each targeting a different argument: the halving (dichotomy), the arrow, and the composition. We also need a debrief that ties the activities to the arguments and addresses the underlying assumptions.

  Materials needed (all fit in a bag):
  - Masking tape (for marking a 12m strip on the floor, with marks at 6m, 9m, 10.5m, etc. - every half of the remaining distance to the goal)
  - Index cards and pens for recording moves
  - A deck of cards (or paper strips) with widths halving: start with 6cm, then 3cm, 1.5cm, ... down to very small (about 10-12 cards should suffice; the last ones will be tiny). Each card should have a time stamp: 30s, 15s, 7.5s, etc. (so the time also halves each step). The total length of the strip should equal the sum of these card widths (so about 12 cm, since 6+3+1.5+... = 12 for an infinite series, but we use finite steps). We can pre-calculate the total for a finite series (e.g., 10 cards) and make a strip of that length.
  - A long strip of paper (for phase four) and blank cards (or small pieces of paper) for cutting.

  We also need a timer (phone timer will do) and a way to take burst photos (phones) or a method for students to record positions at fixed intervals (e.g., every half second).

  Phase breakdown and timing (total 80 minutes):
  - Phase 1: Halving Course (20 min)
  - Phase 2: Completion with No Final Step (15 min)
  - Phase 3: Strobe (15 min)
  - Phase 4: The Cut (10 min)
  - Debrief: 20 min

  But let's adjust the timing to fit 80 minutes and leave room for transitions.

  Revised timing (approximate):
  - Phase 1: 20 min
  - Phase 2: 15 min
  - Phase 3: 15 min
  - Phase 4: 10 min
  - Debrief: 20 min (total 80)

  Now, let's design each phase.

  Phase 1: The Halving Course (Dichotomy)
  - Set up a 12m tape strip on the floor with marks at 6m (half of 12), 9m (half of remaining 6m: so 12-6=6 remaining, half is 3m, so 6m+3m=9m), 10.5m (half of remaining 3m: 1.5m, so 9m+1.5m=10.5m), 11.25m, 11.625m, etc. (up to about 11.8125m for 5 marks, but we can do more if space allows). We can pre-mark at 0, 6, 9, 10.5, 11.25, 11.625, 11.8125, 11.90625, 11.953125, ... but we don't need too many because the distances get very small.
  - Students work in pairs: one runner, one referee. The rule: the runner must start at 0. Each move must cover exactly half the remaining distance to the finish line (12m). Before each move, the referee must measure and record the distance covered on an index card (e.g., "Move 1: 6m", "Move 2: 3m", etc.). The runner cannot move until the referee has recorded the move and given the go-ahead.
  - They have a hard time limit of 45 seconds. The prize: the pair that ends closest to the finish line wins a small prize (e.g., candy). If any pair touches the line, they get double. But note: the rules require that each move must be exactly half the remaining, so if they are at 11.90625m (after 6 moves), the next move would be half of the remaining (12-11.90625=0.09375m, so 0.046875m) but they might not have a mark and the distance is tiny. They will run out of time because of the recording step. 
  - We expect no one to reach the end. The pair that made the most moves (and hence got the closest) wins. But note: the scoring rewards the pair that made the most moves (which is the one that got the closest without touching). The instructor should note that the prize is for getting closest, which in this case means making the most moves (and hence being the most "successful" at failing to finish).

  Phase 2: Completion with No Final Step (Continuation of Dichotomy, but focusing on the completion of the infinite series)
  - Each pair gets a deck of cards (or paper strips) with widths: 6cm, 3cm, 1.5cm, 0.75cm, ... (about 10-12 cards). Each card is stamped with the time: 30s, 15s, 7.5s, 3.75s, etc. (the time for each move in the halving argument). They also get a paper strip that is exactly the length of the sum of the card widths (for 10 cards, the total length is 6*(1 - (1/2)^10)/(1 - 1/2) = 6*(1 - 1/1024)/(0.5) ≈ 6 * (1023/1024) * 2 ≈ 12 * (1023/1024) ≈ 11.988 cm). So the strip is about 12 cm long, but the cards won't cover the last 0.012 cm (if we use 10 cards). Alternatively, we can make the strip 12 cm and note that the infinite series would cover exactly 12 cm, but we have a finite set of cards so there's a gap.
  - Task: Lay the cards end to end without overlapping to cover the strip. They will be able to cover most of it, but the last part (a tiny gap) remains. They cannot cover the gap because the next card would be half the last (e.g., 0.375cm for the 11th card) but they don't have it (or if they do, we can have 12 cards and still a small gap because the series is infinite). The point is that with a finite set, there is always a gap. But even if we had infinitely many, there is no last card to place. Then ask: if the runner were allowed the time on each card (30s for the first 6m, 15s for the next 3m, etc.), the total time would be 60 seconds (for an infinite series: 30+15+7.5+...=60). So at 60 seconds, the runner has covered the whole distance. But which move was the one that finished the run? There is no last move because the moves are infinite. The run finishes without a final step.

  Phase 3: The Strobe (Arrow Paradox)
  - Have a volunteer run across the room (about 5-10m). The rest of the group will record the runner's position at fixed intervals (every 0.5 seconds). We can do this by having everyone with a phone take burst photos (if feasible) or simply by having everyone write down the position (e.g., at the sound of a beep every 0.5s). The instructor can use a timer that beeps every 0.5s. The runner starts at time 0 and runs at a steady pace. We do this for about 5-10 seconds (so 10-20 samples). 
  - Then, individually and in writing, each student answers: "In every sample (at every instant) the runner is at a place and not moving. If at every instant they are at a place and not moving, when were they moving?" Collect the answers without discussion.

  Phase 4: The Cut (Composition)
  - Each group (of 2-4 students) gets a strip of paper (say 10cm long) and a stack of blank cards. Their task: using the materials, show how the strip is built out of parts. They must answer: if they cut the strip into parts (by placing cards to mark divisions), then each part must be either (a) of zero length or (b) of some positive length. If (a) how do an infinity of zero-length parts add up to 10cm? If (b) then how many parts are there? If finitely many, then how are they divided? If infinitely many, then how do they add up? They should use the cards to represent the parts (or the divisions). The goal is to experience the tension: if the strip is composed of points (zero-length) then how does length arise? If composed of extended minima (atoms), then how do we account for the infinite divisibility we assumed in the other phases?

  Debrief (20 min):
  - Map each phase to the argument:
    - Phase 1: Dichotomy (halving) - the runner cannot complete an infinite number of moves in a finite time. But we saw that they got arbitrarily close in 45 seconds. The convergence reply (the infinite series has a finite sum) shows that the time for each move halves too, so the total time is finite. But note: the activity assumed that the runner can make moves arbitrarily quickly, which requires that space and time are infinitely divisible.
    - Phase 2: This extends the dichotomy to show that the run can be completed without a final step. The convergence reply (finite sum of the series) explains how. But note: this reply assumes the actual infinite (that the entire infinite series is completed). Aristotle would say that the infinite is only potential: you can always divide further, but you never have an actual infinity of divisions. So the Aristotelian solution avoids the completed infinite but leaves the runner's arrival as a brute fact? Or explains it differently?
    - Phase 3: Arrow. At each instant, the arrow is at rest. But motion is not just being at different places at different times? The standard reply: motion is a fact about being at different positions at different times. But Zeno is challenging us to say what motion is over and above that. The arrow paradox is not resolved by convergence because it's about the nature of motion at an instant. The solution requires a theory of motion that accounts for velocity (or derivatives) at an instant, but that is a mathematical representation. Metaphysically, we might need to say that motion is primitive or that there are instantaneous states of motion (like in physics: velocity as a state).
    - Phase 4: Composition. The strip must be composed of either points (with no length) or extended atoms. If points, then how do they add up? (The standard measure-theoretic answer: they don't add up by counting, but by integration.) If extended atoms, then we have a minimal unit, which contradicts infinite divisibility. This argument is the hardest for the convergence reply because the convergence reply (used in phase 1 and 2) assumes the standard continuum (infinite divisibility) and so does not address the composition problem. In fact, the composition problem challenges the very coherence of the continuum. The convergence reply only works if we already accept the mathematical structure of the continuum (as in real numbers).

  - Highlight the unexamined assumption: infinite divisibility. Without it, phase 1 would have a minimal distance (so after a few moves, you couldn't move half the remaining because it would be less than the minimal unit). But then the runner could complete the run in finitely many moves (with the last move being the minimal unit). However, the physics students might bring up Planck length. But note: Planck length is not necessarily a minimal unit of space (it's a scale at which quantum gravity effects become important, but current theories do not necessarily say that space is discrete). Moreover, even if space is discrete, time might not be, or vice versa.

  - Also note: the activities presuppose the standard continuum. They cannot reproduce the historical context (Zeno was arguing against plurality and motion in a debate about the one and the many). The room won't doubt motion occurs, so we are only dramatizing the puzzles.

  Predictable problems and solutions:
  1. In phase 1, a student says "take the limit" and thinks it's solved. 
     - Handling: Note that the convergence reply is exactly that: the limit exists. But in the activity, we are experiencing the process of trying to complete the infinite steps. The point is that the process cannot be completed by adding steps one by one (as in the activity) but the runner in the real world does complete the motion. So the reply is a mathematical solution that requires accepting the actual infinite. But we must ask: does this mathematical solution capture the physical reality? And note that the Aristotelian rejects the actual infinite.

  2. In phase 2, a student says they can cover the gap by placing a card over it (even if it's small) or that the gap is negligible.
     - Handling: Admit that with finite cards there will be a gap, but stress that even if we had all the cards (infinitely many), there is no last card. The gap in the activity is because we only have a finite set, but the mathematical series has no gap. The key point is that the completion of the run does not require a last step. The series of moves has no last element, but the entire series is completed.

  3. Physics students invoking Planck-scale discreteness.
     - Handling: Acknowledge that some theories propose discrete spacetime, but note: (a) this is not settled physics, and (b) even if true, it would avoid Zeno's paradoxes by denying infinite divisibility. But then we must explain motion in discrete terms. Also, the paradoxes were formulated in a continuous setting and are still relevant for understanding the continuous model.

  What the activity cannot reproduce:
  - The activity cannot make the students doubt motion occurs. They know motion happens. So the point is to see how the paradoxes challenge our understanding of motion and to appreciate the philosophical issues.
  - The activity presupposes the standard continuum. We cannot simultaneously present the alternatives (infinitesimals, Aristotelian potential infinite, discrete space) in the activity. The debrief must introduce these as historical responses and note that the convergence reply is one solution within the standard continuum theory.

  Variations:

  A. For a 50-minute version (smaller group):
     - Skip phase 4 (the cut) because it is the most abstract and time-consuming to set up and debrief. Focus on the first three and the debrief.
     - Timing: 
          Phase 1: 15 min
          Phase 2: 10 min
          Phase 3: 10 min
          Debrief: 15 min (total 50)

  B. For a lecture hall (100 students) using 4 volunteers:
     - Phase 1: Set up the tape at the front. Have one pair of volunteers (runner and referee) do the activity while the class watches. They try to do as many moves as possible in 2 minutes (with the referee recording). The class can see the process and the difficulty. Then, ask the class: why didn't they reach the end? 
     - Phase 2: The instructor demonstrates with the cards and the strip. Show the cards and the strip. Lay the cards one by one (with the help of two volunteers). Show the gap and ask the temporal question.
     - Phase 3: Have a volunteer run across the front of the room. The instructor uses a timer (beep every 0.5s) and asks the class to write down the position at each beep (or just take a few samples: at 0s, 0.5s, 1.0s, etc.). Then ask the written question and collect a few responses (or have students discuss with a neighbor and then share).
     - Phase 4: Skip or do as a thought experiment. Or, the instructor demonstrates with a strip and cards: cut the strip by placing cards as dividers. Ask the questions: if each part has zero length, how does the strip have length? If each part has positive length, how many are there? 
     - Debrief: As in the original, but more lecture-style.

  Note: In a large lecture, it might be hard to have all students participate in writing for phase 3. We can have them discuss with neighbors and then share a few answers.

  Final note: The activities are designed to make the students feel the paradoxes. The debrief is crucial to connect the experiences to the arguments and to clarify the distinctness of the three paradoxes and the types of solutions.

  Let me write a step-by-step guide for the instructor.

  **Phase 1: The Halving Course (20 min)**
  1. Set up a 12m tape on the floor, marked at 6m, 9m, 10.5m, 11.25m, 11.625m, 11.8125m, 11.90625m, 11.953125m (or as many as practical). Label the marks: 1/2, 3/4, 7/8, 15/16, etc.
  2. Divide students into pairs (runner and referee). Explain the rules:
     - The runner starts at 0.
     - Each move must cover exactly half the remaining distance to the finish (12m). The runner must stop exactly at the next mark.
     - Before each move, the referee must measure and record the distance covered by that move on an index card (e.g., "Move 1: 6m", "Move 2: 3m", etc.). The runner can only move when the referee has finished recording and says "go".
     - They have 45 seconds total. The goal is to get as close to the finish as possible.
     - The prize: the pair closest to the finish wins. If anyone touches the finish (exactly at 12m), they get double. But note: to touch, they would have to make infinitely many moves, which isn't possible in 45 seconds.
  3. Start the timer for 45 seconds. Let the pairs attempt.
  4. After time, measure the distances. Award the prize to the pair with the most moves (which will be the closest). Note that the winning pair failed to complete the run.

  **Phase 2: Completion with No Final Step (15 min)**
  1. Distribute to each pair:
     - A deck of 10-12 cards with widths: 6cm, 3cm, 1.5cm, 0.75cm, ... (down to 0.05859375cm for 10 cards, for example). Each card has a time stamp: 30s, 15s, 7.5s, ... 
     - A paper strip of length equal to the sum of the first 10 card widths (approximately 11.988 cm for 10 cards, as calculated above). The strip is marked with 0 at one end and 12cm at the other (but note: the strip is slightly shorter than 12cm because we have a finite series). Alternatively, make the strip exactly 12cm and note that the cards don't cover it.
  2. Task: Lay the cards end to end without gaps or overlaps to cover as much of the strip as possible. They cannot cover the entire strip because the cards are finite and the infinite series would be exactly 12cm. They will have a gap at the end.
  3. Then, ask: "The total time for all the moves is 30s+15s+... = 60s (for the infinite series). So if the runner were allowed these time intervals, they would be at the finish at 60s. But in the series of moves, which move was the one that finished the run? The last card in the deck? But note: our deck has a last card, but in the infinite series there is no last card. How then is the run finished?"

  **Phase 3: The Strobe (15 min)**
  1. Choose a volunteer to run across the room (about 5-10m) at a steady, moderate pace.
  2. Have the rest of the class record the runner's position at fixed intervals (every 0.5 seconds). Use a timer that beeps every 0.5s. At each beep, students write down the position (e.g., "at 0s: start", "at 0.5s: 1m", "at 1.0s: 2m", etc.). Do this for about 5 seconds (10 samples). 
  3. Then, pose the question in writing: "At every sampled instant, the runner was at a specific place and not moving (since at an instant there is no time to move). If at every instant the runner is not moving, then when did the motion occur?" 
  4. Collect the written answers without discussion.

  **Phase 4: The Cut (10 min)**
  1. Group students into groups of 3-4. Give each group a 10cm paper strip and a stack of blank cards (at least 20).
  2. Task: Using the materials, show how the strip is composed of parts. They must consider two options:
     Option A: The strip is made of points (zero length). How can they represent that? (They might place cards as markers between points.) How do many zeros add up to 10cm?
     Option B: The strip is made of extended parts. Then they must decide: are there finitely many or infinitely many? If finitely many, how many? (They can cut the strip by placing cards as dividers to create segments.) If they choose infinitely many, how do they represent that? And how do infinitely many extended parts add up to 10cm?
  3. Let them work for 5 minutes. Then, have each group report briefly.

  **Debrief (20 min)**
  - Go through each phase and connect to the paradoxes:
    - Phase 1: Dichotomy. The rule of halving and recording each move mimics the infinite divisibility. The difficulty: completing infinitely many steps. But in 45 seconds, they got arbitrarily close. The convergence of the series (1/2 + 1/4 + ... = 1) shows that the time sums to 45 seconds? Actually, in our activity the time per move was not halving? We didn't control time per move. In the halving argument, the time per move also halves. That's phase 2's point. So the solution is that the series converges. But note: this requires the actual completion of an infinite series. Aristotle would say: the infinite is potential, not actual. We never have an actual infinity of steps; we only have the potential to keep dividing. But then how does the runner complete the run? The Aristotelian says: the runner does not perform an actual infinity of moves; they simply move continuously.

    - Phase 2: This shows that the run can be completed without a final step. The convergence reply (finite sum) answers the dichotomy. But it does so by using the actual infinite. The gap in the card activity is because we used a finite series; the infinite series has no gap. The completion is not by a last move but by the whole series. But the arrow paradox is untouched.

    - Phase 3: Arrow. At each instant, the arrow is at rest. But motion is more than just being at different places at different times. The standard reply is that motion is a temporal phenomenon: it is the occupation of different places at different times. But at each instant, what is the state of motion? We might say that at each instant the runner has a velocity (a derivative). This is a mathematical representation. Metaphysically, we might say that motion is a primitive or that there are instantaneous states of motion. The arrow paradox challenges us to explain what motion is at an instant.

    - Phase 4: Composition. The strip must be composed of either points (with no length) or extended parts. If points, how does length arise? (The standard answer: by the structure of the continuum, points are not parts but limits.) If extended parts, then either there is a smallest part (atom) or the parts are infinitely divisible. If there is a smallest part, then we avoid the infinite regress but deny infinite divisibility. The convergence reply (from phase 1 and 2) does not help here because it assumes a continuous, infinitely divisible space.

  - Emphasize: the three arguments are distinct and require different kinds of replies.
  - Also, the unexamined assumption: infinite divisibility. Without it, the first two paradoxes don't get off the ground (because you can't keep halving forever). But then we need an atomistic theory. With it, we need a theory of the continuum (like the real numbers) to resolve the paradoxes.

  Finally, note that Zeno's arguments were part of a larger debate about plurality and change. The activity cannot capture that context, but it can help us see the logical puzzles.

  This design should meet the requirements. The instructor should be prepared to handle the predictable issues and to clarify the distinctions in the debrief.
answer: |-
  Below is a comprehensive activity design for your Zeno's paradoxes seminar, structured to make students *experience* the paradoxes through hands-on challenges before formal analysis. The activity emphasizes distinctness of the three arguments (halving/dichotomy, arrow, composition) and targets your learning objectives. I've refined your proposed structure for clarity, predictability, and philosophical precision, and added contingency plans for common pitfalls. Materials fit in a backpack.

  ---

  ### **Materials List** (All fit in a standard backpack)
  - **Masking tape** (for marking floors)
  - **Measuring tape** (for precision)
  - **Index cards** (30–40)
  - **Pens** (16)
  - **Deck of halving-width cards**: Pre-cut cards from cardstock (widths: 6cm, 3cm, 1.5cm, 0.75cm, 0.375cm, 0.1875cm, 0.09375cm, 0.046875cm). Each stamped with time: 30s, 15s, 7.5s, 3.75s, 1.875s, 0.9375s, 0.46875s, 0.234375s.  
  - **Paper strips**: One 12cm strip (for Phase 2), one 10cm strip per group (Phase 4).  
  - **Timer** (phone suffices).  
  - **Small prize** (e.g., chocolate bar).  

  ---

  ### **Activity Flow** (80 Minutes Total)
  **Pre-Activity Setup (5 mins)**:  
  - Use masking tape to mark a 12m course on the floor with clear start/finish lines. Pre-mark points at 6m, 9m, 10.5m, 11.25m, 11.625m.  
  - Distribute materials to pairs (8 pairs total).  

  #### **Phase 1: The Halving Course (20 mins)**  
  **Goal**: Experience the infinite regress of the dichotomy paradox; expose the assumption of infinite divisibility.  
  ```  
  Rules:  
  1. Pairs: Runner moves; Referee measures, records each move on an index card.  
  2. A "valid move" must cover *exactly half* the remaining distance to the finish.  
  3. Referee must measure, record, and say "Recorded!" before the runner moves.  
  4. Hard time limit: 45 seconds.  
  5. Prize: Closest pair to finish wins. Double prize if finish line touched.  
  ```  
  **Predictable Issues & Handling**:  
  - **"Take the limit" interjection**: If a student says this, respond: *"Assume we’re pre-calculus Greeks. Show me how you’d touch the line under these rules."* Forces engagement with process, not abstract math.  
  - **Physics students invoke Planck length**: Note: *"Planck length is theoretical; here, we’re bound by these rules. Do they let you finish?"*  
  - **Expected outcome**: No one finishes. Prize goes to the pair with most moves (e.g., reaching 11.625m after 4 moves). Highlight the irony: **The prize rewards failure** (more moves = closer but incomplete).  

  ---

  #### **Phase 2: Completion with No Final Step (15 mins)**  
  **Goal**: Show that convergence resolves the dichotomy but requires accepting a completed infinite series.  
  ```  
  Rules:  
  1. Each pair gets halving-width cards and a 12cm paper strip (length = Σ of card widths for 8 cards ≈ 11.98cm).  
  2. Task: Lay cards end-to-end to cover the strip. No overlaps or gaps.  
  3. Then: "Total time = 60 seconds. If the runner moves per card, they finish at 60s. Which move completed the run?"  
  ```  
  **Predictable Issues & Handling**:  
  - **"We can cover the gap!"**: When students point out the 0.02mm gap, reply: *"Assume perfect precision. Is there a final card? If you had infinite cards, would there be a last one?"*  
  - **"It’s a cheat—real runners don’t pause!"**: Agree, but stress: *"This models time-slicing. The question is: how does the run end without a final step?"*  
  **Key Insight**: Completion happens, but no move is "last." The run finishes *because the infinite series sums to 12cm/60s*.  

  ---

  #### **Phase 3: The Strobe (15 mins)**  
  **Goal**: Isolate the arrow paradox; show motion cannot be reduced to static positions.  
  ```  
  Rules:  
  1. Volunteer runs 10m at steady speed.  
  2. Class samples position every 0.5s (use phone timers or instructor’s calls).  
  3. Individually, write: *"At every sampled instant, runner is ‘here’ and motionless. When did motion occur?"*  
  4. Collect responses before discussion.  
  ```  
  **Predictable Issues & Handling**:  
  - **"Motion is change over time"**: Most answers will say this. In debrief, challenge: *"Is that a tautology? Zeno asks: what is motion *at an instant*?"*  
  - **Physics students cite frames of reference**: Redirect: *"We’re tracking position in one frame. Does that explain motion, or describe it?"*  
  **Key Insight**: Convergence doesn’t touch this. Motion requires a metaphysical account (e.g., velocity-as-instantaneous-state).  

  ---

  #### **Phase 4: The Cut (10 mins)**  
  **Goal**: Surface the composition paradox; show convergence doesn’t resolve it.  
  ```  
  Rules:  
  1. Groups (4 groups of 4) get a 10cm paper strip and blank cards.  
  2. Task: "Use cards to divide the strip into parts. If parts have length:  
     - If >0, how do finitely many cover 10cm?  
     - If =0, how do zeros sum to 10cm?"  
  ```  
  **Predictable Issues & Handling**:  
  - **"Atoms!"**: If groups propose minimal units, ask: *"Does your ‘atom’ have length? If so, how do you divide it?"*  
  - **Math students invoke integrals**: Note: *"Integrals measure length but don’t say what parts *are*."*  
  **Key Insight**: Halving’s convergence reply fails here—it assumes a continuum but doesn’t explain its structure.  

  ---

  ### **Debrief (20 mins)**  
  Map activities to arguments candidly. Emphasize:  
  1. **Three distinct puzzles, not one**:  
     - **Halving (Phase 1-2)**: Solved by convergence *if* we accept actual infinities.  
     - **Arrow (Phase 3)**: Untouched by convergence; requires a theory of motion (e.g., motion as primitive, or instantaneous velocity).  
     - **Composition (Phase 4)**: Convergence answers only by presupposing a continuum (e.g., real numbers).  

  2. **The core assumption**:  
     - Infinite divisibility was baked into every phase (e.g., halving ad infinitum). Without it, Phase 1 is rigged—minimal units would let runners finish. But *with* it, Zeno’s bite is felt.  

  3. **What the room couldn’t show**:  
     - **Motion’s reality**: Activities dramatize puzzles but can’t make motion *doubtful*—we presuppose it.  
     - **Continuum alternatives**: We assumed standard analysis (real numbers). We couldn’t stage:  
       - Aristotelian potential infinity (infinite divisibility without completed infinities).  
       - Infinitesimals (indivisible parts with non-zero length).  
       - Atomism (discrete space/time).  
     - **Historical context**: Zeno’s arguments were weapons against pluralism, not puzzles about limits.  

  4. **Convergence as theory-dependent**:  
     - It resolves halving only inside a theory with actual infinities (e.g., calculus). Aristotle’s potential infinity denies this, making convergence unavailable—hence his "solution" feels intuitive but leaves completion mysterious.  

  ---

  ### **Scaled Versions**
  **A. 50-Minute Version (Small Group)**  
  - Skip Phase 4 (composition).  
  - Timings:  
    - Phase 1: 15 mins  
    - Phase 2: 10 mins  
    - Phase 3: 10 mins  
    - Debrief: 15 mins  
  - Focus: Halving vs. arrow, and why convergence doesn’t unify them.  

  **B. Lecture-Hall Version (100 Students, 4 Volunteers)**  
  - **Phase 1**: One volunteer pair runs the course; class watches. Time: 5 mins.  
  - **Phase 2**: Instructor demonstrates card/strip with volunteers. Time: 5 mins.  
  - **Phase 3**: Volunteer runs; class samples via show of hands (e.g., "Raise hand at 0.5s intervals when runner passes your section"). Time: 5 mins.  
  - **Phase 4**: Thought experiment. Poll: "Can space be divided infinitely? If not, what’s the smallest unit?" Time: 5 mins.  
  - **Debrief**: 15 mins. Use slides to map activities/arguments.  

  ---

  ### **Why This Works**  
  - **Rules generate difficulty**: Students hit paradoxes *procedurally* (e.g., Phase 1’s recording rule forces regress; Phase 3’s strobe forces static snapshots).  
  - **Unexamined assumption exposed**: Infinite divisibility is the silent enforcer. Debrief makes it explicit.  
  - **No "calculus fixes it" cop-out**: Convergence is framed as a *choice* within a theory, not a universal refutation.  
  - **Portable and cheap**: Materials cost <$20 and fit in a bag.  

  This design ensures students leave seeing Zeno’s arguments as distinct, the limits of convergence, and how their assumptions about divisibility shape the puzzles.
