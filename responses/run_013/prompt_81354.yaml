     4. Critiques of frequentism: 
          a) p-values are often misinterpreted (e.g., as the probability that the null is true).
          b) Frequentist methods do not incorporate prior knowledge, which can lead to overestimation of effects when prior knowledge suggests they are unlikely.
          c) Bayesian methods naturally handle sequential analysis (peeking) without needing special adjustments.

