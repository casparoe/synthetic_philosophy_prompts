prompt: |-
  I'm taking a jurisprudence class and we've been doing the Hart-Devlin debate on legal moralism. I definately missed the lecture where the prof gave the overview, so I copied a friend's notes. They say: 'Devlin's position was that the law should enforce morality because any immorality, even private and consensual, corrodes the shared moral code and will eventually cause society to disintegrate. Hart responded with Mill's harm principle: since private immorality harms no one, the state has no business punishing it. Hart also drew a distinction between positive morality and critical morality, which basically means that when we judge our society's morality we should use our own personal moral views rather than just accept what everyone around us believes. So the debate is really just Devlin's conservative morality versus Hart's liberal morality, and Hart basically won -- the harm principle is settled and legal moralism is dead.'

  I'm pretty sure this isn't totally wrong, but it seems too tidy, and I don't trust my friend's ability to separate a summary from a punchline. Can you act like a legal philosopher who specializes in this debate and give me an audit? Start by brainstorming the main claims in the summary, then go claim by claim: what would a specialist accept, what would they wince at, and what is just wrong? In particular, I want to know whether Devlin really held the extreme view that all private immorality threatens social disintegration, whether Hart's positive/critical distinction is just about using your own personal morality, and whether the claim that Hart won and legal moralism is dead is something the summary is entitled to. I also vaguely remember something about Devlin's reasonable man and a real-and-present-danger sort of test, and Hart saying the empirical premise about disintegration is doing all the work -- if that's relevant, please work it in. And if the summary gets Hart's use of the harm principle wrong, what is the more accurate way to state his view about when the law may enforce morality? Please don't just give me a list of names and books -- I'm trying to understand the positions, not write a bibliography.
