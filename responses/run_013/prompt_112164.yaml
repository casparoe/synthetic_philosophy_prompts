  The user's friend claims that the argument proves private language is impossible, which is correct. However, saying it's like naming a beetle that only you can see – that's standard. But the friend then jumps to saying this means the inner world falls apart and sensations are just dispositions to behave. That's where behaviorism comes in, which is a common misinterpretation. Wittgenstein explicitly rejected behaviorism. He didn't reduce mental states to behavior; he argued that language about mental states depends on public criteria, not that the states themselves don't exist.

  The user mentioned the "inner world collapses" step might be smuggled in. That's spot on. The argument is about language and meaning, not the existence of inner states. The friend conflates the impossibility of private language with the non-existence of inner experiences. That's a big leap. Also, labeling Wittgenstein as a behaviorist is problematic. While some interpretations lean that way, most scholars see him as challenging both Cartesian dualism and behaviorism.

