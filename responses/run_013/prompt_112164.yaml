  The user won't read secondary literature, so I need to provide clear, concise corrections. Suggest that the character might oversimplify but shouldn't make elementary mistakes. Maybe the character could reference the common behaviorist misinterpretation but hint at its controversy. That adds depth without inaccuracy.

