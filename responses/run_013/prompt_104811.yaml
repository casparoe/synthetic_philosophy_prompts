answer: |-
  Based on the commission's recorded verdicts and the features cited, I identify three candidate rules that fit the historical pattern. The record is not incoherent; it reflects a principled but context-sensitive approach that balances humanitarian necessity against procedural legitimacy and practical feasibility. Below, I list the candidate rules, apply them to the Marava case, predict the verdict, and suggest a further case to test the rules.

  ### Candidate Rules Consistent with the Record
  1. **Rule A: Humanitarian Necessity with Strict Constraints**  
     Intervention may be endorsed without UNSC authorization *only if*:  
     - There is an ongoing or imminent mass atrocity (e.g., ethnic cleansing, massacres).  
     - The mission has limited aims (e.g., civilian protection only, no regime change).  
     - The coalition is cohesive and broadly supported (not self-interested or divided).  
     - There is a credible, limited plan with a fixed exit condition.  
     *Fits all cases*: Kosovo (endorsed: atrocity ongoing, aims limited, coalition cohesive); Iraq (opposed: threat speculative, aims regime change, coalition divided); Libya (endorsed initially: atrocity imminent, authorization present; later criticism for exceeding mandate); Syria (opposed: no atrocity cited, no credible plan).

  2. **Rule B: Authorization-Preferred with Humanitarian Override**  
     Intervention is opposed without UNSC authorization *unless*:  
     - There is an ongoing or imminent mass atrocity, *and*  
     - The veto is clearly unreasonable or abusive (e.g., blocking action against genocide).  
     Additional factors: Limited aims, credible plan, and coalition cohesion strengthen the case but are secondary to atrocity and veto abuse.  
     *Fits all cases*: Kosovo (endorsed: atrocity ongoing, veto certain and abusive); Iraq (opposed: no clear atrocity, veto not cited as abusive); Libya (endorsed: authorization present); Syria (opposed: no atrocity cited, veto not framed as abusive).

  3. **Rule C: Mandate Adherence as Paramount**  
     Intervention is endorsed *only if*:  
     - The mandate is strictly limited to civilian protection (no regime change or open-ended goals).  
     - There is a credible plan with a fixed exit condition.  
     Authorization and atrocity severity are important but not decisive alone; exceeding the mandate (e.g., regime change) invalidates endorsement.  
     *Fits all cases*: Kosovo (endorsed: aims limited); Iraq (opposed: aims regime change); Libya (endorsed initially but mandate later violated); Syria (opposed: no credible plan).

  ### Application to Marava
  - **Humanitarian necessity**: Ongoing mass killing (matches Kosovo/Libya; stronger than Iraq/Syria).  
  - **Authorization**: Absent due to veto (matches Kosovo; weaker than Libya).  
  - **Aims and plan**: Protection-only, no regime change, fixed exit condition (matches Kosovo; stronger than Iraq/Libya’s deviation).  
  - **Coalition**: Not described as divided or self-interested (unlike Iraq), but regional split may imply legitimacy concerns (neutral/weak negative).  
  - **Other factors**: Veto deadlock mirrors Kosovo; failed sanctions/mediation underscore necessity.  

  **Predictions**:  
  - **Rule A predicts ENDORSEMENT**. Marava meets all criteria: ongoing atrocity, limited aims, credible exit plan. Coalition cohesion is implied (no negative indicators), and regional split is not a cited factor in past cases.  
  - **Rule B predicts ENDORSEMENT**. Ongoing atrocity and veto deadlock (implied abusive) override lack of authorization; limited aims/plan are secondary but present.  
  - **Rule C predicts ENDORSEMENT**. Strictly limited mandate and credible exit condition are satisfied; authorization is secondary.  

  ### Best Guess and Reasons
  **Predicted verdict: ENDORSEMENT (with high confidence)**.  

  **Reasons for preferring endorsement**:  
  - Marava aligns perfectly with **Kosovo (1999)**, the closest precedent: no authorization, ongoing atrocity, protection-only aims, and a fixed exit condition. The commission overrode authorization concerns in Kosovo due to humanitarian necessity, and Marava’s identical features would compel a similar override.  
  - **Divergences from opposed cases**:  
    - Unlike **Iraq (2003)**, Marava involves *ongoing* atrocities (not speculative threats) and *no regime-change aim*.  
    - Unlike **Syria (2013)**, Marava has a *credible, limited plan* with a clear end-state (exit tied to killings stopping).  
    - Unlike **Libya (2011)**, the mandate explicitly rules out regime change, preempting mandate violations.  
  - **Regional split is not decisive**: The commission has never treated regional consensus as necessary (e.g., Kosovo proceeded despite Russian opposition). Coalition cohesion matters more (cited in Kosovo/Iraq), and Marava’s coalition is not criticized as divided.  
  - **Humanitarian necessity is paramount**: The ongoing killings and failed alternatives (sanctions/mediation) mirror Kosovo’s urgency, making authorization less critical.  

  ### Further Case to Test the Rules
  To distinguish Rule A (cohesion-focused) from Rule B (veto-abuse-focused) and Rule C (mandate-focused):  
  - **Hypothetical case**: An ongoing atrocity with no authorization (veto certain), limited aims, and a credible exit plan—but the coalition is *divided and self-interested* (e.g., interveners have conflicting economic agendas).  
    - **Rule A predicts OPPOSITION** (coalition cohesion is necessary).  
    - **Rule B predicts ENDORSEMENT** (atrocity/veto override coalition flaws).  
    - **Rule C predicts ENDORSEMENT** (mandate/plan are satisfied).  
    This case would reveal whether coalition integrity is a standalone requirement (Rule A) or secondary to atrocity/mandate (Rules B/C).  

  ### Final Note
  The record is coherent and points to endorsement for Marava. The commission prioritizes stopping mass atrocities when a mission is constrained, feasible, and uncontaminated by ulterior motives, even without authorization. Marava meets this threshold decisively.
