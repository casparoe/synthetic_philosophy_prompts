  ### Decision Tree: Causal Status of Symbolic Descriptions in the Careenium

  **Scratch Section: Brainstorming Independent Commitments**  
  I identified 7 independent dimensions that generate distinct positions. Each dimension is a yes/no or three-way fork, and combinations define coherent views. The core commitments are:  
  1. **Reality of symbolic patterns**: Are they objective features or observer-dependent?  
  2. **Completeness of simm-level dynamics**: Do simm interactions suffice to explain all behavior?  
  3. **Distinctness of symbolic properties**: Are they separate from simm arrangements?  
  4. **Causal efficacy of symbolic properties**: Can they exert causal influence?  
  5. **Causal exclusion**: If simm-level is complete and symbolic properties are distinct, must the latter be excluded?  
  6. **Type of causation**: Is causation force-transfer or difference-making?  
  7. **Indispensability of symbolic descriptions**: Are they pragmatically necessary?  

  These are orthogonal except:  
  - (5) presupposes distinctness and completeness.  
  - (4) is only asked if symbolic properties exist.  
  - (6) clarifies how causal efficacy is understood.  

  ---

  ### Decision Tree  
  *Start at Q0. Answer sequentially without peeking at outcomes. Each question is about the careenium case only.*

  **Q0: Is the quarrel over whether symbolic descriptions (e.g., "simmball X represents Y") explain behavior a substantive disagreement, or a confusion to be dissolved?**  
  - **Substantive** → Q1  
  - **Confusion** → **Dissolution (e.g., pragmatic pluralism)**  
    *Most awkward commitment: Must explain why both sides sound compelling despite no real disagreement.*

  **Q1: Are symbolic properties (e.g., "representing Y") objective features of the careenium, or tools imposed by observers?**  
  - **Objective** → Q2  
  - **Imposed** → Q3  

  **Q2: Can simm-level dynamics (attractions/repulsions) fully explain all careenium behavior without gaps?**  
  - **Yes** → Q4  
  - **No** → Q5  

  **Q3: Is the symbolic description indispensable for predicting/explaining behavior (e.g., "simmball guides action")?**  
  - **Yes** → **Instrumentalism or stance-dependence**  
    *Most awkward commitment: Success of symbolic models is coincidental if patterns aren’t real.*  
  - **No** → **Eliminativism about the symbolic level**  
    *Most awkward commitment: Must explain why we use symbolic descriptions if they are useless.*

  **Q4: Are symbolic properties distinct from their underlying simm arrangements?**  
  - **Distinct** → Q6  
  - **Not distinct** → **Reductive identity**  
    *Most awkward commitment: Symbolic properties are identical to simm configurations, but multiple realizability threatens this identity.*  

  **Q5: Are symbolic properties distinct from their underlying simm arrangements?**  
  - **Distinct** → **Emergentism**  
    *Most awkward commitment: Novel causal powers emerge from simms but aren’t reducible to them.*  
  - **Not distinct** → *Unoccupied*  
    *Diagnosis: Incoherent. If symbolic properties aren’t distinct and simm-level is incomplete, nothing fills the explanatory gap.*  

  **Q6: Must symbolic properties be causally excluded if simm-dynamics are complete?**  
  - **Yes** → **Causal exclusion or epiphenomenalism**  
    *Most awkward commitment: Symbolic properties exist but do nothing (e.g., "representing Y" doesn’t steer behavior).*  
  - **No** → Q7  

  **Q7: Does symbolic causation require transferring force (like simms), or is it difference-making (counterfactual dependence)?**  
  - **Force-transfer** → *Unoccupied*  
    *Diagnosis: Unattractive. Force-transfer implies systematic overdetermination (simmballs and simms both "push").*  
  - **Difference-making** → **Non-reductive physicalism (causal powers inherited)**  
    *Most awkward commitment: Symbolic properties inherit causal powers from simm realizers, but avoiding overdetermination is tricky.*  

  ---

  ### Position Key and Unresolved Pairs  
  - **Leaves covered**:  
    - Eliminativism (Q3→No)  
    - Reductive identity (Q4→Not distinct)  
    - Non-reductive physicalism (Q7→Difference-making)  
    - Causal exclusion/epiphenomenalism (Q6→Yes)  
    - Realism about real patterns (built into Q1→Objective branches)  
    - Instrumentalism/stance-dependence (Q3→Yes)  
    - Dissolution (Q0→Confusion)  
    - Emergentism (Q5→Distinct)  
    - *Unoccupied* (Q5→Not distinct; Q7→Force-transfer)  

  - **Unseparated pairs**: None. The tree isolates all named positions.  
    *If a position seems missing (e.g., strong emergence), it would require:  
    **Additional question**: "Do symbolic properties have fundamental causal powers (not inherited from simms)?"*  

  ---

  ### Where Most Disagreement Lives  
  1. **Q1 (Objective vs. Imposed)**: Philosophers often defend objectivity; cognitive scientists lean pragmatic.  
  2. **Q6 (Causal exclusion)**: The heart of non-reductive physicalism debates. Does completeness "squeeze out" symbolic causation?  
  3. **Q2 (Completeness of simm-level)**: Cognitive scientists often assume "yes"; philosophers question if this trivializes higher-level explanations.  

  This tree forces clarity on commitments, bypassing labels. Positions emerge from combinations, not preconceptions.
