  We begin by brainstorming commitments that could separate reasonable people. We want independent commitments that can be combined to define positions.

  Key independent dimensions:

  1. **Existence of higher-level properties**: Do properties at the symbolic level (like "representing X") exist?
  2. **Causal efficacy of higher-level properties**: If they exist, do they have causal powers?
  3. **Completeness of lower-level causal story**: Is the simm-level causal story complete (i.e., sufficient to explain all behaviors without gaps)?
  4. **Relation between levels**: Are symbolic properties identical to, constituted by, or dependent on simm-level properties? Or are they distinct?
  5. **Pattern reality**: Are the patterns we observe at the symbolic level real (i.e., mind-independent) or are they observer-dependent?
  6. **Causal exclusion**: If the simm-level is causally complete and the symbolic level is distinct, then does the symbolic level get excluded from having causal powers?
  7. **Type of causation**: Is causation about transferring force (like in physics) or about making a difference (counterfactual dependence)?

