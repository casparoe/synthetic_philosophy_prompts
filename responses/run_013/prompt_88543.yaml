prompt: |-
  A friend and I argued until two in the morning about a way of deciding that she calls rule-worship and that I can neither defend nor abandon. When a decision matters, I settle it by asking which rule I would have wanted to have adopted before I knew which of several situations I would turn out to be in; then, once I know which one I am in, I act on the rule anyway, even where the reasons plainly favour something else. Nothing binds me: I keep the information, and I could change my mind at any moment. I refuse to pay off a blackmailer when paying would cost me less; I keep a promise made by a much younger self who had none of my present information; and in one-off dealings I behave as though my conduct were the sample from which strangers forecast how people like me will behave. She says this is precommitment with the commitment left out, and so either confused or self-serving. I suspect it belongs with precommitment, and with the manoeuvre of choosing as if I did not know who I would be, but I want the carving rather than the label. Does the thing I am doing have an established name? What makes it rational to follow a rule I know to be worse for the case I am actually in? And where does it come apart from precommitment, from the veil-of-ignorance manoeuvre, and from plain stubbornness? If nothing established fits, coin a name and mark its edges. Please answer in British English.
reasoning: |-
  Hmm, the user is describing a philosophical dilemma about decision-making that they've been arguing about with a friend. They're using a specific method where they imagine adopting rules before knowing their actual situation, then sticking to those rules even when it seems disadvantageous in the moment. They've given examples like refusing blackmail, keeping old promises, and behaving consistently in one-off interactions to maintain reputation. Their friend calls this "rule-worship" and claims it's either confused or self-serving.

  The user wants to know if their approach has an established name, why it might be rational to follow rules that seem suboptimal in specific cases, and how it differs from concepts like precommitment, veil-of-ignorance reasoning, and stubbornness. They also want precise distinctions if no existing term fits perfectly.

  I need to analyze this as a philosophical reasoning problem. The core idea seems to be about rule-consequentialism or perhaps a form of Kantian categorical imperative, but with a personal twist. The user emphasizes they're not actually bound - they could change their mind but choose not to.

  For naming possibilities: "ex ante rule selection" captures the pre-knowledge aspect, "dispositionalism" relates to cultivating personal dispositions, and "self-signaling" emphasizes the identity reinforcement aspect. "Rule-worship" is dismissive, so I should avoid that.

  On rationality: The strongest arguments involve avoiding slippery slopes (blackmail), maintaining personal integrity across time (promises), and reputation management through consistent signaling (one-off dealings). It's about higher-order preferences over immediate optimization.

  For distinctions:
  - Precommitment involves actual binding mechanisms, while this is purely psychological.
  - Veil-of-ignorance is usually for societal rules, not personal decisions.
  - Stubbornness lacks the deliberate ex ante justification.

  The examples show interesting tensions: The blackmail case prevents exploitation patterns, the promise honors past selves despite changing knowledge, and the reputation management treats isolated interactions as part of a larger pattern.

  I should note potential pitfalls: This could become self-deceptive if rules are selected post-hoc, or lead to absurd inflexibility in truly unique situations. The user seems aware of this tension since they mention they "could change their mind at any moment" but choose not to.

  I'll structure the response to first address the naming question, then explain the rationality, then carefully distinguish from related concepts, and finally note where the approach might break down. The tone should be precise but accessible, using British English as requested.
answer: |-
  Right, this is a fascinating and thorny bit of practical philosophy you're wrestling with. Your friend's "rule-worship" barb is provocative, but as you sense, there's more structure here. Let's carve it up properly.

  **1. What to Call It?**

  While there isn't a single, universally agreed-upon label that perfectly encapsulates *every* nuance of your approach across all your examples, the closest established concept is **Dispositional Rule-Consequentialism**, often discussed alongside **Resolute Choice** or **Sophisticated Choice** in decision theory and ethics. However, your specific emphasis on the *ex ante* selection without literal binding leans towards **Self-Signalling via Ex Ante Rules** or **Identity-Constituting Rule Selection**.

  *   **Dispositional Rule-Consequentialism:** This holds that the right action isn't necessarily the one with the best consequences *in this isolated case*, but the one dictated by a rule which, *if generally adopted as a disposition* by you (or people like you), *would* lead to the best overall consequences. You're cultivating a *disposition* (e.g., "never pay blackmail", "keep promises", "behave cooperatively in one-offs") based on the *ex ante* assessment that having this disposition is beneficial overall, even if it bites you occasionally. Your "sample for strangers" point is pure dispositional reasoning.
  *   **Resolute Choice:** This contrasts with "Sophisticated Choice" (re-optimising at every decision point with current info). Resolute choice means sticking to a plan made earlier with less information, *because* you judged the plan itself to be superior *as a plan* (knowing you'd face temptations to defect later). Your "acting on the rule anyway, even where the reasons plainly favour something else" is resolute behaviour. The key is the *reason* for sticking: fidelity to the *ex ante* justified plan/rule itself.
  *   **Self-Signalling / Identity-Constitution:** By consistently acting against the apparent local optimum, you reinforce to *yourself* that you are the *type of person* who honours those rules and dispositions. This maintains your self-conception and integrity across time ("promise made by a much younger self") and avoids the cognitive dissonance and self-distrust of constantly reneging. It signals internally and externally who you are. "Nothing binds me... I *refuse*" highlights this active choice to maintain identity.

  **2. Why is it Rational (Potentially) to Follow the Rule in a Suboptimal Case?**

  The rationality hinges on recognising that the "case you are actually in" is *not* truly isolated. You are a temporally extended agent interacting in a complex world. Following the rule can be rational because:

  *   **Avoiding Slippery Slopes & Exploitation (Blackmail):** Paying *this* blackmailer might be locally optimal, but it signals to yourself *and potentially others* that you *are* the kind of person who pays. This increases the risk of future blackmail attempts, encourages the blackmailer, and weakens your resolve generally. The rule "Never Pay" prevents you from even starting down that path. The *ex ante* rule protects you from your future self's potential weakness or misjudgment in high-pressure situations.
  *   **Maintaining Integrity & Trustworthiness (Promises):** You are not just your present self. You are also the person who made the promise and the person who will exist tomorrow. Breaking a promise because *current you* judges it inconvenient, despite *past you* committing with good reason (even if less information), fractures your identity across time. It makes you untrustworthy *to yourself* and erodes the value of your future commitments. The rule "Keep Promises" maintains the integrity of your word as a reliable tool for coordination over your lifespan. It respects the agency of your past self.
  *   **Building Reputation & Enabling Cooperation (One-off Dealings):** While *this* interaction is one-off, *you* are not. Strangers (and future interaction partners) *do* use your behaviour as a sample to judge people like you (or you specifically, if identifiable). Acting cooperatively when you *could* defect cheaply in a one-off builds a reputation (even an anonymous one in your own self-conception) as cooperative. This reputation can facilitate future beneficial cooperation that wouldn't be possible if everyone (including you) always defected in one-offs. The rule "Behave as if your action sets a precedent" leverages the power of reputation and norms.
  *   **Reducing Decision Costs & Avoiding Bias:** Constantly re-evaluating every decision from first principles with all current information is exhausting and prone to self-serving bias or weakness of will in the moment ("I could change my mind at any moment... but I *refuse*"). The rule acts as a heuristic, saving cognitive effort and providing a clear line that helps you resist temptation or rationalisation when the stakes are high or emotions are involved. The *ex ante* selection ensures the heuristic was chosen rationally in a calm state.
  *   **The Value of Rule-Governed Behaviour Itself:** There is intrinsic value (instrumentally, if not morally) in being a predictable, principled agent. It allows for stable planning, reliable relationships, and a coherent self-narrative. The *ex ante* rule selection embodies a commitment to being that kind of agent.

  **3. How it Differs from Related Concepts**

  *   **Precommitment:**
      *   **Classic Precommitment:** Involves *physically* or *institutionally* binding your future self to remove an option (e.g., Odysseus tied to the mast, locking away savings, signing a legally enforceable contract). You surrender the *ability* to choose otherwise.
      *   **Your Approach:** You retain the *ability* to change your mind ("Nothing binds me... I could change my mind"). Your "commitment" is purely psychological – fidelity to the *ex ante* chosen rule or disposition *because* you judged it best to have it. It's precommitment *of the will* or *of character*, not of options. Your friend is right to spot the lack of physical binding, but wrong to dismiss the psychological resolve as "commitment left out." The commitment is to the *rule/principle/disposition*, not to a physical constraint. The binding force is internal, stemming from your *ex ante* reasoning and desire for integrity.
  *   **Veil-of-Ignorance (VofI) Manoeuvre:**
      *   **Classic VofI (Rawls, Harsanyi):** A thought experiment for designing *impersonal, societal rules or institutions*. You choose principles for society *without knowing your specific place* in it (wealth, talents, status, etc.), ensuring fairness.
      *   **Your Approach:** You adapt the *structure* (choose rules *before* knowing your specific situation) but apply it *personally*. Your "situations" are specific decision-contexts within your own life (blackmail, promise, one-off deal), not societal positions. Your goal isn't primarily fairness to others (though it might have side-effects), but *prudential rationality for your extended self* – choosing rules that benefit *you* over the long run, considering your vulnerability to temptation, need for reputation, etc. It's a *personal prudential veil*, not a societal impartial one.
  *   **Plain Stubbornness:**
      *   **Stubbornness:** Adherence to a rule or position *without* the sophisticated *ex ante* justification. It's often rigid, unreflective, driven by emotion (spite, pride, aversion to change) rather than reason, and insensitive to context. The rule itself might be arbitrary or poorly chosen.
      *   **Your Approach:** The core is the deliberate, rational *ex ante* selection process ("which rule I would have wanted to have adopted before I knew..."). The *reason* for sticking is fidelity to *that reasoned choice* and the benefits of the disposition/reputation it builds. While it *looks* stubborn in the moment, it's underpinned by a meta-rational strategy for navigating your existence as a temporally extended, socially embedded agent. The "I keep the information... could change my mind" shows it's not blind rigidity; it's a conscious *refusal* to renege based on the higher-order reasons.

  **4. Where it Comes Apart (Potential Pitfalls)**

  *   **Rigidity in Truly Unique Situations:** If a situation is *genuinely* unprecedented and the *ex ante* rule clearly leads to catastrophe with no countervailing systemic benefits (e.g., a bizarre, unrepeatable scenario where paying a trivial blackmail fee saves countless lives), sticking rigidly becomes irrational. The justification relies on the rule preventing *patterns* of bad outcomes or maintaining valuable dispositions; if no such pattern is possible, the rationale collapses.
  *   **Self-Deception in Rule Selection:** The *ex ante* choice isn't foolproof. It could be biased by current emotions (projecting future feelings poorly) or self-serving even then. One must rigorously interrogate *why* a rule seemed best *ex ante*.
  *   **Ignoring New, Fundamental Information:** Your approach handles *knowing your situation* but assumes the *reasons* and consequences were understood *ex ante*. If you gain truly *new fundamental information* that utterly changes the expected consequences of the rule *in general* (not just in this case), sticking might be irrational. (e.g., discovering *all* blackmail attempts are elaborate charity fundraisers).
  *   **Confusing Identity with Outcomes:** Over-focus on "being the rule-follower" could lead to sacrificing *too much* real well-being for the sake of consistency. The *ex ante* justification must genuinely show the disposition *improves* overall outcomes.
  *   **The "Self-Serving" Charge:** Your friend might argue your *ex ante* choices conveniently favour rules that benefit your *type* (e.g., in societal VofI terms) or absolve you of hard choices now. Vigilance against this is needed – the *ex ante* reasoning must be impartial *between your possible future situations*.

  **In Summary:**

  You're practising **Resolute Dispositionalism** or **Prudential Rule Selection under a Personal Veil of Ignorance**. It's rational when the costs of deviating in the specific case are outweighed by the systemic benefits of maintaining the disposition (avoiding exploitation, keeping integrity, building reputation, reducing decision costs). It differs from precommitment by lacking physical binding (relying on resolve), from societal VofI by being personal and prudential, and from stubbornness by its foundation in deliberate *ex ante* reasoning.

  It's not rule-worship; it's recognising that for a complex, temporally extended agent like yourself, sometimes the most rational path *through* the trees requires sticking to the path you wisely chose *before* you entered the forest, even when a tempting shortcut appears. The key is ensuring the path was wisely chosen, genuinely serves your long-term self-interest as an extended agent, and isn't leading you off a cliff unique to this one spot.
