  Final test: Would this list force clarity in office hours when people realize they're invoking different definitions? If yes, mission accomplished.
answer: |-
  Here are five precise readings of "an unjust law is no law at all":  

  1. **Moral Obligation Denial**: A claim that individuals have no moral duty to obey unjust laws.  
     - *Type*: Moral claim about obligation.  
     - *Defensible?* Yes, widely accepted (e.g., civil disobedience).  
     - *Supports classmate?* No; addresses obedience, not legal validity or retroactivity.  

  2. **Legal Efficacy Critique**: A statement that profoundly unjust laws often fail to function *as law* socially/practically due to non-compliance or illegitimacy.  
     - *Type*: Socio-legal claim (descriptive/predictive).  
     - *Defensible?* Yes, empirically observable.  
     - *Supports classmate?* No; describes social reality, not legal validity in 1944.  

  3. **Procedural Natural Law**: A conceptual claim that laws violating fundamental procedural principles (e.g., generality, clarity, non-retroactivity) lack legal character, per Fuller’s "inner morality of law".  
     - *Type*: Conceptual claim about law’s necessary conditions.  
     - *Defensible?* Contested (Hart critiques it; Fuller defends).  
     - *Supports classmate?* Only if the Nazi law breached procedural justice—unlikely in the grudge-informer case.  

  4. **Substantive Validity Denial**: A conceptual claim that extreme substantive injustice (e.g., violating core human rights) negates a norm’s status as law, regardless of enactment.  
     - *Type*: Conceptual (strong natural law thesis).  
     - *Defensible?* Highly contested (rejected by positivists like Hart; defended by natural lawyers).  
     - *Supports classmate?* Yes—if accepted, the Nazi law was never valid, so no retroactivity.  

  5. **Judicial Remediation Principle**: A normative claim that courts *should treat* gravely unjust laws as void *ab initio* to avoid legitimizing tyranny, even if technically valid when applied.  
     - *Type*: Moral-political claim about judicial duty.  
     - *Defensible?* Controversial (pragmatic but risks judicial overreach).  
     - *Supports classmate?* Yes—retroactivity is sidestepped by declaring the law void originally.
