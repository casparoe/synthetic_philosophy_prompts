  The political expediency explanation fits: Cases 1 and 2 (domestic, capped liability) got apologies; Case 3 (foreign descendants) got regret; Case 4 (diffuse, uncapped) got nothing. Next week involves foreign claimants with pending litigation, so expediency would predict no apology or only regret.

  On philosophical issues: The standing problem seems to matter (Cases 3,4,5 with no living victims were treated differently). Corporate apology is assumed possible. Non-identity and retrospectivity appear theoretical only.

