prompt: |-
  I have recently become the editor of a mid-sized journal in comparative social science, and with the job I have inherited a genre of submission I do not yet know how to handle consistently: papers that explain an outcome — a regional homicide rate, a national savings rate, the uptake or non-uptake of a voluntary pension scheme, a pattern of tax compliance — by appeal to a culture. A culture of honor, a culture of deference to elders, a culture of thrift, a culture of fatalism. My screening assistant is a second-year graduate student with no training in the philosophy of social science, and the guidance I have managed to give her so far amounts to "does this feel like a just-so story?", which is neither fair to authors nor reproducible from one manuscript to the next. The obvious reference point for all of these papers is the Weberian paradigm — the claim that ascetic Protestantism helped bring about the spirit of capitalism — and part of what makes it the paradigm is exactly how much the causal claim was hedged: the economic conduct in question was, on Weber's own telling, largely an unintended by-product of a religious discipline rather than anything the believers were aiming at, and that is the feature nearly every imitation quietly drops. What I want from you is not an essay about Weber and certainly not a reading list; it is a decision procedure my assistant and I can actually run, in order, on a manuscript within the half hour we have before the first decision has to be logged.

  The procedure should lay out the questions to ask in sequence, what counts as a sufficient answer to each, the point at which it stops with a reject or a revise-and-resubmit, and the point at which it hands the decision to me because what is at stake is a value judgment rather than a question of evidence. Three distinctions have to survive whatever simplification you impose, because they are the ones I keep losing when I try to improvise: first, the difference between a value being merely present in a population, a value actually figuring in the agents' own reasoning, and a value doing independent causal work once institutions and material incentives are controlled for; second, the requirement that the culture be measured without using the very outcome it is meant to explain; and third, the difference between an outcome the agents intended and one that, as in Weber's own case, was a by-product they would have disavowed had they noticed it. Please mark clearly which steps are judgment calls dressed up as procedure, and where the checklist will misfire.

  Run the finished procedure on three hypothetical submissions, and do not soften the verdicts: (1) a paper arguing that a culture of honor explains why one region's homicide rate persistently exceeds a neighboring region's; (2) a paper arguing that Confucian filial deference explains why a voluntary pension scheme was undersubscribed in two provinces; (3) a paper arguing that ascetic Protestant values caused the early capitalist takeoff. I expect the procedure to be uncomfortable in at least one of these — if a submission can satisfy every step while its culture turns out to be little more than a redescription of the outcome, say so rather than patching the checklist to reach a verdict. Give me the result as a JSON object with this schema: a "procedure" field holding an ordered array of step objects, each with "step" (integer), "name", "question", "sufficient_answer", "if_insufficient" (one of "reject", "revise", "flag_for_editor"), and "judgment_call" (boolean); a "worked_cases" field holding an array of objects, each with "case", "per_step_verdicts" (array of strings, one per step), "recommendation", "decisive_step", and "what_the_procedure_misses"; and a "limitations" field holding an array of strings naming the things the procedure cannot do.
reasoning: |-
  We are constructing a decision procedure for evaluating papers that use "culture" as an explanatory variable for social outcomes. The procedure must incorporate the three distinctions provided:

  1. Distinguishing between a value merely being present, being used in reasoning, and doing independent causal work when controlling for institutions and material incentives.
  2. The culture must be measured without using the outcome it is supposed to explain (to avoid circularity).
  3. Distinguishing intended outcomes from unintended by-products.

  The procedure will be a step-by-step checklist that the assistant can run. Each step has:
  - step (integer): the step number
  - name: a short name for the step
  - question: the question to be asked about the manuscript
  - sufficient_answer: what counts as passing this step
  - if_insufficient: one of "reject", "revise", or "flag_for_editor"
  - judgment_call: boolean indicating if this step requires a judgment call

  We will design the steps to be sequential. If at any step the answer is insufficient, we stop and give the corresponding decision (reject or revise). Only if all steps are passed do we consider the paper for acceptance (but note: the editor may still have to make a value judgment at the end).

  Steps:

  1. **Clarity of the outcome**: The outcome must be clearly defined and measurable.
  2. **Clarity of the cultural value**: The cultural value must be clearly defined and distinguishable from the outcome.
  3. **Non-circular measurement of culture**: The culture must be measured without using the outcome variable.
  4. **Presence of the cultural value**: Evidence that the cultural value is actually present in the population.
  5. **Role in reasoning**: Evidence that the cultural value figures in the agents' own reasoning.
  6. **Control for confounders**: The analysis controls for institutions and material incentives that might explain the outcome.
  7. **Independent causal work**: Evidence that the cultural value has an effect above and beyond confounders.
  8. **Intentionality**: Addressing whether the outcome was intended or an unintended by-product (this is a flag for the editor because it's a value judgment about the theory).

  Step 8 is a flag for the editor because it is about the theoretical interpretation (whether the outcome is intended or unintended) and may not be a reason to reject on its own, but it is important for the editor to consider.

  Now, we run the procedure on three hypothetical submissions.

  Case 1: A paper arguing that a culture of honor explains why one region's homicide rate persistently exceeds a neighboring region's.

  Case 2: A paper arguing that Confucian filial deference explains why a voluntary pension scheme was undersubscribed in two provinces.

  Case 3: A paper arguing that ascetic Protestant values caused the early capitalist takeoff.

  We will simulate the procedure for each case and record the verdict at each step and the final recommendation. Also, note what the procedure might miss.

  Finally, we'll list the limitations of the procedure.

  Let's design the steps in detail.
answer: |-
  ### Decision Procedure for Cultural Explanation Submissions

  **Procedure (JSON):**
  ```json
  {
    "procedure": [
      {
        "step": 1,
        "name": "Outcome Clarity",
        "question": "Is the outcome (e.g., homicide rate, pension uptake) unambiguously defined and measurable independently of cultural proxies?",
        "sufficient_answer": "Outcome is quantifiable, operationalized with clear data sources (e.g., crime statistics, survey responses), and not conflated with cultural traits.",
        "if_insufficient": "reject",
        "judgment_call": false
      },
      {
        "step": 2,
        "name": "Culture Definition",
        "question": "Is the cultural value (e.g., 'honor,' 'filial piety') explicitly defined beyond a vague label, with indicators separable from the outcome?",
        "sufficient_answer": "Culture is defined via specific mechanisms (e.g., norms, beliefs) and measured with distinct proxies (e.g., historical texts, surveys on values). Avoids using the outcome or its synonyms.",
        "if_insufficient": "reject",
        "judgment_call": false
      },
      {
        "step": 3,
        "name": "Non-Circular Measurement",
        "question": "Is the culture measured without directly or indirectly incorporating the outcome variable?",
        "sufficient_answer": "Measurement relies on independent sources (e.g., ethnographies pre-dating the outcome, linguistic analysis, controlled experiments). No overlap with outcome data.",
        "if_insufficient": "reject",
        "judgment_call": true
      },
      {
        "step": 4,
        "name": "Value Presence",
        "question": "Does the paper provide evidence the cultural value exists in the population beyond anecdote?",
        "sufficient_answer": "Empirical evidence (e.g., representative surveys, behavioral experiments, archival records) shows the value is prevalent in the group studied.",
        "if_insufficient": "reject",
        "judgment_call": false
      },
      {
        "step": 5,
        "name": "Value in Reasoning",
        "question": "Does the paper demonstrate the cultural value actually informs agents' decision-making?",
        "sufficient_answer": "Evidence shows agents invoke the value in reasoning (e.g., interview quotes, experimental vignettes, diary studies). Not assumed.",
        "if_insufficient": "revise",
        "judgment_call": true
      },
      {
        "step": 6,
        "name": "Confounder Control",
        "question": "Does the analysis account for material/institutional alternatives (e.g., economic inequality, legal systems)?",
        "sufficient_answer": "Controls for ≥2 major confounders (e.g., GDP, policing, policy differences) using regression, matching, or natural experiments.",
        "if_insufficient": "revise",
        "judgment_call": false
      },
      {
        "step": 7,
        "name": "Causal Independence",
        "question": "After controlling for confounders, does the culture retain a statistically significant effect?",
        "sufficient_answer": "Statistical tests show culture predicts outcome independently (p<0.05), with effect size exceeding confounders.",
        "if_insufficient": "reject",
        "judgment_call": false
      },
      {
        "step": 8,
        "name": "Intentionality Check",
        "question": "Does the paper address whether the outcome was an intended goal or unintended by-product?",
        "sufficient_answer": "Explicitly discusses intent (e.g., via historical context, agent testimonials, counterfactuals). Avoids conflating cause with purpose.",
        "if_insufficient": "flag_for_editor",
        "judgment_call": true
      }
    ],
    "worked_cases": [
      {
        "case": "Honor culture explaining regional homicide differences",
        "per_step_verdicts": [
          "Pass: Homicide rates from police data.",
          "Fail: 'Honor' defined as 'avenging slights' but measured via homicide patterns.",
          "Fail: Measurement circular (homicide data used to infer honor).",
          "N/A (stopped at Step 3)",
          "N/A",
          "N/A",
          "N/A",
          "N/A"
        ],
        "recommendation": "Reject",
        "decisive_step": 3,
        "what_the_procedure_misses": "Fails to detect if 'honor' is a post-hoc justification for violence rather than a cause. Procedure catches circularity but not latent tautologies."
      },
      {
        "case": "Confucian filial deference explaining pension scheme undersubscription",
        "per_step_verdicts": [
          "Pass: Pension uptake rates from govt. records.",
          "Pass: Filial piety defined via norms of elder care; measured with ancestral ritual frequency.",
          "Pass: Ritual data from pre-pension ethnographies.",
          "Pass: Surveys show 80% endorse filial norms.",
          "Fail: No evidence elders/parents reference piety in pension decisions.",
          "Pass: Controls for income, urbanization, state subsidies.",
          "Pass: Piety remains significant predictor (β=0.4, p=0.01).",
          "Flag: Paper ignores if non-uptake is unintended (e.g., families assume state support)."
        ],
        "recommendation": "Revise (address Step 5 & 8)",
        "decisive_step": 5,
        "what_the_procedure_misses": "May not spot if 'filial piety' is a cover for financial constraints. Procedure verifies reasoning but not if cultural labels mask material causes."
      },
      {
        "case": "Ascetic Protestantism causing capitalist takeoff",
        "per_step_verdicts": [
          "Pass: Capitalist indicators (e.g., investment, productivity) defined.",
          "Pass: Asceticism defined via doctrinal texts (e.g., Calvinist theology).",
          "Pass: Measured via historical sermon content analysis.",
          "Pass: Diaries show ascetic practices.",
          "Pass: Sermons explicitly link discipline to economic behavior.",
          "Fail: Omits alternative causes (e.g., trade routes, resource access).",
          "Fail: No statistical control for material factors.",
          "Pass: Notes capitalism was unintended by-product."
        ],
        "recommendation": "Reject",
        "decisive_step": 6,
        "what_the_procedure_misses": "Fails to assess if Protestantism correlates with structural advantages (e.g., literacy). Procedure demands controls but cannot verify historical confounders."
      }
    ],
    "limitations": [
      "Cannot detect when 'culture' is a post-hoc descriptor rather than a cause (tautology risk).",
      "Judgment calls (Steps 3, 5, 8) may vary by reviewer; relies on assistant’s critical thinking.",
      "Does not address temporal precedence (culture must precede outcome).",
      "Struggles with historical cases where data for confounder control is scarce.",
      "May flag robust qualitative work as 'insufficient' if statistical controls are absent."
    ]
  }
  ```

  ### Key Rationale:
  - **Rejects** occur at Steps 1–4/7 for fatal flaws (e.g., circularity, no evidence).  
  - **Revise** occurs at Steps 5–6 for fixable gaps (e.g., missing reasoning/confounders).  
  - **Flag for editor** at Step 8 when intent/mechanism ambiguity requires theoretical judgment.  
  - **Judgment calls** (Steps 3, 5, 8) involve interpreting measurement independence, reasoning evidence, and intentionality.  
  - **Uncomfortable verdict**: Case 1 fails despite intuitive plausibility because culture is measured *via* homicide patterns. The procedure exposes circularity but cannot "rescue" such papers.  

  This procedure prioritizes falsifiability: if culture is indistinguishable from the outcome (Case 1) or lacks causal independence (Case 3), rejection is automated. Case 2 survives with revisions because it clears the bar for non-circularity and causal isolation but needs deeper scrutiny of agency.
