answer: |-
  Your hunch cuts to the core of the impasse. This isn't primarily an empirical stalemate about performance data (though that exists), but a **clash of political philosophies and definitions of legitimacy** masquerading as a technical debate about institutional design. Let's dissect the disagreement:

  ### The Core Disagreement: Competing Visions of Legitimacy
  1.  **Output Legitimacy (Advocates' Focus: "Better Decisions"):**
      *   **Premise:** Legitimacy flows from the *quality* and *fairness* of the outcome. If a process reliably produces decisions that are well-informed, reasoned, consider diverse perspectives, and serve the common good better than alternatives, it is legitimate.
      *   **Their Argument:** Sortition + deliberation demonstrably achieves this superior output. It minimizes partisan distortion, amplifies diverse voices often excluded from electoral politics, fosters genuine listening, and prioritizes evidence and common ground over short-term political gain. Accuracy *is* legitimacy.
      *   **Your Insight Confirmed:** They see your "policy I'd have voted for" (produced independently) as *more* legitimate because it was generated by a demonstrably fairer, less corrupted process, even without your direct input.

  2.  **Input Legitimacy (Critics' Focus: "Accountability & Representation"):**
      *   **Premise:** Legitimacy flows from *authorization* and *accountability*. Citizens must authorize the decision-makers (usually via election) and hold them accountable for their actions (usually via the next election). "The People" must be *represented* in a recognizable way (e.g., through chosen representatives).
      *   **Their Argument:** A lottery-selected body lacks authorization. They weren't chosen *by* the people *for* this specific task. They lack accountability – you can't vote them out. They are "a group," not "the public" writ large (demographic mirroring or not). Binding decisions made this way feel like an imposition, not an expression of popular will. Your "could have been in the room" feeling speaks directly to this.
      *   **Your Insight Confirmed:** They see the "policy I think is wrong" (but could have been part of) as potentially *more* legitimate *if* it came from an elected body you had a chance to vote for/against, because the authorization and accountability mechanisms are in place, even if the outcome is flawed.

  ### Where Empirics *Do* Matter (But Don't Resolve the Core Clash)
  *   **"Better Decisions"?** Studies *do* show assemblies often produce sophisticated, consensus-oriented, evidence-based outputs on complex issues. Critics counter: "Better" according to whom? Experts? Elites? What about representativeness of viewpoints, not just demographics? Does the "deliberative wave" truly reflect public opinion or create a new elite consensus?
  *   **"Are they the Public"?** Assemblies usually demographically mirror the population far better than elected bodies. Critics counter: Self-selection bias (who agrees to participate?), the impact of intensive facilitation/experts, and the "artificial" environment mean they aren't experiencing the pressures or incentives of the real public. They become a unique entity.
  *   **Advisory vs. Binding:** This is **crucial** and often glossed over. An *advisory* assembly sidesteps the fiercest input legitimacy critique (final authority remains with elected bodies). Critics focus their "laundering" and "no accountability" fire on *binding* sortition bodies. Advocates pushing binding models *must* grapple directly with the input legitimacy challenge.

  ### Your Friend's Insight: Burden vs. Power
  This **is profound**, not just a restatement. It reframes the issue:
  *   Elections place the *burden of deciding* on representatives (who we then judge). We authorize them to bear that burden.
  *   Sortition (especially binding) places the *burden of deciding* directly on a rotating subset of the citizenry. The "power" is fleeting and non-voluntary. The core question becomes: **Is it legitimate to randomly conscript citizens to bear the profound burden of collective decision-making with final authority, even if they do it well?** This resonates deeply with your feeling of "owing" something to the process you *could* have been part of – you recognize the burden they bore on your behalf.

  ### What Might Move the Needle (Slightly)?
  Complete resolution is unlikely – it's a foundational values clash. But progress is possible:

  1.  **Rigorous Specification:** Force every discussion to specify: *Advisory or Binding? On what kinds of issues? With what powers?* This instantly sharpens the debate.
  2.  **Focus on Hybrid Models:** Explore designs that blend elements:
      *   **Citizens' Initiative Review:** Sortition panels analyze ballot measures, providing neutral info/vetting (advisory, enhances output legitimacy for direct democracy).
      *   **Co-creation:** Assemblies develop proposals, elected bodies approve/veto (shares burden, leverages strengths of both).
      *   **Review/Veto Mechanisms:** Binding assembly decisions subject to referendum or supermajority legislative override (adds layer of accountability/input).
  3.  **Empirical Nuance:** Move beyond "do they work?" to "under what conditions, on what issues, with what design features, do they succeed/fail *relative to specific goals* (e.g., generating innovative solutions, building consensus on wicked problems, restoring trust on specific issues like constitutional reform or climate policy)?" Compare them not just to dysfunctional legislatures, but to other participatory/deliberative tools.
  4.  **Reframing "Accountability":** Can sortition offer *different* forms of accountability?
      *   **Process Accountability:** Extreme transparency (recordings, transcripts), clear mandates/rules, independent oversight.
      *   **Reason-Giving Accountability:** Requiring detailed public justification for decisions.
      *   **Impact Accountability:** Evaluating outcomes later (though tying to the specific assembly is hard).
  5.  **The "Burden" Frame:** Explicitly discussing the ethics and experience of imposing the decision *burden* via lottery can generate new insights, moving beyond simplistic power/representation talk. Does society owe something *to* participants? What support do they need?
  6.  **Focus on Crisis Points:** Where existing systems are *manifestly failing* on both input and output legitimacy (e.g., gerrymandered legislatures, deep polarization paralyzing action on existential threats), the pragmatic case for experimenting with sortition as a circuit-breaker becomes stronger, even for critics wary of its theoretical purity.

  ### Should You Stop Waiting?
  **No, but shift your expectations.** Stop waiting for a knockout empirical blow or a conceptual resolution that satisfies both sides fully. Instead:

  *   **Cover the Clash:** Explicitly frame discussions around the competing legitimacy claims (Input vs. Output) and the Burden vs. Power distinction. Make the core philosophical disagreement the story, not just the surface arguments.
  *   **Demand Specificity:** Always ask proponents and critics: "Advisory or binding?" "Compared to what *specific* alternative process?" "What specific legitimacy standard are you applying?"
  *   **Explore the Hybrids:** Focus on the evolving institutional designs trying to bridge the gap. These are where the most interesting practical and theoretical developments are happening.
  *   **Interrogate the "Burden":** Explore the experience and ethics of imposing the decision burden via lottery. What does it demand of participants? Of society?

  The debate circles because it touches fundamental questions about democracy: What makes rule legitimate? Who should bear the cost and responsibility of governing? How do we reconcile collective wisdom with individual autonomy? Recognizing it as this profound, rather than just a technical argument about a "better mousetrap," is the key to covering it with less frustration and more clarity. The circle won't break, but you can help readers understand *why* it's circular and what paths might lead outwards.
