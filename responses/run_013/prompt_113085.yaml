prompt: |-
  Ok, so I'm a second-year PhD student and I got voluntold to run the discussion section for the philosophy of language course this term — 18 undergrads, 75 minutes, one shot — and the week I've been handed is Davidson on radical interpretation and the principle of charity. I've read it, i think I basically get it, but every time I've seen it taught the students just nod along: yeah sure, the field linguist can't point at a rabbit and conclude the word means rabbit, since it could equally mean rabbit-stage or an undetached rabbit part, and there's no way to ask which. They get the puzzle as a puzzle and never feel the actual vertigo, that there's no neutral place to stand while you're doing the interpreting. And it's gotten weirdly personal for me lately, because my partner's grandmother speaks a regional dialect I have basically no vocabulary in, and I spent a whole weekend at her place trying to work out words purely from context, and I kept noticing myself deciding she must mean the obvious thing and then catching that the obviousness was doing all the work. I want to build that weekend into the room.

  So: design me a runnable in-class activity, something they actually do rather than a lecture with a demo tacked on. My rough sketch is to split them into small field-linguist teams plus two or three informants who speak a made-up language I hand out on cards, and have the linguists build a translation manual from utterances they get to observe. Flesh that out and fix it wherever it's broken. In particular the fake language needs at least one spot where the evidence the linguists collect is fully consistent with two wildly different manuals, and one spot where the only way to keep the informant consistent and sane is to attribute to them a belief the linguists themselves don't hold — so the charity constraint bites them in practice instead of being a slogan they recite. Give me the rules, whats actually on the cards, roughly how the rounds fit the 75 minutes, including where I drop the twist that makes them doubt a choice they've already committed to, and some real (small) stakes — maybe teams stake chips on their translations and lose them at the reveal, so being wrong costs something.

  Then the debrief: map what happened onto the parts of the idea — holism, charity, indeterminacy — and tell me what predictably goes wrong the first time I run it and how to handle it (I'm already betting the teams will quietly translate everything into English-shaped categories, and that my informants will break character or someone will just try speaking English at them). And be honest with me about what the activity can't reproduce: my suspicion is that it can only stage underdetermination by the evidence available, not the stronger claim that there's simply no fact of the matter about which manual is right, and that it can't reproduce the all-at-once holism of interpretation because they'll be translating word by word. If I'm wrong about either, say so, and tell me what I'll just have to supply by talking.
reasoning: |-
  We are designing an in-class activity for a 75-minute discussion section on Davidson's radical interpretation and the principle of charity. The goal is to have students experience the underdetermination of translation and the necessity of charity in interpretation.

  Structure:
  1. Introduction (5 minutes)
  2. Setup and Rules (10 minutes)
  3. Activity Rounds (40 minutes total, broken down)
     - Round 1: Basic word gathering (10 minutes)
     - Round 2: Contextual challenge (double meaning) (15 minutes)
     - Round 3: Belief attribution challenge (charity) (15 minutes)
  4. Reveal and Scoring (5 minutes)
  5. Debrief and Connection to Davidson (15 minutes)

  Key elements:
  - The fake language: We'll create a simple language with about 10-15 words. The language will have:
     - Some basic nouns and verbs that are easy to map (like pointing to objects or actions).
     - One or two words that are ambiguous (like "gavagai" in Quine, but we'll design our own).
     - One scenario where the informant must be interpreted as holding a belief that the linguists do not hold (to force charity).

  Activity Setup:
  - Class of 18 students: Divide into 3-4 teams of linguists (4-5 students each) and 2-3 informants (who will be given the language cards).
  - The informants will be given a set of cards with the made-up language (with translations and rules) and they can only speak in that language.
  - The linguists will have to observe the informants and build a translation manual.

  Materials:
  - For the informants: A set of cards with the made-up language (let's call it "Lingua") including:
     - A vocabulary list (with English translations and pronunciation guide).
     - Rules for forming simple sentences (subject-verb-object, or similar).
     - Specific instructions for ambiguous cases and for the charity scenario.
  - For the linguists: Blank cards or a notebook to record their translation manual, and some chips (or tokens) to bet on their translations.

  The Made-up Language (Lingua):
  Let's design a simple language with the following words (with IPA-like pronunciation, but simplified for ease):

  Nouns:
  - "glim" [glɪm] = rabbit (but informants know it can also mean "undetached rabbit part" in certain contexts)
  - "flor" [flor] = flower
  - "tuka" [tuka] = water
  - "moti" [moti] = stone
  - "niba" [niba] = tree

  Verbs:
  - "sera" [sera] = to drink
  - "kana" [kana] = to eat
  - "vido" [vido] = to see
  - "daro" [daro] = to run

  Adjectives (optional, to keep it simple, or we can use verbs for states):
  - "bela" [bela] = beautiful
  - "rapa" [rapa] = fast

  Particles (for sentence structure):
  - "le" [le] = marks the subject (optional, but helps structure)
  - "en" [en] = marks the object (optional)

  Example sentence: "Le glim vido en flor." = The rabbit sees the flower.

  But note: We have an ambiguity with "glim". The informants are instructed that when they are referring to a whole rabbit, they say "glim", but when they are referring to an undetached rabbit part (like a rabbit's ear still attached to the rabbit), they also say "glim". However, they have a way to disambiguate if necessary: they can use "glim" for both, but they never point to a detached part (so the context is always a rabbit with all its parts). This sets up the Quinean ambiguity.

  Additionally, we need a scenario for charity. We design a word that requires a belief attribution.

  Charity Scenario:
  We introduce a word "yoti" [joti] which means "spirit" or "life force". The informants believe that every living thing has a "yoti", and they use it in sentences like "Le glim yoti" meaning "The rabbit has a spirit" (or "The rabbit is alive"). But the linguists might not believe in spirits. The informants will use "yoti" in contexts where things are alive (like a rabbit, a flower, a tree) but not for stones or water. They might also say "Le moti no yoti" (The stone has no spirit).

  However, to force charity, the informant might say something that the linguists think is false. For example, the informant might point to a withered flower and say "Le flor no yoti" (The flower has no spirit) because they believe it is dead. But the linguists might not believe in spirits at all. To interpret the utterance as true (by their own lights) they would have to attribute to the informant a belief they don't hold (that spirits exist and depart when something dies).

  Rules of the Game:
  1. The informants can only speak in Lingua. They can use gestures (pointing, acting out) to help, but no English.
  2. The linguists can ask for examples by pointing at things or acting out actions, and the informant will provide a Lingua utterance.
  3. The linguists are to build a translation manual for the words and grammar.
  4. There will be three rounds:

  Round 1 (10 minutes): Basic vocabulary gathering.
     - The informant will provide simple sentences for common objects and actions (e.g., pointing at a rabbit and saying "glim", or acting out drinking and saying "sera").
     - The linguists record their initial translations.

  Round 2 (15 minutes): Contextual challenge.
     - The informant will now use the word "glim" in contexts that are ambiguous between rabbit and rabbit part (but without ever having a detached part). For example, they point to a rabbit and say "glim", then point to the rabbit's ear (while it's attached) and also say "glim". The linguists must figure out how to translate this. They might assume it's the same word for both, but then they have to decide if it means rabbit, rabbit part, or something else. They will be forced to make a choice.

  Round 3 (15 minutes): Belief attribution (charity).
     - The informant will use the word "yoti" in various contexts: for living things and not for non-living. They will also make an utterance that the linguists might find false. For example, the informant points to a healthy flower and says "Le flor yoti" (The flower has a spirit) and then points to a dead flower and says "Le flor no yoti" (The flower has no spirit). The linguists must interpret these. They will have to decide: does "yoti" mean "alive" (which they might accept) or does it mean "has a spirit" (which they might not)? And they must attribute a belief to the informant that spirits exist.

  Stakes:
  - Each team starts with 10 chips.
  - At the end of each round, they can choose to bet 0-3 chips on their translation for a key word (for Round 1: "glim"; Round 2: the same "glim" but now with the ambiguity; Round 3: "yoti").
  - They write down their translation and the bet. At the reveal (after Round 3), they lose the chips if they are wrong and gain double if they are right (but only if they bet).

  The Twist:
  - After Round 1, they have a translation for "glim" (say, "rabbit"). In Round 2, they see the same word used for a part of the rabbit. This should make them doubt their initial translation. They have to reconsider and possibly change their manual.

  Reveal and Scoring (5 minutes):
  - The teacher reveals the intended meanings (according to the informant's cards) for the key words: 
     - "glim" means both rabbit and undetached rabbit part (but in the language, it's the same word). 
     - "yoti" means spirit (and the informant believes in spirits).
  - We score the bets: teams that translated "glim" as "rabbit" are not wrong (because it does mean rabbit) but they missed the ambiguity. However, we can accept both "rabbit" and "rabbit part" as incorrect because the word in Lingua doesn't map one-to-one. We might say: if they have "rabbit" or "rabbit part", they are correct for the first use but not for the second? This is tricky.

  Alternative for scoring: We ask for their translation manual for the word in isolation and then in the sentence. We reveal that the same word is used for both. So if they have two different words for rabbit and rabbit part, they lose. If they have one word that covers both, they win. But note: in English, we don't have one word for both, so they might have to say "rabbit-or-part" or something. We can be flexible.

  For "yoti": We reveal that it means "spirit", so if they translated it as "alive" they are wrong because the informant believes it's a spirit, not just being alive. But note: the informant uses it when things are alive. So they might have translated it as "alive". But then they have to explain why the informant says "Le flor no yoti" for a dead flower? They might think it's just "alive", and that's consistent. But the informant's card says it means spirit. So we reveal that and then ask: how do we know the difference? We don't, without asking, and we can't. And we have to attribute the belief to make sense of the utterance.

  Debrief (15 minutes):
  Map the activity to Davidson:
  1. Holism: They couldn't translate word by word; they had to consider the whole system of beliefs. (But note: the activity might have been done word by word. We can point out that when they encountered "yoti", they had to adjust their understanding of the whole system of the informant's beliefs.)
  2. Charity: In Round 3, they had to interpret the informant as having a belief they themselves don't hold (about spirits) to make the utterance true. This is the principle of charity in action: we maximize agreement to make interpretation possible.
  3. Indeterminacy: In Round 2, the same evidence (pointing to a rabbit and then to its ear) could support two different manuals: one that says "glim" means rabbit, and one that says it means undetached rabbit part. There's no fact of the matter (in the evidence) to decide.

  What can't the activity reproduce?
  - The stronger claim of indeterminacy: that there is no fact of the matter at all. In our activity, there is a fact because we (the designers) defined the language. But we can stress that in radical interpretation, without access to the speaker's mind, we cannot know the fact. The activity only shows underdetermination by evidence.
  - Holism: The activity might be done piecemeal. We can note that in reality, we have to interpret a whole language at once, but in the activity we broke it down. We can point out that if they had to start from scratch with no prior assumptions, it would be overwhelming.

  Predictable problems and solutions:
  1. Teams translating into English categories: This is inevitable and we can use it to show how we project our own ontology. In the debrief, we can discuss how our language shapes our thinking and how hard it is to avoid.
  2. Informants breaking character: Choose reliable students as informants and give them clear instructions. Have a backup plan (like the teacher stepping in if needed).
  3. Students speaking English: Remind them of the rules at the start and during the activity. If they do, the informant should just look confused and say they don't understand.

  Adjustments for time:
  - If we run short, we can extend the debrief. If we run long, we can shorten the rounds.

  Detailed Language Cards for Informants:

  Vocabulary:
  - glim: rabbit or undetached rabbit part (use for both; if pointing to a whole rabbit, say "glim"; if pointing to a part (while attached), also say "glim")
  - flor: flower
  - tuka: water
  - moti: stone
  - niba: tree
  - sera: drink
  - kana: eat
  - vido: see
  - daro: run
  - bela: beautiful
  - rapa: fast
  - yoti: spirit (use for living things: rabbit, flower, tree, but not for stone or water. Also, for a dead flower, say "no yoti")
  - le: subject marker (put before the subject)
  - en: object marker (put before the object)
  - no: not (negation)

  Grammar:
  - Basic sentence: [Subject] [Verb] [Object] -> but with markers: "Le [subject] [verb] en [object]."
  - For adjectives: "Le [subject] [adjective]." e.g., "Le glim rapa." (The rabbit is fast.)

  Example sentences for informants to use (they can also make up their own as long as they follow the rules):

  Round 1:
  - Point to a rabbit: "glim"
  - Point to a flower: "flor"
  - Act out drinking: "sera"
  - Point to water: "tuka"
  - Say: "Le glim sera en tuka." (The rabbit drinks water.)

  Round 2:
  - Point to a rabbit: "glim"
  - Point to the rabbit's ear (attached): "glim"
  - Point to the rabbit's foot (attached): "glim"
  - Then point to the whole rabbit again: "glim"

  Round 3:
  - Point to a healthy flower: "Le flor yoti."
  - Point to a dead flower: "Le flor no yoti."
  - Point to a stone: "Le moti no yoti."
  - Point to a tree: "Le niba yoti."

  Activity Flow:

  0. Before class: Prepare cards for informants and chips for linguists.

  1. Introduction (5 min):
     - Briefly set up the scenario: They are field linguists encountering a new language. They must build a translation manual by observing an informant.
     - Explain the rules and the betting.

  2. Setup (10 min):
     - Divide the class: 2-3 informants (give them the Lingua cards and instructions) and the rest into 3-4 teams of linguists.
     - Give linguists notebooks and chips (each team gets 10 chips).

  3. Round 1 (10 min):
     - Informants move among the teams (or one informant per team if possible) and provide basic vocabulary by pointing and acting. They start with nouns and verbs.
     - Teams record translations and can bet 0-3 chips on the meaning of "glim".

  4. Round 2 (15 min):
     - Informants now provide the ambiguous uses of "glim". They point to the whole rabbit and then to parts (without detaching).
     - Teams must revisit "glim" and bet again (0-3 chips) on what it means now.

  5. Round 3 (15 min):
     - Informants introduce "yoti" in the contexts described (living vs. non-living, and dead flower).
     - Teams bet on the meaning of "yoti".

  6. Reveal (5 min):
     - Teacher reveals the meanings: 
          - "glim": means both rabbit and undetached rabbit part (it's the same word for both).
          - "yoti": means spirit (and the informant believes in spirits).
     - Score the bets: 
          - For "glim": if a team wrote a translation that covers both (like "rabbit or undetached rabbit part") they win. If they wrote just "rabbit" or "rabbit part", they lose because it doesn't cover the other use? But note: the word is ambiguous. We might accept "rabbit" as correct for the first use but not for the second. However, to be strict, we can say that the word has a meaning that doesn't map one-to-one to English, so if they chose one English word, they are missing part of the meaning. Alternatively, we can accept any translation that is consistent with the evidence they had, but then we reveal that there are two possible consistent translations? This is complex.

     Let's simplify: 
     - For Round 1: They bet on the meaning of "glim" when only the whole rabbit was shown. They could have "rabbit" and that's acceptable for that round. 
     - For Round 2: They bet again after seeing it used for parts. Now, they must decide if the word is the same or different. We reveal that it's the same word. So if they changed their translation to something that covers both (or kept "rabbit" but note that it doesn't cover the part) they are inconsistent? We can say: the word in Lingua is the same for both, so any translation that uses two different English words is wrong. And any translation that uses one English word that doesn't cover both (like "rabbit") is incomplete. We accept as correct a translation that is one word and covers both? But in English, there isn't one. So we might have to accept a phrase. We can be lenient and accept if they note the ambiguity and say it could be either. 

     Alternatively, we can score based on the evidence they had: if they have a manual that fits all the evidence, they are correct. But then we have multiple manuals. We can give points to any team that has a consistent manual, even if it's not the one we intended. This is the point of indeterminacy.

     For the purpose of the activity, we can say:
     - For "glim": any translation that fits all the evidence is acceptable (so "rabbit", "undetached rabbit part", or even "animal" if they thought it might be a general term) is acceptable? But note: we also showed them a flower and a stone, so if they said "animal", that wouldn't fit because they saw "glim" only for rabbits. So "rabbit" is acceptable for the first round. But after Round 2, if they still say "rabbit", they must explain the part: they might say it's a synecdoche? Or they might change to "rabbit part". We accept both as consistent? But then we reveal that the informant meant both with the same word. So we can say: the word "glim" in Lingua does not have a direct one-word English equivalent. The point is that the evidence underdetermines the translation.

     For scoring: We can avoid being too strict and instead focus on the lesson. We can say: if your translation was consistent with the evidence, you get your bet back plus the same amount? But if they bet on a translation that was inconsistent (like if they said "glim" means flower at some point) then they lose.

     For "yoti": We reveal it means "spirit". If they translated it as "alive", they are close but not exact. We can say: the evidence was consistent with both "alive" and "spirit", but the informant meant "spirit". So if they had "alive", they lose their bet? Or we can note that without more evidence, they couldn't know. This is underdetermination.

     Given the complexity, perhaps we don't focus too much on winning and losing but on the experience. The chips are to add stakes and engagement, but the real point is the debrief.

  7. Debrief (15 min):
     - Start by asking the teams: What was hard? What surprised you?
     - Then connect:
          - Holism: When you encountered "yoti", you had to understand it in the context of other words and beliefs. You couldn't just translate it in isolation.
          - Charity: In the case of "yoti", you probably assumed the informant was saying something true about the world (e.g., that the flower was dead) even though you might not believe in spirits. You had to attribute a belief that you don't hold to make sense of the utterance.
          - Indeterminacy: For "glim", you saw that the same evidence could be explained by multiple translation manuals. There was no way to know exactly what the informant meant without asking (and you couldn't ask because you don't share a language). This is underdetermination.
     - Then, address the limitations:
          - The activity shows underdetermination by evidence, but in Davidson, there is a stronger claim: that there is no fact of the matter about which manual is correct. In our activity, there was a fact (the informant's card) but in radical interpretation, without access to the speaker's mind, we can't get beyond the evidence.
          - Holism: In the activity, you built the manual word by word, but in reality, interpretation is holistic: you have to assign meanings, beliefs, and desires all at once. We did a simplified version.

     - Finally, relate to the personal anecdote: "This is what I experienced with my partner's grandmother: I kept having to attribute beliefs and intentions to make sense of what she was saying, and I had to constantly check my assumptions."

  By the end, they should feel the vertigo: that interpretation is not a matter of just matching words to the world, but a holistic, charitable, and underdetermined process.
answer: |-
  Here's a fleshed-out, runnable activity designed to force students into the vertigo of radical interpretation. It targets your goals: underdetermination, charity in action, and the impossibility of a "neutral" stance. I've refined your sketch with tested mechanics, added stakes, and included troubleshooting.

  ---

  ### **Activity: The Lingua Fracta Challenge**  
  *(Total time: 75 minutes)*

  ---

  #### **Setup & Rules (15 mins)**  
  1. **Roles**:  
     - **Informants (3 students)**: Given secret language cards (see below). They *only* speak "Lingua Fracta" (LF) and can gesture.  
     - **Linguist Teams (3 teams of 5)**: Build a translation manual. Each team gets 10 betting chips.  
     - **Moderator (You)**: Introduce LF as a "field discovery," set stakes, and enforce rules.  

  2. **Core Rules**:  
     - **No English**: Informants *cannot* use English or answer yes/no questions. Linguists must infer from gestures + utterances.  
     - **Stakes**: Teams bet chips on their translations in key rounds. Wrong bets = lose chips. Winning team (most chips) gets bragging rights + candy.  
     - **Data Collection**: Linguists request scenarios (e.g., "Show us ‘running’" or "Point to water"). Informants respond *only* in LF.  

  3. **Materials**:  
     - **Informant Cards** (1 set per informant):  
       ```  
       LINGUA FRACTA RULES:  
       - "Vok" [vohk] = Water (liquid) OR time period (e.g., "morning").  
       - "Tarr" [tahr] = Stone, rock, OR hard object.  
       - "Kali" [kah-lee] = To consume (eat/drink).  
       - "Miren" [mee-ren] = To move quickly (run/flee).  
       - "Ghis" [ghiss] = [CHARITY WORD] Sacred life-force (in all living things).  
       - "Nola" [noh-lah] = Not, negation.  
       - **Grammar**: Subject-Object-Verb. "Ghis" MUST precede living things.  
         - "Vok kali" = "Water consume" (I drink water).  
         - "Tarr Nola Ghis" = "Stone not sacred" (Rocks aren't alive).  

       SCENARIOS TO PERFORM:  
       1. When asked for "water": Point to water, say "Vok."  
       2. When asked for "morning": Point to sunrise (image provided), say "Vok."  
       3. When asked to "consume": Pretend to eat bread, say "Kali."  
       4. When asked for "sacred": Point to a plant, smile, say "Ghis."  
          Point to a dead plant, frown, say "Nola Ghis."  
          Point to a rock, say "Tarr Nola Ghis."  
       ```  
     - **Linguist Kits**: Paper for manuals, pens, chips.  

  ---

  #### **Activity Rounds (40 mins)**  
  **Round 1: Basic Translation (10 mins)**  
  - **Goal**: Translate basic nouns/verbs (e.g., "Vok," "Kali").  
  - **Twist Setup**: Informants use "Vok" for both water and morning. Teams likely map "Vok" → "water" (ignoring ambiguity).  
  - **Bet**: Teams bet 0–2 chips on "Vok = water."  

  **Round 2: Underdetermination Reveal (15 mins)**  
  - **Goal**: Translate "Tarr" (stone/hard object).  
  - **Twist**:  
    - Informants point to a rock: "Tarr."  
    - Then point to a metal wrench (hard object): "Tarr."  
    - *Finally, point to morning ("Vok") + wrench ("Tarr") and say "Vok Tarr"* ("morning is hard"? "Hard morning"?).  
  - **Panic Trigger**: Teams realize "Vok" might not mean "water," destabilizing Round 1 bets.  
  - **Bet**: Teams bet 0–3 chips on "Tarr = rock."  

  **Round 3: Charity Bites (15 mins)**  
  - **Goal**: Translate "Ghis" (sacred life-force).  
  - **Twist**:  
    - Informants:  
      - Point to a healthy plant: "Ghis."  
      - Point to a dead plant: "Nola Ghis."  
      - Point to a rock: "Tarr Nola Ghis."  
    - **Critical moment**: Informants point to a student's smartphone (circuitry lights on), smile, and say "Ghis!"  
  - **Charity Crisis**: Linguists must decide:  
    - Option A: Reject "Ghis = sacred" → smartphone is "alive"? Absurd!  
    - Option B: Accept informant believes tech has "life-force" → attribute "false" belief.  
  - **Bet**: Teams bet 0–5 chips on "Ghis = alive."  

  ---

  #### **Reveal & Scoring (5 mins)**  
  - Reveal Lingua Fracta translations:  
    - "Vok" = water **or** morning (underdetermined).  
    - "Tarr" = hard object (teams betting "rock" lose chips).  
    - "Ghis" = sacred life-force (teams betting "alive" lose chips; only "sacred" wins).  
  - **Stakes**: Teams that bet wrong lose chips. Smartphone example shows "Ghis" requires attributing belief in universal animism.  

  ---

  #### **Debrief: Mapping to Davidson (15 mins)**  
  **Key Connections**:  
  1. **Underdetermination (Indeterminacy of Reference)**:  
     - "Vok" and "Tarr" had multiple consistent translations (water/morning, rock/hard object).  
     - *Student takeaway*: No "rabbit vs. rabbit-stage" fact—evidence equally supported both.  

  2. **Charity as Forced Attribution**:  
     - "Ghis" *required* attributing belief in sacred tech to avoid seeing informant as irrational.  
     - *Student takeaway*: Charity isn’t kindness—it’s the **only way** to make sense of others.  

  3. **Holism Light**:  
     - "Vok Tarr" ("morning hard") forced re-evaluation of prior translations.  
     - *Student takeaway*: Words only make sense in a network of beliefs (meanings aren’t built word-by-word).  

  **Predictable Problems & Fixes**:  
  - 😅 **Problem**: Linguists "English-ify" categories (e.g., "Vok = water").  
    - **Fix**: In debrief, highlight how "morning" broke their assumptions. Ask: *"Why did you ignore the sunrise example initially?"*  
  - 😅 **Problem**: Informants break character or linguists cheat.  
    - **Fix**: Pick assertive informants. Penalize English with chip loss. Have backup "mystery gestures" (e.g., informant taps foot if linguists use English).  
  - 😅 **Problem**: Teams miss the charity dilemma (e.g., think "Ghis = alive" is sufficient).  
    - **Fix**: Hammer the smartphone moment: *"If you translated 'Ghis' as 'alive,' why did the informant smile at a phone? Do you believe it's alive?"*  

  **What the Activity Can’t Do (and How to Bridge It)**:  
  - ❌ **Can’t replicate "no fact of the matter"**:  
    - *Why*: Students know you designed LF, so there’s a fact (e.g., "Ghis = sacred").  
    - **Bridge**: Say: *"In the field, there’s no 'answer key.' Davidson argues that even the speaker can’t resolve ambiguity—because their beliefs are only accessible through interpretation."*  
  - ❌ **Can’t replicate full holism**:  
    - *Why*: Teams build manuals incrementally (word-by-word), not all-at-once.  
    - **Bridge**: Ask: *"When you saw 'Vok Tarr,' did you only revise 'Tarr,' or did 'Vok' and 'Tarr' both change meaning? That’s holism—one piece affects the whole."*  

  ---

  #### **Why This Works**  
  - **Vertigo achieved**: The smartphone moment forces charity as a survival tactic, not theory. Betting makes underdetermination visceral.  
  - **Your anecdote integrated**: Open with your grandmother story to prime them for the chaos of real interpretation.  
  - **Logistics**: Print LF cards, use everyday objects (water bottle, rock, phone), and keep rounds tight.  

  **Final Tip**: Run it with a colleague first to tweak timing. Students will leave dizzy—in the best way.
