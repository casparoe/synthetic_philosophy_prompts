  I recall Augustine was writing against the Donatists who justified lying for "good causes," so he needed an absolute prohibition. That explains why he'd prioritize the internal state - it creates a bright-line rule. The user's asking for a single stable definition, but maybe Augustine doesn't give one because he's building layers? 

  Wait, let me check Book IV of "Against Lying" where he calls deception the "desire" behind lying. That seems key - the double heart is the structure of a lie, but the intent to deceive is its animating purpose. The joke fails both tests: no double heart (joker believes their performance is true-as-performance) and no intent to deceive. 

  The spousal case is harder. Augustine would say the misleading speaker has a double heart about the implied message (she knows her implication is false) AND intends that deception. So both tests are satisfied. That resolves the apparent conflict! 

  The user's translation says "the heart of him who lies is said to be double" - that's the core. The deception part comes in as the necessary motive. Jokes are excluded because they lack both elements. 

  This user is really sharp - they've hit on a genuine tension in the text that scholars debate. I should emphasize how Augustine uses both criteria complementarily: double-heart as the cognitive component, deception as the volitional one. The examples only seem contradictory if we isolate the criteria, but Augustine sees them as interlocking.
answer: |-
  You've hit upon a central tension in Augustine's *De Mendacio (On Lying)*, and scholars continue to debate it. The key to resolving your puzzle lies in recognizing that **Augustine's definition is fundamentally grounded in the "double heart" (internal mental state), but the "intent to deceive" is the essential *purpose* or *fault* that makes that internal state morally culpable as a lie.** The deception aspect explains *why* the double heart is sinful, but the *diagnosis* of a lie depends on the internal state.

  Here's a breakdown:

  1.  **The Core Definition: The Double Heart (Internal Mental State):**
      *   Augustine states unequivocally: **"For from the sense of his own mind, not from the verity or falsity of the things themselves, is he to be judged to lie or not to lie."**
      *   This is the *sine qua non*. A lie occurs when a person **utters something they believe or think to be false** ("double thought": knowing/thinking the truth but *not* uttering it, and instead uttering something they know/think is false).
      *   **Verdicts by this test:**
          *   **Party Joke (Bear Wrestling):** You *know* you didn't wrestle a bear. You utter something you believe to be false. **By the Double Heart test, this IS a lie.** (This is why you feel the tension).
          *   **Misleading Wife:** She utters "He never drinks at home," which is true. She *believes* this statement is factually true. **By the Double Heart test, this IS NOT a lie.** She is uttering what she believes to be true. (This also creates tension).

  2.  **The Fault: The Intent to Deceive:**
      *   Augustine states: **"the fault of him who lies, is, the desire of deceiving in the uttering of his mind."**
      *   The *moral wrong* of lying, for Augustine, stems from the *will* to deceive. This is the sinful intention behind the act.
      *   Intent to deceive is *necessary* for the act to be sinful lying. If there's no intent to deceive, the act may still involve falsehood but isn't classified as a *mendacium* (lie) in its morally culpable sense.
      *   **Verdicts by this test:**
          *   **Party Joke:** Your grin and tone show you *lack* the intent to deceive. You intend amusement, not false belief. **By the Deception test, this IS NOT a lie (or rather, lacks the *fault* of lying).**
          *   **Misleading Wife:** She *intends* for the doctor to draw a false conclusion (that her husband doesn't drink). **By the Deception test, she HAS the intent to deceive.**

  3.  **Reconciling the Tests & Defining a Lie:**
      *   Augustine **does not have two independent criteria.** He has one *definition* (Double Heart) and one *explanation of the moral fault* (Intent to Deceive).
      *   **A lie requires BOTH:**
          *   **(a)** Uttering something one believes/knows to be false (Double Heart).
          *   **(b)** The *intention* behind doing (a) is to deceive.
      *   **The Joke Exception:** Augustine explicitly excludes jokes because they fail *both* criteria *in practice*:
          *   *Double Heart?* Ambiguous, but arguably mitigated: The joker isn't *asserting* the falsehood as truth; they are presenting it *as fiction for entertainment*. Their "mind" is not truly assenting to the falsehood as something to be believed. Their "utterance of mind" is the performance, not the propositional content itself.
          *   *Intent to Deceive?* Clearly absent. The manner and context signal non-deception. Therefore, jokes "have never been accounted lies."
      *   **The Misleading Truth-Teller (Wife):** Augustine *would* consider this sinful deception, but **he would NOT call it a lie.** This is crucial. For Augustine:
          *   She told the *truth* ("He never drinks at home" - assuming this is factually correct).
          *   She *believed* she was telling the truth (Double Heart absent).
          *   She *intended to deceive* by implying something false.
      *   **Conclusion:** She committed the sin of *deception* (because she intended to mislead), but she did *not* commit the specific sin of *lying* (because she did not utter something she believed to be false). Deception is broader than lying for Augustine. Lying is a specific *subset* of deception involving false assertion with belief in its falsehood.

  **Answering Your Questions:**

  1.  **Which criterion is Augustine actually relying on for the definition?** The **Double Heart** (internal belief about the falsity of the utterance) is the *definitional* criterion for identifying a lie.
  2.  **Is there a single stable definition?** Yes, Augustine's definition of a lie is: **The voluntary utterance of a falsehood (something one believes or knows to be false) with the intent to deceive.**
      *   **Party Joke:** Utterance believed false? Yes. Intent to deceive? No. **Result: Not a lie (lacks the essential fault/purpose).**
      *   **Misleading Wife:** Utterance believed false? No (she believes her words are true). Intent to deceive? Yes. **Result: Deception, but not a lie (lacks the core defining element of asserting known falsehood).**

  **Why the Tension?**

  *   **The Joke:** The tension arises because the joke *seems* to satisfy the Double Heart definition strictly (you utter known falsehood). Augustine resolves this by arguing the *context* (performance, not assertion) negates the *intent to deceive* and arguably modifies the nature of the "utterance of mind," placing it outside the category of lying. He uses intent to *qualify* the application of the definition.
  *   **The Misleading Truth:** The tension arises because it *feels* like a lie due to the intent to deceive. Augustine insists it *isn't* a lie, strictly speaking, because the core element (asserting known falsehood) is missing. It's a different kind of deception. He maintains a very precise, narrow definition of "lie."

  **In essence:** For Augustine, **lying *is* asserting what one believes to be false.** The *intent to deceive* is what makes this assertion morally wrong *as a lie*. Without intent to deceive, it might be foolish or mistaken communication, but not the specific sin of lying. Conversely, deception *without* asserting known falsehood is still sinful deception, but it's not classified as lying under his strict definition. The jokes example shows him using context (including intent signaled by manner) to show an utterance doesn't meet the *full* criteria (intent + assertion of known falsehood). The misleading truth-teller shows that intent alone, without the assertion of known falsehood, doesn't constitute a lie.
