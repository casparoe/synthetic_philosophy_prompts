prompt: |-
  I am producing a small, technically-minded philosophy podcast, and my next guest is a philosopher who has spent several years defending a reconstruction of Williams's integrity objection to utilitarianism. I want the episode to be about her reconstruction rather than about the objection as it is usually taught, so let me set out her position as I understand it, since the questions need to turn on its details.

  Her view runs roughly as follows. The familiar version of the objection — the agent who saves his wife must, on the utilitarian account, add the further thought that the calculus permits him to save her, and this is one thought too many — is vulnerable to the self-effacement reply: a criterion of rightness need not double as a deliberative guide, so the theory can tell the agent to be moved by love while its criterion of rightness stays impartial. She concedes that reply at the level of deliberation and relocates the objection. Even a self-effacing theory, she argues, must in stating why the agent's act was right cite only the consequences; the agent's love for his wife figures in the theory's story as a cause of utility-maximising behaviour and never as a reason. She calls this the Reason-Substitution Claim. Her further move is to derive it from a general constraint, the Reasons-Availability Constraint: any theory of rightness must be able to state the reasons for which the actions it requires may be done. She takes that constraint to indict any theory that operates with a criterion of rightness — Kantian as well as utilitarian — while leaving particularist and virtue-theoretic approaches untouched. When objections come, she has one standing reply: whatever the objection is, it applies to every theory with a criterion of rightness, which she says is precisely her point.

  Please draft eight to ten interview questions that press this position rather than inviting her to restate it. The audience will have read her book; nothing should prompt a summary of Williams's examples or of the self-effacement reply. At a minimum I want: a question on whether the Reason-Substitution Claim survives the sophisticated consequentialist's distinction between the features that make an act right and the reasons for which the agent may act, with a follow-up keyed to the answer she is most likely to give; a question on whether the Reasons-Availability Constraint is a conceptual truth about rightness or an artifact of the morality system Williams himself spent his later work attacking, with a follow-up that exploits that tension; a question on whether the Reason-Substitution Claim is a conceptual or an empirical thesis, and what would count as evidence for it either way; a question on whether the nearest-and-dearest problem can be run without the integrity apparatus at all, since if it can, her unification of the two is idle; and a question on why particularism escapes the constraint, when the particularist must also give reasons for what she does.

  Give each question its follow-up, keyed to the reply she is most likely to give. Order the sequence so that her standing widening reply becomes progressively harder to use, and close with a question about what would count against the Reasons-Availability Constraint — what she would have to see to abandon it. No questions about how she came to the topic, and nothing that asks her to define her terms.
reasoning: |-
  Okay, the user is producing a philosophy podcast and needs interview questions for a guest who has a specialized reconstruction of Bernard Williams' integrity objection to utilitarianism. The guest's position involves shifting the objection from deliberation to the theory's justification level via the Reason-Substitution Claim and Reasons-Availability Constraint.

  Hmm, the core of her argument seems to be that even self-effacing theories must substitute the agent's personal reasons with impersonal ones when explaining why an act is right. And she generalizes this to all criterion-based moral theories. The user wants questions that challenge this reconstruction without rehashing basics.

  Let me unpack key pressure points. First, there's tension between her Reason-Substitution Claim and sophisticated consequentialism's distinction between right-making features and agent's reasons. If consequentialists can separate these, does her claim still hold? I should prepare a follow-up about whether the theory's official story still excludes personal reasons even if the agent acts on them.

  Second, the Reasons-Availability Constraint feels suspiciously close to the "morality system" Williams criticized later. If he attacked that framework, how does she justify building her argument on it? The follow-up could push on whether this makes her reconstruction self-undermining.

  Third, the status of the Reason-Substitution Claim needs probing - is it conceptual (true by definition) or empirical (testable)? If conceptual, what prevents opponents from rejecting the definition? If empirical, what counterevidence exists? Follow-up should press on how we'd falsify it.

  Fourth, if the "nearest-and-dearest" problem works without integrity concerns (e.g. through partiality debates), her unification seems redundant. The follow-up could ask why we need integrity apparatus at all if others achieve similar critiques.

  Fifth, particularist exemption feels shaky. If particularists give reasons case-by-case, how do they avoid the constraint? Follow-up should challenge whether "holistic reasons" truly differ from criterion-based ones.

  The sequence should start with theory-specific challenges (consequentialism) before widening to general constraints, saving the particularism question for last to corner the "all criterion theories" defense. Final question should force her to specify what could falsify her constraint - making it testable rather than tautological.

  User clearly knows her work well - questions must avoid summaries and definitions while exploiting tensions in her framework. No softballs about influences or terminology. Need surgical strikes that force new ground.
answer: |-
  Here are eight tightly focused interview questions with strategic follow-ups, sequenced to progressively challenge her framework and limit her "widening reply" defense. Each follow-up anticipates her likely response and presses further:

  1. **Challenge to Reason-Substitution vs. Sophisticated Consequentialism:**  
     *"Sophisticated consequentialists argue their criterion identifies right-*making* features (e.g., maximizing utility), but fully endorse agents acting for diverse *motivating* reasons (love, duty) – provided those reasons reliably track the criterion. How does your Reason-Substitution Claim survive this separation, given it seems to target the theory's *justification* of the act's rightness, not the agent's psychology?"*  
     *(Likely Reply: She’ll insist the theory’s *official story* for *why* the act is right still substitutes love with utility, even if the agent acts on love.)*  
     **Follow-Up:** *"But if the theory explicitly says 'love is a reliable *cause* of right acts and acting on it is permissible/required,' isn't love *integrated* into the theory's normative account as a permissible/necessary *type* of reason, not merely a causal factor? Doesn't this negate 'substitution'?"*

  2. **Tension with Williams' Later Critique:**  
     *"Your Reasons-Availability Constraint (RAC) demands theories articulate 'the reasons for which actions... may be done.' Isn't this demand for codifiable, theory-supplied reasons precisely part of the 'morality system' – with its emphasis on obligation, blame, and explicit justification – that Williams spent his later work (e.g., *Ethics and the Limits of Philosophy*) attacking as a local historical construct? How is your reconstruction not relying on the very framework Williams came to reject?"*  
     *(Likely Reply: She’ll distinguish her project or argue RAC is a minimal, non-historical constraint inherent in stating a theory of rightness.)*  
     **Follow-Up:** *"If RAC *is* inherent in stating a theory of rightness, doesn't that imply Williams' later critique *undermines the coherence of 'a theory of rightness' itself*? Doesn't this make your constraint, far from being Williamsian, actually *antithetical* to his mature skepticism about systematic moral theory?"*

  3. **Status of the Reason-Substitution Claim (Conceptual vs. Empirical):**  
     *"Is the Reason-Substitution Claim (RSC) a conceptual truth about how criterion-based theories *must* operate, or an empirical claim about how they *actually* structure their explanations? And crucially, what observable difference or counterexample would prove it false?"*  
     *(Likely Reply: She’ll lean towards conceptual: it’s inherent in having a unitary criterion.)*  
     **Follow-Up:** *"If RSC is conceptual, doesn't it risk being tautological ('theories using a single criterion cite only that criterion')? And if opponents simply *deny* this conceptual link – arguing a theory *can* cite love *as a reason* within its justification (e.g., 'love is a fundamental good to be promoted') – what argument compels them to accept your conceptual framing besides asserting the constraint itself?"*

  4. **Necessity of Integrity for the Partiality Problem:**  
     *"Many critics argue utilitarianism fails to adequately account for partiality (e.g., parental duties) *without* invoking integrity – often using 'nearest and dearest' examples structurally similar to Williams' but focusing on the value of relationships themselves. If this critique succeeds independently, doesn't it render your specific appeal to integrity and the RSC functionally idle for that core problem?"*  
     *(Likely Reply: She’ll argue integrity captures a deeper issue – the *agent’s perspective* and the *reason’s source* – that mere partiality critiques miss.)*  
     **Follow-Up:** *"But if a partiality critique successfully forces a consequentialist to build 'special obligations from relationships' directly into their *criterion* of rightness (e.g., as intrinsic goods), haven't they addressed the 'reason-substitution' problem *within* the criterion framework, bypassing integrity entirely? Doesn't this show the partiality problem *can* be solved without your apparatus?"*

  5. **Particularism's Exemption and Reasons:**  
     *"You exempt particularism from RAC, arguing it lacks a criterion. Yet, a particularist, when acting rightly, surely acts *for reasons* – she perceives salient features (e.g., 'he's my friend and desperate') as her reasons. Why doesn't RAC still demand that *particularism as a theory* must be able to state 'the reasons for which actions may be done,' even if they are context-dependent? What shields it?"*  
     *(Likely Reply: Particularism denies there *are* general, codifiable reasons/theory-supplied reasons applicable across contexts; reasons are irreducibly situated.)*  
     **Follow-Up:** *"But doesn't the particularist *theory* still imply a general meta-reason: 'Act on the salient moral reasons present in the situation'? And isn't RAC triggered the moment *any* general claim about right action (even this meta-claim) is made? If not, why isn't 'Maximize utility' or 'Act only on maxims universalizable' similarly exempt as a meta-reason?"*

  6. **Kantianism and the Widening Reply:**  
     *"You group Kantianism with utilitarianism under RAC. But consider a Kantian who acts from duty *through* love – e.g., 'Because she is my wife (loved), caring for her *is* my duty in this context.' Here, the personal reason ('she is my wife') seems integrated *as the content* of the duty, not substituted by 'duty' as an abstract placeholder. Why is this still Reason-Substitution?"*  
     *(Likely Reply: She’ll argue the ultimate justification still traces back solely to the Categorical Imperative procedure/form, substituting the personal with the universalizable.)*  
     **Follow-Up:** *"But if the Kantian theory *endorses* this derivation – 'loyal acts within special relationships, when universalizable, *are* duties' – and the agent acts on 'this is my loyal duty to my wife,' isn't 'loyalty to my wife' functioning as the *concrete, recognized reason* sanctioned by the theory? Isn't the substitution claim here much less clear-cut than in the utilitarian 'love causes utility' case?"*

  7. **The Scope of "May Be Done" in RAC:**  
     *"RAC states 'any theory of rightness must be able to state the reasons for which the actions it requires *may be done*.' Does 'may be done' refer only to *permissible* motivating reasons, or also to the *ideal* or *most direct* reasons? If a theory permits acting on love (as sophisticated consequentialism does), hasn't it satisfied RAC by stating love *is* a reason for which the act may be done? Why must it also be the reason cited in the *ultimate justification*?"*  
     *(Likely Reply: She’ll argue RAC demands the theory state the reasons that *justify* the act’s rightness, which are distinct from permissible motives.)*  
     **Follow-Up:** *"But your constraint says 'reasons for which actions... *may be done*,' not 'reasons that *make it right*.' Isn't this phrasing ambiguous? If a theory explicitly lists 'acting from love' as a permissible (or even commendable) way to perform the right act, hasn't it satisfied the literal demand to state a reason (love) for which the act may be done?"*

  8. **Falsifiability of the Reasons-Availability Constraint:**  
     *"Imagine encountering a compelling moral theory that consistently yields intuitively correct verdicts, provides action-guidance, but *explicitly refuses* to specify 'the reasons for which actions may be done,' perhaps arguing this demand is misguided or impossible to meet systematically. What specific evidence or argument *within* or *about* this theory would force you to concede that RAC is not a necessary feature of a theory of rightness, but a substantive (and rejectable) philosophical commitment?"*  
     *(This forces her to define the limits of RAC and admit potential counterevidence, moving beyond defense.)*

  **Sequence Justification:**  
  1.  Starts with a direct challenge within consequentialism, her primary target.  
  2.  Introduces a deep tension with Williams' later work, questioning her framework's foundation.  
  3.  Presses the ambiguity of her core claim (RSC)'s status.  
  4.  Challenges the necessity/uniqueness of her reconstruction for the partiality problem.  
  5.  Directly attacks the exemption of particularism, a key part of her positive view.  
  6.  Presses her widening reply on Kantianism, showing strain.  
  7.  Challenges the interpretation of RAC's wording, a potential loophole.  
  8.  Ends by forcing consideration of RAC's falsifiability, preventing it from being a circular axiom.  

  This sequence systematically boxes in the "it applies to all criterion theories" reply by: showing internal problems with her analysis of specific theories (1, 6, 7), challenging the coherence/heritage of the constraint itself (2, 8), questioning the uniqueness of the problem it solves (4), and undermining her positive alternative (5). By the end, the widening reply feels like evasion rather than explanation.
