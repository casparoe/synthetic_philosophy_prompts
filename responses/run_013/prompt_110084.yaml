answer: |-
  Below is a practical 20-minute procedure to resolve analyst disagreements in your committee, based on Bayesian principles and decision theory. It's designed for non-experts, using plain language and focusing on actionable outcomes. The procedure forces clarity on whether the disagreement is about **facts** (probabilities), **values** (risk tolerance), or **unshared information**, then hands off what can't be resolved analytically.

  ---

  ### **The 20-Minute Dispute Resolution Procedure**
  **Goal:** Resolve disagreements or clarify the nature of the disagreement (probability vs. values vs. private info).  
  **Who speaks:** Primarily the two analysts, with the chair moderating.  
  **Output:** A clear probability estimate, a risk-tolerance decision, or a judgment call for the chair/committee.

  #### **Step 1: Define the Question and Probabilities (2 min)**  
  - **Chair asks:** "What exact event are we assigning a probability to? Define it unambiguously."  
    *Example:* "Will Company X default on its debt within 12 months?"  
  - **Analysts state probabilities:**  
    Analyst A: "My probability is P₁%."  
    Analyst B: "My probability is P₂%."  
  - **Sufficient answer:** A binary event definition and two numbers (e.g., 20% and 60%).  
  - **Stops here if:** Probabilities are within 10% (e.g., 45% vs. 55%). If so, average them and proceed.  

  #### **Step 2: Share Key Reasons (3 min)**  
  - **Chair asks each analyst:** "What is your top reason for your probability? Be specific."  
    *Example:*  
    Analyst A (20%): "Company X has strong cash reserves, so default is unlikely."  
    Analyst B (60%): "Their debt covenants are too tight given declining revenue."  
  - **Sufficient answer:** Each gives 1–2 concrete reasons (no jargon).  
  - **Stops here if:** Analysts realize they agree (e.g., both cite the same evidence but interpreted differently).  

  #### **Step 3: Cross-Examine Reasoning (5 min)**  
  - **Chair asks Analyst A:** "Restate Analyst B’s top reason. Why do you disagree?"  
  - **Chair asks Analyst B:** "Restate Analyst A’s top reason. Why do you disagree?"  
  - **Chair then asks:** "After hearing this, does either of you change your probability?"  
  - **Sufficient answer:**  
    - Each accurately summarizes the other’s view (proves common knowledge).  
    - Revised probabilities (if any).  
  - **Stops here if:** Probabilities converge (e.g., both move to 40%).  

  #### **Step 4: Betting Test (3 min)**  
  - **Chair asks both:** "If I offered you a bet where you win \$100 if the event happens, but lose \$X if it doesn’t, what is the highest X you’d accept? Your X should reflect your probability."  
    *Example:*  
    - Analyst A (20%): Should accept X ≤ \$25 (since 20% chance to win \$100 justifies risking \$20–\$25).  
    - Analyst B (60%): Should accept X ≤ \$150 (since 60% chance justifies risking up to \$150).  
  - **Chair interprets:**  
    - If both accept bets consistent with their probabilities → Disagreement is **genuine probability conflict** (handled in Step 6).  
    - If neither accepts their "fair" bet → Disagreement is **not about probability** (proceed to Step 5).  
  - **Sufficient answer:** Two numbers (the \$X each would accept).  

  #### **Step 5: Risk vs. Probability Check (4 min)**  
  - **Chair asks:** "Is the disagreement about how *likely* the event is (probability), or how *bad* it would be if it happened (impact)?"  
  - **If about impact (risk tolerance):**  
    - "Would you both agree on the probability if we ignore the consequences?"  
    - If yes → Disagreement is about **values** (risk appetite). Hand to committee.  
  - **If about unshared information:**  
    - "Is there critical information one of you has that the other hasn’t seen or can’t verify?"  
    - If yes → Disagreement is about **private knowledge**. Hand to chair.  
  - **Sufficient answer:** Clear classification (probability/impact/private info).  

  #### **Step 6: Resolve Probability Disagreement (3 min)**  
  - **Only if Step 4 confirmed genuine probability conflict.**  
  - **Chair forces compromise:** "Average your probabilities. Analyst A, can you accept 40%? Analyst B, can you accept 40%?"  
  - **If both agree:** Use 40%.  
  - **If not:** Chair imposes the average (or median) as the working probability.  
  - **Output:** A single probability for the committee to use in decisions.  

  ---

  ### **Running Your Three Scenarios**
  **Scenario 1 (20% vs. 60% on same event):**  
  - Step 1: Event defined (e.g., "recession in 12 months"). Probabilities: 20% and 60%.  
  - Step 2: Analyst A: "Leading indicators are strong." Analyst B: "Inverted yield curve implies recession."  
  - Step 3: Both restate correctly, but neither changes probability.  
  - Step 4: Both accept fair bets (Analyst A risks \$25 to win \$100; Analyst B risks \$150). → Genuine probability conflict.  
  - Step 6: Average to 40%. Use 40% for decision-making.  
  - **Outcome:** Working probability = 40%.  

  **Scenario 2 (Agree on expected return, but one avoids downside):**  
  - Step 1: Event = "Investment loses >20%." Probabilities: Both 30%.  
  - Step 2: Both agree on likelihood but not action.  
  - Step 4: Both accept fair bets (risk \$30 to win \$100).  
  - Step 5: Disagreement is about **impact**, not probability. Analyst B: "A 30% chance of 20% loss is unacceptable for our foundation."  
  - **Outcome:** Hand to committee. Question is: "Given 30% probability of >20% loss, does this exceed our risk tolerance?"  

  **Scenario 3 (One has private, unshareable information):**  
  - Step 1: Event = "Family-owned firm misses revenue target." Probabilities: Analyst A (walked plant) = 10%, Analyst B = 40%.  
  - Step 2: Analyst A: "The family’s commitment is unwavering." Analyst B: "Financials show declining orders."  
  - Step 3: Both restate correctly. No change.  
  - Step 4: Both accept fair bets.  
  - Step 5: Private information confirmed (Analyst A’s site visit).  
  - **Outcome:** Hand to chair. Question: "Do we trust Analyst A’s unverifiable judgment?"  

  ---

  ### **Where the Procedure Rules Against the Chair**
  - **Step 5 (Risk vs. Probability):** If analysts agree on probability but disagree on action, it becomes a **values/risk-tolerance issue**. The chair must hand it to the committee—analysis can’t resolve it.  
  - **Step 5 (Private Information):** If critical knowledge can’t be shared (e.g., "I know the family"), the chair must decide whose judgment to trust. No algorithm can override human judgment here.  
  - **Step 6 (Averaging):** If probabilities don’t converge after betting, the chair imposes an average. This is a judgment call—it’s pragmatic, not theoretically sound.  

  ---

  ### **Where the Procedure Misfires or Fails**
  1. **False confidence in averages:**  
     - Averaging probabilities (Step 6) is a last resort. It misfires if one analyst is consistently better calibrated.  
     - **Mitigation:** Track which analyst’s predictions are more accurate over time and weight their inputs.  
  2. **Betting test misinterprets risk aversion:**  
     - An analyst might reject a "fair" bet due to personal risk aversion, not disbelief in their probability.  
     - **Mitigation:** In Step 4, ask: "Is your reluctance about the probability or the stakes?" If the latter, revert to Step 5.  
  3. **Group dynamics (5 people, not 2):**  
     - With 5 committee members, run Steps 1–3 with the two analysts only. For voting:  
       - After Step 6, have the 5 members vote on the averaged probability.  
       - If Step 5 hands off to committee, vote on risk tolerance.  
     - **Public agreement only:** If one member feigns agreement, use secret ballots for votes.  
  4. **Unresolvable conflicts:**  
     - The procedure can’t force consensus if priors are fundamentally different (e.g., political views on recessions).  
     - **Mitigation:** Chair decides whose model to prioritize (e.g., "We’ll use Analyst B’s recession model for all 2024 decisions").  

  ---

  ### **Bottom Line**
  - **Use this when:** Analysts disagree on a critical probability.  
  - **Stop and hand to committee:** When the issue is risk tolerance (Step 5).  
  - **Stop and hand to chair:** When private information is pivotal (Step 5) or probabilities won’t converge (Step 6).  
  - **Never use:** For non-probabilistic decisions (e.g., "Is this ethical?").  

  This method cuts through debates by forcing transparency on *why* analysts disagree. In 20 minutes, you’ll have either a number, a clarified values conflict, or a clear judgment call for leadership.
