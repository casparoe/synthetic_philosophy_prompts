prompt: |-
  Ok so a friend in my game theory reading group gave me this argument and I'm pretty sure it proves way too much but I can't find the bad step. Here it is. (1) A strategy is irrational exactly when it's never a best response to any belief about what the other player will do. (2) So if strategy s is never a best response, then for every belief there's some strategy of mine that beats s against that belief. (3) In particular take any pure strategy j of the opponent — against the belief "opponent plays j for sure", something beats s. (4) And against a fixed pure belief, if anything beats s then some *pure* strategy of mine beats s (just take the max over my pure strategies). So for each opponent pure strategy j there's a pure strategy i_j of mine that beats s against j. (5) So there's a pure strategy of mine that beats s against every opponent pure strategy, i.e. s is strictly dominated by a pure strategy. (6) Which means mixed strategies never do any work as dominators, and iterated elimination can always get by with pure ones. But (6) has to be false. My example: I have pure strategies A, B, C and the opponent has L and R. Against L, A gives 3, B gives 0, C gives 1. Against R, A gives 0, B gives 3, C gives 1. C is never a best response — the better of A and B gives at least 1.5 whatever the opponent does — and it's strictly dominated by the 50-50 mix of A and B, which pays 1.5 in both columns. But no pure strategy of mine beats C against both L and R. So (6) is wrong and one of these steps is broken. Which one, and what does fixing it actually cost me? I'd rather not give up (1) or (2), and I don't want the fix to just be "ban mixtures from the analysis". I especially want to know what happens to the *iteration* once I admit mixed dominators: if the mixture that kills C is built out of A and B, and some later step kills B, was killing C ever legit? Does the order of elimination matter, and what is the surviving set even supposed to represent? Lead with the one step you reject, then justify it, and keep the whole thing under 350 words.
reasoning: |-
  Okay, the user is presenting a game theory argument that concludes mixed strategies aren't necessary for iterated elimination, but they know that's false because of their example with strategy C. I need to find exactly where the reasoning breaks down.

  Looking at the steps, the critical error is in step (5). The argument claims that for each opponent pure strategy j, there exists a pure strategy i_j that beats s against j. Then it incorrectly assumes that there's a single pure strategy that beats s against all j. That's not true - in their example, A beats C against L but loses against R, while B beats C against R but loses against L. No single pure strategy dominates C.

  The user wants to preserve steps (1)-(4), which are correct: a strategy is irrational if never a best response, and for each pure opponent strategy, some pure response beats s. The fix doesn't require banning mixtures - it just means we can't jump from per-column domination to full domination.

  For the iteration question: when we allow mixed dominators, the elimination order matters. In their example, eliminating C first using the mixed strategy is valid. But if we later eliminate B, that mixed strategy becomes unavailable. The surviving set represents strategies that survive all possible elimination orders, but different orders may yield different results. Rationalizability requires considering mixed strategies throughout.

  The user seems sophisticated - they're in a reading group and spotted the contradiction. They're likely frustrated with arguments that oversimplify game theory. I should emphasize that mixed strategies are essential for capturing strategic uncertainty, and that the error is a subtle but important logical leap.
answer: |-
  The flaw is in step (5): "So there's a pure strategy of mine that beats s against every opponent pure strategy".

  **Why it's wrong:** Step (4) correctly states that *for each* opponent pure strategy *j*, there exists *some* pure strategy *i_j* of yours that beats *s* against belief *j*. However, *i_j* can be *different* for different *j*. Step (5) incorrectly assumes that the *same* pure strategy *i* beats *s* against *all* *j*. Your example proves this: Against L, A beats C (3 > 1). Against R, B beats C (3 > 1). But *no single pure strategy* beats C against both L (A> C but A< C vs R? No: A gets 0 vs R, C gets 1) and R (B> C but B< C vs L? B gets 0 vs L, C gets 1).

  **Fixing it costs:** You must accept that the strategy beating *s* for a *specific* belief *j* (including pure *j*) might be *mixed*, even if for a *fixed pure j*, a pure best response exists. The belief "opponent plays *j* for sure" justifies comparing *s* only to *your pure strategies* for that specific column. To conclude *s* is dominated (beaten for *all* possible opponent plays), you need a strategy (possibly mixed) that beats *s* across *all* columns simultaneously. This mixed dominator (like your 50-50 A/B) aggregates the per-column advantages of different pure strategies.

  **Iteration & Surviving Set:**
  1.  **Order Matters:** Yes. Eliminating C using the mixed strategy (A/B) is valid *if A and B are still present*. If you eliminate B *first*, you cannot form the mixed strategy dominating C. The surviving set depends on the elimination order.
  2.  **What Survives:** The set surviving *iterated elimination of never-best-responses (rationalizability)*, allowing mixed dominators, represents strategies that *could* be rationalizable – i.e., a best response to *some* belief (possibly over opponents' mixed strategies). In your game, only A and B survive: A is best if you believe opponent plays L, B is best if you believe R. C is never best.
  3.  **Pure vs. Mixed Dominators:** While mixed strategies are essential *as dominators* to eliminate strategies like C, the surviving *rationalizable* strategies themselves are always pure (A and B in this case). The mixture was only needed as a tool for elimination.

  **In short:** Step (5) makes an invalid leap from "for every column, some pure row is better" to "some pure row is better in every column". Fixing this requires allowing mixed strategies *as dominators* during elimination. Iteration order then matters, but the final surviving set (under rationalizability) consists of pure strategies that *are* best responses to some belief.
