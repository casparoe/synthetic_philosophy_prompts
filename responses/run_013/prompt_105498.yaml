answer: |-
  ## Joint Statement on Moral Responsibility and the Regent Case  
  **Authored by [Defender of Alternative Possibilities] & [Proponent of Source Conditions]**  

  **Preamble:**  
  We, the undersigned, despite fundamental disagreement on the necessity of alternative possibilities for moral responsibility, jointly affirm the following clarifications regarding our dispute, the structure of counterfactual-intervener cases, and the analysis of the Regent case. This statement isolates points of consensus and pinpoints residual disagreements with precision.  

  ---

  ### 1. Agreed Claims  
  Both parties endorse the following propositions:  

  1.1 **The Core Dispute:**  
  Our disagreement concerns *whether the ability to do otherwise (understood as access to alternative actions)* is a necessary condition for moral responsibility per se, or whether responsibility can obtain solely in virtue of the agent being the *actual source* of her action in the right way.  

  1.2 **Scope of Counterfactual-Intervener Cases:**  
  Such cases (e.g., Frankfurt-style, Regent) are designed to *test the necessity* of alternative possibilities. They are not, on their own, sufficient to establish a *positive theory* of responsibility; they bear primarily on eliminative arguments.  

  1.3 **Common Ground on Responsibility Conditions:**  
  We agree that moral responsibility requires:  
  (a) *Actual Sequence Control*: The agent must act intentionally, with understanding, and her action must issue from her own reasoning processes.  
  (b) *Sourcehood*: The agent must be the author of her action in a non-deviant way; the action must reflect her evaluative stance.  
  (c) *No Coercion/Manipulation in the Actual Sequence*: The agent must not be coerced or covertly manipulated *in the way she actually acts*.  

  1.4 **The Regent Case’s Specific Function:**  
  The Regent case isolates a scenario where:  
  (a) The agent (W) acts solely from her own authentic reasons (resentment) in the actual sequence.  
  (b) The *only* alternative possibility foreclosed is the possibility of *acting from a different will* (specifically, acting from a fabricated grievance).  
  (c) The possibility of *refraining* (inaction) was *not* directly foreclosed; the Regent would have ensured action *via a different motivation*.  
  (d) The Regent’s mere presence, *while inert*, does not *by itself* undermine responsibility. Responsibility is defeated only if the intervener *actually causes* the action or *actually compromises* the agent’s reasoning.  

  1.5 **What the Regent Case Does Not Settle:**  
  It does not resolve whether robust alternative possibilities (beyond mere "flickers") are necessary for responsibility. It tests whether responsibility requires alternatives *when sourcehood is satisfied*.  

  ---

  ### 2. Table of Residual Disagreements  
  | **Question**                                                                 | **Defender's Position**                                                                                             | **Proponent's Position**                                                                                               | **Crux**                                                                                                |
  | :--------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------ | :--------------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------ |
  | **2.1 Could W (in Regent) have done otherwise?**                             | "W lacked the ability to do otherwise *in the robust sense required for responsibility*: she could not avoid the *specific blameworthy action* (betrayal) through her own will." | "W *could* have done otherwise: she could have refrained *or* acted from a different will. The Regent merely blocks *one specific pathway* (refraining *without* altered will)." | **Whether 'could have done otherwise' requires access to an alternative *action* (betrayal/not-betrayal) under the agent's *actual will*.** |
  | **2.2 What matters: Alternative action or alternative will?**                | "Responsibility requires the ability to avoid the *blameworthy action itself* (betrayal) while retaining one's *actual reasons and character*."                                | "Responsibility requires *actual sourcehood*. What matters is whether the *actual action* (betrayal) flowed from W's authentic reasons, *not* whether she could have acted differently *with the same will*." | **Whether avoidability of the *concrete wrongful act* is essential, or whether sourcehood in the actual sequence suffices.** |
  | **2.3 Is blame defeated if the only alternatives involve compromised will?** | "Yes. If the *only* nearby worlds where W avoids betrayal are worlds where her will is manipulated (by Regent), she lacked *robust control*. Her actual ownership does not compensate for this lack." | "No. Responsibility is grounded in the *actual history* of the action. The mere *existence* of counterfactual manipulation blocking alternatives does not diminish actual control or ownership." | **Whether the *robustness* of avoidability (i.e., alternatives existing under the agent's *own* guidance) is necessary for control.** |
  | **2.4 Does the Regent case covertly assume determinism?**                    | "If the case assumes determinism, W’s responsibility is undermined *independently* by the absence of libertarian free will. If indeterminism holds, W *might* have refrained without manipulation, preserving an alternative." | "The case is compatible with indeterminism. Even if W’s choice was undetermined, the Regent’s setup ensures she *would* have been manipulated had she wavered. This *modal fact* blocks alternatives regardless of determinism." | **Whether the Regent scenario *inherently* precludes robust alternatives, or if this depends on the background metaphysics of free will.** |

  ---

  ### 3. Evidentiary Tests & Predictions  
  For each crux, we identify agreed-upon cases/arguments bearing upon it and our predictions:  

  - **Crux 2.1/2.2 (Robust Alternatives vs. Sourcehood):**  
    *Test Case:* **"The Unflickerable Resolve"**: An agent with unwavering character (e.g., a saintly person who would never commit murder) in a Frankfurt-style scenario.  
    - *Defender Predicts:* If such an agent is deemed responsible despite lacking *any* alternatives (due to character + intervener), this supports the Proponent.  
    - *Proponent Predicts:* Responsibility obtains here; the defender must either deny responsibility (counterintuitive) or concede sourcehood suffices.  
    - *Joint Stipulation:* **"If robust alternatives exist in Unflickerable Resolve, the Defender gains; if responsibility holds without *any* alternatives, the Proponent gains."**  

  - **Crux 2.3 (Robustness of Avoidability):**  
    *Test Case:* **"The Untriggered But Necessary Manipulator"**: Identical to Regent, but where W’s *actual* resentment was *causally necessitated* by earlier, undetected manipulation (though she experiences it as authentic). The Regent remains inert.  
    - *Defender Predicts:* Responsibility is undermined; actual sourcehood was compromised.  
    - *Proponent Predicts:* Responsibility *may* be undermined, but *only* if the *actual sequence* manipulation is exposed. The mere *counterfactual* Regent remains irrelevant.  
    - *Joint Stipulation:* **"If responsibility is defeated solely by the counterfactual Regent (without actual manipulation), the Defender gains ground. If defeat requires *actual sequence* manipulation, the Proponent gains."**  

  - **Crux 2.4 (Determinism & Modal Blocking):**  
    *Test Argument:* **"Indeterministic Regent"**: Assume indeterminism is true. Could W have *randomly* refrained without triggering the Regent?  
    - *Defender Predicts:* Yes; indeterminism allows this possibility, preserving a robust alternative.  
    - *Proponent Predicts:* No; the Regent is stipulated to detect *any* sign of wavering (including random neural fluctuations) and intervene *before* a refraining decision materializes.  
    - *Joint Stipulation:* **"If indeterminism allows for unmanipulated refraining in Regent-like cases, the Defender gains; if the intervener’s setup *guarantees* no such alternative exists regardless of indeterminism, the Proponent gains."**  

  ---

  ### 4. Verbal Dispute Analysis  
  A portion of our disagreement is verbal, concerning the *analysis* of "could have done otherwise" (CDO):  
  - **Verbal Element:** The Defender analyzes CDO as requiring access to an alternative *action* (not-betrayal) *explicable by the agent’s actual reasons/character*. The Proponent analyzes CDO more minimally (e.g., as the abstract possibility of a different action occurring, regardless of source).  
  - **Why Verbal?** If both adopt the *Defender’s* analysis of CDO ("robust CDO"), the Proponent would *agree* CDO is absent in Regent but *deny* it is necessary. If both adopt the *Proponent’s* analysis ("minimal CDO"), the Defender would *agree* minimal CDO exists but *deny* it suffices.  
  - **Residual Non-Verbal Disagreement:** Even after disambiguation, we disagree on **whether the absence of *robust* alternative possibilities (i.e., alternatives under the agent’s own guidance) is incompatible with moral responsibility, *even when actual sourcehood is satisfied***. This reflects a deeper divide about the nature of control: is it essentially *actual-source-based* or *alternative-possibilities-based*?  

  ---

  **Conclusion of Joint Statement:**  
  We concur on the structure of the problem, the mechanics of the Regent case, and core conditions for responsibility. Our irreconcilable disagreement centers on whether robust avoidability of the wrongful act is a necessary condition for blameworthiness when the agent is the actual source of her action. This document clarifies the locus of our dispute for scholarly and literary engagement.  

  Signed,  
  **[Name of Defender]**  
  **[Name of Proponent]**  

  ---

  **Document Notes for the Novelist:**  
  - **Tone:** Formal, precise, scrupulously neutral. Uses "we" only in agreed sections (Section 1). Disagreements (Section 2) use direct quotes attributed to each philosopher’s voice.  
  - **Structure:** Follows your requested format exactly. The "Evidentiary Tests" (Section 3) provide narrative hooks for future philosophical scenes/debates.  
  - **Cruxes:** Each row in the table isolates a specific conceptual hinge. The "Regent" case remains the central example, but the tests extend the argument organically.  
  - **Verbal Dispute:** Explicitly separates terminological from substantive disagreement, leaving the core metaphysical conflict intact.  

  This document provides the rigorous foundation your philosophers require, leaving their fiery dialogues to unfold from these defined premises.
