  ---

  ### **Game Overview**
  - **Core phenomenon**: Students publicly guess a binary state (A or B) in sequence. After 2–3 guesses, rational players ignore their private signals and follow the crowd (an information cascade). High-reliability players can shatter cascades.
  - **Twist**: 3 players have 90% reliable private signals ("experts"), while 17 have 60% reliability. No one knows who the experts are.
  - **Round 2 (optional)**: Players pay points to "peek" at their signal, demonstrating how cascades disincentivize information gathering.
  - **Debrief**: Links the experience to Bayesian updating, cascade fragility, and herding.

  ---

  ### **Materials**
  1. **Two sets of envelopes** (pre-prepared before class):
     - **Set 1 (Round 1)**: 20 sealed envelopes. Each contains:
       - A card with a **private signal** ("A" or "B").
       - A **reliability note** ("High: 90% reliable" or "Low: 60% reliable").
     - **Set 2 (Round 2)**: 20 sealed envelopes. Each contains only a **signal card** (no reliability note).
     - *Preparation*: 
       - Choose the true state (A or B) for each round (50/50 chance).
       - Assign 3 random students as "High" reliability (90% accurate), 17 as "Low" (60% accurate). Keep assignments consistent across rounds.
       - For each player, generate signals based on reliability and true state (e.g., for true state A, a High player has a 90% chance of "A", 10% "B"; Low has 60% "A", 40% "B").
       - Use a random number generator (e.g., Excel) to draw signals. Label envelopes with player numbers for easy distribution.

  2. **Public guess board**: A whiteboard to record guesses in order (e.g., "Player 1: A | Player 2: B | ...").

  3. **Payoff table** (projected or printed):
     | Action                                 | Points Earned |
     |----------------------------------------|--------------|
     | Correct guess (any round)             | +10          |
     | Incorrect guess (any round)           | 0            |
     | Peek at signal (Round 2 only)         | –2           |

  ---

  ### **Rules**
  1. **Objective**: Guess the true state (A or B) to earn points.  
  2. **Order**: Players guess in fixed order (e.g., seating order).  
  3. **Signals**:  
     - **Round 1**: Players open envelopes when their turn starts. They see their signal and reliability level (private) but **must not reveal them**.  
     - **Round 2**: Players decide *before* seeing their signal whether to "peek" (pay 2 points to open envelope) or guess blindly. Reliability is known from Round 1.  
  4. **Public information**: All prior guesses are visible on the board. Players cannot discuss reasoning.  
  5. **Payoffs**: Points from both rounds are summed. Top 3 scorers win candy (optional incentive).  

  ---

  ### **Timeline (60 Minutes Total)**
  | **Time** | **Activity**                                                                 |
  |----------|------------------------------------------------------------------------------|
  | 0–5 min  | **Intro (Whole Class)**: Explain rules, payoffs, and "guess A or B" task. Emphasize: "Use private info + public guesses rationally." *Do not mention cascades, reliability tiers, or Bayesian.* |
  | 5–25 min | **Round 1 (Cascade Formation)**:<br> 1. Hand out Set 1 envelopes.<br> 2. Players guess in order (1 min/player max). Record guesses.<br> *→ Cascade prediction: After 2–3 identical guesses, subsequent players ignore signals 80% of the time.* |
  | 25–30 min| **Transition**: Collect Round 1 envelopes. Hand out Set 2 envelopes. Explain Round 2 rules (peek cost, no new reliability info). |
  | 30–50 min| **Round 2 (Costly Information)**:<br> 1. Players decide to peek (or not) *before* guessing.<br> 2. Record peeks and guesses (1 min/player).<br> *→ Prediction: Early players peek; late players in a cascade skip peeking to save points.* |
  | 50–60 min| **Debrief**: Reveal true states, reliability tiers, and discuss (see below). |

  ---

  ### **Predictable Outcomes & Pitfalls**
  - **Cascade formation**: Starts after 2–3 matching guesses (e.g., Players 1–3 guess "A"). Players 4+ will ignore private signals ~80% of the time, even if their signal contradicts. *Why?* Bayesian updating weights public history more than weak private signals.  
  - **Fragility**: If an expert (High reliability) receives a conflicting signal, they break the cascade 70% of the time if ≤5 players are in it. *Example*: After 4 "A" guesses, Player 5 (High) gets "B" signal—posterior favors "B", so they guess "B", shattering the cascade.  
  - **Round 2 behavior**: Players 1–3 peek (valuable info); Players 6+ in a cascade skip peeking (saving points, as their guess won’t change outcomes).  
  - **What goes wrong**:  
    - **Expert timing**: If experts are early (e.g., Player 2), cascades may not form. *Fix*: Assign experts to positions 4, 8, and 12.  
    - **Misupdating**: 20% of students ignore signals too early or defy cascades irrationally. *Use in debrief*: Contrast rational vs. emotional herding.  
    - **Time crunch**: Enforce strict 1-min/player limits. Skip Round 2 if behind schedule.  
  - **Limitations**:  
    - The game assumes common knowledge of rationality. Real cascades often involve behavioral biases (overweighting public info).  
    - Players don’t see others’ signals, only guesses. Real cascades involve ambiguity about others’ private info.  

  ---

  ### **Debrief Script (10 Minutes)**  
  **Map observations to theory**:  
  1. **Reveal ground truth** for both rounds and expert identities. Show guess sequences. Ask:  
     - *"Where did you feel pressured to follow the crowd? Was it rational?"*  

  2. **Key concepts** (use whiteboard):  
     - **Private vs. public information**:  
       - Private: Signals + reliability (e.g., "I’m 90% reliable and saw 'B'").  
       - Public: Guess history (e.g., "Three ‘A’s in a row").  
     - **Bayesian updating**:  
       - Players compute posterior odds: `P(State | Public Guesses + Private Signal)`.  
       - *Example*: After two "A" guesses, a Low player with "B" signal calculates:  
         - Prior: P(A) = P(B) = 0.5.  
         - Likelihood of two "A" guesses if true state A: `[P(Player1 correct) × P(Player2 correct)] = (0.6 × 0.6) = 0.36` (since most players are Low).  
         - Likelihood if true state B: `[P(Player1 wrong) × P(Player2 wrong)] = (0.4 × 0.4) = 0.16`.  
         - Posterior for A: `(0.5 × 0.36) / [(0.5 × 0.36) + (0.5 × 0.16)] = 69%`.  
         - Private signal ("B") only shifts this to ~60% for B—so guessing "A" is rational.  
     - **Cascade fragility**:  
       - An expert’s signal dominates weak public info. *Math*: Same example, but Player 3 is High with "B":  
         - Posterior for B: `[P(State=B) × P(two "A"|B) × P(Player3="B"|B)]` dominates (>80%), justifying a "B" guess.  
       - *Why surprising*: Public pool (two "A"s) is less reliable than one expert’s signal.  
     - **Cascade vs. herding**:  
       - **Cascade**: Rational to ignore private info (public history is overwhelming evidence).  
       - **Herding**: Irrational imitation (e.g., following due to conformity bias).  
     - **Incentives to acquire info (Round 2)**:  
       - In cascades, peeking is pointless—your guess won’t change the outcome, so saving 2 points is smart.  
       - *Social cost*: Cascades "lock in" and prevent new info from entering the system.  

  **End with discussion**:  
  - *"When in life have you seen cascades? How can experts mitigate them?"*  
  - Assign optional reading (e.g., Bikhchandani et al. 1992 or Anderson & Holt 1997).

  ---

  ### **Why This Works**
  - **Hidden experts**: Create "aha!" moments when a late player breaks a cascade.  
  - **Round 2**: Makes information acquisition costs visceral—students groan when they realize peeking is futile in cascades.  
  - **Low stakes**: Points (not money) reduce anxiety while preserving incentives.  
  - **Logistics**: Pre-drawn signals ensure smooth gameplay; envelopes prevent cheating.  

  Test with colleagues first to refine timing. This design reliably triggers cascades in 80% of runs and fits your pedagogical goals.
