prompt: |-
  I'm a software engineer by training and have been drafted to write the take-home final for an upper-level seminar on pain, mind, and medicine that I help run; my formal philosophy background is thin, so I'd like the deliverables spelled out precisely.

  Please write one essay question on pain asymbolia and the badness of pain, pitched so that it cannot be answered by reciting the standard sensory/discriminative-versus-affective/motivational distinction. The crux I want it to force is whether the badness of pain is intrinsic to how pain feels or is instead carried by a component that can come apart from the sensation — and students should have to commit to one side and say what would count as evidence against it, since the clinical evidence here is thin.

  To keep it from being a memory test, build the question around three stipulated cases rather than around the literature, and make the question itself say plainly that all three are stipulated and not descriptions of any documented patient: (A) a patient with intact detection and discrimination who rates noxious stimuli at full intensity, describes them accurately, and shows normal withdrawal, yet reports no distress and will leave a hand on a hot plate while chatting; (B) a patient with minimal nociceptive sensitivity who nonetheless reports being consumed by unbearable suffering and begs for relief; (C) a patient who reports full intensity and full distress but takes no action to escape the stimulus and shows no anticipatory avoidance.

  Then give me (i) a model answer of roughly 700 words, and (ii) a marking scheme worth 20 marks, organised as five must-hit points, each with its mark value and a one-line note naming the specific mistake that should cost a student marks. Please also state which single move separates an A answer from a B answer. In the model answer and the scheme, mark clearly which claims are settled among people who work on this topic and which are genuinely contested, and do not present a contested reading as the consensus.
