  Watch the traps: Lawyers will pounce on any implied weakness. Must avoid phrases like "give up" or "loss." Scientists need ecological credibility. Families need to feel their pride is seen. Hence stressing "choice," "design," and the trust's need for authentic outcomes (not "killing a town").

  Word count pressure: Every sentence must multitask. The reef description ("living library...") establishes gravity quickly. "Currency of care" subtly replaces monetary terms. Final line about "holding more" loops back to the thesis without using banned words.

