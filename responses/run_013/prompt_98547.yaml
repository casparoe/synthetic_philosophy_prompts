  We are drafting a joint statement for an adversarial collaboration between two positions on Bernard Williams's integrity objection and the "one thought too many" complaint. The two positions are:

  - The integrity theorist (Williams-style critic of impartialist ethics)
  - The systematizer (impartialist)

  The document is a working document: dense, unsentimental, and written so that each side can sign without having conceded anything they do not actually believe.

  Structure:

  1. **Agreed Claims (numbered)**
     - About the case: a man on a pier, two people drowning, time to save only one, he saves his wife.
     - What the case is and is not evidence for.
     - Distinction between theory of justification and theory of deliberation.
     - What neither party is committed to.
     - What would count as a decisive objection to the integrity objection.

  2. **Disagreements** 
     - Each formulated in wording its own side would accept. State the exact point of divergence.

  3. **Cruxes** (sub-questions that would move at least one side if settled)
     - At least three: 
       (a) whether the objection concerns occurrent thoughts or the reasons a theory recognises;
       (b) whether integrity is a value commensurable with impartial moral demands or a precondition of agency;
       (c) whether the case has force against a theory whose holder's ground project is impartiality itself.
     - May add others.

  4. **For each crux, a test case, argument, or construction that both sides agree in advance would bear on it, with each side's prediction.**
     - If no such test exists, explain why.

  5. **Cases that neither side may treat as already settled** (do not recycle usual illustrations)
     - Include:
       (a) The coached rescuer: agent trained so the licensing thought occurs smoothly and would have made no difference.
          Question: does the objection turn on the presence of the thought or its causal role?
       (b) The converted impartialist: agent whose ground project is impartiality.
     - One of your own devising: to isolate whether the complaint is about the reason or the reasoning.

  6. **Closing section** 
     - Separate verbal disputes (turning on definitions of thought, reason, integrity) from substantive residue.
     - For the substantive residue, state what each side would have to concede to be moved.

  The statement must be self-contained: no citations, no reading list, no appeals to authority. Every distinction introduced and explained within the document.

  Let's begin drafting.

  ---

  **Joint Statement: Adversarial Collaboration on the Integrity Objection**

  **1. Agreed Claims**

  Both parties agree on the following:

  1.1. **The Case**: In the scenario described, a man is on a pier and sees two people drowning. He has time to save only one. He saves his wife. This action is, in some sense, justified.

  1.2. **What the Case Shows**: The case demonstrates that, in such a situation, saving one's spouse without first consulting an impartial moral principle is not only psychologically typical but also morally acceptable. It is evidence that some actions are justified by the agent's personal commitments without requiring an impartial justification at the moment of action.

  1.3. **What the Case Does Not Show**: The case, by itself, does not prove that impartial moral theories (such as utilitarianism or Kantianism) are false. Nor does it show that all moral decisions must be made without reference to impartial principles. It is a specific counterexample to the idea that every morally justified action must be explicitly licensed by an impartial principle at the moment of action.

  1.4. **Distinction Between Justification and Deliberation**: 
     - A theory of *justification* provides an account of why an action is right or wrong, what reasons count in its favor, and how they are structured.
     - A theory of *deliberation* provides an account of how an agent should think when deciding what to do, including what thoughts should occur and in what order.
     - It is possible for a theory to be correct about justification without requiring that the justification be explicitly represented in the agent's deliberation.

  1.5. **What Neither Party is Committed To**:
     - The integrity theorist is not committed to the view that impartial moral theories are never correct in other contexts, or that personal commitments always override impartial demands.
     - The systematizer is not committed to the view that agents must always consciously rehearse impartial principles in deliberation, or that personal commitments are morally irrelevant.

  1.6. **Decisive Objection to the Integrity Objection**: A decisive objection to the integrity objection would have to show that the alienation of the agent from their ground projects is either (a) not a genuine cost, (b) not caused by impartial moral theories, or (c) is outweighed by other considerations in a way that the integrity objection fails to account for. A mere restatement of the impartialist position (e.g., "but the impartial principle is still the correct standard of justification") does not count as a decisive objection.

  **2. Disagreements**

  Each party states their view in their own terms, with the exact point of divergence.

  2.1. **Integrity Theorist's View**: 
     "The integrity objection shows that impartial moral theories, by requiring that the agent's personal commitments (such as saving one's wife) be licensed by an impartial principle, alienate the agent from their ground projects. This alienation is a deep moral cost because it undermines the agent's ability to live a meaningful life. The 'one thought too many' complaint is not merely about the psychological occurrence of a thought but about the structure of reasons that the theory endorses: if the reason for saving the wife must be that she is his wife *and* that this is impartially permitted, then the theory has failed to capture the non-instrumental value of the personal relationship. The point of divergence is whether the requirement of impartial licensing, even if not occurrent in deliberation, changes the nature of the agent's reasons in a way that is alienating."

  2.2. **Systematizer's View**:
     "The integrity objection mistakes a theory of justification for a theory of deliberation. A sound impartial moral theory can acknowledge that the agent's immediate reason for saving his wife is simply that she is his wife, and that no occurrent thought about impartial principles is needed. The justification for this reason lies in the impartial principle, but this does not entail that the agent must think about it. The 'one thought too many' is a psychological artifact, not a flaw in the theory. The point of divergence is whether the mere fact that an impartial principle is the ultimate justifier of the personal reason implies that the agent's commitment to the personal relationship is thereby conditional or alienated."

  **3. Cruxes**

  The following sub-questions, if settled, would move at least one side:

  3.1. **Crux A: Occurrent Thoughts vs. Reasons Recognised**  
     Does the integrity objection primarily concern the presence of occurrent thoughts in deliberation, or does it concern the structure of reasons that the theory recognises (i.e., whether the personal reason is derivative of an impartial one)?

  3.2. **Crux B: Nature of Integrity**  
     Is integrity a value that can be weighed against impartial moral demands (and sometimes outweighed), or is it a precondition of there being an agent who can be addressed by moral demands at all?

  3.3. **Crux C: The Converted Impartialist**  
     Does the integrity objection retain its force against a moral theory when the agent's own ground project is the impartial project itself (e.g., a utilitarian whose deepest commitment is to maximizing utility)?

  3.4. **Additional Crux D: The Role of Alienation**  
     Is the alienation of the agent from their ground projects a contingent psychological effect (which might be avoidable in a well-trained agent) or a necessary feature of the theory's structure of reasons?

  **4. Tests for Each Crux**

  For each crux, we describe a test that both sides agree would bear on it, and each side's prediction.

  4.1. **Test for Crux A: The Coached Rescuer**  
     *Case*: An agent has been trained (coached) so that, in the drowning scenario, the thought "saving my wife is impartially permitted" occurs to him smoothly and without any feeling of conflict, and it would not have changed his action even if it hadn't occurred. The agent still saves his wife because she is his wife.  
     *Question*: Does the integrity objection still apply?  
     - *Integrity theorist's prediction*: Yes, because the objection is not about the psychological occurrence but about the reason being derivative. The reason "because she is my wife" is now held only because it is impartially licensed, which undermines the non-instrumental value of the commitment.  
     - *Systematizer's prediction*: No, because the occurrent thought is not required and the agent acts for the same immediate reason as an uncoached agent. The objection turns on the presence of a disruptive thought, which is absent here.  
     *Both agree that this test bears on whether the objection is about occurrent thoughts or the structure of reasons.*

  4.2. **Test for Crux B: The Value of Integrity**  
     *Case*: Consider an agent who faces a choice between acting on a ground project (which is central to their integrity) and fulfilling an impartial demand that is extremely weighty (e.g., preventing a catastrophe). The agent chooses the impartial demand, but at the cost of their integrity.  
     *Question*: Is the loss of integrity in this case a moral cost that must be accounted for in the theory (even if outweighed), or is it not a moral cost at all because integrity is not a value to be weighed?  
     - *Integrity theorist's prediction*: The loss of integrity is a genuine moral cost, even if outweighed. The theory must account for it as a cost.  
     - *Systematizer's prediction*: Integrity is not a separate moral value to be weighed; it is at best a condition for effective agency. The loss of integrity is a psychological or practical cost, not a moral one. The theory only needs to account for the impartial reasons.  
     *Both agree that this test bears on whether integrity is a commensurable value or a precondition.*

  4.3. **Test for Crux C: The Converted Impartialist**  
     *Case*: An agent whose ground project is impartiality itself (e.g., a dedicated utilitarian). In the drowning scenario, they save their wife because they recognize that the partial reason is impartially sanctioned (e.g., because general utility is promoted by such partiality).  
     *Question*: Does the integrity objection apply to this agent?  
     - *Integrity theorist's prediction*: No, because there is no alienation: the agent's ground project is impartiality, so the requirement of impartial licensing does not conflict with their projects. The objection only applies when the agent's ground projects are non-impartial.  
     - *Systematizer's prediction*: The objection does not apply to any agent who holds the impartial theory, because the theory is not alienating if it is the agent's own project. But note: the systematizer also holds that the objection fails in general.  
     *Both agree that this test bears on whether the objection requires a conflict between the agent's ground projects and the impartial theory.*

  4.4. **Test for Crux D: The Role of Alienation**  
     *Case*: Consider two societies: 
     - Society A: Impartial moral theory is taught in a way that fully integrates personal commitments, so agents never feel alienated.
     - Society B: The same theory is taught in a way that creates widespread alienation from personal projects.  
     *Question*: If the theory is the same, is the alienation in Society B a flaw in the theory or a contingent effect of how it is taught?  
     - *Integrity theorist's prediction*: The alienation in Society B is a flaw in the theory because the theory's structure of reasons necessarily makes personal commitments conditional, which is alienating. Society A might avoid the feeling of alienation by not making the conditionality salient, but the conditionality is still there.  
     - *Systematizer's prediction*: The alienation in Society B is a contingent effect of teaching, not a flaw in the theory. Society A shows that the theory can be held without alienation.  
     *Both agree that this test bears on whether alienation is necessary or contingent.*

  **5. Cases Not Settled**

  The following cases are to be considered open by both sides and not pre-judged:

  5.1. **The Coached Rescuer** (as described in 4.1): This case tests whether the objection turns on the presence of the thought or on the structure of reasons.

  5.2. **The Converted Impartialist** (as described in 4.3): This case tests whether the objection applies when the agent's ground project is impartiality.

  5.3. **The Unlicensed Project** (devised case): 
     *Case*: An agent has a ground project that is central to their identity but is not impartially licensed (e.g., a project that, in some circumstances, would require neglecting impartial demands). The agent acts on this project without any occurrent thought of impartial licensing, but the systematizer's theory says that the action is wrong because it lacks impartial justification.  
     *Question*: Is the complaint here about the reason (that the theory does not recognise the project-based reason as having independent weight) or about the reasoning (that the agent should not have to think about impartial justification)?  
     - This case isolates whether the core complaint is about the theory's rejection of the reason (substantive) or about the requirement to deliberate in a certain way (procedural).

  **6. Closing: Verbal Disputes and Substantive Residue**

  6.1. **Verbal Disputes**: 
     - The term "thought" may refer to an occurrent mental state or to the reason that the agent endorses. The parties agree that if the dispute is only about whether an occurrent thought is required, that is a verbal dispute about the theory of deliberation, not about the structure of reasons.
     - The term "integrity" may refer to either (a) a state of psychological wholeness, (b) a virtue of adhering to one's values, or (c) the condition of having and acting on ground projects. We use it in sense (c).
     - The term "reason" may refer to a consideration that justifies an action or to the agent's motivating consideration. We distinguish them as "justifying reason" and "motivating reason".

  6.2. **Substantive Residue**:
     The core substantive disagreement is whether an impartial moral theory, by making personal reasons derivative of impartial ones, undermines the non-instrumental value of personal commitments and thereby alienates the agent.

     - For the integrity theorist to be moved, they would have to be shown that the derivative status of personal reasons does not in fact undermine their non-instrumental value, or that such alienation is not a moral cost.
     - For the systematizer to be moved, they would have to be shown that the requirement of impartial licensing does necessarily change the nature of personal commitments (making them conditional) in a way that is alienating, and that this is a moral flaw in the theory.

  Signed:  
  [Integrity Theorist]  
  [Systematizer]

