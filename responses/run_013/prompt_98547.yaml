answer: |-
  ### Joint Statement: Adversarial Collaboration on the Integrity Objection  

  #### 1. Agreed Claims  
  Both parties accept the following:  

  1.1. **The Case**: A man stands on a pier where two people are drowning. He can save only one. He saves his wife. This action is justified, but the justification does not require him to consciously consult an impartial moral principle (e.g., utilitarianism or Kantianism) at the moment of action.  

  1.2. **What the Case Is Evidence For**:  
     - It shows that some morally justified actions arise directly from personal commitments (e.g., marital bonds) without requiring occurrent deliberation about impartial principles.  
     - It illustrates that requiring explicit appeal to an impartial principle *during deliberation* can seem morally excessive or incongruous ("one thought too many").  

  1.3. **What the Case Is Not Evidence For**:  
     - It does not prove impartialist ethics (e.g., utilitarianism, Kantianism) is false.  
     - It does not show that personal commitments always override impartial demands.  
     - It does not demonstrate that impartialist theories inherently demand occurrent deliberation.  

  1.4. **Theory of Justification vs. Theory of Deliberation**:  
     - A *theory of justification* explains why an action is right/wrong, appealing to objective reasons.  
     - A *theory of deliberation* explains how agents should think when deciding to act, including mental processes.  
     - A theory can be correct about justification without prescribing occurrent thoughts in deliberation.  

  1.5. **What Neither Party is Committed To**:  
     - The integrity theorist is not committed to rejecting all impartial demands.  
     - The systematizer is not committed to requiring agents to consciously rehearse impartial principles in every deliberation.  
     - Neither claims the drowning case generalizes to all moral decisions.  

  1.6. **Decisive Objection to the Integrity Objection Defined**:  
     A decisive objection must show one of the following:  
     - The "alienation" of agents from their ground projects is not a genuine moral cost.  
     - Impartialist theories do not cause this alienation.  
     - The cost of alienation is outweighed by the benefits of impartialism in a way the objection ignores.  
     A restatement of impartialism (e.g., "the impartial principle justifies the act") is not decisive.  

  ---

  #### 2. Disagreements  
  Each view is stated as its proponent would affirm it, with the exact point of divergence noted.  

  2.1. **Integrity Theorist's View**:  
     "The integrity objection reveals that impartialist ethics, by requiring personal reasons (e.g., saving one's wife) to be licensed by an impartial principle, alienates agents from their ground projects. This alienation is a structural flaw: it treats personal commitments as conditional on impartial approval, undermining their non-instrumental value. The 'one thought too many' complaint is not about psychology alone but about the theory’s failure to recognize that some reasons must be non-derivative to preserve integrity.  
     **Point of Divergence**: Whether the *derivative status* of personal reasons under impartialism inherently alienates agents."  

  2.2. **Systematizer's View**:  
     "The integrity objection conflates justification with deliberation. Impartialism can hold that the agent's reason for saving his wife is simply 'she is my wife,' while the impartial principle *justifies* this reason without needing to be occurrent in deliberation. The 'one thought too many' is a red herring; it reflects a psychological picture of deliberation that impartialism need not endorse. Alienation is avoidable if the theory is internalized correctly.  
     **Point of Divergence**: Whether the mere fact that personal reasons are *justified* by impartial principles (even if not deliberatively occurrent) constitutes alienation."  

  ---

  #### 3. Cruxes  
  Sub-questions that would move at least one side if resolved:  

  3.1. **Crux A: Occurrent Thoughts vs. Reasons Recognized**  
     Does the objection target (a) occurrent thoughts in deliberation, or (b) the theory’s insistence that personal reasons are valid only if impartially justified?  

  3.2. **Crux B: Nature of Integrity**  
     Is integrity (a) a value commensurable with impartial demands (so it can be traded off against them), or (b) a precondition for agency (so it cannot be overridden without destroying the agent’s capacity to respond to morality)?  

  3.3. **Crux C: The Converted Impartialist**  
     Does the objection apply to an agent whose ground project *is* impartiality (e.g., a utilitarian whose core commitment is maximizing utility)?  

  3.4. **Crux D: Alienation as Contingent or Necessary**  
     Is alienation (a) a contingent psychological effect of how impartialism is taught, or (b) a necessary consequence of its structure of reasons?  

  ---

  #### 4. Tests for Cruxes  
  For each crux, a test case/argument both accept as probative, with predictions.  

  4.1. **Test for Crux A: The Coached Rescuer**  
     - *Case*: An agent is trained to have the thought "saving my wife is impartially permitted" occur smoothly during the drowning scenario. The thought causes no conflict and would not alter his action if absent. He saves his wife solely because she is his wife.  
     - *Question*: Does this redeem the action under impartialism?  
       - **Integrity theorist's prediction**: No. The objection persists because the reason "she is my wife" is still derivative; the thought’s presence (however smooth) reveals the reason’s conditional status, eroding non-instrumental commitment.  
       - **Systematizer's prediction**: Yes. The objection hinges on disruptive psychology; here, the thought is non-alienating and deliberation is seamless. If the action is unchanged, no integrity is lost.  
     - *Why probative*: Isolates whether alienation stems from occurrent thoughts (systematizer) or the reason’s structure (integrity theorist).  

  4.2. **Test for Crux B: The Catastrophe Choice**  
     - *Case*: An agent must abandon their ground project (e.g., being a musician) to prevent a catastrophe (e.g., a nuclear disaster). They choose impartially, losing their integrity.  
     - *Question*: Is the integrity loss a distinct moral cost?  
       - **Integrity theorist's prediction**: Yes. Integrity is a precondition of agency; its loss is a moral cost even if outweighed. The theory must register it.  
       - **Systematizer's prediction**: No. Integrity is not commensurable; it is a practical condition for agency but not a moral value. Only impartial costs (e.g., lives lost) matter.  
     - *Why probative*: Tests if integrity is a value to be weighed or a non-negotiable foundation.  

  4.3. **Test for Crux C: The Converted Impartialist**  
     - *Case*: An agent’s ground project is impartiality (e.g., a utilitarian activist). In the drowning scenario, they save their wife solely because partiality maximizes utility long-term.  
     - *Question*: Is this agent alienated?  
       - **Integrity theorist's prediction**: No. The objection lapses because the agent’s project aligns with impartialism; no conflict exists.  
       - **Systematizer's prediction**: The objection never applies, but here it clearly fails. Alienation requires a conflict between projects and theory, which is absent.  
     - *Why probative*: Reveals if the objection depends on a clash with non-impartial projects.  

  4.4. **Test for Crux D: The Two Societies**  
     - *Case*: Society A teaches impartialism integrated with personal commitments (no alienation). Society B teaches the same theory in a way that induces widespread alienation.  
     - *Question*: Is alienation in Society B a flaw in the theory or its teaching?  
       - **Integrity theorist's prediction**: A flaw in the theory. The structure of reasons (making personal commitments conditional) inherently risks alienation; Society A masks this but doesn’t eliminate it.  
       - **Systematizer's prediction**: A flaw in teaching. The theory is consistent with non-alienated agents; Society A proves this.  
     - *Why probative*: Distinguishes contingent psychology from structural incompatibility.  

  ---

  #### 5. Cases Not Settled  
  New cases both sides agree are unresolved:  

  5.1. **The Coached Rescuer** (as in 4.1):  
     - Tests if the objection targets occurrent thoughts (systematizer) or the reason’s derivative status (integrity theorist).  

  5.2. **The Converted Impartialist** (as in 4.3):  
     - Tests if the objection applies when the agent’s ground project is impartiality.  

  5.3. **The Silent Project** (Devised Case):  
     - *Case*: An agent has a ground project (e.g., preserving a rare art form) that requires neglecting an impartial demand (e.g., diverting funds from famine relief). They act on their project without any occurrent thought of impartial justification. The impartialist theory condemns the act as unjustified.  
     - *Question*: Is the complaint here about the theory’s rejection of the reason (it refuses to recognize project-based reasons as non-derivative) or the deliberation (it demands the agent consider impartiality)?  
     - *Purpose*: Isolates whether the core grievance is about reasons (substantive) or reasoning (procedural). If the objection holds even when deliberation is "silent," it targets the theory’s account of reasons.  

  ---

  #### 6. Closing: Verbal Disputes and Substantive Residue  

  6.1. **Verbal Disputes**:  
     - **"Thought"**: Refers to occurrent mental states (systematizer) vs. endorsed reasons (integrity theorist). If settled as "occurrent," it favors systematizer; if as "reason," it favors integrity theorist.  
     - **"Integrity"**: As commensurable value (systematizer) vs. precondition of agency (integrity theorist).  
     - **"Reason"**: Distinguish *motivating* (what moves the agent) from *justifying* (what makes the act right). Both agree the drowning case involves motivating reasons like "she is my wife," but disagree on whether justifying reasons must be impartial.  

  6.2. **Substantive Residue**:  
     - The core disagreement is whether impartialism, by making personal reasons derivative, necessarily undermines the non-instrumental character of ground projects, alienating agents.  
     - **To move the integrity theorist**: Show that derivative status does not erode non-instrumental commitment, or that alienation is not a moral cost.  
     - **To move the systematizer**: Show that derivative status *does* make commitments conditional (even with seamless deliberation), and that this is a moral flaw.  

  ---  
  Signed,  
  **The Integrity Theorist**  
  **The Systematizer**  

  Date: [Insert Date]
