answer: |-
  ## The Iron Argument  
  *(for Max Black's Spheres)*  

  This iron is so purely wrought  
  no seam betrays its birth.  
  This iron feels no flaw of thought,  
  no fracture in its worth.  

  It rests where only distance speaks  
  in miles of empty air.  
  It holds what no description seeks  
  and finds no difference there.  

  It shares its cold, unmarked repose  
  with one whose form it wears.  
  The space between them only shows  
  the vacancy it shares.  

  To shift their places, turn them round –  
  a gesture without trace.  
  The ground where neither can be found  
  retains the self-same face.  

  Each sphere defines the point it keeps  
  by reference to the same:  
  One mile from where its likeness sleeps,  
  yet bears that other's name?  

  The world insists on separate things,  
  the principle demands one core.  
  This perfect doubling strains the strings  
  that hold the number…  

  … two?  

  ---

  **Where Symmetry Bites & Where it Echoes:**  

  The swap-invariance rule is **load-bearing** most critically in lines describing the spheres' properties and relations. Phrases like "This iron" (lines 1 & 3), "It rests" (line 5), "It holds" (line 7), "It shares" (line 9), "Each sphere" (line 17), and "One mile from where its likeness sleeps" (line 19) are forced by the rule to use language applicable identically to *both* spheres. This prevents smuggling in any intrinsic difference or relational property that asymmetrically picks one out (e.g., "the *nearer* sphere," "the *first* one cast"). The rule *makes* the poem enact the indiscernibility Black describes. The core relational discernibility move ("each is a mile from *the other*") is hinted at in line 19 ("One mile from where its likeness sleeps"), but crucially, the phrase "its likeness" applies equally to both – neither is singled out as "the other" uniquely. The symmetry forces ambiguity: does "its likeness" refer to the identical twin, or imply self-reference?  

  The rule functions more as a **stylistic echo** in the poem's structure and mood. The repetition ("This iron," "It rests," "It holds"), the mirrored phrasing ("no seam betrays its birth" / "no fracture in its worth"), the circular doubt ("shift their places... gesture without trace"), and the relentless focus on sameness create a hypnotic, self-reflective quality. This reinforces the philosophical tension and the feeling of being trapped in the description, circling the problem without resolution, but it doesn't *enforce* a specific metaphysical constraint in these moments like it does in the direct descriptions of the spheres and their relation.  

  **The Break:**  
  The violation happens only in the final line break. The word "two" is physically fractured. Visually and rhythmically, it creates an asymmetry – the poem ends abruptly, hanging. This forces the reader to confront the *cost* of uttering "two": the clean symmetry of the preceding lines is disrupted. It enacts the moment language tries to assert plurality against the weight of perfect indiscernibility and swap-symmetry, leaving the contradiction raw and unresolved.
