  (ii) false only when Defended and not Red → Blue∩Def

  So:
  - Regions where (i) true: RedDef, BlueDef, BlueUndef
  - Regions where (ii) true: RedDef, RedUndef, BlueUndef

  Under R1: Send (i) if true, else send (ii). So:
  - In RedDef: both true → send (i) [since R1 says send (i) if true]
  - In RedUndef: (i) false → send (ii)
  - In BlueDef: (i) true → send (i)
  - In BlueUndef: both true → send (i)

