prompt: |-
  I convene a second-year undergraduate seminar in logic and philosophy of mind — eighteen students, one ninety-minute session, most of them comfortable with formal notation but none of them trained in metatheory. I want a session that makes them feel from the inside the difference between working within a formal system and reasoning about it: the point at which the only way forward is to stop applying the rules and start proving things about them — the move sometimes called jumping out of the system. I do not want that point announced in advance, and I do not want them to be handed the answer.

  Please design the session as a runnable activity rather than a lesson plan for a lecture. I am putting the system at the centre of it here, so that you need not rely on any recollection of the published version (it is Hofstadter's MIU system). The symbols are M, I and U; strings are built from them; the single starting string is MI; and there are four rules of transformation:

  1. any string ending in I may have U appended to it;
  2. a string of the form Mx may be rewritten as Mxx, that is, whatever follows the M is doubled;
  3. any occurrence of III may be replaced by U;
  4. any occurrence of UU may be deleted.

  The target is MU. The target cannot be reached: no sequence of applications of those four rules takes MI to MU. Part of what I want the students to discover is how one could possibly know such a thing, rather than merely suspect it after an hour of failure. Do not put the impossibility result in front of them at the start; but the deliverable should contain the argument by which it is established, written out in a form I can put on the board at the end and in a form I can deploy if the group stalls.

  The activity itself should include:

  - A clear set of rules, roles and materials (worksheets, rule cards, tokens — whatever you judge best) and a scoring scheme that creates a genuine pull to keep generating derivations, with a stake or prize that involves no real money. At least one target other than MU should be reachable, so that the group knows what success looks like and cannot explain its failure by insufficient effort; satisfy yourself that it really is reachable by exhibiting a derivation.
  - A social mechanism by which derivations must be certified by someone other than their author, so that the group runs into the difference between producing a string and establishing that a string is producible.
  - A minute-by-minute timeline for the ninety minutes, including a phase in which the group is genuinely stuck and a phase in which the means of escape is made available in such a way that they have to take it themselves.
  - A debrief that maps what happened onto the idea, and that ends by asking the students what kind of statement their reason for believing MU is impossible would be — whether it is one of the strings the system can generate or a statement about the system — and what would have to be true of a system for that statement to be generated inside it.
  - An honest account of what will predictably go wrong the first time (the student who finds the invariant within ten minutes; the group that brute-forces until the clock runs out; the prize claimed on a technicality; the collapse into competitive point-scoring) and what I should do about each.
  - A frank note on which feature of the idea the activity cannot reproduce, and which part of it I must therefore supply myself. I would rather have that stated plainly than have the session pretend to more than it can do.

  They should leave having felt the pull of staying inside the system, the difference between not having found something and having shown that it cannot be found, and the necessity of stepping outside — without my having named any of that at the outset. Write in British English.
reasoning: |-
  We are designing a 90-minute session for an undergraduate seminar. The goal is to let students experience the transition from working within a formal system (the MIU system) to reasoning about it (metatheory) when they get stuck. The target string MU is impossible to derive, but we don't tell them that at the start.

  Key elements:
  - The system: strings composed of M, I, U. Start: "MI". Rules:
    1. If a string ends with I, add U at the end. (xI → xIU)
    2. If a string starts with M, duplicate the rest. (Mx → Mxx)
    3. Replace III with U. (xIIIy → xUy)
    4. Remove UU. (xUUy → xy)

  - We want a runnable activity, not a lecture.
  - Students are comfortable with formal notation but not metatheory.

  Activity design:
  - We'll have a game-like setting with a scoring system to motivate derivation attempts.
  - We need at least one reachable target so they know what success looks like. Example: MIU (which is reachable: start with MI, then by rule 1, MI → MIU).
  - Social mechanism: derivations must be checked by others to ensure correctness. This introduces the distinction between producing a string and proving it's producible.
  - Timeline: 90 minutes broken into phases.

  Materials:
  - Rule cards (for reference)
  - Worksheets for writing derivations (with steps and rule applied)
  - A board to display the current state and scores.
  - Tokens or points for successful derivations and verifications.

  Roles:
  - Students work in pairs or small groups (we have 18 students, so 9 pairs or 6 groups of 3). Each group tries to derive target strings.
  - Some students (rotating) act as verifiers to check derivations.

  Scoring:
  - For each new string derived (that hasn't been derived before) and correctly verified, the deriving group gets 1 point.
  - If a group reaches a target string (we'll have several, including at least one that is reachable and MU as the ultimate one), they get bonus points (say 3 points for a pre-set target, and 5 for MU).
  - Verifiers get 0.5 points for each correct verification (to incentivize careful checking) and lose 1 point for a mistake (to prevent rubber-stamping).

  Targets (pre-set, written on the board at the start):
  1. MIU (reachable) - bonus 3 points
  2. MIIU (reachable? Let's check: Start MI -> rule2: MII -> rule1: MIIU. So yes) - bonus 3 points
  3. MU (impossible) - bonus 5 points
  4. MIIII (reachable: MI -> rule2: MII -> rule2: MIIII) - bonus 3 points
  5. MUI (impossible? Actually, let's check: We might not know. We want at least one more that is impossible? But we don't want too many. Alternatively, we can have targets that are reachable and then MU as the big one. Alternatively, we can have a mix and let them discover. But note: the point is that MU is impossible, and we want them to get stuck on it. So we have some reachable ones and then MU.)

  But note: we don't want to give away that MU is impossible. So we list it as a target with a high bonus.

  Alternatively, we can have a list of targets that are all claimed to be reachable? But then when they fail on MU, they might feel cheated. So better to present it as a challenge: "Can you derive these?"

  We'll have:
  - Target list: 
     a) MIU (3 points)
     b) MIIU (3 points)
     c) MIIII (3 points)
     d) MU (5 points)

  We can also add one more that is impossible? But that might complicate. Alternatively, we can have an open challenge: any group can propose a new target string (that hasn't been derived before) and set a point value for it (subject to approval by the instructor? Or by consensus? To avoid arbitrary ones). But that might be too open.

  Alternatively, we can have a set of targets of increasing difficulty, with the last one being MU.

  But we want them to get stuck and then realize they need a new method. So we'll have:

  Phase 1: Free exploration and derivation of the given targets (with the exception of MU, the others are easy and reachable).

  Phase 2: They get stuck on MU and start trying to derive it and failing. We then introduce a way to "prove" that a string is derivable without actually deriving it? But that's the jump: we want them to think about properties.

  But note: we don't want to hand them the invariant. We want them to come up with the idea to look for an invariant.

  So we need a mechanism to introduce the concept of an invariant without saying it.

  We can have a "detective" phase: when a group is stuck on a target for a while, they can call for a "detective token" (or the instructor can offer a hint card). The hint card might say: "Sometimes it is easier to show that a string has a certain property that is preserved by the rules, and if the target doesn't have that property, then it cannot be derived."

  But we don't want to give too much away.

  Alternatively, we can have a moment where we ask them: "What do we know about the strings that we have derived so far? Can we describe a pattern that all our derived strings share?"

  They might notice that all strings start with M. (But that's trivial and doesn't help for MU.) The key invariant is the number of I's modulo 3.

  Invariant: the number of I's in the string is never divisible by 3? Actually, let's recall:

  The invariant for MU is that the number of I's must be congruent to 1 mod 3? Let's check:

  Start: "MI" -> I count: 1 -> 1 mod 3 = 1.

  Rule 1: if we add U, it doesn't change the number of I's -> same mod 3.
  Rule 2: if we duplicate the string after M, then if the current number of I's is k, after duplication it becomes 2k. But note: we are doubling the entire rest, which includes I's and U's. However, the invariant we care about is the number of I's. So if the current string is Mx, and x has k I's, then after doubling, we have Mxx, which has 2k I's.

  Rule 3: replaces III (3 I's) by U -> reduces I count by 3. So mod 3, it doesn't change: because subtracting 3 doesn't change the residue mod 3.

  Rule 4: removes two U's, which doesn't change the I count.

  So the invariant: at every step, the number of I's mod 3 remains the same as the start? Start: 1 I -> 1 mod 3.

  After rule 2: if we have k mod 3, then after doubling we have 2k mod 3. But note: 2k mod 3 is not necessarily k mod 3. So let's compute:

  Start: k0 = 1 -> 1 mod 3.

  After a rule 2: k becomes 2k mod 3. So:

  If current state: I count = k mod 3 = a (a in {0,1,2})
  After rule 2: 2a mod 3.

  But note: we start at a=1.

  After rule 2: becomes 2*1 mod 3 = 2 mod 3.

  Then if we apply rule 2 again: 2*2 mod 3 = 4 mod 3 = 1 mod 3.

  Rule 2 changes the residue: 1 -> 2, 2 -> 4 mod 3=1, 0->0.

  So the invariant isn't fixed! But note: we also have rules 3 and 4 which don't change the residue mod 3. And rule 1 doesn't change it.

  So the invariant is that the residue mod 3 is never 0? But at the start we have 1 mod 3. Then:

  - If we apply rule 2: from 1 mod 3 -> 2 mod 3, from 2 mod 3 -> 4 mod 3=1 mod 3, from 0 mod 3 -> 0 mod 3.

  But we start at 1. Then we can get 1 or 2 mod 3, but never 0? Because:

  - Starting at 1, the next rule 2 gives 2. Then from 2, rule 2 gives 1. Rule 3 and 4 don't change the residue. So indeed, we can only have residues 1 or 2 mod 3.

  But MU has 0 I's -> 0 mod 3. So it's impossible.

  So the invariant: the number of I's is never divisible by 3.

  Now, we want the students to discover this.

  Activity timeline (90 minutes):

  0-5 min: Introduction and rules explanation.
  - Explain the system: symbols M, I, U. Start with "MI". 
  - Explain the four rules (with examples).
  - Explain the targets: a) MIU (3 points), b) MIIU (3 points), c) MIIII (3 points), d) MU (5 points). 
  - Explain that they can also derive any new string (not in the list of already derived strings) and get 1 point for each new string. 
  - Explain the verification process: when a group claims to have derived a string (either a target or a new one), they must write the derivation (step by step) and give it to a verifier (a student from another group, assigned randomly each time). The verifier checks each step. If correct, the points are awarded. If not, the group loses 1 point for an incorrect derivation (to prevent guessing) and the verifier gets a penalty if they approved an incorrect one? Or we can just have the verifier lose 1 point if they approve an incorrect one and gain 0.5 for a correct one.

  We'll have a rotation of verifiers. We can assign two verifiers per derivation to double-check? But with 18 students, we can have 6 groups of 3. Then when a group wants to verify, we assign two verifiers from two different groups (so not their own). 

  But to simplify, we can have one verifier per derivation, and rotate.

  5-35 min: Derivation phase (30 minutes)
  - Groups work on deriving the targets and new strings. They should be able to get MIU, MIIU, MIIII easily. They will try MU and fail.
  - The instructor circulates, answers questions about the rules, but does not hint at the impossibility.
  - The board shows the current list of derived strings and the groups' scores.

  35-45 min: Mid-phase check (10 minutes)
  - Instructor gathers everyone and shows the current state: which targets have been achieved? (probably all but MU). 
  - We ask: "How are we doing on MU? Has anyone made progress?" 
  - We might have a group that claims they have a long derivation, but it will be checked and fail. 
  - We then ask: "What if we can't find a derivation? How can we be sure it's impossible? Maybe we just haven't tried hard enough? Or maybe it's truly impossible? How could we tell?"

  This is the turning point. We want to plant the idea of an invariant.

  45-65 min: Detective phase (20 minutes)
  - Introduce the idea: "Sometimes in logic, we can prove that something is impossible by finding a property that the starting string has, that is preserved by every rule, and that the target string does not have. We call such a property an invariant."
  - We do not specify what property. We ask: "Can you find an invariant for our system? That is, a property that MI has and that all the rules preserve, but that MU does not have?"
  - They work in groups to come up with properties. They might try:
     - Starts with M? (but MU starts with M too)
     - Contains an I? (but we have strings that are derived without I? Actually, we start with MI, and we can remove I's? Rule 3 replaces III by U, and rule 4 removes UU. But we cannot remove all I's? Because we start with one I and then we duplicate to two, then to four, then we can replace three of them to get a U and leave one I? Or more. But note: we can never get to 0 I's? Because we start at 1, and then:
          - Rule 1: no change in I count.
          - Rule 2: if we have k I's, then after duplication we have 2k I's.
          - Rule 3: reduces by 3.
          - Rule 4: no change.

     The invariant we want is the residue of the number of I's mod 3. We want to show it's never 0.

     How can they discover that? We can give a hint: "Consider the number of I's in the string. What can you say about that number in every string that can be derived from MI?"

     They might compute the number of I's for the strings they have:

          MI: 1 -> 1 mod 3
          MIU: 1 -> 1 mod 3
          MII: 2 -> 2 mod 3 (from MI by rule2)
          MIIU: 2 -> 2 mod 3
          MIIII: 4 -> 4 mod 3 = 1 mod 3

     Then they might notice that none of these are divisible by 3. Then they check the rules: 
          Rule 1: same I count -> same mod 3.
          Rule 2: if k mod 3 is a, then 2k mod 3 = (2a) mod 3. Since a is 1 or 2, then 2a mod 3 is 2 or 4 mod3=1. So if a is not 0, then 2a mod 3 is also not 0.
          Rule 3: subtract 3, so mod 3 same.
          Rule 4: same.

     So if we start at 1 (not 0 mod 3), then we always get a number not divisible by 3.

     But MU has 0 I's -> divisible by 3 -> impossible.

  65-80 min: Proof phase (15 minutes)
  - Groups work on formulating the invariant and writing the proof that MU is impossible.
  - They present their proof to the class. The instructor and other groups check.

  80-90 min: Debrief (10 minutes)
  - Instructor: "What just happened? We started by trying to derive MU by applying the rules. When that failed, we stepped back and reasoned about the properties of the rules and the strings. We found an invariant that allowed us to prove that MU cannot be derived."
  - Then the key question: "What kind of statement is the one we just proved? Is it a string in the system? Or is it a statement about the system? And what would it take for such a statement to be generated within the system itself?"

  This leads to the idea of meta-reasoning.

  Now, the deliverable: the argument for the impossibility.

  Proof to put on the board:

  Claim: The string MU cannot be derived from MI using the given rules.

  Proof:
  We define an invariant: the number of I's in the string is never divisible by 3.

  Base case: The starting string MI has one I. 1 is not divisible by 3.

  Induction step: We show that if the invariant holds for a string (i.e., the number of I's is not divisible by 3), then after applying any rule, it still holds.

  - Rule 1: Appending U does not change the number of I's. So the invariant is preserved.
  - Rule 2: If the current string is Mx, and x has k I's (so total I's is k), then after doubling we have Mxx, which has 2k I's. Since k is not divisible by 3, 2k mod 3 is not 0. Why? 
    - If k mod 3 = 1, then 2k mod 3 = 2.
    - If k mod 3 = 2, then 2k mod 3 = 4 mod 3 = 1.
    In both cases, 2k is not divisible by 3.
  - Rule 3: Replaces III (three I's) by U. This reduces the number of I's by 3. So if before we had k I's, after we have k-3. Since k was not divisible by 3, k-3 ≡ k mod 3 (because 3≡0 mod3) so k-3 is also not divisible by 3.
  - Rule 4: Removing UU does not change the number of I's.

  Therefore, the invariant holds for every derivable string.

  But the target string MU has 0 I's, and 0 is divisible by 3. Therefore, MU cannot be derived.

  What will predictably go wrong:

  1. The student who finds the invariant within ten minutes: They might notice the I-count pattern early. If so, let them present it? But then the activity loses its punch. Instead, encourage them to keep it to themselves and help others? Or if they bring it up, acknowledge it and then challenge them to find another invariant? Or we can have multiple invariants? But the key one is the I-count mod3. Alternatively, we can say: "That's interesting, but let's see if we can complete the derivation for MU first." and then when they fail, we can come back to it.

  2. The group that brute-forces until the clock runs out: They might not engage in the meta-reasoning. The instructor should circulate and nudge them: "How do you know when to stop? How can you be sure it's impossible?"

  3. The prize claimed on a technicality: For example, a group might write a derivation that is incorrect but gets approved by a negligent verifier. We have the penalty system to discourage that. The instructor can also spot-check.

  4. The collapse into competitive point-scoring: If groups are too focused on points, they might not engage in the proof. The instructor should emphasize that the real prize is the understanding, and that the proof of impossibility is worth more than any derivation.

  What the activity cannot reproduce:

  The activity is designed to let them experience the frustration of being stuck and the need to step outside. However, in a real research context, the step to metatheory is often more gradual and less structured. Also, the invariant we use is relatively simple. In more complex systems, finding the right invariant is a major challenge. The activity cannot fully replicate the creative leap required in actual metamathematics, but it gives a microcosm. The instructor must supply the context of why this step is significant in the broader landscape of logic and the foundations of mathematics (e.g., Gödel's incompleteness theorems).

  Revised timeline with adjustments:

  0-5: Introduction
    - Explain the system: symbols, start string, rules (with examples on the board).
    - Explain the game: groups of 3 (6 groups) will derive strings. 
    - Targets: MIU (3pts), MIIU (3pts), MIIII (3pts), MU (5pts). Also, 1pt for any new string not previously derived.
    - Verification: When a group has a derivation, they write it down and give it to a verifier (one person from another group, assigned by rotation). The verifier checks each step. If correct, the points are awarded. If incorrect, the group loses 1pt and the verifier loses 1pt if they approved it. Correct verifications earn the verifier 0.5pt.

  5-35: Derivation phase (30 min)
    - Groups work. The instructor circulates. The board has a list of derived strings and scores.

  35-40: Mid-phase check (5 min)
    - Instructor: "Let's see where we are. Which targets have been achieved?" (Expect MIU, MIIU, MIIII). 
    - "What about MU? Any progress? ... It seems we are stuck. How can we know if it's impossible?"

  40-45: Introduction of the invariant idea (5 min)
    - Instructor: "In mathematics, when we are stuck, we sometimes look for properties that are preserved by the rules. If the starting string has a property and the target doesn't, and if every rule preserves that property, then the target cannot be reached. Such a property is called an invariant. Can you find an invariant for our system?"

  45-65: Detective work (20 min)
    - Groups try to find invariants. They might try:
        - The first letter is M? (But MU also has M, so not.)
        - The number of I's mod 3? (We hope they find this.)
    - Instructor circulates and gives hints if necessary: "Look at the number of I's. What do you notice about the number of I's in every string we've derived? What happens to that number when we apply each rule?"

  65-75: Formulating the proof (10 min)
    - Groups write down the invariant and the proof that MU is impossible.

  75-85: Presentation and verification of the proof (10 min)
    - One group presents the proof. Others check. Instructor writes the clean version on the board.

  85-90: Debrief (5 min)
    - Instructor: "Today we experienced moving from working inside the system (applying rules) to reasoning about the system (proving an invariant). This is sometimes called 'jumping out of the system'. 
    - Question: What kind of statement is our proof about the system? Is it a string of the system? (No, it's a statement in the metalanguage.) 
    - What would it take for the system to be able to generate such a statement? (The system would have to be able to talk about itself, which requires encoding.) 
    - This is a glimpse into the foundations of mathematics and Gödel's work."

  Materials:
  - Rule cards (one per group) and a big one on the board.
  - Worksheets for derivations (with space for steps: step number, string, rule applied).
  - Scoreboard on the main board.

  Example derivations for the reachable targets:

  1. MIU:
     Start: MI
     Apply rule 1: MI -> MIU. (because MI ends in I)

  2. MIIU:
     Start: MI
     Apply rule 2: Mx -> Mxx, so let x=I -> MII.
     Apply rule 1: MII ends in I -> append U: MIIU.

  3. MIIII:
     Start: MI
     Rule 2: MI -> MII (x=I, so Mx -> Mxx -> MII)
     Rule 2: MII -> MIIII (x=II, so Mx -> Mxx -> MIIII)

  We can also have more complex ones, but these are enough.

  Final note: The activity might run over time, so the instructor should be flexible. The key is the transition to metareasoning. If they don't find the invariant, the instructor can guide them more. But the experience of being stuck and then seeing the power of the invariant is the goal.
answer: |-
  ### Session Design: **Inside the MIU System**

  This session immerses students in the MIU formal system, guiding them from rule-based derivations to metatheoretic reasoning. The core tension is between *applying rules* (inside the system) and *proving properties* (outside it), culminating in the realisation that **MU is impossible to derive**—a fact they must discover via an invariant.

  ---

  ### **Materials & Setup**
  1. **Rule Cards** (1 per group):  
     - **Rule 1:** If a string ends with I, add U. (e.g., MI → MIU)  
     - **Rule 2:** Double the string after M. (e.g., MI → MII)  
     - **Rule 3:** Replace III with U. (e.g., MIII → MU)  
     - **Rule 4:** Delete UU. (e.g., MIUU → MI)  

  2. **Worksheets** (1 per group):  
     - Space for writing derivations (e.g., Step 1: MI → MII [Rule 2]).  
     - A section labelled "Certification" for verifiers’ signatures.  

  3. **Tokens** (for scoring):  
     - Use coloured counters (e.g., blue = 1 point, red = bonus).  
     - **Prize:** Winning group chooses the next seminar’s snack (non-monetary).  

  4. **Board Setup:**  
     - Left: Rules and starting string (**MI**).  
     - Middle: Leaderboard (group scores).  
     - Right: "Derived Strings" (updated as new strings are certified).  

  ---

  ### **Rules, Roles & Scoring**  
  - **Groups:** Divide 18 students into 6 groups of 3.  
  - **Targets:**  
    - **Reachable:** MIU (2 points), MIIII (3 points).  
    - **"Impossible":** MU (5 points).  
  - **Scoring:**  
    - **1 point:** Deriving a *new* string (not on the board).  
    - **Bonus points:** Reaching a target (MIU/MIIII/MU).  
    - **0.5 points:** Certifying another group’s derivation (verifier role).  
  - **Social Mechanism:**  
    - Groups *must* submit derivations to **another group** for certification.  
    - Verifiers check *each step* against the rules. If correct, sign and award points. If incorrect, return with feedback.  
    - *Crucial:* No points awarded without certification.  

  ---

  ### **Timeline (90 Minutes)**  
  **Phase 1: Play the Game (0–40 mins)**  
  - **0–10 mins:** Introduce rules, groups, and scoring. *Do not mention MU’s impossibility.*  
    - Demo a derivation: Show **MI → MIU (Rule 1) → MIIU (Rule 2)**.  
  - **10–40 mins:** Groups derive strings. Push for targets.  
    - *Instructor circulates,* answers rule queries, observes frustration.  
    - **Reachable targets:**  
      - **MIU:** MI → MIU (Rule 1).  
      - **MIIII:** MI → MII (Rule 2) → MIIII (Rule 2).  
    - **Predictable progress:** Groups quickly get MIU/MIIII but stall on MU.  

  **Phase 2: Stalemate (40–50 mins)**  
  - Groups fixate on brute-forcing MU (e.g., trying MII → MIIU → MIU → ...).  
  - **Social friction:** Verifiers reject flawed derivations (e.g., "MII → MU" misusing Rule 3).  
  - *Instructor nudges:* "What makes MU trickier than MIU? Is there a pattern in *all* derived strings?"  

  **Phase 3: Escape Hatch (50–70 mins)**  
  - Introduce **Invariant Tokens** (printed cards, distributed if groups stall):  
    > *"Find a property that:  
    > (a) MI has,  
    > (b) ALL rules preserve,  
    > (c) MU does NOT have.  
    > If you find it, MU is impossible."*  
  - Groups collaborate to test properties (e.g., "Starts with M?" fails; "Number of I’s" succeeds).  

  **Phase 4: Proof & Debrief (70–90 mins)**  
  - **70–80 mins:** Groups formalise the invariant. Write proof on board:  
    > **Theorem:** MU cannot be derived.  
    > **Proof:**  
    > Let \( n \) be the number of I’s in a string.  
    > - Start: MI has \( n = 1 \).  
    > - Rule 1: Appends U → \( n \) unchanged.  
    > - Rule 2: Doubles the string → \( n \) becomes \( 2n \).  
    > - Rule 3: Replaces III with U → \( n \) decreases by 3.  
    > - Rule 4: Deletes UU → \( n \) unchanged.  
    >   
    > **Invariant:** \( n \) is never divisible by 3.  
    > - MI: \( n = 1 \) (not divisible by 3).  
    > - Rules preserve "not divisible by 3":  
    >   - Rules 1/4: \( n \) unchanged.  
    >   - Rule 2: If \( n \not\equiv 0 \mod 3 \), then \( 2n \not\equiv 0 \mod 3 \) (since 2 and 3 coprime).  
    >   - Rule 3: Subtracting 3 preserves \( \mod 3 \).  
    > - MU has \( n = 0 \) → divisible by 3. Contradiction.  
  - **80–90 mins: Debrief:**  
    1. "When did you stop *using* rules and start *analysing* them? What changed?"  
    2. "Is the statement *‘MU is impossible’* a string in the MIU system? Could it be?"  
    3. "What would a system need to ‘talk about itself’?"  

  ---

  ### **Predictable Challenges & Mitigations**  
  1. **Student finds invariant early:**  
     - A group may spot the I-count mod 3 quickly.  
     - *Mitigation:* Redirect: "Test your invariant against all rules and targets. Could another property work?"  

  2. **Brute-forcing until timeout:**  
     - Groups ignore metatheory, churning out derivations.  
     - *Mitigation:* Intervene at 40 mins: "MU has resisted 30+ mins of effort. Is there another way?"  

  3. **Prize claimed on technicality:**  
     - Group misapplies Rule 3 (e.g., turning "MIII" → "MU") and demands points.  
     - *Mitigation:* Verifiers catch errors; stress: "Certification requires strict rule-following."  

  4. **Competitive collapse:**  
     - Groups hoard discoveries or sabotage verification.  
     - *Mitigation:* Award points for collaboration (e.g., "1 point for helping another group").  

  ---

  ### **What the Activity Cannot Do**  
  - **Reproduce Gödelian depth:** The invariant here is simple and handed to them via a hint. In metamathematics (e.g., Gödel’s theorems), discovering *which* invariant matters requires creative insight.  
  - **Your role:** In the debrief, explicitly contrast this exercise with undecidability results: "Gödel showed that complex systems *must* have truths unprovable within them—but here, we ‘cheated’ by giving you the invariant. Real metatheory is about finding it yourself."  

  ---

  ### **Why This Works**  
  - Students *feel* the frustration of being stuck inside the system, making the "jump out" organic.  
  - Certification forces distinction between *doing* (applying rules) and *proving* (verifying correctness).  
  - The invariant is a tangible tool for resolving impossibility—prefiguring how metatheory anchors unprovability.  

  **Final Note:** Use British English throughout (e.g., "modulo" for mod, "certify" over "validate"). Adjust timing based on group dynamics.
