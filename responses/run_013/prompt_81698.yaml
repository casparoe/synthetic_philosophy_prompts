answer: |-
  ### Felony Sentencing Decision Procedure  
  **State Sentencing Commission**  
  *Worksheet for Judges (Complete in Order — Do Not Skip Steps)*  
  **Time Estimate:** 20 minutes  
  **Instructions:**  
  1. Complete all steps sequentially.  
  2. Use attached reference tables (predefined by the Commission) for scoring.  
  3. Desert and risk calculations are independent; never use risk to determine desert or vice versa.  
  4. If departing from the recommended sentence, specify the exact step of departure and reason in Section D.  
  5. All sentences capped at 40 years.  

  ---

  #### **Page 1: Desert Track**  
  *Purpose: Determine the sentence range the offender deserves based on culpability (relational desert).*

  **STEP 1: Harm Severity**  
  - *Question:* What was the actual or intended harm of the offense? Use Table A (Harm Levels).  
  - *Sufficient Answer:* Objective harm level (1–10 scale) based on crime type, victim impact, and societal harm.  
  - *Output:* Harm Score (H) = _____  

  **STEP 2: Mental State**  
  - *Question:* What was the offender’s mental state during the offense? Use Table B (Mental State Levels).  
  - *Sufficient Answer:* Categorical level (1–10 scale): purposeful (10), knowing (8), reckless (6), negligent (4).  
  - *Output:* Mental State Score (M) = _____  

  **STEP 3: Culpability Adjustments**  
  - *Question:* Apply predefined aggravating/mitigating factors (Table C) affecting *degree of answerability* in shared cooperation.  
    - *Include:* Provocation, duress, impaired capacity (e.g., psychosis), or extreme deprivation **only if** it reduced understanding of norms.  
    - *Exclude:* Factors implying no answerability (e.g., insanity—these acquit, not sentence).  
  - *Sufficient Answer:* Net adjustment (-5 to +5 points).  
  - *Calculation:*  
    - Aggravating Factors (e.g., weapon use, victim vulnerability): +_____  
    - Mitigating Factors (e.g., coercion, untreated illness): -_____  
    - Net Adjustment = _____  
  - *Output:* Adjusted Culpability (C) = M + Net Adjustment (clamped to 1–10) = _____  

  **STEP 4: Desert Range**  
  - *Calculation:* Desert Score (DS) = H × C (range: 1–100).  
  - *Output:* Use Table D to convert DS to [D_min, D_max] years.  
    - D_min = _____ years (minimum deserved)  
    - D_max = _____ years (maximum deserved; cap at 40 if DS > 90).  
  - *Determinate Output:* Range [D_min, D_max] is binding for desert.  

  ---

  #### **Page 2: Risk Track and Integration**  
  *Purpose: Apply actuarial risk for incapacitation/rehabilitation within the desert range.*

  **STEP 5: Actuarial Risk Score**  
  - *Question:* What is the offender’s risk of reoffending?  
  - *Sufficient Answer:* Use Commission-validated instrument (e.g., COMPAS, LS/CMI).  
  - *Output:* Risk Level = ☐ Low ☐ Moderate ☐ High (circle one).  
  - *Note:* Human override only if instrument error is proven; document in Section D.  

  **STEP 6: Risk-Based Sentence Adjustment**  
  - *Question:* Where in the desert range should the sentence fall to manage risk?  
  - *Rules:*  
    - Low risk → Sentence = D_min  
    - Moderate risk → Sentence = midpoint of [D_min, D_max] (round down)  
    - High risk → Sentence = D_max  
  - *Output:* Recommended Sentence (S) = _____ years.  
  - *Determinate Output:* S is final unless departure occurs.  

  **STEP 7: Cap Application**  
  - *Rule:* If S > 40 years, set S = 40.  
  - *Output:* Final Recommended Sentence = _____ years.  

  ---

  #### **Section D: Departures and Documentation**  
  - If departing from S:  
    - Imposed Sentence: _____ years.  
    - Departure Step: ☐ Step 1 ☐ Step 2 ☐ Step 3 ☐ Step 5 ☐ Step 6 (specify ______).  
    - Reason: _____ (e.g., “Step 3: Unlisted mitigating factor—fetal alcohol spectrum disorder”).  
  - *Stops with “No”:* If Step 1 harm = 0 (e.g., victimless crime), stop: no incarceration.  
  - *Human Handoff:* Only at Step 3 adjustments—judge must weigh values if factors are novel or contested.  

  ---

  ### Case Applications  
  **Case (i): High Culpability, Low Risk (40 years in, will not reoffend)**  
  - *Desert Track:* Harm = 10 (homicide), Mental State = 10 (purposeful), Adjustments = 0 → DS = 100 → [D_min=30, D_max=40].  
  - *Risk Track:* Low risk → S = D_min = 30 years.  
  - *Outcome:* **30 years** (judge may dislike due to low risk, but desert binds).  
  - *Departure:* If judge imposes <30 years, must document Step 3 (e.g., “age/incapacity not in tables”).  

  **Case (ii): High Risk, Diminished Culpability (severe deprivation, untreated psychosis)**  
  - *Desert Track:* Harm = 10 (homicide), Mental State = 8 (knowing), Adjustments = -5 (psychosis: -3, deprivation: -2) → C = 3 → DS = 30 → [D_min=8, D_max=15].  
  - *Risk Track:* High risk → S = D_max = 15 years.  
  - *Outcome:* **15 years** (risk elevates within desert range; no exceedance of D_max).  

  **Case (iii): Desert Exceeds 40-Year Ceiling**  
  - *Desert Track:* Harm = 10, Mental State = 10, Adjustments = +3 → DS = 100 → [D_min=30, D_max=40] (capped).  
  - *Risk Track:* Moderate risk → S = midpoint(30,40) = 35 years.  
  - *Outcome:* **35 years** (cap forces D_max=40; desert excess ignored).  

  ---

  ### Limitations and Failure Points  
  1. **Where It Misfires:**  
     - Step 3 adjustments: May oversimplify complex culpability (e.g., cultural trauma) or misapply novel factors.  
     - Step 5 risk instruments: Biases (e.g., race/class) could distort outcomes if tools are flawed.  
     - Case (i) and (iii): Judges may resent inability to reduce below D_min (desert floor) or exceed 40 years.  

  2. **What It Cannot Do:**  
     - Handle retroactive resentencing (designed for initial sentencing only).  
     - Reconcile irreconcilable philosophies (e.g., if a judge rejects relational desert entirely).  
     - Assign sentences below D_min for risk or above D_max for desert.  

  3. **Single Undermining Consideration:**  
     - If **relational desert requires contra-causal free will after all**, the desert track becomes philosophically incoherent. This would collapse the procedure’s core premise, forcing abandonment.  

  4. **Translation Risks:**  
     - **Step 3 adjustments** (Page 1): Predefined factors may not capture nuanced impairments (e.g., epigenetic trauma), leading to arbitrary scoring. Judges may default to intuition, undermining consistency.  
     - **Step 6 adjustment rules** (Page 2): Mechanistic risk mapping (low/min, high/max) may feel unjust in edge cases (e.g., high-risk/low-culpability offenders).  

