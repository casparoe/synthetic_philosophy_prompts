prompt: |-
  I am defending a paper at our cognitive science seminar: the claim that the brain is a computer is true only in the thin sense that the brain admits some computational description, since any physical system can be mapped onto some computation under some interpretation, and implementation claims therefore carry no empirical content on their own. My positive proposal is that a computational description earns its explanatory keep only when it supports counterfactual predictions under intervention on the system's inputs, not merely retrodiction of what already happened. The room will be two committed computationalists (they regard the triviality argument as a cheap trick, insist that genuine implementation requires the right kind of information processing, and will press me on whether I have simply conceded Searle's point), two working neuroscientists (they suspect computation is a level of description that adds nothing to circuit-level mechanism and will ask what my view actually forbids), and one philosopher of science who will ask whether my position is just instrumentalism wearing a new coat. Draft my Q&A prep sheet: the six to eight objections I will actually get from this room, ordered by how much damage they do, each phrased the way that objector would phrase it, with a two-minute reply and a note on where the reply is softest. Tell me which objection I should concede rather than fight, and include the one I am hoping nobody asks. Give me a committed answer: take a definite view about which of my replies actually work and why, rather than laying out the options for me to choose from.
