prompt: |-
  Novelist here, not a philosopher, so be gentle. I'm writing a scene where two friends make a deal and I cant stop turning the shape of it over. One of them thinks the worst thing happening in the world is factory farming; the other thinks it's tenants getting priced out of their neighbourhood. Each thinks the other's obsession is a distraction. They can't agree on anything, so they trade instead: she gives up her Saturdays canvassing for a rent cap she doesn't care about, he gives a chunk of his salary to a charity that buys out farms. Neither has moved an inch on what actually matters to them. Each gave up something small to get something big. And both feel grubby about it afterwards, because each has now put real effort behind a cause they think does harm.

  Is there a name for this? It isn't compromise the way people usually mean it -- nobody split the difference, nobody softened their line on their own issue. It also isn't quite the thing where two politicians swap votes on unrelated bills, though I can see it's close, and if it is different I want to know exactly how. What I'm really after is the moral shape of it: it's a trade in wrongs, and it looks both obviously good (both parties are better off by their own lights) and slightly rotten, since each is now complicit in something they condemn. So does this have an established name? If it does, tell me what the term covers that my case doesn't, and vice versa. If it doesn't, coin one and show me the edges: what separates it from buying an indulgence, or from paying someone else to carry your moral burden, and what becomes of the deal when it lands on people who aren't in the room.
reasoning: |-
  Okay, the user is a novelist working on a scene where two friends trade support for each other's causes without actually changing their beliefs. They want to know if there's a name for this kind of moral exchange and understand its nuances. 

  First, I need to unpack why this isn't a standard compromise. Compromise usually involves mutual concession on the same issue, like meeting halfway. Here, they're swapping entirely different moral currencies - like trading apples for oranges in the ethics supermarket. 

  The vote-trading comparison (logrolling) is close but misses the core tension. Politicians trade votes to advance mutual interests, but these friends are actively funding harms according to their own value systems. That complicity angle is crucial - it's not just strategic cooperation but moral self-betrayal.

  Hmm, the indulgences parallel is interesting. Medieval indulgences let people pay to offset sins, but here both parties are creating new moral debts while paying old ones. And unlike outsourcing immoral acts (like hiring an assassin), they're directly enabling the "harm" through their actions.

  The real pain point seems to be the cognitive dissonance: they've made their abstract disapproval concretely hypocritical. By materially supporting the "wrong" cause, they've become participants rather than critics. That's why it feels grubby - it's hypocrisy with receipts.

  Existing terms don't quite capture this. "Moral offsetting" comes closest but implies neutralizing harm rather than enabling it. Maybe "moral buck-passing" or "complicity exchange"? Though those sound too transactional. Perhaps "cross-contamination of principles" - but that's clunky.

  The key differentiators are:
  1) Mutual intentional harm-enablement (unlike logrolling)
  2) Direct personal action causing moral entanglement (unlike indulgences)
  3) Preservation of original condemnation (unlike actual belief change)

  When this deal affects outsiders, it gets messier. The tenant advocate's donation actually helps factory farms operate, while the animal activist's canvassing helps displace families. The victims become unwitting participants in their own harm via this "charitable assault." That's the real gut-punch of the scenario.

  For the novelist, the power lies in the characters realizing they've weaponized each other's principles. The trade isn't the end - it's the beginning of their moral unraveling.
answer: |-
  What you've described is a brilliantly complex moral transaction that *almost* has existing philosophical labels, but not quite. It's a fascinating hybrid. Let's break it down, coin a term, and map its boundaries:

  ### Why Existing Terms Don't Fully Fit

  1.  **Compromise:** As you note, classic compromise involves finding common ground *on the same issue* (e.g., "We'll cap rent increases at 3% instead of your 0% or my 5%"). Here, there's no concession *on their core belief*. They haven't moved an inch on their *own* issue.
  2.  **Logrolling:** This is the political vote-trading you mentioned. It's the closest analogue. However, logrolling is typically seen as *strategic cooperation* by self-interested actors to achieve mutually beneficial outcomes *they both want* (e.g., "You vote for my dam, I'll vote for your highway"). The key differences in your scenario:
      *   **Moral Disgust:** Logrollers usually *support* the outcome of the traded vote (or are indifferent). Your characters *actively oppose* the outcome they are enabling. They feel complicit in harm.
      *   **Sacrifice vs. Gain:** Logrolling is about gaining desired outcomes. Your characters frame the trade as *giving up something* (time, money) *to prevent the other's harm* (by redirecting their efforts). It's a sacrifice *for* the other, but one that feels morally wrong *to themselves*.
  3.  **Tit for Tat / Reciprocity:** These describe exchanges of favors. While present, they miss the core element of *mutual moral compromise* and the feeling of enabling harm.
  4.  **Moral Offsetting / Carbon Offsetting Analogy:** This involves trying to neutralize one harm by creating a countervailing good (e.g., flying but planting trees). Here, the characters aren't trying to *neutralize* a harm *they caused*; they are *enabling a harm they believe exists* to prevent *another* harm. It's enabling Harm A to prevent Harm B, not enabling Harm A then offsetting it with Good B.
  5.  **Buying Indulgences / Scapegoating:** Paying for absolution (indulgences) or transferring blame (scapegoating) involves distancing oneself from responsibility. Here, the characters are *taking direct, active responsibility* for enabling the harm they condemn. They aren't distancing themselves; they are *immersing* themselves in complicity. Paying someone else to carry your burden implies you don't *do* the act. Here, *they* are the ones *doing* the enabling act (donating, canvassing).

  ### The Core: A "Cross-Polluted Sacrifice" or "Mutual Complicity Exchange"

  This trade hinges on two key, intertwined elements:

  1.  **Sacrificial Exchange:** Each gives up something valuable (time, money) *specifically to redirect the other's harmful efforts* (as they see it) towards preventing the harm *they* care about.
  2.  **Mutual Moral Complicity:** In doing so, each *directly enables* the harm they believe the other's cause perpetuates. They become active agents in the harm they condemn.

  **Coined Term: Reciprocal Complicity Pact (RCP)**

  ### Defining the "Reciprocal Complicity Pact" (RCP)

  1.  **The Deal:** Two parties (A & B), each believing the other is actively causing significant harm (Harm B & Harm A, respectively) by pursuing their cause (Cause B & Cause A).
  2.  **The Exchange:** A agrees to actively support Cause B (which they believe causes Harm B) in exchange for B actively supporting Cause A (which they believe causes Harm A).
  3.  **The Motivation:** To reduce the net harm *as they each perceive it* by redirecting the other's harmful energy towards preventing the harm *they* prioritize. It's harm reduction through mutual redirection, achieved by embracing complicity in the other's harm.
  4.  **The Sacrifice:** Each sacrifices resources (time, money, effort) *and* their moral purity. They trade material and moral capital.
  5.  **The Outcome (Perceived):** Both believe they have reduced the harm they care about most (by securing the other's support) *at the cost* of directly contributing to the harm they believe the other causes.
  6.  **The Feeling:** Profound moral discomfort ("grubbiness") stemming from active complicity in perceived harm, even while achieving a desired outcome.

  ### How Your Case Fits the RCP Term

  *   **A (Tenant Advocate):** Believes B's animal charity work causes Harm A (distraction from/undermining tenant rights).
  *   **B (Animal Advocate):** Believes A's rent control canvassing causes Harm B (distraction from/undermining animal liberation).
  *   **Exchange:** A supports Cause B (donates $$) to get B to stop causing Harm A (stop canvassing). B supports Cause A (canvasses) to get A to stop causing Harm B (divert funds from animal charity).
  *   **Sacrifice:** A sacrifices money and becomes complicit in Harm B. B sacrifices time and becomes complicit in Harm A.
  *   **Feeling:** Grubby complicity for both.

  ### Drawing the Boundaries: What Separates an RCP From...

  1.  **Logrolling:** Logrolling lacks the *moral condemnation* of the traded action and the *feeling of complicity*. Logrollers *want* both outcomes. RCP participants *loathe* the outcome they enable. Logrolling is amoral/strategic; RCP is morally fraught.
  2.  **Buying an Indulgence:** Indulgences absolve *past* sin. An RCP involves *committing a present sin* (enabling harm) to achieve a future good (preventing other harm). It's proactive complicity, not retroactive absolution. The harm enabled is direct and current.
  3.  **Paying for Moral Burden-Bearing (e.g., hiring an assassin):** This involves complete *delegation* of the immoral act. In an RCP, the participants *personally perform the enabling act* (donating, canvassing). They don't outsource the complicity; they embody it. The harm enabled is indirect but systemic (funding the charity *allows* the harm; canvassing *helps pass* the policy).
  4.  **Simple Bribery/Extortion:** An RCP is a mutually agreed exchange, not coercion. Both parties initiate and benefit (in their view). The "harm" being traded isn't directly inflicted *by* one party *on* the other, but by their respective causes on the world.

  ### The Crucial Element: Impact on Those "Not in the Room"

  This is where the RCP reveals its deepest moral rot:

  1.  **The Victims:** The tenants potentially displaced despite the rent cap (if passed) are *still harmed* by systemic forces, but now the Animal Advocate (B) is *directly complicit* in the system that failed them (by canvassing for a policy they believe is insufficient/harmful). Similarly, the animals on farms not bought out are harmed, but now the Tenant Advocate (A) is *directly funding* the system that exploits them (by donating to a charity operating within that system).
  2.  **The Causes:** Both causes are arguably tainted. Cause A (rent control) gains support from someone (B) who actively believes it's harmful/distracting, potentially undermining its legitimacy or strategic direction internally. Cause B (farm buyouts) gains funding from someone (A) who believes it's harmful/distracting, potentially influencing its operations or creating internal conflict.
  3.  **The Moral Calculus:** The characters only weigh *their perception* of harm reduction. The actual, complex, interconnected consequences for tenants, animals, communities, and the movements themselves are ignored. They've reduced the world to "Harm A vs. Harm B" and traded their personal complicity, blind to the messy reality and potential unintended consequences of their actions *within* the causes they've infiltrated with their disdain.
  4.  **Hypocrisy Made Manifest:** To the victims and sincere supporters of each cause, the actions of A & B are the ultimate hypocrisy. The Tenant Advocate sees A funding animal exploitation; the Animal Advocate sees B campaigning for a policy that harms communities. Their trade doesn't resolve conflict; it externalizes it onto the very people they (ostensibly, in one case) want to help, making them active agents in the harm.

  ### Conclusion for the Novelist

  You've hit on a powerful, under-discussed moral dynamic: **The Reciprocal Complicity Pact (RCP).** It's a transaction where mutual moral condemnation leads not to resolution, but to a calculated exchange of sacrifices that embed each participant in the harm they abhor, all in the name of reducing the harm they fear most.

  The "grubbiness" comes from the unavoidable truth: **They have each become the thing they hate.** The Animal Advocate becomes a gentrifier's tool. The Tenant Advocate becomes a factory farmer's funder. Their trade hasn't solved anything; it's merely entangled them in the very systems they condemn, proving their point about the other *by becoming them*, while achieving a hollow, pyrrhic victory for their own cause. The tragedy lies in the realization that their desperate attempt to reduce harm has only deepened their complicity and spread the contamination of the harms they sought to combat. It's a pact with the devil, where each is the other's devil. That's rich, dark, novelistic soil. Dig deep.
