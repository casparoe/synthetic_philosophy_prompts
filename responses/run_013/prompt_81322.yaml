  Below is the constructed teaching artifact for your graduate seminar on the sorites paradox. I have designed a scenario that meets all your specifications, forcing the four positions (epistemicism, supervaluationism, degree theory, contextualism) to disagree about the *source* of vagueness—not merely its extent—by contrasting a precise institutional standard (Version A) with a vague one (Version B). The predicate is graded, non-perceptual, and carries high-stakes institutional consequences. The series is a continuum of 100 items, with higher-order vagueness strictly enforced in Version B. No item is singled out as the cutoff, and the two versions differ solely in the presence of a stipulation.  

  ---

  ### **Scenario: Disaster Relief Funding Eligibility**  
  **Predicate:** "Substantial infrastructural damage" (a condition for federal relief funding).  
  **Graded Quantity:** Percentage of critical infrastructure (e.g., roads, bridges, power grids) damaged in a municipality.  
  **Series:** 100 municipalities (M₁ to M₁₀₀) ordered by increasing damage:  
  - M₁ has 0% damage.  
  - M₁₀₀ has 100% damage.  
  - Each successive municipality increases by 1% (e.g., M₅₀ has 50% damage).  
  **Institutional Stakes:** Eligibility for $10M in federal disaster relief. Funding is granted iff the municipality has "substantial infrastructural damage." Denial means bankruptcy, service cuts, or resident displacement.  

  #### **Version A (Precise Standard):**  
  Federal statute explicitly defines "substantial infrastructural damage" as "70% or more damage." Eligibility is binary: Mₙ is eligible iff damage ≥ 70%.  

  #### **Version B (Vague Standard):**  
  Federal statute uses "substantial infrastructural damage" without numerical thresholds. Eligibility is determined by administrative review, guided only by ordinary meaning (like "significant," "severe," or "reasonable" in law). No precisifying rules exist.  

  **Key Features Ensuring Constraints:**  
  - **Non-perceptual & high stakes:** Damage % is quantifiable via engineering reports (non-subjective); funding affects survival.  
  - **Continuum & no epistemic gaps:** Damage % is measured precisely (e.g., satellite imaging), so differences between adjacent municipalities (e.g., M₅₀ and M₅₁) are negligible. No natural joints.  
  - **Higher-order vagueness in B:** No definite last eligible municipality, no definite first ineligible, and no sharp boundary between definite/clear cases and borderline cases. For instance:  
    - M₁ (0%) is clearly not substantial.  
    - M₁₀₀ (100%) is clearly substantial.  
    - M₅₀ (50%) is borderline, but so are M₄₉ (49%) and M₅₁ (51%)—with no sharp transition to "definitely borderline" or "definitely not."  
  - **No item singled out:** The story does not imply a cutoff (e.g., no "M₇₀ is pivotal").  
  - **Single difference:** Only Version A has a stipulation (70% threshold); institutions, quantity, and stakes are identical.  

  ---

  ### **Verdicts by Theory**  
  For both versions, I provide verdicts for:  
  - **Extremes:** M₁ (0% damage) and M₁₀₀ (100% damage).  
  - **Midpoint:** M₅₀ (50% damage).  
  - **Adjacent items:** M₄₉ (49% damage) and M₅₁ (51% damage).  

  #### **Version A (Precise: ≥70% damage)**  
  All theories agree due to the stipulation:  
  - M₁: **Ineligible** (0% < 70%).  
  - M₁₀₀: **Eligible** (100% ≥ 70%).  
  - M₅₀: **Ineligible** (50% < 70%).  
  - M₄₉: **Ineligible** (49% < 70%).  
  - M₅₁: **Ineligible** (51% < 70%).  
  *Justification*: The stipulation creates a sharp boundary; truth conditions are metaphysically determinate.  

  #### **Version B (Vague: "Substantial damage")**  
  Theories disagree on truth conditions, eligibility, and the nature of borderline cases.  

  1. **Epistemicism**  
     - M₁: **Ineligible** (clearly not substantial).  
     - M₁₀₀: **Eligible** (clearly substantial).  
     - M₅₀: **Eligible or ineligible** (unknown which).  
     - M₄₉: **Eligible or ineligible** (unknown).  
     - M₅₁: **Eligible or ineligible** (unknown).  
     *Justification*: There is a sharp cutoff (e.g., at some specific %), but human ignorance prevents knowing it. Higher-order vagueness is an illusion; vagueness is purely epistemic.  

  2. **Supervaluationism (with truth-value gaps)**  
     - M₁: **Ineligible** (true on no precisification).  
     - M₁₀₀: **Eligible** (true on all precisifications).  
     - M₅₀: **Neither eligible nor ineligible** (gap: true on some precisifications, false on others).  
     - M₄₉: **Neither eligible nor ineligible** (gap).  
     - M₅₁: **Neither eligible nor ineligible** (gap).  
     *Justification*: Admissible precisifications set cutoffs anywhere (e.g., 40–80%). M₅₀ is true if precisified at ≤50%, false if >50%. Higher-order vagueness arises because "admissible precisification" is itself vague.  

  3. **Degree Theory**  
     - M₁: **Ineligible** (truth degree = 0).  
     - M₁₀₀: **Eligible** (truth degree = 1).  
     - M₅₀: **Borderline** (truth degree = 0.5).  
     - M₄₉: **Borderline** (truth degree ≈ 0.49).  
     - M₅₁: **Borderline** (truth degree ≈ 0.51).  
     *Justification*: Truth degrades linearly with damage % (degree = damage%/100). Eligibility requires a threshold degree (e.g., ≥0.7), but Version B lacks one, leaving degrees non-binary. Higher-order vagueness is modeled by non-sharp transitions in degrees.  

  4. **Contextualism**  
     - M₁: **Ineligible** (in all contexts).  
     - M₁₀₀: **Eligible** (in all contexts).  
     - M₅₀: **Eligible in some contexts, ineligible in others**.  
     - M₄₉: **Eligible in some contexts, ineligible in others**.  
     - M₅₁: **Eligible in some contexts, ineligible in others**.  
     *Justification*: "Substantial" shifts with conversational context (e.g., comparison to other cases). In a context, M₅₀ may be eligible if contrasted with M₁, or ineligible if contrasted with M₁₀₀. Higher-order vagueness reflects context-sensitivity of "definitely."  

  ---

  ### **Analysis of the Construction**  
  **Key Feature Doing the Work:** The **institutional stakes combined with higher-order vagueness** forces theories to reveal their core commitments. In Version B, the absence of a stipulation requires each theory to explain *why* the boundary is indeterminate. The theories don’t just disagree on *where* the cutoff is (as in heap/color cases) but on *what constitutes vagueness itself*:  
  - Epistemicism: Vagueness is ignorance of a hidden fact.  
  - Supervaluationism: Vagueness is semantic indecision (multiple precisifications).  
  - Degree Theory: Vagueness is gradience in truth.  
  - Contextualism: Vagueness is context-dependence.  

  **If the Key Feature Is Removed (i.e., no higher-order vagueness):**  
  - All theories collapse to **binary truth conditions** in Version B:  
    - Epistemicism: Still has a sharp cutoff (known or unknown).  
    - Supervaluationism: Borderline cases have sharp boundaries.  
    - Degree Theory: Degrees become irrelevant; eligibility is binary.  
    - Contextualism: Context fixes a sharp cutoff.  
  This would reduce the disagreement to a debate about cutoff location, not vagueness’s nature.  

  **Most Unkindly Treated Theory: Epistemicism**  
  - **Why**: The stipulation of higher-order vagueness in Version B directly contradicts epistemicism’s claim that there *is* a sharp boundary (even if unknown). The case forces epistemicists to deny the intuition that no municipality is "definitely the last eligible."  
  - **How a Defender Would Defuse**: Argue that higher-order vagueness is reducible to first-order ignorance. For example: "The series *does* have a sharp cutoff (e.g., at 52%), but our inability to know whether M₅₀ is 'definitely eligible' just reflects deeper ignorance—not genuine higher-order vagueness." This preserves epistemicism but rejects the scenario’s setup as incoherent.  

  **Where the Construction Is Rigged or Question-Begging:**  
  - **Against epistemicism**: The higher-order vagueness requirement assumes the very phenomenon epistemicism denies (no sharp boundaries), potentially begging the question. Proponents would reject Version B as described.  
  - **For contextualism**: The "fixed" institutional context in Version B is ambiguous. Contextualists might argue that administrative review *creates* a context, making vagueness resolvable in practice—but the case ignores this to isolate semantic vagueness.  
  - **Artificial continuum**: Holding "quality of damage" constant isolates quantity but may oversimplify real-world predicates (e.g., "damage" could involve type/location). This is necessary, however, to exclude perceptual or epistemic factors.  

  ---

  ### **How to Use in Seminar**  
  This artifact compels students to move beyond reciting theory and grapple with *why* each theory defines vagueness differently:  
  1. Present the scenario, emphasizing the stakes and continuum.  
  2. Contrast Version A (theories agree) with Version B (theories disagree fundamentally).  
  3. Focus on M₅₀, M₄₉, and M₅₁ to highlight how theories handle borderline cases and higher-order vagueness.  
  4. Use the analysis to spark debate: "Does epistemicism’s response to Version B preserve its core? Does degree theory’s precision in degrees undermine vagueness?"  
  The case avoids textbook tropes by embedding vagueness in institutional decision-making, making the metaphysical stakes tangible and unresolved.
