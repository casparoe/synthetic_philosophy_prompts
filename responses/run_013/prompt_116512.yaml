prompt: |-
  A colleague in my lab keeps invoking the maxim that simpler hypotheses are more probable. He insists it is not a heuristic but a theorem, and he uses it to argue that we should discount a model with several extra free parameters in favour of a tidier rival, even though the two fit our data equally well. I want a menu of the precise claims that maxim could be making, ordered roughly from the trivial to the radical: a bare methodological preference for parsimony; a Bayesian claim about priors over parameterised model families; and the Solomonoff-style claim that a prior built from program lengths dominates every computable alternative. For each reading, say whether it is trivial, substantive, or false, and whether it would actually license his move. Make clear what each reading commits you to about the relationship between simplicity, description length, and probability; flag any reading under which simpler is not even well-defined, and any under which the theorem, even if true, does no work in the finite-data setting he actually cares about. I have to answer him in a meeting, so lay it out as a list of readings with verdicts rather than defending one.
reasoning: |-
  We are to provide a menu of interpretations of the maxim "simpler hypotheses are more probable," ordered from trivial to radical. For each, we will state:

  1. The precise claim.
  2. Whether it is trivial, substantive, or false.
  3. Whether it licenses the colleague's move (discounting a model with extra free parameters in favor of a tidier one when they fit equally well).
  4. Commitments about the relationship between simplicity, description length, and probability.
  5. Whether simplicity is well-defined in this reading.
  6. Whether the theorem does work in finite-data settings.

  We'll organize the readings as follows:

  ### Reading 1: Parsimony as a Methodological Principle (Ockham's Razor)
  - **Claim**: We should prefer simpler models as a rule of thumb for scientific practice, because they are easier to test, understand, and build upon, and because they avoid overfitting. This is not a statement about probability but about pragmatics and strategy.
  - **Verdict**: Trivial (widely accepted as a heuristic).
  - **Licenses the move?**: Only as a heuristic. It does not claim that simpler models are more probable, so it does not directly license the move as a matter of probability. It might justify the move on pragmatic grounds.
  - **Relationship**: Simplicity is not formally tied to probability. Description length might be used informally to measure simplicity (e.g., number of free parameters) but without a probabilistic foundation.
  - **Well-defined?**: Simplicity is context-dependent and not formally defined (e.g., number of parameters, but why that?).
  - **Finite-data relevance?**: It is used in finite data to avoid overfitting and for clarity, but it is not a theorem about probability.

  ### Reading 2: Bayesian Occam's Razor (Model Selection with Priors)
  - **Claim**: In a Bayesian framework, when comparing two models that fit the data equally well, the simpler model (with fewer parameters or lower complexity) will have a higher marginal likelihood (i.e., evidence) if we use a prior that does not unduly favor complex models. This is because the marginal likelihood integrates over the parameter space and complex models spread their prior mass more thinly, leading to a lower average likelihood.
  - **Verdict**: Substantive (a well-established result in Bayesian model comparison).
  - **Licenses the move?**: Yes, under specific conditions: the prior must be proper and not tuned to favor the complex model arbitrarily, and the models must be nested or comparable in a way that the marginal likelihood is well-defined. The move is licensed because the marginal likelihood (which includes the prior) is higher for the simpler model when the data are equally well fitted by both.
  - **Relationship**: Simplicity (as model complexity) is related to the prior distribution and the integration over the parameter space. Description length is not explicitly required; instead, the focus is on the prior and the likelihood.
  - **Well-defined?**: Simplicity is defined by the structure of the model (e.g., number of parameters, but more generally by the prior and the likelihood function). The complexity is captured by the Bayesian Occam factor.
  - **Finite-data relevance?**: Yes, it applies to finite data. The marginal likelihood is computed for the observed data.

  ### Reading 3: Akaike Information Criterion (AIC) / Frequentist Model Selection
  - **Claim**: The AIC is an estimate of the expected relative Kullback-Leibler divergence. It rewards goodness of fit (likelihood) but penalizes the number of parameters: AIC = -2 log(L) + 2k, where L is the likelihood and k is the number of parameters. Therefore, with equal fit (same log(L)), the model with fewer parameters (smaller k) has a lower AIC and is preferred.
  - **Verdict**: Substantive (a theorem in the context of information theory and model selection).
  - **Licenses the move?**: Yes, because when two models have the same log-likelihood, the one with fewer parameters will have a lower (better) AIC. However, note that AIC is not a probability but a relative score. The colleague's claim about probability is not directly addressed, but the criterion does justify choosing the simpler model.
  - **Relationship**: Simplicity is measured by the number of parameters (k). There is an implicit connection to probability via the likelihood but not a direct prior. Description length is not explicitly used.
  - **Well-defined?**: Simplicity is defined as the number of free parameters (k).
  - **Finite-data relevance?**: Yes, AIC is designed for finite data. However, it is an asymptotic approximation and may not be accurate for very small samples.

  ### Reading 4: Minimum Description Length (MDL) Principle
  - **Claim**: The best model is the one that minimizes the description length of the model plus the description length of the data given the model. This is justified by the Kolmogorov complexity framework: the shortest program that reproduces the data is the best. In practice, we use a computable approximation (e.g., two-part codes). This principle is equivalent to maximizing the probability of the data if we use a prior that is exponentially related to the description length (e.g., 2^{-length}).
  - **Verdict**: Substantive (based on results in algorithmic information theory).
  - **Licenses the move?**: Yes, because a model with extra free parameters will typically require a longer description (unless the parameters are fixed by the data) and thus a higher total description length. Even if both models fit the data equally well, the simpler model (with shorter description) will have a lower total description length and hence a higher prior probability (if we interpret the description length as defining a prior).
  - **Relationship**: Simplicity is explicitly defined as description length (Shorter = Simpler). Probability is related by the Kraft inequality: if we have a set of prefix codes, then we can define a probability distribution by P(x) = 2^{-K(x)} (up to a constant) where K(x) is the Kolmogorov complexity. So, shorter description length implies higher prior probability.
  - **Well-defined?**: Kolmogorov complexity is well-defined but uncomputable. In practice, we use computable approximations (like two-part codes). So, simplicity is well-defined in theory but must be approximated in practice.
  - **Finite-data relevance?**: In theory, yes, but in practice the uncomputability and the challenge of approximating Kolmogorov complexity make it difficult to apply directly in finite data. However, there are practical MDL methods that work for finite data.

  ### Reading 5: Solomonoff Induction (Universal Prior)
  - **Claim**: Solomonoff's universal prior assigns to each hypothesis (or model) a prior probability that is exponentially related to the length of the shortest program (in a universal Turing machine) that computes the hypothesis. This prior dominates any computable prior in the sense that it converges to the true hypothesis faster (in terms of prediction). Therefore, simpler (shorter) programs have higher prior probability.
  - **Verdict**: Substantive (a theorem in algorithmic information theory).
  - **Licenses the move?**: Yes, because a model with extra free parameters would require a longer program to specify (unless the parameters are fixed by the data) and thus a lower prior. So, even with equal fit, the simpler model has a higher prior and thus a higher posterior (if the likelihoods are the same). However, note that this is in the limit of infinite data and for computable hypotheses.
  - **Relationship**: Simplicity is defined by the length of the program. Probability is defined by the universal prior: P(h) = 2^{-K(h)} (up to a constant), so shorter programs have higher probability.
  - **Well-defined?**: Kolmogorov complexity is well-defined (though non-computable) for a fixed universal Turing machine. So, simplicity is well-defined in theory.
  - **Finite-data relevance?**: The universal prior is not computable, so it cannot be used directly in finite-data settings. However, it provides a theoretical justification for MDL and other approximations. The theorem about domination is asymptotic and does not necessarily help in finite data.

  ### Reading 6: Simplicity as Higher Probability (A False Reading)
  - **Claim**: Without any qualification, the claim that simpler hypotheses are always more probable (even without considering the data) is false. For example, if we have two models and the complex one happens to be true, then even if it is complex, it should have the higher probability. Also, without a well-defined measure of simplicity and without a formal framework (like Bayesian or algorithmic), the claim is ambiguous.
  - **Verdict**: False.
  - **Licenses the move?**: No, because it is not generally true. The colleague must rely on a specific framework (like Bayesian or MDL) to make the claim.
  - **Relationship**: Undefined without a framework.
  - **Well-defined?**: Simplicity is not well-defined in this reading.
  - **Finite-data relevance?**: Not applicable.

  ### Summary for the Colleague

  We present the readings in order of increasing radicalness (and also increasing theoretical depth):

  1. **Methodological Principle (Ockham's Razor)**: Trivial, does not license the move as a matter of probability (only as a heuristic).
  2. **Bayesian Occam's Razor**: Substantive, licenses the move under Bayesian framework with proper priors.
  3. **AIC (Frequentist)**: Substantive, licenses the move via a model selection criterion (but not about probability per se).
  4. **Minimum Description Length (MDL)**: Substantive, licenses the move by connecting description length to probability (but requires a computable approximation).
  5. **Solomonoff Induction**: Substantive, licenses the move in theory but not directly applicable to finite data (uncomputable).
  6. **Unqualified Claim**: False, does not license the move.

  The colleague's move (choosing the simpler model when fit is equal) is licensed by Readings 2, 3, 4, and 5, but note the caveats:

  - Reading 2 (Bayesian) requires a prior that is not biased toward complexity.
  - Reading 3 (AIC) is a frequentist criterion and does not directly assign probabilities to models.
  - Readings 4 and 5 (MDL and Solomonoff) are theoretical and may be hard to apply in practice.

  Therefore, the colleague is likely relying on Reading 2 (Bayesian) or Reading 3 (AIC) in a practical setting. However, without specifying the framework, the claim can be challenged.

  In the meeting, we can present these readings and ask the colleague to specify which one he is using. We can then discuss the commitments and caveats of that reading.
answer: |-
  Below is a concise menu of readings for the maxim "simpler hypotheses are more probable," ordered from least to most radical. Each reading includes its claim, verdict (trivial, substantive, or false), whether it licenses your colleague's move (discounting a model with extra parameters despite equal fit), commitments about simplicity, description length, and probability, whether simplicity is well-defined, and applicability in finite-data settings. Use this to challenge your colleague's assertion in your meeting.

  ---

  ### **1. Parsimony as a Methodological Heuristic (Ockham's Razor)**
  - **Claim**: Simpler models should be preferred as a pragmatic rule to avoid overfitting, enhance testability, and aid communication. This is not a probabilistic statement but a guideline for scientific practice.
  - **Verdict**: Trivial (widely accepted as sensible, but not a theorem).
  - **Licenses the move?**: Yes, but only as a weak, non-probabilistic recommendation. It does not justify "more probable."
  - **Commitments**:  
    - Simplicity ≈ fewer parameters or less structural complexity.  
    - No link to probability or description length.  
  - **Simplicity well-defined?**: Context-dependent (e.g., parameter count). No universal standard.  
  - **Finite-data relevance?**: Yes—it directly addresses overfitting in small datasets.  

  ### **2. Bayesian Model Selection (Bayesian Occam's Razor)**
  - **Claim**: When comparing models, the marginal likelihood (evidence) penalizes complexity. For equal data fit, simpler models have higher evidence due to lower prior dilution over parameter space.
  - **Verdict**: Substantive (a theorem under Bayesian probability theory).  
  - **Licenses the move?**: **Yes**, but only if:  
    - (a) Models are compared via marginal likelihood (not just likelihood),  
    - (b) Priors are proper and not manipulative,  
    - (c) The complex model's extra parameters are not fixed by data.  
  - **Commitments**:  
    - Simplicity ≈ low parametric complexity (e.g., fewer free parameters).  
    - Description length ≈ log-prior (e.g., a model with 2x more parameters may have half the prior density).  
    - Probability ≈ Marginal likelihood favors simplicity via integration.  
  - **Simplicity well-defined?**: Yes, as model dimensionality or prior entropy.  
  - **Finite-data relevance?**: **Yes**—this is designed for finite data.  

  ### **3. Akaike Information Criterion (AIC) / Frequentist Efficiency**
  - **Claim**: Models with fewer parameters have lower AIC scores (≈ better predictive accuracy) asymptotically. For equal fit, AIC prefers simpler models.
  - **Verdict**: Substantive (a theorem in information theory).  
  - **Licenses the move?**: **Yes**, but weakly:  
    - AIC minimizes expected prediction error, not "probability."  
    - Only valid for large samples; unreliable for small data.  
  - **Commitments**:  
    - Simplicity ≈ number of free parameters.  
    - Description length ≈ not directly used.  
    - Probability ≈ AIC approximates KL divergence, not posterior probability.  
  - **Simplicity well-defined?**: Yes (parameter count).  
  - **Finite-data relevance?**: **Limited**—asymptotic justification; poor for small datasets.  

  ### **4. Minimum Description Length (MDL) Principle**
  - **Claim**: The best model minimizes combined description length of model + data given model. Shorter descriptions ≡ higher probability via Kraft inequality.  
  - **Verdict**: Substantive (a theorem in algorithmic information theory).  
  - **Licenses the move?**: **Yes**, because extra parameters increase description length even if fit is equal.  
  - **Commitments**:  
    - Simplicity ≡ description length (shorter = simpler).  
    - Description length ≡ Kolmogorov complexity (ideal) or practical codes.  
    - Probability ≈ Prior ∝ \(2^{-\text{description length}}\).  
  - **Simplicity well-defined?**: **No** in practice—Kolmogorov complexity is uncomputable. Approximations (e.g., two-part codes) are used.  
  - **Finite-data relevance?**: **Mixed**—approximations work, but uncomputability limits rigor in finite samples.  

  ### **5. Solomonoff Induction (Universal Prior)**
  - **Claim**: A prior based on program length dominates all computable priors: \(P(h) \propto 2^{-K(h)}\) where \(K(h)\) is Kolmogorov complexity. Shorter programs ≡ higher probability.  
  - **Verdict**: Radical but substantive (a theorem in algorithmic information theory).  
  - **Licenses the move?**: **Yes**, in theory—simpler models always have higher prior probability.  
  - **Commitments**:  
    - Simplicity ≡ shortest program length for the hypothesis.  
    - Description length ≡ Kolmogorov complexity.  
    - Probability ≡ Universal prior dominates computable alternatives.  
  - **Simplicity well-defined?**: **No**—Kolmogorov complexity is uncomputable and non-unique (up to constants).  
  - **Finite-data relevance?**: **No**—the result is asymptotic. Uncomputable and useless for finite data.  

  ### **6. Unconditional Simplicity-Probability Link (The Extremist View)**
  - **Claim**: Simplicity directly implies higher probability—always, without technical caveats (e.g., "simpler = more likely" as a universal law).  
  - **Verdict**: **False**.  
  - **Licenses the move?**: No—ignores data fit, context, and formal frameworks.  
  - **Commitments**:  
    - Simplicity ≈ ill-defined intuition.  
    - Description length/probability ≈ no clear link.  
  - **Simplicity well-defined?**: No.  
  - **Finite-data relevance?**: N/A—this is incoherent.  

  ---

  ### **Key Takeaways for Your Meeting**
  - **Your colleague is likely invoking #2 (Bayesian) or #4 (MDL)**. These are substantive and license his move, but:  
    - **For #2**: Demand he specifies priors and uses marginal likelihoods (not just likelihoods).  
    - **For #4/MDL**: Challenge him to compute description lengths rigorously—it's uncomputable in practice.  
  - **Radical claims (#4–#5) fail in finite-data settings**: Solomonoff is irrelevant to real labs; MDL relies on approximations.  
  - **Tread carefully**: If he conflates "simplicity" across readings (e.g., parameter count vs. Kolmogorov complexity), call it out.  
  - **Ultimate reply**: "Your maxim is either trivial (#1), technically true but nuanced (#2–#3), theoretically profound but impractical (#4–#5), or false (#6). For our data, show me the Bayesian evidence or MDL score—don’t handwave."
