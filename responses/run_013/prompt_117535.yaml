prompt: |-
  My friend and I spent an evening arguing about this and I still can't see who won. She laid out the following case for giving up on consequentialism, and my instinct is that it proves far too much:

  (1) A theory of right action earns its keep only if it sometimes ranks the options actually open to an agent.
  (2) Consequentialism ranks options by their expected value.
  (3) Expected value requires determinate probabilities for the outcomes of each option.
  (4) For almost any option, its long-run consequences are the product of chaotic amplification of tiny differences — whether I answer this email tonight or in the morning cascades into who I meet, what they do, and what happens after that — and no determinate probabilities attach to those downstream consequences.
  (5) So consequentialism assigns almost no option a determinate value.
  (6) An option with no determinate value cannot be ranked against its alternatives.
  (7) So consequentialism almost never ranks options.
  (8) So consequentialism should be abandoned.

  She then pushed further: the same reasoning applies to every option, so nothing is ever better than anything else, and the very idea of a normative ranking is a fiction. When I objected that this would wreck ordinary prudential deliberation too, she said that was fine — that it is a general truth about acting under chaos, not a problem specific to her target.

  I can't accept (8), and I'm not prepared to say that rescuing a drowning child and buying a snack come out equal; I'd like to keep the thought that consequences matter at least sometimes. So tell me which step she should give up, and what giving it up would cost her. Some of these premises look innocent to me and I can't tell which one is doing the damage.
reasoning: |-
  Okay, let me try to unpack this user's problem. Their friend made an argument against consequentialism that seems too strong, leading to the conclusion that no options can ever be ranked normatively. The user feels this can't be right but can't pinpoint where the argument goes wrong. 

  First, I need to understand the friend's chain of reasoning. The key premises are that consequentialism requires expected value calculations, which need determinate probabilities. But because of chaos theory (tiny actions having massive unpredictable effects), probabilities become indeterminate for almost all actions. So consequentialism can't rank options, making it useless.

  Hmm. The user mentions they can't accept step 8 (abandon consequentialism) because it would make rescuing a child morally equal to buying a snack. That makes sense - intuitively, consequences do matter sometimes. So where's the flaw?

  Let me examine each premise. Premise 1 seems solid - a theory should guide decisions. Premise 2 is standard consequentialism. Premise 3 about expected value needing probabilities is technically true for some interpretations. But premise 4 is where it gets interesting. The chaos theory point is valid, but does it really make probabilities indeterminate? In probability theory, we often use subjective probabilities or coarse-grained models precisely to handle uncertainty. 

  Ah! That might be the issue. The friend assumes chaotic systems prevent any probability assignments, but actually we assign probabilities to chaotic systems all the time (weather forecasts, insurance models). The probabilities might not be precise, but they're not meaningless. So premise 5 overstates the case - values can still be assigned, just with wider confidence intervals.

  Premise 6 then falls apart because even with uncertainty, options can still be ranked - saving a child has clearly better expected outcomes than snack-buying despite chaos. The friend's mistake is treating "indeterminate" as binary when it's a spectrum. 

  I notice the user is worried this argument would destroy ordinary decision-making too. That's perceptive - if chaos prevents all moral ranking, it should prevent prudential decisions as well, which feels absurd. This suggests the burden is on the friend to explain how we manage to make any decisions at all if her argument holds.

  The cost of rejecting premise 5? The friend loses her knockout punch against consequentialism, but gains a more nuanced view of decision-making under uncertainty. Consequentialists can then develop tools for bounded rationality - which is actually an active research area!

  The user seems philosophically sophisticated but frustrated. They need both technical refutation and preservation of moral intuition. I should emphasize how rejecting 5 saves ordinary moral distinctions while acknowledging the real challenge chaos poses.
answer: |-
  Your friend's argument is clever and highlights genuine challenges for consequentialism, but it fails at **premise (5)**. Consequentialism does *not* require perfectly determinate, precise probabilities for all possible outcomes to assign value or rank options. Here's why, along with the costs of rejecting each premise:

  ### The Core Problem: Premise (5) is False
  *   **(5) claims:** "Consequentialism assigns almost no option a determinate value."
  *   **Why it's false:** Consequentialism (especially *expected* value consequentialism) operates with **bounded rationality, subjective probabilities, and coarse-grained modeling**. We don't need to calculate the probability of every butterfly effect to assign a meaningful expected value.
      *   **Subjective Probabilities/Bayesianism:** Agents use their best available evidence and reasoning to form *subjective probabilities*. Even for chaotic systems, agents assign degrees of belief (e.g., "it's highly likely answering the email tonight leads to a better outcome than delaying"). These need not be perfectly precise single numbers; they can be intervals or qualitative rankings ("much more likely," "slightly less likely").
      *   **Causal Bracketing/Relevant Consequences:** Moral deliberation focuses on the **foreseeable and significant consequences** within a relevant frame. While *in principle* answering an email tonight might alter the course of history, *in practice*, the foreseeable consequences are: finishing the task, reducing stress, maintaining responsiveness, maybe affecting the recipient's next day. The overwhelming probability is that the truly chaotic, unpredictable downstream effects will average out or be negligible *for the purposes of moral comparison*. Saving a drowning child has overwhelmingly foreseeable positive consequences *relative to* buying a snack, *despite* the underlying chaos. We compare *expected* outcomes within the relevant causal horizon.
      *   **Dominance and Satisficing:** Often, one option *dominates* another across a wide range of probable futures (e.g., saving a child vs. buying a snack *always* looks better, even under chaos). Alternatively, consequentialism can adopt satisficing rules ("choose an option expected to be good enough") under extreme uncertainty.
  *   **Cost of Rejecting (5):** Your friend loses the claim that consequentialism is rendered inert by chaos. She must concede that consequentialism *can* operate with bounded information, subjective probabilities, and a focus on relevant, foreseeable consequences. It makes consequentialism less "pure" and more reliant on epistemic norms and practical framing, but this is necessary for any real-world decision theory.

  ### Examining the Other Premises
  1.  **(1) A theory earns its keep by ranking options:** *Plausible.* A normative theory should guide action. Rejecting this is costly – it makes the theory practically useless.
  2.  **(2) Consequentialism ranks by expected value:** *Standard and Fair.* This is the dominant modern formulation (e.g., rule utilitarianism reduces to act-level expected value calculations). Rejecting this abandons core consequentialism.
  3.  **(3) Expected value requires determinate probabilities:** *Misleading.* It requires *some* assignment of probabilities for calculation, but these can be **subjective, imprecise, or coarse-grained**. Strict determinacy is not necessary for practical ranking. Rejecting this requires redefining "expected value" in a way that might weaken its mathematical rigor but preserves its practical applicability.
  4.  **(4) Chaos makes downstream probabilities indeterminate:** *Partially True, but Exaggerated.* Chaos does make long-term, specific predictions impossible. However:
      *   **Subjective probabilities still apply:** Agents form beliefs based on patterns, experience, and evidence.
      *   **Relevance matters:** The *morally significant* consequences (e.g., life/death, harm/benefit) are often identifiable within a shorter, less chaotic causal frame. The chaotic amplification often affects details, not the fundamental moral valence of foreseeable core outcomes.
      *   **Averages matter:** While individual chaotic paths are unpredictable, the *expected* outcome distributions over many similar actions might still be estimable.
      *   **Cost of Rejecting (4):** You'd have to deny the reality of chaos or its epistemological implications, which is scientifically untenable.
  5.  **(6) No determinate value → No ranking:** *False if (5) is false.* If we reject (5), consequentialism *can* assign values and rank options using subjective probabilities, bracketing, dominance, etc., even under uncertainty. Rejecting this premise alone would require arguing that indeterminate value *must* imply incomparability, which is a strong (and controversial) claim about value theory.
  6.  **(7) Consequentialism almost never ranks:** *False, depends on (5) & (6).* If (5) and (6) are false, consequentialism can rank options frequently.
  7.  **(8) So abandon consequentialism:** *Unfounded, depends on prior steps.*

  ### Addressing the "Proves Too Much" Point & Prudential Deliberation
  Your instinct is correct. **Her argument *does* prove too much.** If chaos truly rendered consequentialism inert (premise 5), it would equally paralyze *all* prudential and instrumental reasoning:
  *   Should I save for retirement? (Chaos makes the future world economy indeterminate!)
  *   Should I take an umbrella? (Chaos makes the precise path of every raindrop indeterminate!)
  *   Should I rescue the child? (Chaos makes the child's future life path indeterminate!)

  **Her response ("that's fine, prudential reasoning is also a fiction") is deeply problematic.** It leads to **global normative skepticism**. If *no* action can be ranked better or worse because of chaos, then:
  *   There is no reason to prefer rescuing a child over torturing one.
  *   There is no reason to prefer eating over starving.
  *   All action becomes normatively arbitrary.

  This is radically counterintuitive and practically self-defeating. We navigate chaos constantly using probabilities, heuristics, and focusing on relevant consequences. Her argument, taken seriously, destroys the very possibility of rational action, not just consequentialism. The fact that we *do* make successful prudential decisions daily (e.g., using medicine, building bridges, investing) shows that consequential reasoning *works* despite chaos. The burden is on *her* to explain how prudential reasoning functions if her argument is sound, or to embrace this extreme skepticism.

  ### Conclusion and Recommendation
  *   **Tell your friend to give up Premise (5).** Consequentialism does not require perfectly determinate probabilities for all possible chaotic outcomes to assign value and rank options. It functions with **subjective probabilities, causal bracketing, a focus on foreseeable/relevant consequences, dominance reasoning, and satisficing** under uncertainty.
  *   **Cost to her:** She must concede that consequentialism has the resources (like all practical reasoning) to function in a chaotic world. Her argument doesn't kill consequentialism; it highlights the need for a sophisticated consequentialism that incorporates epistemology, decision theory under uncertainty, and bounded rationality. The challenge of chaos is real, but it's a challenge for *all* normative theories requiring foresight, not a unique defeater for consequentialism.
  *   **Your intuition is sound:** Rescuing the child *is* clearly better than buying a snack, and consequentialism can (and does) account for this by focusing on the overwhelming probability of immediate, significant harm prevention versus a trivial indulgence, within the relevant frame of moral deliberation. The chaotic downstream effects, while real, don't wash out *that* fundamental comparison. Consequentialism survives, albeit as a theory that must be applied with practical wisdom and acknowledgment of uncertainty.

  The damage is done by the unrealistic epistemic demand smuggled into premise (5). Once we adopt a more realistic model of how agents assign probabilities and focus on relevant consequences, consequentialism regains its normative force.
