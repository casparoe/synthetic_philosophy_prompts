prompt: |-
  I'm defending a paper next week to a causal inference group — mostly epidemiologists and biostatisticians who work in the potential-outcomes and graphical traditions, plus one philosopher of biology — and I need a Q&A prep sheet. Take the role of a philosopher of science who works on causation and can hold their own in a methods seminar; think the objections through carefully before you write, and then give me only prose — no headings, bullet points, bold text, or tables, the way you'd write a long email.

  My thesis: beliefs and intentions are genuine difference-making causes of behaviour, and the standard exclusion argument — every physical effect already has a sufficient physical cause, mental properties supervene on the physical ones, so the mental is left with no causal work to do — fails because it presupposes a production-style, finest-grain account of what a cause is. Under an interventionist, difference-making account constrained by something like proportionality (the cause is the property at the grain of description that actually makes the difference to the outcome, neither finer nor coarser), the mental property comes out as the cause of the behaviour and the neurophysiological detail as too fine-grained to be the difference-maker. I also want to argue that if the exclusion argument worked it would equally show that poverty doesn't cause disease, which is where I expect real trouble.

  Give me the objections I'll actually get from this room, phrased in their vocabulary, ordered by how likely and how damaging they are; a two-minute reply to each; a note on where each reply is soft; what I should concede up front; the one reply that has to land for the paper to survive; and the question I'm hoping nobody asks.
reasoning: |-
  Okay, the user is defending their paper to a causal inference group that includes epidemiologists, biostatisticians, and a philosopher of biology. They need a Q&A prep sheet. Their thesis is that beliefs and intentions are genuine difference-making causes of behavior, countering the exclusion argument by using an interventionist, proportionality-constrained account. They also argue that if exclusion worked, it would invalidate causes like poverty causing disease.

  First, I need to anticipate objections from this audience. Since they work with potential outcomes and graphical models, they'll likely focus on methodological issues. The main objection might be about causal specificity—how can mental properties be causes if they supervene on physical ones? They might argue that neuro details are necessary for actual causation. 

  The user's reply should emphasize proportionality: mental states are the right grain for behavioral outcomes. But where is this soft? Proportionality isn't always straightforward in causal models. They might ask for criteria to determine the "right" grain. The user should concede that neural details matter for mechanisms but hold that difference-making operates at a higher level.

  Another big objection: if mental states cause behavior, wouldn't that violate physical causal closure? The user needs to clarify that they're not denying physical causes but reframing causation as difference-making. However, this might not satisfy those who see causation as production-based. The user must stress that difference-making is what matters in sciences like epidemiology.

  The poverty example is crucial. If exclusion eliminates mental causes, it should also eliminate poverty causing disease since poverty supervenes on individual factors. Epidemiologists would reject that, so the user can argue that consistency requires accepting higher-level causes. But opponents might counter that poverty is a macro-variable with clear interventions, unlike mental states. The user's reply must show that both are similarly difference-making.

  Key questions: How to handle multiple grains? The user should admit that different questions require different levels but that proportionality optimizes for relevance. The philosopher might ask about overdetermination—user should note that difference-making avoids this by focusing on actual dependencies.

  The make-or-break point: the poverty analogy. If they can show that rejecting mental causes undermines social epidemiology, that could sway the audience. The user must prepare solid examples and preempt disanalogies.

  The worst question might be about defining proportionality rigorously. The user should acknowledge it's context-dependent but point to literature like Woodward or List. Also, if someone asks for empirical evidence of mental states as difference-makers beyond neural correlates, that's tough. User could reference neuroeconomics or psych studies, but it's a vulnerability.

  Concessions: Neural mechanisms are necessary; causation as production isn't wrong but incomplete; proportionality criteria need refinement. But stand firm on the necessity of higher-level causes for explanation.

  Overall, structure objections by likelihood: causal specificity and closure first, then proportionality challenges, then the poverty analogy. Ensure each reply ties back to the interventionist framework and highlights pragmatism in causal modeling.
answer: |-
  Here are the objections you'll face, ordered by likelihood and potential damage, with replies, soft spots, concessions, and critical points. Expect precise, skeptical questions grounded in potential outcomes and causal graphs, with the philosopher probing metaphysical coherence.

  **Most Likely & Damaging: Causal Specificity Challenge.** "If we take your difference-making account seriously, we must ask: what level actually has the causal *specificity*? Imagine intervening on the belief state: it could be realized by countless neural states. But if those neural states don't all map *perfectly* 1:1 to the behavioral outcome—if some neural realizations under the same belief lead to slightly different behaviors—then the belief isn't the *actual* difference-maker. Only the specific neural state has the precision to account for the exact behavioral output. Your proportionality argument ignores that behavior is physically implemented; the neural state is necessary and sufficient for the *specific* effect, while the belief is too coarse-grained, masking heterogeneity. This is why we need fine-grained mediation analysis."

  *   **Reply (2-min):** "You're conflating two types of specificity. Yes, the neural state specifies the *exact physical motion*. But the behavioral outcome we explain (e.g., 'reaching for water') is itself coarse-grained—it's multiply realizable by different motions. The belief 'I am thirsty' makes a systematic difference to whether *some* water-reaching behavior occurs across contexts, robust to neural variations that don't alter the functional outcome. An intervention changing *only* the belief (while holding fixed background neural architecture) changes behavior systematically. An intervention changing only a *specific* neural configuration *without* altering the belief might change the exact motor sequence but not the fact of water-reaching. The belief is proportional: it's what actually varies to make the difference at the *behavioral* grain. Insisting on neural grain specificity here is like demanding the quantum state of a spark plug to explain why a car starts—it misses the relevant causal structure."
  *   **Soft Spot:** Proving the counterfactual—that changing only a neural detail without belief change wouldn't alter the behavioral outcome *type*—requires strong assumptions about neural realization independence, which is empirically contestable.
  *   **Concede Up Front:** Neural states are necessary for implementation, and for explaining *exact* physical outputs, beliefs are not magic.

  **Highly Likely: Causal Closure / Production Intuition.** "Potential outcomes and DAGs are tools, but they rest on a physical ontology. Every physical effect *is* fully determined by prior physical causes. Your mental 'difference-maker' is supervenient—it's not an *additional* physical force. If we accept the causal completeness of physics (which our graphical models assume), then positing mental causes seems like double-counting or epiphenomenalism. The physical cause preempts the mental one. How does your account resolve this without violating physical causal closure? Difference-making might be epistemologically useful, but ontologically, it's the physics doing the work."

  *   **Reply (2-min):** "This objection assumes causation must be about *production* or *energy transfer*. But in causal inference—especially in your fields—we *routinely* treat higher-level, supervenient properties as causes. Consider 'poverty causes disease.' Poverty supervenes on a vast array of individual material and social factors. There's no 'poverty force' beyond those factors. Yet, you *rightly* model poverty as a cause because intervening on the *aggregate property* (e.g., via policy transfers) makes a difference to health outcomes, even though every physical effect has sufficient physical micro-causes. My claim is identical: beliefs are macro-properties that are difference-makers *within* the physical causal net. Causal closure isn't violated because the belief *is* realized physically; we're just identifying the *level* at which the relevant variation occurs for explaining behavioral patterns. Your own work relies on this when you use 'diet,' 'stress,' or 'access to care'—not quarks—as causes."
  *   **Soft Spot:** Doesn't fully dispel the intuition that the *real* pushing and pulling is only at the microphysical level; it sidesteps rather than refutes production metaphysics.
  *   **Concede Up Front:** Mental properties aren't fundamental physical forces; they are realized by and dependent on physical substrates.

  **Likely: Ambiguity of Proportionality / Grain Selection.** "Proportionality is underspecified. *Who* decides the 'right' grain? You say the neural detail is 'too fine,' but why? If I want to predict the *exact* millisecond timing of a button press, the neural state might be proportional. If I want to explain abstract action choice, maybe the belief is. This seems pragmatic, not ontological. Your argument reduces to 'coarse grains are useful for explanation'—which we agree with—but doesn't show beliefs are *genuine* causes in a way neural states aren't. Isn't this just about modeling choices?"

  *   **Reply (2-min):** "It's not *merely* pragmatic; it's about objective dependencies in the system. Proportionality minimizes *both* overly specific causes (including irrelevant details) *and* overly general ones (missing crucial specifics). For 'pressing the button *because* you want water,' the desire is proportional: varying the desire (thirsty/not) changes the button press; varying irrelevant neural details (e.g., which exact neurons fire first) doesn't change *whether* the press occurs, given the desire. The neural state is *disproportionate*: it includes details irrelevant to the outcome under study. Crucially, the *causal relevance* is objective: an intervention on the belief affects the outcome, while many micro-details don't. The grain isn't arbitrary; it's fixed by what actually varies to make the difference for the effect *as characterized*. Epidemiology does this: studying 'smoking' vs. 'tar exposure level N' vs. 'specific DNA adduct formation' depends on the effect (lung cancer incidence vs. tumor histology)."
  *   **Soft Spot:** Requires a robust account of "irrelevant detail," which can be context-dependent. Also, concedes that for *some* effects (e.g., precise timing), neural states *are* proportional.
  *   **Concede Up Front:** Proportionality is relative to the effect variable's grain, and there can be multiple legitimate causal models for different purposes.

  **Likely & Damaging: The Poverty Analogy Pushback.** "Your poverty analogy is flawed. Poverty is a macro-variable, but it often *mediates* the effect of myriad micro-factors on health. We model it as a cause because we can intervene on it *as a variable* (e.g., cash transfers). But beliefs? We don't intervene on beliefs directly—we intervene *physically* (e.g., neural stimulation, sensory input). The belief is just an *indicator* or *state* along the causal path. Furthermore, poverty isn't 'excluded' by its micro-realizers because those micro-realizers (e.g., income level, sanitation) *themselves* aren't usually sufficient physical causes; they require the macro-context. Neural states *are* sufficient. The analogy fails."

  *   **Reply (2-min):** "Three responses. First, *how* we intervene doesn't define the cause. We intervene on blood pressure medication (physical) to change hypertension (physiological state), which causes reduced stroke risk. The physiological state is the cause. Similarly, we intervene via speech (physical) to change beliefs (mental state), which causes behavior. The mental state is the cause. Second, while some micro-realizers of poverty aren't sufficient alone (a single dollar isn't poverty), a *specific* micro-state realizing poverty *is* sufficient for its effects *in that context* (e.g., this specific lack of food causing *this* malnutrition). Yet you still cite poverty as the cause. Third, neural states *within an individual* are sufficient, but beliefs *type-identify* patterns across individuals and contexts. Crucially, if you accept that poverty is a cause *despite* supervenience and micro-sufficiency, consistency demands accepting beliefs as causes. Denying it privileges physical grain ontology over difference-making efficacy, undermining social epidemiology."
  *   **Soft Spot:** The "sufficiency in context" point for poverty micro-states is tricky; opponents may argue poverty adds nothing beyond the aggregated micro-states, while beliefs might not.
  *   **Concede Up Front:** Direct physical intervenability on beliefs is limited compared to macro-social variables; our inferences often rely on mediation.

  **The Philosopher's Challenge (Likely Metaphysical): Overdetermination or Exclusion Recast.** "Even granting difference-making, isn't the problem *systematic overdetermination*? Every behavioral effect has *two* sufficient difference-makers: the fine-grained neural state (N) and the coarse-grained belief (B). But B supervenes on N, meaning whenever B is present, N is present. So every effect seems causally overdetermined by B and N—which is absurd. Alternatively, if N is the realizer of B, doesn't N *screen off* B? If I condition on the precise neural state N, does the belief B add any *independent* difference-making power for the physical behavior? If not, B is excluded."

  *   **Reply (2-min):** "This misunderstands difference-making causation. It's not that N and B are *two independent* sufficient causes. B *is realized by* N. The system doesn't have two causes; it has a cause described at two grains. The difference-making power isn't additive. Conditioning on the *specific* N might screen off B *for that specific instance*, but that's irrelevant. Causation is about *dependencies under intervention*. Intervening to set B (e.g., induce thirst belief via different neural pathways) still changes behavior, regardless of the specific N realizing it. The relevant counterfactual isn't 'If N had been different while B magically stayed the same?' (which may be impossible); it's 'If B had been different (via *some* physically possible intervention), would behavior change?' Yes. N is the *mechanism* by which B works in a given instance, but B is the *variable* that tracks the systematic difference-maker across instances. Overdetermination only arises if you insist on counting distinct physical entities, which B and N aren't."
  *   **Soft Spot:** Requires accepting that causation primarily concerns variables and interventions, not events or substances. Philosophers wedded to event causation may remain unconvinced.
  *   **Concede Up Front:** Within a single instance, given the specific realization, the neural state provides the complete proximal account.

  **The Make-or-Break Reply (Land This):** The success of your paper hinges on **forcefully defending the poverty analogy** against the charge of disanalogy. You must establish that epidemiologists are deeply committed to macro-level, supervenient causes like poverty, SES, or diet, and that their causal models rely on the difference-making power of these variables *despite* their physical realization and the potential sufficiency of micro-states in context. Argue that rejecting mental causation on exclusion grounds *directly undermines* the legitimacy of these core epidemiological causes. If they want to keep 'poverty causes disease,' they must accept the same causal structure for 'belief causes behavior.' Frame rejection as ontologically inconsistent or as surrendering to an untenable micro-reductionism that cripples their own science.

  **The Question You Hope Nobody Asks:** "Can you provide a concrete, *non-mental* example from neuroscience or psychology where a high-level proportional difference-maker (like a belief) is *empirically demonstrated* to be causally efficacious *while* a lower-level neural state is shown *not* to be the difference-maker (only the mechanism), controlling for confounders? If proportionality is objective, this should be testable. Otherwise, isn't this just a philosophical assertion layered onto your preferred causal framework?"

  *   **Why it's Dangerous:** It demands empirical proof of the core ontological claim beyond analogous reasoning. Designing such a clean test separating proportional mental cause from merely mechanistic neural realizer, controlling for confounders, is fiendishly difficult. Your argument relies on conceptual coherence and analogy, not a smoking-gun experiment. Answering requires speculating on complex neuro-experimental paradigms (e.g., multivariate decoding showing behavioral predictions rely on abstract representations, not specific neural codes) which opens methodological debates you may not win in this room. Deflect carefully towards the conceptual necessity and consistency with successful causal practice in other domains.

  **Overall Concession Strategy:** Start by affirming the value of fine-grained causal-mechanical models for understanding implementation. Emphasize you are not denying neural mechanisms, nor physical causal closure. Frame your argument as clarifying the *level* at which scientifically useful, robust difference-making causation operates for explaining behavior, paralleling how macro-variables function in their fields. Your target is the *exclusion argument's inference*, not neuroscience itself.
