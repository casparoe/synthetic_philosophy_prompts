  **Speech:**

  Good evening, everyone. It’s good to be here, gathered among these stones and stories that hold so much of us. Four generations rest here. That’s a deep root. It matters.

  Now, we all see that window up there. Great-Great-Grandfather’s name in glass. It’s part of the fabric of this place, part of *our* fabric. And like any family, our fabric has complex threads. Some threads feel like pride, some feel like pain, depending on where you stand. That’s the nature of deep history, isn’t it? It’s never simple, and it’s certainly never finished.

  Spending time in Berlin, you see history dealt with head-on, every day. Not as a single confession box moment, but as a permanent part of the landscape. Memorials aren't hidden, but they *are* explained. They force the question: "What does this mean *now*?" The grandchildren aren't blamed for the past, but they *are* asked to be responsible for how it’s remembered. It’s a living process, always.

  Think of other places. Japan: official apologies exist, yet quiet counter-memorials whisper something else. Turkey: a whole chapter can’t even be named aloud. And here? Our struggle wasn’t always flat denial. Sometimes, it was romance. Making something painful look noble, even lovely. And lovely… well, lovely can be the hardest story to question. It wraps the hard truth in velvet.

  But here’s what I learned: Remembering one hard truth doesn’t erase another. It doesn't compete. Actually, doing it right gives us the *tools* – the vocabulary, the practice – to face the next hard truth, whatever it might be, wherever it might surface in our lives. It builds resilience in understanding.

  So, what do we *do* with that window? It’s part of the building. Part of *our* history. Removing it feels like trying to erase a thread, and that thread is woven in. But leaving it *only* as it is... that leaves the romance unchallenged. It leaves the hardest part of the story unsaid.

  Here’s a small, concrete step: **Let’s add a panel or a plaque right beside it.** Not to shame, but to state plainly. Who he was. What that cause truly stood for. And crucially, what this family *did next* – how we lived on this land, raised families, built community *after* that war. Let the full story sit there, together. The name, the context, the consequence. Let the romance rest beside the reality. Not hidden, not shouted, just… there. For us, now, and for the kids who’ll stand here long after us. It’s not about guilt. It’s about taking responsibility for the story we tell in this place we hold dear. It’s how we keep our roots strong *and* honest.

