prompt: |-
  My family's having a reunion next month at the little church outside town where four generations of us are buried, and my aunt has asked me to do the after-dinner remarks, like four minutes. Here's the thing: there's a stained-glass window in that church with my great-great-grandfather's name on it, and he was a Confederate officer, and now half the family wants the window out and the other half is treating that like a desecration. I got picked to speak because I'm the one who spent a year in Berlin and won't shut up about it. Room will be maybe sixty people: my 88-year-old great-aunt and her crowd, a cousin who teaches high school history, a bunch of kids, some in-laws who married in and have no dog in this fight.

  What I want from the speech is that it makes the case for one small concrete thing — not pulling the window, but putting something next to it, a second panel or a plaque that says plainly who he was and what the family did with the land afterward. It has to do that without turning the reunion into a seminar and without asking anybody's grandmother to confess anything.

  Use the comparative angle, thats the part I actually care about. The German version of reckoning, where the whole point is that it's permanent, taught in schools, and never "finished," and where the grandchildren are not guilty but are responsible anyway — that distinction is doing the work for me. Japan, where you get the official apologies and then something else at the shrine that says the opposite. Turkey, where the state still won't say the word. And here, where the problem was never really denial so much as romance — the songs and the statues made it lovely, and lovely is harder to argue with than a lie. Also, I keep going back and forth on this: whether remembering one atrocity competes with remembering another, or whether it hands you the vocabulary for the next one. I want the speech to land on the second without pretending the first isn't a real risk in a family where everyone's carrying their own grievance. No quotes, no citations, nobody's theory by name. And please don't end it on some note about history bending toward justice, my cousins will gag.

  After the speech, give me a short JSON summary with these fields: "occasion" (one line, who's in the room and why), "the_concrete_ask" (the single thing the speech asks the family to do, one sentence), "memory_cultures_used" (array of four objects, each with "case", "practice_or_episode" — what the speech actually refers to — and "job_it_does", the work that reference performs rather than just naming it), "load_bearing_distinction" (two sentences on the guilt-versus-responsibility or competing-memory idea the speech rests on), "line_most_likely_to_lose_the_room" (the sentence, and which group it loses), and "deliberately_left_out" (two or three things I chose not to say and why).
