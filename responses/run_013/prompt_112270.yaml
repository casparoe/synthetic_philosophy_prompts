  ### Decision Tree: Do Probes Reveal Genuine Representations in Neural Networks?

  **Starting Point**: A trained network is a fixed function (a pile of numbers). Nothing in the training objective mentions meaning, truth, or content. Probes are linear classifiers trained on labeled data to predict features (e.g., "about a city") from activations.

  #### Branch Questions
  1. **Case (a) similarity**: Two different networks (architectures/data) have nearly identical linear directions for "about a city." Is this similarity evidence of an *objective structural property* of the networks?  
     - **Yes** → Q2  
     - **No** → Q5  

  2. **Case (b) random labels**: The same layer supports accurate probes for both source documents (meaningful) and *randomly assigned labels*. Does the random-label probe’s success imply there is **no inherent meaningful content** in the activations?  
     - **Yes** → Q8  
     - **No** → Q3  

  3. **Case (c) knockout**: Knocking out the "about a city" direction doesn’t hurt performance, but changing inputs (as the probe detects) alters outputs. Is this direction **causally necessary** for the network’s function?  
     - **Yes** → Q4  
     - **No** → Q9  

  4. **Geophysics rule**: For the direction to "represent" (e.g., "about a city"), must it **generalize** to new situations (outside training/distribution)?  
     - **Yes** → Leaf 6  
     - **No** → Leaf 1  

  5. **Case (b) probe flexibility**: Is the random-label probe’s success best explained by **flexibility of the probe method** (not the network)?  
     - **Yes** → Q6  
     - **No** → Q7  

  6. **Case (d) lookup table**: If the network were a lookup table (same I/O, no internals), would it "represent" the world?  
     - **Yes** → Leaf 4  
     - **No** → Leaf 3  

  7. **Training role**: Is the "content" of a feature (e.g., "city") fixed by **what it was selected for during training**?  
     - **Yes** → Leaf 6  
     - **No** → Leaf 1  

  8. **Usefulness of structure**: Despite no inherent content (from Q2), is the structure found by probes **useful for understanding** the network?  
     - **Yes** → Leaf 2  
     - **No** → Leaf 5  

  9. **Geophysics rule (non-causal)**: For the direction to "represent," must it **generalize** to new situations?  
     - **Yes** → Leaf 2  
     - **No** → Leaf 2  

  ---

  #### Leaves (Positions)
  1. **Leaf 1: Yes, probes find real content**  
     - *Path*: Q1=Y, Q2=N, Q3=Y, Q4=N  
     - **Awkward commitment**: Content exists even if it doesn’t generalize beyond training data.  
