answer: |-
  ### Ordering and Rationale
  1. **Causal relatum (Q1)**: Foundational to defining omissions metaphysically; all other questions presuppose an answer here.  
  2. **Norm-relativity (Q2)**: Determines objectivity of causal claims, impacting ethics/law applications directly.  
  3. **Difference-making & contrast classes (Q4)**: Solves promiscuity problem; essential for coherent omission-inclusive causation.  
  4. **Act/omission asymmetry (Q7)**: Tests practical implications, but requires prior metaphysical groundwork.  
  5. **Non-agent omissions (Q6)**: Extends normativity debate, less urgent without Q2 settled.  
  6. **Collective omissions (Q5)**: Technically dependent on Q4; intractable without resolving difference-making.  
  7. **Prevention/double-prevention (Q3)**: Narrower scope; solvable derivatively if Q1–Q4 are addressed.  

  ---

  ### Top Three  
  **1. Causal Relatum (Q1)**  
  *Why upstream?* Defining omissions (as absences, negative events, or facts) underpins all ontological commitments. If omissions *are* negative entities, Q2’s norm-relativity becomes unavoidable; if they’re facts, Q4’s contrast classes gain traction. Without this, theories risk incoherence or tacitly smuggling in presuppositions.  
  *Tractability*: Ideal for solo work—engage debates in Armstrong/Dowe (events) vs. Mellor/Factivists. Conceptual tools suffice to test consistency with causation’s core features (e.g., transitivity).  
  *Confirmation of priority*: Success means a defensible ontology that either (a) avoids negative entities without ad hoc constraints or (b) justifies them while blocking Q4’s promiscuity.  

  **2. Norm-Relativity (Q2)**  
  *Why upstream?* Determines whether omissions are causes *only* against normative backdrops (e.g., Schaffer) or objectively (e.g., Beebee). This bifurcation shapes Q4’s contrast-class necessity, Q6’s extension to non-agents, and Q7’s ethical asymmetry. If norms *are* essential, ethics/law distinctions gain metaphysical support; if not, they risk being pragmatic fictions.  
  *Tractability*: Analyze "expectation" in legal/medical cases (e.g., *R v Gibbins*) or default assumptions in causal models. Requires no empirics—only conceptual dissection of "normal conditions."  
  *Confirmation of priority*: A clear account of how/if norms integrate with causation (e.g., via causal models’ default settings) that either vindicates or collapses the act/omission distinction.  

  **3. Difference-Making & Contrast Classes (Q4)**  
  *Why upstream?* Promiscuity (every absence as cause) is the central technical obstacle for theories like counterfactualism. Resolving this via contrast classes (e.g., Schaffer) or fragility (e.g., Lewis) directly enables Q5 (collective omissions) and constrains Q1/Q2. If contrast classes work, they may also simplify Q3 (prevention).  
  *Tractability*: Rigorously test counterfactual accounts (e.g., Lewis, Paul) against omission cases. Use conceptual tools to refine contrastivity (e.g., "X rather than Y" structures).  
  *Confirmation of priority*: A modified difference-making framework that admits *some* omissions (e.g., failures to act) but excludes trivial absences (e.g., the White House’s failure to stop a drought), without relying on norms (Q2) as a crutch.  

  ---

  ### Dependencies  
  - **Q5 (collective omissions) hinges entirely on Q4**: Without resolving promiscuity, aggregating non-difference-makers is incoherent.  
  - **Q6 (non-agent omissions) depends on Q2**: If norms aren’t essential to omission-causation, machines could "omit" without ethical expectations; if norms *are* essential, Q6 reduces to specifying which systems bear "responsibilities."  
  - **Q7 (asymmetry) relies on Q1 and Q2**: If omissions are ontologically distinct (Q1) and norm-relative (Q2), the ethical asymmetry holds; if not, it collapses.  
  - **Fragility**: If Q1 concludes omissions are *not* real (e.g., eliminativism), Q2–Q7 become moot. If Q4’s promiscuity remains unresolved, Q5 and ethical applications (Q7) fail.  

  ---

  ### Deprioritized  
  Defer **Q3 (prevention/double-prevention)** and **Q5 (collective omissions)**. Q3 is a subset of general causation theory—solutions may emerge from Q1/Q4. Q5 is currently intractable: without Q4, "aggregate difference-making" lacks a framework. **Q6 (non-agents)** is emerging but secondary to Q2’s core normativity debate. You lose direct engagement with cutting-edge topics (e.g., AI ethics) and collective responsibility puzzles. However, this preserves focus: solving Q1/Q2/Q4 provides tools to attack these later, whereas starting with them risks fragmenting your core argument.  

  ---

  ### What Would Change the Ordering  
  - **If consensus emerges on relata (Q1)**: Q2 (norm-relativity) would ascend, as its stakes heighten once ontology is fixed.  
  - **If Q4’s promiscuity is "solved" unexpectedly** (e.g., via causal modeling advances): Q5 (collective omissions) jumps to #1 due to urgency for climate ethics, and Q7 (asymmetry) gains prominence for testing applications.  
  - **If legal scholarship shifts**: A surge in AI liability cases could elevate Q6 (non-agent omissions) by demanding norms for non-human systems. Conversely, if courts abandon the act/omission distinction (e.g., in end-of-life rulings), Q7 becomes critical immediately.  
  - **Key developments to monitor**: New work on causal modeling (e.g., structural equations accommodating omissions) or metaphysicians conceding norm-dependence (e.g., in recent *Phil Studies* symposia).
