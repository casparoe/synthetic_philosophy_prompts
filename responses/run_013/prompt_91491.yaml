answer: |-
  Here is the exam question, model answer, and marking scheme as requested, drafted in British English.

  ---

  **Exam Question**

  **Scenario:**
  The region of Northmarch is holding a referendum on independence from the nation of Veridia. A major dispute arises over the franchise. Pro-independence campaigners argue the electoral roll should be frozen at a date five years prior, excluding recent arrivals (predominantly civil servants posted from the Veridian mainland and their families). They claim these individuals lack genuine commitment to Northmarch’s future. Unionists counter that this disenfranchises current residents, violates democratic equality, and unfairly advantages those who happened to reside in Northmarch at an arbitrary historical moment. Simultaneously, citizens in the rest of Veridia argue they are profoundly affected by the potential outcomes (national debt apportionment, border security, economic disruption) yet have no vote. After protracted negotiation, a compromise is reached: a ‘concurrent majority’. Independence will be approved only if it secures a majority *within* the proposed Northmarch state (using a modified franchise based on residency at the *current* date, not the frozen one) *and* secures a majority in a separate, advisory nationwide ballot across the *entirety* of Veridia.

  **Question:**
  Does the ‘concurrent majority’ compromise successfully resolve the boundary problem inherent in defining the Northmarch referendum demos? Analyse whether this approach:
  1.  Solves the core problem of democratic inclusion,
  2.  Merely displaces the boundary problem to another level (e.g., defining ‘Veridia’ or ‘residency’), or
  3.  Reveals the boundary problem as an unavoidable circularity within democratic theory itself.

  In your answer, critically evaluate the coherence of employing two distinct inclusion criteria (residency for the inner vote, nationwide citizenship for the outer vote) within a single decision-making process. Ultimately, argue whether the persistence of such boundary disputes signifies a fatal flaw in democratic legitimacy or an inherent tension that democratic practice must continually negotiate. (20 marks)

  ---

  **Model Answer (Approx. 700 words)**

  The Northmarch concurrent majority compromise is an ingenious political fudge but a theoretically incoherent solution to the boundary problem. It fails to resolve the core issue of democratic inclusion, instead displacing and compounding the difficulty, thereby demonstrating the fundamental circularity – arguably an inherent feature rather than a flaw – of democratic legitimacy concerning the 'demos'.

  Superficially, the compromise addresses the immediate conflicts. The shift to *current* residency for the inner vote mitigates the unionist objection against disenfranchising present inhabitants. The advisory outer vote acknowledges the undeniable material impact on the rest of Veridia. Requiring a double majority appears to balance internal self-determination with external recognition of affectedness. However, this very structure exposes its incoherence. The inner vote employs a *residency-based* criterion, implying that subjection to the future Northmarch state’s coercive power grounds inclusion. The outer vote, conversely, employs a *nationwide citizenship* criterion, grounded implicitly in the *all-affected interests* principle – the entire Veridian populace is deemed sufficiently affected to warrant consultation. These are distinct, potentially conflicting, logics of inclusion bundled into one process. The compromise doesn't synthesise them; it runs them in parallel, creating a dual-source legitimacy claim that remains conceptually fractured. Why is residency the only relevant factor for the inner vote if Veridian citizens elsewhere are demonstrably affected? Why is mere affectedness sufficient for an advisory vote, but not a decisive one, especially when the outcome binds them? The compromise avoids answering these questions, merely papering over the clash of principles.

  This incoherence highlights how the compromise displaces rather than resolves the boundary problem. Defining the inner demos relies on 'residency', but this itself is a contested boundary (e.g., duration required, intentions of residents). More significantly, the outer vote presupposes the legitimacy and fixed boundaries of the *existing* Veridian demos. Yet, Veridia’s own boundaries are the product of historical contingencies and past, equally contestable, decisions about inclusion and exclusion – decisions potentially challenged by Northmarch’s very secession attempt. The ‘Veridia’ deemed affected is itself an entity whose democratic boundaries are assumed, not justified, within this process. The boundary problem is kicked back a step: Who *rightfully* constitutes ‘Veridia’ for the purposes of this vote? The compromise provides no principled answer; it relies on the status quo ante, effectively treating the existing national boundary as the default legitimate unit when convenient for the outer vote, while simultaneously contemplating its dissolution for the inner vote. This is not resolution; it is regress masked by procedure.

  Consequently, the Northmarch case powerfully illustrates that the circularity of the boundary problem – the need for the demos to define itself democratically – is not a false dilemma but an unavoidable regress inherent in the foundational act of constituting a political community. Democracy presupposes a ‘people’ to authorise decisions, but defining that ‘people’ is itself a constitutive political act demanding authorisation. The concurrent majority, far from solving this, makes it starkly visible through its internal tensions and reliance on pre-existing, unexamined boundaries. It demonstrates that attempts to find a single, objective, non-circular criterion (like ‘all affected’ or ‘all subjected’) inevitably collapse when applied to foundational questions like secession, where the very existence and jurisdiction of the polity are at stake.

  Therefore, the persistence of such disputes does not signify a fatal flaw demanding abandonment of democracy, but reveals its core, perpetual tension. Democratic legitimacy is not about discovering a pre-political, perfectly bounded demos through theory; it is about the ongoing, inherently contested, and often messy *practice* of political community formation and negotiation. The boundary problem cannot be definitively ‘solved’ by theoretical fiat or perfect procedure because boundaries are expressions of political power, identity, and history, constantly subject to challenge and renegotiation. The concurrent majority is a pragmatic recognition of conflicting legitimate claims in a specific context. Its value lies in facilitating a decision under deep disagreement, not in providing theoretical purity. It exemplifies democracy not as a machine producing uncontestable legitimacy from flawless inputs, but as an arena for negotiating the very terms of belonging and authority amidst irreducible pluralism and competing claims. The circularity isn't defeated; it's the space where democratic politics happens.

  ---

  **Marking Scheme (Out of 20)**

  **A Grade (17-20):** Demonstrates sophisticated understanding, critical analysis, and original synthesis. Explicitly identifies inherent tensions and defends a nuanced position on the circularity/regress.

  1.  **Analysis of Compromise's Incoherence (4 marks):** Clearly identifies and explains the conflict between the residency (all-subjected?) criterion for the inner vote and the nationwide citizenship (all-affected?) criterion for the outer vote, arguing why this constitutes a theoretical inconsistency within the single process. *(Common B/C error: Only describes the two criteria without demonstrating their conflict or incoherence within the concurrent majority logic.)*
  2.  **Displacement/Regress Argument (4 marks):** Convincingly argues how the compromise displaces the boundary problem, particularly by highlighting the unexamined assumption of Veridia’s existing boundaries as the legitimate demos for the outer vote, thereby creating a regress. *(Common B/C error: States it moves the problem but doesn't articulate *how* (e.g., reliance on contested residency definition or unexamined national boundaries) or the significance of this regress.)*
  3.  **Engagement with Circularity/Regress (5 marks):** Takes a clear, well-argued stance on whether the persistence of the boundary problem represents an unavoidable circularity/regress inherent in democracy, or a false dilemma. Sophisticated answers will argue it is inherent *and* explore the implications of this for democratic theory/practice (e.g., constitutive tension, rejection of perfect procedural solutions). *(A-B divide: A answers explicitly frame the circularity as constitutive/inherent and explore its consequences; B answers recognise the circularity but may treat it more as an unsolved puzzle than a defining feature.)*
  4.  **Evaluation of Democratic Legitimacy (4 marks):** Provides a coherent verdict on whether the compromise resolves the legitimacy issues, linked to points 1-3, and offers a nuanced perspective on whether such boundary disputes undermine democracy or are part of its essence. *(A-B divide: A answers offer a sophisticated defence of democracy *despite* or even *because of* this tension; B answers may conclude it's messy but necessary without deeper theoretical justification.)*
  5.  **Structure, Clarity & Argumentation (3 marks):** Logically structured, clearly written, avoids summary/description, presents a sustained, coherent argument directly answering the question throughout. *(Common error: Descriptive summaries of the case or theories without sustained critical argument relevant to the question.)*

  **B Grade (13-16):** Shows good understanding and analysis but lacks the depth, synthesis, or originality of an A. Correctly identifies key issues (incoherence, displacement) and recognises the circularity, but the analysis may be less developed or the stance on the circularity less sophisticated or explicitly defended. May rely more on applying standard positions (affected/subjected) descriptively rather than critically analysing their clash within the compromise.

  **C Grade (9-12):** Demonstrates basic understanding of the boundary problem and the case specifics. May identify one aspect of the compromise's difficulty (e.g., two different criteria) or mention displacement/circularity, but analysis is superficial, descriptive, or lacks clear argumentation. May fail to connect the case specifics effectively to the broader theoretical question about circularity/legitimacy.

  **D Grade (5-8):** Limited understanding. Describes the case or basic concepts of the boundary problem inaccurately or very simplistically. Little or no critical analysis of the compromise or the theoretical questions posed.

  **E Grade (1-4):** Seriously incomplete or inaccurate. Fails to address the core requirements of the question.

  **F Grade (0):** No relevant answer.

  ---
  This exam question forces engagement with the practical incoherence of the compromise, pushes students to confront the regress, and demands a verdict on the nature of the boundary problem itself. The marking scheme explicitly rewards the critical moves needed to reach an A grade, moving beyond description to analysis, synthesis, and theoretical positioning. The model answer demonstrates the depth of argument expected for a top mark, fully engaging with the scenario's tensions and using them to explore the fundamental circularity of democratic foundations.
