prompt: |-
  So I'm a few years into a PhD doing ecological and epidemiological modeling, and I've noticed I'm totaly inconsistent about which false assumptions in a model bother me. I've been keeping a list to try to figure out if there's a rule, or if I'm just protective of the idealizations my own subfield happens to use. Here's where my gut lands.

  - No friction and no air resistance in a ballistics problem: fine, obviously.
  - Ideal gas, point particles that don't interact: fine as long as you stay at low pressure.
  - Infinite population size in a model of genetic drift: fine.
  - Infinite population size when what I actually want is the extinction probability of a bird down to 40 individuals: not fine. That's the entire ballgame.
  - Well-mixed population, everyone contacts everyone at the same rate, for a fast respiratory bug in a dense city: fine.
  - Same well-mixed assumption for something spreading down a river network: not fine.
  - No mutation over 20 years in a model of a species' range shift: fine.
  - No mutation over 200,000 years: not fine, come on.
  - No gene flow between two populations when I'm dating their split: not fine. That's exactly the quantity I'm trying to zero out.
  - Ignoring air resistance when I want to know how far a cannonball flies: fine, same as the first one.
  - Replacing a whole heterogeneous population with one representative individual in an econ model of a carbon tax: not fine, and this one actually annoys me.
  - Replacing a whole heterogeneous population with one average individual when I want the average efficacy of a vaccine: fine. I don't see the problem.
  - A linear model over a narrow range where the truth is curved: fine.
  - A linear model over a huge range where the truth clearly saturates: not fine.
  - A closed population, no immigration and no emigration, where in reality both are large but roughly cancel: I want to say fine, but it makes me nervous, like I'd be getting the right answer for the wrong reason.

  And the one I flip-flop on: assuming gene flow is zero when I know it's small but have no clue how small. My instinct says not fine, same as the dating case. But a collegue says it's different because at least I know which direction the bias goes, and now I don't trust my instinct.

  Two people have offered me rules and I don't think either works. One says it's Jensen's inequality: if the quantity you care about is a nonlinear function of whatever you're averaging over, averaging is a mistake, otherwise it's harmless. But that seems to condemn the vaccine case, which I'm sure is fine, and it doesn't explain the friction case at all. The other says it's just about size, that an idealization is OK when the neglected effect is small relative to what you're measuring. But friction on a cannonball is not small and I still say fine, and gene flow between diverging populations is usually tiny and I still say not fine. So I'm the wrong way around on both, and that rule is dead.

  My own suspicion is that the real cut is between assumptions that are scaffolding for the question I'm asking and assumptions that are load-bearing for the answer, where load-bearing means that if you relaxed it, the conclusion would flip, or shrink to nothing, or stop being about the thing I claimed it was about. But I can't tell if that's a real distinction or just a dressed-up way of saying 'it depends,' and I don't know what it predicts for the well-mixed case or the cancelling-migration case.

  So what I want: the principle, or the two or three competing principles, that best capture these verdicts, stated precisely enough that I could apply them myself. For each clause, tell me which case forces it. Tell me what each principle says about a case I haven't listed. And be honest about which of my verdicts it can't keep, because I'd rather give up a verdict than keep a principle that's doing backflips to save it.
reasoning: |-
  Okay, let me start by really understanding what this user is grappling with. They're a PhD student in ecological and epidemiological modeling, noticing inconsistencies in which false assumptions in models bother them. They've provided a list of scenarios where they feel an assumption is either acceptable or problematic, and they're looking for a principled way to distinguish between the two. 

  First, I need to unpack their examples. The friction in ballistics and ideal gases are classic simplifications that don't bother them, which makes sense because those are well-established idealizations where the errors are manageable. But when infinite population size is used for a small bird population on the brink of extinction, that's unacceptable because the core question revolves around small population dynamics. That contrast is key here. 

  Then there's the well-mixed population assumption. For a respiratory virus in a dense city, it's fine, but not for a river network spread. The difference seems to be whether the assumption aligns with the real-world system's structure. The user mentions mutation timescales—20 years vs. 200,000 years—which highlights how temporal scale matters. If the process being studied occurs over a time where mutation is negligible, it's acceptable; otherwise, not. 

  The user rejects Jensen's inequality and the "small effect" rule because they don't fit all cases. For example, friction in ballistics isn't small, yet it's acceptable, and small gene flow in divergence studies is problematic. So those rules don't hold up. Their own idea about "scaffolding vs. load-bearing" assumptions is insightful. Scaffolding assumptions are simplifications that don't affect the core question, while load-bearing ones, if changed, would alter the conclusion. 

  I need to formalize this into principles. The Central Mechanism Principle (CMP) seems strong: if the assumption directly impacts the main mechanism being studied, it's problematic. For the bird extinction example, infinite population size removes the central mechanism (drift in small populations), so it's not fine. Whereas friction in ballistics isn't central to trajectory prediction. 

  The Scope-Appropriate Representation (SAR) principle addresses whether the simplification distorts the aspect of reality being studied. In the vaccine efficacy case, using an average individual is fine because efficacy is linear. But in the carbon tax model, heterogeneity matters for policy impact, so averaging isn't acceptable. 

  The Directional Bias Principle (DBP) deals with known biases. In the gene flow case with unknown small flow, if the bias direction is unknown, it's risky. But if the bias direction is known, like in the cancelling migration, it might be acceptable. 

  Testing these against their flip-flop case: assuming zero gene flow when it's small but unknown. CMP says if gene flow is central to divergence, it's not fine. SAR asks if the simplification misrepresents the key aspect—yes, because even small flow affects divergence time. DBP flags the unknown bias direction as problematic. So all principles agree it's not fine, which aligns with their instinct. 

  For the cancelling migration case, CMP might accept it if migration isn't central. SAR could be okay if the net effect is zero, but DBP is tricky because the bias direction isn't clear. The user is nervous here, and the principles explain why: without knowing if migration truly cancels, there's uncertainty. 

  The user's deeper need is a reliable framework to evaluate assumptions without field bias. They want principles that are actionable and predictive. The three principles together cover different angles: centrality of the mechanism, appropriate scope, and bias direction. This addresses their examples consistently, explaining why some intuitions hold and where their discomfort in edge cases comes from. 

  Also, acknowledging that some verdicts might be revised (like the cancelling migration case) shows honesty. The principles provide a structured way to assess assumptions, reducing reliance on gut feelings and subfield norms. This should help them in peer reviews and their own modeling work, fostering more rigorous and transparent science.
answer: |-
  Here's a synthesis of principles that best explain your intuitive verdicts, grounded in philosophy of science and modeling practice. Your "scaffolding vs. load-bearing" instinct is core, but needs refinement. The key lies in **epistemic goals** and **robustness to relaxation**.

  ### The Three Principles
  1.  **Central Mechanism Principle (CMP):** An idealization is **problematic** if it *directly removes, fundamentally misrepresents, or renders irrelevant the primary causal mechanism or process under investigation*. This is your "load-bearing" intuition made precise.
      *   *Forces:* Bird extinction (infinite N removes drift mechanism), River spread (well-mixed removes spatial structure mechanism), Dating split (no gene flow removes the very process being estimated), Nonlinear saturation (linear model misrepresents causal process), Gene flow flip-flop (zero flow directly removes the mechanism if estimating divergence).
      *   *Predicts:* Assuming perfect competition in an ecosystem model when studying predator-prey dynamics? **Fine** (competition isn't central). Assuming no predator-prey interactions when studying predator-prey dynamics? **Not fine** (removes central mechanism).

  2.  **Scope-Appropriate Representation Principle (SAR):** An idealization is **problematic** if it *fails to represent the relevant scale, heterogeneity, or stochasticity inherent to the specific question being asked, even if the mechanism itself seems preserved*.
      *   *Forces:* Bird extinction (scale: small N is inherent), Mutation 200k years (scale: time is inherent), Heterogeneous econ (heterogeneity is inherent to policy impact), Linear huge range (scale: range is inherent), Cancelling migration? (nervousness: heterogeneity/stochasticity might be inherent).
      *   *Predicts:* Modeling a forest fire spread assuming perfectly homogeneous fuel? **Not fine** if predicting real fire paths (heterogeneity inherent). Modeling average fire spread rate nationally? **Fine** (heterogeneity less inherent to the question).

  3.  **Directional Bias & Robustness Principle (DBP):** An idealization is **problematic** if relaxing it introduces *significant uncertainty in the direction or magnitude of the bias* in the quantity of interest, and that quantity is sensitive to the assumption. If the bias direction is known and small, or the conclusion is robust, it's often acceptable.
      *   *Forces:* Friction/Air resistance (bias direction known *and* often small *relative to dominant forces*), Vaccine efficacy (averaging often introduces small, predictable bias, efficacy often robust), Cancelling migration (nervousness: bias direction unknown if net zero is approximate), Gene flow flip-flop (bias direction unknown with small flow).
      *   *Predicts:* Ignoring rare mutations in a short-term antibiotic resistance model? **Fine** (bias small/direction known - underestimates resistance). Ignoring common comorbidities in a model predicting individual treatment response? **Not fine** (bias large/direction unknown).

  ### Applying the Principles to Your Cases

  | Your Case                                      | CMP Verdict                              | SAR Verdict                               | DBP Verdict                               | Overall Verdict (Matches Yours?) | Explanation                                                                 |
  | :--------------------------------------------- | :--------------------------------------- | :---------------------------------------- | :---------------------------------------- | :------------------------------- | :-------------------------------------------------------------------------- |
  | **Ballistics Friction/Air**                    | Fine (not central mechanism)             | Fine (scale ok for rough trajectory)      | **Fine** (bias known, often small rel. g) | **Fine** (Yes)                  | Mechanism (gravity) dominant; bias predictable.                             |
  | **Ideal Gas**                                  | Fine (interactions not central @ low P)  | Fine (scale ok @ low P)                   | Fine (bias known, quantifiable)           | **Fine** (Yes)                  | Core behavior captured; bias modelable.                                     |
  | **Genetic Drift (Infinite N)**                 | **Not Fine?** (But you said Fine)        | Fine (scale inherent? Drift *is* finite N)| Fine (bias known: drift → 0)              | **Fine** (Yes) but CMP flags     | *Drift relies on finite N*. **CMP Concession:** If the *question* is "Does drift exist?", infinite N kills it. If the question is "What *causes* allele freq change?" in a context where drift is one possibility, `Ne` approximation might be scaffolding. Your verdict suggests the latter. |
  | **Bird Extinction (Infinite N)**               | **Not Fine** (removes central mechanism) | **Not Fine** (scale inherent)             | N/A                                       | **Not Fine** (Yes)              | Central mechanism (stochastic extinction) requires finite N.                |
  | **Well-Mixed (City Disease)**                  | Fine (contact mechanism plausibly avg.)  | Fine (density justifies approximation)    | Fine (bias likely small/direction ok)     | **Fine** (Yes)                  | Mechanism (transmission via contact) captured adequately.                   |
  | **Well-Mixed (River Spread)**                  | **Not Fine** (removes spatial mechanism) | **Not Fine** (network structure inherent) | N/A                                       | **Not Fine** (Yes)              | Central mechanism (directional flow) destroyed.                             |
  | **No Mutation (20 yrs)**                       | Fine (likely not central)                | Fine (time scale appropriate)             | Fine (bias likely small/known)            | **Fine** (Yes)                  | Timescale too short for mutation to be relevant.                            |
  | **No Mutation (200k yrs)**                     | **Not Fine** (central process ignored)   | **Not Fine** (time scale inherent)        | N/A                                       | **Not Fine** (Yes)              | Mutation is fundamental over this timescale.                                |
  | **No Gene Flow (Dating Split)**                | **Not Fine** (removes process measured)  | **Not Fine** (process is the quantity)    | N/A                                       | **Not Fine** (Yes)              | Gene flow *is* the confounding factor being estimated/controlled.           |
  | **Heterogeneous Pop → 1 Rep (Carbon Tax)**    | **Not Fine?** (But you said Not Fine)    | **Not Fine** (heterogeneity inherent)     | **Not Fine** (bias large/unknown dir.)    | **Not Fine** (Yes)              | Policy impacts depend critically on distribution (CMP/SAR/DBP all condemn). |
  | **Heterogeneous Pop → Avg (Vaccine Efficacy)**| Fine (mechanism: immune response avg?)   | Fine (average often appropriate)          | **Fine** (bias often small/predictable)   | **Fine** (Yes)                  | *If* efficacy is linear/robust to averaging (DBP key), SAR accepts average. |
  | **Linear Model (Narrow Range)**               | Fine (captures local mechanism)          | Fine (range appropriate)                  | Fine (bias small/known)                   | **Fine** (Yes)                  | Approximation valid within scope.                                           |
  | **Linear Model (Huge Saturating Range)**      | **Not Fine** (misrepresents mechanism)   | **Not Fine** (range inherent)             | **Not Fine** (bias large/unknown)         | **Not Fine** (Yes)              | Mechanism fundamentally nonlinear over range.                               |
  | **Closed Pop (Migration Cancels)**            | Fine (if net flow truly ≈0)              | Nervous (stochasticity/inherent?)         | **Not Fine?** (Bias dir/mag uncertain)    | **Nervous** (Matches)           | CMP *might* be fine if migration not central. SAR/DBP drive nervousness: Is net zero precise? Is the *process* robust to fluctuations? |
  | **Gene Flow ≈0 (Unknown Magnitude)**          | **Not Fine** (central if measuring div.) | **Not Fine** (magnitude inherent)         | **Not Fine** (bias dir/mag unknown)       | **Not Fine** (Yes)              | All principles condemn: It *is* load-bearing (CMP), magnitude matters (SAR), bias unknown (DBP). Colleague wrong – knowing "bias exists" isn't enough if direction/size unknown for sensitive parameter. |

  ### Where the Principles Challenge Your Instincts (Slightly)
  1.  **Genetic Drift (Infinite N):** CMP flags this. Your "Fine" verdict suggests the *question* being asked with the infinite N model wasn't truly about the *mechanism of drift itself*, but perhaps about expected frequencies *ignoring drift* or using it as a null. This highlights that the "central mechanism" depends on the *exact question*. If the question is "What is the expected frequency without drift?", infinite N is fine. If it's "What is the probability of fixation *due to drift*?", infinite N destroys the answer.
  2.  **Vaccine Efficacy:** DBP is crucial here. Your "Fine" assumes the bias from averaging is small/predictable (e.g., efficacy is roughly linear in relevant factors). If efficacy were highly nonlinear (e.g., threshold effects based on immune status), SAR/DBP would condemn it. Your instinct likely relies on implicit knowledge that averaging works well here.

  ### Why Your Colleague is Wrong (Gene Flow Flip-Flop)
  Knowing "bias exists" is insufficient. For a sensitive parameter like divergence time:
  *   **Direction Unknown:** Does small flow speed up divergence (reducing coalescence time) or slow it down (preventing divergence)? It depends on the model (island vs. continent-island) and context.
  *   **Magnitude Unknown:** "Small" could mean negligible or critically important.
  *   **DBP Condemns:** The uncertainty in both direction and magnitude makes the idealization dangerous for drawing conclusions. "Knowing which way the bias goes" only helps if you *actually know which way it goes*. "It's non-zero" doesn't tell you that.

  ### The Core Distillation
  **An idealization is acceptable only if:** 
  **(A)** It does not destroy or fundamentally misrepresent the *core mechanism* relevant to the specific question (CMP), **AND** 
  **(B)** It adequately represents the *scale, heterogeneity, and stochasticity* inherent to that specific question (SAR), **AND** 
  **(C)** The resulting bias in the key conclusions is either negligible, quantifiable, or its direction is known and accounted for, and the conclusion is robust to plausible relaxations (DBP).

  **Violating any one of these principles makes the idealization suspect.** Your discomfort arises when one or more principles are violated. The principles aren't always independent, but together they capture the essence of when an idealization is "scaffolding" (passes A, B, C) versus "load-bearing" (fails A, B, and/or C). They explain why "size" or Jensen alone fail: they address only parts (often SAR or DBP) but miss the critical role of the central mechanism (CMP) and the full uncertainty picture (DBP). This framework provides a rigorous, applicable way to critique models – including your own.
