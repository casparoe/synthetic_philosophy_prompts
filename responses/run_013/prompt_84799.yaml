prompt: |-
  I'm a TA for a grad-level Bayesian epistemology seminar, and next week I have to run a 75-minute session on the Judy Benjamin problem. I know the problem well enough to explain it, but I always end up either getting bogged down in the formalism or turning it into a debate about which update rule is right before the students even see why there's a problem. I need you to plan the session for me, not explain the problem to me.

  The setup, as I'll present it: Judy is dropped into a territory divided between the Blue Army (hers) and the Red Army. She has some initial credences about where she is—say, some probability she's in Blue territory, and within Blue there are two sub-areas, second company and third company. She then gets a radio message that doesn't tell her where she is outright; it tells her something conditional, like "if you're in Blue territory, the chance you're in the second company's area is 1/2." The puzzle is that this doesn't fit the standard Bayesian updating story: she hasn't learned a proposition that rules out possibilities, so she can't just conditionalize. And when you try to extend the rules—Jeffrey conditionalization, minimizing information, etc.—they give different answers, or no unique answer.

  What I want from you is a teaching plan. Specifically:

  - The order in which the pieces have to come in so that the problem feels like a problem rather than a magic trick. What does she need to already believe, and what does she need to learn, for the conditional to bite? I want the students to feel the tension between "she learned something" and "nothing in her probability space got ruled out."
  - The one example that should carry the whole session. Is the Judy Benjamin story itself the best carrying example, or is there a simpler one that does the same work? If Judy Benjamin, how do I set it up so the numbers are easy to follow and the conditional isn't trivially already true? If there's a better example, what is it and why does it work?
  - The misconceptions I should expect. I'm guessing: (1) they'll think she just conditionalized on the conditional, (2) they'll think the problem is just about ambiguity in the message, (3) they'll think any update rule is as good as any other, (4) they'll think the problem shows Bayesianism is refuted. I've seen alot of these in past years. Where in the sequence should I head each one off, and how?
  - A check for understanding at the end that would show they've got the problem rather than just memorized the setup.
  - What to leave out at this level. I don't want to get into the full formal machinery of infomin or the various distance measures unless it's necessary. Tell me what I can safely skip and say so explicitly.

  One more thing: I need you to seperate what's settled from what's contested. Some parts of this are not in dispute—the setup, the fact that ordinary conditionalization doesn't apply, the fact that different update rules give different answers. But other parts are genuinely contested among people who work on this: which update rule is correct, whether the problem shows a flaw in Bayesian epistemology or just a limitation of certain formal tools, whether the "right" answer is even well-defined. I definately don't want to present a contested view as if it's the consensus. So in your plan, flag which claims are settled and which are live disputes, and if you recommend a particular line, say that it's a choice and not the only defensible one.

  Also, I have students who are comfortable with probability but not with measure theory, so keep the plan at the level of finite probability spaces and simple conditional probabilities.
reasoning: |-
  Okay, the user is a TA preparing a 75-minute seminar on the Judy Benjamin problem for a grad-level Bayesian epistemology class. They need a teaching plan that avoids common pitfalls: either getting bogged down in formalism or prematurely diving into debates about update rules. 

  Hmm, the core challenge is making students feel the tension between "Judy learned something" and "no possibilities were ruled out" – that's the pedagogical sweet spot. The user has seen students misunderstand this as mere conditionalization or ambiguity, so we need to preempt those misconceptions.

  First, the sequence needs to build the problem organically. Start with vanilla Bayesian updating to reactivate their intuition, then introduce a case where no proposition is learned (just a conditional). The key is showing how Judy's initial space has P(Blue) < 1, so the conditional "if Blue, then P(2nd|Blue)=0.5" isn't vacuously true. I'll suggest using the original Judy Benjamin setup with simplified 1:1:1 priors – it's clean and the numbers are tractable.

  For misconceptions: 
  - The "just conditionalize on the conditional" error should be tackled immediately after posing the puzzle by asking students what happens if they try P_new(H) = P(H|conditional). 
  - The "it's just ambiguous" worry can be neutralized by stressing the message is mathematically precise.
  - The "any rule is fine" stance needs contrast with how different rules (Jeffrey vs infomin) yield meaningfully different posteriors for P(Red).
  - And the "Bayesianism refuted" overreaction? Save that for the wrap-up discussion, framing it as a live dispute.

  The check for understanding should force them to articulate why conditionalization fails and what makes this epistemically distinct – maybe have them sketch Judy's credence change for Red territory before/after the update.

  What to skip? Full infomin derivations and distance measure debates. Just show the divergent results (Jeffrey: P(Red)=0.5, infomin: P(Red)≈0.66) and say the choice between them is philosophically contested. Emphasize that the unsettled part is which rule to use, not the inadequacy of standard conditionalization.

  User's anxiety about presenting contested views as consensus is valid. I'll flag where the disputes lie: "settled" = conditionalization doesn't apply, rules disagree; "contested" = which rule is right, whether this threatens Bayesianism. If pressed, recommend Jeffrey as pedagogically useful but stress it's not definitive.

  ...Wait, did I address the request for a single carrying example? Yes – original Judy Benjamin with uniform priors. It avoids the distraction of designing a new case while keeping probabilities simple (quarters, not percentages). The conditional "if Blue, equally likely 2nd or 3rd" is intuitive and non-trivial since P(Blue) starts at 2/3.
answer: |-
  Below is a structured 75-minute teaching plan designed to make the Judy Benjamin problem feel like a natural puzzle, avoid premature formalism/debates, target misconceptions, and clearly separate settled vs. contested elements. The plan prioritizes conceptual clarity using **finite probability spaces** and avoids measure theory.

  ---

  ### **Teaching Plan: The Judy Benjamin Problem**  
  **Core Goal:** *Make students feel the tension between learning something substantive and ruling nothing out.*  
  **Carrying Example:** **Use the original Judy Benjamin setup**. It’s the most pedagogically effective because its military context makes the conditional intuitive, and its symmetry highlights the puzzle.  

  ---

  ### **Session Structure (75 min total)**  
  #### **Part 1: Setup & Reactivating Bayesian Intuitions (15 min)**  
  - **Settled Premise:** Review standard Bayesian conditionalization.  
    - *Example:* Judy is dropped into a territory with 3 regions: **Red Army** (R), **Blue 2nd Co.** (B₂), **Blue 3rd Co.** (B₃).  
    - *Initial credence:* Uniform prior (each region equally likely):  
      - P(R) = 1/3, P(B₂) = 1/3, P(B₃) = 1/3 → P(Blue) = P(B₂ ∪ B₃) = **2/3**.  
  - **Key Question:** *"If Judy learned 'I am not in Red territory,' how would she update?"*  
    - Students calculate: P(B₂|Blue) = P(B₃|Blue) = (1/3)/(2/3) = **1/2**.  
  - **Why this works:** Rules out R → renormalizes over remaining possibilities.  

  #### **Part 2: Introducing the Puzzle (15 min)**  
  - **The Message:** Judy learns: *"If you are in Blue territory, the chance you’re in 2nd Company’s area is 1/2."*  
    - Formally: *Learning P(B₂|Blue) = 0.5*.  
  - **The Tension:**  
    - *"What possibilities does this rule out?"* → **None.** R is still possible, B₂ and B₃ are both still possible.  
    - *"Can she conditionalize?"* → **No proposition was learned.** She learned a *constraint*, not an observation.  
  - **Check for Misconception #1 (Conditionalizing on the conditional):**  
    - Ask: *"Can she just set P_new(H) = P(H | P(B₂|Blue)=0.5)?"* → **No.** This is circular; P(B₂|Blue)=0.5 is not an event in her probability space.  
  - **Why the problem bites:**  
    - Her prior *already has* P(B₂|Blue) = 1/2. The message seems tautological! But what if her prior wasn’t uniform?  
  - **Adjust Priors to break symmetry (CRUCIAL):**  
    - New prior: P(R) = **1/2**, P(B₂) = **1/4**, P(B₃) = **1/4** → P(Blue) = 1/2, P(B₂|Blue) = (1/4)/(1/2) = **0.5**.  
    - *"Now she learns the same message: P(B₂|Blue)=0.5. But her prior already satisfies this! Should she change her credence about Red?"*  
    - **Punchline:** Intuition splits. Some say "no" (nothing new), others say "yes" (she learned the conditional is 0.5, regardless of prior).  

  #### **Part 3: Why This Is a Problem (15 min)**  
  - **The Core Issue:**  
    - Standard conditionalization requires learning an *event* (a subset of the sample space). Here, she learned a *fact about probabilities*.  
  - **Misconception #2 (Ambiguity):** Head off by stressing the message is precise. The problem is **not** ambiguity—it’s formal underdetermination.  
  - **Misconception #3 (Any rule is fine):**  
    - Show two update rules give different answers for P(R) after the message:  
      - **Jeffrey Conditionalization:** Shifts credences within Blue.  
        - P(B₂|Blue) = 0.5 → P_new(B₂) = P_new(B₃) = 0.25 (since P_new(Blue) = P(Blue) = 0.5).  
        - → P_new(R) = **0.5** (unchanged!).  
      - **Infomin (briefly):** Minimizes information divergence, subject to constraint.  
        - Result: P_new(R) ≈ **0.67** (increases!).  
    - *"Same input, different outputs. Why?"* → Rules disagree on whether "ignorance" about Blue should affect Red.  
  - **Settled Fact:** Different update rules yield different posteriors. **Contested:** Which rule is "correct."  

  #### **Part 4: Discussion & Conceptual Check (20 min)**  
  - **Guided Debate:**  
    - *"Should Judy’s credence in Red change? Why/why not?"*  
    - *"Is the message informative if her prior already satisfied P(B₂|Blue)=0.5?"*  
  - **Check for Understanding:**  
    - Pose: *"Judy learns 'If Blue, P(B₂|Blue)=0.9' (with original uniform prior). Without calculating, does P(R) go up, down, or stay the same? Why?"*  
    - **Correct Insight:** If her credence in B₂ increases under Blue, and Blue is uncertain, P(R) *might* change—but rules disagree on how. Avoids memorization.  
  - **Misconception #4 (Bayesianism refuted):** Discuss as a **live dispute**:  
    - **Settled:** Standard Bayesianism *alone* can’t handle this.  
    - **Contested:** Whether this requires new rules (Jeffrey, infomin) or shows a deeper flaw.  

  #### **Part 5: Wrap-up & Meta-Lessons (10 min)**  
  - **What’s Uncontroversial:**  
    - Conditionalization doesn’t apply.  
    - Update rules diverge.  
    - The problem reveals a gap in vanilla Bayesianism.  
  - **What’s Contested:**  
    - Which update rule to use (or whether one is "correct").  
    - Whether the Judy Benjamin problem has a unique "right answer" (van Fraassen vs. critics).  
  - **What to Skip:**  
    - Derivations of infomin (mention it as "one approach" and show results).  
    - Generalizations to continuous spaces or measure theory.  
    - Philosophical defenses of specific rules (save for readings).  
  - **Final Framing:** *"This isn’t a magic trick—it’s a stress test for how we formalize learning. Bayesianism needs tools beyond conditionalization, but which tools and why?"*  

  ---

  ### **Why This Works**  
  - **Builds tension gradually:** Starts with vanilla conditionalization, breaks priors to avoid triviality, then introduces the message as a curveball.  
  - **One example throughout:** Judy Benjamin with adjusted priors keeps focus. Simplifying to 3 regions avoids clutter.  
  - **Preempts misconceptions:** Targets each error at the point where it naturally arises.  
  - **Clear settled/contested boundary:** Emphasizes that divergence of rules is settled; their justification is not.  
  - **Accessible:** Uses finite spaces, fractions, and intuitive constraints.  

  **Recommended Adjustment:** Use whiteboard/visuals for probability spaces (e.g., a box divided into R, B₂, B₃). Assign the adjusted prior (P(R)=1/2, P(B₂)=1/4, P(B₃)=1/4) as the "working example" for calculations.
