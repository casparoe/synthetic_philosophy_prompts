prompt: |-
  hey so im in high school and im putting together a thought experiment for my philosophy club and i want it to be actually tricky, not just the same old lying promise example everyone uses. can you build me a case for kants universalizability test where the verdict flips depending on how broadly or narrowly you describe the maxim? like the same action gets described two ways, one description universalizes without contradiction and the other doesnt, and i need to see which description the test should actually use. constraints: realistic teen situation (school, job, friends, family), one paragraph for the scenario, no murder, no stealing, no false promises, and the maxim has to be stated in the form i will do X when Y in order to get Z. after the scenario, walk through both universalized worlds and what happens in each, say whether the contradiction is in conception or in will or neither, say which description you think kant would have to pick and why, and tell me which feature of the case is doing the work. the point isnt to show lying is bad, its to show whether the test even gives a determinate answer when the description is up for grabs. then say what happens if you remove that feature or make the two descriptions equally specific. finish with how a kant defender would try to stop the case from counting against the test. also please dont just tell me it depends on the maxim, actually build the thing.
reasoning: |-
  Okay, the user is in high school and part of a philosophy club. They want a thought experiment for Kant's universalizability test that's tricky and not the usual examples. Specifically, they need a scenario where the maxim's description affects the outcome—one version universalizes without contradiction, the other doesn't. The constraints are strict: realistic teen situation, no murder/stealing/false promises, maxim format "I will do X when Y to get Z," and a clear walkthrough.

  First, I need to create a relatable scenario. Teen life involves school, jobs, friends, family. Cheating is common, but that's off-limits per constraints. Hmm... what about homework help? Like sharing answers but framed differently. Maybe helping a friend with an assignment versus copying work. That could work. Need to differentiate maxims: one focused on mutual academic support, the other on bypassing effort. 

  Next, the maxims must fit the format. For the acceptable version: "I will share my completed homework when a friend is struggling to meet a deadline in order to provide temporary academic relief." The problematic version: "I will share my completed homework when I want to help a friend avoid consequences of poor time management in order to bypass independent learning efforts." The key difference is the intent—relief vs. avoiding consequences.

  Now, universalizing each. For the first maxim: if everyone shares homework for temporary relief, it's like a study group. No contradiction; education still functions. Contradiction in conception? No. Contradiction in will? Maybe, but not necessarily. People might still value learning overall. So it passes.

  For the second maxim: universal bypassing independent learning. If everyone does this, no one learns independently. Schools can't function—teachers can't assess real understanding. Contradiction in conception: the system collapses. So it fails.

  The tricky part is why Kant might prefer one description. The key feature is the level of generality. The first maxim is specific (temporary relief), the second is broader (avoiding consequences). Kant would likely pick the more specific intention because maxims should reflect the agent's actual reason. If both are equally specific, the test might give mixed results, showing ambiguity.

  A Kant defender might argue that agents must sincerely describe their maxims based on true intentions, avoiding self-serving vagueness. They'd say the test works if maxims are correctly formulated, and apparent contradictions arise from misdescription.

  Need to ensure the scenario is realistic for teens—homework stress, deadlines, helping friends. Avoid cheating clichés. Also, meet all constraints: no false promises, stealing, etc. The analysis must clearly show how description flips the verdict, highlighting the maxim's specificity as the crucial factor.
answer: |-
  Here's a thought experiment designed specifically for your constraints, highlighting the maxim description problem:

  **Scenario:** Alex has a major history paper due tomorrow that they haven't started. Their friend Taylor, known for being a strong writer, finished theirs early. Alex, panicking, texts Taylor: "Dude, history paper disaster! Can you send me yours? Just to get ideas, I swear I'll write my own!" Taylor knows Alex is overwhelmed and genuinely wants to help Alex avoid a failing grade and parental punishment. Taylor reasons: "I want to help my friend in a crisis." Taylor texts back their completed paper.

  **Maxim 1 (Narrow - Focus on Relief):** "I will share my completed homework assignment **when a close friend is facing an urgent deadline crisis** in order to **provide temporary academic relief and prevent immediate negative consequences.**"

  **Maxim 2 (Broad - Focus on Bypassing Effort):** "I will share my completed homework assignment **when someone wants help avoiding consequences of poor planning** in order to **bypass the requirement for independent learning effort.**"

  **Testing Maxim 1 (Relief):**
  *   **Universalized World:** Everyone shares completed homework *only* when a close friend faces a genuine, urgent deadline crisis to provide temporary relief/prevent disaster.
  *   **Contradiction?:** **Neither contradiction in conception nor will.** Homework still gets done independently *most* of the time. Sharing happens only in rare, acute "crisis" situations. The educational system still functions because independent effort is the norm, and sharing is a narrow, emergency exception. People could still rationally will this world; education isn't destroyed, and helping in crises might even be seen as valuable. The *purpose* of homework (learning/assessment) isn't fundamentally undermined if such sharing is extremely rare and for crisis mitigation only.

  **Testing Maxim 2 (Bypassing Effort):**
  *   **Universalized World:** Everyone shares completed homework whenever anyone wants to avoid the consequences of not doing the work themselves (poor planning, laziness, etc.) in order to bypass independent effort.
  *   **Contradiction?:** **Contradiction in conception (and likely will).** If everyone bypasses independent effort whenever they don't want to do the work, the entire concept of assigned homework as a tool for learning, practice, and assessment **collapses**. Why assign it? Teachers couldn't gauge understanding or effort. The practice essential for learning vanishes. The *purpose* (Z - bypassing independent effort) directly destroys the very practice (homework) that makes sharing possible. It becomes self-defeating (conception). Furthermore, rational agents who value education couldn't consistently will this world (will).

  **Kant's Likely Choice & Why:**
  Kant would insist on **Maxim 2 (Bypassing Effort)** being the true maxim. His focus is on the **fundamental principle of the action** – the core reason *why* Taylor acts. While Taylor *feels* they are helping (Maxim 1's Z), Kant argues the underlying principle enabling this "help" is the bypassing of the required independent effort (Maxim 2's Z). The action's moral quality depends on the maxim describing *what is actually being willed* in terms of principles, not just the surface intention. Helping is the *motive*, but the *maxim* involves circumventing a core academic duty.

  **The Feature Doing the Work:**
  The **level of abstraction in describing the circumstance (Y) and purpose (Z)** is crucial. Maxim 1 describes a very *specific circumstance* ("urgent deadline crisis") and a *specific, limited purpose* ("temporary relief/prevent immediate consequences"). Maxim 2 describes a *generalized circumstance* ("someone wants to avoid consequences of poor planning") and a *fundamental purpose* ("bypass independent effort") that attacks the core justification for the practice itself. The generality of Maxim 2 exposes the action's inherent conflict with the universal requirements of the practice (homework/education). Maxim 1 hides this conflict by making the exception seem isolated and non-threatening to the system.

  **What Happens if You Remove/Match Specificity?**
  *   **Remove the Key Feature (Generality):** If both maxims were equally specific/narrow (e.g., both focused *only* on "urgent crisis for close friend"), they would likely both universalize without contradiction (or both with contradiction, depending on the exact phrasing). The test would lose its discriminatory power *in this case*.
  *   **Make Both Equally Broad:** If both maxims were equally broad (e.g., "help a friend"), the test might yield a contradiction if "help" inherently involved violating a duty, or no contradiction if it didn't. But the *specific moral problem* of bypassing academic integrity would be obscured. The ambiguity increases.

  **How a Kant Defender Would Respond:**
  A Kant defender would argue this case *doesn't* show a flaw in the test, but rather **highlights the importance of sincere, accurate maxim formulation**. They would insist:
  1.  **True Intention:** Taylor's *real* maxim, if honest, *is* closer to Maxim 2. They are using their work to help Alex avoid the effort required. The feeling of helpfulness is secondary; the core principle enacted is bypassing effort.
  2.  **Duty vs. Inclination:** The motive to help (inclination) doesn't change the fact that the action's principle violates a duty (honest academic effort). The test reveals the principle, not the feeling.
  3.  **No Arbitrary Description:** Kant requires describing the action based on the **reason for which it is done**. Maxim 1 misdescribes this by focusing on the emotional context ("crisis") rather than the core moral principle being invoked (suspending effort requirements). The test demands we isolate the *moral principle* of the action.
  4.  **Universality Reveals the Contradiction:** Only by describing the maxim accurately (as fundamentally bypassing effort) does the contradiction with the universal requirements of education become apparent. The test works precisely by exposing this when the maxim is correctly stated.

  **The Philosophical Punch:**
  This case demonstrates that the CI test's verdict *is* highly sensitive to how the agent formulates their maxim. While Kant insists there's a "correct" description (the one capturing the fundamental principle), determining that description requires significant interpretation of the agent's true reasons and the nature of the duties involved. This creates ambiguity and opens the door to self-serving descriptions (like Maxim 1) that "pass" the test by masking the underlying conflict with duty. The challenge isn't that the test *can't* work, but that applying it consistently requires deep, sometimes controversial, judgment about what the maxim *really is*.
