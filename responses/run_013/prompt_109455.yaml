  First, I'm recalling the Stoic principle: things "up to us" are our judgments and voluntary actions, while external outcomes aren't. The challenge is to reverse this in a realistic setting. The user specified ordinary stakes—like a workplace or family—and a single agent making one decision. 

  I consider using a professional habit as the key feature. Something ingrained, like a doctor's aversion to certain treatments. The case should involve a medical decision where the doctor can't bring herself to choose an option due to her training, but the choice itself is within her power. 

  Brainstorming: an ER doctor facing a time-sensitive decision. She has two options—say, a risky procedure she's uncomfortable with versus a safer one. Her upbringing or professional habit makes her see the risky option as unacceptable, so she can't assent to it. But physically, she could choose it; the outcome depends on her action. 

  Now, checking constraints: No drugs, manipulation, or ignorance. The reversal comes from how habit shapes assent. It's not about determinism; compatibilists and incompatibilists should read it the same. 

  For the volitional vs. counterfactual-dependence readings: Volitional means it's directly willed, while counterfactual means it depends on her choice. In this case, the judgment (assent) isn't volitionally up to her because habit blocks it, but the outcome is counterfactually dependent because she could have acted differently. 

  The Stoic would say she didn't act virtuously because her judgment wasn't rational. But if we remove the ingrained habit—say, if she were new to the job—she might assent differently, showing the reversal disappears. 

  The user wants to test if the dichotomy does independent work or just restates virtue ethics. This case generates the reversal from the theory by focusing on how habits constrain internal assent while leaving external action free. 

  Finally, I need to ensure it's one paragraph, realistic, and includes all analysis points. The doctor scenario fits: high stakes, ordinary, and the key feature is the professional habit's grip on judgment.
answer: |-
  ## The Case: The Hesitating Surgeon

  Dr. Lena Chen, an experienced trauma surgeon renowned for her calm precision, faces a critical intraoperative decision: a complex vascular repair on a crashing patient offers a 30% chance of saving the limb and life, but carries a high risk of fatal hemorrhage if imperfectly executed; the safer alternative is immediate, life-saving amputation. Raised and trained in an environment that relentlessly emphasized "First, do no harm" interpreted as minimizing immediate, visible *iatrogenic* risk above all else (a deeply ingrained habit of mind reinforced by years of mentorship and self-critique), Lena *cannot bring herself to judge* the limb-salvage attempt as acceptable – the perceived risk of *her own action* causing death feels viscerally, morally wrong, an assent she cannot form despite knowing the statistics intellectually. She chooses amputation. The patient survives, minus the limb. The *outcome* (amputation performed, life saved) is plainly the direct result of Lena's decision and action; she could physically have attempted the repair instead.

  **Check:**

  1.  **"Up to the Agent":**
      *   **Volitional Reading (Direct Willing):** Something is "up to the agent" if she can directly will it to be so through an act of choice or judgment.
      *   **Counterfactual-Dependence Reading:** Something is "up to the agent" if it depends counterfactually on her choices/actions (i.e., if she had chosen/acted differently, that thing would be different).
  2.  **Stoic Verdicts & Required Readings:**
      *   **Judgment (Assent to limb-salvage being acceptable):** The Stoic verdict (Not up to Lena) requires the **volitional reading**. Lena cannot *will* herself to form this judgment/assent; her ingrained habit blocks the rational assent required by Stoicism, despite the available information. It fails the counterfactual test only weakly (different upbringing/habits *might* have led to assent, but she can't access that *now*).
      *   **Outcome (Amputation performed):** The Stoic verdict (Up to Lena) requires the **counterfactual-dependence reading**. The outcome directly depended on her choice and action (she *could* have chosen repair and performed it). It fails the volitional reading for the *success* of the repair (which was external), but the *action taken* (amputating) was willed and performed.
  3.  **Acted Well?** The Stoic concludes Lena **did NOT act virtuously.** Her action stemmed from an erroneous judgment (assent to the false appearance that attempting repair was inherently "doing harm") caused by defective reasoning habits, not perfect rational assent to the true good. Saving the life was a "preferred indifferent" outcome, but the flawed *prohairesis* (moral choice) renders the action non-virtuous.
  4.  **The Key Feature:** The **deeply ingrained professional habit/mindset** ("First, do no harm" interpreted as minimizing immediate surgeon-caused risk above statistical outcomes) shaping what Lena *can* assent to. This habit operates below the level of conscious choice, filtering rational assent.
  5.  **Removing the Feature:** If Lena lacked this specific ingrained interpretation (e.g., she trained under mentors emphasizing statistical benefit/patient autonomy), she *could* rationally assent to the repair attempt being acceptable given the circumstances. The reversal vanishes: her judgment *would* be up to her (volitionally), and the outcome would still be up to her (counterfactually).
  6.  **Begging the Question?** A Stoic would argue the case mistakenly **redescribes Lena's actual assent as an uncontrollable "judgment" rather than a mere appearance she failed to resist.** They maintain that Lena *did* assent – she assented to the appearance "Attempting repair would be *me* doing direct, unacceptable harm" instead of withholding assent and assenting only to "Attempting repair carries risks and benefits; its goodness depends on rational assessment." Her exhaustion/habit made withholding assent *very difficult*, but not impossible; the failure to do so *was* within her volitional control and thus her responsibility. The case, for the Stoic, confuses the *strength of an appearance* with the *act of assent* itself.

  **This case tests the Dichotomy:** It generates the reversal (judgment not up to her, outcome up to her) *from* the Stoic theory's own concepts (assent as the locus of control, the role of reason/habit in enabling/corrupting assent) applied to a realistic psychological mechanism (ingrained professional interpretation). It doesn't merely stipulate "virtue isn't up to her"; it shows how the Dichotomy's *specific* definition of "up to us" (volitional assent) can conflict with common intuitions about control over actions/outcomes (counterfactual dependence), thereby probing its independent utility beyond restating virtue ethics. The Stoic rebuttal hinges precisely on their core claim about assent being the *only* thing truly volitional.
