  For timing, 800 words in 90 minutes seems tight but feasible for undergrads. The model answer should model conciseness while hitting all philosophical nuances.
answer: |-
  ### Final Examination: Consciousness and the Self  
  **Question (25 marks):**  
  Consider patient R., who has undergone complete commissurotomy but also received an experimental "callosal bridge." This prosthetic allows limited interhemispheric communication: signals are delayed, bandwidth is low, and under experimental conditions, R.’s hemispheres can be induced to disagree on perceptual/motor tasks. Despite this, R. insists she experiences "a single continuous stream of consciousness" and feels distress at suggestions she might be "two persons." Using this case, address the following:  

  1. **Precisely define** what it would mean for R.’s consciousness to constitute "a single stream of experience" *in the literal sense*. What structural, functional, or phenomenological conditions must be met?  
  2. **Evaluate whether** consciousness’s unity is necessarily an all-or-nothing property, or if R.’s case suggests it could admit of *degrees*.  
  3. **Explain why** R.’s unified self-report and distress might *not* settle the question of whether her consciousness is unified "in the sense that matters."  

  Ground your analysis in philosophical theories of consciousness (e.g., Dennett, Bayne, Metzinger, or Nagel) and empirical split-brain research. Avoid rehashing the standard "one or two minds?" debate; focus on the implications of *partial, dysfunctional connectivity*.  

  ---

  ### Model Answer (Approx. 750 words):  
  R.’s case forces us to refine what "unity of consciousness" entails beyond coarse behavioral or narrative coherence. To call her experience a "single stream" *literally*, it must satisfy three conditions: (1) **Temporal continuity**: her conscious states must be seamlessly integrated across time, with no fragmentation or "gaps" in subjective flow; (2) **Cross-modal binding**: contents (e.g., vision, touch, agency) must be experienced as properties of a single, unified field, not as parallel streams; and (3) **Subjectivity without multiplicity**: the "I" reporting experience must be singular, not a meta-cognitive illusion masking sub-agents (Metzinger, 2003). Crucially, this requires *phenomenal holism*—the inability to isolate self-contained subsystems within the stream (Bayne, 2010).  

  R.’s bridge complicates this. Its low bandwidth and delays create *asynchronies*: one hemisphere might perceive a red flash while the other, milliseconds later, hears a tone, preventing real-time binding. When hemispheres disagree (e.g., left hand unbuttons a shirt while right hand buttons it), this implies motor intentions are not globally integrated. For R.’s claim of unity to hold, her brain must *compensate* for these faults—perhaps via narrative post-hoc reconstruction (Dennett’s "Cartesian Theater" critique) or by filtering discordant data from awareness. But if disjoint percepts or conflicting volitions coexist without integration, her "stream" is functionally partitioned. This suggests unity is **graded**, not binary. We might conceive of it as a spectrum: from total unity (intact brain) to R.’s case (partial integration via bridge), to classic split-brain (disunity), with unity depending on the *density and fidelity* of information exchange (Sperry’s later work on neural synergy). R.’s bridge creates *degraded unity*, akin to noisy radio transmission where signal loss permits "two stations" to bleed through intermittently.  

  Yet R. vehemently asserts singularity and feels distress at fragmentation hypotheses. This reveals the ambiguity of "what matters." Her report could reflect:  
  - **Narrative unity**: Her left hemisphere (typically language-dominant) constructs a coherent self-story, suppressing anomalies (Gazzaniga’s interpreter theory).  
  - **Affective unity**: Distress signals a meta-awareness that disunity *threatens selfhood*, but this emotional response doesn’t prove structural unity.  
  - **Unity as absence of conflict**: If discordant states rarely reach consciousness (due to bridge filtering), she may *feel* unified despite underlying disunity.  

  Here, R.’s distress is evidence *about* her self-model (Metzinger), not proof of unity. A system can produce "unified behavior" (e.g., a nation with squabbling ministries) or "unified reports" (e.g., confabulation in anosognosia) while lacking integrated consciousness. What "matters" depends on our criterion: if unity requires *seamless access* between all contents (Baars’ global workspace), R.’s bridge fails; if it requires *subjective coherence alone*, her report suffices. But privileging report risks circularity: unity is defined by first-person access, which is itself a product of unity.  

  Ultimately, R.’s case exposes unity as **contingent on mechanism**. The bridge’s flaws make her consciousness *vulnerably unified*—stable under low stress but fracturing under induced conflict. This supports a process-based view: unity isn’t a static property but an achievement of neural integration. If binding degrades proportionally to bandwidth loss, unity is scalar. However, there may be a **threshold**: when asynchrony exceeds ~80ms, stimuli feel non-simultaneous (Libet), implying R.’s delayed signals could decouple her stream into quasi-independent tributaries. Her unity claim might then rest on ignorance of her own disunity—a haunting conclusion for theories of the self.  

  ---

  ### Marking Scheme (25 total marks):  
  **A/A+ (21–25):** Distinguishes literal unity conditions from behavioral/narrative unity; rigorously debates graded vs. threshold models; critiques self-report without dismissing it; cites philosophers *relevantly*; original synthesis.  
  **B (16–20):** Identifies key issues but conflates concepts; describes but doesn’t analyze degrees of unity; takes self-report at face value.  

  | **Must-Hit Points**                     | **Marks** | **Common Pitfalls (Mark Reductions)** |  
  |-----------------------------------------|-----------|---------------------------------------|  
  | **1. Defines "single stream"** phenomenologically (not behaviorally), specifying temporal continuity, binding, and singular subjectivity. | 5 | Vague definitions (e.g., "one person acting normally"); omits time/binding (-2). |  
  | **2. Analyzes bridge limitations** (delay, bandwidth, conflict) and their threat to unity conditions. | 5 | Lists faults without linking to unity; relapses into standard split-brain (-3). |  
  | **3. Argues for/against degrees of unity** using R.’s partial connectivity. Must reject binary thinking. | 5 | Assumes all-or-nothing unity; no engagement with spectrum concept (-3). |  
  | **4. Critically evaluates self-report**: Explains why distress/unified narrative ≠ evidence of unity. | 5 | Accepts report as proof; ignores confabulation/left-hemisphere interpreter (-3). |  
  | **5. Position on "what matters"**: Takes a stance on whether R. is unified in the philosophically significant sense. | 5 | Unclear conclusion; conflates unity of consciousness with agency/selfhood (-2). |  

  **Top Answers Must:**  
  - Treat "stream" as requiring *temporal coherence and binding*, not just report.  
  - Frame self-report as *data needing explanation* (e.g., interpreter theory), not a verdict.  
  - Argue that partial connectivity *could* yield partial unity (e.g., "fragile holism").  
  - Name at least one philosopher (e.g., "Bayne’s holism vs. Dennett’s fragmentation") *contextually*.  

  **Failures Cost Marks By:**  
  - Rehashing "two minds" debate (automatic cap at B).  
  - Ignoring temporal aspects of "stream" (-3).  
  - Asserting unity is purely subjective/objective without argument (-2).  
  - No engagement with graded unity (-4).  

  ---  
  **Exam Logistics:**  
  - **Time:** 90 minutes total (this question is the entire exam).  
  - **Resources:** Course readings only (no internet). Students have studied Sperry, Gazzaniga, Dennett, Bayne, Metzinger, and Nagel.  
  - **Expected Length:** 700–800 words (prioritize depth over breadth).  

  This question forces confrontation with the *mechanisms* of unity while complicating first-person authority—pushing students beyond the literature into conceptual innovation. The marking scheme rewards precision in handling subjectivity, time, and partial integration.
