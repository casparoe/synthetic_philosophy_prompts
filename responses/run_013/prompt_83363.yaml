  So the column player's payoff matrix is:

          Row \ Col   X   Y   Z
          A          1   6   1
          B          6   1   1
          C          3   3   0

  But this is from the column player's perspective: the rows correspond to the row player's strategies, and the columns correspond to the column player's own strategies. This is the transpose of the row player's matrix? Let's see the row player's matrix again:

          Col \ Row   X   Y   Z   [if we label the columns as the column player's strategies]
          A          1   6   1   -> wait, no.

  We have the row player choosing a row, the column player choosing a column.

  Row player's payoff matrix (as a function of her choice and the column player's choice):

          Column chooses:
          X    Y    Z
  Row A:   1    6    1
  Row B:   6    1    1
  Row C:   3    3    0

  Column player's payoff matrix (as a function of the row player's choice and his own choice):

          His choice \ Row's choice   A    B    C
          X                          1    6    3
          Y                          6    1    3
          Z                          1    1    0

  But this is not the same as the row player's matrix. The row player's matrix for her own payoffs is fixed by the row and the column. The column player's payoffs are determined by the same.

  Note: in the cell (A,X) we have (1,1) -> row player gets 1, column player gets 1.
  In (A,Y): (6,6) -> both get 6.
  In (A,Z): (1,1) -> both get 1.

  In (B,X): (6,6) -> both get 6.
  In (B,Y): (1,1) -> both get 1.
  In (B,Z): (1,1) -> both get 1.

  In (C,X): (3,3) -> both get 3.
  In (C,Y): (3,3) -> both get 3.
  In (C,Z): (0,0) -> both get 0.

  Therefore, the game is symmetric. So the payoff for the column player when he plays strategy X and the row player plays strategy A is 1, which is the same as the row player's payoff when she plays A and the column plays X.

  So the column player's payoff matrix, when he is choosing a row in his own matrix, would be:

          Row player's strategy \ His choice   X   Y   Z
          A                                     1   6   1
          B                                     6   1   1
          C                                     3   3   0

  This is the same as the row player's matrix. Therefore, for the column player, strategy C is also strictly dominated by a 50-50 mix of X and Y (which are his versions of A and B).

  So in the activity, we can have both players eliminate C.

  After that, we have a 2x2 game:

          X         Y
  A    (1,1)    (6,6)
  B    (6,6)    (1,1)

  This is the battle of the sexes? It has two pure strategy Nash equilibria: (A,Y) and (B,X). And a mixed strategy equilibrium.

  But in terms of dominance, for the row player, neither A nor B is dominated by the other. Similarly for the column player.

  So we stop here for dominance. We have done one round of elimination (removing C for both players).

  But we wanted to show iterated elimination: after removing one, then remove another. In this matrix, we don't have a second dominated strategy. But maybe that's okay. We have shown the ghost strategy (C) being eliminated by a mixed strategy.

  Alternatively, we can design a matrix where after removing one strategy, another becomes dominated.

  But let's keep this matrix and focus on the first elimination. The session is 90 minutes, and we want them to experience the ghost strategy.

  Activity design:

  - Divide the 24 people into two groups: Group 1 and Group 2, each of 12. Group 1 will be the row players, Group 2 the column players. But then we have 12 row players and 12 column players, and we can pair them up.

  But then each pair plays the game independently. We want to collect data and then discuss. 

  Steps:

  1. Explain the game: Each pair will play the game. The row player chooses A, B, or C. The column player chooses X, Y, or Z. Then payoffs are determined by the matrix.

  2. We need to display the matrix. We can hand out a sheet or project it.

  Matrix presented as:

  For the row player:
  - If you choose A and the column player chooses X, you get 1 point; if Y, you get 6; if Z, you get 1.
  - If you choose B and the column player chooses X, you get 6; Y: 1; Z: 1.
  - If you choose C and the column player chooses X, you get 3; Y: 3; Z: 0.

  For the column player:
  - If you choose X and the row player chooses A, you get 1; B: 6; C: 3.
  - If you choose Y and the row player chooses A, you get 6; B: 1; C: 3.
  - If you choose Z and the row player chooses A, you get 1; B: 1; C: 0.

  But this is a bit messy. We can provide the matrix in a table.

  Since the game is symmetric, we can simply say: the payoffs for both players are the same and are given by the following table (which shows the payoff for the row player; the column player's payoff is the same as the number in the cell for the column player's chosen strategy and the row player's chosen strategy).

  But that might be confusing.

  Better to provide two tables? Or one big table.

  I think we can make a grid on a whiteboard:

            Column X       Column Y       Column Z
  Row A    (1, 1)         (6, 6)         (1, 1)
  Row B    (6, 6)         (1, 1)         (1, 1)
  Row C    (3, 3)         (3, 3)         (0, 0)

  We can explain that in each cell, the first number is for the row player, the second for the column player.

  3. We will play the game for real, but with points (not real money). We will play several rounds.

  4. In the first round, each row player (in Group 1) chooses a strategy (A, B, or C) and each column player (in Group 2) chooses a strategy (X, Y, or Z). We then pair them randomly? Or we can have fixed pairs? Since there are 12 in each group, we can randomly pair them.

  5. After they choose, they record their choices and payoffs. We collect the choices.

  6. We then aggregate the data: for row players, how many chose A, B, C. Similarly for column players. And then we can compute the average payoff.

  7. Then we open a discussion: are there any strategies that seem bad? We want them to notice that C is bad. But they might not, because in some cases C gives 3, which is better than 1 or 0. We want them to see that there is a way to always do better than C.

  8. We then ask: is there a strategy that is always beaten by some other strategy? They will see that no single strategy always beats C: 
  - If the column player plays X, then C gives 3, while A gives 1 and B gives 6 -> so B is better than C, but A is worse.
  - If the column player plays Y, then C gives 3, while A gives 6 and B gives 1 -> A is better, B is worse.
  - If the column player plays Z, then C gives 0, while A and B give 1 -> both A and B are better.

  So in some cases, C is not the worst. But overall, it is dominated by a mixed strategy.

  9. How to introduce the mixed strategy without lecturing? We can say: "Suppose you decided to flip a coin to choose between A and B. Then, no matter what the column player does, what would you get?" 
  - If column plays X: you get 1 (if A) or 6 (if B) with 50% chance, so expected 3.5. Compare to C: 3. So better.
  - Y: 6 or 1 -> 3.5 > 3.
  - Z: 1 or 1 -> 1 > 0.

  So always better.

  10. Then we can agree to eliminate C. We then play again, but now without C: so only A and B for row players, and only X and Y for column players? But note: the column player's strategy Z is also dominated by a mixed strategy of X and Y? Let's check for the column player.

  For the column player, when they play against a row player:

  If the row player plays A:
  - X: 1
  - Y: 6
  - Z: 1

  If the row player plays B:
  - X: 6
  - Y: 1
  - Z: 1

  If the row player plays C:
  - X: 3
  - Y: 3
  - Z: 0

  But after we eliminate C for the row player, then the row player will only play A or B. So in the reduced game, the column player faces only A and B.

  For the column player, against a row player who plays only A or B:

          Row \ Col   X   Y   Z
          A          1   6   1
          B          6   1   1

  Now, is Z dominated by a mixed strategy of X and Y? 
  - If the row player plays A: 
     - X:1, Y:6, Z:1 -> mix of X and Y (50-50): (1+6)/2=3.5 > 1 (which is Z's payoff) 
  - If the row player plays B:
     - X:6, Y:1, Z:1 -> mix: (6+1)/2=3.5 > 1.

  So yes, Z is dominated by the 50-50 mix of X and Y.

  So we can also eliminate Z for the column player.

  Then we have a 2x2 game with A and B for row, and X and Y for column.

  11. So in the next round, we only allow A and B for row players, and X and Y for column players.

  We play again.

  12. Then we can see what happens. In this 2x2, there is no dominated strategy.

  13. But we also want to show a case with weak dominance and order mattering. We can do that in a separate game? We have 90 minutes.

  Maybe we do two different games: one for strict dominance (with mixed) and then a different one for weak dominance.

  But to save time, we can do a quick weak dominance example.

  Alternatively, we can modify the matrix to have a weakly dominated strategy that is order-dependent.

  But let's keep the activity focused on the main point.

  Timeline for 90 minutes:

  - 0-10 min: Introduction and explanation of the game. Write the matrix on the board. Answer questions.
  - 10-20: First round of play. Each of the 24 participants is either a row player or a column player. We have 12 row and 12 column. Randomly pair them. They choose their strategies in secret and then report to a central board: what they chose and their payoff.
  - 20-30: Aggregate and display the results. How many chose each strategy? Average payoff.
  - 30-50: Discussion: "Looking at the results, are there any strategies that seem like they were a mistake? Why? Is there a strategy that, no matter what the other side does, there's always one strategy that beats it? (They will see that C is sometimes good, sometimes bad.) Then introduce the idea of a lottery: "What if you could flip a coin to choose between A and B? How would that do against each choice of the column player?" Let them calculate. They should see that the lottery beats C in every case. Then we declare that we eliminate C for the row player and similarly for the column player (by the same token) we eliminate Z.
  - 50-60: Second round: play without C and without Z. Only A and B for row, X and Y for column. Collect and aggregate.
  - 60-70: Discuss the new game. They may notice that now it's a coordination game with two equilibria. They may also notice that there is no dominated strategy now.
  - 70-85: Now, introduce the weak dominance example. We can do a quick 2x2 game to show order mattering in weak dominance. But we want to be quick.

  Alternatively, we can skip weak dominance if time is short, or we can prepare a separate small example.

  For weak dominance, we can use the following:

          L     R
  U       (1,1) (0,0)
  D       (0,0) (0,0)
  M       (0,0) (1,1)

  In this game, for the row player:
  - U and M are weakly dominated by D? Actually, no.

  But we want weak dominance and order mattering.

  Example:

          L    R
  U      1,?  1,?
  D      0,?  2,?
  M      0,?  1,?

  But we need to have weak dominance and then after eliminating one, another becomes dominated.

  Classic example is from Reny: 

          L    R
  U      1,1  0,0
  M      1,0  0,1
  D      0,0  1,1

  In this game, for the row player, U is strictly dominated by a mixed strategy of M and D? But let's see.

  Alternatively, we can use a simple one:

          L    R
  U      1    1
  D      1    0
  M      0    1

  In this matrix for row player:
  - U is not dominated by D: because in L, both give 1, in R, U gives 1>0.
  - U is not dominated by M: in L, U gives 1>0, in R, U gives 1=1.
  - But U is weakly dominated by D? No, because in R, D gives 0 < 1.

  Actually, let's do:

          L    R
  U      2    2
  D      3    1
  M      1    3

  Now, U is strictly dominated by a mixed strategy of D and M? 
  - 50-50: in L: (3+1)/2=2, equals U in L.
  - in R: (1+3)/2=2, equals U in R.
  - So weakly dominated? Not strictly.

  We want weak dominance.

  Example with weak dominance by a pure strategy:

          L    R
  U      1    0
  D      1    1
  M      0    1

  Here, for the row player:
  - U is weakly dominated by D: in L, both 1; in R, D gives 1>0.
  - M is weakly dominated by D: in L, D gives 1>0; in R, both 1.

  So D weakly dominates both U and M.

  But this is by a pure strategy.

  To have by mixed and order mattering, we need a bigger matrix.

  Example (from Osborne and Rubinstein):

          L    R
  U      3,0  0,1
  M      0,0  3,1
  D      1,1  1,1

  In this game, for the row player, D is strictly dominated by a mixed strategy of U and M (50-50): 
  - against L: (3+0)/2=1.5>1
  - against R: (0+3)/2=1.5>1

  So we can eliminate D. Then we are left with U and M, and then we can see that there is no dominance between U and M.

  But if we do not eliminate D, then we might not eliminate anything else? 

  We want order to matter. So we need a game where if we eliminate a weakly dominated strategy first, we get a different result than if we eliminate a strictly dominated strategy first.

  A standard example is the following 3x3 game (from Myerson):

          L      M      R
  U      0,0    1,0    0,1
  M      0,1    0,0    1,0
  D      1,0    0,1    0,0

  In this game, for the row player, U is weakly dominated by D? 
  - Against L: U=0, D=1 -> D better
  - Against M: U=1, D=0 -> U better
  - Against R: U=0, D=0 -> tie

  So not dominated by D. Actually, no strategy is strictly dominated. But there is weak dominance? 

  This might be too complex.

  Given time constraints, we might focus only on the strict dominance with mixed strategy and the ghost, and then in the debrief mention that for weak dominance the order matters, but not for strict.

  Debrief outline:

  After the two rounds of play, bring the group together.

  1. Ask: "In the first round, did anyone choose C? Why? What was your reasoning?" 
  2. Then: "Was there a compelling reason not to choose C?" 
  3. Guide them to see that C is never the best and sometimes the worst. 
  4. Then: "Is there any single strategy that always does better than C?" (No) 
  5. "What if you could randomize between A and B with a coin flip? How would that do?" 
  6. Calculate together: for each column, the expected payoff of the mix and compare to C. 
  7. "So even though no single strategy beats C in every case, this mixture does. We call this a 'ghost strategy' because it's not a real option in the game, but it haunts C and beats it everywhere." 
  8. "Once we remove C, we then looked at the column player's Z and saw the same thing: a mixture of X and Y beats Z. So we removed Z too." 
  9. "Now, in the reduced game, did any strategy appear dominated? (No) So we stopped." 
  10. "This process is called iterated elimination of dominated strategies. In this case, we used strict dominance by a mixed strategy."

  Then, if time permits, mention: 
    "Sometimes, a strategy can be weakly dominated, meaning that the dominating strategy is at least as good in every situation and strictly better in at least one. In that case, the order in which we eliminate strategies can matter. For example, ... [give a quick example]."

  But to save time, we can skip the weak dominance part in the activity and only mention it in the debrief.

  Predictable problems:

  1. The payoff matrix might be confusing. Some might not understand that the first number is for row, second for column. Solution: explain carefully and do an example.

  2. In the first round, many might choose C because it gives a safe 3. Then when we show the mixed strategy, they might not believe it because they got 3 and the mix might yield less (like 1 or 6, but on average 3.5). So we need to emphasize expected payoff.

  3. They might not see the value of the mixed strategy because it's not a choice they can make. We have to explain that even though they can't randomize, the existence of the mixed strategy dominating C means that C is never a best response and can be eliminated.

  4. The pairing might be an issue: if the distribution of column player's choices is uneven, then C might have given high payoffs. For example, if many column players chose X or Y, then C might have given 3, which is better than the 1 that A or B would have given in some cases. But we can point out that if the column player had chosen Z, then C would have given 0, while A and B give 1. And the mixed strategy gives 1 in Z and 3.5 in X or Y.

  5. Time: 90 minutes is tight. We might run over. Solution: keep a strict timeline.

  6. In the discussion, they might not come up with the mixed strategy. Then we have to nudge: "What if you could combine two strategies?"

  7. The arithmetic of expected value might be a hurdle. We can do the calculations together on the board.

  8. They might resist the idea of mixed strategies as unrealistic for journalists. We can argue that in real life, we sometimes use randomized strategies (like random audits) or that the concept helps to eliminate strategies even if we don't randomize.

  9. The weak dominance part might be skipped if time is short.

  What the activity cannot reproduce: 
  - The activity cannot show the full power of iterated elimination in games with many strategies. We only do one iteration.
  - It might not be obvious that the order doesn't matter for strict dominance. We can state that in the debrief: "In strict dominance, it doesn't matter in which order you remove dominated strategies; you always end up with the same set. But for weak dominance, the order can matter."

  Debrief as a sequence:

  1. "Let's look at the first round choices. How many chose A? B? C? for the row players. How many chose X? Y? Z? for the column players."
  2. "What payoffs did the C-choosers get? How about the A and B choosers?"
  3. "Was there any scenario in which choosing C was the best option? (Yes, if the column player chose X or Y, then C gave 3, which might be higher than what A or B gave in some cases.)"
  4. "But was there any scenario in which choosing C was the worst? (Yes, when the column player chose Z.)"
  5. "Now, is there any single strategy (A or B) that, no matter what the column player does, gives a higher payoff than C? (No, because if the column player chooses X, then B gives 6 which is more than C's 3, but A gives 1 which is less. Similarly for Y: A gives 6, B gives 1.)"
  6. "But what if you could use a random device to choose between A and B, each with 50% chance? Let's calculate what you would get on average. First, if the column player chooses X, what would you get with the random choice? (Half the time 1, half the time 6, so 3.5) How does that compare to C? (3.5 > 3) Now, if the column player chooses Y? (6 half the time, 1 half the time, so 3.5 > 3) And if Z? (1 half the time, 1 half the time, so 1 > 0) So in every case, the random choice between A and B gives a higher payoff than C."
  7. "This is what we call being dominated by a mixed strategy. Even though no single strategy dominates C, a lottery over A and B does. So we can eliminate C because it is strictly dominated."
  8. "After eliminating C, we then looked at the column player's strategies. We did a similar analysis and found that Z is dominated by a mixed strategy of X and Y. So we eliminated Z."
  9. "In the reduced game, we then played with only A and B for the row player and X and Y for the column player. In this game, there is no dominated strategy. So we stop."
  10. "This process is called iterated elimination of strictly dominated strategies. It helps to reduce the game to a smaller set of strategies that are 'rationalizable'."

  Then, if time allows:
  11. "Now, sometimes a strategy is only weakly dominated. That means that the dominating strategy is at least as good in every situation and strictly better in at least one. In that case, the order of elimination can matter. For example, ... [give a quick example, maybe verbally]."

  Finally, connect to journalism: 
  12. "In public policy, we often see arguments that compare one option to one other. But what this shows is that an option might look good against any one alternative but be beaten by a combination. That's why we have to think about portfolios of policies, or mixed approaches."

  This should fit in 90 minutes if we manage time well.

  Materials:
  - Whiteboard or flip chart to display the matrix and record choices.
  - Paper and pens for participants to record their choices (if we don't do public commitment).
  - A way to randomly pair the row and column players (could be as simple as having the row players stand in a line and the column players walk by and take one).

  Roles:
  - Group 1: 12 row players.
  - Group 2: 12 column players.

  We can have them switch roles in the weak dominance example if we do one, but not necessary.

  Let me know if you need more details.
answer: |-
  Alright, let's design this session. I'll sketch the game, the flow, the debrief, and the pitfalls. Since you're pressed for time and the group is sharp but resistant to lectures, we'll lean into their argumentative nature by making the game a collective choice with public commitments, then use that record to drive the debrief. The core is a symmetric 3x3 game where the ghost strategy emerges naturally, and the elimination feels like a group discovery. We'll use points, not money, to avoid distraction.

  Here’s the game: each player is both a "proposer" and an "evaluator" in a simplified policy-lobbying scenario. There are three policy options: Bold (B), Cautious (C), and Hybrid (H). The twist is that the success of a policy depends on how many evaluators (acting as interest groups) "support" it, but evaluators only support a policy if it beats their outside option, which varies. The matrix is symmetric, so every player faces the same payoffs. We’ll run it in rounds with public voting to create a shared record.

  **Rules and Setup**  
  - **Roles**: Split the 24 into two groups of 12: Group A (proposers) and Group B (evaluators). After Round 1, they swap roles.  
  - **Policies**: Proposers choose one policy: B, C, or H.  
  - **Support Conditions**: Evaluators each have a randomly assigned "type" (X, Y, or Z), representing their outside option. There are 4 of each type (since 12 evaluators). A policy gets a player’s support only if it gives them more points than their outside option when facing their type.  
  - **Payoffs (per interaction)**:  
    - *Proposer payoff*: 10 points if their policy gets majority support (i.e., at least 7 of 12 evaluators support it), 0 otherwise.  
    - *Evaluator payoff*: Based on their type and the policy they’re evaluating:  
      - Type X: B=5, C=0, H=3  
      - Type Y: B=0, C=5, H=3  
      - Type Z: B=1, C=1, H=0  
    Evaluators support a policy only if it beats their type’s outside option (e.g., for Type X, B=5 > any alternative, so they always support B; H=3 > 0, so they support H; but C=0 is not > 0, so they don’t support C).  
  - **Gameplay**:  
    1. **Round 1**: Group A proposes policies; Group B evaluates as their types.  
    2. **Voting**: Evaluators publicly declare support/no support for each policy (e.g., raise hands). Tally total support for each policy.  
    3. **Payoffs**: Proposers get 10 if their policy has ≥7 support, else 0. Evaluators get their policy-type payoff only if they supported it.  
    4. **Record**: Write the policy choices, support counts, and payoffs on a board.  
    5. **Swap and Repeat**: Group B now proposes, Group A evaluates. Record again.  
  - **Materials**: Whiteboard, markers, cards for evaluator types (4 X, 4 Y, 4 Z per group of 12).  

  **Why this matrix works for the ghost**  
  - H gives 3 to X and Y, and 0 to Z.  
  - B gives 5 to X, 0 to Y, 1 to Z.  
  - C gives 0 to X, 5 to Y, 1 to Z.  
  - **The ghost**: H isn’t beaten by B or C alone (e.g., against Y, C=5 > H=3, but against X, B=5 > H=3, and against Z, both B and C=1 > H=0). But a 50-50 mix of B and C gives:  
    - X: (5 + 0)/2 = 2.5 < 3? No, 2.5 < 3 fails. Wait—adjust to ensure strict dominance. Revised:  
    - Set H=2.5 for all types (but to avoid decimals, scale payoffs: H=5 for X/Y, H=0 for Z? Let’s recast:  
      - Type X: B=6, C=0, H=3  
      - Type Y: B=0, C=6, H=3  
      - Type Z: B=1, C=1, H=0  
    Now 50-50 mix:  
    - X: (6+0)/2=3 > H’s 3? Still equal. Need strict. Final fix:  
      - H=2.9 for X and Y? But no decimals. Instead, make H=3 for X/Y, but lower B and C slightly? Compromise:  
      - **Type X**: B=5, C=0, H=2  
      - **Type Y**: B=0, C=5, H=2  
      - **Type Z**: B=1, C=1, H=0  
    Now 50-50 mix of B and C:  
    - X: (5+0)/2=2.5 > H’s 2  
    - Y: (0+5)/2=2.5 > H’s 2  
    - Z: (1+1)/2=1 > H’s 0  
    Strict dominance by the mix.  
  - **After eliminating H**: B vs C. Now B is beaten by C against Y (5>0), but C is beaten by B against X (5>0). Neither dominates. But if we add that evaluators sometimes abstain (not in this game), but here no further dominance. For weak dominance later, we’ll add a tweak.  

  **Weak dominance twist**  
  - After Round 2, introduce a "compromise" rule: If a policy gets exactly 6 votes, proposers get 5 points (not 0 or 10).  
  - Now add a fourth policy, Weak (W), with payoffs:  
    - X: W=1, Y: W=1, Z: W=1  
    W is weakly dominated by H (in all types, H≥W and sometimes >, e.g., H=2>1 for X/Y). But if we eliminate H first (as the ghost), W survives; if we eliminate W first, H is still dominated by B/C mix. Order matters.  
  - We’ll run this quickly in Round 3 if time.  

  **Timeline (90 mins)**  
  - **0–15 min**: Introduce the policy-lobbying scenario. Explain roles, payoffs, and voting. Do a dry run with one proposer and three evaluators (one of each type) to demo support rules. Emphasize: evaluators support only if policy > outside option.  
  - **15–30 min**: **Round 1**. Group A proposes (each chooses B, C, or H secretly, then public commit). Group B evaluates (assign types randomly). Vote publicly, record choices/support/payoffs.  
  - **30–45 min**: **Round 2**. Swap roles (Group B proposes, Group A evaluates). Record.  
  - **45–70 min**: **Debrief Part 1 (ghost discovery)**:  
    - "Look at Round 1: Which policies won/lost? Did any proposer regret their choice? Why?"  
    - "H got [X] support. Is there any evaluator type where H is always worse than B? Than C?" (They’ll see: no, H beats C against X, beats B against Y.)  
    - "But H lost overall. Why?" Nudge: "Suppose you could flip a coin between B and C. What would it get against each type?" Calculate together: 2.5 for X/Y, 1 for Z. "Now compare to H’s 2 for X/Y, 0 for Z. Is the coin flip always better?" (Yes.) "So H is beaten by a lottery. We call that a ghost strategy—no single policy kills it, but a mix does."  
    - "Let’s eliminate H. Play Round 3 with only B and C. Same rules." (Quick revote with B/C only; record.)  
    - "Now what happened? Did one dominate?" (Neither; it’s messy.)  
  - **70–80 min**: **Weak dominance demo (if time)**: Introduce W and the "compromise" rule. Run one round with B/C/H/W. Show W is weakly dominated by H, but if you eliminate H first, W survives.  
  - **80–90 min**: **Debrief Part 2 (formal mapping)**:  
    - "When we eliminated H, what changed? Did new weaknesses appear?" (No, but in weak case, order mattered.)  
    - "Why was the ghost hard to spot? How is this like real-world policy debates?" (E.g., a moderate policy beaten only by a portfolio, not any single alternative.)  
    - Finally: "In strict dominance, order didn’t matter—H had to go. But in weak, it might. That’s the fragility of 'good enough' options."  

  **Predictable pitfalls and fixes**  
  1. **Confusion on support rules**: Evaluators might think they support the best policy, not if it beats their outside option. This distorts payoffs.  
     - *Fix*: Drill the dry run. Ask: "If you’re Type X and see H, do you support? (Yes, 2>0). If you see C? (No, 0 not >0)."  

  2. **Payoff arithmetic swamps the point**: If too many focus on evaluator payoffs, the ghost gets lost.  
     - *Fix*: Stress that proposers care only about majority support. Ask: "As a proposer, which policy gives you the best shot at 10 points?"  

  3. **Group guesses your intent**: They might think H is "bad" and avoid it, skipping the discovery.  
     - *Fix*: Don’t hint. In early rounds, some will choose H (it’s safe for X/Y). If no one does, "simulate" a vote: "What if 6 chose H? Would it win?" to force the math.  

  4. **Weak dominance feels tacked on**: With limited time, it might rush.  
     - *Fix*: Skip it if Round 1 debrief runs long. State it verbally: "In other games, a weakly dominated strategy might stay or go depending on order—like trimming options too early in a negotiation."  

  5. **The mix isn’t intuitive**: Some may say, "But I can’t randomize!"  
     - *Fix*: "The lottery is a thought experiment. If no real strategy beats H, but a mental combo does, H is doomed. It’s about vulnerability, not randomization."  

  **What the game can’t do**  
  - **Infinite iterations**: Real iterated elimination can loop, but we stop at one ghost. You’ll need to say: "In bigger games, deleting one ghost can expose others, so you repeat."  
  - **Nash equilibrium**: The activity shows dominance, not equilibrium. Mention: "Ghosts are why some policies aren’t played even if they’re not obviously bad."  
  - **Mixed strategies as playable**: The mix is only a tool for elimination. Say: "We’re not saying you should randomize—we’re saying a strategy can be toxic even if it looks okay against each rival."  

  This should give the group the "aha" of ghost strategies through collective elimination. The key is leaning into their arguments during debrief—let them wrestle with why H lost until someone glimpses the mix. I’d practice the dry run to smooth support rules. Good luck!
