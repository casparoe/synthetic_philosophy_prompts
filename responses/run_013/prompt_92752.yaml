  We are creating a joint statement for an adversarial collaboration between an endurantist and a perdurantist. The goal is to have a document that both can sign, which includes agreed claims and a table of cruxes.

  First, we need a section of agreed claims. These should be substantive and not trivial. We'll cover:

  1. What the question of persistence is about.
  2. What a theory of persistence owes us (explanatory burdens).
  3. Which standard arguments are not by themselves decisive, including:
     a. The problem of temporary intrinsics and Leibniz's law reasoning about change.
     b. The vagueness argument for unrestricted composition.
     c. The relativity of simultaneity and its impact on endurance.
     d. The status of the "momentary stages with temporal counterparts" view.

  Then, we need a table with the following columns:

  - Crux: A short name for the crux.
  - Sub-question stated neutrally: Without using "part" or "whole".
  - Endurantist's statement of the disagreement (in wording they'd accept).
  - Perdurantist's statement (in wording they'd accept).
  - Shared case or argument bearing on it.
  - Endurantist's prediction.
  - Perdurantist's prediction.
  - What would move each side.
  - Genuine or verbal: Whether the disagreement is genuine or partly verbal.

  After the table, we'll have sections on purely verbal residue and judgement calls.

  Let's draft the agreed claims section.

  **Agreed Claims**

  1. **The Question of Persistence**: We agree that the central question is: how do ordinary objects persist through time? Specifically, how can one and the same object exist at different times, given that it may undergo change? This question is distinct from questions about identity over time in the sense of personal identity or the identity of abstract objects.

  2. **Explanatory Burdens**: A theory of persistence must:
     a. Account for the possibility of change in intrinsic properties over time without contradiction.
     b. Provide a coherent account of the unity of an object over time, i.e., what makes the object at one time the same as the object at another time.
     c. Be compatible with our best scientific theories, including relativity theory, and with common sense judgments about persistence (to the extent they are consistent and defensible).
     d. Address the problem of vagueness in persistence conditions, including the possibility of borderline cases of existence or identity over time.

  3. **Non-Decisive Arguments**:
     a. *Temporary Intrinsics and Leibniz's Law*: The argument that change in intrinsic properties (e.g., an object being bent at t1 and straight at t2) violates the indiscernibility of identicals (Leibniz's Law) if the object is identical at t1 and t2, is a challenge for any theory of persistence. However, we agree that both endurantism and perdurantism have responses (e.g., relativizing properties to times, or invoking temporal parts) and that the argument does not by itself settle the debate.
     b. *Vagueness Argument for Unrestricted Composition*: The argument that if composition is restricted, then it must be vague when composition occurs, leading to vagueness in existence, which some find problematic. We agree that this argument does not directly decide between endurantism and perdurantism, as both can adopt either restricted or unrestricted composition, though it may have implications for the metaphysics of persistence.
     c. *Relativity of Simultaneity*: We agree that the relativity of simultaneity in special relativity undermines the notion of a privileged present. However, it is not clear that this directly rules out endurantism, because endurantism might be reformulated without a global present (e.g., by relativizing to reference frames). The argument does not by itself show that endurance is impossible.
     d. *Momentary Stages with Temporal Counterparts*: We agree that the view that posits momentary stages and a relation of temporal counterpart (similar to modal counterpart theory) is, in its standard form, a version of perdurantism. The stages are temporal parts, and the counterpart relation is a way of explaining persistence without identity. Thus, this is not a genuine third way but a notational variant of perdurantism.

  Now, we move to the table of cruxes. We'll identify the cruxes as:

  1. The definability of "wholly present" without begging the question.
  2. The success of the vagueness argument for unrestricted composition.
  3. The case of instantaneous total replacement (the mug with all parts swapped at once).
  4. The amoeba case (division and fusion).
  5. The case of intermittent existence (exists at t1 and t3 but not t2).

  We might also include:

  6. The implications for de re modality: how do we account for the modal properties of persisting objects?

  But note that the user mentioned "something about de re modality", so we'll include that.

  We'll structure the table accordingly.

  **Cruxes Table**

  | Crux | Sub-question stated neutrally | Endurantist's statement | Perdurantist's statement | Shared case or argument | Endurantist's prediction | Perdurantist's prediction | What would move each side | Genuine or verbal |
