answer: |-
  ### Joint Statement of Adversarial Collaboration: Persistence through Time  

  **Agreed Claims**  
  1. **Nature of the Question**: The core dispute concerns how ordinary objects persist through time. Specifically, it addresses how an object can be the same entity at multiple times despite potential changes in its properties, location, or parts. This is distinct from questions of personal identity or mereological composition.  
  2. **Explanatory Requirements**: A theory of persistence must:  
     - Explain the possibility of intrinsic change (e.g., shape, mass) without violating logical identity constraints.  
     - Account for the unity of an object across time (i.e., what grounds the fact that an object at \(t_1\) is the same as at \(t_2\)).  
     - Be compatible with scientific frameworks (e.g., relativity) and intuitive judgments about ordinary objects.  
     - Address cases of vagueness (e.g., borderline persistence) without implying incoherence.  
  3. **Non-Decisive Arguments**:  
     - **Temporary Intrinsics and Leibniz’s Law**: The challenge that intrinsic change violates the indiscernibility of identicals is resolvable by both views (e.g., via time-indexed properties or temporal part properties). Neither solution is inherently superior without further argument.  
     - **Vagueness Argument for Unrestricted Composition**: While vagueness in composition might suggest unrestricted mereology, both views can accommodate restricted composition (e.g., through epistemicism or ontic vagueness). This argument does not uniquely favor either view.  
     - **Relativity of Simultaneity**: Relativity undermines a global "present," but this does not directly invalidate endurance, as endurance can be frame-relative. Conversely, it does not entail perdurance.  
     - **Momentary Stages as Perdurantism**: The "temporal counterpart" model (where objects are stages related by counterpart relations) is functionally equivalent to perdurantism, not a distinct third theory.  

  ### Cruxes Table  
  | Crux | Sub-question stated neutrally | Endurantist's statement of the disagreement | Perdurantist's statement of the disagreement | Shared case or argument bearing on it | Endurantist's prediction | Perdurantist's prediction | What would move each side | Genuine or verbal |  
  |------|-------------------------------|---------------------------------------------|----------------------------------------------|--------------------------------------|--------------------------|---------------------------|---------------------------|-------------------|  
  | Definiability of "Complete Presence" | Can an entity's existence at a time be characterized as exhaustive and undivided, without presupposing that it lacks extension across time? | "An entity persists by being exhaustively and undividedly located at each moment it exists; nothing about it is 'left behind' or 'yet to come' at that time." | "An entity’s existence at a time is always partial; it is never exhaustively present because it is extended across time, with distinct portions at distinct times." | Analysis of the concept: If "exhaustively present" means no sub-entity is absent at that time, does this entail that the entity lacks temporal extension? | The endurantist predicts that "exhaustive presence" is coherent and distinct from temporal extension. | The perdurantist predicts that "exhaustive presence" either reduces to our concept of a temporal slice or is incoherent. | Endurantist: If "exhaustive presence" were shown to require temporal extension (e.g., via relativity). Perdurantist: If "exhaustive presence" were defined without circularity and matched strong intuitions (e.g., in static objects). | Verbal (if definable independently) or genuine (if definitional issues reflect deeper metaphysical commitments). |  
  | Vagueness Argument Success | Does the possibility of borderline cases of existence imply that entities must have unrestricted mereological boundaries? | "Vagueness in persistence is compatible with restricted composition; borderline cases reflect epistemic or ontic indeterminacy, not unrestricted parts." | "Vagueness in existence implies unrestricted composition; otherwise, vague boundaries would require metaphysically unacceptable sharp cuts." | A cloud that disperses gradually: Is there a precise moment it ceases to exist? | The endurantist predicts that vagueness can be resolved without unrestricted composition (e.g., via supervaluationism). | The perdurantist predicts that only unrestricted composition avoids arbitrary thresholds. | Endurantist: If unrestricted composition were proven the only solution to vagueness. Perdurantist: If a non-arbitrary restricted-composition account of vagueness succeeded (e.g., epistemicism). | Genuine (turns on the nature of vagueness). |  
  | Instantaneous Total Replacement | When every component of an entity is replaced at a single instant, does the original entity cease to be? | "An entity cannot survive instantaneous total replacement; the complete removal of all components terminates its existence, and a new entity begins." | "An entity persists through instantaneous replacement; the replacement is a temporal segment of its history, with pre- and post-replacement segments connected spatiotemporally." | The department mug: Hypothetically, every atom is swapped at once. | The endurantist predicts that intuition strongly distinguishes gradual replacement (persistence) from instantaneous (non-persistence). | The perdurantist predicts that intuition treats gradual and instantaneous replacement identically; persistence depends on continuity, not replacement speed. | Endurantist: If empirical evidence showed no intuitive difference between gradual and instantaneous cases. Perdurantist: If instantaneous replacement were shown to break spatiotemporal continuity (e.g., in quantum mechanics). | Genuine (hinges on the role of continuity in persistence). |  
  | Division and Fusion Identity | After an entity divides into two and later fuses, is there a single entity that persists through the entire process? | "The original entity ceases to exist upon division; the fusion produces a new entity. No single entity persists through division and fusion." | "The original entity persists as a temporally extended whole that includes branches; division and fusion are features of its temporal structure." | The amoeba: Splits into two, which later re-fuse. | The endurantist predicts that identity cannot be maintained through division/fusion without violating transitivity (e.g., the two post-division entities cannot be identical to the same pre-division entity). | The perdurantist predicts that identity can be maintained via temporal counterpart relations or branching. | Endurantist: If division/fusion cases were shown to have a unified "life story" (e.g., in biology). Perdurantist: If division/fusion violated core logic (e.g., non-transitivity of identity). | Genuine (about transitivity and identity conditions). |  
  | Intermittent Existence | Can an entity exist, cease to exist, and later resume existing without being a different entity? | "An entity cannot cease and resume existence; cessation implies permanent termination, so post-resumption entities are numerically distinct." | "An entity can have intermittent existence; gaps do not break identity if suitable connections (e.g., causal) link the temporal segments." | An entity existing at \(t_1\) and \(t_3\), but not \(t_2\) (e.g., a particle annihilated and recreated). | The endurantist predicts that such cases involve distinct entities at \(t_1\) and \(t_3\). | The perdurantist predicts that the entity persists if causal or qualitative connections bridge the gap. | Endurantist: If a clear case of causal continuity across gaps emerged (e.g., in quantum resurrection). Perdurantist: If gaps were proven to disrupt de re modality (e.g., the entity at \(t_3\) lacks essential properties of \(t_1\)). | Genuine (about the necessity of continuous existence). |  
  | De Re Modal Persistence | How do we describe possibilities for a persisting entity (e.g., "it could have been different") without implying that it exists outside its actual timeline? | "Possibilities for an entity are intrinsic to it; a persisting entity could have had different properties while remaining numerically identical." | "Possibilities involve counterpart relations; a persisting entity’s modal properties depend on similar entities in other possible worlds, not intrinsic 'could-have-beens'." | The department mug: "Could it have been made of different material?" | The endurantist predicts that de re modality is intrinsic and unified across time. | The perdurantist predicts that de re modality is extrinsic and relationally defined. | Endurantist: If counterpart theory were proven necessary for modal logic. Perdurantist: If intrinsic modality were shown indispensable (e.g., for essential properties). | Genuine (about the nature of modality). |  

  ### Purely Verbal Residue  
  The disagreement over "complete presence" (Crux 1) may be partly verbal. If "exhaustively present" is defined as "no sub-entity absent at that time," perdurantists could accept this for temporal slices, while endurantists apply it to the entire entity. This reduces to whether "entity" refers to the whole persisting object (endurance) or a temporal slice (perdurance). If both sides agree that temporal slices are "exhaustively present" but dispute whether the persisting whole is more than its slices, the crux becomes metaphysical (genuine).  

  ### Judgement Calls  
  1. **Endurantism and "Wholly Present"**: We assume the endurantist defines persistence as exhaustive presence *without* temporal extension. Some endurantists may allow temporal extension if it is non-mereological, but we treat "exhaustive presence" as incompatible with extension for clarity.  
  2. **Perdurantism and Modality**: We link perdurantism to extrinsic (counterpart-based) modality, though some perdurantists may accept intrinsic modality. This reflects the common perdurantist stance that persistence is analogous to modality.  
  3. **Vagueness Argument**: We assume the perdurantist ties vagueness to unrestricted composition, though perdurantism *can* accommodate restricted composition. This emphasizes the argument’s role in motivating perdurantism.  
  4. **Intermittent Existence**: We present endurantism as rejecting intermittent existence entirely. Some endurantists may accept it under causal continuity, but we prioritize the stricter view to highlight the contrast.  
  5. **Division and Fusion**: We attribute transitivity-based objections to endurantism, though some may use alternative arguments (e.g., substance ontology). This captures a core endurantist intuition.  

  Both parties should revise wording in their respective columns to ensure accuracy. The cruxes are designed to force substantive progress, not restate entrenched positions.
