  | De Re Modality | How do we account for the modal properties of a persisting object? For example, could a particular object have been different? | Endurantism: The object, being wholly present at each time, has its modal properties intrinsically. It could have had different properties, but that would be a matter of how that very object could have been. | Perdurantism: Modal properties are analyzed in terms of counterparts across possible worlds, and similarly, for temporal persistence, we have temporal counterparts. But this does not imply that the object itself has intrinsic modal properties; rather, they are relational. | Consider the department mug: could it have been made of different matter? | The endurantist predicts that the mug could have been made of different matter, and this is a property of the mug itself. | The perdurantist predicts that the mug's modal properties are determined by its counterparts in other possible worlds, which may have different matter. | Endurantist: If it were shown that de re modality must be analyzed counterpart-theoretically, that would move them. Perdurantist: If it were shown that objects have intrinsic modal properties that cannot be captured counterpart-theoretically, that would move them. | Genuine. It's about the nature of modality. |

  Note: The user also mentioned the relativity of simultaneity and the status of the stages view. We have covered the stages view in the agreed claims. The relativity crux might be subsumed under the explanatory burdens (compatibility with science). But if needed, we can add a crux about relativity. However, the user said that they agree it doesn't touch endurance as such, so it might not be a crux.

  Now, we add the residue and judgement calls sections.

  **Purely Verbal Residue**

  We believe that part of the disagreement about the term "wholly present" is verbal. If the parties agree that at each time, the object is present in its entirety (as the endurantist says) and that the object has temporal parts (as the perdurantist says), then the dispute may reduce to whether "wholly present" is compatible with having temporal parts. If the perdurantist accepts that a temporal part is wholly present at a time, then the endurantist's use of "wholly present" for the entire object might be seen as a different concept. Clarifying the terminology might resolve some of the disagreement.

  **Judgement Calls**

  1. In the endurantist statement for the "wholly present" crux, we have characterized endurantism as holding that the entire object is present at each time. Some endurantists might add that the object is not extended in time, but we have avoided that to prevent question-begging.

  2. In the amoeba case, we have assumed that the endurantist denies that the same amoeba persists through division and fusion. Some endurantists might try to maintain identity through a temporary division by appealing to a dormant existence, but we have taken the standard view that division ends the existence of the original.

  3. For de re modality, we have linked perdurantism to counterpart theory, but not all perdurantists are counterpart theorists. However, we believe that the perdurantist is more naturally inclined to a relational account of modality.

