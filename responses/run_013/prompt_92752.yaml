  | Vagueness Argument | Does the possibility of vague existence or vague identity over time imply that composition must be unrestricted? | Endurantism: We can maintain that composition is restricted and that vagueness in persistence is due to vagueness in the world, not in our language. | Perdurantism: The vagueness argument shows that if composition is restricted, then there must be vague existence, which is unacceptable. Therefore, composition must be unrestricted, and perdurantism can accommodate unrestricted composition more naturally. | Consider a case of a cloud that gradually disperses. Is there a precise moment when it ceases to exist? If not, then either existence is vague (which some reject) or composition is unrestricted (so there is always an object, but it may not be a cloud). | The endurantist predicts that we can account for vagueness without unrestricted composition, e.g., by epistemicism or by accepting ontological vagueness. | The perdurantist predicts that without unrestricted composition, we face an unacceptable choice between sharp cuts and vagueness in being. | Endurantist: If it were proven that ontological vagueness is impossible, that would move them. Perdurantist: If a coherent account of restricted composition without ontological vagueness were provided (e.g., epistemicism), that would move them. | Genuine. It's about the nature of vagueness and composition. |
  | Instantaneous Total Replacement | In a scenario where an object is replaced part by part over time, but done instantaneously, does the original object persist? | Endurantism: In the case of instantaneous total replacement (all parts swapped at once), the original object ceases to exist and a new one comes into being. The object cannot survive the loss of all its parts at once. | Perdururantism: The instantaneous replacement is a temporal part of the object's history. The object before replacement and after are different temporal parts, but they are parts of the same space-time worm. So the object persists. | The department mug: normally, it loses parts gradually (e.g., chipping, gluing) and persists. But if all parts are swapped at once, what happens? | The endurantist predicts that in the instantaneous case, we would judge that the original mug is gone and a new one is there. | The perdurantist predicts that the persistence conditions are the same in gradual and instantaneous replacement: the object persists in both cases. | Endurantist: If it were shown that our intuitions about the instantaneous case are not different from the gradual case, that would move them. Perdurantist: If it were shown that the instantaneous replacement breaks the spatiotemporal continuity, that would move them. | Genuine. It's about the role of continuity. |
