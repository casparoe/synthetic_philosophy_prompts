  First, I need to identify the core axes the debate hinges on. The user outlined several: causal contribution (zero, imperceptible, aggregate), harm structure (threshold or smooth), moral focus (causation, participation, character, fairness), and institutional response. I should brainstorm these separately before structuring the tree.

  For causal contribution, scenarios like the burger purchase or voting have different nuances. The burger case involves fixed batches making individual impact zero, while voting might be imperceptible in a landslide. The flight with carbon offset adds a twist—neutralized harm. The 1001 participants case is key for thresholds.

  Harm structure matters too: threshold harms (like triggering an event at 1000 people) versus smooth ones (each burger gradually increases demand). This affects whether individual acts can be pivotal.

  Moral dimensions include complicity (participating in collective wrong), virtue (integrity), fairness (doing one's share), and expected consequences. Some views might overlap, like complicity and participation-based integrity.

  The user wants leaves for all major positions: permissible acts with political duty, expected consequences, imperceptible wrongs, pivotal acts, fair-share, complicity, virtue, and the "nothing wrong" view. I need to ensure the tree captures these, especially for the four cases mentioned.

  Structuring the decision tree: Start broad. First question should address if the act causes direct, immediate harm. If yes, it's straightforwardly wrong. If no, delve deeper into causal influence—zero or imperceptible? For zero impact, like the burger batch, explore moral reasons beyond causation. For imperceptible, consider aggregate effects or thresholds.

  Threshold cases need a specific branch. The 1001 participants case fits here—ask if the harm is threshold-based and if the person is pivotal. If not, then complicity or fairness views apply.

  The flight case with carbon offset introduces neutralized harm. Here, the act might be permissible unless there are other moral reasons, like endorsing harmful practices.

  Voting with a friend casting the same ballot introduces overdetermination. This touches on complicity and participation—does merely being part of the act matter, even if causally redundant?

  I should flag where views blur, like complicity and participation-based integrity. Both focus on endorsing the practice rather than causation. Fair-share and rule-consequentialism might also overlap in emphasizing collective responsibility.

  Empty branches might occur if a combination is incoherent. For example, if an act has zero causal impact and no threshold, claiming it's imperceptibly harmful might be unattractive or unexplored.

  Testing the tree with the four cases: The burger purchase leads to zero impact, pushing towards complicity or virtue ethics. Voting in a landslide with a duplicate vote might highlight participation over causation. The carbon-neutral flight could be permissible unless endorsing flying is an issue. The 1001 participants case tests thresholds and fairness.

  Ensuring questions are plain language: No jargon. Instead of "are you a rule-consequentialist?", ask "Does acting this way make you part of a harmful practice?" or "Would it be fair if everyone did what you're doing?"

  Finally, the user mentioned some leaves might not separate cleanly. Complicity and virtue (integrity) both revolve around personal complicity in harm, making them hard to distinguish in practice. Similarly, fair-share and rule-consequentialist views both emphasize collective rules, so they might blend.
answer: |-
  Here’s a decision tree built on philosophical axes of collective action, designed for reader accessibility. The structure isolates key distinctions: **causal impact** (zero vs. imperceptible vs. aggregate/threshold), **moral focus** (consequences vs. participation vs. character vs. fairness), and **institutional redirection**. I’ve embedded your four cases naturally and flagged blurred boundaries.

  **Core Axes Brainstorm** (foundations for the tree):  
  1. **Causal Efficacy**: Does the act *change* the outcome (none/imperceptible/pivotal/aggregate)?  
  2. **Harm Structure**: Is the harm threshold-based (e.g., "1,000th trigger") or smooth (e.g., gradual demand increase)?  
  3. **Moral Ground**: Why might the act matter? (Direct harm caused / Participation in harm / Character corruption / Unfairness to others / Symbolic endorsement).  
  4. **Institutional Priority**: Does individual inefficacy shift obligation to systemic change?  

  ---

  ### **DECISION TREE: "Does My Individual Act Matter?"**  
  Start here →  

  1. **If everyone acted like you, would it clearly cause serious harm?**  
     - **YES** → Go to 2.  
     - **NO** → Your act is likely **permissible** (*Leaf 1: Permissible Act*).  
     - *Example: Buying the burger in a world where everyone did so would destroy ecosystems. But if your act alone seems harmless...*  

  2. **Does your specific act change the outcome?**  
     - **YES, DIRECTLY** (e.g., you poison a well) → It’s **wrong** (*Leaf 2: Direct Harm*).  
     - **NO** → Go to 3.  
     - *Example: Your burger purchase doesn’t kill an extra cow (batches), your vote doesn’t sway the election (landslide), or you’re not the 1,000th trigger.*  

  3. **Is the harm "threshold-shaped"?** (e.g., harm happens only if a precise number act, like 1,000 participants)  
     - **YES** → Go to 4.  
     - **NO** (harm is smooth/gradual) → Go to 5.  
     - *Example: The "1,001 participants" case is threshold-shaped; burger demand is smooth.*  

  4. **Do you know you’re *not* the pivotal actor?** (e.g., you’re person 1,001 in a 1,000-person threshold)  
     - **YES** (not pivotal) → Your act **lacks causal power**, but go to 6 to check non-causal reasons.  
     - **NO** (might be pivotal) → It’s **wrong** due to risk (*Leaf 3: Pivotal-Act View*).  

  5. **Does your act still make the harm *slightly* worse?** (e.g., adds invisible pressure to a system)  
     - **YES** → It’s **wrong** like adding a drop to a flood (*Leaf 4: Imperceptible Harm View*).  
     - **NO** (truly zero impact) → Go to 6.  
     - *Example: Burger purchase in fixed batches has zero impact; voting in a landslide with a backup voter may have zero impact.*  

  6. **Does acting this way make you part of a harmful practice you’d condemn?** (e.g., funding factory farms)  
     - **YES** → You’re **complicit** (*Leaf 5: Complicity View*).  
     - **NO** → Go to 7.  
     - *Example: Buying the burger supports an industry you believe is cruel, even if your purchase changed nothing.*  

  7. **Would it be unfair to others if you didn’t act?** (e.g., they’re doing their part)  
     - **YES** → You owe your **fair share** (*Leaf 6: Fair-Share View*).  
     - **NO** → Go to 8.  
     - *Example: Not voting in a swing state if others rely on turnout; not reducing carbon if others sacrifice.*  

  8. **Does acting this way conflict with your values?** (e.g., "I’m someone who cares about animals/climate")  
     - **YES** → It **corrupts your character** (*Leaf 7: Virtue/Integrity View*).  
     - **NO** → Go to 9.  

  9. **Is the harm fully neutralized?** (e.g., carbon removal funded for your flight)  
     - **YES** → Your act is **harmless** (*Leaf 8: Neutralized Harm*).  
     - **NO** → Go to 10.  
     - *Example: The "carbon-neutral flight" case fits here.*  

  10. **Could political action change this system?**  
      - **YES** → Your duty is **primarily political** (*Leaf 9: Institutional Lever View*).  
      - **NO** → Your act is **trivial** (*Leaf 10: No Wrongdoing*).  

  ---

  ### **LEAF POSITIONS**  
  1. **Permissible Act**: Harm only occurs if *all* act like you—your act alone is safe. (*Empty branch: Rarely defended if harm is serious.*)  
  2. **Direct Harm**: You directly cause harm. Simple wrong.  
  3. **Pivotal-Act View**: Threshold cases demand caution—risk of being pivotal makes refusal obligatory.  
  4. **Imperceptible Harm View**: Tiny contributions are still wrong (e.g., smooth-demand burger purchases).  
  5. **Complicity View**: You share responsibility for collective harm by participating (e.g., burger purchase).  
  6. **Fair-Share View**: You owe others fairness, regardless of impact (e.g., voting in swing states).  
  7. **Virtue/Integrity View**: Acting against your values degrades character.  
  8. **Neutralized Harm**: Harm canceled out? No issue (e.g., carbon-offset flight). (*Unnamed but defensible.*)  
  9. **Institutional Lever View**: Focus energy on policy—individual acts are distractions.  
  10. **No Wrongdoing**: Trivial impact + no moral resonance = no blame.  

  ---

  ### **EMPTY BRANCHES & BLURRED LEAVES**  
  - **Empty**: Branch after Q5 ("NO" to imperceptible harm) → Q6 (complicity). *Why empty?* If harm is smooth *and* you have zero impact (unlikely), complicity is the main fallback. Not incoherent, just niche.  
  - **Blurred Leaves**:  
    1. **Complicity (Leaf 5) vs. Virtue (Leaf 7)**: Both condemn participation. *Distinction*: Complicity focuses on collective responsibility; virtue on personal integrity. Hard to separate when your values *are* anti-complicity.  
    2. **Fair-Share (Leaf 6) vs. Rule-Consequentialism**: Fair-share is deontic ("owe others"); rule-consequentialist asks "what if everyone did this?". The tree merges them under fairness for simplicity.  

  ### **HOW THE CASES MAP**  
  - **Burger (batches)**: Q5 → **NO** (zero impact) → Q6 → **YES** → *Complicity View*.  
  - **Vote (landslide + backup)**: Q5 → **NO** (zero impact) → Q6 → **NO** → Q7 → **YES** (if swing-state ethics apply) → *Fair-Share View*; else **NO** → *Virtue View* or *No Wrongdoing*.  
  - **Carbon-Neutral Flight**: Q9 → **YES** → *Neutralized Harm*.  
  - **1,001 Participants**: Q3 → **YES** (threshold) → Q4 → **YES** (not pivotal) → Q6 → **YES** → *Complicity View*.  

  This tree forces confrontation with causal nuances *before* moral dimensions, avoiding jargon while isolating key philosophical divides. Readers can trace their own cases and land on defensible positions—even the uncomfortable ones.
