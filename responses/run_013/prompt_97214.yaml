answer: |-
  Here's a faithful translation of the "future contingents" problem (sea-battle argument) into distributed systems/programming semantics, followed by a residue report analyzing the fit and gaps:

  ### Translated Problem: The Sea-Battle Argument in System Semantics
  1.  **The System**: The universe is modeled as a globally-ordered, append-only **event log** (event-sourced system). The current state is the result of replaying all events up to now (`t_now`). The future state at `t_tomorrow` depends on events appended between `t_now` and `t_tomorrow`.
  2.  **The Proposition (P)**: "A sea-battle occurs at `t_tomorrow`."
  3.  **The Question**: Is `P` **true** *today* (`t_now`), or does it lack a truth value? Does its truth-value status imply the future is *fixed* (events are already "scheduled") or *open* (events are not yet "committed")?
  4.  **Key Positions**:
      *   **Bivalence (Fatalist Lean)**: At `t_now`, `P` must be either **True** or **False**. There is no third option. If `P` is True *now*, the sea-battle *must* occur; if False, it *cannot* occur. The future event log is already "determined" (though perhaps not observed). Denying bivalence now would violate logical consistency later when replaying the log.
      *   **Truth-Value Gap (Open Future)**: At `t_now`, `P` has **no truth value** (`undefined`). The events determining `P` haven't been appended to the log yet. The future log is not fixed; multiple **valid speculative execution paths** exist. `P` will become true or false only when the relevant events are appended (at or after `t_tomorrow`). Asserting `P` is true/false *now* is an error (reference to a non-existent log entry).
      *   **Supervaluationism (Refined Open Future)**: While `P` lacks a *definite* truth value at `t_now`, it is **settled-true** if it holds on *all* currently possible future paths (like a value guaranteed by all speculative executions), **settled-false** if it fails on all paths, and **indeterminate** if it holds on some paths but not others (like a race condition outcome). Truth *now* requires invariance across all possible continuations.
      *   **Ockhamism (Compatibilist)**: `P` *is* true or false at `t_now` **relative to the *actual* future path**. However, we lack access to which path *is* actual (like an unobserved branch). The future log *is* fixed (there *is* one actual sequence of future events), but it's epistemically inaccessible. This fixes bivalence without implying fatalistic *necessity* from our perspective (we don't know the branch).

  ### Residue Report: Translation Fidelity & Gaps

  | Philosophical Concept          | Software Translation                                                                 | Fidelity                                                                                                                               | Distortion/Gap                                                                                                                                                                                                                                                               |
  | :----------------------------- | :----------------------------------------------------------------------------------- | :-------------------------------------------------------------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |
  | **Future Contingent (P)**      | Proposition about the result of a future computation/scheduler decision.             | **Clean.** Maps to a predicate on the state at a future trace/time.                                                                     |                                                                                                                                                                                                                                                                              |
  | **Bivalence (True/False Now)** | Boolean value defined at `t_now` for `P`.                                            | **Syntactically Clean, Semantically Loaded.** Easy to implement syntactically.                                                          | **Assumes Determinism/Fixed Log:** Requires the future log to be predetermined or commits to one branch *now*. Presents a logical model where `P` must be T/F *now*, which may not reflect reality. Ignores the possibility of a genuinely open scheduler.                                      |
  | **Truth-Value Gap**            | `P` is `undefined`/`null`/`error` at `t_now`.                                        | **Clean (as a model).** Perfectly coherent in the model (unresolved future reference).                                                  | **Doesn't Settle Metaphysics:** Implementing `undefined` doesn't *prove* the future is open; it's just one possible model. Philosophers debate if this gap reflects reality or just ignorance.                                                                                |
  | **Open Future (Metaphysical)** | **Unmerged Branches:** Multiple valid speculative execution paths exist.             | **Clean Representation.** Models the "garden of forking paths" intuition well.                                                         | **Is it More Than Branches?** Yes. The philosophical claim is that **only one branch is *real* or *actualizable* right now**, but *which one* isn't settled. Software branches all "exist" in the model/speculation space. The "thin red line" (actual future) is missing. |
  | **Fixed Future (Fatalism)**    | **Determinism:** `next_state = F(current_state, inputs)`.                            | **Clean for Determinism.** If the system is deterministic and inputs are fixed, the future *is* entailed.                                | **Not Just Determinism:** Fatalism often implies fixity *even if* the system appears non-deterministic (inputs are mysteriously fixed). Software determinism is a specific property, not necessarily a metaphysical claim. "Inputs are fixed" is the critical assumption.       |
  | **Fixed Future (Ockhamism)**   | **Single Actual Branch:** There *is* one actual future log, but its contents are unobserved until appended. | **Clean Representation.** Models the idea of a fixed-but-unknown future. `P` is T/F relative to this branch. | **Access to the Branch?** Software can *simulate* knowing the branch (debugging). Ockhamism denies *any* access before the events happen. The "actuality" of the branch is primitive.                                                                                         |
  | **Supervaluation (Settled)**   | Predicate holds/fails on **all** possible speculative branches.                      | **Very Clean.** Directly maps to invariance under all possible continuations.                                                           | **Limited Scope:** Primarily defines "settled truth," not the core indeterminacy itself.                                                                                                                                                                                     |
  | **Tensed Facts**               | Truth value of `P` *changes* from `undefined` -> `T`/`F` as events are appended.     | **Clean (for the Gap view).** State-dependent truth is fundamental.                                                                     | **Real Change vs. Log Growth?** Does the *fact itself* change, or just our log/data about it? Philosophers debate if tensed facts are fundamental.                                                                                                                          |
  | **Not Known vs. Not Settled**  | **Not Known:** We don't know which branch will be taken. **Not Settled:** No branch is yet "actual"/chosen. | **Distorted/Partial.** Software models easily distinguish known vs. unknown (`observed` vs. `unobserved`). | **Gap: "Actual" Branch:** The core gap is the metaphysical notion of an "actual" future being *unsettled* vs. merely *unknown*. In software models, branches are usually all ontologically equal possibilities within the simulation space. The "choice" event lacks metaphysical weight.             |
  | **Metaphysical Openness**      | The scheduler has **genuine choice**; the next event is **not determined** by prior state + inputs. | **No Direct Counterpart.** Can model *non-determinism* (multiple valid next states), but...                                     | **Gap: What is "Genuine Choice"?** Software non-determinism is modeled as a choice from a set (often based on external input or RNG). The philosophical debate centers on the *nature* of this "choice" – is it random, agent-caused, or illusory? The *metaphysical openness* resides here. |

  ### Direct Answers to Your Questions

  1.  **Is the open-future view just unmerged branches?**
      *   **Partially, but not fully.** Unmerged branches perfectly *model* the structure of possibilities inherent in the open-future view. However, the philosophical claim often includes that **only one future will *become actual***, and crucially, **which one is not yet settled** or determined by the present state + laws. In software models, the branches typically all "exist" as mathematical/speculative objects; the "actuality" of one upon execution is predefined by the model's rules or inputs. The *metaphysical unsettledness* – the idea that the universe itself hasn't "picked" a branch yet – isn't directly captured by the branch structure alone.

  2.  **Is fatalism just determinism?**
      *   **No, but determinism implies a form of fatalism relevant to this problem.** Fatalism claims the future is *fixed* or *unavoidable*. Determinism (next state entailed by current state + inputs + laws) is one clear way this can happen – the "inputs" are fixed, so the outcome is fixed. However, **fatalism can be argued *even in non-deterministic systems*** (Ockhamism: one branch *is* actual, we just don't know it; or Theological Fatalism: God knows the branch). The software translation *can* model fatalism via determinism or via the Ockhamist "single actual branch" model. Determinism is a sufficient, but not strictly necessary, condition for a fatalistic conclusion in the sea-battle argument.

  3.  **Does "true now about tomorrow" survive as truth-at-a-trace?**
      *   **Yes, but it transforms the problem.** `P` being "true at trace `T` (which includes `t_tomorrow`)" is perfectly coherent. The debate becomes: **Does the *actual* trace `T` (the complete event log of the universe) exist *now* such that `P`'s truth value in `T` is a fact *now*?**
          *   **Fatalism/Ockhamism:** Yes, `T` exists (or its defining properties are fixed), so `P`'s truth value in `T` is a fact now.
          *   **Open Future (Gap/Supervaluation):** No, `T` (specifically, the part after `t_now`) does not exist yet / is not fixed. `P` can only be evaluated relative to *possible* traces or becomes defined only when `T` is extended. "Truth-at-`T`" only becomes applicable when `T` is complete/actualized.

  ### Conclusion: Substance vs. Missing Vocabulary

  *   **Clean Translations:** The core structure – event log, current state, future states, propositions about future states, determinism, non-determinism, branching possibilities, unknown vs. undefined – translates remarkably well. The main philosophical *positions* (Bivalence, Truth-Value Gap, Supervaluation, Ockhamism) can be coherently modeled.
  *   **Distortions & Required Assumptions:** The translation often **smuggles in a specific logical or temporal ontology** (e.g., treating the event log as a fixed, complete object, or treating all branches as equally "real" possibilities). Presenting bivalence as the default "clean" option assumes a fixed future log. Representing openness *only* as branches risks conflating epistemic possibility with metaphysical indeterminacy.
  *   **The Residue is Substantive:** The untranslated elements – **bivalence as a necessary principle** (vs. a modeling choice), **metaphysical openness vs. epistemic uncertainty**, the **primitive notion of "actuality" or "settledness"**, and the **nature of "genuine choice"** – are not merely artifacts of poor vocabulary. They point to genuine, unresolved philosophical questions about **time, causality, free will, and the nature of truth and reality** that computational models, by their nature, *presuppose* answers to (e.g., what constitutes an "input", the ontological status of possible traces, the definition of "execution") or simply don't address. The software framework provides powerful analogies and models, but it doesn't dissolve the underlying metaphysical debate; it often highlights where the philosophical assumptions are baked into the computational model itself. The dispute remains substantive precisely *because* different, coherent models can be built reflecting different positions, and the choice between them depends on these deeper unresolved questions.
