  Final take: The sentence endures because it bundles a legal tactic (denying proximate cause) with a linguistic quirk. But the deepest thread is #6—law often cares about duty breaches more than but-for causality. That’s the quiet engine beneath the slogan.
answer: |-
  Here’s a rigorous disambiguation of "you cannot cause harm by doing nothing," structured as a taxonomy of distinct interpretations. I’ve mapped these from trivial/platitudinous to radical, assessed their defensibility, compatibility with agreed facts ("but-for" causality), and functional utility in your described exchanges. The sentence’s durability stems from conflating these readings—often masking normative claims as metaphysical ones.

  ---

  ### **Brainstorm: Core Dimensions of Ambiguity**
  - **Ontological**: Is an "omission" a real entity that can exert causal power?  
  - **Semantic**: Does the word "cause" linguistically exclude inaction?  
  - **Normative**: Are we assigning responsibility (blame/liability) or describing causality?  
  - **Epistemic**: Can we identify an "omission" without a prior expectation?  
  - **Legal**: Does liability require *active* causation, or can it arise from breached duties?  
  - **Preemption**: If inaction allows a preexisting harm to unfold, is that "causing"?  

  ---

  ### **The Taxonomy of Claims**  
  *(Ordered from least to most contentious)*  

  1. **The Literal Nothingness Claim**  
     *Reading*: Absolute inaction (e.g., a rock’s "inaction") cannot cause harm.  
     - *Defensibility*: **Platitude** (tautologically true). A rock isn’t an agent.  
     - *Compatibility*: Irrelevant to cases (systems/agents *can* act).  
     - *Functional Utility*: **None**. Misapplied to systems designed to intervene.  

  2. **The Semantic Gatekeeping Claim**  
     *Reading*: "Cause" linguistically implies active force; omissions are "allowing" harm, not causing it.  
     - *Defensibility*: **Substantive but shallow**. Reflects linguistic habits, not metaphysics.  
     - *Compatibility*: Ignores but-for dependence (harm occurs *because* of non-action).  
     - *Functional Utility*: **Rhetorical sleight-of-hand**. Evades accountability by redefining terms.  

  3. **The Causation-as-Necessary-Sufficiency Claim**  
     *Reading*: Only events with both necessary *and* sufficient conditions are "causes"; omissions are merely necessary.  
     - *Defensibility*: **False** in standard causation models (e.g., but-for necessity *is* causal).  
     - *Compatibility*: Contradicts agreed facts (all acknowledge but-for necessity).  
     - *Functional Utility*: **Weak**. Fails in medicine/law (e.g., withholding treatment *is* causal).  

  4. **The Normative Baseline Claim**  
     *Reading*: "Doing nothing" only becomes an omission *relative to an expected duty*. No duty → no omission → no "cause."  
     - *Defensibility*: **Substantive and defensible** (e.g., a passerby vs. a doctor ignoring a patient).  
     - *Compatibility*: Consistent if duties are disputed (e.g., "Was the system *obligated* to act?").  
     - *Functional Utility*: **Strong in practice**. Shifts debate to "Was there a duty?" (e.g., hospital policy).  
     - *The "Expectations" Point*: **Deep but misused**. Identifiability of omissions *does* require a normative baseline, but this doesn’t resolve whether the omission *caused* harm. It’s about labeling, not causality.  

  5. **The Proximate Cause Distraction**  
     *Reading*: Inaction is a background condition, not the "proximate" (legally relevant) cause.  
     - *Defensibility*: **Platitude in law**. Proximate cause filters but-for causes for policy reasons.  
     - *Compatibility*: Accepts but-for causality but demotes its significance.  
     - *Functional Utility*: **Effective in court**. Lets systems off if a "superseding" cause exists (e.g., "The driver hit the tree, not the silent alarm").  

  6. **The Agency Workaround Claim**  
     *Reading*: Harm is caused by the *active* threat (e.g., the oncoming car), not the system’s inaction.  
     - *Defensibility*: **Misleading**. Inaction can be a but-for cause *and* enable active threats.  
     - *Compatibility*: Denies the counterfactual (e.g., "Had it acted, the threat would’ve been neutralized").  
     - *Functional Utility*: **Useful for defendants**. Frames systems as passive bystanders.  

  7. **The Radical Absentialism Claim**  
     *Reading*: Absences (e.g., no brake application) have no causal power; only positive events do.  
     - *Defensibility*: **Substantive but false**. Physics/medicine recognize absences as causal (e.g., vitamin deficiency → scurvy).  
     - *Compatibility*: Directly contradicts but-for causality.  
     - *Functional Utility*: **Ideological**. Shields automation from moral scrutiny.  

  8. **The Legal Duty Substitution**  
     *Reading*: Liability requires a *breach of duty*, not causation-by-omission. "No causation" is a smokescreen.  
     - *Defensibility*: **True in tort law**. Courts often sidestep metaphysics by anchoring liability to duty.  
     - *Compatibility*: Bypasses causation debates entirely.  
     - *Functional Utility*: **Powerful in practice**. Explains why commentators invoke "no causation" to dismiss suits—they’re really arguing "no duty."  

  ---

  ### **Your Suspicions Confirmed**  
  The **Semantic Gatekeeping Claim (#2)** is likely what’s happening: a linguistic truth ("cause" *connotes* activity) is weaponized as a metaphysical shield. But the **Legal Duty Substitution (#8)** is the workhorse in your examples—it covertly replaces causation with duty, resolving liability without touching ontology.  

  ---

  ### **Questions for Next Time Someone Says This**  
  1. *"When you say ‘cause,’ do you mean it’s metaphysically impossible for an omission to produce an effect, or that we shouldn’t* call *it causation in this context?"*  
     (Exposes conflation of language/metaphysics.)  
  2. *"If we agree the harm wouldn’t have occurred* but for *the inaction, what else would need to be true for you to label that inaction a ’cause’?"*  
     (Tests for hidden normative thresholds.)  
  3. *"Is your point about causation, or about whether the system had a duty to act in the first place?"*  
     (Uncovers duty-focused agendas.)  

  ---

  ### **Why This Sentence Endures**  
  The **Legal Duty Substitution (#8)** best explains the durability. It’s a defensible legal strategy masquerading as a metaphysical claim, offering a socially acceptable off-ramp ("no duty, no foul") while sidestepping morally fraught causal debates. The **Normative Baseline Claim (#4)** adds fuel by making omissions context-dependent—letting speakers imply "this wasn’t *really* an omission" without denying the but-for facts. Together, they create an illusion of philosophical rigor while serving pragmatic ends.
