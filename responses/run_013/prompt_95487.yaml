  User’s interviews show everyone agrees on but-for causality (harm wouldn’t occur if system acted) yet still fights about "causation." Classic disconnect. Probably because "cause" in law/engineering often implies responsibility, not just physics.  

  That "expectations" point? Deep but overplayed. Yes, calling something an "omission" requires a baseline (e.g., "brakes should engage at X mph"), but that doesn’t resolve whether failing that baseline *causes* harm. It just makes the omission definable.  

  Biggest trap: Confusing "inaction isn’t a *proximate* cause" (legal/practical) with "inaction isn’t causal *at all*" (metaphysical). Former is defensible; latter collapses under trolley-problem logic.  

