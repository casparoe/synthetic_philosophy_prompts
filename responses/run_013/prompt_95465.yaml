prompt: |-
  I'm assembling materials for a seminar on the ethics of everyday life, and I keep watching two friends have the same unproductive fight. One holds that the small local conventions we live among — how much to tip, where to stand in a queue, whether to cross against the light on an empty street — can be genuine moral obligations, so that a visitor who ignores a local tipping expectation, or who cuts into a queue, is doing something morally wrong and not merely gauche. The other insists these are at most matters of etiquette or prudence, and that a visitor is morally free to deviate whenever no one is harmed or deceived. They have been circling each other for months, and I suspect they are in part talking past each other, so I don't want another round of the argument; I want the document the two of them should have produced together.

  Please draft the joint statement of an adversarial collaboration between these two camps — call them the convention-realists and the convention-minimalists — on the moral status of everyday conventions and on what visitors owe to local ones. Begin with a numbered section of agreed claims: what both sides will grant about what a convention is, what makes one "local," the difference between a convention's being expected and its being enforced, what counts as harm or unfairness when a convention is broken, and what (if anything) a visitor owes a community she has not joined and will soon leave. Then a disagreements table. For each surviving disagreement, give the sub-question in neutral terms; then each side's own position written in wording that side would accept; then the crux — the smaller question such that settling it would move at least one side; and, for each crux, a case, thought experiment, or piece of evidence that both sides agree would bear on it, with each side's prediction recorded in advance. Include at least one crux turning on whether a convention's being a fair solution to a shared problem gives it moral force beyond the harm its breach would cause, and at least one on whether such obligations are owed to participants who have tacitly accepted the practice rather than to anyone who merely passes through it.

  To keep the whole thing from collapsing into the examples everyone reaches for, build the agreed claims and the cruxes around some deliberately awkward cases: a town where a service charge is already included in the menu price and leaving an extra tip reads as a mild insult, so that the visitor's home instinct to tip generously is itself the deviation; a queue that is really a take-a-number system with an informal courtesy gap for people who need to slip out; a convention that is visibly dying, so that many locals no longer observe it themselves; and a purely coordinating convention, such as which side of a narrow stairway to walk on, whose breach is costly to one party and costless to everyone else. Finally, say plainly whether any part of the two friends' quarrel is merely verbal — for instance, whether they mean different things by "moral obligation," one requiring decisive weight and the other any genuine normative reason — and if so, which part and why. There is no need to cite any literature; argue from the cases.
reasoning: |-
  We are drafting a joint statement between two camps: convention-realists (who hold that local conventions can create genuine moral obligations) and convention-minimalists (who hold that such conventions are at most matters of etiquette or prudence, and that moral obligations arise only when harm or deception occurs). The goal is to clarify agreements and disagreements without rehashing the same argument.

  **Section 1: Agreed Claims**

  Both sides agree on the following:

  1. **Definition of Convention**: A convention is a widely accepted practice within a community that coordinates behavior. It solves a coordination problem (e.g., which side of the road to drive on) or expresses a shared value (e.g., tipping as appreciation for service). Conventions are not necessarily written laws and may vary in formality.

  2. **Local Convention**: A convention is "local" when it is practiced by a specific community (e.g., a town, a workplace, a cultural group) and may differ from conventions elsewhere. What is conventional in one place may be unconventional in another.

  3. **Expected vs. Enforced**: 
     - A convention is *expected* when members of the community generally follow it and anticipate that others will too.
     - It is *enforced* when there are social or institutional consequences for deviation (e.g., criticism, fines, exclusion). 
     - Both sides agree that not all expected conventions are enforced, and that enforcement does not automatically make a convention morally binding.

  4. **Harm and Unfairness**: 
     - Breaking a convention can cause harm (e.g., physical injury from driving on the wrong side) or unfairness (e.g., gaining an undeserved advantage by queue-jumping). 
     - However, not every breach causes direct harm or unfairness. For instance:
       - *Stairway Example*: In a narrow stairway, if the convention is to walk on the right, and one person walks on the left, they might cause a minor collision (harm) or force others to adjust (inconvenience). But if the stairway is empty, walking on the left causes no harm.
       - *Dying Convention Example*: If a convention is dying (e.g., men tipping hats to women, now rarely observed), breaching it may cause no harm because few expect it.

  5. **Visitor's Relationship to the Community**: 
     - A visitor is someone who is temporarily in the community, has not joined it (e.g., not a resident), and will soon leave.
     - Both sides agree that a visitor has no general obligation to adopt the community's values or identity. However:
       - The visitor should not cause harm or unfairness (e.g., by creating dangerous situations or unjustly benefiting themselves).
       - The visitor should not deceive (e.g., pretending to follow a convention to gain trust while secretly violating it).
       - The visitor may have a *prudential* reason to follow conventions to avoid social friction.
     - But beyond avoiding harm, deception, or unfairness, the parties disagree on whether the visitor has a further moral obligation simply because the convention exists.

  **Section 2: Disagreements Table**

  We now present key disagreements. Each row includes:
  - The **Question** (neutral phrasing)
  - The **Convention-Realist Position** (stated as they would)
  - The **Convention-Minimalist Position** (stated as they would)
  - The **Crux** (a smaller question that, if answered, would move at least one side)
  - A **Case/Thought Experiment** that both sides agree is relevant, with each side's prediction.

  **Disagreement 1: Does a convention's role as a fair solution to a shared coordination problem give it moral force beyond the immediate harm caused by a breach?**

  - **Question**: When a convention solves a coordination problem fairly (e.g., distributing burdens and benefits), does breaching it without causing harm or unfairness in that instance still violate a moral obligation?
  - **Realist Position**: Yes. Conventions that fairly solve coordination problems create obligations because they represent a collective agreement. Even if no harm occurs in a particular breach, the violator free-rides on the system and undermines the cooperative practice. This is morally wrong because it disrespects the participants and the collective effort.
  - **Minimalist Position**: No. If a breach causes no harm, deception, or unfairness (e.g., no one is disadvantaged, and no one relies on the convention in that moment), then there is no moral failing. The convention may be useful, but without harm, the obligation is merely prudential or conventional, not moral.
  - **Crux**: Does breaching a purely coordinating convention in a harmless instance (a) disrespect the cooperative scheme or (b) merely fail to cooperate when cooperation isn't needed?
  - **Case: The Empty Stairway**:
    - *Setup*: In a building with a convention to walk on the right on narrow stairways, a visitor is alone and walks on the left. This causes no harm, as there is no one else. The convention solves a coordination problem when busy, but here it is irrelevant.
    - **Realist Prediction**: The visitor acts wrongly by not following the convention, as they disregard the system that organizes the community. Even if harmless, it shows a lack of commitment to the shared practice.
    - **Minimalist Prediction**: The visitor does nothing wrong. Without harm or unfairness, there is no moral issue. The visitor might be irrational (if they gain nothing) but not immoral.

  **Disagreement 2: Do obligations arise from tacit acceptance by participants, and are they owed to the community or only to individuals?**

  - **Question**: When a convention is sustained by the tacit acceptance of participants (i.e., they follow it without explicit agreement), does a visitor who passes through have a moral obligation to follow it, even if they do not harm anyone?
  - **Realist Position**: Yes. By entering the community, the visitor implicitly agrees to abide by its conventions as a condition of participation. The obligation is owed to the community as a whole for maintaining the practice, not just to individuals. Breaching it, even without harm, is a failure to respect the community's self-governance.
  - **Minimalist Position**: No. Tacit acceptance binds only those who are part of the community and have a stake in it. A transient visitor has not joined the practice and owes no such obligation. Obligations are owed only to individuals, not to abstract communities; without harming an individual, there is no breach.
  - **Crux**: Does a visitor, by merely passing through, become a participant in the convention such that breaching it without harm is still a moral wrong to the community?
  - **Case: The Courtesy Gap in a Take-a-Number Queue**:
    - *Setup*: In a bakery, there is a take-a-number system. An informal convention allows locals who have taken a number and then step out briefly (e.g., to move their car) to return and take their turn without losing their place. A visitor who has taken a number sees someone else step out and, when that person returns, refuses to let them reclaim their spot, insisting they take a new number. The visitor does not gain any advantage (they are not next in line) and causes no direct harm (the returning person only faces a minor delay). But locals feel the visitor has violated an unspoken rule of fairness.
    - **Realist Prediction**: The visitor acts wrongly by ignoring the local convention, which is a fair adjustment to the system. The breach undermines trust and the cooperative spirit, even without material harm.
    - **Minimalist Prediction**: The visitor does nothing morally wrong. The convention is not publicized, and the visitor didn't agree to it. The harm (a minor delay) is trivial and not unfair because the visitor didn't cause the person to step out. Any obligation here is social, not moral.

  **Disagreement 3: Can a convention create an obligation even when following it causes no harm, but deviating from it does cause confusion or offense due to local meanings?**

  - **Question**: When a convention carries symbolic meaning (e.g., tipping as an insult in a particular context), does a visitor have a moral obligation to follow the local interpretation, even if their action is well-intentioned?
  - **Realist Position**: Yes. Conventions are not just behavioral rules but carriers of social meaning. A visitor who ignores the local meaning (e.g., tipping extra where it is seen as insulting) may cause unintended offense or confusion, which is a harm. Even if no offense is taken, the visitor fails to respect the community's norms.
  - **Minimalist Position**: No. Without actual harm (e.g., no one is deceived or hurt), there is no obligation. The visitor's intention matters, and if they act in good faith, they are not morally blameworthy. Offense might be a prudential concern, but it is not a moral harm unless it involves deception or significant distress.
  - **Crux**: Is unintended offense (due to ignorance of local meaning) a form of harm that triggers a moral obligation, or is it merely a cultural misunderstanding without moral weight?
  - **Case: The Insulting Tip**:
    - *Setup*: In a town where menus state "service charge included; no tipping expected," leaving an extra tip is seen as implying the staff is underpaid or the owner is dishonest. A visitor from a culture where tipping 20% is standard leaves a 20% tip. The server is mildly insulted, but the visitor is unaware and means to be generous. No one is deceived, and the harm is only subjective offense.
    - **Realist Prediction**: The visitor acts wrongly by imposing their own norm and disregarding the local meaning, causing offense. They should have researched or asked.
    - **Minimalist Prediction**: The visitor is not morally wrong. Without intent to offend or negligence (if the convention was not easily knowable), the offense is an unfortunate accident. The moral duty to avoid harm requires intent or recklessness, not strict liability.

  **Disagreement 4: Does the decline of a convention affect its moral force?**

  - **Question**: When a convention is dying (i.e., many locals no longer follow it, and expectations are weakening), does a visitor still have a moral obligation to follow it?
  - **Realist Position**: Only if the convention still functions for some sub-community. The obligation weakens as the convention fades because the collective practice is dissolving. However, if some still rely on it, breaching it may cause harm or unfairness.
  - **Minimalist Position**: A dying convention has no moral force. Without widespread expectation and reliance, there is no cooperative scheme to uphold. The visitor is free to ignore it unless a breach would harm a specific individual.
  - **Crux**: Does a dying convention retain moral authority if some individuals still expect it and might be harmed by its breach?
  - **Case: The Dying Hat-Tip**:
    - *Setup*: In a small town, the convention of men tipping their hats to women when greeting is dying. Only 20% of men still do it, and many women find it outdated. A visitor (aware of the convention) does not tip his hat when greeting a local woman who still values the gesture. She feels disrespected but says nothing. No other harm occurs.
    - **Realist Prediction**: The visitor has a weak obligation to follow the convention if he knows some still value it, but the obligation is diminished by its decline. In this case, if he knows the woman expects it, he should comply.
    - **Minimalist Prediction**: No moral obligation. The convention is not a live practice, and the woman's feeling is her own reaction, not a harm caused by the visitor. The visitor is not responsible for upholding fading norms.

  **Verbal Disagreement?**

  Finally, we address whether part of the quarrel is verbal. Both sides agree that:

  - The term "moral obligation" may be at issue. 
    - Realists use it to mean *any genuine normative reason* that arises from social practices, even if overridden by other considerations. 
    - Minimalists reserve it for *decisive duties* that trump self-interest and are grounded in harm, fairness, or consent.
  - Thus, some disagreements might be softened if minimalists grant that conventions provide *some* moral reason (even if weak) and realists grant that this reason might not always be decisive. However, the core dispute remains: minimalists deny that conventions generate reasons beyond harm/consent, while realists assert they do.

  This document clarifies common ground and isolates key disputes. Further progress requires examining the cruxes through real-world cases or reflective equilibrium.
answer: |-
  ### Joint Statement: Adversarial Collaboration on the Moral Status of Everyday Conventions  
  **Between Convention-Realists (CR) and Convention-Minimalists (CM)**  

  This document represents an adversarial collaboration to clarify agreements and disagreements regarding the moral obligations arising from local conventions (e.g., queueing norms, tipping customs, traffic courtesies). It avoids re-litigating familiar examples by focusing on deliberately awkward cases. Both sides commit to the agreed claims below, then outline unresolved disputes with explicit cruxes and test cases.  

  ---

  ### Section 1: Agreed Claims  
  Both CR and CM accept the following:  

  1. **What a convention is**:  
     - A convention is a *shared, mutually understood practice* that coordinates behavior or expresses values within a community. It need not be formalized, written, or universally followed. Conventions solve coordination problems (e.g., which side of the stairway to use) or signal respect (e.g., tipping).  

  2. **What makes a convention "local"**:  
     - A convention is local if it is *practiced and expected by a specific community* (e.g., residents of a town, regulars at a café) and may differ from practices elsewhere. "Local" does not require geographic boundedness—it can apply to transient groups (e.g., a queue at a festival).  

  3. **Expected vs. enforced**:  
     - A convention is *expected* if community members predict others will follow it and perceive deviations as anomalous.  
     - It is *enforced* if deviations incur social sanctions (e.g., disapproval, exclusion) or formal penalties.  
     - Enforcement does not automatically confer moral weight; unenforced conventions may still be morally significant to CR, while CM sees enforcement as irrelevant to morality.  

  4. **Harm and unfairness from breaches**:  
     - Harm includes *tangible costs* (e.g., physical injury, financial loss) or *psychological distress* (e.g., humiliation).  
     - Unfairness occurs when a breach *undercuts equitable burdens* (e.g., queue-jumping exploits others’ compliance).  
     - However, not all breaches cause harm/unfairness (e.g., deviating from a dying convention).  

  5. **What visitors owe**:  
     - Visitors (temporary, non-members) owe:  
       - **Non-harm**: Avoid acts causing tangible or psychological harm (e.g., reckless driving).  
       - **Non-deception**: Do not exploit conventions to mislead (e.g., feigning compliance to gain trust).  
       - **Prudential consideration**: Follow conventions to avoid friction, where reasonable.  
     - Visitors do *not* owe:  
       - Adoption of local values as their own.  
       - Blind compliance when conventions are invisible, incoherent, or harmful.  

  ---

  ### Section 2: Disagreements Table  
  Key disputes are framed with:  
  - **Question**: Neutral formulation.  
  - **CR Position**: Stated as realists would endorse.  
  - **CM Position**: Stated as minimalists would endorse.  
  - **Crux**: A sub-question that, if resolved, would shift at least one side’s view.  
  - **Test Case**: A shared scenario with both sides’ predictions. Cases include:  
    - *Tipping Insult Town*: A service charge is included; extra tips are seen as implying staff underpayment.  
    - *Courtesy-Gap Queue*: A take-a-number system allows brief absences; reclaiming one’s spot is a courtesy.  
    - *Dying Convention*: A practice (e.g., yielding to hats) is fading; half of locals ignore it.  
    - *Stairway Coordination*: Walking left causes a collision only if another is present; else, costless.  

  ---

  #### Disagreement 1: Moral Force of Fair Solutions  
  **Question**: Does a convention’s role as a fair solution to a shared problem (e.g., distributing burdens) give it moral force beyond the direct harm caused by a breach?  
  - **CR Position**: Yes. Conventions resolving coordination problems fairly (e.g., queueing) create moral obligations because they embody a *communal agreement* on equitable cooperation. Breaching them disrespects the collective effort, even without immediate harm.  
  - **CM Position**: No. Moral obligations arise only from harm, deception, or consent. A fair convention is merely useful; absent these, deviations are permissible (though potentially imprudent).  
  - **Crux**: Does breaching a fair, harmless coordination convention constitute *free-riding* or *disrespect*, or is it a neutral act?  
  - **Test Case: Stairway Coordination**  
    - *Setup*: A narrow stairway has a convention: walk right to avoid collisions. A visitor walks left while alone, causing no one to adjust or collide. The breach is harmless and costless.  
    - **CR Prediction**: Morally wrong. The visitor free-rides on others’ compliance, undermining a fair system that prevents chaos.  
    - **CM Prediction**: Permissible. No harm occurs; the convention is a tool, not a moral demand.  

  ---

  #### Disagreement 2: Obligations from Tacit Acceptance  
  **Question**: Are moral obligations owed to participants who tacitly accept a convention, even if the beneficiary is not an individual harmed by the breach?  
  - **CR Position**: Yes. Tacit participation in a convention (e.g., joining a queue) creates duties to fellow participants. Visitors implicitly join this cooperative scheme and owe compliance as a sign of respect, regardless of transience.  
  - **CM Position**: No. Obligations require consent or harm to individuals. Tacit acceptance binds only ongoing participants; visitors owe nothing to abstract schemes.  
  - **Crux**: Does a visitor’s brief participation in a convention (e.g., taking a number) trigger duties to other participants, independent of harm?  
  - **Test Case: Courtesy-Gap Queue**  
    - *Setup*: A bakery uses take-a-number tickets. Locals allow brief absences (e.g., restroom) without losing one’s spot. A visitor, unaware, refuses to let someone reclaim their place after a 30-second absence, forcing them to the back. No one is deceived or materially harmed (delays are minor), but locals feel the visitor violated fairness.  
    - **CR Prediction**: Morally wrong. The visitor benefited from the system (taking a number) but refused its core courtesy, exploiting others’ goodwill.  
    - **CM Prediction**: Permissible. No tangible harm occurred; the visitor didn’t consent to the courtesy gap.  

  ---

  #### Disagreement 3: Symbolic Weight of Conventions  
  **Question**: Can a convention’s symbolic meaning (e.g., tipping as insult) create moral obligations for visitors, even if their intent is benign?  
  - **CR Position**: Yes. Conventions carry social meanings; ignoring them risks miscommunication and relational harm. Visitors must adapt to local interpretations to show respect.  
  - **CM Position**: No. Moral blame requires intent or negligence. Unintended offense from ignorance is not a moral failing; it is a cultural misstep.  
  - **Crux**: Is avoiding *unintended offense* a moral duty, or merely a social skill?  
  - **Test Case: Tipping Insult Town**  
    - *Setup*: In Town X, menus state "service charge included; no tips." Adding a tip implies the owner underpays staff. A generous visitor, unaware, leaves 20%. The server feels insulted but suffers no material loss.  
    - **CR Prediction**: Morally wrong. The visitor ignored local norms, causing relational harm.  
    - **CM Prediction**: Not morally wrong. No deceit or recklessness; offense stems from misunderstanding, not malice.  

  ---

  #### Disagreement 4: Authority of Dying Conventions  
  **Question**: Do fading conventions retain moral authority for visitors when many locals disregard them?  
  - **CR Position**: Partially. Dying conventions still bind if they retain *symbolic resonance* for a minority, but obligations weaken as compliance wanes. Visitors should comply if aware of residual expectations.  
  - **CM Position**: No. Moral obligations dissolve when conventions lack broad buy-in. Visitors may ignore them unless harm is caused.  
  - **Crux**: Does a convention’s decline nullify its moral force, or do lingering expectations sustain it?  
  - **Test Case: Dying Hat-Yielding Convention**  
    - *Setup*: In Town Y, men traditionally yield sidewalk space to women. Half of locals now ignore it. A visitor (aware of the tradition) does not yield to a woman who still values it. She feels disrespected but is unharmed.  
    - **CR Prediction**: Weakly wrong. The visitor should respect persistent local sensibilities.  
    - **CM Prediction**: Permissible. The convention is obsolete; no harm results.  

  ---

  ### Verbal Disagreement: The "Moral Obligation" Stalemate  
  A core part of the quarrel is verbal: **CR and CM use "moral obligation" differently**.  
  - **CR** defines it broadly: any practice generating *genuine normative reasons* (e.g., "You should tip here") that may be overridden by other considerations.  
  - **CM** defines it narrowly: a *decisive duty* that trumps self-interest (e.g., "You must tip, even if costly").  
  This divergence explains why CR sees conventions as "moral" (they provide pro tanto reasons), while CM relegates them to "etiquette" (lacking decisive force). Resolving the semantic gap would clarify that:  
  - CR claims conventions create *pro tanto moral reasons* (e.g., "Follow local queues, unless urgent").  
  - CM denies this, insisting only harm/deception/consent creates such reasons.  

  The substantial disagreement thus narrows to: **Do conventions *themselves* generate moral reasons, or do reasons arise only from their consequences?** The test cases above target this core.  

  ---  
  **Conclusion**: This collaboration isolates four cruxes where progress is possible. Both sides encourage testing predictions against real-world behavior (e.g., observing reactions in the *Tipping Insult Town*) or empirical studies (e.g., surveys on offense in dying conventions). Until then, they agree to disagree—but minimally, visitors should avoid harm, deception, and arrogance.
