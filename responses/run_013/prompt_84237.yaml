answer: |-
  ### Adjudication of the Exchange

  #### **(1) Ana's First Move**  
  **Rating:** Partly right  
  **Justification:** Ana correctly identifies the risk of collapsing into cognitivism if the "truth-conditional layer" refers to ordinary descriptive content (e.g., moral facts). Her point about moral disagreement is strong: if truth-conditional content is shared, yet disagreement persists, the commitment layer must be doing essential work. However, she prematurely dismisses Ben’s distinction between *ordinary* truth-conditions and *commitment-role* content (which Ben later clarifies).  

  #### **(2) Ben's First Move**  
  **Rating:** Partly right  
  **Justification:** Ben validly reframes the truth-conditional layer as "commitment-role content" tied to inferential relations, preserving expressivism’s core idea that practical commitments are explanatorily primary. His reply to disagreement is coherent: commitments are semantic, not "add-ons." Yet he fails to address *how* commitment-role content composes in truth-functional contexts (e.g., negation), leaving a gap Ana exploits.  

  #### **(3) Ana's Second Move**  
  **Rating:** Clearly right  
  **Justification:** Ana exposes a critical dilemma:  
  - If commitment is part of meaning, embedded contexts (e.g., conditionals) reintroduce the Frege-Geach problem for *hypothetical* commitments.  
  - If commitment is not part of meaning, the view is cognitivist.  
  Ben’s "hypothetical commitment" does not resolve how compositional semantics works without regress.  

  #### **(4) Ben's Second Move**  
  **Rating:** Partly right  
  **Justification:** Ben’s analogy to suppositional reasoning elegantly explains hypothetical commitments and validates modus ponens. He correctly notes that truth-conditional content *tracks* commitments without reducing them to beliefs about moral facts, avoiding collapse into cognitivism. However, he sidesteps Ana’s challenge about truth-functional composition (e.g., negation) and conflates "truth-conditional" with "inferential-role" content.  

  #### **(5) Ana's Third Move**  
  **Rating:** Clearly right  
  **Justification:** Ana identifies Ben’s equivocation:  
  - "Truth-conditional layer" cannot be both (a) *ordinary descriptive content* (risking cognitivism) and (b) *commitment-role content* (lacking truth-functionality).  
  Her negation example is decisive: "Lying is not wrong" vs. "It is not the case that lying is wrong" have distinct commitment profiles but identical "commitment-role content" on Ben’s model, violating compositionality.  

  #### **(6) Ben's Third Move**  
  **Rating:** Partly right  
  **Justification:** Ben’s force/content distinction is conceptually sound: expressivists can treat content as commitment-role (e.g., inferential function) and force as commitment-expression. This *could* resolve Frege-Geach for non-truth-functional embeddings (e.g., conditionals). However, he still fails to explain how "commitment-role content" composes in *truth-functional* contexts (e.g., negation, disjunction), where truth-conditions are indispensable.  

  #### **(7) Ana's Fourth Move**  
  **Rating:** Clearly right  
  **Justification:** Ana’s "unstable hybrid" critique is compelling. If "content" is commitment-role, it lacks truth-conditions and cannot support truth-functional logic. If it is ordinary truth-conditional, commitments become pragmatically superfluous. Ben’s model cannot reconcile these, as shown by the negation problem.  

  ---

  ### Central Question: What is Stratified Expressivism?  
  **Verdict:** An **unstable hybrid**.  
  **Reasoning:**  
  - **Not a genuine solution to Frege-Geach**: It fails to provide a compositional semantics for truth-functional operators (e.g., negation), as Ana’s move (5) demonstrates. The truth-conditional layer either does too much (collapsing into cognitivism) or too little (failing compositionality).  
  - **Not disguised cognitivism**: Ben successfully argues that commitments are non-descriptive and fundamental (moves 2, 4, 6), avoiding reductio to cognitivism.  
  - **Unstable hybrid**: The two "layers" pull in opposite directions. Truth-conditional content demands descriptive, mind-independent properties for compositionality; commitment-role content demands non-descriptive, attitude-dependent properties for expressivism. The view cannot satisfy both simultaneously.  

  ---

  ### What Both Parties Are Missing  
  **Defender’s Burden (Ben):** To make the view coherent, a defender must:  
  1. **Formalize commitment-role semantics**: Show how "commitment-roles" (e.g., inferential functions) can be compositional in *all* embedded contexts, including truth-functional ones. For example, define a logic where negation operates directly on commitment-states (e.g., "not wrong" as a prohibition on endorsing wrongness).  
  2. **Clarify truth-aptness**: Explain how commitment-role content can be "truth-conditional" without referring to moral facts—e.g., by defining "truth" as *correctness of commitment* within a normative system.  

  **Opponent’s Concession (Ana):** If the view is made coherent, an opponent must concede:  
  1. **Expressivism can accommodate minimal truth**: If commitment-roles ground truth-conditions (e.g., "true" = coherent commitment in inference), moral sentences can be truth-apt without descriptive content.  
  2. **Hypothetical commitments resolve some embeddings**: Suppositional reasoning (move 4) *can* handle non-truth-functional embeddings (e.g., conditionals), preserving expressivism for those cases.  

  ---

  ### Summary  
  Stratified expressivism, as described, is an unstable hybrid due to unresolved tensions between its truth-conditional and commitment layers. Ben’s defense captures expressivism’s spirit but lacks compositional machinery for truth-functional logic. Ana’s critiques expose fatal ambiguities, yet she underestimates the potential of commitment-role semantics if formalized. The view’s viability hinges on whether "commitment-role content" can be rigorously structured to handle negation and disjunction—a challenge neither party fully engages.
