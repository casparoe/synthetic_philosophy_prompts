  In move (6), Ben tries to distinguish content from force, calling the commitment-role "content" and the expression "force." But Ana is clearly right in move (7) to point out that calling it content doesn't solve compositionality problems, and the hybrid remains unstable.

  For the central question: stratified expressivism seems like an unstable hybrid. It wants to be expressivist but adopts truth-conditional machinery that pulls toward cognitivism, without fully resolving how these layers interact.

