  In move (2), Ben clarifies that the truth-conditional layer isn't about moral facts but about "commitment-role content" fixed by inferential relations. He maintains this is still expressivist because practical commitment is fundamental. This is also partly right - he makes a valid distinction, but hasn't fully explained how this content works compositionally.

  Move (3) has Ana pressing on embedding: if commitment is part of meaning, hypothetical commitments recreate Frege-Geach; if not, it's not expressivist. She's clearly right here - this highlights a genuine dilemma Ben hasn't resolved.

