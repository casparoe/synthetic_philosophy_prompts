answer: |-
  ## Shifting Frame

  A month away, I choose the coffee shop.
  A week away, I choose the forest path.
  Its quiet depth, where restless thinking stops.
  A week away, I choose the forest path.

  Its quiet depth, where restless thinking stops.
  The clatter, steam, the comfort of known walls.
  A month away, I choose the coffee shop.
  The clatter, steam, the comfort of known walls.

  The clatter, steam, the comfort of known walls.
  The morning of, I crave the shaded green.
  (I leave this note where later doubt befalls:
  "The choice you made was always unforeseen.")

  The morning of, I crave the shaded green.
  (But here, now, choosing cake I shouldn't touch,)
  The hand that moves is not the one I've seen
  Deciding paths I value overmuch.

  The hand that moves is not the one I've seen.
  It lifts the fork, ignores the verdict cast.
  (My judgment clear, this sweetness intervening)
  It lifts the fork, ignores the verdict cast.

  It lifts the fork, ignores the verdict cast.
  The path recedes; the coffee cools, unseen.
  Two distances, one present tense held fast,
  Two figures in one shifting frame, one skin.

  ---

  **Notes on Accuracy and Liberties**

  1.  **The Shifting Preference ("Discounting"):**
      *   **Settled:** Your economics friend is broadly correct. Temporal discounting *is* a robust empirical phenomenon: people consistently value immediate rewards more highly than delayed ones, and near-term delays matter more than distant ones. Hyperbolic discounting models often fit this "reversal of preference" as the event nears better than simpler exponential models.
      *   **Liberty/Contested:** The poem leans into the *phenomenology* of this shift: "Nothing in me changes its mind... he's simply standing somewhere else." While the *effect* is settled, *how we experience it subjectively* is complex. The poem treats the "earlier self" as a distinct perspective ("standing somewhere else") whose preference is equally sincere. This touches on debates about:
          *   **Identity Over Time:** Are these different "selves"? While philosophers (e.g., Parfit) discuss this, neuroscience suggests a more continuous, albeit biased, valuation system. The poem treats the perspectives as more distinct than a strict biological model might.
          *   **Sincerity:** Can a future preference *feel* just as "sincere" as a past one, even knowing it might flip? The poem asserts yes ("Each moment's preference is sincere"), capturing the lived experience, even if a neuroscientist might point to underlying, shifting neural weights rather than discrete "sincere" states.

  2.  **Acting Against Judgment ("Weakness of Will/Akrasia"):**
      *   **Settled:** Your philosophy friend is right that this is the classic problem of *akrasia*. People *do* act against their better judgment in the moment. The description ("judge right then that I should not be doing it, and do it anyway") is a standard characterization.
      *   **Liberty/Contested:** The poem *separates* the agent: "The hand that moves is not the one I've seen." This leans towards a specific, contested interpretation:
          *   **Against Monism:** Some philosophers (especially following Plato/Socrates) argue true akrasia is impossible – if you act, your *strongest* desire *in that moment* must be winning. The poem rejects this, implying a real conflict where judgment *is* genuinely overruled.
          *   **Towards Partition:** It suggests a kind of internal division ("Two figures... one skin") – the judging self vs. the acting self. This resonates with some modern cognitive science models (e.g., dual-process theory: reflective vs. impulsive systems) but is philosophically debated. Is it one self divided, or multiple competing systems? The poem maintains the ambiguity ("Two figures in one shifting frame, one skin") but clearly posits the *experience* of a disconnect.
          *   **Simultaneity:** The poem emphasizes the judgment and action happen "here, now," simultaneously ("ignores the verdict cast"), highlighting the puzzle of *how* this immediate self-betrayal occurs. This simultaneity is core to the philosophical problem.

  3.  **The Relationship Between the Two:**
      *   **Settled:** Both phenomena involve a disconnect between evaluation/planning and action. Temporal discounting *is* often cited as a *mechanism* for weakness of will regarding delayed rewards (e.g., choosing immediate pleasure over long-term health).
      *   **Liberty/Contested:** The poem treats them as distinct but parallel "things" happening to the speaker ("Two things happen... everyone treats as one"). It leans on the idea that the *experience* feels different:
          *   Shifting Preference: Involves *changing evaluations over time* of *future states*, all seemingly sincere from their temporal vantage point. No conflict *within* a single moment.
          *   Weakness of Will: Involves a *conflict within a single moment* – judgment present *while* acting against it.
      *   The poem doesn't collapse them ("hold both without collapsing them"). It suggests the *structure* of the disconnect differs (temporal shift vs. simultaneous conflict), even if the underlying cognitive machinery might overlap. The final stanza's ambiguity ("Two figures... one skin") acknowledges the unresolved question of whether they stem from one fundamental fracture or two distinct ones. The "shifting frame" metaphor applies to both the temporal perspective *and* the internal view of the self.

  **The Load-Bearing Parts:**

  1.  **The Pantoum Structure:** This *is* the core mechanism for showing the reversal "without a single word changing." The *position* (first/third vs. second/fourth lines) dictates the perceived "ranking" in each stanza, mirroring the temporal shift in perspective. This form *demonstrates* the concept.
  2.  **"The hand that moves is not the one I've seen":** This line is crucial for establishing the separation between the judging self and the acting self in the akrasia section, leaning into the partition interpretation.
  3.  **"Two figures in one shifting frame, one skin":** This final line bears the weight of the central ambiguity – are they two things or one? It captures the paradox of unity and division inherent in both phenomena.
  4.  **The "Note" Stanza:** Embodies the futility of trying to warn a future self subject to the same temporal shifts ("where later doubt befalls"), fulfilling that specific request and reinforcing the discounting theme.

  The poem takes poetic license primarily in its *metaphorical depiction* of the internal states ("standing somewhere else," "the hand that moves," "two figures") to capture the subjective *feeling* of these phenomena, leaning towards interpretations (distinct temporal perspectives, partitioned self) that are plausible but contested within the finer points of philosophy and cognitive science. It prioritizes experiential accuracy over strict adherence to any single theoretical model.
