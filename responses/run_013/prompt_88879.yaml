answer: |-
  Here’s a focused, actionable research proposal tailored to your constraints and goals. I’ve sharpened the question, defined scope, and grounded it in feasible methods.

  ---

  **Research Proposal: Shallow vs. Deep Conventions — Evolutionary Stability and the Role of Common Knowledge**  
  **Duration:** 6 months  
  **Resources:** Conceptual analysis, agent-based simulation (Python/NetLogo), case studies.  

  ### 1. Core Research Question  
  *"Under what conditions do evolutionarily stable behavioral regularities require Lewisian common knowledge to function as conventions, and when do lower-order expectations suffice?"*  

  **Why this fixes vagueness:**  
  - Replaces "reducible to evolution" with a testable distinction: **functional equivalence** vs. **structural necessity** of common knowledge.  
  - Focuses on *conditions* (e.g., payoff structures, noise levels, group size) rather than binary reduction.  

  ### 2. Gap in Existing Literature  
  **Lewis (1969):**  
  - Assumes common knowledge as constitutive of convention but does not model its emergence.  
  - Silent on whether conventions *must* arise via common knowledge or can bootstrapped from weaker states.  

  **Evolutionary Models (e.g., Skyrms, Bicchieri):**  
  - Show norms stabilize via learning/drift/mimicry with *bounded rationality* (finite-order beliefs).  
  - But treat stability as the endpoint, not asking if the result *is* a Lewis convention or a functionally distinct entity.  

  **The Open Problem:** Neither explains whether evolutionary dynamics *approximate* Lewis conventions or produce a novel category of norm that *dispenses* with common knowledge.  

  ### 3. Methodology: Two Interlocking Strands  
  **A. Simulation (Months 1–3)**  
  - Build minimal agent-based models of norm emergence in coordination games (e.g., driving side choice, signal meaning).  
  - **Key variables:**  
    - Belief depth (agent `i` tracks "`j` expects `k` expects..." up to depth `d`).  
    - Noise (mistakes in action/belief updating).  
    - Salience cues (e.g., initial public signals vs. purely local interactions).  
  - **Test:** Does stability *require* high `d`? Does adding salience cues reduce the `d` needed for stability?  
  - **Tool:** Python (Mesa library) for flexibility; NetLogo for rapid prototyping.  

  **B. Case Studies (Months 4–5)**  
  - Contrast real-world norms where common knowledge seems present (e.g., traffic lights) vs. absent (e.g., emergent slang, queueing in novel contexts).  
  - **Focus:** Diagnose failure modes — When do shallow conventions collapse under stress (e.g., disputes, ambiguity) where deep ones persist?  

  ### 4. Expected Outcomes & Success/Failure Criteria  
  - **Success 1 (Strong):** Identify specific parameters (e.g., high noise + asymmetric payoffs) where evolutionary dynamics *fail* to produce stability without salience mechanisms that generate common knowledge.  
  - **Success 2 (Weak):** Show that shallow conventions behave differently under perturbation (e.g., slower recovery from shocks, fragmentation) vs. deep ones.  
  - **Failure:** If simulations show *no functional difference* between shallow/deep stability across all tested conditions, or if case studies show no correlation between depth and robustness.  

  ### 5. Why Philosophy (Not Just Game Theory)?  
  - **Conceptual Work:** "Common knowledge" is a *philosophical* construct (epistemic state); game theorists often treat it as a primitive. This project tests its empirical necessity.  
  - **Normativity:** Lewis conventions entail agents’ *reasons for action* based on mutual expectations. Evolutionary stability alone doesn’t capture this justificatory layer.  
  - **Phenomenology:** Whether a convention "feels" like a shared social fact may hinge on perceived depth — a philosophical question of social ontology.  

  ### 6. Realistic Scope Management  
  - **What’s IN:**  
    - 2–3 simulation environments (e.g., symmetric/asymmetric coordination, signaling game).  
    - 2 detailed case studies (e.g., Bitcoin protocol adoption [shallow?] vs. ISO standards [deep]).  
  - **What’s OUT:**  
    - Phylogenetic/historical analysis of norm evolution.  
    - Complex cognitive architectures (e.g., theory of mind models).  
  - **Risks:** Over-engineering simulations. **Mitigation:** Use bare-bones models (e.g., binary choices, Gaussian noise).  

  ### 7. Deliverables  
  - Working simulation code + dataset.  
  - 8,000-word paper:  
    - Framework for shallow/deep conventions.  
    - Simulation results + case study analysis.  
    - Argument for/against the dispensability of common knowledge.  

  ---

  **Why this works for 6 months:**  
  1. **Simulations are lightweight:** No data collection; focus on known game-theoretic templates.  
  2. **Case studies are bounded:** Leverage existing ethnographies/histories (e.g., traffic norms [@Vanderbilt2008], meme evolution).  
  3. **Answer is constrained:** Success hinges on isolating *one* clear divergence (e.g., resilience to belief noise) between shallow/deep conventions.  

  **If the distinction collapses:** That’s a valid result! It implies Lewisian conventions *are* idealizations of evolutionary stable states — reshaping how we model social norms. Either outcome publishes well.
