answer: |-
  Here's the carved-up specification for a theory of indicative conditionals, grounded in the cases that force the requirements and highlighting the conflicts that make the problem space treacherous. The table is followed by the analysis of the fatal clash and the most exclusionary requirement.

  **Theory of Indicative Conditionals: Core Desiderata**

  | Requirement                                   | Motivating Case/Consideration                                                                                                                          | Status                                                                 | Conflicts With                     |
  | :-------------------------------------------- | :----------------------------------------------------------------------------------------------------------------------------------------------------- | :--------------------------------------------------------------------- | :--------------------------------- |
  | **Adams Thesis (AT)**                         | *The Card Case:* You draw from a standard deck. Your credence that *if it's a heart (A), it's red (B)* **must** match P(Red \| Heart) = 1. Any deviation seems irrational; the conditional *expresses* that conditional credence in simple contexts. | **Non-Negotiable (for Suppositional/Probabilistic Theories)**         | Embedding, Non-Triviality          |
  | **Probability Preservation (PP)**             | *The Almost-Certain MP Case:* You are 99.9% sure *if the detector beeps (A), radiation is present (B)* and 99.9% sure *the detector beeped (A)*. You *must* be nearly 99.9% sure *radiation is present (B)*. Modus Ponens failing probabilistically in such clear cases is rationally catastrophic. | **Non-Negotiable (Widely)**                                           | Strong Non-Material Conditional (in McGee cases) |
  | **Embedding/Compositionality**                | *The Disjunctive Inference Case:* You say "Either it rained last night (R), *or if the ground is wet (W), then the sprinklers were off (S)*." To understand, negate, or assess the probability/truth of this whole sentence, the theory *must* assign semantic value (truth/acceptability/probability) to the embedded conditional "if W then S". | **Camp Preference (Truth-Conditional Camp)**<br>**Denied by Non-Propositional Camp** | Adams Thesis                       |
  | **Ramsey Test (RT)**                          | *The Rational Acceptance Case:* Why is it rational for you to accept "If the meeting was at noon (A), she was late (B)"? Intuitively, because *supposing A* leads you (given your beliefs) to *accept B*. A theory needs to explain this fundamental link between conditionals and suppositional reasoning. | **Non-Negotiable (Core intuition for Suppositional Camp)**            | Embedding (for strict RT interpretations) |
  | **Subjunctive/Indicative Distinction (SID)**  | *The Travel Uncertainty Case (Indicative):* "If she *didn't* take the train, she drove" (said when her mode of travel is unknown, but possible). *The Missed Train Case (Subjunctive):* "If she *hadn't* taken the train, she *would have* driven" (said knowing she took the train). The theories *must* explain this difference without relying solely on tense/mood; the indicative signals epistemic openness of the antecedent. | **Non-Negotiable (Widely)**                                           | – (Often handled via different mechanisms) |
  | **Gibbard Phenomenon (GP)**                   | *The Weather Forecasters Case:* Forecaster 1 (relying on satellite) accepts "If there's an easterly wind (A), it will rain (B)". Forecaster 2 (relying on radar) accepts "If A, then not-B". Both have rational, well-supported beliefs compatible with the same evidence base. A theory *must* allow this without deeming both conditionals false or one forecaster irrational. | **Non-Negotiable (Captures non-truth-functional nature)**             | Strong Truth Functionality         |
  | **Non-Material Conditional (NMC)**            | *Paradox Avoidance Cases:* <br>1. *Or-to-If:* "Not-A or B" entails the material conditional A⊃B, but *not* "If A, then B" (e.g., "I won't draw Ace or it will be Hearts" vs. "If I draw Ace, it will be Hearts").<br>2. *False Antecedent:* A⊃B is true if A is false, but "If A, B" often seems void/undefined when A is known false (indicative).<br>3. *McGee's MP Counterexample:* "If a Republican wins (R), then if Reagan doesn't win (¬Re), Anderson will (A)" seems true; "A Republican will win (R)" seems true (Reagan likely); but "If Reagan doesn't win, Anderson will (¬Re > A)" seems false (Bush would win). MP fails for material conditional here. | **Non-Negotiable (Avoiding absurd consequences)**                     | Probability Preservation (in McGee cases), Strong Truth Functionality |

  **The Unsatisfiable Core Trio (The Triviality Engine):**
  The combination **Adams Thesis (AT) + Embedding + Non-Triviality** is provably unsatisfiable (Lewis, 1976, and subsequent results). If a conditional has propositional content (Embedding) *and* its probability is always the conditional probability (AT), *and* we assume conditional probabilities behave normally within the probability calculus (Non-Triviality), then this forces the conditional to be equivalent to the consequent (B) whenever P(A) > 0, or worse, collapses probabilities entirely. **The clash bites precisely when Embedding forces the conditional to be a proposition with a defined probability that must interact compositionally within the axioms of probability.** AT demands P(If A, B) = P(B\|A), but Embedding + Probability Calculus forces constraints (like P(X\|Y) = P(X∧Y)/P(Y)) that are incompatible with AT holding universally for embedded instances. *This is why triviality results are devastating for truth-conditional theories trying to retain AT.*

  **The Most Exclusionary Requirement: Embedding**
  If you could only keep one requirement, **Embedding** would eliminate the largest class of otherwise attractive theories. **It immediately rules out all pure non-propositional/suppositional theories** (e.g., Adams, Edgington) which deny conditionals have truth conditions or propositional content specifically *to* preserve AT and avoid triviality. These theories handle simple conditionals, RT, PP (for simple MP), SID, GP, and NMC very elegantly, but must treat embedded conditionals as non-compositional or reinterpret them (e.g., as conditional assertions within a wider context). Demanding full Embedding forces the theory into the truth-conditional camp, directly confronting the triviality results and the constraints of the probability calculus. It's the requirement that most decisively shapes the fundamental architecture of the theory.
