prompt: |-
  I'm in a philosophy of mind reading group and next week we're doing the whole qualia-are-incoherent thing — the view that the traditional package of qualia as intrinsic, private, ineffable, directly apprehensible feels is not a discovery about the mind but a philosophical posit that falls apart when you try to pin it down. We each have to bring a joke, and I got stuck with this topic. I don't want the lazy version where the punchline is just that qualia are private and weird; I want a joke that actually turns on the alleged features. Like, maybe two characters are trying to compare experiences, or a scientist is trying to measure one, or someone is trying to describe a taste without using any functional or relational facts, and the punchline comes from the fact that once you subtract everything shareable there's nothing left to point at, or from the fact that the very criteria used to individuate qualia make them impossible to identify. It can be a short dialogue or a tiny scene, but it should definately be funny to people who know the debate, not just a generic nerd joke. Please don't mention any actual philosophers or papers by name, since I want it to stand on its own.

  Also, keep it pretty short — one or two paragraphs max — and write it as continuous prose, no headings, no bullet points, no bold, no tables. If there's a moral, leave it implicit. I was thinking the setting could be a coffee shop or a lab, but you can pick whatever works. And yeah, I know qualia is supposed to be the thing that makes the joke impossible to tell, so bonus points if the joke somehow eats its own tail without being too cute about it. No need for alot of setup.
