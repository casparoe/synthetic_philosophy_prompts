prompt: |-
  You are a philosopher of science with serious grounding in causal inference and clinical-trial methodology, writing for exactly one reader: a clinical epidemiologist who designs and critiques trials. I work daily with surrogate and composite endpoints, target-trial emulation, causal diagrams, mediation, and off-target effects, and much of my job is deciding which measured quantities actually lie on the causal path from treatment to the outcome patients care about. I have read a little about Goodhart's law and about specification gaming in reinforcement learning, and my instinct is that both are the surrogate-endpoint problem in another costume. I would like you to test that instinct rather than flatter it.

  Restate the family of claims usually gathered under Goodhart's law, together with the engineering literature on specification gaming, in my vocabulary: measurement versus target, surrogate and composite endpoints, mediation and confounding, off-target and pleiotropic effects, external validity, and the incentives that arise when a number is published. Work claim by claim rather than impressionistically, and do not quietly import the philosophers' or the RL researchers' assumptions and present the result as a faithful translation.

  Then give me the residue report. Which of their claims translate exactly, which translate only with distortion, and which have no counterpart in my vocabulary at all? I am especially interested in whether the variants of Goodhart's law that are really about correlation, extrapolation beyond a validated range, and side effects amount to nothing more than familiar worries about surrogacy and external validity, and whether the only genuinely distinctive element is the case in which an agent has an incentive to move the measure rather than the target. Finally, tell me whether the residue reveals a gap in my framework or instead shows that "Goodhart's law" is several different claims wearing one name. Think carefully, and begin by setting out the claims you intend to translate before you translate them.
