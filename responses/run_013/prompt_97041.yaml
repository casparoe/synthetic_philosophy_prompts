  In my metaphysics course we have been working through the problem of material constitution, and the case that keeps tripping me up is the statue and the lump of clay. I understand the setup — one region of matter, two count-nouns, apparently two numerically distinct objects occupying the same place at the same time — but I do not understand why the grounding problem is supposed to be the deep objection to the coincidentalist. If the statue and the lump share all their physical facts, the coincidentalist says they nonetheless differ in their modal and sortal properties: the lump would survive being squashed, the statue would not. The objection, as I hear it, is that this leaves that modal difference brute. Please explain what exactly the grounding problem is, why a brute modal difference is meant to be a cost at all, and whether the objection covertly relies on a Humean principle — roughly, that no two things can differ in their modal properties without differing in their non-modal ones. Then give me your own verdict on where this cuts: does it show that constitution-is-not-identity is in trouble, or does it instead put pressure on the Humean premise the objection needs?

