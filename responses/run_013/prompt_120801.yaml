prompt: |-
  I teach a 3rd-year seminar on history and explanation -- 18 students, one 90-minute session a week -- and I'm sick of teaching hindsight bias with the usual slide about a study where people misremember their predictions. I want them to feel it, and I want them to feel the sneakier half too: not just that they misremember what they thought, but that the *explanation* they produce feels so satisfying precisely because it was assembled after the fact. Those are seperate failures and my students conflate them every single year.

  Design me a runnable activity. I'll write the case material myself (a fact-sheet of maybe 12-15 facts about one episode, plus two different endings), so don't worry about getting any history right -- instead tell me what the fact-sheet has to contain and what properties the two endings need. Groups of four or five.

  Rough shape of what I want to happen: first everyone commits to a forecast, one number plus the one fact they think is decisive, sealed in an envelope. Then half the groups are told the episode ended one way and half are told it ended the other way, and each group writes the causal story, marking which facts were "the causes". Then we compare. I want that comparison to be nasty -- the same facts recruited as causes of opposite outcomes, the same trait read as a strength in one room and a fatal flaw in the other, the ambivalent facts quietly dropped or reinterpreted. Then the envelopes come back and we put what they said they thought next to what they actually wrote.

  Give me the exact sequence and timings, the materials, the wording of the instruction cards (this matters more than I'd like to admit -- one vague sentence and everyone hedges into mush), how to seed the ambivalent facts, a comparison scheme for the group debrief that isn't just me waving at the whiteboard, and a control condition for the leftover groups (facts, no ending, forecast only) so the narrative groups' "how predictable was this really?" ratings have something to sit next to. Also tell me whether the two endings should be one real outcome plus a fabricated one, or two real cases that genuinely diverged, and what the disclosure looks like either way -- I don't want them feeling tricked in a cheap way.

  Then the debrief: what I say, in what order, and how I make the memory failure and the narrative failure come apart without lecturing. Be honest about what the activity can't do -- I suspect the toy case will leave everyone thinking all historical explanation is post hoc storytelling, which isn't what I believe, and I need to know exactly where to repair that, or whether there's a version that doesn't leave that taste.

  And tell me what predictably goes wrong the first time. I'd bet money on at least one group asking why they're being made to explain an ending that's obviously manufactured, and I don't have a good answer ready.

  Last line, exactly this form and nothing after it: \gap{one clause naming the feature of the phenomenon the activity can't reproduce}
reasoning: |-
  We are designing an activity to teach two distinct failures: 
   1. The hindsight bias: misremembering what they originally predicted.
   2. The narrative failure: constructing a satisfying causal story after the fact, which feels inevitable but is built by selectively using facts.

   The activity sequence:

   Materials:
     - A fact sheet (12-15 facts) about a historical episode. The facts must be:
          * Ambiguous: Each fact can be interpreted in multiple ways (e.g., a trait that could be a strength or a weakness).
          * Neutral: Avoid facts that clearly point to one outcome.
          * Balanced: Some facts might lean slightly in one direction, but overall the set should be evenly balanced so that both outcomes are plausible.
          * Include some facts that are irrelevant or redundant (to be dropped in narratives).
     - Two endings: Ending A and Ending B (opposite outcomes). For example, if the episode is about a battle, Ending A: "The battle was won by the defenders" and Ending B: "The battle was won by the attackers". 
          * We have two options for the endings:
              Option 1: One real outcome and one fabricated outcome.
              Option 2: Two real cases that diverged (but then we have to make sure the fact sheet fits both, which is harder and might require more abstraction). 
          * Recommendation: Use one real outcome and one fabricated one. Why? Because we want the same set of facts to be used for both outcomes. Using two real cases might require different facts. Also, the fabricated ending allows us to control the balance of the facts. However, we must disclose at the end that one ending was fabricated to avoid feeling tricked in a cheap way.

     - Instruction cards for each stage.

   Groups: 18 students -> 4 groups of 4 and 1 group of 5? Or 3 groups of 5 and one of 3? We'll do 4 groups: 2 groups of 4 and 2 groups of 5? Actually, let's do 5 groups: 3 groups of 4 and 2 groups of 3? But that's uneven. Alternatively, 4 groups: two of 4 and two of 5? Then we can assign two groups to Ending A and two to Ending B. And one group as the control? Wait, we also need a control condition (no ending). So we have 5 groups? Actually, we can have:

     - 3 conditions:
          Condition 1: Ending A (2 groups)
          Condition 2: Ending B (2 groups)
          Condition 3: Control (no ending) (1 group? but 18 students: 18/5=3.6 -> 4 groups of 4 and one of 2? Not ideal). Alternatively, we do 6 groups of 3? Then 2 groups per condition? But 6 groups might be too many for the debrief.

     Given 18 students, let's do 6 groups of 3. Then we can assign:
          - 2 groups to Ending A
          - 2 groups to Ending B
          - 2 groups to Control (no ending)

     So: 6 groups, each with 3 students.

   Timing: 90 minutes.

   Sequence:

    1. Introduction (5 minutes)
          - Explain: "Today we're going to do an activity about historical prediction and explanation. You'll be given a set of facts about a historical episode and asked to make a prediction. Then we'll see how we explain what happened."

    2. Individual Prediction (10 minutes)
          - Distribute the fact sheet to every student. 
          - Instructions: "Read the fact sheet. Then, on the prediction slip, write:
               (a) Your prediction: one outcome (choose between Outcome A and Outcome B). [We have not yet defined what A and B are? We need to define the two possible outcomes at this stage?]
               (b) The one fact that you think is the most decisive for your prediction. Write the fact number and a brief reason why it's decisive.
            Then put the slip in the envelope and seal it. Write your name on the envelope."

          - We must define the two outcomes at this point. Let the two outcomes be clearly defined (but without any outcome being obviously more likely). For example:
               Outcome A: The defenders won the battle.
               Outcome B: The attackers won the battle.

          - Control groups: They will do the same prediction, but they won't be given an ending later.

    3. Group Assignment and Work (30 minutes total)
          - Collect the envelopes.

          - Assign groups: 6 groups of 3. Assign 2 groups to each condition: Ending A, Ending B, Control.

          - For the Ending A and Ending B groups:
               - Give each group a card with the ending they are assigned. 
               - Instructions: "Your group's task: Write a causal story of how the outcome (whichever they were given) came to be. Use the facts from the fact sheet. Your story should:
                    * Be about 1 paragraph (4-5 sentences).
                    * Identify which facts were the key causes (list the fact numbers that played a causal role).
                    * For each key fact, explain how it contributed to the outcome.
                    * Also, rate on a scale of 1-10 (10 being extremely predictable) how predictable this outcome was given the facts."

          - For the Control groups:
               - Instructions: "Your group's task: Without knowing the outcome, discuss and rate on a scale of 1-10 how predictable Outcome A is and how predictable Outcome B is. Also, list which facts you think are the most important for determining the outcome and why. You don't need to write a story, just discuss and note your ratings and the key facts."

          - Time: 20 minutes for group work.

    4. Group Sharing and Comparison (25 minutes)
          - First, have the Ending A groups and Ending B groups share their stories and key facts. Write on the board:

              Group | Outcome | Key Facts | How they interpret the facts (briefly) | Predictability rating

            Example:

              Group 1 (Ending A): 
                  Key facts: 3, 7, 10
                  Interpretation: Fact 3 showed the defenders' preparation, Fact 7 the attackers' overconfidence, Fact 10 the terrain advantage.
                  Rating: 8

              Group 2 (Ending A): 
                  ... 

              Group 3 (Ending B): 
                  Key facts: 3, 5, 11
                  Interpretation: Fact 3 showed the defenders' complacency, Fact 5 the attackers' innovation, Fact 11 the terrain disadvantage (same as fact 10 but interpreted oppositely).

          - Then, have the control groups share their predictability ratings for both outcomes and their list of important facts.

          - Now, reveal the twist: 
              "Notice how the same facts are being used to support opposite outcomes? For example, fact 3 was used by Group 1 (A) to show the defenders' strength, but by Group 3 (B) to show the defenders' weakness? And fact 10 was used by A as a terrain advantage and by B as a terrain disadvantage? Also, some facts that were mentioned by the control groups as important are missing in the stories of the outcome groups? Why? Because they didn't fit the story."

          - Then, return the envelopes. Have each student open their own and compare:

              - What they predicted individually vs. what they just wrote in the group (if they were in an outcome group) or what they rated (if control).

              - Also, what they thought was the decisive fact vs. what the group used.

          - Ask for reactions.

    5. Debrief (20 minutes)
          - First, highlight the two distinct failures:

              Failure 1: Memory distortion (hindsight bias)
                  - Ask: "How many of you, when you read your individual prediction, found that it was different from what you expected? Or that you had forgotten you thought that?"
                  - Point out: We often misremember our past predictions to align with what actually happened.

              Failure 2: Narrative construction (post hoc explanation)
                  - Point to the board: "Look at how the same facts were used to explain opposite outcomes. The narrative we build after the fact feels satisfying because it weaves the facts into a coherent story, but note: we drop facts that don't fit, and we interpret ambiguous facts in a way that supports the outcome."

          - How to separate them?
              - The memory failure is about the individual prediction: we have the envelope as proof.
              - The narrative failure is about the group story: we see how the same facts are used for opposite outcomes.

          - What the activity can't do:
              - It might leave the impression that all historical explanation is just post hoc storytelling. But we know that sometimes events are predictable and explanations are sound. How to repair?

              Repair: 
                  - Note that in real history, we have more than 12-15 facts. We have a vast amount of data, and we can test our explanations by looking for patterns across multiple cases (if we have comparative cases) or by using counterfactual reasoning. 
                  - Also, we can use theory to make predictions. But the point is that we must be aware of these biases and use methods to guard against them.

          - Disclosure about the endings: 
              - At the end of the debrief, reveal: "In this activity, one of the endings was the actual historical outcome, and the other was fabricated. The fact sheet was designed to be ambiguous so that both outcomes could be argued. Why did we do this? To show how easily we can construct a narrative for either outcome. In real history, we don't have the luxury of knowing the outcome is fixed, so we must be cautious about our explanations."

          - To avoid feeling cheaply tricked, we can say at the beginning: "We are using a historical episode, but for the purpose of this activity, we are going to consider two possible outcomes." Then at the end, reveal which one was real and which was fabricated.

    6. Predictably goes wrong:

          - One group might say: "Why are we explaining an ending that's made up? That's not history."

          - Answer: "In this exercise, we are exploring how we construct explanations. By having two groups explain opposite outcomes with the same facts, we can see how our explanations are shaped by the outcome we know. This is a common experimental method to study hindsight bias and narrative construction. In real history, we only know one outcome, but we must remember that the same set of circumstances could have led to a different result, and our explanations should reflect that uncertainty."

          - Another problem: The control group might feel left out because they don't get to write a story. But they have a critical role: they provide the baseline for predictability without knowing the outcome.

          - Also, the group work might take longer than 20 minutes? Maybe give 25.

          - The fact sheet must be carefully designed so that it is balanced. If it leans too much to one side, then the fabricated ending will be too hard to explain.

    Materials:

      Fact Sheet Example (for a battle):

        Fact 1: The defenders had fortified their position for several months.
        Fact 2: The attackers had recently won a series of victories against other enemies.
        Fact 3: The defenders' leader was known for his cautious approach.
        Fact 4: The attackers' leader was known for his bold tactics.
        Fact 5: The weather on the day of the battle was foggy.
        Fact 6: The defenders had a larger force, but many were inexperienced.
        Fact 7: The attackers had a smaller force, but they were highly trained.
        Fact 8: The terrain was hilly, which could provide cover for attackers but also high ground for defenders.
        Fact 9: The defenders had supplies to last a month.
        Fact 10: The attackers had to secure a victory quickly because their supply lines were stretched.
        Fact 11: There were rumors of dissent among the defenders' officers.
        Fact 12: The attackers had intercepted some of the defenders' communication.

      Endings:
          Ending A: The defenders won the battle.
          Ending B: The attackers won the battle.

      Control group: They don't get an ending.

    Instruction Cards:

      For Individual Prediction:
          "Read the fact sheet. Then, on the prediction slip provided, write:
            - Your name
            - Your prediction: either 'Outcome A: Defenders win' or 'Outcome B: Attackers win'
            - The one fact (by number) that you consider the most decisive for your prediction, and a one-sentence reason why.
          Seal the slip in the envelope and write your name on the envelope. You have 10 minutes."

      For Ending Groups (A or B):
          "Your group has been assigned Outcome [A/B]. Your task is to write a causal story (one paragraph) explaining how this outcome happened. In your story, you must:
            - Identify at least three facts (by number) that were key causes.
            - For each key fact, explain how it contributed to the outcome.
            - Also, as a group, rate on a scale from 1 to 10 (1 = completely unpredictable, 10 = completely predictable) how predictable this outcome was given the facts.
          Write your story and the list of key facts with explanations on the provided sheet. You have 20 minutes."

      For Control Groups:
          "Your group will not be told the outcome. Your task is to:
            - Discuss and rate on a scale of 1-10 how predictable Outcome A (defenders win) is given the facts.
            - Discuss and rate on a scale of 1-10 how predictable Outcome B (attackers win) is given the facts.
            - List the facts (by number) that you think are the most important for determining the outcome, and explain why they are important (without knowing the outcome).
          You have 20 minutes. You do not need to write a story."

    Comparison Scheme:

          - On the board, create a table with columns:
              Group | Condition (Ending A, Ending B, Control) | Key Facts | Interpretation (for outcome groups) or Important Facts (for control) | Predictability Rating

          - For the outcome groups, fill in the row as they present.
          - For the control groups, they will have two ratings (for A and for B) and one list of important facts (which should be facts that are critical for either outcome).

          - Then, compare:
              - How the same fact is interpreted differently by groups with opposite outcomes.
              - How the control group's important facts might include facts that were dropped by the outcome groups because they didn't fit the narrative.

    Disclosure:

          At the beginning: "We are going to look at a historical episode. The facts are real, but for the purpose of this activity, we are going to consider two possible outcomes: Outcome A and Outcome B. One of these outcomes is what actually happened, and the other is a plausible alternative. At the end, we will reveal which was which."

          At the end of the debrief: "In reality, Outcome A was the actual historical outcome. Outcome B was fabricated. We used this method to demonstrate how our explanatory processes work."

    What the activity can't reproduce:

          The activity uses a limited set of facts and a single episode, so it cannot capture the cumulative and comparative nature of historical research that allows for more robust explanations.

    Last line:

          \gap{the cumulative and comparative nature of historical research}
answer: |-
  ### Activity Design: "Narrative Construction Lab"  
  **Core Objective:** Separate hindsight bias (memory distortion) from narrative satisfaction (post hoc explanation).  

  ---

  #### **Materials**  
  1. **Fact-Sheet (1 per student):**  
     - **12–15 facts** about a historical episode (e.g., a political crisis, battle, or innovation race).  
     - **Key Properties:**  
       - **Ambiguity:** Each fact must support *multiple interpretations*.  
         - *Example:* "Leader X was cautious" → Could imply *prudence* (strength) or *indecisiveness* (weakness).  
       - **Balance:** 5 facts slightly favor Outcome A, 5 slightly favor Outcome B, 3–5 truly neutral/irrelevant.  
         - *Example neutral fact:* "The national flower was roses" (irrelevant) or "Unseasonal rain occurred" (ambiguous impact).  
       - **Seeds for Reinterpretation:** Include 3–4 traits/events explicitly open to spin (e.g., "Army morale was described as ‘resolved but weary’").  

  2. **Two Endings:**  
     - **Outcome A vs. Outcome B** (e.g., "Revolution succeeded" vs. "Revolution failed").  
     - **Use one real historical outcome + one plausible fabrication.**  
       - *Why:* Ensures identical fact-sheets for both endings. Avoids "cheap trick" by disclosing post-activity: *"One outcome was real; the other was a plausible alternative historians debate."*  

  3. **Group Cards (Instructions):**  
     - **Prediction Phase (Individual):**  
       *"Write on your slip:*  
       - **PREDICTION:** Outcome A or B.  
       - **DECISIVE FACT:** The *one* fact number you believe most determined your prediction.  
       *Seal in envelope. Write your name on it."*  
     - **Explanation Phase (Groups):**  
       - **For Outcome Groups (A/B):**  
         *"Your assigned outcome is [A/B]. As a group:*  
         - Write a **1-paragraph causal story** explaining why this outcome was inevitable.  
         - **Mark 3–5 ‘key cause’ facts** (list numbers).  
         - Rate: **‘How predictable was this outcome?’** (1=random, 10=inevitable)."  
       - **For Control Groups (no outcome):**  
         *"Do NOT assign an outcome. As a group:*  
         - List **3–5 ‘most predictive’ facts** (list numbers).  
         - Rate: **‘How predictable is Outcome A?’** and **‘How predictable is Outcome B?’** (1–10)."  

  ---

  #### **Sequence & Timing (90 mins total)**  
  1. **Intro (5 mins):**  
     - *Frame:* "Today we dissect how historians explain events. You’ll predict an outcome, then explain it."  
     - Distribute fact-sheets.  

  2. **Individual Predictions (10 mins):**  
     - Students read facts and complete prediction slips. Collect envelopes.  

  3. **Group Assignment (5 mins):**  
     - Split into **6 groups of 3** (adjust for 18 students).  
     - Assign:  
       - 2 groups → **Outcome A**  
       - 2 groups → **Outcome B**  
       - 2 groups → **Control (no outcome)**  
     - Give each group instruction cards.  

  4. **Group Work (25 mins):**  
     - Outcome groups write stories + ratings.  
     - Control groups list predictive facts + dual ratings.  

  5. **Comparison Jigsaw (30 mins):**  
     - **Step 1:** Each Outcome A/B group shares:  
       - Their causal story.  
       - "Key cause" facts and interpretations.  
       - Predictability rating.  
     - **Step 2:** Control groups share:  
       - Their "predictive facts" list.  
       - Dual predictability ratings.  
     - **Comparison Scheme (Visual Anchor):**  
       - Draw a **large table on the board** with columns:  
         | Group | Outcome | Key Causes | Interpretation Snippets | Rating |  
       - **Highlight contrasts:**  
         - Same fact in A and B stories (e.g., "Fact 5: ‘Cautious leader’ → *A: ‘prudent strategy,’ B: ‘missed opportunities’*").  
         - Facts dropped by Outcome groups but flagged by Controls as predictive.  
         - Rating gaps (Control: "A=5, B=5" vs. Outcome A group: "A=9!").  

  6. **Reveal & Reflection (15 mins):**  
     - Return envelopes. Students compare:  
       - Their *original* prediction vs. group story.  
       - Their *decisive fact* vs. group’s "key causes."  
     - *Prompt:* "Who misremembered their prediction? Who sees facts reinterpreted?"  

  ---

  #### **Debrief Script (Key Points)**  
  **Start with Data:** Point to the board. "Notice:  
  - Same facts → opposite stories (e.g., caution as genius/folly).  
  - Outcome groups ignored facts Controls thought were predictive.  
  - Your pre-outcome ratings (Control) were lower than post-outcome groups’."  

  **Separate the Two Failures:**  
  1. **Hindsight Bias (Memory):**  
     - *Show:* "Many of you misremembered your prediction. That’s your brain editing history to fit what ‘makes sense’ now."  
  2. **Narrative Satisfaction (Explanation):**  
     - *Show:* "The stories feel satisfying because they’re built *after* the outcome. You cherry-picked and spun facts until it clicked. That’s why the *same* facts explain *opposite* outcomes."  

  **Address Limitations:**  
  - *"This activity can’t reproduce the iterative testing of historical methods.* Real historians use archives, counterfactuals, and cross-comparison to stress-test narratives. Our toy case lacks that rigor—so it *feels* like all explanation is post hoc. But the lesson is **caution**: your brain craves causal stories, so you must actively guard against these traps with evidence and falsification."  

  **Disclose Endings:**  
  - "One outcome was real history; the other was fabricated. We did this to isolate how narratives warp to fit *any* ending. Real history is messier!"  

  ---

  #### **Predictable Problems & Fixes**  
  - **"Why explain a fake outcome?"**  
    - *Response:* "Because historians *do* this with real outcomes! We’re simulating how brains force facts to fit a known ending. The ‘fake’ outcome is a control to expose the process."  
  - **Hedging in Stories:**  
    - *Prevent with:* Strict instructions (e.g., "Write why it was *inevitable*"). Call out vague language.  
  - **Dominant Personalities in Groups:**  
    - Assign roles (e.g., "Facilitator," "Scribe," "Fact Checker").  
  - **Control Groups Feel Left Out:**  
    - Emphasize their role: "You’re the baseline showing how *not* knowing the outcome changes reasoning."  

  ---

  \gap{iterative testing against evidence}
