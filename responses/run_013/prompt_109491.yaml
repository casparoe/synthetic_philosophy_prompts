prompt: |-
  I'm the parliamentarian for a mid-sized professional society (roughly 400 voters, two business meetings a year), and every other year somebody proposes a new way of picking a chair, a conference site, a prize winner — usually right after the last method got gamed. I want a checklist I can run on a proposed rule before we adopt it, built on what social choice theory actually proves about strategy-proofness: is this rule manipulable, who gains by lying, what do they have to know about everyone else to pull it off, and what should we do about it. It has to be usable by a non-economist in an afternoon, and it has to be willing to tell the committee "any rule with three or more live options can be gamed; heres the price of each fix" instead of pretending theres a clean answer. Run it on three proposals: (a) Borda count over four candidates, where two members claim they swung the last election by burying the front-runner; (b) instant runoff with three candidates; (c) what the committee actually wants, a two-round majority where the nominating committee can drop a candidate in after the first round. At least one of these should end with the procedure telling me something I dont like, and it should say where it stops deciding for us because the rest is values. Also flag the cases where we're fine: two options only, or when the options line up along one axis (our site votes basically do).
reasoning: |-
  We are going to create a checklist for evaluating voting rules. The checklist will be based on social choice theory, particularly focusing on strategy-proofness (manipulability). We'll break it down into a series of questions that a non-economist can use in an afternoon.

  Checklist for Evaluating a Voting Rule:

  1. **How many alternatives (candidates/options) are there?**
     - If only two, then majority rule is strategy-proof (barring ties). Stop here: the rule is safe.
     - If three or more, then by Gibbard-Satterthwaite theorem, no deterministic voting rule with at least three alternatives is strategy-proof (unless it is dictatorial or has only two possible outcomes). So, any rule can be manipulated. Then we proceed to understand the nature of the manipulation.

  2. **What is the type of the rule?** (e.g., plurality, Borda, IRV, two-round, etc.)
     - This will help us look for known vulnerabilities.

  3. **Who can manipulate?** (i.e., who has an incentive to misrepresent their preferences?)
     - Typically, a voter who can change the outcome to one they prefer by lying.

  4. **What do they need to know to manipulate?**
     - Do they need to know the preferences of others? How much? (e.g., full profile, or just the current front-runners)
     - Can they manipulate with limited information?

  5. **What is the price of making the rule harder to manipulate?** (i.e., trade-offs)
     - This might involve complexity, time, or other desirable properties (like fairness, consistency, etc.).

  6. **Are the alternatives one-dimensional?** (e.g., left-right spectrum, or in our case, conference sites along a cost/convenience axis)
     - If so, then the median voter theorem applies and majority rule in a pairwise contest is strategy-proof. Also, other rules may behave well.

  Now, we run the three proposals through this checklist.

  ---

  **Proposal (a): Borda count over four candidates**

  1. **Number of alternatives:** 4 (so manipulable in principle).
  2. **Type:** Borda count. Each voter ranks the candidates, and candidates get points: for 4 candidates, 3 points for first, 2 for second, 1 for third, 0 for last. The candidate with the highest total wins.
  3. **Who can manipulate?** Any voter who has an incentive to change the outcome by misrepresenting their ranking. In particular, a voter might "bury" a strong candidate they dislike by ranking that candidate last even if they don't truly believe that, and/or raise a less strong candidate that they prefer over the front-runner.
     - Example: In the last election, two members claimed they swung the election by burying the front-runner. This is a classic Borda vulnerability: if a voter thinks a candidate is a strong threat but they dislike that candidate, they can rank that candidate lower than their true preference to reduce their points, and raise a less threatening candidate that they prefer over the front-runner.
  4. **What do they need to know?** They need to know that the candidate they dislike is a front-runner and that by lowering that candidate's rank they can help a candidate they prefer more. They don't need exact knowledge of other votes, but they need a rough idea of the standings (which might be available from polls or prior knowledge).
  5. **Trade-offs:** 
     - Borda count is simple to understand and counts all preferences. However, it is vulnerable to strategic ranking. 
     - Alternatives: Switch to a rule that is less manipulable? But note that all rules with 4 candidates are manipulable. Some rules are harder to manipulate. For example, instant runoff voting (IRV) might be less vulnerable to burial, but not immune. Alternatively, we might use a Condorcet method, but that is more complex and might have other issues. 
     - The price: We might lose the simplicity of Borda. Also, note that Borda satisfies some good properties (like not having the "no-show paradox") but fails others (like independence of irrelevant alternatives). 
     - **Conclusion for (a):** The rule is manipulable by burial. The committee must decide if the simplicity of Borda is worth the risk. If the society is small and voters are honest, it might be acceptable. Otherwise, consider a different rule.

  ---

  **Proposal (b): Instant runoff voting (IRV) with three candidates**

  1. **Number of alternatives:** 3 (so manipulable in principle).
  2. **Type:** IRV (also called ranked-choice voting). Voters rank the candidates. In the first round, if a candidate has a majority of first-choice votes, they win. Otherwise, the candidate with the fewest first-choice votes is eliminated, and their votes are redistributed based on the next choice. Then the remaining two candidates face a majority vote.
  3. **Who can manipulate?** 
     - IRV is vulnerable to a strategy called "compromising": a voter might raise a candidate they perceive as more viable in the first round, even if they prefer a less viable candidate. 
     - Also, in some cases, a voter might benefit by reversing the order of two candidates (but this is less common in 3-candidate IRV). 
     - However, note that IRV is not vulnerable to "burying" (like in Borda) because ranking a candidate last never hurts them and only helps. But it is vulnerable to truncation (not ranking all candidates) and sometimes to ranking a less preferred candidate higher (if that candidate is more viable). 
  4. **What do they need to know?** They need to have a good idea of which candidates are likely to be in the top two and which one is likely to be eliminated first. They might need to know the relative standings of the candidates to decide whether to vote for their true favorite or to compromise on a second choice to avoid a worse outcome.
  5. **Trade-offs:**
     - IRV avoids the spoiler effect (unlike plurality) and ensures the winner has broad support. However, it is not strategy-proof. 
     - The complexity of IRV is higher than plurality but manageable. 
     - **Conclusion for (b):** The rule is manipulable, but the extent of manipulation in practice is debated. For three candidates, it is less manipulable than for more. The committee must decide if the benefits of IRV (like majority winner and avoiding spoilers) are worth the risk of strategic voting.

  ---

  **Proposal (c): Two-round majority with a nominating committee having the power to add a candidate after the first round**

  1. **Number of alternatives:** Initially, the first round has multiple candidates (say, n). Then the top two (or more, but typically two) advance to the second round. However, the nominating committee can add a candidate after the first round. So the second round might have three candidates? Or does the rule specify that the second round is only between the top two from the first round plus the added candidate? Let's assume it becomes three candidates in the second round? Or maybe the rule replaces one of the top two? We need to clarify.

     But note: the problem says "a two-round majority where the nominating committee can drop a candidate in after the first round." So the first round is held, then the nominating committee adds a candidate (so the second round has the top two from the first plus the added one? or does it replace one?).

     Let's assume the typical two-round system: first round with multiple candidates, top two advance to the second round. But then the nominating committee adds one more candidate for the second round. So the second round has three candidates? Then we are back to having three candidates in the second round.

     Alternatively, maybe the nominating committee replaces one of the top two? That would be unusual. We'll assume the second round has the top two from the first round plus one added candidate, making three.

     Therefore, the second round has three candidates, so by Gibbard-Satterthwaite, it is manipulable.

  2. **Type:** First round: plurality or majority? Typically, in two-round systems, the first round uses plurality to select the top two. Then the second round is a majority vote among the three (with the added candidate). But how is the second round conducted? We must specify: if it's a plurality vote? Or a majority vote with three candidates? That doesn't make sense because without a majority, we might need to do something else. The proposal says "two-round majority", so perhaps the second round is intended to be a majority vote. But with three candidates, that might not produce a majority.

     The description is ambiguous. We'll assume the second round is a plurality vote? Or maybe an IRV? Or a simple majority with the top two of the second round? The problem doesn't say. This ambiguity is a problem in itself.

     However, the key point is that the nominating committee can add a candidate after the first round. This introduces a different kind of strategic issue: not just by voters, but by the committee.

  3. **Who can manipulate?**
     - Voters: In the first round, voters might strategically vote for a candidate they think is more viable to get into the top two, knowing that the committee will add one more. In the second round, with three candidates, they might manipulate as in any three-candidate system (like IRV or plurality, depending on the rule).
     - The nominating committee: They can manipulate by choosing which candidate to add. They might add a candidate that splits the vote of a leading candidate, or that helps their preferred candidate. This is a form of manipulation by the committee.

  4. **What do they need to know?**
     - Voters: In the first round, they need to know the relative standings to decide whether to vote for their true favorite or compromise to get a candidate into the top two. In the second round, they need to know the standings again to vote strategically.
     - The committee: They need to know the results of the first round and the preferences of the electorate to choose a candidate that will influence the outcome in their desired way.

  5. **Trade-offs:**
     - This system is very vulnerable to manipulation by both voters and the committee. The committee's power to add a candidate after the first round breaks the usual two-round system's properties. 
     - The two-round system without the committee's intervention is already manipulable in the first round (like in France, where voters sometimes vote strategically in the first round to get their preferred candidates into the second). Adding the committee's intervention makes it worse.
     - **Conclusion for (c):** This rule is highly manipulable and also introduces a non-voter agent (the committee) that can manipulate the outcome. The committee must decide if the benefit of having the committee's input (maybe to ensure a qualified candidate is considered) is worth the risk of manipulation and loss of voter trust.

  ---

  **Summary and Final Advice:**

  - **For (a) Borda:** It's manipulable by burying. Consider if the society's culture (trust) and the stakes make it acceptable. Alternatively, consider a rule that is less sensitive to burial (like IRV) but note that IRV has its own issues.
  - **For (b) IRV:** With three candidates, IRV is less manipulable than with more. But it is still manipulable, especially by compromising. However, it is a good system for achieving majority support and avoiding vote-splitting. It might be acceptable.
  - **For (c) Two-round with committee addition:** This is the most problematic. The committee's power to add a candidate after the first round is a major vulnerability. It also creates an opportunity for the committee to be accused of gaming the system. We recommend against this unless there is a very strong reason (like ensuring minimum qualifications) and with safeguards (e.g., the committee must follow strict criteria and be transparent).

  Finally, note that in cases where the alternatives are one-dimensional (like conference sites that can be ordered by cost or location), then a simple majority vote between pairs (or using the median) is strategy-proof. So for site votes, we can use a simpler method.

  **Checklist Output for Each Proposal:**

  **(a) Borda:**
  - Manipulable: Yes, by burial.
  - Who gains: Voters who prefer a candidate that is not the front-runner and who can lower the front-runner's points.
  - What they need: Knowledge of the front-runners and that their vote can make a difference.
  - Trade-offs: Simplicity vs. vulnerability. Consider if the group is small and cooperative. Otherwise, switch to a different rule? But note: all rules are manipulable with 4 candidates.

  **(b) IRV:**
  - Manipulable: Yes, by compromising (voting for a second choice in the first round if the favorite is unlikely to make the top two).
  - Who gains: Voters whose favorite is weak and who prefer a viable candidate over the other viable candidate.
  - What they need: Knowledge of which candidates are strong and which are weak.
  - Trade-offs: Avoids vote-splitting and ensures a majority winner? Actually, in three-candidate IRV, the winner is the Condorcet winner in many cases. The risk of manipulation is lower than in Borda for burial. It's a reasonable choice.

  **(c) Two-round with committee addition:**
  - Manipulable: Yes, by both voters and the committee.
  - Who gains: 
     - Voters: in the first round, they might compromise to get a candidate into the top two; in the second round, they might manipulate as in any three-candidate system.
     - The committee: they can add a candidate to help their preferred outcome.
  - What they need: 
     - Voters: knowledge of the standings in both rounds.
     - Committee: knowledge of the first-round results and the preferences of the electorate to choose a candidate that will split the vote or boost their preferred candidate.
  - Trade-offs: This rule is very vulnerable and might lead to loss of trust. Only use if the committee's role is essential and if there are strict constraints on their power (e.g., only adding a candidate if no candidate in the first round meets a threshold, and the added candidate must be pre-specified or follow clear rules). Otherwise, avoid.

  In all cases, the committee must weigh the values: Do they value simplicity, majority support, resistance to manipulation, or the ability of a committee to correct for voter mistakes? There is no clean answer, but the checklist helps to identify the trade-offs.
answer: |-
  Below is a pragmatic, theory-grounded checklist for evaluating voting rules' vulnerability to strategic manipulation ("gaming"), tailored for a non-economist. It incorporates key insights from social choice theory (e.g., Gibbard-Satterthwaite theorem, Arrow's impossibility) and focuses on practical trade-offs. The checklist explicitly acknowledges when no perfect solution exists and separates objective analysis from value judgments. I'll first present the checklist, then apply it to your three proposals.

  ---

  ### **Strategy-Proofness Evaluation Checklist**
  _Use this to assess any proposed voting rule. Answer each question sequentially._

  1. **How many live options are there?**  
     - If **only 2 options**, stop: majority vote is strategy-proof.  
     - If **3+ options**, no rule is fully strategy-proof (Gibbard-Satterthwaite theorem). Proceed to Q2.  
     - If options **line up on one clear axis** (e.g., left-right politics, conference cost/convenience), use **median voter rule**: rank options, pick the median. This is strategy-proof if preferences are single-peaked (common for "spectrum" issues like site selection).  

  2. **What type of rule is proposed?**  
     Identify the rule's category:  
     - _Rank-based_ (e.g., Borda, IRV): Vulnerable to "burying" (ranking rivals lower) or "compromising" (boosting a safe choice).  
     - _Runoff-based_ (e.g., two-round systems): Vulnerable to "vote-splitting" or committee manipulation.  
     - _Scoring/approval_ (e.g., range voting): Vulnerable to exaggeration (min/max scoring).  

  3. **Who can manipulate this rule?**  
     - _Voters?_ Which voters gain from lying? (e.g., supporters of underdogs, front-runners).  
     - _Organizers/committees?_ Can they alter candidates/rules mid-process?  
     - _What information do manipulators need?_  
       - Low info: Only need their own preferences (easy to game).  
       - Medium info: Need polling/top contenders (common in small societies).  
       - High info: Need full preference distribution (rare in practice).  

  4. **What's the main vulnerability?**  
     - _Burying:_ Voters sink a strong rival by ranking them last.  
     - _Compromising:_ Voters abandon a weak favorite for a viable "lesser evil."  
     - _Horse-trading:_ Coalitions coordinate lies (rare in 400-voter groups).  
     - _Committee interference:_ Gatekeepers alter options to steer outcomes.  

  5. **What's the trade-off for "fixing" it?**  
     - _More strategy-proof rules_ (e.g., single transferable vote) = more complex ballots/longer counts.  
     - _Restricting options_ reduces manipulation but may ignore legitimate choices.  
     - _Transparency fixes_ (e.g., publishing ballots) deter gaming but discourage participation.  
     - **No perfect fix exists for 3+ options.** Choose the vulnerability you tolerate most.  

  6. **Values-based decision point**  
     - If steps 1–5 show unavoidable flaws, decide based on:  
       - _Fairness:_ Should the Condorcet winner (beats all in head-to-head) always win?  
       - _Simplicity:_ Can voters understand the rule?  
       - _Expressive ballots:_ Do voters want to rank/score options?  
       - _Trust:_ Should committees have corrective powers?  

  ---

  ### **Application to Your Proposals**
  **Key theory context:**  
  - The Gibbard-Satterthwaite theorem proves **all ranked-choice rules with ≥3 options are manipulable**.  
  - Vulnerability depends on **what manipulators know** (e.g., polling makes gaming easier).  
  - For **one-dimensional issues** (e.g., site selection), the median voter rule is strategy-proof and efficient.

  ---

  #### **(a) Borda Count (4 candidates)**  
  1. **Live options:** 4 candidates → manipulable.  
  2. **Rule type:** Rank-based scoring (e.g., 3-2-1-0 points).  
  3. **Who can manipulate?**  
     - Voters who prefer a non-frontrunner.  
     - They need **only polling data** (top 2 candidates).  
  4. **Main vulnerability:** **Burying**. By ranking the true frontrunner last, voters reduce its points. Your members likely swung the election by sinking the leader and boosting a compromise.  
  5. **Trade-offs for fixes:**  
     - _Fix:_ Switch to Baldwin’s method (Borda + instant runoff).  
     - _Price:_ More complex; may not prevent burying in early rounds.  
     - **Bottom line:** Gaming is inevitable here. Borda is highly vulnerable without a Condorcet winner.  
  6. **Values decision:** Do you prioritize expressive rankings (Borda) over susceptibility to tactical burying?  

  **Verdict:** **Manipulable with low effort.** Borda is a poor fit for contested elections. Consider approval voting if simplicity is key.

  ---

  #### **(b) Instant Runoff Voting (3 candidates)**  
  1. **Live options:** 3 candidates → manipulable.  
  2. **Rule type:** Rank-based runoff (eliminate lowest, redistribute).  
  3. **Who can manipulate?**  
     - Voters whose favorite is weak but has passionate support.  
     - They need **polling data** (to identify the weakest frontrunner).  
  4. **Main vulnerability:** **Compromising**. Voters rank a "viable" second choice first to avoid wasting their vote. Example: If progressives fear a split left vote, they might abandon their true favorite for a moderate.  
  5. **Trade-offs for fixes:**  
     - _Fix:_ None (all ranked systems are manipulable).  
     - _Price:_ IRV reduces but doesn’t eliminate gaming. It’s more robust than Borda but vulnerable in tight 3-way races.  
     - **Bottom line:** Harder to game than Borda but still manipulable with polling.  
  6. **Values decision:** Do you value majority support (IRV ensures the winner has >50% in final round) over potential favorite betrayal?  

  **Verdict:** **Moderately manipulable.** IRV is defensible for 3 candidates if voters are honest, but beware close races.

  ---

  #### **(c) Two-Round Majority + Committee Late Addition**  
  1. **Live options:** First round (e.g., 4 candidates) → top 2 advance. Committee adds a 3rd candidate → **3 options in final round**. Manipulable.  
  2. **Rule type:** Runoff-based + committee intervention.  
  3. **Who can manipulate?**  
     - **Voters:** In round 1, they may compromise to keep rivals out of the top 2 (e.g., conservatives unite behind one candidate to block a liberal).  
     - **Committee:** Can add a candidate to split votes (e.g., add a spoiler to hurt a frontrunner they dislike).  
     - **Info needed:** Voters need polling; the committee needs no special info.  
  4. **Main vulnerability:** **Double manipulation**:  
     - Voters game round 1 via compromising.  
     - Committee games the outcome via strategic additions (e.g., adding a candidate who pulls votes from the lead).  
  5. **Trade-offs for fixes:**  
     - _Fix 1:_ Ban late additions → simpler two-round system.  
     - _Fix 2:_ Allow additions only if no candidate clears a threshold (e.g., <40% in round 1).  
     - _Price:_ Fixes reduce committee power but don’t eliminate voter gaming.  
     - **Bottom line:** This rule is **highly vulnerable**—it adds committee manipulation to standard runoff flaws.  
  6. **Values decision:** Does your society trust the committee to act impartially? If not, this rule invites distrust and gaming.  

  **Verdict:** **Highly manipulable by voters AND committee.** The late-addition power is a red flag unless the committee is saintly.  

  ---

  ### **Key Takeaways for Your Committee**  
  - **For site selection (one-dimensional):** Use the **median voter rule**. Have voters rank sites, pick the median. This is strategy-proof and simple.  
  - **For 2-option votes:** Majority vote is bulletproof.  
  - **For 3+ options:** All rules are manipulable. Prioritize:  
    - _Least manipulative:_ Approval voting (vote for all you accept) for simplicity, or IRV for majority support.  
    - _Avoid:_ Borda (easy burying) and committee interventions (adds agency problems).  
  - **What you won’t like:** There’s no perfectly clean solution for competitive elections. Values (e.g., "Should the winner have broad support?") trump theory.  
  - **Where theory stops:** Steps 5–6 require weighing trust, simplicity, and fairness—theory can’t decide these.  

  **Final advice:** Use approval voting for chair/prize elections (reduces gaming, simple ballots). For contentious issues, accept that some strategy is inevitable and focus on transparency (e.g., publish vote counts).
