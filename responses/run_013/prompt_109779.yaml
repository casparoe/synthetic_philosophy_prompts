answer: |-
  ### Translation into Database Vocabulary

  **Principle of Identity of Indiscernibles (Leibniz):**  
  *Philosopher's claim:* "If two entities share all properties, they are identical (one entity)."  
  *Your terms:* In set semantics, if two tuples in a relation have identical values for all attributes (same natural key), they are the same tuple. The relation enforces uniqueness, collapsing them into one. Formally:  
  ```sql
  SELECT * FROM spheres WHERE sphere_id_1 ≠ sphere_id_2 AND attribute1 = attribute2 AND ... AND attributeN = attributeN;
  -- Returns empty set. Tuples with identical values cannot coexist in the relation.
  ```

  **Converse: Indiscernibility of Identicals:**  
  *Philosopher's claim:* "If two entities are identical, they share all properties."  
  *Your terms:* If two tuple references (e.g., row IDs) point to the same tuple, all attribute values match. Joins/FKs rely on this:  
  ```sql
  SELECT * FROM spheres s1 
  JOIN spheres s2 ON s1.primary_key = s2.primary_key 
  WHERE s1.attribute <> s2.attribute; 
  -- Returns empty set. Same PK → same values.
  ```

  **Black's Two Spheres Scenario:**  
  *Philosopher's setup:* Two spheres, identical in all intrinsic properties (mass, position, etc.), alone in an empty universe. Are they distinct?  
  *Your terms:*  
  - **Set semantics:** Impossible. A relation `spheres(mass, position)` would dedup identical tuples, leaving one sphere.  
  - **Bag semantics:** Allows duplicate tuples: `(mass=10, position=(0,0,0))` and `(mass=10, position=(0,0,0))`.  
  - **Surrogate key approach:** Add an artificial PK:  
    ```sql
    spheres(id PK, mass, position)
    (1, 10, (0,0,0))
    (2, 10, (0,0,0))
    ```  
    The spheres are distinct by `id`, despite identical attributes.

  ---

  ### Residue Report: What Maps, What Fudges, What Fails

  | **Concept**                  | **Mapping**                                                                 | **Fidelity**                     |
  |------------------------------|-----------------------------------------------------------------------------|----------------------------------|
  | **Identity of Indiscernibles** | Maps perfectly to set semantics (no duplicate tuples).                     | ✅ Clean                         |
  | **Indiscernibility of Identicals** | Maps perfectly to PK/FK joins (same reference → same values).            | ✅ Clean                         |
  | **Black's Spheres (set semantics)** | Cannot represent two spheres. Framework deletes one.                    | ❌ Fails (by design)             |
  | **Black's Spheres (bag semantics)** | Duplicate tuples allowed. "Two" spheres exist as separate rows.          | ⚠️ Fudges (identity = row position) |
  | **Black's Spheres (surrogate key)** | Spheres differ only in `id`. `id` is extrinsic.                         | ⚠️ Fudges (identity is artificial) |
  | **Intrinsic Properties**     | Must be explicitly defined as attributes. No framework for "non-represented" properties. | ⚠️ Squinting required        |
  | **NULLs**                    | `NULL != NULL` breaks value equality. Two `NULL`-heavy tuples aren't "indiscernible". | ❌ Fails (three-valued logic hurts) |
  | **Bare "Thisness" (haecceity)** | Surrogate key approximates it, but is it a "property"?                   | ⚠️ Philosophical fudge        |

  ---

  ### Pressing the Crux Points

  1. **"Same values, same tuple" – Does your vocabulary delete one sphere?**  
     Yes. Set semantics **enforces** the identity of indiscernibles by definition. Black's scenario cannot be represented without violating the rules. This isn't a limitation—it's a **verdict**: your framework rejects the possibility of distinct indiscernibles. Bag semantics or surrogate keys are workarounds, but they alter the rules.

  2. **Surrogate keys: Bare "thisness" or cheating?**  
     - The surrogate key (e.g., `id`) is **not a property of the sphere**. It's a tuple identifier—a "bare thisness" bolted onto your model.  
     - **Did you cheat?** Philosophically, yes. You introduced an *extrinsic* identifier to represent what Black calls "primitive identity." But operationally, it's valid: it mirrors how real databases handle indistinguishables (e.g., customer dedup).

  3. **NULLs: Do they help?**  
     - **No, they hurt.** `NULL` is an anti-pattern here:  
       - Two `NULL`s aren't equal → breaks indiscernibility.  
       - Even with identical `NULL` patterns, `WHERE NULL = NULL` fails.  
     - **Three-valued logic makes "indiscernible" undecidable.** You can't prove two tuples are identical if `NULL`s exist. Avoid `NULL`s for intrinsic properties in these discussions.

  4. **Bag semantics: Does it solve Black's scenario?**  
     - **Superficially yes, but it smuggles in identity.** Bag semantics allows duplicate tuples, but the "twoness" relies on **row position/storage location**—an implicit identity. Querying `ROW_NUMBER()` or physical addresses exposes this. It doesn't represent "two identical things" neutrally; it hides identity in the implementation.

  5. **Joins/FKs: Do they grasp indiscernibility?**  
     - **Circular, but operationally sound.** Joins assume "same PK → same thing," but the PK *defines* identity. This works in practice because:  
       - Natural keys derive identity from properties (enforcing indiscernibility).  
       - Surrogate keys inject identity externally (violating indiscernibility).  
     - It's not a deep grip—it's a **convention** that your model enforces.

  ---

  ### The Verdict on Residue
  **Why did some concepts not survive?**  
  - **Philosophy's vagueness vs. your precision:** Philosophers debate "properties," "intrinsicness," and "identity" without rigorous definitions. Your framework forces specificity: attributes must be modeled, identity must be explicit (PK or bag position), and `NULL` breaks logic. The "failure" isn't missing depth—it's **constraining ambiguity**.  
  - **What your model can't represent:** "Bare distinctness" without *any* representational handle (no surrogate key, no bag position). Philosophers might call this "primitive identity," but your tables require *some* column or mechanism to distinguish tuples. If that feels like cheating, it reveals that the philosophical concept is **ungrounded in concrete representation**.  
  - **The real insight:** Your vocabulary doesn't *refute* Black—it **exposes assumptions**. To model two identical spheres, you *must* add an identity column (surrogate key) or allow duplicates (bag semantics). Both are admissions that "indiscernible distincts" require an artificial scaffold. The framework doesn't resolve the debate; it **makes the cost of disagreement explicit**.
