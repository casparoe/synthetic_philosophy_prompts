prompt: |-
  ok so this is for the last session of a reading group thats spent the whole term on the frame problem — the AI one, where a system has to work out which of its beliefs an action leaves alone, and it turns out "nothing else changes" is either an infinite list or a lie. i want to close the term with a poem.

  what i'm asking for: a sestina whose six end-words are all things that just sit there and don't change while the poem's action happens around them. the form has to *be* the problem. the six keep coming back in a different order every stanza, which is what a fact does when the world moves around it, and you're not allowed to introduce a seventh, ever, however much the poem wants to. the envoi is where it has to cram all six into three lines — that's the one-breath version of what a frame axiom is supposed to do, and it should feel like compression, not like a summary.

  one twist: one of the six, which at first sounds like it just sits there, should turn out to be something the action actually does change. let it flip mid-poem rather than announce itself; the line should land differently the second time you meet it. and somewhere in there the plan should fail for a boring reason nobody bothered to write down — the kettle was never plugged in, the door was already locked — and the poem should treat that as one more line that has to fit the meter, not as a plot event.

  voice: your call, but i'd love it if the speaker were one of the six — a fact that keeps getting reasserted while everything else moves. and it should register, without ever saying it, that the real trouble isn't listing the things that stay the same, it's knowing which of them are even relevant to what just happened.

  don't name the frame problem, don't use the jargon (no "axiom", no "non-monotonic", no "inertia"). someone who knows the problem should recongise it from the shape of the thing; someone who doesn't should just get a good poem about a room.

  start straight in with the poem — no title, no preface, nothing before it. if you want to add two or three sentences after about which end-word was doing the most work, thats fine, put it after.
reasoning: |-
  Okay, the user wants a sestina for the final session of their reading group on the frame problem in AI. They've been exploring how systems struggle to specify what remains unchanged after an action without listing everything. The poem needs to embody this issue through its structure.

  The sestina requires six end-words representing unchanging objects. One of these should subtly change during the poem, flipping the reader's perception. The envoi must compress all six words into three lines, mimicking how frame axioms attempt brevity. 

  The user wants the failure to feel mundane—like a kettle unplugged—treated as metrical necessity rather than plot point. The speaker should be one of the persistent facts, observing relevance struggles implicitly. No jargon allowed; the frame problem must be recognizable only through form and imagery.

  I'm considering end-words that seem immutable but allow for one to shift: "shelf" (static), "door" (potentially changeable lock state), "clock" (perpetual motion), "vase" (fragile permanence), "book" (fixed text), "floor" (foundation). "Door" could work for the twist—locked then found already locked.

  The room setting grounds it. First stanza establishes normalcy with someone entering to boil water. Subsequent stanzas permute end-words while introducing the unnoticed kettle flaw. Mid-poem, "door" shifts from "locked" to "was locked," revealing the change happened earlier. 

  Speaker could be the shelf—silent witness to misaligned relevance. Envoi forces all six words into breathless convergence, echoing flawed frame compression. Final lines emphasize irrelevance: the clock's truth persists while the plan fails quietly. 

  After the poem, I'll note how "door" subverts expectations by changing state retroactively, mirroring how systems overlook preconditions. The shelf's fixed perspective highlights how relevance remains the true challenge.
answer: |-
  The key turns. The kettle sings. The shelf
  holds dust. He locks the new-scraped door.
  The clock insists. The thin blue vase
  sits straight. The plan requires the floor
  stays dry. He moves the heavy book.
  The steam ascends. The clock is right.

  He thought the time exactly right
  to clear the clutter from the shelf,
  to find the page inside the book
  that lists the steps. He checks the door
  again. The kettle steams. The floor
  is clean beside the waiting vase.

  The water cools inside the vase?
  He thought the timing must be right.
  He wipes a spot upon the floor.
  The dust resettles on the shelf.
  He hears a click beyond the door.
  He scans the index of the book.

  The chapter doesn't name the book
  or mention cracks within the vase.
  The steam has stopped. He checks the door
  again. The bolt slides. It was right
  to lock. The kettle chills. The shelf
  holds steady. Dampness stains the floor.

  He mops the spill across the floor.
  He shuts the cover of the book.
  He lifts the now-cooled vase
  from where the kettle stood. Alright?
  He places it back on the shelf.
  He tests the latch upon the door.

  He finds the handle of the door
  is stiff. He stands upon the floor
  unsure. The clock above the shelf
  ticks on. He puts away the book.
  The room feels close, not quite so right.
  He stares into the empty vase.

  The cracked glaze on the cold blue vase
  catches the light. The bolted door
  stands shut. But something isn't right.
  He sees the plug beside the floor,
  unnoticed in the heavy book
  of steps. The cord's not on the shelf.

  The shelf held dust. The locked door *was* locked. The book
  stayed shut. The floor got wet. The vase
  chilled. Clock was right. No steam. Plug off. Kettle cold. Plan broke. Shelf watched.
