prompt: |-
  I teach an upper-level seminar in classical Indian epistemology and I am writing the midterm. I need one essay question on Nyāya's list of pramāṇas that cannot be answered by naming perception, inference, analogy, and testimony and defining each in turn. I want the question to turn on the criterion by which the list is supposed to be generated — a pramāṇa being the instrument of a cognition that is true and arises without defect — and to make students test whether that criterion does real work or merely rationalises a list fixed in advance, by pressing it with hard cases (memory, doubt, dream cognition, the recognition of a face) and against the rival counts: the Cārvāka's one, the Buddhist's two, and the Mīmāṃsā's six with arthāpatti and anupalabdhi. It should also force them to take a side on whether distinct pramāṇas can converge on one and the same cognition or whether each must have its own exclusive domain. Please write the question, a model answer of roughly 700 words, and a marking scheme that names the specific moves separating an A from a B answer, giving the marks for five must-hit points out of 20 and a one-line note on how candidates typically get each wrong.
reasoning: |-
  We are creating an essay question that requires students to engage critically with the Nyāya criterion for a pramāṇa and to test it against hard cases and rival enumerations. The question should also force them to address the issue of whether distinct pramāṇas can converge on the same cognition.

  Question:
  "Nyāya philosophers claim that a pramāṇa is defined as the instrument of a cognition that is both true (yathārtha) and arises without defect (avyabhicāriṇi). They use this criterion to generate their list of four pramāṇas: perception (pratyakṣa), inference (anumāna), analogy (upamāna), and testimony (śabda). Critically evaluate this criterion by addressing the following:

  (a) Does the criterion do real work in generating the list, or does it merely rationalize a list fixed in advance? Test this by applying the criterion to at least three of the following hard cases: memory, doubt, dream cognition, and the recognition of a face. Would the criterion include or exclude these? Why or why not?

  (b) How does the Nyāya criterion fare in defending the four-fold list against rival enumerations? Specifically, compare it with the Cārvāka's one (perception only), the Buddhist's two (perception and inference), and the Mīmāṃsā's six (adding arthāpatti and anupalabdhi to the Nyāya four). Does the criterion help decide which list is correct?

  (c) In the course of your discussion, address the following: Can distinct pramāṇas converge on one and the same cognition? For example, can I know that there is fire on the hill by both perception and inference? Or must each pramāṇa have its own exclusive domain? How does your stance on this issue affect the way you apply the criterion?

  Take a clear position on whether the criterion does real work and whether you think the Nyāya list is justified."

  Model Answer (approx. 700 words):

  The Nyāya school’s criterion for a pramāṇa as the instrument of a true and non-defective cognition is an ambitious attempt to ground the enumeration of pramāṇas in a fundamental epistemological principle. However, upon critical examination, this criterion appears more as a rationalization of a pre-existing list than a generative principle. I will argue that the criterion fails to do substantial work because it is either too permissive or too restrictive when applied to hard cases, and it does not decisively rule against rival enumerations. Moreover, the issue of whether distinct pramāṇas can converge on the same cognition complicates the application of the criterion and reveals its inadequacy.

  First, let us apply the criterion to hard cases. Consider memory (smṛti). Memory is a cognition that can be true and may arise without defect (if the original cognition was pramā and the memory is accurate). But Nyāya excludes memory because it is not an independent source of new knowledge; it depends on a prior cognition. The criterion, however, does not explicitly require independence. Thus, the exclusion of memory seems ad hoc, driven by the pre-existing list rather than the criterion. Similarly, doubt (saṃśaya) is excluded because it is not a true cognition (it is indeterminate). This is consistent with the criterion, but note that the criterion does not help with harder cases. Take dream cognition: some dreams might be true (e.g., a dream that correctly anticipates an event). If we grant that such a dream arises without defect (which is controversial), the criterion would include it, but Nyāya does not. Again, the exclusion seems pre-determined. Finally, face recognition: when I see my friend and recognize her, this is a complex cognition involving memory and perception. Nyāya might classify it as perception (if it is non-conceptual) or as a combination. But the criterion alone does not guide us: if it is true and non-defective, it should count, but by which pramāṇa? The criterion does not specify how to individuate pramāṇas. Thus, the hard cases show that the criterion is not doing the work; the list is.

  Second, when comparing with rival enumerations, the criterion offers little decisive argument. Against the Cārvāka, who accepts only perception, the criterion might exclude inference, etc., if they can be shown to be defective. But Nyāya argues that inference is non-defective when the conditions (e.g., a valid hetu) are met. However, the Cārvāka could simply deny that inference meets the criterion by alleging defects (e.g., the possibility of error). The criterion alone cannot resolve this without independent arguments for the reliability of inference. Against the Buddhists, who reject analogy and testimony as reducible to perception and inference, the Nyāya criterion does not help because the Buddhist might accept that analogy and testimony can yield true, non-defective cognitions but still argue they are not fundamental. The criterion does not require fundamentality. The Mīmāṃsā addition of arthāpatti (implication) and anupalabdhi (non-apprehension) is more challenging. For instance, non-apprehension: when I correctly cognize the absence of a pot in a room, is this a true and non-defective cognition? Nyāya might try to reduce it to inference (e.g., from the absence of pot-perception where conditions are fit), but Mīmāṃsā argues that it is a distinct mode. The criterion does not clearly decide because both schools agree that the cognition is true and non-defective. The dispute is about the instrument's distinctness. Thus, the criterion does not adjudicate; it only requires that a pramāṇa be an instrument for such cognitions, but it doesn't tell us when an instrument is distinct.

  Third, the issue of convergence is critical. Nyāya allows that the same cognition (e.g., fire on the hill) can be known by different pramāṇas (perception when near, inference when seeing smoke). But if multiple pramāṇas can yield the same cognition, then the criterion does not uniquely determine which pramāṇa is at work in a given case. This creates ambiguity: for a true cognition, there might be multiple candidate instruments. How do we decide which one is the actual pramāṇa? Nyāya might say that the actual instrument is the one that caused the cognition. But then, in the case of face recognition, if both perception and memory are involved, which one is the pramāṇa? The criterion does not help. This ambiguity undermines the criterion's role in generating the list. If, on the other hand, we require that each pramāṇa has an exclusive domain, then we avoid overlap but face the problem of how to account for cognitions that seem to fall under multiple pramāṇas. The Nyāya school does not consistently hold either position, which further shows that the criterion is not driving the list.

  In conclusion, the Nyāya criterion for a pramāṇa is too vague to generate the list independently. It does not resolve hard cases, it fails to provide a robust defense against rival enumerations, and it is undermined by the problem of convergence. The list of four pramāṇas seems to be fixed in advance, and the criterion is used post hoc to justify it. Therefore, the criterion does not do real work.

  Marking Scheme (out of 20 marks):

  The essay will be marked based on five must-hit points (each worth up to 4 marks). The marks for each point are allocated as follows:

  1. **Application to hard cases (4 marks):** 
     - A: Applies the criterion to at least three hard cases (memory, doubt, dream, or face recognition) and explains whether they would be included/excluded by the criterion, and notes the discrepancy with Nyāya's list (if any). 
     - B: Only addresses one or two cases, or does not explain the discrepancy. 
     - Typical error: Merely lists the Nyāya position without critical analysis.

  2. **Comparison with rival enumerations (4 marks):** 
     - A: Discusses at least three rival enumerations (Cārvāka, Buddhist, Mīmāṃsā) and evaluates how the criterion helps (or fails) to defend the Nyāya list against each. 
     - B: Discusses only one or two rivals, or fails to evaluate the criterion's effectiveness. 
     - Typical error: Describes the rival lists without engaging with the criterion.

  3. **Convergence issue (4 marks):** 
     - A: Takes a clear position on whether distinct pramāṇas can converge on the same cognition and explains how this affects the application of the criterion. 
     - B: Mentions convergence but does not take a clear position or does not link it to the criterion. 
     - Typical error: Ignores the convergence issue entirely.

  4. **Overall position on the criterion (4 marks):** 
     - A: Clearly argues whether the criterion does real work or merely rationalizes, based on the above analysis. 
     - B: States a position without adequate support from the analysis. 
     - Typical error: Only describes the criterion without taking a critical stance.

  5. **Structure and clarity (4 marks):** 
     - A: Well-organized, clear, and concise; addresses all parts of the question. 
     - B: Disorganized or unclear in parts; misses one part of the question. 
     - Typical error: Unfocused digressions or failure to integrate the parts.

  Each point is marked out of 4 as follows: 
  - 4: Excellent (fully meets A description)
  - 3: Good (mostly meets A, but with minor gaps)
  - 2: Satisfactory (meets B description)
  - 1: Poor (attempted but inadequate)
  - 0: Not addressed
answer: |-
  ### Essay Question  
  **Critically evaluate the Nyāya criterion for identifying *pramāṇas*—that a *pramāṇa* is the instrument of a cognition that is *true* (yathārtha) and *arises without defect* (avyabhicāriṇi). Does this criterion actively generate the Nyāya list of four *pramāṇas* (perception, inference, analogy, and testimony), or does it merely rationalize a predetermined list? Test the criterion against three of the following cases: memory, doubt, dream cognition, and facial recognition. Then, assess how the criterion fares against rival enumerations: the Cārvāka’s single *pramāṇa* (perception), the Buddhist’s two (perception and inference), and the Mīmāṃsā’s six (adding arthāpatti and anupalabdhi). Finally, resolve whether distinct *pramāṇas* can converge on the same cognition (e.g., knowing fire is present via both perception and inference) or must each have an exclusive domain. Defend your stance on whether the criterion does substantive work.**

  ---

  ### Model Answer (Approx. 700 words)  
  The Nyāya school’s criterion for a *pramāṇa*—an instrument yielding true, defect-free cognition—appears rigorous, promising to objectively justify its fourfold list. Yet, when pressed, the criterion proves insufficiently generative, functioning more as a *post hoc* rationalization for a fixed list than a robust epistemological tool. This is evident from its inconsistent handling of hard cases, inability to decisively counter rival enumerations, and unresolved tensions around cognitive convergence.  

  **1. The Criterion Fails to Resolve Hard Cases**  
  Applied to ambiguous cognitive states, the Nyāya criterion either overextends or arbitrarily excludes cases, revealing its ad hoc nature. Consider:  
  - **Memory (smṛti)**: A recollection (e.g., "I ate rice yesterday") can be *true* and *defect-free* if the original experience was veridical. Yet Nyāya excludes memory, arguing it "re-presents" prior cognition without *new* justification. The criterion itself, however, lacks any "newness" requirement—exclusion relies on a *predefined* commitment to originality, not the criterion.  
  - **Facial Recognition (pratyabhijñā)**: Recognizing a friend’s face involves perception (sensory input) and memory (stored identity). The cognition is *true* (if correct) and *defect-free* (if undistorted), yet it straddles multiple *pramāṇas*. Nyāya often forces such cases into perception, but the criterion alone cannot justify this reduction without appealing to tradition.  
  - **Dream Cognition (svapna-jñāna)**: Some dreams (e.g., prophetic ones) might coincidentally be true and arise without *obvious* defects. Nyāya dismisses dreams as defective due to their origin in subliminal impressions (vāsanā), but the criterion does not inherently address causal history—again, exclusion depends on extrinsic doctrinal assumptions.  
  These cases show the criterion is underdetermining: it permits multiple interpretations, forcing Nyāya to import external principles to exclude "undesirable" cases.  

  **2. The Criterion Cannot Defend Against Rival Enumerations**  
  The criterion’s vagueness prevents it from settling debates with rival schools:  
  - **Against Cārvāka**: The materialist’s single *pramāṇa* (perception) rejects inference as defect-prone. Nyāya retorts that inference meets the criterion when formal conditions (e.g., a valid hetu) are satisfied. Yet Cārvāka can equally invoke the criterion to *exclude* inference by citing pervasive defects (e.g., false inferences from smoke without fire). The criterion lacks internal resources to prove inference’s reliability, relying instead on auxiliary Nyāya metaphysics.  
  - **Against Buddhists**: Buddhists reduce Nyāya’s analogy and testimony to perception/inference. Testimony (śabda), for example, is deemed inferential (based on speaker reliability). Nyāya insists testimony yields *direct* cognition of meaning, satisfying the criterion. But the Buddhist counters that such cognition is *inferential* (reliability-based), making testimony redundant. The criterion cannot resolve this—it does not specify *how* to individuate instruments, leaving the dispute circular.  
  - **Against Mīmāṃsā**: Mīmāṃsā’s additions—arthāpatti (presumption, e.g., inferring "Devadatta is outside" from his absence inside) and anupalabdhi (non-apprehension, e.g., knowing a pot’s absence)—are rejected by Nyāya as reducible to inference. Mīmāṃsā argues these yield *sui generis* true cognitions (e.g., absence is directly apprehended). The criterion cannot adjudicate: both schools agree the cognitions are true and defect-free but disagree on instrument distinctness. Nyāya’s reductionism again reflects prior commitments, not the criterion’s guidance.  

  **3. Convergence Undermines the Criterion’s Generative Role**  
  The criterion collapses if distinct *pramāṇas* can converge on identical cognitions (e.g., knowing fire on a hill via perception *or* inference). Nyāya permits this (e.g., *Nyāyasūtra* 2.1.8), but convergence exposes the criterion’s passivity: if multiple instruments produce the same true cognition, how does the criterion uniquely identify *which* instrument is operative? For instance, facial recognition—arguably convergent—becomes arbitrarily assigned to perception. If *pramāṇas* must instead have exclusive domains (as Buddhists imply), Nyāya’s list risks overcounting. The criterion cannot resolve this tension because it lacks criteria for individuating instruments beyond the cognitions they produce.  

  **Conclusion: Criterion as Rationalization, Not Foundation**  
  The Nyāya criterion is theoretically elegant but pragmatically inert. It fails to generate the fourfold list, defaults to tradition in hard cases, and cannot refute rivals without doctrinal baggage. Its inadequacy stems from two gaps: (1) It does not define "defect" (doṣa) independently, allowing schools to interpret defects self-servingly; (2) It ignores causal and contextual factors in cognition (e.g., memory’s dependence). Thus, the criterion primarily *rationalizes* a list fixed by Nyāya’s broader metaphysical commitments. While useful for excluding obvious errors (e.g., doubt as non-truth-apt), it cannot actively sculpt a defensible epistemology. The Nyāya project would be strengthened by augmenting the criterion with conditions like causal independence or cognitive novelty—but as stands, it merely polices boundaries drawn in advance.  

  ---

  ### Marking Scheme (20 marks total)  
  Candidates must hit **five key points** (each worth 4 marks). Award marks as follows:  

  | **Must-Hit Point**                                                                                                | **A (4 marks)**                                                                                               | **B (2–3 marks)**                                                                                                | **Typical Error (0–1 mark)**                                                                                      |  
  |-------------------------------------------------------------------------------------------------------------------|---------------------------------------------------------------------------------------------------------------|------------------------------------------------------------------------------------------------------------------|-------------------------------------------------------------------------------------------------------------------|  
  | **1. Hard Cases Test** (e.g., memory, dream, recognition): Apply the criterion to 3 cases, noting discrepancies. | Accurately shows if criterion includes/excludes each case *and* identifies gaps vs. Nyāya’s actual position.  | Addresses 2–3 cases but lacks depth (e.g., no discrepancy noted) or misapplies criterion (e.g., calls memory a pramāṇa). | Lists Nyāya’s exclusions without testing the criterion (e.g., "Memory isn’t a pramāṇa because Nyāya says so").        |  
  | **2. Rival Lists Comparison**: Contrast criterion’s handling of Cārvāka, Buddhist, and Mīmāṃsā positions.         | Evaluates criterion against all 3 rivals, showing *why* it fails to resolve disputes (e.g., vagueness of "defect"). | Covers 1–2 rivals superficially (e.g., describes lists but no critique) or misses key objections (e.g., reducibility). | Describes rival enumerations without linking to the criterion’s weaknesses.                                        |  
  | **3. Convergence Debate**: Take a stance on whether pramāṇas can converge on one cognition.                       | Clear position with implications for criterion (e.g., convergence exposes underdetermination; exclusivity forces domain-splitting). | Position stated weakly (e.g., "maybe convergence is possible") without impact on criterion.                      | Ignores convergence or conflates it with pramāṇa combinations (e.g., "analogy uses perception").                    |  
  | **4. Criterion Assessment**: Argue if criterion "does work" or "rationalizes," using evidence from above.          | Thesis-driven (e.g., "rationalizes due to gaps in hard cases/rivals") with consistent support from analysis.   | Generic claim (e.g., "criterion is flawed") lacking evidence integration.                                        | Summarizes points without a position or claims the criterion "works" uncritically.                                  |  
  | **5. Structure & Clarity**: Organized, concise, addresses all question parts.                                     | Logically sequenced; covers hard cases, rivals, convergence, and assessment in 700 words.                    | Disjointed or wordy; omits one part (e.g., skips convergence or a rival).                                        | Unfocused; hard cases/rivals/convergence jumbled or incomplete.                                                   |  

  **Grade Boundaries**:  
  - **A (16–20)**: Hits all 5 points at A-level.  
  - **B (12–15)**: Hits 3–4 points at A-level or all at B-level.  
  - **C (8–11)**: Hits 2–3 points at B-level.  
  - **D (4–7)**: Addresses only 1–2 points superficially.  
  - **F (0–3)**: Fails to engage the criterion or question.  

  ---  
  **Note to Instructor**: This question pushes students to move beyond rote definitions and interrogate Nyāya’s epistemological foundations. Strong answers will expose tensions in the criterion while engaging primary sources (e.g., *Nyāyasūtra* on convergence). Weak answers often default to cataloguing *pramāṇas* without critique or misapply the criterion (e.g., treating "defect" as self-evident). The marking scheme rewards analysis over narration.
