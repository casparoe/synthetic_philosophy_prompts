    "pattern": "Evidential Trilemma (flawed inference, untestable counterfactual, pragmatic compromise)",
    "diagnosis": "The evidence proves Priya's review prevents errors but cannot confirm Marcus's intrinsic quality. Nadia's missed deadlines during server failures do not prove unreliability.",
    "why_the_inference_breaks": "Priya's review confounds the causal link between Marcus's actions and the flawless deliverables, making his intrinsic quality unobservable.",
    "recommendation": "Use Marcus with Priya's review for the current project. Within 2 months, test partial review reduction with Marcus's knowledge. Audit Nadia's deadlines without infrastructure issues.",
