answer: |-
  ### Exam Question: Risk-Weighted Expected Utility (20 marks)

  Consider a lottery \(L\) with three outcomes:  
  - £0 with probability \(0.5\)  
  - £100 with probability \(0.4\)  
  - £400 with probability \(0.1\)  

  Assume a linear utility function \(u(x) = x\).  

  **(a)**  
  (i) Calculate the **expected utility (EU)** of \(L\). (4 marks)  
  (ii) Calculate the **risk-weighted expected utility (REU)** of \(L\) using the risk function \(r(p) = p^2\). (6 marks)  

  **(b)** Calculate the **REU** of \(L\) using the risk function \(r(p) = \sqrt{p}\). (6 marks)  

  **(c)**  
  (i) Explain why REU applies the risk function to **cumulative probabilities** (ordered from worst to best outcome), rather than directly to each outcome's probability. (2 marks)  
  (ii) Using your results from (a)(ii) and (b), explain what the contrast between \(r(p) = p^2\) and \(r(p) = \sqrt{p}\) reveals about whether REU models risk aversion, outcome pessimism, or another concept. (2 marks)  
  (iii) A student claims: "REU is identical to expected utility with a concave utility function." Test this claim using your calculations in (a) and (b). (2 marks)  

  ---

  ### Model Answer (Approx. 600 words)

  **Part (a)(i): EU Calculation**  
  The expected utility sums the utility of each outcome weighted by its probability:  
  \[
  \text{EU} = (0.5 \times u(0)) + (0.4 \times u(100)) + (0.1 \times u(400)) = (0.5 \times 0) + (0.4 \times 100) + (0.1 \times 400) = 0 + 40 + 40 = 80.
  \]  
  Thus, \(\text{EU} = 80\).  

  **Part (a)(ii): REU with \(r(p) = p^2\)**  
  REU orders outcomes from worst to best (£0, £100, £400) and transforms cumulative probabilities with \(r(p)\). The cumulative probabilities are:  
  - \(P(\text{outcome} \leq £0) = 0.5\)  
  - \(P(\text{outcome} \leq £100) = 0.5 + 0.4 = 0.9\)  
  - \(P(\text{outcome} \leq £400) = 1.0\)  

  Apply \(r(p) = p^2\):  
  - \(r(0.5) = 0.25\)  
  - \(r(0.9) = 0.81\)  
  - \(r(1.0) = 1.0\)  
  - (Assume \(r(0) = 0\))  

  REU weights are differences in transformed cumulative probabilities:  
  - Weight for £0: \(r(0.5) - r(0) = 0.25 - 0 = 0.25\)  
  - Weight for £100: \(r(0.9) - r(0.5) = 0.81 - 0.25 = 0.56\)  
  - Weight for £400: \(r(1.0) - r(0.9) = 1.0 - 0.81 = 0.19\)  

  REU is the utility-weighted sum:  
  \[
  \text{REU} = (0 \times 0.25) + (100 \times 0.56) + (400 \times 0.19) = 0 + 56 + 76 = 132.
  \]  
  Thus, \(\text{REU} = 132\).  

  **Part (b): REU with \(r(p) = \sqrt{p}\)**  
  Using the same cumulative probabilities and \(r(p) = \sqrt{p}\):  
  - \(r(0.5) = \sqrt{0.5} \approx 0.707\)  
  - \(r(0.9) = \sqrt{0.9} \approx 0.949\)  
  - \(r(1.0) = 1.0\)  

  Weights:  
  - Weight for £0: \(0.707 - 0 = 0.707\)  
  - Weight for £100: \(0.949 - 0.707 = 0.242\)  
  - Weight for £400: \(1.0 - 0.949 = 0.051\)  

  REU calculation:  
  \[
  \text{REU} = (0 \times 0.707) + (100 \times 0.242) + (400 \times 0.051) = 0 + 24.2 + 20.4 = 44.6.
  \]  
  Thus, \(\text{REU} \approx 44.6\).  

  **Part (c)(i): Why Cumulative Probabilities?**  
  REU applies the risk function to cumulative probabilities (from worst to best) to model **global risk attitudes** toward the entire lottery structure. This captures how an agent weights improvements from bad to good outcomes based on their position in the cumulative distribution. Applying \(r(p)\) directly to individual probabilities would only distort local outcome weights and fail to explain phenomena like the Allais paradox, where risk attitudes depend on outcome rankings and cumulative chance.  

  **Part (c)(ii): Contrast and Interpretation**  
  - With \(r(p) = p^2\) (convex), REU = 132 > EU (80), indicating **risk-seeking** behavior.  
  - With \(r(p) = \sqrt{p}\) (concave), REU ≈ 44.6 < EU (80), indicating **risk aversion**.  
  The contrast shows REU models **risk attitude** (via \(r(p)\)’s shape), not outcome pessimism. Pessimism would always lower utility, but \(r(p) = p^2\) raises it by overweighting the best outcomes’ cumulative probabilities.  

  **Part (c)(iii): Testing "REU = EU with Concave Utility"**  
  The claim is false. REU produces **both risk-averse and risk-seeking evaluations** with linear \(u(x)\), while EU with concave utility **only models risk aversion**:  
  - In (a)(ii), REU = 132 > EU (risk-seeking) cannot arise from concave utility in EU, which always gives EU ≤ expected value.  
  - In (b), REU ≈ 44.6 < EU mirrors risk aversion from concave utility, but is achieved via \(r(p)\), not \(u(x)\).  
  Thus, REU’s flexibility depends on \(r(p)\), not utility curvature.  

  ---

  ### Marking Scheme (20 marks total)

  | **Part**              | **Marks** | **Must-Hit Points**                                                                 | **Typical Miss**                                                                 |
  |-----------------------|-----------|-------------------------------------------------------------------------------------|----------------------------------------------------------------------------------|
  | **a(i): EU**          | 4         | Correct EU formula and arithmetic (EU=80).                                          | Arithmetic errors (e.g., 0.5×100=50).                                            |
  | **a(ii): REU \(p^2\)**| 6         | Correct cumulative probs (0.5,0.9,1.0); correct \(r(p)\); weights (0.25,0.56,0.19); REU=132. | Misordering outcomes; applying \(r(p)\) to individual probs; weight errors. |
  | **b: REU \(\sqrt{p}\)**| 6         | Correct \(r(p)\) values (\(\approx\)0.707,0.949); weights (\(\approx\)0.707,0.242,0.051); REU≈44.6. | Cumulative prob errors; incorrect \(\sqrt{p}\) calc; no approx. accepted. |
  | **c(i): Cumulative**  | 2         | Explains cumulative probs model global risk (not local outcome distortions).        | Vague (e.g., “it’s the rule”); confuses with decumulative.                       |
  | **c(ii): Contrast**   | 2         | Identifies REU>EU as risk-seeking (convex \(r\)) and REU<EU as risk-averse (concave \(r\)). | Misses risk attitude; mislabels as pessimism.                             |
  | **c(iii): Test Claim**| 2         | Notes REU can be risk-seeking (impossible with concave utility in EU).              | Only cites part (b); ignores risk-seeking in (a)(ii).                           |

  ### Clarification on Your Request
  This question is **not** a recite-fest:  
  - Parts (a) and (b) require **calculations** with novel risk functions.  
  - Part (c) forces **conceptual synthesis** of risk attitudes and debunks a common misconception via computed results.  
  - The math ensures students cannot rely on memorized Allais examples.  

  **REU formula**: Your setup is correct. REU uses cumulative probabilities from worst to best (Buchak’s standard model). No issues.
