  We are building an exam question on Risk-Weighted Expected Utility (REU) for a three-outcome lottery. The lottery has outcomes: £0 with probability 0.5, £100 with probability 0.4, and £400 with probability 0.1. The utility function is u(x) = x (linear utility). We are to use two risk functions: r(p) = p^2 for part (a) and r(p) = sqrt(p) for part (b). Part (c) is conceptual.

  First, recall the REU formula. REU orders outcomes from worst to best. Then, it uses a risk function r applied to cumulative probabilities (or sometimes decumulative, depending on the formulation). The typical formulation for REU when outcomes are ordered from worst to best (x1 < x2 < ... < xn) is:

  REU(L) = u(x1) + Σ_{i=2}^{n} [u(xi) - u(x_{i-1})] * r(Σ_{j=i}^{n} p_j)

  Alternatively, it can be written using decumulative probabilities (the probability of getting at least xi). But note: in the formulation above, we are using the cumulative probability from the best (i.e., the probability of getting at least xi) and then applying the risk function to that.

  However, there is another common formulation that uses the cumulative distribution from the worst. We must be consistent. The standard in REU (as per Buchak) is to order outcomes from worst to best and then use decumulative probabilities (the probability of getting at least the current outcome or better). But note: the risk function r is applied to the cumulative probability of receiving an outcome at least as good as the current one? Actually, let's clarify:

  Buchak's REU is defined as:
  REU = Σ_{i=1}^{n} u(x_i) * [r(Σ_{j=1}^{i} p_j) - r(Σ_{j=1}^{i-1} p_j)]

  But note: this formula orders outcomes from worst (i=1) to best (i=n). The term r(Σ_{j=1}^{i} p_j) is the risk function applied to the cumulative probability of getting an outcome ranked i or worse (i.e., the worst i outcomes). Alternatively, we can think of it as the risk applied to the cumulative distribution function (CDF) at each outcome.

  However, there is also a formulation that uses the decumulative distribution function (tail probabilities). We must be careful. I believe the above formula (with cumulative from worst) is standard.

  But note: in the Allais paradox and similar, REU is often presented by ordering from best to worst? Actually, the formula above (from worst to best) is standard.

  Let me define our outcomes:

  x1 = 0, p1 = 0.5
  x2 = 100, p2 = 0.4
  x3 = 400, p3 = 0.1

  Ordered from worst to best: 0, 100, 400.

  We compute the cumulative probabilities:

  For i=1 (worst outcome: 0): cumulative probability is p1 = 0.5. Then the weight for x1 is r(0.5) - r(0) [assuming r(0)=0].

  For i=2 (next: 100): cumulative probability is p1+p2 = 0.9. Weight: r(0.9) - r(0.5)

  For i=3 (best: 400): cumulative probability is p1+p2+p3=1. Weight: r(1) - r(0.9)

  So the REU is:
  u(0)*[r(0.5)-r(0)] + u(100)*[r(0.9)-r(0.5)] + u(400)*[r(1)-r(0.9)]

  We assume r(0)=0 and r(1)=1.

  So for part (a): r(p)=p^2
  Part (b): r(p)=sqrt(p)

  Additionally, part (a) and (b) require computing expected utility (EU) as well.

  EU = 0.5*u(0) + 0.4*u(100) + 0.1*u(400) = 0.5*0 + 0.4*100 + 0.1*400 = 0 + 40 + 40 = 80.

  Now, let's write the exam question.

  ---

  **Exam Question**

  **Question 5: Risk-Weighted Expected Utility (20 marks)**

  Consider a lottery L with three possible outcomes: £0 with probability 0.5, £100 with probability 0.4, and £400 with probability 0.1. Assume a linear utility function u(x) = x.

  (a) (i) Compute the expected utility (EU) of lottery L. (4 marks)
     (ii) Compute the risk-weighted expected utility (REU) of lottery L using the risk function r(p) = p^2. (6 marks)

  (b) Compute the REU of lottery L using the risk function r(p) = √p (the square root of p). (6 marks)

  (c) (i) Explain why REU applies the risk function to cumulative probabilities (starting from the worst outcome and accumulating towards the best) rather than applying it directly to each outcome's probability. (2 marks)
     (ii) Compare the REU values computed in parts (a)(ii) and (b). What does the contrast between these two REU calculations (using r(p)=p^2 and r(p)=√p) reveal about whether REU models risk aversion, outcome pessimism, or something else? (2 marks)
     (iii) A student claims that REU is equivalent to expected utility with a concave utility function. How do your calculations in (a) and (b) help test this claim? (2 marks)
     (Total for part (c): 6 marks)

  ---

  **Model Answer**

  **Part (a)(i):**  
  Expected Utility (EU) = (0.5 * u(0)) + (0.4 * u(100)) + (0.1 * u(400))  
  = (0.5 * 0) + (0.4 * 100) + (0.1 * 400)  
  = 0 + 40 + 40  
  = 80.

  **Part (a)(ii):**  
  We order the outcomes from worst to best: £0 (p=0.5), £100 (p=0.4), £400 (p=0.1).  
  The REU formula with risk function r(p) = p^2 is:  
  REU = u(0) * [r(0.5) - r(0)] + u(100) * [r(0.9) - r(0.5)] + u(400) * [r(1) - r(0.9)]  

  We compute:  
  r(0) = 0^2 = 0  
  r(0.5) = (0.5)^2 = 0.25  
  r(0.9) = (0.9)^2 = 0.81  
  r(1) = 1^2 = 1  

  So:  
  REU = 0 * [0.25 - 0] + 100 * [0.81 - 0.25] + 400 * [1 - 0.81]  
  = 0 + 100 * 0.56 + 400 * 0.19  
  = 56 + 76  
  = 132.

  **Part (b):**  
  Using r(p) = √p:  
  r(0) = √0 = 0  
  r(0.5) = √0.5 ≈ 0.7071  
  r(0.9) = √0.9 ≈ 0.9487  
  r(1) = √1 = 1  

  REU = u(0) * [r(0.5) - r(0)] + u(100) * [r(0.9) - r(0.5)] + u(400) * [r(1) - r(0.9)]  
  = 0 * [0.7071 - 0] + 100 * [0.9487 - 0.7071] + 400 * [1 - 0.9487]  
  = 0 + 100 * 0.2416 + 400 * 0.0513  
  ≈ 24.16 + 20.52  
  = 44.68.

  **Part (c):**  
  (i) REU applies the risk function to cumulative probabilities (from the worst outcome up) because it aims to model the agent's attitude towards risk by weighting improvements in outcome (from worst to better) based on the cumulative probability of receiving at least that outcome's level of badness. However, note that the standard REU formula as per Buchak uses the cumulative distribution from the worst to the current outcome. The key is that the risk function transforms the cumulative probabilities to reflect how the agent weights the possibility of getting a worse outcome versus a better one. Applying the risk function to the cumulative probabilities (rather than to individual probabilities) allows REU to capture the structure of risk in the entire lottery, particularly the agent's sensitivity to the dispersion of outcomes and their ordering. This is essential for explaining phenomena like the Allais paradox, where the certainty effect and the way outcomes are grouped matter.

  (ii) In part (a)(ii) with r(p)=p^2 (a convex function), we got REU=132, which is higher than the EU (80). In part (b) with r(p)=√p (a concave function), we got REU≈44.68, which is lower than EU. The convex risk function r(p)=p^2 assigns higher weights to improvements in outcome when the cumulative probability is low (i.e., for the worst outcomes) and lower weights for the best outcomes. This leads to a higher REU because the bad outcomes (with high cumulative probability) are down-weighted and the good outcomes (with low cumulative probability) are up-weighted. Conversely, the concave risk function r(p)=√p does the opposite: it assigns lower weights to improvements in outcome for the worst outcomes (which have high cumulative probability) and higher weights to the best outcomes (which have low cumulative probability). However, note that the way the weights are constructed, a convex r (like p^2) actually leads to a higher overall evaluation because the agent is more optimistic (risk-seeking) and a concave r (like sqrt) leads to a lower evaluation (risk-averse). Therefore, the contrast shows that REU can model both risk-seeking and risk-averse behavior depending on the shape of the risk function. It is not merely about outcome pessimism (which would always lower the evaluation) but about the agent's attitude towards the cumulative risk profile.

  (iii) The student's claim that REU is equivalent to expected utility with a concave utility function is challenged by our calculations. In EU, a concave utility function would yield a certainty equivalent less than the expected value (here 80) for a risk-averse agent. However, in REU, we see that the risk attitude is captured by the risk function, and we used a linear utility. In part (a)(ii), with a convex risk function, we got an REU (132) that is higher than the EU (80), which is risk-seeking behavior. This cannot be replicated by a concave utility function in EU, because a concave utility would always give an EU less than or equal to the expected value (if the utility is linear, then it's 80; if concave, less). Similarly, the risk-averse REU in part (b) (44.68) is achieved with linear utility and a concave risk function. Therefore, REU can produce both risk-averse and risk-seeking evaluations without changing the utility function, which shows it is not equivalent to EU with a concave utility.

  ---

