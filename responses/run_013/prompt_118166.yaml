  - Correct application of r(p)=p^2: 1 mark (r(0.5)=0.25, r(0.9)=0.81, r(1)=1)
  - Correct weights: 1 mark (0.25, 0.56, 0.19)
  - Correct REU calculation: 2 marks (132)

  **Part (b): REU with r(p)=sqrt(p) (6 marks)**
  - Correct r values: 1 mark (r(0)=0, r(0.5)=√0.5≈0.707, r(0.9)=√0.9≈0.9487, r(1)=1) [allow rounding to 0.707, 0.949, etc.]
  - Correct weights: 1 mark (0.707, then 0.9487-0.707≈0.2417, 1-0.9487≈0.0513)
  - Correct REU calculation: 2 marks (approx 44.68) [if they use exact: 100*(√0.9 - √0.5) + 400*(1-√0.9) = ...]
  - Structure: 2 marks for showing the formula and steps.

  **Part (c): Conceptual (6 marks)**
  - (i) Why cumulative? (2 marks): Must explain that it captures the structure of risk by weighting improvements based on the cumulative distribution (from worst to best) and allows modeling attitudes to risk in the entire lottery. Typical miss: Students say it's arbitrary or just a formula without understanding the conceptual reason (capturing the agent's perspective on the cumulative risk profile).
  - (ii) Contrast between (a) and (b) (2 marks): Must note that r(p)=p^2 (convex) leads to higher REU (risk-seeking) and r(p)=sqrt(p) (concave) leads to lower REU (risk-averse), showing REU models risk attitudes via the risk function shape. Typical miss: They just report the numbers without interpreting the risk attitudes.
  - (iii) Testing the claim (2 marks): Must argue that REU with linear utility and a risk function can produce both risk-averse and risk-seeking behavior, which cannot be achieved in EU with a concave utility (which only does risk-averse). Typical miss: They state that the utility is linear without contrasting the results.

  **Must-hit points (with marks and typical misses):**

  1. **EU calculation correct (4 marks):** Must get 80. Typical miss: Miscounting probabilities or arithmetic error.
  2. **REU formula applied correctly in both (a)(ii) and (b) (6+6=12 marks):** Correct ordering, cumulative probabilities, risk function application, and arithmetic. Typical miss: Wrong cumulative probabilities (e.g., not adding in order) or misapplying the risk function to individual probabilities instead of cumulative.
  3. **Explanation of why cumulative probabilities (2 marks):** Must connect to the modeling of risk attitudes over the entire distribution. Typical miss: Vague or incorrect explanation (e.g., "because it's the formula").
  4. **Contrast between (a) and (b) (2 marks):** Must note that with convex r (p^2) we get risk-seeking and with concave r (sqrt) we get risk-averse. Typical miss: Saying one is higher than the other without mentioning risk attitudes.
  5. **Refuting the claim that REU is EU with concave utility (2 marks):** Must note that REU with linear utility and different risk functions can produce both risk-averse and risk-seeking behavior, while concave utility in EU only produces risk-averse. Typical miss: Only saying that the utility is linear without addressing the risk-seeking case.

  **Total: 20 marks**

  **Note:** The model answer is approximately 600 words.

  **Clarification:** The REU formula we used is the standard one from Buchak (2013) and others. The cumulative probabilities are built from the worst outcome to the best. The risk function is applied to the cumulative probabilities of the worst outcomes (the CDF) and then the weights are the differences in the transformed cumulative probabilities. This is the standard method.

