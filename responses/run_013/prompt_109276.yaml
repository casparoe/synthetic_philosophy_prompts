answer: |-
  ### 1. The Question (130 words)
  **Critically evaluate the claim that Hume's Law (the prohibition on deriving 'ought' from 'is') is decisively refuted by logical counterexamples like Searle's promise derivation or Prior's disjunctive propositions. Your essay must:**

  *   **(a)** Precisely identify the **key inferential step** (e.g., a specific premise, rule, or assumption) that allows each counterexample (Searle, Prior) to *appear* to derive an 'ought' from descriptive premises. Explain whether the resulting 'ought' is **substantive** (e.g., action-guiding) or merely **formal/logical**.
  *   **(b)** Articulate the **strongest plausible surviving version of Hume's Law** in light of these counterexamples. Is this version substantive (a significant constraint on moral reasoning) or trivial? Justify your answer.
  *   **(c)** Explain clearly and distinctly why Moore's "naturalistic fallacy" argument against defining 'good' in natural terms **is not equivalent to** Hume's is-ought gap, despite common conflation. What core problem does each target?

  ### 2. Model Answer (710 words)

  The claim that Hume's Law is decisively refuted by logical counterexamples like Searle's promise derivation or Prior's disjunctive propositions is overstated. While these examples demonstrate that *certain* 'ought'-statements *can* be derived from descriptive premises under specific conditions, they do not refute a carefully formulated Hume's Law that captures its core substantive insight. Crucially, they also highlight the distinction between Moore's naturalistic fallacy and Hume's gap.

  **(a) Counterexamples: Mechanism and Substance**
  *   **Searle's Promise Derivation:** Searle seemingly derives "Jones ought to pay Smith five dollars" from descriptive premises like "Jones uttered the words 'I hereby promise to pay you, Smith, five dollars'" and institutional facts about promising. The **key inferential step** is the application of a **constitutive rule**: "If one utters phrase P under conditions C, one thereby undertakes an obligation O." This rule bridges the descriptive (uttering words) and the normative (obligation). However, this derivation **depends critically** on the *prior existence* of the normative institution of promising and its rules. The resulting 'ought' is **substantive** (it genuinely prescribes action for Jones), but its derivation *assumes* a background normative framework ("one ought to keep promises"). It does not derive normativity *ex nihilo* from purely non-normative facts; it unpacks the normative consequences *within* an already accepted normative context.
  *   **Prior's Disjunction (e.g., "Tea-drinking is common in England; therefore, either tea-drinking is common in England or all New Zealanders ought to be shot"):** This derivation relies purely on the **logical rule of Disjunction Introduction** (if P is true, then P ∨ Q is true, for any Q). The 'ought' appears in the conclusion only as part of a disjunct. The **key point** is that the 'ought' in Q is **completely ungrounded** by the premise. The conclusion is a logical truth *if* the premise is true, but the normative component (shooting New Zealanders) plays no role in the inference's validity and receives no support from the premise. The resulting 'ought' is **purely formal/logical and vacuous**. It is not a substantive moral prescription; it's a trivial consequence of logic that allows *any* statement, normative or not, to be tacked on disjunctively to a true descriptive statement.

  **(b) The Strongest Surviving Hume's Law**
  The strongest surviving version of Hume's Law, resilient against these counterexamples, is **modal and epistemological**: **One cannot *non-trivially* derive a *substantive, action-guiding* 'ought'-conclusion (or any genuinely new normative truth) from a set of *purely descriptive, non-normative* premises *without* relying either on (1) logical rules that introduce vacuous normativity (like disjunction introduction), or (2) implicit or explicit normative premises or assumptions embedded within the descriptive premises or the inference rules used.**

  *   **Substantive or Trivial?** This version is **substantive**. It captures the core challenge of moral justification: grounding genuinely prescriptive claims. Searle relies on type (2) – constitutive rules are normative assumptions. Prior relies on type (1) – vacuous introduction. Neither refutes the claim that deriving a *new, substantive* normative conclusion requires normative input. It highlights that normativity doesn't magically emerge *de novo* from pure description; it must be presupposed or arrive via logic in a trivial way. This imposes a significant constraint on attempts to *found* ethics purely on science or natural facts without smuggling in normativity.

  **(c) Distinguishing Moore's Naturalistic Fallacy from Hume's Gap**
  The conflation of Moore's naturalistic fallacy with Hume's is-ought gap is a significant error. They address fundamentally different problems:

  *   **Moore's Naturalistic Fallacy:** This is an argument **against defining the meaning of fundamental moral terms** (like 'good') **using purely naturalistic or descriptive properties** (like 'pleasure', 'desired', 'evolutionarily fit'). Moore's core claim is that any such definition is always **"open to question"** – one can coherently ask, "But is pleasure *really* good?" – suggesting 'good' refers to a distinct, simple, non-natural property that cannot be analyzed away into natural facts. The target is **semantic reductionism** (defining good as X) and **metaphysical naturalism** (good is identical to X).
  *   **Hume's Is-Ought Gap:** This is a claim about **logical inference and justification**. It concerns the **invalidity of inferring normative conclusions** (about what ought to be done or valued) **from premises that are purely descriptive** (about what *is* the case). Hume targets the *derivation* of normative claims, not the definition of terms. One could accept Hume's gap (no derivation of ought from is) while *rejecting* Moore (believing 'good' *is* definable as a natural property, but accepting you still can't *derive* an 'ought' from facts including that definition without further normative input).

  **Conclusion:** Logical counterexamples like Searle's and Prior's expose the *formal* limitations of simplistic statements of Hume's Law. However, they do not refute its core substantive insight: deriving genuinely new, substantive, action-guiding normativity from a foundation of purely non-normative facts remains impossible without normative presuppositions or trivial logical maneuvers. Searle relies on built-in normativity; Prior produces vacuous normativity. Moore's distinct argument about the indefinability of 'good' cautions against semantic reductions but does not directly address the inferential gap Hume identified. The strongest Hume's Law thus survives as a significant, non-trivial constraint on ethical naturalism and foundational moral reasoning.

  ### 3. Marking Scheme (Total: 20 points)

  **Must-Hit Moves (Core for B-range: 14-16/20 requires these):**
  1.  **(2 pts)** Correctly identifies Searle's key step: **Constitutive Rule / Institutional Fact** bridging description to obligation.
  2.  **(2 pts)** Correctly identifies Prior's key step: **Disjunction Introduction (or equivalent logical rule)** allowing vacuous addition.
  3.  **(2 pts)** Correctly assesses Searle's 'ought' as **substantive but dependent on normative background**.
  4.  **(2 pts)** Correctly assesses Prior's 'ought' as **formal/logical and vacuous**.
  5.  **(2 pts)** Formulates a **surviving Hume's Law** that is **modal/epistemological** (focusing on derivation/impossibility).
  6.  **(2 pts)** States the surviving Law **requires normative input** for substantive 'ought' OR **permits vacuous introduction**.
  7.  **(2 pts)** Explicitly judges the surviving Law as **substantive** (non-trivial constraint).
  8.  **(3 pts)** Clearly distinguishes Moore's target (**definition/semantics of 'good'**) from Hume's target (**inference/derivation of 'ought'**).
  9.  **(3 pts)** Correctly identifies Moore's core argument as the **Open Question Argument** (against semantic reduction).

  **Differentiating an A (17-19/20):** Must include all core moves *plus* demonstrate **clear integration**, showing:
  *   **(1 pt)** How *both* counterexamples fail to refute the *substantive core* of Hume's Law (Searle needs norms, Prior is vacuous).
  *   **(1 pt)** Why the surviving Law is *still* significant for ethical naturalism/foundational projects.

  **A+ Territory (20/20 + Bonus):** Requires A-level clarity and integration *plus* **one** of:
  *   **(Bonus 1)** Insight that Searle's derivation *exemplifies* the surviving Law: the 'ought' is derived *because* the constitutive rule *is* a normative premise.
  *   **(Bonus 2)** Nuance on Moore: Recognizing that while distinct from Hume's gap, Moore's non-naturalism *motivates* why one might think the gap exists (if 'good' is non-natural, how *could* it be derived from natural facts?).

  ### 4. Common Wrong Turns (Cost Marks Because)

  *   **Conflating Moore and Hume:** Treating the Naturalistic Fallacy *as* the Is-Ought Gap. (Fails to distinguish definition/semantics from inference/derivation, losing points on Move 8 & 9).
  *   **Misreading Counterexamples as Knockdown Refutations:** Claiming Searle/Prior simply show Hume was wrong "full stop". (Fails to analyze the mechanisms critically, losing points on Moves 1-4 & 6, and failing integration for A).
  *   **Vague Surviving Law:** Stating only "You can't get a *real* ought from is" without specifying *why* counterexamples fail or what "real" means. (Fails Moves 5, 6, 7; lacks precision).
  *   **Misjudging Substance:** Arguing Prior's disjunction yields a substantive 'ought' OR arguing Searle's 'ought' is purely formal. (Fundamentally misunderstands the examples, losing points on Moves 3 & 4).
