prompt: |-
  Ok so I'm an editor at a small religious publisher and I've been handed the worst job in the buiding: we're doing an annotated edition of the gospels where sayings that probably go back to Jesus get marked in a different colour, and every single saying gets a footnote saying how confident we are and on what grounds. There are about four hundred sayings in the running, I get maybe ten minutes per saying, and whatever I decide has to survive a review meeting with our historical consultant (a serious secular historian), a theologian from our own tradition, and the publisher, who is the one who actually signs off.

  I've read enough to know the standard toolbox — embarrassment, dissimilarity, multiple attestation, coherence, Semitic traces — and I've also read enough to know the toolbox is a mess. Dissimilarity looks self-defeating to me: if a saying is unlike both the Judaism of the time and the early church, who exactly was motivated to hang onto it? Embarassment has the same smell — the earliest Christians cheerfully preserved things that made them look bad (the crucifixion itself, Peter's denial, women as the first witnesses), so it doesn't seem to discriminate. Multiple attestation sounds like counting sources, but our sources probably share traditions, so I suspect it's usually double counting with extra steps. Coherence needs an authentic core to cohere with, which is the thing I'm trying to find. And the Aramaic argument cuts both ways — a translator can produce translation Greek, and a Greek author can write in a Septuagint-flavoured style on purpose. I also keep hearing that instead of asking whether a saying is weird enough, we should ask whether it's plausible in two directions at once: at home in a first-century Galilean Jewish setting, and at home in a movement that was carrying sayings forward and reworking them. That sounds right and I have no idea how to turn it into a test.

  So what I want from you is a procedure I can actually run: the questions in order, what counts as a good enough answer to each, what the output labels are and what each label is actually claiming (that these exact words are his? that something behind them is? that the saying is early even if it isn't his? that the story is early and the saying was added?), where the procedure stops with a flat no, and where it has to hand off to a human because the call is theological rather than historical. Build in the fact that the tradition was carried for decades inside communities that were reshaping it — I don't want a procedure that pretends we can peel the church off the top of the Jesus layer like a sticker. And put one step ahead of all the others: some of what's in the running may not even be in the earliest recoverable text, which is a different question from whether he said it, and I want the procedure to say so before it starts weighing historical evidence.

  Then run it on three cases: (1) the render-to-Caesar line, which everyone cites as multiply attested and which I think is really one source three times; (2) the let-the-dead-bury-their-own-dead saying, harsh and off-putting and serving nobody's agenda that I can see; (3) the story about the woman caught in adultery, which I'm told isn't in the earliest manuscripts of John at all — tell me what my procedure does with that one, and whether the answer it gives is a no or just a different question. Include at least one case where the procedure tells me something I won't want to hear, and be explicit about which steps are judgment calls dressed up as procedure — how much independent attestation is enough, what base rate we're implicitly assuming for how much of the tradition is authentic, how much weight plausibility gets versus oddity. Finish with what the procedure can't do. My suspicion is that these criteria can sort the tradition into rough bands and never settle who he was, and I'd rather you say that plainly than dress it up.
reasoning: |-
  Okay, let me tackle this step by step. The user is an editor at a religious publisher working on an annotated Gospels edition, needing a practical procedure to evaluate about 400 sayings of Jesus. They're familiar with standard historical criteria but find them flawed and want a systematic, transparent method that acknowledges the tradition's fluidity. 

  First, I need to address their core frustrations: the circularity of dissimilarity, the unreliability of embarrassment, source dependency in multiple attestation, and the chicken-and-egg problem of coherence. Their insight about "plausibility in two directions" (1st-century Jewish context + early transmission) is crucial but hard to operationalize. 

  I'll design a procedure that:
  1. Starts with text-critical verification to filter later additions
  2. Uses weighted criteria without pretending to mathematical precision
  3. Explicitly labels degrees of certainty (from verbatim authenticity to late creation)
  4. Flags where theological judgment supersedes historical analysis
  5. Builds in safeguards against overconfidence (e.g., requiring plausibility in both contexts)

  For the test cases:
  - Render-to-Caesar: Weak on multiple attestation (likely single source), but strong contextual plausibility
  - Let-the-dead-bury: High oddity but coherence with radical eschatology, strong Semitic traces
  - Adultery pericope: Fails at step one (textual instability)

  The procedure must be honest about its limitations:
  - Can't resolve authenticity debates conclusively
  - Can't reconstruct the "historical Jesus" beyond broad contours
  - Requires transparent judgment calls (e.g., what counts as "sufficient" attestation)
  - Must separate historical probability from theological significance

  I'll structure it as a flowchart with clear exit points and confidence tiers, emphasizing that the output is probabilistic bands—not binary rulings. The key is balancing academic rigor with practical usability under time constraints.
answer: |-
  Here’s a practical, step-by-step procedure designed for efficiency (10 minutes/saying) and transparency, with built-in limitations. It prioritizes **textual stability** first, then **transmission plausibility**, then **contextual coherence**, and finally **theological handoff**. Labels explicitly state claims to avoid overstatement.

  ---

  ### **Procedure: Evaluating Sayings for Annotation**
  **Output Labels:**  
  - **A1:** *High Confidence Authentic Core* (Plausible Jesus tradition, early and stable form)  
  - **A2:** *Probable Authentic Core* (Likely roots in Jesus tradition, but some development)  
  - **B:** *Early Tradition* (Uncertain origin, but predates major theological agendas)  
  - **C:** *Community Shaping* (Clear development or adaptation by early church)  
  - **D:** *Late or Textually Unstable* (Not in earliest recoverable text)  
  - **X:** *Theological Handoff Required* (Historical tools insufficient; tradition-specific judgment needed)  

  #### **Steps (Run in Order):**
  1. **Textual Stability Check**  
     - *Question:* Is this saying/text present in the **earliest reliable manuscripts** of this Gospel?  
     - *Sources:* NA28/UBS5 critical apparatus; Metzger’s *Textual Commentary*.  
     - *Exit Criteria:*  
       - If **NO** (e.g., absent in 𝔓⁷⁵, 𝔓⁶⁶, Sinaiticus, Vaticanus) → **D** (e.g., John 7:53–8:11).  
       - If **YES** → Proceed to Step 2.  

  2. **Independent Attestation (Weighted)**  
     - *Question:* Is the saying attested in **≥2 independent streams**?  
     - *Define streams:* Mark, Q (Matt/Luke parallels), M (Matt unique), L (Luke unique), John, Thomas, Paul/1 Clement (if verifiable oral tradition).  
     - *Judgment Call:*  
       - **Strong:** ≥2 early streams (e.g., Mark + Q; John + Thomas).  
       - **Weak:** Single stream, or likely literary dependence (e.g., Matt/Luke copying Mark).  
       - *Baseline Assumption:* ~30-40% of sayings may be authentic (Sanders/Meier consensus).  
     - *Exit Criteria:*  
       - **Strong** → Proceed to Step 3.  
       - **Weak** → Flag for "low attestation"; proceed to Step 3.  

  3. **Contextual Plausibility (Two-Way Test)**  
     - *Question 3a (1st-century Galilee):*  
       Could this emerge plausibly from a **Galilean Jewish context**?  
       - *Indicators:* Semitic syntax (e.g., *abba*, parallelism), Jewish legal/scriptural engagement, agrarian metaphors.  
     - *Question 3b (Transmission Viability):*  
       Could this be **preserved/reworked** by the early church?  
       - *Indicators:* Harshness ("embarrassment"), lack of clear post-Easter theology (e.g., no explicit atonement theory), coherence with movements (e.g., Baptist circles).  
     - *Judgment Call:*  
       - **High:** Strong 3a + Strong 3b (e.g., paradoxical, memorable, Jewish but challenging).  
       - **Medium:** Strong 3a OR 3b.  
       - **Low:** Fails both (e.g., anachronistic, serves clear late agenda).  
     - *Exit Criteria:*  
       - **High** → **A1** or **A2** (combine with Step 4).  
       - **Medium** → **A2** or **B**.  
       - **Low** → **C** or **X** (if theologically significant).  

  4. **Coherence/Oddity Balance**  
     - *Question:* Does this cohere with **high-confidence sayings** *while* being distinctive enough to avoid suspicion of invention?  
     - *Tools:*  
       - **Coherence:** Overlap with A1 sayings (e.g., kingdom focus, inclusivity, prophetic authority).  
       - **Oddity:** Non-conformity to Judaism/early church (e.g., "love enemies").  
     - *Judgment Call:* Reject **pure dissimilarity** — favor "bounded innovation" (plausibly radical *within* Judaism).  
     - *Output Adjustment:*  
       - High coherence + bounded oddity → **A1**.  
       - Moderate coherence + low oddity → **A2** or **B**.  

  5. **Theological Handoff**  
     - *Trigger:* If saying is central to doctrine (e.g., Eucharist words) but historically ambiguous → **X**.  
     - *Annotation Note:* "Traditionally attributed; historical certainty unreachable."  

  ---

  ### **Test Cases**
  #### **(1) Render to Caesar (Mark 12:17 // Matt 22:21 // Luke 20:25)**  
  - **Step 1:** Textually stable (all Synoptics).  
  - **Step 2:** **Weak attestation** — Only Mark (Matt/Luke copy Mark; no independent parallels).  
  - **Step 3a:** **High** (Jewish "image" debate; avoids Zealot/Herodian traps).  
  - **Step 3b:** **High** (Church preserved despite potential misuse to avoid taxes).  
  - **Step 4:** Coheres with Jesus’ political ambiguity; odd in prioritizing God/state duality.  
  - **Output:** **A2** (Probable core, but single source). *You’ll dislike this: "multiple attestation" is inflated.*  

  #### **(2) Let the Dead Bury Their Dead (Matt 8:22 // Luke 9:60)**  
  - **Step 1:** Stable (Q source).  
  - **Step 2:** **Strong** (Q = independent stream).  
  - **Step 3a:** **High** (Jewish burial piety *intensified*; echoes Elijah/Elisha calls).  
  - **Step 3b:** **High** (Harsh, impractical — church wouldn’t invent a saying discouraging discipleship).  
  - **Step 4:** Oddity extreme but bounded (kingdom urgency > Torah); coheres with "drop plow" sayings.  
  - **Output:** **A1** (High confidence). *The procedure validates your instinct.*  

  #### **(3) Woman Caught in Adultery (John 7:53–8:11)**  
  - **Step 1:** **NOT stable** — Absent in 𝔓⁶⁶, 𝔓⁷⁵, Sinaiticus, Vaticanus; first in 5th-century mss.  
  - **Output:** **D** (Late addition). *Stops at Step 1 — no historical Jesus evaluation.*  

  ---

  ### **What the Procedure Can’t Do**  
  1. **Prove authenticity** — Only assigns probability bands.  
  2. **Recover exact words** — Labels describe *core tradition*, not verbatim quotes.  
  3. **Override theology** — E.g., Resurrection accounts auto-handoff (**X**).  
  4. **Fix flawed baselines** — If your consultant assumes 10% authentic (vs. your 40%), results will clash.  
  5. **Resolve source dependence** — Q/M/L are hypotheses; "attestation" is interpretive.  

  ### **Key Judgment Calls**  
  - **Attestation Sufficiency:** ≥2 streams = "strong" (adjust if consultant rejects Q/Thomas).  
  - **Plausibility Weight:** 60% of total weight (Steps 3a/b combined > attestation).  
  - **Base Rate:** If >50% of sayings get A1/A2, you’re over-credulous; <20% hyper-skeptical.  

  ### **Final Output Philosophy**  
  This sorts tradition into **bands of probability**, not bins of "real/fake." It accepts that the Jesus we access is **mediated through communities** — the "authentic core" is what *survived because it resonated*, not what was vacuum-sealed. Annotations should emphasize: *"This saying likely reflects early tradition about Jesus"* (A1/A2), not *"Jesus said this."* The procedure’s value is **transparency**, not infallibility — your review meeting will still debate the gray areas, but now with mapped decision points.  

  > "We don’t peel the church off Jesus; we trace the fingerprints left on the cup."
