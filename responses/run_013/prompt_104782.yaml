  First, I need to unpack the user's explicit requirements. They want to categorize each convention into: coordination solutions, genuine courtesies, or moral imperatives. The speech should explain why visitors are bound even to non-moral conventions and end with a practical rule. The audience is mixed—returning students who might resent etiquette lectures and first-timers who are anxious. The talk must be 6-8 minutes and avoid academic jargon.

  The user's deeper needs might include reducing student anxiety by providing clear frameworks, preventing cultural friction that could affect program success, and fostering respectful integration without imposing judgment. The returning students don't want to be patronized, so the speech should acknowledge their experience while guiding first-timers. 

  For the three conventions: 
  1. Tram boarding is a coordination solution. It's about efficiency, not morality. The key is understanding the system rather than imposing queue norms.
  2. No tipping is a courtesy with emotional weight. Tipping could insult workers, so it's about avoiding harm to dignity. 
  3. Jaywalking is a moral issue because predictability affects safety. Not following could cause accidents.

  The closing rule needs to be actionable: "Watch, Wait, Wonder" encourages observation and inquiry without pressure to know everything immediately. It empowers students to learn contextually.

  Balancing the audience: Start with empathy, validate both groups' feelings. Use inclusive language like "we" to unite them. Highlight that cultural navigation is ongoing, even for returnees. 

  Avoiding social ontology: Keep it practical. Use vivid examples from their upcoming experience. The tram scenario illustrates coordination, tipping as emotional, jaywalking as safety-critical. 

  Timing: 6-8 minutes is tight. Structure: intro (1 min), framework (2 min), apply to each convention (1 min each), rule and closing (2 min). Use relatable language—no jargon. 

  Potential pitfalls: Returning students might feel talked down to. Solution: Explicitly mention their experience, frame this as refining understanding. First-timers' fear: Emphasize that mistakes are part of learning, locals are forgiving if intent is respectful. 

  Closing rule: "Watch, Wait, Wonder" is memorable and practical. It encourages humility and observation, reducing pressure to be perfect immediately. 

  Final check: Does this address all user points? Yes—categorizes each convention, explains why comply, practical rule, respects both audiences, stays non-academic. Tone is supportive, not dogmatic. Ending with "you've got this" boosts confidence.
answer: |-
  Here’s a 6-8 minute speech addressing your needs, balancing practicality with philosophical nuance while respecting both cohorts’ experiences:

  ---

  **Welcome. Look around.** Half of you know exactly what I’m about to talk about – you’ve navigated the awkwardness, the small wins, the moments where you *got* it. The other half might be wondering, "Am I going to accidentally offend someone before lunch?" Relax. This isn’t about memorizing rules. It’s about learning *how* to see them. Today, we talk about the invisible threads that weave daily life together in [City Name], and which ones we, as respectful visitors, should genuinely try to weave ourselves into.

  You’ll encounter countless little things done differently. Let’s focus on three you’ll face immediately: tram boarding, tipping, and jaywalking – or rather, the lack of queuing, the refusal of tips, and the *presence* of pedestrians crossing freely. To navigate these, we need a simple filter. Think of local conventions falling into three rough buckets:

  1.  **Coordination Solutions:** These are just *how things get done smoothly here*. They’re practical, like driving on the right or left. No inherent right or wrong, just efficiency. Ignoring them causes chaos, not moral outrage.
  2.  **Courtesies:** These tap into feelings – respect, dignity, shared understanding. Breaching them doesn't crash the system, but it can genuinely confuse, annoy, or even hurt someone’s feelings. They’re about emotional harmony.
  3.  **Moral Weight:** Here, someone *actually gets hurt* if the convention breaks down. It’s about tangible harm, fairness, or safety. These carry a stronger obligation.

  **So, where do our three examples land?**

  1.  **The Tram "Non-Queue":** This is primarily a **Coordination Solution.** That loose crowd, the driver's glance, the subtle deference – it’s how they efficiently load the tram without formal lines. *Why follow it?* Because pushing in or rigidly queueing disrupts the flow everyone expects. You become the obstacle. It’s not morally wrong to prefer a queue, but insisting on it here is like demanding everyone suddenly drive on the opposite side of the road – chaotic. Watch, blend into the flow, offer that unspoken deference when you see it offered. It’s about fitting the local rhythm.

  2.  **No Tipping:** This is firmly in **Courtesy** territory, edging towards **Moral Weight** in terms of impact. Here, tipping isn't just unnecessary; it subtly implies the worker *needs* charity because their employer doesn't pay them properly. It undermines the dignity of a system built on the understanding that service wages are sufficient. *Why follow it?* Because refusing a tip isn't rudeness; it's upholding their professional dignity. Slipping someone cash might make *you* feel polite, but it can genuinely confuse or insult *them*. Respect their system. A sincere "thank you" carries far more weight here than a bill.

  3.  **Pedestrians Crossing Against Signals (When Expected):** This lands squarely in **Moral Weight.** It might feel chaotic, but it’s a highly choreographed dance built on mutual expectation. Drivers *anticipate* pedestrians crossing on red in certain spots and adjust speed and position accordingly. They *depend* on it. If you, unfamiliar and hesitant, suddenly freeze on the curb when everyone else walks, or worse, dart out unpredictably where they *don't* expect it, you create a dangerous situation. Drivers can't adjust. *Why follow it?* Because safety – yours and others' – is directly involved. Not following the *local* pedestrian flow isn't just rude; it risks an accident. Observe the locals: when they cross steadily and predictably (even on red), follow suit. When they wait, you wait. It’s about predictable safety.

  **"But," you might ask, "if it's just coordination or courtesy, not a moral must, why should *I* be bound? I'm just passing through."** Fair question. Two reasons:
  *   **Respect:** You are a guest. Adopting local ways, especially those tied to efficiency or avoiding offense, is fundamental respect for your hosts and the community you're joining temporarily.
  *   **Harmony:** Your actions impact others. Disrupting coordination causes frustration. Breaching courtesies causes friction. Even without malicious intent, you become a source of annoyance or confusion. We aim to be mindful visitors, not unwitting nuisances.

  **So, what's the rule? How do you navigate this daily?**

  **Watch, Wait, Wonder.**

  1.  **WATCH:** Before you act, observe. How are the locals doing *this specific thing*? (Tram boarding? Crossing the street? Handling a cafe bill?) Don't assume you know.
  2.  **WAIT:** Give yourself a moment. Don't be the first to jump into the tram fray or cross the street. See the pattern emerge.
  3.  **WONDER:** Ask yourself: "What function does this serve? Coordination? Courtesy? Safety?" If unsure, err towards the locals. And if genuinely puzzled, *ask* politely – a local peer, your homestay, a program assistant. "How does this usually work?" is a great question.

  This isn't about perfection. You'll make mistakes. Locals know you're learning; most appreciate the effort. The returning students know this – they've navigated the stumbles. For the first-timers, embrace the learning. It’s the curiosity and respect behind your actions that matter most.

  Don't go with a rigid list of "do this, don't do that." Go with open eyes, a moment's patience, and the willingness to ask, "How does this dance work here?" Do that, and you’ll not only avoid major faux pas, you’ll truly start to see the city. You've got this. Now, go learn the steps.

  ---

  **Why this works:**

  1.  **Respects Both Audiences:** Acknowledges returning students' experience ("you know...", "returning students know this") without lecturing them. Validates first-timers' anxiety ("Relax," "embrace the learning").
  2.  **Clear Framework:** The "Coordination/Courtesy/Moral Weight" buckets are simple but conceptually robust enough for first-years.
  3.  **Applies the Framework:** Explicitly categorizes each convention and explains *why*.
  4.  **Addresses the "Why Comply?" Question:** Directly answers the philosophical "why should I?" for non-moral conventions (Respect, Harmony).
  5.  **Practical Rule:** "Watch, Wait, Wonder" is actionable, memorable, and applies universally. It empowers students to navigate *any* new convention.
  6.  **Avoids Dogmatism:** Uses "primarily," "firmly," "squarely" to show these are reasoned placements, not divine decrees. Phrases like "err towards the locals" and "mistakes happen" soften the message.
  7.  **Tone:** Supportive, pragmatic, and collaborative ("we," "let's focus"). Avoids rousing "do as the Romans do" in favor of thoughtful engagement.
  8.  **Timing:** Structured concisely; each section (intro, framework, 3 examples, why comply, rule, closing) can be delivered in roughly 1 minute.
  9.  **Avoids Jargon:** Uses plain language ("choreographed dance," "unwitting nuisances," "taps into feelings") instead of "social ontology" or "normative force."
  10. **Closing Focus:** Ends on empowerment ("You've got this") and the positive goal of truly seeing the city through understanding its rhythms.
