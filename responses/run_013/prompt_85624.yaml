prompt: |-
  I'm a journalist who writes about science and ideas, and I'm midway through a long piece about monuments -- statues, street names, the whole thing -- and I keep discovering that my own gut reactions don't add up to any one view. I'd like you to figure out what, if anything, I actually believe. Here are my verdicts, going on gut.

  Confederate generals in courthouse squares: get rid of them. Not a close call, and I don't buy the "it's history" line -- a museum is where history goes.

  The Colston statue in Bristol, the slave trader, when the crowd pulled it down and rolled it into the harbour: I was glad it went and I still am, but the fact that it was a mob and not a council bothers me. I want to say the outcome was right and the method was wrong, and I have a feeling that isn't a coherent thing to believe.

  Cecil Rhodes at Oriel: should come down. The awkward part is that his money funds scholarships that a lot of African students actually use. I don't think that saves him -- which is odd, because my usual instinct is to ask who benefits now.

  Here's where it gets messy. There's a street near me named after a man who was a full-on eugenicist, wrote pamphlets, the works. My verdict: leave it. Renaming a street is a paperwork nightmare, nobody thinks about who a street is named for, and the name has basically worn off into being just a location. But there's a park statue of the same guy, same crimes, and I want that gone. Opposite verdicts for the same person, and I can't tell you why, except that a statue feels like an active claim and a street name feels like a leftover.

  Two more that I think should come out differently even though they look identical. A merchant who's honored in my city specifically for his philanthropy, which was funded entirely by the slave trade -- that one should go, no question, because the thing we're celebrating is the thing that was built on it. But a nineteenth-century botanist with a statue, who also happened to own slaves, and whose plaque is about the ferns? I lean keep it, maybe with a second plaque. I know that's exactly the distinction everyone accuses everyone else of fudging.

  And then the cases that don't fit the frame at all: a war memorial that's about an event rather than a person -- do the same rules apply? A statue of a famous nonviolence hero who, as a young lawyer, wrote genuinely vile things about Africans (I think there was a campaign to pull his statue off a campus in Ghana). And a big bronze nude in a roundabout that isn't commemmorating anybody -- I assume the question doesn't even apply, but say why.

  Here's my half-formed theory, tell me if it's salvageable: a monument isn't a statement about the past, it's something we're doing now, every day we leave it standing. So the test isn't "was he bad" or "did people then think it was fine," it's "does keeping this up make us say something about ourselves that isn't true." Under that test I think I get Colston and the merchant and Rhodes right, but I think it forces me to give up the street name, and maybe the botanist too.

  So: is there a principle that gets all of these, or close? State it precisely, and tell me which of my verdicts each clause is doing the work for. If you have to overturn one of my calls, say which and why. And tell me what it predicts for two cases I haven't listed -- a statue of a man who did nothing wrong, but whose statue has been adopted as a rallying point by a group he'd have despised, and a monument to a public health campaign that turns out to have been built on experiments on people who couldn't consent. One last thing: should age matter at all? I don't think it should, but everyone I say that to looks at me funny.
reasoning: |-
  Okay, this journalist is wrestling with monument dilemmas and their gut reactions don't form a coherent view. They've listed various cases: Confederate statues, Colston, Rhodes, a eugenicist street name vs statue, a slave-trading philanthropist vs a botanist slave owner, plus edge cases like war memorials and problematic nonviolence heroes. Their half-formed theory is that monuments are about present-day statements rather than historical record.

  Hmm, their core tension seems to be between three things: the subject's moral worth, the monument's current function, and removal practicality. They're inconsistently applying these. For example, they excuse the botanist's slavery because the plaque ignores it, but reject the merchant whose philanthropy directly celebrates slave wealth. That suggests the key factor isn't just harm done, but whether the monument actively celebrates the harmful aspect.

  The street vs statue distinction is fascinating. They're right that a statue feels like ongoing endorsement while a street name is inert. That points to monument agency - how much active work the object does in public space. A plaque-laden statue demands attention; a street sign doesn't. Their "active claim vs leftover" intuition holds water.

  For edge cases: the war memorial's about collective sacrifice, not individual glorification, so different rules apply. The nonviolence hero's statue forces us to weigh legacy against private failings - does the monument celebrate the racism or the later redemption? The abstract nude isn't commemorative at all, so outside the framework.

  Their proposed theory has merit but needs tightening. Instead of "does keeping this up make us say something untrue about ourselves," try "does this monument currently honor values we reject through its stated purpose or public perception." That saves the botanist (honors botany, not slavery) but sinks the street name if people become aware of its namesake.

  Age shouldn't matter morally, but practically it does through the "worn-off" effect they noted. A 19th-century eugenicist's street name loses meaning; a 1940s one might still sting. But principle shouldn't bend to that - it just affects removal urgency.

  For the unlisted cases: the co-opted statue should stay unless the honoree's message is irrecoverably distorted. The unethical medical monument must go - it celebrates the very act that was abusive. Here the "active claim" principle bites hard.
answer: |-
  Your gut reactions reveal a remarkably consistent underlying principle when reframed through the lens of **monumental agency** – the idea that a monument's purpose isn't just to *depict* history, but to actively *perform* an act of communal honoring *in the present*. This principle explains your verdicts and resolves apparent contradictions:

  **The Core Principle:**  
  *A monument should be removed if its continued presence constitutes an active, contemporary act of communal honor that is fundamentally incompatible with core societal values, particularly when the honor is explicitly or implicitly linked to the reprehensible acts.*

  **How this principle explains your verdicts:**

  1.  **Confederate Generals:** **Remove.** The statues explicitly honor individuals whose primary historical significance is defending slavery. Keeping them up *is* a contemporary act of honoring that cause, incompatible with equality.
      *   *Clause:* Active honor linked to reprehensible acts.

  2.  **Colston Statue:** **Remove (Outcome Right).** The statue explicitly honored Colston *as a philanthropist*, obscuring the slave-trade source of his wealth. Its presence was an ongoing act of honoring that obscured history. The mob method troubles you because it bypassed democratic process (a separate value), not because the removal itself was wrong under the principle.
      *   *Clause:* Active honor obscuring/dependent on reprehensible acts.

  3.  **Cecil Rhodes:** **Remove.** The statue actively honors Rhodes *as a founder/benefactor*, celebrating imperialist values central to his identity and wealth generation. The scholarships are a separate *consequence* of his wealth, not what the statue *honors*. The statue performs the honoring, not the money.
      *   *Clause:* Active honor linked to reprehensible acts/values (imperialism).

  4.  **Eugenicist Street Name:** **Keep.** The name has lost its commemorative function ("worn off"). It is no longer an *active* act of communal honoring; it's primarily a location identifier. Removing it wouldn't significantly stop honoring, just cause bureaucratic hassle.
      *   *Clause:* **Lack** of active honoring function in the present.

  5.  **Eugenicist Park Statue:** **Remove.** The statue *is* an active, intentional act of public honoring. Its form demands attention and signifies esteem *now*, regardless of whether people read the plaque daily. Keeping it up performs the honoring.
      *   *Clause:* Active honor linked to reprehensible acts.

  6.  **Slave-Trading Philanthropist:** **Remove.** The monument explicitly honors the *philanthropy*, which was directly funded by and inseparable from the slave trade. Honoring the philanthropy *is* honoring its source. The active claim is clear: "We celebrate this generosity," built on atrocity.
      *   *Clause:* Active honor explicitly dependent on reprehensible acts.

  7.  **Botanist Slave Owner:** **Keep (with added context).** The monument explicitly honors the *botanical work*, not the slave ownership (which was incidental to his commemorated achievement). The honoring is *not* linked to the reprehensible act. Adding context acknowledges the full person without the statue itself actively honoring the slavery.
      *   *Clause:* Active honor is **not** linked to the reprehensible act; the honoring focuses on a separate, valued contribution. Context mitigates the *passive* honoring of the person.

  8.  **War Memorial (Event):** **Likely Keep, but scrutinize.** It primarily honors collective sacrifice or remembrance of an event, not individuals *for* reprehensible acts/ideals. If the event itself is reprehensible (e.g., a monument celebrating a victory in a war of aggression), removal might be warranted. If it commemorates loss or a complex event neutrally, it likely stands.
      *   *Clause:* The honoring is of sacrifice/remembrance, not reprehensible acts/ideals *per se*. Context of the event matters critically.

  9.  **Nonviolence Hero (with vile past writings):** **Tough, likely Keep with context, but possible Remove.** This tests the link between the honoring and the reprehensible act. Does the statue honor his *later achievements in nonviolence*, or does it unavoidably honor the *whole man*, including his vile views? If the vile views were a brief, repudiated phase utterly disconnected from his celebrated work, adding context might suffice. If the views were core to his identity for a significant period or relevant to his later work, or if the statue implicitly whitewashes this past, removal becomes more likely. (The Ghana campaign suggests the link felt strong there).
      *   *Clause:* Is the active honoring *inextricably linked* to the reprehensible aspect, or focused on a separate, redemptive achievement? Severity, relevance, and repudiation matter.

  10. **Abstract Bronze Nude:** **Keep. N/A.** It performs no commemorative function; it's public art, not a monument. The question of "honoring" doesn't apply.
      *   *Clause:* **No** act of communal honoring is being performed.

  **Your Half-Formed Theory - Salvaged & Refined:**
  You were on the right track. Your core insight – "a monument is something we're doing now" – is crucial. The refined principle focuses that "doing" specifically as an **act of communal honoring**. The test isn't just "does it make us say something untrue," but "**is the specific act of honoring performed by this monument, in the present, incompatible with our fundamental values due to its link to reprehensible acts?**"

  **Overturned Verdict? The Street Name.**
  The principle *does* challenge your street name verdict, but **doesn't necessarily force you to remove it**. If the name is truly inert ("worn off"), it fails the "active honoring" test, so keeping it is consistent. However, *if* awareness of the namesake increases and the name *regains* its commemorative function (sparking pride or controversy about the man), or *if* the community decides that *any* namesake link is an unacceptable passive honoring, then removal could align with the principle. Your verdict stands *only* because the name currently lacks active agency. If that changes, the verdict should too.

  **Predictions for New Cases:**

  1.  **Statue co-opted by a group the honoree would despise:**
      *   **Prediction: Likely Keep, unless the co-option fundamentally corrupts the honoring.** The principle focuses on the *monument's intended or inherent honoring*. If the honoree was truly blameless and the statue honors genuine good, the misuse by others doesn't change what the monument itself *does* (honor the good). Adding context about the misuse might be appropriate. Removal would only be justified if the co-option is so complete that the monument *now* primarily signifies the despicable group's ideology, effectively overwriting its original meaning in the public sphere.

  2.  **Monument to a public health campaign built on non-consensual experiments:**
      *   **Prediction: Remove.** This monument actively honors the *campaign/achievement*. Since that achievement was *directly built* on grossly unethical and harmful acts (the experiments), honoring the achievement *is* honoring the means. The link is explicit and fundamental. Keeping it up performs an act of honoring incompatible with medical ethics and bodily autonomy.

  **Should Age Matter?**
  *   **Principle Says:** No, not intrinsically. A 2000-year-old monument celebrating a genocidal conqueror still performs an act of honoring that might be incompatible with modern values. The *strength* of the active honoring might fade (like your street name), and the "worn-off" effect is more likely with time, making removal *less* urgent or necessary. However, the core test remains: is it *still* actively honoring something reprehensible? Ancient statues often shift towards historical artifacts (like in a museum) rather than active honoring.
  *   **Your Instinct is Correct:** Age shouldn't be a *moral* shield. People look at you funny because they conflate age with historical significance, neutrality, or the "worn-off" effect. Your principle distinguishes these: a monument's *current function* (active honoring vs. historical artifact vs. inert label) matters more than its birthday. A recent monument to a eugenicist is worse than an ancient one, not because of age, but because its active honoring is likely more potent and directly relevant.

  **Conclusion:**
  You believe monuments are present-tense acts of communal honoring. Your gut consistently demands removal when that act honors individuals or achievements fundamentally linked to reprehensible acts (slavery, imperialism, eugenics) *through the monument's specific focus*. You are more lenient when the honoring is incidental, the monument's agency has faded, or the honoring focuses on a separate, valuable achievement. Your principle is coherent, powerful, and explains your nuanced reactions. It provides a clear, values-based framework for judging these difficult cases, focusing on *what we choose to honor now*.
