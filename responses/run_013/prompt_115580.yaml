  &nbsp;&nbsp;**1. What guarantees the vector's operation?**  
  &nbsp;&nbsp;&nbsp;&nbsp;**a. Nomological guarantee** (a law of social development; failure is impossible).  
  &nbsp;&nbsp;&nbsp;&nbsp;**b. Providential guarantee** (a divine/cosmic purpose; failure is impossible).  
  &nbsp;&nbsp;&nbsp;&nbsp;**c. Practical guarantee** (no ironclad assurance, but commitment is warranted for action/practice).  
  &nbsp;&nbsp;**2. Does the historical record show net moral improvement (trend)?**  
  &nbsp;&nbsp;&nbsp;&nbsp;**i. Yes.**  
  &nbsp;&nbsp;&nbsp;&nbsp;**ii. No** (e.g., mechanism is real but currently stalled or overridden).  
  &nbsp;&nbsp;**3. Is there a specific end state (terminus) toward which history converges?**  
  &nbsp;&nbsp;&nbsp;&nbsp;**x. Yes.**  
  &nbsp;&nbsp;&nbsp;&nbsp;**y. No.**  
  **B. No.**  
  &nbsp;&nbsp;**1. Does the historical record show net moral improvement (trend)?**  
  &nbsp;&nbsp;&nbsp;&nbsp;**i. Yes.**  
  &nbsp;&nbsp;&nbsp;&nbsp;**ii. No.**  
  &nbsp;&nbsp;**2. Is there a specific end state (terminus) toward which history converges?**  
  &nbsp;&nbsp;&nbsp;&nbsp;**x. Yes.**  
