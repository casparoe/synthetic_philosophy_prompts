  But the deepest layer might be the fourth option: disagreement about what class-level criticism requires. Generalists seem to want a defeasible heuristic, while particularists demand impossibility of counterexamples. That's a meta-epistemic clash about standards. 

  For progress... ah! The user's own suggestion about quantifying base rates is promising. We'd need to operationalize "self-sealing" features, sample conspiracy claims across credibility spectra, and compare to control groups of non-conspiracy bad explanations. Though measuring "epistemic discount" would be tricky - maybe through experimental philosophy surveys on how people actually weigh evidence? 

  Alternatively, clarifying the distinction between the two objects could help. We might say: "When discussing conspiracy theories *as explanations*, here are observed tendencies; when discussing *the label*, here are its social functions." This preserves the generalist's insight without letting the label pre-judge individual cases. 

