  The user's closing provocation is crucial: if this is actually three questions masquerading as one, I should say so. Upon reflection, while interrelated, the ethical, legitimacy and institutional dimensions demand distinct consideration - a single theory might span them but must account for their differences. I'll note this upfront while still delivering the requested list, marking where requirements belong to specific dimensions.
answer: |-
  Here is a specification of desiderata for any adequate theory of legitimate state information-gathering, structured to meet your requirements. I’ve flagged tradition-specific commitments, identified potential incompatibilities, and highlighted the requirement that most effectively challenges popular candidates. I conclude with a critical pushback on the framing.

  ---

  ### **Core Desiderata for a Theory of Legitimate State Information-Gathering**  
  *(Cases in bold; constraints in italics)*

  1.  **Must Justify Non-Consensual Collection for Core State Functions**  
      -   **Case:** The census, tax returns, and public health surveillance.  
      -   **Work:** Without these, modern states collapse (taxation funds services, census enables representation/distribution, public health prevents epidemics).  
      -   **Constraint:** *Mass data collection is a precondition for taxation, welfare, and public health*. (Genuine constraint: no functional state exists without these.)  
      -   **Tradition Alert:** German dignity-based theories strain here; U.S. pragmatism embraces it; China instrumentalizes it for control.

  2.  **Must Distinguish Between Collection, Retention, Use, and Disclosure**  
      -   **Case:** Criminal investigations (collection/use of non-consensual evidence) vs. welfare files (retention/aggregation of lifetime data) vs. commercial data resale (disclosure to third parties).  
      -   **Work:** A theory collapsing these fails to explain why collecting DNA for a rape investigation differs from permanently retaining it for unrelated purposes, or why the state buying location data from apps feels intrusive even if "voluntarily" given to corporations.  
      -   **Distinction Crucial:** Retention without sunset clauses or use-limits creates latent power; disclosure multiplies risks.

  3.  **Must Account for the "Aggregation Effect"**  
      -   **Case:** Data harmless in isolation (e.g., a single grocery receipt) becomes potent in aggregate (revealing health status, political views, or poverty cycles).  
      -   **Work:** Explains the wrong in state "mosaic theory" – even if each data point is trivial or "public," the whole portrait enables manipulation or discrimination unseen in parts.  
      -   **Constraints:** *The state is not a counterparty citizens can bargain with*; *mass data is often necessary*. (Genuine constraints: power asymmetry & functional necessity exist.)

  4.  **Must Define the Wrong to the "Nothing-to-Hide" Citizen**  
      -   **Case:** The wholly indifferent person who claims no subjective privacy interest.  
      -   **Work:** Forces the theory beyond consent or subjective harm. The wrong must be objective: e.g., *diminished autonomy* (reduced scope for unexamined life), *dignity violation* (being instrumentalized as a data point), *structural power imbalance* (state-citizen relationship corrupted into observer-subject), or *risk of future misuse*.  
      -   **Key Incompatibility:** **Theories grounding legitimacy solely in individual consent or property rights in data *cannot* satisfy this.** They imply no wrong occurs if subjectively unharmed. This is fatal for U.S.-style "voluntary" third-party doctrine or simplistic libertarian views.

  5.  **Must Explain Divergent Legitimacy Judgments on Similar Facts**  
      -   **Case:** German vs. U.S. vs. Chinese approaches to, e.g., state access to telecom data, financial records, or social media activity.  
      -   **Work:** Tests cultural/political neutrality. A theory must explain why Germany sees access to metadata as dignitary harm, the U.S. often sees it as non-private if held by third parties, and China sees it as inherent to governance.  
      -   **Constraint:** *Otherwise similar liberal democracies reach different conclusions*. (Tradition Alert: This reveals deep cultural/legal commitments – not a universal constraint, but a test for the theory’s ability to incorporate context without relativism.)

  6.  **Must Distinguish State-as-Protector vs. State-as-Threat**  
      -   **Cases:** Public health contact tracing (protector) vs. predictive policing algorithms scoring "risk" (threat); welfare eligibility verification (protector) vs. social credit scoring for political conformity (threat).  
      -   **Work:** A theory must differentiate *purpose* and *effect*. Collecting data to deliver a right or service differs from collecting to control or punish. Intent matters, but so does systemic effect (e.g., welfare files used for criminal investigations).  
      -   **Distinction Crucial:** Collapsing this enables authoritarian co-option of "benign" justifications.

  7.  **Must Reject the Conflation of Secrecy, Privacy, and Autonomy**  
      -   **Cases:** A public Facebook post (no secrecy, but privacy/autonomy claims possible); compelled decryption (violates autonomy, not necessarily secrecy); mandatory disclosure of health status to access benefits (privacy/autonomy trade-off, no secrecy).  
      -   **Work:** Secrecy is about concealment; privacy is about control over personal boundaries/access; autonomy is about freedom from interference in choices. A theory treating them as identical will misdiagnose harms (e.g., dismissing privacy claims because data isn’t "secret").

  ---

  ### **Constraints vs. Tradition-Specific Commitments**
  -   **Genuine Constraints:**  
      -   Mass data collection is necessary for core state functions (Taxation, Welfare, Public Health).  
      -   The state possesses unique coercive power; citizens cannot truly refuse or bargain as equals.  
      -   Data aggregation creates novel risks/powers not present in isolated data points.  
  -   **Tradition-Specific Commitments (Dressed as Constraints):**  
      -   "Consent is the gold standard" (U.S. third-party doctrine ignores this; Germany restricts non-consensual collection more).  
      -   "Efficiency/security justify minimal restrictions" (U.S. pragmatism vs. German precaution).  
      -   "Holistic societal governance requires comprehensive data" (Chinese assertion, not a universal necessity).

  ---

  ### **Your Key Requests Addressed**
  1.  **Incompatibility Identified:**  
      Any theory relying **solely on individual consent or data-as-property cannot explain the wrong to the indifferent citizen (Desideratum 4)**. Consent/property frameworks imply that if the subject doesn’t value the data or its concealment, no legitimate interest is infringed. This fails because the wrong is relational and structural (state power, dignity, latent risk), not subjective. This is a fatal flaw for such theories.

  2.  **The Requirement That Eliminates Popular Candidates:**  
      **Desideratum 4 (The Wrong to the Indifferent Citizen) does the heaviest lifting against inadequate theories:**  
      -   **"Nothing to Hide" Argument:** Directly refuted. The theory must articulate an objective wrong independent of subjective fear or concealment.  
      -   **Millian Harm Principle:** Often insufficient, as the wrong may be non-material (dignity, autonomy erosion, power imbalance) or probabilistic (risk of future harm/abuse), not a direct, tangible harm.  
      -   **Privacy as Contextual Norms:** While useful, a *mere* bundle of norms struggles with the systemic, relational harm to the indifferent citizen exposed to state scrutiny. It risks reducing legitimacy to social acceptance.  
      -   **Can it be met? Yes, but not by consent/harm/property theories.** Theories focusing on **relational autonomy** (state-citizen relationship), **dignity** (inherent worth violated by instrumentalization), **structural power**, or **republican non-domination** (freedom from arbitrary power) can meet it.

  ---

  ### **Pushback on the Framing**
  Your instinct is correct. **"When may the state legitimately gather information?" is not one question but three fundamentally distinct ones, requiring separate (though linked) theoretical frameworks:**

  1.  **The Ethics of Citizen Concealment:** What, if anything, *should* citizens hide from the state? (e.g., Duties of transparency? Right to mental privacy? Limits of civic virtue?).  
  2.  **The Legitimacy of State Information-Gathering:** Under what principles, purposes, and constraints *may* the state seek, collect, retain, or use citizen information? (This is the focus of your desiderata).  
  3.  **The Institutional Design of Oversight:** How should information systems be structured to ensure legitimacy *in practice*? (e.g., Judicial warrants, data minimization rules, independent oversight bodies, algorithmic transparency, sunset provisions, purpose limitation).

  **Conflating them risks incoherence.** A theory justifying *collection* (e.g., for welfare) says little about ethical *concealment* (can I lie to protect dignity?) or *institutional design* (how to prevent welfare data being used punitively?). The German tradition emphasizes institutional safeguards (BVerfG oversight); the U.S. emphasizes limited *collection* principles but weaker *retention/use* rules; China ignores individual legitimacy, focusing on institutional design for control.

  **Conclusion:** The desiderata above target primarily Question 2 (Legitimacy of State Action). A complete account needs companion frameworks for the Ethics of Concealment and Institutional Design. Forcing a *single* theory to cover all three regimes *as implemented* risks a category error, as they embed irreconcilable views of the state-citizen relationship. However, a theory of *legitimacy* (Q2) *should* be able to critically evaluate all three regimes using universalizable principles (even if concluding some regimes are illegitimate).

  ---

  This framework provides the tools to dissect the seminar's discussions, exposes the fault lines in popular theories, and clarifies the distinct questions at play. Use it to demand explicit justifications.
