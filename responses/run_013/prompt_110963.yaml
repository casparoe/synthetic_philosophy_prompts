prompt: |-
  I teach a metaphysics unit on material constitution, and I keep running into a pattern in seminar discussion that I have no name for and am no longer sure has one. Take the standard case: a lump of clay is moulded into a statue, so that the statue and the lump occupy exactly the same place, come into and go out of existence at different times, and one of them can survive being squashed while the other cannot. The discussion reliably runs as follows. The students agree about every fact anyone could check — the clay, the shape, the history, what would happen under various counterfactual manipulations. Then one of them says that there are plainly two things here, and another says that there is plainly one thing described in two ways, and within minutes each is accusing the other of cheating. The pluralist is said to multiply objects in order to save a description; the monist is said to let the word 'thing' legislate about the world. What strikes me is that neither party experiences the exchange as terminological. Each takes the other to have got something wrong about the world, and yet neither can produce a fact that the other denies. I know the general vicinity — there is a literature on disputes that turn out to be about words rather than facts, and another on whether there is a fact of the matter about how many things there are — but those are positions about what is going on in such an exchange, and what I am after is a name for the shape of the exchange itself: the standoff that survives complete agreement on the facts, that does not feel terminological to its participants, and that no further investigation appears able to settle. Does it have an established name? If it does not, coin one — but I care far more about the boundaries than about the label. What exactly must be true of a dispute for it to be an instance? How does it differ from a dispute that is merely verbal, and from a dispute about which vocabulary we ought to adopt? Can it be one-sided — one party simply confused about the facts, the other not — without collapsing back into an ordinary disagreement? And what becomes of the pattern when the subject matter is not artefacts but, say, whether a virus counts as alive, or whether a species name picks out a real kind? I would rather have a careful map of the nearest existing concepts, with an account of where each falls short, than a single borrowed label.
reasoning: |-
  Okay, I need to understand what this philosophy professor is asking. They teach metaphysics and have a recurring issue in seminars about material constitution—like the classic statue and lump of clay example. Students agree on all the observable facts but then split into two camps: one says there are two distinct things (pluralist), and the other insists it's one thing described differently (monist). The key point is that both sides feel the other is fundamentally wrong about reality, not just using words differently, and no new facts can resolve it. The professor wants to know if this kind of standoff has a name, or if not, how to define it precisely. They're especially interested in boundaries—how it differs from verbal disputes or pragmatic choices, and whether it applies beyond artefacts to things like defining life or species.

  First, I recall this is a core problem in metaphysics. The statue/lump case is famous: same matter, different persistence conditions (statue can't survive squashing, clay can). Students agree on physics but disagree on ontology—what exists. The emotional charge is important: each side feels the other is cheating or missing something deep. That suggests it's not just semantics; it feels substantive. 

  The professor mentions existing literature on verbal disputes and ontological vagueness (like Eli Hirsch or Ted Sider), but points out those are theories about what's happening, not names for the standoff itself. So I need to focus on the pattern: unresolved disagreement despite factual consensus, with both sides insisting it's about the world. 

  Is there a term for this? "Verbal dispute" doesn't fit because participants reject that it's about words. "Merely verbal" implies resolvable by defining terms, but here, defining "thing" or "object" doesn't help—the clash is over what those concepts carve in reality. "Ontological disagreement" is too broad; many involve factual disputes. "Deep disagreement" (from epistemology) might work, but it's often about values or frameworks, not just metaphysics. "Faultless disagreement" (aesthetics, relativism) captures no-fact-of-the-matter but typically involves subjective responses, not object ontology. 

  Perhaps "metaphysical impasse"? That's descriptive but not established. Or "constitutional standoff"? Too specific to this case. The closest existing concept might be "Carnapian framework choice"—where Rudolf Carnap said ontology depends on linguistic frameworks, and choosing one isn't true/false but pragmatic. But students aren't consciously choosing frameworks; they think they're describing reality. 

  For boundaries: This differs from a merely verbal dispute because clarifying definitions doesn't resolve it (e.g., if both define "thing" as a material object, they still disagree on whether shape changes create new objects). It also differs from pragmatic vocabulary choices (e.g., "should we call viruses alive?" is about utility, not mind-independent truth). The dispute must have: (1) complete agreement on non-ontological facts, (2) persistent feeling of substantive disagreement, (3) no possible empirical resolution. It can be one-sided only if one party is confused about the facts (e.g., wrongly thinks the lump predates the statue), but if facts are agreed, it's symmetrical. 

  Beyond artefacts: For "is a virus alive?", if students agree on all biological features but disagree on the definition of life, it could fit—but only if they treat "alive" as a mind-independent category, not a label. Same for species: if they agree on genetics but dispute whether species are real, it's similar. The core is ontology—what exists or what categories are fundamental—versus conceptual or linguistic decisions. 

  So no perfect term exists. I'll propose "ontological stalemate" and define it carefully, emphasizing the conditions. But the professor cares more about mapping the concept than naming it, so I'll detail how it relates to neighboring ideas like verbal disputes, framework relativity, and vagueness, showing where each falls short.
answer: |-
  Your description captures a profound and recurring dynamic in metaphysics—one that sits at the intersection of ontology, language, and conceptual frameworks. While no universally accepted term exists for *exactly* this pattern, it aligns closely with what is often called a **deep ontological divergence** or **metaphysical impasse**. Below, I map its boundaries, contrast it with neighboring concepts, and address its extensions beyond artefacts. The core structure is defined by five necessary conditions:

  ### **The Core Pattern: A Five-Part "Immovable Standoff"**
  For a dispute to fit this pattern, all must hold:
  1. **Complete factual consensus**: Parties agree on all empirical, historical, and counterfactual facts (e.g., clay’s molecular composition, shape-change events, squashing outcomes).  
  2. **Irreducible ontological disagreement**: One party asserts distinct entities exist (e.g., "statue and clay are two objects"), while the other insists on identity under different descriptions (e.g., "one object with two properties").  
  3. **Non-terminological phenomenology**: Participants experience the conflict as substantive (about *reality*, not words) and accuse each other of intellectual dishonesty ("cheating").  
  4. **No possible resolution**: No new observation, experiment, or logical deduction could settle the dispute.  
  5. **Symmetry**: Both positions are internally coherent given the agreed facts; neither relies on hidden empirical errors.

  ---

  ### **How This Differs from Neighboring Concepts**
  Here’s a comparative map of where related ideas fall short:

  | **Concept**               | **How It Differs**                                                                 | **Why It Doesn’t Fit**                                                                 |
  |---------------------------|------------------------------------------------------------------------------------|----------------------------------------------------------------------------------------|
  | **Merely verbal dispute** | Turns on ambiguous language (e.g., "Is 'bank' financial or river?").               | Clarifying definitions *resolves* it. Here, defining "thing" or "object" changes nothing; the disagreement persists. |
  | **Pragmatic/vocabulary choice** | About utility (e.g., "Should we classify Pluto as a planet for astronomy textbooks?"). | Parties here reject pragmatism; they insist their view captures *mind-independent truth*. |
  | **Vagueness/borderline case** | Involves fuzzy boundaries (e.g., "How many grains make a heap?").                  | The statue/clash isn’t borderline—parties see a *clear* one/many distinction. |
  | **Hirsch-style "quantifier variance"** | Disputes are verbal because "there exists" has different meanings in frameworks. | Participants deny frameworks are chosen; they believe their quantifiers track reality directly. |
  | **Epistemic disagreement** | One party is ignorant/mistaken about facts.                                        | By condition #1, all facts are agreed upon. |

  ---

  ### **Key Boundary Cases & Complications**
  - **Can it be one-sided?**  
    **No—if it fits the pattern.** If one party denies factual consensus (e.g., "The lump didn’t exist before molding!"), it collapses into ordinary empirical disagreement. The standoff *requires* symmetry: both sides grant the same facts but draw incompatible ontological conclusions. A confused student misunderstands the *pattern*, not the facts.  

  - **Does it extend beyond artefacts?**  
    **Yes, but with constraints.** Examples:  
    - **"Is a virus alive?"**: Fits *if* parties agree on all biological facts (replication, metabolism, evolution) but disagree on whether "life" is a unified ontological category.  
    - **Species realism**: Fits *if* parties agree on genetics/ecology but dispute whether *Homo sapiens* names a mind-independent natural kind.  
    **Crucial limit**: The dispute must hinge on *what exists* or *what categories are fundamental*—not operational definitions (e.g., "alive" for lab purposes).  

  - **Is it "about words" secretly?**  
    Not to participants—but philosophers diverge:  
    - **Realists** (e.g., Sider): One side is *objectively wrong*; there’s a fact about "structure of reality."  
    - **Anti-realists** (e.g., Carnap): It’s about choosing linguistic frameworks; no fact of the matter.  
    Your students’ frustration reflects the realist intuition: their language feels *transparent*, not chosen.  

  ---

  ### **Proposed Name & Diagnostic Tool**
  Since no term perfectly captures this, I propose:  
  **Ontic stalemate** (Greek *ontos*, "being").  
  *Why this works*:  
  - "Ontic" emphasizes the *existence*-focused nature (vs. semantic or epistemic).  
  - "Stalemate" implies unresolvable deadlock despite shared ground.  

  **Diagnostic test for an ontic stalemate**:  
  > *If both parties accept "If we agreed on the meanings of all words, we’d still disagree about what exists here," then the dispute qualifies.*

  ---

  ### **Why This Matters for Metaphysics**
  This stalemate reveals a fissure in how humans parse reality:  
  - **Pluralists** prioritize *modal properties* (persistence conditions, counterfactual survival).  
  - **Monists** prioritize *material unity* (spatiotemporal continuity, substrate).  
  Neither is "cheating"—but their disagreement stems from incompatible intuitions about what grounds "objecthood." Mapping this impasse doesn’t resolve it but clarifies where metaphysics must begin: by interrogating our pre-theoretic commitments to unity, identity, and existence.  

  For your teaching, naming this pattern ("This is an ontic stalemate—notice how facts aren’t the issue...") may help students pivot from frustration to meta-ontological reflection. If you test-drive the term, report back on whether it sticks!
