answer: |-
  Here's a breakdown of the philosophical foundations, operational logic, and policy tensions within each model, focusing on their core presuppositions about consent, harm, commodification, and agency:

  **I. The Philosophical Foundations & Presuppositions**

  1.  **Nordic Model (Swedish Approach): Criminalizing the Buyer**
      *   **Core Presupposition: Sex Work is Inherently Harmful/Exploitative, Rooted in Structural Inequality.** It assumes the act itself is degrading and inseparable from patriarchal violence, exploitation, and gender inequality. Buying sex is seen as an act of male domination/violence.
      *   **View of Consent:** Radically challenged. The model presupposes that *meaningful consent* to sex for money under conditions of systemic gender/economic inequality is impossible or fundamentally compromised. The seller's stated consent is often interpreted as survival strategy or false consciousness ("even if she says yes, the context means it's not *true* consent"). The buyer's action is non-consensual *by definition* because it inherently exploits vulnerability.
      *   **View of the Seller:** Primarily as a **victim** (of trafficking, poverty, abuse, patriarchy), regardless of self-identification. This is the source of the tension you noted: The seller's act isn't criminalized *because* she is seen as acting under duress or structural coercion, not as an autonomous agent making a legitimate choice. Her assertion of agency *contradicts* the model's core harm thesis, creating friction.
      *   **View of Harm:** Harm is *inherent* to the transaction. Criminalizing the buyer seeks to eliminate the *demand* seen as the root cause of the inherent harm/exploitation.
      *   **View of Commodification:** Explicitly rejects the commodification of bodies/sex as inherently dehumanizing and incompatible with gender equality. Sex *cannot* be a legitimate commodity.
      *   **Gender Assumption:** Heavily gendered – focuses on male buyers exploiting female sellers (though this creates problems for non-heteronormative transactions).

  2.  **Legalization/Regulation Model (Germany/Netherlands): Sex Work as a Legitimate but "Special" Service Industry**
      *   **Core Presupposition: Sex Work is Potentially Harmful Only Under Bad Conditions (Exploitation, Lack of Safety, Disease).** Harm is not inherent but arises from criminalization, lack of oversight, and unsafe working environments. Regulation mitigates harm.
      *   **View of Consent:** Presupposes consent *is possible* within a regulated framework. Sellers are seen as capable of consenting to the *activity itself*. Regulation aims to ensure safety and minimize coercion within the transaction (e.g., licensing verifies age/status, brothel rules).
      *   **View of the Seller:** Primarily as a **worker** (though often a "special" or vulnerable one). She has agency to choose the work but needs protection *from* the risks inherent in the industry and potentially exploitative third parties (pimps, traffickers).
      *   **View of Harm:** Harm is *external* or *conditional* (violence, trafficking, STIs, exploitation by managers). Regulation aims to manage these risks through state oversight, health checks, safe premises, and taxation.
      *   **View of Commodification:** Accepts the commodification of sexual services as a pragmatic reality. It treats sex work as a *market transaction*, like other service industries, albeit one requiring specific regulations due to its intimate nature and associated risks. This implicitly normalizes commodification within boundaries.
      *   **Gender Assumption:** Less explicitly gendered than the Nordic model, focusing on industry structure. However, regulatory frameworks can still reflect gendered biases (e.g., focus on female sellers, health checks).

  3.  **Full Decriminalization Model (New Zealand): Sex Work as Work**
      *   **Core Presupposition: Sex Work is Work.** Harm primarily stems from criminalization, stigma, and lack of workers' rights. The act itself is morally neutral.
      *   **View of Consent:** Fully embraces the possibility of consent. Sellers are seen as autonomous agents capable of consenting to the activity *and* negotiating the terms of their work like any other worker. Laws against coercion and assault apply equally.
      *   **View of the Seller:** Unequivocally as a **worker with rights**. The model starts from the premise of the seller's agency and autonomy. While acknowledging vulnerability to harm (like workers in other industries), it doesn't define the worker *as* a victim by default.
      *   **View of Harm:** Harm arises from *illegality* (driving work underground, preventing reporting of crimes, enabling police abuse), *stigma*, and *lack of labor rights/standards*. Decriminalization + standard labor/health & safety laws address these.
      *   **View of Commodification:** Accepts commodification as a fact of life in a market economy. Sex work is labor; the service provided is the commodity. Rejects the idea that sexual services are inherently different or more "sacred" than other forms of embodied labor (e.g., massage, nursing, professional sports).
      *   **Gender Assumption:** Minimally gendered in principle; applies rights framework to all sex workers regardless of gender. Focuses on labor relations over gendered power dynamics per se.

  **II. Policy Logic: What's Forced vs. What's Flexible**

  *   **Nordic Model Forced:**
      *   Criminalization of the *purchasing* act (core demand reduction logic).
      *   Non-criminalization of the *selling* act (consistent with victim status).
      *   Services/support focused on *exiting* sex work (logical if it's inherently harmful).
  *   **Nordic Model Flexible:**
      *   *How* buyer criminalization is enforced (fines vs. jail, targeting clients vs. facilitators).
      *   Specific support services offered (housing, job training, therapy).
      *   Whether "soliciting" laws are used against sellers (creates tension with non-criminalization).

  *   **Legalization Model Forced:**
      *   Some form of state licensing/registration for businesses/workers (core regulation mechanism).
      *   Some state-mandated health interventions (STI testing) or safety standards (brothel rules) justified by "special risk".
      *   Taxation framework.
  *   **Legalization Model Flexible:**
      *   *Degree* of regulation (strict vs. light licensing, mandatory vs. optional health checks).
      *   *Who* is licensed/registered (only brothels? independent workers too?).
      *   Specific zoning laws.
      *   Labor rights framework (minimal vs. robust – often a weak point).

  *   **Decriminalization Model Forced:**
      *   Removal of *all* criminal laws specifically targeting consensual sex work between adults (selling, buying, brothel-keeping, soliciting).
      *   Application of standard employment law, contract law, health & safety regulations.
      *   Ability for workers to organize and access justice systems without fear.
  *   **Decriminalization Model Flexible:**
      *   *How* labor/H&S laws are specifically applied or adapted (e.g., specific guidelines for safety in various work settings).
      *   Outreach and support services (focused on rights, safety, health access, not just exiting).
      *   Strategies to combat trafficking *without* conflating it with consensual adult work.

  **III. Swapping Core Commitments: Coherence Tests**

  *   **Scenario: Take the Nordic Model's Harm Premise, but Apply Regulation (Like Germany):**
      *   **Conflict:** If harm is *inherent*, regulation legitimizes and facilitates the harmful act. Licensing implies state approval of something deemed fundamentally exploitative/degrading. Mandatory health checks accept the transaction as ongoing. This fundamentally contradicts the Nordic philosophical stance.
      *   **Concrete Changes Needed for Coherence:** Impossible swap. The core harm thesis (inherent harm) logically requires *elimination* (via criminalizing demand), not *management* via regulation. Trying to regulate would abandon the core commitment.

  *   **Scenario: Take Decriminalization's "Work is Work" Premise, but Add Mandatory "Victim Counseling" (Like Some Nordic Support Services):**
      *   **Conflict:** Mandatory counseling presupposes the worker *is* a victim needing intervention, contradicting the core premise of her as an autonomous worker capable of consent. It imposes a state-defined identity ("victim") regardless of self-perception.
      *   **Concrete Changes Needed for Coherence:** Remove mandatory counseling. Replace with *voluntary*, rights-based support services (legal aid, business advice, health services, safety planning) offered *to workers* on their own terms, without an "exiting" agenda. Focus agencies on labor departments and health services, not social services focused on "rescue".

  *   **Scenario: Take Legalization's Pragmatism, but Remove Licensing/Registration:**
      *   **Conflict:** Licensing is the core mechanism for state oversight and risk management within the legalization logic. Removing it abandons the central premise that state control mitigates harm. It moves towards decriminalization *in practice* while potentially leaving harmful third-party control intact.
      *   **Concrete Changes Needed for Coherence (to stay "Legalization"):** Licensing must stay. *Alternatively*, adopt a *very* light-touch regulatory framework focused only on business registration (like a normal business) and enforcing H&S/labor laws (like NZ), but this essentially *becomes* decriminalization plus standard business law.

  **Key Tension Points for Your Council Meeting:**

  *   **Consent & Agency:** Is the seller's stated consent valid (Decrim/Legalization) or inherently compromised (Nordic)? This is the deepest divide.
  *   **Source of Harm:** Is harm *in the act itself* (Nordic) or *in the conditions* (Legalization/Decrim)?
  *   **State Role:** Should the state *abolish* the market (Nordic), *manage* it as a special industry (Legalization), or just *protect workers' rights* within it (Decrim)?
  *   **Commodification:** Is it fundamentally wrong (Nordic), acceptable with caveats (Legalization), or unremarkable (Decrim)?
  *   **Coherence Check:** Does a proposed policy element (e.g., mandatory health checks, criminalizing clients, mandatory counseling) logically follow from the model's core view of consent/harm/agency, or does it contradict it?

  **What to Say (Avoiding Slogans):**

  > "We're debating three distinct philosophies, not just policies. The Nordic model views buying sex as inherently harmful exploitation, making consent impossible. Legalization sees consent possible but risks needing state management like a special industry. Decriminalization starts from sex workers being consenting workers entitled to rights. These lead logically to criminalizing buyers, licensing workers, or removing all sex work laws respectively. Mixing elements risks incoherence – like licensing workers while calling them victims, or criminalizing clients while claiming sellers have full agency. We need to first agree on the fundamental question: *Can an adult truly consent to sex work?* Our answer dictates which path makes logical sense."

  This framework equips you to dissect the arguments, expose hidden assumptions, and challenge inconsistencies based on the underlying philosophy of each approach.
