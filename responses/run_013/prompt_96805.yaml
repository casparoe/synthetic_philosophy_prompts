prompt: |-
  At a party last weekend the host ran an auction for a one-dollar bill in which the two highest bidders both pay, though only the winner receives the bill. I won with a bid of seven dollars; the runner-up paid six-fifty and got nothing. My partner says I should have cut my losses and stopped at two, and a friend who studied economics says the reverse: that the money already bid is gone either way, that the underbidder is always better off raising than folding, and that the mistake was hers, not mine. Both of them cite, as though it settled the matter, the maxim 'don't throw good money after bad.' It has been nagging at me for days, which I gather is itself part of the phenomenon. I want to know what that maxim can actually be claiming. Give me exactly five numbered readings, each a sentence or two, ranging from the trivial to the radical, and for each say whether it is a description of how people behave or a rule for what to do, whether it is true, and which of the two pieces of advice it actually supports. No introduction or conclusion.
reasoning: |-
  Okay, let me break this down. The user presents a fascinating auction scenario where they won a $1 bill by bidding $7 while the runner-up paid $6.50 for nothing. The core confusion revolves around conflicting advice about sunk costs and the maxim "don't throw good money after bad." 

  First, I need to parse the request clearly: five numbered interpretations of the maxim, each with specific attributes. The user wants these interpretations to range from trivial to radical, and for each I must specify: 
  - Whether it's descriptive (how people behave) or prescriptive (how they should behave)
  - Whether it's true 
  - Which advice it supports (the partner's "stop at $2" or the economist's "keep bidding")

  Hmm, the auction dynamics here are classic escalation of commitment. The economist's view aligns with rational choice theory - sunk costs shouldn't influence future decisions. But the partner's view reflects emotional loss aversion. I'll need to explore shades between these poles.

  For the first interpretation, I consider a basic sunk cost definition - literally paying more to justify past losses. This would support the partner's advice. But I should note it's often descriptively true (people do this) yet prescriptively irrational. 

  The second interpretation could focus on "recoverability" - the false hope of recouping losses. Again, this supports stopping early. It's psychologically accurate but strategically flawed. 

  Then I'll build toward the radical economic view: complete sunk cost irrelevance. Here the economist is correct - only marginal costs matter. This challenges intuitive behavior but is prescriptively sound. 

  I wonder if the user's nagging feeling relates to cognitive dissonance. They followed economic rationality but feel foolish because $7 for $1 seems absurd. The maxim gets twisted by both sides: the partner misapplies it as justification to quit, while the economist correctly dismisses sunk costs. 

  For the fifth point, I'm considering the deepest psychological layer: how the maxim serves as emotional self-deception. People invoke it selectively to rationalize either action (quitting or continuing). This meta-perspective might resonate with the user's lingering unease. 

  Throughout, I'll maintain tight structural discipline: no intros/outros, pure numbered points. The challenge is balancing academic rigor with the user's visceral experience of regret. Their "nagging for days" confirms this isn't just theoretical - it's about reconciling logic with emotion.
answer: |-
  1.  **Literal sunk cost avoidance:** The maxim describes avoiding spending new resources ("good money") solely to justify past expenditures ("bad money") that are unrecoverable. This is a prescriptive rule. It is generally true and supports the partner's advice to stop bidding at $2, as further bids beyond that point were spending more to chase the initial sunk bids.

  2.  **Ignoring irrecoverable losses in decision-making:** It prescribes that only future costs and benefits should influence current choices; past, unrecoverable costs (sunk costs) are irrelevant. This is a prescriptive rule derived from rational economic theory. It is logically sound and supports the economist's advice: the money already bid is gone, so the *only* consideration at any bid point is whether winning *from that point forward* is worthwhile based on the new bid amount and the expected cost of winning.

  3.  **A descriptive tendency to escalate commitment:** The maxim observes that people often irrationally continue investing in failing courses of action (throwing good money after bad) due to emotional attachment to prior investments, aversion to admitting loss, or hope of turning things around. This is a descriptive observation of common human behavior. It is often true descriptively and supports the partner's advice, highlighting the common *mistake* of escalating commitment that the partner warned against.

  4.  **A rule against futile recovery attempts:** It advises against spending more resources in a vain attempt to recover losses that cannot be recouped, emphasizing the futility and increased net loss. This is a prescriptive rule based on pragmatic assessment. It is often true and supports the partner's advice: bidding beyond $2 increased the total loss ($7 paid for $1) compared to stopping earlier, making recovery impossible.

  5.  **A psychological mechanism rationalizing either quitting or escalating:** The maxim can be invoked selectively to rationalize quitting (avoiding *further* loss) *or* to rationalize escalating (the prior "bad money" *demands* further investment to make it worthwhile). This describes how the phrase is often used in practice, regardless of its logical meaning. It is descriptively true about the phrase's *use* and does not inherently support either advice definitively; both the partner and the economist use it to frame their opposing arguments, revealing its ambiguity in practice.
