              - reset_rules:
                  conversion_rate: float   // for converting unused_allowance to credits at the end of the month

              - actions: a list of action definitions. Each action has:
                  name: string
                  parameters: a list, each with name and a set of possible values
                  precondition: a string that is a Python expression (using state and parameters) that returns a boolean. The state is available as a dict: 
                      state = {'plan': current_plan_id, 'unused_allowance': current_ua, 'credits': current_credits, 'day_in_cycle': current_day}
                  effect: a string that is a Python expression that returns a new state (a dict with keys 'plan', 'unused_allowance', 'credits', 'day_in_cycle') 
                  cost: a string that is a Python expression that returns a number (the cost of the action)

              - Additionally, the reset happens automatically at the end of the month, which is when the day_in_cycle is 30. In the effect of any action that results in day_in_cycle=30, we automatically apply the reset and set the state to:
                      new_credits = credits + conversion_rate * unused_allowance
                      new_unused_allowance = plan.allowance   # of the current plan at the time of reset
                      day_in_cycle = 1   // because reset advances to the next month
                  and then we use this new state.

          2. Generate all states: 
                  states = []
                  for plan in state_space['plans']:
                      for ua in state_space['unused_allowance']:
                          for cr in state_space['credits']:
                              for day in range(1,31):   // day_in_cycle from 1 to 30
                                  states.append( {'plan': plan, 'unused_allowance': ua, 'credits': cr, 'day_in_cycle': day} )
              Note: we do not include the absolute day, only day_in_cycle.

          3. For each state and each action and each parameter combination:

              a. Evaluate the precondition in the context of the state and the parameters. If false, skip.
              b. Evaluate the effect in the context of the state and the parameters to get a new state (which might have day_in_cycle in 1..30). 
              c. If the new state's day_in_cycle is 30, then we also apply the reset immediately:

                      new_state_after_reset = {
                          'plan': new_state['plan'], 
                          'unused_allowance': <allowance of the plan in new_state['plan']>,
                          'credits': new_state['credits'] + conversion_rate * new_state['unused_allowance'],
                          'day_in_cycle': 1
