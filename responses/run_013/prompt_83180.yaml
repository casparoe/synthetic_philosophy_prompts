answer: |-
  **MEMORANDUM**  
  **TO:** Editorial Staff, Archives Division, Digital Systems Team  
  **FROM:** Language Standards Committee, *The New Albion Chronicle*  
  **RE:** Policy on the Term "Krellig" and References to Veridians  
  **DATE:** October 26, 2023  

  The term "krellig" shall never appear in *The New Albion Chronicle* in any form that constitutes its derogatory use, except when its appearance is necessary for journalistic integrity, historical accuracy, or the responsible documentation of societal discourse.

  **1. Verbatim Quotation of Sources**  
  When a named source uses "krellig" in an on-record statement deemed essential to a story's factual basis, the term may be printed verbatim and unmasked. The reporter must contextualize the term's offensiveness in a preceding or subsequent paragraph. The paper does not endorse the term by printing it; however, reporters must ensure the quotation does not inadvertently act as a vehicle for the term’s inherent derogatory force.

  **2. Reclaimed Usage by In-Group Members**  
  Columnists or contributors who self-identify as Veridian may use "krellig" in reference to themselves or their in-group if asserting a reclamative intent. This use requires approval by the Deputy Editor for Ethics and must include explicit textual framing (e.g., "in an act of reclamation"). However, such usage is prohibited if major Veridian advocacy organizations publicly contest its acceptability. (Current recognized organizations: Veridian Vanguard; Veridian Council for Dignity.)

  **3. Automated Content Generation**  
  Output from algorithmic systems (e.g., comment summarizers, headline generators) containing the character sequence "k-r-e-l-l-i-g" or phonetic equivalents is not considered an instance of *use* by the paper, as no human speaker holds the requisite intent. Such output must be deleted immediately upon detection and may not be published, even in error logs. If the sequence appears, it constitutes a technical malfunction, not an editorial act. The raw character sequence itself, devoid of human agency, cannot convey the term’s inherent harm.

  **4. Archival and Historical Reprints**  
  Historical documents from *The Chronicle*’s archives containing "krellig" may be reprinted in features concerning past societal attitudes. The term must be replaced with "[derogatory term for Veridians]" in the body text. A footnote must state: "The original text used a term considered deeply offensive to Veridians. Its exclusion here reflects contemporary standards, not historical erasure." The original term’s meaning is preserved by this gloss, while its reproduction is avoided. Archives accessed internally for research retain the unmasked original, as historical meaning is contextually fixed.

  **5. Masked or Truncated Forms**  
  The previous house style of printing "k—g" or "krell—" is discontinued. These forms have been reported by Veridian readers as (a) functionally equivalent to the full term in conveying its derogatory semantic content, and (b) the basis for a new derogatory colloquialism ("kay-dash-g") targeting Veridians. Therefore, only the full, unmasked term or its complete exclusion is permitted under the provisions of Sections 1, 2, and 4. Masking fails to neutralize the term’s core meaning and generates independent harm.

  **6. Defining the Term for Readers**  
  If contextual explanation of the term "krellig" is required (per Section 1), it must be described as "a historically charged slur implying the subhuman status or inherent inferiority of Veridians." This definition must not use the term itself nor any masked variant. The definitional act itself is not an instance of derogatory use but an educational disassembly of its meaning. Care must be taken to ensure this explanation does not reiterate the term’s core semantic harm through explication.

  **7. Review and Evolution**  
  This policy acknowledges the evolving understanding of "krellig’s" impact. The Committee will review masking practices biannually, assess recognition of Veridian advocacy organizations quarterly, and consult AI ethics experts regarding Section 3. Definitions (Section 6) may be refined to more accurately capture the term’s immutable derogatory essence without reactivating it. The inherent tension between documenting the term’s existence and preventing its harmful utterance remains subject to ongoing procedural scrutiny.
