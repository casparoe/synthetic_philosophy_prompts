answer: |-
  **European Commission - Press Release**  
  Brussels, 1 April 2025  

  **Commission Proposes Groundbreaking Democratic Deficit Amortisation Facility**  
  *New instrument enhances participatory resilience and long-term legitimacy convergence*

  The European Commission today adopted a pioneering legislative proposal establishing a Democratic Deficit Amortisation Facility (DDAF). This innovative financial and governance mechanism aims to systematically address perceived gaps in the Union's democratic authorisation structure by facilitating a structured, multi-annual approach to legitimacy management.

  Democratic legitimacy, deriving from the dual sources of the directly elected European Parliament and the Member States represented in the Council, remains a cornerstone of the Union's constitutional architecture. Nonetheless, evolving societal expectations and the inherent complexity of pooled sovereignty under the Treaties necessitate complementary instruments to optimise legitimacy flows across levels of governance. The DDAF provides a harmonised framework for measuring, accounting for, and progressively amortising instances where Union action may generate transient democratic liability.

  "The Democratic Deficit Amortisation Facility represents a quantum leap in legitimacy engineering," stated Commissioner for Institutional Foresight and Participatory Resilience, Dr Elara Voss. "By introducing standardised deficit units and a non-binding participatory reserve, we move beyond reactive justification towards proactive amortisation. This strengthens output legitimacy while catalysing input legitimacy through structured, albeit voluntary, stakeholder absorption. It's a classic win-win for European governance."

  The proposal establishes a clear methodology for calculating 'Democratic Deficit Units' (DDUs) linked to specific Union acts, creates mechanisms for their management and offsetting, and establishes a 'Democratic Reserve' to absorb residual legitimacy fluctuations. A dedicated Comitology committee will oversee the Facility's operations.

  **BACKGROUND**  
  The legal basis for the proposal is Article 352 TFEU (flexibility clause), deemed necessary as no other Treaty provision explicitly covers the amortisation of systemic democratic liability. The Facility operationalises the Treaty aspiration for "ever closer union among the peoples of Europe" (Article 1 TEU) by providing a tangible instrument for legitimacy convergence over the long term.

  National Parliaments will be invited to submit reasoned opinions on subsidiarity grounds within the standard eight-week period. Any objections received will be meticulously recorded and analysed by the Commission in its Impact Assessment annex, ensuring due consideration is given before proceeding.

  The proposal will now be transmitted to the European Parliament and the Council for adoption under the ordinary legislative procedure, where the Commission will facilitate negotiations through the established trilogue process to reach a swift first-reading agreement.

  **Contacts:**  
  [Generic Commission Spokesperson Service Contact Details]

  ---

  **ANNEX: Proposal for a REGULATION OF THE EUROPEAN PARLIAMENT AND OF THE COUNCIL**  
  **establishing a Democratic Deficit Amortisation Facility (DDAF)**  

  **THE EUROPEAN PARLIAMENT AND THE COUNCIL OF THE EUROPEAN UNION,**

  Having regard to the Treaty on the Functioning of the European Union, and in particular Article 352 thereof,

  Having regard to the proposal from the European Commission,

  After transmission of the draft legislative act to the national parliaments,

  Having regard to the opinion of the Committee of the Regions,

  Having regard to the opinion of the European Economic and Social Committee,

  Acting in accordance with the ordinary legislative procedure,

  **Whereas:**

  (1) The Union is founded on the values of respect for democracy and the rule of law, as enshrined in Article 2 of the Treaty on European Union (TEU). The principle of representative democracy, articulated in Article 10 TEU, finds expression through the dual legitimacy conferred by the directly elected European Parliament and the Member States represented in the Council by their governments, themselves democratically accountable to their national parliaments or citizens.

  (2) Notwithstanding this robust framework, certain segments of civil society and academic discourse periodically articulate concerns regarding a perceived 'democratic deficit', understood as a potential misalignment between the exercise of conferred Union competences and the channels of democratic authorisation.

  (3) The Union institutions have consistently demonstrated commitment to enhancing the transparency, efficiency, and democratic accountability of the Union's functioning, as evidenced by successive Treaty reforms, the strengthening of the European Parliament's role, and the development of participatory and consultative mechanisms such as the European Citizens' Initiative.

  (4) However, the dynamic nature of European integration and the inherent complexity of governance within a union of sovereign states pooling sovereignty in specific areas, pursuant to Article 5(2) TEU, necessitates continuous innovation in legitimacy-enhancing instruments.

  (5) Output legitimacy, derived from the effectiveness of Union policies in delivering tangible benefits to citizens, constitutes a vital pillar of the Union's democratic credentials. Nevertheless, the aspiration towards "ever closer union among the peoples of Europe" (Article 1 TEU) implies a complementary need to address perceived input legitimacy gaps through structured, long-term mechanisms.

  (6) Current mechanisms for democratic input, including national parliamentary scrutiny and reasoned opinions under the Subsidiarity Protocol, while valuable, operate on a case-by-case basis and lack a holistic framework for managing systemic or residual legitimacy fluctuations over time.

  (7) It is therefore necessary to establish a dedicated financial and governance instrument, the Democratic Deficit Amortisation Facility (DDAF), to provide a structured, transparent, and forward-looking approach to measuring, accounting for, and progressively amortising instances of perceived democratic liability associated with Union action.

  (8) The DDAF will introduce a standardised unit of account, the Democratic Deficit Unit (DDU), to quantify potential legitimacy gaps arising from specific legislative or executive acts, enabling more effective management and offsetting strategies.

  (9) A Democratic Reserve, constituted through voluntary contributions of participatory actions, will provide a buffer to absorb fluctuations in DDU accumulation, thereby enhancing the overall resilience of the Union's democratic ecosystem without imposing binding constraints on institutional decision-making.

  (10) The management of the DDAF requires expert oversight to ensure methodological rigour in DDU calculation and the integrity of the Democratic Reserve. A dedicated committee operating under the Commission's Comitology procedures is the most efficient and proportionate solution.

  (11) Since the objectives of this Regulation, namely the establishment of a harmonised framework for democratic deficit amortisation, cannot be sufficiently achieved by the Member States but can rather, by reason of the scale and effects of the proposed action, be better achieved at Union level, the Union may adopt measures, in accordance with the principle of subsidiarity as set out in Article 5 TEU. In accordance with the principle of proportionality, as set out in that Article, this Regulation does not go beyond what is necessary to achieve those objectives.

  (12) This Regulation respects the fundamental rights and observes the principles recognised in particular by the Charter of Fundamental Rights of the European Union.

  **HAVE ADOPTED THIS REGULATION:**

  **Article 1 - Establishment and Objective**  
  1. A Democratic Deficit Amortisation Facility (DDAF) is hereby established.
  2. The objective of the DDAF is to enhance the long-term resilience and convergence of the Union's democratic legitimacy by:
      (a) Providing a structured framework for the measurement and accounting of perceived democratic liability associated with Union acts.
      (b) Facilitating the progressive amortisation of such liability over an extended timeframe.
      (c) Catalysing voluntary participatory actions to augment the Union's democratic ecosystem.

  **Article 2 - Democratic Deficit Units (DDUs)**  
  1. The Commission shall, by means of implementing acts adopted in accordance with the examination procedure referred to in Article 6(2), establish a methodology for the calculation and assignment of Democratic Deficit Units (DDUs).
  2. The methodology shall take into account factors including, but not limited to:
      (a) The complexity and salience of the Union act.
      (b) The degree of divergence between the positions expressed in public consultations and the final adopted measure.
      (c) The number and substance of reasoned opinions on subsidiarity grounds submitted by national parliaments concerning the proposal leading to the act, duly noted in the Commission's assessment.
      (d) The perceived distance between the act's outcome and the immediate electoral horizon at Union or national level.
  3. DDUs shall be assigned to the Union as a whole upon the entry into force of a relevant act. Member States may voluntarily assume a share of DDUs through a declaration annexed to the Council minutes upon adoption of the act.
  4. DDUs shall be recorded in a central register maintained by the Commission. They may be traded between Member States or offset against contributions to the Democratic Reserve established under Article 4.

  **Article 3 - Democratic Deficit Amortisation Committee (DDAC)**  
  1. A Democratic Deficit Amortisation Committee (DDAC) is established.
  2. The Committee shall be composed of representatives of the Member States and chaired by a representative of the Commission.
  3. The Committee shall deliver its opinion, by qualified majority, on draft implementing acts concerning:
      (a) The methodology for calculating and assigning DDUs.
      (b) The validation of contributions to the Democratic Reserve.
      (c) The annual amortisation schedule for accrued DDUs.
  4. Where the Committee delivers a positive opinion, the Commission shall adopt the draft implementing act.
  5. Where no opinion is delivered, or where the Committee delivers a negative opinion, the Commission may submit the draft implementing act to an appeal committee composed of higher-level Member State representatives. If the appeal committee delivers a positive opinion or no opinion, the Commission shall adopt the draft implementing act.

  **Article 4 - The Democratic Reserve**  
  1. A Democratic Reserve is hereby established to absorb fluctuations in DDU accumulation.
  2. The Reserve shall be constituted through the recording of non-binding participatory actions undertaken by Union institutions, Member States, regional/local authorities, or civil society organisations.
  3. Qualifying actions may include, but are not limited to:
      (a) The organisation of citizens' dialogues or participatory workshops.
      (b) The receipt and formal acknowledgment of petitions or communications from civil society.
      (c) The publication of explanatory materials on Union policies exceeding standard communication requirements.
      (d) The issuance of non-binding opinions by advisory bodies.
  4. The validation of actions for contribution to the Reserve, and their assigned value in offsetting DDUs, shall be determined by implementing acts adopted pursuant to Article 3.
  5. Contributions to the Democratic Reserve shall be formally recorded and published but shall not create any legally enforceable right or obligation, nor shall they prejudice the decision-making autonomy of the institutions.

  **Article 5 - Reporting and Review**  
  1. The Commission shall publish an Annual Democratic Deficit Amortisation Report. This report shall detail:
      (a) The DDUs accrued against Union acts adopted in the preceding year.
      (b) The status of the Democratic Reserve, including validated contributions.
      (c) Progress against the multi-annual amortisation schedule.
      (d) Any trades or offsets of DDUs between Member States.
  2. The Commission shall review the functioning of the DDAF and the methodology for DDU calculation five years after the entry into force of this Regulation and every five years thereafter. The review shall assess the Facility's contribution to legitimacy convergence and may propose amendments to this Regulation as necessary.

  **Article 6 - Entry into Force**  
  This Regulation shall enter into force on the twentieth day following that of its publication in the Official Journal of the European Union.

  This Regulation shall be binding in its entirety and directly applicable in all Member States.

