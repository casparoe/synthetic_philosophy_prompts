prompt: |-
  so my friend is dead convinced that the prisoner's dilemma shows cooperation is never rational, and she has an argument for it that I can't quite kill, and its bugging me. Heres the argument:

  (1) In a one-shot PD, defecting strictly dominates cooperating — whatever the other player does, cooperate or defect, you get a better payoff by defecting.
  (2) A strictly dominated move is never the rational one to play.
  (3) Now the iterated version: you and the same opponent, and there's no known last round (nobody knows when it ends, or there's some real chance each round is the last one). Look at any single round, say round 47. Whatever your opponent plays in round 47, and whatever happens in all the other rounds, your payoff in round 47 is bigger if you defect in round 47 than if you cooperate. And that's true round by round, for every round.
  (4) So defecting dominates cooperating in the iterated game just like it does in the one-shot game — if it's the better move in every round taken on its own, it's the better move for the game as a whole.
  (5) So you should defect in every round, including the first.
  (6) So cooperating is never rational — not once, not against anyone, no matter how long you play or how well you know them.
  (7) But that's got to be wrong. Tit-for-tat and other nice strategies did great in Axelrod's tournaments, and reciprocity shows up all over biology. If defection were the only rational move, none of that should hold up.

  She says (7) just proves (1) is false, that defecting isn't actually dominant even in the one-shot game. I think (1) is the last thing I'd give up, it's basically just arithmetic on the payoff matrix. So which step actually breaks, and why does it look so innocent — I keep reading (3) and nodding along? Then tell me what it costs to repair: do I have to give up (1), or (2), or just the way (3) handles the other rounds? I'd much rather keep (1) and (2). And one more thing, because it's what I actually care about — after the repair, is tit-for-tat 'rational', or only 'evolutionarily stable'? Are those even the same claim? If you think (3) is the problem, say exactly what (3) is smuggling in.
