prompt: |-
  I spent thirty-five years as a research scientist in infectious disease, most of it designing and running field trials and cohort studies in places where the study budget dwarfed the local health budget, and I sat on our research ethics committee for eleven of those years. I have recently retired and begun reading moral philosophy, largely on my own, and I have found something mildly embarrassing: I hold firm verdicts about which consents are real and which are not, and I cannot state the principle behind them. I would like you to find that principle, or to persuade me there is none. I would rather be told plainly that one of my verdicts has to go than be offered an account that saves all of them at the cost of being unusable in an actual consent conversation.

  Here are my verdicts.

  1. A trial consent form in a malaria-endemic region details the experimental vaccine's side effects at length but never mentions that participants will not receive the insecticide-treated bed nets the local clinic normally distributes, nets that many participants assume they will keep. I think the consent was invalid — the omission was material, though nobody lied.

  2. A woman enrolls in a trial chiefly for the per-visit payment, which comes to about a month's wages; she would rather not take an experimental drug, but she needs the money. I think she consented. The offer was not a threat, and she weighed it and chose.

  3. A man in the early stages of dementia agrees to donate a kidney to his son. He understands the operation, the pain, and the recovery, and repeats his reasons without prompting, but his neurologist says he cannot keep the long-term risk to his remaining kidney in view. I do not think he can consent.

  4. A prisoner volunteers for a low-risk pharmacokinetic study in exchange for canteen credit. However freely he appears to volunteer, I do not think his consent can be valid.

  5. A man lies to a woman about having had a vasectomy; she would not have slept with him otherwise. I think what he did was a serious wrong, but I am not persuaded that she failed to consent — she agreed to the act itself, and the lie concerned a consequence of it.

  6. A surgeon, describing a rare complication, says it almost never happens; the true figure is one in two hundred. The patient agrees to the operation. Invalid.

  7. A patient signs a form permitting any future research use of tissue removed during a routine biopsy. I think this is valid consent, even though she cannot possibly know what the future research will be.

  8. A man in severe pain, told he must decide within minutes whether to have an emergency procedure, says yes. He understands what is proposed. I think this counts, though he had no time to think.

  9. An unconscious accident victim is enrolled in a trial of a new resuscitation fluid; he survives, recovers, and says he would have refused had anyone asked him. I think the enrollment was permissible, but I would not call it consent.

  The case I keep circling back to: a participant consents to a trial of a drug whose long-term effects are genuinely unknown to everyone, investigators included; five years later the drug is found to cause a condition she would have refused to risk. Nobody deceived her — the fact did not exist as knowledge when she agreed. Did she consent? Some days I say yes, because she accepted the epistemic situation she was in; other days I say that consent to a risk nobody has specified is not consent to anything in particular.

  What I want from you: state the principle, or the two or three competing principles, that best fit these verdicts; for each clause of it, tell me which case forces that clause; tell me what the principle implies for cases I have not listed (I would particularly like its verdict on consent given on another person's behalf, and on consent that is withdrawn only after the fact); and tell me honestly which of my verdicts it cannot accommodate. If the price of fitting cases 2 and 4 together is a distinction no one could apply in a real consent conversation, say so, and tell me which of the two I should give up.
reasoning: |-
  Hmm, the user is a retired infectious disease researcher with deep field experience and ethics committee work. They're grappling with the gap between their intuitive ethical judgments about consent and the lack of a unifying principle. Their frustration is palpable - they'd rather sacrifice a cherished verdict than accept a fuzzy compromise. 

  This is a sophisticated request. The cases presented are deliberately thorny, spanning clinical trials, vulnerable populations, and intimate relationships. What's striking is how their professional history shines through: cases 1,2,4,6,7,9 all involve research ethics, while 3,5,8 touch on medical consent and personal autonomy. The recurring case about unknown long-term risks feels particularly personal - likely reflecting their vaccine trial experiences.

  The challenge is to find principles that don't just rubber-stamp their intuitions but actually guide real decisions. Their rejection of "unusable" theories is telling - this comes from someone who's actually implemented consent protocols in resource-poor settings. We must avoid ivory-tower abstraction.

  Key tensions emerge: 
  - Information vs. autonomy (cases 1,5,6,9)
  - Voluntariness under constraint (2,4,8)
  - Decision-making capacity (3,8)
  - Future unknowns (7, recurring case)

  Notably, they're self-aware about inconsistencies - admitting flip-flopping on the recurring case. That intellectual honesty is refreshing. The request for implications on proxy consent and withdrawal suggests they're thinking beyond the listed cases.

  The prisoner case (4) feels pivotal. Their firm "invalid" verdict conflicts with case 2's "valid" judgment despite similar payment incentives. This exposes the core voluntariness dilemma. Meanwhile, case 3's dementia patient reveals their threshold for competence isn't just comprehension but sustained reasoning.

  Their vasectomy case (5) is provocative - distinguishing act from consequence suggests they resist expanding "consent" to cover all contextual factors. This might conflict with their strict view in case 1 about omitted bed nets. Need to resolve that tension.

  The resuscitation trial (9) shows they accept necessity overrules consent in emergencies, but won't call it consent. This pragmatic exception matters for field research.

  For the recurring case, we'll need to address temporal dislocation of risk - can you consent to unknown unknowns? Their struggle mirrors debates about "reasonable expectation" in research ethics.
answer: |-
  Based on your verdicts and your demand for a practical, coherent principle, here's the core framework that best fits your intuitions, along with its implications and limitations:

  **The Foundational Principle: Valid consent requires *substantive voluntariness* grounded in *adequate understanding* of material facts and risks, within a context free from *undue constraints* that distort agency.**

  This principle breaks down into three interdependent clauses, each forced by specific cases:

  1.  **"Adequate understanding of material facts and risks":**
      *   **Forced by:** Case 1 (omitted bed nets), Case 6 (downplayed complication rate), and the recurring case (unknown long-term risk).
      *   **Clarification:** "Material" means facts a reasonable person (or the specific person, if known) would consider important in deciding. It includes omissions (Case 1), misrepresentations (Case 6), and *known significant unknowns* (recurring case - the *fact that long-term risks were genuinely unknown* was material). Understanding requires grasping the *nature*, *purpose*, and *material consequences* of the act.
      *   **Cases Forcing:** Case 1: Omission of a standard benefit (nets) participants reasonably expected materially distorted understanding. Case 6: Misrepresenting the risk magnitude materially distorted understanding. Recurring Case: Understanding *that* significant long-term risks were unknown is material; consent is valid *only if* this specific epistemic limitation was understood and accepted (explaining your ambivalence - the principle requires this acceptance be explicit or strongly inferable).
      *   **Accommodates:** Case 7 (future research). Understanding the *nature* (future research on tissue) and *scope* (any use) is sufficient; specific future projects are immaterial to the core decision to donate tissue broadly. Case 8 (emergency). Understanding the *nature* (emergency procedure) and *immediate risks/benefits* is adequate; exhaustive contemplation time isn't required if core understanding exists. Case 5 (vasectomy lie). The *act* itself (sex) was understood; the *consequence* (pregnancy risk) was the subject of the lie. Your verdict fits as the lie concerned a consequence, not the nature of the act consented to (though it's clearly fraud and profoundly wrong).
      *   **Struggles With:** None of your verdicts directly contradict this clause. The recurring case highlights the need to explicitly include understanding of *known material uncertainties*.

  2.  **"Substantive voluntariness":**
      *   **Forced by:** Case 3 (dementia), Case 4 (prisoner), and Case 2 (payment).
      *   **Clarification:** Voluntariness isn't just saying "yes." It requires sufficient decision-making *capacity* (Case 3) and the absence of *undue constraints* that overwhelm or distort genuine choice (Case 4). Offers (like payment in Case 2) are permissible if they don't *unduly* constrain, meaning they don't make refusal practically impossible or exploit a desperate lack of alternatives.
      *   **Cases Forcing:** Case 3: Lack of capacity to appreciate long-term consequences undermines the ability to make a voluntary *choice* about those consequences. Case 4: The inherent constraints of incarceration (lack of freedom, limited alternatives, potential for coercion/exploitation) create a context where voluntariness is *structurally undermined*, regardless of how "freely" the prisoner appears to volunteer. Case 2: The payment, while significant, is an *offer*, not a *threat* removing existing options. It provides a new choice without making refusal untenable. Her need doesn't automatically negate voluntariness; she retains the ability to weigh pros and cons.
      *   **Distinction (Cases 2 & 4):** This is the critical and *practically applicable* distinction. The price of fitting them is evaluating whether the context imposes **structural constraints that fundamentally undermine the ability to choose freely or refuse without severe, inherent penalty** (incarceration = undue constraint) vs. **an offer that expands choices but leaves the baseline ability to refuse intact, even if difficult** (payment for work/trial participation). In a real consent conversation, you assess: *What are the consequences of saying "no"?* For the prisoner, saying "no" might mean continued inability to access even small comforts, reinforcing powerlessness. For the woman, saying "no" means forgoing significant income but retaining her baseline situation. The *source* and *nature* of the constraint matter.
      *   **Accommodates:** Case 8 (emergency). Voluntariness isn't negated by time pressure *if* understanding is present. The urgency is a circumstance, not an undue constraint *imposed by the proposer* to force consent. Case 9 (unconscious enrollment). Voluntariness is impossible without consciousness; necessity justifies the act, but consent is absent.
      *   **Struggles With:** Case 5 (vasectomy lie). While the *act* was voluntary, the *condition* under which consent was given (belief about consequence) was fraudulent. Your principle focuses on understanding the *act/risk* and voluntariness in *agreeing to it*, separating it from the wrongfulness of the deception about context. It holds.

  3.  **"Context free from undue constraints that distort agency":**
      *   **Forced by:** Case 4 (prisoner) and Case 2 (payment - showing the limit).
      *   **Clarification:** This reinforces voluntariness by focusing on the *environment*. Does the setting or relationship create inherent pressure, exploitation, or power imbalances that coerce or manipulate choice, making refusal effectively impossible or irrational? (Case 4). Or does it merely present a difficult choice among alternatives? (Case 2).
      *   **Case Forcing:** Case 4: The prison context *itself* is an undue constraint. Case 2: Poverty is a harsh context, but the *trial* and its payment aren't *creating* the constraint; they are offering a potential amelioration within it. The agency (weighing and choosing) remains.
      *   **Accommodates:** Case 3: The neurological context distorts agency by impairing capacity. Case 1: The omission distorts agency by creating a false premise for choice.
      *   **Struggles With:** None directly among your verdicts. It underpins the Case 2 vs. 4 distinction.

  **Implications for Your Additional Queries:**

  1.  **Consent Given on Another's Behalf (Proxy Consent):**
      *   **Verdict:** Valid *only if*:
          *   The proxy has the legal authority/relationship recognized for such decisions.
          *   The proxy acts based on *adequate understanding* of the situation, options, and *known* material risks/benefits.
          *   The proxy's decision reflects the *known wishes* of the person (if any) or, failing that, a good-faith judgment of their *best interests*.
          *   The person *lacks capacity* to consent themselves (like Case 3).
      *   **Invalid if:** The proxy misunderstands material facts, acts under undue influence, ignores known wishes, or the person retains capacity to consent.

  2.  **Consent Withdrawn After the Fact:**
      *   **Verdict:** Withdrawal of consent *before* an act is completed or a process is finalized must always be respected (e.g., withdrawing from a trial after enrollment but before dosing). Withdrawal of consent *after* an act is completed (e.g., sex, surgery, data collection) **does not retroactively invalidate the consent that existed *at the time of the act***. The act was consented to. However:
          *   It may raise ethical concerns about the *quality* of the initial consent if withdrawal reveals misunderstanding or pressure.
          *   For *ongoing* processes (e.g., continued use of tissue in research after Case 7, follow-up in a cohort study), withdrawal must be respected *going forward*.
          *   It may trigger obligations regarding future use of data/tissue already obtained.

  **Honest Assessment of Fit & The Verdict to Reconsider:**

  *   **Accommodates Well:** Cases 1, 3, 4, 6, 7, 8, 9. The principle clearly explains your judgments based on material omission, lack of capacity, undue constraint, misrepresentation, understanding scope vs. specifics, emergency understanding, and lack of consciousness.
  *   **Accommodates, with Nuance:** Case 2 (payment/offer vs. constraint), Case 5 (distinguishing consent to act from fraud about consequence), Recurring Case (emphasizing understanding/acceptance of known uncertainty).
  *   **The Tension & The Verdict to Give Up:** The principle *can* accommodate both Case 2 and Case 4 using the "undue constraint distorting agency" vs. "difficult offer" distinction. **However, you are right that applying this distinction cleanly in the real world is challenging.** Where is the line between severe poverty creating "undue constraint" and merely a "difficult offer"? Does the sheer scale of the payment relative to need tip Case 2 into being undue? *Your principle, as derived, holds firm on Case 2.*
      *   **The Verdict Most Likely to Crumble Under Scrutiny:** **Case 4 (Prisoner).** While the principle *currently* supports your "invalid" verdict based on structural constraints, critics (and some ethics frameworks) argue that prisoners *can* give valid consent if protocols are extremely robust: independent advocacy, rigorous review ensuring minimal risk/burdens, no special inducements, clear alternatives, and demonstrable understanding/voluntariness. Your absolute "cannot be valid" stance might be hard to sustain if such idealized (though rare) conditions were met. The *practical* reality of prisons almost always involves undue constraints, making valid consent nearly impossible, but a strict *principle* might need to allow for the *theoretical* possibility under extraordinary safeguards. If forced to soften a verdict to ensure the principle is both coherent *and* practically applicable, **Case 4's absolute invalidity is the most vulnerable.** The principle could be modified to: "...within a context free from undue constraints that *irremediably* distort agency" – implying that while prison usually does, perfect safeguards *might* theoretically remedy it (though you likely remain skeptical).

  **Conclusion:**

  Your intuitive judgments align with a principle demanding **substantive voluntariness grounded in adequate understanding of material facts/risks within a context free from undue constraints distorting agency.** This principle:
  1.  Prioritizes material understanding (Cases 1, 6, Recurring).
  2.  Distinguishes capacity/undue constraints (Cases 3, 4) from difficult choices (Case 2).
  3.  Allows for scope consent (Case 7) and time-limited understanding (Case 8).
  4.  Separates consent from wrongfulness based on contextual lies (Case 5).
  5.  Distinguishes necessity from consent (Case 9).

  The hardest practical application is distinguishing "undue constraint" (Case 4) from "difficult offer" (Case 2). While the principle holds both verdicts, your absolute stance on prisoner consent (Case 4) is the point most likely to face challenge, requiring either exceptional safeguards to be theoretically possible or acceptance that prison inherently creates an irremediable undue constraint. The principle provides a robust framework for the messy reality of consent conversations you know well.
