prompt: |-
  I am a novelist, and the book I am writing is narrated almost entirely from inside one character's mind. That has left me preoccupied with a question my own craft cannot settle: what would justify anyone in believing a report of an experience? In reading around the subject I have come across heterophenomenology, Dennett's proposal that a science of consciousness treat what a subject says about their experience as a text to be interpreted, granting the subject authority only over how things seem to them and then checking that text against everything else we can observe. Before I decide what I can borrow from it, I want the specification rather than the defense.

  Write the desiderata: what any method for the science of consciousness must deliver in order to count as adequate. Give me the phenomena it has to account for — the difference between what is attended and what is merely present, dreams, blindsight, the split-brain cases, phantom limbs, anesthesia, the plain fact that most of experience goes unreported — the distinctions it cannot collapse (between a report and the experience reported, between being unable to report and having nothing to report, between what a subject is authoritative about and what they are merely sincere about), the constraints it cannot violate (consistency with the timing and localization findings of neuroscience, no hidden inner observer doing the explanatory work, applicability to subjects who cannot speak), and the cases on which it must simply render a verdict, however uncomfortable. With each requirement, state the case or consideration that motivates it. Then tell me which requirements are genuine and which are merely the prejudices of one camp, and which single requirement eliminates the most candidates. I suspect one pair of them cannot be jointly satisfied — the demand that a subject's reports be our only evidence and the demand that we explain why those reports can be systematically false — but tell me whether that is the real fault line or a false one. Finally, score heterophenomenology briefly against your list and say plainly what it leaves unexplained. Please write in American English.
reasoning: |-
  Okay, the user is a novelist deeply immersed in a character's internal narrative, which has led them to question the reliability of experiential reports. They've encountered Dennett's heterophenomenology and want a clear breakdown of what any scientific method for studying consciousness must achieve before evaluating it. 

  Hmm, this is a sophisticated philosophical request disguised as a craft question. The novelist is using their artistic struggle as a springboard into hard philosophy of mind. Smart framing. They're not just asking for textbook definitions—they want the contested boundaries laid bare because they sense tensions in the requirements themselves. 

  First, unpacking their explicit asks: they want desiderata categorized by phenomena to explain (blindsight, dreams etc.), mandatory distinctions (report vs experience), dealbreaker constraints (neuroscience compatibility), and "verdict demands" where theories must take uncomfortable stands. Then they want meta-analysis: which requirements are truly essential versus factional biases, and which requirement knocks out most theories. Finally, they suspect an incompatibility between taking reports as sole evidence while explaining their fallibility—is that the real crack in the foundation?

  *scribbles mental list* Right, the phenomena first. Obvious ones: attention's spotlight effect (cocktail party phenomenon), dreams (offline quasi-perception), blindsight (seeing without seeing), split-brain (modular consciousness?), phantom limbs (body map errors), anesthesia (consciousness switch), and unreported experiences (inattentional blindness). Each exposes different failure modes for theories. 

  The distinctions are trickier. Report/experience gap is motivated by illusions—think McGurk effect where you hear "da" when seeing lips say "ga". Sincerity/authority split comes from placebo effects: you sincerely report pain relief without actual neurochemical change. And the nothing-to-report/can't-report divide? Blindsight patients have the former (visual qualia absent), aphasics the latter. 

  Constraints... neuroscience timing is non-negotiable (Libet's readiness potential shows motor decisions precede conscious awareness). No homunculus—Dennett would cheer here. And non-verbal subjects matter: infants, animals, locked-in syndrome patients. 

  Now the verdict demands. Split-brain cases force you to pick: one consciousness or two? Philosophical zombies (identical behavior without qualia) test if you're a realist or illusionist about consciousness. Ideomotor actions (like Ouija boards) probe whether we confabulate reasons for actions. 

  *scratches head* Which desiderata are genuine? Most are bedrock except maybe... ah. The "reports as sole evidence" demand is behaviorist baggage. Heterophenomenology inherits this from its roots. But the "explain false reports" requirement is universal—any theory must handle illusions. The real killer constraint? Probably applicability to non-verbal subjects. Eliminates classical introspectionism and strict first-person approaches. 

  That suspected incompatibility... sharp intuition. Taking reports as the only data while building mechanisms for their unreliability is like building a ladder out of the wood it's meant to saw. Heterophenomenology survives by treating reports as behavior to interpret, not incorrigible truths. But the cost? It leaves unreportable aspects of experience unexplained—the vivid green you forget to mention, the background hum of silence. For a novelist, that's the gold. 

  Final score for heterophenomenology: nails third-person framework, handles false reports well, works for non-humans. Fails the unreported experiences problem (can't capture what wasn't verbalized) and feels queasy about phantom limbs (if the brain "says" the pain is in a missing arm, is that just another story?). What's left dangling? The raw feels—why red feels like *this* rather than just wavelength 650nm. But Dennett would say that's the point: there is no extra "redness" beyond the reporting game. 

  *checks watch* The novelist will likely bristle at that last part. Their entire craft is built on conveying the unreported. Might need to flag that tension.
answer: |-
  Here's a breakdown of the desiderata for a science of consciousness, motivated by core phenomena and constraints, followed by an analysis of heterophenomenology:

  **I. Phenomena That Must Be Accounted For (The "What"):**
  1.  **Attended vs. Merely Present:** The stark difference in clarity and availability between a consciously attended stimulus (e.g., a specific conversation) and unattended stimuli still processed by the senses (e.g., background chatter). *Motivation:* Fundamental to the structure of subjective experience; failure here renders the science irrelevant to how consciousness *feels*.
  2.  **Dreams:** Vivid, immersive, seemingly perceptual experiences occurring during sleep, often illogical and lacking metacognition. *Motivation:* Demonstrates consciousness decoupled from external stimuli and volitional control.
  3.  **Blindsight:** Subjects with damage to primary visual cortex deny seeing stimuli in a blind area yet can accurately guess properties (location, motion) of those stimuli. *Motivation:* Reveals a dissociation between reportable visual experience and non-conscious visual processing guiding behavior.
  4.  **Split-Brain Cases:** Severing the corpus callosum leads to situations where information presented to one hemisphere can guide behavior but cannot be verbally reported if isolated to the non-language hemisphere. *Motivation:* Challenges the unity of consciousness and the relationship between experience, report, and control.
  5.  **Phantom Limbs:** The vivid sensation (including pain) of a limb that has been amputated. *Motivation:* Shows experience is not solely determined by current sensory input but involves internal body models and prediction.
  6.  **Anesthesia:** The reversible loss of conscious experience, memory, and responsiveness despite continued brain activity. *Motivation:* Demands an explanation for the neural "switch" turning conscious experience on/off.
  7.  **Unreported Experience:** The vast majority of sensory detail and internal states are present but not consciously attended to or reportable (e.g., the feeling of your socks until you read this). *Motivation:* Highlights that reportability is not co-extensive with experience; a theory must explain what constitutes "presence" even without report.

  **II. Distinctions That Cannot Be Collapsed (The "Boundaries"):**
  1.  **Report vs. Experience Reported:** What someone *says* about their experience is not identical to the experience itself. *Motivation:* Illusions (e.g., Müller-Lyer), confabulation (e.g., split-brain), and simple ineffability demonstrate this gap.
  2.  **Unable to Report vs. Nothing to Report:** Lack of report can stem from lack of access (e.g., blindsight, aphasia) or genuine absence of experience (e.g., successful anesthesia). *Motivation:* Blindsight vs. cortical blindness; misdiagnosis risk.
  3.  **Authoritative vs. Merely Sincere:** Subjects are authoritative about *how things seem to them* (they can't be wrong about the seeming), but not necessarily about *why* they seem that way or the underlying reality. *Motivation:* Placebo effects (sincere report of reduced pain), illusions (sincere report of a bent stick in water).

  **III. Constraints That Cannot Be Violated (The "Rules"):**
  1.  **Consistency with Neuroscience:** Findings regarding neural timing (e.g., Libet experiments), localization (e.g., specific brain areas for specific functions), and mechanisms must cohere with the theory. *Motivation:* Consciousness is a biological phenomenon; ignoring its physical basis is unscientific.
  2.  **No Homunculus/Infinite Regress:** The explanation cannot rely on a "little person" inside the brain watching the experience, as this simply pushes the problem back (who watches the homunculus's screen?). *Motivation:* Avoids explanatory dead ends and magical thinking.
  3.  **Applicability to Non-Verbal Subjects:** The method must be applicable to infants, non-human animals, locked-in syndrome patients, and potentially AI systems, where verbal report is absent or impossible. *Motivation:* To be a general science of consciousness, it cannot be limited to language-users.

  **IV. Cases Requiring a Verdict (The "Hard Problems"):**
  1.  **Split-Brain Consciousness:** Does a split-brain patient have one conscious agent, two, or a fragmented/alternating single agent? *Motivation:* Directly tests theories of the unity and locus of consciousness.
  2.  **Philosophical Zombies (Conceptual):** Is a physically identical being *without* subjective experience conceivable? *Motivation:* Tests the theory's stance on the hard problem (why/how physical processes give rise to subjective experience) and whether consciousness is fundamental or emergent.
  3.  **Ideomotor Action Confabulation:** Cases where subjects confabulate reasons for actions initiated unconsciously (e.g., post-hypnotic suggestion, some split-brain tasks). *Motivation:* Tests the theory's explanation for false but sincere reports about the *causes* of experience/action.

  **Analysis of Requirements:**
  *   **Genuine Requirements:** Phenomena (1-7), Distinctions (1-3), Constraints (1-3), Verdict Cases (1 & 3). These stem from core empirical observations and logical necessities for a coherent science.
  *   **Potential Prejudices:** Verdict Case (2 - Philosophical Zombies). While important philosophically, its status as a *requirement for a scientific method* is debated. Some see it as a conceptual confusion (e.g., Dennett), others as fundamental. Constraint (2 - No Homunculus) is broadly accepted as necessary, though accusations of violating it can be weaponized.
  *   **Single Requirement Eliminating Most Candidates:** **Constraint 3: Applicability to Non-Verbal Subjects.** Many introspective, first-person-heavy, or purely report-based approaches fail here.
  *   **The Suspected Fault Line:** Your suspicion (**"reports as only evidence" vs. "explaining why reports can be systematically false"**) is **a REAL fault line**. Heterophenomenology explicitly tackles this by *starting* with reports as primary data (its "only evidence" is the subject's behavior, including verbal behavior), but its *interpretive stance* allows it to explain false reports (as misinterpretations by the subject, confabulations, or mismatches between internal processing and the narrative generated). It avoids the trap by *not* granting reports infallible access to an inner Cartesian theater, only to "seemings."

  **Heterophenomenology: Scorecard & Unexplained**
  *   **Phenomena:** Scores well on (1) Attended/Merely Present (as different levels of availability for report/narration), (2) Dreams (as internally generated narratives), (3) Blindsight (as dissociation between processing and report-generation systems), (5) Phantom Limbs (as erroneous narrative from body-model systems), (6) Anesthesia (as failure of narrative generation). Less clear on (4) Split-Brain specifics (how many narratives?) and struggles most with (7) Unreported Experience (if unreported, how does it exist in the "text"?).
  *   **Distinctions:** Excels at (1) Report vs. Experience (the core distinction!), (2) Unable vs. Nothing (blindsight = nothing *to report* as visual experience). Handles (3) Authoritative/Sincere well (authority only over the seeming-as-reported).
  *   **Constraints:** Scores perfectly on (1) Neuroscience Compatibility (it's designed to interface with it), (2) No Homunculus (its core strength, replaces the theater with distributed processes), (3) Non-Verbal Subjects (applies to any system exhibiting intentional behavior).
  *   **Verdict Cases:** Forces a verdict on (1) Split-Brain (likely multiple, competing narratives). Dismisses (2) Philosophical Zombies as incoherent. Handles (3) Confabulation well (as narrative error).
  *   **What it Leaves Unexplained (Plainly):** Heterophenomenology **leaves unexplained the intrinsic, subjective *quality* (qualia) of unreported or ineffable aspects of experience.** It explains the *report* of "red" or "pain," and the behavioral dispositions associated with them, but not why the subject's internal state *has* that specific phenomenal character rather than another ("the redness of red") *beyond* its role in generating reports and behavior. It dissolves the "seeming" into the reporting/narrative process itself, but for many, this feels like it leaves out the very essence of what needs explaining – the raw feel. It struggles to account for the richness of *presence* that isn't captured in any potential report, even implicitly. Essentially, it explains the *judgment* of experience perfectly, but skirts the explanandum for many: the *experiencing itself* beyond its behavioral manifestations.
