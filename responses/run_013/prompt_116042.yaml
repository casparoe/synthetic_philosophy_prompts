prompt: |-
  I'm doing a masters module on moral responsability and I've got to bring in a literary case to sit alongside Strawson's Freedom and Resentment, and I've picked Frankenstein. My angle is that the creature is the perfect test case for the objective attitude: nearly everyone he meets takes one look at him and stops treating him as a participant, and starts treating him as a problem to be managed, chased off or destroyed. But he never stops being a participant himself — he resents, he accuses, he argues about what he's owed, and by the end he's practically begging Walton to sit in judgement on him. What I want from you is a proper reading of the novel through this lens: which scenes show the objective attitude being taken towards him and by whom, where does he manage to force his way back into the exchange of attitudes, and is Victor's refusal to meet him as anything other than a disaster the real crime of the book? My supervisior thinks Strawson's account has a hole here — the reactive attitudes are supposed to track the quality of someone's will, but they also seem to depend on whether we already count someone as one of us, and he never says where that counting comes from. If she's right, does the novel dramatise exactly that gap, i.e. is the creature's problem that he was never admitted to the moral community in the first place rather than anything about his will? Then be honest about where the reading strains: he's also just an unbearably lonely person who wants a friend, and there's a lot of metaphysics about souls and natures floating around in there that Strawson would want to bracket off. Finish by saying what the novel adds to the debate that the philosophy on its own can't.
