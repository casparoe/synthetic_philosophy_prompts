  I run a weekly lunch-and-learn for the backend and infra folks on my team -- 10 to 12 people, 45 minutes, one room with a whiteboard, everyone eating a sandwich, and honestly maybe 30 minutes of real attention before someone opens their laptop. I never took a real logic or set theory course (CS degree, dodged anything that smelled like pure math), but I keep bumping into Zorn's lemma in write-ups about formal verification and compiler stuff, and I've realized I can recite the statement and still have no feel for what it's doing. What I want is an activity where the team runs into the weirdness themselves before I say the word "Zorn": the thing where you're guaranteed that some maximal state exists, you're forced into one by purely local moves, and yet nobody can name it in advance, nobody can say it's the best one, and two groups doing the same thing from the same starting point end up stuck in different places. They should walk out feeling the gap between "there's always somewhere to go from here" and "there has to be a place where you can't go any further," and between maximal and maximum, without me ever putting a definition on the board. What I don't want is a lecture with a chain diagram and an arrow.

  So: design the game. I'm thinking 3 or 4 tables of 3-4 people each, and each table works on one shared "state" -- I'll leave it to you what the state actually is (a configuration, a schedule, a set of claims, a build order, whatever gives you clean legal-move rules), with the rule that a move either extends the state or it's illegal, and there's no undo. The crucial thing I want built into the rules is a merge/consolidation move: any run of accepted extensions should be combinable into a single legal state that counts as "at least as far along" as everything in the run, and that merged state has to still be legal by the same rules -- I'm told the place real proofs do their actual work is checking that the merged thing still qualifies, so I want a rule where that check can genuinely fail if you're sloppy. Then I want two twists. First, each table should have one or two players with a secret preference about where things end up, so the path taken is contested and the endpoint is path-dependent -- different tables starting from the same seed should end up in different stuck states, and I'd love for at least one of those stuck states to be obviously not the best one by the table's own standards. Second, I want a moment where a table discovers it cannot get to a state it can plainly describe, because nothing legal bridges the gap -- and they should not be able to tell whether that's because the state is unreachable or because the rules just happen to strand them there. Also, please make sure the game doesn't accidentally teach them that the lemma is about a process terminating; as I understand it, it's not that chains are finite, it's that every chain has an upper bound that's still inside the set, and that alone forces a maximal element. If there's a clean way to stage a run that would go on forever if it could, and gets absorbed instead, do that.

  Then the debrief, which is the part I'll actually be running, so I need it written out: a mapping from each moment in the game onto the pieces of the lemma (the set of legal states, the ordering, what counts as a chain, what the merge is, what "stuck" is, and where the hypothesis actually lives), phrased so I can say it out loud without a formal background. Tell me honestly which part of the idea the activity cannot reproduce and that I'll have to supply myself -- my guess is that the game makes it feel inevitable that you end up stuck, but the fact that the chain condition *entails* a maximal element is a proof, not an experience, and I don't want to fake that. Tell me what predictably goes wrong the first time: I'd bet someone insists the stuck state must be the best state, someone tries to undo a move, someone tries to route around a merge by sneaking in an illegal extension, and one table finishes in six minutes and starts heckling. Give me the fixes for each, and a second round or variant I can drop in when it runs short. Keep it runnable with just a whiteboard and index cards -- no printing, no laptops. And finish with a last line that reads exactly "Bottom line:" followed by one sentence naming the single mechanic that's doing all the heavy lifting.
