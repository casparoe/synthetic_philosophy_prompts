  ### Game Design: "Constraint Build"

  **Core Idea**: Players collaboratively build a "constraint set" by adding rules one by one. The state is a set of rules that must remain consistent (no contradictions). The goal is to cover as many "items" as possible, but rules can conflict in hidden ways. Players have secret preferences for certain items, influencing the path. The game forces players into maximal states (no more rules can be added) that aren't necessarily maximum (best coverage), demonstrating path dependence and the non-constructive nature of Zorn's lemma.

  #### Materials per Table (3-4 players):
  - **Item cards**: 5 index cards labeled A, B, C, D, E.
  - **Rule cards**: 10 blank index cards (for writing rules during gameplay).
  - **Conflict graph**: A small whiteboard diagram (or drawn on paper) showing item relationships:
    ```
    A ─── B ─── C
      ╲   │   ╱
        ╲ │ ╱
          D
          │
          E
    ```
    *(Edges imply potential conflicts; no direct A-C edge)*
  - **Secret goal cards**: 2 cards per table (e.g., "You want B covered" and "You want E covered").
  - **Marker**: For writing rules on blank cards.

  #### Rules:
  1. **Start state**: Empty rule set. **Goal**: Cover items (A-E) by adding rules like "If A is covered, then B must be covered" or "D excludes E".  
  2. **Moves**:
     - **Add a rule**: Write a new rule on a blank card. It must:
       - Reference ≥1 uncovered item.
       - **Extend** the state (add new constraints without contradicting existing rules).
       - Be **consistent** (e.g., no rule like "A and not A").
     - **Illegal moves**: Rules that contradict existing ones or don’t reference new items.
  3. **Merge/consolidation**: If the table has a sequence of accepted rules (a "run"), they can **merge** them into one unified rule that captures all constraints. The merged rule must:
     - Be checked for consistency (e.g., merging "If A then B" and "If B then not C" → "If A then not C" is valid; "A and not A" is invalid and fails the merge).
     - Count as "at least as far along" as the individual rules (covers all items they did).
  4. **No undo**: Rules are final once added.
  5. **Stuck state**: No new rule can be added without inconsistency. Game ends when all tables are stuck.

  #### Setup:
  - **Seed state**: All tables start identically (no rules, all items uncovered).
  - **Secret goals**: Assign 2 players per table secret goals (e.g., "Prioritize covering B" or "Prioritize covering E").
  - **Round 1 (15 mins)**: Tables build their constraint sets. Encourage mergers of rule sequences.

  #### Twists Embedded:
  1. **Path dependence**: Secret goals create tension. Example:
     - *Player 1 (wants B)* pushes "If A then B", blocking direct coverage of A.
     - *Player 2 (wants E)* pushes "D excludes E", blocking D+E coverage.
     - Tables diverge: One gets stuck allowing {B, D} but not A or E; another gets {A, C, E} but not B or D.
  2. **Unreachable "best" state**: The "maximum" state (covering all items) requires rules like "A and D" or "B and E", but the conflict graph makes these impossible due to hidden dependencies (e.g., A→B→D conflicts with D→E→?).
  3. **Merge failure**: If a table tries to merge "If A then B" and "If A then not B", the merge fails (inconsistency). This mirrors the "upper bound must be valid" hypothesis.
  4. **Infinite chain absorption**: A table might try to add endless "If X then Y" rules. The **merge** forces consolidation into a single rule (e.g., "If A then Z"), cutting off the infinite chain.

  #### Predictable Issues & Fixes:
  - **"Stuck state is best!"**: Some tables cover 3 items, others 2. Debrief: Maximal ≠ maximum.
  - **Undo move attempt**: Remind: "No undo. Like in Zorn, chains move forward."
  - **Illegal extension**: Reject and explain: "Contradicts rule X. Check the conflict graph."
  - **Fast table heckling**: Assign them to audit other tables’ mergers for consistency.
  - **Short round**: Run a **variant round** where tables swap states and try to extend another table’s stuck state (they can’t).

  #### Debrief Mapping (for You):
  - **"State"**: A consistent set of rules (partial order: set inclusion).
  - **"Ordering"**: Rule set A ≤ B if B extends A (adds constraints without contradiction).
  - **"Chain"**: A sequence of rule sets where each extends the previous (e.g., R1 ⊆ R2 ⊆ ...).
  - **"Merge"**: The union of a chain’s rules. **Crucial**: This union must be consistent (upper bound in the set).
  - **"Stuck"**: Maximal state—no extension possible without inconsistency.
  - **"Hypothesis"**: Every chain has an upper bound (the merged rule set) that’s **still valid**. The game enforces this via merge consistency checks.
  - **Gap in the activity**: The game makes maximal states *feel* inevitable, but the lemma’s proof (that chain bounds → maximal element) is non-constructive. **Supply this**: "Zorn guarantees a maximal element exists, but unlike the game, it doesn’t say how to find it—or that it’s unique."

  #### Bottom Line:
  **Closure under merging chains forces a stuck state, even when no path leads to the "best" outcome.**
