answer: |-
  ## The Pasadena Gamble: Undermining Expected Utility or Exposing Its Necessary Boundaries?

  The Pasadena game, and its insidious twin the Altadena game, present decision theory with a uniquely unsettling challenge. Unlike the St. Petersburg paradox, where infinite expectation forces a confrontation with unbounded utility or resource constraints, the Pasadena problem lurks in the twilight zone of *undefined* expectation. A fair coin is flipped until the first heads on toss `n`. The payoff is `(-1)^{n+1} * (2^n / n)`. The resulting series for expected value, `Σ [ (1/2^n) * (-1)^{n+1} * (2^n / n) ] = Σ (-1)^{n+1}/n`, converges conditionally to `ln(2) ≈ 0.693`. However, conditional convergence is notoriously fragile; reordering the terms allows this sum to converge to *any real number*, or even diverge. Consequently, the expected value is undefined within the standard framework of absolute convergence required for the Strong Law of Large Numbers and the unambiguous application of expected utility theory (EUT). The standard deflationary move is simple: EUT only governs prospects with well-defined expectations. Faced with Pasadena, rationality imposes no specific preference; simply avoid it or remain indifferent.

  Enter Altadena. This game is identical to Pasadena in every respect except one: the payoff for any sequence ending on the `n`th toss is exactly `1` unit *more* than the Pasadena payoff for that `n`. State by state, outcome by outcome, Altadena yields a strictly better result than Pasadena. It’s a textbook case of statewise dominance. Yet, crucially, Altadena’s expectation series `Σ [ (1/2^n) * ((-1)^{n+1} * (2^n / n) + 1) ] = Σ (-1)^{n+1}/n + Σ (1/2^n)` inherits the conditional convergence (and thus undefined expectation) of the Pasadena term, while adding the absolutely convergent geometric series summing to `1`. The sum of a conditionally convergent series and an absolutely convergent series is itself conditionally convergent and just as susceptible to reordering manipulation. Altadena’s expectation is just as undefined as Pasadena’s. The deflationary move now seems catastrophically inadequate. How can EUT, the preeminent theory of rational choice under uncertainty, possibly remain silent when one option is demonstrably worse in *every conceivable future*? If rationality doesn't demand a strict preference for Altadena here, what *does* it demand? This is the core tension: the deflationary response appears to sacrifice a fundamental principle of rational dominance on the altar of mathematical definability.

  **Weighing the Responses:**

  1.  **Deflationism ("Just Don't Play / No Defined Preference"):** Proponents argue that EUT's domain is rightly restricted. Undefined expectations signal a pathological prospect where the core machinery (averaging utilities weighted by probability) breaks down. Rationality doesn't require us to have preferences over every conceivable gamble; incompleteness is acceptable. Regarding dominance, they might argue that the concept itself presupposes a well-defined set of states and payoffs *that can be compared*, but the pathological nature of these games subtly undermines this. The "states" are defined by the infinite sequence of flips, but the payoff structure is so entangled with the ordering dependence inherent in conditional convergence that the standard, clean state-by-state comparison might be conceptually illicit. The verdict: Accept incompleteness; rational agents need not prefer Altadena.
      *   **Weakness:** This feels deeply unsatisfying and *ad hoc*. It dismisses a powerful, intuitive dominance intuition without a compelling reason rooted in rationality itself, only in mathematical technicality. It makes rationality seem blind to obvious, statewise superiority.

  2.  **Dominance Principle (Lexical Priority):** This view holds that statewise dominance is such a fundamental axiom of rationality that it *must* override the limitations of expectation calculations. If A > B in every state, then A is strictly preferred to B, *regardless* of whether their expectations are defined, infinite, or undefined. Rationality requires preferring Altadena. EUT, therefore, needs extension to incorporate dominance as a lexically prior principle, applying even when expectations fail.
      *   **Strength:** Directly addresses the core intuition. Preserves a bedrock principle of rational choice.
      *   **Weakness:** How far does this extend? Does it apply to *all* undefined expectation cases, or just those arising from conditional convergence? What about other pathologies? It potentially opens the door to complex, non-archimedean decision structures where dominance trumps *any* expectation-based reasoning, complicating the theory significantly. It also doesn't tell us *how much better* Altadena is, only that it is better.

  3.  **Extension via Summation Methods:** Could we "fix" the expectation by mandating a specific summation method? Cesàro summation? Abel summation? These methods often assign the "correct" value (`ln(2)` to Pasadena, `ln(2) + 1` to Altadena) by averaging partial sums or using limiting processes less sensitive to rearrangement. We then define expectation using this method.
      *   **Strength:** Provides a definite expectation, restoring EUT's applicability. Clearly ranks Altadena above Pasadena.
      *   **Weakness:** This seems arbitrary. *Why* choose Cesàro over other methods? It lacks the foundational justification of the standard (absolute convergence) approach tied to long-run frequency. It feels like a technical patch rather than a deep solution. It also doesn't resolve the underlying fragility – the expectation value depends entirely on our chosen summation convention, not an inherent property of the gamble itself.

  4.  **The Ill-Posed Question:** A subtler deflationary argument suggests that the very description of the Pasadena/Altadena games presents an ill-posed problem *for preference formation*. The infinite state space combined with the extreme, oscillating payoffs tied to low-probability events makes the prospect "ungraspable" in a way that prevents the formation of a stable, rational preference, *even though* statewise dominance holds. Rationality might require preferences only over prospects we can meaningfully comprehend or which have stable statistical properties; these games fail that test.
      *   **Strength:** Acknowledges the deeply weird nature of the gambles.
      *   **Weakness:** This is vague. When *exactly* is a prospect too ill-posed? It risks making rationality overly subjective or dependent on cognitive limitations. More importantly, the statewise dominance seems perfectly graspable *despite* the expectation pathology, undermining this as a reason to ignore dominance.

  **The Verdict: EUT Requires Substantial Extension via a Robust Dominance Principle**

  The deflationary response, while mathematically coherent, is ultimately inadequate and philosophically costly. Rationality cannot remain silent in the face of statewise dominance. To dismiss the intuition that Altadena is preferable because both expectations are undefined is to allow mathematical formalism to override a core tenet of rational choice – avoiding dominated options is fundamental. The "ill-posed question" argument fails to negate the clear, state-by-state superiority of Altadena; we *can* grasp that relationship even if the overall expectation is elusive. Non-standard summation methods provide an answer but lack a compelling justification for choosing one method over another; they feel like imposing an answer rather than discovering one inherent in the structure of rational choice.

  Therefore, **expected utility theory needs to be substantially extended to incorporate statewise dominance as a lexically prior principle.** When one prospect strictly dominates another across all states of the world, rationality demands a strict preference for the dominant prospect, *irrespective* of the definability, finiteness, or even existence of their expected utilities under standard summation. This dominance principle must hold even for prospects as pathological as Pasadena and Altadena.

  **The Cost and the Condition:**

  This extension comes at a price. It moves EUT away from being a *purely* expectation-based theory in its application. It introduces a potential non-archimedean element: dominance strictly trumps any expectation calculation, even when expectations *are* defined and finite. We lose the elegant simplicity of a single, expectation-based criterion for *all* choices. Furthermore, this principle primarily tells us *that* Altadena is preferable to Pasadena; it doesn't provide a cardinal measure *how much* better it is, nor does it easily tell us how Altadena compares to a safe $1.00 (though dominance might still apply if we frame the comparison carefully).

  **The condition for this verdict is clear:** if we accept statewise dominance as a non-negotiable axiom of rationality – that it is fundamentally irrational to choose an option known to be worse in every possible scenario – then EUT *must* be extended to enforce this preference even in the realm of undefined expectations. The Pasadena/Altadena dilemma doesn't show EUT failing utterly; it exposes a boundary where its core expectation-maximization machinery is insufficient and must be supplemented by a more fundamental principle of dominance. To do otherwise is to allow rationality to be defeated by a mathematical technicality in a case where the rational course of action – choosing the dominating option – seems blindingly obvious. Rationality demands we prefer Altadena; any adequate theory of rational choice must reflect that demand.
