prompt: |-
  I am assembling a case bank for work on the situationist critique of virtue ethics, and I need one case designed to a specification rather than recalled. The target is a specific gap: the situationist critique, and much empirical work on character that follows it, treats cross-situational consistency of behavior as the observable mark of a trait. But it is not obvious that consistency — even consistency in genuinely good conduct — is sufficient for virtue. I want a case that isolates that gap by holding everything else fixed, so that the disagreement turns on one feature rather than on a general clash of outlooks.

  Build a single scenario meeting all of the following specifications.

  1. It contains a person whose conduct in one morally relevant respect is highly consistent across a broad range of ordinary situations — consistent enough that no behavioral test applied to those situations would separate them from someone who is genuinely virtuous in that respect.

  2. That consistency must be sustained by a standing policy the person carries with them, not by an environmental cue. This matters: if the regularity lives in the situation, the situationist can claim it without argument and the case loses its point.

  3. The person must nevertheless lack practical wisdom, in these concrete senses: they cannot articulate why the policy matters or what it is for; they apply it rigidly, without tracking the morally relevant features of the situations they meet; and they would apply it even where doing so produces a bad result. The rigidity must be psychologically mundane — the way most people follow rules they absorbed rather than reasoned out — not a disorder.

  4. The conduct the policy yields must be good, not merely conventional or self-serving. Choose one of the following: keeping promises, returning what is borrowed, or coming to the aid of someone in need.

  5. The person is otherwise unremarkable: no psychopathology, no brain injury, no hypnosis, drugs, coercion, or mind control, and no role or vocation treated as a special exemption from the question. The setting is ordinary — workplace, neighborhood, family, school.

  6. Do not recycle the familiar demonstrations (the seminary study in which students in a hurry failed to help, the found-coin helping study, the obedience and prison experiments). The regularity should be one an ordinary reader would recognize from their own life.

  7. Identify at least one situation in which the rigid policy and a practically wise response would diverge, and confirm that this situation falls outside the set over which the behavioral consistency was established — so that the behavioral data really are indistinguishable while the characterological difference is real.

  After the scenario, give me a JSON object with exactly these fields.

  - "scenario": one paragraph of prose.
  - "virtue_targeted": the virtue in question, in a phrase.
  - "sampled_situations": array of strings, the situations across which the conduct is consistent.
  - "standing_policy": the internal regularity, stated as the agent would state it.
  - "why_internal": why the regularity belongs to the agent rather than to the environment.
  - "phronesis_profile": object with fields "articulacy", "exception_sensitivity", "outcome_sensitivity", each a short string giving the evidence for the deficit.
  - "divergence_situation": the situation where policy and practical wisdom part ways.
  - "divergence_outside_sample": boolean.
  - "verdicts": array of exactly three objects, each with "position", "verdict" ("counts as virtue" or "does not count"), and "reasoning". The positions are: virtue ethics read as requiring only a stable disposition to good action; virtue ethics read as requiring practical wisdom; and the situationist critique.
  - "load_bearing_feature": the single feature of the case on which the disagreement turns.
  - "removal_tests": array of exactly three objects with "change", "predicted_effect", and "which_verdict_moves". The three changes are: make the agent practically wise; make the policy track morally relevant features; relocate the regularity into the environment.
  - "defender_reply": object with "position" (whichever fares worst), "strongest_reply", and "assessment" (whether it succeeds).
  - "specification_check": array of objects with "specification" (referring to the numbered items above), "met" (boolean), and "how".
  - "cheating_check": whether the verdicts are generated by the positions themselves or merely stipulated by the scenario's construction.
  - "bottom_line": what the case establishes, how far it generalizes, and what further case would be needed to extend it.

  The scenario must earn its verdicts rather than assume them; if you find that you can only get the three positions to disagree by building the disagreement into the description of the agent, say so plainly in "cheating_check" rather than papering over it.
reasoning: |-
  We are building a case to isolate a gap in the situationist critique: consistency in behavior is taken as the mark of a virtue, but we want a case where there is consistency without practical wisdom (thus without virtue) and then show that the behavioral data would be the same as a virtuous person's in the sampled situations.

  Specifications:
  1. Consistent conduct in one moral respect (choose: keeping promises, returning borrowed things, or aiding those in need).
  2. Consistency due to a standing policy (internal to the agent, not environmental).
  3. Lack of practical wisdom: cannot articulate why, rigid application, no tracking of morally relevant features, would apply even when bad. Psychologically mundane.
  4. The conduct must be good (not conventional or self-serving). We choose "returning what is borrowed".
  5. Ordinary person, ordinary setting.
  6. Not a recycled study (like seminary, found-coin, obedience). Should be recognizable.
  7. Identify a divergence situation (where rigid policy and practical wisdom would differ) and it must be outside the sampled situations.

  Let's design the case:

  Virtue: Returning what is borrowed (or keeping promises, but we choose returning borrowed).

  Scenario: 
  - Character: Clara, an office worker in her 30s. 
  - Policy: She has a standing rule: "Return anything borrowed as soon as possible, no matter what." 
  - Consistency: Across a wide range of situations (borrowing office supplies, books, tools, money, etc.) she returns the item promptly, often the same day or the next day. 
  - Lack of practical wisdom: 
     - She cannot explain why this is important beyond "it's the rule" or "it's what you do". 
     - She does not adjust for circumstances. For example, if someone borrows her book and says, "Take your time, I won't need it for months," she still returns it the next day. 
     - She would return an item even if doing so causes harm (e.g., returning a borrowed umbrella during a downpour when the lender is away and she needs it to get home, but she returns it anyway because she borrowed it and must return it asap).
  - The behavior is good: returning borrowed items is a good thing, and she does it consistently.

  Sampled situations: These are the ordinary situations where she returns items promptly. They are situations where the borrowed item is no longer needed by the borrower and the lender is not in urgent need of it. Examples: 
     - Returning a borrowed pen after using it for a meeting.
     - Returning a book the day after it was borrowed because she finished it quickly.
     - Returning a small amount of money the next day when she gets change.

  Divergence situation: 
     - Suppose Clara borrows a power tool (like a drill) from her neighbor to hang a picture. The neighbor says, "Keep it for the weekend in case you need it again." But Clara returns it immediately after using it, even though the neighbor is not home and leaves it on the porch (risking theft) because her policy is to return asap. Alternatively, a more dramatic example: 
     - During a heavy rainstorm, Clara borrows her colleague's umbrella to go to a nearby building for a meeting. The meeting runs long, and it's still raining heavily when she returns. The colleague is in a meeting and won't need the umbrella until the end of the day. Clara, however, feels compelled to return the umbrella immediately. She leaves it at the colleague's desk, but then she has to walk to her car in the rain without protection, getting soaked and risking illness. A practically wise person would recognize that the colleague doesn't need the umbrella right now and that returning it immediately is harmful to herself and unnecessary. They would wait until the rain stops or until they can return it without harm.

  Why is this divergence situation outside the sample? The sampled situations are ordinary, low-stakes borrowing and returning. They do not involve situations where returning immediately would cause harm (like bad weather or risk of theft) or where the lender has explicitly said there is no hurry. So the behavioral consistency is established over a set of situations that do not include such conflicts.

  Now, the JSON:

  - scenario: one paragraph
  - virtue_targeted: "returning borrowed items"
  - sampled_situations: array of strings, e.g., ["returning a borrowed pen after a meeting", "returning a book the next day after finishing it", "returning borrowed money the next day when she gets change"]
  - standing_policy: "Return anything borrowed as soon as possible, no matter what."
  - why_internal: The policy is a rule she carries in her mind and applies regardless of the environment. Even when the environment doesn't demand immediate return (e.g., the lender says take your time), she still follows her internal rule.
  - phronesis_profile: 
     - articulacy: "Cannot explain why returning is important beyond 'it's the rule'."
     - exception_sensitivity: "Applies the policy rigidly; returns items even when the lender says there is no hurry."
     - outcome_sensitivity: "Would return an item even when doing so causes harm (e.g., returning an umbrella during heavy rain, causing herself to get soaked)."
  - divergence_situation: "Returning a borrowed umbrella immediately during a heavy rainstorm when the lender is unavailable and doesn't need it until later, causing herself harm."
  - divergence_outside_sample: true (because the sampled situations are ordinary ones without such harm or conflict)

  Verdicts:
  Three positions:

  1. Virtue ethics (only stable disposition to good action): This position might say that Clara counts as virtuous because she consistently does the right action (returning borrowed items) across many situations.

  2. Virtue ethics (requiring practical wisdom): This position would say Clara does not count as virtuous because she lacks understanding and flexibility; she acts without practical wisdom.

  3. Situationist critique: The situationist, who takes cross-situational consistency as the mark of a trait, would say that Clara has the trait (because she is consistent) and thus would count her as having the virtue.

  But note: the situationist critique is about whether traits exist, and they use consistency as evidence. In this case, they would observe consistency and thus attribute the trait. But we are setting up a case where the trait (in the full virtue sense) is not present. So:

  - Position 1: VE (minimal) -> counts as virtue (because of consistency in good action).
  - Position 2: VE (full, requiring phronesis) -> does not count.
  - Position 3: Situationist (using consistency as the mark) -> counts as virtue (because they take consistency to indicate the trait).

  But note: the situationist critique might not be committed to saying that consistency is sufficient for virtue, but rather that it is the observable mark of a trait. And they might argue that virtue ethics requires traits that are consistent, so if they find inconsistency, they critique virtue ethics. In this case, they see consistency, so they would say the trait exists. But the case is designed to show that consistency alone (without wisdom) is not virtue. So the situationist, by their own criterion, would attribute the trait (and thus the virtue) because of the consistency.

  Verdicts array:

  [
    {
      "position": "virtue ethics (minimal: stable disposition to good action)",
      "verdict": "counts as virtue",
      "reasoning": "Clara's behavior is consistently good in returning borrowed items across a wide range of situations, which is the hallmark of a virtuous disposition in this respect."
    },
    {
      "position": "virtue ethics (requiring practical wisdom)",
      "verdict": "does not count",
      "reasoning": "Virtue requires not only doing the right action but doing it for the right reasons and with understanding. Clara's rigid rule-following without appreciation for context or the good at stake shows a lack of practical wisdom."
    },
    {
      "position": "situationist critique",
      "verdict": "counts as virtue",
      "reasoning": "The situationist takes cross-situational consistency in behavior as the empirical indicator of a character trait. Since Clara's behavior is consistent, she is attributed the trait of being virtuous in returning borrowed items."
    }
  ]

  Load bearing feature: The case turns on whether consistency in behavior (without practical wisdom) is sufficient for virtue.

  Removal tests: We change the case and see what happens.

  1. Change: Make the agent practically wise.
     - Predicted effect: Now she would have the understanding and flexibility, so even the VE (requiring phronesis) would count her as virtuous. The divergence situation would be handled wisely.
     - Which verdict moves: The VE (requiring phronesis) moves from "does not count" to "counts".

  2. Change: Make the policy track morally relevant features.
     - Predicted effect: The rigidity is gone. Now the policy is sensitive to context. Again, VE (requiring phronesis) would count it.
     - Which verdict moves: VE (requiring phronesis) moves to "counts".

  3. Change: Relocate the regularity into the environment.
     - Example: Suppose the consistency is due to an environmental cue (e.g., every time she borrows something, she gets a reminder notification on her phone that forces her to return it). Then the situationist might not attribute the trait to her, because the behavior is situationally driven.
     - Predicted effect: The situationist would no longer attribute the trait (since the behavior is controlled by the situation). So the situationist verdict moves to "does not count".
     - Which verdict moves: situationist moves from "counts" to "does not count".

  Defender reply: We pick the position that fares worst. The situationist critique might be the one that fares worst because they are forced to call Clara virtuous even though she lacks practical wisdom. The strongest reply from the situationist: "We are only claiming that consistency is evidence for a trait, but we might allow that traits can be more or less sophisticated. However, in this case, the behavior is consistent, so we have evidence of a trait. Moreover, the trait might be a 'low-level habit' rather than a full virtue, but that still counts as a character trait." But then we note that the situationist critique targets virtue ethics by showing that people are not consistent, so when they are consistent, they are attributing the trait. But the case shows that consistency can be present without virtue (as understood by the full VE account). The assessment: the reply does not fully succeed because it concedes that the trait might not be a virtue in the full sense, but the situationist critique typically uses consistency as the mark of the kind of trait that virtue ethics posits. If the situationist allows that consistency can be present without practical wisdom, then they are not capturing the virtue ethics concept. So the defender reply might not fully succeed.

  Specification check: We go through each spec and say how it is met.

  Cheating check: We did not build the disagreement into the agent description. The agent is described as having consistent behavior without wisdom, and the positions are applied to that description. The verdicts come from the theoretical commitments of the positions.

  Bottom line: The case establishes that behavioral consistency alone is not sufficient for virtue (as understood in the full sense requiring practical wisdom). It generalizes to any virtue where a rigid rule-following might produce consistent good behavior in ordinary contexts but fails in more complex ones. To extend it, we would need a case where the divergence situation is still within the ordinary set but the agent fails to adjust, but that might break the consistency requirement. Alternatively, we might need a case where the rigid policy leads to good behavior even in the divergence situation by luck, but the agent still lacks wisdom.

  Now, writing the scenario paragraph:

  "Clara is a conscientious office worker. She has a steadfast rule: return anything borrowed as soon as possible, no matter what. She returns pens, books, tools, and money promptly, often the same day. Her colleagues admire her reliability. However, Clara cannot explain why this matters beyond 'it's the rule'. She returns items even when the lender says there's no hurry, and she once returned an umbrella during a downpour because she had borrowed it, leaving herself without protection and getting drenched. In ordinary borrowing situations, her behavior is indistinguishable from that of a virtuous person, but she lacks understanding of when and why to make exceptions."

  Now, the JSON.
answer: |-
  ### Scenario
  Clara, a mid-level manager at a logistics firm, operates by an unwavering personal rule: "If I borrow it, I return it within 24 hours, no exceptions." She consistently returns borrowed items—tools, books, office supplies, or money—promptly and unprompted across diverse everyday contexts. When a coworker lends her a specialized calculator for a report, she returns it cleaned and organized by the next morning. When her neighbor loans gardening shears for weekend use, she drops them off Sunday night despite the neighbor’s "keep them all week" offer. Her consistency extends to loaned conference materials, shared stationery, and even a borrowed bicycle pump. Colleagues describe her as "unfailingly reliable." Yet Clara cannot articulate why this matters beyond "it’s the right thing to do," applies the rule rigidly even when circumstances make immediate return unnecessary or counterproductive, and admits she would return a borrowed fire extinguisher during a minor kitchen flare-up "because rules are rules." Her mindset is ordinary—a habit ingrained by childhood routines—with no psychological anomalies. The conduct is objectively good: it builds trust, respects ownership, and prevents resource hoarding.

