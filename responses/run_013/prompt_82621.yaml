answer: |-
  Your analysis captures a genuine tension in Ayer's position in *Language, Truth and Logic* (LTL), stemming directly from his logical positivism and verificationism. Let's reconstruct the argument charitably, clarify Ayer's claims (distinguishing text from reconstruction), and diagnose your difficulty.

  **Charitable Reconstruction of Ayer's Argument:**

  1.  **The Self as Logical Construction (Textual):** Ayer explicitly denies the existence of a substantive Cartesian ego or soul persisting through time. He argues that statements about "a person" or "the self" are not statements about a mysterious underlying entity but are *logical constructions* out of statements about sense-experiences (sense-data) and the relations between them (primarily co-consciousness and memory links). "Person P exists at time T" is equivalent to "There exists a series of experiences occurring at T which stand in the appropriate relations (especially spatio-temporal and causal continuity with a living body) to experiences constituting P at earlier times." (LTL, Ch. VII, esp. pp. 127-132 in the 1936 edition).
  2.  **Survival: Not Logically Impossible (Textual & Reconstructed):** Ayer explicitly states that the survival of bodily death is not a *logical* contradiction. Why? Because we can *conceive* of a description: "We can conceive of experiences occurring which are not causally dependent on a living body, and which stand in the appropriate memory and character relations to the experiences that formerly constituted a particular person (e.g., 'John Smith')." Since this description doesn't violate the laws of logic (it's not like "square circle"), it's logically possible. (LTL, pp. 132-134).
  3.  **Survival: An Empirical Question (Textual):** Ayer states the question of survival is empirical. He argues it must be settled by evidence accessible to sense-experience (verification principle). (LTL, p. 134).
  4.  **The Problem of Evidence (Textual & Reconstructed):** Ayer then argues we *lack* any such evidence. Crucially, he ties the *identity* of the post-mortem person to the *evidence we could have* for that identity. The only conceivable evidence would be the post-mortem entity exhibiting memories and character traits continuous with the deceased person. However:
      *   *Textual:* Ayer argues that any evidence purporting to show this (e.g., mediumistic communications) could *always* be explained away as fraud, coincidence, cryptomnesia, or telepathy among the living. It could never *conclusively* establish that the experiences originate from the *disembodied* consciousness of the deceased rather than some other source. (LTL, pp. 134-136).
      *   *Reconstructed Implication:* Since the identity of the person is constructed from relations (like memory) that are *themselves* only known through empirical evidence (which we lack in this case), there's no way to empirically verify the claim that the post-mortem experiences belong to the *same* person rather than constituting a *new* person (or no genuine "person" at all in Ayer's sense).

  **The Work of the "Logical Construction" Claim:**

  *   **Eliminates Substantive Self:** It removes the need for a persistent "soul" as the bearer of identity. Identity becomes a matter of relations *between* experiences.
  *   **Reduces Identity to Relations:** It defines personal identity *solely* in terms of specific psychological (memory, character) and physical (bodily continuity) relations holding between experiences over time.
  *   **Makes Identity Verifiable (in principle):** Identity claims become claims about the presence of these relations, which should be verifiable by observing experiences (e.g., testing memory reports, observing bodily continuity).
  *   **Creates the Tension (Unintentionally):** By making identity *depend* on empirically verifiable relations, it makes post-mortem identity claims *in principle unverifiable* because the crucial link – the living body providing the spatio-temporal anchor and causal nexus – is gone. The relations themselves (like memory) become impossible to reliably attribute to the *disembodied* source rather than another cause.

  **Your Difficulty: Diagnosis**

  Your core difficulty ("What makes a post-mortem experience belong to the same person? What counts as evidence?") is **a genuine tension in Ayer's position**, arising directly from his verificationism combined with the logical construction view:

  1.  **The Identity Criteria Vacuum:** Ayer's logical constructionism tells us identity *is* constituted by relations (memory, character, bodily continuity). However, when bodily continuity vanishes at death, he doesn't provide a clear, non-circular criterion for what *specific relations* (or what *degree* or *type* of memory/character link) would constitute the *same* person surviving, versus a *new* person emerging with similar characteristics. He gestures towards memory and character continuity as the relevant relations for survival, but without the body, how do we verify these links genuinely connect to the *past* person and aren't just similar experiences happening now?
  2.  **The Verification Trap:**
      *   To *be* the same person, the post-mortem experiences must stand in the "appropriate relations" (memory, character) to the ante-mortem experiences.
      *   To *know* (verify) they stand in those relations, we need empirical evidence.
      *   But the only evidence we could get (reports of memories, displays of character) is inherently ambiguous without the bodily link. It could always be explained as *resemblance* or *similarity* in a *new* stream of experience, or as caused by other means (fraud, telepathy among living minds). There is no *conclusive* test possible.
      *   Therefore, according to Ayer's own verification principle, the statement "This post-mortem experience stream is the *same person* as John Smith" becomes **meaningless** or at best **unverifiable in principle** – not because it's logically impossible, but because we lack any conceivable way to gather the evidence required to establish the crucial identity-constituting relations. He says it's "empirical," but simultaneously argues we can have no empirical evidence sufficient to settle it. This is the core tension.
  3.  **Your Specific Scenario (No Memory/Link):** Ayer would almost certainly say that a post-mortem stream of experiences with *no* memory links, character continuity, *or* bodily connection to John Smith **does not constitute John Smith's survival**. It's simply a *new* person (if it constitutes a person at all - disembodied experiences might not meet his criteria for a "person" without *some* connection to the physical world). Identity requires *some* relevant relation(s). He implies memory/character continuity is key for survival claims (since bodily continuity is gone). Without any links, there's no basis for calling it the *same* person. The problem arises when there *are* apparent links, but we can't verify they are genuine identity-constituting relations rather than coincidental similarities or caused by other factors.

  **Conclusion:**

  Your difficulty arises because you've correctly identified the consequences of Ayer's verificationist framework colliding with his logical construction view of the self in the context of survival:

  1.  **Textually:** Ayer *does* claim survival is logically possible but empirically unverifiable due to the lack of conclusive evidence for the identity-constituting relations (memory/character continuity) in a disembodied context.
  2.  **Tension:** The deep tension is that the verification principle, applied rigorously, renders statements about disembodied personal identity *meaningless* because the very relations that *constitute* the identity cannot be empirically verified as holding between the ante-mortem and post-mortem streams. He wants to say it's an empirical question, but his own epistemology implies it's unanswerable and therefore, by his own standards, perhaps not genuinely empirical or meaningful.
  3.  **Your Scenario:** On Ayer's view, no memory/psychological links = no survival. The problem is establishing that apparent links *are* genuine identity-constituting relations when the body is gone. He leaves the criteria vague and the possibility of verification non-existent.
  4.  **Source:** This is a genuine tension within Ayer's position, not just a misunderstanding on your part. Later philosophers of personal identity (like Derek Parfit) would explicitly grapple with the problem of specifying identity criteria without a substantive self, showing how difficult it is to avoid such tensions. Ayer's verificationism exacerbates the problem by demanding evidence that his own view makes impossible to obtain conclusively.

  Essentially, Ayer's logical constructionism provides the *form* of an answer (identity is relations between experiences), but his verificationism prevents him from giving any *content* to the claim of disembodied survival, rendering it an empty possibility. The survival question highlights a vulnerability in his attempt to reduce personal identity to empirically verifiable relations while excluding the possibility of verifying those relations in the very scenario where the question becomes most pressing.
