answer: |-
  Here’s a thought experiment meeting your specifications, followed by analysis:

  ### Case: The Fragile Friend
  Sam is a manager reviewing Jordan, a consistently average employee. Jordan’s work is unremarkable—neither deficient nor excellent—and Sam feels neither admiration nor disdain. However, Jordan’s close friend Taylor struggles with severe depression and bases their self-worth on others’ opinions of Jordan. Taylor has no insight into Jordan’s actual performance. If Sam expresses even mild praise for Jordan, Taylor’s mood lifts significantly, reducing their risk of self-harm. If Sam is neutral or critical, Taylor spirals into despair. Sam faces no personal consequences: no workplace backlash, no impact on relationships beyond this dynamic. The *only* reason for Sam to admire Jordan is to prevent Taylor’s suffering. Admiring Jordan would misrepresent his mediocrity, but withholding admiration harms Taylor.

  ### Audit
  - **Attitude in question**: Sam’s *admiration* for Jordan’s work.  
  - **FAA verdict**: Admiration is fitting because there’s a decisive reason (preventing Taylor’s suffering) to hold it. Thus, Jordan’s work is *admirable*.  
  - **Correct verdict**: Jordan’s work is not admirable—it’s objectively mediocre. The reason to admire is orthogonal to its merits.  
  - **Escape hatch blocked**:  
    - This isn’t a reason to *want* to admire or *fake* admiration. Sam’s genuine admiration (if cultivated) *directly* alleviates Taylor’s distress.  
    - The reason is intrinsic to *holding* the attitude: admiration’s psychological effect on Taylor, not its instrumentality for Sam.  
  - **Key feature**: The reason arises from the attitude’s *causal impact on a vulnerable third party*, decoupled from the object’s properties.  
  - **Feature removed**: If Taylor’s reaction *reflected* Jordan’s merit (e.g., Taylor only despairs if Jordan *is* incompetent), the reason becomes evidential. Your trap is avoided because Taylor’s distress is a standalone psychological fact.  

  ### Defense & Counterargument  
  **Strongest defense**: "Reasons of the right kind (RKR) are those that *respond to the object’s features*, not contingent effects of holding the attitude. FAA only counts RKR, defined non-circularly as reasons that *constitute* (not merely cause) a fitting response."  

  **Does it survive?**  
  - **No**—unless "constitutive" is question-begging. The defense must *stipulate* that RKR exclude third-party welfare effects, but this risks circularity: RKR are defined as those that make attitudes fitting, which is the analysandum. Your case forces a choice:  
    1. Reject the reason as "not the right kind," admitting RKR requires prior value judgments (collapsing FAA into circularity).  
    2. Accept the reason, inflating value (calling mediocrity "admirable").  
  - **Stipulation strength**: The case *requires* Taylor’s reaction to be non-evidential, but this is secured by the setup (Taylor’s fragile psychology is arbitrary). If the defender insists *all* non-object-focused reasons are "wrong-kind," they owe a non-circular criterion for "focus"—which your case shows may not exist.  

  **Verdict**: The case holds if we grant that non-evidential, third-party welfare can provide genuine reasons for attitudes. Its power lies in exposing FAA’s dependency on an unmotivated restriction of "fittingness" to object-grounded reasons. Removing the third-party vulnerability *would* restore the demon case’s escape hatch (self-interest), but here, no self-interest exists. The defense’s appeal to RKR either collapses into circularity or concedes the counterexample.  

  ---  
  This satisfies your constraints: no self-interest, non-evidential third-party effect, ordinary context, and forces FAA to overvalue the object. The defender’s appeal to RKR either fails non-circularity or admits defeat.
