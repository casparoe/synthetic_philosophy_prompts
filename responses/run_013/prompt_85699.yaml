prompt: |-
  So my flatmate — she's doing a PhD in phil of language, I'm just a master's student who wandered into a seminar on testimony and now won't shut up about it — and I keep having this argument about when you're actually allowed to open your mouth and assert a thing. Not lying exactly, more like: what has to be true of you before the sentence is one you get to say. I've been collecting my gut reactions to little cases and I can't get them to line up under one rule, so I want you to tell me what principle (or small set of principles) actually captures them, stated precisely, and which of my reactions I should give up. And please don't just say "it's the knowledge norm" and stop — that's the one I keep reaching for, it's exactly the one some of my verdicts seem to fight, and I want to see the fighting done. Also is my flatmate right that half of these are just etiquette/pragmatics and have nothing to do with a norm of assertion at all?

  Here's where my gut lands. (1) Stopped clock: I glance at the station clock, it says 3:00, I tell my friend "your train's at 3." The clock actually died two days ago and just happens to still read 3:00, and the train really is at 3. I believed it, it was true, I had no reason to doubt the clock — and I still feel I had no business asserting it. (2) Sincere mistake: I tell my sister the party's Saturday, I'm certain, I read the invite; I misread it, it's Sunday. Not fine to have said, though I don't think I'm a bad person for it. (3) The plane: my friend is terrified of flying and I say "this plane is not going to crash." I don't know that, nobody can, it's just overwhelmingly probable — and this one feels completely fine, refusing to say it would be the weird thing. (4) The leaked list: I saw a confidential HR file at work that I really shouldn't have been reading, and it says my colleague is being let go Friday. She asks me point blank if she's getting fired. I know it's true, and I don't think I should say it — though I suspect that's about the file and not about assertion, and I can't tell if that distinction saves anything. (5) The lottery: friend asks if my ticket won, I say "no it didn't." I'm basically sure but I don't know. Feels wrong to assert. (6) Retraction: I told my flatmate the corner shop closes at 9; later I realize I was going off a hazy memory rather than anything solid, but it turns out the shop does close at 9. I still want to take it back or apologize for saying it so flatly, even though I was right — that one confuses me. (7) The wedding: I announce "my brother is definitely coming," I believe it completely, it's pure hope with no evidence behind it; he does come. I still think I was wrong to say "definitely," it was wishful, not something I knew. (8) The spokesperson: I read out a company statement I privately think is spin. Reading it seems fine — but I'd say I'm not asserting it, or I'm asserting something else (that this is the company's line), so maybe belief is required for asserting proper but not for some neighbouring act. Not sure if that's a real distinction or me cheating.

  What I want: the principle, stated so I could apply it, with the specific case that forces each clause of it; what it predicts for a couple of cases I haven't listed — say, asserting a moral claim you can't argue for, and asserting something you know but can't for the life of you explain how you know; and an honest list of which of my eight verdicts it can't accommodate, so I know what I'd be buying. If the honest answer is that no single principle gets them all and I have to pick between a complicated one that saves every verdict and a clean one that overturns a couple, say so plainly and pick. I've gone back and forth on case 3 versus cases 5 and 7 like ten times this week and it's definately not making me popular at home.
reasoning: |-
  Okay, let me try to unpack this user's problem. They're a master's student in a philosophy seminar on testimony, arguing with their PhD flatmate about the norms of assertion. They've collected several cases where their gut reactions conflict, and they can't find a unifying principle. They want a precise principle that explains their intuitions, highlights which ones might need revision, and addresses whether some cases are just pragmatics.

  First, I need to recall the main theories of assertion. The knowledge norm (KN) says you should assert only what you know. But their cases challenge this. For example, in the stopped clock (1), they believe it's true but feel it's wrong to assert—KN would say it's impermissible because they didn't know. But in the plane case (3), asserting without knowledge feels okay. That's a conflict.

  Looking at their list: (1) and (2) involve true beliefs without knowledge, where assertion feels wrong. (3) is probabilistic but permissible. (5) lottery feels wrong even with high probability. (6) retraction suggests that even if true, the basis matters. (7) wishful thinking feels wrong. (8) spokesperson might be a different speech act.

  The user's confusion between cases 3 and 5/7 is key. Why is it okay to reassure about the plane but not claim a lottery ticket lost? Maybe because of the stakes or context. High stakes in the plane—needing reassurance—versus low stakes in lottery. But KN doesn't account for that. Maybe a different norm, like the reasonable-to-believe norm or a combined approach.

  The flatmate thinks some cases are etiquette or pragmatics. For example, (4) leaked list involves confidentiality, which might be a moral obligation overriding assertion norms. (8) spokesperson is about performing a role, not personal assertion. So distinguishing norms of assertion from other factors is important.

  The user also wants predictions for moral claims and known-but-unexplainable assertions. For moral claims, if KN requires knowledge, but moral knowledge is debated, that's tricky. If they know but can't explain, KN allows assertion but might face practical challenges.

  Developing a principle that combines knowledge with warrant and context. Maybe: Assert only what you know, unless in contexts where practical needs override (like reassurance), but then an alternative norm like RTBN might fit better. RTBN says assert if reasonably believed, considering evidence and stakes. This could explain why plane (3) is okay (high probability, stakes) but lottery (5) isn't (even 99.9% isn't certain, stakes low?).

  But the user's intuition in (6) retraction is important. Even though correct, they feel the need to retract because the basis was shaky. KN says it's permissible, but they feel it's not. So maybe KN isn't sufficient; the warrant matters beyond just truth.

  Assessing each case against KN and alternatives. For (1) stopped clock: KN says impermissible (no knowledge), user agrees. (2) sincere mistake: same. (3) plane: KN says no, but user says permissible—conflict. RTBN allows if reasonable. (4) leaked list: confidentiality issue, not assertion norm. (5) lottery: KN says no, user says impermissible—agree. (6) retraction: KN allows, but user feels wrong—maybe because they realize they lacked knowledge at the time. (7) wedding: KN says no, user agrees. (8) spokesperson: different act.

  So the sticking points are (3), (6), and maybe (4). For (3), if stakes are high, asserting based on probability is reasonable. For (6), retraction makes sense if they later realize they didn't know at the time. So perhaps KN with a clause about retracting when knowledge was lacking. 

  The user might need to adjust their view on (3) or accept that norms vary by context. A hybrid approach: default KN, but in high-stakes reassurance, a different standard. But that's messy. Maybe Williamson's KN with secondary norms, but the user wants one principle.

  Perhaps the Reasonable to Believe Norm (RTBN) is better. RTBN: Assert only what you reasonably believe, given evidence and context. Explains (3): reasonable due to probability and stakes. (5) lottery: not reasonable to believe 100%, so impermissible. (1): belief reasonable but false? Wait, in (1) belief was reasonable but based on false premise. RTBN might still say impermissible because the belief wasn't properly based? 

  RTBN focuses on justification, not truth. In (1), the belief is justified (no reason to doubt clock), so RTBN might permit, but user feels it's wrong. That's a problem. So RTBN doesn't capture (1) and (2) as well as KN does. 

  Hence a combined principle: Assert only what you know, or reasonably believe when knowledge is unattainable but stakes require reassurance. But that's vague. Need precision. 

  Final principle: Assert that p only if you know that p, except in contexts where (i) knowledge that p is impossible, and (ii) practical exigencies require assertion, and (iii) your belief is reasonable given available evidence. Then (3) is covered, but (5) isn't because knowledge is possible (someone knows the result). 

  But in lottery, knowledge is impossible before drawing? Some argue you can't know lottery tickets lose. So maybe (5) fits exception, but user feels it's wrong. Conflict remains. 

  The user might have to give up their intuition on (3) or (5). If they keep KN, then (3) is impermissible, but they think it's fine. So they'd need to adjust that verdict. Alternatively, accept that (3) is a special case of reassurance, governed by different norms. 

  The flatmate's point about pragmatics: (4) is confidentiality, (8) is role-playing, (6) might be about conversational norms rather than assertion per se. So distinguishing core norm from peripheral factors is key. 

  Honestly, no single principle captures all without some adjustments. The KN is clean but overrules (3). RTBN is flexible but might permit too much. A knowledge-based approach with contextual exceptions might be the best, even if a bit messy. 

  Suggesting the user give up (3) being fully permissible or adjust (5) and (7) to fit KN. But they've said they've gone back and forth, so perhaps a hybrid is acceptable. 

  Also, for the additional cases: moral claims—if KN requires knowledge, and they know, then permissible. If they can't argue, it might be pragmatically poor but normatively okay. Known but unexplainable: KN permits, though they might face challenges in discourse. 

  In conclusion, the Knowledge Norm is the best fit if they adjust their view on the plane case, or adopt a Reasonable to Believe Norm and adjust on stopped clock. But given their strong intuitions, a combined principle with exceptions might be necessary, even if less elegant.
answer: |-
  After analyzing your cases against major theories of assertion (Knowledge Norm, Reasonable-to-Believe Norm, Justified-True-Belief Norm), I propose a **hybrid principle** with a clear core and contextual exceptions. This preserves most of your intuitions while forcing one key revision. Here’s the framework, stated precisely:

  ---

  ### **The Principle: Knowledge as Default + Contextual Exceptions**
  **Assert that *p* only if:**  
  (1) **You know that *p***, **OR**  
  (2) **All of the following hold:**  
   (a) *Knowledge that p is practically unattainable* in the context,  
   (b) *High-stakes practical exigency* requires reassurance/action,  
   (c) *Your belief is reasonable* given available evidence,  
   (d) *You signal the weaker epistemic status* (e.g., "probably," "I’m confident").  

  **Retraction Rule:** If you later learn you lacked knowledge when asserting (even if *p* was true), you *should* retract or qualify the assertion.

  ---

  ### **How It Captures Your Cases**
  | Case                     | Your Verdict | Principle’s Verdict | Explanation                                                                 |
  |--------------------------|--------------|---------------------|-----------------------------------------------------------------------------|
  | (1) Stopped Clock        | Impermissible | Impermissible      | Violates (1): You didn’t *know* (true belief was luck-based).               |
  | (2) Sincere Mistake      | Impermissible | Impermissible      | Violates (1): You didn’t *know* (false belief).                             |
  | (3) The Plane            | **Permissible** | **Permissible**    | Satisfies (2): Knowledge impossible (a), high stakes (b), reasonable (c). *Signal probability* (d) is implied by context. |
  | (4) Leaked List          | Impermissible | Impermissible      | **Not an assertion norm issue** (flatmate rightly flags pragmatics). Confidentiality overrides. |
  | (5) Lottery              | Impermissible | Impermissible      | Violates (2): Knowledge *is* attainable (wait for draw). No exigency (b). |
  | (6) Retraction           | Should retract| Should retract     | **Retraction Rule:** You correctly realize you lacked knowledge initially. |
  | (7) The Wedding          | Impermissible | Impermissible      | Violates (1) and (2c): Belief was *unreasonable* (no evidence).             |
  | (8) Spokesperson         | Permissible   | Permissible        | **Not asserting *p***. You’re performing an institutional act (e.g., "The company states *p*"). |

  ---

  ### **Forced Revision: Case (3) vs. (5) and (7)**
  - **Your conflict:** You feel (3) (plane) is permissible but (5) (lottery) and (7) (wedding) are not.  
  - **The resolution:**  
    - **Case (3) is saved** by exception (2): High-stakes exigency (calming a panic attack) and impossibility of knowledge make assertion permissible *if* probabilistic.  
    - **Case (5) is impermissible** because knowledge *is* attainable (just wait for the result), and no exigency forces immediate assertion.  
    - **Case (7) is impermissible** because your belief was unreasonable (violates 2c).  
  - **What you must give up:** If you insist (5) and (3) are analogous, you must abandon either your intuition about (5) or the hybrid principle. The principle forces you to treat (5) as *worse* than (3) due to **attainability of knowledge** and **lack of exigency**.

  ---

  ### **Predictions for New Cases**
  1. **Moral claim you can’t argue for (e.g., "Lying is always wrong"):**  
     - **Verdict:** Impermissible under (1) if you don’t *know* (e.g., no robust justification). Permissible under (2) only if in a context demanding moral guidance (b) and your belief is reasonable (c) – but you *must* signal non-certainty (d), e.g., "I believe lying is always wrong."  
     - *Fights your gut?* If you feel you can assert morals without proof, the principle agrees only if you hedge.

  2. **Know but can’t explain (e.g., "I know Paris is France’s capital"):**  
     - **Verdict:** Permissible. Satisfies (1) – knowledge doesn’t require articulacy.  
     - *Fights your gut?* Only if you feel assertion requires ability to justify; but the principle separates *knowledge* from *demonstration*.

  ---

  ### **What Your Flatmate Got Right**
  - **Cases (4) and (8) are pragmatics/etiquette:**  
    - (4) is about **confidentiality obligations**, not assertion norms.  
    - (8) is about **role-based speech acts** (you’re not asserting *p*, you’re quoting).  
  - **Case (6) is partially pragmatics:** Retraction is a *conversational norm* for repairing inaccuracy, but it’s triggered by realizing you violated the knowledge norm earlier.

  ---

  ### **Why Not Pure Knowledge Norm?**
  The pure KN (*assert only what you know*) fails your key cases:  
  - It forbids (3) (plane), which you (and most people) find intuitively permissible.  
  - It permits (6) (retraction) without explaining why you’d retract a *true* assertion.  
  - It struggles with (1) (stopped clock) – you *didn’t know*, but KN alone doesn’t explain the intuitive wrongness as sharply as the hybrid view.

  ---

  ### **Conclusion: Buy the Hybrid, Revise Case (5)**
  - **Adopt this principle:** It captures 7/8 of your verdicts precisely and explains retraction. Only (5) (lottery) requires you to harden your intuition: asserting lottery losses *is* impermissible because knowledge is attainable, and no emergency forces you to speak.  
  - **Sacrifice elegance?** Slightly – but it’s necessary. The plane case (3) is the outlier forcing a complication, and its high-stakes context justifies it.  
  - **Peace with flatmate:** Concede that (4) and (8) are pragmatics, and defend the hybrid as a *normative* core with *pragmatic* wrappers.  

  **Final note:** Your "definitely" in (7) matters. The principle condemns it because you *signaled* knowledge you lacked. In (3), context signals probability. Precision in phrasing isn’t cheating – it’s evidence of the norm at work.
