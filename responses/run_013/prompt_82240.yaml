answer: |-
  ### Exam Question: Death in Damascus with Twists

  **Instructions:** Answer all parts of the question. Justify your answers with explicit calculations and decision-theoretic reasoning. Time allocation: 90 minutes.

  ---

  **Scenario:**  
  You are in Damascus, and Death has informed you he will try to find you tomorrow. Death’s prediction about your choice is **80% reliable**: If he predicts you will be in a city, he will be there with 80% probability (and in the other city with 20%). You must decide whether to **stay in Damascus** or **flee to Aleppo**. Consider three variations:  

  1. **Base case (no special tools):** Death’s prediction is based on your deliberation.  
  2. **Coin-flip case:** You flip a fair coin (heads = stay, tails = flee). Death’s prediction was about the coin’s outcome (not your deliberation).  
  3. **Brain-scanner case:** Death used a brain-scanner to read your neural activity *during* deliberation, making his prediction.  

  **Questions:**  
  a) **Base case:** What does Evidential Decision Theory (EDT) recommend? What does Causal Decision Theory (CDT) recommend? Justify with probabilities and utilities (assume survival utility = 1, death = 0).  
  b) **Coin-flip case:** How does flipping a coin change (or not change) EDT’s and CDT’s recommendations? Justify.  
  c) **Brain-scanner case:** Does this blur the line between evidential and causal decision theory? Discuss whether the distinction collapses or holds.  

  ---

  ### Model Answer (Approx. 600 words)  
  **a) Base case recommendations:**  
  - **EDT (evidential):** Conditions on the *evidence* associated with the act.  
    - If you stay, it is evidence Death predicted you would flee (since he is 80% reliable).  
      - P(Death in Damascus | stay) = P(predicted Damascus | stay) × 0.8 + P(predicted Aleppo | stay) × 0.2.  
      - Reliability: P(predicted correct | act) = 0.8 → P(predicted Damascus | stay) = 0.2 (incorrect), P(predicted Aleppo | stay) = 0.8 (correct).  
      - Thus, P(Death in Damascus | stay) = (0.2 × 0.8) + (0.8 × 0.2) = 0.16 + 0.16 = 0.32.  
      - Survival chance if stay = 1 - 0.32 = 0.68? **No!** If Death is in Damascus (P=0.32) and you stay, you die. Survival chance = P(Death in Aleppo | stay) = 1 - 0.32 = 0.68? Wait, no:  
        - Correction: If you stay, you die *iff Death is in Damascus*. Thus, P(survive | stay) = P(Death in Aleppo | stay).  
        - From above: P(Death in Aleppo | stay) = 1 - P(Death in Damascus | stay) = 1 - 0.32 = 0.68? But earlier calculation:  
          - P(Death in Damascus | stay) = P(Death in Damascus | pred. Dam) × P(pred. Dam | stay) + P(Death in Damascus | pred. Ale) × P(pred. Ale | stay)  
          = (0.8)(0.2) + (0.2)(0.8) = 0.16 + 0.16 = 0.32.  
          So P(survive | stay) = 1 - 0.32 = 0.68? **Incorrect survival event!**  
        - Survival condition:  
          - If you **stay**, you survive *iff Death is in Aleppo*.  
          - P(survive | stay) = P(Death in Aleppo | stay) = 0.68? But wait, no:  
            - From joint: P(Death in Aleppo | stay) = P(pred. Aleppo | stay) × P(Death in Aleppo | pred. Aleppo) + P(pred. Damascus | stay) × P(Death in Aleppo | pred. Damascus)  
            = (0.8)(0.8) + (0.2)(0.2) = 0.64 + 0.04 = 0.68.  
          - Similarly, P(Death in Damascus | stay) = 0.32.  
          So P(survive | stay) = P(Death in Aleppo | stay) = 0.68? But then:  
    - If you flee:  
      - P(Death in Aleppo | flee) = P(pred. Aleppo | flee) × 0.8 + P(pred. Damascus | flee) × 0.2 = (0.8)(0.8) + (0.2)(0.2) = 0.64 + 0.04 = 0.68.  
      - P(survive | flee) = P(Death in Damascus | flee) = 1 - 0.68 = 0.32? **No:**  
        - If you **flee**, you survive *iff Death is in Damascus* (since you are in Aleppo).  
        - P(survive | flee) = P(Death in Damascus | flee) = 0.32 (as above).  
    - **EDT utilities:**  
      - Stay: EU = P(survive | stay) × 1 = 0.68  
      - Flee: EU = P(survive | flee) × 1 = 0.32  
      → **EDT recommends staying** (higher EU).  

  - **CDT (causal):** Uses *intervention* (do-operator) to break correlational links.  
    - Causal model: Your choice does not *cause* Death’s location; prediction is a confounder.  
    - Intervene on stay: P(survive | do(stay)) = P(Death in Aleppo) under intervention.  
      - Under intervention, prediction is independent of act. Assume P(pred. Damascus) = P(pred. Aleppo) = 0.5 (symmetric prior).  
      - P(Death in Aleppo) = P(pred. Aleppo) × 0.8 + P(pred. Damascus) × 0.2 = (0.5)(0.8) + (0.5)(0.2) = 0.4 + 0.1 = 0.5.  
      → P(survive | do(stay)) = P(Death in Aleppo) = 0.5.  
    - Intervene on flee: P(survive | do(flee)) = P(Death in Damascus) = 0.5 (same calculation).  
    - **CDT is indifferent** (both acts yield EU = 0.5).  

  **b) Coin-flip case:**  
  - **EDT:** Now conditions on the act, but the act is determined by a coin flip. Death predicted the *coin outcome* (not your deliberation).  
    - If you stay (coin = heads), P(survive | stay) = P(Death in Aleppo | heads).  
      - Reliability: P(correct prediction) = 0.8. Coin is fair, so:  
        - P(Death in Aleppo | heads) = P(pred. tails | heads) × 0.8 + P(pred. heads | heads) × 0.2.  
        - P(pred. heads | heads) = 0.8, P(pred. tails | heads) = 0.2.  
        - Thus, P(Death in Aleppo | heads) = (0.2 × 0.8) + (0.8 × 0.2) = 0.16 + 0.16 = 0.32.  
      → P(survive | stay) = 0.32? **Wait, survival event:**  
        - If you stay (heads), you survive *iff Death in Aleppo*. So P(survive | stay) = P(Death in Aleppo | heads) = 0.32.  
    - Similarly, P(survive | flee) = P(Death in Damascus | tails) = 0.32.  
    - **EDT now indifferent** (both EU = 0.32). The correlation between act and outcome vanishes; the coin breaks the evidential link.  

  - **CDT:** Intervention breaks correlational links, but the coin already severs causality between deliberation and act.  
    - P(survive | do(stay)) = P(Death in Aleppo) = 0.5 (same as base case).  
    - **CDT still indifferent** (EU = 0.5 for both).  

  **c) Brain-scanner case:**  
  - The brain-scanner reads neural activity *during deliberation*, making the prediction a *common effect* of your brain state and your eventual choice.  
  - **EDT:** Still conditions on the act, so recommendations match base case (stay recommended, EU=0.68).  
  - **CDT:** Intervention on the act breaks arrows *into* the choice, but the brain state (and thus prediction) is unchanged.  
    - P(survive | do(stay)) = P(Death in Aleppo) = 0.5 (same as base).  
    → CDT remains indifferent.  
  - **Evidential/causal distinction:** The brain-scanner **blurs but does not collapse** the distinction:  
    - The correlation is now *causally downstream* of deliberation (brain state → prediction → Death’s location), but EDT and CDT still use different probability structures (conditional vs. interventional).  
    - However, the scanner makes the correlation "causally transparent" – EDT and CDT *disagree* in the base case (stay vs. indifferent) but *agree* in the coin-flip case (both indifferent). The distinction persists but its consequences change.  

  ---

  ### Marking Scheme (Total: 20 points)  
  **a) Base case (6 points)**  
  - **EDT calculation (3 points):**  
    - Correct P(survive \| stay) = 0.68 and P(survive \| flee) = 0.32 (1 point).  
    - Explicit conditional probability setup (e.g., P(pred. Aleppo \| stay) = 0.8) (1 point).  
    - Clear recommendation: "EDT recommends staying" (1 point).  
  - **CDT calculation (3 points):**  
    - Correct use of intervention (e.g., P(Death in Aleppo \| do(stay)) = 0.5) (1 point).  
    - Justification of symmetric prior for prediction (1 point).  
    - Clear statement of indifference (1 point).  

  **b) Coin-flip case (6 points)**  
  - **EDT (3 points):**  
    - Correct EU for stay and flee (both 0.32) (1 point).  
    - Explanation of broken correlation: "Coin severs evidential link" (1 point).  
    - Recommendation: "EDT now indifferent" (1 point).  
  - **CDT (3 points):**  
    - EU remains 0.5 for both acts (1 point).  
    - Note that coin determines choice, but intervention unchanged (1 point).  
    - Recommendation: "CDT still indifferent" (1 point).  

  **c) Brain-scanner case (8 points)**  
  - **EDT and CDT recommendations (2 points):**  
    - Matches base case (EDT: stay, CDT: indifferent) (1 point).  
    - Explicitly links brain state to prediction (1 point).  
  - **Evidential/causal distinction (6 points):**  
    - **B-grade (3 points):** States distinction remains (EDT uses conditional, CDT uses interventional probabilities) but misses nuance.  
    - **A-grade (6 points):** Explains why distinction blurs (brain state is common cause; correlation is causal downstream) but holds. Notes agreement in coin-flip case and disagreement in base case. Discusses "causal transparency" (e.g., "Scanner does not collapse distinction but changes its consequences").  

  **Clarity and justification:** Deductions for unsupported claims or incoherent reasoning.  

  ---  
  **A-grade differentiator:** To achieve full marks in part (c), students must discuss how the brain-scanner affects the causal model (e.g., "brain state is a common cause") and explain why EDT/CDT *disagree* in the base case but *agree* in the coin-flip case, highlighting that the distinction persists but its implications are context-dependent.
