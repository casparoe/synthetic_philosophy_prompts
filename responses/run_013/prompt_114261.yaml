prompt: |-
  I'm a first-year PhD student in philosophy who has drifted into a social-choice reading group, and I keep meeting a summary of Harsanyi's aggregation theorem that I suspect is being made to carry more weight than it can bear. The version in front of me comes from the opening chapter of a well-regarded trade book by an economist writing for a general audience, and its gist is this: Harsanyi proved that a rational society must be utilitarian. The proof is supposed to be that a society whose collective preferences obey the expected-utility axioms, and which prefers whatever all of its members prefer, must rank social states by a weighted sum of individual utilities; and because each person behind the veil of ignorance has an equal chance of turning out to be anyone, the weights come out equal and the sum becomes an average, which the chapter says is just utilitarianism. It goes on to claim that this is why Arrow's impossibility theorem, which the chapter calls the central problem of welfare economics, is a problem only for ordinal rankings: once utilities are cardinal rather than ordinal, the impossibility evaporates and the social welfare function is uniquely pinned down as the utilitarian sum. The chapter closes by saying that Rawls's difference principle is now widely regarded as a mistake traceable to an unjustified assumption of extreme risk aversion on the part of the parties in the original position, and that most economists therefore treat utilitarianism as the correct standard for evaluating policy. There is also a footnote I don't follow which credits the same result with showing that people who share the same information cannot rationally disagree about values, so that persistent moral disagreement must be either ignorance or irrationality.

  I don't want to dismiss the chapter wholesale, since I assume most of it traces back to something real, but I'd like to know which sentences a social choice theorist would sign off on, which would make them wince, and which are simply wrong. In particular I want to know which of these conclusions are actually in the theorem and which are extra premises the summary has quietly added: if the equal weights, or the uniqueness, or the move from a total to an average each depends on something further, I want to know whose premise it is and how much work it does, and whether anything shifts once the population whose welfare we are aggregating is itself variable in size. I'd like the same treatment for the Rawls sentence and for the footnote, since I have a suspicion that the chapter's opponent is being set up in a way that Rawls himself would not recognise. Please finish by stating the strongest version of the chapter's conclusion, the version that survives every correction you make, and how far that version is from what the chapter actually asserts. I'm inclined to think the utilitarian conclusion doesn't come for free, but I can't see which step is where the cost is paid, so tell me plainly where the money changes hands. Write it as continuous prose, with no headings, bullet points, bold, or tables, the way you'd write a long email to a colleague who knows this literature better than I do, going sentence by sentence where that helps.
reasoning: |-
  Okay, the user is a first-year PhD student in philosophy who's stumbled upon a summary of Harsanyi's aggregation theorem in a popular economics book. They're skeptical about how the theorem is presented—specifically, that it proves society "must" be utilitarian—and want to dissect where the argument leans on extra premises versus what the theorem actually establishes. 

  First, I need to unpack Harsanyi's theorem carefully. The core result is that if individual preferences and social preferences satisfy the expected utility axioms, and the social preference respects unanimous individual preferences (Pareto), then social welfare must be a weighted sum of individual utilities. That's solid. But the jump to "equal weights" and "utilitarianism" isn't inherent to the theorem; it relies on the veil of ignorance, which is a separate normative move. The student is right to flag this. 

  The chapter also overclaims by saying Arrow's impossibility vanishes with cardinal utilities. While cardinality helps, it doesn't magically solve everything—Sen's critiques about interpersonal comparisons and distributional ethics still apply. The student seems aware of this gap but wants confirmation. 

  Then there's the Rawls dismissal. The chapter attributes the difference principle to "extreme risk aversion," but that's a misrepresentation. Rawls's original position is about fairness under ignorance, not risk aversion per se. The student suspects straw-manning here, and they're correct. 

  The footnote about moral disagreement being "ignorance or irrationality" is especially egregious. Harsanyi's framework assumes shared preferences under common information, but real-world value pluralism exists. The student likely sees this as philosophically naive—it is. 

  For the strongest surviving conclusion: Harsanyi shows that Pareto-optimal, EU-rational social preferences require *some* linear aggregation. But weights? Equality? Average vs. total? That's all extra. The veil of ignorance justifies equal weights only if you accept its premises (symmetry, rationality under risk), which Rawlsians and others reject. And variable populations? That's a whole other can of worms Harsanyi doesn't touch. 

  The user's deeper need is methodological: they want tools to critique interdisciplinary misappropriation of technical results. They're not just asking for corrections; they're learning how to spot when theorems are stretched to fit ideological narratives. I should emphasize where premises are smuggled in (e.g., the veil, cardinal comparability) and how each step narrows the conclusion's scope. 

  Final note: The chapter's "rational society must be utilitarian" is hyperbolic. The strongest defensible claim is far weaker: "Under specific axioms about rationality and unanimity, social welfare is linear in utilities—and if you add a controversial thought experiment, you *might* get equal weights." That's a far cry from "utilitarianism wins."
answer: |-
  You've pinpointed the exact pressure points where a popular summary strains under the weight it's asked to bear. Harsanyi's Aggregation Theorem (1955) is profound, but the chapter overloads it, blurring distinctions between mathematical result, normative interpretation, and contested premises. Let's dissect it sentence-by-sentence, separating Harsanyi's core machinery from the philosophical superstructure bolted onto it.

  **The Core Theorem vs. The Veil of Ignorance Add-On:**
  1.  **"Harsanyi proved that a rational society must be utilitarian."** *Wince.* The theorem demonstrates that *if* both individual preferences *and* social preferences satisfy the axioms of expected utility theory (EU), *and* the social preference satisfies a strong Pareto principle (if everyone weakly prefers A to B, society does too; if at least one strictly prefers A and no one prefers B, society strictly prefers A), *then* there exists a set of individual utility functions (cardinal, unique up to positive affine transformations) and a *single* cardinal social utility function such that **social utility is a weighted sum of individual utilities.** This is the core mathematical result: **linear aggregation**. Crucially, the weights are *not* necessarily equal; they are positive constants derived from the representation. Calling this "utilitarianism" already smuggles in interpretation.

  2.  **"...because each person behind the veil of ignorance has an equal chance of turning out to be anyone, the weights come out equal and the sum becomes an average..."** Here's where the "must be utilitarian" claim *actually* gets its weight, *but it's a separate argument*. Harsanyi's Impartial Observer Theorem (1953/1955) is distinct, though deeply related. It argues that an *impartial, rational* individual behind a veil of ignorance (knowing the social states but not which person they will be, with an equal probability of being anyone) would evaluate social states using the *expected utility* of being any person in that state. This expected utility is mathematically equivalent to the **average** of the individual utilities. *This* is where equal weights enter. However:
      *   **Cost Paid Here:** This relies entirely on the normative assumptions *of the veil scenario itself*: rationality under risk (EU axioms), impartiality (symmetry), and the **equal probability assumption**. Rawls famously rejects the probabilistic framework and the assumption that rational choice under uncertainty is the right model for justice. Many philosophers and some economists question whether this setup adequately captures fairness or impartial moral reasoning. The equal weights depend *entirely* on accepting this specific thought experiment and its assumptions about rationality under ignorance. It's not inherent to the aggregation theorem.
      *   **Average vs. Total:** The theorem gives a *weighted sum*. The veil argument justifies *equal weights*, making it a *weighted average*. But is it average or total? If the population size is fixed, maximizing average utility is equivalent to maximizing total utility. **However, if population size is variable, this equivalence breaks catastrophically.** Maximizing average utility can favor smaller populations with higher averages, while total utilitarianism favors larger populations with sufficient total welfare. **Harsanyi's theorems assume a fixed population.** The chapter's claim that the sum "becomes an average" is accurate *only* under the veil justification *and* with fixed population. The leap to variable population fundamentally alters the landscape (e.g., Parfit's Repugnant Conclusion), which neither theorem addresses. Utilitarianism itself has different flavors (average vs. total) that diverge dramatically here.

  **Arrow, Cardinality, and Uniqueness:**
  3.  **"...why Arrow's impossibility theorem... is a problem only for ordinal rankings: once utilities are cardinal rather than ordinal, the impossibility evaporates and the social welfare function is uniquely pinned down as the utilitarian sum."** *Overstated and misleading.*
      *   **Cardinality Helps, Doesn't Fully Solve:** Arrow's result *does* crucially depend on ordinal non-comparable information. Introducing cardinal utilities *relaxes* the informational constraint. Harsanyi shows that with cardinal utilities *and* interpersonal comparability (which the affine transformations allow *if* we assume the scales are comparable across individuals), *and* the EU/Pareto assumptions, we *can* get a specific SWF form (linear aggregation). **This avoids Arrow's impossibility *under these specific, strong assumptions*.** However:
      *   **Uniqueness? Not Quite:** The social utility function is cardinal, unique up to a positive affine transformation. But the *weights* in the sum are *not* uniquely pinned down by the aggregation theorem alone! Different sets of weights, as long as they are positive, can represent the same social preferences. It's the *veil argument* that pins the weights to equality. Without the veil or another normative justification, the weights remain free parameters reflecting social value judgments about distribution. Sen (e.g., "Impossibility of a Paretian Liberal") showed that other profound difficulties (like rights) can persist even with cardinality.
      *   **"The Utilitarian Sum":** Again, it's a *weighted* sum. Only the veil argument makes it *the* utilitarian (average) sum.

  **The Rawls Critique:**
  4.  **"...Rawls's difference principle is now widely regarded as a mistake traceable to an unjustified assumption of extreme risk aversion..."** *This is a contentious interpretation favored by some economists but rejected by Rawls and many philosophers.*
      *   Harsanyi's veil uses EU maximization, which under the equal probability assumption leads to maximizing average utility. Rawls's original position uses the maximin rule, leading to the difference principle (maximize the position of the worst-off).
      *   **The Dispute:** Harsanyi (and economists like this author) frame the difference as Rawls assuming irrational "extreme risk aversion." Rawls explicitly *denies* this. He argues the original position is a model of *fairness under radical uncertainty*, not *risk* with known probabilities. He rejects the application of EU maximization in this context precisely because the probabilities are not known or meaningful, making maximin a rational rule for choosing principles of justice when the stakes are fundamental and one cannot afford to gamble on ending up in the worst position. Attributing it to "risk aversion" misrepresents Rawls's core argument. While many economists *prefer* the EU framework, claiming Rawls's position is a "mistake" based on risk aversion is a substantive philosophical disagreement, not a settled implication of Harsanyi's theorem. It reflects the author's normative commitment to the EU/veil model.

  **The Footnote on Disagreement:**
  5.  **Footnote: "...people who share the same information cannot rationally disagree about values, so that persistent moral disagreement must be either ignorance or irrationality."** *This is a gross overextension.*
      *   Harsanyi's veil argument *assumes* individuals share the *same* preferences (or at least, the same fundamental utility structure) when placed in the same informational situation. If everyone behind the veil, facing the same uncertainty and being rational (EU maximizers), *would* converge on the same evaluation (average utility), then *if we assume*:
          (a) Actual moral disagreement stems from people failing to adopt this impartial perspective (i.e., they are being "partial" or self-interested),
          (b) *Or* they lack relevant information,
          (c) *Or* they are irrational (don't follow EU),
      ...then persistent disagreement could be explained by (b) or (c). However:
      *   **The Cost Paid:** This ignores **value pluralism** – the idea that reasonable, fully informed, rational people might fundamentally prioritize different, incommensurable values (e.g., liberty vs. equality, individual rights vs. aggregate welfare). Harsanyi's framework assumes preferences can be captured by a *single* cardinal utility index satisfying EU axioms. Many philosophers argue this is an inadequate model for the richness and potential incommensurability of moral values. Attributing *all* persistent disagreement to ignorance or irrationality is a highly controversial metaethical claim stemming from the *assumptions* of the model (single utility index, EU rationality, veil convergence), not a proven result of the aggregation theorem itself. It dismisses the possibility of genuine, reasonable moral pluralism.

  **The Strongest Surviving Conclusion:**

  After stripping away the overextensions and clarifying the dependencies, the strongest version of the chapter's conclusion supported *directly* by Harsanyi's theorems is:

  **If both individual preferences and social preferences satisfy the axioms of expected utility theory, and the social preference satisfies the Strong Pareto Principle, then social welfare must be representable by a cardinal utility function that is a positively weighted sum of cardinal individual utility functions (Linear Aggregation). Furthermore, if one accepts Harsanyi's Impartial Observer model – where an impartial, rational individual evaluates social states behind a veil of ignorance assuming an equal probability of being any person and applies expected utility maximization – then this impartial observer would evaluate states using the *average* of the individual utilities. Therefore, under *these specific and contestable assumptions* about rationality, information, impartiality, and the nature of choice under uncertainty, a strong case can be made for average utilitarianism as the basis for social welfare judgments.**

  **Where the Money Changes Hands:**

  The cost is paid at every step beyond the pure aggregation theorem:
  1.  **Equal Weights:** Paid for by accepting Harsanyi's specific veil of ignorance argument (equal probability, EU under risk).
  2.  **Average vs. Total:** Paid for by assuming fixed population size. (Variable population requires entirely new arguments).
  3.  **"Evaporating" Arrow:** Paid for by assuming cardinal, interpersonally comparable utilities *and* the EU/Pareto axioms for the SWF. (Arrow's conditions are different).
  4.  **Uniqueness (of weights):** Paid for by the veil argument. (Aggregation theorem alone leaves weights indeterminate).
  5.  **Dismissing Rawls:** Paid for by assuming Rawls's original position *is* about risk with known probabilities and that EU is the only rational response. (Rawls explicitly denies this).
  6.  **Disagreement as Ignorance/Irrationality:** Paid for by assuming the Harsanyi veil model accurately captures the *only* possible rational basis for moral judgment, denying value pluralism. (A deeply controversial metaethical stance).

  The chapter transforms a powerful but conditional mathematical result (linear aggregation under EU+Pareto) into a seemingly inevitable normative conclusion (average utilitarianism) by quietly invoking a series of highly specific and philosophically debatable premises, particularly the normative force of Harsanyi's veil of ignorance model. The utilitarian conclusion emphatically does not come for free; it arrives heavily laden with baggage from the veil. Recognizing this distinction between the aggregation theorem's logic and the normative arguments used to interpret it is crucial for a philosopher engaging with social choice theory.
