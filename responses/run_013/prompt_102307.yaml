prompt: |-
  I have been trying to work out what I actually believe about the units of selection, proceeding from gut verdicts on particular cases rather than from any theory, and I would like to know what principle, if any, they add up to. Please treat the following as data to be explained, not as claims I am confident in.

  My verdicts:

  A killer plasmid in a bacterium carries genes for both a toxin and its antidote; a cell that loses the plasmid is killed, so the plasmid spreads through the population even though it costs its host. I think it is correct to say that the plasmid lineage is what is being selected here, and not the bacterial cell.

  A transposable element in a mammal copies itself into more than half of the sperm a male produces, so it reaches more offspring than the rest of his genome does. I also want to say the element is selected — but I notice that I feel this is a *different* kind of thing from the plasmid case, and I cannot say why. The element builds nothing; it simply rides.

  Stalk cells in a slime mold die in order to hold up the fruiting body, and the spores they lift are usually close relatives. I think the right description is that a cell lineage is being sacrificed for the aggregate, and yet I resist calling this group selection.

  A bird gives a loud alarm call that draws a predator toward itself and away from its flock. I think this is straightforwardly selection on the individual acting for the group, and I do not feel tempted by a gene-level redescription, even though I know one is available.

  A liver cell lineage that ignores the body's growth-arrest signals outcompetes its neighbors until the organism dies. I think the cell lineage is selected, and — to my own surprise — I think this is genuinely the *same* phenomenon as the plasmid case, despite the fact that the liver lineage, unlike the plasmid, is destroying the very vehicle it depends on.

  A trait that lowers each carrier's survival but raises the population's chance of surviving a famine I do want to call group selection, even though by the reasoning I used in the plasmid case one could redescribe the very same trait at the gene level. This is the pair I cannot reconcile: structurally the two look alike, but my verdicts come out on opposite levels.

  A mitochondrial gene in a plant sterilizes the plant's male function, which benefits the mitochondrion (transmitted only maternally) at the plant's expense. I have gone back and forth on whether to say the mitochondrial genome is the unit of selection here or the plant is, and I would like the answer to settle it.

  I have a tentative principle of my own, which I call the replication-tracking principle: an entity is the unit of selection just when the variation that makes a difference to whether a *token* of it is copied is variation in the entity's own properties, and just when the copying in question is descent rather than mere persistence. I suspect this principle either collapses into triviality or else forces me to drop one of the verdicts above, and I would like to know which.

  What I want from you is this. State the principle, or the smallest set of competing principles, that best fits the verdicts, with each clause motivated by the specific case that demands it. Tell me explicitly which of my verdicts the principle cannot accommodate and must overturn, and why the cost of keeping it would be worse. Say what it predicts for at least two cases I have not listed — I am particularly interested in a case where the candidate unit is a lineage of learned behaviors copied between individuals rather than a lineage of genes, and a case where the candidate unit is a consortium of unlike organisms that must reproduce together or not at all. If my replication-tracking principle can be repaired, repair it; if it should be discarded, discard it and say what replaces it.
reasoning: |-
  Hmm, the user has presented a fascinating challenge about units of selection. They've shared their intuitive verdicts on various biological scenarios and want to know what underlying principle explains these judgments. This is deep philosophy of biology territory.

  First I need to carefully analyze each of their cases. The plasmid example clearly shows selection acting on the plasmid lineage rather than the bacterium. Then there's the transposable element case where they feel it's similar but different - interesting that they note it "simply rides" without building anything. The slime mold case creates tension between individual sacrifice and group selection. The bird alarm call feels like individual-level selection to them despite the group benefit.

  The liver cancer case is particularly telling - they see it as identical to the plasmid case even though it's suicidal for the lineage. This suggests they're focusing on the replicating unit rather than long-term sustainability. Their dilemma about famine adaptation versus plasmid is crucial - identical structure but different intuitions about selection level.

  Their proposed "replication-tracking principle" seems promising but needs refinement. The key insight is tracking what actually gets copied, but it needs to distinguish between different kinds of "descent." I notice their discomfort with the transposable element case might stem from it being a "hitchhiker" rather than an active replicator.

  For new test cases, I should consider cultural evolution (like learned behaviors) and obligate symbioses (like lichens). These will stress-test any principle we develop. The cultural case might reveal whether information patterns matter more than physical substrates, while symbioses challenge our definition of discrete units.

  The mitochondrial sterility case is tricky - it seems parallel to the plasmid but involves nested genomes. This might require recognizing multiple simultaneous levels of selection. Their intuition that the plasmid and cancerous cell are the "same phenomenon" despite different outcomes suggests they're onto something fundamental about replicator dynamics.

  I need to build a principle that captures all these nuances: one that focuses on replicators (entities whose structure is directly copied) while acknowledging vehicles (temporary aggregates that carry replicators). The key is whether variation in the entity's properties causes differential copying of that specific structure. This explains why transposable elements are selected (their sequence determines copy rate) while famine adaptations might involve group-level vehicle properties.
answer: |-
  Based on your detailed verdicts, I identify a core principle explaining most cases, a key distinction resolving the plasmid/famine dilemma, and a refinement of your replication-tracking principle. Here's the analysis:

  **The Core Principle: The Active Replicator Criterion**
  *   **Principle:** The unit of selection is the entity whose *specific inherited structure* (genetic or informational) directly determines its own differential replication success, and whose replication is causally primary in driving the evolutionary change observed.
  *   **Motivation from Cases:**
      *   **Plasmid:** Its specific genes (toxin/antidote) *directly cause* its own increased replication/survival relative to other plasmids, even at the host's expense. Host replication is secondary/correlated.
      *   **Transposable Element:** Its specific sequence *directly enables* its preferential copying mechanism (meiotic drive), causing its own over-replication relative to the rest of the genome. It's "riding" *because* its structure hijacks the replication machinery.
      *   **Liver Cell Lineage:** Mutant cell lineage's specific genes (ignoring signals) *directly cause* its clonal expansion (replication), even though this destroys the vehicle (organism). Its replication is the primary driver of change in the cell population within the host.
      *   **Mitochondrial Gene:** Its specific mutation (causing male sterility) *directly enhances* its own replication/survival (by diverting resources to female function). The *mitochondrial genome* is the replicator being selected. The plant genome is selected *against*.
  *   **Limitations:** This explains *what* is selected (the replicator). It doesn't perfectly capture the *level* of organization where the *fitness consequences* play out (vehicle level), which is crucial for some verdicts (slime mold, alarm call, famine trait).

  **Resolving the Plasmid/Famine Dilemma: The Vehicle-Level Fitness Impact Distinction**
  *   **Your Dilemma:** Both involve a trait harmful to the bearer but beneficial to a higher-level entity (plasmid/cell vs. individual/group). Why is plasmid selection replicator-level, but famine trait selection group-level?
  *   **Key Distinction:** The level at which the *fitness benefit is realized and directly impacts replication*.
      *   **Plasmid:** The *plasmid's* fitness is *directly increased* by its trait (by killing plasmid-free cells). The *cell's* fitness is decreased. Selection acts *on plasmid replicators via* cell survival, but the benefit directly boosts plasmid copies. Group (bacterial population) fitness isn't the direct beneficiary.
      *   **Famine Trait:** The trait *directly decreases individual fitness* (survival). The benefit (population persistence) *only indirectly* benefits the individual genes *if* the group survives. Crucially, the *group's survival is the direct prerequisite* for *any* future replication of the individual's genes. Selection acts *on group vehicles* because group extinction is the alternative; the trait increases group persistence (vehicle fitness), even while decreasing individual fitness within the group.
  *   **Principle Refinement:** Selection acts at the level where the *differential persistence/replication of vehicles* is the direct cause of the change in replicator frequencies. For the plasmid, the differential persistence of *cells* (as plasmid vehicles) changes plasmid frequencies. For the famine trait, the differential persistence of *groups* changes gene frequencies *because* group extinction removes all genes within it.

  **Refined Principle: Replicator-Vehicle Selection**
  *   **Principle:** Evolution by natural selection occurs when:
      1.  **Replicator Selection:** Variation exists in the *heritable structure* of replicators (entities whose structure is copied with fidelity across generations).
      2.  **Vehicle Selection:** This variation causes differences in the *functional properties* of the vehicles (entities that interact with the environment as cohesive units, mediating replicator survival and replication).
      3.  **Fitness Consequence:** Differences in vehicle properties cause differential *persistence* or *replication success* of the vehicles *at a specific level of organization*.
      4.  **Level Determination:** The unit of selection is identified by the level at which the *differential vehicle success* most directly and significantly explains the change in replicator frequencies. The *replicator* is what is copied; the *vehicle level* is where the functional interaction and differential success occur.
  *   **Repairing Your Replication-Tracking Principle:** Your principle focuses correctly on the replicator (clause 1). However, it needs explicit incorporation of the vehicle and the level of vehicle interaction/success (clauses 2 & 3 & 4). "Variation in the entity's own properties" must include both the replicator's structure *and* the vehicle-level properties it codes for. "Copying is descent" is good, but the *mechanism* of that descent (via which vehicle level) is crucial.

  **Applying the Refined Principle to Your Verdicts:**

  1.  **Killer Plasmid:** Replicator=Plasmid DNA. Vehicle=Bacterium. *Vehicle-level selection*: Plasmid genes cause vehicle (cell) persistence (killing plasmid-free cells), boosting plasmid replicator replication. **Verdict Supported.**
  2.  **Transposable Element:** Replicator=TE sequence. Vehicle=Gamete/Sperm. *Vehicle-level selection*: TE structure enables preferential inclusion in functional vehicles (sperm), boosting TE replicator replication. **Verdict Supported.** (The "different kind" feeling might stem from it being a parasite purely exploiting replication machinery, not building a functional trait beyond copying itself. But the principle holds.)
  3.  **Slime Mold Stalk Cells:** Replicator=Cell's nuclear DNA. Vehicle1=Individual Cell. Vehicle2=Slug/Fruiting Body. *Vehicle-level selection*: Genes causing stalk cell behavior sacrifice Vehicle1 (cell) persistence to enhance Vehicle2 (fruiting body) replication (spore production). This is *group selection* (Vehicle2=multicellular group). **Verdict Overturned:** Your resistance is noted, but by the principle, the differential success of *groups* (fruiting bodies with effective stalks) explains the persistence of the genes for altruism. Keeping "not group selection" would require denying the fruiting body is a vehicle or that its differential success matters – but it clearly does.
  4.  **Bird Alarm Call:** Replicator=Bird's nuclear DNA. Vehicle1=Calling Bird. Vehicle2=Flock. *Vehicle-level selection*: Call behavior harms Vehicle1 (calling bird) persistence but plausibly enhances Vehicle2 (flock) persistence. However, kin selection (inclusive fitness) explains this via *individual-level selection*: genes for calling spread because they aid copies in relatives *within* the flock. Differential *individual* success (inclusive fitness) explains gene frequency change. Group extinction isn't the primary driver. **Verdict Partially Supported, Nuanced:** It *is* individual selection acting *via* effects on kin (a gene-level effect within individual vehicles). A pure "group selection" description is less direct.
  5.  **Liver Cell Lineage:** Replicator=Mutant cell's DNA. Vehicle1=Cancer cell lineage. Vehicle2=Organism. *Vehicle-level selection*: Mutant replicator structure enhances Vehicle1 (cancer clone) replication within Vehicle2, but destroys Vehicle2. Selection is on cancer cell vehicles *within* the organism. **Verdict Supported.** (Parallel to plasmid: replicator selected via differential success of its *immediate* vehicle lineage).
  6.  **Famine Trait:** Replicator=Individual's genes. Vehicle1=Individual. Vehicle2=Population. *Vehicle-level selection*: Trait lowers Vehicle1 persistence but *directly enhances* Vehicle2 persistence. Differential *group* (Vehicle2) extinction/survival is the key factor changing gene frequencies. **Verdict Supported.** (Group selection).
  7.  **Mitochondrial Sterility Gene:** Replicator=Mitochondrial DNA (mtDNA). Vehicle1=Mitochondrion (organelle). Vehicle2=Plant (organism). *Vehicle-level selection*: mtDNA structure harms Vehicle2 (plant) male reproductive function but enhances Vehicle1 (mitochondrion) replication/survival *via* enhanced female function. Selection is directly on the *mitochondrial replicator* via its effect on the *organelle's* success *within the cell* and the *cell's* success in the *female germline*. The plant organism is a vehicle experiencing conflict. **Verdict:** The *mitochondrial genome* is the unit of selection (replicator), selected via its effects on organelle/cell-level vehicles within the plant.

  **Predictions for New Cases:**

  1.  **Learned Behavior Lineage (Cultural Evolution):**
      *   *Scenario:* A specific tool-making technique ("Token T") is learned via imitation in a bird population. Variation exists (T1, T2). T1 is slightly faster but more error-prone than T2.
      *   *Prediction:* If T2's reliability leads to birds using T2 surviving better *and* being copied more often *as a specific behavioral pattern*, then the *behavioral pattern itself* (the meme, the informational replicator) is the unit of selection. Its "structure" (the specific sequence of actions) determines its differential copying fidelity and survival (via its effect on the bird vehicle). Selection acts on the meme replicator via differential bird vehicle persistence *and* differential copying events.

  2.  **Obligate Symbiotic Consortium:**
      *   *Scenario:* A lichen is a symbiotic unit of a fungus and an alga/cyanobacterium. They reproduce *only* as a unit via specialized propagules containing both partners.
      *   *Prediction:* The unit of selection is the *lichen consortium* (the symbiotic unit) itself. It acts as a single vehicle. Variation in *consortium-level* properties (e.g., drought resistance, photosynthetic efficiency, propagule production rate) directly determines the differential replication success of the entire, integrated replicator set (fungal genome + algal genome) via propagule production. While individual genomes are replicators, their replication is inextricably tied to the consortium vehicle's success. Selection operates most directly at the consortium level.

  **Conclusion:**

  Your verdicts reveal a consistent intuition for **Replicator Selection** (the "what" is copied: plasmid, TE, mutant DNA, mtDNA) mediated by **Vehicle Selection** at different levels (the "how" and "where" the environment interacts: cell, gamete, multicellular group, organism, population). The refined **Replicator-Vehicle Selection Principle** accommodates nearly all your judgments.

  *   **Key Repair:** Your replication-tracking principle correctly identifies the replicator but needed explicit integration of the vehicle concept and the level of vehicle interaction/success to explain *how* replication is tracked and *why* we attribute selection to different levels.
  *   **Cost of Keeping the Slime Mold Verdict:** Insisting the slime mold case isn't group selection requires denying that the multicellular aggregate acts as a vehicle whose differential reproduction explains the frequency of altruistic genes. This ignores the functional integration and group-level fitness consequences central to the evolution of such multicellularity.
  *   **Discarded?** No, repaired and enhanced. The core insight – tracking what is copied and why – was sound. The vehicle concept provides the necessary mechanism linking replicator variation to environmental interaction and differential success.
