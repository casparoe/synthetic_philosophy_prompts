prompt: |-
  I spent the better part of 35 years as a plant breeder — barley, mostly — and since retiring I've been working my way through philosophy of biology books, which is how I ended up caring about what "heritability" is supposed to mean. Here's what I want, and I'd rather have the spec than another essay.

  Back in the 90s we had the same population of barley in two trials about 40 km apart, and the heritability of heading date came out around 0.85 in one and 0.2 in the other. Same seed, same genotypes, roughly the same measuring. Nobody at the breeding station thought this was a paradox. But when I read the human genetics literature everyone talk about "the heritability of IQ" or "the heritability of height" as if it were one number belonging to the trait, and then people on both sides of the nature/nurture fight use it to argue about schools, or about whether we can stop worrying about poverty, and I get the feeling the number is being asked to do jobs it was never built for.

  So: before I read any more of this stuff, give me the desiderata. What does any adequate account of heritability have to deliver — the cases it has to get right, the puzzles it has to dissolve, the distinctions it can't collapse, the results from genetics and breeding it can't contradict. For each one, give me the case or consideration behind it, say whether it's non-negotiable or just a preferance of one camp, and flag any pair you think can't be satisfied at the same time — that last part is what I actually want most. Then, only briefly, how the main accounts on offer do against the list.

  A few things I'd want on the list, so you know what I mean by in the weeds: my two trials above; what happens to h² when the environment is uniform for everybody (as I understand it the number goes to 1 no matter how environmental the trait is, which seems like it should embarrass somebody); the difference between the narrow and the broad sense and why a breeder cares about the first one; the fact that the SNP-based estimates keep coming out lower than the twin/pedigree ones for the same trait; and the trick where a number computed from differences within a population gets slid over to explain differences between populations.

  Don't give me citations or a reading list — I can't look things up easily and I don't want to be told to read So-and-so. If a term of art is doing work, define it.

  Format: I want it as a table, not prose. Columns: id | requirement (one sentence) | the case or consideration behind it | status (non-negotiable / camp preference — say which camp) | which of the main accounts it knocks out or strains. Then a second, shorter table of conflicts, columns: requirement ids that clash | why they pull apart | which one I should give up and why. Last, one line: the single requirement that eliminates the most candidates. If you want a one-paragraph gloss after the tables, fine, but the tables are the answer.
reasoning: |-
  Alright, let's tackle this user's request. They're a retired plant breeder with decades of experience in barley genetics, now diving into philosophy of biology. Their main concern is the concept of heritability, especially how it's misused in human genetics debates. They presented a clear example from their past where heritability estimates for the same barley population varied drastically between two locations—0.85 vs 0.2—highlighting context-dependence. Yet in human genetics, traits like IQ or height are often discussed as having a single, fixed heritability value, leading to oversimplified nature vs nurture arguments.

  The user wants a structured breakdown of requirements for any adequate account of heritability. They specified key issues: environmental uniformity skewing h² to 1, narrow vs broad sense heritability (and why breeders care about narrow), SNP-based estimates being lower than pedigree/twin studies, and the problematic leap from within-population to between-population differences. They explicitly asked for a table format, avoiding citations or reading lists.

  First, I need to map their barley case to the core problem: heritability isn't a trait constant but environment-dependent. That's non-negotiable. Then, unpack why uniform environments inflate h²—if all environments are identical, any variance must be genetic, even if the trait is environmentally sensitive. This exposes a flaw in treating h² as inherent. 

  Next, distinguish narrow-sense (additive variance) vs broad-sense (total genetic variance). Breeders prioritize narrow-sense because it predicts response to selection—additive genes are reliably passed on. Non-additive effects (like dominance) don't guarantee gain. 

  The SNP vs twin study discrepancy is crucial. SNP-based methods (GREML) miss rare variants and non-additive effects, while twin studies capture total genetic variance (broad-sense). But human genetics often conflates them, causing confusion. 

  The within-to-between populations fallacy is ethically critical. Within-group h² says nothing about between-group differences (e.g., IQ gaps), which could stem from environments. Yet this misuse persists in policy debates. 

  The user also hinted at tension between "h² as population snapshot" and "h² as predictor." Breeders know h² is context-specific, but some philosophers want it as a universal trait property. These clash—population-dependence is fundamental. 

  For conflicts: Population-dependence vs "Trait Labeling" is irreconcilable. If heritability shifts with environment (barley case), it can't be a fixed trait label. The user should ditch "Trait Labeling" because their experience proves it's misleading. 

  The single requirement eliminating most accounts? Population-Dependence. It invalidates any theory treating h² as intrinsic. 

  Now, structuring tables. For desiderata: each row addresses their examples. Status column flags non-negotiables (like population-dependence) vs preferences (like partitioning non-additive effects). "Knocks out" column shows which theories fail—e.g., SNP methods fail on non-additive capture. 

  In conflicts table, highlight Population-Dependence vs Trait Labeling. The barley trial proves why the latter must be discarded. 

  Finally, the gloss should stress that heritability is a population-context statistic, not a trait essence. Their barley case epitomizes this—same genes, different fields, different h². That's the anchor.
answer: |-
  Here is the specification for an adequate account of heritability, structured as requested:

  ### Desiderata Table
  | id | Requirement | Case/Consideration Behind It | Status | Knocks Out/Strains |
  |----|-------------|-------------------------------|--------|---------------------|
  | 1 | **Population-Dependence**: Must show heritability (h²) is a property of a specific population in a specific environment. | Your barley trials: Same genotypes, different locations (0.85 vs 0.2) due to differing environmental variance (V_E). | Non-negotiable | Eliminates accounts treating h² as a fixed trait property. |
  | 2 | **Environmental Uniformity Effect**: Must explain why h² → 1 when environmental variance (V_E) → 0, even for highly environmentally sensitive traits. | Uniform greenhouse: All phenotypic variance (V_P) becomes genetic (V_G), inflating h² (=V_G/V_P) regardless of trait plasticity. | Non-negotiable | Strains accounts implying h² measures "innateness"; exposes h² as variance ratio. |
  | 3 | **Narrow-Sense Primacy for Selection**: Must distinguish narrow-sense h² (h²_N = V_A / V_P; additive genetic variance) from broad-sense (H² = V_G / V_P; total genetic variance). | Breeders need h²_N: Only additive effects predict response to artificial/natural selection (offspring inherit average allele effects). | Non-negotiable for breeding | Obscuring the distinction misleads applied genetics. Twin studies often estimate broad-sense. |
  | 4 | **Non-Additive Variance Handling**: Must account for non-additive genetic variance (V_NA = dominance/epistasis) contributing to H² but not h²_N. | Hybrid barley: High dominance variance boosts H² but is irrelevant for selecting pure lines. h²_N remains low. | Non-negotiable | SNP-based methods (GREML) underestimate H² if V_NA is significant (capture mostly V_A). |
  | 5 | **SNP-Twin Discrepancy Resolution**: Must explain why SNP-based h² estimates ("h²_snp") are often lower than pedigree/twin-study h² for same trait. | Human height: Twin h² ≈ 0.8, h²_snp ≈ 0.5. Caused by imperfect LD with causal variants, rare variants missed, non-additive effects. | Non-negotiable | Exposes limitations of SNP methods; pedigree methods capture total V_G better but with shared environment confounds. |
  | 6 | **Within-Population Scope Limit**: Must prevent h² estimates (within-population statistic) from explaining between-population differences. | IQ debates: High within-group h² ≠ genetic cause of between-group mean differences (e.g., populations in differing environments). | Non-negotiable | Eliminates accounts justifying racial/environmental determinism via h². |
  | 7 | **Variance Component Partitioning**: Must cleanly partition V_P into V_G, V_E, and V_GxE (genotype-environment interaction). | Your trials: Low h² site had high V_GxE (genotypes rank differently) or high V_E. Requires experimental designs (e.g., replication, clones). | Non-negotiable | Naive observational studies fail; biometric models require this. |
  | 8 | **Prediction Focus**: Should prioritize h² as a tool for predicting selection response or familial resemblance. | Breeding: High h²_N → rapid gain under selection. Clinics: High h² → strong familial recurrence risk. | Breeder/Geneticist preference | Philosophical "trait essence" accounts often neglect this utility. |
  | 9 | **Trait Definition Rigor**: Must depend on precise, replicable measurement protocol. | Heading date: Measured in DD after sowing? After vernalization? Changes trait definition. | Non-negotiable | Ambiguous definitions make h² estimates non-comparable. |

  ### Conflicts Table
  | Clashing IDs | Why They Pull Apart | Which to Give Up & Why |
  |--------------|---------------------|------------------------|
  | **1 (Population-Dependence) vs. "Trait Labeling"** (implied critique) | If h² is population/environment specific, it cannot be a stable property "belonging to the trait" (e.g., "h² of IQ"). | **Give up "Trait Labeling"**: Your barley trials prove it's indefensible. h² is context-dependent. |
  | **2 (Uniform Env → h²=1) vs. Intuitive "Innativeness"** | High h² in uniform env says nothing about trait's sensitivity to *changed* environments; contradicts lay "genetic destiny" interpretation. | **Give up "Innativeness" interpretation**: Requirement 2 is mathematically inevitable; interpretational error lies in ignoring V_E's role. |
  | **3 (Need h²_N) vs. 4 (Existence of V_NA)** | Breeders *need* h²_N (additive), but biology *has* non-additive effects. H² (broad) includes V_NA but overestimates selection response. | **Neither**: Maintain distinction. Requirement 3 defines the breeder's *tool* (h²_N); Requirement 4 reflects biological reality. Use the right tool for the job. |
  | **5 (SNP < Twin h²) vs. Desire for Unified Estimate** | Methods capture different things (SNP≈V_A; Twin≈V_G + shared env confound). No single "true" h² exists across methods. | **Give up Unified Estimate**: Accept estimates are method/cohort dependent. Focus on question (e.g., selection? → SNP h²_N; familial aggregation? → twin H²). |

  ### The Eliminator
  **Requirement 1 (Population-Dependence)**: Eliminates all accounts treating heritability as an intrinsic, context-independent property of a trait.

  ### Brief Gloss
  Heritability is fundamentally a *descriptive statistic* for a *specific population* in a *specific environment* at a *specific time*, quantifying the proportion of observed phenotypic variance attributable to genetic variance components (narrow or broad). It predicts short-term selection response (narrow-sense) or familial patterns but **does not** measure trait fixity, innate potential, or the cause of differences between populations in different environments. The barley trials exemplify its context-dependence; environmental uniformity reveals its mathematical nature as a ratio; the SNP/twin gap reflects methodological capture of different variance components; and the within/between confusion is a categorical error. Any account failing to center population-context dependence is inadequate.
