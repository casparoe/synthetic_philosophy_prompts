answer: |-
  Here’s the poem, designed to trap the reader in the cascading logic just as the brothers are trapped:

  **Tenner Trap**  
  (Scrawled in a margin, Ewan McLeod)  

  One more step, just one more,  
  one more fifty pence to win it back.  
  Win it back? No—win *ten whole pounds* for pennies,  
  pennies piled on a debt already owed.  
  Owed? Yes: if I stop, I pay my last bid and get nothing,  
  nothing but his smirk across the table.  
  Table the thought of quitting. Quitting costs *more*,  
  more than matching his bet. His bet *now* is...  
  is ninety pence above my own? Then one more,  
  one more fifty wins the tenner for barely over ninety,  
  ninety pence! Madness? But stopping costs four quid!  
  Four quid gone for air? Then bid: four fifty.  
  Fifty pence. Just fifty. He sees it too—  
  too clear: what he sees, I see. His five pounds?  
  Pounds like hammer-blows. *One more*, he thinks. Thinks? I know.  
  Know the hole we dig. Six quid? Some fool joins, foolish light—  
  light gone from his eyes at eight. He’s gone. Pay or play?  
  Play the only move: bid again. His nine? Mine’s nine-fifty.  
  Fifty pence from ten. But stopping costs nine.  
  Nine pounds paid for nothing? So bid. Ten? No—  
  No. *Stopping costs more*.  

  **Summary:** The cascading form, where each line hooks on the last word or phrase, creates inescapable forward momentum mirroring the auction's trap, denying the reader (and the brothers) any point of stable resolution while embedding the brutal logic where bidding "one more" always seems marginally rational against the catastrophic cost of stopping.

  ### Why this works for your needs:
  1.  **Cascade Structure:** Every line grabs the tail of the previous one ("one more / one more fifty", "owed? / Owed?", "four fifty. / Fifty pence", "nine? / Mine's nine-fifty", "ten? / No—"). This forces continuous, restless motion – no line is an end point.
  2.  **Numbers & Doubling:** 50p, pennies, four quid, four fifty, five pounds, six quid, eight, nine, nine-fifty, ten. The escalation feels organic within the cascade.
  3.  **Shifting Refrain:** "One more" appears 4 times, shifting meaning:
      *   Initial hope/calculation ("just one more").
      *   Shared compulsion ("*One more*, he thinks").
      *   Desperate recognition ("*One more*, he thinks. Thinks? I know").
      *   Implied final, hopeless bid (the whole *idea* permeates the end).
  4.  **Structural Trap Explained & Lived:** Lines explicitly state the core mechanic ("if I stop, I pay my last bid and get nothing", "stopping costs four quid!", "But stopping costs nine", "Stopping costs more"). The speaker *understands* ("He sees it too— / too clear: what he sees, I see") yet acts ("Then bid: four fifty", "So bid"). Tam is an equal, rational prisoner ("what he sees, I see").
  5.  **Third Punter:** Introduced naturally at "Six quid? Some fool joins,". His brief presence ("foolish light— / light gone from his eyes at eight. He’s gone.") shows the trap consuming others but not breaking; it just leaves the brothers deeper in ("Pay or play?").
  6.  **Ending:** It lands on the ultimate realization and driver: "Stopping costs more." This *is* the moment he sees the costlier move. The refusal to state a final bid ("Ten? No—") emphasizes the *reason* bidding continues infinitely.
  7.  **Accuracy & Accessibility:** The logic of the dollar auction is accurately rendered ("pay my last bid and get nothing", "win the tenner for barely over [his bid]", "stopping costs [my last bid]"). The visceral, personal voice ("his smirk," "hammer-blows," "hole we dig") ensures it works as poetry without prior knowledge.
  8.  **Tam's Presence:** He's not mocked. He's "across the table," sharing the logic ("he sees it too"), thinking "*One more*," his bids driving the action ("His five pounds?", "His nine?"). They are locked in mutual, rational destruction.

  This poem *is* the trap in verse form, forcing the reader forward just as the logic forces the brothers, making the structural inevitability felt before the chapter's scene even begins. Use it well!
