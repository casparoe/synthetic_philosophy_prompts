  ### Job Hunt Simulation: Experiencing Satisficing Through Behavior  
  **Objective:** Immerse students in a task where they unknowingly adopt a satisficing heuristic. The activity creates tension between optimizing and "good enough" decisions, with environmental differences shaping outcomes.  

  ---

  #### **Materials**  
  - **12 decks of "job offer" cards** (6 decks per environment, 40 cards/deck):  
    - **Group A (Favorable Environment):** Offers drawn from a uniform distribution between $90,000 and $110,000. *Example:* $94K, $106K, $98K, $102K...  
    - **Group B (Hostile Environment):** Offers start high ($95K–$105K) but decline steeply after Card 10 ($5K–$10K drops every 3–4 cards) and stabilize near $50K. *Example:* $100K, $103K, $97K, $92K, $87K...  
  - **Record sheets** for each student (columns: Card #, Offer, Decision ✓).  
  - Timer (loud beep every 20 seconds).  
  - Prizes for top 3 salaries (e.g., bookstore gift cards, baked goods)—**no monetary payoffs**.  

  ---

  #### **Setup & Rules**  
  1. **Groups & Seating (5 min):**  
     - Randomly split students into two groups (6 each). Groups sit at opposite sides of the room.  
     - **Instructions (verbatim):**  
       *“You’re job hunting. Each card is a salary offer. Decide: ACCEPT (✓) and keep the salary, or REJECT (✗) to see the next. Your goal is the highest salary. Rules:*  
       - *You have 20 seconds per offer. When the timer beeps, you MUST decide—no delay.*  
       - *If you reject, you lose that offer forever.*  
       - *If you run out of cards, you get $0.*  
       - *Record every offer and decision. Top 3 salaries win prizes.”*  

  2. **Activity (15 min):**  
     - Start timer. Every 20 seconds, a loud beep signals students to:  
       1. Record their decision (✓/✗) for the current card.  
       2. Reveal the next card (if rejected).  
     - **Teacher’s role:** Enforce timing strictly. Walk around to ensure compliance.  
     - **Predicted behavior:**  
       - Early cards: High rejection rates (optimism).  
       - Mid-activity: Acceptance accelerates as thresholds drift (frustration/relief).  
       - Group A likely accepts earlier (stable high offers); Group B holds out longer (hoping for rebound).  

  ---

  #### **Debrief (60 min)**  
  **Goals:** Reveal satisficing through reflection—**no terms until Step 4.**  

  1. **Share Outcomes (10 min):**  
     - Each student states their:  
       - Accepted salary.  
       - Number of offers seen.  
       - Highest rejected offer.  
     - *Record salaries on the board by group.*  

  2. **Reveal Environments (5 min):**  
     - Disclose Group A’s stable distribution vs. Group B’s declining trend.  
     - **Key question:** *“Why did Group B reject higher offers than they accepted?”*  

  3. **Threshold Drift Exercise (15 min):**  
     - Students annotate their record sheets:  
       - *“Circle the first offer where you felt impatient.”*  
       - *“Star the offer where you thought, ‘I might regret this.’”*  
     - **Group discussion:**  
       - *“Did your ‘good enough’ level change? How?”*  
       - *“Did a run of high offers make you pickier? Did bad offers lower your standards?”*  
       - Highlight: Thresholds drifted with emotional state, not rational calculation.  

  4. **Introduce Satisficing (10 min):**  
     - Define satisficing: *“Setting an acceptance threshold (‘good enough’) and stopping at the first match.”*  
     - Contrast with EU maximization: *“Did anyone compute expected values? Why not?”*  
     - **Simon’s insight:** *“Bounded rationality: We use heuristics when optimizing is costly/impossible.”*  

  5. **Environment’s Role (10 min):**  
     - **Group A:** Satisficing worked (stable offers → decent salary).  
     - **Group B:** Same heuristic failed (declining offers → missed early highs).  
     - **Punchline:** *“The environment judged the strategy, not the person.”*  

  6. **Optimization Redescription Trap (10 min):**  
     - **Challenge:** *“Can we call this ‘optimizing with thinking costs’?”*  
     - **Counter-evidence:**  
       - Thresholds drifted arbitrarily (e.g., euphoria after 2 good offers).  
       - No one computed search costs or distributions.  
     - **Concession:** *“Maybe... but is that a real explanation or a just-so story?”*  

  ---

  #### **What the Activity Can’t Replicate (Requires Lecture)**  
  **The role of social and cultural context in shaping thresholds.**  
  - In reality, "good enough" is influenced by peers, norms, and self-image (e.g., "I deserve $100K because my friend got it"). The simulation isolates individual cognition. Discuss post-activity:  
    *“Your thresholds drifted from fatigue/frustration—but in life, they also drift from envy, pride, or advice. Satisficing isn’t just cognitive; it’s social.”*  

  ---

  #### **Predictable Problems & Fixes**  
  1. **Problem:** Group B infers declining trend and accepts early.  
     - **Fix:** Add noise to Group B’s offers (e.g., sporadic $1K–$2K jumps mid-decline). Most won’t detect the trend under time pressure.  

  2. **Problem:** Students ignore time limits to "calculate."  
     - **Fix:** Strictly enforce 20-second beeps. Announce: *“No decision = auto-reject.”*  

  3. **Problem:** Winners gloat; losers disengage.  
     - **Fix:** Focus debrief on *behavior*, not salaries. Ask: *“Did your strategy feel optimal in the moment?”*  

  4. **Problem:** Group A students reject everything, get $0.  
     - **Fix:** Use this! *“Why did you hold out? What did you expect?”* → Shows unrealistic optimism.  

  **Why this works:** Students *feel* the threshold drift in their frustration/relief. The environmental split forces empathy: *“I’d do the same in their shoes”* replaces *“they were lazy.”**  

  ---
  **Output:** Print 12 offer decks (6 × A, 6 × B), record sheets, and timer. No prep beyond that.
