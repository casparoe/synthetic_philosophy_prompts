prompt: |-
  So I'm in this discord server that's basically a bunch of us who never left grad school, and we've been going back and forth for weeks about a draft one of us wrote. His view — he calls it "transient micro-subjectivism," and yeah it's basically panpsychism with a twist — is that phenomenal properties are fundamental and belong to whatever the basic physical entities turn out to be (fields, particles, whatever physics finally says), so there are an enormous number of tiny subjects. The twist is that these micro-subjects aren't permanent: whenever two or more of them get strongly coupled — entangled, condensed into the same macroscopic state, whatever — the constituent subjects cease to exist and either a new, single subject arises (if the coupling is "tight" enough) or nothing does (if it isn't). So the number of subjects in the universe is constantly going up and down, and every physical interaction is potentially an event in which subjects are destroyed and/or created.

  What I want is a concrete example of a conceptual issue this generates, ideally drawn from real physics rather than another thought experiment about brains, and I keep getting stuck. Something like: take a gas cooled into a Bose-Einstein condensate, or a measurement that decoheres a superposition, or even just two atoms forming a molecule — on his view, is that a mass casualty event, a mass birth event, neither, both? And here's the part I actually care about: even granting him that micro-subjects exist and that at least some of them can suffer (that's the pan-sentience half), what exactly is the moral status of a "turnover"? Does the view commit him to saying that utterly routine, unremarkable physical processes are morally horrific on a scale that dwarfs everything humans do, or can he say the micro-subjects' experiences are too thin to matter morally without that move looking ad hoc? It feels like there should be a seperate issue hiding in the fact that we have no way of knowing whether any given interaction was a merger or just a dissolution, but I can't quite state it.

  So: give me one example of a conceptual issue of this kind — a specific physical scenario plus the moral question it forces — and then say whether you think it's a real problem for the view or something he can just absorb. No bibliography please, just reason it out.
