  I've been a cosmologist for 41 years, and on Saturday I'm giving the after-dinner speech at my own retirement do. Most of my career was on the landscape / eternal inflation side of things, which means the room splits in a way I'd like you to write for. Half of them — the experimentalists, the CMB people I started out with, my brother-in-law who does medical imaging — have quietly concluded that I've been doing theology since about 1998. The other half — my students, the string group — want me to say something that makes it all feel alright. There's also one philosopher of physics at table 3; I've been reading philosophy on and off for a year now, mostly in the evenings, and its changed how I think about all this, and he will notice if I cheat.

  So here's what I actually want to say, and I'd like the speech built around it. There's a difference between three kinds of "you can't prove me wrong." (a) My theory forbids nothing at all. (b) My theory forbids plenty, but none of it is something we can currently go and check. (c) My theory does forbid things — but only once you add a probability measure over vacua, and that measure gets picked by hand. Everyone in the field knows the quoted numbers move around depending on whether you count observers, or weight worlds by how many observers they contain, the self-sampling versus self-indication business, and none of that is fixed by any experiment. (c) is where my field actually lives. I think it's a real position, but I want the speech honest that it's a strange one: we do make predictions, they just aren't predictions until we've made a choice that nothing in nature forces on us. And I don't want the whole thing resting on the no-alternatives move — we can't think of a better theory, so ours is probably right — because I've realized that's a fact about us, not about the world, and if I lean on that arguement the experimentalists are right to roll their eyes.

  One more worry I can't tell if it's respectable: if the multiverse is big enough, most observers like me are random fluctuations rather than evolved ones, so the evidence I'm using to argue for the multiverse was probably produced by a fluctuation, which undercuts the arguement. I'd like the speech to acknowledge that without turning into a seminar — my wife's family will be there and they've been very patient with me.

  Take the role of a philosopher of physics who has also written a lot of toasts, and write me the speech: 7-8 minutes spoken, funny in places, warm at the end. No jargon you wouldn't use to a smart non-physicist, and don't smooth over the parts where I'm genuinely unsure. Don't invent quotes or put words in anyone's mouth — I'm not attributing anything to anybody, least of all to my late advisor. Before you write it, brainstorm for yourself: which of the three "you can't prove me wrong" positions can actually be said out loud in this room, what the experimentalists are right about, what the string group can hear that isn't false comfort, and where the philosopher at table 3 will catch me being sloppy. Then write it.

  After the speech, give me a short JSON summary I can paste into my notes, with exactly these fields: "occasion" (one line); "central_claim" (the one thing the speech commits me to); "what_i_concede" (list); "what_i_refuse_to_concede" (list); "audience_segment_most_likely_to_object"; "the_objection_in_one_sentence"; "how_the_speech_answers_it"; "what_the_speech_leaves_unresolved"; "jargon_risk" (words I should be ready to define if someone asks); "tone" (three adjectives).
