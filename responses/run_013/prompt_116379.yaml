prompt: |-
  I'm an undergraduate in a course on aesthetics and the law, and the unit we have just finished on forgery and authenticity has left me with a puzzle I can't resolve on my own. Three practices, all centrally concerned with the value of an original, seem to presuppose different and possibly incompatible theories of what that value is. I'd like you to reconstruct the theory each one presupposes and then tell me whether they can be reconciled.

  The first is the art market and the museum world. When a canvas long exhibited as a Rembrandt is reattributed to his studio, nothing perceptible changes — the same paint, the same image, the same experience for a viewer standing in front of it — yet its price can fall by an order of magnitude, and museums sometimes demote it to storage or to an obscure wall. A forger able to produce a Vermeer that fools the experts produces something the market values at essentially nothing as a Vermeer, though it may later acquire a modest value as a documented forgery — which is itself curious, since the object has then acquired a new historical property rather than a new look.

  The second is the criminal law of forgery, which in most jurisdictions is a species of fraud: the offence is complete when someone is deceived or defrauded. A meticulous copy painted for the copyist's own wall, never shown and never sold, is not a crime at all.

  The third is copyright. Infringement requires copying; an independently created work that happens to be identical to an existing one infringes nothing, while a substantially similar work produced by copying infringes even if no one is deceived and no copy is ever sold.

  So the market appears to locate the value of the original in the object's causal history — in its having issued from that particular hand — rather than in any property a viewer could encounter. The law of forgery appears to locate it in the viewer's experience plus a separate interest in not being deceived. Copyright appears to locate the wrong in derivation as such, with deception irrelevant.

  What I would like from you: first, the implicit theory of value behind each practice, stated as explicitly as you can, with the pieces of the practice that force each commitment; second, for each practice, which commitments it strictly requires and which it merely fits comfortably; third, whether the three can be brought under a single theory or whether there is a genuine conflict, and if so exactly where it lies; fourth, what would have to change in each practice if we adopted a purely experiential theory of aesthetic value, on which two indistinguishable objects are worth the same; and fifth, where these practices are philosophically underdetermined — where rival theories would license exactly the same rules and the same behaviour, so that the practice cannot adjudicate between them.

  I don't need a reading list or citations; I need the reconstruction and the argument. And please be explicit about the status of your claims: separate what is settled from what is genuinely contested among people who work on this, and don't present a contested reading as the consensus.
reasoning: |-
  Okay, this undergraduate in aesthetics and law has presented a fascinating puzzle about authenticity across three domains: art markets, criminal forgery law, and copyright. They've clearly articulated the apparent contradictions—how the same concept (originality) operates so differently in each context. 

  Hmm, they're asking for five very structured outputs: implicit value theories per practice, necessary vs contingent commitments, reconciliation possibility, consequences of experientialism, and philosophical underdetermination. The student is sophisticated—they recognize that practices may "comfortably fit" theories without strictly requiring them, and want underdetermination flagged. 

  First, art markets: that Rembrandt-to-studio reattribution case is perfect. The physical object doesn't change, but its value collapses. The market clearly cares about provenance—the causal chain back to the creator's hand. But interestingly, the forged Vermeer gaining value as "documented forgery" shows they also care about historical significance. So the theory isn't purely about creation—it's about authenticated connection to cultural history. 

  Criminal forgery law is simpler: it's fraud-based. The core is deception causing harm. The "copy for private use" example proves deception is necessary, not the copying itself. But note—the harm presupposes that people value authenticity enough to pay premiums for it. So criminal law doesn't define value; it assumes the market's valuation exists and punishes cheating. 

  Copyright is the outlier. Independent creation isn't infringement even if identical—wild! Here, the wrong is derivation itself, regardless of deception. The student's "derivation as such" phrase nails it. Copyright protects the creator's exclusive right to control copies, not the object's historical aura. 

  Now reconciliation: can these coexist? I think so. Each protects a different interest—historical connection (market), transactional honesty (criminal law), and creative control (copyright). They're like three lenses on authenticity. The tension is real but not contradictory—it's compartmentalization. 

  If we adopted pure experientialism ("indistinguishable objects = same value"), everything breaks. Art markets collapse without provenance, criminal forgery law evaporates without deception-based harm, and copyright... actually survives if we reinterpret "copying" as free-riding on creative labor. But that's not experientialism anymore! 

  Underdetermination spots: Criminal law could theoretically punish "harm to cultural heritage" but doesn't—it sticks to fraud. Copyright could require deception but explicitly rejects it. These exclusions show where practices commit to particular theories. 

  The student's phrasing "where rival theories license identical rules" is sharp. Example: criminal forgery law only cares about deception, so it can't distinguish whether authenticity has intrinsic value or is merely fetishized—as long as people pay for it, deceiving them is fraud. 

  *adjusts mental model* Need to emphasize that art market's "causal history" theory isn't monolithic—Van Meegeren forgeries now have value as cultural artifacts, showing "historical significance" can override origin. But that's still history-dependent, just not author-focused. 

  Biggest insight: All three practices reject pure aesthetic empiricism. The visible properties never suffice. But they reject it in different ways—which is why the student's puzzle arises. 

  *checks* Did I cover all five asks? Theories: done. Commitments: market requires causal history, criminal law requires deception, copyright requires derivation. Reconciliation: compartmentalized interests. Experientialism consequences: catastrophic for first two, adaptable for copyright if reframed. Underdetermination: fraud law agnostic on why authenticity is valued; copyright agnostic on whether derivation inherently harms or merely violates autonomy. 

  Final note: The student's observation about forgeries gaining value as "documented" objects subtly undermines pure causal-history theories—it shows the market values narrative, not just origin. But that's still non-perceptible! So experientialism still loses.
answer: |-
  Here is a systematic reconstruction and analysis of your puzzle, addressing all five requests explicitly. I'll distinguish settled claims (where practice/logic forces a commitment) from contested ones (where interpretation or philosophy allows divergence).

  ---

  ### **1. Implicit Theories of Value Behind Each Practice**
  **Art Market & Museums:**  
  - **Theory:** *Causal-Historical Authenticity*  
    Value resides in the object's unique causal genesis by a specific creator at a specific historical moment. The physical object is a vessel for non-reproducible historical presence.  
    - **Forced by:** Market price collapse upon reattribution (e.g., Rembrandt → studio) despite identical perceptible properties. Demotion in museums confirms institutional validation of this history.  
    - **Curiosity (forged-then-exposed):** The object gains value as a *documented historical event* (e.g., Van Meegeren’s forgeries). Value shifts from "Vermeer" to "forgery that deceived experts," proving the theory is about *narrativized history*, not aesthetics or materiality.  

  **Criminal Forgery Law:**  
  - **Theory:** *Deception-Based Harm*  
    Value is not inherent in the object but in the *truth of transactional representation*. The wrong is deceiving others into believing an object has a history it lacks, causing financial or reputational harm.  
    - **Forced by:** No crime in private copying without deception. The offense requires fraudulent misrepresentation (e.g., selling a copy as an original).  
    - **Commitment:** Harm arises from false belief, not the copy’s existence. The law presupposes a market that values causal history but does not define that value—it punishes cheating within the system.  

  **Copyright Law:**  
  - **Theory:** *Derivation as Theft of Creative Labor*  
    Value resides in the creator’s exclusive right to control reproduction of their intellectual work. The wrong is unauthorized *copying*, regardless of deception or object history.  
    - **Forced by:** Independent creation is non-infringing (e.g., two identical poems written unknowingly). Infringement occurs only via derivation, even if no deception occurs (e.g., academic plagiarism without profit).  
    - **Commitment:** Protects the *process* of creation (labor, originality) rather than the object’s history or viewer experience.  

  ---

  ### **2. Strict Requirements vs. Comfortable Fits**  
  | **Practice**         | **Strictly Requires**                                      | **Fits Comfortably (But Not Required)**               |  
  |----------------------|-----------------------------------------------------------|------------------------------------------------------|  
  | **Art Market**       | Value depends on verified causal origin.                  | Aesthetic superiority of originals; cultural prestige.|  
  | **Criminal Forgery** | Deception + harm from false attribution.                  | Belief that originals are inherently superior.       |  
  | **Copyright**        | Copying without authorization is wrongful derivation.     | Deterrence of free-riding; incentive for creation.   |  

  ---

  ### **3. Reconciliation: Can They Share a Unified Theory?**  
  **Yes, under a pluralistic framework of "Norms of Appropriation"**—but **no** under monistic aesthetic theory.  
  - **Compatibility:** Each practice governs a distinct social interest:  
    - *Art Market*: Preservation of historical/cultural narrative.  
    - *Criminal Forgery*: Integrity of commercial transactions.  
    - *Copyright*: Protection of creative labor and incentives.  
    Conflict arises only if we insist all must reduce to a single value (e.g., aesthetic experience). They coexist because:  
    - Copyright tolerates identical independent creations (no derivation);  
    - Forgery law ignores non-deceptive copying;  
    - The art market disregards copyright entirely (e.g., copying public-domain works still devalues "originals").  
  - **Irreconcilable Tension:** Between *copyright* and *art market*. Copyright expires (e.g., Shakespeare’s plays are copyable), but art markets still value "original" manuscripts centuries later. Copyright’s labor theory clashes with the art market’s historical fetishism.  

  ---

  ### **4. Consequences of a Purely Experiential Theory of Value**  
  If "indistinguishable objects = same value":  
  - **Art Market/Museums:** Collapses. Reattributions or proven forgeries would not devalue works. Museums might display copies, eroding cultural archives. Forgeries gain value only as technical achievements, not historical events.  
  - **Criminal Forgery Law:** Evaporates. No deception if copies and originals hold equal value. Fraud charges would require proof of *material* harm (e.g., overpayment for copy), not misattribution.  
  - **Copyright Law:** Survives (modified). Copying still "free-rides" on creative labor, but damages would require proof of economic harm, not infringement *per se*. Independent creation remains non-infringing, aligning with experientialism.  

  ---

  ### **5. Philosophical Underdetermination**  
  Where practices **do not** adjudicate between rival theories:  
  - **Art Market:** Does value derive from the *artist’s genius* (Romanticism) or *provenance as cultural relic* (Institutional Theory)? Both explain price drops after reattribution.  
  - **Criminal Forgery:** Is the harm *economic* (paying for misrepresented goods) or *cultural* (corrupting artistic heritage)? The law requires only deception + financial loss, leaving motive open.  
  - **Copyright:** Is infringement wrong because it:  
    - Steals *labor* (Lockean) | Undermines *incentives* (utilitarian) | Violates *authorial autonomy* (Kantian)?  
    The law’s structure fits all three, requiring only derivation.  

  ---

  ### **Conclusion**  
  The three practices reflect **distinct social conventions** anchored in different conceptions of value: *historical causality* (art), *transactional truth* (forgery law), and *creative derivation* (copyright). They can coexist functionally but resist reduction to a unified aesthetic theory. The core conflict lies in whether value is emergent from material experience, historical narrative, or creative labor—a trilemma philosophy has not resolved. What binds them is their shared rejection of *pure empiricism*: all agree that two perceptually identical objects can differ radically in value based on unseen properties (origin, deception, derivation).
