prompt: |-
  I spent much of last night in a long argument with a friend about how we should supervise AI systems, and I want to get the view I defended into writing before I lose the thread. I would like your comments on the essay draft below, especially on whether its central distinction is stated accurately, whether the argument is genuinely interesting or merely a restatement of the obvious, and which specific paragraphs overreach or equivocate. Please do not give me reading lists, citations, or suggestions about what to read; I care about whether the argument works, not about the literature. If a term is being used in a nonstandard way, say so plainly.

  Essay draft:

  The standard contrast is between outcome-based supervision, which rewards or penalizes the final answer, and process-based supervision, which rewards or penalizes the steps by which the answer was reached. The usual case for process supervision is that outcome supervision is blind to how the result was obtained: a model can get the right answer for the wrong reasons, or get the wrong answer while reasoning well. The usual case for outcome supervision is that process labels are expensive and that a process which looks good can be a rationalization generated after the fact.

  I want to defend a third option, which I will call counterfactual process supervision. The idea is not to grade the trace the model actually produced, but to grade the trace it would have been likely to produce under small, controlled changes to the problem -- changes that should not alter the correct method, only the incidental details. If the model's success survives those changes, that is evidence that the process was robust; if it collapses, the original success was probably fragile. On this view, what we supervise is not the actual chain of thought but a disposition: a stable tendency to reach the answer by a method that would still work when the surface changes.

  This is supposed to combine the strengths of the other two. Like outcome supervision, it does not require us to trust the model's own narration of its reasoning. Like process supervision, it is sensitive to how the answer was reached, because it tests the method rather than the answer alone. And it gives us a way to talk about cases where the outcome is right but the process is bad: those are cases where the success is not counterfactually stable.

  The obvious objection is that this just pushes the problem back. If the model can detect the perturbations and adjust, then counterfactual stability is as gameable as a written rationale. My reply is that the perturbations need not be hidden from the model; they need only be drawn from a distribution that the model cannot reliably distinguish from the distribution of real deployment inputs. But I am not sure this reply is more than a promissory note.

  The deeper worry is about what "the same method" means. Counterfactual process supervision seems to presuppose a way of individuating methods across changes in surface features, and I do not have a theory of that. Without one, the proposal may be circular: it tells us to reward the method that would succeed under perturbation, but the only way we know the method is by seeing what succeeds under perturbation.

  So my tentative conclusion is that the distinction between process and outcome supervision is less fundamental than the distinction between supervision that is sensitive to counterfactual robustness and supervision that is not. If that is right, the real question is not "process or outcome?" but "which counterfactuals?" I would like to know whether this is a genuine advance or just a redescription of the standard trade-off, and where the essay's weakest link is.

  Please give me comments in three parts: first, accuracy -- are the characterizations of outcome and process supervision fair, and is the third option described coherently? Second, interest -- does the counterfactual-robustness framing actually add something, or is it a verbal reclassification? Third, the specific weak points -- identify the two or three places where the argument most needs repair, and say what repair you would attempt. End your reply with a single line beginning "Verdict:" followed by one of "survives," "needs revision," or "fails," then a dash and a one-sentence summary of your overall assessment.
reasoning: |-
  Okay, the user wants feedback on their essay draft about AI supervision methods. They've proposed a third approach called "counterfactual process supervision" and want to know if their distinction is accurate, if the argument is interesting, and where the weak points are. 

  First, I need to check their characterizations of outcome-based and process-based supervision. They describe outcome supervision as rewarding the final answer and process supervision as evaluating the steps. That seems standard and fair - no issues there. 

  The new concept of counterfactual process supervision is intriguing. They suggest testing how the model's reasoning would hold up under small, controlled changes to the problem. The goal is to assess the robustness of the method rather than just the output or the specific reasoning trace. This is described coherently, though the term "counterfactual" might be slightly nonstandard since it's usually about alternative scenarios rather than robustness testing. But I think it's acceptable as a fresh framing.

  Now, about whether this adds value - yes, it does. They're shifting the focus from "what steps were taken" to "how stable is the underlying method." That's a meaningful contribution beyond just rehashing the standard debate. It pushes us to think about robustness as a core aspect of supervision.

  The weak points stand out clearly. First, the reply to gameability feels incomplete. They mention using a distribution of perturbations that the model can't distinguish from real inputs, but that's hand-wavy since models are often trained on diverse data and might adapt. Second, the "same method" problem is serious - without defining how we identify methods across different scenarios, the proposal risks circularity. 

  For repairs: They could strengthen the gameability response by suggesting specific perturbation strategies like adversarial examples or domain shifts that are inherently hard to detect. For the method individuation issue, they might borrow concepts from cognitive science about invariant features of reasoning, though that could get messy. 

  Overall, the core idea survives scrutiny despite these flaws. It's not just a redescription - it opens new questions about robustness. The verdict should be "needs revision" because the objections require more substantial answers, but the foundation is promising.
answer: |-
  Here’s a focused critique addressing your three requests:

  ### Part 1: Accuracy  
  - **Outcome/process characterizations**: Fair and standard. You accurately capture the core tension: outcome supervision risks rewarding lucky guesses, while process supervision is costly and susceptible to rationalization.  
  - **Counterfactual process supervision (CPS)**: Coherently described. The core idea—testing robustness via controlled perturbations—is clear. The term "counterfactual" is *slightly* nonstandard (typically implying hypothetical alternatives to *past* events), but your usage ("would have been likely under small changes") is defensible and adequately defined.  

  ### Part 2: Interest  
  - **Adds value, not just reclassification**: This framing *genuinely advances* the discussion. You reframe the debate from "steps vs. outcome" to "robustness of method," which:  
    - Reveals a blind spot in both traditional methods (neither explicitly tests generalizability).  
    - Offers a concrete criterion for "right answer, wrong process" (fragility under perturbation).  
    - Proposes a novel supervisory signal (dispositional stability). This moves beyond verbal reshuffling.  

  ### Part 3: Weak Points & Repairs  
  1. **The "Gameability" Reply (Paragraph 4)**  
     - **Weakness**: The rebuttal ("perturbations need not be hidden...") is indeed a promissory note. It doesn’t address *how* to design a perturbation distribution that’s both (a) "indistinguishable from real deployment" and (b) *efficient to sample/test*. If the model *can* detect perturbations (even stochastically), it could learn to "pose" as robust without genuine understanding.  
     - **Repair**: Tighten the defense by specifying constraints: Perturbations must target *task-irrelevant* features (e.g., rephrasing, adding irrelevant clauses, minor numerical tweaks) where "correct method" is invariant. Acknowledge this requires careful task decomposition but argue it’s tractable for many domains (e.g., math, logic).  

  2. **The "Individuating Methods" Problem (Paragraph 5)**  
     - **Weakness**: The circularity concern is valid and critical. CPS relies on a pre-theoretical notion of "same method," which is undefined. Without this, "robustness" lacks meaning (e.g., is a method that works only for *prime* numbers "the same" as one for *all* integers?).  
     - **Repair**: Propose a pragmatic solution: Define "method" *operationally* via *human-specified functional invariants*. E.g., "A valid method must use theorem X, not exploit symmetry in the input string." This concedes the concept isn’t fundamental but argues it’s actionable in practice with domain expertise.  

  3. **Overreach in Conclusion (Final Paragraph)**  
     - **Weakness**: Claiming CPS supersedes the process/outcome distinction "fundamentally" overreaches. CPS *depends* on process/outcome labels (to grade the counterfactual traces). It’s a hybrid strategy, not a new paradigm.  
     - **Repair**: Moderate the claim: Frame CPS as a *bridge* that *uses* counterfactual outcomes to *infer* process quality. E.g., "CPS doesn’t eliminate the trade-off but offers a third axis—robustness—for evaluating supervision strategies."  

  ---

  **Verdict: needs revision** — The core insight is novel and valuable (robustness as a supervisory target), but critical objections about gameability and method individuation require substantive engagement beyond promissory notes.
