  Okay, let me start by unpacking the user's query. They're dealing with a conversation about deflationism in truth, and their girlfriend's brother explained it in a way that's causing confusion. The user feels something might be off but isn't sure what. I need to break down each part of the brother's explanation and compare it to actual deflationist theories.

  First, the brother claims deflationists think "true" doesn't pick out any real property. That's accurate. Deflationists like Paul Horwich or the prosentential theory argue that "true" is a linguistic tool, not a property. So the user's brother got that right.

  Next, he mentions that "it's true that the cat's on the mat" is equivalent to "the cat's on the mat." That's the disquotational schema, core to deflationism. So that part is correct. But then he says truth is just whatever the community agrees on. That's a red flag. Deflationism doesn't equate truth with consensus. They separate the concept of truth from how we determine what's true. So here, the brother is conflating deflationism with relativism or consensus theories.

  The brother also says deflationists think correspondence and coherence debates are a waste of time. Half-right. Deflationists do see those debates as misguided because they reject truth as a substantive property. But they don't dismiss the importance of justification methods like evidence or coherence. They just say those aren't part of truth itself.

  Then the big issue: the claim that deflationism can't explain error. The brother argues that if truth is just endorsement, there's no way to be wrong. But deflationists counter this by distinguishing between using "true" as endorsement and the conditions under which a claim is true. For example, the community can endorse a false statement. Truth-bearers are made true by reality, not agreement. So the brother's point here confuses the concept of truth with its application.

  Looking at the user's deeper needs, they might be seeking clarity after a confusing conversation, possibly feeling intellectually overwhelmed. They want to validate their suspicion that something was off without disrespecting the brother. They might also need a structured comparison to understand where the brother's explanation went astray, especially the conflation with relativism and the error problem. Highlighting the distinctions between deflationism and relativism is key here. Ensuring they grasp that deflationism doesn't deny objective truth but redefines the term's function is crucial. Also, clarifying the error objection shows that deflationism can handle false claims by separating endorsement from factual correctness.
answer: |-
  You're right to be bugged - your girlfriend's brother gave you a mostly accurate intro to deflationism, but crucially **strayed into significant misrepresentation at the end**, conflating it with relativism and creating the "can't make sense of error" problem. Here's the breakdown:

  **Parts an Actual Deflationist Would Happily Sign Off On:**

  1.  **"True" doesn't pick out a substantive property:** This is core. Deflationists (like Frege, Ramsey, Quine, Horwich) argue that "true" isn't the name of some deep, mysterious property (like correspondence with reality or coherence) shared by all true things. Calling a sentence "true" doesn't *add* some extra metaphysical ingredient.
  2.  **"True" is a handy linguistic device:** Absolutely. Its primary functions are:
      *   **Endorsement/Agreement:** Saying "That's true" is a concise way to agree with a statement without repeating it.
      *   **Generalization:** Saying "Everything she said is true" or "All logical truths are true" allows us to affirm a potentially infinite number of statements without listing them individually. This is essential for logic and communication.
  3.  **The Equivalence Schema ("Disquotation"):** The claim that "It is true that the cat is on the mat" **says exactly the same thing as** "The cat is on the mat" is fundamental. This is often expressed as the schema: 'It is true that *p*' if and only if *p*. Deflationists see this schema (or something very close to it) as *exhausting* the content of the concept of truth. There's nothing more to "truth" than what's captured by these equivalences.

  **Half-Right / Needs Nuance:**

  1.  **"There's nothing substantive for a theory of truth to explain":** Deflationists *do* think that traditional "theories of truth" (correspondence, coherence, pragmatic) are misguided *because* they mistakenly assume "truth" is a substantive property requiring deep metaphysical explanation. They think the *only* thing a theory of truth needs to do is explain the function of the *word* "true" and account for the equivalence schema.
      *   **Nuance:** While rejecting a *metaphysical* theory of truth, they still need a *logical/linguistic* theory explaining how "true" works and why the equivalence holds. They might also need to explain *why* certain sentences satisfy the schema (e.g., through evidence, coherence, utility), but they insist this isn't part of the *meaning* of truth itself.
  2.  **"The correspondence-vs-coherence debate was a waste of time":** Deflationists *do* believe this debate rests on a false premise – that "truth" names a single, substantive relation that needs such an explanation.
      *   **Nuance:** They wouldn't necessarily say the *questions* motivating those debates (e.g., "How do we know things?", "How do beliefs relate to the world?", "What makes a belief system justified?") are wastes of time. Those are crucial questions about *justification*, *evidence*, and *knowledge* – they just aren't questions about the *nature* of the *property* of truth itself. Deflationism tries to *dissolve* the metaphysical debate, not dismiss epistemology.

  **Parts They Would Flatly Deny (The Sneaky Bit):**

  1.  **"Truth is just whatever your community agrees to call true":** **THIS IS ABSOLUTELY WRONG AND NOT DEFLATIONISM.** This is **relativism** or **consensus theory**, and it's diametrically opposed to core deflationism.
      *   **Why it's wrong:** Deflationism is **radically minimalist** about truth, not **relativist**. The equivalence schema is key: "It is true that snow is white" iff snow *is* white. The truth of "snow is white" depends on the *color of snow*, not on what anyone believes or agrees on. If your community agrees that "snow is green," the deflationist says "It is true that snow is green" iff snow *is* green. If snow isn't green, then "snow is green" is false, *regardless* of community agreement. Deflationism separates the *concept* of truth (minimal, defined by equivalence) from the *means of justification* (evidence, coherence, community standards). It preserves objective truth conditions via the schema. Conflating it with consensus is a major error.

  **The "Can't Make Sense of Error" Objection:**

  *   **Your Brother's Claim:** He argues that if "true" is just a stamp of endorsement, then there's no standard *outside* of endorsement for a sentence to fail to match. Therefore, if a community endorses something, it's "true" for them, and they can't be wrong by their own lights. Deflationism supposedly can't explain genuine error.
  *   **Why it's a Misunderstanding (and a Result of his Relativist Slip):**
      *   **Endorsement vs. Truth:** Deflationists *distinguish* between *calling* something true (which is an act of endorsement) and something *being* true (which is determined by the equivalence schema and the world). *Calling* a sentence true is endorsing it. But *whether* that sentence *is* true depends on whether the world is as the sentence says (via the equivalence schema).
      *   **Error is Simple:** A sentence is false when *the world isn't the way the sentence says it is*. "The cat is on the mat" is false if the cat is *not* on the mat. This is captured directly by the equivalence schema: "It is true that the cat is on the mat" iff *the cat is on the mat*. If the cat isn't on the mat, the left side ("It is true that...") is false. The deflationist explains falsity just as easily as truth: a sentence is false when its negation satisfies the schema (or directly by the failure of the equivalence).
      *   **Community Error:** A community endorsing "The cat is on the mat" is *performing the act of calling it true*. But the deflationist says "It is true that the cat is on the mat" iff *the cat is on the mat*. If the cat *isn't* on the mat, then the community is *mistaken*, precisely *because* the sentence they endorsed fails to satisfy the equivalence schema with the actual state of the world. The standard for error is built into the schema itself: the state of the world.
      *   **The Source of the Confusion:** Your brother *created* the error problem by mistakenly adding the relativist claim ("truth is just what the community agrees on"). *Pure* deflationism, grounded solely in the equivalence schema, has no problem accounting for error. Error occurs when we endorse a sentence that doesn't correspond to the way the world is, as per the schema.

  **In Summary:**

  *   **He Got Right:** The core minimalist claim, the rejection of "truth" as a substantive property, the linguistic functions of "true," and the equivalence schema.
  *   **He Got Half-Right (Needs Nuance):** The dismissal of correspondence/coherence *as theories of the nature of truth*, but not necessarily dismissing the epistemic questions they tried to answer.
  *   **He Got Flatly Wrong (and Caused the Problem):** Equating deflationism with "truth is just consensus." This is relativism, not deflationism.
  *   **The Error Objection:** This is **not** a fair objection to *actual* deflationism. It's a consequence of *misunderstanding* deflationism as relativism. Proper deflationism, via the equivalence schema, provides a perfectly clear account of error: a sentence is false when the world isn't the way the sentence says it is. The standard for error is objective reality, mediated by the linguistic equivalence.

  Your intuition was spot on – the last part was indeed sneaky (and incorrect). Deflationism is subtle; it tries to dissolve philosophical problems about truth by making the concept incredibly thin and logical, not by making it dependent on human agreement. Your brother accidentally imported a much more controversial (and problematic) view into his explanation.
