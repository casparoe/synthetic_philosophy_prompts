  ### Leaf Positions  
  Each position includes its most awkward commitment and a consistency check for your views.  

  1. **Harmful-Dysfunction View**  
     - *Awkward commitment:* Dysfunction must be biological—even if society causes harm (e.g., burnout from exploitation isn’t a disorder).  
     - *Consistency check on autism:* You must reject "neurodiversity" unless biological dysfunction is proven.  

  2. **Practical-Kinds Instrumentalism**  
     - *Awkward commitment:* Drapetomania was valid in its context—it served plantation owners' "purpose."  
     - *Consistency check on gaming disorder:* You must support its inclusion if clinically useful, even without biological evidence.  

  3. **Role Constructionism**  
     - *Awkward commitment:* MPD was "real" only because therapists created roles for patients to inhabit.  
     - *Consistency check on burnout:* You must say it becomes a disorder if clinicians start treating it as one.  

  4. **Dynamic Nominalism (Hacking-style)**  
     - *Awkward commitment:* Categories like autism create new "kinds of people" who didn’t exist before the label.  
     - *Consistency check on homosexuality:* You must say its removal erased a way of being, not just a diagnosis.  

  5. **Natural-Kind Realism**  
     - *Awkward commitment:* Psychiatric disorders have fixed biological essences—e.g., depression must be one thing, not a spectrum.  
     - *Consistency check on drapetomania:* You must deny it was ever a disorder, as it lacked a biological basis.  

  6. **Identity-First/Neurodiversity Position**  
     - *Awkward commitment:* Severe autism is still not a disorder—just a difference requiring accommodation.  
     - *Consistency check on burnout:* You must oppose its inclusion in the DSM as it pathologizes identity.  

  7. **Dimensional/Transdiagnostic View**  
     - *Awkward commitment:* Diagnoses like depression or anxiety are arbitrary—all mental distress exists on continua.  
     - *Consistency check on gaming disorder:* You must reject it as a discrete category, reframing it as part of impulsivity spectra.  

  8. **Abolitionist Position**  
     - *Awkward commitment:* Even useful categories (e.g., PTSD) should be abolished as tools of oppression.  
     - *Consistency check on MPD:* You must say its decline proves psychiatry invents disorders to control people.  

  9. **Homeostatic-Cluster Realism**  
     - *Awkward commitment:* Schizophrenia is real even if symptoms are maintained by feedback loops (e.g., paranoia → isolation → worse paranoia).  
     - *Consistency check on autism:* You must support broadening the spectrum to capture all trait co-occurrences.  

