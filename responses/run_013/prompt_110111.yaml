prompt: |-
  I run a small reading group at work for engineers who want to get sharper on decision and game theory, and I'm the one writing the take-home for the last session. The topic is program equilibrium — the thing where two bots play a one-shot prisoner's dilemma, but each bot gets to read the other one's source code before it moves, and somehow they both cooperate and neither wants to bail. I get the vibe of it and I definately don't get the mechanism, so I want to write a question that forces students to actually explain it rather than recite the vibe back.

  Here's the setup I'm going to hand them, so you can build the question around it: two players. Each writes a program and submits it to a referee before either one sees the other's. Each program is given, as its input, the full source text of the *other* program. Each program prints C or D. Payoffs: both C, 3 each; both D, 0 each; one defects while the other cooperates, 5 to the defector and -1 to the cooperator. Nobody can edit their program after seeing the other one's.

  The thing I want them to grapple with is this. The obvious program — read the other program's source, figure out what it's going to print, print C if it's going to print C — obviously doesn't work, because the other program is doing the same thing to you and you've got a loop with no bottom. But the version that supposedly does work doesn't simulate anything, it *proves* things, and I've been told its Löb's theorem doing the heavy lifting, which means nothing to me. So part of the question has to force them to say what the fix actually is and why the loop stops being a problem once you do it that way.

  I also want them to get the equilibrium bookkeeping right, because this is where everyone hand-waves, me included: is 'both cooperate' a Nash equilibrium of the game they're actually playing? Equilibrium over what — the programs, or the moves? And what has to be true of the two programs for any of this to work (access to each other's code, access to their own, same proof system, enough time to actually find the proof), and what happens if one of the players is a black box I can only query and can't read?

  One more thing to work in: a colleague insists the whole trick secretly requires a program to be able to quote its own source code, and that in a normal programming language you can't do that without a quine hack. I have no idea if he's right. Build the question so that a good answer has to take a position on it.

  Level: smart engineers, no formal logic background past 'I've heard of Gödel', so the model answer has to be followable by them. But I don't want it softened into 'cooperation is possible when there's commitment' — the mechanism is the whole point.

  Format, in this order:

  - 'The question' — the version I can hand out as-is, around 250 words, with a short restatement of the setup so it stands on its own.
  - 'Model answer' — around 700 words, what a strong student should say, written at that level.
  - 'Marking scheme' — five must-hit points, marks adding to 20, and under each point one line on the mistake that usually costs students that mark.
  - 'A vs B' — three or four sentences naming the move or two that separate an A answer from a B answer.
  - 'Corrections' — if I've got any of the mechanism wrong up above, tell me in two or three sentences at the end. I'd rather hear it from you than from the group.
reasoning: |-
  We are designing a take-home question for a reading group on program equilibrium in the context of a one-shot Prisoner's Dilemma with source code access.

  The core challenge: students must explain how two programs, each having the other's source code, can achieve mutual cooperation without getting stuck in an infinite loop of simulation. The key is to use proof-based cooperation (using Löb's theorem) rather than simulation.

  Important points to cover:
  1. Why the naive simulation approach fails (infinite regress).
  2. The fix: instead of simulating, the program tries to prove that the other program will output C. If it finds such a proof, it outputs C; otherwise, it outputs D.
  3. The role of Löb's theorem: it resolves the self-referential problem by allowing a program to trust its own proofs about itself (if it can prove that a proof of X implies X, then it can prove X). However, note that in the classic FairBot, Löb's theorem is used implicitly to show that the program can prove its own cooperation under the assumption that the other program is similar.
  4. Equilibrium considerations: we are considering Nash equilibrium in the space of programs. The pair of programs (both using the proof-based strategy) form an equilibrium because if either player deviates to a different program, they might get a worse outcome (e.g., if they try to defect, they might trigger the other to defect too, resulting in 0 instead of 3).
  5. Requirements: both programs must share the same proof system (so they can verify each other's proofs), have access to their own source code (to construct self-referential proofs), and the proof system must be sufficiently powerful (to reason about the programs) but not too powerful (to avoid inconsistency). Also, the proof search must be bounded (to avoid infinite runtime) but we assume that the necessary proofs can be found within the bound.
  6. The quine issue: the program must be able to refer to its own source code. This is typically achieved by writing a program that can output its own source (a quine). However, note that in practice, the program might be given its own source by the referee? Or it must be able to construct it? The question is: does the program need to be a quine? The answer is that the program does not necessarily need to be a quine if the environment (referee) provides the program with its own source code. However, in the classic setup, the program only gets the opponent's source code. So how does it get its own? It must either be provided by the referee (which is not the case in our setup) or it must be able to generate it (via a quine). Therefore, the colleague is correct: the program must be able to output its own source code (i.e., be a quine) to use in the proof. But note: in the proof, the program needs to reason about what it itself would do. For that, it needs to have its own source code. Since the referee only gives the other program's source, the program must have its own source built-in (or be able to generate it). Hence, the quine hack is required.

  Let's design the question and the model answer accordingly.

  The Question (about 250 words):

  "Two players in a one-shot Prisoner's Dilemma each submit a program to a referee. The referee runs each program, providing as input the full source code of the other program. Each program then prints either 'C' (cooperate) or 'D' (defect). Payoffs: mutual cooperation yields 3 to each, mutual defection yields 0, and if one defects while the other cooperates, the defector gets 5 and the cooperator gets -1. Players cannot modify their programs after seeing the other's.

  A naive program might try to simulate the other program to predict its move. However, this can lead to infinite regress if both programs try to simulate each other.

  (a) Explain why the naive simulation approach fails. (3 points)

  (b) Describe a program that avoids this problem by using a proof-based approach. How does it decide its move? (6 points)

  (c) Why is this program able to break the infinite regress? (Hint: think about what the program proves about itself and the other program, and the role of Löb's theorem.) (5 points)

  (d) In the proof-based approach, must each program be able to output its own source code (i.e., be a quine)? Why or why not? (3 points)

  (e) Suppose both players submit the same proof-based program. Is mutual cooperation a Nash equilibrium? Explain why or why not. (3 points)"

  Model Answer (about 700 words):

  (a) The naive simulation approach fails because of mutual recursion without a base case. Consider two programs, A and B. A tries to simulate B to see what B will output. But B, when simulated by A, will in turn try to simulate A. Now A is simulating B, which is simulating A, and so on. This leads to an infinite regress because there is no termination condition. The simulation stack grows without bound and the programs never produce an output.

  (b) The proof-based approach avoids simulation. The program (let's call it FairBot) works as follows:

    1. It searches for a proof (within a fixed time limit) in a shared formal system that the other program (given its source code) outputs 'C'. 
    2. If it finds such a proof, then it outputs 'C'. 
    3. Otherwise, it outputs 'D'.

  Crucially, the program does not simulate the other program. Instead, it uses a proof system to reason about the other program's behavior.

  (c) The infinite regress is broken because the proof system allows the program to reason about the other program without actually running it. The key insight is that the two identical programs (if both are FairBot) can each prove that the other will output 'C'. 

  How? Consider FairBot_A (with source code S_A) and FairBot_B (with source code S_B, which is identical to S_A). FairBot_A is given S_B. It attempts to prove that FairBot_B outputs 'C'. To do so, it notes that FairBot_B (with source S_B) is trying to prove that FairBot_A (with source S_A) outputs 'C'. But since S_A and S_B are the same, proving that FairBot_A outputs 'C' is the same as proving that FairBot_B outputs 'C'. This circularity is resolved by Löb's theorem.

  Löb's theorem states that, in a consistent formal system that can prove its own consistency, if we can prove that "if there is a proof of statement X, then X is true", then we can prove X. In this case, the statement X is "FairBot_A outputs 'C'".

  FairBot_A can prove: "If there exists a proof that FairBot_A outputs 'C', then FairBot_A does output 'C'." Why? Because FairBot_A's code says: if it finds a proof that the other program outputs 'C', then it outputs 'C'. But note: the other program (FairBot_B) is the same as FairBot_A. So if there is a proof that FairBot_A outputs 'C', then FairBot_B (being the same) would find a proof that FairBot_A outputs 'C' and hence output 'C'. Therefore, FairBot_A would output 'C'. So we have: a proof of "there exists a proof of X → X" (where X is "FairBot_A outputs 'C'"). Then by Löb's theorem, the system can prove X. Therefore, FairBot_A finds a proof that FairBot_B outputs 'C', and so it outputs 'C'. Similarly for FairBot_B.

  Thus, the proof exists and is found, so both cooperate.

  (d) Yes, each program must be able to access its own source code, and this typically requires a quine. In the proof-based approach, when FairBot_A is reasoning about FairBot_B, it must note that FairBot_B is using the same code as itself. Therefore, FairBot_A must have access to its own source code (S_A) to compare with S_B and to construct the self-referential proof. However, the referee only provides the other program's source code. Therefore, the program must contain its own source code within it (or be able to generate it) to use in the proof. This is achieved by writing the program as a quine. Without being a quine, the program would not have its own source code to use in the proof.

  (e) Mutual cooperation is a Nash equilibrium in the space of programs. Consider both players submitting FairBot. Now, if one player deviates to a different program (say, one that always defects, or a different version of FairBot), we must check if the deviator can get a higher payoff. 

  - If the deviator submits a program that always defects, then when paired with FairBot: FairBot will search for a proof that the defector outputs 'C'. It won't find one (because the defector never outputs 'C'), so FairBot outputs 'D'. The outcome is (D,D) and the deviator gets 0, which is worse than 3.

  - If the deviator submits a program that cooperates unconditionally, then FairBot (when paired with it) would still find a proof that the unconditional cooperator outputs 'C' (which is true) and so FairBot would output 'C'. The deviator would get 3 (same as before). But note that the deviator might be vulnerable to other programs (like defectors) but in this pairing, the payoff is the same.

  - However, the critical point: can the deviator get 5? To get 5, the deviator must defect while the other cooperates. But if the deviator defects, then FairBot (if it cooperates) would give the deviator 5. But FairBot only cooperates if it can prove that the deviator will cooperate. Since the deviator is defecting, FairBot won't find such a proof and will defect. So the deviator cannot get 5 against FairBot.

  Therefore, no deviation yields a higher payoff than 3 when playing against FairBot. Hence, mutual cooperation (via both using FairBot) is a Nash equilibrium.

  Marking Scheme (5 points total, but we have 20 points across parts. Let's break down):

  Part (a): 3 points
  - Must state that each program simulates the other, which then simulates the first, leading to infinite recursion without a base case. (2 points for the recursion, 1 point for the lack of base case)

  Common mistake: Only saying "infinite loop" without explaining the mutual simulation.

  Part (b): 6 points
  - 2 points: The program searches for a proof (in a shared formal system) that the other program outputs C.
  - 2 points: If it finds such a proof, it outputs C; otherwise D.
  - 2 points: It does not simulate the other program, but uses the proof system.

  Common mistake: Confusing proof search with simulation.

  Part (c): 5 points
  - 1 point: Uses the same code for both programs (so they are symmetric).
  - 2 points: Explains that each program can prove that the other outputs C because of the symmetry and the use of Löb's theorem.
  - 2 points: Explains Löb's theorem in the context: proving that "if there is a proof that I output C, then I do output C" leads to a proof that I output C.

  Common mistake: Only saying "Löb's theorem solves it" without explaining the self-referential step.

  Part (d): 3 points
  - 1 point: States that the program must have access to its own source code for the proof.
  - 1 point: Notes that the referee only provides the other program's source, so the program must contain its own source (or generate it).
  - 1 point: Concludes that a quine is necessary.

  Common mistake: Saying that the referee gives both sources (which is not the case).

  Part (e): 3 points
  - 1 point: States that mutual cooperation is a Nash equilibrium.
  - 2 points: Explains that any defecting program would cause the FairBot to defect (so the deviator gets at most 0, which is less than 3). Also, if the deviator uses a different cooperative program, it might still get 3 but not more.

  Common mistake: Only considering a deviation to always defect and not considering other deviations.

  A vs B:

  An A answer will clearly explain the role of self-reference and Löb's theorem in breaking the loop (in part c) and will correctly identify the necessity of a quine (in part d). It will also provide a complete equilibrium analysis by considering multiple types of deviations (including unconditional defection and unconditional cooperation) and show that none yield more than 3 against FairBot.

  A B answer might miss the depth of the self-referential proof (e.g., stating that the programs just "trust each other" without the mechanism of Löb) and might overlook the quine requirement. In equilibrium, it might only consider the always-defect deviation.

  Corrections:

  1. In the setup, the referee provides only the other program's source code. So the program does not get its own source by the referee. Hence, the quine requirement is indeed necessary for the program to have its own source code for the proof.

  2. Löb's theorem is used to resolve the circularity: the program proves that if there is a proof of its own cooperation, then it does cooperate. Then by Löb, it proves that it cooperates. This step is critical and not just handwaved.

  3. The proof search must be bounded to ensure termination. In practice, the program might not find the proof in time and then defect. But in the ideal case (with sufficient resources) the proof is found.

  4. The shared formal system must be sufficiently powerful (to encode the program and the necessary proofs) and consistent (to avoid proving false statements).

  We hope this helps.
answer: |-
  ### The Question  
  Two players submit programs to a referee for a one-shot Prisoner’s Dilemma. The referee provides each program with the *other program’s full source code* as input. Each program outputs C (cooperate) or D (defect). Payoffs: (C,C) → (3,3); (D,D) → (0,0); (C,D) → (−1,5); (D,C) → (5,−1). Programs cannot be modified after submission.  

  A naive approach is for each program to simulate the other’s behavior to decide its move. However, this often causes infinite loops.  

  **(a)** Why does the naive simulation approach fail? (3 marks)  
  **(b)** Describe a proof-based program that avoids this issue. How does it decide to output C or D? (6 marks)  
  **(c)** Explain why this program breaks the infinite regress, including the role of self-reference and Löb’s theorem. (5 marks)  
  **(d)** Must each program be a *quine* (able to output its own source code)? Justify your answer. (3 marks)  
  **(e)** If both players submit your program from (b), is mutual cooperation a Nash equilibrium? Explain. (3 marks)  

  ---

  ### Model Answer  
  **(a)** The naive simulation approach fails due to **mutual recursion without termination**. If Program A simulates Program B to predict B’s output, B’s simulation (when run by A) will reciprocally simulate A. This creates an infinite loop: A simulates B simulating A simulating B... Since neither program has a base case to halt this recursion, both hang indefinitely and output nothing.  

  **(b)** The solution is a **proof-based "FairBot"**:  
  1. The program uses a shared, consistent formal system (e.g., Peano Arithmetic) to search for a proof that the other program outputs C.  
  2. If it finds such a proof within a reasonable time bound, it outputs C.  
  3. Otherwise, it defaults to D.  
  Critically, it **does not simulate** the other program. Instead, it uses mathematical proof search on the other program’s source code.  

  **(c)** Infinite regress breaks because proof search **replaces execution with static analysis**. Consider two identical FairBots, \(A\) and \(B\). \(A\) gets \(B\)’s source (which matches \(A\)’s). \(A\) attempts to prove "\(B\) outputs C". Since \(B\) is identical to \(A\), proving \(B\)’s cooperation requires proving \(A\)’s cooperation. This circularity is resolved via **Löb’s theorem**:  
  - Löb’s theorem states: If a system can prove "if there’s a proof of \(X\), then \(X\) is true", it can prove \(X\).  
  - \(A\) can prove: "If a proof exists that \(A\) outputs C, then \(A\) does output C" (because \(A\)’s code outputs C if it finds a proof for \(B\)).  
  - By Löb’s theorem, \(A\) **proves it outputs C**. Thus, \(A\) proves \(B\) outputs C (since \(B = A\)) and cooperates.  
  Self-reference works because \(A\)’s code is fixed and accessible (via quining), allowing \(A\) to embed its own behavior in proofs about \(B\).  

  **(d)** **Yes, a quine is necessary**. The referee only provides the *other* program’s source. To reason about itself (e.g., for Löb’s theorem), a program must access its *own* source. Since it can’t rely on the referee for this, it must output its source via a quine (e.g., by including a self-representation string). Without this, it cannot construct proofs involving its own behavior.  

  **(e)** **Mutual cooperation is a Nash equilibrium**. Both players use FairBot, yielding (C,C) and payoff 3. A unilateral deviation fails:  
  - If a player submits "Always D", FairBot (paired with it) finds no proof that "Always D" outputs C → FairBot outputs D → (D,D), giving the deviator 0 (<3).  
  - If a player submits "Always C", FairBot finds a proof that "Always C" outputs C → FairBot outputs C → (C,C), same payoff (3).  
  - No program can get 5: If a deviator tries to defect, FairBot (seeing no proof of cooperation) defects → (D,D), denying the deviator a payoff >3.  
  Thus, no profitable deviation exists.  

  ---

  ### Marking Scheme (20 marks total)  
  1. **Part (a) - Simulation failure (3 marks)**:  
     - Must identify mutual recursion and lack of termination.  
     - *Common mistake: Only says "infinite loop" without explaining mutual dependence.*  

  2. **Part (b) - Proof-based mechanism (6 marks)**:  
     - 2 marks for "searches for proof of other’s cooperation".  
     - 2 marks for "outputs C if proof found, else D".  
     - 2 marks for "no simulation, uses proof search".  
     - *Common mistake: Confuses proof search with execution (e.g., "it checks if the other is like itself").*  

  3. **Part (c) - Breaking regress (5 marks)**:  
     - 2 marks for using self-reference (same code for both).  
     - 3 marks for explaining Löb’s theorem’s role (from "proof of implication" to "proof of action").  
     - *Common mistake: Mentions Löb’s theorem but doesn’t connect it to the program’s decision rule.*  

  4. **Part (d) - Quine necessity (3 marks)**:  
     - 1 mark for "needs own source for self-reference".  
     - 1 mark for "referee only gives other’s source".  
     - 1 mark for "quine required to access own source".  
     - *Common mistake: Assumes the referee provides both sources.*  

  5. **Part (e) - Equilibrium (3 marks)**:  
     - 1 mark for "yes, it’s Nash".  
     - 2 marks for analyzing deviations (Always D → 0; Always C → same; no way to get 5).  
     - *Common mistake: Only considers Always D, ignores other deviations.*  

  ---

  ### A vs B Answer  
  - **A answer**: Explicitly names Löb’s theorem and uses it to resolve self-reference in (c); rigorously ties quine necessity to proof construction in (d); checks multiple deviations (Always D, Always C, and implicit others) in (e).  
  - **B answer**: Describes proof search but handwaves Löb’s theorem (e.g., "proofs avoid loops"); misses quine implications; only analyzes Always D in equilibrium.  

  ---

  ### Corrections  
  1. The core mechanism relies on **Löb’s theorem**, not just "trust" or simulation. It enables a program to prove its *own* cooperation from the implication in its code.  
  2. **Quines are essential**: Programs must embed their source to reason about themselves (the referee doesn’t provide it).  
  3. **Practical constraints**: Proof search requires a shared consistent formal system, bounded runtime, and programs must be "reasonably represented" (e.g., no adversarial obfuscation). A black-box opponent (no source access) would force default defection, breaking cooperation.
