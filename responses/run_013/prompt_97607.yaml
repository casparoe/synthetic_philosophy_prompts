     Thus, no pure strategy is strictly dominated by another pure strategy.

  (ii) Now consider Player 1 using a mixed strategy. Let Player 1 mix between T and M. Suppose Player 1 plays T with probability p and M with probability (1-p). The expected payoff of this mixed strategy against Player 2's strategies:

     Against L: 3p + 0*(1-p) = 3p
     Against R: 0p + 3*(1-p) = 3(1-p)

     Compare this to playing B (which gives 1 against both L and R). We want a mixed strategy (p) such that:

        3p > 1   and   3(1-p) > 1

     The first inequality: p > 1/3.
     The second inequality: 1-p > 1/3  => p < 2/3.

