          (M, L): 
              Player 1: if Player 2 plays L, T gives 3, M gives 0, B gives 1 -> best is T (3), so Player 1 would deviate to T.
          (T, L): 
              Player 1: 3 (if he plays T) is better than M (0) and B (1) -> no incentive to deviate. 
