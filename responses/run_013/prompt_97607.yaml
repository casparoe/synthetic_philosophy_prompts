          Let Player 1 play T with probability p, M with probability q, and B with probability 1-p-q. But note that we found B is strictly dominated, so in equilibrium it won't be played. So we can set q = 1-p (and no B).

          However, we must consider the reduced game without B (as we did in IESDS). So the game is:

            Player 1: T and M
            Player 2: L and R

          Let Player 1 play T with probability p, M with probability 1-p.
          Let Player 2 play L with probability q, R with probability 1-q.

          Player 1's expected payoff:
            If playing T: 3*q + 0*(1-q) = 3q
            If playing M: 0*q + 3*(1-q) = 3(1-q)

          In mixed strategy, Player 1 must be indifferent between T and M:
            3q = 3(1-q)  => 3q = 3 - 3q => 6q=3 => q=1/2.

          Player 2's expected payoff:
            If playing L: 0*p + 1*(1-p) = 1-p
            If playing R: 1*p + 0*(1-p) = p

          Player 2 must be indifferent between L and R:
            1-p = p  => 1 = 2p => p=1/2.

          Therefore, the mixed strategy Nash equilibrium is:
            Player 1: T with probability 1/2, M with probability 1/2, and B with 0.
            Player 2: L with probability 1/2, R with probability 1/2.

          The payoff for Player 1: 3*(1/2) = 1.5 (from T) or 3*(1/2)=1.5 (from M) -> same.
          The payoff for Player 2: 1-p = 1-1/2 = 0.5 when playing L, and p=1/2=0.5 when playing R -> same.

          How does the set of strategies that survive IESDS relate to the Nash equilibrium?
            The Nash equilibrium uses only the strategies that survived IESDS: T and M for Player 1 and L and R for Player 2. The dominated strategy B is not played.

          So the IESDS procedure correctly reduced the game to the strategies that are played with positive probability in the Nash equilibrium.

  **(b) Game B:**

  (i) First, eliminate a weakly dominated strategy for Player 1 and then for Player 2.

     For Player 1:
          T: gives 2 regardless of Player 2's move (if L: 2, if C: 2).
          B: gives 2 if Player 2 plays L, and 0 if Player 2 plays C.

          So T weakly dominates B: because T gives at least as much as B in every column, and strictly more in column C.

          Eliminate B.

          Now the game is:

            Player 1 only has T, and Player 2 has L and C:

                 L: (2,3)
                 C: (2,3)

          For Player 2: both L and C yield 3. So they are payoff equivalent. Therefore, neither weakly dominates the other? Actually, weak dominance requires that one strategy is at least as good in all and strictly better in at least one. Here, L and C are the same. So no weak dominance. Thus, both survive.

          Surviving strategies: T for Player 1, and {L, C} for Player 2.

  (ii) Now start by eliminating a weakly dominated strategy for Player 2.

     For Player 2:
          If Player 2 plays L: 
              When Player 1 plays T: 3
              When Player 1 plays B: 3
          If Player 2 plays C:
              When Player 1 plays T: 3
              When Player 1 plays B: 1

          So L weakly dominates C: because in both rows (T and B), L gives at least as much as C (and in the row B, it gives strictly more: 3>1). Therefore, we can eliminate C.

          Now the game is:

            |        | L      |
            |--------|--------|
            | **T**  | (2, 3) |
            | **B**  | (2, 3) |

          For Player 1: both T and B give 2. So they are payoff equivalent. Therefore, neither weakly dominates the other? But note: T and B are identical in this reduced game. So no weak dominance. Thus, both survive.

          Surviving strategies: {T, B} for Player 1 and L for Player 2.

  (iii) Explanation: 
          The order of elimination matters for weakly dominated strategies because weak dominance allows for ties (i.e., equal payoffs in some cases). Therefore, when we eliminate a strategy that is weakly dominated, we might be removing a strategy that could have been used to weakly dominate another strategy. 

          In contrast, for strict dominance, if a strategy is strictly dominated, it remains strictly dominated regardless of what other strategies are removed (as long as the dominating strategy remains). That is, strict dominance is not affected by the removal of other strictly dominated strategies. Therefore, the order of elimination does not matter for strict dominance: we will always end up with the same set of strategies (the iterated elimination of strictly dominated strategies is order-independent).

          In Game B, when we eliminated Player 1's weakly dominated strategy (B) first, we ended up with T for Player 1 and both for Player 2. When we eliminated Player 2's weakly dominated strategy (C) first, we ended up with both for Player 1 and L for Player 2. Hence, the order mattered.

