answer: |-
  ### Problem: Dominated Strategies in Game Theory

  **Instructions:** Solve the following problems step by step. Show all reasoning. Both games are simultaneous-move, two-player games. Player 1 chooses the row, Player 2 chooses the column. Payoffs are given as (Player 1, Player 2).

  #### Game A:
  |      | L       | R       |
  |------|---------|---------|
  | **T**| (3, 0)  | (0, 1)  |
  | **M**| (0, 1)  | (3, 0)  |
  | **B**| (1, 1)  | (1, 1)  |

  #### Game B:
  |      | L       | C       |
  |------|---------|---------|
  | **T**| (2, 3)  | (2, 3)  |
  | **B**| (2, 3)  | (0, 1)  |

  ---

  **Questions:**  
  (a) **For Game A:**  
      (i) Show that no pure strategy for Player 1 is strictly dominated by any other *pure* strategy. Similarly, show this for Player 2.  
      (ii) Prove that one of Player 1’s strategies *is* strictly dominated by a **mixed strategy**. Perform iterated elimination of strictly dominated strategies (IESDS) and list all surviving strategies.  
      (iii) Identify all pure-strategy Nash equilibria (NE). Find the mixed-strategy NE. How do the surviving strategies from (ii) relate to this NE?  

  (b) **For Game B:**  
      (i) First, eliminate any weakly dominated strategy for Player 1, then for Player 2. List the surviving strategies.  
      (ii) Next, start by eliminating any weakly dominated strategy for Player 2, then for Player 1. List the surviving strategies.  
      (iii) Explain why the order of elimination affects the outcome in (i) and (ii) for *weak* dominance but not for *strict* dominance.  

  ---

  ### Model Answer (700–900 words)

  #### (a) Game A  
  **(i) No pure-strategy dominance**  
  For Player 1:  
  - **T vs. M**: If Player 2 plays L, T (payoff 3) > M (0). If Player 2 plays R, M (3) > T (0). Neither dominates the other.  
  - **T vs. B**: If L, T (3) > B (1). If R, B (1) > T (0). No dominance.  
  - **M vs. B**: If L, B (1) > M (0). If R, M (3) > B (1). No dominance.  

  For Player 2:  
  - **L vs. R**: If Player 1 plays T, R (1) > L (0). If Player 1 plays M, L (1) > R (0). If Player 1 plays B, L (1) = R (1). Neither dominates.  

  **(ii) Mixed-strategy dominance and IESDS**  
  **B is strictly dominated** by a mixed strategy of T and M. Let Player 1 play T with probability \(p\) and M with probability \(1-p\). The expected payoffs:  
  - Against L: \(3p + 0(1-p) = 3p\)  
  - Against R: \(0p + 3(1-p) = 3(1-p)\)  
  We need \(3p > 1\) and \(3(1-p) > 1\):  
  - \(p > \frac{1}{3}\) and \(p < \frac{2}{3}\).  
  For \(p = \frac{1}{2}\), payoffs are 1.5 against both L and R, which exceeds B’s payoff of 1. Thus, B is strictly dominated.  

  **IESDS**:  
  1. Eliminate B (strictly dominated by mixed strategy).  
     Reduced game:  
     |      | L       | R       |
     |------|---------|---------|
     | **T**| (3, 0)  | (0, 1)  |
     | **M**| (0, 1)  | (3, 0)  |  
  2. No further strict dominance (pure or mixed) for Player 1 or 2.  
     - Player 1: T and M lack dominance (as in (i)).  
     - Player 2: L and R lack dominance (as in (i)).  
  **Surviving strategies**: Player 1: {T, M}; Player 2: {L, R}.  

  **(iii) Nash equilibria**  
  **Pure-strategy NE**: None.  
  - (T, L): Player 2 prefers R (1 > 0).  
  - (T, R): Player 1 prefers M (3 > 0).  
  - (M, L): Player 1 prefers T (3 > 0).  
  - (M, R): Player 2 prefers L (1 > 0).  
  - (B, L) or (B, R): Player 1 prefers T or M.  

  **Mixed-strategy NE**:  
  - Player 1 mixes T (\(q\)) and M (\(1-q\)).  
  - Player 2 mixes L (\(r\)) and R (\(1-r\)).  
  Player 1’s indifference:  
  - Payoff from T: \(3r + 0(1-r) = 3r\)  
  - Payoff from M: \(0r + 3(1-r) = 3(1-r)\)  
  Set equal: \(3r = 3(1-r) \Rightarrow r = \frac{1}{2}\).  
  Player 2’s indifference:  
  - Payoff from L: \(0q + 1(1-q) = 1-q\)  
  - Payoff from R: \(1q + 0(1-q) = q\)  
  Set equal: \(1-q = q \Rightarrow q = \frac{1}{2}\).  
  **NE**: Player 1 plays \((\frac{1}{2}T, \frac{1}{2}M)\), Player 2 plays \((\frac{1}{2}L, \frac{1}{2}R)\).  

  **Relation to IESDS**: The surviving strategies {T, M} for Player 1 and {L, R} for Player 2 are exactly those used in the mixed-strategy NE. IESDS prunes irrelevant strategies (like B), simplifying equilibrium analysis.  

  ---

  #### (b) Game B  
  **(i) Eliminate Player 1 first**  
  - Player 1: T always gives 2. B gives 2 (if L) or 0 (if C). Thus, T **weakly dominates** B (equal against L, better against C). Eliminate B.  
    Reduced game:  
    |      | L       | C       |
    |------|---------|---------|
    | **T**| (2, 3)  | (2, 3)  |  
  - Player 2: L and C both yield 3 against T. Neither weakly dominates the other (payoffs identical).  
  **Surviving strategies**: Player 1: {T}; Player 2: {L, C}.  

  **(ii) Eliminate Player 2 first**  
  - Player 2: Against T or B, L gives 3 (same as C if T, better than C if B). Thus, L **weakly dominates** C. Eliminate C.  
    Reduced game:  
    |      | L       |
    |------|---------|
    | **T**| (2, 3)  |
    | **B**| (2, 3)  |  
  - Player 1: T and B both yield 2 against L. Neither weakly dominates the other.  
  **Surviving strategies**: Player 1: {T, B}; Player 2: {L}.  

  **(iii) Why order matters for weak (but not strict) dominance**  
  - **Strict dominance**: Removal order is irrelevant. If strategy X is strictly dominated (even by a mixture), it remains dominated regardless of other eliminations, as long as the dominating strategies survive.  
  - **Weak dominance**: Order can change outcomes. Weak dominance allows equal payoffs, so eliminating one strategy may remove the "threat" that made another strategy dominated.  
    - In Game B (i): Eliminating B first removes Player 2’s incentive to avoid C (since C is only bad if B is played). Thus, C survives.  
    - In Game B (ii): Eliminating C first spares B (since B is only weakly dominated if C is present). Thus, B survives.  
  Weak dominance is sensitive to the set of active strategies, leading to order-dependent results.  

  ---

  ### Marking Scheme (Total: 20 points)

  #### (a) Game A (10 points)
  - **(i) No pure-strategy dominance (2 points)**  
    - 1 pt: Correctly show no pure dominance for Player 1 (all comparisons).  
    - 1 pt: Correctly show no pure dominance for Player 2.  
    *Deduct 0.5 if missing one comparison.*  
  - **(ii) Mixed dominance and IESDS (4 points)**  
    - 2 pts: Prove B is strictly dominated by mixed T/M (correct inequalities and \(p\) range).  
    - 1 pt: Correctly eliminate B and show reduced game.  
    - 1 pt: No further elimination; surviving strategies {T, M} and {L, R}.  
    *Common errors:  
      – Claiming B dominated by pure T or M (–1 pt).  
      – Further incorrect elimination (e.g., claiming T/M dominates post-B) (–1 pt).*  
  - **(iii) NE and relation (4 points)**  
    - 1 pt: No pure-strategy NE.  
    - 2 pts: Correct mixed NE (\(q = \frac{1}{2}\), \(r = \frac{1}{2}\)).  
    - 1 pt: Relate surviving strategies to NE support.  
    *Deduct 1 if pure NE incorrectly identified.*  

  #### (b) Game B (8 points)
  - **(i) Eliminate P1→P2 (3 points)**  
    - 1 pt: T weakly dominates B for Player 1.  
    - 1 pt: Eliminate B.  
    - 1 pt: No weak dominance for Player 2; survivors {T}, {L, C}.  
  - **(ii) Eliminate P2→P1 (3 points)**  
    - 1 pt: L weakly dominates C for Player 2.  
    - 1 pt: Eliminate C.  
    - 1 pt: No weak dominance for Player 1; survivors {T, B}, {L}.  
  - **(iii) Explanation (2 points)**  
    - 1 pt: Order irrelevant for strict dominance (domination persists).  
    - 1 pt: Order matters for weak dominance due to payoff ties/context dependence.  
    *Common errors:  
      – Confusing weak/strict dominance (–1 pt).  
      – Missing "payoff ties" in explanation (–0.5 pt).*  

  #### Key Mistakes to Penalize
  - **Game A(ii)**: Assuming only pure strategies can dominate (–1 pt).  
  - **Game B(i/ii)**: Claiming strict instead of weak dominance (–0.5 per instance).  
  - **General**: Nash equilibrium calculation errors (e.g., wrong indifference conditions) or misidentifying dominance.  
  - **Explanations**: Vague reasoning without payoff comparisons.  

  ---  
  This problem set reinforces core concepts: mixed strategies can dominate even when pure strategies cannot, and weak dominance is order-dependent due to payoff ties. Use the answer key to self-check!
