answer: |-
  ## The Obligation in Asphalt: Jaywalking Through Conventions

  Your case presents a fascinating puzzle about the normative weight of imposed regularities. Let's apply the frameworks sequentially.

  **1. Lewisian Convention or Imposed Regularity?**
  On Lewis's strict definition, the jaywalking ordinances were **never conventions**. A Lewis convention solves a *recurring coordination problem* where all parties have a shared interest in coordinating (e.g., driving on the same side). Pre-automobile streets functioned as shared space – the coordination was *de facto* and mutual. Pedestrians crossing mid-block posed no inherent *coordination failure* for other pedestrians; it was simply how space was used. The automobile's speed created a new physical danger, but the ordinances didn't emerge organically to solve a coordination *problem* perceived *by pedestrians and drivers alike*. Instead, they were imposed by a powerful faction (auto interests) to *create* a problem (pedestrian "trespass") where none was previously recognised, solely serving *their* interest in unimpeded movement. There was no alternative "regularity" pedestrians would have been "equally content" with (like left vs. right driving); they were content with the *status quo ante*. The pressure was unilateral, not conditional mutual expectation. This top-down imposition, serving one group's interests rather than solving a mutual coordination problem, **strongly tells against these ordinances generating a binding Lewisian convention** for pedestrians. The obligation feels like an externally dictated rule, not a mutually beneficial solution.

  **2. Effect of the Ordinances: Obligation, Duty, or Prudence?**
  What the ordinances *did* is complex and likely varied:
  *   **Legally:** They unquestionably created a *legal duty*. Violation carried (and carries) potential fines. This exists regardless of moral force.
  *   **Morally/Psychologically:** The effect is mixed, illuminated by Bicchieri and Hart.
      *   **Bicchieri:** Initially, compliance might have been driven largely by fear of punishment (prudence) and nascent *empirical expectations* ("Cars are fast, people are starting to cross only at corners, I should too to avoid getting hit or fined"). However, the campaign successfully fostered *normative expectations* over time. The labelling ("jay" = fool), public shaming (like your friend experienced), and constant reinforcement created beliefs that others *expected* conformity and *disapproved* of mid-block crossing. This transformed it from mere prudence into a **social norm** – deviation risked social sanction *beyond* the legal or physical risk. People began crossing at corners partly because they felt they *ought* to, to avoid being seen as reckless or foolish.
      *   **Hart:** Adoption of the "internal point of view" was likely patchy and never universal. For many pedestrians, especially early on, the rule remained purely external – a prediction of sanction (legal or social/financial) or physical harm. However, for a significant portion, particularly those socialised after the campaign or in high-traffic areas, the rule *did* become a standard. They criticised themselves for jaywalking ("That was stupid/reckless") and others ("Idiot! Use the crosswalk!"). This internalisation granted the practice a *semblance* of moral obligation rooted in safety and orderliness, even if its origins were suspect. Crucially, the *real risk* from fast traffic provided a powerful, non-moral reason to comply, easily conflated with duty.
      *   **Verdict:** The ordinances primarily created a **legal duty backed by a potent mix of prudence and emergent social normativity**. For many, it fostered a *sense* of obligation arising from normative expectations (Bicchieri) and partial internalisation (Hart), but this was layered *on top* of, and often indistinguishable from, the very real prudential concern for safety amplified by the new traffic regime. It wasn't a pure moral obligation springing from mutual agreement, but a complex social-legal construct fused with self-preservation.

  **3. The Visitor's "Obligation"**
  What does your baffled friend owe?
  *   **Avoidance of Real Risk:** They undeniably owe it to *themselves* and potentially others (e.g., drivers who might be traumatised by hitting them) to avoid causing accidents. On a busy arterial road, prudence dictates using crosswalks regardless of local norms. This is context-dependent (negligible risk at midnight on a quiet street).
  *   **Courtesy:** There might be a weak duty of courtesy to avoid startling drivers or causing sudden braking, even if the risk is low. This is minor and highly context-sensitive.
  *   **Fairness to Compliers?** **Minimal to none.** Unlike queueing, where jumping the line unfairly exploits the compliance of others who wait their turn, jaywalking doesn't inherently free-ride on compliers' sacrifices. Someone crossing mid-block doesn't make crosswalk-users worse off or nullify their effort. Compliers gain no direct benefit from others complying beyond perhaps diffuse notions of order. The "fairness" argument is weak here.
  *   **Genuine Obligation from Participation?** **Highly doubtful.** Merely being in a place with a local practice doesn't automatically generate a moral obligation to conform, especially when:
      *   The practice was imposed to serve external interests, not solve a mutual problem.
      *   The visitor has no stake in the local coordination equilibrium (if one exists, it's primarily for drivers).
      *   They haven't tacitly agreed by benefiting from the system in a way that requires reciprocity (unlike using public roads funded by taxes). Their participation is incidental.
      The shouting represents enforcement of the local *social norm* (Bicchieri's normative expectations), not evidence of a moral obligation *owed* by the visitor. The visitor's primary "obligations" are prudence and perhaps minor courtesy, not conformity to the norm *as such*.

  **4. What the Case Does to the Framework**
  This case **exposes a significant gap in the Lewis framework** and highlights the power of Bicchieri and Hart. Lewis focuses on conventions as solutions to *mutual* coordination problems. Jaywalking laws demonstrate how a powerful group can *impose* a regularity that primarily benefits itself, framing it as solving a "problem" it largely created. This regularity **acquired normative force (via Bicchieri's normative expectations and Hart's internal point of view) without ever having been a Lewisian coordination equilibrium.** People came to feel obligated, not because it solved a problem *for them*, but due to sustained social pressure, internalisation, and the conflation of the rule with genuine prudence. The framework runs out in explaining the *origin* of the normative force in such imposed systems – it shows *how* norms stick (empirical -> normative expectations, internalisation) but less *why* they form when the mutual benefit is absent. The puzzlement isn't ours about conventions; it's about how non-conventions can mimic their normative force through social engineering and risk.

  **Verdict: Manufactured Deference.** The ordinances created a potent sense of obligation for many pedestrians through internalised social norms and conflation with prudence, but this stemmed from top-down imposition and social pressure, not a mutual coordination solution generating genuine moral weight. For the visitor, obligation remains rooted solely in risk and courtesy, not the practice itself.
