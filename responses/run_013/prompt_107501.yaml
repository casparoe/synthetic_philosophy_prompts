prompt: |-
  I am trying to pin down what a theory of corruption would have to get right before I take sides between any of the accounts on offer. The ordinary cases are too easy and the hard cases pull in opposite directions, so I want the specification drawn up first, on its own, before any candidate is graded against it.

  Write the desiderata for an adequate theory of corruption: the full list of what any account must deliver if it is to say which practices are corrupt and which are not, in a way that is neither parochially Western nor so permissive that nothing is corrupt. For each requirement, give the case or consideration that motivates it and say what would be lost if the requirement were dropped. Then divide the list into the requirements that are non-negotiable and those that are merely the preferences of a particular camp. Finally — and this is the part I most want — say whether any subset of the requirements is jointly unsatisfiable, and if so, which subset. A real contradiction among the desiderata would be worth more to me than a tidy list that conceals one.

  The cases that generate the requirements, each of which should be made to do real work; add any you think I have missed:

  1. A municipal clerk in a society where anyone whose paperwork is expedited is expected to make a public, recorded offering to the clerk's household at the next harvest; the offering is customary, its size is roughly fixed, everyone knows the clerk accepts them, and declining to give one is read as a snub that costs you your place in the queue. There is no secrecy, no haggling, and no differential price. A visiting consultant calls it a bribe; the clerk's neighbours call it manners.

  2. A payment that is secret, negotiated case by case, priced to what the payer can bear, and made precisely because it changes an official decision. Any theory, I take it, must count this as corrupt; the question is what it shares with case 1 that case 1 lacks, and whether the theory can isolate that feature without smuggling in the outsider's disgust.

  3. A society with no word corresponding to corruption that nevertheless punishes certain betrayals of office, set against a donor country that treats its own statutory definition as the measure of the rest of the world. Say whether the outsider is right, wrong, or making a category mistake, and what follows for the theory either way.

  4. A payment to a low-level official that secures a service the state is failing to provide, in a bureaucracy whose formal procedures are unusable. I want to know whether the theory is entitled to call this corrupt even while conceding that the alternative is worse.

  5. Patronage that functions as a channel of political representation for people whom formal institutions ignore. Whether this is corruption or a different thing wearing its surface seems to me the sharpest test of where a theory draws its lines.

  Two distinctions I want the list to force a verdict on rather than blur: between a gift that creates an obligation and a bribe that buys a decision, and between corruption and clientelism. Say also whether the theory must be able to define corruption without leaning on the local word for it or the local sense of shame, and what it costs the theory if it cannot.

  Then name the single requirement that does the most to exclude otherwise popular theories, and say what it excludes.
reasoning: |-
  Hmm, the user is asking for a rigorous framework to evaluate theories of corruption. They want desiderata that are grounded in concrete cases and reveal potential contradictions. This is clearly an academic or philosophical inquiry, possibly for research or policy development. Their frustration with "easy cases" and "opposite directions" suggests they've encountered superficial analyses before.

  The five cases they provided are excellent stress tests. Let me unpack their implicit challenges:
  - Case 1 challenges ethnocentric definitions (gift vs bribe)
  - Case 2 is the corruption "control group"
  - Case 3 probes cultural relativism
  - Case 4 examines dysfunction as mitigation
  - Case 5 blurs corruption with representation

  I notice they're particularly concerned about Western parochialism and definitional overreach. The demand to separate "non-negotiable" from "negotiable" requirements indicates they want to identify core principles versus cultural preferences. And their request for contradictions is brilliant - they're anticipating theoretical tradeoffs.

  For the desiderata, I'll start with universal requirements that any theory must satisfy, then move to contested ones. The gift/bribe and corruption/clientelism distinctions need special handling because they're definitional tripwires. The most important revelation will be the fundamental contradiction between institutional function and social acceptance - that's where most theories fail.

  The "secret requirement" they'll appreciate is probably #6 (non-parochial universality) since it disqualifies many Western-centric models. I should emphasize how it conflicts with #3 (functional harm) when institutions are already broken, as in Case 4. That tension is theoretically productive.

  Their unspoken need seems to be: "Help me find where corruption theory inevitably breaks down." So I'll foreground the paradox where anti-corruption measures could themselves become corrupt in dysfunctional states. That's the knife-edge they're searching for.
answer: |-
  Here is a rigorous set of desiderata for an adequate theory of corruption, derived from your cases and core concerns. I've structured it to expose tensions, force verdicts on key distinctions, and identify non-negotiable requirements.

  ## Core Desiderata (Non-Negotiable)

  1.  **Functional Harm Requirement:** *Must identify a core harm to the *purpose* or *function* of an institution, role, or process.*
      *   **Motivation:** Distinguishes Case 1 (customary offering tied to harvest, no secrecy/haggling/differential pricing) from Case 2 (secret, negotiated, differential payment changing a decision). Case 2 directly subverts the institution's decision-making function for private gain. Case 1, while perhaps inefficient or distasteful to outsiders, operates within a known, predictable system that doesn't *necessarily* distort outcomes relative to its *functioning* norms. What's lost if dropped? The theory becomes merely descriptive of practices labeled "corrupt" elsewhere, losing critical bite and the ability to critique *why* something is wrong beyond convention.
      *   **Forces Verdict:** Clarifies the gift/bribe distinction: A gift creating obligation *becomes* a bribe when the obligation directly subverts the *core function* of the role (e.g., impartial decision-making, equitable service delivery).

  2.  **Breach of Entrusted Power Requirement:** *Must involve the misuse of power or resources *entrusted* to an agent (individual or institution) for public or organizational benefit, for private (individual or factional) gain or advantage.*
      *   **Motivation:** Central to Cases 2 (clear misuse), 4 (low-level official misusing access to provide state service for private payment), and 5 (patron misusing state resources/power for client loyalty). Explains the core wrong: betrayal of the principal's (public/organization) trust. What's lost if dropped? The theory cannot differentiate corruption from mere criminality (e.g., theft from a private company) or socially disapproved but non-fiduciary acts.
      *   **Forces Verdict:** Separates corruption from clientelism: Clientelism *becomes* corruption when it involves the *misuse of entrusted public resources/power* (e.g., diverting state funds, manipulating hiring/promotion rules) to build patronage networks. Clientelism based purely on private resources (e.g., a wealthy individual funding community projects for votes) may be problematic but isn't inherently corrupt.

  3.  **Non-Parochial Universality Requirement:** *Must define corruption independently of specific legal codes, cultural labels ("corruption"), or localized senses of shame/disgust.*
      *   **Motivation:** Case 3 (society without "corruption" word punishing betrayals vs. donor imposing statutory definition). The theory must explain *why* the donor might be wrong (if imposing an irrelevant standard) *or* right (if identifying a universal functional harm) without relying on either culture's terminology or emotional response. What's lost if dropped? The theory becomes ethnocentric (Case 1 dismissed/condemned solely by outsider norms) or relativistic (Case 2 excused if locally normalized), failing your core test.
      *   **Forces Verdict:** Requires defining corruption based on the functional harm and breach of trust *as applicable within the institutional context*, not the local label or feeling.

  4.  **Intent/Effect Requirement:** *Must account for the *intent* to misuse entrusted power for private gain, or the *foreseeable effect* of such misuse, even if intent is ambiguous.*
      *   **Motivation:** Case 2 (explicit intent) vs. Case 1 (intent may be adherence to custom, effect may be routine service). Case 4: The official might intend to help (bypassing broken system) but foreseeably misuses power for private gain. What's lost if dropped? Purely intent-based theories excuse systemic corruption with plausible deniability; purely effect-based theories risk condemning unintended consequences or necessary evils.

  ## Contested/Contextual Desiderata (Negotiable/Weighted)

  5.  **Secrecy/Deception Requirement (Often Overweighted):** *May consider secrecy, deception, or evasion of rules as a common *indicator* or *aggravating factor*, but cannot be definitionally necessary.*
      *   **Motivation:** Case 1 (totally open) vs. Case 2 (secret). Case 5 (patronage often open). Dropping secrecy allows the theory to condemn open, normalized corruption (e.g., kleptocracies, some forms of nepotism). Including it risks excusing culturally embedded practices that cause functional harm (Case 1 *if* harm is proven). Preference leans towards *not* making it definitional.

  6.  **Differential Advantage Requirement (Often Overweighted):** *May consider the creation of unfair or inequitable advantage as a common *consequence* or *indicator*, but cannot be definitionally necessary.*
      *   **Motivation:** Case 1 (fixed offering, no differential advantage *within the system*) vs. Case 2 (priced to bear, differential advantage). Case 4: Payment secures service *denied to others* unfairly. Case 5: Patronage creates advantage for clients. Functional harm (Requirement 1) often *causes* inequity, but a practice could theoretically harm an institution's function (e.g., systematic inefficiency, erosion of trust) without creating *differential* individual advantage. Preference leans towards *not* making it definitional, subsuming inequity under functional harm.

  7.  **Mitigation/Necessity Caveat:** *Must be able to recognize mitigating factors (e.g., state failure in Case 4) or even justifications *for the actor* without negating the *categorical judgment* of the act as corrupt.*
      *   **Motivation:** Case 4 (payment in failing state). The theory must say: "This act *is* corrupt (breach of entrusted power for private gain causing functional harm - e.g., undermining rule of law, creating inequity), *but* it may be the least bad option available to the citizen/official in this context, potentially mitigating blame or even justifying it under duress." What's lost if dropped? The theory becomes inflexible, unable to distinguish the *wrongfulness of the act* from the *culpability of the actor* or contextual pressures.

  ## The Core Contradiction (Jointly Unsatisfiable Subset)

  *   **The Tension:** Requirement 1 (**Functional Harm**) and Requirement 3 (**Non-Parochial Universality**) can come into direct conflict with Requirement 7 (**Mitigation/Necessity Caveat**) in contexts of **profound state dysfunction or contested institutional legitimacy**.
  *   **The Conflict:** In Case 4 (failing bureaucracy) or Case 5 (patronage as representation for ignored groups):
      *   **Requirement 1 (Functional Harm):** The act (e.g., bribe for service, patronage appointment) may harm the *formal, intended* function of the institution (rule of law, meritocracy, equitable service).
      *   **Requirement 3 (Non-Parochial Universality):** The judgment must be based on the institution's *actual context*, not an idealized Western model. If the formal institution is *fundamentally dysfunctional or illegitimate* for a significant portion of the population, does its "intended function" remain the valid benchmark? Does the patronage network in Case 5 *become* the de facto functional institution for representation/survival?
      *   **Requirement 7 (Mitigation/Necessity):** Forces acknowledgment that the corrupt act might be necessary for survival or achieving a minimal level of justice/representation *within the broken system*.
  *   **The Unsatisfiable Core:** **Requiring an act to be categorically labeled "corrupt" (based on breach of trust harming formal function - Req 1 & 2) *while simultaneously* acknowledging that within its specific context (Req 3), the formal function may be irrelevant/impossible, and the act may be functionally necessary or even legitimate for basic welfare/representation (Req 7) creates an irresolvable tension.** The theory can consistently say "corrupt but necessary" or "functional within the de facto system," but not both "corrupt" and "non-functional-harmful" *in the same frame of reference*.
  *   **Consequence:** This exposes the limits of universal categorization. The theory must either:
      *   **Prioritize Formal Function:** Label acts corrupt based on the breach of the *entrusted* role/power *as formally defined*, even if context makes this judgment seem harsh or irrelevant (sacrificing nuance of Req 7 & context in Req 3). *Or*
      *   **Prioritize De Facto Function/Context:** Risk collapsing into relativism where "corruption" only exists if locally labeled and condemned as such (sacrificing Req 3's independence and Req 1's core harm principle). Most adequate theories will lean towards the first, acknowledging the contradiction via Req 7 (corrupt *act*, mitigated *context*).

  ## The Single Most Excluding Requirement

  *   **Requirement 3: Non-Parochial Universality.** This is the killer for many popular theories.
  *   **What it Excludes:**
      *   **Legalistic Theories:** Theories defining corruption solely as "violation of law X" fail immediately. They are inherently parochial and cannot handle Case 3 or critique Case 1 effectively.
      *   **Public Opinion/Disgust Theories:** Theories relying on what "the public" perceives as corrupt or what causes "shame" fail, as public opinion varies culturally (Case 1 vs. outsider, Case 3) and can be manipulated.
      *   **Cultural Relativist Theories:** Theories that *only* define corruption by the local label or condemnation (the opposite of Req 3) are excluded because they cannot condemn practices like Case 2 if locally normalized or provide a universal standard.
      *   **Overly Moralistic Theories:** Theories relying heavily on abstract Western moral concepts (e.g., purity, absolute fairness) without grounding in functional harm and breach of trust within context struggle to meet this requirement neutrally.

  This framework forces a theory to ground corruption in a universal core (**misuse of entrusted power causing functional harm to an institution's purpose**) while navigating the treacherous waters of cultural context, systemic failure, and the blurry lines between gifts/bribes and corruption/clientelism. The unresolved tension around dysfunctional states reveals the fundamental challenge: applying a universal standard to contexts where the very institution being corrupted may lack legitimacy or functionality.
