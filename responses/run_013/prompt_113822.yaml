  This distinction isn't circular because it addresses the revisionists' epistemic failure to engage with counterevidence, separate from their initial predictive successes. Without this feature, the revisionist approach might become respectable if they abandoned their immunizing strategies.

  The strongest revisionist counterargument - that mainstream scholars also make adjustments - fails because mainstream adjustments are constrained by multiple independent lines of evidence, unlike the revisionists' arbitrary modifications.

