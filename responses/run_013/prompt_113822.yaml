  Here is a constructed case satisfying all specifications:

  **The Case: The Seal of Kurunta at Hattusa and Tarhuntassa**

  During excavations at Hattusa (Hittite capital), a clay bulla (seal impression) is found in a secure administrative archive building, stratigraphically dated to the final phase of the Hittite Empire (conventionally ~1200 BCE). The seal names "Kurunta, Great King, Labarna, Hero, [Son of] Mursili." This is explosive. Kurunta is known from treaties (found earlier) as a cousin of Tudhaliya IV, *granted* the title "King of Tarhuntassa" (a major appanage kingdom), but *not* "Great King" or "Labarna" (exclusive Hittite imperial titles). Mainstream chronology places Tudhaliya IV ~1240-1215 BCE. The stratigraphy suggests this seal was used *after* Tudhaliya's reign.

  **Mainstream Account (Conventional Chronology):**
  Kurunta briefly usurped the imperial title after Tudhaliya IV's death, perhaps during a succession crisis involving Tudhaliya's son Suppiluliuma II. This explains the seal, its presence in Hattusa (captured or sent as a challenge?), and its stratigraphic position. It resolves the puzzle of why Suppiluliuma II's later inscriptions emphasize his legitimacy so strongly. The mainstream prediction? Further evidence (texts, sealings) might show tension or conflict between Suppiluliuma II and Tarhuntassa. The mechanism is dynastic conflict.

  **Revisionist Account (e.g., Shifting Hittite Empire centuries later):**
  Revisionists (e.g., placing Tudhaliya IV ~1050-1025 BCE) had previously argued Tarhuntassa became independent earlier. They predict *in advance* that evidence would show Tarhuntassa's kings used the full imperial title contemporaneously. This seal is hailed as stunning confirmation. They precisely predict: 1) No evidence of conflict between Hattusa and Tarhuntassa during Suppiluliuma II's reign will be found (unifying this with their explanation for the lack of Hittite records of invasions supposedly centuries earlier). 2) Kurunta's reign in Tarhuntassa will show independent monumental building matching the later style they associate with ~1000 BCE.

  **New Evidence:**
  Subsequent excavations at Tarhuntassa (identified as Kızıldağ) uncover a rock relief commissioned by "Kurunta, Great King, Hero." Stylistically, the relief shows strong continuity with late Hittite Empire art (consistent with ~1200 BCE mainstream). Crucially, associated pottery is standard Late Bronze Age. Most decisively, organic material (wooden scaffolding peg) found *embedded* in the mortar of the foundation platform for the relief's access path yields radiocarbon dates clustering around **1220-1180 BCE (95% probability)** – directly contradicting the revisionist ~1000 BCE prediction but consistent with mainstream.

  **Analysis Against Specifications:**

  1.  **Mainstream Rational:** The radiocarbon date, stratigraphy, pottery, and artistic style converge on ~1200 BCE. The usurpation explains the title anomaly *and* Suppiluliuma II's texts. The revisionist date is falsified by direct scientific dating.
  2.  **Revisionist Wins Internally on 3 Scores:**
      *   *Precision/Falsifiability:* They predicted *no conflict evidence* and *later monumental style*. Mainstream predicted vaguer "tension/conflict".
      *   *Survived Predictions:* The *initial* seal discovery perfectly matched their precise title prediction. Mainstream was surprised.
      *   *Unification:* Their "independent Tarhuntassa" mechanism unified the title anomaly *and* the lack of earlier invasion records *and* predicted the monumental style period.
  3.  **Mainstream Advantage Source:** Radiocarbon dating is an objective, physical science method applied fairly to material embedded in the monument's construction context. Both sides have access to the date and context report. Authority/number of adherents isn't the basis.
  4.  **Revisionist Failure:** Sincere & competent scholars, they understood the radiocarbon technique. Their failure is epistemic: clinging to a timeline falsified by direct physical evidence due to over-reliance on textual synchronisms and stylistic arguments vulnerable to circularity.

  **(a) The Demarcating Feature:** **Methodological Accountability.** Specifically, the mainstream account *allows the physical evidence (radiocarbon date) to decisively falsify its overall chronological framework* and integrates it. The revisionist account *must immunize its core chronological shift from this falsification*.

  **(b) Distinct from the 3 Scores:** The revisionists won on initial predictive precision, initial success rate, and explanatory unification *within their pre-existing framework*. Methodological Accountability concerns *how the framework itself responds to severe, objective counter-evidence* that strikes at its core postulate (the chronological shift). Winning the first three scores doesn't guarantee this accountability; one can have precise, successful, unifying theories that are still pseudoscientific if they evade falsification.

  **(c) Removal of the Feature:** If the radiocarbon date was ambiguous, contaminated, or absent, the revisionist account, despite its ad hoc elements, would *not* be pseudoscientific based on this case. It would be a bold, testable, initially successful rival hypothesis worthy of serious consideration and further testing. Its potential flaws would be ordinary scientific contention, not pseudoscience.

  **(d) Strongest Revisionist Reply & Success:**
  *   **Reply:** "The radiocarbon date is correct *for the wood*, but the wood is intrusive or reused. The peg could have been an old piece of timber used centuries later during a restoration or even an accidental inclusion. The monument's *construction* might still be ~1000 BCE. We need dates from multiple materials within the core masonry."
  *   **Does it Succeed?** Partially, but not decisively. It's a *possible* objection (raising doubt), but it's an *ad hoc rescue* lacking positive evidence. The peg was deeply embedded in primary construction mortar. The burden shifts to the revisionists to provide positive evidence for reuse or a later date. If they investigate and find core materials dating to ~1000 BCE, it becomes respectable. If they dismiss *all* contrary physical dates without compelling evidence specific to each case, they remain pseudoscientific. This shows the criterion (Accountability) requires *engagement* with falsifying evidence, not necessarily immediate capitulation, but a good-faith effort to test the objection *and* a willingness to abandon the core theory if counter-evidence becomes overwhelming and irreconcilable.

  **What to Tell Your Brother:**

  "Look, I get the appeal. Your revisionists can make sharp predictions and seem to solve puzzles neatly. Here's a scenario where they *do* exactly that: predict a specific title usage, it's found, it fits their unification. They win on precision, initial success, and scope. *But*... then a radiocarbon date from the core of the related monument directly contradicts their shifted timeline. The mainstream, surprised initially, accepts this hard evidence and adjusts its *narrative* (usurpation), not its core chronology. The revisionists? They have to start questioning the radiocarbon technique or imagining undocumented reuse of old wood – not based on evidence *for* that here, but purely to save their timeline. *That's* the difference. It's not about who predicted what first, or even who has more answers initially. It's about which system truly lets the evidence, *especially the hard, countervailing physical evidence*, call the fundamental framework into question. Does your revisionist model have a mechanism for *itself* to be falsified by evidence like this, or does it always find a way to bend the evidence to fit? If it's the latter, that's not science, it's faith in a timeline. Show me how *your* specific model would genuinely fail if confronted with unambiguous evidence contradicting its key shift. If it can't, or if the answer is always 'well, the dating must be wrong', then you've got the answer to your methodological boast."
