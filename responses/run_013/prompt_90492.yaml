prompt: |-
  Is there a name for this? I'm an econ PhD working on intergenerational disadvantage, so I sit in a lot of rooms where people are trying to work out whether someone is responsible for how their life went, and I keep seeing the same move. He's broke because of his choices — dropped out, blew the money. Yeah, but he dropped out because the school was a disaster and nobody at home could help him. Fine, but at some point he still chose not to go back, and that choice is his. But not going back was itself shaped — eighteen years of being told he was stupid. Then the choice to believe it is his. Nobody ever argues for where the chain stops. It just stops wherever the conversation needs it to stop for the verdict to come out right, and when you press for a stopping rule you get something like 'that's where he was most free' or 'that's where he's most himself', which sounds like a criterion but always happens to land exactly where the conclusion needed it to. Is there a term for this — responsibility being pinned at a point in a causal chain, with the point picked by the desired verdict rather than by any principle? I know brute luck vs option luck, and I think there's something in the responsibility literature about responsibility tracing back through earlier choices, but neither seems to be this. If it's unnamed, coin something and tell me where the edges are: is the compatibilist who says responsibility just is the capacity to respond to reasons, no tracing needed, doing the same thing or refusing to do it? A label on its own won't help me, I need the boundaries.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're an econ PhD working on intergenerational disadvantage, so they're deeply involved in discussions about responsibility and causation. The core issue they're describing is how people arbitrarily stop the causal chain of responsibility at a point that fits their desired verdict without a clear principle. 

  First, I need to verify if there's an existing term for this. I recall concepts like moral luck, causal chains, and compatibilism, but none exactly match. The "tracing" mechanism in responsibility literature comes close but usually involves tracing back to an initial choice, which isn't the arbitrary stopping point the user mentions. Terms like "cherry-picking" or "ad hoc" are too vague. Maybe "responsibility laundering" or "convenient causal truncation"? But those aren't established terms.

  The user wants boundaries, not just a label. They mentioned compatibilism as an example. A compatibilist might avoid this by focusing on current capacities, but that could be another form of truncation. The user needs to differentiate between arbitrary stopping and principled truncation. So the key is the lack of a consistent principle versus having one, even if it's debatable.

  Also, their deeper need might be to critique these discussions effectively. They need terminology that highlights the methodological flaw. Terms like "retrospective construction of agential pivots" emphasize constructing the point after the fact. But they might need something more accessible for interdisciplinary talks.

  I should check if any philosophy papers discuss this exact issue. Fischer's tracing, Strawson's reactive attitudes, or Dennett's compatibilism might touch on it. But the arbitrariness in selecting the pivot point seems underexplored. Coining a term like "arbitrary agential pivot selection" could work, stressing the selection process without principle.

  Boundaries: Compatibilists might reject tracing, thus avoiding the chain, but could truncate differently. Determinists might see the whole chain as fixed, denying pivots. The user needs to show that the pivot is chosen based on the verdict, not prior criteria. Examples from their field, like blaming dropout without context, illustrate this well.

  They also need to address policy implications. Arbitrary pivots can lead to biased policies. Highlighting terms like "truncation" can show how structural factors are ignored. Ensuring the term is actionable for their critique is crucial.
answer: |-
  This is a brilliant dissection of a fundamental and pervasive problem in responsibility attribution, especially concerning structural disadvantage. You're right that existing terms like "brute luck" or "tracing" don't quite capture the *arbitrariness* and *verdict-driven selection* of the stopping point. While there isn't one universally accepted term, several concepts and potential coinages get at the core issue:

  1.  **"Moving the Goalposts of Agency" (Descriptive):** Highlights the dynamic, shifting nature of where "true" responsibility is located based on the desired conclusion.
  2.  **"Retrospective Construction of the Agential Pivot" (Conceptual):** Emphasizes that the point deemed the "free" or "responsible" choice *("pivot")* is constructed *after the fact* to fit the verdict, not discovered through a prior principle.
  3.  **"Convenient Causal Truncation" (Causal Focus):** Focuses on the deliberate *shortening* of the causal chain just before the point that assigns blame/credit to the individual, conveniently ignoring prior determinants.
  4.  **"The Responsibility Laundering Point" (Critical):** Suggests that prior structural/social determinants are "laundered" by declaring a subsequent choice (however constrained) as the purified source of responsibility, absolving broader systems.

  **Why these fit your observation:**

  *   **Verdict-Driven:** The stopping point isn't found via a consistent rule (like "first cause," "most informed choice," "least constrained moment"), but *chosen* to yield the desired judgment (blame or absolution).
  *   **Arbitrary Justification:** Appeals to "freedom" or "true self" at that point are vague and deployed selectively. As you note, the "freedom" criterion miraculously lands where needed.
  *   **Ignoring Downstream Causation:** The chain *before* the chosen pivot is used to excuse *that specific choice* from being the *ultimate* cause, but the chain *after* the pivot (e.g., the consequences of dropping out) is then treated as *entirely* flowing from that "free" choice.
  *   **Epistemic Convenience:** It stops where it becomes practically or ideologically difficult to trace further back into structural factors or developmental influences.

  **Boundaries and Your Compatibilist Question:**

  This is where it gets crucial. You're asking exactly the right question.

  *   **The Compatibilist Refusal:** A compatibilist who defines responsibility *solely* in terms of the *current capacity to respond to reasons* **is explicitly *refusing* to engage in this kind of arbitrary chain-tracing.** They are saying: "Look at the agent *now*, in this situation, with their current psychology (however formed), and ask: Did they have the general capacity to recognize and act on reasons? If yes, and they acted badly (for whatever internal reason), they are responsible." **They reject the need to find a 'pivot point' in the past.** This is a principled *alternative* to the shifting pivot game.
      *   **Boundary:** The compatibilist avoids the *arbitrary selection of a historical pivot*. Their focus is synchronic (current capacities) rather than diachronic (tracing history for a "free" origin point).
  *   **Is the Compatibilist Doing Something Similar?** **Potentially, but differently.** While avoiding the *arbitrary pivot selection*, their synchronic focus can itself be seen as a **different kind of truncation:**
      *   **Ignoring Formation:** Critics (like hard determinists or some skeptics) argue this approach conveniently *truncates the inquiry into how the capacity itself, and the specific reasons the agent responds to, were formed*. If the capacity and reasons-response are entirely determined by prior causes (genes, upbringing, trauma, poverty), is it fair to hold the agent responsible *just* because the mechanism meets the "reasons-responsiveness" criterion? The compatibilist says "yes, that's what responsibility *is*." The critic says this ignores the ultimate lack of *origination*.
      *   **Verdict Compatibility Risk:** Even compatibilism isn't immune to *interpretive flexibility*. Defining "sufficient capacity" or "adequate reasons-responsiveness" can be fuzzy. Someone biased might set a very low bar for "capacity" in someone they want to blame ("They knew it was wrong!") and a very high bar for someone they want to excuse ("Their trauma impaired their reasoning"). But this is messiness in *applying* the synchronic criterion, not the inherent arbitrariness of *selecting a historical pivot point* as in your original description.

  **Key Distinctions:**

  1.  **Arbitrary Pivot Selection vs. Principled Truncation:**
      *   Your described phenomenon relies on an *unprincipled, verdict-driven search* for a historical point to pin responsibility.
      *   Compatibilism offers a *principled* (though debatable) *truncation*: responsibility is defined by current capacities, regardless of history.
      *   Tracing theories offer *principled* (though often problematic in practice) *historical* accounts: responsibility traces back to an earlier "responsible" choice.
  2.  **Diachronic vs. Synchronic Focus:**
      *   The "pinning" problem is inherently diachronic (looking for a point along a timeline).
      *   The capacity-focused compatibilist approach is synchronic (looking at the agent at T1).
  3.  **Criterion Flexibility vs. Definitional Focus:**
      *   In the pinning problem, vague criteria ("freedom," "true self") are flexibly applied to justify the desired pivot point.
      *   The compatibilist has a fixed definition (reasons-responsiveness), though its *application* can be contested.

  **Conclusion & Recommendation:**

  The phenomenon you describe is best captured by concepts emphasizing the **arbitrary, verdict-driven selection of a point in a causal chain where agency is deemed "sufficiently free" to bear full responsibility for downstream outcomes, while conveniently truncating the inquiry into the upstream determinants of that very point.**

  *   **"Retrospective Construction of the Agential Pivot"** is the most precise conceptual description.
  *   **"Convenient Causal Truncation"** is very clear and directly addresses the methodological flaw.
  *   **"Responsibility Laundering Point"** is the most critical and evocative, highlighting the systemic absolution.

  **Regarding Compatibilism:** They are *not* engaging in the *same* practice. They reject the diachronic pivot hunt altogether. However, their synchronic focus *can* be seen as a *different kind* of principled truncation that critics argue ignores ultimate origins. The key boundary is that compatibilism offers a *definition* of responsibility that avoids the *arbitrary historical selection* you observe, even if that definition itself involves focusing only on the present state.

  When discussing this in your field, explicitly naming the **arbitrariness** and **verdict-driven nature** of selecting the stopping point, contrasting it with principled approaches (like compatibilism *or* tracing theories *when consistently applied*), and perhaps using "causal truncation" or "constructing the pivot point" will be most effective. This cuts to the core methodological weakness you've astutely identified.
