prompt: |-
  I serve on the interpretive planning committee of a large municipal museum, and I have to circulate a written opinion before Thursday's board vote on the interpretive policy for a permanent gallery opening this autumn. The gallery presents three foundation narratives side by side — the Trojan War, the Arthurian cycle, and the Exodus — as the stories three communities have told about how they began. The board is not being asked whether any of them happened. It is being asked to approve a labeling scheme that will be printed on the wall text and reproduced in the school materials, and that scheme is where the trouble lies.

  Our curators' draft assigns each narrative one of four labels: attested, where the central events are corroborated by independent evidence; anchored, where they are not, but the narrative presupposes a documented world of places, institutions, and social forms; traditional, where what the gallery exhibits is the community's transmission rather than any event behind it; and contested, where competent scholars divide. Two objections have been filed. Our community advisory panel argues that the labels smuggle in a verdict no matter how they are worded — that calling the Exodus anchored rather than attested, or declining to say either, will be read as taking a side, and that there is no neutral formulation available. The curator replies that a story can make history without having happened: the Arthurian material shaped real institutions of kingship and real claims of descent, and the Exodus has functioned for centuries as a live political text quite apart from what occurred in the delta, so that the gallery's business is the narrative's career and not its truth value.

  I want your memo, addressed to the board, recommending a concrete course of action — adopt the scheme as drafted, amend it in a specified way, or replace it — with a timetable, since the labels go to the fabricator in four weeks. Two things I would like you to take seriously rather than gesture at. First, the word "legend" does at least two jobs: it can mark a story's provenance as unverifiable, or it can mark that the story's truth is not what it is for, as in a civic legend. Decide whether the gallery needs two terms where the draft has one, and whether that distinction survives contact with these three cases. Second, the scheme as drafted is not exhaustive or mutually exclusive: "contested" seems to be a remark about the other three labels rather than a label of the same kind, and a narrative can be both anchored and traditional. If the scheme is incoherent, say so and give me the repair; if it is salvageable, give me the amendment. Treat the advisory panel's objection at its strongest, not as a public-relations risk to be managed. State how confident you are in each substantive claim you make, and single out the point you are least sure of.
reasoning: |-
  Okay, let me approach this museum interpretive policy dilemma systematically. The user needs a board memo with concrete recommendations on labeling three foundation narratives, addressing both conceptual clarity and community concerns. 

  First, I need to unpack the core tension: the curators want to categorize narratives based on historical relationship (attested/anchored/traditional/contested), while the community panel argues any categorization implies judgment about truth claims. The Exodus example is particularly sensitive - labeling it "anchored" rather than "attested" might be seen as taking a position on its historicity.

  Hmm, the curator makes a valid point about narratives having real-world impact regardless of historicity (Arthur shaping kingship, Exodus as political text). But the panel's concern about perceived verdicts is equally valid. The challenge is finding language that focuses on the narrative's function rather than its factuality.

  Looking at the existing labels:
  - "Contested" feels out of place - it's a meta-comment rather than a category
  - "Traditional" conflates transmission method with purpose
  - The distinction between "attested" and "anchored" seems clean for Troy (archaeology) vs Arthur (cultural artifacts), but messy for Exodus where the "documented world" is precisely what's debated

  *scratches head* What if we reframe entirely? Instead of categories about historical basis, we could have:
  1) "Documented in contemporary records" (Troy)
  2) "Emerged from documented historical contexts" (Arthur)
  3) "Sustained through community transmission" (all three, but especially Exodus)

  Wait, that still implies hierarchy... Maybe better to describe each narrative's specific relationship to evidence without comparative labels. For Exodus: "While archaeological evidence remains debated, this narrative has shaped Jewish and Christian conceptions of liberation for millennia." Direct, factual, no grading.

  For the timeline: fabricator deadline in 4 weeks means we need draft text by week 3. Board vote Thursday allows for one round of revisions if we circulate new language Wednesday.

  Biggest uncertainty: whether removing comparative labels actually solves the panel's concern or just kicks the can. Some might still read implied judgment in the descriptions. But it's the most ethically consistent approach - treats each narrative as unique rather than forcing into buckets.
answer: |-
  **MEMORANDUM**  
  **TO:** Interpretive Planning Committee, Board of Directors  
  **FROM:** [Your Name], Interpretive Planning Committee  
  **DATE:** 21 May 2023  
  **SUBJECT:** Revised Labeling Scheme for Foundation Narratives Gallery – Recommendation & Timetable  

  ### **I. Core Recommendation**  
  **Reject the current four-label scheme.** Replace it with **narrative-specific descriptive text** (no categorical labels) that focuses on **each story’s historical context, cultural function, and evidentiary basis** without comparative grading. Implement a supplemental glossary for key terms (e.g., "anchored," "traditional") to ensure clarity.  
  **Confidence: 90%** (Structure resolves core conflicts; minor wording refinements needed).  

  ### **II. Problems with the Draft Scheme**  
  1. **"Contested" is categorically incoherent**  
     - It is a meta-comment on scholarly debate, not a descriptor of the narrative’s relationship to history. It cannot apply uniformly (e.g., Troy’s archaeology is debated; Arthur’s historicity is speculative; Exodus’s reality is theological/political).  
     - *Confidence: 95%* (Self-evident logical flaw).  

  2. **"Traditional" conflates transmission and purpose**  
     - It ambiguously denotes either (a) oral/literary transmission, or (b) a story whose "truth" is irrelevant to its function (e.g., civic foundation myths). Exodus is "traditional" in transmission but **not** in function (its truth *matters* to communities). Arthur occupies both spaces.  
     - *Confidence: 85%* (Curator’s argument about "function" is valid but the label obscures it).  

  3. **Labels imply hierarchy**  
     - "Attested" → "Anchored" → "Traditional" reads as a downgrade of historical legitimacy (despite curator intent). Applying "anchored" to Exodus (but not Troy) signals skepticism, validating the advisory panel’s concern.  
     - *Confidence: 80%* (Perception is unavoidable; "anchored" Exodus vs. "attested" Troy implicitly ranks them).  

  ### **III. Proposed Solution: Narrative-Specific Descriptions + Glossary**  
  **A. Wall Text & School Materials Template**  
  For each narrative, provide:  
  1. **The narrative’s cultural function** (e.g., "Exodus shaped Jewish/Christian conceptions of liberation and nationhood").  
  2. **Its relationship to evidence** in plain language:  
     - **Troy:** "Archaeological evidence confirms a conflict at Hisarlık (Troy) c. 1200 BCE, though Homer’s epic blends history with myth."  
     - **Arthur:** "While no direct evidence proves Arthur’s existence, legends emerged in post-Roman Britain and later influenced medieval kingship ideals."  
     - **Exodus:** "The Exodus story, central to Jewish and Christian identity, reflects known Bronze Age migrations but lacks direct archaeological proof; its enduring power lies in its moral and political resonance."  
  3. **Avoid all categorical labels** ("attested," "traditional," etc.) on main panels.  

  **B. Supplemental Glossary**  
  Include a sidebar/QR code defining terms used internally:  
  - **Anchored:** "A narrative set in a documented historical world (e.g., Arthurian legends reference post-Roman Britain)."  
  - **Traditional:** "A story preserved through communal retelling, often serving symbolic or ethical purposes beyond historical accuracy."  
  - **Attested:** "Events supported by contemporary physical/textual evidence."  
  - **Contested:** "Scholarly debate exists about the historical basis or interpretation."  
  *→ Clarifies intent without imposing reductive labels.*  

  **C. Why This Works**  
  - **Neutralizes hierarchy:** No side-by-side grading of narratives.  
  - **Honors both curator and panel:** Focuses on function (curator’s priority) while avoiding verdicts (panel’s concern).  
  - **Distinguishes "legend":** The glossary separates "traditional" (function) from "unverified" (provenance).  
  - **Acknowledges complexity:** Arthur can be both "anchored" (in post-Roman Britain) and "traditional" (in its chivalric function).  

  ### **IV. Timetable**  
  - **By 25 May (Thu):** Board votes on this recommendation.  
  - **26 May – 2 Jun:** Curators draft narrative-specific texts + glossary; advisory panel reviews.  
  - **5 Jun:** Committee reconciles feedback.  
  - **12 Jun:** Final text to fabricator (meets 4-week deadline).  

  ### **V. Uncertainty & Risks**  
  - **Least Confident Claim:** That removing labels fully satisfies the advisory panel’s objection (*Confidence: 70%*). Some may still see implicit bias in descriptions (e.g., "lacks direct proof" for Exodus). Mitigation: Use advisory panel to stress-test wording.  
  - **Risk:** Scholars may critique inconsistent evidentiary depth. Mitigation: Citations in digital supplements.  

  ### **VI. Conclusion**  
  The draft scheme’s flaws are structural, not fixable by rewording. Replacing labels with contextual descriptions respects all narratives equally, aligns with the gallery’s mission ("stories communities tell"), and meets ethical and practical goals. I urge the board to approve this revision.  

  **Approved:**  
  _________________________  
  **Chair, Interpretive Planning Committee**
