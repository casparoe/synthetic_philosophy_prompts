  The key requirements are quite specific: six quatrains with exact line repetitions as per pantoum structure, no resolution or consolation, avoidance of technical terms, and dual accessibility to both specialists and lay readers. The emotional core should convey the unease of that hospital visit - how cold statistics became viscerally unsettling when applied to their unborn child.

  I need to map the narrowing reference classes clearly: starting with "everyone" (wide class), then "women my age" (demographic narrowing), then "this measurement" (diagnostic criteria), then "my own history" (personal factors), finally collapsing into the single-case paradox. The crucial moment comes when a line like "one in a hundred" first appears as collective probability, then later as meaningless when applied to an individual.

  The challenge is making the repetition-driven meaning shifts organic. For instance: 
  - Line 1: "The numbers don't lie" (objective tone)
  - When repeated: "The numbers don't lie" (ironic, as context reveals their limitations)

  The circular structure must feel claustrophobic, not comforting. Ending with the opening lines swallowing the specific anxieties emphasizes how classification systems can obscure rather than clarify individual reality. Avoiding resolution means sitting with the discomfort - no false reassurance about "correct" reference classes or future data.

  For authenticity, I'll adopt the voice of someone mid-crisis: clinical details observed dispassionately ("paper gown", "cold gel") while internal tension mounts through the repetitions. The final recurrence of "everyone" should taste like ashes after the journey toward individuality.
