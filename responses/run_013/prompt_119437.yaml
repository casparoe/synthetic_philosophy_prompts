  The numbers don’t lie, the counsellor said,
  A frequency found in everyone.
  One in a hundred walks ahead,
  Or so the wide class has begun.

  A frequency found in everyone,
  But then the grouping shifts its frame.
  Or so the wide class has begun,
  My age band whispers a different name.

  But then the grouping shifts its frame.
  The scan reveals a measured trait.
  My age band whispers a different name:
  One in forty seals the weight.

  The scan reveals a measured trait,
  A colder lens, a sharper view.
  One in forty seals the weight
  On paper damp, where fear leaks through.

  A colder lens, a sharper view:
  My own faint history, faintly traced.
  On paper damp, where fear leaks through,
  The class contracts, the risk is placed.

  My own faint history, faintly traced,
  Until the circle holds just one.
  The class contracts, the risk is placed,
  But meaning bleeds beneath the sun.

  Until the circle holds just one.
  One in a hundred walks ahead?
  But meaning bleeds beneath the sun.
  The numbers don't lie, the counsellor said.

  ***

  **(Brief note on the work of repetition):**  
  The line "A frequency found in everyone" initially states a broad statistical truth, but its later recurrence highlights the speaker's alienation *from* that 'everyone'. Similarly, "One in a hundred walks ahead" feels abstractly hopeful early on, but its final questioning repetition reveals the statistic's collapse when applied to the singular case. "The numbers don't lie" bookends the poem, its unchanging assertion contrasting starkly with the speaker's lived experience of conflicting certainties, trapping them in the cycle of shifting reference classes.
