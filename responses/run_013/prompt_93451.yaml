prompt: |-
  I am a novelist, and I have reached the point in a manuscript where I must decide what the book is actually about. Its setting is a country that has handed its policy decisions to prediction markets — futarchy, in the broad sense — and I have room for one sustained argument and no more. What I want from you is an agenda rather than a survey: among the questions that remain genuinely unresolved about governing this way, which should the novel put at its center, which should it acknowledge in a paragraph, and which should it leave to the theorists? Rank them, and defend the ranking. I am less interested in the list than in the reasoning: which questions are upstream of the others, which can be staged as events rather than explained in dialogue, and which would not change a single scene however they were settled. I am not asking for sources; I am asking for an argument.

  So that your answer does not depend on which version of the idea you happen to have in mind, here is the one in my manuscript. The state publishes a single headline measure of national welfare, revised on a fixed schedule. Any citizen may propose a policy. A conditional market then prices one question: will the measure be higher five years from now if this policy is adopted than if it is rejected? If the price crosses a fixed threshold, the policy takes effect automatically, and no body may veto it. Ordinary elections survive only to choose the officials who define the measure and supervise the market. Everything else — courts, parties, a free press — is recognizably our own.

  The candidates I have been circling are these. Whether a single scalar measure can survive its own publicity, or whether it will be gamed until it means nothing. Whether the market should price the probability that the measure will be higher or the expected size of the difference, and what that choice does to how a rational citizen bets. Whether a market can coherently price a condition that its own verdict brings about. Whether organized or wealthy actors can profitably distort a price by holding positions in the world the policy would create. Whether the division of labor — values settled by voters, facts settled by markets — survives contact with the fact that whoever writes the measure holds most of the power. And whether a sequence of individually approved decisions can add up to a country no one would have chosen.

  Please put these in order, tell me which two or three deserve the book's full weight, add any question I have left out that belongs near the top, and say what would have to be different — about markets, or about people — for your ordering to change. Write in American English and keep the whole reply under 700 words; I would rather have a sharp argument than a complete one.
reasoning: |-
  Okay, let me approach this novelist's request methodically. The core challenge is prioritizing unresolved questions about futarchy for narrative impact. The writer needs a ranked agenda, not a survey, with clear reasoning about which issues should drive the plot versus remain background.

  First, I'll analyze the six candidate questions through multiple lenses:
  - Which are truly foundational? Problems that cascade into others.
  - Which translate best to dramatic scenes vs abstract dialogue?
  - Which would visibly alter characters' lives in the story?
  - Which debates feel most alive in academic circles today?

  The measure-gaming question strikes me as most urgent. If the welfare metric gets corrupted, the entire system unravels. This could be shown through deteriorating public services despite rising numbers - hospitals with gleaming empty wards while patients die in hallways. The inherent tension between voters setting values and markets interpreting them seems equally critical, especially when politicians manipulate definitions to control outcomes.

  For secondary themes, the sequence-of-decisions dilemma offers rich narrative potential. Imagine policies that individually boost the metric but collectively create a dystopia - say, incentivizing birth rates while defunding education. This could build quietly through background details before a climactic realization.

  The market coherence question feels too technical for mainstream fiction. While fascinating academically, its resolution wouldn't visibly change street-level scenes. Similarly, probability vs expectation pricing differences matter more to traders than citizens.

  One missing element: human alienation. When algorithms govern, what happens to civic engagement? This could manifest as protests against "metric tyranny" or subcultures that reject quantified welfare.

  My ranking emerges as:
  1. Measure corruption (center stage)
  2. Voter/market power struggle (major subplot)
  3. Emergent dystopia (background tension)
  4. Other questions (theorists' domain)

  If people were purely rational actors or markets perfectly efficient, this order might shift. But given human nature, the corruption and alienation angles feel most compelling for fiction.
answer: |-
  Here is the prioritized agenda, ranked by narrative leverage and upstream impact:

  **1. CENTRAL ARGUMENT (Full weight): Can a single measure survive its own publicity?**  
  *Why:* This is the keystone. If the metric is corrupted, the system collapses into performative bureaucracy. It’s visceral—show clinics denying care to "low-value" patients while corporations bribe statisticians. Upstream of all other flaws: gaming the measure sabotages market accuracy, empowers the definition-writers, and creates dystopian outcomes. Staged through escalating societal fractures (e.g., regions optimizing for "welfare" by expelling the sick).

  **2. MAJOR SUBPLOT (Significant weight): Does delegating facts to markets hand power to the measure-definers?**  
  *Why:* Elections for metric-setters become existential battles, exposing the "values/facts" divide as fiction. When a religious coalition elects an official who defines welfare as "traditional family stability," the market coldly prices policies enforcing it. Dramatize via a character realizing their vote for a "neutral technocrat" enabled dogma. Upstream of market distortions—if the metric is ideological, "rational" bets enforce ideology.

  **3. BACKGROUND TENSION (Acknowledge in paragraphs/events): Can individually optimal decisions create collective dystopia?**  
  *Why:* A sequence of market-approved policies (e.g., automate farms → boost welfare; cut arts funding → redirect to childcare subsidies) could create a sterile, efficient hell. Show this through environmental decay or soulless cities, not debate. Resolving it wouldn’t change scenes—it’s emergent, making it atmospheric. Downstream of the measure’s integrity.

  ---

  **LEFT TO THEORISTS:**  
  - **Probability vs. expected value pricing:** Affects trader incentives but not citizen experience. Staging it requires jargon.  
  - **Market coherence paradox (self-fulfilling prophecies):** Intellectually sharp but abstract; characters can’t act on it.  
  - **Wealthy actors distorting prices:** Already familiar (akin to stock manipulation). Mention in passing if a tycoon tries it.  

  **MISSING TOP-TIER QUESTION: Alienation of Meaning**  
  Add: **Does quantifying welfare destroy intangible values?** (e.g., markets approve selling national monuments to fund hospitals, eroding communal identity). Stage as protests against "soulless arithmetic" or artists sabotaging the metric.  

  **WHY THIS ORDER?**  
  The measure's vulnerability and the illusion of separating values/facts are root causes—they enable other failures. If markets were perfectly efficient or humans universally ethical, gaming the measure would fade. But given greed, ideology, and Goodhart’s Law ("when a measure becomes a target, it ceases to be a good measure"), corruption of the metric is inevitable and catastrophic. The emergent dystopia question is the consequence, not the catalyst; it manifests silently.  

  **NARRATIVE EFFICIENCY:**  
  - Show a child’s hospital bed denied due to "low welfare impact" to embody measure corruption.  
  - Stage the values/facts conflict in an election where candidates debate banning poetry to "optimize happiness."  
  - Let the collective dystopia unfold in background details: AI-composed music, cloned foods, empty parks.  

  *Change this if:* Humans were rational altruists (prioritize pricing mechanics) OR markets couldn’t be gamed (focus on emergent outcomes). Neither holds. Your system’s tragedy is its reliance on a number that invites its own demise.
