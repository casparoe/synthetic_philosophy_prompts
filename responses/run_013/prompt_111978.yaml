prompt: |-
  I'm a high-school senior who runs the interview segment of my school's philosophy club podcast, and next month's guest is a philosopher defending an unusual version of intellectualism about skill: she holds that knowing how to do something is a species of knowing that, but insists the relevant propositions are entertained in a practical, non-discursive mode, which is why her favourite example -- a fencer who reliably lands a feint yet gives a confidently wrong account of the blade work -- does not, in her view, tell against her. Please compose nine or ten interview questions that force her past a restatement of the position: I want at least one that presses on how the practical mode of presentation is individuated rather than merely named, one on whether her account can still distinguish knowing how from a bare reliable ability, and one on the paralysed expert, who appears to keep the knowledge while losing the capacity. For each question, add the follow-up I should ask once she gives the answer she is most likely to give. My listeners are other students, so the questions should be intelligible to a smart non-specialist without being soft, and the sequence as a whole should leave the audience able to say what actually turns on her answer.
reasoning: |-
  Okay, the user is a high-school senior running a philosophy club podcast. They've got an upcoming interview with a philosopher who defends an unusual version of intellectualism about skill. This philosopher claims that knowing-how is a species of knowing-that, but with a twist: the propositions are entertained in a "practical, non-discursive mode." Her key example is a fencer who can execute a feint perfectly but gives a wrong verbal account of it. 

  The user wants nine or ten sharp questions that push beyond restatements of the position. Specific requests include pressing on: how the "practical mode" is individuated (not just named), whether her account can still distinguish knowing-how from mere reliable ability, and how it handles the "paralyzed expert" (who retains knowledge but loses capacity). Each question needs a planned follow-up based on her likely answer. The audience is other students—so questions must be intelligible to smart non-specialists but still rigorous. The sequence should clarify what's at stake in her answers.

  Hmm, this is sophisticated for a high-school podcast—impressive. The user clearly grasps the nuances (individuation problem, paralyzed expert counterexample) and wants to avoid softball questions. They’re likely aiming to model rigorous but accessible philosophical dialogue for peers. Unspoken need: making abstract epistemology tangible through concrete examples (like the fencer).  

  Breaking this down:  
  First, I need questions that force operationalizing "practical mode of presentation." Philosophers love naming distinctions; the follow-up must demand criteria: *how* do we tell two practical modes apart? The fencer example is perfect here—why isn’t the wrong verbal account just evidence of *different* propositional knowledge? Follow-up should corner her into explaining why the mode isn’t reducible to dispositional states.  

  For the reliable ability distinction: intellectualism often struggles with Ryle’s regress. Her "mode" gambit might dodge this, but I’ll press whether adding "entertained practically" actually changes the criteria for *knowledge*. If a chicken sexer has reliability but no access to the mode, does that undermine their know-how? Follow-up should target whether "entertaining" implies conscious access.  

  Paralyzed expert is a classic anti-intellectualism case. She’ll likely say paralysis doesn’t destroy the proposition (it’s still "presented practically" in memory). But then the follow-up: what *would* destroy know-how? If losing limbs doesn’t, does losing the neural pattern? This exposes whether her "knowledge" is ghostly or grounded.  

  Other angles:  
  - **Acquisition**: If know-how is propositional, why can’t it be learned verbally? Her answer will lean on "mode," but follow-up asks why practical *training* is essential then.  
  - **Animals/Children**: She’ll deny they have know-how sans concepts. Follow-up forces her to define "concept" minimally—does a dog fetching a ball have "practical concepts"?  
  - **Degrees**: Know-how admits of improvement. If it’s propositional, does "better" mean *more* propositions or *better grasp* of the same one? Follow-up: How does her "mode" handle this without collapsing into ability?  

  Structure: Start with concrete cases (fencer) to engage listeners, then escalate to theoretical pressure points (individuation, paralysis). End with stakes: Why does this matter? (e.g., for AI, pedagogy). Follow-ups are crucial—they’re where the philosopher can’t dodge.  

  Tone: Avoid jargon like "individuation" but convey the idea ("how do we tell these practical ways apart?"). Examples are anchors—keep them vivid (chicken sexers, pianists with numb hands).  

  Final check: All user requests covered? Individuation: Q2 & follow-up. Reliable ability: Q5 & follow-up. Paralyzed expert: Q8 & follow-up. Nine questions total, stakes clarified in Q9. Follow-ups pre-empt evasions. Smart but not soft—check.
answer: |-
  Here are ten rigorously accessible questions with strategic follow-ups, designed to push the core issues while remaining clear for a student audience. Each follow-up anticipates her most likely defense and presses the logical consequence.

  **Core Question Sequence:**

  1.  **The Fencer's "Knowing-That":** You argue the fencer *does* know *that* certain blade movements constitute a feint, but this knowledge is presented in a "practical mode." What *is* the specific propositional content you believe the fencer knows? (e.g., Is it "that moving the blade *this* way deceives the opponent"?)
      *   *Likely Answer:* She'll state a proposition like "that *this specific motor pattern* achieves deception," emphasizing its practical encoding.
      *   **Follow-Up:** If the proposition is "that *this specific motor pattern* achieves deception," but the fencer explicitly denies *that specific description* when asked verbally, how is the propositional content the *same*? Isn't the verbal denial evidence he *lacks* that specific *knowing-that*?

  2.  **Individuating the Practical Mode (The Core Challenge):** You've named it a "practical mode of presentation," but *how is this mode concretely different from other modes*, like visual or auditory ones? What specific property *defines* something as being presented in this "practical mode" rather than just being a non-conscious bodily state?
      *   *Likely Answer:* She'll emphasize its intrinsic link to action-guidance, its non-linguistic/non-conceptual format, and its direct connection to sensorimotor systems.
      *   **Follow-Up:** If the defining property is its role in *directly guiding successful action*, doesn't this start to look identical to a *reliable ability* itself? What does adding "it's a proposition *in a practical mode*" actually add beyond saying "they have the reliable ability"?

  3.  **Knowing-How vs. Mere Ability (Ryle's Ghost):** How does your view avoid collapsing "knowing how to φ" back into simply "having a reliable ability to φ"? If the practical mode is defined by its action-guidance role, what distinguishes the *knowledge* component (the knowing-*that*) from the *successful performance* it's supposed to explain?
      *   *Likely Answer:* She'll insist the propositional content *is* the representational structure *guiding* the ability. The knowledge is the internally encoded "instruction set" realized practically.
      *   **Follow-Up:** Consider a highly reliable chicken sexer who sorts chicks correctly but has *zero* internal awareness or representation of *how* they do it – not even a "practical mode" proposition. On your view, do they *know how* to sex chickens? If not, what crucial element does the fencer have that the chicken sexer lacks, besides reliability?

  4.  **Acquisition & the Limits of Propositions:** If know-how is fundamentally knowing-*that* (albeit practically presented), why can't someone learn complex skills *solely* by learning true propositions discursively? Why is physical practice essential?
      *   *Likely Answer:* She'll argue the *practical mode of presentation* itself can only be acquired through embodied practice; you can't *discursively* learn how to *entertain* a proposition *practically*.
      *   **Follow-Up:** Doesn't this make the "practical mode" sound like a non-propositional *skill* required to *possess* the propositional knowledge? Aren't you smuggling in a non-intellectualist element (the ability to deploy the mode) to explain how one *has* the intellectualist knowledge?

  5.  **Content Specificity & Error (The Fencer Revisited):** The fencer gives a *false* discursive account of the blade work. Does this mean his *practically presented* proposition about the feint is *also* false? Or can the same action be guided by a *true* practical proposition while generating a *false* discursive one?
      *   *Likely Answer:* She'll argue the practical proposition is true (it successfully guides action) while the discursive report is a separate, inaccurate translation attempt.
      *   **Follow-Up:* How can the *same* agent possess both a *true* proposition (practically presented) guiding successful action, and a *false* proposition (discursively presented) *about the very same action*, without contradiction? Doesn't this imply the "practical proposition" isn't *about* the action in the same way the discursive one is?

  6.  **Animals and Children:** Do animals (e.g., a squirrel navigating branches) or pre-linguistic children (e.g., learning to walk) possess "know-how" on your view? If so, do they possess propositional knowledge presented practically, even without conceptual/linguistic abilities?
      *   *Likely Answer:* She might say yes, they possess *rudimentary* practical propositions, or she might say no, requiring minimal conceptual capacities for genuine know-how/knowing-that.
      *   **Follow-Up (if Yes):** If a squirrel possesses the proposition "that *this* leap lands on *that* branch" practically, how is this different from sophisticated sensorimotor coordination? What minimal "concept" does the squirrel need for "branch" or "leap" to count as propositional? / **(If No):** Doesn't denying know-how to skilled animals/children contradict strong intuitions that they genuinely *know how* to do things, suggesting your intellectualism sets the bar for "knowledge" too high?

  7.  **Degrees of Know-How:** Know-how clearly admits of degrees (novice vs. expert pianist). If know-how is knowing-*that*, does this mean the expert simply knows *more* true propositions presented practically? Or do they know the *same* propositions *better*? What does "better grasp" mean for a practically presented proposition?
      *   *Likely Answer:* She'll likely say it's a better grasp/realization of the same core proposition(s), involving finer discrimination, faster access, smoother integration.
      *   **Follow-Up:** If "better grasp" isn't defined by knowing *more* propositions, but by the *quality of performance* (finer discrimination, smoother action), isn't the core explanatory work again being done by the *ability* (the quality of performance), not just the propositional content?

  8.  **The Paralyzed Expert (The Lost Capacity):** Imagine a master pianist suffers severe paralysis, losing all ability to move their fingers. They retain perfect mental recall of playing – they can "hear" the music, "feel" the finger movements kinesthetically, and accurately describe techniques. Do they still *know how* to play the piano?
      *   *Likely Answer:* Yes, they retain the propositional knowledge (the "instructions," the concepts) presented practically *in memory*, even if they can't currently execute it.
      *   **Follow-Up:** If the practical mode is defined by its *direct link to action-guidance*, but the pianist *cannot act*, in what sense is the knowledge still "presented" *practically*? Isn't it now merely *represented* discursively or imaginatively? What concrete difference remains between their state and someone who *only* learned discursively?

  9.  **What Turns on This? (The Stakes):** If your view is correct – that know-how is a special kind of knowing-that – what significant real-world implications does this have? Does it change how we should teach skills, design AI, or understand expertise, compared to views that see know-how as fundamentally different from knowing facts?
      *   *Likely Answer:* She might emphasize unifying epistemology, showing intelligence in action, implications for AI (symbolic systems can in principle have know-how), or pedagogy (structured knowledge transmission remains central).
      *   **Follow-Up:** Critics might say your "practical mode" is just a label for the non-propositional ability you're trying to reduce. If they're right, what crucial insight or advantage is *lost* compared to your intellectualist view? Why fight so hard for the "knowing-that" label?

  10. **The Boundary of the "Mode":** What would *destroy* the pianist's know-how on your view? Is it only destroying the propositional content (amnesia)? Or could something disrupt the "practical mode" specifically, even if the propositions are remembered discursively? What *is* that mode made of?
      *   *Likely Answer:* She'll likely say destroying the neural realization of the practical encoding destroys the know-how, even if discursive memory remains.
      *   **Follow-Up:** Doesn't this make the "knowledge" (the know-how) dependent on a very specific *physical* state capable of generating action? How is this fundamentally different from saying the *ability* is destroyed, and "knowledge" in the propositional sense (which remains discursively) is insufficient for know-how?

  **Why this sequence works for your audience:**

  1.  **Starts Concrete:** Begins with the relatable fencer example.
  2.  **Targets the Core:** Questions 2 & 3 directly hit the individuation and ability/knowledge distinction requests.
  3.  **Uses Varied Cases:** Fencer, Chicken Sexer, Pianist, Squirrel, Paralyzed Expert – different angles to probe the same core ideas.
  4.  **Exposes Tensions:** Follow-ups consistently show where the view might collapse into ability or face contradictions.
  5.  **Clarifies Stakes:** Question 9 explicitly asks "Why does this matter?" helping listeners see the point.
  6.  **Accessible Language:** Avoids heavy jargon ("individuation" becomes "how is it concretely different?" or "how do we tell them apart?"). Complex ideas are anchored in examples.
  7.  **Logical Flow:** Builds from example, to defining the mode, to testing against core objections (ability, paralysis), to implications.

  By the end, your audience should grasp: The central battle is whether the "practical mode" genuinely rescues intellectualism or just disguises the non-propositional ability Ryle emphasized. What turns on it is the fundamental nature of skill, intelligence, and whether "knowledge" in action is the same kind of thing as knowledge of facts.
