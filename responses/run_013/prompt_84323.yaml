prompt: |-
  So I need help writing somthing and it's a weird one. My company just did its promotion round and I got bumped up over a guy I've worked with for six years and honestly rate as much as I do myself, and it's been eating at me. My partner has been arguing with me about it for two weeks and we keep going in circles. Last night she said nobody deserves anything, the whole idea is made up, and I realised we aren't even disagreeing about the same thing. I want the document we should have written together instead of yelling in the kitchen.

  Two camps. Call them the realists and the institutionalists. Realists: when I say Dave deserved that promotion, I'm saying something true or false about Dave, not just about our company's rubric, and the rubric can be wrong about who deserved it. Institutionalists: deserved only ever means did well by the standards of some scheme, so the sentence is a report on a rulebook plus maybe a complaint that we picked the wrong rulebook, and there's no further fact of the matter to be right or wrong about.

  What I want:

  A numbered list of claims we could both sign without either of us feeling we sold out. Not fluff like promotions should be fair. Teeth. Include what we're both talking about when we use the word, what we both deny (neither of us thinks whoever shouts loudest deserves it), and which arguments we both think are bad. I suspect we both hate she earned it therefore the outcome is just, and we both hate luck exists therefore desert is fake, but check whether we can actually both sign those or whether one of us is smuggling.

  Then a disagreements table. Each row: the question, then my side written so I'd put my name to it, then hers written so she'd put her name to it. No hedged mush in the middle.

  Then the cruxes, the sub-questions where settling them would force one of us to move. I think they're roughly these:

  Whether desert claims survive swapping the rulebook. Use this case: same worker, same output, two employers, one with a generous pay scale and one stingy. Does she's underpaid mean anything past she'd be paid more elsewhere? Realists: the verdict survives, there's an amount that fits the work and one employer is missing it. Institutionalists: strip out the comparison class and the verdict goes quiet, people start asking underpaid by whose scale. Write down what each side predicts people will actually say about the case.

  Whether desert is comparative or absolute. If she'd been the only candidate and there was no runner-up, could it still be true that she deserved it, or is deserving always deserving-more-than-someone? I have a feeling half our fight lives here.

  Whether the ubiquity of luck kills desert or only makes it hard to apply. Realists predict: if luck undermined desert it'd equally undermine the student who studied all night, which nobody believes. Institutionalists predict: the realist retreats to the part that isn't luck, and that residue keeps shrinking till it's empty.

  Whether a desert fact nobody can measure is any use. If it's true Dave deserved it and no one could ever know, does that change what anyone should do? Realists say yes, it constrains which schemes are just. Institutionalists say an unknowable constraint isn't a constraint.

  Whether desert is a fit between a person and a reward or a claim one person has on other people's behaviour. These come apart, since somthing can fit while nobody owes you anything.

  Also make us say out loud wether meritocracy names a system or just the story the winners tell about it.

  For each crux, say what both of us would accept as relevant evidence or a relevant argument, and be honest if any of them turn out to be about words rather than about the world. If so, say which part and why.

  Two constraints: no bibliography, no names of philosophers, don't tell me to go read anything, I want the document itself. And dont be nice about it. If one of my columns is just my side of a verbal dispute, put that in writing. I'd rather find out now than in month three.
reasoning: |-
  Okay, let me unpack this user's request. They're in a tough spot - got promoted over a colleague they respect, and now having philosophical arguments with their partner about the nature of "deserving" promotions. What they really need is a structured way to map their disagreement, not more abstract debate. 

  The core tension seems to be between two views: one where "deserving" is an objective fact about a person's work, and another where it's purely defined by institutional rules. The user wants this documented cleanly - no academic references, just clear positions they can both own. 

  Hmm... they're smart. The way they framed those five cruxes shows they've already done the hard work of identifying where the real disagreements lie. The comparative vs absolute desert point feels particularly sharp - if there's no runner-up, can someone still "deserve" a promotion? That might explain why the promotion over Dave stings so much. 

  I notice they're demanding brutal honesty. No sugarcoating if one position is just semantics. Good - means they want real clarity, not comfort. The meritocracy question at the end is especially loaded. Need to handle that carefully but without softening. 

  Biggest challenge will be making the "agreements" section substantive enough. "Promotions should be fair" is too vague, as they said. Need concrete claims that both sides could accept while still holding their core views. Maybe focus on what desert isn't? Like agreeing it's not about seniority or loudness. 

  For the disagreements table... must resist the urge to find middle ground. They want clean opposing statements. The underpaid worker example is perfect for showing the realist/institutionalist split starkly. 

  The luck question is tricky. Realists have a point - we don't deny the student deserves credit just because luck played a role. But institutionalists aren't wrong that we can't disentangle luck from merit completely. Need to show both views as coherent. 

  Ah! The measurement problem might be key. If desert exists but can't be measured, does it matter? Realists would say yes - it constrains systems. Institutionalists would call that a useless abstraction. That's probably where the rubber meets the road practically. 

  Better avoid philosophy jargon entirely like they asked. No "deontological" or "Rawlsian". Just plain English with teeth. And definitely no "have you read X?" - they'd hate that. 

  The tone needs to match their no-bullshit approach. If one position reduces to wordplay, say so bluntly. They'd respect that more than false diplomacy.
answer: |-
  Here’s the document you requested. It cuts through the noise, maps your disagreement, and forces clarity. No fluff, no citations, no concessions.

  ---

  ### **Shared Foundation: What We Both Agree On**  
  *(Signable without selling out)*  

  1.  **"Desert" isn't arbitrary.** It’s not about who shouts loudest, who we like best, or raw seniority. Both camps ground it in *some* objective link between the person and the outcome.  
  2.  **Schemes/rules matter practically.** Determining promotions *requires* a defined process (rubrics, performance reviews, etc.). Ignoring the scheme entirely is chaos.  
  3.  **"Earned it" ≠ "Therefore the outcome is perfectly just."** Performance within a scheme justifies the *procedural outcome* ("She got it fairly under the rules"), but **both deny** this exhausts justice or proves the scheme itself is ideal.  
  4.  **"Luck exists" ≠ "Therefore desert is fake."** Both acknowledge luck influences outcomes (background, timing, random events). **Both deny** this alone erases the *concept* of desert. The disagreement is about what survives the luck.  
  5.  **Schemes can be flawed.** A promotion process can be poorly designed, biased, misapplied, or measure the wrong things. We can both call a scheme "unfair" or "bad."  
  6.  **The word "deserve" points to *something*.** It’s not just noise. We disagree on what that something *is* (a fact about the person+world, or a fact about rules+comparison).  

  ---

  ### **The Disagreement Table: Where We Stand**  
  *(No hedged mush)*  

  | **The Question**                                                                 | **Realist (Your Side)**                                                                                                                            | **Institutionalist (Partner's Side)**                                                                                                                |
  | :------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------------------------------------------------------------- |
  | **1. Core Meaning of "X deserves Y"**                                            | States an objective fact: There is a *fittingness* or *rightful claim* between X's actions/qualities and Y, independent of any specific institution or rulebook. The rules might *track* this or fail to. | Means *only*: "According to the relevant institutional rules/social scheme S, Y is the prescribed outcome for X's actions/qualities." There is no "fittingness" beyond what S defines. |
  | **2. Can the Scheme Be "Wrong" About Desert?**                                   | **Yes.** The scheme can misjudge the *actual* fittingness/rightful claim. Dave *really* deserved it; the company's rubric got it wrong.                | **No, but...** The scheme can be *bad, stupid, or harmful*. "Dave deserved it" is shorthand for "The scheme *should* have been designed to give it to him, or this application of the scheme failed." |
  | **3. The Underpaid Worker Test:** Same work, Stingy vs. Generous Employer. Does "She is underpaid" mean more than "She'd get more elsewhere"? | **Yes.** "Underpaid" means her pay objectively *fails to match* the value/fitting reward for her work, regardless of the employer's scale. The stingy employer is objectively missing the mark. | **No.** "Underpaid" *only* means "paid less than the market rate/average/expectation defined by a comparison class." Strip away the comparison ("paid less than *what*?") and the statement loses meaning. |
  | **4. Is Desert Absolute or Always Comparative?** If only one candidate, could "She deserved the promotion" be true? | **Absolute: Yes.** Desert is about the *fit* between her work/qualities and the reward/position itself. It can be true even with no competitors. | **Comparative: No.** "Deserved" implies *relative merit* within a competitive context defined by the scheme. No runner-up? Then "deserved" just means "met the criteria," not a distinct desert claim. |
  | **5. Does Luck Destroy Desert or Just Obscure It?**                              | **Obscures.** Luck is a contaminant, but we can still identify a core of agency/effort/contribution that *is* desert-bearing. We do this constantly (e.g., the student). | **Undermines.** The "core" shrinks under scrutiny. Effort depends on innate stamina (luck), opportunity (luck), useful skills (often luck-influenced). The "residue" isn't a stable basis for objective desert. |
  | **6. Does Unknowable Desert Matter?** If Dave deserved it but no one could ever know, does it constrain what *should* be done? | **Yes.** An unknowable desert fact is a *truth* about justice. A good scheme *aims* to approximate it. Ignoring it risks profound injustice. | **No.** An unknowable "constraint" provides zero practical guidance. Justice must be based on knowable standards, procedures, and outcomes. Schemes are judged by their design and effects, not by unknowable fits. |
  | **7. Nature of Desert: Fit or Claim?**                                           | **Primarily Fit.** Desert is about the objective relationship between the person's actions/qualities and the thing (reward/punishment). Obligations *follow* from recognizing this fit. | **Primarily Claim.** Desert arises *only* within a social context where rules or norms create obligations on others (e.g., the employer owes the promotion based on the rules). No scheme, no claim; no obligation. |
  | **8. What is "Meritocracy"?**                                                   | **An Ideal System (Flawed Attempt).** A system that *tries* (often failing) to objectively reward desert (the fittingness). The ideal exists independently of winners' stories. | **Primarily a Story (Justification).** The narrative winners tell to legitimize outcomes produced by a specific (and inevitably luck-influenced) set of rules. The label "meritocracy" is applied to the system *after* the fact. |

  ---

  ### **The Cruxes: Where the Fight Lives**  
  *(Settling these forces movement)*  

  1.  **The Underpaid Worker Verdict Predictions:**
      *   **Realist Prediction:** People will instinctively say "She *is* underpaid" meaning the pay is objectively inadequate *for what she did*, even if they add market context. The core judgment survives the employer swap.
      *   **Institutionalist Prediction:** People will immediately ask "Underpaid *compared to what*?" and default to market rates, industry standards, or expectations set by similar roles. Without a comparison, the judgment falters.
      *   **Evidence:** Observe real discourse on pay fairness. Does the "objective inadequacy" argument resonate widely without reference to a standard, or is the appeal always to some comparative benchmark?

  2.  **Absolute vs. Comparative Desert:**
      *   **Crux Question:** Can a person ever *deserve* something (like a promotion, prize, or reward) in a non-competitive, single-agent scenario? Or is "desert" inherently about beating others/meeting a relative standard?
      *   **Evidence:** Examine language. When someone says "She deserved a break" after hardship (no competition), or "He deserved that punishment" (sole perpetrator), is this the *same sense* of "deserve" used in promotions? Or is it fundamentally different? If different, which sense applies to promotions?

  3.  **Luck and the Shrinking Core:**
      *   **Crux Question:** Can we *reliably isolate* a "desert core" (attributable solely to the individual, free from luck) in complex outcomes like job performance, sufficient to ground an objective desert claim?
      *   **Evidence:** Analyze concrete cases. Take a promotion decision. Attempt to factor out luck (e.g., lucky breaks, fortunate timing, privileged background, random events aiding performance). Does a clear, significant, *objective* residue of pure desert remain that both agree on? Or does the process reveal irreducible luck and subjectivity?

  4.  **The Usefulness of Unknowable Desert:**
      *   **Crux Question:** If an objective desert fact exists but is *fundamentally unknowable* (even in principle), does it provide any actionable guidance for designing or judging institutions? Or is it practically inert?
      *   **Evidence:** Consider historical reforms. Were successful pushes for fairer systems (e.g., civil service exams, blind auditions) driven by belief in an *unknowable* desert standard, or by observable flaws, biases, harms, and *knowable* principles (equality, efficiency, reducing bias)?

  5.  **Meritocracy: System or Story?**
      *   **Crux Question:** Does the term "meritocracy" primarily describe an *aspirational type of system* (however imperfectly realized), or is it primarily a *rhetorical label* applied by beneficiaries to legitimize the outcomes of whatever system elevated them?
      *   **Evidence:** Look at usage. When critics call a system "not a true meritocracy," are they appealing to a shared ideal? Or is "meritocracy" overwhelmingly used by winners defending the status quo? Can the term be meaningfully used *aspirationally* without sounding naive?

  **On Verbal Disputes:** The core clash (Points 1 & 2 in the Disagreement Table) *is* partly verbal – you're using "desert" to point to an objective fittingness, your partner uses it only as rule-compliance shorthand. **However:** The disagreement *isn't just* verbal. Underlying it are substantive disagreements about the nature of value, justice, and social reality (captured in the Cruxes). The verbal difference *enables* talking past each other, but the Cruxes show where the real substance lies. Your partner likely sees your "objective fittingness" as a linguistic illusion masking institutional facts. You see her position as reducing morality to rule-following, missing a deeper layer.

  ---

  **Next Step:** Go through the **Cruxes** one by one. For each, state your position clearly *based on the definitions and disagreements above*. Demand she does the same. Identify *exactly* which Crux predictions or evidence claims you disagree on. *That's* where the productive (or final) battle lies. Good luck.
