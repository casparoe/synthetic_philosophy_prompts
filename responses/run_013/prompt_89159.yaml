  Okay, let me tackle this professor's problem. They teach an upper-level history and memory seminar, and their students have mastered the standard framing—memory as social/present-oriented/identity-forming versus history as critical/reconstructive—but can't move beyond that "tension" cliché. The exam question needs to force original thinking by making that framing useless. 

  The professor's apparatus—evidential vs. constitutive offices plus convergence requirement—is brilliant because it reframes the problem. The fictional mill town case with biased archives perfectly destabilizes assumptions about "neutral" records. My task is to craft a question that makes students decide when memory or records should yield, while questioning if convergence smuggles in equivalence. 

  For the exam question wording, I'll emphasize: 
  - Clear setup of the two offices and convergence requirement 
  - Explicit inversion of power dynamics (company archives vs. oral tradition) 
  - The core dilemma: when to prioritize which, and whether convergence is fair 
  - Directive to "argue decisively" to prevent survey-style answers 

  The model answer must demonstrate: 
  - Immediate engagement with the archive's bias as fundamental 
  - Concrete scenarios where memory should yield (e.g., factual injuries) vs. where records should yield (e.g., meaning-making) 
  - Critique of convergence as potentially privileging evidence when purposes differ 
  - No theorist names—pure reasoning 

  Marking scheme traps should target real student pitfalls: 
  - Treating written records as inherently neutral (2 marks off) 
  - Reducing constitutive office to "license for false belief" (4 marks off) 
  - Ignoring the power inversion (3 marks off) 
  - Superficial "tension" without decision (4 marks off) 
  - Missing that convergence assumes shared purpose (4 marks off) 

  A/B line distinction: 
  - B answers recognize bias but default to "both matter" without concrete criteria 
  - A answers commit to when/how each office prevails and interrogate convergence's limits 

  The model answer will show a student wrestling productively: admitting uncertainty about convergence while offering principled distinctions, all within 700 words. Key moves: using the strike's casualty list to show where evidence must prevail, versus the parade's meaning where memory constitutes identity—and noting that convergence fails when purposes diverge entirely.
answer: |-
  ### Exam Question  
  **Handout: Apparatus**  
  A community’s relationship to its past serves two distinct offices:  
  1. **Evidential Office**: The account is answerable to verifiable facts and stands or falls based on documentary or material evidence.  
  2. **Constitutive Office**: The account sustains collective identity, cohesion, or values in the present, irrespective of factual accuracy.  

  **Convergence Requirement**: A community may retain a constitutive account contradicted by evidence *only* if:  
  (a) It articulates what the account achieves that a factually corrected version could not, and  
  (b) It ceases presenting that account as a factual claim about past events.  

  **Case Study**:  
  Milltown’s oral tradition celebrates a 1919 labor strike as a unified worker victory against exploitative owners. The county archive (compiled by the mill company) documents the strike as a violent failure instigated by "outside agitators," with payroll records showing most workers rejected the strike. Townspeople dismiss the archive as company propaganda.  

  **Question**:  
  Given that *the written record here is not neutral* but shaped by power, when should Milltown’s oral tradition yield to the archival record, and when should the archive yield to oral tradition? Is the convergence requirement a fair tool to resolve such conflicts, or does it wrongly assume both offices answer the same question? **Argue decisively.**  

  ---

  ### Model Answer (698 words)  
  The Milltown case forces us to abandon clichés about "objective history vs. biased memory." Both accounts are interest-laden: the oral tradition binds the community through heroic struggle; the archive legitimizes company authority by pathologizing dissent. The convergence requirement seems useful—but only if we first ask *what each office demands*, not which source is "true."  

  **When memory should yield to the record**: When the dispute concerns *verifiable facts material to present justice*. Suppose the archive proves strikers were denied medical aid after company guards injured them. If Milltown’s tradition denies injuries occurred (to preserve heroism), it must yield. The constitutive office cannot ethically justify suppressing evidence of harm when redress is possible. Here, the community must either adopt the archive’s evidence or concede its account is symbolic, not factual. Silence on material suffering serves power, not community.  

  **When the record should yield to memory**: When the archive obscures *lived experience essential to identity*. If the company’s payroll lists "prove" most workers opposed the strike, but oral histories describe fear of blacklisting, the archive’s "fact" is weaponized. Replacing "We stood together" with "Most scabbed" ignores how terror distorts choice. The constitutive account ("We resisted") sustains dignity against historical erasure. Forcing convergence here—demanding Milltown admit its unity is myth—sells out the oppressed to their oppressor’s paperwork. The record should yield because it cannot capture coercion’s shadow.  

  **The convergence requirement’s flaw**: It assumes evidential and constitutive offices are reconcilable if we just "label clearly." But this smuggles in three biases:  
  1. **Epistemic Privilege**: It presumes "evidence" (even biased archives) sets the default standard. Why must *memory* justify divergence? Milltown might argue the archive fails its own evidential office by omitting worker testimonies.  
  2. **Purpose Blindness**: Constitutive accounts often answer questions evidence cannot. "We are descendants of fighters" is not a failed fact-attempt but a *different utterance*. Forcing it to converge with payroll records is like demanding a poem conform to a spreadsheet.  
  3. **Power Neutrality**: Convergence’s conditions ("Explain what the myth does") sound reasonable—but only if power is equal. When the archive is controlled by perpetrators, requiring the oppressed to academically dissect their sustaining myths is itself oppressive.  

  The line between offices isn’t fixed by source type but by *function in context*. Milltown should use the archive to correct factual gaps that enable ongoing harm (e.g., obscured casualties) but reject its framework when the company’s "facts" annihilate subaltern subjectivity. Convergence works only when both parties agree on what counts as evidence and what constitutive needs matter—which rarely happens in asymmetrical conflicts.  

  Ultimately, the apparatus helps most when it exposes that memory/history tensions aren’t philosophical puzzles but *negotiations of power*. The real failure in Milltown would be letting the company archive monopolize "evidence" or letting oral tradition romanticize avoidable suffering. Convergence demands honesty about purposes: if the town clings to unity myths while workers’ graves go unmarked, it betrays the past; if the archive’s "facts" silence resistance, they entomb justice.  

  ---

  ### Marking Scheme (25 Marks Total)  
  **Must-hit points** (Deduct marks if absent/mishandled):  
  1. **Rejects archive neutrality** (3 marks).  
     *Failure mode: Assumes written records are inherently objective because "documented."*  
  2. **Distinguishes scenarios for yielding**: Concrete cases where memory *must* cede (evidence of material harm) vs. archive *should* cede (erasure of lived experience/coercion) (6 marks).  
     *Failure mode: Vagueness ("It depends"); or conflates constitutive office with "right to false belief."*  
  3. **Critiques convergence requirement**: Exposes its hidden assumptions (epistemic privilege, purpose equivalence, power neutrality) (6 marks).  
     *Failure mode: Superficial acceptance/rejection of convergence without probing biases.*  
  4. **Prioritizes function over source**: Judges offices by role (evidential for redress, constitutive for dignity), not origin (oral/written) (5 marks).  
     *Failure mode: Defaults to "memory = identity, history = truth" despite case asymmetry.*  
  5. **Decisive argument**: Takes a stand on when/why to prioritize one office, avoiding "both matter" fence-sitting (5 marks).  
     *Failure mode: Surveys options without committing; or restates "tension" without resolution.*  

  ---

  ### A/B Boundary  
  A **B answer** correctly identifies the archive’s bias and the distinct offices, applies the convergence requirement mechanically to the case (e.g., "Milltown must explain its myth or stop"), and recognizes that power matters—but **fails to challenge convergence’s core assumptions or provide concrete, principled criteria** for when one office should prevail. It describes the conflict but does not resolve it on new terms.  
  An **A answer** does all the above **while also exposing the convergence requirement’s tacit biases** and offering a **functional, context-sensitive framework** (e.g., "Yield based on redress needs vs. identity integrity"). It **transcends the initial apparatus** to show *why* the standard memory/history dichotomy fails here.
