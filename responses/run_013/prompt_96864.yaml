  - Flag genuine problems vs. debating tricks.
  - Note if the objection is against the formulation or constructivism itself.
  - The one question the presenter hopes nobody asks.

  Additional:
  - Analogy between excluded middle and the closed-world assumption: classical logic as an optimization that is sound only when every predicate terminates? Will this win or lose the analysts? Does it misrepresent constructivism?
  - What to tell the combinatorialist about why this matters to him?

  Let's structure the response:

  I. Order of objections (from most damaging to least, but note: the most damaging might be the one that the logicians or the Dummettian would ask, and the one that the presenter fears the most)

  II. For each objection:
     - Source (e.g., analyst, logician, etc.)
     - Objection (verbatim style)
     - Reply (2 minutes)
     - Weakness of reply
     - Whether it's a genuine problem or a debating trick, and if it targets the formulation or constructivism itself.

  III. Concessions: which to make at the outset, which to avoid.

  IV. The one feared question.

  V. On the analogy with closed-world assumption: will it win or lose analysts? Does it misrepresent?

  VI. For the combinatorialist: why does this matter to him?

  Let's list the objections:

  1. From the analysts (or classical mathematicians):
     a. "But in analysis we use the intermediate value theorem all the time, and it's obviously true. The constructive version is much weaker and doesn't give us the same results. Are you saying we've been doing it wrong for centuries?"
     b. "Excluded middle is fundamental. Without it, we can't even say that a number is either rational or irrational. That's absurd!"

  2. From the number theorist:
     a. "We have non-constructive existence proofs in number theory (e.g., using the pigeonhole principle or probabilistic methods) that are incredibly powerful. Are you saying we should abandon them? That would set us back decades."

  3. From the combinatorialist:
     a. "Why should I care? I don't see how constructive proofs would make any difference to my work. I prove existence of combinatorial objects, and sometimes I can't exhibit them explicitly, but the proofs are valid and useful."

  4. From the logicians:
     a. "The double-negation translation shows that classical logic is reducible to intuitionistic logic. So why can't we use classical logic as a convenient shorthand? It doesn't harm the foundations because it can be translated away."
     b. "But constructivism requires choosing a specific notion of construction (e.g., recursive functions, or some other model). There are many constructive systems (e.g., Martin-Löf type theory, Bishop's constructive mathematics) and they are not equivalent. So which one is the 'right' one? And why should we believe that your chosen notion of construction captures the essence of mathematical existence?"

  5. From the Dummettian philosopher:
     a. "But Dummett's argument is based on the theory of meaning and the acquisition of language. Without that, your argument from the halting problem is merely an analogy. How do you ground the meaning of mathematical statements in a way that forces constructivism?"

  6. A general objection from the classical mathematicians:
     a. "This is just a philosophical debate. In practice, we use whatever logic gets the job done. Why should we change our practice?"

  We order by damage:

  Most damaging might be:
  - The logician's point about the double-negation translation: if classical logic is just a shorthand and can be embedded, then why is it illegitimate? (This directly challenges the thesis that classical reasoning is sometimes illegitimate.)
  - The Dummettian point: without the philosophical foundation, the argument might be seen as weak.

  Less damaging (but still important) are the practical objections from the mathematicians.

  But note: the presenter fears one question above all. That might be the logician's question about the multiplicity of constructive systems.

  Now, let's address each.

  I'll order the objections by perceived damage (high to low):

  1. Logician's objection about double-negation translation and the legitimacy of classical logic as shorthand.
  2. Dummettian's objection about the lack of philosophical grounding.
  3. Analyst's objection about the intermediate value theorem (practical impact).
  4. Number theorist's objection about non-constructive methods in number theory.
  5. Combinatorialist's objection about relevance.
  6. Logician's objection about the multiplicity of constructive systems.

  But note: the presenter's fear might be about the multiplicity of constructive systems or a technical point about the halting problem analogy.

  Let me set the feared question as the one about the multiplicity of constructive systems, because it exposes a foundational issue and the presenter might not have a clear answer.

  Now, replies:

  **Objection 1 (Logician):** "You concede that classical mathematics can be embedded into constructive systems via double-negation translations. So why isn't classical logic just a convenient shorthand? If we can interpret classical statements constructively, then when we prove existence classically, it does have a constructive meaning: it's just that the witness is hidden behind double negations. And in fact, the double-negation translation gives a constructive meaning to classical existence. So your claim that classical existence proofs are illegitimate when they don't supply a construction seems unfounded: they do supply a construction in the constructive system, but it's a construction of a negated formula. Moreover, in practice, we often can extract the witness from a classical proof by careful analysis. So why the strict ban?"

  Reply: "The double-negation translation does show that classical logic can be embedded, but note that the translation of an existence statement ∃x P(x) becomes ¬∀x¬P(x), which is not the same as a constructive existence. Constructively, we want a witness. The translation tells us that the classical proof of existence can be transformed into a constructive proof that it's impossible that there's no witness. But that doesn't give us a witness. So the classical existence proof, even when translated, does not provide the same evidence. Moreover, the translation requires that we reinterpret the entire mathematical framework. If we are doing classical mathematics and then translating, we are not actually doing constructive mathematics. The point is that in the original classical proof, there is no construction. And when we use the classical existence theorem in a larger context, we are using it in a way that is not constructive. So the translation is a way to salvage classical work, but it doesn't make the classical proof itself constructive. The ban is on claiming that a classical proof of existence establishes the existence of a witness in the direct, constructive sense."

  Weakness: The logician might counter that in the constructive system, the translated statement does have a constructive meaning (even if it's a proof of a negative) and that for many purposes that's sufficient. Also, the presenter's original claim was that classical existence proofs are illegitimate when used to establish existence claims that nobody could ever exhibit. But the translation does provide a constructive proof of a related statement. So the objection might show that the presenter's formulation is too strong.

  Genuine problem: This is a genuine issue. The double-negation translation does show that classical logic is consistent relative to intuitionistic logic, and that classical proofs can be given a constructive interpretation, albeit a different one. The presenter might need to clarify that the sense of existence in classical mathematics is not the constructive one, and that the translation changes the meaning.

  **Objection 2 (Dummettian):** "Your argument relies on an analogy with the halting problem and the idea that there's no fact of the matter for undecided statements. But without Dummett's theory of meaning, which ties the meaning of a statement to our ability to recognize a proof of it, your argument is incomplete. How do you ground the meaning of mathematical statements? Without that, the mathematicians in the room will see no reason to abandon classical logic."

  Reply: "I admit that I am not a philosopher and I cannot fully defend Dummett's theory of meaning. But I can say that the halting problem analogy illustrates that for some statements, we don't have a decision procedure. And in mathematics, we don't have a decision procedure for every statement. When we use excluded middle for such a statement, we are asserting that it is either true or false, but we don't know which. That's a leap of faith. The constructive approach is more honest: we only assert what we can prove. And if we cannot prove either, we remain agnostic. This is not just about meaning, but about the information that a proof provides. A constructive existence proof gives us a witness we can use. A classical one does not. That practical difference is what I want to emphasize."

  Weakness: Without the philosophical grounding, the argument might seem like a matter of taste. The Dummettian might feel that the presenter is missing the core argument for intuitionism.

  Genuine problem: The presenter's argument is indeed incomplete without a theory of meaning. The analogy with the halting problem is only an analogy.

  **Objection 3 (Analyst):** "In analysis, we rely on classical results like the intermediate value theorem (IVT). The constructive IVT requires additional hypotheses (like uniform continuity) and doesn't give the same results. Without excluded middle, we lose the IVT in its full generality. Are you saying that we should abandon such a fundamental result? That seems absurd."

  Reply: "I'm not saying we abandon the IVT. I'm saying that we should be honest about what it achieves. The classical IVT tells us that there is a root, but it doesn't tell us where. In many practical situations, we need to approximate the root. The constructive IVT does exactly that: it provides an algorithm to approximate the root. So for practical purposes, the constructive version is more useful. Moreover, the classical IVT can be seen as a shorthand for the constructive one when we have uniform continuity. But when we don't, the classical IVT might be asserting the existence of a root that we cannot compute. Is that really what we want? The constructive approach forces us to be explicit about the assumptions we need for computation."

  Weakness: The classical analyst might counter that they often don't need to compute the root; they just need to know it exists to build upon it. And in many theoretical contexts, that is sufficient. Also, there are constructive counterexamples that show that without uniform continuity, there might be no algorithm to find the root. But the classical mathematician might not care about computability.

  Genuine problem: This is a genuine issue for analysts because they rely on classical results. The presenter must concede that constructivism requires a different approach to analysis, but that it can be done (as in Bishop's book). However, the analyst might not be willing to change their practice.

  **Objection 4 (Number theorist):** "In number theory, we have non-constructive existence proofs that are essential. For example, the proof of the infinitude of primes is constructive, but many other proofs (like those using the pigeonhole principle or probabilistic methods) are not. Are you saying we should abandon these? That would cripple the field."

  Reply: "I'm not saying we abandon them. I'm saying we should strive to make them constructive when possible. For instance, the probabilistic method can sometimes be derandomized to give a constructive proof. And when it cannot, we should be aware that we are using a non-constructive argument. The existence we prove is not one that we can exhibit. That might be acceptable in some contexts, but we should be clear about what we are doing. Moreover, the constructive approach might lead to new insights and algorithms. For example, in combinatorics, constructive proofs often yield efficient algorithms to produce the objects."

  Weakness: The number theorist might say that sometimes derandomization is not known or is very difficult, and that the non-constructive proof is the only one we have. So banning it would indeed cripple the field.

  **Objection 5 (Combinatorialist):** "Why should I care? My existence proofs in combinatorics are valid. I don't need to exhibit the object explicitly. The proof shows it's there, and that's enough for the theory."

  Reply: "It matters because constructive proofs often come with algorithms that can be implemented. For example, if you prove that a certain combinatorial object exists by a constructive method, then we can actually generate that object. That might be important for applications, such as in computer science. Also, the constructive discipline can lead to stronger results: by avoiding non-constructive steps, you ensure that your results are computationally meaningful. Moreover, sometimes non-constructive proofs rely on principles (like the axiom of choice) that are very strong and might be questioned. Constructive proofs are more trustworthy in that sense."

  Weakness: The combinatorialist might say that in many cases, the objects are too large to exhibit (e.g., graphs with certain properties) and that the existence is what matters. Also, they might not care about algorithms.

  **Objection 6 (Logician):** "There are many constructive systems: Bishop's constructive mathematics, Martin-Löf type theory, recursive function models, etc. They are not equivalent. So which one is the 'right' one? And why should we believe that your chosen notion of construction captures the essence of mathematical existence? For example, in some constructive systems, the Church-Turing thesis is assumed, but in others, it is not. Without a unique constructive system, it seems that constructivism is not a single position but many."

  Reply: "I agree that there are different constructive systems. But they share the common feature that they require explicit constructions for existence and disjunction. The differences arise in the interpretation of what counts as a construction. But that's no different from classical mathematics, where there are also different foundational systems (ZFC, NBG, etc.). The core idea is that we should not use excluded middle for existence proofs. The exact details can be worked out in different ways. For most of mathematics, these systems agree. And for the purposes of this discussion, the key point is that all of them reject non-constructive existence proofs."

  Weakness: The logician might point out that different constructive systems can prove different theorems. For example, some constructive systems accept the fan theorem, others don't. So the presenter's claim that "mathematics ought to be done" in intuitionistic logic is vague without specifying which constructive system.

  Genuine problem: This is a genuine issue for the foundations of constructivism. It might not be a problem for the presenter's main point if they focus on the common core.

  **The Feared Question:** "Can you give a clear example of a classical existence proof that is not only non-constructive but also cannot be made constructive by any known means, and explain why that proof is illegitimate in a way that matters to a working mathematician?"

  This is feared because it requires a specific example and because the presenter must argue that the proof is illegitimate. The example might be one where we know that no constructive proof exists (e.g., because of independence results). But then the presenter must say that such a proof should not be accepted. This might be too radical for the audience.

  Alternatively, the feared question might be about the halting problem analogy: "But the halting problem is about computability, and mathematics is not limited to computable functions. Why should we accept that analogy?"

  But I think the above about an example is more feared.

  **Concessions:**

  At the outset, the presenter should concede:
  - That classical mathematics has been incredibly successful and that many classical results are true constructively (or can be made constructive).
  - That the double-negation translation allows classical mathematics to be embedded in constructive systems, so that classical work is not lost.
  - That for some mathematical purposes, especially in abstract theory, classical logic is more convenient.

  But the presenter should not concede that classical existence proofs are legitimate in the same sense as constructive ones.

  **The analogy with closed-world assumption:**

  The presenter wants to compare excluded middle to the closed-world assumption (CWA) in databases. In CWA, we assume that if a fact is not in the database, then it is false. Similarly, classical logic assumes that every statement is either true or false, even if we don't know which.

  The analogy: classical logic is an optimization that is sound only when every predicate terminates (i.e., when we have a decision procedure).

  This framing might be appealing to the analysts if they see it as a computational issue. But it might misrepresent constructivism because constructivism is not just about computability. Constructivism is about the nature of mathematical objects and proofs. Also, in constructivism, not every statement is assumed to have a decision procedure.

  This analogy might win the analysts if they are computationally minded, but it might lose them if they think that mathematics is not about computation. It misrepresents constructivism by reducing it to a computational constraint. Constructivism is a philosophical position about the meaning of mathematical statements.

  So use with caution: it might be a useful analogy to explain why excluded middle fails, but it is not the whole story.

  **For the combinatorialist:**

  The combinatorialist asks: "Why should I care?"

  Better answer than "foundations are intrinsically interesting":
  - Constructive proofs in combinatorics often yield algorithms that can be implemented on a computer. For example, a constructive proof of the existence of a combinatorial object might give a way to generate that object, which is useful for applications (like in computer science, optimization, or even in generating examples for research).
  - Non-constructive proofs can sometimes hide the structure. By seeking a constructive proof, you might discover new combinatorial structures or connections.
  - In some cases, non-constructive proofs rely on principles that might be false in non-standard models, while constructive proofs are more robust.

  This might appeal to the combinatorialist if they care about algorithms or applications.

  Final structure for the response:

  1. Order of objections (by damage):
     a. Logician on double-negation translation (most damaging).
     b. Dummettian on philosophical grounding.
     c. Analyst on IVT.
     d. Logician on multiplicity of constructive systems.
     e. Number theorist on non-constructive proofs in number theory.
     f. Combinatorialist on relevance.

  2. The feared question: about a specific classical existence proof that cannot be made constructive and why it's illegitimate.

  3. Concessions: make the ones above at the outset.

  4. Analogy with CWA: might win analysts if presented as a computational optimization, but risks misrepresenting constructivism. Use carefully.

  5. For combinatorialist: focus on algorithms and robustness.
answer: |-
  Below is a comprehensive preparation for your session, structured to address the objections your audience is likely to raise. I'll order the objections by their potential damage to your position (starting with the most damaging), provide a verbatim-style objection for each audience member, craft a concise two-minute reply, note the weakness in your reply, and flag whether the objection targets your formulation or constructivism itself. I'll also cover concessions, the "feared question," your closed-world analogy, and the combinatorialist's concern.

  ### Key Concessions to Make Early
  To build credibility and preempt hostility, concede these points upfront—they won't cost you the thesis but will show you're grounded:
  1. **Classical logic is pragmatically useful**: It often abbreviates constructive arguments efficiently (e.g., in finite combinatorics), and mathematicians shouldn't abandon it entirely for routine work. Concede that classical logic has driven progress for centuries.
  2. **Double-negation translation validates classical consistency**: Classical math can be embedded in intuitionistic systems, so it isn't "wrong" in a formal sense—it's just a different layer of abstraction.
  3. **Not all math needs explicit constructions**: In highly abstract areas (e.g., set-theoretic topology), constructive methods may be cumbersome and classical reasoning is a practical tool.

  **Avoid conceding**: That classical existence proofs genuinely establish mathematical existence. Conceding this would collapse your thesis, as your core claim is that existence requires constructibility.

  ### Ordered Objections and Replies
  I've ordered these by damage: high-damage objections challenge your thesis philosophically or expose gaps in your argument, while low-damage ones are practical or tactical. Each objection is phrased as the audience member would speak, reflecting their priorities.

  #### 1. Logician's Objection (Highest Damage: Targets your core thesis)  
  **Objection**: "You claim classical existence proofs are illegitimate because they don't supply constructions, yet you concede the double-negation translation embeds classical logic into intuitionistic systems. Doesn't this mean classical existence statements are just intuitionistic statements about the *absurdity* of nonexistence? For example, a classical proof of ∃x.P(x) translates to ¬¬∃x.P(x) in intuitionistic logic, which is constructively valid. So classical proofs aren't 'illegitimate'—they're syntactic shorthand for a constructive meta-argument. Why isn't that sufficient for mathematical existence?"  
  **Reply**: "The double-negation translation shows classical logic is *consistent* relative to intuitionistic logic, but it doesn't preserve the meaning of existence. A constructive proof of ∃x.P(x) provides a witness I can compute with—say, a specific number satisfying a property. The translated classical proof only shows ¬∀x.¬P(x), meaning 'no counterexample exists.' That's a meta-theoretic claim about provability, not a construction. For instance, if I classically prove a solution to an equation exists, I can't extract it computationally from ¬¬∃x.P(x). This matters when math interfaces with the real world, like in verification or physics, where we need explicit witnesses. Classical existence is a shadow of constructive existence—useful for bookkeeping, but not the real thing."  
  **Weakness**: Your reply assumes "mathematical existence" must be computational, but the logician might counter that math is abstract and the translated statement is still a valid intuitionistic truth. This exposes a genuine problem for constructivism itself: if classical logic reduces conservatively to intuitionistic logic, banning it seems arbitrary without a deeper philosophical argument (like Dummett's).  
  **Damage Type**: Genuine problem for your formulation. You framed classical existence as "illegitimate," but the translation shows it's intuitionistically admissible. This forces you to clarify that "existence" means "computable witness," not "consistency."

  #### 2. Dummettian Philosopher's Objection (High Damage: Undercuts your foundation)  
  **Objection**: "You're leaning on the halting problem to argue there's 'no fact of the matter' for undecided statements, but that's a computability analogy, not a philosophical justification. Dummett's case for intuitionism rests on meaning-theory: we learn mathematical statements by learning to recognize proofs of them, so truth can't outstrip verification. Without that, you're just saying classical proofs are inconvenient—not illegitimate. Why should these mathematicians care if you haven't grounded constructivism in the theory of meaning?"  
  **Reply**: "You're right—I'm not a philosopher, and I can't fully defend Dummett's meaning-theory here. But the halting problem illustrates the verificationist point computationally: for an undecidable statement, asserting it's true or false via excluded middle is like asserting a program halts when we have no means to decide it. That goes beyond 'inconvenience'; it smuggles in metaphysical assumptions. If math is about humanly accessible knowledge (as most working mathematicians assume when they demand proofs), then existence requires verification via construction. The analyst using IVT expects to approximate roots, not just know they exist abstractly. So legitimacy comes from verifiability, and classical existence often fails that."  
  **Weakness**: Without Dummett's meaning-theory, your argument feels instrumental ("constructions are useful"), not necessary ("constructions define truth"). The philosopher might see this as a debating trick that avoids the hard work of justifying verificationism.  
  **Damage Type**: Genuine problem for constructivism itself. Your formulation relies on an analogy, but Dummett's case requires a semantic foundation.

  #### 3. Analyst's Objection (Medium Damage: Questions practical viability)  
  **Objection**: "This sounds unworkable. In analysis, we use the intermediate value theorem (IVT) daily. The constructive version requires uniform continuity and gives only approximations, not exact roots. If I follow your rule, I lose tools like the Bolzano-Weierstrass theorem and have to rebuild analysis from scratch. Are you saying centuries of progress are illegitimate? That's absurd—IVT is empirically reliable!"  
  **Reply**: "I'm not dismissing IVT—I'm refining it. The classical IVT asserts an exact root exists but doesn't help you find it. In practice, analysts compute roots numerically, which is constructive. Bishop's constructive analysis proves a version of IVT that gives algorithms for approximation under uniform continuity, which covers most applied cases. When you use the classical IVT without uniform continuity, you're asserting existence for a 'root' that might be uncomputable—like a Specker sequence limiting to a non-computable number. That's fine for abstract theory, but if you're simulating heat flow, you need an algorithm. Constructivism forces honesty: if you can't compute it, don't claim existence in a concrete sense."  
  **Weakness**: Analysts might retort that abstract existence (e.g., "a solution exists") suffices for theoretical work (e.g., proving uniqueness), and constructivism imposes unnecessary computational baggage. This targets your formulation—you conflate "mathematical existence" with "practical computability," but many mathematicians see them as distinct.  
  **Damage Type**: Debating trick. The objection ignores that constructive analysis exists (e.g., Bishop) but highlights how your thesis might alienate applied mathematicians.

  #### 4. Logician's Second Objection (Medium Damage: Challenges intuitionism's coherence)  
  **Objection**: "You claim intuitionistic logic is the 'right' logic, but there are many constructive systems—Bishop's math, Martin-Löf type theory, Brouwer's intuitionism—and they disagree on axioms (e.g., choice sequences or Church's thesis). If constructivism isn't unified, how can it be the foundation? And why is your Agda/Coq-based view (which assumes computation) more valid than, say, a set-theoretic intuitionism?"  
  **Reply**: "Fair point—constructive systems vary, but they all share a core: existence requires construction, and excluded middle is rejected. This is like classical math having ZFC and NBG as distinct set theories. My Coq-based view emphasizes computation because math is increasingly computational (e.g., in cryptography or ML), but the philosophical core is consistent. For instance, Bishop and Martin-Löf both demand witnesses for existence. The differences arise in *how* constructions are handled, but all agree classical 'existence' without construction is inadequate."  
  **Weakness**: The logician might note that some constructive systems (e.g., with bar induction) prove results others can't, making "existence" system-relative. This undermines your claim that intuitionistic logic is the single "right" logic.  
  **Damage Type**: Genuine problem for constructivism itself. No unified system exists, so your thesis is idealistic.

  #### 5. Number Theorist's Objection (Low Damage: Practical pushback)  
  **Objection**: "In number theory, we use non-constructive proofs all the time—like probabilistic methods for prime gaps or pigeonhole arguments for Diophantine equations. These don't give explicit bounds, but they're efficient and insightful. If I avoid them for 'constructive purity,' I'd miss breakthroughs. Isn't this just ideology?"  
  **Reply**: "I'm not banning non-constructive proofs—I'm urging we recognize their limitations. Probabilistic methods often hide constructive content. For example, Erdős' proof of the divergence of ∑1/p uses randomness, but we have constructive versions like Euler's. When a proof is non-constructive, it signals a gap in understanding: either we can find a constructive version (which often yields algorithms, e.g., for primality testing), or we should admit we've proven a weaker statement. This isn't ideology—it's about deepening insight. For instance, constructive proofs in analytic number theory often give explicit constants crucial for applications."  
  **Weakness**: Some non-constructive proofs (e.g., using random graphs) resist derandomization, so insisting on constructivity could stall progress. This questions your thesis's practicality but doesn't refute it.  
  **Damage Type**: Debating trick. The objection confuses "useful" with "legitimate."

  #### 6. Combinatorialist's Objection (Lowest Damage: Relevance challenge)  
  **Objection**: "Why does this matter to me? I prove existence of combinatorial objects—say, a graph with specific properties. Sometimes I use probabilistic methods and can't exhibit the graph explicitly, but the proof is short and elegant. Demanding constructions feels pedantic. Is this just foundations navel-gazing?"  
  **Reply**: "It matters because constructive proofs often yield algorithms that make your results applicable. For example, a constructive proof for the existence of expander graphs gives explicit families used in error-correcting codes. Non-constructive proofs, like those using the probabilistic method, can obscure structure—derandomizing them frequently uncovers new combinatorics (e.g., the LLL algorithm). Moreover, in finite combinatorics, classical existence sometimes relies on non-constructive axioms (e.g., choice), which can imply pathological objects. Constructivism ensures your objects are computationally meaningful, not just consistent set-theoretic ghosts."  
  **Weakness**: For purely theoretical questions (e.g., "does such a graph exist?"), elegance may trump constructivity. Your reply assumes the combinatorialist values applications, which they might not.  
  **Damage Type**: Debating trick. The objection ignores that constructivity can enhance combinatorics but doesn't engage your core argument.

  ### The Feared Question You Hope Nobody Asks
  **Question**: "You argue that classical existence is illegitimate when no construction can be exhibited. But consider the Hahn-Banach theorem in functional analysis: it's proven classically with Zorn's lemma, and no constructive proof exists for the general case (it's even independent of ZF). If we accept your view, analysts must abandon this tool—yet it underpins key results. How is that anything but a regressive imposition of your ideology on successful practice?"  

  **Why it's feared**:  
  - It forces you to reject a widely used, "effective" theorem, making your position seem extreme.  
  - It highlights that some classical results have no constructive counterpart, so your thesis would stall active research.  
