answer: |-
  Here is the essay question, model answer, and marking scheme designed to meet your specifications:

  **Essay Question (to be provided verbatim to students):**

  "Consider the following demarcation criterion ('the liability test'): A practice is scientific to the extent that it (i) specifies, before seeing the relevant data, an outcome that would count as a refutation of its central claim, and (ii) does not shield that claim from such an outcome by adding or revising auxiliary assumptions, except where the new auxiliary is itself independently testable.

  Case A: A pre-registered epidemiological model outputs continuous risk scores. Its predictions are probabilistic, so no single dataset refutes it. However, its analysis plan and calibration targets (e.g., expected error rates on key metrics) were fixed in advance. Subsequent testing on held-out data reveals it is badly miscalibrated (e.g., predicted 10% risk corresponds to actual 30% events).

  Case B: A practitioner of a fringe energy therapy publishes a sharp prediction: a sealed sample of water treated by her device will differ measurably from an untreated control within one hour. She offers to submit to a blinded test.

  Based *only* on the liability test and these descriptions:
  1.  Assess whether Case A and Case B satisfy clauses (i) and (ii).
  2.  Is the liability test primarily a strengthened version of a falsifiability criterion (like Popper's), or is it a criterion of a fundamentally different kind? Explain the key similarities and differences.
  3.  Can clauses (i) and (ii) ever come apart? Illustrate using the cases if possible.
  4.  Does the liability test show that locating a single criterion of demarcation is a well-conceived project? Why or why not?

  Your answer should focus on the logic of the test itself and the cases provided. While you may reference philosophical concepts, the core argument must stand without relying on specific names."

  ---

  **Model Answer (Approx. 650 words):**

  The liability test offers a nuanced perspective on demarcation, moving beyond simplistic falsifiability. Applying it to the cases reveals its structure and limitations.

  **(1) Case Assessment:**
  *   **Case A (Epidemiological Model):** This practice **satisfies both clauses** of the liability test. (i) It clearly specifies refuting outcomes *in advance*: specifically, failing its pre-defined calibration targets on held-out data (e.g., significant deviation between predicted and actual event rates). Bad miscalibration *is* specified as refuting the model's central claim of predictive accuracy. (ii) Pre-registration binds the researchers. They cannot shield the core model by arbitrarily changing the analysis plan, metrics, or calibration targets after seeing the failing data. Any proposed modification (e.g., adjusting the model) would require new, independently testable auxiliary hypotheses (e.g., "The model structure was wrong; this new structure fits *all* relevant data better"), not just an ad hoc fix for this failure.
  *   **Case B (Energy Therapy):** This practice **satisfies clause (i) but likely fails clause (ii)**. (i) It makes a sharp, pre-specified prediction (measurable difference within an hour under blinded conditions). A negative result in such a test *would* count as a refutation of the central claim that the device has an immediate, measurable effect. (ii) However, the description provides no safeguards against shielding the core claim. If the test fails, the practitioner could easily invoke auxiliaries without independent testability: "The test environment had negative energy," "The operator wasn't properly attuned," "The water sample was impure," or "The effect takes longer than one hour sometimes." Unless these excuses themselves generate specific, testable predictions *different* from the original claim (and are tested rigorously), clause (ii) is violated. The original sharp prediction alone doesn't prevent post-hoc immunizations.

  **(2) Comparison to Falsifiability:**
  The liability test is **fundamentally different in kind** from a simple falsifiability criterion, though clause (i) directly incorporates it. A pure falsifiability criterion (like Popper's logical requirement) focuses solely on whether a theory is *in principle* falsifiable by some conceivable observation – it's a logical property of statements. Clause (i) captures this, demanding pre-specified refuting conditions.

  However, clause (ii) introduces a crucial **methodological and social dimension**. The Duhem-Quine thesis shows that any test inherently involves auxiliary assumptions (about instruments, experimental setup, background conditions). A purely logical falsifiability criterion is easily subverted because failure can *always* be blamed on faulty auxiliaries rather than the core theory. Clause (ii) addresses this by imposing a *norm*: scientists must not abuse this logical loophole to evade refutation by constantly tweaking untestable auxiliaries. It demands accountability in practice, not just falsifiability in principle. It shifts the focus from the logical structure of the theory to the *behavior* and *commitments* of its practitioners. Case B shows how easily a logically falsifiable claim (clause (i)) can be rendered pseudo-scientific in practice without clause (ii)'s constraint.

  **(3) Can Clauses (i) and (ii) Come Apart?**
  **Yes, the clauses can clearly come apart**, as demonstrated by the two cases:
  *   **Satisfies (i) but not (ii):** Case B exemplifies this. It makes a bold, falsifiable prediction (satisfying (i)) but provides no barrier to immunizing the core claim post-failure with untestable auxiliaries (violating (ii)).
  *   **Satisfies (ii) but not (i)?** While harder to construct perfectly within the test's framing, imagine a practice that meticulously avoids ad hoc adjustments (satisfies (ii)) but whose central claim is inherently vague or non-committal, failing to specify *any* concrete refuting outcome in advance (violating (i)). Certain forms of unfalsifiable psychoanalytic interpretation or vague historical theories might approach this. The liability test would deem them non-scientific primarily due to failing (i).

  **(4) Verdict on the Single-Criterion Project:**
  The liability test, while insightful, **demonstrates why the project of finding a single, sharp demarcation criterion is ill-conceived**. The test itself is complex, having two distinct clauses that address different problems (logical falsifiability vs. methodological evasion) and can operate independently. Its application requires significant interpretation (e.g., what counts as "independently testable"? What constitutes the "central claim"?). Furthermore, it defines science as a matter of *degree* ("to the extent that") rather than a binary, acknowledging practices can be more or less scientific based on adherence to these norms. This gradation undermines the search for a single bright line. The test highlights crucial *norms* of good scientific practice (pre-registration, commitment to test outcomes, avoiding immunizations), but these are procedural virtues within a broader, evolving social enterprise (Kuhn's paradigms, Lakatos's research programmes), not a timeless logical definition. It captures important aspects of scientific integrity but cannot, alone, define the entire, multifaceted endeavor of science. The philosopher's objection to probabilistic models fails precisely by ignoring the methodological rigor (like pre-registration and calibration testing in Case A) that *implements* meaningful testability within a probabilistic framework, showing demarcation depends on practice, not just logic.

  ---

  **Marking Scheme (Total: 20 Marks):**

  1.  **Correct Application to Case A (4 marks):** Must state Case A satisfies *both* clauses (i) and (ii), explaining *how* pre-specified calibration failure counts as refutation (i) and how pre-registration prevents ad hoc adjustments without independent testing (ii). *Common Error:* Focusing only on single data points refuting the model, missing that calibration failure *is* the specified refutation.
  2.  **Correct Application to Case B (4 marks):** Must state Case B satisfies clause (i) (sharp, testable prediction) but fails clause (ii), explaining *how* easily untestable auxiliaries could be invoked post-failure to shield the core claim. *Common Error:* Assuming satisfying (i) automatically satisfies (ii), or misidentifying the core claim/refutation condition.
  3.  **Accurate Comparison to Falsifiability (4 marks):** Must clearly state clause (i) incorporates falsifiability but clause (ii) adds a fundamentally different *methodological/social* dimension addressing the Duhem-Quine problem of auxiliary assumptions. Must contrast logical falsifiability (principle) with the norm against evasion (practice). *Common Error:* Simply stating it's a "strengthened" Popper without explaining the qualitative shift to norms/practice.
  4.  **Demonstrating Clause Independence (3 marks):** Must clearly state clauses (i) and (ii) *can* come apart and correctly cite Case B as satisfying (i) but not (ii). Should acknowledge the reverse (satisfies (ii) but not (i)) is possible conceptually, even if less obvious. *Common Error:* Stating the clauses are inseparable or failing to provide a clear example (like Case B) of their separation.
  5.  **Evaluation of Single-Criterion Project (5 marks):** Must argue the liability test *undermines* the single-criterion project because it is itself complex (two distinct clauses), requires interpretation, defines science as a matter of degree, and highlights methodological/social norms rather than providing a simple logical definition. Must explicitly link this to the inadequacy of purely logical falsifiability (like the colleague's objection). *Common Error:* Simply agreeing/disagreeing without explaining *why* based on the test's features (complexity, gradation, normativity).

  **A vs. B Answer Differentiation:**
  *   **An A answer (18-20 marks)** MUST hit all 5 points AND demonstrate deep integration: explicitly using Case A to illustrate how clause (ii) addresses the criticism of probabilistic models (showing methodological rigor substitutes for single-instance falsification), AND articulating that clause (ii) transforms demarcation from a logical property into a social/methodological norm, AND firmly concluding the single-criterion project is flawed *because* demarcation hinges on complex, normative practices (like those in Case A) rather than simple logical rules.
  *   **A B answer (16-17 marks)** MUST hit all 5 core points correctly but may lack the highest level of integration. It will correctly analyze both cases, compare to falsifiability, show clause independence, and critique the single-criterion project, but might not as explicitly draw the connection between Case A/clause (ii) and defeating the colleague's objection, or might state the normativity point less forcefully or clearly.

  ---

  **Confidence Note:**

  I am highly confident (90%) in the model answer's central philosophical claims: that clause (ii) addresses the Duhem-Quine problem by introducing a methodological/social norm distinct from logical falsifiability, that this allows probabilistic models (Case A) to be deemed scientific under the test while exposing the vulnerability of superficially falsifiable claims (Case B), and that this complexity inherently challenges the single-criterion demarcation project.

  The point I am least sure of (60% confidence) is the *strongest* phrasing framing clause (ii) as making the test "fundamentally different in kind" rather than just a significant strengthening. While the shift from pure logic to methodological/social norms is crucial, one could argue Popper himself was concerned with practice (conjectures and refutations), making the liability test a rigorous *operationalization* of his ideals within a Duhem-Quine-aware framework, rather than a wholly different kind of criterion. The model answer leans towards emphasizing the difference to highlight the crux you want probed.
