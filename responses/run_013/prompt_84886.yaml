prompt: |-
  I am a novelist, at work on a book in which two families read the same small act — a signature, a silence, a lapse in care — as knowledge or ignorance, as cause or accident, and judge one another accordingly. This autumn I have been asked to run a single ninety-minute session at a residential writing course, and I want to spend it teaching one idea. The room will hold about twenty adults: working novelists and poets, a few general readers, none with any formal training in philosophy. The idea is this: the intuitions on which the method of cases trades — the verdicts we are supposed to share when a thought experiment is put to us — are not the universal, pre-theoretical deliverances that method assumes, but vary systematically across cultures and languages; and it is not obvious what a discipline whose evidence is armchair intuition is to do about that.

  Do not explain the idea to me; I have it. What I need is a plan for teaching it. Tell me the order in which the components must come, and why each depends on the one before it — beginning with whatever has to be in place before the claim can sound like a claim rather than an affront to common sense. Tell me which single case should carry the session, what it must contain and what it must not, and whether the one I have been using is the right one: a woman is told the time by a clock she has every reason to trust, the clock has in fact stopped, and by luck it shows the correct time; the room is asked whether she knew. Tell me the misconceptions this audience will arrive with or develop — I expect 'so philosophy is only opinion', 'so it is all relative', and 'so these intuitions are simply false' — together with the sceptical objection that the differences are artefacts of translation or of the vignettes' phrasing, and at exactly which point in the sequence I should head each of these off, and with what. Tell me the one question I can put to the room at the end that would show whether they have grasped the methodological problem rather than merely enjoyed the anthropology. And tell me what I should openly decline to cover in ninety minutes, and how to decline it without appearing to hide something.
reasoning: |-
  Okay, the user is a novelist working on a book about how different families interpret the same small actions differently. They've been asked to lead a 90-minute session at a writing course and want to teach one specific idea: that philosophical intuitions (like those used in thought experiments) aren't universal but vary across cultures and languages, raising questions about philosophy's reliance on such intuitions.

  I need to create a teaching plan for this. The audience consists of about twenty adults—novelists, poets, and some general readers without formal philosophy training. The key is to structure the session so the idea doesn't sound like an affront to common sense but as a meaningful claim. I should determine the sequence of components, identify dependencies, select the right case study, anticipate misconceptions, and plan how to address them.

  First, I need to start with something relatable. Since the participants are writers, beginning with narrative examples makes sense. The user mentioned a case about a woman checking a stopped clock that coincidentally shows the right time—does she know the time? This is the Gettier problem. I'll use this case, but I'll need to present it effectively.

  The user has used this case before. Is it the right one? Yes, because it's simple and illustrates how intuitions can diverge. But I must avoid technical jargon and focus on the cross-cultural variations. Studies show that while Westerners often say she doesn't know, East Asians might say she does. That contrast is crucial.

  Now, structuring the session. The sequence should build step by step. Start with familiar territory: how interpretations differ in everyday life. Then introduce the thought experiment as a controlled version of that. Show the actual variation in intuitions using the clock case. Highlight that these variations are systematic, not random. Then pose the methodological problem: what does this mean for philosophy?

  Each step depends on the previous one. Beginning with everyday disagreements makes the later philosophical point feel less abstract. Presenting the thought experiment as a narrative tool connects to the writers' expertise. Revealing the cross-cultural data surprises them and challenges assumptions. Only then does the methodological question arise naturally.

  Anticipating misconceptions is vital. Participants might think, "So philosophy is just opinion," or "It's all relative," or "These intuitions are false." Also, they might suspect translation issues or phrasing biases. I need to address these at specific points:

  - When discussing variation, clarify that it's about evidence, not truth, to counter relativism.
  - Preemptively mention that studies control for translation, to avoid dismissal based on methodological concerns.
  - Emphasize that intuitions aren't "false" but culturally influenced, steering clear of absolute claims.

  The key question at the end to test understanding: Ask what philosophers should do when their evidence (intuitions) varies culturally. This shifts focus to methodology, not just the existence of differences.

  Finally, openly decline to cover certain topics. Don't dive into solutions to the methodological problem or detailed philosophy of language. State that the goal is to expose the issue, not resolve it, to keep the session focused and honest.

  Overall, the plan must be engaging, using the writers' strengths in narrative while carefully guiding them through the conceptual progression. The clock case is ideal, but I'll present it with cross-cultural data to make the variation concrete. Keeping explanations jargon-free and linking each step will ensure the idea lands without overwhelming the audience.
answer: |-
  Here’s a structured 90-minute teaching plan, sequenced to build understanding incrementally while preempting misconceptions. The goal is to make the methodological problem vivid *through narrative*, leveraging your audience’s strengths.

  ---

  ### **The Sequence: Why Each Step Depends on the Last**
  1. **Start with Familiar Narrative Ambiguity (15 mins)**  
     **Activity:** Present a brief, neutral vignette from everyday life (e.g., *"A parent forgets a child’s school play. The child sees this as indifference; the parent sees it as exhaustion from working double shifts."*).  
     **Why first?** Writers instantly grasp how identical acts spawn conflicting interpretations. This grounds the session in *their* expertise, avoiding philosophy’s "threat." Establishes that "evidence" (acts/signs) is *always* mediated by perspective.  
     **Dependency:** Without this bridge, the philosophical claim feels alien.

  2. **Introduce "Philosophical Vignettes" as Controlled Thought Experiments (10 mins)**  
     **Activity:** Frame thought experiments (TEs) as "extreme" versions of their vignettes—tools to isolate variables (e.g., belief, justification, truth). Use **your clock case** (it’s ideal—simple, no jargon):  
     *"A woman glances at a reliable clock showing 3:00; it stopped yesterday at 3:00 but by chance is correct. Does she *know* it’s 3:00?"*  
     **Why here?** Positions TEs as narrative devices they recognize. Poll the room: show of hands for "knows" vs. "doesn’t know." Expect disagreement (≈60/40 in lay groups).  
     **Dependency:** They must see TEs as *shared stories* before learning these stories fracture culturally.

  3. **Reveal Cross-Cultural Variation (20 mins)**  
     **Activity:** Present data:  
     - Western groups (e.g., US) overwhelmingly say "no knowledge" (Gettier intuition).  
     - East Asian groups (e.g., China) often say "knowledge" (e.g., Weinberg, Nichols & Stich 2001).  
     - Add *one* non-WEIRD contrast (e.g., Pūrva-Mīmāṃsā philosophers’ view of testimony).  
     **Why now?** The shock of *systematic* divergence—not random disagreement—dislodges the "universal intuition" assumption. Use simple charts/graphics.  
     **Dependency:** Requires Step 2’s "shared story" expectation to rupture it.  
     **Preempt Skepticism Here:**  
     - *"Are these translation/phrasing artifacts?"* → Cite studies using native speakers, back-translation, and multiple vignette phrasings.  
     - *"Are they just confused?"* → Show within-culture consistency.

  4. **Pose the Methodological Problem (25 mins)**  
     **Activity:** Q&A: *"If philosophers use intuitions as 'data' to test theories (e.g., 'knowledge = justified true belief'), but intuitions vary culturally—what happens to the theories?"*  
     - Highlight: This isn’t about "truth" (e.g., *does* she know?), but about **evidence**—what counts as support for a theory.  
     **Why last?** Steps 1–3 make the problem *inescapable*. They’ve seen:  
     - Ambiguity in life (Step 1)  
     - Disagreement in their own room (Step 2)  
     - Systematic global variation (Step 3)  
     Now the crisis clicks: *If intuitions aren’t universal, what is philosophy actually testing?*  

  5. **Combat Misconceptions as They Arise (Integrated)**  
     - **"So philosophy is just opinion!"** → Counter during Step 4: *"No—it’s about whether intuitions can *justify* theories. We’re asking how to build knowledge, not denying it exists."*  
     - **"It’s all relative!"** → Preempt in Step 3: *"We’re describing variation in *evidence*, not claiming truth is relative. A clock can be broken (objective fact) while people disagree on what 'knowing' requires (epistemic norm)."*  
     - **"These intuitions are false!"** → Counter in Step 2 polling: *"Your neighbor disagrees with you. Is their intuition 'false'? Or is this about differing criteria?"*  

  6. **Closing Diagnostic Question (5 mins)**  
     **Ask:** *"If a philosopher says, 'My theory explains *our* intuitions perfectly,' what should we ask them about their evidence?"*  
     **Target Answer:** *"Whose intuitions? How were they sampled?"*  
     → Reveals grasp of the *methodological* crisis (not just "people disagree").

  7. **What to Openly Decline (5 mins)**  
     **State upfront:** *"We won’t solve this today—not because it’s unsolvable, but because 90 minutes can’t cover the sophisticated responses (e.g., expertise defense, reflective equilibrium). We’re exposing the problem so you can spot it in philosophy—and in your characters’ judgments."*  
     → Legitimizes the omission; ties back to their craft.

  ---

  ### **Why Your Clock Case Is Perfect**
  - **Contains:** A clean epistemic gap (justification/truth misaligned); no distracting details; high recognizability.  
  - **Avoids:** Moral valence (unlike trolley problems), complex jargon, or physical implausibility.  
  - **Use it for:** Step 2 (room poll) and Step 3 (cross-cultural data). The dissonance between their intuition and (e.g.) East Asian responses makes the variation visceral.

  ---

  ### **Key Teaching Principles**
  - **Leverage their skills:** Treat vignettes as microfiction. Have them *observe* their own disagreements.  
  - **Avoid philosophy jargon:** Use "story," "judgment," "evidence," not "intuition," "epistemology."  
  - **Anthropology > Philosophy:** Focus on the *data* (cultures vary) before the *implication* (philosophy’s problem).  
  - **Control the narrative:** Misconceptions are part of the pedagogy—invite and redirect them at the points above.  

  This sequence transforms "intuitions vary" from an abstract critique into a tangible, story-driven problem. By the end, the methodological crisis should feel like the natural endpoint of their own observations.
