  3. For each crux, a concrete case, argument, or formal result that both sides agree bears on it, and what each side predicts.

  We structure the response accordingly.

  ## 1. Agreed Claims

  We, the undersigned, agree on the following:

  1.1. **Game Definitions**: The Pasadena game is defined by flipping a fair coin until the first heads appears on toss n, yielding a payoff of (-1)^(n-1) * 2^n / n dollars. The Altadena game is identical but adds $1 to the payoff of the Pasadena game in every state.

  1.2. **Conditional Convergence**: The series for the expected value of the Pasadena game, when summed in the natural order (by n), converges conditionally to ln(2) ≈ $0.693. However, the series is not absolutely convergent (since the sum of the absolute values of the terms diverges).

  1.3. **Rearrangement Vulnerability**: Due to conditional convergence, the terms of the Pasadena game's expected value series can be rearranged to converge to any real number (by the Riemann rearrangement theorem). This means that the sum depends on the order of summation.

  1.4. **Dominance**: The Altadena game strictly dominates the Pasadena game: in every possible state (i.e., for every n), the payoff of Altadena is exactly $1 more than that of Pasadena.

  1.5. **Standard Expected Utility Theory (EUT) and Absolute Convergence**: Standard EUT, when applied to games with a countable number of outcomes, typically requires absolute convergence for the expected value to be well-defined. Without absolute convergence, the expected value is not defined by the standard formalism.

  1.6. **Undefined Expected Value in Standard EUT**: In the standard framework, the Pasadena game does not have a defined expected value because of the lack of absolute convergence.

  1.7. **Altadena's Expected Value**: The Altadena game has an expected value of 1 + (the conditional sum of the Pasadena series in the natural order) = 1 + ln(2) ≈ $1.693, because adding a constant to each outcome does not affect convergence properties and the series for the Pasadena part remains conditionally convergent. However, Camp 1 would note that even Altadena's expected value is not absolutely convergent and hence, by strict standards, is undefined. But we agree that:

  1.8. **Altadena's Absolute Convergence Issue**: The Altadena game also does not have an absolutely convergent expected value series because the absolute values of the payoffs are the same as in the Pasadena game (plus $1, which doesn't change the divergence of the absolute series). Therefore, by the same reasoning, Altadena's expected value is also undefined in standard EUT.

  1.9. **Dominance Principle**: If a game A strictly dominates game B (i.e., yields a higher payoff in every state), then a rational agent should prefer A to B, regardless of whether expected values are defined.

  1.10. **Rational Preference in Altadena vs. Pasadena**: All rational agents should strictly prefer the Altadena game to the Pasadena game because of strict dominance.

  1.11. **Inadequacy of Naive Rearrangement**: We agree that one cannot arbitrarily rearrange the terms of the Pasadena game to justify a preference for it over Altadena. The dominance principle overrides any such rearrangement.

  1.12. **The Central Problem**: The Pasadena and Altadena games present a challenge because while dominance dictates a clear preference (Altadena over Pasadena), the standard EUT does not assign defined expected values to either game. This leaves a gap in how to model rational choice in such situations.

  ## 2. Disagreements Table

  We now outline the remaining disagreements. For each issue, we state the neutral issue, then each side's position, and then the cruxes (sub-questions that would move at least one side if settled).

  | Issue | Camp 1 Position | Camp 2 Position | Cruxes |
  |-------|------------------|------------------|--------|
  | **D1: Adequacy of Standard EUT** | Standard EUT is complete as is. The fact that the Pasadena game has no defined expected value is the correct and sufficient answer. No further principles are needed because rational agents should avoid games without a defined expectation. | Standard EUT is incomplete because it cannot explain the clear rational preference for Altadena over Pasadena (via dominance) and because it leaves undefined what an agent should do when faced with such games. We need additional principles (e.g., dominance, or a refined definition of expectation) to guide rational choice. | (a) Is the lack of a defined expected value in standard EUT a sufficient reason to reject a game? (b) Can we have a decision theory that sometimes relies on dominance without a defined expectation? |
  | **D2: Interpretation of Undefined Expectation** | "Undefined expected value" means that the game is not evaluable by EUT and thus should be rejected by rational agents. It is not a flaw of the theory but a reflection of the game's pathological nature. | "Undefined expected value" is a limitation of the standard formalism. The game is still evaluable by other means (e.g., dominance, or a statewise comparison). The theory should be extended to incorporate such principles. | (a) Does the dominance principle apply even when expectations are undefined? (b) Is there a coherent way to assign a value (or a range) to such games? |
  | **D3: Role of Rearrangement** | The rearrangement phenomenon is a mathematical curiosity that does not bear on rational choice because the natural order (by n) is the only order that corresponds to the actual structure of the game (states indexed by n). Any other order is arbitrary and irrelevant. | The rearrangement possibility shows that the standard expectation is not well-defined and hence we must rely on other principles (like dominance) to make decisions. Moreover, the natural order is not inherently privileged without additional justification. | (a) Is the natural order (by n) the only relevant order for computing expected value? (b) Does the possibility of rearrangement imply that we must reject the expectation in such cases? |
  | **D4: Need for Extension** | No extension is necessary. Rational agents, when faced with a game without a defined expectation, should refuse to play or be indifferent. The Altadena game, having the same issue, is equally problematic, but dominance breaks the indifference. | An extension is necessary to account for the rational preference for Altadena and to handle conditionally convergent cases. We might use concepts like the weak expectation (the limit in natural order) or invoke dominance as a primary principle. | (a) Can we define a consistent and non-arbitrary extension of expectation for conditionally convergent series? (b) Is such an extension necessary for a complete decision theory? |

  ## 3. Crux Analysis

  For each crux identified in the disagreements table, we provide:

  - The crux.
  - A concrete case, argument, or formal result that both sides agree bears on it.
  - What each side predicts about it.

  **Crux (a) for D1 and D2: Does the dominance principle apply even when expectations are undefined?**

  - **Concrete Case**: Consider two games: 
    - Game A: Pays $1 in every state (so a constant $1).
    - Game B: The Pasadena game.
    - Game C: A modified Pasadena game that is identical to Pasadena except in state n=1, where it pays $0 (instead of $2) and in state n=2, where it pays $2 (instead of -$2). Note: This modification breaks dominance? Let's design a better example.

    Instead, use the Altadena vs. Pasadena: Altadena strictly dominates Pasadena. Both have undefined expected value. The question is: must a rational agent prefer Altadena?

  - **Both sides agree**: Dominance is a fundamental principle that should hold.

  - **Camp 1 prediction**: They agree that dominance applies and that Altadena is preferred. But they maintain that this does not require an extension of EUT because the preference is not based on expected value but on dominance. They believe that EUT already allows for such cases by saying that when expectations are undefined, other principles (like dominance) can kick in.

  - **Camp 2 prediction**: They argue that without an extension, EUT does not provide a reason to prefer Altadena. The standard theory only says both are undefined. Therefore, an extension is needed to incorporate dominance as a primary principle or to define a new expectation concept that respects dominance.

  **Crux (b) for D1 and D2: Is there a coherent way to assign a value (or a range) to such games?**

  - **Concrete Case**: Consider using the concept of the "weak expectation" (the sum in the natural order) for the Pasadena game: ln(2). For Altadena, it would be 1+ln(2).

  - **Formal Result**: The concept of a Banach limit can assign a value to conditionally convergent series, but it is not unique and requires an extension of the limit concept.

  - **Camp 1 prediction**: They would say that any assignment of a specific value (like ln(2)) is arbitrary because the series can be rearranged to any value. Therefore, we cannot assign a unique value and it is better to leave it undefined.

  - **Camp 2 prediction**: They would argue that the weak expectation (natural order) is non-arbitrary because it corresponds to the structure of the game (states ordered by n). They might accept a range of values (from -∞ to ∞) but note that this is unhelpful. Alternatively, they might propose that we use the natural order as the default.

  **Crux (a) for D3: Is the natural order (by n) the only relevant order for computing expected value?**

  - **Concrete Case**: Consider a game that is identical to the Pasadena game but with the states relabeled arbitrarily. Does the expected value depend on the labeling?

  - **Argument**: In standard probability theory, the expected value is defined with respect to a fixed sample space and sigma-algebra. The natural order (by n) is inherent in the problem because n is the toss number. Rearranging the terms arbitrarily does not correspond to a change in the outcome probabilities.

  - **Camp 1 prediction**: The natural order is the only order that matters because it reflects the actual state space. Rearrangement is a mathematical artifact that does not correspond to a physical reordering of the states.

  - **Camp 2 prediction**: The possibility of rearrangement shows that the expectation is not robust. The natural order is a choice and without absolute convergence, it is not privileged. Therefore, we need to either reject the expectation or find a way to fix the order.

  **Crux (b) for D3: Does the possibility of rearrangement imply that we must reject the expectation in such cases?**

  - **Formal Result**: The Riemann rearrangement theorem shows that conditionally convergent series are not commutative (order matters). Therefore, the expectation is not well-defined in the usual sense.

  - **Camp 1 prediction**: Yes, rearrangement implies that the expectation cannot be defined in the standard way. Hence, it is undefined and the game is pathological.

  - **Camp 2 prediction**: The rearrangement shows the problem but does not imply we must reject the game entirely. We can still use the natural order or adopt a broader framework.

  **Crux (a) for D4: Can we define a consistent and non-arbitrary extension of expectation for conditionally convergent series?**

  - **Concrete Case**: Consider using a Banach limit or the weak expectation (natural order). Also, consider the concept of "weak expected value" defined as the limit in natural order.

  - **Formal Result**: There are extensions of the notion of a limit (like Banach limits) that can assign values to some conditionally convergent series, but they are not unique and are not linear without further constraints.

  - **Camp 1 prediction**: Any such extension is either arbitrary (because non-unique) or violates desirable properties (like linearity). Therefore, it is not a good foundation.

  - **Camp 2 prediction**: We can define an extension by fixing the natural order as the canonical one. This is non-arbitrary because it reflects the structure of the game. Alternatively, we can use a set of principles (like dominance and natural order) to guide decisions.

  **Crux (b) for D4: Is such an extension necessary for a complete decision theory?**

  - **Concrete Case**: Consider an agent facing a choice between the Pasadena game and a sure $0. Without an extension, standard EUT says both are undefined. With the weak expectation (ln2), the agent would choose Pasadena over $0.

  - **Camp 1 prediction**: Not necessary. The agent should avoid games with undefined expectations. The extension would add unnecessary complexity and arbitrariness.

  - **Camp 2 prediction**: Necessary. Without it, we cannot model rational choices in these cases. The weak expectation (or dominance) provides a clear answer.

  ## Verbal Dispute

  We note that part of the dispute might be verbal:

  - **Verbal Aspect**: The term "expected value" is defined in standard EUT as requiring absolute convergence. Camp 1 insists on this strict definition. Camp 2 sometimes uses "expected value" to refer to the natural order sum (weak expectation) or to a generalized concept. Therefore, when Camp 2 says "expected value is ln2", they are using a different definition.

  - **Why it matters**: Without clarifying the terminology, the two camps talk past each other. Camp 2 argues that we need to extend the concept of expected value, while Camp 1 says that by the current definition it is undefined and that is the end of the story.

  ## Conclusion

  The joint statement above and the disagreements table with cruxes clarify the common ground and the exact points of divergence. We hope this will guide future research and discussion.
answer: |-
  ### Joint Statement: Adversarial Collaboration on the Pasadena Game and Decision Theory  

  **Preamble**  
  We, representatives of two perspectives in decision theory, agree on core mathematical facts about the Pasadena and Altadena games but disagree on their implications for rational choice. Below, we outline points of agreement, residual disagreements, and testable cruxes to resolve the deadlock.  

  ---

  ### 1. Agreed Claims  
  Both camps endorse the following substantive claims:  

  1. **Game Mechanics**:  
     - The Pasadena game pays \((-1)^{n-1} \cdot 2^n / n\) dollars when the first heads occurs on toss \(n\) of a fair coin.  
     - The Altadena game pays \(1 + (-1)^{n-1} \cdot 2^n / n\) dollars in the same states, strictly dominating Pasadena.  

  2. **Convergence Properties**:  
     - The expected value series for Pasadena, summed in the natural order (by \(n\)), converges conditionally to \(\ln 2 \approx \$0.693\).  
     - The series is not absolutely convergent: \(\sum_{n=1}^{\infty} \left| (-1)^{n-1} \cdot 2^n / n \right|\) diverges.  
     - By the Riemann rearrangement theorem, rearranging the series can yield any real number or diverge.  

  3. **Formal Undefinedness in Standard Expected Utility Theory (EUT)**:  
     - Standard EUT defines expected value only for absolutely convergent series. Since Pasadena (and Altadena) lacks absolute convergence, it has no well-defined expected value in this framework.  
     - This undefinedness is a mathematical property of the series, not an oversight in calculation.  

  4. **Dominance Principle Applies**:  
     - Altadena strictly dominates Pasadena: it pays exactly \$1 more in every state.  
     - All rational agents must prefer Altadena over Pasadena, irrespective of undefined expectations.  

  5. **Limitations of Rearrangement**:  
     - While rearrangements can make Pasadena’s partial sums exceed Altadena’s, these are mathematical artifacts without decision-theoretic significance.  
     - No rational agent should use rearrangements to violate dominance (e.g., prefer Pasadena over Altadena).  

  6. **Altadena’s Expectation is Similarly Undefined**:  
     - Adding \$1 to Pasadena does not resolve absolute divergence. Altadena’s expectation is also undefined in standard EUT.  

  7. **The Core Problem**:  
     - Standard EUT cannot explain *why* rational agents prefer Altadena, as it lacks tools to compare undefined expectations. This is the "gap" exposed by the games.  

  ---

  ### 2. Disagreements Table  
  The table below outlines unresolved issues. Each side’s position is stated neutrally, and cruxes identify sub-questions that could resolve disagreements.  

  | Issue | Camp 1 Position ("Standard EUT is Complete") | Camp 2 Position ("EUT Needs Extension") | Cruxes (Settling one would move at least one side) |  
  |-------|----------------------------------------------|------------------------------------------|---------------------------------------------------|  
  | **Meaning of "Undefined Expected Value"** | "Undefined" means the game is incomparable under EUT. Rational agents should avoid it or use non-EUT principles (e.g., dominance) *outside* the theory. | "Undefined" signals a flaw in EUT’s scope. Rational agents need a *formal extension* (e.g., weak expectations, dominance axioms) to rank such games *within* decision theory. | (C1) Can rational agents consistently rank games with undefined expectations *without* extending EUT?<br>(C2) Does "undefined" imply incomparability or merely require new tools? |  
  | **Role of Conditional Convergence** | Conditional convergence is a mathematical curiosity irrelevant to rationality. The natural order (\(n\)) is the only physically salient ordering; rearrangements are artificial. | Conditional convergence reveals EUT’s fragility. The natural order is arbitrary without additional principles; rearrangements force us to confront the need for "summation rules." | (C3) Is the natural order inherently privileged for computing expectations?<br>(C4) Does conditional convergence inherently prevent rational choice? |  
  | **Necessity of New Principles** | Dominance suffices as an external principle. No EUT extension is needed; undefined cases are pathological outliers. | Dominance must be integrated into EUT via axioms (e.g., dominance-respecting expectations) to handle non-absolutely convergent cases routinely. | (C5) Can dominance alone resolve *all* rational choices involving undefined expectations?<br>(C6) Is there a consistent extension of EUT for conditionally convergent games? |  
  | **What Rational Agents Owe to Each Other** | Agents need not assign *any* value to Pasadena; indecision/avoidance is rational. | Agents must assign a value (e.g., \(\ln 2\) via natural order) to justify dominance; indeterminacy is irrational. | (C7) Must rational agents assign a definite value to Pasadena?<br>(C8) Does rejecting Pasadena entail rejecting *all* games with undefined expectations? |  

  ---

  ### 3. Crux Analysis  
  For each crux, we provide a shared reference point and predictions. Verbal disputes are flagged where terminology drives disagreement.  

  - **Crux C1: Can rational agents consistently rank games with undefined expectations *without* extending EUT?**  
    - **Concrete Case**: Choose between Pasadena and a known-\$0 game (both undefined).  
    - **Camp 1 Predicts**: Rational agents may avoid both or be indifferent; no EUT extension is needed.  
    - **Camp 2 Predicts**: Agents must prefer one (likely Pasadena via \(\ln 2\)), revealing EUT’s inadequacy.  
    - **Shared Bearing**: Axiomatic derivations of dominance (e.g., Savage’s axioms) do not require defined expectations.  

  - **Crux C2: Does "undefined" imply incomparability or merely require new tools?**  
    - **Verbal Dispute**: Camp 1 views "undefined" as terminal; Camp 2 sees it as a prompt for innovation.  
    - **Concrete Case**: Altadena vs. Pasadena. Dominance forces a preference despite undefined expectations.  
    - **Camp 1 Predicts**: This is resolved externally; EUT remains untouched.  
    - **Camp 2 Predicts**: EUT must internalize this via a dominance axiom.  
    - **Shared Bearing**: Standard EUT handles dominance *when expectations exist*; here, it does not.  

  - **Crux C3: Is the natural order inherently privileged?**  
    - **Formal Result**: The natural order \(n\) corresponds to the game’s causal structure (sequential coin flips).  
    - **Camp 1 Predicts**: Deviations (e.g., rearranged summations) are irrelevant to rational choice.  
    - **Camp 2 Predicts**: Without absolute convergence, *no* order is privileged without further principles.  
    - **Testable Implication**: If states are permuted non-causally (e.g., payoffs shuffled randomly), Camp 2 expects preferences to change; Camp 1 does not.  

  - **Crux C4: Does conditional convergence inherently prevent rational choice?**  
    - **Concrete Case**: A game with partial sums bounded in absolute value but conditionally convergent (e.g., a \(2^n/n\) variant with alternating signs).  
    - **Camp 1 Predicts**: All such games are incomparable under EUT; agents may default to dominance.  
    - **Camp 2 Predicts**: Agents can use natural-order expectations to choose.  
    - **Shared Bearing**: Psychological experiments (e.g., agent behavior in repeated plays) could test actual choice consistency.  

  - **Crux C5: Can dominance alone resolve *all* choices with undefined expectations?**  
    - **Concrete Case**: Pasadena vs. a non-dominated undefined game (e.g., "Avalanche game" with terms rearranged to sum to \(\infty\)).  
    - **Camp 1 Predicts**: Dominance suffices where applicable; else, agents are indifferent.  
    - **Camp 2 Predicts**: Without expectations, dominance is incomplete (e.g., cannot rank non-dominated undefined games).  
    - **Testable Implication**: Construct two undefined, non-dominated games. Camp 1 predicts uniform indifference; Camp 2 predicts inconsistent choices without extensions.  

  - **Crux C6: Is there a consistent extension of EUT for conditionally convergent games?**  
    - **Formal Result**: Weak expectations (natural-order limits) or signed-measure extensions exist but violate linearity or countable additivity.  
    - **Camp 1 Predicts**: Extensions are either arbitrary or break EUT coherence.  
    - **Camp 2 Predicts**: Linearity can be relaxed (e.g., for weak expectations) without practical harm.  
    - **Shared Bearing**: Whether such extensions violate Dutch book arguments.  

  - **Crux C7: Must rational agents assign a definite value to Pasadena?**  
    - **Concrete Case**: Betting markets for Pasadena payoffs.  
    - **Camp 1 Predicts**: No clear market price emerges; agents avoid trading.  
    - **Camp 2 Predicts**: Prices cluster near \(\ln 2\) in practice.  
    - **Testable Implication**: Empirical study of agent bids for Pasadena lotteries.  

  - **Crux C8: Does rejecting Pasadena entail rejecting *all* games with undefined expectations?**  
    - **Concrete Case**: A game with undefined expectation but strictly positive payoffs (e.g., \(2^n/n\) without alternating signs).  
    - **Camp 1 Predicts**: All undefined games are equally pathological; rational agents reject them.  
    - **Camp 2 Predicts**: Agents accept strictly positive games (via dominance over \$0), revealing nuance.  
    - **Shared Bearing**: Whether "undefined but nonnegative" games exist and how agents treat them.  

  ---

  **Conclusion**  
  We commit to designing experiments (e.g., agent behavior studies) and formal work (e.g., consistency of weak expectations) to resolve the cruxes above. Residual disagreements hinge on testable claims about rationality, not mathematics.
