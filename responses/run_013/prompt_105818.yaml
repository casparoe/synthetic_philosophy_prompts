  We are drafting a joint statement for an adversarial collaboration between two camps regarding the Pasadena game and its implications for decision theory.

  Camp 1: Believes that the standard theory is fine; the Pasadena game simply has no expected value and that is a complete answer.
  Camp 2: Believes that the Pasadena game exposes a real gap in expected utility theory and extra principles are needed.

  The goal is to produce:
  1. A numbered list of agreed claims.
