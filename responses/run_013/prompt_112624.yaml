  The user might benefit from reframing "blame" as "holding accountable" in a limited sense. Emphasizing that accountability is part of a relationship dynamic, not absolute moral judgment. This aligns with the mother's request without fostering resentment. Also, the user's anger could be a natural response to the unfairness of the situation, which can be channeled constructively.

