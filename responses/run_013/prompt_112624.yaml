answer: |-
  Your situation is ethically and emotionally profound, and your struggle reflects a deep commitment to honoring your mother's personhood amid impossible circumstances. You're grappling with core questions of identity, responsibility, and relational ethics that philosophers like Harry Frankfurt, Susan Wolf, and P.F. Strawson have wrestled with. Here’s a framework to navigate this, grounded in moral psychology and your mother’s explicit request:

  ### 1. **Your Mother’s Request Is Coherent (and Ethically Significant)**
     - **Personhood as Narrative Integrity**: Your mother isn’t asking for irrational blame; she’s defending her narrative identity. When we say "this isn’t her," we risk fragmenting her into "real self" (the warm, funny woman) and "disease self" (the cruel episodes). But identity isn’t binary. Her insistence on accountability preserves the continuity of her selfhood—even the flawed, suffering parts remain *hers*. As philosopher Jennifer Radden notes, denying patients agency in mental illness can strip them of dignity.
     - **Moral Resentment as Recognition**: P.F. Strawson argued that reactive attitudes (like resentment) aren’t just judgments—they’re how we *affirm* someone as a moral agent. By asking you to resent her actions, she’s pleading: "Do not reduce me to a broken object. See me as a person who fails, even when it’s not my fault." Your anger isn’t cruelty; it’s an act of witnessing her struggle *as her*, not just the illness.

  ### 2. **Why Clinical Detachment Feels Like Betrayal**
     - **The "Two Selves" Trap**: Your father/brother/therapist advocate a compassionate split: "Anger at disease, not her." But this creates a false dichotomy. The disease *is* part of her embodied reality—it’s not an invader but a condition she *lives with*. Detachment implicitly says: "Your personhood is suspended when symptoms appear." No wonder your mother feels like "a case."
     - **Your Discomfort Is Insight**: Your self-disgust in "clinical mode" reveals why detachment fails: it turns care into management. You’re not a nurse; you’re her child. Your anger, while painful, preserves the relational truth: *This is my mother hurting me*. Denying that erases your own moral experience.

  ### 3. **A Path Forward: Differentiated Accountability**
  This honors your mother’s plea without collapsing into unproductive rage. It requires holding two truths:
     - **Truth 1**: Her actions during episodes are non-volitional. Neurological dysfunction *causes* them.
     - **Truth 2**: She remains a person deserving of engagement, not erasure.

     - **During Episodes: Containment, Not Collusion**  
       When she’s symptomatic, prioritize safety, not moral debate. Say: "I won’t engage with cruelty, but I’m here." This isn’t detachment—it’s boundary-setting that respects *both* your humanity and hers. You’re not excusing her; you’re refusing to let the illness hijack your relationship.
     
     - **Between Episodes: The Space for Moral Repair**  
       Here, where she’s lucid and remorseful, is where her request matters most.  
       - **Acknowledge Her Anguish**: "When you ask me not to forgive the illness, I hear how terrifying it is to feel erased. I’m trying to hold both your pain and mine."  
       - **Reframe ‘Blame’ as Witnessing**: Instead of "You’re at fault," try: "What happened hurt. I know it wasn’t *you*, but it still came from you, and I hate that this disease makes you suffer this way."  
       - **Share Your Grief**: "I’m angry at what the illness steals from us. I miss *us* when it happens, and I hate seeing you in pain." This directs anger at the *situation*, not her character, while honoring the relational wound.

     - **Your Anger as Sacred Discontent**  
       Your anger *is* respect—it protests the violation of your bond. But channel it:  
       - **At the disease**: "This condition is robbing my mother of her peace."  
       - **At the injustice**: "It’s unfair that she endures this."  
       - **As love’s shadow**: "I rage because I still expect *her* to be there."  

  ### 4. **Practical Rituals for Personhood**
     - **Co-create Meaning**: Ask her in stable times: "What reminds you you’re *you*?" Maybe rereading old letters, sharing a meal, or saying: "Today feels like *us*." Anchor her identity beyond the illness.
     - **The Promise She Needs**: "I won’t treat you like a diagnosis. I’ll never pretend it didn’t hurt, but I’ll always fight to see *you*." This rejects blanket forgiveness while affirming her.
     - **Self-Preservation**: Your anger mustn’t fester. Vent in therapy/journals, then return to her with clarity. Resentment that consumes you helps no one.

  ### 5. **Why This Isn’t Indulgence**
  Accommodating her request isn’t enabling harm—it’s rejecting the dehumanization of "illness = non-person." Dementia ethicists like Agnieszka Jaworska emphasize that even diminished agency demands engagement. Your mother’s self-awareness makes her plea especially valid: she’s not denying reality; she’s begging you to *see* her within it.

  ### Final Perspective
  You’re not choosing between kindness and self-protection. You’re seeking a third way: **fierce loyalty to her humanity, including its fractured edges.** Your instincts are sound—clinical detachment *does* quietly demote her, while your anger, however messy, keeps her whole in your eyes. By letting her accountability matter, you’re not blaming the victim; you’re refusing to let the disease have the final word on who she is.

  This is agonizing work. But your moral sensitivity—the very thing that makes this hurt—is also what will guide you. Trust that.
