answer: |-
  ## The Airport Bar Test
  *(Setting: Generic airport sports bar, 10:30 PM. Vera, mid-40s, nursing sparkling water, taps her pen rhythmically on a napkin. Osei, late 30s, biologist, picks at a dry-looking croissant. Departure boards flicker overhead.)*

  **Vera:** ...so the core worry remains. If "natural selection" boils down to "the traits that proliferate are the traits that proliferate," where’s the testable content? It feels like a framework for *interpreting* outcomes, not predicting them. Like explaining why a rock fell by invoking "gravitational tendency." Post-hoc, untestable.

  **Osei:** (Swallowing a dry bite, grimacing) Okay, that’s the caricature, Vera. No serious biologist operates that way. We don’t just point to survivors and shrug. We build *models*. We quantify differential reproduction linked to *specific* traits in *specific* environments. We measure fitness costs and benefits independently. Look at antibiotic resistance: we predict *in advance* resistance alleles will rise *only* in antibiotic-laden environments. We can calculate the selection coefficient. If it doesn’t rise as predicted under those specific conditions? Hypothesis falsified.

  **Vera:** Fine, fine. But that prediction hinges entirely on your independent characterization of the *environment* – the presence and concentration of the antibiotic – and your *assumption* about the trait’s effect – resistance conferring a survival advantage *in that specific context*. Change those auxiliary assumptions, and your "prediction" evaporates. The *principle* of selection – "advantageous traits spread" – isn’t being tested; your specific ecological story is. If resistance *didn’t* spread as predicted, you wouldn’t abandon selection. You’d question the antibiotic concentration, the presence of other stressors, the genetic background, measurement error…

  **Osei:** (Leaning forward) Exactly! But that’s not a special flaw of evolutionary biology, Vera, that’s *all* science. Newtonian gravity. You predict the apple’s fall. But if it floats, you don’t ditch gravity instantly. You check for strings, magnets, air currents – your auxiliary hypotheses about the setup! The Duhem-Quine problem bites everyone. Demanding that the *core principle* of selection be falsifiable *in isolation* is setting an impossible standard *no* scientific theory meets.

  **Vera:** (Sips water slowly) Granted. Duhem-Quine is universal. But here’s the rub. In physics, the core principle *does* heavy predictive lifting. Gravity tells me *how* things accelerate towards each other. Electromagnetism tells me *how* charges interact. Selection tells me… variants that leave more offspring leave more offspring. *How*? Through differential survival/reproduction *driven by* specific trait-environment interactions! The *testable* part, the part doing the work in your antibiotic example, is the ecology and genetics. The *principle* feels like a logical consequence of heritable variation and differential reproduction – which we *observe* – rather than a falsifiable *driver*.

  **Osei:** Wait, that’s too stark. Let me propose a test – call it the swapped-environment test. We take a population with a trait we *hypothesize* is adaptive under Condition A. We predict: in Environment A, trait frequency increases; in a swapped Environment B – where we’ve independently characterized that the trait is *costly*, say, or a rival variant has a higher payoff – frequency decreases. That prediction can fail spectacularly. If the trait frequency skyrockets in B despite our independent characterization showing it *should* be costly? Our selection hypothesis for A, *and* our understanding of the costs in B, gets a serious challenge.

  **Vera:** (Nods slowly, pen tapping resumes) I see the structure. But Osei, *what* is falsified if your prediction in Environment B fails? It’s *not* the principle "selection happens." It’s your specific auxiliary claims: your characterization of the trait’s *cost* in B, your understanding of the rival variant’s *payoff*, your assumptions about gene flow, genetic constraints… perhaps even your initial hypothesis about why it was adaptive in A! The core principle of selection remains untouched. It’s the *ecological and genetic details* carrying the testable burden. Selection itself seems like the *framework* within which those details make testable predictions, not the tested entity.

  **Osei:** (Stabs his straw wrapper) But Vera, that framework *is essential*. It tells us *what kind* of auxiliary hypotheses to build! It directs us to look for fitness differentials linked to traits in environments. Without the principle, we’re just cataloguing correlations. The principle guides the construction of testable models. The *mechanism* – differential reproduction tied to heritable traits – *is* testable via those models. We see it in real-time in labs, in the field with rapid evolution cases.

  **Vera:** Ah, but now you’ve shifted ground subtly. You’re talking about "selection-as-mechanism" – the observable process of differential reproduction tied to specific traits. *That* I grant is empirically testable. We can observe it, measure it, run experiments on it. But "selection-as-universal-principle" – the abstract claim that this is *the* primary driver of evolutionary change, shaping adaptations – that feels different. It’s a metaphysical commitment that guides research, telling you to *look* for adaptive explanations, to interpret the world through that lens. Popper’s original worry, before he softened it. Does the *principle itself*, distinct from the myriad specific mechanisms, actually *do* falsifiable work? Or is it the engine that powers the testable models *about* specific mechanisms?

  **Osei:** (Pushes croissant away, sighs) It’s the engine. And a damn powerful one. Without that commitment – however broad – we wouldn’t have built the models that *are* testable. We wouldn’t ask the questions that lead to falsifiable predictions. Is it testable *in splendid isolation*? No. But neither is the principle of conservation of energy. We test it *through* specific applications.

  **Vera:** Precisely my point about physics. Conservation of energy *is* testable through specific applications *because* it makes quantitative claims about state changes. It *constrains* possible outcomes tightly. Does the abstract principle "selection shapes adaptations" constrain outcomes *without* the auxiliary details? Or can *any* outcome be explained *post hoc* by invoking unobserved constraints, changing environments, pleiotropy, or just… drift? Isn’t that the legitimate complaint Gould and Lewontin had? Much storytelling *is* untestable. My field is guilty too, often.

  **Osei:** (Concedes with a small wave) Touché. Guilty as charged. Too much armchair adaptationism. Bad science happens. But the *good* science – the predictive models, the experimental evolution, the comparative tests – uses the principle to generate genuinely risky predictions *within* specific systems. The swapped-environment test *is* a real test of a *selectionist hypothesis* in context.

  **Vera:** Okay, let me grant that. Selection-as-mechanism-in-specific-contexts is testable via models incorporating ecology and genetics, using the swapped-environment test or similar. But then, Osei… what work is the *universal principle* doing that isn’t already done by the commitment to studying heritable variation and differential reproduction as observable phenomena? Is "Natural Selection" as a grand theory distinct from the sum of its testable mechanistic instances? Or is it just a label for a successful metaphysical research program – a powerful heuristic to look for adaptation – while the *science* happens in the messy details of specific models and tests?

  *(Osei opens his mouth, then closes it. He glances at the departure board flashing 'FINAL BOARDING'. Vera watches him, waiting. The hum of the bar fills the pause. He doesn't reach for his bag just yet.)*

  **Osei:** ...That distinction. Between the universal principle and the specific mechanisms. Does it even matter, practically? If the program generates testable science about how life changes...

  **Vera:** (Quietly) Does it? Or does it sometimes just generate stories? The question is what we call a *scientific theory*.

  *(Osei’s phone buzzes with a gate alert. He looks at it, then back at Vera. The conversation hangs, unresolved, in the stale airport air.)*

