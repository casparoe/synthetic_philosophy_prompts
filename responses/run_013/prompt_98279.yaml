answer: |-
  Below is a constructed case meeting all specifications, followed by a systematic analysis. The life avoids speculative elements and centers on a realistic, recognizable pursuit.

  ---

  ### **The Case: Dr. Elena Vasquez, Humanitarian Epidemiologist**
  Elena is a brilliant epidemiologist who dedicates her life to eradicating drug-resistant tuberculosis (TB) in marginalized communities with limited healthcare access. She spends 30 years working in remote, high-burden regions (e.g., Siberian prisons, Mozambican mining towns, or Papua New Guinean highlands). Her work involves grueling field surveys, hazardous travel, chronic underfunding, bureaucratic obstruction, and witnessing extreme suffering. She contracts drug-resistant TB twice (surviving with permanent lung damage), endures sleep deprivation, malnutrition-level stress, and constant anxiety about outbreaks. She forgoes marriage, parenthood, financial security, and leisure. Yet:  
  - **Objective-List Assets**: She pioneers life-saving treatment protocols adopted by the WHO, gains profound scientific knowledge, builds deep, trusting relationships with communities and local health workers, and autonomously chooses this path despite alternatives.  
  - **Desire-Satisfaction Assets**: From adolescence, Elena forms a stable, informed desire to "alleviate preventable suffering in the world's most neglected populations." She fulfills this central desire: her work reduces TB mortality by 75% in her regions. Minor desires (e.g., comfort, safety) are frustrated, but her core life-project is achieved.  
  - **Hedonic Deficit**: Her daily experience is dominated by physical pain (chronic illness, exhaustion), acute anxiety (funding crises, preventable deaths), grief (losing patients and colleagues), and isolation. Moments of joy (e.g., a village declared TB-free) are fleeting and outweighed by persistent distress. The *hedonic balance is negative*: the pain intrinsic to her work exceeds pleasure.  

  **Entanglement Mechanism**: The pain is non-incidental. The achievements *require* immersion in high-risk zones; the knowledge *demands* confronting suffering firsthand; the relationships *are forged* through shared trauma; the desire *is only fulfilled* by enduring these conditions. Remove the pain, and the achievements/relationships/desire-fulfillment evaporate (e.g., a comfortable lab job wouldn’t satisfy her desire or build those bonds).  

  ---

  ### **Analysis**  
  1. **Verdicts & Derivations**:  
     - **Hedonism**: **Negative verdict** (life not worth living).  
       *Why*: Hedonism equates well-being with net pleasure (positive mental states minus negative ones). Elena’s life has a *negative net balance*: chronic pain/anxiety dominate fleeting joys.  
     - **Desire-Satisfaction**: **Positive verdict** (high well-being).  
       *Why*: Desire-satisfaction defines well-being as the fulfillment of informed, central desires. Elena’s core desire is met, and frustration of peripheral desires is irrelevant if the central one is satisfied.  
     - **Objective-List**: **Positive verdict** (high well-being).  
       *Why*: Objective-list theory holds that well-being requires plural goods (e.g., knowledge, achievement, relationships). Elena’s life exemplifies these, regardless of hedonic states.  

  2. **The Single Variable**:  
     The critical variable is **the relationship between felt experience and value-generating activities**. In this life, pain is *constitutive* of the goods that satisfy objective-list and desire-based criteria. Hedonism must reject the life *because* it prioritizes subjective experience, while the others accept it *because* they prioritize external goods or desire-fulfillment irrespective of affect.  

  3. **Fair Test or Rigged?**  
     **Fair test**. Entanglement ensures the theories evaluate *identical facts*, not separable components. Hedonism isn’t judging a "pain-additive" but the inseparable experiential texture of the value-generating acts. If the pain were incidental (e.g., Elena hates her work due to migraines unrelated to epidemiology), hedonism’s rejection would be trivial. Here, the pain is essential, forcing a genuine conflict.  

  4. **If Entanglement Removed**:  
     If Elena’s experience were "floated free" (e.g., she feels serene joy while achieving the same outcomes), the case collapses:  
     - Hedonism now approves (positive net pleasure).  
     - Objective-list and desire-satisfaction still approve (goods/desires unchanged).  
     - *Result*: All theories agree, eliminating the counterexample. This proves entanglement is necessary to isolate hedonism’s divergence.  

  5. **Strongest Hedonist Reply**:  
     A hedonist could argue that **Elena’s retrospective satisfaction** (e.g., pride in her legacy, meaning derived from suffering) constitutes a "higher-order pleasure" that offsets her pain. If dying, she might reflect: "This was deeply painful, but *worth it*," and this evaluative joy could tip the hedonic balance positive.  
     - **Cost to Experience-Machine Reply**: This move *undermines* the hedonist in the classic experience-machine argument. If retrospective satisfaction counts, the machine-life could also generate it (e.g., "I *feel* proud of my virtual achievements"), making hedonism more likely to endorse the machine. The hedonist must either:  
       - (a) Accept machine-lives (losing the anti-hedonist intuition), or  
       - (b) Insist *only* "veridical" higher-order pleasure counts, but this smuggles in non-hedonic criteria (truth, achievement), collapsing hedonism into hybrid theory.  

  6. **Desire-Satisfaction Theorist’s Emphasis**:  
     A desire-satisfaction theorist would press **the centrality and fulfillment of Elena’s desire**. They note that her pain is *instrumental* to desire-satisfaction: without enduring it, she couldn’t achieve her goal. This distinguishes her from someone with unfulfilled or irrational desires (e.g., a masochist who desires pain for its own sake but gains no satisfaction). Their approval rests *solely* on desire-fulfillment, indifferent to objective goods (achievement/knowledge) or hedonics.  

  ---

  ### **Conclusion**  
  This case successfully reverses the experience-machine intuition: hedonism *excludes* a life that desire-satisfaction and objective-list theories include, with pain intrinsically tied to value creation. It isolates hedonism’s commitment to *phenomenal experience* as the sole arbiter of well-being. The hedonist’s strongest reply risks conceding ground to the experience-machine, revealing a tension in pure hedonistic accounts. Meanwhile, desire-satisfaction and objective-list theories converge on approval but diverge radically in *why* (desire-fulfillment vs. objective goods). The case demonstrates that hedonism’s exclusion of "painful-but-meaningful" lives may be a feature, not a bug—but one that many find implausible.
