prompt: |-
  I am taking a graduate seminar on the historical Jesus, and I have been trying to sort out my own judgments about the criteria of authenticity without simply reciting the textbook list. The trouble is that when I apply the criteria to particular cases, my verdicts do not line up with any single criterion, and I suspect the real pattern is something like a cost-of-invention principle. I would like you to state the principle that best captures the following verdicts, to test it against the cases, and to say honestly which of my verdicts it cannot save.

  Here are my verdicts. First, a short aphorism about the kingdom's arrival is attested in two independent early sources, but it closely parallels a pre-Christian Jewish text; I judge it authentic. Second, a saying that would have embarrassed the early church because it shows Jesus ignorant of the timing of the end is attested only once, in a late source; I judge it authentic. Third, a saying that is dissimilar to both early Judaism and early Christian teaching appears only once in a source with a strong theological agenda; I judge it not authentic. Fourth, a saying is multiply attested, but the sources are literarily dependent on one another; I judge it not established. Fifth, a saying coheres beautifully with sayings I already accept, but it is attested once and has no embarrassing features; I judge it authentic with moderate confidence. Sixth, a saying is embarrassing to the early church and multiply attested, but it also fits a general Jewish apocalyptic expectation and could have been produced by a Jewish Christian prophet; I judge it authentic. Seventh, a saying is not embarrassing and not multiply attested, but its vocabulary and imagery are so idiosyncratic that a community invention seems unlikely; I judge it authentic. Eighth, a saying is theologically convenient, fits later Christology, and is attested in a late source; I judge it not authentic. Ninth, a saying is embarrassing to the early church, but the embarrassment is of a kind that a later community might have invented to make Jesus more human; I judge it not authentic. Tenth, a saying is attested in two sources, but one is a later source that likely knew the other, and the saying is also theologically convenient; I judge it not authentic.

  A colleague has proposed what she calls the Cost-of-Invention Test: a saying is authentic to the extent that the hypothesis that Jesus said it explains its presence in the tradition better than the hypothesis that it was invented, where embarrassment, independent multiple attestation, and idiosyncrasy lower the cost of the Jesus hypothesis, while theological convenience, source dependence, and the availability of a plausible community author raise the cost of the invention hypothesis. Please tell me whether that principle captures all ten verdicts, or whether a simpler principle would capture most of them at the cost of overturning one or two. If you propose a repaired version, state precisely what it says, identify the case that motivates each clause, and give its verdict on a case I have not listed: a saying that is embarrassing, multiply attested, and idiosyncratic, but also theologically convenient in a way that later Christians would have welcomed. Finally, I would like to know whether a principle of this sort could ever settle who the historical Jesus was, or whether it can only rank sayings by plausibility while leaving the larger portrait underdetermined.
reasoning: |-
  Okay, the user is in a graduate seminar on the historical Jesus and is grappling with the criteria of authenticity. They've listed ten specific verdicts on various sayings and want to test a "cost-of-invention" principle against them. The user also wants to know if such a principle can definitively settle historical Jesus questions or just rank plausibility.

  First, I need to analyze each of their ten verdicts to see how the proposed Cost-of-Invention Test holds up. The test suggests authenticity if the Jesus hypothesis explains the saying's presence better than invention, with factors like embarrassment or multiple attestation lowering the cost for Jesus, and theological convenience raising it for invention.

  Looking at verdict 1: A saying with multiple attestation but parallels a pre-Christian text. The user judges it authentic. The cost-of-invention test works here because multiple attestation lowers Jesus cost, and the parallel might not raise invention cost enough if it's not exact. 

  Verdict 2: A late-source saying showing Jesus' ignorance. User says authentic. Embarrassment strongly lowers Jesus cost here, outweighing the late source (which raises invention cost). Test captures this.

  Verdict 3: Dissimilar saying with theological agenda. User says not authentic. Dissimilarity would normally lower Jesus cost, but the theological agenda and single attestation raise invention cost significantly. The test might struggle here since dissimilarity usually favors authenticity, but the user rejects it. The test as stated doesn't explicitly handle "dissimilarity" as a factor. This is a problem case.

  Verdict 4: Multi-attested but dependent sources. User says not established. The test handles this well since source dependence raises invention cost, negating the multiple attestation benefit.

  Verdict 5: Coheres with accepted sayings but no embarrassment. User authentic with moderate confidence. Coherence isn't directly in the test. The test might not capture this well since no factors lowering Jesus cost. This reveals a gap.

  Verdict 6: Embarrassing, multi-attested, but fits Jewish expectation. User authentic. Embarrassment and multiple attestation lower Jesus cost. The Jewish expectation factor might raise invention cost (since community could invent it), but user still accepts it. Test captures it if we weight embarrassment and attestation higher.

  Verdict 7: Idiosyncratic saying. User authentic. Idiosyncrasy lowers invention cost (hard to fabricate), so test captures this.

  Verdict 8: Theologically convenient late saying. Not authentic. Test clearly captures with theological convenience and late source raising invention cost.

  Verdict 9: Embarrassing but possibly invented to humanize. Not authentic. Here embarrassment lowers Jesus cost, but user suspects invention. Test doesn't account for "strategic embarrassment" - a weakness.

  Verdict 10: Theologically convenient with source dependence. Not authentic. Test captures with both factors raising invention cost.

  The main issues are verdict 3 (dissimilarity not handled), verdict 5 (coherence missing), and verdict 9 (strategic embarrassment not accounted for). The test needs refinement.

  Proposing a repaired principle: "A saying is authentic if the Jesus hypothesis explains its presence more plausibly than community invention, considering: (A) Factors lowering Jesus hypothesis cost: embarrassment, multiple independent attestation, idiosyncrasy. (B) Factors raising invention hypothesis cost: theological convenience, source dependence, dissimilarity to Christianity/Judaism (making fabrication less likely). (C) Factors raising Jesus hypothesis cost or lowering invention cost: coherence with established sayings (raises Jesus cost slightly), strategic embarrassment (lowers invention cost), availability of plausible community author (lowers invention cost)."

  For the new test case: A saying that's embarrassing, multiply attested, idiosyncratic, but theologically convenient. The repaired principle would balance these - embarrassment and attestation strongly favor authenticity, idiosyncrasy makes invention harder, but theological convenience makes invention more plausible. Likely authentic due to strong positive factors outweighing convenience, but with caution.

  On whether this can settle who Jesus was: No, it only ranks sayings. The portrait remains underdetermined because authenticity of individual sayings doesn't resolve contradictions or gaps in the overall narrative. The principle helps build plausible sayings clusters but can't reconstruct a full biography.

  The user is clearly thinking deeply about methodological limitations. Their frustration with textbook criteria is evident. They need a framework that acknowledges complexity without being arbitrary. The cost-of-invention model is promising but requires nuanced weighting of factors. Their tenth case shows sophisticated suspicion of convenient theology - this critical instinct should be preserved in any principle.
answer: |-
  Based on your detailed verdicts and analysis, your colleague's **Cost-of-Invention Test** is a strong framework, but it requires refinement to fully capture your judgments. It struggles with cases involving **dissimilarity**, **coherence**, and **strategic embarrassment**. Below is a repaired principle, a test on your cases, an analysis of a new case, and reflections on its limitations.

  ### Repaired Cost-of-Invention Principle
  **Definition:** *A saying is authentic if the hypothesis that Jesus said it ("Jesus hypothesis") explains its presence in the tradition more plausibly than the hypothesis that it was invented by the early community ("invention hypothesis"). Authenticity increases when:*
  - **(A) Factors lowering the cost of the Jesus hypothesis:**  
    Embarrassment, multiple *independent* attestation, or idiosyncrasy (linguistic/thematic uniqueness).  
  - **(B) Factors raising the cost of the invention hypothesis:**  
    Dissimilarity to *both* early Judaism *and* early Christianity, lack of theological convenience, or absence of a plausible community author (e.g., prophet).  
  - **(C) Factors raising the cost of the Jesus hypothesis *or* lowering the cost of the invention hypothesis:**  
    Theological convenience, source dependence, coherence *alone*, or "strategic embarrassment" (embarrassment serving a later agenda).  

  **Key Repairs:**  
  1. **Explicitly includes dissimilarity** (B) as an invention cost-raiser (motivated by your *Case 3*).  
  2. **Demotes coherence** to a weak/neutral factor (C) (motivated by *Case 5*: coherence alone only yields "moderate confidence").  
  3. **Adds "strategic embarrassment"** (C) as lowering invention cost (motivated by *Case 9*: embarrassment fabricated for humanization).  

  ---

  ### Testing the Repaired Principle Against Your Verdicts
  | Your Case | Your Verdict | Repaired Principle’s Verdict | Consistency | Notes |
  |-----------|--------------|------------------------------|-------------|-------|
  | 1 | Authentic | ✅ **Authentic** | Yes | Multiple attestation (A) lowers Jesus cost; pre-Christian parallel doesn’t strongly raise invention cost. |
  | 2 | Authentic | ✅ **Authentic** | Yes | Embarrassment (A) sharply lowers Jesus cost; late source (C) raises invention cost but is outweighed. |
  | 3 | Not authentic | ✅ **Not authentic** | Yes | Dissimilarity (B) *raises* invention cost, but theological agenda + single attestation (C) *lower* invention cost significantly. |
  | 4 | Not established | ✅ **Not established** | Yes | Source dependence (C) negates multiple attestation; no other strong factors. |
  | 5 | Authentic (moderate) | ⚠️ **Ambiguous** | Partial | Coherence (C) is weak; no embarrassment/attestation/idiosyncrasy (A). Principle *could* accept but with lower confidence than you. |
  | 6 | Authentic | ✅ **Authentic** | Yes | Embarrassment + multiple attestation (A) strongly lower Jesus cost; apocalyptic fit *might* lower invention cost (C), but outweighed. |
  | 7 | Authentic | ✅ **Authentic** | Yes | Idiosyncrasy (A) lowers Jesus cost; no invention cost-lowering factors (C). |
  | 8 | Not authentic | ✅ **Not authentic** | Yes | Theological convenience + late source (C) strongly raise invention cost. |
  | 9 | Not authentic | ✅ **Not authentic** | Yes | "Strategic embarrassment" (C) lowers invention cost (community could invent it to humanize Jesus). |
  | 10 | Not authentic | ✅ **Not authentic** | Yes | Theological convenience + source dependence (C) dominate. |

  **Outcome:** The repaired principle captures **9/10 verdicts** (all except Case 5). Case 5 is the outlier because your verdict relies on coherence, which the principle explicitly demotes to a minor factor.  

  ---

  ### Testing the Repaired Principle on a New Case
  **The Case:** *A saying that is embarrassing, multiply attested, and idiosyncratic, but also theologically convenient in a way later Christians welcomed.*  
  - **Repaired Principle’s Verdict:** ✅ **Likely authentic**  
    - **Pro-authenticity factors:** Embarrassment (A), multiple attestation (A), and idiosyncrasy (A) *strongly* lower Jesus cost.  
    - **Anti-authenticity factors:** Theological convenience (C) raises invention cost, but it is outweighed by the combined weight of the positive factors.  
    - **Balance:** The saying’s presence is better explained by Jesus’ utterance (despite convenience) than by invention (which would require fabricating an embarrassing/idiosyncratic saying and spreading it widely).  

  ---

  ### Can This Principle "Settle" Who the Historical Jesus Was?  
  **No.** It can only **rank sayings by plausibility**, leaving the larger portrait **underdetermined**. Here’s why:  
  1. **Methodological Limits:**  
     - The principle assigns *probabilities*, not certainties. Contradictory authentic sayings (e.g., apocalyptic vs. wisdom sayings) cannot be resolved by this test alone.  
     - It focuses on *sayings*, ignoring actions, social context, or overall narrative coherence.  
  2. **Underdetermination of Portraits:**  
     - A "plausible" saying cluster (e.g., emphasizing apocalypticism) could support multiple interpretations (e.g., Jesus as prophet vs. revolutionary).  
     - The principle cannot adjudicate between *competing authentic sayings* (e.g., "Turn the other cheek" vs. "I bring not peace but a sword").  
  3. **Holistic Judgment Required:**  
     - Historical Jesus research requires synthesizing *patterns* from plausibly authentic material, cultural context, and sociological models—beyond atomistic saying evaluation.  
     - The principle is a tool for **data sifting**, not **portrait construction**.  

  ---

  ### Conclusion
  Your intuition about a "cost-of-invention" framework is astute. The **repaired principle** (incorporating dissimilarity, strategic embarrassment, and coherence’s limits) aligns with 90% of your judgments and handles complex cases better than traditional criteria. However, Case 5 reveals a tension: your moderate confidence in coherence-driven authenticity exceeds the principle’s skepticism. This suggests **coherence should be a secondary validator**, not a primary criterion.  

  **Final Recommendation:** Use this principle to *filter* sayings, but supplement it with:  
  - Analysis of Jesus’ *broader themes* (e.g., kingdom of God, ethics, identity).  
  - Consideration of *social/political context* (e.g., Roman occupation, Jewish renewal movements).  
  - Recognition that **no criterion** can overcome fragmentary evidence—historical reconstruction remains probabilistic and interpretive.  

  This approach honors your goal of moving beyond textbook lists while acknowledging the irreducible complexity of historical judgment.
