  Looking deeper, the user might be frustrated with the lack of movement in this debate. After two decades, they need fresh perspectives or pathways to break the stalemate. Their identity as an educator suggests they value clarity and effective teaching methods. They might also seek ways to present this debate more productively to students, avoiding circular arguments.

