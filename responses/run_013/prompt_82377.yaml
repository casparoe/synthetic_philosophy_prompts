prompt: |-
  I'm a backend engineer, no philosophy training, and I'm putting in an application to a small interdisciplinary fellowship that funds weird crossover projects — they want a one-page research proposal, call it 700 words, and I need help writing it. Here's my half-formed idea. I build planning agents for a living, so I think in terms of policies: a function from situations to actions, scored as a whole. That's apparently not how the philosophical literature sets up the "Death in Damascus" puzzle (Death predicts where you'll go and goes there, so if you stay in Damascus you die and if you flee to Aleppo you also die), which is usually wheeled out as a case where evidential decision theory says one thing and causal decision theory says another. I suspect the real disagreement is being mislocated. My hunch is that the interesting question isn't which single act gets recommended, it's whether the unit of evaluation should be the act or the policy, and whether the requirement that the theory output a choice that still looks right once the agent predicts its own choice — the stability or self-ratification thing — can actually be derived from something, or whether it's just a patch people bolt on when their theory starts looping. Turn this into a proposal. I want: the question stated so it has a determinate answer, why the existing answers leave it open, what I'd do month by month over maybe four months (I can write code, so simulating predictor/agent setups is on the table — tell me straight if that's a waste of time here), what a result would look like versus what would count as the project failing, and an honest read on whether this is too much for one semester. Don't give me a reading list or citations, I'll fill those in myself later — just refer to positions and arguments and define terms as you go. And please keep what's actually settled in this area separate from what's genuinely contested among people who know it; I don't want a contested line sold to me as the consensus, and if my hunch turns out to be a worse version of something already standard, just say that.
