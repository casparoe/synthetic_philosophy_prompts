  Structuring the proposal: Start with a title that combines CS and philosophy. The research question must be precise: whether policy evaluation resolves the puzzle better than act-focused theories and if stability requirements are derivable. Contrast EDT/CDT's act-centric views with the policy approach. Highlight the gap—existing theories don't formally compare units of evaluation.

