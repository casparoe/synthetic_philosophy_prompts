  Overall, the proposal should leverage their engineering skills while grounding in decision theory. Balancing technical rigor with philosophical depth is key. Make sure to validate their innovative angle and provide clear milestones to structure their limited time.
answer: |-
  Here’s a focused, one-page proposal draft leveraging your engineering perspective. It avoids jargon, defines terms contextually, and stays honest about gaps:

  ---

  **Proposal: Policy Stability as the Foundation of Decision Theory**  
  **Investigating Unit-of-Evaluation in Predictive Dilemmas**

  ### Core Research Question
  *Can the requirement for "stable" decisions (where an agent’s predicted choice aligns with its actual choice) be derived from first principles by shifting the unit of evaluation from individual acts to holistic policies, and does this resolve paradoxes like Death in Damascus more cleanly than existing decision theories?*

  ### Why Existing Answers Leave This Open
  Decision theory debates (e.g., Evidential vs. Causal Decision Theory - EDT vs. CDT) assume the fundamental unit being evaluated is a **single act** ("flee" or "stay").  
  - **EDT** chooses acts with the *best evidence* of good outcomes (e.g., "Don’t flee, because fleeing correlates with Death being nearby").  
  - **CDT** chooses acts with the *best causal effect* (e.g., "Flee, because *causing* yourself to be in Aleppo might evade Death").  
  Both struggle with **instability**: The agent’s prediction of its *own* act changes the situation. If Death predicts perfectly:  
  - EDT loops ("If I flee, that *evidences* Death is in Aleppo, so I shouldn’t flee... but if I stay, that evidences Death is here..." → No clear answer).  
  - CDT says "flee", but if the agent *knows* Death predicts perfectly, fleeing *causes* Death to go to Aleppo → the act fails upon reflection.  

  **The gap**: Theorists often "patch" instability by demanding **self-ratification** (the chosen act must remain best *after* you know you’ll choose it). But *why* is this required? Is it an axiom or derivable? Your hunch: Instability arises because evaluating *single acts* in isolation is flawed when the agent’s decision *process* is part of the world state. The fundamental unit should be a **policy** (a complete function mapping possible predictor announcements to actions), evaluated holistically for its expected outcome. Existing theories don’t formally compare act-based vs. policy-based evaluation in predictive dilemmas.

  ### Methodology & Timeline (4 Months)
  **Month 1: Formalization & Literature Grounding**  
  - Define formal models of agents and predictors:  
    - **Predictor Types:** Perfect (knows policy output), Imperfect (noisy), Limited (accesses partial state).  
    - **Agent Types:** Act-based (EDT, CDT), Policy-based (evaluates entire policy tree).  
  - Map core philosophical positions (EDT, CDT, ratificationism) onto these models. Identify settled ground (e.g., CDT avoids "smoking lesion" paradox, EDT handles Newcomb-like problems better) and contested claims about stability.

  **Month 2: Simulation Framework Development**  
  - Code a flexible simulator (Python/PyTorch) where:  
    - Predictors and agents interact over defined state spaces.  
    - Death in Damascus is the base scenario, extended to variations (e.g., partial self-prediction, multiple agents).  
    - Metrics: Stability (does agent "change its mind"?), Outcome success, Computational tractability.  
    *(Coding is **NOT** wasted time – it forces concrete definitions and reveals hidden assumptions.)*

  **Month 3: Policy-Centric Experimentation**  
  - Run simulations comparing:  
    1. Standard act-based EDT/CDT.  
    2. Policy-based agents:  
       - **Policy-EDT:** Score entire policy by total evidence it generates.  
       - **Policy-CDT:** Score entire policy by total causal effect.  
       - **Stability-Seeking:** Directly search for stable policies (where predicted act = chosen act).  
  - Test: Do policy-based agents naturally find stable solutions? Is self-ratification *derived* or still needed as an axiom?

  **Month 4: Analysis & Theory Synthesis**  
  - Identify conditions where policy evaluation resolves instability vs. where it fails.  
  - Formal proof sketch: *Can stability be derived as a necessary feature of optimal policies in self-referential settings?*  
  - Draft paper: Contrast policy vs. act as unit of evaluation; propose conditions for deriving stability.

  ### Expected Results & Success Criteria
  **Success:**  
  - A formal demonstration that policy-based evaluation:  
    a) Naturally produces stable decisions in Death-in-Damascus-type scenarios *without* ad-hoc ratification.  
    b) Reveals the "act-based vs. policy-based" distinction as the root of EDT/CDT disagreements.  
  - OR: Proof that stability *cannot* be fully derived even under policy evaluation (revealing deeper requirements).  
  - A simulation framework usable for testing novel decision scenarios.  

  **Failure:**  
  - Policy-based evaluation shows no clear advantage over patched act-based theories.  
  - No discernible difference between Policy-EDT and Policy-CDT outcomes.  
  - Stability remains fundamentally axiomatic, not derivable.  

  ### Feasibility Assessment
  **Achievable in 4 months? Yes, with focus.**  
  - **Strengths:** Your coding skill makes simulation tractable. A tightly scoped question (Death in Damascus + stability) avoids philosophical quicksand.  
  - **Risks:**  
    - Philosophical nuances (e.g., "What *is* a policy?") could consume time. *Mitigation:* Anchor definitions in your agent-design experience.  
    - Formalizing "deriving stability" is ambitious. *Mitigation:* Aim for evidence via simulation + a plausibility argument, not a full proof.  
    - **Crucial Honesty Check:** Your core idea (policy focus) isn't novel *per se* – some CDT variants (e.g., *Tickle Defense*) implicitly use policies, and ratificationism exists. **BUT** your angle – explicitly questioning the *unit of evaluation* and **empirically testing if stability emerges** without patches – is underexplored. If simulations show Policy-CDT *naturally* outputs stable, high-reward decisions where act-based CDT flails, that’s significant.  

  **Deliverable:** A paper + simulation code demonstrating whether policy-centric evaluation resolves decision instability and clarifies the EDT/CDT debate.

  ---

  **Key philosophy/terms defined contextually:**  
  - **Evidential Decision Theory (EDT):** Chooses acts that are the *best evidence* for desired outcomes.  
  - **Causal Decision Theory (CDT):** Chooses acts that *cause* the best outcomes.  
  - **Self-Ratification/Stability:** A chosen act must remain optimal *even after* the agent knows it will be chosen.  
  - **Unit of Evaluation:** The "thing" (single act vs. entire contingency plan/policy) being scored by the decision rule.  
  - **Settled:** CDT avoids certain "irrational" choices EDT makes (e.g., in the Smoking Lesion problem). EDT handles Newcomb's Paradox "better" intuitively. Instability in predictive dilemmas is a recognized problem.  
  - **Contested:** *Why* instability matters, whether ratification is fundamental or a patch, and the precise relationship between acts, policies, and causation/evidence.  

  This proposal leverages your strength (building agents) to tackle a conceptual knot in philosophy. It stays grounded by asking a binary question ("Can stability be derived?") and using simulation as empirical evidence. Go build it!
