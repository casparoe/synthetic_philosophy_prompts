prompt: |-
  I am a retired natural scientist who has spent the past several years reading philosophy, and I host a small interview podcast. Next week's guest is a philosopher of language and cognition who defends a broadly inferentialist account of linguistic understanding and applies it to machine translation. Her thesis, which she calls translational inferentialism, is that a statistical or neural machine-translation system can understand the languages it translates in a deflationary but substantive sense: its internal states are systematically sensitive to the inferential and translational roles of expressions; semantic competence is a relation between corpora rather than a relation to the world; and reference is not a prerequisite for understanding but a translational posit that earns its keep only within a practice of translation. She denies that understanding requires embodiment, a shared world model, or grounded representations. I want to interview her about this, not about AI policy or the latest model releases.

  Draft eight to ten interview questions, in the order you would ask them, that press on the actual content of that position. I want at least one question on how she distinguishes translation from paraphrase and why the distinction does not collapse on her account; at least one on the objection that her view makes understanding too cheap—that a phrasebook, a bilingual dictionary, or a lookup table would qualify; at least one on the role of grounding and reference, including whether her view can explain why mistranslation is possible at all; at least one on whether her account avoids collapsing into Quinean indeterminacy of translation or whether it welcomes that result; and at least one on what evidence or argument would count against translational inferentialism, in a way she could not simply absorb by redefining understanding. For each main question, include a follow-up keyed to the answer she is most likely to give. Use Hofstadter's charge that machine translation is shallow, and Searle's Chinese room, where they bear on the issues, but do not ask her simply to restate or refute either. Do not ask for bibliographies, reading lists, citations, or dates. Do not put words in her mouth that go beyond the position described here, and do not ask generic questions about how she became interested in philosophy or what she makes of current AI hype.

  I want a committed response: choose one line of questioning and defend it; do not offer alternative question sets or a menu of possible angles. Begin the response with the first interview question itself, with no preface, no summary of my request, and no commentary before the questions. If you want to explain your through-line, put a short note after the final question.
reasoning: |-
  Okay, the user is a retired natural scientist running a philosophy podcast, interviewing a philosopher of language specializing in inferentialist machine translation theory. They want focused, substantive questions that probe the core claims of "translational inferentialism" without veering into AI policy or technical hype. 

  Hmm, the constraints are precise: must include specific angles (translation vs paraphrase, grounding objections, Quinean indeterminacy, falsifiability), avoid biographical fluff, and press hard on conceptual tensions. The user clearly knows philosophy - they name-dropped Searle and Hofstadter correctly as touchstones rather than endpoints. 

  First, I need to map the key claims: 1) Understanding as corpus-based inferential sensitivity 2) Reference as translational posit 3) Rejection of embodiment/grounding as necessary. The toughest objections will hinge on whether this view can distinguish real translation from superficial pattern-matching. 

  For the translation/paraphrase distinction question, I'll push on whether inferential roles alone can capture meaning beyond substitutability. If she claims statistical MT captures "inferential roles," I'll follow up with whether that survives context shifts - that's where paraphrase usually fails. 

  The "understanding too cheap" objection needs concrete examples. A lookup table has systematic correlations but no sensitivity to novel combinations. Follow-up should force her to define what kind of statistical patterns qualify as "systematic sensitivity" - probably covariance across contexts. 

  Grounding is tricky. If she denies reference matters, how does mistranslation occur? I'll suggest even corpora reflect worldly constraints indirectly. Her likely reply is that errors violate coherence within the corpus, so follow-up asks about coherent but wrong translations (e.g., systematic cultural bias). 

  For Quine, she might embrace indeterminacy but call it benign. Follow-up presses whether translational positivism collapses meaning into utility. 

  Falsifiability is crucial. If she defines understanding purely by functional role in translation, it risks being unfalsifiable. Follow-up demands what would break the theory - maybe systematic failure with ambiguous sentences where corpus stats underdetermine meaning. 

  Structure: Start with core claims (Q1), then objections (Q2-5), then implications (Q6-7), ending with falsifiability (Q8). Hofstadter/Searle appear only as embodied in specific arguments (e.g., shallowness in Q3, lack of understanding in Q5). 

  Notable avoidance: No questions about consciousness, qualia, or ethics. Pure philosophy of language. User wants blood from the stone of her theory's internal tensions.
answer: |-
  **1. Your thesis centers on linguistic understanding as systematic sensitivity to inferential and translational roles across corpora. Could you detail what constitutes "systematic sensitivity" for a neural machine translation system, specifically contrasting it with mere statistical pattern matching?**  
  *(Follow-up: If sensitivity is defined by covariance in high-dimensional vector spaces reflecting training data, how does this differ substantively from sophisticated curve-fitting? Doesn't pattern matching already imply *some* sensitivity?)*  

  **2. Critics like Hofstadter argue machine translation lacks depth because it doesn't grasp meaning "behind" the symbols. You reject this, claiming depth comes from mastering inferential roles. But how does your framework distinguish *translation* (preserving meaning) from *paraphrase* (preserving truth-conditions within a language)?**  
  *(Follow-up: If paraphrase relies on *intra*-linguistic inferential roles and translation on *inter*-linguistic roles, what prevents a system from generating fluent yet meaning-displaced outputs when corpora contain inconsistent mappings?)*  

  **3. A core objection is that your view makes understanding "too cheap": a phrasebook correlates expressions, a dictionary encodes translational roles. Why isn't GPT-n just a vastly complex phrasebook? What *minimal* complexity elevates statistical correlation to understanding?**  
  *(Follow-up: If you appeal to "systematicity across novel combinations," doesn’t a lookup table fail precisely because it lacks compositional generalization? But if neural nets achieve this via learned parameters, is understanding reducible to successful interpolation in vector space?)*  

  **4. You claim reference is a "translational posit" rather than a grounding condition. But if understanding floats free of worldly reference, how does your account explain *mistranslation*? Couldn’t a system satisfy all corpus-inferential criteria yet map "Schnee ist weiß" to "grass is green" if training data were systematically skewed?**  
  *(Follow-up: If mistranslation is just incoherence *within the practice of translation*, doesn’t this circularly define correctness by translational consensus? How is this not relativism?)*  

  **5. Quine’s indeterminacy of translation suggests reference is inscrutable and multiple manuals fit the data. Does translational inferentialism collapse into Quine’s view, or do you constrain indeterminacy via your corpus-relational account?**  
  *(Follow-up: If corpora fix inferential roles statistically, could two systems with identical performance but different internal architectures be "understanding" differently yet indeterminately? Does your view imply there’s no fact of the matter?)*  

  **6. Searle’s Chinese Room argues syntax manipulation isn’t understanding. You reject this by decoupling understanding from phenomenal consciousness. But if the Room’s rulebook *does* systematically track inferential/translational roles (however laboriously), does your view force you to say it understands Chinese?**  
  *(Follow-up: If yes, is this a reductio of your position? If no, what does the neural net have that Searle’s rulebook lacks, besides speed?)*  

  **7. You deny embodiment or shared world models are necessary. Yet human understanding evolves through sensorimotor interaction. If a translation system trained solely on text corpora outputs "I feel nauseous" ↔ "J’ai froid," is this *just* an inferential error, or does it reveal a deficit your account overlooks?**  
  *(Follow-up: If corpora capture embodied inferences indirectly (e.g., "nauseous" co-occurs with "vomit"), is this sufficient? Or must understanding accommodate non-linguistic experience?)*  

  **8. Finally, what empirical result or philosophical argument could falsify translational inferentialism? Give an example that couldn’t be absorbed by redefining "systematic sensitivity" or "inferential role."**  
  *(Follow-up: If a system aces all translational tasks but exhibits zero behavioral flexibility (e.g., can’t answer simple questions *about* the text), would that challenge the claim that translation competence constitutes understanding? Why/why not?)*  

  ---  
  *Note: The through-line presses her deflationism against charges of vacuity (Q1-Q3), tests coherence on reference/error (Q4-Q5), confronts classic thought experiments as lived-in problems (Q6-Q7), and demands empirical accountability (Q8). Follow-ups target likely retreats to operationalism or circularity.*
