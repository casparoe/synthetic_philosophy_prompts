answer: |-
  ## The Hostage Taker: Knowledge Attribution When Attributor and Subject Stakes Diverge

  The Dosimeter Case isn't just a puzzle; it's an epistemic grenade lobbed into the heart of the contextualism vs. pragmatic encroachment debate. It forces us to confront the unsettling question: whose practical reality governs whether a belief counts as knowledge? Contextualism claims the attributor sets the standard; encroachment claims the subject's stakes alter the epistemic state itself. Nadia, Ravi, and Amina, sharing evidence but inhabiting radically different practical worlds, expose the fault lines between these views with brutal clarity. To resolve this, we must abandon the comforting symmetry of typical cases and grapple with the messy asymmetry where stakes diverge. I argue that contextualism, despite its challenges, provides the more coherent and defensible account, while encroachment founders on the principle of "No Borrowed Stakes."

  **(i) Nadia's Knowledge: A Shifting Target?**
  *   **Low-Stakes Nadia:** Based purely on her evidence (dosimeter reading below threshold), Nadia forms the belief "the room is safe." Her personal stakes are zero. **Contextualism:** If *Nadia* asks "Do I know?", her low-stakes context sets a low evidential standard. Given the reliable dosimeter and comfortable reading, she plausibly *does* know within her context. **Encroachment:** Since Nadia's stakes are low, her belief requires only moderate justification to count as knowledge. She likely knows.
  *   **If She Never Meets Ravi:** This changes nothing material about *Nadia's* situation or evidence. Both theories would maintain their initial verdict: she knows.
  *   **If Nadia Were Working There:** This dramatically increases *her* stakes. **Contextualism:** If Nadia *now* asks "Do I know?", her high-stakes context demands much stronger evidence (e.g., double-checking, calibration records, expert review). Her initial reading alone likely fails this higher bar; she *doesn't* know *in that high-stakes context*. **Encroachment:** Her increased stakes *directly* raise the epistemic standard her belief must meet. The same evidence that sufficed before now fails; she no longer knows, period.

  The core divergence emerges when we consider attributions *from other perspectives*.

  **(ii) Whose Context? Whose Truth?**
  *   **Nadia Attributing:** "I know the room is safe." Contextualism says this is true *in her low-stakes context*. Encroachment says it's true because her epistemic state meets the low standard *her* stakes demand.
  *   **Ravi Attributing:** "Nadia knew the room was safe." Contextualism says Ravi's high-stakes context sets a high standard. Nadia's evidence likely fails this standard *in Ravi's context*; Ravi's statement is false. Encroachment, however, insists knowledge depends *only* on the *subject's* (Nadia's) stakes. Since Nadia's stakes were low, Ravi's statement should be true, even if imprudent for him to act on! This is deeply counterintuitive. Ravi, facing life-altering risks, would surely deny Nadia "knew" in any sense relevant to *his* decision, regardless of her obliviousness.
  *   **Amina Attributing:** "Nadia did not know the room was safe." Contextualism readily explains this: Amina's high-stakes regulatory context sets an extremely high standard. Nadia's single reading fails it; Amina's statement is true *in her context*. Encroachment faces the same problem as with Ravi: Nadia's low stakes should mean she *did* know, making Amina's later attribution false. Yet Amina's conclusion seems correct given her responsibility and the catastrophic consequences of error.

  Contextualism treats "knows" as context-sensitive, so truth-value shifts with the attributor. Encroachment treats knowledge as a stable state determined solely by the subject's stakes and evidence, making attributor perspective irrelevant to truth (only to prudence). The Dosimeter Case reveals encroachment's glaring weakness: it forces attributors like Ravi and Amina to affirm "Nadia knew" when that knowledge claim is utterly disconnected from their own reality and the risks they face. This divorces the *truth* of "S knows P" from its *significance* for the attributor in a way that feels fundamentally mistaken.

  **(iii) No Borrowed Stakes: The Encroachment Trap**
  The principle **No Borrowed Stakes (NBS)** states: *A subject's belief cannot be upgraded or downgraded epistemically by practical facts belonging solely to other people, unknown to the subject.* This principle strikes me as compelling. Knowledge should be a relation between the subject and the world, mediated by evidence. How can Ravi's impending fatherhood, utterly unknown to Nadia, retroactively alter the epistemic status of *her* belief formed weeks earlier? It imbues knowledge with a kind of spooky action-at-a-distance, making Nadia's justification hostage to facts she couldn't possibly access or control.

  *   **Accepting NBS:** This devastates encroachment. If Ravi's stakes can't downgrade Nadia's knowledge, then encroachment must concede that Nadia *did* know (because *her* stakes were low), regardless of Ravi's situation. But this forces us into the counterintuitive position where Ravi must affirm "Nadia knew" even as he refuses to enter the room based on the same evidence. This suggests "knowledge" becomes practically inert in high-stakes third-party contexts. We need a different account for attributions – likely contextualism. The "ugliness" is real: a hybrid theory where first-person knowledge depends on subject stakes, but third-person attribution depends on attributor stakes.
  *   **Rejecting NBS (Encroachment's Move):** Encroachment must argue that the *objective practical importance* of being wrong, even if borne by others and unknown to the subject, *does* affect the epistemic status. Ravi's stakes make the cost of Nadia being wrong objectively high *for the situation*, thereby requiring more justification for *any* knowledge claim about the room's safety, regardless of who makes it or holds the belief. Knowledge isn't just subjective justification; it's inherently tied to the objective risks involved in being wrong about P.

  While rejecting NBS offers theoretical unity (knowledge is always subject to the *situational* stakes, not personal ones), it demands an implausible account of justification. Justification concerns the *reasonableness* of holding a belief given the evidence available. Nadia *was* justified in believing the room safe based on the dosimeter reading *given her awareness*. Tethering justification to *unknown* objective risks divorces it from the subject's rational perspective. It makes knowledge mysteriously sensitive to facts utterly external to the knower's cognitive state and evidence. How could Nadia rationally be expected to gather *more* evidence for a risk she had no reason to believe existed? Rejecting NBS doesn't just make knowledge hostage to unseen facts; it severs the essential link between justification and rational responsibility.

  **(iv) The Direction of Stakes: Dread vs. Desire**
  Does it matter if the high-stakes third party *wants* the proposition to be false (e.g., a neighbor hoping for contamination to sue)? Contextualism easily handles this: the attributor's stakes (high risk of being wrong) set the standard, regardless of *why* being wrong is costly. Amina's regulatory burden or the litigious neighbor's potential loss both make the cost of error high, demanding strong evidence for any knowledge attribution. The *direction* of desire doesn't lower the epistemic standard required to *avoid error*; the risk of a devastating false belief remains high.

  Encroachment faces a deeper puzzle. If knowledge requires sufficient justification to meet the *objective* practical demands of *the situation*, does a neighbor's *desire* for contamination create the same demand for certainty as Ravi's *dread* of it? Intuitively, no. Wishful thinking might make someone *more* likely to accept flimsy evidence *for* contamination, not less. But encroachment ties justification to the *stakes of being wrong*. The stakes for the neighbor are high if the room is *safe* (they lose their lawsuit); the stakes for Ravi are high if it's *unsafe* (health risks). Both situations carry a high cost for error about the truth of P. Therefore, encroachment should treat both symmetrically: high objective stakes, regardless of valence, raise the justification threshold for *anyone* to know P. The asymmetry lies in *bias* (wishful/fearful thinking affecting evidence gathering/assessment), not in the epistemic standard for knowledge itself. This, however, further highlights the strangeness of tying *Nadia's* justification to the neighbor's litigious desires – an outcome even less palatable than tying it to Ravi's dread.

  **Verdict: Contextualism Holds the Fort (Barely)**
  After wrestling with the Dosimeter Case, contextualism emerges as the less problematic solution, though it leaves us with epistemic vertigo. **Nadia *does* know the room is safe when she attributes it to herself, or when anyone else attributes it within a similarly low-stakes context. She *does not* know it (and her past self didn't "know" in a way relevant to that context) when Ravi, Amina, or the litigious neighbor attribute knowledge within their high-stakes contexts.** The truth of "Nadia knows P" shifts with the attributor's conversational context and practical situation.

  This verdict survives swapping who's asking. When Nadia asks, she gets a "yes" (low stakes). When Ravi asks (about Nadia), he gets a "no" (high stakes demand evidence Nadia lacked). When Amina asks (past tense), she gets a "no" (regulatory stakes demand near-certainty). The word "knows" is doing different work in each utterance. The alternative – encroachment's insistence that Nadia simply *knows*, period, due to her low stakes – forces Ravi and Amina into affirming a knowledge claim that is practically meaningless and potentially dangerous in their contexts. It violates the deep intuition that "S knows P" must carry action-guiding force *for the attributor* in their situation.

  The strongest encroachment argument – the unity of treating knowledge as always dependent on objective situational stakes – is powerful. Yet, it demands we accept that Nadia's epistemic state is magically altered by Ravi's unborn child or a neighbor's greed, facts entirely opaque to her. This sacrifices the core connection between justification and the subject's rational perspective on the altar of theoretical neatness. It makes knowledge hostage to the world's unseen contingencies in a way that robs the knower of epistemic agency.

  Contextualism's price is acknowledging that "knowledge" is fundamentally an attributional term, sensitive to the concerns of those using it. While this feels unsettlingly relativistic, the Dosimeter Case shows it better respects the role knowledge attributions play in our practical reasoning across diverse situations. Nadia's belief, formed on good evidence for her purposes, earns the label "knowledge" in her context. Ravi's refusal to grant her that knowledge in his context reflects not a metaphysical change in her past state, but the heightened demands *his* reality places on evidence before he will accept or act on such a claim. The stakes are sticky, but they stick to the attributor.
