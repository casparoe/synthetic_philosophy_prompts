answer: |-
  ### Preamble  
  **Core Claim:** Human agency (*virtù*) exists only in response to chaotic circumstance (*fortuna*). *Virtù* is adaptive skill—timely, effective, yet finite. *Fortuna* is the unforeseen chaos that demands response; no permanent victory is possible, only provisional mastery. The speaker’s tragic insight: failure stems not from lacking *virtù*, but from being unable to shed one’s nature when the times change.  

  **Vulnerability:** The speaker critiques coercive metaphors for *fortuna* (e.g., "seizing" fortune like a woman), yet still employs them, revealing his own entrapment in outdated modes. The poem must *show* this tension.  

  **Structural Logic:**  
  1. **Tercets 1–2:** *Fortuna* initiates chaos (river flood). *Virtù* responds (building dikes).  
  2. **Tercets 3–4:** Temporary success, but *fortuna*’s nature unchanged. Speaker’s flaw: his *virtù* is fixed, not fluid.  
  3. **Tercet 5–6:** Shift to gendered metaphor ("seizing" *fortuna*). Acknowledgment of its violence/shame.  
  4. **Tercet 7 + Final Line:** Coercion fails. Cut mid-action—no resolution, only exhaustion.  

  **Rhyme Chain:**  
  ABA (flood/good/blood) → BCB (good/blood/stood) → CDC (blood/stood/realm) → DED (stood/realm/sand) → EFE (realm/sand/hand) → FGF (sand/hand/planned) → GHG (hand/planned/grip) → HHH (planned/grip/unclasped).  
  *(Final quatrain: FGF + GH + HHH)*  

  **The Turn:** Tercet 5 pivots to the "woman" metaphor. Tercet 6 undercuts it ("ashamed," "snakes").  

  **Final Line:** Must halt mid-struggle ("grip unclasped"), denying closure.  

  ---

  ### The Poem  

  The sudden waters chew the quiet land,  
  Upending stones that marked the ancient good—  
  A rage no prudent hand could understand.  

  We answer with what skill and nerve we could:  
  Raise dikes where silt and ruin lately stood,  
  Divert the current’s hunger from our blood.  

  It holds—until the next rain overwhelms  
  The shoring, and the river takes the helms  
  Back to its old, indifferent, dark realm.  

  So must we build again, banked with new sand,  
  Knowing the work suits only this demand.  
  The man who shifts his nature with the land  

  Might stand beyond its mastery. But I  
  Am fixed—my art’s the grip, the tightened eye  
  That seizes what will not be seized. I try  

  To catch her hair like reins before she slips  
  (The old books say she yields to force), ashamed  
  When my own force makes snakes of her loose tips.  

  She laughs at walls. My will, too strictly framed,  
  Cannot unlearn the grip my fathers planned.  
  I wrestle her at dusk, my courage cramped—  

  And at the brink, my sweating fingers skip.  
  The bank gives way. The current takes the ship.  
  All my late strength is water in the grip  

  **unclasped.**  

  ---

  ### Line-by-Line Validation  
  1. **Fortuna as chaos:** "sudden waters," "rage no prudent hand could understand."  
  2. **Virtù as response:** "answer with what skill and nerve," "divert the current’s hunger."  
  3. **Temporality:** "It holds—until," "suits only this demand."  
  4. **Speaker’s flaw:** "I am fixed," "cannot unlearn the grip."  
  5. **Gendered metaphor critiqued:** "seizes what will not be seized," "ashamed," "snakes of her loose tips."  
  6. **No closure:** Ends mid-action ("grip unclasped").  
  7. **Form enacts argument:** Rhymes chain (ABA→BCB→CDC...); final cut interrupts GHGH pattern to HHH.  
  8. **Register:** Contemporary English, no archaisms. Breathable lines (caesuras: "We answer with what skill and nerve we could").  
  9. **Avoids slogans:** *Fortuna*/*virtù* never named; concepts embodied in river/work/seizure.  

  **Vulnerability Embodied:** The speaker uses the violent metaphor ("seizes," "wrestle") while marking its failure ("ashamed," "snakes," "grip unclasped"). His fixed nature ("my fathers planned") contrasts the adaptability he praises.
