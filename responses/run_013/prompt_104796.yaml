answer: |-
  ### Examination Question  
  **"In fiction, when a character is introduced solely through a bare list of properties (e.g., 'impatient, meticulous, estranged from her brother, lapsed botanist'), what binds these properties into a unified character rather than a disjointed set? Drawing on Bradley’s regress and theories of propositional unity, assess whether the *fictional* nature of the character blocks, intensifies, or transforms the regress. Evaluate whether standard solutions to the regress (e.g., primitive unity, unsaturated concepts, relations, or tropes) can resolve this problem for fictional entities, or whether fiction demands a fundamentally distinct account. Justify your reasoning without recourse to secondary literature."**  

  ---

  ### Model Answer (620 words)  
  The problem of unifying a fictional character’s properties echoes Bradley’s regress but is exacerbated by fiction’s lack of ontological grounding. Bradley’s regress arises because predication seemingly requires a relation (e.g., "impatience inheres in substance X"), but this relation itself must relate to the relata, generating an infinite chain. For a *real* person, substance theory halts this regress by positing a bearer that primitively unifies properties. Fiction, however, lacks such a substance: there is no "her" beyond the text. Consequently, the regress *persists* but morphs into a problem of *semiotic* rather than *metaphysical* unity.  

  Consider the list: "impatient, meticulous, etc." To assert these properties co-belong, we might posit a relation (R) binding them to a fictional subject (S). Yet, as Bradley notes, R must itself relate to S and the properties, inviting a new relation (R¹) to unify R with S, and so *ad infinitum*. Fiction cannot evade this through substance, so the regress reappears—but its stakes shift. The question becomes: what *semantic* or *narrative* mechanism prevents the properties from floating free?  

  Standard solutions face unique hurdles here. **Primitive unity** (the proposition "S is P" is irreducibly whole) struggles because fictional "wholes" are constructed incrementally by readers. A list lacks the syntactic glue of a proposition (e.g., "She is impatient" *asserts* unity; "impatient, meticulous..." does not). **Frege’s unsaturated concepts** (predicates as incomplete functions) might seem apt: "impatient" requires a subject-slot. But fiction’s subject is *itself* unsaturated—a bare "she" with no referent. If both subject and predicate are incomplete, their combination risks mutual instability, like two jigsaw tabs with no sockets.  

  **Relational theories** (e.g., Russell’s multiple relations) fare no better. Suppose we treat character-unity as a relation holding between properties. But what relates *this relation* to the list? A further relation reignites the regress. **Trope theory** (properties as particularised attributes) initially promises refuge: each property is a unique "impatience-trope" tied to a character. Yet tropes presuppose a bearer. If we treat the *character* as a "bundle" of tropes, the bundling relation (e.g., compresence) itself demands unification, reprising the regress.  

  Crucially, fiction’s resolution lies *outside* standard metaphysical escapes. The unity of fictional properties is **narratively constituted**. Unlike real objects, a character’s coherence emerges from *contextual constraints*:  
  1. **Anaphoric force**: "She" in subsequent sentences (e.g., "She forgot her keys") presupposes a single entity, retroactively binding the list.  
  2. **Genre conventions**: Readers accept disparate properties as unified because fiction operates under a "compact of coherence" where lists imply a latent subject.  
  3. **Teleological pressure**: Narrative anticipates future actions integrating properties (e.g., "meticulous" will manifest in plot events), creating provisional unity.  

  Here, Bradley’s regress is *pragmatically blocked* by the reader’s role as co-constructor. The text provides properties; the reader imposes unity via narrative expectation. This is not primitive unity but *emergent* unity—analogous to how scattered dots form a figure in a connect-the-drawing. Fiction thus demands a distinct account: unity arises from the *pragmatics of interpretation*, not ontology. Where metaphysics seeks a "substance," fiction supplies a *subject-position* filled by discourse. The regress dissolves because the chain stops at the reader’s constitutive act—no further "relation" is needed once narrative intentionality is engaged.  

  In sum, Bradley’s regress persists in fiction but is resolved narratively, not metaphysically. Standard solutions, designed for truth-apt propositions, stumble over fiction’s non-referential status. Fiction reveals that unity is often a product of use, not being.  

  ---  

