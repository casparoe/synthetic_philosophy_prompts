   So they will have to say for the second stage in Tree 1: choose X, and for Tree 2: choose Y.

   Then we point out that the second stage is the same in both trees, so how can you choose X in one and Y in the other?

   This reveals the contradiction.

   So for the activity, we use the following numerical example:

  **Pair A:**
  - A1: 3 tokens for sure.
  - A2: 80% chance of 3 tokens, 20% chance of 5 tokens.

  **Pair B:**
  - B1: 25% chance of 3 tokens, 75% chance of 0 tokens.
  - B2: 20% chance of 5 tokens, 80% chance of 0 tokens.

  **Two-stage representation:**

  Tree 1 (corresponds to Pair A):
  - Option A1: 3 tokens for sure. (no stages)
  - Option A2: 
     Stage 1: 80% chance you get 3 tokens (branch ends), 20% chance you go to Stage 2.
     Stage 2: choose between:
          X: 3 tokens for sure.
          Y: 5 tokens for sure.

  Tree 2 (corresponds to Pair B):
  - Option B1:
     Stage 1: 75% chance you get 0 tokens (branch ends), 25% chance you go to Stage 2.
     Stage 2: choose between:
          X: 3 tokens for sure.
          Y: 5 tokens for sure.
  - Option B2:
     Stage 1: 80% chance you get 0 tokens (branch ends), 20% chance you go to Stage 2.
     Stage 2: choose between:
          X: 3 tokens for sure.
          Y: 5 tokens for sure.

  Participants will see that the second stage is identical in both trees for the options that lead to it.

  In the activity:

  1. Participants first make choices for Pair A and Pair B privately.
  2. We tally and show the typical pattern: many choose A1 and B2.
  3. Then we introduce the two-stage trees for both pairs, drawn side by side, with the second-stage choice highlighted as identical.
  4. We then ask: "If you were to reach the second stage in Tree 1, what would you choose between X and Y?" and similarly for Tree 2.
     - For participants who chose A1 in Tree 1, we can ask: "If you had chosen A2 and then reached the second stage, what would you choose?" 
     - Similarly for B1/B2.

  We expect that those who chose A1 and B2 will want to choose X in Tree1's second stage and Y in Tree2's second stage, which is a contradiction.

  **Materials:**
  - Paper ballots for the initial choices (Pair A and Pair B).
  - A whiteboard or poster with the two decision trees drawn side by stage, with a common second-stage choice clearly marked as identical in both.
  - Tokens or course points. At the end, we can resolve one of the choices for a real small prize (e.g., a candy bar) for one randomly selected participant.

  **Minute-by-minute timeline:**

  - 0-5 min: Introduction to the activity. Explain that they will make choices between lotteries using tokens, and at the end, one participant will be chosen by lottery to win a real prize based on one of their choices. Distribute ballots for Pair A and Pair B. Ballots should be anonymous but have a unique identifier (e.g., a number) for later. [5 minutes]

  - 5-10 min: Collect the ballots and tally the results for Pair A and Pair B separately. Show the results (e.g., how many chose A1, how many A2; how many chose B1, how many B2). Point out the typical pattern (A1 and B2 being popular). [5 minutes]

  - 10-25 min: Present the two-stage tree for Pair A and for Pair B. Draw them side by day on the board. Explain how each lottery from the first part is represented in the tree. For example:
     - In Tree 1, if you choose A2, then with 80% chance you get 3 tokens immediately, and with 20% chance you face the second-stage choice between X (3 tokens) and Y (5 tokens).
     - In Tree 2, for option B1, with 75% chance you get 0, and with 25% chance you face the choice between X (3) and Y (5). For B2, with 80% chance you get 0, and with 20% chance you face the same choice. [15 minutes]

  - 25-40 min: Ask each participant to consider: "If you were to reach the second stage in Tree 1, what would you choose between X and Y?" and the same for Tree 2. Have them write down their choices for the second stage in each tree on a new ballot. [15 minutes]

  - 40-55 min: Collect and tally the second-stage choices. For each participant, compare their second-stage choice in Tree 1 and Tree 2. For those who chose both, they should be the same. But for participants who chose A1 and B2 in the first ballot, we expect to see them choose X in Tree1's second stage and Y in Tree2's second stage. Point out the inconsistency: the second stage is the same, so how can they choose differently? [15 minutes]

  - 55-75 min: Debrief and variant. [20 minutes]

  **Debrief:**
  - Map the initial choices: In Pair A, choosing A1 over A2 means that you prefer 3 tokens for sure over a lottery that is mostly 3 tokens with a chance of 5. This is often due to risk aversion when a sure thing is available.
  - In Pair B, there is no sure thing, and people often choose B2 (20% of 5) over B1 (25% of 3) because the difference in probability is small and the payoff is higher, or because they are risk-seeking for small probabilities.
  - In the two-stage representation, the independence axiom (or sure-thing principle) would require that your choice in the second stage should not depend on the first stage. In other words, your choice between X and Y should be the same in both trees.
  - The contradiction arises because the typical choices (A1 and B2) imply different second-stage choices in the two trees, violating the independence axiom.
  - We can then discuss: should they abandon the independence axiom or change their initial preferences?

  **Variant:**
  - To test whether it's the certainty effect or the shared branch, we can alter the pairs so that no option is certain.
  - New Pair A:
     A1: 95% chance of 3 tokens, 5% chance of 0.
     A2: 76% chance of 3 tokens, 19% chance of 5 tokens, 5% chance of 0. 
     (Note: 95% = 0.95, and for A2, we have shifted: originally it was 80% of 3 and 20% of 5. Now we have taken away 5% from both and given 0. So the ratios are preserved: the conditional probability given not the 5% is the same as before.)
  - New Pair B remains the same: because there was no certainty.
  - Then we do the same activity.

  **What will predictably go wrong:**
  - Participants might not understand the two-stage representation. To handle this, spend more time drawing the trees and use a few examples to show how the final outcomes are the same as in the one-stage lottery.
  - Some participants might not exhibit the Allais paradox. That's okay, but the activity will still show that for those who do, there is an inconsistency.
  - In the second-stage choice, participants might not realize that they are supposed to choose between X and Y without regard to the first stage. Emphasize that at the second stage, you are in that node and you only care about the choice at hand.

  **Frankly, the activity cannot:**
  - It can force the inconsistency into the open, but it cannot by itself show whether the axiom or their choices are what should give way. That is a matter for discussion and further reflection.

  This activity will make the independence axiom feel like a constraint because participants will see that their own choices violate it, and that they must either change their choices or live with the violation.
answer: |-
  ### Core Mechanic and Experience
  Participants confront a contradiction in their own choices across two logically equivalent two-stage decision trees, making the independence axiom feel like an inescapable consistency constraint rather than an abstract definition—by experiencing the violation firsthand when their preferred choices force them to give conflicting answers to the *exact same question* at the second stage.

  ---

  ### Setup, Prizes, and Materials
  - **Prizes (token-based, no real money):**  
    - **Small prize:** 1 token (e.g., "1 point")  
    - **Moderate prize:** 3 tokens  
    - **Large prize:** 5 tokens  
    - **Real prize (optional end-of-activity draw):** One $5 coffee gift card (redeemable if a participant’s token total wins a final lottery).  
  - **Probabilities for Allais Pairs:**  
    - **Pair 1 (Certainty Effect):**  
      - **Option C1:** Moderate prize for sure (3 tokens).  
      - **Option G1:** 80% chance of moderate prize (3 tokens), 20% chance of large prize (5 tokens).  
    - **Pair 2 (Probability Shift):**  
      - **Option C2:** 25% chance of moderate prize (3 tokens), 75% chance of nothing (0 tokens).  
      - **Option G2:** 20% chance of large prize (5 tokens), 80% chance of nothing (0 tokens).  
  - **Materials:**  
    - **Ballots:** Paper slips for private choices (Pair 1, Pair 2, and second-stage commitments).  
    - **Physical lottery booth:** A table with labeled boxes (C1, G1, C2, G2) for ballot collection; two dice/spinner for staged resolution.  
    - **Visuals:** Two poster-sized decision trees (Tree 1 for Pair 1, Tree 2 for Pair 2) drawn side-by-side, with identical second-stage nodes.  
    - **Tokens:** Poker chips or sticky notes representing prizes.  
    - **Tally board:** To display aggregate choices.  

  ---

  ### Minute-by-Minute Timeline (75 Minutes Total)
  #### **Phase 1: Initial Choices and Tally (15 min)**
  - **0–5 min:** Introduce the lottery booth. Distribute **Ballot 1** with Pair 1 and Pair 2. Instructions: *"Choose one option per pair. This is private—no discussing yet."*  
  - **5–10 min:** Collect ballots in labeled boxes. Resolve one random ballot for a token prize (e.g., roll dice: 1–2 = C1, 3–4 = G1, etc.) to incentivize engagement.  
  - **10–15 min:** Tally and display results. **Predictable outcome:** Most choose C1 (certainty) + G2 (long-shot). Say: *"Many of you chose the sure 3 tokens in Pair 1 but the gamble for 5 tokens in Pair 2. Now, let’s see why."*  

  #### **Phase 2: Restage as Trees and Second-Stage Commitment (20 min)**  
  - **15–25 min:** Unveil two decision trees. Explain:  
    - **Tree 1 (Pair 1 restaged):**  
      - **Stage 1:** 80% chance to end with 3 tokens (no second stage), 20% chance to move to Stage 2.  
      - **Stage 2:** *Choose between X = 3 tokens or Y = 5 tokens.*  
      - *Outcomes:* Choosing C1 skips the tree (3 tokens). Choosing G1 means facing Stage 2 if the 20% branch occurs.  
    - **Tree 2 (Pair 2 restaged):**  
      - **Stage 1:** For C2: 75% chance of 0 tokens, 25% chance to Stage 2. For G2: 80% chance of 0 tokens, 20% chance to Stage 2.  
      - **Stage 2:** *Same choice: X = 3 tokens or Y = 5 tokens.*  
    - Emphasize: *"The Stage 2 choice is identical in both trees: X or Y, with the same prizes."*  
  - **25–35 min:** Distribute **Ballot 2**. Instructions: *"You haven’t seen Stage 1 outcomes yet. If you reached Stage 2 in Tree 1, would you choose X or Y? If you reached Stage 2 in Tree 2, would you choose X or Y?"*  
    - Clarify: *"Answer for both trees as if you’re planning ahead, before knowing Stage 1 results."*  

  #### **Phase 3: Reveal Contradiction (25 min)**  
  - **35–45 min:** Collect Ballot 2. For each participant, compare:  
    - Their Pair 1 choice (C1 or G1).  
    - Their Stage 2 choice for Tree 1 (X or Y).  
    - Their Stage 2 choice for Tree 2 (X or Y).  
  - **45–55 min:** Display anonymous results. **Key revelation:**  
    - Participants who chose **C1 + G2** almost always choose:  
      - **X in Tree 1** (they prefer 3 tokens if Pair 1’s 20% branch occurs).  
      - **Y in Tree 2** (they prefer 5 tokens if Pair 2’s 20% branch occurs).  
    - Point to trees: *"You gave two different answers to the same question: ‘At Stage 2, do you want 3 or 5 tokens?’ How can that be consistent?"*  
  - **55–60 min:** Resolve tokens for one volunteer (roll dice for Stage 1, then their Stage 2 choice) to show real outcomes.  

  #### **Phase 4: Variant and Debrief (15 min)**  
  - **60–65 min: Variant (No Certainty):** Repeat with altered Pair 1:  
    - **Option C1-alt:** 95% chance of 3 tokens, 5% chance of 0.  
    - **Option G1-alt:** 76% chance of 3 tokens, 19% chance of 5 tokens, 5% chance of 0.  
    - *Ask: "Does your Stage 2 choice still depend on the tree? Or was it about certainty?"*  
  - **65–75 min: Structured Debrief:**  
    1. **Map to Independence Axiom:**  
       - *"The axiom says: Your choice between two outcomes shouldn’t change if both are mixed with the same ‘irrelevant’ lottery (Stage 1 here). Today, you mixed Stage 2 with:*  
         - *Tree 1’s Stage 1: 80% chance of 3 tokens, 20% chance of Stage 2.*  
         - *Tree 2’s Stage 1: 100% chance of Stage 2 with a risk of 0.*  
         - *But Stage 2 was identical—so your choice there should match!"*  
    2. **Ex-Ante vs. Contingent Plans:**  
       - *"Choosing C1 in Pair 1 is like planning to avoid Stage 2. But if you pick G1, you must precommit to X or Y. Violating independence means your ‘plan’ for Stage 2 changes based on unrelated risks."*  
    3. **Certainty vs. Shared Branch:**  
       - *"In the variant, neither option is certain. If your Stage 2 choice still differs, it’s not about certainty—it’s about the Stage 1 context (e.g., avoiding disappointment)."*  
    4. **Open Question:**  
       - *"This activity forces the inconsistency into the open. What it can’t do: tell you whether to abandon the axiom (and be inconsistent) or change your choices. That’s the debate we’ll explore next class."*  

  ---

  ### What Predictably Goes Wrong and How to Handle It
  1. **"Stage 2 choices feel hypothetical."**  
     - **Fix:** Resolve one path visibly (e.g., roll dice for a volunteer) to make consequences tangible.  
  2. **Participants argue probabilities differ between trees.**  
     - **Fix:** Clarify: *"Stage 2 occurs only if you’re in the 20% (Tree 1) or 20–25% (Tree 2) branch. But when you’re *at* Stage 2, the probabilities are gone—you’re just choosing 3 or 5 tokens."*  
  3. **Some resist the contradiction ("I’d choose Y in both!").**  
     - **Fix:** Show aggregate data: 70–80% will contradict. Honor dissent: *"If you’re consistent, you’re already following independence!"*  
  4. **Time runs short during tree explanations.**  
     - **Fix:** Pre-draw trees; use a simple analogy (*"Imagine booking refundable vs. non-refundable travel, then deciding what to do if you get sick"*).  

  ---

  ### The One Thing the Activity Cannot Do
  It **cannot resolve the normative question** of whether participants should revise their preferences to satisfy the independence axiom or reject the axiom as descriptively invalid. The activity’s power is in making the tension visceral—forcing participants to "stumble into" the contradiction before labeling it. The debrief names the axiom only *after* they feel the inconsistency, preserving the experience of discovery.
