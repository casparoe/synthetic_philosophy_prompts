  ## IN THE MATTER OF THE RULES OF THE NETHER WALLOP AND DISTRICT ANGLING AND PHILOSOPHICAL SOCIETY  
  **TRIBUNAL OF THE RULES COMMITTEE**  
  **(Convened Ad Hoc, The Snug, The Jolly Pike, 3rd October 2023)**

  **HEADNOTE:** Upon the purported amendments to Standing Orders adopted at the General Meeting of 15th September 2023; the Treasurer’s subsequent refusal to implement Motion B regarding subscriptions; the Treasurer’s stated intention to resign; and the preliminary question of this Committee’s jurisdiction to adjudicate given the aforementioned amendments to its own terms of reference.

  **FINDINGS:**

  1.  **Jurisdiction:** The Committee finds it retains jurisdiction. The amendments to the Committee’s terms of reference, passed under the purported authority of the amended Rule 1 (itself dependent on the prior repeal of Rule 14), form part of the substantive dispute concerning the validity of *all* amendments passed on the 15th September. To determine *any* aspect of that dispute requires a functioning adjudicative body. Self-abnegation at this preliminary stage would constitute an abrogation of fundamental duty and leave the Society inoperable. The Committee proceeds *de bene esse*.

  2.  **The Foundational Paradox (Rule 1):** The validity of the original Rule 1, adopted by acclamation at the Society’s inaugural meeting in 1897, is unimpeachable. Its adoption preceded any codified rules governing rule adoption, thus existing in a unique, foundational moment of societal compact. It represents the *Grundnorm* of the Society’s constitutional order. Its legitimacy stems from universal assent *at that time*, not from any pre-existing procedural rule.

  3.  **The Entrenchment (Rule 14):** Rule 14, adopted by a 2/3 majority in 1974 under the authority of Rule 1 as it then stood, purported to entrench Rule 1 itself, requiring unanimity for Rule 1’s amendment or repeal. Rule 14 was, at the moment of its adoption, a valid exercise of the power granted by Rule 1. It thereby modified the *manner and form* required for future alterations to Rule 1.

  4.  **The First Motion (Repeal of Rule 14 & Amendment of Rule 1):** This Motion sought two distinct actions: (a) Repeal Rule 14; (b) Amend Rule 1 to reduce its threshold to a simple majority.
      *   4.1 The repeal of Rule 14 (Action a) is the essential precursor to validly amending Rule 1 (Action b) with less than unanimity.
      *   4.2 However, at the precise moment the vote on Motion 1 was taken, Rule 14 remained in full force and effect. Rule 14 explicitly governed amendments to Rule 1, and the repeal of Rule 14 itself constituted an amendment to the rules *concerning* the amendment of Rule 1, falling squarely within Rule 14's ambit. It therefore required unanimity under Rule 14.
      *   4.3 The vote of 41-19 (approx. 68.3%) fell materially short of unanimity. Consequently, **Motion 1 failed in its entirety.** Rule 14 was *not* repealed. Rule 1 was *not* amended.

  5.  **Status Quo Ante:** As Motion 1 failed, the Standing Orders as they existed *prior* to the 15th September meeting remain in full effect. Rule 14 continues to require unanimity for any alteration to Rule 1.

  6.  **The Second Motion (Abolition of Annual Subscription):** This Motion, proposing a substantive rule change, required a 2/3 majority under the unamended Rule 1. The vote was 34-26 (approx. 56.7%). This falls significantly short of the required 2/3 threshold (which would have been 40.67 votes, effectively 41 votes in favour). **Motion 2 therefore failed.**

  7.  **Treasurer’s Duty:** The Treasurer is correct in his assessment that Motion 2 failed. His refusal to implement its provisions (i.e., ceasing to collect subscriptions) is a proper execution of his fiduciary duty to uphold the valid Standing Orders. His threatened resignation, while regrettable, stems from a demonstrably correct interpretation of the constitutional position. The Committee expresses its hope he will reconsider in the interests of continuity.

  8.  **The Rules Committee’s Terms of Reference:** The purported amendment to the Committee’s terms of reference was included within the failed suite of amendments passed under the invalidated new regime. It is therefore **null and void.** The Committee continues to operate under its pre-15th September mandate.

  **ORDERS:**
  1.  The Standing Orders of the Nether Wallop and District Angling and Philosophical Society stand unaltered from their state prior to the General Meeting of 15th September 2023.
  2.  Motions purportedly passed on 15th September 2023 regarding Rule 14, Rule 1, the Annual Subscription, and the Rules Committee’s terms of reference are declared invalid and of no effect.
  3.  The Treasurer is instructed to continue the collection of annual subscriptions in accordance with the extant Standing Orders.
  4.  The Committee commends the Treasurer for his diligence and urges the Membership to respect his adherence to the constitutional framework, however inconvenient.

  **DISSENT (Percy Wensleydale, Vice-Chair):**

  I concur with the majority on the technical outcome but profoundly disagree with its underlying reasoning, particularly concerning paragraph 4. The majority treats Rule 14 as a substantive barrier *during* the very act intended to remove it. This creates an insurmountable logical loop: Rule 14, protecting Rule 1, can only be removed under Rule 1, but Rule 1 is protected by Rule 14. The only escape, per the majority, is unanimity – a practical impossibility rendering Rule 1 effectively immutable despite its ostensible amendability. This elevates a later procedural rule (Rule 14) to a position of supreme, self-perpetuating authority over the foundational Rule 1.

  Rule 1, as the *Grundnorm*, must inherently contain the power to authorise its *own* modification procedures, even those that later seek to constrain it. The 1974 adoption of Rule 14 *using* Rule 1 proves this. Therefore, the 2023 attempt to repeal Rule 14 *using* Rule 1 (as then understood) should be valid if it met Rule 1's *then-current* threshold (2/3), which it did. The repeal of Rule 14 should be seen as taking effect *immediately upon the successful vote*, thereby clearing the way for the amendment to Rule 1 under the *newly effective* lower threshold *within the same motion*. To hold otherwise is to allow a rule to govern its own demise from beyond the grave, granting Rule 14 a metaphysical sovereignty never intended by its drafters in the car park. The Society's constitutional legitimacy ultimately rests on the continuing consent of the governed expressed through majoritarian means under Rule 1, not the ossified whim of a 1974 majority imposing a near-unattainable future veto. The Treasurer's plaintive cry – *"But it’s the snake eating its own tail, gentlemen!"* – while vivid, mistakes logical perplexity for legal principle. The buck must stop with the foundational power, flawed or not. I would find Motion 1 valid and consequently uphold Motion 2. The resulting chaos would be preferable to constitutional paralysis.
