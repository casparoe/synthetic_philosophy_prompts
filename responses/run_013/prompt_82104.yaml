prompt: |-
  I'm in my third year, and this term I'm taking a metaethics course while also working through a formal semantics course, so I have a reasonable command of truth-conditional compositional semantics — denotations, types, functional application, connectives as functions on propositions, and context-sensitivity handled by a character/content split. I want to use the second to get a grip on the first, and I'd rather you do the translating than summarise what other people have said about it.

  Please restate the Frege–Geach problem for expressivism in the vocabulary of formal semantics, as faithfully as you can, and then give me a residue report. By restate I mean: put expressivism in terms of what expressions denote and what types they carry, say how the connectives would have to be typed for composition to proceed, and show precisely where the derivation stalls. Then tell me what does not survive the translation: which parts of the expressivist position have no counterpart in the semantic vocabulary at all, which can be stated only by quietly altering their content, and, for each, whether the failure is a structural limitation of the framework — it cannot represent that, whatever you add — or a sign that the original claim was less clear than it looked.

  I'd like you to test a scheme of my own rather than only rehearsing the standard options. My proposal: treat a moral predicate as a function from contexts to attitudes rather than to properties, so that the content of a sentence like 'tormenting animals for fun is wrong' is the attitude of disapproval itself, and then ask what 'not', 'if', and 'or' would have to denote for composition to be possible. Is that a coherent semantics? Where does it break first — negation, the unasserted antecedent of a conditional, or the account of validity? And in the inference from 'tormenting animals for fun is wrong' and 'if tormenting animals for fun is wrong, then paying someone to do it is wrong' to 'paying someone to do it is wrong', is the relation between premises and conclusion the one the semantics assigns to entailment, or a different relation I would have to stipulate by hand? If my scheme is a dead end, give me the best available translation and tell me what it costs. One alternative worth considering on the way: treating the attitude as a presupposition rather than as content, so that the embedding facts become a projection problem — does that help, or does it merely relocate the difficulty?

  Close with a verdict rather than a survey: once translated, does expressivism come out as a substantive thesis about meaning, or as a thesis about use that this vocabulary cannot state and that has been masquerading as a thesis about content? Please skip the citations and reading list — I want the reconstruction judged on its own.
reasoning: |-
  We are going to restate the Frege-Geach problem for expressivism using the vocabulary of formal semantics. The expressivist position, as you propose, is that the content of a moral sentence is an attitude (e.g., disapproval) rather than a truth value or a proposition (a function from worlds to truth values). 

  ### Step 1: Setting up the expressivist semantics
  Let's define the types we will use:
  - `e`: entities (type for individuals)
  - `t`: truth values (the standard type for propositions, which are functions from worlds to `t` in an intensional system, but we'll keep it extensional for simplicity unless needed)
  - `a`: attitudes (a new basic type for your proposal)

  In your scheme, a moral predicate (like 'wrong') does not denote a property (which would be of type `(e, t)`, a function from entities to truth values) but rather a function from contexts to attitudes. However, note that in standard formal semantics, we think of the content of a sentence as being of type `t` (or in intensional semantics, `(s, t)` where `s` is the type of possible worlds). 

  But in your proposal, the content of a moral sentence is an attitude (type `a`). So, for a sentence like "Tormenting animals for fun is wrong", we have:

  - "tormenting animals for fun" (let's call it `torture`) is of type `e` (an individual event or action).
  - "wrong" is of type `(e, a)`? But wait, in your proposal, you said: "a function from contexts to attitudes". So let's introduce contexts.

  Let `c` be the type of contexts. Then, in your scheme, the moral predicate "wrong" would be of type `(c, (e, a))`? But that doesn't seem right because we want the sentence to denote an attitude. Alternatively, we might think of the entire sentence as having a content that is an attitude, and the context-sensitivity is handled by making the denotation of the sentence relative to a context.

  Alternatively, we can think of the moral predicate as having a denotation that is a function from contexts to functions from entities to attitudes. Then the sentence "torture is wrong" in context `c` would denote: `[wrong](c)(torture)`, which is of type `a`.

  But note: in the standard truth-conditional semantics, the sentence denotes a truth value (or a proposition) and the context is used to fix the interpretation of indexicals. In your proposal, we are replacing the truth value with an attitude.

  ### Step 2: The problem with connectives
  Now, consider negation. In a standard truth-conditional semantics, negation is a function of type `(t, t)`: it takes a truth value and returns its opposite. But in your system, the sentence "torture is wrong" is of type `a` (an attitude). What would negation do? It would have to be of type `(a, a)`. But what is the negation of an attitude? 

  Let's say we define a function `neg` of type `(a, a)`. Then the sentence "torture is not wrong" would be `neg([wrong](c)(torture))`. But what does `neg` do to the attitude of disapproval? Does it turn it into approval? Or into the absence of disapproval? Expressivists might say that the negation of "wrong" expresses a different attitude (perhaps tolerance or the absence of disapproval). But note that in logic, we want the negation to have certain properties: for example, that the negation of the negation of p is equivalent to p.

  Now, the real trouble comes with embedding in conditionals. Consider the conditional: "If tormenting animals for fun is wrong, then paying someone to do it is wrong."

  In standard semantics, the conditional is a function of type `(t, (t, t))` (or in a more refined setting, it might be a function from propositions to functions from propositions to propositions). It takes two truth values (or two propositions) and returns a truth value.

  In your system, the antecedent and the consequent are both of type `a` (attitudes). So the conditional would have to be of type `(a, (a, a))`. But what is the meaning of a function that takes two attitudes and returns a third attitude? How does that capture the logical relation that the conditional is supposed to have?

  Moreover, the expressivist wants to explain why the following argument is valid:

  P1: Tormenting animals for fun is wrong. (content: attitude A1)
  P2: If tormenting animals for fun is wrong, then paying someone to do it is wrong. (content: attitude A2, which is a function of A1 and the consequent's attitude)
  C: Paying someone to do it is wrong. (content: attitude A3)

  But in standard logic, the argument is valid because in every world where P1 and P2 are true, C is true. In your system, we don't have truth conditions but attitudes. So we need a notion of validity for arguments involving attitudes.

  ### Step 3: Testing your proposal on the inference
  Let's try to formalize the inference:

  - Let `A = torture` and `B = paying`.
  - P1: `wrong(c)(A)` of type `a`.
  - P2: `cond(wrong(c)(A), wrong(c)(B))` of type `a`, where `cond` is of type `(a, (a, a))`.
  - We want to derive `wrong(c)(B)`.

  But what is the relation between P1, P2, and C? In the standard case, we have modus ponens: from `p` and `p -> q` we infer `q`. But here, we have two attitudes and we want to get a third. How does the function `cond` work? 

  The expressivist might say that P2 expresses a higher-order attitude: a disposition to disapprove of B if one disapproves of A. Then, when one has the attitude of disapproval toward A and the higher-order attitude, one is committed to having the attitude of disapproval toward B. But note that this is a psychological process, not a logical one. In the semantic derivation, we don't have a rule that says: if you have an attitude of type `a` and an attitude of type `(a, (a, a))` then you get another attitude. The composition is not functional in the same way.

  In fact, in the formal semantics framework, the composition is done by functional application. But in the derivation of the conclusion, we are not composing P1 and P2 to get C by any semantic rule. Instead, we are relying on a separate rule of inference (modus ponens) that is defined over attitudes. But that rule is not part of the compositional semantics.

  Moreover, note that in the unasserted antecedent of the conditional, the expressivist must account for the meaning of "tormenting animals for fun is wrong" without actually expressing the attitude. In your scheme, the antecedent is still of type `a` (an attitude). But when embedded, we are not expressing the attitude; we are merely considering it. How does that work? The expressivist must say that in the antecedent, the sentence contributes the same attitude type, but it is not expressed (i.e., the speaker is not committed to it). This is a problem because the same sentence in different contexts (asserted vs. unasserted) is supposed to have the same content.

  ### Step 4: Alternative: attitudes as presuppositions
  Now, consider the alternative: treat the attitude as a presupposition. Then, the content of the moral sentence could be a truth value (or a proposition) but it carries a presupposition that the speaker has a certain attitude. 

  For example, "torture is wrong" would denote a truth value (say, True) but it presupposes that the speaker disapproves of torture. Then, the connectives can be handled in the standard way. However, the problem of embedding reappears as a projection problem: what is the presupposition of a conditional? 

  For the conditional "If torture is wrong, then paying is wrong", the presupposition of the antecedent (that the speaker disapproves of torture) might be suspended in the antecedent. The standard projection rules for conditionals (e.g., Karttunen) say that the presupposition of the consequent must be satisfied in the context updated with the antecedent. So the conditional as a whole would presuppose that the speaker has the attitude that if torture is wrong (which, in the antecedent, we are assuming to be true, and hence the presupposition of the antecedent must be satisfied in the hypothetical context) then they disapprove of paying. But note: the antecedent's presupposition is that the speaker disapproves of torture. So the conditional would presuppose: if the speaker disapproves of torture, then they disapprove of paying. 

  But then, the argument:

  P1: torture is wrong (asserted, so we have the presupposition that the speaker disapproves of torture, and the assertion that it is true that torture is wrong)
  P2: if torture is wrong then paying is wrong (presupposes: if the speaker disapproves of torture then they disapprove of paying; and asserts: if torture is wrong then paying is wrong)

  Now, from P1 and P2, we get by modus ponens: paying is wrong. But note that P2's assertion is a conditional that we take as true, and P1 gives us the antecedent, so we get the consequent: it is true that paying is wrong. But what about the attitude? The conclusion "paying is wrong" would carry the presupposition that the speaker disapproves of paying. But we have not derived that attitude from the premises. We have only derived the truth of the conclusion.

  Moreover, from the premises, we have:
  - From P1: the speaker disapproves of torture (by presupposition) and torture is wrong (by assertion).
  - From P2: the conditional assertion and the conditional presupposition: if the speaker disapproves of torture then they disapprove of paying.

  By modus ponens on the assertions, we get that paying is wrong. But we also have, by modus ponens on the presuppositions: since the speaker disapproves of torture (from P1) and the conditional presupposition (if disapproval of torture then disapproval of paying), we get that the speaker disapproves of paying. So the conclusion "paying is wrong" has its presupposition satisfied.

  However, note that the truth of the moral sentences is now back in the picture. The expressivist wanted to avoid truth conditions for moral sentences, but now we have them. So this is a form of cognitivism. The expressivist might not be happy with this because they want to deny that moral sentences are truth-apt.

  ### Step 5: Verdict on your proposal
  Your proposal (treating the content as an attitude) runs into trouble at the level of the connectives and the account of validity. Specifically:

  1. **Negation**: We can define a function of type `(a, a)`, but it is unclear what the negation of an attitude is and whether it behaves like logical negation.
  2. **Conditionals**: The conditional must be of type `(a, (a, a))`, and it is unclear how to define it so that it captures the logical relation of implication and allows for modus ponens to hold in the attitude space.
  3. **Unasserted contexts**: The same sentence in an unasserted context (like the antecedent of a conditional) must have the same content (type `a`), but then we are not expressing the attitude. How does the semantics account for the difference in use?
  4. **Validity**: The argument form modus ponens must be defined over attitudes. But in the semantic derivation, we have no rule that composes the two premises (of types `a` and `(a, (a, a))`? Actually, P2 is of type `a`, not a function) to get the conclusion. We have to step outside the compositional semantics to define a separate inference rule.

  Therefore, your scheme as a semantics for compositionality breaks at the level of the connectives, especially the conditional and the account of validity.

  ### Step 6: What does not survive the translation?
  - **The expressivist's non-cognitivism**: The idea that moral sentences do not express propositions (truth-conditional content) but express attitudes is translated by replacing the type `t` with `a`. But the framework of formal semantics is built for truth-conditional content. The moment we try to compose with connectives, we run into trouble because the standard connectives are defined for `t`. We can redefine the connectives for `a`, but then we lose the logical properties that we need for inference (like modus ponens) to be captured by the semantics alone.

  - **The original claim's clarity**: The expressivist claim that moral sentences express attitudes is clear when the sentence is asserted. But when embedded, the expressivist must explain the meaning of complex sentences without assertion. The formal semantics translation reveals that the expressivist must either:
     (a) Assign the same content (attitude) to the embedded sentence, but then the compositional semantics for connectives becomes mysterious, or
     (b) Assign a different kind of meaning to embedded occurrences (like a proposition) which then leads to a dualism of meaning (the so-called "bifurcated" semantics) and the problem of how the two meanings are related.

  The structural limitation of the formal semantics framework is that it is designed for truth-conditional meaning. The framework can be extended to new types (like `a`), but then the burden is to define the composition rules for all the operators in a way that captures the logic of moral discourse. This has proven difficult and is the core of the Frege-Geach problem.

  ### Final verdict
  Once translated, expressivism does not come out as a coherent substantive thesis about meaning within the vocabulary of formal semantics. The attempt to assign attitudes as the content of moral sentences leads to a breakdown in the compositionality for logical operators and in the account of logical validity. The expressivist's core idea — that moral sentences express non-cognitive attitudes — seems to be a thesis about the use of moral sentences (specifically, about the speech act performed when asserting them) that cannot be captured by a semantics that assigns contents (denotations) in the usual way. 

  Therefore, expressivism, when forced into the mold of formal semantics, either collapses into a form of cognitivism (if we use the presupposition alternative) or fails to provide a compositional semantics for complex sentences. The Frege-Geach problem remains a formidable challenge for expressivism.

  In your own proposal, the scheme breaks first at the level of the conditional and the account of validity. The relation between premises and conclusion in the modus ponens inference is not captured by the semantics; it would have to be stipulated by hand as a separate rule of inference. This is a sign that the semantics is not compositional in the way that truth-conditional semantics is.

  Thus, the verdict is that expressivism, as a semantic thesis, does not survive the translation. It is better understood as a thesis about use, and the formal semantic framework reveals that it cannot be stated as a thesis about content without running into the Frege-Geach problem.
answer: |-
  ### Restating the Frege-Geach Problem in Formal Semantics Vocabulary  
  **Expressivist Setup (Your Proposal):**  
  - **Moral predicates (e.g., "wrong"):** Type `(e, (c, a))`.  
    - Input: Entity (e.g., an action `x` of type `e`).  
    - Output: Function from contexts `c` (type `c`) to attitudes `a` (type `a`).  
    - Example: `[wrong]` denotes `λx. λc. DISAPPROVAL(c, x)`, where `DISAPPROVAL` is an attitude.  
  - **Moral sentence content (e.g., "Tormenting animals is wrong"):** Type `(c, a)`.  
    - In context `c`, it denotes an attitude (e.g., `DISAPPROVAL(c, torture)`).  

  **Connectives in Standard Truth-Conditional Semantics:**  
  - Negation (`not`): Type `(t, t)`. Takes a proposition `p` (type `t`), returns `¬p`.  
  - Conditional (`if`): Type `(t, (t, t))`. Takes propositions `p`, `q`, returns `p → q`.  
  - Disjunction (`or`): Type `(t, (t, t))`. Takes `p`, `q`, returns `p ∨ q`.  

  **Problem: Connectives Cannot Compose with Attitudes**  
  1. **Negation Breakdown:**  
     - Input to `not` must be type `t` (truth value).  
     - But "Tormenting is wrong" outputs type `a` (attitude).  
     - Composition fails: `not` cannot apply to `DISAPPROVAL(c, torture)`.  
     - *Stall point:* Type mismatch at negation.  

  2. **Conditional Breakdown (Unasserted Antecedent):**  
     - Antecedent "Tormenting is wrong" in "If tormenting is wrong, then paying is wrong" must be type `t` for `if` to apply.  
     - But antecedent is type `(c, a)`, not `t`.  
     - Composition fails: `if` requires `t` inputs, gets `(c, a)`.  
     - *Stall point:* Conditional function application.  

  3. **Validity Breakdown (Modus Ponens):**  
     - Premise 1: `[Tormenting is wrong]^c = DISAPPROVAL(c, torture)` (type `a`).  
     - Premise 2: `[If tormenting wrong, then paying wrong]^c` would need to be a function from attitudes to attitudes (e.g., `λatt. λy. COND(att, DISAPPROVAL(c, y))`).  
     - Conclusion: `[Paying is wrong]^c = DISAPPROVAL(c, pay)`.  
     - **Issue:**  
       - The inference relies on a *meta*-logical relation (e.g., commitment consistency).  
       - No semantic entailment `(P1 ∧ P2) → C` because:  
         - Premises are attitudes (type `a`), not truth-apt (type `t`).  
         - Validity requires preservation of *truth*, but attitudes lack truth conditions.  
     - *Stall point:* Entailment is not defined in the semantics.  

  ### Residue Report: What Doesn’t Survive Translation  
  1. **No Counterpart in Semantics:**  
     - **Attitudes as non-truth-apt content:** The claim that "moral sentences denote attitudes, not propositions" has no counterpart. Semantics requires all embedded clauses to be propositional (type `t`) for logical operators to apply.  
       - *Failure reason:* Structural limitation. The type system cannot handle non-propositional contents in logical environments.  

  2. **Altered Content When Translated:**  
     - **Expression vs. Embedding:** Expressivism’s core idea—that asserting "X is wrong" *expresses* disapproval—is silently altered when embedded.  
       - In unasserted contexts (e.g., antecedents), the attitude is "mentioned" not "used," but semantics treats all occurrences uniformly.  
       - *Failure reason:* Sign of original unclarity. Expressivism conflates *speech-act* (use) with *content* (denotation).  

  3. **Your Proposal’s Breakdown:**  
     - **First breakpoint:** **Conditionals** (specifically, unasserted antecedents).  
     - **Coherent?** Only for simple assertions. Fails at first logical embedding.  
     - **Validity relation:** Not entailment. Requires stipulating a non-semantic rule (e.g., "If you disapprove of X and disapprove of (X → Y), you must disapprove of Y").  

  ---

  ### Alternative: Attitudes as Presuppositions  
  **Proposal:**  
  - Moral sentences denote propositions (type `t`) but *presuppose* attitudes.  
    - "Tormenting is wrong" denotes `TRUE` (type `t`) but presupposes `DISAPPROVAL(c, torture)`.  
  - Connectives apply to truth values. Presuppositions project via standard rules (e.g., Karttunen).  

  **Analysis:**  
  - **Advantage:** Solves composition. Connectives work normally (inputs are `t`).  
  - **Problem:** Relocates (but does not resolve) Frege-Geach:  
    - Antecedent "Tormenting is wrong" in a conditional *triggers its presupposition* in the hypothetical context.  
      - "If tormenting is wrong, then..." presupposes: *If tormenting is wrong*, then `DISAPPROVAL(c, torture)`.  
    - **Result:** The conditional’s presupposition is vacuous (a tautology), losing the expressivist insight.  
    - **Validity:** Modus ponens holds for truth conditions, but the *attitudinal commitment* is not preserved.  
  - **Verdict:** Makes expressivism a shadow of cognitivism. Attitudes become ancillary features, not core content.  

  ---

  ### Final Verdict  
  **Expressivism, when translated into formal semantics, ceases to be a substantive thesis about *meaning* (i.e., denotation).**  
  - **What it reveals:** Expressivism is fundamentally a thesis about *use* (speech acts, psychological states) that cannot be stated in semantic vocabulary without:  
    - Altering its core claims (e.g., attitudes are no longer "content").  
    - Invoking extra-semantic machinery (e.g., commitment rules for validity).  
  - **Structural limitation:** Semantics requires all embeddable content to be propositional (type `t`). Attitudes (type `a`) are unembeddable.  
  - **Conclusion:** Expressivism’s key tenets—non-truth-aptness and the primacy of attitudes—**cannot be coherently modeled as semantic content**. The Frege-Geach problem persists because expressivism mistakes a pragmatic feature (use) for a semantic one (denotation).  

  **Your Proposal’s Fate:** Dead end. It breaks at the first non-assertoric embedding (conditionals), and validity requires ad-hoc stipulations. The best available translation treats attitudes as presuppositions, but this surrenders expressivism’s anti-realism.
