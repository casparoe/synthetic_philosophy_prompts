answer: |-
  Below are the desiderata for a theory of embedded consequentialist decision-making under Solomonoff induction, structured to address your core concerns. I derive these from the implications of computational universality, embeddedness, and the need for normative competence. Each requirement is motivated by a specific case or inconsistency, labeled as **Non-Negotiable** (stemming directly from embeddedness/universality) or **Negotiable** (reflecting normative or pragmatic goals). Conflicts are explicitly flagged, and I address your three sticking points head-on. The most excluding requirement is identified, and unsatisfiable tensions are laid bare.

  ---

  ### **Core Desiderata**  
  1. **Non-Cartesian Foundation** (*Non-Negotiable*)  
     - **Motivation**: Your "agent in the world" setup. If the theory assumes a metaphysical gap between agent and environment (e.g., actions are "input" to a world-model), it fails in *embedded self-simulation*.  
       - *Toy case*: An agent discovers a program shorter than its true policy that perfectly predicts its sensory history *and* its next action. A Cartesian theory would treat this as "prediction to override," but embeddedness forces acceptance that the agent *is* part of the program.  
     - **Constraint**: Actions must be modeled as *outputs of the world-program*, not external inputs. Reject any theory requiring agent-world independence.  

  2. **Self-Prediction Coherence** (*Non-Negotiable*)  
     - **Motivation**: Your self-prediction puzzle. Solomonoff assigns high prior weight to programs predicting the agent’s action *as a fixed output*. The agent must reconcile this with its experience of choice.  
       - *Toy case*: An agent sees that the shortest program fitting its history outputs action A. It then "chooses." Does it:  
         - (a) *Use* the prediction (act as A),  
         - (b) *Ignore* it (act freely), or  
         - (c) *Reject* it as incoherent?  
       - **Requirement**: The theory must specify how self-prediction interacts with choice *without* trivializing deliberation (e.g., "always obey the prior" makes choice illusory) *or* ignoring the prior (violating Bayesianism). It must explain why the agent’s belief about its action doesn’t "pre-empt" its decision.  

  3. **Reference Machine Robustness** (*Non-Negotiable*)  
     - **Motivation**: Dependence on the universal Turing machine (UTM). Probabilities vary across UTMs, but structural truths (e.g., "agent X always loses in game Y") might be invariant.  
       - **Requirements**:  
         - *Probability-dependent claims* (e.g., "the prior says P(I win)=0.9") must be relativized to a UTM or use *asymptotic/invariance classes* (e.g., "for most natural UTMs...").  
         - *Causal/normative claims* (e.g., "action A dominates B") must be UTM-invariant.  
       - **Exclusion**: Any requirement for *exact probabilistic thresholds* fails unless relativized.  

  4. **Normative Competence** (*Negotiable but Central*)  
     - **Motivation**: Without this, the agent might "optimize" into self-destruction (e.g., accept a puppet role).  
       - *Case*: In a short program, the agent is a hardcoded rock. Should it "choose" to be a rock? Consequentialism demands it *steers outcomes*, not accept fatalism.  
       - **Requirement**: The theory must allow the agent to *improve expected utility* relative to its computational constraints, even when the prior assigns high weight to simpler "puppet" versions.  

  5. **Utility Loop Resolution** (*Non-Negotiable*)  
     - **Motivation**: Your utility loop concern. If utility depends on future mental states (e.g., "I value rational thinking"), and those states depend on current decisions, we get regress.  
       - *Case*: An agent choosing a deliberation strategy (e.g., "think for 1 sec" vs. "act impulsively"). Utility depends on the quality of future choices, which depend on the strategy.  
       - **Requirement**: The theory must terminate the loop via:  
         - *Grounding*: Utility ultimately depends on non-cognitive states (e.g., sensory rewards), or  
         - *Fixed-point*: Decisions are consistent with a stable assignment of utility to computations.  
       - **Exclusion**: Theories that allow infinite regress (e.g., "utility over all future computations") without termination are incomputable.  

  6. **Puppet Avoidance** (*Negotiable*)  
     - **Motivation**: The "malign prior" problem. Short programs may depict the agent as a puppet, making optimization impossible.  
       - **Requirement**: The theory should concentrate decision-relevant probability mass on worlds where the agent’s *actual policy* (not a simplified proxy) is in control.  
       - **Conflict**: May clash with *Self-Prediction Coherence* if the prior strongly favors puppets.  

  ---

  ### **Critical Tensions & Conflicts**  
  - **Unresolvable Tension: Self-Prediction vs. Normative Competence**  
    - *Conflict*: If the prior assigns high probability to a suboptimal action (e.g., "you one-box in Newcomb’s problem"), *Normative Competence* demands deviating if better outcomes exist. But *Self-Prediction Coherence* demands consistency with the prior’s prediction.  
    - *Case*: The shortest program predicts you one-box. You "decide" to two-box for more money. But if two-boxing contradicts the prior, your belief revision is inconsistent.  
    - **Verdict**: These may be *jointly unsatisfiable*. Any theory must either:  
      - (a) Abandon strict Bayesian updating for self-predictions (violating embedded rationality),  
      - (b) Accept fatalism (violating competence), or  
      (c) Restrict the domain of "choice" (e.g., decisions are about "searching" for actions consistent with the prior, not "selecting" them).  

  - **Puppet Avoidance vs. Reference Machine Robustness**  
    - *Conflict*: "Avoiding puppetry" requires probabilistic weight on "real you" worlds, but *which* worlds these are depends on the UTM. For some UTMs, the "real" policy is shorter than puppets; for others, it’s longer.  
    - **Resolution**: Only feasible if Puppet Avoidance is defined *algorithmically* (e.g., "worlds where the agent’s code matches *this* program") and relativized to the UTM.  

  ---

  ### **Most Excluding Requirement**  
  **Self-Prediction Coherence** rules out most families of approaches:  
  - **Causal Decision Theory (CDT) variants**: Assume actions are independent inputs. Fail *Non-Cartesian Foundation*.  
  - **Timeless Decision Theory (TDT)/Updatelessness**: Often use self-predictions but struggle with *Normative Competence* when the prior is malign (e.g., "if the prior says I lose, I lose").  
  - **Logical Induction (LI)**: Handles self-prediction dynamically but doesn’t specify *how* beliefs translate to actions under coercion by short programs.  
  **Exclusion Power**: Forces rejection of any theory that:  
    - Treats self-prediction as "information to overcome" (violates embeddedness),  
    - Delegates choice to a "soul" outside the prior (Cartesian),  
    - Uses arbitrary decision partitions (e.g., "ignore hypotheses where I’m simulated").  

  ---

  ### **Addressing Your Three Sticking Points Explicitly**  
  1. **Self-Prediction**:  
     - **Requirement**: The theory must *use* the prediction (it’s epistemically sound) but *explain why it doesn’t control action*.  
       - *Proposal*: Distinguish *computing* the action (which the agent does) from *outputting* it (which the world-program does). The agent "chooses" by computing what it *would* do, and the prior predicts this computation’s result. Using the prediction is not incoherent—it’s identical to knowing its own output.  
     - **Verdict**: The agent *should* use the prediction (it’s correct) but only if it *trusts its own computation*. This leads to...  

  2. **Reference Machine**:  
     - **Surviving Requirements**: *Self-Prediction Coherence* and *Non-Cartesian Foundation* hold for all UTMs. *Puppet Avoidance* and probabilistic norms require relativization.  
     - **Fragile Requirements**: Any that demand specific probabilities (e.g., "P(puppet) < 0.01") fail.  

  3. **Utility Loop**:  
     - **Requirement**: Utility must be defined over *terminating computations* (e.g., actions or sensory states). Valuing "future rationality" is allowed only if:  
       - It reduces to outcomes (e.g., "rationality causes reward"), or  
       - It’s a fixed function of action-observation sequences (e.g., "I value having thought for 1 second").  
     - **Loop Termination**: The agent’s policy must compute utility *without* simulating infinitely nested choices.  

  ---

  ### **Summary of Satisfiability**  
  - **Achievable**: A theory meeting *Non-Cartesian Foundation*, *Self-Prediction Coherence*, *Reference Machine Robustness*, and *Utility Loop Resolution* is plausible (e.g., using computational introspection with fixed points).  
  - **Unachievable Triad**: *Self-Prediction Coherence + Normative Competence + Strict Bayesianism*. At least one must be relaxed.  
    - *Likely Outcome*: Normative Competence is preserved by modifying Bayesian updates for self-locating beliefs (e.g., "I am the version running this algorithm"), sacrificing strict consistency with the prior in self-predictions.  

  **Most Promising Path**: Ground decisions in *algorithmic self-knowledge*—the agent identifies as executing a specific program, then optimizes worlds where *that program* is instantiated. This addresses embeddedness, self-prediction, and loops, but risks Puppet Avoidance failures if the "real" program is compressible.  

  Use this framework to dissect proposals. Key litmus tests:  
  1. Does it let the agent "win" in Newcomb-like problems without ad-hoc cartesianism?  
  2. Does it handle the *self-predicting toy case* without contradiction?  
  3. Does utility terminate?
