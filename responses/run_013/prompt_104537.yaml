prompt: |-
  Last night a friend and I argued for the better part of two hours about Bernard Williams's integrity objection to utilitarianism, and we kept circling back to his example of the man who saves his wife rather than a stranger and who, in justifying himself, has one thought too many. My friend's view is that the whole line of criticism rests on a mistake about what a moral theory is for. Williams, he says, treats utilitarianism as though it had to be run as a calculation inside the agent's head at the moment of action, so that the husband would first have to survey the general welfare before he were permitted to reach for his wife. But a standard of right action need not double as a decision procedure: the act can be right because it maximises welfare without welfare's being the thought that moves the agent, and nothing in utilitarianism forbids the husband from simply acting out of love. On his reading, the objection dissolves the moment one separates the criterion of rightness from the agent's deliberations, and the offending extra thought turns out to be something Williams foisted on the theory rather than something the theory requires. I could not produce the reply, and it has been nagging at me since. Was the integrity objection really just a confusion of criterion with decision procedure, so that nothing survives once the two are held apart — or is there a residue that the distinction leaves untouched, and if so, precisely which part of the objection does the distinction answer and which part does it not?
reasoning: |-
  Okay, the user is grappling with a philosophical debate about Bernard Williams' integrity objection to utilitarianism, specifically the "one thought too many" example. Their friend argues that Williams conflates the criterion of rightness with the decision procedure, rendering the objection invalid once distinguished. The user couldn't counter this and seeks clarity on whether the distinction fully dissolves Williams' critique or if deeper issues persist.

  First, I need to unpack both positions. Williams' core argument is that utilitarianism violates personal integrity by demanding agents prioritize impersonal welfare over their deeply held projects and commitments. The drowning wife example illustrates this: the husband shouldn't need utilitarian justification to save his wife; doing so out of love is integral to his identity. The "one thought too many" refers to the moral calculation corrupting authentic personal motives.

  The friend's rebuttal relies on the criterion/decision-procedure distinction—a standard utilitarian defense. Utilitarianism only claims that acts maximizing welfare are right, not that agents must consciously calculate welfare. The husband can act from love; the theory merely evaluates the outcome. Thus, Williams allegedly misattributes a deliberative requirement that utilitarianism doesn't entail.

  But does this fully resolve Williams' concern? I suspect not. While the distinction handles the "deliberative overload" aspect (the husband needn't literally have extra thoughts), it doesn't address the deeper tension: utilitarianism still demands that personal commitments be justifiable by impersonal welfare. Even if the husband acts spontaneously, utilitarianism implies his love is only permissible if saving his wife happens to maximize welfare. This subordinates his personal reasons to impersonal ones, threatening integrity at a structural level. Williams might argue that real integrity requires commitments to be intrinsically valuable, not contingently justified by external outcomes.

  The user also hints at a meta-question about moral theories' purposes. Williams sees ethics as rooted in personal life, while utilitarianism prioritizes impartial outcomes. This fundamental divergence isn't resolved by technical distinctions. The residue of the objection lies here: the potential incompatibility between personal integrity and a theory that makes all values fungible.

  For the user's reply, they could concede the distinction resolves the "deliberative" reading but emphasize the deeper conflict about justification. They might cite Williams' worry that utilitarianism alienates agents from their motives by making personal bonds contingent on global utility. The friend's defense saves utilitarianism from psychological implausibility but not from dissolving the specialness of personal projects.
answer: |-
  You've identified a sophisticated defense of utilitarianism, and your friend's argument is a common and powerful response to Williams. However, the integrity objection isn't *fully* dissolved by the criterion/decision-procedure distinction. While the distinction successfully addresses one crucial misunderstanding (the "deliberative overload"), it leaves untouched a deeper, more fundamental concern Williams raised about the nature of value and the self. Here's the breakdown:

  1.  **What the Distinction Successfully Answers: The "One Thought Too Many" as Literal Deliberation.**
      *   Your friend is absolutely correct that Williams' presentation (especially in the drowning wife example) *can* be misread as demanding that the utilitarian agent *must consciously calculate* utility in every moment of action. This is psychologically implausible and practically absurd.
      *   Utilitarianism, as a *standard of rightness*, does not require this. It can perfectly well endorse the husband acting spontaneously out of love, without any utilitarian calculation crossing his mind *at that moment*. The theory simply says that *if* saving his wife *does* maximize utility (which, in most plausible scenarios involving deep personal relationships and the agent's own psychological well-being, it likely will), then the act is right.
      *   **Conclusion:** On this point, the distinction works. Williams' specific criticism of the husband needing "one thought too many" *in his actual deliberation* is defused. Utilitarianism doesn't require that specific thought *at the time of action*.

  2.  **What the Distinction Does NOT Answer: The Deeper Threat to Integrity (The "Grounds of Justification" Problem).**
      *   Williams' core objection is not merely about cumbersome deliberation; it's about what gives *value* or *justification* to the agent's actions and commitments *from the perspective of the theory itself*. This is where the residue remains.
      *   **The Problem:** Even if the husband acts spontaneously out of love *without* the utilitarian thought, utilitarianism insists that the *ultimate justification* for his action, and crucially, for the *value* of his commitment to his wife, lies *outside* that commitment itself. It lies in the impersonal fact that acting on this commitment *happens* to maximize total welfare.
      *   **The Threat to Integrity:** Williams argues that this makes the agent's deepest commitments and projects – the very things that constitute their sense of self and integrity – *contingent* and *subordinate* to the demands of impersonal utility. The commitment to his wife is only *permitted* (or justified) because it *serves* some larger, impersonal end. Its value is *instrumental*, not intrinsic *to the agent's life and perspective*.
      *   **Why the Distinction Doesn't Fix This:**
          *   **Justification, Not Deliberation:** The distinction separates *how you decide* from *what makes it right*. But it doesn't change *what makes it right*. The utilitarian criterion of rightness *still requires* that the value of saving the wife is ultimately derived from its contribution to general welfare.
          *   **The "Standing Justification":** While the husband doesn't need the thought *during* the rescue, the utilitarian theory implies that *if challenged*, the *only* acceptable justification he could give *as a utilitarian* would be the impersonal welfare-maximizing one. He couldn't say "Because she's my wife and I love her" is the *final* justification; that justification only stands *because* (and *only* insofar as) loving commitments generally promote utility. The personal reason is not foundational within the theory.
          *   **Alienation:** This creates a form of alienation. The agent's most personal reasons for acting are not the reasons that ultimately justify the act *according to the moral theory they accept*. Their commitments are valuable only as tools for something else. This, Williams argues, undermines integrity – the sense that one's actions flow authentically from one's own deepest values and projects, which are valued *for their own sake* within one's life.

  3.  **The Residue: The Conflict Between Personal and Impersonal Standpoints.**
      *   The unresolved core of Williams' objection is the *fundamental conflict* utilitarianism creates between the *personal standpoint* (from which my wife is uniquely important *to me*, and my love for her is a fundamental part of who I am) and the *impersonal standpoint* (from which everyone's welfare counts equally, and my wife has no special status).
      *   Utilitarianism insists that the impersonal standpoint is *sovereign* in determining rightness. It demands that the agent adopt this standpoint as the ultimate arbiter of value, even when it requires sacrificing their own deepest personal projects and commitments *for the greater good* (George the Chemist, Jim and the Indians).
      *   Williams contends that requiring an agent to abandon or sacrifice their "ground projects" (commitments so central they give life meaning) for an impersonal demand is to attack their very integrity. The criterion/decision-procedure distinction doesn't alleviate this demand; it just makes the psychological process of fulfilling it potentially smoother.

  **Your Reply: The Core of the Unresolved Objection**

  You could have replied to your friend along these lines:

  *"You're right that the distinction between criterion and decision procedure successfully shows that utilitarianism doesn't require the husband to literally have the utilitarian calculation in his head while saving his wife. Williams might have been misleading on that point. However, I think the deeper force of the integrity objection survives.*

  *The problem isn't just about *how* he decides in the moment, but about *why* his action is ultimately justified according to utilitarianism. Even if he acts purely from love, utilitarianism tells us that love is only a permissible motive because, and only so long as, acting on it generally maximizes welfare. The value of his deepest personal commitment – his love for his wife – is made contingent upon its usefulness to an impersonal goal.*

  *This means that within utilitarianism, his personal reason ("Because she's my wife!") cannot be the *final* justification. The final justification must always refer back to the impersonal calculus. Williams argues that this subordination of the personal to the impersonal alienates the agent from their own commitments and projects – the things that constitute their integrity. Requiring George to take the job he finds abhorrent, or Jim to kill the innocent Indian, exemplifies this demand to sacrifice one's integrity for the greater good in a way the distinction doesn't touch.*

  *So, while the distinction resolves the 'one thought *in deliberation*' problem, it doesn't resolve the deeper issue: utilitarianism's insistence that the *ultimate source of value and justification* for all actions, including those flowing from our deepest personal commitments, lies solely in impersonal welfare, potentially rendering those commitments contingent and undermining the agent's sense of self."*

  **In essence:** The distinction answers the *psychological* or *deliberative* misreading of Williams' example. It shows utilitarianism doesn't demand constant calculation. But it doesn't answer the *axiological* (value-based) and *justificatory* core of the objection: utilitarianism's insistence that the value and justification of personal commitments are always derived from and subordinate to impersonal welfare, threatening the agent's sense of self and integrity when these conflict. This deeper conflict between the personal and impersonal standpoints is the residue Williams identified.
