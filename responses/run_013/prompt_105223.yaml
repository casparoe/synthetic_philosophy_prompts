prompt: |-
  I run a small mutual-aid thing in my neighborhood — about forty of us chip in, we end up with maybe $600 a month, and me and two other people decide who gets it. Usually $50–$200 to one person for one specific thing: a car repair so somebody can keep their job, a deposit, meds, sometimes just groceries. Nobody's getting rich and it's rarely life or death, but people get really upset about the calls, and honestly I don't have a good answer for why we gave it to one person and not another.

  The three of us keep having the same fight without knowing we're having it. My one friend says give it to whoever it helps the most, period — if $200 pulls one person out of a hole and barely registers for someone else, that's where it goes. My other friend says that's not fair, we should just be giving everyone the same, or at least treat people alike unless there's a real reason not to. And I keep feeling like they're both missing something — that what actually matters is whether the money leaves the person more able to do the things a person should be able to do: get around, be healthy, not be humiliated, take part in stuff. Two people can get the same $200 and one ends up way more able to live their life than the other.

  I want a procedure we can actually run every month — something I could hand to a new volunteer. Not an essay. The questions to ask in order, what counts as a good enough answer to each, when the process says no or "not this month," and — this is the part I care about — where it stops being about facts and turns into a judgement call one of us just has to make and own. And dont tell me to just make it equal, because I've noticed "equal" can mean making everyone worse off in the name of nobody being ahead.

  It has to handle the cases that actually come up, which are the annoying ones: the guy who's bad with money and will probably waste it; the woman who's been poor so long she's stopped asking for anything bigger, so on paper she never seems to "need" much; someone who'd get more out of it than anyone, but partly because they have expensive taste in general and always have; and the case where giving one person a lot helps them enormously while spreading it thin does almost nothing for anyone — except picking a favorite feels wrong.

  Then run it on three real ones: (1) the car repair for someone who'll lose their job without it, (2) a deposit so someone can leave a bad living situation, and (3) someone asking for money for a hobby-ish thing that would genuinely make their life better but nobody would die without. If the procedure gives an answer I won't like on one of these, say so and don't soften it. And tell me what the procedure just cant decide — the parts where I'm kidding myself if I think there's a right answer.
reasoning: |-
  Okay, the user runs a small mutual-aid group in their neighborhood. About forty people contribute, pooling around $600 monthly. They and two others decide who gets the money, usually $50-$200 for specific needs like car repairs, deposits, meds, or groceries. They need a clear, procedural system to handle disputes among the three decision-makers who have different philosophies: one prioritizing impact, another fairness/equality, and the user focusing on restoring basic capabilities.

  The user explicitly wants a step-by-step procedure that's practical for new volunteers. They need questions in order, criteria for answers, clear no's, and where judgment calls are necessary. They reject pure equality because it can make everyone worse off. They mention tricky cases: someone bad with money, someone who rarely asks but has deep needs, someone with expensive tastes, and situations where concentrating funds helps one person a lot versus spreading it does little.

  They also want the procedure tested on three real cases: car repair (job loss risk), deposit (escaping bad living situation), and a hobby-related request (life improvement without urgency). They insist on honest answers even if unpleasant and want clarity on where the procedure can't decide objectively.

  Now, digging deeper into the user's unspoken needs: They're likely overwhelmed by emotional labor and conflict within the team. The repeated arguments suggest unresolved tension that a procedure could mitigate. They might feel guilt or pressure from rejecting requests and need a system to share the burden. By asking for judgment call boundaries, they're admitting uncertainty and want ethical cover. The emphasis on "capabilities" hints at values like dignity and autonomy—perhaps aligning with concepts like Amartya Sen's capability approach. They might also fear enabling dependency or unfairness, hence wanting rules for "bad with money" cases. Underlying all this is a need for sustainability: keeping the group functional without burning out.

  I'll design the procedure with five phases. Phase 1 screens for basic eligibility (neighbor in the pool, one request per month, specific use). Phase 2 assesses severity across four dimensions: livelihood/safety, health, housing stability, and social dignity—scored from 0 (minor inconvenience) to 3 (crisis). This quantifies "need" without ignoring nuance. Phase 3 evaluates impact per dollar: estimating how much the money changes the person's situation, with adjustments for lasting effects or alternatives. Phase 4 handles dealbreakers like fraud risk or recent aid, with a "fairness check" for frequent requesters. Phase 5 ranks by combined severity/impact scores and distributes funds top-down until the money runs out. 

  Judgment calls are explicit: severity scoring, impact estimation, and dealbreaker assessments require subjective input. The procedure won't resolve philosophical differences but forces them into specific debates (e.g., "Is this housing situation a 2 or 3?"). For the tricky cases: the "bad with money" person gets help only if funds are direct-paid to vendors; the "stopped asking" person might score high in severity if probed about hidden struggles; the "expensive tastes" case is downplayed via impact scoring (baseline comparison). Concentrated vs. spread funds is handled by Phase 5—prioritize high scorers even if unequal.

  Testing on the three cases: Car repair (severity 3, impact 3) and deposit (severity 3, impact 3) both clear easily. The hobby request (severity 1, impact 2) loses unless funds are ample. For "where it can't decide": Severity scores for dignity-related needs (e.g., hobby vs. work clothes) will always be debatable. Also, comparing different need types (health vs. housing) lacks an objective hierarchy. The procedure exposes these dilemmas but doesn't magically solve them.

  This approach balances structure with flexibility, addresses the user's stated pain points, and embeds their capability-focused values. It reduces guilt by making "no" systemic rather than personal. But it requires the three to trust each other's judgments in the gray areas—which is the unresolved human core of their problem.
answer: |-
  Here’s a concrete, step-by-step procedure designed for your mutual-aid group. It’s built to handle ambiguity, force clear decisions, and expose where judgment is unavoidable. **Bold text** = action/question; *Italics* = explanation/rules.

  ---

  ### **Mutual-Aid Decision Procedure (Monthly)**
  **Goal:** Allocate funds to maximize restoration of **basic capabilities**: safety, health, dignity, livelihood, housing stability.  
  **Input:** Requests (with details: amount, purpose, requester’s situation).  
  **Output:** Approved/Rejected, Amount Awarded.  
  **Budget:** $600/month (adjust as needed).

  ---

  #### **PHASE 1: ELIGIBILITY SCREEN (5 mins per request)**
  *   **Question 1:** Is the requester part of our 40-person pool? *If NO, reject. No exceptions.*  
  *   **Question 2:** Is the request $50-$200 for a SPECIFIC, VERIFIABLE need (bill, repair, meds, essential item)? *If NO, reject or ask for clarification.*  
  *   **Question 3:** Has this person received aid **from us** in the last 2 months? *If YES, flag for Phase 4.*  
  *   **Question 4:** Is the request for something illegal or directly harmful? *If YES, reject.*

  #### **PHASE 2: SEVERITY ASSESSMENT (Score 0-3 per category)**  
  *Assess how severely the lack of this thing damages the person's ability to function. Be brutally honest.*  
  *   **Category 1: Livelihood/Safety:** Will losing/not getting this directly cause job loss, homelessness, or immediate physical danger?  
      *(3=Imminent loss/threat, 2=Serious risk, 1=Some inconvenience, 0=No impact)*
  *   **Category 2: Health (Physical/Mental):** Is this essential for treating illness, preventing decline, or managing a disability?  
      *(3=Crisis/prevent hospitalization, 2=Manage chronic condition, 1=Comfort/prevention, 0=Non-essential)*
  *   **Category 3: Housing Stability:** Does this directly prevent eviction, make housing unsafe, or block access to stable housing?  
      *(3=Prevent eviction/make habitable, 2=Avoid severe instability, 1=Improve bad situation, 0=No housing link)*
  *   **Category 4: Basic Dignity/Participation:** Does lack of this cause deep shame, isolation, or prevent essential life activities (e.g., broken glasses, winter coat)?  
      *(3=Severe humiliation/isolation, 2=Significant barrier, 1=Minor frustration, 0=Leisure/convenience)*

  **Severity Score (SS):** Sum of Category scores (Max 12). **Threshold:** SS >= 6 to proceed. *Below 6? Reject unless exceptional (see Phase 4).*

  #### **PHASE 3: IMPACT ASSESSMENT (Score 1-3)**  
  *How much does THIS AMOUNT change THIS PERSON'S situation? Compare to their baseline, not others.*  
  *   **Question:** Will $X solve the *entire* problem, or just part of it?  
      *(3=Full solution, 2=Major progress, 1=Minor help/symbolic)*  
  *   **Question:** Is the impact LIKELY to LAST (e.g., fixed car, secured housing) or TEMPORARY (e.g., groceries)?  
      *(+0.5 if Lasting, +0 if Temporary)*  
  *   **Question:** Are there NO other viable options (family, charities, payment plans)?  
      *(-0.5 if other options exist but are hard, -1 if readily available options ignored)*  

  **Impact Score (IS):** Sum (Max 3.5). **Threshold:** IS >= 2.0 to proceed.

  #### **PHASE 4: DEALBREAKERS & FAIRNESS CHECK (Judgment Zone)**  
  *   **Dealbreaker 1:** Evidence of fraud/misuse? *If YES, reject. Trust but verify (receipts/post-aid check).*  
  *   **Dealbreaker 2:** Is the person likely to use the money *recklessly* based on **consistent past pattern** (not stereotype)? *If YES, require direct payment to vendor/service (e.g., pay mechanic, landlord). If impossible, reject.*  
  *   **Fairness Check:** Has this person received aid **> 3 times in the last year**? *If YES, discuss: Is their situation chronic/catastrophic (override) or manageable (pause aid for 1-2 months)?*  
  *   **"Stopped Asking" Adjustor:** For someone who rarely asks but has high SS, +1 to IS if they seem trapped in "survival mode." *Judgment call: Look for resignation, understated need.*  
  *   **"Expensive Taste" Adjustor:** For non-essential requests (SS<8) where alternatives exist, -1 to IS. *Judgment call: Is this a genuine capability gap or a preference?*

  #### **PHASE 5: RANKING & ALLOCATION**  
  1.  **Total Score per Request:** SS + IS (Max 15.5).  
  2.  **Sort:** Requests by Total Score (Highest first).  
  3.  **Allocate:** Starting from the top, award FULL amount until:  
      *   Budget ($600) is exhausted, OR  
      *   Next request’s score is >2 points lower than last funded.  
  4.  **Partial Funding?** Only if:  
      *   Partial amount SOLVES the problem (e.g., $150 covers half the deposit, landlord accepts it), AND  
      *   Requester confirms partial is useful. Else, reject.  
  5.  **Document:** Reason for approval/rejection (e.g., "SS 10, IS 2.5, Budget exhausted").

  ---

  ### **Handling Your Tricky Cases**
  *   **"Bad with Money":** Phase 4, Dealbreaker 2. Require direct payment. If possible, fund. If not, reject. *The money must work.*  
  *   **"Stopped Asking":** Phase 4, "Stopped Asking Adjustor." Probe gently: "This seems critical. Is $200 really all you need?" Boost impact score if genuine.  
  *   **"Expensive Taste":** Phase 4 Adjustor (-1 to IS). A $200 request for organic groceries when cheap staples work gets downgraded.  
  *   **"Concentrate vs. Spread":** Phase 5 forces ranking. A request scoring 14 gets funded over three scoring 5. *Unequal impact beats equal misery.*

  ---

  ### **Running Your Real Cases**
  1.  **Car Repair ($200): Prevent Job Loss**  
      *   Phase 1: Eligible.  
      *   Phase 2: SS: Livelihood=3 (job loss), Health=0, Housing=2 (risk if no income), Dignity=2 (shame/stress). **SS=7**  
      *   Phase 3: IS: Solves problem?=3 (if $200 fixes it), Lasting?=+0.5 (fixed car), Options?=0 (assume none). **IS=3.5**  
      *   Phase 4: No dealbreakers.  
      *   **TOTAL: 10.5 (HIGH PRIORITY - FUND $200)**

  2.  **Deposit ($200): Leave Bad Living Situation**  
      *   Phase 1: Eligible.  
      *   Phase 2: SS: Livelihood=1 (maybe), Health=2 (unsafe stress), Housing=3 (enables stability), Dignity=3 (escape humiliation). **SS=9**  
      *   Phase 3: IS: Solves?=3 (if $200 secures place), Lasting?=+0.5 (stable housing), Options?=0 (assume none). **IS=3.5**  
      *   Phase 4: No dealbreakers.  
      *   **TOTAL: 12.5 (HIGHEST PRIORITY - FUND $200)**

  3.  **Hobby ($150): "Make life better" (e.g., art supplies, gym)**  
      *   Phase 1: Eligible.  
      *   Phase 2: SS: Livelihood=0, Health=1 (mental health?), Housing=0, Dignity=1 (frustration?). **SS=2** (<6 Threshold!)  
      *   *STOP. Reject in Phase 2.*  
      *   **BUT if forced through:** IS: Solves?=2 (helps), Lasting?=0 (temporary joy), Options?=-1 (likely alternatives). **IS=1**. Total=3. **REJECT.**  
      *   **HARD TRUTH:** Your $600 isn’t for hobbies. Even if SS=4 and IS=2 (Total=6), it loses to car repairs/deposits. Only fund if **all** high-severity requests are met and money remains (rare).

  ---

  ### **Where the Procedure CAN'T Decide (The Judgment Zones)**
  1.  **Severity Scores (Phase 2):** Is chronic pain without meds a "Health 2" or "3"? Is humiliation from worn-out shoes a "Dignity 2" or "3"? *Requires debate & consensus.*  
  2.  **Impact Estimation (Phase 3):** Will $200 *really* pull someone out of a hole, or just delay collapse? How "lasting" is a car repair for a clunker? *Requires experience and local knowledge.*  
  3.  **Dealbreakers (Phase 4):** Is someone "bad with money" or just unlucky? Does the "stopped asking" person need a nudge or respect their choice? *Demands knowing individuals, not just cases.*  
  4.  **Tie-Breaking:** Two requests with identical scores? *No formula. Debate whose capability loss is more acute, or flip a coin.*  
  5.  **The "Why Them?" Question:** The procedure gives reasons ("SS 9, IS 3, Budget"), but it can’t soothe hurt feelings. *Own this: "Our system prioritizes preventing crises. Your need was real, but others faced deeper immediate threats."*

  ---

  **Why this works:**  
  - **Forces specificity:** Stops abstract fights ("fairness" vs. "impact") by quantifying *what kind* of impact matters (capabilities).  
  - **Exposes subjectivity:** Makes judgment calls visible (scoring, adjustors) instead of hiding them.  
  - **Handles edge cases:** Direct payments for "bad with money," scoring boosts for the "stopped asking," downgrades for "expensive tastes."  
  - **Accepts scarcity:** Doesn’t pretend $600 fixes everything. Funds the highest-impact crises first, then stops.  
  - **Scales:** A new volunteer can run Phases 1-3; Phases 4-5 need experienced judgment.

  **Final Advice:** Review past decisions using this system. Did outcomes improve? Adjust scores/thresholds yearly. And rotate the tough Phase 4-5 calls among your trio – it’s exhausting.
