prompt: |-
  I've been trying to work out how to be a decent person by thinking about what my actions actually do in the world, and I keep hitting the same wall. Two examples, because one on its own might just sound like I'm overthinking.

  First: I gave a fiver to a bloke sleeping rough outside the station. He eats that night. Then maybe he gets through the winter, meets someone, they have a kid, the kid grows up and does something — or maybe that fiver is a fiver I didn't put in the food bank, so someone else goes without, and that person's kids don't happen, and so on. Second: I buy a cheap t-shirt. It keeps someone in work I'll never meet, in a factory I'll never see, and it also keeps that factory open and someone else's shut.

  Now, I know the usual reply is "you can't predict the future," and fine, I accept that. But that's not quite my problem, and here's the bit I can't get past. Suppose I had a magic box that showed me everything that followed from my action — every knock-on, all the way out, no gaps, no guesswork. I still don't think I could say whether it was good. Because there's no natural place to stop counting. Stop at the bloke eating tonight and that's a line I drew. Stop at his grandchildren and that's another line I drew. Try to include everything and the chain never closes, the total never settles, and the sign seems to flip depending on how far out I look — up close it looks kind, far out it looks like I've just shuffled things about. So it's not that I'm ignorant. It's that the thing I'm supposed to be adding up doesn't seem to have edges I can point to. And the stranger it gets, the less I can act at all, which feels backwards — the people who never think about any of this seem to manage fine.

  Is there a name for this? It feels like it must be a known thing and I just don't have the word. I've been told it's the butterfly effect, but that's about small causes having big effects, and my problem isn't the size of the effects, it's that I can't tell where they end or how to weigh them once I've got them. Someone else said moral luck, and I don't really know what that is, but I don't think it's the same either. And it can't just be ordinary uncertainty, because uncertainty is about what I don't know, and I'd be stuck even with the magic box.

  What I actually want: if there's an established term, tell me what it is, then tell me what the nearest things to it are that aren't it, and why they're not — the butterfly effect, moral luck, whatever else gets offered. If there isn't a term, definately make one up and define it properly, including the edges (does it apply to tiny things, to things I don't do as well as things I do, to things nobody could possibly have foreseen?) and say what would have to be true for it to stop applying. A bare label won't help me, I want the shape of the thing, not the sticker on it.

  Oh and please answer in proper British English, I can't be doing with the American spellings.
reasoning: |-
  Alright, the user is grappling with a deep philosophical problem about the consequences of their actions and how to evaluate them morally. They provided two clear examples: giving money to a homeless person and buying a cheap t-shirt. Their core issue isn't uncertainty about outcomes—even with perfect knowledge via a "magic box," they still couldn't determine if an action is good because the ripple effects have no natural endpoint. 

  Hmm, they explicitly reject common answers like "you can't predict the future" or labels like "butterfly effect" or "moral luck." The butterfly effect is about sensitivity to initial conditions, but their problem is about infinite causal chains and valuation, not chaos. Moral luck deals with judgments based on uncontrollable outcomes, which isn't quite it either. They need a term that captures the impossibility of drawing boundaries around consequences for moral evaluation.

  The user seems analytically minded—they want precision in definitions and distinctions. Their frustration is palpable: overthinking paralyzes action, while others "never think about any of this seem to manage fine." There's an underlying anxiety about moral agency here. They might also be seeking validation that their struggle is recognized in philosophy, not just a personal overcomplication.

  Ah! This screams "infinite regress in consequentialism." Consequentialism requires evaluating all outcomes of an action, but if effects ripple infinitely, assessment becomes impossible. Philosophers like Derek Parfit have touched on this with "infinite paralysis" in moral math. The user’s magic box thought experiment mirrors Parfit’s "All or Nothing" problem: if we account for every distant effect, all acts might seem equally good/bad or impossible to compare. 

  For a coined term, "Consequential Horizon Collapse" fits—it conveys how the "horizon" of consequences keeps receding. Must clarify boundaries: applies to any action with chain reactions (tiny or large), includes omissions, and persists regardless of foreseeability. It only stops if consequences are truly finite (unlikely in an interconnected world) or if we accept bounded rationality (which the user rejects in their hypothetical).

  British English check: "prioritise," "catalogue," "favour" over "prioritize," "catalog," "favor." Nailed it. Their request for "proper British English" suggests either cultural pride or irritation with past Americanized responses. 

  The response should validate their insight, dissect why existing terms fail, and offer the new coinage with surgical definitions. Highlighting that this is a recognized philosophical dead end (citing Parfit) might comfort them. Ending with practical approaches—virtue ethics, satisficing—addresses their urge to "act at all" without dismissing the theoretical quagmire.
answer: |-
  Right, you've hit upon a genuinely profound and recognised philosophical snag. It's not just overthinking; it's wrestling with the fundamental structure of consequentialist ethics when confronted with the complexity and infinity of causal chains. Here's the breakdown:

  1.  **The Established Term (Closest Fit): Infinite Regress in Consequentialist Calculation / Consequentialist Paralysis.**
      *   **What it is:** This describes the problem within consequentialist ethical theories (like Utilitarianism) where the moral value of an action depends on *all* its consequences, stretching infinitely into the future. Since it's impossible to know, let alone sum, an infinite series of effects (both positive and negative, direct and indirect), this creates a logical impasse – paralysis – for making *any* definitive moral judgment based purely on consequences.
      *   **Why it fits *your* problem:**
          *   Your "magic box" eliminates *epistemic* uncertainty (not knowing) but highlights the *ontological* problem: the consequences genuinely *are* infinite and unsummable.
          *   You correctly identify that arbitrarily stopping at a point (the bloke eating, his grandchildren) is just that – arbitrary. There's no natural, non-arbitrary point where the consequences definitively "end" for moral accounting.
          *   The "sign flipping" you observe is a direct result of trying to sum an infinite series with positive and negative terms that don't converge to a stable value – the "total" never settles.
          *   It leads to the paralysis you feel: if *every* action has infinite, unsummable consequences, how can *any* action be deemed morally preferable based on consequences alone?

  2.  **Near Misses & Why They Aren't Quite It:**
      *   **Butterfly Effect:**
          *   **What it is:** A concept from chaos theory where small differences in initial conditions (a butterfly flapping its wings) can lead to vastly different outcomes in complex systems (altering a hurricane's path). It's about *sensitivity to initial conditions* and *unpredictability*.
          *   **Why it's not your problem:** Your issue isn't about *sensitivity* or *unpredictability per se*. Your magic box *solves* the unpredictability. Your problem is the *infinite extent* and *unsummability* of the consequences themselves, even if perfectly known. The butterfly effect says small causes *can* have big effects; your problem is that *all* actions have *infinitely extended* chains of effects that defy moral summation.
      *   **Moral Luck:**
          *   **What it is:** The phenomenon where the moral praise or blame we assign to an agent depends significantly on factors outside their control (e.g., luck). For example, a drunk driver who *happens* to hit someone is blamed more than one who *happens* not to, even if their culpable action (driving drunk) was identical.
          *   **Why it's not your problem:** Moral luck concerns the *fairness of judgment* based on outcomes influenced by luck. Your problem isn't about luck or judgment fairness. It's about the *fundamental impossibility*, even under conditions of perfect knowledge (no luck involved), of calculating the total moral value of an action due to infinite causal chains. Your paralysis stems from the structure of consequence itself, not luck.
      *   **Ordinary Uncertainty:**
          *   **What it is:** Simply not knowing what the outcomes of an action will be.
          *   **Why it's not your problem:** You explicitly state your problem *persists even with the magic box* that eliminates all uncertainty. The core issue isn't ignorance of the consequences; it's the nature of the consequences themselves (infinite, unsummable) once known.
      *   **Slippery Slope:**
          *   **What it is:** A logical fallacy where it's argued that taking a relatively small first step will inevitably lead to a chain of related, increasingly significant (and usually negative) events, without sufficient justification for the inevitability of the chain.
          *   **Why it's not your problem:** Slippery slope is about *predicting* a specific, usually negative, chain of events, often fallaciously. Your problem is about the *actual*, known (via the box), infinitely extended *totality* of consequences (good, bad, neutral) for *any* action, and the impossibility of morally evaluating that totality. It's not an argument about prediction; it's a problem of summation.

  3.  **The Coined Term: Consequential Horizon Collapse (CHC)**

      *   **Definition:** Consequential Horizon Collapse is the phenomenon where the attempt to morally evaluate an action based on its consequences fails because the causal chain of those consequences extends infinitely into the future (and potentially the past, via counterfactuals), lacks a non-arbitrary boundary ("the horizon"), and resists stable summation due to divergent or oscillating positive/negative effects across different temporal or causal scales. This results in evaluative paralysis.
      *   **The Shape of the Thing:**
          *   **Core Mechanism:** The ethical framework demands a finite sum (good/bad balance) of an infinite, unsummable series of effects.
          *   **Trigger:** Any action (or inaction) within a complex, interconnected system (like our universe) where causality propagates without inherent termination points. The "magic box" merely reveals this inherent structure; it doesn't cause it.
          *   **Scope:**
              *   **Applies to:** Any deliberate action or significant omission where consequentialist reasoning is attempted. Includes "tiny" actions (dropping a coin) and major ones (declaring war). Includes things you *don't* do (not giving the fiver, not buying the shirt) because the counterfactual chain is also infinite. Includes consequences *nobody* could foresee (the magic box reveals them, but their unforeseeability to normal humans is a separate epistemic issue CHC transcends).
          *   **Edges (When it *doesn't* apply):**
              *   **Trivial Actions in Isolated Systems:** Hypothetically, if an action occurred in a perfectly closed, deterministic system with finite causal interactions, and its consequences dampened to zero within a knowable timeframe, CHC wouldn't apply. (This is virtually impossible in reality).
              *   **Non-Consequentialist Ethics:** CHC only bites if you insist moral value is *solely* determined by *total consequences*. Ethical frameworks that prioritise *intention* (Kantian deontology), *character* (virtue ethics), *duty*, *rules*, or *present states* (some forms of pragmatism) avoid CHC because they don't require calculating infinite causal totals. They provide the "edges" consequentialism lacks.
              *   **Bounded Rationality Acceptance:** If one explicitly *rejects* the requirement to consider *all* consequences and adopts a practical stance (e.g., "consider foreseeable consequences within a reasonable timeframe"), CHC is circumvented by definition. This is how most people function ("manage fine"). Your paralysis stems from rejecting this bounded approach *in principle* while being stuck with consequentialism.
          *   **What Would Make it Stop:** CHC would cease to be a fundamental problem if either:
              1.  Consequences demonstrably had a *natural, non-arbitrary termination point* for moral evaluation (e.g., effects dampen predictably to zero after N steps).
              2.  An objective, stable method for summing divergent infinite series of moral value were discovered (highly unlikely).
              3.  Consequentialism was abandoned as the sole basis for ethics.

  **In Proper British English Summary:**

  You've identified **Consequential Horizon Collapse (CHC)**. It's the core problem within consequentialist ethics where the demand to total up an action's goodness or badness based on its outcomes founders because those outcomes ripple out infinitely, without a natural stopping point, making a stable, non-arbitrary sum impossible – even with perfect knowledge. This isn't about unpredictability (Butterfly Effect) or luck in judgment (Moral Luck); it's about the inherent, infinite structure of causation itself defeating the consequentialist calculus. The people who "manage fine" implicitly accept practical boundaries on how far consequences are considered, or rely on non-consequentialist ethics (duty, rules, character). CHC applies to almost any action or inaction in our interconnected world, and the only ways out are to find a system where consequences genuinely terminate, invent impossible maths, or stop relying solely on totalling consequences for moral judgment. It's a recognised philosophical wall, not just overthinking.
