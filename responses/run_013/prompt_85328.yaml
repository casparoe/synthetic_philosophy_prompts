prompt: |-
  I'm in the second term of a course on American foreign policy and I keep meeting a phrase that appears to do an enormous amount of argumentative work while resisting any single clear meaning. Last week, in a seminar on the post-war order, a classmate invoked 'a city upon a hill' to wave away a comparison between the United States and other great powers: America, she said, is not simply one state among others, so the usual comparisons miss the point. Within twenty minutes the same phrase was being used by someone else to argue what sounded like the opposite — that America's peculiar standing loads it with obligations other states do not carry — and then a third person used it to mean that the country is watched, and will be judged, more harshly than anyone else. My suspicion is that these are three different claims wearing one costume, and that at least one of them does not follow from the reading it was enlisted for. I don't want an essay on the phrase's history or its best-known users, and I don't need sources or reading lists; I want the underlying claims separated out.

  Please give me a menu of the precise claims that sentence could be making, ordered from readings so thin that nobody could sensibly deny them up to the strong and contested ones, and for each say whether it is a platitude, a substantive but defensible thesis, or something false, and what sort of consideration would tell for or against it. I'm especially interested in the readings on which it is a claim about the country's relation to a moral or legal order: that it is a model others ought to copy, that it is exempt from standards that bind others, that it is bound more tightly than others, that it has a mission that overrides ordinary constraints, or something else again. For every reading, tell me which of the three uses above it would actually support, and flag any reading that is being asked to license a conclusion it cannot deliver. I'd also like to know which readings are about what the country has in fact been, which are about what it ought to be, and which are better understood as a piece of collective self-description whose function is to mark who is inside the story — and whether any of those three can be held without the others.

  Since I'll be taking this into an argument I care about, I'd rather have your confidence calibrated than your conclusions tidy: say which of your verdicts are firm and which are genuinely contestable, what argument or evidence would make you reverse one, and where your reasoning is most likely to be going wrong. Please write in British English.
reasoning: |-
  Okay, let me tackle this user's request systematically. The user is grappling with the phrase "a city upon a hill" in their American foreign policy course, observing how it's used to support contradictory claims. They want a precise breakdown of the underlying assertions this phrase makes, categorized by strength and defensibility, without historical digressions.

  First, I need to map the phrase's possible meanings onto a spectrum from uncontroversial to highly contested. The user specifically wants:
  - Distinction between descriptive, normative and constitutive claims
  - Analysis of America's relation to moral/legal orders
  - Evaluation of which seminar arguments each reading supports
  - Confidence calibration for each interpretation

  The three seminar uses mentioned are:
  1. American exceptionalism (incomparability)
  2. Special obligations
  3. Heightened scrutiny

  I'll start with the thinnest reading: the literal observation principle. Everyone agrees being powerful draws attention - that's irrefutable. Then move to aspirational claims about being a model, which is defensible but requires evidence of actual influence. 

  The constitutive function is crucial here - when Americans invoke this phrase, they're often reinforcing national identity rather than making testable claims. This explains why the same phrase can support opposing arguments; it's serving as a rhetorical badge of belonging.

  For the normative claims about exemptions or obligations, I must flag the is-ought problem sharply. No factual observation about America's influence logically justifies moral exceptionalism - that's a non sequitur hiding in the second seminar argument. The third claim about heightened scrutiny at least has psychological plausibility.

  Where I need to be most cautious is evaluating "mission override" claims. While empirically false (states always balance ideals with interests), this remains a powerful motivator in US policy discourse - so I'll note it's contestable but prevalent in self-conception.

  Throughout, I'll maintain British English as requested, and explicitly state where my confidence comes from (e.g., historical patterns for descriptive claims) versus where reasonable disagreement exists (e.g., whether special obligations follow from being observed).
answer: |-
  Here is a disambiguation of the claims embedded within "a city upon a hill," structured as requested. I'll categorise them by type (descriptive, normative, constitutive), assess their strength, identify which seminar argument they support, and flag limitations. Confidence levels and contestability are noted throughout.

  **The Core Menu of Claims:**

  1.  **The Observation Claim (Descriptive):**
      *   **Precise Claim:** The United States, due to its power, founding ideals, historical pronouncements, and global presence, attracts significant attention and scrutiny from other nations and peoples ("the eyes of all people are upon us").
      *   **Type:** Descriptive (about what *is*).
      *   **Strength:** Platitude bordering on empirically verifiable fact. Highly defensible based on historical record, media coverage, academic analysis, and global discourse. Nobody could sensibly deny that the US *is* extensively watched.
      *   **Evidence For:** Historical record of global focus on US actions/policies; volume of international media coverage; polling data on global opinions.
      *   **Evidence Against:** Arguments would need to demonstrate the US receives *less* scrutiny than comparable powers (e.g., historical focus on British Empire, contemporary focus on China/Russia) relative to its impact, which is highly improbable.
      *   **Supports Seminar Argument:** Primarily the *third* use (judged more harshly), though only as a premise *for* heightened scrutiny, not the judgement itself.
      *   **Confidence:** Very High. This is the bedrock, observable reality the metaphor builds upon.
      *   **Limitation:** Does not, by itself, entail *any* normative conclusions about obligation, exemption, or the *nature* of the scrutiny (admiration vs. condemnation).

  2.  **The Aspirational Model Claim (Normative/Descriptive Hybrid):**
      *   **Precise Claim:** The US *aspires* to be, or *is presented* (internally and externally) as, a model society embodying specific ideals (liberty, democracy, opportunity) that others *ought* to emulate or find admirable. Its purpose, in part, is to exemplify these ideals.
      *   **Type:** Primarily Constitutive (shaping self-identity/purpose), with descriptive elements (about the aspiration being real) and weak normative elements (the ideals *implied* are good).
      *   **Strength:** Substantive but defensible thesis regarding self-conception and declaratory policy. Deeply embedded in founding documents, presidential rhetoric, and civic mythology. The claim that this aspiration *exists* is strong; claims about its *success* or *universal desirability* are weaker and contested.
      *   **Evidence For:** Foundational texts (Declaration, Constitution), pervasive political rhetoric (from Winthrop to Reagan to Biden), analysis of "American exceptionalism" as an ideology.
      *   **Evidence Against:** Historical counter-examples (slavery, segregation, imperialism), critiques of the ideals themselves (e.g., as individualistic, capitalist), evidence of foreign rejection of the "model."
      *   **Supports Seminar Argument:** Supports the *first* use (incomparability - *if* framed as unique aspirational purpose) and provides a *basis* for the *second* use (obligations - *if* linked to upholding the model). Does not directly support the third (harsher judgement).
      *   **Confidence:** High for the existence of the aspiration as a core part of US self-identity. Moderate-to-Low for claims about its actual realisation or universal normative appeal.
      *   **Limitation:** An aspiration is not an achievement. Saying "we *aim* to be a model" does not mean "we *are* a model others *must* copy," nor does it logically entail exemption or special burdens. It can, however, create *felt* obligations internally.

  3.  **The Constitutive Identity Claim (Constitutive):**
      *   **Precise Claim:** Invoking "a city upon a hill" functions primarily as an act of national self-definition. It signals shared belonging to a community defined by a specific historical narrative and set of proclaimed ideals. Its power lies in affirming "who we are" and "what our story is," binding insiders together.
      *   **Type:** Constitutive (creates/maintains identity).
      *   **Strength:** Defensible thesis about rhetorical function. Central to understanding how national myths operate politically and socially.
      *   **Evidence For:** Analysis of political speech acts, sociological studies of national identity, the very phenomenon observed in the seminar (its versatile usage).
      *   **Evidence Against:** Would require showing the phrase *lacks* this identity-marking function in US discourse, which is implausible.
      *   **Supports Seminar Argument:** Underpins *all three* uses. The phrase's power to support divergent arguments (*first*, *second*, *third*) stems precisely from its role as a shared, foundational, but vague, element of constitutive identity. Different speakers draw different implications *from* this shared identity marker.
      *   **Confidence:** High. This explains the phrase's enduring rhetorical power and flexibility.
      *   **Limitation:** While explaining *why* the phrase is used, it doesn't validate any *specific* normative or descriptive claim derived from it. It highlights that disagreement often happens *within* a shared narrative frame.

  4.  **The Source of Special Obligation Claim (Normative):**
      *   **Precise Claim:** Because the US *claims* unique moral standing (as the "city") and *is* intensely watched (Observation Claim), it *has* heightened moral obligations or responsibilities in international conduct that other states do not share. It must "live up to" its professed ideals more rigorously.
      *   **Type:** Normative (about what *ought* to be).
      *   **Strength:** Substantive and highly contested thesis. A defensible *moral argument* if one accepts the premises of unique aspirational purpose and the significance of scrutiny, but not logically *necessary*.
      *   **Evidence For:** Moral philosophy arguments about consistency, hypocrisy, and the duties accompanying proclaimed virtue; historical instances where US actors felt bound by this logic.
      *   **Evidence Against:** Realist arguments that states inherently pursue interests, not ideals; critiques that this is a form of narcissism or imposes unrealistic burdens; historical evidence of the US violating ideals without accepting unique culpability.
      *   **Supports Seminar Argument:** Explicitly the *second* use (obligations others don't carry).
      *   **Confidence:** Low-to-Moderate. It's a plausible *moral perspective* derived from the constitutive identity and observation, but **cannot be logically derived solely from them.** It requires an additional, contestable normative step: that professed ideals + being watched *create* unique duties beyond general duties states have (e.g., upholding international law). **This is where the seminar use might overreach, trying to derive "ought" directly from "is watched" and "aspires."**
      *   **Limitation:** Easily slides into double standards ("We have *more* obligations... but also sometimes *different* rules?") or hubris. Does not specify *what* the obligations are.

  5.  **The Exemption Claim (Normative):**
      *   **Precise Claim:** The US's unique role, mission, or status as the "city upon a hill" means it is *not* bound by the same rules, norms, or constraints (moral or legal) that apply to other states. Its higher purpose justifies exceptional actions.
      *   **Type:** Normative (about what *ought* to be permitted).
      *   **Strength:** Substantive and highly contested thesis. Often implicit rather than explicit.
      *   **Evidence For:** Historical doctrines (e.g., Manifest Destiny), justifications for unilateralism or interventions framed as promoting liberty/order, rhetoric implying inherent righteousness of US actions.
      *   **Evidence Against:** International law principles of sovereign equality; moral arguments against exceptionalism; historical examples of disastrous consequences from acting on this belief; critiques of hypocrisy.
      *   **Supports Seminar Argument:** Can be a hidden premise *within* the *first* use ("incomparable" meaning *not subject to the same standards*). It directly contradicts the *second* use (obligations) and is orthogonal to the *third* (scrutiny).
      *   **Confidence:** Firm that this claim *is made* implicitly. Firm that it is **False** as a defensible, universal normative principle. Its contestability lies in its persistent appeal within parts of US discourse and its use to justify specific policies, not in its logical or moral defensibility overall. **Cannot be validly derived from the Observation or Aspirational Model claims alone.** Requires a separate, dubious normative axiom (e.g., "Our cause is always just").
      *   **Limitation:** The most dangerous and logically weakest claim. Often smuggled in under the guise of uniqueness.

  6.  **The Magnet for Scrutiny & Judgement Claim (Descriptive/Normative Hybrid):**
      *   **Precise Claim:** Because the US *is* intensely watched (Observation Claim) and *professes* high ideals (Aspirational Model Claim), its actions *are* consistently judged by a harsher standard than those of other states. Failures to live up to its professed ideals attract disproportionate condemnation (hypocrisy charge), while successes might be downplayed. The gaze itself implies judgement.
      *   **Type:** Primarily Descriptive (about a perceived reality), with normative undertones (about the *reason* for the scrutiny/judgement).
      *   **Strength:** Substantive and defensible, though contestable in degree. A plausible psychological and political dynamic.
      *   **Evidence For:** Comparative analysis of international reactions to similar actions by different states; prevalence of "hypocrisy" critiques against the US; discourse analysis.
      *   **Evidence Against:** Examples of other states facing harsh critiques for violations; instances where US actions aligned with ideals were praised; arguments that US power, not its ideals, is the primary driver of scrutiny.
      *   **Supports Seminar Argument:** Explicitly the *third* use (watched and judged more harshly).
      *   **Confidence:** Moderate-to-High. The dynamic is plausible and frequently observed, supported by the Observation and Aspirational Model claims. Contestability lies in proving it's *consistently* harsher than scrutiny applied to other powerful states acting contrary to *their* stated values.
      *   **Limitation:** Does not inherently entail that the *harsher judgement is justified*, only that it occurs. Does not specify *moral* obligations for the US, only predicts *reactions*.

  **Summary & Key Takeaways for Your Argument:**

  *   **Foundation:** The Observation Claim (#1) and Constitutive Identity Claim (#3) are core, defensible realities explaining the phrase's power and the *fact* of scrutiny.
  *   **Aspiration vs. Reality:** The Aspirational Model Claim (#2) describes a potent element of self-identity, but confusing aspiration with achievement is a common error.
  *   **Normative Quagmire:** The Special Obligation (#4) and Exemption (#5) claims are **highly contested normative leaps**. Crucially:
      *   **#4 (Obligation):** While a common *feeling* derived from identity, it **cannot be logically derived solely from being watched or aspiring to be good.** It requires additional moral premises. A seminar argument using "city on a hill" *alone* to justify unique obligations is likely overreaching.
      *   **#5 (Exemption):** Is **logically invalid and morally indefensible** as a general principle, though historically invoked. It fundamentally contradicts the premise of being a *moral* model. Any seminar argument implying incomparability *means* exemption is smuggling in a dangerous and unsupported claim.
  *   **Heightened Scrutiny:** The Magnet for Scrutiny claim (#6) is a plausible, defensible consequence of #1 and #2, supporting the third seminar argument.
  *   **The Constitutive Function is Key:** Understanding #3 explains *why* the same phrase (#1, #2) can be wielded to support divergent normative conclusions (#4, #5, implications of #6). It's about affirming shared belonging to the story first, specific policy second.
  *   **Holding Claims Separately:** One *can* hold the descriptive (#1, #6) and constitutive (#3) claims without accepting the strong normative claims (#4, #5). The Aspirational claim (#2) can be held descriptively (this is what Americans believe) without endorsing it normatively (this is right/good). However, the normative claims (#4, #5) *depend* on the constitutive (#3) and often the aspirational (#2) claims for their rhetorical force, even if not their logical validity.
  *   **Calibration of Confidence:** Highest on descriptive foundations (#1, #3). Moderate-High on the scrutiny dynamic (#6). Moderate on the existence/power of the aspiration (#2). Low on the logical derivation of unique obligations (#4) from the descriptive claims. Firmly reject the exemption claim (#5) as a defensible principle, while acknowledging its historical use. The contestability often lies in the *move* from description/identity to strong normative conclusions.

  **For your seminar debate:** Focus on disentangling the descriptive/constitutive base from the normative superstructure. Challenge any attempt to derive "unique obligations" or "exemption" *solely* from "we are watched" or "we aspire to be good." Argue that the heightened scrutiny (#6) is a predictable consequence, not a source of unique moral duty (#4), and that exemption (#5) is incompatible with the very ideals invoked. The phrase's power comes from identity (#3), not from granting logical licence for specific policy conclusions.
