answer: |-
  Here's a systematic breakdown of counterarguments to your intention-only view of implicature, sorted by decisiveness, with clear analysis of whether you can "wriggle out" and the implications:

  ### **Most Decisive Counterarguments (Hard to Wriggle Out Of)**
  1. **Conventional Implicatures (e.g., "but", "therefore")**  
     - **Case**: Uttering "She’s poor but honest" conventionally implicates a contrast between poverty and honesty, even if the speaker denies intending it (e.g., "I just meant ‘and’!").  
     - **Why it counts**: The implication is attached to the word itself, not the speaker’s psychology. Hearers reliably infer it regardless of intention.  
     - **Can you wriggle out?** Only by stretching "intention" to include *dispositional acceptance of linguistic conventions* (e.g., "Speakers tacitly intend standard meanings").  
     - **Cost**: Makes intention vacuous. If "intention" just means "using a word with conventional force," the theory becomes circular: implicatures exist because conventions exist, not because of mental states.

  2. **Dead Author / Unintended Cultural Implications**  
     - **Case**: Shakespeare’s Shylock speeches are read as antisemitic today, though evidence suggests Elizabethan audiences didn’t share this interpretation. Modern readers *necessarily* infer the implicature.  
     - **Why it counts**: The speaker’s actual intention is unknowable or irrelevant; the implicature arises from linguistic structure + cultural context.  
     - **Can you wriggle out?** Only by claiming the *text itself* "intends" via convention (anthropomorphizing language) or positing a "dispositional intention of the era" (which is not a mental state).  
     - **Cost**: Abandons the core requirement of a *speaker’s* intention, collapsing into textualism.

  ---

  ### **Strongly Damaging Counterarguments (Wriggling Out Requires Unpalatable Moves)**
  3. **Default Inferences (e.g., "some" → "not all")**  
     - **Case**: A speaker says "Some philosophers agree with me" unaware of the scalar implicature ("not all"). Hearers still infer it.  
     - **Why it counts**: The inference is automatic and triggered by linguistic structure (Grice’s maxim of quantity), not the speaker’s conscious intent.  
     - **Can you wriggle out?** Yes, via *subconscious* adherence to Gricean norms ("Speakers dispositionally intend efficient communication").  
     - **Cost**: Invoking "unconscious intention" risks unfalsifiability. Any inference can be retrofitted to a hypothetical disposition.

  4. **Translator’s Added Implicature**  
     - **Case**: Translating a neutral Japanese sentence like "彼は遅刻した" ("He was late") as "He deigned to grace us with his presence" in English, adding sarcasm absent in the original.  
     - **Why it counts**: The translator may intend fidelity, not sarcasm. Yet the output sentence *conventionally* implicates contempt.  
     - **Can you wriggle out?** You could argue the translator *secondarily* intends the implications of their word choice.  
     - **Cost**: Forces you to treat translators as *speakers* (not conduits). Implicature becomes a property of the utterance, not the original speaker’s mind.

  ---

  ### **Debatable Cases (Intention-Theorists Can Resist)**  
  5. **AI-Generated Implicature**  
     - **Case**: An LLM outputs "Some studies support this claim," leading humans to infer "not all studies do."  
     - **Why it *might* count**: Implicature is observer-relative; there’s no speaker to have intentions.  
     - **Can you wriggle out?** Easily: No speaker → no implicature, only "inference patterns." LLMs simulate speech acts without intentionality.  
     - **Cost**: None for your view. Conceding this doesn’t harm the theory—it reinforces the need for a mind.

  6. **Speaker Ignorance of Connotations**  
     - **Case**: A non-native speaker says "That’s so gay" intending "lively," unaware of the derogatory implicature.  
     - **Why it *might* count**: The hearer infers offense the speaker didn’t intend.  
     - **Can you wriggle out?** Yes: The speaker *doesn’t* successfully implicate it because they lack the requisite intention. It’s a hearer inference.  
     - **Cost**: None. This aligns with Grice: M-intention (meaning-intention) requires awareness.

  ---

  ### **Critical Meta-Issue: Does Wriggling Out Sink Your Theory?**
  - **Unconscious/Dispositional Intentions**: If you invoke these to save every counterexample:  
    - **✅ Pro**: Preserves your core claim ("All implicature is intention-driven").  
    - **❌ Con**: Makes your theory **unfalsifiable**. Any observed implicature can be "explained" by attributing a hidden intention.  
    - **Is this a problem?** **Yes, if you value empirical accountability**. A theory that can’t be disproved by evidence is weak (Popperian falsifiability). It becomes a tautology: "Implicatures exist when speakers intend them... because we define intention as whatever causes implicatures."  

  - **The Tradeoff**:  
    - **Strict intention-only view**: Clean but brittle—falters on conventional/dead-author cases.  
    - **Flexible intention view** (unconscious/dispositional): Robust but risks vacuity.  

  ---

  ### **What Would a Committed Intention-Theorist Concede?**
  1. **Conventional implicatures** are the hardest counterexample. Many (e.g., Grice himself) bite the bullet and classify them as non-implicature (e.g., "conventional presuppositions").  
  2. **Dead authors** might be conceded as "not implicature *strictly speaking*," but intention-theorists often reframe it as "reader inferences," preserving speaker-centricity.  
  3. **AI/Translators** would be dismissed: Translators are intentional agents; AIs aren’t speakers.  

  ### **Conclusion**
  Your view **can** survive all counterexamples by stretching "intention" to cover unconscious dispositions and conventions—but at the cost of **falsifiability**. The most decisive objections (**conventional implicatures** and **dead authors**) force a choice:  
  - **Option 1**: Admit non-intentional implicature exists (e.g., as structural or conventional phenomena).  
  - **Option 2**: Double down on intention, accepting that your theory is unfalsifiable and semantic (true by definition).  

  If you want a *psychologically real* account of communication, Option 1 is stronger. If you want a *conceptually pure* account of speaker meaning, Option 2 holds—but at the price of empirical substance.
