  **Predictable Problems:**

  1. **Sincere Voting:** Students might not vote as per their role. Solution: Emphasize that they are playing a role and that the activity only works if they vote as assigned. The role card should be clear about their ranking.

  2. **Blocs not accepting the cycle:** After seeing the cycle, a bloc might say, "But in our bloc, we don't really prefer A over C" (for example). Solution: Remind them that the preferences are assigned and that in real life, groups have different priorities. The point is that with diverse preferences, cycles can emerge naturally.

  3. **Time management:** The pairwise votes might take longer than expected. Solution: Use show of hands and quick counting. Have a TA or a student help count.

  4. **Tie in voting:** We have avoided ties by design, but if a tie happens, we can flip a coin or have a runoff.

  5. **Complaints about options:** Students might say the packages were set up to cause problems. Solution: Point out that in real life, policy packages are multi-dimensional and voters have different priorities. The activity is a simplified model.

  **What the activity cannot reproduce:**
  - Strategic voting: Students are voting sincerely. We can mention in the debrief that in real elections, voters might not vote sincerely, which can change outcomes.
  - The cycle might be rare in practice because preferences are often single-peaked. We can mention that this paradox arises when preferences are diverse in a particular way.

  **Materials:**
  - Role cards for each bloc (16 cards, with 5 for Bloc1, 5 for Bloc2, 6 for Bloc3).
  - Whiteboard or flip chart to record votes.
  - Markers.

  **Debrief Prompts:**

  Phase1:
  - "In round 1, we ended up with C. In round 2, A won. In round 3, B won. How can the same class with the same preferences choose three different winners?"
  - "Look at the pairwise results: A beats B, B beats C, C beats A. How is that possible? Does the group have a clear favorite?"
  - "What does this say about the influence of the order of voting (the agenda)?"

  Phase2:
  - "When we voted on each dimension separately, we got package C (Cinema, Movie, Restaurant). But when we voted on the entire package, B beat C. How can that be?"
  - "Is there a contradiction here? Which vote truly represents the majority will?"
  - "If we were to design the outing based on the issue-by-issue vote, we would get C. But if we let the group vote between B and C, they choose B. Which should we use?"

  General:
  - "What does this imply for real-world elections and referendums?"
  - "How might we avoid these problems? Are there better voting methods?"
  - "Do you think the way we defined the packages caused these issues? How might we define options to avoid cycles?"

  Finally, conclude by connecting to the course themes: The activity shows that the concept of "majority rule" is not straightforward and depends on the voting procedure.
answer: |-
  Below is a comprehensive activity designed for your seminar. It addresses both the Condorcet paradox (cyclic preferences) and the Ostrogorski paradox (issue-by-issue vs. package voting) using a realistic scenario tied to your end-of-term outing. The preferences emerge naturally from assigned roles, avoiding the "trick" perception. The £30 discretionary funds and outing planning provide a genuine stake. The activity runs in 90 minutes, with detailed timing, roles, materials, and debriefing prompts.

  ---

  ### **Activity Title:** "The Outing Dilemma: Majority Rule in Action"

  ### **Learning Goal:** Students will discover that "what the majority wants" is not an objective fact but depends on voting procedures, due to cyclic preferences (Condorcet paradox) and multidimensional aggregation (Ostrogorski paradox).

  ### **Scenario:**  
  The class must decide on an end-of-term outing using the £30 discretionary fund. The outing has **three dimensions**, each with **three options** (creating 27 possible packages). Three pre-selected packages (A, B, C) will be voted on, reflecting realistic trade-offs. The activity has two phases:  
  1. **Phase 1: Agenda Manipulation** (Cyclic preferences via pairwise votes).  
  2. **Phase 2: Issue-by-Issue vs. Package Voting** (Ostrogorski paradox).  

  ### **Roles and Preferences:**  
  Divide students into three **blocs** (5/5/6 students). Each bloc prioritizes a different outing dimension, leading to sincere, non-perverse rankings. Preferences cycle naturally (A>B, B>C, C>A) without manipulation.  

  | Bloc          | Size | Priority Order | Package Rankings (Sincere) | Rationale (Role Card Summary)                                                                 |
  |---------------|------|----------------|----------------------------|----------------------------------------------------------------------------------------------|
  | **Budget Hawks** | 5    | Cost > Food > Activity | **A** > B > C              | "Minimize cost; prefer affordable options. Package A is cheapest, C is most expensive."      |
  | **Foodies**     | 5    | Food > Activity > Cost | **B** > C > A              | "Maximize food quality; cost is secondary. Package B has the best food, A has the worst."    |
  | **Experience Seekers** | 6    | Activity > Cost > Food | **C** > A > B              | "Prioritize fun activities; budget matters but isn't decisive. Package C has the best activity, B is boring." |  

  #### **Packages:**  
  - **A**: Low Cost (£5), Basic Food (fast food), Casual Activity (walking tour).  
  - **B**: Medium Cost (£15), Quality Food (local restaurant), Educational Activity (museum visit).  
  - **C**: High Cost (£25), Premium Food (fine dining), Exciting Activity (escape room).  

  #### **Why Preferences Cycle Naturally:**  
  - **Budget Hawks** rank **A>B>C**: A is cheapest; B is acceptable; C is too expensive.  
  - **Foodies** rank **B>C>A**: B has best food; C has good food; A has worst food.  
  - **Experience Seekers** rank **C>A>B**: C has best activity; A is affordable/fun; B is dull.  
  - **Cycle Emerges**:  
    - A beats B (Budget Hawks + Experience Seekers = 11 vs. 5).  
    - B beats C (Budget Hawks + Foodies = 10 vs. 6).  
    - C beats A (Foodies + Experience Seekers = 11 vs. 5).  

  No bloc is irrational—each defends its priorities. The cycle arises from honest disagreements on dimensions.

  ---

  ### **Materials:**  
  - **Role Cards**: 16 cards (one per student) explaining the bloc’s priorities, rankings, and rationale.  
  - **Voting Slips**: For pairwise and package votes.  
  - **Whiteboard/Projector**: To track votes, winners, and dimensions.  
  - **Timer**: For strict timekeeping.  
  - **Scoring Tokens** (non-monetary stake): Distribute 3 tokens per student to "bet" on voting outcomes (explained below).  

  ---

  ### **Scoring Scheme (Stake Without Money):**  
  - Each student receives **3 tokens** at the start.  
  - **Earning Tokens**: Students earn 1 token if their **top-ranked package** wins a vote.  
  - **Losing Tokens**: Students lose 1 token if their **bottom-ranked package** wins.  
  - **Final Reward**: After the debrief, tokens are converted into "influence points" for the real outing:  
    - Students with 3+ tokens vote on **one extra detail** (e.g., dessert option).  
    - Students with 0 tokens lose voting rights on **one minor detail** (e.g., transportation).  
  This creates stakes (privileges in outing planning) without money, incentivizing sincere voting.  

  ---

  ### **Timeline (90 Minutes):**  

  #### **0:00–0:10 (10 mins): Setup and Role Assignment**  
  - **Rules**: Explain the outing scenario, roles, tokens, and voting goals. Emphasize: "Vote as your bloc—defend your priorities!"  
  - **Assign Roles**: Randomly divide students into three blocs (5/5/6). Hand out role cards.  
  - **Clarify**: "We’ll vote on packages first, then individual dimensions."  

  #### **0:10–0:40 (30 mins): Phase 1 – Cyclic Preferences via Pairwise Votes**  
  - **Goal**: Run three pairwise vote rounds with different agendas, producing three different winners.  
  - **Rules**: Majority wins each pairwise vote. Record votes on whiteboard.  
  - **Procedure**:  
    1. **Round 1 Agenda (A vs. B → Winner vs. C)**:  
       - Vote 1: A vs. B. **A wins** (11–5).  
       - Vote 2: A vs. C. **C wins** (11–5).  
       - **Winner: C**.  
    2. **Round 2 Agenda (B vs. C → Winner vs. A)**:  
       - Vote 1: B vs. C. **B wins** (10–6).  
       - Vote 2: B vs. A. **A wins** (11–5).  
       - **Winner: A**.  
    3. **Round 3 Agenda (C vs. A → Winner vs. B)**:  
       - Vote 1: C vs. A. **C wins** (11–5).  
       - Vote 2: C vs. B. **B wins** (10–6).  
       - **Winner: B**.  
  - **Token Update**: Award/take tokens based on each round’s winner.  

  #### **0:40–0:60 (20 mins): Phase 2 – Ostrogorski Paradox**  
  - **Goal**: Vote on dimensions separately, then on packages, showing opposite outcomes.  
  - **Rules**:  
    - **Issue-by-Issue**: Majority vote on each dimension (Cost, Food, Activity).  
    - **Package Vote**: Majority vote on two packages (B vs. C).  
  - **Procedure**:  
    1. **Issue-by-Issue Vote**:  
       - Vote on **Cost**: Low (A) vs. Medium (B) vs. High (C). **Low (A) wins** (Budget Hawks + Experience Seekers = 11).  
       - Vote on **Food**: Basic (A) vs. Quality (B) vs. Premium (C). **Quality (B) wins** (Foodies + Experience Seekers = 11).  
       - Vote on **Activity**: Casual (A) vs. Educational (B) vs. Exciting (C). **Exciting (C) wins** (Foodies + Experience Seekers = 11).  
       - **Result**: Package **B** wins on food, **C** wins on activity, **A** wins on cost—no single package wins all dimensions.  
    2. **Package Vote**:  
       - Vote: **B vs. C**. **B wins** (10–6: Budget Hawks + Foodies).  
       - **Token Update**: Award/take tokens based on winner.  
  - **Paradox Emergence**:  
    - Issue-by-issue: No package wins all, but **B wins on the most dimensions** (food).  
    - Package vote: **B beats C** (majority prefers B as a package).  
    - **Contradiction**: B wins the package vote, but C wins the activity dimension (a key priority for many).  

  #### **0:60–0:75 (15 mins): Debrief**  
  Use Socratic questioning to connect activities to theory. **Avoid lecturing**; focus on student observations.  

  | **Observation**               | **Instructor Prompts**                                                                 | **Theoretical Connection**                                     |  
  |-------------------------------|----------------------------------------------------------------------------------------|----------------------------------------------------------------|  
  | **Phase 1: Three different winners** | "Why did we get three different outcomes with the same preferences? What does this say about the 'will of the majority'?" <br> "When have you seen real-life decisions change based on voting order?" | Condorcet paradox: Cycles make outcomes agenda-dependent. |  
  | **Cycle (A>B, B>C, C>A)**     | "How could a majority prefer A>B, B>C, and C>A? Does the group have a 'true' preference, or is it produced by the procedure?" <br> Follow-up if blocs resist: "Budget Hawks, why do you rank C last? Experience Seekers, why do you rank B last? Is anyone being irrational?" | Cyclic preferences are natural with multidimensional choices. |  
  | **Phase 2: B wins package vote but not all dimensions** | "B won the package vote against C, but C won the activity vote. Why might someone who voted for B as a package still be unhappy?" <br> "If we designed the outing based on issue-by-issue votes, what would we get? Would it match the package vote?" | Ostrogorski paradox: Aggregation method changes outcomes. |  
  | **Complaints about options**  | "Some of you think the packages are unfair. Why? If you could redesign them, what would you change to avoid cycles?" <br> Pushback: "In real policy-making (e.g., Brexit, stimulus bills), are packages 'well-designed'? Who decides?" | Highlights path-dependence and agenda control. |  

  #### **0:75–0:90 (15 mins): Conclusion and Real Decision**  
  - **Summarize**: "Today showed that voting procedures, not just preferences, determine outcomes."  
  - **Handle Real Outing**: Use a **Borda count** (students rank packages; points: 3 for 1st, 2 for 2nd, 1 for 3rd) to avoid paradoxes. Collect rankings and announce outing post-class.  
  - **Token Conversion**: Apply token outcomes to outing privileges (e.g., extra votes for high-token students).  

  ---

  ### **Predictable Problems and Solutions:**  
  1. **Blocs Rejecting the Cycle**:  
     - **Risk**: Budget Hawks may deny C>A ("Why would Experience Seekers prefer expensive C?").  
     - **Solution**: In debrief, ask blocs to explain their rankings: Experience Seekers value activity over cost, making C>A sincere. Reframe as "legitimate disagreement," not a trick.  

  2. **Sincere Voting vs. Strategic Incentives**:  
     - **Tension**: Tokens incentivize sincerity (reward top-ranked wins), but students may vote strategically to block disliked options.  
     - **Solution**: Emphasize role-based voting in instructions. If caught ("Why did you vote for B when you rank it last?"), remind: "This activity is about preferences, not strategy. Vote your role."  

  3. **Time Shortages**:  
     - **Risk**: Vote counting or debates run long.  
     - **Solution**: Use show-of-hands for votes (not slips). Enforce 30-second limits for questions. Delegate counting to a student.  

  4. **Dominant Students**:  
     - **Risk**: One bloc monopolizes debate.  
     - **Solution**: Assign a "spokesperson" per bloc. Use timed silent reflection before votes.  

  ---

  ### **What the Activity Cannot Reproduce (and How to Address Cheaply):**  
  - **Strategic Voting**: The activity assumes sincerity. **Gesture**: In debrief, ask: "What if you lied about your preferences to get a better outcome? Would that break the cycle?" Mention real-world examples (e.g., tactical voting in FPTP).  
  - **Cycle Generality**: Cycles are less common in cohesive groups. **Gesture**: Note that "single-peaked preferences" (e.g., everyone agrees on a left-right spectrum) prevent cycles, but outing preferences aren’t like that.  
  - **Other Paradoxes**: Covers Condorcet and Ostrogorski but not Arrow’s theorem. **Omit** for brevity; mention in future lectures.  

  ---

  This design ensures students experience aggregation paradoxes firsthand, using roles to naturalize cycles and a genuine stake to motivate engagement. The debrief turns confusion into critical discussion, setting up deeper theory in subsequent sessions.
