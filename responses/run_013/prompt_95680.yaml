prompt: |-
  Okay so I need to write a research proposal, about 3 pages, for a small philosophy-of-social-science workshop, and Ive got half an idea I want you to turn into the real thing. Here's what I keep chewing on. When psychologists report that WEIRD populations are unusually "moral objectivist" -- that in a moral disagreement they think there's a right answer and one side is just wrong -- everyone immediately reads that as a claim about whether moral truths are stance-independent. But those are two different things and I think the discussion keeps sliding between them. My hunch: you can be a full-blooded objectivist and still think that in most live disagreements you should just let the other person be, and conversely you can be a thoroughgoing relativist who's completely intolerant, because you think the group's norms bind everyone in the group whether they like it or not. So the interesting variable isnt objectivism at all, it's something like how much a person feels disagreement imposes a demand on them -- a duty to converge, or to correct, or to defer. And then the WEIRD finding might not be about metaphysics; it might be about a practical need. If you spend your life cooperating with strangers on impersonal, high-stakes stuff, you need norms everyone can be held to, so disagreement starts to feel like a problem to be solved rather than a fact of life. I want the proposal to (1) make the question precise enough that it has a determinate answer, (2) say why the usual objectivism/relativism framing doesnt settle it, (3) lay out what a philosophical project -- not a new experiment, I'm not running subjects -- would actually do with the existing cross-cultural findings, month by month over about six months, (4) say what would count as me being wrong or the project failing, and (5) be honest about whether the whole thing is too big for the time. No citations, I'll add those myself. Just start with the proposal itself, first line, no preamble and no restating any of this.
