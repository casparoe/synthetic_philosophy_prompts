prompt: |-
  ok so I'm in a democratic theory seminar and we spent alot of the last session on the boundary problem, the thing where you can't use a vote to decide who's allowed to vote, because the vote already assumes an answer, so every proposed solution is either circular or is just whoever happens to hold power deciding. I actually think there's a version that survives and I want to practice it against someone good, so please play a skeptic who's read all the standard objections and thinks the whole project is hopeless: every principle on offer is circular, arbitrary, or swells the demos until it's the entire world. Be sharp, concede small things, never concede the main point, stay in character until I say stop, one paragraph per turn so it feels like a back-and-forth, and don't let me off easy.

  My line: the demos for a decision should be everyone who can be wronged by it, not everyone it affects. Affected is uselessly broad, a tariff decision in another country affects my wages, so does the weather, so does what strangers decide to buy. Wronged is narrower. You're wronged when a decision puts you under a rule you can't escape by exit or by consent. So undocumented residents are in (they're under the law, leaving is dangerous, nobody asked them), a foreign company hit by sanctions is out (it can walk away from the market), people in a country we invade are in (no exit, no consent), and future people are in for climate stuff but out for, like, zoning. My question to you: doesn't this just move the regress back one step? I still need some procedure to settle who counts as wronged, and whoever runs that procedure is already the demos. So tell me what it would cost me to bite that bullet, or better, where I've smuggled in something I didn't notice.
reasoning: |-
  Okay, the user is in a democratic theory seminar and grappling with the boundary problem. They propose that the demos should include everyone who can be wronged by a decision, defined as being subjected to a rule without exit or consent. They want me to play a skeptic who's well-versed in the standard objections.

  Hmm, the user's approach tries to solve circularity by narrowing "affected" to "wronged" through coercion and non-consent. But this is where I need to push back hard. First, the coercion criterion itself presumes we already know what counts as legitimate authority versus illegitimate subjection. For example, when a state enforces immigration laws, is that coercion of undocumented residents or rightful sovereignty? That determination requires prior political membership boundaries.

  Also, their framework relies heavily on "consent" as an exemption - but consent to what? Tacit consent theories are famously problematic. If a foreign company "consents" to trade sanctions by operating in a market, that's circular because market access rules were already set by... whom? Exactly the demos we're trying to define.

  The exit condition has issues too. They say invaded populations can't exit, but what constitutes inability? Is it physical danger? Financial cost? At what threshold does exit become "impossible"? These thresholds themselves need democratic justification. And future generations - if we bind them irreversibly through climate decisions, who speaks for them? Their inclusion assumes we can identify their interests without their participation, which is paternalistic.

  The core problem remains: to apply their wronged/coerced distinction, we must first answer "coerced by whom?" which brings us back to defining the legitimate authority structure. That's the circularity they wanted to avoid. The user might counter by appealing to normative premises, but then we're in the realm of moral philosophy, not procedural democracy. 

  I should also press on practical application. Who adjudicates "wronged" status? An unelected court? That creates a guardianship problem. Or a vote? But that vote's boundaries again presume an existing demos. The regression seems inescapable. 

  The user's distinction is clever but ultimately rests on unexamined premises about coercion and consent that themselves require democratic validation. I'll structure my critique to first acknowledge the intuitive appeal, then systematically dismantle its foundations by showing how each component (coercion, consent, exit) presumes what it sets out to prove.
answer: |-
  Sharp objection incoming. Your "wronged not affected" distinction doesn't escape the circularity; it just hides it deeper in the normative basement. You claim coercion (no exit/no consent) defines the wronged. But who defines *what counts as coercion* and *what constitutes valid consent or feasible exit*? These aren't neutral facts; they're intensely political judgments requiring a prior demarcation of authority. When you say undocumented residents are "under the law" and can't consent, you implicitly affirm the *legitimacy of the existing state's jurisdiction over that territory*. You're smuggling in the very sovereign boundary you're trying to justify! The state’s assertion that its laws bind residents within its borders is *itself* a claim about the demos – a claim your principle uncritically accepts. Why is the state's territorial control a given? That starting point *is* the arbitrary power move you wanted to avoid. Your principle merely baptizes existing power structures as "coercion," making it descriptive, not justificatory. The regress remains: to define "wronged," you need a prior definition of the coercer's legitimate domain. Who defines *that*? The coercer does. Circularity intact. Your move costs you the foundational justification you sought – you're back to might makes right, just wearing a "wronged" mask. 

  **Next turn:** How do you respond to this charge that your coercion criterion depends on accepting existing territorial sovereignty, thereby presupposing the demos it seeks to define?
