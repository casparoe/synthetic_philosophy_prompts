prompt: |-
  I am teaching a ninety-minute session in a graduate Science and Society seminar, and what I need from you is a plan for the teaching rather than the exposition itself. The room holds ten humanities doctoral students and two biologists, a whiteboard, and no laboratory. The humanists arrive already convinced that talk of genetic information is a metaphor doing ideological work and that any sentence of the form DNA contains the instructions for X is determinism in disguise; the biologists arrive expecting a defence of the textbook picture. Both groups know the central dogma as it is taught in school, that there is a code and that codons are triplets, and very little about what the code does and does not specify.

  The session has to leave them able to say, in their own words, in what sense DNA is a code and in what sense it carries information, and what does and does not follow from that. Give me the order in which the components must be introduced, with the dependency made explicit at each step: what has to be in place before the next thing can even be stated, and which single component the rest hangs from. Give me the one example or case that should carry the whole session, and say what it must have and what it must lack in order to carry it. I have been assuming it should be the blueprint-versus-recipe contrast, since it is the one the students will already have met; tell me whether that is right, and if it is, what the example has to be stripped of so that it does not do the wrong work. Tell me, too, where in the sequence each predictable misconception should be headed off, and where I should let the room's objections run rather than pre-empt them. My guess is that the two that matter are that the code is only a metaphor, and that once they see the mapping is arbitrary they will conclude the content is arbitrary as well; say whether that guess is wrong and what the real one is.

  Three pieces of material have to appear somewhere, and I want you to place each and say what work it is doing. The first is that the standard codon table is not a law of nature: in vertebrate mitochondria the codon UGA, which terminates translation in the standard table, is instead read as tryptophan, and other variant codes differ elsewhere. I want this to be the case that fixes whatever the correct notion of arbitrariness is, not a curiosity. The second is that some traits are inherited with no change in nucleic acid sequence at all, the self-propagating protein conformations described in yeast being the standard instance; I want it used to make them locate the informational claim precisely rather than abandon it. The third is the students' own suspicion, which I would rather treat as a position with a price attached than as a confusion to be corrected.

  Finish with the check for understanding: one question, answerable in the room without notes, whose answer would distinguish a student who has grasped the structure of the distinction from one who has merely become suspicious in the right direction. Then give me the things I should openly refuse to settle at this level, and say so in the session. At the very end, list which sentences of your plan are metaphors that I should flag as metaphors when I use them, and which are technical claims that would survive the metaphor being dropped, since that is the distinction I most often get wrong in front of a room.
reasoning: |-
  We are designing a 90-minute seminar for graduate students in a Science and Society context. The goal is to have students articulate in their own words the senses in which DNA is a code and carries information, and what does and does not follow from that.

  Key constraints:
  - 10 humanities doctoral students (already skeptical of genetic information as a metaphor doing ideological work, viewing DNA as containing instructions as disguised determinism)
  - 2 biologists (expecting a defense of the textbook picture)
  - Both groups know the central dogma, the genetic code (codons as triplets), but little about what the code does and does not specify.

  The plan must:
  1. Have a clear order of components with dependencies (what must be in place before the next step).
  2. Identify the central example that carries the session (likely the blueprint vs. recipe contrast, but we must strip it of misleading elements).
  3. Address predictable misconceptions: 
     a. That the code is only a metaphor (and therefore not real).
     b. That the arbitrariness of the mapping implies arbitrariness of content.
  4. Incorporate three required materials:
     a. The variant genetic code (e.g., vertebrate mitochondria where UGA codes for tryptophan) to illustrate the correct notion of arbitrariness.
     b. Non-Mendelian inheritance (prion example in yeast) to show that informational claims must be located precisely and not abandoned.
     c. The students' own suspicion, treated as a position with a price (consequences) rather than a confusion.
  5. End with a check for understanding: one question that distinguishes deep understanding from mere suspicion.
  6. Explicitly state what will not be settled at this level.
  7. Flag metaphors and technical claims that survive without the metaphor.

  The Central Example: Blueprint vs. Recipe
  - Why it's a candidate: Students are familiar with it. It contrasts a static plan (blueprint) with a dynamic set of instructions (recipe) that requires context and interaction.
  - What must be stripped: 
     - The blueprint metaphor often implies a one-to-one mapping and determinism. We must avoid that.
     - The recipe metaphor must not be taken to imply that the outcome is arbitrary or that the instructions are vague. We need to emphasize that the recipe is precise but context-dependent and that the same recipe can yield different results in different environments (which is not arbitrariness but context-dependency).

  Revised central example: We'll use a recipe as the core analogy, but we must be explicit about what it captures and what it doesn't. We'll also use a blueprint analogy to contrast and then reject as inadequate.

  Structure of the Session:

  I. Introduction (5 minutes)
     - State the goal: To clarify the sense in which DNA is a code and carries information, and what does and does not follow.
     - Acknowledge the differing perspectives in the room and set ground rules: We are exploring the concepts, not defending or attacking any position.

  II. Establish the Need for a Concept of Information in Biology (10 minutes)
     - Ask: What is the problem that the concept of genetic information solves? 
       - Dependency: None. This is the starting point.
     - Use an example: Heredity. We observe that traits are passed from parents to offspring. How?
     - Historical note: Before molecular biology, we had the idea of "inheritance of acquired characteristics" vs. "inheritance via germ cells". The molecular explanation had to account for the stability and specificity of inheritance.
     - Point: The concept of information is used to explain how specific traits are reliably reproduced across generations.

  III. The Central Dogma and the Genetic Code: What We Know (15 minutes)
     - Review: DNA -> RNA -> Protein (central dogma). Codons (triplets) code for amino acids. The codon table is a mapping.
     - Dependency: The students already know this, so we can build on it.
     - Key point: The mapping is arbitrary. There is no chemical reason why a particular codon must code for a particular amino acid. This is where we introduce the first required material: the variant genetic code (e.g., in vertebrate mitochondria, UGA codes for tryptophan, not stop).
       - Work it does: This shows that the code is arbitrary in the sense of being conventional (like a language) and not fixed by physical law. But note: the variant code is still fixed in a given organism. It is not arbitrary in the sense of being changeable at will by the organism. It is arbitrary in the sense that the mapping is not determined by the chemistry of the bases and amino acids alone.

  IV. The Blueprint vs. Recipe Contrast (20 minutes)
     - Present the blueprint metaphor: A blueprint is a detailed plan that specifies the structure. If DNA were a blueprint, then the organism would be determined by the DNA alone.
     - Why it fails: 
       - The same DNA can produce different outcomes in different environments (e.g., the same plant genotype growing in sun vs. shade).
       - DNA does not specify the entire structure but rather a set of instructions that are executed in a context.
     - Introduce the recipe metaphor: A recipe specifies steps and ingredients, but the outcome depends on the context (oven temperature, altitude, etc.). It is a set of instructions that must be executed.
     - What the recipe captures: 
       - The idea of a set of instructions that are followed (by the cellular machinery).
       - The context-dependence: The same recipe can yield different results in different environments.
     - What the recipe must not imply: 
       - That the instructions are vague. They are precise but rely on the context for execution.
       - That the outcome is arbitrary. The recipe constrains the outcome (you get a cake, not a stew) but does not determine every detail.
     - Dependency: We needed the idea of the genetic code (step III) to have the mapping from codons to amino acids as the basic "words" of the recipe.

  V. Addressing Misconceptions (25 minutes)
     - Two predictable misconceptions and how to address them:

       a. "The code is only a metaphor":
          - Let the room discuss: Why might someone say this? What does it mean to be "only a metaphor"?
          - Point: All scientific models are representations. The question is not whether it is a metaphor but whether it is a useful model that captures something real.
          - The price of abandoning the concept: How else do we explain the specificity and reliability of inheritance? Without the concept of information, we lose the ability to explain why a change in a specific DNA sequence leads to a specific change in the protein and then the trait. We must account for the fact that the sequence matters in a way that is not reducible to the chemistry of the bases alone (because of the arbitrary mapping). 
          - Place: After establishing the recipe metaphor (step IV) because we now have a model to defend.

       b. "Arbitrariness of the mapping implies arbitrariness of content":
          - This is the second misconception. We have already introduced the variant code (step III), which shows arbitrariness, but we must now show that the content is not arbitrary.
          - Use the recipe: The mapping of words to actions in a recipe is arbitrary (e.g., "beat" could be replaced by "whisk" without changing the action), but the actions themselves are not arbitrary. Similarly, the mapping of codons to amino acids is arbitrary, but the function of the resulting protein in the cell is not arbitrary. The function arises from the structure of the protein and its role in the cell, which is constrained by physics and chemistry and by evolution.
          - Introduce the second required material: Non-Mendelian inheritance (prions in yeast). 
            - Example: The [PSI+] prion in yeast is a self-propagating conformation of a protein that is inherited without any change in DNA sequence. 
            - Work it does: This shows that information can be transmitted in ways other than DNA sequence, but note that the prion state itself depends on the existence of a specific protein sequence (encoded by DNA). So, the informational claim about DNA is not that it is the only way information is transmitted, but that it is a primary and reliable way. It forces us to locate the informational claim: DNA is a code for the sequence of proteins (and for functional RNAs). It does not code for everything (like prion states) but is necessary for the existence of the prion-forming protein.
          - Place: After the recipe metaphor and the first misconception, because we now have a model and are addressing challenges.

     - The students' own suspicion (that genetic information talk is ideological) should be treated as a position with a price. 
          - We have already been addressing it by showing the explanatory power of the concept. But we can explicitly ask: What is the price of rejecting the concept? 
          - The price: Without the concept, we lose the ability to explain the specificity of genetic effects and the directedness of development and evolution. We also make it harder to understand genetic diseases and biotechnology. 
          - Place: After addressing the two misconceptions, because we now have the tools to evaluate what we lose.

  VI. Synthesis: In What Sense is DNA a Code? (10 minutes)
     - Recap:
       - DNA is a code in the sense of having an arbitrary mapping (like a language) between nucleotide triplets and amino acids (or regulatory signals). This mapping is fixed in a given organism (by evolution) and is used by the cellular machinery.
       - It carries information in the sense that the sequence of nucleotides specifies the sequence of amino acids in proteins (and functional RNAs) and thus the functions they perform. The information is context-dependent (like a recipe) and requires an interpreter (the cell).
       - What does not follow: Determinism. The outcome is not determined solely by the DNA because the environment and cellular context matter. Also, the arbitrariness of the mapping does not imply arbitrariness of the content because the function of the proteins is constrained by physical laws and evolutionary history.

  VII. Check for Understanding (5 minutes)
     - Question: "Suppose a mutation changes a codon from UUU to UUC in a gene. Both codons code for phenylalanine in the standard genetic code. Would this mutation change the protein produced? Why or why not? And what does this tell us about the genetic code and the information in DNA?"
       - Expected answer: The protein would not change because both codons code for the same amino acid. This shows that the genetic code is redundant (multiple codons for the same amino acid) and that the information in DNA is about the amino acid sequence, not the exact codon used. It also shows that the mapping is arbitrary (because we could imagine a code without redundancy) but the meaning (the amino acid) is what matters for the protein function.

  VIII. What We Are Not Settling (Openly Refuse) (5 minutes)
     - We are not settling the debate about genetic determinism vs. environmental influence. That is a separate and complex issue that requires more time.
     - We are not claiming that DNA is the only source of biological information (as the prion example shows).
     - We are not addressing the ethical or ideological implications of the language of information. We have only clarified the scientific concept.

  IX. Flagging Metaphors and Technical Claims
     - Throughout the session, flag:
       - Metaphors: 
          - "Code" (as in genetic code) is a metaphor, but the mapping is real and the arbitrariness is a technical fact.
          - "Blueprint" is a metaphor we reject as inadequate.
          - "Recipe" is a metaphor we use, but we must note its limitations (e.g., the cell is not a conscious cook).
       - Technical claims that survive without the metaphor:
          - The existence of a mapping between codons and amino acids that is arbitrary (not fixed by physical law alone) and that this mapping is used in the process of translation.
          - The sequence of DNA nucleotides determines the sequence of amino acids in proteins (with the caveat of the genetic code and possible errors).
          - The process of translation requires an interpreter (the cellular machinery) and is context-dependent.

  Timing Breakdown:
  - I: 5 min
  - II: 10 min
  - III: 15 min
  - IV: 20 min (this might run over, so be flexible)
  - V: 25 min (including addressing misconceptions and the prion example)
  - VI: 10 min
  - VII: 5 min
  - VIII: 5 min

  Total: 95 minutes. We can adjust by shortening the synthesis or the introduction.

  The Central Example: Recipe (with the caveats) is the right choice. We stripped it of the implication of determinism (by emphasizing context) and of arbitrariness of outcome (by noting the constraints). We also used the blueprint as a foil.

  Predictable Misconceptions: The two identified are correct. The real one might be the conflation of arbitrariness of the mapping with arbitrariness of the outcome. We addressed that by using the recipe (arbitrary words, but non-arbitrary actions) and the prion example (which shows that DNA is necessary but not always sufficient).

  Required Materials Placement:
  1. Variant genetic code: Step III, to establish arbitrariness of the mapping.
  2. Prion inheritance: Step V, when addressing the second misconception and the students' suspicion, to show that DNA is not the only source of heritable information but that the informational claim about DNA is still precise (it codes for protein sequence).
  3. Students' suspicion: Throughout, but explicitly in Step V as a position with a price.

  Check for Understanding: The question about the UUU to UUC mutation.

  Refusals: As in Step VIII.

  Flagging: As in Step IX, but throughout the session when using the terms.
answer: |-
  ### Teaching Plan for 90-Minute Session  
  **Goal:** Students articulate in their own words:  
  1. The sense in which DNA is a "code" and carries "information."  
  2. What does (and does *not*) follow from this (e.g., determinism is **not** implied).  

  **Core Structure:**  
  The session hinges on **one central example** (recipe vs. blueprint) to unpack "information" in DNA. The rest builds on this.  

  ---

  ### **Order of Components with Dependencies**  
  *(Total: 90 minutes)*  

  #### **1. Framing the Problem (5 min)**  
  - **What:** State the core question: *"In what sense does DNA ‘carry information’ or act as a ‘code’? And what are the limits of this idea?"*  
  - **Why:** Establishes shared focus. Acknowledge both groups’ starting positions (humanists’ skepticism of metaphor/biologists’ textbook expectations) as valid questions to explore.  
  - **Dependency:** None. This is the entry point.  

  #### **2. Central Example: Recipe vs. Blueprint (20 min)**  
  - **What:** Contrast a **blueprint** (deterministic, static, specifies outcomes) with a **recipe** (context-dependent, requires interpretation, specifies *process*).  
    - *Example:* A cake recipe vs. a cake blueprint.  
      - Recipe: Same instructions yield different cakes if oven temp varies (environment matters).  
      - Blueprint: Specifies exact dimensions (ignores environment).  
  - **Why:** Recipe illustrates DNA’s role: it encodes *steps* for cellular machinery, not fixed outcomes.  
  - **Dependency:** Must come early to anchor all later discussion.  
  - **Stripping the Example:**  
    - **Remove:** Any implication that recipes are "vague" or "arbitrary." Emphasize:  
      - Recipes are *precise instructions* but depend on context (e.g., cellular environment).  
      - DNA is *like* a recipe in its context-dependence, but *unlike* a blueprint in avoiding determinism.  
  - **Predictable Misconception Head-Off:**  
    - *Here:* Preempt "DNA as blueprint = determinism" by showing recipes ≠ blueprints. Ask: *"Does a recipe determine the cake, or guide its making?"*  

  #### **3. Arbitrariness of the Genetic Code (15 min)**  
  - **What:** Use the **variant codon table** (e.g., vertebrate mitochondria: UGA = tryptophan, not "stop").  
  - **Why:** Shows the code is **arbitrary but fixed** by evolution. The mapping is conventional (not chemical necessity), but *not* arbitrary in function.  
  - **Dependency:** Requires the recipe example (Step 2) to explain "mapping" without implying determinism.  
  - **Work It Does:** Clarifies "arbitrariness" ≠ "randomness." The *mapping* is arbitrary, but the *functional outcome* (protein function) is constrained by natural selection.  
  - **Predictable Misconception:** Let students object here: *"If the code is arbitrary, isn’t ‘information’ just a metaphor?"* Record this for Step 5.  

  #### **4. What the Code Specifies (and What It Doesn’t) (15 min)**  
  - **What:** DNA specifies *amino acid sequences* (via codons), but **not** higher-level traits (e.g., "aggression" or "intelligence").  
    - *Example:* A gene codes for a protein that affects metabolism, but metabolism is influenced by diet/environment.  
  - **Why:** Uses the recipe analogy (DNA specifies "ingredients/steps," not the final "cake").  
  - **Dependency:** Requires Step 3 (arbitrariness) to avoid conflating "code specifies sequence" with "code specifies traits."  
  - **Predictable Misconception Head-Off:**  
    - *Here:* Preempt "DNA information = trait determinism" by emphasizing:  
      - DNA informs protein sequences, but proteins interact with environment to produce traits.  

  #### **5. Non-DNA Inheritance: Prions in Yeast (15 min)**  
  - **What:** Introduce **yeast prions** (self-propagating protein conformations inherited *without* DNA changes).  
  - **Why:** Shows information can exist *beyond DNA*, forcing precision about "genetic information."  
  - **Dependency:** Requires Step 4 (what DNA specifies) to contrast: DNA codes for *protein sequences*, but prions show *information* can be epigenetic.  
  - **Work It Does:**  
    - DNA’s informational role is **precisely located**: it specifies polymer sequences.  
    - This does *not* negate DNA as a code; it shows other mechanisms exist.  
  - **Predictable Misconception:** Let objections run here: *"If prions inherit without DNA, is ‘genetic information’ a flawed concept?"*  

  #### **6. Addressing Suspicion: "Information as Metaphor" (15 min)**  
  - **What:** Treat skepticism as a **position with a price**. Ask:  
    - *"If we reject ‘DNA as information,’ what alternative explains the specificity of inheritance? (e.g., why does changing a codon change a protein?)"*  
  - **Why:** Forces students to weigh the utility of "information" against its risks (e.g., determinism).  
  - **Dependency:** Requires all prior steps:  
    - Recipe analogy (Step 2) shows utility.  
    - Arbitrariness (Step 3) and prions (Step 5) show limits.  
  - **Real Misconception:** Your guess was correct. The key is:  
    - **Metaphor ≠ Useless:** "Code" is a metaphor, but it captures real phenomena (e.g., codon → amino acid mapping).  
    - **Arbitrariness ≠ Content Arbitrary:** Mapping is conventional, but content (functional proteins) is constrained by selection.  

  #### **7. Synthesis: Recap Core Distinctions (5 min)**  
  - DNA is a "code" **only** in the sense of an **arbitrary but evolvable mapping** (codon → amino acid).  
  - It "carries information" **only** in the sense of **specifying sequences** (not traits).  
  - **Does not imply:** Determinism, teleology, or that DNA is the sole source of inheritance.  

  ---

  ### **Check for Understanding**  
  - **Question:** *"In yeast, a prion can be inherited without DNA changes. Does this mean DNA is not a code? Why or why not?"*  
  - **Answer Indicating Grasp:**  
    - "No. DNA remains a code for protein sequences. The prion shows information can be transmitted other ways, but DNA’s role in specifying sequences is unchanged."  
  - **Answer Showing Mere Suspicion:**  
    - "Yes, it proves ‘genetic information’ is just a metaphor." (Fails to locate DNA’s specific role.)  

  ---

  ### **What to Refuse to Settle**  
  Openly state:  
  1. **"Is ‘information’ the *best* metaphor?** (We’re clarifying its use, not defending it as ideal.)  
  2. **Determinism debates:** "Does DNA ‘determine’ traits? (This depends on trait/environment interactions—beyond today’s scope.)"  
  3. **Ideological critiques:** "How ‘information’ language is *used* socially (e.g., in policy) requires separate analysis."  

  ---

  ### **Metaphors vs. Technical Claims**  
  **Flag these as metaphors when used:**  
  - "DNA is a blueprint" (rejected in Step 2).  
  - "DNA is a recipe" (useful but imperfect; emphasize cellular "machinery" as the "interpreter").  
  - "Code" (highlight it’s shorthand for "mapping convention").  
  - "Information" (stress it means "sequence specification," not "meaning").  

  **Technical claims that survive without metaphor:**  
  - "Codon triplets map to amino acids via tRNA."  
  - "This mapping varies across species (e.g., mitochondrial UGA → tryptophan)."  
  - "Changing a DNA sequence can change a protein sequence."  
  - "Some heritable states (e.g., prions) do not involve DNA changes."  

  ---

  ### **Instructor Notes**  
  - **Let Objections Run:** In Steps 3 (arbitrariness) and 5 (prions), allow debate. Pre-empt only determinism (Step 4) and metaphor dismissal (Step 6).  
  - **Central Example:** Recipe vs. blueprint is ideal *if* stripped of vagueness. Stress:  
    - Recipes are *highly specific* but *context-dependent*.  
    - Blueprints imply a 1:1 outcome map (misleading for DNA).  
  - **Timing Flexibility:** Cut synthesis (Step 7) if debate runs long. Prioritize Steps 2, 3, and 6.  
  - **Balance:** Validate humanists’ skepticism ("metaphors have risks") and biologists’ rigor ("here’s what the data shows").  

  This plan builds from concrete examples to abstract distinctions, forcing precision while honoring skepticism. The recipe analogy is the load-bearing beam; variant codes and prions refine its implications.
