reasoning: |-
  We are writing a FAQ for a fine-art moving and stockage company from the perspective of a claims department that has adopted a metaphysical view: a statue and the lump of matter (clay, bronze) that constitutes it are two distinct objects, even though they occupy the same space at the same time. We must strictly adhere to this view and not slip into any rival view. The humour should arise from the logical consequences of this view, not from mocking it. We'll cover:

  1. Modal argument (statue cannot survive being squashed, lump can; so they are distinct).
  2. Grounding question (why are they two things if they are made of the same stuff?).
  3. Problem of the many (how many objects are there when we count the lump, statue, lump minus a fleck, etc.?).
  4. Mereological essentialism (the lump must have exactly the parts it has, the statue could have had slightly different parts).

  We need about ten entries, around 700 words, deadpan. We'll also include an appendix table and a closing answer to the question of whether they are one thing.

  Structure:

  1. Introduction: What is covered? (But without introducing the metaphysics explicitly as a theory; just state as fact.)

  2. Define the two objects: the statue (an artwork) and the lump (the physical matter).

  3. How does the policy treat them?

  4. What happens when a claim is made?

  5. Address the possibility of damage to one but not the other.

  6. What if the statue is destroyed (ceases to exist) but the lump remains?

  7. What if the lump is altered (e.g., melted) but the statue is destroyed?

  8. The problem of the many: How many objects are insured?

  9. Can we insure both? Is that double insurance?

  10. Closing: The company's stance on the distinctness.

  Appendix: Table for one crate with one cast sculpture and one bag of clay.

  Final answer: The two objects are not one thing.

  Let's write each entry.

  Word count target: 700 words for about 10 entries -> about 70 words per entry, but we can vary.

  Draft:

  1. **What is covered by our insurance policy?**  
     Our insurance policy covers physical objects in our care. It is important to note that for any artwork made of a material substance, there are two distinct objects: the artwork (e.g., a statue) and the lump of matter (e.g., clay or bronze) that constitutes it. Both are insurable items.

  2. **Why are the statue and the lump considered two objects?**  
     The statue and the lump are two objects because they have different properties. The lump can survive being melted down and recast, while the statue cannot. Similarly, the statue could have been made from a slightly different lump, but the lump could not have been made of different matter. Therefore, they are not identical.

  3. **What happens if the statue is damaged but the lump remains intact?**  
     If the statue is damaged (for example, by a chip that alters its appearance so that it no longer represents the intended form) but the lump remains (as the same matter, albeit rearranged), then the statue may be considered destroyed even though the lump persists. In such a case, the policy would cover the loss of the statue.

  4. **What happens if the lump is damaged but the statue remains?**  
     If the lump is damaged (for example, by the loss of a microscopic particle) but the statue remains (because the loss does not affect its form), then the lump is damaged. However, since the statue remains, there is no claim for the statue. The policy may cover the damage to the lump, but note that the lump is typically of lower value.

  5. **What if the statue is completely destroyed?**  
     If the statue is destroyed (for example, by being crushed into a shapeless mass), the lump may survive (as the same matter, now in a different form). The policy would cover the loss of the statue. The lump, now a shapeless mass, remains and may be returned to the customer.

  6. **What if the lump is destroyed but the statue is not?**  
     It is impossible for the lump to be destroyed without the statue being destroyed. Since the statue depends on the lump for its existence (at any given time, the statue is made of that lump), the destruction of the lump entails the destruction of the statue. Therefore, both would be covered.

  7. **How many objects are in a crate containing one statue?**  
     In a crate containing one statue, there are at least two objects: the statue and the lump. Additionally, there may be other objects: for example, the lump minus any small part (such as a fleck of clay) is also a distinct object. However, our policy insures only the statue and the original lump as two separate items. The lump minus a fleck is not insured unless specifically added.

  8. **Does insuring both the statue and the lump constitute double insurance?**  
     No. Double insurance occurs when the same object is insured twice. Since the statue and the lump are two distinct objects, insuring both does not constitute double insurance.

  9. **What if the statue is altered in a way that changes its identity?**  
     The statue is defined by its form. If the form is altered beyond recognition (as determined by an expert), the original statue ceases to exist and a new object (which may be a different statue or a non-artwork) comes into being. The lump, however, continues to exist. The policy would cover the loss of the original statue.

  10. **What is the value of the lump?**  
      The lump's value is the market value of the raw material. The statue's value is the market value of the artwork. These values are independent. When a claim is made, we pay the insured value of the object that is lost or damaged.

  Appendix:

  Table: Insurable Objects in a Crate

  | Item in Crate | Number of Insurable Objects | Notes |
  |---------------|-----------------------------|-------|
  | One cast sculpture (e.g., bronze statue) | At least 2 | The statue and the lump of bronze. |
  | One bag of clay (unformed) | 1 | The lump of clay. (No statue is present until the clay is formed.) |

  **If a customer asks: "Are the statue and the lump really just one thing?"**  
  No. They are two distinct objects. The statue and the lump have different properties and therefore cannot be identical. Our policy treats them as separate entities.

  Total word count: approximately 700.

  We must avoid any winking or humor that mocks the position. The deadpan delivery and the absurd practical outcomes (like insuring two objects when common sense says one) should create the humour.

  Let's write accordingly.
answer: |-
  ### Loss & Damage FAQ: Fine-Art Moving & Storage  

  1. **What does your policy cover?**  
     Our policy covers physical objects in transit or storage. For any artwork (e.g., a statue), two distinct objects exist: the artwork itself and the lump of matter (e.g., clay, bronze) constituting it. Both are insurable as separate entities.  

  2. **Why are the statue and its lump considered two objects?**  
     The statue and lump differ in essential properties. The lump can survive processes that destroy the statue (e.g., melting, recasting, or sale by weight). The statue cannot. Thus, by the principle of discernibility, they are not identical.  

  3. **How many objects are in a crate with one sculpture?**  
     A crate holding one sculpture contains at least two objects: the statue and the lump. Additional objects may exist (e.g., the lump minus a microscopic fleck, or the statue plus one dust particle). Only the primary statue and original lump are automatically insured. Subsidiary objects require separate declarations.  

  4. **Is insuring both the statue and lump "double insurance"?**  
     No. Double insurance applies only to identical objects. Since the statue and lump are distinct (e.g., the lump could persist without the statue), covering both is not redundant.  

  5. **What if the statue is damaged but the lump is unharmed?**  
     Damage altering the statue’s defining form (e.g., a disfiguring chip) destroys the statue, even if the lump remains materially intact. Compensation covers the statue’s loss. The unharmed lump remains customer property.  

  6. **What if the lump is damaged but the statue persists?**  
     If the lump loses matter (e.g., microscopic erosion) without affecting the statue’s form, only the lump is damaged. Compensation reflects the lump’s raw-material value. The statue’s undamaged status precludes a separate claim.  

  7. **What occurs when the statue is destroyed but the lump survives?**  
     If the statue is crushed, melted, or reshaped into non-art (e.g., a formless mass), the statue ceases to exist. The lump persists. Compensation covers the statue’s full value. The lump, now a new object (e.g., "amorphous bronze"), may be returned.  

  8. **Can the lump be destroyed without destroying the statue?**  
     No. The statue depends on the lump’s existence at every moment. Destroying the lump (e.g., dissolving it) simultaneously destroys the statue. Both claims are payable.  

  9. **What defines "destruction" of the statue?**  
     The statue is destroyed if it loses its identity-conferring form (e.g., breakage altering its artistic intent). The lump survives if its matter persists. Expert assessment determines the statue’s status.  

  10. **Why might a claim be denied despite material damage?**  
      Claims rely on which insured object is affected. Damage reducing the lump’s weight may not harm the statue (e.g., dust loss). Conversely, structural changes destroying the statue may leave the lump viable. Only loss/damage to the insured object (statue or lump) qualifies.  

  ---

  ### Appendix: Insurable Objects per Crate  
  | Contents                           | Insurable Objects                          | Notes                                                                 |  
  |------------------------------------|--------------------------------------------|-----------------------------------------------------------------------|  
  | One cast sculpture (e.g., statue)  | 2+: Statue + Lump (+ subsidiary objects*)  | *e.g., lump minus a fleck; add via endorsement.                       |  
  | One bag of unformed clay           | 1: Lump only                               | No statue exists until clay is shaped.                                |  

  \* Subsidiary objects require individual appraisal and policy endorsement.  

  ---  

  **Customer Query:** "Are the statue and lump truly two objects, not one?"  
  No. They are numerically distinct. The statue cannot survive recasting; the lump can. The statue could have had slightly different matter; the lump could not. Thus, they are separate entities. Our policy adheres strictly to this principle.
