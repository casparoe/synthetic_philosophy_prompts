  - Then four core questions:
    1. Agency question (lapse vs. intentional act)
    2. Nature of judgment (belief vs. desire expression vs. inert belief)
    3. Temporal conflict (single moment vs. across time)
    4. Agent unity (single self vs. multiple selves)

