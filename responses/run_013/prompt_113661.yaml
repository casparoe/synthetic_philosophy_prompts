  - Rate each argument move from clearly wrong to clearly right
  - Identify what each misses
  - Determine who has the better overall position
  - Evaluate Marcus's "wake-up test"
  - Apply it to escalator etiquette
  - Find a unified view that explains all three cases

  I notice the user is deeply engaged with philosophical nuance - they've clearly studied this and want rigorous analysis. There's also practical urgency since this debate caused real conflict in their living situation. The underlying need might be both intellectual clarity and conflict resolution tools.

  Starting with Lena's first move: She correctly defines convention as solving coordination problems through arbitrary but stable rules. Her point about arbitrariness being key (15 vs 10 mins) is textbook Lewis. Strong opening. 

  Marcus counters by questioning conformity motives. He makes a valid distinction - Lewis requires preference for conformity, whereas here compliance seems fear-based. His "custom with posse" analogy is insightful, though he overlooks that social enforcement can be part of conventions. Partial credit.

  Lena's rebound is sharp: She argues disapproval itself emerges from mutual expectations, making it conventions "all the way down." This is philosophically sophisticated - she understands Lewis's recursive nature of expectations. Her symmetry point about road rules is particularly strong. 

  Marcus then proposes his wake-up test. While conceptually interesting, it's flawed - as Lena later notes, people absolutely "should" about traffic conventions too. His claim that moralizing disqualifies conventions doesn't hold water. Weakest move so far.

  The new tenant anecdote backfires on Marcus - the lecture actually proves the convention exists, not that it's moralized. Lena pounces on this perfectly, noting "should" is the glue that maintains arbitrary conventions. 

  Marcus's habit vs convention distinction is misguided - Lena correctly cites Lewis on salient precedents. Final point goes decisively to Lena.

  Overall assessment: Lena's position is more robust. Marcus makes good points about enforcement asymmetry but overplays the moralization angle. The wake-up test fails because it conflates convention with indifference - people can passionately maintain arbitrary rules.

  For the escalator test case: It passes Marcus's test poorly (people treat it morally) yet is clearly conventional. This exposes his test's flaw. 

  Synthesizing all three cases: The laundry, road and escalator rules all fit Lewis's definition. Differences in enforcement intensity stem from consequence asymmetry, not convention status. Higher stakes create stronger "shoulds" - that's all.

  The user's co-op might resolve conflicts by formally adopting the rule, making expectations explicit. But philosophically, Lena wins this debate.
answer: |-
  Here's a move-by-move analysis of Lena and Marcus's debate, rated for accuracy and coherence, followed by a resolution of the core disagreement and answers to your specific questions:

  **Move 1: Lena (Defining Convention)**  
  *Claim:* The rule is a Lewisian convention: it solves a coordination problem arbitrarily (15 mins vs. 10/20), sustained by mutual expectations/preferences for conformity.  
  *Rating:* **Clearly Right.**  
  *Why:* She perfectly captures Lewis’s core definition: a regularity in behavior solving a recurring coordination problem, where arbitrariness and mutual expectations are key. The laundry scenario fits this (multiple equilibria exist).

  **Move 2: Marcus (Critiquing Motives for Conformity)**  
  *Claim:* People conform due to social pressure ("posse"), not genuine preference for the rule itself. It’s a "custom with a posse," not a convention. Driving rules don’t need this.  
  *Rating:* **Partially Right, Partially Wrong.**  
  *Why:* Right that social enforcement exists here. **Wrong** that this invalidates it as a convention. Lewis explicitly allows sanctions to sustain conventions (*Convention*, Ch. I.5). Driving rules *do* have enforcement (police, social disapproval, self-preservation) – Marcus idealizes them. His "posse" is part of the mutual expectations Lena describes.

  **Move 3: Lena (Defending Enforcement & Symmetry)**  
  *Claim:* The "posse" (disapproval) is itself sustained by mutual expectations – "conventions all the way down." Enforcement needs vary with payoff symmetry (e.g., asymmetric risks would need more enforcement for driving).  
  *Rating:* **Clearly Right.**  
  *Why:* Lewisian conventions *include* norms of sanctioning non-compliance. Her symmetry point is crucial: enforcement intensity depends on the stakes, not the convention’s definition. Driving rules have high stakes (death), laundry has low stakes (mild annoyance), hence different enforcement levels. This doesn’t change the *nature* of the rule.

  **Move 4: Marcus (The "Wake-Up Tomorrow" Test & Moralization)**  
  *Claim:* If someone woke up convinced others switched rules, would they:  
  - Shrug and switch? → Convention (indifferent to the rule, cares about coordination).  
  - Carry on? → Not convention (cares about the rule’s inherent rightness).  
  He argues the laundry rule is moralized ("shouldn’t leave laundry"), proving it’s not arbitrary/conventional.  
  *Rating:* **Interesting but Flawed.**  
  *Why:*  
  - **Test Insight:** Correctly identifies that conventions are *arbitrary* – participants should be indifferent to *which* equilibrium is chosen.  
  - **Test Flaw:** Overstates indifference. People can *passionately* prefer conformity to a specific convention once established (e.g., Brits driving on the left). The test confuses *initial arbitrariness* with *current indifference*.  
  - **Moralization Flaw:** Saying "should" doesn’t negate conventionality. People say "you *should* drive on the right" in the US – it’s still a convention. Normative language often reinforces conventions.

  **Move 5: Lena (Defending "Should" & Salience)**  
  *Claim:* "Should" is the glue holding conventions together. Salient precedents (Rob acting first) are a standard way conventions start.  
  *Rating:* **Clearly Right.**  
  *Why:* Lewis explicitly says conventions are sustained by *preference* to conform given others' conformity – this often manifests as feeling one "should" comply. Salient events (like Rob acting) are classic focal points for selecting an equilibrium (*Convention*, Ch. 3). Moral language reinforces expectations; it doesn’t refute conventionality.

  **Move 6: Marcus (Convention vs. Habit)**  
  *Claim:* Rob starting a habit isn’t coordination. Conventions need simultaneous expectations, not a first mover.  
  *Rating:* **Clearly Wrong.**  
  *Why:* Lewis *emphasizes* historical precedents and salience as mechanisms for establishing conventions. A single actor creating a salient solution is textbook (e.g., someone starting to drive on one side after a storm). Conventions *evolve*; they don’t require instantaneous group epiphany.

  ---

  ### Overall Assessment
  - **Lena has the stronger position.** She accurately applies Lewis’s framework. The laundry rule is a near-perfect example of a convention: arbitrary, solving coordination, sustained by mutual expectations (including enforcement). Marcus raises valid points about social pressure and moralization but misinterprets them as disqualifying factors.
  - **What Lena misses:** Acknowledging that *asymmetric stakes* (some care more about laundry privacy) might increase enforcement needs, but this doesn’t change the rule’s conventional nature.
  - **What Marcus misses:** Lewis’s framework *accommodates* enforcement and normative language. Conventions don’t require pure indifference to the rule itself, only a preference for conformity given others’ conformity.

  ---

  ### Marcus's "Wake-Up Test" & the Escalator Rule
  - **The Test's Value:** It’s a useful *heuristic* for identifying arbitrariness but **fails as a strict criterion**. It conflates:  
    a) *Initial arbitrariness* (essential for conventions).  
    b) *Current indifference* (not essential – people can care deeply about *their* convention).  
  - **Escalator Rule Result:** The test would **falsely classify it as non-conventional**.  
    - If convinced everyone switched to "stand left/walk right," most people would **NOT** shrug and switch immediately. They’d feel it’s "wrong" or dangerous due to ingrained habit and moralization ("rude to block walkers!").  
    - **Yet it IS a convention:** Arbitrary (many countries reverse it), solves coordination (flow vs. rest), sustained by mutual expectation. Moralization reinforces it; it doesn’t negate conventionality.

  ---

  ### A Unified View: Getting All Three Rules Right
  **Lewis’s framework, properly applied, explains all cases:**  

  1. **Road Rule:** Pure coordination convention. Symmetric, high-stakes payoffs (life/death). Enforcement externalized (police, physics). Moralized ("should drive safely").  
  2. **Escalator Rule:** Coordination convention with mild asymmetry. Slightly higher stakes for walkers (efficiency). Enforced socially (glares, "excuse me!"), moralized ("rude to stand left").  
  3. **Laundry Rule:** Coordination convention. Asymmetric stakes (some value privacy/time more). Enforced socially (🙃 emojis, lectures). Moralized ("shouldn’t leave laundry").  

  **Key:** All are **arbitrary solutions** to coordination problems. Differences in enforcement intensity/moral language stem from:  
  - **Stakes asymmetry** (Privacy concerns in laundry > efficiency on escalators >>> life/death on roads).  
  - **Risk of defection** (Easier to "cheat" laundry rules than road rules).  
  - **Cost of enforcement** (Cheap to text 🙃; costly to police roads).  

  **Why Marcus is wrong about "should":** Moralization arises *because* conventions are arbitrary and fragile. Saying "should" reinforces the expectation of conformity – it’s a feature, not a bug, of conventional systems.  

  **Conclusion:** Lena wins the debate. The laundry rule is a Lewisian convention. Marcus’s test and "moralization" argument don’t refute this but highlight how conventions adapt to context. If your co-op wants clarity, **write the rule down** – but philosophically, it’s convention all the way down.
