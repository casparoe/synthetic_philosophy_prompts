  What I want is the most important implications of the theory — the claim that a phrase like the current manager of the Berlin team isn't a name that points at a person but a quantifier saying there's exactly one such manager and whoever satisfies the description is who we're talking about — for how I should build this thing. Specifically: what should happen when the description matches nothing, or matches two rows, or matches a row that's been soft-deleted; where the scope ambiguity stuff (the F is not G versus it's not the case that the F is G) actually bites in a pipeline like mine, given that I do support negation over attributes; and whether the three-valued logic and NULL semantics I inherited from SQL line up with the theory or quietly contradict it. I'd also like a straight answer on whether I should keep definite descriptions as their own construct in my grammar or dissolve them into something more primitive, which is what I suspect the theory is pushing me toward.

