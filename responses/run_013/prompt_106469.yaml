prompt: |-
  I am convening a seventy-five-minute session of an analytic epistemology reading group. The participants are faculty and graduate students who are fluent in the Gettier problem, reliabilism, virtue epistemology, and the internalism/externalism debate, but who have never read any Nyāya text and who will not have done preparatory reading. I want you to design the teaching plan for the session, not to deliver the exposition itself. The topic is Nyāya epistemology and the pramāṇas.

  The session must not be a survey of the four pramāṇas. It should be organized around a single conceptual pivot: the distinction between pramāṇa as the instrumental cause or means of a knowledge episode, pramā as the resultant cognition, and pramātṛ as the knower. The participants will arrive assuming that a pramāṇa is simply a source of justified true belief, and they will therefore hear the four pramāṇas as a list of faculties. Your plan should make the instrument/result distinction do the work of preventing that assimilation. It should also bring in two further ideas that the group will not know: first, that Nyāya treats memory, smṛti, as not a separate pramāṇa; and second, that a pramāṇa must issue in niścaya, a settled ascertainment, rather than merely a true belief, and that it is defeated by doṣa, a defect in the instrument or the knower. These are the materials you may assume; you should not need to introduce any other technical vocabulary.

  Please give me:

  1. The order in which the components must be introduced, and why each later component depends on the earlier ones. I want the dependency structure, not a topic list.

  2. The one carrying example that should run through the whole session. It must not be the stock fire-on-the-hill inference. It should be a case in which the pramāṇa is contested, so that the instrument/result distinction and the defect condition can both be exercised. State what the example must have and what it must lack, and explain why it can carry the load.

  3. The misconceptions you predict the group will form, in the order they will form them, and exactly where in the sequence each should be headed off. At minimum, address the assimilation of pramāṇa to justified true belief, the temptation to treat testimony as reducible to perception and inference, the reading of upamāna as mere analogical reasoning, and the assumption that Nyāya is a version of reliabilism.

  4. One question I can put to the group near the end that would show whether they have grasped the instrument/result distinction and the exclusion of memory, rather than merely memorized the four labels.

  5. What I should explicitly leave out at this level, and how I should say so, given that the group will ask about the sixteen categories, the Nyāya-Vaiśeṣika metaphysics, the Buddhist polemics, and the technical conditions for vyāpti.

  Do not give me readings, citations, or a bibliography. The plan should be self-contained and should not depend on the group having any text in front of them.
reasoning: |-
  Okay, the user is convening a 75-minute session on Nyāya epistemology for an analytic epistemology reading group. They want a teaching plan focused on the distinction between pramāṇa (instrumental cause), pramā (resultant cognition), and pramātṛ (knower). The participants are familiar with Gettier, reliabilism, etc., but new to Nyāya. The session shouldn't be a survey of the four pramāṇas but use the instrument/result distinction to prevent assimilating pramāṇa to justified true belief sources. Also need to cover why memory isn't a pramāṇa and the requirement for niścaya (settled cognition) defeated by doṣa (defects).

  First, I need to structure the dependencies. Start with the example to ground everything. The example must show a contested pramāṇa so defects and the instrument/result distinction can be explored. Avoid the standard fire-on-the-hill example. Maybe a case involving testimony or illusion. The user specified a case where the pramāṇa is contested. Let me think of one. How about seeing water in a desert? Common mirage example. But need something where the pramāṇa is questioned. Maybe a person seeing a snake that's actually a rope? But that's perceptual error. Need a case where the means is debated. Another idea: testimony from an unreliable source. Like hearing about water in a desert from someone who might be lying. But that might work. The user wants the example to carry through the whole session. So let’s outline: initial scenario (perception of oasis), later revealed as mirage, introducing defect. Then, reliable testimony about water elsewhere. This allows discussing perception vs. testimony, defects, and why memory isn’t a pramāṇa.

  The example must have: a perceptual claim that turns out false due to defect (doṣa), then a testimonial claim that's true, and perhaps memory involved but not as pramāṇa. Also, ensure it's not reducible to perception/inference easily. So, testimony from an expert about hidden water. Participants might think testimony is reducible to perception/inference, so the example needs to challenge that. The example should also show niścaya—settled belief that's later defeated.

  Now, the sequence of components. Dependency is key. Start with the example to introduce pramā and pramātṛ. Then define pramāṇa as instrument. Break down the knowledge episode: instrument, result, knower. Then introduce defects to show how pramāṇa fails. Then list the four pramāṇas, explaining each briefly but not as survey. Use the example to illustrate perception and testimony. Then explain why memory isn’t a pramāṇa using the same example. Finally, contrast with JTB and reliabilism.

  Misconceptions to address: 
  1. Pramāṇa as source of JTB: correct by showing pramāṇa causes pramā (result), which is niścaya, not just belief. 
  2. Testimony reducible: use the expert testimony in the example to show it's irreducible. 
  3. Upamāna as analogy: clarify it's identification through resemblance, not reasoning. Use a quick example like recognizing a gavaya based on cow description. 
  4. Nyāya as reliabilism: point out the causal mechanism and defect conditions, not just reliability.

  The check question at the end: ask why memory isn’t a pramāṇa, linking to instrument vs. result. For example, after the mirage, recalling the false perception doesn’t produce new knowledge.

  What to leave out: sixteen categories, metaphysics, Buddhist debates, vyāpti. State that the focus is on the epistemological framework, and other elements are for deeper study.

  Time allocation: 75 minutes total. Intro (5 min), Example and pramā/pramātṛ (15 min), Pramāṇa as instrument (10 min), Defects and niścaya (10 min), Four pramāṇas with example (15 min), Memory exclusion (10 min), Contrasts and misconceptions (10 min). Final question and wrap-up.

  Make sure the example is consistent. Revise the desert scenario: Traveler (Shanti) sees oasis (perception), believes it's water (pramā), but it's a mirage (doṣa: heat haze). Then meets geologist who testifies about water underground. Shanti believes, digs, finds water. Testimony here is śabda. Memory comes in when she recalls the mirage later, but that memory isn’t a pramāṇa since it reproduces past cognition.

  This should cover the requirements. Let me structure the answer accordingly.
answer: |-
  Here is the teaching plan structured as requested, with a single running example and explicit focus on the instrumental/result distinction to prevent assimilation to Western frameworks:

  ### 1. **Dependency Structure of Components**  
  *(Total: 75 min; timings are cumulative)*  
  - **Min 0–10: Introduce the running example**  
    *Why start here?* Anchors abstract concepts in a concrete case. Participants need shared context to "see" Nyāya distinctions experientially.  
  - **Min 10–20: Define *pramā* (resultant cognition) and *pramātṛ* (knower) using the example**  
    *Dependency:* The example makes *pramā* tangible (e.g., "Shanti *believes* there’s water"). *Pramātṛ* is intuitive (Shanti as agent). Without this, *pramāṇa* as "instrument" is incomprehensible.  
  - **Min 20–35: Define *pramāṇa* as *karaṇa* (instrumental cause) using the example**  
    *Dependency:* Now that *pramā* (result) is clear, *pramāṇa* can be framed as its *cause* (e.g., "What *caused* Shanti’s true belief?"). Contrast with Western "source" by asking: "Is a hammer the *source* of a chair or the *tool* that builds it?"  
  - **Min 35–45: Introduce *doṣa* (defect) and *niścaya* (settled cognition)**  
    *Dependency:* Participants must grasp *pramāṇa* as instrument to see how defects corrupt it. Use the example to show how *niścaya* (e.g., Shanti’s certainty) collapses when *doṣa* (e.g., heat haze) is exposed.  
  - **Min 45–60: List the four *pramāṇas* (perception, inference, analogy, testimony) through the lens of the distinction**  
    *Dependency:* With instrument/result established, each *pramāṇa* is introduced *not* as a "faculty" but as a *causal instrument* (e.g., testimony is the *tool* that produces *pramā*). Prevents list-memorization.  
  - **Min 60–70: Exclude memory (*smṛti*) as a *pramāṇa***  
    *Dependency:* Requires prior grasp of *pramāṇa* as *novel* causal instrument. Memory reproduces past *pramā*; it doesn’t *generate* new knowledge.  
  - **Min 70–75: Contrast with Western JTB/reliabilism**  
    *Dependency:* Final step once Nyāya’s causal structure is internalized.  

  ### 2. **The Carrying Example**  
  - **Scenario:** *Shanti, in a desert, sees a shimmering blue patch ahead ("water!"). A geologist tells her, "Dig here: there’s groundwater." She digs and finds water. Later, she recalls both events.*  
  - **Must have:**  
    - A perceptual error (mirage) showing *doṣa* (defect: heat haze distorting perception) invalidating *niścaya*.  
    - Testimony (geologist) as irreducible to perception/inference (she can’t perceive/infer groundwater).  
    - Memory (recalling mirage/testimony) to later exclude as *pramāṇa*.  
  - **Must lack:**  
    - Ambiguity about *what* is known (water exists/doesn’t exist).  
    - Overlap with stock examples (e.g., fire/smoke inference).  
  - **Why it works:**  
    The contested perception (mirage as defective instrument) and testimony (geologist as instrument) force attention to *how* the cognition is caused. Memory exclusion is natural when recalling past episodes.  

  ### 3. **Predicted Misconceptions & When to Correct Them**  
  - **Min 15–20 (after defining *pramā*):** "So *pramāṇa* is just a source of JTB!"  
    *Correction:* Immediately contrast *pramā* (result) with "belief," stressing *niścaya* as non-accidental *settled* cognition (e.g., Shanti’s certainty about the mirage was *pramā* until *doṣa* was revealed).  
  - **Min 50–55 (discussing testimony):** "Testimony is just inference + perception!"  
    *Correction:* When introducing *śabda*, use the geologist: "Did Shanti infer groundwater? No—she lacked premises. The geologist’s words *directly caused* her cognition."  
  - **Min 55–60 (discussing *upamāna*):** "This is analogical reasoning!"  
    *Correction:* Frame *upamāna* as *instrument of identification* (e.g., "A biologist tells Shanti, 'The *gavaya* looks like a cow.' Later, she *recognizes* a *gavaya* via resemblance"). Stress it’s *not* inference (no universal premise).  
  - **Min 70–75 (during contrast):** "Nyāya is just reliabilism!"  
    *Correction:* Note reliabilism omits *doṣa* (defect in the *instrument* or *knower*, e.g., Shanti’s dehydration) and conflates cause with justification.  

  ### 4. **Diagnostic Question**  
  **Ask:** *"When Shanti later remembers the geologist’s testimony, is memory a pramāṇa? Why can’t it be, even if her memory is true?"*  
  - **Reveals grasp if they:**  
    (a) Cite memory’s lack of novelty (it reproduces past *pramā*, not new *pramā*).  
    (b) Note memory isn’t the *instrument* that *caused* the original cognition (testimony was).  

  ### 5. **What to Explicitly Exclude & How**  
  - **Exclude:** The 16 categories, Vaiśeṣika metaphysics, Buddhist objections, *vyāpti* (universal concomitance).  
  - **How to say:** "Today’s focus is the *causal architecture* of knowing—*pramāṇa* as instrument, *pramā* as result. Think of this as Nyāya’s 'core engine.' Deeper metaphysics/polemics are *essential* but would obscure this foundation. We’ll revisit them in future sessions with texts."  

  ---

  **Session Flow Rationale:**  
  The sequence builds from concrete (example) to abstract (distinctions), forcing engagement with Nyāya’s causal model. The example’s defects (*doṣa*) and testimony block reductionism. Memory exclusion crystallizes the instrument/result divide. Western contrasts come last to avoid initial assimilation. Time allocations ensure conceptual pressure points (e.g., testimony) get focus.
