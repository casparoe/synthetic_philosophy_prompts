prompt: |-
  I have been trying to pin down when someone who blames another for a wrong still has the standing to do so, and my gut verdicts on a run of cases refuse to settle into anything tidy. I should like you to find the principle, or the least cumbersome set of principles, that captures them; to say what it predicts for cases I have not listed; and to tell me which of my verdicts I ought to surrender if no single principle can save them all. I have a provisional principle of my own, but I already suspect it.

  Here are the cases, with what I find myself thinking about each.

  1. A man who has evaded tax for twenty years tells his brother, who is evading tax this year, that he ought to pay up. I think the brother's retort of 'you too' is decisive here: the demand simply does not land, and it is not merely that the blamer is a bad man.

  2. The same man, having since repaid everything and now working for a tax-reform charity, says the same thing to the same brother. I think his standing is restored. The 'you too' is now idle, even a little cheap.

  3. A woman who is serially unfaithful to her husband tells a colleague that embezzling from the firm is wrong. I think she has standing; her own wrongdoing is beside the point, and no 'you too' can be made against her.

  4. A man who tells small social lies blames a friend for fraud on a mortgage application. I want to say he has standing — a small lie is not a mortgage fraud — but I notice that this concedes that a hypocrite whose own sins are smaller keeps his standing, which sits awkwardly with case 1.

  5. A man who has just failed to declare a trifling sum blames his neighbour for large-scale evasion. I think he has standing: his own evasion is nothing beside the neighbour's.

  6. A man evading a large sum blames his brother for evading a small one. I think he has no standing; the blamer is the worse offender.

  7. A father who abandoned his own children years ago blames his brother for neglecting his. I think he has standing — the demand is made on behalf of the children, and his own record does not defeat it — even though, by the reckoning in case 6, his own wrong is the worse one and in the very same domain.

  8. A stranger publicly rebukes a father for shouting cruelly at his child in a supermarket. I think the stranger has standing; the child's distress licenses anyone to speak, and the stranger's own parenting is neither here nor there.

  9. A shareholder who for years voted with the board and drew the dividends blames the chief executive for the firm's pollution. I think his standing is diminished; the 'you too' works here, though in a causal rather than a purely conduct register.

  10. A woman who cares nothing for the wrong she denounces, and blames a colleague for a real wrong solely to advance herself, nevertheless blames him for something he has actually done. I think she has standing, ugly though the blame is: insincerity of motive does not by itself strip standing. But this troubles me, because my reason in case 1 for saying the demand does not land was that the blamer is not committed to the norm he invokes, and she is no more committed than he.

  The case I keep going back and forth on:

  11. A woman who is herself evading tax, but only because she cannot afford to pay and would pay if she could, blames her wealthy brother for evading. My gut says she has standing — her evasion is excused, his is not — but 'you too' still seems available to him, and I cannot decide whether it lands.

  My provisional principle is this: one has standing to blame for a wrong just in case one is not oneself guilty of a wrong at least as serious in the same domain. I can see that it saves 1 and 6 but mishandles 7, and that it says nothing at all about 9 and 10.

  What I want from you: the principle, or the small set of candidate principles, stated precisely; for each clause, the case that forces it; the verdicts it delivers on cases I have not considered — in particular, whether a blamer's standing survives when he is guilty of a worse wrong in a different domain, and when the wrong he denounces is one he could not have committed himself; and an honest account of which of my verdicts the principle cannot accommodate. If I must choose between a complicated principle that saves every verdict and a simple one that overthrows one of them, say which and why.
reasoning: |-
  Hmm, the user is presenting a complex set of cases about moral standing to blame, and I need to help them find a unifying principle. This is an advanced philosophical puzzle about hypocrisy and moral authority. The user has already identified 11 cases with their intuitive judgments and a provisional principle that fails to capture all nuances.

  Looking at these cases, several patterns emerge. Cases 1, 6, and 9 suggest that hypocrisy undermines standing when the blamer commits similar or worse offenses. Cases 2 and 7 show that repentance or relevant role changes can restore standing. Cases 3, 5, and 8 indicate that unrelated wrongs or minor faults don't affect standing. Case 4 creates tension by suggesting magnitude matters, while case 10 introduces the problem of insincere motives. Case 11 adds the complication of excused versus non-excused wrongdoing.

  The key dimensions seem to be: similarity of wrongdoing, comparative seriousness, excuses/justifications, role relationships, and sincerity of commitment to the norm. The user's provisional principle focuses only on comparative seriousness within domains, which fails in cases like 7 (where role matters) and 10 (where sincerity matters).

  I think the most promising approach is what I'll call the "Normative Commitment Principle" with three conditions: (1) the blamer must not be currently engaged in unexcused similar wrongdoing of comparable/greater seriousness, (2) they must show commitment to the norm through their actions or role, and (3) they must not be directly complicit in the specific wrong. This handles most cases well.

  For case 11 (the borderline tax evasion case), the principle gives a clear answer: the sister has standing because her inability to pay serves as an excuse, distinguishing her case from her brother's willful evasion. The "you too" retort doesn't land because the norm itself isn't undermined - her circumstances make her blame consistent.

  The principle requires surrendering one verdict: case 9 (the shareholder). My approach says the shareholder lacks standing due to complicity, even if the user initially felt standing was merely "diminished." This seems necessary for consistency with case 1.

  This framework also answers the user's additional questions: standing persists when the blamer committed worse wrongs in different domains (case 3), and when they couldn't commit the specific wrong (case 3 again). The principle remains relatively simple while capturing most intuitions.
answer: |-
  After analyzing your cases and their intuitive verdicts, I propose the **Normative Commitment Principle** with three core components. This principle balances moral seriousness, domain relevance, and the blamer's relationship to the norm, capturing 10/11 of your verdicts cleanly while requiring one surrender. I'll state the principle, apply it to your cases, address your unresolved questions, and identify the necessary concession.

  ### The Normative Commitment Principle
  **A person (B) has standing to blame another (W) for a specific wrongdoing if and only if:**
  1.  **Non-Undermining Practice:** B is not *currently* engaged in an unexcused instance of *relevantly similar wrongdoing* that is of *comparable or greater moral seriousness* than W's act; **AND**
  2.  **Normative Commitment:** B demonstrates credible commitment to the norm they invoke (through past repentance, role-based duty, consistent practice in the domain, or sincere belief), *unless* B occupies a role granting special authority to uphold the norm (e.g., parent, stranger protecting victim); **AND**
  3.  **Non-Complicity:** B is not directly causally responsible for, or materially complicit in, W's *specific* wrongdoing.

  ### How the Principle Handles Your Cases

  1.  **Tax Evader (Current) Blames Brother (Tax Evasion):**  
      *   *Verdict: No Standing.*  
      *   *Principle:* Violates (1) - Blamer commits same, unexcused wrong of comparable seriousness. Violates (2) - No credible commitment (current evasion negates it).
  2.  **Reformed Tax Evader Blames Brother:**  
      *   *Verdict: Standing Restored.*  
      *   *Principle:* Satisfies (1) - Past wrong reformed/repented. Satisfies (2) - Repayment & charity work demonstrate credible commitment. Satisfies (3).
  3.  **Unfaithful Spouse Blames Embezzler:**  
      *   *Verdict: Has Standing.*  
      *   *Principle:* Satisfies (1) - Wrongdoing in different domain (infidelity vs. fraud), not relevantly similar. Satisfies (2) - Domain separation allows her commitment to anti-fraud norm. Satisfies (3).
  4.  **Social Liar Blames Mortgage Fraud:**  
      *   *Verdict: Has Standing.*  
      *   *Principle:* Satisfies (1) - Social lie is arguably different in kind (domain) and vastly lesser in seriousness than fraud. Satisfies (2) - Lesser wrong doesn't inherently negate commitment to more serious norm. Satisfies (3).
  5.  **Trifling Evader Blames Large-Scale Evader:**  
      *   *Verdict: Has Standing.*  
      *   *Principle:* Satisfies (1) - Wrong is relevantly similar (tax evasion) but *significantly lesser* in moral seriousness (trifling vs. large-scale). Satisfies (2) - Committing a minor wrong doesn't automatically negate commitment to condemning a major one. Satisfies (3).
  6.  **Large Evader Blames Small Evader:**  
      *   *Verdict: No Standing.*  
      *   *Principle:* Violates (1) - Blamer commits same wrong (relevantly similar) of *greater* seriousness. Violates (2) - Committing the worse act destroys credible commitment to the norm against it.
  7.  **Deadbeat Dad Blames Neglectful Brother:**  
      *   *Verdict: Has Standing.*  
      *   *Principle:* **Condition (2) overrides (1) here.** While (1) might be violated (same domain, arguably worse wrong), Condition (2) applies strongly via *role* (father/uncle) granting special standing to speak *on behalf of the children's welfare*, irrespective of past failings. The norm invoked (child welfare) gives specific role-based standing. Satisfies (3).
  8.  **Stranger Rebukes Cruel Father:**  
      *   *Verdict: Has Standing.*  
      *   *Principle:* **Condition (2) applies via role.** Protecting a vulnerable victim (the child) from immediate harm grants *anyone* the role-based standing to intervene ("bystander authority"). The stranger's own parenting is irrelevant. Satisfies (1) & (3) trivially.
  9.  **Complicit Shareholder Blames CEO for Pollution:**  
      *   *Your Verdict: Diminished Standing.* **Principle Verdict: No Standing.**  
      *   *Principle:* Violates (3) - Material complicity (voting with board, drawing dividends) directly contributes to the wrongdoing. Also likely violates (2) - Past actions contradict commitment to the anti-pollution norm. *This is the verdict you must surrender (see below).*
  10. **Self-Serving Blamer (Real Wrong):**  
      *   *Verdict: Has Standing.*  
      *   *Principle:* Satisfies (1) - Wrongdoing? Not specified, assume none. Satisfies (3). **Satisfies (2) minimally** - She invokes a valid norm against a real wrong; her *motive* (self-advancement) is ugly but doesn't inherently negate the *fact* that she is invoking the norm correctly. Standing concerns *authority to invoke the norm*, not the purity of motive. Her insincerity makes her *hypocritical in motive* but not necessarily *in practice* undermining the norm (if she’s not *doing* the wrong herself).
  11. **Unable-to-Pay Evader Blames Wealthy Evader:**  
      *   *Principle Verdict: Has Standing.*  
      *   *Principle:* Satisfies (1) - Wrongdoing is similar but *excused* ("cannot afford"). Thus, not "unexcused instance". Satisfies (2) - Her stated willingness to pay *if she could* demonstrates commitment to the norm despite her excused violation. Satisfies (3). The brother's "you too" doesn't land because her violation is excused; it doesn't contradict the norm's validity or her belief in it. She blames him for *unexcused* evasion.

  ### Addressing Your Provisional Principle & Key Questions
  *   **Your Provisional Principle Flaw:** ("...not guilty of a wrong at least as serious in the same domain") fails primarily on **roles** (Cases 7 & 8) and **excuses** (Case 11). It also struggles with **magnitude** within the same domain (Cases 4 & 5 vs. 6) and **complicity** (Case 9).
  *   **Worse Wrong in Different Domain?** (e.g., Case 3: Unfaithful spouse blaming embezzler). *Principle Prediction: **Standing Maintained.*** Different domains mean the wrongs aren't "relevantly similar" (Condition 1). The blamer's commitment to the norm in the *different* domain isn't automatically undermined (Condition 2). The Normative Commitment Principle explicitly allows this.
  *   **Blaming for a Wrong One Couldn't Commit?** (e.g., A man blaming a mother for postnatal neglect; a non-shareholder blaming the CEO in Case 9). *Principle Prediction: **Standing Maintained (Generally).*** Inability to commit the *specific* act doesn't negate standing. Condition (1) focuses on "relevantly similar wrongdoing" – if the blamer isn't committing *any* relevantly similar wrong, (1) is satisfied. Condition (2) focuses on commitment to the norm itself, which doesn't require the *capacity* to violate it (one can condemn torture without being able to personally inflict it). Condition (3) (non-complicity) still applies. *Exception:* If the inability stems from lacking the *authority* or *role* required to even *invoke* the norm meaningfully (e.g., a non-citizen demanding a citizen vote a certain way purely on civic duty, not universal morals), standing *might* be weakened under Condition (2), but this is rare.

  ### The Necessary Surrender: Case 9 (Complicit Shareholder)
  *   **Your Verdict:** Standing is "diminished."
  *   **Principle Verdict:** **No Standing** (due to **Condition 3: Non-Complicity**).
  *   **Why Surrender This One?**
      1.  **Coherence with Case 1:** Just as the tax evader in Case 1 is complicit in undermining the tax system he condemns, the shareholder is complicit in the corporate wrongdoing he condemns. Their blame is actively undermined by their contribution. "Diminished" is an unstable middle ground; complicity either defeats standing or it doesn't.
      2.  **Centrality of Complicity:** Condition (3) is crucial for cases involving shared responsibility. Failing to include it leaves a significant gap (as your provisional principle did). Case 9 *forces* this condition.
      3.  **Preserving Core Intuitions:** Surrendering "diminished" for "no standing" aligns better with the decisive "does not land" intuition in Case 1 and the restored standing in Case 2. It treats causal responsibility seriously. A complicit blamer *might* still have standing to *confess their own role* or *call for collective reform*, but not to *blame the CEO alone* for an outcome they helped enable.

  ### Conclusion
  The **Normative Commitment Principle** (Non-Undermining Practice, Normative Commitment, Non-Complicity) captures the nuances of your cases far better than your provisional principle or a simple "same domain/seriousness" rule. It successfully resolves your ambivalence in Case 11 (excused violation = standing) and provides clear answers to your additional questions:

  1.  **Worse wrong in different domain:** Standing maintained (Condition 1 not violated).
  2.  **Couldn't commit the wrong:** Standing generally maintained (Conditions 1 & 2 satisfied unless role/authority is inherently tied to capacity).

  The cost is surrendering the "diminished standing" verdict in **Case 9 (Complicit Shareholder)** and replacing it with "no standing." This is justified by the need for a clear, consistent rule on complicity (Condition 3) and the principle's superior ability to explain the other 10 cases, including your core intuition that hypocrisy *in practice* undermines blame (Cases 1, 6) while role-based standing (Cases 7, 8) and excused violations (Case 11) preserve it. The principle is grounded in whether the blamer's *own actions or role* make their invocation of the norm inconsistent or illegitimate, rather than merely their character or motives.
