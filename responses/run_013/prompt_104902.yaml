prompt: |-
  I'm a retired geophysicist — did seismic tomography for 35 years, now doing a part-time philosophy MA because I have too much time and a patient wife. I've gotten obsessed with the money-pump stuff on diachronic rationality, and I want a straight probability from you, not a survey. Here's the proposition I care about: an agent whose preferences over final outcomes are cyclical (she prefers A to B, B to C, and C to A, each sincerely and stably) is irrational in virtue of that cycle alone, even if she never actually faces a sequence of trades that exploits it, and even if she is the sort of agent who, seeing the whole sequence in advance, would refuse to start. I'm at about 0.35 on that; a friend in the department is at 0.8 and thinks I'm just confused about what rational means for a temporally extended agent. Please give me your credence, but decompose it: how much rides on whether diachronic rationality is a seperate requirement from choosing the best option at each choice point; how much on whether the money-pump is a genuine argument or a parlor trick that assumes you can't bind yourself; how much on whether preferences are time-indexed (preferring A-now to B-later vs A-simpliciter to B-simpliciter); how much on whether resolute choice is psychologically available or normatively legitimate; and whatever other terms you think belong. Give each a rough number and one line, then combine them and tell me which sub-question my friend and I most likely actually disagree about.

  Also, since I'm trying to make this concrete for a seminar: imagine a variant where the pump is administered by a machine that erases your memory of each previous trade, so you never experience the cycle as a cycle — only a series of locally attractive swaps. Does that raise or lower your credence that the cycle itself is irrational? And what single result or argument would move your number most?
