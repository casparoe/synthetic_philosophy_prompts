answer: |-
  ### Activity Design: "Neighborhood Park Project"  
  **Objective:** Experience different structural traps where collective outcomes are worse than possible alternatives, despite no one desiring them. Participants feel trapped by the rules, not by others' malice.  

  ---

  ### **Materials**  
  1. **Decision Cards** (20 per round): Small slips where players write "C" (Contribute) or "D" (Don’t).  
  2. **Personal Score Sheets**: Grid for players to record round-by-round points.  
  3. **Facilitator Tally Sheet**: To count choices and announce payoffs.  
  4. **Rules Briefing Cards**: One per round (distributed sequentially).  

  ---

  ### **Payoff Schemes**  
  *Surface scenario:* "You are residents deciding whether to contribute to a neighborhood park. Points reflect your self-interest (e.g., effort saved, park benefits). Maximize your own score."  

  | **Round** | **Rules** | **Payoffs** | **Load-Bearing Inequalities** |  
  |-----------|-----------|-------------|-------------------------------|  
  | **1: Assurance Problem** | Park succeeds if ≥15 contribute. | • If ≥15 contribute: C gets 10, D gets 5. <br> • If <15 contribute: C gets -10, D gets 0. | • 10 > 5 > 0 > -10: Ensures contributing is good only if enough join. <br> • Difference between 10 and 5 makes free-riding tempting if safe. |  
  | **2: Dominant Defection** | Payoffs depend on your choice and total contributors. | • If you choose C: `2 × (total C) - 3` <br> • If you choose D: `2 × (total C)` | • `2 × C > 2 × C - 3` always: Makes D better *regardless* of others. <br> • Arbitrary: Base numbers (3, 2) set scale but not structure. |  
  | **3: Veto Problem** | Park succeeds only if *all* 20 contribute. | • If all contribute: Each C gets 10. <br> • If any D: Each C gets -10, each D gets 0. | • -10 < 0: Ensures contributing is risky alone. <br> • 10 > 0: Makes full contribution ideal but fragile. |  
  | **4: Shadow of Future** | 5 repeated rounds of Round 2 rules. Total points summed. | Same as Round 2. | • Repeated interaction shifts incentives: Defection risks retaliation. |  

  **Why these numbers?**  
  - **Load-bearing**: Inequalities create tension between self-interest and group outcomes (e.g., in Round 2, D always beats C by 3 points).  
  - **Arbitrary**: Point magnitudes (e.g., 10 vs. 5) simplify scoring; they don’t imply moral weight.  

  ---

  ### **Run Sheet**  
  *(Total: 80 minutes; Debrief: 25 minutes)*  

  #### **Opening Briefing (5 min)**  
  *"Welcome. We’re exploring neighborhood decisions. Each round, you’ll choose privately: C (Contribute) or D (Don’t). Rules may change. Your goal: maximize personal points. No talking during decisions. Points aren’t moral judgments—they’re incentives. Record scores on your sheet. We start now."*  

  #### **Round 1: Assurance Problem (15 min)**  
  1. **Distribute Round 1 Rules Card** (2 min).  
  2. **Decide**: Players write C/D (3 min). Collect cards.  
  3. **Tally**: Count Cs. Announce if ≥15. Report payoffs. Players record scores (10 min).  

  #### **Round 2: Dominant Defection (15 min)**  
  1. **Distribute Round 2 Rules Card** (2 min).  
  2. **Decide/Collect** (3 min).  
  3. **Tally**: Announce total C. Players compute own payoffs (e.g., "If you chose C: `2×15 - 3 = 27`"). Record scores (10 min).  

  #### **Round 3: Veto Problem (15 min)**  
  1. **Distribute Round 3 Rules Card** (2 min).  
  2. **Decide/Collect** (3 min).  
  3. **Tally**: Check for 20 Cs. Announce outcome. Report payoffs (e.g., "One D: Cs get -10, Ds get 0"). Record scores (10 min).  

  #### **Round 4: Shadow of Future (15 min)**  
  1. **Distribute Round 4 Rules Card**: "5 rounds of Round 2 rules. Points sum." (2 min).  
  2. **Play 5 quick rounds**: Each round: decide/collect (1 min), tally/announce (2 min).  
  3. **Record cumulative score** (15 min total).  

  ---

  ### **Debrief Guide**  
  *(Map to core ideas; avoid jargon initially)*  

  1. **Feelings First (5 min)**:  
     - *Ask:* "Describe your emotion in Round 1 vs. 2 vs. 3. When did you feel trapped? Helpless?"  
     - *Highlight:* Trapped by rules, not people.  

  2. **Structural Differences (10 min)**:  
     - **Round 1** (Assurance):  
       - *Ask:* "Why didn’t we get the good outcome even though it was possible?"  
       - *Point:* You needed assurance others would join. No one could commit.  
     - **Round 2** (Dominant Defection):  
       - *Ask:* "Why did agreements (if any) collapse?"  
       - *Point:* Self-interest *required* defection, regardless of others.  
     - **Round 3** (Veto):  
       - *Ask:* "Why did nothing happen? Was blocking intentional?"  
       - *Point:* Each held veto power → mutual blockade. Mirror of overuse (tragedy of the commons).  
     - **Round 4** (Shadow):  
       - *Ask:* "Why did behavior change? What made cooperation possible?"  
       - *Point:* Future interactions enabled reciprocity.  

  3. **Remedies Depend on Diagnosis (5 min)**:  
     - Assurance (Round 1): Build trust (e.g., pledges).  
     - Defection (Round 2): Enforce commitments (e.g., penalties).  
     - Veto (Round 3): Reduce veto points (e.g., majority rules).  
     - Shadow (Round 4): Sustain interactions (e.g., repeated deals).  
     - *Crucial:* Applying Round 4’s "reciprocity" to Round 2 fails (defection still dominant).  

  4. **Vocabulary Last (5 min)**:  
     - Name phenomena: Assurance problem, Prisoner’s Dilemma, Anti-Commons, Shadow of Future.  
     - Emphasize: Same "race to the bottom" feeling, different structures.  

  ---

  ### **Predictable Problems & Solutions**  
  1. **Collusion before rules understood**:  
     - *Problem:* Players agree to "all contribute" preemptively.  
     - *Solution:* Stress "no talking" and private decisions. If occurs, use it in debrief: "Why did collusion work in Round 1 but not Round 2?"  

  2. **Refusal of dominant move**:  
     - *Problem:* One player contributes in Round 2, shifting group payoffs.  
     - *Solution:* Announce: "Remember, your choice affects others." Debrief: "Did one altruist change outcomes? In real life, would this last?"  

  3. **Round 1 norms bleed into later rounds**:  
     - *Problem:* High Round 1 contribution → trust persists in Round 2.  
     - *Solution:* Reset expectations: "Rules have changed" each round. Debrief: "How did past rounds influence you?"  

  4. **Payoffs seen as moral weights**:  
     - *Problem:* Players equate points with "rightness."  
     - *Solution:* Opening briefing: "Points are self-interest, not ethics." Debrief: "Did you feel guilty defecting? Real races reshape morality."  

  5. **Debrief becomes lecture**:  
     - *Problem:* Students disengage; facilitator talks too much.  
     - *Solution:* Use open questions ("How did you feel?"). Poll reactions.  

  ---

  ### **Limitations of the Activity**  
  *(Clarify in debrief)*  
  - **Scale**: 20 players ≠ millions in real races (e.g., climate change).  
  - **Time**: Decades of institutional drift compressed to minutes.  
  - **Preference endogeneity**: Real races reshape desires (e.g., arms races normalize spending); here, payoffs are fixed.  
  - **Complicity**: Game doesn’t resolve blame ("Did I cause this?").  
  - **Direction**: Activity assumes "bottom" is bad. Real races can run upward (e.g., quality competition).  

  ---

  ### **Contested vs. Settled in Scholarship**  
  **Settled**:  
  - Structure matters: Identical incentives produce identical outcomes (e.g., dominant defection → mutual failure).  
  - Remedies are diagnosis-specific (e.g., communication helps assurance but not dominant defection).  
  - "Shadow of future" enables cooperation in repeated games.  

  **Contested**:  
  1. **One phenomenon or many?**  
     - *Settled:* All involve "collective action problems."  
     - *Contested:* Whether PD, assurance, etc., share a unified cause (e.g., institutions vs. psychology).  

  2. **Fault lies in**:  
     - *Structure:* Rules incentivize bad outcomes (activity emphasizes this).  
     - *Institutions:* Poorly designed rules *create* traps.  
     - *Preferences:* If people valued others’ outcomes, traps vanish.  

  3. **Direction of races**:  
     - *Contested:* "Race to bottom" implies inevitable decline. But competition can improve standards (e.g., labor laws). Activity omits this.  

  **Activity’s Bias**:  
  - Takes sides by framing structures as primary causes (vs. preferences).  
  - Implies "bottom" is always bad (though debrief can nuance this).  

  ---

  **Final Note**: This design prioritizes *feeling trapped* over theoretical completeness. Run it as a visceral probe, then layer on nuance in debrief. Adjust timings if rounds run long—let students sit with frustration!
