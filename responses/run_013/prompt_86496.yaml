  This looks like the Doctrine of Double Effect (DDE). DDE allows causing harm if it's a side effect of a good action, but not if intended. So in the organ harvesting case, killing the patient is the means to save others, hence forbidden. In the bioweapon case, killing the healthy person is necessary to create the antidote, so it's a means to an end. Therefore, she would say no.

  Another possible rule could be about direct physical force or using a person's body. The organ case involves using the body, which she rejects. The bioweapon scenario also requires using the person's body without consent. So that also points to a no.

