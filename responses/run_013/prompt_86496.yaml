  The further test case: imagine a scenario where you need to kill one as a means but without using their body. For example, tricking someone into stepping in front of the trolley to stop it. If she rejects that, it's DDE. But if she rejects only when the body is used, then she might allow it. But in her past, pushing the fat man is rejected, and that doesn't involve harvesting organs, just direct force. So DDE seems more consistent. 

