  First, flipping the trolley switch to save five by killing one: she's okay with that. But pushing a fat man off the bridge to stop the trolley: she says no. Harvesting organs from one healthy patient to save five: no. Bombing a munitions factory knowing five workers die as collateral: fine. Bombing the barracks intentionally to kill workers for morale: no. Leaving one to drown to save five: okay. And she shrugs off the deontology paradox by saying some things you just don't do.

  Now the new case: using one healthy, non-consenting person to make an antidote for a bioweapon that would otherwise kill a hundred thousand. The user wants to know her verdict and the underlying rule. They suspect two possible rules that fit past cases but differ here.

