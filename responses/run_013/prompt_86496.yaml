answer: |-
  **She says no to killing the one for the antidote.**  

  ### Candidate Rules & Predictions  
  1. **Doctrine of Double Effect (DDE)**:  
     - **Rule**: Harming/killing is permissible only if unintended and merely foreseen (a side effect), not intended as a means or end. The act itself must be good/neutral.  
     - **Prediction for antidote case**: Forbidden. Killing the healthy man is *intended* as the direct means to obtain the antidote (like organ harvesting).  
     - **Fits all prior cases**:  
       - ✅ Flip trolley switch: Death foreseen but unintended (goal: divert trolley).  
       - ❌ Push fat man: Death intended as means (goal: stop trolley *by* killing).  
       - ❌ Organ harvest: Death intended as means (goal: save lives *by* killing).  
       - ✅ Bomb factory: Workers' deaths foreseen but unintended (goal: destroy munitions).  
       - ❌ Bomb barracks: Deaths intended as means (goal: break morale *by* killing).  
       - ✅ Leave to drown: Death foreseen but unintended (goal: save others, not *by* killing).  

  2. **Bodily Autonomy/Inviolability**:  
     - **Rule**: Deliberately using someone’s body/agency against their will (e.g., physical invasion, force) to harm or kill is absolutely forbidden, even for greater good.  
     - **Prediction for antidote case**: Forbidden. Requires non-consensual use of the man’s body (like organ harvesting).  
     - **Fits all prior cases**:  
       - ✅ Flip switch: No bodily invasion (distant action).  
       - ❌ Push fat man: Direct physical force/use of body.  
       - ❌ Organ harvest: Direct physical invasion/use of body.  
       - ✅ Bomb factory: No targeted bodily violation (collateral damage).  
       - ❌ Bomb barracks: Direct targeting/use of bodies as tools.  
       - ✅ Leave to drown: No force/invasion (omission only).  

  ### Which Rule to Bet On  
  - **Bet on DDE** (slightly stronger fit).  
  - **Why**:  
    - DDE cleanly explains *all* cases, including the "bomb factory" (intention matters) vs. "bomb barracks" (intention shifts) split.  
    - Her "shrug" about "things you just don’t do" aligns with deontological constraints on intention.  
    - Bodily autonomy struggles with "push fat man" (physical force) vs. "flip switch" (no force but still direct harm causation) — DDE handles this via intention.  

  ### The Decisive Test Case  
  **Scenario**: *You can stop a runaway trolley by pressing a button that remotely drops a heavy sandbag onto the track, crushing one innocent bystander standing there. Death is necessary and intended to stop the trolley.*  
  - **DDE predicts**: ❌ Forbidden. Death is *intended* as the means to stop the trolley (like pushing fat man).  
  - **Bodily Autonomy predicts**: ✅ Permissible. No direct physical force/invasion of the bystander’s body (remote action, like flipping the switch).  

  Your tutor’s record *doesn’t fully settle* between these rules (both forbid the antidote case), but DDE is more consistent with her emphasis on *means/intent*. The sandbag case forces a split by isolating intention without bodily invasion.
