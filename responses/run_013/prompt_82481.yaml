prompt: |-
  I have just been appointed to my university's student conduct board, which decides what sanctions follow a finding of academic dishonesty, and I have begun reading theories of punishment in order to work out what our sanctions should even be aiming at. Before I read further, I want the specification rather than the theories: what must an adequate theory of punishment deliver? Set out the desiderata, each with the case or consideration that motivates it. I have in mind things of this kind — that it explain why hard treatment is permissible at all, rather than prevention or compensation alone; that it explain why only the guilty may be punished, even where punishing an innocent would produce more good overall; that it give an account of how much punishment is fitting; that it distinguish punishment from quarantine, from taxation, and from the mere price of a rule; that it say what gives an institution the standing to impose hard treatment on this person at all (why the university may sanction a student for cheating but not a non-student who does the same thing); and that it handle the offender already ruined by his own offence, the mala prohibita offender who did nothing independently wrong, the corporation that cannot feel pain, and the dead offender. For each requirement, say why it is a requirement and how far it is negotiable. Then tell me which requirements cannot be satisfied together, and why — that is the part I most want, since a jointly unsatisfiable list is itself the result. End by naming the single requirement that does the most to exclude the most popular theories, and say what it excludes.

  Give it in four sections: Desiderata, a sentence or two per requirement with the case behind it; Joint satisfiability, one paragraph; The most exclusionary requirement, one paragraph; and Implications for the board, one paragraph.
reasoning: |-
  Okay, the user is asking about the requirements for an adequate theory of punishment, specifically for their role on a university conduct board. They want a structured response with four sections: Desiderata, Joint satisfiability, The most exclusionary requirement, and Implications for the board. I need to cover all the points they mentioned, like explaining hard treatment, guilt, proportionality, distinctions from other concepts, institutional standing, and special cases like ruined offenders or corporations. 

  First, I should list out the desiderata clearly. Each one needs a brief explanation and a motivating case. For example, the permissibility of hard treatment versus prevention alone is motivated by the Lockean case where incapacitation isn't enough. The guilt requirement comes from the trolley problem variant where punishing an innocent would prevent more harm but is still wrong. Proportionality needs to handle both minor and major offenses, like cheating versus assault. 

  Then, distinguishing punishment from quarantine, taxation, and prices. Quarantine is about danger, not desert; taxation is distributive, not retributive; prices are voluntary costs. Institutional standing: why the university can punish students but not outsiders, based on consent or social contract. Special cases: the ruined offender (like a plagiarist who's expelled already), mala prohibita (parking fines where no moral wrong), corporations (fines as symbolic), and the dead offender (posthumous sanctions).

  Next, joint satisfiability. Some of these conflict. For instance, hard treatment permissibility (desert-based) clashes with prevention-only theories that can't explain why only the guilty. Mala prohibita offenders challenge retributivism since there's no moral desert. Corporal punishment theories fail with corporations. So, no theory satisfies all perfectly, but hybrid approaches might try.

  The most exclusionary requirement is probably the guilt requirement. It excludes consequentialist theories (utilitarianism) that would punish innocents for greater good. It also challenges some prevention-focused models. This is central because it defines punishment as inherently tied to fault.

  For implications, the board should focus on proportionality, consistency, and institutional role. Use sanctions that fit the offense and context, like community service for minor cheating. Avoid punitive excess. Hybrid approaches—desert for guilt, consequences for prevention—might work. The key is transparency and fairness to maintain legitimacy.

  I need to ensure each section is concise. In Desiderata, keep each point to a sentence or two with the case. Joint satisfiability in one paragraph highlighting conflicts. Most exclusionary in another, emphasizing guilt. Implications practical for the board. Avoid jargon, make it accessible since the user is new to this. Check that all user points are covered, especially the special cases and conflicts. Make sure the answer helps them apply theory to real cases they'll face.
answer: |-
  ### Desiderata  
  1.  **Permissibility of Hard Treatment:** Must justify why *suffering* (beyond prevention/compensation) is permissible. *Motivation:* Lockean thief – incapacitation stops future theft, but society demands punishment even if prevention is achieved. Hard treatment signals communal condemnation. (Negotiable: *Degree* of suffering, but core permissibility isn't.)
  2.  **Guilt Requirement:** Must explain why only the *guilty* can be punished, even if punishing an innocent yields greater good. *Motivation:* Trolley variant – framing an innocent student deters widespread cheating, yet is intuitively impermissible. Punishment requires fault. (Non-negotiable: Core to the concept of *punishment* vs. mere social engineering.)
  3.  **Proportionality:** Must provide a principled account of *how much* punishment is fitting. *Motivation:* Consistency – why is expulsion fitting for cheating on an exam but not for assault? Requires a metric (harm, culpability, desert). (Negotiable: *Precise* calibration, but a rough ordinal scale (minor/major) is essential.)
  4.  **Distinction from Quarantine:** Must differentiate punishment from preventative detention of the dangerous. *Motivation:* Quarantining a disease carrier vs. punishing a plagiarist – one is risk-based, the other desert-based. (Negotiable: Overlap in *effect*, but the *justification* must differ.)
  5.  **Distinction from Taxation/Price:** Must separate punishment from redistributive levies (tax) or voluntary costs (price). *Motivation:* A fine for cheating isn't a fee for a service (like tuition) nor general revenue; it expresses censure. (Negotiable: Fine *amounts* might resemble fees, but the *meaning* must be distinct.)
  6.  **Institutional Standing:** Must explain *who* has the authority to punish whom. *Motivation:* Why can the university sanction a student for cheating, but not a visiting scholar for the same act? Requires grounding in consent, contract, or constitutive role. (Negotiable: *Scope* of authority, but some grounding is essential.)
  7.  **Handling Special Cases:**
      *   **Ruined Offender:** Must address punishing someone whose offense already destroyed their life (e.g., expelled plagiarist). *Motivation:* Is further sanction (degree revocation) redundant or still meaningful? Requires a purpose beyond mere suffering.
      *   **Mala Prohibita:** Must explain punishing violations of rules with no inherent moral wrong (e.g., specific citation formats). *Motivation:* Why censure for a purely conventional offense? Needs a link to broader obligations.
      *   **Corporations:** Must account for punishing entities that cannot feel pain (e.g., fining a cheating research lab). *Motivation:* Requires a non-experiential understanding of burden/censure.
      *   **Dead Offender:** Must address posthumous sanctions (e.g., posthumous degree revocation). *Motivation:* Does censure or setting the record straight have meaning if the offender cannot experience it?

  ### Joint Satisfiability
  No single theory satisfies all desiderata simultaneously. **Retributivism** (desert-based) excels at 1 (hard treatment as deserved), 2 (guilt requirement), 3 (proportionality via desert), and 4 (distinct from quarantine), but struggles profoundly with 6 (standing – why does *this* institution deserve to inflict desert?), 7b (mala prohibita – where's the pre-existing moral desert?), and 7c/7d (corporations/dead – who experiences the desert?). **Consequentialism** (prevention/deterrence) handles 6 (standing via social utility), 7a (ruined – sanction if still preventive), 7b (mala prohibita – deter rule-breaking), and 7c (corporations – deterrence works) better, but catastrophically fails 2 (guilt requirement – punishes innocents if beneficial) and struggles with 1 (why hard treatment over cheaper prevention?) and 4 (blurs into quarantine). **Communicative theories** handle 1 (hard treatment as message), 5 (distinct from tax/price), and aspects of 7, but falter on 3 (proportionality of message) and 6 (standing to communicate censure). **Hybrid theories** attempt combinations but inevitably privilege some desiderata over others, creating internal tensions (e.g., how much consequential good justifies deviating from desert?).

  ### The Most Exclusionary Requirement
  The **Guilt Requirement** (#2) is the most exclusionary. It immediately and decisively eliminates all purely **consequentialist theories** (utilitarianism, pure deterrence). These theories, by definition, justify punishment based on future outcomes. If punishing an innocent person (e.g., scapegoating a student to deter cheating) produces the best overall consequences (e.g., widespread fear leading to compliance), consequentialism *requires* it. This violates the core, non-negotiable intuition that punishment must be *for* a wrong committed *by* the person punished. The guilt requirement forces a theory to incorporate an element of *backward-looking desert or fault* as a necessary condition, which pure forward-looking consequentialism cannot do. It also challenges weak retributivism or extreme prevention-focused models that see guilt only as a pragmatic constraint.

  ### Implications for the Board
  Recognizing that no perfect theory exists, focus on **transparency, consistency, proportionality, and institutional purpose**. Ground sanctions primarily in **desert** (guilt, culpability, harm to academic integrity - satisfying #1, #2, #3 partially) to maintain legitimacy and fairness, ensuring sanctions are deserved *and* proportionate to the specific offense within the *academic context*. Incorporate **consequentialist aims** (deterrence, rehabilitation, protection of academic standards - relevant to #6, #7) cautiously, *only* where they align with desert and the university's educational mission (e.g., requiring a plagiarism workshop *alongside* a grade penalty). Explicitly define the **university's standing** (#6) via the student's voluntary membership and agreement to abide by its academic code. Prioritize sanctions that serve **communication** (#5) and **education** over mere suffering, especially for *mala prohibita* (#7b) or corporate entities (#7c). Avoid purely symbolic or excessive sanctions for the "ruined" (#7a) or dead (#7d) unless vital for record-keeping or community trust. Document the rationale explicitly linking the sanction to the offense's nature and the university's goals.
