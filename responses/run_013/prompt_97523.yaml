answer: |-
  ### Decision Tree: Updating Rules for Uncertain Evidence

  Start: **You've got some evidence, but you're not certain of it.**  
  *Example: You see a blurry photo of a bird. Is it a goldfinch? You’re 60% sure, but it’s hazy.*

  #### Question 1: How is your uncertainty quantified?  
  - **A. I have a new probability distribution over a partition** (e.g., P(goldfinch) = 0.6, P(not goldfinch) = 0.4).  
  - **B. I have a precise likelihood ratio** (e.g., "This witness report is 3× likelier if the suspect is guilty").  
  - **C. I can treat the evidence as a proposition** (e.g., "I had a goldfinch-like experience").  
  - **D. I have a vague feeling or use non-probabilistic beliefs.**

  ---

  #### If A: You have a new distribution over a partition (e.g., blurry photo)  
  **Question A1:** Do your conditional probabilities for other claims *given the partition* stay the same? (e.g., If it’s a goldfinch, does P(red beak | goldfinch) stay fixed?)  
  - **Yes** → **Question A2:** Suppose you get **two uncertain updates** (e.g., blurry photo + shaky witness). Should order affect your final belief?  
    - **Yes, order might matter** → **Leaf: Jeffrey Conditionalization**  
      - *Awkward commitment:* Your posterior can flip if you process evidence in different orders.  
    - **No, order shouldn’t matter** → **Leaf: Refuse to Update Until All Evidence Is In**  
      - *Awkward commitment:* You ignore evidence until you can jointly update, risking missed insights.  
  - **No** → **Leaf: Ad Hoc Adjustment or Stalemate**  
    - *Awkward commitment:* No consensus rule exists; you’re stuck with guesswork or refusing to update.  

  ---

  #### If B: You have a likelihood ratio (e.g., witness reliability)  
  → **Leaf: Likelihood-Ratio (Virtual Evidence) Updating**  
  - *Awkward commitment:* Ignores the prior probability of the evidence itself (e.g., how likely the witness is to testify at all).  
  *Note:* Order doesn’t matter here—commutes nicely!  

  ---

  #### If C: You treat evidence as a proposition (e.g., "I experienced a goldfinch-sighting")  
  → **Leaf: Conditionalize on the Experience Proposition**  
  - *Awkward commitment:* You need precise priors for the experience under all hypotheses (e.g., P(experience | goldfinch) and P(experience | not goldfinch)).  

  ---

  #### If D: Vague feeling or non-probabilistic  
  **Question D1:** Do you want to update at all?  
  - **No** → **Leaf: Refuse to Update Until Evidence Firms Up**  
    - *Awkward commitment:* You dismiss potentially useful clues if they stay fuzzy.  
  - **Yes** → **Question D2:** How do you handle conflicting evidence?  
    - **I assign weights to possibilities** → **Leaf: Dempster-Shafer Theory**  
      - *Awkward commitment:* Dempster’s rule can produce wild distortions when evidence clashes.  
    - **I use discrete degrees of disbelief** → **Leaf: Ranking Theory**  
      - *Awkward commitment:* Ranks are coarse (e.g., "surprise levels") and can’t capture nuanced probabilities.  

  ---

  ### Key Notes:
  - **"Refuse to Update" Collapse:** "Refuse until all evidence is in" (A2) and "Refuse until evidence firms up" (D1) are similar—both delay action. But A2 is motivated by order-dependence, while D1 stems from unquantifiable vagueness.  
  - **Unexplored Branches:**  
    - **Rigidity failure (A1 → No):** No standard rule exists. Likely because it’s incoherent with probability axioms without extra assumptions.  
    - **Order-dependence refusal (A2 → No):** Rarely formalized. Probably unexplored—no one wants to defend "update order matters" *and* "order shouldn’t matter" simultaneously.  
  - **Crux Example:** For **order-dependence**, imagine two blurry photos: Process Photo 1 (P(goldfinch)=0.6), then Photo 2 (P(goldfinch)=0.7) → different posterior than reversing the order under Jeffrey.  

