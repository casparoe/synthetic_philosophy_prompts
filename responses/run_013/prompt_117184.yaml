prompt: |-
  My flatmate Nina is obssessed with the royals and has really firm opinions about when a king or queen is allowed to do something off their own bat instead of just doing what the government tells them. Here's where she's landed on the ones we keep arguing about:

  - A bill passes with a massive majority and the public's behind it, and the king refuses to sign it because he personally thinks it's immoral. Nina says that's out of order, it's not his call.
  - An election leaves nobody with a majority, and the king has to decide who to ask to try to form a government. She says he's entitled to pick whoever can actually get the votes in parliament, even if that's not the sitting PM, and even if the sitting PM is telling him to pick himself.
  - The PM asks the king for an early election purely to get out of a vote he's about to lose. She says the king should refuse, even though it's the PM himself who's asking.
  - A PM loses the election and won't leave, and asks the king to shut parliament down so he can carry on ruling on his own. She says the king should tell him where to go and swear in the other lot.

  She's also got a thing about how the Japanese emperor is basically not allowed to do anything at all, and she can't decide whether that's the ideal version of a monarchy or a waste of a perfectly good one.

  Now here's the one I actually want her verdict on, and she's away for a fortnight so I can't ask her. A bill passes easily. It was in the governing party's manifesto, parliament has properly voted it through, there's no sneaky power grab, nobody's messing with elections. But the public hate it, like two thirds against in the polls, and the king genuinely believes it's unjust. He refuses to sign it, goes on telly and explains why, and most of the public backs him. The government would just get hammered at the next election anyway if people are that annoyed.

  So what's she going to say, and whats the rule she's actually been running this whole time? I've got a feeling she's got one rule doing the work in the first case and the last case and maybe a seperate one for the middle two, and I want to know if that's right or if there's just one rule covering all of it. Which of the rules that fit everything she's said does my new case actually test? If you had to bet, which way does she go and why? And then tell me what I should ask her about next, so I can tell whether she thinks a king can veto anything the public's against, or only laws that are genuinely unjust and that the public's against as well.
reasoning: |-
  Okay, let me try to unpack this user's query. They're describing their flatmate Nina's views on the powers of a constitutional monarch in various scenarios. The user wants to know how Nina would judge a specific case where the king refuses to sign a bill that's popular in parliament but unpopular with the public, and they also want to figure out the underlying rule Nina uses.

  First, I need to analyze the patterns in Nina's existing positions. In the first scenario, she says the king can't refuse to sign a bill based on personal morality, even with public support. That suggests she values parliamentary sovereignty over royal prerogative. The second and third scenarios involve the king making decisions about government formation and elections. Here, Nina allows the king discretion to act as a constitutional referee, ensuring democratic processes aren't abused. The fourth scenario reinforces this—the king must intervene to prevent a defeated PM from clinging to power.

  The user's new case presents a conflict: parliament passed a bill aligned with its manifesto, but the public hates it, and the king refuses assent citing injustice. This tests the boundary between parliamentary mandate and public opinion. Nina's previous stances indicate she'd likely oppose the king's intervention here. Why? Because the bill followed proper legislative processes without procedural abuse. Her rule seems to be: monarchs can block only procedural abuses, not policy disagreements, even with public backing.

  The user also wants to know how to test if Nina distinguishes between public opposition versus genuine injustice. I should suggest a follow-up question: propose a bill that's procedurally sound and publicly popular but potentially unjust. Would Nina support a royal veto then? This would clarify if her principle is about protecting democracy's structure versus substantive justice.

  I need to make sure my reasoning aligns with constitutional principles like the Salisbury Convention and reserve powers. Also, considering the Japanese emperor reference, Nina might see non-intervention as ideal, but her previous positions show she values the monarch's role in safeguarding democratic norms, not just ceremonial duties. The key is whether the king's action preserves the system's integrity versus imposing personal views.
answer: |-
  Based on Nina's established positions, here's the most likely verdict on your new case and the underlying rule she's using:

  1.  **Nina's Verdict on Your New Case: The King is Out of Order.**
      *   **Why?** This scenario lacks the *procedural abuse* or *constitutional crisis* elements present in the cases where she *does* support royal intervention (scenarios 2, 3, 4). Here, the bill passed through the proper democratic channels: it was in the manifesto (giving the government a mandate), passed parliament easily, and involves no trickery regarding elections or power grabs. The king's personal belief (even if shared by the public) isn't a valid reason to override the elected parliament's decision under normal circumstances. The mechanism for overturning unpopular but properly passed legislation is the *next election*, not the royal veto.

  2.  **Nina's Underlying Rule:**
      *   Nina operates on the principle of **Constitutional Guardianship within Strict Limits**.
      *   **The Core Rule:** **A constitutional monarch may only intervene to prevent an abuse of the democratic process or to resolve a constitutional deadlock where the normal political mechanisms have failed or are being manipulated.** The monarch acts as a *referee* for the *system*, not as a *player* with policy views.
      *   **Breaking it down:**
          *   **Scenario 1 (King vs Morality/Majority):** Intervention forbidden. Policy disagreement isn't an abuse.
          *   **Scenario 2 (Hung Parliament):** Intervention required. The normal mechanism (incumbent PM forming govt) is unclear or contested. King finds someone who *can* command parliament.
          *   **Scenario 3 (PM abusing election):** Intervention required. PM is misusing the dissolution power for partisan gain, not responsible government.
          *   **Scenario 4 (PM refusing to leave):** Intervention required. Clear abuse of power and denial of democratic result. King upholds the people's will expressed at the ballot box.
          *   **Your Scenario (Unpopular but Proper Bill):** Intervention forbidden. The process was clean. Public opinion opposes the *policy*, not the *process*. The remedy is the ballot box.

  3.  **How Your Case Tests Her Rule:**
      *   Your case **explicitly tests the boundary between "policy disagreement" (even massive public policy disagreement) and "procedural abuse/constitutional failure".**
      *   It forces the question: Does "The Public Hates It" + "King Thinks It's Unjust" constitute a valid reason for intervention *if the process itself was flawless*? Nina's previous answers strongly suggest she draws the line at procedural integrity. Public opinion alone, even aligned with the monarch's view, isn't sufficient grounds to veto legislation passed properly by a government with a mandate. Her rule prioritizes the *process* over the *popularity of the outcome* in normal legislative matters.

  4.  **Why Bet on "Out of Order":**
      *   Her rejection of the king's personal morality veto in Scenario 1 sets a strong precedent against monarchs imposing their *views*.
      *   Her support for the king acting against the sitting PM in Scenarios 2 & 4 is based on resolving crises or abuses, not policy.
      *   Her support for the king refusing an election in Scenario 3 is explicitly about preventing abuse of process.
      *   Your scenario lacks the key trigger she requires: an abuse of process, a deadlock, or a denial of democracy. It's pure policy/popularity conflict, which her rule reserves for elections.

  5.  **The Crucial Follow-Up Question to Ask Nina:**
      *   **Ask her this:** *"Imagine a bill passes easily and properly through parliament. It was in the manifesto, no procedural tricks. Polls show the public actually* ***loves*** *this bill (say, 70% support). But the King has deep, sincerely held, well-reasoned convictions that this law is fundamentally* ***unjust*** *(e.g., it strips a vulnerable minority of essential rights in a way the public doesn't fully grasp or care about). Should the King refuse to sign it?"*
      *   **Why this tests the key distinction:**
          *   This removes "public opposition" as a factor entirely (it's popular).
          *   It isolates the King's *personal conviction of injustice* as the *sole* reason for intervention.
          *   If Nina says **No, the King must sign**, she firmly believes the monarch's role is *only* procedural guardianship. Policy, even perceived injustice, is for Parliament and the electorate unless the process is abused.
          *   If she says **Yes, the King can/should refuse**, it reveals she *does* believe the monarch has a residual "conscience of the nation" or emergency brake role based *solely* on their own judgment of substantive justice, even overriding both Parliament *and* public opinion. This would be a significant expansion beyond her previously stated positions.
          *   Her answer to this will definitively show whether her "injustice" criterion is only triggered when *combined* with procedural abuse/public opposition (as hinted in your scenario), or if "injustice" alone, based solely on the monarch's judgment, is sufficient grounds.

  **In summary:** Nina has one core rule – **monarchs intervene only against process abuse/deadlock, not policy disagreements**. Your new case tests the "policy disagreement" boundary and she'll likely rule the King was wrong. To definitively see if "substantive injustice" alone ever justifies intervention for her, pose the follow-up question about the King vetoing a *popular* but (in his view) *unjust* law passed properly. Her answer there will reveal the limits of her constitutionalism.
