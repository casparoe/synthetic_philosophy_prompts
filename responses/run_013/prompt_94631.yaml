prompt: |-
  Ok, I need a sanaty check on something before I write it up, because I keep going back and forth and I've stopped trusting my own ear on it. I'm trying to state my position on the precautionary principle for a workshop paper, and here's what I actually think when I'm not trying to make it sound tidy:

  1. Strong precaution. Where the evidence points to a credible prospect of serious or irreversible harm, the fact that we can't nail it down scientifically yet is not a reason to hold off on measures that would be cheap and effective.
  2. Precaution is not a decision rule. It's a burden-shifting device: it tells you who has to make the running — the proponent of the risky activity — not what the verdict should be.
  3. Precaution has to be symmetric. Regulating is an action with its own consequences, and those get counted like any other consequences. If the ban kills people too, the ban answers for that.
  4. But there's still a legitimate asymmetry between incumbents and newcomers. Stuff already in use gets grandfathered; novel practices have to earn their place. Without something like that you get paralysis, because for any new thing there's a story about how it might go wrong.
  5. Formally I think the right home for all this is maximin over models: take the set of models that survive the evidence, and pick the act whose worst outcome across that set is least bad.
  6. Substantively, though, I'm a boring expected-utility person. Knightian uncertainty is a myth — "no probabilities" just means second-order uncertainty — and rational choice is expected utility maximization under some distribution, full stop.

  And a concrete case to keep me honest: given a new chemical where I have a plausible mechanism plus one small field study, I'd regulate. Given an old chemical and exactly the same evidence, I wouldn't. That feels obviously right to me, and I'd like to know whether it should.

  So: which of these actually fight each other, which pairs only look like they fight, and what's the cheapest way to get a coherent package out of it? Rank the real tensions by how bad they are, say what specifically has to give in each case, and then tell me which single revision would clean up the most. I don't want a survey of the literature, I want to know where my own set is load-bearing and where it's just decoration. Last line, in the form "Verdict: ..." — name the one commitment I should drop or amend.
reasoning: |-
  Okay, the user is asking for a sanity check on their position about the precautionary principle. They've listed six points and a concrete case, and they want to know which parts conflict, how to resolve tensions, and what single change would make everything coherent. 

  First, I need to unpack each of their points. Point 1 supports strong precaution when there's credible harm and cheap measures. Point 2 says precaution shifts the burden to the proponent but isn't a decision rule. Point 3 emphasizes symmetry—counting the consequences of regulation itself. Point 4 allows asymmetry between existing and new things, like grandfathering. Point 5 prefers maximin over models, while point 6 insists on expected utility with probabilities. 

  The concrete case shows their instinct: regulate a new chemical with weak evidence but not an old one with the same evidence. That seems central to their thinking. 

  Now, spotting tensions. The biggest clash is between point 5 (maximin) and point 6 (expected utility). Maximin avoids worst-case scenarios without probabilities, but point 6 dismisses Knightian uncertainty, saying "no probabilities" just means second-order uncertainty. That's a direct conflict—one rejects probabilistic thinking in some cases, the other says it's always there. 

  Point 4’s asymmetry also clashes with point 3’s symmetry. Point 3 says all consequences count equally, including regulatory harms. But point 4 treats new and old things differently, which isn't symmetric. The user argues it prevents paralysis, but it still creates tension. 

  Point 1 and point 2 might conflict subtly. Point 1 pushes for action with weak evidence if measures are cheap, but point 2 says precaution isn’t a decision rule—it just shifts the burden. If burden-shifting leads to blocking action without strong proof, that could align, but if it forces action, it might contradict point 2. 

  In the concrete case, the old/new distinction contradicts point 3’s symmetry. Regulating the new chemical but not the old one with identical evidence isn't symmetric—it favors incumbents. But the user feels it's "obviously right," so they’re prioritizing pragmatism over strict symmetry. 

  For coherence, the cheapest fix is to drop or amend point 5. Maximin is redundant if they embrace point 6’s expected utility with second-order uncertainty. They can handle uncertainty by considering model uncertainty within expected utility, using min-regret or robustness as tiebreakers. That keeps their core ideas intact and resolves the biggest conflict. 

  Other tensions can be managed: point 4’s asymmetry is practical, so clarify it as a heuristic for decision costs, not a moral asymmetry. Point 1 and 2 can coexist if burden-shifting enables precautionary action without dictating outcomes. 

  Verdict: dropping maximin (point 5) cleans up the most. It aligns with their expected utility stance and simplifies the framework. The user’s concrete case stays valid, and their position becomes more internally consistent.
answer: |-
  Here's a sanity check dissecting your position, identifying tensions, ranking conflicts, and offering the cleanest resolution:

  **Core Tensions (Ranked by Severity):**

  1.  **Point 5 (Maximin) vs. Point 6 (Expected Utility):** This is the **fundamental conflict**.
      *   **Nature:** Irreconcilable philosophical difference. Maximin *explicitly rejects* expected utility calculation under deep uncertainty (where probabilities are deemed non-existent or unusable). Point 6 states Knightian uncertainty is a myth ("no probabilities" just means second-order uncertainty) and demands expected utility maximization *always*.
      *   **Why it's Bad:** You cannot simultaneously advocate choosing the act with the best worst-case outcome (maximin) *and* insist rational choice *must* be expected utility maximization under *some* distribution. Maximin *is* a decision rule for non-probabilistic uncertainty. Point 6 declares such rules illegitimate.
      *   **What Has to Give:** You must abandon one. Point 6 directly invalidates the theoretical foundation of Point 5.

  2.  **Point 3 (Symmetry) vs. Point 4 (Incumbent/Newcomer Asymmetry):**
      *   **Nature:** Practical tension within the application of precaution. Point 3 demands strict accounting of regulatory consequences ("If the ban kills people too, the ban answers for that"). Point 4 creates a *procedural* asymmetry favoring incumbents, inherently making it harder to regulate them even if evidence of harm emerges.
      *   **Why it's Bad:** Grandfathering *ignores* the potential "consequences of inaction" (harm from the existing chemical) implied by Point 3. It introduces a status-quo bias inconsistent with strict consequence-counting symmetry. It violates the spirit of Point 3 by giving incumbents a free pass *on the basis of history alone*, not on a symmetric assessment of consequences.
      *   **What Has to Give:** Point 4 needs significant qualification. It must be framed as a pragmatic heuristic *based on decision costs, burden of proof allocation (linking to Point 2), and avoiding paralysis*, **not** as a fundamental principle of justice or consequence-counting. Acknowledge this creates *procedural* asymmetry despite *substantive* symmetry (all harms count).

  3.  **Point 1 (Strong Precaution) vs. Point 2 (Burden-Shifting, Not Decision Rule):**
      *   **Nature:** Potential tension in interpretation/practice. Point 1 advocates specific action ("not a reason to hold off") under specific conditions (credible serious harm, cheap/effective measures). Point 2 says PP tells you *who* must provide evidence (proponent of risk), not *what* the outcome should be.
      *   **Why it's Manageable:** This tension is more apparent than real *if* you interpret Point 2 rigorously. Burden-shifting *facilitates* the action in Point 1. By placing the burden on the proponent to demonstrate safety/acceptable risk *in the face of credible harm*, failure to meet that burden *logically leads* to blocking the activity or imposing the cheap/effective measure. Point 1 describes the *outcome* of applying the burden-shifting rule in specific, favorable circumstances. The tension arises if Point 2 is interpreted as purely procedural with *no* implication for outcome, which is unrealistic – burden-shifting rules are designed to *produce* specific types of outcomes (caution) under uncertainty.
      *   **What Has to Give:** Minor clarification. Emphasize that Point 2 *enables* Point 1. The "decision rule" emerges *from* the burden-shifting combined with evidentiary thresholds and cost-effectiveness, not as an independent mandate.

  **Coexisting Pairs (Look Like They Fight, But Don't):**

  *   **Point 1 & Point 6:** Expected utility can justify strong precaution if the credible prospect of serious harm, even with low probability (or ambiguous probability), combined with cheap/effective mitigation, makes the expected cost of action negative. Point 1 describes a scenario perfectly compatible with EU under deep uncertainty (using a sufficiently fat-tailed/pessimistic prior).
  *   **Point 3 & Point 6:** Expected utility mandates counting *all* consequences, including those of regulation. Symmetry is baked into a proper EU calculation.
  *   **Point 4 & Point 6:** Expected utility can incorporate differential decision costs, transition costs, and prior evidence implicitly accumulated via existing use. Grandfathering can be rationalized under EU as reducing decision/transition costs or reflecting stronger implicit priors of safety for long-used substances (though this last point is debatable).

  **The Concrete Case:**

  *   Your intuition (regulate new, don't regulate old with identical *current* evidence) **directly conflicts with Point 3 (Symmetry)**. The consequences of harm from the chemical are identical. Point 4 provides the *justification* for the asymmetry, but it *is* an asymmetry in treatment based purely on history.
  *   **Point 6 (EU) can support it**: The expected cost of *regulating* the old chemical includes high transition costs, disruption, and potential loss of known benefits that aren't present for the new one. The old chemical also has a long history of use providing *some* weak evidence of relative safety ("absence of detected catastrophe") which, under EU, might slightly shift the prior compared to the novel chemical. The *evidence base* isn't truly identical when history is considered relevant data (even if low quality).

  **The Cheapest Path to Coherence:**

  1.  **Resolve the Fundamental Conflict:** **Drop Point 5 (Maximin)**. It is philosophically incompatible with your bedrock commitment in Point 6. You don't need it.
  2.  **Reframe Point 4:** Explicitly state the incumbent/newcomer asymmetry is a pragmatic rule-of-thumb to manage decision costs, transition burdens, and avoid paralysis under deep uncertainty, **not** a fundamental principle overriding consequence symmetry (Point 3). It's an implementation of burden-shifting (Point 2) considering real-world constraints.
  3.  **Clarify Point 1 & 2:** Position Point 1 as the *typical outcome* of applying the burden-shifting principle (Point 2) in scenarios involving credible serious harm and cheap/effective mitigation measures. The decision *emerges* from the procedure under those conditions.
  4.  **Leverage Point 6:** Use your expected utility framework (incorporating model uncertainty / second-order probabilities) to handle *all* the considerations:
      *   **Point 1:** Model the credible harm scenario(s), assign (possibly ambiguous) probabilities, calculate expected costs/benefits including the cost of action.
      *   **Point 2:** The burden-shifting is a procedural rule *for gathering information* to reduce uncertainty and refine the EU calculation. The proponent must provide evidence to shift the EU calculation in favor of their activity.
      *   **Point 3:** All consequences, including regulatory ones (costs, job losses, substitution risks), are included in the EU calculation. Strict symmetry is maintained.
      *   **Point 4:** The differential costs of regulating new vs. old (transition costs, disruption, potential loss of existing benefits, implicit prior from history) are explicitly modeled as part of the EU calculation for *each* decision. This *explains* the grandfathering effect without needing a separate principle.
      *   **Concrete Case:** The EU calculation for the new chemical weighs plausible harm vs. low cost of preventing introduction. For the old chemical, it weighs the *same* plausible harm vs. the *high* cost of removal/disruption *plus* the weak prior from historical use, leading to a different outcome.

  **Verdict: Drop Point 5 (Maximin over models).** It's fundamentally incompatible with your core commitment to expected utility (Point 6). Embracing EU fully provides a powerful, coherent framework to incorporate all your other valuable insights (burden-shifting, consequence symmetry, pragmatic asymmetry via cost modeling) without internal contradiction. Your concrete case remains justifiable within a sophisticated expected utility model incorporating model uncertainty and differential costs/priors.
