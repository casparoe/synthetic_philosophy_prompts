  ### Strategy-Stealing Argument: Two Games Demonstrating the Pitfall

  Below are two games designed to illustrate the critical role of board symmetry in strategy-stealing arguments. Both are played on the same 3x3 grid with identical move rules, differing only in the winning conditions. Each game is finite, has no draws, and both players have symmetric roles. The goal is to claim a winning pattern of cells. 

  #### **Game 1: Symmetric Winning Conditions**
  - **Rules**:  
    Players take turns claiming unclaimed cells. The first player to claim **all three cells in any row, column, or diagonal** wins.  
    (This is standard Tic-Tac-Toe *with no draw possibility*—see proof below for why no draws occur.)  
  - **Strategy-stealing argument attempt** (by a student):  
    1. Assume the second player has a winning strategy.  
    2. The first player makes an arbitrary first move (say, the center cell).  
    3. The first player then "steals" the second player's strategy:  
       - Pretend the first move was not made and adopt the second player's strategy as the "first player" in a new game.  
       - Respond to the real second player's moves using this strategy.  
    4. If the strategy ever requires claiming a cell already taken by the first player, use an arbitrary move instead.  
    5. This guarantees the first player wins, contradicting the assumption that the second player has a winning strategy.  
    **Conclusion**: First player must have a winning strategy.  
  - **Actual outcome**:  
    - **First player wins**.  
    - **Proof**:  
      - First player claims the center (5).  
      - Second player must respond:  
        - If they claim a corner (e.g., 1), first player claims the opposite corner (9). Second player is forced to block in a row/column/diagonal, but first player creates two winning threats and wins.  
        - If they claim an edge (e.g., 2), first player claims a corner (1). Second player is again forced into a loss.  
      - In all cases, the center gives first player a forced win.  

  #### **Game 2: Asymmetric Winning Conditions**
  - **Rules**:  
    Identical to Game 1, *except* the **diagonals are not winning patterns**. Only **rows and columns** win.  
    (The board *appears* symmetric, but diagonals are explicitly excluded.)  
  - **Strategy-stealing argument attempt** (by a student):  
    1. Assume the second player has a winning strategy.  
    2. First player makes an arbitrary first move (e.g., center cell).  
    3. First player "steals" the second player's strategy, responding to moves as above.  
    4. **Breakdown**: When the strategy requires claiming a cell already taken (e.g., the center), the first player makes an arbitrary move.  
       - *Issue*: The center is now a "liability" because it is useless for winning (diagonals are invalid), but the first player is forced to "waste" a move on it.  
       - *Result*: The stolen strategy fails because the first player’s extra move (the center) does not contribute to a winning pattern, while the second player’s moves are optimized for rows/columns.  
    **Conclusion**: Argument collapses—no contradiction arises.  
  - **Actual outcome**:  
    - **Second player wins**.  
    - **Proof**:  
      - Label cells as follows:  
        ```  
        1 2 3  
        4 5 6  
        7 8 9  
        ```  
      - Second player uses a pairing strategy: Divide the board into four pairs and the center:  
        - Pair 1: (1,9)  
        - Pair 2: (2,8)  
        - Pair 3: (3,7)  
        - Pair 4: (4,6)  
        - Center: (5)  
      - Strategy: Wherever the first player moves, claim the paired cell.  
        - If first player claims center (5), second player claims any cell (e.g., 1). Subsequent moves follow the pairing.  
        - If first player claims a non-center (e.g., 1), second player claims its pair (9).  
      - **Why it works**:  
        - Winning requires a full row or column (3 cells).  
        - Each row/column contains cells from 2–3 pairs:  
          - Row 1: Cells 1,2,3 → Pairs 1,2,3.  
          - Column 1: Cells 1,4,7 → Pairs 1,4,3.  
        - To win, the first player must claim all cells in a row/column, but each cell in that row/column is part of a unique pair. The second player always claims the paired cell, blocking completion.  
        - The center (5) is isolated—it cannot be part of any row/column win without two adjacent cells, which are blocked by pairing.  
      - After all cells are claimed, second player blocks all rows/columns, and no diagonal wins exist. First player cannot win, so second player wins by default (no moves left).  

  ---

  ### Key Insights
  1. **Feature breaking the argument**:  
     - **Game 1** has **rotational/reflective symmetry**: Diagonals, rows, and columns are all winning patterns. The board looks identical from all orientations.  
     - **Game 2** breaks this: Removing diagonals creates **asymmetric winning conditions**. Rows and columns lack diagonal symmetry, making the board "directionally biased".  

  2. **Effect of adding symmetry back**:  
     - If diagonals are re-added to Game 2, it becomes Game 1. The strategy-stealing argument works, and first player wins (as shown).  

  3. **Saving the argument**:  
     - Proponents of strategy-stealing would **exclude Game 2** by requiring that the board and winning conditions are **invariant under 90° rotations and reflections**.  
     - Argument: "The game must be symmetric under all permutations of the board that preserve adjacency." Game 2 fails this—rotating the board changes which patterns are winning (diagonals become rows/columns under 45° rotation).  

  ### Why This Matters
  - Strategy-stealing relies on **perfect symmetry** to ensure the "stolen" strategy works.  
  - Game 2 shows that even small asymmetries (here, diagonal exclusion) collapse the argument, allowing second-player wins.  
  - This highlights why Hex works (it preserves symmetry) and warns against hidden asymmetries in combinatorial games.  

  Play both games with pen and paper—each ends in ≤9 moves, demonstrating the concept in minutes!
