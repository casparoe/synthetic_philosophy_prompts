answer: |-
  **Constitutional Court of Vardania**  
  **Case No. CC-17-003**  
  **Iosif B. v. M. (Defamation)**

  **LEAD OPINION (Justice Kovač)**

  1.  This appeal arises from a civil judgment awarding damages for defamation to the plaintiff, Iosif B., against the defendant, Mrs. M. The facts are undisputed. For a period exceeding three years, Mrs. M. regularly positioned herself near the plaintiff’s stall at the Central Municipal Vegetable Market and publicly declared him to be a "murderer." This accusation stems from the plaintiff’s action in 1981, wherein he submitted a written denunciation to the Directorate’s District Office concerning Mrs. M.’s husband, alleging the husband listened to foreign radio broadcasts.

  2.  Based upon this denunciation, the husband was arrested, tried, convicted, and sentenced under Decree 7 of 1971 (“Decree 7”). The Decree, enacted by the Directorate’s Supreme Command, criminalized “possession of, dissemination of, or listening to foreign propaganda with intent to undermine state authority.” The sentence imposed was indefinite detention with compulsory labor. The husband died while incarcerated in 1987. Mrs. M. concedes her public statements but asserts they are true – that Iosif B.’s denunciation directly caused her husband’s unlawful killing, thus making him a murderer.

  3.  The sole legal question before this Court is whether the statement “Iosif B. is a murderer” is substantially true. This turns entirely on whether the conviction and sentence imposed under Decree 7 constituted lawful state action at the time they occurred. If they were lawful, the husband’s death was a legal consequence, not murder. If they were unlawful, the statement may be defensible as truth.

  4.  The Directorate governed Vardania from 1968 until the adoption of our current Constitution in 2014. Article 17 of the Directorate’s Fundamental Law of 1970 vested supreme legislative authority in the Supreme Command. Decree 7 was promulgated by the Supreme Command pursuant to that authority, published in the Official Gazette, and remained in force until the Directorate’s dissolution.

  5.  The defendant argues that Decree 7 was so fundamentally unjust that it could not constitute valid law, rendering all actions taken under it unlawful. We acknowledge the profound suffering inflicted under the prior regime. Nevertheless, the validity of a legal rule is determined by the criteria of validity recognized within the legal system from which it emanates, not by its moral content. The question is not whether the rule *should* have been law, but whether it *was* law according to the system's own rules at the time.

  6.  The Directorate possessed *de facto* control and maintained a system of rules administered by recognized institutions – legislatures of a sort, courts, prosecutors, prisons. Decree 7 was created by the entity vested with ultimate legislative power under the then-operative Fundamental Law. It was promulgated according to the regime’s established procedures. It was applied by courts established under that regime, following whatever procedural rules existed. Individuals were appointed to administer these laws.

  7.  A legal system exists where there is a union of primary rules (imposing duties) and secondary rules (rules of recognition, change, and adjudication). The Directorate possessed such a union. Its Fundamental Law provided a rule of recognition: Acts of the Supreme Command were supreme law. Decree 7 met this criterion. Its validity is therefore a matter of historical fact within that system.

  8.  To hold that Decree 7 was not law would require this Court to engage in an unprecedented retroactive invalidation. We would be declaring that actions performed decades ago, under color of authority explicitly granted by the then-operative constitution and laws, were devoid of legal effect *ab initio*. This retroactive negation of legal validity would destabilize countless past transactions and statuses recognized under the prior system and create profound injustice. Our current constitutional prohibition on *ex post facto* laws (Art. IX) reflects a deep-seated principle against retroactive penalization; retroactively stripping legal validity from state acts essential to the prior system’s function would violate this same spirit on a systemic scale. The law cannot operate this way.

  9.  Consequently, the conviction and sentencing of Mrs. M.’s husband under Decree 7 were lawful acts of state at the time they occurred. His death, while tragic, was a lawful consequence of that sentence. The denunciation submitted by Iosif B. was an act explicitly solicited and sanctioned by the laws of the Directorate. While morally repugnant to our present values, it was not unlawful.

  10. The statement "Iosif B. is a murderer" is therefore false. Murder requires unlawful killing. The death of Mrs. M.’s husband, however caused within the camp, was the lawful execution of a valid sentence. The plaintiff is entitled to the judgment awarded below. The decision of the Appellate Division is affirmed.

  **CONCURRING OPINION (Justice Petrović)**

  1.  I concur in the judgment affirming damages for defamation. Justice Kovač’s analysis of the validity of Decree 7 under the Directorate’s own rules is, as a matter of descriptive legal positivism, unassailable. The decree existed as a rule within the Directorate’s system, applied by its officials. Retroactive invalidation *is* a jurisprudential impossibility fraught with peril.

  2.  However, I arrive at this conclusion with profound disquiet. To call Decree 7 "law" feels like a desecration of the word. A rule that condemns a man to death for listening to a radio broadcast, enacted by an unelected junta, applied in secret or sham proceedings, and resulting in extermination through forced labor – such a rule violates the very essence of law, which must embody at least a minimal aspiration towards justice and human dignity (principles now enshrined in Article I of our Constitution). It was not merely unjust; it was barbarism masquerading as law.

  3.  Yet, acknowledging this moral nullity does not resolve the present case. Mrs. M. seeks a defense of truth based on *current* legal understanding. Even if we were to declare, morally, that Decree 7 was utterly illegitimate and void *ab initio*, and that her husband was murdered, this Court possesses no warrant to retroactively impose *that* legal conclusion upon past events governed by a different, however odious, system. To do so would be to engage in precisely the retroactive penalization we rightly condemn. Our new constitutional order begins now; it cannot rewrite the legal character of every past state act without collapsing into chaos or hypocrisy.

  4.  Therefore, while I believe Mrs. M. spoke a deeper truth – that her husband was unjustly killed and Iosif B. played a culpable role – the *legal* truth required for her defense does not exist. The law, tragically and revealingly, sometimes compels us to call evil "valid" and suffering "lawful." I concur with the result, but find no comfort in the logic that demands it. The weight of this judgment rests heavily upon the conscience of the law.

  **DISSENTING OPINION (Justice Ilić)**

  1.  I dissent. The majority and concurrence err fundamentally in accepting that the Directorate maintained a system recognizable as "law." Decree 7 was not merely unjust; it failed the basic tests of legality itself. Consequently, the acts performed under its purported authority were criminal, and Mrs. M.’s statement was true.

  2.  Law is not merely the command of the sovereign. It presupposes a reciprocity of obligation between ruler and ruled, manifested through adherence to principles that make law possible as a guiding force for human conduct. Lon Fuller termed these the "inner morality of law": generality, promulgation, non-retroactivity, clarity, non-contradiction, possibility of compliance, constancy, and congruence between rules and official action.

  3.  Decree 7, and the system enforcing it, failed catastrophically on these principles. While published, its terms ("undermine state authority") were impossibly vague – who could know what listening might be deemed subversive? Its application was notoriously retroactive, punishing acts committed before its existence or before the interpretation that condemned them. Compliance was often impossible; mere possession of a radio could suffice. Most damningly, the Directorate flagrantly violated its *own* purported rules. Trials were secret or perfunctory, devoid of genuine adjudication. Sentences were arbitrarily extended. The conditions in labor camps, designed for extermination through toil, violated even the Directorate’s nominal penal codes. Officials acted not as impartial appliers of rules, but as agents of terror.

  4.  A system so devoid of the inner morality of law cannot produce valid legal rules. Decree 7 was not law; it was an instrument of state terror. The "trial" was a sham. The detention was kidnapping. The death in the camp was murder. Iosif B.’s denunciation, solicited by this apparatus of terror, was a culpable act contributing to an unlawful killing. Mrs. M. spoke the truth.

  5.  The majority fears retroactivity. But recognizing the *ongoing* legal truth – that these past acts were *always* criminal under the fundamental principles of legality violated by the regime itself – is not retroactive penalization. It is a declaration of what always *was*. The true retroactivity lies in the majority’s anointing of terror with the legitimacy of "law" *now*.

  6.  I acknowledge the unsettling implication: if the Directorate had no law, then the new state’s legitimacy rests not on legal continuity, but on revolution and popular will. This is indeed our foundation. Our Constitution’s Article I, affirming human dignity, repudiates the Directorate’s legacy. We must have the courage to call its atrocities what they were: crimes. Denying Mrs. M. her truth perpetuates the Directorate’s lie. I would reverse.
