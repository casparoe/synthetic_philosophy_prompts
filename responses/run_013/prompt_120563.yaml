answer: |-
  Here’s a complete exam package focused on applied Sorites paradox analysis, designed to force commitment and address higher-order vagueness.

  **Exam Question (20 marks, 90 minutes):**  
  > **Software Development Case Study:**  
  > A facial recognition system labels images as "Match" or "No Match" based on a similarity score (0–100). The engineering team sets a threshold: scores ≥75 are "Match". During testing, they find two scenarios:  
  > **(A)** An image sequence morphing Person A into Person B (e.g., 0% = A, 100% = B). Each step increases similarity to B by 1%, yet no *single step* makes the image clearly stop resembling A.  
  > **(B)** Two distinct candidates, X (Score: 74) and Y (Score: 75). X is rejected; Y is hired, drastically altering their lives.  
  >  
  > **Task:**  
  > 1. Explain how *both* scenarios instantiate the Sorites paradox.  
  > 2. Argue whether vagueness here arises from **language** ("Match"/threshold terms), the **world** (inherently fuzzy identities/fitness), or **epistemic limits** (unknowable thresholds).  
  > 3. Confront higher-order vagueness: If there’s "no sharp cutoff" between Match/No Match, can there be a sharp cutoff between *vague cases* and *non-vague cases*?  
  > 4. Can we accept the Sorites conclusion (that *no change* ever produces a "different person" or *no single point* is truly decisive) without abandoning logic? Justify.  

  ---

  **Model Answer (Approx. 700 words):**  

  **1. Sorites Instantiation**  
  Scenario (A) is a classic Sorites setup: A 100-image morph sequence begins with Person A (Score 0) and ends with Person B (Score 100). The paradox arises from two premises: (i) At 0% morph, the image is clearly "Match" for A. (ii) No 1% increment *seems* to make it "not A" (tolerance principle). Yet after 100 steps, it’s clearly *not* A—contradicting the conclusion that it must still be A. Scenario (B) applies the same logic to hiring: If 75 is "good fit," why isn’t 74? A one-point difference appears irrelevant (tolerance), yet it changes outcomes categorically. Both cases exploit boundarylessness in gradual change.  

  **2. Vagueness: Linguistic, Ontological, or Epistemic?**  
  I argue vagueness is **linguistic and contextual**, not ontological or purely epistemic.  

  The world *does* contain continuous transitions (e.g., morphing pixels), but the *vagueness problem* arises from how we impose discrete categories ("Match"/"No Match") onto this continuum. The threshold (75) is a contextual linguistic convention—useful for engineers but not reflecting a metaphysical joint. Epistemicism (vagueness as ignorance of sharp cutoffs) fails here: There’s no fact that 75 is *objectively* correct while 74 is not; the score itself is a construct based on contested weights (e.g., eye shape vs. skin tone). If vagueness were ontological, the morph sequence would have a "fuzzy" region where the image *partly* is A—but the system forces a binary output, exposing language’s inadequacy.  

  **3. Higher-Order Vagueness Problem**  
  Higher-order vagueness asks: "If there’s no sharp line between Match/No Match, is there a sharp line between *clear Matches* and *borderline cases*?" All major theories struggle here.  

  Suppose we say scores 90–100 are *definitely* Match, 0–60 *definitely not*, and 61–89 borderline. This merely relocates the problem: Why is 90 definite but 89 borderline? No non-arbitrary point divides "definite" from "borderline." Supervaluationism (which asserts "x is Match" is true only if true in *all* precisifications) avoids first-order sharp cutoffs but implies sharp cutoffs in *admissibility* of precisifications. If we reject sharp boundaries entirely, we face regress: What separates "vague" from "higher-order vague"?  

  **4. Can We Accept the Sorites Without Abandoning Logic?**  
  Accepting the Sorites conclusion ("No single step matters, so all images are A") *does* destroy classical logic—it validates paradoxical reasoning. However, we can **reject classical bivalence** without abandoning logic *entirely*.  

  Epistemicism preserves classical logic by insisting a sharp cutoff *exists* (e.g., at 63%) but is unknowable. This is implausible here: The engineering team *chose* 75 arbitrarily; no hidden fact makes it "correct." Contextualism offers a better path: The threshold can shift pragmatically (e.g., stricter for security access). In this view, "Match" isn’t vague because its extension depends on context, not because logic fails. For hiring (Scenario B), we might accept that small differences *can* matter when resources are limited—not due to soritical collapse, but because thresholds are practical tools. Rejecting bivalence (e.g., via fuzzy logic) is viable but costly: It replaces sharp boundaries with arbitrary degrees of truth.  

  **Conclusion**  
  The Sorites in these cases reveals linguistic vagueness amplified by engineered systems. Higher-order vagueness confirms that no "meta-threshold" solves the problem. While accepting the paradox invalidates classical logic, adopting contextualism or many-valued logics preserves reasoning—but forces us to acknowledge that boundaries are human impositions, not discoveries.  

  ---

  **Marking Scheme (20 marks total):**  

  | **Criterion**                                                                 | **Marks** | **Common Mistake**                                  |
  |-------------------------------------------------------------------------------|-----------|-----------------------------------------------------|
  | **1. Correctly identifies Sorites structure** in both scenarios (tolerance principle + paradox) | 4 | Misses tolerance principle; treats as slippery slope |
  | **2. Takes clear stance** on source of vagueness (language/world/knowledge), justified via case | 5 | Stance vague/unrelated to case; lists theories without commitment |
  | **3. Engages higher-order vagueness**: Explains the problem and applies it to chosen stance | 5 | Ignores or superficially mentions higher-order vagueness |
  | **4. Evaluates if accepting Sorites destroys logic**, linking to stance      | 4 | Assumes logic "must" hold or conflates logic with bivalence |
  | **5. Attempts resolution**: Proposes how their stance addresses (or fails against) higher-order vagueness | 2 | Treats first-order solution as sufficient; dismisses regress |

  ---

  **Differentiating A from B Answers:**  
  - **A Grade (18–20):** **Explicitly dissects higher-order vagueness regress** (e.g., "If borderline cases have fuzzy boundaries, what defines *those* boundaries?"). **Uses the engineering context** to challenge theories (e.g., "Epistemicism fails because the threshold is arbitrary, not unknown"). **Commits to abandoning or modifying classical logic** with nuance (e.g., "Contextualism saves logic by making boundaries dynamic, not sharp").  
  - **B Grade (15–17):** Recognizes higher-order vagueness but doesn’t trace its implications fully. Compares theories but doesn’t leverage the case study deeply. Defends logic preservation simplistically (e.g., "Epistemicism works because cutoffs exist").  

  ---
  This question forces engagement with applied vagueness while testing core metaphysical positions. The marking scheme rewards both technical understanding and willingness to confront the paradox’s hardest implications.
