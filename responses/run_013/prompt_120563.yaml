prompt: |-
  I'm a software engineer with no formal philosphy background, but my partner is a TA for an upper-level metaphysics course and she's been stuck trying to write the final exam. The topic is vagueness and the sorites paradox. I was trying to help her brainstorm and I came up with a case from work: we have a photo tool that morphs a picture of one person into a picture of another person by changing it 1% at a time, so at no single step does it look like it stopped being the same person, but at the end it's obviously someone else. There's also a version from hiring where a candidate gets a 0-100 fit score and the rule is hire if they're a good fit, and moving the cutoff by one point changes someone's life. She wants an exam question that uses a case like that to make students actually do something with the sorites, not just recite the paradox. It should be one essay question for a 90-minute final, 20 marks. The question should force them to take a stand on whether the vagueness is in the world, in language, or in our knowledge, and to deal with the higher-order vagueness problem -- like, if you say there's no sharp line, is there a sharp line between the cases where there's no sharp line and the cases where there is? They should also have to say whether just accepting the sorites is a real option or whether it gives up on logic. I read a bit about the usual camps (epistemicism, supervaluationism, contextualism) and honestly I can't tell which one survives that objection, so the question should make them commit.

  Please write the exam question, a model answer of about 700 words, and a marking scheme. For the marking scheme, give me five must-hit points, the marks each is worth out of 20, and a one-line note on how students typically get each one wrong. Also seperate an A from a B by naming the specific moves each must contain. No citations or reading lists -- the students can't search anyway, and I wouldn't know where to start.
