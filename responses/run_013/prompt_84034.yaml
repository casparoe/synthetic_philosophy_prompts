  ### Bankroll Sizing Procedure  
  **Objective:** Maximize the expected log of the bankroll, adjusted for one-off bets and ruin risk. This choice is a *decision* (not a fact) because it optimizes long-term growth while explicitly guarding against ruin.  

  **Inputs Required for Each Bet:**  
  - Current bankroll (as fraction of starting bankroll): `b`  
  - Ruin level (fraction of starting bankroll): `ruin_level` (e.g., 0.1)  
  - Our estimated probability: `p_est`  
  - Market-implied probability: `m`  
  - Uncertainty (standard error) of `p_est`: `se` (if unavailable, use defaults below)  
  - Correlation group ID and current group exposure: `s_group` (fraction of bankroll)  
  - Group max exposure: `group_max` (desk-set, default 0.1)  

  **Steps:**  
  1. **Edge and Ruin Check**  
     - *Question:* Is there a nominal edge, and is bankroll above ruin level?  
     - *Sufficiency:* `p_est > m` and `b > ruin_level`  
     - *Stop if false:* Stake = 0.  
     - *Justification:* No edge or already too close to ruin.  

  2. **Uncertainty Adjustment**  
     - *Question:* After penalizing for estimation error, is edge still positive?  
     - *Default `se` if missing:* 0.02 for liquid markets (≥100 similar events), else 0.05.  
     - *Compute:* `p_adj = max(m, min(1, p_est - se))`  
     - *Sufficiency:* `p_adj > m`  
     - *Stop if false:* Stake = 0.  
     - *Justification:* Adjusted edge ≤ 0.  
     - *Note:* Market taking the other side is *not* additional evidence; it’s already in `m`.  

  3. **Base Kelly Stake**  
     - *Compute:* `s_kelly = (p_adj - m) / (1 - m)`  
     - *Justification:* Fraction that maximizes growth for a binary bet with known edge.  

  4. **Ruin Cliff Scaling**  
     - *Compute:* `f = (b - ruin_level) / (1 - ruin_level)`  
     - *Compute:* `s_scaled = s_kelly * f`  
     - *Justification:* Linearly reduce stake as bankroll approaches ruin.  

  5. **Correlation Group Cap**  
     - *Question:* Does the group have remaining risk capacity?  
     - *Sufficiency:* `s_group < group_max`  
     - *Stop if false:* Stake = 0.  
     - *Else:* `s_final = min(s_scaled, group_max - s_group)`  
     - *Justification:* Group exposure capped at `group_max` (treat correlated bets as a single unit).  

  **Output:** Stake fraction `s_final` of current bankroll.  

  ---

  ### Test Cases  
  **Case 1: Liquid Market (Repeated Bet)**  
  - *Inputs:* `b = 1.0`, `ruin_level = 0.1`, `p_est = 0.55`, `m = 0.50`, `se = 0.02` (liquid), `s_group = 0`, `group_max = 0.1`  
  - Steps:  
    1. Edge: 0.55 > 0.50, b > 0.1 → proceed.  
    2. `p_adj = 0.55 - 0.02 = 0.53` > 0.50 → proceed.  
    3. `s_kelly = (0.53 - 0.50) / (1 - 0.50) = 0.06`  
    4. `f = (1.0 - 0.1) / (1 - 0.1) = 1.0` → `s_scaled = 0.06`  
    5. `s_final = min(0.06, 0.1 - 0) = 0.06`  
  - **Stake: 6%**  
  - *Note:* You may dislike this for being too conservative, but uncertainty adjustment shrinks edge.  

  **Case 2: Near Ruin (One-Off Bet)**  
  - *Inputs:* `b = 0.15`, `ruin_level = 0.1`, `p_est = 0.65`, `m = 0.50`, `se = 0.05` (non-liquid), `s_group = 0`, `group_max = 0.1`  
  - Steps:  
    1. Edge: 0.65 > 0.50, b > 0.1 → proceed.  
    2. `p_adj = 0.65 - 0.05 = 0.60` > 0.50 → proceed.  
    3. `s_kelly = (0.60 - 0.50) / (1 - 0.50) = 0.20`  
    4. `f = (0.15 - 0.1) / (1 - 0.1) ≈ 0.0556` → `s_scaled = 0.20 * 0.0556 ≈ 0.0111`  
    5. `s_final = min(0.0111, 0.1 - 0) ≈ 0.0111`  
  - **Stake: 1.11%**  
  - *Note:* You will *hate* this. Kelly wants 20%, but proximity to ruin forces a tiny stake.  

  **Case 3: Correlated Cluster (6 Dependent Questions)**  
  - *Inputs:* First bet in group: `b = 1.0`, `ruin_level = 0.1`, `p_est = 0.60`, `m = 0.50`, `se = 0.05`, `s_group = 0`, `group_max = 0.1`  
  - Steps:  
    1. Edge: 0.60 > 0.50, b > 0.1 → proceed.  
    2. `p_adj = 0.60 - 0.05 = 0.55` > 0.50 → proceed.  
    3. `s_kelly = (0.55 - 0.50) / (1 - 0.50) = 0.10`  
    4. `f = 1.0` → `s_scaled = 0.10`  
    5. `s_final = min(0.10, 0.1 - 0) = 0.10`  
  - **Stake for first bet: 10%**  
  - *For subsequent bets:* After placing first bet, `s_group = 0.10` (exposure hits `group_max`). Remaining 5 bets get **stake = 0** (Step 5 stops them).  
  - *Note:* To avoid this, aggregate the 6 bets as one composite bet:  
    - `s_kelly_composite = 0.10` (same as single bet).  
    - Split equally: each gets `0.10 / 6 ≈ 1.67%`.  

  ---

  ### Limitations and Warnings  
  **What the Procedure Cannot Do:**  
  - Handle non-binary or multi-outcome events.  
  - Dynamically revalue existing positions after bankroll changes (track `s_group` manually).  
  - Account for inter-group correlation (only within-group).  
  - Replace judgment on inputs (garbage in → garbage out).  

  **Where Analysts Might Overreach:**  
  - **Probability estimation (`p_est`, `se`):** The procedure can’t save poorly calibrated models. If `se` is a wild guess, the stake is pseudo-precise.  
  - **Correlation grouping:** Arbitrarily defining groups may hide risk (e.g., lumping “UK politics” and “EU inflation” together).  

  **Arithmetic in Costume of Principle:**  
  - **Uncertainty adjustment (`se`):** Subtracting 1 standard error is heuristic, not derived from theory.  
  - **Ruin scaling (`f`):** Linear reduction is a rule of thumb, not a probability-aware model.  
  - **Group cap (`group_max`):** Fixed at 0.1 for simplicity; not risk-sensitive.  

  **Handling Partial Information:**  
  - **Only a range for `p_est`?** Use the midpoint and set `se = (high - low)/4` (approximates 95% CI).  
  - **No estimate?** Skip the bet. Do not force a number.  

  **Final Note:** Run time is ≤20 minutes if inputs are ready. Use it as a consistency tool—not a substitute for reasoning.
