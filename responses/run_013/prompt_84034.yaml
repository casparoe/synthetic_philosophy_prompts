  - If we win, the bankroll becomes `b * (1 + s*(1/m - 1))` because we get `s * (1/m - 1)` profit (since we get `s/m` back, including the stake, so profit is `s/m - s = s*(1/m - 1)`).
  - If we lose, the bankroll becomes `b * (1 - s)`.

  Alternatively, we can think in terms of the market's implied probability `m` and our estimated probability `p_est`. The expected log growth per bet is:
     p_est * log(1 + s*(1/m - 1)) + (1-p_est)*log(1 - s)

  The Kelly fraction for a single, independent bet with known edge is:
     s_kelly = p_est - (1-p_est) / ((1/m) - 1)

  But note: (1/m - 1) = (1-m)/m, so:
     s_kelly = p_est - m/(1-m) * (1-p_est)

