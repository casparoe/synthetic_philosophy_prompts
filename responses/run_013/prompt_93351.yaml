answer: |-
  Your observation captures a profound and under-acknowledged pattern in AI discourse—one that straddles philosophy of mind, rhetoric, and interpretability. While no single term perfectly encapsulates this **two-way rhetorical slide**, I'll synthesize related concepts, propose a new term, define its boundaries, and address your queries. This phenomenon is distinct from innocent shorthand; it’s an **epistemic dodge** that exploits ambiguity for argumentative convenience.

  ---

  ### **Nearest Existing Concepts & Why They Fall Short**
  1. **Ontological Gerrymandering** (from sociology of science):  
     - Selectively redrawing boundaries between "literal" and "metaphorical" to suit one’s argument.  
     - *Shortfall*: Focuses on social constructs, not mental-state attributions; doesn’t capture the *bidirectional* slide between pro/anti-mentalism.

  2. **Motivated Reasoning** (cognitive psychology):  
     - Unconsciously favoring evidence that supports a desired conclusion.  
     - *Shortfall*: Explains *why* people slide but doesn’t name the *mechanism* of toggling between literal/metaphorical readings.

  3. **Reification** (vs. **Instrumentalism**)**:  
     - *Reification*: Treating abstractions (e.g., "the model knows") as concrete entities.  
     - *Instrumentalism*: Treating claims as useful fictions (e.g., "just shorthand").  
     - *Shortfall*: Your colleagues are doing **both**, depending on context. No term describes this *opportunistic oscillation*.

  4. **Doublethink** (Orwell):  
     - Holding contradictory beliefs simultaneously.  
     - *Shortfall*: Emphasizes belief over rhetoric; implies delusion rather than strategic ambiguity.

  5. **Charity/Strawman Dynamics**:  
     - Applying maximal "interpretive charity" to one's own claims while demanding anti-mentalists defend a strawman (e.g., "it’s just statistics!").  
     - *Shortfall*: Asymmetric; doesn’t cover bidirectional slides.

  ---

  ### **Proposed Term: Explanatory Opportunism**  
  **Definition**: The practice of opportunistically toggling between literal and metaphorical interpretations of an attributed state (e.g., belief, knowledge, desire) to serve argumentative needs—invoking the literal reading when it provides explanatory power, and retreating to metaphor when pressed on ontological commitments or inconsistencies.  

  #### **Key Features**  
  1. **Bidirectional**:  
     - **Pro-mentalist slide**: "The model *knows* X (literal, to explain robustness) → but it’s *just shorthand* (metaphorical, to avoid scrutiny)."  
     - **Anti-mentalist slide**: "Models *only predict tokens* (literal) → but they *learn to please users* (metaphorical, to explain behavior)."  
     - *This symmetry confirms it’s one phenomenon with two poles*.  

  2. **Exploits Ambiguity**:  
     - Mental-state terms (e.g., "knows," "wants") are **polysemous** in AI. They occupy a gray zone between technical descriptors (e.g., "activations encoding X") and folk psychology.  

  3. **Accountability Avoidance**:  
     - The speaker avoids justifying ontological commitments while retaining the rhetorical benefits of intentionalist explanations.  

  ---

  ### **Boundaries: Separating Innocence from Opportunism**  
  | **Innocent Shorthand**                          | **Explanatory Opportunism**                          |  
  |-------------------------------------------------|------------------------------------------------------|  
  | Consistent framing: "It’s *as if* the model knows" | Inconsistent framing: Toggle depends on argumentative need |  
  | Admits limitations: "This metaphor breaks at scale" | Denies inconsistency: Retreats when challenged       |  
  | Heuristic-only: Not used for substantive claims | Premise-dependent: Invokes literalism for robustness arguments |  

  **Example Boundary Case**:  
  - A researcher says: "The model *searches for truth* (shorthand) but could hallucinate due to data noise." → **Innocent** if "searches" is consistently metaphorical.  
  - Same researcher says: "Hallucinations prove the model *fails at truth-seeking* (literal premise)." → **Opportunism** if they later disclaim "truth-seeking" as non-literal.  

  ---

  ### **Is This More Than Sloppiness?**  
  Yes—it reflects **systemic bad faith** in two ways:  
  1. **Epistemic Free-Riding**: Leveraging the explanatory power of intentionalist frameworks (e.g., belief-desire psychology) while rejecting their epistemic costs (e.g., proving the model has beliefs).  
  2. **Immunization Against Critique**: By disowning commitments when challenged, the speaker renders their position unfalsifiable.  

  This is distinct from mere sloppiness because it’s **strategic**: The slide occurs precisely where literal readings confer argumentative advantage (e.g., predicting hidden knowledge persistence) or where metaphorical readings deflect criticism.  

  ---

  ### **Generalization Beyond Machines**  
  The structure appears wherever agency/mentality is ambiguously attributed:  
  - **Groups**: "The *market fears inflation*" (literal for policy) → "Markets aren’t sentient!" (metaphorical when denying irrationality).  
  - **Institutions**: "The *company wants to innovate*" (literal for strategy) → "It’s just emergent from incentives" (metaphorical for ethics debates).  
  - **Biology**: "Genes *seek to replicate*" (literal in pop-science) → "It’s metaphorical selection" (in technical contexts).  

  **Key Difference**: In humans/institutions, we *expect* intentionality (e.g., a company has goals). With AI, the debate is unresolved—making opportunism easier.  

  ---

  ### **Why This Carving Matters for Interpretability**  
  You’re describing a **rhetorical anti-pattern** that obstructs clarity in interpretability:  
  - It allows claims like "fine-tuning hides knowledge" to bypass scrutiny (if "knowledge" is literal) while avoiding proof (if "knowledge" is shorthand).  
  - It entrenches polarization: Pro-mentalists weaponize the slide to imply inner misalignment; anti-mentalists use it to dismiss interpretability work.  

  **Diagnostic Test**: Ask your colleague: *"Is your claim dependent on the literal truth of this mental state?"*  
  - If yes → They owe an ontological defense.  
  - If no → They can’t use it for substantive inferences (e.g., knowledge persistence).  

  By naming **explanatory opportunism**, you force consistency: Either mental-state terms are heuristic (and can’t support robust inferences) or literal (and require evidence). There’s no free lunch.  

  Let me know if you'd like to workshop examples or refine the term further—this is critical groundwork for clearer discourse.
