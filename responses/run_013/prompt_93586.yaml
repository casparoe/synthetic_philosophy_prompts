prompt: |-
  I write about science and ideas for a general audience, and I keep getting pulled into the WEIRD psychology stuff — the whole point that the moral psychology everyone built their theories on was basically a study of Western undergrads, who turn out to be outliers on alot of things. And when you actually look cross-culturally, people's gut reactions diverge: what counts as a fair split of a windfall, how you treat a dead body, whether some things are wrong no matter what or only wrong because the local rules say so. Somebody also told me there's this thing where even little kids everywhere draw a line between stuff that's wrong regardless of the rules and stuff that's only wrong because it's against the rules — but then someone else told me that line isn't even drawn the same way in other cultures, so I don't know what to do with that either.

  Here's what I cant sort out. Doesn't all this basically settle it that morality is just whatever your culture drilled into you? If the so-called universal moral intuitions were mostly an artifact of who happened to get studied, then there's no there there, and the philosophers who keep going on about objective right and wrong are really just doing ethnography with footnotes. But then the same researchers seem to want it both ways, because I also see them claim their work tells us something about which moral judgments are actually trustworthy, or about what's really right. Those can't both be true, right? So which is it — does the cross-cultural data kill moral objectivity, or doesn't it?

  And I'd really like you to keep what's actually settled in this area separate from what's genuinely disputed among people who know it well, and not hand me a contested reading as if it were the consensus.
reasoning: |-
  Okay, the user is a science writer grappling with the implications of WEIRD psychology findings on moral objectivity. They're clearly frustrated by contradictory claims—some researchers say cross-cultural variation proves morality is cultural, yet others imply their work reveals universal truths. 

  Hmm, their core tension is epistemological: if moral intuitions vary wildly, how can any be "trustworthy"? And they're rightly suspicious of scholars who seem to want relativism and objectivity simultaneously. Smart catch—that does look like having your cake and eating it too. 

  What they really need is a map of the contested terrain. They explicitly asked to separate settled findings from open debates, so I must avoid presenting any single theory as consensus. The key is structuring the response around degrees of certainty: 

  First, undeniable facts—WEIRD samples skewed early research, and cross-cultural work shows significant variation in moral reasoning. That's bedrock. 

  Then the murkier layers: 
  - Even if moral *content* varies, the *cognitive machinery* (harm detection, fairness intuitions) might be universal but calibrated differently. Like how taste buds are innate but preferences adapt to local cuisine. 
  - The rules vs. wrongness distinction in kids (moral/conventional distinction) exists cross-culturally but its boundaries shift—some cultures see ritual violations as moral imperatives. 

  The real minefield is the objectivity question. Must flag that philosophers and psychologists answer this differently: 
  - Psychologists might say "universal foundations exist" (settled) 
  - Philosophers debate whether foundations imply objectivity (hotly contested). 

  Should emphasize that nobody serious claims culture is the *only* factor—even relativists grant biology constrains what morals can emerge. And highlight the few near-universals (harm aversion in close kin) as boundary markers. 

  User's phrasing ("ethnography with footnotes") suggests they suspect moral philosophy is culturally myopic. Valid concern—but the response should note that some ethicists (e.g., capabilities approach) deliberately incorporate cross-cultural data. 

  Biggest trap to avoid: implying the data "proves" moral relativism. The evidence complicates objectivism but doesn't refute it—many objectivists just relocate universality to abstract principles rather than concrete norms. 

  ...Better include that example about corpse treatment: same biological trigger (disgust) but different cultural interpretations. Perfect illustration of biology/culture entanglement. 

  And absolutely must cite Haidt's foundations theory as influential but contested—some anthropologists think he forces diverse norms into Western categories. User would spot that overreach. 

  Final note to self: User's sharp. No dumbing down. They'll want citations like Shweder's three ethics for the contested frameworks.
answer: |-
  You've hit the nerve center of one of the most heated debates in moral psychology and philosophy. Let's dissect this carefully, separating robust findings from contentious interpretations. Here's the lay of the land:

  ### Solid, Well-Replicated Findings (Settled Territory)

  1.  **WEIRD Bias is Real & Significant:** Decades of research overwhelmingly confirm that early psychological theories (including moral psychology) were disproportionately based on studies of Western, Educated, Industrialized, Rich, and Democratic populations. This *was* a massive sampling error.
  2.  **Substantial Cross-Cultural Variation Exists:** When researchers *did* look beyond WEIRD samples, they found significant differences in:
      *   **Moral Priorities:** What domains matter most? (e.g., autonomy vs. community vs. divinity - Shweder's "Big Three" ethics).
      *   **Concrete Judgments:** What constitutes a "fair" distribution (e.g., strict equality vs. merit vs. need vs. status), acceptable treatment of the dead, obligations to kin vs. strangers, concepts of justice (retributive vs. restorative).
      *   **Scope of Moral Rules:** What kinds of acts are seen as universally wrong vs. context-dependent vs. merely conventional? (The Moral/Conventional Distinction - see below).
  3.  **The Moral/Conventional Distinction (MCD) is Widespread but Culturally Shaped:**
      *   **The Finding:** Children (and adults) across diverse cultures *do* generally distinguish between acts that are "wrong even if there's no rule" (moral - e.g., hitting someone unprovoked) and acts that are "wrong only because there's a rule" (conventional - e.g., wearing pajamas to school).
      *   **The Nuance (Where it Gets Contested):** *What falls into each category varies culturally.*
          *   Actions seen as deeply immoral (moral domain) in one culture might be conventional or neutral in another (e.g., dietary restrictions, certain forms of dress, ritual purity rules).
          *   The *reasons* given for why something is moral/conventional differ. A violation might be deemed "moral" because it causes harm (universalist reason) in one context, or because it violates divine law or communal order (culture-specific reasons) in another.
      *   **Settled Point:** The *cognitive capacity* to make *some kind* of distinction between deeper wrongs and rule-dependent violations appears developmentally early and cross-culturally robust. The *content* filling these categories is culturally variable.

  ### The Core Contention: What Does This Mean for Moral Objectivity?

  **This is where the consensus ends and deep philosophical/interpretive disagreements begin.** The data itself doesn't "settle" the objectivity debate; it provides evidence that different sides interpret differently:

  1.  **The Strong Cultural Relativist Interpretation:**
      *   **Argument:** The vast, systematic variation in moral judgments and priorities, even on seemingly fundamental issues, demonstrates that morality *is* primarily a product of cultural learning and social norms. There is no single, universal, objective moral truth discoverable by reason or intuition; "right" is defined by the local culture.
      *   **Support from Data:** The WEIRD critique and cross-cultural variation are foundational evidence. If intuitions vary so dramatically based on cultural background, how can they point to objective truths? Philosophers making objective claims *are* often just describing their culturally conditioned intuitions.
      *   **Philosophers/Thinkers Often Associated:** Gilbert Harman, David Wong (moderate relativist), many anthropologists.

  2.  **The Universalist/Foundationalist Interpretation (e.g., Moral Foundations Theory - MFT - Haidt, Graham):**
      *   **Argument:** Variation exists, but it's built upon a small set of universal psychological *foundations* or modules (e.g., Care/Harm, Fairness/Cheating, Loyalty/Betrayal, Authority/Subversion, Sanctity/Degradation). Cultures "tune" these foundations differently – emphasizing some, downplaying others, and connecting them to different specific norms and virtues. The underlying cognitive machinery is universal.
      *   **Support from Data:** Evidence for early-emerging moral intuitions (like harm aversion), the existence of the MCD capacity even if content varies, and the claim that diverse moral systems can often be "mapped" onto combinations of the proposed foundations. Some preferences (e.g., aversion to direct harm of kin) show stronger universality.
      *   **Claim to Objectivity?** Proponents like Haidt usually frame MFT as *descriptive* psychology, not prescriptive ethics. They argue it tells us *where* moral intuitions come from (biology + culture), not necessarily which ones are "true." However, identifying foundations can imply certain moral concerns are "built-in" and thus harder to dismiss.

  3.  **The Pluralistic Realist/Objectivist Interpretation:**
      *   **Argument:** There *are* objective moral truths or values (e.g., well-being, fairness, autonomy, respect), but they are complex, plural, and sometimes in tension. Different cultures discover and prioritize different aspects of this pluralistic moral landscape based on their history, ecology, and social structures, leading to justified variation in concrete norms. Universal moral principles exist but allow for legitimate cultural expression.
      *   **Support from Data:** Points to areas of surprising convergence (e.g., prohibition on unprovoked harm within the group, some reciprocity norms) and argues that variation often represents different weightings of *real* values rather than purely arbitrary differences. Also argues that cross-cultural disagreement doesn't *disprove* objectivity any more than disagreement in physics disproves physical laws.
      *   **Philosophers/Thinkers Often Associated:** Isaiah Berlin (Value Pluralism), Amartya Sen, Martha Nussbaum (Capabilities Approach), some neo-Aristotelians.

  4.  **The Skeptical/Pragmatic Interpretation:**
      *   **Argument:** The data shows that appeals to "universal intuition" are unreliable guides to objective moral truth because intuitions are demonstrably shaped by culture. This doesn't necessarily mean *no* objective morality exists, but it means we must be extremely cautious and self-critical when making moral claims, relying more on reason, dialogue, consequences, and overlapping consensus than on claimed intuitions. The search for objectivity requires methods beyond cataloging gut feelings.
      *   **Support from Data:** The WEIRD critique and variation data directly challenge the reliability of untutored intuition as a foundation for objective ethics.
      *   **Philosophers/Thinkers Often Associated:** Many influenced by critical theory, pragmatism (e.g., Dewey), or those emphasizing reflective equilibrium (Rawls) *with* awareness of cultural bias.

  ### So, Does the Data "Kill" Moral Objectivity? The Uncomfortable Answer

  *   **It Certainly Wounds Intuitionist/Objectivist Arguments that Ignore Culture:** The data is devastating for any theory claiming that objective moral truths are directly, reliably, and universally revealed through the moral intuitions of any single cultural group (especially WEIRD ones). Philosophers relying *uncritically* on their own intuitions *are* often doing "ethnography with footnotes."
  *   **It Does NOT Settle the Metaphysical Question:** The data *describes* variation in human moral psychology. It does not, and cannot, *prove* that no objective moral truths exist. That is a philosophical question beyond the reach of empirical psychology alone. A pluralistic realist could still argue objective values exist, even if humans disagree about them.
  *   **It Shifts the Burden & Changes the Conversation:** The data forces proponents of moral objectivity to:
      1.  Acknowledge the profound role of culture.
      2.  Explain the source and nature of variation (e.g., as different implementations of plural values, errors, or differing priorities).
      3.  Provide alternative, culturally sensitive methods for discovering or justifying moral truths (e.g., reasoned discourse, focus on fundamental human needs/capabilities, consequentialist analysis).
  *   **It Highlights the Need for Humility:** Anyone making strong claims about universal, objective morality based *primarily* on intuition or "common sense" is on empirically shaky ground.

  ### What Researchers Mean by "Trustworthy" Judgments

  When psychologists say their work tells us which judgments are "trustworthy," they usually mean something more specific and limited than "objectively true":

  1.  **Identifying Culturally Robust Foundations:** Judgments grounded in foundations that appear cross-culturally (like Care/Harm) might be seen as more deeply rooted in human psychology and thus harder to dismiss entirely.
  2.  **Distinguishing "Deep" Morality from Convention:** The MCD work suggests judgments about harm, fairness, and rights often feel different and more "serious" than judgments about etiquette or arbitrary rules, suggesting different psychological processes.
  3.  **Understanding Bias:** Research helps identify *when* judgments are likely biased by in-group favoritism, disgust overgeneralization, or other heuristics, making them less reliable guides even within a culture.
  4.  **Predicting Stability:** Judgments tied to core foundations might be more stable within a person or culture over time.

  **In Summary for Your Writing:**

  *   **Settled:** WEIRD bias was real & damaging; Moral intuitions vary dramatically cross-culturally; The *capacity* for a moral/conventional distinction is widespread, but the *content* assigned to each category varies.
  *   **Contested:** What this variation *means* for the existence of objective moral truths.
      *   Relativists: Variation proves morality is cultural.
      *   Universalists (MFT): Variation is built on universal foundations.
      *   Pluralistic Realists: Variation reflects different weightings of objective, plural values.
      *   Skeptics: Variation undermines intuition as a reliable path to objectivity.
  *   **Key Takeaway:** The cross-cultural data doesn't *prove* relativism, but it delivers a fatal blow to any naïve objectivism that relies solely on culturally localized intuitions. It forces a far more nuanced, culturally informed, and philosophically sophisticated discussion about the nature and grounds of morality. Researchers claiming insights into "trustworthy" judgments are usually speaking descriptively about psychological foundations or biases, not making ultimate claims about metaphysical objectivity. The tension you feel reflects the genuine, unresolved debate at the heart of the field.
