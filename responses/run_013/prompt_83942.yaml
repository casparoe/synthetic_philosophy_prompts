     Full rules:

     Title: "The Noisy Cooperation Game"

     Objective: Accumulate as many tokens as possible over 8 rounds. The player with the most tokens wins.

     Setup:
     - Players are randomly paired. These pairs remain fixed for all 8 rounds.
     - Each player receives a score sheet to record their own intended actions and observed partner actions and tokens (optional, if we don't trust the public board? but we have public board, so maybe not necessary).
     - Public scoreboard is set up with player names and space for running total and current round.

     Round Procedure:
     1. Decision: Each player writes their intended action (C for Cooperate or D for Defect) on a slip of paper. They should keep their intention private.
     2. Collection: Slips are collected by the facilitator and helpers.
     3. Noise Application: For each slip, the facilitator rolls a 10-sided die. If the die shows 1 (10% chance), the action is flipped (C becomes D, D becomes C). Otherwise, the action remains the same. This flipped/true action is the "observed action" that the partner will see.
     4. Outcome Calculation: For each pair, the observed actions of the two players determine the payoff:
          - Both C: each gets 2 tokens.
          - One C and one D: C gets 0 tokens, D gets 3 tokens.
          - Both D: each gets 1 token.
     5. Update Scoreboard: 
          - The facilitator writes for each pair the observed actions and the tokens earned in that round.
          - The running total for each player is updated.
     6. The round is complete. Proceed to the next round.

     End: After 8 rounds, the player with the highest total tokens wins.

     Important: No communication between players during the game.

     Materials:
     - 10-sided die (or multiple if using helpers)
     - Slips of paper (about 144)
     - Pens or pencils
     - Whiteboard and markers for scoreboard
     - List of player names and pairs

     Timeline:
     - 0-5 min: Setup (explain rules, form pairs)
     - 5-45 min: 8 rounds (5 min per round: 1 min decide and write, 2 min noise and compute, 2 min update board)
     - 45-90 min: Debrief

     Debrief Questions:
     1. What strategies did you use? How did they change over time?
     2. How did the noise affect your decisions and the outcomes?
     3. Did you experience a breakdown in cooperation? How did it happen?
     4. Did you try to forgive a defection? What happened?
     5. How does this relate to real-world situations?

     Final note: This game illustrates the fragility of cooperation in the presence of noise and the trade-off between forgiveness and exploitation. It does not model long-term evolution of strategies, reputation systems, or communication.

     Now, run it and enjoy!
answer: |-
  Here’s a complete, runnable game for your group, designed to simulate the collapse of cooperation due to noisy information and the forgiveness-exploitation trade-off. It fits 18 people into 90 minutes, with minimal setup and maximal experiential learning.

  ---

  ### **Game Title**: *Signal Static*  
  *A repeated prisoner's dilemma with hidden noise, where misperceptions breed distrust.*

  ---

  ### **Core Mechanics & Payoffs**
  - **Actions**: Cooperate (C) or Defect (D).  
  - **Payoff Table (Tokens per Round)**:
    | Your Action | Partner's Action | Your Tokens | Partner's Tokens |
    |-------------|------------------|-------------|------------------|
    | C           | C                | 2           | 2                |
    | C           | D                | 0           | 3                |
    | D           | C                | 3           | 0                |
    | D           | D                | 1           | 1                |

  - **Noise Mechanic**:  
    - **Signal Interference**: 20% chance per action that the *intended* action is flipped (C→D or D→C) before the partner sees it.  
    - **Key Twist**:  
      - Players know their *own* intended action but only see their *partner’s perceived action* (which may be flipped).  
      - **No one knows the error rate upfront**—noise is revealed only in the debrief.  
      - Partners **never discuss** what they intended or perceived during the game.  

  ---

  ### **Setup (10 min)**  
  1. **Materials**:  
     - 18 index cards (1 per player) for recording actions.  
     - 18 pens.  
     - 1 opaque bag with 20 tokens: 16 "✓" (no flip), 4 "✗" (flip action).  
     - Whiteboard for public scoreboard (columns: Player, Total Tokens).  
     - Prize: Bag of coffee for highest token total.  

  2. **Pairing & Rules**:  
     - Randomly pair players into 9 fixed pairs (e.g., draw numbers from a hat). **Pairs stay together for all rounds** to enable repeated interactions.  
     - Explain only:  
       - "You’ll play 10 rounds with your partner. Each round, secretly write **C** or **D** on your card."  
       - "We’ll collect cards, then announce perceived actions and tokens."  
       - "Goal: Maximize your tokens. Highest total wins the coffee."  
     - **Do NOT mention noise, flips, or errors**—let this emerge.  

  ---

  ### **Round-by-Round Flow (50 min for 10 rounds)**  
  Each round = 5 min max:  
  1. **Decision (1 min)**: Players write **C** or **D** on cards (keep choices hidden).  
  2. **Collection & Noise (1 min)**:  
     - Facilitator collects all cards.  
     - For *each card*, draw from the noise bag:  
       - **✓**: Action is **recorded as-is**.  
       - **✗**: Action is **flipped** (C→D, D→C).  
     - *(Bag is reset each round: 16✓, 4✗ tokens)*.  
  3. **Announce Perceived Actions & Tokens (3 min)**:  
     - Call out each pair:  
       *"Pair 1: Alex perceived *D*, Sam perceived *C*. Alex: 3 tokens, Sam: 0 tokens."*  
     - Update public scoreboard with tokens.  
     - **Critical**: Players **never learn** what their partner *intended*—only what was *perceived*.  

  ---

  ### **Debrief Framework (30 min)**  
  **Goal**: Connect game experiences to the theme: *"Noise breaks reciprocity; forgiveness is exploitable."*  

  1. **Initial Reactions (5 min)**:  
     - *"What frustrated you? When did trust break down?"*  
     - *(Listen for: "My partner defected!" "I cooperated but got screwed!")*.  

  2. **Reveal the Noise (5 min)**:  
     - Explain the 20% flip rate: *"Sometimes intentions were distorted. You never saw the full story."*  
     - *"Who thought their partner defected intentionally? How did you respond?"*  

  3. **Key Insights (15 min)**:  
     - **Reciprocity vs. Noise**:  
       - *"In theory, 'I’ll do what you did last round' should sustain cooperation. What happened here?"*  
       - → **Point**: Noise creates false defections. Tit-for-tat punishes *perceived* slights, triggering death spirals.  
       - **Game Moment**: When a player retaliates after a false defection, killing mutual cooperation.  
     - **The Forgiveness Trap**:  
       - *"Did anyone give a partner the benefit of the doubt? What happened?"*  
       - → **Point**: Forgiveness prevents collapse but risks exploitation. If you ignore a defection, a strategic player will keep defecting.  
       - **Game Moment**: A player who "cooperated" after noise but later got defected on by a partner testing limits.  

  4. **Real-World Links (5 min)**:  
     - *"Where have you seen this? e.g., A missed email blamed as laziness, a delayed project seen as sabotage."*  
     - *"The fix isn’t just ‘be nicer’—it’s building systems to reduce noise (e.g., clearer feedback) or detect exploiters (e.g., reputation scores)."*  

  ---

  ### **Failure Modes & Mitigations**  
  1. **"The Retired Guy Calls It Trivial"**:  
     - *Mitigation*: Nod and say: *"Yes, it’s a simple model—but watch how fast it unravels with real people. That’s the point."* Redirect to the group’s emotional experience.  

  2. **Someone Games the Noise**:  
     - *Predict*: A player defects constantly, blaming "noise" when partners retaliate.  
     - *Mitigation*: Post-game, highlight this: *"Notice how exploiters weaponized ambiguity? That’s why forgiveness isn’t free."*  

  3. **Group-Wide Meltdown**:  
     - *Predict*: Pairs descend into mutual defection by round 4–5.  
     - *Mitigation*: Use this! *"Exactly what we wanted—how many of you are still cooperating? Why did it collapse?"*  

  4. **Time Crunch**:  
     - *Mitigation*: Skip rounds 9–10 if behind. Shorten debrief questions.  

  ---

  ### **What This Can’t Show (Be Transparent)**  
  - **Evolutionary Dynamics**: Players don’t "reproduce" strategies or adapt over generations.  
  - **Complex Strategies**: Real-world actors use reputation, coalitions, or punishment—this is pure pairwise PD.  
  - **Communication**: No chatting allowed (by design). In reality, talking can resolve noise.  
  - **Scale Effects**: 9 pairs can’t simulate large networks (e.g., viral outrage).  

  ---

  ### **Why This Works**  
  - **Noise Emerges Naturally**: Players *feel* the injustice of false defections without being told.  
  - **Prize Incentivizes Competition**: Token totals push players to optimize, mimicking real stakes.  
  - **Debrief Roots Theory in Lived Experience**: The "collapse" moment becomes a shared reference point.  

  Run this, and your group won’t just *understand* cooperation—they’ll have *felt* its fragility.
