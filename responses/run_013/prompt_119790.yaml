prompt: |-
  I am assembling a taxonomy of positions on the relation between knowing how to do something and knowing that something is the case. I have five candidates, each given by a single claim:

  - Retrieval: all apparent practical know-how is ordinary propositional knowledge together with a reliable capacity to retrieve and apply the relevant propositions at the moment of action.
  - Indexical: the know-how is itself propositional, consisting of indexical knowledge of how to proceed here, now, with these means.
  - Dispositional: the know-how is a non-propositional disposition to form and act on the right propositions under the right conditions.
  - Model-based: the know-how is the possession and manipulation of a non-propositional model or simulation of the task, which accounts for performance better than anything the subject could state.
  - Irreducible: some know-how is non-propositional and cannot be reconstructed from any propositions the subject could in principle grasp.

  Rank these five by how much you would trust each as the correct account of the relation, with a sentence or two of justification for each placement. Then say which one you would drop from the taxonomy, which pair is closest to each other and what single case would best separate them, and which of the five does the most explanatory work in accounting for a skill that is performed fluently but degrades when the performer tries to say explicitly what she is doing.
reasoning: |-
  Okay, the user is working on a taxonomy about the relationship between "know-how" (practical skills) and "know-that" (propositional knowledge). They've listed five positions: Retrieval, Indexical, Dispositional, Model-based, and Irreducible. My task is to rank these by how trustworthy I find each as the correct account, provide justifications, then answer follow-up questions about which to drop, closest pair, and best explanatory account for a specific case.

  First, I need to understand each position clearly. Retrieval says know-how is just propositional knowledge plus reliable retrieval. Indexical argues it's propositional but involves indexicals like "here" and "now." Dispositional views it as a non-propositional disposition to act correctly. Model-based suggests it's based on mental models or simulations. Irreducible claims some know-how can't be reduced to propositions at all.

  For ranking trustworthiness: I should consider philosophical arguments and empirical evidence. The Irreducible view seems strong because of cases like skills that degrade when analyzed—think of athletes or musicians who perform worse when overthinking. That suggests something beyond propositions. Model-based aligns with cognitive science on mental models, like how we navigate spaces without stating rules. Dispositional is plausible but might be too vague; it could overlap with propositional elements. Indexical is interesting but seems limited—it still reduces everything to propositions. Retrieval feels weakest because it struggles with tacit knowledge and automatic skills that don't involve conscious retrieval.

  For the follow-ups: Dropping Retrieval makes sense as it's the least defensible. The closest pair is Dispositional and Model-based since both involve non-propositional elements, but they differ in structure—dispositions are more reactive, while models are internal representations. A good test case is riding a bike: a dispositional account might explain automatic responses, but a model-based one better captures the continuous adjustments based on an internal sense of balance. For the fluent skill that degrades with explicit focus, Model-based does the most explanatory work—it directly addresses why verbalizing disrupts performance by invoking an internal simulation that can't be easily articulated.

  I should ensure my justifications are concise and grounded. The user seems knowledgeable in philosophy, so I'll use precise terms but keep it accessible. Their query is well-structured, indicating they want a clear, reasoned analysis to refine their taxonomy. The deeper need might be to identify the most robust framework for understanding skill acquisition and expertise, possibly for academic work. I'll emphasize practical examples to make the distinctions vivid.
answer: |-
  Based on philosophical arguments and empirical evidence (especially from cognitive science and psychology of skill), here's my ranking of the five positions, from most to least trustworthy as a *general* account of know-how:

  1.  **Model-based:** This view resonates strongly with cognitive science models of skill (e.g., mental models, schemas, embodied simulations). It explains fluent, adaptive performance, the difficulty of verbalization, and expertise that surpasses explicit rules (e.g., a master chess player's intuition). *Justification:* Best accounts for the tacit, structural, and often non-linguistic nature of skilled action guidance that operates faster and more fluidly than propositional retrieval allows, especially for complex tasks.

  2.  **Irreducible:** Captures the core intuition that some knowledge *in* action is fundamentally practical and resists exhaustive propositional formulation. Strong arguments (e.g., from Ryle, Polanyi, Dreyfus) highlight the "explanatory gap" propositions face with truly fluent skill. *Justification:* Acknowledges the phenomenological reality of skills that defy complete articulation and the potential regress problem inherent in purely propositional accounts (knowing *how* to apply the proposition).

  3.  **Dispositional:** Correctly identifies the reliable behavioral capacity as central and avoids over-intellectualization. Fits well with basic skills and learned reflexes. *Justification:* Provides a straightforward, non-representational account for many aspects of reliable, context-sensitive performance, especially routinized actions, but may lack the explanatory depth for *how* complex, novel adaptations occur.

  4.  **Indexical:** Offers a sophisticated propositional account attempting to bridge the gap by incorporating context. Recognizes the situated nature of action. *Justification:* More plausible than simple Retrieval as it tries to capture the context-dependence of action guidance within a propositional framework, but still struggles with the richness, speed, and non-linguistic nature of much skillful coping.

  5.  **Retrieval:** The least plausible general account. Fails spectacularly with tacit knowledge, highly fluent/automatic skills, and cases where explicit rules misdescribe actual performance. *Justification:* Overly intellectualizes skill, ignores the phenomenology of flow and expertise, and is empirically challenged by the dissociation between performance and verbal report (e.g., "expert-induced amnesia").

  **Answers to Specific Queries:**

  1.  **Which one to drop:** I would drop **Retrieval**. It serves as a useful *straw man* or extreme propositionalist position but is the least defensible empirically and theoretically as a general account. The other four capture more significant nuances in the debate.
  2.  **Closest Pair & Separating Case:**
      *   **Closest Pair:** **Dispositional and Model-based**. Both posit non-propositional cognitive structures underlying know-how (a disposition vs. a model/simulation). They both aim to explain reliable, context-sensitive performance without constant propositional consultation.
      *   **Best Separating Case:** **Navigating a complex, novel environment (e.g., a maze or unfamiliar city) without a map.**
          *   *Dispositional View:* Might struggle to explain the *adaptive planning* and *anticipation* involved. A mere disposition seems too passive/reactive to account for generating a novel path based on an internal representation of spatial relationships.
          *   *Model-based View:* Excels here. It posits an internal cognitive map or spatial simulation that the agent actively manipulates to predict outcomes, plan routes, and adapt to unexpected obstacles, explaining the generative and anticipatory aspects of the skill.
  3.  **Explanatory Work for Fluency Degraded by Verbalization:** **Model-based** does the most explanatory work here.
      *   **Why:** Fluency relies on the seamless operation of an integrated, often proceduralized, non-propositional model/simulation (e.g., a dynamic sensorimotor model for bike riding, a tactical simulation for a soccer player). Explicitly stating propositions forces a shift to a slower, serial, conscious mode of processing (propositional retrieval/application), disrupting the holistic, parallel operation of the internal model. The model generates actions directly; trying to translate its complex, dynamic structure into discrete, sequential propositions interrupts this process, causing degradation. The other views either struggle to explain the degradation (Retrieval, Indexical), attribute it to a general distraction (Dispositional), or simply assert the knowledge *is* irreducible without specifying the *mechanism* of degradation (Irreducible). The Model-based view provides a specific cognitive mechanism for both the fluency and its vulnerability to explicit focus.
