answer: |-
  ## Joint Statement: Adversarial Collaboration on Qualia

  **Preamble:** We, a qualia realist and a quiner, have engaged in sustained debate regarding the coherence and necessity of qualia, characterized as intrinsic, ineffable, private, and directly apprehensible phenomenal properties of experience. We agree that progress requires clarifying our commitments, identifying genuine disagreements, and isolating testable differences. This statement outlines points of agreement, precise formulations of our core disagreements, predictions based on stipulated cases, and a characterization of the residual dispute.

  **Part 1: Points of Agreement**

  Both parties agree on the following:

  1.  **The Phenomena:** Conscious experiences possess a subjective character; there is "something it is like" for a subject to undergo them. Reports about this character (introspective reports) are a primary data source for the philosophy of mind.
  2.  **The Four Marks as Descriptors:** The terms "ineffable," "intrinsic," "private," and "directly apprehensible" capture important *aspects* of how subjects *describe* their experiential world. They reflect the subject's perspective on their own experience.
  3.  **Identity Criteria Requirement:** For any putative property to be a genuine feature of the world and explanatorily useful, it must be possible, at least in principle, to specify non-circular criteria for determining when two instances are instances of *the same* property or *different* properties.
  4.  **The Stipulated Cases' Implications:**
      *   **The Taster Pair:** Demonstrates a dissociation between discriminatory capacities, preference reports, and introspective reports. It shows that sameness of verbal report does not entail sameness of underlying experiential state or discriminatory capacity, and that preference shifts can occur independently of discriminative shifts. It highlights the potential opacity of introspection regarding the *basis* of preference or recognition.
      *   **The Chameleon:** Demonstrates that the functional role of an experience (its causal relations to stimuli, behavior, discrimination, judgment, and verbal report) can remain constant while, by stipulation, its intrinsic phenomenal character changes radically. This shows that functional properties alone, *as operationalized through behavior and report*, do not necessarily fix intrinsic phenomenal character (if such character exists). It challenges views that identify phenomenal properties solely with their functional/dispositional roles.
  5.  **Limits of Introspection:** Introspection is not infallible. It cannot reliably access the underlying physical or functional mechanisms generating experience. It cannot directly compare the intrinsic character of one subject's experience with another's. Introspective reports are subject to various influences, including conceptual framing, memory limitations, and attention.
  6.  **The Explanatory Target:** A complete account of the mind must explain the structure of subjective experience, the nature of introspection, and the relationship between first-person reports and third-person observable phenomena.

  **Part 2: Disagreements Table**

  | Question in Dispute                                                                 | Realist's Formulation                                                                                                                                 | Quiner's Formulation                                                                                                                                                                  | Crux the Question Turns On                                                                                                |
  | :---------------------------------------------------------------------------------- | :---------------------------------------------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ | :------------------------------------------------------------------------------------------------------------------------ |
  | **1. Are there phenomenal properties individuated solely by their intrinsic character?** | "Experiences possess intrinsic phenomenal properties (qualia) whose identity is constituted by their intrinsic, directly apprehended qualitative character, independent of relations to other states, stimuli, or behavior." | "The notion of a phenomenal property individuated *solely* by its intrinsic, non-relational character is incoherent or explanatorily idle. Properties require relational criteria for individuation." | Whether phenomenal properties *must* be individuated relationally (e.g., via functional role, neural substrate, stimulus) or if non-relational individuation is coherent and necessary. |
  | **2. Can similarity/dissimilarity relations individuate phenomenal properties?**    | "Similarity and dissimilarity relations between experiences are judgments *about* their intrinsic phenomenal characters, but do not *constitute* the identity of those characters themselves." | "Phenomenal properties are exhaustively individuated by their positions within a similarity/dissimilarity space, which is revealed through subjects' comparative judgments and discriminatory capacities." | Whether the structure of phenomenal similarity space is a structure *of the experiences themselves* (Realist) or *of judgments about experiences* (Quiner), and whether this structure suffices for identity. |
  | **3. What does the Chameleon case reveal?**                                         | "The Chameleon case reveals a possible gap between functional/dispositional properties (which remain constant) and intrinsic phenomenal properties (which change). It shows a fact about intrinsic character that is not captured by function or report." | "The Chameleon case describes a scenario where dispositions remain constant while we *stipulate* a change in 'intrinsic character'. This stipulation adds no new fact beyond redescribing the subject's unchanged dispositions at each stage; it doesn't identify a detectable property." | Whether the stipulated change in intrinsic character in the Chameleon case refers to a potentially *recordable fact* (e.g., neural) independent of dispositions (Realist), or is *only a redescription* of the constant dispositions (Quiner). |
  | **4. What is the epistemic status of introspective access?**                        | "Introspection provides direct, albeit fallible, access to the intrinsic qualitative character of one's own current experience; this character is the ground for phenomenal judgments." | "Introspection provides access to judgments *about* experience, shaped by conceptual resources and attention. What we call 'direct access' is the immediacy of these judgments, not access to intrinsic non-relational properties." | Whether introspection reveals intrinsic properties *as such* (Realist) or reveals judgments/dispositions formed in response to internal states (Quiner).                                |

  **Part 3: Predictions Based on Agreed Tests**

  For each crux identified above, we agree on the following test or consideration, and state our divergent predictions:

  1.  **Crux 1 (Intrinsic Individuation) & Crux 2 (Similarity Structure):** *Test/Consideration:* Could two subjects (or one subject at different times) have inverted similarity/dissimilarity relationships between their phenomenal states relative to external stimuli, *while* all their discriminatory capacities, behavioral responses, neural activation patterns (relative to external stimuli), and introspective judgments *about* similarity/dissimilarity remained identical?
      *   **Realist's Prediction:** Yes, this is coherent (e.g., a "hidden inversion" within a constant similarity space). The intrinsic characters could be permuted while the relational structure (judgments, discrimination, neural correlates *of the relational structure*) remains fixed. This demonstrates the need for intrinsic individuation.
      *   **Quiner's Prediction:** No, this is incoherent. The similarity/dissimilarity relations *just are* constituted by the subject's dispositions to judge and discriminate. If all relational properties are identical, the phenomenal properties are identical. There is no "hidden" intrinsic character beyond the relational structure evidenced in judgments and behavior.
  2.  **Crux 3 (Chameleon - Fact or Redescription):** *Test/Consideration:* Suppose advanced neuroscience allowed us to track the precise neural state N1 associated with the subject's experience of red at time T1, and neural state N2 associated with blue at T1. In the Chameleon scenario, after the shift, the subject experiences what was once the character of blue when presented with a red stimulus. Could neuroscience, in principle, detect that the neural state now elicited by the red stimulus (call it N1') is type-identical to N2 (the original neural correlate for blue), rather than to N1 (the original correlate for red), despite the subject's unchanged behavior and reports?
      *   **Realist's Prediction:** Yes, in principle. The neural identity (N1' = N2) would confirm the stipulated change in intrinsic character, revealing a fact independent of dispositional properties.
      *   **Quiner's Prediction:** No. The very notion of "neural correlate *of a specific intrinsic quale*" presupposes the realist framework. Neuroscience might find neural differences, but identifying N1' as the "correlate of the blue quale" rather than just "the neural state causing 'red' judgments in this phase" assumes the explanandum (intrinsic character) the quiner rejects. The unchanged dispositions define the property. Any neural change would either be irrelevant or constitute a change in the property (contradicting the stipulation of constant dispositions).

  **Part 4: Residual Disagreement and Distinctions**

  We distinguish genuine disagreement from potential verbal differences:

  *   **Merely Verbal:** Disagreements often framed around "privacy" and "ineffability" may be largely verbal. Both agree that first-person access differs epistemically from third-person access. Both agree that conveying the full character of an experience to someone who hasn't had it is difficult or impossible using public language alone. The core disagreement is not primarily about *epistemic* features like privacy, but about the *metaphysical* nature of the properties accessed.
  *   **Genuine Disagreement:** The fundamental disagreement is metaphysical and concerns the nature of phenomenal properties:
      *   The **Qualia Realist** is committed to the existence of *non-relational*, *intrinsic* properties of experience. These properties are what the subject is directly aware of in introspection and constitute the qualitative character of "what it's like." Their identity is primitive and intrinsic, even if they stand in relations (similarity, causal roles). The Chameleon case highlights their potential independence from functional roles; the Taster Pair highlights the potential independence of preference/discrimination from report. Identity criteria for these intrinsic properties are provided by direct acquaintance (first-person ontology) or potentially by brute physical/neural identity (third-person ontology, though this risks collapsing the intrinsic nature).
      *   The **Quiner** denies that positing such intrinsic, non-relational properties is coherent or necessary. Phenomenal properties are exhaustively characterized by their relational roles within the subject's cognitive economy – their relations to stimuli, other mental states, behavior, and crucially, to each other within a similarity space defined by the subject's dispositions to judge and discriminate. The four marks reflect the subject's perspective *within* this relational network, not features of isolated intrinsic properties. Identity criteria are provided by the subject's dispositions within the similarity structure. The Chameleon case shows only that we can *tell a story* using the concept of "intrinsic character," not that it picks out a distinct property; the Taster Pair shows dissociations *within* the relational network.

  **Residual Disagreement Stated Precisely:** The Qualia Realist holds that a complete account of subjective experience requires the existence of phenomenal properties whose identity and nature are *not wholly constituted* by their relational/dispositional profiles (including their positions in similarity spaces defined by judgment). The Quiner holds that the identity and nature of phenomenal properties *are wholly constituted* by their relational/dispositional profiles (including their positions in similarity spaces defined by judgment). The dispute centers on whether the notion of a property whose identity is intrinsic and non-relational is coherent and required to explain the first-person perspective on experience.

  ---
  **Signed,**

  [Signature Line for Qualia Realist]
  [Signature Line for Quiner]
