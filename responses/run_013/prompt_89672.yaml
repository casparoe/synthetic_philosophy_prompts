  First, I need to figure out why the user is avoiding "obviously nuts" examples. They probably feel students dismiss those too easily without engaging critically. Fomenko, being a mathematician with complex methods, forces deeper analysis. The challenge is making students see why it's pseudoscience despite its academic veneer.

  The user's explicit requests: a step-by-step teaching sequence, how to handle Fomenko throughout the lesson, misconceptions to address, a final question, and what not to settle. But their deeper need might be teaching students to dissect pseudoscience that *isn't* laughable—preparing them for real-world "credible-looking" fringe theories.

  For the lesson structure, I'll start by setting up demarcation criteria without labeling them first. Begin with Fomenko's claims and methods to hook interest, then dissect why it fails scientifically. Using Fomenko all the way through is better for depth, but I must ensure students don't conflate "mathematical" with "scientific." 

  Key misconceptions to tackle: pseudoscience isn't just "false science" (it's about process), unfalsifiability alone isn't decisive (some sciences have unfalsifiable elements), and demarcation isn't a fixed line. I'll weave these in during the analysis phase, using Fomenko's flaws as examples.

  The final question should test understanding, not cynicism. Something like "What would minimally rehabilitate Fomenko?" forces them to apply demarcation criteria constructively. And I'll explicitly avoid debating Fomenko's historical claims—focus on methodology, not truth.

  Hmm, the user also wants "what to refuse to settle." That's crucial. Don't let the discussion veer into defending/attacking Fomenko's timeline or his character. Stay on process. Also, resist defining pseudoscience simplistically; emphasize it's a cluster concept with gray areas.

  This approach should make students sweat—no easy outs, no strawmen. They'll learn demarcation by grappling with a theory that *almost* sounds plausible... until you see how it handles evidence.
answer: |-
  Here’s a structured lesson plan designed to use Fomenko’s New Chronology as a rigorous case study for demarcation, avoiding superficial dismissal while targeting core philosophical pitfalls. The goal is to force students to engage with **methodological flaws** rather than intuitive "weirdness."

  ---

  ### **Lesson Structure: Demarcation via Fomenko’s New Chronology**

  #### **Phase 1: Setup – Legitimizing the Surface (15 mins)**
  - **Goal:** Make Fomenko initially plausible to prevent knee-jerk rejection.  
  - **Key Moves:**  
    1. **Introduce Fomenko neutrally:** "A Russian mathematician applies statistics to historical texts and astronomical records. He argues that events from antiquity (e.g., Julius Caesar, the Trojan War) actually occurred ~800–1000 years ago due to document duplication and dating errors."  
    2. **Highlight credentials:** Emphasize his math background, academic position, and technical methods (e.g., correlation of dynastic records, eclipse dating).  
    3. **Frame the challenge:** "If we dismiss this because it conflicts with consensus, are we being unscientific? What criteria *should* we use?"  
  - **Why this order:** Forces students to confront that "scientific-seeming" methods ≠ science. Preempts "obviously nuts" bias.

  #### **Phase 2: Core Analysis – Dissecting Pseudoscience (45 mins)**  
  **Carry Fomenko all the way through**—switching examples would dilute depth. Dissect him using three escalating criteria:  

  | **Criterion**               | **Application to Fomenko**                                                                 | **Misconception Targeted & When to Interrupt**                                                                 |
  |-----------------------------|-------------------------------------------------------------------------------------------|---------------------------------------------------------------------------------------------------------------|
  | **1. Responsiveness to Evidence** | • Selective data: Ignores non-textual evidence (e.g., radiocarbon dating, archaeology). <br>• "Negative evidence" dismissed as "corruption of records." | **Misconception:** "Pseudoscience = false claims." <br>**Interrupt here:** Show Ptolemy’s *Almagest* example: Fomenko redates eclipses by rejecting inconvenient data as "forgeries." Contrast with science revising methods *when evidence demands*. |
  | **2. Methodological Rigor** | • Statistical cherry-picking: Correlates only *parts* of dynastic lists; arbitrary thresholds for "matches." <br>• No error analysis: Doesn’t quantify uncertainty in dating. | **Misconception:** "Complex math = science." <br>**Interrupt here:** Contrast with climate science models that *quantify* uncertainty and test sensitivity to inputs. |
  | **3. Epistemic Integrity**  | • Immunization: Consilience failure (e.g., linguistics, genetics) is waved away as "all fields are corrupted." <br>• No predictive power: Can’t generate testable future claims. | **Misconception:** "Unfalsifiable = pseudoscience." <br>**Interrupt here:** Note that string theory has falsifiability issues but *engages* with counter-evidence. Fomenko’s ad-hoc "corruption" excuses make his theory **unrevisable**. |

  #### **Phase 3: Conceptual Synthesis (20 mins)**  
  - **Reframe demarcation:** Emphasize it’s about **process**, not truth. Fomenko fails by:  
    - **Isolating** his theory from interdisciplinary scrutiny.  
    - **Reversing the burden of proof** ("disprove my correlations!").  
    - **Lacking self-correction mechanisms**.  
  - **Kill misconceptions explicitly:**  
    > ✦ **"No fixed line":** Demarcation is a *cluster concept* (Lakatos). Fomenko hits multiple failure points.  
    > ✦ **"Not just falsifiability":** Freudian psychoanalysis is unfalsifiable but engages clinically; Fomenko *evades* engagement.  
    > ✦ **"Not about truth":** Alchemy was wrong but proto-scientific (empirical); Fomenko’s methods are *anti*-empirical.  

  #### **Phase 4: The Pivot Question (10 mins)**  
  **Question to test understanding:**  
  > *"What minimal methodological change would make Fomenko’s project scientific, and why?"*  

  - **Target insight:** Students must identify **procedural fixes** (e.g., "pre-register statistical criteria," "engage with radiocarbon dating") not just "be less wrong." Reveals if they grasp *self-correction* as the core.  
  - **Avoids cynicism:** Focuses on redeemability, not just dismissal.  

  ---

  ### **What to Openly Refuse to Settle**  
  1. **"Is Fomenko *wrong*?"**  
     → *"We’re not historians; we assess process, not historical claims."*  
  2. **"Is this *dangerous* pseudoscience?"**  
     → *"Moral/political consequences don’t define pseudoscience; methodology does."*  
  3. **"Where’s the exact line?"**  
     → *"Demarcation is a tool for critique, not a bright boundary. Focus on why Fomenko fails key criteria."*  

  ---

  ### **Why This Works**  
  - **Fomenko’s advantage:** His academic veneer forces students to engage with **methodology**, not content. They can’t coast on incredulity.  
  - **Targeted misconceptions:** Each phase preempts a specific error (e.g., "math = science" dies in Phase 2).  
  - **Anti-cynicism:** The pivot question requires constructive critique, reinforcing that demarcation is about **improving inquiry**, not gatekeeping.  

  **Final Tip:** Pre-load students with Fomenko’s short paper excerpts (e.g., statistical claims about Roman dynasties). The more "reasonable" he seems early on, the sharper the methodological critique lands later.
