  For the procedure, I'll structure tests in logical order: first check for paradoxes (like the "void if passed"), then self-referential changes, then retroactivity, and finally self-entrenchment. Judgment calls should be explicit—like deciding when retroactivity is acceptable or how to handle an abolished amendment process.

  For the examples: 
