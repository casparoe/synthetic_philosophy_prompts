answer: |-
  Your critique exposes a profound tension in macroeconomic practice, and I'll reconstruct the implicit theory with direct verdicts. The inconsistency is real, not merely rhetorical, and stems from an unacknowledged philosophical hybrid. Here’s my analysis, structured by your questions:

  ### 1. **The View of Social Explanation**  
  The practice presupposes **weak methodological individualism**: only individuals exist, but aggregate regularities *can* have explanatory power *if* derived from microfoundations. The "close to mandatory" microfoundations rule enforces this: aggregate laws (e.g., consumption functions) are invalid unless reducible to individual optimization. However, this is *not* strict ontological individualism (where aggregates are mere summaries). The practice allows emergent properties—like systemic instability—to do causal work, but only if formally derived.  

  ### 2. **The Single-Household Device: Aggregate Agent or Convenience?**  
  It is **both a computational convenience *and* a covert commitment to an aggregate agent**. Defense:  
  - *As convenience*: It simplifies dynamic optimization, avoiding distributional complexity.  
  - *As commitment*: The model treats "the economy" as a unified agent with consistent preferences and beliefs. This is irreconcilable with individualism: real economies involve heterogeneous agents whose interactions generate emergent phenomena (e.g., coordination failures). By assuming a single household, the model *imputes* agency to the aggregate—it becomes a "rational actor" writ large. If this were merely computational, policy institutions would not so readily attribute beliefs/moods to "the market" in public discourse.  

  ### 3. **Philosophical Underdetermination?**  
  The practice **does not survive under strict individualism** and **requires weak holism**.  
  - Under *strict individualism*: Public analysis could not speak of "market sentiment" or "overheating economies" as causal forces. Yet institutions do this constantly because aggregate predicates (e.g., confidence) explain outcomes irreducible to any single agent.  
  - The "work" done by metaphysics: The microfoundations ritual *disciplines* the holism, confining it to derived aggregates. But when models fail (e.g., during crises), institutions fall back on unreduced aggregate concepts (e.g., "animal spirits"). The practice *needs* emergent properties to function but legitimizes them only when formally derived.  

  ### 4. **Internal Consistency?**  
  **No, the package is inconsistent in three layers**:  
  - *Modeling vs. Public Analysis*: Models reduce the economy to a single agent; public discourse treats aggregates as autonomous actors (e.g., "the market fears inflation"). This isn’t division of labor—it’s contradiction. If aggregates are mere summaries, they cannot "fear" or "overheat."  
  - *Welfare Analysis*: Ignoring distribution while maximizing aggregate consumption assumes a representative agent exists. But if individuals matter, gains/losses *must* affect welfare calculations. The single household "disappears" because its fiction collapses under distributional questions.  
  - *Core Tension*: Austere individualism in modeling clashes with functional holism in policy narrative.  

  ### 5. **Asymmetric Individualism: Coherent? Necessary?**  
  It is **incoherent as individualism and indistinguishable from emergent holism**.  
  - *Contradiction*: If "individual actions are the only causes," aggregate predicates cannot be irreducible—they must reduce to individual states. But if distributional changes alter aggregates non-superveniently (e.g., a confidence cascade), then aggregates have causal power *sui generis*. This is holism.  
  - *Practice doesn’t need it*: Standard models already rely on emergent properties (e.g., multiple equilibria in coordination games). The asymmetry is ad hoc; the practice implicitly accepts weak holism.  

  ### 6. **What If Presuppositions Changed?**  
  - **Switch to strict individualism**:  
    - *Models*: Require heterogeneous agents, strategic interaction, and distributional dynamics.  
    - *Welfare*: Must use social welfare functions (e.g., Pareto weights).  
    - *Public Analysis*: Could only describe individual behaviors, not "market moods."  
    - *Loss*: Policy narratives lose intuitive power; many crises (e.g., bank runs) become harder to explain without aggregate concepts.  
  - **Switch to explicit holism**:  
    - *Models*: Aggregate relations (e.g., Phillips curves) could stand without microfoundations.  
    - *Welfare*: Distributional aggregation remains problematic but acknowledged.  
    - *Public Analysis*: Current discourse could continue, but lose "rigor" veneer.  
    - *Loss*: Predictive precision might suffer; political vulnerability to ad hoc aggregate claims.  

  ---

  ### Verdict  
  **The practice presupposes weak emergent holism masked as methodological individualism.** I am 85% confident, based on:  
  - The *enforcement* of microfoundations (point 1),  
  - The *inconsistencies* in modeling, discourse, and welfare (point 4), and  
  - The *indispensability* of aggregate causal language (point 3).  

  **Where I speculate**: The exact threshold of "acceptable" emergence (point 5) is undefined, but the practice’s tolerance for unreduced aggregates in crises suggests pragmatism over principle.  

  **Key Question**: **Point 4 (internal consistency)** does the heaviest lifting. The clash between the single-household model (individualist fiction), aggregate causal language (holist reality), and distributional neglect (welfare sleight-of-hand) reveals a tripartite failure. This isn’t reconcilable—it’s a coping mechanism for a complex system that resists reduction.  

  **Your framing is sound**, not confused. The inconsistency is not merely rhetorical but structural: policy institutions *need* holist concepts to describe economies, yet fetishize individualist reduction to claim scientific legitimacy. The "tidy answer" is that macroeconomics is philosophically schizophrenic—and this schizophrenia is functional. It allows rigor where possible and narrative flexibility where necessary. But it is not coherent.  

  **To fix it**: Abandon the single-household pretense. Model heterogeneity explicitly, quantify distributional impacts in welfare, and openly defend emergent concepts (e.g., "confidence") as irreducible without apology. This sacrifices some elegance but honors reality.
