answer: |-
  Your inquiry brilliantly captures a deep problem in philosophy of mind and value theory. The dialectical shape you describe—where a purported mental kind resists unification under a common intrinsic property, forcing a functional/response-dependent account that risks losing the phenomenal "essence"—is indeed a recurring pattern. Here's a structured analysis:

  ### 1. **The Established Concept for Pleasure: The Heterogeneity Problem**
     - **Core Idea**: The "heterogeneity problem" (or "diversity objection") **specifically names the challenge to hedonism** arising from the apparent lack of a unified phenomenal quality common to all pleasures. Key proponents include Henry Sidgwick (*Methods of Ethics*) and contemporary critics like Roger Crisp.
     - **Why "Heterogeneity" Fits**: It directly addresses the tension between hedonism's claim that pleasure is a *single, measurable good* and the radical diversity of pleasures (sensory, relief, intellectual, malicious). The problem isn't just diversity but **phenomenal incommensurability**—e.g., the "warm glow" of a bath shares no obvious quale with schadenfreude.
     - **Dialectical Shape**:  
       - **Thesis**: Hedonism claims pleasure is a homogeneous mental state.  
       - **Antithesis**: Cases reveal no common intrinsic property.  
       - **Synthesis**: Shift to functionalism (e.g., "pleasure is whatever is intrinsically desired," per Sidgwick) or attitude-based views (e.g., "taking pleasure in").  
       - **Meta-Problem**: Functional accounts seem circular (desiring pleasure because it’s pleasurable) or abandon phenomenology.

  ### 2. **The General Pattern: Beyond Pleasure**
     Your insight extends beyond hedonism. The pattern arises when:  
     - A mental kind is presumed to have a unitary *intrinsic essence* (often phenomenal).  
     - Empirical/experiential diversity undermines this unity.  
     - Functionalism/response-dependence rescues the category at the cost of its "core" character.  
     - **General Term**: While no universal label exists, **"phenomenal disunity"** or **"qualitative heterogeneity problem"** is apt. I propose coining:  
       - **Unified Essence Failure (UEF)**  
         *Definition*: The collapse of an intrinsic (especially phenomenal) account of a mental kind due to irreconcilable diversity among its instances, leading to functional/relational definitions that alter the original theoretical commitment.  
       - **Boundary Cases**:  
         - *Genuine UEF*: Pleasure, emotions (§3 below).  
         - *Not UEF*:  
           - **Vagueness**: "Heap" paradox—no sharp boundary, but instances share intrinsic properties (e.g., grains of sand).  
           - **Theoretical Disagreement**: "What is justice?"—conflict over criteria, not absence of common properties.  
           - **Determinables**: "Color" is a determinable of red/blue—instances share higher-order properties (wavelength reflectance).  

  ### 3. **UEF in Other Domains**
     | **Mental Kind** | **UEF Manifestation** | **Functional "Rescue"** |  
     |------------------|------------------------|--------------------------|  
     | **Emotions** | What intrinsic quality unifies fear, joy, guilt? None obvious. James-Lange theory reduces emotions to bodily feedback. | "Emotions are dispositions to act" (functional) or "appraisals of stimuli" (cognitive). |  
     | **Pain** | Debate over whether "pain" includes physical agony, social rejection, and "painful" truths. Is there a common quale? | "Pain is an aversive experience" (functional/affective). |  
     | **Attention** | Is spotlight attention the same as diffuse vigilance? Phenomenally distinct. | "Attention is selection for action" (computational/functional). |  
     | **Virtues** | What intrinsic property unites courage, humility, wit? Arguably none. | Virtue ethics shifts to "excellence of character" defined by role in flourishing (functional/eudaimonic). |  

  ### 4. **Distinguishing UEF from Neighboring Concepts**
     - **Family Resemblance (Wittgenstein)**:  
       - *Similarity*: No essential property, but overlapping features.  
       - *Difference*: UEF involves **total phenomenal discontinuity** (e.g., relief vs. malicious pleasure share *no* overlapping feel). Family resemblance admits gradients (e.g., "games" share rules/competition/fun).  
     - **Functional Kinds**:  
       - *Similarity*: Both define by role.  
       - *Difference*: UEF arises when functionalism is a *fallback* for failed intrinsic accounts. Functional kinds (e.g., "carburetor") don’t presuppose intrinsic unity.  
     - **Cluster Concepts**:  
       - *Similarity*: Multiple criteria (e.g., "art").  
       - *Difference*: Cluster concepts allow satisfaction of *some* criteria; UEF implies *no* intrinsic criterion unifies all instances.  
     - **Determinable-Determinate**:  
       - *Difference*: Determinates (e.g., red, blue) share a determinable property (color). UEF denies any such shared property exists.  

  ### 5. **Why Pleasure is Distinctive**
     Pleasure is the paradigm UEF case because:  
     - It is **centrally tied to phenomenal character** in hedonist theories (unlike virtues or attention).  
     - Its functional definitions (e.g., "motivational attractiveness") notoriously risk **circularity**: we desire pleasure *because* it feels pleasurable—but if "pleasurable" is undefined, the theory vacuums.  
     - **Normative Stakes**: Hedonism’s axiology (pleasure = sole good) collapses if pleasure isn’t a unified "thing."  

  ### 6. **Resolving the Carving**
     - **Instance of UEF**: When diversity implies *no possible unifying intrinsic property* (e.g., intellectual vs. sensory pleasures).  
     - **Not UEF**: When diversity is due to:  
       - **Vagueness** (e.g., "bald" has borderline cases but a core property: lack of hair).  
       - **Contextual Variation** (e.g., "knowledge" requires different evidence in different domains but shares a core structure).  

  ### Key Takeaway
  The **heterogeneity problem** is the established term for the pleasure-specific version, but **Unified Essence Failure (UEF)** encapsulates the broader dialectic. Pleasure remains the sharpest case due to its phenomenal primacy in theory, but UEF illuminates analogous struggles in philosophy of mind. Your seminar’s challenge isn’t just about hedonism—it’s about whether any mental kind can survive strict phenomenal essentialism.  

  For further reading:  
  - Sidgwick’s *Methods of Ethics* (Book I, Ch. 4) on pleasure’s heterogeneity.  
  - Rachels' "Is Unpleasantness Intrinsic to Unpleasant Experiences?" (1999) for pain parallels.  
  - Deonna & Teroni’s *The Emotions* (2012) on emotion disunity.
