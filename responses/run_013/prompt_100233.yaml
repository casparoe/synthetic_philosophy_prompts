  The user wants to know if there's an established term for this specific dialectical pattern where a mental kind lacks a common intrinsic property, forcing a functional account that might lose the original phenomenon. They also ask how this differs from concepts like family resemblance, determinables, functional kinds, and cluster concepts. Plus, they wonder if this pattern applies to other areas like emotions, pain, attention, or virtues.

