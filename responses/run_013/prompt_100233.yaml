  The closest term is "the heterogeneity problem of pleasure," but the user wants a more general term for this dialectical structure. Terms like "phenomenal disunity" or "qualitative heterogeneity" could work, but they might not be established. "Unity problem" is another option, but it's broad. "Functionalization response" describes the move to functional definitions, but it's not a name for the problem itself.

  Coining a new term: maybe "phenomenal fragmentation" or "intrinsic disunity." Define it as when a mental kind lacks a common intrinsic property, leading to functional accounts that may lose the essence. Boundary cases: if there's a common property but it's hard to define, that's vagueness. Genuine cases include pleasure and perhaps emotions.

  Neighboring concepts: family resemblance falls short because pleasure lacks overlapping features; it's about no commonality at all. Functional kinds are the solution, not the problem. Cluster concepts allow multiple criteria without requiring a single property, but the issue here is the failure of intrinsic unity.

