  The user mentions several related concepts. Family resemblance (Wittgenstein) involves overlapping similarities without a single common trait. But for pleasure, the issue isn't just overlapping features—it's that there's no intrinsic quality at all. Functional kinds define things by their role, but pleasure's functional definitions (e.g., being desired) risk circularity. Cluster concepts involve multiple criteria, but again, pleasure's problem is the absence of any intrinsic commonality.

  Determinables and determinates (like color and red) don't fit because pleasure isn't a category with specific sub-types sharing a common property. Instead, it's more like trying to find a common property where none exists.

