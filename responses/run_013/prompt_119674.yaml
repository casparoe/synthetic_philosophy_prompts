answer: |-
  ### Evolutionary Claim Decision Procedure  
  **Purpose:** To evaluate claims of the form "X evolved because..." for accuracy, avoiding overstatement, confusion of concepts, and adaptationist bias. Works solely from manuscript text. Outputs: Keep, Keep with Hedge, Cut, or Escalate to Author. Each verdict includes a one-line rationale.  

  ---

  ### Step-by-Step Procedure  
  **Key Definitions:**  
  - **Adaptation:** Trait shaped by natural selection *for* a specific function.  
  - **Exaptation:** Trait originally evolved for one function (or as byproduct) and later co-opted for a new one.  
  - **Byproduct:** Non-adaptive result of developmental, genetic, or historical constraints.  
  - **Vestigial:** Byproduct that lost ancestral function (subset of byproduct).  
  - **Current Usefulness ≠ Evolutionary Cause:** A trait’s *current* role may not explain *why* it evolved.  

  **Procedure Flow:**  
  1. **Is this an evolutionary claim?**  
     - *Check:* Does the sentence assert *why* a trait evolved (e.g., "evolved because," "selected for")?  
     - *No →* Keep as written.  
     - *Yes →* Proceed to Step 2.  

  2. **Does it conflate current usefulness with evolutionary cause?**  
     - *Check:* Does it claim a trait evolved *for* its current function (e.g., "evolved to do X") without evidence that selection acted on that function historically?  
     - *Yes →* **Escalate to Author**  
       - *Rationale:* "Confuses current utility with selective history."  
     - *No →* Proceed to Step 3.  

  3. **Is the trait unitary or composite?**  
     - *Check:* Could the trait be a collection of parts evolving independently (e.g., "neck" = vertebrae, muscles, nerves)?  
     - *Composite →* **Escalate to Author**  
       - *Rationale:* "Adaptive story may misrepresent trait complexity."  
     - *Unitary →* Proceed to Step 4.  

  4. **What evolutionary mechanism is claimed?**  
     - *Classify:*  
       - **Adaptation:** "Evolved *for* [function]."  
       - **Exaptation:** "Originally for [A], now used for [B]."  
       - **Byproduct/Vestigial:** "Result of constraint," "no function," "evolutionary leftover."  
     - *Proceed to Step 5, 6, or 7 based on classification.*  

  5. **For Adaptation Claims:**  
     - **Apply Default Rule:** Treat byproduct/constraint as null hypothesis. Adaptation requires ≥2 independent lines of evidence.  
       - *Independent evidence:* Must derive from distinct methods (e.g., fossil record + comparative genomics + experimental data). Same method (e.g., two behavioral studies) ≠ independent.  
     - *Check manuscript for:*  
       - Evidence 1 (e.g., fossil record showing incremental change).  
       - Evidence 2 (e.g., genetic markers of selection).  
       - Acknowledgment of non-adaptive alternatives (e.g., "some argue it is a byproduct").  
     - *Outcomes:*  
       - Evidence missing or only 1 line → **Keep with Hedge**  
         - *Rationale:* "Insufficient evidence to rule out non-adaptive hypotheses."  
       - No evidence and no alternatives acknowledged → **Cut**  
         - *Rationale:* "Unsupported adaptation claim overrides null hypothesis."  
       - ≥2 lines + alternatives acknowledged → **Keep as written**.  

  6. **For Exaptation Claims:**  
     - *Check:* Does the text specify *both* the original function *and* the co-opted function?  
       - *Yes →* **Keep as written**.  
       - *No →* **Escalate to Author**  
         - *Rationale:* "Exaptation requires explicit original/co-opted functions."  

  7. **For Byproduct/Vestigial Claims:**  
     - *Check:*  
       - Does it acknowledge possible current/secondary functions (e.g., "though it may have minor roles in...")?  
       - Vestigial claims: Does it note ancestral function?  
     - *Outcomes:*  
       - Acknowledges nuance → **Keep as written**.  
       - Presents as absolute (e.g., "useless") → **Keep with Hedge**  
         - *Rationale:* "Overstates lack of function; byproducts may have secondary roles."  

  8. **Group Differences or Mismatch?**  
     - *Group Differences (e.g., sex-specific traits):*  
       - *Check:* Does it imply selection *on the difference* (e.g., "males evolved aggression to compete")?  
       - *Yes →* **Escalate to Author**  
         - *Rationale:* "Group differences may arise from drift/constraint, not selection."  
     - *Mismatch (e.g., "was adaptive in past"):*  
       - *Check:* Does it specify the past environment?  
       - *No →* **Keep with Hedge**  
         - *Rationale:* "Must contextualize past vs. present environments."  

  ---

  ### Default Rule Assessment  
  **"Treat byproduct as null; adaptation requires ≥2 independent evidence lines."**  
  - **Is it the right default?**  
    - *Yes.* Byproduct/constraint is often the simplest explanation (e.g., developmental pathways, genetic drift). Adaptation claims carry a higher burden of proof.  
  - **What counts as independent evidence?**  
    - Lines must derive from distinct methodologies (e.g., phylogenetics + biomechanics + population genetics). Not independent: Two behavioral studies using similar methods.  
  - **Where does it misfire?**  
    - **Unfalsifiable byproducts:** E.g., "male nipples result from developmental constraint." No alternative is biologically plausible, so demanding evidence to "rule out" adaptation is redundant.  
    - **Solution:** If the byproduct mechanism is explicitly stated *and* no credible adaptationist alternative exists, skip the evidence requirement.  

  ---

  ### Rewrite Patterns for Hedges  
  Avoid weak hedges like "some scientists believe." Instead:  
  - **For contested adaptations:**  
    - *Weak:* "Some think the giraffe’s neck evolved for browsing."  
    - **Strong:** "The giraffe’s neck *may* have been shaped by selection for browsing, **though alternatives like sexual selection or developmental constraints are also debated**."  
  - **For byproducts with possible function:**  
    - *Weak:* "The appendix might be vestigial."  
    - **Strong:** "The appendix is **considered vestigial** due to reduced ancestral functions, **though it may play minor roles in immunity**."  
  - **For mismatch:**  
    - "This trait **likely conferred an advantage in past environments** (e.g., [specify: savanna foraging]), **but may be maladaptive today**."  

  ---

  ### Test Cases from Manuscript  
  **Case 1: Giraffe Neck**  
  *Claim:* "The giraffe’s long neck evolved so that giraffes can browse above other herbivores."  
  1. **Evolutionary claim?** Yes → Proceed.  
  2. **Conflate current use?** Yes ("evolved *so that*" implies current function as cause) → **Escalate to Author**.  
     - *Rationale:* "Confuses current utility with selective history."  
  3. *If author revises to "evolved *for* browsing..." → Trait composite?* Yes (neck involves vertebrae, vasculature) → **Escalate to Author**.  
     - *Rationale:* "Adaptive story may misrepresent trait complexity."  
  4. *If author revises to unitary trait + no conflation → Adaptation claim?* Yes → Apply Step 5.  
     - Manuscript lacks evidence lines → **Keep with Hedge**.  
     - *Hedge:* "Giraffes’ long necks *may* have been shaped by selection for accessing high foliage, **though other explanations (e.g., sexual selection) exist**."  
     - *Rationale:* "Insufficient evidence to rule out non-adaptive hypotheses."  

  **Author Fight Response:**  
  > "This classic example is contested. The ‘neck for browsing’ hypothesis lacks fossil evidence of incremental change, and sexual selection (neck-for-fighting) is equally plausible. We must acknowledge competing hypotheses or provide ≥2 lines of evidence (e.g., fossil gradients + biomechanical advantage)."  

  ---

  **Case 2: Human Appendix**  
  *Claim:* "The human appendix is a vestigial organ."  
  1. **Evolutionary claim?** Yes (vestigial = byproduct) → Proceed.  
  2. **Conflate current use?** No → Proceed.  
  3. **Trait unitary?** Yes → Proceed.  
  4. **Mechanism:** Byproduct/vestigial → Step 7.  
     - Fails check: No acknowledgment of possible current function (e.g., immune reservoir).  
     → **Keep with Hedge**.  
     - *Hedge:* "The appendix is **considered vestigial** due to reduced digestive functions, **though it may play roles in gut immunity**."  
     - *Rationale:* "Overstates lack of function; byproducts may have secondary roles."  

  ---

  **Case 3: Male Nipples**  
  *Claim:* "Male nipples are a byproduct of shared developmental pathways."  
  1. **Evolutionary claim?** Yes → Proceed.  
  2. **Conflate current use?** No → Proceed.  
  3. **Trait unitary?** Yes → Proceed.  
  4. **Mechanism:** Byproduct → Step 7.  
     - Passes check: No overstatement (cites constraint; doesn’t claim "useless").  
     → **Keep as written**.  
     - *Rationale:* "Byproduct mechanism is explicit and uncontested."  

  ---

  ### What the Procedure Cannot Do  
  1. **Fill knowledge gaps:** Relies solely on manuscript text. Escalates when data is absent.  
  2. **Resolve debates:** Judgment calls include:  
     - Classifying traits as unitary/composite.  
     - Deciding if evidence lines are independent.  
     - Assessing plausibility of byproduct claims (e.g., male nipples are uncontested; giraffe necks are not).  
  3. **Detect whole-chapter bias:** A per-sentence check misses systemic issues like:  
     - Why are *only certain traits* given evolutionary explanations (e.g., ignoring traits without clear stories)?  
     - Are non-adaptive explanations consistently downplayed?  

  **Whole-Chapter Bias Check (5-minute scan):**  
  - **Tally traits** given evolutionary explanations.  
  - **Calculate ratio:** Adaptation claims vs. byproduct/exaptation claims.  
  - **Red flags:**  
    - >80% adaptation claims.  
    - Traits with unresolved debates (e.g., human behaviors) presented as settled.  
    - No mention of constraints/spandrels.  
  - **Action:** If biased, **escalate structural edits** to author: "Expand coverage of non-adaptive mechanisms to avoid adaptationist bias."  

  **Output:** A rigorous, operational filter for evolutionary claims that prioritizes evidence, acknowledges nuance, and resists overstatement—while flagging systemic gaps.
