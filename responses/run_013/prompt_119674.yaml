prompt: |-
  I am the managing editor for a secondary-school and introductory-college science list, and I am the last person to read a manuscript before it goes to the author for approval and then to press. The unit I am working through now runs to two chapters on why bodies and behaviors are the way they are, and it contains roughly forty sentences of the form X evolved because... — the giraffe's neck, the peacock's tail, the human appendix, male nipples, and a dozen claims about human behavior. I have no graduate training in biology, I get about an hour per chapter, and these books stay in print for a decade and get recycled into teacher guides and exam banks, so any sentence that survives me is taught as fact for a long time. I have read the spandrels critique of adaptationism and I do not need its history retold; what I want is its operational form.

  So: write me a decision procedure I can run on each claim in turn — the questions to ask in order, what counts as a sufficient answer to each, which answers stop the process (keep as written, keep with a specified hedge, cut, or escalate to the author with a specific request), and where the procedure has to hand the decision to a person because it turns on a judgment rather than a fact. Two constraints. It has to work from the manuscript's own text: I cannot go to the literature, I do not want a reading list, and where a step needs something the manuscript does not state, the step should tell me to escalate rather than to guess. And it has to be usable by someone who knows the vocabulary but not the research. Assume the author will contest anything I cut, so every verdict needs a one-line rationale I can paste into a memo.

  Build in the distinctions I keep getting wrong, at minimum these: current usefulness versus the reason a trait was selected; adaptation versus exaptation versus byproduct of some other change, and whether a sentence is claiming any of these or merely reporting an effect; claims about a trait versus claims about a difference between groups; whether the trait is one thing or a composite of parts that vary independently, since an adaptive story about a composite is often an artifact of how we described it; and hypotheses about the distant past versus claims about the present, including the mismatch case of a trait that was useful in a past environment and is not now.

  A colleague wants us to adopt a default: treat byproduct of a developmental, architectural, or historical constraint as the null hypothesis, and credit an adaptation claim only if it beats that null on at least two independent lines of evidence. Tell me whether that is the right default, what should count as independent, and where the rule misfires — I suspect it fails on traits whose byproduct story is itself unfalsifiable, and I want the failure stated rather than patched over.

  Then run the procedure on three sentences from the current draft and show the output line by line: the passage asserting that the giraffe's long neck evolved so that giraffes can browse above other herbivores, presented as settled and beloved by the author; the sentence calling the human appendix a vestigial organ; and the aside that male nipples are a byproduct of shared developmental pathways. I expect at least one to come back in a form the author will fight me on, and I want to know what to say to them.

  Include the sentence-level rewrite patterns, because I need wording I can put in the margin: a hedge that flattens into some scientists believe is worse than useless, since the reader learns nothing about what is actually at stake. Finally, tell me what the procedure cannot do, which of its steps are judgment dressed up as procedure, and whether there is a cheap whole-chapter check that would catch a bias the per-sentence procedure misses — the possibility that the real problem is not which claims are wrong but which traits were given an evolutionary explanation in the first place.
reasoning: |-
  We are designing a decision procedure for evaluating evolutionary claims in a manuscript. The procedure will be applied per sentence (or claim) and will involve a series of questions. The goal is to catch problematic adaptationist claims and ensure accuracy in the presentation of evolutionary concepts.

  The procedure must account for:
  - Current usefulness vs. the reason for selection.
  - Adaptation, exaptation, byproduct, etc.
  - Whether a sentence is claiming an evolutionary cause or just reporting an effect.
  - Claims about a trait vs. differences between groups.
  - Whether the trait is a composite or a single unit.
  - Hypotheses about the past vs. present, including mismatch.

  Constraints:
  - Work only from the manuscript's text (no external research).
  - Usable by someone with basic vocabulary but not research expertise.
  - Every verdict requires a one-line rationale for the author.

  We are also to consider a proposed default: treat byproduct (due to constraint) as the null hypothesis and require at least two independent lines of evidence for an adaptation claim.

  The procedure steps:

  1. **Identify the Claim**: Extract the exact sentence and the trait being explained. Note the form: "X evolved because of Y."

  2. **Check for Overstatement**: Does the claim present the explanation as settled fact? If yes, that's a red flag because evolutionary hypotheses are often contested.

  3. **Current Usefulness vs. Reason for Selection**: 
     - Does the claim confuse the current function (if any) with the reason the trait was selected? If it does, flag for rewrite.
     - Example: A trait might now be used for something (current usefulness) but that may not be why it evolved.

  4. **Type of Evolutionary Explanation**:
     - Adaptation: trait evolved by natural selection for a specific function.
     - Exaptation: trait originally evolved for one function (or as a byproduct) and was later co-opted for a new function.
     - Byproduct: trait is a non-adaptive consequence of some other adaptive trait or developmental constraint.
     - Vestigial: a trait that has lost its original function but is retained (a type of byproduct).

     The procedure must ask: Does the manuscript claim the trait is an adaptation? If so, we must check if it is presented as the only possibility and if the evidence is sufficient.

  5. **Trait Definition**:
     - Is the trait described as a single unit? Or is it a composite? If composite, then an adaptive story about the whole may be misleading because parts might have evolved independently.

  6. **Group Differences**:
     - If the claim is about a difference between groups (e.g., males vs. females), is the explanation presented as due to selection on that difference? Be cautious: differences might be due to drift, constraint, or other factors.

  7. **Temporal Context**:
     - Does the claim mix past and present? For example, a trait that was adaptive in the past but is now maladaptive (mismatch) should be clearly distinguished.

  8. **Proposed Default Rule**:
     - We are to consider the default: byproduct (due to constraint) as the null. Require at least two independent lines of evidence for an adaptation claim.
     - Independent evidence: e.g., comparative data (across species), experimental manipulation, fossil record, genetic analysis, etc. These must not rely on the same underlying assumption.
     - Where the rule misfires: For traits where the byproduct story is unfalsifiable (e.g., male nipples are explained as a byproduct of developmental constraint, but it's hard to imagine an alternative). In such cases, the adaptationist claim might be easily falsified, but the byproduct story is the only plausible one. Also, for traits that are clearly adaptations (e.g., the eye) but the evidence might be overwhelming and not necessarily two independent lines? However, the rule is a heuristic for when the claim is being made.

     Verdict on the default: It is a good starting point because it counters the adaptationist bias, but it should not be applied dogmatically. In cases where the byproduct explanation is unfalsifiable, we must rely on the strength of the alternative (adaptation) explanation. If the adaptationist claim has no evidence and the byproduct is the only plausible story, then the default holds. But if the adaptationist claim has strong evidence, then even without a falsifiable byproduct story, we might accept it.

     However, note: the procedure must work from the manuscript. If the manuscript does not provide evidence, then we cannot assume it exists. So the procedure will require the manuscript to at least hint at the evidence.

  9. **Decision Tree**:

     Step 1: Identify the claim and the trait.
     Step 2: Is the claim presented as a fact? If yes, go to Step 3; if it is already hedged, note the hedging and proceed.
     Step 3: Does the claim confuse current function with evolutionary origin? If yes, flag for rewrite (rationale: current function may not reflect evolutionary origin).
     Step 4: What type of explanation is implied? 
          - If it claims an adaptation (trait evolved for a specific function), then we require evidence. But we cannot check the literature, so we look in the manuscript: does the manuscript provide at least two independent lines of evidence? If not, then we must either hedge or cut.
          - If it claims an exaptation, then we require that the original function (or byproduct) and the co-option are both addressed? (But the manuscript may not.) Since we cannot research, we must rely on the text. If the text doesn't mention the original function, then the claim is incomplete.
          - If it claims a byproduct or vestigial, then we check if it is presented as fact and if there is any controversy. Byproduct claims can also be contested (e.g., is the appendix really vestigial?).

     However, we must remember that the procedure must be operational. We are going to design a flowchart of questions.

     Proposed decision procedure (per claim):

     Q1: Does the sentence make a claim about why a trait evolved? (If no, then no action needed. If yes, proceed.)
     Q2: Does the claim present the explanation as settled fact? (If yes, then we need to check the support. If no, and it is appropriately qualified, then it may be acceptable.)
     Q3: What is the type of evolutionary cause claimed? 
          Options: 
          A. Adaptation (trait evolved by natural selection for a specific function)
          B. Exaptation (trait originally evolved for one reason or as a byproduct, then co-opted for another)
          C. Byproduct (non-adaptive consequence of another trait or constraint)
          D. Vestigial (a byproduct that is a remnant of a functional trait in ancestors)
          E. Other (drift, etc.)

     But note: the sentence might not use these terms. We must infer from the wording.

     Q4: For claims of type A (adaptation): 
          - Does the manuscript provide at least two independent lines of evidence? (Independent meaning from different domains, e.g., comparative anatomy and experimental data, or genetics and fossil record.) 
          - If the manuscript does not provide any evidence, then we must either cut or escalate to the author to provide evidence (but we can't go to literature). Since we can't research, if the manuscript doesn't mention evidence, then we have to flag it as unsupported.

          However, the default rule: treat byproduct as null. So for an adaptation claim, we require that the manuscript at least acknowledges the byproduct possibility and refutes it? Or provides two lines of evidence? But the manuscript might not.

          Given our constraints, we can only go by what's in the text. So:

          - If the text provides two independent lines of evidence (as described in the text), then we can let it stand (but still check for overstatement).
          - If the text provides one line of evidence, then we must hedge: e.g., "One hypothesis is that X evolved because...", or "Evidence suggests that...".
          - If the text provides no evidence, then we must either cut or escalate to the author to provide evidence (if the claim is important). But note: we cannot research, so if the text doesn't have it, we can't add it. We can only ask the author.

          However, the default rule requires two independent lines. So:

          Rule: For an adaptation claim, if the manuscript does not present at least two independent lines of evidence (and they must be described as independent and from different domains) OR if it does not acknowledge the possibility of non-adaptive explanations, then we must hedge or cut.

     Q5: For claims of type B (exaptation): 
          - Does the text mention both the original evolutionary cause (which might be an adaptation for something else or a byproduct) and the current function? If not, the claim is incomplete and must be rewritten or hedged.

     Q6: For claims of type C or D (byproduct or vestigial): 
          - These are often presented as the null. But they can be wrong. Does the text acknowledge that there might be adaptive explanations? If it presents the byproduct claim as fact without noting that it is a hypothesis, then we might need to hedge.

     Q7: Trait definition: 
          - Is the trait described in a way that suggests it is a single unit? Or is it clearly a composite? If composite, then an adaptive story about the whole might be an artifact. We must be cautious: if the trait is composite and the text doesn't acknowledge that parts might have independent evolutionary histories, then we must hedge.

     Q8: Group differences: 
          - If the claim is about a difference between groups (e.g., "males are more aggressive because..."), then we must check if the text considers non-adaptive explanations (drift, constraint, etc.). If not, we must hedge.

     Q9: Mismatch: 
          - If the claim is about a trait that is currently maladaptive or has a different function now, does the text clearly distinguish the past environment? If not, we must clarify.

     Given the complexity, we'll design a flowchart that asks these questions in order.

     But note: we cannot do external research, so we rely solely on the text. If the text does not mention evidence, we treat it as absent.

     Verdicts:
     - Keep as written: only if the claim is appropriately qualified and the evidence (if required) is presented.
     - Keep with hedge: e.g., change "X evolved because Y" to "One leading hypothesis is that X evolved because Y" or "X may have evolved because Y". But note: the hedge must not be weak. We want to convey the scientific status. So:
          - If there is strong evidence but not two independent lines? Then we might say "Evidence suggests that..." or "According to the current scientific consensus, ...". However, if the author has only provided one line, we don't know if there is consensus.
          - Better: if the adaptation claim is contested, we must note that: "Some scientists argue that X evolved because Y, but others propose non-adaptive explanations."

     - Cut: if the claim is without evidence and is highly contested, and the text doesn't provide any basis, or if it is factually incorrect.
     - Escalate to author: if the text doesn't provide necessary information and the claim is central, we ask the author to provide evidence or rephrase.

     Rewrite patterns:
     - Avoid: "some scientists believe" because it doesn't convey the weight of evidence.
     - Instead, use: "One well-supported hypothesis is ...", but only if the text provides support. If not, we might have to say: "The evolution of X is debated. One hypothesis is ..."
     - For vestigial organs: "The appendix is considered by many biologists to be vestigial, meaning it has lost most of its original function, though it may have some minor functions now."

