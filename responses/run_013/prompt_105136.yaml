answer: |-
  Your analysis brilliantly captures a profound epistemic dilemma at the intersection of power, memory, and historiography. This specific configuration is increasingly recognized but lacks a single canonical term. I propose **"archival asymmetry"** or **"epistemic double-bind of violent historiography"**, with these key facets:

  ### Core Terminology & Framework
  1. **Archival Violence** (or **Archival Silencing**)  
     The militia logbook embodies this: it functions both as *the only institutional record* and an *instrument of erasure*. Its authority stems from the same power structure that committed the violence, making it a tool of epistemic domination.

  2. **Resistant Mnemonics**  
     The song/procession constitutes a *counter-archive*—a form of communal memory preserved through performance. Its aesthetic "polish" (dismissed as unreliability) is actually its *methodology of survival*.

  3. **Epistemic Asymmetry**  
     The crux: **Professional history requires verifiable documentation, yet here the sole documentation is perpetrator-produced, while communal counter-evidence is deemed "non-archival" by those same standards.** Adjudicating truth thus replicates the original power imbalance.

  ### Distinguishing from Adjacent Concepts
  | Concept             | Why It Doesn't Fully Fit                          | How Your Case Extends/Diverges                     |
  |---------------------|---------------------------------------------------|----------------------------------------------------|
  | **Oral History**    | Focuses on methodology; assumes complementarity   | Here, orality is *disqualified* by institutional standards |
  | **Testimonial Injustice** | Individual credibility deficit (Fricker)     | Systemic: entire *form of evidence* is invalidated |
  | **Hermeneutical Injustice** | Missing interpretive frameworks (Fricker) | Frameworks exist but are hierarchically suppressed |
  | **History from Below** | Recovers subaltern voices                       | Voices exist but are epistemically excluded by design |
  | **Contested Memory** | General conflict of narratives                | Asymmetry is structural: one side controls the archive |

  ### Proposed Name: **The Archival Double-Bind**
  This emphasizes the impossible choice:  
  - **Bind 1:** Trusting the perpetrator's archive legitimizes historical violence.  
  - **Bind 2:** Rejecting communal memory as "unreliable" enacts epistemic violence.  

  *Boundaries:*  
  - **Not mere disagreement:** The conflict is over *what counts as evidence*, not interpretation of shared facts.  
  - **Not salvageable synthesis:** The logbook cannot be "corrected" by oral tradition; they inhabit irreconcilable epistemic regimes.  
  - **Asymmetry is reproducible:** Professional historical practice *becomes* an extension of the initial violence when it dismisses resistant mnemonics.  

  ### Pathways Forward (Scholarly Anchors)
  1. **Ann Laura Stoler**'s work on colonial archives (*Along the Archival Grain*) examines how archives are "laboratories of governance" that encode power.  
  2. **Michel-Rolph Trouillot** (*Silencing the Past*): The logbook exemplifies "silencing in the archives"; the song represents "historical resistance."  
  3. **Achille Mbembe**'s "The Power of the Archive" argues archives create state-centric "anti-memory."  
  4. **Ricoeur** on *testimony*: The song is "attestation" (lived truth) vs. logbook's "documentation" (institutional truth).  

  ### Why This Configuration Matters
  It reveals historiography's political ontology: **Whose artifacts survive, whose formats are legible, and whose curation is deemed "objective" determines not just *what* is remembered, but *how* history itself is defined.** The "neutral judgment" you reference is impossible because neutrality defaults to institutional epistemology—which is precisely what enabled the massacre.

  This asymmetry demands a new ethics of evidence that treats *survival strategies of memory* (like the song's performative evolution) not as corruption, but as *epistemic resistance*. Until historiography develops methods to credit such forms without romanticizing them, the double-bind persists. Your case isn't just about a town—it’s a microcosm of how power constructs historical truth.
