prompt: |-
  I am a student in an upper-level seminar on decision theory and its applications, and each of us has been asked to contribute one candidate essay question for the take-home final, along with a model answer and a marking scheme the teaching team can adopt. My topic is the phenomenon sometimes called the unilateralist's curse, but I do not want a question that can be answered by reciting the standard example, so I have tried to build a variant with a bit more structure and I would like you to write it up properly.

  The setup I want the question to use is this. A cheap prophylactic can be administered to an at-risk population by any of a large number of independent labs, each of which has the authority to begin deployment on its own. Every lab's own estimate is that, taking its deployment as the only one, the expected value is small but positive: a modest chance of a large benefit, a modest chance of a harm of comparable size, and otherwise no effect. Two features of the intervention matter. First, the benefit saturates: most of the total value is captured by whichever lab acts first, and each additional deployment adds very little. Second, the harm accumulates: each additional deployment adds risk roughly in proportion to the number already acting, with a dose threshold above which the aggregate harm becomes large. A further complication is that the labs are not independent in their judgments; they draw on the same body of evidence and share the same optimism about the intervention, so their errors are positively correlated.

  I would like the exam question to require the following moves, and I would like the model answer to show what each of them looks like when done well. First, the student should reconstruct the general condition under which each lab's individually rational decision to act, each acting on a positive solo estimate, produces a collectively negative outcome. I want them to state the condition as a relation between the marginal benefit schedule and the marginal harm schedule, and to explain why this is a coordination failure rather than bad luck or individual miscalculation. Second, the student should assess the norm of acting only if one would endorse everyone in one's epistemic position acting likewise. Does it give a determinate recommendation here, given that the estimates are both correlated and heterogeneous, and does it actually cure the failure or merely relocate it? Third, the student should assess an alternative governance fix: a unilateral veto, under which any single lab can block all deployments. Does this remove the curse or substitute a different failure mode, and what does the answer depend on? Fourth, and briefly, the student should identify the mirror-image case, in which the actions are complements so that independent action undershoots rather than overshoots, and explain why the veto fix is exactly the wrong remedy there. This last part is meant to test whether they can see the curse as one instance of a broader structure rather than as a standalone puzzle.

  Please write three things. First, the exam question itself, phrased so that a strong student can see the several distinct moves it requires without being told outright what the answer is. Second, a model answer of roughly 600 to 700 words that actually makes those moves. Third, a marking scheme worth 20 marks, built around the specific moves a top answer must contain, with the marks each is worth, a one-line note on how a weaker answer typically goes wrong at each point, and a clear statement of what separates an A from a B. The exam is closed-book and the students cannot look anything up, so neither the question nor the model answer may require them to name a paper, an author, a date, or a citation; the reasoning has to be carried by the scenario and by arguments the students can construct from it.
reasoning: |-
  We are going to design an exam question that tests understanding of the unilateralist's curse in a structured scenario. The question will have multiple parts corresponding to the moves the student must make.

  **Exam Question:**

  You are advising a network of independent research labs that have the authority to deploy a cheap prophylactic intervention to an at-risk population. Each lab can unilaterally decide to deploy. The intervention has two key features:

  1. **Benefit Saturation:** The total benefit of the intervention is largely captured by the first deployment, with diminishing returns to additional deployments. Specifically, the marginal benefit of the \(n\)-th deployment is positive but decreasing, and after the first few deployments, it becomes negligible.

  2. **Harm Accumulation:** The harm from the intervention accumulates with each deployment. There is a threshold beyond which the aggregate harm becomes large. Specifically, the marginal harm of the \(n\)-th deployment is increasing and proportional to the number of deployments already made.

  Each lab has conducted its own assessment. While the labs draw from the same body of evidence and share a common optimistic bias (so their errors are positively correlated), they have slightly different estimates. Each lab estimates that, if it were the only one deploying, the expected value of deployment would be small but positive: a modest chance of a large benefit, a modest chance of a harm of comparable size, and otherwise no effect.

  Answer the following:

  a) State the general condition under which the individually rational decisions of the labs (each acting on a positive solo estimate) would lead to a collectively negative outcome. Explain why this outcome is a coordination failure rather than bad luck or individual miscalculation.

  b) Consider the following ethical norm: "Act only if you would endorse that every lab in your epistemic position (i.e., with the same evidence and reasoning) acts likewise." Given that the labs' estimates are both correlated and heterogeneous, does this norm provide a determinate recommendation? Would following this norm cure the collective failure?

  c) An alternative governance solution is to institute a unilateral veto: any single lab can block all deployments. Would this remove the unilateralist's curse? If not, what new problem might it create? What does the answer depend on?

  d) Briefly, describe a mirror-image scenario in which actions are strategic complements (so that independent action undershoots rather than overshoots) and explain why the unilateral veto would be the wrong remedy in that case.

  **Model Answer:**

  a) The condition for collectively negative outcomes is that the marginal harm of the next deployment exceeds the marginal benefit at the level of deployment that would occur if every lab with a positive solo estimate acts. Since the benefit saturates (marginal benefit decreases with more deployments) and harm accumulates (marginal harm increases with more deployments), there will be a point where the marginal harm becomes greater than the marginal benefit. 

  Each lab, acting independently, only considers its own action in isolation. Because of their positive solo estimates, many labs choose to deploy. The key is that each lab ignores the negative externality it imposes on others by increasing the cumulative harm. The coordination failure arises because no lab internalizes the full social cost of its action. This is not bad luck because the outcome is systematically predictable from the structure of the incentives. It is not individual miscalculation because each lab's solo estimate is correct given that it acts alone, but they fail to account for the effect of simultaneous actions.

  b) The proposed norm: "Act only if you would endorse that every lab in your epistemic position acts likewise" is ambiguous in this context. The labs share the same evidence and reasoning (so they are in the same epistemic position in a broad sense) but have heterogeneous estimates due to random variations in their assessments. The norm requires each lab to consider a counterfactual in which all labs with the same evidence act. However, because the estimates are heterogeneous, the set of labs that would act if all acted might differ from the set that actually acts. 

  The norm might lead to two interpretations: 
  - Endorse the action if the expected value when all labs in the same epistemic position act is positive. However, because of the harm accumulation, the aggregate outcome when all act might be negative even if each solo estimate is positive. Thus, if each lab computes the expected outcome of universal action by labs in their epistemic position, they might all conclude it's negative and hence no one acts. This could cure the curse by leading to no deployment, which may be collectively optimal if the universal action would be harmful. But note: because of the benefit saturation, the optimal number of deployments might be a few, not zero. The norm might lead to under-provision (zero) when a few would be optimal. Therefore, it may merely relocate the failure (from over-provision to under-provision) rather than cure it.

  Moreover, the correlation in errors means that the labs might be systematically overoptimistic about the intervention. If so, they might still overestimate the net benefit of universal action. Thus, the norm does not fully cure the failure.

  c) A unilateral veto system, in which any single lab can block all deployments, would prevent any deployment if at least one lab opposes it. This might avoid the over-deployment problem of the curse, but it introduces a new failure mode: under-provision. If the optimal outcome requires a few deployments, the veto system might lead to no deployment even when it would be beneficial. The outcome depends on the distribution of estimates. If there is at least one lab with a negative estimate (which is likely due to the heterogeneity), then that lab would block. However, if all labs have positive estimates (which is possible because of the shared optimism), then no one would block and we are back to the original curse. But note: the veto system requires consensus to act, so if even one lab has a negative estimate (or is cautious) it can block. 

  The main problem is that the veto system does not allow for the optimal intermediate level of deployment. It only allows for two outcomes: zero or full deployment (if all labs are required to consent). But in our scenario, full deployment might be harmful. Thus, the veto system might prevent the worst-case scenario (high harm) but at the cost of also preventing the best-case scenario (modest deployment with net benefit). The answer depends on the distribution of lab estimates and the true net benefit function.

  d) The mirror-image case occurs when actions are strategic complements: each additional deployment increases the marginal benefit of the next. For example, consider a technology that becomes more valuable as more people adopt it (network effects). In such a case, independent action may lead to undershooting: each lab might not deploy because the benefit is low if others do not act, even though universal deployment would be beneficial. This is a coordination failure in the opposite direction. 

  In that case, a unilateral veto would be the wrong remedy because it would allow one lab to block deployment, making it even harder to achieve the necessary coordination for the network effects to kick in. What is needed is a way to coordinate to reach a threshold, and a veto would only make coordination harder.

  **Marking Scheme (Total 20 marks):**

  a) Condition for collective negative outcome and explanation (5 marks)
     - 2 marks: Correctly states the condition (marginal harm > marginal benefit at equilibrium deployment level).
     - 3 marks: Explains why it is a coordination failure (externalities not internalized) and not bad luck or miscalculation.

     *Common mistake:* Only describing the saturation and accumulation without stating the condition as a marginal comparison.

  b) Assessment of the ethical norm (5 marks)
     - 2 marks: Notes the ambiguity due to correlated and heterogeneous estimates and the challenge of defining "epistemic position".
     - 2 marks: Evaluates that the norm might lead to under-provision (zero) and may not achieve the optimal level (which might be a few).
     - 1 mark: Notes that the systematic overoptimism might persist even under the norm.

     *Common mistake:* Assuming that the norm straightforwardly leads to the correct outcome without considering the possibility of under-provision or the impact of correlated errors.

  c) Assessment of the unilateral veto (5 marks)
     - 2 marks: Identifies that the veto can lead to under-provision (no deployment even when some would be beneficial).
     - 2 marks: Explains that the veto system does not allow for intermediate levels and that the outcome depends on the distribution of estimates (if any lab opposes, then no action; if all are positive, then we get the curse again).
     - 1 mark: Notes that the veto might prevent the worst-case scenario but at the cost of also preventing the best-case.

     *Common mistake:* Only seeing that the veto prevents over-deployment without recognizing the risk of under-provision.

  d) Mirror-image case (5 marks)
     - 2 marks: Describes a scenario with strategic complements (e.g., network effects) where independent action leads to under-provision.
     - 2 marks: Explains why a veto would be the wrong remedy (it would make it harder to achieve the necessary coordination, leading to under-provision).
     - 1 mark: Clearly contrasts with the original scenario (overshooting vs. undershooting).

     *Common mistake:* Failing to provide a clear example of strategic complements or not explaining why the veto is harmful in that case.

  **Grading:**
  - **A (17-20 marks)**: Answers all parts correctly and completely, with clear and precise explanations. Shows deep understanding of the curse as a coordination failure and the nuances of the proposed solutions. The mirror-image case is well-articulated.
  - **B (14-16 marks)**: Answers most parts correctly but may have minor gaps or less clarity. For example, might miss the point about correlated errors in part (b) or the dependence of the veto outcome on the distribution of estimates in part (c).
  - **C (10-13 marks)**: Basic understanding but significant gaps. For instance, might not properly state the condition in part (a) or might not recognize the under-provision risk in the veto system.
  - **D (7-9 marks)**: Superficial treatment with major errors in multiple parts.
  - **F (0-6 marks)**: Little to no understanding of the problem.

  This marking scheme and model answer should help the teaching team evaluate students' understanding of the unilateralist's curse in a more structured scenario.
answer: |-
  ### Exam Question

  **Decision Theory and the Unilateralist's Curse**  
  Consider a scenario in which a large number of independent research labs may unilaterally deploy a cheap prophylactic intervention to an at-risk population. Each lab estimates that, if it acts alone, the intervention has a small positive expected value: a modest chance of large benefit, a modest chance of comparable harm, and otherwise no effect. However, two structural features apply:  
  1. **Benefit saturation**: The total benefit plateaus quickly, meaning most value is captured by the first deployment, and additional deployments yield rapidly diminishing marginal benefits.  
  2. **Harm accumulation**: Each deployment adds harm risk proportionally to the number of prior deployments, with a threshold beyond which aggregate harm becomes large.  
  Additionally, labs share a common body of evidence and exhibit correlated optimism in their estimates (i.e., errors are positively correlated), though individual estimates vary slightly.  

  Answer the following:  
  a) Specify the general condition under which individually rational deployment by labs (each acting on a positive solo estimate) yields a collectively negative outcome. Explain why this constitutes a *coordination failure* rather than bad luck or individual error.  
  b) Assess the following ethical norm: "A lab should act only if it would endorse every lab in its epistemic position (i.e., sharing its evidence and reasoning) acting likewise." Given correlated and heterogeneous estimates, does this norm yield a determinate recommendation? Would it resolve the collective failure?  
  c) Evaluate a governance fix: a "unilateral veto" allowing any single lab to block all deployments. Would this remove the unilateralist's curse? If not, what failure might it introduce, and on what factors does the outcome depend?  
  d) Briefly describe a mirror-image scenario where actions are *complements* (causing independent action to undershoot), and explain why a unilateral veto would be counterproductive there.  

  ---

  ### Model Answer (663 words)  

  **a) Condition for collective negative outcome and coordination failure**  
  The condition is that the *marginal harm* of an additional deployment exceeds its *marginal benefit* at the equilibrium level of aggregate action. Specifically, when many labs act (each rationally expecting positive solo value), the cumulative harm risk rises steeply due to accumulation, while marginal benefits decline due to saturation. If, at the total deployments \(N\) (where \(N\) is the number of labs with positive solo estimates), the marginal harm \(H'(N)\) > marginal benefit \(B'(N)\), the net effect is negative.  

  This is a coordination failure because:  
  - Each lab correctly calculates a positive *private* expected value when ignoring others’ actions (no individual error).  
  - Yet, by not internalizing the *negative externality* they impose on others (increased harm risk for all), labs collectively overshoot the socially optimal deployment level (where \(B'(N) = H'(N)\)).  
  - The outcome is systematically predictable from incentives, not stochastic "bad luck." Thus, it reflects a structural misalignment between individual and group rationality.  

  **b) Assessment of the epistemic endorsement norm**  
  The norm does *not* yield a determinate recommendation and may not resolve the failure.  
  - **Indeterminacy**: Labs share an "epistemic position" broadly (common evidence/correlated errors) but have heterogeneous estimates. The norm requires labs to evaluate a counterfactual: "Would I endorse universal action by all labs like me?" However, due to heterogeneity, labs disagree on whether universal action is desirable. Optimistic labs may endorse it; pessimistic ones may not. This fractures consensus.  
  - **Failure to resolve**: Even if labs compute the expected outcome of universal action, correlated optimism biases them toward overestimating benefits and underestimating harms. Thus, they might erroneously endorse universal action, leading to overshoot (the original curse). Alternatively, if labs are cautious, the norm could lead to *under-provision*: no one acts, missing the positive net value of the first few deployments. The norm merely *relocates* the failure—from decentralized over-provision to potential collective inaction—without ensuring the optimal intermediate deployment level.  

  **c) Evaluation of unilateral veto**  
  A unilateral veto *substitutes* the curse with a distinct failure mode and does not reliably resolve it.  
  - **Removal of curse?**: The veto prevents over-deployment by allowing one lab to block action, avoiding catastrophic harm accumulation. However, it does not guarantee optimal outcomes.  
  - **New failure**: The veto risks *under-provision*. If the optimal deployment is positive (e.g., 1–2 labs), a single pessimistic lab can block *all* action, forfeiting net benefits. Even if most labs support deployment, the veto empowers outliers.  
  - **Dependence**: The outcome hinges on:  
    (i) *Distribution of estimates*: If all labs share high optimism, no one vetoes, and the curse persists. If pessimists exist, deployment is blocked.  
    (ii) *Threshold effects*: If harm only manifests above a high deployment threshold, the veto may be overly conservative.  
  Thus, the veto replaces a tragedy of the commons with a "tyranny of the minority," failing when intermediate action is optimal.  

  **d) Mirror-image case for complements**  
  In the mirror-image scenario, actions are *strategic complements*: each deployment *increases* the marginal benefit of others (e.g., network effects in technology adoption). Here, independent action *undershoots*: labs refrain from acting because the solo benefit is low without others, even though universal action would yield high net benefits. This is a coordination failure where no one acts despite collective gains.  

  A unilateral veto would be counterproductive:  
  - It exacerbates undershooting by allowing a single lab to block action, preventing the critical mass needed to unlock benefits.  
  - Unlike the original curse (where veto prevents harm), here it *creates* inefficiency by cementing inaction. The remedy needed is coordinated initiation (e.g., focal points or subsidies), not a veto.  

  ---

  ### Marking Scheme (20 marks total)  
  **a) Condition and coordination failure (5 marks)**  
  - 2 marks: Correct condition (marginal harm > marginal benefit at equilibrium deployment).  
  - 3 marks: Explanation of coordination failure (emphasizing externalities, systematic predictability, no individual error).  
    *Weak answer:* Misattributes outcome to bad luck or lab error; confuses marginal/total effects.  

  **b) Epistemic norm assessment (5 marks)**  
  - 2 marks: Notes indeterminacy (heterogeneity prevents consensus) and/or persistent bias (correlated optimism).  
  - 2 marks: Evaluates relocation of failure (to under-provision) or lack of resolution.  
  - 1 mark: Explicitly states norm may not yield determinate recommendation.  
    *Weak answer:* Assumes norm forces unanimity; overlooks correlated errors.  

  **c) Veto evaluation (5 marks)**  
  - 2 marks: Identifies under-provision as new failure.  
  - 2 marks: Explains dependence on estimate distribution/threshold effects.  
  - 1 mark: Notes veto may not eliminate curse (e.g., if all labs are optimistic).  
    *Weak answer:* Claims veto "solves" curse; ignores intermediate optimum.  

  **d) Mirror-image case (5 marks)**  
  - 3 marks: Describes complementarity scenario (undershooting due to low solo benefit).  
  - 2 marks: Explains why veto worsens outcome (blocks beneficial coordination).  
    *Weak answer:* Fails to contrast overshoot/undershoot; suggests veto as fix.  

  **Grading Standard**  
  - **A (17–20 marks)**: Clear, precise answers to all parts. Explicitly distinguishes marginal effects, externalities, and equilibrium concepts. Recognizes nuances (e.g., veto trade-offs, norm indeterminacy). Mirror-image contrast is cogent.  
  - **B (14–16 marks)**: Solid but less nuanced. Minor gaps (e.g., vague on "epistemic position," underdeveloped externality explanation). Mirror-image scenario described but weakly justified.  
  - **C (10–13 marks)**: Superficial. Key errors (e.g., misstates condition in (a); omits externality; assumes veto solves curse). Mirror-image unclear.  
  - **D (7–9 marks)**: Incomplete or confused. Major omissions (e.g., no marginal analysis; misses coordination failure).  
  - **F (0–6 marks)**: Minimal understanding. Fails to engage with structure.
