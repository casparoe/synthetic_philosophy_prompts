  For each cell, I'll need to show how three ethical frameworks would analyze it: total utilitarianism, lexical priority/anti-aggregation, and threshold/de minimis views. Crucially, the analysis must derive naturally from each theory's principles rather than being stipulated. The key insight will come from observing which cells cause intuition flips - does perceptibility or scale drive the anti-aggregation view?

