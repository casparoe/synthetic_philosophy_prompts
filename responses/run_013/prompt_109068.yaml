prompt: |-
  I'm in a metaphysics reading group and there is a move that keeps recurring, and I have started to suspect that it is a specific thing with a specific name that I simply do not know. Here is the pattern. Someone proposes an answer to the question of when several things add up to a single thing — for instance, "when they are in contact", or "when together they do something that none of them does alone", or "always, however scattered". Someone else objects that the proposed line is arbitrary: it draws a boundary where nothing in the world marks one. The proposer concedes that no criterion could avoid drawing a boundary somewhere, and concludes that the charge of arbitrariness therefore has no force, since every answer must stop somewhere and so none can be faulted merely for stopping. So far, so deflationary. But then the very same people go on arguing as though their criterion were the correct one and the others simply mistaken: they press objections, they write up replies, they speak of getting it right. And when you push them, they say that they are not claiming their answer is privileged, only that it is the most useful, or the one that best fits our ordinary practices.

  What I cannot decide is whether this is a coherent position, an unstable halfway house, or an instance of something well known under a name I lack. Is there an established term for the stance — a view that the question has no answer privileged over its rivals, held by people who nevertheless continue to treat one answer as privileged? And how does it relate to, and differ from, the nearest neighbours I can think of: the claim that the whole dispute is merely verbal; straight relativism about the question; and quietism, which I take to be the recommendation that we stop asking? I do not want the label for its own sake. I want to know what to call the thing, where its edges are — whether it is a stable position, a self-undermining one, or a disguise for ordinary partisanship — and which of the neighbours, if any, it actually turns out to be. If nothing established fits, then coin a term, define it, and tell me which cases fall inside it and which outside.
reasoning: |-
  Okay, the user is part of a metaphysics reading group and has noticed a recurring pattern in discussions. The pattern involves someone proposing a criterion for when several things compose a single object, facing objections about arbitrariness, conceding that any criterion must draw a boundary somewhere, but then continuing to argue as if their criterion is correct. The user wants to know if there's a name for this stance, whether it's coherent, and how it relates to concepts like verbal disputes, relativism, and quietism.

  First, I need to parse the core issue. The key elements are: proposing a composition criterion, deflecting arbitrariness by pointing to necessary boundaries, then acting as if their criterion is privileged while denying that privilege exists. The user suspects this might be a known position but hasn't found a term for it. They want clarity on its coherence and relation to neighboring concepts.

  Looking at metaphysical frameworks, this seems to touch on debates in mereology, especially the Special Composition Question (SCQ). Positions like universalism, nihilism, and various moderate views come into play. The pattern described involves a moderate view that accepts some arbitrariness but still defends a specific criterion as pragmatically superior.

  The user's description reminds me of positions that blend realism with pragmatism. The philosopher's move here is to acknowledge that any boundary might be arbitrary in an absolute sense, yet insist that their criterion isn't arbitrary because it's grounded in usefulness or convention. This seems like a form of pragmatic realism or conventionalism, but with a twist: they deny privileging their view while acting as if it's correct.

  Possible terms come to mind. "Moderate realism" in mereology might fit, but it's broad. "Pragmatic conventionalism" could work, but needs refinement. The key is the tension between denying privilege and acting privileged. The term "conventionalist essentialism" might capture this—treating conventions as essential for discourse while recognizing their contingency.

  Assessing coherence: Is this a stable position? It might be if consistently framed as pragmatic rather than metaphysical. But the user observes participants slipping into realist language, which creates instability. This inconsistency suggests it's either an unstable position or disguised partisanship. 

  Relating to neighboring concepts: 
  - Verbal disputes: Here, the stance denies the dispute is merely verbal, since criteria have practical consequences.
  - Relativism: They reject relativism by advocating for one criterion's superiority.
  - Quietism: They engage actively, rejecting the idea that we should stop asking the question.

  The position seems closest to a pragmatic conventionalism that avoids full-blown relativism. However, the inconsistency in behavior—denying privilege while acting privileged—points to a need for clearer methodological discipline. Philosophers like Carnap (with frameworks) or Putnam (conceptual relativity) might offer parallels, but the group's behavior shows a lack of meta-awareness.

  The user might need a term that highlights this specific behavior. "Deflationary realism" or "pragmatic essentialism" could work. But to be precise, "conventionalist realism" emphasizes treating conventions as real for practical purposes. 

  In conclusion, the position is a form of moderate mereology combined with pragmatic conventionalism. It's coherent if consistently maintained, but unstable when participants revert to realist rhetoric. The user should note this tension and perhaps call it "conventionalist essentialism" to capture the behavior of treating pragmatic choices as essential.
answer: |-
  This is a brilliantly observed pattern in metaphysical methodology, and you're right to detect a specific (though often unnamed) stance at work. The position you describe is a recognizable hybrid, but it's **unstable** and frequently functions as **disguised partisanship** rather than a coherent, self-aware meta-philosophy. Here's the breakdown:

  1.  **The Stance: "Deflationary Pragmatism with Residual Realism" (or "Conventionalist Essentialism")**
      *   **Core Move:** Acknowledges the *metaphysical underdetermination* or *indeterminacy* of composition criteria (i.e., no uniquely "carved at the joints" answer exists). Concedes that *any* criterion (including nihilism or universalism) involves drawing a boundary not mandated by fundamental reality. Therefore, the charge of "arbitrariness" against *any specific criterion* is defanged *in its strong metaphysical sense* – no criterion avoids arbitrariness entirely.
      *   **The Pivot:** Immediately shifts ground to *pragmatic/conventional justification*. Argues their chosen criterion is superior *not* because it tracks mind-independent reality, but because it is:
          *   **Most Useful:** For science, engineering, everyday action, explanation (e.g., "Calling a bicycle one thing is pragmatically indispensable for mechanics").
          *   **Fits Our Practices:** Best aligns with our linguistic intuitions, conceptual schemes, or "folk ontology" (e.g., "We *do* talk about mountains and clouds as single things").
      *   **The Contradiction:** Despite grounding justification solely in pragmatics/convention, proponents argue *as if* their criterion reveals a truth about when composition *really* occurs. They defend it against alternatives *not* merely as less useful/conventional, but as *incorrect*. They employ classic metaphysical argumentation (thought experiments, counterexamples, appeals to intuition) aimed at revealing *how the world is*, not just *what's useful*.

  2.  **Is it Coherent?**
      *   **Superficially:** Yes, if strictly adhered to. One *could* consistently hold: "There is no metaphysically privileged answer to the SCQ. However, criterion C is overwhelmingly the most pragmatically useful/conventional for beings like us. Therefore, within our conceptual framework, C is the *correct* standard to employ, and alternatives lead to practical/conceptual absurdities."
      *   **In Practice (as you observe):** **No, it's unstable.** The slippage is almost inevitable. The fervor of argumentation ("pressing objections," "writing replies," "getting it right") betrays a deeper commitment. The tools of metaphysics (counterexamples, necessity, possibility) are designed to probe *reality*, not just utility. When they say "universalism leads to absurd consequences," they rarely mean *only* "it's inconvenient," but often imply "*it gets the world wrong*." This is **residual realism** creeping back in. The stance becomes a **disguise**: it uses the deflationary concession to shield against the "arbitrariness" charge while covertly reinstating realism about their preferred criterion.

  3.  **Relationship to Neighbors:**
      *   **Merely Verbal Dispute:** **Rejects this.** Deflationary Pragmatists argue the choice *matters* practically and conceptually. Different criteria genuinely imply different inventories of objects, leading to different explanations and predictions (e.g., a statue/lump theorist vs. a universalist will describe the same situation differently with potentially different consequences for persistence, identity, and causation). They think the dispute has substance, just not *fundamental metaphysical* substance.
      *   **Straight Relativism:** **Rejects this.** They aren't saying "C is true *for me*, D is true *for you*." They argue their criterion (C) is *objectively* the most useful or conventional *for beings like us in a world like this*. They believe alternatives are *objectively worse* pragmatically, leading to inefficiency, confusion, or explanatory failure. There's an implicit appeal to an objective standard of pragmatic/conceptual adequacy.
      *   **Quietism:** **Rejects this.** They actively engage in the debate! They believe the SCQ *is* worth asking and answering, precisely *because* the answer has profound pragmatic/conceptual significance. Quietism would say "Stop asking, it's a pseudo-problem." Deflationary Pragmatists say "Ask away, but understand the *nature* of the answer – it's pragmatic/conventional, not bedrock metaphysical."

  4.  **The Coinage: "Conventionalist Essentialism"**
      *   **Definition:** The stance that while no composition criterion is metaphysically privileged, a specific criterion (C) is *conventionally essential* – meaning it is indispensable, non-arbitrary, and uniquely correct *within* the framework of our indispensable practices, language, and conceptual schemes. Arguments *for* C are framed as revealing the necessity of this convention for coherent thought/action, often blurring the line between pragmatic indispensability and metaphysical truth.
      *   **Inside:**
          *   Defending contact, fastening, or functional unity as the composition criterion based on its necessity for engineering, biology, or everyday discourse, while conceding no fundamental metaphysical boundary exists, yet arguing against rivals as if they are *wrong* (not just inconvenient).
          *   Insisting that nihilism or universalism leads to "absurdities" understood as practical/conceptual breakdowns *so severe* they imply the criterion is fundamentally flawed.
          *   Treating "ordinary objects" as ontologically significant *because* of their role in our language/practices, despite lacking fundamental metaphysical privilege.
      *   **Outside:**
          *   **Robust Realism:** Believes one criterion (e.g., functional unity) *does* track a mind-independent metaphysical joint.
          *   **Strict Conventionalism/Relativism:** Holds that *any* consistent criterion is equally valid depending on context/purpose; denies objective pragmatic superiority to any one.
          *   **Verbalism:** Believes the dispute *only* concerns word meanings, with no implications for how we describe the world or act within it.
          *   **Genuine Quietism:** Believes the SCQ is fundamentally misguided and should be abandoned.
          *   **Eliminativism/Nihilism/Universalism argued robustly:** Positions defended *without* the deflationary concession, claiming metaphysical truth.

  5.  **Why it Happens & The Self-Undermining Risk:**
      *   **Motivation:** Metaphysicians crave substantive answers. Deflationism (acknowledging indeterminacy) feels unsatisfying. Pragmatism offers a way to salvage a "correct" answer without robust realism. It's an attempt to have the cake (acknowledge the meta-problem) and eat it too (keep arguing for a specific answer).
      *   **Self-Undermining:** When proponents slip back into realist argumentation ("Your criterion gets it *wrong*!"), they implicitly contradict their deflationary premise. If no criterion is metaphysically privileged, then arguing that rival criterion D is "wrong" *in the same way* they argued *their* criterion wasn't metaphysically privileged becomes incoherent. They can only consistently say D is *less useful or less conventional*. The intensity of their partisan defense often reveals that the deflationary concession is more rhetorical armor than deeply held conviction.

  **Conclusion:** The stance is best labeled **Conventionalist Essentialism**. It's an **unstable hybrid** between deflationary metaontology and first-order metaphysical argumentation. While potentially coherent in principle if rigorously policed (focusing *only* on pragmatic/conventional superiority and the dangers of abandoning the convention), in practice, the gravitational pull of realism is strong. The fervent defense against rivals often betrays a **residual realism** or functions as **disguised partisanship**, using the deflationary concession strategically to deflect criticism while reinstating a form of privilege for their preferred criterion through the back door of "indispensability." It differs from its neighbors by rejecting both metaphysical privilege *and* quietism/relativism/verbalism, aiming instead for a pragmatically grounded "essential convention." Its instability lies in the constant temptation to treat this convention as revealing more than mere usefulness.
