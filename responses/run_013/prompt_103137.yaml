  His strongest objection would target the very notion of "possible worlds" in Solomonoff. For Leibniz, possibilities aren't just computable structures; they're ideas in God's mind filtered through goodness. A "malign simulation" scenario might not even qualify as genuinely possible under PSR. 

  But where would Leibniz admit uncertainty? Probably around the math itself. The concrete mechanics of Kolmogorov complexity and how optimization plays out computationally might stump him. Also, the raw scale of suffering in some priors could challenge his theodicy - though he'd likely double down on deeper harmony.

