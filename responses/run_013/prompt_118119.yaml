prompt: |-
  So I've been going through a bit of a thing lately. I turned 40 in March, my dad had a health scare, and I took a month off work for the first time since I was like 22. I spent alot of it reading — specifically Keynes's essay about economic possibilities for our grandchildren, and his memoir about his early beliefs. Now I can't stop thinking about what a good life actually is, and I'm realizing my gut has opinions that don't obviously fit together.

  I'm not a philosopher, so I'm just going by gut. Here's what I think about some people I know:

  - My friend M works 70 hours a week as a corporate lawyer. He hates the work. He makes a lot of money and spends it on nice things and expensive vacations. Not living well.
  - My cousin R works 15 hours a week at a coffee shop. He gets by. He spends most of his free time playing video games and watching TV. Not living well.
  - My old roommate S is a doctor. She works 60 hours a week, finds the work deeply meaningful, but has almost no time for friends, rest, or hobbies. She says she's living well. I think: not living well, even though I admire her.
  - My neighbor T works 30 hours a week at a job he finds moderately interesting. He has time for his family, plays guitar badly, reads a lot, lives modestly. Living well.
  - My aunt L inherited enough money to never work. She spends her time doing charity work and painting. Living well.
  - My uncle K also inherited enough to never work. He spends his time traveling and buying expensive things. Not living well.
  - My friend P is a poet. She's poor and anxious about money, but her poetry is beautiful and she feels called to it. Not living well, even though I think her poetry matters.
  - My former boss D took a boring, secure job. He's content, has hobbies and a family, doesn't care about the work. Living well.
  - My friend N is a successful financier. He loves the game of making money, and he gives most of it away. I think: living well? But Keynes would say the love of money is a disease. I'm definately unsure about this one.

  The thing that's bugging me is that S (meaningful 60-hour doctor) and T (moderately interesting 30-hour job) look like they should get the same verdict, but they don't. And P (poor poet) vs. L (rich charity worker) also feels like a problem: both are doing intrinsically valuable things, but one is living well and the other isn't, and the difference seems to be money. And R (video games) vs. T (guitar and reading) — both have lots of free time and modest means, but I want to say one is living well and the other isn't. So what's the principle?

  I'd like you to give me:

  1. The principle — state the principle (or a small set of candidates) that best captures my verdicts, as plainly as you can. ~120 words.
  2. Your verdict on each case — go through each of my cases and say what your principle implies, and where it conflicts with my gut. ~400 words.
  3. Keynes, agree and clash — say where Keynes's view agrees with this principle and where it clashes. I know he thought we'd work something like 15 hours a week once the economic problem was solved, and that the real challenge would be learning to use leisure well; he thought we'd stop treating avarice, usury, and precaution as gods, and that the love of money would be recognized as a disease; and in his early memoir he said the ultimate goods were certain states of mind, like love and aesthetic enjoyment and knowledge. Does his view actually capture what I'm calling a good life, or does it miss something? ~250 words.
  4. A new case — give me a case I didn't list that your principle makes a prediction about. ~100 words.
  5. What I should give up — tell me which of my gut reactions I should give up, and why. ~150 words.
