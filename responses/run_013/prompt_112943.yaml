prompt: |-
  Some years ago a man I never met left his estate to a small charitable trust with a single condition attached: that the money be spent on abolishing suffering. Not on relieving it, or on making it more bearable, but on abolishing it — using whatever technology would do the job — and not for human beings alone but for every creature that can feel anything, including animals on farms and animals in the wild. I am one of three trustees. We meet four times a year, we have roughly £120,000 a year to give away in one-year grants, and between us we have no scientific, medical or philosophical training. The proposals arrive a fortnight before each meeting, and anything we fund has to be agreed unanimously.

  We keep having the same argument. One of us will say a project is obviously good because it takes suffering away; another will say it is a horror; and neither of us can say what the disagreement is really about, because we have no method. I have been going round in circles about it on my own for months.

  What I want from you is a procedure we can actually run: the questions to ask, in order; what would count as a good enough answer to each; the point at which the procedure comes to a stop and the answer is no; and the point at which it has to be handed back to us, because the question is one of values rather than of facts. It has to be usable by three non-specialists in a single evening, and it has to hold to the two clauses in the deed that we keep tripping over:

  (i) nothing may be funded whose purpose or principal effect is to kill the creatures whose suffering it is meant to relieve;
  (ii) nothing may be funded whose most likely eventual use is to make an existing harmful practice cheaper, or easier to defend.

  Then run the procedure you have written on three proposals that have actually come to us, and give me the results straight:

  - A laboratory wants to breed a line of farmed chickens that cannot feel pain, so that the birds can be kept in the conditions they are kept in now, with the suffering subtracted.
  - A group wants to develop a contraceptive bait for a wild mammal that lives at very high densities and, so far as anyone can tell, mostly dies young and painfully; their aim is that fewer of these animals are born, and so that there is less suffering in the world, though the species itself would dwindle.
  - A group wants to develop a stunning method that would reliably make cattle unconscious before they are killed, and to press abattoirs to adopt it; the intention is to spare the animals pain in their last minutes.

  Tell me where the procedure gives an answer I will not like — I would rather hear it than not — and where it cannot give an answer at all. I would also like to know which of its steps are really our own preferences dressed up as reasoning, so that we at least know when we are deciding rather than deducing.

  Please do not give me a reading list, references or suggestions for further study; I will not follow them up, and what I need is the procedure itself. Write the whole answer in British English.
reasoning: |-
  Hmm, the user describes being a trustee for a charitable trust with a unique mandate: to abolish suffering for all sentient creatures, not just humans. They have £120,000 annually for grants and face challenges evaluating proposals due to lack of scientific or philosophical expertise. The trust deed has two critical clauses prohibiting funding that either kills creatures to relieve suffering or makes harmful practices cheaper or more defensible.

  The user explicitly requests a practical, step-by-step decision procedure usable by three non-specialists in one evening. They want it applied to three real proposals: engineered pain-free chickens, wild mammal contraception, and cattle stunning technology. The procedure must flag when decisions depend on value judgments versus factual analysis and must adhere strictly to the two clauses.

  Key requirements for the procedure include:
  - Sequential questions with clear pass/fail thresholds
  - Identification of value-based decision points
  - Efficiency for single-evening use by laypersons
  - Explicit handling of the two deed clauses

  The three test cases present distinct ethical tensions:
  1. Pain-free chickens: Might perpetuate factory farming despite reducing individual suffering
  2. Wild contraception: Reduces population but involves wild animal welfare trade-offs
  3. Cattle stunning: Improves slaughter but potentially reinforces meat industry

  The user acknowledges anticipating unfavorable outcomes but prioritizes transparency. The emotional tone suggests frustration with recurring deadlocks and desire for actionable clarity. Their rejection of supplementary materials indicates need for self-contained practicality.

  The procedure must delineate where trustees' values necessarily intervene—particularly around whether reducing suffering justifies perpetuating harmful systems (chickens), whether preventing existence constitutes abolition (contraception), and whether incremental improvement aligns with absolute abolition (stunning).

  For framework design, I'll consider a branching flowchart style with:
  - Initial factual filters (feasibility, clause compliance)
  - Suffering impact assessment
  - Secondary consequence evaluation
  - Explicit value-judgment checkpoints
  - Unanimity requirement built into final steps

  The British English requirement means using UK spellings and terminology throughout.
answer: |-
  Below is a step-by-step decision procedure designed for your trust. It follows a strict sequence of questions to evaluate proposals against your mandate and deed clauses. The procedure is structured to be completed in one evening by non-specialists, with clear "stop" points and flags for value-based decisions. It prioritises factual analysis first, reserving ethical judgments until necessary.  

  **Trust Decision Procedure**  
  *(To be followed in order; all trustees must agree at each step)*  

  1. **Feasibility Check**  
     *Question:* Is there credible evidence (e.g., pilot data, expert endorsements) that the proposed method can achieve its stated goal?  
     *Pass:* Independent scientific review or preliminary data supports success likelihood.  
     *Fail:* No verifiable evidence; relies on speculation.  
     *Stop if fail:* Reject. *Reason:* Resources cannot be wasted on implausible solutions.  

  2. **Direct Suffering Reduction**  
     *Question:* Will the proposal directly abolish suffering (not merely relieve or displace it) for sentient creatures?  
     *Pass:* Suffering is prevented at the source (e.g., removing capacity for pain, preventing painful lives).  
     *Fail:* Only mitigates or manages suffering after it occurs.  
     *Stop if fail:* Reject. *Reason:* Contravenes core mandate ("abolish not relieve").  

  3. **Clause (i) Test: No Killing to Relieve**  
     *Question:* Does the proposal require or incentivise killing as the primary means to abolish suffering?  
     *Pass:* Suffering is abolished without euthanasia/culling (e.g., pain-blocking, birth prevention).  
     *Fail:* Killing is integral to the method (e.g., "humane extermination").  
     *Stop if fail:* Reject. *Reason:* Explicitly barred by deed.  

  4. **Clause (ii) Test: No Enabling Harm**  
     *Question:* Could the most likely real-world application make a harmful practice (e.g., factory farming, habitat destruction) cheaper, more efficient, or ethically defensible?  
     *Pass:* Harmful systems are not reinforced; may even be undermined.  
     *Fail:* Likely to entrench or expand harmful practices (e.g., by reducing costs or public opposition).  
     *Stop if fail:* Reject. *Reason:* Explicitly barred by deed.  

  5. **Scale and Scope**  
     *Question:* Is the suffering abolished likely to be significant in scale (number of individuals) and severity (intensity/duration of suffering prevented)?  
     *Pass:* Targets severe, widespread suffering with high efficacy.  
     *Fail:* Impact is marginal, isolated, or speculative.  
     *Stop if fail:* Reject. *Reason:* Fails cost-benefit threshold for limited funds.  

  6. **Value Judgment Gateway**  
     *Question:* Does the proposal force a choice between competing ethical principles? (e.g., abolition vs. ecological integrity, individual welfare vs. species preservation).  
     *Pass:* No conflict; aligns clearly with abolition mandate.  
     *Fail:* Involves unavoidable trade-offs (e.g., reducing suffering by preventing existence).  
     *Hand back if fail:* Trustees must debate and decide unanimously. *Reason:* This is values-based, not factual.  

  7. **Final Approval**  
     *Question:* Considering all steps, does the proposal advance the abolition of suffering without violating clauses or creating unacceptable trade-offs?  
     *Pass:* Unanimous agreement.  
     *Fail:* Any trustee objects.  
     *Stop if fail:* Reject.  

  ---  
  **Application to Your Proposals**  
  *(Using the procedure above)*  

  **Proposal 1: Pain-Free Chickens**  
  - **Step 1 (Feasibility):** Pass. Genetic engineering to eliminate pain is scientifically plausible.  
  - **Step 2 (Direct Reduction):** Pass. Suffering (pain) is abolished at source.  
  - **Step 3 (Clause i):** Pass. Does not involve killing.  
  - **Step 4 (Clause ii):** **FAIL.** Most likely use makes factory farming cheaper and more defensible ("we can keep birds in cramped conditions guilt-free").  
  - **Stop:** Reject. *Result you may dislike:* The procedure blocks this, as it enables harmful systems.  

  **Proposal 2: Wild Mammal Contraception**  
  - **Step 1 (Feasibility):** Pass. Contraceptive baits are proven in similar species.  
  - **Step 2 (Direct Reduction):** Pass. Prevents painful lives (starvation, predation) by reducing births.  
  - **Step 3 (Clause i):** Pass. Avoids killing; prevents existence of suffering beings.  
  - **Step 4 (Clause ii):** Pass. Does not enable harmful human practices (targets wild suffering).  
  - **Step 5 (Scale):** Pass. High-density mammals imply significant suffering reduction.  
  - **Step 6 (Value Judgment):** **FAIL.** Forces trade-off: reducing suffering vs. "natural" species decline.  
  - **Hand back:** Trustees must decide: Does "abolishing suffering" justify dwindling a species? *No procedural answer.*  

  **Proposal 3: Cattle Stunning**  
  - **Step 1 (Feasibility):** Pass. Reliable stunning methods exist.  
  - **Step 2 (Direct Reduction):** **FAIL.** Only relieves (last-minute) suffering; does not abolish the core suffering of rearing/slaughter.  
  - **Stop:** Reject. *Result you may dislike:* The procedure blocks this as "relief not abolition."  

  ---  
  **Key Insights from the Procedure**  
  1. **Steps where values masquerade as reasoning:**  
     - **Step 6 (Value Judgment Gateway)** is explicitly your preference. The procedure flags but cannot resolve "is preventing existence abolition?" or "is interfering with nature justified?"  
     - **Step 4 (Clause ii)** involves implicit values: Defining "harmful practice" requires trustees to judge what is intrinsically harmful (e.g., is farming inherently harmful?).  

  2. **Where the procedure cannot decide:**  
     - When trade-offs arise (Step 6), e.g., the mammal contraception proposal. You must debate: Is reducing wild suffering by preventing births "abolition"?  

  3. **Efficiency:**  
     - Steps 1–5 filter purely factual issues. Steps 6–7 focus debate on values/unanimity, saving time.  
     - Rejects 2/3 proposals early (Chickens at Step 4; Cattle at Step 2), leaving only one for value deliberation.  

  This procedure enforces discipline: it starts with science, tests deed clauses rigidly, and isolates value conflicts. It ensures you only debate what truly matters—your definition of "abolition"—when facts alone cannot decide.
