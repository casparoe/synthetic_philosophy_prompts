answer: |-
  Here is a draft proposal reflecting your specifications:

  This project addresses a persistent puzzle in the study of moral revolutions: the rapid collapse of deeply entrenched norms like aristocratic dueling, Atlantic slavery, and footbinding. The scholarly debate is typically structured as a contest among three rival explanations. The first credits moral argumentation with changing core beliefs about what is permissible. The second emphasizes shifts in material interests, suggesting that abolition or reform became economically or politically advantageous. The third, focusing on honor and shame, contends that change occurred when the practice became seen as contemptible or beneath the dignity of respectable people, irrespective of abstract moral beliefs or interests – dueling died not because it was deemed wrong, but because it became unmanly. While each account offers insights, the debate often stalls because proponents present their favored factor as a sufficient explanation for the *entire* phenomenon of collapse – its possibility, timing, and durability – without clear criteria for adjudicating between them. This leads to a frustrating impasse where every historical case seems ambiguously susceptible to all three interpretations.

  My central hypothesis is that this impasse arises partly because these three factors are not necessarily rivals answering the *same* question about norm collapse. Instead, they may perform distinct explanatory functions: one factor might primarily explain why collapse became *possible* (e.g., shifting underlying conditions), another why it happened at a specific *time* (e.g., a triggering event or reaching a critical threshold), and a third why the new norm proved *durable* once established. The core research question, therefore, is: **Can the factors of moral argument, material interest, and honor/shame be systematically distinguished as explanations for the possibility, timing, and durability of a moral revolution, respectively, and if so, what criterion reliably assigns explanatory weight to each factor in specific historical cases?** A correct and useful answer would provide a clear conceptual framework that successfully parses these distinct explanatory roles across varied cases and supplies a testable criterion (like a specific counterfactual) for determining which factor bears primary weight for each aspect (possibility, timing, durability) in a given instance. Crucially, it must also identify the features of a case that determine *when* honor/shame functions as a distinct driver of change rather than merely reinforcing arguments or interests.

  The existing literature leaves this question open precisely because it treats the three factors as competitors for the same explanatory prize – the *cause* of the revolution. Consequently, proponents rarely specify what decisive evidence would favor their account *over* the others for the *same* explanatory target, nor do they consistently delineate *which aspect* of the revolution (its possibility, timing, or durability) their factor best explains. This results in the "horse race" dynamic you describe, where interpretations proliferate without resolution. This project aims to break this deadlock by explicitly disaggregating the explanandum.

  The methodology will be primarily conceptual analysis, developing the framework to distinguish the three explanatory slots and formulate a criterion for assigning weight. This framework must integrate two underutilized concepts: first, preference falsification, which highlights how public conformity can mask private dissent and potentially drive sudden shifts when the facade crumbles, complicating the "argument" story by suggesting conduct can change belief; and second, threshold models of norm cascades and the civilizing process, which help explain the abruptness of collapse. Furthermore, the framework will rigorously distinguish between the *content* of a norm (what is believed right/wrong) and its *enforcement mechanisms* (like honor/shame). This is vital for testing the honor account: if honor/shame functions primarily as enforcement, an honor-driven "revolution" might change behavior profoundly without altering underlying moral judgments. Evidence for this would be the persistence of private regret or justification for the old norm after its public demise.

  This conceptual work will be tested and refined through focused case studies, selected for their contrasting emphases: British dueling (strong on honor/shame, weak on obvious interest shifts), British abolition (the classic interest-driven case), footbinding (complex interplay), and honor killings as a crucial control case – a norm exhibiting similar honor dynamics that has *not* undergone widespread collapse. The control case is essential; if the framework cannot convincingly explain why honor killings persist while the others collapsed, it fails. Analyzing these cases will rely on established secondary sources and primary materials accessible in English translation where necessary. This approach – conceptual framework development followed by case application – is feasible within nine months for a researcher without extensive archival access or multiple languages, allowing deep engagement with the arguments and existing historiography rather than new archival discovery. The case studies serve to probe, illustrate, and refine the framework, not to generate novel historical facts.

  The central criterion for assigning explanatory weight will be counterfactual: for a given aspect (possibility, timing, durability), holding the other two factors fixed as they were historically, would the outcome (collapse or persistence) still have occurred? If removing or significantly altering factor X means the outcome likely wouldn't have happened (or happened differently) for that specific aspect, then X bears significant weight. However, applying such counterfactuals to historical cases based on common knowledge is inherently speculative. We must acknowledge this limitation and settle for a weaker, but still valuable, criterion: the *relative plausibility* of the counterfactual scenarios based on the best available evidence and logical coherence. Does the historical record make it more plausible that, say, without the specific honor dynamics, the norm would have collapsed at a different time or not endured, even if interest shifts made it possible? This demands careful historical reasoning within the framework.

  The project would be undermined if the three proposed explanatory slots consistently collapse into each other upon scrutiny (e.g., if honor always reduces to a form of interest or merely reflects changed moral beliefs), rendering the distinction empty. Failure would also occur if the counterfactual criterion proves impossible to apply with even minimal plausibility across all cases, leading inevitably to the conclusion that all three factors were merely "necessary conditions" contributing indistinguishably. If the nine-month timeframe proves insufficient, the most complex case, likely footbinding, would be dropped to ensure robust analysis of the core framework, the honor/interest contrast cases (dueling and abolition), and the critical control case (honor killings).

  The primary deliverable will be a substantial framework paper articulating the tripartite distinction (possibility/timing/durability), integrating preference falsification, threshold models, and the norm/enforcement split, establishing the counterfactual/plausibility criterion, and demonstrating its application briefly across the cases to show its viability. This will be supplemented by at least two detailed case studies (e.g., dueling and the honor killings control, or abolition and dueling) providing deeper historical analysis using the framework. For historians skeptical of philosophical frameworks, the value lies not in imposing theory onto history, but in providing sharper diagnostic tools. A successful outcome would offer historians a clearer way to parse complex causal narratives, identify what specific question a given factor answers, assess which factor was decisive for which aspect of change, and crucially, explain not just why some norms collapsed, but why structurally similar ones persist. The framework should illuminate the cases, not obscure them, by making the logic of explanation more explicit and testable.

  This proposal outlines a focused, theoretically ambitious, yet feasible project that directly confronts a methodological stalemate in understanding moral revolutions, offering a novel synthesis and a path towards more nuanced historical explanations.
