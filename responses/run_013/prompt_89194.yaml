answer: |-
  ## Exam Question (20 marks; answer in ~90 minutes)

  **Scenario:** A university research consortium operates a shared high-performance computing (HPC) cluster. Member labs collectively receive one annual allocation of compute hours. Technically, no lab can be locked out of accessing the cluster, and there are no pre-set per-lab usage caps. During off-peak times (e.g., nights, weekends), one lab's jobs run without slowing down jobs from other labs. During peak times (e.g., weekdays, semester ends), submitted jobs enter a queue; jobs from one lab delay jobs from others, and some labs critically depend on fast turnaround for time-sensitive research. The annual compute-hour allocation is funded by voluntary financial contributions from member labs. Additionally, two of the larger labs independently maintain and upgrade the shared software environment (operating system, libraries, schedulers) that all users rely on.

  **Question:** Analyse this scenario as a problem of collective action.

  1.  **Diagnosis:** Identify the core collective action problem(s) present. Is the problem primarily one of *provision* (supplying/contributing to the resource) or *appropriation* (using/consuming the resource), or both? Explain the characteristics (rivalry, excludability) of the *compute resource* and how these characteristics change depending on cluster load (peak vs. off-peak). (4 marks)
  2.  **Strategic Structure:** State the strategic structure of the potential over-*use* problem during peak times. What assumptions about payoffs make non-cooperative over-use a dominant strategy equilibrium (akin to a prisoner's dilemma)? Identify a specific change to the payoffs (e.g., a change in costs, benefits, or rules) that could transform the peak-time use problem into a coordination problem (e.g., stag hunt) with a cooperative equilibrium as a possible outcome. (6 marks)
  3.  **Ownership & Tragedy:** Explain why shared ownership (or open access) of a resource is neither a necessary nor a sufficient condition for a "tragedy of the commons" outcome. Provide one clear hypothetical or theoretical example where shared ownership leads to sustainable use (not tragedy), and one where private/individual ownership leads to overuse or degradation (tragedy). (4 marks)
  4.  **Remedies:** Assess the following three proposed remedies for the problems identified in this scenario. For each, state what core problem(s) it primarily addresses effectively and what significant problem(s) or challenge(s) it likely fails to address or even exacerbates:
      *   (a) Assigning private, tradable compute-hour quotas to each lab.
      *   (b) Implementing a real-time congestion pricing system (higher cost per compute hour during peak demand).
      *   (c) Devolving management to a user committee with authority to monitor usage, establish rules (e.g., peak-time caps), and impose graduated sanctions (e.g., warnings, temporary access restrictions) for violations. (6 marks)

  ---

  ## Model Answer (Approx. 750 words)

  This scenario presents intertwined collective action problems concerning both the *provision* and the *appropriation* of a shared resource, whose fundamental characteristics are context-dependent.

  **(1) Diagnosis:** The core problems are twofold. First, there is a **provision problem** concerning the *funding* of the annual compute-hour allocation and the *maintenance* of the shared software environment. Funding relies on voluntary contributions, creating a classic free-rider incentive: each lab benefits from the funded allocation and maintained software regardless of whether it contributes, making non-contribution individually rational but collectively suboptimal. Similarly, software maintenance by only two labs creates a public goods problem; all labs benefit from the maintained environment, but most have no incentive to contribute effort. Second, there is an **appropriation problem** concerning *usage during peak times*. The nature of the compute resource changes with load. **Off-peak**, compute hours are effectively **non-rivalrous** (one lab's job doesn't hinder another's) and **non-excludable** (no lab can be practically locked out). However, **during peak times**, the resource becomes **rivalrous** (one lab's job delays others' jobs, consuming scarce queue time/slots) while remaining **non-excludable**. This peak-time rivalry creates the potential for over-use or inefficient queuing congestion. The appropriation problem is thus conditional on demand exceeding instantaneous capacity.

  **(2) Strategic Structure:** During peak times, the appropriation problem resembles a **multi-player prisoner's dilemma (PD)**. Assume each lab gains a high benefit (B) from running its job immediately during peak times, but if many labs run jobs simultaneously, congestion occurs, imposing a high cost (C) on all (e.g., long delays). The cost to an individual lab of *restraining* its own peak usage (e.g., delaying its job) is moderate (D). If B - C < 0 (congestion costs outweigh individual benefits) and B - D > 0 (individual benefit of running now outweighs restraint cost), the dominant strategy for each lab is to submit jobs during peak times regardless of what others do. This leads to the Nash equilibrium of all submitting, resulting in congestion (high C) and net losses (B - C < 0) for all – the tragedy. A **change in payoffs** can transform this. Suppose a rule is established where labs publicly commit *not* to run during peak unless a majority also commit. Now, the payoff for *restraint* if others also restrain (avoiding congestion) becomes high (say, R), potentially higher than the payoff for *running* if others run (B - C). If the payoff for running while others restrain (temptation, T) is high, but the payoff for restraining while others run (sucker's payoff, S) is catastrophic (e.g., missing critical deadlines), and R > T > S and R > (B - C), the structure becomes a **stag hunt (coordination game)**. Here, mutual restraint (cooperation) is a Pareto-superior Nash equilibrium, though mutual defection (all running, congestion) remains another equilibrium. The challenge is coordinating on the cooperative outcome.

  **(3) Ownership & Tragedy:** Shared ownership/open access is **not sufficient** for tragedy because sustainable management is possible with effective institutions. A hypothetical example: A shared irrigation canal managed by farmers. Despite shared ownership, they establish clear rules on water allocation timings monitored by a rotating committee, with fines for overuse. This prevents over-extraction. Shared ownership is **not necessary** for tragedy because private ownership can also lead to degradation if externalities aren't internalized. An example: Privately owned forests where each owner maximizes timber harvest. If harvesting on one plot causes soil erosion damaging neighboring plots (a negative externality), and there are no mechanisms to compensate or restrain, each owner will over-harvest, degrading the entire forest area, even though each plot is privately owned. The tragedy arises from rivalry combined with the inability to exclude others from the *effects* of one's use, not solely from ownership structure.

  **(4) Remedies Assessment:**
  *   **(a) Private Tradable Quotas:** This primarily addresses the **peak-time appropriation problem** (rivalry). By capping total usage and allowing trading, it internalizes the scarcity/externality cost during peak times, promoting efficient allocation to highest-value uses. *However, it fails* to address the **provision problems**. Funding the initial allocation still relies on voluntary contributions, suffering free-riding. Maintaining the software environment remains a separate public good. Quotas also don't inherently solve congestion; if many labs use quotas simultaneously at peak, queuing delays persist.
  *   **(b) Congestion Pricing:** This directly addresses the **rivalry during peak times** by making the cost of use reflect the congestion externality. Higher prices suppress peak demand, reducing queues and delays, improving efficiency. *However, like quotas, it leaves the **provision problems untouched**.* Revenue generated could theoretically fund provision, but the mechanism itself doesn't mandate this; revenue could be distributed or used elsewhere without solving the free-rider problem for core funding or software maintenance. It also requires a technically complex and potentially contentious pricing mechanism.
  *   **(c) User Self-Governance (Ostrom-style):** This approach has the *potential* to address **both provision and appropriation problems**. A user committee could set rules for peak-time usage (solving appropriation rivalry via caps or priorities), institute contribution requirements for funding (solving the funding free-rider problem), and organize software maintenance efforts. Monitoring and graduated sanctions enforce compliance. *The critical challenges it leaves (or potentially creates)* are the demanding conditions for success: high setup/transaction costs, the need for trust and social capital among labs, potential power imbalances favouring larger labs, the difficulty of designing effective and equitable rules initially, and the ongoing costs of monitoring and enforcement. If these conditions aren't met, the system can fail or become unfair.

  In conclusion, the HPC scenario demonstrates that collective action problems are multifaceted. The resource's rivalry is contextual (load-dependent), provision and appropriation are distinct but linked challenges, ownership alone doesn't determine outcomes, and remedies have specific, often partial, scopes of effectiveness requiring careful matching to the diagnosed problems.

  ---

  ## Marking Scheme (20 marks total)

  1.  **Accurate Diagnosis of Problems & Characteristics (4 marks):**
      *   Clearly distinguishes provision (funding/maintenance) and appropriation (peak use) as separate problems (2 marks).
      *   Correctly identifies non-rivalry off-peak, rivalry at peak, and non-excludability always (1 mark). *Common Error: Treating rivalry as static/binary.*
      *   Explains how load changes rivalry (1 mark). *Common Error: Not linking load to changing rivalry.*

  2.  **Correct Strategic Structure & Transformation (6 marks):**
      *   Correctly identifies the peak-use problem as a PD-like structure (1 mark). *Common Error: Misidentifying the game (e.g., calling it chicken).*
      *   Accurately states the payoff assumptions leading to non-cooperation as dominant strategy equilibrium (e.g., B - C < 0, B - D > 0) (2 marks). *Common Error: Vague or incorrect payoff description.*
      *   Identifies a plausible change in payoffs/rules (1 mark). *Common Error: Changing the resource/scenario fundamentally instead of payoffs.*
      *   Correctly explains how this change creates a coordination game (e.g., stag hunt) with a cooperative equilibrium (2 marks). *Common Error: Assuming change automatically solves problem without specifying game shift.*

  3.  **Understanding Ownership Not Causative (4 marks):**
      *   States shared ownership is not sufficient for tragedy + provides valid example of sustainable shared resource (2 marks). *Common Error: Equating shared access with inevitable tragedy.*
      *   States shared ownership is not necessary for tragedy + provides valid example of unsustainable private resource (2 marks). *Common Error: Assuming private ownership prevents externalities/tragedy.*

  4.  **Insightful Remedy Assessment (6 marks):** (2 marks per remedy, split between identifying primary strength & key weakness/omission)
      *   **(a) Quotas:** Strength: Addresses peak rivalry/efficiency (1 mark). Weakness: Ignores provision (funding/software) (1 mark). *Common Error: Claiming quotas solve funding.*
      *   **(b) Congestion Pricing:** Strength: Addresses peak rivalry/congestion externality (1 mark). Weakness: Ignores provision (funding/software) (1 mark). *Common Error: Assuming revenue automatically funds provision.*
      *   **(c) Self-Governance:** Strength: Potential to address both provision & appropriation (1 mark). Weakness: Significant challenges (setup, trust, enforcement costs) (1 mark). *Common Error: Assuming self-governance is automatically effective or costless.*

  5.  **Clarity, Precision & Integration (Embedded):** While not a separate mark point, clarity of expression, precise use of terminology (provision, appropriation, rivalry, excludability, PD, coordination, externality), and logical flow integrating the parts are essential for high marks. Significant incoherence or misuse of core terms can detract up to 2 marks implicitly across the scheme. *Common Error: Vague language, inconsistent terminology, disjointed arguments.*

  ---

  **Note on High Marks (18-20 vs 15-17):** A 15-17 answer correctly identifies and describes the key components (problems, structures, remedies) but may lack depth in explaining *why* characteristics change or *how* payoff transformations work, or might treat remedies in isolation. An 18-20 answer demonstrates an *integrated understanding*, explicitly linking the dynamic resource characteristics to the specific problems and showing precisely why each remedy's strengths are targeted yet its limitations remain, particularly highlighting the persistent challenge of the *provision* problem outside of self-governance. It avoids oversimplification, especially regarding the demanding conditions for self-governance success.
