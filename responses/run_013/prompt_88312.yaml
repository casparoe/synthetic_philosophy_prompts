answer: |-
  ### Decision Tree: Was the Agricultural Revolution a Mistake?  
  **Instructions:** Start at the top. Answer each question based on your own view. Follow the arrows to the next question or final position.  

  ```mermaid
  graph TD
      A["Q1: Does 'mistake' require an <b>intentional agent</b>?<br>(e.g., must someone have chosen farming?)"] 
      A --> |Yes| B["Q2: Did farming spread via <b>population replacement</b>?<br>(farmers outbred/displaced foragers)"]
      A --> |No| C["Q3: Whose welfare matters most?<br>(Individual, Lineage, Species, Distribution)"]
      
      B --> |Yes| D["POSITION: <b>No Agent, No Mistake</b><br>• Awkward: Even catastrophic outcomes aren't 'mistakes' without a chooser."]
      B --> |No| C

      C --> |Individual| E["Q4: Primary currency?<br>(Health/Happiness, Freedom, Equality, Culture)"]
      C --> |Lineage| F["POSITION: <b>Lineage Success</b><br>• Awkward: Farming benefited genetic/cultural lines, even if individuals suffered."]
      C --> |Species| G["POSITION: <b>Species Success</b><br>• Awkward: Justifies population explosion despite individual costs."]
      C --> |Distribution| H["Q5: Baseline foragers?<br>(Actual, Idealized)"]

      E --> |Health/Happiness| I["Q5: Baseline foragers?<br>(Actual, Idealized)"]
      E --> |Freedom| J["POSITION: <b>Autonomy Loss</b><br>• Awkward: Prioritizes freedom over material gains (e.g., shorter work hours)."]
      E --> |Equality| K["POSITION: <b>Inequality Trap</b><br>• Awkward: Condemns farming even if average welfare rose."]
      E --> |Culture| L["POSITION: <b>Cultural Triumph</b><br>• Awkward: Trade-offs (e.g., art vs. nutrition) are justified."]

      H --> |Actual| M["POSITION: <b>Structural Inequality</b><br>• Awkward: Inequality is inherent to farming, not contingent."]
      H --> |Idealized| N["POSITION: <b>Idealized Egalitarianism</b><br>• Awkward: Romanticizes foragers while ignoring hardships."]

      I --> |Actual| O["Q6: Did health/happiness <b>decline</b>?<br>(Yes, No, Incomparable)"]
      I --> |Idealized| P["POSITION: <b>Romantic Catastrophe</b><br>• Awkward: Compares real farmers to unreal foragers."]

      O --> |Yes| Q["POSITION: <b>Biocultural Disaster</b><br>• Awkward: Must reconcile mixed archaeological evidence (e.g., regional variation)."]
      O --> |No| R["POSITION: <b>Necessary Adaptation</b><br>• Awkward: Farming was optimal given constraints (e.g., climate change)."]
      O --> |Incomparable| S["POSITION: <b>Contextual Ambiguity</b><br>• Awkward: Rejects universal judgment due to variability."]
  ```

  ---

  ### Key to Positions (Leaves)  
  1. **No Agent, No Mistake**  
     - *Trigger:* Mistake requires agent (Q1=Yes) + spread via replacement (Q2=Yes).  
     - *Awkward commitment:* Outcomes can’t be “mistakes” without a decision-maker.  

  2. **Lineage Success**  
     - *Trigger:* Welfare = Lineage (Q3=Lineage).  
     - *Awkward commitment:* Farming benefited descendants, ignoring individual suffering.  

  3. **Species Success**  
     - *Trigger:* Welfare = Species (Q3=Species).  
     - *Awkward commitment:* Ends (population growth) justify means (hierarchy/disease).  

  4. **Autonomy Loss**  
     - *Trigger:* Currency = Freedom (E=Freedom).  
     - *Awkward commitment:* Freedom outweighs gains in health/technology.  

  5. **Inequality Trap**  
     - *Trigger:* Currency = Equality (E=Equality).  
     - *Awkward commitment:* Equality matters more than absolute welfare.  

  6. **Cultural Triumph**  
     - *Trigger:* Currency = Culture (E=Culture).  
     - *Awkward commitment:* Civilizational achievements offset costs (e.g., slavery).  

  7. **Structural Inequality**  
     - *Trigger:* Welfare = Distribution (Q3=Distribution) + Baseline = Actual (Q5=Actual).  
     - *Awkward commitment:* Inequality is unavoidable in farming societies.  

  8. **Idealized Egalitarianism**  
     - *Trigger:* Welfare = Distribution (Q3=Distribution) + Baseline = Idealized (Q5=Idealized).  
     - *Awkward commitment:* Overlooks forager violence/inequality.  

  9. **Romantic Catastrophe**  
     - *Trigger:* Currency = Health/Happiness (E=Health) + Baseline = Idealized (I=Idealized).  
     - *Awkward commitment:* Contrasts flawed farmers with perfect foragers.  

  10. **Biocultural Disaster**  
      - *Trigger:* Currency = Health/Happiness (E=Health) + Baseline = Actual (I=Actual) + Decline = Yes (O=Yes).  
      - *Awkward commitment:* Must explain why farming persisted despite harms.  

  11. **Necessary Adaptation**  
      - *Trigger:* Currency = Health/Happiness (E=Health) + Baseline = Actual (I=Actual) + Decline = No (O=No).  
      - *Awkward commitment:* Farming was the best available option.  

  12. **Contextual Ambiguity**  
      - *Trigger:* Currency = Health/Happiness (E=Health) + Baseline = Actual (I=Actual) + Decline = Incomparable (O=Incomparable).  
      - *Awkward commitment:* No clear verdict due to fragmented evidence.  

  ---

  ### Notes on the Tree  
  - **Unseparated Positions:**  
    - *Biocultural Disaster* (10) and *Necessary Adaptation* (11) share the same path until Q6. They diverge only on interpretation of health evidence.  
    - *Structural Inequality* (7) and *Idealized Egalitarianism* (8) differ solely on baseline realism.  

  - **Empty/Uncommon Combinations:**  
    - *Lineage Success + Culture Currency:* Rarely defended; lineage success is typically biological, not cultural.  
    - *Species Success + Decline:* Logically possible (e.g., “farming risked extinction”) but empirically unsupported.  
    - *Autonomy + Improvement:* Few argue farming increased freedom; if held, it falls under *Other Position* (not named here).  

  - **Why 12 Leaves?**  
    Covers major stances:  
    - **Anti-farming:** Biocultural Disaster, Autonomy Loss, Inequality Trap.  
    - **Pro-farming:** Cultural Triumph, Species/Lineage Success, Necessary Adaptation.  
    - **Structural:** No Agent, Structural Inequality.  
    - **Meta:** Contextual Ambiguity, Romantic Catastrophe, Idealized Egalitarianism.  

  Use this to diagnose where your group’s arguments fit—and why they might talk past each other. Bolt on your readings (e.g., Diamond for "Biocultural Disaster," Graeber/Wengrow for "Contextual Ambiguity," Pinker for "Cultural Triumph").
