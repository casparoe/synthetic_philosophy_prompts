answer: |-
  Here's a concise decision tree focusing on concrete questions about self-amendment, designed to sort positions pragmatically without requiring prior "-isms". It fits on one page and has 8 nodes (5 questions + 3 endpoints).

  **The Self-Amendment Puzzle: Where Do You Stand?**

  Start with a system (constitution, game rules) containing:
  *   **Rule R:** "Rules can be amended by procedure P."
  *   **Rule Q (Optional):** "Rule R cannot be amended." (Some systems have this, some don't).

  **Q1: Can procedure P be used to amend Rule R itself? (Self-Amendment of R)**
  *   **No → Go to Q2**
  *   **Yes → Go to Q3**

  **Q2 (If No to Q1): Can Rule Q (forbidding amendment of R) be amended using procedure P?**
  *   **No → Position: *Immutable Core*.** Rule R (and Q, if present) are truly unchangeable within the system. Attempts to change them via P are invalid. *(Similar to entrenched clauses, presupposed norm)*
  *   **Yes → Position: *Self-Embraced via Repeal*.** While R couldn't *directly* amend itself, the prohibition (Q) was removable via P. Once Q is gone, R *can* then be amended (including self-amended) via P. The system allows full self-amendment indirectly. *(Hartian "Rule of Recognition" as practice often lands here)*

  **Q3 (If Yes to Q1): After R is amended (via P) to become R' (a new amendment rule), is R' valid?**
  *   **No → Position: *Original Authority Only*.** Only the *original* Rule R had the authority to authorize amendments. Changing R destroyed the source of validity for *all* subsequent amendments made under R' or later rules. The system is brittle. *(Rare, often tied to originalist theories)*
  *   **Yes → Go to Q4**

  **Q4 (If R' is Valid): Can the *new* rule R' also be amended (possibly changing P again)?**
  *   **No → Position: *Procedural Freeze*.** Self-amendment happened once (R→R'), but that new rule R' is now immutable. Further changes to the amendment rule are blocked. *(Uncommon; why allow one change but not more?)*
  *   **Yes → Position: *Self-Embracing Sovereignty*.** The amendment power is inherently flexible. Any current amendment rule (R, R', R''...) validly enacted can amend *itself* or be replaced, creating a new valid rule. There was never a true paradox; the authority embraces change. *(Common in practice - UK Parliament, Nomic gameplay)*

  **Q5 (If R' is Valid AND R' can be amended): Is there any logical limit to the content of valid amendments? (e.g., Could a valid amendment abolish all rules, or declare contradictions true?)**
  *   **No → Position: *Absolute Proceduralism*.** Validity is purely about following the current procedure (P, P', etc.). Any content, no matter how contradictory or system-destroying, is valid if enacted correctly. The system is purely defined by its mutable procedures. *(Radical positivism, some Nomic interpretations)*
  *   **Yes → Position: *Constraint Recognition*.** Even validly enacted amendments (using the correct P) cannot do certain things (e.g., create genuine logical contradictions, destroy the foundational basis for *any* rule recognition) without destroying the system's coherence or identity. Some implicit/logical limits exist. *(Kelsen's "Basic Norm" as presupposed limit, Dworkinian integrity concerns)*

  **Leaves & Notes:**

  1.  **Immutable Core:** (Q2 → No) Named. Assumes a non-amendable foundation.
  2.  **Self-Embraced via Repeal:** (Q2 → Yes) Named (Implies Hart). Requires a two-step process.
  3.  **Original Authority Only:** (Q3 → No) Named (e.g., "Original Rule Paradox"). **Uninhabited?** Logically coherent but practically unstable/unattractive – it makes the system unable to evolve safely. Rarely defended seriously outside specific originalist arguments.
  4.  **Procedural Freeze:** (Q4 → No) **Unnamed & Uninhabited.** Logically possible but arbitrary and unattractive. Why allow one self-amendment but not another? No major theory occupies this niche.
  5.  **Self-Embracing Sovereignty:** (Q4 → Yes) Named. Common practical view (Hartian practice).
  6.  **Absolute Proceduralism:** (Q5 → No) Named. Coherent but extreme; allows system suicide.
  7.  **Constraint Recognition:** (Q5 → Yes) Named (Kelsenian/Dworkinian flavors). Acknowledges logical/systemic limits beyond procedure.

  **Uninhabited Branches & Why:**
  *   **Procedural Freeze (Q4 → No):** Coherent but deeply unattractive and arbitrary. It offers no principled reason why self-amendment is allowed exactly once. No significant theory argues for this.
  *   **Original Authority Only (Q3 → No):** Coherent but practically devastating (invalidates all post-change rules). Primarily a theoretical foil; few argue a real legal system instantly becomes wholly invalid upon changing its amendment clause. Unattractive for maintaining system continuity.

  **Positions the Tree Cannot Separate:**
  *   **Hart's "Rule of Recognition" (as settled practice) vs. Kelsen's "Basic Norm" (presupposed):** Both typically lead to **Self-Embracing Sovereignty** (Q4 → Yes) *or* **Constraint Recognition** (Q5 → Yes). The tree's concrete questions about *what can be done procedurally* don't probe the *nature* of the foundational source (social practice vs. presupposition). You'd need a separate question like "Is the ultimate rule's validity based on social facts or logical necessity?" to distinguish them cleanly. The tree groups them based on similar *operational* outcomes.

  **Key:** The tree focuses on *operational validity*: "Can it be done according to the rules as understood/used?" and "What are the consequences?" This avoids metaphysical debates about foundations until the final node (Q5), where the practical implications of absolute proceduralism become concrete. The "unnamed" position is flagged and explained as uninhabited due to arbitrariness.
