  The air above the ring shimmered with waste heat. Kael watched his brother, Elan, circle the challenger. Elan’s crown – the intricate network of bio-luminescent filaments woven into his scalp and spine – pulsed a fierce, demanding blue. Each pulse cost; Kael could see the energy readout on his own wrist-comp ticking down Elan’s reserves. Ten percent per minute. A fortune in calories, siphoned from speed, from healing, from *life*.

  “He’s burning it too fast,” Kael muttered, adjusting the focus on his viewer. He wasn’t supposed to be here, not in the tech-pit beneath the ring, fiddling with illicit sensor feeds. He was just a mechanic, not a warrior.

  Beside him, Vanya, the clan’s old lore-master, grunted. “Speed. That’s the point, boy. The burn *is* the proof. Only the strongest can afford to waste fuel like water. The challenger sees that relentless blue fire, knows Elan has reserves he can’t touch, and his spirit falters.” She tapped her own, simpler crown – a mark of wisdom, not combat. Hers glowed a steady, economical green. “The waste *guarantees* the truth. Anything less… cheapens it.”

  Kael frowned, watching the energy graphs dance. The challenger’s crown threw jagged, inefficient spikes of light, draining his reserves twice as fast as Elan’s controlled burn for the same brilliance. “But Elan’s not just burning, Vanya. Look at the *pattern*. Smooth, sustained. His thermoregulation is perfect. He’s not just wasting; he’s *managing*. It’s a display of control as much as wealth. Anyone could burn fuel stupidly.”

  Vanya snorted. “And what good would that do? A fool burning bright for ten seconds then collapsing? No one respects that. It’s the *sustained* waste that crushes. The knowledge he can keep this up long after you’re spent. That’s the guarantee.”

  Above, Elan moved. Not a blur – blurring was cheap, inefficient acceleration anyone could manage briefly. This was sustained, impossible speed, a hummingbird flight path maintained for agonizing seconds. The challenger lunged, missed by a breath, stumbled as his own crown flared erratically. Elan didn’t strike; he just *was* there, crown blazing its steady, ruinous blue, radiating heat like a furnace. The challenger’s resolve visibly cracked. He lowered his guard. Elan touched his shoulder, a gentle tap. Conceded. Honour served, resources preserved. Barely.

  “See?” Vanya said, satisfied. “The burn spoke truth. The challenger knew he couldn’t match that furnace.”

  Kael didn’t answer. He was thinking about Tarn. Tarn, the old veteran who limped now, his own combat crown long dormant. Tarn, who sometimes talked in the quiet workshop hours.

  Later, in the dim glow of the maintenance bay, Kael found Tarn polishing a piece of salvaged hull plating. Elan’s crown sat on a diagnostic cradle, still radiating faint warmth, its energy cells utterly depleted.

  “He won,” Kael said, placing the crown carefully in the recharger. “Vanya says it was the waste. The sheer burn.”

  Tarn didn’t look up. “Vanya sees the fire. Doesn’t see the engine.”

  “What do you mean?”

  Tarn finally met his gaze. His eyes were sharp in the wrinkled face. “That smooth burn? That sustained speed? It’s not *just* about having fuel to burn, lad. It’s about the pipes. The cooling. The heart that can pump coolant fast enough under that load. The nerves that don’t fry. You think anyone could strap on one of those,” he nodded at the crown, “and just decide to burn like Elan did? Their brain would boil before the fuel ran out. The crown… it’s welded to the system. Shows what’s *inside*. The fuel burn’s just the price of admission.”

  Kael thought of his viewer graphs, the challenger’s jagged spikes versus Elan’s smooth line. “So… it’s useful? The control?”

  Tarn shrugged. “Control is survival. But the crown… it makes the invisible visible. Amplifies it. Lets everyone *see* the engine quality by how brightly, how steadily it lets you burn.”

  Kael’s fingers traced the dormant filaments of Elan’s crown. An idea, reckless and dangerous, sparked. What if you *could* fake the engine? Not just burn fuel wastefully like the challenger, but fake the smoothness? Fake the control? He’d studied the thermal dynamics. He knew the bottlenecks. A small shunt here, a forced coolant loop there… not to make the crown *work* better, but to make its *display* look smoother, more effortless, even if it cost slightly *more* to run inefficiently underneath. A lie wrapped in the appearance of superior efficiency.

  Weeks later, facing his own Trial of Worth against a minor clan rival, Kael activated his modified crown. He’d spent sleepless nights building it, testing it. It wasn’t a warrior’s crown, but a mechanic’s creation. As the filaments lit up, they pulsed not with the jagged spikes of the inefficient, nor the smooth, powerful blue of Elan. It was a forced, artificial smoothness, a cool, steady cyan light. It looked controlled. It looked *effortless*. The drain on his reserves was brutal, hidden behind layers of jury-rigged thermal buffers that wouldn’t last.

  His rival, Jax, hesitated. He saw the steady cyan, the apparent calm control radiating from Kael. Jax’s own crown flared hot yellow, spiking with effort. He circled, uncertain. Kael held his ground, pouring energy into the facade, sweat beading on his brow beneath the helmet. For a moment, it seemed to work. Jax looked wary, respectful even of the deceptive cyan glow.

  Then Kael moved. Not fast, just a testing step. The strain was instant. The hidden thermal buffers overloaded. A wisp of acrid smoke escaped his helmet seam. The smooth cyan flickered violently, dropping into a sickly, pulsing green before surging back erratically. The illusion shattered.

  Jax laughed, a harsh bark. He saw the weakness Kael couldn’t hide. The fight was short, brutal. Kael yielded quickly, his modified crown sputtering into darkness, a ruin of melted components and expended energy cells. Shame burned hotter than the malfunctioning filaments.

  After, nursing bruised ribs and pride in the workshop, Elan found him. Vanya trailed behind, disapproval radiating from her like heat.

  “That… *thing*,” Elan began, gesturing at the scorched crown on Kael’s bench. “What was it meant to be? A cheap trick?”

  “I thought…” Kael swallowed, the taste of failure sharp. “I thought I could make it *look* controlled. Make the display *look* effortless, like the engine was better than it is.”

  Vanya pounced. “See? Trickery! It proves my point! True worth *cannot* be faked without the true cost! Only the pure, wasteful burn is honest! Your machine tried to cheat the cost, and the cost cheated you back. Burned itself out.”

  Elan picked up the damaged crown, examining the forced coolant lines, the melted shunts. “It wasn’t just the cost, Vanya. Look at this. He tried to fake the *control*. The smoothness. But the control… it’s not just about *having* the fuel. It’s about the system that handles it. His jury-rigged pipes burst.” He looked at Kael, not angry, but curious. “You forced the display, but you couldn’t force the biology that makes the display *real*. Your body couldn’t handle the lie you told.”

  Kael stared at his hands, smudged with coolant. “So… was it the cost that betrayed me? Or was it that the crown… the *real* crown… shows something you can’t fake, no matter the energy you pour in?”

  Vanya crossed her arms. “The cost *is* the unfakeable part! He didn’t pay the true price of *sustained* waste! He paid a different, hidden price for a lie!”

  Elan turned the ruined crown in his hands. “Maybe. Or maybe the crown isn’t just about burning fuel. Maybe it’s a window. And you can smear the glass, but you can’t change the engine everyone sees through it.”

  The workshop hummed with the sound of rechargers and distant forges. The ruined crown lay between them, silent testament to a question neither brother nor lore-master could finally settle.

  ***

  **Notes:** This story leans primarily on account (b) – the display’s honesty stems from the *differential cost* (achieving smooth light/control is harder for low-quality signalers) – while explicitly contrasting it with (a) (waste as the *sole* guarantee, per Vanya) and hinting at (c) (the display being intrinsically linked/unfakeable, per Tarn/Elan). I fudged biology: making thermoregulation a direct, visible proxy for overall fitness is simplistic; real signaling traits are often less direct. The ‘amplifier’ concept is acknowledged (Tarn’s ‘window’). Kael’s failed prosthetic attempts to fake the *correlated trait* (control), exploiting the differential cost idea. The core disagreement – whether cost *itself* is the ultimate guarantee (Vanya) or merely correlates with an underlying, harder-to-fake quality (Elan) – mirrors ongoing debates in signaling theory, particularly critiques of the Handicap Principle’s emphasis on pure waste versus models emphasizing efficiency or differential costs. There is no settled consensus; the ‘honesty’ of signals is understood as arising from various equilibrium mechanisms, all contested. The framing reflects this plurality.
