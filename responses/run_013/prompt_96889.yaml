answer: |-
  ### Thought Experiment: Severe Mittelschmerz  
  **Scenario**  
  A 28-year-old woman presents to her GP with severe pelvic pain lasting 24 hours each month. Investigations (ultrasound, laparoscopy) confirm normal anatomy and regular ovulation; the pain coincides precisely with ovulation (mittelschmerz). While most women experience no or mild discomfort during ovulation, her pain—rated 8/10 on a pain scale—causes vomiting, an inability to work, and requires opioid analgesia. Her pain response is within the normal statistical range for women of reproductive age (reference class: biologically female, aged 18–35, without gynaecological pathology; severity falls in the 95th percentile, deemed "normal variation" in clinical studies). No system (reproductive, nervous, or endocrine) functions below the statistical norm for this class.  

  ### Walk-Through: Verdicts and Reasoning  
  - **Naturalist verdict**: Not a disease.  
    Reasoning: The ovaries (function: release eggs), nerves (function: transmit signals), and other systems perform their natural functions within the normal statistical range for the reference class. No part is *failing* or subnormal; the pain is an extreme but statistically normal variant.  
  - **Normativist verdict**: Disease.  
    Reasoning: The condition causes genuine harm (incapacitating pain, functional impairment) and warrants medical intervention (e.g., hormonal suppression). Harm alone suffices, regardless of dysfunction.  
  - **Hybrid verdict**: Not a disease.  
    Reasoning: Harm is present, but no underlying dysfunction exists (systems operate within statistical norms). The hybrid requires both; absent dysfunction, it fails.  

  **Single feature doing the work**: Absence of dysfunction.  

  ### Modification: Introducing Dysfunction  
  **Change**: Her prostaglandin F2α (a key ovulation mediator) levels are consistently above the 95th percentile for the reference class during ovulation (i.e., outside the normal statistical range), directly exacerbating inflammation and pain.  

  **New verdicts**:  
  - **Naturalist**: Now a disease (dysfunction present: abnormal prostaglandin production).  
  - **Normativist**: Still a disease (harm unchanged).  
  - **Hybrid**: Now a disease (both harm and dysfunction present).  
  **Outcome**: The case collapses into consensus ("textbook" disease), losing its edge for debate.  

  ### Naturalist Counterattack  
  A naturalist would hunt for dysfunction in **pain modulation systems** (e.g., heightened nociceptor sensitivity or abnormal central nervous system processing of pain signals). They might argue that "normal statistical range" is misapplied—if her pain is debilitating, it *must* indicate subnormal function in pain-inhibition pathways.  
  **Fairness? Unfair**. The scenario explicitly locates her pain response within the normal distribution for the reference class. Insisting on hidden dysfunction (1) ignores statistical norms, (2) smuggles in value judgments about "acceptable" pain, and (3) circularly redefines "dysfunction" as any cause of harm—undermining naturalism’s core claim.  

  \answer{absence of dysfunction}
