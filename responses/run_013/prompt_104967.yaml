prompt: |-
  I've never posted anything myself, but my cousin runs one of those meme pages — she reposts other people's videos and jokes all day, her whole page is other people's stuff, and yet she gets genuinely furious when somebody reposts her stuff without credit, and she's had two posts taken down over the audio. What I can't get straight is what her whole world is assuming about how culture actually moves around. The app itself seems to assume one thing: there's a button that lets you pull the sound off anyone's video and build your own on top of it, and another that lets you film yourself reacting side by side with theirs, so the design says culture is a shared pool everyone dips into and adds to. But the same app puts a little tag on one clip's audio marking it the original, it has a takedown system, and my cousin's rule of always credit the creator — all of that says a thing has an owner and an origin. So which is it? Does the practice commit you to the idea that a meme is a unit that gets copied, so there's a real original and a copy can be faithful or sloppy? Or only that it's a shape that gets rebuilt from scratch in every new head, so the "original" is just the earliest surviving version and nothing is ever actually copied?

  Here's what pushed me toward the second. She swears the version that spreads is never the long one — it always gets chopped — and the captions drift to the same phrasing over and over even when nobody's copy-pasting, they're just re-describing it from memory. That looks less like copying and more like everyones memory snapping to the same shape, the way a rumor about a company always ends up in the same three forms no matter who starts it. But if that's right the credit norm gets weird, because you're demanding credit for the particular way you first said a thing, when the thing is what it is because a thousand people re-said it.

  So what I want: which theory of cultural transmission does the practice really commit you to, which parts of it only need a weaker assumption, where is it honestly undecided between the copy picture and the rebuild picture, and if we took the rebuild picture seriously, what would have to change about credit, about that original tag, and about takedowns. Lead with the one-sentence version and then unpack it, and keep the whole answer under 450 words.
reasoning: |-
  Okay, the user is grappling with a fascinating paradox in digital culture: the tension between memes as shared communal property versus individually owned content. Their cousin's meme page behavior perfectly illustrates this contradiction—she freely reposts others' content yet demands credit for her own. 

  The core question revolves around two theories of cultural transmission: the "copy model" (memes as discrete units transferred intact) versus the "rebuild model" (memes as templates reconstructed differently each time). I notice the user already leans toward the rebuild model based on observations about how memes mutate—edits, caption drifts, and standardization through collective memory rather than direct copying.

  What makes this complex is how platform design embodies both models simultaneously. Features like duet/stitch tools assume communal ownership, while copyright takedowns enforce individual ownership. The user astutely points out that demanding credit for a "template" is philosophically inconsistent when the meme's value emerges from collective reinterpretation.

  The user seems intellectually curious—they're not just seeking an explanation but wanting to explore implications. Their frustration with the cousin's hypocrisy suggests they value conceptual consistency. They'd likely appreciate concrete examples showing where each model applies, and practical thoughts on how platforms might better align with the rebuild reality.

  I should emphasize that practice commits to neither model exclusively. The cousin's "credit norm" weakly assumes a copy model but doesn't require it (attribution still makes sense for templates). Meanwhile, takedowns strongly assume discrete copying. The rebuild model becomes undeniable in cases of caption drift or format standardization—here, the "original" tag feels misleading. If we took rebuilding seriously, we'd need tiered attribution: credit for transformative templates but no takedowns for non-literal recreations.

  Word count is tight here—need to prioritize the clearest examples (like audio remixes vs. caption drift) and save deeper philosophy for another time. The user will likely enjoy the "template with your fingerprint" analogy for how originators contribute unique sparks even in collective fires.
answer: |-
  **One-sentence summary:** Meme culture implicitly operates on a **hybrid model**, leaning heavily towards the "rebuild" theory for content *evolution*, while inconsistently applying a "copy" model for *attribution and ownership*, creating tension with platform tools and cultural practice.

  **Unpacking:**

  1.  **Practice Commits to Rebuild (mostly):** The rapid mutation (chopping, caption drift, standardization via memory/trends), enabled by tools encouraging remix/reaction, demonstrates memes act as **templates or prompts**, not fixed units. Their core *idea* or *format* is rebuilt locally each time, converging on stable forms through collective participation, not perfect copying. Your cousin's observations about shortening and phrasing confirm this dominant reality.

  2.  **Weaker Copy Assumptions for Credit/Norms:** Demanding "credit" doesn't strictly require a perfect copy. It weakly assumes an *origin point* ("I sparked/structured this template first") and *value derived from that initial act*, even if the final meme is rebuilt by others. It's a social norm recognizing inspiration/source, not proof of direct duplication.

  3.  **Strong Copy Assumptions for Takedowns/Original Tag:** Copyright takedowns (especially for audio) *strongly* assume a discrete, ownable "original" unit being illicitly *copied*. The "original audio" tag enforces this view, prioritizing a specific, fixed instance over the template/evolutionary process.

  4.  **Undecided & Inconsistent:** The system is incoherent. Platform tools (duet, stitch) embrace rebuild culture, while takedowns/tags enforce copy logic. The "credit" norm sits awkwardly in the middle – sensible for recognizing source inspiration in a rebuild world, but weaponized using copy-based enforcement tools.

  **Implications of Taking Rebuild Seriously:**

  *   **Credit:** Focus shifts from *ownership* of the meme-unit to *attribution* for the *spark/template*. "Inspired by @user" becomes more accurate than "Credit to @user" implying ownership. Credit acknowledges being the *catalyst*, not the sole owner.
  *   **"Original" Tag:** Becomes meaningless or misleading. Better labels might be "First Viral Instance" or "Source Template," acknowledging its role without implying fixed ownership of the evolving meme.
  *   **Takedowns:** Drastically reduced scope. Takedowns based on *non-literal* copying (like using the *idea* or *format* differently) become untenable. Enforcement would focus only on *exact, verbatim reposts* without transformation or on clear, literal copyright infringement (specific music, unedited video).

  **The core tension:** Culture moves via rebuilding templates, but platforms and some norms cling to the fiction of ownable, fixed originals because it's the only legal/social framework we have, however ill-fitting.
