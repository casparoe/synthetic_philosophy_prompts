answer: |-
  Your cases reveal medicine's implicit philosophy: a **pragmatic hybrid model** that blends biological dysfunction with normative valuation, treating diagnostic thresholds as risk-management tools rather than natural kinds. Here's a reconstruction of the commitments, tensions, and implications:

  ### Core Philosophical Commitments
  1. **Disease as Probabilistic Harm Mitigation**:  
     Conditions like "hypertension" or "impaired fasting glucose" are defined not by intrinsic dysfunction alone, but by *statistically significant risk of future harm* (stroke, diabetes) that crosses a cost-effectiveness threshold. The practice assumes:  
     - Biology provides *continuous risk gradients* (e.g., every 10 mmHg BP increase elevates CVD risk)  
     - Human valuation sets *discontinuity points* where intervention becomes "worthwhile"  

  2. **Value-Laden Biology**:  
     Even "statistical dysfunction" (e.g., being in the top 10% of CVD risk) is normative:  
     - **Reference populations** reflect social choices (e.g., using contemporary Western populations as "normal" ignores evolutionary mismatch)  
     - **Cut points** prioritize societal tolerance for false positives vs. missed cases (WHO's 110 mg/dL explicitly avoids overdiagnosis, while ADA's 100 mg/dL accepts more false positives to prevent diabetes)  

  3. **Economic Naturalism**:  
     The practice treats health economics as an *extension* of biology. When NICE lowers the statin threshold to 10% risk, it implies:  
     - Preventing a cardiac event in high-resource settings has calculable "value"  
     - Disease boundaries expand/contract with healthcare budgets (a view incompatible with fixed biological dysfunction)  

  ### What This Practice Rules Out
  - **Pure Naturalism (e.g., Boorse's "species-typical functioning")**:  
    Rejected because thresholds shift without new biological evidence (e.g., ACC/AHA vs. ESC hypertension criteria). Biology alone cannot explain why 130/80 mmHg is a "disease" in the US but not Europe.  

  - **Mechanistic Dysfunction Views (e.g., Wakefield's "harmful dysfunction")**:  
    Ruled out when *risk factors* (high LDL without plaque) become "diseases" warranting treatment. Statins are prescribed for *probability* of dysfunction, not observed failure.  

  - **Strict Normativism ("disease as social construct")**:  
    Partially accommodated but constrained; panels still appeal to biomarkers (glucose, BP) as objective anchors, resisting purely cultural definitions.  

  ### Tensions and Consistency
  - **Internal Conflict**: Panels describe thresholds as both *biological facts* ("clinical guidelines") and *economic choices* ("cost-effective prevention"). This is **inconsistent at the ontological level** but **pragmatically coherent** as risk governance.  
  - **Underdetermined Zones**: For borderline cases (e.g., fasting glucose 105 mg/dL), *multiple* accounts could apply:  
    - Naturalism: "No organ damage? Not diseased."  
    - Normativism: "Treat to prevent future costs."  
    Practice allows either justification, revealing its agnosticism about core disease theory.  

  ### Consequences of Shifting the Underlying View
  **Scenario 1: Strict Dysfunction-Based View (e.g., Boorse)**  
  - **Who gets labeled?** Only those with *current* organ damage (e.g., hypertensive retinopathy) or proven functional impairment.  
  - **Who gets treated?** Statins only after vascular damage; prediabetes category eliminated.  
  - **Public argument:** "Medicine should not medicalize risk. Treat diseases, not probabilities."  

  **Scenario 2: Openly Normative View**  
  - **Labeling/treatment:** Aligns with societal priorities. E.g., diabetes threshold might lower during economic booms (prevent future costs) but rise in austerity (tolerate more future disease).  
  - **Public argument:** "We set thresholds at X because preventing 1,000 strokes is worth $Y million. Debate the values, not the science."  

  ### Conclusion: The Implicit Model
  Medicine operates with a **teleological concept of disease**: a state is pathological *insofar as its modification advances health goals efficiently*. This:  
  - **Requires** that biology provides measurable risk continua (e.g., glucose levels ↔ diabetes incidence)  
  - **Accommodates** shifting valuations of false positives, resource allocation, and preventable burden  
  - **Silently replaces** "dysfunction" with **"costworthy risk"** as the operative criterion  

  The practice’s power lies in its evasion of philosophical scrutiny: it borrows naturalist rhetoric ("high glucose harms organs") while deploying normativist tools (adjusting thresholds per cost-per-QALY). To challenge it, one must demand: *When you lower this threshold, is it because we understand biology better—or because we’ve changed our minds about what risks are worth buying down?*
