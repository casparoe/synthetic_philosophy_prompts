  For structure, I'll include: 1) Immediate actions during manifestation events 2) Prohibited actions 3) Landlord responsibilities 4) FAQ addressing common concerns. The sidebar will feature "Traditionalist View" with actual causal language that the main document avoids. 

  Word count is around 500, so I'll keep sections concise. The humor should emerge from the strained circumlocutions needed to avoid causality while giving practical advice - like saying "water application has been observed to coincide with reduction in divine manifestations" instead of "water puts out fires."

  I need to maintain absolute deadpan delivery. The committee should sound earnestly proud of their doctrinally pure phrasing, making the disconnect between theology and practicality funnier. The dissenting sidebar will heighten this by showing what they're deliberately not saying.
answer: |-
  ## MUNICIPAL FIRE PREVENTION & RESPONSE GUIDELINES (OCCASIONALIST REVISION)

  **POST PROMINENTLY. REVIEW BI-ANNUALLY. COMPLIANCE IS MANDATORY.**

  **1. IMMEDIATE ACTIONS UPON OBSERVATION OF COMBUSTION MANIFESTATION:**
     1.  **Vocalize Alert:** Clearly state "Manifestation Observed" repeatedly to alert cohabitants. Do not speculate on origin or mechanism.
     2.  **Initiate Egress:** Proceed calmly but purposefully towards the designated exit route (posted separately). Movement towards open space is the established response protocol.
     3.  **Secure the Threshold:** Once outside, ensure the primary entry door is closed. This action aligns with observed patterns of containment.
     4.  **Request Intervention:** From a safe external location, utilize a communication device to contact Emergency Services (Dial 911). Report "Divine Manifestation of Combustion at [Address]". Await further instruction.

  **2. ACTIONS STRICTLY PROHIBITED:**
     1.  **Do Not Investigate Origin:** Inquiry into *why* manifestation occurs at a specific point is irrelevant to the mandated response.
     2.  **Do Not Apply Substances Presumptively:** Refrain from directing water, powders, or other materials towards the manifestation point with the expectation of predictable outcome alteration. Outcomes cannot be guaranteed by material interaction.
     3.  **Do Not Assume Instrumentality:** No device (e.g., smoke/heat detectors) *causes* a specific divine response. Treat auditory or visual signals from installed devices solely as indicators of potential concurrent manifestation, necessitating protocol initiation (Section 1).
     4.  **Do Not Re-enter:** Once safely outside, remain outside until Emergency Services personnel authorize re-entry. The pattern of cessation is only verifiable externally.

  **3. LANDLORD/OWNER RESPONSIBILITIES & EXPECTED PROVISION:**
      *   **Maintained Egress Paths:** Ensure designated exit routes remain unobstructed and functional at all times, facilitating the movement response.
      *   **Operational Signaling Devices:** Install and maintain devices known to produce specific auditory/visual signals (e.g., high-decibel alarm, flashing light) *during observed instances* of combustion manifestation within structures. Regular testing ensures signal functionality per municipal code (Schedule: Quarterly).
      *   **Threshold Integrity:** Ensure primary entry/exit doors close fully and latch securely.
      *   **Water Access Point:** Provide a functional hose bib connection at street level, accessible to Emergency Services, consistent with their operational habits.

  **4. FREQUENTLY CONSIDERED POINTS (FCP):**

  *   **FCP 1: Why run if fire doesn't cause burning?** The habitual divine sequence consistently associates proximity to significant combustion manifestation within enclosed spaces with subsequent harm. Movement to designated open spaces is reliably associated with the cessation of harmful manifestations within the vacated structure. Adherence to the protocol aligns with the observed reliable habit.
  *   **FCP 2: Why have smoke alarms if they don't cause anything?** Auditory/visual signals from these devices exhibit a high frequency of coincidence with the initial stages of combustion manifestation within dwellings. They serve as a prompt to initiate the mandated egress protocol, proven effective within the observed divine pattern.
  *   **FCP 3: Why tell Emergency Services?** Emergency Services personnel operate under specific protocols aligned with the divine habit. Their arrival and subsequent actions form part of the established sequence reliably associated with manifestation cessation and structural preservation.
  *   **FCP 4: Could the habit change?** Divine agency is absolute. While the established habit is remarkably consistent, reliance upon it is an act of fidelity to observed regularity, not a claim of inherent necessity. The protocol remains the prescribed response.

  ---

  **SIDEBAR: TRADITIONALIST VIEWPOINT (MINORITY COMMITTEE POSITION - NOT ADOPTED)**
  *"While respecting the majority's meticulous theological framework, I maintain the classical position: Allah, in His wisdom, imbued fire with the inherent property (*tabi'a*) to burn combustible materials like wood and cloth when contact occurs under suitable conditions. Water extinguishes by depriving the fire of heat and fuel. Smoke alarms save lives by providing early warning of actual fire. Our rules should state these clear, causative relationships to best compel safe behaviour. Reliance on observed 'habit' alone feels unnecessarily oblique for a safety notice."*
  *- Abdul-Malik al-Hadithi, Committee Member*

  ---

  **This notice embodies the Municipal Bureau of Habitual Safety's commitment to doctrinal precision alongside practical community welfare. Adherence preserves life and property within the reliably observed divine pattern. Report non-compliance to the Bureau (Ref: Code F-PREV/OCC-7).**
