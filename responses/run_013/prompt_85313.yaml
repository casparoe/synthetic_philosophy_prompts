prompt: |-
  Two philosophers who have argued for years about dispositions have agreed to produce a joint statement of an adversarial collaboration. The first is a conditionalist: to ascribe a disposition to a thing, she holds, is to say something about how that thing would behave in certain circumstances, and there is nothing more to having a disposition than the truth of the relevant conditionals. The second is an anti-reductionist: a disposition, he holds, is a real feature of the thing, prior to and explanatory of the truths about what it would do, so that no set of conditional truths could take its place. Both agree that the simple form of the conditionalist's account — a thing is disposed to break when struck just in case it would break if struck — is false, and that everything turns on whether some repaired form survives.

  Their dispute has revolved around three kinds of interfering condition. Call a condition a fink if the arrival of the stimulus removes the disposition itself; a mask if it leaves the disposition intact but blocks its manifestation; and a mimic if it produces the manifestation by another route while the disposition is absent.

  Write the statement the two of them could sign. Format it as follows.

  1. A numbered list of claims both accept: about what disposition ascriptions are for, about what the fink, mask, and mimic cases do and do not show, about what would count as an adequate repair of the conditional analysis, and about what is at stake that is more than terminological. Nothing vacuous; nothing only one side could accept.

  2. A table of the residual disagreements. Each row states one disagreement twice — once in wording the conditionalist endorses as her own position, once in wording the anti-reductionist endorses as his — and adds a verdict on whether that disagreement is substantive or verbal, with reasons.

  3. Their cruxes: the sub-questions such that settling one would move at least one of them. For each crux, give a case or argument both parties accept as bearing on it, and record both parties' predictions about it in advance.

  Both parties ask you to work through four cases on which neither has published, rather than gesturing at them:

  (a) A pane that, when struck, instantly ceases to be brittle and is then broken a moment later by a charge released by the impact itself: it does break when struck, but not because it is brittle.
  (b) A metal whose brittleness consists in a lattice structure that, whenever the metal is struck, converts to a ductile form and absorbs the blow — the very feature that makes it brittle is what keeps it from ever breaking.
  (c) A substance that cracks under stress on roughly a third of the occasions on which it is stressed, the outcome turning on the stochastic microstructure at the crack tip.
  (d) A substance that shatters on its first impact and is unbreakable thereafter.

  For each case, say whether the thing has the disposition, whether the corresponding counterfactual is true, and, where the two sides must diverge, how each side accommodates the case.

  Close with two short sections: what result, conceptual or empirical, each party would count against their own position; and whether either party believes the other's position can be re-described so as to be compatible with their own. Argue everything out from the cases and the positions themselves; neither party should need to invoke any particular published formulation.
reasoning: |-
  We are writing a joint statement for two philosophers: a conditionalist and an anti-reductionist.
   They agree that the simple conditional analysis (SCA) is false, and they want to repair it. They have three kinds of interfering conditions: finks, masks, and mimics.

   We are to format the statement as follows:
   1. A numbered list of claims both accept.
   2. A table of residual disagreements.
   3. Their cruxes: sub-questions with cases and predictions.

   Then, we are to analyze four cases (a, b, c, d) and then close with two short sections.

   Let's start with part 1: claims both accept.

   Both parties agree on the following:

   1. Disposition ascriptions are for explaining and predicting behavior. They are central to scientific and everyday reasoning.
   2. The simple conditional analysis (SCA) is vulnerable to counterexamples of three kinds: finks, masks, and mimics.
      - A fink: when the stimulus (e.g., striking) would cause the disposition to disappear, so the manifestation (e.g., breaking) does not occur because the disposition is lost.
      - A mask: when the disposition is present but something prevents the manifestation (e.g., a protective coating) even when the stimulus is applied.
      - A mimic: when the manifestation occurs without the disposition, because something else causes it.
   3. The cases of finks, masks, and mimics show that the SCA (which says: x is disposed to M when S iff if S were to happen, then M would happen) is false because:
      - In a fink case, the object has the disposition but the conditional is false (because when S happens, the disposition is lost and M doesn't happen).
      - In a mask case, the object has the disposition but the conditional is false (because M doesn't happen due to the mask).
      - In a mimic case, the object lacks the disposition but the conditional is true (because M happens due to something else).
   4. An adequate repair of the conditional analysis must account for finks, masks, and mimics. It must specify a conditional that holds in normal conditions, or it must incorporate ceteris paribus clauses, or it must relativize the conditional to a set of ideal conditions. However, both parties agree that the repair must not simply build in the disposition as a primitive, because that would beg the question against the anti-reductionist.
   5. The dispute is not merely terminological: it concerns the nature of properties and causation. The conditionalist holds that dispositions are reducible to conditionals (perhaps a set of them, under certain conditions), while the anti-reductionist holds that dispositions are irreducible properties that ground the conditionals.

   Now, for part 2: table of residual disagreements.

   We need to state each disagreement twice: once from the conditionalist's perspective, and once from the anti-reductionist's. Then we say whether it's substantive or verbal and why.

   Disagreement 1: What is the nature of a disposition?
     - Conditionalist: A disposition is nothing over and above the truth of a set of conditionals (suitably repaired to avoid finks, masks, and mimics).
     - Anti-reductionist: A disposition is a real, categorical property of an object that explains why the conditionals hold.

   Disagreement 2: What is the relation between dispositions and conditionals?
     - Conditionalist: The truth of the conditionals (in the repaired analysis) is constitutive of the disposition; there is no further fact about the disposition beyond these conditionals.
     - Anti-reductionist: The conditionals are true because of the disposition; the disposition is the ground for the conditionals.

   Disagreement 3: Can the conditional analysis be repaired without invoking dispositions?
     - Conditionalist: Yes, we can specify a set of conditionals that does not explicitly or implicitly rely on dispositional concepts, by using concepts such as 'normal conditions' or 'ideal conditions' that are non-dispositional.
     - Anti-reductionist: No, any attempt to repair the conditional analysis must ultimately rely on dispositional concepts (like 'intrinsic structure' or 'causal powers') that are irreducible.

   We must now decide whether each disagreement is substantive or verbal. The parties might think that some of these are substantive because they reflect a deep metaphysical divide. However, note that the conditionalist and anti-reductionist agree that the SCA is false and that a repair is needed. The question is whether the repair can be done without circularity.

   The conditionalist might argue that the repair uses only non-dispositional concepts (e.g., structural or categorical properties). The anti-reductionist might argue that the concepts used in the repair (like 'normal conditions') are themselves dispositional or that they require a background of dispositions.

   We'll say that the disagreements are substantive because they turn on whether a non-circular, non-dispositional reduction is possible. This is a matter of fact about the reducibility of dispositions.

   However, note that the anti-reductionist might also argue that even if the conditionalist can provide a non-circular analysis, it would still miss the explanatory priority of the disposition. So the disagreement is substantive.

   Let's create the table:

   | Disagreement | Conditionalist's wording | Anti-reductionist's wording | Verdict (substantive/verbal) | Reasons |
   |--------------|--------------------------|------------------------------|------------------------------|---------|
   | 1 | Dispositions are reducible to a set of conditionals (under a repaired analysis). | Dispositions are irreducible properties that ground the conditionals. | Substantive | The disagreement concerns the ontological status of dispositions: whether they are reducible to conditionals or are prior to them. |
   | 2 | The repaired conditionals are what it means to have a disposition; there is no further fact. | The conditionals are true in virtue of the disposition; the disposition is the causal basis. | Substantive | This is about explanatory priority: whether conditionals explain dispositions or vice versa. |
   | 3 | A repaired conditional analysis can be given that does not invoke any dispositional concepts. | Any repaired conditional analysis must implicitly or explicitly rely on dispositional concepts. | Substantive | This is a testable claim: can we construct a non-circular analysis? |

   Now, part 3: cruxes.

   We need sub-questions such that settling one would move at least one of them. We'll consider the four cases (a, b, c, d) and also the general issue of the possibility of a non-circular repair.

   Crux 1: Can conditionals be repaired to handle finks without invoking dispositions?
     - Case: (a) A pane that, when struck, instantly ceases to be brittle and is then broken a moment later by a charge released by the impact itself.
     - Both parties accept that this case is a fink: the brittleness is lost upon striking, but breaking occurs by a different mechanism.
     - Question: Can we specify a conditional that correctly ascribes brittleness without mentioning brittleness or other dispositions?
     - Conditionalist prediction: Yes, by specifying a conditional that holds at the moment just before striking, or by specifying the intrinsic structure that is responsible for the brittleness (which is non-dispositional).
     - Anti-reductionist prediction: No, because any conditional that we specify must hold in virtue of the intrinsic structure, but that structure is the disposition itself (or the basis for it). The conditionalist's intrinsic structure is just the disposition under a different name.

   Crux 2: Can conditionals be repaired to handle masks without invoking dispositions?
     - Case: (b) A metal whose brittleness consists in a lattice structure that, whenever the metal is struck, converts to a ductile form and absorbs the blow — the very feature that makes it brittle is what keeps it from ever breaking.
     - This case is tricky: it's a self-masking disposition. The brittleness (due to the lattice structure) causes a change that prevents breaking. So the metal has the disposition (it is brittle) but when struck, it doesn't break because it becomes ductile.
     - Question: Can we specify a conditional that captures the brittleness without being masked?
     - Conditionalist prediction: We can repair the conditional by adding a clause that the lattice structure must remain unchanged during the striking. But this might require mentioning the structure (non-dispositionally).
     - Anti-reductionist prediction: The repair will fail because the lattice structure is the dispositional basis, and the conditional must refer to it. But the lattice structure is a dispositional property (it is the brittleness).

   Crux 3: Can conditionals handle probabilistic dispositions without invoking dispositions?
     - Case: (c) A substance that cracks under stress on roughly a third of the occasions on which it is stressed, the outcome turning on the stochastic microstructure at the crack tip.
     - This is a probabilistic disposition. The simple conditional (if stressed, it would break) is false because it doesn't break every time. We need a probabilistic conditional.
     - Question: Can we give a conditional analysis in terms of probability (e.g., if stressed, it would break with probability 1/3) without invoking dispositions?
     - Conditionalist prediction: Yes, by using a chance conditional: the chance of breaking given stress is 1/3. This is non-dispositional.
     - Anti-reductionist prediction: The chance itself is a disposition (a propensity) and hence irreducible.

   Crux 4: Can conditionals be repaired to handle temporary dispositions?
     - Case: (d) A substance that shatters on its first impact and is unbreakable thereafter.
     - Before the first impact, the substance is disposed to shatter when struck. After, it is not. But the conditional "if it were struck, it would shatter" is true at all times? Not after the first impact because it wouldn't shatter again (it's already broken). But what about before? It would shatter if struck then. However, note that the disposition is temporary and only for the first impact.
     - Question: Can the conditional analysis capture the temporary nature of the disposition without reference to time-indexed dispositions?
     - Conditionalist prediction: We can use a time-indexed conditional: at time t (before first impact), if struck at t, it would shatter. This is non-dispositional.
     - Anti-reductionist prediction: The time-indexed conditional is true because at time t the object has the disposition. The disposition is a state that exists at t and then is lost. The conditionalist is merely describing the symptom, not the cause.

   Now, we analyze the four cases:

   (a) The pane that when struck ceases to be brittle and then breaks by a charge.
     - Does it have the disposition (brittleness) at the time just before being struck? Yes, until struck.
     - What is the corresponding counterfactual? "If it were struck, it would break." This is true because it does break when struck. However, note that it breaks not because of brittleness but because of the charge. So the conditional is true, but the object is not brittle at the moment of breaking? But it was brittle just before.

     How each side accommodates:
     - Conditionalist: The simple conditional is true, but we need a repair because the brittleness was lost. The repair might say: the object is brittle at time t if there is a conditional that if it were struck at t and if its brittleness were to persist through the striking, then it would break. In this case, if we imagine the brittleness persisting (which it doesn't in the actual case), then it would break. So the repaired conditional holds. Thus, the object is brittle at t.
       Alternatively, the conditionalist might use a conditional that holds at the instant of striking: at the exact moment of impact, the object is brittle if at that moment it has the intrinsic structure that, if not interfered with, would cause breaking. But in this case, at the moment of impact, the brittleness is removed. So perhaps the conditionalist must say: the object was brittle just before, but at the moment of impact it is not. The conditional "if struck, it would break" is true, but that doesn't imply brittleness because of the mimic-like aspect (breaking by charge). So the conditionalist must refine: the breaking must be caused in the right way (by the brittleness). But that would require mentioning the disposition.

       This is tricky. The conditionalist might avoid by saying: the repaired conditional is about what would happen in the closest worlds where the object is struck and there are no finks or masks. In this case, if we remove the fink (the mechanism that removes brittleness upon striking) then the object would break because it is brittle. So the conditional holds.

     - Anti-reductionist: The object has the disposition (brittleness) at the time just before striking. The conditional "if struck, it would break" is true, but note that the breaking is not due to the brittleness but due to the charge. So the truth of the conditional does not explain the brittleness; instead, the brittleness is a real property that, in the absence of the fink, would cause breaking. The anti-reductionist can say that in this case, the brittleness is present but the causal chain is interrupted by the fink, and then a mimic occurs. The disposition is present, but the manifestation (breaking) is not caused by it. So the simple conditional is true by coincidence, but the disposition is there.

     Both sides agree the pane is brittle (at the time just before being struck). The conditionalist must explain why the simple conditional is true but the disposition is not manifested in the way we expect. The anti-reductionist has no problem: the disposition is there, but its causal role is preempted.

     However, note that the anti-reductionist also thinks the disposition is present. So:

     - Disposition: yes (at the time just before impact).
     - Conditional: "If it were struck, it would break" is true (because it does break).

     But the conditionalist must account for the fact that the breaking is not due to brittleness. So the conditionalist might say: the object is brittle because it satisfies a repaired conditional (one that holds in the absence of finks and masks). The simple conditional is true but for the wrong reason. The repaired conditional might be: if it were struck and there were no finks (so the brittleness persists), then it would break. This holds. Alternatively, the conditionalist might say that the simple conditional is not sufficient for the disposition because of mimics: we need also that the breaking is caused by the brittleness. But then the analysis becomes circular.

     The conditionalist must avoid circularity. So they might try to specify the intrinsic structure. But the anti-reductionist will say that the intrinsic structure is the dispositional basis.

     For the purpose of the case:

     - Both agree the disposition is present at the relevant time (just before impact).
     - The conditional "if struck, it would break" is true.

     But the manifestation is not due to the disposition. So the conditionalist must adjust: the repaired analysis should require that the breaking is caused by the disposition. But that would be circular. Alternatively, the conditionalist might say that the conditional must hold in virtue of the object's intrinsic properties (non-dispositionally). In this case, the brittleness is an intrinsic property, but the fink removes it. So the conditionalist might say: the object has the intrinsic property that, if struck and if that property persists, then it breaks. This avoids circularity? The anti-reductionist might say that the intrinsic property just is the disposition.

     We'll record:

     - Disposition: yes.
     - Conditional: true.

     And the two sides accommodate by:

     - Conditionalist: The repaired conditional analysis (with a proviso about the persistence of the intrinsic basis) is satisfied.
     - Anti-reductionist: The disposition is present, and the conditional is true but not because of the disposition (it's a coincidence). The disposition is present and would cause breaking in the absence of the fink.

   (b) The metal that has a lattice structure that makes it brittle, but when struck the lattice changes to ductile and absorbs the blow.

     - Does it have the disposition? It is brittle because it has the lattice structure that is characteristic of brittleness. But when struck, it never breaks because the lattice changes. So it is brittle, but it never manifests it.

     - Conditional: "If struck, it would break." False, because it never breaks.

     How each side:

     - Conditionalist: The simple conditional is false, but the object is brittle. So the repair must account for this mask. The repaired conditional might be: if it were struck and the lattice structure did not change (i.e., no mask), then it would break. This is true. So the disposition is present.

     - Anti-reductionist: The brittleness is a real property (the lattice structure) that is present. It is because of that property that the metal changes to ductile when struck. The mask is inherent in the disposition. The disposition does not manifest because of this self-masking.

     Both agree the metal is brittle.

     - Disposition: yes.
     - Conditional: false (because the mask prevents breaking).

     Accommodation:

     - Conditionalist: The repair must include the absence of masks. The repaired conditional (with the mask removed) holds.
     - Anti-reductionist: The disposition is present and explains why the conditional is false: because the disposition itself causes the mask.

   (c) The substance that cracks under stress with probability 1/3.

     - Disposition: probabilistic disposition to break when stressed.
     - Conditional: "If stressed, it would break." This is not necessarily true because it doesn't always break. But we can consider a probabilistic conditional: "If stressed, the probability of breaking is 1/3." This is true.

     How each side:

     - Conditionalist: The repaired analysis uses a probabilistic conditional. The disposition is reducible to this conditional.
     - Anti-reductionist: The disposition is a real propensity (a kind of disposition) that grounds the probabilistic conditional.

     Both agree the disposition is present.

     - Disposition: yes.
     - Conditional: the simple deterministic conditional is false, but the probabilistic conditional is true.

     Accommodation:

     - Conditionalist: The analysis must be amended to probabilistic conditionals. The disposition is the probabilistic conditional.
     - Anti-reductionist: The disposition is the propensity, which explains the probabilistic conditional.

   (d) The substance that shatters on first impact and is unbreakable thereafter.

     - Before first impact: 
          - Disposition: yes (disposed to shatter when struck).
          - Conditional: "If it were struck, it would shatter." True, because it would.
     - After first impact:
          - Disposition: no (it's already broken, so not disposed to shatter again).
          - Conditional: "If it were struck, it would shatter." False, because it wouldn't (it's broken).

     How each side:

     - Conditionalist: The conditional at time t (before impact) is true, and at time t (after) it is false. The disposition ascription is time-indexed. The repair might require that the conditional is evaluated at the time of ascription. So the disposition is captured by the conditional at that time.
     - Anti-reductionist: The disposition is a state that the object has at the first time and not at the second. The conditionals are true in virtue of that state.

     Both agree that before impact, the disposition is present and the conditional is true; after, neither.

     Accommodation: 
     - Conditionalist: The repair must include time-indexing. The conditional is relative to a time. This is non-dispositional.
     - Anti-reductionist: The disposition is a categorical state that exists at the first time and not the second.

   Now, we close with two short sections:

   Section A: What result, conceptual or empirical, each party would count against their own position.

     - Conditionalist: If it were shown that there is no way to specify the set of ideal conditions (for the repaired conditional) without invoking dispositional terms, then that would count against conditionalism.
     - Anti-reductionist: If it were shown that dispositions are reducible to non-dispositional properties (like structural properties) and that conditionals can be analyzed without any circularity, then that would count against anti-reductionism.

   Section B: Whether either party believes the other's position can be re-described so as to be compatible with their own.

     - Conditionalist: Might argue that the anti-reductionist's "real property" is just the structural basis that the conditionalist uses in the repair. So if the anti-reductionist accepts that the structural basis is what makes the conditionals true, then that's all the conditionalist needs. The conditionalist reduces dispositions to conditionals that are made true by the structural basis. But the anti-reductionist might not accept that the structural basis is non-dispositional.

     - Anti-reductionist: Might argue that the conditionalist's repaired conditionals are made true by the dispositional properties. So the conditionalist is just describing the symptoms. The conditionalist might reply that they are reducing the disposition to the conditionals, which are in turn grounded in non-dispositional bases.

     They both might think that if the other side were to accept a certain description, then it becomes compatible. But as it stands, they disagree on the reducibility.

     We'll say: 
        - The conditionalist believes that if the anti-reductionist accepts that the disposition is nothing over and above the structural basis (which is non-dispositional) and that the conditionals are what we mean by the disposition, then the views are compatible. But the anti-reductionist does not accept that the structural basis is non-dispositional (it is the disposition itself).

        - The anti-reductionist believes that if the conditionalist accepts that the conditionals are true in virtue of the disposition (a real property), then the conditionalist is really an anti-reductionist. But the conditionalist does not accept that.

     So they do not believe that the other's position can be re-described to be compatible.

   Now, let's write the joint statement accordingly.
answer: |-
  ### Joint Statement on Dispositions

  #### 1. Claims Both Accept  
  Both parties endorse the following non-vacuous claims, reflecting shared ground beyond terminological preferences:  

  1. **Purpose of Disposition Ascriptions**: Disposition ascriptions (e.g., "brittle," "flammable") serve to explain and predict an object’s behavior under specific conditions. They are integral to scientific and everyday reasoning.  
  2. **Fink, Mask, and Mimic Cases**:  
     - **Finks** demonstrate that the simple conditional analysis (SCA) fails because the stimulus removes the disposition before manifestation (e.g., a wizard desolidifies a fragile vase upon striking).  
     - **Masks** show that SCA fails because the disposition remains intact but its manifestation is externally blocked (e.g., a fireproof coating prevents a flammable object from igniting).  
     - **Mimics** refute SCA because the manifestation occurs without the disposition, triggered by an alternative cause (e.g., a non-flammable object ignites due to hidden pyrotechnics).  
  3. **Inadequacy of SCA**: All three interfering conditions prove that SCA (disposition \(D\) iff stimulus \(S\) would cause manifestation \(M\)) is false. Finks and masks falsify the conditional while the disposition holds; mimics verify the conditional while the disposition is absent.  
  4. **Adequate Repair Criteria**: A successful repair of the conditional analysis must:  
     - Account for finks, masks, and mimics without ad hoc exceptions.  
     - Avoid explicit or implicit reliance on dispositional concepts (e.g., "intrinsic nature" or "causal basis") that presuppose irreducibility.  
     - Be statable in non-dispositional terms (e.g., structural or categorical properties).  
  5. **Stakes Beyond Terminology**: The dispute concerns whether dispositions are ontologically reducible to conditionals or are irreducible properties that ground them. This impacts explanations in science (e.g., whether brittleness explains breaking or is just a description of breaking tendencies).  

  ---

  #### 2. Residual Disagreements  
  The table below states each core disagreement twice, reflecting each philosopher’s preferred wording, and assesses whether it is substantive or verbal.  

  | Disagreement                                                                 | Conditionalist’s Wording                                                                                          | Anti-Reductionist’s Wording                                                                                         | Verdict (Substantive/Verbal) | Reasons                                                                                                                                 |  
  |------------------------------------------------------------------------------|-------------------------------------------------------------------------------------------------------------------|--------------------------------------------------------------------------------------------------------------------|------------------------------|-----------------------------------------------------------------------------------------------------------------------------------------|  
  | **Ontological Status of Dispositions**                                       | Dispositions are fully reducible to a set of non-dispositional conditionals (suitably repaired).                  | Dispositions are irreducible real properties that explain why conditionals hold.                                   | Substantive                  | Turns on whether dispositions add explanatory power beyond conditionals (e.g., in causal mechanisms). Verbal agreement is impossible without one side abandoning core tenets. |  
  | **Explanatory Priority**                                                     | Conditionals (repaired) constitutively define dispositions; no further "ground" is needed or coherent.            | Conditionals are true *because* of dispositions; dispositions are prior in the order of explanation.               | Substantive                  | Conditionalist denies explanatory priority to dispositions; anti-reductionist insists on it. No shared re-description resolves this. |  
  | **Repairability without Dispositional Concepts**                             | A non-circular repair is possible using only categorical properties (e.g., molecular structure) and non-dispositional laws. | Any repair implicitly relies on dispositional concepts (e.g., "normal conditions" presumes stability, a disposition). | Substantive                  | Conditionalist cites structural bases (e.g., lattice arrangements); anti-reductionist argues such bases *are* dispositions. Testable via conceptual analysis. |  

  ---

  #### 3. Cruxes  
  Cruxes are sub-questions where resolution would shift at least one philosopher’s view. Each includes an agreed-upon case/argument and both parties’ predictions.  

  1. **Crux: Can finks be handled without dispositional concepts?**  
     - **Case**: (a) A pane is brittle until struck; impact triggers an instant loss of brittleness and a charge that breaks it.  
       - Does it break? **Yes**.  
       - Is it brittle pre-impact? **Both: Yes**.  
       - Conditional true? ("If struck, it breaks") **Both: Yes** (due to the charge).  
     - **Bearing**: Tests if a repaired conditional can exclude mimic-like interference while affirming the disposition.  
     - **Predictions**:  
       - *Conditionalist*: Repair succeeds by requiring manifestation via the *pre-stimulus* state (e.g., "if struck *and* microstructure persists, it breaks").  
       - *Anti-reductionist*: Repair fails; the microstructure *is* the disposition, so the analysis is circular.  

  2. **Crux: Can masks be handled in self-masking dispositions?**  
     - **Case**: (b) A metal’s brittleness (lattice structure) causes ductility upon striking, preventing breakage.  
       - Is it brittle? **Both: Yes** (due to lattice).  
       - Conditional true? ("If struck, it breaks") **Both: No** (it never breaks).  
     - **Bearing**: Tests if a conditional can account for inherent masking without invoking the disposition.  
     - **Predictions**:  
       - *Conditionalist*: Repair succeeds by adding "no lattice-change" to antecedent (non-dispositional).  
       - *Anti-reductionist*: Repair fails; "lattice-change" is causal power (dispositional).  

  3. **Crux: Can probabilistic dispositions reduce to non-dispositional probabilities?**  
     - **Case**: (c) A substance cracks under stress in 1/3 of trials due to stochastic micro-events.  
       - Disposition present? **Both: Yes** (probabilistic fragility).  
       - Deterministic conditional? ("If stressed, it cracks") **False**.  
       - Probabilistic conditional? ("If stressed, P(crack) = 1/3") **True**.  
     - **Bearing**: Tests if probability obviates irreducible dispositions.  
     - **Predictions**:  
       - *Conditionalist*: Probabilistic conditionals suffice (no dispositions needed).  
       - *Anti-reductionist*: Probability *is* a disposition (propensity).  

  4. **Crux: Can temporary dispositions reduce to time-indexed conditionals?**  
     - **Case**: (d) A substance shatters on first impact; post-shattering, it is unbreakable.  
       - Pre-impact disposition? **Both: Yes**.  
       - Pre-impact conditional? ("If struck, it shatters") **True**.  
       - Post-impact disposition? **Both: No**.  
       - Post-impact conditional? **False**.  
     - **Bearing**: Tests if time-relativity avoids irreducible states.  
     - **Predictions**:  
       - *Conditionalist*: Time-indexed conditionals (e.g., "at t, if struck at t, it shatters") suffice.  
       - *Anti-reductionist*: The conditional’s truth depends on a categorical state (the disposition at t).  

  ---

  #### Analysis of Cases  
  | Case | Disposition Present? | Conditional True? ("If S, then M") | Conditionalist Accommodation                                                                 | Anti-Reductionist Accommodation                                                               |  
  |------|----------------------|-----------------------------------|----------------------------------------------------------------------------------------------|----------------------------------------------------------------------------------------------|  
  | (a)  | Yes (pre-impact)    | Yes (breaks via charge)           | Repair: Manifestation must result from pre-stimulus state (non-dispositional structure).     | Disposition is real but finked; breaking is coincidental (mimic). Conditionals lack explanatory depth. |  
  | (b)  | Yes                 | No                                | Repair: Add "no lattice-change" to antecedent (structural clause).                           | Disposition is real but self-masking; its causal power explains the conditional’s falsity.           |  
  | (c)  | Yes                 | False (deterministic); True (P=1/3) | Probabilistic conditionals capture disposition reductively.                                  | Probability is an irreducible disposition (propensity).                                       |  
  | (d)  | Yes (pre-impact)    | True (pre-impact); False (post)   | Time-indexed conditionals capture temporary dispositions.                                    | Disposition is a transient categorical state grounding the time-indexed conditional.         |  

  ---

  #### Closing Sections  

  **What Would Count Against Their Own Position?**  
  - **Conditionalist**: A conceptual proof that *all* repairs of the conditional analysis (for finks/masks/mimics) require dispositional primitives (e.g., "causal basis" or "normal conditions" defined dispositionally).  
  - **Anti-Reductionist**: Empirical discovery that disposition ascriptions *never* explain behavior beyond what non-dispositional conditionals predict (e.g., in quantum mechanics).  

  **Compatibility via Re-description?**  
  - **Conditionalist’s View**: Anti-reductionism can be re-described as conditionalism if "real properties" are just structural bases for conditionals. *But* anti-reductionists reject this; they see structures as inherently dispositional.  
  - **Anti-Reductionist’s View**: Conditionalism can be re-described as anti-reductionism if "conditionals" are epistemic glosses on real dispositions. *But* conditionalists deny dispositions exist beyond conditionals.  
  - **Conclusion**: Neither party believes re-description achieves compatibility. The dispute is substantive: conditionalism demands reducibility; anti-reductionism denies it.  

