prompt: |-
  I run a small regional museum — 40,000 objects, four full-time staff, an endowment that covers about half our operating costs. Twice in the last five years the board has had to consider selling something to keep the lights on, and both times we muddled through on vibes and one very loud trustee. I want a procedure we can actually run in a 45-minute board meeting the next time a sale is proposed, and I want it built on the philosophy of hard choices rather than on museum-sector boilerplate — I already know the professional ethics say dont do it, and that isn't much help when the alternative is closing the doors. The board is nine people, none of whom have read any philosophy, and they're the ones who sign off.

  Here's the toolkit I've assembled from my reading, and it's what I want the procedure built on. (1) Two options can be such that neither is better, neither is worse, and they aren't equal either — call that being on a par. The test: improve one of them slightly; if it still isn't better than the other, they were never equal, so don't call it a tie and don't just flip a coin. (2) Incomparability is local, not global: two things can be on a par while each is clearly better or worse than plenty of other things, so you can often get a real answer by comparing neighbours instead of hunting for a common currency. (3) But if you let yourself chain small, individually plausible improvements, you can prove a paperclip is worth more than a Rembrandt, so anything leaning on (2) needs a tripwire for chains. (4) When two options are on a par, committing to one can itself make it the thing to do — choosing isn't just what happens after the weighing is over.

  Turn that into a decision procedure: the questions in order, what counts as an answer good enough to move on, where it stops with a no, where it has to hand the decision to a person because the fight is about values rather than facts, and how to tell when the procedure is doing real work versus laundering a decision somebody already made. Then run it on three proposals: selling a middling landscape by a name people have heard of, to replace the roof; selling a small object that a descendant community says was taken from them; and selling the one picture in the collection good enough to be on a postcard, which would fund about a decade of operations. I expect to dislike at least one of the answers, that's fine. And tell me what the procedure can't do.
reasoning: |-
  Okay, the user runs a small regional museum with 40,000 objects and a tight budget. They've faced financial crises twice in five years where selling art was considered. The board isn't well-versed in philosophy, and they need a practical 45-minute decision procedure. The user wants this grounded in specific philosophical concepts about value comparisons and hard choices, not just standard museum ethics which say "don't sell."

  The user provided a toolkit based on four philosophical ideas: options that are "on a par" rather than equal, local comparability, the danger of chaining small improvements, and the role of commitment in decision-making. They want a structured procedure that can be applied to three specific scenarios: selling a middling landscape for roof repairs, selling an object with contested ownership, and selling their most iconic artwork for long-term funding.

  First, I need to translate these abstract philosophical concepts into concrete steps a board can follow quickly. The core challenge is creating actionable questions that force value comparisons without getting bogged down in theoretical discussions. The procedure must: identify when items are truly incomparable, prevent slippery slope arguments, and force decisive commitment when options are on par.

  For the three test cases: the landscape sale seems most justifiable under this framework since it's pragmatically comparable to roof repairs. The contested object introduces moral dimensions that defy direct comparison with money. The postcard-worthy masterpiece highlights how chains of reasoning can distort value - its sale might fund operations but could destroy institutional identity through small logical steps.

  The procedure's limitations are important to acknowledge: it can't resolve deep value conflicts or magically create good options. It's designed to clarify when choices are truly hard versus when one option is objectively better. For this board, the key is preventing rash decisions while recognizing that sometimes selling is the least bad option.

  I should emphasize practical implementation: strict timeboxes for discussion, visual comparison tools, and the "tripwire" concept to stop chains of reasoning. The chair's role in enforcing structure will be crucial for keeping this within 45 minutes. Most importantly, the procedure must feel like a tool rather than an obstacle to the time-pressed board.
answer: |-
  Here's a 45-minute "Hard Choices" decision procedure for your board, built directly on your philosophical toolkit. It focuses on structured comparison, flags true value conflicts, prevents slippery slopes, and forces explicit commitment when options are on a par.

  **The "Par Value" Decision Procedure**

  **Goal:** Determine if selling a specific object is the right *hard choice* for the museum *at this time*, compared to the alternative (e.g., cutting programs, staff, or closing). Not *if* selling is *ever* acceptable in the abstract.

  **Input:** A concrete proposal: *Sell Object X to Fund Need Y.*
  **Output:** A clear "Yes," "No," or "Commit" decision on the proposal.

  **Roles:**
  *   **Chair:** Enforces time/structure, guides comparisons, identifies stalemates.
  *   **Director (You):** Provides context (significance of X, impact of losing X, reality of Need Y, alternatives explored/failed), *not* advocacy.
  *   **Board:** Asks clarifying questions, makes comparisons, decides.

  **Procedure (Strict 45-Minute Timebox):**

  1.  **Frame & Facts (5 mins):**
      *   Chair states: *"We are deciding: Sell Object X to Fund Need Y."*
      *   Director provides *succinct* (<3 min) context:
          *   *Object X:* Significance (artistic, historical, community, uniqueness within collection, prominence), provenance clarity (any known claims?).
          *   *Need Y:* Cost, urgency, consequences of *not* funding it now (e.g., "Roof leaks damage storage," "Operating deficit forces closure in 6 months").
          *   *Alternatives Exhausted?* Briefly confirm grants denied, fundraising failed, cuts impossible.
      *   Board asks *factual* clarifying questions only.

  2.  **The Core Comparison: Is "Selling X" Better Than "Not Funding Y"? (15 mins)**
      *   Chair: *"Directly compare the two options:*
          *   *Option A: Sell Object X -> Fund Need Y -> Consequences.*
          *   *Option B: Keep Object X -> Don't Fund Need Y -> Consequences.*
          *   *Is A clearly better than B? Is B clearly better than A? Or is neither clearly better?"*
      *   **Discussion Focus:** Force direct comparison of concrete outcomes. Does keeping X feel worth the immediate, severe harm of not funding Y? Does funding Y feel worth the concrete loss of X?
      *   **Good Enough Answer to Move On:**
          *   **Clear Answer (Yes/No):** If strong consensus emerges (e.g., "Losing X is trivial, saving Y is critical" -> Yes; "Losing X destroys us, Y is manageable" -> No). **Proceed to Step 6.**
          *   **Clear "On a Par":** If the board consistently feels "Both outcomes are bad, but neither option is clearly *better* than the other." **Proceed to Step 4.**
          *   **Deadlock/Incomparable:** If stuck debating abstract values ("Art vs. Money," "Ethics vs. Survival") without connecting to *these specific outcomes*. **Proceed to Step 3.**

  3.  **Local Comparison Tripwire (10 mins - Only if Step 2 Deadlocks)**
      *   Chair: *"Since direct comparison is hard, find a 'neighbour':*
          *   *Imagine a slightly different Object X' (e.g., less significant, more significant). Would selling X' to fund Y be clearly better/worse?*
          *   *Imagine a slightly different Need Y' (e.g., less urgent, more costly). Would selling X to fund Y' be clearly better/worse?"*
      *   **Discussion Focus:** Can shifting the object or need slightly make the choice clearer? Does *this specific* X feel vastly different than a slightly lesser object? Does *this specific* Y feel vastly different than a slightly less critical need?
      *   **Tripwire:** If someone tries to chain comparisons ("Selling X funds Y, which prevents selling Z later..."), Chair intervenes: *"Stop. We are only comparing *this specific* sale for *this specific* need. Chaining invalidates the comparison."*
      *   **Good Enough Answer to Move On:**
          *   **Clarity Achieved:** If local comparisons clarify that Option A or B is better for *these specifics*. **Proceed to Step 6.**
          *   **"On a Par" Confirmed:** If even neighbours don't break the stalemate. **Proceed to Step 4.**
          *   **Still Incomparable:** If values conflict persists ("The principle of not selling *any* art is absolute for me, regardless of neighbours"). **Proceed to Step 5.**

  4.  **Commitment Moment (5 mins - Only if "On a Par" from Step 2 or 3)**
      *   Chair: *"These options appear on a par – neither is clearly better, worse, or equal. Choosing *itself* creates a reason. By committing to sell X to fund Y, we affirm that securing the museum's immediate function is paramount *in this crisis*. By committing to keep X and not fund Y, we affirm that preserving this object's integrity is paramount, even at significant risk. We cannot avoid choosing. Which commitment aligns with the core identity and survival strategy of *this museum* right now?"*
      *   **Discussion Focus:** Brief, values-based. What action defines who we are *in this moment*? Survival through sacrifice, or principle despite risk?
      *   **Outcome:** Vote on the proposal (Sell/Don't Sell). **Proceed to Step 6.**

  5.  **Value Conflict Resolution (5 mins - Only if Step 3 Still Incomparable)**
      *   Chair: *"This isn't about facts or comparisons; it's a fundamental conflict of values within the board. No procedure can resolve this. We must vote based on individual judgment."*
      *   **Discussion Focus:** None. Vote immediately on the proposal (Sell/Don't Sell). **Proceed to Step 6.**

  6.  **Decision & Record (5 mins):**
      *   Chair states the decision clearly ("The board approves selling X to fund Y" / "The board rejects selling X to fund Y").
      *   Chair ensures the rationale is recorded:
          *   *Clear Better/Worse (Step 2/3)?* E.g., "Funding roof critical, loss of X deemed acceptable."
          *   *On Par - Commitment Made (Step 4)?* E.g., "Options on par; committed to survival through sale."
          *   *Value Conflict - Vote (Step 5)?* E.g., "Irreconcilable value conflict; sale approved/rejected by vote X-Y."
      *   **Stop.**

  **How it Does Real Work vs. Laundering:**
  *   **Real Work:** Forces direct outcome comparisons (Step 2). Exposes *why* a choice is hard (Steps 2-4 deadlock). Prevents slippery slopes (Step 3 Tripwire). Makes values conflicts explicit (Step 5). Forces accountability via recorded rationale (Step 6). The "Commitment" step (4) actively shapes the institution's identity through the choice.
  *   **Laundering:** If the board rushes Step 2 to avoid hard comparisons. If the Chair allows abstract debates or chaining in Steps 2/3. If the "Commitment" language is used disingenuously to mask a pre-made decision. Rigorous timekeeping and the Chair's role are crucial to prevent this.

  **Applying the Procedure to Your Proposals:**

  1.  **Selling the Middling Landscape (by a known name) for the Roof:**
      *   **Step 2:** Compare: Loss of a "middling" (lower significance within collection) but recognizable name vs. Prevented physical damage to collection/staff/public. Likely Outcome: **Clear Answer.** Keeping the roof intact is *clearly better* than keeping this specific painting. Selling is likely approved quickly. *Philosophy in Action:* Local comparability works – this specific object vs. this specific need. The object isn't foundational.

  2.  **Selling the Small Object with Descendant Community Claim:**
      *   **Step 2:** Compare: Loss of object + Violation of ethical/duty to community + Potential reputational harm vs. Funding Need Y (e.g., deficit). Likely Outcome: **Deadlock/Incomparable.** Money vs. Repatriation ethics/relationship. Hard to say one outcome is *better*.
      *   **Step 3 (Local Comparison):** Neighbour 1: A *different* unclaimed object? Selling that might be clearly better. Neighbour 2: A *less critical* funding need? Selling for that might be clearly worse. **Tripwire:** Chaining ("Selling this might lead to selling others...") is stopped. Likely Outcome: **"On a Par" Confirmed.** The core conflict remains.
      *   **Step 4 (Commitment):** *Commitment to sell:* Prioritizes financial survival over ethical obligation/relationship. *Commitment not to sell:* Prioritizes ethical obligation/relationship despite financial risk. **Decision:** Highly board-dependent. The "loud trustee" might force a commitment, but the procedure forces them to frame it as an identity choice: "We are an institution that honors provenance claims, even when it's hard" vs. "We are an institution that survives by any legal means." *Philosophy in Action:* True incomparability (money vs. ethics), resolved by commitment, not finding a "common currency." The choice *creates* the reason.

  3.  **Selling the "Postcard Picture" (Masterpiece) for a Decade of Ops:**
      *   **Step 2:** Compare: Loss of the collection's *defining* masterpiece, core to identity, visitation, reputation vs. Financial security/stability for 10 years. Likely Outcome: **Deadlock/Incomparable.** Existential threat to identity vs. existential threat to operations. Neither clearly better.
      *   **Step 3 (Local Comparison):** Neighbour 1: Selling a *slightly less* iconic picture? Might feel clearly worse (losing identity for less gain) or still hard. Neighbour 2: Funding *only 1-2 years* of ops? Selling the masterpiece seems clearly worse. **Tripwire: CRITICAL.** Someone *will* try to chain: "Selling lesser items over time could fund operations without losing *the* masterpiece..." Chair **MUST** enforce: "Stop. We are *only* comparing selling *this specific object* for *this specific decade of funding*. Chaining is off limits." Likely Outcome: **Still "On a Par" or Value Conflict.** The core agony remains.
      *   **Step 4 (Commitment) or Step 5 (Vote):** *Commitment to sell:* Prioritizes long-term operational survival over institutional identity defined by this object. "We become a different museum, but a solvent one." *Commitment not to sell:* Prioritizes preserving the core artistic identity and value proposition, betting on finding another way to survive. "We remain *this* museum, even at great risk." **Decision:** Extremely difficult. The procedure forces confronting that this isn't just "sell/not sell," but "what *kind* of institution survives?" *Philosophy in Action:* Highlights danger of chaining (Step 3 Tripwire essential). Pure "on a par" requiring deep commitment defining the institution's future essence.

  **What the Procedure CAN'T Do:**

  1.  **Create Good Options:** It only compares the proposed sale vs. the consequence of *not* funding the need. It can't magically find grants or donors.
  2.  **Resolve Deep Value Conflicts:** If the board is fundamentally split on core values (e.g., "Art is sacred" vs. "The institution is paramount"), Step 5 just forces a vote. It doesn't create consensus.
  3.  **Predict the Future:** It assesses the choice *now*, based on current knowledge. Unforeseen consequences (market crash, donor backlash, discovery of new info about the object) aren't factored.
  4.  **Override Fiduciary Duties:** If selling violates laws, donor agreements, or accreditation standards in a way that would destroy the museum, that's a hard "No" before the procedure starts. (The procedure assumes the sale is *legally* possible but *ethically* fraught).
  5.  **Guarantee a "Right" Answer:** It structures the decision and forces rigor, but for true hard choices, there may be no objectively "right" answer, only a choice made with clarity about the trade-offs and values at stake.
  6.  **Make Emotional Choices Easy:** Selling a beloved object will hurt. This procedure makes the *reasoning* clearer, not the emotion less painful.

  **Key for Your Board:** Emphasize that this is a tool for *crisis decisions only*, not routine deaccessioning. Its power is in forcing direct comparisons of concrete outcomes, blocking flawed reasoning chains, and making the values underlying a truly hard choice explicit before committing. It turns muddling through vibes into a structured, value-conscious, time-bound deliberation. Run a practice session on a hypothetical before the real crisis hits!
