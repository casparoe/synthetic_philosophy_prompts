  Okay, let me tackle this user's request. They need a teaching plan for a 90-minute session on standing to blame, targeting a mixed audience with polarized preconceptions. The core challenge is making the distinction between standing and other concepts like hypocrisy or wrongdoing land as a discovery rather than imposed taxonomy. 

  First, I consider the entry point. The user specifically banned overused examples like adulterous spouses or pot/kettle scenarios. I recall that institutional cases are flagged as important but undertheorized. A historical state hypocrisy example might work—something like colonial powers condemning human rights violations after similar past actions. But I worry this might be too politically charged for a mixed room. 

  Alternative idea: a corporation scenario. Imagine a tech company firing an employee for data privacy violations while having similar breaches in its own history. This avoids personal morality baggage while introducing institutional dimensions. It's contemporary, less emotionally loaded than adultery examples, and lets us explore collective responsibility naturally. Crucially, it contains all necessary elements: a blameworthy act (employee's breach), the blamer's compromised position (company's past violation), and avoids conflating issues (the breach remains objectively wrong regardless of standing).

  Now sequencing the conceptual build. We must establish three foundation stones before even mentioning "standing": 
  1. Objective wrongness (the act is bad independently) 
  2. Blamer's moral position (hypocrisy as separate issue) 
  3. Standing as distinct gatekeeper (who gets to call it out). 

  The institutional layer should come early—not as an afterthought—by using the corporate case from the start. This prevents audiences from anchoring on personal hypocrisy models. When misconceptions arise (like conflating "you can't say that" with "it wasn't wrong"), we'll intercept them immediately after establishing objective wrongness by emphasizing: "The breach is still fireable—we're only questioning whether HR should lead the investigation given their department's identical lapse last quarter."

  For the discovery moment, I visualize a flipchart with three columns: "Was it wrong?" (Yes), "Is blamer compromised?" (Yes), "So can they blame?" (That's the standing question!). The gasp should happen when they realize column three isn't automatically "No" just because column two is "Yes."

  The diagnostic question needs to bypass hypocrisy reflexes. Maybe: "If the company hires an external ethics auditor to deliver the condemnation, does that change the standing issue?" If they focus on the auditor's personal conduct rather than why the company needed outsourcing, they've missed the institutional dimension.

  Finally, boundaries: We'll explicitly bracket metaphysical debates about collective responsibility and legal standing analogies. Those are red herrings for this foundational session. The signal they're ready? When someone asks why the employee shouldn't just sue for unfair dismissal—that shows they're distinguishing standing from wrongness while seeing its practical consequences.
answer: |-
  Here’s a plan for your ninety-minute session, structured as continuous prose for your train ride. The core example is a **corporation that profited from child labor in its supply chain decades ago, now publicly shaming a competitor for similar practices uncovered today**. This works because it avoids personal moral baggage, introduces institutional standing naturally, and sidesteps tired tropes while containing all necessary components: clear wrongdoing, a blamer with identical past behavior, and an impersonal context where "hypocrisy" feels inadequate to describe the problem.  

  Start cold: Don’t define "standing" upfront. Pose the corporate example starkly. Ask: *"Can this company credibly condemn its competitor? If not, why not—given the competitor’s actions *are* clearly wrong?"* Let the room argue. You’ll hear immediate appeals to hypocrisy ("They did it themselves!") and consequentialism ("Their condemnation is ineffective!"). Note these but don’t engage yet.  

  **Build the foundation in this order:**  
  First, isolate **objective wrongness**. Stress: The competitor’s use of child labor *is* indefensible, regardless of who points it out. Use quick hypotheticals: "If a saintly NGO condemns it, is it still wrong?" (Yes). "If the corporation stays silent, does the wrong vanish?" (No). This separates the act’s wrongness from reactions to it.  

  Second, distinguish **hypocrisy**. Ask: *"Suppose the corporation’s CEO never personally endorsed child labor—she’s new. Does *her* condemnation feel more legitimate, even if the company’s past is unchanged?"* Most will say yes. Highlight: Hypocrisy resides in the blamer’s *current* inconsistency (e.g., "We never did this!" when they did). But if the corporation acknowledges its past ("We did this, reformed, hence our stance"), the hypocrisy charge weakens—yet unease about their *standing* may persist. This uncovers standing as separate: It’s about moral *authority*, not consistency.  

  Third, **introduce standing explicitly** as the question: *"Does this entity’s own history *disqualify* it from being the right voice to blame, even if the act is wrong and they aren’t lying about their past?"* Use the corporation example: Its past creates a "taint" that undermines its legitimacy *as a blamer*, irrespective of truthfulness or the competitor’s guilt.  

  **Now tackle institutions:** Pivot to *"What if the blamer is a state?* Imagine Country A, which colonized and exploited Country B, now condemning Country C for invading Country D." Ask: *"Does A’s past alter the weight of its condemnation—even if C’s invasion *is* unjust?"* Probe: Is institutional standing just the sum of individual officials’ hypocrisy? No—institutions endure beyond individuals. Their historical acts create ongoing moral "debts" that may void their standing to judge similar harms, regardless of current leadership. Standing here is about the *institution’s* moral continuity.  

  **Anticipate misconceptions in sequence:**  
  1. **"So it’s just hypocrisy!"** (Will arise early). Head off after distinguishing hypocrisy: *"Hypocrisy is about dishonesty. Standing asks: Even if fully honest, does your history make you a *distorting* voice?"*  
  2. **"But if they can’t speak, the wrong gets ignored!"** (Consequentialism). Intercept after establishing objective wrongness: *"We’re not silencing anyone. We’re asking *who* should speak to give the condemnation moral force. The wrong remains."*  
  3. **"You can’t say that → So it wasn’t wrong" slide.** Crush this the moment objective wrongness is secured. Repeat: *"Standing doesn’t erase the wrong. It asks whether *this* blamer amplifies or muffles the condemnation’s resonance."* Use metaphor: "A cracked bell can still be right about the time, but its sound may not carry."  
  4. **"Individuals change! Institutions reform!"** Address after institutional discussion: *"Reform may restore standing, but it’s not automatic. We must ask: Has the entity done the work to *earn* the right to judge this specific wrong?"*  

  **Diagnostic question:** Put this to the room late: *"Imagine the corporation condemns the competitor *not* for child labor, but for toxic waste dumping—a harm it *never* engaged in. Does your unease about their standing disappear?"* If they grasp the distinction, they’ll say yes—standing is context-specific to the *type* of wrong. If they still object ("But they’re generally unethical!"), they’re stuck in hypocrisy/general moral desert.  

  **Explicitly bracket:** Announce early: *"We’re not debating whether blame *should* be voiced—only *who* gets to voice it credibly. We’re also not discussing legal standing, forgiveness, or whether time ‘heals’ moral debts—those are for deeper dives."*  

  **Why this flow works:** It starts with visceral institutional cases to bypass personal hypocrisy reflexes. The corporate example avoids emotional landmines while forcing engagement with collective agency. By sequencing concepts (wrongness → hypocrisy → standing), you make standing emerge as the unseen layer beneath the familiar debates. The room discovers it as the missing piece that explains their unease when hypocrisy feels insufficient.
