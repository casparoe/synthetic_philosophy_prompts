prompt: |-
  I sit on the planetary-protection advisory panel of a national space agency, and we must settle how to classify what our returning probe will bring back next year. The instruments describe a microscopic system that maintains a membrane and an ion gradient, runs a self-sustaining metabolic cycle, and copies a template in order to reproduce — but with such fidelity that no heritable variation arises, so the population never evolves. If we declare it "life," it falls under the agency's strictest containment rule: no distribution to laboratories, sterilization of the canister on entry, and a hold on any further missions to the source body until the rule is revisited. If we declare it "non-life," ordinary sample handling applies and the science proceeds quickly. The panel has split. One faction holds that the question is settled by stipulation: "life" is a term of art, we should define it by whatever serves the containment rule's purpose, and since this thing is inert with respect to evolution it poses no biohazard and should be classed as non-life. The other insists that "life" names something real, that a definition must track the phenomenon rather than our convenience, and that a membrane-bounded, metabolizing, self-reproducing system is alive whether or not it happens to evolve — noting that we already count sterile organisms and mules as alive, so "capable of evolution" cannot be doing the work the first faction wants. Draft the written recommendation I will circulate before the vote: a concrete classification, the reasoning behind it, any conditions or review timeline attached (including what should trigger reconsideration if later analysis shows the system can vary and be selected), and a fair statement of the strongest case for the classification I am rejecting.
reasoning: |-
  Okay, the user is on a planetary protection advisory panel and needs to draft a recommendation about classifying a microscopic system from a space probe. The system has a membrane, ion gradient, metabolism, and reproduces without heritable variation. The panel is split between declaring it life (strict containment) or non-life (normal handling).

  First, I need to understand both sides. The "stipulation" faction wants to define life based on containment purposes, arguing no evolution means no biohazard. The "phenomenon" faction says life is real and points to sterile organisms like mules as alive without evolution. 

  The user needs a balanced recommendation. They must make a concrete classification with reasoning, conditions for review, and a fair summary of the opposing view. The stakes are high: misclassifying could risk contamination or hinder science.

  Key points: The system lacks heritable variation, which is crucial for evolution. But it performs other life-like functions. Comparing it to Earth life is tricky—sterile organisms are still considered alive because they come from evolving populations. Here, the entire population is static. 

  The most solid approach is to classify it as non-life but with major precautions. The reasoning should emphasize that without evolution, there's no Darwinian biohazard, which is the core concern of planetary protection. However, acknowledging its complexity requires strict handling protocols beyond normal non-life samples. 

  Conditions for review are essential. If later studies show any heritable variation, it should be reclassified immediately. Also, setting a timeline for reassessment ensures ongoing scrutiny. 

  Need to present the opposing view fairly: the phenomenon faction's argument that metabolism and reproduction define life is valid, and dismissing it as non-life might undermine scientific principles. Their concern about setting a precedent is important. 

  Structuring the recommendation: executive summary, background, classification, reasoning (addressing both evolution and other life criteria), conditions, opposing view, and conclusion. Emphasize precaution without overreach. 

  Balancing act: enabling science while protecting Earth. The containment rule is for biological risks, which evolution is central to. But the system's complexity warrants extra care, hence the tiered approach. 

  Final check: Is this defensible scientifically? Yes, based on current astrobiology consensus that evolution is key. Does it address both factions? By upholding the phenomenon argument's validity but prioritizing the containment rule's intent. Conditions allow flexibility if new data emerges.
answer: |-
  ## Recommendation: Classification of Returned Extraterrestrial System

  **Classification:** **Non-life** (with enhanced handling protocols - Tier 2)

  **Reasoning:**

  1.  **Core Argument: Absence of Evolutionary Potential:** The fundamental purpose of the strictest containment rule ("life" classification) is planetary protection, specifically preventing the introduction and potential proliferation of extraterrestrial biological entities that could pose a hazard to Earth's biosphere. This hazard inherently depends on **Darwinian evolution** – the capacity for variation, selection, adaptation, and potential ecological interaction or competition. The probe data conclusively demonstrates the system lacks heritable variation. Without this mechanism, the system is evolutionarily inert. It cannot adapt, diversify, or present the uncontrolled biological risk the strictest containment rule is designed to mitigate.
  2.  **Functionality vs. Biological Agency:** While the system exhibits remarkable complexity (membrane, ion gradient, metabolism, template-based replication), these functions operate with perfect fidelity and zero variation. It resembles a supremely sophisticated, self-sustaining, self-replicating chemical machine. Its "reproduction" is akin to photocopying, not biological reproduction which inherently includes the *potential* for errors leading to variation. A sterile mule or organism, while incapable of reproduction *itself*, is a product of an evolutionary lineage *with* variation. This system lacks that lineage and potential entirely.
  3.  **Intent of the Containment Rule:** Interpreting the term "life" within the regulatory framework must prioritize the *purpose* of the rule: preventing biohazards arising from evolving biological systems. Applying the strictest containment to a system demonstrably incapable of evolution would be disproportionate to the actual risk and hinder scientific progress without commensurate safety benefit.
  4.  **Scientific Precedent (Astrobiology):** Major astrobiological definitions (e.g., NASA's working definition) emphasize evolution as a key component of life. Systems lacking this potential are often categorized as "pre-biotic" or "proto-biological," even if complex, falling outside the strict "life" designation for planetary protection purposes.

  **Conditions & Review Timeline:**

  1.  **Enhanced Handling (Tier 2):** While classified as "non-life," the system's complexity warrants precautions beyond ordinary sample handling. Samples shall be:
      *   Housed in BSL-3 containment initially.
      *   Subject to rigorous, non-destructive analysis protocols first (e.g., advanced imaging, spectroscopy, non-invasive biochemistry).
      *   Only released for destructive analysis or distribution to external labs *after* Phase 1 analysis confirms the absence of novel bioactive molecules, toxins, or unexpected complexity posing non-evolutionary risks (e.g., chemical contamination, catalytic disruption). A specific review gate is required before destructive analysis/distribution.
  2.  **Trigger for Immediate Reconsideration (Red Flag):** **Any credible evidence, from ongoing analysis of the returned sample, of heritable variation in the template replication process OR the emergence of selectable phenotypic variation within the population** automatically triggers a mandatory, expedited panel review. Discovery of such evidence would necessitate immediate reclassification as "life" and implementation of the strictest containment protocols.
  3.  **Formal Review Timeline:** Regardless of findings, a comprehensive panel review of the classification will occur **no later than 24 months after sample return**, incorporating all data obtained during initial analysis. This review will formally confirm or revise the classification based on accumulated evidence.

  **Strongest Case for the Rejected Classification ("Life"):**

  The opposing faction presents a compelling argument rooted in the fundamental phenomenology of life as observed on Earth. They contend that "life" is not merely a term of regulatory convenience but denotes a distinct natural category characterized by specific, observable processes. A system that actively maintains a disequilibrium state (via membrane and ion gradient), harvests energy to fuel a self-sustaining metabolic cycle, and possesses a mechanism for faithful self-replication based on a heritable template exhibits the core hallmarks of living organisms. The absence of heritable variation, they argue, is an incidental feature of *this specific system*, not a disqualifier for life itself. They rightly point out that we unambiguously classify sterile organisms (like mules or worker bees) and organisms in static environments (like ancient microbial spores) as "alive," despite their current lack of evolutionary activity, because they possess the underlying machinery and potential derived from an evolutionary lineage. Classifying this system as "non-life" based solely on the lack of variation, they argue, creates an arbitrary and scientifically unsound precedent, potentially undermining the coherence of our definition and risking the mishandling of genuinely novel biological entities that simply operate differently. Their position emphasizes caution based on the intrinsic properties observed, rather than the contingent potential for evolution.

  **Conclusion:**

  Based on the conclusive evidence of zero heritable variation and the consequent elimination of the core biohazard (evolutionary proliferation) that justifies the strictest containment rule, the system is recommended for classification as **Non-life**. However, acknowledging its significant complexity and potential for novel chemistry, **enhanced Tier 2 handling protocols** are mandated. This approach balances planetary protection imperatives by directly addressing the *source* of bio-risk (evolution) while enabling timely and responsible scientific investigation. The classification includes robust safeguards: immediate review upon any evidence of variation, a mandatory 24-month reassessment, and strict initial containment and analysis procedures. This ensures both scientific progress and planetary safety are prioritized appropriately.
