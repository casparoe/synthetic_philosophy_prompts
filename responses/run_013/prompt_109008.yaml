prompt: |-
  I'm a novelist, and for the better part of a year I've been researching a book set among a Liverpool merchant family during the abolition campaigns. I mention that only so you understand the shape of my ignorance: my characters have to argue about these things over dinner, and I want to know what they would actually be saying. I've been reading popular history rather than monographs, and the book I have just finished offers what it presents as the modern consensus on why moral revolutions happen, in roughly these words: 'Historians used to think slavery and dueling ended because people were finally persuaded by moral argument — the pamphlets, the speeches, the philosophy of natural rights. Two lines of work have demolished that story. An economic historian showed that British abolition was really driven by the declining profitability of the plantation economy and the rise of free-trade interests, which is why the book calls it the Williams thesis (I assume the historian, not the philosopher of moral luck); on that account the moral arguments were essentially window dressing. And a philosopher, Kwame Anthony Appiah, has shown that dueling in England and footbinding in China were ended not by argument but by honor: people stopped because the practice became shameful, and shame is a matter of social standing rather than moral truth. Taken together, this shows that moral revolutions are not rational responses to better arguments at all: they occur when interests shift or when the code of honor happens to move, and the moral justifications people offer afterwards are stories they tell themselves.'

  Please take the role of a philosopher who works on how moral norms actually change, and give me a careful audit rather than a verdict. I'd like you to think first about what distinguishes a causal explanation of a change from an assessment of the reasons for it, and about which of these three explanations — argument, interest, honor — is even answering the same question as the others; then work through the summary more or less sentence by sentence and tell me which parts a specialist would accept, which are common simplifications they'd wince at, and which are simply wrong, being explicit about what each original view does and does not claim. I am especially interested in whether the book's concluding claim follows from anything true in the earlier sentences, and in what a defender of the older 'argument' story could still say on his own behalf. Please don't give me a reading list or citations — I want the analysis, not the bibliography — and if any sentence in the summary is ambiguous in a way that would change your verdict, say so and tell me which reading you are adopting.
reasoning: |-
  Okay, the user is a novelist researching abolition-era Liverpool for a book. They need their characters to debate abolition authentically over dinner. They've encountered a simplified historical thesis claiming moral revolutions (like ending slavery) are driven by economics or honor, not moral arguments. They want a philosopher's audit of this claim - not just verdicts, but distinctions between types of explanations.

  Hmm... first I need to unpack the core confusion here: the book conflates three distinct explanatory levels. The "moral arguments" view is about justification (why people thought abolition was right), while Williams' economic thesis and Appiah's honor theory are about causation (what actually made it happen). That's like comparing apples to wrenches. 

  The user's summary makes five key claims I should address sequentially:
  First claim: Historians believed moral arguments alone ended slavery. 
  Overstatement. Even early abolitionists like Clarkson documented economic factors. The simplification here erases how activists deliberately linked morality with interests (e.g. "sugar boycott hurts profits"). 

  Second claim: Williams proved profitability decline caused abolition. 
  Major wince. Williams argued capitalism outgrew slavery, but his data was shaky. Modern consensus says: yes, economic shifts mattered (e.g. industrialists vs. planters), but as enablers not drivers. Crucially, slavery was still profitable when abolished. 

  Third claim: Appiah showed honor/shame ended dueling/footbinding, not argument. 
  Mostly sound, but oversimplified. Appiah's key insight is that status anxiety triggers change, but he doesn't deny arguments prepared the ground. For footbinding, missionary arguments fused with nationalist shame. 

  Fourth claim: Moral revolutions aren't rational responses to arguments. 
  Dangerous overreach. Even if arguments don't immediately change minds, they reshape the "moral ecosystem" over decades. Wilberforce's speeches gave cover for merchants to defect without losing status. 

  Fifth claim: Moral justifications are post-hoc stories. 
  Half-truth. People do rationalize, but abolitionists used moral framing strategically from the start. Liverpool merchants citing "Christian duty" weren't necessarily lying - the language shaped their self-perception. 

  What would a defender of the "argument" view say today? That moral rhetoric: 
  1) Created coalition glue between evangelicals, workers, and businessmen 
  2) Allowed economic actors to reinterpret their interests ("ethical capitalism") 
  3) Weaponized shame by making slave-holding incompatible with British identity 

  For the novelist's dinner scene: the real debate wouldn't be "morality vs. economics" but characters wrestling with all three lenses. A Liverpool merchant might call abolition "inevitable progress" while secretly calculating Caribbean investments, as his wife shames him with Quaker pamphlets. That's the rich tension the simplified thesis misses.
answer: |-
  As a philosopher of moral change, I'll audit this summary rigorously. Let's dissect it conceptually before addressing specifics. Crucially, we must distinguish:

  1.  **Causal Explanation:** *What socio-historical forces actually produced the change?* (e.g., economic pressure, social shaming)
  2.  **Reasons/Justification:** *What arguments did agents offer (sincerely or not) for changing/keeping the norm?* (e.g., natural rights, biblical ethics)
  3.  **Rationale:** *What reasons, if any, genuinely motivated key actors?* (Often opaque, overlapping with 1 & 2)

  The "argument," "interest," and "honor" theses aren't directly comparable. "Argument" primarily addresses *justification/rationale*, while "interest" and "honor" propose *causal mechanisms*. The summary conflates these levels.

  **Sentence-by-Sentence Audit:**

  1.  **"Historians used to think slavery and dueling ended because people were finally persuaded by moral argument..."**
      *   **Simplification/Wince:** This is an oversimplification of older historiography. Serious historians *always* acknowledged multiple factors (religion, politics, economics). The "Whig history" view (inevitable moral progress) was popularized but nuanced scholars like Davis (1966) explored the *rhetorical function* of arguments within complex systems. Few claimed *only* argument mattered.

  2.  **"Two lines of work have demolished that story."**
      *   **Overstatement:** They've *challenged* and *complicated* the "pure moral progress" narrative, not demolished it. The relationship between moral arguments and other factors remains intensely debated.

  3.  **"An economic historian showed that British abolition was really driven by the declining profitability of the plantation economy and the rise of free-trade interests..."**
      *   **Misrepresentation of the Thesis (Williams):** Eric Williams (*Capitalism and Slavery*, 1944) argued the *entire 18th-century slave system* fueled British industrial capitalism, but that by the late 18th/early 19th century, the *West Indian sugar interest* became a political/economic burden to *new industrial capitalists* who favored free trade. He saw abolition as an economic/political maneuver *by* this rising class, not *solely* due to declining plantation profits (which is debated – profitability wasn't uniformly collapsing in 1807/1833).
      *   **"Really driven by":** **Problematic.** Williams offered a powerful *economic context* and *political economy* explanation. Modern consensus (e.g., Seymour Drescher, David Brion Davis) rejects Williams' core claim that economic decline *caused* abolition. Evidence shows the slave trade and plantations were still profitable *when abolished*. Williams' thesis is seen as highlighting *enabling conditions* and *shifting power dynamics*, not the sole driver. His work *demolished* the idea that economics were irrelevant, not that argument was irrelevant.

  4.  **"...which is why the book calls it the Williams thesis (I assume the historian, not the philosopher of moral luck)..."**
      *   **Correct:** Yes, Eric Williams (historian, later PM of Trinidad & Tobago).

  5.  **"...on that account the moral arguments were essentially window dressing."**
      *   **Williams' View?** Largely yes, Williams was cynical about motives.
      *   **Specialist View?** **Rejected as Overly Simplistic.** Even critics of the "pure argument" view find this too stark. Moral arguments (especially religious ones from Evangelicals like Wilberforce, Clarkson, and the Quakers) were crucial for:
          *   Mobilizing mass public opinion (petitions, boycotts).
          *   Providing ideological cover for politicians.
          *   Framing the issue in terms of national identity ("Christian Britain").
          *   Legitimizing the economic/political actions of the "free trade" interests.
          They weren't the *sole* cause, but calling them "window dressing" ignores their constitutive role in shaping the *movement* that applied pressure.

  6.  **"And a philosopher, Kwame Anthony Appiah, has shown that dueling in England and footbinding in China were ended not by argument but by honor..."**
      *   **Broadly Correct, but Nuanced:** Appiah (*The Honor Code*, 2010) argues that shifts in *honor* and *social status* were the *primary proximate causes* for the rapid collapse of these specific practices.
      *   **"Not by argument":** **Ambiguous/Overstated.** Appiah doesn't claim arguments played *no role*. He argues arguments *alone* (e.g., moral tracts against dueling) were ineffective for centuries. What changed was that the practices became markers of *low status* or *backwardness* rather than honor. Arguments *contributed* to creating the conditions where the practice became shameful (e.g., linking footbinding to China's weakness; linking dueling to barbarism vs. modern gentlemanly conduct). The *effective trigger* was the shift in what conferred honor/shame.

  7.  **"Taken together, this shows that moral revolutions are not rational responses to better arguments at all..."**
      *   **Non Sequitur / Overgeneralization:** This conclusion does *not* follow logically from the premises.
          *   Williams' thesis (even in its strongest form) is about *slavery/abolition*, not all moral revolutions. Its validity for *that case* is contested.
          *   Appiah's thesis is about *specific practices* (dueling, footbinding) with strong honor components. It doesn't claim *no* moral revolution involves rational response to argument.
          *   Neither thesis proves people *never* change based on moral argument. They show that for *these specific changes*, other mechanisms (economic interest shifts, honor shifts) were *causally primary* or *necessary triggers*.
          *   "Rational responses" is slippery. Responding to shifts in perceived social standing (honor) *is* rational in a social context. Adopting positions aligned with new economic interests *is* rational in an economic context. The summary implies a narrow "dispassionate philosophical reasoning" view of rationality.

  8.  **"...they occur when interests shift or when the code of honor happens to move..."**
      *   **Partial Truth / Oversimplification:** Interests and honor are *powerful engines* of moral change. However:
          *   "Happens to move" undersells how honor codes shift – often influenced by arguments, material changes, geopolitical events, or deliberate activism.
          *   It ignores cases where arguments *do* play a primary role (e.g., shifts in views on animal cruelty in some contexts, some aspects of civil rights where legal/moral arguments were central *before* full economic shifts).
          *   It implies a passivity ("occurs when") that downplays the role of *agents* (abolitionists, reformers) strategically using arguments, appealing to interests, *and* manipulating honor codes.

  9.  **"...and the moral justifications people offer afterwards are stories they tell themselves."**
      *   **Controversial / Partly True:** This is a cynical view aligned with Williams and some readings of Appiah. Specialists would say:
          *   **Yes:** People (and societies) frequently engage in *post hoc* rationalization. Economic winners of abolition used moral language to legitimize their position.
          *   **But:** Moral justifications are often deployed *during* the struggle, not just afterwards. They are *tools* used by activists to *create* the shifts in interests and honor (e.g., making slave-holding shameful, framing free labor as economically superior). The language itself shapes perception and motivation. Sincerity is complex – many abolitionists genuinely believed the moral arguments, *even if* economic/honor factors aided their success.

  **What a Defender of the "Argument" Story Could Say:**

  1.  **Necessary (if not Sufficient) Cause:** Moral arguments created the conceptual space and vocabulary for criticizing slavery/dueling. Without arguments framing these as *moral problems*, economic interests or honor shifts wouldn't have targeted them specifically.
  2.  **Movement Building:** Arguments (especially religious ones) were essential for motivating the massive popular mobilization (petitions, boycotts, societies) that made abolition politically viable. Economics alone didn't create the Anti-Slavery Society.
  3.  **Shaping Interests & Honor:** Moral arguments *redefined* interests (e.g., ethical consumption via sugar boycotts) and *actively reshaped* honor codes (e.g., portraying slave traders as un-Christian, duelists as barbaric). Arguments didn't just follow these shifts; they helped cause them.
  4.  **Sincerity Matters:** For key figures (Wilberforce, Clarkson, Equiano), deep moral/religious conviction was the *primary* motivator. Dismissing this is bad psychology and history.
  5.  **Long-Term Causation:** Arguments plant seeds that take decades to bear fruit. The Enlightenment and Evangelical arguments of the mid-late 18th century created the conditions where the economic/honor shifts of the early 19th century could lead to abolition.

  **Conclusion on the Summary:**

  *   **Accepted:** Older "pure moral progress" narratives are outdated. Williams highlighted crucial economic/political dimensions. Appiah identified honor/shame as a key mechanism for specific practices. Moral arguments alone are rarely sufficient.
  *   **Simplifications/Winces:** Overstatement of Williams' claims and the decline in profitability; downplaying the contested nature of Williams' thesis; implication that arguments played *no* causal role ("window dressing," "not by argument"); overgeneralization from specific cases to all "moral revolutions"; the misleading "demolished" language; the implication that shifts "just happen."
  *   **Wrong/Doesn't Follow:** The conclusion that moral revolutions are "not rational responses to better arguments at all" and that justifications are *only* post-hoc stories. Williams' thesis does *not* support the "honor" claim, and together they don't support the sweeping conclusion drawn. The conflation of causal levels is fundamental.

  **For Your Novelists:** Their dinner debate would be richer for acknowledging this complexity. Characters could embody different positions:
  *   The pious merchant swayed by Clarkson's evidence and sermons.
  *   The pragmatic trader seeing Caribbean slavery as outdated economically, using moral language for respectability.
  *   The status-conscious matron horrified slavery makes Britain look barbaric to "enlightened" Europeans.
  *   The skeptic (a Williams precursor?) arguing it's all about money and power, morals are a cloak.

  The truth lies in the messy interplay of all these factors – argument, interest, and honor – not in a single "real" cause. The moral arguments weren't just window dressing; they were the paint, the scaffolding, and sometimes even the architects' blueprints, operating within a construction site shaped by economic forces and social climbers.
