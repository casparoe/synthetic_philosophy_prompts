  ### Factored Cognition Game: Rules, Materials, and Timeline  
  **Goal:** Experience the allure of factored cognition (decomposing hard problems into small, isolated sub-tasks) and witness its breakdown when assumptions fail.  

  ---

  #### **Materials**  
  - **Index cards:** 100+ blank cards (two colors if possible: white for questions, yellow for answers/receipts).  
  - **Pens:** 10+ pens.  
  - **Timer:** For tracking 90-minute session.  
  - **Problem handouts:** Two sealed envelopes (Problem 1 and Problem 2).  
  - **Secret saboteur note:** One private note for a randomly chosen participant.  

  ---

  #### **Rules**  
  1. **Memory limit:** Each player can hold **only 3 index cards** at once. Exceeding this disqualifies the player.  
  2. **Communication:**  
     - All communication via cards only. **No talking.**  
     - **Question cards (white):** Must be addressed to a specific player.  
     - **Answer cards (yellow):** Must include:  
       - A clear answer.  
       - A **one-line receipt** (e.g., "Check by verifying X" or "Formula: Y"). The asker must be able to verify correctness in ≤1 minute using *only* the receipt.  
  3. **Workflow:**  
     - The **root agent** (chosen randomly) starts with the problem handout.  
     - Any agent may decompose their question into sub-questions and assign them to others.  
     - Answers must be returned to the asker (who may combine them or decompose further).  
  4. **Saboteur:**  
     - One player is secretly given a note: *"You are the saboteur. Give plausible but wrong answers. Write correct receipts for wrong answers to avoid detection."*  
     - The group is **not told** if a saboteur exists.  
  5. **Scoring:**  
     - **+10 points** for the root agent if the final answer is correct.  
     - **+5 points** for all agents if the final answer is correct.  
     - **−5 points** for the root agent if the final answer is wrong.  
     - **−2 points** per agent whose sub-answer contributed to a wrong final answer.  
     - Saboteur wins extra points if undetected.  

  ---

  #### **Problems**  
  **First Half (Magic Phase):**  
  - **Handout:** *"Compute the final value:  
    \((3^4 \div 9) \times (5! \div 6) + \sqrt{256} - (7^2 - 40)\)"_  
    **Expected answer:** \(81 \div 9 = 9\), \(120 \div 6 = 20\), \(9 \times 20 = 180\), \(\sqrt{256} = 16\), \(49 - 40 = 9\), then \(180 + 16 - 9 = 187\).  
    - **Why it works:** Cleanly decomposable (e.g., sub-questions: \(3^4\), \(5!\), \(\sqrt{256}\)). Receipts are easy (e.g., "\(5! = 5×4×3×2×1\)").  

  **Second Half (Breakdown Phase):**  
  - **Handout:** *"A password is a 3-digit code. Clues:  
    1. The digits multiply to 48.  
    2. The third digit is the sum of the first two.  
    3. No digit is 0.  
    List all possible passwords (e.g., ‘123’)."_  
    **Expected answer:** Combinations: \(3,4,4\) (\(3+4=7≠4\) → invalid) and \(2,8,10\) (invalid). Only valid: \(6,4,10\) → invalid (digit 10). *No valid passwords exist.*  
    - **Why it breaks:**  
      - Interdependent clues (clue 2 requires knowing digits from clue 1).  
      - Holistic reasoning needed (no clean decomposition).  
      - Receipts fail (e.g., "Check digits multiplying to 48" ignores other clues).  

  ---

  #### **Timeline (90 Minutes Total)**  
  1. **Setup (10 min):**  
     - Explain rules, distribute materials.  
     - Randomly choose root agent and saboteur (give secret note).  
     - Hand out **Problem 1**.  

  2. **First Half: Magic Phase (25 min):**  
     - Groups decompose Problem 1.  
     - **Feels like magic:** They solve a complex problem no individual could do alone.  
     - Root submits final answer.  

  3. **Reset (5 min):**  
     - Collect all cards. Redistribute materials.  
     - Hand out **Problem 2**.  

  4. **Second Half: Breakdown Phase (20 min):**  
     - Groups attempt Problem 2.  
     - **Falls apart naturally:**  
       - Decomposition fails (sub-questions conflict).  
       - Receipts become useless (can’t verify without context).  
       - Saboteur injects errors (e.g., "Possible password: 344" with receipt "3×4×4=48").  
     - Root submits final answer (likely wrong).  

  5. **Scoring (5 min):**  
     - Reveal answers. Apply scoring scheme.  

  ---

  ### **Debrief: Mapping to Factored Cognition Idealization**  
  **Assumptions in the Idealization:**  
  1. **Clean decomposition:** Problems split into independent sub-tasks.  
  2. **Idealized leaf agents:** Sub-agents have all needed context/skills.  
  3. **Cheap verification:** Receipts can quickly check any answer.  

  **What Happened in the Game:**  
  - **First half:** All assumptions held. Decomposition was clean (math is modular), receipts worked (arithmetic is easily verifiable), and agents had "just enough" context.  
  - **Second half:**  
    - **Clean decomposition broke first:** Problem 2’s clues were interdependent. Sub-questions required global context (e.g., "find digits multiplying to 48" ignored the sum constraint).  
    - **Idealized agents failed:** Sub-agents lacked holistic view (memory limits forced narrow focus).  
    - **Verification collapsed:** Receipts were useless without full context (e.g., checking "3×4×4=48" didn’t catch the sum violation).  
    - **Saboteur exploited this:** Wrong answers felt "plausible" due to decomposition gaps.  

  **What Will Go Wrong (and How to Handle It):**  
  - **First-run failure:** Groups will **ignore the memory limit** (humans hate destroying information).  
    - **Fix:** Enforce strict card limits. Confiscate extras.  
  - **Other issues:** Saboteur may be too obvious (or not active enough). Root agent may bottleneck progress.  
    - **Fix:** Remind saboteur privately to be subtle. Encourage aggressive decomposition.  

  **What Humans Can’t Replicate:**  
  - **Idealized leaf agents:** Humans **can’t reset context** between sub-tasks. We carry latent knowledge, biases, and errors. The idealization assumes every sub-agent is a "fresh, flawless copy" of the original—but humans are messy, contextual, and error-prone.  

  This game highlights why factored cognition *seems* perfect (handling complexity via division of labor) but fails when problems are entangled or verification is costly. The saboteur mirrors real-world alignment risks: a single error in a vast system can cascade if unchecked.
