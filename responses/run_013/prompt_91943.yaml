       1. First problem experience: felt like magic. They were able to break a complex problem into small parts, and the receipts allowed catching errors (maybe one was caught). The final answer was correct.
       2. Second problem: likely fell apart. Why? 
            - The decomposition might not have been clean: the sub-questions were interdependent.
