answer: |-
  Your Aberdour analogy is thoughtfully constructed and cannot be dismissed lightly. I would not defend the Aberdour speakers' usage, and the distinction lies not in formal semantics but in the **historical and social embeddedness** of the terms within their respective linguistic communities. 

  In contemporary English, "man" in generic compounds has centuries of documented usage encompassing all humanity, reinforced by literary, legal, and liturgical tradition (e.g., "mankind" in the King James Bible, Blackstone's "a man comes into a inn"). This established breadth of application creates a legitimate, though imperfect, convention. Aberdour's "freeman," however—despite its claimed etymology—functions within a hypothetical society where "free" explicitly contrasts with "bondman" in contemporary social structure. This active, institutionalized dichotomy imbues "freeman" with inescapable hierarchical connotations that "man" in modern English has been gradually shedding through democratic leveling and extended application to women in many spheres over centuries. 

  The substitution test highlights this contextual asymmetry: replacing "man" with "freeman" in *our* language sounds absurd precisely because our social history differs from Aberdour’s. The test doesn't *beg the question*; it exposes that arguments about "what hearers supply" depend irreducibly on extralinguistic context—which is indeed a social premise, but one necessarily central to usage debates. I concede that both cases rest on empirical social facts, not pure semantics. Yet tradition, as accumulated social fact, grants established generic "man" a defeasible presumption absent in Aberdour's novel, overtly stratified parallel. Reform in English thus argues against inertia; reform in Aberdour argues against active oppression. The difference in justificatory burden is moral and historical, not linguistic. 

