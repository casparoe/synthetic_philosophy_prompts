      "stance": "At the moment of action, the agent's all-things-considered practical judgment must align with the action taken, as revealed by the act itself, meaning apparent weakness of will always indicates a change in judgment or a failure to fully grasp one's own reasons.",
      "concession": "People often act against long-term interests or earlier judgments, and may report conflicting beliefs due to self-deception or a disconnect between theoretical and practical reasoning.",
      "crux": "No one can act against their own all-things-considered judgment at the very moment of action; action always reflects the practical conclusion formed instantaneously in that context.",
      "counterquestion": "How do you empirically verify that D's report of her 10 p.m. judgment is her genuine, all-things-considered practical stance at that exact moment, rather than a conflicted or retrospective description?"
  }
