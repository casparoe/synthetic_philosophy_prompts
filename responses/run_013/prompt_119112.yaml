prompt: |-
  In the seminar I run on convention and obligation, I keep encountering a defence of the when-in-Rome principle that is built entirely on an analogy, and I would like the analogy audited rather than the principle restated. The analogy is this: the everyday norms that govern tipping, queueing, and jaywalking are like a local language. They are arbitrary in the way a lexicon is arbitrary; they are learned rather than derived; they vary from place to place; they are intelligible only against a shared background; and a visitor who ignores them is like a speaker who invents private words in public. My colleague uses the analogy to reach a conclusion: visitors are obligated to follow local conventions, not because the conventions are independently moral, but because participation in a shared social world requires fluency, and because refusing fluency is a kind of disrespect. He also uses it to say that locals who violate their own conventions—jaywalking, say, or cutting a queue—are not thereby doing something immoral, since the conventions are arbitrary and do not wrong anyone in particular.

  I want a full audit of this analogy. Begin by setting out the correspondences explicitly: what maps onto the grammar, the vocabulary, the dialect, the native speaker, the second-language learner, the translator, the code-switcher, and the grammatical mistake. Then separate the disanalogies that matter for the conclusion from those that are merely picturesque. In particular, I want to know whether the analogy can carry the move from coordination to obligation: languages solve coordination problems, but it is not obvious that they generate obligations that a wronged party can address to the agent, and it is not obvious that an arbitrary convention can be binding on someone who has not agreed to it and cannot be presumed to know it. I also want to know what the analogy obscures about conventions that are unjust, demeaning, or costly to follow, and about the asymmetry between a visitor who fails to tip and a local who jumps a queue. The analogy also treats tipping, queueing, and jaywalking as a single kind, but I suspect they are not: one is a gift-like practice with no obvious coordination payoff, one is a first-come-first-served equilibrium, and one is a legal rule with varying enforcement. I want that heterogeneity respected in the audit.

  Finally, tell me whether the conclusion survives once the disanalogies are on the table, or whether the analogy was doing the argumentative work all along. If there is a better analogy for the relation between everyday conventions and moral obligation, say what it is and why it succeeds where the language analogy fails. I am not interested in a survey of the literature; I want the mapping, the breaks, and the verdict.
reasoning: |-
  Hmm, the user is running a seminar on convention and obligation and wants me to audit an analogy comparing social conventions like tipping and queueing to language. Their colleague uses this analogy to argue that visitors are obligated to follow local conventions as a matter of respect, even though these conventions are arbitrary.

  Let me break down this analogy systematically. The colleague maps several aspects: conventions as arbitrary like lexicon, learned rather than derived, varying by location, requiring shared background for intelligibility, and violating them as equivalent to inventing private words. The conclusion is that visitors must follow conventions for fluency and respect, while locals violating them aren't immoral since conventions aren't inherently moral.

  I need to map out the correspondences explicitly first. For the language analogy: grammar would be the underlying structure of conventions (like queueing forming a sequence), vocabulary would be specific conventions themselves (tipping 15%), dialects would be regional variations (New York vs London queueing), native speakers would be locals, second-language learners would be visitors, translators would be cultural interpreters, code-switchers would be people adapting behavior to context, and grammatical mistakes would be unintentional violations.

  Now I'll identify disanalogies that actually matter for the ethical conclusions. Important disanalogies include: conventions often have concrete consequences unlike language (getting hit while jaywalking vs mispronouncing a word), conventions can be unjust or costly (tipping that exploits workers), asymmetries between visitor and local violations (visitor's ignorance vs local's intentional rule-breaking), and heterogeneity among the convention types themselves (tipping as transfer, queueing as coordination, jaywalking as legal rule).

  The key ethical problem is whether the analogy supports moving from coordination to obligation. Language coordinates communication but doesn't create moral obligations - we don't blame tourists for mispronunciations. But social conventions often involve tangible harms or fairness issues. The analogy also obscures power dynamics - an unjust convention isn't arbitrary in a neutral way.

  Regarding the conclusion: the obligation argument survives weakly for pure coordination conventions like queueing where violations cause direct harm. But it fails for gift-like practices like tipping and doesn't address unjust conventions. The analogy was doing heavy argumentative lifting by masking these differences.

  For a better analogy, I suggest "social choreography" - conventions as collective dances. This captures coordination, variation, and learning, while better highlighting consequences of missteps and allowing critique of oppressive "dances." It handles heterogeneity better by not forcing all conventions into a linguistic framework.

  The verdict is that the language analogy is partially illuminating but ultimately misleading for grounding obligation. It works best for coordination-heavy conventions with low stakes, but obscures moral dimensions when consequences, injustice, or power imbalances are involved.
answer: |-
  Here is a full audit of the language analogy for social conventions, structured as requested. I’ll map correspondences, identify critical disanalogies, assess the analogy’s ability to support obligation, address heterogeneity and injustice, and deliver a verdict on the conclusion’s survival.

  ### Explicit Mapping of Correspondences
  | **Linguistic Element**       | **Social Convention Element**              | **Rationale for Mapping**                                                                 |
  |------------------------------|--------------------------------------------|-------------------------------------------------------------------------------------------|
  | **Grammar**                  | *Structural rules* (e.g., queue order, traffic flow logic) | Underlying "syntax" organizing interactions (e.g., FIFO in queues).                       |
  | **Vocabulary/Lexicon**       | *Specific conventions* (e.g., tipping 15%, jaywalking tolerance) | Arbitrary "words" for actions; context-dependent meaning.                                |
  | **Dialect**                  | *Regional variations* (e.g., NYC vs. London queueing)      | Local inflections of broader "grammar."                                                   |
  | **Native Speaker**           | *Local resident*                           | Instinctive mastery; embodies fluency.                                                    |
  | **Second-Language Learner**  | *Visitor*                                  | Requires conscious effort; may make "errors."                                             |
  | **Translator**               | *Cultural interpreter* (e.g., guidebooks)  | Mediates meaning between systems.                                                         |
  | **Code-Switcher**            | *Context-adapting individual* (e.g., bilingual local) | Shifts between conventions (e.g., work vs. home behavior).                                |
  | **Grammatical Mistake**      | *Unintentional violation* (e.g., tourist queues incorrectly) | Error from imperfect learning, not defiance.                                              |
  | **Inventing Private Words**  | *Willful violation* (e.g., refusing to tip)              | Rejects shared meaning; disrupts communication.                                           |

  ### Critical Disanalogies (Morally Significant)
  1. **Consequences of Violation**  
     - *Language*: Miscommunication is often neutral or corrigible (e.g., "lift" vs. "elevator" causes confusion, not harm).  
     - *Conventions*: Violations can cause tangible harm or injustice (e.g., queue-jumping wastes others’ time; refusing tips harms low-wage workers).  
     - **Why it matters**: Obligation cannot be solely derived from "disrespect for arbitrariness" if real harms exist. The analogy obscures **material impact**.

  2. **Arbitrariness vs. Moral Weight**  
     - *Language*: Lexical choices (e.g., "dog" vs. "chien") lack inherent moral significance.  
     - *Conventions*: Some conventions encode power dynamics (e.g., tipping subsidizes exploitative wages; gendered dress codes). Not all are "morally neutral."  
     - **Why it matters**: The analogy cannot distinguish benign conventions (sidewalk etiquette) from oppressive ones (apartheid-era customs). It **flattens moral heterogeneity**.

  3. **Asymmetry of Violator Status**  
     - *Language*: A tourist mispronouncing words vs. a local using slang are both "errors" of fluency.  
     - *Conventions*: A *visitor’s* violation (e.g., ignorant jaywalking) lacks intent; a *local’s* violation (e.g., cutting a queue) often signals entitlement or disrespect.  
     - **Why it matters**: The analogy equates distinct moral acts: **ignorance** vs. **defection** from a cooperative norm. Only the latter may warrant blame.

  4. **Bindingness Without Consent/Knowledge**  
     - *Language*: No obligation to speak "correctly"; we accommodate learners.  
     - *Conventions*: Locals enforce norms regardless of visitor knowledge (e.g., fines for jaywalking).  
     - **Why it matters**: The analogy cannot justify **coercive enforcement** or obligations absent fair notice. Language relies on persuasion, not penalty.

  ### Does the Analogy Support "Coordination → Obligation"?
  - **Failure on Obligation**: Language solves coordination problems but generates no *moral claims*. We don’t say a French person "wrongs" us by speaking French in England. The analogy’s move from "disrupting coordination" to "violating obligation" is unsupported. Obligations require **reciprocal duties** (e.g., not harming others) or **consent**, not just inefficiency.  
  - **What it Obscures**: Conventions like queueing create legitimate expectations (e.g., "My time will be respected"). Violations *do* wrong specific people by undermining fairness. The language analogy misses this by reducing everything to "fluency."

  ### Heterogeneity of Conventions (Tipping, Queueing, Jaywalking)
  The analogy falsely homogenizes:
  - **Tipping**: Not primarily a coordination tool. It’s a **transfer practice** with economic dependencies (workers’ livelihoods) and potential injustice (shifting wage burden).  
  - **Queueing**: A pure **coordination equilibrium** (FIFO minimizes conflict). Violations directly harm others.  
  - **Jaywalking**: A **legal/safety rule** with variable enforcement. Risk-based, not merely arbitrary.  
  **Result**: The analogy’s "language" frame cannot distinguish these moral structures. Obligations in queueing derive from fairness; in tipping, from economic vulnerability; in jaywalking, from collective safety.

  ### Verdict on the Conclusion
  - **Partial Survival for Coordination Norms Only**: The conclusion holds *weakly* for pure coordination conventions (e.g., queueing) where violations cause direct, tangible harm to others. Here, "disrespect" is a proxy for **unfairness**.  
  - **Failure Elsewhere**: The analogy collapses for:  
    - Gift-like/economic practices (tipping): Obligations stem from systemic roles, not "fluency."  
    - Unjust conventions: No obligation to follow demeaning norms.  
    - Visitor vs. local violations: Asymmetry undermines "one-size-fits-all" obligation.  
  - **The Analogy’s Role**: It did **all the argumentative work** by masking moral complexity with a neutral, familiar model. Once disanalogies are exposed, the obligation claim loses force except where harm/fairness is directly implicated.

  ### A Better Analogy: **Social Choreography**
  - **Mapping**:  
    - *Dance styles* = Cultural conventions (arbitrary but structured).  
    - *Basic steps* = Essential norms (queueing).  
    - *Complex routines* = High-context practices (dining etiquette).  
    - *Mistimed step* = Unintentional violation.  
    - *Refusing to dance* = Willful non-participation.  
    - *Oppressive choreography* = Unjust conventions (e.g., discriminatory dress codes).  
  - **Advantages Over Language**:  
    1. **Embodied Consequence**: A misstep can physically harm others (e.g., colliding dancers), mirroring convention violations.  
    2. **Exposes Power**: Choreography can be imposed by authorities; dissent (e.g., altering steps) may be ethical resistance.  
    3. **Heterogeneity-Friendly**: Recognizes dances as cooperative (folk), exploitative (forced labor), or expressive (ritual).  
    4. **Obligation Grounded in Harm**: Highlights duty not to disrupt *physical* or *social* equilibrium, avoiding language’s abstraction.  
  - **Why it Succeeds**: It accommodates consequence, power, and consent while preserving the core insight that conventions are learned, contextual, and coordination-enabling. Obligation arises from **tangible interdependence**, not just "shared meaning."

  ### Final Judgment
  The language analogy is **rhetorically vivid but philosophically inadequate**. It fails to ground obligation, obscures injustice, and ignores critical differences between convention types. While coordination norms *can* generate duties (via fairness/harm), the analogy cannot sustain this alone. Replace it with **social choreography** to better capture the embodied stakes of conventions while leaving space for moral critique. The "when in Rome" principle survives only when conventions are harmless, consensual, and essential for cooperation—conditions the language analogy is too crude to test.
