  I should define a new term if necessary. "Vocabulary-Stacked Simplicity Gambit" captures the idea: stacking the deck with a chosen vocabulary, then gambling on the simplicity claim. Another option is "Descriptive Primitive Toggle." But "Simplicity Laundering" might be catchy, comparing it to money laundering—hiding the subjectivity under objective claims.

