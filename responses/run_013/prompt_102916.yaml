  Looking for fallacies, the closest might be question-begging or assuming the conclusion, but it's more nuanced. The user mentioned "framing effect" and "vocabulary stacking," which are on point. Framing effect is cognitive bias, but in arguments, it's strategic. Vocabulary stacking might be a good term if it's not established. 

