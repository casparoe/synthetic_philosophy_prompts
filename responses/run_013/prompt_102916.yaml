answer: |-
  Your description perfectly captures a pervasive and under-named rhetorical maneuver. It **is** a distinct fallacy, though it synthesizes elements from existing concepts. Let's carve it precisely.

  **The Core Fallacy: "Subjective Simplicity Laundering"**

  1.  **The Move:** An arguer claims Explanation A is "simpler" than Explanation B for a body of evidence, using this perceived simplicity as primary evidence for A's truth.
  2.  **The Hidden Lever:** The simplicity judgment critically depends on an unstated and unargued choice of *descriptive vocabulary* (what counts as a primitive, basic element vs. a derived, complex one).
  3.  **The Silent Switch:** The arguer implicitly uses a vocabulary favorable to A when asserting its simplicity. When challenged, they often describe the evidence using a vocabulary favorable to *their preferred explanation* to make the alternative seem complex/coincidental.
  4.  **The Strategic Retreat:** When the vocabulary-dependence is exposed, they retreat to the truism that "simplicity is language-relative," dismissing the challenge as naive for demanding objectivity.
  5.  **The Unearned Authority:** Crucially, they *continue* to leverage the *rhetorical weight* of "simplicity" as if it were an objective, language-independent virtue in the very arguments where they just invoked language-relativity to deflect criticism. The initial claim borrows objectivity, the defense denies it exists, but the persuasive force relies on the initial (now undermined) implication.

  **Why Existing Concepts Don't Fully Capture It:**

  *   **Occam's Razor/Simplicity as a Heuristic:** OR is the *principle* being invoked. The fallacy is the *dishonest application* of that principle via vocabulary manipulation and strategic retreat.
  *   **Solomonoff/Kolmogorov Complexity/MDL:** These provide a *formal framework* for understanding compression and priors. The reassurance about additive constants **is** relevant to the *asymptotic, infinite-data limit*. The fallacy exploits the **finite-case reality** where:
      *   The "constant" *is* the entire disagreement (as you note).
      *   Choosing the "universal language" or reference machine *is equivalent* to choosing the descriptive primitives. Claiming victory based on K-complexity *within your chosen language* while ignoring the language choice *is the fallacy*.
      *   Formal MDL *requires* specifying the model class/codebook upfront. The fallacy occurs when this specification is hidden or switched.
  *   **Goodman's Grue Problem:** Grue highlights the vocabulary-dependence of *projection* (which predicates are "projectible"). This fallacy is about the vocabulary-dependence of *explanatory simplicity itself*. Grue concerns *future predictions*; this concerns *current explanation*. While deeply related (both involve entrenchment/primitive choice), the *tactic* of asserting simplicity, hiding the vocabulary, switching vocabularies contextually, and retreating to relativity is distinct from the *conceptual puzzle* of grue.
  *   **Subjectivity of Priors:** This is the underlying *epistemic reality*. The fallacy is the *rhetorical sleight-of-hand* used to *disguise* this subjectivity while simultaneously *benefiting* from the intuitive appeal of objective simplicity. It's not just having a subjective prior; it's *pretending* the simplicity derived from that prior is objective evidence, then hiding behind subjectivity when challenged.
  *   **Equivocation/Begging the Question:** It shares features with both:
      *   *Equivocation:* The meaning of "simpler" shifts depending on the unstated vocabulary being used contextually.
      *   *Begging the Question:* The arguer assumes the primitives that make their explanation simple are the correct/obvious ones, which is precisely what's at issue.
      However, neither label fully captures the specific structure of the initial claim, the vocabulary switch, the tactical retreat, and the continued reliance on borrowed objectivity.

  **Proposed Name: "Subjective Simplicity Laundering" (SSL)**

  *   **"Subjective":** Acknowledges the core reality that the simplicity judgment depends on the choice of descriptive primitives, which is not objective.
  *   **"Simplicity":** The virtue being invoked and manipulated.
  *   **"Laundering":** Evokes the process of taking something dubious (a subjective, vocabulary-dependent judgment) and "cleaning" it to appear legitimate and objective (a mark of truth) through rhetorical maneuvers. The retreat is part of the laundering process – it's the equivalent of saying "this money came from a legitimate source (subjectivity)" *after* you've already spent it as if it were clean cash (objective evidence).

  **Boundary Cases & Identification Guide**

  *   **The Real Thing (SSL):**
      *   *Argument:* "My theory (e.g., intentional design) is simpler. Look how complex the alternative (e.g., evolution + random mutation) is! All these independent mutations just *happening* to build an eye? Suspiciously complex coincidence!"
      *   *Challenge:* "But you're defining 'simple' based on intentions being primitive. If you take physics/chemistry as primitive, the 'intentional designer' becomes an incredibly complex unexplained entity."
      *   *Retreat:* "Well, *obviously* simplicity depends on your language/priors. There's no 'view from nowhere'. Demanding absolute simplicity is naive." **(Laundering Complete: Subjectivity admitted, but the initial claim's rhetorical impact remains uncorrected).**
      *   *Later Use:* The same arguer continues to cite "simplicity" as a primary reason favoring their view in other contexts, *without* always caveating its language-dependence. The *persuasive force* relies on the unlaundered intuition.
  *   **Look-Alikes That Should NOT Count (Legitimate):**
      *   **Explicit Priors:** "Within the Bayesian framework, assuming prior P favors theory A because it has higher prior probability (is 'simpler' under P). We argue P is reasonable because..." (Vocabulary/Prior stated and argued for).
      *   **Formal MDL:** "Using codebook C, model M1 compresses the data better than M2." (Codebook explicitly defined).
      *   **Genuine Asymptotic Argument:** "In the limit of infinite data, the complexity difference swamps the additive constant, favoring A." (Focuses correctly on the limit).
      *   **Agreed Vocabulary:** Both parties explicitly or implicitly accept the same descriptive primitives for the discussion. Disagreement is about the explanation *within* that frame.
  *   **Innocuous-Looking Cases That SHOULD Count (SSL):**
      *   **"It's Just Common Sense!":** Asserting a description/vocabulary is "natural" or "common sense" without argument, using this to anchor a simplicity claim, and retreating to subjectivity if that "common sense" is challenged. (The "common sense" vocabulary *is* the hidden primitive choice).
      *   **Statistical "Coincidence":** "It would be an unbelievable coincidence if X happened by chance!" (Implicitly assumes a specific null model where X's components are independent primitives. If X is a single primitive in an alternative model, it's not a coincidence. Switching between these descriptions without acknowledging the model shift is SSL).
      *   **"Ad Hoc" Accusations:** Claiming an opponent's explanation is "ad hoc" and therefore complex, where "ad hoc" means "introduces a primitive I don't accept/prioritize." Retreating to "well, what counts as ad hoc is subjective" when challenged, while still using "ad hoc" as a damning objective criticism. (The definition of "ad hoc" *is* the primitive choice).

  **In Essence:**

  You've identified a specific *rhetorical tactic*: the surreptitious use of vocabulary choice to manufacture an appearance of objective simplicity for a preferred explanation, coupled with a strategic retreat to subjectivity when the manufacturing process is exposed, all while continuing to benefit from the unearned rhetorical authority of the initial simplicity claim. **"Subjective Simplicity Laundering" (SSL)** captures this tactic's core: disguising a subjective prior as objective evidence through vocabulary manipulation and strategic concession. The fallacy lies not in subjectivity itself, but in the deceptive borrowing of objectivity and the failure to genuinely engage with the burden of justifying the chosen descriptive vocabulary *as part of the argument for simplicity*. It's the argumentative equivalent of counterfeiting and then claiming "all money is fiat currency anyway" when caught, while still expecting your counterfeit bill to buy lunch.
