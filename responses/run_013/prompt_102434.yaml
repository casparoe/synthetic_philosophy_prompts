prompt: |-
  I teach a seminar on the morality of promising and every year I end up rebuilding the same handout from scratch, so I want you to do it properly this time. Give me the desiderata for a theory of promissory obligation -- not the theories, the spec: what any adequate account of why promises bind has to be able to do. Concretely, I want the cases it has to get right (the promise made with an ulterior motive, made really just to get someone off your back; the promise whose keeping now requires something the promisor couldn't possibly have anticipated; the promise to someone who has since died; the promise no one would be worse off for breaking because the other party has clean forgotten and won't show; the promise extracted by pressure that falls short of a threat; the promise to do something you shouldn't do; the promise nobody asked for), the distinctions it can't be allowed to collapse (obligation vs. a mere reason to act, the ground of the duty vs. its strength, being bound vs. being blameworthy for breaking it, and -- this is the one I actually care about -- promising vs. our other ways of changing what's owed: consenting, forgiving, commanding, resolving), and what it has to stay consistent with about the practice itself (that it's a human invention, that it's generally useful, that it survives even in cases where it isn't). For each item tell me the case or consideration that motivates it, and then tell me which of these are genuine desiderata and which are just the prejudices of one camp -- I've been reading too much stuff lately that quietly assumes its own answer and then rigs the list to fit.

  I especially want you to flag any pair or subset I can't have together, because if two of these can't be jointly satisfied by any theory, that's the result I'm after, not a defect in the list. Same for the one requirement that does the most work excluding candidates -- Hume on one side, the Scanlonians on the other, they can't all pass. You can skip scoring the actual theories against the list, I do that bit in class; keep the weight on the criteria. And tell me how confident you are in what you're claiming here, and single out the one point you're least sure of -- I'd much rather have your hedges than a confident list I can't seperate from my own assumptions.
reasoning: |-
  Okay, the user is a philosophy professor teaching a seminar on the morality of promising. They want a comprehensive list of desiderata for a theory of promissory obligation—not the theories themselves, but the criteria any adequate account must satisfy. They've outlined specific cases, distinctions, and features the theory must address, and they want me to identify conflicts between desiderata and highlight which ones are non-negotiable versus potentially biased.

  First, I need to unpack their request. They mentioned several key elements: cases the theory must handle (like promises with ulterior motives, unforeseen circumstances, etc.), distinctions it must maintain (like obligation vs. mere reason, promising vs. consenting/forgiving, etc.), and features of the practice itself (human invention, generally useful, etc.). They also want me to flag any conflicts between desiderata and identify which one does the most work in excluding competing theories.

  The user is clearly frustrated with rebuilding this handout every year and wants a robust framework. They're wary of biases in existing literature, so I need to be careful not to assume any particular theoretical stance. Their deeper need might be for a structured, neutral tool that helps students critically evaluate theories rather than pushing a specific agenda.

  Looking at the cases, distinctions, and practice features they provided, I need to organize them systematically. For each item, I'll include the motivating case or consideration and note whether it's a genuine desideratum or a potential bias. The conflicts are crucial here—some desiderata might inherently clash, like the practice being human-invented yet non-instrumentally binding. That could exclude theories like Hume's (instrumental) versus Scanlon's (non-instrumental).

  I recall that Hume sees promises as social conventions based on utility, while Scanlon grounds them in principles no one could reasonably reject. The desideratum about practice features might favor Hume, but the distinction between obligation and mere reason might lean toward Scanlon. The "dead promisee" case is tricky—Scanlon might handle it via impersonal duties, but Hume could argue utility still applies if others rely on it.

  The user's point about promising versus other normative acts (consenting, forgiving) is vital. A theory collapsing these would be inadequate. For example, consent is about permissions, promising creates obligations—so the ground and structure differ. This distinction likely excludes theories that over-rely on communication or expectations.

  I need to note where I'm less confident. The "unsolicited promise" case puzzles me—is it genuinely binding? Intuitions vary, and theories diverge here. Also, the conflict between "human invention" and "non-instrumental survival" might be irreconcilable, which could be a key takeaway for the user's seminar.

  Finally, I'll highlight which desideratum does the heaviest lifting. Probably "obligation vs. mere reason," as it forces theories to explain the distinctive "bond" of promises, excluding those that reduce obligations to expectations or consequences.
answer: |-
  Here’s a rigorously structured set of desiderata for a theory of promissory obligation, organized by your categories. I’ve flagged conflicts, biases, and confidence levels—with special attention to tensions that might reveal theoretical dead ends.

  ---

  ### **I. Core Cases Any Adequate Theory Must Explain**
  *(Motivating cases + assessment of their status as desiderata)*

  1. **The Ulterior Motive Promise**  
     *Case:* "I'll help you move" (said only to end a nagging request, with no intent to follow through).  
     *Desideratum:* Must explain why binding obligation exists despite insincere motivation.  
     *Status:* **Genuine** (tests if obligation arises from commitment act itself, not mental state).

  2. **Unforeseen Burden Promise**  
     *Case:* Promising to cat-sit, but the cat develops a rare illness requiring $10k in care.  
     *Desideratum:* Must explain whether/why obligation persists despite radically changed, unforeseeable costs.  
     *Status:* **Genuine** (probes limits of "implicit assumptions" in promises).

  3. **Promise to the Deceased**  
     *Case:* "I'll publish your manuscript" to a dying friend; they die pre-publication.  
     *Desideratum:* Must determine if obligation binds (and to whom) when promisee cannot benefit.  
     *Status:* **Contentious** (Scanlonians: obligation lapses; Reliance theorists: may bind if others rely; Testamentary view: binds estate). *Low confidence*—intuitions diverge sharply.

  4. **Forgotten Promise**  
     *Case:* Promised to water plants; promisee forgets and won’t notice if you skip it.  
     *Desideratum:* Must explain why breaking it might still be wrong despite no harm/detection.  
     *Status:* **Genuine** (tests if obligation is "interest-independent").

  5. **Coerced-but-not-Threatened Promise**  
     *Case:* "I'll donate to your cause" after relentless guilt-tripping (no explicit threat).  
     *Desideratum:* Must distinguish invalid coercion from mere pressure.  
     *Status:* **Genuine** (examines voluntariness threshold).

  6. **Immoral Promise**  
     *Case:* "I promise to help you vandalize the library."  
     *Desideratum:* Must explain why such promises don’t bind (or bind weakly).  
     *Status:* **Genuine** (any theory failing this is morally untenable).

  7. **Unsolicited Promise**  
     *Case:* "I promise you I’ll cook dinner tomorrow!" (unprompted).  
     *Desideratum:* Must determine if this creates obligation without reliance/request.  
     *Status:* **Contentious** (Reliance/Expectation theories: no obligation; Commitment theories: binds). *Moderate confidence*—hinges on whether "invited reliance" is necessary.

  ---

  ### **II. Distinctions No Theory Can Collapse**
  *(Critical conceptual boundaries + risks of conflation)*

  1. **Obligation vs. Mere Reason to Act**  
     *Risk:* Reducing promissory duty to "it’s nice to keep promises" or "breaking causes harm."  
     *Desideratum:* Must capture the **directed duty** (owed *to* someone) and **normative force** distinct from general beneficence.  
     *Status:* **Genuine & High-Stakes** (This does the *most work* excluding theories: Humean views often fail here).

  2. **Ground vs. Strength of the Duty**  
     *Risk:* Conflating *why* a promise binds with *how strongly* it binds (e.g., "utility grounds it" vs. "high utility makes it stronger").  
     *Desideratum:* Must separate source of obligation (e.g., autonomy, trust) from factors affecting its weight (e.g., stakes, reliance).  
     *Status:* **Genuine** (prevents conflating meta-ethics with applied).

  3. **Being Bound vs. Blameworthy for Breaking**  
     *Risk:* Equating obligation with accountability (e.g., "no blame if no harm, so no obligation").  
     *Desideratum:* Must allow for **blameless violation** (e.g., due to incapacity) without dissolving obligation.  
     *Status:* **Genuine** (acknowledges moral luck).

  4. **Promising vs. Other Normative Acts**  
     *Risk:* Assimilating promising to consent ("I permit you"), forgiveness ("I waive your debt"), command ("I obligate you"), or resolution ("I obligate myself").  
     *Desideratum:* Must pinpoint **promising’s unique structure**:  
     - Creates a *bilateral* obligation (unlike resolution).  
     - Generates a *new* duty (unlike forgiveness).  
     - Binds the *promisor* (unlike command).  
     - Requires *acceptance* for full efficacy (unlike consent?).  
     *Status:* **Your Crucial Test**—*High confidence* this filters theories (e.g., Raz's "voluntary obligations" lump promising with vows; Scanlon distinguishes via "expectation-creation").

  ---

  ### **III. Features of the Practice It Must Accommodate**
  *(Constraints from the social reality of promising)*

  1. **Human Invention**  
     *Constraint:* Promising isn’t a Platonic truth; it’s a contingent social practice.  
     *Desideratum:* Must not rely on divine commands/natural law.  
     *Status:* **Genuine & Non-Contentious**.

  2. **General Usefulness**  
     *Constraint:* Promising *works* because it coordinates expectations.  
     *Desideratum:* Must not imply promising is *generally* harmful or irrational.  
     *Status:* **Genuine but Weak** (even bad institutions can be useful).

  3. **Survival in Non-Useful Cases**  
     *Constraint:* Promises bind even when breaking them would cause no harm (see *Forgotten Promise*).  
     *Desideratum:* Must explain why obligation persists absent instrumental value.  
     *Status:* **Genuine & Nuclear**—This **directly conflicts** with *General Usefulness*.  
     - *Conflict:* **Instrumental theories (Hume)** satisfy Usefulness but fail Survival.  
     - **Non-instrumental theories (Scanlon/Kant)** satisfy Survival but strain to explain why useless practices emerge.  
     - *Resolution?* Only hybrid theories (e.g., "practice-constituted but non-reducible") might satisfy both—but none cleanly.

  ---

  ### **Key Conflicts & High-Exclusion Desiderata**
  - **Unresolvable Tension:** *General Usefulness* vs. *Survival in Non-Useful Cases*. If a theory must fully satisfy both, **no extant theory succeeds**. This may be your target result.  
  - **Most Exclusionary Desideratum:** *Obligation vs. Mere Reason*. Eliminates strict Humeans (who reduce obligation to utility/convention) and extreme Expectation theorists.  
  - **Second Most Exclusionary:** *Promising vs. Other Normative Acts*. Filters "broad will-based" theories (e.g., some Kantians) that underdifferentiate.  
  - **Weakest Link:** *Promise to the Deceased*. Deeply contested intuitions; likely theory-dependent.  

  ---

  ### **Confidence & Hedges**
  - **Overall Confidence:** High on structural desiderata (distinctions/practice features); lower on edge cases (dead promisee, unsolicited promise).  
  - **Least Confident Point:** *Unsolicited promises*. I suspect this exposes a rift between "invitation to rely" and "pure commitment" models, but cultural/intuitional variance makes it murky.  
  - **Bias Alert:** The *Survival in Non-Useful Cases* desideratum favors non-instrumentalism—a "prejudice" if you reject Scanlon. But its conflict with *Usefulness* neutralizes this by making both optional for partisans.  

  This framework forces theories to confront promises' *dual nature*: a human tool for cooperation that generates duties transcending utility. The irresolvable tension (Usefulness vs. Useless Survival) may be the fulcrum for your seminar—theories *must* choose, exposing their foundational commitments.
