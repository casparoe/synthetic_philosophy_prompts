  - **If you land on "no composite objects exist" (Leaf G):** This requires "no" to *all* cases: holding hands (Q1), lichen (Q3), *and* fused glass (Q7). If you said "yes" to *any* case (e.g., fused glass), you cannot reach Leaf G.  
