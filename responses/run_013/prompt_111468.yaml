  ### Decision Tree for the Special Composition Question  
  *Answer each question based on your verdict about the case described. Proceed to the next question as directed.*

  1. **Two people are holding hands. Is there a further thing (a composite object) made up of these two people?**  
     - **Yes** → Go to 2.  
     - **No** → Go to 3.  

  2. **Two grains of sand lie on a beach, not touching. Is there a further thing made up of these two grains?**  
     - **Yes** → Go to 4.  
     - **No** → Go to 5.  

  3. **A lichen is made of one fungus and one alga living together as a single organism. Is there a further thing (the lichen) made up of these two parts?**  
     - **Yes** → Go to 6.  
     - **No** → Go to 7.  

  4. **The entire universe (everything that exists) — is there a further thing made up of all these parts?**  
     - **Yes** → **Leaf A**  
     - **No** → **Leaf B**  

  5. **Everyone in your school stands in the gym at assembly. Is there a further thing made up of all these people?**  
     - **Yes** → **Leaf C**  
     - **No** → **Leaf D**  

  6. **A termite mound and the colony that built it — together, do they make up a further thing?**  
     - **Yes** → Go to 8.  
     - **No** → **Leaf E**  

  7. **A heap of sand is fused by lightning into one solid lump of glass. Is there a further thing (the lump) made up of the fused sand?**  
     - **Yes** → **Leaf F**  
     - **No** → **Leaf G**  

  8. **A data centre of thousands of machines, jointly running one program — is there a further thing made up of all these machines?**  
     - **Yes** → **Leaf H**  
     - **No** → **Leaf I**  

  ---

  ### Notes on Each Leaf  
  *For each leaf, we state: (1) the condition for composition, (2) the position’s name (if standard) or a plain label, (3) the status of the composite object (if applicable), and (4) the most embarrassing commitment. The status question (what the composite *is*) is separate from the condition (when composition happens), so positions in the same leaf may disagree on status.*  

  **Leaf A: Unrestricted Composition**  
  - **Condition:** Composition happens for *any* collection of things, anywhere.  
  - **Name:** Universalism.  
  - **Status:** The composite is either just the parts arranged a certain way (reductionism) or a distinct entity (non-reductionism) — defenders must pick one.  
  - **Embarrassing commitment:** There is an object made up of your left shoe and the Eiffel Tower.  

  **Leaf B: Composition Except for the Universe**  
  - **Condition:** Composition happens for any collection *except* the whole universe.  
  - **Label:** Restricted Universalism.  
  - **Status:** As in Leaf A, defenders must choose reductionism or non-reductionism.  
  - **Embarrassing commitment:** There is a precise but unknowable cutoff for when a collection is "too big" to compose something — or vagueness here undermines the view.  

  **Leaf C: Composition within Confined Spaces**  
  - **Condition:** Composition happens only when parts are in a shared, bounded space (like a room).  
  - **Label:** Regionalism.  
  - **Status:** The composite is usually seen as just the parts in a place (reductionism).  
  - **Embarrassing commitment:** Whether a collection composes something depends on vague boundaries (e.g., how small a space counts?), forcing defenders to accept unknowable cutoffs or vagueness as fundamental.  

  **Leaf D: Composition Only with Contact**  
  - **Condition:** Composition happens only when parts are physically touching.  
  - **Name:** Contactism.  
  - **Status:** The composite is typically seen as nothing over the parts (reductionism).  
  - **Embarrassing commitment:** If two people hold hands via a tool (e.g., a stick), they don’t compose anything — touching matters more than purpose.  

  **Leaf E: Composition Only for Organisms**  
  - **Condition:** Composition happens only when parts form a single living organism.  
  - **Name:** Organicism.  
  - **Status:** The composite is a distinct entity (non-reductionism) due to its biological unity.  
  - **Embarrassing commitment:** A corpse isn’t an object; it’s just particles. A living tree is an object, but a wooden table isn’t.  

  **Leaf F: Composition Only for Fused Wholes**  
  - **Condition:** Composition happens only when parts are fused into a continuous solid.  
  - **Label:** Fusionism.  
  - **Status:** The composite is either identical to the fused mass (reductionism) or a new entity (non-reductionism).  
  - **Embarrassing commitment:** A cloud of gas isn’t an object, but if frozen into ice, it becomes one.  

  **Leaf G: No Composite Objects**  
  - **Condition:** Composition never happens; there are only simple things (e.g., particles).  
  - **Name:** Compositional Nihilism.  
  - **Status:** Not applicable (no composites exist).  
  - **Embarrassing commitment:** There are no tables, chairs, or organisms — only atoms arranged "table-wise" or "person-wise."  

  **Leaf H: Composition for Functional Unity**  
  - **Condition:** Composition happens when parts work together for a purpose (e.g., biological or mechanical).  
  - **Name:** Functionalism.  
  - **Status:** The composite might be nothing over the parts (reductionism) or a distinct system (non-reductionism).  
  - **Embarrassing commitment:** A group of people cooperating temporarily composes an object, but when they stop, it vanishes.  

  **Leaf I: Composition Only for Biological Function**  
  - **Condition:** Composition happens only for natural biological systems (e.g., cells, colonies).  
  - **Label:** Biological Functionalism.  
  - **Status:** The composite is a distinct entity (non-reductionism) due to evolutionary purpose.  
  - **Embarrassing commitment:** An ant colony is an object, but an equally complex AI-run factory isn’t.  

  ---

  ### Unoccupied Combinations  
  - **"No" to all cases (e.g., no to hands, lichen, fusion, etc.):** This would lead to Leaf G (nihilism) via Q1→Q3→Q7. *Unoccupied because nihilism is covered; no plausible view denies all cases but accepts others arbitrarily.*  
  - **"Yes" to the universe (Leaf A) but "no" to two grains of sand (Q2):** Incoherent — if composition is unrestricted, it must include any two things.  
  - **"Yes" to the school assembly (Leaf C) but "no" to two people holding hands (Q1):** Merely unattractive — no major theory accepts large groups but rejects small, connected ones.  

