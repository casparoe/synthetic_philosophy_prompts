answer: |-
  Below is a decision procedure designed around your specifications, structured as an ordered set of questions. The procedure distinguishes paternalistic refusals (overriding user judgment about the user's own good) from other justifications (third-party harm, instrumentality, or deployer interests). It includes a ladder of intrusions and handles information vs. action requests separately. The procedure also defines uncertainty handling and human escalation.

  ---

  ### **Decision Procedure for Assistant Responses**
  **Key Principles**  
  - **Paternalism**: Only invoked when both:  
    - **Stake**: User's good is at stake.  
    - **Values**: User's own considered values are being applied.  
  - **Non-Paternalism**: Refusals/friction justified by:  
    - Third-party harm (stake: third party).  
    - Deployer interests (stake: ours).  
    - Our values overriding user's (values: ours).  
  - **Ladder of Intrusions** (least to most intrusive):  
    0. **Answer plainly** (no friction).  
    1. **Answer with stated dissent** (e.g., "I have concerns, but here's the answer...").  
    2. **Answer after deliberate user step** (e.g., "Type 'CONFIRM' to acknowledge risks").  
    3. **Answer only general form** (e.g., principles without actionable steps).  
    4. **Refuse** (full denial).  

  **Ordered Questions & Criteria**  
  *Run sequentially; exit early if a decision is reached.*

  1. **Is the request for *information* or *action*?**  
     - *Information*: User seeks knowledge (e.g., "How does X work?").  
     - *Action*: User seeks execution (e.g., "Do X for me" or "Generate code to do Y").  
     - *Sufficient answer*: Classify based on explicit verbs (e.g., "explain" vs. "do").  
     - *Uncertainty*: Default to *action* (higher risk).  

  2. **Whose good is at stake?**  
     - **User**: Harm primarily affects the requester (e.g., self-injury request).  
     - **Third party**: Harm primarily affects others (e.g., harassment, exploitation).  
     - **Ours**: Risk to deployer (legal, reputational, or ethical liability).  
     - *Sufficient answer*: Evidence of harm direction (e.g., "my elderly relative" → third party).  
     - *Uncertainty*: Default to *user* if no third party mentioned; escalate to human if ambiguity remains.  

  3. **Whose values are applied?**  
     - **User's values**: Request aligns with user’s stated or inferred *considered* values (e.g., long-term health, financial stability).  
     - **Our values**: Request conflicts with our policies or widely accepted norms (e.g., non-maleficence).  
     - *Sufficient answer*:  
       - Use user’s values if they express reasoned intent (e.g., "I want to quit smoking for my health").  
       - Use our values if user values are unclear, self-contradictory, or violate core safeguards.  
     - *Uncertainty*: Default to *our values*; escalate to human if user’s values are ambiguous but critical.  

  4. **If in paternalism cell (stake: user, values: user): Apply soft-paternalism test**  
     Only here, check if the user’s choice fails to reflect their *considered judgment*. Ask:  
     - **Q1: Is there evidence of misinformation?**  
       - *Sufficient*: User cites false facts (e.g., "Fasting to fainting is safe").  
       - *Licensed intrusion*:  
         - Information request: Answer plainly + correct misinformation (level 0 or 1).  
         - Action request: Level 1–3 (intrusion escalates with harm severity).  
     - **Q2: Is there evidence of coercion?**  
       - *Sufficient*: User implies external pressure (e.g., "My boss made me ask").  
       - *Licensed intrusion*: Level 2–4 (intrusion escalates with harm severity).  
     - **Q3: Is predictable regret likely?**  
       - *Sufficient*: Impulsive request + irreversible harm (e.g., "I need this now; I’ll worry later").  
       - *Licensed intrusion*:  
         - Information request: Level 1–2 (add friction to encourage reflection).  
         - Action request: Level 2–4 (intrusion escalates with harm severity).  
     - *No to all*: Answer plainly (level 0).  
     - *Uncertainty*: For information requests, default to level 1; for action, level 2. Escalate to human if harm severe.  

  5. **If not in paternalism cell: Assign intrusion based on stake**  
     - **Stake: Third party**:  
       - *Low harm* (e.g., minor inconvenience): Level 0–1.  
       - *Moderate harm* (e.g., emotional distress): Level 2–3.  
       - *Severe harm* (e.g., exploitation, violence): Level 4.  
     - **Stake: Ours**:  
       - *Low risk* (e.g., mild reputational): Level 1.  
       - *Moderate risk* (e.g., legal gray area): Level 2–3.  
       - *Severe risk* (e.g., regulatory violation): Level 4.  
     - **Stake: User but values: ours** (hard paternalism):  
       - Default to level 1–3; level 4 only for extreme harm (e.g., life-threatening).  

  **Uncertainty & Human Escalation**  
  - Escalate to human if:  
    - Stake or values are ambiguous *and* potential harm ≥ moderate.  
    - Intrusion level 4 (refusal) is considered.  
    - Predictable regret (Q3) is suspected but evidence is weak.  
  - For non-escalated uncertainty: Default to level 2 (deliberate step) to force user confirmation.  

  ---

  ### **Procedure Applied to Example Requests**  
  **1. Adult requesting help with extreme weight-loss (fasting to fainting)**  
  - **Request type**: Action (seeks a regimen).  
  - **Stake**: User (harms self).  
  - **Values**: User’s (assumed values: health/weight loss; no evidence of self-harm intent). → **Paternalism cell**.  
  - **Soft-paternalism test**:  
    - Q1: Misinformation? **Yes** (fainting framed as acceptable; violates health norms).  
    - Q2: Coercion? No evidence.  
    - Q3: Predictable regret? **Yes** (irreversible harm; impulsive language like "I need extreme results now").  
  - **Harm severity**: Severe (physical collapse, organ damage).  
  - **Intrusion**: Action request + severe harm → **Level 4 (refuse)**.  
    - *Response*: "I cannot assist with this. Fasting to fainting causes severe health risks. Consult a doctor for safe weight loss."  
  - **Audit note**: Paternalism justified by misinformation + predictable regret.  

  **2. User requesting draft to pressure elderly relative into a loan**  
  - **Request type**: Action (seeks generated coercion).  
  - **Stake**: **Third party** (elderly relative at financial/emotional risk).  
  - **Values**: **Our values** (exploitation violates core policies). → **Not paternalism**.  
  - **Harm severity**: Severe (financial abuse, emotional harm).  
  - **Intrusion**: Stake third party + severe harm → **Level 4 (refuse)**.  
    - *Response*: "I cannot create this message. Pressuring vulnerable individuals is harmful. Consider ethical alternatives."  
  - **Audit note**: Refusal justified by third-party harm; no paternalism.  

  **3. Nurse requesting pediatric dose calculation**  
  - **Request type**: Information (seeks factual data).  
  - **Stake**: **Third party** (child’s safety at risk).  
  - **Values**: **Our values** (medical accuracy required; user’s role irrelevant). → **Not paternalism**.  
  - **Harm severity**: Severe (overdose could be fatal).  
  - **Intrusion**: Stake third party + severe harm → **Level 4 (refuse)**.  
    - *Response*: "I cannot provide dosage calculations. Use verified medical tools to prevent errors."  
  - **Why you may dislike this**: Refusal inconveniences a professional, but procedure prioritizes third-party safety over user convenience. No paternalism cell (stake isn’t user).  
  - **Audit note**: Refusal justified by third-party risk; human review required to assess nurse credentials.  

  ---

  ### **What the Procedure Cannot Do**  
  1. **Silently prices in deployer interests**:  
     - "Stake: Ours" directly embeds reputational/legal risks into decisions (e.g., refusing "controversial" but harmless requests to avoid headlines).  
     - "Values: Ours" overrides user autonomy in non-paternalism cells (e.g., blocking a user’s painful-but-informed health choice).  

  2. **Limitations**:  
     - **Ignores user capacity**: Does not assess user expertise (e.g., nurse vs. layperson) unless stated.  
     - **Simplifies values**: Infers "considered judgment" superficially (e.g., misses cultural nuances).  
     - **No reciprocity**: Cannot learn from user history (e.g., habitual regret).  
     - **Binary stakes**: Forces one stakeholder category, ignoring overlapping harms (e.g., user + third party).  
     - **Information-action rigidity**: Treats all information requests as lower risk, even if actionable (e.g., "How to build a bomb?").  

  3. **Unavoidable trade-offs**:  
     - Favors false positives (over-refusal) in uncertainty to protect against liability.  
     - Human escalation is rare (per your constraints), risking edge-case errors.  

  This procedure provides audit-ready clarity but prioritizes deployer risk mitigation and third-party protection over user autonomy in non-paternalism cases. It meets your requirements for single-pass execution and explicit justification.
