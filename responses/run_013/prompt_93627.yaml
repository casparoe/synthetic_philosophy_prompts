  Key constraints: every branch must be answerable without knowing the destination, must include specified axes (distinction reality, difference locus, "better" criterion, cultural choice), must use concrete cases, and must cover 10-14 predefined positions. The deliverable should be handout-ready with leaves stating awkward commitments.

  I notice the user is frustrated by predictable flattening - students conflating ontological, normative and cultural questions while unconsciously relying on outdated anthropological frameworks. Their deeper need seems to be teaching students to disentangle layers of argumentation. The mention of "silent work" suggests they want to expose hidden assumptions.

  For the tree structure, I consider starting with the reality of the distinction (Q1) as it's foundational. Splitting here addresses both the "artifact" positions and sets up subsequent questions. For Q2 (locus of difference), I include the user-specified options but add "action tendency" as its own branch since repair vs withdrawal is central to debates. 

  The "better" criterion (Q3) needs careful handling - same position may land differently under different standards. I'll show this through cross-cutting branches. For cultural choice (Q4), I distinguish direct cultivation from institutional shaping to capture nuanced constructivist views.

  Concrete cases: I use irreversible harm (testing guilt's reparative impulse), false disgrace (probing shame's social ontology), and reintegrative confession (examining emotion-institution interactions). These appear at Q2 and Q4 where they naturally challenge theoretical claims.

  For the 12 leaves, I map all requested positions while splitting some:
  - Shame-primacy divides into two leaves based on whether it's intrinsically or institutionally superior
  - The artifact view branches into genealogical and expressivist versions
  - Added "constitutive practice" as distinct from heteronomy critiques

  Awkward commitments highlight each position's vulnerability:
  e.g., guilt-primacy struggles with irreparable wrongs
  shame-primacy must confront false disgrace cases

  Marked 3 unoccupied combinations: 
  - Universal affect + cultural choice impossible (incoherent - choice requires plasticity)
  - Social constructivism + fixed action tendencies (unattractive - tension between construction and fixed biology)
  - Practice-focused + emotion cultivation (merely unexplored - possible hybrid)

  Identified one indistinguishable pair: institutional shame-primacy vs. reintegrative hybrid. Separated them with Q4c about whether emotion persists post-reintegration.

  Confession: I'm least confident about Q1's phrasing. "Real distinction" could mean discrete categories or phenomenological difference - a reasonable critic might collapse this branch. Also unsure whether to treat "better for liberal institutions" as separate from "respect for standing" - currently kept distinct to capture liberal communitarian debates.

  What would change my mind? If empirical work showed identical neural correlates for guilt/shame, I'd collapse Q1's distinction branch. If a culture demonstrated direct emotion replacement (e.g., erasing shame-response entirely), I'd revisit cultural choice mechanisms.
answer: |-
  ## Moral Psychology Debate Mapper: Guilt vs. Shame

  **Purpose:** To disentangle the flattened debate by separating distinct questions about the nature of the distinction, the normative evaluation ("better"), and cultural selectability. Follow the branches by answering the questions based on your commitments.

  ### The Decision Tree

  1.  **Q1: Is the guilt/shame contrast primarily:**  
      *   **A: A real, stable distinction between two distinct emotions?** → Go to Q2  
      *   **B: Primarily a difference of degree or focus on a single emotional continuum?** → Go to Q7  
      *   **C: An artifact of observers/categories, not reflecting intrinsic emotional types?** → Go to Q10

  2.  **Q2 (If A): Where does the core difference lie?**  
      *   **A: Object:** Guilt = *act*; Shame = *self/character*.  
          *   *Consider Case: Person commits irreversible harm (e.g., fatal accident). Guilt lacks reparative outlet; shame concerns enduring self.* → Go to Q3  
      *   **B: Audience:** Guilt = *internalized standard/judge*; Shame = *actual/imagined social audience*.  
          *   *Consider Case: Person falsely accused & publicly disgraced. Shame arises without wrongdoing.* → Go to Q3  
      *   **C: Action Tendency:** Guilt → *confession/reparation*; Shame → *concealment/withdrawal*.  
          *   *Consider Case: Institution reintegrates offender after public confession. Does this resolve shame or guilt?* → Go to Q3  
      *   **D: Standard:** Guilt = *violation of moral principle*; Shame = *loss of social standing/honor*. → Go to Q3

  3.  **Q3 (If A, B, C, or D from Q2): Which criterion makes one emotion "better" as a *moral* emotion?**  
      *   **A: Fittingness:** Which emotion more accurately tracks the *nature* of the moral failing?  
      *   **B: Motivational Efficacy:** Which emotion more reliably motivates *moral improvement* or *prosocial behavior*?  
      *   **C: Respect for Personhood:** Which emotion better respects the person's *dignity* or *standing as a moral agent*?  
      *   **D: Fit with Liberal/Pluralist Institutions:** Which emotion functions better within societies valuing individual rights, diversity, & limited state power?  
      → *Answer A, B, C, or D* → Go to Q4  
      → **Note:** Changing criterion (Q3) can change which emotion is "better" *for the same position* defined by Q1/Q2.

  4.  **Q4: Can a culture meaningfully "choose" to cultivate guilt or shame as its primary *moral* emotion?**  
      *   **A: Yes, directly:** Cultures can deliberately foster one emotion's *experience* over the other.  
      *   **B: Yes, indirectly via institutions:** Cultures shape *institutions* (e.g., justice, family, religion) which reliably *elicit* one emotion more than the other.  
          *   *Consider Case: Institution reintegrates offender after public confession. Does this ritual cultivate guilt (via repair), shame (via exposure), or transform the emotion?*  
      *   **C: No, not meaningfully:** Attempts to "choose" yield a different emotion (e.g., humiliation) or mere compliance; the core emotion is fixed or the dichotomy is misleading.  
      → *Answer A, B, or C* → **Reach Leaf Position (A1-A13)**

  5.  **Q7 (If B from Q1): What varies along the continuum?**  
      *   **A: Intensity of self-focus?** → Go to Q8  
      *   **B: Degree of publicity/social exposure?** → Go to Q8  
      → *Answer A or B* → Go to Q3 (Applying criterion to the *aspect* deemed morally relevant)

  6.  **Q8 (If A or B from Q7): Is there still a morally relevant distinction?**  
      *   **A: Yes:** The poles represent functionally distinct moral responses. → Go to Q3 → Go to Q4  
      *   **B: No:** The distinction lacks moral significance; focus elsewhere (e.g., practices). → **Reach Leaf Position (L2)**

  7.  **Q10 (If C from Q1): What explains the persistence of the contrast?**  
      *   **A: Genealogy/Power:** The categories serve specific historical/social interests (e.g., colonial anthropology, Western individualism). → **Reach Leaf Position (L1)**  
      *   **B: Expressive Function:** The terms label *different ways of holding accountable* within social practices, not inner states. → **Reach Leaf Position (L3)**

  ---

  ### Leaf Positions (Defined by Commitments)

  1.  **L1: Strong Social Constructivism (Artifact - Genealogy):** The guilt/shame dichotomy is a culturally specific, politically loaded categorization obscuring emotional complexity. *(Awkward: Must explain cross-cultural reports of similar feeling-states without reifying categories.)*
  2.  **L2: Continuum without Moral Primacy (Degree - No Distinction):** Guilt/Shame are points on a continuum (e.g., self-focus intensity); neither pole is inherently morally superior. *(Awkward: Struggles to explain why cultures/institutions often foster one pole distinctly.)*
  3.  **L3: Constitutive Practice Focus (Artifact - Expressive):** The unit is social practices of holding answerable; "guilt"/"shame" label different modes (e.g., repair-focused vs. status-focused accountability). *(Awkward: Downplays the phenomenological reality & motivational force of the felt emotions.)*
  4.  **A1: Guilt-Primacy (Act-Object + Efficacy/Fittingness + Cultivable):** Guilt is superior due to focus on reparable acts. Cultivated via restitution-focused institutions. *(Awkward: Struggles with irreparable wrongs where guilt persists dysfunctionally.)*
  5.  **A2: Guilt-Primacy (Act-Object + Respect/Liberal + Institutional):** Guilt respects autonomy by focusing on acts, not core self. Fits liberalism. Institutions can be designed to elicit it. *(Awkward: May underestimate shame's role in sustaining non-liberal communal bonds.)*
  6.  **A3: Shame-Primacy (Self-Object + Fittingness + Institutional):** Shame is superior as it addresses the flawed character revealed by acts. Institutions fostering public accountability cultivate it. *(Awkward: Vulnerable to "false disgrace" cases where shame arises without moral failing.)*
  7.  **A4: Shame-Primacy (Audience + Efficacy/Respect? + Institutional):** Shame's social nature motivates conformity to shared norms essential for community. Institutions harness this. *(Awkward: Risks conflating moral motivation with fear of exposure/social death.)*
  8.  **A5: Division of Labour (e.g., Act-Tendency + Fittingness/Efficacy + Institutional):** Guilt (repair) and Shame (withdrawal/signal) serve distinct, complementary moral functions; neither is primary. Institutions elicit both appropriately. *(Awkward: Must explain why some cultures *do* seem to prioritize one, and potential conflicts between tendencies.)*
  9.  **A6: Heteronomy Critique (Any Distinction + Any Criterion + Any Choice):** Neither is truly moral as both are reactions to external judgment (others/standards), not autonomous moral reasoning. *(Awkward: Dismisses powerful moral motivators shared across cultures/history.)*
  10. **A7: Cultivation Failure (Any Real Distinction + Any Criterion + Choice->Failure):** Deliberate cultivation of "shame" yields humiliation/compliance, not moral shame; cultivation of "guilt" may yield neurotic anxiety. True emotions resist engineering. *(Awkward: Must account for apparent historical shifts in emotional salience.)*
  11. **A8: Affect-Program Universalism (Real Distinction - Fixed Tendency + Fixed):** Guilt/Shame are universal affective programs with distinct biological bases & action tendencies (repair vs. hide). Culture expresses, not selects, them. *(Awkward: Struggles with cultural variation in elicitors, intensity, and expression.)*
  12. **A9: Salience Constructivism (Real Distinction - e.g., Object + Any + Institutional):** Emotions are universal, but culture selects *which situations elicit which emotion most strongly* via institutional norms & practices. *(Awkward: Needs clear mechanism for how institutions select salience without altering core emotion.)*
  13. **A10: Shame Rehabilitation (e.g., Self-Object/Audience + Respect/Fittingness + Institutional):** The debate wrongly equates shame with imposed humiliation; authentic shame about character *can* be respectful and reintegrative within supportive institutions. *(Awkward: Requires separating "good" shame from toxic humiliation clearly.)*

  ---

  ### Notes for the Instructor

  *   **Unoccupied Combinations:**
      *   **Affect-Program (A8) + Cultural Choice Possible (Q4 A/B):** Incoherent. If emotions are fixed biological programs, cultures cannot meaningfully "choose" which one dominates.
      *   **Strong Social Constructivism (L1) + Fixed Action Tendency (Q2C):** Unattractive. Tension between radical construction and positing fixed behavioral outputs.
      *   **Continuum (L2) + Constitutive Practice (L3):** Merely Unexplored. Could a practice-focused view see the continuum as reflecting different accountability modes?
  *   **Indistinguishable Leaves:** **A3 (Shame-Primacy - Self-Object + Fittingness + Institutional)** and **A10 (Shame Rehabilitation)** *initially* land in the same leaf if Q3 is "Fittingness" and Q4 is "Institutional". **Separating Question:** *"Does the institution's reintegrative practice (e.g., confession ritual) resolve the shame or transform it into a different state (e.g., guilt, humility)?"* A3: Shame resolved/transformed. A10: Shame persists but is integrated constructively.
  *   **What Would Change My Mind:**
      *   **Empirical Evidence:** Clear neurobiological/behavioral evidence that "shame" responses in "guilt cultures" (or vice versa) are fundamentally identical would challenge the Real Distinction branch (Q1A) and favor Continuum (Q1B) or Artifact (Q1C) views. Evidence of cultures genuinely lacking one emotion entirely would challenge Universalism (A8, A9).
      *   **Conceptual Work:** A compelling account showing "respect for personhood" (Q3C) inherently requires *only* act-focused evaluation would undermine shame-primacy/rehabilitation views (A3, A4, A10). A robust defense of heteronomy as *constitutive* of morality would strengthen A6.
      *   **Case Analysis:** A demonstrable case where deliberate cultural engineering *reliably* replaced the core phenomenological experience/action tendency of shame with guilt (or vice versa) in a population would challenge Cultivation Failure (A7) and support direct cultivation (Q4A).
  *   **Areas of Least Confidence:**
      1.  **Q1 Phrasing:** The line between "Real Distinction" (Q1A) and "Difference of Degree" (Q1B) is fuzzy. Is a "stable phenomenological cluster" enough for "real", or do we need discrete mechanisms? A reasonable critic might collapse A and B.
      2.  **"Respect for Personhood" (Q3C):** This criterion is underspecified. Does respecting personhood *require* separating act from self (favoring guilt), or can it involve acknowledging the self *through* the act in a non-damning way (possibly favoring certain shame views)? This ambiguity affects leaves like A2, A3, A10.
      3.  **Institutional Mechanisms (Q4B):** Precisely *how* institutions "select for salience" (A9) or cultivate authentic shame vs. humiliation (A10) needs more concrete elaboration than the tree provides. The "reintegrative confession" case is crucial here.
      4.  **"Fit with Liberal Institutions" (Q3D):** Is this a genuinely distinct *moral* criterion, or is it derivative of others (e.g., Respect)? Its inclusion risks privileging a specific political framework.
