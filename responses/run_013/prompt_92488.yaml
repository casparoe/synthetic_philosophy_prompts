              That's 15 minutes for 3 rounds. We can then for the lever focus on the Deal 3 lottery.

          Part 4: The lever (15 min)
              We look back at their bazaar responses. For the lottery in Tier 3 (1/216 for 400 tokens), we see what they said was their maximum price. Suppose a participant said their max price for Tier 3 was 2 tokens. Then we offer them: 
                  "You said you would pay up to 2 tokens for the Tier 3 lottery. Now, I offer you a lottery that is similar but even better: it's the same as Tier 3 (win 400 tokens if three dice show 1) but I only charge 1.9 tokens. Do you want to buy it?"

              Then, after they answer, we offer: 
                  "Now, I offer you a bundle of 10 such Tier 3 lotteries. They are independent. So you pay 19 tokens, and you get 10 independent chances: for each, if you roll three ones, you win 400 tokens. Do you want to buy the bundle?"

              We then do the bundle: they pay 19 tokens, and we roll 30 dice (or 10 groups of 3 dice) and see how many wins they get.

              We do this for a few volunteers? Or for everyone? We don't have time for everyone.

              We can do it for one or two volunteers. We select participants who had a relatively high stated max for Tier 3 (so they are more likely to accept) and who have at least 19 tokens.

              We do the bundle and they see that they are very likely to lose.

          Then we move to debrief.

     Debrief (25 min):
          Key points:
            - Expected value is additive: if one lottery has positive EV, then a bundle of independent ones does too, and it might even be more attractive (if they are risk-seeking) or less (if risk-averse) but the point is that by the additive property, if you accept one, you should accept the bundle.
            - The fanatic isn't inconsistent: they won't be Dutch-booked. The pressure is that they must accept near-certain ruin for a vanishing chance of a huge payoff.
            - Any cutoff they name is arbitrary because there is always a lottery with a slightly lower probability and a slightly higher payout that has positive EV and that they should accept by the same reasoning.

          Include the infinite version: 
            - Offer a series of lotteries: 
                 Lottery 1: pay 1/2 token, win 8 tokens with probability 1/4 -> EV = 8*(1/4) = 2 tokens, so net EV = 2 - 0.5 = 1.5 tokens.
                 Lottery 2: pay 1/4 token, win 64 tokens with probability 1/16 -> EV = 64/16 = 4 tokens, net EV = 4 - 0.25 = 3.75 tokens.
                 Lottery 3: pay 1/8 token, win 512 tokens with probability 1/64 -> net EV = (512/64) - 0.125 = 8 - 0.125 = 7.875 tokens.
              The total cost: 1/2 + 1/4 + 1/8 = 7/8 tokens.
              The total EV: 1.5 + 3.75 + 7.875 = 13.125 tokens? But wait, the series is designed so that the net EV for each lottery is positive and growing? Actually, the net EV for lottery k is (8^k / 4^k) - (1/2)^k = (2^k) - (1/2)^k? Let me redefine:

              Let me use the example you gave: 
                  prices: 1/2, 1/4, 1/8, ... tokens
                  payouts: 8, 64, 512, ... tokens
                  probabilities: 1/4, 1/16, 1/64, ... 

              For lottery 1: EV_win = 8 * (1/4) = 2 tokens, cost = 0.5, net EV = 1.5 tokens.
              Lottery 2: EV_win = 64 * (1/16) = 4 tokens, cost=0.25, net=3.75 tokens.
              Lottery 3: 512 * (1/64) = 8 tokens, cost=0.125, net=7.875 tokens.

              The total net EV for the first three is 1.5+3.75+7.875 = 13.125 tokens.

              And the total cost is 0.5+0.25+0.125 = 0.875 tokens.

              The chance of winning at least one: 1 - (1-1/4)*(1-1/16)*(1-1/64) = 1 - (3/4 * 15/16 * 63/64) = 1 - (2835/4096) ≈ 1 - 0.6919 = 0.3081.

              Now, if we take infinitely many: 
                  cost = sum_{k=1}^∞ (1/2)^k = 1 token.
                  net EV per lottery: for lottery k, net = (8^k) * (1/4^k) - (1/2)^k = (2^k) - (1/2)^k.
                  total net EV = sum_{k=1}^∞ [2^k - (1/2)^k] = ??? 
                  This diverges because 2^k grows without bound.

              Actually, the win in lottery k is 8^k tokens with probability 1/(4^k) = (8^k) * (1/4^k) = (8/4)^k = 2^k tokens expected from the win, and cost is (1/2)^k, so net expected from lottery k is 2^k - (1/2)^k.

              The series 2^k diverges, so the total expected value is infinite.

              But the total cost is 1 token. And the chance of winning anything: 
                  probability of no win = ∏_{k=1}^∞ (1 - 1/4^k)
                  We know that 1 - 1/4^k > 0, and the product converges to a positive number (since the series ∑ 1/4^k converges). In fact, it's known that ∏_{k=1}^∞ (1 - x^k) for x=1/4 is about 0.688 (I think, but let me not get sidetracked). So the chance of winning at least one is about 31.2%? Not exactly, but it's less than 1.

              So for 1 token, you get an infinite expected value, but the probability that you win anything at all is less than 1 (about 31.2% for the infinite series).

          We then discuss the implications.

     What can go wrong:
          - Participants might not take the tokens seriously: "it's just tokens, who cares". 
              Mitigation: Emphasize at the beginning that tokens are convertible to real rewards, and losing tokens means less reward. Make the conversion tangible (e.g., 200 tokens = $5 gift card, so 1 token = 2.5 cents). Then a loss of 100 tokens is $2.50, which stings.

          - Participants might suspect the game is rigged, especially if they lose a lot and never see a big win.
              Mitigation: Be transparent about the randomness. Use physical methods that are fair (dice, cards) and let them do the rolling/drawing. For the high-stakes, if we use a sealed envelope, have it prepared by a trusted third party and show the seal.

          - The very high-stakes wins might not occur in the room, so they don't see the payoff. 
              This is inherent. We can mention that in the real world, the astronomical payoffs are also not observed by the individual, but the theory still demands it.

          - The activity cannot reproduce genuinely astronomical stakes because the token payoffs are capped by the facilitator's budget. We use 100,000 tokens, but that's only $2500 if 1 token=2.5 cents. And 10^100 tokens is impossible. So they might not feel the true scale.

          - The game is self-interested, whereas the altruistic version (sacrificing certain good for a tiny chance of astronomical good for the world) is different and more compelling for some. We cannot replicate that in a game with personal tokens.

     For the altruistic angle, we might have to discuss it in the debrief.

     Materials:
          - Dice: many six-sided dice (at least 30)
          - A deck of 10 cards (for the 1/10 lottery) and two decks of 10 cards (labeled 0-9) for the 1/100 lottery.
          - A public ledger (whiteboard) to record token balances.
          - Sheets of paper for the bazaar and name-the-odds.
          - Envelopes for the high-stakes lotteries (if used) but we are not using them in the pump in this design.

     Token conversion: Decide on a conversion rate. For example, 200 tokens = $5 gift card, so 1 token = $0.025. 
          Then the payouts:
              Tier 1 win: 7 tokens = $0.175
              Tier 2 win: 50 tokens = $1.25
              Tier 3 win: 400 tokens = $10
              Deal 4 win: 10,000 tokens = $250
              Deal 5 win: 100,000 tokens = $2500

     We must ensure we have the budget for the highest possible payout. If 18 participants each might win the 100,000 token lottery, that's 1.8 million tokens = $45,000. That's not feasible.

     Mitigation: 
          - The probability of winning the 100,000 token lottery is 1/100. The expected payout per participant who takes it is 1000 tokens ($25). But if 18 participants take it, the expected total payout is 18 * 1000 = 18,000 tokens ($450). Still, there is a chance that one wins: 1 - (0.99)^18 ≈ 16.5%. If one wins, we pay $2500.

          - We can cap the maximum payout by our budget. For example, set the conversion such that the maximum payout is affordable. Or we can use a sliding scale: the gift cards are not for cash but for books or something we can get at a discount. Or we can set the conversion rate so that 100,000 tokens is a $50 gift card? But then the EV is only $0.50 for the 1/100 lottery? That might not feel like a big win.

          - Alternatively, we can use a token system where the payouts are in tokens, and then at the end, tokens are converted at a rate that ensures we don't exceed our budget. For example, we can set the conversion rate as: 
                total tokens in circulation after the game = T
                our budget for rewards = B dollars
                then conversion rate = B / T dollars per token.

            But then the participants don't know the value of a token when they make decisions. That breaks the game.

     We must have a fixed conversion rate. Therefore, we must choose payouts that are within our budget. We can set the highest payout to a level we can afford, say $250. Then 100,000 tokens = $250, so 1 token = $0.0025. Then starting tokens: 200 tokens = $0.50. This might be too low to care.

     Alternatively, we can use snacks and set the highest payout to be a very large snack (like a party platter) and the lower ones to be small snacks. We can have a snack menu:

          0 tokens: nothing
          1-50 tokens: a candy bar (50 tokens = one candy bar)
          51-100 tokens: two candy bars
          ... 
          100,000 tokens: a pizza party for the whole class? 

     But then the payouts are in kind and might not be linear.

     Given the challenges, I recommend:

          - Use a fixed conversion rate that is affordable. For example, 1 token = $0.01. Then:
              Starting balance: 200 tokens = $2.00
              Tier 3 win: 400 tokens = $4.00
              Deal 4 win: 10,000 tokens = $100
              Deal 5 win: 100,000 tokens = $1000

          - We must be willing to pay up to $1000 if someone wins the 1/100 lottery. And if we have 18 participants, and each has a 1/100 chance, the expected cost is 18 * $10 = $180. But there's a 16.5% chance that we have to pay $1000 at least once? Actually, the number of winners is binomial(18,0.01), so expected number of winners is 0.18, and the expected cost is $180. The probability of at least one winner is about 16.5%. We must be willing to risk $1000.

          - If we cannot afford $1000, then reduce the payout for Deal 5. For example, set it to 50,000 tokens ($500) or 20,000 tokens ($200).

     Summary of the game:

          - Participants start with 200 tokens.
          - Bazaar: They write max price for 5 lotteries (Tier 1 to Tier 5) as described.
          - Name the odds: They write the maximum N for which they would pay 1 token for a lottery that pays 1000*N tokens with probability 1/N.
          - Pump: 
               Round 1: Offer Deal 1 (Tier 1) to every participant. They can accept or decline. If accept, they pay 1 token and we roll one die: win 7 tokens if 1.
               Round 2: Offer Deal 2 (Tier 2) to every participant. Pay 1 token, win 50 tokens if two dice both 1.
               Round 3: Offer Deal 3 (Tier 3) to every participant. Pay 1 token, win 400 tokens if three dice all 1.
               Round 4: Offer Deal 4 (1/10 for 10,000 tokens) to every participant. Pay 1 token, win if they draw the ace of hearts from a deck of 10 cards (each card is unique).
               Round 5: Offer Deal 5 (1/100 for 100,000 tokens) to every participant. Pay 1 token, win if they draw two zeros from two separate decks of 0-9.
          - Lever: 
               For a volunteer who had a high stated max for Tier 3, we offer a single Tier 3 lottery at 1.9 tokens (below their max) and then a bundle of 10 for 19 tokens. We do the bundle by rolling 30 dice in groups of 3.

          - Debrief: Discuss the fanaticism and the infinite lottery.

     This fits in 90 minutes? 

          Intro: 5 min
          Bazaar: 10 min
          Name the odds: 5 min
          Pump: 5 rounds * 5 min = 25 min? We can do each round in 3 minutes? 
               Round 1: 3 min (18 decisions and die rolls)
               Round 2: 3 min
               Round 3: 3 min
               Round 4: 5 min (drawing from a deck of 10 for each takes a bit more time)
               Round 5: 5 min (drawing from two decks for each)
              Total: 19 min
          Lever: 10 min (for one or two volunteers)
          Debrief: 25 min

          Total: 5+10+5+19+10+25 = 74 minutes. Close.

     We might have to be very efficient in the pump rounds. In each round, we go around the room quickly:

          Facilitator: "Deal 1: Pay 1 token for a chance to win 7 tokens on a die roll. [Participant name], do you want it? ... [they answer] ... [if yes, roll die and update their tokens]."

          We can have a helper to update the public ledger.

     Given the complexity, this design is ambitious. We might need to test it.

     Let me know if you want adjustments.
answer: |-
  ### Game Design: Expected Value Fanaticism Simulation  
  **Goal:** Make participants experience the tension between unbounded expected value maximization and the intuition to avoid near-certain ruin for astronomical payoffs.  

  ---

  #### **Materials**  
  - **Tokens:** 200 tokens per participant (convertible to snacks/gift cards; e.g., 50 tokens = $1 value).  
  - **Dice:** 50+ six-sided dice (for odds like 1/6, 1/36, ..., up to 1/46,656).  
  - **Cards:**  
    - Pre-made "EV Reference Cards" showing expected value calculations (no calculators allowed).  
    - 10 custom cards numbered 1–10 (for 1/10 odds).  
    - 20 custom cards: two sets of 0–9 (for 1/100 odds).  
  - **Envelopes:** For high-stakes draws (sealed in advance).  
  - **Public Ledger:** Whiteboard to track token balances.  
  - **Participant Sheets:** For bazaar bids and "name the odds" cutoffs.  
  - **Timer:** For the pump round.  

  ---

  #### **Game Structure (Total: 55 minutes)**  
  **0. Setup (5 min)**  
  - Distribute 200 tokens each.  
  - Explain: Tokens convert to real rewards. Losing tokens = less reward.  
  - Rules: No calculators. Decisions are binding.  

  **1. Bazaar: Escalating Lotteries (10 min)**  
  - **Tiers of lotteries:** Sell tickets with increasing stakes. Payouts are designed to have **slightly better-than-fair EV** (EV > cost). Participants write their *maximum bid* for each ticket.  
    | Tier | Odds | Payout (tokens) | EV (tokens) | Cost (tokens) |  
    |------|-------|------------------|-------------|---------------|  
    | 1    | 1/6   | 7                | ~1.167      | 1             |  
    | 2    | 1/36  | 50               | ~1.389      | 1             |  
    | 3    | 1/216 | 400              | ~1.852      | 1             |  
    | 4    | 1/1,296 | 3,000           | ~2.315      | 1             |  
    | 5    | 1/7,776 | 25,000          | ~3.215      | 1             |  
    | 6    | 1/46,656 | 200,000         | ~4.286      | 1             |  
  - **Mechanics:**  
    - For odds ≤1/1,296: Resolve instantly with dice (e.g., Tier 4: Roll four dice, win if all 1s).  
    - For odds >1/7,776: Use **sealed envelopes** (pre-prepared random numbers; open if bought).  
    - *Why this works:* Low tiers feel fair (dice resolve visibly). High tiers use envelopes to avoid impractical draws while maintaining honesty.  

  **2. Name the Odds (5 min)**  
  - **Lottery:** Pay 1 token. Win 1,000 × *N* tokens with probability 1/*N* (EV = 1,000 tokens always).  
  - Participants write: "Largest *N* I accept: ______".  
  - *Pressure point:* EV is identical for all *N*, but intuition balks at high *N* (e.g., *N* = 1,000,000: 0.0001% chance of 1B tokens).  

  **3. The Pump: Adaptive EV Escalation (15 min)**  
  - **Rules:** Rapid-fire offers (15 seconds/person). Participants accept/reject individually. If rejected, next offer has **higher stakes/lower odds** (e.g., 1/100 → 1/1,000).  
    - *Example sequence:*  
      - Offer 1: Pay 1 token, win 10 tokens on 1/10 odds (EV+).  
      - Offer 2: Pay 1 token, win 100 tokens on 1/100 odds (EV+).  
      - Offer 3: Pay 1 token, win 1,000 tokens on 1/1,000 odds (EV+).  
      - *(...escalate until decline or 1/1,000,000)*  
  - **Mechanics:**  
    - Use cards/dice for odds ≤1/1,000. For >1/1,000, use envelopes.  
    - Update ledger publicly after each decision.  
    - *Key:* Push until participants decline. Shows how EV+ deals feel uncomfortable at scale.  

  **4. The Lever: Breaking Cutoffs (10 min)**  
  - **Step 1:** For a volunteer, offer a lottery *just past* their bazaar cutoff (e.g., if max bid for Tier 4 was 1.5 tokens, offer Tier 5 for 1.4 tokens).  
  - **Step 2:** Offer a **bundle** of their cutoff-tier lottery (e.g., 10 × Tier 5 for 14 tokens).  
  - **Mechanics:**  
    - Resolve bundles with grouped dice rolls (e.g., 10 Tier 5 games = roll 50 dice at once).  
    - *Illustrates:* EV additivity (bundle EV > cost) vs. near-certain ruin (e.g., 99.99% chance of losing all 14 tokens).  

  **5. Debrief (25 min)**  
  - **Key Points:**  
    1. **Fanaticism isn’t inconsistent:** EV is additive, so rejecting a bundle of EV+ deals *is* inconsistent. No Dutch books.  
    2. **The real tension:** Unbounded values force accepting near-certain ruin for a vanishing chance of astronomical gain. Any cutoff is arbitrary or exploitable.  
    3. **Infinite EV example:**  
       - Buy infinite lotteries: Cost = 1 token total.  
       - Lottery *k*: Pay \(\frac{1}{2^k}\) tokens, win \(8^k\) tokens at prob. \(\frac{1}{4^k}\).  
       - Total EV = \(\sum_{k=1}^{\infty} (2^k - \frac{1}{2^k}) = \infty\).  
       - Chance of any win = \(1 - \prod_{k=1}^{\infty} (1 - \frac{1}{4^k}) \approx 0.31\).  
       - *Verification:* \(\sum_{k=1}^{\infty} \frac{1}{2^k} = 1\), \(\sum_{k=1}^{\infty} \frac{8^k}{4^k} = \sum_{k=1}^{\infty} 2^k = \infty\).  
  - **Discussion Questions:**  
    - "Where did you feel uncomfortable? Why?"  
    - "Is there a non-arbitrary stopping point? What if tokens represented human lives?"  

  ---

  #### **Predictable Problems & Mitigations**  
  1. **"It’s rigged!"**:  
     - **Why:** High-tier wins are astronomically rare (e.g., 1/46,656 odds).  
     - **Fix:** Use transparent methods (dice for low tiers, pre-sealed envelopes for high tiers). Resolve a few low tiers visibly.  

  2. **"Just tokens, who cares?"**:  
     - **Why:** Low stakes reduce emotional investment.  
     - **Fix:** Emphasize token conversion early ("50 tokens = $1"). Use fast-paced pump round to raise stakes.  

  3. **What the Game Can’t Capture:**  
     - **Astronomical scale:** 10¹⁰⁰ tokens feels abstract. *Supplement in debrief:* Discuss real-world analogs (e.g., Pascal’s Mugging).  
     - **Altruistic tension:** Sacrificing certain good for others’ tiny chance of huge gain. *Supplement:* Describe a thought experiment (e.g., "Would you sacrifice $1,000 to give a stranger a 1/1,000,000 chance of $1B?").  

  ---

  #### **Timeline**  
  - Setup: 5 min  
  - Bazaar: 10 min  
  - Name the Odds: 5 min  
  - The Pump: 15 min  
  - The Lever: 10 min  
  - Debrief: 25 min  
  - **Total: 70 minutes** (buffer: 20 min for delays)  

  ---

  #### **Why This Works**  
  - **Self-discovered tension:** Participants *feel* the conflict via escalating stakes.  
  - **Physical honesty:** Dice/envelopes make randomness tangible.  
  - **Debrief depth:** Separates inconsistency (myth) from arbitrariness (real issue), and scaffolds to infinity.  

  Adjust stakes based on your budget (e.g., cap payouts at $50 if needed). Run it tight, and they’ll walk out unsettled by fanaticism!
