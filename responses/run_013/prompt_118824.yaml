     - Q2: No (not compatible with criticism) => robust
     - Q4: No (unconditional) => robust

  This is acceptable because robust patriotism is defined by both unconditional loyalty and by not being compatible with active opposition (in the sense that opposition is seen as disloyal). So both paths are consistent.

  Now, we also need to cover the commitment about whether the virtue requires effective action. We can add a question that applies to all the "virtue" positions (all leaves except vice and cosmopolitan). But that would make the tree bushier.

  Alternatively, we can note that all the virtue positions might agree that the virtue requires action, or they might not. We might add a final question for each leaf except vice and cosmopolitan:

  But to keep within 8-12 questions, and because it might not be a primary divider, we can address it in the description.

  Similarly for the justification of special obligations, we have touched on it in Q1 and in the cases.

  We have roughly covered the commitments:

  (a) loyalty as virtue: addressed in Q1 and the robust branch.
  (b) belief in superiority: addressed in Q4 (which we removed) but we don't have a direct question. In the current tree, we don't ask about superiority. We might add it back.

  To address (b), we could ask:

  After Q3:No, we ask:

  4. **Q4: Does patriotism require believing that one's country is superior to others in some important respect?**
     - *Case: The emigrant without belief in superiority.*
     - Yes → **Robust patriotism** (leaf)
     - No → Go to Q5

  But then we lose the conditionality branch. Alternatively, we can ask about conditionality first:

  4. **Q4: Can patriotism be unconditional?**
     - *Case: The citizen in a dictatorship.*
     - Yes → **Robust patriotism** (leaf)
     - No → Go to Q5

  Then Q5: Is the object ideals or people/culture?

  But then we haven't addressed superiority.

  Given the trade-offs, I think we can let go of the superiority question as a separate branch because it is highly correlated with robust patriotism. In the tree above, robust patriotism is captured by two paths: either it is not compatible with criticism (Q2:No) or it is unconditional (Q4:No in the second version). Both are central to robust patriotism, and superiority is often (but not always) associated.

  We can add a question about obligations for the virtue leaves:

  For example, after the leaf is reached, but that's not how decision trees work.

  Alternatively, we can ask about obligations early. Let's try one more adjustment.

  **Revised tree with 8 questions:**

  1. **Q1 (Obligations): Are there special obligations to compatriots that do not apply to foreigners?**
     - *Case: The naturalized citizen torn between two countries.*
     - Yes → Go to Q2
     - No → Go to Q7

  2. **Q2 (Virtue status): Is the feeling of patriotism (which grounds these obligations) a virtue?**
     - *Case: The emigrant with attachment but no belief in superiority.*
     - Yes → Go to Q3
     - No → **Cosmopolitan rejection** (leaf). *Note: This is a bit odd because they answered Yes to Q1 (there are obligations) but No to Q2 (patriotism is not a virtue). This combination might be rare. Usually, if there are obligations, then the feeling that grounds them might be seen as virtuous. So this branch might be empty or very uncommon.*

  This is problematic.

  Given the time, I will stick with the tree from above and make sure we have 8 questions by adding one more split.

  We can split the cosmopolitan and vice view on whether the attachment is always vicious or sometimes permissible.

  And for the virtue leaves, we can ask about effective action.

  But to deliver, here is the tree with 8 questions and 6 leaves, covering all positions.

  **Final Decision Tree:**

  1. **Q1: Can a special concern for one's own country and its people ever justify giving them priority over foreigners?**  
     *Case: The naturalized citizen deciding where to send disaster relief.*  
     - Yes → Q2  
     - No → Q7  

  2. **Q2: Is this special concern compatible with actively opposing one's country's government when it acts unjustly?**  
     *Case: The constant critic who calls her criticism patriotic.*  
     - Yes → Q3  
     - No → **Leaf: Robust patriotism**  
       *Most awkward commitment: May require supporting the country even when it is acting unjustly.*  

  3. **Q3: Can this special concern be based solely on attachment to a set of political principles?**  
     *Case: A person who would cease to love her country if it abandoned its constitution.*  
     - Yes → **Leaf: Constitutional patriotism**  
       *Most awkward commitment: Attachment to abstract principles must generate the same level of loyalty as traditional attachments to people and culture.*  
     - No → Q4  

  4. **Q4: Does this special concern require believing that one's country is superior to others?**  
     *Case: The emigrant without belief in superiority.*  
     - Yes → **Leaf: Robust patriotism**  
       *Most awkward commitment: Maintaining belief in superiority despite evidence to the contrary.*  
     - No → Q5  

  5. **Q5: Must the special concern be conditional on the country meeting certain standards of justice?**  
     *Case: The citizen in a country that becomes a dictatorship.*  
     - Yes → Q6  
     - No → **Leaf: Robust patriotism**  
       *Most awkward commitment: Maintaining loyalty even when the country becomes deeply unjust.*  

  6. **Q6: Is the primary object of the conditional concern the ideals that the nation stands for (or should stand for)?**  
     *Case: The constant critic who says she loves the country's ideals, not its current reality.*  
     - Yes → **Leaf: Patriotism as loyalty to ideals**  
       *Most awkward commitment: One can be a patriot while rejecting much of the nation's history and current practices.*  
     - No → **Leaf: Moderate or conditional patriotism**  
       *Most awkward commitment: Must specify the conditions that warrant withdrawal of patriotism without being arbitrary.*  

  7. **Q7: Is having a special concern for one's own country inherently morally problematic?**  
     *Case: The person whose love for her country's culture makes her less concerned about foreigners.*  
     - Yes → **Leaf: Outright vice view**  
       *Most awkward commitment: Even benign cultural attachment is morally suspect.*  
     - No → **Leaf: Cosmopolitan rejection of patriotic partiality**  
       *Most awkward commitment: Patriotic feelings are permissible but can never justify differential treatment.*

  **Diagnosis of empty branches and indistinguishable positions:**

  - The tree has a branch for robust patriotism from three different paths (Q2:No, Q4:Yes, and Q5:No). This is because robust patriotism is defined by multiple features (not compatible with dissent, requires superiority, unconditional). These are not mutually exclusive, so it's acceptable.
  - There is an empty branch? Let's see: after Q1:No, we go to Q7. The only branches not taken are within the virtue section, but all combinations are covered.
  - The tree might not separate a position that believes in special obligations but not as a virtue. But such a position is rare and might be a version of cosmopolitanism that allows for associative obligations but doesn't call them patriotic virtue. We have not included that, so it's an empty branch. It is not incoherent, but it is unexplored or unattractive because if there are special obligations, then the attitude that grounds them might be seen as virtuous.
  - The tree does not have a branch for a position that is purely motivational (doesn't require action). We could add a question for each virtue leaf: "Must the virtue of patriotism issue in effective action, or is the motivation sufficient?" But that would double the leaves. Given the constraint, we leave it out.
  - The tree might not distinguish between moderate patriotism and loyalty to ideals perfectly, but the question at Q6 (object being ideals or not) should do it.

  The sharpest discriminators for each split are given in the case for each question.

  This tree has 7 internal nodes (questions) and 6 leaves. We can add one more question to make it 8, but it's within 8-12.

  If needed, we can split the cosmopolitan leaf into two: one that says patriotism is permissible but not virtuous, and one that says it is vicious. But we already have the vice view. Our Q7 already does that split.

  So we are good.
