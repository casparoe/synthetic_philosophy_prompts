  Below is a two-stage sorting instrument for your seminar, designed as a decision tree based on concrete cases. The tree isolates core commitments through binary choices, avoids named authors, and uses real-world scenarios to force distinctions. Positions emerge as leaves, each annotated with its most awkward commitment. The diagnostic questions are sequenced to minimize presuppositions, and unoccupied combinations are flagged.

  ### Stage 1: Decision Tree (Logical Space)
  The tree has **10 questions** (internal nodes), each derived from a concrete case. Cases are chosen to isolate commitments without requiring prior knowledge of positions. The spine incorporates your specified commitments (a-f), reordered for logical flow. Key adjustments:
  - **Added**: A question about whether patriotism requires action or merely motivation (addresses commitment e).
  - **Reordered**: Begins with the object of attachment (c) to separate positions early, then moves to superiority (b), obligations (d), loyalty/virtue status (a), conditionality (f), and effectiveness (e).
  - **Dropped**: No major commitments dropped, but "loyalty as virtue" (a) is embedded in later questions.

  Each question includes:
  - The case used to force the branch.
  - Why it discriminates sharply (based on the case's tension).

  #### Decision Tree Questions:
  1. **Is the core object of patriotic attachment an *ideal* (e.g., justice, liberty) rather than a *people, culture, or land*?**  
     *Case: Someone who loves their country's landscape, language, and food but regards its government as an enemy.*  
     **Sharpness**: Forces object distinction (commitment c). "Yes" treats attachment as detachable from current institutions; "No" anchors it to tangible/naturalized elements.  

  2. **Does patriotism require believing your nation is *superior* to others in some fundamental way?**  
     *Case: An emigrant who retains patriotic feelings for their birth country but does not believe it is superior to their new nation.*  
     **Sharpness**: Tests superiority commitment (b). "Yes" implies exclusivity; "No" permits equality among nations.  

  3. **Can patriotism impose *special obligations* to prioritize compatriots over foreigners of equal need?**  
     *Case: A naturalized citizen who feels torn between sending aid to their birth country or current country during simultaneous disasters.*  
     **Sharpness**: Isolates obligations (d). "Yes" demands partiality; "No" rejects it, treating obligations as universal.  

  4. **Is patriotism a *species of loyalty* (implying fidelity to a specific group) rather than a generic goodwill?**  
     *Case: A soldier who obeys orders in an unjust war out of loyalty to their unit and country.*  
     **Sharpness**: Separates loyalty-based views (a) from non-loyalty views. "Yes" frames patriotism as group allegiance; "No" treats it as moral goodwill.  

  5. **Is loyalty (as defined in Q4) an *intrinsic virtue*, even when it conflicts with universal morality?**  
     *Case: The same soldier fighting an unjust war—is their loyalty morally admirable?*  
     **Sharpness**: Probes virtue status of loyalty (a). "Yes" defends loyalty unconditionally; "No" subordinates it to ethics.  

  6. **Must patriotic attachment be *unconditional* (persisting even if the nation betrays its ideals)?**  
     *Case: A citizen whose country becomes a dictatorship; must their patriotism endure?*  
     **Sharpness**: Tests conditionality (f). "Yes" treats attachment as immutable; "No" allows revocation.  

  7. **Can *criticism or dissent* be the highest expression of patriotism?**  
     *Case: Someone who constantly condemns their country's policies, calling this the "truest patriotism."*  
     **Sharpness**: Distinguishes critical from deferential loyalty (b/f). "Yes" equates dissent with love; "No" equates it with betrayal.  

  8. **Is patriotism *purely motivational* (valuable as an internal attitude) or must it *issue in effective action*?**  
     *Case: A person who feels intense patriotic love but never contributes to their community.*  
     **Sharpness**: Addresses effectiveness (e). "Yes" prizes sentiment alone; "No" demands practical impact.  

  9. **Can patriotism be *global or dual* (e.g., attachment to multiple nations) without contradiction?**  
     *Case: The naturalized citizen from Q3—can they be fully patriotic toward both nations?*  
     **Sharpness**: Challenges exclusivity (b/d). "Yes" allows plural attachments; "No" insists on singularity.  

  10. **Does patriotism *override* other virtues (e.g., justice) when they conflict?**  
      *Case: The soldier in Q4—should loyalty outweigh their moral duty to refuse an unjust war?*  
      **Sharpness**: Forces hierarchy of virtues (a/e). "Yes" prioritizes patriotism; "No" balances or subordinates it.  

  ---

  ### Stage 2: Positions as Leaves
  Positions are mapped to leaf combinations. Each leaf includes:
  - **Position name**: Descriptive label (no named authors unless essential).
  - **Definition**: Core stance in 1–2 sentences.
  - **Most awkward commitment**: A single sentence capturing its hardest-to-defend implication.
  - **Unoccupied combinations**: Marked and diagnosed (incoherent, unattractive, or unexplored).
  - **Indistinguishable positions**: Flagged pairs the tree cannot separate.

  #### Leaves (Positions):
  1. **Robust patriotism**  
     - *Reached by*: Q1=No (object not ideals), Q2=Yes (superiority required), Q3=Yes (special obligations), Q4=Yes (loyalty-based), Q5=Yes (loyalty virtuous), Q6=Yes (unconditional), Q7=No (dissent not patriotic), Q8=No (requires action), Q9=No (singular), Q10=Yes (overrides justice).  
     - **Definition**: Patriotism is an unconditional loyalty to one's nation (people/culture), requiring belief in superiority, special obligations to compatriots, and action that may override justice.  
     - **Most awkward commitment**: It must defend why loyalty can justify participating in or excusing grave injustices (e.g., war crimes).  

  2. **Moderate patriotism**  
     - *Reached by*: Q1=No (object not ideals), Q2=No (no superiority), Q3=Yes (special obligations), Q4=Yes (loyalty-based), Q5=Yes (loyalty virtuous), Q6=No (conditional), Q7=Yes (dissent can be patriotic), Q8=No (requires action), Q9=Yes (dual possible), Q10=No (doesn't override justice).  
     - **Definition**: Patriotism is loyalty to a people/culture, generating special obligations, but it is conditional on moral standards, permits dissent, and balances with other virtues.  
     - **Most awkward commitment**: It struggles to define the threshold at which national flaws (e.g., systemic corruption) forfeit patriotic obligations.  

  3. **Constitutional patriotism**  
     - *Reached by*: Q1=Yes (object ideals), Q2=No (no superiority), Q3=Yes (special obligations), Q4=Yes (loyalty-based), Q5=Yes (loyalty virtuous), Q6=No (conditional), Q7=Yes (dissent patriotic), Q8=No (requires action), Q9=Yes (dual possible), Q10=No (doesn't override justice).  
     - **Definition**: Patriotism is loyalty to universal ideals (e.g., democracy, rights) embodied in a political order; it demands action to uphold those ideals and permits dissent when they are betrayed.  
     - **Most awkward commitment**: It must explain why attachment to universal ideals generates *particular* obligations to one's own nation.  

  4. **Patriotism as loyalty to ideals (with loyal dissent)**  
     - *Reached by*: Q1=Yes (object ideals), Q2=No (no superiority), Q3=No (no special obligations), Q4=No (not loyalty-based), Q5=N/A, Q6=No (conditional), Q7=Yes (dissent patriotic), Q8=No (requires action), Q9=Yes (dual possible), Q10=No (doesn't override justice).  
     - **Definition**: Patriotism is a commitment to ideals (e.g., equality) that may transcend any nation; it requires action to realize those ideals, and dissent is its purest form.  
     - **Most awkward commitment**: It risks collapsing into cosmopolitanism by denying special obligations to compatriots despite invoking "patriotism."  

  5. **Cosmopolitan rejection**  
     - *Reached by*: Q1=Any, Q2=No (no superiority), Q3=No (no special obligations), Q4=No (not loyalty-based), Q5=No (loyalty not intrinsically virtuous), Q6=N/A, Q7=Any, Q8=Any, Q9=Yes (dual possible), Q10=No (doesn't override justice).  
     - **Definition**: Patriotism is unjust partiality; obligations are universal, and attachment to nationhood is irrelevant or corrosive to ethics.  
     - **Most awkward commitment**: It must reconcile with intuitive duties to one's community (e.g., disaster response) without granting them moral weight.  

  6. **Outright vice view**  
     - *Reached by*: Q1=No (object not ideals), Q2=Yes (superiority required), Q3=Yes (special obligations), Q4=Yes (loyalty-based), Q5=No (loyalty not virtuous), Q6=Any, Q7=No (dissent not patriotic), Q8=Any, Q9=No (singular), Q10=Yes (overrides justice).  
     - **Definition**: Patriotism is a vice—loyalty to nation is irrational, fosters superiority, overrides justice, and enables harm.  
     - **Most awkward commitment**: It must explain why cultural attachment (e.g., to language or traditions) is inherently corrupting even when benign.  

  #### Unoccupied Combinations:
  - **Q1=Yes + Q2=Yes + Q3=Yes** (Object=ideals, superiority required, special obligations):  
    *Diagnosis*: **Incoherent**. If patriotism attaches to universal ideals (Q1=Yes), requiring superiority (Q2=Yes) contradicts their universality. No position occupies this.  
  - **Q4=No + Q5=Yes** (Not loyalty-based, but loyalty is virtuous):  
    *Diagnosis*: **Unexplored**. Positions that reject patriotism as loyalty (Q4=No) also reject loyalty as an intrinsic virtue (Q5=No). A position affirming loyalty's virtue while denying its link to patriotism is theoretically possible but unsupported in literature.  
  - **Q6=Yes + Q7=Yes** (Unconditional, but dissent is patriotic):  
    *Diagnosis*: **Unattractive**. Unconditional attachment (Q6=Yes) implies no exit from loyalty, making dissent incoherent. Only positions with Q6=No (conditional) affirm dissent as patriotic.  

  #### Indistinguishable Positions:
  - **Constitutional patriotism vs. Loyalty-to-ideals patriotism** when Q3=No (no special obligations).  
    *Why*: Both attach to ideals (Q1=Yes) and reject superiority (Q2=No). The tree cannot isolate constitutional patriotism's emphasis on *political institutions* (e.g., a constitution) vs. loyalty-to-ideals' focus on abstract principles.  
    *Resolution*: Add a sub-question: "Must ideals be institutionalized (e.g., in laws) to be patriotic objects?"  

  This instrument isolates positions through concrete tensions. The sharpest cases are:
  - **Unjust soldier (Q4/Q5/Q10)**: Best discriminates loyalty/virtue/override commitments.
  - **Emigrant without superiority (Q2)**: Clearest test for national superiority.
  - **Naturalized citizen (Q3/Q9)**: Sharpest for obligations and dual attachment.  

  Use the tree to sort seminar participants into positions, then discuss the "awkward commitments" to surface tensions. Adjust as needed for your group size.
