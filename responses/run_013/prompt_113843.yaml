  2. After a run of blacks, the Bayesian updates and increases the probability. The frequency office might use the observed frequency so far? The propensity might also increase their number? But they might not (if they think the propensity is fixed and they are just estimating it).
  3. Injection (i): the reset. The Bayesian has been updating continuously and now learns that the bag reset. They realize they should have reset their prior at draw 6. The frequency office might have been using the entire history (both bags) and now they learn that the two bags are independent, so they should treat them separately? The propensity lab: they thought the propensity was fixed, but now they learn it changed. How can they tell? The setup looked the same.
  4. Injection (ii): reference-class auction. The frequentist view requires a reference class, and there is no unique correct one. The choice affects the probability.
  5. Injection (iii): sealed bag. The Bayesian assigns a probability (0.5) to the bag being 30%. The frequentist might also assign 0.5, but note: this is not a frequency of an outcome in a repeatable experiment for that bag? It's a frequency over bags. The propensity view might assign 0.5, but then we ask: is this a physical disposition? Or is it just our ignorance?

  Failure modes:

  - Teams peeking in the bag: prevent by controlling the bag.
  - Frequency Office refusing to post a number: we must force them to post. We can say: "In this activity, you have to post a number. If you don't have a long-run frequency, you can use an estimate or the design frequency." But that might not be satisfactory. Alternatively, we can allow them to post an interval or a range? But the task requires a number. We might have to accept that they post "unknown" or something, but then we discuss in debrief.
  - Betting Desk: if we have them post a single probability, then we don't have the two-sided market. But if we have two numbers, it might be too complex. I suggest we stick to one number for simplicity.
  - Time: we might run out of time. We have to keep the rounds short.
  - Separate two-sided prices: if we do require two numbers, then we need rules for how others can bet with them. We can have a market maker: the Betting Desk posts a buy price and a sell price. Then other teams can choose to buy from them or sell to them? But that might take too long. And we don't have time for actual betting. So I think we skip actual betting and just have them post the prices as an expression of their belief.

    Alternatively, we can have one student from the betting desk act as the market maker, and we have a few seconds for other teams to trade? But that might be chaotic.

    I recommend having the Betting Desk post a single probability (their fair betting price). Then we don't have the spread, but we get the idea.

  Debrief points:

  - The Betting Desk is the most flexible: they can assign probabilities to any event. But they are vulnerable to model misspecification (like not knowing about the reset).
  - The Frequency Office struggles with small samples and reference class selection. Also, they cannot assign probabilities to one-time events without a reference class.
  - The Propensity Lab has to attribute a physical disposition, but when the setup is identical (after reset), the disposition might change. Also, they might not be able to assign a number without data? And the sealed bag: they might resist assigning a propensity to the bag's composition? Because propensity is about the chance setup producing outcomes, not about the state of the bag.

  - The objection that "everything ends up being a bet": In this activity, all teams had to produce a number that could be used for decision making. The Bayesian explicitly uses betting, but the others are also forced to produce a number. However, in the real world, frequentist methods (like confidence intervals) are not directly about betting, and propensity is about the world's structure. But in this activity, they are all reduced to numbers. That's a limitation.

  Limitations of the game:

  - It doesn't show the strength of frequentism in hypothesis testing and error control.
  - It doesn't show the metaphysical depth of propensity (as an irreducible disposition).
  - It doesn't show the Bayesian approach in decision theory and updating with complex evidence.

  We need to mention these in the debrief and then supplement with a 5-minute lecture.

  Rules for the Frequency Office to avoid them refusing to post:

  - Instruct them: "You must produce a number that represents the long-run frequency. If you don't have a long-run frequency for the exact event, you may use a reference class that you think is appropriate. You must state the reference class."

  Similarly for Propensity Lab: "You must produce a number that represents the physical disposition of the setup to produce a black chip on the next draw. If you don't know, you may use the best estimate you have."

  This will force them to engage, even if imperfectly.

  First-time failures:

  - Teams might not understand their role: spend more time in introduction.
  - The reset might be confusing: explain clearly when revealing.
  - The reference-class auction might be slow: prepare the reference classes in advance on cards.

  Final timeline:

  1. Introduction (5 min)
  2. Round 0: initial posts (3 min)
  3. Rounds 1-10: each round: draw a chip, record color, teams discuss for 2 minutes and post. (20 min total for 10 rounds, but we have 11 rounds including round 0? Let's do 10 rounds of draws, so rounds 0 to 10 is 11 rounds. We can do 2 min per round after round 0: 10 rounds * 2 min = 20 min, plus drawing time: negligible. So 25 min for rounds 0-10.)
     - Reset after round 5 (after the 5th draw): secretly reset the bag before draw 6.
  4. After round 10: announce the reset and discuss the implications (5 min)
  5. Injection (ii): reference-class auction (10 min)
     - Present the Frequency Office with three reference classes for the event: "the next draw from a new bag is black".
     - Classes (written on cards):
          a. All draws from all bags so far (10 draws)
          b. Draws from bags that had at least three black in the first five draws (if any, use the draws from those bags)
          c. Draws made in this room on a Tuesday (and today is Tuesday)
     - Frequency Office picks one and states the frequency.
     - Then ask the Propensity Lab: which reference class would you use? Why? They might choose a different one.
     - Discuss.
  6. Injection (iii): sealed bag (10 min)
     - Place a sealed bag (prepared by the same procedure) on the table.
     - Ask: "What is the probability that this bag contains 30 black chips?"
     - Each team posts a number and a one-line justification.
     - Discuss the differences.
  7. Debrief (15 min): walk through the key moments, the challenges, and the limitations.

  Materials:
  - Opaque bag
  - 200 poker chips (100 for each of two bags, but we only use one at a time)
  - A coin
  - Whiteboard to record team outputs and the sequence of draws
  - Play money (optional, but we aren't using it for betting, so perhaps not necessary)
  - Cards for reference classes in injection (ii)

  This should fit in 90 minutes.
answer: |-
  Below is a fully developed activity based on your setup, designed to force students to confront the core challenges of each probability interpretation (frequentist, Bayesian, propensity) through experiential learning. The activity uses poker chips, a whiteboard, and structured team roles, with "injections" to prevent the views from collapsing into one another. It runs in a 90-minute seminar with 15 students (divided into three teams of five) and requires minimal prep.

  ### **Core Setup**
  - **Materials**: 
    - Opaque bag.
    - 100 poker chips (30 black, 70 white OR 70 black, 30 white—determined by pre-class coin flip: heads = 30 black, tails = 70 black). Do not reveal the split.
    - Whiteboard (to record draws, team outputs, and rules).
    - Play money (e.g., colored paper slips) for the Betting Desk (optional; simplifies tracking).
    - Pre-written cards for Injection (ii) (reference classes).
    - A second identical sealed bag (for Injection iii), prepared the same way (coin flip) but never opened.
  - **Key Rule**: Draws are **without replacement** until the bag is reset (see Injections). Teams post a number and a one-line statement each round. Emphasize: "No peeking, no laptops—rely only on your team’s interpretation."

  ### **Team Roles & Rules**
  Split students into three teams. Each has 2 minutes per round to discuss and post:

  1. **Betting Desk (Bayesian)**:
     - **Task**: Post a **single "fair betting price"** (probability) for a token that pays 1 play-money unit if the next chip is black. This price is both the buy and sell price (simplifies to one number; no spread needed).
     - **Statement Format**: "This is the price at which we are indifferent to buying or selling a bet on black."
     - **Rules**: 
       - Start with prior belief: 50% chance bag is 30% black, 50% chance it’s 70% black → initial probability = \(0.5 \times 0.3 + 0.5 \times 0.7 = 0.5\).
       - Update beliefs using Bayes’ theorem after each draw. (Provide formula: \( P(\text{black}) = \frac{\text{number of black draws so far} + \text{prior weight}}{\text{total draws} + \text{total prior weight}} \); suggest prior weight = 2 for simplicity, representing two hypothetical draws [1 black, 1 white]).
       - **Why one number?** Avoids bid-ask spread complexity; focuses on coherent belief updating. Play money is symbolic (no need for real trading).

  2. **Frequency Office (Frequentist)**:
     - **Task**: Post a **single frequency** (number) and specify a **reference class**.
     - **Statement Format**: "This is the long-run frequency of black chips in [reference class]."
     - **Rules**: 
       - Must choose a defensible reference class from observed data or experimental design.
       - Initial reference class: "Draws from all bags prepared by this coin-flip procedure" → frequency = 0.5 (marginal probability over 30%/70% bags).
       - After draws, they can change the reference class (e.g., "draws from this bag," "draws after the first black," etc.), but must state it.
       - **Critical constraint**: They cannot use Bayesian updating (e.g., no posteriors). If stuck, they may use the observed frequency so far as an *estimate*, but must justify the reference class.

  3. **Propensity Lab (Propensity)**:
     - **Task**: Post a **single propensity** (number) as a physical disposition.
     - **Statement Format**: "This is the setup’s physical tendency to produce black; it would change if [condition]."
     - **Rules**: 
       - Start with propensity = 0.5 (reflecting the coin-flip setup’s symmetry).
       - Interpret propensity as fixed per bag unless the physical setup changes (e.g., bag remixed, chips added).
       - After draws, they can adjust their *estimate* of the propensity but must state what physical change would alter it (e.g., "if the bag were shaken violently").
       - **Critical constraint**: They cannot cite beliefs or frequencies—only physical properties.

  ### **Round-by-Round Timeline** (Total: 50 minutes)
  - **Introduction (5 min)**: 
    - Explain the three interpretations (1 min each) and team rules. Assign teams. Reveal: "Bag has 100 chips; split (30%/70% black) was set by coin flip; draws without replacement."
    - Write team names on whiteboard with columns for round outputs.
  - **Round 0 (Initial Post) (5 min)**:
    - Teams post initial numbers/statements with no data. Expected: All post 0.5 for different reasons (Bayesian: prior; Frequentist: marginal frequency; Propensity: symmetric setup). Record on whiteboard.
  - **Rounds 1–10 (40 min; 4 min per round)**:
    - **Per Round**: 
      1. **Draw**: Draw one chip, show color, record on whiteboard (e.g., "Round 1: Black").
      2. **Team Discussion (2 min)**: Teams update their numbers/statements.
      3. **Post (1 min)**: One speaker per team states number and one-line justification. Record on whiteboard.
      4. **Reset After Round 5 (Injection i)**: After the 5th draw, secretly refill the bag using a new coin flip (do not reveal until later). Continue draws 6–10 from the new bag.
  - **Injections (25 min)**:
    - **Injection i: Propensity Reset Reveal (after Round 10) (5 min)**:
      - Reveal: "I reset the bag with a new coin flip after Round 5. Draws 1–5 and 6–10 are from different bags." Ask teams:
        - Propensity Lab: "Did the chance change? How do you know if the setup looks identical?" (Forces them to confront how propensity is "in the setup" but unobservable.)
        - Frequency Office: "Does your reference class change?" (May split classes per bag.)
        - Betting Desk: "Do you need to revert to your prior?" (Highlights model misspecification.)
      - **Goal**: Teams realize propensities changed invisibly, frequencies need new reference classes, Bayesians updated incorrectly post-reset.
    - **Injection ii: Reference-Class Auction (10 min)**:
      - Give Frequency Office three pre-written reference classes for "the next draw from a new bag" (use data from first 5 draws):
        - "All draws from this bag (first 5)."
        - "Draws from bags that showed ≥3 black in first 5 draws (if applicable)."
        - "Draws in this room on a Tuesday (today)."
      - Frequency Office picks one and posts a frequency (e.g., using observed proportion in that class). Propensity Lab argues for a different class (e.g., "Class 2 is arbitrary; Class 1 is more direct").
      - **Goal**: Highlights frequentism’s reference-class problem—no objective choice.
    - **Injection iii: Sealed Bag (10 min)**:
      - Place the sealed bag on the table. Ask: "What is the probability this bag contains 30 black chips?"
      - Teams post numbers/statements:
        - Betting Desk: Uses prior (0.5) or updates from observed bags (e.g., if both bags seemed 70%, might lower it).
        - Frequency Office: Likely says 0.5 ("long-run frequency of 30% bags").
        - Propensity Lab: May refuse or say 0.5 ("propensity of coin flip"), but struggles—dispositions don’t apply to static states.
      - **Goal**: Numbers split here: Bayesians assign credence, frequentists use a frequency, propensitists face a metaphysical mismatch.

  ### **Debrief (15 min)**
  Walk through key moments, linking to interpretations and objections:
  - **Initial Agreement (Round 0)**: All at 0.5, but for different reasons: Bayesian (belief), Frequentist (design frequency), Propensity (symmetry). Shows interpretations can coincide superficially.
  - **Early Rounds (e.g., Run of Blacks)**: 
    - Bayesian updates smoothly (probability rises). 
    - Frequentist adjusts reference class or uses observed frequency (e.g., "frequency in this bag so far"). 
    - Propensity may not change ("disposition is fixed; we’re just estimating").
    - **Objection Alert**: "Frequentism and Propensity sound Bayesian!" → Point out: Frequentists avoid beliefs (only frequencies), Propensitists avoid data-dependence (only physical causes).
  - **Injection i (Reset Reveal)**:
    - Bayesian: Admits error (updated across bags; should have reset). Strength: Flexible but vulnerable to model misspecification.
    - Frequentist: Struggles to define reference class (one bag or two?). Strength: Grounded in data, but arbitrary under uncertainty.
    - Propensity: Can’t detect change without physical evidence. Strength: Metaphysical, but empirically empty here.
  - **Injection ii (Reference-Class Auction)**:
    - Frequentism’s jam: No unique class (e.g., "Tuesday" vs. "this bag"). **Debrief point**: This mirrors real problems (e.g., defining "probability of death" for a smoker—all smokers? same age? same gene?).
  - **Injection iii (Sealed Bag)**:
    - Bayesian: Assigns 0.5 (natural for beliefs). Objection: "Betting Desk wins by construction!" → Acknowledge: Yes, in this activity, all teams bet. But in the real world, Bayesians *define* probability via bets, while others don’t. This limits non-Bayesian views here.
    - Frequentist: Uses 0.5 (frequency of 30% bags). **Debrief**: Frequentism often avoids single-case probabilities—here it’s forced, exposing discomfort.
    - Propensity: May balk ("propensity applies to processes, not states"). **Debrief**: Highlights propensity’s metaphysical role (irreducible disposition) vs. Bayesian "degree of belief."
  - **General Objections**:
    - "Why did Bayesians dominate?" Because the activity is bet-centric. But this is a teaching moment: Bayesians excel at coherent belief updating but require correct models.
    - "Are the other views useless?" No—this activity simplifies them. In debrief, note:
      - Frequentism’s real strength: Error control in sampling/testing (e.g., p-values, confidence intervals). 
      - Propensity’s depth: It’s about causal powers in nature (e.g., quantum mechanics), not just numbers.
      - (Spend 5 minutes post-activity clarifying these points.)

  ### **Failure Modes & Mitigations**
  - **Teams Peek in Bag**: 
    - **Prevention**: Control bag access (only you draw). Penalize peeking with a "corrupted data" penalty (e.g., skip their next turn).
  - **Frequency Office Refuses to Post**:
    - **Why**: Legitimate—frequentism resists single-case probabilities. 
    - **Mitigation**: Pre-rule: "You must post a number. Use the best reference class available or the design frequency." In debrief, validate their discomfort as a feature of frequentism.
  - **Betting Desk’s Two-Sided Prices**:
    - **Problem**: If you required bid/ask spreads, policing trades would be chaotic. 
    - **Fix**: Use a single price (as above). If spreads are essential, simplify: 
      - Betting Desk posts one buy price \(b\) and one sell price \(s\) (\(s \geq b\)). 
      - **Pick-Off Rules**: If another team bids above \(b\) or offers below \(s\), the trade happens at \(b\) or \(s\). Example: 
        - Betting Desk posts buy $0.40, sell $0.60. 
        - If Propensity Lab bids $0.50 (to sell), trade occurs at $0.60. 
        - Only allow trades after posting; use play money for one token per round to avoid complexity.
  - **Teams Act Alike**: 
    - **Why**: Students default to Bayesian thinking. 
    - **Mitigation**: Enforce role constraints (e.g., remind Frequency Office: "No belief updating!"). Use injections to force divergence.
  - **Time Overrun**:
    - **Risk**: Rounds or debrief run long. 
    - **Mitigation**: Use a timer. Cap rounds at 10. Skip Injection ii if needed (prioritize iii).
  - **Propensity Lab Struggles Early**:
    - **Why**: Estimating a "disposition" feels artificial. 
    - **Mitigation**: Encourage statements like: "Propensity is 0.3; it would change if chips were magnetic." Injection i addresses this.
  - **First Draws Are Boring**:
    - **Risk**: Early agreement (all ~0.5). 
    - **Mitigation**: Use a biased initial draw (e.g., rig first chip to be black) or emphasize subtle differences in statements.

  ### **What the Game Can’t Show**
  - **Frequentism’s Strengths**: The activity can’t replicate error rates, hypothesis testing, or sampling theory. **Solution**: Post-activity, note: "Frequentism shines in controlling false positives in drug trials or polling—here it was handcuffed to a single bag."
  - **Propensity’s Metaphysics**: The game reduces propensity to a number, missing its "irreducible disposition" nature (e.g., in quantum mechanics). **Solution**: Explain post-activity: "Propensity isn’t just a number—it’s why a radioactive atom decays, independent of beliefs or frequencies."
  - **Bayesian Decision Theory**: The focus is on updating, not optimal decisions. **Solution**: Briefly note: "Bayesians use probabilities for expected utility maximization—we only saw belief updating."

  ### **Instructor Notes**
  - **Prep**: Fill bags pre-class; test coin flips. Pre-write reference-class cards for Injection ii.
  - **During Game**: Be a "game master"—enforce rules, record numbers, reveal injections dramatically.
  - **Post-Game**: Use whiteboard to recap team outputs and debrief. Stress: "The point wasn’t to ‘win’ but to feel each view jam."

  This activity forces divergence at the injections (especially the sealed bag), making the interpretations tangible. Students will experience—not just hear—why these views aren’t "three flavors of the same thing."
