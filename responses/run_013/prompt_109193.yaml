prompt: |-
  My sister was born in 1994 and I was born in 1998, which apparently makes her a Millennial and me Gen Z, and it's a running joke in my family — except now I have to write a seminar paper on whether generations are real kinds, and I've realized I dont know what a theory of generations would even have to do to be right. So before I read anything, give me the desiderata.

  What does any adequate account of generations-as-kinds have to deliver? The cases it has to get right, the distinctions it can't collapse, the facts it can't contradict — with the reason behind each one. Some stuff I've been chewing on, use or discard as you see fit: that you can't separately estimate age, period and cohort effects from the usual data, since the three are linearly tied together, so a theory can't just say the data will vindicate it; the old distinction between a bare cohort and a generation proper, meaning people who share a formative experience and a way of reading it; that the labels might be real precisely because people pick them up and start living up to them; that generation also means lineage, as in second-generation immigrant, and I can't tell whether that's the same kind of thing or a homonym; and that generational claims are usually claims about averages getting read onto individuals. Also — does a cohort kind that works for the US have to work for a country that skipped landlines entirely?

  Tell me which of these are genuine requirements and which are just habits of one camp, and flag any pair that can't be satisfied together. I suspect there's at least one. Skip the scorecard of the usual suspects, I'll do that in class — but dont hedge on this: which single requirement rules out the most popular theories? Commit to an answer.
