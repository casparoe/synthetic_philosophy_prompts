  Okay, the user is in a philosophy of mind reading group and keeps encountering the knowing-how/knowing-that distinction but feels confused by a garbled version they got from a cognitive science textbook. They want me to act as a philosopher of mind who's deeply familiar with Ryle and the know-how literature to clarify this. 

  First, I need to unpack what the distinction actually is. Ryle's central point is that intellectualism - the idea that all intelligent behavior requires prior propositional knowledge - leads to an infinite regress. If every action needed a prior rule to apply it, you'd need another rule for applying that rule, ad infinitum. Ryle's solution is that know-how (skills, abilities) is not reducible to know-that (propositional knowledge). 

  Now looking at the textbook summary they paraphrased: It's mixing several things that shouldn't be conflated. The procedural/declarative memory comparison is misleading - Ryle wasn't doing cognitive psychology. The "tacit" knowledge reference to Polanyi is anachronistic and conceptually different. And the Stanley & Williamson interpretation here is oversimplified - they don't actually claim the distinction collapses, just that know-how is a species of know-that.

  The user suspects some parts are wrong, especially about memory systems and "tacit" knowledge - they're right to be suspicious. The textbook is grafting psychological categories onto Ryle's philosophical argument, which distorts both. 

  For the payoff: No, Stanley & Williamson's view doesn't make Ryle "basically wrong." Their intellectualist position is more nuanced - they agree know-how exists but argue it's propositional in form. A Rylean defender would point to cases of skillful action without propositional articulation, like the bike-riding example I'll develop.

  For the concrete case: Consider someone who can perfectly balance on a bike but can't articulate how (common with kids). This shows know-how without corresponding know-that. But it doesn't prove know-how could never be propositional - just that it often isn't in practice. That's the pressure point against "it's all knowing-that."

  The user seems genuinely curious but frustrated by oversimplifications. They need clear distinctions kept sharp: philosophical vs psychological, conceptual vs empirical, Ryle's actual arguments vs textbook summaries. And they want something usable for their reading group - not more references but a solid grasp they can deploy in discussion.
answer: |-
  Alright, strap in. I've spent more hours than I care to admit arguing about this in seminars and wrestling with the texts. Your suspicion is spot on – that textbook summary is a classic case of garbling, mixing distinct concepts and misrepresenting key positions. Let me break it down sentence by sentence, like we're dissecting it in a grad seminar. I'll note what's acceptable, what's problematic, and what's just plain wrong. Then we'll tackle the payoff and get you that concrete case.

  **The Distinction Itself (What Ryle Actually Cared About):**
  Ryle's target was **Intellectualism**. This is the view that performing any intelligent action *requires* first contemplating a proposition (a piece of "knowing-that") about how to do it. His core argument is the **Regress Argument**: If acting intelligently (e.g., tying a good knot) *always* required prior intellectual contemplation of a proposition ("To tie a reef knot, one must first..."), then that contemplation itself would be an intelligent act. How is *that* performed intelligently? It would require contemplating *another* proposition about how to contemplate the first proposition... and so on, ad infinitum. To avoid this absurd infinite regress, Ryle argued, we *must* recognize a form of intelligence that isn't propositional contemplation: **knowing-how**. Know-how is the *skill* or *capacity* to perform the action directly, intelligently, without needing to run through internal propositions first. It's a disposition to behave intelligently in relevant situations. Crucially for Ryle, know-how often *involves* or *underlies* our ability to state know-that, not the other way around. Knowing the rules *is* a kind of know-how (the skill of reciting/explaining rules), which itself rests on more fundamental practical skills.

  **Common Mistakes People Make (That Your Summary Illustrates):**
  1.  **Psychologizing / Neurologizing:** Mapping Ryle's *conceptual* distinction directly onto empirical cognitive/neural systems (like procedural/declarative memory).
  2.  **Over-Identification with Tacit Knowledge:** Conflating Ryle's know-how with Polanyi's (much later and conceptually distinct) notion of "tacit knowing," which has its own baggage.
  3.  **The Inarticulability Claim:** Assuming Ryle *defined* know-how by its inarticulability. He didn't; inarticulability is often a *symptom*, not the essence. Experts *can* often articulate aspects of their know-how.
  4.  **The "No Propositional Knowledge At All" Straw Man:** Misreading Ryle as claiming know-how involves *zero* propositional elements. He argued against the *priority* of propositional knowledge for intelligent action, not necessarily against its presence or relevance.
  5.  **Oversimplifying Stanley & Williamson (S&W):** Presenting their complex linguistic/philosophical argument as simply "showing Ryle wrong" and collapsing the distinction.

  **Dissecting the Summary Sentence-by-Sentence:**

  1.  **"Ryle's distinction between knowing how and knowing that is basically the psychologist's procedural/declarative memory distinction."**
      *   **Wince! Wrong.** This is a classic category error. Ryle was doing **conceptual analysis** – clarifying the logical grammar of our concepts ("know," "intelligent," "action"). He wasn't making an empirical claim about brain systems or memory storage. Procedural/declarative is a valuable *empirical* distinction in cognitive science, but it's a different project. Mapping them 1:1 distorts both. Ryle's know-how *could* involve declarative memory (e.g., recalling a recipe *as part of* cooking), and procedural memory *could* sometimes be non-intelligent (e.g., reflexes). Fusing these distinct levels (conceptual vs. empirical) is the root of much confusion.

  2.  **"Knowing that is propositional and you can say it out loud; knowing how is a skill stored in a different system that you can't put into words, like riding a bike or swimming."**
      *   **Half Acceptable, Half Problematic.**
          *   *Acceptable:* Know-that *is* propositional (it's knowledge *that p*, where p is a proposition). Know-how *is* a skill/capacity. Examples like bike riding and swimming *are* paradigmatic know-how.
          *   **Problematic/Wrong:** "Stored in a different system" – Again, this psychologizes Ryle's conceptual point. "You can't put into words" – This is an **overstatement and misdirection**. Ryle's point isn't primarily about *inarticulability*. You *can* often give verbal instructions for swimming ("kick your legs, move your arms like this"). His point is that *merely* knowing those instructions (the know-that) **is not sufficient** to *be able* to swim (the know-how), and crucially, that the *intelligent application* of those instructions in the water doesn't itself require *further* internal contemplation of propositions. The skill itself isn't "composed of" propositions, even if propositions can describe it or be used in learning it. Inarticulability *can* happen (e.g., nuances of balance on a bike), but it's not definitional.

  3.  **"Ryle's main argument is the regress: if every intelligent action had to be preceded by a piece of knowing-that, you'd need another piece of knowing-that to apply the first, and so on forever..."**
      *   **Acceptable (as far as it goes).** This correctly identifies the core regress argument against Intellectualism. Good.

  4.  **"...so knowing how can't involve any propositional knowledge at all."**
      *   **Wrong / Oversimplification.** This is the critical misstep. Ryle's conclusion from the regress is **not** that know-how *excludes* propositional knowledge. His conclusion is that know-how **cannot be reduced to, or consist solely in, the prior contemplation of propositions.** Know-how is a *distinct kind* of capacity that *enables* intelligent action without triggering the regress. Propositional knowledge might *accompany* know-how, be *used* in acquiring it, or be *generated* by reflecting on it, but it's not what *constitutes* the intelligent performance itself. A skilled chess player uses propositional knowledge *during* play, but their skill isn't *reducible* to recalling propositions; it's the capacity to see the board, recognize patterns, and make moves intelligently – a capacity honed by practice.

  5.  **"That's why Ryle calls know-how 'tacit', in Polanyi's sense..."**
      *   **Wrong / Anachronistic Fusion.** Ryle **did not** use the term "tacit" prominently, if at all, in *The Concept of Mind* (1949) in connection with know-how. Michael Polanyi developed his distinct theory of "tacit knowing" later, most notably in *Personal Knowledge* (1958) and *The Tacit Dimension* (1966). Polanyi's concept is richer, involving subsidiary/focal awareness and the idea that "we know more than we can tell," often in contexts of perception and discovery, not just skill. Attributing Polanyi's specific term and concept to Ryle is a mistake. While both reacted against overly intellectualist views, their arguments and frameworks are different. Fusing them obscures both.

  6.  **"...and why he thinks a complete physical theory of swimming would tell you nothing about the skill."**
      *   **Acceptable (in spirit), but needs nuance.** Ryle would certainly argue that a purely physical/physiological description of muscle movements, buoyancy, etc., wouldn't capture the *intelligence* involved in coordinating those movements effectively *as swimming*. Knowing the physics doesn't give you the skill. His point is that the concept of "skill" or "intelligent performance" belongs to a different logical category than physical description or propositional knowledge *about* physics. It's about the *mode of execution*.

  7.  **"The view has since been shown too strong: Stanley and Williamson argue that knowing how just is a kind of knowing that..."**
      *   **Problematic Framing.** Saying Ryle's view was "shown too strong" implies it was empirically falsified or conclusively refuted. S&W (in their influential 2001 paper) offered a sophisticated *philosophical argument*, primarily based on the *linguistic semantics* of "knows how to" statements, to defend **Intellectualism** (the view Ryle attacked). They argued that "S knows how to F" is true iff S knows, *under a practical mode of presentation*, that w is a way for S to F (where w is a way of F-ing). This is a *reinterpretation*, not a knockdown refutation. It's highly contested within philosophy.

  8.  **"...knowing how to swim is knowing, of a way, that it's a way to swim..."**
      *   **Acceptable (as a statement of S&W's core claim).** This accurately summarizes the heart of their intellectualist reduction: know-how is a *species* of know-that (propositional knowledge about ways).

  9.  **"...so the distinction collapses and Ryle was basically wrong."**
      *   **Wrong / Oversimplification.** This is the biggest overreach. S&W **do not** claim the *distinction* collapses. They explicitly argue that there *is* a distinction, but it's a distinction *within* propositional knowledge – between knowing a proposition under a "practical" mode of presentation vs. other modes (like "theoretical"). They aim to *reduce* know-how *to* a kind of know-that, not to deny that we talk about skills differently than we talk about facts. Claiming Ryle was "basically wrong" ignores that:
          *   Ryle's core target was the *priority* of propositional contemplation for intelligent action, which S&W don't directly address (their focus is the *semantics* of "knows how" ascriptions).
          *   Many philosophers find S&W's account unconvincing precisely because it seems to leave out the *practical ability* itself. Knowing *that* w is a way to swim (even "practically") doesn't seem sufficient for *being able* to swim.
          *   Defenders of Ryle (or anti-intellectualists like Noë, Dreyfus, or later work by Hornsby) argue that S&W conflate *ascriptions* of know-how with the know-how *itself*. Knowing *how* to swim is the *ability*, not (just) knowing a proposition *about* a way. S&W's account, they argue, fails to capture the essential connection between know-how and successful *action*.

  **Payoff Questions:**

  1.  **Does "distinction collapses, Ryle wrong" follow?** **No.** S&W offer a *reductionist* account, claiming know-how *is* a type of know-that. They aim to *explain* the distinction within their intellectualist framework, not eliminate it. Whether their reduction succeeds is hotly debated. Ryle's core argument against the *necessity of prior propositional contemplation for intelligent action* remains standing as a challenge to *one form* of intellectualism, even if S&W provide a different intellectualist account of the semantics of know-how ascriptions.

  2.  **What would a Rylean defender say to S&W?** They'd likely say: "You've analyzed the *language* we use to *attribute* know-how, but you haven't captured the *ability* itself. Knowing *that* a way w is a way to swim, even if known 'practically,' is still a state of *knowledge*. It doesn't explain the physical capacity and skill required to *execute* w successfully. A paralyzed theoretical physicist might know (under any mode of presentation) infinitely many ways *that* are ways to swim, yet lack the know-how (ability) to swim. Your account confuses the map (the propositional description of the way) with the territory (the skilled performance)."

  3.  **What do S&W *actually* claim vs. the cartoon?** *Cartoon:* "Know-how is just know-that, distinction gone, Ryle refuted." *Reality:* "The truth conditions for 'S knows how to F' can be analyzed as S standing in the knowledge relation to a certain proposition (that w is a way for S to F) under a practical mode of presentation. Therefore, know-how is a species of know-that. This challenges Ryle's *categorical* distinction and supports intellectualism."

  **Your Concrete Case (The Bike Rider):**

  *   **The Case:** Imagine someone, let's call them Alex. Alex can flawlessly ride a complex mountain bike trail – navigating roots, rocks, drops, tight turns – smoothly and without falling. However, when asked *how* they do it, Alex is utterly inarticulate. They stammer, say things like "I dunno, I just... *do* it," "I feel the bike," or offer maximally unhelpful platitudes like "keep pedaling." They cannot describe the subtle weight shifts, brake modulations, or line choices they demonstrably execute perfectly. They possess the *know-how* brilliantly, but lack the corresponding articulate *know-that* about how they do it.
  *   **What it *Does* Show / The Pressure it Applies:**
      *   It strongly pressures the idea that know-how *simply is* or *necessarily requires* knowing a set of propositions (even "practically" presented) about ways to perform the action. If know-how just *was* knowing propositions about ways, we'd expect Alex to be able to articulate *something* substantive about the ways they use. Their complete inarticulacy suggests a disconnect.
      *   It highlights the *ability* aspect central to Ryle's conception. Alex's competence is manifest in their *performance*, not in their capacity to state facts.
      *   It challenges S&W's reduction. If Alex's know-how *is* propositional knowledge (under a practical mode), why can't they access or express *any* of those propositions, despite clearly possessing the ability? What *is* this "practical mode of presentation" if it renders the propositional content completely inarticulable even upon reflection?
  *   **What it *Doesn't* Show:**
      *   It doesn't *prove* know-how is *never* accompanied by, or reducible to, propositional knowledge. Maybe Alex *does* have unconscious propositional knowledge, or maybe they *could* learn to articulate it with training. (An S&W defender might argue this).
      *   It doesn't show that propositional knowledge is *irrelevant* to learning or refining know-how. Alex might have learned *from* instructions initially.
      *   It doesn't refute S&W's *linguistic* claim about the *truth conditions* of "Alex knows how to ride the trail." S&W could insist that Alex *does* know the relevant proposition practically, *even if* they can't articulate it.

  **Why the Case Works for Your Group Discussion:** It's intuitive, concrete, and focuses directly on the gap between demonstrable ability and propositional articulation. It forces the question: *Is Alex's undeniable skill really just a matter of him knowing some hidden propositions?* If so, what *are* they, and why can't he say *anything*? If not, then know-how seems to involve something more, or different, than propositional knowledge. It puts the burden on the intellectualist to explain *what* proposition Alex knows and *why* it's so inaccessible, despite his manifest ability.

  Remember, this debate is alive and well. That textbook presented a caricature. The real discussion is far more nuanced and interesting. You were right to be suspicious! Bring this case and the clarifications to your group – it should spark a much better discussion. Good luck!
