answer: |-
  ## Essay Question

  **Time Allowance:** 75 minutes  
  **Expected Length:** Approximately 1,200 words  

  **Question:**  
  You are consulting for a disaster response agency revising its triage protocols. The agency faces two distinct rescue scenarios and seeks a single, consistent ethical principle to guide its choices. Evaluate the following cases:  

  1.  **The Flooded Mine:** A flood traps workers in two chambers. Rescuers can open only one. The left chamber contains five workers, each expected to live approximately four more years if saved. The right chamber contains one worker expected to live approximately forty more years if saved. No relationships or dependencies exist between chambers; saving both is impossible.  
  2.  **The Long Odds:** Rescuers can either open a stable chamber known to contain one worker, or attempt to open an unstable chamber containing five workers. The attempt has a 30% chance of saving all five and a 70% chance of causing a collapse that kills all five.  

  What fundamental ethical principle should govern the choice in *both* scenarios? Defend your chosen principle by demonstrating how it yields a clear recommendation for each case. Explain what your principle implies about the ethical significance of the *number* of lives involved. Critically engage with the most compelling objection to your position and explain your response.  

  ---

  ## Model Answer (Approx. 650 words)

  The fundamental ethical principle governing rescue choices in both scenarios should be the maximization of expected total welfare, understood as the sum of individual well-being. This principle focuses on the total good achieved, not merely the number of persons saved. It requires comparing the aggregate expected welfare gains of the available options.

  In **The Flooded Mine**, applying this principle requires quantifying the welfare at stake. While saving a life is intrinsically valuable, the *amount* of welfare gained differs significantly. Saving the single worker in the right chamber yields approximately 40 years of life. Saving the five workers in the left chamber yields approximately 20 years of life in total (5 workers * 4 years each). Therefore, maximizing total welfare dictates saving the single worker, as this option secures twice the total life-years. This conclusion challenges the simplistic aggregative view that saving the greater *number* is always preferable. Here, the sheer number (five vs. one) is misleading; the aggregate welfare metric reveals that significantly more future life, and thus potential well-being, is preserved by saving the one. The principle forces us to consider not just *that* a life is saved, but *how much* life and its associated flourishing is preserved.

  **The Long Odds** case explicitly introduces uncertainty, demanding the calculation of *expected* welfare. Saving the single worker in the stable chamber guarantees 1 life saved. Attempting the unstable chamber offers a 30% chance of saving 5 lives and a 70% chance of saving 0 lives. The *expected number of lives saved* is (0.3 * 5) + (0.7 * 0) = 1.5 lives. However, welfare maximization requires considering the expected total *welfare* gained. Assuming each life saved represents an equal quantum of welfare value (W), saving the one worker guarantees 1W. The unstable chamber attempt yields an expected welfare of (0.3 * 5W) + (0.7 * 0W) = 1.5W. Therefore, maximizing *expected total welfare* dictates attempting the unstable chamber, as it offers a higher expected welfare outcome (1.5W vs. 1W). This case demonstrates that the principle applies at the moment of choice, evaluating actions based on their probable outcomes, not guaranteeing a specific result. It shows that aggregating welfare can sometimes favour a riskier option with a lower *certain* number saved but a higher *expected* total welfare.

  The core of this principle is that it sums *welfare*, not persons. In Flooded Mine, person-counting (5 > 1) pulls towards saving the five, while welfare-summing (40 > 20) pulls towards saving the one. In Long Odds, person-counting applied naively to the choice might see only "save 1 for sure" vs. "probably save 0, maybe save 5", leaning towards certainty. Welfare-summing, calculating expected value, favours the riskier option. The principle resolves both cases by prioritizing the greatest aggregate expected well-being, rejecting the idea that each person's claim generates an equal, non-fungible moral reason that cannot be outweighed by benefits to others, regardless of magnitude.

  The most compelling objection is that this principle fails to respect the separateness of persons. It treats individuals merely as containers of welfare, allowing the lesser welfare of many to be sacrificed for the greater welfare of one (as in the Flooded Mine), or risking complete loss for some for a chance at greater aggregate gain (as in Long Odds). This seems to instrumentalize human lives, violating the moral equality of persons by implying one person's greater potential welfare can outweigh the distinct claims of multiple others to survival.

  My response is twofold. First, while respecting persons is paramount, respecting them requires attention to the *content* of their lives – their potential for future well-being. Ignoring the magnitude of welfare gained or lost fails to fully respect what is valuable *to* each person. Second, in contexts of forced choice under scarcity where saving all is impossible, *not* aggregating welfare leads to even more counterintuitive results. In Flooded Mine, saving the five condemns the single worker to death while collectively securing only half the total future life available. In Long Odds, choosing the guaranteed one life over the risky five accepts a lower expected welfare outcome. The welfare-maximizing principle, while demanding difficult trade-offs, ultimately aims to secure the greatest total good possible under tragic constraints, which is a form of equal concern for all affected. It does not deny the moral significance of each individual but recognizes that when we cannot save all, maximizing the preservation of valuable life is the most defensible goal.

  ---

  ## Marking Scheme (Total: 30 Marks)

  1.  **Clear Statement & Defense of Single Principle (6 marks)**  
      *Error:* Proposing different principles for each case or failing to articulate a consistent principle applicable to both. (e.g., "Save the five in Mine, save the one in Long Odds" without unifying rationale).
  2.  **Flooded Mine Analysis (Welfare vs. Persons) (5 marks)**  
      *Error:* Treating the choice solely based on headcount (5>1) without addressing the life-year disparity, OR addressing life-years without explicitly contrasting this with person-counting as distinct interpretations of aggregation.
  3.  **Long Odds Analysis (Expected Welfare) (5 marks)**  
      *Error:* Treating the choice solely based on the certain outcome (saving 1) vs. possible outcomes (saving 5 or 0) without calculating/comparing *expected* welfare or lives saved.
  4.  **Explicit Distinction: Summing Welfare vs. Counting Persons (4 marks)**  
      *Error:* Failing to explicitly state that the aggregative claim must be interpreted as summing welfare (or a related metric like life-years) rather than counting persons to resolve Flooded Mine, OR conflating the two interpretations. (Mentioning the tension isn't enough; must take a stand on what aggregation *means*).
  5.  **Principle Applied Consistently to Uncertainty (Long Odds) (4 marks)**  
      *Error:* Arguing the principle applies only to certain outcomes, or failing to demonstrate how the same welfare metric (e.g., life-years saved) is used in the expected value calculation for Long Odds as in the certain calculation for Flooded Mine.
  6.  **Identification and Engagement with Strongest Objection (4 marks)**  
      *Error:* Raising a weak or irrelevant objection (e.g., "it's too hard to calculate"), OR stating an objection (e.g., separateness of persons) without genuinely attempting a substantive response addressing the core moral concern (instrumentalization/sacrifice).
  7.  **Effective Response to Objection (2 marks)**  
      *Error:* Offering a response that is superficial, dismissive, or fails to directly counter the specific moral worry raised by the objection (e.g., merely restating the principle without engaging the critique).

  **Distinguishing a First-Class Answer:**  
  A first-class answer (typically scoring 24+) will not only hit the must-hit points but also demonstrate meta-awareness of *what the cases reveal* about the fundamental structure of aggregation ethics. It will explicitly articulate how Flooded Mine exposes the insufficiency of simple person-counting and necessitates a welfare metric, and how Long Odds tests whether aggregation applies prospectively (to choices/expectations) or retrospectively (to outcomes). It will likely frame the objection and response in terms of a deeper tension between maximizing aggregate good and respecting individual inviolability, showing insight into why this dispute persists. It avoids mechanical application and shows philosophical insight into the implications of adopting the principle.
