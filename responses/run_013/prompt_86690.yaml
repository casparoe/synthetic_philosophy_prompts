  Your experience with iterated weak dominance is spot on and highlights a fundamental issue in game theory, not a bug in your code or reasoning. Let me unpack this without jargon.

  The core problem is that weak dominance is order-dependent because it relies on ties—strategies that are equally good against some opponent plays. When you delete one weakly dominated strategy, it can break the tie that made another strategy appear dominated, altering the outcome. In your game, deleting M first removes the scenario where T and M are tied against L and C, allowing R to be pruned. But deleting R first leaves the T-M tie intact, so M survives. This isn't a flaw in implementation; it's inherent to how weak dominance interacts with ties.

  Now, to your diagnosis: this isn't just a verbal dispute, though terminology can muddy things. Two perspectives exist, answering different questions:

  1. **Epistemic rationality**: If players have beliefs that resolve ties (e.g., "I think my opponent won't play R, so M is safe"), weak dominance is context-dependent. Your first deletion order (pruning M) assumes players believe R is possible, making M risky. The second order assumes players rule out R, preserving M. This view treats weak dominance as belief-sensitive—it's about avoiding regret given specific beliefs. Nash equilibria can be lost here because they rely on consistent beliefs not captured by the deletion order.

  2. **Robust rationality**: Some argue players should avoid strategies that could be exploited under *any* belief. Here, M is weakly dominated regardless of beliefs because it can never outperform T and sometimes underperforms (against R). This view demands a stronger criterion: a strategy must be defensible even if ties break against it. Under this lens, M should always be pruned, and your first order is "correct." But this clashes with Nash, as (M,L) is an equilibrium where M isn't exploited.

  The tension arises because weak dominance sits between these. Your econ friend is right: this ties into deep debates (like centipede game dilemmas) about whether rationality requires robustness or allows belief-dependency. The "fix" isn't obvious because the criteria conflict.

  Is this a fake problem? Not exactly. Iterated weak dominance *is* ill-defined as a unique solution concept—the order dependence is a feature, not a bug, showing its sensitivity to reasoning paths. But it's not useless; different orders reflect valid assumptions. The real issue is that you need a method that reliably preserves equilibria for your agent.

  **What counts as progress?**  
  A practical shift in framing: stop asking "which order is correct" and ask "what do I need for my agent?" You care about finding equilibria, not ideology. Here’s the move:  

  - **Theorem-driven insight**: Nash equilibria always survive iterated deletion of *never-best-response* strategies (rationalizability), which is order-independent. In your game, R is never a best response and gets pruned first. Then M is a best response to L (they’re tied with T), L is a best response to M, and both survive. This set {(T,L), (T,C), (M,L), (M,C)} contains both Nash equilibria and requires no belief assumptions.  
  - **Why it helps**: Rationalizability prunes strictly dominated strategies first (like R, which loses to C when row plays T), then prunes only strategies with *no* rational counter-belief. It’s computed by iteratively removing strategies that aren’t best responses to any opponent play (pure or mixed), and crucially, it’s order-independent. For two-player games, checking against pure opponent strategies suffices (a strategy survives if it’s a best response to at least one pure opponent move).  

  **What to ship**:  
  Switch to iterated never-best-response deletion (rationalizability). It:  
  1. Is order-independent and unique.  
  2. Preserves all Nash equilibria (pure and mixed support).  
  3. Prunes more than strict dominance (e.g., your R is pruned).  
  4. Is computationally similar to weak dominance checks—for each strategy, test if any opponent pure strategy makes it a best response.  

  Your framing isn’t off—it’s refreshingly pragmatic. This debate won’t resolve because it hinges on irreconcilable intuitions about rationality. But for your goal, sidestep the fight: rationalizability gives a well-defined, equilibrium-safe pruning method. Implement that, and let the philosophers bicker.
