  I'm building an adversarial-collaboration doc between two camps in AI alignment that have been talking past each other for years: the crowd that says alignment work should target worst-case guarantees -- bounds on the bad outcomes that hold no matter how unlucky the input or the deployment -- and the crowd that says thats the wrong frame and we should be doing expected-value / average-case analysis, because a guarantee that ignores probabilities just turns you into a paralyzed maximin-er or a Pascal's mug. Write the joint statement both sides could actually sign.

  I want the claims they agree on (what alignment is for, what a guarantee even buys you, when we're entitled to trust a probability estimate), then each camp's position written in wording its own side would accept, then the cruxes -- my guess is one is whether you're allowed to condition on a probability distribution you can't justify, and another is whether a real worst-case bound is even achievable for systems we can't fully specify -- and for each crux the argument or scenario both sides agree bears on it, with each side's prediction written down in advance. Format: a numbered agreed-claims section, then a disagreements table. If you think part of the fight is just verbal (what "guarantee" or "worst case" is being used to mean), say which part and why.
reasoning: |-
  We are drafting a joint statement between two camps in AI alignment:
  1. Camp A (Worst-case guarantees): Believes alignment should focus on guarantees that hold in the worst-case scenarios, regardless of probability.
  2. Camp B (Expected-value analysis): Believes alignment should focus on expected value (average-case) because worst-case can lead to paralysis or vulnerability to Pascal's mugging.

  We want:
  - Agreed claims (what alignment is for, what a guarantee buys, when we trust probability estimates)
  - Each camp's position in their own acceptable wording
  - Cruxes (key points of disagreement) with scenarios and each camp's prediction

  Part of the fight might be verbal: definitions of "guarantee" and "worst-case".

  Structure:
  I. Agreed Claims (numbered)
  II. Disagreements (table format: Crux, Scenario, Camp A Prediction, Camp B Prediction)

  Let's start by listing agreed claims:

  Agreed Claims:
  1. The goal of alignment is to ensure that AI systems robustly pursue human interests and values, avoiding catastrophic outcomes.
  2. Both worst-case and average-case analyses are theoretical tools that can inform alignment strategies, but they have different strengths and weaknesses.
  3. A "guarantee" in the context of alignment is a formal or informal assurance that a certain property holds under specified conditions. However, the nature and scope of such guarantees may vary.
  4. We are entitled to trust a probability estimate when it is based on well-validated models and sufficient evidence, and when the estimate is robust to reasonable uncertainties. However, the criteria for "well-validated" and "sufficient evidence" are context-dependent and sometimes contested.
  5. In the absence of a known probability distribution, worst-case reasoning becomes more compelling, but if a reliable probability distribution is available, expected-value analysis is more efficient.
  6. Both camps agree that ignoring probabilities entirely can lead to absurd conclusions (Pascal's mugging), and ignoring worst-case scenarios can lead to catastrophic risks. The challenge is balancing these concerns.
  7. Neither camp claims that their approach is universally superior; they are tools suited to different contexts.

  Now, each camp's position:

  Camp A (Worst-case guarantees):
  "We believe that alignment research must prioritize the development of methods that provide guarantees against catastrophic outcomes even in the worst-case scenarios. This is because the potential harm from a misaligned AI system is so great that we cannot rely on probabilistic assurances alone. We seek to bound the downside risk regardless of the input or deployment conditions, as we cannot confidently assign probabilities to all possible failure modes. Our aim is to build systems that are robust to adversarial inputs and unforeseen circumstances, thereby providing a necessary foundation for safe deployment."

  Camp B (Expected-value analysis):
  "We believe that alignment research should focus on maximizing the expected value of outcomes, as this accounts for both the probabilities and impacts of different scenarios. Overemphasizing worst-case guarantees can lead to excessive conservatism, making systems brittle or infeasible in practice, and can leave us vulnerable to low-probability, high-impact threats that are not covered by the guarantee. By using well-calibrated probabilistic models, we can make more efficient decisions and avoid being paralyzed by highly improbable risks."

  Now, the cruxes. We'll list them in a table.

  Cruxes (key disagreements):

  Crux 1: **The Feasibility of Worst-Case Guarantees**
     - Question: Is it possible to achieve meaningful worst-case guarantees for AI systems that are complex and cannot be fully specified?
     - Scenario: Consider training an AI system with a novel architecture that is too complex for formal verification. The system must operate in an open-world environment with inputs that are adversarial and potentially out-of-distribution.
       - Camp A Prediction: Even without full formal verification, we can design systems with inherent safety properties (e.g., via constrained optimization, adversarial training, or architectural choices) that provide worst-case guarantees for critical failure modes, such as avoiding actions that lead to irreversible harm.
       - Camp B Prediction: In such complex systems, we cannot achieve a true worst-case guarantee without severely limiting capabilities. Instead, we will rely on probabilistic methods to handle the uncertainty, and the attempt to achieve worst-case guarantees will either fail or impose unacceptable performance costs.

  Crux 2: **The Validity of Probability Assignments in Extreme Risks**
     - Question: Are we ever justified in assigning low probabilities to catastrophic events when we have limited knowledge, or must we treat such events as having unknown probability and thus default to worst-case?
     - Scenario: An AI system is deployed in a critical infrastructure setting. We have a model that assigns a very low probability (e.g., 1e-9) to a catastrophic failure mode. However, the model's calibration is uncertain in the tail of the distribution.
       - Camp A Prediction: Without a strong justification for the probability model in the tail (including robustness to adversarial inputs and distribution shifts), we must treat the catastrophic event as a possibility that must be bounded by design, regardless of the assigned probability. Otherwise, we risk an unacceptably high absolute risk (even if the probability is low, the impact is too high to ignore without strong evidence).
       - Camp B Prediction: If the probability model is well-validated and the estimated probability of catastrophic failure is extremely low (and the expected benefit is high), we should accept the risk as we do in other high-stakes engineering domains. Rejecting such a model without evidence of higher risk would be irrational and lead to inaction or over-engineering.

  Crux 3: **The Practical Consequences of Maximin vs. Expected Value**
     - Question: Does worst-case reasoning (maximin) lead to better practical outcomes than expected-value reasoning in the context of AI alignment?
     - Scenario: We have two alignment strategies. Strategy X: Focuses on worst-case guarantees and achieves a system that never causes a catastrophic failure (with high confidence) but at the cost of reduced average performance (e.g., slower response time, less helpful). Strategy Y: Focuses on expected value and achieves high average performance but with a very small probability of catastrophic failure (e.g., 1 in a billion per decision).
       - Camp A Prediction: Strategy X is preferable because catastrophic failures are unacceptable. The reduced performance is a necessary cost for safety. Over time, we can improve performance without compromising safety.
       - Camp B Prediction: Strategy Y is preferable because the expected harm from the catastrophic failure is extremely low (probability times impact) and the overall benefit is much higher. Choosing Strategy X would lead to systems that are not adopted or are outcompeted by less safe systems, ultimately increasing risk.

  We note that part of the disagreement is verbal:
  - Camp A uses "guarantee" to mean a bound that holds in the worst-case, even if it is probabilistic (e.g., with high confidence over the training distribution) but they aim for guarantees that cover the tail. However, Camp B points out that without absolute certainty (which is impossible), all guarantees are probabilistic at some level. Camp A responds that they are seeking to minimize the reliance on probabilistic arguments for the most critical failures.
  - Camp B uses "expected value" but acknowledges that they also care about risk (e.g., variance, tail risks) and may use tools like robust optimization that consider a range of scenarios. However, they argue that expected value is the correct criterion for decision-making under uncertainty.

  Thus, we can summarize the joint statement as follows:

  ---

  **Joint Statement on AI Alignment Approaches**

  **I. Agreed Claims**

  1. The primary goal of AI alignment is to ensure that AI systems robustly pursue human interests and values, avoiding catastrophic and irreversible harm.
  2. Both worst-case and expected-value analyses are legitimate and complementary tools for alignment research, and each may be appropriate in different contexts.
  3. A "guarantee" in alignment is an assurance, formal or empirical, that a system satisfies a safety property under specified conditions. The strength and scope of such guarantees vary, and they are subject to limitations (e.g., assumptions, coverage).
  4. Probability estimates can be trusted when they are based on validated models and sufficient evidence, but validation must account for uncertainties, including distributional shifts and adversarial inputs. The burden of proof for trusting a probability estimate in high-stakes scenarios is high.
  5. In situations of deep uncertainty (where probabilities are unknown or unknowable), worst-case reasoning becomes more appropriate. Conversely, when reliable probability distributions are available, expected-value analysis is more efficient.
  6. Both approaches acknowledge that an exclusive focus on worst-case scenarios without considering probabilities can lead to irrational decisions (e.g., Pascal's mugging), while an exclusive focus on expected value without considering worst-case scenarios can lead to catastrophic risks.
  7. Neither approach is considered a panacea, and both camps recognize the need for empirical and theoretical progress in both directions.

  **II. Disagreements**

  The following table outlines key cruxes of the disagreement, along with illustrative scenarios and each camp's predictions.

  | Crux | Scenario | Camp A (Worst-case) Prediction | Camp B (Expected-value) Prediction |
  |------|----------|--------------------------------|-----------------------------------|
  | **Crux 1: Feasibility of Worst-Case Guarantees**<br>Is it possible to achieve meaningful worst-case guarantees for complex AI systems without compromising capabilities? | Training a complex AI system (e.g., large neural network) for a critical application with adversarial inputs and open-ended deployment. | We can design systems with inherent safety properties (e.g., via constraints, adversarial training, or formal methods) that provide worst-case guarantees for critical failures, without making the system unusable. | True worst-case guarantees are infeasible for complex systems without significant performance costs. Attempts to achieve them will either fail or result in systems that are not competitive. |
  | **Crux 2: Validity of Probability Assignments in Extreme Risks**<br>Can we assign low probabilities to catastrophic events with sufficient confidence to justify ignoring them in worst-case planning? | Deployment in critical infrastructure: a model assigns a very low probability (1e-9) to catastrophic failure, but tail calibration is uncertain. | Without strong evidence for the probability model in the tail, we must design to avoid the catastrophic event regardless of the assigned probability. Otherwise, we risk an unacceptably high absolute risk. | If the model is well-validated and the probability is low, the expected harm is negligible. Rejecting the model without evidence of higher risk would lead to wasted resources and inaction on beneficial systems. |
  | **Crux 3: Practical Consequences of Maximin vs. Expected Value**<br>Which approach leads to better outcomes in practice? | Choosing between two alignment strategies: Strategy X (never catastrophic, but lower average performance) vs. Strategy Y (high performance with 1-in-a-billion chance of catastrophe per decision). | Strategy X is preferable because catastrophic failures are unacceptable. The average performance cost is worth it, and we can improve performance while maintaining safety. | Strategy Y is preferable because the expected harm is low and the benefits are high. Strategy X may lead to non-adoption or being outcompeted by less safe systems, increasing overall risk. |

  **Verbal Disagreement Note:** 
  - Camp A defines "worst-case guarantee" as an assurance that a system will not fail catastrophically under any input, including adversarial ones, or at least that the probability of catastrophic failure is bounded by a very small number (e.g., via robust optimization). Camp B argues that without absolute certainty (which is unattainable), all guarantees are probabilistic and that Camp A's approach often relies on probabilistic arguments (e.g., statistical guarantees from adversarial training). Camp A concedes that absolute certainty is unattainable but seeks to minimize the role of probability in the most critical failures.

  This joint statement reflects the current state of the debate and sets the stage for empirical and theoretical work to resolve the cruxes.
answer: |-
  ### Joint Statement on AI Alignment Approaches  
  **Signed by Representatives of Both Camps**  

  #### I. Agreed Claims  
  We, the undersigned, agree on the following foundational principles:  
  1. **Purpose of Alignment**: The goal of AI alignment is to ensure AI systems robustly advance human values and welfare, minimizing the risk of catastrophic outcomes (e.g., human extinction, irreversible disempowerment).  
  2. **Value of Guarantees**: Formal guarantees (e.g., bounds on behavior) are useful tools for increasing confidence in system safety. However, guarantees are always conditional on assumptions (e.g., model specifications, threat models), and no guarantee is absolute in real-world deployment.  
  3. **Role of Uncertainty**: Both worst-case and expected-value analyses are responses to uncertainty. Expected-value analysis quantifies risk probabilistically, while worst-case analysis hedges against unknown or unquantifiable risks.  
  4. **Entitlement to Probabilities**: Probability estimates are trustworthy only when:  
     - They are derived from well-calibrated models validated under distributional shifts.  
     - They avoid tail-risk complacency (i.e., dismissing low-probability events without rigorous justification).  
     - They acknowledge epistemic limitations (e.g., "unknown unknowns" cannot be reliably quantified).  
  5. **Complementarity**: Both approaches can inform each other. Worst-case reasoning identifies critical failure modes; expected-value reasoning prioritizes interventions by balancing likelihood and impact.  
  6. **Pitfalls of Extremes**:  
     - *For worst-case*: Ignoring probabilities can lead to unacceptable trade-offs (e.g., rejecting beneficial systems due to "Pascal’s mugging" scenarios).  
     - *For expected-value*: Over-reliance on imperfect probabilities can blind us to tail risks (e.g., assuming "black swan" events are implausible without evidence).  
  7. **Achievability**: Perfect worst-case guarantees are impossible for open-ended problems (e.g., AGI in unstructured environments). Similarly, perfect expected-value estimates are unattainable due to incomplete knowledge.  

  #### II. Disagreements  
  We diverge on the *primary framework* for alignment research. Below, we articulate each camp’s position, then outline cruxes with testable predictions.  

  | Camp | Position (in camp-approved wording) |  
  |------|--------------------------------------|  
  | **Worst-Case Camp** | "Alignment must prioritize *robust* guarantees against catastrophic outcomes, even in adversarially optimized scenarios. Expected-value approaches are insufficient for existential risks because: (1) Probability estimates for tail events are inherently unreliable; (2) Unbounded worst-case outcomes are unacceptable regardless of likelihood; (3) Maximin strategies (securing the least-bad outcome) are necessary when stakes are infinite. We seek guarantees that hold *conditional on deployment*, without assuming benign inputs or environments." |  
  | **Expected-Value Camp** | "Alignment should optimize for *expected welfare* using probabilistic risk models. Worst-case framing is counterproductive because: (1) It conflates ‘possible’ with ‘plausible,’ leading to paralysis or misallocated resources; (2) It ignores the opportunity cost of avoiding low-probability risks; (3) Real-world decisions require trading off risks against benefits. We focus on quantifiable evidence, avoid treating unquantifiable uncertainties as infinite liabilities, and reject maximin unless probabilities are truly unknowable." |  

  #### III. Cruxes  
  Key disagreements center on epistemology and feasibility. Below, each crux includes a shared scenario and advance predictions from both camps.  

  | Crux | Scenario | Worst-Case Camp Prediction | Expected-Value Camp Prediction |  
  |------|----------|----------------------------|--------------------------------|  
  | **Crux 1: Can we trust probability estimates for tail risks?**<br>*Disagreement*: Worst-case camp argues probabilities for catastrophic outcomes are inherently unvalidatable; expected-value camp argues they can be credible with empirical calibration.<br><br>**Scenario**: Train an AI system to avoid harmful outputs. Use a validation suite with 10^9 adversarial examples. The system fails 0 times in testing. A model estimates failure probability ≤10⁻¹² under deployment. *Can we trust this estimate?* | • **Worst-Case Prediction**: No. Adversarial examples are non-i.i.d., and deployment inputs may be optimized to evade detection. Without proof of exhaustive adversarial coverage, the estimate is untrustworthy. We predict at least one failure occurs within 10^7 real-world queries.<br>• **Justification**: Testing cannot cover all permutations of inputs/goals. | • **Expected-Value Prediction**: Yes, if the validation suite covers a diverse threat model and the model is well-calibrated on tail events. We predict ≤1 failure in 10^12 queries with 95% confidence.<br>• **Justification**: Statistical bounds (e.g., PAC learning) apply when validation is adversarial and scalable. |  
  | **Crux 2: Is a meaningful worst-case bound achievable?**<br>*Disagreement*: Worst-case camp believes it is feasible (e.g., via formal verification); expected-value camp believes it is impractical or illusory for AGI.<br><br>**Scenario**: Build an AI agent with a formal guarantee: "Never takes actions causing human extinction." The agent must operate in novel environments with open-ended inputs. | • **Worst-Case Prediction**: Achievable. We can construct enforceable constraints (e.g., hard-coded shutdown, impact limits) that hold even with goal misgeneralization. We predict a system meeting this guarantee is deployable within 10 years.<br>• **Justification**: Systems like aircraft collision-avoidance use formal methods for life-critical guarantees. | • **Expected-Value Prediction**: Not achievable. Any guarantee requires assumptions (e.g., "no novel zero-days"), which adversaries will exploit. We predict all attempted guarantees will have unanticipated failure modes in deployment.<br>• **Justification**: Complex systems exhibit emergent behaviors; specifications for AGI will be incomplete. |  
  | **Crux 3: Does worst-case focus improve real-world outcomes?**<br>*Disagreement*: Worst-case camp argues it prevents catastrophes; expected-value camp argues it causes harm via overconservatism.<br><br>**Scenario**: A pandemic response AI can save 1M lives but has a 10⁻⁶ chance of causing a catastrophic bio-error if hacked. *Should we deploy it?* | • **Worst-Case Prediction**: No deployment without eliminating the catastrophic risk. We predict societies adopting this stance will experience fewer existential disasters (0 in 50 years).<br>• **Justification: Probabilities <10⁻⁹ for x-risks are unverifiable; the burden of proof is on avoiding downside. | • **Expected-Value Prediction**: Deploy if expected net lives saved is positive (e.g., 1M × 1 - 10⁻⁶ × 10⁹ = +900K). We predict this yields better aggregate welfare; blocking deployment causes more deaths from pandemics.<br>• **Justification: Maximizing expected value balances risks pragmatically; refusing to quantify probabilities is decision evasion. |  

  ---  
  **Signed**,  
  *Representatives of the Worst-Case Camp*  
  *Representatives of the Expected-Value Camp*  

  ---  
  ### Notes on Verbal Disagreements  
  - **"Guarantee"**: The worst-case camp uses the term for *bounds that hold under adversarial conditions* (e.g., "never worse than X"). The expected-value camp interprets it as *probabilistic assurance* (e.g., "X with 99.9% confidence"). This causes friction when discussing "achievable" guarantees.  
  - **"Worst-Case"**: The worst-case camp emphasizes *unmitigated adversarial scenarios* (e.g., "malicious actors + deceptive AI"). The expected-value camp views this as often conflating "plausible worst-case" with "inconceivably pathological," leading to inflated perceived risk.  
  - **Resolution Path**: Both camps commit to testing predictions (e.g., via scaled experiments with adversarial testing) and refining models of tail risks. Agreed benchmarks (e.g., failure rates under optimized attacks) will be used to update positions.
