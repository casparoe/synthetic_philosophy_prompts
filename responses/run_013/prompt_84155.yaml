  Hmm, they're clearly thought this through - their examples target different aspects of conventions: coordination problems (queueing), economic transfers (tipping), and risk allocation (jaywalking). They've set up three distinct tests for my position. Smart framing.

  I need to maintain character consistency. The localist must: 1) Concede details without abandoning core thesis 2) Provide a clear test for when conventions bind visitors 3) Avoid "it's just rude" arguments 4) Distinguish between convention types as per their specifications.

  *Deep breath* Let's tackle each case systematically. For tipping - they're right it's not pure coordination, but it's still a local equilibrium. The moral weight comes from the service provider's reliance. For jaywalking - ah, this is about risk externalization! The convention exists to protect pedestrians collectively. The tourist waiting at 3am isn't violating that core purpose. 

  The unifying test emerges: conventions bind when they constitute a local solution to a recurring social problem that would cause tangible harm if violated. Not just inconvenience - actual harm. Queue-jumping causes distributive injustice, tipping undercuts livelihoods, unsafe jaywalking risks lives. 

  *Pauses* Did I address all concerns? Tipping - reframed as preventing harm to workers. Jaywalking - distinguished between formal rules and risk-management conventions. Queueing - maintained the coordination argument. And proposed a harm-based threshold test. 

  *Checks* Yes - different answers for different cases, but unified principle. The 3am tourist isn't causing harm by waiting, so no violation. Perfect. Character voice maintained: precise, concedes nuances ("admittedly"), but never wavers on core obligation thesis.
answer: |-
  *Adjusts glasses, leaning forward intently* Your skepticism reveals precisely why most dismiss conventions as mere etiquette – but you've actually framed the test perfectly: **a local convention binds the visitor when it constitutes the operational solution to a recurring coordination problem within that community, specifically where unilateral deviation materially harms the cooperative interests of others already relying on that solution.** Queueing is paradigmatic: jumping in disrupts the distributive fairness everyone depends on. Tipping? Admittedly distinct, yet still a coordination solution – not merely "making up a shortfall," but participating in a deeply embedded *local equilibrium* that stabilizes service-sector livelihoods *here*. The harm isn't just to the employer's scheme; it's to the server who budgeted assuming participation in this norm, and to the system itself which collapses if enough visitors defect. Your haircut analogy misfires: the *local convention* defines the obligation to the person providing the service directly to you, regardless of their employment structure – it's the relational harm to *them* that matters. 

  Jaywalking exposes the nuance. The sign's *formal rule* isn't the binding convention; the *local practice* is the *actual* risk-management coordination. At 3am with no traffic, waiting obediently at the red light doesn't harm anyone – the coordination problem (safe crossing) is absent. But in midday crowds, crossing against the local flow *does* create tangible risk and disruption – you're unilaterally imposing chaos on a system others are relying upon for safety. The obligation isn't to the sign or to abstract law, but to the practical, harm-minimizing coordination enacted by the locals *in that moment*. Your tourist waiting at 3am violates nothing material; the one blithely stepping into dense moving traffic against local practice, however, violates the core principle – they disregard the operational solution protecting collective welfare. The test gives different answers because the underlying coordination problems differ: distributive fairness, economic reliance, physical risk-management. "I didn't know" confesses you failed your duty to learn the local solutions protecting others before acting. Your turn.
