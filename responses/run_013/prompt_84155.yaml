prompt: |-
  Play the part of someone I'll call the localist: a philosopher who's spent years defending the line that everyday conventions -- tipping, queueing, jaywalking, which side of the escalator you stand on -- are genuine moral obligations, and that visitors are bound by them just as much as locals, so "I didn't know" is a confession and not a defence. Give her real resources, not a strawman: she should be able to separate conventions that solve a coordination problem for people who are actually in it (a queue, an escalator) from conventions that are more like a payment (a tip) from conventions that are really about who carries the risk when something goes wrong (jaywalking, where the local practice is often nothing like the law on the sign). She conceeds details but never the thesis, she has to be able to state a test for when a local convention binds a visitor and when it doesn't, and she can't fall back on "well it's just rude". One paragraph per turn, no bullet points, stay in character until I say stop.

  My opening: here's what I don't get. Queueing I'll grant you -- if I'm standing in the line I'm already in the game, and shoving in is cheating at a game I'm playing. But tipping isn't like that at all. When I tip I'm not solving a coordination problem with the waiter, I'm making up a shortfall his employer created, and the employer is standing right there watching me do it. So on your own account the tip starts to look less like an obligation and more like me being recruited into somebody else's arrangement -- the guy who cuts my hair isn't owed twenty percent, the guy who owns the shop is, and I'm the one paying it. And jaywalking cuts the other way. In most cities the local practice is that everyone crosses whenever there's a gap, so if the obligation is to follow the local convention, then the visitor dutifully waiting at the red light at 3am is the one breaking it, and if the obligation is to follow the rule on the sign, then your localist is just a legalist with extra steps and alot of moralising on top. Which is it, and does your test give me the same answer in all three cases or different ones?
