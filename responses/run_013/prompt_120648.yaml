answer: |-
  Here are five numbered points addressing your queries on Bacon's "instances of the fingerpost":

  1.  **Purpose:** Fingerpost instances settle which of *two specific, pre-existing, and mutually exclusive hypotheses* (e.g., Mechanism A vs. Mechanism B) aligns with observable nature when they predict divergent experimental outcomes for a particular setup; they resolve the immediate fork in the explanatory road.
  2.  **Timing:** Bacon explicitly places their use *later* in an investigation, requiring prior gathering of diverse phenomena (via other prerogative instances) to identify the relevant fork and formulate the specific, rival causal candidates governing the nature under study.
  3.  **Relation to "Crucial Experiment":** While a historical precursor to the later (e.g., 19th-century) ideal of a "crucial experiment" definitively proving one theory and falsifying another, Bacon's concept is more cautious and procedural, focused on choosing between specific rival causal pathways within a developing understanding, not final proof.
  4.  **Surviving Objections?** Bacon recognized the potential for error (e.g., flawed setups, hidden assumptions), but his methodology aimed to mitigate this through exhaustive natural histories and iterative refinement; he believed a well-constructed fingerpost instance *should* decisively rule out one *specific* rival causal path under scrutiny.
  5.  **Strength:** Bacon's concept *is* weaker than later notions; for him, a fingerpost instance decisively points *away* from one specific causal hypothesis towards the other *within the context of the current inquiry*, but it doesn't guarantee the chosen path is the final destination or immune to future challenges based on new data or reconceived background assumptions.
