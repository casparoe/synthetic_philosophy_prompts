answer: |-
  ### Bottom Line
  Your Keynesian probability framework—objective logical relations, non-numerical/non-comparable probabilities, weight as distinct, and "no probability" in uncertainty—faces sharp challenges from formal decision theory (Dutch Books, Savage) and empirical calibration, which suggest degrees of belief *must* be probabilistic and often measurable. Subjectivism absorbs weight as confidence and handles uncertainty with imprecise probabilities, rendering the logical relation ontologically shaky. The "no probability" claim risks unfalsifiability but isn't fatal to the core theory if restricted to genuine ambiguity.

  ### Defeaters Table
  | Defeater                  | What it's aimed at                          | Kind           | How decisive | Conceded by defenders? | Best reply on the other side                          |
  |---------------------------|--------------------------------------------|----------------|--------------|------------------------|-------------------------------------------------------|
  | Dutch Book Theorems       | Logical relation (non-numerical claim)     | Formal         | Serious      | Yes (weakened form)    | Applies only to betting contexts; weight excuses incoherence |
  | Savage's Axioms           | "No probability" claim; comparability      | Formal         | Serious      | No                     | Axioms assume "small worlds"; violate deep uncertainty |
  | Calibration Evidence      | "No probability" claim; non-numerical claim | Empirical      | Awkward      | Yes                    | Successes in constrained domains; fails in macro/politics |
  | Ellsberg Paradox          | Comparability; weight separation           | Empirical/Conceptual | Cosmetic     | No                     | *Supports* Keynes: proves non-probabilistic uncertainty |
  | Subjectivist Absorption   | Whole package (esp. logical relation)      | Conceptual     | Awkward      | Only in weakened form  | Subjectivism loses objectivity; weight ≠ confidence  |
  | Unfalsifiability Charge   | "No probability" claim                     | Conceptual     | Serious      | Yes (rhetoric)         | Restrict "no probability" to radical uncertainty cases |

  ### Insulation Against Falsification
  The "no probability" claim *is* vulnerable to unfalsifiability if applied promiscuously, but Keynesians (e.g., Runde) concede this and restrict it to **Knightian uncertainty** (unknowable parameters, nonergodic systems). The formal theory (logical relations) remains falsifiable in principle—e.g., if all probabilities were shown numerically derivable from evidence. The two halves cohere: the early theory defines probability-as-logic; the later "animal spirits" acknowledges its limits. Weight does the heavy lifting, grounding Keynes' distinction between risk and uncertainty.

  ### What Would Change Your Mind?
  1. **Empirical**: If structured models (e.g., climate scenarios, geopolitical risk engines) yielded well-calibrated numerical probabilities for "Keynesian uncertainty" domains (e.g., 2050 tech politics), defeating the "no probability" claim.  
  2. **Formal**: If a decision theory *without* objective probabilities (e.g., using weight directly) outperformed subjective models in ambiguity.  
  3. **Conceptual**: If "weight" was formalized as a Bayesian hyperparameter, reducing it to subjective confidence without logical relations.  

  Calibration successes in macro—especially for tail events—would be most damaging. Until then, your view holds, but subjectivism is the lurking takeover.
