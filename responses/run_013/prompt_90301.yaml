prompt: |-
  I'm the story editor for a small history podcast -- six of us, an episode every two weeks -- and we're planning a season on the big why questions. You know the ones: why did the industrial revolution start in Britain and not in China, why did the scientific revolution happen in Europe and not in the Islamic world, why did the Maya collapse and not the Aztecs. Our excecutive producer keeps killing my pitches with "you can't ask it that way," and she can never quite say why, so I want to stop arguing about vibes and build us an actual procedure.

  Here's the raw material I've got. A friend of mine who did a philosophy degree wrote me three pages of notes when I complained about this. Her main point is that a why-question never comes alone -- you're never just asking why P, you're asking why P rather than Q -- and the Q is doing most of the work, so that swapping it out gives you a different question with a different answer even though the P sits there unchanged. She says you can feel this by flipping a question around: why is there something rather than nothing sounds like the deepest question in the world, and why is there nothing rather than something sounds like a joke, and no fact has changed, only which outcome we're quietly treating as the default. She also thinks a lot of bad history comes from picking a foil that isn't a real alternative to anything, so you end up explaining why one country wasn't some other country, and that the units are usually rotten -- "China" across two thousand years, "Europe" across a dozen very different societies, as if each were one actor with one strategy. I suspect there's more in the notes that I'm not getting.

  Could you turn this into a screening procedure we can actually run on a pitch in the ten minutes before we decide whether to commission it? I want the questions asked in order, what counts as a sufficient answer at each step, which step is where a question dies, and which steps are judgment calls dressed up as tests. Tell me which of her points have to survive into the checklist and which ones can be dropped, and be honest about what the procedure can't do -- I'd rather it say this one needs an actual historian than fake a verdict. Then run it on three pitches: (1) why did the industrial revolution happen in Britain and not in China; (2) why did the scientific revolution happen in Europe and not in the Islamic world; (3) why did the potato famine devastate Ireland and not Scotland. That third one is my pet project, so if the procedure kills it, kill it. One more constraint: our host is not a historian and neither am I, so whatever you write has to be usable by someone who can't reliably tell a good answer from a plausible-sounding one.
reasoning: |-
  Okay, the user is a story editor for a small history podcast dealing with "big why" historical questions. Their executive producer keeps rejecting pitches without clear reasons, so they need a concrete screening procedure. They got notes from a philosophy friend emphasizing that "why P rather than Q" questions depend heavily on the implicit Q (foil) and that units like "China" or "Europe" are often too broad. 

  First, I need to unpack the philosophy notes. The friend's core argument is that every "why" question has a hidden comparison (Q), and that comparison defines what needs explaining. For example, "why Britain not China" assumes China is a valid counterfactual. Also, using monolithic terms like "China" across millennia is problematic—it ignores internal diversity and temporal changes. The user suspects they're missing some nuances, but the key points are the foil's role and unit granularity.

  The user wants a practical 10-minute checklist for pitches. It should: have clear steps with pass/fail criteria, flag where judgment is needed, kill unworkable questions early, and honestly admit when expert input is required. Importantly, it must be usable by non-historians—no academic jargon. They also want to test three pitches: Industrial Revolution (Britain/China), Scientific Revolution (Europe/Islamic world), and the Irish/Scottish potato famine (their pet project).

  Building the checklist: I'll structure it as a flowchart with three gates. Gate 1 tackles the foil—is Q a real alternative? If not, the question is invalid. Gate 2 checks unit granularity—are "Britain" or "China" defined specifically? Vague units fail. Gate 3 assesses answerability—can we list concrete factors without overgeneralizing? Any "no" kills the pitch. Crucially, I'll note where steps are judgment calls (e.g., "is this foil credible?") versus clear fails (e.g., "Q is a strawman"). 

  The philosophy points that must survive: the foil's necessity and unit specificity. What can drop? Deeper epistemological debates (e.g., causality models). The procedure can't replace historian expertise—it just screens for obvious flaws.

  Now testing the pitches: 
  - Pitch 1 (Industrial Revolution): Fails Gate 1 because "China" as a foil isn't one entity—it's multiple dynasties with different conditions. Also, "Europe" vs. "Islamic world" ignores diversity within both. 
  - Pitch 2 (Scientific Revolution): Same issues—"Europe" and "Islamic world" are too broad across time/space. 
  - Pitch 3 (Potato Famine): Surprisingly passes if refined! Ireland/Scotland are comparable units, and the foil (Scotland) had real differences like land ownership patterns. But it needs tightening—specify regions, avoid "Celtic fringe" stereotypes.

  For the user's pet project, I’ll emphasize it’s salvageable with tweaks. They’ll appreciate that honesty—and that the checklist isn’t just a kill tool. The key is making non-historians feel empowered to spot red flags (e.g., "Wait, is 'China' here meaning the Song Dynasty or all of Chinese history?").
answer: |-
  Here's a practical 10-minute screening procedure based on your philosopher friend's core insights, designed for non-historians. It filters out structurally flawed questions early and flags where expert input is essential.

  **The "Why P Rather Than Q?" Pitch Screener**

  **Core Principles Embedded:**
  1.  **The Foil (Q) is Crucial:** Every "why" question implies "why P *rather than Q?*" The validity of Q determines if the question makes sense.
  2.  **Granularity Matters:** Vague units ("China," "Europe," "Islamic World") across vast time/space are usually useless. Specify *what, where, and when* precisely.
  3.  **Defaults Shape the Question:** Implicitly treating P as "surprising" and Q as "expected" frames the answer. This framing must be justified.

  **The Procedure (Run in Order - ~10 mins per pitch):**

  1.  **Gate 1: Identify & Interrogate the Foil (Q)**
      *   **Question:** "What *specific outcome or entity* (Q) is P being contrasted with? Spell it out explicitly. What makes Q a plausible *alternative* to P happening?"
      *   **Sufficient Answer:** Q must be a **concrete, historically plausible alternative scenario** existing in roughly the same time/place context as P. It cannot be:
          *   A vague abstraction ("not anywhere else," "not chaos").
          *   A fundamentally different entity operating under incomparable rules ("not Mars," "not in the 20th century").
          *   A strawman (e.g., "Why Britain and not a completely stagnant, technologically backward place?").
      *   **Kill Zone:** If Q cannot be defined concretely, or if it's clearly implausible/strawman, the question is fundamentally flawed. **STOP.**
      *   **Judgment Call:** Assessing "plausibility." Is Q *reasonably conceivable* given the broader historical context? (If unsure, flag for historian).

  2.  **Gate 2: Define Granular Units & Timeframe**
      *   **Question:** "What *exactly* do 'P' and 'Q' refer to? (e.g., not 'China,' but 'Qing Dynasty China, specifically its coastal provinces and state policies, between 1700-1800'). What is the *specific timeframe* for comparison?"
      *   **Sufficient Answer:** Units must be **operationalized** - defined clearly enough that specific characteristics, conditions, or actors *within* them can be discussed. Timeframes must be **narrow and relevant** to the event/process.
      *   **Kill Zone:** If units are hopelessly vague/bloated ("Europe" over 500 years, "The Islamic World" as a monolith) or timeframes nonsensically broad, the question is unanswerable without gross oversimplification. **STOP.**
      *   **Judgment Call:** Defining sufficient granularity. Is the unit definition tight enough to allow meaningful comparison? (If P/Q are naturally broad concepts like "scientific revolution," focus tightly on *where/when* it manifested vs. didn't).

  3.  **Gate 3: Check Implicit Default & Answerability**
      *   **Question:** "What makes P *surprising* relative to Q? What implicit assumption makes us expect Q *more* than P? Can we list 3-5 *specific, comparable factors* (not just 'culture' or 'geography' vaguely) that likely differed between the P-unit and Q-unit during the defined timeframe and could explain the difference in outcome?"
      *   **Sufficient Answer:**
          *   A plausible reason why Q might seem the "default" outcome (e.g., "China had larger population/more advanced tech earlier, so why not them?" or "Ireland and Scotland both relied on potatoes, so why mass death only in Ireland?").
          *   A list of concrete, comparable factors (e.g., specific land tenure laws, state fiscal policies, trade network structures, disease environments, specific institutional responses, technological adoption rates in *specific sectors*).
      *   **Kill Zone:** If the only justification for surprise is presentism ("because we know P happened!") or prejudice, or if factors remain hopelessly vague/monolithic ("European ingenuity," "Islamic conservatism"). **STOP.**
      *   **Judgment Call:** Assessing the plausibility of the "surprise" and the concreteness of potential factors. Does this feel like it points towards specific historical research, or just hand-waving? (Flag if factors seem too simplistic).

  **What This Procedure CAN Do:**
  *   Identify structurally flawed questions (bad foil, rotten units).
  *   Force concrete definitions and plausible framing.
  *   Weed out questions reliant on essentialism, presentism, or vague civilizational stereotypes.
  *   Flag pitches needing significant refinement before research.
  *   Make rejection reasons explicit ("Your Q is implausible," "Units too vague").

  **What This Procedure CANNOT Do:**
  *   Guarantee a *good* or *correct* historical answer. That requires actual research.
  *   Assess the *quality* of evidence for potential factors (Step 3 just checks for *existence* of concrete factors).
  *   Resolve deep historiographical debates. It flags where they exist (judgment calls).
  *   Replace historian expertise for complex comparisons (it flags where it's needed).

  ---

  **Testing the Pitches:**

  **Pitch 1: Why did the industrial revolution start in Britain and not in China?**
  1.  **Gate 1 (Foil):** Q = "China" (specifically implied: Not undergoing its *own* industrial revolution in the late 18th/early 19th century). *Is Q plausible?* Potentially yes, given China's advanced pre-modern economy. **PASS (barely, judgment call - needs refining)**.
  2.  **Gate 2 (Units/Granularity):** P = "Britain" (c. 1760-1830). Q = "China" (Which China? Qing Dynasty? What *specific regions*? Over what *exact timeframe*? 1700-1830? This is **ROTTEN**. "China" is too vast and diverse; comparing a small island nation's specific transformation to an entire continental empire's lack of a similar transformation is fundamentally flawed. **FAIL. STOP.**.
      *   *Why it Dies:* Units are incomparable. You'd need to compare specific regions (e.g., Lancashire vs. Jiangnan) or specific mechanisms (e.g., state policy responses to technological innovation in both contexts).

  **Pitch 2: Why did the scientific revolution happen in Europe and not in the Islamic world?**
  1.  **Gate 1 (Foil):** Q = "The Islamic World" (specifically implied: Not developing the *specific constellation* of theories, methods, and institutions characterizing the European Scientific Revolution, c. 1500-1700). *Is Q plausible?* Problematic. The "Islamic World" wasn't monolithic; significant scientific work occurred in various places/times. Defining a single "Islamic World" outcome as "not having a scientific revolution" is shaky. The foil feels vague and potentially strawman-ish ("Why didn't *they* do *exactly what Europe did*?"). **Judgment Call: Leaning FAIL.** Needs major refinement (e.g., "Why did certain *institutional forms* critical to the *sustained, communal* aspect of the SR take root more firmly in parts of Europe than in the Ottoman heartland c. 1600-1700?").
  2.  **Gate 2 (Units/Granularity):** P = "Europe" (Which parts? Over what exact 200-year span? A dozen different societies!). Q = "The Islamic World" (Even worse - vast, diverse, spanning Morocco to Indonesia over centuries). **ROTTEN. FAIL. STOP.**.
      *   *Why it Dies:* Units are catastrophically vague and monolithic. "Europe" and "Islamic World" are not meaningful actors for this comparison over such a long period.

  **Pitch 3: Why did the potato famine devastate Ireland and not Scotland?**
  1.  **Gate 1 (Foil):** Q = "Scotland" (specifically implied: Not experiencing mass starvation and societal collapse due to *Phytophthora infestans* in the mid-1840s). *Is Q plausible?* **YES.** Both were parts of the UK, both relied on potatoes, both were hit by the blight. Scotland *is* a valid counterfactual – why similar cause, different outcome? **PASS.**
  2.  **Gate 2 (Units/Granularity):** P = "Ireland" (c. 1845-1852). Q = "Scotland" (c. 1845-1852). *Are they sufficiently defined?* **YES.** Both are clearly defined political/geographical entities within the same state, experiencing the same event in the same timeframe. **PASS.** (Note: Granularity *within* each country - e.g., Highlands vs. Lowlands - will be crucial for the answer, but the units for comparison are sound).
  3.  **Gate 3 (Default/Answerability):**
      *   *Surprise:* Implicit default is that similar cause (blight + potato dependence) *should* lead to similar outcome (devastation). The surprise is the *difference* in outcome. Plausible.
      *   *Concrete Factors:* Can readily list specific, comparable factors differing between Ireland and Scotland c. 1845-1852:
          *   Degree of potato dependence (especially among the poor).
          *   Land tenure systems & landlord obligations.
          *   Scale of pre-famine poverty/vulnerability.
          *   Structure of the local economy (diversification, alternative food sources).
          *   Local administration & implementation of relief policies.
          *   Pre-existing health/nutrition.
      *   **PASS.**
  4.  **VERDICT: COMMISSION (with refinement).** This is a structurally sound comparative question. The answer will involve analyzing concrete differences in socio-economic structure, policy implementation, and local conditions between Ireland and Scotland *during the specific famine years*. Avoid essentializing "Irish" or "Scottish" traits – focus on specific systems and actions.

  **Conclusion:** Your pet project survives! The procedure killed the first two pitches primarily due to **Rotten Units** (Gate 2), making meaningful comparison impossible. The Irish/Scotland pitch passes all gates by having a **plausible foil**, **comparable units/period**, and **concrete potential factors**. This provides a clear, non-vibes-based rationale for your EP to accept or reject pitches. Remember: Passing the screener means the question is *askable*, not that the answer will be simple or uncontested – that's where the historian comes in. Good luck!
