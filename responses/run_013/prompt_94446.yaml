  Here’s the corrected framework and your speech, structured for clarity and delivery:

  **Corrections:**  
  (1) Correct: Subsidiarity’s dual duties (restraint + assistance) are central. The "positive duty" *is* more emphasized in Catholic social teaching, but it’s not absent in American federalism (e.g., federal disaster aid).  
  (4) Refinement: The EU’s "efficiency trigger" is treaty-based but contested; the "dignity trigger" (rooted in human scale) is indeed distinct. Both coexist in discourse, causing friction.  
  (5) Vital: Fiscal equivalence (Oates’ Principle) is essential—mismatched authority/responsibility invites exploitation. Rural concerns are structurally valid.

  ---

  **Speech: The Two Halves of Subsidiarity**  
  (Approx. 1,950 words / 15 mins)

  Good evening. It’s an honor to be here celebrating a century of this association — a century of towns, large and small, wrestling together with what it means to govern well. And let’s be honest: this year, we’ve wrestled hard. We’ve all heard the arguments echo across committee rooms and Zoom screens about regional approaches, local control, and that weighty word: *subsidiarity*. It’s been wielded like a shield by both sides in this debate about service districts. Tonight, I don’t aim to settle that fight. My goal is simpler, and perhaps harder: to hand you back that word, “subsidiarity,” dusted off and reframed, so it becomes a tool for understanding rather than a cudgel for conflict. Because I believe we’ve been talking *past* each other, not because our principles are wrong, but because we’ve only been seeing half the picture.

  So, what *is* subsidiarity? Too often, we shrink it down to mean simply “things should be done locally.” But that’s incomplete. It’s like describing a coin by only looking at one side. Authentic subsidiarity is a principle of balance, holding *two* essential duties in tension.

  The first duty is the one we all know, the one that resonates deeply in the American soul, especially out here: **The Duty of Restraint.** This is the negative command. It says a larger, higher body – whether it’s a state agency, a county board, or yes, a proposed regional district – *must not* seize a task that a smaller, more local body can effectively handle on its own. It’s a bulwark against absorption, against the slow erosion of local voice and local knowledge. It demands that power respect proximity. When a small town council argues, “We know our roads, our people, our needs best – let *us* decide this,” they are invoking this fundamental duty of subsidiarity. And they are absolutely right to do so. This duty protects communities from being steamrolled, from having solutions imposed that don’t fit their unique reality. It’s the principle that guards against the tyranny of the bureaucratic or the distant.

  But here’s where we often stop. And that’s where the trouble starts. Because subsidiarity isn’t *only* about restraint. It carries a second, equally vital duty: **The Duty of Assistance.** This is the positive command. It says that the larger body *owes* a duty to the smaller one. When a challenge arises that genuinely exceeds the capacity of the local community to manage alone – truly exceeds it, not just inconveniences it – the larger body must step *in* to provide real support, real resources, real solutions. It’s not about taking over; it’s about lifting up. It recognizes that sometimes, the scale of the problem – be it a sprawling water crisis, a multi-jurisdictional transit network, or coordinating life-saving emergency response across town lines – demands a wider perspective and broader shoulders. When a larger town or a group of towns argues, “This problem crosses borders, it needs shared resources and shared solutions – we need a structure to manage it together,” they are invoking *this* fundamental duty of subsidiarity. And they, too, have a point. This duty protects communities from being abandoned, from drowning in challenges they simply cannot overcome in isolation.

  Think of it like this: The Duty of Restraint says, “Don’t do for others what they can do for themselves.” The Duty of Assistance says, “Do for others what they truly cannot do for themselves.” Both are essential. And yes, friends, they *collide*. They pull in opposite directions constantly. That tension isn’t a sign the principle is broken; it’s the sign that we’re actually *using* it, grappling with real-world complexity. Everyone in this room has felt that pull – the frustration of feeling dictated to from above, and the desperation of facing a problem too big to solve alone. That *is* the lived experience of subsidiarity.

  Now, let’s clear up a few common confusions. First, subsidiarity is **not** just another word for decentralization. Decentralization is about *where* power is physically located – pushing it down the map. Subsidiarity is about *who should legitimately decide* on a specific function. And crucially, it’s not just about big government vs. small government. It applies *within* levels too. Does the county need to handle that zoning decision, or could the town? Does the town council need to micromanage that park, or could the neighborhood association thrive with the responsibility? Subsidiarity asks: What’s the *smallest*, most immediate level where this can be handled *effectively and justly*? That question echoes up and down the entire ladder of governance.

  Which brings us to the hardest question: **Who decides who decides?** This is the rub. If the higher level – the state, the county, the proposed regional body – gets to unilaterally declare when it has the right to step in under subsidiarity, then the whole principle becomes a polite fiction, a suggestion easily ignored. The Duty of Assistance swallows the Duty of Restraint whole. Conversely, if the smaller level has an absolute veto, even when demonstrably failing its citizens or creating chaos for neighbors, then the Duty of Restraint smothers the Duty of Assistance. This is why the *machinery* matters more than the slogan. Subsidiarity only breathes when there is a credible way for *someone* – maybe courts, maybe agreed-upon arbitration, maybe clear statutory tests – to say "No, you overstepped" to the level that wants to act, or equally, "No, you *must* step up" when the need is clear and the smaller body is failing. Where we place that referee, how we design that process, that’s where the rubber meets the road. That’s where most real-world outcomes are quietly determined, long before the public debates rage.

  Further complicating our conversations is the fact that we’re often using **two different triggers** for when that higher body *may* step in, without realizing it. One group operates on the **Efficiency Trigger**. They ask: Can this objective – clean water, efficient transit, coordinated dispatch – be achieved *better*, more effectively, more cost-efficiently, at a larger scale? Does the wider perspective or pooled resources offer a demonstrable advantage? This is a practical, output-focused lens. It roughly aligns with how treaties governing bodies like the European Union frame subsidiarity, explicitly asking not just "Can the state do it?" but "Can the state do it *effectively*, or could regions or localities?" – acknowledging layers within layers. It’s a calculus of scale and results.

  The other group operates on the **Dignity Trigger**. They ask: Is the smaller body *truly incapable* of acting at all? Not "would it be harder?" or "less efficient?", but *incapable*? This view stems from a profound belief that empowering the smallest, most human-scale unit possible is fundamentally about respect – respect for the community’s right to self-determination, respect for local knowledge, respect for the dignity of participation. It prioritizes the *process* and the *actor* as much as, sometimes even more than, the *outcome*. Doing things locally isn't just a means to an end; it's an end in itself, fostering civic engagement and responsibility.

  Here’s the kicker: These two triggers – Efficiency and Dignity – will very often point to different conclusions on the same concrete problem. What looks like an obvious efficiency gain to one person looks like an unacceptable erosion of local dignity to another. I suspect our association has spent this year having, in part, a quiet European-vs.-Catholic debate without fully naming it. Recognizing these distinct triggers doesn’t magically solve disagreements, but it helps us understand *why* we disagree so passionately. It helps us see the valid concern behind the opposing argument.

  Finally, we cannot talk about subsidiarity without talking about **fiscal equivalence**. This is a cold, hard, practical anchor. It simply means: the level that *decides* should be the level that *pays*, or at least bears a significant and direct responsibility for raising the revenue. Why? Because if one level gets to make the spending decisions but another level gets stuck with the bill, subsidiarity becomes a dangerous game. It invites irresponsibility. It allows decisions to be made without the full weight of their cost. It creates fertile ground for resentment – the feeling that "they" are spending "our" money. The rural towns raising questions about who bears the ultimate cost for a regional district, who controls the purse strings, are asking a question rooted *deeply* in this principle. It’s a question about accountability, about ensuring that authority and responsibility walk hand-in-hand. Ignoring fiscal equivalence doesn’t make subsidiarity work; it makes it a recipe for distrust and fiscal mismanagement.

  So, where does this leave us? Back in this room, with our very real disagreement. I haven’t come to tell you who’s right about service districts. That’s your work, not mine. What I hope I’ve given you is a sharper lens.

  To those championing regional approaches: Subsidiarity doesn’t give you a blank check. You must rigorously demonstrate why the Duty of Assistance applies. Prove the *genuine incapacity* at the local level, or make the compelling efficiency case. Show how the proposed structure respects the Duty of Restraint wherever possible. And above all, design it with fiscal equivalence baked in – clarity on who decides *and* who pays is non-negotiable. Your argument gains strength when it embraces subsidiarity’s *full* complexity, not just half.

  To those guarding local control: Subsidiarity isn’t just your shield; it’s also a mirror. It demands honesty about what your community can *truly* manage alone, effectively and justly, now and for the future. The Duty of Restraint is sacred, but it doesn’t absolve anyone from the responsibility to find solutions for challenges that spill over borders. Your vigilance is crucial, but so is your engagement in crafting solutions that respect your autonomy *while* addressing shared needs. Fiscal equivalence is your powerful ally – demand it.

  This centennial isn’t just about celebrating the past; it’s about stewarding the future. The principle of subsidiarity, properly understood – with its twin duties, its focus on legitimate authority, its hard questions about who decides and who pays, its recognition of both efficiency and dignity – is not a magic wand. It won’t erase tough choices. But it *can* be our shared language. It can help us argue *with* each other more productively, rather than just *past* each other. It can remind us that both sides are grounded in legitimate parts of a profound idea about how humans best govern themselves: together, but at the right level.

  Let’s not settle for half a principle. Let’s grapple with the whole, difficult, necessary thing. That’s the work worthy of the next hundred years. Thank you.

