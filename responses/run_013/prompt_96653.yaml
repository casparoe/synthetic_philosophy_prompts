answer: |-
  Below is a structured specification of desiderata for a theory of rational choice under unbounded stakes, centered on your four cases. Requirements are categorized by negotiability, conflicts are identified, and the most disruptive requirement is highlighted. The cases drive each criterion directly.

  ---

  ### **Core Cases Motivating Requirements**
  1. **The Mugger**: Tests robustness to *untestable, extreme threats* with no reference class.  
  2. **The Open-Ended Prize**: Tests whether *defined but unbounded positive EU* must dominate all finite options.  
  3. **The Never-Ending Prize**: Tests handling of *infinitely deferred outcomes* where standard EU is undefined.  
  4. **The Queue of Claimants**: Tests *mutually exclusive infinite demands* with no optimal choice.  

  ---

  ### **Desiderata & Motivations**
  | **Requirement** | **Case Motivation** | **Non-Negotiable?** | **Camp Commitment** |
  |-----------------|---------------------|---------------------|---------------------|
  | **1. Agreement with Bounded EU**<br>Matches standard EU for finite, bounded problems. | Baseline coherence; avoids ad-hoc exceptions. | **Yes** (universal) | All camps. |
  | **2. Defined Verdicts or Principled Refusal**<br>Returns a clear choice, set of choices, or justified "no answer" for any decision problem. | Never-Ending Prize (undefined EU); Queue (no best option). | **Yes** (universal) | All camps; refusal must be *justified*, not evasion. |
  | **3. Non-Fanaticism**<br>Ordinary stakes aren't dominated by tiny probabilities of unbounded payoffs. | The Mugger (extortion via low-probability threat); Open-Ended Prize (EU domination). | **Negotiable** | Anti-Pascalian camps; rejected by "EU maximizers at all costs". |
  | **4. Outcome/Scale Invariance**<br>Invariant under outcome-redescription (e.g., units, framing) and affine utility transformations (re-zeroing/rescaling). | Open-Ended Prize (utility scaling affects "unboundedness"); general rationality. | **Yes** (universal) | All camps; core to utility theory. |
  | **5. Tractability**<br>Guidance feasible for bounded agents; no need to enumerate all options or compute infeasible expectations. | The Queue (infinite claimants); Never-Ending Prize (infinite states). | **Negotiable** | Pragmatist/constructivist camps; waived by idealized agents. |
  | **6. Robustness to Exploitation**<br>Agents cannot be systematically exploited by claimants who benefit from compliance (e.g., paying muggers). | The Mugger (incentivizing threats); The Queue (serial extortion). | **Negotiable** | Anti-exploitation camps; waived by pure EU maximizers. |
  | **7. Action-Guidance Without Sincere-Credence Violation**<br>Does not require assigning precise probabilities to events lacking reference classes or utilities to inconceivable outcomes. | The Mugger (no reference class for "cosmic torture"); Open-Ended Prize ("unbounded" utility). | **Negotiable** | Subjectivist/fallibilist camps; waived by objective Bayesians. |

  ---

  ### **Inconsistent Subsets & Key Conflicts**
  - **🛑 Incompatible Triad: Non-Fanaticism + Open-Ended Prize Verdict + EU Agreement**  
    - *Conflict*: Open-Ended Prize demands EU → ∞, forcing fanaticism (prioritizing tiny chances of vast gains). Non-fanaticism forbids this, but EU Agreement requires maximizing EU.  
    - *Resolution*: Requires weakening EU Agreement (e.g., bounded utility), rejecting non-fanaticism, or redefining "verdict" (e.g., lexical priorities).  

  - **🛑 Mugger vs. Queue vs. Robustness**  
    - Paying the Mugger invites imitation (Queue), violating robustness. Ignoring the Mugger risks catastrophe if threats are credible.  
    - *Conflict*: Robustness demands ignoring/extorting Mugger-like cases, but Queue prevents consistent prioritization.  

  - **🛑 Never-Ending Prize vs. Defined Verdicts**  
    - Standard EU is undefined for infinite expectations. A "verdict" requires new mathematics (e.g., non-Archimedean utilities, discounting) or principled refusal.  

  ---

  ### **Most Disruptive Requirement**  
  **Non-Fanaticism** does the most work in ruling out candidate theories:  
  - **Ruled Out**:  
    - Straight EU maximization (fails Mugger/Open-Ended Prize by demanding fanaticism).  
    - Naive probability discounting (arbitrary; violates invariance).  
  - **Forces**:  
    - Bounded utility (solves Mugger/Open-Ended but breaks Never-Ending Prize/Queue).  
    - Epistemic constraints (e.g., refuse ungrounded credences), conflicting with "defined verdicts".  
  - **Impact**: Non-fanaticism is the primary wedge between "pragmatic" and "idealized EU" approaches.  

  ---

  ### **Summary of Tensions**
  - **Non-negotiable core**: Bounded EU agreement, defined verdicts/refusal, invariance.  
  - **Central tension**: Non-fanaticism vs. EU maximization for unbounded goods (Open-Ended Prize).  
  - **Achilles' heel**: The Queue exposes incoherence under mutual exclusivity; no theory satisfies all desiderata here without rationing (e.g., time-discounting) or refusal.  
  - **Key tradeoff**: Robustness and sincere credences require deviations from EU maximization, risking underresponsiveness to legitimate extreme stakes.  

  This framework isolates where theories *must* break from orthodoxy. The Mugger and Queue push toward bounded utilities or epistemic restraints; the Open-Ended and Never-Ending Prizes pull toward reckoning with infinity. No extant solution satisfies all; your specification forces a choice between fanaticism, boundedness, or indeterminacy.
