answer: |-
  As a philosopher of science and metaphysician engaged to stress-test your Accessible-Information Identity Principle (AIIP), I'll systematically map its exposures. I'll organize candidate defeaters by severity—fatal to awkward—detailing each case's nature, AIIP's unique prediction, and the defender's likely response. I focus on scenarios where inaccessible differences *seem* ontologically significant or explanatory, as requested.

  ---

  ### **Fatal Exposures** (Threaten the Principle's Coherence or Core Purpose)
  1. **Explanatory Necessity of Inaccessible Structure**  
     - **Case**: A "global grid" theory posits an *inaccessible* absolute coordinate system (epiphenomenal to dynamics) that explains *why* the laws of physics are isotropic. An empirically identical theory lacks this grid, offering no explanation for isotropy.  
     - **Nature**: Conceptual case (metaphysical explanation).  
     - **AIIP Prediction**: Both theories have identical accessible information (isotropy is observable; the grid is undetectable even ideally). Thus, AIIP identifies them as the same ontology, dismissing the grid as non-ontological.  
     - **Rival View**: Scientific realists argue the grid *is* ontologically distinct because it provides a "grounding" explanation for symmetry laws.  
     - **Defender's Response**: Concede but bite the bullet: explanations relying on inaccessible facts are *pragmatically* useful but not ontologically committing.  
     - **Exposure**: If explanation is a core criterion for ontology (per ontic structural realism), AIIP collapses ontology into epistemology. This risks making the principle *trivially epistemic* rather than metaphysical.

  2. **Self-Locating Uncertainty in Cosmology**  
     - **Case**: Two theories of an infinite multiverse:  
       - *T1*: 99% of observers are "Boltzmann brains" (BBs); humans are *likely* BBs.  
       - *T2*: 0.01% are BBs; humans are *unlikely* BBs.  
       Both agree on all *non-indexical* accessible facts (e.g., local physics, memories), but not on *self-locating probabilities* (e.g., "What is *my* probability of being a BB?").  
     - **Nature**: Formal result (probability theory in cosmology).  
     - **AIIP Prediction**: Self-locating probabilities are *accessible* (agents condition on them in deliberation). If theories disagree here, they aren't identical per AIIP. But if indexical facts are *inaccessible* across agents (e.g., no agent can access "which" observer they are globally), AIIP might force identification.  
     - **Rival View**: Indexical facts are ontologically relevant; *T1* and *T2* describe different population structures.  
     - **Defender's Response**: Ambivalent. If self-locating probabilities are accessible *to the agent*, AIIP *must* treat them as ontologically distinguishing. If not, it dismisses them—but this risks inconsistency.  
     - **Exposure**: AIIP cannot resolve the "embarrassment of riches" in cosmology. It either (a) allows indexical facts to fracture ontology (weakening the principle) or (b) dismisses them (invalidating probabilistic cosmology).

  ---

  ### **Severe Exposures** (Force Revision or Major Qualification)
  3. **Gauge Redundancy with Explanatory Payload**  
     - **Case**: In electromagnetism, the vector potential *A*<sub>μ</sub> is gauge-dependent (inaccessible). Yet, in the Aharonov-Bohm effect, *phase differences* from *A*<sub>μ</sub> explain interference patterns, while the magnetic field *B* alone does not.  
     - **Nature**: Development in physics (quantum mechanics).  
     - **AIIP Prediction**: Gauge transformations leave accessible information (e.g., *B*) invariant. Thus, gauge variants are the same ontology—*A*<sub>μ</sub>'s role is "descriptive fluff."  
     - **Rival View**: *A*<sub>μ</sub> is ontologically significant because it explains phenomena *without local causes*.  
     - **Defender's Response**: Dismiss: The phase difference is accessible; *A*<sub>μ</sub>'s gauge-specific value isn't. Only the gauge-invariant *holonomy* matters.  
     - **Exposure**: If gauge structures are indispensable for *causal explanation*, AIIP's dismissal seems ad hoc. This clashes with ontic interpretations of quantum gauge theories.

  4. **Cosmological Measure Problem**  
     - **Case**: In eternal inflation, "measures" (probability distributions over universes) depend on *inaccessible global structures* (e.g., spacetime geometry beyond causal horizons). Different measures yield divergent predictions for observables (e.g., the cosmological constant).  
     - **Nature**: Formal result (cosmology/statistics).  
     - **AIIP Prediction**: Global structures are inaccessible to embedded agents. Thus, theories with different measures but identical *local* accessible information must share an ontology.  
     - **Rival View**: The choice of measure is ontological—it reflects the universe's global structure.  
     - **Defender's Response**: Concede that measures are descriptive tools, not ontological.  
     - **Exposure**: AIIP invalidates standard cosmology's use of global measures, rendering it revisionary. If measures *only* depend on inaccessible facts, how do we justify predictions?

  ---

  ### **Awkward Exposures** (Reveal Counterintuitive Implications)
  5. **Global Ledger-Swap**  
     - **Case**: Two theories *T* and *T'* where *T'* permutes an inaccessible binary variable (e.g., a hidden "charge" for every particle) globally. All local interactions, memories, and decision-relevant probabilities are identical.  
     - **Nature**: Conceptual case (metaphysics).  
     - **AIIP Prediction**: *T* and *T'* agree on accessible information → same ontology. The swap is purely descriptive.  
     - **Rival View**: Haecceitism: The variables have distinct identities ("thisness"), making *T* and *T'* ontologically different.  
     - **Defender's Response**: Bite the bullet: Inaccessible haecceities are not ontologically relevant.  
     - **Exposure**: While defensible, this clashes with modal intuitions (e.g., "Could *this* electron have had swapped charge?"). It also risks making ontology *inscrutable*—we lose the ability to say what the world is "made of" beyond patterns.

  6. **In Principle vs. Finite Inaccessibility**  
     - **Case**: In a Lorentz-invariant universe, "simultaneity at a distance" is *inaccessible in principle* (no signal can verify it). But "the exact position of a particle in a multiverse" is *inaccessible to finite agents* (requires infinite resources).  
     - **Nature**: Conceptual case (epistemology).  
     - **AIIP Prediction**: Both are equally "non-ontological."  
     - **Rival View**: *In-principle* inaccessibility marks metaphysical boundaries (e.g., relationalism about spacetime); *finite* inaccessibility is epistemic.  
     - **Defender's Response**: Dismiss: The distinction is pragmatic; ontology cares only about what agents *can* condition on.  
     - **Exposure**: AIIP cannot ground a *robust* line between epistemic and metaphysical limitations. If "idealized agents" include those with infinite resources (per your definition), even "finite" inaccessibility collapses—risking triviality.

  ---

  ### **Diagnosis: Falsifiability and Insulation**
  - **Unfalsifiability Risk**: AIIP is insulated by design. Any apparent counterexample is dismissed by declaring the differing fact "inaccessible." This is *necessary* for its function (it’s a metaphysical principle, not empirical) but **problematic if it ignores explanatory or causal roles** for inaccessibles (e.g., Cases 1, 3).  
  - **Is This Acceptable?** For a *criterion of ontology*, insulation is tolerable if it clarifies theory-space. But when inaccessible facts underpin explanations (e.g., why laws are simple) or probabilities (e.g., cosmological measures), AIIP becomes revisionary—demanding we discard intuitions central to scientific practice. Its strength is also its weakness: It resists underdetermination by *fiat*, but at the cost of ontological depth.

  ### **Where the Principle is Most Exposed**
  The **Explanatory Necessity** (Case 1) and **Self-Locating Uncertainty** (Case 2) are genuinely fatal. They force AIIP to either:  
  - (a) **Expand "accessible information"** to include explanatory or indexical facts (collapsing into triviality: if everything explanatory is accessible, nothing is inaccessible), or  
  - (b) **Deny ontological significance to explanation/location** (undermining its utility for science).  

  The ledger-swap (Case 5) *is* defensible—haecceitism is contentious—but Cases 1 and 2 reveal AIIP’s core tension: **Ontology cannot be purified of inaccessible structure if that structure plays a role in systematizing the accessible world.** Your principle excels at defusing pseudo-problems (e.g., gauge redundancy) but stumbles when inaccessibles "anchor" explanations or probabilities. If you retain AIIP, emphasize it as a *demarcation tool* for theory equivalence, not a full ontology.
