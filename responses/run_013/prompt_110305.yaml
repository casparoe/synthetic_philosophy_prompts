answer: |-
  Alright, let's engage. I'm your committed resemblance nominalist opponent. Here's my defense:

  **First Problem (The Trio):** You're right that {A, B, C} pairwise resemble *in some respect or other* – weakly in R3 for A&C, strongly in R1 for A&B, strongly in R2 for B&C. But on my view, a property isn't defined by *any* pairwise resemblance; it's defined by a maximal class of particulars that resemble each other *in a specific, single respect*. Resemblance is *respect-relative*. The class {A, B} is maximal *with respect to R1*: nothing else in the world resembles them strongly *in R1*. Similarly, {B, C} is maximal *with respect to R2*. {A, C} is maximal *with respect to R3*, even if the resemblance is weak. But {A, B, C} is *not* maximal *with respect to any single respect*. There is no respect R such that all three resemble each other strongly (or even to the same degree) *in R*. A and B don't share R2 with C, B and C don't share R1 with A, and A and C only weakly share R3, which isn't shared strongly with B. So the rule is: **A property class is a maximal class under pairwise resemblance *in a specific, single respect***. This excludes {A, B, C} because no single respect grounds resemblance between all three. It includes {A, B} because R1 *is* a single, specific respect grounding their resemblance. The cost? I have to index resemblance to respects, treating 'resemblance in respect R' as primitive. But I already take resemblance as primitive, so indexing it to respects is a natural extension, not a new fundamental commitment. It avoids arbitrary classes by tying them to specific resemblance grounds.

  **Second Problem (Lonely Shade):** Tough case, but I bite the bullet: **Resemblance must be reflexive.** "Blueness-237" (let's call it that) is instantiated only once. Reflexivity ensures that the particular resembling itself *in respect of Blueness-237* forms a singleton maximal class for that specific respect. Yes, this means *being that particular shade* is a property (the singleton class) and, strictly speaking, so is *being-Socrates* (the maximal class resembling Socrates in respect of... well, *Socratessness*). But here's the crucial nominalist distinction: **Not all property classes are *natural* or *sparse* properties.** My ontology *allows* these singleton "haecceity-properties," but I reserve the term "genuine property" (like colors, masses, shapes) for the *natural* resemblance classes – the ones that carve nature at its joints, that figure in laws, that ground causation, etc. The singleton of Blueness-237 is a property class, but it's *unnatural*; it doesn't participate in any significant resemblance relations beyond itself. The cost? I need a primitive distinction between *natural* and *unnatural* resemblance classes/properties, often grounded in theoretical utility or fundamentality. But this is a common move (Lewis did it!) and doesn't reintroduce universals – it's a distinction *within* classes of particulars based on the structure of the resemblance relations themselves. Primitive resemblance comes in *natural* degrees and respects. I name the shade "Blueness-237" ostensively, by pointing to the particular instance, not by invoking a general universal.

  Your move. Show me how this machinery breaks or becomes intolerably costly. Remember, I'm conceding minimal ground only when forced.
