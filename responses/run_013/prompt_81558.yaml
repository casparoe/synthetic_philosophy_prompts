prompt: |-
  I moderate a fairly big online support group for people with a chronic illness — 40k members, six volunteer mods including me, and we're making calls on threads basically every day about whether to step in. We keep having the same fight. Sometimes a thread is a closed loop: everyone's quoting the same one blog post and the same two anecdotes, and nobody in there seems to know that actual doctors disagree with each other about this stuff. Other times it's a thread where people *do* know about the outside disagreement, and the response is that the study was bought, the specialist is a shill, that person was never really sick in the first place. From the mod chair those feel like the same problem, but I'm pretty sure they're not the same thing and probably don't have the same fix. What I need is a procedure my mod team can actually run on a thread — twenty minutes, no philosophy degree — that tells us which of the two we're looking at (or both, or neither), what to do about each, and what to do when they're tangled together. It should give us the questions in order, what counts as a good enough answer to each, where it stops with a "no, leave it", and where it hands the thing to a human because it's a values call and not a factual one. Some constraints: we only remove posts for breaking the rules, never for being wrong, and anything that smells like a medical claim has to go past our one volunteer nurse practitioner before we act on it, so the procedure has to say clearly where that sign-off comes in. It also has to cover the case where the honest answer is to do nothing even though the thread is making my teeth grind, and the case where the problem is something one of us mods pinned to the top ourselves. Give me two or three worked examples, including one where it tells me something I won't like, and be honest at the end about where the procedure definately breaks down and a person just has to decide.
reasoning: |-
  Okay, the user moderates a large online support group for people with a chronic illness. They've got 40k members and six volunteer mods. The main issue is handling threads where there's misinformation or conspiracy theories, but they can't remove posts just for being wrong—only for breaking rules. They need a clear, step-by-step procedure to determine when to intervene and how, without requiring deep philosophical analysis.

  First, I need to understand the two types of problems they mentioned. The first is "closed loops" where members repeat the same limited sources without acknowledging broader medical debate. The second involves active dismissal of external expertise, like accusing doctors of being shills. The user feels these are different but needs a unified process to handle both.

  The constraints are important: no removal for inaccuracy, only rule violations. They have a nurse practitioner who must review medical claims before any action. The procedure must include cases where mods should do nothing despite discomfort, and even when a pinned mod post might be part of the problem. Worked examples are crucial to illustrate the process.

  I should start by outlining the key questions mods need to ask in sequence. The first step is identifying if the thread is a "closed loop" or involves "system rejection." Then, check for rule violations, especially harmful claims that require the nurse's input. The procedure should flag when human judgment is needed, especially when factual and value-based issues are tangled.

  For the workflow, it's essential to have clear yes/no paths. For example, if there's no rule violation, even if the thread is frustrating, they might have to leave it. But if there's harm potential, escalate to the nurse. Also, mods need to check their own contributions—maybe a pinned post is causing unintended effects.

  Worked examples will help. One could be a closed loop with no outside sources, where the conclusion is no action needed. Another where users reject all external evidence, leading to a rule violation check. A third example might involve a mod's pinned post contributing to the problem, requiring unpinning. Including a case where the procedure advises against action despite mod discomfort is important for honesty.

  I also need to address where this process breaks down. Situations with mixed factual/value debates, ambiguous harm potential, or when the nurse's availability is a bottleneck. The user needs to know the limits so they can set realistic expectations.

  Ensuring the procedure is time-efficient (20 mins max) and doesn't require specialized knowledge. Using simple language and clear decision trees will help volunteer mods apply it consistently. Highlighting the "human judgment needed" points upfront will make the process transparent.
answer: |-
  Here's a procedural guide for your mod team, designed to be run in under 20 minutes, focused on classifying the thread type, identifying actionable violations, and integrating your constraints (no removal for wrongness, NP review for medical claims). It prioritizes clarity and actionability over philosophical debate.

  **The Chronic Illness Support Group Thread Assessment Procedure (CISTAP)**

  **Goal:** Determine if a thread requires mod action (removal, locking, warning, escalating to NP, unpinning mod content) or should be left alone, based on observable *conduct* and *rule violations*, not correctness.

  **Core Principles:**
  1.  **Truth is Not the Issue:** We don't arbitrate medical truth. We enforce group rules.
  2.  **Harm is the Trigger:** Action requires evidence of potential harm *or* clear rule violations.
  3.  **NP is the Medical Gatekeeper:** Any action based on the *medical accuracy* of a *specific claim* needs NP review first.
  4.  **Mods Can Be Part of the Problem:** Check our own contributions.
  5.  **"Teeth Grinding" Isn't Enough:** Frustration isn't a rule. Leave threads that are merely unhelpful or repetitive unless rules are broken.

  **The Procedure (Run Sequentially):**

  1.  **Identify the Core Pattern (5 mins):**
      *   **Question:** Is the thread dominated by repeated, unsourced personal anecdotes/blog posts *without* acknowledging broader medical debate exists? (Classic "Closed Loop") OR Is the thread dominated by *dismissing* or *attacking* external sources (studies, professionals, institutions) with accusations like "shill," "bought," "fake," "never really sick"? (Classic "System Rejection") OR A mix? OR Neither?
      *   **Good Enough Answer:** Quick scan of the first 10-20 comments and key replies. Look for repeated URLs/names (Closed Loop) or repeated accusations/dismissals of expertise (System Rejection). If both patterns are strong and intertwined, note "Mixed." If neither dominates, note "Neither - Other Issue?"
      *   **Stop/Handoff:** Proceed regardless. This step just classifies the *presenting* issue.

  2.  **Check for Mod-Created Content (2 mins):**
      *   **Question:** Is a pinned post, mod comment, or highly-upvoted mod-provided resource (guide, FAQ link) a *primary source* being quoted/referenced in the problematic pattern identified in Step 1? Is *our* content potentially contributing to the closed loop or unintentionally fueling distrust?
      *   **Good Enough Answer:** Scan for mod usernames, pins, or known resource links within the repetitive quotes/dismissals.
      *   **Action Trigger:** If YES, unpin/unhighlight *our* content immediately. It doesn't mean the content is wrong, but it's *fueling the unproductive dynamic*. This is a conduct/moderation action, not a truth judgment. Note: "Mod content contributing." Proceed to Step 3.
      *   **Stop/Handoff:** If NO, proceed to Step 3.

  3.  **Assess for Rule Violations (Focus: Harm & Civility) (8 mins):**
      *   **Question A (Harm Potential - Specific Claims):** Are there specific, actionable statements that:
          *   Actively discourage proven, essential treatment (e.g., "Stop all insulin immediately, it's poison")?
          *   Promote dangerous, unfounded alternatives as *curative* with high certainty (e.g., "Drink bleach, it cures [Illness]" vs. "Some find X supplement helpful for fatigue")?
          *   Diagnose others or insist someone *doesn't* have the illness?
          *   Make broad, fear-mongering claims about treatments/professionals *without* citing specific, verifiable misconduct (e.g., "All rheumatologists are paid to harm you" vs. "I had a bad experience with Dr. X at Clinic Y")?
      *   **Good Enough Answer:** Look for direct quotes fitting the above. Focus on certainty, specificity, and the direct call to harmful action/discouragement of essential care.
      *   **Action Trigger:** If YES, **STOP HERE**. Flag these *specific comments* for **NP Review**. Do NOT remove yet. The NP assesses if the *medical claim itself* meets the threshold of potential harm warranting removal under group rules. Mod action (removal/warning) *only* proceeds *after* NP signs off. Document: "Specific Harm Claim -> NP Review Needed."
      *   **Stop/Handoff:** If NO specific harmful claims found, OR if claims are vague/less direct ("Doctors don't know everything," "Big Pharma is corrupt" - generalities), proceed to Question B.
      *   **Question B (Civility/Attacks):** Are there personal attacks, harassment, bullying, or accusations *directed at other group members* (e.g., "You're stupid for trusting doctors," "Only a shill would say that")?
      *   **Good Enough Answer:** Clear violations of group civility rules (insults, name-calling, targeting individuals).
      *   **Action Trigger:** If YES, remove offending comments per standard civility rules. Issue warnings/bans as per protocol. Document: "Civility Violation - Removed/Warned."
      *   **Stop/Handoff:** If NO civility violations, proceed to Step 4.

  4.  **Assess the Dynamic & Potential for Harm (Indirect) (5 mins):**
      *   **Question:** Considering the pattern (Step 1) and the *absence* of specific rule violations (Step 3), is the *overall dynamic* of the thread likely to cause significant harm or derail the group's supportive purpose? Signs:
          *   Is it spiraling into panic/despair?
          *   Is it actively recruiting members into a harmful belief system?
          *   Is it suppressing diverse experiences/voices through dogmatism?
          *   Is it monopolizing the feed, pushing out genuine support requests?
      *   **Good Enough Answer:** This is the hardest step. Requires mod judgment. Err on the side of *leaving it* unless harm feels imminent and demonstrable *beyond* frustration. "Teeth grinding" alone = no. Look for evidence of silencing, panic, or recruitment.
      *   **Action Trigger:** If YES, strong evidence of harmful dynamic: **LOCK THE THREAD** with a *neutral* mod comment ("This discussion has become unproductive/divisive and is being locked to preserve the group's supportive focus"). Do *not* debate the content. Document: "Locked - Harmful Dynamic." If the dynamic stems *mainly* from dismissing external evidence (System Rejection), consider a *general* pinned reminder later about respecting diverse perspectives and sources, *not* targeting this thread.
      *   **Stop/Handoff:** If NO, or evidence is weak/unclear: **LEAVE IT.** Document: "No Action - Frustrating but No Violation/Dynamic Harm." This is often the answer for pure Closed Loops and low-level System Rejection without specific harmful claims or attacks.

  **Worked Examples:**

  1.  **Example 1: Closed Loop (No Action)**
      *   **Step 1:** Thread discusses "Miracle Salt Protocol." 50+ comments referencing the same blog and two users saying "it cured me!" No mention of controversy or alternatives. **Pattern: Closed Loop.**
      *   **Step 2:** No mod content involved. **Proceed.**
      *   **Step 3A:** Comments are "I followed this and feel better!", "Try this protocol!". No *specific* discouragement of essential treatment ("Stop your chemo!"). Claims are hopeful, not absolute commands. **No Specific Harm Claim.** **Proceed.**
      *   **Step 3B:** No personal attacks. **Proceed.**
      *   **Step 4:** Thread is repetitive and ignores broader science, but users are sharing hopeful experiences, not panicking or attacking others. **No Evidence of Harmful Dynamic.** **Action: LEAVE IT.** (Teeth grinding, but no rule broken).

  2.  **Example 2: System Rejection + Harm Claim (Escalate to NP)**
      *   **Step 1:** Thread debating a common FDA-approved drug. Many comments: "The study was funded by Pharma!", "Doctors prescribing this are shills!", "Anyone who takes it is a guinea pig!". **Pattern: System Rejection.**
      *   **Step 2:** No mod content involved. **Proceed.**
      *   **Step 3A:** One highly-upvoted comment states: "STOP TAKING [Drug] IMMEDIATELY! It causes irreversible organ damage, they just hide the data! Switch to [Unproven Supplement] instead." **Specific Harm Claim:** Actively discourages essential treatment with a scary, definitive claim and promotes an alternative. **Action Trigger: FLAG FOR NP REVIEW.** (NP determines if "irreversible organ damage" claim is harmful enough per rules to remove).
      *   **Step 3B:** Comments like "Only idiots trust doctors on this" and "You're a shill if you disagree!" **Civility Violation.** **Action:** Remove these attack comments immediately. Issue warnings.
      *   **Step 4:** (After Step 3 actions). Thread is heated and distrustful. **Potential Harmful Dynamic?** If NP approves removal of the harmful claim and civility violations are cleaned up, *consider* locking if attacks persist or panic is high. Otherwise, might leave it after removals/warnings.

  3.  **Example 3: Mixed + Mod Content Problem (Unpin & Lock)**
      *   **Step 1:** Thread started based on a mod-pinned FAQ about treatment options. Discussion fixates on one controversial treatment mentioned. Some users quote only a single critical blog (Closed Loop), others attack any study showing benefit as "fake pharma science" (System Rejection). **Pattern: Mixed.**
      *   **Step 2:** YES. The pinned mod FAQ is the central source being debated/dogmatized. **Action Trigger:** **UNPIN THE FAQ POST.** (It's fueling the fire, regardless of its accuracy). **Proceed.**
      *   **Step 3A:** Claims like "The FAQ proves [Treatment] is useless!" (misrepresenting the FAQ) and "[Researcher] is a known fraud!". No *specific* call to stop essential treatment. **No Specific Harm Claim.** (Misrepresentation isn't a *harm claim* itself; attacking a researcher isn't *medical advice*). **Proceed.**
      *   **Step 3B:** Comments like "Anyone who believes those fake studies is brainwashed!" directed at other members. **Civility Violation.** **Action:** Remove attacking comments. Issue warnings.
      *   **Step 4:** After unpinning and removing attacks, the thread is still highly polarized, distrustful, and derailed from support. New members asking for help are getting drowned out. **Evidence of Harmful Dynamic:** Silencing, divisiveness, derailing group purpose. **Action Trigger:** **LOCK THE THREAD** with neutral comment.

  **Example Where It Tells You Something You Won't Like (And You Must Comply):**
  *   A thread is full of users passionately advocating for a treatment your NP/medical consensus thinks is useless or potentially harmful, using strong System Rejection language ("All RCTs are rigged!"). However:
      *   No specific harmful claims telling people to stop essential meds.
      *   No direct personal attacks *on other members* (just on "the system" or "pharma").
      *   The dynamic, while frustrating and potentially leading *some* individuals astray, isn't causing visible panic or recruitment *within the thread*.
  *   **CISTAP Outcome:** Step 1 (System Rejection) -> Step 2 (No mod content) -> Step 3A (No Specific Harm Claim) -> Step 3B (No Civility Violation) -> Step 4 (No clear evidence of *imminent* harmful dynamic beyond risk of misinformation). **Action: LEAVE IT.** This sucks, but your rules bind you. Focus on promoting good resources elsewhere.

  **Where the Procedure Definitely Breaks Down (Human Judgment Required):**

  1.  **The "Harmful Dynamic" Threshold (Step 4):** There's no bright line. When does frustration become suppression? When does skepticism become dangerous recruitment? Two mods might reasonably disagree. *Requires team discussion and consensus.*
  2.  **Mixed Fact/Value Debates:** Is an argument about "patient autonomy vs. medical authority" a factual claim needing NP review or a values discussion? (e.g., "Doctors just want to control us!"). CISTAP might struggle to classify. *Requires mod judgment on whether it crosses into medical harm claims or civility violations.*
  3.  **The "Grey Area" Harm Claim:** Does "This drug ruined my life, avoid it!" constitute a harmful discouragement (Step 3A needing NP review) or a personal experience (Step 4, maybe lock if it causes panic)? *Requires mod/NP judgment on specificity and certainty.*
  4.  **The NP Bottleneck:** If NP review is slow, does a clearly dangerous comment stay visible? *Requires a protocol for urgent temporary removal pending review, used VERY sparingly.*
  5.  **When "Leaving It" Feels Like Abdication:** Especially with System Rejection eroding trust. *Requires recognizing CISTAP's limits and focusing on proactive measures (education, positive resource promotion, clear community values statements) outside of thread-by-thread fires.*

  **Key Takeaway for Mods:** CISTAP isn't about fixing misinformation. It's a triage tool to quickly identify *actionable conduct* (violations, demonstrable harm potential) within your constraints, tell you when to escalate to the NP, tell you when to leave frustrating threads alone, and remind you to check your own contributions. The hardest calls (Step 4 harm, grey areas) will always need human discussion. Use the procedure to make those discussions faster and more focused on observable issues, not truth debates.
