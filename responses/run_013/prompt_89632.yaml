prompt: |-
  I got into a stupidly long argument with my friend Dev last night — we're both in a philosophy of medicine seminar that's currently on the naturalism vs. normativism thing — about whether "disease" is a descriptive or an evaluative term, and it's still bugging me this morning. His line was that the usual framing is a false dilemma: either you're a naturalist, where a disease is just statistically subnormal biological functioning and any values come in later when we decide what to do about it, or you're a normativist, where "disease" is a thick evaluative concept through and through. He says that framing smashes together two questions that should be kept apart — whether the *concept* disease carries evaluative content, and whether *classifying some particular condition* as a disease requires value judgments — and that you can answer no to the first and yes to the second. The concept, on his view, is a purely functional/biological one, but the second you apply it you have to pick a reference class and a cutoff, and neither the biology nor the concept tells you which class to use or where the line goes. His example was adult lactose intolerance: perfectly normal if your reference class is "mammals" or "humans before dairying," a deficit if it's "adults in this population eating this diet," and he says there's just no biological fact of the matter about which class is the right one. He calls this the split view and he is extremely pleased with himself about it.

  He also threw in, as if it were obviously the same point, that health isn't simply the absence of disease — that you can have a disease and still be healthy (well-controlled, functioning fine, feels fine) and be unhealthy with no disease at all (sedentary, sleeping four hours, miserable) — and I honestly couldn't tell whether that was a seperate point or just the same point wearing a different hat, or whether it blows up the whole naturalism/normativism debate by showing that health and disease aren't two ends of one scale to begin with.

  So: can you explain, carefully, and without just restating the two textbook positions, whether the split view is actually coherent or whether it quietly collapses? I want to know (a) whether the concept/application distinction does any real work here, or whether "purely biological concept, value-laden application" is just normativism with extra steps; (b) whether the same move survives when the contested bit isn't the reference class or the threshold but the *function* itself — i.e. cases where we can't agree on what a part or process is even for, so that the "subnormal functioning" half of the naturalist story is up for grabs too; and (c) what the strongest reply available to a naturalist is, given that Dev is perfectly happy to concede that no actual classification is value-free. Use a concrete example or two of your own rather than the usual textbook ones, and if you think the split view only holds up by quietly redefining "concept" halfway through, say so and show me where the sleight of hand happens.
reasoning: |-
  Okay, the user is in a philosophy of medicine seminar and had a long argument with their friend Dev about whether "disease" is descriptive or evaluative. Dev proposed a "split view" that separates the concept of disease from its application. The user wants to know if this view is coherent or if it collapses into one of the existing positions. They have three specific questions: (a) if the concept/application distinction holds up or if it's just normativism in disguise, (b) whether this works when the function itself is contested, and (c) what a naturalist's best reply would be.

  First, I need to unpack Dev's split view. He argues that the concept of disease is purely biological (descriptive), but applying it requires value judgments when choosing reference classes and cutoffs. The example given is lactose intolerance—it's a deficit only relative to a specific reference class, like adults in a dairy-consuming society. The user is skeptical about whether this distinction is meaningful.

  For question (a), I should analyze if separating concept from application avoids collapsing into normativism. The key is whether the biological concept itself is value-free. If defining "subnormal functioning" inherently involves normative choices, then the split might not hold. For instance, choosing which biological functions matter (like fertility or pain) could already carry values. Dev's view might be a form of procedural naturalism, where the core is descriptive but application isn't.

  Question (b) is trickier. When the function itself is contested, like in mental health or reproductive issues, the split view struggles. If there's no consensus on what normal function is, then the concept isn't purely biological. For example, is low sexual desire a dysfunction? That depends on societal norms, not just biology. Here, the split view's separation might break down because values are embedded in defining the function.

  For (c), the naturalist's strongest reply could be to argue that reference classes and cutoffs are based on biological norms, not values. They might claim that deviations causing harm are objective, or that evolution sets the standard. But Dev could counter that harm is evaluative, and evolutionary purposes aren't prescriptive. The naturalist might also point to cross-cultural consistencies in disease classification as evidence of objectivity, though exceptions exist.

  The user also mentioned Dev's point about health not being the absence of disease. I need to address whether this is separate or related. Health involves well-being and functionality beyond disease absence, which introduces more normative elements. This might challenge the naturalist view but also complicates the split view by showing that disease is only part of a larger, value-laden health concept.

  I should use concrete examples beyond the usual ones. For contested functions, infertility could be one: in a society valuing procreation, it's a disease, but in one focused on career, maybe not. This shows that defining "function" isn't purely biological. Another example could be obesity—medical vs. cultural perspectives on what's normal or dysfunctional.

  The user might be looking for clarity to resolve their argument with Dev. They might want a solid counterargument or to understand if Dev's view is valid. Their deeper need could be grasping the philosophical underpinnings to apply in their seminar discussions. They might also seek validation of their skepticism towards the split view or a way to reconcile both perspectives.

  I need to ensure my explanation avoids jargon and uses clear examples. Pointing out where the sleight of hand happens, like redefining "concept" to exclude the necessary value judgments in defining functions. Conclude that the split view holds for cases with clear biological functions but collapses when functions are contested, making it closer to normativism in those scenarios.
answer: |-
  Your friend Dev's "split view" is a sophisticated (and increasingly common) attempt to navigate the naturalism/normativism impasse. It's coherent *up to a point*, but its success depends heavily on how we define "purely biological concept" and where we draw the concept/application boundary. Let's break it down using your questions and fresh examples.

  **Core of Dev's Split View:**
  1.  **The Concept (Descriptive):** "Disease" = *statistically subnormal biological functioning of a part or process relative to a species-typical reference class.* This is purely biological/functional.
  2.  **The Application (Value-Laden):** To *classify* a condition as a disease requires choosing:
      *   **The Reference Class:** Which population defines "species-typical"? (e.g., all humans? humans in industrial societies? humans with ancestral diets?)
      *   **The Threshold:** Where on the statistical distribution do we draw the line for "subnormal"? (e.g., 1st percentile? 5th? Where functional impairment *starts* or where it becomes *severe*?)

  Dev argues only the *application* requires value judgments because biology doesn't dictate *which* reference class or threshold is "correct" for labeling something a *disease* (though it can tell us about functional consequences).

  **Addressing Your Questions:**

  **(a) Does the concept/application distinction hold, or is it just normativism in disguise?**

  *   **It *can* hold for clear-cut biological functions:** Take **oxygen-carrying capacity of blood (hemoglobin levels)**.
      *   *Concept:* Subnormal hemoglobin relative to a healthy human reference class = impaired oxygen transport function. This *feels* purely descriptive.
      *   *Application:* Choosing the reference class (healthy adults? healthy adults at sea level? healthy adults at high altitude?) and the threshold for "subnormal" (mild anemia vs. severe anemia) involves values. We value avoiding fatigue, cognitive impairment, and organ damage, so we set thresholds where these risks increase. Calling mild anemia a "disease" vs. just a "risk factor" depends on this valuation.
      *   **Work Done Here:** The distinction isolates *where* values enter. The core *definition* ("impaired oxygen transport") seems value-free. Values determine *when* that impairment gets the socially/practically significant label "disease." This isn't *full* normativism, as normativists often argue "impaired function" itself implies a value judgment about what functions *matter*. Dev pushes that judgment into the application phase.
  *   **The Sleight of Hand:** The potential trick lies in the phrase **"species-typical reference class."** How do we define *this*? Biology tells us *what functions exist* (e.g., kidneys filter blood), but defining the "typical" range *for a healthy organism* often smuggles in a valuation of what constitutes "health" or "proper functioning." Is "typical" just the statistical mode, or is it the *evolutionarily selected range*? If the latter, we're already invoking a normative idea of "design" or "purpose." Dev assumes the "function" itself (e.g., oxygen transport) is uncontroversial and purely biological. **Where this holds, it's more "procedural naturalism" than normativism. Where it breaks, see (b).**

  **(b) Does the split survive when the contested bit is the *function* itself?**

  *   **This is where the split view often collapses.** When we fundamentally disagree on *what the biological part/process is even for*, the "purely biological concept" evaporates. The selection of the *relevant function* is inherently evaluative.
  *   **Example 1: Female Reproductive Aging (Menopause)**
      *   *Contested Function:* What is the "function" of the female reproductive system? Is it solely *continuous fertility throughout adulthood*? Or is it *fertility during peak reproductive years followed by a post-reproductive phase* that may confer evolutionary advantages (e.g., grandmother hypothesis)?
      *   *Split View Challenge:* If we define the concept purely biologically as "subnormal functioning," which function? If we pick "continuous fertility," then menopause is a disease (statistically subnormal after ~50). If we pick "fertility during peak years + post-reproductive survival," then menopause is *normal* functioning for that life stage.
      *   **Collapse:** Biology tells us *what happens* (ovarian function declines). It doesn't definitively tell us the *purpose* or which phase defines "normal function." Choosing which biological narrative defines the "function" is value-laden. Does "health" require perpetual fertility? Or is health compatible with an evolved life cycle phase? This value judgment is embedded *in the concept itself* when defining the benchmark for "subnormality." Dev's split view struggles because the "purely biological concept" requires a prior, contested, evaluative choice about *which biological story constitutes the relevant norm*.
  *   **Example 2: Low Sexual Desire (in the absence of identifiable pathology)**
      *   *Contested Function:* What is the "function" of sexual desire? Is it primarily reproductive drive? Pair bonding? Pleasure? General vitality? Is "high" or "moderate" desire the species-typical norm? How much variation is "normal functioning"?
      *   *Split View Challenge:* Defining "subnormal sexual desire" biologically is impossible without first deciding *what level and kind of desire counts as properly functioning*. Biology shows variation and neurochemical correlates but doesn't set the normative benchmark. Is someone with low distress about low desire "dysfunctional"? That introduces values directly into the functional definition. The decision to pathologize "Hypoactive Sexual Desire Disorder" hinges on contested norms about "healthy" levels of desire and the importance of distress – values baked into the *concept* of the dysfunction itself.
  *   **Conclusion for (b):** When the function itself is contested or socially constructed (common in psychiatry, reproductive health, chronic fatigue), the split view collapses. Defining "subnormal functioning" *requires* an evaluative choice about *which function matters* and *what level constitutes proper function*, making the core concept value-laden. Dev's framework works best for physiologically straightforward systems (like hemoglobin) but fails where the "function" is ambiguous.

  **(c) Strongest Naturalist Reply (Given Dev's Concession on Application)**

  A savvy naturalist, conceding that application requires value judgments (reference class/threshold), would attack Dev's core claim that the *concept* itself is purely descriptive. Their strongest reply focuses on **grounding "function" and "subnormality" biologically without needing value choices:**

  1.  **Evolutionary Function as Objective Baseline:**
      *   **Argument:** "Subnormal biological functioning" isn't arbitrary. It's defined by deviation from the *evolutionarily selected design* for that trait. The function of the heart *is* to pump blood effectively because that's what it was selected for. Menopause isn't a "dysfunction" because it *is* part of the evolved human female life history pattern. Low sexual desire *becomes* dysfunctional only if it falls below the level that would have been selected for reproductive success or pair bonding *in the relevant environment*. Biology *does* provide the "right" reference class (the species under ancestral conditions) and the "right" function (the selected effect).
      *   **Strength:** Provides an objective, non-evaluative standard rooted in natural history. It bypasses statistical norms and modern societal values.
      *   **Dev's Counter:** "Selected effect" is descriptive, but *labeling a deviation as "dysfunctional" or a "disease"* still requires valuing that selected function. Why privilege the ancestral environment? Evolution optimizes for reproduction, not necessarily individual well-being or modern definitions of health. Is sickle cell trait a "disease" in malarial regions? Evolutionary function is complex and often involves trade-offs, making a single "design" hard to define.

  2.  **Harm as a Biological Primitive:**
      *   **Argument:** "Subnormal functioning" isn't just statistical; it's intrinsically linked to *biological harm*. Disease is a state that *reduces survival or reproductive fitness* under typical environmental conditions. Lactose intolerance in a dairy-consuming society objectively reduces fitness (nutrient absorption). Mild anemia objectively reduces energy available for survival/reproduction tasks. The "value" is embedded in the biological reality of reduced fitness, not human preferences.
      *   **Strength:** Grounds the concept in an objective biological consequence (fitness reduction). Values enter only when we decide *which levels of fitness reduction* warrant the "disease" label or intervention.
      *   **Dev's Counter:** "Fitness" is a biological concept, but "harm" as we use it medically often includes things like pain, suffering, and impaired participation in society – which go beyond strict reproductive fitness and *do* involve human values. Is infertility a "disease" for someone who doesn't want children? The naturalist equates "reduced fitness" with "dysfunction," but the medical/social concept of "disease" often decouples from fitness (e.g., highly heritable traits that reduce fitness but aren't diseases, like extreme altruism).

  3.  **Defending the Statistical Norm (with nuance):**
      *   **Argument:** The "species-typical reference class" isn't arbitrary. It's the class that reflects the *functional norm* under conditions where the species evolved. Biology *does* point towards a robust cluster of functional states. Deviations are "subnormal" when they fall outside the range that reliably supports core survival functions (respiration, circulation, metabolism, etc.) without external support. Values only come in when applying this to fuzzy cases or setting intervention thresholds.
      *   **Strength:** Avoids vague evolutionary arguments and focuses on observable, functional interdependence within organisms.
      *   **Dev's Counter:** This still relies on defining "core survival functions," which involves prioritizing some biological processes over others (another potential value judgment). It also struggles with variation (e.g., is myopia "subnormal"? It impairs unaided vision, but glasses restore function easily).

  **Health vs. Disease - Separate Point?**
  Dev's addendum about health and disease not being opposites is **mostly a separate (and important) point**, though it reinforces his core argument.
  *   **Why Separate?** It highlights that "disease" is a specific concept (typically, biological dysfunction) within the broader, multi-dimensional concept of "health" (which includes well-being, functional capacity, adaptation, social participation, feeling well). You can have a *disease* (dysfunction) but be *healthy* overall (well-managed, high functioning, good QoL). You can be *unhealthy* (sedentary, sleep-deprived, miserable) without a specific *disease* (no identified biological dysfunction).
  *   **How it Relates:** It undermines *simplistic* naturalism by showing that "absence of disease" ≠ "health". More crucially, it reinforces Dev's point that applying the *disease* label doesn't automatically tell us everything about the *health* status of a person. It shows that "disease" is just one (important) piece of the health puzzle, and focusing solely on biological dysfunction is inadequate. This doesn't blow up the debate but complicates it usefully, showing why both biological dysfunction *and* values (defining health, well-being, priorities for intervention) are essential.

  **Conclusion:**
  Dev's split view is **coherent and defensible for a subset of medical conditions** where the biological function is unambiguous and the debate is primarily about reference classes and thresholds (like his lactose intolerance example, or mild hypertension). The concept/application distinction does real work here, offering a middle path.

  However, **it quietly collapses into normativism when the contested issue is the definition of the biological "function" itself** (like menopause or contested psychiatric disorders). In these cases, the supposed "purely biological concept" relies on a prior, unacknowledged value judgment about *which biological outcome or purpose defines "proper function."* The sleight of hand happens when Dev assumes "biological function" is a given, value-free starting point – but defining *the relevant function for medical purposes* often requires normative choices.

  The naturalist's strongest reply is to anchor "function" and "subnormality" in evolutionary biology or the concept of biological harm/fitness, arguing these provide objective baselines. Dev can counter that even these rely on implicit valuations (why privilege evolution? is fitness the sole good?) and struggle with real-world complexity and variation.

  Ultimately, Dev's view is likely a form of **"weak naturalism" or "procedural naturalism."** It accepts that the *core logic* of disease identification is finding biological dysfunction, but rigorously acknowledges that *implementing* this logic – choosing functions, reference classes, thresholds – is unavoidably value-laden. It avoids the extremes but shows why medicine is inherently a value-laden practice, even when striving for biological objectivity. Your argument might continue, but Dev has a defensible (though not universally applicable) position.
