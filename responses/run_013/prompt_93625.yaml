prompt: |-
  I'm in a third-year seminar on decision theory and ethics, and we've just spent two weeks on moral uncertainty -- what you're supposed to do when you're not sure which moral theory is right but you definitely still have to act. We went through the usual menu: just maximise expected choiceworthiness, the parliamentary model where each theory gets a share of the vote proportional to your credence, variance voting, the deflationary 'pick your favourite theory and stop agonising' line, and plain maximin. The seminar got pretty heated about which of these actually gives sane answers in a case like 'you're 60/40 between a theory that says X is obligatory and one that says X is forbidden, and there's also a third option that's mildly good under both.'

  For my essay I want to rank them rather than just discuss them. So: could you sort the main proposed procedures for decision-making under moral uncertainty into tiers -- S down to F, or just rank them 1..n -- by how much you'd actually trust each one to tell you what to do in a genuinely hard case? For each, give me a sentence on what it gets right and the particular case where it embarasses itself. And because I don't want to just rehearse the seminar back at my tutor, I've been trying to invent two of my own and I want them ranked too, honestly, even if you think they're junk: (a) 'consensus weighting', where instead of weighting theories by my credence I weight each by how much it agrees with the rest of the field, so outliers get down-weighted; and (b) a minimax-regret rule where the regret is measured in *moral* loss rather than preference loss, i.e. pick the option whose worst-case moral shortfall across theories is smallest. Tell me whether these two are definately new or just the standard procedures in a costume, where they'd land in your ranking, and what the strongest objection to each would be. Last thing: say whether 'rank them' is even a well-posed request here, given that some of these procedures disagree about what counts as a good outcome -- and if it isn't, tell me what I should be doing instead.
reasoning: |-
  Okay, let me unpack this user's query. They're in a third-year seminar on decision theory and ethics, focusing on moral uncertainty. The core request is to rank various decision procedures under moral uncertainty by trustworthiness in hard cases, critique two user-proposed methods, and address meta-questions about ranking feasibility.

  Hmm, the user seems frustrated with seminar debates that lacked resolution - they want synthesis, not just discussion. Their tone suggests they're intellectually ambitious (creating new methods) but wary of regurgitating material. The phrase "genuinely hard case" implies they value real-world applicability over theoretical neatness. 

  First, I need to structure the ranking. The seminar covered: MEC (maximizing expected choiceworthiness), parliamentary model, variance voting, deflationary approach, and maximin. Plus their own proposals: consensus weighting and moral minimax regret. 

  *Mental note*: Before ranking, I should flag that "trustworthiness" is theory-dependent since procedures embody different meta-ethical stances. But the user explicitly asks for this framing, so I'll proceed while noting the tension. 

  For tiering: 
  - MEC goes in S-tier despite its problems (fanaticism, comparability) because it's the only method that systematically accounts for both credence and magnitude. Its failures in extreme cases (e.g., 1% credence on torture) are severe but rare. 
  - Parliamentary and variance voting share A-tier. Parliamentary handles incommensurability better but can be gamed; variance voting avoids fanaticism but overshoots by flattening differences. 
  - Their minimax regret proposal lands in B-tier - it's novel and avoids fanaticism, but moral loss measurement is circular. 
  - Consensus weighting feels C-tier. While psychologically appealing (downweights outliers), it's epistemically dubious - truth isn't democratic. 
  - Deflationary (D-tier) and maximin (F-tier) are too extreme, though defensible in niche contexts. 

  *Pausing*: Are the user's proposals truly new? 
  - Consensus weighting resembles Lehrer-Wagner consensus or peer aggregation, but applying it to moral theories is underexplored. Main objection: conflates truth with conformity. 
  - Moral minimax regret adapts traditional regret to moral uncertainty. Key issue: defining "moral loss" without presupposing a theory. 

  Biggest challenge: The meta-question. Ranking assumes a neutral stance, but these procedures disagree fundamentally about what counts as a "good" outcome. I'll emphasize they're comparing tools, not declaring a winner - and suggest their essay could map methods to contexts (e.g., high-stakes vs. commensurable theories). 

  User's deeper need: They want to transcend the seminar stalemate. My response should help them craft an argument, not just list rankings. Highlighting how each method's flaws illuminate tradeoffs in moral uncertainty itself might satisfy that.
answer: |-
  Here's a tiered ranking of moral uncertainty procedures based on *trustworthiness in genuinely hard cases*, focusing on practical coherence, avoidance of catastrophic error, and philosophical defensibility. I've ranked 8 procedures (5 standard, 2 yours) from S (Most Trustworthy) to F (Least Trustworthy), with a concise assessment for each:

  **Tier Ranking (S to F):**

  1.  **S-Tier: Maximize Expected Choiceworthiness (MEC)**
      *   **Gets Right:** Systematically incorporates both your credence in theories *and* the magnitude of moral value/duty they assign to options. Most rigorous extension of rational choice under uncertainty to morality.
      *   **Embarasses Itself:** When theories assign *incommensurable* or *infinite* values (e.g., 1% credence in a theory saying torture is infinitely bad vs. 99% credence in utilitarianism saying it's mildly good). Prone to "fanaticism" from tiny credences on extreme views.

  2.  **A-Tier: Parliamentary Model / Nash Bargaining / "Franchise" Voting**
      *   **Gets Right:** Elegantly handles incommensurability by letting theories "bargain" proportionally to credence. Avoids MEC's fanaticism and aggregation problems. More robust to diverse value scales.
      *   **Embarasses Itself:** When theories fundamentally disagree on *what counts as a compromise* or in "zero-sum" moral conflicts (e.g., Theory A: Save 1 life = +100, Theory B: Save 1 life = +1; compromise might undervalue saving lives for B). Can be strategically manipulated by option framing.

  3.  **A-Tier: Variance Voting**
      *   **Gets Right:** Mitigates MEC's fanaticism by downweighting theories where options have *high variance* in choiceworthiness (often extreme views). Focuses on options with stable moral support.
      *   **Embarasses Itself:** Can be overly conservative, favoring "meh" options mildly approved by all over options strongly endorsed by some and mildly disapproved by others. May miss the best option if it's polarizing but correct.

  4.  **B-Tier: Your Proposal (b) - Moral Minimax Regret**
      *   **Gets Right:** Directly addresses the fear of catastrophic moral error ("what if I pick X and Theory Y was right, and X was *horrific*?"). Prioritizes avoiding the worst *moral* disasters. Novel application.
      *   **Embarasses Itself:** Requires defining "moral loss" *independently* of the theories being compared (meta-moral stance needed). Can be overly pessimistic, potentially favoring bland options. Calculating regret across incommensurable scales is tricky. **Novelty:** Adapts classic minimax regret to *moral* loss, which is uncommon but not entirely unheard of (similar concerns arise in some discussions). **Strongest Objection:** Defining "moral regret" non-circularly is deeply problematic. How do you measure the "shortfall" of saving 5 lives vs. saving 1 soul without presupposing a moral framework?

  5.  **C-Tier: Your Proposal (a) - Consensus Weighting**
      *   **Gets Right:** Intuitively appealing; reduces the influence of fringe/extreme/marginal theories, promoting stability and coherence. Reflects a "wisdom of the (moral) crowd" instinct.
      *   **Embarasses Itself:** Severely penalizes correct minority views. Truth isn't democratic. Creates path dependence: initial credences heavily influence the "consensus," which then reinforces itself. **Novelty:** Applying consensus/peer weighting to moral *theories* based on inter-theory agreement is a distinct variation. It resembles Lehrer-Wagner consensus or some social epistemology models applied to ethics. **Strongest Objection:** It's epistemically vicious – it explicitly downweights theories *because* they disagree with others, regardless of their truth. If a lone correct theory exists, this guarantees it won't guide the decision.

  6.  **D-Tier: Deflationary Approach (Pick Favorite Theory)**
      *   **Gets Right:** Acknowledges the depth of moral uncertainty and avoids impossible aggregation problems. Stops paralysis. Pragmatic in low-stakes or when one theory dominates credence.
      *   **Embarasses Itself:** Ignores the entirety of your moral uncertainty. If your "favorite" has only 40% credence, you're ignoring a 60% chance you're making a serious moral error. Morally reckless in high-stakes/high-uncertainty cases.

  7.  **F-Tier: Maximin (Moral)**
      *   **Gets Right:** Absolutely guarantees avoiding the single *worst-case* moral catastrophe identified by any theory you give non-zero credence.
      *   **Embarasses Itself:** Paralyzingly conservative. Forces you to choose the option that is least-bad *in its worst possible light*, even if that "worst light" is a theory you give 0.1% credence and the option is otherwise excellent. Leads to absurdly bad outcomes overall.

  **Is "Rank Them" Well-Posed? (The Meta-Question)**

  **No, it's not perfectly well-posed.** The core problem is these procedures often embody fundamentally different *meta-ethical commitments* about what matters under moral uncertainty:

  1.  **Aggregation vs. Non-Aggregation:** MEC, Parliamentary, Variance, Consensus, and arguably Minimax Regret try to *aggregate* moral value across theories. Deflationary and Maximin reject meaningful aggregation.
  2.  **Value Structure:** MEC assumes cardinal, comparable choiceworthiness. Parliamentary assumes ordinal preferences can be bargained. Variance focuses on stability. Minimax Regret needs a loss metric. Consensus needs agreement metrics. Maximin only needs identification of worst-case.
  3.  **Epistemic Goal:** Is it truth-tracking (MEC, optimistically)? Avoiding disaster (Maximin, Minimax Regret)? Reflective equilibrium (Consensus)? Pragmatism (Deflationary)?

  **Ranking them by "trustworthiness" implicitly assumes a standpoint *outside* moral uncertainty** – a meta-view on what constitutes a "good" or "sane" procedure. This meta-view itself will likely favor procedures aligned with its own assumptions (e.g., a consequentialist meta-view might favor MEC, a contractualist one might favor Parliamentary, an epistemic humility view might favor Minimax Regret).

  **What You Should Do Instead for Your Essay:**

  1.  **Explicitly Define Your Meta-Criteria:** Don't hide the ball. State upfront what *you* think makes a good procedure for moral uncertainty (e.g., "Avoids catastrophic error," "Respects credences proportionally," "Handles incommensurability," "Is computationally feasible," "Aligns with reflective equilibrium"). *Then* rank based on *those specific criteria*. This is honest and philosophically rigorous.
  2.  **Map Procedures to Contexts:** Argue that different procedures are best suited to *different types* of moral uncertainty or decision contexts (e.g., MEC for commensurable theories, Parliamentary for incommensurable, Minimax Regret for high-stakes/low-trust, Deflationary for low-stakes/high-confidence). Explain which contexts are most common or important.
  3.  **Focus on Trade-offs:** Analyze the core trade-offs each procedure makes (e.g., MEC: precision vs. fanaticism risk; Parliamentary: robustness vs. bargaining oddities; Minimax Regret: safety vs. pessimism; Consensus: stability vs. truth-tracking; Deflationary: simplicity vs. ignoring uncertainty; Maximin: absolute safety vs. paralysis). Argue which trade-offs are most acceptable.
  4.  **Critique the Very Project:** Discuss whether *any* formal procedure can adequately handle deep moral uncertainty, given the meta-ethical challenges. Is "what should I do?" under moral uncertainty even amenable to a general formal solution?

  By taking approach (1) or (2), your essay moves beyond simply rehearsing the seminar debates and provides a structured, critical evaluation based on clearly articulated principles, acknowledging the inherent complexity of the problem. Good luck!
