  Below is a complete, ready-to-run activity designed to make participants *experience* Goodhart's law through two distinct failure modes. It requires **no prior knowledge of stats/econ**, uses a mundane "widget factory" setting, and emphasizes systemic failure (no villains needed). The debrief explicitly separates your (a) and (b) failure modes.

  ---

  ### **Activity: Widget Factory Challenge**  
  **Time:** 80 mins  
  **Participants:** 18 people (3 teams of 6)  
  **Materials:**  
  - Whiteboard with scoreboard (visible)  
  - Hidden tracker for "true quality" (facilitator only)  
  - 3 sets of colored index cards (red/blue/green for teams)  
  - 1 six-sided die per team  
  - Chocolate/fake currency for prizes  
  - Timer  

  ---

  ### **Game Rules**  
  **Premise:** Teams run widget factories. They’re paid for **"size"** (proxy, visible) but the customer cares about **"true quality"** (hidden goal). The goal is to maximize *size* to earn rewards.  

  #### **1. Production Phase (Per Round)**  
  - Each team picks a **Material Grade** (1–10) for their widgets.  
  - For each widget:  
    - **SIZE (proxy)** = `(Material Grade) × 2` + `d6 roll`  
    *(e.g., Grade 4 + roll 5 → Size = 4×2 + 5 = 13)*  
    - **TRUE QUALITY (goal)** uses this table (facilitator only):  

  | Material Grade | True Quality Formula          |  
  |----------------|-------------------------------|  
  | 1–7            | `Size × 3`                    |  
  | **8–10**       | `(Size × 3) - (Grade × 10)`   |  

    *(e.g., Grade 4 → Size 13 → Quality 39; Grade 9 → Size 23 → Quality 69 - 90 = **-21**)*  

  #### **2. Selection Mechanism (Key for Failure Mode A)**  
  After each round:  
  - **Top 2 teams by average size** → Expand! (Produce **6 widgets** next round).  
  - **Bottom team** → Downgraded (Produce **4 widgets** next round).  
  Teams *lose/gain capacity based on performance*—no voluntary cheating.  

  #### **3. Rounds Structure**  
  - **Round 1 (Baseline):**  
    - All teams produce **5 widgets**.  
    - Teams choose Material Grade (1–10).  
    - Calculate/publicize **average size** per team.  
    - *Facilitator records true quality (hidden)*.  
  - **Round 2 (Selection):**  
    - Production capacity changes based on Round 1 ranks.  
    - Teams pick *new* Material Grade.  
    - Recalculate size/quality.  
  - **Round 3 (Crisis):**  
    - Capacity reallocated again based on Round 2.  
    - Final scoring.  

  ---

  ### **How Failure Modes Are Baked In**  
  - **Failure Mode (a) - Eroded Correlation (No Villain):**  
    The *selection mechanism* (expand/downgrade) changes background conditions:  
    - Top teams get **MORE widgets** → Rushed production → **True quality drops** *even if they use the same Material Grade*.  
    - Example: Grade 5 in Round 1 (no pressure) → Quality 45. Same Grade 5 in Round 2 (expanded) → Quality 35 (simulating rushed work).  
    - **Why it works:** Players don’t control this—it’s systemic. Quality drops without "gaming."  

  - **Failure Mode (b) - Regime Shift (Over-Optimization):**  
    The **Material Grade >7 trap**:  
    - Grades 1–7: Size and Quality correlate (`Size × 3`).  
    - Grades 8–10: Size still increases, but Quality plummets due to `-(Grade × 10)`.  
    - **Why it works:** Teams pushing to Grades 8–10 for higher size *unknowingly enter a regime where more size = negative quality*.  

  ---

  ### **Predictable Issues & Fixes**  
  1. **Problem:** Teams avoid Grades 8–10 (missing Failure Mode B).  
     **Fix:** Incentivize aggression ("Top team wins chocolate!"; remind them size is all that matters). Most teams will push to Grade 8+ by Round 3.  

  2. **Problem:** Noise from dice rolls distracts.  
     **Fix:** Use large teams (6 people → 30+ widgets total). Averages stabilize outliers.  

  3. **Problem:** Teams fixate on "beating the system."  
     **Fix:** Emphasize *production quotas* ("Your job is to meet size targets") to frame actions as diligent, not adversarial.  

  4. **Problem:** True quality seems arbitrary.  
     **Fix:** In debrief, link to real-world parallels (e.g., "Size = publication count; Quality = replicability").  

  ---

  ### **Debrief Script**  
  **(15 mins; name Goodhart’s law HERE)**  
  1. **Reveal hidden true quality scores** and show:  
     - Round 1: Moderate size → Decent quality.  
     - Round 3: High size → Crashing quality (especially Grades 8+).  

  2. **Ask:**  
     - *"Why did quality drop even when teams worked harder?"*  
       → Highlight **Failure Mode (a)**: *Selection* eroded conditions (expansion → rushed work). No malice—just incentives.  
     - *"Why did the highest-size teams have the worst quality?"*  
       → Highlight **Failure Mode (b)**: Pushing Material Grade >7 optimized the proxy *past* its valid regime.  

  3. **Map to Goodhart’s Law:**  
     - **(a)**: "When you select on a proxy (size), you alter the system so the correlation breaks—*even with honest actors*."  
     - **(b)**: "When you optimize a proxy too hard, it stops measuring the goal *by its own logic*."  
     - **Adversarial (if relevant)**: "Sometimes people game metrics—but today, it happened with *no villains*."  

  4. **Key Insight:**  
     - "You weren’t lazy or unethical. You followed the rules diligently. **The system failed you**."  

  ---

  ### **What’s Faked & What to Assert**  
  - **Faked:**  
    The "regime shift" (b) is simplified (Grades 8+ = always bad). Real-world shifts are messier.  
  - **Assert:**  
    - *"In reality, (a) happens through many iterations over time—we compressed it into 3 rounds."*  
    - *"True quality isn’t arbitrary—it represents how proxies (like 'size') decouple from goals under pressure."*  

  ---

  ### **Why This Works**  
  - **Teams feel smart** optimizing size until the reveal.  
  - **Failure Mode (a)** is driven by *systemic selection* (no cheaters).  
  - **Failure Mode (b)** triggers when teams push Material Grade too high (diligent over-optimization).  
  - The mundane "factory" setting avoids ethics debates → Focuses on structure.  

  Run this cold—it’s designed for zero prep. Good luck!
