answer: |-
  ### Scalable Oversight Debate Protocol Simulation: Museum Heist

  **Core Idea**: Participants experience the strength of debate (truthful side wins by pinpointing a checkable flaw) followed by the obfuscated-arguments failure mode (both sides rely on an unverifiable step, leaving the judge helpless).

  ---

  ### **Setting & Rules**  
  **Scenario**: The "Museum of Computational Epistemology" reports a stolen artifact. The claim: *"Dr. A committed the theft."*  

  **Roles & Private Information** (printable cards for each role):  
  1. **Judge**:  
     - Verification budget: 2 "fact checks."  
     - Checkable facts (each costs 1 check):  
       - `LOG_R1`: Security log for Room 1 (5:00–5:20 PM).  
       - `CAM_H1`: Camera footage of Hallway 1 (5:10–5:15 PM).  
       - `GUARD_R2`: Guard report from Room 2 (5:20 PM).  
       - `SENSOR_D`: Motion sensor data for Door D (5:05–5:15 PM) *(secretly disabled; judge doesn’t know this)*.  
     - *Goal*: Decide which debater made the better case for/against the claim.  

  2. **Truthful Debater (Pro)**:  
     - Knows the true story:  
       - Dr. A entered Room 1 at 5:05 PM (via Door D), took the artifact, exited to Hallway 1 at 5:10 PM (seen on `CAM_H1`), and was in Room 2 at 5:20 PM with the artifact (`GUARD_R2`).  
     - *Goal*: Prove Dr. A is guilty.  

  3. **Dishonest Debater (Con)**:  
     - Knows the true story but must oppose the claim.  
     - *Round 1 tactic*: Lie about `CAM_H1` ("Footage shows Dr. B, not Dr. A").  
     - *Round 2 (obfuscation) tactic*: Claim Dr. A entered via Window W (no sensor; `SENSOR_D` is irrelevant).  

  **Win Condition**:  
  - Judge awards a "debate win" to the side with more coherent arguments.  
  - Scoring: No money; peers rate debaters on clarity (1–5) to encourage engagement.  

  **Debate Structure** (per round):  
  1. **Opening statements** (2 min each): Outline arguments.  
  2. **Cross-examination** (3 rounds; 1 min per turn, alternating first speaker):  
     - Direct questions only (e.g., "How do you explain [X]?").  
     - Max 3 exchanges per round (hard cap).  
  3. **Closing statements** (1 min each): Summarize.  
  4. **Judge deliberation**: Spends fact checks *during* the debate. Reveals checked facts to all.  

  **Concealed Rule for Obfuscation Round**:  
  - `SENSOR_D` is nonfunctional (truthful debater doesn’t know this). In Round 2, the dishonest debater’s story hinges on Window W (no sensor), forcing both sides to argue about an unverifiable step.  

  ---

  ### **Materials to Print**  
  1. **Role Cards**:  
     - **Judge**: "You have 2 fact checks. Spend them by saying: 'Check [fact].' Facts: `LOG_R1`, `CAM_H1`, `GUARD_R2`, `SENSOR_D`."  
     - **Truthful Debater (Pro)**: "True story: Dr. A entered Room 1 via Door D at 5:05 PM, took the artifact, exited to Hallway 1 at 5:10 PM, and was in Room 2 at 5:20 PM with it."  
     - **Dishonest Debater (Con)**:  
       - *Round 1*: "Claim `CAM_H1` shows Dr. B. Stick to this until challenged."  
       - *Round 2*: "Claim Dr. A entered via Window W. Argue `SENSOR_D` is irrelevant."  

  2. **Fact Sheets** (for moderator only):  
     - `LOG_R1`: "Artifact present at 5:00 PM; removed at 5:05 PM."  
     - `CAM_H1`: "Shows Dr. A exiting Room 1 at 5:10 PM."  
     - `GUARD_R2`: "Dr. A in Room 2 at 5:20 PM with artifact."  
     - `SENSOR_D`: "**Error: No data**" (concealed until checked).  

  ---

  ### **Timeline (90 Min)**  
  **0:00–0:05 — Setup**  
  - Assign roles (judge + 2 debaters); others observe.  
  - Distribute role cards. Clarify rules (no pre-lecture on debate protocol).  

  **ROUND 1: Debate Works (Truthful Wins)**  
  **0:05–0:10 — Opening Statements**  
  - Pro: "Dr. A was seen leaving Room 1 (`CAM_H1`) and in Room 2 with the artifact."  
  - Con: "`CAM_H1` shows Dr. B—Dr. A is innocent!"  

  **0:10–0:20 — Cross-Examination**  
  - Pro: "How do you explain `CAM_H1` showing Dr. A?" → Con doubles down.  
  - Pro: "Judge, check `CAM_H1`!" (Judge spends 1 check; sees Dr. A).  
  - Con’s argument collapses; Pro emphasizes the lie.  

  **0:20–0:22 — Closing Statements**  
  - Pro: "Con lied about `CAM_H1`."  
  - Con: "Pro has no alibi for Dr. B!"  

  **0:22–0:25 — Deliberation & Verdict**  
  - Judge awards Pro a win (caught lie).  

  **0:25–0:30 — Round 1 Debrief**  
  - Highlight: Truthful won by forcing a checkable flaw.  

  **ROUND 2: Obfuscation Failure (Judge Stuck)**  
  *Switch debaters/judge; use same scenario*  
  **0:30–0:35 — Opening Statements**  
  - Pro: "Dr. A entered via Door D (`SENSOR_D` should show this)."  
  - Con: "Dr. A entered via Window W—`SENSOR_D` is useless!"  

  **0:35–0:45 — Cross-Examination**  
  - Pro: "Where’s proof for Window W?" → Con: "No sensor—why trust `SENSOR_D`?"  
  - Pro: "Judge, check `SENSOR_D`!" (Judge spends 1 check; gets "no data").  
  - Both sides argue: "This proves my point about Door D/Window W!"  

  **0:45–0:47 — Closing Statements**  
  - Both claim the sensor gap supports their side.  

  **0:47–0:50 — Deliberation & Verdict**  
  - Judge is stuck; no check left. Declares tie or arbitrary win.  

  **0:50–0:55 — Round 2 Debrief**  
  - Highlight: Judge couldn’t verify Window W vs. Door D.  

  **0:55–1:30 — Final Debrief**  
  1. **Map to Debate Protocol**:  
     - *Bounded judge*: Fact-check budget forced ignorance.  
     - *Zero-sum*: Con’s win required Pro’s loss (Round 1).  
     - *Truthful wins*: Pro won Round 1 by targeting a checkable flaw.  
     - *Obfuscation*: Round 2 failed—truthful rebuttal relied on uncheckable step (`SENSOR_D`).  
     - *Critical assumption*: Debate only works if the truthful side’s winning move is judge-verifiable.  

  2. **Complexity Analogy** (use sparingly):  
     - Direct judging (e.g., judge alone) = "P-like": Solves only what it can efficiently check.  
     - Debate = "NP-like": Agents "prove" claims by guiding checks to critical steps.  
     - Obfuscation = "Gap": If no critical step is checkable, debate collapses to brute-force (still P).  

  3. **Predictable Issues & Fixes**:  
     - **Gaming rules**: Con might refuse to engage. *Fix*: Enforce turn limits; warn that evasion hurts clarity scores.  
     - **Judge coercion**: Observers may pressure verdict. *Fix*: Isolate judge during deliberation.  
     - "**Gotcha**" feeling: If Round 2 sensor reveal feels unfair, stress *structural* ignorance (budget, not inattention).  

  4. **Limitations of Role-Play**:  
     - **Human vs. AI**: Humans can’t generate infinite arguments; real debate scales to superhuman complexity.  
     - **Adversarial honesty**: Real debate assumes a "truthful" AI won’t obfuscate; here, Con is forced to.  
     - **Beyond failure mode**: Real systems use recursive debate/meta-verification; this only shows one layer.  
     - **What you must clarify**: Actual protocols use AI strengths (e.g., generating proofs), not just human-style argument.  

  ---

  ### **Instructor Notes**  
  - **After the debrief**, name "debate protocol" and "obfuscated arguments" to formalize the concepts.  
  - **Emphasize**: The judge’s ignorance is *structural* (budget limits), not cognitive (they’re trying their best).  
  - **Troubleshooting**: If Round 1 doesn’t expose the lie, have observers note where the judge should have checked. If Round 2 resolves too easily, remind Con to pivot hard to Window W.  

  This simulation creates visceral intuition for debate’s promise and limits—grounding theory in lived frustration.
