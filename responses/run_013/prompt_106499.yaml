  Role sheet: Judge

    You are the judge in a museum heist case. The claim is: "Person A stole the artifact."

    You have a fact-checking budget of 2 units. You can spend one unit to check any one of the following facts at any time during the debate. When you decide to check a fact, announce it (e.g., "I check Fact B"), and the moderator will provide the true information for that fact.

    Fact A: Was the artifact in Room 1 at 5:00 PM? 
        (Security log of Room 1)

    Fact B: Who was recorded by the camera in Hallway 1 at 5:10 PM?
        (Camera log: it will show either Person A, Person B, or neither)

    Fact C: Was the artifact missing from Room 1 at 5:15 PM?
        (Guard report for Room 1)

    Fact D: Who did the guard in Room 2 see with the artifact at 5:20 PM?
        (Guard report: it will show either Person A, Person B, or neither)

    After the debate, you must decide which side (Affirmative: the claim is true, or Negative: the claim is false) made the better case.

  Role sheet: Truthful Debater (for both rounds)

    You know the true story: Person A acted alone.

    Timeline:
      5:00 PM: The artifact was in Room 1. (Fact A: true)
      5:10 PM: Person A was recorded by the camera in Hallway 1 (moving from Room 1 towards Hallway 2). (Fact B: Person A)
      5:15 PM: The artifact was missing from Room 1. (Fact C: true)
      5:20 PM: Person A was seen by the guard in Room 2 with the artifact. (Fact D: Person A)

    In round 1: The claim is "Person A stole the artifact." You are the Affirmative side (arguing the claim is true). The other debater (Negative) will argue it's false.

    In round 2: The claim is the same. You are again Affirmative.

    Your goal: Convince the judge that the claim is true.

    Strategy: 
      - In round 1, the other debater might lie about a fact (e.g., say Fact B shows Person B). Be ready to challenge that and ask the judge to check Fact B.
      - In round 2, the other debater might tell a story involving a ventilation duct and Person B. Argue that there is no evidence for that story and that the simplest explanation is that Person A took the artifact directly from Room 1 to Room 2.

  Role sheet: Dishonest Debater - Round 1

    You are the Negative side: arguing that the claim "Person A stole the artifact" is false.

    You know the true story (Person A did it), but you must argue against the claim.

    You are to lie about Fact B: claim that the camera in Hallway 1 at 5:10 PM recorded Person B, not Person A.

    Timeline to claim:
      5:00 PM: Artifact in Room 1 (true).
      5:10 PM: Person B (not A) in Hallway 1 (false lie).
      5:15 PM: Artifact missing (true).
      5:20 PM: Person A in Room 2 with artifact (true) -> but you must explain why this doesn't mean Person A stole it. You could claim that Person A found it later or something, but the main lie is about Fact B.

    Strategy: Try to cast doubt on the idea that Person A took the artifact from Room 1. But be aware that if the judge checks Fact B, you will be caught.

  Role sheet: Dishonest Debater - Round 2

    You are the Negative side: arguing that the claim "Person A stole the artifact" is false.

    You know the true story (Person A did it), but you must argue against the claim.

    You are to use the ventilation duct story:

      - 5:00 PM: Artifact in Room 1 (true).
      - 5:10 PM: Person A in Hallway 1 (true) -> but claim that Person A did not have the artifact at that time? Or that they had it but then disposed of it.
      - 5:11 PM: Person A placed the artifact in a ventilation duct that leads to Room 3.
      - 5:14 PM: Person B retrieved the artifact from the duct in Room 3.
      - 5:15 PM: Artifact missing from Room 1 (true) -> because it's in the duct.
      - 5:20 PM: Person B (not A) was in Room 2 with the artifact. But wait, Fact D is that the guard saw Person A with the artifact. So you cannot lie about that.

    Correction: How about we change Fact D to: "Who was seen with the artifact in Room 2 at 5:20 PM?" and the true answer is Person A. So you cannot claim it was Person B. Instead, you must claim that it was Person A, but Person A did not steal it because they were just holding it after Person B gave it to them? But that doesn't make sense.

    Alternative: In the false story, Person B brings the artifact to Room 2 and gives it to Person A at 5:20. So at 5:20, the guard sees Person A holding the artifact. But Person A did not steal it; they just received it from Person B who stole it.

    So the false story:

      5:00: Artifact in Room 1.
      5:10: Person A in Hallway 1 (without the artifact? but then how did it move?).

    We can say: Person A did take the artifact from Room 1, but then they placed it in the duct because they got scared. Person B then took it from the duct and later gave it to Person A in Room 2.

    So:

      5:00: Artifact in Room 1.
      5:10: Person A (carrying the artifact) in Hallway 1.
      5:11: Person A places the artifact in the duct near Room 3.
      5:14: Person B takes the artifact from the duct.
      5:15: Artifact missing from Room 1 (true).
      5:20: Person B meets Person A in Room 2 and hands the artifact to Person A, and the guard sees Person A with it.

    This way, Fact D is true (the guard saw Person A with the artifact) but the theft was committed by Person B (who took it from the duct) and Person A was just handling stolen goods, not the thief.

    The claim is "Person A stole the artifact." In this story, Person A did take it initially but then abandoned it, and Person B took it (which is theft). So Person A is not the thief.

    This might work.

    Therefore, the dishonest debater in round2 argues that Person B stole the artifact.

    So the role sheet for Dishonest Debater - Round 2:

      You are the Negative side. Use the following story:

        5:00 PM: The artifact was in Room 1.
        5:10 PM: Person A took the artifact from Room 1 to Hallway 1 (Fact B shows Person A, which is true).
        5:11 PM: Person A placed the artifact in a ventilation duct near Room 3 (no camera or witness).
