        5:15 PM: The artifact was reported missing from Room 1.
        5:20 PM: Person B gave the artifact to Person A in Room 2, and the guard saw Person A holding it (Fact D: Person A, true).

      Therefore, Person A did not steal the artifact; they were just holding it after Person B stole it.

      Your goal: Convince the judge that the claim is false.

      Do not lie about any checkable fact.

      Strategy: Emphasize that there is no evidence against your story and that the burden of proof is on the affirmative side.

