prompt: |-
  Heres a thing about how scientists police theories that I can't square. In physics, submit a paper showing that some model can be tuned to fit data that was already on the table and reviewers will call it curve-fitting or unfalsifiable and bounce it. In the historical sciences — paleontology, geology, a lot of evolutionary biology — you can do more or less exactly that and it's a perfectly respectable paper. Then the same physicists who sneer at curve-fitting insist that any replacement theory reproduce what the old one got right in the limit where it worked, even while telling you the old theory was refuted and is false. So what is the practice assuming? Does it presuppose that a theory earns its keep by risking a prediction that could have failed, rather than by accommodating what's already known, and does the "recover the old results" rule commit them to theories being only locally or approximately true instead of just false? Do those two commitments even fit together, or is one doing all the work while the other is just professional habit? And where is the practice underdetermined — what does it strictly require versus what does it merely sit comfortably with?
reasoning: |-
  Okay, let me try to unpack this user's query. They're pointing out what seems like a double standard between physics and historical sciences regarding how theories are evaluated. In physics, fitting existing data is criticized as curve-fitting, while in historical sciences, it's acceptable. But then physicists also insist that new theories must recover the old ones' successful results. The user is asking about the underlying assumptions and whether these practices are consistent.

  First, I need to recall the key differences between experimental and historical sciences. Physics often relies on controlled experiments and predictions, where falsifiability is crucial. Historical sciences deal with past events, so they focus on retrodiction—explaining existing data. That explains why curve-fitting isn't dismissed in paleontology or geology; they can't run new experiments. 

  The user also brings up the requirement for new theories to recover old ones. This is the correspondence principle in physics. But if the old theory is considered "false," why keep its results? Here, it's about approximative truth. Theories are seen as models that work in certain limits. Newtonian physics isn't false; it's an approximation of relativity in low velocities. So even if replaced, its accurate predictions must be accounted for.

  Now, are these two commitments—falsifiability and correspondence—compatible? The user questions if one is doing all the work. Falsifiability drives theory change, but correspondence ensures continuity. They fit together because science progresses incrementally. New theories must explain why the old one worked where it did, which also makes them more testable. Without correspondence, a new theory might ignore established data, making it less credible.

  The user's deeper concern might be about underdetermination. What's strictly required versus what's habitual? The strict requirement is empirical adequacy: any theory must explain existing data. But practices like preferring falsifiable predictions or demanding correspondence are norms that help avoid ad-hoc explanations. In historical sciences, the lack of predictability is accepted out of necessity, but they still use other criteria like consilience or explanatory scope.

  I should also consider if the user is hinting at a perceived inconsistency in scientific communities. Physicists might not fully grasp historical sciences' constraints, leading to unfair criticism. The response needs to clarify that each field's methods are tailored to their subject matter, but core principles like empirical adequacy and avoiding ad-hoc fixes are universal. 

  Lastly, the user might be interested in the philosophy of science, particularly realism vs. instrumentalism. The requirement to recover old results suggests a belief in approximative truth, not just instrumental success. But this isn't strictly necessary; it's a pragmatic choice to ensure continuity and testability. The answer should highlight that while practices differ, the underlying goal is reliable knowledge through empirical evidence.
answer: |-
  That's a brilliant and incisive dissection of a real tension in scientific practice. You've hit on core philosophical and methodological differences between experimental/hypothetico-deductive sciences (like physics) and historical/explanatory sciences (like paleontology, geology, much of evo bio). Let's break down the assumptions and tensions:

  1.  **The Core Difference: Predictability vs. Explanatory Power**
      *   **Physics (Hypothetico-Deductive Ideal):** The gold standard is **novel prediction**. A theory gains credibility by predicting *new, previously unknown, or unexpected* phenomena *before* they are observed. Fitting existing data is necessary but insufficient – it's seen as potentially ad-hoc ("curve-fitting"). The theory must "stick its neck out" and risk being falsified by future experiments/observations. This is the Popperian legacy (though practiced more pragmatically than Popper's strict falsificationism).
      *   **Historical Sciences (Inference to Best Explanation):** Novel prediction is often impossible. We cannot rerun the Cambrian explosion or recreate the formation of the Grand Canyon experimentally. The goal is to provide the **best explanation** for the complex, singular, and often incomplete record we have *now*. Showing that a model *can* coherently explain the existing, intricate data (fossils, strata, genetic patterns) *is* a significant achievement. It demonstrates **consilience** – the model fits multiple, independent lines of evidence. Avoiding blatant contradiction with well-established data *is* the primary test.

  2.  **The "Recover the Old Theory" Rule: Correspondence Principle & Approximative Truth**
      *   **The Practice:** Physicists demand that Special Relativity reduces to Newtonian Mechanics at low speeds (v << c). Quantum Mechanics must recover Classical Mechanics for large quantum numbers. Any theory of gravity must predict the same planetary orbits as Newton within the solar system's precision.
      *   **The Assumption (Correspondence Principle):** This is less about the *truth* of the old theory and more about **empirical adequacy and continuity**. The old theory demonstrably worked *extremely well* within a specific domain ("locally"). A new, more general theory *must* account for that success. If it doesn't, it fails a crucial test: explaining phenomena we *know* happen.
      *   **The Philosophical Commitment (Approximative/Effective Truth):** This practice strongly implies a view of theories as **locally effective models** rather than globally "True" or "False" in a binary sense. Newtonian mechanics isn't "False" *simpliciter*; it's an incredibly accurate and useful approximation within its domain of applicability (low speeds, weak gravity, macroscopic scales). The new theory reveals the *boundaries* of that domain and provides a more fundamental framework. This is a form of **scientific realism**, but often a *structural* or *model-based* realism, rather than a naive realism about the theory's ontological claims.

  3.  **Do the Two Commitments Fit Together?**
      *   **Yes, but with tension managed by context:**
          *   **Falsifiability drives theory change:** The requirement for novel prediction (or at least the *potential* for falsification) is what pushes science forward and weeds out purely accommodative, unfalsifiable constructs. It creates the *need* for new theories.
          *   **Correspondence ensures continuity and empirical grounding:** The requirement to recover old successes ensures that the new theory isn't just novel but also *responsible*. It anchors the new theory in the vast body of established, reliable knowledge. It prevents radical skepticism that dismisses all past successes.
          *   **The Fit:** Correspondence acts as a powerful *constraint* on new theories generated by the falsification-driven process. A theory that makes novel predictions *and* recovers old successes is vastly more credible than one that only does one or the other. Correspondence is a specific, powerful form of empirical test *using known successes*.
      *   **The Tension:** The sneer at "curve-fitting" (accommodation) in the *development* of new theories clashes somewhat with the *requirement* for accommodation (recovering old results) for *established* successful theories. The key difference is *when* and *how* the accommodation happens:
          *   **Bad Accommodation (Curve-fitting):** Starting with the data and constructing a theory *post-hoc* with numerous adjustable parameters *solely* to fit that specific data set, often lacking independent justification and predictive power beyond it.
          *   **Good Accommodation (Correspondence):** Deriving, as a *necessary consequence* of a more fundamental, independently motivated theory with its *own* novel predictions and testable consequences, the equations and results of the older, successful-but-limited theory *within the domain where it worked*.

  4.  **Where is the Practice Underdetermined? Strict Requirements vs. Comfortable Fits**
      *   **Strictly Required:**
          *   **Empirical Adequacy:** *Any* theory, in any science, must ultimately be compatible with the relevant, well-established empirical data. It cannot simply ignore or contradict robust observations without strong justification (e.g., new data showing the old observations were flawed).
          *   **Non-Contradiction:** A new theory cannot logically contradict well-established core principles *within its own domain* without exceptionally strong evidence (e.g., conservation laws in physics, common descent in biology).
      *   **"Sits Comfortably With" (Normative but Contextual):**
          *   **Novel Prediction (as the *primary* virtue):** Crucial in physics/experimental sciences, less so (and often impossible) in historical sciences. Historical sciences often value **retrodiction** (explaining *past* events inferred from current data) and **consilience** equally or more highly.
          *   **Correspondence Principle:** Deeply ingrained in physics due to its history of successive, domain-specific theories. It's *less* formally demanded in historical sciences, though the principle that new explanations shouldn't contradict well-established *interpretations* of the historical record (e.g., the sequence of strata, the fossil succession) is analogous. A new model of dinosaur evolution shouldn't contradict the robust stratigraphic sequence of dinosaur fossils.
          *   **Approximative Truth:** The correspondence practice *fits* a realist view of theories as approximating reality. However, a strict instrumentalist (theories are just tools for prediction) could *also* demand correspondence because the old tool *worked* for certain jobs, and the new tool must do those jobs at least as well. The practice *doesn't strictly require* realism, but it strongly encourages a model-based or structural realist interpretation.
          *   **Simplicity/Parsimony:** While valued everywhere, its weight varies. Physicists might demand a simpler mathematical formulation even if fitting power is similar. Historical scientists might accept a more complex narrative if it provides a more consilient explanation for messy data.

  **Conclusion:**

  The apparent contradiction resolves when recognizing the different primary epistemic goals: **prediction/control** in experimental sciences vs. **explanation/understanding** of the past in historical sciences. Both value empirical adequacy.

  *   **Falsifiability/Novel Prediction** is the engine of progress in physics, guarding against ad-hoc accommodation ("curve-fitting").
  *   **Correspondence** is the anchor, ensuring that progress builds on past empirical successes, treating old theories as approximately true/effective models within their domains. It prevents revolutionary theories from being *too* revolutionary, discarding known successes.

  The two commitments *do* fit together: Correspondence is a specific, powerful type of empirical test applied to *established successes* that acts as a crucial filter for new theories generated by the falsification-driven process. The sneer at curve-fitting targets *weak accommodation* in theory *development*, while correspondence demands *strong accommodation* of *known empirical success* in theory *replacement*.

  The practice is underdetermined regarding strict realism vs. instrumentalism and the absolute priority of prediction over explanation. What's strictly required is empirical adequacy and non-contradiction. The emphasis on prediction and correspondence are deeply ingrained *norms* in physics that powerfully shape its practice and concepts of progress, reflecting its subject matter and history. Historical sciences, facing different constraints (irreversibility, uniqueness, incomplete records), necessarily develop different, but equally rigorous, norms centered on consilience and explanatory power.
