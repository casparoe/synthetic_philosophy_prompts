  I need to understand the fictional institute's policy framework which is clearly based on Lakatosian concepts of research programmes with a hard core and protective belt. The institute judges programs based on whether they produce novel predictions (progressive) or just accommodate known facts (degenerating). 

  For the Aurelio program in tidal geophysics, I have the hard core: single resonant mode driving patterns, frequency fixed by rotation, and never abandoning these. The protective belt has been patched for various anomalies in ways that didn't predict anything new. 

  The comedy should come from the inherent contradictions: demanding novel predictions by deadline, forbidding belt modifications while requiring proof they weren't ad hoc, and not realizing that rigidly protecting the hard core is counterproductive. I'll include an appeals process with vacuous criteria and mention the rival Halvorsen program as doing better.

  I need to invent some belt revisions beyond what's given: for Marnau anomaly they added a damping term; for Sefridge they widened measurement window; for "quiet fortnight" they accommodated after Halvorsen predicted it. I can add more like adjusting boundary conditions or adding hypothetical particles.

  The document should have standard sections: header with reference codes, effective date, subject program, definitions of key terms, findings of deficiency, required actions with deadlines, consequences, appeals process, signature block, and a final "Disposition" line declaring the program degenerating with the reason.

  For the appeals clause, I'll make it circular - appealing requires demonstrating the program is progressive, which is exactly what's in question. And I'll have the office demand both cessation of belt modifications and proof that recent ones weren't ad hoc - an impossible bind.

  The tone must be perfectly earnest bureaucratic, with no wink to the reader. I'll use dry administrative language throughout, with defined terms in quotes and strict deadlines. The humor emerges from the inherent absurdity of trying to administrate scientific progress through rigid policy.

  Word count needs to be 650-800 words, so I'll balance the sections accordingly. Final line: "Disposition: DEGENERATING due to persistent failure to generate novel predictions and reliance on post-hoc auxiliary adjustments."
answer: |-
  **INSTITUTE FOR GEOPHYSICAL SYNTHESIS**  
  **OFFICE OF RESEARCH INTEGRITY**  
  Ref: RIO/PIP/2024/07  
  Effective Date: 2024-10-27  

  **TO:** Aurelio Tidal Dynamics Research Programme (Programme Lead: Prof. E. Vance)  
  **CC:** Directorate of Geophysics, Finance & Resource Allocation Office, Halvorsen Resonance Programme Lead  
  **FROM:** Dr. A. Finch, Head, Research Integrity Office (RIO)  
  **SUBJECT:** RESEARCH PROGRAMME PERFORMANCE IMPROVEMENT PLAN (PIP) - AURELIO PROGRAMME  

  **1. PURPOSE AND SCOPE**  
  This Research Programme Performance Improvement Plan (PIP) is issued pursuant to Institute Policy RIG-104 ("Appraisal and Maintenance of Research Programmes"). It formally notifies the Aurelio Tidal Dynamics Research Programme ("the Programme") of its designation as Degenerating (as defined in RIG-104, Section 2.3) and outlines mandatory corrective actions, timelines, monitoring procedures, and potential consequences of non-compliance. This PIP supersedes prior informal advisories RIO/ADV/2024/03 and RIO/ADV/2024/05.

  **2. DEFINITIONS**
  *   **Hard Core:** The set of fundamental, irrefutable assumptions defining the Programme's identity (RIG-104, Sec 3.1.a).
  *   **Protective Belt:** The constellation of auxiliary hypotheses surrounding the Hard Core, designed to absorb empirical anomalies and protect the Hard Core (RIG-104, Sec 3.1.b).
  *   **Heuristic:** The strategy guiding the generation of novel auxiliary hypotheses within the Protective Belt (RIG-104, Sec 3.1.c).
  *   **Progressive:** A Programme whose Heuristic successfully predicts *novel facts* not previously known or anticipated by rival programmes (RIG-104, Sec 4.2.a).
  *   **Degenerating:** A Programme whose Heuristic merely generates post-hoc accommodations of known facts or facts already predicted by rivals, without novel prediction (RIG-104, Sec 4.2.b).
  *   **Ad Hoc Adjustment:** A modification to the Protective Belt lacking independent testability or failing to generate novel predictions, serving solely to explain a specific anomaly after its discovery (RIG-104, Sec 4.3).
  *   **Novel Fact:** An empirically verifiable phenomenon, predicted by the Programme's Heuristic *prior* to its observation or confirmation, and not previously predicted by any competing programme (RIG-104, Sec 4.1).

  **3. FINDINGS OF DEFICIENCY (RIG-104 APPRAISAL SUMMARY)**  
  The RIO, in accordance with its mandate under RIG-104, has conducted a quarterly appraisal of the Programme. Based on documented outputs, seminar presentations, and anomaly resolution reports for Q1-Q3 2024, the Programme is assessed as Degenerating. This determination is based on the following:
      3.1. **Persistent Reliance on Post-Hoc Accommodation:** The Programme's recent Protective Belt modifications demonstrate a pattern consistent with Degenerating tendencies:
          *   3.1.1. **Marnau Anomaly Resolution (Ref: AURELIO/ANOM/2024-01):** Introduction of a "non-linear damping term" (Parameter ζ_M) solely to align model outputs with the observed Marnau basin dissipation deficit. This adjustment generated zero novel predictions.
          *   3.1.2. **Sefridge Anomaly Resolution (Ref: AURELIO/ANOM/2024-02):** Post-observation redefinition of the standard temporal measurement window from ±3σ to ±4σ to encompass outlier data points, without prior theoretical justification or predictive utility.
          *   3.1.3. **"Quiet Fortnight" Phenomenon (Ref: AURELIO/ANOM/2024-04):** The Programme's proposed adjustment (invoking transient boundary layer decoupling under specific lunar declination thresholds) was formulated only *after* the phenomenon's confirmation and *after* the rival Halvorsen Resonance Programme had successfully predicted its occurrence and primary characteristics based on multi-modal interaction.
          *   3.1.4. **Grymes Tidal Bore Data (Ref: AURELIO/ANOM/2024-06):** Adjustment of sediment load coupling coefficients (κ_s series) after data acquisition, contradicting the Programme's initial sediment transport auxiliary hypothesis.
      3.2. **Lack of Novel Predictive Output:** The Programme has failed to articulate any testable novel predictions generated by its Heuristic within the last 18 months.
      3.3. **Comparative Benchmark:** The consistent success of the Halvorsen Resonance Programme in generating novel predictions (e.g., the aforementioned "Quiet Fortnight," the predicted phase inversion in the Southern Kelp Tides confirmed Q2 2024) provides a clear benchmark for Progressive heuristic utility as defined by RIG-104.

  **4. REQUIRED CORRECTIVE ACTIONS**  
  To regain Progressive status, the Programme must achieve the following deliverables by the stipulated deadlines. Progress will be monitored via bi-weekly reports (Template RIO-FRM-114 submitted via the RIO Portal) and a formal Mid-PIP Review on 2025-01-15.

      4.1. **Cessation of Unauthorized Belt Modifications:** Effective immediately upon receipt of this PIP, the Programme must cease all modifications to the Protective Belt not explicitly justified by the Programme's documented Heuristic and pre-approved using Form RIO-FRM-105 ("Protective Belt Adjustment Request"). *Compliance Deadline: Ongoing, monitored bi-weekly.*
      4.2. **Demonstration of Non-Ad Hoc Status:** By 2024-12-01, submit a detailed technical report (RIO-RPT-202) demonstrating, with reference to RIG-104 Sec 4.3 criteria, that the adjustments made concerning the Marnau Anomaly (ζ_M), Sefridge Anomaly (window redefinition), and Grymes Tidal Bore (κ_s series) were not Ad Hoc. Evidence must include documented heuristic justification predating the anomaly report and evidence of independent testability/predictive scope beyond the specific anomaly addressed.
      4.3. **Generation of Novel Predictions:** By 2025-02-28, the Programme must generate and formally lodge (using RIO-FRM-110 "Novel Prediction Registry") a minimum of three (3) distinct, empirically testable Novel Facts pertaining to tidal phenomena. These predictions must:
          *   4.3.1. Be derived explicitly from the Programme's Heuristic.
          *   4.3.2. Be articulated with sufficient specificity (predicted value/effect, location, timeframe, margin of error) to permit unambiguous empirical verification.
          *   4.3.3. Pertain to phenomena not previously documented or predicted by any rival programme (notably including the Halvorsen Programme).
      4.4. **Heuristic Revalidation:** By 2025-02-28, submit a revised Programme Charter Appendix (RIO-FRM-101A) explicitly detailing the positive Heuristic guiding future Protective Belt development. This must clearly outline the procedure for generating *new* auxiliary hypotheses *before* encountering anomalies, focused on predicting Novel Facts. *The integrity of the Hard Core (single resonant mode, rotationally fixed frequency, non-abandonment principle) is paramount and must be rigorously defended throughout this process.*

  **5. CONSEQUENCES OF NON-COMPLIANCE**  
  Failure to meet the deadlines and requirements outlined in Section 4 will result in the following escalating consequences:
      5.1. Formal notification of sustained Degenerating status in the Institute Quarterly Research Digest.
      5.2. Mandatory reallocation of 25% of Programme computational resource allocation to the Halvorsen Programme.
      5.3. Freeze on new graduate student admissions to the Programme for the 2025-26 academic year.
      5.4. Initiation of formal review under RIG-104 Section 8 ("Termination of Irredeemably Degenerating Programmes").

  **6. APPEALS PROCEDURE**  
  The Programme Lead may appeal the issuance of this PIP or any subsequent finding of non-compliance within ten (10) working days of the relevant notification. Appeals must be submitted in writing to the Director General (via RIO-FRM-400 "Formal Appeal"), copying the RIO. Grounds for appeal are limited to:
      6.1. Material procedural error in the application of RIG-104.
      6.2. New, significant evidence demonstrating the Programme's Progressive status, unavailable at the time of the PIP issuance or non-compliance finding.
      6.3. Demonstrable error in the RIO's assessment of the Programme's heuristic output against the criteria of Progressive or Degenerating status as defined in RIG-104 Sec 4.2.
  The Director General's decision, based on strict adherence to RIG-104 criteria, is final.

  **7. ACKNOWLEDGEMENT OF RECEIPT**  
  The Programme Lead must sign below and return this page to the RIO within five (5) working days of receipt, confirming understanding of the PIP requirements and consequences.

  _________________________________________  
  **Prof. E. Vance, Programme Lead**  
  Signature & Date

  _________________________________________  
  **Dr. A. Finch, Head, Research Integrity Office**  
  Signature & Date

  ---
  **Disposition:** DEGENERATING due to persistent heuristic output limited to post-hoc anomaly accommodation without generating novel predictions, and documented failure to meet prior Progressive benchmarks.
