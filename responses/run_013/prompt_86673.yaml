  Hi, I'd like you to answer this as a professional philosopher who actually works on epistemology — knowledge, evidence, rationality, that kind of thing — not someone who read a textbook once. Before you answer, please brainstorm quietly first: lay out the different things the argument below could be claiming and where the weak joints are. Then do the audit. I never studied philosophy (dropped out of community college, I drive a van), so keep it in normal words, no jargon I have to go look up.

  My cousin has a philosophy degree and he told me about a puzzle he says is called the dogmatism paradox (I don't know if that's the real name for it). His version, as close as I can remember:

  "If you know something, then you know it's true. And if it's true, then anything that looks like evidence against it must be misleading — it can't be real evidence, because there's nothing there for it to be evidence for. So before you've even seen the study or heard the argument, you already know it's worthless. Which means if you really know something, you'd be a fool to take the other side seriously, let alone change your mind. Knowledge protects itself. That's why the more sure somebody is, the more closed off they get — and it shows knowledge isn't the great thing philosophers make it out to be, because somebody who only believes it but stays open to being wrong is being more rational than the person who knows."

  Something about this bugs me but I can't put my finger on what. Is his version fair? Go through it a claim at a time and tell me: what would a working epistemologist nod along with, what would they wince at or call a distortion, and what's just wrong. Then tell me seperately wether the last part — that this shows knowledge isn't really valuable, and that the open-minded mere believer is more rational than the knower — actually follows from the earlier steps or is being smuggled in. Please don't just hand me the standard textbook resolution of the puzzle; I want to know where his telling of it goes wrong specifically, if it does. And if the puzzle does have a decent resolution, say what it is and how confident you are about it.
