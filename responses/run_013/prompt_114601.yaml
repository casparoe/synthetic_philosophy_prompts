  The wild animal suffering angle is particularly sharp. If we accept that nature is full of suffering, does creating more habitat actually increase net suffering? That would turn the entire offsetting logic upside down. But the current metric seems completely unequipped to handle that question because it operates at an ecosystem level of abstraction.

