prompt: |-
  hey, im a high school student and i run the philosophy club at my school. we just finished a unit my teacher calls "Brains and Morals" and im putting together a practice exam for the end of it so the other kids can self grade before the real thing.

  act like a professional philosopher who writes exam questions for university courses, but dumb it down to an advanced high school level. before you write anything, brainstorm a bit about where kids in my class would actually go wrong, then write the thing. think it through properly, dont just fire off the first version.

  heres what the unit covered so you know what we know. we read a bunch about whether animals have moral status, and about the marginal cases argument (infants and severely cognitively disabled humans, that kind of thing). my teacher gave us a handout with her own ideas on it, three of them:

  - you have to keep two questions apart. the evidence question (what does brain size actually tell you about what a creature can do or feel?) and the status question (does that capacity matter morally, and does it matter how much of it you have?). she calls it a "proxy slide" when someone answers the first question and then just keeps going and pretends they answered the second one.
  - moral status and moral weight are two seperate ledgers. who counts at all, vs how much their interests count when they bump into someone elses.
  - theres a difference between a creature having less of the thing that matters and having a different thing that does the same job.

  also someone in class said "brain size" isnt even one thing, theres absolute size, size compared to body size, that encephalization quotient thing, and apparently how many neurons you have in total vs how many are in the cortex, and elephants are weird on that last one. i might have that garbled, so dont build the whole answer on it.

  so what i need from you:

  1. one essay question, the kind someone could write in 45 minutes, that is NOT answerable by just saying "brain size isnt morally relevant, thats ableist" or by reciting the marginal cases argument. it should force them to use the teachers three ideas, and it should trap someone who thinks that if two creatures have different capacities then you can just line them up and rank them. make it a bit weird and specific, not the obvious question.
  2. a model answer, about 600 words, that a really good student would write.
  3. a marking scheme out of 20 marks. five must hit points with the marks for each, and for each one a one liner on how kids usually mess it up. plus tell me what seperates an A answer from a B answer, like the specific move the A makes that the B doesnt.

  please dont tell me to go find sources or give me a reading list, i cant use the internet for this and i just need the question, the answer, and the rubric. and dont lean on stuff so obscure that only like three professors have ever heard of it. thanks
